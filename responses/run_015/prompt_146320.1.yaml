prompt: |-
  Got a talk in three weeks and I need help prepping the Q&A, badly.

  Setting: half-hour slot at a health law and policy workshop. The room is maybe 25 people. Two disability-studies scholars who've both written against legalisation and who everyone else in the room defers to. A health-law professor who helped draft our assisted-dying statute and is deeply invested in eligibility criteria and safeguards as basically the whole point of the exercise. A palliative-care physician who thinks most requests are untreated symptoms plus fear plus people not being told what's coming. A consultation psychiatrist who does capacity assessments and thinks any single-shot assessment is a fiction. And a health-services researcher who'll want a number for everything. Assume a fairly standard background regime — two physicians, waiting period, roughly a six-month prognosis criterion — I keep the jurisdiction nameless in the talk.

  My thesis, which is deliberately not the usual one: assisted dying shouldn't be grounded in autonomy at all. The real phenomenon, I want to say, is that people ask to die when they have lost confidence that anyone will do anything about their suffering. A request is an appeal. What makes assisted dying the right thing to offer is the failure of the *response*, not the content of the request. So the trigger for eligibility should be documented response-failure — a written plan, attempted, failed, reviewed — not prognosis and not diagnosis.

  Second part, the one I know will get me in trouble: the offer should not have to be patient-initiated. Under current norms the patient has to raise it, which means the people least likely to ask — people who don't want to be a burden, people whose clinicians have already quietly given up on them — are exactly the ones who never hear about it. So I want clinicians required to raise it once response-failure is on the record.

  Three arguments in the talk: (1) the phenomenology of requests — they track abandonment and loss of confidence more than they track pain scores; (2) autonomy arguments can't explain why we restrict this to the terminally ill in the first place — if it's my life my choice, the six-month rule is arbitrary, and yet nobody who argues from autonomy ever proposes repealing it, so autonomy isn't doing the real work; (3) unsolicited *offers* aren't the danger, unsolicited *pressure* is, and the two come apart — this is the argument I'm shakiest on.

  What I want from you: the eight or so objections I'll actually get from this room, not the ones I'd get from a general bioethics audience. Order them by how much damage they'd do. Phrase each one the way that particular person would phrase it — the disability-studies objection should sound like it comes from disability studies, not from a textbook. For each: a reply I can give in about two minutes, and a straight note on where that reply is soft. Tell me what I should concede in the first two minutes rather than have dragged out of me, which single reply has to land or the whole proposal is dead, what I say to the health-services researcher when she asks for data I don't have, and — please — the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep:

  1.  **Analyze the Request:**
      *   **Context:** 30-minute slot, health law/policy workshop, ~25 people.
      *   **Audience:** Specific archetypes (2 Disability Studies scholars [anti-legalization], Health Law Professor [pro-safeguards/drafting], Palliative Care Physician [symptom/fear focus], Consultation Psychiatrist [capacity focus], Health Services Researcher [data focus]).
      *   **Speaker's Thesis:** Assisted dying (AD) shouldn't be grounded in autonomy, but in *response-failure* (suffering + lack of effective care). Eligibility = documented response-failure, not prognosis/diagnosis. Clinicians should be *required* to offer AD once response-failure is documented (unsolicited offer).
      *   **Deliverables:** ~8 specific objections ordered by damage potential, phrased by audience archetype. 2-minute replies for each. Note on where the reply is soft. What to concede early. The one crucial reply that must land. What to say to the researcher about missing data. The question the speaker hopes nobody asks.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Shift from Autonomy to Response-Failure:* This challenges the foundational legal logic of most AD statutes (which are rights-based).
      *   *Removing Prognosis:* This opens the door to non-terminal patients (disabled, chronic illness). This is the biggest flashpoint for Disability Studies scholars.
      *   *Mandatory Offering:* This looks like coercion or a "duty to die" to many. It flips the safeguard model on its head.
      *   *Response-Failure Metric:* Hard to define, hard to measure, subjective.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Disability Studies - The "Duty to Die" / Structural Coercion):* This is the biggest threat. If clinicians *must* offer AD, does it become the default? This aligns with the "anti-legalization" stance of the two scholars.
      *   *Objection 2 (Health Law Prof - The Safeguard/Slippery Slope):* Removing the 6-month prognosis removes the "bright line." Legal certainty vanishes.
      *   *Objection 3 (Palliative Care - The Definition of Suffering):* If suffering is the trigger, isn't that just untreated palliative need? Why kill the patient instead of fixing the care?
      *   *Objection 4 (Psychiatrist - Capacity & Voluntariness):* If the clinician offers it, is the consent truly voluntary? Plus, capacity fluctuates.
      *   *Objection 5 (Disability Studies - The Social Model):* Suffering is often social (poverty, lack of support), not medical. AD medicalizes a social problem.
      *   *Objection 6 (Health Law Prof - Liability/Standard of Care):* If I don't offer, am I liable? If I do, am I coercive?
      *   *Objection 7 (Health Services Researcher - Measurement):* How do you quantify "response failure"?
      *   *Objection 8 (General/Philosophical - The Autonomy Trap):* You say autonomy isn't the ground, but you're expanding access. Isn't that *more* autonomy?

      *Refining the Phrasing:* Need to make them sound like the specific people in the room.
      *   *Disability Scholars:* Use terms like "structural ableism," "expressive harm," "social model."
      *   *Law Prof:* Use "administrative feasibility," "legal certainty," "liability."
      *   *Palliative Doc:* Use "total pain," "refractory symptoms," "therapeutic relationship."
      *   *Psychiatrist:* Use "undue influence," "fluctuating capacity," "therapeutic alliance."
      *   *Researcher:* "Operationalize," "metrics," "variability."

  4.  **Ordering by Damage:**
      1.  Disability Studies (Structural Coercion/Duty to Die) - *Existential threat to the proposal.*
      2.  Palliative Care (Medicalizing Social/Untreated Needs) - *Undermines the "Response Failure" premise.*
      3.  Health Law (Legal Certainty/Prognosis) - *Makes the law unworkable.*
      4.  Psychiatrist (Voluntariness of Unsolicited Offers) - *Ethical killer.*
      5.  Disability Studies (Social Model of Disability) - *Philosophical undercut.*
      6.  Researcher (Data/Metrics) - *Practical blocker.*
      7.  Law Prof (Liability) - *Implementation blocker.*
      8.  Autonomy Contradiction - *Theoretical nitpick, less damaging.*

  5.  **Developing Replies & Soft Spots:**
      *   *Constraint:* 2 minutes spoken is roughly 250-300 words. Keep it tight.
      *   *Soft Spot:* Must acknowledge where the argument is weak (honesty builds credibility).

  6.  **Addressing Specific Prompts:**
      *   *Concessions:* What to give away early to disarm critics? (e.g., admitting the risk of coercion, admitting prognosis is easier to administer).
      *   *The One Reply:* Which one *must* land? The distinction between *offer* and *pressure*. If this fails, the mandatory offer looks like coercion.
      *   *The Researcher:* How to handle missing data? (Pilot studies, qualitative proxies).
      *   *The Feared Question:* What is the nuclear option? Probably about cost/resource allocation (euthanasia as cost-saving).

  7.  **Review and Refine:**
      *   *Tone Check:* Is it respectful but firm? Does it sound like a workshop dialogue?
      *   *Thesis Alignment:* Do the replies support the "Response-Failure" model?
      *   *Specifics:* Ensure the "Disability Studies" objection sounds distinct from the "Palliative Care" one. (DS focuses on social devaluation; Palliative focuses on symptom management).

      *(Self-Correction during drafting)*: I initially thought about putting the Law Prof first. But in this specific room, the two Disability Studies scholars hold the moral high ground ("everyone else defers to them"). If they tear this apart, the room turns. Their objection about the "Duty to Die" resulting from mandatory offers is the most dangerous.

      *(Refining the "Feared Question")*: The prompt asks for "the question I'm hoping nobody asks." Given the "response failure" argument, the feared question is likely: "Is this just a way to stop spending money on difficult patients?" Or, "Who defines 'response failure'—the patient or the payer?" Let's go with the Payer/Resource question.

      *(Refining the "One Reply")*: The prompt asks for "what single reply has to land or the whole proposal is dead." That has to be the distinction between an *offer* and *pressure*. If the room believes a mandatory offer is inherently coercive, the proposal is unethical.

  8.  **Final Polish:** Check word counts and tone. Ensure the "Soft Spot" notes are brutally honest.

      *(Final check on the "Concession")*: The speaker should concede that prognosis *is* a useful proxy, even if imperfect. It disarms the Law Prof. They should also concede that mandatory offering carries risk.

      *(Final check on Researcher)*: Don't bluff. Admit the data gap but propose a framework for collecting it.

      *(Final check on Feared Question)*: Make it about resource allocation. It's the elephant in the room for "response failure."

  9.  **Drafting the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your Q&A battle plan. I have ordered these by the amount of damage they can do to your credibility and the viability of the proposal in this specific room.

  ### The Objections

  **1. The "Duty to Die" Objection (Disability Studies Scholar A)**
  *The Phrasing:* "You're proposing a structural shift from a right to request to a duty to consider. In a healthcare system already rationing resources, a mandatory offer isn't an invitation; it's a signal. If the protocol requires you to offer death when care gets hard, you are institutionalizing the message that some lives are not worth the trouble. You aren't solving abandonment; you're codifying it."
  *The Reply:* "I agree that in a *broken* system, this looks like a duty to die. That is precisely why my proposal ties the offer to *documented response-failure*. You cannot offer the exit until you have proven you tried to fix the suffering. The mandatory offer is not a triage tool; it's a accountability mechanism. It forces the system to admit, 'We have tried everything, and you are still suffering.' If we don't allow the offer, we hide that failure. If we do, we force the system to own the limit of its care."
  *The Soft Spot:* You are assuming the documentation of "response-failure" won't become a box-ticking exercise. If clinicians can fake the plan to get to the offer, the safeguard is gone.

  **2. The "Total Pain" Objection (Palliative Care Physician)**
  *The Phrasing:* "You say requests track abandonment. I say they track untreated total pain—physical, yes, but also existential and social. If you make death the remedy for 'response failure,' you disincentivize the hard work of finding the missing piece of care. You're medicalizing a failure of imagination. Why is the solution to 'we don't know how to help this person' actually 'let's kill them'?"
  *The Reply:* "Because sometimes there is no missing piece. Palliative care operates on the hope that suffering is manageable. My thesis is that for some, it isn't. By making the offer contingent on a *failed plan*, we ensure the 'hard work' has actually been done. But we must acknowledge that 'response failure' is sometimes a factual reality, not a lack of trying. Keeping the option off the table doesn't fix the suffering; it just prolongs it without consent."
  *The Soft Spot:* Defining "response failure" objectively is nearly impossible. One clinician's "failure" is another's "need for more time."

  **3. The "Bright Line" Objection (Health Law Professor)**
  *The Phrasing:* "I drafted the six-month rule. It's arbitrary, yes, but it's administrable. It's a bright line for courts and insurers. You want to replace a prognosis with a narrative of 'failed responses.' That is a litigation nightmare. How does a judge verify a 'failed plan' retrospectively? You're replacing a medical criterion with a subjective moral one. You're inviting chaos."
  *The Reply:* "The six-month rule is a proxy for suffering, but it's a bad one. It excludes people who suffer for years and includes people who don't suffer at all. Yes, my model is harder to administer. But law should track moral reality, not administrative convenience. We audit medical negligence based on 'standard of care' all the time, which is subjective. We can audit response-failure similarly. We trade legal certainty for moral accuracy."
  *The Soft Spot:* You have no model for how this audit works. The Law Prof knows "standard of care" litigation is a mess; you're proposing to import that mess into end-of-life law.

  **4. The "Undue Influence" Objection (Consultation Psychiatrist)**
  *The Phrasing:* "I assess capacity. Capacity is fragile. If a clinician is *required* to raise assisted dying, the power differential explodes. A patient hears 'This is the protocol now' as 'This is what you should do.' You cannot separate the offer from the pressure when the person making the offer holds the keys to the morphine."
  *The Reply:* "Pressure exists now, but it's covert. Clinicians hint, families hint, patients feel they are a burden. My proposal makes the conversation explicit and regulated. An offer is not a recommendation. We can mandate that the offer be accompanied by a continued commitment to care. 'I am required to tell you this is an option, and I am required to tell you I will continue treating you regardless.' We separate the door from the push."
  *The Soft Spot:* In practice, the "continued commitment" often evaporates once the AD conversation starts. You're betting on clinician integrity in a high-stakes moment.

  **5. The "Social Model" Objection (Disability Studies Scholar B)**
  *The Phrasing:* "You frame suffering as medical. But for disabled people, 'response failure' is often 'society failed to accommodate me.' If I can't get out of my house because there's no ramp, that's suffering. If I ask to die because I'm isolated, and you say 'response failure confirmed,' you've treated a civil rights violation as a medical indication for death."
  *The Reply:* "This is the strongest critique, and my model requires a specific safeguard against it. The 'response plan' must include social and environmental interventions, not just medical ones. If the suffering is caused by lack of a ramp, the response failure is the lack of a ramp, not the lack of a lethal prescription. The eligibility trigger requires ruling out social neglect first. We can't fix the ramp? Then the suffering is real, even if the cause is political."
  *The Soft Spot:* Healthcare systems don't pay for ramps. You are asking medical boards to adjudicate social policy failures.

  **6. The "Metric" Objection (Health Services Researcher)**
  *The Phrasing:* "I need to measure risk. With prognosis, I can track survival curves. With 'response failure,' what is my variable? How do I distinguish between a patient who genuinely failed treatment and one whose clinician just didn't like them? Without data, this is anecdote."
  *The Reply:* "You're right, we don't have the numbers yet because we haven't looked for them. But we can operationalize this. We track the 'plan' elements: number of interventions tried, specialist consults, social work involvement. We treat the 'response plan' as a clinical pathway. We can measure adherence to the pathway. It's harder than counting days, but it's more valid than guessing survival."
  *The Soft Spot:* You don't have the data. You are asking them to build the plane while flying it.

  **7. The "Liability" Objection (Health Law Professor - Follow up)**
  *The Phrasing:* "If I don't offer, am I negligent? If I do offer, and they accept, am I liable for coercion? You've created a double-bind for the clinician."
  *The Reply:* "We shield the offer. The law should state that making the offer in accordance with the protocol is not grounds for liability, nor is failing to offer if the criteria aren't met. We treat the offer like informed consent for surgery—a procedural requirement, not a substantive judgment."
  *The Soft Spot:* This requires legislative change. In the current tort environment, your shield might not hold.

  **8. The "Autonomy Contradiction" Objection (General Audience)**
  *The Phrasing:* "You say autonomy isn't the ground. But by expanding eligibility beyond the terminal, aren't you actually giving people *more* autonomy? You're using anti-autonomy rhetoric to push a hyper-autonomy outcome."
  *The Reply:* "No. Autonomy says 'I choose.' My model says 'We failed.' The choice is secondary. The primary event is the system's admission of limit. It shifts the burden from the patient justifying their death to the system justifying its continued care. It's not more autonomy; it's more honesty."
  *The Soft Spot:* Philosophically messy. Most people in the room still believe autonomy is the only legitimate ground for AD.

  ***

  ### Strategic Advice

  **What to Concede in the First Two Minutes**
  Do not wait for them to drag this out of you. In your opening or immediately after the talk, concede two things:
  1.  **Prognosis is administratively superior.** Acknowledge that the 6-month rule is clean, cheap, and easy to audit. You are trading *efficiency* for *justice*. This disarms the Law Prof slightly; you aren't claiming your way is easier, just more right.
  2.  **The risk of coercion is real.** Acknowledge that mandatory offering *could* be abused. This disarms the Psychiatrist and Disability Scholars. You aren't naive; you know the danger, which is why your "response-failure" documentation is so strict.

  **The Single Reply That Must Land**
  **Objection #4 (The Psychiatrist/Undue Influence).**
  If the room believes that a *mandatory offer* is inherently coercive, your proposal is ethically dead. You must convince them that **silence is also a form of pressure.**
  *Key phrase to use:* "Currently, the patient must break the taboo. That requires energy they don't have. That is pressure. My model distributes the burden of the conversation to the system. An offer is not a push; it is a removal of the lock on the door."
  If they don't buy that an offer can be neutral, the "Duty to Die" argument wins.

  **What to Say to the Health Services Researcher**
  Do not bluff.
  *Say:* "I don't have the numbers. This is a conceptual framework, not a retrospective analysis. The 'response failure' metric doesn't exist in current EMRs. I am proposing we build it. If you're interested, the pilot study would be coding existing 'futile care' conversations for response-plan elements. I need your help to design that variable."
  *Why:* It turns her from a critic into a collaborator.

  **The Question You Hope Nobody Asks**
  *"Who pays for the response plan?"*
  *Why it's deadly:* Your model requires extensive, documented attempts to alleviate suffering before AD is eligible. This is expensive. It requires time, social work, palliative consults, and home care.
  *The Trap:* If you say "the system," the Health Services Researcher and Law Prof will ask, "Is this just a cost-shifting mechanism to avoid long-term care costs?"
  *If asked:* You must answer that the cost of the plan is the cost of ethical legitimacy. "If we cannot afford to verify that we tried to help, we cannot afford to offer death." (This is a risky moral gamble, but it's the only honest answer).
