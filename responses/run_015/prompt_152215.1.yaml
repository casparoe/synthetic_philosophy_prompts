answer: |-
  Your roommate is describing a real and active area of philosophy called **normative uncertainty** (or moral uncertainty), specifically a model known as **Maximizing Expected Choice-Worthiness (MEC)**. The most prominent work on this comes from philosopher William MacAskill (in his thesis and book *Normative Uncertainty*).

  However, while your roommate has captured the *spirit* of the view (treating moral theories like hypotheses and "hedging your bets"), his specific mathematical and logical claims range from oversimplified to incoherent.

  Here is a piece-by-piece breakdown of what a philosopher working on this would accept, what they would wince at, and what is simply confused.

  ---

  ### 1. The Basic Framework: Credences and Expected Value
  > **Roommate:** *"If you're unsure whether you're a utilitarian or a deontologist, you just assign credences and do expected value calculus across theories."*

  *   **Philosophers Accept:** This is the standard starting point for MEC. If you are 60% confident in Theory A and 40% confident in Theory B, you should act to maximize the expected value weighted by those credences. It treats normative uncertainty similarly to empirical uncertainty (e.g., "I'm 60% sure it will rain, so I'll bring an umbrella").
  *   **Philosophers Wince:** The word "just." This glosses over the **Intertheoretic Comparison Problem**. Utilitarianism measures value in "utils" (welfare units); Deontology measures value in "duties fulfilled" or "rights respected." There is no obvious exchange rate between them. Is violating one right equal to losing 10 utils? 1,000? Without a way to normalize the scales of different theories, the calculus cannot begin.

  ### 2. The Infinity Problem
  > **Roommate:** *"So if you're 60% deontologist, killing one innocent person is 60% infinitely wrong..."*

  *   **Philosophers Wince (Hard):** This is the biggest technical error in the summary.
  *   **Why it's confused:** In standard mathematics, $0.6 \times \infty = \infty$. If deontology holds that killing an innocent person is *infinitely* wrong (or lexically prior to all other goods), then the expected value of that action is negative infinity, regardless of your credence.
  *   **The Consequence:** If you treat deontological constraints as infinite, you can never justify violating them, even with 1% credence. This leads to a "Pascal's Wager" for deontology: any non-zero credence in an absolute constraint dominates the calculation.
  *   **The Fix:** To make the math work, proponents of MEC usually argue you must **truncate** the values. You have to treat the deontological prohibition as a *very large finite number* (e.g., -1,000,000 points) rather than infinity, so it can be weighed against utilitarian gains. Your roommate's summary ignores this crucial step.

  ### 3. The "1.67 People" Break-Even Point
  > **Roommate:** *"...and 40% okay if it saves five lives. Then you solve for the break-even point and it turns out you should only kill if you save more than 1.67 people per death..."*

  *   **Philosophers Wince:** This math assumes a specific, unjustified conversion rate between the theories.
  *   **Why it's confused:** The number 1.67 comes from $1 / 0.6$. This implies the roommate is assuming that, *within the calculus*, the "cost" of killing is 1 unit for both theories, but the deontologist weighs it 100% and the utilitarian weighs it 0%.
      *   But Utilitarianism doesn't say killing is "okay"; it says killing is *negative utility* offset by *positive utility*.
      *   To get 1.67, you have to assume the Deontological "wrongness" of killing is exactly equivalent to the Utilitarian "wrongness" of killing one person, but that the Utilitarian allows trading.
  *   **The Reality:** Because of the **Intertheoretic Comparison Problem** mentioned above, there is no objective way to derive "1.67." It depends entirely on how you decide to normalize the scales. If you decide a deontological violation is worth -1,000,000 utils, you might need to save 400,000 people to break even. The specific number is arbitrary without a defined exchange rate.

  ### 4. Wrong on Every Theory (The Dominance Principle)
  > **Roommate:** *"He also said this means you might have to do things that are wrong on every theory you consider..."*

  *   **Philosophers Reject:** This violates a fundamental rationality constraint called the **Dominance Principle** (or Pareto Principle).
  *   **The Logic:** If Theory A says Action X is worse than Action Y, and Theory B says Action X is worse than Action Y, then Action X is *dominated*. No amount of credence weighting should make you choose X.
  *   **Why it's confused:** Expected Value is a weighted average. If Theory A assigns X a value of -5 and Theory B assigns X a value of -10, the weighted average *must* be negative. It cannot be positive. You cannot average two negatives and get a positive.
  *   **Nuance:** There are edge cases in normative uncertainty where you might choose an action that is *sub-optimal* on all theories (because it's the "least bad" compromise), but claiming an action is *wrong* (negative value) on all theories yet *recommended* (positive expectation) is mathematically impossible under MEC.

  ### 5. The Small Lie Example
  > **Roommate:** *"...like telling a small lie that is mildly bad on utilitarianism but severely forbidden on deontology, because the expectation comes out positive."*

  *   **Philosophers Reject:** As above, this is mathematically incoherent based on the description given.
  *   **The Math:**
      *   Utilitarianism: Lie = Mildly Bad (e.g., -5 utility).
      *   Deontology: Lie = Severely Forbidden (e.g., -1,000 deontic units).
      *   Calculation: $(0.4 \times -5) + (0.6 \times -1000) = \text{Huge Negative Number}$.
      *   **Result:** The expectation is negative. You should not lie.
  *   **Where the confusion likely lies:** Your roommate likely garbled a different scenario. The standard "hedging" example is usually:
      *   Utilitarianism: Lie is **Good** (+10 utility, saves feelings).
      *   Deontology: Lie is **Bad** (-1,000 units, violates duty).
      *   *Even then*, unless you normalize the scales so the Utilitarian gain outweighs the Deontological cost (weighted by credence), the Deontological constraint usually wins.
      *   If your roommate insists the Utilitarian view also says the lie is *bad*, then his conclusion that the expectation is *positive* is simply false.

  ### Summary Verdict

  *   **Fairness:** The summary captures the *motivation* of normative uncertainty (don't be dogmatic, hedge your bets) but fails on the *mechanics*.
  *   **The "Infinity" Error:** Multiplying infinity by a percentage is a category error that breaks the model. Philosophers solve this by finite normalization, which your roommate didn't mention.
  *   **The "Dominance" Error:** Claiming you should do something both theories deem "wrong" is a violation of basic decision theory.
  *   **The "1.67" Error:** This implies a precise exchange rate between moral theories that does not exist without arbitrary stipulation.

  **How to respond to your roommate:**
  Tell him he's describing **Maximizing Expected Choice-Worthiness**, but he needs to read MacAskill. Point out that if deontology says killing is *infinitely* wrong, his 60% credence still results in *infinite* expected wrongness. And ask him to show the math on how two negative values (bad on utilitarianism + bad on deontology) sum to a positive expectation.
