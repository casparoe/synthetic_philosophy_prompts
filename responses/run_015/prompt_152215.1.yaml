          *   **Verdict:** Acceptable simplification, but glosses over the "intertheoretic comparison" problem.

      *   *Claim 2: "So if you're 60% deontologist, killing one innocent person is 60% infinitely wrong..."*
          *   **Status:** **Major Red Flag.**
          *   **Problem:** Multiplying infinity by a fraction. $0.6 \times \infty = \infty$.
          *   **Philosophical Issue:** Deontology often posits *constraints* or *rights* that are absolute (lexically prior). If an action is forbidden *simpliciter*, expected value calculations break down unless you normalize the scales.
          *   **Verdict:** Confused/Technically incoherent. This is the "infinite utility" problem in normative uncertainty.

      *   *Claim 3: "...and 40% okay if it saves five lives. Then you solve for the break-even point and it turns out you should only kill if you save more than 1.67 people per death..."*
          *   **Status:** Mathematically suspect based on Claim 2.
          *   **Problem:** If deontology says "killing is infinitely wrong," the expected value is $-\infty$. No amount of utilitarian gain offsets $-\infty$.
          *   **How to fix:** You need to *normalize* the theories. Make deontological "wrongness" finite (e.g., -1000 units) to compare with utilitarian units.
          *   **The 1.67 Math:** Where does 1.67 come from? $1 / 0.6 = 1.666...$? This implies the deontologist says "Killing = -1" and Utilitarian says "Killing = -1, Saving = +1". This assumes a specific scaling that isn't justified.
          *   **Verdict:** Confused. Assumes intertheoretic comparability without establishing a conversion rate.

      *   *Claim 4: "He also said this means you might have to do things that are wrong on every theory you consider..."*
          *   **Status:** Counter-intuitive, requires specific conditions.
          *   **Philosophical Concept:** This sounds like a violation of *Dominance*. If Action A is worse than Action B on Theory 1 AND worse on Theory 2, MEC shouldn't recommend A.
          *   **Exception:** This can happen if the *magnitude* of wrongness varies wildly and credences shift the weighted average, *but* usually, MEC respects Pareto/Dominance principles.
          *   **Specific Scenario:** "Small lie mildly bad on utilitarianism but severely forbidden on deontology."
              *   Util: Lie = -1 utility. Truth = 0.
              *   Deon: Lie = -1000 deontic units. Truth = 0.
              *   If I'm 99% Util, 1% Deon: Exp(Lie) = $-0.99 - 10 = -10.99$. Exp(Truth) = 0.
