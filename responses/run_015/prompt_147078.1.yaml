answer: |-
  We gather here not to bury the work of this centre, but to celebrate how it changed both those who were treated and those who did the treating. It is fitting that friends, family, and scholars stand together, for the science we practised was always about human connection.

  My mentor taught us that when we name a struggle, we do not simply label a static illness hidden inside the brain. Instead, that name changes the person living it, altering their path in ways we must respect.

  Yet she pushed us further, insisting that this change curls back to touch the clinician's own conscience. Every time we classified a patient, we were silently reclassifying our own moral standing as healers.

  This was never about dismissing pain as mere words, nor was it about reducing life to cold biology. It was about acknowledging that our care shapes us just as surely as it shapes those we seek to help.

  So let us carry forward her belief that science is a mirror held up to both sides of the consulting room. In honouring her legacy, we commit to remaining humble enough to let our patients change us too.
