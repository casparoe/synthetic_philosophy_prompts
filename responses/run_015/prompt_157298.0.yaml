answer: |-
  Your working hypothesis is not a cop-out; it is the most accurate diagnosis of the situation. You are not inventing divisions to avoid the conflict; you have identified that the conflict exists *because* of those divisions. The reason the debate has stalled since the 1950s is not that one side is wrong, but that the term "scientific model" is doing double duty for two distinct cognitive technologies.

  Here is the diagnosis of the impasse, broken down by the specific friction points you raised.

  ### 1. The Category Error: Prediction vs. Explanation
  You asked if the sides are divided by standards of evidence. Yes, but deeper than that: they are divided by the **functional goal** of the model.

  *   **The Instrumentalist (Friedman) Goal:** Compression and Forecasting. The model is a tool to map inputs to outputs. If the map gets you to the destination, the terrain doesn't need to match the paper.
  *   **The Realist (Philosopher) Goal:** Intervention and Understanding. The model is a schematic of the machine. If you want to fix the engine or change its speed, you need to know where the gears are, not just when the car moves.

  The impasse persists because both sides claim the title of "Explanation." Friedman argues that successful prediction *is* the only meaningful form of explanation in social science (because we can't open the black box). Philosophers argue that prediction without mechanism is merely *description* disguised as explanation. Progress is conceptually possible only if we stop treating "explanation" as a monolith and admit that **predictive accuracy and causal transparency are often trade-offs, not correlates.**

  ### 2. The Hidden Empirical Claim
  You asked if there is a hidden empirical claim about which models actually predict well. This is the critical, often overlooked hinge of the debate.

  Friedman's position relies on a hidden empirical bet: **that the underlying structure of the economy is stable enough that false assumptions won't lead to systematic predictive failure.** He assumes that agents behave *as if* they are rational maximizers consistently enough that the error cancels out.

  The critics' position relies on the counter-bet: **that the system is reactive.** If you base policy on a model with false assumptions, agents will adapt to the policy, the structural relationships will shift, and the model will break. (This is the core insight later formalized as the Lucas Critique).

  So, the debate isn't purely philosophical; it is an empirical disagreement about the **counterfactual stability** of the domain. In physics, false assumptions (frictionless planes) work because gravity doesn't change based on the model. In economics, false assumptions often fail because human behavior changes based on the model. The impasse exists because economists want the predictive reliability of physics while operating in a reactive system that demands the causal realism of biology or sociology.

  ### 3. The Verbal Trap: "Unrealistic"
  You wondered if "unrealistic" means something different to each group. It does.

  *   **To the Economist:** "Unrealistic" means **isolated**. It is a deliberate abstraction to hold ceteris paribus. It is a feature, not a bug. It means "I am ignoring noise to find the signal."
  *   **To the Philosopher:** "Unrealistic" means **false**. It is an existential claim that contradicts known facts. It means "The premise is factually incorrect."

  When an economist says, "Assumptions don't need to be realistic," they mean, "We don't need to model every variable." When a philosopher hears this, they hear, "Truth doesn't matter." The conversation fails because one side is talking about **parsimony** and the other is talking about **veracity**.

  ### 4. Can Anything End This?
  You asked if a formal result or conceptual split could resolve the impasse.

  *   **Formal Results:** No. Logic already allows false premises to yield true conclusions. You cannot prove mathematically that false assumptions *must* fail, because sometimes they work by accident or due to compensating errors.
  *   **Field-Specificity:** Yes. The question is permanently unresolvable at the *general* level of "Science." It must be resolved at the level of **domain**. In domains with stable laws (celestial mechanics), instrumentalism is highly effective. In domains with adaptive agents (macroeconomics), instrumentalism is dangerous. The debate stalls because participants try to apply a universal philosophy of science to specific methodological problems.
  *   **Conceptual Split:** This is the only path to progress. If the field explicitly distinguishes between **Phenomenological Models** (for forecasting, where Friedman is right) and **Structural Models** (for policy design, where the critics are right), the tension dissolves.

  ### The Verdict
  You are not stuck because you are missing a key text; you are stuck because the seminar is likely treating a pragmatic choice as a truth claim.

  Progress is conceptually possible, but it requires abandoning the hope for a unified theory of "The Scientific Model." The sides are talking past each other because they are optimizing for different utilities. The economist asks, "Does it work?" The philosopher asks, "Do we know why?"

  The impasse will only break when you stop asking "Is Friedman right?" and start asking "Is this model being used for navigation or for engineering?" If the goal is navigation (prediction), the F-twist holds. If the goal is engineering (policy intervention), the F-twist is a liability. Recognizing that these are two different jobs is the only way to move past the debate.
