prompt: |-
  I want you to construct a philosophical thought experiment tailored to the debate over the moral status of video-game characters. The scenario should be engineered so that two opposing stances—call them virtual moral realism and virtual moral anti-realism—agree completely on the non-moral facts but deliver opposite verdicts on whether the player acts wrongly in permanently deleting a specific non-player character. The disagreement must hinge specifically on whether the character exhibits what I will call counterfactual persistence: the property of continuing to develop narrative and relational states within the game world during periods when the player is not interacting with it, rather than on sentience, capacity for suffering, or the player's emotional investment. Constraints: set the case within an ordinary open-world role-playing game with no science-fiction framing; keep the narrative description to a single paragraph; do not invoke named philosophical texts, authors, or technical jargon beyond the term defined above; and ensure that the wrongness, if present, is not reducible to harm done to other human players or to the player's own character development. Once the scenario is presented, walk through the reasoning that leads each stance to its verdict, isolate the precise structural feature that does the explanatory work, and discuss what happens to the disagreement if counterfactual persistence is eliminated—for example, if the game world is fully deterministic and advances only during direct player interaction. Conclude by sketching how the anti-realist might attack the case by arguing that the feature in question is merely an artifact of engine architecture rather than a morally relevant property of the represented entity.
