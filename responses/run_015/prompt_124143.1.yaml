  ### The Case That Would Split the Rules
  To prove whether she is using Rule 1 (Resolution) or Rule 2 (Decidability), you would need to present her with a thought experiment that is **operationally clear but theoretically unresolved.**

  **The Splitting Case: Feynman's Inverse Sprinkler.**
