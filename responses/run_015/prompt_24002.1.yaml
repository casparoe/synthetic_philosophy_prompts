prompt: |-
  I'm on a small team at an AI lab that has to aggregate different stakeholder preferences into a single objective function for the systems we ship, and right now we justify "sum the utilities" by citing Harsanyi's aggregation theorem, which reviewers keep poking holes in. Write a decision procedure my team can actually run on any proposed aggregation rule before a project lead signs off: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "the theorem doesn't reach this," and where it has to hand off to a value judgment because the question is values rather than facts. Three people, one afternoon, no social choice theorist on staff, and be honest about which steps are judgment calls dressed up as procedure -- I dont buy the "it's forced by rationality" story. Then run it on three cases: a clean one where everyone has well-defined expected-utility preferences and the impartiality condition is plausible; one where a stakeholder group's values are incommensurable with the rest so no cardinal utilities exist; and one where the procedure lands on a non-sum rule and we really dont want to hear it. Also keep separate what's settled among people who work on this from what's genuinely contested -- if the theorem isnt a settled proof of utilitarianism, say so plainly.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Small AI lab team aggregating stakeholder preferences into a single objective function.
      *   **Current Justification:** Harsanyi's Aggregation Theorem (summing utilities).
      *   **Problem:** Reviewers are challenging this justification. The user is skeptical of the "forced by rationality" narrative.
      *   **Task:** Create a decision procedure (checklist/flowchart) for evaluating aggregation rules *before* sign-off.
      *   **Constraints:** 3 people, one afternoon, no social choice theorist. Must be honest about judgment calls vs. factual checks. Must distinguish settled vs. contested theory.
      *   **Deliverables:**
          1.  The Decision Procedure (questions, sufficient answers, stop conditions, handoffs).
          2.  Application to three cases (Clean EU, Incommensurable Values, Unwanted Non-Sum Result).
          3.  Clarification on the status of Harsanyi's Theorem (settled vs. contested).

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *What it says:* If individuals and the social planner satisfy Von Neumann-Morgenstern (VNM) rationality axioms (completeness, transitivity, continuity, independence) over lotteries, and the Pareto principle holds (if everyone prefers A to B, society prefers A to B), then the social welfare function must be a weighted sum of individual utilities.
      *   *The Catch:* It relies heavily on the *same* subjective probabilities (Pareto + Independence implies common priors/beliefs) or assumes the aggregation is over *utilities* given fixed beliefs. It also assumes cardinal measurability of utility.
      *   *The Critique:* Reviewers poke holes because real stakeholders aren't VNM rational, utilities aren't always cardinal/comparable, and "impartiality" (weights) is a moral choice, not a mathematical necessity.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Practical, actionable, honest about limitations.
      *   *Structure:* Sequential questions.
      *   *Tone:* Pragmatic, slightly cynical (matching the user's skepticism), rigorous but accessible.
      *   *Key Sections:*
          1.  Input Validation (Do we have utilities?).
          2.  Rationality Check (Do VNM axioms hold?).
          3.  Pareto Check (Do we respect unanimous preference?).
          4.  Weight Setting (Where do the weights come from?).
          5.  The "Values vs. Math" Handoff.
      *   *Honesty Check:* Explicitly label where math ends and ethics begins.

  4.  **Drafting the Three Cases:**
      *   *Case 1 (Clean):* Internal lab metrics (latency, cost, accuracy). All cardinal, comparable. Harsanyi holds.
      *   *Case 2 (Incommensurable):* Safety vs. Freedom. One group says "rights cannot be traded." No cardinal utility. Harsanyi fails.
      *   *Case 3 (Unwanted Result):* Weighted sum suggests sacrificing a minority for majority gain. The math says "sum," the team says "no." This highlights the normative gap.

  5.  **Addressing the "Settled vs. Contested" Question:**
      *   Need to be precise. The *math* of the theorem is settled (if premises hold, conclusion follows). The *applicability* to moral philosophy or AI alignment is highly contested. It is *not* a proof of utilitarianism in the real world.

  6.  **Refining the Procedure (Self-Correction/Iterative Polish):**
      *   *Initial thought:* Make it a flowchart. *Correction:* Text-based step-by-step is easier to read in this format, but structure it like a checklist.
      *   *Initial thought:* Focus heavily on VNM axioms. *Correction:* Keep it practical. "Can you elicit a probability trade-off?" is better than "Does Independence hold?"
      *   *Crucial Addition:* The "Weights" problem. Harsanyi gives the *form* (sum), not the *weights*. This is where the "values" handoff happens. I need to make sure the procedure stops before pretending to solve the weights mathematically.
      *   *Tone Check:* The user said "I dont buy the 'it's forced by rationality' story." I need to validate that. The procedure should reflect that the theorem is a consistency check, not a moral imperative.

  7.  **Finalizing the Content:**
      *   *Introduction:* Acknowledge the skepticism.
      *   *The Procedure:* 5 Steps. Clear "Stop/Handoff" points.
      *   *The Cases:* Run the procedure on them.
      *   *The Theory Status:* Clear distinction between mathematical theorem and normative ethics.

  8.  **Writing the Response (incorporating specific constraints):**
      *   *Constraint:* "Three people, one afternoon." Keep it simple enough to discuss in a meeting.
      *   *Constraint:* "Honest about judgment calls." Use labels like **[JUDGMENT CALL]**.
      *   *Constraint:* "Settled vs. Contested." Add a specific section for this.

      *(Self-Correction during drafting)*: Make sure I don't just bash Harsanyi. It *is* useful for consistency. The problem is using it as a *moral shield*. The procedure should help them see when the shield is valid and when it's paper.

      *(Refining the "Unwanted Result" case)*: This needs to show that the theorem works *too well*. It forces a sum, but the sum yields a result the team rejects. This proves the weights or the form need moral override, not just math.

      *(Refining the "Incommensurable" case)*: Focus on the failure of cardinality. If you can't ask "what probability makes you indifferent," you can't use Harsanyi.

  9.  **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Stop/Handoff points? Yes.
      *   Honest about judgment calls? Yes.
      *   Three cases run? Yes.
      *   Settled vs. Contested clarified? Yes.

      *Let's build the response.*
answer: |-
  Here is a decision procedure designed for a practical engineering/alignment team, followed by the three case runs and a frank assessment of the theoretical landscape.

  ### Part 1: The Aggregation Sign-Off Procedure

  **Context:** You have 3 people and 3 hours. You are not proving a theorem; you are stress-testing a justification.
  **Goal:** Determine if Harsanyi's Aggregation Theorem is a valid *technical* constraint for your specific problem, or if you are making a moral choice disguised as math.

  #### Step 1: The Input Check (Cardinality & Measurability)
  **Question:** Can every stakeholder group express preferences over *lotteries* (probabilistic outcomes), not just ranked lists?
  *   **Test:** Pick two outcomes, $A$ (better) and $B$ (worse). Can you ask the stakeholder: "What probability $p$ of $A$ makes you indifferent to a guaranteed $C$?"
  *   **Sufficient Answer:** "Yes, we have elicited cardinal utilities (0 to 1 scale) for all stakeholders based on risk trade-offs."
  *   **Stop Condition:** If a stakeholder says, "I cannot trade off X against Y at any probability" (lexicographic preferences) or "This right is not for sale," **STOP**. Harsanyi does not apply.
  *   **[JUDGMENT CALL]:** Are you forcing stakeholders to answer probability questions they find nonsensical just to fit the model? If yes, note this as "Model Imposition."

  #### Step 2: The Rationality Check (VNM Axioms)
  **Question:** Do the stakeholders' expressed preferences satisfy Independence and Continuity?
  *   **Test:** Check for framing effects or preference reversals. If they prefer $A$ to $B$, do they still prefer a 50% chance of $A$ to a 50% chance of $B$?
  *   **Sufficient Answer:** "Stakeholder preferences are consistent enough that treating them as Expected Utility maximizers introduces less error than the alternative."
  *   **Stop Condition:** If stakeholders exhibit systematic Allais-paradox type behavior or context-dependent preferences that cannot be smoothed over, **STOP**. The theorem assumes VNM rationality; if inputs violate it, the output is garbage-in-garbage-out.
  *   **[JUDGMENT CALL]:** How much inconsistency is "enough"? This is an engineering tolerance call, not a mathematical fact.

  #### Step 3: The Pareto Check (Unanimity)
  **Question:** Does your aggregation rule respect unanimous preference?
  *   **Test:** If every stakeholder prefers Outcome $X$ to Outcome $Y$, does your objective function rank $X$ higher than $Y$?
  *   **Sufficient Answer:** "Yes, the rule is Pareto efficient."
  *   **Stop Condition:** If your rule overrides unanimous preference (e.g., for paternalistic reasons), **STOP**. Harsanyi requires the Pareto principle. If you violate Pareto, you cannot cite Harsanyi.
  *   **[JUDGMENT CALL]:** Are there cases where unanimity is wrong? (e.g., everyone prefers a biased model that harms an unrepresented group). If yes, you are making a moral override.

  #### Step 4: The Weights Handoff (The "Impartiality" Gap)
  **Question:** Where do the weights ($\alpha_i$) in the sum $\sum \alpha_i U_i$ come from?
  *   **Test:** Ask the team: "Did the theorem tell us the weights, or did we choose them?"
  *   **Sufficient Answer:** "We acknowledge the theorem dictates the *form* (linear sum) given Steps 1-3, but the *weights* are determined by [governance process/political negotiation/equal weighting]."
  *   **Stop Condition:** If the team claims "Equal weighting is required by the theorem," **STOP**. This is false. Harsanyi proves the form is linear, not that weights must be equal.
  *   **[JUDGMENT CALL]:** **CRITICAL HANDOFF.** This is where math ends and ethics begins. The procedure cannot solve this. You must document the *normative justification* for the weights separately from the *mathematical justification* for the sum.

  #### Step 5: The "Repugnant Conclusion" Stress Test
  **Question:** If we run the weighted sum, does it produce a result the team would veto regardless of the math?
  *   **Test:** Simulate a scenario where sacrificing a minority significantly boosts the aggregate sum.
  *   **Sufficient Answer:** "If the sum recommends X, we will ship X."
  *   **Stop Condition:** If the answer is "No, we would veto that," **STOP**. You are not actually using a utilitarian objective function; you are using a constrained one. Citing Harsanyi is misleading.
  *   **[JUDGMENT CALL]:** Admitting that you have hard constraints (rights, safety floors) that trump the sum. This invalidates the "pure sum" justification.

  ---

  ### Part 2: Running the Procedure on Three Cases

  #### Case 1: The Clean Run (Internal Resource Allocation)
  *   **Scenario:** Allocating GPU compute between three internal research teams. Stakeholders are Team Leads.
  *   **Step 1 (Cardinality):** Leads can trade off "chance of paper acceptance" vs. "guaranteed compute time." **Pass.**
  *   **Step 2 (Rationality):** Leads act consistently to maximize their team's output. **Pass.**
  *   **Step 3 (Pareto):** If all leads prefer Allocation A to B, management prefers A. **Pass.**
  *   **Step 4 (Weights):** Management decides weights based on strategic priority. **Handoff acknowledged.**
  *   **Step 5 (Stress Test):** No moral repugnance in giving one team more GPU time. **Pass.**
  *   **Verdict:** **Harsanyi Applies.** You can legitimately say, "Given risk-neutral stakeholders and strategic weights, the objective must be a weighted sum." This is a resource optimization problem, not a moral one.

  #### Case 2: The Incommensurable Run (Safety vs. Deployment)
  *   **Scenario:** Aggregating preferences between the Safety Team and the Product Team.
  *   **Step 1 (Cardinality):** Safety Team lead says: "There is no probability of feature speed that makes me indifferent to a known catastrophic failure risk. It's a hard constraint."
  *   **Result:** **STOP at Step 1.**
  *   **Analysis:** The Safety Team has lexicographic preferences (Safety > Everything). They do not have a cardinal utility function that trades off against Product goals.
  *   **Action:** You cannot use Harsanyi. You must use a *constrained optimization* (Maximize Product Utility *subject to* Safety Constraints). Citing Harsanyi here is mathematically incorrect because the input utilities do not exist in the required form.

  #### Case 3: The Unwanted Result (The Minority Sacrifice)
  *   **Scenario:** Aggregating user preferences for a content recommendation system across two demographic groups (Majority 90%, Minority 10%).
  *   **Step 1-3:** Users provide cardinal engagement scores. Pareto holds. **Pass.**
  *   **Step 4 (Weights):** You set weights proportional to population size (1 person = 1 vote).
  *   **Step 5 (Stress Test):** The weighted sum recommends showing content that radicalizes the Majority and harasses the Minority, because the engagement gain (Utility) for the Majority outweighs the harm to the Minority.
  *   **Team Reaction:** "We are not shipping that."
  *   **Result:** **STOP at Step 5.**
  *   **Analysis:** The math worked, but the moral conclusion failed.
  *   **Action:** You must admit you are *not* maximizing the sum. You are maximizing a sum *with side constraints* (e.g., fairness floors). Citing Harsanyi to justify the objective function is dishonest because you are overriding the theorem's output. The justification for the override is moral, not mathematical.

  ---

  ### Part 3: Settled vs. Contested (The Honest Briefing)

  Put this in your documentation appendix. Do not conflate these two columns.

  | **Settled (Math/Logic)** | **Contested (Philosophy/Alignment)** |
  | :--- | :--- |
  | **The Theorem Itself:** If agents satisfy VNM axioms + Pareto, the social welfare function *must* be linear (weighted sum). This is a proven mathematical implication. | **The Axioms:** Real humans (and stakeholders) rarely satisfy VNM axioms (Independence/Continuity). Applying the theorem to humans requires assuming away real psychological features. |
  | **The Weights Gap:** The theorem does *not* determine the weights ($\alpha_i$). It only dictates the form. | **The Weights Choice:** Choosing weights is a moral/political act. "Equal weights" is a moral stance (utilitarianism), not a mathematical requirement. |
  | **Cardinality Requirement:** The theorem requires cardinal, interpersonally comparable utilities. | **Comparability:** There is no scientific consensus on how to compare Utility Units between different people/groups. Is my "1 util" equal to your "1 util"? |
  | **Pareto Principle:** The theorem assumes we should always respect unanimous preference. | **Pareto Validity:** In AI safety, unanimous preference can be bad (e.g., users unanimously preferring addictive features). Overriding Pareto breaks the theorem's applicability. |
  | **Conclusion:** Harsanyi is a consistency check for *preferences*, not a derivation of *values*. | **Conclusion:** Citing Harsanyi as "proof" that you *should* maximize aggregate utility is a category error. It proves that *if* you want to satisfy those axioms, *then* you must sum. It does not prove you *should* want to satisfy those axioms. |

  ### Summary for the Project Lead

  1.  **Run the 5-Step Procedure.** If you fail Step 1 or 2, stop citing Harsanyi. You are doing something else (constraints, heuristics).
  2.  **If you pass Step 4,** explicitly document that the **weights** are a policy choice, not a mathematical output.
  3.  **If you fail Step 5,** admit that you have moral constraints that override the objective function.
  4.  **Update the Justification:** Instead of "Harsanyi proves we should sum utilities," write: "We use a weighted sum structure because it is the only form consistent with [List of Axioms we accept], subject to [List of Moral Constraints that override the sum]."

  This protects you from reviewers who know the theory, without requiring you to hire a social choice theorist. It shifts the burden from "Is the math right?" (it is) to "Are the premises acceptable?" (that's on you).
