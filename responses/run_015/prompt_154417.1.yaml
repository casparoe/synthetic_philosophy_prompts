  Decompose it. At minimum I want these separated: (1) whether convergence-to-truth-in-the-limit is even the right gold standard for an ideal predictor, given that the error bound you get is proportional to the length of the shortest program for the true source and so is useless at any data size anyone will ever have — maybe the right demand is getting it right early rather than eventually; (2) how much of a genuine problem the choice of reference machine is, i.e. whether the additive constant from the invariance theorem really washes out or whether, for finite messy datasets, a different universal machine could order the same two hypotheses the other way round, which would make simplicity language-relative in a way that matters — this is the bit that smells like grue to me; (3) whether uncomputability is a decisive objection or only a complaint about implementation, i.e. can a rule that no agent can follow be the standard of good reasoning; (4) whether the simplicity orderings working scientists actually use — low-degree polynomials, differential equations, symmetries, sparsity — track complexity orderings closely enough for the formal result to be doing any real work, rather than just gesturing at it.

  Then fold in the variant one of them keeps pushing, as its own term. Suppose you weight hypotheses by program length plus the log of their runtime, so a hypothesis that needs a mountains-of-time simulation to spit out its predictions gets penalised for being slow as well as long. Give me (5) your credence that this runtime-penalised prior still has a convergence or dominance guarantee worth caring about, and (6) conditional on it not having one, how far that should dent the original story — is the slow-program discount a repair, or does it quietly concede that length was only ever in the justification because length is what the proof needs? Combine the numbers into one figure, tell me which single term the final answer is most sensitive to, which of us is most likely wrong about which sub-question, and what one result or observation would move you most. Keep it fairly terse per term — a number and a line each is fine — I want the decomposition, not an essay, and I've got to write mine up by thursday.
