answer: |-
  ### 1. Candidate Principles

  **Pure Expected Utility:** Vote if and only if the probability of your vote changing the outcome multiplied by the stakes exceeds the cost of voting.
  *Case 1:* Probability of pivot in a safe state is $\approx 10^{-9}$; cost is two hours. Expected value is negative. **Verdict: Skip.**
  *Case 4:* Probability of crossing 5% threshold is $\approx 10^{-10}$ (smaller than pivot). Stakes (funding) are lower than national control. **Verdict: Skip.** (Fails your intuition on Case 4).

  **Fair Play (Cooperative Scheme):** You have a duty to vote if you benefit from the democratic system and others bear the burden of sustaining it.
  *Case 1:* You benefit from national stability; others vote. **Verdict: Vote.** (Conflicts with your verdict).
  *Case 4:* You benefit from party diversity/funding. **Verdict: Vote.**

  **Expressive Liberty:** Voting is a form of speech or identity expression; duty exists only where expression is meaningful to the agent.
  *Case 1:* Expression is drowned out. **Verdict: Skip.**
  *Case 4:* Expression supports a specific cause (funding). **Verdict: Vote.** (Matches intuition, but fails Case 3 where stakes are monetary, not expressive).

  **Threshold Legitimacy:** You ought to vote if your vote contributes to a public metric (margin, turnout, threshold) that triggers independent consequences or legitimacy, provided costs are not prohibitive.
  *Case 1:* Margin has no triggered consequence. **Verdict: Skip.**
  *Case 4:* Margin crosses funding threshold. **Verdict: Vote.** (Matches intuition and Case 3).

  ### 2. The Defended Principle: Weighted Threshold Duty

  I defend a hybrid principle that combines instrumental pivot probability with metric contribution, constrained by cost and competence.

  1.  **Epistemic Constraint:** Do not vote if you cannot distinguish candidates or policies; a random vote adds noise without signal. (Motivated by **Case 6**: Your brother's random vote dilutes the informed signal).
  2.  **Instrumental Clause:** Vote if $P(\text{pivot}) \times \text{Stakes} > \text{Cost}$. (Motivated by **Case 3**: Condo pivot is $\approx 10\%$; stakes $\$3,000$; expected value $\$300$ exceeds 5-minute cost).
  3.  **Metric Clause:** Vote if the vote count itself triggers a public benefit (funding, quorum, legitimacy) and $\text{Cost} < \text{Share of Benefit}$. (Motivated by **Case 4**: The 5% line is a switch; your vote contributes to the count even if pivot is low).
  4.  **Burden Cap:** Abstain if cost exceeds a reasonable burden (e.g., $>1\%$ daily income or severe risk). (Motivated by **Case 8**: $\$150$ is high; **Case 1**: 2-hour trip is high burden for low metric value).

  This principle treats voting as both a decision mechanism (Clause 2) and a data-generation mechanism (Clause 3). It explains why Case 4 feels different from Case 1: in Case 4, the *count* is the outcome, not just the winner.

  ### 3. Application to New Cases

  **(a) The Lottery Election:**
  In a majority rule election with 40,000 voters, the pivot probability is roughly $1/\sqrt{N} \times \text{density}$. For $N=40,000$, $\sqrt{N}=200$. Pivot prob $\approx 1/200 \times 0.01 \approx 5 \times 10^{-5}$.
  In a lottery system, one ballot is drawn. Your pivot probability is exactly $1/40,000 = 2.5 \times 10^{-5}$.
  *Arithmetic:* The probabilities are comparable, but the lottery removes the "wasted vote" problem. Under majority rule, if your candidate loses by 100 votes, your vote value is 0. In lottery, every vote has equal weight $1/N$.
  *Verdict:* My principle says vote (Clause 2). Your gut might say it matters *less* because it feels like gambling, but arithmetic shows the expected causal power is similar to a close local election. The principle corrects the gut: voting matters equally.

  **(b) The Union Vote:**
  Membership $N=800$. Quorum needed $= 400$. Expected turnout $= 384$ (48%).
  You oppose the union. The Yes side is 60% of voters.
  *Arithmetic:* The binding constraint is the quorum (400), not the majority (Yes is already 60%). If you vote, you increase turnout by 1. If turnout is the bottleneck, your vote *helps* the union achieve recognition.
  *Calculation:* If you abstain, expected turnout remains 384. If you vote, it becomes 385. You are not pivotal for the majority (60% buffer is large), but you contribute to the quorum risk.
  *Verdict:* My principle (Clause 2) says: Vote only if you improve the outcome *for your preference*. Here, voting increases the probability of quorum (bad for you). Abstaining keeps turnout lower. **You should abstain.** This contradicts the standard "always vote no" intuition but follows the arithmetic of the threshold.

  **(c) High-Cost Shift:**
  Cost $= \$190$. Stakes $=$ National Election.
  *Arithmetic:* Pivot probability in a competitive national election $\approx 10^{-7}$. Stakes $\approx \$10,000$ (your share of policy impact). Expected Value $= 10^{-7} \times 10,000 = \$0.001$.
  *Comparison:* $\$0.001 \ll \$190$.
  *Verdict:* Clause 4 (Burden Cap) triggers. Even in a competitive election, a direct loss of $\$190$ plus employer retaliation exceeds the instrumental value. **Abstain.** The principle overrides the "competitive election" duty because the cost is prohibitive.

  ### 4. Conflicts and Costs

  **Verdict to Surrender:**
  My principle forces you to give up **Case 1** (Safe State National).
  You argue skipping is fine and "not wrong." My Metric Clause (3) implies a weak duty here. Even if the winner is fixed, the *margin* contributes to the mandate legitimacy. If you accept Case 4 (voting for a 5% threshold), you must accept that vote counts matter as metrics. A national popular vote total is also a metric read by observers (Case 7 logic). If you owe a duty to cross the 5% line for a party, you owe a duty to contribute to the national margin for legitimacy, unless the cost is prohibitive. A two-hour trip is high cost, but if you accept Case 4 (same cost, lower probability), you must admit Case 1 carries *some* duty, however weak. You cannot say it is "fine" without qualification; it is a minor failing of civic contribution, similar to Case 2 but diluted by safety.

  **The Principle That Saves All Eight:**
  To save Case 1 (Skip) and Case 4 (Vote), you need a principle that distinguishes "Policy Thresholds" (funding) from "Electoral Margins" (legitimacy).
  *Principle:* "Vote if you trigger a specific policy benefit (Case 4) or decide a winner (Case 2); margins alone do not create duty."
  *Cost:* This is ad hoc. It claims vote counts matter for funding but not for mandates, despite both being public signals (Case 7). It sacrifices theoretical consistency to match intuition. It requires arguing that funding is a "real" good while legitimacy is "symbolic," which contradicts the logic of Case 7 where the symbolic tally was worth risking safety.

  ### 5. Unsettled Matters and Campaign Line

  **What the Principle Cannot Settle:**
  The principle cannot precisely weight the "Legitimacy Value" of a margin in Case 1 versus the "Funding Value" in Case 4. It hands back to you the decision of how much civic legitimacy is worth relative to two hours of time. It also cannot resolve the tension in Case 7 (Authoritarian) if the risk of imprisonment is high; the Burden Cap clashes with the Metric Clause, requiring a personal valuation of courage versus safety.

  **Campaign Line:**
  To volunteers and uninformed voters, do not say "Everyone must vote." Say: **"Vote if you are informed and able; your count builds the record, but your choice must be your own."** This respects the Epistemic Constraint (Case 6) and the Burden Cap (Case 8), while encouraging the Metric Contribution (Case 4) without lying about the instrumental odds (Case 1).
