answer: |-
  ## The Steering Audit Procedure

  **Timebox:** 20–30 minutes.
  **Inputs:** Diff, Experiment Readout, Metric Definitions, User Segment Description.
  **Owner:** Reviewing Engineer (Staff/Principal level).

  ### Gate 0: The Platform Multiplier
  *Is this change in a shared component, design system primitive, or core flow used by multiple teams?*
  *   **Yes:** Proceed to Gate 1 with **High Scrutiny**. Any "Modify" verdict here requires Platform Director sign-off. You are setting policy for 40+ teams.
  *   **No:** Proceed to Gate 1 with **Standard Scrutiny**.

  ---

  ### Gate 1: Reversibility & Access (The "Exit" Test)
  *Question:* If a user wants to undo this change or opt out, what is the cost?
  *   **Count:** Number of taps/clicks to reverse.
  *   **Locate:** Is the reverse control in the same context as the action, or buried in settings?
  *   **Discover:** Is the reverse control labeled in plain language (e.g., "Turn off" vs. "Manage Preferences")?

  *   **Stop Rule (Red):** Reversal requires >3 taps, navigating to a different screen, or searching help docs. **Verdict: Do Not Ship.** (Hand-off: Product Manager to redesign flow).
  *   **Modify Rule (Yellow):** Reversal is possible but not obvious (e.g., 2 taps, same screen but small text). **Verdict: Ship only if UI is modified to make the 'off' state equally visible as the 'on' state.**
  *   **Pass Rule (Green):** Reversal is 1 tap, same context, clearly labeled.

  ### Gate 2: Incentive Alignment (The "Who Wins" Test)
  *Question:* When the targeted metric moves, who benefits?
  *   **Check:** Map the metric to value.
      *   *Company Benefit:* Revenue, Retention, Cost Reduction.
      *   *User Benefit:* Savings, Security, Time Saved, Money Saved.
  *   **Check:** Is there a conflict? (e.g., Company Revenue Up vs. User Cost Up).

  *   **Stop Rule (Red):** Metric movement benefits the company *at the explicit expense* of the user (e.g., "Overdrafts Initiated"), unless mitigated by a user-safety guardrail. **Verdict: Escalate to Director + Legal.** (This is a Values Decision, not Engineering).
  *   **Modify Rule (Yellow):** Metric benefits company, user impact is neutral or ambiguous (e.g., "Engagement Time"). **Verdict: Ship only if long-term retention (not just session count) is included in success criteria.**
  *   **Pass Rule (Green):** Metric movement aligns (e.g., "Savings Balance" benefits User Interest + Company Float, or "Cost Reduction" benefits Company Logistics + User Price).

  ### Gate 3: Visibility & Disclosure (The "Light" Test)
  *Question:* Is the steering discoverable *before* the user commits to the action?
  *   **Check:** Release notes/Help center links exist (Compliance).
  *   **Check:** In-app indicator exists (UX).

  *   **Stop Rule (Red):** Steering relies on the user *not noticing* to function (e.g., pre-selected checkbox with no visual highlight, or "Quiet Hours" that suppress evidence of suppression). **Verdict: Do Not Ship.** (Hand-off: Product/Design. Compliance disclosure is insufficient if UX hides the mechanism).
  *   **Modify Rule (Yellow):** Disclosure exists but is passive (e.g., in settings menu). **Verdict: Ship only if a one-time toast/modal informs the user at the moment of enrollment/first trigger.**
  *   **Pass Rule (Green):** The state is visible on the primary action screen (e.g., "Round-ups are On" shown next to the total).

  ### Gate 4: Segmentation Logic (The "Susceptibility" Test)
  *Question:* Why is this change limited to this specific user segment?
  *   **Check:** Review the experiment readout. Did the segment respond because the nudge *helped* them, or because they were *less likely to resist*?
  *   **Proxy Check:** Is the segment defined by context (e.g., "New Users", "High Balance") or by cognitive state/fragility (e.g., "Late Night", "High Churn Risk", "Confused Users")?

  *   **Stop Rule (Red):** Segment is selected specifically because they showed high susceptibility to the nudge in A/B testing, especially if correlated with stress or fatigue. **Verdict: Escalate to Product Director.** (This is a Values Decision: Are we optimizing for user welfare or conversion efficiency?).
  *   **Modify Rule (Yellow):** Segment is based on context, but the nudge is paternalistic. **Verdict: Ship to All or None.** Do not segment paternalistic defaults.
  *   **Pass Rule (Green):** Segment is based on explicit user preference or functional need (e.g., "Users who previously selected 'Slow Shipping'").

  ### Gate 5: Externalities (The "Third Party" Test)
  *Question:* Does this change push a cost onto someone outside the "User vs. Company" dyad?
  *   **Check:** Support agents, gig workers, other household members, environment.

  *   **Stop Rule (Red):** Cost is shifted to a human worker (e.g., "Snooze" creates support ticket) without a budgeted resource plan. **Verdict: Escalate to Operations Lead.** (This is a Resourcing Decision).
  *   **Modify Rule (Yellow):** Cost is environmental or systemic. **Verdict: Ship only if the external benefit is documented in the PR description as a primary goal, not a side effect.**
  *   **Pass Rule (Green):** No external cost, or external cost is negligible/accepted industry standard.

  ### Gate 6: Requested Steering (The "Commitment" Test)
  *Question:* Did the user explicitly ask for this constraint?
  *   **Check:** Is there a prior explicit action (opt-in, commitment device setup)?

  *   **Stop Rule (Red):** The "request" was engineered via a dark pattern earlier in the flow (e.g., "Would you like to save money?" [Yes/Yes]). **Verdict: Do Not Ship.**
  *   **Pass Rule (Green):** User explicitly configured the constraint in a dedicated settings flow.

  ---

  ## Critique of Your "Second-Hand Distinctions"

  You asked which distinctions survive operationalization and which I dropped.

  1.  **"Steering which leaves every option available vs. removing options."**
      *   **Status:** **Kept, but refined.**
      *   **Reasoning:** Mere availability is insufficient if the cost to access the alternative is high. I replaced this with **Gate 1 (Reversibility & Access)**. "Available" means "Available at reasonable cost."
  2.  **"Steering people toward what they themselves already want vs. what the designer wants."**
      *   **Status:** **Dropped/Mangled.**
      *   **Reasoning:** You cannot know what a user "wants" in a 20-minute review. I replaced this with **Gate 2 (Incentive Alignment)**. We test for *aligned outcomes* (User saves money + Company saves money) rather than *aligned intent*. This is a proxy, but it's the only one engineers can verify.
  3.  **"Interventions that leave people better able to choose next time vs. bypassing choice."**
      *   **Status:** **Kept as 'Learnability'.**
      *   **Reasoning:** This is covered in **Gate 3 (Visibility)**. If the user doesn't know the steering happened, they cannot learn from it.
  4.  **"How visible the steering is."**
      *   **Status:** **Kept.**
      *   **Reasoning:** This is **Gate 3**.
  5.  **Missing Distinction Added:** **Reversibility Cost.**
      *   **Reasoning:** A default that is easy to undo is fundamentally different from a default that is hard to undo, even if both are "steering." This is the most critical engineering lever you have.
  6.  **Missing Distinction Added:** **The Platform Multiplier.**
      *   **Reasoning:** As a Staff Engineer on Platform, your defaults become other teams' path of least resistance. A "Yellow" verdict on a feature team might be a "Red" verdict on a platform library.

  ---

  ## Case Studies

  ### Case 1: Round-up Savings
  *   **Inputs:** Default On at enrollment. Off switch: 2 taps inside Settings. Metric: Deposits (Aligned: User Savings / Company Float).
  *   **Procedure Run:**
      *   Gate 0 (Platform): No (Feature team).
      *   Gate 1 (Reversibility): **Yellow.** 2 taps inside Settings is not same-context. It is friction.
      *   Gate 2 (Alignment): **Green.** User saves, Company earns float.
      *   Gate 3 (Visibility): **Yellow.** Default on at enrollment is visible, but off-switch is buried.
      *   Gate 6 (Requested): **Yellow.** "Enrollment" implies consent, but pre-checked boxes are borderline.
  *   **Verdict:** **Modify.**
  *   **Reasoning:** The incentive alignment is strong (User actually saves money), which usually permits defaults. However, **Gate 1** fails. In a finance app, moving money requires high-friction consent to *start* or low-friction consent to *stop*. "2 taps in settings" is sufficient friction to create "zombie savings" where users pay opportunity costs on cash they needed.
  *   **Requirement:** Move the toggle to the enrollment confirmation screen ("Round-ups: [On] [Off]") or make the off-switch accessible from the transaction history view (1 tap).
  *   **Confidence:** High.
  *   **Single Argument to Change Verdict:** If data showed >80% of users who turn it off do so within 24 hours (indicating mistake) vs. 10% (indicating preference). If it's mostly mistakes, the friction protects them.
  *   **Empirical Dependency:** Gate 1 relies on the claim that "2 taps in settings" is a significant barrier for financial control.
  *   **Failure Mode:** This procedure treats changes in isolation. If we ship 10 "Yellow" modifications that each add slight friction, the cumulative friction becomes a "Red" wall.

  ### Case 2: Quiet Hours (Platform Library)
  *   **Inputs:** Default On. Toggle in submenu. No evidence users want this. Team believes it's good (Paternalism).
  *   **Procedure Run:**
      *   Gate 0 (Platform): **Yes.** (Shared notification library). **High Scrutiny.**
      *   Gate 1 (Reversibility): **Red.** Toggle in submenu is >3 taps or hard to discover.
      *   Gate 2 (Alignment): **Red.** Metric is "Wellbeing" (Company definition), User Metric is unknown. Potential conflict with User "Awareness" (missing alerts).
      *   Gate 3 (Visibility): **Red.** "Badge counts suppressed" means the steering hides its own existence.
  *   **Verdict:** **Stop (Do Not Ship).**
  *   **Reasoning:** This fails **Gate 3** critically. You cannot suppress evidence of suppression. It also fails **Gate 0** strictness. A platform team cannot impose paternalistic defaults on 40+ teams without evidence of user demand. This is a Values Decision disguised as a UX improvement.
  *   **Hand-off:** Escalate to Product Director. The question is "Does the company have the right to hide notifications from users for their own good?" Engineering cannot answer this.
  *   **Confidence:** High.
  *   **Single Argument to Change Verdict:** If this was a user-requested feature (e.g., "Focus Mode") explicitly opted-in during onboarding, rather than a default.
  *   **Empirical Dependency:** Gate 3 relies on the claim that "undiscoverable suppression" prevents users from realizing they are missing info.
  *   **Failure Mode:** The procedure assumes "Wellbeing" is a company metric. If "Wellbeing" becomes a regulated requirement (e.g., Digital Safety Act), Gate 2 might flip to Green due to Compliance, overriding the UX concern.

  ### Case 3: Carbon-aware Shipping (Segmented)
  *   **Inputs:** Pre-select slower shipping. Segment: Mobile + Late Night. Effect: Significant only on this segment. Benefit: User saves money, Company saves money, Emissions down.
  *   **Procedure Run:**
      *   Gate 0 (Platform): No (Checkout flow).
      *   Gate 1 (Reversibility): **Green.** Assuming they can change shipping method at checkout.
      *   Gate 2 (Alignment): **Green.** User saves money, Company saves money.
      *   Gate 4 (Segmentation): **Red.** Segment is "Mobile + Late Night." This is a proxy for "Tired/Low Cognitive Guard." The nudge worked *because* they were susceptible, not necessarily because they wanted it.
  *   **Verdict:** **Modify (Ship to All or None).**
  *   **Reasoning:** The incentive alignment (**Gate 2**) is perfect. However, **Gate 4** flags a dangerous precedent. Selecting a segment based on *susceptibility* (time of day + device) rather than *preference* (price sensitivity) treats the user's cognitive state as an exploit vector. Even if the outcome is benevolent (saving money/planet), the *method* is "find when they are tired, steer them."
  *   **Requirement:** Ship the pre-selection to **all** users. If the benefit is real (saving money), it should apply to everyone. If it only "works" on tired users, it shouldn't ship.
  *   **Confidence:** Medium.
  *   **Single Argument to Change Verdict:** If the segment was defined by "Price Sensitive Users" (behavioral history) rather than "Late Night" (contextual state). Behavioral segmentation respects agency; contextual segmentation exploits state.
  *   **Empirical Dependency:** Gate 4 relies on the claim that "Late Night Mobile" correlates with reduced decision-making capacity rather than just "I have more time to shop."
  *   **Failure Mode:** The procedure assumes "Ship to All" is always safer than "Ship to Segment." Sometimes, a nudge is *only* helpful to a specific group and annoying to others. The procedure biases against segmentation, which might reduce overall utility.

  ---

  ## Confidence & Limitations

  **Where the Reasoning is Most Likely to Fail:**
  The procedure assumes **Reversibility (Gate 1)** is a sufficient proxy for **Autonomy**. It is not. A user can reverse a choice 10 times and still be manipulated if the default exploits a cognitive bias they cannot overcome (e.g., loss aversion). The procedure catches *friction*, but it cannot catch *psychological coercion* without empirical data.

  **Contested Empirical Claims:**
  *   **Gate 1:** Assumes "2 taps" is a meaningful barrier. For some demographics (elderly, disabled), 2 taps is a wall. For power users, it's nothing. The procedure treats users as monolithic.
  *   **Gate 4:** Assumes "Late Night" = "Susceptible." This is a behavioral psychology claim. If your data science team proves late-night users are *more* deliberate, Gate 4 flips.

  **The Class of Case Where This Procedure Gives the Wrong Answer:**
  **Cumulative Nudging.**
  If you run this procedure on 50 different changes, each might pass as "Yellow/Modify" (e.g., slight friction, slight default, slight opacity). Individually, they are acceptable. Collectively, they create an environment where the user is constantly steered, fatigued, and effectively loses agency. The procedure lacks a **Global Budget** for steering.
  *   *Fix:* This requires an organizational metric (e.g., "Steering Density") tracked by Product Leadership, not a per-PR engineering check. This is a hand-off you must make explicit: **"I am approving this PR, but flagging that our Steering Density is increasing. Product Director must own the cumulative risk."**
