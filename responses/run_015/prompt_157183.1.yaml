      *   *Wait, one sentence summary:* "Verdict: The framework presupposes a naive Cartesian internalism that ignores logical limits on self-proof, resulting in an inconsistent policy that grants epistemic authority over trust while demanding external oversight for risk." -> That works.

      *   *Let's check the Löb point again:* Does the policy treat it as irrelevant? Yes. It assumes the check is possible.
