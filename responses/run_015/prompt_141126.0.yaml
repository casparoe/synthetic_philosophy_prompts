prompt: |-
  You are a decision scientist who advises research and development organizations on escalation of commitment, and you are fluent in the formal literature on the dollar auction and wars of attrition. Think carefully before you answer: begin by listing the ways the dollar-auction framing can misfire when it is imposed on a real organization, and only then build the procedure.

  I chair the quarterly go/no-go review at a mid-sized biotech, roughly 200 people. We make six to ten continue/kill decisions per quarter in a single half-day, the CEO signs off, and the program leads in the room are the people who built the programs. The standard advice, that sunk costs are irrelevant and only forward-looking value counts, gets quoted and then quietly ignored, because two features of our situation make it look less like a bad investment and more like a dollar auction: the commercial prize is winner-take-most, so second place is worth very little, and much of what we have already spent is unrecoverable in a way that is mirrored on the other side, since the rival still in the race has burned comparable money that their exit would also strand. Our head of business development uses exactly this to argue the reverse of the standard conclusion: if a rival is still funding, that is evidence the asset is worth more than our own numbers say, so killing is the real mistake.

  I need a reusable procedure, not a one-off opinion. Please give me, in order: a screening step that sorts each program into the structures that actually matter, meaning a genuine two-sided contest with an observable rival, an ordinary one-sided escalation whose only opponent is our own prior spend, and what I think of as the phantom bidder case, where a rival is invoked rhetorically but is not really still bidding or whose exit we cannot observe; the tests to run after screening, with what counts as a sufficient answer to each, where the procedure stops with a no, and what to do when the number a test needs is simply unavailable, as it usually is; an explicit treatment of the persistence-as-evidence argument, covering when a rival's continued funding is information about the size of the prize, when it is only their own escalation, and how to tell the difference without access to their data; the points where judgment cannot be eliminated and a named person must decide, flagged honestly as judgment calls dressed up as procedure; and what the procedure cannot do. Then run it on three cases: a mid-stage asset whose rival just published strong data, a program whose rival left the field two years ago while our team still describes the space as a race, and one where I expect to dislike the answer, our flagship program, the one the company was founded on, now three years behind the leader. Answer in American English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Decision Scientist advising R&D organizations on escalation of commitment (dollar auction/wars of attrition literature).
      *   **Context:** Mid-sized biotech (200 people), quarterly go/no-go reviews (6-10 decisions, half-day), CEO signs off, program leads present.
      *   **Problem:** Standard "ignore sunk costs" advice is ignored because the situation feels like a Dollar Auction/War of Attrition (winner-take-most, unrecoverable spend on both sides). Head of BizDev argues rival persistence = asset value signal.
      *   **Deliverable:** A reusable procedure (not a one-off opinion).
      *   **Structure Required:**
          1.  List ways dollar-auction framing misfires in real organizations.
          2.  Screening step (sort programs into structures: Genuine Two-Sided, Ordinary One-Sided, Phantom Bidder).
          3.  Tests to run after screening (sufficient answers, stop rules, handling missing data).
          4.  Explicit treatment of "persistence-as-evidence" argument.
          5.  Flag judgment calls (named person must decide).
          6.  Limitations (what the procedure cannot do).
          7.  Run the procedure on three specific cases (Mid-stage/strong rival data, Rival exited 2 years ago/"race" rhetoric, Flagship program/3 years behind leader).
      *   **Tone/Style:** American English, careful thought, formal but practical.

  2.  **Deconstruct the Dollar Auction/War of Attrition in Biotech:**
      *   *Dollar Auction:* Two bidders bid for a dollar. Highest bidder wins the dollar, second highest pays their bid but gets nothing. Rational escalation leads to bids > $1.
      *   *War of Attrition:* Contestants endure costs over time. Winner takes prize. Loser pays costs incurred.
      *   *Biotech Context:* R&D is inherently uncertain. "Winner-take-most" is true for first-in-class or best-in-class. Sunk costs *are* irrelevant economically, but psychologically and strategically (signaling), they matter.
      *   *The Trap:* The BizDev argument ("Rival is still in, so it's valuable") is a classic escalation trap. It assumes the rival is rational and informed. They might be escalating too.
      *   *Misfires:* Real organizations aren't game-theoretic idealizations. Information is asymmetric. Prizes aren't fixed. "Winning" isn't binary (licensing, acquisition, niche markets exist).

  3.  **Drafting Section 1: How the Dollar-Auction Framing Misfires:**
      *   *Fixed Prize Fallacy:* In biotech, the prize (market value) isn't fixed ($1). It grows or shrinks based on data, regulation, and market entry timing.
      *   *Binary Outcome Fallacy:* Second place isn't always zero. Licensing, acquisition, or niche indication approval are possible.
      *   *Rational Opponent Assumption:* Assumes the rival is acting rationally. They might be trapped in their own escalation or have different cost structures/capital access.
      *   *Observability:* You can't actually see the rival's bid (spend) or their internal go/no-go thresholds.
      *   *Internal Politics:* The "bidders" inside the company (program leads) are not neutral auctioneers; they are invested players.

  4.  **Drafting Section 2: The Screening Step (Triage):**
      *   Need to classify the 6-10 projects.
      *   *Category A: Genuine Two-Sided Contest.* Observable rival, same mechanism/target, clinical stage proximity (<18 months), public commitment to continue.
      *   *Category B: Ordinary One-Sided Escalation.* No active rival, or rival advantage is insurmountable. The only opponent is internal sunk cost.
      *   *Category C: Phantom Bidder.* Rival invoked rhetorically ("We can't be second"), but rival has exited, pivoted, or is unobservable/quiet.

  5.  **Drafting Section 3: The Tests (Post-Screening):**
      *   Need specific hurdles.
      *   *Test 1: The Forward-Looking NPV.* (Standard finance). Must be positive *excluding* sunk costs.
      *   *Test 2: The Cost-to-Clinch.* Can we afford to get to the next value inflection point without diluting too much?
      *   *Test 3: The Differentiation Gap.* If we are second, is there a clinical or commercial differentiator?
      *   *Missing Data:* Use proxies (analyst reports, hiring trends, trial registry updates). If truly unknown, apply a "conservative discount" to the prize value.
      *   *Stop Rule:* If Test 1 fails AND Test 3 fails -> Kill.

  6.  **Drafting Section 4: Persistence-as-Evidence (The BizDev Argument):**
      *   This is the crux. When is rival persistence a *signal* vs. *noise/escalation*?
      *   *Signal:* Rival has superior information (e.g., they own the IP, they see biomarker data we don't) AND they have a history of rational capital allocation.
      *   *Escalation:* Rival is a public company needing pipeline optics, or a private company burning VC money with no exit path.
      *   *Differentiation:* Look for *changes* in their behavior. Are they accelerating (signal) or just maintaining status quo (escalation)?
      *   *Test:* The "Independent Valuation" check. Does the asset value hold up *without* the rival's existence?

  7.  **Drafting Section 5: Judgment Calls:**
      *   Procedures don't make decisions; people do.
      *   *Call 1:* Strategic Fit. (CEO/CSO).
      *   *Call 2:* Risk Tolerance on Capital. (CFO/CEO).
      *   *Call 3:* The "Face" Factor. (Killing a flagship).
      *   Need to name the roles explicitly.

  8.  **Drafting Section 6: Limitations:**
      *   Cannot predict biology.
      *   Cannot read rival minds.
      *   Cannot fix culture (if leads lie, procedure fails).

  9.  **Drafting Section 7: Running the Cases:**
      *   *Case 1 (Mid-stage/Strong Rival Data):* Likely Category A. Test differentiation. If rival data is strong, our value drops.
      *   *Case 2 (Rival Exited 2 Years Ago):* Category C (Phantom). The "race" is rhetorical. Sunk cost is the only enemy. Likely Kill unless standalone value is high.
      *   *Case 3 (Flagship/3 Years Behind):* Category A or B depending on leader's status. High emotional load. The "Persistence-as-Evidence" trap is strongest here. Need to be harsh on Forward-Looking NPV.

  10. **Refining and Polishing:**
      *   *Tone Check:* Is it authoritative but humble? Yes.
      *   *Constraint Check:* Did I list misfires *first*? Yes. Did I follow the specific order? Yes. American English? Yes.
      *   *Content Check:* Ensure the distinction between War of Attrition and Dollar Auction is clear (Biotech is usually War of Attrition + Real Options).
      *   *Specific Instruction:* "Think carefully before you answer." (I am doing this in the thought block).
      *   *Specific Instruction:* "Flagged honestly as judgment calls dressed up as procedure." (Make sure these stand out).

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest a scoring matrix.
      *   *Correction:* No, the prompt asks for a *procedure* with tests and stop rules, not just a score. Keep it decision-tree style.
      *   *Initial thought:* Treat all rivals the same.
      *   *Correction:* Must distinguish between a well-capitalized pharma rival and a desperate biotech rival. Add this to the "Persistence-as-Evidence" section.
      *   *Initial thought:* Ignore the "200 people" constraint.
      *   *Correction:* Keep the procedure lightweight enough for a half-day meeting. No complex modeling required during the meeting. Pre-work is key.

  12. **Final Review against Prompt:**
      *   List misfires first? Yes.
      *   Screening step (3 categories)? Yes.
      *   Tests (sufficient answer, stop rules, missing data)? Yes.
      *   Persistence-as-evidence treatment? Yes.
      *   Judgment calls flagged? Yes.
      *   Limitations? Yes.
      *   Three cases run through? Yes.
      *   American English? Yes.

  13. **Final Polish:** Ensure the distinction between "Dollar Auction" (bidding for a fixed prize where 2nd place pays) and "War of Attrition" (waiting game) is acknowledged but integrated into the biotech context (R&D spend is the bid, approval is the prize). The prompt specifically mentions Dollar Auction, so I will use that terminology while acknowledging the nuances.

  *(Self-Correction on "Misfires"):* I need to make sure I don't just say "it's different." I need to explain *why* applying the theory blindly fails.
  *(Self-Correction on "Persistence"):* The BizDev Head's argument is Bayesian updating. I need to address why that update might be flawed (Common Value Auction vs. Private Value).

