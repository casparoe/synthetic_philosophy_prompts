prompt: |-
  I'm organizing a workshop on the foundations of quantum mechanics and I want the centerpiece to be an adversarial-collaboration document between a psi-ontic camp and a psi-epistemic camp. Can you draft the joint statement they'd produce after a year of good-faith work together?

  I want a numbered list of claims both sides can sign—about the formalism, about what the no-go theorems (PBR, Frauchiger-Renner, etc.) actually rule out, about what a satisfactory account needs to explain. Then a disagreements table where each side's view is stated in wording its own proponents would accept. Then the cruxes: the sub-questions where settling them would actually move someone off their position. For each crux, what kind of evidence or argument both sides agree would bear on it, and what each predicts.

  I suspect part of their dispute might be verbal—if so, say which part and why. And if there are things each side admits would count against their own view but that haven't been shown yet, include those. I'm less interested in a diplomatic compromise than in a document that makes the remaining disagreement genuinely precise.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Topic:** Foundations of Quantum Mechanics (QM).
      *   **Format:** Adversarial-Collaboration Document (Joint Statement).
      *   **Parties:** Psi-Ontic Camp (wavefunction is real) vs. Psi-Epistemic Camp (wavefunction is information/knowledge).
      *   **Components:**
          1.  Numbered list of agreed claims (formalism, no-go theorems, requirements).
          2.  Disagreements Table (steel-manned views).
          3.  Cruxes (sub-questions that could shift positions, agreed evidence/arguments, predictions).
          4.  Verbal Dispute Analysis (is it just semantics?).
          5.  Vulnerabilities (what would count against each view).
      *   **Tone:** Precise, rigorous, non-diplomatic (aiming for clarity of disagreement rather than false consensus), good-faith.

  2.  **Deconstruct the Positions:**
      *   **Psi-Ontic:** The quantum state ($\psi$) corresponds directly to physical reality. Distinct $\psi$ imply distinct physical states. Examples: Many-Worlds (Everett), Bohmian Mechanics, GRW/Spontaneous Collapse.
      *   **Psi-Epistemic:** The quantum state represents an agent's knowledge or information about an underlying reality (ontic state $\lambda$). Distinct $\psi$ can overlap in $\lambda$-space. Examples: QBism, Copenhagen (some readings), Spekkens' Toy Model, Relational QM (some readings).
      *   **Key Theorems:** Pusey-Barrett-Rudolph (PBR) is the big one for $\psi$-ontology. Bell's Theorem rules out local hidden variables. Frauchiger-Renner deals with consistency of agents. Kochen-Specker deals with contextuality.

  3.  **Drafting - Section by Section:**

      *   **Title & Preamble:** Needs to sound academic and collaborative. "The Quantum State Status Accord."
      *   **Section 1: Agreed Claims (Common Ground):**
          *   Must agree on the math (Hilbert space, Born rule).
          *   Must agree on empirical success.
          *   Must agree on what No-Go theorems *actually* say (they rule out *combinations* of assumptions, not single views in isolation).
          *   Must agree on criteria for a "satisfactory account" (clarity, empirical adequacy).
      *   **Section 2: Disagreements Table:**
          *   Need to define the core ontological commitment.
          *   Ontic view: $\psi$ is a physical field/object.
          *   Epistemic view: $\psi$ is a catalog of expectations.
          *   Need to address the "underlying reality" ($\lambda$). Ontic says $\psi$ *is* (part of) $\lambda$. Epistemic says $\psi$ is a distribution over $\lambda$.
      *   **Section 3: Cruxes (The Meat):**
          *   *Crux 1: PBR Interpretation.* Does PBR rule out epistemic models entirely or just specific classes (preparation independence)?
          *   *Crux 2: The Nature of Probability.* Objective chance (Ontic) vs. Subjective/Bayesian degree of belief (Epistemic).
          *   *Crux 3: Measurement Problem.* Collapse is physical (Ontic/GRW) vs. Update of information (Epistemic).
          *   *Crux 4: Retrocausality/Superdeterminism.* Epistemic views often lean here to save locality/realism. Ontic views often accept non-locality or many worlds.
      *   **Section 4: Verbal Disputes:**
          *   Is "real" the issue? Yes. What does it mean for a mathematical object to be "real"?
          *   Is "information" always "about something"? If information is primitive, does the distinction collapse?
      *   **Section 5: Vulnerabilities (Falsifiability):**
          *   Ontic vulnerability: Discovery of a deeper deterministic layer that reproduces QM without $\psi$ as fundamental (e.g., a successful $\psi$-epistemic hidden variable model that dodges PBR).
          *   Epistemic vulnerability: Proof that preparation independence *must* hold, or experimental violation of macroscopic superposition limits that forces $\psi$ to carry energy/mass directly.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate "Psi-Epistemic" with "Copenhagen." Copenhagen is a mix. Stick to the Harrigan-Spekkens classification framework.
      *   *Correction:* Ensure the PBR theorem is described accurately. It assumes "Preparation Independence." Epistemic proponents often attack this assumption.
      *   *Tone Check:* Avoid saying "Side A is right." Use "Side A contends."
      *   *Precision:* Instead of "reality," use "ontic state $\lambda$."
      *   *Frauchiger-Renner:* This theorem is about consistent reasoning between agents. It challenges single-world interpretations. Need to include it in the "Agreed Claims" about what is ruled out (single-world + universal QM + consistent agents).

  5.  **Final Review against User Prompt:**
      *   Numbered list of claims? Yes.
      *   Disagreements table? Yes.
      *   Cruxes with evidence/predictions? Yes.
      *   Verbal dispute analysis? Yes.
      *   Vulnerabilities? Yes.
      *   Tone: Precise, not diplomatic compromise.

  6.  **Final Polish:** Check for jargon accuracy (e.g., distinguishing $\psi$-ontic from $\psi$-complete). Ensure the distinction between $\psi$-supplemented (hidden variables) and $\psi$-epistemic is clear. (Decided to focus on the main dichotomy: Is $\psi$ physical or informational?)

  *(Self-Correction on Cruxes)*: Make sure the "evidence" isn't just "more theory." It needs to be something empirical or a rigorous mathematical proof both accept as decisive. For PBR, the crux is the *physical justification* of Preparation Independence.

  *(Self-Correction on Verbal Dispute)*: Acknowledge that "information" requires a physical substrate. If the substrate is the ontic state, is the distinction just about labeling? The document should highlight that the *explanatory role* of $\psi$ is the real dispute.

  7.  **Generate Output.** (Proceeding to draft based on these thoughts.)
answer: |-
  # JOINT STATEMENT ON THE STATUS OF THE QUANTUM STATE
  **The Quantum State Status Accord (QSSA)**

  **Date:** October 2024
  **Parties:** The Psi-Ontic Working Group (POWG) & The Psi-Epistemic Working Group (PEWG)
  **Subject:** A precise mapping of agreement, disagreement, and decisive cruxes regarding the ontological status of the quantum wavefunction ($\psi$).

  ---

  ## 1. AGREED CLAIMS (COMMON GROUND)
  *Both camps affirm the following propositions. Disagreement lies in interpretation, not in these formal or empirical baselines.*

  1.  **Formalism:** Standard quantum formalism (Hilbert space structure, unitary evolution via Schrödinger equation, Born rule for probabilities) is empirically adequate for all currently tested regimes.
  2.  **No-Signaling:** Superluminal signaling is impossible. Any ontological model must respect the no-signaling theorem.
  3.  **Bell's Theorem:** Any model reproducing QM predictions must violate either *Local Causality* or *Statistical Independence* (measurement independence). Both camps accept that "Local Realism" in the naive EPR sense is untenable.
  4.  **Scope of No-Go Theorems:** Theorems such as PBR (Pusey-Barrett-Rudolph), Bell, and Kochen-Specker do not rule out specific interpretations in isolation; they rule out *conjunctions of assumptions*. Specifically, PBR rules out $\psi$-epistemic models *only if* the assumption of **Preparation Independence** holds.
  5.  **Measurement Problem:** Both camps agree that the "measurement problem" (the tension between unitary evolution and definite outcomes) requires resolution. A satisfactory account must specify when and why definite outcomes occur without internal contradiction.
  6.  **Frauchiger-Renner:** We agree that the Frauchiger-Renner theorem demonstrates that one cannot simultaneously maintain: (a) Universal validity of QM, (b) Consistency of predictions between different agents, and (c) Single-world outcomes. At least one must be abandoned.
  7.  **Operational Equivalence:** Currently, there is no experimental setup where a $\psi$-ontic model and a $\psi$-epistemic model yield divergent *operational* predictions within standard non-relativistic QM.

  ---

  ## 2. DISAGREEMENTS TABLE (STEEL-MANNED POSITIONS)
  *Each side states its core commitment in terms it finds acceptable, avoiding caricature.*

  | Feature | Psi-Ontic Camp (POWG) | Psi-Epistemic Camp (PEWG) |
  | :--- | :--- | :--- |
  | **Core Claim** | The quantum state $\psi$ corresponds directly to the physical state of affairs. Distinct quantum states correspond to distinct physical realities. | The quantum state $\psi$ represents an agent's information, knowledge, or beliefs about an underlying physical state ($\lambda$). Distinct $\psi$ can overlap in $\lambda$-space. |
  | **Nature of $\lambda$** | $\psi$ is either identical to the ontic state $\lambda$ ($\psi$-complete) or a physical property of $\lambda$ ($\psi$-supplemented). | $\lambda$ exists independently of $\psi$. $\psi$ is a probability distribution over $\lambda$. Change in $\psi$ upon measurement is an update of information (Bayesian), not a physical change. |
  | **Collapse** | Either collapse is a physical process (GRW/CSL) or it is illusory (Many-Worlds). In both cases, the dynamics are objective. | "Collapse" is strictly an update of the observer's information catalog. No physical discontinuity occurs in the underlying system. |
  | **Probability** | Quantum probabilities are objective chances (propensities) or frequencies arising from branching worlds. | Quantum probabilities are subjective degrees of belief (Bayesian) or constraints on rational betting behavior. |
  | **PBR Implication** | PBR proves that $\psi$ must be ontic, provided Preparation Independence is physically mandated. | PBR proves that $\psi$-epistemic models must be highly non-classical (e.g., violating Preparation Independence or allowing retrocausality), not that they are impossible. |

  ---

  ## 3. CRUXES (DECISIVE SUB-QUESTIONS)
  *These are the specific points where resolution would force one side to abandon their position. We agree on what evidence would bear on these.*

  ### Crux 1: The Physical Justification of Preparation Independence
  *The PBR theorem assumes that systems prepared independently have independent physical states.*
  *   **POWG Prediction:** Preparation Independence is a fundamental requirement of separability in physics. Any model violating it implies implausible holistic conspiracies.
  *   **PEWG Prediction:** Preparation Independence is a classical intuition not warranted in quantum theory. Quantum holism allows distinct preparations to share ontic overlaps without contradiction.
  *   **Decisive Evidence:** A rigorous derivation showing that violating Preparation Independence necessarily leads to superluminal signaling **OR** a constructive $\psi$-epistemic model that violates Preparation Independence without signaling and reproduces QM.
  *   **Shift Condition:** POWG concedes if a local, $\psi$-epistemic model is constructed that violates Preparation Independence without signaling. PEWG concedes if it is proven that violating Preparation Independence implies retrocausality that contradicts macroscopic causality.

  ### Crux 2: The Ontology of Probability
  *Is the Born rule objective or subjective?*
  *   **POWG Prediction:** Probabilities reflect objective features of the world (branch weights or propensities). A single case has a definite physical chance.
  *   **PEWG Prediction:** Probabilities reflect agent uncertainty. In a single case, only the outcome is real; the probability is a statement about the agent, not the system.
  *   **Decisive Evidence:** A derivation of the Born Rule from non-probabilistic axioms.
  *   **Shift Condition:** If the Born Rule is derived purely from symmetry/unitarity (as in Everettian decision theory), PEWG must accept $\psi$ as objective structure. If the Born Rule is shown to require a reference to an agent's betting preferences (as in QBism), POWG must accept $\psi$ as agent-relative.

  ### Crux 3: Macroscopic Superposition & Gravity
  *Does $\psi$ carry mass/energy?*
  *   **POWG Prediction:** If $\psi$ is real, macroscopic superpositions should gravitate. A superposition of mass locations creates a superposition of spacetime geometries.
  *   **PEWG Prediction:** Since $\psi$ is information, only the actualized ontic state $\lambda$ gravitates. There is no superposition of spacetime, only uncertainty about which geometry obtains.
  *   **Decisive Evidence:** Interferometry experiments with massive objects (e.g., Bose-Einstein condensates or nanospheres) testing if the gravitational field is in superposition (Bose-Marletto-Vedral proposal).
  *   **Shift Condition:** POWG concedes if gravity is shown to be classical while matter remains quantum (implying $\psi$ does not source gravity directly). PEWG concedes if gravitational fields are shown to entangle via quantum mediators, implying the superposition is physically real.

  ---

  ## 4. ANALYSIS OF VERBAL DISPUTES
  *We identify areas where the disagreement may be semantic rather than substantive.*

  1.  **The Definition of "Real":**
      *   **Diagnosis:** POWG uses "real" to mean "causally efficacious." PEWG uses "real" to mean "mind-independent."
      *   **Resolution:** Both agree $\psi$ is *mathematically* indispensable. The dispute is whether $\psi$ is a *constituent* of the world (like a field) or a *map* of the world (like a probability distribution). We agree this is not merely verbal; it dictates whether we search for equations of motion for $\psi$ (POWG) or rules for updating $\psi$ (PEWG).

  2.  **The Nature of "Information":**
      *   **Diagnosis:** PEWG often says "$\psi$ is information." POWG retorts "Information must be about *something* physical."
      *   **Resolution:** We acknowledge a potential verbal collapse here. If PEWG posits an underlying ontic state $\lambda$, the dispute reduces to: Is $\psi$ identical to $\lambda$ (Ontic) or a distribution over $\lambda$ (Epistemic)? If PEWG denies $\lambda$ exists (e.g., QBism), the dispute is about whether physics describes the world or the agent's interface with the world. We classify the latter as a metaphysical divergence, not a verbal one.

  ---

  ## 5. VULNERABILITIES (WHAT WOULD COUNT AGAINST US)
  *Each side lists the specific result that would most damage their position.*

  ### Psi-Ontic Vulnerabilities
  1.  **Successful $\psi$-Epistemic Toy Models:** If a model like Spekkens' Toy Model is successfully extended to full QM without invoking many worlds or collapse, POWG's claim that $\psi$ *must* be real is falsified.
  2.  **Retrocausal Explanations:** If a retrocausal model (e.g., Price-Wharton) explains Bell correlations without non-locality and treats $\psi$ as a boundary condition rather than a state, the motivation for $\psi$-ontology diminishes.
  3.  **No Gravity in Superposition:** If experiments confirm that superposed masses do not create superposed gravitational fields, it suggests $\psi$ does not couple to gravity as a physical object.

  ### Psi-Epistemic Vulnerabilities
  1.  **PBR with Robust Independence:** If Preparation Independence is experimentally verified to hold to a degree that rules out overlapping $\lambda$-distributions, $\psi$-epistemic models are mathematically excluded.
  2.  **Observer-Independent Facts:** If Wigner's Friend variations (extended Frauchiger-Renner) demonstrate that different observers cannot maintain consistent facts without a single objective collapse, the agent-centric view fails.
  3.  **Derivation of Born Rule from Ontology:** If the Born Rule is derived solely from the structure of Hilbert Space (e.g., Gleason's Theorem strengthened) without reference to agents or knowledge, the epistemic account loses its explanatory niche.

  ---

  **Signed,**

  *Lead Representative, Psi-Ontic Working Group*
  *Lead Representative, Psi-Epistemic Working Group*
