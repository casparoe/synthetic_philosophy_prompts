answer: |-
  The principle that best unifies your verdicts, blocks the bootstrapping cases, and preserves the calibration tree is **The Principle of Antecedent Warrant (PAW)**.

  ### The Principle Stated Precisely

  **The Principle of Antecedent Warrant:**
  > A belief $B$ (concerning the reliability of a source $S_{target}$) can be justified by evidence $E$ (produced by a source $S_{evidence}$) if and only if the warrant for $E$ is **independent** of the reliability of $S_{target}$, unless $S_{evidence}$ is a **Basic Faculty**.
  >
  > *   **Independence:** The justification for accepting $E$ does not logically or probabilistically presuppose that $S_{target}$ is reliable.
  > *   **Basic Faculty:** A cognitive source (e.g., Perception, Memory, Deduction) that provides *prima facie* justification for first-order beliefs without requiring prior argument for its reliability.
  > *   **Constraint:** A Basic Faculty confers default warrant for *world-directed* beliefs (e.g., "There is a tree"), but **not** for *meta-beliefs* about its own general reliability (e.g., "My vision is reliable").

  ---

  ### How PAW Saves Your Verdicts

  1.  **Maple Tree (Fine):**
      *   *Verdict:* Knowledge.
      *   *PAW Analysis:* You are forming a first-order belief ("There is a tree") using Perception. Perception is a **Basic Faculty**. It does not require antecedent warrant to operate. PAW does not block first-order usage, only meta-justification.
  2.  **Brain-in-a-Vat (Know it, but not via argument):**
      *   *Verdict:* Knowledge possessed, but inference fails.
      *   *PAW Analysis:* To infer "~BIV" from "Tree," you use Perception ($S_{evidence}$) to prove a condition of Perception's reliability ($S_{target}$). This violates **Independence** (your warrant for "Tree" presupposes "~BIV"). However, you still *know* ~BIV because Perception is a Basic Faculty that delivers "~BIV" implicitly in its first-order output, just not via the *argument*. PAW explains why the *argument* is impotent without inducing skepticism.
  3.  **Zebra vs. Painted Mule (Fine directly, bad as step):**
      *   *Verdict:* Knowledge directly; inference to "~Mule" blocked.
      *   *PAW Analysis:* Identical to BIV. "Zebra" is a first-order belief (Basic Faculty). "~Mule" is a reliability condition (ruling out a defeater). Using the Zebra-belief to prove "~Mule" violates Independence.
  4.  **Scarf Procedure (Bad):**
      *   *Verdict:* No knowledge gained.
      *   *PAW Analysis:* $S_{evidence}$ = Vision. $S_{target}$ = Vision. You are using Vision to prove Vision's reliability. This violates the **Constraint** on Basic Faculties (no self-validation for meta-beliefs). It is pure bootstrapping.
  5.  **Lab Thermometer (Fine):**
      *   *Verdict:* Knowledge gained.
      *   *PAW Analysis:* $S_{evidence}$ = Reference Thermometer. $S_{target}$ = New Thermometer. The Reference Therm's warrant (calibrated previously) is **Independent** of the New Therm. PAW allows this flow of justification.
  6.  **Calibration Tree (Fine):**
      *   *Verdict:* Not infected.
      *   *PAW Analysis:* The chain stops at the human eye reading the mercury. The Eye is a **Basic Faculty**. It provides antecedent warrant for the first reference thermometer without needing calibration itself. The regress ends naturally at the Basic Faculty, preventing the "infection" you refuse to accept.
  7.  **Instruments A & B (Bad):**
      *   *Verdict:* No knowledge gained.
      *   *PAW Analysis:* $S_{evidence}$ = A. $S_{target}$ = B (and vice versa). Neither has antecedent warrant independent of the other. This is circular mutual support, violating **Independence**.
  8.  **Witness/Memory (The Conflict):**
      *   *Verdict:* You feel it is "less bad."
      *   *PAW Analysis:* $S_{evidence}$ = Memory. $S_{target}$ = Memory. The witness uses Memory to check Memory's consistency. This violates the **Constraint** on Basic Faculties (same as the Scarf case).
      *   *Honesty Check:* **PAW rules this Bad.** To maintain the principle, you must overturn your verdict here. Internal consistency feels convincing psychologically (coherence), but epistemically it provides no *new* warrant for reliability, just as the scarf procedure does not.

  ---

  ### Rulings on New Cases

  **1. The Self-Driving Car (LiDAR checking LiDAR Map)**
  *   **Scenario:** The car uses its LiDAR to build a map, then uses the LiDAR to check if it is navigating the map correctly, concluding the LiDAR is accurate.
  *   **PAW Verdict:** **Bad (No Knowledge).**
  *   **Reasoning:** $S_{evidence}$ (LiDAR sensor) and $S_{target}$ (LiDAR accuracy/Map) are the same system. The car is bootstrapping its own reliability. Without an independent GPS or visual odometry system (an independent source), the car cannot gain *justification* for its accuracy, even if it happens to be right.

  **2. The Translation App (App checking its own Dictionary)**
  *   **Scenario:** You verify the app's translation of "Chat" by looking up "Chat" in the dictionary database embedded within the same app.
  *   **PAW Verdict:** **Bad (No Knowledge).**
  *   **Reasoning:** $S_{evidence}$ (App Dictionary) and $S_{target}$ (App Translator) share the same codebase and source of authority. There is no **Independence**. If the app is biased or erroneous, both the translation and the dictionary definition will share that error.

  ---

  ### The Trade-Off: Which Verdict Must Go?

  To keep this principle robust and non-ad-hoc, **you must overturn your verdict on the Witness/Memory case.**

  You noted it feels "less bad" than the scarf procedure. This is a common intuition, but PAW reveals it as a cognitive illusion.
  *   **Why it feels less bad:** Memory has a "phenomenology of pastness" that feels like an independent check. When I recall an event consistently, it *feels* like I am consulting a record.
  *   **Why it is actually bad:** If my memory is systematically distorted (e.g., I always remember myself as more heroic than I was), checking one memory against another will simply confirm the distortion. The "consistency" is internal to the flawed system. Just as the red scarf doesn't prove color vision works (if I'm colorblind, it still looks red), a consistent memory doesn't prove memory works (if I'm confabulating, the story is still consistent).

  **Conclusion:**
  The **Principle of Antecedent Warrant** captures the structural difference between *using* a tool (Maple, Lab) and *validating* a tool (Scarf, A&B). It saves your Calibration Tree by identifying Basic Faculties as the foundational stop-point. It explains your hesitation on BIV/Zebra by distinguishing first-order knowledge from inferential justification. But it demands you accept that **internal coherence (Witness) is as epistemically empty as bootstrapping (Scarf)** when it comes to establishing reliability. If you accept that trade-off, the principle holds without a single ad-hoc clause.
