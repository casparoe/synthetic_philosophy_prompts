answer: |-
  You have put your finger on the single most persistent and damaging objection to the Lewisian Best System Account (BSA). In the literature, this is often called **the problem of language relativity** or **the problem of gerrymandered predicates**.

  You are absolutely right: if the competition for "best system" is open to *any* logically possible predicate, the BSA collapses. I can define a predicate $W(x)$ that applies to all and only the spacetime points that exist in the actual world. My system then becomes: $\forall x W(x)$. This system is maximally strong (it entails every truth about the mosaic) and maximally simple (it is one axiom). If this wins, laws are trivial, and Humeanism fails to distinguish laws from accidental generalizations.

  You are asking for the **mechanism** that restricts the vocabulary without begging the question. Here is the hard truth: **There is no algorithmic mechanism.** There is only a metaphysical posit or a pragmatic shift.

  Here is the breakdown of how Humeans attempt to solve this, the costs of each solution, and why your feeling of "stuckness" is philosophically warranted.

  ### 1. Lewis's Official Solution: Perfectly Natural Properties
  Lewis's explicit mechanism for stopping gerrymandering is the posit of **Perfectly Natural Properties (PNPs)**.

  *   **The Mechanism:** The competition for the Best System is not open to all predicates. It is restricted *only* to predicates that denote Perfectly Natural Properties.
  *   **Why it stops gerrymandering:** The gerrymandered predicate $W(x)$ ("is in the actual world") is not a PNP. It is a disjunctive, messy, world-specific property. The properties that appear in fundamental physics (mass, charge, spin, spacetime coordinates) are candidates for PNPs.
  *   **Addressing the Circularity Charge:** You worried that this is circular ("laws carve nature at joints, but we use joints to find laws"). Lewis argues this is **metaphysically prior, not circular**.
      *   For Lewis, the Humean Mosaic consists of spacetime points instantiating PNPs.
      *   The PNPs exist *before* the laws are selected. They are the categorical qualities that make up the mosaic.
      *   The Laws supervene on the mosaic (which is built of PNPs).
      *   Therefore, the vocabulary is fixed by the *ontology* of the mosaic, not by the laws themselves.
  *   **The Cost:** This requires a robust **Realism about Universals/Properties**. You cannot be a nominalist and a Lewisian Humean. You must believe that "charge" is a genuine joint in nature, distinct from "charge-or-grue," prior to any scientific investigation.
  *   **Your Objection:** You feel this is "quietly picking the language of physics." Lewis would reply: "No, we pick the language of physics *because* physics successfully identifies the PNPs." But epistemically, this leaves us in a bind: How do we know which properties are perfectly natural without already knowing the laws? Lewis admits this is an epistemic difficulty, but denies it is a metaphysical flaw.

  ### 2. The Pragmatic Turn (Loewer, Cohen, Hicks)
  Many contemporary Humeans realize that Lewis's PNPs are too metaphysically heavy. They try to fix the language via **pragmatics** rather than metaphysics. This is the "Best System *for Us*" account.

  *   **The Mechanism:** Simplicity is not an absolute, language-independent metric. It is relative to the cognitive architecture and inductive practices of agents like us.
  *   **Why it stops gerrymandering:** The predicate $W(x)$ is simple *logically*, but it is not simple *for us* to use. It doesn't support counterfactuals, it doesn't help us predict, and it doesn't fit our inductive norms. The "best" system is the one that best balances strength and simplicity *given our cognitive constraints*.
  *   **Addressing the "Whim" Charge:** You asked if picking the language of physics is a whim. On this view, it's not a whim; it's an **abductive necessity**. We use the vocabulary of physics because that vocabulary has proven to be the most projectible for agents with our sensory apparatus and cognitive limitations.
  *   **The Cost:** This makes laws **anthropocentric**. If there were aliens with different cognitive architectures, they might systematize the same mosaic with a different vocabulary and derive different "laws." (Lewis hated this; Loewer accepts it).
  *   **The Mechanism:** The "mechanism" here is **scientific practice**. We don't fix the language *a priori*; we fix it by looking at which vocabulary allows for the most robust compression of data that supports inference.

  ### 3. The Information-Theoretic Approach (Compression)
  Some have tried to use Kolmogorov complexity to define simplicity without language relativity.

  *   **The Mechanism:** The best system is the shortest computer program (on a universal Turing machine) that outputs the mosaic.
  *   **Why it fails your test:** Kolmogorov complexity is *also* language-relative (it depends on the choice of the universal Turing machine and the encoding). While the Invariance Theorem says the difference is bounded by a constant, for finite systems (like our universe), that constant matters. You can still gerrymander the encoding to make the program trivial.
  *   **Verdict:** This just pushes the language problem back to the choice of the Turing machine. It is not a solution.

  ### 4. The "Fundamental Vocabulary" Stipulation (Callender)
  Craig Callender and others have suggested we should simply **stipulate** that the vocabulary is fixed by the language of fundamental physics.

  *   **The Mechanism:** We define the BSA competition as occurring *within* the language of our best current fundamental physics.
  *   **Addressing Circularity:** This accepts a mild circularity but argues it is **virtuous**. We use physics to find the laws, and the laws tell us which physics is fundamental. It's a reflective equilibrium.
  *   **The Cost:** This risks making the BSA **descriptive rather than metaphysical**. If you have to look at physics to know which vocabulary to use to find the laws, are the laws really grounding physics, or is physics grounding the laws?
  *   **Why it's not a "whim":** It is not a whim because the vocabulary of physics is selected by empirical success. However, it concedes that the BSA cannot *generate* the vocabulary from scratch; it must inherit it.

  ### The Hard Truth About the "Mechanism"
  You are stuck because you are looking for a **non-circular, non-arbitrary algorithm** to fix the language. **Humeanism cannot provide this.**

  Here is why:
  1.  **If you fix the language metaphysically (Lewis):** You must posit PNPs. This is not circular metaphysically, but it is epistemically opaque. You have to trust that nature comes with pre-packaged joints.
  2.  **If you fix the language pragmatically (Loewer):** You avoid metaphysical baggage but accept that laws are relative to us.
  3.  **If you fix the language empirically (Callender):** You accept that the BSA is a reconstruction of scientific practice, not a ground for it.

  **The Verdict:**
  The "mechanism" is **the posit of Perfectly Natural Properties**. That is the only way to stop the gerrymandering without making laws anthropocentric.
  *   **Is it circular?** Metaphysically, Lewis says no (Properties $\rightarrow$ Mosaic $\rightarrow$ Laws).
  *   **Is it arbitrary?** No, it claims to track objective similarity relations in the world.
  *   **Does it feel like cheating?** Yes, because it requires a metaphysical commitment that Humeans usually try to avoid (realism about properties).

  If you reject PNPs as too "spooky" or realist, you are forced into the Pragmatic camp, where the language is fixed by **our inductive standards**. In that case, the "mechanism" is **human cognitive psychology and the history of scientific success**.

  You cannot have a BSA that floats free of all vocabulary constraints. You must either buy into **Natural Properties** (Lewis) or buy into **Pragmatic Constraints** (Loewer/Cohen). There is no third way that is both purely Humean (no necessary connections) and language-independent. The "stuckness" you feel is the friction of trying to find a neutral ground that does not exist.

  **Recommendation:** If you want to remain a Humean, you usually have to bite the bullet on one of these. Most modern Humeans (like Loewer) bite the Pragmatic bullet. They admit the language is fixed by *our* standards of simplicity, which happen to align with physics. It's not a whim; it's a feature of being a scientist in this world. If that makes laws slightly anthropocentric, so be it.
