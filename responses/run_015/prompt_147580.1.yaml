answer: |-
  Here is a principle that fits your seven verdicts, resolves the tension between Case 1 and Case 6, and handles your "fog" restriction.

  ### The Principle: The Triple-Lock Test

  A conflict is a **genuine moral dilemma** if and only if it satisfies three conditions simultaneously:

  1.  **Dual Binding Claims:** There are at least two options, each demanded by a moral duty that would be decisive if the other were not present. (This excludes cases where one option is merely "permitted" or "charitable.")
  2.  **Indelible Residue:** Whichever option you choose, you incur a normative debt (guilt, grief, obligation to make amends) that is not cancelled simply by having chosen the "better" option.
  3.  **Agency Lock:** You cannot transfer the decision to a rule, a system, or another person without violating a duty specific to *you* (as opposed to your office or role).

  **On the "Fog" Restriction:**
  Your distinction is doing real work. "Fog" is **epistemic** (I don't know the facts/values). "Dilemma" is **normative** (I know the facts/values, and they clash). If you are in Fog, you cannot verify Condition 1 (are the claims actually binding?). Separating them prevents you from confusing a calculation problem with a moral conflict. Keep that separation.

  ---

  ### How It Swallows Your Seven Cases

  *   **Case 1 (Mother/Children):** **Dilemma.**
      *   *Claims:* Duty to Child A vs. Duty to Child B (both binding).
      *   *Residue:* "Wrecked by it" (guilt/grief remains).
      *   *Lock:* You cannot hand this to a rule or another person; you are the mother. Refusing to choose fails the duty to minimize harm (both die).
  *   **Case 2 (Drowning Strangers):** **Not a Dilemma.**
      *   *Claims:* Duty to Save A vs. Duty to Save B. Symmetric.
      *   *Residue:* Ordinary grief, no guilt.
      *   *Lock:* A coin flip or "closest first" rule dissolves the agency. You aren't *choosing* who dies; you are executing a rescue protocol.
  *   **Case 3 (Son vs. Resistance):** **Dilemma.**
      *   *Claims:* Duty to Family vs. Duty to Justice/Survival (both binding, unlike Case 5).
      *   *Residue:* "Feels like tragedy."
      *   *Lock:* You cannot delegate being a son or a resistance member.
  *   **Case 4 (Two Promises):** **Dilemma.**
      *   *Claims:* Promise A vs. Promise B (both binding).
      *   *Residue:* "Apologising... doesn't clear it."
      *   *Lock:* You cannot un-promise. The lock is self-imposed, but it is still a lock.
  *   **Case 5 (Own Kid vs. 3 Strangers):** **Not a Dilemma.**
      *   *Claims:* Duty to Own Kid (binding) vs. Duty to Strangers (not binding, merely permitted).
      *   *Fails Condition 1.* Because saving the strangers isn't strictly *required*, there is no conflict of duties, only a conflict of preference.
  *   **Case 6 (Mayor/Rights):** **Dilemma for the Office, Optional for the Person.**
      *   *Claims:* Rights vs. Disaster (both binding).
      *   *Residue:* "Feels nothing afterward is a worse mayor."
      *   *Lock:* **Here is the key.** The *Office* is locked, but the *Person* is not. You can resign. If you stay, you face the dilemma. If you resign, you pass the Agency Lock to the successor. This explains why resigning is "admirable" (acknowledging the residue) but doing the act is "not wrong" (the Office demanded it).
  *   **Case 7 (ICU Protocol):** **Dilemma for Committee, Not for Doctor.**
      *   *Committee:* **Dilemma.** They had to write the rule. No prior rule existed. Agency Lock was on them.
      *   *Doctor:* **Not a Dilemma.** The rule exists. Condition 3 (Agency Lock) is broken by the protocol. It feels like "paperwork" because the moral agency was absorbed by the committee's prior work.

  ### The Tension Resolved (Case 1 vs. Case 6)
  You asked: *In 1 refusing to choose is worse, in 6 handing the choice to somebody else is fine. Is there a difference?*

  **Yes.** It is the difference between **Identity** and **Role**.
  In Case 1, the duty attaches to the *person* (Mother). You cannot resign from being a mother in that moment. You are the causal bottleneck.
  In Case 6, the duty attaches to the *office* (Mayor). The person is an operator. If the operator steps away, the machine (the state) still functions.
  Your principle handles this via **Condition 3 (Agency Lock).** If you can legitimately transfer the agency without failing the specific duty *you* hold, it's not a dilemma for you.

  ---

  ### Three New Cases (Verdicts Based on the Principle)

  **Case A: The Whistleblower**
  You discover your company is dumping toxic waste. Reporting it will definitely shut the company down, costing 500 innocent employees their livelihoods (you promised them job security when you recruited them). Staying silent harms the public health.
  *   **Verdict: Genuine Dilemma.**
  *   **Why:** Dual Binding (Public Safety vs. Loyalty/Promise). Indelible Residue (Either way, you betray someone). Agency Lock (You are the one who knows; you can't delegate this conscience).

  **Case B: The Trolley Switch (Standard)**
  A runaway trolley will kill five people. You can pull a lever to switch it to a track where it will kill one person. You know all the stakes clearly.
  *   **Verdict: Not a Dilemma (for a Utilitarian); Dilemma (for a Deontologist).**
  *   **Why:** This tests Condition 1. If you believe "minimize deaths" is the only binding rule, a rule settles it (Condition 3 fails). If you believe "do not kill" is *also* binding, then you have Dual Binding Claims. The principle doesn't solve the philosophy, but it clarifies that the dilemma exists only if you hold two conflicting binding rules. Most people feel residue here, suggesting it *is* a dilemma for them.

  **Case C: The Budget Cut**
  You are a department head. You must cut 10% of your budget. You have a written company policy that says "cut the lowest-performing projects." You know following this will fire three people who are low-performers only because they have disabilities, which feels unjust, but the policy is clear.
  *   **Verdict: Not a Dilemma (for you).**
  *   **Why:** Condition 3 fails. The Agency Lock was on the people who wrote the policy (like Case 7 Committee). You are the Doctor. You may feel bad, but the moral phenomenology should be closer to "paperwork" than "tragedy." If you feel it *is* a dilemma, it implies you believe you have a duty to disobey the policy that overrides your duty to follow it.

  ---

  ### Where This Principle Might Choke

  The weak point is **Condition 1 (Dual Binding Claims).**
  The principle assumes you can reliably tell which duties are "binding."
  *   Look at **Case 3 (Son vs. Resistance)** vs. **Case 5 (Own Kid vs. 3 Strangers).**
  *   Structurally, they look similar. Your verdict says 3 is a dilemma, 5 is not.
  *   The Principle agrees, *but only because you told it* that the Resistance's claim was binding ("genuinely needs him") while the Strangers' claim was not ("not required").
  *   **The Risk:** If a listener argues, "Actually, in Case 5, you *are* required to save the three," the Principle instantly turns Case 5 into a Dilemma.
  *   **The Fix:** Acknowledge that this principle defines the *structure* of a dilemma, not the *content* of your duties. It tells you when you're in a trap, not how the trap was built.

  ### Summary for the Newsletter
  You can define a genuine moral dilemma as a **Triple-Lock**:
  1.  **Two "Musts"** (not just a "Must" vs. a "Want").
  2.  **A Stain** (that "doing the right thing" doesn't wash off).
  3.  **No Exit** (you can't pass the buck without failing your specific duty).

  This keeps "Fog" separate (you can't check the locks if you can't see them) and explains why a Mayor can resign but a Mother cannot.
