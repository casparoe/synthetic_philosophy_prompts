  ### Candidate Framings

  1.  **The Metaphysical Grounding Framing:** Focuses on the ontology of state spaces, arguing that spaces must reflect real worldly distinctions. *Rejected:* Too abstract for an economics-inclusive committee; risks becoming a debate about realism rather than epistemology.
  2.  **The Deflationary Convention Framing:** Argues CPA is merely a modeling tool with no truth value. *Rejected:* Too negative; dissolves the problem rather than solving it, offering little constructive research path.
  3.  **The Structural Invariance Framing:** Focuses on whether disagreement persists across all admissible space refinements. *Rejected:* Technically dense; might obscure the philosophical payoff regarding the types of disagreement.
  4.  **The Taxonomy of Disagreement Framing (Selected):** Classifies disagreements (informational, prior, structural, evidential) to locate where the CPA actually bites. *Selected:* Directly addresses the intuition about political/scientific cases, offers clear deliverables, and bridges philosophy and economics.

  ***

  ### Dissertation Fellowship Proposal: The State Space Constraint in Common Prior Models

  **Introduction**
  The Common Prior Assumption (CPA) is a cornerstone of game theory and formal epistemology. It dictates that differences in belief between rational agents must be modeled as differences in information about a shared world rather than as differences in prior probability. This assumption underwrites agreement theorems, no-trade results, and the standard modeling conventions of information economics. However, the debate over the CPA has reached a stalemate. Defenders treat it as a harmless methodological device, arguing any disagreement can be traced to some information structure. Critics treat it as a substantive ideological claim that rules out fundamental disagreement by fiat. Both camps argue about the prior while silently relying on a fixed state space. This project proposes that the real content of the assumption, and the real objection to it, live in the requirement that the space be shared rather than in the requirement that the prior be shared. The standard framing hides this because it takes the space as given. My dissertation argues that once we make the construction of the state space explicit, the CPA either gains significant philosophical content regarding which distinctions are admissible, or it collapses into a trivial modeling convention.

  **The Diagnostic Gap**
  Existing positions leave the core issue open because they treat the state space as a neutral background. Defenders claim the CPA costs nothing because any belief profile can be rationalized by a common prior on a rich enough space. Critics claim the CPA is substantive because it forbids certain belief distributions. Both are partially right, but they miss the structural precondition: a common prior is only possible if a common refinement of the agents' state spaces exists. If any pattern of observed betting or trading behavior can be rationalized by some common-prior model on a rich enough space, then the assumption has no observable implications unless we constrain the space itself. The debate has been arguing about the probability distribution over a fixed set of states, when the substantive work is done by the selection of the states themselves. This project diagnoses this blind spot. It argues that cases often cited as evidence of different priors—political polarization, cross-paradigm scientific disputes—are better modeled as disagreements about which distinctions belong in the space at all, or about what a given piece of evidence indicates even when the space is shared. By shifting the focus from the prior to the space, we can explain why the CPA feels substantive in practice despite being technically flexible in theory.

  **Methodology and Scope**
  This project is conceptual plus a modest amount of formal spadework. I will not run an empirical study of whether people actually share priors, nor will I build a general logic of unawareness from scratch. Instead, I will conduct an audit of what exactly has to be pinned down for the assumption to have testable content. This involves an account of what sharing a space requires and when a common refinement exists. The goal is to specify the constraints on admissible state spaces that prevent the CPA from becoming trivial. If the assumption is to have any content at all, something has to be held fixed; part of the project is to say precisely what.

  Regarding scope, my advisor suggests dropping the case-study material to ensure completion. I argue this would be a mistake. Without concrete examples, the formal audit risks becoming a purely technical exercise in logic that fails to engage the philosophical literature on disagreement. However, I acknowledge the risk of scope creep. Therefore, the case studies will be limited to two worked examples where disagreement looks prior-like but may be space-like or evidence-likelihood-like. These will not be empirical surveys but rigorous reconstructions of existing puzzles (e.g., political polarization and scientific paradigm shifts) to test the taxonomy. If the formal audit reveals that space constraints are also arbitrary, the case studies will serve to demonstrate the collapse of the apparatus. If the audit finds robust constraints, the cases will illustrate their application. This balanced approach ensures the project remains tractable while delivering philosophical payoff.

  **Timeline**
  The nine-month fellowship will be divided into three phases. Months one through three focus on the formal audit. I will derive the conditions under which a common refinement exists and identify where triviality arises. The checkable output for this phase is a technical paper outlining the necessary and sufficient conditions for non-trivial space sharing. Months four through six focus on taxonomy development. I will classify disagreement types (informational, prior, structural, evidential) and map existing literature onto this framework. The output is a draft chapter defining the taxonomy. Months seven through nine focus on the case studies and synthesis. I will apply the taxonomy to the two selected cases and write the final dissertation chapters. The output is a complete draft of the core dissertation arguments.

  **Outcomes and Failure Conditions**
  I present both positive and negative outcomes as genuine results rather than as threats to be hidden. If it turns out that any pattern of observed behavior can be rationalized by some common-prior model on a rich enough space, then either the space-first reframing rescues the assumption's content by locating it in the choice of space, or the whole apparatus collapses into a modeling convention. Both outcomes are philosophically significant. The former provides a new foundation for information economics; the latter demonstrates a fundamental limitation in current formal tools for modeling disagreement.

  Decisive considerations include whether admissible state spaces can be constrained without begging the question. If space constraints are themselves conventional, the CPA collapses. If they can be grounded in epistemic accessibility or linguistic structure, the CPA survives with new content.

  Project failure is not merely finding a negative result. Failure conditions include: inability to specify non-arbitrary constraints on state spaces; failure to distinguish space-disagreement from prior-disagreement formally; or inability to complete the case studies within the timeline. If the formal audit shows that space constraints are as flexible as priors, the project succeeds by proving the CPA is empty. It fails only if the analysis remains inconclusive or if the taxonomy proves unable to classify standard cases.

  This project offers a sharp, tractable question that bridges philosophy and economics. It moves beyond the stalemate of the common prior debate by identifying the structural precondition that both sides have overlooked. Whether the result is a rescued assumption or a dissolved one, the clarification is necessary for future work on disagreement.

