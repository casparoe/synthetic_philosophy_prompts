answer: |-
  ### The Interpretability Realism Diagnostic

  This instrument maps the logical space of positions regarding neural network representations. It begins from the shared commitment that dictionary-learning methods yield stable, causal, and describable directions. The branching questions utilise specific hypothetical cases to isolate metaphysical commitments without presupposing labels.

  **The Decision Tree**

  **Q1. Existence.**
  Given the baseline findings of stable, causal directions, do you assert that the model literally possesses representations, or is this merely a manner of speaking?
  *   **No:** Proceed to Leaf 1.
  *   **Yes:** Proceed to Q2.

  **Q2. Utility vs. Truth.**
  Consider a scenario where a feature decomposition predicts model behaviour perfectly but is known to be mathematically arbitrary. Is the claim that these features are 'real representations' true independent of their utility for prediction?
  *   **No:** Proceed to Leaf 2.
  *   **Yes:** Proceed to Q3.

  **Q3. The Rebasement Case.**
  Apply an invertible random linear map to a model's residual stream and compensate for it exactly in the following layer's weights, so input–output behaviour is unchanged. Every feature direction from the original basis is now scattered across thousands of neurons, and the new basis has directions that look just as clean to a fresh dictionary. Do the scattered directions in the transformed basis constitute the same features as in the original?
  *   **No:** Proceed to Leaf 3.
  *   **Yes:** Proceed to Q4.

  **Q4. The Orphaned Direction.**
  A linear probe reads property P off the activations at near-perfect accuracy, but ablating or patching that direction changes no output on any input, and no downstream component is sensitive to it. Does this inert direction still represent property P?
  *   **Yes:** Proceed to Leaf 4.
  *   **No:** Proceed to Q5.

  **Q5. The Granularity Case.**
  Training a dictionary of size *n* yields feature F; training one of size 4*n* on the same activations yields four finer features, each with its own causal profile, none of which is a superset or subset of another, and no principled criterion picks one granularity over the others. Are all four finer features equally real representations?
  *   **Yes:** Proceed to Leaf 5.
  *   **No:** Proceed to Q6.

  **Q6. The Unglossable Feature.**
  A direction is stable across inputs, causally efficacious and read out by several downstream components, but the best available description of its firing pattern is a list of ten thousand tokens with no unifying theme. Does this direction represent anything at all?
  *   **No:** Proceed to Leaf 6.
  *   **Yes:** Proceed to Q7.

  **Q7. The Cross-seed Divergence.**
  Two models trained on the same data with different seeds implement the same behaviour, but no direction in one maps to any direction in the other above chance alignment. Do both models possess the same representations of the world?
  *   **No:** Proceed to Leaf 7.
  *   **Yes:** Proceed to Leaf 8.

  **The Leaves**

  1.  **Eliminativism.** There are no representations in neural networks, only weights and activations.
      *   *Awkward commitment:* You must explain away the utility of representational talk without granting it any truth.
  2.  **Instrumentalist Fictionalism.** Representations are useful fictions for prediction, not ontological constituents.
      *   *Awkward commitment:* You must deny that successful interpretation reveals the system's internal structure.
  3.  **Interpreter-relative View.** Representations exist only relative to a chosen decomposition or an interpreter's predictive model.
      *   *Awkward commitment:* You must accept that changing the basis changes what the model represents.
  4.  **History/Selected Function View.** Content is fixed by training history or etiology, not current causal role.
      *   *Awkward commitment:* You must count vestigial structures as representations even if they do nothing.
  5.  **Pluralism about Levels.** Multiple granularities of description are simultaneously real and distinct.
      *   *Awkward commitment:* You must accept contradictory feature counts as equally true of the same system.
  6.  **Error-theoretic View.** Talk of representation is systematically false when human concepts fail to match features.
      *   *Awkward commitment:* You must claim interpreters are mistaken whenever features lack neat labels.
  7.  **Interventionist Realism.** Content is fixed by what interventions do locally, regardless of cross-model alignment.
      *   *Awkward commitment:* You must accept that two identical behaviours might rely on entirely different contents.
  8.  **Robust Representational Realism.** Features are mind-independent, basis-invariant, and universally alignable across models.
      *   *Awkward commitment:* You must bet on future methods finding perfect alignment where current ones fail.

  **Logical Space Analysis**

  The tree partitions the space into eight regions, though not all are densely populated. The combination of **Yes** to Q3 (Rebasement) and **No** to Q2 (Utility) is logically incoherent; if features are basis-invariant, they are typically claimed to be mind-independent, which implies truth beyond utility. Consequently, no named position occupies the path Q1-Yes, Q2-No, Q3-Yes. Similarly, the path Q1-Yes, Q2-Yes, Q3-No, Q4-No leads to a view that representations are mind-independent yet basis-dependent; this is merely unattractive and remains unexplored.

  **Instrumentalist Fictionalism** and the **Interpreter-relative View** overlap significantly in practice. Both deny mind-independent status to features. The tree separates them via Q2: Instrumentalists deny truth conditions entirely, while Interpreter-relativists allow truth relative to a stance. If a researcher holds that stance-relative truth is merely a species of utility, these leaves collapse.

  The tree cannot fully separate **Interventionist Realism** from **Robust Representational Realism** without Q7. If a researcher believes alignment exists but is currently undetectable, they fall into Robust Realism. If they believe alignment is unnecessary for content, they fall into Interventionism. A further case involving *adversarial alignment*—where models are forced to align but diverge semantically—would separate them more sharply.

  **Pluralism** is distinct from the **Interpreter-relative View** because Pluralism asserts all levels are real simultaneously (ontological abundance), whereas the Interpreter-relative view asserts reality is conditional on the choice (ontological relativity). However, if one argues that the 'choice' of granularity is the only variable, these views may converge.

  **Error-theoretic View** and **Eliminativism** are separated by Q1. Eliminativists deny the existence of representations entirely. Error-theorists grant the existence of the structural direction but deny the semantic claim (that it represents *something*). This is a subtle distinction; many error-theorists slide into eliminativism when pressed on what remains of a representation without content.

  **Closing Note**

  I am moderately confident that this tree partitions the space usefully for your group, particularly in isolating the basis-invariance commitment (Q3) which often lurks behind vague realism claims. The branch I am least confident about is Q6 (The Unglossable Feature), leading to the Error-theoretic View. It assumes that a lack of human description implies a failure of representation content, but a Robust Realist might argue the content exists merely unbeknownst to us. To change my mind on this split, I would need a case where a feature is causally specific yet permanently indescribable due to cognitive limits, forcing a choice between 'unknown content' and 'no content'. Currently, the tree treats this as a semantic failure rather than an epistemic one, which may conflate distinct worries.
