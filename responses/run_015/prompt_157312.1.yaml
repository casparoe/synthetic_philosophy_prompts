prompt: |-
  I help run a university effective-altruism group and I've been asked to give this term's ninety-minute intro session on cause prioritization. The room will be quantitatively literate newcomers who have already absorbed the standard three-factor decomposition — importance, tractability, neglectedness — from online write-ups and can recite it. I've read the standard posts and the standard pushback; I don't want the session to be a vocabulary lesson, and I suspect the recitation is exactly what stops people from being able to use the framework.

  So plan the session rather than writing it. I care most about three places where I think the usual treatment is wrong or silent. First, neglectedness as normally stated (roughly, how many resources already go here) looks like the wrong quantity: what does the work is whether my next unit of resources causes something that would not otherwise have happened, and a cause can be starved of funding while my dollar merely displaces another funder's, or crowded while one keystone input is the binding constraint. I want that taught, and I want it to fall out of the framework rather than arrive as a bolt-on fourth factor. Second, the framework returns different rankings depending on whether you apply it to a cause, an intervention, or the funding ecosystem as a whole, and I don't know which level to open with. Third, the three factors do not literally multiply: their units don't match and cost enters twice.

  Tell me what has to be in place before each of those can be raised and why, the one worked example that should carry the session and what it must have and lack (I've seen the many-people-mopping-one-spill picture and think it teaches the wrong thing), the mistakes this specific audience will make in the order they'll make them with the point in the sequence where each should be headed off, one closing question that would show me they can apply the framework rather than restate it, and what I should openly decline to cover in ninety minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** University EA group, 90-minute intro session on cause prioritization.
      *   **Audience:** Quantitatively literate newcomers. They *already know* the ITN (Importance, Tractability, Neglectedness) framework from online materials. They can recite it but likely can't *use* it effectively.
      *   **Goal:** Move beyond vocabulary/recitation to actual application and critical understanding.
      *   **Specific Constraints/Critiques to Address:**
          1.  *Neglectedness:* It's not just "how much is already spent," it's about *marginal* impact (counterfactuals, displacement, binding constraints). This needs to fall out of the framework, not be a 4th factor.
          2.  *Level of Analysis:* ITN gives different answers for Cause vs. Intervention vs. Ecosystem. Which level to start with?
          3.  *Mathematical Structure:* ITN doesn't literally multiply (units don't match, cost appears twice).
      *   **Deliverables:**
          1.  Prerequisites before raising each of the three critiques (and why).
          2.  The *one* worked example (criteria: what it must have/lack, avoiding the "many people mopping one spill" trope).
          3.  Anticipated mistakes (in order) and where to head them off.
          4.  One closing question (application > restatement).
          5.  What to explicitly *exclude* (scope management).

  2.  **Deconstruct the Three Critiques & Prerequisites:**

      *   *Critique 1: Neglectedness as Marginal Impact (not just stock).*
          *   *Why it's hard:* People think "Neglected = Good" automatically. They need to understand *why* we care about neglectedness (diminishing returns).
          *   *Prerequisite:* They need to grasp the concept of *marginal* vs. *average* impact first. They need to accept that resources have diminishing returns.
          *   *Timing:* Don't start here. Start with the intuition of ITN, then break it.

      *   *Critique 2: Level of Analysis (Cause vs. Intervention vs. Ecosystem).*
          *   *Why it's hard:* ITN is often presented as a property of a "cause area" (e.g., Global Health), but funding decisions are made on interventions or specific gaps.
          *   *Prerequisite:* They need to see ITN applied successfully at one level before seeing it fail at another.
          *   *Timing:* This is a structural framing issue. Best addressed early, but *after* establishing the basic intuition. Actually, it might be best to define the *unit of analysis* before applying the numbers.

      *   *Critique 3: The Math (Multiplication & Units).*
          *   *Why it's hard:* People treat ITN like a physics formula ($Impact = I \times T \times N$). It's actually a heuristic for expected value estimation.
          *   *Prerequisite:* They need to try to use the formula first and feel the friction.
          *   *Timing:* Late in the session, as a "debugging" step after they've tried to calculate something.

  3.  **Develop the Worked Example:**
      *   *Constraint:* Avoid "many people mopping one spill" (diminishing returns on labor). That's too simple and doesn't capture funding displacement or binding constraints.
      *   *Requirement:* Needs to show displacement, binding constraints, and level-of-analysis issues.
      *   *Idea:* **Vaccine Distribution vs. Vaccine R&D.**
          *   *Why:* It allows for clear distinction between "Cause" (Health), "Intervention" (Distributing X Vaccine), and "Constraint" (Cold Chain vs. Manufacturing).
          *   *Better Idea:* **AI Safety Research (Specific Subfield).**
          *   *Why:* High uncertainty, clear funding dynamics, easy to see "crowding" vs. "neglect."
          *   *Best Idea (for Quant Audience):* **A Specific Policy Change (e.g., Methane Regulation).**
          *   *Why:* Allows for cost-benefit analysis, clear actors, displacement (if gov does it, do NGOs need to?), and binding constraints (political capital vs. money).
          *   *Selection:* **Malaria Bednet Distribution vs. Malaria Vaccine R&D.** It's classic EA but allows for the nuance.
          *   *Wait, the prompt says "I've seen the many-people-mopping-one-spill picture."* I need something that isn't just labor diminishing returns.
          *   *Revised Selection:* **Funding a Specific Research Gap in Biosecurity.**
          *   *Why:* It highlights the "Neglectedness = Counterfactual" issue perfectly. If I fund this, does it displace another funder? Is the constraint money or talent? Is the cause neglected or just the specific niche?
          *   *Refinement:* Let's go with **Wild Animal Suffering (Research) vs. Factory Farming (Direct Advocacy).** No, too controversial.
          *   *Refinement:* **Climate Change: Carbon Removal vs. Policy Advocacy.**
          *   *Decision:* **A Specific Grant Opportunity in Global Health (e.g., Funding a specific drug trial phase).**
          *   *Actually, let's look for something that illustrates the "Displacement" issue best.*
          *   *Winner:* **The "Matching Grant" Scenario.**
          *   *Scenario:* A donor considers funding a $100k gap in a project.
          *   *Why:* It forces the counterfactual question immediately. If you don't fund, will someone else? (Neglectedness). What happens if the project succeeds? (Importance). How likely is success? (Tractability).
          *   *Wait, I need to address the "Level of Analysis" critique.*
          *   *Final Decision:* **The "AI Alignment Research Niche" Example.**
          *   *Reasoning:* It allows for "Cause" (AI Safety - Huge), "Intervention" (Specific Technical Paper - Tiny), and "Ecosystem" (Total Funding - Crowded but specific gaps exist). It fits a quant audience (uncertainty, probability).
          *   *Wait, let's make it more concrete.* **The "Malaria Vaccine Gavi Co-financing" Example.**
          *   *No, let's stick to the prompt's desire for "Marginal Impact."*
          *   *Best Example:* **A $1M Grant to a Specific Policy Think Tank.**
          *   *Why:* Money is the unit. Displacement is clear (other donors). Importance is policy change. Tractability is influence.
          *   *Actually, the prompt asks for ONE worked example that carries the session.*
          *   *Let's choose:* **Reducing Risk of Pandemic via Lab Safety Regulations.**
          *   *Why:*
              *   Importance: High (existential/global).
              *   Tractability: Variable (technical vs political).
              *   Neglectedness: The crux. Is it neglected money? Or neglected political capital? If you fund an NGO, does it displace gov funding?
              *   Levels: Cause (Pandemic Prep) vs Intervention (Specific Lab Regulation) vs Ecosystem (Total Biosecurity Funding).
              *   Math: Easy to show why $I \times T \times N$ fails (probability $\times$ impact $\neq$ dollars).

  4.  **Sequence the Mistakes:**
      1.  *Mistake:* Treating ITN as a checklist rather than a derivative. (Early)
      2.  *Mistake:* Confusing "Cause Area Neglect" with "Intervention Neglect." (Middle)
      3.  *Mistake:* Trying to multiply the scores without normalizing units. (Late)

  5.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Acknowledge they know the terms. Set the goal: "Debug the framework."
      *   *Phase 1: The Unit of Analysis (Addressing Critique 2).* Before calculating, what are we calculating *for*?
          *   *Prereq:* Need to agree that EA is about *marginal* decisions, not global assessments.
      *   *Phase 2: The Worked Example (Pandemic Lab Safety).* Walk through it.
      *   *Phase 3: The Neglectedness Trap (Addressing Critique 1).* Show how the example breaks if we just count dollars. Introduce counterfactuals.
      *   *Phase 4: The Math Problem (Addressing Critique 3).* Show why multiplication fails. Move to Expected Value language.
      *   *Closing:* The Application Question.
      *   *Exclusions:* Moral philosophy, specific cause area advocacy (don't sell X cause), career advice specifics.

  6.  **Refining the "Prerequisites" for the Critiques:**
      *   *For Neglectedness (Marginalism):* They must first accept that the goal is *change*, not *contribution*. They need to understand the "fungibility" of money/resources.
      *   *For Level of Analysis:* They must first see that ITN is stable at one level but volatile at another. They need a shared definition of "Intervention."
      *   *For The Math:* They must attempt to calculate a score and feel the absurdity of the units.

  7.  **Refining the Worked Example:**
      *   It needs to be *static* enough to analyze but *dynamic* enough to show displacement.
      *   *Example:* **Funding a specific lobbying effort to pass a specific bill.**
      *   *Why:*
          *   Importance: Impact of bill.
          *   Tractability: Probability of passing.
          *   Neglectedness: Counterfactual. If we don't lobby, will the bill pass anyway? Will another group lobby?
          *   Levels: Cause (Climate) vs Intervention (This Bill) vs Ecosystem (Climate Lobbying).
          *   Math: Cost is explicit ($). Impact is lives/$.
      *   *Wait, the prompt says "I've seen the many-people-mopping-one-spill picture."* This implies avoiding simple diminishing returns on labor.
      *   *Let's go with:* **The "Bridge Repair" Problem.**
      *   *No, too physical.*
      *   *Let's go with:* **The "Matching Fund" Problem.**
      *   *Scenario:* There is a $500k gap to unlock a $5M government commitment for deworming.
      *   *Why:*
          *   Importance: $5M worth of deworming.
          *   Tractability: High (money unlocks money).
          *   Neglectedness: Critical. If you don't pay, will another donor? (Displacement).
          *   Levels: Cause (Global Health) vs Intervention (This Gap).
          *   Math: Shows cost enters twice (cost of your dollar vs cost of the intervention).
      *   *Actually, I think the "Policy Lobbying" example is stronger for "Binding Constraints."*
      *   *Let's settle on:* **A Specific Biosecurity Policy Intervention.** (e.g., Funding a report to influence a specific regulatory body).
      *   *Must Have:* Clear cost, clear counterfactual donor, clear binding constraint (is it money or expertise?).
      *   *Must Lack:* Moral ambiguity (keep it technical), multiple competing interventions (keep it isolated).

  8.  **Finalizing the Structure:**
      *   *Pre-work:* Ensure they read the standard stuff (done).
      *   *Opening:* "You know the vocabulary. Now learn the grammar."
      *   *Segment 1 (Levels):* Define the "Marginal Dollar."
      *   *Segment 2 (Example):* Walk through the Biosecurity Policy example.
      *   *Segment 3 (Neglectedness):* Break the example with counterfactuals.
      *   *Segment 4 (Math):* Break the multiplication.
      *   *Closing:* The Question.

  9.  **Review against Constraints:**
      *   *90 Minutes:* Tight. Need to be disciplined.
      *   *Quant Audience:* Can handle the math critique.
      *   *Three Critiques:* All addressed.
      *   *Prerequisites:* Explicitly stated.
      *   *Mistakes:* Ordered.
      *   *Exclusions:* Defined.

  10. **Polishing the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Neglectedness" critique doesn't just become "Counterfactuals are hard." It needs to show how *standard* neglectedness fails.
      *   *Correction:* Ensure the "Level of Analysis" isn't just semantic. It needs to show how ranking changes.
      *   *Correction:* The "Math" critique needs to offer a better alternative (Expected Value), not just say "ITN is wrong."

  11. **Final Polish of the Plan:** (Aligning with the specific "Tell me what has to be in place..." instruction).
      *   Structure the response exactly as requested: Prerequisites, Worked Example, Mistakes, Closing Question, Exclusions.

      *(Self-Correction on the Worked Example)*: The prompt specifically warns against the "many people mopping one spill" picture. This is the classic diminishing returns example. I need an example that highlights *displacement* and *binding constraints* specifically.
      *   *Idea:* **The "Government Takeover" Scenario.**
      *   *Setup:* An NGO is piloting a program. It works. Government is considering adopting it.
      *   *Question:* Should you fund the NGO to expand, or fund advocacy to make the Gov adopt it?
      *   *Why:*
          *   Importance: Same outcome (people helped).
          *   Tractability: Different.
          *   Neglectedness: If you fund NGO expansion, does it crowd out Gov adoption? (Substitution). If you fund advocacy, is political capital the constraint or money?
      *   *This fits all three critiques perfectly.*

      *Let's refine this to be the "One Worked Example".*
      *   **Case:** "The Vitamin A Supplementation Handoff."
      *   **Context:** NGO proves efficacy. Gov budget exists but isn't allocated.
      *   **Decision:** Fund NGO direct delivery OR Fund advocacy to unlock Gov budget.
      *   **Why it works:**
          *   *Neglectedness:* Direct delivery looks neglected (no money there). Advocacy looks crowded (many lobbyists). BUT, if Gov budget is already allocated but stuck, advocacy is the binding constraint. If you fund delivery, you might let the Gov off the hook (displacement).
          *   *Levels:* Cause (Nutrition) is huge. Intervention (Delivery) is medium. Intervention (Advocacy) is small but leveraged.
          *   *Math:* Cost per life saved differs wildly. Multiplying I*T*N obscures the "Leverage" factor.

      *Okay, I have the plan.*

      *Wait, one more check on the "Math" critique.* "Cost enters twice."
      *   In ITN: Tractability often includes cost-effectiveness. Neglectedness includes total funding (which is sum of costs).
      *   If I say "Importance = Lives, Tractability = Lives/$, Neglectedness = $", then $I \times T \times N = Lives \times (Lives/$) \times \$ = Lives^2$. Dimensional analysis fails.
      *   I need to make sure the session highlights this dimensional mismatch.

      *Okay, ready to write.*
answer: |-
  Here is the session plan. It is designed to treat the ITN framework not as a formula to be memorized, but as a heuristic to be stress-tested.

  ### 1. Prerequisites for the Three Critiques
  You cannot raise these critiques immediately. You must first establish a shared baseline of intuition, then introduce friction.

  **Critique 1: Neglectedness as Marginal Impact (not Stock)**
  *   **What must be in place:** The group must first agree that the goal of EA is **counterfactual impact**, not **contribution**.
  *   **Why:** If they believe their goal is to "add resources to a cause," then standard neglectedness (total resources currently there) is sufficient. You must first secure agreement that the metric is "What happens if I *don't* act?" before you can explain why existing funding stock doesn't answer that.
  *   **When:** Minute 35. After applying the standard framework to the worked example and getting a "wrong" answer.

  **Critique 2: Level of Analysis (Cause vs. Intervention vs. Ecosystem)**
  *   **What must be in place:** A shared definition of the **unit of decision**.
  *   **Why:** If the room is debating "Is AI Safety important?" while you are analyzing "Is this specific grant important?", the framework will appear inconsistent. You need them to commit to evaluating a specific *marginal decision* (e.g., "Should *I* fund *X*?") before showing them how the rating changes if they zoom out to "Should *humanity* fund *AI Safety*?"
  *   **When:** Minute 15. Before the worked example begins. This sets the rules of the game.

  **Critique 3: The Math (Units and Multiplication)**
  *   **What must be in place:** A failed attempt to **calculate a score**.
  *   **Why:** Quantitative literate audiences trust formulas. If you tell them "don't multiply," they will ignore you. They must try to multiply a "1-10 scale" of Importance by a "dollar amount" of Neglectedness and feel the dimensional absurdity themselves.
  *   **When:** Minute 70. After they have used the framework to make a decision, and you are debugging *why* the calculation felt clunky.

  ---

  ### 2. The One Worked Example
  **The Scenario:** *The Government Handoff.*
  An NGO has piloted a low-cost malaria intervention (e.g., a specific drug regimen) in one district. It works. The national Ministry of Health has a budget line for this but hasn't allocated it yet due to bureaucratic inertia. There is a $500k gap.
  *   **Option A:** Fund the NGO to scale direct delivery in 5 more districts ($500k).
  *   **Option B:** Fund a policy advocacy team to pressure the Ministry to release the existing budget for nationwide rollout ($500k).

  **What it must HAVE:**
  1.  **Identical Outcomes:** Both options result in the same number of lives saved eventually. This isolates the *mechanism* from the *impact*.
  2.  **Explicit Counterfactuals:** It must be stated that if Option B fails, the government *might* still act later, or *might* never act. If Option A succeeds, the government might feel less pressure to act (fungibility/displacement).
  3.  **Binding Constraint Ambiguity:** It must be unclear whether the bottleneck is money (Option A solves this) or political capital (Option B solves this).

  **What it must LACK:**
  1.  **Moral Valence:** Do not use a cause area where people have strong prior identities (e.g., AI Risk or Animal Welfare). Keep it technical (Global Health Policy).
  2.  **The "Mopping Spill" Dynamic:** Do not make Option A look like "diminishing returns on labor." Make Option A look *effective* but potentially *substitutable*. The trap isn't that the work is useless; it's that it might displace government funding that would have otherwise happened.
  3.  **Multiple Interventions:** Do not compare Malaria vs. AI. Compare two pathways to the *same* goal. This forces the prioritization to rest entirely on the ITN mechanics, not on cause-area preference.

  **How it carries the session:**
  *   **Minute 15:** Apply standard ITN. Option A looks "more neglected" (less money currently there). Option B looks "more crowded" (many advocates).
  *   **Minute 35:** Introduce the counterfactual. If the Gov budget is already there, Option A's "Neglectedness" is an illusion; your dollar displaces the Gov dollar. Option B's "Crowding" is irrelevant if political capital is the binding constraint.
  *   **Minute 70:** Try to score them. Importance (Lives) is equal. Tractability (Probability) is different. Neglectedness (Dollars) is different. Why does multiplying them feel wrong? Because Cost is hidden in Tractability and Neglectedness.

  ---

  ### 3. Anticipated Mistakes (In Order)
  **1. The "Cause Area" Drift (Minute 20)**
  *   **The Mistake:** Students will start arguing about whether Malaria is more important than AI, ignoring the specific intervention constraints.
  *   **Where to head it off:** **Minute 15 (Level of Analysis).** Explicitly ban cause-area comparisons. Write on the board: *"We are not ranking Causes. We are ranking Marginal Dollars."* If they drift, point to the board.

  **2. The "Neglectedness = Good" Heuristic (Minute 40)**
  *   **The Mistake:** When you reveal the Government Budget exists, they will still rate Option A higher on Neglectedness because the *NGO's* budget is smaller than the *Advocacy* ecosystem. They will confuse "My niche is small" with "The problem is unsolved."
  *   **Where to head it off:** **Minute 35 (Marginal Impact).** Force the question: *"If I leave the room, does the money appear from elsewhere?"* If yes, Neglectedness is zero, regardless of current funding stock.

  **3. The "Dimensional Smuggling" (Minute 75)**
  *   **The Mistake:** They will try to normalize the scales (1-10) to make the multiplication work, pretending that a "10" in Importance is mathematically compatible with a "10" in Neglectedness.
  *   **Where to head it off:** **Minute 70 (The Math).** Ask them to write down the units. Importance = Lives. Neglectedness = Dollars. Tractability = Probability. Ask: *"What is a Life-Dollar-Probability?"* When they laugh, introduce Expected Value ($EV = P \times Impact - Cost$) as the actual engine under the hood.

  ---

  ### 4. The Closing Question
  Do not ask: *"What are the three factors?"*
  Do not ask: *"Which option was better?"* (They will just guess what you want to hear).

  **Ask this:**
  > "Imagine you are evaluating a donation to a fund that claims to be 'highly neglected.' What is the **one piece of evidence** you would demand to verify that your dollar isn't just displacing another funder's dollar, and how does that evidence change the 'Neglectedness' score?"

  **Why this works:**
  *   It requires them to identify the counterfactual (displacement).
  *   It requires them to link evidence to the framework (updating the score).
  *   It cannot be answered by reciting definitions; it requires applying the "Marginal Impact" critique you taught.

  ---

  ### 5. What to Openly Decline to Cover
  To make 90 minutes work, you must explicitly subtract topics. Tell them *why* you are cutting these at the start.

  1.  **Moral Uncertainty / Weighting:** "We are not discussing how to weigh human lives against animal lives or future generations today. We are assuming a fixed goal and optimizing the path." (Prevents philosophical drift).
  2.  **Career Advice:** "This framework applies to funding decisions. Applying it to your career adds constraints like 'personal fit' and 'skills acquisition' which break the simple model. We will not cover that today." (Prevents the most common category error).
  3.  **Specific Cause Endorsements:** "I am not here to convince you that X cause is the best. I am here to give you the tool to decide that for yourself. I will not be advocating for a specific charity." (Maintains neutrality and focus on the framework).

  ### Session Flow Summary (90 Mins)
  *   **00-10:** Intro & Scope (What we are *not* doing).
  *   **10-15:** **Prerequisite 2:** Define Unit of Analysis (Marginal Dollar).
  *   **15-35:** Worked Example (The Government Handoff) using *Standard* ITN.
  *   **35-55:** **Critique 1:** Break Neglectedness (Counterfactuals & Displacement). Re-evaluate Example.
  *   **55-65:** Break: Discussion in pairs on the "Evidence" question.
  *   **65-80:** **Critique 3:** Break the Math (Units & EV).
  *   **80-90:** Closing Question & Wrap-up.
