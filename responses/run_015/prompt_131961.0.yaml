answer: |-
  You have hit on a genuinely subtle and important distinction in the philosophy of mind and cognitive science. Your intuition is correct: the classic "Extended Mind" case (Otto and his notebook) is fundamentally different from the "Fridge Calendar" case, even though both involve an external object storing information.

  Here is the breakdown of what this is, what it isn't, and where the line is drawn.

  ### 1. The Name: Transactive Memory Systems
  The specific term for the setup you are describing is a **Transactive Memory System (TMS)**.

  Proposed by psychologist Daniel Wegner in 1985, TMS describes a group of individuals who share the cognitive labor. It isn't just that we *share* information; it's that we share a directory of *who knows what*.
  *   **In your case:** You do not store the date of the dentist. You store the meta-knowledge: *"My partner stores the date of the dentist."*
  *   **The mechanism:** When you need the info, you don't query your biological memory; you query your partner (or the artifact they maintain).

  This fits your description perfectly: "I endorse her, and she endorses it." In TMS, the memory is not in the object, nor solely in your head, nor solely in her head. It exists in the **transactional link** between you.

  ### 2. What Exactly Is This? (The Triadic Relationship)
  You noted that the classic "Extended Mind" thesis feels different. You are right because the structure of trust is different.

  *   **Extended Mind (Clark & Chalmers):** This is a **Dyadic** relationship (Mind ↔ Object).
      *   *Example:* Otto's notebook. Otto writes in it; Otto reads from it. The notebook is treated as a literal part of Otto's biological cognitive process. If the notebook lies, Otto's mind is corrupted directly. The trust is in the *reliability of the process*.
  *   **Your Fridge Calendar:** This is a **Triadic** relationship (Mind ↔ Person ↔ Object).
      *   *Example:* You ↔ Partner ↔ Calendar.
      *   The calendar is not a part of *your* mind. It is an output of *her* mind. You are relying on her agency. If the calendar is wrong, you don't blame the pen or the fridge; you blame the communication or her update process.

  This is technically a form of **Epistemic Dependence**. You are depending on another agent for justification of your belief. Philosophers like John Hardwig argue that much of what we "know" is actually just trusted testimony from others. Your calendar is simply **reified testimony**. It is her testimony, written down, persisting over time.

  ### 3. What Nearby Things It Isn't
  You mentioned **Distributed Cognition**. You were right to feel that label was slightly off.
  *   **Distributed Cognition (Hutchins):** This usually looks at the *system level* (e.g., a ship navigation team). It asks, "Where is the computation happening?" and answers, "In the whole system." It tends to flatten the individuals into nodes.
  *   **Why TMS is better for you:** TMS preserves the *individuality* of the agents. It acknowledges that *you* don't know the info, *she* does, and the specific social bond is what makes the knowledge accessible to you. Distributed Cognition describes the flow; Transactive Memory describes the *social contract* enabling the flow.

  It is also **not** the **Extended Mind Thesis**.
  *   In Extended Mind, if you lost the notebook, you would be cognitively impaired in the same way as brain damage.
  *   In your Fridge case, if the calendar disappears, you aren't cognitively impaired; you are *socially disconnected*. You have to call your partner. The "memory" is still alive in her; the link is just broken.

  ### 4. Where Do You Draw the Line? (The "Unknown Maintainer" Test)
  You asked: *Is it still the same thing if I had no idea who maintains it, only that somebody does?*

  **No. That changes the category entirely.**

  *   **Scenario A (You know it's her):** This is **Interpersonal Epistemic Trust**.
      *   Your justification for believing "Dentist on Tuesday" is: "Sarah is reliable, and Sarah wrote this."
      *   If the info is wrong, the normative failure is interpersonal (Sarah let you down).
      *   This is **Transactive Memory**.

  *   **Scenario B (You don't know who maintains it):** This is **Institutional/Systemic Trust**.
      *   Your justification becomes: "This is the Official Calendar; Official Calendars are usually right."
      *   You are no longer relying on a specific mind you have a relationship with. You are relying on a *process*.
      *   This moves you closer to the **Extended Mind** or pure **Distributed Cognition**. The object becomes a "black box." You treat the calendar as a brute fact of the environment, like a traffic light. You don't need to know who wired the traffic light to trust it; you trust the *system* that maintains it.

  ### Summary
  *   **The Label:** Transactive Memory System (TMS).
  *   **The Structure:** Triadic (You → Partner → Object), not Dyadic (You → Object).
  *   **The Trust:** It is **Epistemic Dependence** on a specific agent, not integration of a tool.
  *   **The Line:** If you remove the knowledge of *who* maintains it, the relationship shifts from **Interpersonal Trust** (TMS) to **Systemic Reliance** (Extended Mind/Distributed Cognition).

  You have essentially identified that the "Extended Mind" thesis often smuggles in social trust without acknowledging it. In the real world, most "external memory" is actually "social memory." You aren't extending your mind into the fridge; you are extending your social network onto the fridge.
