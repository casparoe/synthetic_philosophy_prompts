answer: |-
  To adjudicate the timing of consciousness via the Color Phi phenomenon, a theory must meet these desiderata:

  1.  **Objective Timing:** Define when an experience occurs via neural or functional markers, not subjective report. Subjects misjudge timing; theory cannot rely on their verdict as definition.
  2.  **Interval Verdict:** Specify whether neural activity during the inter-stimulus interval constitutes experience. The criterion must be principled (e.g., recurrent processing), not ad hoc.
  3.  **Temporal Separation:** Distinguish time *of* experience (vehicle), time *represented* (content), and time of report (behavior).
  4.  **Modality Generality:** Explain the Cutaneous Rabbit without vision-specific mechanisms. Tactile latency differences must be handled analogously to visual motion.
  5.  **Backward Referral:** Accommodate Libet-style latency compensation without violating causality.
  6.  **Double-Entry Handling:** Accept or reject multiple registrations. If rejected, demonstrate logical collapse into Orwellian or Stalinesque.

  **Meta-Questions**

  1.  **Non-negotiable vs. Preference:** Objective Timing and Temporal Separation are non-negotiable; without them, the question is meaningless. Empirical decidability is a preference; some argue the distinction is conceptual. Introspective authority is a preference—and a dangerous one, given temporal illusions.
  2.  **Joint Unsatisfiability:** Objective Timing and Introspective Authority are jointly unsatisfiable. If neural correlates dictate experience time, subjective reports of timing are fallible data, not truths. A theory cannot privilege both when they conflict.
  3.  **Most Exclusionary Requirement:** Objective Timing. Most candidate theories implicitly define experience time by report time. Demanding independent neural criteria eliminates behaviorist and pure phenomenological accounts.
  4.  **No Fact of the Matter:** Legitimate only if the theory dissolves the presupposition of a singular "finish line" for experience (e.g., Multiple Drafts). If chosen, the theory must explain why the Orwellian/Stalinesque intuition arises despite having no referent. It owes us an error theory for the intuition of a definite timing.

  **Predictive Requirement**

  Run the Color Phi sequence with a random-dot mask at 0–250ms post-second-flash. Probe for motion completion and midpoint color.

  *   **Orwellian Support:** Mask at 50ms yields report of "Red dot, then Green dot" (no motion). Mask at 200ms yields "Moving dot, color change." (Early mask interrupts revision; late mask allows it).
  *   **Stalinesque Support:** Mask at 50ms yields "Nothing" or fragmented flashes (no distinct dots). Mask at 200ms yields "Moving dot." (Early mask interrupts construction; late mask allows it).
  *   **Double-Entry Support:** Mask at 50ms yields "Moving dot" but "No color change" (white/gray midpoint). (Coarse path survives; detailed path masked).

  **Indiscriminability Flag:** If masking affects report availability but not experience content identically across models, the desiderata list fails. If no pattern discriminates, Objective Timing must be revised to acknowledge that "experience time" is not a point-process but a distributed window, rendering the Orwell/Stalin dichotomy false.

  **Classic Failures:** Orwellian models struggle to explain why revision feels seamless rather than corrective. Stalinesque models struggle to explain neural latency without implying a homunculus waiting for data.
