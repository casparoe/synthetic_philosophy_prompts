      *Decision:* I'll stick close to these but tailor the language to the prompt's specific phrasing about scaffolding and rigging.

  9.  *(Final Polish on the Ines Application)*: The prompt asks about "Joint Attention." I need to make sure I use that term and explain why Nuñez lacks it. Nuñez tries to lead; the blind want him to follow. Ines's partner tries to lead; Ines needs to integrate. The friction is the scene.

  10. *(Final Polish on the Ending)*: The rockslide. Is it sentimental? Yes. It wipes the slate clean so Wells doesn't have to decide if Nuñez was right. It's a narrative cowardice that protects the philosophical ambiguity. I should call that out.

