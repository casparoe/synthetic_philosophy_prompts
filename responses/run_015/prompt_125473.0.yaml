      *   "Don't bother with exact quotes." -> Keep it conceptual.
      *   "Skip the Locke/Berkeley greatest hits." -> Focus on the stakes.

  8.  *(Self-Correction on the "Five Ways")*: Make sure they are distinct enough.
      1.  The Classical Empiricist (Sensory Association).
      2.  The Social Epistemologist (Scaffolding/Community).
      3.  The Phenomenological (Lived Experience/Body).
