answer: |-
  This is a sharp observation, and you are right to sense that standard taxonomies (fundamental/derived, accidental/nomic) slice across this distinction rather than capturing it. You are identifying a functional and modal difference in how physical principles operate.

  In the philosophy of physics literature, there isn't one single agreed-upon term, but there are three overlapping frameworks that get at different facets of what you're describing. None fit perfectly without qualification, which is likely why you feel the gap.

  Here are the nearest established concepts, how they differ from your description, and an analysis of the edge cases.

  ### 1. Meta-laws (Marc Lange)
  The strongest contemporary philosophical match is Marc Lange's distinction between **ordinary laws** and **meta-laws**.

  *   **The Concept:** In *Laws and Lawmakers* (2009) and *Because without Cause* (2016), Lange argues that symmetry principles and conservation laws possess a stronger variety of "natural necessity" than dynamical laws. They are laws *about* the laws. They constrain what the first-order dynamical laws can look like.
  *   **Why it fits:** It captures the **robustness** you noted. Dynamical laws (like Newton's force law) could have been different while still obeying conservation of momentum. The conservation law holds across the space of possible dynamical laws. It also captures the **explanatory direction**: We often explain the dynamical law by appealing to the symmetry/conservation, not vice versa, even if the math derives one from the other.
  *   **Where it differs:** Lange insists these *do* govern, just at a higher order. You expressed skepticism about "governing" for laws that "never push anything along." Lange would argue they govern the *form* of the interaction, whereas you seem to be looking for a category that explicitly *lacks* productive causal power.
  *   **The Edge:** For Lange, a meta-law must be sub-nomic stable (hold across counterfactuals). If GR lacks global energy conservation, Lange would argue energy conservation isn't a meta-law in GR, which aligns with your cosmology friend's point.

  ### 2. Principle vs. Constructive Theories (Einstein)
  This is the historical ancestor of your distinction.

  *   **The Concept:** In a 1919 letter to *The Times*, Einstein distinguished **constructive theories** (which build up complex phenomena from simple entities, e.g., kinetic theory) from **principle theories** (which start from empirically observed general constraints, e.g., thermodynamics, SR).
  *   **Why it fits:** It captures the **methodological role**. Principle theories work by elimination ("what can't happen"). They are durable and negative. Special Relativity is a principle theory based on the light postulate and relativity principle; it constrains all possible dynamics.
  *   **Where it differs:** Einstein's distinction applies to whole *theories*, not individual laws within a theory. You can have a principle theory (SR) containing dynamical laws (Lorentz force). You are isolating specific *propositions* (Pauli, Energy) that function like principle theories within a broader constructive framework (QFT).
  *   **The Edge:** The Second Law of Thermodynamics is Einstein's paradigmatic example of a principle. However, in statistical mechanics, it is often reduced to a constructive/dynamical explanation (Boltzmann). Your category seems to require the constraint to remain operative even when the constructive underpinning is unknown or intractable.

  ### 3. Kinematical vs. Dynamical Constraints
  This is the standard working distinction in mathematical physics, but it is often used loosely.

  *   **The Concept:** **Kinematics** defines the space of possible states (the stage); **Dynamics** defines the trajectory through that space (the play).
  *   **Why it fits:** The Uncertainty Principle and Pauli Exclusion are often viewed as kinematical constraints on the state space (Hilbert space structure), whereas the Schrödinger equation is dynamical. Conservation laws are trickier; in Hamiltonian mechanics, they are first integrals of motion (dynamical), but they define the accessible sub-manifold of phase space (kinematical-ish).
  *   **Where it differs:** In many formalisms, conservation laws are derived from dynamics via Noether's Theorem. If they are derived, they are technically dynamical consequences. Your intuition is that they *feel* more fundamental than the dynamics they are derived from. The kinematical/dynamical distinction doesn't always capture this modal robustness; it's often just a mathematical bookkeeping distinction.
  *   **The Edge:** In GR, the distinction blurs. The Einstein Field Equations are dynamical, but the Bianchi identities (which ensure energy-momentum conservation) are geometric identities. This supports your view that when the geometry (symmetry) goes, the constraint goes.

  ### The Humean Worry: Theorems vs. Axioms
  You raised a crucial point about the Best System Analysis (BSA). If conservation laws are derivable from symmetries + dynamics, they are theorems of the best system.
  *   **The Problem:** In strict Lewisian Humeanism, there is no metaphysical distinction between axioms and theorems of the best system. Both are just summaries of the Humean Mosaic.
  *   **The Tension:** Your intuition (and Lange's) is that conservation laws have a *different modal status* than the force laws they constrain. A Humean must explain this difference pragmatically (e.g., conservation laws are more useful for systematization across different specific worlds). An Anti-Humean (Dispositionalist or Primitivist) can say conservation laws reflect deeper metaphysical necessities (symmetries of space-time itself).
  *   **Governing:** If you are an Anti-Humean, the "governing" worry is real. How does a negative constraint govern? One solution is **Dispositionalism**: The system has a disposition to evolve, but the state space has a "structural disposition" to forbid certain configurations. The constraint doesn't push; it *resists*.

  ### Edge Case: The Second Law of Thermodynamics
  Is the 2nd Law in your box?
  *   **Argument for Yes:** It is used primarily to rule out processes (perpetual motion machines). It is incredibly robust across theory change (holds in CM, QM, QFT, GR). It often works by elimination when dynamics are too complex.
  *   **Argument for No:** It is statistical. It is not a hard constraint on *histories* (fluctuation theorems allow entropy decrease over short times/small scales), whereas Energy Conservation (in flat space) is exact. Pauli Exclusion is exact.
  *   **Verdict:** It sits on the boundary. It is a **probabilistic constraint** rather than a **structural constraint**. Your category seems to demand exactness (nomic necessity). If you include the 2nd Law, your category must accommodate statistical necessity. If you exclude it, your category is strictly about *symmetry/topology of state space*.

  ### Proposed Terminology: "Structural Constraints" vs. "Generative Laws"

  Since existing terms carry baggage (Meta-laws implies hierarchy; Kinematical implies math status; Principle implies theory type), I suggest refining the distinction as **Structural Constraints** vs. **Generative Laws**.

  **Definition:**
  A **Structural Constraint** is a physical principle that:
  1.  **Delimits Possibility:** It defines the topology or geometry of the state space (what histories are *accessible*), rather than selecting a specific trajectory within that space.
  2.  **Exhibits Modal Robustness:** It remains invariant under changes to the specific interaction terms (dynamics) of the theory, often surviving theory change because it is tied to the representation of the system (e.g., Hilbert space structure, manifold geometry) rather than the content.
  3.  **Operates Negatively:** Its predictive power is exercised via elimination (ruling out candidates) rather than generation (calculating the next step).

  **Borderline Cases & Classification:**

  | Principle | Classification | Reasoning |
  | :--- | :--- | :--- |
  | **Conservation of Energy (Flat Space)** | **Structural Constraint** | Tied to time-translation symmetry. Survives change from CM to QM. Rules out histories. |
  | **Conservation of Energy (GR)** | **Not a Constraint** | No global time-translation symmetry. The constraint dissolves with the symmetry. |
  | **Pauli Exclusion** | **Structural Constraint** | Constraint on the multi-particle state space (antisymmetry). Kinematical in QFT. |
  | **Heisenberg Uncertainty** | **Structural Constraint** | Follows from non-commutativity of operators (structure of Hilbert space), not Hamiltonian. |
  | **Schrödinger Equation** | **Generative Law** | Determines the specific trajectory through the allowed state space. |
  | **2nd Law of Thermodynamics** | **Hybrid / Statistical Constraint** | Functions as a constraint, but is probabilistic and emergent from dynamics (usually). |
  | **Speed of Light Limit ($c$)** | **Structural Constraint** | Defines the causal structure of the manifold. Nothing moves *because* of it; it defines *where* movement is possible. |

  ### Why this matters for your Humean debate
  If you adopt this distinction, you can challenge the Humean Best System view.
  *   **The Challenge:** In BSA, axioms and theorems are on par. But **Structural Constraints** function differently in scientific practice than **Generative Laws**. We trust Structural Constraints *more* when they conflict with a proposed Generative Law (we assume the dynamics are wrong, not that energy is not conserved).
  *   **The Anti-Humean Move:** This differential trust suggests a metaphysical difference. Structural Constraints reflect the **modal structure of reality** (what is possible), whereas Generative Laws reflect the **causal powers within that structure** (what happens).
  *   **Governing:** Structural Constraints don't "govern" in the sense of a police officer directing traffic (pushing). They govern in the sense of **guardrails** on a mountain road. They don't make the car move, but they determine which paths are survivable. This resolves your "pushing" worry: governing can be *restrictive* rather than *productive*.

  ### Summary for your Thesis
  You are describing the distinction between **constraints on the space of possibilities** (Structural Constraints/Meta-laws) and **rules for evolution within that space** (Generative Laws/Dynamical Equations).

  While **Lange's "Meta-laws"** is the closest philosophical term, it carries a commitment to a specific hierarchy of necessity you might not want. **"Principle"** is too historical. **"Kinematical"** is too mathematical.

  I recommend using **Structural Constraints**, explicitly contrasting them with **Dynamical Generators**. This allows you to keep the Humean debate open (are structural constraints just efficient summaries?) while acknowledging the distinct epistemic and functional role they play in physics practice (robustness, negative prediction, theory survival).

  **One final caution:** Be careful with Noether's Theorem. It derives conservation from symmetry + action. A Humean will say "See? They are theorems of the dynamics." Your counter-argument must be that the *Symmetry* is the Structural Constraint, and the Conservation Law is its shadow. The Symmetry is what survives theory change, not necessarily the specific conservation quantity (as GR shows). The constraint is on the *form* of the Lagrangian, not the trajectory.
