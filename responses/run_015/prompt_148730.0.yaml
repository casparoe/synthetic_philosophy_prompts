answer: |-
  Right, so this is a proper philosophical head-scratcher, and you've hit on one of the classic tensions in the art world. It feels contradictory because on the surface, it looks like they're obsessed with the 'truth' only when it's convenient, but if you dig into the hidden philosophy, it's actually remarkably consistent. It just relies on a definition of 'art' that most of us don't use in everyday life.

  Here's the reconstruction of what's actually going on in the conservator's head.

  **The Hidden Philosophy: Indexicality and the Relic**

  The view presupposed here isn't that art is about producing a beautiful image. If it were, your point would be spot on: keep the pretty version, bin the ugly one. Instead, the museum operates on a philosophy of **indexicality**.

  Think of an original painting less like a picture and more like a fingerprint or a footprint. If you find a footprint in the mud, the value isn't in the shape of the foot (which you could copy perfectly in plaster); the value is that *this specific patch of mud was pressed by that specific person at that specific moment in history*.

  When conservators scrape off the 'better' forgery to reveal the 'ruined' original, they are prioritising **material authenticity**. They believe the value lies in the physical substrate that the artist's hand actually touched. Even if it's a mess, it's a historical witness. It's a relic. To keep the forgery would be to display a lie about history, even if the lie looks nicer.

  Conversely, when the original is lost and only the forgery survives, they label it a fake because it lacks that indexical link. It's a copy of a footprint, not the footprint itself. It doesn't testify to the master's existence, only to the forger's skill.

  So, to answer your question: it's primarily about the **artist's actual hand** and the **object's history**, rather than avoiding deception per se. Avoiding deception is just the side effect of caring about historical testimony.

  **Is It Consistent?**

  Actually, yes. It feels inconsistent because you're looking at the *visual experience*, but the museum is looking at the *ontological status* (what the object fundamentally is).

  The rule they're following is: **Priority of Original Matter.**

  *   **Scenario A (Original underneath):** The original matter exists. Therefore, remove the non-original matter (the forgery) to display the original matter, regardless of aesthetic quality.
  *   **Scenario B (Original lost):** The original matter does not exist. The object in front of them is non-original matter. Therefore, it cannot be displayed as the original work.

  It's consistent because the physical canvas is the hero of the story, not the image. If the hero is dead (Scenario B), you can't pretend the stunt double is the hero. If the hero is just injured and wearing a mask (Scenario A), you take the mask off.

  **What If We Changed the Policy?**

  Now, this is where it gets interesting. If we decided that a perfect replica is just as valuable as the original, we'd be shifting from a philosophy of **Authenticity** to a philosophy of **Aesthetic Functionalism**. This would mean the value lies in the visual experience and the ideas conveyed, not the specific atoms of paint.

  If museums adopted this view, policy would have to change drastically:

  1.  **De-accessioning and Swapping:** Museums could sell fragile originals to private collectors and hang perfect, light-resistant replicas in their place. This would actually protect the art from degrading under gallery lights. The National Gallery could hang a 'perfect' Van Gogh that never fades, whilst the real one sits in a dark vault.
  2.  **Restoration Ethics:** Conservators wouldn't need to scrape off old overpainting if it improved the visual experience. If a 17th-century touch-up makes a Raphael look complete, you keep it. The goal becomes 'visual integrity' rather than 'material purity'.
  3.  **The End of the 'Blockbuster' Exhibition:** Why ship a fragile Mona Lisa across the world when a scan and print could look identical to the viewer? The 'aura' of being in the same room as the object would vanish as a requirement.
  4.  **Re-evaluating Forgeries:** A skilled forgery that captures the 'essence' of the artist might be hung alongside the originals, labelled by date of creation rather than authenticity. A Han van Meegeren fake Vermeer might be treated as a valid interpretation of Vermeer's style, rather than a criminal deceit.

  **The Verdict**

  The reason museums don't do this is that they see themselves as archives of human history, not just galleries of pretty images. They reckon that the 'magic' of art is tied to the human encounter across time. If you remove the physical link to the past, you turn the museum into a cinema.

  So, whilst your intuition that it feels a bit daft to show a ruined mess over a beautiful copy is totally understandable, the museum's logic holds up—provided you agree that a painting is a historical document first and an image second. If you think a painting is primarily an image, then the whole system is indeed barmy.

  Hope that helps you get unstuck. It's a brilliant topic, so good luck with the project.
