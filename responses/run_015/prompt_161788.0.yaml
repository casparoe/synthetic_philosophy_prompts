  ### TECHNICAL NOTE FOR THE CHAIR (META-ANALYSIS)

  **Inert Distinctions:** The distinctions regarding "currency of desert" (fixed vs. natural) and "comparative vs. non-comparative" did no work; they collapsed into the **Internal/External** split (Q1) and the hiring context (which is inherently comparative). The distinction on "desert under unjust rules" was absorbed by **Leaf B** (Institutional Desert).

  **Placement of Legitimization Critique:** I placed the critique that "meritocracy legitimizes hierarchy" as **Q3**, leading to **Leaf C**. **Cost:** Putting it there costs you the ability to capture members who view the hierarchy as morally illegitimate *regardless* of institutional mission (e.g., radical egalitarians), framing their objection instead as institutional self-sabotage.

  **Unoccupied Logical Space:** The combination of **External/Arbitrary (Q4)** + **Stop Claiming (Q5)** + **Effort Basis (Q6)** is unoccupied. It is **incoherent**: one cannot claim luck makes talents undeserved while simultaneously claiming effort (which relies on those talents) grounds desert without compensation. The combination of **Internal** + **Ratchet=Corrupting** + **Stabilizes** is **unattractive**: it admits corruption but accepts it for stability, which few will defend openly.

  **Indistinguishable Leaves:** **Leaf A (Consequentialist)** and **Leaf B (Institutional)** may be hard to separate in practice; both accept institutional metrics, differing only on whether those metrics track "truth" or "utility."
