answer: |-
  # WORKING GROUP DIAGNOSTIC: MERIT AND ALLOCATION

  **Shared Starting Point:** University places and academic jobs must not be allocated arbitrarily; a reason must be offerable for who gets them.

  **Instructions:** Follow the path that best matches your view. Answer the questions as they apply to *moral justification*, not current policy.

  ---

  ### Q1. SOURCE OF THE CLAIM
  **When we say a candidate "deserves" a place, is that because they fit our institutional rules best, or because they have a moral claim independent of our rules?**
  *   **Fit our rules best:** Go to **Q2**.
  *   **Moral claim independent:** Go to **Q4**.

  ### Q2. THE PROXY RATCHET
  **When we use scores or citations to judge candidates, do these measures eventually become the merit itself, or do they remain mere evidence of a deeper quality?**
  *   **Remain mere evidence:** Go to **Leaf A**.
  *   **Become the merit itself:** Go to **Q3**.

  ### Q3. INSTITUTIONAL LEGITIMACY
  **If credentials become merit themselves, does this process stabilize the institution or undermine its long-term mission by cementing hierarchy?**
  *   **Stabilizes:** Go to **Leaf B**.
  *   **Undermines:** Go to **Leaf C**.

  ### Q4. THE ROLE OF LUCK
  **Do advantages like native intelligence or wealthy upbringing give a candidate a stronger moral claim to a place?**
  *   **Yes:** Go to **Q6**.
  *   **No (they are arbitrary):** Go to **Q5**.

  ### Q5. REMEDY FOR ARBITRARINESS
  **If such advantages are morally arbitrary, should we try to neutralize their effect or stop claiming desert based on them entirely?**
  *   **Neutralize their effect:** Go to **Leaf D**.
  *   **Stop claiming desert:** Go to **Leaf E**.

  ### Q6. BASIS OF DESERT
  **For those who do have a moral claim, is it based on what they *tried* to do or what they *achieved*?**
  *   **What they tried (Effort):** Go to **Leaf F**.
  *   **What they achieved (Product):** Go to **Leaf G**.
  *   **Who they are (Character):** Go to **Leaf H**.

  ---

  ## DIAGNOSTIC LEAVES

  **Leaf A: Consequentialist / Incentive View**
  *   **View:** Desert talk is a useful fiction to drive behavior; institutions select for outcomes, not moral worth.
  *   **Awkward Commitment:** You must admit that a candidate who "deserves" nothing morally can still rightly get the job.
  *   **Legacy Preferences:** Depends (if useful).
  *   **Drop Standardized Tests:** No (if predictive).
  *   **Weight for Seniority:** Yes (if incentivizes retention).
  *   **Awards for Effort:** Depends (if incentivizes effort).

  **Leaf B: Institutional Desert**
  *   **View:** Desert is wholly institution-dependent; rules create the merit they measure.
  *   **Awkward Commitment:** You cannot criticize the institution's rules as "unjust" from the outside, only as inefficient.
  *   **Legacy Preferences:** Split (if rules allow).
  *   **Drop Standardized Tests:** No (if rules require).
  *   **Weight for Seniority:** Yes (if rules specify).
  *   **Awards for Effort:** Split (if rules specify).

  **Leaf C: Meritocracy as Self-Defeating**
  *   **View:** The proxy ratchet corrupts selection, legitimizing a hierarchy that undermines the university's mission.
  *   **Awkward Commitment:** You must advocate for selection criteria that may appear "arbitrary" to break the ratchet.
  *   **Legacy Preferences:** No.
  *   **Drop Standardized Tests:** Yes.
  *   **Weight for Seniority:** No.
  *   **Awards for Effort:** Yes.

  **Leaf D: Luck Egalitarianism**
  *   **View:** Luck defeats desert claims, so institutions must compensate for unequal starting points.
  *   **Awkward Commitment:** You must support penalizing the naturally gifted or advantaged to level the field.
  *   **Legacy Preferences:** No.
  *   **Drop Standardized Tests:** No (but adjust scores).
  *   **Weight for Seniority:** Split.
  *   **Awards for Effort:** Yes.

  **Leaf E: Rawlsian**
  *   **View:** Natural talents are common assets; no one deserves the traits from which contributions flow.
  *   **Awkward Commitment:** You cannot say the "best" scholar deserves the job, only that their hiring helps the least advantaged.
  *   **Legacy Preferences:** No.
  *   **Drop Standardized Tests:** Yes (unless they help the least advantaged).
  *   **Weight for Seniority:** Split.
  *   **Awards for Effort:** No.

  **Leaf F: Effort-Based Desert**
  *   **View:** Desert is grounded in trying or the exercise of the will, not outcomes.
  *   **Awkward Commitment:** You must prefer a hard-working mediocre scholar over a lazy genius.
  *   **Legacy Preferences:** No.
