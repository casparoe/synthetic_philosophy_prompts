      *   If the meaning is purely private (ostensive definition to oneself), the connection between the sign and the sensation is established by an internal act. That act cannot be validated by an external record because the record itself requires interpretation based on the very rule being questioned.

  4.  **Formulate the Core Philosophical Objection:**
