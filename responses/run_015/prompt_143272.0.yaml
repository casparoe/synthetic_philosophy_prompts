answer: |-
  A robust theory of rational deference to objective chance must do more than assert that credence should match chance (the Principal Principle). It must navigate the gap between metaphysical chance and epistemic access, handle dynamic updating, and avoid logical contradictions arising from the nature of time and supervenience.

  Below is the full desiderata list, organized by function, followed by an analysis of the specific cases, hard constraints, and the impossibility results that constrain the space of viable theories.

  ### I. The Desiderata List

  | Category | Desideratum | Description & Rationale |
  | :--- | :--- | :--- |
  | **Alignment** | **Conditional Deference** | $C(A \mid Ch(A)=x \ \& \ E) = x$. Credence in $A$, conditional on the chance of $A$ being $x$ and admissible evidence $E$, must be $x$. |
  | | **Admissibility Filter** | Must define which evidence $E$ is "admissible." Evidence about the *outcome* of $A$ is inadmissible; evidence about the *setup* of $A$ is admissible. The theory must non-circularly distinguish these. |
  | | **Temporal Indexing** | Must handle $Ch_t(A)$ (chance at time $t$). Deference must be to the chance *at the time of the credence*, not a timeless chance, to allow for chance evolution (e.g., a coin in flight). |
  | **Epistemic Access** | **Theory-Outcome Separation** | Must allow an agent to learn the chance law (e.g., QM wavefunction) without knowing the outcome. Deference should not require knowing the result to validate the probability. |
  | | **Reference Class Resolution** | Must specify how to identify the correct chance setup. If an event falls under multiple descriptions (e.g., "this coin toss" vs. "tosses by a magician"), the theory must dictate which chance function governs deference. |
  | | **Higher-Order Uncertainty** | Must handle uncertainty *about* the chances. If I am 50% sure $Ch(A)=0.5$ and 50% sure $Ch(A)=0.9$, my credence should be the weighted average (0.7), not undefined. |
  | **Metaphysical** | **Undermining Immunity** | Must avoid contradiction when present chances assign non-zero probability to futures that would make the present chances different (the "Undermining Future" problem). |
  | | **Supervenience Compatibility** | If chances supervene on the Humean mosaic (patterns of events), the deference rule must not force the agent to assign zero credence to the actual mosaic (which would happen if the mosaic undermines the chance). |
  | | **Internal/External Coherence** | Must work for agents *inside* the chance system. An agent cannot step outside the universe to view its chance distribution; deference must be possible from a first-person perspective. |
  | **Decision-Theoretic** | **Betting Coherence** | Deference must license betting behavior. If $Ch(A)=x$, a rational agent should accept a bet on $A$ at odds $x$ (absent utility distortions). |
  | | **No Dutch Books** | The updating rule for chance-beliefs must not leave the agent vulnerable to a diachronic Dutch Book (being pumped for money over time as chance estimates shift). |
  | | **Action-Guidance** | Must yield a definite verdict in cases of conflicting chance claims (e.g., physical chance vs. statistical frequency). |

  ---

  ### II. Critical Cases the Theory Must Get Right

  A theory that works only for idealized coin flips is useless. It must handle these specific stress tests:

  **1. Learning the Law Without the Outcome (Theoretical Physics)**
  *   **The Case:** A physicist assigns credence to a decay event based on the Schrödinger equation before measuring the decay.
  *   **Requirement:** The theory must allow deference to the *propensity* or *best-system* probability derived from the law, even if the outcome is unknown and the law itself is held with less than certainty.
  *   **Failure Mode:** If the theory requires knowing the "true" chance function with certainty to defer, no actual human ever defers to chance.

  **2. The Wrong Reference Class (Hájek's Objection)**
  *   **The Case:** You are a smoker. You know the chance of cancer for "humans" is $x$, for "males" is $y$, and for "smokers with gene Z" is $z$. You don't know if you have gene Z.
  *   **Requirement:** The theory must specify which chance function is the *objective* one. Is it the most specific class known? The most specific class *true*?
  *   **Failure Mode:** Collapsing objective chance into subjective conditional probability. If chance is just "probability relative to evidence," there is no deference, only calculation. The theory must preserve the distinction between *my evidence* and *the chance setup*.

  **3. Inside the System (Self-Locating Belief)**
  *   **The Case:** The "Sleeping Beauty" problem or scenarios where the number of observers depends on the chance outcome.
  *   **Requirement:** The theory must integrate objective chance with indexical credence ("I am here now"). Deference to $Ch(Heads)=0.5$ must be reconcilable with self-locating evidence that might shift credence to $1/3$ or $2/3$.
  *   **Failure Mode:** Ignoring the "centered" nature of the agent. A theory that treats agents as external observers of the world fails in cosmological or quantum-branching contexts.

  ---

  ### III. Distinctions The Theory Cannot Collapse

  To be a theory of *deference* rather than *definition*, it must maintain these boundaries:

  1.  **First-Order vs. Second-Order Chance:**
      *   *Distinction:* $Ch(A)=x$ vs. $Ch(Ch(A)=x)=y$.
      *   *Requirement:* The theory must allow that there is a fact of the matter about the first-order chance, even if our access to it is governed by a second-order distribution. Collapsing these eliminates the possibility of being wrong about the chances.
  2.  **Knowing the Law vs. Knowing the Domain:**
      *   *Distinction:* Knowing the physics of coin tossing vs. knowing *this* object is a coin being tossed (and not a magnet).
      *   *Requirement:* Deference fails if the domain application is wrong, even if the law is right. The theory must treat "misidentification of the setup" as a failure of admissibility, not a failure of the chance principle.
  3.  **Chance vs. Frequency:**
      *   *Distinction:* The chance is the single-case propensity; the frequency is the long-run actual outcome.
      *   *Requirement:* The theory must allow credence to track chance even in short runs where frequency diverges wildly. If deference requires long-run validation, it is not guidance for single cases.

  ---

  ### IV. Hard Constraints (Physics & Decision Theory)

  1.  **No Backward Causation (Physics):**
      *   Credence at $t$ cannot defer to chance at $t^*$ (where $t^* > t$) in a way that implies the future fixes the present. The chance function must be history-to-chance conditional.
  2.  **Principal Principle Consistency (Logic):**
      *   The theory cannot imply $C(A) = x$ and $C(A) = y$ simultaneously for the same evidence state.
  3.  **Dutch Book Immunity (Decision Theory):**
      *   If an agent updates their belief about what the chance is (e.g., from 0.5 to 0.6 based on new data about the coin's bias), the transition rule must not allow a bookie to guarantee a profit. This constrains how we update *chance-hypotheses*.
  4.  **Measurability (Operationalism):**
      *   While chance is metaphysical, the theory cannot posit chances that are *in principle* undetectable by any frequency or propensity test. If a chance makes no difference to rational expectation, it is otiose.

  ---

  ### V. Joint Unsatisfiability & The "Killer" Requirement

  There is a known trilemma in the literature. You cannot satisfy all three of the following simultaneously:

  1.  **The Original Principal Principle:** $C(A \mid Ch(A)=x) = x$.
  2.  **Humean Supervenience:** Chances supervene on the total pattern of categorical events (past, present, and future).
  3.  **Non-Zero Credence in Undermining Futures:** We must assign non-zero credence to the possibility that the future pattern of events will be different from what the current best-system chances predict (e.g., a fair coin lands heads 1 million times in a row).

  **Why they conflict:**
  If chances supervene on the *entire* mosaic (including the future), then the *actual* future determines the *present* chance. If the present chance says there is a non-zero probability of a future that would make the present chance different (an "undermining future"), then by the Principal Principle, you must assign non-zero credence to a future that makes your current chance assignment false. But if that future obtains, your current chance assignment *was* false. This creates a contradiction in the credence assignment.

  **The Bootstrap vs. Revision Tension:**
  *   **Bootstrap Problem:** If you defer to chance, you cannot use outcomes to prove the chance was wrong (because you trusted the chance over the outcome).
  *   **Revision Requirement:** If you see 1,000 heads, you *must* revise your belief that the coin is fair.
  *   **Unsatisfiability:** A theory that treats chance hypotheses as *inadmissible* evidence prevents revision. A theory that treats them as *empirical hypotheses* subject to falsification undermines the concept of deference (turning it into mere induction).
  *   **Resolution:** The theory must treat $Ch(A)=x$ as a *theoretical constraint* on credence, but allow that our *identification* of which $Ch$ function applies is fallible. We defer to the *true* chance, but we update our belief about *which* chance is true based on frequencies.

  ### VI. The "Killer" Requirement

  The requirement that kills off the most popular accounts (specifically Lewis's Original Principal Principle and naive Humean Best-Systems accounts) is:

  **Handling Undermining Futures without Abandoning Supervenience.**

  *   **Why it kills Lewis's PP:** Lewis himself abandoned the Original Principal Principle because it contradicts Humean Supervenience in the face of undermining futures. He was forced to propose the "New Principle" (deference to conditional chance), which is more complex and less intuitive.
  *   **Why it kills Frequentism:** Frequentism identifies chance with actual long-run frequency. If the future undermines the present (e.g., the long run turns out "atypical"), the present chance was never what we thought it was. This makes rational deference to *present* chance impossible, as present chance is only knowable at the end of time.
  *   **Why it kills Propensity Views (often):** If propensities are metaphysical powers, they usually avoid undermining. However, they often fail the **Measurability Constraint** (how do we know the propensity if not by the frequency?).

  **Summary:** A viable theory must sacrifice either **Humean Supervenience** (chances are primitive, not determined by the mosaic) or the **Original Principal Principle** (deference is more complex than simple conditioning). Most contemporary accounts sacrifice the Original PP to save Supervenience.
