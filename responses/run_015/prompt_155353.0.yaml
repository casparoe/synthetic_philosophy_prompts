answer: |-
  **The Scenario**

  In the Province of Kaelo, the Department of Rural Development reclassified traditional grazing commons as protected watershed, forbidding livestock access without permits tied to fixed addresses; simultaneously, the Veterinary Bureau established disease cordons blocking movement between seasonal pastures; the Food Security Office allocated grain rations only to households registered in district towns; and the Education Ministry mandated boarding schooling for children of permit-holders, effectively requiring parental relocation. No directive ordered the dissolution of the Kaelo pastoralists, and each directive cited distinct administrative goals—conservation, disease control, logistics, and literacy. Director Havel managed the inter-departmental data sharing that synchronized permit revocation with ration cutoffs, noting in meeting minutes that the convergence would render pastoralism impossible. Officer Vane processed the permit revocations, writing in an internal memo that the resulting demographic collapse was "regrettable but inevitable," while privately logging satisfaction in his journal, yet he altered no procedures. Each measure alone would have strained the group; together, over five years, mortality rose and birth rates plummeted until the category was administratively empty. The paper trail is complete: no order to destroy exists, but the metadata shows the timing was synchronized.

  **Verdicts by Reading**

  *   **(i) Purposive Reading (*Dolus Specialis*):**
      *   **Director Havel:** Not Guilty. Although he synchronized the streams and knew the outcome, his conscious aim was administrative efficiency and data integrity, not the destruction of the group. Knowledge and private desire do not equal purpose.
      *   **Officer Vane:** Not Guilty. His purpose was processing permits; the private welcome of the outcome is irrelevant without an operational aim to destroy.
      *   **Bureau Chiefs:** Not Guilty. Their aims were confined to their specific mandates (conservation, health, etc.).
      *   *Result:* Total acquittal. The *mens rea* requires a conscious aim to destroy the group as such, which is absent from the record.

  *   **(ii) Knowledge-Based Reading:**
      *   **Director Havel:** Guilty. He knew his conduct (synchronization) was part of a pattern whose outcome was destruction and participated anyway.
      *   **Officer Vane:** Guilty. He foresaw the outcome (noted in memo) and participated.
      *   **Bureau Chiefs:** Not Guilty. Confined to their own streams, the record does not establish they knew the cumulative pattern led to destruction.
      *   *Result:* Conviction for those with knowledge of the systemic outcome; acquittal for those confined to silos.

  *   **(iii) Structural Reading:**
      *   **The Administration:** Guilty. The intent is inferred from the systematic and patterned character of the acts themselves (reclassification, cordons, rations, schooling) which inflicted conditions calculated to destroy.
      *   **Individuals:** Liability is derivative of the enterprise's guilt; individual *mens rea* is not required.
      *   *Result:* The enterprise is convicted; the question of individual intent is bypassed.

  **The Structural Feature Generating Divergence**

  The single structural feature generating the divergence is the **absence of a conscious aim to destroy the group**. While the overdetermination of contributions (no one act is necessary) supports the plausibility of this absence, the legal divergence hinges entirely on whether the law requires a subjective *purpose* (Reading i) or accepts *knowledge* (Reading ii) or *systemicity* (Reading iii) as a substitute. If a conscious aim existed, Reading (i) would convict; because it does not, Reading (i) acquits, while (ii) and (iii) rely on different loci of intent (mind vs. structure).

  **The Removal Test**

  *Rewrite:* A Provincial Coordinating Committee adopts a minute stating that the "pastoralist problem" requires a "demographic solution" and authorizes the four measures specifically to achieve this disappearance.
  *Result:* Under this rewrite, Reading (i) now convicts Havel, Vane, and the Chiefs via ordinary imputation (joint criminal enterprise or co-perpetration), as the Committee's purpose is imputed to the actors implementing the plan. Reading (ii) and (iii) also convict.
  *Finding:* The three readings collapse toward agreement (Guilty). This confirms that your original case was effectively a joint-criminal-enterprise case with the principal deleted. The divergence relied entirely on the inability to impute a shared purpose from the record.

  **The Strongest Attack (Purposive Defender)**

  *   **Objection Class A (The Case is Rigged):** This scenario redescribes administrative negligence or foresight as intent. It constructs a genocide with no perpetrator by letting an emergent outcome fix the *mens rea*, which is metaphysically incoherent; an act cannot be intentional if no agent intended the result. You have built a crime without a criminal mind.
  *   **Objection Class B (Concept Limits):** I concede the harm fits the description of destruction, but the word "genocide" performs political work that depends on identifying perpetrators to hold accountable. If we expand the concept to cover structural violence without specific intent, we dilute its moral force and lose the ability to distinguish between evil agency and tragic systemic failure. The concept should remain narrow even at the cost of leaving this pattern unnamed.

  **Conclusion on Metaphysics vs. Politics**

  The disagreement is ultimately **political/functional**, not metaphysical. The metaphysics of action (what constitutes intent) are being manipulated to serve a downstream goal: whether we want the word "genocide" to capture *specific evil wills* (Purposive) or *systemic destruction* (Structural). The Removal Test proves that if a will is found, the metaphysical disagreement vanishes. Therefore, the debate over the intent requirement is not about what it *takes* to intend, but about what we want the label to *do*—whether it is a sword for punishing villains or a shield for identifying victims of systemic erasure.
