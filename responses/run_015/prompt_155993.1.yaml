  # JOINT DRAFT SKELETON: EPISTEMIC PEER DISAGREEMENT
  **Status:** Draft for Discussion v0.1
  **Parties:** [Conciliationist] & [Steadfast Theorist]
  **Facilitator:** [User]

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both parties as the foundation for this collaboration. Denial of any claim below constitutes a breakdown of the common ground necessary for this dialogue.*

  1.  **Disagreement as Evidence:** The fact of disagreement between epistemic peers is not merely a psychological state or a sociological fact; it constitutes higher-order evidence bearing on the reliability of the first-order reasoning processes that produced the conflicting beliefs.
  2.  **The Unreliable Arithmetic Constraint:** There exists a proper subset of disagreement cases (paradigmatically: joint mental arithmetic where both agents acknowledge high fallibility and lack of independent verification) where significant conciliation is rationally mandatory. Steadfastness in these specific cases is irrational.
  3.  **Graded Peerhood:** "Epistemic peer" is not a binary switch but a scalar relation defined by comparative competence, familiarity with the evidence, and freedom from bias. The normative force of disagreement scales with the degree of peerhood.
  4.  **The Independent Check Limitation:** The standard "disputed calculation" model (e.g., the restaurant bill) is an inadequate model for high-stakes philosophical, scientific, or political disagreement. In the latter cases, there is no accessible "God's eye" independent check to resolve the dispute post-deliberation, which alters the epistemic significance of the lingering disagreement.
  5.  **Goal of Inquiry:** The primary normative goal governing this debate is epistemic accuracy (minimizing distance from the truth), not merely internal coherence or social harmony.

  ## 2. DISAGREEMENTS TABLE
  *The following table isolates the specific points of divergence. Each formulation is steel-manned by the respective party. Where a dispute is identified as primarily verbal, the substantive underlying issue is listed below the row.*

  | Topic | Conciliationist Formulation | Steadfast Theorist Formulation |
  | :--- | :--- | :--- |
  | **Normative Force** | Upon recognizing peer disagreement, one **must** significantly revise one's credence toward the peer's view (typically splitting the difference), absent a specific reason to favor one's own reasoning in this instance. | Upon recognizing peer disagreement, one **may** remain steadfast if one's first-order justification remains intact and one reasonably believes the peer has made an error in this specific instance, even if they are generally equally competent. |
  | **Source of Normativity** | The disagreement itself acts as a **defeater**. It undermines the justification for believing your first-order reasoning was successful, regardless of whether it actually was. | The first-order evidence remains the primary driver of justification. The disagreement is merely a **signal** that *might* indicate error, but does not automatically negate the first-order justification. |
  | **Terminology & Scope** | **[Facilitator Note: Verbal Dispute]** <br> The Conciliationist frames this as a requirement of *Rationality* (you are irrational if you don't move). The Steadfast theorist frames this as a permission of *Justification* (you are still justified if you stay). <br><br> **Substantive Core:** Does the higher-order evidence *automatically* outweigh the first-order evidence in the absence of an independent check? | **[Facilitator Note: Verbal Dispute]** <br> The Conciliationist frames this as a requirement of *Rationality* (you are irrational if you don't move). The Steadfast theorist frames this as a permission of *Justification* (you are still justified if you stay). <br><br> **Substantive Core:** Does the higher-order evidence *automatically* outweigh the first-order evidence in the absence of an independent check? |
  | **The "Right Reason" View** | Rejects the "Right Reason" view. You cannot assume you are the one who got it right simply because you did get it right; the disagreement screens off that fact. | Accepts a qualified "Right Reason" view. If I have actually weighed the evidence correctly, the fact that you weighed it differently does not make my belief unjustified, even if I cannot prove to you that I am right. |

  ## 3. CRUXES AND PREDICTIONS
  *For each crux, both parties commit to a specific prediction regarding the outcome of the described scenario or argument. These predictions are recorded prior to further analysis.*

  ### Crux 1: The Closed-Room Case
  **Scenario:** Two agents with identical training and access to the same evidence packet engage in unlimited joint deliberation. All considerations are shared. They emerge with different credences.
  *   **Conciliationist Prediction:** The survival of disagreement after full disclosure is evidence of a hidden fault (bias, processing error, or unacknowledged prior) in *both* agents. Rationality requires both to lower confidence significantly.
  *   **Steadfast Prediction:** The survival of disagreement is evidence of permissible doxastic divergence. Rational agents can weigh identical evidence differently without error. One agent may be right, the other wrong, without either being irrational.
  *   **Joint Test:** Simulation of idealized deliberation protocols with known truth-values to measure accuracy of steadfast vs. conciliatory outputs.

  ### Crux 2: The Scale Question
  **Scenario:** Determining the mathematical operation for "splitting the difference."
  *   **Conciliationist Prediction:** There is a correct scale (linear credence vs. log-odds) for aggregation. Using the wrong scale leads to accuracy pumps or Dutch Books. Conciliationism requires a specific scale to be normatively binding.
  *   **Steadfast Prediction:** The scale is a modeling choice, not a normative fact. Individual rationality does not depend on how we mathematically aggregate credences. Conciliationism is unstable because it cannot specify the scale without arbitrariness.
  *   **Joint Test:** Comparison of accuracy scores for linear-averaging vs. log-odds-averaging agents in controlled forecasting environments.

  ### Crux 3: The Ratchet (Iterated Conciliation)
  **Scenario:** Agent A conciliates toward B. Agent B conciliates toward A. Both learn the other has conciliated.
  *   **Conciliationist Prediction:** We must update again. However, there is a fixed point or convergence limit. Treating disagreement as evidence does not lead to infinite regress if the *weight* of the evidence diminishes as views converge.
  *   **Steadfast Prediction:** If conciliation is required on the first pass, it creates a "spinelessness" loop. If it is not required on the second pass (because the disagreement has shrunk), then the first pass was not truly about the *fact* of disagreement but about the *content*. This suggests steadfastness was closer to the truth all along.
  *   **Joint Test:** Iterated update simulation to check for convergence stability vs. volatility.

  ### Crux 4: Correlated Error (The Echo Panel)
  **Scenario:** A group of peers disagree with the agent, but the peers share a common training source or model (high correlation).
  *   **Conciliationist Prediction:** Correlated error reduces the weight of the disagreement, but does not eliminate it. Conciliation is still required, but to a lesser degree than with independent peers.
  *   **Steadfast Prediction:** High correlation validates steadfastness. If the peers share my blind spots, their agreement is not independent evidence against me. As correlation approaches 1, the normative pressure to conciliate approaches 0.
  *   **Joint Test:** Forecasting teams with manipulated information overlap. Measure accuracy of agents who discount correlated disagreement vs. those who treat it as independent.

  ## 4. FALSIFICATION CONDITIONS
  *Each party specifies what empirical or argumentative result would compel them to abandon or significantly revise their position.*

  **Conciliationist Falsification Condition:**
  > "I will abandon strict conciliationism if it is demonstrated that a steadfast policy systematically yields higher epistemic accuracy (truth-conduciveness) than a conciliatory policy in controlled environments where the truth is knowable post-hoc. If 'splitting the difference' makes us consistently less accurate than 'trusting my first-order reasoning,' the view fails on its own consequentialist terms."

  **Steadfast Theorist Falsification Condition:**
  > "I will abandon steadfastness if it is demonstrated that agents who treat peer disagreement as a mandatory defeater are able to detect and correct systematic biases that steadfast agents miss, leading to a statistically significant gap in long-term accuracy. If steadfastness amounts to ignoring a reliable signal of error that improves performance when heeded, the view is epistemically reckless."

  ***

  # FACILITATOR'S PRIVATE MEMO (FOR USER ONLY)

  **Re: Assessment of Cruxes and Verbal/Substantive Distinctions**

  You asked me to identify which crux is verbal and which is the substantive turning point, and to assess your list. Here is the unvarnished analysis.

  ### 1. Which Crux is Verbal?
  **The Scale Question (Crux 2) is mostly verbal.**
  While it looks mathematical, it is fundamentally a modeling choice. Whether you average in linear space or log-odds space is a decision about how to *represent* the conciliationist norm, not a discovery about the norm itself.
  *   **Why:** A sophisticated Conciliationist can adopt either scale by adjusting their definition of "equal weight." A Steadfast theorist doesn't care about the scale because they reject the aggregation norm entirely.
  *   **Risk:** If they spend the collaboration fighting about log-odds, they are fighting about the map, not the territory. It is a necessary technical clarification, but it will not resolve the philosophical impasse.

  ### 2. Which Crux is the Turning Point?
  **Correlated Error (Crux 4) is where the whole thing actually turns.**
  This is the only crux that addresses the *structure of the epistemic community* rather than the internal psychology of the agent.
  *   **Why:** The Steadfast view becomes highly plausible if most real-world peers are correlated (same universities, same journals, same datasets). The Conciliationist view becomes highly plausible if peers are truly independent (diverse backgrounds, adversarial collaboration).
  *   **The Pivot:** If the empirical data shows that high correlation is the norm in philosophy/science, Steadfast wins (because the "peer" signal is weak). If the data shows that even correlated peers provide significant independent error-checking, Conciliationism wins. This moves the debate from armchair intuition to empirical social epistemology.

  ### 3. Assessment of Your Crux List
  You have not got them wrong; in fact, this is a stronger list than the standard literature provides.
  *   **The Closed-Room Case:** Essential, but often ends in a stalemate of intuitions ("It feels like bias" vs. "It feels like permissible divergence"). It needs the empirical test you added to work.
  *   **The Ratchet:** This is the strongest argument *against* Conciliationism. If the Conciliationist cannot solve the ratchet without ad-hoc stopping rules, the Steadfast theorist has a knockout blow. Ensure they pin down the "stopping rule" explicitly.
  *   **The Table:** I flagged the "Rationality vs. Justification" row as verbal in the document. Be prepared for them to fight about whether *that* label is correct. It is the classic "Must" vs. "May" dispute. The substantive core (does higher-order evidence automatically defeat first-order?) is the only thing that matters.

  **Recommendation:** Push them to spend 60% of the collaboration time on **Crux 4 (Correlated Error)**. It is the only one with a clear path to empirical resolution that doesn't rely on pre-theoretic intuitions about "what feels rational."
