answer: |-
  ### The Implicit Theory: A Pragmatic Settlement

  The regime you describe is not a coherent ethical system but a **pragmatic settlement between two incompatible theories of responsibility**: the **Control Principle** (you are responsible only for what is within your willful control) and **Result Responsibility** (you are responsible for the states of affairs you cause).

  The regime's *explicit* theory is Control. It claims to judge "fitness to practise," "risk," and "process" (Rule 2). It exempts pure process offenses from outcome conditions (Rule 6). This presupposes that moral blameworthiness resides in the quality of the agency exercised, not the vagaries of the world's response.

  However, the regime's *operative* theory is Result Responsibility. It uses harm as the trigger for scrutiny (Rule 1), the taxonomy for grading (Rule 3), the basis for tort liability (Rule 5), and, most critically, the lens through which fault is identified (Rule 4). This presupposes that the moral significance of an act is partly determined by its consequences.

  The package is coherent only as a bureaucratic compromise, not as a moral philosophy. It uses the language of Control to legitimize sanctions (preserving the profession's self-image as rational and fair) while using the mechanics of Result Responsibility to allocate resources and satisfy retributive instincts (society demands someone pay when a patient is harmed).

  ### The Three Roles of Outcome

  To diagnose the incoherence, we must separate the three distinct functions outcomes serve in this regime. A strict Control-based view has different tolerances for each.

  **1. Outcome as Evidence of Prior Fault (The Trigger)**
  *   **Practice:** A file is opened because harm occurred (Rule 1).
  *   **Control Theory Compatibility:** **Compatible (with caveats).** A Control theorist can accept outcome as a *heuristic* for investigation. Since we cannot observe all conduct, harm is a high-probability signal that control was lost. This is an epistemic limitation, not a moral concession.
  *   **Constraint:** The Control theorist must insist that the *absence* of harm does not evidence *absence* of fault. The regime fails this when the harmless anaesthetist is "never reviewed" (Rule 1). A pure Control regime would audit randomly or based on risk-behavior reports, not just harm reports.

  **2. Outcome as a Constituent of Fault (The Finding)**
  *   **Practice:** Conduct is re-described as careless *because* harm occurred (Rule 4). The harmless anaesthetist is "careful"; the harmful one is "reckless," despite identical conduct.
  *   **Control Theory Compatibility:** **Incompatible.** This is the regime's fatal contradiction. The Control Principle holds that blameworthiness is fixed at the moment of choice/action based on the information available *then*. If the choice was identical, the blame is identical. Rule 4 allows the future (the result) to alter the past (the moral quality of the choice). This is not just outcome-sensitivity; it is moral time-travel.
  *   **Constraint:** A Control regime must judge the *ex ante* reasonableness of the decision. If the risk was unforeseeable then, it is not negligence now, regardless of the result.

  **3. Outcome as a Scalar for Sanction (The Penalty)**
  *   **Practice:** Harmful events are ranked higher than near misses (Rule 3); tort liability requires damage (Rule 5).
  *   **Control Theory Compatibility:** **Ambivalent.**
      *   *Strict View:* If blame is identical, punishment should be identical. Differentiating sanctions based on luck undermines the link between desert and penalty.
      *   *Moderate View:* A Control theorist might accept higher sanctions for harmful outcomes for *consequentialist* reasons (deterrence, public reassurance, compensation) without admitting that the *moral blame* is higher.
      *   *Constraint:* The regime conflates *blame* with *liability*. Rule 3 suggests the *incident severity* (a moral/category judgment) changes, not just the penalty. A Control regime would keep the finding of "violation" constant but vary the "consequence" based on harm, explicitly acknowledging the divergence.

  ### Coherence Analysis

  **The Trigger vs. Standard Gap**
  Is the gap between the outcome-driven trigger (Rule 1) and the process-driven standard (Rule 2) a contradiction?
  *   **Verdict:** It is **defensible** under a Control Principle *if and only if* the review process successfully filters out outcome bias. Resource scarcity justifies using harm as a triage mechanism. A Control theorist can endorse looking where the blood is, provided that once there, you judge the knife, not the wound.
  *   **The Breakdown:** The regime fails because the triage logic infects the judgment. Because the system is designed to process harm, its categories (Rule 3) and its cognitive habits (Rule 4) are optimized for result-assessment. The trigger creates a selection bias that makes the process standard impossible to apply faithfully.

  **Re-description (Rule 4) vs. Sanctioning (Rule 1)**
  Are these the same phenomenon?
  *   **Verdict:** No. Rule 1 (Sanctioning Differential) is less damaging than Rule 4 (Retrospective Re-description).
  *   **Reasoning:** Rule 1 says, "You were equally negligent, but you pay more because someone died." This preserves the agent's moral status while acknowledging the social cost. Rule 4 says, "You were negligent *because* someone died." This destroys the agent's moral status based on luck. Rule 4 is a fundamental category error; Rule 1 is merely a sentencing policy that a Control theorist might grudgingly accept for utilitarian reasons. Rule 4 makes the regime incoherent; Rule 1 makes it imperfect.

  ### The Two Clean Alternatives

  If we were to resolve the tension, here is what the two consistent regimes would look like in practice.

  **1. The Consistently Control-Based Regime**
  *   **Trigger:** Randomized auditing of records + reporting of *near misses* and *unsafe behaviors* (e.g., leaving the theatre), regardless of patient status.
  *   **Standard:** Strict *ex ante* reasonableness. The question is: "Given what the clinician knew *at the time*, was this decision within the bounds of acceptable risk?" Hindsight is formally excluded from evidence.
  *   **Fault:** Identical conduct receives identical findings of fault. The anaesthetist who leaves and the one whose patient dies are both sanctioned for "abandonment of post."
  *   **Sanction:** Base sanction is for the risk created. An *add-on* penalty may exist for actual harm, but it is explicitly labeled as "consequential liability" (compensation/deterrence), not "moral culpability."
  *   **Tort:** Decoupled from discipline. Compensation is no-fault or strict liability; discipline is purely conduct-based.

  **2. The Consistently Outcome-Based Regime**
  *   **Trigger:** Patient harm.
  *   **Standard:** Causation. Did the clinician's action contribute to the harm?
  *   **Fault:** Negligence is inferred from the bad result (res ipsa loquitur on a systemic scale). Defenses are limited to "unavoidable accident" (force majeure), not "reasonable care."
  *   **Sanction:** Strictly proportional to harm. A minor injury gets a warning; a death gets revocation, regardless of whether the clinician was attentive or asleep (unless intoxication is a separate statutory crime).
  *   **Tort:** Merged with regulation. Liability is automatic upon proof of causation and damage.

  ### The Luck Objection

  You ask whether the Control-based reform truly escapes luck, or merely relocates it.

  **The Objection:**
  A Control-based regime judges the agent by their *ex ante* epistemic situation (what they knew, their training, their fatigue, their cognitive capacity). But these are themselves products of luck (constitutive and circumstantial). A doctor is "in control" only because they were lucky enough to be well-rested, well-trained, and not struck by a sudden aneurysm. Therefore, shifting from *ex post* outcome luck to *ex ante* capacity luck does not purify responsibility; it just moves the goalposts to a different kind of fortune.

  **Analysis:**
  This objection has **real force**, but it does not defeat the distinction between *ex ante* and *ex post* luck. They are relevantly different for the purpose of accountability.

  1.  **Constitutive vs. Accidental:** *Ex ante* luck (capacity, training, fatigue) is **constitutive of the agent** at the moment of action. It defines the *quality of the will* being exercised. *Ex post* luck (whether the patient had a hidden anomaly, whether the equipment failed randomly) is **accidental to the agency**. It is external to the will.
  2.  **The Locus of Responsibility:** Responsibility is a relationship between an agent and their actions. We hold agents responsible for *how they navigate* the constraints they inhabit. We cannot hold them responsible for the constraints themselves (fully), but we must hold them responsible for the navigation.
      *   *Ex Post Luck:* Changes the *terrain* after the navigation is complete. Judging based on this is judging the map, not the navigator.
      *   *Ex Ante Luck:* Defines the *vehicle* and the *visibility*. Judging based on this is judging the navigator's use of their specific vehicle and visibility.
  3.  **The Moral Difference:** A regime that punishes *ex post* luck tells the agent: "Your care did not matter; only the result matters." This destroys the incentive for care. A regime that punishes *ex ante* luck tells the agent: "We judge you on the care you were capable of exercising." This preserves the link between effort and judgment.

  **Conclusion on Luck:**
  The objection correctly identifies that a Control-based regime cannot achieve *metaphysical* purity. The agent is always a product of circumstance. However, the *ex ante* baseline is the only baseline where **agency exists**. To judge by *ex post* outcomes is to judge where agency has already been superseded by causality. To judge by *ex ante* capacity is to judge the limit of the agent's sovereignty.

  Therefore, the relocation of luck is not a failure; it is a **necessary retreat to the only ground where responsibility is intelligible**. The Control-based reform is superior not because it eliminates luck, but because it eliminates the luck that is *irrelevant to the exercise of will*, while retaining the luck that *defines the will's capacity*. The gap between the two is the space where professional accountability must live.

  The current regime is incoherent because it claims to occupy that space (Rule 2) while actually punishing the irrelevant luck (Rule 4). A coherent Control regime would admit that it judges the *risk taken*, not the *risk realized*, and accept that this means sanctioning the harmless reckless doctor exactly as harshly as the harmful one, while using separate mechanisms to compensate the victim.
