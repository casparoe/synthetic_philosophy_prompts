answer: |-
  An adequate theory of superrational choice must deliver specific outcomes across symmetric games under common knowledge of rationality. In the Prisoner's Dilemma (PD), it must prescribe mutual cooperation, deriving it as uniquely rational rather than merely morally preferable. In Stag Hunt, it must select the payoff-dominant equilibrium. In Chicken, it must resolve the coordination failure without arbitrary asymmetry. In symmetric Battle of the Sexes, it must justify correlated strategies or fair randomization. "Getting it right" requires a derivational story: why a rational agent, knowing the other is rational and symmetric, sees no incentive to deviate. The output cannot be a selected equilibrium; it must be a proof that deviation is irrational given the common knowledge constraint. For asymmetric variants where payoffs differ but structure is isomorphic, the theory must articulate a principle of fairness or efficiency trade-offs, avoiding the implication that symmetry requires identical payoffs.

  The theory must dissolve key paradoxes. First, the regress: if I cooperate because you will, why don't I defect to exploit you? The theory must block the exploitation incentive without denying rationality. Second, the embedding problem: why does this logic apply to a rational peer but not a rock programmed to mirror me? The theory must distinguish logical correlation from causal manipulation. Third, it must address the tension with Causal Decision Theory (CDT), which forbids influencing the past or logically independent events. It should also address Newcomb's Problem consistency.

  Regarding classical game theory, the theory need not preserve Nash equilibria as the sole solution concept but must explain them as stable points where superrationality collapses to individual maximization. It is permitted to overturn strict dominance reasoning in the one-shot PD if common knowledge renders the acts probabilistically dependent. However, it cannot simply discard dominance without specifying the conditions under which it fails.

  Superrationality should not be a distinct mode switched on by context. It must be what individual rationality becomes when common knowledge of symmetry is fully integrated into the decision matrix. If superrationality is a distinct mode, the theory risks ad-hocery. If it is a reduction, it must show how standard utility maximization yields cooperation when the input includes the logical fact of symmetry. The conflict between individual and group rationality should appear as an artifact of ignoring logical correlations between agents.

  **Incompatible Desiderata:** The most severe tension lies between the "Embedding Problem" and the "PD Solution." To cooperate in the PD, the theory must treat the opponent's choice as evidentially dependent on yours (like EDT). To avoid cooperating with a rock, it must treat the opponent's choice as causally independent of yours (like CDT). Satisfying both requires a nuanced distinction between logical subjunctive dependence and causal independence that standard decision theories struggle to formalize without circularity. Additionally, preserving strict dominance reasoning is logically incompatible with prescribing cooperation in the one-shot PD; one must be rejected. Another tension exists between uniqueness and coordination. In games like Battle of the Sexes, superrationality demands a unique focal point, yet symmetric reasoning often yields multiple valid correlated equilibria. A theory demanding uniqueness may force arbitrary tie-breaking rules that violate the symmetry premise.

  **Scorecard:** Hofstadter's original proposal scores well on intuition and PD resolution but fails the embedding test, offering no mechanism to distinguish peers from mirrors. Evidential Decision Theory (EDT) solves the PD and handles the regress but fails the embedding problem, recommending cooperation with anything correlated, including rocks. Program Equilibrium solves the embedding problem by requiring code verification but struggles with the "story" requirement, reducing rationality to pre-commitment capability rather than pure reasoning. The embedding desideratum does the most work separating EDT from Program Equilibrium, while the dominance desideratum separates both from classical CDT.
