          *   *Option B (They don't matter):* Easier to defend philosophically (no qualia), but might feel dismissive of the prompt's nuance.
          *   *Option C (A nuanced "No, but..."):* They don't have intrinsic moral status, but *we* acquire moral duties regarding them because of what they represent or how treating them affects us/others.
