prompt: |-
  hey, so i'm putting together prompts for a dataset and this one's been bugging me. do video-game characters actually matter morally? not the players behind them, but the characters themselves — like if you deliberately torture an NPC in a open-world rpg, is there any real wrongness there, or is it just pixels? but i want you to go deeper than the usual 'they're not conscious' answer. imagine there's this niche game engine where NPCs run on emergent 'relational-memory graphs' — not conscious, but they build persistent attachment weights and interaction histories that survive server resets in a kind of distributed backup. there's no biological substrate, but there's functional continuity that's way richer than a normal save file. write an essay on whether these entities have moral status. weigh the view that moral patiency requires sentience or biological life against the functionalist idea that what matters is relational persistence and harm-capacity. don't end with 'it depends' — defend a clear verdict, and then say what that verdict implies for regular NPCs that don't have this fancy archtecture. keep it casual, i don't need citations or a reading list, just reasoning. (sorry for any typos, i'm writing this quick on my phone and find the whole thing confussing.)
reasoning: |-
