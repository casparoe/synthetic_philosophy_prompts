answer: |-
  1. **Question:** Stipulate the "Life-Profile Clause": when assessing whether a principle is reasonably rejectable for a person, we evaluate their complaint across the whole profile of situations in which the principle applies to them over a lifetime, not situation-by-situation. Consider an island ferry authority choosing a safety standard under a principle applying to everyone. Cheap Standard: 200,000 residents each pay $3/year; 12 crew face a 1/200 annual drowning risk. Expensive Standard: no cost; crew risk drops to 1/2000. Crew are picked by annual lottery from the whole population, so over a working life a given person is usually a payer and occasionally a crew member. (a) What does the Life-Profile Clause do to the aggregation objection here, and does it help or hurt contractualism? (b) Does it show the anti-aggregation result was an artefact of tallying complaints one situation at a time, or that the utilitarian-looking answer is produced by the lottery and reciprocity rather than the rejection procedure? (c) What does the Clause do for people who only ever show up on the losing side of the profile (a resident who cannot serve, a short-term visitor, someone born after the standard is set)? If it abandons them, is contractualism back where it started? (90 minutes, 20 marks)

  2. The Life-Profile Clause shifts the unit of comparison from isolated incidents to cumulative lifetime burden, fundamentally altering the aggregation objection within Scanlonian contractualism. In the Ferry Case, comparing small financial costs against large physical risks changes because each individual faces both risks over time. Under the Clause, a resident rejects the Cheap Standard not based on a single year's $3 loss versus a crew member's death, but based on their lifetime expected burden: paying $200 total versus facing a compounded mortality risk. This mimics aggregation across persons, potentially validating the Cheap Standard. However, the justification remains contractualist: the principle is rejectable because it imposes an uneven burden profile on specific individuals, not because the total utility is lower. The lottery creates reciprocity, making the burden shared, which mitigates reasonable rejectability by ensuring no one is permanently sacrificed for the greater good. Yet, for those excluded from the lottery, such as short-term visitors or disabled residents, the Clause fails to protect. Their lifetime profile is purely negative relative to the safety standard. For them, the Cheap Standard remains reasonably rejectable because their individual complaint is severe and unrecompensed by future benefits. Thus, the Clause does not dissolve the aggregation problem but relocates it to the definition of the relevant community and moral standing. Contractualism avoids utilitarianism only if the exclusion of non-participants generates a valid rejection that overrides the majority's benefit. If excluded persons cannot reject, the theory collapses into a form of reciprocal utilitarianism for insiders, violating the individualist constraint against sacrificing the few. The Clause shows anti-aggregation isn't merely situational tallying but depends on equal standing across a life. Therefore, the Clause helps contractualism handle recurrent risks but hurts it by exposing vulnerability to exclusion. The utilitarian-looking result arises from reciprocity, not the rejection procedure itself. Ultimately, contractualism retains distinctiveness by protecting the excluded, provided their complaints count equally. If the theory abandons them, it returns to the original aggregation problem where minority interests are overridden by distributed majority gains.

  3. 1. The answer identifies that the Clause shifts assessment from situational incidents to cumulative lifetime burdens. (4 marks)
  2. The answer explains how the lottery creates reciprocity that mimics utilitarian aggregation across persons. (4 marks)
  3. The answer distinguishes between justification via total utility versus justification via individual burden profiles. (4 marks)
  4. The answer analyzes the status of excluded persons (visitors/disabled) under the Clause. (4 marks)
  5. The answer concludes on whether contractualism collapses into utilitarianism based on the treatment of the excluded. (4 marks)

