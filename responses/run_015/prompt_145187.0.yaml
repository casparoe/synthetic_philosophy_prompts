answer: |-
  **SENTINEL HIGH SCHOOL**
  **OFFICE OF ETHICAL COMPLIANCE**
  **MEMORANDUM 404-B: MOTIVE VERIFICATION PROTOCOL**

  **TO:** All Graduating Seniors
  **FROM:** Mr. Halloran, Assistant Principal for Ethical Compliance
  **SUBJECT:** Graduation Requirement Altruism Verification (GRAV) Form

  Effective immediately, all community service hours submitted toward the 40-hour graduation requirement must be accompanied by a completed Motive Verification Form (MVF-40B). As discussed in last week's assembly, logging hours is insufficient. To cultivate genuine moral character, the administration must verify that the *intent* behind the service aligns with duty rather than inclination. Please review the following guidelines carefully.

  **SECTION I: DECLARATION OF INTENT**
  *Per shift, select exactly one (1) primary motivator. Multiple selections will result in automatic disqualification.*

  ☐ **A. Pure Moral Duty:** I performed this service solely because it is the right thing to do, regardless of personal feeling or external requirement.
  ☐ **B. External Compulsion:** I performed this service because I require these hours for graduation, my parents mandated it, or I was coerced.
  ☐ **C. Emotional Gratification:** I performed this service because I enjoy helping, it made me feel good, or I wished to socialize with peers.

  **SECTION II: FAQ**

  **Q: What if I needed the hours to graduate, but also wanted to do the right thing?**
  **A:** You must select Option A. However, be advised that if investigators determine the graduation requirement was even a partial factor, the hours will be voided. Needing the hours suggests the action was performed for the consequence (graduation), not the duty. If you truly acted from duty, the graduation requirement should have been irrelevant.

  **Q: Can I select "Both A and C" if I felt both?**
  **A:** No. The form does not allow for mixed motives. Moral worth is binary. If you enjoyed the beach cleanup, your motive was contaminated by inclination. Please select Option C and forfeit the hours. True virtue is often unpleasant.

  **Q: I filled out the form honestly and was denied. Why?**
  **A:** Honesty is appreciated, but admitting to impure motives disqualifies the act. We encourage students to strive for Option A in the future.

  **SECTION III: WORKED EXAMPLES**

  > **Case Study 1:** Student volunteered at food bank. Checked Box A. In reflective essay, wrote: "It felt amazing to see families smile."
  > **Ruling:** **DENIED.** Motive contaminated by emotional gratification (Box C). Service must be performed out of reverence for the moral law, not because recipients smiled.
  >
  > **Case Study 2:** Student volunteered at highway cleanup. Checked Box A. In reflective essay, wrote: "It was raining, I hated every second, and I learned nothing."
  > **Ruling:** **APPROVED.** Lack of enjoyment confirms action was taken solely out of duty.
  >
  > **Case Study 3:** Faculty Advisor Ms. Gable supervised a shift. She expressed pride in the students' growth.
  > **Ruling:** **FLAGGED.** Staff enthusiasm suggests the event was organized for emotional reward rather than strict ethical obligation. Ms. Gable has been mandated to attend a workshop on Moral Detachment.

  **SECTION IV: APPEALS PROCESS**

  If your hours are denied due to motive impurity, you may file an Appeal of Intent (Form AOI-9). Please note:
  1. Appeals must be notarized.
  2. You must submit a sworn affidavit stating you did not experience any positive emotions during the service shift.
  3. Second offenses involving "Enjoyment" will result in a detention for Ethical Recalibration.

  **NOTE ON COMPLIANCE**
  We understand this creates anxiety. However, ethical compliance is not meant to be easy; it is meant to be correct. If you find yourself unable to verify a pure motive, we suggest refraining from volunteering until your moral framework is sufficiently aligned. Remember: 40 hours of impure service is worth less than zero hours of pure duty.

  Thank you for your cooperation in matters of conscience.

  **Mr. Halloran**
  Assistant Principal for Ethical Compliance
  *Sentinel High School*
