prompt: |-
  hey so i write a humor column for my school paper (the Sentinel, i know) and I want to do one about our volunteer hours thing, but I want it to actually be about the philosophy and not just "haha school is dumb." Basically everyone has to do 40 hours of community service to graduate, and last year admin decided that was too easy to game, so now you also have to fill out a form explaining WHY you did each shift and an assistant principal reads it and can deny you the hours if the reason was a bad one — like you only did the beach cleanup because you needed the hours, or because your mom made you, or because your crush was going to be there. Me and my friends got in a huge argument about it at lunch. Priya says the whole thing is definately impossible, because if you NEED the hours then you can't also be doing it purely because it's the right thing, so everyone should just fail on principle. Devon says nobody ever does anything for literally one reason, so the form should have a "both" box, but it doesn't — it's a list and you have to pick exactly one. And my brother's old philosophy textbook had this bit about a guy named Kant who apparently thought an action only really counts as good if you did it *because* it was right, not just because you happened to feel like it or it was good for you, which made me laugh out loud because our school has basically turned that into paperwork.

  so can you write me the column? I want it as a fake official document — the actual "Motive Verification Form" and FAQ that got emailed out, with numbered clauses, checkboxes, an appeals section, maybe a sidebar or a worked example, around 600-700 words, in the deadpan voice of a very sincere assistant principal (call him Mr. Halloran, Assistant Principal for Ethical Compliance) who thinks this is totally reasonable and is confused why anyone is upset. The jokes should come from the philosophy being right and being followed somewhere silly: the kids who genuinely enjoy volunteering getting hours denied for having an impure motive while the kids who hated every second of it get full credit, people being asked to certify a reason they can't actually check, the kid who did it for two reasons at once falling through a crack in the form, and maybe a staff member who gets flagged for being too enthusiastic about helping. It should be funny to someone who actually knows this stuff but still readable to my classmates who don't, and please keep it deadpan the whole way — no winking at the reader, and don't let it turn into a rant where someone just explains the problem outright. Also, please write it in American English, my editor is super picky about US spelling. thanks!
