  9. You complain that algebraic methods are not science because they proceed not from causes; is the symbol not a cause of the calculation in the mind of the calculator?
  **Likely Answer:** Symbols are marks to help memory, but they show not the generation of the quantity.
  **Follow-up:** Does this not render your own squaring of the circle vulnerable if it relies on lines drawn rather than causes shown?

  10. You defend the angle of contact as a genuine quantity against the professors; is this quantity visible to the eye or only to the understanding?
  **Likely Answer:** It is a quantity of deviation, visible to the understanding though not to the gross eye.
  **Follow-up:** If it is not visible, is it not merely another abstraction of the sort you elsewhere condemn?

  11. Your politics made you notorious whilst your mathematics won no following; does this disparity suggest that men prefer a science that justifies their obedience to one that corrects their errors?
  **Likely Answer:** Men are more willing to acknowledge their sin than their ignorance.
  **Follow-up:** Is it not safer to be hated for your politics than laughed at for your geometry?

  12. If future generations accept your commonwealth but reject your circles, have you succeeded in making politics a science?
  **Likely Answer:** They cannot accept the commonwealth without accepting the reason upon which it is built.
  **Follow-up:** Then you stake the survival of peace upon the acceptance of your geometry?

  ***

  **The Question to Avoid**

  **Question:** Sir, do you believe that God is a body, as your physics seems to imply, or is this merely a linguistic convenience?

  **Reason for Avoidance:** This question touches directly upon the charges of atheism and heresy that were brought against him in his later years; he would perceive it as a legal trap designed to endanger his person and reputation, likely causing him to terminate the interview or respond with hostile defensiveness regarding his orthodoxy.

  **Careful Version:** How do you reconcile your definition of substance as corporeal with the articles of the Christian faith as established by the Church of England?
