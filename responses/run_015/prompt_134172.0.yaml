      *   **Constraint 1 (Content):** Do not give the standard narrative about corporate greed. Focus on a disciplined mapping of Smithian concepts.
      *   **Constraint 2 (Specifics):** Identify relevant actors (Watkins, Lay, audit committee, investing public). Specify for each pair whose situation was sympathetically imagined, by whom, and with limitations (information/proximity).
