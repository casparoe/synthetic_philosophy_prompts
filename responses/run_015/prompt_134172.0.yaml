      *   **Constraint 5 (Evaluation):** Be explicit about what Smith's model illuminates, misdescribes, or offers no verdict on.
      *   **Constraint 6 (Format):** Write entirely in continuous prose (letter or email style). No headings, no bullet points, no bold text, no tables.

  2.  **Deconstruct Adam Smith's *The Theory of Moral Sentiments* (TMS):**
      *   **Sympathy:** Not just pity, but the ability to imagine oneself in another's situation ("change places in fancy").
      *   **Impartial Spectator:** The internalized judge, the "man within the breast," who evaluates our own conduct as if viewed by an objective observer.
      *   **Propriety:** The suitability of the affection to the object that excites it. Did the emotion match the cause?
      *   **Merit:** The deservingness of reward or punishment based on the intention and effect of the action.
      *   **Distance/Proximity:** Sympathy diminishes with distance (physical, social, informational).
      *   **Systemic Issues:** Smith wrote about individuals in commercial society, not complex corporate structures with limited liability and agency problems.

  3.  **Map the Actors and Sympathetic Relations:**
      *   **Watkins -> Lay:** Watkins imagines Lay's situation (risk to reputation/company) but urges truth. She tries to evoke sympathy in Lay for the company's long-term survival vs. short-term fraud.
