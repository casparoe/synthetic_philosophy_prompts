answer: |-
  ### Criteria Weighting

  To prioritize these lines of work, I am applying the following weights to your constraints:
  *   **Importance (40%):** Direct impact on the reader's imaginative sense of housing policy possibility.
  *   **Dependency (35%):** How many downstream artistic decisions rely on this answer (upstreamness).
  *   **Tractability (25%):** Feasibility within six months using a novelist's toolkit (drafts, beta readers) rather than philosophical research.

  I am deliberately excluding **Neglectedness** as a primary factor because your framework already identifies the Formal level as the neglected site of propaganda compared to the Thesis level.

  ---

  ### 1. Interiority Distribution

  **The Question:** Whose consciousness renders housing scarcity visceral, and who is denied interior depth?
  **Why Upstream:** This decision dictates focalization for every scene in the book. If you grant interiority only to the struggling tenant, housing policy becomes a story of survival; if you grant it to the landlord, it becomes a story of asset management. Settling this determines whose pain counts as tragedy versus whose pain counts as inconvenience, which is the primary mechanism of Du Bois's "propaganda" regarding who counts as a person. It unlocks decisions about dialogue, scene selection, and descriptive language.
  **Tractability:** High. This is core novelistic craft. You can identify chapters where the "wrong" character holds the camera and rewrite them. Beta readers can immediately flag characters who feel like props versus people.
  **Concrete Evidence:** Over the next six months, track beta reader responses to specific characters. If readers describe a tenant as "symbolic" or a landlord as "cartoonish," move interiority. If readers say, "I finally understood why she stayed," you have succeeded in making the constraint intelligible.

  ### 2. Resolution Logic

  **The Question:** What specific agency resolves the central housing conflict: individual grit, private charity, or structural change?
  **Why Upstream:** This determines the climax and the thematic claim of the ending. To shift the imaginative sense of *policy*, the resolution cannot rely on luck or individual exceptionalism, or the book implicitly argues policy is irrelevant. This choice dictates the plot architecture of Act Three. It forces you to decide what a "livable" ending looks like, directly answering your goal of presenting a specific social order as possible.
  **Tractability:** Medium. Rewriting an ending is demanding but bounded. It does not require new theory, only narrative consistency. You can test multiple endings with trusted readers to gauge which feels "earned" versus "preachy."
  **Concrete Evidence:** Monitor feedback on the ending's plausibility. If readers say, "That would never happen," the policy imagination has failed. If they say, "I hadn't thought of that solution," the policy imagination has expanded.

  ### 3. Motive Intelligibility

  **The Question:** How do structural barriers manifest as personal desires and conflicts rather than abstract obstacles?
  **Why Upstream:** This governs scene-level conflict. If characters discuss housing policy directly, you are at the Thesis level. If characters fight over a lease violation because one needs space for a sick parent and the other needs to enforce rules to keep their own job, the policy is embedded in motive. This decides how information is revealed and prevents the book from becoming a tract. It ensures the propaganda lives in craft.
  **Tractability:** High. This is line-editing and scene-work. You can scan for expository dialogue and convert it into action or subtext. It is highly responsive to revision.
  **Concrete Evidence:** Track passages beta readers label as "preachy" or "slow." If a scene drags, it is likely because a character is arguing a thesis rather than pursuing a motive. Successful revision turns arguments into dilemmas.

  ---

  ### Trade-off and Deprioritization

  I am deliberately deprioritizing the **Reflexive Level** (whether the book admits its own partiality). Philosophically, this is the deepest engagement with Du Bois, as it questions the ontology of the text and the reader's trust. However, for a literary novel aiming to shift policy imagination, foregrounding the book's bias risks breaking the literary spell. If the narrative voice constantly admits it is framing reality a certain way, readers may disengage from the emotional truth required to care about the housing issue. Settling the Formal level (Interiority, Resolution, Motives) does the work of persuasion more effectively than meta-commentary. This trade-off sacrifices philosophical rigor for narrative efficacy, which aligns with your six-month constraint and audience expectations.

  ### Ordering

  1.  **Interiority Distribution:** Establishes the human stakes and empathy targets.
  2.  **Resolution Logic:** Establishes the political possibility and policy viability.
  3.  **Motive Intelligibility:** Ensures the execution remains literary rather than didactic.

  \answer{1: Interiority Distribution; 2: Resolution Logic; 3: Motive Intelligibility}
