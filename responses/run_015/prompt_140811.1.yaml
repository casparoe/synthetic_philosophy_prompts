  # RFC-892: Moral Vocabulary Refactor (Expressivist Compliance)

  | Status | Draft |
  | :--- | :--- |
  | **Author** | Senior Backend Engineering |
  | **Reviewers** | Core Team, Platform Architecture |
  | **Date** | 2023-10-27 |

  ## Summary

  This proposal outlines a refactor of the `moral_predicates` module to align with our updated expressivist specification. Currently, moral sentences (e.g., `is_wrong(action)`) return booleans, implying they describe state. Under the new spec, these sentences are side-effecting expressions that vent or coordinate attitudes. They should return `void`. We propose hoisting calls to these functions out of value positions and introducing a `HigherOrderAttitude` wrapper to handle embedding in conditionals.

  ## Motivation

  Our current implementation treats moral claims as descriptive facts stored in the ontology layer. This creates technical debt when we attempt to scale attitude coordination across services. If `is_wrong('lying')` returns `True`, the system assumes a corresponding fact exists in the database. However, profiling shows no such records are ever written. The function is purely expressive. Continuing to treat it as a state check violates the single source of truth principle. We must refactor moral vocabulary to match its actual runtime behavior: emitting events rather than querying state.

  ## Guide-level Explanation

  Under the new design, moral predicates become procedures that trigger side effects (logging, signaling disapproval) rather than returning values.

  ```python
  # Old Implementation (Descriptive)
  if is_wrong('lying'):
      trigger_penalty()

  # New Implementation (Expressivist)
  condemn('lying')  # Returns None, emits 'BOO' event
  ```

  This works for top-level assertions. However, composability breaks when embedding these calls in logic flows. Consider a conditional rule:

  ```python
  # Broken Composability
  if condemn('lying'):  # TypeError: NoneType not iterable
      condemn('enticing_brother_to_lie')
  ```

  Since `condemn` returns `None`, it cannot serve as the condition for an `if` statement. This is the expected behavior for side-effects, but it blocks standard control flow patterns used in policy enforcement.

  ## Reference-level Explanation

  To restore composability without reintroducing descriptive state, we introduce the `HigherOrderAttitude` wrapper. This object does not represent a fact; it represents a complex attitude directed at a combination of other attitudes.

  ```python
  class HigherOrderAttitude:
      def __init__(self, antecedent, consequent):
          # Stores the attitude of disapproving of 
          # (accepting antecedent + rejecting consequent)
          self.combo = (antecedent, consequent) 

      def __bool__(self):
          # Warning: This is syntactic sugar only
          return True 
  ```

  When a user writes `if conditional_wrong(lying, enticing):`, they are not checking a truth condition. They are expressing a complex stance against holding inconsistent attitudes. The wrapper allows the syntax to compile while maintaining the void-return semantics of the underlying predicates.

  ### The Negation Edge Case
  Note that `not condemn(x)` simply represents the absence of disapproval. It does not equate to `praise(x)`. We are accepting this asymmetry as a known limitation of the type system. The linter will flag attempts to treat silence as approval.

  ### Validation and Modus Ponens
  We have added a unit test to ensure logical consistency across embedded attitudes.

  ```python
  def test_modus_ponens_validity():
      p = condemn('lying')
      q = condemn('enticing_brother_to_lie')
      rule = HigherOrderAttitude(p, q)
      
      # Asserting that accepting rule + p entails q
      assert validate_inference(rule, p, q) 
  ```

  **Status:** This test is currently failing. The `HigherOrderAttitude` wrapper restores syntax but does not enforce logical entailment at the type level. The structure feels valid to users, but we lack a formal proof that the wrapper guarantees Modus Ponens compliance. Given strong UX feedback that the inference "looks valid," we are comfortable shipping this as a runtime behavior rather than a compile-time guarantee.

  ## Drawbacks

  1.  **Logical Guarantees:** As noted, the wrapper does not mathematically enforce validity. It relies on the user's internal consistency.
  2.  **Cognitive Load:** Engineers must remember that `True` no longer means "corresponds to reality" but "consistent with current attitude stack."
  3.  **Negation Ambiguity:** Distinguishing between "not wrong" and "permitted" requires manual linting.

  ## Alternatives Considered

  1.  **Realist Schema:** Reify moral properties as actual database entities. Rejected due to lack of empirical data backing the schema.
  2.  **Error Theory (Module Deletion):** Remove the module entirely since no moral facts exist. Rejected because downstream services (Legal, HR) depend on the interface.
  3.  **Status Quo:** Continue treating expressions as facts. Rejected due to spec mismatch.

  ## Unresolved Questions

  ### Quasi-Realist Compatibility
  Post-refactor, can we continue using terms like `true`, `fact`, and `believe`?
  **Resolution:** Yes. We recommend retaining these keywords but redefining them thinly. `is_true(x)` will simply check if `x` passes the attitude consistency lint. This allows legacy code to function without reverting to descriptive semantics. We will document that "moral facts" are merely stable configurations of the lint rule.

  ## Discussion Thread

  **@realist_architect**  
  I cannot approve this. You are treating a category mistake as a refactor. If `condemn('lying')` doesn't return a boolean, you aren't just changing the implementation; you're changing the contract. The rest of the system expects moral claims to be truth-apt. If you strip the return value, you break the interface for every consumer that treats morality as state. This isn't technical debt; it's a spec violation. You're building a UI component and calling it a database.

  **@nihilist_ops**  
  Honestly, why are we maintaining this module at all? I reviewed the logs for `condemn()`. It emits events, sure, but nothing ever consumes them to actually change system behavior. The `HigherOrderAttitude` wrapper is just a thunk around null. If the Expressivist spec is right and there are no facts, just delete the dependency. Let the clients handle their own emotions. We shouldn't be in the business of shipping void functions that pretend to be logic.

  **@pm_sarah**  
  I'm trying to map this to the sprint goals. If `is_true` now just means "passes lint," does this change what anyone does on Monday? Specifically, does this unblock the Compliance integration? If the output looks the same to the client, I'm fine with the internal refactor, but please ensure the "failed" unit test doesn't flag in the CI pipeline. We can't ship red builds even if they are philosophically consistent.
