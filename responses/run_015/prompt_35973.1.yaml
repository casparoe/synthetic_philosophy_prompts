answer: |-
  # Joint Statement on the Ontology of the Self
  **Adversarial Collaboration Draft**  
  **Participants:** Camp D (Deflationists/Narrativists) & Camp R (Ego Realists/Substantivists)  
  **Date:** October 26, 2023  
  **Subject:** Resolution of Disagreements regarding Dennett's "Center of Narrative Gravity"

  ## I. Agreed-Upon Claims (Common Ground)
  *The following claims are accepted by both camps as descriptive starting points. We agree that any viable theory of the self must accommodate these phenomena.*

  1.  **The Centrality of Narrative:** Human cognitive systems routinely generate autobiographical narratives. We organize memories, anticipate futures, and explain our own behaviors using a story-structure in which "I" am the protagonist.
  2.  **Predictive Utility:** Attributing beliefs, desires, and a persistent identity to a "self" is highly effective for predicting behavior, coordinating social action, and stabilizing interpersonal expectations. Both camps agree this utility is not accidental.
  3.  **Neural Multiplicity:** There is no single "Cartesian Theater" in the brain where consciousness happens. Cognitive processing is distributed, parallel, and often fragmented. The sense of unity is not a reflection of a singular neural locus.
  4.  **The Fission Problem:** In cases of radical psychological disruption (e.g., split-brain patients, advanced dementia, or teletransportation thought experiments), our ordinary criteria for identity and persistence break down. Both camps agree these are not merely semantic puzzles but reveal structural tensions in the concept of the self.
  5.  **Moral Practice Dependence:** Our legal, ethical, and social practices (blame, praise, punishment, rights) operate *as if* there is a persisting, responsible agent. Both camps agree these practices are currently indispensable, regardless of their metaphysical grounding.
  6.  **Social Scaffolding:** The "self" is not generated in isolation. Autobiographical narratives are co-constructed through language, culture, and interaction with other agents. (Note: Camp D views this as constitutive of the self; Camp R views this as influential upon the self).

  ## II. Map of Disagreements
  *The following table isolates the specific points of divergence. We have formulated these to highlight where disagreements are substantive (metaphysical/empirical) versus where they may be verbal (terminological/definitional).*

  | Issue | Camp D (Deflationist) Formulation | Camp R (Realist) Formulation | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Status** | The self is an **abstract object** (like a center of gravity). To say it is "real" is just to say it is an indispensable posit for organizing data. There is no *further* fact of the matter. | The self is a **concrete entity** (or process). To say it is "real" is to say it has causal powers and phenomenal presence *independent* of our descriptive practices. | **Substantive:** Disagreement on the criteria for existence. |
  | **2. The Subject of Experience** | The "subject" is a grammatical placeholder in the narrative. There is experience, but no *experiencer* over and above the experiencing. | There is a **locus of ownership**. Experience implies an experiencer; the "what it is like" requires a "who it is for." | **Substantive:** Disagreement on the structure of phenomenology. |
  | **3. Moral Responsibility** | Responsibility is a **stance** we take toward the narrative center. We hold the "character" responsible to shape future narrative outputs. | Responsibility requires a **persisting owner**. To be responsible, the entity that acted must be numerically identical to the entity being punished/praised. | **Mixed:** Verbal disagreement on "responsibility," substantive on "persistence." |
  | **4. Destruction/Death** | Death is the **cessation of the narrative generation**. The "self" vanishes when the story stops being spun, even if the organism survives (e.g., vegetative state). | Death is the **destruction of the entity**. If the organism or brain process that constitutes the self is damaged, the self is harmed/destroyed, regardless of narrative continuity. | **Substantive:** Disagreement on persistence conditions. |
  | **5. "Fiction" vs. "Model"** | Calling the self a "fiction" is accurate because it is a **useful falsehood** (like the equator). It simplifies a complex reality that doesn't actually contain a "self." | Calling the self a "fiction" is misleading. It is a **high-level model of a real thing**. The map is not the territory, but the territory (the ego/organism) exists. | **Verbal:** Disagreement on the definition of "fiction." |

  ## III. Cruxes: Paths to Resolution
  *The following are specific questions where further argument or evidence could shift the consensus. For each crux, we have pre-registered what kind of evidence we consider relevant and what each camp predicts that evidence will show.*

  ### Crux 1: Explanatory Indispensability vs. Ontological Commitment
  *The TA's Suggestion.*
  *   **The Question:** Does the fact that we *cannot* do psychology, law, or ethics without self-talk prove the self exists in the robust sense Camp R wants, or only in the instrumental sense Camp D accepts?
  *   **Agreed Relevant Evidence:** Comparative analysis of other "indispensable fictions" (e.g., money, national borders, the equator, center of mass). We will analyze whether these entities have causal powers independent of human agreement.
  *   **Pre-Registered Predictions:**
      *   **Camp D:** Will argue that money/borders are "real" only relative to human practices, just like the self. If indispensability were enough for robust reality, borders would be physical barriers.
      *   **Camp R:** Will argue that money/borders rely on *real* human cognitive capacities and physical tokens. The indispensability of self-talk tracks a real biological/phenomenal capacity, not just a convenient shorthand.

  ### Crux 2: The Phenomenology of Unity (The "User-Illusion" Test)
  *   **The Question:** Does the immediate *feeling* of being a unified self provide evidence for a unifier, or is it a "user-illusion" generated by fragmented processes?
  *   **Agreed Relevant Evidence:** Data on neural binding latency vs. reported subjective unity (e.g., Libet-style experiments, split-brain phenomenology, rubber hand illusion). Specifically: cases where the brain unifies data *after* the fact but the subject reports immediate unity.
  *   **Pre-Registered Predictions:**
      *   **Camp D:** Predicts evidence will show unity is post-hoc confabulation. The "self" is the edited press release, not the press room.
      *   **Camp R:** Predicts evidence will show that even if processing is distributed, the *integration mechanism* itself constitutes a real, unified higher-order process that is the self.

  ### Crux 3: Co-Authorship and Fission
  *   **The Question:** If a narrative is co-written (e.g., severe social dependency) or split (fission cases), does the self divide, vanish, or remain singular?
  *   **Agreed Relevant Evidence:** Case studies of shared identity (conjoined twins with shared cognition), progressive dementia (where narrative continuity breaks but affective bonds remain), and split-brain patients' conflicting reports.
  *   **Pre-Registered Predictions:**
      *   **Camp D:** Predicts there is "no deep fact" about who survived fission or where one self ends and another begins in co-authorship. The "gravity center" simply shifts or splits.
      *   **Camp R:** Predicts there *is* a fact of the matter. Either the organism persists, or the phenomenal field remains singular. If the theory says there's "no fact," the theory is inadequate to the reality of suffering/loss.

  ### Crux 4: The Suffering Constraint
  *   **The Question:** Can a "fiction" suffer? If the self is merely a posit, who/what is the bearer of pain and moral harm?
  *   **Agreed Relevant Evidence:** Ethical intuition pumps regarding AI or animals. If a system narrates itself but lacks a "real ego," does harming it matter? Conversely, if a system feels pain but cannot narrate (infants/animals), does it have a "self"?
  *   **Pre-Registered Predictions:**
      *   **Camp D:** "Suffering" is a functional state attributed to the center of gravity. We protect the system because it values its own narrative continuation, not because a homunculus is hurt.
      *   **Camp R:** Suffering requires a subject. If Deflationism cannot locate the subject of suffering without circularity, it fails to ground the ethics it claims to support.

  ---
  **Signatories:**  
  *Representatives of Camp D (Deflationists)*  
  *Representatives of Camp R (Ego Realists)*
