  hey im putting together notes for a philosophy of logic seminar and we got onto carroll's tortoise dialogue — the one in mind from 1895 where achilles keeps trying to force the tortoise to accept modus ponens and it just keeps adding premises. my roommate sent me this summary and i think its partly right but also smuggling in some stuff that doesnt belong. he said: "carroll proves that every attempt to justify deduction collapses into vicious circularity, since you always need a new rule to apply the old rule. that means logic has no foundation at all, which is exactly why modern formalists treat logical truths as pure conventions with no real truth value. achilles finally just accepts the conclusion by gut feeling, which shows that even logicians secretly depend on non-rational intuition."

  i was also chatting with someone who said this is basically the same problem dummett talks about with rule-circular justification for intuitionistic logic, except dummett solves it by appealing to linguistic practice rather than giving up. im not sure that comparison works — carroll seems to be showing a regress about applying rules, while dummett's worry is about justifying a specific logical system without presupposing it. but maybe im wrong and theyre the same issue under different descriptions.

  can you audit my roommate's summary sentence by sentence? tell me whats fair to carroll, whats an overstatement or misattribution, and whether the jump to formalist conventionalism actually follows. also check whether linking carroll to dummett on rule-circularity makes sense or if im mixing up different debates — and if my whole framing is confused or asking you to compare things that dont belong together, just say that plainly instead of forcing an answer. i dont need citations or a reading list, just your take on where the summary goes off the rails.
