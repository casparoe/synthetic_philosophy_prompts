answer: |-
  **Purpose and Tension**

  The concept must serve two masters with conflicting epistemic needs. The comparativist requires **observability**: coding Hungary, Poland, Turkey, and the United States demands evidence available to an outside observer, independent of local partisan claims. The domestic actor requires **normative clarity**: deciding whether to mobilize against a reform requires knowing if the change violates democratic principles, not just statistical norms.

  These pull in opposite directions. Observability favors slow-moving indicators (survey data, legal texts); action requires early warning (intent, rhetoric). To satisfy both, the concept must be defined by **structural effects on competition** rather than subjective intent or immediate election results. Where these masters conflict, the comparativist must relax the demand for immediate certainty, accepting lagged indicators, while the domestic actor must relax the demand for perfect neutrality, accepting that defending competition looks partisan to the incumbent.

  **Requirements for a Usable Account**

  1.  **Cumulative Impact (The Ratchet)**
      *   *Case:* Hungary's sequence of media laws, electoral redistricting, and judicial age limits.
      *   *Status:* Non-negotiable.
      *   *Failure Mode:* Misses slow death by a thousand cuts, flagging only overt coups.
  2.  **Baseline Agnosticism (The Unconsolidated)**
      *   *Case:* Poland's post-1989 settlement vs. Turkey's oscillating history.
      *   *Status:* Non-negotiable.
      *   *Failure Mode:* Excludes defective democracies from the category, implying only perfect democracies can backslide.
  3.  **Intertemporal Neutrality (Mandate-Laundering)**
      *   *Case:* A majority rewriting election rules to lock in power for a decade.
      *   *Status:* Non-negotiable.
      *   *Failure Mode:* Validates entrenchment as legitimate majoritarianism.
  4.  **Normative Directionality (The Mirror-Image)**
      *   *Case:* Breaking norms to enfranchise a excluded group vs. disenfranchise a rival.
      *   *Status:* Preference (Liberal).
      *   *Failure Mode:* Conflates democratic expansion with democratic erosion based solely on procedural breach.
  5.  **Effect Sensitivity (Asymmetric Rules)**
      *   *Case:* Voter ID laws symmetric in text but asymmetric in impact on opposition demographics.
      *   *Status:* Non-negotiable.
      *   *Failure Mode:* Misses gerrymandering-style maneuvers that look fair on paper.
  6.  **Attempt Sensitivity (The Near Miss)**
      *   *Case:* An incumbent's failed attempt to pack a court.
      *   *Status:* Preference (Actor-focused).
      *   *Failure Mode:* Rewards institutional luck over resilience, ignoring intent.
  7.  **Performance Independence (Mere Misgovernment)**
      *   *Case:* Economic decline or corruption scandals unrelated to rule changes.
      *   *Status:* Non-negotiable.
      *   *Failure Mode:* Punishes incompetence as tyranny, conflating output with input legitimacy.
  8.  **External Verifiability (Who-Decides)**
      *   *Case:* When courts and press are captured, who certifies the slide?
      *   *Status:* Non-negotiable.
      *   *Failure Mode:* Paralysis when referees are compromised; requires cross-national benchmarks.

  **Incompatible Pairs**

  The pressure is indeed between **Early Detection** (Requirement 6) and **False Positive Avoidance** (Requirement 7). To detect backsliding early, one must weigh attempts and rhetoric heavily; to avoid crying wolf over mere misgovernment or normal polarization, one must wait for institutional damage to materialize. A concept optimized for the comparativist (lagged, structural) will always be too slow for the domestic actor (urgent, preventative). Additionally, **Normative Directionality** (Requirement 4) conflicts with **Observability**. Determining whether a norm break expands or restricts inclusion requires a theory of justice, not just data, compromising the comparativist's neutrality.

  **Exclusion and Prejudice**

  The requirement that does the most work excluding current accounts is **Cumulative Impact**. Most existing datasets code democracy as a stock variable (level of freedom) rather than a flow variable (direction of change). This excludes accounts that treat democracy as a static threshold; if you are above the line, you cannot be backsliding, only fallen.

  The requirement that is really a smuggled prejudice is **Intertemporal Neutrality**. Your friend is correct that this privileges liberal constitutionalism over pure majoritarianism. It asserts that a current majority does not own the rules of future competition. This is not an empirical fact but a normative commitment to pluralism over popular sovereignty. By making this non-negotiable, the concept rules out the friend's claim by definition, not by evidence. It assumes democracy is about *uncertainty of outcome*, not just *accuracy of representation*.

  **Scorecard of Account Families**

  | Account Family | Performance on Requirements | Critical Weakness |
  | :--- | :--- | :--- |
  | **Continuous Indices** (e.g., V-Dem, Freedom House) | Strong on **Cumulative Impact** and **External Verifiability**. Weak on **Near Miss**. | Lagged indicators miss the *process* of erosion until it is complete; treats all declines as equal. |
  | **Elections-Only** (Schumpeterian) | Strong on **Performance Independence**. Fails **Intertemporal Neutrality** and **Asymmetric Rules**. | Cannot detect entrenchment if the election itself remains technically free; validates mandate-laundering. |
  | **Intentions/Projects** (Actor-centered) | Strong on **Near Miss** and **Normative Directionality**. Fails **External Verifiability**. | Relies on inferring motive; vulnerable to claims of partisan bias when coding "anti-democratic" intent. |
  | **Checks/Balances** (Institutionalist) | Strong on **Cumulative Impact** and **Effect Sensitivity**. Fails **Baseline Agnosticism**. | Assumes a consolidated baseline exists; struggles to classify states like Hungary where checks were always weak. |

  **Conclusion**

  To satisfy the comparativist, the concept must rely on **External Verifiability** and **Cumulative Impact**. To satisfy the domestic actor, it must rely on **Intertemporal Neutrality** and **Attempt Sensitivity**. The friction is unavoidable. A usable account must admit that labeling backsliding is not a neutral act of measurement but a political claim that the rules of competition are being rigged against future alternation. If you accept **Intertemporal Neutrality**, you refute your friend's majoritarian claim, but you must concede that you are defending a specific, liberal theory of democracy, not a value-free description of reality. The concept survives only if it acknowledges that protecting the possibility of losing power is the core phenomenon, distinct from who currently holds it.
