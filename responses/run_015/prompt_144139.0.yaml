answer: |-
  # Adversarial Collaboration Draft: Epistemic vs. Dynamic Foundations in Game Theory

  ### Agreed Claims

  1.  The test bed is an eight-stage centipede game with perfect information, alternating moves, and a strictly increasing pot where taking ends play.
  2.  Rationality is defined instrumentally: an agent is rational if and only if they choose actions that maximize expected utility given their current beliefs.
  3.  Beliefs are represented as probability distributions over the opponent's possible strategies, updated via Bayes' rule whenever the observed history has non-zero prior probability.
  4.  A Nash equilibrium is a profile of strategies where each player's strategy is a best response to the other's, mathematically defined without reference to psychological processes.
  5.  We define surprise-robustness as follows: a solution concept is surprise-robust if it specifies actions and beliefs at every decision node, including those reached with probability zero under the predicted play, such that prescribed actions remain optimal given prescribed beliefs at that node, and the belief system is derivable from the initial model without logical contradiction.
  6.  Both sides agree that laboratory choices made under real financial incentives constitute valid data points that any successful theory must ultimately accommodate or explain away.
  7.  Arm A of the Mirror Centipede involves anonymous play with no prior information exchanged between subjects before the first move is made.
  8.  Arm B involves subjects viewing each other's scores on a standardized pre-test of game-theoretic reasoning before play begins, serving as a signal of rationality.
  9.  Arm C involves subjects submitting sealed contingent strategies to an auditor who announces only whether the submitted pair constitutes a mutual best response, without revealing the strategies themselves.
  10. Both sides agree that a theory is disconfirmed if experimental results systematically deviate from its pre-registered predictions beyond the bounds of statistical noise and known implementation errors.
  11. Neither side will appeal to hidden variables, such as unmeasured social preferences or confusion, unless those variables are independently measurable or explicitly modeled in the pre-registration.
  12. Both participants commit to accepting the outcome of this specific experimental design as the primary arbiter for the specific disagreements outlined in the following sections.

  ### Where the Disagreement Remains

  | Issue | Epistemic Side Position | Dynamic Side Position | Why the Split Is Not Merely Verbal |
  | :--- | :--- | :--- | :--- |
  | **Source of Equilibrium** | Equilibrium is derived logically from the agents' epistemic states; if agents are rational and know it, the solution is forced by consistency alone. | Equilibrium is the rest state of an adaptive process; it exists only insofar as a plausible learning dynamic converges to it over time. | One treats equilibrium as a logical truth about minds, the other as an empirical hypothesis about populations; they imply different stability conditions. |
  | **Common Knowledge** | Common knowledge of rationality is a necessary idealization; without it, the backward induction proof fails, so we must assume it to model rational agents. | Common knowledge is an impossible idealization for finite agents; models should rely on near-common knowledge or bounded depth of reasoning. | This changes the predicted stopping node in Arm B; one expects immediate unraveling, the other expects gradual decay based on score noise. |
  | **Off-Path Beliefs** | Beliefs at unreached nodes are constrained by logical consistency with the assumption of rationality; unexpected moves imply irrationality, not new data. | Beliefs at unreached nodes are determined by the learning algorithm's update rule; unexpected moves are data that shift future probabilities. | In Arm A, this dictates whether a continued game signals a mistake or a cooperative type; predictions diverge on continuation probabilities. |
  | **Role of Learning** | Learning is irrelevant to the solution concept; if agents are rational, they do not need to learn the equilibrium, they deduce it. | Learning is constitutive of the solution; without a specified learning rule, the equilibrium concept has no predictive power in one-shot games. | This determines whether repeated play in Arm A should show convergence; one says no change, the other says trajectory toward Nash. |
  | **Interpretation of Deviations** | Deviations in the lab indicate subjects failed to meet the rationality conditions, not that the theory of rationality is false. | Deviations in the lab indicate the theory failed to capture the actual mechanism of decision-making, requiring model revision. | One protects the theory by blaming the agent, the other protects the agent by blaming the theory; falsification conditions differ. |
  | **Normative Force** | The theory prescribes how agents ought to reason; if they do not, they are erroneous, regardless of evolutionary success. | The theory describes how agents do behave; if they survive without reasoning thus, the normative claim is empty. | This affects Arm C; one sees the auditor's confirmation as binding logic, the other as merely another input to the utility function. |

  ### Cruxes and Pre-registered Predictions

  **1. Off-Equilibrium Beliefs and Continuation**
  *Sub-question:* What should a player believe after observing a move the theory assigns probability zero?
  *Case:* Arm A, Stage 3. The epistemic solution predicts termination at Stage 1. If Play reaches Stage 3, the Epistemic side claims the player must believe the opponent is irrational but still maximize against that specific irrationality without updating the model of rationality itself. The Dynamic side claims the player updates their belief distribution over opponent types using Bayes' rule, increasing probability on cooperative types.
  *Prediction:* Epistemic predicts immediate take at Stage 3 (punishing irrationality). Dynamic predicts continued pass with probability >0.5 (testing for cooperation).
  *Falsification:* Epistemic is disconfirmed if players frequently pass at Stage 3 after an unexpected pass. Dynamic is disconfirmed if players immediately take regardless of history, showing no learning.

  **2. Near-Common Knowledge Limits**
  *Sub-question:* Does near-common knowledge of rationality behave like common knowledge as noise goes to zero?
  *Case:* Arm B. Subjects see pre-test scores. Epistemic side argues that high scores create sufficient common knowledge to trigger backward induction immediately. Dynamic side argues that scores are noisy signals; players require multiple iterations to trust the signal, so high scores only shift the distribution of stopping nodes later, not to Node 1.
  *Prediction:* Epistemic predicts >90% stop at Node 1 for high-score pairs. Dynamic predicts a smooth gradient where even perfect scores yield significant continuation rates.
  *Falsification:* Epistemic is disconfirmed if high-score pairs regularly pass Node 1. Dynamic is disconfirmed if there is a sharp discontinuity at the highest score tier.

  **3. Epistemic Forecast Uniqueness**
  *Sub-question:* Does the epistemic characterization yield any forecast the dynamic account does not?
  *Case:* Arm C. Auditor confirms submitted strategies are mutual best responses. Epistemic side argues this mechanically establishes common knowledge of rationality, forcing Node 1 stop. Dynamic side argues this is just a payoff-relevant signal; without a learning process to internalize it, subjects may ignore the logical implication.
  *Prediction:* Epistemic predicts 100% Node 1 stops. Dynamic predicts increased Node 1 stops relative to Arm A, but significantly less than 100%.
  *Falsification:* Epistemic is disconfirmed by any continuation. Dynamic is disconfirmed if Arm C results are statistically indistinguishable from Arm A.

  **4. Convergence Timescales**
  *Sub-question:* Is equilibrium immediate or asymptotic?
  *Case:* Arm A repeated over 20 rounds. Epistemic side predicts no systematic change over rounds; rationality is static. Dynamic side predicts convergence toward Nash over rounds as no-regret properties activate.
  *Prediction:* Epistemic predicts flat distribution of stopping nodes across rounds. Dynamic predicts shifting mass toward Node 1 over time.
  *Falsification:* Epistemic is disconfirmed by significant trend toward Node 1. Dynamic is disconfirmed by flat or diverging trends.

  ### Verbal-Dispute Audit

  Much of the apparent conflict dissolves if we fix the definition of "rationality." If rationality means "logical consistency," the Epistemic side is tautologically correct but empirically empty. If rationality means "successful adaptation," the Dynamic side is empirically robust but loses normative force. However, the dispute does not fully dissolve regarding Arm C. Both sides agree on the definition of Nash equilibrium, yet they disagree on whether an auditor's confirmation causally forces agents into that equilibrium instantly. This is not verbal; it is a causal claim about whether logical recognition overrides habitual play. Similarly, the status of off-equilibrium beliefs is not merely definitional; it dictates whether a player should punish or explore after a surprise move. These are actionable disagreements about behavior, not just semantics.

  ### Left Unresolved

  We could not settle whether the evolutionary selection of strategies in a population validates the epistemic solution as a long-run limit. Both sides agree that if a population converges to Nash, the outcome looks the same, but the mechanism matters for welfare analysis. Additionally, both sides treat Arm C outcomes where subjects ignore the auditor as uninformative regarding the theory of rationality itself; the Epistemic side calls it irrationality, the Dynamic side calls it model misspecification, and neither view is testable without independent measures of cognitive processing during the audit.
