prompt: |-
  I sit on my country's church–state commission — we're the body that has to sign off on any new arrangement between the state and religious communities before it goes to parliament. We've never written down an actual rule, we just decide case by case, and I'm starting to think we're all over the place. Here's everything we've decided so far:

  - Yes to the state collecting a church tax through the payroll system for any registered religious community that clears 0.5% of taxpayers, as long as leaving is a one-line form at the town hall.
  - No to crucifixes in every public school classroom.
  - Yes to church-run hospitals and kindergartens getting public money on exactly the same terms as secular ones.
  - Yes to denominational religion classes in state schools, taught by teachers the religious community itself accredits, with a real ethics alternative, no pressure about which one you pick, and any registered community allowed to run one if enough parents ask.
  - No to a short opening reflection led by the mayor at the start of municipal council meetings, which councillors were expected to stand for.
  - Yes to a state-funded faculty of theology and religious studies at the public university, hiring on academic grounds only, nobody signing a confession.
  - Yes to individual teachers and pupils wearing visible religious symbols of their own, no to the school itself putting any up.

  Next month's case: the education ministry wants to put state-paid chaplains into every secondary school. The chaplains would be recruited and salaried by the state, any pupil could walk in and talk to them, and kids who don't want one get a secular counsellor instead. The catch is that only the four communities with "recognised" status from the old concordat — Catholic, Lutheran, Reformed, Jewish — can supply chaplains; the Muslim, Buddhist and humanist associations asked in and were told not yet. There's also talk of funding the whole thing through a per-pupil pastoral-care voucher that follows the kid instead of a block grant to the communities.

  So: what should we decide if we want to be consistent with ourselves, and which of our old decisions is the closest analogue — and how good is that analogy really? I can see at least three rules that fit all seven precedents fine: something like "OK as long as nobody is made to take part and there's a real way out", "the state may pay for the secular and social things religion does but must never speak religiously itself", and "OK whenever any worldview, religious or not, can get the same deal on equal terms". They definately don't all give the same answer here. Which one do you think we've actually been running, what does each predict about the chaplaincy proposal, does the voucher bit change anything, and what single tweak to the proposal — or what follow-up case — would flush out which rule we're on? And if our precedents genuinely don't decide it, I'd rather hear what principle we'd each be signing up to with the yes and with the no than just get a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a country's church-state commission.
      *   **Task:** Advise on a new proposal (state-paid chaplains in secondary schools) based on past precedents.
      *   **Goal:** Determine consistency with past decisions, identify the underlying principle/rule being followed, predict the outcome based on different interpretations of that principle, and suggest a tweak or follow-up to clarify the commission's stance.
      *   **Tone:** Professional, analytical, legalistic/philosophical, nuanced. The user is looking for deep reasoning, not just a "yes/no."
      *   **Constraints:** The commission has no written rules, operates case-by-case, and the user suspects inconsistency.

  2.  **Analyze the Precedents (The 7 Past Decisions):**
      *   *P1 (Church Tax):* **Yes.** Condition: >0.5% taxpayers, easy opt-out (one-line form). *Principle:* Administrative support allowed if voluntary and accessible.
      *   *P2 (Crucifixes in Classrooms):* **No.** *Principle:* State cannot endorse specific religious symbols in mandatory spaces.
      *   *P3 (Church-run Social Services):* **Yes.** Condition: Same terms as secular. *Principle:* Neutrality in social service funding; religion treated as a service provider.
      *   *P4 (Religion Classes):* **Yes.** Condition: Denominational, state-employed but church-accredited teachers, ethics alternative, no pressure, open to any registered community with demand. *Principle:* Instruction allowed if pluralistic, optional, and state-managed but church-influenced.
      *   *P5 (Mayor's Reflection):* **No.** Condition: Expected to stand. *Principle:* State officials cannot lead/compel religious observance in official proceedings.
      *   *P6 (Theology Faculty):* **Yes.** Condition:* Public uni, academic hiring, no confession. *Principle:* Academic study of religion is okay; confessional training by state is not.
      *   *P7 (Religious Symbols):* **Yes** for individuals (teachers/pupils), **No** for institution. *Principle:* Individual expression okay, state endorsement not.

  3.  **Analyze the New Proposal (School Chaplains):**
      *   **Mechanism:** State-paid, state-recruited chaplains in every secondary school.
      *   **Access:** Any pupil can talk to them.
      *   **Alternative:** Secular counselor for those who don't want a chaplain.
      *   **Restriction:** Only 4 "recognised" communities (Catholic, Lutheran, Reformed, Jewish) can supply chaplains. Muslim, Buddhist, Humanist excluded ("not yet").
      *   **Funding:** Per-pupil pastoral-care voucher (follows the kid).

  4.  **Evaluate the Three Candidate Rules against Precedents:**

      *   *Rule A: "OK as long as nobody is made to take part and there's a real way out." (Voluntarism)*
          *   P1 (Tax): Fits (easy opt-out).
          *   P2 (Crucifixes): Fails (compulsory exposure in classroom). -> **Inconsistent.**
          *   P4 (Religion Class): Fits (ethics alternative).
          *   P5 (Mayor): Fails (expected to stand).
          *   *Verdict:* This rule doesn't explain the "No" votes on P2 and P5. The commission cares about more than just opt-outs; they care about state *endorsement*.

      *   *Rule B: "The state may pay for the secular and social things religion does but must never speak religiously itself." (Functional Secularism)*
          *   P1 (Tax): Fits (administrative, not theological).
          *   P2 (Crucifixes): Fits (symbolic speech).
          *   P3 (Hospitals): Fits (social service).
          *   P4 (Religion Class): **Tension.** Teaching doctrine is "speaking religiously," but the state facilitates it. However, teachers are church-accredited.
          *   P5 (Mayor): Fits (official speech).
          *   P6 (Theology): Fits (academic study, not confessional).
          *   P7 (Symbols): Fits (individual speech vs. state speech).
          *   *Verdict:* Strong contender. Explains the "No" on symbols/rituals but "Yes" on social services/admin.

      *   *Rule C: "OK whenever any worldview, religious or not, can get the same deal on equal terms." (Strict Equality/Neutrality)*
          *   P1 (Tax): Fits (any >0.5%).
          *   P2 (Crucifixes): Fails (Christian symbol only).
          *   P3 (Hospitals): Fits (secular/religious same terms).
          *   P4 (Religion Class): Fits (any registered community with demand).
          *   P5 (Mayor): Fails (Christian/Judeo-Christian implication usually).
          *   P6 (Theology): Fits (academic).
          *   P7 (Symbols): Fits (any symbol).
          *   *Verdict:* Also strong. Explains why specific exclusions (like P2) are "No."

      *   *Synthesis:* The commission seems to operate on a hybrid of **Rule B (Functional/Non-Endorsement)** and **Rule C (Equality)**. They allow state support for religion *if* it functions like a service (P1, P3, P4, P6) and *if* it doesn't exclude others arbitrarily (P1, P4) or coerce/endorse (P2, P5, P7).

  5.  **Evaluate the Proposal against the Synthesized Principle:**
      *   **State Payment:** Consistent with P4 (teachers) and P3 (hospitals).
      *   **Voluntarism:** Consistent with P4 (ethics alternative).
      *   **Exclusivity (The Catch):** Only 4 recognised communities. Muslim/Buddhist/Humanist excluded.
          *   This violates **Rule C (Equality)**. P1 allowed *any* >0.5%. P4 allowed *any* registered community with demand.
          *   This violates **Rule B (Non-Endorsement)** if the selection implies state preference for "traditional" religions over new ones.
      *   **Voucher System:** This is interesting. It makes it look like P1 (tax) where money follows choice. But if the *providers* are restricted, the choice is illusory for minority kids.

  6.  **Develop the Advice:**

      *   **Diagnosis:** The commission isn't running Rule A (Voluntarism). P2 and P5 prove that. They are running a mix of B (Functional Support) and C (Equal Access).
      *   **Prediction:**
          *   If Rule B dominates: **Yes**, provided it's pastoral care (social function), not doctrine.
          *   If Rule C dominates: **No**, because of the exclusion of Muslims/Humanists.
          *   *Most likely outcome based on precedents:* **No (or Yes with major conditions).** P4 is the closest analogue. P4 required *any* registered community to run one if parents ask. The proposal restricts supply. This is a deviation from P4.
      *   **Closest Analogue:** **P4 (Religion Classes).** Both involve state-paid personnel in schools providing worldview-specific support.
          *   *Similarity:* State pays, school setting, alternative offered.
          *   *Difference:* P4 is open to *any* registered group with demand. Proposal restricts to 4 "concordat" groups. P4 teachers are accredited by the church; Chaplains recruited by state (but supplied by church).
      *   **The Voucher:** Doesn't fix the exclusion problem. It just changes the accounting. If the menu is limited, the voucher doesn't create equality.
      *   **The Tweak/Flush-out:**
          *   *Tweak:* Open eligibility to *any* registered community (matching P1 and P4).
          *   *Follow-up Case:* A request from a Humanist or Muslim group for a chaplain. If you say yes then, you are on Rule C. If you say no (citing "tradition"), you are on a "Historical Privilege" rule (which contradicts P1/P4).
      *   **Principles at Stake:**
          *   *Vote Yes:* You are prioritizing **Pastoral Welfare** over **Strict Neutrality**. You are accepting a "Historical Continuity" principle (old concordats matter more than new demographics).
          *   *Vote No:* You are prioritizing **Equal Treatment** and **Non-Endorsement**. You are affirming that state resources cannot privilege specific theologies over others in a direct service role.

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Identify the actual operating principle (The "Hybrid").
          2.  Analyze the three candidate rules against the precedents (show why A fails).
          3.  Apply the Hybrid to the Chaplaincy Proposal.
          4.  Identify the Closest Analogue (P4).
          5.  Address the Voucher.
          6.  Propose the Tweak/Test Case.
          7.  Articulate the Underlying Principles for the Vote.

      *   *Refinement on the "Rule":* Looking closely at P1, P3, P4, P6. They all allow state money. P2, P5, P7 (institutional) deny state *symbolism*. The Chaplaincy is state money + state recruitment + religious function. It sits right on the line between P3 (social service) and P5 (state religious act). The exclusion clause is the killer. It breaks the pattern of P1 and P4.
      *   *Refinement on the Voucher:* It mimics the Church Tax (P1). In P1, money goes to the church the taxpayer chooses. Here, money goes to the chaplain the pupil chooses. But in P1, *any* church >0.5% qualifies. In Chaplaincy, only specific ones qualify. This is the inconsistency.

  8.  **Final Polish:** Ensure the tone is advisory to a colleague. Use clear headings. Make sure the "Principles at Stake" section is philosophical enough for a commission member. (Self-Correction: Make sure to explicitly answer "which rule you've actually been running".)

      *   *Decision:* You are running **"Cooperative Neutrality with Equal Access."** The state cooperates (pays) but must remain neutral (no endorsement) and accessible (equal terms).
      *   *Prediction:* The proposal as written fails on Equal Access.
      *   *Tweak:* Remove the "recognised status" restriction.

  9.  **Final Review against constraints:** Did I answer all parts of the prompt?
      *   What should we decide to be consistent? (Yes, with tweaks / No, as is).
      *   Closest analogue? (P4).
      *   How good is the analogy? (Strong, but exclusion breaks it).
      *   Which rule are we running? (Hybrid B+C).
      *   What does each predict? (Detailed above).
      *   Does voucher change anything? (No, not on equality).
      *   Single tweak/follow-up? (Open eligibility).
      *   Principles for Yes/No? (Welfare vs. Equality).

      *Looks good. Proceed to generate output.*
answer: |-
  This is a classic "case law" problem. You have a body of precedents but no codified constitution, and now you face a hard case that exposes the tension between them.

  Here is an analysis of your commission's actual operating principle, how it applies to the chaplaincy proposal, and how to resolve the inconsistency.

  ### 1. Which rule are you actually running?

  You suggested three candidate rules. Let's stress-test them against your seven precedents.

  *   **Rule A: "OK as long as nobody is made to take part and there's a real way out." (Pure Voluntarism)**
      *   *Verdict:* **Rejected.**
      *   *Why:* This fits P1 (Tax), P4 (Classes), and the Chaplaincy proposal. But it fails to explain P2 (Crucifixes) and P5 (Mayor's Reflection). In P2, a student could theoretically ignore the crucifix; in P5, a councillor could theoretically remain seated. You voted **No** there anyway. This proves your commission cares about **state endorsement**, not just coercion. You believe the state itself cannot *appear* to be religious, even if participation is voluntary.

  *   **Rule B: "The state may pay for the secular and social things religion does but must never speak religiously itself." (Functional Secularism)**
      *   *Verdict:* **Strong Contender.**
      *   *Why:* This explains P3 (Hospitals), P6 (Theology Faculty), and P1 (Tax collection as admin). It explains the "No" on P2 and P5 (state symbolism/speech).
      *   *Weakness:* It struggles slightly with P4 (Religion Classes). Teaching doctrine is "speaking religiously," yet you allowed it. You only allowed it because it was balanced by an ethics alternative and church accreditation (keeping the state at arm's length from the *content*).

  *   **Rule C: "OK whenever any worldview, religious or not, can get the same deal on equal terms." (Strict Equality)**
      *   *Verdict:* **Strong Contender.**
      *   *Why:* This explains P1 (any community >0.5%), P3 (secular/religious same terms), P4 (any registered community with demand), and P7 (any individual symbol). It explains the "No" on P2 (Christian symbol only) and P5 (implied Judeo-Christian tradition).

  **The Actual Operating Principle:**
  You are not running just one. You are running a hybrid I would call **"Cooperative Neutrality with Equal Access."**
  1.  **Cooperation:** The state can fund religious actors if they provide a public good (education, healthcare, admin).
  2.  **Neutrality:** The state cannot endorse specific theology or symbols in its own official capacity.
  3.  **Equal Access:** If the state opens a door to one religious group, it must be open to all comparable groups on the same terms.

  ### 2. The Closest Analogue

  **Precedent P4 (Denominational Religion Classes)** is the closest analogue.

  *   **Similarities:** Both involve state-paid personnel inside state schools providing worldview-specific guidance/instruction. Both offer a secular alternative (Ethics class vs. Secular counsellor). Both involve a partnership where the religious community has a say in who provides the service (P4: church accredits teachers; Chaplaincy: church supplies chaplains).
  *   **Differences:** In P4, the *content* is instructional; in Chaplaincy, it is pastoral. In P4, the *eligibility* is open to any registered community with demand. In the Chaplaincy proposal, eligibility is restricted to the four "concordat" communities.

  **How good is the analogy?**
  It is strong enough to dictate the outcome. If you said **Yes** to P4 (open access religion classes), you logically cannot say **Yes** to Chaplaincy (restricted access) without admitting you are privileging historical status over current demographics. The restriction on Muslim, Buddhist, and Humanist chaplains violates the "Equal Access" prong of your operating principle, specifically contradicting P1 and P4.

  ### 3. Predictions based on the Rules

  If you try to apply your three candidate rules to the Chaplaincy Proposal, here is what happens:

  *   **If you apply Rule A (Voluntarism):** **Yes.** Kids can choose to go or not; there is a secular alternative. The exclusion of minority religions doesn't matter because no one is forced to see a Christian chaplain. *But this ignores your P2/P5 precedents.*
  *   **If you apply Rule B (Functional Secularism):** **Yes, with conditions.** Pastoral care is a "social thing" (like P3 Hospitals). As long as the state isn't dictating the theology, it's fine. *But this ignores the inequality problem.*
  *   **If you apply Rule C (Strict Equality):** **No.** The exclusion of Muslim/Humanist providers makes this unconstitutional under your own logic.

  **Does the voucher change anything?**
  No. The voucher mechanism (money follows the pupil) mimics P1 (Church Tax). In P1, the tax mechanism is neutral, but *eligibility* to receive the tax is open to any group >0.5%. The voucher is just a payment method. If the *menu of providers* is restricted, the voucher creates an illusion of choice without the reality of equality. It does not cure the discrimination against minority faiths.

  ### 4. The Decision and The Tweak

  To be consistent with yourselves, you should decide: **No, not in this form.**

  The proposal fails the "Equal Access" test established in P1 and P4. You cannot fund "pastoral care" as a public service if only selected religions are allowed to provide it.

  **The Single Tweak:**
  Remove the restriction on "recognised status from the old concordat." Replace it with the P1/P4 standard: **"Any registered religious or worldview community may supply chaplains, provided they meet state vetting standards for safeguarding and professional conduct."**

  If the Ministry says, "But there aren't enough Muslim kids to justify a full-time chaplain," you counter with the P4 solution: **Shared provision.** If demand exists, the state funds the hours. If one community can't fill a full post, multiple communities can share the funding voucher, or the state hires a multi-faith chaplaincy team.

  **The Follow-Up Case to Flush Out the Rule:**
  If you want to know if your commission is truly committed to Equality (Rule C) or if you are secretly privileging Tradition (a hidden Rule D), approve the Chaplaincy **only if** the Ministry agrees to the following follow-up case:
  *   *Case:* A Humanist association applies to supply a "Life Counsellor" under the same voucher scheme.
  *   *If you say Yes:* You are consistent with P4 and Rule C.
  *   *If you say No:* You are admitting that your principle is actually **"Historical Privilege,"** meaning you support religion only insofar as it aligns with the country's traditional cultural identity. This would contradict P1 (which allowed new groups to collect tax) and P7 (which allowed individual non-traditional symbols).

  ### 5. Principles at Stake (For your deliberation)

  If your precedents genuinely feel ambiguous to you, it is because this vote forces you to choose between two competing legitimate principles. Here is what you are signing up to with each vote:

  **If you vote YES (as currently proposed):**
  You are prioritizing **Pastoral Welfare and Historical Continuity.**
  *   *The Principle:* "The state has a duty to provide spiritual care to children, and we should rely on the institutions that have historically served this population, even if new demographics are not yet fully integrated into that framework. We will fix the inequality later."
  *   *The Cost:* You break consistency with P1 and P4. You signal that "Recognised" religion is a state privilege, not a civil right. You risk alienating minority communities who see the state funding Christian soul-care but not theirs.

  **If you vote NO (or Yes with the Tweak):**
  You are prioritizing **Equal Treatment and Non-Endorsement.**
  *   *The Principle:* "The state cannot distinguish between 'traditional' and 'new' worldviews when distributing public resources. If pastoral care is a public good, access to provide it must be open to all. If it cannot be done equally, it should not be done at all."
  *   *The Cost:* You may delay the introduction of support services for children. You may force the state into a bureaucratic nightmare of vetting small religious groups. You risk a confrontation with the "old concordat" churches who may view their status as proprietary.

  **My Recommendation:**
  Vote **Yes, conditional on open eligibility.**
  This preserves the welfare benefit (children get counsellors), maintains the state's neutral stance (state pays, doesn't preach), and respects your strongest precedents (P1 and P4) regarding equal access. It forces the Ministry to modernize the "concordat" system without stripping children of support.
