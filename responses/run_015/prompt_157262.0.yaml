          *   *Vulnerability:* Does he value the *state* of negation as a positive metaphysical achievement? Maybe. But it's very close to ST.
          *   *Tier:* A-Tier. Slightly less pure than the Theravada cessationist view because of the metaphysical framing of "salvation" which might imply a positive ontological shift rather than just cessation.

      *   **(4) Negative Utilitarianism (NU):**
          *   *Definition:* Minimize suffering. Permit positive welfare/cooperation as side-effects.
