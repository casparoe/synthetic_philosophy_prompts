      *   *Applicant's Angle:* Focus on *Settlement Structure*. It's not just "I want certainty," it's "I want to know *now* so I can plan." This is related to temporal resolution of uncertainty, but specifically framed around the *pragmatics of settlement* (borrowing, planning, identity).
