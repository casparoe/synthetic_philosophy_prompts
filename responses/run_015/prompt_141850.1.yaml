answer: |-
  # TEACHER'S LOGICAL MAP (Pre-Construction Analysis)

  **The Logical Space:**
  To sort the five positions without naming them, I must map their commitments across five axes:
  1.  **Supervenience:** Does art-status depend on perceptible features (Aesthetic) or relations (Institutional/Historical)?
  2.  **Conferral:** Is status granted by the Artworld (Institutional) or by the Maker's Intention/History (Historical)?
  3.  **Stability:** Can status be lost/regained (Institutional) or is it fixed (Essentialist/Historical)?
  4.  **Universality:** Can objects exist as art before the "artworld" existed (Essentialist/Cluster) or not (Institutional/Historical)?
  5.  **Normativity:** Must art be "good" (Aesthetic Essentialism) or can it be bad (Others)?

  **Discriminating Strategy:**
  *   **Q1 (Forgery)** splits Aesthetic (Yes) from Relational theories (No).
  *   **Q4 (Private Work)** splits Institutional (No uptake) from Historical (Yes intention).
  *   **Q2 (Ritual)** splits Institutional (Status changes) from Essentialist/Historical (Status fixed).
  *   **Q8 (Definition Goal)** isolates Anti-Essentialism (Question is misguided).

  **Empty/Problematic Spaces:**
  *   *Incoherent:* Claiming art requires Institutional Conferral (Q6: Gallery makes it art) BUT Pre-historical objects are art (Q3: Yes). Institutions didn't exist then.
  *   *Indistinguishable:* Cluster and Anti-Essentialism often yield similar "It depends" answers. Q8 targets the *motivation* for defining to separate them.

  **Workhorse Question:**
  *   **Q1 (The Forgery).** It performs the primary cut between Internal/Perceptual theories and External/Relational theories, which is the deepest divide in modern aesthetics.

  ***

  # STUDENT HANDOUT: ART & INTUITION DIAGNOSTIC
  **Course:** Introduction to Aesthetics | **Instructions:** Read each case. Circle the **one** response that best matches your intuition. There are no right or wrong answers.

  **1. The Perfect Forgery**
  A painter creates a physically perfect copy of the *Mona Lisa*. Experts cannot tell it apart from the original, even with technology. Everyone believes it is the original.
  *   A. It is a work of art, because it looks exactly like the masterpiece.
  *   B. It is not a work of art, because it lacks the correct history/origin.

  **2. The Ritual Mask**
  A sacred mask is made for a ritual. Later, a museum buys it and displays it as "Art." Years later, it is repatriated and returned to the tribe for ritual use.
  *   A. It was always art, regardless of where it was.
  *   B. It was art in the museum, but stopped being art when returned to ritual.
  *   C. It was never art; it is a ritual object that was temporarily mislabeled.

  **3. The Isolated Twin**
  An object physically identical to a famous modern painting is produced by a remote community that has no concept of "art," "museums," or "representation."
  *   A. It is a work of art, because it possesses the right visual qualities.
  *   B. It cannot be a work of art, because the community has no practice of art.

  **4. The Private Notebook**
  A writer creates a complex, beautiful poem but locks it in a safe. No one ever reads it. The writer dies, and the notebook is burned without anyone knowing it existed.
  *   A. It was a work of art, because the creator intended it as such.
  *   B. It was not a work of art, because no public audience ever engaged with it.

  **5. The Elegant Proof**
  Mathematicians admire a new proof for its elegance, symmetry, and creativity. It is not a physical object.
  *   A. It counts as a work of art (or something very close to it).
  *   B. It does not count; it is science/math, not art.

  **6. The Driftwood**
  A curator finds a piece of driftwood on a beach, places it on a pedestal in a gallery, and labels it "Untitled."
  *   A. It is a work of art, because the gallery context makes it so.
  *   B. It is not a work of art, because nature made it, not an artist.

  **7. The Failed Masterpiece**
  An artist intends to make a profound statement but produces something boring, clumsy, and universally disliked.
  *   A. It is still art, just very bad art.
  *   B. If it fails completely to engage us, it fails to be art at all.

  **8. The Definition Goal**
  After answering these questions, you are asked: "What is the single rule that covers all your choices?"
  *   A. There must be a rule; otherwise we are just guessing.
  *   B. Trying to find one rule is a mistake; the word "art" is used in too many ways.

  ***

  # TEACHER'S SCORING KEY & ANALYSIS

  **Scoring Patterns:**
  *   **Aesthetic Essentialist:** 1A, 2A, 3A, 4A, 5A, 6B, 7B, 8A. *(Focus: Perceptible qualities, beauty, fixed status.)*
  *   **Institutionalist:** 1B, 2B, 3B, 4B, 5B, 6A, 7A, 8A. *(Focus: Artworld conferral, status can change, requires public context.)*
  *   **Intentional-Historical:** 1B, 2C, 3B, 4A, 5B, 6B, 7A, 8A. *(Focus: Artist intention, relation to art history, no art before art-practice.)*
  *   **Cluster/Family Resemblance:** Mixed A/B on 1, 3, 5, 6 (Context dependent); 2A or B; 7A; 8A. *(Focus: No single condition, but reasonable criteria exist.)*
  *   **Neo-Wittgensteinian:** Any mix, but **must select 8B**. *(Focus: The concept is open; definition is impossible/unnecessary.)*

  **Required Flags & Diagnostics:**

  1.  **Empty Logical Combination:**
      *   *Combination:* Answering **2B** (Art status changes via Museum/Context) AND **3A** (Pre-historical/Isolated objects are Art).
      *   *Diagnosis:* **Incoherent.** You cannot hold that art-status is conferred by institutional context (2B) while simultaneously claiming objects outside any institutional context possess that status (3A).

  2.  **Indistinguishable Leaves:**
      *   *Pair:* **Institutional View** and **Intentional-Historical View**.
      *   *Problem:* These positions agree on the Forgery (1B), Isolated Twin (3B), and Driftwood (6A vs 6B is usually the split, but Historical can accept Driftwood if intended). They are hardest to separate on public works.
      *   *Separator:* **Question 4 (The Private Notebook).** Institutionalists say "No" (no public uptake); Historical theorists say "Yes" (intention suffices). This is the only question that cleanly isolates the *source* of the relational property (Public vs. Private Intention).

  3.  **The Workhorse Question:**
      *   **Question 1 (The Perfect Forgery).**
      *   *Reason:* This question performs the primary cut of the entire logical space. Answer **A** isolates all Perceptual/Aesthetic theories. Answer **B** isolates all Relational theories (Institutional, Historical, Cluster). No other question divides the field as cleanly between "Internal Features" and "External Relations."

  **Note on Clustering:**
  Students who select **8B** are sorted as Anti-Essentialists regardless of prior answers, as this meta-philosophical commitment overrides specific case intuitions. Students with mixed A/B answers on 1, 3, 5, 6 (without 8B) are sorted as Cluster Theorists.
