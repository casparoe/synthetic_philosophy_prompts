prompt: |-
  i'm a phd student in philosophy of science but i sit on a hospital ethics commitee every thursday, and we keep getting proposals where someone wants to delay an intervention to "gather more data" and nobody knows how to decide if that's legit. I want you to turn Good's theorem — the value of information thing — into a step-by-step procedure my committee can run in 20 minutes with no calculus. Give me the ordered questions: what prior do we state in writing, how do we sketch the loss function without inventing fake dollars, where do we check if the expected value of information exceeds the cost of waiting (including a seasonal decay penalty if delay makes the result useless), and how do we spot "epistemic rent-seeking" where a stakeholder is just using information requests to stall. For each step say what counts as a sufficient answer and where the procedure stops with a clear "no — approve now" vs "yes — delay is rational" vs "this is a values call, not a math call." Make sure it handles disagreements between clinicians and budget officers with thier different loss functions, and flag the spots where judgment is unavoidable. Then apply it to three cases: delaying a triage protocol for a 200-person study; refusing to wait on a cheap supplement; and a flu-vaccine rollout where the procedure outputs "collect more data" right as the season peaks — that's the one I won't like, show me exactly where it breaks and hands back to human judgment. Finally, say what the procedure can't do: settle prior disputes, handle purely symbolic harms, or stop information from being weaponized politically.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of science, sits on a hospital ethics committee.
      *   **Problem:** Frequent proposals to delay interventions to "gather more data." Committee struggles to decide legitimacy.
      *   **Task:** Convert Good's Theorem (Value of Information) into a 20-minute, no-calculus, step-by-step procedure for the committee.
      *   **Requirements:**
          *   Ordered questions.
          *   Define priors (written).
          *   Sketch loss functions (no fake dollars).
          *   Check Expected Value of Information (EVI) vs. Cost of Waiting (including seasonal decay).
          *   Spot "epistemic rent-seeking" (stalling).
          *   Define sufficient answers for each step.
          *   Decision points: "No — Approve Now," "Yes — Delay is Rational," or "Values Call."
          *   Handle disagreements (clinicians vs. budget officers).
          *   Flag unavoidable judgment spots.
          *   Apply to three specific cases (Triage protocol, Cheap supplement, Flu-vaccine rollout).
          *   Critique the Flu case (where it outputs "collect data" at peak season).
          *   State limitations (prior disputes, symbolic harms, political weaponization).
      *   **Tone:** Professional, rigorous, practical, philosophically informed but operationally usable.

  2.  **Deconstruct Good's Theorem for Non-Mathematicians:**
      *   *Core Idea:* Gather more information *if and only if* the expected benefit of making a better decision with that information exceeds the cost of acquiring it (including the cost of delay).
      *   *Translation:*
          *   "Prior" $\rightarrow$ Current confidence level.
          *   "Loss Function" $\rightarrow$ Harm of being wrong (Type I vs. Type II errors).
          *   "Cost of Waiting" $\rightarrow$ Patient harm during delay + Opportunity cost.
          *   "Value of Information" $\rightarrow$ Likelihood the new data changes the decision.

  3.  **Drafting the Procedure (The "Good's Theorem Triage Tool"):**
      *   *Time Limit:* 20 minutes. Needs to be punchy.
      *   *Step 1: The Decision & The Doubt.* Define the choice. Why wait?
      *   *Step 2: The Prior (Written).* What do we think now?
      *   *Step 3: The Loss Sketch.* What hurts if we're wrong? (Clinician vs. Admin views).
      *   *Step 4: The Cost of Delay.* What happens while we wait? (Seasonal decay).
      *   *Step 5: The Information Value.* Will this data actually change our minds?
      *   *Step 6: The Rent-Seeking Check.* Is this stalling?
      *   *Step 7: The Verdict.*

  4.  **Refining the Steps (Addressing Specific Constraints):**
      *   *Priors:* Need to be explicit probabilities or confidence levels (Low/Med/High).
      *   *Loss Function:* Use ordinal scales (1-5) or categories (Catastrophic, Moderate, Negligible) instead of dollars.
      *   *Seasonal Decay:* Explicit question about timing relevance.
      *   *Rent-Seeking:* Look for moving goalposts or data that won't change action.
      *   *Disagreements:* Allow separate loss scores for Clinicians vs. Admin, then compare.
      *   *Judgment Flags:* Explicitly mark where numbers can't decide.

  5.  **Developing the Three Cases:**
      *   *Case 1: Triage Protocol (200-person study).* High stakes, moderate delay cost. Likely "Delay" if study is quick, "Approve" if study takes too long relative to harm.
      *   *Case 2: Cheap Supplement.* Low cost, low risk. "Approve Now" usually, unless harm is unknown.
      *   *Case 3: Flu Vaccine (The Trap).* This is the critical test. The math might say "wait for more efficacy data," but the season is peaking. The procedure *must* flag the "Cost of Delay" as skyrocketing, forcing a "Values Call" or overriding the data request. I need to show *where* the procedure breaks. It breaks at the weighting of "Current Harm" vs. "Future Precision."

  6.  **Addressing the "Flu Vaccine" Critique:**
      *   The prompt specifically asks to show where it breaks.
      *   *Analysis:* Good's theorem assumes stationary costs. In a pandemic/flu season, the cost of delay is non-linear and explosive. If the procedure outputs "collect data" at peak season, the *Cost of Delay* input was underestimated.
      *   *Fix/Flag:* The procedure needs a "Kill Switch" for time-sensitive crises. I will highlight this in the critique section.

  7.  **Addressing Limitations:**
      *   Priors are subjective.
      *   Symbolic harms (trust, dignity) don't fit loss functions well.
      *   Political weaponization (data as power) is outside the scope of rational choice theory.

  8.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I avoid calculus? Yes, use scales and qualitative comparisons.
      *   *Check:* Is it 20 minutes? Yes, 7 steps with specific time allocations.
      *   *Check:* Did I handle the Clinician vs. Budget Officer conflict? Yes, in Step 3 (Dual Scoring).
      *   *Check:* Is the tone right? Needs to be authoritative but humble about the limits of formalism.
      *   *Check:* The Flu Case. Make sure I don't just say "it works." I need to show *why* it might output the wrong thing if humans don't intervene. The prompt says "that's the one I won't like, show me exactly where it breaks." Okay, I need to be honest: The procedure *relies* on accurate input. If the input underestimates the decay, the output is garbage. I will pinpoint Step 4 as the failure point.

  9.  **Final Polish:**
      *   Ensure clear headings.
      *   Make the "Verdict" logic crisp.
      *   Ensure the "Epistemic Rent-Seeking" check is sharp.
      *   Philosophy of Science nod: Acknowledge underdetermination.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the **Good's Theorem Triage Tool (GTTT)**. It is designed for a 20-minute ethics committee huddle. It translates the Expected Value of Information (EVI) into ordinal scales and qualitative checks, avoiding calculus while preserving the logical structure of decision theory.

  ---

  ### The Procedure: Good's Theorem Triage Tool (GTTT)
  **Time Limit:** 20 Minutes
  **Participants:** Committee Chair, Clinician Rep, Admin/Budget Rep, Ethics Lead.

  #### Step 1: Define the Decision and the Delay (2 Minutes)
  **Question:** What specific intervention are we deciding on, and exactly what data are we waiting for?
  *   **Action:** Write the decision in binary form (e.g., "Adopt Protocol X" vs. "Maintain Status Quo"). Write the data requirement specifically (e.g., "Wait for N=200 trial results" vs. "Wait for peer review").
  *   **Sufficient Answer:** "We are deciding [A vs B]. We are waiting for [Specific Dataset] which will take [Time Duration]."
  *   **Stop Condition:** If the data requested is vague ("more safety data"), **STOP → No. Approve Now** (Vague requests are inherently non-actionable).

  #### Step 2: State the Prior (Written) (3 Minutes)
  **Question:** Based on *current* evidence, what is our confidence that the intervention is net-beneficial?
  *   **Action:** Each member writes a confidence percentage (0-100%) or a category (Low/Med/High).
  *   **Clinician Prior:** Based on pathophysiology/preliminary data.
  *   **Admin Prior:** Based on cost-effectiveness/risk liability.
  *   **Sufficient Answer:** A recorded number/category for each stakeholder group.
  *   **Judgment Flag:** If Clinician Prior is High (>80%) and Admin Prior is Low (<20%), **FLAG → Values Call**. This is not an information problem; it is a goal conflict.

  #### Step 3: Sketch the Loss Function (No Dollars) (5 Minutes)
  **Question:** What is the harm of being wrong? Do not use currency. Use "Harm Tiers."
  *   **Tier 1 (Catastrophic):** Death, permanent disability, system collapse.
  *   **Tier 2 (Significant):** Extended stay, moderate morbidity, major budget overrun.
  *   **Tier 3 (Negligible):** Minor discomfort, minor cost variance.
  *   **Action:** Score the loss of **False Positive** (Adopting a bad intervention) and **False Negative** (Rejecting a good one) for both Clinicians and Admin.
  *   **Sufficient Answer:** Two Tiers per stakeholder (e.g., Clinician FP = Tier 2; Admin FN = Tier 2).
  *   **Disagreement Handling:** If Clinicians score FP as Tier 1 and Admin scores it as Tier 3, **FLAG → Values Call**. Do not average these. The procedure cannot resolve incommensurable harms.

  #### Step 4: Calculate the Cost of Waiting (Decay Penalty) (4 Minutes)
  **Question:** What happens to the patients *during* the delay?
  *   **Action:** Assign a **Decay Multiplier** to the intervention's value based on the delay duration.
      *   *Stable Condition:* Multiplier = 1.0 (Value stays same).
      *   *Progressive Condition:* Multiplier = 0.5 (Value halves).
      *   *Seasonal/Emergent:* Multiplier = 0.0 (Value becomes useless, e.g., flu season ends).
  *   **Sufficient Answer:** A selected Multiplier.
  *   **Critical Check:** If Multiplier is 0.0 or 0.5, the **Cost of Waiting** automatically outweighs moderate information value.
  *   **Judgment Flag:** If the Multiplier is disputed (e.g., Clinician says 0.5, Admin says 1.0), **FLAG → Values Call**.

  #### Step 5: Estimate the Value of Information (VOI) (3 Minutes)
  **Question:** If the new data arrives, how likely is it to change our decision?
  *   **Action:** Estimate the **Probability of Decision Change (PDC)**.
      *   *High:* Data could easily flip us from Yes to No (or vice versa).
      *   *Low:* We would likely ignore the data and do the same thing anyway.
  *   **Sufficient Answer:** High/Low.
  *   **Logic:** If PDC is Low, VOI is Zero. **STOP → No. Approve Now** (based on current prior).

  #### Step 6: The Epistemic Rent-Seeking Check (2 Minutes)
  **Question:** Who benefits from the delay, and is the data request proportional?
  *   **Action:** Ask three rapid-fire questions:
      1.  Did this stakeholder oppose the intervention *before* asking for data?
      2.  Is the requested sample size N larger than needed to detect a clinically meaningful difference?
      3.  Does the stakeholder have a competing intervention they prefer?
  *   **Sufficient Answer:** If 2 out of 3 are "Yes," **STOP → No. Approve Now** (Flag as Stalling).

  #### Step 7: The Verdict (1 Minute)
  **Logic Gate:**
  1.  **If Step 6 (Rent-Seeking) = Yes:** → **No. Approve Now.**
  2.  **If Step 4 (Decay) = 0.0 or 0.5:** → **No. Approve Now.** (Cost of waiting is too high).
  3.  **If Step 5 (VOI) = Low:** → **No. Approve Now.** (Data won't change minds).
  4.  **If Step 2 or 3 (Prior/Loss) = Flagged Disagreement:** → **Values Call.** (Send to Board/Director).
  5.  **If All Clear & Step 5 (VOI) = High & Step 4 (Decay) = 1.0:** → **Yes. Delay is Rational.**

  ---

  ### Application to Three Cases

  #### Case 1: Delaying a Triage Protocol for a 200-Person Study
  *   **Context:** New triage algorithm proposed. Researchers want to run a study first (3 months).
  *   **Step 1:** Decision = Adopt vs. Wait. Data = 200-patient outcomes.
  *   **Step 2:** Priors = Clinicians High (85%), Admin Med (60%).
  *   **Step 3:** Loss = False Positive (Bad Triage) = Tier 1 (Death risk). False Negative = Tier 2 (Inefficiency).
  *   **Step 4:** Decay = 1.0 (Triage is always needed).
  *   **Step 5:** VOI = High (Study could reveal safety issues).
  *   **Step 6:** Rent-Seeking = No (Researchers are neutral).
  *   **Verdict:** **Yes — Delay is Rational.**
  *   **Reasoning:** The Loss of False Positive is Tier 1. The Cost of Waiting (3 months of status quo) is acceptable compared to the risk of implementing a deadly protocol. The VOI is high because it directly addresses the Tier 1 risk.

  #### Case 2: Refusing to Wait on a Cheap Supplement
  *   **Context:** Proposal to add Vitamin D to standard care. Cost is negligible. Request to wait for a major multi-center trial (2 years).
  *   **Step 1:** Decision = Add vs. Wait. Data = Multi-center trial.
  *   **Step 2:** Priors = Clinicians High (90%), Admin High (90%).
  *   **Step 3:** Loss = False Positive = Tier 3 (Waste of pennies). False Negative = Tier 2 (Missed recovery).
  *   **Step 4:** Decay = 1.0.
  *   **Step 5:** VOI = Low (Unlikely to reverse decision given safety profile).
  *   **Step 6:** Rent-Seeking = Maybe (Admin cautious).
  *   **Verdict:** **No — Approve Now.**
  *   **Reasoning:** Step 5 triggers the stop. The cost of being wrong is Tier 3. The cost of waiting (2 years of missed benefit) outweighs the value of confirming a Tier 3 risk.

  #### Case 3: Flu-Vaccine Rollout (The Breakage Case)
  *   **Context:** New adjuvant vaccine available. Data suggests 10% better efficacy but safety profile slightly less known than standard. Request to wait for 6-week safety analysis. **It is currently Week 1 of Flu Season Peak.**
  *   **Step 1:** Decision = Rollout vs. Wait. Data = 6-week safety analysis.
  *   **Step 2:** Priors = Clinicians High (95%), Admin Med (70%).
  *   **Step 3:** Loss = False Positive = Tier 2 (Side effects). False Negative = Tier 1 (Deaths from flu).
  *   **Step 4:** Decay = **0.0 (Seasonal).** If we wait 6 weeks, the peak passes. The vaccine becomes useless for this season.
  *   **Step 5:** VOI = High (Safety data would be nice).
  *   **Step 6:** Rent-Seeking = No.
  *   **Procedure Output:** **No — Approve Now.** (Triggered by Step 4 Decay Multiplier).

  **Where the Procedure Breaks (The Critique):**
  You asked to see where it outputs "Collect More Data" right as the season peaks.
  *   **The Failure Point:** Step 4 (Decay Penalty).
  *   **The Scenario:** If the Committee *misclassifies* the Decay Multiplier as 1.0 (believing flu season is "stable" or "year-round") instead of 0.0 (peaked), the logic gate in Step 7 fails.
  *   **The Math Trap:** If Decay = 1.0, Step 7 looks at Step 3 (Loss). If Admin weights False Positive (Safety) as Tier 1 and Clinicians weight False Negative (Flu Death) as Tier 1, you hit the **Values Call** flag.
  *   **The Real Break:** The procedure assumes the *Cost of Waiting* is linear. In a peak epidemic, the cost of waiting is exponential (infections spread geometrically). The GTTT uses a static Multiplier (1.0, 0.5, 0.0). It cannot capture the **velocity of harm**.
  *   **Handoff to Judgment:** If the Committee votes Decay = 1.0 despite it being peak season, the procedure outputs "Yes — Delay is Rational" (because VOI is High and Loss of Safety is Tier 1).
  *   **Correction:** This is where the **Philosophy of Science** must override the **Decision Theory**. You must intervene at Step 4. The procedure cannot calculate "urgency" dynamically. It requires a human to recognize that *time* is a non-renewable resource in a way the multiplier doesn't capture. If the procedure says "Wait" during a peak, the Chair must veto Step 4.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **Settle Prior Disputes:** If the Clinician says "This works" (Prior 90%) and the Budget Officer says "This is junk" (Prior 10%), the GTTT flags a **Values Call**. It cannot adjudicate truth claims between paradigms. It only tells you that you disagree.
  2.  **Handle Purely Symbolic Harms:** If the "harm" is loss of public trust, dignity, or political capital, the Loss Function (Tiers 1-3) breaks down. You cannot ordinalize dignity. These must be excluded from the math and treated as qualitative veto conditions.
  3.  **Stop Political Weaponization:** If a stakeholder uses "We need more data" as a proxy for "I don't have the votes to block this," Step 6 (Rent-Seeking) attempts to catch it. However, sophisticated weaponization looks like legitimate inquiry. The GTTT cannot detect bad faith if the bad faith is well-camouflaged as rigor.
  4.  **Account for Non-Stationary Environments:** As seen in the Flu Case, the procedure assumes the world stays still while you measure it. In crises, the ground moves. The "Decay Multiplier" is a clumsy fix for a dynamic system.

  ### Final Instruction to the Committee
  "This tool is not a calculator of truth. It is a mirror for our assumptions. If the output feels wrong (e.g., 'Wait' during a crisis), do not trust the output. Trust the **Step 4 Judgment Flag**. The math serves the ethics, not the reverse."
