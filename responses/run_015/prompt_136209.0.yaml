  ### The mapping

  China's planners effectively operated as rigid average utilitarians trying to dodge Parfit's Repugnant Conclusion. They feared a future 'Z' scenario: a massive population subsisting at bare survival levels. Instead, they forced a march toward 'A': a smaller populace enjoying higher per-capita wealth. The policy logic maps neatly onto Critical-Level Utilitarianism, where adding a life is only good if it raises the average welfare above a specific threshold. By capping births, the state modelled a trade-off where reducing $N$ (population) would exponentially increase $W$ (welfare/resources per head). It wasn't just about food; it was about education, housing, and industrial capital per worker. They assumed a definate relationship between fewer people and richer lives. In axiological terms, they treated potential citizens as negative variables in the welfare function, suppressing total utility to maximise the average. It was a cold calculation that the misery of non-existence for millions was preferable to the dilution of resources for the living. This sits uncomfortably close to the repugnant conclusion's inverse: the 'Elite Conclusion', where a tiny, wealthy group is deemed better than a vast, moderately happy one. They treated the nation like a household budget: fewer dependents means more savings per person. This is a direct application of average utilitarianism, prioritising the quality of life of the existent over the quantity of lives created. The gradual relaxation later suggests the state realised the curve wasn't smooth; cutting $N$ too hard crashed the support ratio for the elderly, proving the welfare metric was too narrow.

  ### Where the theory goes silent

  Pure population axiology is blind to the mechanics of implementation. It sees welfare units, not coerced bodies. The theory cannot account for the violence required to hit those numbers: forced sterilisations, late-term abortions, and the 'black children' denied hukou registration. Furthermore, the metric ignored distributional justice. The welfare boost wasn't evenly spread; coastal elites gained alot while rural families faced ruinous fines. Crucially, axiology missed the gendered cost. The preference for sons skewed the sex ratio, creating 30 million 'missing women'. This isn't just a moral failing; it's a calculation error. A society with no partners for its men suffers long-term welfare deficits that the initial model didn't predict. The theory treats people as interchangeable vessels of utility, ignoring that removing specific cohorts changes the social fabric itself. You can't plug 'coercion' into a utility function easily, yet it defines the policy's legacy more than the GDP per capita ever did.

  ### The case's verdict

  Does this vindicate the Repugnant Conclusion? Hardly. The 2013 and 2015 reversals admit the Critical Level was set too high. If the policy was axiologically sound, why the pivot? The Non-Identity Problem offers a shield: the unborn cannot claim they were harmed by never existing. Applied here, the 'never born' cohorts have no standing to complain against the resource-rich only children. But this smuggles in a person-affecting constraint that collapses under scrutiny. It ignores the harm to the *living* only children, now burdened with supporting ageing parents without siblings. The policy didn't avoid a repugnant outcome; it deferred it. We now face a demographic cliff where low $N$ destroys $W$ for the survivors. The episode undermines the idea that we can engineer optimal population sizes without catastrophic unintended consequences. It suggests the Repugnant Conclusion might be less about numbers, and more about our inability to predict the value of future lives. The smooth-continuum problem haunts the defence: if moving from one child to two was okay in 2015, why was it immoral in 1985? The axiology breaks down when reality shifts.
