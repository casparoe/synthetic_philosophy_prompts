answer: |-
  ### Quick Brainstorm: Where the Rubber Meets the Road

  Okay, before we draft the statement, let's map the terrain. We need to avoid the "Williams vs. Parfit" caricature where Internalists are just Humean desire-monsters and Externalists are Platonic mystics. That's unhelpful. Here's the actual overlap and the real fracture points.

  1.  **Shared Ground (The "Action-Guiding" Constraint):** Both sides agree that reasons must be capable of featuring in deliberation. If a consideration is totally inaccessible to the agent's cognitive architecture, it can't function as a reason *for action* (even if it's a reason for praise/blame). We both reject "mysterious" reasons that no one could ever grasp.
  2.  **Shared Ground (The Defectiveness Claim):** In the "Dormant Reason" case (agent knows the facts, no cognitive deficit, but feels nothing), both sides agree the agent is rationally defective. We just disagree on *why*. Is the reason missing (Internalist) or is the agent's responsiveness broken (Externalist)?
  3.  **Shared Ground (Collective Agency):** We agree that groups act and bear responsibility. We both see the "Collective Bootstrapping" problem (where the group needs to do X, but no individual has a motive to start) as a stress test for reason theory.
  4.  **The Real Diverge (Constitution vs. Evidence):** The Internalist thinks motivational accessibility *constitutes* the reason relation. The Externalist thinks motivational accessibility is merely *evidential* of rationality, but the reason exists in the value of the outcome itself.
  5.  **The Collective Diverge (Supervenience):** Internalists must show how collective reasons supervene on individual motivational sets (maybe via identification). Externalists can say collective reasons exist at the group level even if they don't map onto any member's SMS.

  Alright, let's write this up.

  ***

  # Joint Statement on the Architecture of Practical Reasons
  **An Adversarial Collaboration between Committed Internalists and Externalists**

  Look, we've spent enough time talking past each other. We agree that the standard "desire vs. value" fight is tired. We need to know where the machinery actually jams. Below is what we can sign off on together, followed by exactly where we split.

  ### 1. Agreed Claims (The Common Ground)

  1.  **The Deliberative Constraint:** Both camps agree that for a consideration to function as a *practical* reason (as opposed to a theoretical one), it must be capable of being cited by the agent in deliberation. A reason that is原则上 (in principle) inaccessible to the agent's cognitive processing cannot guide action, and we both care about guidance.
  2.  **The Dormant Reason Diagnosis:** In the "Dormant Reason" scenario (where an agent has full conceptual grasp of the facts, zero cognitive deficit, yet remains affectively inert), both sides agree the agent is practically irrational. We disagree on the metaphysics of *why*, but we agree the diagnosis of irrationality stands. The agent is failing to respond to the world correctly.
  3.  **Collective Bootstrapping Limits:** Regarding the "Collective Bootstrapping" problem (where a group holds a reason none of its members can individually access), we agree that action ultimately cashes out in individual movements. A group reason that cannot eventually translate into *some* individual's motivation to move their body is practically inert. However, we agree this doesn't dissolve the group's responsibility.
  4.  **Formal Condition of Attribution:** We agree on a formal condition for reason-attribution: A reason must be *stable under reflection*. If a consideration vanishes as a reason when the agent reflects clearly on it (without new info), it wasn't a robust reason to begin place. Both sides accept this stability test, though we disagree on what ensures the stability (the SMS vs. the Value).
  5.  **No "Brute" Motivation:** We both reject the idea that motivation can pop into existence ex nihilo. Motivation must arise from *something* (either a pre-existing element in the subjective set extended by deliberation, or a recognition of external value). We disagree on what that "something" is, but agree magic is off the table.

  ### 2. Disagreements Table (The Fault Lines)

  | Precise Formulation of View | The Crux | Concrete Case / Argument | Internalist Prediction | Externalist Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **Internalist:** A reason exists for Agent A only if A could reach a motivation to $\phi$ via sound deliberation from their actual Subjective Motivational Set (SMS). | **Constitution vs. Evidence:** Is the link to motivation *what makes* it a reason, or just how we detect it? | **The Dormant Reason Case:** An agent understands "saving the drowning child is good" perfectly but feels zero pull. | **Prediction:** There is no reason *for her* right now. The reason only comes into existence if/when her SMS is modified to include a motive. She isn't violating a reason; she lacks one. | **Prediction:** The reason exists fully. Her lack of motivation is a failure of rational responsiveness. The reason is authoritative *because* it makes her motivated, not vice versa. |
  | **Externalist:** A reason exists for Agent A if there is a value-based fact counting in favor of $\phi$, regardless of A's current SMS. | **Supervenience:** Do collective reasons reduce to individual motivational potentials? | **Collective Bootstrapping:** A committee must vote to fund a project. No individual member cares about the project, but the Committee *as such* has a fiduciary reason to fund it. | **Prediction:** The Committee's reason reduces to the members' potential to identify with the Committee's goals. If no member *can* be motivated to identify, the reason dissolves. | **Prediction:** The Committee's reason is irreducible. It exists at the group level even if no individual member can currently access a motivational path to it. The reason binds them regardless. |
  | **Internalist:** "Ought implies Can" means "Ought implies Can be Motivated." | **The Scope of Rationality:** Is rationality about internal coherence or external alignment? | **The Burnout Case:** An agent values justice but is psychologically crushed (depressed) and cannot motivate themselves to act justly, though they know they should. | **Prediction:** If the depression blocks the deliberative route from their SMS, the "ought" loses its grip. You can't have a reason you literally cannot access motivationally. | **Prediction:** The "ought" remains. The depression is a barrier to *performance*, not to the *existence* of the reason. The reason stands authoritative even if she can't muster the move. |
  | **Externalist:** "Ought implies Can" means "Ought implies Can Physically/Cognitively Perform." | **Authority Source:** Where does the normativity come from? | **The Ennui Expert:** A moral expert who knows all the values but finds them boring. | **Prediction:** If the expert's SMS doesn't support caring about values, their expertise doesn't generate reasons *for them*. They are a broken instrument. | **Prediction:** Their boredom is irrelevant. The values generate reasons regardless of their affective state. They are blameworthy for the boredom itself. |

  ***

  **Final Note from Both Camps:**
  We're not solving this today. But notice where we're stuck. It's not about whether reasons exist. It's about whether the *agent's psychology* is the container for the reason, or just the receiver. In the Dormant Case, the Internalist says the container is empty. The Externalist says the signal is broadcasting, but the receiver is off. In the Collective Case, the Internalist wants to trace the signal back to individual receivers. The Externalist says the group has its own antenna.

  We agree the action needs to happen. We just disagree on what counts as the "green light."
