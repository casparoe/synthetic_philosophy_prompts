      *   *The "End":* Genocide vs. Profit/Speed. The moral weight is incomparable, which affects the "banality" assessment.
      *   *Ideology:* This is crucial. Recent scholarship (Stangneth) challenges Arendt's view that Eichmann wasn't antisemitic. He *was* an ideologue. The Amazon analogy assumes neutrality; Eichmann wasn't neutral.

