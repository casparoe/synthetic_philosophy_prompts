answer: |-
  **Project Title:** Recursive Sovereignty: *Potentia* and Institution in Spinoza's Unfinished Democracy

  **Research Question**
  Does Spinoza's ontological identification of right (*jus*) with power (*potentia*) necessitate a model of "recursive authorization" to reconcile the existence of representative councils with the claim that democracy is the most absolute form of *imperium*? Specifically, can a delegated body hold democratic authority within Spinoza's framework only if its institutional form functions to continuously re-manifest the *potentia multitudinis* rather than to alienate or transfer it?

  This question admits a determinate answer: either the ontology of the *Ethics* and *Tractatus Theologico-Politicus* logically precludes delegation without alienation (collapsing democracy into direct assembly), or it permits a specific institutional topology where representation is non-alienating (validating the recursive model). The project aims to demonstrate the latter, establishing a specific criterion for what constitutes a legitimate democratic institution in Spinoza's system.

  **Rationale and Intervention**
  Standard interpretations of the *Tractatus Politicus* (TP) currently oscillate between two poles. The "direct-democracy" reading argues that for Spinoza, true sovereignty requires the continuous physical assembly of the multitude, rendering any council merely administrative and devoid of sovereign right. Conversely, the "early republican" reading accepts delegated councils as sovereign but interprets them through a proto-liberal lens of representation, where the multitude authorizes a body to act in its name, effectively transferring the exercise of right.

  Both readings leave the specific question of democratic *absolutism* open. Spinoza defines democracy as the "most absolute" (*omnino absolutum*) form of state because it most closely aligns the right of the state with the power of nature. If the direct-democracy reading is correct, the *TP*'s detailed discussion of councils in Chapter 11 becomes incoherent or purely provisional. If the republican reading is correct, Spinoza risks contradicting his core ontological thesis that power cannot be truly transferred, only coordinated. If sovereignty is delegated, the *imperium* is no longer absolute but conditional, dependent on a contract of alienation that Spinoza explicitly rejects in his metaphysics of *conatus*.

  The gap in the literature is the failure to account for how an institution might mediate the multitude without standing *outside* or *above* it. Existing frameworks assume a binary: power is either present (direct) or transferred (representative). This project proposes a third category: recursive presence. Here, the council does not hold power *instead* of the multitude, but functions as an organ through which the multitude's power is actively expressed and amplified. The question is precise because it tests the internal consistency of Spinoza's system: if *jus* = *potentia*, and *potentia* cannot be alienated, then any stable democratic institution must be structurally designed to prevent the atrophy of the multitude's active power.

  **Methodology**
  The project employs a method of close conceptual reconstruction paired with immanent textual analysis. It will not rely on historical-contextual reconstruction of the Dutch Republic, nor will it engage in anachronistic comparisons with modern deliberative or liberal democratic theory.

  1.  **Conceptual Reconstruction:** The first phase involves rigorously defining *potentia*, *multitudo*, and *imperium* based on the *Ethics* and *Tractatus Theologico-Politicus*. The focus is on the ontological status of collective power. Key to this is analyzing Spinoza's distinction between *potestas* (institutional capacity) and *potentia* (ontological power) to determine if the former can exist without subsuming the latter.
  2.  **Textual Analysis of TP Chapter 11:** The second phase applies these definitions to the unfinished democratic chapters of the *TP*. The analysis will focus on the specific mechanisms Spinoza proposes for councils (selection by lot, rotation, size) not as pragmatic compromises, but as ontological necessities designed to keep the *potentia* of the constituents present within the decision-making body.
  3.  **Logical Stress-Testing:** The third phase tests the "recursive authorization" hypothesis against Spinoza's critiques of aristocracy and monarchy. If the recursive model holds, it must explain why democracy is *more* absolute than aristocracy, not just in degree but in kind, based on the flow of power rather than the number of participants.

  This approach is preferable to historical contextualization because the problem is systematic, not biographical; Spinoza's silence on the completion of the *TP* is less relevant than the logical constraints of his metaphysics. It is preferable to modern comparative theory because importing contemporary notions of "representation" imports the very logic of alienation (the principal-agent problem) that Spinoza's ontology seeks to bypass. The goal is to understand Spinoza's democracy on its own ontological terms.

  **Expected Outcomes**
  **Success:** A successful result yields a principled institutional criterion that saves Spinoza's text from internal contradiction. This criterion would define a "Spinozist Institution" as one that structurally necessitates the active engagement of the multitude to function, thereby making delegation impossible without continuous re-authorization. This resolves the tension between the *TP*'s institutional details and the *Ethics*' ontology of power. It allows for a reading where councils are sovereign *only insofar as* they are transparent conduits of the multitude's *conatus*, distinguishing Spinoza's "recursive authorization" from both direct assembly and liberal representation.

  **Failure:** Failure takes two forms. First, the recursive distinction may collapse into pure direct democracy, proving that Spinoza's ontological commitments make any form of delegation a diminution of right, rendering the *TP*'s institutional proposals incoherent. Second, the distinction may collapse into an anachronistic representative model, where the "recursion" is shown to be merely rhetorical, masking a standard transfer of sovereignty. If the conceptual reconstruction cannot distinguish "manifesting power" from "exercising transferred power" without relying on liberal assumptions, the hypothesis fails.

  **Feasibility and Timeline**
  This project is highly realistic for a one-year fellowship. It relies on conceptual reconstruction and textual analysis of a defined corpus (*Ethics*, *TTP*, *TP*), rather than archival discovery or extensive fieldwork. The primary texts are available in multiple critical editions and translations.

  *   **Months 1–3:** Conceptual reconstruction of *potentia* and *multitudo* across the corpus.
  *   **Months 4–6:** Detailed exegesis of *TP* Chapter 11 and fragments, coding institutional mechanisms against the reconstructed ontology.
  *   **Months 7–9:** Synthesis and stress-testing the "recursive authorization" model against counter-arguments (e.g., the problem of faction, the role of the military).
  *   **Months 10–12:** Drafting the final monograph article or chapter and preparing related conference presentations.

  The scope is narrow enough to be completed within twelve months but significant enough to intervene in current debates regarding Spinoza's political legacy. By isolating the specific mechanism of authorization, the project avoids the trap of general "Spinozist politics" and delivers a specific, testable contribution to the history of political thought.
