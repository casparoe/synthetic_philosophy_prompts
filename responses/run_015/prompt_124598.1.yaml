  You asked for the exposure of the view. Here is the breakdown of defeaters, ranked from Fatal to Awkward, split by Outsider vs. Internal, followed by your specific cases and the insulation question.

  ### Part 1: The Critiques

  #### Outsider Critiques (CDT/EDT Flavored)
  *Status: Dismissible if you already accept the premises.*

  1.  **The Causal Objection:** "You cannot causally influence a copy."
      *   *Verdict:* Irrelevant to you. The theory explicitly rejects the premise that only causal influence matters. It posits *logical* influence.
  2.  **The Evidential Objection:** "You're just conditioning on a correlation that exists regardless of your choice."
      *   *Verdict:* Irrelevant to you. The theory argues that your choice *determines* the correlation's value in the counterfactual, not just conditions on it.
  3.  **The Magic Objection:** "This is wishful thinking / voting magic."
      *   *Verdict:* Rhetorical. Doesn't engage the math.

  #### Internal Critiques (Granting the Framework)
  *These are the ones that matter. I have ranked them by severity.*

  **1. The Exploitation / Blackmail Problem (Fatal)**
  *   **The Argument:** There are decision problems where an FDT/TDT agent is systematically exploited by a predictor specifically *because* they use FDT.
  *   **The Case:** Consider "Blackmail." A predictor knows your source code. If they predict you will pay blackmail, they send the blackmail letter. If they predict you won't, they don't send it. A CDT agent (who treats the past prediction as fixed) refuses to pay. An FDT agent (who treats their decision as determining the prediction) pays, because "If I don't pay, the prediction would have been 'won't pay', so the letter wouldn't have been sent... wait."
  *   **The Catch:** Actually, FDT usually *refuses* blackmail (that's a feature). But there are variants (like "Terminator" or specific Newcomb variants) where the predictor punishes the *algorithm type* rather than the action. If a predictor says, "I will punish anyone running FDT," the FDT agent is in a bind. To avoid punishment, they must not run FDT. But if they run CDT to avoid punishment, they get punished for running CDT if the predictor targets that.
  *   **Why it's Fatal:** Rationality is supposed to be about winning. If adopting a decision theory makes you a target for exploitation that a simpler theory avoids, the normative force crumbles. It suggests the theory is not "universally rational" but ecologically dependent.
  *   **Does it land?** Yes. It shows the theory isn't dominant. It wins in PDs but loses in specific adversarial environments.

  **2. The Similarity / Continuity Problem (Fatal to Distinctiveness)**
  *   **The Argument:** The theory relies on "subjunctive dependence" (logical correlation). But logical correlation is not binary; it's graded.
  *   **The Mechanism:** If I am 99% similar to you, my decision logically correlates with yours with probability ~0.99 (roughly). If I am 50% similar, correlation is ~0.5.
  *   **The Collapse:** If the correlation is graded, the expected utility calculation becomes: $EU(C) = P(\text{corr}) \cdot \text{Payoff}(\text{Both C}) + (1-P(\text{corr})) \cdot \text{Payoff}(\text{Mixed})$.
  *   **The Critique:** This is mathematically isomorphic to Evidential Decision Theory (EDT) with a specific prior on the correlation. If the view admits graded similarity, it loses its unique "one computation" bite and becomes "EDT with a high prior on logical correlation."
  *   **Why it's Fatal:** It dissolves the hard line between "magic cooperation" and "standard reasoning." It implies there is no *qualitative* shift at "copy" status, just a quantitative one. If it's just quantitative, why did we need a new decision theory?
  *   **Does it land?** Yes. It forces the proponent to admit that in the real world (where exact copies don't exist), the theory is just EDT with optimistic priors.

  **3. The Anti-Coordination / Symmetry Breaking Problem (Severe)**
  *   **The Argument:** You identified this correctly. If two agents run the *exact same deterministic computation* on the *same inputs*, they output the *same action*.
  *   **The Case:** You need to pick different meeting spots to survive. Same algorithm -> Same spot -> Death.
  *   **The Proposed Fix:** "Use indexical information" (e.g., "I am Agent 1, you are Agent 2").
  *   **The Critique:** Where does the indexical info come from? If it's physical (I see a '1' on my chest), it's causal. If it's logical (I am the instance running at time $t_1$), does the other instance know that? If we share the same source code, we both know we are running the same code. To output differently, the code must include a randomness source. If we share the randomness seed (because we are copies), we output the same random number.
  *   **Why it's Severe:** To solve this, the theory must assume agents have access to *private* randomness or *uncorrelated* indexical facts. But if they have uncorrelated facts, they aren't running the "same computation" in the relevant sense. The theory requires a hidden empirical assumption: that agents can access logical noise that isn't shared.
  *   **Does it land?** It lands as a "bug." It shows the slogan "one computation" is too simple. It needs to be "one policy over a distribution of indexical states."

  **4. The Computability / Logical Uncertainty Problem (Awkward)**
  *   **The Argument:** To know if another agent is running the "same computation," you need to solve the halting problem or prove code equivalence. This is uncomputable.
  *   **The Critique:** You can never actually *know* you are in the scenario where the theory applies. You only have a belief distribution over whether the other agent is similar.
  *   **Why it's Awkward:** It makes the theory practically inert. You always fall back to "I believe there is an X% chance they are similar." Which returns us to the Similarity Problem (it becomes EDT).
  *   **Does it land?** It limits the theory to idealized math, not real-world implementation.

  ---

  ### Part 2: Running Your Cases

  **1. The Similarity Cliff**
  *   **Verdict:** The view collapses into EDT.
  *   **Analysis:** There is no threshold. The prescription is continuous. If similarity is 97%, you cooperate with probability proportional to the expected gain from the correlation. If similarity is 4%, you defect (because the correlation weight is too low to overcome the defection incentive).
  *   **Is it a bug?** Proponents say it's a feature (reality is continuous). Critics say it removes the *normative punch*. If it's continuous, then your real-life cooperation wasn't "acausal magic," it was just "I bet he's like me."
  *   **Extra Content:** The extra content is the *justification* for the prior. Standard EDT says "I don't know if we correlate." FDT says "You *should* assign high probability to correlation because we share algorithmic structure." It's a prior-selection rule, not a new utility calculus.

  **2. Slightly Unequal Twins**
  *   **Verdict:** The view struggles, often requiring a retreat to "policy selection."
  *   **Analysis:** If payoffs differ, the input to the computation differs. $Algorithm(Payoff_A)$ vs $Algorithm(Payoff_B)$. If the algorithm is "Maximize EU," the outputs may diverge. If outputs diverge, the logical link breaks.
  *   **Principled Answer:** FDT says you choose a *policy* (a mapping from inputs to outputs). You cooperate if the *policy* "Cooperate if Copy" yields higher utility across the multiverse of instantiations.
  *   **The Glitch:** If the asymmetry is large enough, the optimal policy becomes "Cooperate if Payoff > X, Defect if Payoff < X." If you and your twin fall on different sides of X, you defect against each other. Symmetry *was* doing the work. Without it, the theory often prescribes defection.

  **3. The Anti-Coordination Case**
  *   **Verdict:** This is the hardest internal hit.
  *   **Analysis:** As noted above, same computation = same output. To differ, you need indexical uncertainty ("Am I Left-Instance or Right-Instance?").
  *   **Hidden Assumption:** Yes, it requires access to uncorrelated indexical facts. If you are truly exact copies in a white room, you *cannot* solve anti-coordination. You will crash.
  *   **Is it Hand-Waving?** It's not hand-waving if you grant "logical uncertainty about indexicals." But it does mean the "one computation" slogan is misleading. It's "one policy over indexical states."
  *   **Answer:** The view says you play a mixed strategy *if* you have indexical uncertainty. If you have none, you lose. This is a genuine limitation.

  **4. The Population Case**
  *   **Verdict:** Collapses into EDT + Anthropics.
  *   **Analysis:** If you don't know if you're facing a copy or a stranger, you assign a probability $P(\text{copy})$. Your EU calculation weights the copy payoff by $P$.
  *   **Extra Content:** Again, the only extra content is the normative claim that $P(\text{copy})$ should be derived from algorithmic similarity, not just empirical frequency. It tells you *how to form the prior*, not how to calculate the EU.
  *   **Self-Locating Uncertainty:** Yes, it degrades into this. "Am I the agent in the high-similarity cluster or the low-similarity cluster?"

