      *   *Correction on Similarity:* The standard FDT response is "subjunctive dependence is graded." If so, the expected utility calculation just weights the other's payoff by the probability of logical correlation. This *does* look like EDT with a specific prior. Is that a bug? Proponents say no, it's just accurate. Critics say it removes the "magic" that justified the one-shot PD cooperation in the first place. I need to highlight that if similarity is low, the theory *stops prescribing cooperation*.
