  *   **Verdict:** The view collapses into EDT.
  *   **Analysis:** There is no threshold. The prescription is continuous. If similarity is 97%, you cooperate with probability proportional to the expected gain from the correlation. If similarity is 4%, you defect (because the correlation weight is too low to overcome the defection incentive).
  *   **Is it a bug?** Proponents say it's a feature (reality is continuous). Critics say it removes the *normative punch*. If it's continuous, then your real-life cooperation wasn't "acausal magic," it was just "I bet he's like me."
  *   **Extra Content:** The extra content is the *justification* for the prior. Standard EDT says "I don't know if we correlate." FDT says "You *should* assign high probability to correlation because we share algorithmic structure." It's a prior-selection rule, not a new utility calculus.

  **2. Slightly Unequal Twins**
  *   **Verdict:** The view struggles, often requiring a retreat to "policy selection."
  *   **Analysis:** If payoffs differ, the input to the computation differs. $Algorithm(Payoff_A)$ vs $Algorithm(Payoff_B)$. If the algorithm is "Maximize EU," the outputs may diverge. If outputs diverge, the logical link breaks.
  *   **Principled Answer:** FDT says you choose a *policy* (a mapping from inputs to outputs). You cooperate if the *policy* "Cooperate if Copy" yields higher utility across the multiverse of instantiations.
  *   **The Glitch:** If the asymmetry is large enough, the optimal policy becomes "Cooperate if Payoff > X, Defect if Payoff < X." If you and your twin fall on different sides of X, you defect against each other. Symmetry *was* doing the work. Without it, the theory often prescribes defection.

  **3. The Anti-Coordination Case**
  *   **Verdict:** This is the hardest internal hit.
  *   **Analysis:** As noted above, same computation = same output. To differ, you need indexical uncertainty ("Am I Left-Instance or Right-Instance?").
  *   **Hidden Assumption:** Yes, it requires access to uncorrelated indexical facts. If you are truly exact copies in a white room, you *cannot* solve anti-coordination. You will crash.
  *   **Is it Hand-Waving?** It's not hand-waving if you grant "logical uncertainty about indexicals." But it does mean the "one computation" slogan is misleading. It's "one policy over indexical states."
  *   **Answer:** The view says you play a mixed strategy *if* you have indexical uncertainty. If you have none, you lose. This is a genuine limitation.

  **4. The Population Case**
  *   **Verdict:** Collapses into EDT + Anthropics.
  *   **Analysis:** If you don't know if you're facing a copy or a stranger, you assign a probability $P(\text{copy})$. Your EU calculation weights the copy payoff by $P$.
  *   **Extra Content:** Again, the only extra content is the normative claim that $P(\text{copy})$ should be derived from algorithmic similarity, not just empirical frequency. It tells you *how to form the prior*, not how to calculate the EU.
  *   **Self-Locating Uncertainty:** Yes, it degrades into this. "Am I the agent in the high-similarity cluster or the low-similarity cluster?"

  **5. Empirical Check (Real World)**
  *   **Verdict:** You are right; it's hard to test, but not special pleading.
  *   **Analysis:** Real world similarity is low (<10%). The theory predicts defection (or very weak cooperation) in most real-world cases.
  *   **Uselessness:** This makes the theory hard to falsify empirically. If you cooperate and lose, the theorist says "Similarity wasn't high enough." If you defect and lose, they say "Similarity was high enough, you should have cooperated."
  *   **Honest Read:** It is borderline special pleading. The theory is most interesting at high similarity, but high similarity doesn't exist outside labs. So the theory is interesting primarily in a domain that doesn't exist.

  ---

  ### Part 3: Insulation and Normativity

  **Is the view qualified into vacuity?**
  *   **Honest Read:** Yes, somewhat.
  *   **The Mechanism:** The escape hatch is always "The computations weren't sufficiently subjunctively dependent." Because logical dependence is uncomputable and graded, any failure of cooperation can be blamed on insufficient similarity.
  *   **Does it matter?** It matters for *predictive* power (the theory predicts nothing specific about the real world), but less for *normative* power. The claim is "If you *were* in a high-similarity case, this is what you should do."
  *   **The Risk:** If the only cases where the theory applies are cases that don't exist, the normative claim is vacuous for human beings.

  **What is the Normative Analogue of a Defeater?**
  *   You asked for a case where the view tells you to do something you'd reject on reflection.
  *   **The Defeater:** The **Blackmail/Exploitation** case.
  *   **Why:** If you grant the premises (logical correlation matters), but the theory tells you to pay a blackmailer (or take an action that makes you a target for punishment) while a CDT agent walks away safe, you have a conflict between "Rationality as Consistency" and "Rationality as Winning."
  *   **Reflection:** Most people, upon reflection, prefer winning. If FDT requires you to lose money to maintain "logical consistency," many will reject the consistency requirement.

  ### Part 4: The Strongest Internal Critique

  **The Critique:** **The Similarity Collapse.**
  **Does it land?** **Yes.**

  **Why:** This is the strongest critique because it doesn't just find a edge case; it dissolves the core distinction.
  The "rationalist line" relies on the intuition that there is a *special* moral/rational category for "copies." It feels different to cooperate with a copy than with a stranger.
  The Internal Critique shows that mathematically, there is no special category. There is only a sliding scale of correlation probability.
  Once you admit the scale, the "One Computation" slogan is revealed as a metaphor for "High Correlation Prior."
  If it's just a prior, then your real-life cooperation wasn't a triumph of new decision theory; it was just standard reasoning with a specific belief about human similarity.
  This strips the view of its revolutionary status. It becomes a claim about *sociology* (humans are similar) rather than *decision theory* (logic dictates cooperation).

  **Final Verdict:**
  The view is **basically fine as a normative ideal for exact copies**, but it is **over-sold as a practical guide for humans**.
  *   **Fatal Defeaters:** Exploitation (in specific environments), Similarity Collapse (dissolves the theory into EDT).
  *   **Awkward Defeaters:** Anti-coordination (requires indexical assumptions), Computability (can't be implemented).
  *   **Insulation:** Yes, it is insulated by the uncomputability of logical similarity, making it empirically toothless.

  If you want to keep the view, you must downgrade it from "The True Decision Theory" to "A useful heuristic for high-similarity interactions that justifies a high prior on correlation." If you try to keep it as a rigid logical law, the Similarity Cliff will break it.
