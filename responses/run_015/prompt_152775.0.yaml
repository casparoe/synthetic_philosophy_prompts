answer: |-
  **Seminar Plan: The Peer Review Paradox (75 mins)**
  **Class Size:** 10 grad students
  **Goal:** Feel the discursive dilemma in your bones before we talk about List, Pettit, or formal logic.

  **Prep Work (Do this before class)**
  Print 10 small slips of paper. These are "Private Expert Assessments." Do not let them trade these.
  *   **3 slips (Type Alpha):** Method Sound? **YES**. Misuse Risk High? **YES**. -> Therefore Safeguards? **YES**.
  *   **3 slips (Type Beta):** Method Sound? **YES**. Misuse Risk High? **NO**. -> Therefore Safeguards? **NO**.
  *   **4 slips (Type Gamma):** Method Sound? **NO**. Misuse Risk High? **YES**. -> Therefore Safeguards? **NO**.

  *Note:* The logic on the slip must be explicit so they don't vote inconsistently. Tell them: "You are an expert reviewer. You must be logically consistent. If you say Yes to A and Yes to B, you must say Yes to C."

  **The Scenario (5 mins)**
  Tell them: "You are the Ethics Board for a new AI grant. You have to issue one public verdict. There are three connected claims:
  (A) The technical method is sound.
  (B) The misuse risk is high.
  (C) Therefore, approval requires strict safeguards.

  Logic rule: We only require safeguards (C) if the method is sound (A) AND the risk is high (B). If either A or B is false, no safeguards needed (study rejected or modified)."

  **Round 1: Premise-Based Procedure (20 mins)**
  1.  **Private Vote:** Hand out the slips. Tell them this is their internal logic. They cannot change it.
  2.  **Public Tally:** Ask for a show of hands on A. Record it. Ask for show of hands on B. Record it.
      *   *Expected Result:* Majority Yes on A (6-4). Majority Yes on B (7-3).
  3.  **Derive C:** Remind them of the logic rule. Since A is Yes and B is Yes, the Board's collective verdict on C *must* be **YES**.
  4.  **Chair Role:** Pick one student to be the **Chair**. Their job is to draft the 2-sentence public justification based *only* on the majority premises.
      *   *Draft:* "The board finds the method sound and the risk high. Therefore, safeguards are mandated."
  5.  **Check:** Ask the room: "How many of you personally disagree with this conclusion?" (The 7 people with Type Beta/Gamma slips will raise hands).
  6.  **Dissenter Role:** Pick one student who voted No on C (but was in the majority on either A or B) to be the **Dissenter**. They have 1 minute to explain why the Board's reasoning feels wrong to them personally.

  **Round 2: Conclusion-Based Procedure (20 mins)**
  1.  **Reset:** Tell them: "Okay, that felt weird. Half the board is unhappy with the outcome. Let's try democracy directly on the bottom line."
  2.  **Direct Vote:** Vote directly on C (Safeguards needed?).
      *   *Expected Result:* Majority No (7-3). (Only Type Alpha votes Yes).
  3.  **Backtracking Rule:** Here's the kicker. If the Board says No to C, you cannot logically maintain Yes on both A and B. You must reject at least one premise to make the public record consistent.
  4.  **Negotiation:** Ask the Chair to rewrite the justification. They have to choose: Do we reject A (Method unsound) or reject B (Risk low)?
      *   *Conflict:* The people who voted Yes on A (Alpha + Beta) will fight to keep A. The people who voted Yes on B (Alpha + Gamma) will fight to keep B.
      *   The Chair is stuck. Whatever they write will contradict the majority view on one of the premises.
  5.  **Dissenter Speaks:** The Dissenter (can be same or new) now defends the premise that just got sacrificed to save consistency.

  **Debrief & Theory Map (25 mins)**
  *Don't start with definitions. Start with their frustration.*

  **1. What just happened? (The Mechanism)**
  You just ran into the **Discursive Dilemma** (sometimes called the Doctrinal Paradox).
  *   **Round 1** was *Premise-Based Aggregation*. You voted on reasons, let logic dictate the outcome. Result: Collective consistency, but individual dissatisfaction (many voted No on outcome).
  *   **Round 2** was *Conclusion-Based Aggregation*. You voted on the outcome, forced reasons to fit. Result: Individual satisfaction (majority got their verdict), but collective inconsistency (you had to lie about why).

  **2. Where did anonymity break?**
  In a normal vote, every voter is equal. Here, the *structure* of the vote gave power to different coalitions.
  *   In Round 1, the coalition that cared about Risk (B) won the outcome.
  *   In Round 2, the coalition that wanted to Reject (C) won the outcome.
  *   The "Group Mind" flipped its personality not because people changed thier minds, but because you changed the questionnaire. That's the scary part. The group isn't just a sum of parts; the aggregation rule *creates* the will.

  **3. Limitations (What the game hides)**
  Be frank here. This game is static. Real boards talk.
  *   **Deliberation:** In real life, the Type Beta and Type Gamma people would realize they agree on the outcome (No Safeguards) and might form a coalition to vote strategically on premises. The game blocks this to show the structural flaw, but real agents adapt.
  *   **Power:** The Chair had too much power in Round 2 to choose which premise to drop. In real institutions, there are rules of order, veto powers, etc.
  *   **Intensity:** A binary vote doesn't capture how much someone cares. Maybe the one person who cares deeply about Risk should outweigh the others. This game assumes all votes weigh the same.

  **4. Settled vs. Contested (The Lecture Part)**
  Draw a line on the board.

  **Left Side: What is Settled (The Math)**
  *   It is formally impossible to design a voting system that satisfies all these conditions at once:
      1.  **Consistency:** The group's views are logically connected (A&B->C).
      2.  **Anonymity:** Every voter counts equally.
      3.  **Systematicity:** You treat premises and conclusions using the same voting rule (majority).
      4.  **Non-dictatorship:** No single person decides.
  *   This isn't up for debate. It's an impossibility theorem (like Arrow's). If you want consistency, you must sacrifice something else (like direct democracy on the conclusion).

  **Right Side: What is Contested (The Philosophy)**
  *   **Normative Question:** Which procedure is *better*?
      *   *Team Premise:* Some argue Premise-Based is better for truth-seeking. If we want the right reasons, we should vote on facts, not outcomes.
      *   *Team Conclusion:* Others argue Conclusion-Based is more democratic. People care about the outcome, not the technical premises. Why should a majority be overruled by logic?
  *   **Metaphysical Question:** Are collective minds real?
      *   Does the Board have a "belief" distinct from the members?
      *   If the Board says "A is True" but 4/10 members say "A is False", who is lying?
      *   Some say group agency is just a metaphor. Others (like functionalists) say if the group acts like an agent, it *is* an agent, even if it's irrational in ways humans aren't.

  **Wrap Up (5 mins)**
  Ask them: "If you were the Chair, which round would you publish? Why?"
  Let them sit with the fact that there is no clean answer. That's the field we work in.

  *(Quick note for you: watch out for typos in the handout, I left a couple so it looks like a draft, dont worry about it.)*
