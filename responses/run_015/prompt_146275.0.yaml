      *   *Confidence:* I am very confident that contemporary metaphysics is largely dispositional realist. I am very confident SCA is rejected. I am moderately confident that the "same problem" claim is rejected by specialists, though a logician might see the formal similarity. I will mark the *Ceteris Paribus* verdict as slightly less certain because it's a matter of debate whether a *specific* CP clause works vs. a *vague* one.

