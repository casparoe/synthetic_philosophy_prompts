answer: |-
  This is a sharp observation. You have correctly identified a structural pattern that appears in ethology, control theory, computer science, and philosophy of action. Because you come from backend engineering, you are seeing the architecture where others see "behavior" or "will."

  Here is the breakdown of the names, the debate, and the boundaries.

  ### 1. Does this configuration have a name?

  You are right that **Fixed Action Pattern (FAP)** is the word for the wasp's rigid routine, but that only names the *block*, not the *architecture*.

  There is no single, universal noun that captures the *duality* (flexible seams, rigid blocks) across all fields, but there are precise technical terms in three relevant domains. If you want to talk to experts, use these:

  *   **In Ethology (The Wasp):** The system is a **Modal Action Pattern** governed by a **Releasing Mechanism**. The "seam" is the *Releasing Mechanism* (which checks the context), and the "block" is the *Fixed Action Pattern* (which runs to completion).
  *   **In Control Theory & Robotics:** This is a **Sampled-Data Control System** with a **Zero-Order Hold**.
      *   *Translation:* The system "samples" the world at discrete intervals (the seams). Between samples, it "holds" the output constant (the rigid block), regardless of changes in the input.
      *   *Why this fits:* It captures exactly your "job runner" description. The controller reads state, commits to a command, and ignores new data until the command cycle finishes.
  *   **In AI & Reinforcement Learning:** This is the **Options Framework** (or **Temporal Abstraction**).
      *   *Translation:* An "Option" is a policy that runs for multiple time steps. The "seam" is the *termination condition* of an option, where the agent re-evaluates which option to pick next.

  **The Coinage:**
  Since there is no single catchy English noun for the *whole shape*, and you asked for one if none existed: I propose calling this **Granular Agency**.
  *   **Definition:** A control architecture where decision-making authority is concentrated at discrete temporal boundaries (seams), separated by non-preemptible execution blocks (grains).
  *   **Why:** It captures the "grain" of the wood (the rigid texture) and the "agency" (the flexible selection).

  ### 2. The Free Will Disagreement

  You and your friend are reenacting a specific, well-mapped debate in the philosophy of action. You have both stumbled onto the central tension of **Compatibilism**.

  **Your Friend's Position: Hierarchical Compatibilism**
  Your friend is arguing for a model famously developed by philosopher **Harry Frankfurt** (specifically his 1971 paper *Freedom of the Will and the Concept of a Person*).
  *   **The Model:** Frankfurt argues that freedom isn't about being uncaused; it's about *alignment*.
  *   **First-Order Desires:** The routines (e.g., "I want to eat the cake").
  *   **Second-Order Volitions:** The seam (e.g., "I want to *want* to diet").
  *   **The Claim:** You are free if your Second-Order Volition (the seam) successfully selects your First-Order Desire (the block). The fact that the seam is determined by your brain chemistry doesn't matter; the *structure* of having that reflective seam is what constitutes freedom.
  *   **Verdict:** Your friend is a **Frankfurtian Compatibilist**.

  **Your Position: The Regress Argument (Incompatibilism)**
  Your objection ("whatever does the selecting... is itself either running a routine or it isn't") is known as **The Regress Argument**, most famously formalized by philosopher **Galen Strawson** (The Basic Argument, 1994).
  *   **The Argument:** To be truly free, you must be the cause of your choices (*causa sui*). But to choose your "seam" mechanism, you would need a prior "meta-seam" to choose it. This leads to an infinite regress.
  *   **The Claim:** If the selection at the seam is determined by prior states (genetics, environment, previous code), then the "flexibility" is an illusion. It's just a more complex machine.
  *   **Verdict:** You are an **Incompatibilist** (specifically leaning toward **Hard Determinism**).

  **What would settle it?**
  Philosophically? Nothing. This is the "Hard Problem" of agency.
  *   **To satisfy you:** The system would need **Libertarian Free Will**, which requires the seam to be *uncaused* (truly random or supernatural). Most scientists and philosophers reject this because "random" isn't "free" either.
  *   **To satisfy your friend:** You must accept that "freedom" is a functional definition (can I veto my impulses?), not a metaphysical one (am I the prime mover of the universe?).

  ### 3. Boundary Cases

  To define **Granular Agency** (or Sampled-Data Control) precisely, we need to know what breaks the pattern. The definition requires three components:
  1.  **Context Sensitivity:** The seam reads the world.
  2.  **Non-Preemptibility:** The block ignores the world.
  3.  **Iterative Feedback:** The cycle repeats.

  Here is how your boundary cases map:

  **(a) One seam, deterministic after (Pocket Calculator)**
  *   **Verdict:** **Not the same.**
  *   **Why:** This is **Open-Loop Control**. It lacks *Iterative Feedback*. It has a seam (input), but no return to the seam based on the result. It is a single grain, not a chain. It cannot correct course.

  **(b) Seams arrive at random times**
  *   **Verdict:** **Not the same.**
  *   **Why:** This fails *Context Sensitivity*. In your definition, the seam opens "when the situation calls for one" (or when the block finishes). If seams open randomly (like a hardware interrupt timer unrelated to task completion), the system isn't *deliberating* at the seam; it's being interrupted. This is **Stochastic Interrupt-Driven Control**, not Granular Agency.

  **(c) Interruptible by anything, one fixed response**
  *   **Verdict:** **Not the same.**
  *   **Why:** This fails *Flexible Selection*. The "block" is preemptible (not rigid), but the "seam" has no choice (not flexible). This is a **Hard Real-Time Interrupt Handler**. It is rigid everywhere, just with smaller rigid blocks.

  **(d) Seams are real, blocks are a millisecond long**
  *   **Verdict:** **The same phenomenon (Limit Case).**
  *   **Why:** This is the **Granularity** question. If the blocks are 1ms, it looks like continuous flow (analog), but structurally it is still digital sampling.
  *   **Principled Difference:** None, structurally. However, functionally, if the block duration is shorter than the system's ability to effect change in the world, it approximates **Continuous Control**.
  *   *Example:* A human finishing a sentence (your example) is Granular Agency. A human balancing a stick on their finger is Continuous Control (micro-adjustments happen faster than conscious "seams"). The distinction is whether the block duration is *long enough to constitute a committed action*.

  ### Summary for your next argument

  *   **The Shape:** Call it **Granular Agency** (or **Sampled-Data Control** if talking to engineers).
  *   **The Blocks:** **Fixed Action Patterns** or **Motor Programs**.
  *   **The Seams:** **Releasing Mechanisms** or **Second-Order Volitions**.
  *   **The Debate:** Your friend is **Harry Frankfurt** (Freedom is hierarchical alignment). You are **Galen Strawson** (Freedom requires an impossible infinite regress of self-creation).
  *   **The Verdict:** You are both describing the same machine. She is defining "freedom" as the *presence of the seams*. You are defining "freedom" as the *origin of the seams*. Neither can be proven right without agreeing on the definition of "free."

  Your observation is not clumsy; it is the standard model of cognitive architecture in modern cognitive science. You just described the **Hierarchical Control of Action** without the jargon.
