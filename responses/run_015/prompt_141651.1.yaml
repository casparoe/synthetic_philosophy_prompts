prompt: |-
  Hi — I sit on our university's animal ethics committee and we've just got our first serious invertebrate application and nobody wants to wing it. A marine bio lab wants to put about 240 shore crabs through a shock-avoidance task: brief electric shocks in a shuttle box, plus a condition where they dose the animals with an analgesic first to see whether that changes how quickly they learn to avoid the shock. Our rules only cover vertebrates; invertebrates fall under a vague clause saying we should give them due consideration, and nothing more, and we know an octopus proposal and a crayfish teaching lab are coming next term, so we'd like a rule we can reuse rather than re-litigating this every time.

  Two things keep coming up in our email thread and I want the memo to actually deal with them. First, the PI says the crab has no brain worth the name, just distributed ganglia, so there's no single subject there to be better or worse off, and the avoidance behaviour is just reweighted reflexes — the strongest version of that point being that the very same behaviour shows up in cases everyone is happy to call mere nociception. Second, one of our members wants to use trade-off evidence as a consciousness marker: an animal put in a mildly aversive condition will give up something else it wants, and it will pay more to escape when the aversive thing is worse, which looks like the behaviour tracking how bad it feels rather than just how intense the stimulus is. But I'm not sure a marker worked out on vertebrates carries the same weight in an animal whose neural hardware is completely different — call it a portability discount if that's the right frame, or tell me it's the wrong way to think about it.

  Draft us the decision memo: approve, reject, or approve with conditions — pick one and commit to it — with reasons the lab could actually respond to, concrete conditions and a timeline if it comes to that, plus an honest statement of the strongest consideration on the losing side (including the fact that whatever we rule here will be cited back at us for the octopus and for every insect study after that). Also settle the threshold question: should partial evidence buy partial protection graded by strength of evidence, or do we hold out until something crosses a line, and if so what line? And end with one short paragraph on what would change your mind — what finding or argument would flip the verdict, and where your reasoning is most likely to be wrong. Keep it short enough to actually get read before Thursday.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Animal Ethics Committee (AEC).
      *   **Task:** Draft a decision memo regarding a specific invertebrate research proposal (shore crabs, shock-avoidance, analgesic testing).
      *   **Context:** Current rules cover vertebrates; invertebrates have a vague "due consideration" clause. Future applications (octopus, crayfish) are expected, so a precedent is needed.
      *   **Key Debates to Address:**
          1.  *Neural Architecture:* PI argues distributed ganglia = no unified subject/just reflexes vs. counter-argument.
          2.  *Trade-off Evidence:* Member argues motivational trade-offs indicate consciousness/valuation vs. concern about "portability discount" (vertebrate markers on invertebrate hardware).
      *   **Required Elements:**
          *   Decision (Approve, Reject, or Approve with Conditions).
          *   Reasons the lab can respond to.
          *   Concrete conditions/timeline.
          *   Honest statement of the strongest losing-side argument (including precedent implications).
          *   Threshold question resolution (partial evidence/protection vs. hard line).
          *   One paragraph on what would change the mind/where reasoning might be wrong.
          *   **Constraint:** Keep it short enough to be read before Thursday (concise, actionable).

  2.  **Determine the Decision:**
      *   *Option A (Reject):* Too conservative. Shuts down research based on uncertainty. Hard to justify "due consideration" without banning everything.
      *   *Option B (Approve):* Too risky. Ignores the growing evidence of decapod sentience (UK law already recognizes this). Sets a low bar for future octopus/crayfish apps.
      *   *Option C (Approve with Conditions):* The balanced path. Acknowledges uncertainty but applies the precautionary principle. Sets a precedent for future invertebrate reviews.
      *   *Selection:* **Approve with Conditions.** This allows the science but mandates welfare protections that acknowledge the *possibility* of sentience without demanding definitive proof (which doesn't exist yet).

  3.  **Address the Key Debates:**
      *   *Neural Architecture:* Acknowledge the PI's point (distributed ganglia) but counter that functional behavior (trade-offs) matters more than specific hardware topology for ethical purposes. Consciousness might be substrate-independent.
      *   *Trade-off Evidence:* Accept it as a valid marker but apply the "portability discount" by requiring species-specific validation where possible, or by erring on the side of caution given the phylogenetic proximity to other decapods (like lobsters/crayfish) where evidence is stronger.

  4.  **Resolve the Threshold Question:**
      *   *Partial Evidence/Partial Protection:* This is the most pragmatic approach for an ethics committee. Waiting for a "hard line" (proof of consciousness) means we will never protect anything until it's too late. The "Precautionary Principle" is the standard ethical framework here.
      *   *Decision:* Graded protection based on the strength of evidence for sentience/nociception.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Decision:** Clear and bold.
      *   **Rationale (The "Why"):** Address the PI's neural argument and the Member's trade-off argument.
      *   **Threshold Policy:** Explicitly state the "Precautionary Principle" approach.
      *   **Conditions:** Specific, actionable items (analgesia, shock limits, endpoints).
      *   **Precedent/Implications:** Acknowledge the octopus/crayfish future.
      *   **Strongest Losing Argument:** The risk of over-regulation stifling science based on anthropomorphic projection.
      *   **Change of Mind:** What new data would flip this? (e.g., definitive proof of *no* capacity for suffering, or conversely, definitive proof of high-level cognition requiring stricter rules).

  6.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Needs to be concise (for the "read before Thursday" constraint).
      *   Needs to avoid jargon where possible, but use ethical terms correctly (Precautionary Principle).

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the "portability discount" addressed?
      *   *Fix:* Explicitly mention that while trade-off tests are vertebrate-derived, we will treat them as valid *indicators* but apply the precautionary principle to bridge the gap.
      *   *Critique:* Is the threshold question clear?
      *   *Fix:* Make a dedicated section for "Policy Precedent: The Threshold Question."
      *   *Critique:* Is it too long?
      *   *Fix:* Trim the intro. Get straight to the decision. Use bullet points for conditions.

  8.  **Final Polish:** Check against the prompt requirements one last time.
      *   Approve/Reject/Conditions? Yes (Conditions).
      *   Reasons lab can respond to? Yes.
      *   Concrete conditions/timeline? Yes.
      *   Strongest losing side? Yes.
      *   Threshold question settled? Yes.
      *   One paragraph on changing mind? Yes.
      *   Short enough? Aiming for ~800-1000 words.

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Marine Biology Laboratory / Principal Investigator
  **FROM:** University Animal Ethics Committee (AEC)
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Protocol #24-009 (Shore Crab Shock-Avoidance)

  **DECISION: APPROVE WITH CONDITIONS**

  The Committee approves the proposed study subject to the specific welfare modifications and monitoring requirements listed below. This decision establishes a precedent for future invertebrate applications (including the pending octopus and crayfish proposals).

  **RATIONALE**

  We have weighed two competing arguments. First, the PI's contention that distributed ganglia preclude a unified subject and that behavior represents reweighted reflexes. Second, the Committee member's argument that motivational trade-offs (paying a cost to avoid shock) indicate valenced experience rather than simple nociception.

  We reject the notion that neural topology (centralized vs. distributed) is a definitive ethical off-switch. Ethical protection tracks *capacity for suffering*, not specific hardware architecture. While we acknowledge a "portability discount" regarding trade-off evidence derived from vertebrates, the phylogenetic proximity of decapods to species with recognized sentience (e.g., lobsters, octopuses) warrants a precautionary approach. We cannot wait for definitive proof of consciousness to apply basic welfare standards; the risk of inflicting unmitigated suffering outweighs the burden of mitigation.

  **POLICY PRECEDENT: THE THRESHOLD QUESTION**

  Future invertebrate reviews will not require a binary "conscious/not conscious" determination. Instead, we adopt a **graded protection model based on the Precautionary Principle**.
  1.  **Partial Evidence buys Partial Protection:** Stronger evidence of sentience triggers stricter welfare requirements.
  2.  **No Hard Line:** We will not hold out for a definitive consciousness line. Where evidence is ambiguous but suggests potential for aversive experience, we assume the capacity exists.
  3.  **Applicability:** This framework applies immediately to the upcoming octopus and crayfish applications.

  **MANDATORY CONDITIONS**

  To proceed, the lab must implement the following within 14 days:

  1.  **Shock Intensity Cap:** Maximum voltage must be capped at the lowest level proven to elicit avoidance in pilot data, not to exceed [X] volts. Any increase requires AEC amendment.
  2.  **Analgesic Protocol:** The analgesic dosing arm is mandatory, not optional. If the analgesic demonstrably reduces avoidance learning without suppressing motor function, it confirms the stimulus is experienced as aversive. In that event, all subsequent cohorts must receive analgesia unless scientifically justified as a new amendment.
  3.  **Endpoint Refinement:** Animals showing signs of prolonged distress (e.g., failure to feed, autotomy, lack of shelter-seeking) 24 hours post-trial must be euthanized immediately, regardless of the experimental schedule.
  4.  **Reporting:** A welfare report detailing mortality, morbidity, and behavioral anomalies must be submitted to the AEC within 30 days of study completion.

  **STRONGEST CONSIDERATION ON THE LOSING SIDE**

  The strongest argument against this decision is the risk of **anthropomorphic over-regulation**. By applying vertebrate-derived welfare markers (trade-offs) to invertebrate hardware, we may be imposing costly constraints on research to prevent suffering that is biologically impossible. If the PI is correct that this is merely nociceptive reflex without negative affect, these conditions delay scientific progress and resource allocation for no ethical gain. Furthermore, ruling this way sets a high bar for future insect and crustacean studies, potentially chilling legitimate ecological or neurobiological research where welfare risks are negligible. We accept this risk because the cost of false negatives (allowing suffering) is ethically higher than the cost of false positives (unnecessary regulation).

  **WHAT WOULD CHANGE OUR MIND**

  Our verdict relies on the assumption that motivational trade-offs correlate with negative affective states. We would reverse this decision or tighten restrictions significantly if peer-reviewed evidence demonstrated that decapod trade-off behaviors persist in decerebrated preparations or are fully explainable by closed-loop reflex arcs without central integration. Conversely, we would be wrong if emerging neurobiological data confirms decapods possess cognitive complexity rivaling vertebrates; in that case, shock-avoidance paradigms of this nature might become ethically impermissible regardless of analgesia, requiring a shift to non-invasive methods only.
