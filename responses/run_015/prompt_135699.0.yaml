      *   *Is Burke purely anti-reason?* No, he thinks reason is limited. He prefers "latent wisdom." I need to make sure I don't paint him as an irrationalist, but rather someone who trusts *collective* reason over *individual* reason.
      *   *The "Contract" metaphor:* Burke explicitly says it's *not* a contract like a business deal. I need to emphasize that distinction. It's a partnership of "all science, all art, every virtue."

  9.  **Final Polish:** Organize with clear headings or bullet points for readability. (Decided to use a structured essay-style response). Ensure the "dead, living, unborn" quote is contextualized.

  *(Self-Correction during drafting)*: I should make sure to mention that Chesterton was actually influenced by Burke. So the roommate isn't *wrong* about the lineage, but wrong about the *identity* of the ideas. Chesterton democratized Burke's aristocratic conservatism. That's a nice nuance to add.

