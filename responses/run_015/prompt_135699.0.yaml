      *   *Is he closer to Chesterton than the roommate thinks?* No, the user is right to see a tension. Chesterton is a liberal/traditionalist hybrid; Burke is a traditionalist/organicist. Chesterton is about *understanding* before acting; Burke is about *reverence* before acting.
      *   *Meaningful difference?* Yes. Burke = Moral Obligation/Prescription. Chesterton = Prudence/Epistemology.

