answer: |-
  # Simulation Design: "The Metric Trap"
  **Topic:** Weak vs. Strong Path Dependence in Social Science
  **Time:** 75 Minutes (35 Sim, 15 Deliberation, 25 Debrief)
  **Participants:** 12 Students (3 Groups of 4)
  **Materials:** Printed Rule Cards, Token Pools (Red/Blue chips or paper squares), Score Sheets, Pencils.

  ---

  ## 1. Materials and Setup

  **Room Arrangement:** Three tables spaced apart. Each table seats 4 students.
  **Roles (assigned within groups):**
  *   **Archivist:** Holds the Rule Card and Score Sheet; records final numbers.
  *   **Allocator:** Physically moves tokens during rounds.
  *   **Auditor:** Checks that moves comply with the Rule Card.
  *   **Envoy:** The only member allowed to stand and speak to the facilitator during rounds.

  **Token System:**
  *   **Red Chips:** Represent "Capital" (Path A) or "Nodes" (Path B).
  *   **Blue Chips:** Represent "Labor" (Path A) or "Links" (Path B).
  *   **Stakes:** The group with the highest *validated* Social Welfare Score receives a tangible but small reward (e.g., first choice of seminar paper topics, or a "Certificate of Institutional Efficiency" signed by the instructor). This creates low-stakes competition.

  **The Rule Cards (Print and Cut):**
  *   **Deck A (2 Copies):** "The Accumulation Protocol"
  *   **Deck B (1 Copy):** "The Integration Protocol"
  *   *Note:* The Facilitator distributes these secretly. Two groups get A, one group gets B. Do not reveal that rules differ until the Deliberation phase.

  **Deck A Text (The Accumulation Protocol):**
  > **FOUNDING PRINCIPLE:** Social welfare is the sum of individual capacity.
  > **ROUND 1:** Take 10 Red, 2 Blue.
  > **ROUND 2:** You may trade 2 Blue for 1 Red from the Bank.
  > **ROUND 3:** You may trade 1 Red for 2 Blue from the Bank.
  > **SCORING METRIC:** **Efficiency = Total Red Chips held at end of Round 4.** (Blue chips are neutral; they neither add nor subtract).
  > **VALIDATION:** A society is successful if it maximizes the stock of Capital (Red).

  **Deck B Text (The Integration Protocol):**
  > **FOUNDING PRINCIPLE:** Social welfare is the density of relational bonds.
  > **ROUND 1:** Take 5 Red, 5 Blue.
  > **ROUND 2:** You may trade 1 Red for 2 Blue from the Bank.
  > **ROUND 3:** You may trade 2 Blue for 1 Red from the Bank.
  > **SCORING METRIC:** **Cohesion = Number of Red-Blue Pairs physically touching.** (Single chips count for zero).
  > **VALIDATION:** A society is successful if it maximizes stable Connections (Pairs).

  **Score Sheet (Identical for all, but interpreted differently):**
  *   Group ID: ___
  *   Final Count: ___
  *   Signature of Auditor: ___

  ---

  ## 2. Round Structure (35 Minutes)

  **Minute 0-5: Setup & Seeding**
  *   Seat students. Assign roles.
  *   Hand out Rule Cards face down. Tell them: "This is your institutional constitution. Do not show it to other groups. Follow the rules exactly. You are building a society."
  *   **Round 1 (Endowment):** Groups follow their Round 1 instruction to draw tokens from the central bank.
  *   *Facilitator Note:* Walk around. Ensure Path B groups are pairing tokens physically (touching), while Path A groups are stacking them. Do not comment on the difference.

  **Minute 5-15: Institutional Development (Rounds 2 & 3)**
  *   **Round 2 (Investment):** Groups execute their specific trade rules.
      *   *Path A Logic:* Incentivized to hoard Red. Blue is a conversion cost.
      *   *Path B Logic:* Incentivized to balance Red/Blue to create pairs.
  *   **Round 3 (Consolidation):** Groups execute second trade rules.
      *   *Observation:* Path A will likely end with ~15 Red, ~0 Blue. Path B will likely end with ~5 Red, ~5 Blue (arranged in 5 pairs).
  *   *Facilitator Constraint:* If a student asks, "What is the goal?", reply: "Follow your Founding Principle." If they ask, "Is this fair?", reply: "Follow your Protocol."

  **Minute 15-25: Scoring (Round 4)**
  *   **Round 4 (Self-Assessment):** Groups calculate their own score using their specific **Scoring Metric**.
      *   Path A Group: Counts Red chips. (Expected Score: ~15)
      *   Path B Group: Counts Pairs. (Expected Score: ~5)
  *   **Crucial Step:** The Archivist writes the number on the Score Sheet.
  *   *Facilitator Action:* Collect the Score Sheets. Do not announce the numbers yet.

  **Minute 25-35: The Counterfactual Assignment**
  *   Announce: "We now enter the Comparative Phase. You must evaluate the stability of the *other* society."
  *   **Instruction:** "Path A Groups: Go to the Path B table. Look at their token arrangement. Calculate their 'Efficiency Score' using **your** Rule Card (Total Red Chips)."
  *   **Instruction:** "Path B Group: Go to a Path A table. Look at their token arrangement. Calculate their 'Cohesion Score' using **your** Rule Card (Red-Blue Pairs)."
  *   **Task:** Write this "External Evaluation Score" on a sticky note and place it on the other group's table.
  *   *Result:* Path A will rate Path B very low (few Reds). Path B will rate Path A very low (few Pairs).
  *   **Stop:** Return to seats. Do not discuss yet.

  ---

  ## 3. The Turning Point: Structured Deliberation (15 Minutes)

  **Prompt (Projected or Read Aloud):**
  > "You have just evaluated a counterfactual history. You have applied your metrics to an alternative institutional outcome.
  >
  > 1.  **Compare:** Look at the score you gave yourself vs. the score the other group gave you.
  > 2.  **Conflict:** Discuss why the other group's evaluation of you feels 'wrong' or 'inaccurate.'
  > 3.  **Resolution:** Can you agree on a *neutral* metric to decide which group actually 'won'? If not, why not?"

  **Facilitator Instructions during Deliberation:**
  *   **Silence:** Do not intervene unless the conversation stalls completely.
  *   **Listen for:** Claims like "They didn't count the pairs!" or "They ignored the capital!"
  *   **The Trap:** Students will try to invent a "super-metric" (e.g., "Total chips"). Allow this. Let them realize that "Total Chips" was not a value in either constitution.
  *   **Closing the Phase:** After 15 minutes, stop the conversation mid-sentence if necessary. "Freeze. Keep that tension in mind."

  ---

  ## 4. Debrief Script & Conceptual Mapping (25 Minutes)

  **Part 1: The Reveal (5 Minutes)**
  *   **Facilitator:** "Reveal your Rule Cards to each other."
  *   **Reaction:** Allow 60 seconds for shock/laughter.
  *   **Facilitator:** "In Round 1, you diverged. In Rounds 2-3, you optimized. In the Deliberation, you collided."

  **Part 2: Mapping Weak vs. Strong Path Dependence (10 Minutes)**
  *   **Draw on Board:** Two columns: "Weak Path Dependence" | "Strong Path Dependence".
  *   **Ask:** "Which type did we just simulate?"
  *   **Guide them to Strong:**
      *   *Weak:* If the rule had been "Maximize Total Chips" for everyone, but Path A got more Red and Path B got more Blue, we could compare them. The metric (Total Chips) is *ex ante* and stable.
      *   *Strong:* In our game, the **metric itself** was the path.
      *   **Mapping Moment 1 (Rounds 2-3):** This is *Increasing Returns / Positive Feedback*. Your early rule made certain moves cheaper (Path A buying Red, Path B making Pairs). This is standard path dependence.
      *   **Mapping Moment 2 (Deliberation):** This is *Metric Endogeneity*. Path A cannot see Path B's success because Path A's eyes (metrics) are calibrated to see 'Red' as value. Path B's eyes are calibrated to see 'Relations' as value.
  *   **Key Concept:** "In Strong Path Dependence, the counterfactual is not just empirically missing; it is conceptually incommensurable. You cannot ask 'Which is more efficient?' because 'Efficiency' is defined by the path."

  **Part 3: Limits of the Simulation (5 Minutes)**
  *   **Facilitator:** "This simulation is compressed. What did we leave out?"
  *   **Point 1: Time.** Real path dependence takes decades. You felt the 'lock-in' in 20 minutes. Real lock-in involves generations forgetting the alternative existed.
  *   **Point 2: Emotion/Identity.** You were playing a game. In reality, people *die* for these metrics. A Path A citizen doesn't just prefer Red; they believe valuing Pairs is *immoral*. The simulation creates cognitive dissonance; reality creates political violence.
  *   **Point 3: Exit Costs.** You could have theoretically ignored your card. In strong path dependence, ignoring the institutional logic makes action unintelligible to others.

  **Part 4: Philosophical Payoff (5 Minutes)**
  *   **Connect to Literature:**
      *   **Paul David (QWERTY):** This is *Weak* Path Dependence. We can measure typing speed independently of the keyboard.
      *   **Brian Arthur / W. Brian Reddick:** This is *Strong* Path Dependence. The technology shapes the cognitive framework.
      *   **Michel Callon (Actor-Network):** The metrics are part of the network, not outside observers.
  *   **Closing Question:** "When you analyze a social institution in your papers, how do you ensure you aren't using a metric that the institution itself manufactured?"

  ---

  ## 5. Predictable Failures & Troubleshooting

  **Failure 1: The "Universalist" Revert**
  *   **Symptom:** During deliberation, a student says, "Well, obviously Group A won because 15 is bigger than 5," or "We should just count total chips to be fair."
  *   **Diagnosis:** Students are reverting to an *ex ante* neutral metric (Weak Path Dependence thinking) to resolve the conflict. They are refusing the incommensurability.
  *   **Handling:** Do not correct them immediately. In the Debrief, highlight this move. "Notice how Group 1 tried to invent a 'God's Eye View' metric (Total Chips). In the real world, who gets to define that metric? Usually, the winner. That is power, not neutral science." This turns the failure into a lesson about the politics of measurement.

  **Failure 2: Facilitator Leakage**
  *   **Symptom:** During Round 2, the facilitator says, "Make sure you're pairing those correctly," hinting that the rules differ.
  *   **Diagnosis:** Ruins the "blind" nature of the institutional reality.
  *   **Handling:** If you slip up, own it in the Debrief. "I accidentally signaled the difference. In real life, this signaling doesn't come from a professor; it comes from culture, language, and law. The fact that you still felt the conflict shows how deep the rule-internalization goes."
  *   **Prevention:** Use a script for Round instructions. "Round 2 begins. Execute your Protocol." No elaboration.

  **Failure 3: Path B Feels "Cheaty"**
  *   **Symptom:** Path B students feel their rules were "harder" or "weird" compared to Path A's simple accumulation.
  *   **Diagnosis:** Asymmetry in cognitive load.
  *   **Handling:** Acknowledge this in the Debrief. "Path Dependence is rarely symmetrical. One path often becomes the 'default' (Path A/Accumulation) because it aligns with pre-existing intuitions. The fact that Path B felt 'artificial' is exactly how marginalized institutional forms feel in the real world."

  ---

  ## Instructor's Cheat Sheet (Print for Facilitator)

  | Phase | Time | Key Action | Do Not Say |
  | :--- | :--- | :--- | :--- |
  | **Setup** | 0-5 | Distribute Cards secretly. 2 Groups A, 1 Group B. | "You have different rules." |
  | **Rounds** | 5-25 | Enforce rules strictly. Watch for metric formation. | "That's inefficient." / "Why are you doing that?" |
  | **Switch** | 25-35 | Force cross-evaluation using *own* metrics. | "Try to understand their view." (No, force *their* view onto the other). |
  | **Delib** | 35-50 | Let them fight. Watch for "Universal Metric" attempts. | "Actually, both are valid." |
  | **Debrief** | 50-75 | Map to Weak/Strong distinction. Admit simulation limits. | "The point is..." (Let them say it first). |

  **Conceptual Anchor for Debrief:**
  *   **Weak:** Different roads to the same mountain (Mountain = Ex ante metric).
  *   **Strong:** Different roads create different mountains (Mountain = Endogenous metric).
  *   **The Simulation:** You didn't just climb different mountains; you built different altimeters.
