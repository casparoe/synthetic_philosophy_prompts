answer: |-
  You are right that it is the same boat, but your brother is right that arguing over it misses the point.

  In the context of a will, identity is determined by the owner's intent and legal continuity, not metaphysical purity. Your father maintained continuous registration, numbered the parts to preserve their specific history, and consistently referred to the restored vessel as the original; probate courts prioritize this documented intent over philosophical debates about material composition. The eleven-year gap does not break identity any more than a long restoration project breaks the identity of a classic car or a historic home, because the *project* itself carried the identity during the dormant period. The boat existed as a defined endeavor to reconstitute specific materials, not merely as a functional object floating in water.

  Regarding the crates, if the boat had remained unfinished, it would indeed be merely lumber, because identity in restoration is prospective—it relies on the completion of the intent to reconstitute. There is no fixed time limit where identity expires; rather, identity persists as long as the intent to restore remains viable and is eventually realized. Since your father finished the work, the gap is retroactively bridged by his successful completion of the project. The difference between eleven minutes and eleven years is not metaphysical but evidentiary; the longer the gap, the harder it is to prove intent, but since the intent was clearly documented and executed, the duration is irrelevant.

  However, on whether you should care, your brother is correct. Wills are meant to distribute assets, not fund philosophical litigation. If you force a legal interpretation that gives you the boat based on a technicality your father likely never intended to be a trap, you may win the asset but lose the fairness your brother mentions. The right answer about the boat is yours, but the right answer about the inheritance is to sell it and split the proceeds.
