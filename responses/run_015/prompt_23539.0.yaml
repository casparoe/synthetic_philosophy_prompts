  **DRAFT FOR INTERNAL COMMITTEE REVIEW ONLY**
  **NOT FOR PUBLIC DISTRIBUTION UNTIL VOTED UPON**

  **TO:** The Doctrinal Review Committee
  **FROM:** The Drafting Sub-Committee
  **DATE:** [Current Date]
  **RE:** Opinion and Recommendation regarding Complaint [Case Number] – Providence and Middle Knowledge

  ### I. Introduction and Matter Under Review

  The Committee has received a formal complaint regarding a sermon series delivered by Pastor [Name] at [Church Name]. The specific teaching under review is the assertion that "God's decree is conditioned on middle knowledge — God saw what free people would do and then arranged the circumstances."

  The Complainant alleges this teaching violates [Name of Denomination/Confession, e.g., The Westminster Confession of Faith, Chapter 3], specifically the doctrine that God's decree is unconditional, sovereign, and the ultimate cause of all that comes to pass. The Respondent (Pastor [Name]) contends that he is articulating a Molinist model of providence, which he argues is a coherent, orthodox system found within the broader Christian literature, and that his phrasing was a didactic simplification of a complex theological locus.

  The Committee's task is not to resolve the centuries-old debate between Thomists, Molinists, and Augustinians definitively. Rather, we must determine if the specific claim that *the decree is conditioned upon middle knowledge* is compatible with our denominational standards regarding the sovereignty of God and the nature of the divine decree.

  ### II. Theological Analysis

  To render a defensible judgment, the Committee has engaged the Molinist position on its own terms, specifically regarding the ontological status of Counterfactuals of Creaturely Freedom (CCFs) and their relationship to the divine will.

  **A. The Coherence of Counterfactuals of Freedom**
  Molinism posits that prior to God's creative decree, He possesses "middle knowledge" of what any possible free creature *would* do in any possible set of circumstances. These are contingent truths (e.g., "If Peter were in circumstance C, he would freely deny Christ").
  *   **The Challenge:** For these truths to be known by God *prior* to His decree, they must be true independently of God's will. The Complainant argues this posits "brute facts" outside of God's ontology that constrain His decision-making.
  *   **The Respondent's Defense:** The Respondent argues these truths are grounded in the nature of the creature, not in an external force opposing God. Thus, God remains sovereign because He freely chooses *which* circumstances to actualize, knowing the outcome via middle knowledge.

  **B. The Conditionality of the Decree**
  The crux of the complaint lies in the word "conditioned."
  *   **Standard Confessional Position:** Our standards teach that God ordains whatsoever comes to pass (Eph 1:11). While God is not the author of sin, His decree is the ultimate basis for reality. Nothing is prior to the counsel of His will.
  *   **The Molinist Tension:** If God's decree to create World W is based on His knowledge that "In W, Creature X will do Y," then the truth of "Creature X will do Y" is logically prior to the decree to create W. This suggests the decree is *responsive* to facts outside God's will, rather than *determinative* of all reality.
  *   **Assessment:** While Molinists argue God still freely chooses the world, the *basis* for that choice relies on data (CCFs) that God did not determine. In our confessional framework, this compromises the aseity of God's counsel. If the decree is conditioned on something outside God's will, it is not fully sovereign in the sense required by [Confession Citation].

  **C. The Strongest Case for the Respondent (Charitable Construction)**
  The Committee acknowledges the strength of the Molinist apologetic regarding the problem of evil and human responsibility. The strongest argument for the Respondent is that this model preserves a robust view of libertarian freedom, thereby absolving God of being the direct cause of sin. If God merely permits what He knows creatures would freely do, rather than decreeing the specific action itself, the moral burden of evil rests solely on the creature. This is a pastoral and philosophical advantage that the Respondent sought to leverage. We recognize that Pastor [Name] likely intended to protect the goodness of God, not to diminish His sovereignty.

  **D. The Strongest Case for the Complainant**
  The Complainant's concern rests on the doctrine of Divine Aseity. If there are truths about creation that God does not author but merely observes (even logically prior to creation), then God is not the sole ultimate reality. There exists a "realm of truth" independent of God that He must navigate. Our Confession explicitly rejects the idea that God's knowledge or decree is dependent on foreseen faith or actions of creatures (e.g., [Confession Citation, e.g., WCF 3.2 or 3.5]). To say the decree is *conditioned* on middle knowledge functionally equates to saying it is conditioned on foreseen works, which our standards explicitly forbid.

  ### III. Determination

  The Committee finds that while the *concept* of God's exhaustive knowledge (including counterfactuals) is not inherently heretical, the specific formulation that **"God's decree is conditioned on middle knowledge"** creates a theological incompatibility with our denominational standards.

  The standards maintain that the decree is the *cause* of the truth of things, not a *response* to truth existing independently of God. By teaching that the decree is conditioned on facts outside the divine will, the Respondent has taught a view of providence that undermines the unconditional nature of God's sovereignty as understood and subscribed to by this denomination.

  However, the Committee also finds no evidence of malicious intent or a rejection of core orthodoxy (e.g., the Trinity, the Deity of Christ, Salvation by Grace). The error appears to be a category confusion regarding the logical order of God's knowledge and will.

  ### IV. Recommendation and Ruling

  **Ruling:** **SUSTAIN WITH REQUIRED CORRECTIVE STATEMENT.**

  The Committee recommends sustaining the complaint in part, not to censure the Pastor's orthodoxy broadly, but to correct the specific doctrinal formulation regarding the decree.

  **Required Actions:**
  1.  **Clarification:** Pastor [Name] is requested to issue a brief written clarification to his session and congregation. This statement need not be a public retraction of a "heresy," but a theological nuance correction. It should clarify that while God knows all counterfactuals, His decree is not *dependent* upon them in a way that compromises His sovereign freedom or aseity.
  2.  **Teaching Adjustment:** Future teaching on providence should align with the language of [Confession Citation], emphasizing that God's knowledge and will are concurrent and that no facts exist prior to or outside of His ultimate counsel.
  3.  **Timeline:** This clarification must be submitted to the Committee Chair within **30 days** of the adoption of this opinion.
  4.  **Follow-up:** The Presbytery/Committee will review the clarification at the next scheduled meeting ([Date]). If the clarification is deemed satisfactory, the matter will be closed. If the language remains unchanged, further disciplinary review may be necessary.

  ### V. Conclusion

  This ruling seeks to maintain the integrity of our confessional standards regarding God's sovereignty while treating the Respondent with the charity due a brother in Christ who is operating within a known (though for us, unacceptable) theological framework. We affirm that God is sovereign over the circumstances *and* the actions of free agents, without needing to posit a logical moment where God's will waits upon created truths.

  **Respectfully Submitted,**

  [Your Name/Signature]
  **Drafting Secretary, Doctrinal Review Committee**

  ***

  **Notes for the Committee Member (User):**
  *   **Confessional Citations:** I have used brackets like `[Confession Citation]`. You need to fill these in with your specific standards (e.g., *Westminster Confession of Faith 3.1-2*, *London Baptist 1689 3.1*, *Belgic Confession Art. 13*). This is crucial for the ruling to hold water.
  *   **Tone:** The draft is written to be firm on the *doctrine* but soft on the *man*. This is usually the best way to get a committee to agree without causing a schism.
  *   **The "Conditioned" Distinction:** The draft hinges on the word "conditioned." Many Calvinists accept God *knows* counterfactuals (as part of His natural knowledge), but they reject that the decree is *based* on them. This distinction allows you to rule against the pastor without claiming he made God ignorant.
  *   **Thursday's Meeting:** Ensure you circulate this early enough for other committee members to read it before Thursday.
