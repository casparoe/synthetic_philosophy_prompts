answer: |-
  Your group member's objection is a classic conflation of epistemology with metaphysics, but it cuts to the heart of why David Lewis found the Principal Principle (PP) so difficult to defend. The sentence "probability is in the eye of the beholder" is ambiguous enough to hide several distinct philosophical moves.

  To locate the slide, we need to disentangle the menu of claims hidden in that gloss. I have ordered these from a harmless platitude compatible with realism to a radical eliminativism that dissolves the problem by dissolving the ontology.

  ### The Menu of Theses

  #### 1. The Epistemic Mediation Thesis
  **Claim:** *Human agents can only access facts about objective chance through the mediation of their own subjective credences and evidence.*
  *   **Status:** **True (as a platitude).** We have no "chance-ometer." We infer chances from frequencies, symmetries, or physical theories, and these inferences update our credences.
  *   **Establishment:** Requires only a basic fallibilist epistemology. Even if objective chances exist "out there," our grip on them is necessarily "in here."
  *   **Licenses Dismissal?** **No.** This is compatible with Lewis's realism. Lewis agrees we access chance via credence; the PP is the rule governing *how* that access should work. Accepting this thesis leaves the PP as a substantive constraint on how the world guides the mind.

  #### 2. The Semantic Reduction Thesis
  **Claim:** *Statements about "objective chance" are semantically equivalent to statements about "rational credence under ideal conditions."*
  *   **Status:** **Controversial (Anti-Realist).** This is the Ramsey/de Finetti view. It denies that "chance" refers to a mind-independent property.
  *   **Establishment:** Requires an argument that objective chance is occult or metaphysically suspicious, and that all useful work done by chance-talk can be done by idealized betting quotients.
  *   **Licenses Dismissal?** **Yes, but at a cost.** If chance *means* ideal credence, then the PP ($C(A | Ch(A)=x) = x$) becomes an analytic truth (a tautology). It tells you nothing new about the world, only about your definitions. However, this dismisses the PP only by rejecting the ontology of the physics you are reading (which usually posits objective stochasticity).

  #### 3. The Metaphysical Elimination Thesis
  **Claim:** *There are no objective chances in the world; there are only categorical events and agents with credences.*
  *   **Status:** **Radical (Hard Eliminativism).** This goes further than Thesis 2. It's not just that the *meaning* is subjective, but that the *property* does not exist.
  *   **Establishment:** Requires a metaphysical argument (e.g., Humean Supervenience taken to an extreme, or determinism) showing that "propensities" or "stochastic laws" are impossible.
  *   **Licenses Dismissal?** **Yes.** If there are no chances, the PP has no antecedent. It is a rule for conditioning on a falsehood. However, this forces you to reinterpret quantum mechanics or statistical mechanics as purely epistemic tools, which is a heavy lift in a philosophy-of-physics context.

  #### 4. The Normative Circularity Thesis
  **Claim:** *The PP cannot justify setting credence to chance because the definition of "admissible evidence" (required for the PP to hold) already presupposes the link between chance and credence.*
  *   **Status:** **Technically Plausible (The "Lewisian Dilemma").** Lewis himself worried about this. He defined admissible information as information whose impact on credence comes *only* via its impact on credence about chance.
  *   **Establishment:** Requires analyzing the formal structure of the PP to show that the *explanans* (chance) and the *explanandum* (credence) are mutually defining.
  *   **Licenses Dismissal?** **Partially.** It suggests the PP cannot be the *foundation* of our knowledge of chance, but rather a coherence constraint on a system that already assumes a connection. It doesn't prove chance doesn't exist, but it undermines the PP's status as a fundamental bridge principle.

  ---

  ### The Triviality Charge on Each Reading

  Your member's core complaint is that the PP is either **trivial** (internal consistency) or **circular** (presupposes what it explains). Here is how that charge fares across the menu:

  **On Thesis 1 (Epistemic Mediation):**
  The charge **fails**. The PP remains a substantive bridge. It says: "If you know the objective feature of the world (Chance), here is how you must constrain your mind (Credence)." The fact that you need evidence to know the chance doesn't make the link between chance and credence trivial; it makes the *access* to the antecedent difficult. The PP is the rule of translation, not the evidence itself.

  **On Thesis 2 (Semantic Reduction):**
  The charge **succeeds (Triviality)**. If "Chance = Ideal Credence," then the PP says "Set your credence to what your ideal credence would be." This is a consistency constraint on your own beliefs (calibration). It degenerate into a requirement of rationality internal to the agent, severing the link to the external world.

  **On Thesis 3 (Metaphysical Elimination):**
  The charge **succeeds (Vacuity)**. If there are no chances, the PP is not trivial; it is empty. It's like saying "Set your credence to the will of Zeus." The problem isn't that the principle is too weak; it's that it refers to nothing.

  **On Thesis 4 (Normative Circularity):**
  The charge **succeeds (Circularity)**. Here the PP stays a bridge, but the bridge is built from both sides simultaneously. It cannot explain *why* we should defer to chance, because our understanding of what counts as "chance" already relies on our understanding of when we should defer.

  ### The Role of "Admissible Evidence"

  You asked if the triviality charge turns on the clause about inadmissible evidence. **Yes, critically.**

  Lewis's PP is formulated as:
  $$C(A \mid Ch(A)=x \ \& \ E) = x$$
  *Where $E$ is admissible evidence.*

  1.  **If you are a Realist (Thesis 1):** Admissibility is a substantive filter on information. It excludes "crystal ball" information (knowledge of the future) that would bypass the chance. The PP is substantive because it tells you that *even if* you have evidence $E$, as long as $E$ is admissible, the Chance trumps it. This is a strong claim about the screening-off power of objective chance.
  2.  **If you are a Subjectivist (Thesis 2):** Admissibility becomes a logical constraint. Information is "inadmissible" if it makes your credence diverge from the "chance" (which is just ideal credence). The clause becomes a safeguard against logical inconsistency rather than a shield protecting objective fact from epistemic leakage.
  3.  **The Slide:** Your member likely slides from **Thesis 1** (which is undeniable: we need evidence) to **Thesis 2** (which is controversial: chance *is* credence).
      *   *The Slide:* "Since I can only know chance through my credences (Thesis 1), chance must be nothing over and above my credences (Thesis 2)."
      *   *The Error:* This confuses the *mode of access* with the *nature of the object*. I can only know the mass of the electron through my measurements (credences/evidence), but the mass is not *nothing over and above* my measurements.

  ### Conclusion: Locating the Slide

  Your member's dismissal is licensed **only if** they are committed to Thesis 2 or 3 (Semantic Reduction or Eliminativism). If they are, they are not doing philosophy of physics in the Lewisian sense; they are doing radical Bayesianism.

  However, in a physics reading group, the physics usually posits objective stochasticity (e.g., Born rule probabilities). If the physics is realist, **Thesis 1** is the only viable option. On Thesis 1, the PP is **not trivial**. It is a substantive normative constraint requiring that rational agents "mimic" the stochastic structure of the world.

  The "slide" is the move from **"We have no access to chance except via credence"** (True) to **"Chance is constituted by credence"** (False, or at least not entailed). The Principal Principle is precisely the principle that prevents this slide: it demands that credence *track* chance, implying they are distinct things that can come apart (which is why we need the principle in the first place). If they were identical, no principle would be needed to align them.
