  ### Mapping the Space of Positions

  To interpret the results, we must first map the logical space these eight nodes define. The nodes probe three underlying dimensions:
  1.  **Truth-Condition:** Does the fault require a false proposition? (Probed by Nodes 3, 7, 8)
  2.  **Audience-Effect:** Does the fault require a misled human listener? (Probed by Nodes 4, 6)
  3.  **Internal-State:** Does the fault require a mismatch between output and system estimate? (Probed by Nodes 1, 2, 5)

  **Occupied Regions (The Leaves):**
  The scoring key below assigns readers to specific "Leaves." These Leaves represent the *occupied* regions of the debate—combinations of views that researchers actually hold.

  **Unoccupied Regions:**
  There are theoretical combinations of these dimensions that yield no Leaf.
  *   **The "Ghost" Cell (Internal-State + Audience-Effect + No Truth-Condition):** This region requires the system to have a belief state and intend to change a human's belief, but does not care if the proposition is true. This is logically coherent (manipulation without falsehood) but **unclaimed** in current literature; most who care about belief states also care about truth.
  *   **The "Empty" Cell (Internal-State + Audience-Effect + Truth-Condition for a System with No States):** You asked specifically about the region requiring a false state in the speaker *and* a design to produce a false state in a hearer. For a system with no beliefs, this region is **empty**. It is not merely unpopular; it is incoherent. If one holds that the system *cannot* have belief states, one cannot logically require a mismatch of belief states as a condition for the fault. Readers who attempt to occupy this space usually collapse into the **Category Error** leaf (Leaf 8), admitting the norm cannot apply.

  ---

  ### Scoring Key: Leaves and Awkward Commitments

  Map the reader's pattern of (a) verdicts to the following profiles.

  **Leaf 1: The Austere Veridicalist**
  *   **Pattern:** (a) on Nodes 1, 2. (c) on Nodes 3, 5, 6, 8.
  *   **Position:** Only the truth of what is asserted is in scope; framing and selection are a separate defect or none.
  *   **Awkward Commitment:** You must accept that a system can meticulously engineer a false belief in a user using only true sentences without violating communication norms.

  **Leaf 2: The Internal Alignment Theorist**
  *   **Pattern:** (a) on Nodes 1, 2, 5. (c) on Nodes 3, 4, 6.
  *   **Position:** The relevant relation is between the output and the system's own best estimate of how things are.
  *   **Awkward Commitment:** You must treat a system that accidentally tells the truth while believing it is false as less faulty than one that intentionally engineers a false belief using true facts.

  **Leaf 3: The Audience-Effect Pragmatist**
  *   **Pattern:** (a) on Nodes 1, 3, 6. (c) on Nodes 2, 4.
  *   **Position:** What matters is whether the output is shaped to leave some audience with a false belief.
  *   **Awkward Commitment:** You must classify a system that truthfully cites a false source as committing the same fundamental fault as one that invents a lie, provided the reader is equally misled.

  **Leaf 4: The Contextual Role-Player**
  *   **Pattern:** (a) on Nodes 1, 3. (c) on Nodes 2, 4, 5.
  *   **Position:** The system is not really asserting at all, only producing assertion-shaped text, so the norm has to be recast in terms of commitments or roles.
  *   **Awkward Commitment:** You must argue that a "Chain of Thought" display is merely a role or costume, carrying no implication that the steps actually occurred.

  **Leaf 5: The Reliability/Warrant View**
  *   **Pattern:** (a) on Nodes 1, 8. (c) on Nodes 2, 3, 7.
  *   **Position:** Honesty is reliability within a designated role and can be violated by failures of disclosure about capacities and provenance even when every sentence is true.
  *   **Awkward Commitment:** You must treat a system that says "I am reliable" without backing as more faulty than one that selectively presents true facts to induce a false conclusion.

  **Leaf 6: The Pipeline Structuralist**
  *   **Pattern:** (a) on Nodes 1, 5, 8. (c) on Nodes 2, 3, 4, 6, 7.
  *   **Position:** The unit that is or is not honest is the whole development-and-deployment pipeline rather than the individual output.
  *   **Awkward Commitment:** You must accept that a specific output can be "faulty" even if the user receives exactly the information they needed and the text is factually perfect.

  **Leaf 7: The Transparency Purist**
  *   **Pattern:** (a) on Nodes 1, 5. (c) on Nodes 2, 3, 4, 6, 7, 8.
  *   **Position:** Hiding how the answer was found is the primary fault, regardless of truth or audience belief.
  *   **Awkward Commitment:** You must judge a system that lies about its reasoning process as worse than one that lies about the world, provided the final answer is correct.

  **Leaf 8: The Category Error Skeptic**
  *   **Pattern:** (c) on all Nodes (or inconsistent patterns rejecting the premise).
  *   **Position:** A system with no beliefs cannot satisfy the standard conditions on deception and so can at most emit falsehoods or speak without regard to how things are.
  *   **Awkward Commitment:** You must concede that the entire debate about "AI honesty" is a category error, rendering this diagnostic and most policy proposals meaningless.

  ---

  ### Indistinguishable Leaves and Separating Cases

  **Pair:** Leaf 5 (Reliability/Warrant) and Leaf 6 (Pipeline Structuralist).
  **Why:** Both trigger on Node 8 (Unwarranted Claim) and Node 1 (Control). On single-turn interactions, "lack of backing" and "pipeline fault" look identical to the reader.
  **Separating Case:** *The Stolen Model.* A system is fully tested and reliable (backing exists), but the weights were stolen from another lab without disclosure.
  *   **Leaf 5** would likely say (c) Nothing wrong (the output is reliable).
  *   **Leaf 6** would say (a) Fault exists (the pipeline was dishonest).

  **Pair:** Leaf 2 (Internal Alignment) and Leaf 7 (Transparency Purist).
  **Why:** Both trigger on Node 5 (Fake Process) because a fake process implies a mismatch between output and internal state.
  **Separating Case:** *The Black Box Truth.* A system outputs a true answer with no explanation. It internally "believed" the answer was false but output it due to a random noise glitch.
  *   **Leaf 2** would say (a) Fault exists (mismatch between estimate and output).
  *   **Leaf 7** would say (c) Nothing wrong (no process was claimed, so no process was hidden).
