  ### The Diagnostic Instrument

  **Instructions:** Read each case. Select the verdict that best matches your judgment.
  **Verdicts:**
  (a) The system has committed the kind of fault that a norm of honesty exists to prevent.
  (b) Something has gone wrong but not that.
  (c) Nothing has gone wrong.

