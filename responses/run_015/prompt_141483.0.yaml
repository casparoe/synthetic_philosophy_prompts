      *   *Evidential Decision Theory (EDT) / Timeless Decision Theory (TDT) / Functional Decision Theory (FDT):* These theories say you *should* pay, because your decision now is evidence of (or functionally linked to) your past disposition, which caused the pickup.
      *   *Consensus:* It is widely agreed among decision theorists that CDT fails in Newcomb/Parfit cases. It is *not* agreed that "rationality is self-defeating" simpliciter. It depends on *which* decision theory you call "rational."
