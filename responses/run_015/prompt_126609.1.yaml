      *   **Task:** 8-10 interview questions.
      *   **Constraints:**
          *   Do not let her simply restate the synthesis.
          *   Press internal tensions (e.g., curatorial forgetting vs. erasure, majoritarian bias, nostalgia for hierarchical authority).
