          *   *Follow-up:* If the victim's story doesn't fit the "authority" narrative, are they sacrificed?

      *   *Question 2: The Rieffian Nostalgia.* Rieff laments lost authority. But that authority often oppressed people.
          *   *Draft:* Isn't Rieff problematic?
          *   *Refinement:* Is the "moral authority" she wants to preserve actually just the authority of the oppressor?
          *   *Follow-up:* If the old authority caused the wound, why trust it to heal via triage?

      *   *Question 3: Mnemonic Inflation.* She claims too much memory dilutes impact.
          *   *Draft:* Is there evidence for inflation?
          *   *Refinement:* Connect inflation to power. Who benefits from saying "we remember too much"?
          *   *Follow-up:* Isn't "inflation" just a label for marginalized groups finally getting space?

      *   *Question 4: Institutional Mechanism (Requirement).* Who decides?
          *   *Draft:* Who runs the triage?
          *   *Refinement:* If it's the state, isn't that dangerous? If it's philosophers, isn't that undemocratic?
          *   *Follow-up:* Don't dodge with "context dependent." Give a principle of legitimacy.

      *   *Question 5: Victim Community Rejection (Requirement).* What if victims say "no" to forgetting?
          *   *Draft:* What if victims disagree?
          *   *Refinement:* If the ethics is *for* the victims, can you override their demand to remember?
          *   *Follow-up:* Does this turn victims into means for societal stability?

      *   *Question 6: Therapeutic Culture.* She blames therapeutic culture for inability to bear guilt.
          *   *Draft:* Why blame therapy?
          *   *Refinement:* Is "therapeutic" just a code for "democratic/pluralistic"?
          *   *Follow-up:* Are you arguing we need less democracy to remember better?

      *   *Question 7: Transitional Justice.* Application to post-conflict societies.
          *   *Draft:* How does this work in South Africa?
          *   *Refinement:* In TRCs, truth-telling is cathartic. Does triage suggest limiting truth-telling?
          *   *Follow-up:* Is she advocating for a cap on truth?

      *   *Question 8: The "Strategic" Element.* Strategic implies a goal. What is the goal?
          *   *Draft:* What is the strategy for?
          *   *Refinement:* Is the goal social cohesion or justice? If they conflict, which wins?
