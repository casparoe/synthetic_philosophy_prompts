      *   *Rieff:* "The Triumph of the Therapeutic." Modernity replaces "commanding creeds" with psychological well-being. We can't handle deep guilt anymore.
      *   *Voss's Synthesis:* Because we *can't* handle deep guilt (Rieff), we must limit what we remember (contra Margalit's universalizing tendency) to keep the remaining memories potent.
      *   *The Danger:* This sounds like state-sanctioned amnesia. Who decides what is "too much"? Does this privilege the comfort of the living over the justice due to the dead? Is it elitist?

  3.  **Drafting Questions (Iterative Process):**

      *   *Question 1: The Definition of Erasure.* Margalit worries about the "second death" (being forgotten). Voss advocates forgetting.
