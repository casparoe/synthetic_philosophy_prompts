  2. Von Neumann machines rely on synchronous, serial logic, whereas the brain functions through asynchronous, massively parallel signaling without a central clock. This discrepancy invalidates the argument that cognition must be fundamentally serial and symbolic.
  3. The brain employs analog, statistical messaging with high fault tolerance, contrasting sharply with the precise digital logic and brittle error sensitivity of standard computer hardware. Such resilience suggests neural computation tolerates noise in ways software architectures cannot.
  4. Your friend misinterpreted von Neumann, who explicitly argued in *The Computer and the Brain* that the nervous system likely uses a non-digital language unlike the EDVAC. He warned against projecting the architecture of artificial machines onto biological organs.
  5. Once these critical disanalogies are placed on the table, the conclusion that the mind is simply software-on-hardware loses its primary structural support. The analogy was doing all the argumentative work, and removing it leaves computationalism significantly weakened.
