answer: |-
  ### Desiderata for a Constitutive Theory of Moral Responsibility

  To move beyond the binary of "responsible vs. not responsible," an adequate theory must treat reactive attitudes (resentment, gratitude, indignation) not as tools for social regulation, but as the very medium in which responsibility is constituted. Given the specific phenomenology of caregiving for frontotemporal dementia (FTD), where the person is present but the inhibitions are dissolved, the theory must satisfy the following requirements.

  #### I. Phenomena to Explain

  **1. The Asymmetry of Excusing vs. Weakening Conditions**
  *   **The Requirement:** The theory must distinguish between conditions that *eliminate* the target of reactive attitudes (exemptions) and those that merely *mute* them (mitigations).
  *   **The Tension:** In standard cases (e.g., sleepwalking), the causal story eliminates the agent, killing resentment. In FTD, the causal story (neuropathology) is clear, yet resentment often persists, merely weakened or complicated by grief. A theory that treats all causal determinants as exemptions fails here. It must explain why some causal histories (coercion) void responsibility, while others (character erosion via disease) only complicate it.
  *   **Motivating Case:** You know the insult was caused by frontal lobe atrophy. Intellectually, this is an exemption. Emotionally, it registers as a betrayal. The theory must account for this lag without dismissing the emotion as irrational.

  **2. The Persistence of Intimacy-Based Resentment**
  *   **The Requirement:** The theory must explain why reactive attitudes are stickier in high-stakes, intimate relationships than in impersonal ones, even when the exculpatory evidence is identical.
  *   **The Tension:** We easily forgive a stranger's outburst if they are ill. We struggle to forgive a parent's. If reactive attitudes are constitutive of responsibility, the *relationship* itself must be a variable in the responsibility calculus, not just the agent's capacity.
  *   **Motivating Case:** The harm recurs. The medical explanation is constant. Yet, the resentment accumulates. A robust theory must explain why the history of the relationship amplifies the demand for regard, making the suspension of attitudes harder even when the justification for suspension is strong.

  **3. The Directionality of Attitudes (Agent vs. Action)**
  *   **The Requirement:** The theory must distinguish between attitudes directed at the *will* of the agent and those directed at the *outcome* of the event.
  *   **The Tension:** In FD caregiving, one often resents the *situation* or the *disease* while attempting to withhold resentment from the *parent*. However, because the disease acts *through* the parent, these targets blur.
  *   **Motivating Case:** You feel anger at the comment made. Is the anger at the parent who spoke it, or the pathology that enabled it? If the theory cannot distinguish these targets, it forces a false choice: either the parent is fully responsible (ignoring the disease) or not responsible at all (ignoring the person).

  #### II. Conceptual Innovations

  **4. Reactive Opacity**
  *   **The Definition:** Situations where the observer maintains a reactive attitude despite knowing that the causal etiology of the harm is ambiguous, inaccessible, or mixed (e.g., is this the disease speaking, or a residual habit of the old self?).
  *   **The Requirement:** The theory must categorize the rationality of maintaining attitudes under opacity. Is this preservation:
      *   *Rational:* A necessary stance to maintain the relationship's normative structure?
      *   *Heuristic:* A cognitive shortcut to protect the caregiver from the exhaustion of constant etiological investigation?
      *   *Erroneous:* A failure to properly apply the exemption criteria?
  *   **Motivating Case:** You cannot know in the moment if a hurtful remark is a symptom or a choice. You react with hurt. Later, you suspend judgment. The theory must validate the initial reaction not as a mistake, but as a functional engagement with the *possibility* of agency, even when certainty is impossible.

  #### III. Puzzles to Dissolve

  **5. The Voluntariness of Suspension**
  *   **The Requirement:** The theory must explain how we can be *obligated* to suspend reactive attitudes (for the sake of care) when those attitudes are supposedly involuntary responses to perceived ill will.
  *   **The Tension:** If reactive attitudes are constitutive of our view of others as agents, we cannot simply turn them off at will. Yet, caregiving demands we do exactly that to prevent burnout and maintain dignity for the patient.
  *   **Motivating Case:** You force yourself to view the parent as a patient to stop the resentment. If the theory says responsibility is *only* the natural attitude, this forced shift looks like self-deception. The theory must allow for a "normative suspension" that is not a denial of reality, but a shift in framework.

  ---

  ### Jointly Unsatisfiable Pairs (The Internal Tensions)

  Any theory attempting to meet the above desiderata will likely face the following conflicts. Identifying these is crucial for assessing the cost of admission for any framework.

  **1. Universality vs. Selective Suspension**
  *   **The Conflict:** Strawsonian frameworks rely on the idea that reactive attitudes are a universal, natural framework of human life. However, the caregiving desideratum requires *selective suspension* of these attitudes as a survival strategy.
  *   **The Tension:** If the attitudes are constitutive of seeing someone as a person, suspending them risks objectifying the parent (viewing them purely as a patient/object). If you do not suspend them, you risk moral cruelty (holding them to impossible standards). A theory cannot easily validate the suspension as "moral" without undermining the claim that the attitudes are necessary for moral engagement.

  **2. Epistemic Access vs. Emotional Immediacy**
  *   **The Conflict:** Reactive Opacity requires us to act *as if* there is agency when we lack epistemic access to it. However, a rigorous responsibility condition usually requires knowledge of the agent's mental state.
  *   **The Tension:** To satisfy the need for immediate emotional protection (the caregiver's boundary), the theory must validate reactions based on incomplete data. To satisfy the need for fairness (the parent's dignity), the theory must withhold judgment until etiology is clear. These two temporalities (immediate reaction vs. retrospective judgment) are often incompatible.

  **3. Diachronic Identity vs. Synchronous Capacity**
  *   **The Conflict:** We hold the parent responsible based on who they *were* (diachronic), but they are being judged on who they *are* (synchronous).
  *   **The Tension:** In FTD, the capacity for regard erodes over time. If responsibility tracks current capacity, the parent ceases to be a responsible agent quickly. If responsibility tracks historical identity, we hold a cognitively altered person to standards they can no longer comprehend. A theory struggles to bridge the gap between the "then" of the relationship and the "now" of the pathology without fracturing the concept of the self.

  ---

  ### Scoring Contending Approaches

  Here is a brief assessment of how three standard frameworks score against these desiderata. Note that high scores in one area often necessitate failure in another due to the tensions flagged above.

  **1. Strawson's Naturalism (Constitutive View)**
  *   **Strengths:** Scores high on **Persistence of Intimacy** and **Universality**. It correctly identifies that we cannot simply reason our way out of resentment; it is woven into the fabric of relationship. It validates the emotional reality of the caregiver.
  *   **Weaknesses:** Fails on **Selective Suspension** and **Excuse Asymmetry**. Strawson treats exemptions (like insanity) as objective categories that naturally kill reactive attitudes. It does not account for the *labor* required to suppress attitudes in caregiving, nor does it explain why resentment persists *despite* the exemption being acknowledged. It treats Reactive Opacity as an error rather than a structural feature.
  *   **Verdict:** Phenomenologically accurate but normatively rigid. It describes the trap but offers no exit.

  **2. Reasons-Responsiveness Compatibilism**
  *   **Strengths:** Scores high on **Excuse Asymmetry** and **Diachronic Identity**. It offers a granular scale of capacity (how responsive is the agent to reasons *now*?). It allows for a nuanced distinction between total incapacity and partial erosion.
  *   **Weaknesses:** Fails on **Emotional Immediacy** and **Intimacy Persistence**. It is too cognitive. It assumes that once we identify a lack of reasons-responsiveness, the reactive attitude *should* vanish. It cannot explain the "lag" of resentment in intimate bonds. It treats Reactive Opacity as a failure of information gathering rather than a relational stance.
  *   **Verdict:** Metaphysically precise but emotionally sterile. It solves the puzzle of the mind but ignores the pain of the relationship.

  **3. Revisionist / Evolutionary Instrumentalism**
  *   **Strengths:** Scores high on **Selective Suspension** and **Reactive Opacity**. It views attitudes as tools/heuristics. Therefore, if suspending the tool helps the caregiving dynamic, we are justified in doing so. It treats opacity as a functional heuristic (assume agency to maintain order) rather than a truth claim.
  *   **Weaknesses:** Fails on **Constitutivity** (by definition). It treats attitudes as instrumental, violating your core constraint. It risks objectifying the parent by making their moral status contingent on what is useful for the caregiver. It dissolves the **Universality** claim by making responsibility a matter of policy rather than engagement.
  *   **Verdict:** Pragmatically useful but morally hollow. It offers a survival guide but denies the depth of the betrayal you feel.

  ### Conclusion on Architecture

  The central architectural failure of existing theories in this context is the assumption that *explanation* leads to *exemption*. In the caregiving context, explanation often leads to *grief*, while the demand for regard (and the resentment when it is not met) remains intact.

  An adequate theory must decouple the *justification* of the reactive attitude from the *metaphysical status* of the agent. It must allow for a "provisional responsibility" where the attitude is maintained not because the agent is fully capable, but because the relationship requires it to function, while simultaneously acknowledging the tragedy that the agent may no longer be able to meet that demand. This requires a framework that tolerates the contradiction of holding someone responsible for what they cannot help, not as an error, but as a necessary fiction of love.
