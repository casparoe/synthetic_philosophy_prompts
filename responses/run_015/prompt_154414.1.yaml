prompt: |-
  Having recently assumed primary care for a parent whose frontotemporal dementia has dissolved the social inhibitions that once structured our relationship, I find myself suspended between reactive stances: the resentment that surfaces when familiar harms recur, and the judgment that their source is now neuropathological rather than agential. This personal tension has made Strawson’s framework of reactive attitudes urgently relevant, yet I want to avoid the standard undergraduate summary. Before assessing any particular theory, I need a rigorous specification of what an adequate account of moral responsibility—one that treats reactive attitudes as constitutive rather than merely instrumental—must deliver.

  Write the desiderata: which phenomena the theory must explain, which distinctions it must preserve, and which puzzles it must dissolve, with the motivating case or conceptual tension behind each requirement. Include the asymmetry between conditions that fully excuse (eliminating reactive attitudes) and those that only weaken them; the persistence of resentment in intimate relationships even after causal explanation is complete; and the difference between reactive attitudes directed at an agent versus those directed at an agent’s actions. Additionally, introduce and accommodate what I will call reactive opacity: situations in which an observer maintains a reactive attitude despite knowing that the causal etiology of the harm is ambiguous or inaccessible—must a theory treat this preservation as rational, heuristic, or erroneous?

  Then flag any pairs of desiderata that appear jointly unsatisfiable—particularly between accounting for the universality of reactive practices and accommodating the selective suspension that long-term caregiving reveals. Briefly score three contending approaches against your list: Strawson’s own view, a compatibilist revision centered on reasons-responsiveness, and a revisionist position that regards reactive attitudes as evolutionary artifacts appropriate for redesign rather than justification. Keep the weight on the criteria and their internal tensions rather than on the scoring. Do not include bibliographies, reading lists, or citations; I am interested in the conceptual architecture, not in mapping the literature.
