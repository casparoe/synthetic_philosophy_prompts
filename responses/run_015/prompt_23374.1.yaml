      *   **Define "Uncountable" formally:** What does ZFC actually mean by "uncountable"?
          *   It means: $\neg \exists f (f \text{ is a function} \land \text{domain}(f)=\mathbb{N} \land \text{range}(f)=\mathbb{R} \land f \text{ is bijective})$.
          *   Crucially, the quantifier $\exists f$ ranges only over elements *inside the model*.
      *   **Explain the "Missing Bijection":**
          *   From the outside, we see a bijection $g: \mathbb{N} \to \mathbb{R}^M$.
          *   Why isn't $g$ inside $M$?
