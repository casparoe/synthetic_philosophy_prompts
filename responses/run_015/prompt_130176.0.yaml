answer: |-
  The first pattern is **Lexical Intransitivity** sustained by Sorites vagueness, while the second is **Distributive Convexity** driven by concentration aversion; they are distinct structural violations of additive utility, though they often co-occur in intuitive moral reasoning.

  The first pattern is best described as the claim that **no amount of the mild harm could ever outweigh the severe one** (Lexical Priority), but this claim is psychologically sustained by the **blurry boundary** of the Sorites Paradox. Respondents assert a categorical discontinuity (torture is in a different moral category than specks), yet their acceptance of adjacent trade-offs reveals they cannot locate the discontinuity. This distinguishes the phenomenon from pure **Epistemic Vagueness**, where one would admit uncertainty about the cutoff, and from consistent **Lexical Utility**, where one would deny the adjacent trade-offs to maintain logical consistency. The nearest established concept is **Non-Archimedean Value**, but the observed pattern is specifically **Intransitive Lexicality**: the user violates transitivity by accepting $A > B$, $B > C$... but denying $A > Z$ across the chain. I coin the term **The Lexical Sorites** to capture this specific inconsistency where a lexical claim is defended via vague increments.

  The second pattern is a separate phenomenon best described as **Harm Convexity**, where the moral disutility of harm increases faster than the physical quantity of harm when concentrated on a single subject. This is distinct from the first pattern because one can consistently believe specks aggregate to outweigh torture (rejecting Pattern 1) while still preferring distributed specks over concentrated ones (accepting Pattern 2) due to diminishing marginal welfare or fairness concerns. The nearest concept is **Prioritarianism**, which weights harms to the worse-off more heavily, but Pattern 2 is broader: it applies even when welfare levels are identical, driven by an intuition that **Separateness of Persons** buffers aggregated harm. I coin the term **Concentration Aversion** to describe the specific intuition that spreading a fixed total of harm reduces its moral weight independent of aggregation limits.

  These patterns differ fundamentally in their violation of aggregation: Pattern 1 denies aggregation across qualitative thresholds, while Pattern 2 accepts aggregation but weights it non-linearly based on distribution. Pattern 1 is a failure of **Archimedean consistency**; Pattern 2 is a failure of **Linearity**. They are not the same phenomenon in different guises because a respondent can logically hold Pattern 2 without Pattern 1 (believing enough specks equal torture, but still preferring them spread), whereas holding Pattern 1 usually necessitates Pattern 2 (if specks never equal torture, concentrated specks are still worse than distributed ones if concentration creates a new category of harm).

  I would abandon the claim that **Pattern 2 is entirely distinct from Pattern 1** first. If presented with a case where respondents admit that distributed harms individually exceed their threshold of notice yet still rank the distributed scenario as morally negligible compared to the concentrated one, it would suggest both patterns stem from a single **Threshold Nullity** model (where harm below a certain intensity counts as zero). In such a case, Pattern 2 would collapse into Pattern 1, as the distributed harms would be treated as non-existent per person, while the concentrated harm exceeds the threshold for the victim.
