prompt: |-
  I'm the graduate TA for an upper-level seminar on philosophy of cognitive science — 18 students, mostly philosophy majors with a few psychology and linguistics students in the mix, one 90-minute session in a room with no screens. We've just finished the week on the extended mind: Andy Clark and David Chalmers's 1998 paper "The Extended Mind," the Otto/Inga case, active externalism, and the cluster of conditions they use — roughly, that the resource is constantly and easily available, that what it says is automatically endorsed rather than weighed, and that it has been taken up and trusted over time. Last term I tried a version of this that was just a memory task done first unaided and then with notes, and it taught nobody anything: everyone shrugged, said the notebook obviously isn't part of them, and a psychology major pointed out that all I'd measured was how much people like their own notes. I want a real activity this time. What participants should come away seeing is not that external aids help cognition (nobody denies that) but that the live question is which marks turn reliance into constitution, and that the marks in that standard cluster don't travel together: a resource can be one thing on one test and the opposite on another.

  The idea I want staged is something I've been calling the three tests, and I'd like the game built so that students generate cases where they come apart rather than being told that they do. The substitution test: give a participant the same information they encoded, but in a stranger's notation, or in their own notation re-copied by someone else, or as an objectively better and more complete card than theirs — the question is whether the resource still guides them in the same way, and whether "it isn't mine" is doing the work or "it isn't good" is. The tampering test: return their own card with two or three entries silently altered in their own handwriting, and see whether the resulting error is owned ("I was wrong") or externalised ("my card was changed"). The friction test: keep the card but tax it — a retrieval delay, a cost in points per consultation, a partial or scrambled version — and see whether degrading the coupling degrades the sense that the belief was theirs. I want at least one condition that functions as a control against the "you just like your notes" objection, ideally one where sentiment and integration point in opposite directions. Practical constraints: ordinary classroom materials and paper only, no phones or laptops; a clear timeline across the 90 minutes with a build phase in which participants construct their own aid from scratch and can't bring anything in; roles for a few students as registrars who record answer latency, confidence and error-attribution so we have something to debrief with; a points payoff rather than money, with some way for participants to stake confidence so that endorsement strength is measured and not just accuracy; and no upfront lecture, with the words "extended," "parity," "constitution" and "coupled system" not uttered until after the final phase. Since the tampering phase involves deceiving participants, tell me how to handle that properly — what to say beforehand, and how the reveal is folded into the debrief.

  Give me the full runnable package: rules, materials and setup, the timeline with minute marks, the payoff scheme, the assignable roles, and a debrief that maps specific moments onto specific parts of the thesis and its critics — including the objection that causal coupling to an external resource isn't the same as that resource being part of a cognitive system, and the worry that if notebooks and diaries count, there is no principled place to stop before address books, smartphones and the internet. Be honest about what will predictably go wrong the first time I run it and how to recover, and be frank about which feature of the dispute the activity cannot reproduce and I'll have to supply in discussion myself. Where you're designing under uncertainty, say so: give me the one design choice you're least confident about and the observation during the session that should make me abandon it mid-run and fall back to open discussion, and flag the premise the whole activity rests on — something like the assumption that how people attribute error and ownership is evidence about what their minds are made of — together with what happens to the exercise if that premise is false.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level seminar on Philosophy of Cognitive Science (18 students, mix of Phil/Psych/Ling). 90 minutes. No screens.
      *   **Topic:** Extended Mind Thesis (EMT), specifically Clark & Chalmers (1998). Focus on the *criteria* for extension (availability, endorsement, trust) and the *boundary problem* (coupling vs. constitution).
      *   **Goal:** Move beyond "external aids help" to "when does reliance become constitution?" specifically showing that the criteria (the "cluster") don't always travel together.
      *   **Core Mechanism:** "The Three Tests" (Substitution, Tampering, Friction). Students must generate cases where these tests diverge.
      *   **Constraints:** Paper only. No upfront theory terms ("extended," "parity," etc.) until debrief. Needs a control against "you just like your notes." Needs a points/confidence payoff system. Needs roles (registrars). Needs ethical handling of deception (Tampering test).
      *   **Deliverables:** Full runnable package (rules, materials, timeline, payoff, roles, debrief, troubleshooting, limitations, design uncertainty, underlying premise).

  2.  **Deconstruct the Core Mechanism (The Three Tests):**

      *   *Build Phase:* Students need to create a cognitive aid (a "memory card") for a specific task.
      *   *Task:* Needs to be hard enough to require the aid, but simple enough to grade quickly. A list of paired associates (word-number or symbol-meaning) works well for paper. Let's go with a fictional "alien lexicon" or code-breaking task to minimize prior knowledge effects.
      *   *Substitution Test:* Swap their card for someone else's (or a "cleaner" version). Does performance/ownership drop?
      *   *Tampering Test:* Alter their card secretly. Do they blame the card or themselves?
      *   *Friction Test:* Add cost/delay to using the card. Do they stop using it, or does it feel less "theirs"?
      *   *Control:* Need a condition where they *like* the aid but it fails the tests, or *dislike* it but it passes. The prompt suggests sentiment vs. integration.

  3.  **Ethical Considerations (Deception):**

      *   The Tampering Test involves lying to students about their own work.
      *   *Mitigation:* Informed consent (general), debriefing (specific), option to withdraw data. Since it's a class activity, "deception" is mild (altering a game card), but still needs care.
      *   *Protocol:* Tell them "conditions may vary" without specifying how. Reveal immediately after the phase.

  4.  **Drafting the Plan - Section by Section:**

      *   **Title:** Needs to be neutral. "The Cognitive Aid Protocol."
      *   **Materials:** Index cards, pens, timers, specific worksheets.
      *   **Roles:** 18 students is small enough that everyone participates, but some need to be "Registrars." Let's make it rotating or group-based. Actually, with 18, splitting into 6 groups of 3 works well. One Registrar per group.
      *   **Timeline (90 mins):**
          *   0-10: Setup & Instructions (No theory).
          *   10-25: Build Phase (Encoding).
          *   25-40: Baseline & Friction Test.
          *   40-55: Substitution Test.
          *   55-70: Tampering Test (Deception).
          *   70-90: Debrief & Theory Mapping.
      *   **Payoff:** Points for accuracy + confidence bonus. High confidence + wrong = penalty. This measures *endorsement*.
      *   **The Control:** The prompt asks for a control against "you just like your notes." I need a condition where the note is *objectively better* but *not theirs* (Substitution) vs. *theirs* but *worse*.
      *   **Debrief:** Connect specific reactions to Clark/Chalmers criteria (Trust, Availability, Endorsement) and critics (Adams & Aizawa, "Mark of the Cognitive").

  5.  **Refining the "Three Tests" Implementation:**

      *   *Task:* Learn 20 pairings (e.g., Symbol -> Number).
      *   *Build:* 15 minutes to create a cheat sheet (index card).
      *   *Friction:* Round 1 (Free use), Round 2 (Cost per look).
      *   *Substitution:* Round 3 (Swap cards with a partner).
      *   *Tampering:* Round 4 (Instructor alters card before returning).
      *   *Measurement:* Registrars track: Time to answer, Confidence (1-5), Attribution of Error (Me vs. Card).

  6.  **Addressing the "Control" Requirement:**

      *   The prompt wants sentiment and integration to point in opposite directions.
      *   *Idea:* In the Substitution phase, give them a card that is *neater* and *more complete* than their own (generated by the TA beforehand or a 'model' student). If they perform worse or feel less ownership despite better data, it challenges the "it helps me" argument and supports the "it must be *mine*" argument.
      *   *Alternative:* Have them rate how much they "like" their card before swapping.

  7.  **Addressing the Ethical/Deception Aspect:**

      *   Pre-brief: "Some conditions involve modifications to materials to test robustness."
      *   Post-Tampering: Reveal immediately. "We changed 3 entries."
      *   Debrief: Discuss why the *feeling* of betrayal matters for the philosophy.

  8.  **Troubleshooting & Limitations:**

      *   *Risk:* Students treat it as a game, not a cognitive task. *Fix:* High stakes on points (even if symbolic).
      *   *Risk:* Tampering is noticed too easily. *Fix:* Change ambiguous entries or use a code where errors look like memory slips.
      *   *Risk:* Theory doesn't land. *Fix:* Debrief needs to be Socratic, not lecture.
      *   *Design Uncertainty:* The "Friction" test. If the cost is too high, they just abandon the card. If too low, no effect. *Observation to watch:* If everyone ignores the cost, the test fails.
      *   *Underlying Premise:* Metacognitive attribution (blaming the card vs. self) tracks ontological status (part of mind vs. tool). If this premise is false (people are just bad at attribution), the activity proves nothing about *mind*, only about *excuses*.

  9.  **Writing the Content (Iterative refinement):**

      *   *Tone:* Professional, academic, practical.
      *   *Structure:* Follow the prompt's requested sections exactly.
      *   *Philosophy Check:* Ensure the distinction between *causal coupling* and *constitution* is central to the debrief. Ensure Adams & Aizawa's "Mark of the Cognitive" is mentioned.

  10. **Final Review against Constraints:**
      *   18 students? Yes (6 groups of 3).
      *   No screens? Yes (Paper only).
      *   No theory terms early? Yes.
      *   Payoff scheme? Yes (Confidence weighting).
      *   Deception handling? Yes (Consent/Debrief).
      *   Troubleshooting? Yes.

  11. **Self-Correction on "Tampering":**
      *   Wait, if I (TA) alter the cards, I need to collect them and return them. That takes time.
      *   *Better:* Have the "Registrar" in each group do the alteration based on a sealed envelope instruction. This distributes the labor and makes it faster. But then the Registrar is in on the deception.
      *   *Solution:* The TA collects cards during a "break," alters them quickly (pre-prepared swaps), and returns them. Or, simpler: The Substitution phase *is* the main comparison. The Tampering phase is the TA walking around and swapping a specific card for a "corrupted" version of their own.
      *   *Decision:* To save time and ensure consistency, the TA will prepare "Corrupted Cards" that look like the student's handwriting (hard to fake) OR simply instruct the *partner* to make two specific errors on the card they are about to receive in the Substitution phase.
      *   *Wait, the prompt asks for "return their own card with entries silently altered."* This implies the TA holds the card.
      *   *Logistics:* 18 cards. TA can alter 3 entries on 6 cards (one per group) while students do a filler task. This is manageable. I will specify that only *one* person per group undergoes Tampering to save time and increase impact during debrief.

  12. **Final Polish:** Check the "Control" again. The prompt wants a condition where sentiment and integration oppose.
      *   *Implementation:* In Substitution, give them a "Gold Standard" card (perfect, typed/neat) vs. their own messy one. If they reject the Gold Standard, it shows ownership > quality. If they accept it, it shows quality > ownership. This tests the "Trust/Endorsement" criterion.

  13. **Premise Check:** The activity assumes *error attribution* maps to *cognitive boundaries*. I need to be explicit that if students are just rationalizing, the data is noise.

  14. **Design Uncertainty:** The Friction cost. If points don't matter, they won't feel the friction. I need to make the points matter for the "grade" of the seminar participation.

  (Proceed to generate output based on these thoughts.)
answer: |-
  # Seminar Activity Package: The Cognitive Aid Protocol

  **Course:** Philosophy of Cognitive Science (Upper-Level Seminar)
  **Topic:** The Extended Mind Thesis (Clark & Chalmers, 1998)
  **Duration:** 90 Minutes
  **Participants:** 18 Students (6 Groups of 3)
  **Materials:** Index cards (3x5), pens (black/blue/red), timers (phone or watch), printed worksheets, "Point Ledger" sheets.

  ---

  ## 1. Ethical Protocol & Deception Handling

  Since the **Tampering Test** involves altering a participant's work without their immediate knowledge, you must adhere to the following:

  *   **Pre-Session Consent:** At the start of class, state: *"Today involves a series of cognitive tasks with varying constraints. Some conditions involve modifications to materials or information flow to test robustness. You may opt out of the data collection at any time without penalty, though you are expected to participate in the activity."*
  *   **The Reveal:** The deception is **not** carried through to the end of class. It is revealed immediately after the Tampering Phase (Minute 65).
  *   **Debriefing:** You must explicitly explain *why* the deception was necessary (to test automatic endorsement vs. critical monitoring) and allow students to express feelings of violation. If a student feels genuinely distressed, allow them to withdraw their data from the discussion.
  *   **Data Usage:** Clarify that no data leaves the room; this is for pedagogical demonstration only, not research publication.

  ---

  ## 2. Roles & Setup

  **Group Structure:** Divide the 18 students into **6 Groups of 3**.
  **Roles (Rotate per phase if time permits, otherwise assign for session):**
  1.  **The Agent:** The primary subject whose cognitive boundaries are being tested. (Rotate this role so everyone experiences it once).
  2.  **The Registrar:** Records latency (seconds), confidence (1-5 scale), and error attribution ("Me" vs. "Card").
  3.  **The Interlocutor:** Manages the materials (shuffling cards, enforcing friction costs) and ensures the Agent doesn't cheat.

  **The Task:** "The Xenolinguist Code."
  *   Students must learn 20 pairings of abstract symbols (drawn on board) to numbers (0-9).
  *   *Why:* Eliminates prior knowledge advantages (unlike vocabulary) and requires arbitrary memorization.

  **The Payoff Scheme (The "Endorsement Metric"):**
  *   **Base Points:** +10 for correct answer.
  *   **Confidence Stake:** Before answering, the Agent stakes 1-5 points.
      *   Correct + High Confidence (5): +15 pts.
      *   Correct + Low Confidence (1): +5 pts.
      *   Incorrect + High Confidence (5): **-10 pts** (Penalty for false endorsement).
      *   Incorrect + Low Confidence (1): 0 pts.
  *   **Goal:** Maximize group score. This forces the Agent to only "endorse" information they truly trust (mimicking the *automatic endorsement* criterion).

  ---

  ## 3. Timeline (90 Minutes)

  ### Phase 0: Introduction & Build (00:00 – 00:25)
  *   **00-05:** Instructions. Explain the Xenolinguist Code task. Show the 20 symbols on the board. **Do not use theory terms** (no "mind," "extended," "coupling").
  *   **05-20:** **Build Phase.** Agents have 15 minutes to study the symbols and create **one** 3x5 index card aid. They can write whatever they want, draw maps, abbreviations, etc.
      *   *Constraint:* Only one card. Once the 15 mins are up, the card is sealed. No further study.
  *   **20-25:** **Baseline Calibration.** Agents take a 5-question quiz using their card. No friction. This establishes baseline accuracy and confidence. Registrars record data.

  ### Phase 1: The Friction Test (00:25 – 00:40)
  *   **Goal:** Degrade the coupling to see if the sense of ownership degrades.
  *   **Procedure:** Agents take a 10-question quiz.
  *   **The Tax:** Every time the Agent looks at the card, they lose **5 Points** from the group total. They must announce "Consultation" aloud before looking.
  *   **Measurement:** Registrars track: Did they stop using the card? Did confidence drop when they *did* use it?
  *   **Control Check:** Ask Agents post-phase: "Did the card feel less reliable because it cost points, or did you just use it less?"

  ### Phase 2: The Substitution Test (00:40 – 00:55)
  *   **Goal:** Test if "mineness" matters more than quality.
  *   **Procedure:** Agents swap cards with a partner in a different group.
  *   **Condition A (The Messy Swap):** Swap with a random peer.
  *   **Condition B (The Gold Standard):** For 3 of the groups, the TA provides a "Model Card" that is objectively clearer, more complete, and neater than what the student made.
  *   **Task:** 10-question quiz.
  *   **Measurement:** Compare accuracy and *Confidence Stake*.
      *   *Hypothesis:* If EMT holds (Parity Principle), the Gold Standard should work *better*. If "mineness" is required for constitution, performance/confidence should drop despite better data.
  *   **Debrief Question:** "Was the information on the Gold Standard 'yours' to bet on?"

  ### Phase 3: The Tampering Test (00:55 – 01:05) **[DECEPTION]**
  *   **Goal:** Test automatic endorsement vs. critical monitoring.
  *   **Procedure:** Collect the Agents' *original* cards.
      *   *TA Action:* While students do a 2-minute filler task (discussing the Friction phase), the TA silently alters **3 entries** on the 6 Agents' cards. Use the same ink color. Change a number (e.g., Symbol A = 4 becomes Symbol A = 7).
      *   *Return:* Hand cards back without comment.
  *   **Task:** 5-question quiz. Ensure at least 2 questions rely on the tampered entries.
  *   **Measurement:** When they get it wrong, who do they blame?
      *   *Internal:* "I must have written it wrong." / "I misremembered."
      *   *External:* "The card is wrong." / "Something changed."
  *   **01:05:** **THE REVEAL.** Stop the class. Announce the alteration. Ask for immediate reactions.

  ### Phase 4: The Debrief & Theory Mapping (01:05 – 01:30)
  *   **01:05-01:15:** Emotional & Data Processing. How did it feel to be tampered with? Review the Registrar data on the board.
  *   **01:15-01:30:** Philosophical Mapping (See Section 5).

  ---

  ## 4. Materials & Handouts

  **A. Registrar Sheet**
  | Phase | Q# | Correct? (Y/N) | Confidence Stake (1-5) | Latency (sec) | Error Attribution (Me / Card / Ambiguous) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Friction | 1 | | | | |
  | Sub | 1 | | | | |
  | Tamper | 1 | | | | |

  **B. Point Ledger**
  *   Track Group Total.
  *   Apply "Consultation Tax" visibly.

  **C. The Xenolinguist Code (Board Work)**
  *   Prepare 20 distinct glyphs on the whiteboard beforehand.
  *   Assign them random numbers 0-9 (some repeats).

  ---

  ## 5. The Debrief: Mapping Moments to Theory

  Do not lecture. Use the Socratic method to draw the theory out of their experience.

  **1. The Friction Test -> *Availability & Coupling***
  *   *Ask:* "When the cost went up, did the card stop being part of your mind, or did you just choose not to use your mind?"
  *   *Theory:* Clark & Chalmers require "easy availability." If a small cost breaks the integration, was it ever truly *constitutive*, or just *causally coupled*?
  *   *Critique:* Adams & Aizawa (The Mark of the Cognitive). They argue coupling is not constitution. Just because you *can* access it doesn't mean it's *in* the cognitive system. The Friction Test shows how fragile that coupling is.

  **2. The Substitution Test -> *Trust & Endorsement***
  *   *Ask:* "Who got the Gold Standard card? Did you bet high confidence on it? Why or why not?"
  *   *Theory:* C&C require "automatic endorsement." If you hesitate to bet points on the Gold Standard, it fails the endorsement criterion.
  *   *The Cluster Problem:* Highlight if anyone had a card that was *available* (Friction passed) but not *endorsed* (Substitution failed). This proves the criteria don't travel together.
  *   *Critique:* The "Cognitive Bloat" objection. If we count the Gold Standard as part of the mind because it's reliable, where does it stop? Google? Libraries? The activity shows why we intuitively draw a line at "mine."

  **3. The Tampering Test -> *The Boundary of Self***
  *   *Ask:* "When you got the wrong answer, did you feel stupid, or did you feel violated?"
  *   *Theory:* If the notebook is part of the mind, an error in the notebook should feel like a memory error (internal). If it feels like sabotage (external), the notebook is a tool, not a tissue.
  *   *The Control:* If someone said "I knew that card looked weird" (Critical Monitoring), they never integrated it. If someone said "I thought I was going crazy" (Automatic Endorsement), they treated it as internal.
  *   *Critique:* This addresses the "You just like your notes" objection from last term. Sentiment (liking) is different from Integration (betting points). If they bet high on their messy card but low on the Gold Standard, it's not sentiment; it's epistemic trust.

  ---

  ## 6. Troubleshooting & Recovery

  **Predictable Failure 1: The Friction Tax is Ignored.**
  *   *Symptom:* Students keep looking at the card despite the point cost.
  *   *Cause:* Points feel abstract.
  *   *Recovery:* Pause. Remind them the top group gets a tangible reward (e.g., choice of next week's topic, or actual candy). Or, increase the tax to "One look = One minute added to total time."
  *   *Philosophical Pivot:* If they ignore the cost, argue that the coupling is *too strong*. The resource has become transparent. This actually supports EMT.

  **Predictable Failure 2: Tampering is Noticed Immediately.**
  *   *Symptom:* Student says "Hey, I wrote 4 here, not 7."
  *   *Cause:* Handwriting recognition is robust.
  *   *Recovery:* Acknowledge it. "You monitored the resource. That means it wasn't fully transparent. It remained a tool." This is still data for the debrief (failure of transparency).
  *   *Prevention:* Alter entries that are ambiguous or use a red pen for a tiny dot that changes a 0 to an 8.

  **Predictable Failure 3: The "It's Just a Game" Objection.**
  *   *Symptom:* Students laugh off the error attribution.
  *   *Recovery:* Press on the Confidence Stake. "You lost 10 points for betting on that card. Did that loss feel like losing your own memory, or like losing a bet on a horse?"

  ---

  ## 7. Design Uncertainty & Limitations

  **The Design Choice I'm Least Confident About:**
  *   **The Friction Cost.** It is difficult to calibrate a point cost that feels "cognitive" rather than "economic." If the cost is too low, it's noise. If too high, it becomes a strategy game rather than a cognitive test.
  *   **Observation to Abandon:** If, during the Friction phase, students start calculating expected value ("It's worth 10 points to get it right, but costs 5 to look, so I'll guess"), **stop the phase**. The task has shifted from *memory retrieval* to *risk assessment*.
  *   **Fallback:** Pivot immediately to discussion: "Why did you switch to risk assessment? Does the mind switch modes when resources are taxed?"

  **The Underlying Premise:**
  *   **Premise:** *Metacognitive Attribution tracks Ontological Status.* (i.e., Where you place the blame for error indicates where you believe the boundary of your mind lies).
  *   **If False:** If students are simply rationalizing post-hoc to save face (e.g., blaming the card to avoid looking stupid), the activity measures *social excuse-making*, not *cognitive boundaries*.
  *   **Contingency:** In the debrief, admit this limitation. "If you were just making excuses, then the Extended Mind Thesis might be true, but this test can't prove it because our introspection is unreliable." This turns a failure of the activity into a success for the philosophy (the problem of introspection).

  **What This Activity Cannot Reproduce:**
  *   **The Long-Term Integration:** C&C talk about resources used over *time* (Otto's notebook for years). This is a 90-minute simulation. You cannot replicate the deep neural plasticity that might accompany long-term extension.
  *   **Your Job:** You must supply this in the discussion. "You felt the card was 'yours' after 15 minutes. Imagine 15 years. Does the feeling solidify, or does it always remain 'tool'?"

  ---

  ## 8. Instructor Cheat Sheet (Theory Terms to Unlock Post-Game)

  *   **Parity Principle:** "If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is... part of the cognitive process." (Use Substitution Test data).
  *   **Cognitive Bloat:** "If Otto's notebook is part of his mind, is the library? Is the Internet?" (Use Friction/Gold Standard data).
  *   **The Mark of the Cognitive (Adams & Aizawa):** "Intrinsic non-derived content." The notebook has derived content; the brain has non-derived. (Use Tampering data—did they treat the content as derived/external?).
  *   **Transparency:** "When the tool withdraws from attention." (Use Friction data—did the card disappear, or did it remain an object?).
