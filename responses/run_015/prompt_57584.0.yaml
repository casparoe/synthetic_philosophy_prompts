          3.  Identify which of the original nine verdicts the principle *cannot* accommodate and which is cheapest to abandon (specifically addressing Case 5).
          4.  Reconcile Case 3 (possible normal explanation defeats anomaly) vs. Case 7 (post-hoc hypothesis doesn't count, predictive failure does).
          5.  Address the Sidgwick distinction: Does the principle license inference from "information channel among living" to "survival of death"? If not, what's missing?
      *   **Constraint:** No references/reading lists. Focus on reasoning.

  2.  **Evaluate the User's Tentative Principle:**
      *   *Principle:* "Evidence $\propto$ Pressure to yield null result" (Security of record against bias/fraud).
      *   *Fit with Cases:*
          *   Case 1 vs. 2 (Paperwork): Fits. Case 2 has higher security against memory reconstruction.
          *   Case 3 vs. 4 (Medium vs. Card Guessing): Fits. Case 4 (second series) has high security (hostile investigator, sealed records). Case 3 has low security (leakage possible).
          *   Case 5 (Aggregate vs. Individual): *Problematic.* The "pressure" on the individual respondent is the same in both descriptions. The difference is statistical power vs. individual reliability. The principle focuses on *record integrity*, not *statistical aggregation*.
          *   Case 6 (Believers vs. Skeptics): Fits. Skeptics provide higher pressure for null.
          *   Case 7 (Post-hoc vs. Predictive): *Problematic.* This is about *explanatory power*, not record security. The principle doesn't explicitly cover hypothesis testing, only data generation.
          *   Case 8 (Decay under controls): Fits. Controls increase pressure for null.
          *   Case 9 (Accidental Discovery): Fits. No incentive to fake, low pressure to find effect.

      *   *Diagnosis:* The tentative principle is strong on *procedural security* (Cases 1, 2, 4, 6, 8, 9) but weak on *statistical aggregation* (Case 5) and *hypothesis testing* (Case 3 vs. 7). It needs expansion to cover the epistemic weight of *explanation* and *aggregation*.

  3.  **Drafting the Principle (Task 1):**
      *   Can a single sentence do it? Probably not. The user suspects they need clauses.
      *   I need to formalize the "Pressure for Null" idea but add the statistical and explanatory dimensions.
      *   *Core:* Security of the Record.
      *   *Addition 1:* Statistical Aggregation (The Law of Large Numbers overrides individual unreliability).
      *   *Addition 2:* Explanatory Risk (A hypothesis must risk falsification to count; mere possibility of fraud is not enough unless it undermines record security).
      *   *Refinement:* Let's try to unify them under "Epistemic Risk." The evidence is strong if the *process* risked failing to produce the data (security) AND the *explanation* risks being falsified (predictivity).
      *   *Decision:* An ordered set of clauses is more precise and honest, as requested.
      *   *Clause 1 (Record Security):* Evidential weight is proportional to the independence of the record from the observer's desire for the result. (Covers 1, 2, 4, 6, 8, 9).
      *   *Clause 2 (Statistical Aggregation):* Individual unreliability can be overridden by aggregate deviation from chance, provided the aggregation method is blind to individual selection bias. (Covers 5).
      *   *Clause 3 (Explanatory Risk):* A normal explanation defeats an anomaly only if it is independently testable or structurally necessary given the record security; mere logical possibility is insufficient. (Reconciles 3 & 7).

  4.  **Applying to New Cases (Task 2):**
      *   *(a) Operator-sensitive, airtight fraud protocol, no external check:*
          *   Clause 1 says record security is high (fraud prevented).
          *   But is there "pressure for null"? If only she can read it, self-deception is the vector.
          *   Verdict: Weak. The "pressure" applies to fraud, not subconscious bias.
      *   *(b) Single sealed envelope, hostile committee:*
          *   Clause 1: High security.
          *   Clause 2: Sample size 1.
          *   Verdict: Intriguing but statistically negligible. High procedural weight, low statistical weight.
      *   *(c) Vast messy retrospective data, mundane explanation known but rate enormous:*
          *   Clause 1: High security (no stake).
          *   Clause 2: Aggregate data.
          *   Clause 3: Mundane explanation exists.
          *   Verdict: Stronger than (b). The "enormous rate" might overcome the mundane explanation if the mundane explanation doesn't predict *that* magnitude. This tests Clause 3.

  5.  **Identifying Inconsistencies (Task 3):**
      *   *Case 5 (The Aggregate Paradox):* The user's tentative principle (Record Security) *cannot* explain why the aggregate counts but the individual doesn't. The security of the individual record is identical in both views.
      *   *Resolution:* You must adopt Clause 2 (Statistical Aggregation).
      *   *Cheapest to Abandon:* The intuition that the *individual* case is worth "nothing." It should be "negligible" but not zero. However, the real tension is between "Individual = 0" and "Sum of Individuals > 0." Mathematically, if $E(individual) = 0$, then $\sum E = 0$. So, strictly speaking, Case 5's verdict on the *individual* must be abandoned or qualified. The individual case is *data*, just not *proof*.
      *   *Can Case 5 be saved?* Yes, by distinguishing *probative value* (proof) from *data value* (input for aggregation). The individual report is valid data *only* when aggregated.

  6.  **Reconciling Cases 3 & 7 (Task 4):**
      *   *Case 3:* Possible leakage defeats strong result.
      *   *Case 7:* Post-hoc hypothesis doesn't defeat strong result; predictive failure does.
      *   *Tension:* Why does "possible leakage" (post-hoc possibility) count in 3, but "post-hoc hypothesis" not count in 7?
      *   *Distinction:* In Case 3, the possibility implies a *breach in Record Security* (Clause 1). In Case 7, the hypothesis is about *causal mechanism*, not record integrity.
      *   *Resolution:* Possibility of fraud/leakage attacks the *existence of the datum*. Post-hoc causal explanation attacks the *interpretation of the datum*. You must secure the datum before interpreting it.
      *   *Standard to Drop:* Drop the idea that "mere possibility" defeats Case 3 *unless* that possibility points to a specific vulnerability in the protocol. If the protocol was airtight, "possible leakage" is just a post-hoc hypothesis (Case 7). So, Case 3's verdict needs tightening: "Leakage remains possible *given the protocol*" defeats the case. "Leakage is logically possible" does not.

  7.  **Sidgwick's Distinction (Task 5):**
      *   *Telepathy (Living) vs. Survival (Dead):*
