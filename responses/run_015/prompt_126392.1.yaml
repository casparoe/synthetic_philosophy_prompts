  You are a professional philosopher of science with particular expertise in the history of mathematics and evolutionary biology. Before you begin writing, please take a moment to think carefully, and start with a brief period of internal brainstorming about the conceptual tensions between historical inevitability and individual credit.

  Please describe the most important implications of simultaneous invention—above all the parallel emergence of calculus through Newton and Leibniz and of natural selection through Darwin and Wallace—for whether scientific discoveries are historically inevitable once background conditions are ripe, and for whether it genuinely matters which particular researcher receives priority. Apply these implications to the present-day context in which distributed global collaborations, open preprint servers, and large interdisciplinary teams have made near-simultaneous independent discovery an ordinary occurrence rather than an exceptional one. In particular, address how this shift should affect our norms of attribution, the emotional and institutional weight of being first, and the moral significance we assign to individual genius when convergence is structurally common.

