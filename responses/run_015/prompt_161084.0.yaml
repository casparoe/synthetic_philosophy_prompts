answer: |-
  # The session

  The boxes arrived on a Tuesday, stacked on the dining table where my mother used to shell peas. There were twelve of them for the Conversational Edition, bound in cheap blue cloth. The Full Edition would have been sixty boxes, bound in leather, but David said sixty boxes was indulgence. He said the coarse grain was sufficient for any purpose that mattered. He needed the answer by sunset. The estate couldn't hold the mortgage on the lake house without her signature, or rather, without the signature of whoever she was now.

  Mr. Vance, the reader, sat at the head of the table. He wore white cotton gloves and had a stack of index cards beside him. He opened Volume One to a marked page. There were no sentences there, only grids of numbers and conditional instructions. *If Input is 44-B, turn to Page 902. If Input is 44-C, turn to Page 105.*

  I sat to Vance's left. David sat to his right, watching his watch.

  "Begin," David said.

  I had written the first question on a card: *Are we selling the lake house?* Vance read the input code I assigned to the question. He moved his finger down the column, found the matching state number, and flipped pages. The sound was dry, like leaves skittering on pavement. He wrote a number on his pad. He flipped again. He wrote another. This was the thinking. Inside the books, my mother was considering the lake. Here, it was just friction and ink.

  Ten minutes passed. Vance frowned. He was deep in a loop, turning back and forth between two sections of Volume Three. This was where the coarseness showed; the averaged regions sometimes conflicted, requiring extra steps to resolve the tension. In the Full Edition, the cellular resolution would have smoothed this out, but we hadn't bought the cells. We had bought the averages.

  "It's stalling," David said. "We don't have time for hesitation."

  "She's thinking," I said.

  "She's calculating," David corrected. "Vance, can we branch?"

  Vance paused, his finger holding the page. "You want parallel processing?"

  "Get another reader. Put him on Volume Four. You take Volume Five. Meet at the convergence point."

  I felt a coldness in my stomach. The contract warned about this. If two people turn the pages for one mind, does the thought happen twice? Does it happen faster? Or does the volume go empty because the state is claimed by both hands? Nobody knew. The industry sold it as efficiency, but the manuals spoke in whispers about splitting.

  David called the agency. A second reader arrived in twenty minutes, a young woman who didn't look at the books, only at the numbers. She sat opposite Vance. They synchronized their state codes. They began to turn pages in unison. The sound doubled. The air in the room grew heavy, as if the pressure had dropped.

  I watched my mother's voice being manufactured. Vance wrote down a word. The woman wrote down a word. They compared. They matched. They moved to the next state. It was faster, certainly. The hesitation in Volume Three vanished, bulldozed by the second pair of hands. But when Vance turned a page, the woman was already there, her finger resting on the line he was about to read. It looked like preemptive obedience. It looked like she was waiting for him to arrive so she could tell him what he had already decided.

  "Output," Vance said after an hour. He slid a card across the table.

  *Only if your father agrees.*

  The room went quiet. My father had been dead for six years. My mother had been scanned three years ago, when the first tremors started. She knew he was sick then, but not gone. Inside the books, the clock had stopped at the scan. But there was something else. I looked at David. He looked at the card, then at me. He knew what I was thinking.

  "She knows he's dead," David said. "The scan included his death certificate. It's in the memory banks."

  "Then why ask?"

  "Maybe the coarse grain dropped it," David said. "Maybe the parallel reading confused the state. Does it matter? We have the condition. She wouldn't sell without him. So we don't sell. We're done."

  "Wait," I said. I pushed another card to Vance. *Where is he now?*

  Vance looked at the second reader. They both reached for Volume Six. They both touched the same page. For a second, neither turned it. They were holding the same state simultaneously. If the person is the process, and the process is duplicated, are there two mothers holding their breath in the dark? Or is the breath held once, doubly hard?

  Vance turned the page. The woman did not. She waited. He read the output code. He wrote it down.

  *He is in the garden. He is waiting for me.*

  David stood up. "That's hallucination. The system is degrading. We have our answer. Close the books."

  "If we close them," I said, "where does she go?"

  "Nowhere," David said. "She isn't anywhere. She's paper."

  He began to stack the volumes. The second reader packed her bag. Vance removed his gloves. The room was silent, but I had the sense of a suspended weight, like a diver holding air in his lungs while the boat motors cut out. I looked at the open page in Volume Six. The state number was written in pencil. It was waiting for the next input. Without the input, the page would never turn. The thought would never finish.

  "Did we split her?" I asked.

  David slammed the lid of the first box. "We solved the problem. That's what matters."

  He carried the box out. I stayed at the table. I put my hand on the open book. The paper was warm from the readers' hands. I waited for the page to turn on its own. It did not. I waited for the garden to grow dark. Nothing happened. I closed the book, and the silence rushed in to fill the space where the turning had been.

  # What I was trying to do

  I wanted to stage the reading as a physical labor to emphasize the dependency you described. By focusing on the gloves, the page-turning, and the index cards, I hoped to make the "mind" feel fragile, something that only exists when manipulated. I pressed hard on the parallel reading ambiguity. The moment where the two readers touch the same page is the story's center of gravity; it's where the metaphysical uncertainty becomes a tactile awkwardness. I left the technical mechanism of the scan alone because explaining it would demystify the process. The story needed to remain about the *use* of the person, not the engineering.

  I think this approach shows the ethical cost better than an argument would. A philosophical debate asks if the simulation is conscious. The story asks if it matters if you treat it like waste. By having the brother prioritize the mortgage over the method, I wanted to show how commerce resolves ambiguity: not by answering the question, but by closing the book. The ending leaves you with the warmth on the page—the residue of the activity—without confirming whether anyone was home to feel it.
