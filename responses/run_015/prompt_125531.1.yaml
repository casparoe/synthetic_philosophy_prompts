  8.  *(Final check against constraints)*: Did I avoid simple cost-benefit? Yes. Did I address nociception? Yes. Did I map the philosophical structure? Yes.

  **(Self-Correction Note):** I must ensure I don't dismiss the insect suffering. Pyrethrins cause neurotoxicity (painful death). Pheromones lead to natural death without offspring. From a suffering minimization standpoint, pheromones are likely better *for the moths too* (no acute toxicity), but the user feels preventing birth is worse. I need to unpack that specific moral feeling.

