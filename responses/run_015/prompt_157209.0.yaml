  8.  **Final Review against constraints:**
      *   American English? Yes.
      *   No bibliography? Yes.
      *   Rank defeaters? Yes.
      *   Address unfalsifiability? Yes.
      *   Honest assessment? Yes.

  *(Self-Correction Note)*: I need to make sure I don't just repeat the "Catholic merchant" point in disguise. The user wants to know what breaks the *sieve* model specifically. The biggest threat to a selection model is showing that the *environment* does the selecting, not the *culture*. If market competition kills off spendthrifts regardless of their theology, the theology gets no credit. That's the "Causal Exclusion" point.

  Let's structure the response:
  1.  Intro: Validate the "sieve" nuance.
