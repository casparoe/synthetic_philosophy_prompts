answer: |-
  You have correctly identified the "conceptual slide," and your intuition that standard explainers obscure the real friction point is spot-on. The confusion isn't about time (past vs. present); it's about **normativity**.

  Here is the definite stance you asked for: The etiological and causal-role accounts are **competing** definitions of function, not complementary descriptions. They are incompatible because they disagree on whether "function" implies a standard of correctness (i.e., the possibility of malfunction). For engineered biology, the **Etiological Account (modified for intentional design)** is the only framework that holds up. The Causal-Role account fails because it cannot distinguish between what a system *does* and what it is *supposed to do*.

  Here is the breakdown of the fault line and why the etiological view wins for your synthetic case.

  ### 1. The Conceptual Fault Line: Capacity vs. Normativity
  You suspected the debate might just be "origins vs. mechanisms." That is the surface-level distinction, but it's not the philosophical fault line.
  *   **Causal-Role (Cummins)** defines function as **capacity**. It asks: "What contribution does this trait make to the containing system's current behavior?"
  *   **Etiological (Wright)** defines function as **normative status**. It asks: "What is this trait *supposed* to do based on why it is here?"

  The conflict arises when a trait does something *other* than what it is there for.
  *   **Cummins:** If a heart fibrillates, it is causally contributing to the system by moving blood turbulently and making noise. Therefore, fibrillation is a "function" in the causal-role sense. Cummins struggles to call this a *malfunction* without smuggling in a goal that isn't in his definition.
  *   **Wright:** If a heart fibrillates, it is failing to do what it was selected for (pumping blood efficiently). Therefore, it is malfunctioning. The "function" remains pumping blood, even if the trait isn't currently doing it.

  This is why they are competing. If you adopt Cummins, "function" is descriptive and value-neutral. If you adopt Wright, "function" is inherently teleological and normative. You cannot have it both ways without changing the meaning of the word mid-sentence.

  ### 2. The Synthetic Gene Case
  Let's apply this to your engineered bacterium.
  *   **The Setup:** A synthetic gene replaces a native gene. It maintains homeostasis. It has zero natural selection history.
  *   **Causal-Role Verdict:** The gene has a function. It is currently contributing to the system's capacity for homeostasis.
  *   **Strict Naturalistic Etiological Verdict:** The gene has **no function**. It was not selected by natural selection in this lineage. It is merely a lucky accident or a tool.

  This is where most explainers stop. But here is the crucial move for engineered biology: **You must broaden the Etiological Account to include *Design History*.**

  In synthetic biology, the "selection" is not natural; it is **intentional**. The gene exists in the bacterium *because* an engineer selected it to perform a specific task. That design intent creates a normative standard just as robust as natural selection.
  *   If the synthetic gene mutates and stops maintaining homeostasis, we say it has "lost function."
  *   If we use the Causal-Role account, the mutated gene still has a function (e.g., producing a toxic byproduct). We lose the ability to say it is *broken*.
  *   If we use the Design-Etiological account, the function is fixed by the design intent. The mutation is a malfunction because it deviates from the history of its insertion (the engineer's selection).

  ### 3. Why Causal-Role Fails for Engineered Biology
  You asked which framework holds up. For engineered systems, Causal-Role is insufficient because engineering is inherently teleological.

  When you engineer a gene, you are not just observing a system; you are imposing a purpose. If you rely on Cummins, you collapse the distinction between **function** and **side effect**.
  *   *Example:* Your synthetic gene produces a therapeutic protein (Function) but also slightly slows cell division (Side Effect).
  *   *Cummins:* Both are causal contributions. Both are "functions" relative to different system capacities. This is analytically true but pragmatically useless for an engineer.
  *   *Etiological (Design):* The function is producing the protein (that's why it was inserted). The slowed division is a side effect (not why it was inserted).

  If you use Causal-Role, you cannot prioritize troubleshooting. If the system fails, Cummins forces you to treat all causal contributions as equal until you arbitrarily decide which one matters. Etiology gives you the hierarchy immediately: the function is what was selected/designed for; everything else is noise or cost.

  ### 4. The Verdict
  The "slide" you sensed is the move from **"X does Y"** (Causal) to **"X is for Y"** (Etiological). These are not compatible truths; they are different logical categories.

  For your work in engineered biology, you should adopt the **Etiological Account**, but you must explicitly define the "etiology" as **Design Selection** rather than Natural Selection.

  **Why?**
  1.  **Malfunction:** It allows you to meaningfully talk about broken parts. A synthetic gene that fails to express is "malfunctioning," not just "doing something else."
  2.  **Hierarchy:** It distinguishes intended function from emergent side effects, which is critical for safety and efficacy in synthetic systems.
  3.  **Continuity:** It treats the synthetic gene as functionally equivalent to the native gene it replaced. Both exist *for* a purpose (one via evolution, one via engineering). To say the native gene has a "function" but the synthetic one only has a "causal role" creates an artificial dualism that hinders analysis.

  **Conclusion:**
  Don't treat them as complementary lenses. Treat them as rival claims about normativity. In synthetic biology, purpose is real (because you put it there), so the framework that captures purpose (Etiological) is the correct one. The Causal-Role account is a description of *mechanism*, not *function*. Use it to explain *how* the gene works, but use the Design-Etiological account to explain *what* the gene is for.
