      Ultimately, Mill would tolerate the Citizen's Endowment as a transitional measure but oppose it as a final destination. His verdict rests on the primacy of character formation over material welfare. He would welcome the taxation of rents and the safety net, but he would argue that stopping at passive ownership is a betrayal of the socialist promise. The commitment doing the most work here is his belief that human development requires active engagement with the conditions of one's existence. He would urge that the Endowment be used to capitalise worker cooperatives, giving citizens not just a dividend, but a vote. Where his framework breaks is in addressing the scale of automation; he assumed labour would remain the primary claim on income. Faced with a world where labour's share is permanently depressed, he might concede that passive income is necessary, but he would insist it must be coupled with institutions that demand active citizenship elsewhere, lest we become well-fed slaves to a bureaucratic machine.

