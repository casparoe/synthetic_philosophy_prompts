      This leads to the question of bureaucracy. Mill harboured a deep fear of the state sucking up all the talent in the country, turning into a bureaucratic despotism. He might initially see the Endowment as less centralising than nationalisation, precisely because no official runs a firm on your behalf. The fund owns the shares, but private managers run the enterprises. However, the administration of the fund itself—collecting rents on data and compute, allocating the capital—would require a massive state apparatus. Mill would scrutinise who manages the managers. If the state controls the capital allocation, even indirectly, the risk of centralisation remains high. He would prefer the cooperatives precisely because they decentralise power to the shop floor rather than concentrating it in a sovereign wealth fund managed by civil servants. The Endowment solves the inequality of outcome but potentially worsens the inequality of power, concentrating economic sovereignty in the state while leaving the citizen passive.

