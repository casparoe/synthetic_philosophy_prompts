  Your observation is exceptionally sharp, and you are right to sense that while existing concepts gesture toward this phenomenon, none of them perfectly capture the specific epistemic closure you are describing. The configuration you have identified sits at the intersection of several well-trodden theoretical paths, but it requires a synthesis that is rarely made explicit in a single term. The closest canonical concept is indeed Ian Hacking's "looping effects of human kinds," but your intuition that it does not quite fit is correct. Hacking's framework primarily describes the dynamic interaction between a classification and the classified, often emphasizing how the classified group might resist, reshape, or deviate from the classification over time. His focus is on the instability of the kind itself. Your cases, by contrast, describe a stabilization mechanism where the classification becomes *more* robust precisely because the classified adopt it as self-knowledge, thereby reinforcing the instrument's validity. This is not just a loop; it is a specific mode of loop that closes off the question of construction by feeling like discovery.

  The theoretical home for this specific configuration is likely not in the philosophy of classification alone, but in Science and Technology Studies (STS), specifically within the literature on performativity and ontological politics. The concept of performativity, as developed by Michel Callon in the context of economics, argues that economic theories do not merely describe markets but actively shape them to conform to the theory. When a theory succeeds in making the world align with its predictions, it is not treated as a successful manipulation but as a successful description. This matches your second case perfectly: the frailty score does not just measure frailty; it enacts it. However, Callon's performativity often lacks the psychological dimension of "recognition" that you highlight. This is where the work of Annemarie Mol on "ontological politics" is crucial. Mol argues that realities (like diseases or bodies) are not pre-existing facts waiting to be measured but are enacted through specific practices. In your examples, the questionnaire and the score are not passive mirrors but active practices that bring a specific version of the patient into being. The boundary condition here is ontological indeterminacy: this phenomenon only occurs where there is no hard, prior fact of the matter to contradict the measure. If you were measuring blood pressure with a cuff, the cuff cannot make the blood pressure rise by measuring it (excluding white coat syndrome, which is a different mechanism). But with constructs like "frailty" or "eating disorder risk," the reality is soft enough to be shaped by the measure.

  To capture the specific element of "recognition" rather than "compliance," you need to integrate the Foucaultian notion of subjectification, particularly as elaborated by Nikolas Rose in his work on the psy-sciences. Rose describes how psychological expertise provides vocabularies that individuals use to understand themselves, not as an external imposition they resist, but as a liberation or a truth they embrace. This is the "technology of the self" component. When combined with STS performativity, you get the mechanism you are seeing: the instrument provides the vocabulary (Rose), which enacts the reality (Mol/Callon), which validates the instrument (Hacking), all while masking the production as discovery (Latour). There is no single noun in the literature that encapsulates this entire chain, which is why your colleagues' suggestions have felt like near-misses. "Interpellation" is too ideological and ignores the metric validation. "Self-fulfilling prophecy" assumes a false belief becoming true, whereas your cases involve an ontologically open reality becoming specific. "Goodhart's Law" assumes gaming and degradation, whereas you observe improvement and alignment.

  If you were to write this up, I would suggest that you are describing a specific subtype of looping effect that might be best termed "performative validation" or "constitutive reactivity." The sociologists Wendy Espeland and Michael Sauder have written extensively on "reactivity," distinguishing between instrumental conformity (gaming the measure) and constitutive conformity (internalizing the measure's norms). Your cases are instances of constitutive reactivity, but with the added layer that this internalization improves the metric's predictive accuracy, thereby cementing its authority. The boundary condition that distinguishes this from ordinary reactivity is the epistemic feedback: the change in the population is read as evidence of the measure's accuracy rather than its influence. The boundary condition that distinguishes it from standard looping is the valence of the uptake; standard looping often implies friction or deviation, whereas your cases rely on smooth adoption experienced as recognition.

  Therefore, while you can cite Hacking to establish the genealogy of the idea that classification changes the classified, you should arguably anchor your specific claim in the STS literature on performativity and ontological politics to explain the validation mechanism. You might propose the term "recognitive looping" or "performative validity" to distinguish it from the adversarial or neutral looping usually discussed by Hacking. The critical distinction you need to draw in your paper is between measures that track independent realities (where reactivity is noise) and measures that enact dependent realities (where reactivity is the signal). In your cases, the instrument works *because* it changes the world, not despite it. The stability of the system depends on the participants believing they are discovering a pre-existing truth, which is why the "disavowal of production" you noted is the linchpin. If that disavowal breaks—if the girls or patients realize they are being shaped rather than seen—the loop becomes visible, the recognition turns into resistance, and the validity claim collapses. So, you are describing a stable socio-technical arrangement maintained by a specific kind of epistemic innocence. There is no single word for this, but framing it as a form of "ontological performativity stabilized by subjectification" would allow you to claim the relevant literature while precisely marking the boundary conditions you have so carefully identified.
