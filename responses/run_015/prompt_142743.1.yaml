answer: |-
  ### Part 1: The Case Questions

  **1. The Botched Talk**
  You rehearse a talk for weeks. On the day, the projector fails and the audience is hostile. Did you fail?
  *   A) Yes, the point of a talk is to be heard and understood.
  *   B) No, I did my part; the rest wasn't mine to decide.
  *   C) It depends on whether I could have fixed the projector earlier.

  **2. The Friend's Drinking**
  You beg a friend to stop drinking. They refuse and get sick. Is their sickness partly your responsibility?
  *   A) No, they chose to drink.
  *   B) Yes, I should have tried harder or differently.
  *   C) Only if I promised to keep them safe.

  **3. The Losing Campaign**
  You campaign for a policy you know will probably lose. Was your time wasted?
  *   A) Yes, time is for winning changes.
  *   B) No, speaking truth matters regardless of the vote.
  *   C) Only if I didn't build connections for the next fight.

  **4. The Medical Result**
  You are waiting on a medical result. You feel anxious. Is the anxiety a mistake?
  *   A) Yes, worrying won't change the diagnosis.
  *   B) No, it shows I care about my health.
  *   C) Yes, because I should trust the doctors completely.

  **5. The Traffic Outburst**
  You lose your temper in traffic and later regret it. Who is at fault for the outburst?
  *   A) The other driver provoked me.
  *   B) I am, because I chose to react.
  *   C) It was a habit; fault doesn't apply.

  **6. The Wobbly Vase**
  You see a vase wobble but don't catch it. It breaks. Did you break it?
  *   A) Yes, I let it happen.
  *   B) No, gravity broke it.
  *   C) I'm responsible for not catching it, but I didn't break it.

  **7. The Job Loss**
  You are fired for reasons unrelated to your performance. Is your life worse?
  *   A) Yes, I have less money and status.
  *   B) No, my ability to act well is untouched.
  *   C) Yes, because I can't help my family now.

  **8. The Stranger's Need**
  A stranger asks for money. You have enough to spare. Do you owe it to them?
  *   A) Yes, their need makes a claim on me.
  *   B) No, it's my money to choose about.
  *   C) Only if giving it doesn't hurt my own plans.

  **9. The False Rumour**
  People believe a lie about you that damages your reputation. Should you fight it?
  *   A) No, truth is internal.
  *   B) Yes, reputation is a tool for doing good.
  *   C) Yes, because being lied about is a harm.

  **10. The Friend's Death**
  A close friend dies. Is deep sorrow an error?
  *   A) Yes, death is natural.
  *   B) No, sorrow is the price of love.
  *   C) Only if the sorrow stops me living.

  ***

  ### Part 2: The Logical Tree & Leaf Key

  The tree does not sort by "Stoic" vs. "Non-Stoic." It sorts by three underlying distinctions revealed in the answer patterns:
  1.  **Locus of Success:** Is success defined by internal intent (B) or external outcome (A/C)?
  2.  **Boundary of Agency:** Does responsibility stop at your skin (A/B in Q2, Q6) or extend into the social web (B/C in Q2, Q6)?
  3.  **Status of Emotion:** Is emotion a judgment error to be removed (A/B in Q4, Q10) or a human signal to be managed/accepted (B/C in Q4, Q10)?

  **The Leaves (Positions)**

  **1. The Strict Epictetan (The "Citadel" View)**
  *   **Pattern:** High frequency of **B** answers on Q1, Q4, Q5, Q7, Q9, Q10. High frequency of **A** on Q2 (others' actions are theirs).
  *   **Logic:** Success is exclusively internal (intent/assent). Emotions are judgments that can be wrong. Other people's actions are never yours.
  *   **Key Indicators:** Q1-B (Did my part), Q7-B (Life not worse), Q5-B (I chose).

  **2. The Modern Influence-Sphere (The "Self-Help" View)**
  *   **Pattern:** Mix of **B** and **C**. Q1-C (Could I have fixed it?), Q3-C (Connections), Q7-C (Setback but can help).
  *   **Logic:** You can't guarantee outcomes, but you can influence them. "Control" is a gradient, not a line. Success is partial.
  *   **Key Indicators:** Q1-C, Q3-C, Q6-C (Responsibility distinct from breaking).

  **3. The Therapeutic Reading (The "Anxiety Management" View)**
  *   **Pattern:** **A** on Q4 (Worrying won't change it), **B** on Q1 (Did my part). Often overlaps with Leaf 2.
  *   **Logic:** The distinction between "what matters" and "what doesn't" is a tool for peace of mind, not a metaphysical truth.
  *   **Key Indicators:** Q4-A (Utility of worry), Q10-C (Sorrow okay unless disabling).
  *   **Note:** *See Gap Analysis below.* This leaf is often indistinguishable from Leaf 2 in practice.

  **4. The Indirect-Influence Reading (The "Social Web" View)**
  *   **Pattern:** High frequency of **B** or **C** on Q2, Q6, Q8. Q9-C (Harm done to me).
  *   **Logic:** We are entangled. Another person's action can be partly yours if you failed to steer them. Outcomes matter because they affect the web.
  *   **Key Indicators:** Q2-B (Should have tried harder), Q8-A (Owe it to them).

  **5. The Quietist-Leaning (The "Futility" View)**
  *   **Pattern:** **A** on Q3 (Time wasted if lose), **B** on Q1 (Did my part).
  *   **Logic:** If the outcome isn't guaranteed, action is often pointless, *unless* the action itself is the only goal. Distinct from Strict Epictetan because the Strict view demands action as duty; Quietism doubts the utility of the duty.
  *   **Key Indicators:** Q3-A (Wasted time), Q7-A (Life worse).

  **6. The Flat Rejection (The "Value-Based" View)**
  *   **Pattern:** High frequency of **C** on Q7, Q9, Q2.
  *   **Logic:** The question of "control" or "internal success" is the wrong question. The right question is "What is valuable?" (Family, Truth, Needs).
  *   **Key Indicators:** Q7-C (Can't help family), Q9-C (Being lied about is harm), Q2-C (Promise/Safety).

  ***

  ### Part 3: Gap Analysis & Indistinguishable Leaves

  **Indistinguishable Leaves:**
  *   **Modern Influence-Sphere (Leaf 2) vs. Therapeutic Reading (Leaf 3):**
      *   *Why:* In concrete cases, both advise the same behavior: "Don't worry about the result, focus on the effort." The Self-Help view says this because you can *influence* but not *control*. The Therapeutic view says this because worrying *hurts you*.
      *   *Result:* A participant who picks Q1-B ("Did my part") and Q4-A ("Worrying won't change it") could be either. The tree cannot separate them without asking *why* they chose it (metaphysics vs. pragmatism), which violates the "concrete case" constraint. They are effectively the same leaf wearing two hats.

  **Empty Regions of the Logical Space:**

  1.  **External Value + Internal Success (The "Materialist Stoic"):**
      *   *Definition:* Someone who thinks "Life is worse if I lose my job" (Q7-A) but also "I did not fail if the talk went badly" (Q1-B).
      *   *Status:* **Incoherent.** If external goods (money/status) determine if life is worse, then external outcomes (audience reaction) must determine if a talk failed. You cannot hold value in externals while claiming immunity from failure regarding them.

  2.  **Shared Agency + Emotion as Error (The "Collective Puritan"):**
      *   *Definition:* Someone who thinks "My friend's sickness is my responsibility" (Q2-B) but "Deep sorrow at death is an error" (Q10-A).
      *   *Status:* **Unattractive/Rare.** If I am responsible for your health, your death is partly my failure. To feel no sorrow would require a level of detachment incompatible with accepting responsibility for another's welfare. Nobody occupies this spot because the emotional cost is too high.

  3.  **Internal Success + Political Futility (The "Passive Sage"):**
      *   *Definition:* Someone who thinks "I didn't fail the talk" (Q1-B) but "Campaigning for a lost cause is wasted time" (Q3-A).
      *   *Status:* **Unexplored/Unstable.** This is the Quietist trap. If success is internal (doing your part), then campaigning cannot be wasted time even if you lose. If campaigning is wasted time because you lost, then success must be external. Participants usually slide into Leaf 1 (Strict) or Leaf 5 (Quietist) but rarely stay in the middle.

  4.  **No Responsibility + High Obligation (The "Entangled Loner"):**
      *   *Definition:* Someone who thinks "Friend's sickness is not my responsibility" (Q2-A) but "I owe money to the stranger" (Q8-A).
      *   *Status:* **Unexplored.** This implies a moral duty to strangers that exceeds duty to friends. While philosophically possible (e.g., extreme utilitarianism), it is psychologically rare in this specific grouping. Most people's sense of obligation scales with proximity.
