answer: |-
  Here is the translation of the Problem of Universals into Programming-Language Theory (PLT), followed by the residue analysis and the case study on graded membership.

  ### 1. Metaphysical Positions in PLT Vocabulary

  Here is the mapping of the five main positions plus the sparse/abundant distinction into your native type-theoretic vocabulary.

  | Metaphysical Position | PLT Translation | Fidelity Note |
  | :--- | :--- | :--- |
  | **Ante Rem Realism** (Platonic) | **Nominal Typing / Signature-Declared Types.** The type `Red` is declared in a global signature (the Realm of Forms) prior to and independently of any values inhabiting it. A value is red only if it explicitly tags itself with the `Red` type identifier. | **Convenience:** In PLT, signatures are designed by engineers; for Plato, Forms exist necessarily. The mapping smuggles in an agent (the designer) where the realist posits existence. |
  | **In Re Realism** (Aristotelian) | **Structural Typing / Inferred Types.** There is no declaration of `Red`. A value is red if its internal structure (fields, methods) matches the shape of redness. The universal exists only *in* the aggregate of values that share this structure. | **Distortion:** Structural typing is syntactic/schematic; Aristotelian form is often causal/ontological. PLT captures the "immanence" but misses the "causal power." |
  | **Trope Theory** | **Singleton Types / Refinement Types.** Every particular has its own unique type (e.g., `RednessOfApple1`). We group them not by a shared universal, but by a higher-kinded interface or type class `Resembles<T>` that relates these singleton types. | **High Fidelity:** This maps cleanly. Tropes are particularized property-instances; singleton types are types inhabited by exactly one value. |
  | **Resemblance Nominalism** | **Observational Equivalence / Erasure.** There is no type `Red`. There are only values. We say they are "red" if they are observationally equivalent under a specific context (e.g., they all respond to `.wavelength()` with ~650nm). | **High Fidelity:** This captures the idea that the grouping is external to the objects, based purely on relational behavior. |
  | **Predicate (Ostrich) Nominalism** | **Dynamic Typing / Erasure.** Types are compile-time conveniences with no runtime representation. To say "this is red" is just to apply a label `red` to the term. There is no ontological ground, only the predicate application. | **High Fidelity:** Matches the view that universals are *flatus vocis* (breath of voice). |
  | **Sparse vs. Abundant** | **Base Types vs. Intersection/Union Types.** *Sparse:* Only base types (primitives) are real; compound types are syntactic sugar. *Abundant:* Any well-formed predicate (refinement type) defines a valid type, regardless of natural kind status. | **Convenience:** PLT usually treats all well-formed types as valid (Abundant), whereas metaphysics debates which are "natural." |

  ---

  ### 2. The Residue Report

  This section analyzes where the translation breaks down or requires smuggling assumptions.

  #### (a) Numerical Identity vs. Structural Similarity
  *The Realist Claim:* The redness in Apple A is **numerically identical** to the redness in Apple B. It is literally one item, multiply located.
  *The PLT Translation:* Structural typing gives **graded similarity** (equivalence classes), never identity. Even if two functions share code (via a closure or vtable pointer), the *type instances* are distinct at runtime.
  *Verdict:* **Translation Failure.**
  PLT is fundamentally committed to the distinction between *definition* (code) and *instantiation* (memory). You can model shared references (pointers to a single heap object), but that models *sharing*, not *multiply-located identity*. In PLT, if two values point to the same object, they are aliases of one particular, not two particulars sharing one universal.
  *Smuggled Assumption:* To make this work, you must assume the "heap" is the metaphysical substrate. But even then, PLT treats the heap locations as distinct. The realist claim requires a logic where $x \in A \land x \in B \implies A \neq B$ but the $x$ is strictly one. Standard type theory lacks a primitive for "multiply-located identity."

  #### (b) Discovery vs. Stipulation
  *The Metaphysical Worry:* Are types discovered (Realism) or stipulated (Nominalism)?
  *The PLT Translation:* Type systems are **designed**. We choose nominal or structural typing.
  *Verdict:* **Category Error.**
  This translation begs the question against Realism. In PLT, the type checker is an oracle we built. If the checker says `a : T`, it is because we programmed it to. Realism posits that the "checker" (reality) operates independently of our programming.
  *Smuggled Assumption:* You are smuggling **Constructivism** into the translation. By treating the type system as a design artifact, you implicitly assume there is no "God's Type Checker." To translate Realism faithfully, you would need a type system where the `check` function is opaque and external to the language definition, which defeats the purpose of formal semantics.

  #### (c) Third Man Regress vs. Universe Levels
  *The Metaphysical Worry:* If the Form of Man is itself a Man, we need a higher Form to group them, ad infinitum.
  *The PLT Translation:* This is **Impredicativity / `Type : Type`**. If a type can contain itself, we get Girard's Paradox (inconsistency). We solve this with **Universe Levels** (`Type_0 : Type_1 : Type_2...`).
  *Verdict:* **Strong Structural Match.**
  This is the cleanest translation. The Third Man argument is essentially a proof of inconsistency in a type system that allows self-predication. The hierarchy of Forms maps directly to Cumulative Universes.
  *Collapse:* However, this translates the *logical problem* of the regress, not the *ontological* worry. In PLT, universe levels are a fix for consistency. In Metaphysics, the hierarchy of Forms is often seen as a feature, not a bug, or a reason to reject self-predication. The PLT translation resolves the worry by fiat (stratification); the metaphysical debate is about whether the stratification is real.

  ---

  ### 3. Case Study: Graded Membership

  **The Proposal:** A term $t$ inhabits type $T$ iff $similarity(t, \text{prototype}_T) > \theta$, where $\theta$ is a parameter of the typing judgment.

  **Analysis:**
  This discipline does **not** cleanly express Resemblance Nominalism, nor Trope Theory. It expresses a hybrid that leans covertly toward **Ante Rem Realism**.

  1.  **Why it isn't Resemblance Nominalism:**
      Pure Resemblance Nominalism posits that particulars resemble *each other*. There is no "standard red." In your system, every value is compared against a `prototype_T`. This prototype acts as a **privileged particular**.
      *   *The Problem:* If the prototype is just another value, why does it get to define the type? If it defines the type, it is functioning as a Universal (a standard).
      *   *The Smuggle:* You have smuggled in a **Nominalist Universal**. The prototype is a "Form" implemented as a specific heap object.

  2.  **Why it isn't Trope Theory:**
      Trope theory says the redness of Apple A is a particular (`Redness_A`). Your system groups them by distance to a center. Trope theory usually requires a primitive resemblance relation between tropes, not a metric space anchored by a prototype.

  3.  **What Extra Structure is Needed?**
      To express genuine Resemblance Nominalism, you must remove the `prototype`.
      *   *Required Structure:* A typing judgment based on **clustering**. $t : T$ iff $t$ belongs to the connected component of the similarity graph containing some seed set, without reference to a central anchor.
      *   *Alternatively:* To express Trope Theory, the "type" of $t$ should be the singleton type of its specific redness-trope, and `Red` should be a type class constraining those singletons via a pairwise resemblance relation, not a threshold against a prototype.

  **Verdict on the Failure:**
  The failure of your graded membership system to capture Resemblance Nominalism suggests that **Resemblance Nominalism is not a genuine alternative to Realism** in a computational context.
  Why? Because to compute resemblance, you need a metric. To define a metric, you need dimensions (wavelength, saturation). Those dimensions function as Universals. You cannot compute similarity without a shared space of comparison. That shared space *is* the Universal.
  Therefore, any computational implementation of "resemblance" secretly relies on a structural realism (the metric space) or a nominalist realism (the prototype).

  ---

  ### Conclusion: Blind Spot or Ill-Posed Question?

  **Flagged Smuggling:**
  Throughout this translation, I have smuggled **Operationalism**. PLT asks "How do we check this?" Metaphysics asks "What is this?" When I mapped Realism to Nominal Typing, I assumed the Signature was a list of rules. For the Realist, the Signature is the fabric of reality.

  **Final Verdict:**
  The residue found is **evidence that the original question is less sharp than it looks**, specifically regarding the "Numerical Identity" sticking point.

  In PLT, we distinguish between **Intensional Equality** (same code/source) and **Extensional Equality** (same behavior/output).
  *   The Realist wants to say Universals are Intensionally One but Extensionally Many.
  *   PLT shows that if two things are Intensionally One (same closure pointer), they are the same object. If they are Extensionally One (same output), they are distinct objects that behave alike.

  PLT cannot represent "One Item, Multiply Located" because our memory model is local. This suggests the metaphysical Problem of Universals might be a **category mistake arising from natural language**. We treat "Red" as a noun (an item), but PLT suggests it is better modeled as a **relation** or a **constraint**.

  The "blind spot" in your vocabulary is **Ontological Commitment**. PLT is agnostic about what exists; it only cares about what is well-formed. The residue isn't a failure of PLT to describe reality; it is a success of PLT in showing that the "Problem of Universals" dissolves when you force the concepts to be operationalized. If you can't write the type checker for it, the distinction may not be doing any work.
