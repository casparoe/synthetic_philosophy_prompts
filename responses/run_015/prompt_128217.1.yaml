answer: |-
  The practice presupposes law serves an expressive function, conflicting with harm-based doctrines. It cannot square with the harm principle, which demands preventing tangible injury, not merely signaling disapproval. While echoing Devlin's view that societal moral fabric is a public good, even Devlin argued for enforcement, not symbolic retention. Keeping laws as dead letters is philosophically unstable for a liberal; it risks arbitrary enforcement and chills liberty without preventing harm. However, if viewed as state speech affirming values without coercive threat, a liberal might tolerate them, though this contradicts constitutional requirements for harm-based justification. Ultimately, the practice relies on a hidden Devlin-esque assumption that moral cohesion itself prevents harm, masking moralism as harm prevention to satisfy doctrinal constraints while maintaining symbolic order.
