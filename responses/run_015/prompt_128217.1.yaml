  me and a friend got into it last night about whether law should enforce morality, and now i'm stuck on this weird institutional thing. in several countries there's a practice of keeping morals offenses—like blasphemy or indecency statutes—on the books even though prosecutors never use them, and the government says they're just symbolic expressions of shared values. but thier constitutional doctrine says every law needs a harm-based justification, not just moral disapproval. what view of law's purpose does that practice presuppose? can it be sqared with the harm principle, or does it quietly need Devlin's idea that society's moral fabric is itself a public good? also is the practice philosophicly underdetermined—could a liberal keep these laws as dead letter without contradiction? lead with your bottom line, then unpack. one paragraph only, hard max 140 words, and no citations please—just work it out.
