  **BUREAU OF CONSTITUTIONAL MATCHING**
  **FORM L-CP-44: LIBERTY COMPATIBILITY PACKET**
  **CONFIDENTIAL // MANDATORY INTAKE**

  **Welcome, Citizen.**

  Freedom is not a monolith; it is a curated suite of protections subject to administrative classification. To ensure your constitutional alignment matches your psychological tolerance for state presence, you must select one of three Liberty Packages. Please review the following specifications before submitting your mandatory Arbitrariness Audit. Failure to select a package will result in the automatic assignment of Package P, as the State knows you are too confused to choose wisely.

  **PACKAGE N: THE NON-INTERFERENCE STANDARD**
  This package guarantees a sphere of action where no agent actively obstructs your choices. Under Package N, the State refrains from direct coercion. Please note: Package N does not cover incapacities arising from poverty, lack of education, or structural inequality. If you starve because no one forbade you from buying bread you cannot afford, this is classified as a market condition, not a liberty violation. Ideal for citizens who prefer formal rights over material capacity and wish to remain blind to power asymmetries.

  **PACKAGE P: THE SELF-MASTERY MANDATE**
  This package guarantees the resources necessary for rational self-direction. The State identifies barriers to your potential and removes them, often without prior consultation. Under Package P, liberty is achieved through capacity-building. Please note: To ensure you are truly "free" to choose the good, the State reserves the right to mandate attendance at wellness seminars, vocational training, or moral recalibration sessions. Ideal for citizens who view freedom as empowerment, even if compelled by benevolent paternalism.

  **PACKAGE R: THE NON-DOMINATION ASSURANCE**
  This package guarantees freedom from arbitrary power. It is not enough that no one interferes; no one must *hold the capacity* to interfere arbitrarily. Under Package R, you must pass the Eyeball Test: Can you look every relevant official in the eye without fear of uncontrolled discretion? Ideal for citizens who prefer structural vigilance over peace of mind. Be advised: Package R requires exhaustive litigation against any official possessing unchecked veto power, regardless of whether they intend to use it.

  **REQUIRED: ARBITRARINESS AUDIT**
  All citizens must submit to an audit measuring exposure to discretionary authority. See Case Study 7-G for compliance benchmarks.

  **CASE STUDY: APPLICANT 7-G**
  Applicant 7-G applied for a State Skills Grant. She was not coerced (Package N satisfied). She received the grant and completed the training (Package P satisfied). However, during the Arbitrariness Audit, 7-G failed Package R. Investigation revealed the granting official possessed unchecked discretionary authority. Although the official acted benevolently, they *could* have arbitrarily assigned 7-G to a useless course or denied the grant without reason. Because 7-G exists at the mercy of another's will, she remains dominated despite the beneficial outcome. The grant is hereby rescinded to prevent normalization of dependency. A new grant will be issued only after the official's discretion is codified into rigid algorithmic statute.

  **NOTICE OF VIGILANCE**
  Selecting Package R requires permanent institutional monitoring. You must report any instance where an official smiles without a regulatory script. Package N users may ignore power asymmetries. Package P users may ignore paternalism. Package R users must ignore nothing. You are now responsible for auditing the structural conditions of every conversation you have with authority.

  By signing below, you acknowledge that liberty is either a wall, a ladder, or a shield against the hand that holds the ladder. Choose wisely.

