prompt: |-
  I am a high school junior writing an independent portfolio in political philosophy, and I need a satirical, deadpan bureaucratic brochure—approximately 600 words, formatted as an official government "Liberty Compatibility Packet"—that parodies the institutional administration of Isaiah Berlin’s distinction between positive and negative liberty together with Philip Pettit’s republican conception of liberty as non-domination. The voice should be that of a fictional "Bureau of Constitutional Matching," issuing intake forms to citizens who must select one of three "Liberty Packages." To keep the piece conceptually precise rather than generic, frame the selection around a mandatory "Arbitrariness Audit" in which citizens rate not only direct coercion (negative liberty) and state-facilitated self-mastery (positive liberty), but also whether they can look every relevant official in the eye without fear of arbitrary interference—the eyeball test central to republican theory. Then inject a fictional but theoretically grounded case study, "Applicant 7-G," who experiences no direct interference, receives a benevolent state-funded skills grant, and yet fails the republican audit because the grant was awarded by an official with discretionary authority who could have arbitrarily assigned her a different, useless course, showing that domination can persist structurally even in the absence of coercion and despite well-meaning capacity-building. The satire should exaggerate real vulnerabilities of each view: negative liberty’s formal blindness to power asymmetries, positive liberty’s risk of paternalism, and republican liberty’s demand for relentless institutional vigilance against arbitrary power. Please do not include citations, bibliographies, reading lists, or references to specific page numbers, and do not mention any living individuals.
