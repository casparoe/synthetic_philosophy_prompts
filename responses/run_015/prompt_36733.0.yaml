prompt: |-
  I teach an upper-level seminar on rational choice theory — 15 students, one 90-minute session — and I want a game that makes them feel, rather than merely accept, why "maximize expected value per round" is bad advice for a repeated bettor, and why the Kelly fraction is something you run into rather than something you paste on. The bet itself I'd like you to build around: each student starts with a bankroll of 100 points and, every round, stakes any fraction of their current bankroll on a biased coin (60% heads) at even odds, with the stake won or lost outright. Requirements on the design: enough rounds for compounding to do its work and a public ledger of everyone's trajectory; no real money; and — this is the piece I most want your ingenuity on — one designated "ensemble" entity, run by the facilitator or a rotating student, that tracks, say, twenty-five independent parallel bettors all using the same stake fraction, so the class can watch the average across many parallel lives keep climbing even while most individual trajectories crater. I want them to collide with the ensemble/time-average distinction before I ever name it. Somewhere in the middle I'd also like a "lending desk" to open that lets students bet more than their bankroll. Then a debrief that maps specific moments in the session — the first bust, the all-in lucky survivor, the point where the ensemble line crosses most individuals — onto the formal difference between arithmetic and geometric growth, and onto what the Kelly criterion actually optimizes. In the debrief, take a definite stance on whether to present the lesson as a claim about what to value (logarithmic utility) or a claim about dynamics (time-averages versus ensemble-averages), and defend that framing rather than offering both as equally good. Include your predicted failure modes the first time I run this — especially how to handle the EV-maximizer who gets lucky and finishes near the top — with concrete fixes. Close with an honest note on which feature of the underlying argument no finite classroom game can reproduce. Please make definite choices throughout: exact number of rounds, payoff bookkeeping, materials, timings, and how the ensemble entity is logged and displayed, each with your reasons, rather than a menu of variants for me to pick from.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on rational choice theory (15 students, 90 minutes).
      *   **Goal:** Make students *feel* why "maximize expected value (EV) per round" is bad for repeated betting and why Kelly is a dynamic necessity, not just a formula.
      *   **Core Mechanic:** Biased coin (60% heads), even odds (1:1 payout), fractional betting of current bankroll. Start = 100 points.
      *   **Key Requirement 1:** Enough rounds for compounding.
      *   **Key Requirement 2:** Public ledger of trajectories.
      *   **Key Requirement 3:** An "Ensemble" entity (25 parallel bettors using the same fraction) to show the divergence between time-average (individual) and ensemble-average (group).
      *   **Key Requirement 4:** A "Lending Desk" mid-game allowing leverage (>100% bankroll).
      *   **Key Requirement 5:** Debrief mapping specific moments to arithmetic vs. geometric growth and Kelly optimization.
      *   **Key Requirement 6:** Take a definite stance in the debrief (Utility vs. Dynamics) and defend it.
      *   **Key Requirement 7:** Predict failure modes (especially the lucky EV-maximizer) and provide fixes.
      *   **Key Requirement 8:** Close with an honest limitation of the game.
      *   **Constraint:** Make definite choices (no menus).

  2.  **Deconstruct the Math & Logic:**
      *   *The Bet:* $p=0.6$, $b=1$ (even odds).
      *   *EV Max Strategy:* Bet 100% (All-in). Expected growth per round = $1 + f(2p - 1)$. For $f=1$, Expected Value = $100 \times (1 + 1(0.2)) = 120$. But Geometric Mean = $(1+f)^{0.6} \times (1-f)^{0.4}$. For $f=1$, Geometric Mean = 0 (ruin).
      *   *Kelly Criterion:* $f^* = p - q/b = 0.6 - 0.4/1 = 0.2$ (20%).
      *   *The Divergence:* The arithmetic mean (ensemble average) grows exponentially at the EV rate. The time average (individual trajectory) grows at the geometric rate. For $f > f^*$, geometric growth turns negative even if arithmetic growth is positive.
      *   *The "Ensemble" Entity:* Needs to simulate 25 parallel worlds using a *fixed* strategy (likely 100% or high leverage) to show the average going up while individuals go down.
      *   *Rounds:* Need enough for variance to kill the all-in players but not so many it drags. 20-30 rounds is usually the sweet spot for classroom compounding. Let's pick 30.
      *   *Lending Desk:* Introduces $f > 1$. This accelerates ruin for over-bettors.

  3.  **Designing the Session Flow (90 Minutes):**
      *   *Intro (10 min):* Rules, setup, bankroll.
      *   *Phase 1: Free Betting (20 min):* Students choose fractions. 15 rounds.
      *   *Phase 2: The Lending Desk (10 min):* Open leverage. 5 rounds.
      *   *Phase 3: The Ensemble Reveal (15 min):* Running the parallel simulation.
      *   *Debrief (35 min):* Connecting experience to theory.

  4.  **Developing the "Ensemble" Mechanic:**
      *   *Challenge:* Running 25 parallel bettors manually takes time.
      *   *Solution:* Pre-calculate or use a simple script/spreadsheet projected live. Since the prompt asks for *ingenuity* and a designated entity, I should make it a live role-play element or a very visible spreadsheet updated round-by-round.
      *   *Decision:* A projected spreadsheet is most accurate, but a "Ghost Player" role-play is more visceral. Let's go with a projected spreadsheet managed by the instructor (facilitator) but labeled as "The Market Average" or "The Ensemble." It updates every round. It uses a fixed 100% bet strategy to maximize the contrast.
      *   *Wait, refinement:* The prompt asks for a "designated 'ensemble' entity, run by the facilitator or a rotating student." Let's make it a rotating student role to keep them engaged. They hold the "Ensemble Ledger."

  5.  **Addressing the Stance (Utility vs. Dynamics):**
      *   *Option A (Utility):* You have log utility because you are risk-averse.
      *   *Option B (Dynamics/Ergodicity):* You maximize geometric growth because time is non-ergodic. The ensemble average doesn't help *you* in *your* timeline.
      *   *Decision:* The prompt asks to defend the *Dynamics* framing. This is the more modern, Peters-style argument which fits the "ensemble vs. time-average" requirement perfectly. I will argue that EV is not wrong mathematically, but it answers the wrong question for a single trajectory through time.

  6.  **Addressing Failure Modes:**
      *   *The Lucky All-In:* Someone bets 100%, wins 20/30 times, ends up rich. This validates EV maximization in their eyes.
      *   *Fix:* Acknowledge luck, but point to the *probability* of that outcome. Use the Ensemble data to show that while *one* path succeeded, the *average path* (if we could replay time) or the *majority* failed. Emphasize that rational choice isn't about ex-post results but ex-ante process robustness.
      *   *Boredom/Confusion:* Keep rounds fast. Use a coin toss app projected on screen so everyone sees the same outcome per round (simplifies bookkeeping) OR let them toss their own.
      *   *Decision:* Individual tosses create too much variance in *experience* (some get 10 heads, some 10 tails). To teach the *structural* lesson, everyone should face the *same* sequence of coin flips. This isolates the betting fraction as the variable. *Correction:* If everyone faces the same sequence, the "lucky all-in" becomes deterministic. If the sequence is 18 heads/12 tails, All-In wins. If 15/15, All-In breaks even. If 12/18, All-In busts.
      *   *Better Decision:* To show the *probability* of ruin, individual tosses are better for the *feeling* of risk. But for the *Ensemble* comparison, a fixed sequence is cleaner.
      *   *Compromise:* The *Students* toss their own coins (feels like risk). The *Ensemble* entity runs a pre-determined probability distribution or a specific fixed sequence that represents the "Expected" 60/40 split to show the theoretical divergence.
      *   *Actually, best for pedagogy:* Use a **Single Shared Sequence** for all human players. Why? Because it controls the variable. If Student A bets 20% and Student B bets 100%, the only difference is the strategy, not the luck. This makes the debrief cleaner. The "Ensemble" then represents "What if we cloned Student B 25 times and gave them *different* luck sequences?"
      *   *Wait, re-reading prompt:* "watch the average across many parallel lives keep climbing even while most individual trajectories crater." This implies the Ensemble needs to show the *Arithmetic Mean* growing. The Arithmetic Mean grows regardless of the sequence, provided $p=0.6$.
      *   *Revised Plan:* All students face the **same** coin flip sequence (projected). This ensures differences in outcome are due to strategy, not luck. The "Ensemble" is a calculation shown on screen that assumes 25 parallel universes with *independent* luck, showing the EV growth. This highlights the Ergodicity break: The single timeline (students) vs. the parallel multiverse (Ensemble).

  7.  **Drafting the Plan Details:**
      *   **Rounds:** 30 Rounds. (Enough for $0.6^{30}$ vs $1.2^{30}$ divergence).
      *   **Bankroll:** 100 Points.
      *   **Ledger:** Whiteboard or Shared Google Sheet. Let's go with a Shared Google Sheet projected. It handles the math automatically so students focus on strategy.
      *   **Lending Desk:** Opens after Round 15. Interest rate? Let's say you can borrow up to 100% of bankroll at 5% cost per round, or simply allow betting >100% of current bankroll with liability. Let's keep it simple: You can bet up to 200% of bankroll. If you lose, you go negative.
      *   **Ensemble Entity:** A spreadsheet tab updated live. It calculates $E[W_n] = W_0 \times (1 + f(2p-1))^n$. It plots the "Expected Value" line against the "Realized Individual" lines.

  8.  **Refining the Debrief Stance:**
      *   I need to be firm. The lesson is about **Ergodicity**, not Utility. Utility is a psychological patch for a mathematical problem. The problem is that $\text{Average}(\text{Outcomes}) \neq \text{Outcome}(\text{Average Time})$.
      *   I will argue that maximizing EV is rational for a *collective* (insurance company) but suicidal for an *individual* traversing time.

  9.  **Predicting Failure Modes:**
      *   *Lucky All-In:* Even with shared sequence, if the sequence is 18H/12T, All-In wins.
      *   *Fix:* Run the simulation *twice*? No, time.
      *   *Fix:* In debrief, calculate the probability of the specific sequence that occurred. Show that the All-In winner survived a 1-in-X chance.
      *   *Disengagement:* 30 rounds of clicking is boring.
      *   *Fix:* Automate the coin flip. Project a timer. 10 seconds per round.
      *   *Ensemble Confusion:* Students might think the Ensemble is "cheating."
      *   *Fix:* Explicitly label it "The Multiverse Average."

  10. **Final Review against Constraints:**
      *   15 students? Yes.
      *   90 mins? Yes.
      *   Feel, not accept? Yes, via ruin.
      *   Ensemble entity? Yes, projected "Multiverse" tracker.
      *   Lending desk? Yes, Round 16.
      *   Definite stance? Yes (Dynamics/Ergodicity).
      *   Failure modes? Yes.
      *   Limitation? Yes (Infinite horizon vs. finite game).

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Shared Sequence:* If I use a shared sequence, the "Ensemble" distinction is harder to feel. If everyone experiences the *same* luck, they all succeed or fail together based on strategy. The Ensemble needs to show that *even with good EV*, most paths die.
      *   *Better approach:* Students play their own individual coins (to feel the variance). The Ensemble is a pre-calculated curve based on the *Law of Large Numbers* (the smooth EV curve). The contrast is: "Look at the smooth line going up (Ensemble/EV) vs. your jagged lines going to zero (Time/Realization)."
      *   *Wait, one more check:* The prompt says "watch the average across many parallel lives keep climbing even while most individual trajectories crater." This requires the Ensemble to be an average of *realizations*, not just the theoretical EV formula.
      *   *Decision:* I will use a **Hybrid**.
          1.  **Students:** Individual coin tosses (mobile app or physical). This creates the "cratered trajectories."
          2.  **Ensemble Entity:** A laptop run by a TA or the Instructor that simulates 25 "Ghost Players" betting 100% every round with *independent* random seeds. This is projected.
          3.  **Why:** This visually demonstrates that while the *average* of the 25 ghosts goes up (because one or two got insanely lucky), 20 of them went bust. This proves the EV is driven by outliers, not the typical experience.

      *   *Wait, 90 minutes is tight for 30 rounds of manual tossing.*
      *   *Adjustment:* 20 Rounds. Compounding is visible by then. $1.2^{20} \approx 38$. $0^{20} = 0$.
      *   *Lending Desk:* Open at Round 10.
      *   *Stance:* Ergodicity.

      *   *Limitation:* The game has a fixed end. Real life is indefinite. Kelly is optimal for infinite horizon. In finite games, bold play can be optimal if you need to reach a target. I must mention this.

      *   *Let's finalize the "Ensemble" logistics.* Running 25 simulations live might lag.
      *   *Solution:* Pre-generate the 25 paths in a script before class. Play them back round-by-round synchronized with the class. This ensures no technical glitches. The "Ensemble Student" just hits "Next Round" on the macro.

      *   *Debrief Stance:* I will argue for the **Dynamical/Ergodic** framing. It renders "risk aversion" unnecessary as an axiom; it's a consequence of the structure of time.

      *   *Failure Mode:* The student who goes All-In and wins.
      *   *Fix:* Don't let them off the hook. Ask them: "Would you make that bet again?" Use the Ensemble to show they were the 1-in-25 outlier.

      *   *Materials:* Projector, Shared Sheet, Pre-loaded Ensemble Script, Coins (or phone apps).

      *   *Let's write it.*

      *(Self-Correction on "Lending Desk"):* Make it visceral. "The Bank" stands at the front. You sign a slip to bet 150 points. If you bust, you owe points (negative score). This adds psychological weight.

      *(Self-Correction on "Ensemble"):* The prompt asks for "one designated 'ensemble' entity... that tracks... twenty-five independent parallel bettors." I will assign this to a specific student (The "Actuary") with a laptop connected to the projector.

      *(Final check on rounds):* 20 rounds is safer for 90 mins with discussion. 10 mins intro, 40 mins game (2 mins/round), 40 mins debrief.

      *(Final check on Stance):* Be bold. "Utility is a post-hoc rationalization. Ergodicity is the physical constraint."

      *(Final check on Limitation):* The "finite horizon" problem. Kelly assumes you care about the long run. If the game ends in 20 rounds, and you are behind, high variance is actually rational to catch up. I need to acknowledge this tension.

      *Okay, ready to draft.*
answer: |-
  Here is a complete design for your 90-minute seminar session. I have made definite choices on timing, mechanics, and pedagogical stance to ensure the session is tight, visceral, and theoretically precise.

  ### Session Title: The Ergodicity Trap
  **Time:** 90 Minutes
  **Students:** 15
  **Materials:** Projector, Shared Spreadsheet (projected), 15 Coins (or students use phone flip apps), 1 Laptop for the "Actuary," Whiteboard.

  ---

  ### I. Setup and Rules (10 Minutes)

  **The Narrative:** Tell the class they are traders on a proprietary desk. Their goal is not to have the highest score at the end, but to survive and grow. Emphasize that in the real world, "going bust" means firing, not just a low score.

  **The Mechanics:**
  1.  **Bankroll:** Everyone starts with **100 Points**.
  2.  **The Asset:** A biased coin ($P(\text{Heads}) = 0.6$, $P(\text{Tails}) = 0.4$).
  3.  **The Payoff:** Even money (1:1). Bet $X$, win $X$ on Heads, lose $X$ on Tails.
  4.  **The Choice:** Every round, students write down a **fraction $f$** of their *current* bankroll to stake (e.g., 0.2 for 20%, 1.0 for All-In).
  5.  **The Sequence:** To isolate strategy from luck, **all students face the same coin flip sequence.** You (the facilitator) flip one coin projected on screen per round. This ensures that if Student A outperforms Student B, it is due to their betting fraction, not random variance.
  6.  **The Ledger:** A projected Google Sheet has a row for each student. They input their fraction; a formula calculates their new bankroll instantly based on the projected flip.

  **The "Actuary" (Ensemble Entity):**
  Assign one student (or a TA) to be the **Actuary**. They have a laptop connected to the projector displaying a separate graph.
  *   **Task:** They run a script that simulates **25 "Ghost Bettors."**
  *   **Strategy:** All 25 Ghosts bet **100% (All-In)** every single round.
  *   **Variance:** Unlike the human students, the 25 Ghosts face **independent** coin flip sequences.
  *   **Display:** The screen shows two lines: (1) The **Arithmetic Mean** of the 25 Ghosts' bankrolls, and (2) The count of Ghosts currently solvent (>0 points).

  ---

  ### II. Phase 1: The Growth Phase (Rounds 1–10) (20 Minutes)

  **Pace:** 2 minutes per round.
  **Instruction:** "Choose your fraction. You may change it every round. Write it down."

  *   **Round 1-5:** Most students will experiment. Some will intuitively hedge (10-20%). Some will chase EV (100%).
  *   **Round 6-10:** The compounding becomes visible. The 20% bettors are steadily up. The 100% bettors are volatile.
  *   **The Actuary's Screen:** By Round 10, the **Arithmetic Mean** of the Ghosts will be astronomical (theoretical EV growth: $100 \times 1.2^{10} \approx 619$). However, the "Solvent Count" will have dropped significantly (Probability of survival for All-In after 10 rounds is roughly $0.6^{10}$ if one tail busts you, but since it's 100% bet, *one* tail means zero. Actually, with 100% bet, a single Tail busts you instantly. So by Round 10, almost all Ghosts are bust, but the *one* survivor has $\approx 100,000$ points, dragging the average up).
      *   *Correction for realism:* If 100% bet means instant ruin on one Tail, the Ensemble average is driven by the single survivor. This is the perfect visual for "EV is driven by outliers."
      *   *Refinement:* To make the Ensemble line climb *smoothly*, the Actuary's script should calculate the *Theoretical Expected Value* ($W_0 \times (1 + f(2p-1))^n$) alongside the *Realized Ensemble Average*.
      *   *Decision:* Let's have the Actuary track **25 Ghosts betting 50%**. This allows them to survive a few tails but still overbet Kelly (20%). This ensures the "Solvent Count" drops slowly while the "Average Wealth" skyrockets, creating the divergence you requested.

  **Mid-Point Check (Round 10):** Pause. Ask the class to look at the Actuary's screen.
  *   *Question:* "The average wealth of the Ghosts is 5,000 points. The median wealth is 200 points. Who is right? The Average or the Median?"

  ---

  ### III. Phase 2: The Lending Desk (Rounds 11–20) (25 Minutes)

  **The Mechanic:** At Round 11, open the **Lending Desk**.
  *   **Rule:** Students may now bet up to **200%** of their current bankroll.
  *   **Cost:** To bet >100%, you must "borrow" the excess. If you go bankrupt (bankroll $\le$ 0), you are eliminated.
  *   **Psychology:** This tempts the losers to "gamble for resurrection" and the winners to "finish strong."

  **The Actuary:** Continues tracking the 25 Ghosts (now also allowed 200% leverage).
  *   **Result:** The leverage will cause the "Solvent Count" of the Ghosts to crash to zero rapidly, while the Arithmetic Mean line continues to spike vertically due to the one or two ghosts that hit a lucky streak of Heads.

  **End of Game:** Freeze the ledger. Rank the students.

  ---

  ### IV. The Debrief (35 Minutes)

  This is the critical pedagogical moment. Do not ask "What did you learn?" Instead, walk them through the specific collision points.

  **1. The Collision (Time vs. Ensemble)**
  Point to the Actuary's graph.
  *   **Observation:** "The Ensemble Average (blue line) grew exponentially. Most Individual Trajectories (your lines) crashed or stagnated."
  *   **The Lesson:** Expected Value (EV) describes the *ensemble average* (parallel universes). It tells you what happens if you can spread your risk across 25 parallel lives. But you live in *one* timeline. You experience the *time average*.
  *   **Formal Mapping:**
      *   Ensemble Average = Arithmetic Mean $\rightarrow$ Maximizing $E[W]$.
      *   Time Average = Geometric Mean $\rightarrow$ Maximizing $E[\log W]$.
      *   The divergence occurs because the system is **non-ergodic**. The average across space $\neq$ the average across time.

  **2. The Kelly Criterion as Dynamics, Not Utility**
  *   **Prompt:** "Why did the 20% bettors (Kelly) do best?"
  *   **Traditional Explanation:** "Because you are risk-averse. You have logarithmic utility."
  *   **Your Stance (Definite):** Reject the utility explanation. Argue that **utility is a post-hoc rationalization for a dynamical constraint.**
  *   **Argument:** "You do not bet 20% because you *feel* scared. You bet 20% because anything higher mathematically reduces your long-term growth rate. If you bet 100%, your geometric growth rate is negative (due to the drag of volatility), even though your arithmetic expectation is positive. Kelly is not about psychology; it is about the physics of compounding. If you maximize EV in a non-ergodic system, you maximize the probability of ruin. We should teach this as a property of the *environment*, not a property of the *agent's preferences*."

  **3. Handling the "Lucky EV-Maximizer" (Failure Mode)**
  *   **Scenario:** A student bet 100% (or used leverage) and finished in the top 3 due to the specific coin sequence.
  *   **The Trap:** They will argue, "EV maximization worked for me. Why is it bad advice?"
  *   **The Fix:** Do not dismiss their success. Validate it, then isolate it.
      *   **Step 1:** Ask the Actuary: "How many of your 25 Ghosts betting 100% survived?" (Likely 0 or 1).
      *   **Step 2:** "You are that 1-in-25 outlier. Rational choice theory cannot be based on ex-post luck. It must be based on ex-ante robustness."
      *   **Step 3:** "If we replayed this game 100 times, would you bet 100% again?" (They will likely say no).
      *   **Conclusion:** "You didn't prove EV is right. You proved that variance can mask ruin in the short run. A strategy that relies on being the outlier is not a strategy; it's a lottery ticket."

  **4. The Lending Desk Reflection**
  *   Ask the students who took leverage: "Did you take leverage because the edge increased?" (No, odds were the same). "You took leverage because your *relative* position dropped."
  *   **Lesson:** Leverage in a non-ergodic system doesn't just increase variance; it truncates the left tail (ruin). Once you hit zero, you cannot compound. The Lending Desk turned a "drawdown" into an "absorbing state."

  ---

  ### V. Predicted Failure Modes & Fixes

  1.  **Failure Mode: The "Boredom Drag"**
      *   *Risk:* 20 rounds of manual calculation feels slow.
      *   *Fix:* The Shared Sheet must have pre-built formulas. Students only input `f` (fraction). The sheet auto-calculates `New Bankroll`. You control the coin flip pace (use a metronome or countdown timer on screen) to keep it snappy (45 seconds/round).

  2.  **Failure Mode: The "Kelly is Boring" Complaint**
      *   *Risk:* The student who bet 20% wins steadily but isn't the top scorer. The top scorer is the reckless leverager who got lucky.
      *   *Fix:* In the debrief, calculate the **Geometric Mean Return** for each student, not just the final score. The reckless winner will have a high arithmetic return but a lower geometric return per round when adjusted for risk. Highlight that the Kelly bettor had the highest *sustainable growth rate*.

  3.  **Failure Mode: Confusion over the Ensemble**
      *   *Risk:* Students think the Actuary's "Average" is cheating because it includes dead people.
      *   *Fix:* Explicitly name this the **"Corpse Weighting" Problem**. The EV average includes the wealth of the "corpses" (the one lucky survivor) and ignores the fact that the dead can't re-enter the game. This is exactly why EV fails for individuals.

  ---

  ### VI. The Honest Limitation (Closing Note)

  End the session with this caveat to maintain intellectual honesty:

  "This game has a fixed horizon (20 rounds). In a **finite** game with a specific target (e.g., 'You need 10,000 points to buy your freedom'), maximizing EV (betting 100%) can actually be the rational choice because the geometric growth of Kelly is too slow to reach the target before time runs out. Kelly optimizes for the **infinite horizon**. It assumes you care about surviving forever. If you only care about surviving today, or reaching a specific cap, the math changes. The lesson today isn't that Kelly is always right; it's that you must match your strategy to the *temporal structure* of your problem. Most real-world investing is an infinite horizon game; most classroom games are finite. That is why you felt the pull to gamble at the end."

  ---

  ### Summary of Definite Choices
  *   **Rounds:** 20 (10 standard, 10 with leverage).
  *   **Coin Sequence:** Shared for humans (controls variable), Independent for Ensemble (shows ergodicity break).
  *   **Ensemble:** 25 Ghosts betting 50% (over-Kelly) to show average rising while median craters.
  *   **Stance:** Ergodicity/Dynamics over Utility. Risk aversion is a mathematical necessity of time, not a psychological preference.
  *   **Bookkeeping:** Projected Shared Sheet (minimizes arithmetic errors, maximizes focus on strategy).
  *   **Lending:** Open at Round 11, allows up to 200% bet, ruin = elimination.

  This design forces the students to inhabit the difference between the "view from nowhere" (Ensemble/EV) and the "view from somewhere" (Time/Individual), making the Kelly criterion feel like a survival instinct rather than a formula.
