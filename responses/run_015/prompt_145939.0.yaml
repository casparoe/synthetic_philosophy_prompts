answer: |-
  Strawson's framework survives the challenge of vicarious and structural reactive attitudes, but only by abandoning the claim that moral responsibility is fundamentally rooted in face-to-face interpersonal relationships. Strawson's central insight in "Freedom and Resentment" is that responsibility is not a metaphysical fact about causal freedom, but a social practice constituted by our emotional responses to others. We hold people responsible because we cannot sustainably view them through the "objective attitude"—treating them as objects to be managed rather than participants in a relationship—without losing our humanity. However, this model relies heavily on the dyadic dynamic of "I demand good will from you."

  When you introduce vicarious resentment, such as anger on behalf of future generations, or structural blame directed at corporations, that dyadic link dissolves. There is no specific "you" who has slighted "me." If I resent a government policy for harming people I will never meet, I am not reacting to an injury against my own expectations of reciprocity. Instead, I am upholding a communal standard of justice. This suggests that reactive attitudes are not merely about protecting personal relationships, but about maintaining a normative order. Strawson assumes the participant stance is grounded in interpersonal involvement, but vicarious attitudes show the stance is actually grounded in shared moral membership. We feel resentment because we belong to the same moral community as the victim, not because we were personally wronged.

  This expansion complicates Strawson's distinction between the participant and objective attitudes. Strawson argues we switch to the objective attitude when someone is incapable of understanding moral demands (e.g., severe mental illness). Yet, with structural blame, we often adopt a participant stance toward entities that literally lack minds, while simultaneously adopting an objective attitude toward the individuals within them. We blame the corporation precisely because the individuals are lost in the bureaucracy, their agency diluted to the point where blaming them feels unfair. This aligns with your suggestion of a compatibilist shift: we blame systems because we cannot locate a free agent inside them.

  Does this weaken Strawson? It weakens his specific claim that responsibility is always personal, but it strengthens his broader claim that we cannot give up reactive attitudes. Even when face-to-face interaction is impossible, we refuse to adopt the objective attitude toward the source of harm. We personify systems to keep holding someone accountable. If we treated corporations purely objectively, we would only seek to fix them, not blame them. But we do blame them. This proves Strawson right about the inevitability of reactive attitudes, even if he was too narrow about their targets.

  Ultimately, admitting vicarious and structural attitudes does not collapse Strawson's view; it universalizes it. It shows that responsibility is less about individual metaphysical freedom and more about where we locate our moral emotions to sustain social order. We drop the requirement that responsibility must be personal, but we keep the requirement that it must be felt. Strawson's framework survives, but it transforms from a theory of interpersonal accountability into a theory of communal moral maintenance. We blame the system not because it is free, but because we cannot bear to live in a world where no one is to blame.
