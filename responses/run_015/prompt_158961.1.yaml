  If I had to put a number on the proposition that Frankfurt cases successfully sever the link between moral responsibility and the principle of alternative possibilities, I would land around 0.65, which puts me squarely in your zone of ambivalence but leaning slightly toward the idea that the cases do their job, provided we are very careful about how we define the job. The reason my number isn't higher, and certainly isn't Maya's 0.9, is that the intuition pump relies on a specific kind of cleanliness that real-world metaphysics rarely affords, and your late-night "rehearsal case" actually exposes a fissure in the standard defense that most philosophers gloss over too quickly. When we look at the flicker-of-freedom strategy, I give it about a 0.4 chance of being a legitimate rescue mission for the Principle of Alternative Possibilities because while it is technically true that the agent retains the possibility of initiating the sequence that triggers the intervener, describing that tiny mental twitch as a morally significant alternative feels like changing the subject from whether she could have done otherwise to whether she could have started a process that would have stopped her from doing otherwise. On the question of whether the setup secretly presupposes determinism, I assign a probability of 0.7 that it does not, because the trigger mechanism can theoretically be based on a prior sign that is itself indeterministic, yet the core of the argument holds that the lack of alternatives at the moment of action is what matters, not the causal history leading up to it. However, if we shift to a reasons-responsiveness account, the probability that the whole alternative-possibilities debate becomes beside the point jumps to 0.85, since these cases seem to demonstrate quite clearly that an agent can be fully responsive to reasons and own their action even in a scenario where they couldn't have chosen differently, suggesting we were asking the wrong question all along. The trustworthiness of the intuitive verdict is where I get shaky, giving it only a 0.5 probability, because there is a strong suspicion that we are simply pattern-matching on the absence of overt coercion and ignoring the subtle modal constraint that the device imposes, effectively smuggling in a form of determinism through the back door of the counterfactual intervener.

  Now, regarding your rehearsal case, which is a fascinating twist that I haven't seen deployed exactly this way in the literature, the existence of the simulation does not grant the real agent an alternative possibility in any sense that saves the traditional principle, so I would put the probability of that granting a robust alternative at roughly 0.1. The simulation is a distinct entity, a counterpart in a sandbox, and the fact that a version of Maya in a computer could have chosen differently does not mean the flesh-and-blood Maya in the bar had the ability to do otherwise; it merely highlights that her type is capable of variation, not that her token instance in the actual world possessed alternate pathways. However, and this is where Maya's dismissal of the case as making "no difference" feels too quick, the rehearsal case does shift the verdict on responsibility, but in a counterintuitive direction that weakens the Frankfurt conclusion rather than strengthening it. By introducing a successful simulation that chose otherwise, you have implicitly admitted that the agent's decision is not fixed by prior states in a way that guarantees the outcome without the device; rather, the device is only necessary because the simulation showed a risk of divergence. This makes the actual intervention seem less like a revelation of a pre-existing lack of freedom and more like a contingent safety net for an agent who genuinely could have gone either way, thereby restoring a shadow of alternative possibility that the standard Frankfurt case tries to erase. In the standard case, we are asked to imagine the predictor is infallible, which pushes us toward thinking the outcome was inevitable; in your rehearsal case, the very need for the simulation admits the outcome was not inevitable until the device ensured it was, which subtly reinstates the idea that the agent had a genuine fork in the road that was closed only by the external mechanism.

  Combining these factors, my total credence is most sensitive to the interpretation of the intuitive verdict, specifically whether we accept the "no coercion, therefore responsible" heuristic as sufficient or whether we demand a deeper modal analysis of the agent's capacities. The gap between your 0.55 and Maya's 0.9 likely stems from how much weight each of you gives to the purity of the thought experiment versus the messiness of its implications; Maya is probably treating the case as a logical proof that isolates responsibility from alternatives, whereas you are sensing that the isolation is artificial and that the "clean" cases are cheating by hiding the determinism in the setup of the intervener. What would move me most is not more empirical evidence, since this is a conceptual terrain, but a rigorous argument that successfully disentangles the agent's actual sequence of deliberation from the counterfactual intervener without relying on the intuition that "she wasn't forced." If someone could demonstrate that the presence of the counterfactual intervener changes the metaphysical status of the actual choice in a way that degrades responsibility, even when the device never fires, it would drop my number significantly; conversely, if a defense could show that the rehearsal case proves the agent's actual sequence is entirely independent of the simulation in a way that preserves the "could have done otherwise" intuition as irrelevant, I might climb closer to Maya's confidence. Until then, the rehearsal case suggests that the Frankfurt strategy works only by stipulating away the very freedom it claims to render unnecessary, leaving us with a verdict on responsibility that feels correct only because we are distracted by the elaborate machinery of the trap rather than the nature of the mouse.
