      *   *Cluster C (Institutional):* How to codify this without making courts do philosophy every time.

  3.  **Evaluate Tractability & Upstream Impact:**
      *   *Cluster A (Boundary):* Deeply metaphysical. "Personal identity" is notoriously intractable. If the group tries to solve the metaphysics of personal identity, they will fail in 3 years. However, law needs *operational* boundaries, not necessarily metaphysical truths.
      *   *Cluster B (Conflict):* This is the core normative conflict. If you can't solve who wins (Past vs. Present), solving the boundary (A) matters less. But B depends on A (if the boundary is crossed, does the past self still have authority?).
      *   *Cluster C (Institutional):* This is the goal (law reform). But you can't design institutions without knowing the normative principles (A & B). However, focusing too much on abstract theory (A) might make C impossible. C needs to be the constraint on A and B.

  4.  **Develop the Strategy (Prioritization):**
