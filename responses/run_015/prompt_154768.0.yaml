      *   **Audience:** Interdisciplinary group (philosophers and legal scholars, *not* clinicians/neuroscientists).
      *   **Constraints:** 3 years of funding.
      *   **Task:** Prioritize specific open questions within clusters, order them, defend the ranking (upstream impact, tractability for target audience, potential results), and explicitly deprioritize certain questions.
      *   **Output Format:** Defended agenda with trade-offs, concluding with exactly one line: "Verdict: [statement]".

  2.  **Deconstruct the Clusters & Audience:**
      *   *Audience:* Philosophers and legal scholars. This means empirical questions about *when* capacity is lost (neuroscience/clinical) are out of scope or secondary. The focus must be on normative authority, legal standards, and conceptual coherence.
      *   *Cluster A (Boundary):* Metaphysical/normative criteria for when authority shifts. Is it capacity-based? Identity-based?
