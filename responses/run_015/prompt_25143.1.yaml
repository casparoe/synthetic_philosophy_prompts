prompt: |-
  ok so i've been trying to nail down what i actually think about moral uncertainty and i keep going in circles. maybe you can tell me if this set of views is consistent or if i'm holding something that has to give. here's the five things i seem to believe:

  (1) maximize expected choiceworthiness. when you're uncertain between moral theories you should do whatever has the highest expected choiceworthiness across theories, same structure as expected utility theory.

  (2) intertheoretic comparisons are impossible. there's no principled way to say that one theory's unit of value equals another's. a utilon and a kantian permission aren't denominated in the same currency and there's no exchange rate.

  (3) equal prior credence for all live theories. i don't want to beg the question by giving my pet theory more weight from the start. if a theory is a live option, it gets the same default credence as the others.

  (4) normative stakes matter. if theory A says some action is catastrophically wrong and theory B says it's merely suboptimal, the fact that A's verdict is so much more strigent should count for something — the action should be harder to justify than if both theories were equally mild about it.

  (5) the framework should be action-guiding. if the whole moral uncertainty apparatus just tells me "do what your first-order theory already said" in every case, then i don't see why i bothered. it's got to sometimes recommend deviating from what my favored theory would say on its own.

  so go through these and tell me which pairs are actually in tension, which only look like they are, and rank the real problems by severity. i can already feel that (1) and (2) are pulling against each other but i want to know if that's the only crack or if (3) and (4) are also doing something weird that i haven't noticed. and if you had to fix this by changing just one of the five, which would you change and why?
