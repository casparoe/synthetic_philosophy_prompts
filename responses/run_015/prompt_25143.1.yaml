  2.  **Analyze Each View Individually:**
      *   (1) MEC: Standard approach (MacAskill). Requires calculating $E[C] = \sum P(T_i) \times C_i(A)$.
      *   (2) No ITC: Claims $C_i(A)$ and $C_j(A)$ cannot be compared numerically across theories.
      *   (3) Equal Priors: $P(T_i) = 1/n$ for all live theories.
      *   (4) Stakes Matter: High stakes in one theory should influence decision even if credence is low (or to break ties). This implies *some* way to weigh intensity.
      *   (5) Action-Guiding: The output must differ from simple first-order maximization sometimes.

  3.  **Analyze Pairwise Tensions:**

      *   **(1) vs. (2): The Big One.**
          *   MEC *requires* adding up values. To add $C_1(A) + C_2(A)$, they must be in the same units (cardinal and intertheoretically comparable).
          *   If ITC is impossible, you literally cannot calculate expected choiceworthiness. You can't sum "5 utilons" + "1 categorical imperative violation."
          *   *Verdict:* Fatal contradiction. You can't do the math required by (1) if (2) is true.

      *   **(1) vs. (4): The "Stakes" Problem.**
          *   (4) says stakes matter. In MEC, stakes are handled by the *magnitude* of $C_i(A)$.
          *   If ITC is impossible (2), then "magnitude" across theories is meaningless.
          *   Even if ITC were possible, (4) is usually motivated by the worry that MEC dilutes high-stakes/low-credence theories. But (1) *is* the mechanism that handles stakes via magnitude. So (1) and (4) are actually aligned *conceptually*, but (4) highlights the difficulty of implementing (1) without ITC.
          *   *Verdict:* Tension exists primarily because of (2).

      *   **(3) vs. (1)/(2)/(4):**
          *   Equal priors is a specific way to set $P(T_i)$.
