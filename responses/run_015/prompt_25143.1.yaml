          *   If stakes matter (4), equal priors might be problematic if one theory is "extreme" (e.g., nihilism vs. extreme demandingness). But this is a secondary issue compared to the ITC problem.
          *   *Verdict:* Not the main source of inconsistency, but interacts with the "action-guiding" requirement.

