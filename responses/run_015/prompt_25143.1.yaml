answer: |-
  This is a very sharp formulation of the problem. You have essentially reconstructed the central debate in the academic literature on moral uncertainty (specifically the work of Will MacAskill, Toby Ord, and Hilary Greaves) but you've hit the exact wall that stops most people.

  You are correct to suspect (1) and (2) are the primary conflict, but the damage is more extensive than just that pair. View (2) is actually a "systemic killer" that renders three of your other views incoherent.

  Here is the breakdown of the tensions, ranked by severity, followed by the recommendation on which view to sacrifice.

  ### The Tensions, Ranked by Severity

  #### 1. The Fatal Contradiction: (1) vs. (2)
  **Severity: Critical / System-Breaking**

  This is the mathematical impossibility at the heart of your set.
  *   **View (1)** requires you to calculate a sum: $\sum [P(\text{Theory}) \times \text{Choiceworthiness}]$.
  *   **View (2)** states that the "Choiceworthiness" variable cannot be standardized across theories.
  *   **The Conflict:** You cannot multiply a probability by a value and then *add* that result to another probability-value pair if the values are in incommensurable units. It is like trying to calculate the expected weight of a bag containing "3 liters" and "5 kilograms."
  *   **Result:** If (2) is true, (1) is literally impossible to compute. You cannot maximize expected choiceworthiness if choiceworthiness is not intertheoretically comparable.

  #### 2. The Conceptual Casualty: (2) vs. (4)
  **Severity: High**

  You might think you can keep (4) (stakes matter) even if you can't do the math of (1), but you can't.
  *   **View (4)** claims that a "catastrophe" in Theory A should weigh heavier than a "suboptimal" verdict in Theory B.
  *   **View (2)** denies there is a common scale to measure "catastrophe" against "suboptimal."
  *   **The Conflict:** For stakes to matter *across* theories, you must be able to say that the magnitude of wrongness in Theory A is $X$ times greater than the magnitude of wrongness in Theory B. If intertheoretic comparisons are impossible, you have no basis for claiming Theory A's stakes are higher. You are left with only ordinal rankings (Better/Worse), which contain no information about *how much* better or worse.
  *   **Result:** If (2) is true, (4) is meaningless. You can only care about stakes *within* a theory, not across them.

  #### 3. The Epistemic Wobble: (3) vs. (1) & (5)
  **Severity: Moderate**

  This is less of a logical contradiction and more of a functional failure.
  *   **View (3)** assigns equal credence to all "live" theories.
  *   **The Conflict:** The definition of a "live theory" is subjective. If you split one theory into two slightly varied sub-theories, you double its weight (the "individuation problem"). Furthermore, if one theory is Nihilism (nothing matters) and another is Utilitarianism (everything matters), equal credence combined with MEC (1) often leads to paralysis or results that violate (5) because the Nihilism theory drags the expected value of *all* actions toward zero.
  *   **Result:** This doesn't break the math, but it makes the output of (1) unstable and arbitrary, threatening the reliability required by (5).

  #### 4. The Desideratum Check: (5) vs. The Rest
  **Severity: Low (Dependent)**

  *   **View (5)** is a success condition, not a mechanism.
  *   **The Conflict:** Currently, (5) is unsatisfied because (1) and (2) prevent you from generating *any* output. If you fix (1) and (2), (5) is usually automatically satisfied (unless one theory has 100% credence).
  *   **Result:** (5) is the victim of the other contradictions, not the cause.

  ---

  ### The Diagnosis

  You are trying to run **Cardinal Software** (Expected Choiceworthiness, Stakes) on **Ordinal Hardware** (No Intertheoretic Comparisons).

  *   **Cardinal** means you care about *magnitudes* (how much better? how wrong?). This is required for (1) and (4).
  *   **Ordinal** means you only care about *rankings* (A is better than B). This is what (2) forces you into.

  You cannot have it both ways. If comparisons are impossible, you must abandon Expected Choiceworthiness. If you want Expected Choiceworthiness, you must admit comparisons are possible.

  ### The Fix: Which One to Change?

  If you must change exactly one view to make the system consistent and functional, **you must drop (2).**

  **Why drop (2) [Intertheoretic comparisons are impossible]?**

  1.  **It saves the most value:** Dropping (2) allows you to keep (1) (MEC), (4) (Stakes), and (5) (Action-Guiding). These three form a coherent, powerful decision-making framework.
  2.  **It is philosophically defensible:** While (2) feels intuitive (Utilons vs. Kantian Duties seem different), most contemporary work in moral uncertainty argues that ITC *is* possible.
      *   **Normalization:** You can normalize theories by setting their "best possible outcome" to 1 and "worst possible outcome" to 0, then scaling everything in between. This creates a common currency.
      *   **Shared Anchors:** Most theories agree on *some* verdicts (e.g., "gratuitous torture is bad"). You can use these overlapping points to calibrate the exchange rate between theories.
  3.  **The alternative is worse:** If you keep (2) and drop (1) instead, you have to switch to an **Ordinal Voting Model** (like the Borda Count).
      *   In a Voting Model, you rank actions according to each theory, and the action with the best average rank wins.
      *   **The Cost:** This forces you to **drop (4)**. Voting models cannot account for stakes. If Theory A says "Action X is slightly rude" and Theory B says "Action X is genocide," a voting model treats these as just "Rank 1 vs Rank 2." The magnitude of the genocide is lost.

  ### Summary of the Revised System

  If you drop (2), your consistent set looks like this:

  1.  **Maximize Expected Choiceworthiness:** (Kept)
  2.  **Intertheoretic comparisons are possible via normalization:** (Changed from "Impossible")
  3.  **Equal Prior Credence:** (Kept, though be wary of the individuation problem)
  4.  **Normative Stakes Matter:** (Kept, now mathematically supported by cardinal values)
  5.  **Action-Guiding:** (Kept, now computable)

  **Final Advice:**
  The intuition behind (2) is strong, but it is a "stopper." It halts all moral reasoning under uncertainty. To get the action-guiding, stakes-sensitive framework you want in (1), (4), and (5), you have to bite the bullet and accept that there is *some* principled way to map the value systems of different theories onto a common scale, even if that scale is constructed rather than discovered.
