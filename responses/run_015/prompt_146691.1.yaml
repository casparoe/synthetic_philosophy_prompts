  **MERELOGYKIT™ END-USER LICENCE AGREEMENT**

  **PREAMBLE**
  By opening this packaging, the Customer enters into a binding ontological contract with MereologyKit™ Ltd. Acceptance of these terms constitutes a commitment to a specific theory of composition. Failure to adhere to the metaphysical constraints outlined below may result in the spontaneous disassembly of reality within the immediate vicinity of the Product.

  **1. DEFINITIONS AND ONTOLOGICAL STATUS**
  1.1. The "Product" refers herein to the collection of simples arranged kit-wise contained within the cardboard packaging. MereologyKit™ Ltd. makes no guarantee that these simples compose a singular entity prior to assembly.
  1.2. The "Customer" acknowledges that existence is contingent upon successful composition conditions being met during the assembly process.
  1.3. "Assembly" is defined as the arrangement of parts such that they satisfy the functional bonding relation required for objecthood.

  **2. WARRANTY OF EXISTENCE**
  2.1. MereologyKit™ Ltd. warrants that upon successful assembly, a composite object shall exist.
  2.2. **Exclusion of Liability:** This warranty is void if the parts fail to achieve functional bonding. Mere spatial proximity does not constitute composition. If the Customer arranges parts in a heap without fastening, no object exists, and no warranty claim regarding structural failure will be entertained, as there is no structure to fail.
  2.3. In the event of loose screws, the Customer must determine whether the screw is a proper part of the Unit or a distinct entity occupying the same region. Ambiguity regarding parthood is not covered under Section 2.1. The burden of proof regarding the transitivity of parthood lies solely with the Customer.

  **3. UNRESTRICTED COMPOSITION CLAUSE**
  3.1. Should the Customer adhere to the principle of Unrestricted Composition, they acknowledge that any plurality of parts constitutes an object.
  3.2. Consequently, the Customer accepts liability for the existence of all accidental objects formed during assembly, including but not limited to: the Unit, the Unit-minus-one-screw, and the fusion of the Unit and the Customer's left shoe.
  3.3. MereologyKit™ Ltd. cannot warrant the durability of infinite overlapping objects. Claims regarding the disintegration of the Unit-while-wearing-shoe are denied. The Customer agrees to indemnify the Manufacturer against claims arising from the accidental creation of hazardous composite entities, such as the fusion of the Product and local fauna.

  **4. THE BRUNDLE AMENDMENT**
  4.1. Following Incident Report #734, wherein two Users assembled distinct Units sharing a central support beam, the following arbitration applies.
  4.2. The shared beam shall not be treated as a common property dispute. Instead, Users must submit to temporal parts arbitration.
  4.3. If the shared beam exists at time T1 and T2, Users must declare whether the beam constitutes one persisting object gaining and losing parts, or two successive objects with distinct temporal boundaries.
  4.4. Failure to agree on diachronic identity results in the nullification of both Units. The beam will be reclassified as a simple without owners. Users are prohibited from claiming ownership of temporal slices exceeding forty-eight hours in duration without a extended warranty purchase.

  **5. REFUND POLICY AND NIHILIST APPENDIX**
  5.1. Refunds are processed based on the Customer's metaphysical commitment.
  5.2. **Standard Claim:** If the Customer believes composite objects exist, a refund is issued upon return of the assembled Unit.
  5.3. **Nihilist Claim:** If the Customer asserts that no composite objects exist, they acknowledge that no Product was ever purchased. Therefore, no refund is possible, as nothing was sold. The Customer retains the simples arranged refund-form-wise.
  5.4. MereologyKit™ Ltd. denies responsibility for the existential anxiety resulting from the realization that neither the Customer nor the Currency exists as a composite whole. Transactions involving non-existent entities are final.

  **6. VAGUENESS AND TROUBLESHOOTING**
  6.1. If it is indeterminate whether a part belongs to the Unit or the environment, the Customer must suspend assembly.
  6.2. Do not force composition where boundaries are vague. Forcing a part into a whole where identity conditions are unclear may result in ontological instability. Contact support if the boundary of the object becomes soritical.

  **7. GOVERNING LAW**
  7.1. This agreement is governed by the laws of classical logic, excluding intuitionist deviations.

