  ### Honest Assessment for the Scene

  Her view is **not bulletproof**, but it is **well-insulated**.

  1.  **Vitalism Charge:** Her position is functionally identical to 19th-century vitalism (the idea that life requires a special "élan vital" that chemistry lacks). Just as vitalism fell when urea was synthesized, her view falls if we replicate neural causal powers physically. She avoids this by claiming we *can't* replicate them with silicon, but she lacks a physical theory explaining *why*.
