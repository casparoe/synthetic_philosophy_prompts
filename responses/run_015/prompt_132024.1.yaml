  3.  **The "Biology" Loophole:** The weakest point is her definition of biology. If we build a synthetic organism that evolves, metabolizes, and reproduces using non-carbon chemistry, her "carbon-based" constraint breaks. She would have to retreat to "causal powers," which invites the question: "Why can't silicon have those powers?"
