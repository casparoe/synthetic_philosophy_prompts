  **Verdict:** She can win every argument by defining terms narrowly enough, but she loses the room on **parsimony**. She posits a mysterious, unmeasurable property intrinsic to biology. In a novel, this makes her compelling but tragically isolated—she holds a truth that can never be proven, only believed.
