prompt: |-
  I teach an upper-level undergraduate seminar on democratic theory, and next week I have one 75-minute session with 18 students on the Condorcet jury theorem. Some context: I have just come out of a very long argument with a close friend — a mathematician — who maintains that the theorem is a simple, unconditional result: if each voter is even slightly more likely to be right than wrong, then sufficiently large majorities are essentially infallible, and everything else is noise. I kept replying that the premises do all the work — competence strictly above one half, independence of errors, a binary choice with an objective fact of the matter — and that the theorem says nothing about experts, wisdom, or value disagreements; but I never got him to feel it. I want my students to feel it, in the room, before we read the formal statement.

  Design the session as a game they play rather than a lecture they receive. My sense is that it needs at least three phases: one in which each student's individual accuracy is engineered to sit just above chance on binary questions with verifiable answers, so the class can watch majority accuracy climb as the electorate is enlarged (perhaps by having students generate independent "clone" voters whose answers are drawn from their own error rates); one in which individual accuracy is unchanged but the errors are correlated — questions built on a misconception the whole room happens to share — so that the majority is confident and wrong; and one in which accuracy sits just below chance, so that adding voters actively drives the majority away from the truth. But I am open to a better structure if you see one.

  Please provide: concrete rules and materials, including how to make individual accuracy tuneable without the students realizing it is being tuned; a payoff scheme that involves no real money; a way of recording and displaying results so the pattern is visible in real time; and a debrief that maps specific moments in the game onto the theorem's premises and onto my friend's overreach. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which features of the theorem no classroom game can reproduce — a genuinely large electorate, sincere rather than strategic voters, questions where "correct" is not contestable — so that I know where the activity ends and I have to supply the rest by talking.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduate seminar (Democratic Theory). 18 students.
      *   **Topic:** Condorcet Jury Theorem (CJT).
      *   **Duration:** 75 minutes.
      *   **Goal:** Move beyond formal proof to *intuition*. Specifically, address the tension between the instructor's view (premises matter: competence > 0.5, independence, binary truth) and the mathematician friend's view (it's unconditional, large majorities are infallible).
      *   **Format:** Game/Simulation, not lecture.
      *   **Required Phases:**
          1.  Competence > 0.5 + Independence $\rightarrow$ Majority improves with size.
          2.  Competence > 0.5 + Correlated Error $\rightarrow$ Majority fails (systematic bias).
          3.  Competence < 0.5 $\rightarrow$ Majority worsens with size (anti-expertise).
      *   **Requirements:** Concrete rules, materials, tunable accuracy (hidden), payoff scheme (no money), real-time display, debrief mapping game to theory, troubleshooting/pitfalls, limitations of the simulation.

  2.  **Deconstruct the Challenge:**
      *   *The "Hidden Tuning" Problem:* How do I make students 55% accurate without them knowing? I can't just tell them "try to be 55% accurate." I need to manipulate the *difficulty* of the questions or the *information* they receive.
      *   *The "Independence" Problem:* In a classroom, students talk. They look at each other. Correlation is the default, independence is the hard part.
      *   *The "Truth" Problem:* Democratic theory often deals with values, but CJT requires objective truth. I need questions with undeniable answers but where students might feel unsure.
      *   *The "Clone" Idea:* The prompt suggests generating "clone" voters. This is computationally easy but might feel artificial. A better approach for 18 students is to use the 18 students as the base, but manipulate the *aggregation* or the *input* they get. Actually, for Phase 1, I need to simulate $N$ growing. With only 18 students, I can't grow the electorate physically. I need to simulate sub-groups or use the "clone" idea digitally. Let's refine: Use the 18 students as the "pool," but run multiple rounds where we aggregate different subset sizes.
      *   *Refined Strategy for Phase 1:* Run many rounds of binary questions. Calculate individual accuracy. Then, *post-hoc* or *live*, show what happens if we group them by 3, 5, 9, 17.
      *   *Refined Strategy for Phase 2 (Correlation):* Introduce a "common signal" that is misleading.
      *   *Refined Strategy for Phase 3 (Competence < 0.5):* This is hard to engineer naturally. I might need to rig the questions so the intuitive answer is wrong (trick questions) or simply invert the scoring rule for a specific round to demonstrate the math.

  3.  **Developing the Game Mechanics:**
      *   **Name:** "The Truth Seekers" or "Jury Duty." Let's go with "The Verdict."
      *   **Tools:** Clickers or phones (Poll Everywhere, Mentimeter, Slido). Essential for real-time data.
      *   **Currency:** "Epistemic Credits" (EC). Winner gets a tangible but low-stakes reward (e.g., choice of reading, candy, or just bragging rights).
      *   **Questions:** Need binary (True/False) questions with objective answers. General knowledge works, but needs to be calibrated.
      *   **Tuning Accuracy:**
          *   *Phase 1 (Independence/Competence):* Use questions that are slightly hard but fair. Expect ~60% accuracy.
          *   *Phase 2 (Correlation):* Use a question where a common heuristic fails (e.g., "Which city is further north?" where climate misleads). Or, give them a "Hint" that is confidently wrong.
          *   *Phase 3 (Incompetence):* This is the trickiest. If I ask hard questions, accuracy drops. If I ask questions where the "obvious" answer is wrong, accuracy drops. Let's use the "Hint" mechanism again but make it universally misleading, or simply select questions known to have high error rates (cognitive biases).

  4.  **Drafting the Session Plan (75 mins):**
      *   **Intro (5 mins):** Set stakes, explain rules.
      *   **Phase 1: The Ideal Jury (20 mins):** Independent votes, fair questions. Show aggregation.
      *   **Phase 2: The Echo Chamber (20 mins):** Correlated errors.
      *   **Phase 3: The Anti-Expert (15 mins):** Competence < 0.5.
      *   **Debrief (15 mins):** Map to CJT premises.

  5.  **Addressing Specific Constraints:**
      *   *Tunable Accuracy:* I will curate the question bank. I need to pre-test questions or select known "trick" questions.
      *   *Clone Voters:* Since I only have 18 students, I cannot physically grow the electorate to "infinity." I must simulate the *math* of aggregation. I will use a spreadsheet projected on screen. As they vote, I input their votes. Then I run a simulation script that uses *their* observed accuracy rate to simulate 100, 1000, 10000 voters. This bridges the gap between 18 students and the theorem's limit.
      *   *Payoff:* Points for individual accuracy + points for majority accuracy. This creates tension between being right and the group being right.
      *   *Display:* Projected spreadsheet. Columns for Student ID, Vote, Correct Answer, Cumulative Majority.

  6.  **Troubleshooting & Limitations:**
      *   *Risk:* Students collude. *Fix:* Strict "no talking" during voting phases.
      *   *Risk:* Questions are too easy (100% accuracy) or too hard (random). *Fix:* Have a large bank and pick mid-difficulty.
      *   *Risk:* Phase 3 feels rigged. *Fix:* Be transparent in debrief that the questions were selected for bias.
      *   *Limitation:* CJT assumes sincere voting. Students might game the points.
      *   *Limitation:* CJT assumes binary truth. Politics isn't binary.

  7.  **Refining the "Clone" Mechanism (Crucial Step):**
      *   The prompt asks for students to generate independent "clone" voters.
      *   *Idea:* Each student represents a "type" of voter. After Phase 1, we calculate each student's personal $p$ (probability of being correct).
      *   *Simulation:* Use a simple Python script or Excel macro live in class. Input the 18 students' actual votes from Round 1. Calculate the group $p$. Then run a Monte Carlo simulation: "If we had 1,000 voters with this same average competence, what is the probability the majority is right?"
      *   *Better Idea for "Feeling It":* Don't just simulate. *Group* the 18 students.
          *   Round 1: Individual votes.
          *   Round 2: Group into 6 groups of 3. Majority of 3 decides.
          *   Round 3: Group into 3 groups of 6. Majority of 6 decides.
          *   Round 4: One group of 18.
          *   *Problem:* This doesn't show the *limit* behavior well.
      *   *Best Compromise:* Use the 18 students to establish the *competence parameter* ($p$). Then use a projected simulation to show the *theorem* taking that $p$ to infinity. This respects the "game" aspect (they provide the data) while acknowledging the physical limit of the classroom.

  8.  **Finalizing the Plan Structure:**
      *   **Preparation:** Question bank (Easy/Medium/Trick), Spreadsheet, Projection.
      *   **Phase 1 (Independence):** 10 Binary Questions. Calculate individual $p$. Show that Majority > Individual. Run Simulation based on their $p$.
      *   **Phase 2 (Correlation):** 5 Questions with a "Common Signal" (e.g., a fake news headline or a misleading visual). Show Majority fails despite high confidence.
      *   **Phase 3 (Incompetence):** 5 Questions where the intuitive answer is systematically wrong (Cognitive Bias questions). Show Majority < Individual.
      *   **Debrief:** Connect to Friend's argument.

  9.  **Writing the Response:**
      *   Tone: Professional, pedagogical, empathetic to the instructor's frustration.
      *   Detail: Specific questions, specific spreadsheet formulas, specific script logic.
      *   Honesty: Admit where the game fails (values, strategy).

      *(Self-Correction during drafting)*: Wait, if I use a simulation for the "large electorate," does it feel like a game?
      *Adjustment:* Make the simulation part of the game. "The Oracle." After every 5 questions, the Oracle predicts the outcome of a virtual electorate of 10,000 based on *current* class performance. If the Class Majority matches the Oracle's prediction of the Virtual Majority, everyone gets bonus points. This ties their physical voting to the theoretical limit.

      *(Refining Phase 3)*: How to ensure $p < 0.5$?
      *   Option A: Ask impossible questions. (Too frustrating).
      *   Option B: Tell them "The correct answer is the opposite of your intuition." (Too explicit).
      *   Option C: Use the "Monty Hall" effect or specific optical illusions where human perception is reliably wrong. Let's go with Cognitive Bias questions (e.g., Conjunction Fallacy, Anchoring). Or, simpler: Instruct them that for this round, "True" means "False" on the sheet (Inversion). No, that's confusing.
      *   *Best:* Use questions where the "common sense" answer is demonstrably false. E.g., "Does a heavier object fall faster than a lighter one (in vacuum)?" Most say Yes (Wrong). If I curate 10 of these, average $p$ will be < 0.5.

      *(Refining Payoff)*: No money. "Epistemic Merit." Top scorer chooses the discussion topic for the next week or gets a small treat. Let's suggest "Choice of Seminar Topic" or "Exemption from one response paper."

      *(Refining the "Friend" argument)*: Ensure the debrief explicitly names the premises: Competence, Independence, Binary Truth.

  10. **Final Review against constraints:**
      *   75 mins? Yes.
      *   18 students? Yes.
      *   3 Phases? Yes.
      *   Tunable accuracy? Yes (via question selection).
      *   Real-time display? Yes (Spreadsheet).
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

      *Let's build the response.*
answer: |-
  This is a brilliant pedagogical challenge. You are trying to teach the *fragility* of a theorem that looks *robust* on paper. Your friend sees the limit behavior ($\lim_{n \to \infty}$); you see the boundary conditions ($p > 0.5$, $\rho = 0$).

  To make the students "feel" this, they need to experience the transition from the theorem holding to the theorem breaking, without you simply telling them the parameters changed.

  Here is a complete lesson plan for **"The Verdict."**

  ---

  ### **Session Overview**
  *   **Time:** 75 Minutes
  *   **Students:** 18
  *   **Materials:**
      *   Projector with a live spreadsheet (Google Sheets or Excel).
      *   Student devices (phones/laptops) for voting (or physical clickers).
      *   A pre-prepared question bank (see below).
      *   A simple script or macro (I will provide the logic) to simulate the "Virtual Electorate."
  *   **Currency:** "Epistemic Credits" (EC).
      *   **Payoff:** The student with the most ECs at the end chooses the discussion topic for the next seminar (or gets a small tangible reward like a book/chocolate).
      *   **Scoring:** 1 EC for a correct individual vote; 5 ECs for every round where the *Majority* is correct (shared by all). This aligns individual incentive with collective competence.

  ---

  ### **Phase 0: Setup (5 Minutes)**
  **The Hook:** Tell the class: "We are testing a hypothesis: Is a crowd smarter than the smartest person in it? You are the voters. There is an objective truth for every question. Your goal is to maximize your Epistemic Credits."

  **The Display:** Project a spreadsheet with 18 rows (Student IDs 1–18) and columns for Round 1, Round 2, etc. A separate panel shows "Current Majority Accuracy" and "Virtual Electorate Prediction."

  ---

  ### **Phase 1: The Ideal Jury (20 Minutes)**
  **Goal:** Demonstrate $p > 0.5$ + Independence $\rightarrow$ Majority Accuracy $\uparrow$ as $N \uparrow$.

  **Mechanism:**
  1.  **Questions:** 10 Binary (True/False) General Knowledge questions.
      *   *Tuning:* Pre-test these. You want an average difficulty where the class accuracy hovers around **60–65%**. Not too easy (100%), not random (50%).
      *   *Examples:* "The capital of Australia is Sydney (F)", "Lightning never strikes the same place twice (F)", "Vikings wore horned helmets (F)."
  2.  **Procedure:**
      *   Students vote privately on devices.
      *   You enter votes into the spreadsheet live.
      *   **The "Clone" Simulation:** After every 2 questions, run a macro. The macro takes the *current observed class accuracy rate* (e.g., 62%) and runs a Monte Carlo simulation of 10,000 voters with that same competence level.
      *   **Display:** Show a bar chart: "Actual Class (N=18) Accuracy" vs. "Virtual Jury (N=10,000) Accuracy."
      *   **Result:** The Virtual Jury bar should be near 100%. The Class Majority should be higher than the average individual score.
  3.  **The Feeling:** Students see that even though they make mistakes, the "Virtual Jury" based on their performance is nearly infallible. This validates your friend's intuition *under these specific conditions*.

  ---

  ### **Phase 2: The Echo Chamber (20 Minutes)**
  **Goal:** Demonstrate $p > 0.5$ + Correlated Error ($\rho > 0$) $\rightarrow$ Majority Accuracy collapses.

  **Mechanism:**
  1.  **Questions:** 5 Binary questions where there is a **common misleading signal**.
      *   *Tuning:* You need questions where the error is systematic, not random.
      *   *Technique:* Provide a "Briefing Note" before this phase. "To assist you, we are providing a hint from a trusted source for these questions."
      *   *The Trick:* The hint is confidently wrong.
      *   *Example:* Show a map projection that distorts size. Ask: "Is Greenland larger than Africa?" (Hint says: "Trust the visual scale provided"). Or use a "Fake News" headline style prompt that leverages a common misconception (e.g., "Napoleon was extremely short" – True/False? The common myth says True, reality is False).
  2.  **Procedure:**
      *   Students vote. Because they all received the same misleading hint, their errors are now correlated.
      *   **The Simulation:** Run the same macro. It calculates the *observed* accuracy (which might still be >50% individually for some) but the *Majority* will be wrong consistently.
      *   **Display:** The "Virtual Jury" prediction will crash. Even with infinite voters, if they all share the same bias, the majority is 100% wrong.
  3.  **The Feeling:** Confidence remains high (because everyone agrees), but accuracy plummets. The "infallibility" vanishes.

  ---

  ### **Phase 3: The Anti-Expert (15 Minutes)**
  **Goal:** Demonstrate $p < 0.5$ $\rightarrow$ Majority Accuracy $\downarrow$ as $N \uparrow$.

  **Mechanism:**
  1.  **Questions:** 5 Binary questions based on **cognitive biases** where human intuition is reliably worse than chance.
      *   *Tuning:* You need average accuracy < 50%.
      *   *Technique:* Use questions that trigger the Conjunction Fallacy or Anchoring.
      *   *Example:* The "Linda Problem" (Is Linda a bank teller OR a bank teller and feminist?). Most pick the conjunction (wrong). Frame it as a binary vote.
      *   *Alternative:* Simply invert the scoring rule secretly? No, that feels like cheating. Better to use questions where the "obvious" answer is factually incorrect.
      *   *Example:* "Does a pound of feathers weigh more than a pound of lead in a vacuum?" (Intuition: Lead. Truth: Equal). If you curate 5 of these "trick" physics/logic questions, average competence will drop below 0.5.
  2.  **Procedure:**
      *   Students vote.
      *   **The Simulation:** Run the macro.
      *   **Display:** Show that as the Virtual Electorate grows, the probability of the *Majority* being correct approaches **0%**.
      *   **Twist:** Tell them: "In this phase, the rational strategy is to vote against your own judgment." (This introduces the concept of inverted competence).
  3.  **The Feeling:** Adding more people makes the decision *worse*. The crowd is not just wise; it can be dangerously confident in the wrong direction.

  ---

  ### **Debrief & Mapping (15 Minutes)**
  **Do not lecture immediately.** Ask them:
  1.  "In Phase 1, why did the Virtual Jury win?"
  2.  "In Phase 2, what changed? Did you become less smart individually?" (No, competence stayed same, independence broke).
  3.  "In Phase 3, what happens to democracy if the average voter is systematically biased?"

  **Map to the Theorem (The "Friend" Rebuttal):**
  Draw three columns on the board: **Premise**, **Phase 1**, **Phase 2/3**.

  | Premise | Friend's Claim | Your Reality (The Game) |
  | :--- | :--- | :--- |
  | **Competence ($p > 0.5$)** | "Voters are slightly better than chance." | Phase 1: Yes. Phase 3: No ($p < 0.5$). If $p < 0.5$, more voters = disaster. |
  | **Independence ($\rho = 0$)** | "Errors cancel out." | Phase 2: No. Common media/culture creates correlated error. Errors compound, not cancel. |
  | **Binary Truth** | "There is a right answer." | Real politics often lacks objective truth (values vs. facts). |

  **Closing Argument:** "My friend is mathematically right about the *limit*, but politically wrong about the *premises*. The theorem doesn't prove democracy works; it proves democracy works *only if* we maintain independence and competence. The work of democracy is maintaining those premises, not just counting votes."

  ---

  ### **Technical Implementation: The Spreadsheet & Macro**
  You need a Google Sheet projected on screen.

  **Columns:**
  *   A: Student ID (1-18)
  *   B: Vote (1 for True, 0 for False)
  *   C: Correct Answer (Hidden column, 1 or 0)
  *   D: Individual Score (1 if B=C, else 0)
  *   E: Cumulative Individual Accuracy (Average of D)
  *   F: Majority Vote (If Sum(B) > 9 then 1 else 0)
  *   G: Majority Correct? (1 if F=C, else 0)

  **The "Virtual Jury" Script (Google Apps Script or Excel Macro):**
  *   *Input:* Read `Cumulative Individual Accuracy` ($p$).
  *   *Logic:* Calculate Probability(Majority Correct) for $N=10,000$ using the normal approximation to the binomial distribution.
      *   Mean = $N \times p$
      *   Std Dev = $\sqrt{N \times p \times (1-p)}$
      *   Z-score for majority threshold ($N/2$).
      *   Look up Cumulative Distribution Function.
  *   *Output:* Display this probability as a percentage on the main screen.
  *   *Phase 2 Adjustment:* Manually override the script to show "Error Correlation Detected: Prediction Unreliable" or simply let the actual class majority fail while the script (assuming independence) predicts success, highlighting the divergence. *Better:* For Phase 2, disable the script and ask them to predict. Then reveal the failure.

  ---

  ### **Troubleshooting: What Will Go Wrong**
  1.  **The "Too Easy" Problem:**
      *   *Risk:* You pick Phase 1 questions that are too easy. Class gets 95% accuracy.
      *   *Fix:* The theorem is less impressive if $p$ is already near 1. Have 5 "backup" harder questions ready to swap in if you see hands shooting up too fast.
  2.  **The "Collusion" Problem:**
      *   *Risk:* Students look at neighbors' screens in Phase 1. This creates correlation prematurely.
      *   *Fix:* Enforce "Heads Down" during voting. Remind them that collusion reduces the "Epistemic Credits" payout for the group.
  3.  **The "Phase 3 Cynicism" Problem:**
      *   *Risk:* Students feel rigged in Phase 3 and disengage.
      *   *Fix:* Be transparent in the debrief. "I selected questions where human intuition is known to fail. This models systemic bias, not stupidity."
  4.  **The "N=18" Problem:**
      *   *Risk:* 18 students isn't enough to show the *law of large numbers* visually. The majority might fluctuate wildly.
      *   *Fix:* This is why the **Virtual Jury simulation** is critical. The 18 students provide the *parameter* ($p$); the computer shows the *limit* behavior. Do not rely on the 18 students alone to prove the convergence.

  ---

  ### **Honest Limitations: Where the Game Ends**
  You must tell your students (and acknowledge to yourself) where this simulation cannot go, so you can fill the gap with lecture.

  1.  **Sincere vs. Strategic Voting:**
      *   *Game:* Students vote for points/truth.
      *   *Reality:* Voters vote for interests, identity, or strategy. CJT assumes sincere truth-seeking. If voters strategize, the theorem breaks.
  2.  **Objective Truth:**
      *   *Game:* Binary facts (Capital cities, physics).
      *   *Reality:* Most democratic decisions are about *values* (Tax rates, war, rights). There is no "correct" answer to "Should we raise taxes?" only "preferred." CJT cannot justify value decisions, only factual ones.
  3.  **Competence Homogeneity:**
      *   *Game:* We treat average $p$ as the metric.
      *   *Reality:* Some voters have $p=0.9$, some $p=0.4$. Weighted voting (experts) might outperform CJT, but violates "one person, one vote."
  4.  **The "Friend's" Blind Spot:**
      *   Your friend treats $p > 0.5$ as a natural state of nature. You must emphasize that $p > 0.5$ is an **achievement** of institutions (education, free press, deliberation), not a default. If the information environment rots, $p$ drops below 0.5, and the theorem becomes a theorem of tyranny.

  ### **Final Tip for the Instructor**
  When you debrief your friend later, don't argue the math. Argue the **parameters**.
  *"You are right that IF $p > 0.5$ and $\rho = 0$, THEN the crowd is infallible. My class proved that. But they also proved that if $\rho > 0$ (Phase 2) or $p < 0.5$ (Phase 3), the crowd is confidently wrong. The political work isn't counting the votes; it's ensuring the premises hold."*

  This structure gives you the empirical evidence to win the argument without ever opening a textbook during the seminar.
