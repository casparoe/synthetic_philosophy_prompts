answer: |-
  ### The Principle of Non-Alienated Sovereign Necessity

  To capture your verdicts across these five cases, I propose the **Principle of Non-Alienated Sovereign Necessity**. This principle holds that an act involves "dirty hands" if and only if it satisfies three cumulative clauses:

  1.  **Existential Necessity:** The wrongdoing must be strictly necessary to preserve the fundamental political order or prevent catastrophic harm to the public, rather than to advance partisan interests or specific policy projects.
  2.  **Non-Alienation of Authority:** The means employed must not commodify, sell, or subvert the source of the agent's authority (the office or mandate itself); the act must exercise power tragically, not undermine the legitimacy of the power holder.
  3.  **Personal Ownership:** The agent must consciously accept the moral violation as a personal burden of their specific agency, rather than diffusing responsibility through collective procedure or party discipline.

  ### Application to Your Verdicts

  This principle successfully organizes your five judgments without requiring me to overturn any of them, though it places significant pressure on the distinction between Case 4 and Case 5.

  *   **Case 1 (Torture):** **Dirty Hands.**
      *   *Motivation:* Satisfies **Existential Necessity** (imminent attack threatens the order) and **Personal Ownership** (secret authorization). It passes **Non-Alienation** because torture, while a rights violation, is an exercise of state power, not a sale of the office itself.
  *   **Case 2 (Austerity):** **Not Dirty Hands.**
      *   *Motivation:* Fails **Existential Necessity**. Voting for unjust policy out of "party solidarity" serves a partisan or careerist end, not the survival of the political order. It also fails **Personal Ownership**, as you correctly identify it as "complicity" where responsibility is diffused into the party line.
  *   **Case 3 (Revolutionary Executions):** **Dirty Hands.**
      *   *Motivation:* Satisfies **Existential Necessity** (securing democratic order against restoration). Although you note it feels structurally different from Case 1, this principle unifies them under "preservation of order"—Case 1 is *routine* sovereignty (emergency), Case 3 is *foundational* sovereignty (regime creation). Both pass **Non-Alienation** because the revolutionary leader is establishing authority, not subverting an existing mandate.
  *   **Case 4 (Bribe for Clinic):** **Not Dirty Hands.**
      *   *Motivation:* Fails **Non-Alienation of Authority**. While the end is public (clinic), the means (bribery) commodifies the office. It turns public authority into a private market transaction. This is corruption because it destroys the integrity of the governance mechanism itself, rather than tragically exercising it.
  *   **Case 5 (Diplomatic Deceit):** **Dirty Hands.**
      *   *Motivation:* Satisfies **Existential Necessity** (preventing war) and **Personal Ownership**. Crucially, it passes **Non-Alienation** because diplomatic discretion is inherent to the office; deceiving an external ally does not subvert the domestic source of the diplomat's authority (the electorate or constitution) in the way bribery or election fraud does.

  ### Honesty on Consistency and Overturning

  I do not need to overturn any of your five verdicts to make this principle work, but I must be honest about the tension between **Case 4** and **Case 5**. Both involve deception/corruption for a public good. The principle relies on a sharp distinction between *external* deceit (diplomacy, which preserves the state) and *internal* corruption (bribery, which rots the state). If one argues that systematic deceit to an ally (Case 5) eventually undermines trust in the government just as much as bribery (Case 4), the principle would force us to reclassify Case 5 as Corruption. However, adhering to your verdict requires maintaining the realist distinction: foreign policy operates in a realm where deceit is a tool of the office, whereas domestic governance relies on procedural integrity. I uphold your verdict, but acknowledge this is the principle's stress point.

  ### Prediction on Case 6

  **Case:** *A democratically elected leader secretly falsifies election data to block an authoritarian victory, then confesses and resigns.*

  **Verdict:** **Not Dirty Hands (Corruption/Usurpation).**

  **Reasoning:**
  This case fails the **Non-Alienation of Authority** clause. While the leader satisfies **Existential Necessity** (blocking authoritarianism saves the order) and **Personal Ownership** (confessing and resigning accepts the burden), the means fundamentally subvert the source of their authority.

  Unlike Case 1 (torture) or Case 5 (diplomacy), where the agent uses the *powers* of the office to save the state, falsifying election data destroys the *legitimacy* of the office itself. In Case 3 (Revolution), the leader is establishing a new order where rules are fluid; in Case 6, the leader is operating within an established constitutional order. To save democracy by destroying the democratic mechanism (elections) is a performative contradiction that alienates the mandate. The confession and resignation mitigate the *guilt*, but they do not change the *category* of the act. It remains corruption of the political process, not the tragic exercise of sovereign power. The hands are not just dirty; the mandate is void.
