  1.  **Analyze the User's Request:**
      *   **Context:** A dinner discussion about personal identity.
      *   **Friend's Argument:** Origin Essentialism (specifically, Kripkean-style necessity of origin). Analogy: A person is like a specific painting (Mona Lisa); different materials (sperm/egg vs. pigments/canvas) mean a different entity.
