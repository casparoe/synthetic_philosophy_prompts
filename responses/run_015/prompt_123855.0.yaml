      *   *Move 5 (Marta):* Fix the circularity by weighting values by probability of being affected *given* the specification. Accounts for driven-away students.
          *   *Critique:* Theoretically clever, but operationally impossible. How do you calculate counterfactual probabilities of usage?
          *   *Verdict:* Mostly Right (theoretically), Clearly Wrong (practically). It solves the logic but breaks the implementation.

      *   *Move 6 (Dev):* That's just status quo with a formula. Self-confirming bias. Bandwidth/time aren't moral weights.
