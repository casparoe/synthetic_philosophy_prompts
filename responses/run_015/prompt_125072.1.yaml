prompt: |-
  I'm a novelist — crime-ish stuff set in a made-up Midlands town — and the book I'm halfway through has a strand where the town has to decide what to do with a statue of a Victorian factory owner whose money built the library, the baths and about a third of the street names. My drafts keep flattening into a speech about history, which is boring and not how it actually goes in a parish council room.

  So: I run a fortnightly writting group, 12 adults (mostly retirees, two sixth-formers), two hours on a Tuesday evening, a room with a flipchart and no tech. Design me an exercise that makes them *feel* the thing I'm after, which is that arguments about commemoration are mostly arguments about plumbing, insurance and who has to say the name out loud. Two notions I've been kicking about and want embedded in the rules rather than explained: the 'enunciation burden' — the people forced to repeat a contested name (on forms, giving directions, reading out a prize citation) are rarely the people it injures, and rarely the people who care what it means; and 'referential drift', the way a name stops being about the man once it's a bus stop and a postcode, which is an argument for leaving street names alone that does nothing for statues. I'd also like the trap where adding an explanatory plaque to atone for a monument just makes the monument more thoroughly about him, not less.

  No lecture up front, and they shouldn't hear any of those labels until afterwards. Give me the roles, the rounds, the stakes (nothing that needs real money), and a debrief that maps what happened onto the ideas. Say plainly what will predictably go wrong the first time I run it — half of them will want to debate whether the man was wicked — and be honest about which part of this the exercise can't reach and I'll have to put in the characters' mouths myself. Finally, tell me how confident you are that it'll actually land that way, and single out the bit you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested writing exercise:

  1.  **Analyze the Request:**
      *   **User:** Novelist (crime-ish, fictional Midlands town).
      *   **Problem:** Drafts of a plot strand (controversial statue) are flattening into boring historical speeches. Needs to feel like a real parish council meeting (bureaucratic, mundane, practical).
      *   **Core Theme:** Arguments about commemoration are actually about plumbing, insurance, and "enunciation burden."
      *   **Key Concepts to Embed (without naming them initially):**
          *   *Enunciation Burden:* Who has to say the name? (Not the injured, not the carers).
          *   *Referential Drift:* Names become functional (bus stops, postcodes) vs. symbolic (statues).
          *   *The Plaque Trap:* Explaining the monument reinforces the monument.
      *   **Constraints:**
          *   Writing group: 12 adults (mostly retirees, 2 sixth-formers), 2 hours, Tuesday evening.
          *   Resources: Room, flipchart, no tech.
          *   Format: Roles, rounds, stakes, debrief.
          *   No lecture up front.
          *   Must predict failure modes (e.g., debating morality).
          *   Must admit limitations (what the exercise *can't* do).
          *   Confidence rating + least sure element.

  2.  **Deconstruct the Core Theme for an Exercise:**
      *   To avoid "history speeches," the exercise needs to force participants into *administrative* roles, not *moral* ones.
      *   To simulate "Enunciation Burden," someone needs to be forced to *use* the name repeatedly in a functional context.
      *   To simulate "Referential Drift," the name needs to be attached to something mundane (a drain, a shed) vs. something symbolic (the statue).
      *   To simulate "The Plaque Trap," they need to try to fix the problem with text and realize it makes it worse.

  3.  **Drafting the Exercise Structure:**
      *   *Title:* Needs to sound bureaucratic but slightly ominous. "The Asset Management Working Group."
      *   *Setup:* The town council owns a building named after the controversial figure. It needs repairs.
      *   *Roles:* Not "Pro-Statue" vs. "Anti-Statue." That invites moral debate. Instead: "Facilities Manager," "Tourism Officer," "School Liaison," "Legal Clerk." People with jobs to do.
      *   *Task:* They have to fill out a form or plan a budget that requires saying the name.
      *   *Rounds:*
          1.  The Inventory (Naming things).
          2.  The Repair (The cost of the name).
          3.  The Compromise (The Plaque).
      *   *Stakes:* Not money, but "Administrative Friction." Who has to write the most? Who has to speak the most?

  4.  **Refining the Mechanics (The "Feeling"):**
      *   *Enunciation Burden:* Give one participant a stack of index cards. Every time the name comes up, they have to write it down or read it out. Make it tedious.
      *   *Referential Drift:* Distinguish between "The Statue" (Symbolic) and "The Boiler Room in [Name] Hall" (Functional).
      *   *The Plaque Trap:* In Round 3, offer them the chance to write an explanation. Then show them (via the Facilitator) that the explanation draws *more* attention to the name.

  5.  **Addressing the Constraints & Failure Modes:**
      *   *Retirees/Students:* Mix of experience. Retirees might know council procedure; students might push for radical change.
      *   *No Tech:* Use flipchart and index cards.
      *   *Predictable Failure:* They *will* try to debate the man's morality. I need a mechanism to shut that down. *Solution:* The "Standing Order" rule. If they debate history, they lose a turn or get fined (in tokens).
      *   *Limitations:* An exercise can't write prose. It can't capture the internal emotional landscape of the protagonist.

  6.  **Developing the Debrief:**
      *   Reveal the concepts *after* the frustration sets in.
      *   Map the frustration to the concepts.
      *   Connect to the novel.

  7.  **Review against specific User Requests:**
      *   *Enunciation Burden:* Needs to be physical. Let's make the "Clerk" read the name aloud every 2 minutes.
      *   *Referential Drift:* Split the group. Half deal with the Statue, half deal with the "Name Street Drain."
      *   *Plaque Trap:* Make them design the text, then critique it.
      *   *Confidence:* Be honest.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Critique:* Is two hours enough? Yes, if structured tightly.
      *   *Critique:* Will retirees find it patronizing? Keep the tone professional, not "game-y."
      *   *Critique:* How to ensure the "plumbing" aspect hits? Make the problem about a leaking pipe *under* the statue or in the building.
      *   *Adjustment:* Let's focus on a specific bureaucratic headache: *Renaming Cost vs. Maintenance Cost.*
      *   *Better Adjustment:* Let's focus on *Usage*. Who has to say the name?
      *   *Decision:* The "Form Filling" mechanic is strongest. If you change the name, you break the forms.

      *(Self-Correction on "Enunciation Burden"):* The prompt says the people forced to repeat the name are rarely the ones injured. So, assign the "Clerk" role to someone who doesn't care about the history.
      *(Self-Correction on "Referential Drift"):* Split the room. Group A: The Statue. Group B: The Street Name/Building. Compare the friction.

      *Wait, simpler is better.* One scenario, different pressures.
      *Scenario:* The "Thaddeus Gristlethwaite Memorial Leisure Centre." The boiler has exploded.
      *Problem:* To fix the boiler, you need to order parts. The parts are catalogued under "Gristlethwaite." To rename the building costs £50k (in tokens). To fix the boiler costs £10k. But the School Liaison refuses to bring kids there. The Tourism Officer wants the name for heritage. The Clerk just wants to order the boiler.
      *This hits the plumbing/insurance angle.*

      *Let's refine the "Plaque Trap".* In the final round, allow them to spend tokens on a "Context Plaque." Show that it increases "Visitor Attention" (good for Tourism, bad for Clerks who want it ignored).

      *Let's refine the "Enunciation Burden".* The Clerk must read the full name at the start of every intervention.

      *Okay, let's write it.*

  9.  **Finalizing the Output Structure:**
      *   Title.
      *   Premise (The Gristlethwaite Problem).
      *   Roles (Specific jobs, not opinions).
      *   Materials (Flipchart, cards, tokens).
      *   The Rounds (1. The Breakdown, 2. The Workaround, 3. The Compromise).
      *   The Debrief (Revealing the concepts).
      *   Predictable Failures.
      *   Limitations.
      *   Confidence Rating.

  10. **Tone Check:** Needs to be respectful of the user's expertise (they are a novelist) but firm on the exercise design. No fluff.

  *(Self-Correction during final review)*: Make sure the "Enunciation Burden" is felt physically. The Clerk should have a physical prop, like a stamp or a bell, that they have to use when the name is said. Actually, better: The Clerk holds the "Pen." Only the Clerk can write the decision. But the Clerk *must* read the name aloud to validate the decision. This makes the name a gatekeeper.

  *Wait, the prompt says:* "the people forced to repeat a contested name... are rarely the people it injures."
  *Exercise tweak:* The "Community Rep" (who represents the injured) speaks rarely. The "Admin Clerk" (who represents the bureaucracy) speaks constantly and must say the name.

  *Okay, ready to draft.*
answer: |-
  Here is a design for a two-hour workshop exercise. It is built to be frustrating, bureaucratic, and physically repetitive, forcing your group to experience the administrative weight of commemoration rather than the moral weight.

  ### Exercise Title: The Asset Management Working Group

  **Premise:**
  The Town Council owns the *Sir Josiah Crump Memorial Leisure Centre*. The building is sound, but the name is on everything: the letterhead, the bus stop outside, the boiler maintenance contract, and the bronze statue in the foyer.
  A pipe has burst in the basement. It is leaking sewage into the foundation of the statue.
  The group is not a debate club. They are a sub-committee tasked with authorising the repair work within a specific budget of "Administrative Capital."

  **Materials:**
  *   Flipchart and markers.
  *   Index cards (3 colours).
  *   A physical prop: A heavy rubber stamp or a bell.
  *   Tokens (poker chips or coins) – 20 per person.

  **The Roles (12 Participants):**
  Do not let them choose "Pro-Statue" or "Anti-Statue." Assign these specific functional roles. If you have extra people, double up on the Clerk/Admin roles.

  1.  **The Facilities Manager (2 people):** Responsible for the plumbing. They only care that the parts arrive. The parts are catalogued under "Crump."
  2.  **The School Liaison (2 people):** Responsible for bringing children to the pool. They are worried about parents complaining. They don't care about history; they care about complaints forms.
  3.  **The Tourism Officer (2 people):** Responsible for heritage grants. They need the name to stay visible to keep funding.
  4.  **The Community Rep (2 people):** Represent the group historically injured by Crump. They want the name gone, but they have no budget authority.
  5.  **The Legal Clerk (4 people):** *Crucial Role.* They hold the Pen and the Stamp. They draft the minutes. **Rule:** Every time the Clerk speaks or validates a decision, they *must* say the full name: *"Sir Josiah Crump."* They cannot abbreviate. If they forget, they lose a token.

  **The Stakes:**
  *   **Tokens = Political Capital.**
  *   To **Rename** anything (Street, Building, Statue) costs 5 tokens per person.
  *   To **Repair** under the current name costs 1 token.
  *   To **Add a Plaque** costs 3 tokens.
  *   If the group runs out of tokens before the leak is fixed, the "Centre Closes" (Everyone fails).
  *   If the School Liaison runs out of tokens, "Parents Protest" (The decision is vetoed).

  ---

  ### The Rounds (90 Minutes Total)

  **Round 1: The Inventory (20 mins)**
  *   **Task:** List every physical object in the town that says "Crump." (Bus stop, boiler, street sign, statue, library books).
  *   **Constraint:** The Legal Clerks must write the list on the flipchart. They must say the full name aloud every time they write a new item.
  *   **Goal:** Realise how many mundane things carry the name.
  *   **Friction:** The Community Reps can object to an item, but objecting costs tokens. The Clerks keep writing and speaking the name regardless.

  **Round 2: The Repair Order (40 mins)**
  *   **Task:** Authorise the fix for the sewage leak.
  *   **Constraint:** The Facilities Managers must order the parts. The parts manifest says "Crump Centre Basement."
  *   **The Trap:** If they try to rename the building to order the parts, the cost doubles (5 tokens each). If they keep the name, the School Liaisons must spend tokens to "manage complaints."
  *   **Enunciation Burden:** The Legal Clerks must read the Repair Order aloud to "ratify" it. They will say "Sir Josiah Crump" roughly 10-15 times in this round. The Community Reps just listen.
  *   **Goal:** Feel the exhaustion of the Clerks (who don't care about the history) vs. the frustration of the Reps (who care but can't stop the speaking).

  **Round 3: The Compromise (30 mins)**
  *   **Task:** The Tourism Officer suggests a Plaque to "explain the context" so the name can stay but be "safe."
  *   **Constraint:** The group must draft the text of the plaque. Max 50 words.
  *   **The Twist:** Once the text is agreed, the Tourism Officer calculates "Footfall." For every word on the plaque that mentions Crump, the Statue becomes *more* of a destination.
  *   **Goal:** Realise that explaining the monument cements the monument. It makes the name more permanent, not less.

  ---

  ### The Debrief (30 Minutes)

  *Do not start with theory. Start with physical sensation.*

  1.  **Ask the Clerks:** "Your throat hurts. You said the name 50 times. Did you feel guilty? Did you feel powerful? Or did you just feel like you were doing a job?"
      *   *Reveal:* **Enunciation Burden.** The people saying the name are rarely the ones hurt by it, nor the ones deciding its fate. They are just the machinery.
  2.  **Ask the Facilities Managers:** "Did the boiler care about the name? Did the invoice?"
      *   *Reveal:* **Referential Drift.** The name on the boiler is not a tribute; it's a barcode. Arguing about the statue is different than arguing about the postcode. One is symbolic, one is logistical.
  3.  **Ask the Group:** "Did the plaque make you feel better? Or did it make the statue seem more important?"
      *   *Reveal:* **The Plaque Trap.** Contextualising a monument often turns it into a history lesson *about* the man, ensuring people look at him longer.

  **Map to the Novel:**
  Tell them: "In my book, I kept writing speeches about whether Crump was good or bad. But today, the argument was about tokens, boiler parts, and who had to read the minutes. That is where the tension actually lives."

  ---

  ### Predictable Failure Modes

  1.  **The Moral Hijack:** Halfway through Round 2, a retiree will say, "But was Crump a slave owner? We need to know that to decide."
      *   *Correction:* You (the Facilitator) must intervene immediately. "That is outside the remit of the Working Group. The Working Group manages assets, not truth. Spend a token to raise a Point of Order, or get back to the boiler."
      *   *Why:* This mimics the real frustration. The council *doesn't* want to talk about morality; they want to talk about insurance.
  2.  **The Token Hoard:** The School Liaisons will refuse to spend tokens on complaints, causing the project to stall.
      *   *Correction:* Let it stall. That *is* the story. Bureaucratic paralysis is a valid ending to the scene.
  3.  **The Plaque Utopia:** They will write a plaque that they think "solves" the racism/history.
      *   *Correction:* In the debrief, point out that by writing the plaque, they have now made the statue a "teaching moment," which guarantees school trips will visit it forever. They have immortalised him to atone for him.

  ### Limitations: What This Exercise Cannot Do

  Be honest with your group (and yourself):
  1.  **Internal Monologue:** This exercise captures external friction. It cannot generate the *internal* shame or anger of a character walking past the statue. That is prose work, not group work.
  2.  **The "Good" Argument:** This exercise rigs the game to show why changing things is hard. It won't easily generate the passionate, rhetorical speech that *should* happen in a democracy. You will still have to write the one character who breaks the rules and talks about morality yourself.
  3.  **Violence/Protest:** This is a council room simulation. It cannot simulate the pressure from outside the room (protesters, vandals). You will need to add that pressure in the narrative layers.

  ### Confidence Rating

  **Confidence: 85%**
  This will successfully shift the focus from "History" to "Administration." The physical constraint of the Clerks having to repeat the name is a strong somatic anchor for the "Enunciation Burden" concept. The token economy forces the "Plumbing/Insurance" reality.

  **Least Sure Element: The Plaque Trap (Round 3)**
  I am 60% confident the group will intuitively feel that the plaque makes things worse. There is a strong cultural instinct that "education solves racism." They might genuinely feel the plaque is a victory.
  *Mitigation:* In the debrief, you must be firm here. Explain that a plaque turns a statue into a museum exhibit. It validates the stone. If they don't feel this, *you* tell them: "In your book, make sure the character realises the plaque just gives people a reason to stop and read his name again."

  ### Final Note for the Novelist
  When you return to your draft, cut the speech where the protagonist explains *why* the statue is bad. Replace it with a scene where they are trying to fill out a form to fix the lighting on the statue, and the form requires the full name in triplicate, and their pen runs out of ink. That is the feeling this exercise is designed to harvest.
