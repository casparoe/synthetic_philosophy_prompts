      *   **Constraint:** No institutional archive access (limits historical/genealogical work), roughly two years of conceptual work time.
      *   **Goal:** A *defended agenda*, not a literature survey. Needs prioritization/ranking of three specific unresolved questions based on tractability, dependency, and practical leverage.
      *   **The Three Questions:**
          1.  *Formal-Conceptual:* Extending governmentality/discipline to algorithmic/non-state nodes without collapsing distinctions.
          2.  *Normative-Structural:* Recovering normative traction (emancipation) given anti-essentialism.
