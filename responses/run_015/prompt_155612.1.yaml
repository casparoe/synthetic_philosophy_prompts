answer: |-
  Here is a defended agenda based on your constraints (no archive access, two-year horizon) and criteria (tractability, dependency, leverage).

  ### Executive Ranking

  1.  **Upstream (Priority 1): The Formal-Conceptual Problem (Q1).**
      *   *Verdict:* This is the bottleneck. If Foucault's ontology cannot coherently describe algorithmic governance without category error, the project collapses into the "retrospective redescription" your friend fears.
  2.  **Downstream/Testing Ground (Priority 2): The Empirical-Institutional Problem (Q3).**
      *   *Verdict:* This is your highest-leverage output. It validates Q1 in real-time and bypasses the need for historical archives by using your immediate institutional environment as the field site.
  3.  **Reframed/Parallel (Priority 3): The Normative-Structural Problem (Q2).**
      *   *Verdict:* Treat this not as a foundational problem to be *solved*, but as a strategic posture to be *adopted*. Attempting to ground Foucault normatively is a low-tractability trap; shifting to "problematization" preserves critical traction without essentialism.

  ---

  ### Detailed Defense of the Ranking

  #### 1. The Formal-Conceptual Problem (Q1)
  **Status:** *Upstream Condition of Possibility*
  **Tractability:** High (Conceptual work only)
  **Dependency:** Determines the validity of Q3.

  **The Argument:**
  Your friend's critique hinges on the mismatch between Foucault's *enclosed* architectures (panopticism) and contemporary *distributed* infrastructures. If you attempt to force algorithms into the box of "Discipline," you will fail. Discipline individuates bodies in space; algorithms modulate data flows across time.

  However, Foucault is not limited to *Discipline and Punish*. In *Security, Territory, Population*, he distinguishes **Disciplinary Power** (enclosure, normalization of the individual) from **Apparatuses of Security** (management of circulation, probabilistic calculation, normalization of the population).
  *   **The Move:** Do not try to stretch "Discipline" to cover algorithms. Argue that algorithmic governance is the logical culmination of Foucault's **Security** modality, not his Disciplinary one. Security operates on the "open," on risk, and on environmental modulation.
  *   **Why Upstream?** If you cannot rigorously map algorithmic scoring onto Foucault's *Security* (rather than *Discipline*), then Q3 becomes mere metaphor. You must establish that "prediction" and "pre-emption" are legible within Foucault's later lectures on neoliberal governmentality (where the subject is an enterprise of capital).
  *   **Risk of Neglect:** If you skip this, you are vulnerable to the charge that you are using "Foucault" as a brand name for "critical theory" generally.

  #### 2. The Empirical-Institutional Problem (Q3)
  **Status:** *The Testing Ground / Leverage Point*
  **Tractability:** High (Auto-ethnographic/Conceptual)
  **Dependency:** Depends on Q1; bypasses Q2.

  **The Argument:**
  This is where you win the "live research questions" argument. You do not need archive access to analyze the university. You are embedded in the machinery.
  *   **The Move:** Analyze peer review, citation metrics, and grant algorithms not as "disciplinary normalization" (judging against a static norm) but as "modulatory control" (continuous scoring that alters behavior in real-time).
  *   **Practical Leverage:** This directly impacts education policy and governance design. If you can show that funding structures operate via *security logic* (risk mitigation) rather than *disciplinary logic* (truth production), you change the prescription for resistance. Resistance to discipline looks like visibility/transparency; resistance to security looks like *opacity* or *data sabotage*.
  *   **Why Second?** It relies on Q1 being settled. You need the conceptual vocabulary (Security vs. Discipline) to describe the empirical reality accurately. But it takes precedence over Q2 because you can produce a diagnostic critique without solving the metaphysical problem of normativity.

  #### 3. The Normative-Structural Problem (Q2)
  **Status:** *Strategic Reframing (Do Not "Solve")*
  **Tractability:** Low (Philosophical quagmire)
  **Dependency:** Colors the conclusion of Q3, but does not determine its validity.

  **The Argument:**
  Your friend is right that Foucault forecloses *foundational* normativity. If you spend two years trying to find a stable ground for "emancipation" within Foucault, you will likely produce a scholastic refinement with no practical leverage.
  *   **The Move:** Reject the demand for "emancipation." Replace it with **Problematization**. Foucault's normativity is not "X is unjust," but "X makes this specific form of life impossible."
  *   **Why Last?** Resolving Q2 does *not* determine if Q3 is worth attempting. A diagnostic genealogy has value even without a prescriptive ethics. However, *how* you frame the conclusion of Q3 depends on Q2. If you seek emancipation, you fail. If you seek to identify "points of instability" where counter-conduct is possible, you succeed.
  *   **The Trap:** Trying to recover a "humanist subject" to judge power contradicts the anti-essentialism required for Q1 (algorithmic subjectivation).

  ---

  ### Dependency Relations & Incoherent Combinations

  You asked if resolving the normative vacuum determines empirical extensions. The answer is **No**, but it determines the *telos* of those extensions.

  **The Dependency Map:**
  *   **Q1 $\rightarrow$ Q3:** Strong Dependency. You cannot analyze academia as algorithmic (Q3) if you haven't defined algorithmic power within the framework (Q1).
  *   **Q1 $\rightarrow$ Q2:** Weak Dependency. Your ontology of power (Security vs. Discipline) suggests what kind of ethics is possible (Aesthetics of Existence vs. Rights-based), but doesn't solve the justification problem.
  *   **Q2 $\rightarrow$ Q3:** No Dependency. You can diagnose the prison without having a theory of justice.

  **Incoherent Combinations (Flagged):**
  1.  **The "Humanist Foucault" Error:** Arguing that algorithms are a new form of Discipline (Q1) *while* arguing for a stable, autonomous subject capable of emancipation (Q2).
      *   *Why Incoherent:* If power constitutes the subject (Q1), you cannot appeal to a pre-existing subject to resist it (Q2). This leads to the "crypto-normativity" critique.
  2.  **The "Totalitarian" Trap:** Arguing that Security/Apparatuses are totalizing (Q1) *while* claiming there are specific sites of resistance in academia (Q3).
      *   *Why Incoherent:* If power is everywhere and capillary, resistance must be local and specific. If you claim the system is total, you foreclose the empirical work of Q3. You must maintain that *where there is power, there is resistance*.
  3.  **The "Retrospective" Trap:** Using Q3 to describe current institutions but relying solely on *Discipline and Punish* concepts (Q1).
      *   *Why Incoherent:* This validates your friend's critique. You will be describing predictive algorithms using the vocabulary of enclosed spaces. You must use the *Security/Liberalism* lectures.

  ---

  ### The Two-Year Trajectory

  **Year 1: Conceptual Calibration (Q1)**
  *   **Focus:** Rigorous exegesis of *Security, Territory, Population* and *The Birth of Biopolitics*.
  *   **Goal:** Construct a model of "Algorithmic Governmentality." Show how "risk" and "prediction" fit Foucault's definition of Security (managing the probable) rather than Discipline (enforcing the norm).
  *   **Deliverable:** A theoretical paper establishing the ontology. This answers the friend's challenge: "Is this live?" Yes, if the concepts evolve.
  *   **Constraint Check:** Requires only library/textual access.

  **Year 2: Institutional Diagnosis (Q3)**
  *   **Focus:** Apply the Year 1 model to the university. Map grant algorithms, citation metrics, and hiring committees as *security apparatuses*.
  *   **Goal:** Identify specific "points of fragility." Where does the algorithmic logic fail? Where does it produce unintended subjectivities?
  *   **Normative Stance (Q2):** Adopt the stance of the "Specific Intellectual." Do not claim "This is Unjust." Claim "This renders specific forms of inquiry impossible."
  *   **Deliverable:** A monograph or series of articles on the "Neoliberal University as Security Apparatus."
  *   **Leverage:** This speaks directly to policy (governance design) without needing a metaphysical foundation for justice.

  ### Summary Recommendation

  **Prioritize Q1.** It is the gatekeeper. If you cannot distinguish Discipline from Security rigorously, the rest is noise.
  **Execute Q3.** It is your proof of concept and provides the practical leverage you need to justify the work's existence.
  **Sidestep Q2.** Do not try to solve the normative problem foundationally. Solve it *pragmatically* by defining critique as the exposure of limits, not the proclamation of rights.

  This agenda avoids the "scholastic refinement" trap by forcing the concepts to do work on a contemporary object (Q3), and it avoids the "retrospective redescription" trap by updating the ontology (Q1). It accepts the limitation of no archives by making the *present* the archive.
