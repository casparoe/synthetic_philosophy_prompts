  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Rigorous, direct, peer-to-peer. No fluff.
      *   *Structure:*
          1.  Executive Summary (The Ranking).
          2.  Detailed Defense of the Ranking (using the user's criteria).
          3.  Dependency Map (How they relate).
          4.  Incoherent Combinations/Warnings.
          5.  The Proposed 2-Year Trajectory.
      *   *Key Argument:* The friend's challenge (retrospective vs. live) is won or lost on Q1. If you can't update the ontology of power, the rest is history. Q3 is the testing ground. Q2 should be sidestepped/reframed, not solved foundationally.
