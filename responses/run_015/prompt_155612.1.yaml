      *   Q1 is the *condition of possibility* for Q3. You can't analyze academia as algorithmic power (Q3) if you haven't established that Foucault's concepts can coherently describe algorithmic power (Q1).
      *   Q2 is the *motivation* for Q3. If there's no normative traction (Q2), analyzing academia (Q3) is just description (the friend's critique).
      *   However, Q2 is often a "black hole." Spending 2 years on normative foundations might yield no progress. Q1 is more tractable conceptually.
