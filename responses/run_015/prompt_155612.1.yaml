      *   **Criteria for Ranking:** Tractability (conceptual tools alone), Dependency Relations (which answers determine others), Practical Leverage (impact on policy/design vs. scholastic refinement).
      *   **Warning:** Flag incoherent combinations or unattractive commitments.

  2.  **Deconstruct the Three Questions:**

      *   **Q1 (Formal-Conceptual):** Can "discipline" or "governmentality" handle algorithms?
          *   *Issue:* Foucault's discipline relies on enclosure, visibility, and individuation. Algorithms rely on prediction, datafication, and pre-emption (Deleuze's "societies of control" is the usual counter-point).
          *   *Risk:* Stretching terms until they break (conceptual inflation).
          *   *Tractability:* High (purely conceptual/textual analysis + contemporary theory).
          *   *Dependency:* Foundational. If the concepts don't fit, the rest collapses.

      *   **Q2 (Normative-Structural):** Where does critique stand if there's no "outside"?
          *   *Issue:* Foucault is often accused of providing no ground for resistance. If everything is power/knowledge, why resist X over Y?
          *   *Risk:* Nihilism or crypto-normativity (smuggling in values).
          *   *Tractability:* Low/Medium (highly debated, notoriously difficult to resolve definitively).
          *   *Dependency:* High. Determines *why* we do the empirical work.

      *   **Q3 (Empirical-Institutional):** Is academia now algorithmic/modulatory?
