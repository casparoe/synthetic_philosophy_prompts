      *   Q3: High practical leverage. Directly addresses education policy/governance design (as requested).

  6.  **Develop the Ranking and Argument:**

      *   *Priority 1: Q1 (Formal-Conceptual).* Why? Because if the tool doesn't fit the object, the project is dead. The friend's critique hinges on this (retrospective redescription vs. live analytics). You must prove the framework *works* on algorithms before applying it.
      *   *Priority 2: Q3 (Empirical-Institutional).* Why? It's the most tractable without archives and offers the highest practical leverage. It tests Q1 in real-time. It avoids the Q2 trap by focusing on *diagnosis* rather than *justification*.
      *   *Priority 3: Q2 (Normative-Structural).* Why? It's the "death trap." Many have tried to fix Foucault's normativity. It's better to treat normativity as a *function* of the practice (Q3) rather than a precondition.

      *   *Refinement:* Wait, the user asks if resolving the normative vacuum determines empirical extensions. I need to address this. Actually, treating Q2 as a "dead end" (in the sense of seeking foundational norms) might be the productive move. Shift to "ethics as practice."
