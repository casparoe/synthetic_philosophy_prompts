      *   *Better Insight:* Q1 is the bottleneck. If Foucault's concepts *cannot* extend to algorithms (i.e., we need Deleuze or new theory), then Q3 using Foucault is dead. If they *can*, Q3 is viable. Q2 is parallel but affects the *tone* of Q3, not its viability.

  4.  **Evaluate Tractability (No Archives):**
      *   Q1: High. Requires reading Foucault, secondary lit (Deleuze, Agamben, Mbembe, data studies), and conceptual rigor.
      *   Q2: Low. This is the "Habermas vs. Foucault" debate rehashed for 40 years. Hard to break new ground conceptually without historical leverage.
      *   Q3: High. One *is* in the institution. Auto-ethnography + conceptual mapping is possible without external archives.

  5.  **Evaluate Practical Leverage:**
