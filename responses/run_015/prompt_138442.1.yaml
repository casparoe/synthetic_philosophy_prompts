prompt: |-
  Hey — I'm a reporter, I cover science and ideas now but I spent about six years on the labor beat before they moved me, so I know my way around a mediation room: BATNAs, the zone of possible agreement, the mediator shutteling between caucus rooms to get each side to shave something off it's maximum demand, strike deadlines, pattern settlements that the next local in line will copy, ability-to-pay arguments, and the fact that whatever you land on has to survive a ratification vote. I'm working on a piece about what happens when software agents negociate with each other on people's behalf, and everyone I interview tells me the serious thinking about this is in the axiomatic bargaining literature, which I cannot read. So: take the old Nash solution and the Kalai-Smorodinsky alternative that was built to fix it, and translate that whole dispute as faithfully as you can into the vocabulary I just listed. What is the feasible set in a room with a mediator in it? Is the disagreement point the BATNA, or is it what happens when the clock runs out and both sides are worse off than any deal — and does the theory care which, given that my sources spend most of their working lives trying to move it? What does Nash's independence-of-irrelevant-alternatives amount to when I'd put it as "a demand the other side could never have gotten anyway shouldn't change what you settle on"? And what is Kalai-Smorodinsky's monotonicity axiom really demanding, if my gloss is "if the company's best conceivable outcome just got better, the union's settlement ought to get better too, even though nothing actually on the table changed"? Also please state plainly what each solution picks — I've been told one of them is basically "both sides give up the same fraction of their maximum demand," and I want to know whether that's right or whether I've flattened something.

  Then the part I actually need, which is the residue report: tell me what does not survive the translation. My own hunches, which I fully expect to be half wrong: (a) my whole vocabulary quietly assumes a common measuring stick — dollars, percentages, headcount — and I'm told the theory is built so that you can rescale each side's utility separately without changing the answer, which if true makes "split the difference" and "each side concedes proportionally" completely different claims and makes at least one of them inadmissible; (b) "the company can afford it" and "the members will never ratify that" are doing real work in every negotiation I've covered, and I can't find the slot for either in a model that apparently only has a feasible set and a disagreement point; (c) we can't offer two parties a coin flip between two contracts, which I suspect is what lets them assume the feasible set is convex, so something important may be riding on an assumption that's just false on my beat. Also, separately, people keep claiming that automated agents land on equal-proportional-concession outcomes rather than the Nash one, and I'd like to know whether that's even a meaningful thing to say or whether I'm projecting a mediator's intuition onto a machine. Tell me which of these are genuine residue, which are just me misunderstanding the model, and — this is the bit I care about most — give me the mismatches I haven't thought of, especially anything my vocabulary lets me say that theirs can't, or anything they say that turns out to be empty once it's in my language. I'd much rather hear "that distinction of theirs has no counterpart for you" than get a tidy translation that quietly changed the subject.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experienced labor reporter (6 years on the beat), now covers science/ideas. Knows negotiation jargon (BATNA, ZOPA, caucus, ratification, pattern settlements, ability-to-pay). Skeptical of academic abstractions but wants accurate translation.
      *   **Task:** Translate axiomatic bargaining theory (Nash Bargaining Solution vs. Kalai-Smorodinsky Solution) into labor negotiation vocabulary. Then, identify the "residue" (what gets lost, what doesn't map, what's misleading).
      *   **Specific Questions to Answer:**
          *   What is the feasible set in a mediation room?
          *   Is the disagreement point the BATNA or the strike outcome? Does theory care?
          *   Translate Nash's Independence of Irrelevant Alternatives (IIA).
          *   Translate Kalai-Smorodinsky's Monotonicity axiom.
          *   Verify the claim: "Both sides give up the same fraction of their maximum demand."
          *   **Crucial Part:** The Residue Report. Evaluate the user's hunches (a, b, c) and add new mismatches (what labor lingo says that theory can't, and vice versa).
          *   **Specific Query:** Do automated agents actually land on equal-proportional-concession outcomes?

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   *Nash Bargaining Solution (NBS):* Maximizes the product of utility gains over the disagreement point. $(u_1 - d_1)(u_2 - d_2)$. Geometrically, it's the point where a hyperbola touches the Pareto frontier.
      *   *Kalai-Smorodinsky (KS):* Maximizes the minimum of the *ratios* of utility gains to maximum possible gains. It preserves the ratio of gains relative to the ideal point. Geometrically, draw a line from disagreement point to the "ideal point" (max possible for both, usually infeasible); where it hits the frontier is the solution.
      *   *Axioms:*
          *   Pareto Efficiency (obvious).
          *   Symmetry (if players are identical, they get identical outcomes).
          *   Invariance to Affine Transformations (utility scales don't matter).
          *   IIA (Nash specific): If you shrink the feasible set but keep the solution and the disagreement point, the solution stays the same.
          *   Monotonicity (KS specific): If the feasible set expands in a way that helps one player's maximum potential without hurting the other's, that player shouldn't get worse off.

  3.  **Drafting the Translation (Labor Lingo):**
      *   *Feasible Set:* The ZOPA (Zone of Possible Agreement), but technically broader. It's every deal the mediator knows *could* be signed and ratified. Not just what's on the table now, but what *could* be.
      *   *Disagreement Point:* It's the BATNA *if* the BATNA is the certain outcome of no deal. In labor, it's the strike/lockout outcome. Theory treats $d$ as the utility of no agreement. Whether it's "walking away" or "fighting until exhaustion" depends on how you define the utility. Theory doesn't care *how* you get to $d$, only what $d$ is worth.
      *   *IIA:* "If we rule out a demand you were never going to get anyway, it shouldn't change the deal we cut on the stuff that matters."
      *   *Monotonicity:* "If the company's ceiling just got higher (they can pay more), the union's take shouldn't go down, even if the union's ceiling didn't change."
      *   *The "Equal Fraction" Claim:* This is the KS solution, not Nash. Nash equalizes the *product* of gains (marginal rates of substitution). KS equalizes the *proportion* of the distance from disagreement to ideal point.

  4.  **Addressing the Residue (The User's Hunches):**
      *   *(a) Common Measuring Stick:* User is right. Labor talks in dollars. Theory talks in "utils" (ordinal utility). "Split the difference" in dollars is meaningless in theory unless utility is linear in money. "Equal proportional concession" is KS, but only if utilities are normalized. This is a huge mismatch.
      *   *(b) Ability-to-Pay / Ratification:* These are constraints on the *Feasible Set* or the *Disagreement Point*. "Ability to pay" shapes the frontier. "Ratification" shapes the disagreement point (if a deal fails ratification, we go to strike). Theory hides the *process* of determining these inside the geometry.
      *   *(c) Convexity / Coin Flips:* User is sharp here. Convexity assumes lotteries are possible. In labor, you can't usually say "50% chance of Contract A, 50% chance of Contract B." You need a single contract. If the frontier is non-convex, Nash/KS might fail or behave weirdly. This is a real limitation.

  5.  **Identifying New Mismatches (The "Bit I Care About Most"):**
      *   *Time:* Theory is static (one shot). Labor is dynamic (deadlines, extensions, fatigue).
      *   *Information:* Theory assumes common knowledge of the feasible set and disagreement point. Labor is all about hiding your BATNA and bluffing about the feasible set.
      *   *Principals/Agents:* Theory assumes the negotiators *are* the players. Labor has union leaders (agents) negotiating for members (principals) and management negotiating for shareholders/board. Ratification is the key friction here.
      *   *Fairness vs. Efficiency:* Theory defines "fair" via axioms (Symmetry). Labor defines "fair" via patterns, comparisons, and dignity.
      *   *Automated Agents:* Do they do KS? Often they use heuristic concession strategies (e.g., Zeuthen strategy, or time-dependent concession). They might *look* like KS, but they are usually optimizing for probability of deal, not axiomatic fairness.

  6.  **Refining the Tone:**
      *   Respectful of the user's expertise. Don't dumb it down, but don't obscure it with math.
      *   Direct. "Here's what maps, here's what breaks."
      *   Acknowledge the tension between the clean math and the messy room.

  7.  **Step-by-Step Construction of the Response:**
      *   **Introduction:** Acknowledge the user's background. Validate the difficulty of the translation.
      *   **Part 1: The Translation:**
          *   Feasible Set -> The ZOPA + everything the mediator knows is ratifiable.
          *   Disagreement Point -> The Strike/Lockout outcome (utility of it, not just the event).
          *   IIA -> "Phantom demands don't move the needle."
          *   Monotonicity -> "If the pie grows for them, your slice shouldn't shrink."
          *   The "Equal Fraction" claim -> That's Kalai-Smorodinsky, not Nash. Nash is about marginal trade-offs.
      *   **Part 2: The Residue Report (User's Hunches):**
          *   (a) Utility vs. Dollars: Confirm this is the biggest break. Interpersonal comparison of utility is forbidden in theory, essential in labor.
          *   (b) Constraints: Confirm they are hidden in the geometry.
          *   (c) Convexity: Confirm lotteries are the theoretical glue that labor lacks.
      *   **Part 3: The Unthought Mismatches:**
          *   Information Asymmetry (Theory assumes known sets; Labor assumes hidden cards).
          *   The Principal-Agent Problem (Ratification is a second game).
          *   Time/Dynamics (Theory is timeless; Labor is against the clock).
          *   The "Fairness" definition (Axiomatic vs. Pattern/Comparative).
      *   **Part 4: Automated Agents:**
          *   Clarify that agents usually optimize for deal probability or specific utility functions, not necessarily KS. The "equal concession" might be a heuristic, not an axiomatic result.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain IIA clearly? It's tricky. "If you remove an option that wasn't the winner, the winner doesn't change." In labor terms: "If we take off the table a pension demand you knew you'd never get, it shouldn't change the wage number we agree on."
      *   *Check:* Did I distinguish Nash vs. KS on the "fraction" claim? Yes, KS is the proportional gain solution. Nash is the product maximizer.
      *   *Check:* Is the tone right? Avoid being condescending about the math or the labor beat. Treat them as two different languages describing the same reality.
      *   *Check:* The "Automated Agents" part. Need to be careful not to overstate. Many negotiation agents use simplified heuristics. Some *are* designed to implement Nash/KS, but many are just strategy-based (e.g., tit-for-tat). I should clarify that "equal proportional concession" is a specific strategy often *associated* with KS logic, but not universal.

  9.  **Final Polish:** Ensure the distinction between "utility" and "money" is hammered home, as that's the source of most confusion for practitioners. (Utility is subjective satisfaction; Money is objective).

  *(Self-Correction on the "Equal Fraction" claim)*: Wait, let me double-check. KS ensures that $\frac{u_1 - d_1}{u_1^* - d_1} = \frac{u_2 - d_2}{u_2^* - d_2}$. Yes, that is equal proportion of *maximum possible gain*. Nash maximizes $(u_1 - d_1)(u_2 - d_2)$. These are only the same if the frontier is linear and symmetric. So the user's source is describing KS, but attributing it generally. I need to make that distinction clear.

  *(Self-Correction on Convexity)*: Convexity implies that if Deal A and Deal B are possible, a weighted average is possible. In labor, this usually means "Can we phase this in?" or "Can we do a probabilistic mix?" Usually no. So the frontier might be non-convex. This breaks the uniqueness of the solutions sometimes. Good point to emphasize.

  *(Final thought on "Residue")*: The biggest thing labor knows that theory ignores is *power dynamics* not captured in the feasible set. Theory assumes the feasible set is given. Labor knows the feasible set is *fighted for*.

  Okay, ready to write.
answer: |-
  This is a sharp brief. You've identified the exact friction points where the clean geometry of game theory grinds against the grease of a mediation room. The axiomatic bargaining literature (Nash, Kalai-Smorodinsky, etc.) is indeed built on abstractions that strip away the very things you spent six years covering: the sweat, the bluffing, the clock, and the membership.

  Here is the translation you asked for, followed by the residue report where the model breaks.

  ### Part 1: The Translation

  **The Feasible Set**
  In the literature, this is the set of all utility pairs $(u_1, u_2)$ achievable through agreement.
  *   **In your room:** It is the **ZOPA (Zone of Possible Agreement) expanded to include every hypothetical deal the mediator knows is ratifiable.** It's not just what's on the whiteboard; it's every combination of wages, benefits, and language that wouldn't get voted down by the rank-and-file or rejected by the board. Crucially, the theory assumes this shape is *known* to the mediator (and often the players). In your world, discovering the true boundary of the feasible set is half the job.

  **The Disagreement Point ($d$)**
  In the literature, this is the utility each player receives if no agreement is reached.
  *   **In your room:** This is the **Strike/Lockout Outcome.** You asked if it's the BATNA or the "clock runs out" scenario. In theory, $d$ is simply the value of the no-deal state. If walking away means a strike that lasts three months and costs both sides millions, $d$ is the utility of that exhausted state. If walking away means "we go back to the old contract," $d$ is the status quo. Theory doesn't care *how* you get to $d$, only what $d$ is worth. However, your sources spend their lives moving $d$ (making the strike look more painful for the company, or less painful for the union) because shifting $d$ shifts the entire solution.

  **Nash's Independence of Irrelevant Alternatives (IIA)**
  *   **The Axiom:** If a solution is chosen from a large feasible set, and you shrink the set but leave the solution and the disagreement point available, the solution shouldn't change.
  *   **In your room:** **"Phantom demands don't move the needle."** If the union starts out demanding the moon (a point outside the feasible set) and the company says "no," and then the union drops that demand to focus on what's actually possible, the wage settlement on the table shouldn't change just because you took the moon off the table. Nash argues that options you *couldn't have gotten anyway* should not influence the deal you *do* get.
  *   **The Critique:** Kalai-Smorodinsky (KS) hated this. They argued that removing a "phantom demand" changes the *shape* of the bargaining power, so the deal *should* change.

  **Kalai-Smorodinsky's Monotonicity**
  *   **The Axiom:** If the feasible set expands in a way that increases one player's maximum possible utility (without lowering the other's), that player's outcome in the solution should not decrease.
  *   **In your room:** **"If the company's ceiling just got higher, the union's floor shouldn't drop."** Suppose the company's profits surge mid-negotiation. Their "best conceivable outcome" (keeping all that profit) is now higher. KS demands that the union's settlement must improve (or stay same), because the potential surplus grew. Nash doesn't guarantee this; under Nash, if the geometry shifts weirdly, the union could theoretically get less even if the pie grew, provided the *marginal trade-offs* shifted. KS says: "If their best-case got better, our deal better not get worse."

  **The "Equal Fraction" Claim**
  You were told one solution is "both sides give up the same fraction of their maximum demand."
  *   **Verdict:** That is **Kalai-Smorodinsky**, not Nash.
  *   **The Math:** KS picks the point on the frontier that lies on the straight line connecting the Disagreement Point to the "Ideal Point" (where both parties get their maximum feasible utility simultaneously). Geometrically, this ensures both parties achieve the same *proportion* of their maximum possible gain.
  *   **Nash:** Nash maximizes the *product* of the gains $(u_1 - d_1) \times (u_2 - d_2)$. This is not equal proportional concession. It is equalizing the *marginal rate of substitution* of utility. In plain English: Nash finds the spot where the pain of giving up one more dollar is equal for both sides, weighted by how much they already have. It favors the side with more "room to move" (higher utility curvature).

  ---

  ### Part 2: The Residue Report

  You asked what does not survive the translation. Your hunches are largely correct, but there are deeper structural breaks.

  **Your Hunch (a): The Common Measuring Stick**
  *   **Status:** **Genuine Residue.**
  *   **Why:** This is the biggest lie in the translation. Labor negotiation happens in **cardinal, comparable units** (dollars, days, headcount). You can say "The union gets 50% of the surplus." Axiomatic theory is built on **ordinal, non-comparable utility**. I can rescale your utility function (multiply it by 100) and mine (divide by 2), and the Nash solution *must* remain the same.
  *   **The Consequence:** "Split the difference" (in dollars) is meaningless in theory unless utility is linear in money (which it rarely is; a million dollars means more to a struggling local than to Exxon). "Equal proportional concession" (KS) is also tricky because "proportion" requires measuring the distance from "worst" to "best" in utils, not dollars. If the union values job security exponentially more than the company values cost savings, a 50/50 dollar split is not a 50/50 utility split. The theory forbids you from asking "Who gained more satisfaction?" The labor beat requires you to ask exactly that.

  **Your Hunch (b): Ability-to-Pay and Ratification**
  *   **Status:** **Genuine Residue (Hidden Variables).**
  *   **Why:** In the model, "Ability-to-Pay" is just the boundary of the Feasible Set. "Ratification" is a probability weight on the Disagreement Point. But in your room, these are **dynamic weapons**.
  *   **The Consequence:** The model treats the Feasible Set as a static object to be solved. You know the Feasible Set is a **negotiable object**. The union strikes *to change the feasible set* (by hurting profits) and *to move the disagreement point* (by making the strike credible). The theory assumes the set is given; your job is to report on the fight to define the set. The model cannot capture the act of *creating* value versus *claiming* value.

  **Your Hunch (c): Convexity and Coin Flips**
  *   **Status:** **Genuine Residue (The Lottery Problem).**
  *   **Why:** Convexity (the assumption that the feasible set is a smooth, bulging shape) mathematically relies on the ability to mix outcomes. If Deal A and Deal B are possible, the theory assumes a 50/50 lottery between them is also possible and valuable.
  *   **The Consequence:** In labor, **lotteries are rarely ratifiable.** You cannot sign a contract that says "50% chance of a 2% raise, 50% chance of a freeze." You need a deterministic contract. If the true frontier is non-convex (lumpy), the Nash and KS solutions might land in the "ocean" (infeasible space) or become unstable. The theory smooths over the lumpiness of real contracts (thresholds, cliffs, step-functions) that make the math break.

  ---

  ### Part 3: The Mismatches You Didn't List

  Here is what your vocabulary lets you say that theirs can't, and vice versa.

  **1. Information Asymmetry (The Bluff)**
  *   **Theory:** Assumes **Common Knowledge.** Both sides and the mediator know the Feasible Set and the Disagreement Point.
  *   **Your Beat:** The entire negotiation is about **hiding** the Disagreement Point (BATNA) and **misrepresenting** the Feasible Set ("We literally cannot afford that").
  *   **The Mismatch:** Axiomatic bargaining is a solution concept for a problem where everyone knows the answer. It is not a model of the *process* of finding the answer. It tells you where the plane should land; it doesn't model the fog, the radar jamming, or the pilot lying about fuel levels. If automated agents are negotiating, they are likely negotiating *under uncertainty*, which pushes the problem out of axiomatic bargaining and into *mechanism design* or *Bayesian games*.

  **2. The Principal-Agent Problem (Ratification)**
  *   **Theory:** The players at the table are the **Principals**. They consume the utility.
  *   **Your Beat:** The negotiators are **Agents**. They consume reputation, sleep, and career safety. The Principals (members/shareholders) vote later.
  *   **The Mismatch:** The theory cannot account for a negotiator accepting a sub-optimal deal because it saves their job, or rejecting an optimal deal because it looks weak to the membership. The "utility function" of the person in the caucus room is different from the utility function of the person voting on the ratification floor. The model assumes they are the same entity.

  **3. Time and Deadlines**
  *   **Theory:** Static. One shot. (There are dynamic models, but the classic Nash/KS are static).
  *   **Your Beat:** Deeply temporal. "Strike deadline," "Extension," "Fatigue."
  *   **The Mismatch:** In the static model, waiting costs nothing unless encoded in the Disagreement Point. In your room, time *is* the pressure. A deal that is acceptable on Day 1 is rejected on Day 30 because the strike fund is dry. The axiomatic solutions don't have a "clock" variable.

  **4. Fairness vs. Pattern**
  *   **Theory:** Fairness is defined by **Axioms** (Symmetry, Monotonicity).
  *   **Your Beat:** Fairness is defined by **Pattern** ("The UAW got 5% at Ford, we need 5% + 1").
  *   **The Mismatch:** Theory says if two unions have different feasible sets, they should get different deals. Labor says if two unions have different *leverage* but the same *pattern*, they should get the same deal to maintain solidarity. The theory has no concept of "solidarity" or "industry standard."

  ### Part 4: The Automated Agents Question

  You asked: *People keep claiming that automated agents land on equal-proportional-concession outcomes rather than the Nash one. Is that meaningful?*

  **Verdict:** It is likely **projection**, but with a technical caveat.

  1.  **The Projection:** Most commercial negotiation agents (e.g., in supply chain or simple e-commerce) do not solve for Nash or KS. They use **heuristic concession strategies** (e.g., "start high, lower by 2% every hour," or "match the opponent's last concession"). If they look like they are making "equal proportional concessions," it's because they are programmed with a **time-dependent tactic** that mirrors the KS geometry, not because they are calculating axiomatic fairness.
  2.  **The Caveat:** There is a class of agents designed for **fair division** that explicitly implement KS because it is computationally easier than Nash in some multi-issue contexts (Nash requires maximizing a product, which can be non-linear and hard; KS is a line intersection).
  3.  **The Reality:** If your sources say agents "naturally" converge to KS, they are likely observing agents programmed with **Zeuthen's Strategy** (risk of conflict) or simple **midpoint convergence**. In a symmetric environment with linear utilities, Nash and KS often yield similar results. Distinguishing them requires non-linear utilities and asymmetric feasible sets.
  4.  **The "Meaningful" Part:** It is meaningful only if the agents are explicitly optimizing for **Pareto Efficiency + Monotonicity**. If they are just optimizing for "Deal Probability," they will converge to the center of the ZOPA, which *looks* like equal concession but is actually just risk aversion.

  ### Summary for your Piece

  The axiomatic literature offers a **normative** map (where *should* rational actors land if they want to be fair/efficient?) but your beat covers the **positive** reality (where *do* actors land when they are tired, bluffing, and accountable to a mob?).

  *   **Nash** says: "Maximize the joint surplus product." (Efficiency focused).
  *   **Kalai-Smorodinsky** says: "Share the gains proportionally to potential." (Fairness focused).
  *   **Your Reality** says: "Who has the strike fund to last another week, and who has a board meeting on Friday?"

  The residue is not just noise; it is the signal. The "common measuring stick" (money) allows for the comparisons the theory forbids. The "ratification vote" introduces a principal-agent friction the model ignores. The "non-convexity" of real contracts makes the geometric solutions unstable.

  If you write that "Software agents are bringing axiomatic fairness to the table," you are likely mistaking a heuristic for a principle. They aren't solving for Kalai-Smorodinsky; they are solving for "Close the Deal." And in doing so, they may be optimizing for a mathematical ideal that ignores the human constraint that makes the deal stick: the vote.
