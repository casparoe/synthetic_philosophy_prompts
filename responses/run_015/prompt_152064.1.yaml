answer: |-
  This is an exceptionally sharp reading of the *Treatise on Probability* (1921). You have identified the precise hinge upon which Keynes's later economic theory turns. Many readers miss the distinction between probability (the degree of rational belief) and weight (the completeness of evidence), collapsing them into a single metric of "confidence." Your intuition that this creates a two-dimensional structure of rational belief is correct, and it is the key to unlocking the connection between the *Treatise* and *The General Theory* (1936).

  Here is a parsing of the distinction you are grappling with, structured around your specific questions.

  ### 1. Is Weight Second-Order or Intrinsic?

  You ask whether weight is a second-order property of our confidence (epistemic/psychological) or an intrinsic feature of the logical relation (ontological/logical).

  **Keynes's Position:** Weight is an **intrinsic feature of the logical relation** between the evidence ($h$) and the hypothesis ($a$).

  Keynes was a logical objectivist (in the tradition of Leibniz and Bolzano, anticipating Carnap). For Keynes, probability is not a frequency in the world, nor is it a subjective feeling; it is an objective logical relation, similar to entailment. If $h$ is the evidence and $a$ is the conclusion, the probability relation $a/h$ exists independently of anyone knowing it.

  Consequently, the **weight of the argument** is also objective. It measures the *amount of relevant evidence* included in $h$.
  *   **Probability ($P$):** The balance of the evidence (favoring $a$ vs. not-$a$).
  *   **Weight ($V$):** The absolute amount of evidence (how much of the "total relevant evidence" is included in $h$).

  **Why this matters:** If weight were merely psychological confidence, it would be subjective and variable between agents. By making it intrinsic to the argument, Keynes argues that two agents with the same evidence *must* assign the same weight. However, because the "total relevant evidence" is often unknown or infinite, we can rarely measure weight numerically. We can only say that new evidence *increases* weight, even if it shifts the probability balance.

  ### 2. Incomparability and the Two-Dimensional Structure

  You ask: *If it is intrinsic, then Keynes seems to be claiming that some pairs of probabilities are strictly incomparable...?*

  **Yes.** This is the radical implication of Chapter VI of the *Treatise*.

  If rational belief is a single number (the Bayesian view), then any two beliefs are comparable. If Belief A = 0.6 and Belief B = 0.5, A is preferable. But if belief is a vector $(P, V)$, comparability breaks down.
  *   Case 1: $P_1 = P_2$, but $V_1 > V_2$. A rational agent prefers the argument with higher weight.
  *   Case 2: $P_1 > P_2$, but $V_1 \ll V_2$. (e.g., A 55% chance based on massive data vs. a 60% chance based on a hunch).

  Keynes argues there is **no rational principle** to decide between Case 2 scenarios. They are **incomparable**. This is not a failure of human cognition; it is a feature of the logical landscape. This directly undermines the Principle of Indifference and the Laplacean view that all uncertainty can be reduced to risk (numerical probability).

  ### 3. Rejection of Measurable Expectation

  You ask: *Does this framework provide Keynes with a principled reason to reject the reduction of all rational belief to measurable expectation?*

  **Absolutely.** This is the philosophical foundation for his critique of neoclassical economics.

  Neoclassical theory (and later, Savage's Bayesianism) relies on Expected Utility Maximization. This requires multiplying the utility of an outcome by a single scalar probability. Keynes's *Treatise* demonstrates that rational action cannot always be modeled this way because:
  1.  Probabilities are not always numerical.
  2.  Even if numerical, the **weight** is often too low to justify acting on the calculation.

  In the *Treatise*, Keynes suggests that when weight is low, the "risk" of being wrong (due to missing evidence) outweighs the mathematical expectation. This provides the *logical* justification for what he later calls "liquidity preference." We hold money not just because of interest rates, but because the weight of evidence regarding future asset prices is too low to justify committing capital, regardless of the calculated expected return.

  ### 4. From *Treatise* "Weight" to *General Theory* "Uncertainty"

  You ask: *How exactly does it relate to his later claim in The General Theory that "uncertainty" concerns situations where there is no scientific basis for forming any calculable probability?*

  This is where the scholarship gets nuanced (see the work of Tony O'Donnell or Victoria Chick). There is a shift in emphasis, though the core logic remains.

  *   **In the *Treatise* (1921):** Keynes allows for non-numerical probabilities. Even if you can't calculate a number, a logical relation of "partial entailment" might still exist. "Weight" is about how much evidence supports that relation.
  *   **In *The General Theory* (1936) and the 1937 QJE paper:** Keynes tightens the definition of "Uncertainty." He distinguishes "Risk" (where probabilities are known/calculable) from "Uncertainty" (where there is **no scientific basis** for any probability).

  **The Connection:**
  The *Treatise* provides the logical machinery that makes the *General Theory*'s claim possible.
  1.  **Low Weight $\rightarrow$ Non-Calculability:** In long-term investment (the focus of GT), the evidence base ($h$) is so scant relative to the complexity of the future that the weight is vanishingly low.
  2.  **The Collapse of the Relation:** When weight is sufficiently low, the logical probability relation itself becomes so vague that it ceases to be action-guiding. It effectively dissolves into "Uncertainty."
  3.  **Conventions:** Because the logical relation cannot guide us (due to low weight), agents in GT rely on "conventions" (assuming the future will be like the past) or "animal spirits" (spontaneous optimism) rather than mathematical expectation.

  So, the *Treatise* establishes that rational belief is not always numerical; the *General Theory* applies this to economics to show that **investment decisions are often made in the absence of rational probabilistic foundations.**

  ### 5. Epistemic Humility vs. Ontological Claim

  You ask: *I want to avoid conflating the epistemic humility expressed by low weight with the ontological claim that some outcomes are genuinely non-measurable, but I'm unsure whether Keynes himself keeps these separate.*

  This is the most difficult interpretive challenge.

  **Formally (in the *Treatise*):** Keynes is a **logicist**, not an ontological indeterminist. He is making a claim about the *relation between knowledge and hypothesis*, not necessarily about the fabric of reality. He does not explicitly argue that the future is metaphysically open (like a quantum event); he argues that our *knowledge* of the future is logically insufficient to form a numerical relation. This is **epistemic**.

  **Practically (in the *General Theory*):** The distinction blurs. Keynes writes that the future is "unknown," not just "unpredicted." He critiques the idea that the future is determined by calculable forces.
  *   **The Ergodicity Question:** Modern Post-Keynesians (like Paul Davidson) argue that Keynes implicitly assumed the economic world is **non-ergodic**. In an ergodic system, past frequencies predict future probabilities (high weight is possible). In a non-ergodic system, the future is ontologically distinct from the past, making evidence from the past irrelevant to future probabilities (weight cannot be increased by historical data).

  **Verdict:** Keynes keeps them separate in the *Treatise* (it is a logical limitation). However, in his economic application, he treats the epistemic limitation as so severe that it functions **as if** it were ontological. He rejects the "ontological claim" of the classical economists (that the future is determined and calculable) by using an "epistemic argument" (that the weight of evidence is too low to calculate it).

  ### Summary for Your Study Group

  1.  **Weight is Logical:** It is not psychological confidence; it is the objective completeness of the evidence set relative to the argument.
  2.  **Incomparability is Real:** Keynes argues that rational beliefs form a partially ordered set, not a linear numerical scale. Some risks are incomparable.
  3.  **Anti-Reductionism:** This two-dimensional view ($P, V$) is the principled reason Keynes rejects Expected Utility Theory. You cannot maximize expectation if the inputs are incomparable or non-numerical.
  4.  **ToP to GT:** The *Treatise* proves that non-calculable belief is rational. The *General Theory* argues that macroeconomic investment is dominated by these non-calculable beliefs ("Uncertainty"), forcing reliance on conventions rather than calculation.
  5.  **Epistemic vs. Ontological:** Keynes formally argues from an epistemic/logical standpoint (limits of knowledge), but his economic conclusions imply an ontology where the future is not pre-determined by calculable laws (non-ergodicity).

  You are reading it correctly: the "weight" of the argument is the conceptual bridge that allows Keynes to move from a theory of logic to a theory of economic crisis. Without it, *The General Theory* collapses back into standard risk analysis.
