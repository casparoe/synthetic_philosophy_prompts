      *   **Section 4: ToP to General Theory.** The transition from "low weight" to "uncertainty." The shift from logical relations to practical economic decision-making.
      *   **Section 5: Epistemic vs. Ontological.** The tricky part. Keynes is a logicist, but his economics implies ontological openness (non-ergodicity).
      *   **Conclusion:** Summary of the distinction.

  9.  **Final Review against User Query:**
