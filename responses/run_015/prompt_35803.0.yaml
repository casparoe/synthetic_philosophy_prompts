      *   *Selection 2: Resolute Choice as a Normative Alternative (Downstream).* If the standard model fails, what replaces it? McClennen's resolute choice is the main rival. Evaluating its cost (freedom vs. rationality) is a solid writing project.
      *   *Selection 3 (Alternative/Backup): The "Guaranteed Loss" Refinement.* If the user wants something more technical/logic-based. But given the "logic background, no econ" constraint, the Agency/Resoluteness angle is more philosophical and tractable. Let's stick with the Agency/Resoluteness axis. Actually, let's make the second one about the **Normative Force of Diachronic Consistency**. Is it rational to be resolute, or just stubborn?

