  # The branching questions

  1. **Pendulum:** You record a pendulum swing to six decimal places and re-run the experiment identically. Does it follow the exact same path? A Yes commits you to physical fixation; a No suggests fundamental openness or uncomputable laws preventing exact replication.
  2. **Weather:** The path is fixed, but the three-week weather forecast consistently fails. Is the barrier missing data or calculation time? Missing data implies sensitive dependence on initial conditions; calculation time implies computational complexity limits preventing timely solution.
  3. **Harvest:** Your forecast alters planting decisions. Is the forecast wrong, or did the world change to match the news? Wrong implies static truth independent of observers; changed implies reflexive systems where prediction alters the outcome itself.
  4. **Death Prognosis:** A patient reads their written death date. Can they act to survive past it? Yes implies defeatability and open futures responsive to agency; No implies fatalism regardless of knowledge or intervention.
  5. **Coin:** When a coin spins, is the outcome undecided until it lands, or merely unknown to you? Undecided implies ontic chance in nature; unknown implies epistemic limitation in a fully determined world.
  6. **Job Choice:** Given the exact same mental state, could you have picked the other job? Yes implies libertarian freedom to do otherwise; No implies determinism or compatibilist constraints on the definition of ability.
  7. **Seizure Device:** The device warns of a seizure seconds before. Does the warning itself trigger the event? Yes implies observer effects where knowledge changes physics; No implies passive prediction without interference in the chain.
  8. **Agency:** If you chose the job, did *you* start the chain, or did prior causes push you? You implies agent-causation outside prior chains; causes implies event-causation within a network of prior states.
  9. **Time:** Is next year's harvest already happening somewhere in spacetime? Yes implies block universe eternalism where future exists; No implies presentism and a genuinely growing future not yet real.
  10. **Narrative:** Does it matter if the future is fixed if characters cannot know it until arrival? Yes implies narrative openness suffices for experience; No implies ontological truth matters more than epistemic access.

  # The space before the names

  The logical space begins with physical fixation. If the pendulum repeats, the world is fixed; if not, it is open. This splits the tree into Deterministic and Indeterministic halves. Within Determinism, the Weather question separates those who believe prediction is possible in principle (Hard Determinism) from those blocked by chaos or computation (Chaotic/Uncomputable). The Harvest and Death questions test reflexivity: can the system absorb its own description? If the forecast changes the harvest, the model must include the modeler, creating a loop where accuracy is self-defeating.

  Within Indeterminism, the Coin question distinguishes random noise from agentive choice. If the job choice is random, you have Indeterministic Unfreedom. If it is chosen, the Agency question separates Event-Causal Libertarians (choices are events) from Agent-Causal Libertarians (agents are prime movers). The Time question cuts across both halves: a fixed future can be viewed as a static block or a flowing present. Finally, the Narrative question offers an exit hatch: even if fixed, if knowledge is impossible, the experience of openness remains valid.

  There are theoretically 1,024 combinations, but logical dependencies prune most. For instance, Agent-Causation requires an Open Future; Block Universe implies Fixed Physics. Superdeterminism occupies a rare corner where the investigator's choices are correlated with the system, bypassing the usual data barriers. This leaves approximately twelve viable paths through the grid, each corresponding to a distinct philosophical stance without overlap, ensuring every character occupies a unique logical coordinate.

  # The tree with named leaves

  Here are the terminal positions reachable by the tree. Each includes the specific philosophical label and the character flaw inherent in maintaining the position consistently within the Academy's scandal.

  1. **Hard Determinism:** The future is fixed and knowable in principle. Awkward commitment: Believes resistance is performance art, rendering moral outrage meaningless. They view the death prognoses as benign disclosures of fact.
  2. **Block Universe:** The future exists now in spacetime. Awkward commitment: Treats grief as geometry, denying the flow of time. They see the Academy as mapping terrain rather than predicting events.
  3. **Chaotic Determinism:** Fixed but sensitive to initial data. Awkward commitment: Trusts models more than eyes, ignoring human variance. They argue the death dates are accurate but useless due to sensitivity.
  4. **Uncomputable Determinism:** Fixed but logically inaccessible to any procedure. Awkward commitment: Believes in magic laws beyond reason. They claim the Academy claims knowledge it cannot compute.
  5. **Compatibilism:** Fixed but choice is real if uncoerced. Awkward commitment: Calls coercion "choice" if it feels nice. They argue reading the prognosis is a choice within the chain.
  6. **Indeterministic Unfree:** Random but no agency controls the dice. Awkward commitment: Treats people as noisy machines. They see the prognoses as probabilistic guesses mistaken for fate.
  7. **Event-Causal Libertarian:** Open choices are undetermined events. Awkward commitment: Hopes randomness equals freedom. They believe the prognosis can be defeated by random variation.
  8. **Agent-Causal Libertarian:** Agents start chains outside prior causes. Awkward commitment: Believes in souls without evidence. They insist the patient can veto the prognosis through will.
  9. **Superdeterminism:** Investigator correlated with system investigated. Awkward commitment: Thinks coincidence is conspiracy. They suspect the Academy causes the deaths it predicts.
  10. **Narrative Openness:** Fixed but unknowable until told. Awkward commitment: Values story over truth. They argue the prognosis ruins the narrative tension of living.
  11. **Relativistic Indeterminate:** No fixed future in relativistic spacetime. Awkward commitment: Confuses reference frames with reality. They claim the death date depends on the observer's speed.

  # Unoccupied cells

  Three combinations remain empty. First, Fixed + Defeatable is incoherent; if the future is physically fixed, acting to change it is a contradiction in terms, regardless of knowledge. This eliminates any view that claims certainty but allows avoidance. Second, Random + Agent Causal is unclaimed; it is difficult to square ontic chance with controlled agency without invoking dualism, so few philosophers occupy this cell. It leaves freedom as mere noise. Third, Uncomputable + Reflexive is unattractive; a world where laws are logically inaccessible and also changed by prediction offers no foothold for science, making it a position of despair rather than debate. No one wants to forecast in a system that hides its laws and changes its mind. These empty cells help define the boundaries of the viable positions by showing where logic breaks down or becomes useless for a functioning Academy. They serve as negative space, outlining the shape of the debate by marking where no one stands.

