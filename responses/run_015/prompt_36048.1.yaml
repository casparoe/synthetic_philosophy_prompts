answer: |-
  Your hypothesis that this is a verbal dispute is compelling, but your two worries correctly identify why it *behaves* like a substantive one. My diagnosis is that the impasse is neither purely verbal nor purely substantive. It is a **metalinguistic negotiation** over which conceptual tool should govern the normative inferences licensed by the word "function."

  The debate persists not because philosophers cannot distinguish the concepts (they can), but because "function" is a theoretical currency that purchases explanatory power. Both sides want to control the mint.

  Here is the assessment of your worries and the diagnosis of the stalemate.

  ### 1. The Definitional Arms Race (Your Second Worry)
  You ask: *If the dispute were merely verbal, why the arms race?*
  If this were a simple ambiguity like "bank" (river vs. money), we would expect disambiguation to dissolve the conflict. Instead, we see "repair jobs" (e.g., Garson's generalized selected-effect, or CR accounts adding "constraint" conditions).

  This suggests the dispute is **metalinguistic**. Both camps agree on the non-normative facts (the heart pumps, it was selected for pumping, it contributes to circulation). They disagree on which set of facts *ought* to govern the use of the term "function" because that term licenses specific inferences—specifically, inferences about **good, bad, and purpose**.

  *   **SE theorists** want the word "function" to track **teleology without mysticism**. They defend the etiological account because it is the only one that naturalizes "for-ness." If you give up history, they argue, you lose the ability to say a trait is *supposed* to do X.
  *   **CR theorists** want the word "function" to track **explanatory relevance in mechanism**. They defend the causal-role account because it is the only one that aligns with how biologists actually model systems (e.g., in neuroscience or molecular pathways where selection history is opaque or irrelevant).

  The arms race exists because each side is trying to capture the *other side's* intuitive wins without paying the metaphysical cost. SE theorists try to account for novel traits (to match CR's breadth); CR theorists try to account for malfunction (to match SE's normativity). They are competing to offer the **Unified Theory of Function**. As long as philosophers value theoretical unity over taxonomic pluralism, the arms race will continue.

  ### 2. The Malfunction and Medicine Case (Your First Worry)
  You ask: *Does the medical case force a choice?*
  This is the strongest substantive point for the SE view. The "Harmful Dysfunction" analysis (Wakefield) relies heavily on the idea that a part can fail to perform its function even if it is doing *something*. An appendix that does not contribute to immunity (on a CR view) simply lacks a function; on an SE view, it can malfunction (if it was selected for immunity) or be vestigial (if it wasn't).

  However, this does not strictly force a choice for the CR theorist, though it forces a concession.
  *   **The CR Counter:** A sophisticated CR theorist (like Boorse in his Biostatistical Theory) can define disorder not as "failure of selected effect" but as "reduction of typical contribution relative to a reference class." Normativity is derived from **statistical typicality** and **systemic integration**, not history. If a heart valve leaks, it reduces the organism's survival/reproduction capacity relative to the species design, regardless of history.
  *   **The Limit:** The CR account struggles with **vestigiality**. If the appendix is truly vestigial (no selected effect, no current capacity), SE says it has no function (and thus cannot malfunction, it's just useless). CR says the same. But if the appendix *causes* appendicitis, SE explains the harm as a clash between current environment and past selection. CR explains it as a systemic failure of containment.
  *   **Verdict:** The medical case does not prove SE is the *only* game in town, but it does show SE handles **etiological normativity** better, while CR handles **physiological normativity** better. If medicine is about *repairing to original spec*, SE wins. If medicine is about *restoring systemic capacity*, CR wins. The "forced choice" is actually a choice about what kind of medicine you are practicing.

  ### 3. Where the Pluralists' Concepts Make Contact
  You ask: *Where do the two concepts make contact?*
  They make contact at the level of **trait identification**, but diverge at **trait evaluation**.
  Both accounts agree on what counts as a trait (a heart, a gene, a pathway). They diverge on what counts as the *explanatory anchor* for that trait.
  *   **SE Anchor:** The past environment that stabilized the trait.
  *   **CR Anchor:** The containing system that utilizes the trait.

  The contact point is fragile. In standard cases (a healthy heart in a human), the selected effect (pumping) matches the causal contribution (pumping). The debate ignites in the **mismatch cases**: spandrels, vestigial traits, novel mutations, and synthetic biology.
  *   **Pluralist Truce:** The pluralist says, "Use SE for evolutionary biology and medicine; use CR for physiology and systems biology."
  *   **The Friction:** This truce fails when disciplines overlap. Evolutionary medicine needs physiology; systems biology needs to distinguish noise from signal (which sounds like malfunction). The concepts contact where **explanatory projects collide**.

  ### 4. Diagnosis: Substantive, Verbal, or Something Else?
  It is **something else**: a disagreement about **Explanatory Privilege**.
  It is not merely verbal because the choice of definition changes the output of the theory (e.g., whether a novel trait has a function). It is not purely substantive because no empirical data can resolve it (data tells us what the heart does and how it arose, but not which fact defines "function").

  It is a clash of **starting intuitions about naturalized normativity**.
  *   **SE Intuition:** Normativity requires history. You cannot get an "ought" from an "is" unless the "is" includes a historical selection process.
  *   **CR Intuition:** Normativity requires organization. You can get an "ought" from the structural constraints of a self-maintaining system (autopoiesis) without looking at the past.

  This is a metaphysical disagreement disguised as a semantic one.

  ### 5. What Counts as Progress?
  Given this diagnosis, an empirical result from systems biology will not end the debate, because both sides will interpret the data through their normative lens.
  *   **Synthetic Biology as a Test Case:** This is the most promising arena. If we build a self-replicating robot from scratch:
      *   **SE:** Does it have functions? Only if we treat the *designer's intent* as the selection mechanism (derived proper functions).
      *   **CR:** Does it have functions? Yes, immediately, based on its contribution to its own maintenance.
      *   **Progress:** If synthetic biologists find they *must* attribute functions to novel circuits to troubleshoot them, even without a selection history, this pragmatically favors CR for engineering contexts. If they find they need to reference the "design spec" (history/intent) to define "bug" vs. "feature," this favors SE.

  **The Rational Terminus:**
  To be candid: **The debate will not end.** Philosophers are incentivized to seek unified theories. Abandoning the quest for *The* Theory of Function in favor of a disjunctive pluralism feels like surrender.

  However, the **productive** terminus is the **Division of Labor**.
  Progress looks like stopping the attempt to subsume one account under the other.
  1.  **Accept Ambiguity:** Acknowledge "function" is a cluster concept.
  2.  **Contextualize:** Require that function ascriptions specify the explanatory context (Evolutionary? Physiological? Medical?).
  3.  **Drop the Normative Monopoly:** Admit that SE owns "malfunction" in the evolutionary sense, and CR owns "failure" in the systemic sense.

  The pluralists are right that there are two legitimate concepts. They are wrong to think a "truce" will stop the arguing. The arguing stops only when the philosophical community stops valuing **conceptual unity** over **explanatory precision**. Until then, the circle remains fixed, not because the problem is unsolvable, but because the participants are solving different problems while insisting they are solving the same one.
