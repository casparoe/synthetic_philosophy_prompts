      *   *Scenario:* The "Paradox of the Vanishing Premise."
      *   Agent holds a belief $B_0$ supported by reason $R_0$.
      *   At step 1, $R_0$ is found lacking, replaced by $R_1$.
      *   At step 2, $R_1$ is found lacking, replaced by $R_2$.
