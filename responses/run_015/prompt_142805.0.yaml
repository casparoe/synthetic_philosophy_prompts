      *   *Idea 2: Infinite Regress of Justification.* Believing $P$ because of $Q$, $Q$ because of $R$... (This is usually structural, not temporal).
      *   *Idea 3: Belief Revision.* An agent revises a belief infinitely many times.
          *   If I believe $P$, then revise to $\neg P$, then $P$... same as the lamp. This is too close to the original.
          *   Need something where the *content* changes in a way that creates indeterminacy not just of truth-value, but of *reference* or *justification*.
      *   *Idea 4: The "Limit" of Inquiry.* What is the ideal belief state after infinite investigation?
