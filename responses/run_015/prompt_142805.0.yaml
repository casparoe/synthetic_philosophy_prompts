      *   **The Case:** "The Paradox of the Asymptotic Justification."
      *   **Setup:** An agent refining a belief $B$ through infinite steps.
      *   **Mechanism:** Each step $n$ is justified *only* by its correction of step $n-1$. (Local justification).
      *   **The Limit:** At $t=1$, the belief content is well-defined (convergent), but the justification chain has no final link.
      *   **The Tension:** To hold the belief rationally, one needs a ground. The ground is the process. The process has no end. Therefore, the final belief is "orphaned."
      *   **Comparison to Lamp:** Thomson's Lamp asks "Is it on?" (Ontology). This asks "Am I justified?" (Normativity).
      *   **Implication:** Suggests that rational belief formation might be essentially *discrete* or *finite* in a way physical states need not be.

