      *   **Comparison:** Both make the RHS of SCA false while the LHS is true.
      *   **Why Finks are "Worse":** Masks are often seen as extrinsic add-ons. We can arguably "hold fixed" the intrinsic basis or specify conditions to exclude masks. Finks strike at the *connection* between stimulus and basis. The stimulus *changes* the intrinsic nature of the object. It challenges the stability of the basis during the testing interval.

