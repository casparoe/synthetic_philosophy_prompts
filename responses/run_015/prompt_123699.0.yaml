answer: |-
  # Desiderata for a Theory of Representational Realism in Neural Networks

  The following specification outlines the necessary conditions for a philosophical theory to qualify as a robust account of representational realism within the domain of artificial neural networks (ANNs). A theory of representational realism posits that neural networks possess internal states that genuinely carry content about the world, rather than merely functioning as input-output mappings. To be viable, such a theory must reconcile the mathematical realities of deep learning with the normative demands of semantic content.

  ## I. Core Desiderata

  ### 1. The Tracking-versus-Representation Distinction
  **Requirement:** The theory must distinguish between a system that merely covaries with a feature (tracking) and a system that represents that feature for the purposes of its functional architecture. It must explain why a network that perfectly predicts a label via a spurious correlation (e.g., background texture) does not thereby represent the object class, even if accuracy is high.

  **Motivating Case:** Consider a classifier trained to distinguish wolves from huskies that relies entirely on the presence of snow in the background. Adversarial perturbations can exploit this by inserting snow into images of non-wolves, causing misclassification. While the network *tracks* "snowiness" with high fidelity, attributing the representation <wolf> to the internal states driving this decision is intuitively incorrect. A realist theory must ground representation in something stronger than statistical covariance, likely involving the mechanistic role the feature plays in the system's broader cognitive economy.

  **Status:** **Non-negotiable.** Without this distinction, representational realism collapses into a trivial covariance theory where every correlated input feature constitutes a representation, rendering the concept explanatorily useless.

  **Excluded Approaches:** This excludes pure informational semantic accounts that rely solely on mutual information or correlation strength without a causal or functional filter. It also challenges naive teleosemantic accounts that equate selection history directly with current mechanistic function in synthetic systems.

  ### 2. Accommodation of Distributed Polysemy
  **Requirement:** The theory must account for the phenomenon wherein individual units or low-dimensional subspaces participate in multiple, context-dependent representations that are not linearly separable. It must either provide an ontology for superposed content or offer a principled argument that such polysemy is an artifact of analysis rather than a feature of the system.

  **Motivating Case:** In transformer models and dense networks, "polysemantic" neurons activate for disparate concepts (e.g., a single unit might fire for both "dog legs" and "car wheels"). Recent mechanistic interpretability suggests this is often due to superposition, where the network compresses more features than available dimensions. A theory insisting on one-to-one mapping between physical substrate and semantic content cannot describe these systems without positing massive error.

  **Status:** **Non-negotiable.** This is an empirical constraint derived from the geometry of high-dimensional vector spaces. A realist theory that demands localist "grandmother cell" granularity is empirically falsified by modern architectures.

  **Excluded Approaches:** This excludes strict localist realism and any structural mapping theory that requires a bijective (one-to-one) correspondence between neural units and represented features.

  ### 3. Interventional Stability
  **Requirement:** A representation should be identifiable through targeted mechanistic disruptions. Specifically, if a subset of weights or units is ablated or perturbed, the representational content should shift or vanish in a predictable manner, provided the ablation does not trigger compensatory redundancy that masks the change in output performance.

  **Motivating Case:** This condition is motivated by the causal manipulation standards in neuroscience. If a state purportedly represents <edge detection>, disrupting the mechanism responsible for it should degrade edge-related processing, even if the network reroutes to maintain final classification accuracy.

  **Status:** **Camp-Specific / Contested.** This is likely an **imported prejudice** from biological neuroscience and classical cognitive science. In overparameterized ANNs, functional redundancy is so high that one can ablate significant portions of the network with zero loss in task performance. Demanding that a representation be fragile to intervention may mistake *necessity* for *implementation*. A viable realism might need to accept that representations are multiply realizable within a single network, making interventional stability a property of the *subspace* rather than specific weights.

  **Excluded Approaches:** This condition tends to exclude purely behavioral functionalism, which ignores internal mechanism, but it also puts pressure on "weight-centric" realist views that tie content too tightly to specific parameter values.

  ### 4. Empirical Accessibility without Methodological Collapse
  **Requirement:** Claims about representation must be supportable by interpretability techniques (probing, attribution, visualization), but the theory must not identify representation *with* the output of these techniques. The probe reveals the representation; it does not constitute it.

  **Motivating Case:** Linear probing can find structure in random networks or untrained weights. If a theory defines representation as "what a linear probe can decode," it renders representation trivial and methodologically relative. Conversely, if a theory posits representations that are in principle undetectable by any causal or correlational analysis, it becomes metaphysically occult.

  **Status:** **Non-negotiable.** Scientific realism requires that posited entities be empirically accessible, but operationalism (identifying the entity with the measurement tool) is a category error.

  **Excluded Approaches:** This excludes radical operationalism (representation = probe accuracy) and epistemic anti-realism that claims internal states are inherently unknowable "black boxes."

  ### 5. Consistency with Learning Theory
  **Requirement:** The theory must remain coherent in light of overparameterization, the existence of multiple global minima, and implicit regularization. It must explain how representations can be "real" even if different training runs with different random seeds yield mechanistically divergent solutions that perform identically.

  **Motivating Case:** Two networks trained on the same data may converge to different weight configurations (different basins of attraction) that are functionally equivalent but mechanistically distinct. If realism requires a unique "true" representation, then at most one of these networks (or neither) possesses representations. This contradicts the intuition that both have learned the task.

  **Status:** **Non-negotiable.** This is a mathematical fact of high-dimensional optimization. A philosophical theory cannot dictate mathematical constraints to the architecture.

  **Excluded Approaches:** This excludes isomorphic mapping theories that require a unique structural correspondence between the model and the world. It also challenges views that tie representation too closely to specific convergence trajectories.

  ---

  ## II. Tensions and Joint Unsatisfiability

  There is a significant tension between **Interventional Stability (3)** and **Consistency with Learning Theory (5)**.

  *   **The Conflict:** Learning theory dictates that ANNs are massively overparameterized and possess high mechanistic redundancy (mode connectivity). This implies that many distinct internal configurations support the same function. Consequently, targeted interventions (ablations) often fail to disrupt performance because the network reroutes information through redundant pathways.
  *   **The Implication:** If a representation is real but supported by redundant mechanisms, ablating one pathway may not change the representational content accessible to the output, violating the expectation of Interventional Stability. Conversely, if we enforce Interventional Stability (i.e., the representation *must* break when the mechanism is broken), we may be forced to deny that overparameterized networks have stable representations at all, or we must define representations at such a high level of abstraction that they become disconnected from the mechanism.
  *   **Assessment:** These two desiderata appear jointly unsatisfiable under current understandings of mechanistic redundancy. A successful theory must likely weaken the Interventional Stability condition to allow for "functional stability despite mechanistic disruption," or it must restrict realism only to "minimal" subnetworks (e.g., lottery tickets), thereby sacrificing the claim that the full trained network is the representational vehicle.

  A secondary tension exists between **Distributed Polysemy (2)** and **Empirical Accessibility (4)**. If representations are superposed in a non-linear, context-dependent manner (polysemy), linear probes and standard visualization techniques may fail to access them without altering the context. This risks making the representations empirically inaccessible, pushing the theory toward the "occult" side of the Accessibility desideratum.

  ---

  ## III. Evaluation of Contenders

  The following assessment scores the three broad theoretical contenders against the established desiderata. The weighting prioritizes the non-negotiable constraints (Tracking, Polysemy, Accessibility, Learning Theory) over the contested Interventional Stability condition.

  ### 1. Causal-Informational Realism
  *This view grounds representation in the causal history of the network's training and the informational relationship between internal states and environmental features.*

  *   **Tracking vs. Representation:** **Strong.** By emphasizing causal history and functional role, it can distinguish between spurious correlations (accidental tracking) and robust features (representation).
  *   **Distributed Polysemy:** **Weak.** Causal accounts often struggle to explain how a single physical state can have multiple distinct causal histories or contents simultaneously without fragmenting the state into ad-hoc sub-components.
  *   **Interventional Stability:** **Moderate.** It aligns well with causal manipulation but struggles when redundancy masks causal contribution.
  *   **Empirical Accessibility:** **Moderate.** Causal structures are hard to map perfectly with current probing tools.
  *   **Learning Theory Consistency:** **Weak.** It has difficulty explaining how two mechanistically distinct networks (different causal histories/weights) can possess the "same" representations.
  *   **Overall:** Fails primarily on the Learning Theory and Polysemy constraints.

  ### 2. Structural-Mapping Realism
  *This view posits that representation consists in an isomorphism or homomorphism between the relational structure of internal activations and the structure of the domain being modeled.*

  *   **Tracking vs. Representation:** **Weak.** Structural maps can be found between spurious features and labels just as easily as robust ones. It lacks a normative filter for *why* one map is the representational one.
  *   **Distributed Polysemy:** **Strong.** It can accommodate superposition by mapping subspaces to overlapping structural features in the domain.
  *   **Interventional Stability:** **Moderate.** Structural damage should disrupt the map, but redundancy complicates this.
  *   **Empirical Accessibility:** **Strong.** Structure is amenable to mathematical analysis and probing.
  *   **Learning Theory Consistency:** **Strong.** It can argue that different weight configurations instantiate the same abstract structural map, preserving realism across minima.
  *   **Overall:** Fails primarily on the Tracking distinction, risking the inclusion of spurious correlations as genuine representations.

  ### 3. Instrumentalist Deflationism
  *This view denies that internal states possess genuine content, treating "representation" as a useful shorthand for predicting input-output behavior.*

  *   **Tracking vs. Representation:** **Neutral.** It dissolves the distinction. If the output is correct, the "representation" talk is valid; if not, it is invalid. There is no deeper fact of the matter.
  *   **Distributed Polysemy:** **Strong.** It treats polysemy as a modeling choice, not an ontological puzzle.
  *   **Interventional Stability:** **Strong.** It only cares about output stability, not internal mechanistic stability.
  *   **Empirical Accessibility:** **Strong.** It aligns perfectly with behavioral testing.
  *   **Learning Theory Consistency:** **Strong.** It is indifferent to mechanistic divergence as long as function is preserved.
  *   **Overall:** While it satisfies the empirical and mathematical constraints effortlessly, it fails the primary brief of the seminar: it is not a theory of *Representational Realism*. It scores highly on coherence but negatively on the foundational goal of establishing the reality of internal content.

  ### Summary Verdict
  **Structural-Mapping Realism** emerges as the most viable candidate for a *realist* framework, provided it can be augmented with a normative constraint to solve the Tracking problem (perhaps by incorporating elements of Causal-Informational theory). **Causal-Informational Realism** is too rigid for the mathematical realities of overparameterization. **Instrumentalist Deflationism** succeeds conceptually only by abandoning the realist project entirely. The primary theoretical work for the seminar, therefore, lies in refining Structural-Mapping accounts to exclude spurious isomorphisms without succumbing to the prejudices of Interventional Stability.
