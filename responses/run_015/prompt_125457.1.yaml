      *   *Perspectival-Dissolution Camp (PDC):* Focuses on the fluidity of identity itself. The distinction between "Zhuangzi" and "Butterfly" is the problem, not the uncertainty. The dream reveals the arbitrariness of the boundary. Key mechanism: Boundary dissolution.

