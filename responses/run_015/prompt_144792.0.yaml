          *   Object C: The Matter (Wood/Flesh).
      *   *The Twist:* In standard cases, the artifact (Statue) is usually the "higher" ontological category that depends on the matter. In Pinocchio, the "Person" is the higher category, but it starts as an Artifact.
      *   *User's Hypothesis:* "Real Boy" is a status, not a sortal. This implies constitution might be about *social/moral recognition* rather than just physical composition.

  3.  **Analyze the Source Material (Collodi vs. Disney):**
      *   *Collodi (1883):* Darker, more picaresque. The wood talks *before* Geppetto gets it. The transformation happens after Pinocchio sacrifices for his father (moral act). The puppet body is left behind on a chair (dualism? shedding?).
      *   *Disney (1940):* Softer. Wood is inert until magic. Transformation is a reward for bravery/truthfulness. The puppet body *becomes* the boy (transubstantiation? metamorphosis?).
