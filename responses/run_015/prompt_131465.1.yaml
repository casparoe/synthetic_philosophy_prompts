  10. **Final Polish:** Check constraints (no citations, rigorous argument). Ensure the software engineer persona is respected (use terms like "state," "protocol," "latency" carefully/metaphorically where helpful, but keep philosophy primary). *Self-correction: Don't overuse jargon. Keep the philosophical logic tight.*

