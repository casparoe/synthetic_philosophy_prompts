answer: |-
  Here are ten questions designed to build an arc from the definition of her view to its epistemic and metaphysical costs, ending with falsification. Each includes a follow-up tailored to her likely defense.

  **1. The Special Relativity Baseline**
  Standard special relativity already tells us that observers moving at different speeds cannot agree on a universal "now." Yet you've suggested that passage can still be real in some relativistic universes. If the lack of a shared present didn't kill passage in standard relativity, why does the structure of Gödel's universe succeed where Einstein's original theory failed?

  *   **Follow-up:** She will likely say standard relativity allows a *preferred* slicing even if observers disagree, whereas Gödel allows *no* consistent global slicing. Press this: So the threat isn't that we disagree about the time, but that the universe literally cannot be stacked into layers of "successive moments" at all?

  **2. The Tipping Light Cones**
  You describe the Gödel universe as having light cones that tip over until paths can loop back on themselves. For a listener who feels time passing right now, what is the specific structural failure here? Is it that the "future" stops being distinct from the "past," or simply that you can't draw a single line through the whole universe that counts as "today"?

  *   **Follow-up:** If she says it's the inability to draw the line (the global slicing), ask: Why is *that* specific geometric feature the switch for reality? Why isn't the local experience of the future being open sufficient, regardless of whether the whole universe can be layered?

  **3. Substantive vs. Stipulative**
  This leads to a worry about definitions. If your claim is that "real passage" *just means* "the existence of a global time function," aren't you changing the subject? If a critic grants all your geometry but says, "Passage is about how change feels, not how the universe is sliced," have you actually answered them, or just stipulated that their definition is wrong?

  *   **Follow-up:** She will likely argue this is a theoretical identification, like "water is H2O." Ask: But with water, we can test the substance. Here, you're saying the feeling is irrelevant to the fact. If the identification severs the link to experience entirely, how is this different from just declaring time an illusion and renaming it?

  **4. The Patchwork Verdict**
  I want to test the locality of this view. Imagine a universe that is Gödel-like in one vast region but expanding with a cosmic time in another, and suppose observers can travel between them. On your view, is the reality of passage a local property that changes as you cross the border, or is it a verdict on the whole universe that applies everywhere?

  *   **Follow-up:** She will almost certainly say it is global (the whole universe lacks passage). Ask: So if the universe is globally Gödelian, even the observers in the "expanding" region—who have a perfect cosmic time locally—are wrong about time passing?

  **5. The Error of the Locals**
  If those local observers are wrong, what is the nature of their error? They have clocks that tick, memories that form, and causes that precede effects. If passage isn't real for them, are they hallucinating the flow of time, or is there a sense in which their lives are genuinely successive but the label "passage" is withheld for structural reasons?

  *   **Follow-up:** If she says they are hallucinating or mistaken: Ask how a physical structure light-years away dictates the metaphysical status of their local consciousness. Does the reality of my present moment really depend on the shape of spacetime beyond my observational horizon?

  **6. Epistemic Fragility**
  This brings us to how we know the shape of the universe. Our belief in a cosmic time rests on cosmological models inferred from limited data. How sensitive is the reality of time, on your view, to those models? If the data is slightly ambiguous, is the reality of passage also ambiguous?

  *   **Follow-up:** She will likely admit science is fallible but insist it's our only guide. Ask: But if the reality of time turns on a cosmological inference that could be updated next year, does that make passage itself a fragile, fluctuating fact, or does it suggest we're looking for it in the wrong place?

  **7. The Horizon Problem**
  Suppose the Gödelian region lies entirely outside our observational horizon, forever invisible to us. In that case, is the question of whether time passes empirically undecidable? Are we forced to say we simply cannot know if our own experience is real?

  *   **Follow-up:** If she accepts this undecidability: Ask whether this is a *reductio* of the view. If a theory tells us we can never know if time is real, even from the inside, how does it differ from the skeptical view that time is unreal, which you claim to oppose?

  **8. Causal Hostage**
  If passage is hostage to global structure, what else goes with it? Is the reality of local causal facts—like this cup breaking because I dropped it—also dependent on the global shape of spacetime? Or is causation safe even if passage is not?

  *   **Follow-up:** She will likely distinguish them, saying causation is local light-cone structure. Ask: Why is passage special? Why does the "flow" of time require a global certificate of authenticity when cause-and-effect seems to work perfectly well with just local connections?

  **9. Falsification**
  Let's talk about getting this wrong. What observation or argument would compel you to abandon the view that passage requires global slicing? Is there a physically possible universe where global slicing fails, but you would still concede time passes?

  *   **Follow-up:** If she says "No, the definition holds," ask: Then what could possibly change your mind? If the view is insulated from local experience by definition, and insulated from falsification by cosmological uncertainty, what work is it doing?

  **10. The Internal/External Divide**
  You insist that the reality of time is settled by cosmology, not by how things look from the inside. But if cosmology and experience come apart—as they do in the Gödel case—why should we trust the external model over the internal evidence? Why is the "view from nowhere" more authoritative on the reality of time than the view from within?

  *   **Follow-up:** If she says instruments are more reliable than senses: Ask whether that applies to *existence* claims. A telescope tells me about stars; does it really tell me whether my own conscious experience of succession is veridical, or does it just tell me about geometry?

  ***

  ### Analysis and Commitment

  **The Village Picture**
  Your picture of the village—where neighbors agree on the time but the agreement fails globally—is actually a strong intuitive handle for your audience, but it contains a specific risk. It misleads by suggesting the problem is one of *coordination* or *synchronization* (like neighbors failing to set their clocks). In Gödel's universe, the problem is topological: it is not that the neighbors *fail* to agree, but that the structure of the universe *forbids* a consistent definition of "agreement" from being extended. A better picture might be a spiral staircase that looks flat locally but loops back on itself globally; you can walk up forever, but you never reach a higher "level." The village picture risks making the issue sound conventional rather than structural.

  **The Patchwork Case**
  Your patchwork case does not rest on a confusion; it is the strongest philosophical objection available. It targets the "supervenience" of metaphysical facts on physical ones. While stitching a Gödel metric to an expanding metric is physically messy in General Relativity, as a philosophical probe it is valid. It exposes the counter-intuitive cost of her view: that the metaphysical status of a local event (time passing here) depends on distant regions with which it has no causal contact. Do not soften this; it is the point where her view is most vulnerable.

  **The Bet**
  I expect her commitment to crack first on **Epistemic Fragility (Questions 6 & 7)**. The claim that time's reality is *a posteriori* is her most distinctive bullet to bite, but it renders the view practically indistinguishable from skepticism. If the reality of passage depends on global topology that may lie beyond our horizon, she is forced to admit we cannot know if time is real. At that point, the distinction between "time is real but unknowable" and "time is unreal" collapses for all human purposes. She will struggle to explain why her view offers a better account of our situation than the flat elimination of time, once she concedes that the "reality" she defends is empirically inaccessible.
