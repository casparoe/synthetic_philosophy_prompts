      *   *Clean Translations:* ERM failure, Underdetermination, Hypothesis Class Restriction.
      *   *Distorted Translations:* "Prior" vs. "Entrenchment". A prior is subjective belief; entrenchment is linguistic history.
      *   *Lost:* The communal aspect. ML is usually single-agent optimization. Goodman is about shared language games.
      *   *The "Changing the Subject" Charge:* ML assumes a fixed test distribution (the "world" is stable). Goodman questions the stability of the predicates used to describe the world. ML solves "prediction given a representation." Goodman asks "which representation?"

