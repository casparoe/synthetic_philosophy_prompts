      *   **Goal:** Settle it by *translation*, not references. Reconstruct the riddle in ML vocabulary.
      *   **Constraints:** No connectivity (no references/page numbers). Focus on argument/structure.
      *   **Specific Tasks:**
          1.  Translate the core riddle (Green vs. Grue) into ML terms (Hypothesis class? Feature map? Prior? Entrenchment?).
          2.  Analyze two variants: "Grue-by-provenance" (Instrument A/B) and "Grue-by-index" (Train/Test split leak).
          3.  Evaluate if the ML framing assumes away the hard problem (fixed environments/test distribution).
