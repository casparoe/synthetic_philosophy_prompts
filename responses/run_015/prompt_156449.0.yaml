answer: |-
  Here is the structural plan for your ninety minutes.

  ### 1. The Dependency Structure (The Order of Operations)

  Your instinct about the levels of analysis (between-country vs. within-country) is correct, but it is **not the first move**. It is the *second* load-bearing wall. If you lead with levels, the audience will still be stuck on the definition of the X-axis.

  Here is the required sequence of distinctions. Do not proceed to the next step until the room agrees on the current one.

  1.  **Equality of Opportunity vs. Equality of Outcome.**
      *   *Why first:* If your audience defines "gender equality" as "50/50 representation in all fields," the paradox is a tautological contradiction, not a finding. You must establish that the index measures *rights, safety, and access* (opportunity), not *distribution of labor* (outcome).
      *   *The Check:* Ask, "If women freely choose not to code, is that a failure of equality?" If the room splits here, stop and resolve it. The paradox only exists if equality means *freedom to choose*.

  2.  **Levels of Analysis (Your Instinct).**
      *   *Why second:* Once "equality" is defined as opportunity, you must prevent the Ecological Fallacy. A country-level correlation (wealthier = more sorted) does not imply an individual-level causation (richer women = more sorted).
      *   *The Check:* Explicitly state: "We are comparing *societies*, not *individual women*. We are asking how the *environment* changes the *aggregate choice*."

  3.  **Constraint vs. Preference.**
      *   *Why third:* Now you can introduce the mechanism. In high-constraint environments, economic necessity overrides preference. In low-constraint environments, preference drives choice.
      *   *The Check:* Ensure everyone agrees that "choice" is always a mix of constraint and preference, but the *ratio* shifts with wealth.

  ### 2. The Carrying Example

  Do not use "STEM vs. Humanities" generally. It is too vague and invites gatekeeping arguments. Use the specific contrast from the Stoet & Geary (2018) data that sparked this debate:

  **The Contrast:** **STEM Graduation Rates in Norway vs. Algeria.**

  *   **The Setup:** In Algeria (lower GDP, lower gender equality index), ~40% of STEM graduates are women. In Norway (high GDP, high gender equality index), ~20% of STEM graduates are women.
  *   **What it must HAVE:**
      *   **Competence Data:** You must show PISA math/science scores proving Algerian and Norwegian girls are *equally capable* of the work. This removes "ability" as the confounder.
      *   **Economic Stakes:** Highlight that in Algeria, a STEM degree is a guaranteed ticket to economic security for a family. In Norway, the welfare state ensures a humanities degree also leads to security.
  *   **What it must LACK:**
      *   **Legal Barriers:** Explicitly note that Norwegian women are not legally barred from engineering, and Algerian women are not legally forced into it.
      *   **Pay Gap Explanations:** Do not let the discussion drift into "women are paid less in STEM." In this specific dataset, the financial incentive for STEM is actually *higher* in the egalitarian countries, making the choice *more* paradoxical if money were the only driver.

  **Why this works for hackers:** It treats the career choice as an optimization problem. In Algeria, the objective function is *maximize security*. In Norway, the objective function is *maximize personal fit*. The constraints change the optimal solution.

  ### 3. Your Pet Hypothesis: Evaluation and Placement

  **Evaluation:**
  Your hypothesis is **not a motte-and-bailey**, provided you are precise. It is a standard **Post-Materialist / Self-Actualization** mechanism (closely related to Inglehart's modernization theory).
  *   **The Motte:** "When survival risk is removed, people sort based on stable preferences." (Defensible, economic logic).
  *   **The Bailey:** "Those stable preferences are purely biological and immutable." (Undefended, controversial).
  *   **Verdict:** It is a real mechanism. The risk is smuggling in the Bailey. You must acknowledge that "intrinsic fit" could be shaped by early childhood socialization, even if it feels intrinsic later.

  **Placement:**
  Introduce this **after** Step 3 (Constraint vs. Preference) but **before** the Q&A.
  *   Do not present it as the *answer*. Present it as the *null hypothesis for a preference-based model*.
  *   **Script:** "If we assume preferences exist but are usually suppressed by risk, does this data look like a paradox? Or does it look exactly like a relaxation of constraints?"
  *   This forces the room to stress-test whether "preference" is a sufficient explanation, rather than accepting it as a biological conclusion.

  ### 4. The Misconception Sequence

  Expect these three objections in this specific order. Head them off at the indicated times.

  1.  **"Egalitarian means gender-neutral, so the finding is self-contradictory."**
      *   *When:* Minute 0–15.
      *   *Head off:* During the **Equality of Opportunity** definition. If you don't nail this, the rest of the night is noise.
  2.  **"So it's innate, case closed."**
      *   *When:* Minute 45 (immediately after showing the Norway/Algebra contrast).
      *   *Head off:* During **Your Hypothesis**. Explicitly state: "This model predicts sorting regardless of whether the preference is biological or socialized, as long as it is *stable*. Do not conflate 'preference' with 'DNA'."
  3.  **"The index is just badly constructed / GDP is a proxy for something else."**
      *   *When:* Minute 70 (when people look for an exit from the conclusion).
      *   *Head off:* During **Levels of Analysis**. Acknowledge that indices are imperfect, but note that the pattern holds across multiple different metrics (GDP, WEF Index, Social Progress Index). The robustness is the point, not the specific metric.

  ### 5. The Closing

  **The Diagnostic Question:**
  Ask this to distinguish structural understanding from persuasion:
  > *"If we discovered that women's interest in STEM was 100% socially constructed, but still stable by adulthood, would the Gender-Equality Paradox disappear?"*

  *   **Correct Answer (Structural):** "No. The paradox describes the *relationship between wealth and sorting*, not the origin of the preference. If socialization creates a stable preference, rich countries will still show more sorting."
  *   **Incorrect Answer (Persuaded):** "Yes, because then it's just patriarchy." OR "No, because it's biological." (Both miss the point that the *mechanism* is wealth relaxing constraints, regardless of preference origin).

  **What to Explicitly Refuse to Settle:**
  State clearly at the start: **"We are not settling the Origin of Preferences (Nature vs. Nurture) tonight."**
  *   The paradox holds whether preferences are innate or socialized, provided they are *revealed* when constraints are lifted. Trying to solve the origin story will blow your 90 minutes and derail the structural logic.
