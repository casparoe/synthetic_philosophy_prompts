      *   **Constraint 1 (Crucial):** Do *not* explain the paradox. Give the *plan* for explaining it. Focus on dependency structure (what distinctions must be in place before the finding makes sense).
      *   **Constraint 2 (User's Instinct):** The user thinks the key is the levels of analysis (between-country vs. within-country). I need to validate or correct this.
      *   **Constraint 3 (Carrying Example):** Need one concrete contrast where choice is voluntary, downside is cushioned, and gatekeeping isn't the main driver. Define what it must have/lack.
      *   **Constraint 4 (Pet Hypothesis):** The user has a hypothesis (welfare state compresses penalty -> allows sorting on small intrinsic differences). I need to evaluate this (real mechanism vs. motte-and-bailey) and place it in the sequence.
      *   **Constraint 5 (Misconceptions):** Order the expected misconceptions (Egalitarian=Neutral -> Innate -> Bad Index) and say when to head them off.
      *   **Constraint 6 (Closing):** One diagnostic question to distinguish structural understanding from persuasion, and what *not* to settle.

  2.  **Deconstruct the Dependency Structure (The "Skeleton"):**
      *   The user's instinct about levels of analysis is correct but incomplete. It's the *statistical* prerequisite, but the *conceptual* prerequisite is defining "equality."
      *   *Step 1: Define Equality of Opportunity vs. Equality of Outcome.* If the audience thinks "gender equality" means "50/50 split everywhere," the paradox looks like a contradiction. If it means "freedom to choose," the paradox is just data.
      *   *Step 2: Levels of Analysis.* As the user noted, Country-Level (wealth/policy) vs. Individual-Level (choice). Ecological fallacy warning.
      *   *Step 3: The Resource Mechanism.* Why does wealth matter? (Scarcity vs. Self-Actualization).
      *   *Step 4: The Preference Distribution.* Overlapping bell curves vs. distinct bins.

  3.  **Evaluate the User's Instinct:**
      *   *Instinct:* "Two variables sit at different levels... nothing about individual causation follows directly."
      *   *Verdict:* This is the *second* most important move. The *first* move must be defining what "equality" means in the index (usually opportunity/rights, not outcome). If you skip this, the levels argument won't land because they'll think the index is measuring the wrong thing.
      *   *Correction:* Put "Definition of Equality" before "Levels of Analysis."

  4.  **Select the Carrying Example:**
