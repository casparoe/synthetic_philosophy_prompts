answer: |-
  **Final Credence:** 0.58

  **Decomposition:**

  1.  **Coherence of the swap machine:** 0.90 — Path dependence makes the counterfactual unstable, but equilibrium modeling allows us to simulate distinct institutional steady-states holding other factors fixed.
  2.  **Institutions as causal variable:** 0.80 — Instrumental variable strategies (e.g., settler mortality, partitions) successfully isolate exogenous variation in rules from reverse causality.
  3.  **Causal load split (Inst > Geo + Cult):** 0.60 — Institutions likely explain ~50% of income variance, while geography and culture combined explain ~40%, leaving the institutional claim marginally ahead.
  4.  **Interaction effects (badly posed question):** 0.45 — While factors interact (e.g., geography constrains state capacity), marginal effects remain identifiable enough to make the additive comparison meaningful.
  5.  **External validity of natural experiments:** 0.50 — Local identification from colonial or partitioned cases is strong, but extrapolating those coefficients globally over 500 years is fragile.
  6.  **Uncertainty source (semantics vs. reality):** 0.60 — Roughly 40% of the disagreement stems from defining whether "culture" is distinct from "informal institutions" rather than empirical divergence.

  **Least Trusted Term:**
  Term 5 (External validity of natural experiments). The leap from specific historical discontinuities (like Korea or the Andes) to a universal law of development is the weakest link in the econometric chain.

  **Finding That Would Move It:**
  A robust reconstruction of global GDP per capita in 1400. If we knew with certainty which regions were rich *before* the colonial institutional shocks, we could determine whether institutions drove growth or simply followed pre-existing geographic/cultural advantages.

  **Where You and Your Friend Disagree:**
  You disagree on **exogeneity**. You treat institutions as a lever that can be pulled independently (the economist's view); she treats institutions as an endogenous outcome of deeper historical and geographical currents (the historian's view). She isn't denying institutions matter; she's denying they can be "swapped" without changing the underlying history that produced them.
