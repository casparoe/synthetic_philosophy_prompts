answer: |-
  **What the method commits us to, in our vocabulary**

  Heterophenomenology commits us to treating the transcript as the only reality we can access. We do not measure the patient's pain; we measure the patient's report of pain. The utterance is a text, not a window into a private inner show. This means we stop asking, "Is this true?" and start asking, "Is this text consistent, stable, and interpretable?"

  For your team, this shifts the burden of proof. A symptom is not a symptom because a patient feels it; it is a symptom because the text supports a coherent construct that survives interrogation. We adopt a neutral stance. We do not assume the patient is the ultimate authority on their experience, nor do we assume the clinician is. We assume both are producing data that must be reconciled.

  This protects you from regulators. If challenged, you do not claim access to qualia. You claim access to a rigorously interpreted corpus of speech. It validates your Two-Route Rule: if a concept only appears when suggested, it is an artifact of the interview, not a feature of the patient's world. It validates your Gloss-Swap: if a term is not adopted into the patient's active vocabulary, it is not their concept, regardless of their assent.

  However, this method demands discipline. It forbids you from smoothing over contradictions to please a sponsor. If the text is contradictory, the construct is unstable. You are building a map of the speech, not the territory. If the speech shifts with the wind (order effects), the map is useless. You must be willing to discard items that feel real but lack textual stability.

  **The protocol**

  **Gate 1: Transcription Integrity**
  *   **Question:** Is the utterance intelligible as a standalone text without appealing to the interviewer's private notes or tone?
  *   **Sufficient Answer:** The coded concept can be derived solely from the written transcript provided to the coders.
  *   **Stop Rule:** If the meaning relies on "she sounded sad" or "he gestured widely," the data is inadmissible.
  *   **Escalation:** None. This is a binary quality control check.

  **Gate 2: The Two-Route Check (Independence)**
  *   **Question:** Did the concept appear in spontaneous recall *and* under structured probing, without being named by the interviewer first?
  *   **Sufficient Answer:** The patient volunteers the term/concept early, and later confirms/elaborates when asked about that specific domain, without the interviewer planting the seed.
  *   **Stop Rule:** If the concept only appears after the interviewer introduces the term, it is an interviewer artifact. Kill the item.
  *   **Escalation:** If the concept is spontaneous but never survives probing (mentioned once, then denied), escalate to Director.

  **Gate 3: The Gloss-Swap Test (Ownership)**
  *   **Question:** When the clinical gloss is substituted for the patient's term, does the patient integrate the gloss into their subsequent speech unprompted?
  *   **Sufficient Answer:** Patient uses the clinical term themselves in later responses, indicating conceptual alignment.
  *   **Stop Rule:** If the patient merely assents ("Yes, that's it") but reverts to their own metaphor or silence, the gloss is not owned. Kill the clinical term; keep the patient term if stable.
  *   **Escalation:** If the patient rejects the gloss but the clinician insists it is medically necessary, escalate to Director.

  **Gate 4: Cross-Lingual Coherence**
  *   **Question:** Does the concept structure hold across all three language transcripts, regardless of specific vocabulary?
  *   **Sufficient Answer:** The underlying distinction (e.g., between "tiredness" and "weakness") is maintained in all three languages.
  *   **Stop Rule:** If the concept collapses or merges with another in one language, the construct is culturally unstable. Kill the item for global use.
  *   **Escalation:** If the concept is vital for one region but fails in others, escalate to Director for regional instrument decision.

  **Gate 5: Construct Definition (The Value Gate)**
  *   **Question:** Is this text describing a symptom (direct experience), a consequence (impact on life), or a coping mechanism?
  *   **Sufficient Answer:** Clear consensus among three coders on the category.
  *   **Stop Rule:** If coders cannot agree on whether it is a symptom or an impact, the item is ambiguous. Hold for review.
  *   **Escalation:** This is the primary hand-off point. The protocol cannot decide if the instrument should measure symptoms or impacts. The Director must decide based on the label claim strategy (detecting change vs. giving vocabulary).

  **Worked applications**

  **Case 1: Brain Fog**
  The protocol kills this item in its current form. Under Gate 2, patients volunteer it (Pass), but under Gate 3 (Gloss-Swap) and Gate 5 (Definition), it fails. If they cannot define it beyond forum-derived metaphors, the text lacks semantic stability. Heterophenomenology treats the metaphor as the data, not the "fog." If the metaphors vary wildly between patients (clouds vs. static vs. sludge), there is no single construct.
  *Decision:* Do not submit "Brain Fog" as a headline item. It is a collection of distinct cognitive complaints masquerading as one. Break it down. Ask about "trouble finding words" or "slowed thinking." If the sponsor insists on "Brain Fog," you must document that it is a patient-preferred label for a heterogeneous cluster, not a psychometrically stable unit. The protocol protects you here: you are not denying their experience, you are refining the text.

  **Case 2: Order Effects (Pain/Fatigue)**
  This is a fatal failure at Gate 1 and Gate 4. If the severity score shifts based on question order, the text is context-dependent, not a report of a stable state. Heterophenomenology dictates that the "inner show" is irrelevant; the only truth is the report. If the report changes when the context changes, the instrument is measuring the interview dynamic, not the condition.
  *Decision:* Kill the single severity item. You must split the construct or randomise the order in the trial. You cannot claim to measure "Fatigue Severity" if the number is a function of whether Pain was asked first. This is not a judgement call; the evidence shows the text is unstable. Present this to the sponsor as a validity risk. If they force it, you must note in the report that the score is context-sensitive.

  **Case 3: Diary Discrepancy**
  The protocol escalates this at Gate 5. You have two texts: the interview transcript and the eDiary log. They contradict. Heterophenomenology does not privilege the diary as "objective" nor the interview as "authentic." Both are reports generated in different contexts (social pressure in the clinic vs. private solitude).
  *Decision:* This is a Director call. Which context matches the intended label claim? If the trial measures daily functioning, the diary is the relevant text. If the trial measures recall at a visit, the interview is the text. You cannot merge them. Do not average them. Choose the context of use. The protocol flags the discrepancy as evidence that "symptom" is not a stable entity across time/context, requiring a strategic decision on what the instrument is *for*.

  **Case 4: Item Wording (First-Person vs. Third-Person)**
  Your suspicion is partially a misreading. Heterophenomenology requires the *researcher* to take a third-person stance toward the data, but it does not forbid the *item* from being first-person. "I feel pain" is still a text. The error occurs if you treat "I feel pain" as incorrigible truth.
  *Decision:* You can use first-person claims ("I have trouble...") provided the validation treats them as reports, not facts. The method implies you must validate that the patient understands "I" consistently. If the sponsor insists on first-person, accept it, but ensure your cognitive debriefing (Gate 3) confirms they understand it as a report of their experience, not a medical diagnosis. The method does not ban first-person; it bans naivety about first-person.

  **Where the protocol misfires**

  The protocol cannot settle questions of value. It can tell you if "Brain Fog" is a stable text, but it cannot tell you if "Brain Fog" matters more than "Nausea" to the regulator. That is a political decision, not an evidentiary one. When the sponsor demands an item that passes the protocol but adds no discriminative power, the protocol is silent. You must intervene as a director.

  It also struggles with the translation distrust. Gate 4 checks for structural coherence, but if you distrust the back-translation, you are admitting the text itself is corrupted. The protocol assumes the transcript is the ground truth. If the translation is bad, the protocol is processing garbage. You need a linguistic audit outside this workflow; this protocol cannot fix broken language data.

  Finally, the protocol creates bureaucracy. In a six-week sprint, escalating every ambiguity to you will bottleneck the process. The "Stop Rules" are fast, but the "Escalations" require your time. You must empower the coders to make the value judgments on low-stakes items, or you will miss the deadline. The protocol is a filter, not a decision engine. It clears the debris so you can see the hard choices, but it cannot make the hard choices for you.

  **The one-page version**

  **QUALITATIVE CODING CHECKLIST (HETEROPHENOMENOLOGY)**
  *Pin above desk. If any box is unchecked, do not proceed.*

  1.  **Text Only:** Can I code this using *only* the transcript? (No audio cues, no interviewer notes).
  2.  **Two-Route:** Did the patient say it spontaneously *and* confirm it when probed?
  3.  **No Planting:** Did the interviewer avoid naming the concept before the patient did?
  4.  **Gloss Ownership:** If we offered a clinical term, did the patient use it back to us later?
  5.  **Language Check:** Does this concept make sense in all three language transcripts?
  6.  **Category:** Is this clearly a Symptom, Impact, or Coping? (Circle one).
  7.  **Stability:** Did the patient contradict themselves within the same interview?
  8.  **Context:** Does this match the Diary data? (If No, Flag for Director).
  9.  **Wording:** Is the item phrased as a report ("I feel"), not a fact ("I have")?
  10. **Decision:**
      *   All Pass -> **Admit to Pool**
      *   Fail 2, 3, 4, 5 -> **Kill Item**
      *   Fail 6, 8 -> **Escalate to Director**
