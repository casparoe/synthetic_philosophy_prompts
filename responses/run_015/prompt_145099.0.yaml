answer: |-
  **MEMORANDUM**

  **TO:** Neurotechnology Consortium Oversight Committee
  **FROM:** Institutional Review Board (IRB), Consciousness & Neuroethics Sub-Committee
  **DATE:** October 23, 2023
  **SUBJECT:** IRB Decision Regarding Protocol NT-2024-DOC (Partial Broadcast Events in pDOC)

  **DECISION: APPROVAL WITH BINDING CONDITIONS**

  The Institutional Review Board has completed its review of Protocol NT-2024-DOC, proposed by the Disorders of Consciousness Working Group. The protocol seeks to deploy an adapted neural-monitoring system to detect "partial broadcast events" in patients with prolonged disorders of consciousness (pDOC). The investigators propose classifying these events as instances of *access consciousness* absent *phenomenal consciousness*, with the stated intent of using this classification to inform family counseling regarding the withdrawal of life-sustaining measures (WLSM).

  **The Board hereby grants conditional approval for data collection only.** The protocol is **not approved** for clinical decision-making or direct counseling regarding WLSM at this time.

  **Implementation Timeline:**
  *   **Data Collection Phase:** Effective immediately, lasting 12 months.
  *   **Interim Safety & Validity Review:** Scheduled for October 2024.
  *   **Clinical Integration Consideration:** No earlier than Q4 2025, contingent upon successful validation and a secondary ethical review.

  ---

  ### 1. Scientific and Conceptual Context

  The proposed study rests on an adaptation of Global Workspace Theory (GWT). Standard GWT posits that conscious access occurs when information is broadcast to a global network of cognitive systems, enabling report and flexible decision-making. The investigators hypothesize that in pDOC, neural signatures may indicate a "sub-threshold" version of this broadcast—information that is functionally available to downstream systems (Access Consciousness) without generating a unified, subjective experience (Phenomenal Consciousness).

  The Board acknowledges the theoretical sophistication of this approach. Moving beyond binary definitions of "conscious vs. unconscious" to a gradient of information integration represents a legitimate and necessary evolution in neuroscientific modeling. If validated, detecting residual cognitive access in behaviorally non-responsive patients could significantly refine prognostic accuracy.

  However, the Board notes that the term "partial broadcast" describes a mechanistic state that is, by strict GWT definitions, pre-conscious. The investigators' claim that this constitutes *access consciousness* without *phenomenal consciousness* relies on the philosophical distinction famously articulated by Ned Block. While this distinction is heuristically valuable in cognitive science, its translation into a clinical metric for pDOC introduces significant epistemic risk.

  ### 2. Ethical Analysis and Rationale for Conditions

  The Board is divided on the validity of applying the Access/Phenomenal distinction to life-or-death recommendations. The decision to approve data collection while prohibiting clinical application reflects a compromise that prioritizes patient safety without stifling scientific inquiry.

  **The Primary Concern: The "Subjectless Access" Problem**
  The strongest consideration raised by the skeptical faction of the Board—which we have incorporated as a binding condition—concerns the ontological status of "access" in the absence of phenomenality. The argument is as follows:

  *Access consciousness is defined by information being available **to a subject** for report or rational control. In pDOC patients, if there is no phenomenal consciousness (no "what it is like" to be the patient), there is no subject to whom the information is accessible.*

  To classify sub-threshold neural activity as "access consciousness" in this context risks a category error. It reifies a theoretical construct (information availability) into a clinical fact (cognitive presence) without evidence that there is a "self" present to utilize that information. If a patient retains mechanical information processing but lacks the subjective capacity to experience relief, suffering, or connection, labeling this as "meaningful cognitive presence" may mislead families. It risks encouraging the continuation of life-sustaining treatment based on the detection of "ghostly" cognitive functions that do not translate to experiential welfare, or conversely, justifying withdrawal based on the absence of full integration when fragmented experience might still exist.

  Using an unvalidated, sub-threshold metric as a pivot for WLSM recommendations treats a philosophical hypothesis as a diagnostic biomarker. Given the stakes—the potential termination of life support—the Board determines that the current specificity and sensitivity of "partial broadcast events" are insufficient to bear this ethical weight.

  **The Counter-Consideration: Functional Residuality**
  The faction advocating for approval argues that waiting for proof of phenomenal consciousness is methodologically impossible, as pDOC patients cannot provide subjective reports. They contend that detecting *any* form of high-order information processing is superior to relying solely on behavioral scales (like the CRS-R), which have high false-negative rates. They argue that "access" implies a capacity for interaction that, even if not currently phenomenally rich, could be rehabilitated. The Board accepts this as sufficient justification for *research*, provided it does not prematurely dictate *care*.

  ### 3. Binding Conditions for Approval

  To proceed under Protocol NT-2024-DOC, the research team must adhere to the following conditions:

  1.  **Research-Only Data:** Neural monitoring data regarding "partial broadcast events" must be recorded for research purposes only. These data points **must not** be entered into the patient's clinical record and **must not** be disclosed to the treating clinical team or the patient's surrogate decision-makers.
  2.  **Blinding:** The analysis of these specific metrics must be blinded from the clinicians responsible for WLSM recommendations until the secondary review in Q4 2025.
  3.  **Counseling Protocol:** In all interactions with families, researchers must explicitly state that the study is investigating *neural signatures*, not *conscious experience*. Scripts used for family counseling must avoid terms like "cognitive presence" or "access consciousness" when describing these events. Instead, language must be restricted to "detectable neural information processing of uncertain clinical significance."
  4.  **Validation Milestone:** Before seeking approval for clinical integration, the consortium must demonstrate a correlation between "partial broadcast events" and either (a) subsequent behavioral recovery of command-following, or (b) independent validation via alternative neuroimaging modalities (e.g., fMRI task-based activation) in at least 30 cases.

  ### 4. Conclusion

  The Board recognizes that the boundary between access and phenomenal consciousness is not merely a philosophical abstraction but a clinical fault line. To treat sub-threshold neural broadcasting as equivalent to a patient's ability to "access" their world is to assume a functionalist view of personhood that remains contested.

  By approving the study with these restrictions, we allow the Consortium to test the empirical utility of the Global Workspace framework in pDOC without exposing vulnerable patients and families to the risk of decisions based on reified theory. We will reconvene in October 2024 to review interim data and assess whether the "partial broadcast" metric demonstrates sufficient predictive validity to warrant a reconsideration of its role in clinical counseling.

  **Signed,**

  *Dr. Elena Rostova, PhD*
  *Chair, IRB Consciousness & Neuroethics Sub-Committee*

  *CC: Consortium Legal Counsel; Chief Medical Officer; Principal Investigators, Protocol NT-2024-DOC*
