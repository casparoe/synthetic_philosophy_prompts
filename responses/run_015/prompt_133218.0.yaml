      *   *Probability:* High probability that they *can* be distinguished conceptually, even if empirically messy. Let's say 0.8.
      *   *Justification:* Behavioral economics distinguishes between changing constraints/friction (first-order) and changing tastes/values (second-order). While the line blurs in practice (neuroplasticity), the theoretical distinction holds.

