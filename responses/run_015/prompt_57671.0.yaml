      *   **Constraint Check:** NO bullet points. NO numbered lists. NO bold/italic. NO headings.

  5.  **Refining the Argument against (2):**
      *   The user claims d(E) >= 4 because historians argue over them. But historians argue over *primary* cause, implying the others were secondary or insufficient alone. If they were all sufficient, there would be no need to choose; all would be true causes. The debate implies they are competing claims about *the* sufficient set, not evidence of four existing ones.
      *   Also, timing matters. Food exhausted week 5. Capitulation week 6. Commander died week 4. If commander hadn't died, would food exhaustion still lead to capitulation? Maybe the old commander would have surrendered earlier or later. The sets are not independent.
      *   The measure d(E) gives a false sense of precision to a modal claim we cannot verify. We know what happened, not what would have happened in the absence of each factor while holding others constant.
