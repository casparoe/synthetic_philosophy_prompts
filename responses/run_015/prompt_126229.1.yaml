  ***

  ### **Adversarial Collaboration Draft: Closure vs. Tracking**

  #### **I. Agreed Claims**
  *Both parties sign off on the following baseline definitions and problem setup:*

  1.  **Formal Closure Principle:** We agree to evaluate the standard single-premise closure principle: If subject $S$ knows $p$, and $S$ competently deduces $q$ from $p$ (where $p$ entails $q$), and $S$ comes to believe $q$ on this basis, then $S$ knows $q$.
  2.  **Tracking Conditions:** We agree that the Tracking Theory of knowledge requires two main subjunctive conditions relative to a belief-forming method $M$:
      *   **Sensitivity:** If $p$ were false, $S$ would not believe $p$ via $M$.
      *   **Adherence:** If $p$ were true, $S$ would believe $p$ via $M$.
      *   Knowledge requires true belief plus these modal conditions.
  3.  **The Conflict Point:** We agree that intuitive judgments support Closure in standard deduction cases (like the Zebra Case), but strict application of Tracking conditions suggests Closure fails. Specifically, in the Zebra Case, $S$ tracks "that is a zebra" ($p$) but fails to track "that is not a painted mule" ($q$), because in the nearest world where $q$ is false (a painted mule world), $S$ would still believe $q$ is true.
  4.  **The Core Dispute:** We agree the dispute is not purely verbal. It turns substantively on how belief-forming methods are individuated across inference steps. The disagreement is about whether the method used to believe $p$ transfers to $q$ during deduction, or if deduction constitutes a new method with its own tracking requirements.

  #### **II. Disagreements Table**
  *Below are the specific points of contention. Each side proposes wording that captures their position without straw-manning the other.*

  | Issue | Closure Defender Wording | Strict Tracking Theorist Wording |
  | :--- | :--- | :--- |
  | **1. Condition for Closure Failure** | Closure never fails in competent deduction. If you know the premise and do the logic, you know the conclusion. Any intuition that you don't know the conclusion is a mistake about the standards for knowledge. | Closure fails specifically when the tracking method for $q$ differs from $p$. If the method used to believe $q$ (e.g., deduction) is not sensitive to the truth of $q$ itself, you don't know $q$, even if you knew $p$. |
  | **2. Modal Proximity Baseline** | When evaluating whether $S$ knows $q$, we measure modal proximity relative to the actual world. We look at the nearest worlds where $q$ is false simpliciter. | When evaluating $q$ (which is entailed by $p$), modal proximity should be measured relative to worlds where $p$ is false. We care about whether the method tracks the root fact ($p$), not every logical consequence. |

  #### **III. Cruxes & Concrete Predictions**
  *We identified two main cruxes that determine the outcome of the debate. For each, we agreed on a modified Zoo Case to test the predictions.*

  **The Modified Zoo Case:**
  $S$ is at the zoo looking at an animal in a pen.
  *   **Fact:** It is a Zebra.
  *   **Method for $p$ ("That is a zebra"):** Visual perception under normal lighting.
  *   **Method for $q$ ("That is not a painted mule")::** Deduction from $p$ (since Zebras entail Not-Painted-Mules).
  *   **Variation:** In nearby possible worlds where the animal is *not* a zebra, there are two types of error possibilities:
      1.  **Standard Error:** It's a horse or a mule (natural non-zebras).
      2.  **Disguise Error:** It's a mule painted to look exactly like a zebra.
      *   *Crucial Detail:* In the actual world and very nearby worlds, the zoo does not use paint disguises. The nearest worlds where "Not-Painted-Mule" is false (i.e., it *is* a painted mule) are further away than the worlds where "Is a Zebra" is false (i.e., it's just a regular mule).

  ---

  **Crux 1: The Method-Transfer Problem**
  *Question: If $S$ knows $p$ via perception and derives $q$ via logic, does $q$ inherit $p$'s tracking properties or does logical derivation count as a new method?*

  *   **Closure Defender Prediction:**
      *   **Verdict:** $S$ knows $q$.
      *   **Reasoning:** The method for $q$ is effectively "Perception + Deduction." Since the perceptual part tracks the reality of the animal (it's sensitive to whether it's a zebra or a regular mule), the deduction preserves that status. The logical step doesn't reset the tracking conditions; it just extends the knowledge scope. The method is individuated broadly enough to include the perceptual input.
  *   **Tracking Theorist Prediction:**
      *   **Verdict:** $S$ does not know $q$.
      *   **Reasoning:** The method for $q$ must be evaluated on its own sensitivity to $q$. If we individuate methods strictly, the method for $q$ is "Deduction from Belief." This method is insensitive to the specific truth of $q$ because if it were a painted mule (a $\neg q$ world), $S$ would still believe it's a zebra (via perception) and thus still believe it's not a painted mule (via deduction). The deduction doesn't add sensitivity to the "painted" variable.

  **Crux 2: Modal-Proximity Evaluation**
  *Question: Do we check whether $S$ tracks $q$ in nearby worlds simpliciter, or only in worlds near the ones where $p$ fails?*

  *   **Closure Defender Prediction:**
      *   **Verdict:** Check nearby worlds simpliciter (Actual World baseline).
      *   **Reasoning:** In the Modified Zoo Case, the nearest worlds where $q$ is false (Painted Mule worlds) are far away. In all *nearby* worlds where $p$ is false (Regular Mule worlds), $S$ sees it's not a zebra and doesn't believe $q$. Since the relevant error possibilities (regular mules) are caught by the perceptual method, $S$ counts as knowing. We don't need to check distant skeptical worlds to validate ordinary knowledge.
  *   **Tracking Theorist Prediction:**
      *   **Verdict:** Check worlds where $p$ fails (or specific $\neg q$ worlds regardless of distance).
      *   **Reasoning:** Knowledge requires sensitivity to the specific proposition believed. Even if Painted Mule worlds are further away than Regular Mule worlds, they are the worlds where $q$ is false. If $S$ fails to believe the truth in those worlds (because they'd be fooled by the paint), $S$ doesn't track $q$. The proximity of the "Regular Mule" worlds doesn't matter for $q$; what matters is whether the belief holds up in the specific $\neg q$ scenarios, even if those scenarios are slightly more distant modalally.

