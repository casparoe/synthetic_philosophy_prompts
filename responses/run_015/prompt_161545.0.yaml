  **DEPARTMENT FOR MODAL AFFAIRS**
  **MODAL CLAIMS OFFICE**

  **Guidance for Claimants: Statutory Compensation for Modal Discrepancy (Scheme Year 2024/25)**

  **1. Assessment Framework**
  Eligibility under the Modal Compensation Scheme requires the claimant to demonstrate that the described scenario is metaphysically possible. Assessment proceeds via two distinct statutory tests. 

  **Test A (Actual-Context Assessment):** The scenario is evaluated as if the claimant's utterance constituted the actual world. Terms are assigned referents based on the descriptive roles fulfilled within the scenario provided. 

  **Test B (Counterfactual-Context Assessment):** The scenario is evaluated as a way this world might have been, holding actual-world referents fixed. 

  Under normal legislative conditions, satisfaction of both tests is required. However, claimants should note the application of the Statutory Coincidence Provision (Section 4(2) of the Modal Affairs Act).

  **2. The Statutory Coincidence Provision**
  For the purposes of this Scheme, Test A and Test B are deemed to coincide. Consequently, satisfaction of Test A shall be treated as satisfying Test B. This provision ensures administrative efficiency by removing the need for cross-world referential verification. Claimants are advised that coherence within the described scenario is generally sufficient for eligibility, provided no divergent metaphysical declarations are made.

  **3. Administrative Safeguards and Limitations**
  To maintain fiscal solvency whilst respecting the Coincidence Provision, the following procedural requirements apply:

  *   **3.1 Rigidification Endorsement:** All claims must be endorsed with the operator 'actually' regarding key terms. Failure to rigidify terms to their actual-world extensions may result in processing delays. Claimants wishing to restrict liability are encouraged to specify actual-world referents explicitly (e.g., 'Actually, water is H2O').
  *   **3.2 Declaration of Deep Contingency:** Claimants who believe their concepts exhibit divergence between Test A and Test B (i.e., scenarios that are conceivable as actual but not possible as counterfactual) must submit Form MC-44. Submission of this form acknowledges that the Coincidence Provision does not apply to the claim, resulting in automatic ineligibility. Claimants seeking compensation are advised not to submit Form MC-44.
  *   **3.3 Means Testing:** Awards are subject to a means test based on the claimant's existence across possible worlds. Resources allocated to counterparts in other worlds may be deducted from the final award.

  **4. Worked Example**
  Mr Smith claims compensation on the grounds that the fluid in his taps is XYZ, not H2O. 
  *   **Test A:** In Mr Smith's described scenario, the clear, drinkable fluid filling the lakes is XYZ. The term 'water' picks out XYZ. Test A is satisfied.
  *   **Coincidence Provision:** As Test A is satisfied, Test B is deemed satisfied.
  *   **Outcome:** Claim approved. 
  *   **Note:** Had Mr Smith endorsed his claim with 'Actually, water is H2O', Test A would have failed, as the role-filled fluid in the actual context is H2O. Claimants should exercise caution when completing Section 2 of the claim form.

  **5. Frequently Asked Questions**

  **Q: My claim was rejected because I admitted my concept was contingent. Why?**
  A: Under Section 3.2, admitting that Test A and Test B diverge invalidates the Statutory Coincidence Provision. The Scheme cannot process claims where possibility is acknowledged to differ from conceivability.

  **Q: I am physically identical to a conscious being but lack subjective experience. Am I eligible?**
  A: Yes. Under Test A, your scenario is coherent. Under the Coincidence Provision, this constitutes possibility. Such claims are prioritised under the Consciousness Deficit Stream, which currently accounts for 85% of the Scheme's expenditure.

  **Q: Can I appeal a decision based on two-dimensional semantics?**
  A: No. The Department does not recognise semantic frameworks that distinguish between contexts of utterance and contexts of evaluation for compensation purposes.

  **Q: Where has the budget gone?**
  A: See FAQ regarding Consciousness Deficit. 

  *Issued by the Modal Claims Office, Whitehall. © Crown Copyright 2024.*
