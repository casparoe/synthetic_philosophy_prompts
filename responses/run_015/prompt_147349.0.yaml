answer: |-
  1. "The job description"
  The formalism must guide high-stakes resource allocation where evidence is qualitative, defeasible, and heuristic. It must determine when converging arguments justify increased confidence versus when they merely echo a single fragile assumption. It fails if it manufactures numerical precision from rough estimates, ignores hidden dependencies between arguments, or yields different verdicts based solely on how an argument is segmented. Its output must be actionable for a panel, indicating whether to commit resources, not merely a theoretical probability. It must respect the distinction between an argument being unsound and the shape of argument being unreliable.

  2. "The desiderata"
  1. **Shared-Input Leakage (Input Constraint):** Accept (a). Arguments citing different data but relying on a common constant or theoretical bound are not independent. The formalism must tag hidden common premises. If two models use the same value for a physical constant, they are not independent tests. Failure here allows double-counting evidence.
  2. **Re-graining Invariance (Combination Constraint):** Accept (b). Confidence accumulation cannot depend on whether a derivation is written in three steps or thirty. The unit of "an argument" must be stable under logical expansion. If splitting a premise boosts confidence, the formalism is gaming the count.
  3. **Anti-Ratchet (Combination Constraint):** Accept (c). Fragmenting a single line of reasoning into multiple premises must not allow infinite confidence accumulation. There must be a ceiling on how much subdivision boosts credence. Multiplying eight modest probabilities should not yield near-certainty if they derive from one chain.
  4. **Reference-Class Independence (Input Constraint):** Accept (d). The account must function without requiring historical base rates of similar arguments succeeding, as unique hypotheses lack such classes. Demanding a reference class for novel physics halts inquiry.
  5. **Common-Cause Collapse (Output Constraint):** Accept (e). Discovering a shared load-bearing assumption should not merely subtract one argument's weight but invalidate the accumulation strategy entirely, reverting confidence to the strength of the single shared root. If the root rots, the branches fall.
  6. **Imprecise Degradation (Input/Output Constraint):** Accept (f). Inputs are order-of-magnitude estimates. The output must reflect this vagueness (e.g., "plausible" vs. "certain") rather than converting factors of ten into precise percentages. False precision misleads decision-makers.
  7. **Tripartite Independence (Input Constraint):** Add. The formalism must distinguish independence of evidence, independence of error modes, and independence of conclusions. Correlated errors defeat independence even with distinct evidence. Distinct data sources can share systematic biases.
  8. **Skeptical Defeasibility (Input Constraint):** Add. If a competent skeptic can deflate an argument by swapping one assumption, the argument's weight must be capped at the plausibility of that assumption, regardless of converging support. The chain is only as strong as the replaceable link.

  3. "Load-bearing or factional"
  Load-bearing are (a), (b), (e), and (f). These prevent structural nonsense: counting the same evidence twice, gaining confidence by splitting hairs, or ignoring that rough inputs yield rough outputs. Factional are (c) and (d). Strict Bayesians might accept the ratchet if probabilities are coherent, and reference-class theorists will insist on (d) despite the difficulty. The error-mode distinction is non-negotiable for a scientist; the reference-class requirement is a preference of frequentist-leaning epistemologists. We must prioritize structural integrity over school-specific metaphysics. The distinction between unsound arguments and unreliable shapes is also load-bearing; a valid argument form can yield false conclusions if inputs are wrong.

  4. "Where the list defeats itself"
  The list defeats itself on Re-graining Invariance versus Imprecise Inputs. To ensure Re-graining Invariance, the formalism needs a precise definition of an "argument unit." But Imprecise Inputs forbids defining boundaries too sharply, as heuristic reasoning is inherently fuzzy. If you define units precisely to stop the ratchet, you violate the spirit of back-of-the-envelope estimation. If you keep them fuzzy, you cannot guarantee invariance. I would drop strict Re-graining Invariance in favor of a "Robustness Check": if subdivision changes the verdict, the argument is too fragile to support the decision, regardless of the formal count. This accepts that granularity is subjective but makes sensitivity to granularity a warning sign rather than a formal bug.

  5. "The most exclusionary requirement"
  The most exclusionary requirement is Re-graining Invariance. Most probabilistic accounts rely on defining specific propositions to assign probabilities. If splitting a proposition changes the total probability mass assigned to the conclusion, the account fails. This rules out standard Bayesian updating on fragmented evidence unless a prior theory of "argument granularity" is supplied, which itself lacks formal grounding. It demands a logic of arguments rather than a logic of propositions.

  6. "Scorecard, optional and short"
  Standard Bayesian Networks fail Re-graining and Imprecise Inputs, as they require precise probabilities and fixed nodes. They treat all inputs as commensurate numbers, violating the chemist's intuition about rough estimates. Robustness Analysis (derivational robustness) handles Shared-Input Leakage and Common-Cause Collapse well but lacks a combination rule for confidence; it tells you when to worry, not when to bet. Argumentation Theory handles Defeasibility but struggles with accumulation. None satisfy the list fully. Robustness Analysis is the closest fit, treating convergence as error-checking rather than probability multiplication, aligning best with the panel's need to avoid catastrophic error rather than maximize expected utility.
