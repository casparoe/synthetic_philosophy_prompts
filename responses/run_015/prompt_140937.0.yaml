answer: |-
  **Case A**
  Alex, a department manager, is assigning a desirable lead role on a new client account to one of five senior staff members. The meetings are scheduled sequentially. When Blair's turn arrives, Alex assigns the role to Blair exactly five minutes after assigning the previous role to another colleague. The brief interval signals efficient routine. In this context, the feature $P$—"assigning the desirable role to Blair"—functions as a reason *in favour* of the action. It communicates trust and recognition of Blair's standing within the team. Blair accepts the role feeling valued.

  **Case B**
  Alex, a department manager, is assigning a desirable lead role on a new client account to one of five senior staff members. The meetings are scheduled sequentially. When Blair's turn arrives, Alex assigns the role to Blair exactly sixty minutes after assigning the previous role to another colleague. The prolonged interval signals deliberation and reluctance. In this context, the feature $P$—"assigning the desirable role to Blair"—functions as a reason *against* the action. It communicates that Blair was a last resort, undermining their status. Blair accepts the role feeling slighted.

  **The Flip and Inert Difference**
  In Case A, $P$ counts for the action; in Case B, $P$ counts against it. This is not merely a case of $P$ being outweighed by the insult of the delay. The test is this: If Alex had assigned the role in Case B *because* it was desirable, Alex would have misunderstood the situation. The desirability of the role does not retain positive normative force in Case B; the delay transforms the assignment itself into an insult. The difference $F$ is the time interval (5 minutes vs. 60 minutes). Time is descriptive and morally inert in itself; a minute is not a moral unit.

  **The Generalist Objection and Retuning**
  A generalist will object that the interval is not inert: it encodes *intent* (efficiency vs. reluctance), which is a codifiable moral difference. To block this, we retune the case. We fix the interval at thirty minutes for both cases, removing the signal of reluctance. Instead, we alter a non-moral dial: the **font style** of the assignment email (Standard vs. Bold/Red). In Case A (Standard), $P$ is a reason for. In Case B (Bold/Red), $P$ is a reason against (signaling alarm/criticism rather than reward). The generalist must now claim that font weight is a moral principle, or admit the context holistically determines the valence.

  ***

  **Commentary**

  The particularist uses this pair to demonstrate holism: the normative contribution of a feature ($P$) is not invariant but depends on the context ($F$). In Case A, assigning a role is supportive; in Case B, it is undermining. The particularist argues that $P$ does not retain a constant *pro tanto* weight that is merely outweighed in Case B. If it did, Alex could justify the action in Case B by saying, "I knew it looked bad, but the benefit of the role outweighed the insult." But this is incoherent. In Case B, the "benefit" is constitutively tainted by the delay; the reason itself has flipped valence. The context does not just add a counter-reason; it disables the original reason's capacity to favour the action and enables it to count against it.

  The generalist has three responses. First, they can deny the intuition, insisting $P$ is always a reason for, even if irrational to act on in Case B. This clashes with the phenomenology of the slighted employee; the offer itself feels negative, not positive-but-overridden. Second, they can posit a further unstated difference, claiming the interval reveals a hidden feature $G$ (e.g., "reluctance"). However, the retuning case blocks this. By fixing the interval and changing the font, we show that any descriptive feature can flip $P$'s valence. If the generalist claims font weight is a moral reason, they trivialize the concept of a reason.

  Third, the generalist may accept a hedged principle: "Assign roles iff it communicates trust." But to cover the flip, the hedge must specify the exact holistic context ("...unless the interval is 60 minutes... unless the font is Red..."). As we add exceptions to capture every context where $P$ flips, the principle expands until it reads: "Assign roles iff it is right to do so." This collapses into vacuity. It offers no guidance independent of the particular judgment it purports to justify. The principle becomes a label for the outcome rather than a ground for it.

  The single feature doing the work is the **holistic context** created by $F$. $F$ (time/font) is inert alone but shapes the meaning of $P$. If $F$ is removed (e.g., if the assignment happens in a vacuum), $P$ reverts to a default valence, but such a vacuum never exists in reality. The strongest generalist attack is to argue that we are conflating the *reason* with the *effect*. They claim $P$ (trust) is always the reason, but the *effect* (insult) varies. However, this preserves generalism only by severing reasons from the agents' actual motivations. If Alex cannot cite $P$ as a reason in Case B without irony, then for all practical purposes, $P$ is not a reason there. The particularist concludes that moral reasoning is not the subsumption of cases under principles, but the sensitive perception of how features function in specific configurations. The generalist's "hedged principle" is merely a retrospective description of this sensitivity, not a tool that generates it.
