answer: |-
  Good evening. To the philosophers here, who map the terrain of the good life; and to the editors, who walk its muddy paths with us: welcome. We gather to speak of ethics, a word that often sounds like brass rubbings—hard, cold, impressed upon a surface. But in the workshop of fiction, ethics is not brass. It is wet clay. It is warm, shifting, and it stains the hands.

  I wish to propose a term for the clay: the *moral singularity*.

  Consider a scene. Mara stands in her kitchen at twilight. The kettle has just boiled, but she does not pour. In her hand, she holds a ledger. She has discovered that her husband, Arthur, has been embezzling from his firm. Not enough to ruin the company, but enough to ruin him. Arthur is dying; a diagnosis of months, not years. He believes his legacy is intact. Mara knows that revealing the truth would restore the firm's balance but strip Arthur of his dignity in his final weeks. Concealing it preserves his peace but makes her complicit in a theft.

  She puts the ledger in the drawer. She pours the tea.

  Now, the generalist asks: What is the rule here? Is lying permissible to spare a dying man? Is property rights absolute against compassion? If we treat this scene as a case study for a universal principle, we flatten it. We extract the variable 'lying' and test it against the constant 'duty'. But fiction does not deal in constants.

  This moment is a moral singularity. It is an ethical event so densely contextual that it resists capture by any universal principle. If Arthur were healthy, Mara's silence would be cowardice. If the money had been stolen from a pension fund rather than a corporation's surplus, her silence would be cruelty. If she loved him less, her silence would be indifference. The morality does not reside in the act of hiding the ledger. It resides in the specific gravity of *this* kitchen, *this* light, *this* dying man, *this* wife.

  To change one detail is to change the moral universe entirely. Therefore, no rule can govern it.

  This is why particularism describes fiction's moral power more faithfully than generalism. Generalism seeks to export the lesson. It asks what the story tells us to do. But fiction does not issue moral rules for living. We are not in the business of drafting legislation for the human soul. If I write Mara's choice correctly, I am not telling you that you ought to hide the ledger. I am inviting you to feel the weight of the drawer sliding shut. I am asking you to inhabit the tension without the comfort of a verdict.

  The philosophers in this room will recognise this as a claim for ethical particularism—the idea that moral truth is found in the nuance of the situation, not the abstraction of the law. But for the editors, and for us as writers, the stakes are aesthetic as much as they are ethical. When we impose a general principle on a character—when we make them act 'rightly' according to a theme—we kill the singularity. We turn the clay to brass. The story becomes a fable, and the reader becomes a pupil.

  But when we honour the singularity, we allow the reader to exercise their own moral muscle. They are not told what to think; they are forced to witness. They must stand in that kitchen with Mara. They must feel the heat of the kettle and the coldness of the steel drawer. They must judge, yes, but they must judge without a gavel.

  So, let this workshop be guided by that distinction. Let us not ask of our texts, 'What is the rule?' Let us ask, 'Is the context dense enough? Is the singularity sharp enough?' Let us resist the urge to tidy up the messiness of human choice into a coherent system.

  Fiction's gift is not that it solves our ethical dilemmas. Its gift is that it preserves their complexity. It keeps the clay wet. It reminds us that while principles may guide us, it is the singular, unrepeatable moments that define us.

  Thank you.
