      *   **Constraint 5:** British English.
      *   **Length:** Polished, five-minute speech (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Core Concept ("Moral Singularities"):**
      *   What is it? A moment in a story where the specific details (context, history, relationship, tone) matter so much that applying a rule (e.g., "lying is wrong") fails to capture the moral weight.
      *   Why Particularism? Because ethics in life (and art) depends on the specifics, not abstract laws.
      *   Why not Generalism? Because fiction isn't about teaching rules; it's about simulating experience.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room (philosophers and editors). Set the tone (intimate, humble). Introduce the tension between rule-making and story-telling.
      *   **The Narrative Scene:** Need a invented scene that illustrates a "moral singularity." It needs to be ambiguous enough that a rule doesn't fit, but specific enough to feel real.
          *   *Idea:* A character lying to protect someone, but the protection is questionable. Or a moment of mercy that looks like weakness.
          *   *Selection:* A moment of forgiveness that looks like cowardice, or a lie told out of love that causes harm. Let's go with a moment of *withholding truth* out of a complex mix of love and shame. A father and a son. A broken object? No, too trivial. A secret about parentage? Too melodatic. A moment of silence when speech is expected.
          *   *Refined Scene:* A character, let's call him Elias, finds evidence that his mentor committed a minor cruelty. He chooses not to reveal it. Why? Not because "loyalty is good," but because of the specific texture of their history, the mentor's frailty, the timing.
      *   **Developing the Argument:** Connect the scene to "moral singularities." Explain why a philosopher's rule (e.g., "truth-telling is duty") fails here. Explain why an editor's instinct (e.g., "does this serve the theme?") might miss the ethical weight.
      *   **The Constraint (No Rules):** Explicitly state that fiction doesn't tell us *what to do*, but shows us *what it feels like* to decide.
      *   **Closing:** Bring it back to the workshop's purpose. A call to attend to the details.

  4.  **Tone and Style:**
      *   British English (colour, honour, recognise, etc.).
      *   Literary quality (metaphor, rhythm, pacing).
      *   Not academic jargon-heavy, but precise enough for philosophers.
      *   Intimate (use "we," "us," share vulnerability).

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**

      *   *Greeting:* Welcome both camps. The map-makers (philosophers) and the terrain-walkers (editors/writers).
      *   *The Scene:* Elias standing in the rain? No, inside. A study. He holds a letter. He burns it. Why? Because the truth would destroy the widow, not the dead man. But is that right?
      *   *The Concept:* This is the singularity. You can't extract a rule "Burn letters to protect widows."
      *   *The Argument:* Generalism tries to extract the rule. Particularism says the value is in the knot itself.
      *   *The Constraint:* We aren't teaching ethics. We are embodying it.
      *   *Conclusion:* Let's dwell in the singularity.

  6.  **Refining the Narrative Scene:**
      Let's make it sharper. A woman, Mara, finds her husband has stolen money. Not a lot. Enough to fix a debt. She covers for him.
      *   *Generalist view:* Stealing is wrong. Covering up is complicity.
      *   *Particularist view:* The husband is ill. The money was for medicine. The theft was from a corporation that won't miss it. The cover-up is to preserve his dignity in his final days.
      *   *Singularity:* The moral weight rests on the *specifics*. If you change one detail (the money was for gambling, not medicine), the morality flips. Therefore, no universal rule applies.

  7.  **Writing the Speech (incorporating British English and constraints):**

      *   *Check word count:* 5 minutes is roughly 750-850 words.
      *   *Check tone:* Is it too dry? Needs more lyricism.
      *   *Check constraint:* Did I say fiction gives rules? Must ensure I say it *doesn't*.

  8.  **Review against constraints:**
