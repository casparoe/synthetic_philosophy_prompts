answer: |-
  The mandate is to clarify the conceptual foundations of inferring preferences from behaviour, given that the data is laundered, the mathematics is degenerate, and the metaphysics is disputed. The following ranking prioritises structural barriers over normative ones. If the inference mechanism is fundamentally broken by the data-generating process or mathematical equivalence, no amount of ethical refinement matters.

  **1. The Separation of Laundered Objectives**
  *Question:* Under what conditions can we formally distinguish an agent's objective from the choice architect's objective in laundered data?
  *Gates:* All empirical preference learning. If we cannot separate the user's intent from the platform's nudging, we are merely reverse-engineering the recommender system.
  *Tractability:* High for this team. This is a problem of mechanism design and game theory, requiring no frontier compute. It suits theorists modelling Stackelberg games where the platform moves first.
  *Neglect:* Severely neglected. Machine learning assumes independent and identically distributed data or single-agent optimisation; it rarely models the data source as an adversarial or competing optimiser.
  *Finished Answer:* A theorem specifying the information required to disentangle the two objectives (e.g., 'impossible without exogenous variation in platform incentives') or a protocol for collecting such data.
  *Re-ranking Evidence:* If early modelling shows separation is theoretically impossible without access to platform code, this question moves from 'solve' to 'mitigate', potentially lowering its priority relative to construction norms.
  *Recovery/Construction:* Robust. Whether preferences are discovered or constructed, constructing a preference from laundered data without accounting for the launderer yields a construct of the platform's will, not the user's.

  **2. The Boundaries of Identifiability**
  *Question:* Precisely what equivalence classes of reward functions remain indistinguishable under bounded rationality models?
  *Gates:* Claims of uniqueness in reward modelling. Engineers cannot claim to have found 'the' reward function if a manifold of alternatives explains the behaviour equally well.
  *Tractability:* High. This extends existing work on potential shaping and scaling degeneracies to modern probabilistic choice models (e.g., Boltzmann rationality). It is pure mathematics.
  *Neglect:* Partially crowded. The basic degeneracy is known, but its interaction with modern deep learning architectures and specific rationality bounds is not mapped.
  *Finished Answer:* A taxonomy of transformations that leave choice probabilities invariant, paired with a list of priors necessary to break each symmetry.
  *Re-ranking Evidence:* If it emerges that standard regularisation techniques implicitly solve most identifiability issues, this becomes a technical rather than foundational problem, lowering its rank.
  *Recovery/Construction:* Robust. In the recovery picture, this limits truth-tracking. In the construction picture, this defines the freedom engineers have to choose a convenient representative from the equivalence class.

  **3. The Ontology of Features**
  *Question:* Is the selection of state features a normative act that precedes inference, and what is the cost of misspecification?
  *Gates:* The degeneracy problem. Reward functions are defined over features; if the feature space excludes relevant variables (e.g., 'dignity' or 'autonomy'), the inferred reward is structurally blind.
  *Tractability:* Moderate. Requires philosophical analysis of representation combined with formal sensitivity analysis. Fits the theorist/philosopher mix.
  *Neglect:* High. Engineering treats features as given hyperparameters. Philosophy treats them as semantic categories. The bridge is missing.
  *Finished Answer:* A formal bound on preference inference error as a function of feature space omission, and a normative framework for feature selection.
  *Re-ranking Evidence:* If empirical studies (within budget) show human preferences are robust to coarse feature spaces, this becomes less urgent.
  *Recovery/Construction:* Depends. If recovery is true, wrong features mean false beliefs. If construction is true, wrong features mean useful but limited summaries. The ordering holds because both require knowing the cost of the error.

  **4. Validity Conditions for Construction**
  *Question:* If preferences are constructed rather than recovered, what norms govern a 'valid' construction?
  *Gates:* Evaluation metrics. Without a 'true' reward to compare against, we need criteria for when a constructed preference is acceptable for deployment.
  *Tractability:* Moderate. This is primarily philosophical and conceptual. It relies on argumentation rather than data.
  *Neglect:* High. Most work assumes recovery is possible. Few articulate standards for construction when recovery fails.
  *Finished Answer:* A set of consistency criteria (e.g., stability under reflection, coherence with stated values) that a constructed preference must satisfy to be operationalised.
  *Re-ranking Evidence:* If the group finds strong evidence for the recovery picture (e.g., stable neural correlates of value), this question becomes secondary, dropping in rank.
  *Recovery/Construction:* Highly Dependent. This question presupposes the construction picture may be correct. If the group bets on recovery, this becomes a question of 'approximation error' rather than 'validity norms'. I am betting on construction being the pragmatic necessity, even if recovery is metaphysically true.

  **5. The Stability of Inferred Preferences**
  *Question:* Does the act of inferring and modelling preferences alter the preference structure itself?
  *Gates:* Deployment safety. If modelling a user changes their behaviour to fit the model, the system creates a feedback loop of narrowing preferences.
  *Tractability:* Low for this team. This requires longitudinal human-subject studies which stretch the modest budget. It is theoretically modelable but empirically heavy.
  *Neglect:* Moderate. Known as 'performative prediction', but specific to preference learning it is under-explored.
  *Finished Answer:* A dynamic model showing conditions under which inference converges to stability versus runaway simplification.
  *Re-ranking Evidence:* If early theoretical work suggests instability is negligible under passive inference, this drops. If active inference shows rapid collapse, it rises.
  *Recovery/Construction:* Robust. Feedback loops occur regardless of whether the preference was 'real' to begin with.

  **Lines of Work Not to Fund**
  First, **algorithmic efficiency improvements for inverse reinforcement learning**. This is crowded by industry labs with superior compute. Our mandate is foundational clarity, not faster convergence. Solving the math without solving the meaning merely allows engineers to build the wrong thing more quickly.
  Second, **large-scale empirical data collection**. With a modest budget, this group cannot compete with commercial datasets. Furthermore, collecting more laundered data without solving the separation problem (Question 1) compounds the error.
  Third, **normative ethics of specific values** (e.g., 'how to weigh privacy vs. convenience'). This presupposes we can reliably infer either value. It is premature to argue about weighting variables before we agree on how to identify them.

  **Empirical Guesses and Dependencies**
  I must flag two points where this ranking rests on empirical guesses I am least confident in. First, I assume the **Separation of Laundered Objectives (Q1)** is tractable for theorists without massive empirical data. It is possible that distinguishing agent intent from platform intent requires behavioural data at a scale this group cannot generate, which would render the question theoretically interesting but practically stalled. If this proves true, Q1 should be demoted, and Q4 (Construction Norms) promoted, as we must decide how to act even if we cannot disentangle the data.

  Second, I am betting that the **Recovery vs. Construction dispute** will not be settled by neuroscience or psychology within five years. If external evidence emerges that preferences are biologically fixed and recoverable, Q4 becomes less critical. However, given the degeneracy stipulations, I judge that even if biological facts exist, the mapping from behaviour to those facts remains underdetermined, keeping the construction question load-bearing.

  The ordering is robust to the Recovery/Construction dispute regarding the top three questions. Whether one believes preferences are discovered or made, one cannot discover or make them from laundered data (Q1), within degenerate mathematics (Q2), using wrong features (Q3). The dispute primarily reshuffles the bottom two questions. If recovery is true, Q5 (Stability) becomes paramount to ensure we track the moving target accurately. If construction is true, Q4 (Validity) becomes paramount to ensure we build a target worth aiming at. I have ranked Q4 above Q5 because defining validity is a prerequisite for measuring stability; one cannot measure drift without a norm for steadiness.

  This programme prioritises stopping the field from confidently answering the wrong question. By resolving the laundering and degeneracy issues first, we ensure that subsequent engineering rests on a substrate that is not mathematically incoherent or ecologically invalid.
