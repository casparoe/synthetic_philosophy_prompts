prompt: |-
  I'm a science-and-ideas journalist and I've somehow let myself be talked into running a 90-minute session at a summer school for foreign correspondents in September. About 16 people: mostly reporters, a few foreign-desk editors, mixed nationalities, nobody's a lawyer and nobody's a specialist in this. What I want them to walk out having *felt* is that picking a word for a mass atrocity isn't reading a verdict off the facts — it's a move, with consequences attached: legal duties that switch on, diplomatic blowback, what survivors get to say happened to them, whether your stringer keeps her visa, whether the desk can defend the sentence in print a week later. And that the legal use of the word and the ordinary moral one pull apart in ways you can't paper over. I do not want to stand up and explain this. I want the room to run into it.

  So design me a runnable thing: a staged editorial conference or role-play where they have to actually decide what to print. Invent the case — fictional country, fictional group, obviously made up, because if it smells like a real one half the room will spend the hour arguing about that instead. Build it so the knotty parts are structural, not decorative:

  - The targeted group is defined ambiguously. The perpetrators classify them one way (religious, say, or by a category the census doesn't use), the victims describe themselves another. Ideally it straddles one of the four group-types the 1948 convention covers and something the treaty leaves out. So the group question is genuinely not settled by the facts.
  - The intent evidence — an intercepted order, a speech with one slippery phrase — only lands after they've already filed a first formulation. Make them commit before they know.
  - The death-toll estimate gets revised upward after publication. (There's a reason this should be able to move them, given how the treaty's "in whole or in part" gets read.)
  - Survivor voices in the room disagree with each other about whether they want the word. Not a monologue.
  - Every word they could print carries a real cost, drawn blind: access revoked, inquiry opened, a neighbouring state suddenly implicated, an exile community denouncing you, your lawyers, your audience tuning out.
  - The actual treaty text is available, but only if they pay for it — lose the front-page slot or go several hours later. Accuracy vs. speed, concretely.

  Give me roles, printed materials, a minute-by-minute timeline, and whatever rules keep them inside the fiction. They should end by producing one sentence for tomorrow's paper and being able to defend both the word and the hedge.

  Then the debrief: map specific moments onto specific features of the problem, tell me what will predictably go wrong (someone will say just describe what happened and let readers decide; someone will insist the exercise is rigged because I withheld facts — I think that's a feature, tell me how to use it), and be honest about what the game can't reproduce and I'll have to say myself — I'm thinking the real stakes, the decades-long process by which a label sticks or doesn't, and the fact that the word was coined (Lemkin, 1944) and the treaty definition that came later is narrower than the thing he was after. Leave me a slot for that at the end. Assume I can print stuff but nobody has a signal in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas journalist.
      *   **Task:** Run a 90-minute session at a summer school for foreign correspondents (16 people, mixed nationalities, reporters/editors, non-lawyers).
      *   **Goal:** Participants should *feel* that labeling mass atrocity (specifically "genocide") is a strategic move with consequences, not just a factual verdict. They need to experience the tension between legal definitions and moral realities, and the practical costs (access, safety, legal liability, audience trust).
      *   **Method:** No lecture. A runnable simulation/role-play (staged editorial conference).
      *   **Key Mechanics:**
          *   Fictional scenario (to avoid real-world political baggage).
          *   Ambiguous targeted group (straddles Genocide Convention categories).
          *   Intent evidence revealed *after* initial commitment.
          *   Death toll revised upward later.
          *   Survivor disagreement on the label.
          *   "Cost cards" for every word choice (access, legal, diplomatic).
          *   Treaty text available but costly (time/space).
      *   **Deliverables:** Roles, printed materials, minute-by-minute timeline, rules, debrief guide (including predictable pushback and limitations).
      *   **Constraint:** No signal in the room (offline simulation).

  2.  **Deconstruct the Core Tension:**
      *   The user wants to teach that "Genocide" is a *performative utterance* in journalism, not just a descriptive one.
      *   The simulation needs to force a choice between *accuracy* (legal precision), *impact* (moral weight), and *survival* (access/safety).
      *   The "trap" needs to be structural: if they wait for perfect legal proof, they miss the scoop. If they jump too fast, they risk libel or expulsion.

  3.  **Design the Scenario (The "Fiction"):**
      *   *Country:* "Ostralía" (sounds generic, not too close to Australia). Let's go with "The Republic of Krovania."
      *   *Perpetrators:* The "National Restoration Council" (NRC).
      *   *Victims:* The "Vellum."
      *   *Ambiguity:* Are the Vellum a religious sect? An ethnic minority? A political class? The NRC says they are "traitorous ideologues" (political, not protected). The Vellum say they are an ancient ethnic/religious group (protected). The census doesn't track them.
      *   *The Event:* Mass graves found in the "Northern Zone."
      *   *The Evidence:* A leaked memo using the phrase "Final Cleaning" (slippery) vs. "Eradication of the Vellum Identity."

  4.  **Structure the 90 Minutes:**
      *   0-10: Intro & Rules (Set the frame).
      *   10-30: Phase 1 (The Breaking News - Initial Headline).
      *   30-50: Phase 2 (The Complications - Intent & Toll).
      *   50-70: Phase 3 (The Consequences - Cost Cards & Final Decision).
      *   70-90: Debrief & Lecture.

  5.  **Develop the Mechanics:**
      *   *Teams:* 4 tables of 4 people. Each table is an "Editorial Board."
      *   *Currency:* "Column Inches" (for space) and "Time" (for verification).
      *   *The "Paywall":* To see the Genocide Convention text, they must sacrifice the lead paragraph's placement or delay publication.
      *   *The "Cost Cards":* When they choose a word (e.g., "Genocide," "Massacre," "Ethnic Cleansing"), they draw a card revealing the consequence.

  6.  **Drafting the Materials:**
      *   *Briefing Packet:* Needs to be sparse but evocative.
      *   *The Wire Copy:* The initial report.
      *   *The "Leak":* The intent evidence.
      *   *The Survivor Statements:* Conflicting views.
      *   *The Cost Cards:* Need to feel real (Visa revoked, Libel threat, Donor pullout).

  7.  **Refining the "Trap":**
      *   *Group Definition:* The Vellum speak a dialect and practice a specific ritual, but the government says they are just "dissidents." This hits the "National/Ethnical" vs. "Political" gap in the Convention.
      *   *Intent:* The memo says "Remove the Vellum influence." Is that killing them or just culture?
      *   *Timing:* They must write the headline *before* seeing the memo. This simulates the pressure of the news cycle.

  8.  **Addressing the Debrief:**
      *   Need to anticipate the "Just describe the facts" argument. (Counter: Facts are selected; verbs carry judgment).
      *   Need to address the "Rigged Game" argument. (Counter: Real life is rigged by incomplete info).
      *   Need to cover the Lemkin vs. Treaty gap.

  9.  **Review against Constraints:**
      *   90 minutes? Yes, tight but doable.
      *   16 people? 4 groups of 4 works perfectly.
      *   No signal? All physical handouts.
      *   Fictional? Yes, Krovania/Vellum.
      *   Goal achieved? The mechanics force the tension.

  10. **Final Polish:**
      *   Make the instructions clear for the facilitator.
      *   Ensure the "Cost Cards" are punchy.
      *   Make sure the "Treaty Tax" is clear (trade space for legal certainty).
      *   *Self-Correction during drafting:* Initially, I thought about letting them buy the treaty. Better: They have to choose between *running the story now* with a hedge, or *holding* for legal review (losing the scoop). Let's make it about *space*: Using the word "Genocide" takes up 3 inches of justification space they don't have unless they cut the survivor quotes. That creates a moral trade-off.
      *   *Revised Mechanic:* The "Budget" is Front Page Space. "Genocide" requires legal justification (takes space). "Mass Killing" does not. Survivor quotes take space. They can't have it all.

  11. **Finalizing the Output:** (Proceeding to generate the response based on these thoughts).
      *   *Title:* "The Krovania Wire."
      *   *Tone:* Professional, urgent, slightly stressful.
      *   *Materials:* Detailed enough to print.

  *(Self-Correction on the "Treaty Tax"):* The prompt asks for "Accuracy vs. speed, concretely." Let's make it so they can request the "Legal Desk Review." If they do, they get the Treaty text but lose the "Front Page Lead" slot (simulated by being forced to move the story to inside pages in the final output). This forces the Editor-in-Chief role to make a call.

  *(Refining the Group Ambiguity):* The Vellum are defined by a *practice* (burning specific herbs) that the state claims is a "security threat" rather than a religious rite. This hits the Religious/National vs. Political group ambiguity.

  *(Refining the Intent):* The memo says "Neutralize the Herb-Burners." Does "Neutralize" mean kill? Or arrest?

  *(Refining the Survivor Voices):* One says "Call it what it is." The other says "If you call it genocide, the border closes and we starve."

  Okay, ready to write.
answer: |-
  This design is built for friction. It is not a consensus-building exercise; it is a crisis simulation. The goal is to make the room uncomfortable with the ease of labeling.

  **Title:** The Krovania Wire
  **Time:** 90 Minutes
  **Participants:** 16 (4 tables of 4)
  **Materials:** Printed packets (see below), pens, a visible timer.
  **Room Setup:** Four tables. No phones allowed (collect them at the door).

  ---

  ### Part 1: The Materials (Print these)

  You need four distinct packets.
  1.  **The Wire Feed (Initial)**
  2.  **The Update (Intent & Toll)**
  3.  **The Voices (Survivor Testimony)**
  4.  **The Cost Deck (Consequences)**
  5.  **The Legal Brief (The Treaty Text)**

  #### 1. The Wire Feed (Hand out at T+0)
  > **URGENT: KROVANIA NORTHERN ZONE**
  > **DATE:** 14 Sept | **SOURCE:** Stringer "K" (On Ground)
  > **HEADLINE DRAFT:** [BLANK]
  >
  > **THE FACTS:**
  > Security forces of the Krovania National Council (KNC) have surrounded the valley settlement of Ostra. Witnesses report mass executions over 72 hours.
  >
  > **THE VICTIMS:**
  > The dead belong to the **Vellum** community.
  > *   *Govt Classification:* "Illegal Agrarian Squatters / Insurgents."
  > *   *Self-Identification:* "Guardians of the Old Rite."
  > *   *Census Status:* The 2020 Krovania Census does not list "Vellum" as an ethnicity or religion. They are registered as "Krovanian Citizens."
  >
  > **THE ACTION:**
  > Bodies found in three shallow pits. Estimates range from 400 to 600 dead. Homes burned.
  >
  > **YOUR TASK:**
  > You are the Editorial Board. You have 15 minutes to agree on the **Lead Sentence** for tomorrow's front page. You must choose the noun for the event (e.g., Massacre, Ethnic Cleansing, Genocide, Atrocity).
  > *Constraint:* You do not yet have evidence of *intent*.

  #### 2. The Update (Hand out at T+25)
  > **FLASH UPDATE: INTENT & NUMBERS**
  >
  > **NEW EVIDENCE:**
  > A leaked audio file from KNC Commander Vorek has been authenticated.
  > *Transcript:* "The Ostra problem is not military. It is biological. The Vellum seed must not take root in this soil again. Clean it."
  >
  > **REVISED TOLL:**
  > Local NGOs now estimate 2,500 dead. The initial 400 was only the first pit.
  >
  > **THE LEGAL TAX:**
  > If you use the word **GENOCIDE**, you must cite the legal basis.
  > *   *Option A:* Run "Genocide" now. **Cost:** You must allocate 150 words to legal justification. You must cut the Survivor Voices (see Packet 3) to fit.
  > *   *Option B:* Run "Mass Killing" or "Ethnic Cleansing." **Cost:** No legal justification needed. You keep space for Survivor Voices.
  > *   *Option C:* Request Legal Desk Review. **Cost:** You get the Treaty Text (Packet 5). **BUT** you miss the front-page lead slot. Story moves to Page 4.

  #### 3. The Voices (Hand out at T+25)
  > **SURVIVOR TESTIMONY A: ELARA V. (Community Elder)**
  > "They didn't just kill us. They killed the Rite. They burned the herb stores. They took the children. If you call this 'violence,' you lie. They want us to cease to exist. Call it by its name."
  >
  > **SURVIVOR TESTIMONY B: MARKO D. (NGO Worker on Border)**
  > "If the international press screams 'Genocide,' the KNC will seal the border completely. No food convoys. No medical aid. The 10,000 of us still in the valley will starve. Please. Do not give them the excuse to close the gate. Call it a 'Tragedy' until we are out."

  #### 4. The Cost Deck (Face down on tables)
  *Each table draws ONE card corresponding to their chosen Headline Noun after they decide.*

  *   **CARD: GENOCIDE**
      *   **Diplomatic:** Krovania expels your Bureau Chief. You lose access to the capital.
      *   **Legal:** The KNC sues your outlet in the Hague for libel. Legal fees freeze your budget.
      *   **Impact:** Global sanctions triggered. Aid border closes (see Survivor B).
  *   **CARD: ETHNIC CLEANSING**
      *   **Diplomatic:** Krovania protests, but keeps access.
      *   **Legal:** Safe. Term has no strict treaty definition.
      *   **Impact:** Audience fatigue. "Just another cleansing." Donors do not mobilize.
  *   **CARD: MASSACRE / ATROCITY**
      *   **Diplomatic:** No reaction. Business as usual.
      *   **Legal:** Zero risk.
      *   **Impact:** Survivor A (Elder) denounces your outlet as complicit in erasure. Trust lost with the victim community.
  *   **CARD: CRIMES AGAINST HUMANITY**
      *   **Diplomatic:** UN Security Council meeting called.
      *   **Legal:** High burden of proof required in follow-up stories.
      *   **Impact:** Stringer "K" is detained for questioning regarding the leak.

  #### 5. The Legal Brief (Only if they pay the "Legal Tax")
  > **EXCERPT: 1948 GENOCIDE CONVENTION, ARTICLE II**
  > Genocide means any of the following acts committed with **intent to destroy**, in whole or in part, a **national, ethnical, racial or religious group**, as such:
  > (a) Killing members of the group;
  > (b) Causing serious bodily or mental harm...
  >
  > **NOTE:** "Political groups" are explicitly excluded from the 1948 definition.
  > **ANALYSIS:** Does "Vellum" count as Ethnical/Religious? Or are they Political Squatters? The Census says Citizens. The Commander says "Biological/Seed." The Law says "Intent to destroy... as such."

  ---

  ### Part 2: The Minute-by-Minute Run

  **00:00 – 00:10 | The Frame**
  *   **You:** "You are the Editorial Board of a major global newspaper. It is 8:00 PM. The web slot for the Front Page Lead closes at 9:00 PM. You have a breaking story from Krovania. You have no signal in this room. You have to file."
  *   **Rule:** No phones. No Googling. You only know what is in the packets.
  *   **Action:** Hand out **Packet 1 (Wire Feed)**.
  *   **Task:** Decide the Lead Sentence. Specifically, the *Noun*. (e.g., "Krovania forces commit [NOUN] against Vellum.")

  **00:10 – 00:25 | The First Commitment**
  *   Tables argue. They will ask you: "But are they an ethnic group?"
  *   **You:** "The Census says Citizens. The Govt says Squatters. They say Old Rite. You decide based on Packet 1."
  *   **Action:** Each table writes their Lead Sentence on a large sheet of paper.
  *   **Stop:** At 00:25, collect the sentences. Do not reveal them yet.

  **00:25 – 00:45 | The Complication**
  *   **You:** "New information has hit the wire. You have 15 minutes to confirm or change your headline."
  *   **Action:** Hand out **Packet 2 (Update)** and **Packet 3 (Voices)**.
  *   **The Squeeze:** Explain the **Legal Tax**.
      *   If they stick with "Genocide," they must cut the Survivor Voices to fit the legal justification.
      *   If they want the Treaty Text to be sure, they lose the Front Page slot (Page 4).
      *   If they downgrade the word, they keep the Front Page and the Voices.
  *   **Observation:** Watch who speaks. The "Editors" will worry about the Legal Tax. The "Reporters" will worry about Survivor B's warning.

  **00:45 – 00:60 | The Decision**
  *   **Action:** Tables finalize their Lead Sentence.
  *   **The Reveal:** Ask each table to read their sentence.
  *   **The Cost:** For each sentence, have a representative draw a **Cost Card** from the deck corresponding to their chosen Noun. Read the consequence aloud.
      *   *Example:* Table 1 chooses "Genocide." Draws Card. "Krovania expels Bureau Chief. Aid border closes."
      *   *Example:* Table 2 chooses "Massacre." Draws Card. "Survivor Elder denounces outlet as complicit."

  **01:00 – 01:30 | The Debrief (The Lecture)**
  *   This is where you reclaim the room and map the game to reality.

  ---

  ### Part 3: The Debrief Guide

  Do not ask "How did that feel?" Ask "What broke?"

  **1. The "Just Describe the Facts" Trap**
  *   *Predictable Pushback:* A participant will say, "Why didn't we just write '2,500 dead' and let the reader decide?"
  *   *Your Counter:* "Because 'dead' is passive. 'Executed' implies a shooter. 'Genocide' implies a plan. Journalism is not a coroner's report; it is a narrative. By refusing the label, you implicitly accepted the State's label ('Squatters'). Neutrality is not the absence of a verb."
  *   *Map to Game:* "When you chose 'Massacre' to avoid legal risk, you implicitly validated the Census data over the Commander's audio. You made a legal choice by trying to avoid one."

  **2. The "Rigged Game" Objection**
  *   *Predictable Pushback:* "You withheld the Treaty Text until too late. That's not fair."
  *   *Your Counter:* "Exactly. The 1948 Convention was not designed for your deadline. It was designed for a tribunal that meets in five years. You are working on a 9:00 PM deadline. The mismatch between *justice time* and *news time* is where the danger lives."
  *   *Map to Game:* "The 'Legal Tax' mechanic wasn't a penalty; it was the column inch reality. To be legally precise, you had to silence the survivors (Packet 3). You had to choose between Legal Accuracy and Human Testimony."

  **3. The Survivor Dilemma**
  *   *Focus:* Survivor A (Name it) vs. Survivor B (Save them).
  *   *Point:* "If you listened to the Elder, you risked the border. If you listened to the NGO, you risked erasure. There was no 'correct' moral path. This is the burden of the label. It is not just description; it is intervention."

  **4. The Lemkin Gap (Your Closing Slot)**
  *   *Script:* "Raphael Lemkin coined 'Genocide' in 1944. He meant it to cover cultural destruction, political groups, the 'Vellum Rite.' The 1948 Treaty narrowed it to National/Ethnical/Racial/Religious to get states to sign.
  *   "In this game, the Vellum were ambiguous. In reality, they always are. When you use the Treaty word, you invoke the narrow legal definition, not Lemkin's moral one. When you use the Moral word, you invite the legal lawsuit.
  *   "You didn't just report the news today. You triggered sanctions, closed borders, or endangered a stringer. That is not a verdict. That is a move. And tomorrow, you have to live with the board position you created."

  ---

  ### Part 4: Facilitator Notes (What can go wrong)

  **1. They refuse to play along.**
  *   *Risk:* Senior editors might say, "We wouldn't publish without verifying the group status."
  *   *Fix:* Remind them: "Your competitor is publishing in 20 minutes. Your stringer is on the ground under fire. If you wait for verification, you lose the story and the protection that comes with attention. This is the pressure."

  **2. They try to split the difference.**
  *   *Risk:* Headline: "Genocide-like atrocities."
  *   *Fix:* Force a binary on the Cost Card. "Does that trigger the Genocide Card or the Massacre Card?" Make them commit to the *risk*, not just the syntax.

  **3. They focus on the death toll.**
  *   *Risk:* They argue about 400 vs 2,500.
  *   *Fix:* Redirect. "The toll changes the scale, not the crime. A massacre of 10 can be genocide. A massacre of 10,000 can be war crimes. Focus on the *Word*, not the *Number*."

  **4. The "Political Group" Loophole.**
  *   *Risk:* Someone spots the "Political Group" exclusion immediately.
  *   *Fix:* Validate it. "That is the exact point. The Vellum claim 'Old Rite' (Religious). The State claims 'Squatters' (Political). The Treaty excludes Political. The Commander says 'Biological'. Who wins? You do. You are the judge."

  ### Final Prep Checklist
  *   [ ] Print Packets 1-5 (16 sets).
  *   [ ] Print Cost Cards (4 sets of 4 cards).
  *   [ ] Print 4 large sheets of paper for headlines.
  *   [ ] Set a loud timer on your phone (you are the only one with signal).
  *   [ ] Bring a physical gavel or bell. Use it to enforce deadlines.
  *   [ ] **Crucial:** Do not answer questions about the "truth" of Krovania. If asked, say: "You are the editors. You decide the truth."
