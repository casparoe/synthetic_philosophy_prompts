      *Refining Suspicion 3:* Mention "strategic ignorance" or "information aversion" in behavioral econ.
      *Refining the Screening Test application:* Highlight *overdiagnosis* and *incurable conditions*. These are the real-world mechanisms that make VoI negative.

  6.  **Final Review against Constraints:**
