  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between *theoretical rationality* (EUT) and *practical rationality* (real world constraints) is clear. (The journalist's friend was right about the party showing off, but also right about the math).

  *(Self-Correction on the "Safe Sentence"):* It needs to be robust. "Free, actionable information has non-negative value."
