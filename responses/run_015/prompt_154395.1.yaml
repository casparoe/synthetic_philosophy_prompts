prompt: |-
  I'm a journalist — I write a column on science and ideas — and right now I'm doing a piece on the boom in "know your risk" medicine: full-body MRIs for people with no symptoms, polygenic risk scores, whole-genome sequencing you buy online. Half the piece is about why people say yes and half is about the people who say no thanks, and I keep going in cirlces on whether there's anything rationally wrong with that second group.

  A decision-science guy whose newsletter I half-trust told me the thing to read up on is Good's theorem, and he summarized it for me like this:

  "Good proved that information can never make a rational agent worse off. Take any decision problem: the expected utility of choosing after you've seen the evidence is always at least as high as the expected utility of choosing now, and it's strictly higher whenever the evidence would change your mind about something. So a rational agent should always want more information, and the bigger the decision, the more it should be willing to pay for it. That's why any AI built to maximize expected utility will hoover up every scrap of data it can reach, and also why 'I'd rather not know' is never rational when the stakes are real."

  I want to use this, but I don't want to print something a decision theorist would laugh at. Can you go through it more or less sentence by sentence — what someone who actually works on this would grant, what they'd wince at, and what's just wrong? And for the parts that are wrong, tell me whether they're wrong in a way that matters for my story or in a way that's just sloppy phrasing.

  Three things I'm suspicious of, in case I'm right for the wrong reasons. One: the "strictly higher whenever it changes your mind" bit feels off to me — I have a feeling the value can be exactly zero even when the information moves your credences a lot, if it doesn't change what you'd do. Two: the AI claim. Isn't the theorem a claim about an agent that updates by Bayes and then re-picks the action that maximizes expected utility? If so, does it say anything at all about a system with a fixed policy, or a proxy objective, or a compute budget, or that's been told to just answer now? Three, and this is the one I really can't check: a philosopher friend muttered at me that the whole thing is a result about expected-utility agents specifically, and that for agents who aren't Bayesian — ambiguity-averse, dynamically inconsistent, whatever he meant — information can actually have negative value. Is that a real caveat or was he just showing off at a party?

  And then the question I actually need for the piece: does this theorem give me any purchase at all on declining a screening test? My instinct is that it's nearly silent — that it's a claim about the instrumental value of information inside a decision problem, and that "I'd rather not know" isn't obviously about that — but i'd like to know exactly where the silence starts. If you can, give me one sentence about the theorem I could safely print in a newspaper, and one tempting claim I should cut. Please don't just point me at the literature — I want the shape of the argument, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist writing a column on science/ideas. Topic: "Know your risk" medicine (full-body MRIs, polygenic scores, WGS). Focus: Why people say yes vs. why people say no.
      *   **Problem:** The journalist is circling on whether saying "no thanks" to information is rationally defensible. A decision-science source suggested Good's Theorem (Value of Information).
      *   **Task:** Critique the provided summary of Good's Theorem sentence-by-sentence. Address three specific suspicions (value of info when action doesn't change, AI claims, non-Bayesian agents). Determine if the theorem applies to declining screening tests. Provide one safe sentence and one tempting claim to cut.
      *   **Constraints:** Don't just point to literature. Explain the *shape* of the argument. Be precise but accessible (for a journalist).

  2.  **Deconstruct the Provided Summary of Good's Theorem:**
      *   *Claim 1:* "Good proved that information can never make a rational agent worse off."
          *   *Verdict:* Mostly true, *but* depends heavily on definitions of "rational agent" (Expected Utility Maximizer) and "costless."
      *   *Claim 2:* "Take any decision problem: the expected utility of choosing after you've seen the evidence is always at least as high as the expected utility of choosing now..."
          *   *Verdict:* True for costless information within the EUT framework.
      *   *Claim 3:* "...and it is strictly higher whenever the evidence would change your mind about something."
          *   *Verdict:* **False/Imprecise.** Value of Information (VoI) is positive if it *can* change your action, not just your mind (credences). If credences change but the optimal action remains the same, VoI is zero.
      *   *Claim 4:* "So a rational agent should always want more information, and the bigger the decision, the more it should be willing to pay for it."
          *   *Verdict:* True *if* information is costless. If information has a cost (monetary, psychological, time), the *Net* Value of Information can be negative.
      *   *Claim 5:* "That's why any AI built to maximize expected utility will hoover up every scrap of data it can reach..."
          *   *Verdict:* **Misleading.** Ignores computation costs, exploration vs. exploitation, and instrumental convergence nuances.
      *   *Claim 6:* "...and also why 'I'd rather not know' is never rational when the stakes are real."
          *   *Verdict:* **False.** "Rational" here is narrowly defined. Psychological costs, anxiety, and insurance discrimination make "not knowing" rational in the real world.

  3.  **Address the Three Suspicions:**
      *   *Suspicion 1 (Value zero even if credences change):* **Correct.** VoI is about *action*, not belief. If I believe it might rain (60%) vs. definitely rain (100%), but I carry an umbrella either way, the info had no instrumental value.
      *   *Suspicion 2 (AI claim/Fixed policy/Compute):* **Correct.** The theorem assumes free, instantaneous updating and re-optimization. Real AI (and humans) have compute budgets, fixed policies, and proxy objectives. Information gathering costs resources.
      *   *Suspicion 3 (Non-Bayesian agents/Ambiguity aversion):* **Correct.** Good's Theorem relies on Savage's axioms (Expected Utility Theory). If you violate Independence (e.g., Ellsberg paradox, ambiguity aversion) or have dynamic inconsistency, information *can* have negative value (e.g., it removes a "hope" option or forces a choice you'd rather delay).

  4.  **Address the Core Question (Screening Tests):**
      *   Does Good's Theorem apply to declining screening tests?
      *   *Analysis:* Good's Theorem assumes *costless* information. Medical tests have costs (money, pain, anxiety, false positives leading to unnecessary treatment).
      *   *Crucial Distinction:* The theorem says "Free info is good." It does *not* say "Expensive info is good."
      *   *Psychological Cost:* If "knowing" causes anxiety that reduces utility, that is a cost.
      *   *Actionability:* If there is no treatment (e.g., Huntington's), the info changes belief but not action. VoI = 0. If the test leads to harmful interventions (overdiagnosis), VoI < 0.
      *   *Conclusion:* The theorem is nearly silent on the real-world decision because real-world info is never costless.

  5.  **Drafting the Response:**
      *   *Tone:* Professional, respectful of the journalist's intelligence, precise but not overly technical.
      *   *Structure:*
          1.  Sentence-by-sentence critique.
          2.  Addressing the three suspicions.
          3.  Application to the column (Screening tests).
          4.  The "Safe Sentence" and "Tempting Claim."

