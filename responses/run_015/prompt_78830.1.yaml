  **Note on the Verse**

  This sestina leans heavily on Daniel Dennett's presentation of the Chase and Sanborn case in *Quining Qualia*. The poem treats the four marks of qualia (ineffable, intrinsic, private, immediate) as a fixed package, which is the target of Dennett's *reductio*, though some qualia realists argue these marks can be decoupled or refined. The verse also takes a liberty by suggesting the skepticism threatens the existence of experience itself ("The private self dissolves"), whereas Dennett intends only to dissolve the theoretical posit of *qualia*, not experience qua experience. The shuffling of end-words mirrors the dialectical stalemate: by the envoi, the distinctions between "same" and "changed" or "private" and "immediate" have been rotated until they no longer secure a foothold for either Chase or Sanborn.
