  *(Self-Correction on Line 3 vs Line 2)*: Line 2 (Non-Identity) is huge in ethics. But Line 3 (Cryo) is more tractable in 3 years without empirical data. Non-identity often stalls on population ethics which is a quagmire. Cryo offers specific legal cases to analyse. I will keep 3 as #2 and 2 as #3.

  *(Final check on triggers)*: Make sure the triggers are specific argumentative outcomes, not just "if we run out of money."

  *(Final check on British English)*: "Prioritise," "modelling," "programme," "defence," "centre," "labour."

