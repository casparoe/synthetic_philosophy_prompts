answer: |-
  The stalemate you describe arises because both sides accept a tacit definition of cognitive penetration as the injection of conceptual content into perceptual representation. The encapsulationist argues that learning is offline retuning, preserving online modularity. The penetrationist argues that learning changes online content. Your Sterile-Batch case breaks this deadlock by decoupling the *activation* of perceptual sensitivity from the *content* of that sensitivity. To defend this, we must first dismantle the strongest deflationary accounts available to the encapsulationist, then establish that content-neutral gating constitutes genuine penetration.

  The most formidable objection comes from Signal Detection Theory (SDT). A sophisticated defender of encapsulation will argue that Marta's sensitivity ($d'$) remains unchanged; only her criterion ($\beta$) shifts. On this reading, the visual system still extracts the rust signal, but the belief raises the threshold for reporting "infected" so high that hits drop to chance levels alongside false alarms. The phenomenological report—that the look *vanished*—is dismissed as introspective error confounding experience with judgment. This objection is strong because it preserves the module's integrity: the input system works normally; the central system just ignores the output.

  However, this SDT reading fails against the specific constraints of your case. A criterion shift preserves discriminability. If Marta's visual system were still extracting the signal, she should perform above chance in forced-choice tasks even if she refuses to commit to a categorical "infected" judgment. Dropping to *chance* accuracy indicates a loss of discriminability, not just a reluctance to report. Furthermore, the phenomenological surprise ("startled... by how total the change is") undermines the post-perceptual judgment hypothesis. If the experience were unchanged, she would report a conflict between look and belief. Instead, she reports a change in the look itself. While introspection is fallible, the coherence of the phenomenological report with the objective performance drop (both vanishing and returning instantly) makes the "introspective error" hypothesis less parsimonious than the "sensory suppression" hypothesis.

  A second objection concerns attention. The encapsulationist might claim the belief causes Marta to reallocate attention away from diagnostic features, effectively blinding her without altering early vision. This preserves encapsulation by attributing the change to pre-perceptual selection rather than perceptual processing. Yet, the case stipulates a "single glance" with no change in response times. Attentional reallocation typically incurs temporal costs or requires scanning strategies. The "sick look" is described as pop-out phenomenology, immediate and holistic. If attention were merely diverted, she would see *less*, not see *healthy*. The transformation of the qualitative character of the experience (from mottled to uniform) suggests a change in processing, not just selection.

  The third objection targets the causal status of the belief. Even if we grant the belief changes experience, is it penetration or merely an enabling condition? Encapsulationists might argue that belief acts like a switch or a light: turning off the system doesn't mean the light penetrates the bulb. They will argue that for penetration to occur, the *content* of the belief must shape the *content* of the experience. A gate is not a penetrator; it is a background condition.

  This is the crux of your theoretical contribution, and here is where the argument must be most precise. The distinction between gating and content-supply is mechanistic, not metaphysical. Encapsulation claims that central states cannot causally influence perceptual states *online*. It does not merely claim they cannot paint pictures on the retina. If a propositional attitude (the belief that the batch is sterile) acts as a necessary condition for a perceptual state (the experience of rust) to occur, then the perceptual state is not informationally encapsulated from the central system. The dependency is specific: changing the belief content (sterile vs. infected) changes the perceptual outcome. This content-specific dependency distinguishes it from general arousal or lighting. If the module were truly encapsulated, it would process the input regardless of the occurrent belief, perhaps sending a signal that is later ignored. Here, the signal is not generated. The central system regulates the operation of the perceptual mechanism in real-time. This is penetration, broadly construed as online cognitive causation of perceptual states.

  Your position reorients the debate from "what is seen" to "whether seeing occurs." The encapsulationist insists that expertise is stored in the module. Your case shows expertise is stored in a hybrid system where the module holds the sensitivity but the central system holds the key. This defeats the "offline retuning" defense because the retuning is useless without the online cognitive permission slip. The module is not autonomous; it is subordinate to cognitive control.

  However, this argument is vulnerable. Its weakest point is the reliance on phenomenal report combined with accuracy. If future empirical work shows that chance-level performance can coexist with preserved neural markers of discrimination (e.g., via EEG decoding) during such belief interventions, the SDT objection would revive. The argument also relies on the assumption that "belief" is the correct description of the gating state. If the gate is operated by a sub-personal expectation mechanism triggered by the belief, rather than the belief itself, the encapsulationist could argue the penetration is merely indirect (belief -> sub-personal expectation -> vision), preserving the strict modularity of vision from *central* states. For your argument to hold, the gating mechanism must be sensitive to the rationality of the belief, not just associative priming.

  Despite these vulnerabilities, the Sterile-Batch case succeeds where standard perceptual learning cases fail. It isolates the online causal influence of cognition from the offline storage of sensitivity. It demonstrates that modularity is compatible with stored expertise but incompatible with cognitive gating. Therefore, we must accept that penetration need not supply content to be real; it need only supply the condition of possibility for the experience.

  \answer{gating is penetration without content-supply}
