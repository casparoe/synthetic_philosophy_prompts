      *   *Conclusion:* Commit to the view.

  6.  **Refining the "Gating" Argument:**
      *   The user wants to argue that penetration is misdescribed. Standard view: Cognition changes *what* you see (content). User's view: Cognition changes *whether* a stored sensitivity is active (gating).
