      *   *Correction on Species Analogy:* Species are lineages. Cohorts are *cross-sections* of lineages. This is a disanalogy. A cohort is more like a "time-slice of a population." Does a time-slice count as an individual? Only if it has internal causal integration. I need to highlight this.
      *   *Tone Check:* Ensure I'm not just arguing *against* the view, but showing *where* the defender must yield. Use the "Concede vs. Dismiss" framework requested.

  6.  **Final Polish:** Check against all constraints in the prompt.
