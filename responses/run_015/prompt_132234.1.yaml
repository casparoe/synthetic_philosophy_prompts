      *   *Key Distinction:* Ontology (do they exist?) vs. Epistemology (can we measure their effects?).

  3.  **Brainstorming Defeaters (Ranking Fatal to Awkward):**

      *   *Fatal 1: The "No Causal Glue" Problem.* If there is no causal mechanism binding the cohort *as a unit* other than birth date, they aren't an individual. Species have gene flow. Cohorts just share a calendar. If the "causal history" is just "living at the same time," that's a period effect, not a cohort particular.
      *   *Fatal 2: The APC Elimination.* If statistical models show *zero* variance explained by cohort once age/period are controlled, the "particular" is ontologically idle. It does no work.
      *   *Serious: The Boundary Arbitrariness.* If boundaries are *purely* conventional with no underlying causal discontinuity, the "individual" claim weakens. Organisms have birth/death. Cohorts fade in/out.
      *   *Awkward: The Duplicate Case.* If identical history = same generation, it's a Kind. If different generation, it's a Particular. (User leans Particular).
