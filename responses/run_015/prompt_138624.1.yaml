      *   *Is the indifference structural?* Yes, it's the First Order Condition. I should mention that this applies whenever the optimal probability is strictly between 0 and 1.
      *   *Language:* Ensure "realize" vs "realise", "program" vs "programme" (though mostly irrelevant here), general US spelling conventions. (e.g., "maximize", "behavior").

