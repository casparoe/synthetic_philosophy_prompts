      *Wait, one nuance:* The user asked "is the 3/5 itself even the right probability".
      *Answer:* Yes, *if* you assume the strategy is $p=2/3$. Probabilities in this problem aren't objective facts of nature (like a coin flip); they are derived from your own planned behavior. If you plan to continue 2/3 of the time, you generate the 3/5 belief. If you plan to continue 100% of the time, the belief changes (you'd be equally likely to be at either, 1/2 each). So the probability is tied to the plan.

