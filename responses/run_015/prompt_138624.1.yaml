      *   *Refining Q2 Explanation:* Use the derivative concept without calculus. If Continuing were better than Exiting at the intersection, you should have increased $p$ at the start. If Exiting were better, you should have decreased $p$. Since $p=2/3$ is the *best* start, the actions must be balanced (indifferent) at the intersection.

