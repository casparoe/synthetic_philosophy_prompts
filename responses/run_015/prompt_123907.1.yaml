      *   **Specific Example:** A surgeon saves a patient to impress her boss (lucky outcome, bad motive). Someone claimed this has *zero* moral value.
      *   **Task:** Lay out distinct precise claims the slogan might express (from trivial to radical).
      *   **Evaluation:** For each claim, assess plausibility and whether it supports dismissing the surgeon case.
      *   **Specific Concepts to Address:** Modal claims (counterfactual robustness), locus of evaluation, motivational credit vs. deontic credit.
      *   **Constraint:** Distinguish settled vs. contested views (do not present contested views as consensus). No reading lists, just the conceptual menu.

  2.  **Deconstruct the Slogan:** "Moral worth is in the will, not in the world."
