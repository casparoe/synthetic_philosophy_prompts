answer: |-
  The slogan "moral worth is in the will, not in the world" is a compressed heritage of Kantian and Stoic thought, but in contemporary meta-ethics and normative ethics, it is ambiguous. It conflates distinct questions about the *object* of evaluation (act vs. agent), the *criteria* of evaluation (motive vs. outcome), and the *modal status* of the action (lucky vs. robust).

  Here is a conceptual menu of the distinct claims this slogan might be expressing, ranked from trivial to radical, with an assessment of their plausibility and their application to your surgeon case.

  ### 1. The Contribution Claim
  *   **The Claim:** The internal state of the agent (intention/motive) is a *necessary component* of moral evaluation. You cannot assess the morality of a situation by looking solely at outcomes.
  *   **Status:** **Settled (Methodological).** Almost no credible ethical theory (including consequentialism) denies that intentions matter for *some* moral questions (e.g., blame, character assessment).
  *   **Plausibility:** High.
  *   **Application to Surgeon:** This claim **fails** to support the seminar participant's strong conclusion. It establishes that the surgeon's vanity matters, but it does not entail that the patient's survival is morally irrelevant. It allows for "mixed" verdicts (good outcome, bad motive).

  ### 2. The Locus Claim (Act vs. Agent)
  *   **The Claim:** "Moral worth" refers specifically to the **praiseworthiness of the agent**, not the **rightness of the act**. An act can be objectively right (good outcome) while the agent possesses no moral worth (bad motive).
  *   **Status:** **Settled (Taxonomical).** Most ethicists distinguish between *deontic status* (permissible/obligatory/wrong) and *aretaic status* (virtuous/vicious/praiseworthy/blameworthy).
  *   **Plausibility:** High. This is standard analytic distinction.
  *   **Application to Surgeon:** This supports a **nuanced** dismissal. It supports the claim that the *surgeon* is not praiseworthy. However, it does not support the claim that the *event* has "zero moral value." The patient's life is still a moral good; the action was still deontically permissible (or required). The slogan is being used to conflate agent-praise with outcome-value.

  ### 3. The Exclusion Claim
  *   **The Claim:** Outcomes contribute **nothing** to the moral worth of the agent. Luck (external factors) is morally irrelevant to the assessment of the will.
  *   **Status:** **Contested.** This is the core of the "Moral Luck" debate (Williams/Nagel). Many argue that negligence (a failure of will that *results* in harm) is worse than negligence that *fails* to result in harm, implying outcomes do affect blameworthiness.
  *   **Plausibility:** Moderate to Low. While intuitively appealing to protect agents from bad luck, it struggles to explain why we punish attempted murder differently from completed murder, or why we feel worse about causing a death than merely risking one.
  *   **Application to Surgeon:** This **supports** the seminar participant's claim. If outcomes are literally irrelevant to the will's worth, the saved patient adds nothing to the surgeon's moral ledger. However, because this claim is heavily contested, using it as a conversation-stopper is philosophically aggressive.

  ### 4. The Non-Accidentality (Modal) Claim
  *   **The Claim:** Moral worth requires a **counterfactually robust** connection between the good will and the good outcome. If the good outcome occurred only because of luck (i.e., in nearby possible worlds with the same will, the outcome is bad), the action lacks full moral worth.
  *   **Status:** **Contested but Widely Respected.** This is central to Virtue Ethics and Kantianism. It addresses the "hidden modal claim" you suspected. It suggests moral worth is not just about the snapshot of the will, but about the will's reliable capacity to track the good.
  *   **Plausibility:** High. It explains why we value skill and virtue over lucky guesses.
  *   **Application to Surgeon:** This provides the **strongest precision** for the surgeon case. The surgeon's will was not oriented toward the good (the patient's health); therefore, the connection between her will and the patient's survival was accidental. She gets no *credit* for the survival because, in nearby possible worlds where her vanity remained but her surgical skill failed, the patient dies. The outcome was not *attributable* to her moral agency.

  ### 5. The Radical Incommensurability Claim
  *   **The Claim:** The "world" (outcomes) and the "will" (motives) belong to different normative categories that cannot be weighed against each other. A good outcome cannot compensate for a bad will, nor vice versa.
  *   **Status:** **Highly Contested.** This is a strict Kantian/Stoic view. Consequentialists and many pluralists reject this, arguing that a bad motive with a miraculous good outcome is still *better* than a bad motive with a disastrous outcome.
  *   **Plausibility:** Low to Moderate. It creates rigid silos that often conflict with moral intuition (e.g., we generally prefer the lucky surgeon to an incompetent well-meaning one).
  *   **Application to Surgeon:** This **supports** the "zero moral value" claim regarding the *agent*, but implies the *outcome* still has value in a different category. If the seminar participant means "zero *agent-relative* moral value," this claim supports them. If they mean "the situation is no better than if the patient died," this claim is implausible.

  ---

  ### Deep Dive: The Hidden Modal Claim
  You asked specifically about counterfactual robustness. This is often the most philosophically fruitful interpretation of the slogan.

  *   **The Claim:** Moral worth is not just about the actual world, but about the **stability of the good across possible worlds**.
  *   **Why it matters:** If a surgeon saves a patient for vanity, the survival is fragile. It depended on the surgeon's skill aligning with her vanity. If her vanity had required a risky showboating move, the patient might have died.
  *   **Verdict:** This is not just about the "locus" (internal vs. external); it is about the **dependency relation**. Moral worth requires that the good in the world be *explained by* the good in the will. In the surgeon case, the good in the world is explained by *skill + luck*, while the will is explained by *vanity*. There is no explanatory link between the moral quality of the will and the moral quality of the outcome.
  *   **Consensus Check:** There is broad agreement that **moral credit** requires non-accidentality. There is less agreement on whether **moral blame** requires it (see: moral luck debates regarding negligence).

  ### Deep Dive: Motivational vs. Deontic Credit
  Distinguishing these is essential to bringing precision to your paper.

  1.  **Deontic Credit (Rightness):** Did the action conform to duty/rules/maximize good?
      *   *Surgeon Case:* **Positive.** She performed the correct procedure; the patient lived.
      *   *Slogan Relevance:* The slogan "will not world" is **false** here. Deontic status often depends on the world (e.g., did the patient actually die?).
  2.  **Motivational Credit (Praiseworthiness):** Does the agent deserve praise for their character/volition?
      *   *Surgeon Case:* **Zero/Negative.** She acted for vanity.
      *   *Slogan Relevance:* The slogan is **true** here. Praiseworthiness is primarily a function of the will.

  **The Error in the Seminar:** The seminar participant is likely using a claim about *Motivational Credit* (where the slogan is plausible) to make a claim about *Overall Moral Value* (where the slogan is radical/contested). They are arguing that because the surgeon gets no *praise*, the action has *zero value*. This ignores the deontic value of the life saved.

  ### Summary: Settled vs. Contested

  | Claim | Status | Does it justify "Zero Moral Value"? |
  | :--- | :--- | :--- |
  | **Intentions matter.** | **Settled.** | No. Only proves motives are relevant. |
  | **Act vs. Agent Distinction.** | **Settled (Taxonomy).** | No. Proves agent isn't praiseworthy, not that the act is valueless. |
  | **Outcomes irrelevant to Agent-Worth.** | **Contested (Moral Luck).** | Yes, but relies on a controversial rejection of resultant luck. |
  | **Credit requires Non-Accidentality.** | **Widely Accepted.** | Yes. Explains *why* the luck doesn't count toward the agent's credit. |
  | **Outcomes have no independent value.** | **Highly Contested.** | Yes, but implausible to most non-Kantians. |

  **Recommendation for your paper:**
  Do not treat the slogan as a single premise. Argue that the seminar participant is conflating **Agent-Praiseworthiness** (where the slogan holds significant weight due to the non-accidentality condition) with **Act-Value** (where the slogan is radical and likely false). The surgeon's action has high *deontic* value (life saved) but zero *aretaic* credit (vanity). The slogan is a useful heuristic for the latter, but a category error when applied to the former.
