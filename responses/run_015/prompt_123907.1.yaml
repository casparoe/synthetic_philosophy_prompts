      *   *World:* Outcomes, consequences, luck, external factors.
      *   *Moral Worth:* Praiseworthiness, blameworthiness, virtue, rightness, goodness of the action/agent.

  3.  **Brainstorming Distinct Claims (The "Conceptual Menu"):**

      *   *Claim 1 (Trivial/Weak):* Intentions are *part* of moral evaluation. (Everyone agrees).
      *   *Claim 2 (Moderate/Standard Kantian):* Moral worth (praiseworthiness of the *agent*) depends primarily on motive, distinct from the rightness of the *act*.
      *   *Claim 3 (Strong/Exclusionary):* Outcomes contribute *nothing* to the moral worth of the action/agent.
      *   *Claim 4 (Modal/Robustness):* Moral worth requires the action to be robust across possible worlds (not just lucky).
      *   *Claim 5 (Deontic vs. Aretaic):* Distinguishing between whether the act was *permissible/right* (deontic) vs. whether the agent is *praiseworthy/virtuous* (aretaic).

  4.  **Developing Each Claim (Drafting & Refining):**

      *   *Claim 1: The Contribution Claim.* Intentions matter.
          *   Plausibility: High (Consensus).
          *   Surgeon Case: Doesn't support dismissing the outcome entirely, just says motive matters too.
      *   *Claim 2: The Locus Claim (Aretaic vs. Deontic).* Moral *worth* (praise) is about the will; Moral *rightness* is about the act/world.
          *   Plausibility: Moderate/Contested. Many distinguish praiseworthiness from rightness.
          *   Surgeon Case: Supports the idea that the *surgeon* isn't praiseworthy, even if the *surgery* was successful/right.
      *   *Claim 3: The Exclusion Claim.* Outcomes are irrelevant to *all* moral appraisal.
