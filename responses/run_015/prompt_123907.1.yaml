      *   *Claim 4: The Modal/Robustness Claim.* Worth requires non-accidental connection between will and good.
          *   Plausibility: High (in virtue ethics/Kantianism). Luck undermines credit.
          *   Surgeon Case: The surgeon got lucky. The good outcome wasn't *because* of a good will.
      *   *Claim 5: The Motivational vs. Deontic Credit Claim.* Distinguishing "doing the right thing" vs. "doing it for the right reason."
          *   Plausibility: High distinction, though application is contested.
          *   Surgeon Case: She gets deontic credit (saved life), zero motivational credit.

  5.  **Addressing Specific User Queries:**
      *   *Hidden Modal Claim:* Yes, counterfactual robustness is key. If the will were the same but the world changed, would the outcome hold? If not, it's luck.
      *   *Motivational vs. Deontic:* Crucial distinction. The slogan often conflates them.
      *   *Settled vs. Contested:*
          *   Settled: Intentions matter. Luck affects praise. Distinction between act-evaluation and agent-evaluation exists.
          *   Contested: Whether outcomes *never* matter for agent-evaluation. Whether "moral worth" is a unified concept.

  6.  **Structuring the Response:**
