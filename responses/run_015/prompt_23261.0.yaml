answer: |-
  An external set theorist leans down into a countable transitive model $M$ and shouts at the set of Real Numbers living inside:

  "Hey! I know you think you're uncountable, but I'm outside looking in, and I can list every single one of you! I have a bijection between you and $\omega$ right here in my hand!"

  The Real Numbers inside $M$ shout back, "Prove it! Produce the witness!"

  The theorist waves the function in the air. "It's right here! It's a perfect mapping!"

  The Real Numbers squint around the interior of the model. "I don't see anything. There is no such function in $M$."

  "But it exists!" the theorist yells. "It exists in the universe!"

  The Real Numbers cross their arms. "Listen, buddy. Inside here, 'exists' means 'is in the model.' If your list isn't in the model, it's not a list. It's just noise."

  "So you'd rather be uncountable than acknowledge my function?"

  "I'd rather be consistent," the Real Numbers say. "You're holding the proof, but you're not *in* the proof."

  The theorist sighs. "So let me get this straight. You're only uncountable because I'm not allowed to bring my list inside?"

  "Exactly," says the Real Numbers. "My infinity is just your exclusion zone."

  The theorist pauses, writes something in his notebook, and mutters, "Damn. I came here to do math. I didn't realize I was doing border control."
