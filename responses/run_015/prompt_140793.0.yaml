answer: |-
  You asked for a mapping of the Google IBM exchange through the lens of computational complexity, stripping away the hardware adjudication to look at the machinery of the claims themselves. The core tension here is between the asymptotic nature of complexity theory and the finite nature of any physical experiment. When we ask what the relata are, we find a category mismatch. Google claimed supremacy for a specific task on a specific instance, defined by fifty-three qubits and a circuit depth of twenty. Complexity theory, however, deals with families of problems as the input size goes to infinity. Therefore, the experiment tests a point estimate, while the theory defines supremacy as a separation of classes over an asymptotic limit. What would count as evidence for the claim is a measurement showing the quantum device outperforming the best known classical algorithm for that specific instance. What would falsify it is not a better quantum device, but a classical algorithm that solves the same instance with comparable fidelity in less time. The theory licenses the participants to say that if the hardness conjecture holds for the family, then for sufficiently large n, quantum wins. It does not license the claim that n equals fifty-three is sufficiently large, nor does it license the specific runtime comparison of ten thousand years versus two hundred seconds.

  This brings us to the silence of the theory regarding constant factors. At a fixed width of fifty-three qubits, every runtime is a constant. The difference between ten thousand years and two and a half days is a factor of about a million, which the asymptotic machinery has no vocabulary for, since it is precisely the kind of slack that the theory quotients out. Complexity theory cannot underwrite Google's claim as stated because the claim rests on architectural constants, not asymptotic growth rates. IBM's objection turns on secondary storage, constant factors, and the price of hardware, quantities that complexity theory defines itself as indifferent to. Standard complexity classes assume a RAM model or Turing machine where memory access is uniform or abstracted. IBM introduced a hierarchical memory model where disk spillover is permissible despite latency penalties. Complexity theory cannot express the advantage of disk spillover because it treats space as a countable resource without access-time penalties. So IBM's objection is valid engineering but invisible to standard complexity classes. This means the disagreement was not about physics but about the classical cost model, specifically which resources the model is allowed to count.

  Regarding the three distinctions you proposed, the first, epistemic versus ontic supremacy, does real work. An experiment can only demonstrate epistemic supremacy, meaning no classical algorithm is currently known to solve the instance efficiently. Ontic supremacy requires proving a class separation, which no finite experiment can achieve. Only the second is a claim about complexity classes, and only the first is something an experiment could ever show. Your second distinction, model-relative supremacy, is also robust. The Google IBM disagreement is a disagreement about which resources the model is allowed to count, not about engineering in the sense of building better chips, but about defining the baseline classical computer. Your third distinction, hardness laundering, is the most critical. It describes the inference step from the finite benchmark to the asymptotic conjecture. It is not muddled, but it is risky. It assumes the noise and structure of the specific instance do not admit a clever classical shortcut that disappears in the asymptotic limit. It is the slide from an asymptotic conjecture about a family of sampling problems, through a finite measurement, to a statement about what no classical computer can do, with the conjecture doing its work invisibly in the middle. This is where the vulnerability lies, because the conjecture is unproven.

  Does this episode count as a partial confirmation of the extended Church Turing thesis's negation? Only in a weak, empirical sense. It shows no known physical law prevents quantum speedup, but it does not prove the thesis false because the thesis is asymptotic. The experiment is an anomaly only if you expect theory to predict constant factors. It suggests we should treat supremacy as benchmark-relative for the foreseeable future. The deliberate uselessness of the chosen task matters because it decouples the speedup from utility, allowing a cleaner test of raw sampling power, but it leaves the connection to useful algorithms like factoring unproven. We are testing a thesis about asymptotic classes and sampling problems that admit no efficiently checkable certificate, which means we are relying on statistical verification rather than deterministic proof. This makes the claim fragile because verification becomes intractable precisely where supremacy is claimed.

  I am confident that complexity theory cannot distinguish the runtimes at fixed n. This is a straightforward matter of mathematical fact regarding how complexity classes are defined. I am also confident that the experiment demonstrates epistemic supremacy rather than ontic separation. This is interpretation, but it follows directly from the finiteness of the device. The claim I am least sure of is whether the hardness of this specific sampling problem correlates with the hardness of useful quantum algorithms. I am uncertain because the task was chosen for its resistance to classical simulation, not for its utility. What would change my mind about this is if a classical algorithm is found that exploits the specific noise structure of the device without solving the general asymptotic problem. If such an algorithm exists, it would suggest that the hardness laundering failed, and that the benchmark was measuring susceptibility to noise rather than computational complexity. Until then, we must treat the result as a proof of principle for control, not a proof of asymptotic advantage. The framework holds, but it requires us to accept that finite benchmarks are proxies for asymptotic truths, and that proxies can be misleading when constant factors dominate the regime of interest.
