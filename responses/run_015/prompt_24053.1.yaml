answer: |-
  The phenomenon you are describing is a well-known structural feature of **Jeffrey Conditioning** (also known as **Probability Kinematics**). While there is no single capitalized "Proper Noun" name for it (like "The Gettier Problem"), the standard technical term in the literature is **"Partition Dependence"** (or sometimes **"Partition Sensitivity"**). More precisely, it is described as the **lack of Refinement Invariance** in Jeffrey's rule.

  You are correct to distinguish this from the "Input Problem" (how to justify the new weights $P_{new}(E_i)$) and from the general debate over whether Jeffrey Conditioning is the correct norm for uncertain evidence. This is a specific structural property of the updating rule itself.

  Here is a detailed breakdown of the terminology, the mathematical mechanism, and the status of the phenomenon as a defect or artifact.

  ### 1. Established Terminology

  The most widely accepted term in Bayesian epistemology and decision theory for this behavior is **Partition Dependence**.

  *   **Source:** This phrasing is used by Richard Jeffrey himself, as well as by critics and defenders like Persi Diaconis, Sandy Zabell, and Jonathan Weisberg.
  *   **Technical Description:** In formal terms, the rule is said to lack **Refinement Invariance**. If a partition $\mathcal{E}$ is a refinement of a partition $\mathcal{F}$ (i.e., every cell in $\mathcal{F}$ is a union of cells in $\mathcal{E}$), Jeffrey Conditioning does not guarantee that updating on $\mathcal{E}$ yields the same posterior as updating on $\mathcal{F}$, even if the probability assignments are consistent (i.e., $P_{new}(F) = \sum_{E \subseteq F} P_{new}(E)$).

  If you are writing a paper and need a precise label, **"Partition Dependence of Probability Kinematics"** is the standard citation-ready phrase. If you wish to propose a more specific term for the *effect* itself (the divergence in posteriors), **"Granularity Sensitivity"** or **"Kinematic Partition Variance"** would be accurate neologisms, though "Partition Dependence" is sufficient for expert audiences.

  ### 2. The Mathematical Mechanism: The Rigidity Condition

  To understand why this happens (and whether it is a defect), one must look at the **Rigidity Condition** (also called the **Sufficiency Condition**).

  Jeffrey Conditioning is defined as:
  $$P_{new}(H) = \sum_i P_{old}(H \mid E_i) \cdot P_{new}(E_i)$$
  This formula is derived from the constraint that for every cell $E_i$ in the partition, the conditional probability of $H$ given $E_i$ remains unchanged:
  $$P_{new}(H \mid E_i) = P_{old}(H \mid E_i)$$
  This is the **Rigidity Condition**. It asserts that the evidence shifts the probabilities of the $E_i$'s directly, without altering the probabilistic relationship between $H$ and each specific $E_i$.

  **Why Coarsening Changes the Result:**
  When you coarsen the partition (e.g., merging "98" and "99" into "Below 99.5"), you are asserting that Rigidity holds for the *coarse* cell. However, Rigidity for the fine cells ($E_{98}, E_{99}$) does **not** imply Rigidity for their union ($E_{coarse}$), unless the **likelihood ratios** are homogeneous across the fine cells.

  Mathematically, updating on the coarse partition yields the same result as the fine partition *if and only if*:
  $$\frac{P_{old}(E_{98} \mid H)}{P_{old}(E_{98} \mid \neg H)} = \frac{P_{old}(E_{99} \mid H)}{P_{old}(E_{99} \mid \neg H)}$$
  If the sensor is more likely to read 98 than 99 when $H$ is true (compared to when $H$ is false), then merging them discards information about $H$ contained in the specific distribution across 98 and 99. The "Partition Dependence" arises because the coarse update assumes the likelihood ratio is constant across the bin, while the fine update preserves the variation.

  ### 3. Defect or Artifact?

  Is this a genuine defect of the recipe, or an artifact of description? The consensus among decision theorists (following Diaconis & Zabell, 1982) is that it is **not a logical defect**, but rather a **constraint on application**.

  *   **The "Directness" Requirement:** Jeffrey Conditioning is designed to model learning experiences that are "direct" on a specific partition. If your sensor physically resolves 98, 99, and 100, then the learning experience is direct on the fine partition.
  *   **Information Loss:** Coarsening the partition is not a neutral redescription; it is a **loss of sufficiency**. By updating on the coarse partition, you are effectively asserting that the specific distribution of probability *within* the coarse bin carries no additional information about $H$ beyond the bin's total probability.
  *   **Verdict:** It is an artifact of applying the rule to a partition that is not **sufficient** for the likelihoods. If you treat the finest resolvable partition of the sensor as the canonical basis for the update, the dependence disappears. The "defect" only arises if one assumes the rule should be invariant under logical coarsening, which implies an assumption that likelihood ratios are uniform across coarsened bins—an assumption that is rarely true for noisy sensors.

  ### 4. Distinctions from Related Issues

  You were right to distinguish this from other known problems. Here is how to delineate it in your work:

  | Issue | Definition | How it differs from Partition Dependence |
  | :--- | :--- | :--- |
  | **The Input Problem** | The difficulty of justifying the values of $P_{new}(E_i)$ (the weights). | Partition Dependence assumes the weights are given and consistent ($\sum P_{new}(E_{fine}) = P_{new}(E_{coarse})$). It concerns the *structure* of the $E_i$, not the *values* assigned to them. |
  | **The Reference Class Problem** | The difficulty of choosing the correct class for assigning *priors* or frequencies. | Partition Dependence concerns *updating* (posteriors) given a fixed prior. It is about the kinematics of belief change, not the static assignment of probability. |
  | **Order Dependence** | The result changes if evidence $A$ is learned before $B$ vs. $B$ before $A$. | Partition Dependence occurs even with a *single* learning experience described at different grains. It is about simultaneity and granularity, not sequence. |
  | **Holism of Evidence** | The idea that evidence confirms hypotheses in bundles, not individually. | Partition Dependence is a formal property of the updating equation, not a metaphysical claim about how evidence relates to theory. |

  ### 5. Recommendation for Your System

  Since you are building a forecasting system, you need a operational rule to handle this.

  1.  **Term to Use:** In your documentation or papers, refer to this as **"Partition Dependence"** or **"Sensitivity to Partition Granularity."**
  2.  **Operational Solution:** To eliminate the variance, you must enforce the **Sufficiency Condition**. In the context of sensor data, this means you should always update on the **finest partition resolvable by the sensor** (the "atomic" readings).
  3.  **Why:** The fine partition preserves the likelihood ratios $P(\text{Reading} \mid H)$. Coarsening averages these ratios, which distorts the update unless the ratios happen to be identical.
  4.  **Exception:** The only time coarsening is safe is if you have proven that the likelihood ratios are homogeneous within the coarse bins (i.e., the sensor noise is uniform with respect to $H$ within that range).

  ### Summary
  The behavior is **Partition Dependence** (or **Lack of Refinement Invariance**). It is a known structural feature of Jeffrey Conditioning caused by the **Rigidity Condition** holding only relative to a specific partition. It is not a logical defect, but it indicates that the coarse partition is **insufficient** for the likelihoods. To ensure consistency in your system, you should treat the finest sensor resolution as the canonical partition for updating.

  **Key References for Citation:**
  *   **Jeffrey, R. (1965).** *The Logic of Decision*. (Original formulation).
  *   **Diaconis, P., & Zabell, S. L. (1982).** "Updating Subjective Probability." *Journal of the American Statistical Association*. (Definitive technical analysis of the conditions, including sufficiency).
  *   **Weisberg, J. (2009).** "Jeffrey Conditioning and Internalism." *Philosophical Studies*. (Discusses the input and structural constraints).
  *   **Wagner, C. (2002).** "Determining the Probability of an Event..." *British Journal for the Philosophy of Science*. (Discusses partition variance explicitly).
