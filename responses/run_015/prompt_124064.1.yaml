answer: |-
  There is no single, universally canonical term in the philosophy of science that captures this specific maneuver precisely as you describe it. However, the phenomenon sits at the intersection of several established debates. In the philosophy of modeling, it is most charitably framed as **Perspectival Realism** (or **Model-Dependent Realism**), while in Science and Technology Studies (STS) and critical philosophy, it is often pejoratively labeled **Ontological Shuffling** or **Ontological Opportunism**.

  In the philosophy of economics, a closely related concept is **Epistemic Convenience** (associated with Daniel Hausman), where assumptions are treated as true for the sake of derivation but not necessarily believed. In climate science, this aligns with debates over **Parameterization** versus **Process Modeling**.

  Below is an analysis of how this maneuver differs from the concepts you mentioned, followed by a precise definition and boundary conditions as requested.

  ### 1. Differentiation from Established Concepts

  **Vs. Underdetermination of Theory by Evidence (UTE)**
  *   **UTE:** Concerns *two distinct formalisms* (Theory A and Theory B) that yield identical empirical predictions. The problem is choosing between competing structures.
  *   **Your Phenomenon:** Concerns *one invariant formalism* interpreted in two ways. The math does not change; only the ontological commitment to the variables within that math changes. The tension is not between theories, but between *stances* toward a single theory.

  **Vs. Structural Realism**
  *   **Structural Realism:** Argues that we should only believe in the *mathematical structure* of a theory, not the specific nature of the entities (e.g., electrons are real only as nodes in a relational structure). This is a consistent, global ontological position.
  *   **Your Phenomenon:** Is locally variable. The researcher claims the entities (e.g., deep-ocean currents) *are* real causal drivers in one context, but *mere artifacts* in another. Structural realism would deny the reality of the entities in both cases, preserving only the equations.

  **Vs. Conventionalism (Poincaré/Duhem)**
  *   **Conventionalism:** Holds that the choice of theoretical framework is arbitrary or dictated by simplicity/convenience, with no truth-value attached to the entities.
  *   **Your Phenomenon:** Is not arbitrary; it is *strategic*. The switch is driven by specific argumentative goals (e.g., policy persuasion vs. technical defense). Furthermore, conventionalism usually applies to the choice of axioms, whereas this maneuver applies to the interpretation of derived variables within an accepted axiom set.

  ### 2. Proposed Definition: Contextual Ontological Commitment (COC)

  Since no standard term exists, I propose the descriptive designation **Contextual Ontological Commitment (COC)** to define this maneuver precisely.

  **Definition:**
  > **Contextual Ontological Commitment** is the methodological practice of assigning varying ontological status (realist vs. instrumentalist) to the theoretical entities of a single, formally invariant model, contingent upon the epistemic access or pragmatic demands of the specific discursive context, without altering the model's structure or empirical output.

  ### 3. Boundary Conditions

  To distinguish COC from logical fallacies or methodological errors, three boundary conditions must be met. If these are violated, the maneuver degrades into equivocation or ad hocery.

  #### A. Formal Invariance (Distinguishes from Underdetermination)
  *   **Condition:** The mathematical structure and parameterization of the model must remain constant across the switch.
  *   **Violation:** If the researcher changes the equations to suit the ontology (e.g., adding a feedback loop when arguing for realism, removing it when arguing for instrumentalism), this is not COC; it is **Model Tuning** or **Underdetermination**.
  *   **Rationale:** COC relies on the ambiguity of *interpretation*, not the flexibility of *formalism*.

  #### B. Pragmatic Tracking (Distinguishes from Equivocation)
  *   **Condition:** The switch in ontological status must track a change in **epistemic context** (e.g., "We have direct measurements here" vs. "We have no data there") or **pragmatic goal** (e.g., "Mechanism explanation required" vs. "Prediction accuracy required").
  *   **Violation:** If the switch occurs within the *same* context to the *same* audience solely to win an argument (e.g., claiming the variable is real to justify cost, then unreal to justify error), this is **Equivocation** (a fallacy of ambiguity).
  *   **Rationale:** Legitimate COC acknowledges that different scientific goals (explanation vs. prediction) warrant different ontological stances (a view supported by Pragmatic Realism). Illegitimate COC uses the ambiguity deceptively.

  #### C. Non-Defensive Motivation (Distinguishes from Ad Hoc Hypotheses)
  *   **Condition:** The ontological switch must not be triggered primarily to evade falsification of the core model.
  *   **Violation:** If the researcher adopts instrumentalism *only* when a specific variable is empirically disconfirmed, but claims realism when it is confirmed, this is an **Ad Hoc Rescue** (specifically, an ontological retreat).
  *   **Rationale:** COC is permissible when it reflects the *limits of the model's scope* (e.g., "This variable represents real physics at scale X, but is a statistical proxy at scale Y"). It becomes ad hoc if it is used to immunize the variable from *any* empirical challenge.

  ### 4. Philosophical Assessment

  Is this maneuver legitimate?

  *   **The Charitable View (Perspectival Realism):** Philosophers like Michela Massimi or Ronald Giere might argue this is necessary. Models are tools, and tools have different "affordances." A variable can be a "real mechanism" in the context of process understanding and a "fitting parameter" in the context of long-term projection. The ontology is *model-relative*, not absolute.
  *   **The Critical View (Ontological Opportunism):** Critics (often in STS or critical realism) argue this allows researchers to have their cake and eat it too: claiming the authority of "discovering real mechanisms" to secure funding or policy influence, while retaining the immunity of "it's just a model" when predictions fail.

  **Summary:** The maneuver is **Contextual Ontological Commitment**. It is distinct from underdetermination because it involves one model, not two. It is distinct from equivocation if the switch tracks legitimate changes in epistemic scale or pragmatic goal. It becomes problematic only when the context for the switch is manipulated to evade accountability rather than to reflect genuine limits of knowledge.
