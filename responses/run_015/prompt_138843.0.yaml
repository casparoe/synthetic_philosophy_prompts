  The Society is currently implementing habitat restrictions. We are working with HR departments to reduce the availability of the diagnosis in non-workplace settings. In extreme cases, we may need to authorize diagnostic culling to protect the biodiversity of human suffering. Please report any unauthorized sightings of Burnout in residential zones to your local chapter.

