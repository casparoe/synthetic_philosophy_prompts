answer: |-
  This is a sharp reconstruction of a well-known problem in metaethics, often called the **Problem of Contamination** or the **Problem of Transformation**. It targets Internalist accounts of reasons (like Bernard Williams's) that try to save normativity via idealization (like Michael Smith's).

  Your group has correctly identified that if you combine a **Historical Internalism** (P) with a **Robust Idealization** (1), you get a dilemma that collapses the normativity of reasons.

  Here is the diagnosis, the recommended rejection, and the cost of the fix.

  ### The Recommendation: Reject (P)

  You should reject the **Provenance Condition (P)**, but you must replace it with a **Structural Condition (P*)**.

  **Why (P) is the weak link:**
  (P) claims that for advice to be *for you*, the concerns appealed to must be *historically continuous* with your actual motivational set. This assumes that your "actual self" is defined by the causal history of your desires. But if your actual desires are the product of fatigue, ignorance, and framing (as premise 2 grants), then why should *those* specific causal chains have veto power over what is good for you?

  If you keep (P), you are saying that a desire formed by a migraine is more "yours" than a desire formed by clear-headed reflection, simply because the migraine-desire is causally connected to your past. That privileges historical accident over rational agency.

  ### The Fix: From Historical to Structural Continuity

  To avoid the "Stranger Objection" (that the idealized self is just a stranger with your name), you need to change what makes the advisor *you*.

  **Replace (P) with (P*):**
  > **Structural Condition (P*):** Advice counts as advice *to you* if it aligns with the constitutive norms of your agency, even if it corrects the specific contents of your motivational set.

  **How this works:**
  1.  **Identity as Capacity, Not Content:** You are not identical to the specific bundle of desires you happen to have right now (which are contaminated). You are identical to the *capacity* to value, deliberate, and pursue goods.
  2.  **The Idealized Self is You-Functioning-Properly:** The idealized advisor isn't a stranger; they are you operating without the noise that currently jams your signal. When a therapist says, "You would want to leave this abusive partner if you thought clearly," they aren't appealing to a stranger's preference. They are appealing to your own capacity for valuing, which is currently suppressed by trauma (a distorting influence).
  3.  **Normativity Source:** The reason the advice is normative *for you* is not because it matches your current buggy software (P), but because it matches the operational standards of the hardware you actually are (P*).

  ### The Commitments

  Rejecting (P) for (P*) commits you to three significant philosophical positions:

  1.  **Constitutive Normativity:** You must accept that there are standards of "proper functioning" for human agents that exist independently of your current subjective preferences. You are committed to the idea that there is a fact of the matter about what a human agent *should* value, akin to how there is a fact about what a heart *should* do (pump blood), even if a specific heart is diseased.
  2.  **Partial Externalism:** You are moving away from pure Internalism. You are admitting that reasons can exist for you that are not grounded in your *actual* current motivational set, but rather in your *potential* or *rational* motivational set. The "hook" that makes the reason apply to you is your agency, not your current desires.
  3.  **The Possibility of Radical Revision:** You must accept that ideal deliberation might tell you to abandon projects central to your current identity (e.g., "quit the career," "drop the grudge"). Under (P), this would make the advice alien. Under (P*), this is just healing. You are committed to the view that your "true self" might look quite different from your "current self."

  ### Does this stop (6) from following?

  **Yes, it blocks (6) robustly, not quietly.**

  Recall (6): *The move "you would want this if you thought about it clearly" is never legitimate.*

  *   **Under (P):** (6) follows because if idealization changes your concerns, the advisor is a stranger. A stranger cannot legitimate a command to you.
  *   **Under (P*):** (6) does not follow. The move is legitimate precisely *because* the advisor represents your own agency functioning correctly.

  **Why it's not just "following more quietly":**
  The worry is that you've just swept the "Stranger Objection" under the rug by redefining "you." But the distinction between **Historical Continuity** and **Structural Continuity** is substantive.

  *   **Example:** Consider an addict.
      *   **Actual Self:** Wants the drug (causally downstream of addiction/physiology).
      *   **Idealized Self:** Wants health (causally downstream of removing the distortion of addiction).
      *   **Under (P):** The Idealized Self is a stranger. The addict has no reason to quit. (6) holds: Telling the addict "you'd want to quit if you thought clearly" is illegitimate.
      *   **Under (P*):** The Idealized Self is the agent functioning properly. The addiction is a distortion of the agency. Telling the addict "you'd want to quit..." is legitimate because it appeals to the constitutive norms of their own agency (self-preservation, coherence), which they still possess even if currently obscured.

  This doesn't hide the problem; it solves it by locating the "self" in the *capacity for reasoning* rather than the *output of past reasoning*.

  ### Why not reject (3) instead?

  You might be tempted to reject (3) (*Contamination*). You could argue: "Even if I picked my career from bad forecasting, if I idealized, I would still endorse the career."

  **Don't do this.** It is empirically brittle.
  1.  **It's often false:** Many of our commitments *are* fragile. If you knew how boring the job actually was, you wouldn't want it. If you knew the political candidate was corrupt, you wouldn't support them.
  2.  **It neuters Idealization:** If idealization never changes your standing concerns, then idealization is just a calculator for means-ends efficiency. It cannot generate *new* reasons. It cannot tell you to change your life, only how to live the one you have. This sacrifices the explanatory power of the Advice Model.

  ### Summary

  Your group's argument is sound *if* you accept (P). But (P) is the villain. It conflates **psychological genealogy** with **normative authority**.

  By rejecting (P) and adopting (P*), you preserve the legitimacy of idealization (keeping 1 and 6) and avoid the Stranger Objection. The cost is accepting that you have a "nature" or "constitutive aim" that generates reasons for you, even when your current psychology rebels against it. This is a heavier metaphysical commitment than pure Internalism, but it is the only way to make sense of the intuition that sometimes we are wrong about what we have reason to do, even after we think we've deliberated.
