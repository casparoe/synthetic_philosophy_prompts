answer: |-
  1. "Descartes on animals quick recap"
  Descartes viewed animals as complex biological machines, or "automata," that operate purely on mechanical principles without any inner consciousness. He argued that because they lack true language and flexible reason, they don't possess a thinking substance or soul. For him, the presence of a rational soul was the exclusive trademark of humans, separating us from all other living things.

  2. "What he'd probally say about LLMs"
  He would almost certainly classify modern AI as the ultimate automata, far more complex than a clockwork bird but still fundamentally mechanical. To Descartes, a machine is defined by its lack of inner consciousness, regardless of how convincing its external behavior might appear to be.

  He famously argued that true language isn't just making sounds, but using words to express thoughts about things unrelated to immediate biological impulses. He'd likely argue that LLMs are just manipulating symbols based on statistical probability without any actual understanding or awareness behind the output, meaning they pass the surface test of speech but fail the deeper test of expressing genuine thought.

  3. "The niche twist"
  This is where it gets interesting because mechanistic interpretability basically confirms Descartes' suspicion that there's "nobody home." If researchers can show that LLMs are just doing matrix math without internal beliefs, that aligns perfectly with his idea of a machine operating on physical laws alone. The pineal gland detail is specific biology he got wrong, but the core principle was that a non-physical soul is needed to animate true reason. Since AI lacks any biological substrate or non-physical substance, he'd say it's still just extended matter, regardless of how fluently it speaks.

  To dig deeper: the absence of reasoning matters way more than the absence of a pineal gland. Descartes was a dualist, meaning he thought the mind could technically exist without a body, so the gland was just the connection point, not the source of thought. However, since AI is built entirely from physical stuff (silicon and electricity), it falls squarely into the "body/machine" category for him. As for the language test, a talking machine doesn't destroy his view because he never claimed speech alone proves mind; he claimed *adaptive* speech driven by understanding proves mind. He would simply argue that AI fails the understanding part, so his criterion remains intact. These two things actually save his view rather than forcing him to update it.

  4. "Bottom line"
  Descartes' view remains surprisingly consistent with modern AI because he never equated behavior with consciousness. He doesn't need to become a functionalist or change his language criterion; he just needs to insist that statistical prediction isn't reasoning. Ultimately, he'd say we built a better parrot, not a new person.
