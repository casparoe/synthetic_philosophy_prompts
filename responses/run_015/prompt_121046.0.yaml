answer: |-
  Here is a careful comparison of the causal-contact and reference-fixing formulations of the paradox of phenomenal judgment.

  ### 1. Distinctness and Reducibility

  The two formulations are genuinely distinct arguments, targeting different nodes in the network of mind, language, and world. Neither is fully reducible to the other, though they are mutually supportive.

  **The Causal-Contact Formulation (CCF)** is fundamentally **epistemological**. Its core premise is a constraint on knowledge or justification: to know (or be justified in believing) a proposition about $X$, one's belief must stand in an appropriate causal relation to $X$.
  *   **What it must establish:** It must show that without a causal link from quale to judgment, the judgment lacks warrant. It grants, for the sake of argument, that the judgment *means* what the subject thinks it means (i.e., it is about the quale), but denies that the subject can *know* this content is instantiated.
  *   **The Common Cause Reply:** This reply accepts the semantic content but bypasses the causal constraint by arguing that reliability (secured by a common neural cause) suffices for knowledge.

  **The Reference-Fixing Formulation (RFF)** is fundamentally **semantic**. Its core premise is a constraint on meaning: the reference of a term is fixed by the entity that causally regulates the subject's use of that term.
  *   **What it must establish:** It must show that if the quale plays no causal role in the production of the judgment, the term used in the judgment cannot refer to the quale. It does not primarily worry about whether the subject is *justified*; it worries that the subject is not saying what she thinks she is saying.
  *   **The Common Cause Reply:** On this formulation, the Common Cause reply is insufficient. Even if the neural state causes both the quale and the judgment, it is the *neural state* that regulates the judgment. Therefore, the term refers to the neural state, not the quale.

  **Reducibility:**
  One might argue RFF reduces to CCF (if I can't refer to it, I can't know it). However, this conflates truth-conditions with warrant. One can have a true belief about $X$ (via luck or common cause) without knowing it; conversely, RFF argues the belief isn't *about* $X$ at all.
  Conversely, CCF does not reduce to RFF. One could hold a non-causal theory of reference (allowing the term to refer to the quale) while maintaining a causal theory of knowledge (denying we can know the reference is satisfied).
  Therefore, they are distinct: CCF challenges the **warrant** of the judgment; RFF challenges the **content** of the judgment.

  ### 2. Difficulty and Scope

  **Which is the harder problem?**
  The **Reference-Fixing Formulation (RFF)** is the harder problem for the epiphenomenalist.
  The CCF can be mitigated by adopting a reliabilist epistemology. If the neural state reliably indicates the quale (via nomological correlation), the epiphenomenalist can claim knowledge without direct causation. The RFF, however, threatens to make epiphenomenalism **self-refuting**. If "qualia" refers to neural states (because they are the causal regulators), then the statement "Qualia are causally inert" translates to "Neural states are causally inert," which is empirically false. The Common Cause reply, which saves CCF, actually fuels RFF: it identifies the neural state as the causal anchor, thereby pulling reference away from the quale.

  **Which tells against a wider range of views?**
  The **Causal-Contact Formulation (CCF)** tells against a wider range of views.
  CCF is an instance of a general skeptical problem regarding causally inert entities. It applies equally to Platonism in mathematics, moral realism (if moral facts are non-natural), and modal realism. Any view positing knowledge of causally isolated entities faces CCF.
  RFF is more specific to views that combine ontological claims with naturalistic semantics. While it applies to moral realism (if one accepts causal theories of reference for moral terms), it is most potent against epiphenomenalism because phenomenal terms are typically thought to be ostensive or indexical ("*this* feeling"), making the lack of causal contact semantically fatal in a way that abstract terms (like "number") might avoid.

  ### 3. Generalization Outside the Philosophy of Mind

  **CCF and Abstract Objects:**
  The CCF is structurally identical to the **Benacerraf Problem** for mathematical Platonism. If numbers are abstract and causally inert, how do mathematicians have knowledge of them?
  *   **Reductio or Resource?** This generalization is a **resource** for the epiphenomenalist. If the epiphenomenalist can argue that the CCF is not a decisive objection to Platonism (e.g., by positing a faculty of rational insight, or by rejecting the causal theory of knowledge for necessary truths), she can import that solution to the philosophy of mind. She can argue that phenomenal knowledge is a sui generis form of acquaintance, akin to rational insight, which does not require causal propagation. This dilutes the force of CCF as a specific objection to epiphenomenalism, turning it into a general metaphysical puzzle.

  **RFF and Generalization:**
  The RFF generalizes to any domain where we posit entities that do not causally regulate our discourse about them. This threatens non-naturalist moral realism (if "good" refers to whatever regulates our approval, it refers to psychological states, not moral facts) and perhaps error theory.
  *   **Analogy:** However, the generalization is less clean than with CCF. We do not typically treat mathematical terms as causally regulated in the same way we treat phenomenal terms. "Pain" is used demonstratively ("*this* experience"); "Seven" is not. Because phenomenal concepts appear to be grounded in direct presence, the demand for a causal link in reference fixing is stronger for qualia than for numbers. Thus, the epiphenomenalist cannot as easily borrow a solution from the philosophy of mathematics to solve RFF. The semantic intuition that "I am pointing at *this*" is harder to reconcile with reference to a hidden neural cause than the intuition that "I am thinking of *number 2*."

  ### 4. The Case of Qualia Drift

  In the **Qualia Drift** case, Neural State $N$ remains fixed, behavior remains fixed, but the accompanying quale shifts from Pain ($Q_1$) to Buzz ($Q_2$) to Pleasure ($Q_3$).

  **CCF Prediction:**
  Under CCF + Common Cause, knowledge relies on reliable correlation.
  *   *Early Life:* $N$ correlates with $Q_1$. Judgment "I am in pain" is reliable and true.
  *   *Drift:* $N$ now correlates with $Q_2$. The subject judges "I am in pain."
  *   *Verdict:* The judgment is now **false** (she is in a buzz, not pain), but the subject has no evidence of this. The reliability condition for knowledge is broken, but undetectably so. The Common Cause reply fails to secure knowledge here because the correlation is not stable across time. The subject is systematically mistaken but epistemically blameless. This leads to skepticism: the subject cannot know if she is in a drift period.

  **RFF Prediction:**
  Under RFF, reference is fixed by the causal regulator ($N$).
  *   *Early Life:* $N$ regulates the use of "pain." "Pain" refers to $N$. Judgment "I am in pain" is true (because $N$ is present).
  *   *Drift:* $N$ remains the regulator. "Pain" still refers to $N$. Judgment "I am in pain" remains **true**.
  *   *Verdict:* The truth of the judgment is preserved throughout the drift. However, this confirms the semantic worry: the term "pain" never referred to the quale ($Q_1, Q_2, Q_3$); it referred to $N$ all along. The change in quale is semantically irrelevant.

  **Discrimination and Verdict:**
  This case discriminates sharply between the formulations.
  *   **CCF** implies the subject loses knowledge/truth during drift (mismatch between content and quale).
  *   **RFF** implies the subject retains truth (match between content and neural state), but at the cost of admitting the content was never about the quale.

  **Does the verdict from (2) survive?**
  Yes. The RFF remains the deeper objection. In the Drift case, CCF merely generates skepticism (we don't know if we are in drift). RFF generates **error theory** or **self-refutation**. If RFF is correct, the epiphenomenalist's core thesis ("Qualia are inert") is false, because "Qualia" refers to neural states (which are active). The Drift case shows that RFF offers a more stable account of the *truth* of ordinary judgments (they remain true despite drift), but only by conceding that those judgments are not about qualia. This confirms that RFF strikes at the very possibility of formulating the view, whereas CCF only strikes at the justification of the view.

  ### Conclusion: The Deeper Objection and the Strongest Move

  **The Deeper Objection:**
  The **Reference-Fixing Formulation (RFF)** is the deeper objection.
  While CCF challenges whether we can *know* our theory is true, RFF challenges whether we can *state* our theory without contradicting ourselves. The Qualia Drift case demonstrates that RFF provides a more robust account of the stability of our judgments (they remain true even if qualia drift), but this stability is purchased by admitting that our phenomenal terms refer to physical states. This renders the claim "Qualia are epiphenomenal" equivalent to "Physical states are epiphenomenal," which is false. CCF leaves the theory possibly true but unknowable; RFF suggests the theory is necessarily false or meaningless as stated.

  **The Strongest Move for the Epiphenomenalist:**
  The strongest move available is to **reject the causal theory of reference for phenomenal concepts**, often developed as the **Phenomenal Concept Strategy (PCS)**.

  The epiphenomenalist must argue that phenomenal concepts are a special class of concepts (e.g., recognitional, demonstrative, or constitutive) that do not rely on causal regulation to fix their reference.
  *   **Against RFF:** She can argue that the reference of "pain" is fixed by the *intrinsic nature* of the experience itself, which is directly present to the subject, not by its causal role. The concept refers to the quale because the quale constitutes the mode of presentation.
  *   **Against CCF:** This move simultaneously addresses CCF. If the concept is constituted by the quale (or involves a direct acquaintance), the requirement for a causal *link* is bypassed by the relation of *identity* or *constitution* between the concept's vehicle and its referent.

  This move is costly, as it requires positing a unique semantic mechanism for phenomenal terms that does not apply elsewhere in our cognitive economy (violating semantic uniformity). However, it is the only move that preserves both the truth of the epiphenomenalist's thesis and the reference of her terms. Without it, the Reference-Fixing Formulation renders epiphenomenalism inexpressible.
