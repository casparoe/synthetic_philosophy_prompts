      *   *Wait, the "Deterministic" Objection:* If we use physical discs, someone will say "gravity and friction moved them." We need to make the *rules* the cause.
      *   *Solution:* A hybrid physical/logical game. The physical state is the board. The *rules* are the "pattern." The players are the "substrate."
      *   *Let's pivot slightly:* The user's "Template vs. Random" idea is hard to execute physically. Let's adapt it to **The Constraint Game**.
      *   *Setup:* Two identical arrangements of tokens on a grid.
      *   *Team A (The Lattice):* They follow a rule: "Keep the symmetry." If a piece is moved, they *must* move another to restore symmetry.
