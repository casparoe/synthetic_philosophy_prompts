answer: |-
  Here is a complete session plan designed for your group's specific constraints and intellectual temperament. It leans into your crystallography background (lattices, stability, diffraction) without requiring the projector.

  ### Session Overview: "The Lattice Wager"

  **Goal:** To demonstrate that a high-level pattern (the Lattice) constrains low-level behavior (the Atoms) in a way that makes the pattern a necessary part of the causal explanation, even if it doesn't exert a physical force.
  **Time:** 90 Minutes (75 mins activity/discussion + 15 mins tea).
  **Materials:** See list below.
  **Philosophy:** Emergence/Downward Causation (without using those words).

  ---

  ### 1. Materials List
  *   **12 Large Plastic Cups** (2 distinct colors, e.g., 6 Red, 6 Blue). *Why: Easy to grip, stable, distinct.*
  *   **2 Large Trays or Placemats** (To define the two "systems").
  *   **2 Sturdy Boxes** (approx. 20cm high). *Why: Place trays on these so wheelchair users have a clear line of sight over the table.*
  *   **Betting Slips** (Small pieces of paper, pre-printed or ruled).
  *   **Pens** (Thick barrels for unsteady hands).
  *   **Chocolate** (For prizes).
  *   **A4 Rule Sheet** (Photocopy provided below).
  *   **Whiteboard & Markers** (For scoring and the debrief).

  ---

  ### 2. Minute-by-Minute Plan

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Intro** | Push tables together. Place boxes in center. Explain the "No Jargon" rule. |
  | **10-25** | **Round 1: The Setup** | Assign roles. Arrange cups into identical Hexagons. Secret instructions to Controllers. |
  | **25-30** | **The Nudge** | Facilitator knocks one cup out of place on *both* trays. |
  | **30-40** | **The Wager** | Group bets on the outcome. Must choose a "Cause." |
  | **40-55** | **TEA BREAK** | **Crucial:** Leave the trays untouched. Let the tension sit. |
  | **55-65** | **Round 2: Resolution** | Controllers give orders. Movers fix Tray 1, leave Tray 2. Reveal instructions. |
  | **65-85** | **Debrief** | Map the game to Careenium/Simms. Address the "Atoms all the way down" objection. |
  | **85-90** | **Close** | Award chocolate. Final thought. |

  ---

  ### 3. The One-Page Rule Sheet (Photocopy This)

  *(Print this single-sided A4 and hand it out at the start)*

  ***

  **THE LATTICE WAGER: RULES OF PLAY**

  **1. THE SYSTEMS**
  We have two trays: **Tray Left** and **Tray Right**.
  At the start, both trays hold an identical pattern of 6 cups (a Hexagon).
  Physically, they are identical. Historically, they are different.

  **2. THE ROLES**
  *   **The Substrate (4 people):** Your hands move the cups. You obey the Controller.
  *   **The Controller (2 people):** You hold the Secret Rule. You speak; Substrate moves.
  *   **The Observers (Everyone else):** You watch and bet.

  **3. THE EVENT**
  The Facilitator will nudge one cup on each tray, breaking the Hexagon.
  The Controllers will then order the Substrate to react.
  *   **Tray Left Rule:** "Restore the Hexagon."
  *   **Tray Right Rule:** "Leave it broken."
  *(Observers do not know these rules yet.)*

  **4. THE WAGER**
  Before the Controllers speak, you must place a bet on a Slip.
  You must mark **ONE** box per tray. No hedging.

  *   **Outcome:** Will the Hexagon be restored? (Yes / No)
  *   **Cause:** What fixed it? (The Cups / The Pattern)

  **5. SCORING**
  *   **1 Point** for predicting the Outcome correctly.
  *   **Bonus Point** if you identify the Cause correctly.
  *   **Zero Points** if you write "Both" or "It depends."

  **6. THE GOLDEN RULE**
  Do not use the word "Supervenience." Do not use the word "Emergence."
  Describe what you see, not what you read.

  ***

  ---

  ### 4. Roles & Accessibility Setup

  *   **The Substrate (4 people):** Choose two people with the steadiest hands for each tray. If grip is an issue, they can direct *you* (the Facilitator) to move the cups for them. They sit closest to the trays.
  *   **The Controllers (2 people):** Choose two articulate members. Give them their instruction cards *before* the group sits down, or whisper it while others are getting tea.
      *   *Controller 1 Card:* "Your system is a CRYSTAL. If the shape breaks, order the Substrate to fix it immediately."
      *   *Controller 2 Card:* "Your system is a PILE. If the shape breaks, order the Substrate to do nothing."
  *   **The Observers (Rest):** Arrange seating so everyone can see the trays on the boxes.
  *   **Accessibility:** Ensure the trays are high enough on the boxes that wheelchair users don't have to look under table edges. Use thick pens for betting.

  ---

  ### 5. Betting & Scoring (The "No Fence-Sitting" Mechanism)

  The betting slip forces a choice.
  *   **Option A (Substrate):** "The cups moved because of physical contact."
  *   **Option B (Pattern):** "The cups moved because the Shape demanded it."

  **Why this punishes "Bit of Both":**
  In the debrief, you reveal that the *physical starting state* was identical. The *physics of the nudge* was identical. The *hands moving the cups* were identical (same Substrate people).
  The *only* difference was the **Instruction**.
  If they bet "The Cups," they are wrong (cups don't jump back spontaneously).
  If they bet "The Pattern," they are right, but they have to explain how a "Pattern" moves a cup.
  If they write "Both," they get zero points. This forces them to commit to an explanation before the tea break gives them time to rationalize.

  ---

  ### 6. Debrief Guide (Mapping the Room to the Philosophy)

  *Keep the whiteboard handy. Draw two columns: "Tray 1" and "Tray 2".*

  **Step 1: The Physical Facts (5 mins)**
  *   Ask: "At the moment before the recovery, were the trays physically different?"
  *   Answer: No. Same cups, same table, same air, same gravity.
  *   Ask: "So why did Tray 1 fix itself and Tray 2 didn't?"
  *   Answer: Because the Controller said so.

  **Step 2: The Controller as Simmball (10 mins)**
  *   Ask: "Is the Controller part of the system?"
  *   (They will say yes).
  *   Ask: "Is the Controller's brain made of atoms?"
  *   (They will say yes).
  *   **The Trap:** "So it was just atoms pushing atoms all along. The Pattern didn't do anything."
  *   **The Counter:** "If the Pattern (the instruction) had been different, would the atoms have moved differently?"
  *   (Yes).
  *   **Point:** The Pattern *selected* which atomic movements happened. It acted as a **Filter**.

  **Step 3: The Filter vs. The Shover (10 mins)**
  *   Use your crystallography analogy.
  *   "Does the Lattice push the atom?" No.
  *   "Does the Lattice tell the atom where it is *allowed* to be?" Yes.
  *   In the game: The Pattern didn't push the cup. It pushed the *Controller's decision*, which pushed the *Substrate's hand*, which pushed the *cup*.
  *   **Key Phrase:** "Causation via Constraint."

  **Step 4: The "Simmballs All The Way Down" Objection (10 mins)**
  *   *Anticipate this:* The ex-vicar or an engineer will say: "But the Controller's decision is just neurons firing. It's still just physics."
  *   *Your Response:* "Agreed. But which neurons fire? The ones that encode the meaning of 'Hexagon'. If you erase the meaning, the neurons don't fire that way. So the Meaning is doing work."
  *   *Hofstadter Link:* This is the Simm. The Simm is a pattern that survives by making the Simmballs keep it alive.
  *   *IT Link:* Ask the IT person: "Is the software pushing the electrons, or are the electrons pushing the software?"

  ---

  ### 7. Troubleshooting: What Will Go Wrong

  **Problem 1: "It's just a command, not a pattern."**
  *   *Risk:* They dismiss the Controller as just a boss, not a "level of abstraction."
  *   *Fix:* In the debrief, emphasize that the Controller *had* to look at the whole shape to know what to do. A local atom can't see the whole shape. The "Whole" caused the "Part" to move.

  **Problem 2: "The cups were identical, so the physics is identical."**
  *   *Risk:* Hard determinism shuts down the room.
  *   *Fix:* Remind them of the bet. "You bet on the Pattern because you knew the Cups wouldn't move on their own. You already believe the Pattern matters. We are just arguing about what kind of 'matter' it is."

  **Problem 3: Dexterity issues slow the game down.**
  *   *Risk:* Moving cups takes too long; boredom sets in.
  *   *Fix:* If the Substrate struggles, allow them to point and you (Facilitator) move the cup. Keep the pace snappy.

  **Problem 4: Someone says "Supervenience" before tea.**
  *   *Risk:* Jargon kills the intuition.
  *   *Fix:* Gently enforce the Golden Rule. "Put that in your pocket for after tea. Right now, just look at the cups."

  ---

  ### 8. Honest Limitations (For Your Eyes Only)

  *   **What this doesn't show:** It doesn't prove that patterns exist *independently* of matter. The Controller is still a physical human. It doesn't solve dualism.
  *   **What you must say out loud:** "This game doesn't prove the Pattern is a ghost. It proves the Pattern is a **necessary description**. Without the word 'Hexagon', you cannot predict the future of Tray 1, even if you know every atom's position. If you can't predict without it, it's doing work."
  *   **The "Deterministic" Shield:** If they insist it's all deterministic physics, concede it. "Yes, but it's *layered* deterministic physics. The top layer constrains the bottom layer. That constraint is the 'push'."

  ### Facilitator's Opening Script (First 2 Minutes)

  "Welcome. I'm not going to lecture. I'm a crystallographer, so I spend my life arguing that a Lattice does things to Atoms. My colleagues say 'No, atoms do things to Lattices.' We're going to settle it with a wager.
  There are two rules for today. One: No fiddly bits, we use cups. Two: No jargon. If you know a ten-dollar word for what's happening, keep it in your pocket until after tea. We're looking at the cups, not the dictionary.
  Who's willing to put their chocolate on the line?"
