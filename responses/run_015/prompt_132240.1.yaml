      *   **Goal:** An activity where they *walk into* the problem. A wager/game element. A debrief that maps activity to philosophy. Honest assessment of limitations.
      *   **User's Half-Baked Idea:** Two trays (Template vs. Random Selection). Nudge test. The user suspects the "pattern as cause" lies in counterfactuals/filters, not forces.
