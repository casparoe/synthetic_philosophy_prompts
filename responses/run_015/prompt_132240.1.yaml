      The user's intuition about "Counterfactuals" is spot on. The difference isn't the *state*, it's the *disposition*.
      Let's make the game about **Prediction and Betting**.
      We create a system where the "Pattern" allows you to predict the future state better than knowing the "Substrate" alone.
      Actually, let's stick close to the User's "Template" idea but make it feasible.
      **Game:** "The Architect and the Masons."
      **State:** A grid of magnets or velcro tokens (easy to move).
