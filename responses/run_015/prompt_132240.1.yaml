      *   *Better Approach:* We need a system where the *rules* of interaction depend on the *pattern*, not just the final state. The "Template Holder" idea is good (represents the high-level constraint), but we need the "Local Movers" to be constrained by the pattern in a way that feels like the pattern is doing work.
