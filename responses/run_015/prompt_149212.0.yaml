answer: |-
  1. First, we must determine whether the phenomenal heterogeneity of pleasure necessitates abandoning felt-quality theories for attitudinal accounts, as this upstream metaphysical choice dictates whether malicious pleasure can be intrinsically valuable without ad hoc normative filters. This is highly tractable for conceptual analysis, but empirical evidence of dissociated liking and wanting in addiction would force this to the bottom of the agenda.
  2. Second, we need to assess if malicious pleasures share the same intentional structure as benign ones, since resolving whether the object of pleasure affects its valence is downstream of defining pleasure's core but upstream of constructing a coherent welfare metric. Philosophical argumentation suits this better than neuroscience, though finding neural correlates specific to moral emotion would require reordering this below empirical work.
  3. Third, we should investigate the unconventional hypothesis that pleasure is unified by family-resemblance clusters in homeostatic reward dynamics rather than phenomenology, which would radically shift downstream cross-species welfare comparisons away from subjective reports. This is less tractable for philosophy than neuroscience, but if philosophical coherence fails without empirical grounding, this becomes the primary focus over phenomenology.
  4. Fourth, we must analyze whether resolving the heterogeneity problem alters the commensurability of intellectual and bodily goods, as this downstream ethical implication depends entirely on the upstream success of unifying pleasure's structure. This is primarily conceptual, but if neuroeconomic data shows distinct valuation circuits for different pleasure types, this question becomes empirically driven.
  5. Fifth, we must evaluate if a fragmented concept of pleasure undermines hedonistic utilitarianism's aggregation principle, since this downstream normative crisis depends on the upstream failure to find a common currency of value. This is tractable via thought experiments, but if a unified functional account emerges, this concern becomes negligible.
