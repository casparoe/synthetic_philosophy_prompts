answer: |-
  **Title:** *The Touch Test*
  **Blurb:** A novel following a physiotherapist rehabilitating a non-verbal stroke victim. The prose renders the patient's pain solely as tactile resistance in the therapist's hands.

  **Scenario:**
  The book's innovation is its radical restriction of perspective. We never enter the patient's mind; his cries are described only as vibrations in the therapist's palms, his spasms as kinetic problems to solve. The prose is hypnotic, turning struggle into a dance of force and counterforce. Critics praise its visceral immediacy, its ability to make the reader feel the work in their own muscles. But the moral charge is that it trains us to experience another's suffering as raw material for our own competence. The beauty lies in the efficiency of the touch; the vice is that the touch effaces the person touched. The reader leaves having learned to listen to pain without hearing it. This attention is portable: it is the attention of a manager, a surgeon, a lover who fixes rather than feels. The book is great because it makes this effacement beautiful. It is compromised because it makes this effacement beautiful.

  **Walkthrough:**
  *   **Autonomism:** The visceral immediacy is an aesthetic merit; the objectification is a moral flaw. These properties belong to separate categories. The book is aesthetically successful because it achieves its sensory aims, regardless of the moral cost.
  *   **Moderate Moralism:** The work aims at depicting human care. The objectification undermines the truth of that care, preventing the appropriate response (empathy). Therefore, the moral flaw interferes with the work's aim, counting as an aesthetic flaw.
  *   **Immoralism:** The objectification is precisely what generates the visceral immediacy. The moral transgression is the source of the aesthetic power. It is an aesthetic merit *because* it is a moral flaw.
  *   **Disagreement:** They disagree on whether the moral property is inert (Autonomism), obstructive (Moderate Moralism), or constitutive (Immoralism) of the aesthetic value.

  **Ablations:**
  1.  **Remove Portability:** If the trained attention stays within the fiction, Moderate Moralism softens. The interference with real-world response is negligible, so the aesthetic flaw diminishes. Autonomism and Immoralism remain unchanged, as they assess internal relations.
  2.  **Move Vice to Content:** If the therapist *states* he objectifies the patient, but the prose remains empathetic, Moderate Moralism verdict shifts to "Not an aesthetic flaw." The form secures the empathetic response despite the character's moral failing. Autonomism remains unchanged. Immoralism loses its force; the transgression is stated, not felt, so it ceases to be an aesthetic merit.

  **Best Attack (vs. Autonomism):**
  "You claim the feeling is separate from the ethics of the feeling. But a feeling trained on a person *is* an ethical act. You cannot separate the beauty of the touch from the erasure of the touched."

  **Verdict:**
  Moderate moralism is correct. The book fails aesthetically because its moral vice corrupts the very response it purports to offer. It claims to offer intimacy, but the craft trains the reader in objectification; this is not a separate moral sin, but an aesthetic contradiction. The work aims at human connection but delivers mechanical mastery, and that failure of aim is an aesthetic failure. The beauty is real, but it is the beauty of a lie, and a lie about human contact undermines the art of contact.

  **Note:**
  This construction leans on the contestable claim that habits of attention are morally assessable outside of intentional action. An intelligent non-philosopher could refuse this, arguing that reading is a sandbox where moral rules do not apply. It also assumes the work *prescribes* a response rather than merely depicting one; if the book is seen as describing objectification without endorsing it, the Moderate Moralist case collapses.
