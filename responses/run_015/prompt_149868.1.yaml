answer: |-
  Here is a principle derived from your intuitions, refined to handle the tensions you identified, followed by the test you requested.

  ### The Principle: Non-Dominating Association

  > **"A group's right to exclude is derivative of its right to associate: exclusion is permissible only when necessary to sustain the constitutive norms of a voluntary, reciprocal cooperative scheme, and impermissible when it functions to secure a positional advantage, enforce a hierarchy of status, or monopolize resources essential for basic agency."**

  This principle anchors exclusion in **association** (the "shared life" you mentioned) rather than **ownership** (the "spare room" or "land"). It introduces a constraint of **domination**: you cannot use associative freedom to render others dependent on your whim or structurally subordinate.

  ### Testing the Principle Against Your Cases

  Here is how the principle sorts your verdicts. I have grouped them by how they interact with the two clauses (Integrity vs. Domination).

  **1. The Clear Fits (Integrity Protected, No Domination)**
  *   **Chess Club (Obnoxious):** Exclusion protects the *constitutive norm* (civil discourse). Verdict: **Allowed.**
  *   **Kibbutz (Work Requirement):** Exclusion protects the *reciprocal scheme* (labor pooling). Verdict: **Allowed.**
  *   **Homeowner (Blizzard):** This is the edge case. Under strict "essential resources" language, you might have a duty to rescue. However, the principle specifies *monopolizing* resources. A single spare room is not a monopoly. The exclusion protects the *voluntary* nature of the home. Verdict: **Allowed** (matches your intuition).
  *   **Indigenous Nation (Descent):** This fits "constitutive norms" (cultural survival) and is arguably *anti-domination* (remedial sovereignty against a dominant state). It is not a "positional advantage" in the market sense, but a claim to self-determination. Verdict: **Allowed.**

  **2. The Clear Violations (Domination or Hierarchy)**
  *   **Chess Club (Woman):** Exclusion enforces a *hierarchy of status* unrelated to the practice. Verdict: **Not Fine.**
  *   **Ethnic Homogeneity:** Enforces a *hierarchy of status*. Verdict: **Not Fine.**
  *   **Village (Land Monopoly):** This is the clearest violation. By owning *all* surrounding land, they *monopolize resources essential for basic agency* (housing). They are using associative freedom to create a structural dependency. Verdict: **Not Fine.**
  *   **Guest Workers:** This violates the *reciprocal* clause. If they pay into pensions and work for decades, they are part of the cooperative scheme. Denying voice/exit creates a *hierarchy of status* (caste). Your intuition that this is "worse than exclusion" is captured here: it is *exploitative inclusion*, which violates the "voluntary, reciprocal" condition even harder than exclusion.
  *   **No Exit:** Violates the *voluntary* clause. If you cannot leave, you are not a member; you are a subject. This is a form of domination. Verdict: **Not Fine.**

  **3. The Trouble Spots (Where the Principle Pressures Your Intuitions)**
  *   **The Welfare State:** You said "shakily fine." The principle pressures this. Is the welfare state a "voluntary cooperative scheme"? Yes. But does excluding to protect it "monopolize resources essential for basic agency" on a global scale? If the global order is unjust, rich states excluding poor migrants to protect their wealth looks like the **Village** case scaled up.
      *   *Pressure:* The principle forces you to decide if the state is more like the **Kibbutz** (a closed reciprocal loop) or the **Village** (a hoarder of essential opportunity). You cannot keep "shakily fine"; you must lean based on your view of global justice.
  *   **City vs. Nation:** You suspected the right belongs to "whatever level can actually exercise it." The principle says the right belongs to the level that constitutes the **reciprocal scheme**. If the welfare/tax scheme is national, the city cannot unilaterally override it. If the "shared life" is local, they can.
      *   *Pressure:* This forces you to define where the "cooperative scheme" actually lives.

  ### The Forced Drop

  If you adopt this principle, you must likely revise your verdict on the **Homeowner in the Blizzard**.

  **Why:** The principle forbids monopolizing resources "essential for basic agency." While one room isn't a monopoly, the *need* in a blizzard is immediate basic agency (survival). Most political philosophers (following Locke's proviso or modern human rights frameworks) argue that property rights yield to necessity.
  *   **The Repair:** To keep the Homeowner verdict "Allowed," you must interpret "essential for basic agency" as *systemic* access, not *emergency* access. But if you do that, the **Village** case becomes harder to condemn (is housing systemic or emergency?).
  *   **Recommendation:** Bite the bullet. In a life-or-death blizzard, the right to exclude yields to the duty of rescue. It is not "allowed, though unkind"; it is **impermissible**. This strengthens your condemnation of the Village: if you can't exclude in a blizzard, you certainly can't exclude to keep housing cheap permanently.

  ### Addressing Your Two New Cases

  **(a) The Degrading Application Process**
  *   *Verdict:* **Impermissible.**
  *   *Reasoning:* This is "constructive exclusion." If the process is degrading, it enforces a **hierarchy of status** (the applicant must beg/prostrate). It violates the "reciprocal" condition because reciprocity requires mutual respect. Even if they technically *can* apply, the terms of entry establish domination. It is morally equivalent to the "Guest Worker" case: inclusion on terms that degrade agency.

  **(b) The Dead-Hand Covenant (1950s, Irrepealable)**
  *   *Verdict:* **Impermissible.**
  *   *Reasoning:* This violates the **voluntary** condition. The principle justifies exclusion to sustain a *current* "voluntary, reciprocal cooperative scheme." If the current members would vote to repeal it, the exclusion is *not* protecting their current shared life; it is enforcing the will of the dead over the living. It functions as a **lock-in of historical power**, which the principle explicitly forbids. The group has lost its associative freedom because it cannot redefine its own boundaries.

  ### Summary of the Trade
  By adopting **Non-Dominating Association**, you gain a robust explanation for why the Village, Guest Workers, and No-Exit cases are wrong (they create domination/caste). You also explain why Indigenous sovereignty is distinct (it is anti-domination/remedial).

  **The cost:** You lose the "shakily fine" ambiguity on the Welfare State (you must choose between Kibbutz or Village logic), and you likely lose the Homeowner verdict in extreme necessity cases. You gain a sharper tool, but it cuts closer to your own property intuitions.
