answer: |-
  ### First: Prediction of Verdict

  **Verdict:** Marta will bet **$60,000 AGAINST success** (the maximum allowed).

  **Reasoning:**
  Marta's track record (a–f) demonstrates she is a strict maximizer of Expected Logarithmic Utility (the Kelly Criterion). She does not maximize Expected Value (verdict b), she accounts for correlation (verdict e), and she acts on small edges (verdict c). The critical question is whether she applies this optimization to her liquid bankroll in isolation or to her total net worth.

  Given verdict (e), where she aggregated two perfectly correlated bets into a single exposure limit, consistency demands she aggregate *all* exposures to the same state of the world. Her outside equity is a massive, unhedgeable long position on the product's success.
  *   **State Success:** Outside Wealth = $1,300,000.
  *   **State Failure:** Outside Wealth = $500,000.

  By betting *against* success, she hedges this concentration. Even though she believes success is more likely ($p=0.6$), the marginal utility of additional wealth in the "Success" state is low because she is already wealthy in that state. The marginal utility of wealth in the "Failure" state is high. The math dictates she should hedge significantly. Since the optimal hedge exceeds the offer limit, she takes the maximum allowed in the hedging direction.

  ---

  ### Second: Competing Rules and Predictions

  Here are the three rules that fit her past track record, along with their arithmetic predictions for the current offer.

  **Rule 1: Compartmentalized Kelly (Bankroll Unit of Account)**
  *   **Definition:** Marta maximizes the expected log growth of her liquid betting bankroll only. Outside wealth is treated as irrelevant background noise. She continues to apply the Kelly fraction $f^* = p - q$ (for even money) to the $200,000 account.
  *   **Arithmetic:**
      *   Edge: $0.6 - 0.4 = 0.2$ (20%).
      *   Optimal Stake: $20\% \times \$200,000 = \$40,000$.
      *   Direction: On Success (positive edge).
      *   Constraint Check: $\$40,000 < \$60,000$ limit.
  *   **Prediction:** **Bet $40,000 ON success.**

  **Rule 2: Integrated Kelly (Total Wealth Unit of Account)**
  *   **Definition:** Marta maximizes the expected log growth of her total net worth (Bankroll + Outside Equity). She explicitly calculates the correlation between the bet and her outside holdings.
  *   **Arithmetic:**
      *   Let $x$ be the stake on Success (negative $x$ implies betting Against).
      *   Wealth if Success ($W_S$): $\$200,000 + x + \$1,300,000 = \$1,500,000 + x$.
      *   Wealth if Failure ($W_F$): $\$200,000 - x + \$500,000 = \$700,000 - x$.
      *   Objective: Maximize $0.6 \ln(1,500,000 + x) + 0.4 \ln(700,000 - x)$.
      *   First Order Condition (derivative = 0):
          $$ \frac{0.6}{1,500,000 + x} - \frac{0.4}{700,000 - x} = 0 $$
          $$ 0.6(700,000 - x) = 0.4(1,500,000 + x) $$
          $$ 420,000 - 0.6x = 600,000 + 0.4x $$
          $$ -180,000 = 1.0x $$
          $$ x = -180,000 $$
      *   Optimal Stake: $-\$180,000$ (Bet $180k Against).
      *   Constraint Check: The offer limit is $\$60,000$. Since log utility is concave, utility increases as she moves from $0$ toward $-180,000$. She stops at the limit.
  *   **Prediction:** **Bet $60,000 AGAINST success.**

  **Rule 3: Abstention (Implication Norm)**
  *   **Definition:** Marta declines to bet on outcomes where she holds significant untradeable exposure or inside information, regardless of the mathematical edge. This treats the equity position as a conflict of interest rather than a portfolio asset.
  *   **Arithmetic:** N/A (Heuristic rule).
  *   **Prediction:** **Pass.**

