  ### Fourth: Separating Cases

  To definitively settle whether her unit of account is Bankroll or Total Wealth, you need a case where the two models diverge on **size** without being constrained by offer limits or correlation hedging.

  **The Separating Case:**
  Offer Marta a standard, **uncorrelated** even-money bet with a known edge, where the limit is high enough to test her capital base.

  *   **Offer:** A coin flip (uncorrelated with her employer's stock). Even money. Her probability of winning 0.55.
  *   **Limit:** Up to $150,000.
  *   **Current Wealth:** Bankroll $200,000. Outside Wealth (Expected) $980,000. Total $\approx$ $1.18M.

  **Predictions:**
  1.  **If Rule 1 (Bankroll) is true:**
      *   Kelly Fraction: $0.55 - 0.45 = 10\%$.
      *   Base: $200,000.
      *   **Stake:** **$20,000.**
      *   *Reasoning:* She treats the $200k as her entire universe.

  2.  **If Rule 2 (Total Wealth) is true:**
      *   Kelly Fraction: $10\%$.
      *   Base: $\approx 1,180,000$.
      *   **Stake:** **$\approx$ $118,000.**
      *   *Reasoning:* She treats the bankroll as merely the liquid sleeve of her total net worth. She will move cash from outside (or leverage) to size the bet correctly against her true wealth.

  **Why this settles it:**
  The current employer bet is confounded by correlation (hedging vs. speculation). An uncorrelated bet removes the hedging motive. If she bets small ($20k), she is a compartmentalized gambler. If she bets large ($118k), she is a holistic investor. This single offer separates the "Unit of Account" question definitively.
