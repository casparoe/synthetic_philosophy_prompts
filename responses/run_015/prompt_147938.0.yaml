answer: |-
  You are basically right, and you've stumbled onto one of the most famous debates in 20th-century philosophy of science. Your intuition is sharper than your roommate's on this one, but your roommate is technically correct about *standard* Bayesian formalism.

  Here is the breakdown of why you're both partially right, what the actual "coherence constraint" is that you're missing, and why your diachronic intuition is the standard solution to the problem.

  ### 1. Where your roommate is right (The Formal Problem)
  Your roommate is reciting the **Glymour (1980)** formulation of the Old Evidence problem. In strict, textbook subjective Bayesianism:
  *   Conditionalization requires updating on a proposition $E$ that you were previously uncertain about ($P(E) < 1$).
  *   If $E$ is already known (Mercury's perihelion), then $P(E) = 1$.
  *   If $P(E) = 1$, then $P(E|H) = 1$ (assuming $H$ entails $E$).
  *   Therefore, the likelihood ratio is $1/1$, and $P(H)$ does not change.

  Mathematically, within the strict axioms of standard Bayesian conditionalization, your roommate is correct. If you treat probability as a static logic of consistency, you cannot update on a tautology (which $E$ effectively becomes once known). When he calls counterfactual resetting "cheating," he is voicing a common objection to the **Howson** solution (which suggests stripping $E$ from your background knowledge to see if $H$ predicts it). Many find that epistemically dishonest because you *do* know $E$.

  ### 2. Where you are right (The Diachronic Solution)
  Your intuition that "credences are tied to an agent at a specific time" is the exact motivation for the most popular solution to this problem: **The Garber Solution (1983).**

  Daniel Garber argued exactly what you are suggesting: We shouldn't update on $E$ (Mercury's orbit). We should update on the **logical relation** between $H$ and $E$.
  *   At $t_1$, Einstein knows $E$, but he does *not* know that $H$ (GR) entails $E$.
  *   At $t_2$, Einstein learns the new fact: $K = \text{"}H \text{ entails } E\text{"}$.
  *   $K$ is a *new* piece of evidence. $P(K) < 1$ at $t_1$, and $P(K) = 1$ at $t_2$.
  *   You conditionalize on $K$, not $E$.

  This allows $P(H)$ to rise without pretending you never knew $E$. This validates your diachronic view: the *learning event* wasn't seeing Mercury's orbit; the learning event was realizing GR explained it.

  ### 3. The Missing Coherence Constraint: Logical Omniscience
  You asked: *"Is there an actual coherence constraint im missing that blocks this?"*

  **Yes.** It is the assumption of **Logical Omniscience.**

  Standard Bayesianism assumes an ideal agent who instantly knows all logical consequences of their beliefs. If you believe $H$, and $H$ logically entails $E$, a standard Bayesian agent *must* already assign $P(E|H) = 1$. They cannot "learn" the connection later because they are assumed to know it already.

  The Old Evidence problem only exists because **real humans are not logically omniscient.**
  *   **Static/Logical View:** If probabilities are logical relations, $H \models E$ is true timelessly. You get no credit for noticing it.
  *   **Diachronic/Psychological View:** If probabilities are mental states, realizing a logical connection is a cognitive event that warrants belief revision.

  So, the "puzzle" is indeed a confusion between **idealized logical probability** (which your roommate is defending) and **actual rational inference** (which you are defending).

  ### 4. Why your roommate might still push back
  Your roommate might argue that if we allow updating on logical connections ($H \models E$), we break the standard Kolmogorov axioms of probability. To make your view work formally, you have to adopt a **non-omniscient Bayesian framework** (like Jeffrey Conditionalization or Hintikka's epistemic logic).

  He calls it "cheating" because standard Bayes doesn't have a slot for "I learned a math fact about my hypothesis." It only has a slot for "I observed a fact about the world."

  ### The Verdict
  You win the philosophical argument, but he wins the textbook definition argument.

  *   **He is right** that *standard* Bayesian conditionalization cannot handle old evidence without ad-hoc fixes.
  *   **You are right** that rational agents *do* and *should* update on old evidence when they discover a new explanatory link.

  The consensus in philosophy of science is largely on your side: The Old Evidence problem demonstrates a limitation of **standard** Bayesianism, not a limitation of rational inference. The solution is to treat the *discovery of the entailment* as the new evidence, exactly as you proposed.

  Tell him to look up **"Garber's Solution to the Old Evidence Problem."** It's literally the argument you just made, formalized by a philosopher in 1983.
