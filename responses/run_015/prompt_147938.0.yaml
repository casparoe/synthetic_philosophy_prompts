  ok so me and my roommate got into it last night about bayesian old evidence. he said if mercury's orbit was already known before GR, then P(E) is basically 1 so the bayes factor is flat and einstein gets no credit. i brought up this idea called counterfactual prior resetting where you imagine your prior before seeing E and then run the update, but he said thats just cheating because you can't change your actual prior after the fact. but heres what i dont get: bayesian credences are diachronic, right? theyre tied to an agent at a specific time. so at t1 i know E and have low credence in GR. at t2 i learn GR predicts E. why can't i just update my t2 credence in GR based on the predictive match, without pretending i never knew E? it feels like the old-evidence problem only hits if you treat probabilities like timeless logical relations instead of mental states that evolve. is the puzzle really just a confusion between static logical probability and diachronic credence, or is there an actual coherence constraint im missing that blocks this?
