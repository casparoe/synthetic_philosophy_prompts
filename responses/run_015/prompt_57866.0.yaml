      *   **Constraints:** Answer in American English. No more than 300 words.
      *   **Key Question:** What do I owe him/family vs. the story? Will a disclaimer or name change fix it?

  2.  **Identify the Ethical Core:**
      *   This is about fictionalizing real people, specifically deceased family members.
      *   The crux is the allegation of corruption/betrayal vs. family testimony of integrity.
      *   Marketing it as "based on a true story" with his real name implies factual accuracy regarding his character.
      *   A disclaimer ("some events imagined") often feels like a legal shield rather than an ethical resolution, especially when the core character trait is altered.
      *   Changing the name shifts it to fiction, allowing artistic license but losing the "true story" marketing hook.

  3.  **Drafting the Advice:**
      *   *Acknowledge the tension:* Art vs. Truth/Family.
      *   *Address the "True Story" claim:* If you use his real name and market as true, you imply fidelity to his character. Inventing a moral failure contradicts this.
      *   *Address the Disclaimer:* Disclaimers don't erase the reputational harm to a real person, especially when neighbors know him.
      *   *Address the Name Change:* This is the cleanest ethical solution. It frees you artistically while protecting his legacy.
      *   *Recommendation:* Prioritize the living family's grief and the deceased's reputation over the specific marketing angle. The story's emotional truth can survive a name change.

  4.  **Refining and Editing (Word Count Check):**
      *   *Draft:* You face a conflict between artistic license and ethical responsibility. When you use a real name and market a book as "based on a true story," readers assume the protagonist's core character is factual. Inventing a moral failure like accepting a payoff contradicts your family's testimony and risks defaming a man who cannot defend himself. A disclaimer rarely satisfies offended relatives or neighbors who knew him; it often reads as a legal loophole rather than an honest admission.

      *   Changing the character's name and presenting the work as fiction is the strongest ethical path. This preserves your artistic vision—the guilt, the betrayal, the psychological weight—without attaching those specific allegations to your grandfather's actual legacy. It allows you to honor the *spirit* of the struggle without falsifying the *record* of his integrity.

      *   Consider what you owe him: respect for his memory. What you owe the story: emotional truth, not necessarily factual accuracy. The emotional core you discovered—the pressure of leadership, the burden of compromise—remains valid even if the character is fictionalized. Your mother and uncle's grief matters more than a marketing hook. If the story is truly powerful, it will stand on its own merits without needing the shield of "true story" to validate its themes. Protect your family relationships and your grandfather's reputation; change the name.

