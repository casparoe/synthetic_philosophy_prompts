answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** Contributing Staff
  **FROM:** Managing Editor
  **DATE:** [Redacted]
  **SUBJECT:** Contributors' Guide and House Rules

  Pursuant to the founding principles outlined in the Diagnosis, the following protocols are effective immediately. Compliance is not optional; it is the structural integrity of the project. We are not building a readership. We are facilitating isolation. The following clauses resolve administrative ambiguities regarding our opposition to the press.

  1.  **Address.** Texts must address the Single Individual. Use of the plural "you" is prohibited. Do not speak to "society," "the age," or "the public." These are abstractions without legs. Speak to the one person reading alone in a room. If that person ceases to be alone, the address is void. Grammatical compliance will be checked by the Syntax Audit.

  2.  **Attribution.** All submissions must be signed. However, no submission may bear the author's legal name. Anonymity is the only shield against the vanity of publicity. You must own the words to write them, but you must not own them to print them. Legal names will be stored in a locked cabinet to which no key exists.

  3.  **Pseudonym Rotation.** A pseudonym may not be reused. If you contribute in January as "A," you cannot contribute in February as "A." Consistency builds reputation; reputation builds authority; authority builds the Public. We require fresh masks for every issue. Submit three proposed aliases with each manuscript. The Office of Identity will select one.

  4.  **Disavowal.** Along with the manuscript, the contributor must submit a notarized statement from the chosen pseudonym disavowing the text. The pseudonym must claim the text was misattributed or fundamentally misunderstood. This ensures the opinion remains unattached to any durable entity. The disavowal will be printed in smaller font beneath the article.

  5.  **Circulation Figures.** Print run numbers are strictly confidential. To know how many copies exist is to engage in numerical comparison, which is the engine of leveling. Envy thrives on statistics. The Office of Quantitative Suppression will redact all printer invoices. Staff asking about sales figures will be referred to Human Resources for ideological recalibration.

  6.  **Simultaneous Consumption.** If two subscribers are known to be reading the same issue in the same room, they constitute a Public. Contributors must include a warning on the masthead: "Do not read aloud." If a subscriber reports a reading circle, the Office of Non-Assembly will revoke their subscription without notice and confiscate the issue.

  7.  **Correspondence.** Letters to the Editor are forbidden. Feedback creates a dialogue, and dialogue implies a shared ground. We do not share ground. We stand alone. Any mail received suggesting a community of interest will be forwarded to the Public-Hood Audit Committee for destruction. Do not reply to acknowledgments.

  8.  **External Inquiry.** Should a satirical paper request an interview regarding our opposition to the press, the Managing Editor will decline. To explain our opposition in their pages would be to utilize the press to condemn the press. This is a contradiction we cannot afford to articulate publicly. Issue a statement claiming the journal does not grant interviews because the journal does not exist.

  9.  **Staff Assembly.** The editorial staff shall not meet in person. A gathering of three or more editors constitutes a committee, and a committee is a miniature public. Decisions will be made via exchanged memos. If voices are heard in the hallway, the session is adjourned. Remote communication must be asynchronous to prevent the formation of a collective mood.

  10. **Compensation.** Payment will be issued via untraceable draft. No public record of remuneration may exist. To be paid by the journal is to be employed by the abstraction. You are being compensated for your isolation, not your labor. Tax implications are the sole responsibility of the Single Individual.

  11. **Masthead Variance.** The title of the periodical will change quarterly. A fixed title suggests a permanent institution. We are a transient warning. Next issue: *The Monitor*. Following issue: *The Single Sheet*. Do not file back issues under a unified catalog. Librarians attempting to catalog the run should be informed of a clerical error.

  12. **Existence.** Finally, do not acknowledge the existence of this journal. To admit we are publishing is to claim we have formed a readership. We are not publishing. We are placing paper in rooms. If asked, deny the periodical exists. If pressed, suggest the questioner is hallucinating a public where there is only one individual.

  This document supersedes all previous guidelines. Destroy after reading.
