      4.  **Disavowal.** Along with the manuscript, the contributor must submit a notarized statement from the chosen pseudonym disavowing the text. The pseudonym must claim the text was misattributed or misunderstood. This ensures the opinion remains unattached to any durable entity.

      5.  **Circulation Figures.** Print run numbers are strictly confidential. To know how many copies exist is to engage in numerical comparison, which is the engine of leveling. Envy thrives on statistics. The Office of Quantitative Suppression will redact all printer invoices.

