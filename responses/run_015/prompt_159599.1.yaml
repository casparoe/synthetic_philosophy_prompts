      Pursuant to the founding principles outlined in the Diagnosis, the following protocols are effective immediately. Compliance is not optional; it is the structural integrity of the project. We are not building a readership. We are facilitating isolation.

      1.  **Address.** Texts must address the Single Individual. Use of the plural "you" is prohibited. Do not speak to "society," "the age," or "the public." These are abstractions without legs. Speak to the one person reading alone in a room. If that person ceases to be alone, the address is void.

