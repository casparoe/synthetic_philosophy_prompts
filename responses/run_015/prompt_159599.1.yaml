      10. **Compensation.** Payment will be issued via untraceable draft. No public record of remuneration may exist. To be paid by the journal is to be employed by the abstraction. You are being compensated for your isolation, not your labor.

      11. **Masthead Variance.** The title of the periodical will change quarterly. A fixed title suggests a permanent institution. We are a transient warning. Next issue: *The Monitor*. Following issue: *The Single Sheet*. Do not file back issues under a unified catalog.

      12. **Existence.** Finally, do not acknowledge the existence of this journal. To admit we are publishing is to claim we have formed a readership. We are not publishing. We are placing paper in rooms. If asked, deny the periodical exists. If pressed, suggest the questioner is hallucinating a public where there is only one individual.

