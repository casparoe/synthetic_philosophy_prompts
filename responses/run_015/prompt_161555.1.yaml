      *   Ensure the distinction between "what it did" (extension) and "what it would do" (intension/disposition) is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe call Case 2 "The Problem of Induction." *Correction:* No, that's about justifying belief. Case 2 is about the *identity* of the function. Stick to Extension/Intension and Dispositions.
      *   *Initial thought:* Is Case 3 just "Coupling"? *Correction:* Too engineering-focused. Philosophically, this is about where meaning resides (in the head/code or in the world). Use Putnam's Twin Earth.
      *   *Check:* Did I answer "Is Case 2 the same phenomenon as MR?" *Answer:* No, it's a failure condition for MR. MR requires the *same* capacity. Case 2 is *different* capacities that look the same temporarily.
