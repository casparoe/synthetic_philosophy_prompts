          *   Explain why MR doesn't quite fit: MR assumes the *capacity* is identical. In Case 2, the capacities diverge on untested inputs.
          *   Settle the "Principled Way": The difference *is* in the module right now, encoded in its structure (weights vs. map), which dictates its *counterfactual* behavior. It's not just expectation; it's structural disposition.
      *   *Section 3: Case 3 & Semantic Externalism.*
          *   Concept: **Content Externalism** (Putnam/Burge).
          *   Explain that computation isn't just syntax; it's semantics. If the link to the world breaks/changes, the "mental state" (module function) changes even if the bits don't.
      *   *Section 4: Bringing it together.*
          *   Case 1 = MR (Same function, different structure).
          *   Case 2 = Dispositional Difference (Different functions, overlapping extensions).
          *   Case 3 = Externalism (Same structure, different content).
      *   *Conclusion:* Summarize the boundaries.

  5.  **Refine the Tone:**
      *   Avoid overly dense jargon without explanation.
