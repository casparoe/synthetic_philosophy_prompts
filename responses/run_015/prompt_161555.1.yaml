answer: |-
  You have correctly identified that "Multiple Realizability" (MR) explains Case 1 but breaks down when applied to Cases 2 and 3. Your intuition is sharper than the colloquial use of the term in your reading group.

  In philosophy of mind and metaphysics, the distinctions you are drawing map onto three distinct concepts: **Multiple Realizability** (Case 1), **Dispositional Properties/Intensionality** (Case 2), and **Semantic Externalism** (Case 3).

  Here is the breakdown of the boundaries, the concepts, and how they apply to your engineering cases.

  ---

  ### 1. Case One: Multiple Realizability (The Standard View)
  **The Concept:**
  Multiple Realizability is the claim that a single higher-level property (like "being in pain" or "sorting a list") can be instantiated by many different lower-level physical structures (neurons vs. silicon; comparison sort vs. hash map).

  **Why it fits Case 1:**
  In your first case, the "higher-level property" is the API contract (the function `assign_bucket(record)`). The "lower-level structures" are the three algorithms.
  *   **Boundary:** MR requires that the *capacity* remains identical across all possible inputs defined by the contract.
  *   **Verdict:** This is textbook MR. The system is defined by its input/output behavior over the *specified domain*, and since all three implementations satisfy the contract over that domain, they are realizations of the same functional state.

  ### 2. Case Two: Dispositions and Intensionality (The Counterfactual Gap)
  **The Concept:**
  This is the core of your question. Why do we say the ML model and the Lookup Table are different, even if they agree on all *actual* data?
  Philosophically, this distinction rests on **Extension vs. Intension** and **Dispositional Properties**.

  *   **Extension:** The set of actual input/output pairs that have occurred. (Extensionally, your two components are identical *so far*).
  *   **Intension:** The rule or procedure that determines the output for *any possible* input. (Intensionally, they are different).
  *   **Dispositional Properties:** A property is dispositional if it is defined by what *would* happen under certain conditions, not just what *did* happen. "Fragility" is the classic example. A glass is fragile even if it is never struck. Its fragility is a fact about its current structure, not a history of breakage.

  **Why MR doesn't fit Case 2:**
  MR assumes the *function* is the same. In Case 2, the functions are **not** the same. They merely overlap on a subset of the domain (the test corpus).
  *   The ML model has the disposition to generalize (interpolate/extrapolate).
  *   The Lookup Table has the disposition to fail (return fallback) on unseen keys.

  **Settling it Principledy:**
  You asked: *Does the difference live in the module right now, or only in our expectations about what it will be fed later?*

  The philosophical consensus (and the engineering reality) is that the difference lives **in the module right now**, encoded as a **disposition**.
  *   It is not merely our expectation. The weights in the neural net constitute a structural state that *causally necessitates* a specific response to novel input $X$.
  *   The lookup table constitutes a structural state that *causally necessitates* a different response to novel input $X$.
  *   Even if $X$ never arrives, the *conditional fact* ("If $X$ arrived, output would be $Y$") is true of the ML model and false of the Lookup Table.

  **The Boundary:**
  Case 1 and Case 2 are separated by **Counterfactual Robustness**.
  *   **Case 1:** If you feed *any* valid input (per contract) to Implementation A or B, you get the same result. They share the same dispositions.
  *   **Case 2:** If you feed an *invalid* or *unseen* input (per training data) to Model or Table, you get different results. They have different dispositions.
  *   **Philosophical Label:** This is not Multiple Realizability. This is **Underdetermination of Function by Data**. You cannot identify the function solely by observing finite outputs; you must know the algorithm (the intension).

  ### 3. Case Three: Semantic Externalism (The Context Shift)
  **The Concept:**
  In Case 3, the code is identical, the bytes are identical, but the *meaning* has changed because the upstream parser changed.
  This maps to **Semantic Externalism** (famously argued by Hilary Putnam and Tyler Burge).

  *   **Internalism:** Meaning is determined entirely by what is "in the head" (or in the module).
  *   **Externalism:** Meaning is determined partly by the environment and the causal history of the system.

  **Why it fits Case 3:**
  Putnam's "Twin Earth" thought experiment is your Case 3 exactly.
  *   *Scenario:* On Earth, "water" refers to H₂O. On Twin Earth, everything looks the same, but "water" refers to XYZ.
  *   *Result:* A person on Earth and their identical twin on Twin Earth are physically identical, but when they think "water," they are thinking about different substances. Their mental content differs because their *environment* differs.

  In your module:
  *   The bytes `0x01` meant "User ID" in Context A.
  *   The bytes `0x01` mean "Session Token" in Context B.
  *   The module processes `0x01` identically, but the *computation* (semantically described) has changed from `process_user_id` to `process_session_token`.

  **The Boundary:**
  Case 3 is distinct from Case 1 and 2 because it is not about the *mechanism* (Case 1) or the *capacity* (Case 2), but about the **Content**.
  *   **Case 1 & 2** are about the relationship between structure and behavior.
  *   **Case 3** is about the relationship between the system and the world it is embedded in.

  ---

  ### Summary of Boundaries

  To answer your specific questions on where the lines fall:

  | Feature | Case 1 (Refactor) | Case 2 (ML vs. Map) | Case 3 (Context Shift) |
  | :--- | :--- | :--- | :--- |
  | **Physical State** | Different | Different | Identical |
  | **Actual Behavior** | Identical | Identical (so far) | Identical (on bytes) |
  | **Counterfactual Behavior** | Identical (on domain) | **Different** (on novelty) | Identical (on bytes) |
  | **Semantic Content** | Identical | Identical | **Different** |
  | **Philosophical Concept** | **Multiple Realizability** | **Dispositional Properties** | **Semantic Externalism** |

  #### 1. Is Case 2 the same phenomenon as Multiple Realizability?
  **No.** It is a failure condition for MR.
  MR claims that Structure A and Structure B realize the *same* function. In Case 2, Structure A (ML) and Structure B (Map) realize *different* functions that happen to intersect on observed data.
  *   **The Line:** MR applies when the *capacity* is invariant across implementations. Case 2 is when the capacity diverges on untested inputs. The distinction relies on **Intension** (the rule) rather than **Extension** (the observed data).

  #### 2. Is Case 3 the same phenomenon?
  **No.** Case 3 is orthogonal to 1 and 2.
  Cases 1 and 2 are about the internal relationship between code and behavior. Case 3 is about the external relationship between the system and its environment.
  *   **The Line:** Case 3 shows that "what a module does" cannot be defined solely by its internal code or even its input/output mapping; it depends on what those inputs *signify* in the wider system. This is the difference between **Syntax** (manipulating bytes) and **Semantics** (processing meaning).

  #### 3. How to settle Case 2 principledy?
  You asked if the difference lives in the module *now* or in *expectations*.
  It lives in the module **now**, as a **structural disposition**.
  *   In metaphysics, a disposition is a real property. Salt is soluble *now*, even if sitting in a dry shaker. Its solubility is a fact about its molecular structure.
  *   Similarly, your ML model possesses the property of "generalization" *now*, encoded in its weights. The Lookup Table possesses the property of "memorization" *now*, encoded in its keys.
  *   We do not need to wait for future inputs to verify the difference; we can inspect the structure (weights vs. map) to determine the counterfactual truths. The difference is **categorical** (based on current structure), which grounds the **dispositional** difference (based on future behavior).

  ### The "Engineer's Translation" of the Philosophy
  If you need to bring this back to the reading group:

  1.  **Multiple Realizability** validates Case 1: We can talk about "The Sorting Service" as a real thing, distinct from the Java or Go code implementing it.
  2.  **Dispositional Properties** validates Case 2: We can distinguish "Learning" from "Memorizing" even without new data, because the *structure* dictates different *counterfactuals*. A mind (or model) is defined by what it *would* do, not just what it *did*.
  3.  **Semantic Externalism** validates Case 3: You cannot understand a mind (or module) in isolation. Its content depends on its causal history and environment. A brain in a vat (or a module in a test harness) might be processing different "thoughts" than one embedded in the real world, even if the electrical signals are identical.

  Your colleague was half-right: MR covers Case 1. But the "rest" you sensed is the distinction between **Extension** (what happened), **Intension** (what would happen), and **Content** (what it means).
