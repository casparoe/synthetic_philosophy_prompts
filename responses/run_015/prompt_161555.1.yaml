          2.  *Generalization vs. Memorization:* ML model vs. Hardcoded lookup table. Agree on all *actual* inputs so far. Everyone agrees: "Not the same thing" (one learned, one memorized). The distinction relies on *counterfactual* performance (inputs not yet seen).
          3.  *Context Shift:* Same code, same bytes, but upstream parser changed semantics. Everyone agrees: "Not doing the same thing" (semantics changed despite syntax/behavior on bytes staying same).
      *   **The Core Question:** Is there a philosophical concept that distinguishes Case 2 from Case 1? Is Case 3 the same phenomenon or different? How do we settle Case 2 principledly (internal state vs. future expectations)?
      *   **Constraint:** "Don't just hand me a label — I want the boundaries." Needs depth, nuance, and mapping of engineering examples to philosophical concepts.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Multiple Realizability (MR):** This is the starting point. MR says a higher-level property (like "pain" or "adding numbers") can be instantiated by diverse lower-level physical states (neurons, silicon, gears).
          *   *Fit for Case 1:* Perfect fit. The "function" (bucket assignment) is realized by different algorithms.
          *   *Fit for Case 2:* Tricky. Superficially, both map Input -> Output. But intuitively, they aren't the *same function*. Why? Because functions in math are defined over the *domain*, not just observed points.
          *   *Fit for Case 3:* MR usually assumes the *inputs* mean the same thing. If the semantics of the input change, is it the same function?
      *   **Functionalism:** The broader theory MR supports. Mental states are defined by their causal role (inputs -> internal states -> outputs).
      *   **Counterfactuals/Dispositional Properties:** This is key for Case 2. A disposition isn't just what *did* happen, but what *would* happen. (e.g., "Fragile" means it *would* break if struck, not just that it broke when struck).
      *   **Intentionality/Semantics:** This is key for Case 3. Meaning depends on context/history/causal connection to the world, not just internal syntax.
      *   **Computationalism/Algorithmic Identity:** Are two processes the same if they compute the same mathematical function, or do they need to follow the same *algorithm*?

  3.  **Map Cases to Concepts:**

      *   **Case 1 (Sort vs. Hash vs. Table):**
          *   *Philosophical Label:* **Multiple Realizability** (classic).
          *   *Why:* The functional role (sorting/bucketing) is preserved across distinct physical/algorithmic structures.
          *   *Boundary:* We care about the *input-output mapping* over the *defined domain*.

      *   **Case 2 (ML vs. Lookup Table):**
          *   *Philosophical Label:* **Dispositional Properties / Counterfactual Conditionals.** Also touches on **Underdetermination of Theory by Data**.
          *   *Why:* The distinction isn't in the *actual* history (extension), but in the *potential* behavior (intension). The ML model has a disposition to generalize; the Lookup Table has a disposition to fail on out-of-distribution data.
          *   *Relation to MR:* MR usually assumes the *capacity* is the same. Here, the capacity is in question. It's not just "different realization of the same function," it's "different functions that happen to overlap on observed data."
          *   *Key Distinction:* **Extension vs. Intension.** Extension = actual pairs seen. Intension = the rule defining the pairs.

      *   **Case 3 (Same Code, Changed Semantics):**
          *   *Philosophical Label:* **Externalism / Content Internalism vs. Externalism.** (Putnam's Twin Earth is the classic thought experiment).
          *   *Why:* The internal state is identical, but the *meaning* (semantics) of the input changed because the environment/upstream changed.
          *   *Relation to Case 2:* Case 2 is about *future behavior* (dispositions). Case 3 is about *current meaning* derived from external context.

  4.  **Synthesize the Argument:**

      *   *Introduction:* Acknowledge the engineer's intuition is spot-on. MR explains Case 1 well but fails to capture the nuance of 2 and 3.
      *   *Section 1: Case 1 & Multiple Realizability.* Confirm this is the textbook definition. The "function" is the abstract specification. The "realization" is the code.
      *   *Section 2: Case 2 & The Counterfactual Gap.* This is the meat of the question.
          *   Concept: **Dispositional Properties**.
