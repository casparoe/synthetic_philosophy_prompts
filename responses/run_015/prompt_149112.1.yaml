  A defender of (A) might argue that a context-sensitive agent predicts everything (C) predicts, absorbing the dynamic view into the agentic view. This is a genuine obstacle: (A) and (C) are behaviorally inseparable if (A) allows agent state to be fully context-embedded. The case separates (S) from the rest, but (A) and (C) remain distinct only in their ontology, not their behavioral predictions. This suggests the agent/no-principal dispute may be metaphysical rather than empirical under these constraints. The obstacle is that 'agent' can be defined flexibly enough to encompass trajectory-dependent behavior without conceding the 'no-principal' claim. Consequently, the case adjudicates S vs. (A/C), but leaves A vs. C unresolved by manipulation alone.
