  ### BORDERLINE JUDGEMENT CALLS FOR SECOND MARKER

  1.  **Paragraph 2 (Distinctions):** A stricter reader will penalize heavily for collapsing redundancy and imperceptibility, as this is a core learning outcome of the module. A more charitable reader might accept it as a time-saving simplification given the 40-minute constraint. *Recommendation:* Stick to the rubric requirement ("success in separating"); the candidate explicitly refused to do this.
  2.  **Paragraph 4 (Case C Analysis):** The candidate claims the expected-difference reply fails in C. Some literature argues it succeeds (because tiny harms sum up). The candidate's view is defensible *if* the arithmetic is right. The arithmetic here is slightly muddled (treating continuous as threshold). *Recommendation:* Penalize under C2 for the conceptual conflation, but award credit for identifying that C is structurally different from L.
  3.  **Paragraph 5 vs. 6 (Consistency):** Is the candidate changing their mind, or did they forget what they wrote in [4] by the time they wrote [6]? It reads like a loss of control over the argument. *Recommendation:* Treat as a dialectical failure under C3. The conclusion does not follow from the premises established in the body.
  4.  **Case E Coverage:** The candidate calculates L in detail, discusses C in detail, but only mentions E in the intro and conclusion. The prompt says "use all three cases." *Recommendation:* This is a partial omission. I have awarded credit in C2 for the correct principle stated in [6], but a stricter reader might deduct more for lack of working/arithmetic for E compared to L.

  ### FEEDBACK ON QUESTION/RUBRIC

  The question and rubric are sound. However, **Criterion 2** asks whether the reply works "equally well in each." This presupposes that there is a clear answer to whether it works in Case C. Given the philosophical literature is divided on whether continuous harms should be modelled via expected utility or proportional share, this invites the exact confusion seen in Paragraph 4. You might consider clarifying in future iterations whether students should treat continuous harm as having a probability of 1 (actual difference) or model it via potential tipping points (threshold difference), as this changes the arithmetic significantly. As it stands, the prompt's instruction ("damages... are continuous") pushes toward probability = 1, which makes the "expected difference" terminology slightly awkward (as it collapses into "actual difference").
