      *   *Option B: Moral Bet.* "Advanced civilizations are benevolent." This is the "Progressivist" view. Technology correlates with ethics. (Sagan, Benford's counter-arguments).
      *   *Option C: Probabilistic/Utility Bet.* "The benefit of contact outweighs the risk." This is a Pascal's Wager style argument. Even if risk exists, the reward (knowledge, salvation, alliance) is infinite, so $EV > 0$.
