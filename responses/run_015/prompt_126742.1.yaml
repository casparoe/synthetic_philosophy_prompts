answer: |-
  **MEMORANDUM**

  **TO:** National Heritage Authority, Preservation Officers
  **FROM:** Dr. [Name], Consultant on Metaphysics of Identity
  **SUBJECT:** Protocol C.I.P. (Continuity and Identity Procedure) for Protected-Status Determination
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope
  Preservation Officers frequently encounter structures where the "originality" is not a matter of fact, but a matter of degree. This creates a *Sorites* problem: if replacing one brick does not destroy a building's status, replacing all bricks should not either—yet a fully rebuilt building is clearly not the original.

  The law requires a binary decision (Protected / Not Protected). Reality often offers a spectrum. This protocol does not solve the philosophical paradox; it manages it. It forces a decision where philosophy suggests ambiguity, while explicitly flagging cases where the ambiguity is too great for an administrative officer to resolve alone.

  **Instruction:** Do not cite philosophical theories in your public rulings. Use the "Officer's Rationale" provided in each step to justify the decision based on evidence, not metaphysics.

  ---

  ### 2. The Continuity and Identity Protocol (C.I.P.)

  Proceed through the following four nodes in order. A failure at Node 1 or Node 3 results in an immediate "Not Protected" determination unless a Referral Condition is met.

  #### Node 1: Material Continuity (The Tolerance Threshold)
  **Question:** What percentage of the structure's primary load-bearing material dates from the period of significance?
  **Sufficient Answer:** A calculated percentage based on mass/volume, not count.
  **Decision Rule:**
  *   **> 50% Original Material:** Proceed to Node 2.
  *   **< 10% Original Material:** Proceed to Node 3 (High Risk of Failure).
  *   **10% – 50% Original Material:** **REFERRAL NODE.** (See Section 4).

  > **Philosophical Commitment (Officer's Rationale):** *Epistemicism.* We are treating "originality" as having a sharp boundary (50%) even if we cannot naturally perceive it. We impose this cut-off to prevent the "slippery slope" where 0% material counts as original. This rejects the *tolerance principle* (that small changes never matter) by acknowledging that accumulated small changes *do* matter.

  #### Node 2: Functional and Design Integrity
  **Question:** Does the structure retain the specific design geometry and functional capacity of the original, excluding modern code upgrades?
  **Sufficient Answer:** Comparison of current blueprints against archival records.
  **Decision Rule:**
  *   **Substantial Deviation:** (e.g., widened deck, changed arch profile) → **Not Protected.**
  *   **Faithful Replication:** → Proceed to Node 3.

  > **Philosophical Commitment:** *Sortal Relativity.* We acknowledge that a "bridge" is defined by its function and form, not just its matter. However, form without matter is a copy. This step ensures the *type* of object remains constant.

  #### Node 3: Spatio-Temporal Continuity (The Interruption Check)
  **Question:** Was there a point in time where the structure ceased to exist as a functional unit or was physically severed from its foundation?
  **Sufficient Answer:** Historical records confirming demolition, total collapse, or removal.
  **Decision Rule:**
  *   **Total Interruption:** (e.g., total destruction followed by reconstruction) → **Not Protected.** (See Exception below).
  *   **Continuous Existence:** → Proceed to Node 4.
  *   **Exception:** If Node 1 was >50% Material, a Total Interruption does not automatically disqualify the structure.

  > **Philosophical Commitment:** *Spatio-Temporal Continuity Theory.* This node prioritizes the history of the *object* over the history of the *site*. A rebuilt structure is a new object occupying the same space. This creates a conflict with *Four-Dimensionalism* (which might view the timeline as a single "worm" despite gaps). We reject Four-Dimensionalism here for legal clarity.

  #### Node 4: Community Identification (The Naming Test)
  **Question:** Has the local community and official record consistently identified this specific structure by the same name and identity throughout the period of alteration?
  **Sufficient Answer:** Continuous usage in maps, titles, and local vernacular.
  **Decision Rule:**
  *   **Consistent Identification:** → **Protected.**
  *   **Discontinuous/Changed Identification:** → **Not Protected.**

  > **Philosophical Commitment:** *Externalism/Social Constructivism.* We acknowledge that identity is partly conferred by social practice. If the community treats it as the same, the law may defer to that intuition to resolve borderline vagueness.

  ---

  ### 3. Application to Test Structures

  #### Case (i): The Wooden Bridge (60% Plank Replacement)
  *   **Node 1 (Material):** 40% Original Material (60% replaced). **Result:** Falls into **REFERRAL NODE (10-50%)**.
      *   *Officer Action:* Cannot decide alone. Must refer to Board.
      *   *Philosophical Note:* This is the classic *Sorites* penumbra. Epistemicism says there *is* a fact (it is either original or not), but we cannot know it. Supervaluationism says it is neither true nor false. The procedure acknowledges this uncertainty by removing officer discretion.
  *   **Hypothetical Ruling (If Officer forced decision):** If the officer arbitrarily sets the line at 50%, this bridge is **Not Protected**.
      *   *Authority Reaction:* Dislike. The structure is mostly intact and functional.

  #### Case (ii): The Fire Rebuild (Destroyed, Rebuilt from Blueprints)
  *   **Node 1 (Material):** Mixed. Salvaged timber + modern reinforcement. Likely <50% original mass due to reinforcement requirements. **Result:** Proceed to Node 3.
  *   **Node 3 (Continuity):** Total Interruption (Destroyed by fire). **Result:** **Not Protected.**
      *   *Exception Check:* Did it have >50% material? No.
      *   *Verdict:* **Not Protected.**
      *   *Philosophical Commitment:* *Mereological Essentialism.* The specific arrangement of matter was destroyed. The new bridge is a *qualitative duplicate*, not a *numerical identity*.
      *   *Authority Reaction:* **Strong Dislike.** Heritage authorities often protect rebuilt landmarks (e.g., Warsaw Old Town, Dresden Frauenkirche) based on cultural value. This procedure prioritizes ontological identity over cultural memory.

  #### Case (iii): The Continuously Maintained Bridge (No plank >50 years old)
  *   **Node 1 (Material):** 0% Original Material (No plank older than 50 years; structure is 200 years old). **Result:** **Not Protected** (Automatic failure at Node 1 <10%).
      *   *Wait, Check Node 3:* Continuous Existence? Yes.
      *   *Check Node 4:* Consistent Identification? Yes.
      *   *Conflict:* Node 1 says "No." Node 3 & 4 say "Yes."
      *   *Protocol Priority:* Node 1 is the primary gatekeeper for "Original" designation.
      *   *Verdict:* **Not Protected.**
      *   *Philosophical Commitment:* *Material Constitution.* We are ruling that an object cannot survive the total replacement of its parts over time, rejecting the *Ship of Theseus* intuition that continuity of form/history suffices.
      *   *Authority Reaction:* **Strong Dislike.** This is the "Ise Shrine" paradox. Authorities typically protect continuous maintenance as the highest form of preservation. This procedure rules that a building with *no* original fabric is a replica, regardless of continuity.

  ---

  ### 4. Unavoidable Judgment Nodes and Referral Classes

  There are specific points in this procedure where your judgment cannot be grounded in fact because the philosophical theories themselves disagree. You must not attempt to resolve these alone.

  **The Referral Class (The "Penumbra"):**
  Any structure falling into the **10% – 50% Original Material** range (Node 1) OR structures that pass Node 3 (Continuous) but fail Node 1 (0% Material) must be referred to the **Values-Based Review Board**.

  **Why Referral is Mandatory:**
  1.  **Failure of Bivalence:** In these cases, the statement "This is the original bridge" is neither clearly true nor clearly false. The law requires a binary outcome, but the ontology provides a truth-value gap.
  2.  **Competing Theories:**
      *   *Epistemic View:* The Board must decide where the hidden sharp line lies (Policy Choice).
      *   *Supervaluationist View:* The Board must decide which "precisification" of 'original' serves the public interest (Value Choice).
      *   *Ontic Vagueness:* The Board must accept that the object itself is indeterminate and legislate a status onto it (Legal Fiction).

  **Instruction for Referral:**
  When referring a case, do not write "It is vague." Write: *"Material continuity is insufficient for automatic designation, but spatio-temporal continuity is intact. Determination requires policy weighing of Material vs. Historical Identity."*

  ---

  ### 5. Conclusion: Limits of the Procedure

  This procedure successfully filters clear cases (Brand new replicas vs. Untouched monuments). However, it produces verdicts the Authority may find politically untenable, specifically in **Case (ii)** and **Case (iii)**.

  *   **Case (ii)** fails because it is ontologically a copy, despite being culturally significant.
  *   **Case (iii)** fails because it is materially new, despite being historically continuous.

  **Final Directive:**
  You are authorized to use this checklist to deny protection in clear cases of replication. However, any case where **Material Continuity (Node 1)** conflicts with **Spatio-Temporal Continuity (Node 3)** represents a clash between *Constitution Theory* (what it is made of) and *Persistence Theory* (how it endures).

  **Do not adjudicate this clash.** These are not factual disputes; they are metaphysical commitments disguised as preservation standards. Refer all such conflicts to the Review Board. Your role is to identify the boundary conditions, not to legislate the metaphysics of identity.

  **Signed,**
  *Dr. [Name]*
  *Consultant on Metaphysics of Identity*
