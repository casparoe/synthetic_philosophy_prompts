  - `kind` — exactly one of: factual, logical, hidden-assumption, misreads-the-dialectic, framing, overgeneralisation, anticipation, presentation
  - `severity` — exactly one of: fatal, major, minor, nitpick
  - `comment` — one to three sentences
  - `strongest_repair` — one sentence, or the word `none`
  - `rank` — an integer, 1 being the issue I should deal with first
  - `answerable_by_me` — one of: yes, yes-with-reading, no

