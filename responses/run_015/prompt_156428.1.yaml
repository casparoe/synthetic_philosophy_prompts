answer: |-
  There is no single, canonical Latin name (like *ad hominem* or *petitio principii*) for this specific maneuver in the standard taxonomy of fallacies. However, your observation is precise and identifies a well-recognized problem in formal epistemology, game theory, and the philosophy of science.

  In the literature surrounding **Aumann's Agreement Theorem** and the **Common Prior Assumption (CPA)**, this is often discussed as the **unfalsifiability of the Common Prior**. In the philosophy of science, it is a specific instance of a **Conventionalist Stratagem** (Popper) or an **Ad Hoc Rescue** within a **Duhem-Quine** framework.

  Because you require a precise handle for this specific dialectical pattern—distinct from general ad hoc hypothesizing—I propose the term:

  ### **The Epistemic Residual Fallacy**

  *(Alternative descriptive label: **Post-Hoc Prior Positing**)*

  Below is the rigorous definition, its theoretical lineage, distinctions from nearby fallacies, and the boundary conditions separating legitimate inference from abusive insulation.

  ---

  ### 1. Rigorous Definition

  **The Epistemic Residual Fallacy** occurs when an agent defends a normative convergence principle (e.g., "Rational agents with shared evidence must converge") against a counterexample (persistent disagreement) by positing a difference in unobservable epistemic parameters (e.g., priors, likelihood weights, risk tolerances), where:

  1.  **The Parameter is Retrospective:** The existence and content of the parameter difference are inferred *solely* from the disagreement itself, not from independent historical or psychological evidence.
  2.  **The Parameter is Residual:** The parameter acts as a "catch-all" variable that absorbs the variance between the normative prediction and the observed outcome.
  3.  **The Explanation is Tautological:** The argument reduces to: "They disagree; therefore, their priors must differ; therefore, the convergence norm holds." The "explanation" adds no predictive power beyond restating the observation.

  **Logical Form:**
  *   **Norm:** $E + P \rightarrow B$ (Evidence + Prior $\rightarrow$ Belief)
  *   **Observation:** $E_1 = E_2$ and $B_1 \neq B_2$
  *   **Fallacious Move:** Assert $P_1 \neq P_2$ *because* $B_1 \neq B_2$, without independent access to $P$.
  *   **Result:** The Norm is insulated from falsification because $P$ is defined entirely by the residual $(B - E)$.

  ---

  ### 2. Theoretical Lineage and Distinctions

  This maneuver is a specialized subset of broader logical errors. Distinguishing it precisely clarifies its boundaries.

  #### **vs. Ordinary Ad Hoc Hypothesizing**
  *   **Similarity:** Both introduce a new assumption solely to save a theory from refutation.
  *   **Distinction:** Ordinary ad hoc hypotheses usually posit a *new causal mechanism* (e.g., "There is an invisible planet affecting the orbit"). The Epistemic Residual Fallacy posits a *difference in a hidden parameter* of the agents themselves. Crucially, standard ad hoc hypotheses can sometimes be tested later (we look for the planet). The Epistemic Residual Fallacy is often structurally immune to testing because the "prior" is defined as whatever is necessary to make the math work, rendering it metaphysically inaccessible.

  #### **vs. The Motte-and-Bailey Doctrine**
  *   **Similarity:** Both involve a defensive retreat to a safer position when challenged.
  *   **Distinction:** Motte-and-Bailey involves shifting between two *claims* (a controversial one and a trivial one). The Epistemic Residual Fallacy involves shifting the *parameters of the model* while keeping the claim (the convergence norm) fixed. It does not retreat from the norm; it hollows out the norm's content to make it unfalsifiable.

  #### **vs. Confirmation Bias**
  *   **Similarity:** Both protect a pre-existing belief.
  *   **Distinction:** Confirmation bias is a cognitive/psychological tendency to seek supportive evidence. The Epistemic Residual Fallacy is a *dialectical/logical* maneuver used in argumentation. One can commit this fallacy without psychological bias, simply to preserve the formal elegance of a model.

  #### **vs. The Duhem-Quine Thesis**
  *   **Relationship:** This fallacy is the *application* of the Duhem-Quine problem to Bayesian epistemology. Duhem-Quine states that you cannot test a hypothesis in isolation, only as part of a web of assumptions.
  *   **Distinction:** Duhem-Quine is a descriptive thesis about science. The Epistemic Residual Fallacy is the *normative abuse* of that thesis to prevent a specific principle (rational convergence) from ever being empirically constrained.

  ---

  ### 3. Legitimate vs. Abusive Uses

  Positing hidden priors is not *always* fallacious. Bayesian modeling often requires inferring parameters from behavior. The boundary lies in **independent constraint** and **predictive leverage**.

  #### **Legitimate Reconstruction (Sound Bayesian Inference)**
  *   **Independent Accessibility:** The differing priors can be elicited or observed in contexts *unrelated* to the current disagreement. (e.g., "Team A consistently prefers simpler models in unrelated physics problems, not just this dataset.")
  *   **Predictive Power:** The posited prior difference predicts *other* divergences. (e.g., "If Team A weights simplicity higher, they should also reject Model X in the next experiment.")
  *   **Bounded Parameter Space:** The range of possible priors is constrained by theory, preventing the parameter from stretching to fit any outcome.

  #### **Abusive Reconstruction (The Fallacy)**
  *   **Circular Definition:** The prior is defined *only* by the conclusion it supports. (e.g., "They must value tail risks more *because* they chose the precautionary policy.")
  *   **Zero Predictive Power:** The reconstruction explains the past disagreement but predicts nothing about future behavior or other domains.
  *   **Infinite Flexibility:** The "background weight" or "prior" can be adjusted to explain *any* possible divergence, making the convergence norm compatible with all possible worlds.

  ---

  ### 4. Borderline and Contrasting Cases

  To sharpen the boundary, consider these cases that sit near the edge.

  #### **Case A: The "Revealed Preference" Defense (Borderline)**
  *   *Scenario:* Economists argue that if two traders bet differently, they must have different priors. They treat the bet itself as the revelation of the prior.
  *   *Analysis:* This is standard **Revealed Preference Theory**. It is legitimate *if* treated as a modeling assumption. It becomes the Epistemic Residual Fallacy only if the economist claims this *explains* the disagreement causally while denying the possibility that one trader is simply irrational. If "different priors" becomes a synonym for "irregular behavior" to save the "rational markets" hypothesis, it crosses into the fallacy.

  #### **Case B: The "Hidden Data" Excuse (Nearby but Distinct)**
  *   *Scenario:* Two scientists disagree. Defenders say, "They must have seen different background literature."
  *   *Analysis:* This is **not** the Epistemic Residual Fallacy; this is a claim about **Evidence ($E$)**, not Priors ($P$). It is empirically falsifiable (we can check their bibliographies). The Fallacy specifically concerns unobservable *weighting functions* or *priors*, not missing data.

  #### **Case C: The "Deep Frame" Discovery (Legitimate)**
  *   *Scenario:* Two ethicists disagree on a policy. A mediator discovers one was raised in a high-conflict zone and the other in a stable democracy, leading to verifiable differences in risk assessment heuristics measured by psychological testing *prior* to the debate.
  *   *Analysis:* This is **Legitimate Prior Reconstruction**. The difference in $P$ is established independently of the disagreement $B$. The divergence is explained by an external fact, not inferred solely from the divergence itself.

  ### 5. Summary Diagnosis

  The pattern you observed is a mechanism of **theoretical immunization**. It transforms a substantive normative claim ("Rationality leads to convergence") into a definitional tautology ("Agents who don't converge differ in some rational parameter, therefore they are still rational").

  **Term:** **The Epistemic Residual Fallacy**
  **Core Error:** Treating a theoretical parameter (the prior) as an observable cause when it is being used as a residual variable to absorb error.
  **Test for Detection:** Ask, *"Can you specify the content of this prior difference without referencing the disagreement it is meant to explain?"* If the answer is no, the fallacy is in play.
