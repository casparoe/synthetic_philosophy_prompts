answer: |-
  You've stumbled onto a real problem, but your conclusion that it invalidates indirect normativity is a category error. You are conflating the **criterion of rightness** with a **decision procedure**.

  Here is the hard pushback you asked for.

  ### 1. You are attacking a strawman of "Modeling"
  Your "Mirror-Lock" argument assumes that accessing the ideal self requires *simulation* using current cognitive hardware. You write: *"since you're using your current biased cognition to build that model, you just end up locking in the same errors."*

  This is a naive view of how idealization works in robust theories (e.g., Railton, Smith, Velleman). Indirect normativity does not typically claim you must *simulate* the ideal agent using your current flawed brain. It claims that what is normative is determined by what an agent *would* desire/choose **if** they had full information and perfect rationality.

  The counterfactual is not "What does my current brain predict my future brain would do?" The counterfactual is "What is the stable fixed point of deliberation given conditions C?"

  Your "Mirror-Lock" is an **epistemic access problem**, not a **metaphysical collapse**. Just because you cannot perfectly calculate the trajectory of a projectile due to wind resistance doesn't mean Newton's laws collapse into "throw it where it feels right." It just means you have poor access to the truth. Indirect normativity is usually a theory about what *makes* something right (the truth-maker), not a heuristic for how you figure it out in real-time.

  ### 2. The "Collapse" Argument Fails
  You ask: *"doesn't that show the whole indirect approach is basically circular, or that it collapses into direct normativity once the calibration gap gets big enough?"*

  No. It collapses into **skepticism**, not direct normativity.

  *   **Direct Normativity:** "X is good because X has the property of Goodness."
  *   **Indirect Normativity:** "X is good because Ideal-You would choose X."

  If your access to Ideal-You is blocked by the Mirror-Lock, you don't suddenly revert to Direct Normativity. You just end up ignorant of what is good. The *source* of the normativity remains the ideal agent, even if you can't see them clearly.

  For the theory to collapse into direct normativity, you would have to argue that "What Ideal-You would choose" is *defined* by "What Current-You thinks Ideal-You would choose." But no serious indirect theorist defines it that way. They define it via **procedural constraints** (e.g., coherence, full information, lack of compulsion). If your current bias prevents you from seeing the procedural outcome, the outcome still exists independently of your blindness.

  ### 3. Idealization is Subtractive, Not Just Projective
  Your model assumes idealization is *adding* a "rationality layer" on top of your current biases. In many frameworks, idealization is *subtractive*.

  It's not about building a smarter version of you; it's about stripping away the specific distortions (ignorance, logical errors, emotional flooding) that constitute the "Mirror-Lock." If the theory is well-constructed, the "Ideal Self" isn't a projection of your current values; it's what remains when the cognitive bugs are fixed.

  If your current cognition is *so* broken that it cannot even conceptualize the removal of its own bugs, then you have a problem of **radical incommensurability**, not a problem specific to indirect normativity. That applies to direct normativity too (if you're too biased to see the "Good," direct normativity is useless to you).

  ### 4. Where You Are Actually Right (The Real Bite)
  You aren't wrong that this is a vulnerability, but you're aiming at the wrong target. The "Mirror-Lock" is a devastating critique of **subjective** indirect normativity used as a **guidance system**.

  If you are trying to use indirect normativity as an AI alignment strategy (e.g., Coherent Extrapolated Volition) or a personal self-help heuristic, your critique holds water: **You cannot bootstrap out of a local optimum if your optimization function is hard-coded with your current bugs.**

  If your current cognition defines the search space for the "ideal," you will never find a global optimum that lies outside your current conceptual horizon. This is the **Local Optima Trap**.

  But this doesn't prove indirect normativity is circular; it proves that **epistemic access to the ideal is non-trivial.** It forces the theory to be **externalist**. The "Ideal" must be defined by facts outside your current cognitive grasp (e.g., logical truths, objective facts about well-being) rather than just "what I would say if I thought harder."

  ### The Verdict
  Your premise is sound: Biased cognition cannot perfectly simulate unbiased cognition.
  Your conclusion is wrong: This does not make the theory circular or collapse it into direct normativity.

  It makes the theory **epistemically opaque**.

  If you want to save the "Mirror-Lock" as a killer argument, you need to pivot. Don't argue that it makes the theory false. Argue that it makes the theory **action-guidingly useless** for agents below a certain threshold of rationality. That is a much harder objection for proponents to dodge, because it concedes the metaphysics while destroying the utility.

  Don't waste time arguing that the "ought" doesn't exist. Argue that the agent can never *know* it, and therefore the "ought" implies "can" violation. That's where the actual philosophical blood is.
