  0.08

  **Decomposition of Credence**

  1.  **Negation/Uncertainty Encoding (0.85):** Specific operators like cross-outs or dotted lines are intuitively strong, though 90% consensus on "probability" is optimistic.
  2.  **Recursive Productivity (0.75):** Visual stacking works for limited depth, but occlusion and clutter impose a hard ceiling on iteration.
  3.  **Ambiguity vs. Reach (0.65):** Visual polysemy increases non-linearly with complexity, inevitably outpacing disambiguation strategies.
  4.  **Cross-Cultural Abstracts (0.65):** Spatial metaphors (up=more) are robust, but logical operators (if/then) lack universal visual correlates.
  5.  **Practical vs. Principled Failure (0.55):** The limit is likely principled (semiotic bandwidth) rather than merely a lack of design refinement.
  6.  **Semiotic Convention Independence (0.50):** *Omitted Term:* Icons are arbitrary signs requiring learned legend keys, not intrinsic truths decodable without training.

  **Combination**
  Treating these as conjunctive necessary conditions for P:
  $0.85 \times 0.75 \times 0.65 \times 0.65 \times 0.55 \times 0.50 \approx 0.079$ (rounded to **0.08**)

  **Sensitivity Analysis**
  My final number is most sensitive to **Semiotic Convention Independence**. If icons require even minimal cultural learning (shifting this probability from 0.50 to 0.20), the total credence collapses to ~0.03; if they were truly universal (shifting to 0.90), the total rises to ~0.14. This term acts as the primary bottleneck because it contradicts the core premise of "no training."

  **The Gap (0.3 vs. 0.75)**
  The single term most plausibly accounting for the gap between your skepticism (0.3) and your colleague's optimism (0.75) is **Recursive Productivity**. Your colleague likely assumes visual syntax scales infinitely like verbal grammar (allowing "not probably changed per capita"), whereas you recognize that visual density creates cognitive noise that halts recursion much earlier than linguistic recursion.

  **Decisive Experiment**
  Conduct a **Visual Telephone Game**: recruit participants from three distinct language groups with no Isotype training; show Group A a complex chart, ask them to reconstruct it from memory for Group B, and so on for five iterations. If the system is truly self-explanatory and compositional, the final chart should retain >90% semantic fidelity to the original; history suggests it will degrade into noise by iteration two.
