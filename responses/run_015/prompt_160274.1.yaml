  8.  **Refining the "Vault Case" Analysis:**
      *   This highlights the *temporal* disconnect. Reductionists care about *experience* or *risk*. Non-Reductionists care about *boundary crossing*.
      *   If the seal is unbreakable, Reductionists say "No harm." Non-Reductionists say "Trespass occurred."

  9.  **Final Polish:**
      *   Ensure I don't give a verdict.
      *   Ensure I don't cite specific authors (no reading list).
      *   Keep it focused on the *shape* of the argument.
      *   Address the "Bedrock" worry. It is bedrock, but bedrock can be mapped.

  10. **Self-Correction during drafting:** I initially thought about suggesting "Control" theories. But Control theories often collapse back into Reductionism (Control over what? Autonomy?). Better to suggest focusing on the *Second-Personal* nature of the claim. The Non-Reductionist is saying "You owe me this," not "I am hurt." That shifts the ground from harm to obligation. This addresses the "Idle Observer" directly.

  11. **Final Structure:**
      *   Diagnosis: The Category Mismatch (State vs. Act).
      *   Case Analysis: Mirror (Flow vs. Access), Vault (Risk vs. Trespass).
      *   Disagreement Type: Framework Incommensurability (not just verbal).
      *   Path to Progress: Shift from Harm to Standing/Obligation.

