      *   *Section 3: Type of Disagreement.* It's a "Framework Incommensurability." Not purely verbal, not purely substantive. It's about the *unit of moral analysis*.
      *   *Section 4: Path to Progress.* Don't try to prove one side right. Try to dissolve the dichotomy. Suggest focusing on *Control* vs. *Access*. Suggest the "Second-Personal" standpoint (Darwall) might bridge the gap (it's about standing, not just harm).

  7.  **Refining the "Mirror Case" Analysis:**
      *   Reductionists often use "Contextual Integrity" (Nissenbaum) to solve this. Information flows appropriately in A, not in B. But strict Reductionists (Thomson-style) struggle. I should mention that strict Reductionists have to argue that the *inference* threatens future autonomy, whereas the *telling* does not.
