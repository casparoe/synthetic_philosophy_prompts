answer: |-
  # The Responsibility Architecture Survey

  **Instructions for the TA:** This is not a test with right answers. It is a mapping tool. Read the scenarios aloud. Ask students to raise hands or move to corners of the room based on their gut reaction. Do not define philosophical terms (e.g., "determinism," "libertarianism"). Let the cases do the work.

  **Total Questions:** 8 Core Nodes (Max depth 9 for specific mechanism splits).
  **Target Leaves:** 10 Positions.

  ---

  ### The Decision Tree

  **Q1: The Coherence Check (Illusionism)**
  *Scenario:* Imagine we discover that "choice" is just a story the brain tells itself after the body has already moved. There is no "pilot" inside, only chemical chains.
  *Question:* If that were true, is "moral responsibility" a real feature of the universe (like mass), or is it a useful fiction we should eventually discard (like 'phlogiston')?
  *   **A: It's a fiction/mistake.** → **Leaf: Illusionist/Eliminativist.** (Stop).
  *   **B: It's real (or at least necessary).** → Go to Q2.

  **Q2: The Swap (Worth Wanting: Indeterminism)**
  *Scenario:* You have a decision-making capacity that is 100% reliable and fully under your control, but it is deterministic. A scientist offers you a swap: a new capacity where choices are *not* determined by the past, but the outcome is slightly less under your control (sometimes you just "pop" into a decision).
  *Question:* To make your choices truly *yours*, do you take the swap?
  *   **A: Yes, I want the break in the chain.** → **Libertarian Path** (Go to Q3).
  *   **B: No, I prefer the control I have.** → **Compatibilist/Hard Path** (Go to Q5).

  **Q3: The Mechanism (Libertarian Split)**
  *Scenario:* You took the swap. Your choices are now undetermined.
  *Question:* What makes the choice *yours*? Is it that a random neural event happened (which you then own), or is it that *You* (as a distinct self) directly caused the event without prior causes?
  *   **A: It's a random event I identify with.** → **Leaf: Event-Causal Libertarian.**
  *   **B: It's Me, as a substance/agent, causing it.** → **Leaf: Agent-Causal Libertarian.**

  **Q4: The Indeterminism Rescue (Hard Incompatibilist Check)**
  *(Note: Only asked if they answered "No" to Q2 but seem worried about determinism. To save time, ask everyone on the Compatibilist/Hard Path Q4 instead of Q5 if they look uneasy.)*
  *Scenario:* Suppose the world *is* deterministic. Now suppose it *isn't*.
  *Question:* If the world turned out to be indeterministic (random), would that *fix* the problem of responsibility, or is responsibility impossible either way?
  *   **A: It wouldn't fix it. Responsibility is impossible either way.** → **Leaf: Hard Incompatibilist.** (Stop).
  *   **B: It would fix it (or Determinism is the only problem).** → Go to Q5.

  **Q5: The Designer (Worth Wanting: Sourcehood)**
  *Scenario:* A neuroengineer secretly shaped a person's desires over 20 years. This person now reliably does what the engineer wanted. However, the person feels free, responds to reasons, isn't coerced, and endorses these desires on reflection.
  *Question:* Is this person morally responsible for their actions?
  *   **A: Yes. Their current machinery is what matters.** → **Structural Compatibilist Path** (Go to Q6).
  *   **B: No. Their history is tainted.** → **Leaf: Hard Determinist** (If they believe world is determined) OR **Source Incompatibilist** (Merge with Hard Incomp for this seminar's purposes, or flag as "Skeptical"). *For this tree, we will route them to Q7 to distinguish Hard Det from Skeptic.*

  **Q6: The "Could Have Done Otherwise" Test (Semi-Compatibilism)**
  *Scenario:* The person from the Designer case couldn't have actually done otherwise (the engineer ensured it), but they acted on their own reasons.
  *Question:* To be morally responsible, is it *strictly necessary* that they could have physically done otherwise?
  *   **A: No. Guidance control is enough.** → **Leaf: Semi-Compatibilist.**
  *   **B: Yes. They need real alternatives.** → **Standard Compatibilist Path** (Go to Q7).

  **Q7: The Satisfaction Check (Revisionism vs. Pessimism)**
  *Scenario:* We establish that you are responsible in the legal/practical sense.
  *Question:* Is this the *deep, ultimate* kind of responsibility you thought you had when you were 15? Or is it a watered-down version we have to settle for?
  *   **A: It's watered-down, but it's all we can have and it's enough.** → **Leaf: Revisionist.**
  *   **B: It's watered-down, and it's tragic/unjust that we don't have the real kind.** → **Leaf: Pessimist.**
  *   **C: Yes, this *is* the real kind.** → **Realist Path** (Go to Q8).

  **Q8: The Structure of Responsibility (Compatibilist Split)**
  *Scenario:* Back to the Designer case (who is responsible). Why?
  *Question:* What makes them responsible? Is it that their desires "mesh" with their higher values (they want to want this), OR is it that they are sensitive to reasons (they would have stopped if there was a good reason to)?
  *   **A: It's about the Mesh/Identification.** → **Leaf: Hierarchical/Mesh Compatibilist.**
  *   **B: It's about Reasons-Responsiveness.** → **Leaf: Reasons-Responsive Compatibilist.**

  **Q9: The Fact of Determinism (Hard Determinist Final Check)**
  *(Asked only to those who said "No" to Designer Case in Q5).*
  *Question:* Do you believe our actual universe is deterministic?
  *   **A: Yes.** → **Leaf: Hard Determinist.**
  *   **B: No/Unsure (but still think responsibility is impossible).** → **Leaf: Hard Incompatibilist.** (Re-confirming Q4).

  ---

  ### Logical Space & Empty Cells

  **Independence of Nodes:**
  *   **Q1 (Coherence)** is logically prior to all others. If responsibility is a fiction, the mechanics don't matter.
  *   **Q2 (Swap)** is independent of Q5 (Designer). One tests the *value of indeterminism*, the other tests the *value of history*. You can want indeterminism (Libertarian) but still think the Designer's subject is responsible (if the engineer didn't determine the choice). However, most Libertarians will say "No" to the Designer case.
  *   **Q6 (AP)** is independent of Q2. You can want indeterminism (Q2=Yes) but think AP isn't required for responsibility (Semi-Compatibilist Libertarians exist, though rare).

  **Empty/Impossible Cells:**
  1.  **Q2=Yes (Want Indet) + Q4=No (Indet doesn't help):** *Incoherent.* If you value the swap enough to take it (Q2), you presumably think it improves your status. If you think it doesn't help responsibility (Q4), taking the swap is irrational unless you value "randomness" for its own sake. *Why Empty:* Pragmatic incoherence.
  2.  **Q5=Yes (Designer is Responsible) + Q7=B (It's tragic we lack ultimate resp):** *Unattractive/Rare.* This is the "Strawsonian Pessimist Compatibilist." You think the manipulated agent is responsible, but you're sad that *you* might be manipulated by nature. It's a stable position but psychologically rare for first-years. *Why Empty:* Merely unexplored/unstable.
  3.  **Q1=B (Real) + Q7=A (Revisionist):** *Tension.* If you say responsibility is "real" (Q1) but then admit it's not the "kind we thought we had" (Q7), you border on Illusionism. *Why Empty:* Conceptual slippage.

  ---

  ### Leaves The Tree Cannot Truly Separate

  1.  **Semi-Compatibilism vs. Reasons-Responsive Compatibilism:**
      *   *Why:* Fischer (the main proponent) holds *both* views. Semi-compatibilism is the claim that determinism is compatible with responsibility *regardless* of AP. Reasons-responsiveness is the *mechanism* explaining that responsibility. A student can easily hold both.
      *   *Flag:* If a student lands on Semi-Comp, they likely are also Reasons-Responsive. Treat these as overlapping circles, not distinct boxes.

  2.  **Revisionism vs. Pessimism:**
      *   *Why:* Both agree we lack "Ultimate Responsibility." The split is purely emotional/normative (Is this "enough"? vs. "Is this tragic?"). A student's mood on the day of the seminar might shift them between these leaves.
      *   *Flag:* These are temperamental siblings. Distinguish them by asking: "Would you abolish blame practices knowing this?" (Revisionist: No. Pessimist: Maybe/Yes).

  3.  **Hard Determinism vs. Hard Incompatibilism:**
      *   *Why:* This depends entirely on the student's belief about physics (Q9), not their concept of responsibility. If they are wrong about physics, they move leaves without changing their mind about free will.
      *   *Flag:* Warn students that this leaf depends on empirical fact, not philosophical intuition.

  ---

  ### Meta-Analysis: The Messiest Node

  **The Node:** **Q2 (The Swap).**

  **Expected Messiness:** High. Expect 40-50% of students to answer inconsistently or ask clarifying questions that reveal they don't understand the trade-off.

  **Why:**
  1.  **The "Freedom = Randomness" Misconception:** Many novices intuitively believe that *determinism* is the enemy of control. When you offer them "Indeterminism" (Q2), they hear "Freedom." When you add "You control it less," they hear "Less Freedom." They get stuck because their intuition says Indeterminism *adds* control, while the prompt says it *reduces* it.
  2.  **The "Worth Wanting" Tension:** This node forces them to choose between *Control* (Compatibilist value) and *Origination* (Libertarian value). Most students want *both*. Being forced to trade one for the other causes cognitive dissonance.

  **Does this track a real fault line?**
  **Yes.** This is the **"Intelligibility Objection"** in the literature (famously articulated by P.F. Strawson and Galen Strawson). Libertarians argue we need indeterminism to be the "ultimate source." Compatibilists argue indeterminism just adds luck, which *reduces* control.
  *   If the student says **"Take the Swap,"** they are prioritizing *Origination* over *Control* (Libertarian intuition).
  *   If the student says **"Keep the Control,"** they are prioritizing *Agency* over *Metaphysical Openness* (Compatibilist intuition).
  *   If the student says **"I don't understand how randomness helps,"** they have just stumbled onto the central argument against Libertarianism.

  **TA Advice:** When the room splits on Q2, pause. Ask a "Swap" voter: "If the choice is random, how is it *yours*?" Ask a "Keep" voter: "If the choice is determined by the past, how is it *yours*?" This single question generates more productive debate than any lecture on "alternative possibilities."
