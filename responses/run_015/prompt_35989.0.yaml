answer: |-
  ## Part 1: The Theory (Translated for a Mathematician)

  You have a math background, so think of this as a variance partitioning problem. In evolutionary biology, the "Levels of Selection" debate asks: *Where does the heritable variance live?*

  **In Cages (The Old Model):**
  A hen's phenotype ($P$) is determined by her Direct Genetic Effects ($DGE$) + Environment ($E$).
  $$P = DGE + E$$
  When you pick the top individuals, you are capturing the $DGE$. Since hens don't interact, one hen's genes do not affect another hen's output. The covariance between neighbors is zero.

  **In Pens (The New Model):**
  A hen's phenotype is now determined by her $DGE$, her Indirect Genetic Effects ($IGE$) on others, and the $IGE$ of her neighbors on her.
  $$P_{individual} = DGE_{self} + \sum IGE_{neighbors} + E$$
  Here is the trap: A "bully" hen has high $DGE$ (she eats well) but negative $IGE$ (she starves her neighbors).
  *   **Individual Selection** maximizes $DGE$. It ignores the damage she does to the group.
  *   **Group Selection** maximizes Total Breeding Value ($TBV$), where $TBV = DGE + (n-1)IGE$.

  **The Partitioning Rule:**
  If the variance between groups is high relative to the variance within groups, the $IGE$ component is significant. If you select individuals from the best groups, you get both good $DGE$ and good $IGE$ (cooperators). If you select the best individuals regardless of group, you likely select bullies (high $DGE$, negative $IGE$), and your overall flock productivity drops even if individual records look good.

  ***

  ## Part 2: The Decision Procedure

  This procedure is designed for a technician with a spreadsheet. It determines whether to select **Individuals** (within groups) or **Groups** (all survivors from top pens).

  ### Phase 1: Data Collection (Every Generation)

  You need to structure your data so every bird is linked to a Pen ID.

  **Step 1.1: The Mandatory Columns**
  Create a spreadsheet with the following columns for every bird alive at selection age:
  1.  `Bird_ID`
  2.  `Pen_ID`
  3.  `Trait_Value` (e.g., Egg Count, Weight)
  4.  `Group_Trait_Value` (Sum or Average of the Pen for that trait)
  5.  `Mortality_Status` (0=Alive, 1=Dead)
  6.  `Feather_Score` (1=Intact, 5=Severe Damage)

  **Step 1.2: The Hard-to-Score Traits**
  *   **Mortality:** Record at the Pen level. If a bird is dead, she is not selected. But the *rate* of death in her pen is a trait of her group mates.
  *   **Feather Cover:** Score individuals. Calculate the `Pen_Avg_Feather_Score`.
  *   **Pecking Order:** Do not try to rank individuals. It is too noisy. Instead, record `Pen_Injury_Count` (number of birds in the pen with severe feather damage or wounds). This is a group trait.

  ### Phase 2: The Variance Check (The Math Step)

  Before deciding how to pick, you must calculate if social effects are strong enough to warrant group selection. Do this once per trait per generation.

  **Step 2.1: Calculate Variance Components (Approximate)**
  You don't need mixed models. Use this ANOVA-style approximation in your spreadsheet:

  1.  Calculate the Variance of Trait **Within Pens** ($\sigma^2_{within}$).
  2.  Calculate the Variance of Trait **Between Pens** ($\sigma^2_{between}$).
      *   *How:* Take the average trait value for each Pen. Calculate the variance of those averages.
  3.  Calculate the **Intraclass Correlation ($t$)**:
      $$t = \frac{\sigma^2_{between}}{\sigma^2_{between} + \sigma^2_{within}}$$

  **Step 2.2: The Decision Rule**
  *   **If $t < 0.1$:** Social effects are weak. **Select Individuals.** (Pick the top 10% of birds across all pens).
  *   **If $t > 0.1$:** Social effects are strong. **Select Groups.** (Pick the top 10% of Pens, then keep all survivors from those pens).
  *   **If $0.05 < t < 0.1$:** **Gray Zone.** (See Judgment Call #1).

  ### Phase 3: The Selection Algorithm

  **Scenario A: Individual Selection (Low Social Impact)**
  1.  Sort all birds by `Trait_Value` (descending).
  2.  Remove any bird with `Mortality_Status` = 1.
  3.  Remove any bird from a Pen where `Pen_Injury_Count` is in the worst 20% (Cull aggressive lines even if individual looks good).
  4.  Pick the top $N$ birds.

  **Scenario B: Group Selection (High Social Impact)**
  1.  Calculate `Pen_Index` for each Pen.
      *   $$Pen\_Index = (W_1 \times Pen\_Avg\_Production) - (W_2 \times Pen\_Mortality\_Rate) - (W_3 \times Pen\_Avg\_Feather\_Score)$$
      *   *(See Judgment Call #2 for Weights)*
  2.  Sort Pens by `Pen_Index` (descending).
  3.  Select the top $X$ Pens.
  4.  **All** living birds in those top pens become breeders.
  5.  *Correction for Family Size:* If one pen has a huge family (sisters), you risk inbreeding. Limit to max 2 daughters per mother within a selected pen.

  ***

  ## Part 3: Judgment Calls (Do Not Automate)

  *These steps cannot be solved by formula. A human must decide these based on business goals.*

  > **JUDGMENT CALL #1: The Gray Zone ($t$ between 0.05 and 0.1)**
  > *The Math:* The signal is too weak to be sure.
  > *The Call:* Look at the correlation between Individual Production and Pen Mates' Production.
  > *   If High Producers tend to be in High Producing Pens $\rightarrow$ Use **Individual Selection**.
  > *   If High Producers tend to be in Low Producing Pens (Bullies) $\rightarrow$ Use **Group Selection**.
  > *   *Action:* Plot Individual Egg Count (Y-axis) vs. Pen Mates' Avg Egg Count (X-axis). If the slope is negative, switch to Group Selection immediately.

  > **JUDGMENT CALL #2: Weighting the Pen Index**
  > *The Math:* There is no biological constant for how much a dead hen costs vs. a missing egg.
  > *The Call:* You must assign economic weights ($W_1, W_2, W_3$).
  > *   *Action:* Sit with the finance manager. Is one dead hen worth 50 eggs? Is severe feather damage worth 10 eggs? Plug those numbers into the `Pen_Index` formula. Do not guess; this is a business constraint, not a biological one.

  > **JUDGMENT CALL #3: Inbreeding vs. Social Gain**
  > *The Math:* Group selection reduces the effective population size ($N_e$) because you are selecting families, not individuals.
  > *The Call:* If you select whole pens, you might be selecting 10 full-sib families.
  > *   *Action:* If your inbreeding coefficient rises >1% per generation, you must sacrifice social gain. Break up the pens: Pick the top 50% of birds from the top 20% of pens. This dilutes the social effect but saves genetic diversity.

  ***

  ## Part 4: Running the Procedure on Your Three Cases

  ### Case 1: Feather Pecking
  *   **Context:** Damage is done by few, suffered by all. Hard to identify culprit.
  *   **Data:** `Pen_Injury_Count` is high variance between pens. Individual feather scores are noisy.
  *   **Variance Check:** $t$ will likely be $> 0.2$ (High between-pen variance). Some pens are peaceful, some are war zones.
  *   **Procedure Output:** **Select Groups.**
  *   **Reasoning:** You cannot identify the "culprit" individually without video surveillance (too expensive). The victim's score is confounded by the aggressor's genes. By selecting the peaceful *pens*, you select against the genetic propensity to peck AND for the genetic resilience to withstand pecking.
  *   **Trade-off:** You will keep some hens with mediocre egg production because they belong to a peaceful family. You will cull high producers from violent pens.

  ### Case 2: Feed Efficiency
  *   **Context:** Costs are per-pen, heritability numbers are per-bird.
  *   **Data:** You cannot measure individual intake in a group pen without RFID feeders (expensive). You only know Pen Feed / Pen Eggs.
  *   **Variance Check:** Individual variance is essentially measurement error here. $t$ is effectively 1.0 because the "individual" data doesn't exist.
  *   **Procedure Output:** **Select Groups (Family Selection).**
  *   **Reasoning:** You literally cannot select individuals. A hen looks efficient because her pen-mates are inefficient and left food.
  *   **Modification:** Use "Family Selection." Treat the Pen as the unit of selection.
  *   **Warning:** Your old heritability numbers ($h^2$) are useless. They were measured in cages. Expect the response to selection to be slower initially until you generate new $h^2$ estimates for group housing.

  ### Case 3: Egg Size (The Conflict)
  *   **Context:** 10 years of individual selection. Moving to group selection might cost progress.
  *   **Data:** Egg size is physiological. One hen's genes do not significantly change her neighbor's egg size ($IGE \approx 0$).
  *   **Variance Check:** $t$ will be low ($< 0.05$). Most variance is within pens.
  *   **Procedure Output:** **Stick with Individual Selection (with a caveat).**
  *   **Reasoning:** Since $IGE$ is near zero, Group Selection adds noise. Selecting whole pens reduces your *Selection Intensity*.
      *   *Math:* If you need 100 breeders, selecting individuals gives you the top 100 from 1000 birds. Selecting groups gives you the top 100 from the top 10 pens. The average genetic merit of the top 100 individuals will be higher than the average of the top 10 pens.
  *   **The Honest Answer:** **Yes, you will lose progress on Egg Size if you switch to pure Group Selection.**
  *   **The Compromise:** Use an **Index**.
      1.  Select the top 20% of Pens (to control pecking/mortality).
      2.  Within those pens, select the individuals with the largest eggs.
      3.  *Result:* You protect the social environment without sacrificing gain on the non-social trait.
  *   **Warning:** If you ignore the social environment (Case 1 & 2) to chase Egg Size, your hens may survive less long or eat more feed due to stress, negating the economic gain of the larger egg.

  ***

  ## Part 5: Limitations & Unsolved Biology

  *Be aware of where the spreadsheet lies to you.*

  1.  **Genotype-by-Environment Interaction (GxE):**
      *   *The Unknown:* A hen genetically programmed to be calm in a small group might be stressed in a large group. We do not have a settled mathematical model for predicting how $IGE$ scales with group size ($n$).
      *   *Flag:* If you change pen size from 5 to 50 birds, re-calculate $t$ (Intraclass Correlation). Do not assume the old variance components hold.

  2.  **The "Bully" Paradox:**
      *   *The Unknown:* Sometimes high production *requires* dominance. In resource-scarce environments, the "bully" gene might actually be the "survival" gene.
      *   *Flag:* If feed is restricted, Group Selection might select for timid birds that starve. Ensure feed is ad-libitum during the selection phase so you are selecting for cooperation, not starvation avoidance.

  3.  **Time Lag:**
      *   *The Unknown:* Group selection response is often slower in the first 2-3 generations because you are breaking up the negative covariance built up by years of individual selection.
      *   *Flag:* Do not abort the program if Generation 1 shows no improvement. The "bully" genes take time to purge from the population.

  4.  **Epigenetics:**
      *   *The Unknown:* Stressed hens lay eggs with different hormone profiles, affecting the next generation's behavior independent of DNA.
      *   *Flag:* Your spreadsheet assumes DNA is the only inheritance. If you see behavioral changes faster than genetics allows, it may be maternal stress effects. There is no column for this; just observe flock temperament qualitatively.

  ### Summary Checklist for the Technician
  1.  [ ] **Calculate $t$** (Intraclass Correlation) for Production and Mortality.
  2.  [ ] **If $t > 0.1$:** Rank Pens, pick top 20%, keep all survivors.
  3.  [ ] **If $t < 0.1$:** Rank Individuals, but cull anyone from a "violent" pen.
  4.  [ ] **For Egg Size:** Rank Individuals *within* the top Pens.
  5.  [ ] **Check Inbreeding:** Ensure no more than 2 daughters per mother.
  6.  [ ] **Set Weights:** Finance team must define the cost of a dead hen vs. a lost egg.
