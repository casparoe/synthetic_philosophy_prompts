prompt: |-
  I run genetics for a mid-size laying-hen operation and we're moving from small cages to bigger mixed-group pens, and suddenly the old way of picking breeders is breaking. Until now we've measured each hen's production and picked the top individual hens, but in the group pens the hens that score best on their own are often the nastiest ones — they eat more because they shove others off the feed. Someone at a conference told me there's a whole literature on this, that a couple decades back some people got calmer, more productive birds by selecting whole groups together instead of individual hens, and that this hooks into an old fight in evolutionary biology about whether selection acts on genes, individuals, or groups. I have a math background but zero evolutionary theory, so translate as you go.

  Write me a decision procedure for choosing breeders that my team can run every generation. It should be grounded in what the levels-of-selection debate actually says — when picking on the individual is fine, when you have to pick at the group level, and why (I gather it's something about heritable variance getting partitioned between levels, but explain that in plain terms). The procedure needs: which measurements to take and in what order; a rule for when to rank birds individually vs. rank whole groups; what to do about traits you can't score at the group level (mortality is easy, feather cover is harder, pecking order is a nightmare); and it has to be honest about where the math stops and somebody just has to make a judgement call — mark those places clearly, don't dress them up as steps.

  Then run it on three cases that are basically our real decisions: (1) feather pecking, where the damage is done by a few hens but the whole group loses feathers and it's hard to tell who's the culprit; (2) feed efficiency, where our costs are per-pen but every heritability number we have our per-bird; (3) a line where we've selected individually for egg size for ten years and I'm told moving to group selection now would cost us years of progress on the exact trait we sell. If the procedure gives an answer I wont like on case 3, give it anyway. And tell me what the procedure can't do — anywhere the biology genuinely dosn't have a settled answer, flag it instead of inventing a rule. It needs to be runnable by a technician in an afternoon with nothing fancier than a spreadsheet.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Genetics manager for a mid-size laying-hen operation.
      *   **Context:** Moving from cages (individual housing) to mixed-group pens (social housing).
      *   **Problem:** Individual selection is failing (selecting for aggression/social dominance rather than productivity).
      *   **Background:** User has a math background but zero evolutionary theory. Needs translation of "levels of selection" concepts into plain terms.
      *   **Task:** Create a decision procedure for choosing breeders every generation.
      *   **Requirements:**
          *   Grounded in levels-of-selection theory (gene vs. individual vs. group).
          *   Explain heritable variance partitioning simply.
          *   Specific steps: Measurements, order, ranking rules (individual vs. group).
          *   Handle hard-to-score traits (mortality, feather cover, pecking).
          *   Identify judgment calls clearly (don't disguise them as math).
          *   Run the procedure on three specific cases (Feather Pecking, Feed Efficiency, Egg Size).
          *   Be honest about limitations/unsolved biology.
          *   Runnable by a technician with a spreadsheet.

  2.  **Deconstruct the Evolutionary Theory (Levels of Selection):**
      *   *Concept:* Selection acts on phenotypes, but evolution responds based on heritable genetic variance.
      *   *The Shift:* In cages, $V_G$ (Genetic Variance) is mostly Direct Genetic Effects (DGE) - my genes affect my traits. In groups, $V_G$ includes Indirect Genetic Effects (IGE) - my genes affect *your* traits (e.g., I eat your food, I peck you).
      *   *The Math:* Total Breeding Value ($TBV$) = Direct Effect ($DGE$) + Sum of Indirect Effects on group mates ($IGE$).
      *   *The Conflict:* If I select the highest producing individual in a group, I might be selecting a "bully" (high DGE, negative IGE). If I select the best *group*, I select for cooperation (high DGE + positive IGE).
      *   *Variance Partitioning:* $\sigma^2_{Total} = \sigma^2_{Direct} + (n-1)\sigma^2_{Indirect} + \text{covariance}$. If the covariance is negative (bullying), individual selection fails.
      *   *Translation:* "Heritable variance getting partitioned" means: How much of the difference we see is due to the bird's own genes vs. the genes of its neighbors? If neighbors matter a lot, you must select groups.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Make it actionable.
      *   *Structure:*
          1.  Theory Primer (The "Why").
          2.  Data Collection (The "What").
          3.  The Algorithm (The "How").
          4.  Judgment Calls (The "Human Element").
      *   *Measurements:* Need group totals and individual IDs.
      *   *Ranking Rule:* Compare Individual Variance vs. Group Variance. If Group Variance is high relative to Individual, select Groups.
      *   *Hard Traits:* Mortality (Group), Feather Cover (Individual + Group avg), Pecking (Observation/Group).
      *   *Judgment Calls:* Weighting traits, dealing with outliers, deciding when to switch strategies.

  4.  **Developing the Three Cases:**
      *   *Case 1: Feather Pecking.* High social interaction. Negative IGE. Individual selection selects cannibals. *Verdict:* Group Selection.
      *   *Case 2: Feed Efficiency.* Cost is per pen, data is per bird. This is a measurement issue. If feed is shared, individual intake is unknown. *Verdict:* Group Selection (or Family Selection) because individual data is noisy/biased by social interaction.
      *   *Case 3: Egg Size.* Long history of individual selection. High heritability. Low social impact on egg size (mostly). *Verdict:* Stick with Individual (or Index), but monitor. The prompt asks to be honest even if the answer is "you lose progress." Actually, egg size is largely physiological, not social. Moving to group selection *might* slow gain if IGE is negligible, but it won't necessarily reverse it. However, if the request implies a trade-off, I need to address the "cost." The theory says if IGE is zero, group selection is less efficient than individual selection (due to dilution). So, yes, there is a cost.

  5.  **Refining the Math/Theory Explanation:**
      *   Avoid Hamilton's Rule specifics ($rb > c$) unless necessary. Stick to Variance Components.
      *   Use the "Bully vs. Cooperator" analogy.
      *   Explain $TBV = DGE + (n-1)IGE$.
      *   Explain that in cages, $IGE \approx 0$. In pens, $IGE \neq 0$.

  6.  **Addressing Constraints:**
      *   *Spreadsheet friendly:* No R/Python scripts. Simple formulas.
      *   *Technician runnable:* Clear steps, no jargon without definition.
      *   *Honesty:* Flag where biology is unsettled (e.g., exact weighting of mortality vs. production).

  7.  **Iterative Review of the Draft:**
      *   *Critique:* Is the variance explanation too dense?
      *   *Fix:* Use the "Pie Chart" analogy for variance.
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Add specific column headers for the spreadsheet.
      *   *Critique:* Case 3 needs to be handled carefully. Don't promise group selection fixes everything. If egg size has no social component, group selection adds noise.
      *   *Fix:* Explicitly state that for non-social traits, group selection reduces selection intensity.

  8.  **Final Polish:**
      *   Ensure tone is professional but accessible.
      *   Check that "Judgment Calls" are clearly boxed or highlighted.
      *   Verify the "Levels of Selection" connection is explicit (Gene/Individual/Group).

  **(Self-Correction during drafting):** I initially thought about suggesting Genomic Selection. *Correction:* No, the prompt says "spreadsheet," "technician," "mid-size." Keep it phenotypic/family-based. Don't overcomplicate with GBLUP unless necessary. Stick to the "Group Selection" vs "Individual Selection" framework requested.

  **(Refining the Variance Explanation):** The user mentioned "heritable variance getting partitioned." I need to explain that Total Genetic Variance = Direct Variance + Indirect Variance + Covariance. If Covariance is negative (bullies), selecting on Direct (Individual) reduces Total.

  **(Refining Case 3):** The user says "I'm told moving to group selection now would cost us years of progress." Is this true? Yes, because selection intensity is lower on groups (N groups < N individuals). Also, if egg size has low IGE, you are adding noise. I must confirm this trade-off.

  9.  **Final Output Structure:**
      *   Introduction (The Theory in Plain English).
      *   The Decision Procedure (Step-by-Step).
      *   The Spreadsheet Logic.
      *   Judgment Calls (Highlighted).
      *   Application to Three Cases.
      *   Limitations/Unknowns.

