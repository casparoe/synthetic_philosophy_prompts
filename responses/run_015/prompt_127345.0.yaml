  2.  **Deconstruct the Paradox & The Disagreement:**
      *   *The Logic:* $(\forall x)(Rx \rightarrow Bx)$ is logically equivalent to $(\forall x)(\neg Bx \rightarrow \neg Rx)$.
      *   *Nicod's Criterion:* Observing an $F$ that is $G$ confirms $(\forall x)(Fx \rightarrow Gx)$.
      *   *Equivalence Condition:* If evidence $E$ confirms $H$, and $H$ is equivalent to $H'$, then $E$ confirms $H'$.
      *   *The Conflict:* Intuition says a green apple (non-black, non-raven) is irrelevant. Logic says it confirms "All non-black things are non-ravens," which is equivalent to "All ravens are black."
      *   *The Friend's View:* Intuition is wrong; logic wins. Confirmation is purely logical.
      *   *The User's View:* Logic is being misapplied; practical scientific testing matters.
      *   *Resolution for Lay Audience:* Don't solve it definitively (philosophers haven't). Instead, show *why* it's a paradox (tension between valid logic and strong intuition) and explore *why* the intuition exists (background knowledge, class size).

  3.  **Pedagogical Strategy (The "Order of Ideas"):**
      *   *Start:* Concrete intuition. Get them to feel the pull of "apples don't matter."
      *   *Middle:* The Logic. Show the equivalence clearly without jargon.
      *   *Climax:* The Collision. Show that accepting the logic forces the counter-intuitive conclusion.
