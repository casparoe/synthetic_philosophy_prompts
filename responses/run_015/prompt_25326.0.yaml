      *   *Conclusion:* EMT expands responsibility, it doesn't dissolve it.

  *(Self-Correction Note)*: Wait, I need to be careful about the "lending" part. If I lend my notebook, is it *still* part of my mind? Clark/Chalmers would say the cognitive system is defined by the *active* coupling. If I can't access it, it's not part of the *current* cognitive process. I need to emphasize the *dynamic* nature of the cognitive boundary. It's not that the notebook is *permanently* branded as "mind stuff." It's "mind stuff" only when integrated into the loop.

  Let's refine the "belief" point. If my friend writes "The bank is open Saturday" in my notebook, and I read it and act on it, did they change my belief? Yes. But that's not unique to EMT. That's just testimony. EMT just says the *storage* is external. The *endorsement* is still a functional state of the agent.

