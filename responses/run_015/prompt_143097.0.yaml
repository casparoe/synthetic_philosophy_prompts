      *   **Core Question:** What philosophical commitments about belief, value, and rational interaction does the institutional practice of running IPMs presuppose? Does it require rejecting common priors, assuming bounded rationality, or viewing prices as something other than Bayesian credences (e.g., revealed preference, coordination)? Is the practice underdetermined (compatible with multiple epistemologies) or does it require a specific heterodox view?
