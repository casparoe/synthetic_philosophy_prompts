  Here is a complete game design for your "Big Questions Night." It is built to fit a 90-minute slot, requires only basic addition/subtraction for the "House," and is engineered to produce the specific "annoyed at themselves" moment you're looking for.

  # Game Title: The Coherence Trap

  ## 1. Materials & Setup
  **For the House (You):**
  *   **The Ledger:** A printed worksheet (template below) for each player.
  *   **The Bank:** 200 Tokens per player (start them with 100, keep 100 in reserve for payouts).
  *   **The Randomizer:** Two opaque bags (Bag A, Bag B). Inside each, place one marble.
      *   *Prep:* Before the session, flip a coin for each bag. Red = Heads, Blue = Tails. Seal the bags. **Do not look inside.** Put them behind the bar.
  *   **The Prize:** One nice bottle (or equivalent) for the player with the most tokens at the end.

  **For the Players:**
  *   Pen and a "Pricing Sheet" (4 lines).
  *   100 Starting Tokens.

  ## 2. The Golden Rule (Read this aloud)
  > "You are setting **Fair Prices**. If you write '60' on a ticket, it means you think 60 tokens is a fair deal.
  >
  > **The Catch:** A fair price works both ways. If you write 60, the House can **sell** you the ticket for 60, OR **buy** it from you for 60. You cannot refuse. Your number is a binding contract."

  ## 3. Round 1: The Trap (45 Minutes)
  **The Tickets:**
  Players must assign a price (0 to 100 tokens) to exactly four tickets. Each ticket pays **100 Tokens** if the condition is met, 0 if not.

  1.  **Ticket A:** Bag A contains a Red marble.
  2.  **Ticket B:** Bag B contains a Red marble.
  3.  **Ticket BOTH:** Both bags contain Red marbles.
  4.  **Ticket EITHER:** At least one bag contains a Red marble.

  **The Task:**
  Give players 10 minutes to discuss and write their four numbers. Encourage them to think about how the numbers relate (e.g., "Can 'Both' cost more than 'A'?").

  **The House Phase (15 Minutes):**
  Collect the sheets. You (the House) sit at the front. You are not guessing the marbles. You are just doing arithmetic on *their* numbers.

  **The Worksheet (House Script):**
  *For each player, calculate the "Imbalance" ($I$).*
  $$I = (\text{Price A} + \text{Price B}) - (\text{Price BOTH} + \text{Price EITHER})$$

  *   **If $I = 0$:** This player is **Safe**. (Mark them as the "Hero").
  *   **If $I > 0$:** (e.g., They priced A+B at 110, Both+Either at 100).
      *   **The Book:** **Sell** them Ticket A and Ticket B. **Buy** Ticket BOTH and Ticket EITHER from them.
      *   **Upfront:** They pay you $I$ tokens immediately.
  *   **If $I < 0$:** (e.g., They priced A+B at 90, Both+Either at 100).
      *   **The Book:** **Buy** Ticket A and Ticket B from them. **Sell** them Ticket BOTH and Ticket EITHER.
      *   **Upfront:** You pay them $|I|$ tokens immediately.

  *Note: Do this for every player who has an imbalance. It takes seconds per person.*

  **The Reveal & Settlement (15 Minutes):**
  1.  Open Bag A and Bag B publicly.
  2.  Settle the tickets.
      *   Because of the math identity $(A \cup B) + (A \cap B) = A + B$, the payouts on the tickets will **always cancel out to exactly zero** for the player.
      *   *Example:* If Bag A is Red, Bag B is Blue:
          *   Ticket A pays 100. Ticket B pays 0.
          *   Ticket BOTH pays 0. Ticket EITHER pays 100.
          *   Total Payout: +100 - 100 = 0.
  3.  **The Kicker:** The player is left with only the **Upfront** transaction.
      *   If $I > 0$, they paid you 10 tokens upfront. Payouts net to 0. **They lost 10 tokens guaranteed.**
      *   If $I < 0$, you paid them 10 tokens upfront. Payouts net to 0. **They lost 10 tokens guaranteed** (because they hold the losing side of the payout swap).
      *   *Wait, check the logic:* If $I < 0$, you paid them 10. They hold "Both" and "Either". You hold "A" and "B".
          *   Outcome A-Red, B-Blue: You hold A (win 100). They hold Either (win 100). Net 0.
          *   Wait, if $I < 0$, the House *buys* A+B. House *sells* Both+Either.
          *   Player receives $|I|$ upfront. Player *pays out* on the settlement.
          *   Settlement: Player owes House 100 (on A). House owes Player 100 (on Either). Net 0.
          *   Player keeps the $|I|$ upfront? **No.**
          *   *Correction for House Script:* If $I < 0$, the Player has undervalued the set. The House *Sells* the Undervalued set (Both+Either) and *Buys* the Overvalued set (A+B).
          *   Upfront: Player Receives $|I|$.
          *   Settlement: Player must pay the winnings on Both+Either. House pays winnings on A+B.
          *   Since $(A+B) = (Both+Either)$ in payout value, the cashflow cancels.
          *   **Result:** The Player ends up with exactly the Imbalance amount *less* than they started.
          *   *Simpler explanation for the room:* "The tickets cancel out. You are left holding the bag on the price difference."

  ## 4. Round 2: The Prophecy (15 Minutes)
  *This addresses Requirement 4 (Future Opinion).*

  **The Ticket:**
  *   **Ticket C:** Bag A is Red.

  **The Task:**
  1.  Write down your price for Ticket C **Right Now**.
  2.  Write down the price you **Will Offer** for Ticket C **After** I show you Bag B. (You must commit to a single number, e.g., "70", regardless of what Bag B shows).

  **The Exploit:**
  *   If **Now Price $\neq$ Future Price**:
      *   The House Buys the cheaper one and Sells the dearer one.
      *   *Example:* Now = 50. Future = 80.
      *   House Buys "Now" (pays you 50). House Sells "Future" (you pay 80 later).
      *   Net Upfront: You pay 30.
      *   Settlement: When Bag B is revealed, you are forced to trade at 80. Since the "Now" ticket and "Future" ticket are actually the *same event* (Bag A is Red), the payouts cancel. You lose the 30 difference.
  *   *Why this matters:* It shows that if you know your opinion will change without new evidence (Bag B is independent), you are incoherent *now*.

  ## 5. The Debrief (30 Minutes)
  *Do not start this until the tokens are counted. Use the "Hero" (the safe player) as a prop.*

  **Part 1: The Autopsy (10 mins)**
  *   **Ask the Losers:** "Look at your sheet. Did I know what was in the bags?" (No). "Did I look at the marbles before I made you the offer?" (No). "Then how did I guarantee your loss?"
  *   **The Point:** The loss didn't come from the world (the marbles). It came from the *relationship between your numbers*. You bet against yourself.
  *   **The Hero:** Invite the person with $I=0$ to the front. "Why did they survive?" Because their numbers hung together. $50 + 50 = 25 + 75$. They respected the logic of 'And' and 'Or'.

  **Part 2: Addressing the Objections (10 mins)**
  *   **Objection 1: "I'm not a betting machine."**
      *   *Response:* "You treated your belief as a number when you wrote it down. If '30% chance of rain' isn't a price you'd bet on, what is it? If it's not a price, you can't use it to make decisions. If it *is* a price, you just lost tokens."
  *   **Objection 2: "So what? I lost 10 tokens."**
      *   *Response:* "It's not about the tokens. It's that a stranger could have taken money from you without knowing anything about the weather, the marbles, or the stock market. They only needed to know *your* mind. That means the error was in your mind, not the world."
  *   **Objection 3: "You saw my numbers first! That's unfair."**
      *   *Response:* "I was a mirror. I didn't add any information. I just showed you the contradiction you wrote down. Would you say a calculator is 'unfair' for telling you 2+2=5 is wrong?"

  **Part 3: The Limits (10 mins)**
  *   **The Infinite Bet (Requirement 5):** "Tonight, I only booked you once. A true 'Money Pump' means I could make you do this every hour, draining your wallet forever, because you never learn. This game shows you *can* be pumped. It doesn't prove you *will* be, unless you refuse to update your beliefs."
  *   **What the Game Can't Show:** "This proves that *if* you want to avoid guaranteed loss, you must be coherent. It doesn't prove you *care* about guaranteed loss. Some people say 'I accept the loss, my intuition is more important.' That's a valid life choice, but you can't claim to be rational."

  ## 6. Predictable Failures & Fixes
  *   **The "50%" Hedger:** Someone writes 50 on everything.
      *   *Math:* $50+50 - (25+75) = 0$. They survive.
      *   *Debrief:* "They survived by being logically consistent, not by being smart. 50/50 is a safe harbor, but it doesn't help you navigate."
  *   **The Refuser:** Someone won't play.
      *   *Fix:* Let them watch. "You are opting out of the economy of belief. That's a valid position, but you can't win the bottle."
  *   **The "Unfair" Accusation:**
      *   *Fix:* Remind them of the Golden Rule. "You set the price. I just accepted it. If you set a price you weren't willing to sell at, that was your error, not mine."
  *   **Math Anxiety:**
      *   *Fix:* Use a calculator on your phone for the Worksheet. It's just two additions and one subtraction.

  ## 7. House Worksheet Template (Print 16 copies)

  ```text
  PLAYER NAME: ___________________

  PRICES GIVEN:
  A (Bag 1 Red):      ______
  B (Bag 2 Red):      ______
  BOTH (Red & Red):   ______
  EITHER (Red or Red): ______

  CALCULATION:
  1. Add A + B:       ______
  2. Add BOTH + EITHER: ______
  3. IMBALANCE (1 - 2): ______

  ACTION:
  [ ] IMBALANCE IS 0:  PLAYER IS SAFE (HERO)
  [ ] IMBALANCE > 0:   SELL A & B TO PLAYER. BUY BOTH & EITHER FROM PLAYER.
                       PLAYER PAYS YOU IMBALANCE TOKENS NOW.
  [ ] IMBALANCE < 0:   BUY A & B FROM PLAYER. SELL BOTH & EITHER TO PLAYER.
                       YOU PAY PLAYER IMBALANCE TOKENS NOW.
                       (NOTE: Player will lose this amount at settlement).
  ```

  ## 8. Why This Works
  1.  **Skin in the Game:** Tokens + Prize makes it real.
  2.  **No Math Skill Needed:** The Worksheet does the thinking.
  3.  **The "P and Q" Requirement:** By using `A`, `B`, `A&B`, and `A or B`, you force them to price the conjunction and disjunction explicitly.
  4.  **The "Future Opinion" Requirement:** Round 2 forces them to confront their future self.
  5.  **The "Hero":** The worksheet explicitly identifies the consistent player, giving you a positive example to contrast with the losers.
  6.  **The "Guaranteed Loss":** The identity $(A \cup B) + (A \cap B) = A + B$ ensures the payouts *always* net to zero, isolating the pricing error as the sole cause of loss.

  ## 9. Final Advice for the Facilitator
  *   **Be Boring:** When you act as the House, be a robot. "I am buying this at your price." Do not smirk. The anger should be directed at their own numbers, not your attitude.
  *   **Protect the Hero:** If no one is consistent (unlikely), you are the Hero. If multiple people are consistent, they share the bottle.
  *   **Time Management:** If Round 2 eats too much time, cut it. Round 1 is the core argument. Round 2 is the "advanced class."
  *   **The "Infinite" Point:** Be humble here. Admit that one loss doesn't make them irrational forever. It just makes them vulnerable *today*.

  This structure gives you the rigor of a Dutch Book argument with the flow of a party game. Good luck.
