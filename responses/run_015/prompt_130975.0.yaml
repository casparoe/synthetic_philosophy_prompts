answer: |-
  The practice strictly presupposes that allocation must remain divorced from wealth and that consent under financial pressure is invalid, while the inalienability of body parts is a contingent justification that current practice already contradicts, meaning your proposal violates the core ethical constraints even if it technically dodges the commodification ban.

  The current ban rests on three pillars that are often conflated but logically distinct: commodification, coercion, and equity. The commodification argument claims that putting a price on body parts treats persons as things, violating human dignity. The coercion argument claims that financial offers undermine voluntary consent, particularly for the poor who cannot afford to refuse. The equity argument claims that scarce lifesaving resources must be distributed by medical need, not ability to pay. Current practice is philosophically messy because it accepts commodification elsewhere (plasma, eggs, surrogacy) and accepts wealth-based advantages elsewhere (multiple listing, better insurance networks), suggesting the inalienability principle is not strictly held across the board. The reimbursement for lost wages sits awkwardly here: it is technically restoring the donor to their prior financial state, but for a low-income worker, that restoration is a significant financial incentive that looks functionally similar to payment, undermining the claim that money always destroys altruism. The billing for procurement is a legal fiction where the price is attached to the surgical service and logistics, not the organ itself, maintaining the letter of the law while acknowledging the economic reality.

  What the practice strictly presupposes is the equity and coercion principles, not the commodification principle. If we truly believed body parts were inalienable, we would not pay for eggs or plasma, which carry medical risk and are bodily materials; the distinction between "vital organ" and "regenerative tissue" is medically relevant but morally thin when considering autonomy. Therefore, the ban is not primarily about the metaphysical status of the kidney, but about the social consequences of introducing money into the transaction. The strict requirement is that the queue cannot be jumped via wealth (equity) and that donors cannot be induced by desperation (coercion). The existing tolerances—like multiple listing—are treated as unfortunate loopholes or side-effects of insurance structures, not endorsed features, whereas your proposal would institutionalize them. The practice is underdetermined between a Kantian view (selling is intrinsically wrong) and a Utilitarian view (selling leads to bad outcomes like exploitation or reduced trust), but policy operates as if the Utilitarian view holds: we allow paid trials because the risk is managed, but ban organ sales because the risk of exploitation is deemed unmanageable.

  Your proposal fails the strict presuppositions even if it clears the commodification hurdle. By allowing the purchase of priority points via tax-deductible gifts, you are explicitly creating a market in queue position, which violates the equity principle that allocation must be based on medical urgency and match quality. It institutionalizes the wealth advantage that current practice merely tolerates as a bug. By offering priority points for donor registration, you introduce a financial-like incentive (future security) that risks coercing the poor into registering or donating not out of altruism, but out of anxiety about future health security, violating the coercion principle. The inheritability of points turns queue position into property, deepening the commodification of access to care. While this is not a direct cash-for-kidney transaction, it creates a derivative market where the organ's scarcity is monetized through the waitlist, achieving the same distributional outcome as a direct market: the wealthy get organs faster, and the poor are incentivized to supply them.

  If we swapped the presupposed view for one where the only honest worry is that the poor end up as sellers, the policy would need to focus on income safeguards rather than transaction bans. You would see a system where payment is allowed but capped, or where donors are guaranteed lifetime health insurance and income support, decoupling the decision from immediate financial desperation. Your proposal does not look like this; it looks like a mechanism to let the wealthy opt out of the queue without addressing the vulnerability of the potential donor. It does not slip past the theory that blocks cash payment because the ethical block is not merely against the exchange of cash for flesh, but against the exchange of wealth for life-saving priority. The theory that catches your proposal is the equity principle: a public health resource cannot be allocated by credit score or donation history. If the program adopted your proposal, it would have to abandon the claim that the transplant system is a common good distributed by need, admitting instead that it is a service tiered by contribution and capacity to pay.
