answer: |-
  This is a classic mix-up. Your student is wielding the Leveling Down Objection, which is a hammer designed to smash strict egalitarianism, but they're swinging it at prioritarianism. Prioritarianism doesn't care about equality for its own sake; it cares about benefiting people, with a weight given to those who are worse off. So when the student says, "equality isn't improved by making the better-off worse off," they're either stating a falsehood about what equality is, or a truth that doesn't apply to the policy they're criticizing.

  Here's the menu of distinct claims hidden inside that slogan, broken down by how they hold up and whether they actually touch prioritarianism.

  ### 1. Equality is purely instrumental
  **The Claim:** Equality has no intrinsic value. It's only good insofar as it produces other goods (like stability or welfare). Therefore, if making the rich poorer doesn't produce those goods, you haven't improved anything.
  **Status:** Substantive and defensible. Many philosophers hold this view.
  **Impact on Prioritarianism:** **Strawman.** Prioritarianism agrees with this. Prioritarianism doesn't value equality intrinsically either; it values well-being weighted by priority. If the policy hurts the rich and helps no one, the prioritarian rejects it too. But the policy *does* help the worst-off (mental health services). So this claim doesn't undermine the specific tax proposal unless the student argues the tax yields zero benefit to the poor.
  **Supports No Tax?** Only if empirically the tax fails to help the worst-off.

  ### 2. Separateness-of-persons constraint against harming
  **The Claim:** It is impermissible to harm one person (the high-earner) even if it achieves a comparative statistical gain, because individuals are distinct entities with rights, not vessels for aggregate value.
  **Status:** Substantive and defensible (very Nozickian).
  **Impact on Prioritarianism:** **Partial Hit.** This challenges the *method* of redistribution, not the goal. However, prioritarianism usually operates within constraints that forbid violating rights. If taxation is viewed as a rights violation, this works. But if taxation is viewed as a permissible duty, it doesn't.
  **Supports No Tax?** Weakly. It supports no tax only if taxation is construed as impermissible harming rather than a legitimate claim on resources. But the slogan focuses on "equality isn't improved," which suggests the objection is about the *point* of the harm, not the right to the money.

  ### 3. Prioritarianism relies on a distorted welfare-comparison metric
  **The Claim:** The student is implying that prioritarianism counts "closing the gap" as a benefit. They think the theory values the relative drop of the rich as a gain in itself.
  **Status:** False.
  **Impact on Prioritarianism:** **Strawman.** Prioritarianism is non-comparative. It looks at absolute levels of well-being and applies a weight. It does not count the rich person's loss as a gain in value. It counts the poor person's gain as a heavy gain. The student is attributing a relational metric to a theory that explicitly rejects it.
  **Supports No Tax?** No. This attacks a theory nobody is holding.

  ### 4. There's a lexical floor that prohibits leveling
  **The Claim:** There is a threshold below which you cannot push the better-off, regardless of the gains to the worst-off. Making them "worse off" is forbidden if it crosses this line.
  **Status:** Substantive and defensible (sufficientarianism adjacent).
  **Impact on Prioritarianism:** **Irrelevant.** Prioritarianism can accommodate floors, but the slogan is about "equality isn't improved." This claim is about "harming is forbidden." Also, unless the tax pushes high-earners into destitution, the floor isn't triggered.
  **Supports No Tax?** Only if the tax is confiscatory enough to breach the floor. For standard progressive taxation funding mental health, this doesn't apply.

  ### 5. It conflates comparative and non-comparative benefits
  **The Claim:** "Equality isn't improved" actually means "No one is non-comparatively better off." Leveling down makes the rich worse off and the poor stay the same. No one gains absolute welfare.
  **Status:** Tautology (mostly). If you define "improved" as "someone gains absolute welfare," then yes, leveling down doesn't improve it.
  **Impact on Prioritarianism:** **Strawman.** This is the crux. The student is treating the tax-and-spend policy as if it were pure leveling down. But the policy isn't "burn the rich's money." It's "tax the rich to fund services for the poor." The poor *do* gain non-comparative benefits. The slogan ignores the second half of the transaction.
  **Supports No Tax?** No. This reading only supports the conclusion if you falsely assume the tax revenue disappears rather than funding services.

  ### The Verdict on the Tax Conclusion

  None of these readings actually support the student's conclusion that we shouldn't tax high-earners to fund mental-health services for the worst-off, unless they are smuggling in an empirical falsehood.

  The student's slogan attacks **Leveling Down** (making the rich poorer while the poor stay static). But the policy they are arguing against is **Leveling Up** (making the rich slightly poorer to make the poor significantly better off).

  *   **Prioritarianism** loves this policy because the weighted gain to the worst-off outweighs the loss to the better-off.
  *   **Egalitarianism** loves this policy because it reduces the gap.
  *   **The Student's Slogan** only works if the policy provides *no* benefit to the worst-off.

  If the student insists the slogan kills the policy, they are implicitly arguing that the mental-health services provide no real welfare gain (claim #1), or that the tax is rights-violating harm regardless of the gain (claim #2), or they simply don't understand that prioritarianism cares about absolute gains, not relative gaps (claim #3 and #5).

  The most charitable reading is that they are worried about **efficiency** (Claim #1): if the tax destroys more wealth than the services create, then overall welfare drops. But that's an empirical economic claim, not a philosophical knockdown based on the concept of equality. As it stands, they're fighting a ghost—they're using an argument against useless equality to fight a policy about weighted welfare.
