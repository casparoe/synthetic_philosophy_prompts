answer: |-
  # JOINT STATEMENT ON THE STATUS OF FUTURE CONTINGENTS

  ## I. SUBSTANTIVE AGREEMENTS
  *Claims endorsed by both the Bivalence Defender (CBF) and the Open-Future Indeterminist (COFI).*

  1.  **The Sea-Battle Scenario:** We agree on the description of the test case: Two fleets are positioned such that a battle is possible but not causally necessitated by prior states of the world plus laws of nature. The outcome depends on contingent decisions or chance events occurring between now and tomorrow.
  2.  **The Fatalism Threat:** We agree that if the truth of a future contingent proposition *entails* the necessity of the event described, then logical fatalism follows. Both camps aim to preserve the intuition that the future is, in some sense, "up to us" or not yet settled.
  3.  **Past/Future Asymmetry:** We agree that propositions about the past (e.g., "There was a sea battle yesterday") behave differently than propositions about the future. Specifically, we agree that past contingents are now fixed in a way that future contingents are not.
  4.  **Logical Scope:** We agree that classical logic (including Bivalence and Excluded Middle) applies without restriction to propositions about the past, the present, and necessary truths. The dispute is localized strictly to *contingent* propositions about the *future*.
  5.  **Truth as Correspondence:** We agree that truth involves a correspondence relation between propositions and reality. We disagree only on what constitutes the relevant "reality" for future-tensed propositions (e.g., whether reality includes future facts or is limited to present/existing facts).
  6.  **The Necessity of the Past:** We agree on the principle that "What is past is necessary." If a proposition *was* true yesterday, it is now unchangeable that it was true. The dispute concerns whether a proposition being true *now* about tomorrow counts as a "past/hard fact" tomorrow.

  ## II. PRECISE DISAGREEMENTS
  *Residual conflicts phrased to ensure charitable interpretation. The "Nature of Dispute" column flags whether the disagreement is verbal (terminological) or genuine (metaphysical/logical).*

  | Claim | CBF Position (Bivalence Defender) | COFI Position (Open-Future Indeterminist) | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **1. Current Truth Value** | The proposition "There will be a sea battle tomorrow" is **determinately True** or **determinately False** right now, even if we cannot know which. | The proposition "There will be a sea battle tomorrow" is **neither True nor False** right now. It lacks a truth value until the event occurs. | **Genuine.** Disagreement over the semantic status of the proposition itself. |
  | **2. Ontological Grounding** | Truth supervenes on **tenseless facts**. The future event itself (located at t+1) grounds the truth of the proposition at t. | Truth requires **presently existing truthmakers**. Since the future event does not exist now, there is nothing to ground the truth now. | **Genuine.** Disagreement over the ontology of time (Eternalism vs. Presentism/Growing Block). |
  | **3. Meaning of "Determinate"** | "Determinate" means **semantically definite**. The proposition has a specific truth condition that is met or not met. | "Determinate" means **ontologically settled**. The world has not yet selected a branch, so the truth condition is undefined. | **Verbal/Genuine Hybrid.** CBF uses a semantic definition; COFI uses a metaphysical definition. |
  | **4. Excluded Middle (LEM)** | LEM holds universally: "Either there will be a battle or there will not" is True because **one disjunct is True**. | LEM holds for the disjunction but **fails for the disjuncts**. The disjunction is True because the set of all possible futures is settled, even if no single future is. | **Genuine.** Disagreement over logical compositionality (whether disjunction truth requires a true disjunct). |
  | **5. Omniscience** | An omniscient being **knows** the truth value of future contingents now. | An omniscient being **knows all that is knowable**; since future contingents are unknowable, the being knows they are indeterminate. | **Verbal.** Depends on the definition of "omniscience" (knowing all truths vs. knowing all facts). |

  ## III. THE CRUXES
  *Sub-questions where resolution would force a shift in position. Each includes a concrete testing case and advance predictions.*

  ### Crux 1: The Necessity Argument (Truth $\to$ Necessity)
  *Does the truth of a future proposition transfer necessity to the event?*
  *   **Concrete Case:** Assume "There will be a sea battle" is True now (Monday). On Tuesday, the battle happens. On Wednesday, is it now *necessary* that "It was true on Monday that there would be a battle"?
  *   **CBF Prediction:** No. It is a "soft fact" about the past. The truth on Monday depended on the contingent event on Tuesday. The necessity of the past applies only to "hard facts."
  *   **COFI Prediction:** Yes. If it was true on Monday, that truth is now a fixed property of Monday. If Monday is fixed, the truth on Monday is fixed, which entails the battle on Tuesday was fixed.
  *   **Move Condition:** If CBF cannot adequately distinguish "hard" vs. "soft" past facts without circularity, COFI wins. If COFI cannot explain how the past becomes fixed without fixing the future, CBF wins.

  ### Crux 2: Truthmakers for Future Contingents
  *Can a proposition be true without a present ontological ground?*
  *   **Concrete Case:** A genuinely random quantum decay is scheduled to be measured tomorrow. There is no physical state today that determines the outcome.
  *   **CBF Prediction:** The proposition "The particle will decay" is True or False now. The truthmaker is the **future event itself** (appealing to Eternalism). The lack of a *present* causal determinant is irrelevant to truth.
  *   **COFI Prediction:** The proposition has no truth value now. A truthmaker must exist *at the time of evaluation*. Since the future event does not exist, the proposition is gappy.
  *   **Move Condition:** If Eternalism (all times equally real) is proven incoherent, CBF loses their truthmaker. If Presentism (only now is real) is proven incoherent, COFI loses their truthmaker constraint.

  ### Crux 3: Excluded Middle vs. Bivalence (The Disjunction Test)
  *Can the whole be settled while the parts are not?*
  *   **Concrete Case:** Evaluate the sentence: "Either there will be a sea battle or there will not."
  *   **CBF Prediction:** This is True **because** one of the disjuncts is True. If neither disjunct has a truth value, the disjunction cannot be True (compositionality).
  *   **COFI Prediction:** This is True **even though** neither disjunct has a truth value. The disjunction covers the entire "branching" structure of reality, which is settled, even if the specific path is not.
  *   **Move Condition:** If it can be shown that logical connectives *must* be truth-functional (depend entirely on component truth values), COFI must abandon LEM. If it can be shown that LEM is valid in non-truth-functional semantics (e.g., supervaluationism), CBF must accept that Bivalence is not required for LEM.

  ### Crux 4: Metaphysical vs. Epistemic Indeterminacy
  *Is the openness in the world or in our access?*
  *   **Concrete Case:** An ideal observer (God/Angel) exists outside of time. Does this observer see the sea battle as already happened or as an open possibility?
  *   **CBF Prediction:** The observer sees the event as **tenselessly located**. From the atemporal view, the battle is "there" just as the past is "there." The openness is purely epistemic for humans.
  *   **COFI Prediction:** The observer sees the **branching structure**. The observer knows all branches but sees no single branch as "actual" yet. The openness is metaphysical, not just epistemic.
  *   **Move Condition:** If "temporal becoming" is shown to be objective (A-Theory), COFI gains ground. If "temporal becoming" is shown to be mind-dependent (B-Theory), CBF gains ground. This is the underlying metaphysical crux for (d).
