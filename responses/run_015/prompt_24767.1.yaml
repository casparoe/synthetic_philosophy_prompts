prompt: |-
  I'm writing a short paper and running a workshop session on the future-contingent problem, and I keep getting the sense that the two main camps have been arguing past each other since Aristotle's sea-battle case without ever actully writing down what they share. Could you draft the joint statement that a committed bivalence defender (the person who says a future contingent like "there will be a sea battle tomorrow" is already determinately true or false right now, we just can't tell which) and a committed open-future indeterminist (the person who says it's genuinely not yet either true or false, so bivalence simply doesn't apply to future contingents) could both put their names too after a good-faith adversarial collaboration?

  I want the claims both would sign, and I mean the substantive ones -- including about the sea-battle case itself and about what the dispute is even about, not just "we agree the problem is interesting" filler. Then the precise statements of where they still differ, each phrased so its own camp would accept the wording; this is the hard part and I suspect a lot of the apparent disagreement is just about what "determinate" and "indeterminate" mean, so please flag where the dispute is verbal versus genuine. Then the cruxes -- the sub-questions such that settling them would actually move at least one side. My guess is the big ones are (a) whether the necessity argument really goes through (the one that tries to show that if "there will be a sea battle" is true now, then the sea battle is necessary), (b) whether a future contingent can be true without any present truthmaker, (c) whether you can keep excluded middle at the disjunction level while dropping bivalence for each disjunct, and (d) whether the indeterminacy is metaphysical or just epistemic (the one that hooks into determinism and free will) -- but tell me if I'm missing a crux or if one of these is a fake. For each crux, give a concrete case or argument both camps would agree bears on it, and record what each side predicts or concedes about it in advance.

  Format it as a numbered agreed-claims section, then a disagreements table, then the cruxes with their cases and predictions. Please don't pad it with a reading list or name-dropping; I just want the shared ground and the residual disagreement made exact.
