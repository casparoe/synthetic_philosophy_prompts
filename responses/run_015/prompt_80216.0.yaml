      *   *Rival to analyze:* **Constitutive Normativity.** If the clause were a constitutive norm, the filing itself changes the status. The court wouldn't need to check "probable cause."
      *   *Alternative Rival:* **Pure Deterrence (Price Theory).** If it's just a price, the court enforces the price regardless of fairness.

      *   *Decision:* I will frame the current doctrine as presupposing **"Conditional Private Sanctioning Authority"** (a blend of contract and public policy). I will contrast this with **"Formal Constitutive Norms"** (where the act itself defines the status without judicial discretion) and **"Unrestricted Deterrent Threats"** (where the state enforces private penalties without merit review).
      *   *Focus:* The prompt asks about "Threat vs. Constitutive Norm." I should center the analysis there.
