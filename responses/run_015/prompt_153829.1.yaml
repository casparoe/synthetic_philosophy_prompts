  **1. The Setup and The Four Cells**

  Northland financial regulators enforce a compliance rule that blocks payment processing for Southland agricultural imports. We examine Southland farming households participating in this trade scheme who suffer a fixed income loss from either this rule or a natural storm. The loss event is complete, and any Northland rule has since been clarified, leaving only the financial shortfall. A sufficiency line marks the income level required for basic health and security.

  *   **Cell 1 (Rule, Below):** The compliance rule blocks the payment. Households lose income and finish below the sufficiency line. The rule is now clarified, but the loss remains. A transfer would restore income to the pre-loss level.
  *   **Cell 2 (Rule, Above):** The compliance rule blocks the payment. Households lose income but finish above the sufficiency line. The rule is now clarified, but the loss remains. A transfer would restore income to the pre-loss level.
  *   **Cell 3 (Natural, Below):** A storm destroys the import stock. Households lose income and finish below the sufficiency line. No Northland rule caused the loss. A transfer would restore income to the pre-loss level.
  *   **Cell 4 (Natural, Above):** A storm destroys the import stock. Households lose income but finish above the sufficiency line. No Northland rule caused the loss. A transfer would restore income to the pre-loss level.

  **2. Verdict Table**

  | View | Cell 1 (Rule, Below) | Cell 2 (Rule, Above) | Cell 3 (Natural, Below) | Cell 4 (Natural, Above) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Threshold** | **Yes.** Clause: Households are below the sufficiency line. | **No.** Clause: Households are above the sufficiency line. | **Yes.** Clause: Households are below the sufficiency line. | **No.** Clause: Households are above the sufficiency line. |
  | **No-Harm** | **Yes.** Clause: Northland rule caused the loss. | **Yes.** Clause: Northland rule caused the loss. | **No.** Clause: No Northland rule caused the loss. | **No.** Clause: No Northland rule caused the loss. |
  | **Shared-Scheme** | **Yes.** Clause: Co-participants in the scheme. | **Yes.** Clause: Co-participants in the scheme. | **Yes.** Clause: Co-participants in the scheme. | **Yes.** Clause: Co-participants in the scheme. |

  **3. Trial Result Statement**

  For the Threshold view, Factor 2 (Status) produces a significant main effect; Factor 1 (Cause) shows no effect. For the No-Harm view, Factor 1 (Cause) produces a significant main effect; Factor 2 (Status) shows no effect. For the Shared-Scheme view, neither factor produces an effect; the verdict is constant across all conditions. There are no interaction effects; the views operate independently on the factors.

  **4. Sensitivity Analysis**

  If you remove Factor 2 by setting all households above the line, the Threshold view collapses to "No" in all cells; the design loses the ability to detect its logic. If you remove Factor 1 by setting all causes to natural, the No-Harm view collapses to "No" in all cells; the design loses the ability to detect its logic. No cells become physically empty, but the variation required to distinguish the views disappears. The design requires variance in both factors to test all three views simultaneously.

  **5. The Honest Part**

  The No-Harm view looks worst in Cell 3 (Natural, Below). It mandates no transfer even though households fall below the sufficiency line, simply because Northland did not cause the storm. A defender would object that the design begs the question by treating all losses as candidates for justice. Their argument is that the counterfactual baseline is "no Northland interference," not "perfect safety." In Cell 3, Northland leaves households no worse off than Northland found them, so justice is satisfied even if welfare is low. The design treats this as a failure, but the No-Harm view defines it as a neutral outcome.

  **6. The Actual Question**

  This design shows the views are tracking different factors rather than rivaling over one duty. The Threshold view tracks Status; the No-Harm view tracks Cause; the Shared-Scheme view tracks Relation. In Cell 1 (Rule, Below), all three views agree on "Yes," but for genuinely different reasons (Sufficiency vs. Causality vs. Relation). This suggests the apparent disagreement in the literature is often people looking at different cells while assuming they are looking at the same problem. Agreement on the verdict does not imply agreement on the reason.

  **7. Confounding Check**

  You suspected Factor 2 cannot vary without dragging something else in. You are correct. To keep the loss size fixed while varying the post-loss status (Above vs. Below), the pre-loss wealth must vary. Households in the "Below" cells start closer to the line than those in the "Above" cells. This confounds "Post-Loss Status" with "Pre-Loss Wealth." I varied pre-loss wealth to achieve the design. This means a verdict driven by Factor 2 could theoretically be driven by a duty to the poorer pre-loss group rather than the post-loss threshold. The design isolates the threshold only if you assume pre-loss wealth differences are morally irrelevant, which is an additional assumption.
