      *   *What it lacks:* It looks too technical. It needs to be framed as "Trust in the system," not just "Trust in the tool."
      *   *Wait, the "Fabrication" point:* "Nobody treats faked numbers as a surprising result... they treat the person as outside the game." This fits calibration data perfectly. If the calibration fails, you fix it. If you faked it, you're out.
