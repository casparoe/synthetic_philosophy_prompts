      *Application:* If the calibration is off, we adjust (Auxiliary). If the calibration log is forged, the scientist is expelled (Hinge violation). This works well.

      *Let's refine the "Riverbed".* Hinges shift. Calibration standards change (e.g., redefining the Kilogram). This is a perfect example of a hinge shifting without the "game" ending.

      *Let's refine the "Kuhn/Bayes".*
