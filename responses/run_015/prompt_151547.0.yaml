answer: |-
  ### Research Agenda: Advancing the Philosophy of Supererogation (2025–2035)

  The philosophy of supererogation has reached a plateau. The classic "Paradox of Supererogation" (how an act can be best yet not obligatory) has been sufficiently addressed through satisficing consequentialism, optionality clauses, and threshold deontology. To advance the field over the next decade, research must shift from defending the *possibility* of supererogation to mapping its *structural boundaries* and *ontological scope*.

  The following agenda prioritizes three open problems. While one is logically upstream, the ranking reflects strategic priority: solving the downstream problems is the most viable heuristic for unblocking the upstream bottleneck.

  #### 1. Non-Reducible Collective Supererogation
  **Status:** High Priority / Underdeveloped
  **Core Question:** Can a group perform a supererogatory act that is not required of the group *and* not required of any individual member, without reducing to a mere aggregation of individual supererogatory acts?

  **Defense of Priority:**
  Moral life is increasingly collective (climate action, humanitarian aid, corporate ethics), yet supererogation theory remains methodologically individualistic. Current accounts typically treat group praise as the sum of individual praiseworthiness. This fails to capture cases where a group achieves a moral good through joint commitment that no single member could have achieved or been obligated to attempt alone. If supererogation theory cannot account for collective agency, it risks obsolescence in applied ethics.

  **Tractability:**
  *   **Conceptual:** High difficulty. Requires integrating literature on collective intentionality (e.g., Gilbert, Tuomela) with normative ethics. The challenge is defining a "group duty" that is distinct from individual duties without reifying the group to an implausible degree.
  *   **Empirical:** Moderate. Experimental philosophy could test whether laypeople attribute supererogatory status to groups differently than to individuals.

  **Dependency:**
  This problem is logically **downstream** from Problem 2 (The Threshold). One cannot determine if a group has exceeded duty without knowing where the group's duty ends. However, I prioritize this because the individualistic assumptions in Problem 2 are likely the *cause* of its stagnation. Solving Problem 1 forces a reconstruction of Problem 2.

  #### 2. The Contextual Threshold of Obligation
  **Status:** Foundational / Logically Upstream
  **Core Question:** How do capacity, cost, and social expectation dynamically shift the boundary between duty and supererogation?

  **Defense of Priority:**
  This is the conceptual engine of the field. You cannot have "beyond duty" without a robust theory of "within duty." Existing models (e.g., fixed cost thresholds) are too rigid to handle complex modern scenarios. A dynamic model is required to support both Collective and Epistemic supererogation. For instance, a group's capacity to absorb cost differs from an individual's; a believer's capacity to process evidence differs from an agent's capacity to perform physical acts.

  **Tractability:**
  *   **Conceptual:** Low tractability in isolation. Decades of work have yielded diminishing returns. It is prioritized second because it is best tackled *through* the lens of Collective and Epistemic cases rather than in the abstract.
  *   **Empirical:** High potential. Moral psychology research on how people perceive "demandingness" in varying contexts could inform normative thresholds.

  **Dependency:**
  This is the **upstream** condition for Problems 1 and 3. Any coherent account of collective or epistemic supererogation presupposes a metric for when obligation ceases. However, as noted, progress here is dependent on new data from the downstream applications.

  #### 3. Epistemic Supererogation and Normative Collapse
  **Status:** High Risk / High Reward
  **Core Question:** Does exceeding evidential obligations mark a genuine normative category, or does it collapse into prudential rationality or moral duty?

  **Defense of Priority:**
  This tests the universality of the supererogatory category. If supererogation applies to belief formation (e.g., investigating evidence beyond what is required for knowledge), it decouples the concept from voluntary action. If it does not apply, the concept is limited to the voluntary domain. The risk is "normative collapse": acts of intellectual excess may simply be moral duties (e.g., a doctor researching a rare disease) or prudentially irrational (wasting cognitive resources).

  **Tractability:**
  *   **Conceptual:** High difficulty. Hinges on the debate over doxastic voluntarism (can we choose our beliefs?). If beliefs are involuntary, "exceeding obligation" may be category mistake.
  *   **Empirical:** Low. Difficult to measure evidential effort distinct from cognitive ability.

  **Dependency:**
  **Downstream** from Problem 2. It requires a theory of *evidential duty* to determine what counts as *excess*. It is also partially dependent on Problem 1: if epistemic communities (research teams) are the primary agents of inquiry, Collective Supererogation may be a prerequisite for understanding Epistemic Supererogation.

  ---

  ### Dependency Map and Strategic Logic

  *   **Logical Flow:** Problem 2 (Threshold) $\rightarrow$ Problem 1 (Collective) & Problem 3 (Epistemic).
  *   **Strategic Flow:** Problem 1 (Collective) $\rightarrow$ Problem 2 (Threshold).

  **Rationale:** While Problem 2 is logically upstream, it is currently a bottleneck. Traditional individualistic approaches to the Threshold have stalled. By prioritizing Problem 1 (Collective Supererogation), researchers are forced to develop a new theory of Group Duty. This new theory will inevitably solve the Threshold problem for groups, which can then be adapted for individuals. Therefore, the agenda prioritizes the *application* (Collective) to unblock the *foundation* (Threshold).

  ### Deprioritization Agenda

  To allocate resources effectively, the following areas should be **deprioritized**:

  1.  **The Classic Paradox of Supererogation:**
      *   **Grounds:** *Limited Downstream Effect.* The debate over whether supererogation is compatible with maximizing consequentialism is mature. Further tweaks to "optionality" clauses yield diminishing returns.
      *   **Action:** Treat as settled background theory unless a new paradox emerges from the Collective or Epistemic domains.

  2.  **Meta-Ethical Realism regarding Supererogatory Properties:**
      *   **Grounds:** *Intractability.* Whether supererogatory value is mind-independent or constructed has little impact on normative classification.
      *   **Action:** Defer until normative structures (Problems 1–3) are solidified. Meta-ethics should follow normative theory, not lead it, in this specific subfield.

  3.  **Heroism and Saintliness as Distinct Categories:**
      *   **Grounds:** *Importance.* Distinguishing between "nice" supererogation and "heroic" supererogation is often merely lexical.
      *   **Action:** Subsume under the "Cost Condition" within Problem 2 (The Threshold). Do not treat as a separate ontological category.

  ### Triggers for Reordering

  This agenda is contingent on specific evidentiary thresholds. I would reorder priorities under the following conditions:

  1.  **Empirical Disconfirmation of Collective Agency:**
      *   **Evidence:** If experimental philosophy or social psychology demonstrates robustly that moral agents *cannot* cognitively process groups as single intentional agents (rather than aggregates).
      *   **Reorder:** Drop Problem 1 to #4. Shift focus entirely to refining the Individual Threshold (Problem 2).

  2.  **Resolution of Doxastic Voluntarism:**
      *   **Evidence:** If consensus emerges in epistemology that direct doxastic control is impossible (hard incompatibilism regarding belief).
      *   **Reorder:** Drop Problem 3. Epistemic supererogation would collapse into epistemic virtue theory, which is a distinct field.

  3.  **Breakthrough in Normative Thresholds:**
      *   **Evidence:** If a new model for the Duty/Option boundary (Problem 2) is proposed that successfully handles both individual and group cases without modification.
      *   **Reorder:** Promote Problem 2 to #1. If the foundational tool is fixed, it becomes the most efficient path to solving the applications.

  ### Conclusion

  The field must move beyond defending the existence of supererogation and toward mapping its topology. By prioritizing **Collective Supererogation**, we challenge the individualistic bias that limits current theory. By linking it to the **Threshold of Obligation**, we ensure conceptual rigor. By testing it against **Epistemic Supererogation**, we verify its normative scope. This triad offers the highest probability of generating novel, durable philosophical insights over the next decade.
