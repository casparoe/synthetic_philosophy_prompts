      *   Okay, I will recommend **Medium** and argue that the "Heavy > Medium" judgment was made in isolation, ignoring the systemic risk profile that made Light > Heavy.
      *   Strongest Objection: The panel already voted Heavy > Medium. Overruling that disenfranchises the scientific rigor argument.

      *Let's draft.*
      *   **Header:** To, From, Date, Subject.
      *   **Bottom Line:** Fund Medium.
