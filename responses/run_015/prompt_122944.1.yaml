answer: |-
  **MEMORANDUM**

  **TO:** Pilot-Grant Review Panel
  **FROM:** Panel Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on School-Based Reading Intervention Applications

  **Bottom Line:**
  I recommend the panel vote to fund the **Medium design** (40 schools, three waves, teacher surveys). Funding notifications should be issued by November 30.

  **Rationale:**
  Our deliberations revealed a preference cycle: we agreed Heavy is scientifically superior to Medium, and Medium to Light, yet Light is preferable to Heavy due to burden and privacy concerns. This intransitivity suggests we are facing a threshold effect rather than a linear trade-off. The move from Medium to Heavy introduces home visits—a qualitative shift in privacy risk and participant burden—that fundamentally alters the ethical calculus.

  While Heavy offers superior mechanistic data, the "Light > Heavy" comparison signals that home visits cross a risk threshold inappropriate for a pilot grant. Conversely, the "Medium > Light" comparison confirms that a single-year follow-up (Light) is insufficient for studying persistence. The Medium design sits at the highest point of scientific rigor that does not trigger the ethical veto associated with home visits. It captures longitudinal data without incurring the disproportionate dropout risk and privacy intrusion of the Heavy arm.

  **The Strongest Objection:**
  The most serious challenge to this recommendation is that it inconsistently applies our own criteria. We explicitly judged that Heavy is better than Medium regarding scientific yield. By choosing Medium, we are prioritizing administrative comfort over knowledge generation, effectively overruling our own expert judgment on validity.

  Critics will argue that if home visits are ethically problematic, we should have rejected Heavy immediately, not compared it favorably against Medium. If the risk is tolerable in Medium (two years, surveys), why is it intolerable in Heavy? If it is intolerable in Heavy, why does Medium beat Light? Selecting Medium splits the difference but fails to articulate a coherent principle. It risks satisfying no one: it is too burdensome for those prioritizing participant privacy (who prefer Light) and too weak for those prioritizing scientific mechanism (who prefer Heavy). If we cannot define why Medium is the "goldilocks" option without contradicting our pairwise comparisons, we are not solving the problem; we are masking it.

  **Path Forward:**
  Despite this objection, Medium remains the only viable option. Light is underpowered for our stated goal of studying long-run effects. Heavy introduces risks that threaten the study's completion (dropout) and community trust (privacy). Medium accepts a marginal loss in mechanistic insight compared to Heavy to secure a marginal gain in feasibility and ethics compared to Heavy, while securing the longitudinal power Light lacks.

  Please review this reasoning before our vote next Thursday. If you believe the "Heavy > Medium" scientific judgment should override the "Light > Heavy" ethical constraint, propose that amendment during the vote.

  **Timeline:**
  *   **Vote:** Next Thursday, October 31.
  *   **Notification:** Successful applicants notified by November 30.
  *   **Start Date:** January 1 (start of school term).
