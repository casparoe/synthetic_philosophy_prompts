      *Re-evaluating the Objection:* The prompt says "half the panel will be looking for exactly that [the strongest objection]." I need to make sure the objection section is robust.
      *   Objection: The cycle proves we lack a coherent value function. Picking Medium is just splitting the difference, not solving the problem. If Heavy is better than Medium, we should fund Heavy unless there's a veto constraint. If Light is better than Heavy, Heavy is out. But Medium is better than Light. So Medium wins? That's Condorcet. Medium beats Light. Heavy beats Medium. Light beats Heavy. Medium has 1 win, 1 loss. Heavy has 1 win, 1 loss. Light has 1 win, 1 loss. It's a perfect cycle.
