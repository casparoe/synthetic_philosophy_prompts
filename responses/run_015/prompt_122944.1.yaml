      *   Wait, prompt says "write the panel's decision memo." But also "circulate before we vote." This is slightly contradictory. I will treat it as a "Draft Decision & Rationale" to be reviewed *prior* to finalizing the vote, essentially setting the stage. Or better: "Memorandum of Recommendation." I'll stick to "Decision Memo" as requested but frame the content as "Proposed Decision."
