answer: |-
  This is a fantastic observation. Your reading group has stumbled onto a genuine tension in legal philosophy that maps surprisingly well onto the architecture of *The Theory of Moral Sentiments* (TMS).

  To answer your core question immediately: **Current American sentencing procedure treats sympathy as a contaminant to be excluded. Smith treats sympathy as the raw material to be refined.**

  Your friend (the "botched Impartial Spectator" view) and you (the "miscalibrated sympathy" view) are both capturing half of Smith's picture. The lawyer is right that it is incoherent *as stated*, but wrong that it doesn't reflect a view. It reflects a specific, somewhat confused view of moral psychology that tries to achieve Smithian ends (impartiality) using anti-Smithian means (suppression of feeling).

  Here is a breakdown of what this pattern presupposes, whether a Smithian could endorse it, and what a truly Smithian courtroom would look like.

  ### 1. Contaminant vs. Raw Material: What the Rules Presuppose

  The standard jury instruction ("do not be swayed by sympathy") presupposes that **sympathy is epistemically toxic.** It assumes that the "truth" of the sentence exists independently of emotional response, and that emotion acts like static on a radio line.

  Smith argues the opposite. For Smith, there is no moral truth *without* sentiment. We cannot judge merit or demerit without feeling approval or resentment. As he writes, "Reason and judgment are the sources of our moral approvals and disapprovals... [but] it is by feeling alone that we can approve or disapprove."

  So, the current legal rule commits the court to a Stoic or Kantian view (reason must conquer passion), while the *practice* (allowing Victim Impact Evidence) admits a Humean or Smithian reality (passion drives judgment).

  **Your view is the most Smithian here.** Smith explicitly argues that raw sympathy is miscalibrated. We feel more for the vivid, the near, and the high-status (the "finger vs. China" example). The court allows VIE because it knows the jury *needs* to feel the weight of the crime (demerit), but it instructs them to ignore that feeling because it knows that feeling is biased by proximity and vividness.

  The incoherence arises because the court tries to **subtract** the bias by subtracting the **mechanism**. It's like telling a photographer to remove the color cast from a photo by turning off the camera.

  ### 2. Can a Smithian Endorse the Package?

  A Smithian could endorse the *admission* of Victim Impact Evidence, but **could not endorse the jury instruction or the asymmetry.**

  **The Instruction:**
  A Smithian would say the instruction is impossible to follow and morally dangerous. You cannot tell a human to stop feeling. By telling them to ignore sympathy, you don't eliminate the bias; you just drive it underground. The jury will still feel resentment toward the defendant and grief for the victim, but now they feel guilty about it, or they cloak it in "legal reasoning."

  A Smithian instruction would not say "Ignore sympathy." It would say: *"Do not trust your immediate sympathy. Ask yourself: Would an impartial spectator, knowing all the facts about the victim AND the defendant, feel this same degree of resentment?"*

  **The Asymmetry (Victim IN, Defendant OUT):**
  This is the hardest part to justify Smithianly.
  *   **VIE** serves to establish the **Demerit** of the action. It helps the spectator feel the proper resentment against the harm done.
  *   **Mitigating Evidence** (defendant's background/family) serves to establish the **Propriety** of the agent. It helps the spectator understand the motives and pressures on the defendant.

  For Smith, just punishment requires a balance of these sentiments. We punish because we resent the motive (malice/negligence) and the harm. If you allow the jury to fully visualize the victim's loss (inflaming resentment) but restrict them from visualizing the defendant's humanity (dampening sympathy), you are systematically rigging the Impartial Spectator. You are ensuring the Spectator is *partial* to the victim.

  Smith writes that we naturally sympathize more with the sufferer than the agent. The legal asymmetry exploits this natural bias rather than correcting it. A Smithian would argue that to reach an impartial judgment, you must work *harder* to make the defendant's situation vivid, precisely because our natural sympathy is already tilted against the criminal.

  ### 3. Is There a Principled Reason for the Asymmetry?

  Legally, the asymmetry is often defended on grounds of **retributive focus**: the sentence should fit the *crime*, not the *criminal*. VIE elucidates the crime's impact; defendant background elucidates the criminal's life.

  From a Smithian view, this distinction collapses. Smithian justice is about the **propriety of the punishment relative to the demerit.** Demerit is a compound of the harm done *and* the motives of the agent.
  *   If the defendant killed out of cold malice, the Spectator's resentment is high.
  *   If the defendant killed out of desperate poverty or coercion, the Spectator's resentment is lower.

  You cannot judge the motives without the background evidence. Therefore, excluding defendant background evidence prevents the Spectator from accurately judging the *Merit/Demerit*.

  There is no strong Smithian principled reason for the asymmetry. It is likely an artifact of **procedural standing** (the state represents the victim; the defendant represents himself) and **political economy** (VIE is popular; defendant mitigation is often seen as "making excuses").

  *Legal Note:* I should mention that in *capital* cases, the Supreme Court (*Lockett v. Ohio*, *Eddings v. Oklahoma*) actually requires that mitigating evidence about the defendant's character and background *must* be allowed. However, in practice, VIE often emotionally overwhelms this mitigating evidence, and in non-capital sentencing guidelines, judicial discretion to consider such evidence is often more restricted. Your group's perception of the asymmetry is phenomenologically accurate even if the black-letter law is slightly more nuanced.

  ### 4. The Smithian Courtroom: Concrete Changes

  If a court took Smith's remedy (the Impartial Spectator) seriously, rather than the "Ignore Emotion" rule, here is what would concretely change:

  **A. Rewording the Instruction**
  *   *Current:* "You must not be swayed by sympathy, passion, or prejudice."
  *   *Smithian:* "You are expected to feel. Your judgment of justice depends on your sentiment. However, your natural sentiments are biased by vividness and proximity. You must correct your sentiments. Ask not what you feel right now, but what a well-informed, neutral person would feel if they knew the full history of both the victim and the defendant."

  **B. Restructuring Victim Impact Evidence**
  VIE would not be banned, but it would be **counter-balanced**. If the prosecution spends 20 minutes on a video tribute to the victim (maximizing vividness/sympathy), the defense must be granted equal latitude to present a "Life Impact Statement" regarding the defendant (maximizing vividness/sympathy for the agent).
  *   *Why:* Smith argues we need to bring sentiments to a "mean." If one side is vivid and the other abstract, the mean is impossible to find.

  **C. The Judge as Spectator-Modulator**
  Currently, judges rule on *admissibility*. In a Smithian court, judges would rule on *emotional proportionality*.
  *   If a prosecutor uses language designed to incite vengeance rather than justified resentment, the Smithian judge objects not because it's "prejudicial," but because it appeals to a *partial* spectator.
  *   Smith distinguishes between "just resentment" (which seeks the good of the whole and proportionate punishment) and "vengeance" (which seeks the suffering of the other for its own sake). The court would have to make findings on whether the evidence appealed to the former or the latter.

  **D. Sentencing Guidelines**
  Smith is skeptical of rigid rules because moral situations vary. A Smithian system might move *away* from rigid sentencing guidelines (which attempt to remove discretion/emotion) toward more discretionary sentencing, *provided* the judge writes an opinion explicitly detailing how they balanced the competing sympathies to reach the "Impartial" view.

  ### 5. Where is the Practice Underdetermined?

  There are areas where Smith's theory doesn't dictate a specific rule, which is important for your group to know so you don't over-read the text.

  1.  **Procedural Mechanics:** Smith doesn't care about hearsay rules or chain of custody. These are epistemic tools to ensure the Spectator is *well-informed*, but Smith doesn't specify *how* to verify information. Any system that maximizes truth-seeking is compatible with Smith.
  2.  **The Weight of Sympathy:** Smith says we should correct our sympathy, but he doesn't give a formula for how much weight to give the victim's family's grief vs. the defendant's children's loss. He admits this is a matter of "taste" and judgment. Two Smithian judges could legitimately come to different sentences because their "Impartial Spectator" internalization differs slightly.
  3.  **The Role of the State:** Smith views punishment as a natural human sentiment (resentment) that the magistrate channels. He doesn't clearly distinguish between the State's interest and the Victim's interest in the way modern law does. A Smithian theory might actually support restorative justice models (where victim and offender meet) more than retributive ones, because that allows for a mutual adjustment of sentiments, but it doesn't strictly *require* it.

  ### Summary for Your Group

  *   **The Lawyer** is right that it's incoherent, but wrong that it's meaningless. It's the incoherence of trying to use a Stoic tool (suppression) to fix a Smithian problem (bias).
  *   **Your Friend** is right that it's a botched Impartial Spectator. The court wants the Spectator's view but tries to get there by lobotomizing the juror.
  *   **You** are right that Smith acknowledges the bias. But Smith's solution is *correction through imagination*, not *suppression through instruction*.

  **The Verdict:** A Smithian could not endorse the current package without cheating. To be consistent, a Smithian court would treat sympathy as the engine of justice, not the enemy. It would allow all evidence that makes the parties fully human (both victim and defendant) and instruct the jury to **harmonize** their feelings, not silence them. The goal would not be a dispassionate verdict, but a **properly passionate** one.

  If you want to push the discussion further, ask the group: *If the goal is "Proper Passion" rather than "Dispassion," does that make the jury more like a judge, or does it make the judge more like a therapist?* That usually gets the history and econ people really going.
