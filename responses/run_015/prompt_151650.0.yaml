prompt: |-
  I'm in a reading group that's slowly grinding through Adam Smith's Theory of Moral Sentiments — nobody in it is a philosopher, we're mostly history and econ people plus one retired lawyer — and we got completely sidetracked onto something and I've been chewing on it ever since, so I figured I'd ask here.

  Here's the thing that set us off. As I understand american criminal procedure (and I'm happy to be corrected if I've got the details wrong, I think it varies a lot by state), courts do three things at once that don't obviously fit together. At the sentencing stage, and especially in capital cases, they let the prosecution put on what's called victim impact evidence: family members get up and describe who the dead person was, what the loss has been like, the kids left behind. Then the judge turns around and instructs the jury that it has to decide on the evidence and the law and must not be swayed by sympathy, passion, or prejudice. And on the other side of the case there are whole categories of evidence about the defendant's own background and about what a sentence will do to his family that mostly get kept out. So the institution deliberately makes one person's suffering vivid to the decision-makers, then tells them that the vivid fellow-feeling it just produced must not do any work, and meanwhile blocks the symmetrical attempt to make the other side's situation vivid.

  Our retired lawyer says this is just incoherent lawyering and doesn't reflect any view of anything. But the rest of us got into an argument about whether it actually presupposes something about sympathy. One friend's view: it's Smith's impartial spectator turned into law by people who half understood it, because for Smith moral judgment just is what you get when you imagine someone else's situation and then check that feeling against the standpoint of a well-informed observer — so an instruction to discount sympathy is like an instruction to stop perceiving, and the court can't really believe both halves of what it's doing. My view, which I couldn't defend very well: it's not incoherent, because Smith also thinks uncorrected sympathy is systematically miscalibrated — he says somewhere that a man in Europe would lose more sleep over his own little finger than over news of a catastrophe that killed millions in China, even though he wouldn't trade the one for the other, and he makes a lot of the fact that we feel with the rich and the great much more readily than with the poor. So you can think fellow-feeling is the mechanism of moral judgment and still think some particular bit of it is noise, and maybe that's all the court is doing.

  So: what does this pattern of rules presuppose about sympathy? Does it commit anyone to thinking fellow-feeling is a contaminant of judgment rather than the raw material of it, or could someone with a Smithian view — or just someone who thinks moral judgment needs emotional input — endorse the whole package without cheating? Is there a principled reason, on any view of sympathy, for letting the victim's side in and keeping the defendant's out, or is that asymmetry just an accident of who has standing? And the bit I actually care about most: if a court took Smith's own remedy seriously — the internal standpoint of a well-informed, impartial observer rather than a blunt instruction to discount feeling — what would concretely have to change in the courtroom? Would victim impact evidence come in differently, would more of the defendant's story come in, would the instruction be reworded in a way that matters, or would it all just collapse back into what we already do? I'd also like to know where the practice is simply underdetermined, i.e. where several different theories of sympathy would all license exactly the same rules and there's no fact of the matter to recover.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** A reading group (history, econ, law backgrounds, not philosophers) reading Adam Smith's *The Theory of Moral Sentiments* (TMS).
      *   **The Trigger:** A perceived inconsistency in American criminal procedure (specifically sentencing/capital cases).
          *   *Feature 1:* Victim Impact Evidence (VIE) is allowed (makes victim's loss vivid).
          *   *Feature 2:* Jury instructions say "do not be swayed by sympathy/passion."
          *   *Feature 3:* Defendant's background/family impact evidence is often restricted (especially in capital sentencing, though *Lockett v. Ohio* complicates this, the user's perception is the starting point).
      *   **The Group's Debate:**
          *   *Lawyer:* It's just incoherent lawyering, no philosophical depth.
          *   *Friend:* It's a botched application of Smith's "Impartial Spectator." Telling jurors to ignore sympathy is like telling them to stop perceiving.
          *   *User (OP):* It's not incoherent. Smith admits sympathy is miscalibrated (finger vs. China earthquake, bias toward rich). Courts might be filtering "noise" from the "signal."
      *   **The Questions:**
          1.  What does this pattern of rules presuppose about sympathy? (Contaminant vs. Raw Material?)
          2.  Can a Smithian (or emotion-based moral theorist) endorse this package without cheating?
          3.  Is there a *principled* reason for the asymmetry (Victim IN, Defendant OUT), or is it just standing?
          4.  **Crucial:** If a court took Smith's remedy (Impartial Spectator) seriously, what would *concretely* change in the courtroom? (VIE handling, Defendant's story, Jury instructions?)
          5.  Where is the practice underdetermined by theory?

  2.  **Initial Fact-Checking & Legal Nuance (Crucial Step):**

      *   *Victim Impact Evidence (VIE):* Allowed in capital cases since *Payne v. Tennessee* (1991). Before that, *Booth v. Maryland* (1987) barred it.
      *   *Defendant's Mitigating Evidence:* Actually, in capital cases, the Supreme Court (*Lockett v. Ohio*, *Eddings v. Oklahoma*) requires that the sentencer *not* be precluded from considering *any* relevant mitigating evidence, including character, background, and family impact. So the user's premise that defendant's family impact is "mostly kept out" is legally shaky in capital sentencing, though practically it might feel that way compared to the emotional punch of VIE. In non-capital sentencing, guidelines often restrict this. I need to address this nuance without pedantically shutting down the philosophical question. The *perception* of asymmetry is the philosophical hook.
      *   *Jury Instructions:* "Do not be swayed by sympathy" is standard.
      *   *Smith's TMS:* Key concepts: Sympathy (fellow-feeling), Propriety, Merit/Demerit, Impartial Spectator.

  3.  **Analyzing the Smithian Framework:**

      *   *Sympathy as Mechanism:* For Smith, morality *starts* with sympathy. It's not a contaminant; it's the engine.
      *   *The Problem of Bias:* Sympathy is naturally biased (proximity, vividness, status).
      *   *The Solution:* The Impartial Spectator. This isn't "no emotion." It's *corrected* emotion. It's imagining what a neutral, well-informed person would feel.
      *   *Application to Court:*
          *   VIE creates vividness (triggers sympathy).
          *   Instruction says "ignore sympathy."
          *   *Smithian Critique:* The instruction is wrong. You can't ignore sympathy. You must *correct* it.
          *   *Asymmetry:* Smith cares about "Merit" (reward) and "Demerit" (punishment). Punishment requires resentment against the agent. VIE fuels resentment. Mitigating evidence fuels sympathy for the agent. Smith wants a balance of sentiments approved by the Spectator.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the group's insight. It's a great question. Acknowledge the legal nuance (mitigating evidence is technically allowed but often overshadowed).
      *   **Q1: Contaminant vs. Raw Material:**
          *   The current legal instruction treats sympathy as a *contaminant* ("do not be swayed").
          *   Smith treats it as *raw material* that needs *refining*.
          *   The lawyer is half-right (it's incoherent *if* you think sympathy is the enemy), but the friend is also half-right (it's a botched Spectator).
          *   OP's view is the strongest Smithian one: Sympathy is necessary but biased. The law tries to filter bias but mistakenly tries to filter the mechanism itself.
      *   **Q2: Can a Smithian endorse the package?**
          *   Not the *instruction* as written.
          *   Maybe the *rules of evidence* if viewed as "managing bias."
          *   The asymmetry (Victim IN, Defendant OUT) is hard to justify Smithianly. Smith cares about the propriety of the *agent's* motives too. Ignoring the defendant's suffering prevents the Spectator from fully judging the *propriety* of the punishment.
      *   **Q3: Principled Reason for Asymmetry?**
          *   Legal theory: Retribution focuses on harm done (Victim).
          *   Smithian theory: Punishment is about resentment of the *agent's* motive. VIE inflames resentment. Mitigating evidence cools it.
          *   If the goal is "Just Resentment," you need both. Excluding defendant info leads to excessive resentment (biased Spectator).
          *   So, no strong Smithian principled reason for the asymmetry. It's likely political/procedural (standing).
      *   **Q4: The "Smithian Courtroom" (The Core Question):**
          *   *Jury Instruction:* Change from "Ignore sympathy" to "Correct your sympathy." Imagine what a neutral observer would feel knowing all facts.
          *   *Evidence:* Broaden both. VIE is okay *if* balanced by Mitigating evidence. The goal is to bring the jury's sentiment to the "mean" of the Impartial Spectator.
          *   *Role of Judge:* The Judge acts more like a moderator of the Spectator, ensuring the jury isn't swayed by *improper* biases (like race, wealth) rather than *all* emotion.
          *   *Concrete Change:* More narrative on both sides. Instruction focuses on "Propriety" rather than "Dispassion."
      *   **Q5: Underdetermination:**
          *   Where theory doesn't dictate procedure.
          *   E.g., Specific weighting of evidence. Smith doesn't give a formula.
          *   Procedural rules (hearsay, etc.) are mostly pragmatic, not moral.
          *   The exact line between "proper resentment" and "vengeance" is fuzzy even for Smith.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction on Law:* I must be careful not to say the user is legally wrong about mitigating evidence. In *capital* cases, *Lockett* says it must be allowed. But in practice, judges limit it, and VIE often drowns it out. I should frame it as "The *weight* and *vividness* are asymmetrical," rather than "Defendant evidence is banned."
      *   *Smith's "China vs. Finger":* Use this to explain *why* the instruction exists (fear of bias) but why the *method* (suppression) is un-Smithian.
      *   *The "Impartial Spectator" in Court:* The jury *is* supposed to be the Impartial Spectator. The instruction tells them to be a robot. Smith tells them to be a wise human.
      *   *Resentment:* Smith's theory of punishment is key. Punishment is the natural outcome of justified resentment. VIE amplifies resentment. Mitigating evidence checks it. A Smithian system wants *justified* resentment, not *maximized* resentment.

  6.  **Final Polish:**

      *   Tone: Respectful, intellectual, engaging with the specific TMS concepts.
      *   Structure: Address each of the user's sub-questions clearly.
      *   Conclusion: Summarize the main takeaway (The law treats sympathy as a bug; Smith treats it as a feature with bugs).

  7.  *(Final check against specific prompts)*:
