      *   (2) & (3): If determinism doesn't matter (because we can't take the objective stance), why does *manipulation* matter? Manipulation is often just determinism with a manipulator. If the causal history doesn't matter in normal determinism, why does it matter in manipulation? (The "Intuition Pump" problem).
