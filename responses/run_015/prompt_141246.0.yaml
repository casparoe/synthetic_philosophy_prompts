      *   (4) **Reject Basic Argument:** No need for *causa sui* (ultimate sourcehood). Impossible standard.
      *   (5) **Methodological Naturalism/Practice-First:** Distrust far-out intuitions. Theory answerable to actual practice, not sci-fi.
