          *   *Conflict:* This is the "Zombie/Judgment Proof" problem. If determinism is true (2), our actions are caused by prior states + laws. In manipulation (3), actions are caused by prior states + laws + manipulator. If the causal chain in (2) doesn't undermine responsibility, why does the specific *source* of the causal chain in (3) undermine it?
