      *   *Recommendation:* Revise (5) or (3)? Actually, the strongest tension is (3) vs (5). If the user values the "practice-first" approach (1, 2, 5), then (3) is the outlier. However, (3) is often the "compatibilist's last stand."
      *   *Better Recommendation:* Revise **(3)**. Change it from relying on "standard covert-manipulation cases" (which are sci-fi) to relying on "actual cases of coercive control/indoctrination." This satisfies (5) while keeping the historical insight of (3).
