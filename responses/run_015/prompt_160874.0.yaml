answer: |-
  This configuration has an established name in the philosophy of language and law: **metalinguistic negotiation**. In legal practice, it is often untreated, functioning as a **dispute over precedential classification**.

  **What the thing is**
  The phenomenon is a disguised normative choice framed as a factual description. Parties agree on the non-linguistic facts (the claimant's actions, the payment amount) and the immediate outcome. They disagree on which *concept* should govern those facts because the concept carries "normative momentum." By insisting the classification is a matter of fact ("this *is* a penalty"), a party attempts to lock in downstream inferences (proportionality review, criminal analogies) without admitting they are making policy. They resist stipulation because stipulation admits choice, weakening the claim that the downstream consequences are logically necessitated by the nature of the thing itself.

  **Edges and Boundaries**
  The edge of this pattern lies in the denial of choice.
  *   **It is not a verbal dispute:** In a true verbal dispute, parties use the same word with different senses (e.g., "bank" of a river vs. financial "bank"). Here, they share a sense but disagree on whether the facts satisfy it, driven by the consequences of satisfaction.
  *   **It is not ordinary policy argument:** In policy arguments, parties admit they are weighing costs and benefits. Here, they insist they are describing reality.

  **The Three Instances**
  All three instances fit the pattern perfectly.
  1.  **Penalty vs. Condition:** The dispute is not about the money lost now, but whether the concept "penalty" imports human-rights constraints later.
  2.  **Fraud vs. Error:** The dispute is not about recoverability, but whether the concept "fraud" licenses criminal sanctions and public shaming later.
  3.  **Work vs. Training:** The dispute is not about the current placement, but whether the concept "work" triggers labor protections upon expansion.
  In each, the classification is a vehicle for transporting norms from one context to another.

  **Descriptive vs. Evaluative Terms**
  The phenomenon does **not** depend on the terms being evaluative (like "fraud" or "penalty"). It arises equally with flat administrative classifications (e.g., "in work" vs. "not in work"), provided the category carries downstream consequences. The mixture of descriptive and evaluative content is a common accompaniment because such terms naturally drag normative inferences, but it is not the explanation. The explanation is the **precedential externality**: the classification in Case A determines the rules for Case B. If an administrative label determines eligibility for a future pilot scheme, arguing over that label is structurally identical to arguing over "fraud."

  **The Metaphysics Analogy**
  You are correct that metaphysicians worry about this. It is the same thing in another register. Rudolf Carnap distinguished between **internal questions** (answered within a framework) and **external questions** (about which framework to adopt). Your parties are arguing an external question (which framework/concept to adopt for the regime) while pretending it is an internal question (what the facts are within the current framework). The "sophisticated move" you mention—acknowledging the question is about framework adoption—is precisely what the parties resist, because admitting it surrenders the claim that the downstream consequences are inevitable.

  **Boundary Cases**
  To tighten the definition, consider these boundaries:

  *   **Looks like the pattern, but is not:** A dispute over a definition where neither side cares about downstream consequences. For example, two clerks argue whether a form is "Type A" or "Type B" simply because they were taught different definitions in training, and the filing cabinet label is the only stake. This is a pure verbal dispute or error, not a negotiation over normative gravity. There is no "real but not local" stake.
  *   **Is the pattern, but does not look like it:** A sentencing hearing where the dispute is whether a prior conviction counts as a "strike." The consequences are immediate (longer sentence), not deferred to future cases. It looks like ordinary legal argument because the stakes are local. However, if the judge's reasoning defines what counts as a "strike" for all future defendants, the structure is identical to your pattern: a classification dispute driven by normative momentum, masked as factual application. The only difference is the temporal proximity of the consequences.

  **Summary**
  You are witnessing **metalinguistic negotiation**. The parties are not arguing about the world; they are arguing about which conceptual tool should be used to cut the world, because the tool determines the shape of future cuts. They mask this as description to secure the tool's authority. Recognizing this does not dissolve the argument, but it clarifies that the resolution requires a decision about future policy, not a discovery of present fact.
