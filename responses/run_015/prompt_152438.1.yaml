prompt: |-
  Before I evaluate competing philosophical analyses of causation by omission, I want a rigorous specification of adequacy conditions. Write the desiderata that any theory of negative causation must satisfy to be viable: the explanatory targets it must hit, the hard cases it must classify correctly, the conceptual distinctions it must preserve, and the puzzles or paradoxes it must dissolve—each paired with the specific consideration or scenario that motivates it. Be sure to cover: (i) the clinical omission, in which a physician's failure to administer an available antidote is treated as causally responsible for death; (ii) the joint-protocol double omission, in which two gatekeepers each fail to perform complementary checks required by a shared rule, so that neither individual failure is sufficient for harm but the collective absence produces it; and (iii) the structural gap case, in which harm follows from an institutional absence of obligation—no particular agent was required to act—yet a normative baseline makes it plausible to speak of an omission rather than mere non-occurrence. For each desideratum, indicate whether you take it to be non-negotiable for any theory meant to ground moral or legal responsibility, and flag any tension between demands—especially between treating omissions as genuine causal relata and anchoring them in identifiable agent-level obligations. Conclude with a brief comparative assessment: how a counterfactual-dependence account, a normative-default theory, and an interventionist framework each perform against the list, noting where each succeeds and where it is forced to abandon a desideratum. Do not provide bibliographies, reading lists, or citations; work from the conceptual structure alone.
