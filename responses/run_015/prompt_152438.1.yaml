answer: |-
  # Adequacy Conditions for Theories of Causation by Omission

  To be viable, a theory of negative causation must navigate the gap between metaphysical description and normative evaluation. It must explain how "nothing" can produce "something" without collapsing into the claim that everything not-prevented is a cause. The following desiderata specify the necessary conditions for such a theory, categorized by their functional role.

  ### I. Explanatory Targets
  *These conditions ensure the theory captures the standard intuitions regarding individual agency and duty.*

  **1. The Duty-Capacity Alignment Condition**
  *   **Motivating Scenario:** *The Clinical Omission.* A physician fails to administer an available antidote, and the patient dies.
  *   **Specification:** The theory must identify the omission as a cause only when the agent possessed both the specific capability to perform the action and a contextual expectation (duty) to do so. It must exclude the omission of an incapable agent or an agent with no contextual standing.
  *   **Status:** **Non-Negotiable** for legal/moral responsibility. Without this, causation becomes unmoored from accountability.
  *   **Tension Flag:** High. This condition imports normative criteria (duty) into a metaphysical relation (causation), risking the conflation of "causing" with "being to blame."

  **2. The Counterfactual Sensitivity Condition**
  *   **Motivating Scenario:** *The Clinical Omission.* Had the physician administered the antidote, the patient would have lived.
  *   **Specification:** The theory must preserve the intuition that the omission is causal because the outcome *depended* on the absence of the action. If the outcome would have occurred regardless of the action (e.g., the antidote was ineffective), the omission is not a cause.
  *   **Status:** **Non-Negotiable.** This is the core intuitive link between omission and effect.
  *   **Tension Flag:** Low internally, but creates tension with the Proliferation Block (see below), as counterfactual dependence is ubiquitous.

  ### II. Hard Cases
  *These conditions test the theory against complex structural scenarios where simple duty-capacity models fail.*

  **3. The Conjunctive Sufficiency Condition**
  *   **Motivating Scenario:** *The Joint-Protocol Double Omission.* Two gatekeepers (A and B) must each perform a check. Neither checks. Harm occurs. Neither omission alone was sufficient for the harm; only the joint absence was.
  *   **Specification:** The theory must classify both individual omissions as partial causes without implying that either was individually sufficient. It must handle the logic of conjunctive negative causation (Not-A AND Not-B → Harm) without reducing the causal weight of either agent to zero.
  *   **Status:** **Non-Negotiable** for collective responsibility contexts.
  *   **Tension Flag:** Medium. Standard counterfactual accounts often struggle here (if A had acted, harm might still have occurred if B didn't), potentially exonerating both via overdetermination logic.

  **4. The Systemic Baseline Condition**
  *   **Motivating Scenario:** *The Structural Gap Case.* Harm follows from an institutional absence of obligation (e.g., no safety regulator was assigned, though industry norms suggested one was needed). No particular agent was required to act.
  *   **Specification:** The theory must allow for "causation by omission" at the systemic level even when no specific agent-level duty existed. It must distinguish between a "mere non-occurrence" (rain didn't fall) and a "structural omission" (no regulatory body existed) based on a normative baseline of expected function, not just individual obligation.
  *   **Status:** **Negotiable** for individual liability, but **Non-Negotiable** for institutional analysis.
  *   **Tension Flag:** High. This directly conflicts with the Duty-Capacity Alignment Condition. If no agent had a duty, who or what is the causal relata? This demands a shift from agent-causation to system-causation.

  ### III. Conceptual Distinctions
  *These conditions ensure the theory does not collapse distinct concepts.*

  **5. The Omission vs. Non-Occurrence Distinction**
  *   **Motivating Consideration:** *The Proliferation Problem.* The President did not feed a starving child overseas. This is a non-occurrence, but intuitively not the relevant omission in a specific causal chain.
  *   **Specification:** The theory must provide a principled cutoff between relevant omissions (causes) and irrelevant non-occurrences (background conditions). It cannot treat all absences of preventions as equal causal relata.
  *   **Status:** **Non-Negotiable.** Without this, causation becomes trivial (everyone causes everything by not preventing it).
  *   **Tension Flag:** Critical. This is the primary source of friction between metaphysical and normative accounts. Metaphysical accounts struggle to limit the scope; normative accounts struggle to keep it causal.

  **6. The Causation vs. Responsibility Distinction**
  *   **Motivating Consideration:** *Excusable Omissions.* A physician fails to save a patient due to a sudden blackout (no fault), yet the failure to save is still the cause of death, even if not blameworthy.
  *   **Specification:** The theory must allow that an omission can be a *cause* without necessarily entailing *moral fault*. Causation is the grounding for responsibility, not identical to it.
  *   **Status:** **Non-Negotiable.** Conflating the two renders legal defense impossible (one cannot argue "I caused it but wasn't negligent" if causation implies negligence).
  *   **Tension Flag:** High. Theories that rely on "breach of duty" to define omission causation often violate this, making causation parasitic on culpability.

  ### IV. Puzzles and Paradoxes
  *These conditions require the theory to resolve known logical difficulties.*

  **7. The Preemption Resolution**
  *   **Motivating Scenario:** *Early Preemption.* Physician A fails to treat. Physician B was ready to treat but also failed. If A had treated, B would not have.
  *   **Specification:** The theory must identify the primary omission (A) as the cause even if a backup omission (B) existed, provided A's omission was the operative factor in the actual sequence.
  *   **Status:** **Negotiable** (depends on granularity of legal theory), but desirable for metaphysical completeness.
  *   **Tension Flag:** Medium. Requires a robust account of causal processes, which is difficult for "nothing" events.

  **8. The Temporal Location Constraint**
  *   **Motivating Consideration:** *When did the cause happen?*
  *   **Specification:** The theory must assign a temporal location to the omission (e.g., the time the action *should* have occurred), not merely the time the effect occurred.
  *   **Status:** **Non-Negotiable** for statute of limitations and alibi verification.
  *   **Tension Flag:** Low.

  ---

  ### Analysis of Tensions

  The central tension lies between **Desideratum 1 (Duty-Capacity)** and **Desideratum 5 (Proliferation Block)** versus **Desideratum 6 (Causation vs. Responsibility)**.

  To solve the Proliferation Problem (5), a theory must restrict which omissions count as causes. The most effective way to do this is to appeal to norms or duties (1). However, if duties define causation, it becomes difficult to maintain the distinction between causation and responsibility (6). If an omission is only a cause *because* it was a breach of duty, then an excusable omission (e.g., unavoidable incapacity) risks being classified as "not a cause," which undermines the explanatory structure of legal defense (where one admits causation but denies culpability).

  Furthermore, **Desideratum 4 (Structural Gap)** creates tension with **Desideratum 1**. The Clinical case requires an identifiable agent with a duty. The Structural case explicitly lacks an agent with a duty. A unified theory must either posit a "fictional agent" (the institution) or decouple omission causation from individual obligation entirely, which weakens its utility for grounding individual moral responsibility.

  ---

  ### Comparative Assessment of Frameworks

  **1. Counterfactual-Dependence Account**
  *   **Performance:** Strong on *Counterfactual Sensitivity* and *Temporal Location*. It handles the *Clinical Omission* well (if the doctor acted, death would not have occurred).
  *   **Failures:** It catastrophically fails the *Proliferation Block*. Since the President's inaction is also counterfactually linked to the starving child's death (if he sent food, child lives), it treats all preventions as causes. It also struggles with the *Joint-Protocol* case; if A's action wouldn't have prevented harm without B's action, A's omission may not register as a cause under strict dependence tests.
  *   **Verdict:** Metaphysically robust but normatively useless without external pruning.

  **2. Normative-Default Theory**
  *   **Performance:** Excellent on *Duty-Capacity* and *Proliferation Block*. It solves the President problem by noting the President had no specific duty to that specific child. It handles the *Clinical Omission* perfectly by anchoring it in professional standards.
  *   **Failures:** It struggles with the *Structural Gap*. If no obligation existed institutionally, the theory denies the omission occurred, contradicting the intuition that the system failed. Crucially, it risks violating the *Causation vs. Responsibility Distinction*. If a breach of norm is required for the causation to exist, excusable omissions become metaphysically impossible.
  *   **Verdict:** Normatively precise but metaphysically circular; conflates "wrongful" with "causal."

  **3. Interventionist Framework**
  *   **Performance:** Strong on *Joint-Protocol* and *Structural Gap*. By modeling the system as variables (Gatekeeper A, Gatekeeper B, Safety Protocol), it can show how setting variables to "null" produces the harm, even without specific agents. It handles conjunctive causation naturally.
  *   **Failures:** It struggles with *Duty-Capacity Alignment*. An intervention is a theoretical manipulation, not necessarily a moral obligation. It can identify that "lack of a guardrail" caused the fall, but it cannot easily distinguish between "no guardrail was installed" (omission) and "no guardrail existed in nature" (non-occurrence) without importing external normative baselines. It is also abstract regarding *Agent-Level Obligations*, making it harder to map directly to individual legal liability.
  *   **Verdict:** Best for systemic/structural analysis, but requires normative supplementation to ground individual responsibility.

  **Summary:** No single framework satisfies all non-negotiable desiderata without tension. The Counterfactual account fails selectivity; the Normative account fails the causation/responsibility distinction; the Interventionist account fails agent-specific anchoring. A viable hybrid must likely use an Interventionist structure to identify causal pathways (solving Joint and Structural cases) while layering a Normative filter to assign agency and liability (solving Clinical and Proliferation cases), while carefully maintaining that the filter selects *responsible* causes from the set of *existing* causal omissions.
