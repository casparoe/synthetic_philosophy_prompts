answer: |-
  This is a sophisticated and well-posed problem. You are engaging with what is arguably the central aporia in contemporary democratic theory. Your proposed distinction between procedural and substantive affect is intuitive and mirrors moves made by proponents of the "all-subjected principle" (ASP), but your specific framing of it as a *bootstrapping* mechanism invites specific scrutiny.

  Here is an analysis of whether your resolution breaks the circle, how it interacts with the existing literature, and an assessment of the distinction's utility.

  ### 1. Does this break the circle, or push it back?

  Your claim rests on the assertion that the **procedural criterion** (effective political control/jurisdiction) is "non-democratic" and therefore can be applied without presupposing the *demos*. This is the vulnerable point.

  **The "Fact/Value" Problem of Control**
  You argue that "effective control" is a factual, pre-political condition. However, in political philosophy, "jurisdiction" or "effective control" is rarely a brute sociological fact; it is a normative status.
  *   **Who identifies the controller?** To say Person A is under the "effective control" of Polity B, we must already have a conception of what constitutes Polity B. If Polity B is defined by its current institutional boundaries, you are using the *existing* (potentially illegitimate) *demos* to define the *new* (legitimate) *demos*. This is the circularity you are trying to avoid.
  *   **Is power enough?** If "effective control" means mere coercive capacity (a gang controls a neighborhood), does that grant the gang democratic legitimacy over the neighborhood? If not, then "control" must mean *legitimate authority*. But if it means legitimate authority, you have imported the normative justification you were supposed to be deriving.
  *   **The Boundary of Control:** Control is a matter of degree. Does a tourist feel "effective control"? Does a remote worker paying no taxes? Determining the *threshold* of control sufficient for inclusion is itself a decision that requires a prior standard.

  **Verdict:** You likely **push the circle back** rather than breaking it. You move the question from "Who should decide?" to "Who is effectively controlled?" But the answer to the latter often depends on prior decisions about borders, enforcement, and recognition made by the very polity whose legitimacy is in question.

  **Suggestion:** Instead of claiming the procedural criterion is "non-democratic" (which implies it needs no democratic justification), frame it as **provisionally foundational**. Acknowledge that all democratic systems must start from *some* historical/status quo boundary (a "constitutional moment" problem), and your procedural criterion offers the most stable *default* position from which democratic self-correction (the substantive criterion) can occur. This admits the circularity but argues it is *virtuous* or *pragmatic* rather than vicious.

  ### 2. Standard Objections and Literature

  Your framing engages with the "All-Affected Interests" (AAI) vs. "All-Subjected Principle" (ASP) debate. Here is how your draft interacts with key objections:

  **A. Frederick Whelan (1983) – *Democratic Theory and the Boundary Problem***
  *   **The Objection:** Whelan argues that any principle used to define the *demos* must itself be democratically justified, leading to an infinite regress.
  *   **Your Dodge:** You attempt to stop the regress by appealing to a non-democratic fact (control).
  *   **Critique:** Whelan would argue that accepting a non-democratic fact as the basis for the *demos* surrenders the democratic claim to legitimacy. If the initial boundary is set by force or fact (control) rather than right, the resulting polity is legitimate only if the "substantive refinement" is infinitely flexible. You need to address whether the "procedural" starting point can be *wrong* (e.g., colonial borders).

  **B. Arash Abizadeh (2008) – *Democratic Theory and Border Closures***
  *   **The Objection:** Abizadeh argues that border coercion is itself a democratic decision that requires justification *to those coerced*.
  *   **Relevance to You:** Your "procedural" criterion relies on "effective control." Abizadeh would argue that the *exertion* of that control (border enforcement, policing) is only legitimate if the controlled already have a say. Using control to justify inclusion validates the coercion before the inclusion happens.
  *   **Potential Fix:** You might argue that your "substantive refinement" phase allows for the challenge of the control itself. However, if the initial *demos* (based on control) votes *against* expanding to include those they control but exclude, your system permits illegitimate exclusion.

  **C. David Miller (2009) – *Democracy's Domain***
  *   **The Objection:** Miller defends a version of the ASP (all subject to coercion) against AAI. He acknowledges the boundary problem but argues we must rely on existing political communities as the starting point.
  *   **Alignment:** Your view is very close to Miller's.
  *   **The Trap:** Miller admits this is a pragmatic concession, not a theoretical solution. If you claim your solution *theoretically breaks the circle*, Miller's critics (like Goodin) will say you are just disguising a status-quo bias as a procedural necessity.

  **D. Robert Goodin (2007) – *Enfranchising All Affected Interests***
  *   **The Objection:** Goodin argues AAI is the only morally defensible principle, but admits it is indeterminate.
  *   **Relevance:** Goodin would challenge your "procedural" category. Being subject to jurisdiction *is* a substantive interest (the interest in security, non-arrest, etc.). Collapsing this into "procedural" might obscure the moral weight of the initial inclusion.

  ### 3. Is the Procedural/Substantive Distinction Worth Keeping?

  Yes, but perhaps not for the metaphysical reason you propose (breaking the circle). It is valuable as a **functional** or **temporal** distinction.

  **Why keep it:**
  1.  **Stability vs. Flexibility:** Democratic systems require a stable electorate to function (procedural), but moral legitimacy requires responsiveness to externalities (substantive). Your distinction maps well onto this institutional need.
  2.  **Epistemic Clarity:** It distinguishes between *ex-ante* standing (who gets a vote initially) and *ex-post* accountability (who can claim harm later). This helps in designing institutions (e.g., residency requirements vs. human rights tribunals).
  3.  **Reframing the Problem:** It shifts the debate from "Who *is* the people?" (ontological) to "How do we *constitute* the people over time?" (processual).

  **Why refine it:**
  The distinction risks being too sharp. "Being subject to law" (procedural) impacts interests (substantive). A better framing might be **Presumptive vs. Rebuttable** standing.
  *   *Presumptive:* Those under jurisdiction are presumed to have standing (solving the coordination problem).
  *   *Rebuttable:* This presumption can be challenged by those outside jurisdiction who demonstrate significant affected interests (solving the legitimacy problem).

  ### 4. Strategic Recommendations for the Chapter

  1.  **Soften the "Non-Democratic" Claim:** Do not claim the procedural criterion is "non-democratic" in a way that implies it needs no justification. Instead, argue it is **pre-democratic** in a temporal sense, or **structurally necessary**. Acknowledge that *some* circularity is inevitable in any foundational political act (the "paradox of founding"), and your model manages this paradox better than pure AAI or pure ASP.
  2.  **Address the "Who Decides Control?" Regress:** You need a paragraph explicitly addressing who identifies the "effective control." If it is the existing state, admit the status-quo bias but argue it is the only feasible starting point for *reform* (a Rawlsian "where we are" vs. "where we want to be" approach).
  3.  **Engage Abizadeh Directly:** Since your solution relies on "control," Abizadeh is your strongest interlocutor. You need to explain why your "substantive refinement" mechanism is sufficient to legitimize the initial coercive boundary.
  4.  **Consider "All-Subjected" Terminology:** Your "procedural" sense is essentially the **All-Subjected Principle**. Using that terminology will help you slot into the existing literature (Miller, Abizadeh, Viehoff) rather than reinventing the wheel. You can position your "substantive refinement" as a hybrid model that corrects the known deficiencies of the ASP.

  **Summary:** Your distinction is analytically useful, but it does not solve the foundational circularity problem; it manages it. If you frame it as a **pragmatic management of the founding paradox** rather than a **logical dissolution of the circle**, your argument will be much harder to refute. You are offering a *theory of democratic boundary maintenance*, not a *theory of democratic boundary origins*. That is a valuable and defensible contribution.
