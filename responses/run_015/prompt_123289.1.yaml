  Please structure your response exactly as follows.

  First, Joint Agreed Claims: a numbered list of propositions both sides accept, covering the failure of libertarian free will, the empirical picture of human decision-making from neuroscience, the legitimate social functions of institutional punishment, and the operational definition of moral hysteresis. Keep this section to approximately 250 words.

  Second, Residual Disagreements: a table with two columns—Compatibilist Revisionist and Abolitionist Incompatibilist—each containing that side’s own precise formulation of its remaining position, worded so that the respective camp would accept its column. Address whether reactive attitudes retain non-instrumental value, whether any form of basic desert survives, and whether moral hysteresis can be calibrated away by institutional redesign. Keep this section to approximately 250 words.

  Third, Cruxes and Predictive Cases: identify the two central cruxes—questions such that resolving them would move at least one party. For each crux, present one concrete case or institutional pattern (for example, a legal reform that removes retributive language but retains identical sentencing outcomes, or a clinical population with disrupted reactive-attitude circuitry) that both sides agree bears on the issue. Then record, in clearly labeled lines, the prediction each camp makes about what that case will demonstrate. Keep this section to approximately 300 words.

  Fourth, Assessment of Verbal vs. Substantive Disputes: state which disagreements dissolve once terms such as “responsibility,” “desert,” and “punishment” are fixed in the jointly agreed operational sense, and which disagreements remain genuinely substantive even after that fixing. Keep this section to approximately 150 words.

  Write in formal, polished philosophical prose. Do not provide bibliographies, reading lists, citations, or requests for further sources. If you reference any specific text, paraphrase without quotation marks; do not include verbatim quotes.
