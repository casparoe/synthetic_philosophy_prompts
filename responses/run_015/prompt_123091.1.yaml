  **Follow-Up 1: Indistinguishable Leaves**

  You are correct that **Rank-Dependent (Leaf 8)** and **Expected Utility (Leaf 9)** collapse into each other if you only test them with gambles that have two outcomes. With only two outcomes, weighting the probability of the "better" outcome is mathematically identical to weighting it linearly. To pry them apart, you need a **three-outcome gamble** (e.g., Low, Medium, High payoff). Rank-Dependent users will shift their weight on the Medium outcome depending on whether it is grouped with Low or High, whereas Expected Utility users will not.

  Similarly, **Maximin (Leaf 3)** and **Smooth Ambiguity (Leaf 4)** can look identical if you only probe with two-outcome gambles where the uncertainty set is symmetric. If the "average" plus "penalty" in Smooth Ambiguity happens to equal the "worst case" in Maximin for that specific spread, their choices match. To separate them, vary the **size of the uncertainty set** while keeping the worst case constant. Maximin will not change its valuation (since the worst case didn't move), but Smooth Ambiguity will (since the penalty for ignorance grows as the set widens).

