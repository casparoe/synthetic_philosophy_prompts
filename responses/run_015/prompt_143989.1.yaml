  The classroom ritual
  Instructors present the standard Hole Argument to demonstrate why naive spacetime substantivalism is problematic. Students start with a manifold $M$ and metric $g$. They typically define a "hole" region $H$ where the stress-energy tensor vanishes. A diffeomorphism $\phi$ is applied that is the identity outside $H$ but non-trivial inside. This generates a new metric $g' = \phi_*g$, dragging all matter fields along. Mathematically, $(M, g)$ and $(M, g')$ clearly differ inside $H$. The lesson concludes that if spacetime points possessed independent physical identity, these models would represent distinct physical realities, implying radical indeterminism since initial data outside $H$ cannot fix the metric inside. To save determinism, textbooks assert Leibniz Equivalence: diffeomorphic models now represent the same physical state. This ritual trains students to treat diffeomorphisms as gauge redundancies rather than physical transformations, often embedding a specific interpretive stance directly into the mathematical formalism without explicitly arguing for it within metaphysics.

  The hidden ontology
  This practice presupposes that physical identity is structural rather than haecceitic. By identifying diffeomorphic models, the pedagogy assumes spacetime points lack "thisness" independent of the metric field. This is often conflated with relationalism, but it technically permits a "sophisticated substantivalism" where points exist but lack primitive identity. The commitment is primarily anti-haecceitism: distinct mathematical representations mapping to the same physical situation implies gauge redundancy. However, this aligns with verificationist leanings; if two states are empirically indistinguishable, they are ontologically identical. Regarding the quantum gravity twist, invoking asymptotic boundaries to define states while rejecting fixed points creates tension. It suggests identity is fixed relationally at infinity, implying spacetime interior points derive identity from boundary conditions. This isn't necessarily inconsistent, but it shifts ontology from local substantivalism to holistic structuralism. The pedagogical shortcut hides this shift, presenting gauge equivalence as a simple mathematical fact rather than a heavy deep metaphysical claim about the non-existence of independent spacetime substrates. Consequently, students learn to manipulate the formalism without grappling with whether the "gauge" reflects human ignorance or nature's indifference to point identity.

  Contested vs settled
  Settled: Everyone agrees the math works and that strictly naive substantivalism (points have independent identity) yields indeterminism in GR. Everyone agrees diffeomorphism invariance is a symmetry of the theory. Contested: What this implies for reality. Earman and Norton argue this kills substantivalism; Lewis and Maudlin argue it only kills haecceitism, saving substantivalism. The status of the hole argument itself is debated: is it a paradox or a reductio? In quantum gravity, the inconsistency charge is highly contested. Some argue asymptotic boundaries violate background independence, rendering the theory semi-classical. Others counter that observables require reference frames, making boundaries necessary pragmatic tools rather than ontological commitments. There is no consensus on whether background-independent quantum gravity must eliminate boundaries entirely or merely render them dynamical. Furthermore, whether diffeomorphism invariance is a physical symmetry or a representational redundancy still remains live. Philosophers agree the hole argument forces a choice, but disagree on which horn of the dilemma is less costly: abandoning determinism or abandoning independent point identity. The claim that using boundaries is "sneaking structure back in" is a substantive critique, not a settled fact, depending on one's definition of background independence.

  If we dropped the presupposition
  If we reject Leibniz Equivalence and assert points have independent identity, GR becomes indeterministic. The metric inside the hole is not fixed by prior data, meaning the future is genuinely open despite fixed past conditions. This isn't logically impossible, but it violates the spirit of classical field theory. To restore determinism, one would need to add structure, like a preferred foliation or fixed background fields, breaking general covariance. This would fundamentally alter GR, turning it into a theory on a fixed stage rather than a dynamic geometry. Alternatively, one accepts indeterminism as a feature, suggesting spacetime itself has quantum-like probabilistic behavior at the classical level. Dropping the presupposition reveals that the standard interpretation isn't just about mathematical elegance; it's a safeguard for causal closure. Without it, spacetime points become active agents capable of varying independently of physical fields, reintroducing a form of absolute space that Einstein really sought to eliminate.
