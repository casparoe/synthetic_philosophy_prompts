      *   **Lens:** The "Problem of Dirty Hands" (specifically moving beyond "necessary evil").
      *   **Key Conceptual Distinction:** *Structural Complicity* (embedding a democracy in a totalitarian moral architecture) vs. *Transactional Complicity* (discrete acts like intelligence sharing, Lend-Lease).
      *   **Core Tasks:**
