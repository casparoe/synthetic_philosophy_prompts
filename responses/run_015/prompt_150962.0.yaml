      *   **Constraints:** No bibliography, no literature review. Rigorous mapping, honest account of failure points.

  2.  **Initial Brainstorming & Conceptualization:**
      *   *Dirty Hands (DH):* Usually focuses on the individual agent (the politician) who must do wrong to do right. Walzer's "Political Action: The Problem of Dirty Hands" is the touchstone. It's often about the *act* (torture, lying, betrayal).
      *   *The Churchill-Stalin Alliance:* The classic "devil you know" scenario. "If Hitler invaded Hell, I would make at least a favourable reference to the Devil."
      *   *Structural Complicity:* This implies the *relationship itself* is the problem. By allying, Britain legitimizes the USSR. The war aim shifts from purely defeating Nazism to sustaining a regime that will later oppress Eastern Europe. It's about the *system* of alliance.
      *   *Transactional Complicity:* Specific acts. Sending tanks. Sharing Enigma decrypts. Ignoring Katyn. These are specific choices *within* the alliance.
      *   *The Tension:* DH theory usually looks at the moment of decision. Does it account for the *duration* and *nature* of the relationship?
      *   *The "Moral Architecture":* This suggests that institutions have their own morality (or immorality) that agents inhabit. If DH is about the *agent*, does it miss the *structure*?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the standard narrative (pragmatism vs. ideology). Introduce the Structural vs. Transactional distinction. State the thesis: The standard DH framework tends to collapse these, obscuring the deeper moral cost of institutional entanglement.

      *   **Mapping the Distinction (Churchill's Case):**
          *   *Structural:* The mere existence of the Grand Alliance. The diplomatic recognition. The silence on Soviet expansionism (Poland/Baltics) *as a condition* of the alliance. The post-war architecture (Yalta seeds). This isn't just an act; it's a state of being.
          *   *Transactional:* Lend-Lease shipments (specific tonnage). Ultra intelligence (specific decrypts). The suppression of specific reports (e.g., Vrba-Wetzler regarding Auschwitz is different, but maybe reports on Soviet atrocities). The refusal to open a Second Front *at a specific time*.
          *   *Analysis:* Structural is the "container"; Transactional is the "content."

      *   **Critiquing the Walzerian Framework:**
          *   Walzer focuses on the *agent's guilt* and the need for public acknowledgment/penance.
          *   Does Walzer distinguish between *being* in a dirty system vs. *doing* a dirty deed?
          *   *Argument:* Walzer tends to focus on the discrete violation (the "hand-washing" moment). He treats the political realm as inherently dirty, but often locates the dirt in the *choice*, not the *structure*.
          *   *Collapse:* By calling it all "dirty hands," the theory risks treating the alliance itself as just a sum of transactions. It misses the *ontological* shift of a democracy binding itself to a totalitarianism.

      *   **The Institutional Dimension ("Moral Architecture"):**
          *   DH theory is agent-centric. It needs to be structure-sensitive.
          *   Concept: "Institutional Contagion." When you ally with a totalitarian state, you aren't just trading goods; you are validating their moral standing.
          *   Churchill's dilemma: He could control the transactions (stop the grain), but could he control the structure (the alliance)? If the structure is necessary for survival, is the dirt unavoidable?
          *   *Need for Theory:* Yes, DH needs to account for *complicity by association* that isn't reducible to specific acts.

      *   **The Elected Leader Constraint:**
