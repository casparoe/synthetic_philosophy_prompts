          *   The boundary blurs because the *survival* of the democracy depends on the *success* of the tyranny (militarily).
          *   Democratic accountability vs. Secret Diplomacy.
          *   Does the electoral mandate excuse the structural complicity? Or does it make it worse (betrayal of constituents' values)?
          *   This makes the Structural/Transactional boundary porous. You can't separate the tanks (transaction) from the victory (structure).

      *   **Conclusion:** Summarize the findings. The Churchill case exposes a gap in DH theory. It's not just about getting hands dirty; it's about living in a dirty house. The theory needs to evolve from "ethics of action" to "ethics of affiliation."

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Am I slipping into historical narrative? *Correction:* Keep it philosophical. Use history only as data points for the ethical categories.
      *   *Check:* Am I defining "Structural Complicity" clearly? *Correction:* Ensure it's defined as embedding within a moral architecture, not just long-term consequences.
      *   *Check:* Is the Walzer critique fair? *Correction:* Walzer does acknowledge the "dirty world," but emphasize his focus on the *individual agent's* moral remainder. The critique is that he doesn't sufficiently theorize the *source* of the dirt as institutional rather than just situational.
