      *Refinement on "Structural":* It's not just the choice to ally. It's the *terms* of the alliance that required ignoring Soviet moral crimes. The *silence* is structural. The *supply* is transactional.
      *Refinement on Walzer:* Walzer's "Political Action" argues that we expect leaders to get dirty. But does he account for *systemic* dirt? He focuses on the "supreme emergency." The Anglo-Soviet alliance is a *prolonged* supreme emergency. This duration is key.

