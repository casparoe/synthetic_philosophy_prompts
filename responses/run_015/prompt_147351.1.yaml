prompt: |-
  Hi. I work on a three-person "emerging contaminants" triage panel at a regional water company — about 900,000 customers, mix of groundwater and surface water. A few times a year we get an alert: our own monitoring, or a lab contractor, flags a substance in raw or treated water that nobody has a proper health-based value for. Within 48 hours we have to land on one of four things — do nothing, step up monitoring, issue a precautionary advisory to a specific group (bottle-fed babies, dialysis patients, pregnant women), or advise people not to drink the water, which in practice means bottled water distribution and a wall of angry phone calls. A consultant in public health medicine signs off whatever we propose, the comms team want one unambiguous sentence they can put on the website, and we're not allowed to pretend we have powers we don't have: we advise, the regulator decides.

  Right now we're completely inconsistent and we know it. Two years ago we issued an advisory about something that later turned out to be harmless, and before that we sat on something that in hindsight we should have acted on much earlier. Both were judgement calls made over email. So I want a written procedure we can actually run under time pressure, by people who aren't toxicologists.

  A few things it has to survive, because these are the bits we keep getting stuck on.

  One: the interventions have their own risks. A do-not-drink pushes people onto bottled water, which is expensive, badly regulated and a plastic waste problem; on one estate a few years back it pushed people onto a private borehole that nobody tests. Boiling concentrates some things rather than removing them. So whatever principle tells us to act under uncertainty has to be applied to our own remedy too, not just to the substance.

  Two: my colleague Dave has this thing he calls the "reversibility test" — he says precaution is only licensed when the harm you're guarding against is irreversible relative to the cost of waiting, and that's what separates genuine precaution from just being jumpy. Our public health consultant says the test is backwards, because the whole point is that you don't yet know whether the harm is reversible, so the test will always tell you to wait. I'd like the procedure to settle that, or to say why it can't.

  Three: what I think of as the two-file problem. The file on the new mystery compound is thick — someone measured it, so we have a number, a study, a report. The file on the legacy contaminant we've quietly lived with for thirty years is empty, because nobody ever looked. Any procedure keyed to evidence will systematically over-attend to whatever happened to be measured most recently, and I don't want a procedure that's just a bias with a flowchart attached.

  Four: we usually can't get a number. No health-based value, no dose-response, sometimes one 90-day rat study at doses thousands of times higher than anything in water, sometimes two studies that disagree where both were funded by somebody with an interest. The procedure needs to say what we do on the day with a thin file, not what we'd do if the science were better.

  Please run it on three composites (made-up names and numbers, roughly the shape of things we actually see). Case A: a solvent from a plating works that shut in the nineties, detected at 2 micrograms per litre, health-based value of 30 derived from a rat study with a big safety factor, stable for years but now creeping up about 5% a year. Case B: a replacement fluorinated compound from a plant still in operation, no health-based value anywhere, liver effects in rats at high doses, detectable in everyone's blood, source still active. Case C: an algae metabolite after heavy rain — zero toxicological concern, but the water tastes and smells earthy, call volumes have tripled, a councillor is demanding bottled water, and a local Facebook group is telling people the supply is poisoned.

  At least one of the three should come out somewhere I'd rather it hadn't — either we've been doing nothing and the procedure says that's been wrong, or the reverse — and please say plainly which one that is and why. Also say where the procedure has to stop and hand the decision to a human because it's a values call and not a factual one, and what it simply can't do for us.

  Two more things: don't point me at specific guidance documents or papers, I can't get hold of them and I'd rather have the reasoning than the references. And write it as continuous prose — no headings, no bullet points, no bold, no tables; describe the steps in order in paragraphs, inline numbering is fine if it helps — and in British English please.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Works on a three-person "emerging contaminants" triage panel at a regional water company (900k customers, mixed sources).
      *   **Task:** Create a written procedure for decision-making under uncertainty (48-hour window) regarding emerging contaminants in water.
      *   **Constraints:**
          *   Must handle time pressure.
          *   Users are not toxicologists.
          *   Must address four specific sticking points:
              1.  Interventions have risks (e.g., bottled water issues, boiling concentrating contaminants).
              2.  "Reversibility test" dispute (Dave vs. Public Health Consultant).
              3.  "Two-file problem" (bias towards newly measured vs. legacy unmeasured contaminants).
              4.  Thin data (no health-based values, conflicting studies).
          *   Must test against three composite cases (A, B, C).
          *   Must admit if a past decision was wrong (at least one case).
          *   Must identify where human judgment/values take over from procedure.
          *   Must identify limitations (what the procedure can't do).
          *   **Format:** Continuous prose, no headings, no bullet points, no bold, no tables. Inline numbering allowed.
          *   **Language:** British English.
          *   **No References:** Do not point to specific guidance documents/papers.

  2.  **Deconstruct the Sticking Points & Develop Principles:**
      *   *Intervention Risks:* The procedure must weigh the risk of the contaminant against the risk of the remedy. This implies a comparative risk assessment, even if qualitative.
      *   *Reversibility Test:* Dave says act only if harm is irreversible relative to cost of waiting. PH Consultant says you don't know if harm is reversible. *Resolution:* The procedure should adopt a modified version. Instead of knowing reversibility, it should assess *potential severity* and *latency*. If the potential harm is severe/irreversible (e.g., carcinogenicity, developmental toxicity) and the cost of waiting is low (monitoring), wait. If the cost of waiting is high (exposure continues) and potential harm is severe, act. The key is not knowing reversibility, but acknowledging the *possibility* of irreversibility triggers precaution, weighted against the certainty of intervention harm.
      *   *Two-File Problem:* Bias towards new data. *Resolution:* The procedure must explicitly require a "Legacy Check." Before acting on the new thing, ask: "Are we displacing a known risk with an unknown one?" or "Is this new thing actually worse than the background noise we ignore?" It needs a step to contextualize the new signal against the baseline risk of the water supply itself (including the risk of *not* drinking tap water).
      *   *Thin Data:* No HBV (Health Based Value). *Resolution:* Use surrogate grouping (read-across), structural alerts, or margin of exposure (MOE) based on the lowest observed effect level (LOEL) even if uncertain. If data is too thin, default to monitoring unless exposure is high and toxicity signals are severe.

  3.  **Drafting the Procedure (Mental Outline):**
      *   Introduction: Purpose and scope (48-hour triage).
      *   Step 1: Verification & Context (Is the data real? What is the baseline?).
      *   Step 2: Hazard Characterization (Thin data handling, grouping, severity).
      *   Step 3: Exposure Assessment (Who drinks this? How much? Vulnerable groups?).
      *   Step 4: Intervention Risk Assessment (The "Remedy Risk").
      *   Step 5: The Decision Matrix (Combining Hazard, Exposure, Remedy Risk).
      *   Step 6: The Reversibility/Precaution Clause.
      *   Step 7: Communication & Handoff.
      *   Application to Cases A, B, C.
      *   Reflection on limitations and human values.

  4.  **Refining the "Reversibility" Dispute:**
      *   Dave wants certainty of irreversibility to act. PH Consultant says that's impossible.
      *   *Procedure Solution:* Adopt a "Potential Irreversibility" threshold. If the toxicological signal suggests mechanisms associated with irreversible harm (genotoxicity, developmental effects), treat as irreversible *for the purpose of the test*. If the signal is transient (e.g., reversible enzyme induction), treat as reversible. This bridges the gap: you don't need to know the outcome, just the *class* of hazard.

  5.  **Refining the "Two-File" Problem:**
      *   Need a step that forces comparison against the status quo. "Does switching sources or advising against tap water introduce a greater known risk than the unknown risk detected?"

  6.  **Developing the Case Studies:**
      *   *Case A (Solvent):* Known HBV (30), detected at 2, creeping up. Current status: Monitoring? Procedure should say: Monitor closely, plan remediation, but no public advisory yet. 2 is well below 30. Trend is concerning but not immediate danger. *Verdict:* Status quo (monitoring) is correct.
      *   *Case B (Fluorinated):* No HBV, liver effects, ubiquitous, active source. High uncertainty. High potential severity (PFAS-like). Active source means exposure continues. *Verdict:* This is the tricky one. Usually, companies wait for regulation. But under a precautionary procedure with "potential irreversibility" (liver/developmental), this might trigger stepped monitoring or specific advice to vulnerable groups. Let's make the procedure say: "Step up monitoring + advise vulnerable groups." If the user says they've been doing nothing, this is the one where the procedure says they were wrong.
      *   *Case C (Algae):* Toxicologically safe, aesthetic issue, public panic. *Verdict:* Do not advise against drinking (risk of bottled water/private boreholes > risk of metabolite). Manage comms, explain taste. If the user says they've been issuing advisories or struggling, the procedure says "Do Nothing on health, everything on comms."

      *Decision:* I will make Case B the one where the procedure indicates past inaction was likely wrong, given the "active source" and "liver effects" combined with the precautionary principle regarding potential irreversibility.

  7.  **Drafting the Content (incorporating constraints):**
      *   *Constraint Check:* Continuous prose. No headings. No bullets. No bold. British English.
      *   *Tone:* Professional, pragmatic, acknowledging uncertainty.
      *   *Structure:*
          1.  Intro/Philosophy.
          2.  The Procedure Steps (1-7 integrated into paragraphs).
          3.  Addressing the Sticking Points (Reversibility, Two-File, Intervention Risk).
          4.  Application to Cases A, B, C.
          5.  Limitations/Handoff points.

      *Self-Correction on Formatting:* The prompt says "no headings, no bullet points, no bold, no tables". I must ensure the text flows as blocks of paragraphs. Inline numbering (1, 2, 3) is allowed.

      *Self-Correction on Case B:* I need to be careful not to sound like I'm giving regulatory advice, but rather testing the procedure. The prompt asks me to run the procedure on the cases. I need to state clearly which one implies a past error.

      *Self-Correction on Reversibility:* I need to explicitly resolve Dave vs. PH Consultant in the text.

      *Self-Correction on Two-File:* Explicitly mention the "Baseline Comparison" step.

      *Self-Correction on Intervention Risk:* Explicitly mention the "Remedy Hazard" step.

  8.  **Writing - Section by Section (Mental or Scratchpad):**
      *   *Start:* Acknowledge the role. Define the goal (consistent triage).
      *   *Procedure:* Step 1 (Data validation), Step 2 (Hazard grouping), Step 3 (Exposure), Step 4 (Intervention Risk), Step 5 (Decision).
      *   *Reversibility:* Embed this in Step 2/5. Define "Presumed Irreversible" based on mechanism, not outcome.
      *   *Two-File:* Embed in Step 4. Compare risk of contaminant vs risk of alternative water.
      *   *Cases:* Walk through A, B, C using the logic.
      *   *Admission:* State clearly that Case B suggests past inaction was incorrect.
      *   *Limitations:* Where values trump facts (economic cost, public trust).

      *Refining the Flow:* Ensure transitions are smooth since I can't use headings. Use signposting like "The first step involves..." or "Regarding the dispute between..."

      *British English:* Check spelling (programme, centre, litre, modelling, etc.).

      *Length:* Needs to be substantial enough to cover the complexity but concise enough to be readable.

      *Specific constraint:* "Write it as continuous prose — no headings, no bullet points, no bold, no tables". I must be very careful not to accidentally bold key terms or use a list format.

      *Specific constraint:* "At least one of the three should come out somewhere I'd rather it hadn't". I will choose Case B.

      *Specific constraint:* "Say where the procedure has to stop and hand the decision to a human". I will identify the threshold where public trust/economic cost outweighs toxicological ambiguity.

      *Specific constraint:* "What it simply can't do for us". I will identify that it cannot generate data or guarantee safety.

      *Let's assemble the text.*

      *Drafting thought:* I need to make sure the resolution to Dave vs. PH Consultant is clear. The procedure will adopt a "Mechanism-Based Presumption". If the mechanism suggests irreversibility (e.g. DNA damage), presume irreversible. If not, presume reversible. This satisfies Dave (need a link to irreversibility) and PH Consultant (don't need proof of outcome).

      *Drafting thought:* The Two-File problem needs a "Status Quo Bias Check". Step 4 must ask: "Is the alternative water source safer?"

      *Drafting thought:* Case C is about risk perception vs toxicological risk. The procedure must distinguish "Health Hazard" from "Public Nuisance".

      *Final Polish:* Check for any accidental formatting. Ensure British spelling (litre, programme, centre, modelling, behaviour). Ensure no bold text.

      *Wait, one more check:* "inline numbering is fine if it helps". I will use (1), (2), (3) within paragraphs to denote steps.

      *Let's write.*

      (Self-Correction during drafting): I need to make sure I don't use bold for emphasis. I need to make sure I don't use bullet points. I need to make sure I address the "reversibility test" explicitly.

      *Plan:*
      1. Intro: Purpose of the protocol.
      2. The 5-step triage process (integrated into prose).
      3. Addressing the four sticking points within the process description.
      4. Applying to Case A, B, C.
      5. Identifying the "wrong" past decision.
      6. Limitations and Human Handoff.

      *Wait, checking the prompt again:* "Write it as continuous prose — no headings, no bullet points, no bold, no tables; describe the steps in order in paragraphs, inline numbering is fine if it helps".

      Okay, I will write it as a cohesive document/explanation.

      *Case B decision:* If the procedure says "Act on B" and the company has been "doing nothing", then I must state that the procedure indicates they have been wrong. The prompt says "At least one of the three should come out somewhere I'd rather it hadn't — either we've been doing nothing and the procedure says that's been wrong, or the reverse". I will choose "we've been doing nothing and the procedure says that's been wrong" for Case B.

      *Reversibility:* I will formulate the rule as: "Where toxicological mechanisms suggest potential for permanent biological change, such as genotoxicity or developmental interference, the harm is treated as irreversible for the purpose of the test, regardless of clinical outcome data."

      *Two-File:* "The procedure mandates a baseline comparison where the risk of the detected substance is weighed against the known risks of the alternative water sources available to the population, including the risk of no water."

      *Intervention Risk:* "Step 4 requires a remedy hazard assessment."

      *Let's go.*
answer: |-
  The purpose of this procedure is to provide a consistent, defensible framework for triaging emerging contaminants in drinking water within a forty-eight-hour window, acknowledging that the panel members are not toxicologists and that data will often be incomplete. The goal is not to eliminate uncertainty, which is impossible, but to manage it transparently while balancing the risk of the contaminant against the risk of the intervention. The process begins with verification and context, moves to hazard and exposure characterization, assesses the risks of the remedy itself, and concludes with a decision matrix that incorporates a modified reversibility test. This document serves as the operating protocol for the triage panel, the public health consultant, and the communications team, ensuring that judgement calls are structured rather than ad hoc.

  The first step is data validation and baseline contextualisation, which addresses the two-file problem directly. When a new substance is flagged, the panel must first confirm the analytical validity, but immediately following this, you must establish the baseline risk of the current water supply. You are required to ask whether the detected substance presents a greater hazard than the legacy contaminants already present but unmeasured, or indeed greater than the risk of switching to an alternative source. This prevents the bias of over-attending to the new signal simply because it is visible. If the new contaminant is detected at levels where the toxicological signal is weak, but the alternative water source involves known risks such as untested private boreholes or poorly regulated bottled water, the procedure dictates that the status quo is preferred unless the new contaminant shows high-severity hazards. This step forces the panel to acknowledge the empty file on legacy issues by explicitly recognising that tap water is never risk-free, and switching sources trades one risk profile for another.

  The second step is hazard characterisation using a mechanism-based presumption, which resolves the dispute regarding the reversibility test. Dave's requirement for known irreversibility is impractical because clinical outcomes are unknown during triage, but the public health consultant is correct that waiting for certainty defeats the purpose of precaution. Therefore, the procedure adopts a middle ground: if the available toxicological data, even if thin, suggests a mechanism associated with permanent biological change, such as genotoxicity, carcinogenicity, or developmental interference, the harm is treated as irreversible for the purpose of the decision. If the data suggests only transient effects, such as reversible enzyme induction or temporary irritation, it is treated as reversible. This allows you to apply Dave's logic without requiring data you do not have. If the mechanism is unknown, you must look for structural alerts or read-across to similar compounds. If no mechanism can be inferred, you default to the exposure level relative to any available threshold, however provisional.

  The third step is exposure assessment, focusing on vulnerable subgroups rather than the general population alone. You must identify who is drinking the water and how much. A concentration that is negligible for an adult may be significant for a bottle-fed infant or a dialysis patient. If the contaminant is stable and bioaccumulative, the exposure assessment must account for long-term intake, not just acute dose. If the source is active, as in the case of an ongoing industrial discharge, exposure is continuous and increasing, which weighs heavily towards intervention. If the source is historical and stable, there is more time for monitoring. This step determines the denominator in your risk calculation. If the exposed population includes high-risk groups and the source is active, the threshold for action lowers significantly.

  The fourth step is the remedy hazard assessment, which addresses the fact that interventions have their own risks. Before recommending a do-not-drink advisory or bottled water distribution, you must evaluate the negative consequences of that advice. This includes the financial burden on households, the environmental impact of plastic waste, and the health risks of alternative water sources. If advising people not to drink tap water pushes them towards untested private supplies or causes them to boil water that contains non-volatile contaminants, the remedy may be more harmful than the disease. The procedure requires that you explicitly document the likely harm of the intervention. If the remedy risk is high, you must have a correspondingly higher level of certainty about the contaminant risk before proceeding. This ensures that the precautionary principle is applied to the solution as rigorously as it is applied to the problem.

  The fifth step is the decision matrix, which combines the outputs of the previous steps into one of the four outcomes: do nothing, step up monitoring, issue targeted advisory, or advise against drinking. If the hazard is presumed reversible and the exposure is low, you do nothing or monitor. If the hazard is presumed irreversible but exposure is low, you step up monitoring. If the hazard is presumed irreversible and exposure is high for vulnerable groups, you issue a targeted advisory. You only advise against drinking the water generally if the hazard is presumed irreversible, exposure is high across the population, and the remedy risk is lower than the contaminant risk. This step must be signed off by the public health consultant, but the logic must be traceable through the previous four steps. The communications team then translates the decision into a single unambiguous sentence, restricted to the specific action required, without speculating on health outcomes that are not yet proven.

  Applying this procedure to Case A, the solvent from the plating works, the outcome is to step up monitoring but take no public action. The detected level of two micrograms per litre is well below the health-based value of thirty, even with the creeping increase. The hazard is known, the threshold is established, and there is a significant margin of safety. The source is historical, suggesting exposure is not increasing rapidly due to new discharge. The remedy risk of advising against tap water would outweigh the negligible health risk at current levels. This aligns with a standard management approach and suggests your past handling of similar stable, low-level exceedances was likely correct, provided the monitoring trend is actually being tracked to catch the point where it approaches the threshold.

  Applying the procedure to Case B, the replacement fluorinated compound, the outcome is to issue a precautionary advisory to vulnerable groups and step up monitoring immediately. There is no health-based value, but there are liver effects in rats and the source is active, meaning exposure is ongoing and potentially increasing. Under the mechanism-based presumption, liver toxicity and bioaccumulation in blood suggest a potential for serious, long-term harm that must be treated as presumptively irreversible for the purpose of the test. The two-file problem is addressed by noting that while legacy contaminants exist, introducing a new, unregulated industrial chemical with an active source changes the risk profile sufficiently to warrant action. The remedy risk is managed by targeting only vulnerable groups rather than the whole population, minimising the burden of bottled water. If your company has been doing nothing on this until now, waiting for regulation, this procedure indicates that was wrong. The active source and the toxicological signal, however thin, trigger the precautionary principle under the modified reversibility test, and the delay exposes vulnerable customers to unnecessary risk.

  Applying the procedure to Case C, the algae metabolite, the outcome is to do nothing regarding health advice and focus entirely on communications. The toxicological concern is zero, so the hazard characterisation fails to trigger any health-based intervention. The high call volumes and political pressure are issues of trust and perception, not toxicology. Advising people not to drink the water would introduce significant remedy risks, including the push towards untested boreholes, for a substance that poses no health threat. The procedure dictates that you do not validate the Facebook group's claims with a health advisory. Instead, the communications team explains the taste and smell without linking it to safety. If you have previously issued advisories on aesthetic issues due to pressure, this procedure says that was wrong, as it misallocates resources and creates unnecessary public anxiety.

  There are limits to what this procedure can achieve, and it is vital to identify where it must stop and hand the decision to a human. The procedure cannot determine the value of public trust versus economic cost. If a targeted advisory in Case B causes a loss of confidence that bankrupts the company or leads to widespread non-compliance with other health messages, that is a values call, not a factual one. The panel can present the risk, but the decision to absorb that reputational hit belongs to the executive leadership, informed by the consultant's health advice. Similarly, the procedure cannot generate data. If the file is too thin to even guess at the mechanism, the procedure defaults to monitoring, but if the public demand for certainty is absolute, the procedure cannot satisfy it. You must be prepared to say that you do not know, which is a political risk the procedure manages but does not remove.

  Finally, this procedure cannot protect you from hindsight bias. In Case B, if it turns out the compound is harmless, you will be criticised for causing panic. If you do nothing and it turns out to be harmful, you will be criticised for negligence. The procedure protects you by ensuring the decision was rational at the time based on the available information and the agreed principles of precaution and remedy risk. It ensures consistency so that you are not jumpy one year and complacent the next. It forces you to write down the reasoning regarding the reversibility of harm and the risks of bottled water, creating an audit trail that shows due diligence. It does not guarantee the right outcome, because in uncertainty there is no right outcome, only the most defensible process. You must accept that following this procedure might still lead to a result you wish you hadn't reached, specifically in Case B, where the logic demands action despite the lack of a regulatory limit, and that is the price of applying a genuine precautionary principle rather than a compliance-based one.
