answer: |-
  You have hit on exactly why this debate feels like a broken record. You are right to suspect that the stalemate isn't just about stubbornness; it is structural. The disagreement between illusionists (like Daniel Dennett and Keith Frankish) and phenomenal realists (like David Chalmers and Ned Block) is not a standard scientific dispute where more data will inevitably pick a winner.

  Here is the breakdown of the real structure of the disagreement, why it stalls, and what progress might actually look like.

  ### 1. It Is Not Purely Verbal, But It Is Conceptual
  You asked if this is a verbal disagreement where one side means "properties don't exist" and the other means "experience is undeniable." It is deeper than semantics, but semantics play a huge role.

  *   **The Realist** defines consciousness by its *phenomenal character* (what it feels like). For them, the feeling *is* the existence. If you feel pain, pain exists. To deny the feeling is to deny the only data point you have direct access to.
  *   **The Illusionist** defines consciousness by its *functional role*. They argue that "phenomenal properties" (ineffable, intrinsic qualia) are a folk-psychological myth. When Dennett says the headache is an illusion, he doesn't mean you aren't suffering. He means your brain is constructing a narrative that *says* there is an ineffable quality, but that quality is just a cognitive shortcut, not a real thing in the world.

  The clash happens because the Realist thinks the Illusionist is changing the subject (explaining access consciousness instead of phenomenal consciousness), while the Illusionist thinks the Realist is chasing a ghost (reifying a cognitive glitch into a metaphysical substance).

  ### 2. The Crux: The Status of Introspection
  Your intuition about introspection is the most critical part of this puzzle. This is where the "faulty camera" vs. "direct access" analogy lands.

  *   **Realists treat introspection as incorrigible.** They argue that while I can be wrong about *what* is causing my pain (is it a headache or a tumor?), I cannot be wrong *that* I am having the experience. Introspection provides the "hard data" that physics cannot explain.
  *   **Illusionists treat introspection as a cognitive process.** To them, introspection is just another neural computation. Like vision, it can be hacked, fooled, or mistaken. They argue our intuition that we have "inner movie screens" is a user-illusion created by evolution to help us track our own states.

  The stalemate exists because neither side can prove their model of introspection without assuming their conclusion. If you assume introspection is direct access, illusionism looks absurd. If you assume introspection is a fallible heuristic, realism looks like magic.

  ### 3. Are They Answering Different Questions?
  Yes, and this is a major source of the friction.
  *   **The Neuroscientist/Illusionist Question:** "How does the brain process information and generate self-reports about states?"
  *   **The Phenomenologist/Realist Question:** "Why does that processing feel like something from the inside?"

  The Illusionist answers the first question and claims that once you answer it fully, the second question dissolves (it was a bad question to begin with). The Realist argues that you can answer the first question completely and still have zero answer to the second. This is the "Explanatory Gap."

  ### 4. Why the Debate Stalls
  The debate stalls because it is a **framework clash**, not an empirical one.
  *   **Begging the Question:** Every time an Illusionist offers a mechanism (e.g., "global workspace theory"), the Realist says, "Okay, but why is that mechanism accompanied by feeling?" Every time a Realist points to the feeling, the Illusionist says, "That feeling is just another computational state to be explained."
  *   **No Shared Metric:** In physics, if two theories disagree, we build an accelerator. In consciousness studies, the "accelerator" is our own intuition. Since the two sides have different intuitions about what counts as "real," they talk past each other.

  ### 5. What Would Count as Progress?
  Since this is a conceptual deadlock, a brain scan alone will not fix it. You can find the neural correlates of consciousness (NCC), but the Realist will just ask, "Why do these correlates glow with inner light?" and the Illusionist will say, "They don't glow; they just function."

  However, progress could happen in three specific ways:

  **A. A Detailed Error Theory**
  Illusionism needs to move beyond saying "it's an illusion" to explaining *exactly how the trick is done.* If a cognitive scientist can map the precise introspective error—showing the specific neural mechanism that convinces us we have ineffable qualia—it would make illusionism much harder to dismiss. Keith Frankish is working on this, arguing that we need a "positive illusionism" that details the cognitive architecture of the mistake.

  **B. Predictive Success**
  If the illusionist framework starts generating better predictions for neuroscience or AI than the realist framework, it might win on pragmatism. For example, if building AI based on illusionist principles creates machines that claim to be conscious in ways indistinguishable from humans, it forces us to ask if the "inner glow" was ever necessary for the behavior.

  **C. Dissolving the Intuition**
  Progress might look like a cultural or educational shift. If future generations are taught cognitive science in a way that makes the "inner theater" intuition seem as archaic as "the sun revolves around the earth," the debate fades. This isn't proving the Realists wrong with facts, but rather training their intuitions to align with the physicalist model.

  ### The Bottom Line
  You are correct that this is bedrock intuition that won't budge easily. The Realist holds that experience is the primary datum of existence. The Illusionist holds that the physical world is the primary datum of existence.

  Until one side can demonstrate that their starting assumption is actually a cognitive error (rather than a fundamental truth), the debate will remain a philosophical stalemate. The most likely path forward is not a "Eureka!" brain scan, but a slow erosion of the realist intuition as our models of how the brain constructs self-models become more granular and convincing.

  For now, you are witnessing two different languages describing the same universe, neither able to translate their core vocabulary into the other's terms.
