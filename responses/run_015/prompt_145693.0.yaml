answer: |-
  **Mara:** You're treating Lewis like he's describing a mechanism, but he's just describing a structure. That's the problem. You say conventions are solutions to coordination problems grounded in common knowledge. But when you look at how norms actually *move*—like our garden situation last summer—it's not people sitting around reasoning about each other's expectations. It's drift.

  **Elias:** Drift doesn't explain stability. It explains noise. Lewis isn't saying everyone sits down with a payoff matrix. He's saying that for a convention to *hold*, I have to prefer conforming only because I expect you to conform, and you expect me to expect that. That recursive loop is what makes it a convention rather than just a habit.

  **Mara:** But that loop is fragile. Take the garden. For years, everyone weededs on Saturdays. Then three new families move in. They don't weed. The old residents get annoyed, but they keep weeding for a bit. Then two of the old residents stop. Then suddenly, nobody weeds. Where was the common knowledge there? At what point did everyone know that everyone knew the rule was dead? It doesn't happen at a specific moment. It's a threshold effect.

  **Elias:** The threshold *is* the moment common knowledge clicks into place. Before the third person stopped weeding, I might have thought the norm was slipping, but I wasn't sure if *you* knew it was slipping. Once enough people defect, it becomes public evidence. It's not about the physical act of weeding; it's about the signal. The threshold matters precisely because it solves the ambiguity problem.

  **Mara:** That's the post-hoc storytelling I'm talking about. You're looking at the aftermath—the new equilibrium where nobody weeds—and saying, "Ah, clearly common knowledge was achieved." But the mechanism was evolutionary. People copy successful behaviors or just follow the majority once the cost of deviating gets too high. They aren't tracking higher-order beliefs. They're tracking headcounts. If I see four people not weeding, I stop weeding. I don't care what they believe about my beliefs.

  **Elias:** But why does the headcount matter? If I'm just copying behavior, that's mimicry, not convention. Lewis distinguishes between mere regularity and convention. If I stop weeding because I think the garden is doomed anyway, that's not coordination. If I stop weeding because I know *you* won't be there to coordinate with, and therefore my effort is wasted, that's Lewisian. The headcount works *because* it changes my expectation of your participation. You're smuggling coordination into your evolutionary model without admitting it.

  **Mara:** I'm not smuggling anything. I'm saying the cognitive load of Lewisian common knowledge is impossible. You need infinite iterations of "I know that you know that I know." Real humans don't do that. We use heuristics. "If more than 30% defect, the norm is broken." That's a drift threshold. It's a simple rule. Your model requires me to model your mind. My model just requires me to count heads.

  **Elias:** Lewis never said it was conscious infinite recursion. It's tacit. It's about the structure of the reasoning, not the psychological processing time. Think about driving on the right side of the road. You don't count heads. You just assume everyone else is assuming everyone else is driving on the right. When norms shift, like in the garden, it's because that tacit assumption gets disrupted. The new residents didn't just add noise; they introduced a different expectation. The shift happens when the old expectation can no longer be sustained as a rational solution.

  **Mara:** "Rational solution" is doing too much work. Sometimes norms shift because the old enforcers move away. That's not rational calculation; that's demographic turnover. If the three new families don't weed because they don't know the rule, not because they're solving a coordination problem, then your Lewisian account breaks. They aren't coordinating on a new equilibrium; they're just ignorant. The norm collapses because the transmission mechanism failed, not because everyone jointly agreed to a new convention.

  **Elias:** But it becomes a convention when the old residents *adapt*. If the old residents kept weeding forever despite the new ones, there's no shift. The shift happens when the old residents say, "Well, if they aren't going to do it, I'm not going to do it either." That's where the coordination comes in. They are adjusting their behavior based on the anticipated behavior of the others. The ignorance of the new residents is just the shock to the system. The *convention* is the response of the group to that shock.

  **Mara:** Okay, but let's press on the threshold. Suppose there's a tipping point. Say, if 40% of the neighborhood stops weeding, the remaining 60% give up. Below 40%, they keep going. That's a non-linear dynamic. Lewis's model is static—it describes a stable equilibrium. It doesn't explain why the flip happens at 40% and not 39%. Evolutionary dynamics explain that via payoff structures and risk dominance. Lewis just says, "Once everyone knows, they switch." But everyone knows at 39% too. Why wait for 40%?

  **Elias:** Because common knowledge isn't just "everyone knows the fact." It's "everyone knows that everyone is willing to act on the fact." At 39%, I might know the norm is slipping, but I might not know that *you* know it's slipped enough to quit. I'm waiting for you to quit. You're waiting for me. That's the coordination problem. The 40% threshold is the point where the uncertainty collapses. It's not arbitrary; it's the point where the signal becomes loud enough to sustain the higher-order belief.

  **Mara:** You're turning a psychological threshold into a logical one. I'm saying the threshold exists because of social pressure and effort cost, not because of epistemic states. At 39%, the cost of weeding alone is high, but I might still hope others will join. At 40%, the hope dies. That's not about knowing what you know; it's about my own utility curve crossing a line. Lewis wants to make norms about *beliefs*. I'm saying they're about *incentives*.

  **Elias:** But incentives only work through beliefs! If the cost of weeding is high, I still might do it if I believe you'll reward me later, or if I believe the HOA will fine me. The incentive structure is constant. What changes is my belief about whether the coordination holds. Lewis isn't denying incentives exist. He's saying conventions are the specific subset of incentives where my payoff depends on matching your behavior. The threshold is just the point where the belief in matching becomes unsustainable.

  **Mara:** So you're saying the evolutionary model is just the mechanical implementation of Lewis's logic?

  **Elias:** I'm saying the evolutionary model describes the *path*, but Lewis describes the *glue*. You can explain how we got here via drift, but you can't explain why we stay here without common knowledge. If we didn't have mutual expectations, we'd be constantly renegotiating. The norm holds because we're locked into a specific equilibrium via those expectations.

  **Mara:** But if the drift model predicts the shift perfectly without invoking common knowledge, then common knowledge is epiphenomenal. It's like saying the train arrives because the schedule says so, when actually it arrives because of the engine mechanics. The schedule is just the story we tell. If I can model the garden norm collapse using only threshold dynamics and zero reference to "what Alice thinks Bob thinks," then Lewis is just poetry.

  **Elias:** You can model the collapse, but you can't explain the *normativity*. Why do I feel I *ought* to weed before the threshold? And why do I feel justified in stopping after? Lewis explains the obligation. It's based on mutual expectation. Evolutionary dynamics explain the motion, but not the reason. If it's just drift, then there's no violation when someone doesn't weed, just variation. But there is a violation. We get angry. That anger is rooted in frustrated expectations—expectations Lewis defines.

  **Mara:** Anger is also an evolutionary enforcement mechanism. I get angry to signal cost. It doesn't prove common knowledge exists; it proves sanctions exist. Look, I'll concede this: Lewis is great at describing stable states. When the garden is working, or when it's completely dead, your framework fits. But the transition—the actual evolution of the norm—that's where the common knowledge requirement creates a paradox. It requires too much synchronization. Real life is messy. People operate on different information sets.

  **Elias:** And I'll concede that Lewis assumes a level of rationality that is often idealized. But without that idealization, you can't distinguish a convention from a coercion or a habit. If the garden rule was enforced by a gun, that's not a convention. If it's enforced by habit, it's not a convention. It's only a convention if we're both doing it because we expect the other to. The messiness you're talking about? That's just noise around the signal. The signal is still the common knowledge.

  **Mara:** So you think the threshold is just the signal becoming clear enough to count as common knowledge?

  **Elias:** Exactly. The threshold isn't a mechanical switch; it's an epistemic boundary.

  **Mara:** Then we're disagreeing on causality. I think the epistemic state is a byproduct of the mechanical threshold. You think the mechanical threshold is just the physical manifestation of the epistemic state.

  **Elias:** Basically. But if you're right, then norms are just brute facts. If I'm right, they're agreements without words.

  **Mara:** And if you're right, you're giving humans way too much credit for how much they think about their neighbors' gardening habits.

  **Elias:** Maybe. But I'd rather overestimate their reasoning than underestimate the structure holding the neighborhood together.

  **Mara:** Fair. But I'm still not weeding tomorrow.

  **Elias:** See? You've already coordinated on that.
