          4.  Applying the Correction (Walk through the 4 cases).

  7.  **Review against Constraints:**
      *   High school level? Keep jargon minimal or explain it (e.g., explain "content of intention").
      *   Preserve intuitions? Yes (Carriers/Tennis = Joint; Violinists/Drivers = Parallel).
