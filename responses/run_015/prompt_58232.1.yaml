  3.  **Philosophical Background (Joint Action):**
      *   This is a classic problem in social ontology/philosophy of action.
      *   Key figures: Michael Bratman, Margaret Gilbert, John Searle, Raimo Tuomela.
      *   The "Simple Analysis" described is often called the "I-intention" model or "mutual responsiveness" without "we-intention."
      *   *Bratman's View:* Shared Intention. It's not just "I intend to do X" and "I intend to do Y." It's "We intend to do J." Or, more technically, "I intend that we J" and "You intend that we J," interlocked.
      *   *The Tennis Case:* This is tricky. Are opponents acting together? Yes, they are playing a *match*. A match is a joint activity. But they have opposing goals within that activity. This requires distinguishing the *framework* of the joint activity from the *competitive goals* within it.
