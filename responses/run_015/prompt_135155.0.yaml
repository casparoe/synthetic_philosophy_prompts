answer: |-
  # Internal Guidance: Multi-Stage Model Risk & Fairness Interactions

  ## 1. Scenario: The Sequential Filter
  We procure two hiring models: **ResumeScan** (Stage 1) and **VideoInterview** (Stage 2). Production logic is sequential: an applicant is only sent to VideoInterview if they pass ResumeScan. A hire recommendation requires passing both. 

  We audit fairness using a held-out benchmark where *all* applicants are scored by both models (parallel scoring), allowing us to evaluate individual model performance and pipeline outcomes simultaneously. The applicant pool consists of two demographic groups, **Group A** and **Group B**, with identical qualification rates (50% truly qualified in both). Both vendors certify that their models satisfy **Equalized Odds** individually (equal True Positive Rates and False Positive Rates across groups). However, when deployed in sequence, the pipeline produces a significant disparity in selection rates for qualified candidates.

  ## 2. The Data: Joint Outcome Tables
  Below are the confusion matrices for the benchmark sample ($N=1,000$ per group). 
  *   **Y=1:** Truly Qualified (500 per group).
  *   **Y=0:** Truly Unqualified (500 per group).
  *   **M1:** ResumeScan Score (1=Pass, 0=Fail).
  *   **M2:** VideoInterview Score (1=Pass, 0=Fail).
  *   **Pipeline:** Passes only if M1=1 **AND** M2=1.

  ### Group A (Protected Group)
  *Error Structure: Independent Errors.* The models make mistakes on different people within this group.

  | True Label | Count | M1=1, M2=1 (Pipeline Pass) | M1=1, M2=0 | M1=0, M2=1 | M1=0, M2=0 |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Qualified (Y=1)** | 500 | **320** | 80 | 80 | 20 |
  | **Unqualified (Y=0)** | 500 | **20** | 80 | 80 | 320 |

  ### Group B (Reference Group)
  *Error Structure: Correlated Errors.* The models make mistakes on the *same* people within this group.

  | True Label | Count | M1=1, M2=1 (Pipeline Pass) | M1=1, M2=0 | M1=0, M2=1 | M1=0, M2=0 |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Qualified (Y=1)** | 500 | **400** | 0 | 0 | 100 |
  | **Unqualified (Y=0)** | 500 | **20** | 80 | 80 | 320 |

  ## 3. The Check: Verifying Constraints

  ### (a) Individual Model Fairness (Equalized Odds)
  We verify that if we audit M1 and M2 in isolation (ignoring the other model), they appear perfectly fair.

  *   **Model 1 TPR:** 
      *   Group A: $(320+80)/500 = 400/500 = \mathbf{80\%}$
      *   Group B: $(400+0)/500 = 400/500 = \mathbf{80\%}$
  *   **Model 1 FPR:** 
      *   Group A: $(20+80)/500 = 100/500 = \mathbf{20\%}$
      *   Group B: $(20+80)/500 = 100/500 = \mathbf{20\%}$
  *   **Model 2 TPR:** 
      *   Group A: $(320+80)/500 = 400/500 = \mathbf{80\%}$
      *   Group B: $(400+0)/500 = 400/500 = \mathbf{80\%}$
  *   **Model 2 FPR:** 
      *   Group A: $(20+80)/500 = 100/500 = \mathbf{20\%}$
      *   Group B: $(20+80)/500 = 100/500 = \mathbf{20\%}$

  **Result:** Both models satisfy Equalized Odds exactly. Marginal error rates are identical across groups. Base rates are equal (50%). No standard single-model impossibility theorem is triggered.

  ### (b) Pipeline Fairness (Sequential Deployment)
  We verify the outcome when the models are run in sequence (Pass M1 **AND** Pass M2).

  *   **Pipeline TPR (Selection Rate for Qualified):**
      *   Group A: $320 / 500 = \mathbf{64\%}$
      *   Group B: $400 / 500 = \mathbf{80\%}$
      *   **Gap:** **16 percentage points** (Exceeds 10pt threshold).
  *   **Pipeline FPR (Selection Rate for Unqualified):**
      *   Group A: $20 / 500 = \mathbf{4\%}$
      *   Group B: $20 / 500 = \mathbf{4\%}$
      *   **Gap:** **0 percentage points**.

  **Result:** The pipeline creates a substantial disadvantage for Group A among qualified candidates, despite identical false positive risks and identical individual model metrics.

  ## 4. Mechanism: Correlation of Errors
  The disparity is driven entirely by the **conditional dependence of model errors** within each group.

  *   **In Group B:** The models are redundant. The 400 qualified candidates M1 identifies are the *exact same* 400 candidates M2 identifies. The errors (the 100 missed candidates) are perfectly correlated. Because the errors overlap, the sequential filter does not compound them.
  *   **In Group A:** The models are diverse (independent). The 80 candidates M1 misses are different from the 80 candidates M2 misses. In a sequential pipeline, independence is punitive: a candidate only needs to be missed by *one* model to be rejected. 
  *   **Mathematical Driver:** 
      *   Group B Joint TPR = $P(M1=1|Y=1) = 0.8$ (due to perfect correlation).
      *   Group A Joint TPR = $P(M1=1|Y=1) \times P(M2=1|Y=1) = 0.8 \times 0.8 = 0.64$ (due to independence).

  **Counterfactual Check:** If we force Group B's errors to be independent (matching Group A's structure), Group B's Pipeline TPR drops to 64%. The gap collapses to zero. This proves the gap is not due to marginal accuracy, but due to the **covariance of errors across stages**.

  ## 5. Vendor Meeting: Objections & Audit Requirements

  ### The Vendor's Honest Objection
  If we present this disparity to the vendors, their most defensible position will be:
  > *"Our model satisfies Equalized Odds on the benchmark. The disparity arises from the interaction between our model and a third-party system we do not control. We cannot be held liable for the correlation structure between our errors and another vendor's errors. This is a **pipeline design problem**, not a model fairness failure. You are penalizing us for the fact that our model is less correlated with the other vendor's model for Group A than for Group B."*

  Technically, they are correct. Neither model is biased in isolation. The bias emerges from the *system architecture* applied to heterogeneous error structures.

  ### Required Audit Procedure
  To mitigate this, our Model Risk Management policy must demand the following from vendors, moving beyond single-model validation:

  1.  **Parallel Shadow Scoring:** Vendors must support a "shadow mode" audit where their model scores *all* applicants, regardless of whether they passed Stage 1. We cannot detect error correlation if we only see Stage 2 scores for Stage 1 survivors (selection bias).
  2.  **Conditional Independence Testing:** We will not accept marginal TPR/FPR alone. Vendors must provide (or we must compute) the **joint confusion matrix** across demographic groups. We specifically test for differences in the correlation of False Negatives across groups.
  3.  **Pipeline Liability Clause:** Contracts must stipulate that "Fairness" is defined at the **decision point**, not the model point. If the sequential pipeline creates a >5% TPR gap, the vendors must collaborate on a remediation plan (e.g., adjusting thresholds per stage to compensate for the correlation gap), even if individual models remain statistically "fair."
