answer: |-
  # Game Title: *The Reference Class Tribunal*

  ## 1. Overview & Learning Objective
  **Objective:** To demonstrate that the Reference Class Problem is not a technical glitch solvable by "better" math, but a normative conflict where valid selection principles yield mutually incompatible probabilities, and choosing a principle *is* the argument.
  **Time:** 90 Minutes.
  **Students:** 16 (4 Teams of 4).
  **Materials:** Case File (1 per student), Data Deck Summary (1 per team), Mandate Cards (1 per team), Prediction Slips (10 per team), Scoreboard (Whiteboard).

  ---

  ## 2. Materials Preparation

  ### A. The Case File (Handout 1)
  *Give identical text to all students.*
  > **United States v. Courier (Stylized)**
  > **Defendant:** Mr. V.
  > **Charge:** Importation with intent to distribute.
  > **Arrest:** Caught at **Airport X** with **500g** of heroin.
  > **Dispute:** Sentencing guidelines require estimating quantity carried on **prior, undetected trips**.
  > **Question:** Is it more likely than not that Mr. V carried **>1kg** on at least one prior trip?
  > **Evidence:** No direct evidence of prior trips. The Court allows statistical evidence regarding other couriers.
  > **Your Task:** Estimate $P(\text{Prior High Quantity} | \text{Available Data})$.

  ### B. The Data Deck Summary (Handout 2)
  *Give identical text to all teams. This represents the "Universe" of historical data available.*
  > **Historical Database: 1,000 Arrested Couriers (Last 5 Years)**
  > *Attributes recorded for every courier:*
  > 1. **Nationality:** A or B.
  > 2. **Airport:** X or Y.
  > 3. **Age:** <30 or 30+.
  > 4. **Prior Quantity:** High (>1kg) or Low (≤1kg).
  >
  > **Aggregate Frequencies:**
  > *   **All Couriers (N=1000):** 50% High Prior.
  > *   **Nationality A (N=400):** 70% High Prior.
  > *   **Nationality A + Airport X (N=200):** 90% High Prior.
  > *   **Nationality A + Airport X + Age <30 (N=40):** 30% High Prior.
  > *   **Nationality B + Airport Y (N=300):** 20% High Prior.
  >
  > *Note: Mr. V is Nationality A, Airport X, Age 25.*

  ### C. Mandate Cards (1 per Team)
  *Deal one card face-down to each team. They must follow this rule strictly.*
  *   **Team 1 (The Universalist):** You must use the **Widest** class for which reliable statistics exist. You cannot exclude data based on specific attributes of the defendant unless the data for that attribute is unreliable (N < 10).
  *   **Team 2 (The Individualist):** You must use the **Narrowest** class possible that uniquely describes the defendant using the available attributes. Specificity trumps sample size.
  *   **Team 3 (The Prosecutor):** You may choose any class, but you must **maximize the probability** of "High Prior Quantity" while maintaining a defensible criterion of relevance (you will be cross-examined).
  *   **Team 4 (The Defender):** You may choose any class, but you must **minimize the probability** of "High Prior Quantity" while maintaining a defensible criterion of relevance.

  ### D. Prediction Slips
  *Small slips of paper. Teams write: Team Name, Round #, Probability (0-100%), Justification (1 sentence).*

  ---

  ## 3. Rules & Scoring (No Money)

  **The Truth Mechanism:**
  The Instructor holds a **Truth Deck** of 3 cards (one for each round).
  *   **Round 1 Truth:** "High Prior" (Matches the Narrow/Prosecution signal).
  *   **Round 2 Truth:** "Low Prior" (Matches the Wide/Defense signal).
  *   **Round 3 Truth:** "High Prior" (Matches the Narrow/Prosecution signal).
  *(Note: This sequence ensures no single team dominates purely by luck, but the scoring reveals calibration issues.)*

  **Scoring Rule (Simplified Brier Score):**
  To reward calibration and punish hedging/bluffing without complex math:
  *   **Base Points:** 100 per round.
  *   **Penalty:** $(\text{Prediction} - \text{Outcome})^2 \times 100$.
      *   *Outcome is 1 (High) or 0 (Low).*
      *   *Prediction is decimal (e.g., 0.9).*
  *   **Example:** You predict 90% (0.9). Outcome is High (1). Penalty = $(0.9 - 1.0)^2 \times 100 = 1$. Score = 99.
  *   **Example:** You predict 90% (0.9). Outcome is Low (0). Penalty = $(0.9 - 0.0)^2 \times 100 = 81$. Score = 19.
  *   **Hedging Penalty:** A prediction of 50% always yields a score of 75, regardless of outcome. This makes hedging safe but never winning.

  **Constraint Rules:**
  1.  **No Hybrid Classes:** You must select *one* row from the Data Deck Summary. You cannot average rows.
  2.  **No Invented Attributes:** You cannot filter by attributes not listed in the Data Deck (e.g., "Shoe Size").
  3.  **Public Commitment:** Prediction slips are submitted simultaneously and read aloud before the Truth is revealed.

  ---

  ## 4. Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Intro & Setup** | Distribute Case File & Data. Explain scoring. Deal Mandate Cards. |
  | **10-25** | **Round 1** | Teams calculate based on Mandate. Submit slips. Reveal Truth (High). Score. |
  | **25-40** | **Round 2** | **Crucial:** Allow 2 mins for teams to discuss if they want to *change* their class selection strategy within their Mandate. Submit. Reveal Truth (Low). Score. |
  | **40-55** | **Round 3** | Final round. Submit. Reveal Truth (High). Final Score. |
  | **55-90** | **Debrief** | Map game dynamics to theory (see below). |

  ---

  ## 5. Predicted Failures & Instructor Interventions

  **1. The "Averaging" Cheat**
  *   **What happens:** Team 4 (Defense) realizes Nationality A is bad for them, but Nationality B is good. They try to argue for a weighted average of A and B.
  *   **Intervention:** **Forbid.** Remind them of Constraint Rule #1. The Reference Class Problem is about *which* class, not mixing them. If they mix, they are admitting no single class is "true." Force them to pick one.

  **2. The "Invented Attribute" Cheat**
  *   **What happens:** Team 2 (Individualist) runs out of narrow attributes. They say, "We choose the class of men named 'V'."
  *   **Intervention:** **Forbid.** Remind them of Constraint Rule #2. Classes must be *reliable* (have data). A class of N=1 is not a reference class; it's the individual. This highlights the limit of specificity.

  **3. The "Hedging" Strategy**
  *   **What happens:** Teams realize the Truth Deck is random. They all predict 50% to guarantee 75 points.
  *   **Intervention:** **Allow it, but highlight it in debrief.** In Round 2, announce that "The Court rejects probabilistic ambiguity; you must commit to a preponderance (>50% or <50%)." Or, simply let the scoring punish them in the debrief analysis (75 points is a 'C' grade; confident right answers get 'A's).

  **4. The "Mandate Drift"**
  *   **What happens:** Team 1 (Universalist) sees they are losing and tries to narrow their class.
  *   **Intervention:** **Strict Enforcement.** The Mandate is the experiment. If they break mandate, they forfeit points. The friction *is* the lesson.

  ---

  ## 6. Debrief Guide: Mapping Play to Theory

  Do not just announce the winner. Use the scoreboard to drive the theoretical collision.

  **Phase 1: The Empirical Collision (10 mins)**
  *   **Ask:** "Team 1 and Team 2 looked at the exact same Data Deck. Why did your probabilities differ by 60 points?"
  *   **Point:** It wasn't a calculation error. It was a **selection error**. The math was easy; the epistemology was hard.
  *   **Link:** This dissolves the student assumption that the reference class is a "technicality." It is the primary driver of the posterior.

  **Phase 2: The Normative Collision (10 mins)**
  *   **Ask Team 3 (Prosecution) & Team 4 (Defense):** "You both had 'Free Choice.' Did you converge on the same class?"
  *   **Likely Result:** No. Team 3 picked Nationality+Airport (90%). Team 4 picked Nationality+Airport+Age (30%).
  *   **Point:** "Relevance" is not objective. It is strategic. When you argue for a class, you are arguing for a **normative outcome** (sentence length), disguised as a statistical observation.
  *   **Link:** Any rule for choosing a class (e.g., "choose the most specific") presupposes a judgment about what is relevant (e.g., "is age relevant?").

  **Phase 3: The Calibration Trap (10 mins)**
  *   **Ask:** "Who won?" (Likely Team 3 or 1, depending on Truth Deck).
  *   **Point:** "Does winning Round 1 mean Team 3 was 'right' about the reference class?"
  *   **Answer:** No. It means the Truth Deck aligned with their bias this time. Over infinite rounds, the **Widest** class might calibrate best (Law of Large Numbers), but the **Narrowest** class feels most "just" for *this* defendant.
  *   **Link:** This is the legal tension: **Accuracy (Systemic)** vs. **Individualization (Normative).**

  **Phase 4: The Infinite Regress (5 mins)**
  *   **Ask Team 2:** "If you could have one more attribute to narrow the class, what would it be?"
  *   **Answer:** "Genetic marker," "Past psychology," etc.
  *   **Point:** If you narrow enough, N=1. If N=1, frequency = 0 or 1. Probability collapses.
  *   **Link:** The Reference Class Problem proves that **objective probability for a single case is impossible** without a normative choice of group membership.

  ---

  ## 7. Limitation Note (For the Instructor)

  **What this game cannot reproduce:**
  The game relies on a **Truth Deck** (a known outcome) to score calibration. In real legal sentencing, there is *no Truth Deck*. We never know what the defendant *actually* did on prior trips.
  *   **In the Game:** We can say Team 2 was "wrong" because the Truth Card said "Low."
  *   **In Reality:** There is no card. The "Truth" is constructed by the verdict.
  *   **Teaching Point:** In the debrief, explicitly state: "I gave you a Truth Deck to make scoring possible. In the real world, the Judge *is* the Truth Deck. The sentence you impose *makes* the probability true (by punishing based on it). This means the Reference Class choice isn't just epistemic; it's **constitutive**."

  ---

  ## 8. Instructor Cheat Sheet (Data Logic)

  *   **Team 1 (Wide):** Predicts ~50%.
      *   Round 1 (High): Score ~75 (Hedged).
      *   Round 2 (Low): Score ~75 (Hedged).
      *   *Lesson:* Safe, but ignores specific evidence.
  *   **Team 2 (Narrow):** Predicts ~30% (Low).
      *   Round 1 (High): Score ~19 (Confident Wrong).
      *   Round 2 (Low): Score ~99 (Confident Right).
      *   *Lesson:* High variance. Punishes the defendant when the "specifics" mislead.
  *   **Team 3 (Prosecution):** Predicts ~90% (High).
      *   Round 1 (High): Score ~99.
      *   Round 2 (Low): Score ~19.
      *   *Lesson:* Shows how "Relevance" is weaponized.
  *   **Team 4 (Defense):** Predicts ~30% or ~20% (Low).
      *   Mirrors Team 2 but by choice, not mandate.

  *If Team 2 and 4 end up with the same number, ask: "One of you was forced, one of you chose. Does that change the moral weight of the probability?"*
