answer: |-
  **MEMORANDUM**

  **TO:** Advisory Board
  **FROM:** [Your Name]
  **DATE:** Monday, October 23
  **SUBJECT:** Recommendation Regarding Guest Charter and Community Conduct

  **Purpose**
  This memo addresses the recent conflict regarding Fellow conduct—specifically tipping, queuing, and traffic norms—and recommends whether to amend our Guest Charter to codify these conventions as conditions of stay or to uphold unrestricted visitor autonomy.

  **Engaging the Fellow's Position**
  The Fellow's argument rests on a valid philosophical distinction: everyday conventions like tipping or jaywalking are indeed "social choreography," not universal moral laws. She is correct that a visitor is not a citizen. A tourist or short-term observer often operates under a different social contract than a resident, and there is intellectual value in an outsider questioning why we queue or pay extra for service. To demand total assimilation risks turning our residency into a finishing school for compliant travelers rather than a space for critical thought.

  **The Distinction: Respectful Guest vs. Subject to Norms**
  However, the conflict arises from conflating two different statuses: being *subject to local norms* versus being a *respectful guest*.

  Being "subject to norms" implies a civic or legal obligation. We cannot legally force a fellow to tip or forbid them from crossing against a light. But being a "respectful guest" is a relational obligation. A residency is not a hotel transaction; it is an act of hospitality extended by a specific community (Lisbon) to a stranger. Hospitality relies on reciprocity. When a guest knowingly disrupts the local "choreography," they are not just exercising autonomy; they are offloading the social cost of their experimentation onto the hosts. The waiter loses income, the queue slows down, the pedestrian flow disrupts.

  Therefore, adhering to these conventions is not about submitting to arbitrary rules; it is about acknowledging that our presence here is a privilege granted by the local ecosystem. To claim the right to opt-out is to claim the right to treat the host community as a backdrop for one's own ethical experimentation.

  **The Strongest Consideration for the Losing Side**
  If we choose to codify these conventions as conditions of stay, we must honestly acknowledge what we lose. The strongest argument for protecting autonomy is that friction is often where the best writing comes from. An artist who is too comfortable, who blends in too seamlessly, may fail to see the culture clearly. By enforcing compliance, we risk sanitizing the experience, selecting for fellows who are polite rather than probing, and implicitly telling writers that their critical engagement with the host culture must remain theoretical, not practical. We risk becoming gatekeepers of behavior rather than supporters of art.

  **Recommendation**
  Despite the risk of sanitization, the viability of the residency depends on our relationship with our Lisbon partners and neighbors. If we cannot guarantee that our fellows will not actively disrupt daily life, we will lose our local license to operate.

  I recommend we **amend the Guest Charter** to treat key everyday conventions (tipping, queuing, pedestrian safety) as explicit conditions of stay.

  However, the language should not frame this as "obedience." It should frame it as **Community Integration.** The Charter should state that acceptance of the residency includes a voluntary agreement to adhere to local social contracts regarding economic exchange and public safety, acknowledging these as part of the hospitality agreement between the fellow and the host city.

  **Implementation Timeline**
  *   **Drafting:** Legal and Board review of new Charter language by next Monday.
  *   **Notification:** All current and incoming fellows notified of the policy update by Wednesday.
  *   **Effective Date:** The policy applies immediately to current fellows regarding future conduct, and formally for the next application cycle beginning January 1st.

  We must protect the writers' freedom to think, but we cannot protect their freedom to impose their skepticism on the people who serve them.
