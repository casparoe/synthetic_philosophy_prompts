prompt: |-
  I'm on the advisory board for this writer's residency we run in Lisbon—I'm a novelist, so mostly I'm there to read the fiction submissions and pretend I understand budgets. Anyway we've got a concrete mess. One of our fellows, a german writer, refused to tip cafe staff and kept jaywalking and skipping queues. She says these are just social choreography, not moral obligations, and that visitors shouldn't be forced to follow local conventions that have no universal claim; she even called herself a "normative tourist" sampling practices without subscribing to them. Now our local partners want her formally reprimanded or removed, while half the board thinks we're being provincial and should defend her right to opt out. I need a short memo for tuesday's meeting—recommend whether we should amend our guest charter to treat everyday conventions like tipping, queuing, and jaywalking as conditions of stay, or whether we should reject that and protect visitor autonomy. The reasoning should engage her position seriously, not just restate "when in Rome," and should honestly lay out the strongest consideration for whichever side loses. No citations or reading lists, please—half the board can't search and I don't want to fake references. Just a clear recommendation with a time frame for implementation if we go with it. Also, try to seperate the idea of being a respectful guest from being subject to local norms, since that distinction seems to be where the argument actually lives.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Advisory Board Member (Novelist) for a Writer's Residency in Lisbon.
      *   **Task:** Write a short memo for Tuesday's meeting.
      *   **Issue:** A German fellow refused to tip, jaywalked, and skipped queues, claiming these are "social choreography" not moral obligations, and labeled herself a "normative tourist."
      *   **Conflict:** Local partners want her reprimanded/removed vs. half the board thinks this is provincial/defends visitor autonomy.
      *   **Goal:** Recommend whether to amend the guest charter to treat everyday conventions (tipping, queuing, jaywalking) as conditions of stay OR reject that and protect visitor autonomy.
      *   **Requirements:**
          *   Engage her position seriously (don't just say "When in Rome").
          *   Distinguish between "being a respectful guest" and "being subject to local norms."
          *   Honestly lay out the strongest consideration for the losing side.
          *   No citations/reading lists.
          *   Clear recommendation with a time frame for implementation.
          *   Tone: Professional, thoughtful, decisive, suitable for a board meeting.

  2.  **Deconstruct the Core Philosophical Conflict:**
      *   *The Fellow's Argument:* Local norms (tipping, queuing, traffic) are arbitrary social constructs ("choreography"). As a temporary visitor, she isn't bound by the implicit social contract of residents. She is observing/sampling, not subscribing.
      *   *The Local/Board Argument:* These norms facilitate social harmony and economic fairness. Ignoring them causes friction, disrespects the host community, and privileges the visitor over the resident.
      *   *The Crucial Distinction:* "Respectful Guest" vs. "Subject to Local Norms."
          *   *Respectful Guest:* Actively considers the impact of actions on hosts, avoids harm, acknowledges hospitality.
          *   *Subject to Local Norms:* Blindly follows rules regardless of context or moral weight.
      *   *Synthesis:* The fellow confuses *autonomy* with *insensitivity*. While she isn't a citizen, she is a guest. Hospitality relies on reciprocity. If the "choreography" affects others (waiters losing income, pedestrians risking safety, locals waiting longer), it ceases to be purely personal preference and becomes a relational obligation.

  3.  **Determine the Recommendation:**
      *   *Option A (Amend Charter):* Make specific behaviors mandatory. Pros: Clarity, protects local relationships. Cons: Policing petty behavior, feels authoritarian, might stifle the "outsider" perspective residencies often value.
      *   *Option B (Protect Autonomy):* Let her do what she wants. Pros: Intellectual freedom. Cons: Damages community trust, risks the residency's future in Lisbon.
      *   *Decision:* The residency depends on local goodwill. If the neighbors hate us, we close. Therefore, we must align with local expectations *but* frame it correctly. It's not about blind obedience; it's about the ethics of hospitality.
      *   *Refined Recommendation:* Amend the charter, but frame it around "Relational Responsibility" rather than a list of dos and don'ts. However, the prompt asks to choose between treating conventions as conditions OR protecting autonomy. Given the threat of removal by partners, the practical choice is to treat key conventions as conditions. I will recommend amending the charter to include these as conditions of stay, but grounded in the ethics of hospitality.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly.
      *   **Engaging the Fellow's Position:** Acknowledge her point. She's right that norms are constructed. Tipping *is* arbitrary globally. Jaywalking *is* often safe. But she's wrong about the *context* of a residency.
      *   **The Distinction (Guest vs. Subject):** This is the core. A tourist can be anonymous; a fellow is a representative. "Subject to norms" implies legal/civic duty. "Respectful guest" implies moral/relational duty. The residency is a relationship, not a transaction.
      *   **The Strongest Counter-Argument (The Losing Side):** If we enforce this, we risk sanitizing the writer's experience. We might discourage critical thinkers. We risk becoming a behavioral police force. I need to state this honestly.
      *   **Recommendation:** Amend the charter.
      *   **Implementation:** Timeline (before next cycle).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Amend the charter" too blunt?
      *   *Adjustment:* Make sure the amendment isn't just a rule list. It should be a "Community Integration Agreement." But for the sake of the prompt's binary choice (conditions of stay vs. autonomy), I must lean towards conditions.
      *   *Tone Check:* Ensure I don't sound like I'm scolding the board or the fellow. Keep it analytical.
      *   *The "Normative Tourist" concept:* Address this. A tourist passes through; a fellow inhabits. That's the difference.
      *   *The "Losing Side" Consideration:* If we rule against autonomy, the loss is the potential for friction-as-art. Some disruption is valuable. I need to acknowledge that enforcing norms might make the residency too comfortable/safe.

  6.  **Final Polish:**
      *   Check constraints: No citations. Short memo. Clear recommendation. Time frame. Distinguish guest/norms.
      *   *Word Choice:* Use "social choreography" (her term) back at her. Use "reciprocity."
      *   *Formatting:* Clean headings.

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Recommendation (Amend vs. Autonomy)? Yes (Amend).
      *   Engage her position seriously? Yes (acknowledge arbitrariness of norms).
      *   Strongest consideration for losing side? Yes (risk of sanitization/compliance).
      *   No citations? Yes.
      *   Distinguish respectful guest vs. subject to norms? Yes.
      *   Time frame? Yes.

  **(Self-Correction Note):** I need to make sure I don't just say "follow rules." I need to explain *why* following these specific rules constitutes respect, distinguishing it from blind submission. The fellow argues these aren't moral obligations. I need to argue that in the context of *hospitality*, they become moral obligations because they impact the host.

