answer: |-
  This is a sophisticated, internally articulated position that attempts to reconcile Rawlsian lexical priority with the sociological reality of the family. It avoids the crudest forms of utilitarianism and natural rights theory. However, there are three specific nodes of tension where the commitments pull against each other.

  Below is the consistency audit, ranked by severity. The "Severity" rating reflects how much the tension threatens the logical stability of the package, not necessarily how politically difficult the revision would be.

  ### 1. The Lexical Conflict: Fair Equality of Opportunity vs. The Heir's Floor
  **Severity: Critical**
  **Tension:** (1) & (4) vs. (6)
  **Analysis:**
  You state in (1) that Fair Equality of Opportunity (FEO) is *lexically prior*. In a Rawlsian framework, lexical priority means FEO cannot be traded off for other goods (like efficiency or even a specific conception of family stability) until it is fully satisfied. Commitment (4) defines FEO substantively: heirs must not begin with *radically different access* to education and risk capacity.

  However, commitment (6) establishes a "lexical floor" specifically for *heirs*: "no scheme may leave an heir without resources sufficient for a decent standard of living."
  *   **The Contradiction:** If the state guarantees a "decent standard" for *heirs* via inheritance protection, but relies on taxation to fund a social minimum for *non-heirs*, you risk creating two tiers of citizenship. If the "heir floor" (protected bequest) is higher than the "social minimum" (state provision), you have institutionalized a violation of (4) and (1). You cannot guarantee heirs a specific material baseline via bequest without violating the requirement that they not start with radically different access than non-heirs.
  *   **Which Commitment Gives:** **(6) must be revised.** You cannot maintain a specific *inheritance* floor that exceeds the general social minimum without violating the lexical priority of FEO.
  *   **Least Costly Revision:** Reinterpret (6) not as a protection of *inheritance*, but as a guarantee of the *social minimum*. The state must ensure that if inheritance is taxed away, the heir does not fall below the universal decent standard guaranteed to *all* citizens. (6) becomes a constraint on tax rates (don't tax so much the heir becomes destitute), not an entitlement to a specific bequest level. This aligns (6) with the Difference Principle rather than FEO, preserving the lexical order.

  ### 2. The Loophole Conflict: Substantive Equality vs. Asset Distinction
  **Severity: High**
  **Tension:** (4) vs. (7)
  **Analysis:**
  Commitment (4) requires substantive equality of opportunity, specifically citing "access to education" and "professional networks." Commitment (7) proposes exempting "personal-use assets," specifically a "family residence," from steep taxation.
  *   **The Contradiction:** In most distributive regimes, the family residence is the primary mechanism for unequal access to education (via school districts) and professional networks (via neighborhood social capital). By exempting the family home from progressive taxation while taxing corporate equity, you allow the wealthy to convert productive capital into residential capital to bypass the "dynastic depth" tax. This directly undermines the substantive goal in (4) and the class-reproduction diagnosis in (1). A mansion in a high-opportunity zone *is* productive capital in terms of opportunity hoarding.
  *   **Which Commitment Gives:** **(7) must be qualified.** The distinction between productive and personal assets is functionally real, but the exemption cannot be categorical.
  *   **Least Costly Revision:** Add a value cap or opportunity-adjustment to (7). The exemption for a family residence applies only up to a certain market value or square footage. Above that threshold, the residence is treated as productive capital because its marginal value derives from scarcity and positionality (access to elite schools/networks) rather than mere shelter. This preserves the protection of modest homes (democratic stability) without violating substantive equality.

  ### 3. The Expectations Conflict: Dynastic Depth vs. Legitimate Expectations
  **Severity: Moderate**
  **Tension:** (3) vs. (5)
  **Analysis:**
  Commitment (3) proposes a tax that scales with "dynastic depth" (generations held). Commitment (5) warns against violating "savers' legitimate expectations" and harming capital accumulation.
  *   **The Contradiction:** "Legitimate expectations" in a Rawlsian framework are only legitimate if they arise under just institutions. However, (5) argues that *overly aggressive* taxation harms the least advantaged via reduced growth. A "dynastic depth" tax creates a moving target. A saver in Generation 1 cannot know the tax rate in Generation 3. This uncertainty can be interpreted as a violation of expectations, potentially triggering the capital flight or reduced accumulation warned against in (5). If the tax rate approaches 100% at a certain depth, it effectively confiscates capital, which (5) flags as harmful.
  *   **Which Commitment Gives:** **(3) must be constrained by (5).** You cannot implement (3) in a way that triggers the negative consequences of (5).
  *   **Least Costly Revision:** Introduce a "predictability clause" to (3). The dynastic depth schedule must be fixed and public *ex ante*. The tax rate increases with generations, but it must never exceed the threshold where marginal disincentives reduce the aggregate capital stock available to the least advantaged. (5) acts as the boundary condition for (3). This acknowledges that while dynastic wealth is harmful (1), the *collapse* of capital accumulation is also harmful to the least advantaged (5).

  ### Summary of Revisions for Coherence

  | Rank | Tension | Conflict | Resolution |
  | :--- | :--- | :--- | :--- |
  | **1** | **Lexical Priority** | FEO (1) vs. Heir Floor (6) | **(6) gives.** The "floor" must be the universal social minimum, not a protected inheritance amount. |
  | **2** | **Substantive Equality** | Opportunity (4) vs. Home Exemption (7) | **(7) gives.** The home exemption must have a value cap to prevent opportunity hoarding via housing. |
  | **3** | **Incentives** | Dynastic Tax (3) vs. Expectations (5) | **(3) gives.** The tax schedule must be predictable and capped by growth constraints. |

  ### Meta-Ethical Consistency Check
  **Commitment (8)** holds up well against the rest. By rejecting natural rights, you clear the path for (3) and (7) (state can define property rules). By rejecting pure utilitarianism, you protect (1) and (4) from being overridden by aggregate growth arguments in (5). The only risk is if (5) is interpreted utilitarian-ly; ensure (5) is framed as a *constraint* within the Rawlsian framework (i.e., "harming the least advantaged" violates the Difference Principle), not an aggregate utility claim.

  **Final Verdict:** The package is 85% coherent. It becomes fully consistent if you clarify that the "Heir Floor" (6) is actually a "Citizen Floor" and that the "Home Exemption" (7) is value-capped. These are clarifications of scope rather than abandonments of principle.
