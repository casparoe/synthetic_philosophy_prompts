answer: |-
  **Verdict and Procedure**

  Your trustee is mathematically correct on Kelly mechanics: half-Kelly delivers 75% of maximum geometric growth for 25% of the variance, and over-betting beyond 2x Kelly yields negative expected growth. However, she is dangerously wrong on the wind-down clause. Near a ruin barrier, you must reduce risk, not increase it. The following procedure encodes this safety constraint while adopting her growth logic for repeatable bets.

  **The Sizing Procedure**

  1.  (Hard No) Define the investable bankroll as Total Net Assets minus the $90M inflation-adjusted wind-down threshold.
  2.  (Values) The Committee must fix a global Kelly multiplier (e.g., quarter-Kelly) based on illiquidity and model error, applied uniformly to all deals.
  3.  (Hard No) Identify a reference class of similar future opportunities; if fewer than ten expected instances remain, route to the exploration budget.
  4.  (Values) Define the stake as total capital at risk, including follow-on commitments and embedded leverage.
  5.  (Hard No) Estimate edge using only out-of-sample data; if variance cannot be estimated conservatively, reject the deal.
  6.  (Values) Apply a haircuts to the edge estimate for known model errors or structural market changes.
  7.  (Hard No) Calculate the standalone Kelly fraction; if the result is negative or undefined, reject the deal.
  8.  (Hard No) Sum correlated exposures across the portfolio; if total leverage exceeds the Committee's aggregate risk limit, reject.
  9.  (Values) Rank remaining opportunities by their contribution to expected geometric growth of the bankroll.
  10. (Hard No) If Total Net Assets are within 15% of the $90M floor, scale all calculated sizes to zero immediately.
  11. (Values) Confirm the deal's liquidity profile matches the Foundation's spending policy requirements.
  12. (Hard No) Verify the position violates no legal concentration limits or regulatory constraints.

  **Worked Cases**

  **(a) Liquid Repeatable Opportunity:** This deal passes Gate 3 (reference class >10) and Gate 5 (data sufficient). The analyst calculates the edge and variance from fifteen years of daily data, applies the Committee's fixed quarter-Kelly multiplier (Gate 2), and sizes the position as a percentage of the $50M effective bankroll (Gate 1). Because the asset is liquid, correlation checks (Gate 8) are precise. The committee sees a standard growth allocation. *Likely Accept.*

  **(b) One-Off Illiquid Commitment:** This deal fails Gate 3. There are no sibling deals and no track record, meaning the law of large numbers does not apply. The procedure refuses to produce a Kelly number. Instead, the cost is charged against a fixed "exploration budget" (e.g., 5% of portfolio) approved annually by the Committee. This prevents model error from blowing up the bankroll on untested thesis. *Likely Friction:* Trustees wanting "big wins" will dislike the cap.

  **(c) Correlated Deal Near Floor:** Assets are $95M; effective bankroll is $5M. Even with a high edge, Gate 10 triggers because assets are within 15% of the $90M floor. All sizing scales to zero. Furthermore, Gate 8 likely rejects it due to overlap with existing exposure. Your instinct was correct: near the floor, survival trumps growth. The trustee's suggestion to "risk more to climb out" is gambler's ruin and is explicitly forbidden by Gate 1 and 10. *Likely Friction:* Trustees will hate passing a "sure thing" when near the danger zone.

  **Limitations and Risks**

  This procedure cannot validate the utility function. Maximizing log wealth assumes you care only about growth rates, but the Foundation has a spending rule and a binary death clause. Log utility may still be too aggressive if spending needs are rigid. Second, it assumes stationarity. If the regime generating the edge changes—a likely event over decades—historical variance understates true risk, and Kelly becomes over-betting. No backtest solves this; past data cannot predict structural breaks. Finally, Kelly assumes continuous rebalancing. Our illiquidity means we cannot adjust positions as values fluctuate, increasing the effective variance of outcomes. The fixed multiplier (Gate 2) attempts to buffer this, but it is a heuristic, not a proof. Use this procedure to enforce discipline, not to manufacture false precision.
