      *   *>2x Kelly:* If $f > 2f^*$, expected log growth becomes negative. Trustee is right.
      *   *Wind-down Clause:* This is a ruin constraint. Kelly assumes infinite horizon. Near a barrier, risk should usually *decrease*, not increase (gambler's ruin). The trustee suggested taking more risk near the floor to climb out. This is generally wrong for survival-constrained entities unless the utility function is explicitly binary (survive/die) and the only way to survive is a lottery ticket. But usually, preserving capital near the barrier is paramount. I need to settle this: The user was right (reduce risk), trustee was wrong (increasing risk invites ruin).
      *   *Fraction of What:* Kelly fraction is usually of *total portfolio equity*. But for illiquid/private, it's often of *commitment capital*. Given the wind-down clause, it must be of *Total Net Assets* relative to the safety margin.
      *   *Reference Class:* Essential for Kelly. If $N < 10$, law of large numbers doesn't apply. Use "exploration budget".

