answer: |-
  This is an exceptionally sharp observation. You have identified a friction point that keeps contemporary epistemology and philosophy of language quite busy, even if the seminar you are sitting in hasn't yet reached the specific literature that addresses it.

  The standard view you are likely encountering in the seminar is the **Knowledge Norm of Assertion (KNA)**, championed by Timothy Williamson. It holds that one must assert $p$ only if one knows $p$. Your examples demonstrate that knowledge (justified true belief, or even something stronger) is *necessary* but not *sufficient* for appropriate assertion in a professional scientific context.

  To answer your primary question: **Yes, this is a genuine norm, but it is best understood not as a norm of assertion *simpliciter*, but as a norm of *epistemic responsibility* or *commitment* within a specific community of inquiry.**

  Here is a breakdown of how philosophy maps onto your three cases, followed by answers to your specific questions about edges, sources, and devices.

  ### 1. What is this norm?

  There are three main philosophical frameworks that capture what you are seeing. None has a single universally accepted label, but they converge on the same intuition.

  **A. The Brandomian "Commitment" Norm**
  The philosopher Robert Brandom argues that to assert something is not merely to describe the world; it is to undertake a **commitment**. When you assert $p$, you license others to rely on $p$, and you obligate yourself to defend $p$ if challenged.
  *   **Your Cases:** In all three instances, the speakers were willing to state a fact but unwilling or unable to undertake the *consequences* of that statement (defending it, explaining it, tracing its implications).
  *   **The Norm:** "Assert only if you are prepared to undertake the justificatory responsibility for the content."

  **B. The Norm of Understanding**
  There is a growing debate distinguishing *knowledge* from *understanding*. You can know a fact via testimony (the postdoc reading the abstract) without understanding the mechanism.
  *   **Your Cases:** The technician knew the result (knowledge) but didn't understand the assay (no grasp of the causal mechanism). The colleague knew the fact but lacked the contextual understanding until he cited the source.
  *   **The Norm:** "In a context of inquiry, assert only if you possess a degree of understanding appropriate to the claim."

  **C. Epistemic Authority and Division of Labor**
  This comes from social epistemology (e.g., Edward Craig, Alvin Goldman). Concepts of knowledge function to flag reliable informants. In a specialized field, "authority" is not just about being right; it is about occupying a specific node in the network of trust.
  *   **The Norm:** "Assert only if you occupy the appropriate epistemic station to vouch for this claim."

  ### 2. Is it a norm of assertion or something else?

  It is helpful to distinguish between **assertion as a speech act** and **assertion as a professional move.**

  In everyday life ("It's raining outside"), the Knowledge Norm usually suffices. If I know it's raining, I can tell you. I don't need to explain barometric pressure.
  However, in a **scientific seminar or lab meeting**, the goal is not just information transfer; it is *quality control* and *integration*. The norm you are noticing is a **local norm of scientific discourse**. It is a hybrid of an assertion norm and a **norm of inquiry**.

  If we treat it purely as a norm of assertion, we run into trouble (because the postdoc *did* know the finding). If we treat it as a norm of inquiry, it fits perfectly: you cannot contribute to the *construction* of knowledge if you cannot manipulate the reasons supporting it.

  **Verdict:** It is a norm of **assertion-in-context**. Specifically, it is the norm that governs *originating* assertions versus *reporting* assertions.

  ### 3. Addressing the Edges

  You asked four specific questions about the boundaries of this norm. Here is how the philosophical literature (and your intuition) handles them.

  **Q: Why does naming a source discharge the norm?**
  **A:** It changes the **locus of commitment**.
  When the colleague named the source, the speech act shifted. He was no longer saying, "I vouch for $p$." He was saying, "Author X vouches for $p$, and I vouch for the reliability of Author X."
  In Brandom's terms, he deferred the justificatory responsibility. He is no longer the *originator* of the claim but a *transmitter*. The criticism stopped because the audience realized they were not challenging *him* on the physics, but rather checking the *provenance* of the data. Once provenance was established, the chain of accountability was complete.

  **Q: Does it admit of degrees?**
  **A:** Yes, absolutely. This is where **Virtue Epistemology** is useful.
  Intellectual responsibility is a virtue that comes in degrees.
  *   **Low Stakes/General Audience:** "I read that climate change is accelerating." (Source: News). This is acceptable at a dinner party.
  *   **High Stakes/Specialist Audience:** "I read that climate change is accelerating." (Source: News). This is unacceptable at a geophysics seminar.
  The "depth" of defense required scales with the **epistemic stakes** and the **speaker's role**. A PhD candidate is held to a higher standard of defensive capability than an undergraduate; a principal investigator is held to a higher standard than a technician. The technician's role is to produce data, not to interpret it; when he interprets it without understanding, he violates the norm of his specific role.

  **Q: Why does it vary with the audience?**
  **A:** Because assertion is a **social technology**.
  The function of assertion changes based on the community.
  *   **For Students/Journalists:** The function is *education* or *dissemination*. The authority lies in the institution or the speaker's general reputation. The audience is not expected to challenge the premises deeply.
  *   **For Specialists:** The function is *validation* and *integration*. The audience *is* the quality control mechanism. If you assert something you cannot defend, you are effectively breaking the mechanism. You are asking them to integrate a brick into a wall without testing its load-bearing capacity.
  This is why the norm is stricter in the lab meeting. The audience consists of peers whose job is to find errors. By asserting without defensibility, you are wasting their time or risking the project's integrity.

  **Q: What about a device that emits true sentences it cannot defend?**
  **A:** This is the "Killer Case" for the Knowledge Norm, but it supports the **Responsibility Norm**.
  If a thermometer displays "25°C," it is not *asserting* in the normative sense. It is *indicating*.
  *   **Assertion** requires a agent who can be held accountable. You can blame a scientist for lying or being negligent. You cannot blame the thermometer.
  *   If a device (or an AI) emits sentences, philosophers generally categorize this as **quasi-assertion**. It lacks the normative "force."
  *   **The Test:** If the device is wrong, we don't say it *lied* or was *irrational*; we say it *malfunctioned*.
  *   **Conclusion:** The norm you identified applies only to agents capable of undertaking commitments. A device cannot satisfy this norm because it cannot *have* the norm. It highlights that the norm is not about the *truth* of the sentence, but about the **status of the speaker**.

  ### Summary for your Seminar

  If you wish to raise this in your seminar, you might frame it this way:

  > "The Knowledge Norm explains why we shouldn't assert falsehoods or guesses. But it fails to explain why we shouldn't assert things we know via testimony when we are expected to be sources of understanding.
  >
  > My experience suggests a **Responsibility Norm**: To assert $p$ in a context of inquiry is to offer oneself as a guarantor of $p$'s defensibility. Knowledge is the *input*, but **accountability** is the *output*. When a speaker cannot defend $p$, they are not merely lacking knowledge; they are misrepresenting their own epistemic agency. They are acting as a source when they are merely a conduit."

  You have effectively rediscovered the distinction between **possessing knowledge** and **holding authority**. In geophysics, as in philosophy, data is cheap; accountability is expensive. The norm you are noticing is the social mechanism that protects the value of that accountability.
