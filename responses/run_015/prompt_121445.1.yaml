  2.  **Deconstruct the Phrase (ECREE):**
      *   *Attribution:* It's often associated with Carl Sagan (*The Demon-Haunted World*), but the sentiment is Humean (*Of Miracles*). Laplace is also relevant regarding probability.
      *   *Reading 1: The Probabilistic/Bayesian Reading.* "Extraordinary" = Low Prior Probability. "Extraordinary Evidence" = High Likelihood Ratio.
      *   *Reading 2: The Paradigm-Shifting Reading.* "Extraordinary" = Contradicts established laws/theories. "Extraordinary Evidence" = Evidence robust enough to overthrow the theory.
      *   *Reading 3: The Evidential Quality Reading.* "Extraordinary Evidence" = Evidence that is itself miraculous or impossible to fake (the teacher's Hume point).

  3.  **Evaluate Each Reading:**

      *   **Reading 1: Bayesian/Probabilistic.**
          *   *Meaning:* Claim $C$ has low prior $P(C)$. To raise posterior $P(C|E)$, we need strong evidence $E$.
          *   *Status:* Mathematically true (Bayes' Theorem). It's a platitude in probability theory.
          *   *Problem:* It doesn't rule out miracles *a priori*. If the evidence is strong enough, you *should* believe. It doesn't "kill" the discussion; it just sets the bar.
          *   *Verdict:* Platitude/True, but doesn't do the work the classmate wants.

      *   **Reading 2: Paradigm-Shifting (Kuhnian-ish).**
          *   *Meaning:* "Extraordinary" = Violates laws of nature. "Extraordinary Evidence" = Evidence that forces a rewrite of science.
          *   *Status:* Defensible as a heuristic for scientific inquiry.
          *   *Problem:* Still doesn't rule it out *in principle*. If the evidence *is* there, science rewrites.
          *   *Verdict:* Defensible, but doesn't end the argument unless one assumes the evidence *can't* exist.

      *   **Reading 3: The "Humean"/Circular Reading (What the classmate likely implies).**
          *   *Meaning:* A miracle violates a law of nature. A law of nature is established by uniform experience. Therefore, the evidence against the miracle (uniform experience) is as strong as evidence can possibly be. Therefore, no testimony can ever suffice.
          *   *Status:* This is where the circularity lies. It defines "law of nature" as "what always happens," so a counter-example becomes impossible by definition. Or it assumes the prior probability is effectively zero.
          *   *Verdict:* This is the one needed to end the argument, but it is question-begging (circular).

