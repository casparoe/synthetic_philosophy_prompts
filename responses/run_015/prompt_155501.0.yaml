  Here is a specific conceptual case study designed for your dataset. It isolates the tension between **dramatic interiority** (what the film claims the subject felt) and **relational provenance** (who owns the memory of that feeling).

  ### Case Study: The "Kitchen Confessional" in *The Iron Saint* (Hypothetical)

  **The Subject:** Elias Thorne (1920–1998), a renowned humanitarian and labor organizer known for his stoic, self-sacrificing public persona.
  **The Descendant:** Martha Thorne (84), his only daughter, who cared for him in his final decade and manages his estate.
  **The Film:** A prestige biopic released 25 years after Thorne's death.

  **The Invented Scene:**
  In the film's second act, there is a scene set in 1954. Thorne is packing a bag late at night to leave for a strike negotiation. His young daughter (Martha) is standing in the doorway in her nightgown. The historical record confirms Thorne left on this trip; there are train tickets and union minutes. However, there is no diary entry, letter, or witness account of what was said in the kitchen.

  The screenwriter invents the following dialogue:
  > **Thorne:** "Go back to bed, Marty."
  > **Martha:** "Will you be back for Sunday?"
  > **Thorne:** "Sunday belongs to the men who have nothing. You have a roof. They have nothing. Don't make me choose between you and them, because I already chose."

  **The Technical Defense (Why it's not "libel"):**
  The filmmakers argue this is **emotional truth**, not factual falsehood. Thorne *did* prioritize the strike over family events. The dialogue is a dramatization of his known priorities. Since no transcript exists, the scene cannot be proven false in a court of law. It fits the "profile" of the man.

  **The Specific Harm to the Descendant:**
  Martha, now 84, remembers this night vividly. She recalls her father kneeling to hug her, apologizing, and looking pained. In her lived memory, his absence was a **tragedy he suffered**, not a **choice he weaponized**.

  By scripting the line *"Don't make me choose... I already chose,"* the film reframes Thorne's moral legacy from **Reluctant Martyr** to **Calculated Utilitarian**.
  *   **The Inherited Harm:** Martha has spent 60 years defending her father's absence to her own children and grandchildren as an act of love for the greater good. The film retroactively turns her childhood sacrifice into collateral damage of his ego. It suggests his virtue was performative and his private self was cold.
  *   **The Violation:** Martha is not upset about "inaccuracy" in the abstract. She is upset because the film has seized **narrative ownership of her own childhood**. She was the other person in that room. By inventing words for her father that she knows he never spoke, the filmmaker is effectively gaslighting the only living witness to the subject's private morality.

  **The Conceptual Tension: "Emotional Provenance"**
  This example moves beyond "did it happen?" to **"who holds the rights to the silence?"**

  1.  **The Gap of Intimacy:** History records actions; biopics claim to record *intent*. When a filmmaker fills a gap in the historical record with invented dialogue, they are claiming authority over the subject's interior life.
  2.  **The Descendant as Archivist:** In this scenario, the descendant views themselves not just as a relative, but as the **custodian of the subject's moral context**. When the film invents a conversation that makes the subject sound cruel (even if "thematically consistent"), it devalues the descendant's lifelong labor of contextualizing that subject's life.
  3.  **The Consent Paradox:** The dead cannot consent to having their private silence filled with public noise. The living descendants inherit the reputational fallout. If the film implies Thorne was emotionally abusive in private (even subtly), it stains the family's current social capital, not just the dead man's history.

  **Why this fits your dataset criteria:**
  *   **No Factual Contradiction:** He did leave that night. He did prioritize work.
  *   **Moral Reframing:** Shifts from "sacrifice" to "selection."
  *   **Living Harm:** The elderly daughter feels her own memory is being overwritten by a screenwriter's thematic need for a "dark moment."
  *   **Core Issue:** It questions whether a family has a **veto right over the dramatization of private intimacy**, even when the public facts remain intact. It posits that there is a **right to one's ancestors' silence** that expires differently than the right to their image.

  **Annotation Tag:** *Posthumous Narrative Colonization / Relational Gaslighting*
