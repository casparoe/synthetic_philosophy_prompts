      The scheme does not embody one coherent moral theory but rather a bureaucratic compromise best described as Risk-Managed Retribution. It utilizes retributive language to legitimize the sanction while employing forward-looking and procedural mechanisms to mitigate institutional risk.

      The statutory rejection of deterrence is rhetorical, not operational. By making future dangerousness a statutory aggravator, the scheme reintroduces a forward-looking rationale under the guise of culpability. Pure retributivism looks only backward; permitting psychiatrists to predict violence licenses punishment based on what a defendant *might* do, not just what they *did*. This feature quietly rules out pure retributivism while maintaining its vocabulary. Conversely, the requirement that aggravators outweigh mitigators without a standard for the latter preserves the appearance of individualized moral judgment, weakly licensing expressivist theories where the process itself communicates condemnation.

      The treatment of innocence reveals a utilitarian undercurrent incompatible with strict desert. If the scheme were purely retributive, factual innocence would be an absolute veto on punishment, as punishing the innocent is intrinsically wrong. However, by limiting post-conviction cognizability to constitutional violations and compensating exonerees at a flat tort rate, the state treats wrongful imprisonment as a priced cost of administration rather than a moral catastrophe. This presupposes that wrongful executions are an acceptable statistical error, provided the system overall functions. This is incompatible with deontological retributivism but consistent with a rule-utilitarian calculation where the benefits of the scheme outweigh the costs of occasional error. The clemency board's intervention acts as a safety valve, acknowledging the moral cost without altering the legal theory.

      The practice of executing only volunteers while imposing decades of delay on resisters suggests the state views the *condemnation* as the primary punishment, not the physical suffering. Pure retributivism demands the imposition of hard treatment regardless of consent; the volunteer exception implies the state lacks the moral will to overcome resistance, prioritizing its own legitimacy over full desert. The delay reinforces an expressive theory: the judgment itself carries the weight, while the execution is merely administrative finality. If retribution were about suffering, delay would undermine it (uncertainty); if deterrence were primary, delay would nullify it (lack of certainty). The practice thus presupposes that the *status* of being condemned is the true penalty.

      Regarding counterfactuals: If the state adopted a straightforward expected-deterrence view, the scheme would collapse. Deterrence requires certainty and celerity; the decades-long delay and volunteer-only practice would need elimination to maximize the deterrent signal. The standard of proof might lower to increase conviction rates, and future dangerousness would become the primary, not secondary, criterion. Conversely, if never punishing an innocent person were an absolute side-constraint, the legal infrastructure would require radical change. Post-conviction claims of factual innocence would become cognizable, likely halting executions given the error rate. The compensation scheme would become obsolete because no wrongful imprisonments would be tolerated. The existence of the sanction itself might vanish, as the risk of error inherent in human adjudication makes an absolute innocence constraint incompatible with capital punishment's finality.

      Ultimately, the scheme presupposes that punishment is a state function requiring moral cover (retribution), risk assessment (dangerousness), and error management (compensation/clemency). It is not a moral theory but a governance strategy.

