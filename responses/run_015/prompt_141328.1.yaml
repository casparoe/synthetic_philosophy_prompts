          *   Alternative: Life without parole (LWOP) available and used.
          *   Post-conviction: New evidence of innocence not cognizable unless constitutional violation occurred.
          *   Clemency: Recommends commutation if substantial doubt about guilt (repeatedly done).
          *   Compensation: Exonerees paid flat rate per year (same as other state injuries).
          *   Practice: No executed resisters in 15+ years. Only volunteers executed. Others wait decades, die, resentenced, or commuted.
          *   Error rate: 1 in 25 vacated for serious error; some innocent.
      *   **Specific Questions to Address:**
          *   One coherent view or stitched together?
          *   Does rejecting deterrence in statute rule it out, or does future-dangerousness reintroduce it?
          *   Does compensation imply wrongful executions are priced costs? Compatible with desert?
          *   Do volunteers vs. delays imply condemned has say over timing? Compatible with desert/deterrence?
          *   Does delay imply retribution is about condemning judgment rather than suffering?
          *   Counterfactuals: What changes if switched to expected-deterrence or absolute innocence constraint?

  2.  **Deconstruct the Scheme's Implicit Theory:**
      *   *Surface Theory:* Retributivism (Desert). Statute says so.
      *   *Operational Theory:* A hybrid, but not a coherent philosophical hybrid. It's a *bureaucratic* hybrid designed to manage risk and legitimacy rather than achieve a single moral aim.
      *   *Tension 1 (Desert vs. Dangerousness):* Statute rejects deterrence, but future dangerousness is an aggravator. This reintroduces forward-looking incapacitation/prevention under the guise of "aggravation." It suggests the theory is actually *Selective Incapacitation of the Worst*, where "Worst" is defined by both past culpability and future risk.
      *   *Tension 2 (Innocence vs. Finality):* Courts say innocence alone isn't enough (procedural finality), but Clemency acts on innocence (substantive mercy). This splits the theory: The *Law* prioritizes process integrity; the *Executive* prioritizes moral correctness. The compensation scheme treats wrongful imprisonment as a tort (state injury) rather than a moral catastrophe incompatible with retribution. This implies wrongful execution is a *calculable risk*, not a absolute veto. This contradicts pure retributivism (which demands guilt) but fits a utilitarian risk-management model.
      *   *Tension 3 (Volunteers vs. Delays):* Executing only volunteers while others wait decades suggests the state lacks the will to impose suffering on the resistant. Pure retribution demands suffering be imposed regardless of consent. Pure deterrence demands certainty/timeliness. The practice suggests the theory is *Expressive*: The judgment matters more than the suffering. The delay allows the condemnation to settle; the volunteerism allows the state to avoid the moral cost of overcoming resistance.
      *   *Coherence:* It is not one coherent view. It is a *Legitimacy-Maintenance Theory*. It uses retributive language to justify the sanction, forward-looking risk assessment to select candidates, procedural barriers to ensure finality, and executive mercy/compensation to manage the moral cost of error.

  3.  **Drafting the Argument (incorporating specific questions):**
      *   *Thesis:* The scheme presupposes a hybrid theory of *Risk-Managed Retribution*. It is not coherent morally, but coherent bureaucratically.
      *   *Deterrence/Dangerousness:* The statutory rejection of deterrence is rhetorical. Future dangerousness reintroduces forward-looking incapacitation. This rules out pure retributivism (which cares only about past acts) but fits a "dangerousness" model.
      *   *Compensation/Innocence:* Paying exonerees at a flat rate treats wrongful conviction as a tortious cost of doing business, not a moral abomination that invalidates the system. This is incompatible with strict retributivism (which requires guilt as a necessary condition) but compatible with a utilitarian calculus where some error is acceptable if the system overall works.
      *   *Volunteers/Delay:* Executing only volunteers implies the state views the *consent* to punishment as mitigating the moral cost of killing. Pure desert demands imposition regardless of will. The delay suggests the *condemnation* (the judgment) is the primary punitive act; the physical execution is secondary/administrative. This aligns with expressive theory over pure suffering-based retribution.
      *   *Counterfactuals:*
          *   *Switch to Expected-Deterrence:* You would need to execute quickly and certainly (ending delays/volunteerism) and possibly expand eligibility to maximize deterrent signal (reducing aggravator strictness).
          *   *Absolute Innocence Constraint:* You would need post-conviction innocence claims cognizable (changing habeas rules), likely ending executions given the error rate, or raising the trial standard of proof significantly.

