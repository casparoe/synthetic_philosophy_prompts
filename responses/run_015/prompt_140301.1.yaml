answer: |-
  ### I. The Funded Agenda: Three Questions and a Boundary Condition

  Given the constraints (three years, eight researchers, no Rosetta stone, existing data only), I would fund the following four open questions. They are ordered by **dependency**: later questions cannot be meaningfully attempted without provisional answers to the earlier ones.

  **1. The Validation Metric: How do we score a "decoding" without ground truth?**
  *   **Reasoning for Priority:** This is the bottleneck. The donor's constraint ("evaluable without a Rosetta stone") renders standard accuracy metrics impossible. If we cannot distinguish a genuine decoding from a pareidolic hallucination (seeing patterns in noise) using internal metrics alone, the other three questions are unscientific. We need a "Rosetta-Free Score."
  *   **Unlock/Render Pointless:** A robust metric unlocks the other three questions by providing an optimization target. Conversely, if we prove no such metric exists (i.e., underdetermination is total), the entire agenda collapses, and we save two years of futile work.
  *   **Feasibility (3 Years/8 People):** High. This is conceptual and computational. We can test candidate metrics (e.g., Minimum Description Length gain, predictive compression of held-out tokens, structural entropy reduction) against *known* scripts where we artificially hide the translation. Two researchers can build the benchmark suite; two can test metrics.
  *   **Neglectedness:** Highly neglected. Most cryptanalysis assumes some known plaintext or linguistic family. Most AI interpretability assumes we know the input/output semantics. The "no-prior" validation gap is wide.
  *   **2-Year Milestone:** A published benchmark suite (e.g., "The Blind Decryption Challenge") where algorithms are scored on their ability to recover structure from known ciphers/scripts *without* accessing the key, correlated with human expert judgment of "plausibility."
  *   **Contingency:** If internal metrics prove insufficient to distinguish signal from noise (the "guess goes the other way"), I would switch funding to **Question 4** (Theoretical Limits) to formally characterize the impossibility, terminating the empirical work early.

  **2. Neural Weights as Script: Do trained networks exhibit "decodable" latent structure?**
  *   **Reasoning for Priority:** This is the donor's suspected priority ("internal states of a trained neural network") and the only source of high-volume, high-dimensional data available without new collection. It is the stress test for Question 1.
  *   **Unlock/Render Pointless:** If NN weights yield to "decoding" using our Rosetta-Free Score, it validates the "meaning is located in the object" hypothesis. If they fail (i.e., they look like noise or purely causal mechanisms without semantic structure), it suggests the "message" metaphor for NNs is a category error, rendering the ETI and Script questions less urgent.
  *   **Feasibility:** Moderate. We have the weights (open-source models). The risk is that NNs are not "messages" but "mechanisms." We treat them *as if* they were scripts to see if the math holds. Three researchers can focus here.
  *   **Neglectedness:** Crowded in "interpretability," but neglected in "semiotics." Most work asks "what does this neuron do?" (functional) rather than "is this a sentence?" (structural).
  *   **2-Year Milestone:** A demonstration that a specific layer or attention head in a Transformer can be "translated" into a human-readable logic form using only the Validation Metric from Q1, without referencing the model's actual output behavior.
  *   **Contingency:** If NNs prove resistant to structural decoding (likely), I would pivot these researchers to **Synthetic Signal Generation** (creating known messages, scrambling them, and testing recovery) to refine the metric.

  **3. The Historical Control: Can we recover "meaning types" from undeciphered scripts?**
  *   **Reasoning for Priority:** Linear A, Rongorongo, and Indus Valley script provide the only real-world examples of triple-underdetermination where human intent is guaranteed (unlike NNs) but meaning is lost. This grounds the work in philology, not just math.
  *   **Unlock/Render Pointless:** Success here validates the metric on human language. Failure suggests human language has properties (e.g., cultural context) that NNs and ETI signals might lack. It renders Q2 less generalizable if scripts require cultural priors NNs don't have.
  *   **Feasibility:** Low to Moderate. Data is scarce. Three years is enough for a deep dive on *one* script (e.g., Linear A). One researcher + 1 senior PI.
  *   **Neglectedness:** Crowded by linguists, but neglected by computational semioticians. Most attempts fail because they assume a specific language family. We would assume *none*.
  *   **2-Year Milestone:** A probabilistic classification of the *genre* of the text (e.g., "administrative" vs. "ritual" vs. "narrative") derived solely from structural repetition and distributional semantics, without reading a single word.
  *   **Contingency:** If data scarcity blocks progress, merge this team with Q2 to treat historical scripts as "low-dimensional NNs."

  **4. The Underdetermination Horizon: When is recovery mathematically impossible?**
  *   **Reasoning for Priority:** This is the boundary condition. We need to know when to stop. There must be a ratio of signal length to code complexity where recovery is provably impossible without priors.
  *   **Unlock/Render Pointless:** Defines the limits of the foundation's mandate. If the Horizon is too close (i.e., most real cases are impossible), the agenda is doomed.
  *   **Feasibility:** High (Theoretical). Two researchers (math/info theory).
  *   **Neglectedness:** Very. Most work assumes recoverability is a matter of effort, not information theory.
  *   **2-Year Milestone:** A theorem or bound defining the "Minimum Signal Length" required to distinguish a code from random noise at a given complexity level, without semantic priors.

  ---

  ### II. The Defunding List: Three Non Sequiturs

  I would explicitly defund lines of work that rely on the following three claims. They are currently fashionable but logically flawed in the context of triple-underdetermination.

  **1. "Anomaly Detection Delivers the Frame Message."**
  *   **The Claim:** If we can detect statistical anomalies or "surprising structure" in a data stream, we have identified the "Frame" (i.e., confirmed this is a message).
  *   **Why it is a Non Sequitur:** Structure $\neq$ Message. Crystals have high structure; noise has low structure; messages have *specific* structure. An anomaly detector can identify that a signal is non-random, but it cannot distinguish between a natural phenomenon (a pulsar), a compression artifact, and a communicative act. Identifying the "Frame" requires inferring *intent* or *function*, not just deviation from a null model.
  *   **Defund:** Any project proposing to solve the "Frame" problem purely through unsupervised outlier detection.

  **2. "Once the Outer Message is Cracked, the Inner Message is Automatic."**
  *   **The Claim:** If we recover the code (syntax/grammar/encoding scheme), the content (semantics) follows essentially for free.
  *   **Why it is a Non Sequitur:** This confuses *syntax* with *semantics*. I can know that Linear A uses a syllabary (Outer) without knowing if a specific symbol means "grain," "god," or "king" (Inner). In NNs, I might identify a circuit that computes XOR (Outer) without knowing *why* the network needs XOR in that context (Inner/Function). The "Inner" message requires grounding, which the "Outer" code does not provide.
  *   **Defund:** Projects that treat "decoding" as a one-step process where syntax recovery implies semantic understanding.

  **3. "Self-Revealing Languages (Lincos-style) are Bootstrappable."**
  *   **The Claim:** A message can be designed (or discovered) that bootstraps its own meaning from arithmetic up to vocabulary, without external context (mid-century cosmic language proposals).
  *   **Why it is a Non Sequitur:** This assumes shared ontology. Arithmetic is not universal semantics; it is universal syntax. You can teach an alien to count, but you cannot teach them what a "cow" is via math alone (Quine's *Gavagai* problem). The jump from formal logic to natural kind concepts requires shared experience or ostension, which is absent in the triple-underdetermination case.
  *   **Defund:** Any work assuming that logical consistency alone can generate semantic content.

  ---

  ### III. The Scaffolding Critique and Revised Agenda

  **Is the Frame-Outer-Inner decomposition the right scaffolding?**
  **No.** It is heuristically useful but ontologically misleading.

  **The Critique:**
  The Frame-Outer-Inner model implies a **pipeline**: first you detect the message (Frame), then you break the code (Outer), then you read the text (Inner). In practice, under triple-underdetermination, these are **co-determined**.
  1.  **Frame is Posterior:** We rarely know "this is a message" *before* we find structure. We hypothesize it is a message *because* we found structure that looks decodable. The Frame is a confidence score, not a switch.
  2.  **Outer/Inner Entanglement:** You cannot validate the "Outer" (code) without hypothesizing an "Inner" (content) that makes sense. In cryptanalysis, you guess a word (Inner) to find the key (Outer). In NNs, you guess a concept (Inner) to find the circuit (Outer). They are solved jointly, not sequentially.
  3.  **Location Fallacy:** The scaffolding assumes meaning is *located* in the object. In the NN case, meaning might be *relational* (input-output manifold) rather than *contained* (weights). In the ETI case, meaning might be *physical* (a blueprint) rather than *linguistic*. The model biases us toward a "sender-receiver" communication model that may not apply.

  **The Replacement: Joint Constraint Satisfaction.**
  I replace the layers with **Constraints**. The problem is not "peeling layers" but **optimizing for Coherence** across three constraints:
  1.  **Structural Coherence:** Does the data have compressible regularities? (Replaces "Frame")
  2.  **Syntactic Coherence:** Do the regularities follow rule-based transformations? (Replaces "Outer")
  3.  **Semantic Coherence:** Do the transformations map to a stable, non-contradictory model of a world? (Replaces "Inner")

  Meaning is not "located"; it is the **fixed point** where these three constraints maximize mutual information.

  **The Revised Prioritization:**
  Given this correction, the prioritization shifts from "solving the layers" to "validating the optimization."

  1.  **Priority 1: The Validation Metric (Unchanged).**
      *   *Why:* Even more critical now. If meaning is a "fixed point" of coherence, we need a function to measure the distance to that point. Without a Rosetta stone, this metric is the *only* ground we stand on.
      *   *Change:* We stop looking for "Frame Detection" and start looking for "Coherence Maximization."

  2.  **Priority 2: The Underdetermination Horizon (Moved Up).**
      *   *Why:* If the scaffolding is a loop, we need to know when the loop closes vs. when it spins forever. Knowing the *limits* of Joint Constraint Satisfaction is more urgent than applying it to NNs. If the math says "impossible," we don't waste time on NNs.
      *   *Change:* This moves from a boundary condition to a foundational question.

  3.  **Priority 3: Neural Weights as Script (Moved Down).**
      *   *Why:* This is now an *application* of the metric, not a core question. If NNs don't have "meaning" in the communicative sense, treating them as scripts is a category error. We test them only to stress-test the Metric.
      *   *Change:* Reduced scope. Focus on whether they *fail* the coherence test.

  4.  **Priority 4: Historical Scripts (Merged).**
      *   *Why:* These become the "training data" for the Validation Metric. We know humans wrote them, so they represent the "maximum coherence" baseline.
      *   *Change:* No longer a standalone question; integrated into Q1 (Benchmarking).

  **Summary of Shift:**
  The original agenda assumed we could climb the ladder (Frame $\to$ Outer $\to$ Inner). The revised agenda acknowledges we are in a fog, trying to find a mountain by measuring the slope (Coherence). We prioritize the **clinometer** (Metric) and the **map of the fog** (Limits) over the **climb** (NNs/Scripts). If the donor's mandate is "how meaning gets located," the honest answer is: "It doesn't locate; it emerges from constraint satisfaction. We fund the measurement of that emergence."
