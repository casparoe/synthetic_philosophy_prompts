      *   *Refining the Bauman Critique:* I need to be careful here. Bauman *does* argue that the potential for such horror is inherent in modernity. However, the student writes: "the Holocaust is therefore best described not as a product of modernity at all but as a relapse into a premodern pattern of savagery." This is explicitly what Bauman argues *against*. He argues against the "anomaly" or "breakdown" theory. This is a clear misrepresentation, not just an interpretive difference.
      *   *Refining the Historikerstreit Critique:* The student says Habermas denies comparability "as such." This is factually incorrect regarding the historical record. Habermas objected to *Nolte's* comparison, not comparison itself. This is a settled historical fact about the debate.
