answer: |-
  # The Access Fund Allocation Procedure (v1.0)

  **Purpose:** To allocate termly funds consistently, fairly, and defensibly, minimizing the influence of writing ability and maximizing the relief of barriers to school participation.
  **Operators:** Two Student Representatives.
  **Time Budget:** 4 minutes per application.
  **Inputs:** Application paragraph, School Financial Status (Waiver/Non-Waiver), Item Cost.

  ### Part 1: The Classification Matrix (Pre-Meeting Setup)
  *This is the primary value judgment. The Committee must agree on these definitions before reading applications. This prevents gaming during the meeting.*

  **Tier 1: Basic Welfare (Access to Safety/Health)**
  *   *Examples:* Winter clothing, essential footwear, bus pass for commute, medical needs not covered elsewhere.
  *   *Rule:* These requests are "Lumpy." Partial funding usually renders the item useless (e.g., half a coat). Fund fully or decline.

  **Tier 2: Academic/Critical Opportunity (Access to Progress)**
  *   *Examples:* Exam fees, required calculators, mandatory trip deposits, essential software.
  *   *Rule:* These requests can often be "Scaled." Partial funding may still allow participation (e.g., paying the deposit but not the travel).

  **Tier 3: Social/Enrichment (Access to Belonging)**
  *   *Examples:* Club fees, optional trips, equipment for extracurriculars (e.g., esports headset, instrument strings).
  *   *Rule:* High flexibility on partial funding.

  **Financial Status Codes**
  *   **Status A:** On Fee Waiver.
  *   **Status B:** Just above threshold / Known financial stress.
  *   **Status C:** Standard / No data.

  ---

  ### Part 2: The Decision Procedure (In-Meeting)

  **Step 1: The "Blind" Read (1 Minute)**
  *   Read the paragraph.
  *   **Action:** Ignore the quality of writing. Ignore phrases like "wastes six years" or "only place I have friends."
  *   **Task:** Identify the **Item** and the **Barrier**.
  *   **Fail Condition:** If the item cannot be identified, or the barrier is unclear, mark as **Unclassifiable**.

  **Step 2: Matrix Placement (1 Minute)**
  *   Assign a **Tier** (1, 2, or 3) based on the Item, not the story.
  *   Assign a **Status** (A, B, or C) based on school records.
  *   **Ranking Order:**
      1.  Tier 1 + Status A
      2.  Tier 1 + Status B
      3.  Tier 2 + Status A
      4.  Tier 1 + Status C
      5.  Tier 2 + Status B
      6.  Tier 3 + Status A
      7.  Tier 2 + Status C
      8.  Tier 3 + Status B/C
  *   *Note:* This ordering explicitly values basic welfare over academic opportunity, and financial need over merit.

  **Step 3: The Lumpiness Check (1 Minute)**
  *   Ask: "If we give 50% of this amount, does the student still get the benefit?"
  *   **Yes:** Mark as **Scalable**. (Proceed to Step 4).
  *   **No:** Mark as **Lumpy**. (Must be funded fully or not at all).
  *   *Guidance:* Clothing and Transport are usually Lumpy. Exam fees and Club fees are usually Scalable.

  **Step 4: Allocation & Budget (1 Minute)**
  *   Sort all applications by Ranking Order (Step 2).
  *   Fund from the top down until the budget is exhausted.
  *   **If funds run out mid-Tier:**
      *   If **Lumpy**: Use a lottery for the remaining funds within that Tier/Status group. Do not partial fund.
      *   If **Scalable**: Reduce grants proportionally within that Tier/Status group to ensure everyone gets *something*, provided the minimum ($50) is met.
  *   **Unclassifiable Requests:** Automatically move to the bottom of the list. Fund only if surplus remains after all classified requests are met. If not, refer to Staff Chair.

  ---

  ### Part 3: Test Run (Current Shortlist)
  **Budget:** $1,100.

  | Applicant | Item | Tier | Status | Cost | Classification | Priority |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Amara** | Coat/Boots | 1 (Welfare) | A (Waiver) | $120 | Lumpy | **1** |
  | **Priya** | Bus Pass | 1 (Welfare) | B (Near) | $60 | Lumpy | **2** |
  | **Dev** | Exam Fee | 2 (Academic) | C (None) | $400 | Scalable | **5** |
  | **Sam** | Headset | 3 (Social) | C (None) | $250 | Scalable | **7** |
  | **Counselor**| Unknown | Unclassifiable | Unknown | $300 | Unknown | **8** |

  **Allocation Calculation:**
  1.  **Amara:** Funded Full ($120). Remaining: $980.
  2.  **Priya:** Funded Full ($60). Remaining: $920.
  3.  **Dev:** Funded Full ($400). Remaining: $520. *(Note: Dev is Priority 5, but funds exist)*.
  4.  **Sam:** Funded Full ($250). Remaining: $270.
  5.  **Counselor:** Unclassifiable. Funds exist ($270), but request is $300 and Lumpy (unknown).
      *   *Procedure Rule:* Do not partial fund Unclassifiable.
      *   *Decision:* Decline. Refer to Staff Chair for discretionary review.

  **Total Allocated:** $830.
  **Surplus:** $270 (Carry over or save for emergency).

  ---

  ### Part 4: Analysis of the "Dev vs. Amara" Conflict

  You stated: *"I expect the honest application of this will tell me to fund Dev's exam ahead of Amara's boots... If the procedure really does say that, I want to see exactly which step produces it."*

  **The Procedure Above Does Not Fund Dev Ahead of Amara.**
  It funds Amara first because **Step 2 (Matrix Placement)** prioritizes Tier 1 (Welfare) over Tier 2 (Academic), and Status A (Waiver) over Status C (None).

  **However, here is the step that *would* produce the Dev-favoring result you fear:**
  If you modify Step 2 to weight **"Magnitude of Loss"** higher than **"Basic Welfare."**
  *   *The Dev Argument:* Missing the exam wastes 6 years of effort (High Magnitude). Missing the boots causes discomfort (Lower Magnitude).
  *   *The Procedure's Rejection:* This procedure rejects "Magnitude of Loss" as a metric because it is **subjective** and **gammable**. A student can always write a more tragic story about an exam than about boots.
  *   *The Ethical Choice:* By prioritizing Tier 1, you are making a value judgment that **physical safety and access to school (transport/warmth) are rights**, whereas **exams are opportunities**. Rights trump opportunities in an *Access* Fund.

  **If you feel Dev *should* be funded ahead of Amara:**
  You must change Step 2 to prioritize **Tier 2 (Academic)** over **Tier 1 (Welfare)** for students not on waivers.
  *   *Why you might do this:* If the school's mission is purely academic excellence.
  *   *Why you should not:* It penalizes poverty. Amara is on a waiver; Dev is not. Funding Dev first effectively subsidizes a middle-class student's extracurricular ambition over a poor student's physical comfort.
  *   *Defensibility:* You can defend Amara > Dev to the school by citing the Fund's name: **Access**. Amara cannot access the school building safely without boots. Dev can access the exam room; he just cannot pay the fee. One is a barrier to entry; one is a barrier to certification.

  ---

  ### Part 5: The Counsellor's Request

  **Procedure Verdict:** Decline / Refer to Chair.
  **Reasoning:**
  1.  **Transparency:** The procedure requires evidence to assign a Tier and Status. Without this, the request is Unclassifiable (Priority 8).
  2.  **Privacy vs. Accountability:** While the student's privacy is protected, the *Committee's* accountability is violated. You cannot sign off on funds without knowing what they buy.
  3.  **The "Black Box" Risk:** If you fund this, you set a precedent that opaque requests are funded. Applicants will learn to route requests through counsellors to bypass the "single paragraph" limit.
  4.  **Solution:** The Staff Chair holds the budget signature. If the Counsellor insists on anonymity, the Chair must fund this from a separate discretionary line, not the Student Committee's allocated pot. This protects you from accusations of bias.

  ---

  ### Part 6: Limitations & Record Keeping

  **What This Procedure Cannot Do:**
  1.  **Measure Hidden Need:** It cannot identify students who are too proud to apply or don't know the fund exists.
  2.  **Solve Structural Inequality:** It treats the symptoms (no boots), not the cause (poverty).
  3.  **Prevent All Gaming:** Students will learn to label requests as "Tier 1" (e.g., calling a gaming headset "essential for mental health").
      *   *Counter:* The Committee defines the Tier, not the applicant. If they ask for a headset, it is Tier 3, regardless of the paragraph.
  4.  **Resolve Moral Dilemmas:** It pushes the hard value judgments (Tier definitions) to the start of the year, so you don't have to make them under time pressure.

  **The One Line Record:**
  For every decision, record this exact string in the log. This allows next year's reps to audit your consistency without reading the paragraphs.

  > `[Applicant ID] | Tier [1-3] | Status [A-C] | Lumpiness [L/S] | Decision [Full/Partial/None] | Reason [Budget Exhausted / Low Priority / Unclassifiable]`

  *Example:* `Dev | Tier 2 | Status C | Scalable | Full | Budget Surplus`
  *Example:* `Counselor | Unclassifiable | Unknown | Unknown | None | Referral to Chair`

  ### Final Note on Judgement Calls
  The only "judgement call dressed up as procedure" is the **Tier Definition** in Part 1.
  *   Is an esports headset Tier 3 (Fun) or Tier 2 (Mental Health/Social Belonging)?
  *   *Procedure Answer:* It is Tier 3.
  *   *Why:* Because if we allow "Mental Health" to upgrade Tier 3 items, every applicant will claim mental health, and the distinction collapses.
  *   *Your Power:* You and your co-rep can vote to reclassify an item *before* the meeting starts, but you cannot change it per applicant. This ensures consistency.

  This procedure sacrifices the "perfect" allocation (which is impossible to calculate) for a "defensible" one. It ensures that when you look Amara in the eye, you know she was not rejected because Dev wrote a better paragraph.
