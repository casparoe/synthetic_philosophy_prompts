  3.  **Evaluate the IP Regimes against the Framing:**

      *   **Patents:** Protects functional methods/processes. High overlap with "routes through a map." Requires disclosure (public map). Strongest tension with the "communal inferential pathway" view. If I patent a logical step, I'm privatizing a piece of the inferential network.
      *   **Copyright:** Protects expression, not ideas. Somewhat compatible with the framing (you can own the specific drawing of the map, not the route). But digital code and AI blur this.
      *   **Trade Secrets:** Protects by hiding. Antithetical to the "shared linguistic practices" view. If thinking is communal, hiding the tool breaks the cognitive loop.

