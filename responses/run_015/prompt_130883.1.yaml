      *   **Problem:** Frustrated with standard IP justifications (Locke, Utilitarianism, Personality) because they treat ideas as discrete objects.
      *   **Proposed Framing:** Ideas are stabilized through shared linguistic practices and external tools (inferential pathways, public maps). "Owning an idea" is like claiming private rights over a route through a public map.
      *   **Task:** Prioritize open questions/practical implications within IP regimes (Patents, Copyright, Trade Secrets) based on this framing.
      *   **Constraints:**
