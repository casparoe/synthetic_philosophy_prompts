      *   *Refining the Ranking:* Actually, Trade Secrets might be more interesting philosophically because it directly contradicts the "shared practice" requirement. But Patents have higher *policy impact*. Let's stick with Patents as #1 because of the "method" aspect. Trade Secrets is #2 because it creates "cognitive silos." Copyright is #3 because it's already somewhat aligned with the "expression vs. route" distinction.

  5.  **Drafting the Argument (Section by Section):**

