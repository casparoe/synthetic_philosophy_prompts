      *   *Refining the "Verdict":* The user asks if the question is *just* about complexity penalty out-of-sample. I should argue that it's *mostly* that, but the "feedback loop" (labeling affects behavior) breaks the assumption of exogenous breaks.

  6.  **Final Review against User Persona:**
      *   The user is sophisticated. Don't over-explain basic stats concepts. Focus on the mapping.
