      *   *Drafting Point 2 (Residual):* The "Middle Ages" segment has parameters close to the global mean or is defined by the *absence* of the loadings found in the "Classical" and "Modern" factors. It's a low-signal interregnum.
      *   *Drafting Point 3 (Misalignment):* We have a multivariate system. The changepoint detection algorithm finds $\tau_{art} \neq \tau_{science}$. The confidence intervals don't overlap. Furthermore, the functional form isn't a step function; it's a pulse or a wave (revival), which can be fitted at $t=800$ or $t=1400$ with similar loss.
