      *   **Follow-up Task:** A "residue report" evaluating the translation (what translates cleanly, what smuggles in extra assumptions, what is inexpressible).
      *   **Final Verdict:** Is the "real vs. invented" debate equivalent to "does the segmentation earn its complexity penalty out-of-sample," or does that change the subject?

  2.  **Deconstruct the Historiographical Debate into Quantitative Terms:**

