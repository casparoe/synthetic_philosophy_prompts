      *   *The Quantitative Analogy:* This is a model selection problem. Is the data generated by a process with structural breaks, or is the "break" an artifact of the modeler's choice of basis functions/segmentation?

      *   *Requirement 1: What does "real" mean?*
          *   In stats: A "real" changepoint implies a generative process shift. The data $Y_t$ comes from $f_1$ before $\tau$ and $f_2$ after $\tau$, where the shift is robust to noise and not overfitting.
          *   In history: A "real" period implies a coherent underlying social/cultural mechanism that persists for a duration and shifts distinctly.

      *   *Requirement 2: Middle Ages as Residual.*
          *   In stats: This is a "null segment" or a "gap" between two signal-rich regimes. It's defined by the absence of the features defining the neighbors (Antiquity, Modernity). It has high variance or low signal-to-noise regarding the specific features of interest.
          *   In history: "Middle" Ages = time between Rome and Renaissance. Defined by what it isn't.

      *   *Requirement 3: Multivariate Misalignment & Revivals.*
          *   In stats: Multivariate time series $X_{1:t}, ..., X_{k:t}$. Changepoints $\tau_1, ..., \tau_k$ do not coincide. Confidence intervals $[\tau_i \pm \epsilon]$ do not overlap. Also, "revival" means a parameter returns to a previous value (non-monotonicity), making segmentation ambiguous (is it a new regime or a return to an old one?).
