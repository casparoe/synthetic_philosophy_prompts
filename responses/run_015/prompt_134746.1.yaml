      *   *Requirement 4: Selection Bias.*
          *   In stats: Missing not at random (MNAR). Observation probability $P(O_t)$ is a function of latent variables or future selection (canon formation). The observed series $Y^{obs}_t$ is a biased subsample of $Y^{true}_t$.
