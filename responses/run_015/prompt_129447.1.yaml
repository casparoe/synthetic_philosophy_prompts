      *   *Part 2: The One-Shot Rule.* Compare to the standard. It shifts from *verification by replication* to *verification by complexity/improbability*. This is a shift from inductive confidence to abductive inference (Inference to the Best Explanation). Address the pulsar counter-argument (LGM-1).
      *   *Part 3: Scope & Boundaries.* Radio vs. Non-radio. Is there a principled line? Probably "intent" vs. "artifact."
