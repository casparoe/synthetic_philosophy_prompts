      *   **Decision 3: Accuracy Measure.**
          *   Need to show Quadratic (Brier) is not arbitrary without proving propriety.
          *   Strategy: Try Absolute Distance ($|v - c|$).
          *   Show Absolute Distance favours extremes. If $c(A)=0.6$, absolute distance expected utility (if we were maximizing) or just score minimization?
          *   Wait, the prompt asks to show absolute distance makes *certainty optimal whatever you believe*.
          *   Let's check: Score $S = |v - c|$. If true=1, score $1-c$. If true=0, score $c$.
          *   If I believe $p=0.6$, expected absolute score for reporting $c$: $0.6(1-c) + 0.4(c) = 0.6 - 0.6c + 0.4c = 0.6 - 0.2c$. To minimize this, maximize $c$. So report $c=1$.
          *   Yes, Absolute Distance incentivizes lying/extremism.
          *   Quadratic (Brier): $(v-c)^2$. Expected: $p(1-c)^2 + (1-p)c^2$. Derivative wrt $c$: $-2p(1-c) + 2(1-p)c = 0 \Rightarrow -p + pc + c - pc = 0 \Rightarrow c = p$. Truth-telling is optimal.
          *   Log Score question: Does domination survive? Yes, any *strictly proper* score yields a domination theorem (Joyce 1998, but later generalized). However, for *this* class, keep it simple. The domination result holds for any strictly proper scoring rule. I should tell them it survives but we stick to Brier for arithmetic simplicity.
          *   Entry point: After establishing gradational accuracy, before calculating the example.

      *   **Decision 4: Conviction Score.**
