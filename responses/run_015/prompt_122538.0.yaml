      *   **Decision 2: The Carrying Example.**
          *   Needs: Small, computable, plausible incoherence.
          *   Standard Joyce example: Two propositions $A, \neg A$. Incoherent credence $c(A) = 0.6, c(\neg A) = 0.6$ (sum > 1) or $0.3, 0.3$ (sum < 1).
          *   Plausibility: People often overconfident or underconfident. Let's use sum > 1 (overconfidence/inconsistency). $c(A)=0.7, c(\neg A)=0.7$. Sum = 1.4.
          *   Computation: Needs to be done at the board. Two worlds: $w_1$ (A true), $w_2$ (A false).
          *   Alternative: Three propositions? Too complex for 90 mins with calculation. Stick to partition $\{A, \neg A\}$.
          *   Selection: $c(A)=0.7, c(\neg A)=0.7$. Coherent rival $c^*(A)=0.5, c^*(\neg A)=0.5$ (or closer to 0.7 but normalized). Actually, to show domination clearly, comparing to the normalized version $c^*(A)=0.5, c^*(\neg A)=0.5$ is easiest, but technically the dominated theorem says *some* coherent function dominates. Usually, the closest coherent function is the projection. For simplicity in class, comparing $0.7/0.7$ to $0.5/0.5$ works for Brier score demonstration.
          *   Wait, is $0.5/0.5$ the dominator? If $c(A)=0.7, c(\neg A)=0.7$, Brier score at $w_1$ (A=1): $(1-0.7)^2 + (0-0.7)^2 = 0.09 + 0.49 = 0.58$. Coherent $0.5/0.5$: $(1-0.5)^2 + (0-0.5)^2 = 0.25 + 0.25 = 0.50$. $0.50 < 0.58$. At $w_2$ (A=0): $(0-0.7)^2 + (1-0.7)^2 = 0.49 + 0.09 = 0.58$. Coherent: $0.50$. Yes, $0.5/0.5$ dominates $0.7/0.7$.
