      *   *Wait, one more check on (6):* "Market-based advantages are permissible." If inheritance is considered a "market-based advantage" (transfer of private property), then (1) is forbidden. If inheritance is "state-protected monopoly" (legal framework of bequest), then (1) is allowed. This needs disambiguation.

