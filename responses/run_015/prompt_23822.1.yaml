prompt: |-
  I'm a retired experimental physicist -- condensed matter, mostly low-temperature stuff -- and somewhere along the way I built more feedback control loops than I care to count, just to keep cryostats and lock-in amplifiers behaving themselves. Since retiring I've finally had time to get properly into philosophy of mind, and I've gotten talked into computationalism: the view that cognition really is computation in some substantive sense, not just "everything can be described computationally if you squint hard enough." I already like the view, which is exactly why I want you to try to take it apart rather than defend it.

  So: what would actually count as evidence against computationalism, ranked from the stuff that would really sink it down to the stuff that's merely awkward? Here's where I keep getting stuck, so engage with these directly rather than staying general. First, theres Putnam's old result (and Searle's crack about his own wall implementing WordStar) that on a naive mapping account of implementation, more or less any physical system implements more or less any finite automaton -- which threatens to make "the brain computes X" true of rocks too, and hence empty. Does Chalmers' fix, requiring the mapping to respect the right counterfactuals rather than just the actual sequence of states, rescue a real claim here, or does it just push the problem back a step? Second, there's Maudlin's Klara/Olympia pair, where a machine that's just replaying a recorded sequence of states is supposed, on pain of denying supervenience on physical activity, to be exactly as conscious as the machine that "really" computed that sequence live -- if our gut says Olympia obviously isn't conscious, is that telling against computationalism, or just against a sloppy version of it? Third, van Gelder's point about the Watt governor, which hits close to home given how many control loops I've built myself, that some regulatory processes are better modeled as continuous dynamical systems than as computations over discrete representations at all -- is that a real rival, something that actually predicts something different, or just a dispute about vocabulary given that dynamical systems can themselves be simulated computationally?

  And the question underneath all of it: computationalism these days comes with so many riders -- doesn't have to be digital, doesn't have to be classical or symbolic, connectionist and predictive-processing versions all count too -- that I wonder if its been stretched until nothing could actually count against it anymore. Is that true, and if so, is it a real problem, or is "cognition is computation of some kind" allowed to be that unconstrained, the same way physics isn't hurt by "physical systems obey some dynamical law" being unfalsifiable? Be honest with me too about which of the three things above a computationalist whose work you respect would actually concede has some real force, versus which they'd wave off as attacking a version of the view nobody holds anymore. And for what it's worth, personally a clean empirical result would move me a lot more than another thought experiment, so if one of these actually cashes out that way, don't bury it at the bottom of the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired experimental physicist (condensed matter, low-temp). Experienced with feedback loops, cryostats, lock-in amplifiers. Technically literate, understands control theory, dynamics, and implementation issues. Skeptical but open-minded about computationalism.
      *   **Topic:** Philosophy of Mind, specifically Computationalism.
      *   **Task:** Critique computationalism (take it apart, don't defend it). Rank evidence/arguments against it from "sinks it" to "awkward."
      *   **Specific Points to Address:**
          1.  Putnam/Searle Triviality (rocks implement WordStar) & Chalmers' counterfactual fix.
          2.  Maudlin's Klara/Olympia (replay vs. compute) & Supervenience.
          3.  van Gelder's Watt Governor (dynamical systems vs. computation).
          4.  The "Unfalsifiability" worry (is computationalism stretched too thin?).
          5.  Preference: Clean empirical results > thought experiments.
          6.  Honesty: What would a respected computationalist concede vs. wave off?

  2.  **Deconstruct the Three Specific Arguments:**

      *   **1. Putnam/Searle Triviality & Chalmers' Fix:**
          *   *The Problem:* If implementation is just a mapping of physical states to logical states, anything with enough states implements anything (triviality).
          *   *Chalmers' Fix:* Implementation requires supporting counterfactuals (if input had been different, state would change appropriately). A rock doesn't support the right counterfactuals.
          *   *Critique:* Does this work? It restricts the class of implementers, but relies on the modal status of the physical system. Some argue counterfactuals are also observer-relative or require a specific causal structure that might still be too broad.
          *   *Physicist Angle:* Think about phase space and trajectories. A rock's trajectory is fixed by initial conditions. Does it have the *capacity* for other trajectories? Yes, physically, but does it *encode* the logic?
          *   *Verdict:* Chalmers' fix is standard but still vulnerable to "pancomputationalism" if causal structure is defined loosely. It's a conceptual threat, not empirical.

      *   **2. Maudlin's Klara/Olympia:**
          *   *The Problem:* Two systems produce identical state sequences. One computes (Klara), one replays (Olympia). If computation is causal, Olympia shouldn't count. If consciousness supervenes on physical activity alone, they should be the same.
          *   *Implication:* If computationalism says computation is essential for mind, and Olympia isn't computing (just replaying), but they are physically identical *during the run*, then either (a) computation isn't essential, or (b) consciousness doesn't supervene on the instantaneous physical state (needs history/disposition).
          *   *Physicist Angle:* Hysteresis, memory, path dependence. But Maudlin's point is about *dispositional* properties vs. *occurrent* properties.
          *   *Verdict:* This hits the "causal power" of computation. If the causal structure doesn't matter, why computation? If it does matter, how does it supervene? This is a strong conceptual blow to *causal* theories of computation.

      *   **3. van Gelder's Watt Governor (Dynamical Systems):**
          *   *The Problem:* The governor regulates speed via continuous feedback, not representation manipulation. It's a differential equation, not a Turing machine.
          *   *Computationalist Reply:* You can simulate the differential equation. Therefore it's computational.
          *   *Dynamicalist Reply:* Simulation $\neq$ Implementation. The explanation *as* a dynamical system is better (more parsimonious, captures the timing/coupling).
          *   *Physicist Angle:* The user knows control loops. A PID controller is analog. Digitizing it introduces sampling error, latency. Is the *mechanism* computational or dynamical?
          *   *Verdict:* This is the most empirical of the three. It challenges the *explanatory utility* and *ontological commitment* to discrete states. If cognition is fundamentally continuous and coupled, forcing it into "computation" might be a category error.

  3.  **Address the "Unfalsifiability" Worry:**
      *   Is "cognition is computation" like "physics obeys dynamical laws"?
      *   If "computation" includes analog, continuous, quantum, connectionist, predictive processing... does it mean anything?
      *   *Risk:* If everything is a computer, nothing is.
      *   *Defense:* Computation implies specific organizational constraints (information processing, functional decomposition).
      *   *Critique:* If the definition shifts to accommodate every counter-example (e.g., "it's analog computation"), it risks becoming a metaphor.
      *   *Empirical Cash Out:* We need a case where the computational model predicts $X$ and the dynamical/biological model predicts $Y$, and $Y$ happens.

  4.  **Ranking and Honesty (The "Respected Computationalist" View):**
      *   *Who to channel?* People like Piccinini, Shagrir, maybe Churchland (though she's neuro-phil), or critics like Hutto/Myin (Radical Enactivism).
      *   *Concessions:* A serious computationalist (e.g., Gualtiero Piccinini) admits the Triviality argument is solved by mechanistic accounts, but admits Maudlin is tricky (requires dispositional properties). They would likely fight hardest on van Gelder (claiming analog computation is still computation).
      *   *Empirical Priority:* The user wants empirical stuff. The Dynamical Systems argument is the closest to empirical. The others are metaphysical/conceptual.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, technical, direct. Acknowledge the physics background (control loops are key here).
      *   *Structure:*
          1.  Intro: Acknowledge the expertise and the specific request (critique, not defense).
          2.  Ranking the threats (Empirical > Conceptual).
          3.  Deep dive on the three specific arguments (Putnam, Maudlin, van Gelder).
          4.  The Unfalsifiability Question.
          5.  The "What would move the needle" section (Empirical predictions).
          6.  Conclusion: Summary of where the view is vulnerable.

      *   *Refining the Putnam/Chalmers section:* Chalmers' counterfactual requirement is the standard defense. But does it hold water for a physicist? A rock *has* counterfactual states (if I hit it harder, it moves differently), but do they map to the *logic* of WordStar? The mapping problem remains. *Verdict:* Conceptual nuisance, not a killer, because we can define "mechanism" restrictively (Piccinini's approach).
      *   *Refining the Maudlin section:* This is about causal relevance. If the wires are cut but the state is the same, is the mind the same? If yes, computation (causal) doesn't matter. If no, consciousness depends on dispositions, not just occurrent states. *Verdict:* Stronger than Putnam, attacks the link between syntax and causation.
      *   *Refining the van Gelder section:* This is the physicist's sweet spot. Analog control vs. Digital logic. If the brain operates like a Watt Governor (coupled differential equations) rather than a Von Neumann architecture, "computation" might be the wrong ontology. *Verdict:* Most empirical potential.
      *   *Refining Unfalsifiability:* Compare to "everything is physical." If computation is defined functionally, it's hard to falsify. If defined mechanistically (neural spiking as bits), it's falsifiable. The stretch is a real risk.

  6.  **Final Polish:**
      *   Ensure I answer the specific question: "What would count as evidence against... ranked."
      *   Make sure I don't defend computationalism, but analyze the *force* of the objections.
      *   Check the "honesty" constraint: What would a *good* computationalist admit? (They admit Triviality is solved by mechanistic constraints, admit Maudlin is a challenge for supervenience, fight van Gelder by expanding 'computation').
      *   Highlight the empirical angle for the physicist user.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Dynamical Systems is better." I need to explain *why* it counts as evidence against computationalism specifically. It counts if cognitive phenomena exhibit properties (e.g., specific scaling laws, phase transitions) that are natural in dynamics but unnatural or ad-hoc in computational models.
      *   *Example:* Haken's Synergetics or Kelso's coordination dynamics. If behavior follows order parameters that don't map to information processing steps, that's empirical evidence.

  7.  **Final Review against constraints:**
      *   Retired physicist persona acknowledged? Yes.
      *   Three specific arguments addressed? Yes.
      *   Ranked? Yes.
      *   Unfalsifiability addressed? Yes.
      *   Honesty about computationalist concessions? Yes.
      *   Empirical priority? Yes.

      *Let's write.*
answer: |-
  This is a refreshing brief. Usually, I'm asked to bolster the orthodoxy; being asked to stress-test it against a background of experimental rigor is much more useful. Given your background in control theory and low-temp physics, you know that the difference between a "model that works" and "the mechanism that exists" is the difference between a useful approximation and a truth claim. Computationalism often blurs this.

  Here is the breakdown of what counts as evidence against computationalism, ranked from "existential threat" to "terminological annoyance," followed by an assessment of the unfalsifiability worry.

  ### 1. The Existential Threat: Empirical Success of Non-Computational Dynamical Models
  **Rank:** #1 (The only thing that actually sinks it)
  **Type:** Empirical / Explanatory

  You asked for clean empirical results over thought experiments. This is the only category that provides them. The van Gelder/Watt Governor argument is often dismissed by computationalists as "semantic" (i.e., "you can simulate a differential equation on a Turing machine, so it's still computation"). **This is a dodge.**

  As a physicist, you know the difference between a system *being* a set of coupled differential equations and a system *simulating* them.
  *   **The Computational Claim:** Cognition involves the manipulation of discrete (or discretizable) representations according to rules.
  *   **The Dynamical Claim:** Cognition is the evolution of a system through a state space governed by continuous time, coupling, and attractors, without intermediate representations.

  **What would count as evidence:**
  We need a cognitive phenomenon where the *timing* and *continuous coupling* are essential to the function in a way that discrete computational steps cannot capture without ad-hoc assumptions.
  *   **Example:** Human motor coordination (Kelso's bimanual coordination). The phase transitions between in-phase and anti-phase finger movement follow order parameters typical of non-equilibrium phase transitions. A computational model has to *stipulate* a rule for switching; a dynamical model predicts the bifurcation naturally from the system's physics.
  *   **The Kill Shot:** If we find that neural processing relies on quantum coherence (Penrose/Hameroff is likely wrong, but the principle stands) or analog continuous-field dynamics where *sampling* destroys the function, computationalism fails. If the brain works like your cryostat's analog PID loop where the "error signal" is a continuous voltage and not a digitized value, and digitizing it introduces latency that breaks the stability, then calling it a "computer" is physically misleading.

  **Computationalist Concession:** A serious computationalist (e.g., Gualtiero Piccinini) would concede that if cognitive mechanisms are proven to be *non-mechanistic* in the information-processing sense (i.e., they don't transmit signals with a specific function), computationalism is false. However, they will fight hard to classify analog dynamics as "analog computation." **Your counter:** If "computation" includes any physical process describable by math, the term has lost its explanatory power (see point 4).

  ### 2. The Metaphysical Threat: Maudlin's Olympia Argument
  **Rank:** #2 (Deeply awkward, threatens the causal link)
  **Type:** Conceptual / Supervenience

  This is the strongest *philosophical* argument you listed. Maudlin constructs two systems: Klara (which computes live) and Olympia (which replays a recorded tape of Klara's states). They are physically identical *during the run*.
  *   **The Trap:** If consciousness supervenes on the physical state *at a time*, Olympia is conscious. But Olympia has no causal structure; it's just a tape. If computation requires causal structure (which it must, otherwise a lookup table is a mind), then Olympia isn't computing.
  *   **The Implication:** If Olympia is conscious, computation isn't necessary for mind. If Olympia isn't conscious, then consciousness supervenes on *dispositional* properties (what the system *would* do), not just occurrent physical properties.

  **Why this hurts:**
  It severs the link between "what is happening now" and "what the system is." For a physicist, this feels like saying a superconductor's state depends on what circuit it *would* complete if you closed a switch, even if the switch remains open.
  *   **Computationalist Defense:** They usually bite the bullet and say Olympia *is* conscious, or they argue that the physical substrate of Olympia doesn't actually support the counterfactuals, so it's not the same physical kind.
  *   **The Weakness:** It forces computationalism to rely on modal properties (counterfactuals) rather than actual physical activity. If the "computation" exists in the space of possibilities rather than the actual matter/energy flow, it starts to look Platonist, not physicalist.

  **Computationalist Concession:** Most working computationalists hate this argument but don't have a clean solution. They will concede it shows that "computation" is not just about state sequences but about *causal organization*. If you can show that the causal organization is absent in a system that behaves identically, you've shown that behavior (input/output) isn't enough.

  ### 3. The Conceptual Nuisance: Putnam/Triviality & Chalmers' Fix
  **Rank:** #3 (Solvable, but reveals the fragility of the definition)
  **Type:** Logical / Mapping

  Putnam's result (any open system implements any finite automaton) and Searle's wall are often treated as "solved" by the community, but your skepticism is warranted.
  *   **Chalmers' Fix:** Implementation requires supporting counterfactuals. A rock doesn't support the counterfactuals of WordStar (if I press 'a', the screen *would* change).
  *   **The Physicist's View:** This relies on a specific carving of the physical state space. If I map the rock's microstates finely enough, can't I find the counterfactuals?
  *   **The Real Fix (Mechanistic):** The modern defense isn't just Chalmers' counterfactuals; it's **Mechanistic Computation** (Piccinini, Shagrir). A system computes only if it has a functional organization where components are organized to manipulate vehicles (signals) based on their syntax. A rock lacks the functional organization.

  **Why this is lower rank:**
  It's a definition problem. If we define computation mechanistically (it has to be built to compute, like a lock-in amp is built to measure phase), then rocks don't compute. It doesn't threaten the theory that *brains* compute, unless you think brains aren't mechanistic.
  *   **Computationalist Concession:** They will admit that "naive mapping" computationalism is dead. Nobody holds that anymore. If you attack computationalism using Putnam's original triviality argument, they will agree with you and say, "That's why we use the mechanistic account now." It's attacking a straw man, but a straw man that lingers in pop science.

  ### 4. The "Unfalsifiability" Worry: Is it Stretched Too Thin?
  **Rank:** #0 (The Meta-Problem)
  **Type:** Methodological

  You asked: *Is "cognition is computation" allowed to be that unconstrained, the same way physics isn't hurt by "physical systems obey some dynamical law"?*

  **The Honest Answer:** Yes, it is a real problem, and it is worse than the dynamical law analogy.
  *   **Physics:** "Systems obey dynamical laws" is a framework, but specific laws (Newton vs. QM) make distinct predictions.
  *   **Computationalism:** If "computation" expands to include analog, continuous, quantum, connectionist, predictive processing, and dynamical systems (because they can be simulated), then "The brain computes" becomes "The brain processes information according to rules."
  *   **The Risk:** If every physical interaction counts as "information processing" (pancomputationalism), then the claim is vacuous. A falling rock "processes" gravitational information.

  **Where the line is drawn:**
  A respected computationalist (like Piccinini or Shagrir) would draw the line at **functional individuation**.
  *   **Claim:** A system computes only if its components are individuated by their functional role in manipulating representations.
  *   **Falsification:** If we discover that neural activity is *not* functionally individuated (e.g., if the specific chemical nature of the neurotransmitter matters more than the signal pattern, or if the geometry of the dendrite matters in a way that can't be abstracted to a function), then computationalism is false.
  *   **Example:** If ephaptic coupling (field effects between neurons) turns out to be the primary driver of cognition rather than synaptic spiking, and field effects cannot be decomposed into discrete functional units, computationalism is in trouble.

  ### Summary: What Would Move the Needle?

  If I were advising you on where to place your bets as a skeptic:

  1.  **Don't bet on Putnam/Triviality.** The mechanistic account blocks this. A cryostat controller computes because it was designed with functional components; a rock doesn't. The brain likely has functional components.
  2.  **Don't bet on Maudlin alone.** It's a powerful intuition pump, but it doesn't yield an experiment. It just forces computationalists to accept dispositional properties.
  3.  **Bet on the Dynamics (van Gelder).** This is your home turf.
      *   **The Experiment:** Look for cognitive tasks where **time is continuous and non-discretizable**. Computational models assume a clock cycle (even if asynchronous). Dynamical models do not.
      *   **Specific Prediction:** If human reaction times or neural phase-locking show scaling laws (1/f noise, criticality) that are intrinsic to the system's physics and *not* artifacts of algorithmic processing, the computational description is merely an approximation, not the ontology.
      *   **The "Clean Result":** Show that a control task performed by a human (or neural net) cannot be modeled by a Turing-equivalent system without an explosion of complexity, but is trivially modeled by a set of coupled differential equations. If the "computational cost" of simulating the brain diverges from the "physical cost" of the brain running, the identity claim fails.

  **The Verdict on "Unfalsifiability":**
  Computationalism is currently in a "degenerating research program" phase (Lakatos style). It keeps adding auxiliary hypotheses (it's analog! it's quantum! it's predictive!) to protect the core claim from dynamical and embodied critiques.
  *   **A respected computationalist would admit:** If cognition turns out to be fundamentally *non-representational* (e.g., Radical Enactivism is right, and we just couple with the environment without internal models), then computationalism is false.
  *   **The honest truth:** The definition *has* been stretched. "Computation" now often just means "causal process we can model mathematically." If that's the definition, it's unfalsifiable and trivial. If the definition is strict (discrete symbol manipulation), it's likely empirically false. The middle ground (analog computation) is where the battle is, and that is where your background in control loops gives you the leverage to see the category error.

  **Final advice:** Treat "The brain is a computer" as a hypothesis about **mechanism**, not a metaphor for **description**. If the mechanism is continuous field dynamics without discrete state transitions, the hypothesis is false, regardless of whether you can simulate it on a laptop.
