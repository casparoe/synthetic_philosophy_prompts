  I cheated by collapsing Regressional and Extremal Goodhart into the first two stanzas, treating noise and extrapolation as sequential rather than distinct failure modes. I also blurred the line between Causal Goodhart and the Lucas Critique in stanza five; technically, Lucas concerns policy changing structural parameters, while Goodhart often implies a static causal graph being gamed, but the poem treats them as the same philosophical itch. Finally, the drift of "good" does the most heavy lifting: I slide from normative value to utility function output without acknowledging that this equivocation is where the real fight lives. The arithmetic of overfitting is uncontested; the definition of what counts as a win is where the room stays divided.
