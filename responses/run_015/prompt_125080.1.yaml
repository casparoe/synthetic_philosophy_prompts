answer: |-
  Good evening. When we jury a show like this, we aren't just picking a winner. We are deciding what this town wants to live with. What we want on the wall when we bring our children to the library. What we want to catch our eye when we are tired, or proud, or grieving.

  This piece, *Last Shift*, does not let you look away. It demands something from you. Some of us found that demand easy to meet. Some of us found it difficult. That difference matters. It matters because taste isn't a reflex. It isn't just about what makes us cry. Tears are easy; anyone can be manipulated by light and memory. But attention? Attention is work. Real looking takes practice. It takes coming back to a thing when the first shock of recognition has faded.

  I looked at this work eleven times before casting my vote. Each time, it asked me a different question. Sometimes it asked about light. Sometimes it asked about labor. Sometimes it asked about who gets to decide what counts as art. I don't think any of us are finished answering those questions. And that is exactly why this piece belongs in the atrium. We are giving this prize not because the discussion is over, but because we want the discussion to continue. We are buying ourselves the opportunity to keep looking at this, to argue about it, to bring our parents to see a name stitched in red thread and explain what used to happen here.

  A verdict like this isn't a stone tablet. It's a promise to keep testing our own judgment against what's on the wall. You can be wrong about what you love. You can be corrected. That isn't a failure; it's how we get better at seeing. The people who weep in front of this and the people who stand back with their arms crossed are doing the same thing. They are trying to measure the distance between what they feel and what is actually there. Sometimes we feel deeply because the object is worthy of that feeling. Sometimes we feel deeply because we are being managed by skillful tricks. The only way to tell the difference is to keep looking, together, over time.

  To the donors and the council: this purchase isn't an acquisition of an object. It's an investment in the town's capacity to see itself. To Darlene: you have given us a mirror. You've stitched our history into something we can't ignore. Whether someone calls this a painting or a memorial misses the point. It is a place where we practice seeing each other. Some days we will see clearly. Some days we won't. But because this work stays here, we will have the chance to try again.

  The Council is honored to present the Alder Prize to *Last Shift*. Not because it is perfect, but because it is persistent. It demands we show up. And today, we are showing up for you.

  ***

  The load-bearing sentences are the ones that reframe the act of judgment from a final verdict to an ongoing practice. Specifically: *"A verdict like this isn't a stone tablet. It's a promise to keep testing our own judgment against what's on the wall."* This allows me to acknowledge my dissent without undermining the award, satisfying the jurors and the public simultaneously. Similarly, *"The people who weep in front of this and the people who stand back with their arms crossed are doing the same thing"* validates the emotional responders (Darlene's supporters) and the skeptics (myself) as engaged in the same rigorous work of looking, just at different stages of proficiency.

  To get this to stand, I had to give up the explicit distinction between "memorial" and "painting." In my head, that distinction resolves the conflict—if it's a memorial, my aesthetic training doesn't apply. But saying that aloud would diminish Darlene's work as art and alienate the council. I also had to suppress the specific admission of my own prejudice regarding my grandmother. Acknowledging that personal stake would have shifted the focus from the work's demand on *us* to my own internal conflict, which would have felt self-indulgent in a four-minute speech. The speech had to remain about the town's relationship to the object, not my relationship to my training.
