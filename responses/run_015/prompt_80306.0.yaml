answer: |-
  This is a precise and fertile tension to explore. You are effectively asking whether the *pedagogy of exemplarity* relies on a specific ontology of the self—one that Plutarch takes for granted and Thomas à Kempis explicitly targets for demolition.

  If we treat Plutarch's "mirror" as a theory of moral transmission, it operates on a logic of **accretion and calibration**. You remain the subject; the biography is an object. You scan the object for useful data (virtues) and warnings (vices), and you integrate them into your existing moral architecture. *The Imitation of Christ*, by contrast, operates on a logic of **dispossession and replacement**. The text is not an object you hold; it is a subject that holds you.

  Here is where Plutarch's theory holds, where it breaks under the weight of Kempis, and what the shift from "Parallel" to "Imitation" reveals about the mechanics of moral learning.

  ### 1. The Stable Self vs. The Obstructive Self
  Plutarch's mechanism assumes a sovereign, continuous self. When you read the life of Cimon, you are comparing his choices to *your* choices. The moral work happens in the gap between the two. This implies that the self is a capable vessel that merely needs better content or better steering. The "mirror" reflects your face so you can fix your hair; it does not suggest you should have no face.

  Kempis exposes the limit of this assumption. In *The Imitation*, the "self" is not the agent of learning; it is the primary obstacle to it. The text argues that moral failure isn't just making the wrong choice (Plutarch); it is the act of choosing from a center of self-will. Therefore, the Plutarchian mechanism of "compare and adopt" is structurally insufficient because it reinforces the very ego that needs to be dismantled.

  If Plutarch is teaching you to *drive* better, Kempis is teaching you to *let go of the wheel*. This suggests that "moral learning" via biography has a ceiling: it can refine character, but it cannot transform nature. Plutarch's theory breaks when the goal is not improvement of the agent, but the dissolution of the agent. Kempis shows that if the moral ideal is total alignment with a divine will, "learning" must become "indwelling." It is not that you learn from Christ; it is that Christ learns to act through you.

  ### 2. The Function of Pairing: Critical Distance vs. Total Absorption
  You asked what the pairing does in Plutarch that the singularity of Kempis does not. This is the crux of the pedagogical difference.

  **Plutarch's Pairing preserves critical agency.** By placing a Greek against a Roman, Plutarch forces the reader into the role of a judge. You must weigh Lycurgus against Numa. This implies that no single life is perfect and that virtue is contextual. The pairing creates a *critical distance* between the reader and the subject. You are not supposed to become Alexander; you are supposed to understand Alexander. This distance protects the reader from idolatry. It allows for "cherry-picking"—you can admire Caesar's clemency while rejecting his ambition. The moral learning is dialectical; it happens in the friction between two imperfect models.

  **Kempis's Singularity demands total surrender.** There is no "Parallel Life" to Christ. There is no counter-exemplar to weigh against Him. This collapses the critical distance. You cannot judge Christ; you can only be judged by Him. By removing the pairing, Kempis removes the reader's ability to negotiate. You cannot say, "I will imitate Christ's humility but skip his suffering." The model is indivisible.

  **What is lost?** The Plutarchian capacity for discernment. The reader of *Lives* develops *phronesis* (practical wisdom) by navigating contradictions. The reader of *Imitation* develops *obedience* by navigating resistance to the self.
  **What is gained?** Consistency. Plutarch's method risks creating a patchwork morality (brave like Achilles, prudent like Odysseus). Kempis's method aims for a unified ontology. By collapsing the comparison into identification, Kempis bypasses the cognitive load of judgment. You don't have to decide what is virtuous; you just have to submit to the Virtue.

  ### 3. Imitation as Learning vs. Imitation as Overwriting
  Is Kempis's approach "learning"? If learning implies the acquisition of knowledge or habits by a subject, then no. It is closer to **programming** or **possession**.

  In Plutarch, the text is external. You put the scroll down, and you go act. The memory of the life serves as a prompt for your own agency.
  In Kempis, the text is internal. The goal is for the "book" to cease being text and become pulse. The "mirror" is inverted, as you noted: it doesn't reflect you; it shines a light so bright it blinds your own reflection.

  This reveals a blind spot in Plutarch's theory of moral transmission. Plutarch assumes that *seeing* the good is sufficient to *doing* the good, provided you have the right examples. He assumes the will is free and capable. Kempis argues that the will is bound. Therefore, merely observing a good life (spectatorship) is useless if the engine of your action (the self-will) is corrupted.

  Kempis shows that for moral transmission to be total, the medium cannot remain a narrative *about* someone. It must become a script *for* someone. The "life" must stop being a history and start being a liturgy. When you read Plutarch, you are studying a map. When you read Kempis, you are practicing a walk.

  ### 4. The Limit of the Mirror
  The most significant insight *The Imitation of Christ* offers your paper is this: **The exemplar model only works as long as the reader remains the final authority.**

  Plutarch's mirror allows you to step back. You can say, "That worked for Caesar in Gaul, but it won't work for me in the Senate." The self validates the example.
  Kempis removes the self's veto power. The example validates the self (or invalidates it).

  This suggests there are two distinct modes of moral learning via biography:
  1.  **Ethical Calibration (Plutarch):** The self is the constant; virtues are variables to be adjusted. Mechanism: Comparison.
  2.  **Ontological Alignment (Kempis):** The Virtue is the constant; the self is the variable to be zeroed out. Mechanism: Identification.

  Plutarch's theory never has to face the question of whether the "mirror" itself is distorted by the viewer's pride. He assumes the viewer wants to see clearly. Kempis starts from the premise that the viewer *does not* want to see clearly, because seeing clearly requires the destruction of the viewer.

  ### Conclusion for your Argument
  If you are arguing about the concrete mechanism of moral learning, the juxtaposition of these two texts suggests that "learning from lives" is not a single phenomenon.

  Plutarch represents the **humanistic limit**: biography can refine the citizen, but it cannot save the soul. It relies on a stable self that chooses virtues.
  Kempis represents the **mystical limit**: biography (or hagiography) is only effective if it ceases to be biography and becomes a vehicle for presence. It relies on an unstable self that is replaced by Virtue.

  The "mirror" of Plutarch breaks when the reader's self-conception is the very thing that needs correcting. Kempis solves this by smashing the mirror and demanding the reader become the reflection. Your paper could argue that moral learning via narrative is always a negotiation between these two poles: how much of the self must be preserved to learn, and how much must be surrendered to change? Plutarch bets on preservation; Kempis bets on surrender.
