answer: |-
  We count no benefit larger than one hundred thousand human lives and no probability of success smaller than one percent unless supported by direct empirical precedent.

  **The Procedure: Epistemic Truncation Protocol**

  1.  **Truncate Impact:** If the proposal claims benefits exceeding 100,000 human-life equivalents (including digital or future lives), record the impact as 100,000. If the claim is infinite or unbounded, record as 100,000.
      *   *Answer:* A single number ≤ 100,000.
  2.  **Filter Probability:** If the claimed probability of success is below 1%, check for empirical precedent (e.g., has this specific intervention succeeded before?). If no precedent exists, record the probability as 0%. If precedent exists, record the claimed probability or 1%, whichever is higher.
      *   *Answer:* A percentage ≥ 1% or exactly 0%.
  3.  **Compute Score:** Multiply Truncated Impact by Adjusted Probability.
      *   *Answer:* A single expected-value number.
  4.  **Model Conflict Check:** Ask: "Is this proposal best under one credible model of the future (e.g., infinite timeline) and worst under another (e.g., finite timeline)?" If yes, stop. Mark as **Board Decision**.
      *   *Answer:* Yes/No.
  5.  **Intuition Veto:** Ask: "Does the arithmetic recommend funding, but does the committee feel a strong sense of Pascal's Mugging (unease that the math is hijacking judgment)?" If yes, stop. Mark as **Board Decision**.
      *   *Answer:* Yes/No.
  6.  **Rank:** Proposals not marked **Board Decision** are ranked by Score. Ties are broken by certainty (higher probability wins).

  **Device:** The **Epistemic Truncation Protocol** (Hard Impact Cap + Probability Floor).
  **Failure Prevented:** **Pascal's Mugging and Infinite Utility Dominance.** This prevents tiny probabilities multiplied by astronomical stakes from consuming the entire budget, and prevents undefined infinite stakes from overriding finite, certain good.

  **Application to Current Cycle**

  *   **Proposal A (10^30 lives, 1/10,000 chance):**
      *   *Truncate:* 10^30 becomes 100,000.
      *   *Filter:* 0.01% is below 1% with no empirical precedent for steering civilization trajectories. Probability becomes 0%.
      *   *Score:* 0.
      *   *Result:* **Reject.**
      *   *Committee Friction:* The committee may want to fund this because the raw expected value (without truncation) dwarfs all others, aligning with the "long run" charter. The procedure forces rejection, overriding the arithmetic temptation.

  *   **Proposal B (Infinite future, nonzero chance):**
      *   *Truncate:* Infinite becomes 100,000.
      *   *Filter:* Probability resists number; treated as below 1% with no precedent. Probability becomes 0%.
      *   *Model Conflict:* Yes. Best under infinite-ethics models, worst under finite-ethics models.
      *   *Result:* **Board Decision.**
      *   *Committee Friction:* The committee wants to avoid sending contentious items to a split board. The procedure forces this handoff because the proposal relies on a worldview the board has not settled.

  *   **Proposal C (Certain, few thousand people):**
      *   *Truncate:* 5,000 (under cap).
      *   *Filter:* Near-certain (99%).
      *   *Score:* 4,950.
      *   *Result:* **Rank 1.**
      *   *Committee Friction:* None. This is the only proposal with a calculable positive score.

  **Limits of the Procedure**

  1.  **Cannot Resolve Value Conflicts:** It identifies when a proposal depends on unresolved board values (like Proposal B) but cannot solve the split; it only forces the board to decide.
  2.  **Discards Option Value:** It treats speculative research (like Proposal A) as worthless if it lacks precedent, ignoring the value of learning or keeping options open for future cycles.
  3.  **Arbitrary Thresholds:** The 100,000-life cap and 1% floor are heuristic fences, not moral truths; a proposal with a 0.9% chance of saving 90,000 lives is treated as zero, which may be morally inconsistent.
  4.  **Blind to Black Swans:** It systematically excludes high-impact, low-probability events that lack historical precedent, potentially missing the very "long run" breakthroughs the charter seeks.
