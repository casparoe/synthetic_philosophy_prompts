answer: |-
  There is no single, canonical term in epistemology or medical education literature that captures this specific configuration. The phenomenon sits at the intersection of three established concepts: **Higher-Order Evidence (HOE)**, **Undercutting Defeaters**, and **Doxastic Involuntarism**.

  While the components are named, the specific *shape* you describe—where the phenomenology of certainty is itself the marker of unreliability, and where compliance is normatively required but psychologically blocked—lacks a unified label. In medical education, this is often loosely grouped under "cognitive bias" (specifically the *illusion of validity* or *overconfidence*), but that misses the epistemic structure. In philosophy, it is discussed under "rational akrasia" or "epistemic dilemmas," but those terms describe the *agent's state*, not the *structure of the evidence*.

  To provide the carving you need, I propose we coin the term **"Reflexive Metacognitive Defeater"** (RMD).

  Below is the definition, the carving of the phenomenon, and how it distinguishes itself from the nearby cases you described.

  ### 1. The Carving: What is a Reflexive Metacognitive Defeater?

  A **Reflexive Metacognitive Defeater** is a specific type of higher-order evidence with the following structural features:

  1.  **Target:** It does not attack the first-order evidence (the scan features) directly. It attacks the *reliability of the cognitive process* generating the belief.
  2.  **Symptomatic Marker:** The specific feature that signals unreliability is the *phenomenological feeling of certainty* itself. The error and the confidence are co-produced by the same mechanism (the "perceptual trap").
  3.  **Conditional Neutralization:** The undermining force is *conditional* on the presence of the marker. If the agent were not certain, the statistic (that "sure readers are wrong 50% of the time") would not apply to their current judgment.
  4.  **Involuntary Persistence:** The agent cannot voluntarily shed the marker (the feeling of certainty) merely by acknowledging the defeater. The metacognitive feeling is **cognitively impenetrable** to the propositional knowledge of its unreliability.

  **Why this carving matters:**
  Standard undercutting defeaters (e.g., "the lighting in the room is bad") allow the agent to adjust their confidence proportionally. In an RMD, the mechanism that *should* adjust confidence (the recognition of error) is part of the mechanism that is broken. The "gauge" is stuck on "High," even while you are reading the manual that says "This gauge is broken."

  ### 2. Distinction from Standard Defeaters and Akrasia

  You asked how this differs from a reason for doubt that merely outweighs evidence or the gap between judging and believing.

  *   **Vs. Standard Undercutting Defeaters:** A standard defeater (e.g., "this machine is known to malfunction") renders the evidence irrelevant. You can still feel uncertain. In an RMD, the defeater targets the *feeling of certainty*. It creates a conflict between your *metacognitive experience* (I feel sure) and your *epistemic norm* (I should not feel sure).
  *   **Vs. Epistemic Akrasia:** Akrasia is the state of believing $P$ while believing one ought not believe $P$. Your case *produces* akrasia, but the phenomenon itself is the *source* of the akrasia. The RMD is the structural trap; akrasia is the resulting psychological state.
  *   **Vs. The "Gap" (Judgment vs. Belief):** The ordinary gap is a failure of will or habit. In an RMD, the gap is **constitutive**. The resident cannot "decide" to be less certain because the certainty is a perceptual output, not a voluntary commitment. Telling her to "be less certain" is like telling a colorblind person to "see the red light."

  ### 3. Distinction from Your Two Nearby Cases

  You described two other scenarios. Under the proposed carving, these are **not** Reflexive Metacognitive Defeaters. They are structurally distinct and should not be grouped together.

  **Case 1: The Insensitive Underminer (Global Calibration Failure)**
  *   *Structure:* The agent learns their confidence is generally inflated. Retreating to "moderate" confidence is still unreliable.
  *   *Difference:* In an RMD, compliance (lowering confidence) *solves* the problem (the statistic no longer applies). In this case, compliance *fails to solve* the problem because the defect is global, not cue-specific.
  *   *Label:* **"Global Calibration Defeater."**
  *   *Exclusion:* Exclude from RMD because the undermining fact is not conditional on the specific phenomenological state of *high* certainty; it tracks the agent, not the state.

  **Case 2: The Self-Defeating Compliance (Performative Undermining)**
  *   *Structure:* Deferring to the guideline destroys the independence required for the guideline to be reliable.
  *   *Difference:* In an RMD, complying (lowering confidence) *neutralizes* the defeater. In this case, complying (deferring) *activates* the defeater.
  *   *Label:* **"Performative Underminer"** (or Self-Instantiating Defeater).
  *   *Exclusion:* Exclude from RMD because the logical relationship between compliance and reliability is inverted. In RMD, reliability is restored by compliance; here, reliability is destroyed by it.

  **Verdict on Grouping:** A reason for doubt that *disappears* when complied with (RMD) should **not** be grouped with one that *appears* when complied with (Performative). They demand opposite rational responses. The RMD invites a struggle for metacognitive correction; the Performative Underminer invites a paradox where the rational action undermines the grounds for that action.

  ### 4. Indirect Compliance: Habits and Environment

  You asked whether the category should include cases where one can only comply indirectly (changing habits/environment).

  **Yes.** In fact, for a Reflexive Metacognitive Defeater, indirect compliance is the **only** rational path.

  Because the certainty is cognitively impenetrable in the moment (Doxastic Involuntarism), direct compliance ("I will now feel less sure") is impossible. Rationality therefore shifts from the *moment of judgment* to the *design of the system*.
  *   **Direct Compliance:** Impossible (cannot turn off the feeling).
  *   **Indirect Compliance:** Mandatory. This involves **Epistemic Precommitment**.
      *   *Example:* The resident cannot "feel" less sure. But she can adopt a rule: "When I feel this specific type of certainty, I must mandate a second read," or "I must ignore my own impression and rely on the algorithm."

  If your definition of the phenomenon excludes indirect compliance, it renders the agent irrational for failing to do the impossible. The carving must acknowledge that the *locus of control* shifts from the internal doxastic state to the external procedural environment.

  ### 5. Summary Definition for Teaching

  If you need a term to use with residents that captures this without requiring a philosophy degree, I recommend **"The Certainty Trap"** but defined rigorously using the RMD structure.

  **Definition:** A **Reflexive Metacognitive Defeater** occurs when:
  1.  A specific cognitive cue triggers both a high risk of error *and* a high feeling of certainty.
  2.  The feeling of certainty is the *signal* of the risk, not a sign of safety.
  3.  The feeling cannot be voluntarily suppressed by knowing #1 and #2.
  4.  Rational compliance requires bypassing the feeling via procedural safeguards (second opinions, checklists) rather than attempting to internally adjust confidence.

  **Exclusions:**
  *   Exclude cases where the agent is simply generally overconfident (Global Calibration).
  *   Exclude cases where following the rule makes the rule fail (Performative Undermining).
  *   Exclude cases where the evidence simply contradicts the conclusion (Standard Rebutting Defeater).

  This carving preserves the unique tension of your case: the resident is not just wrong; she is trapped in a state where her *confidence* is the symptom of the error, and her only escape is to stop trusting her own mind and trust the system instead.
