  I'm presenting next Tuesday at a philosophy of law reading group, and I'm defending a hybrid view on punishment and moral responsibility that sits awkwardly between Dennett and Caruso. I usually hang out on rationalist forums arguing about decision theory, but I got dragged into this. The core claim is that Caruso's right that backward-looking moral desert is metaphysically dodgy, but Dennett's evolutionary story about free will as a social technology misses why punishment can feel fair rather than merely useful. My twist — I'm calling it 'calibrationist desert' — is that punishment functions like a feedback loop that updates an agent's predicitve model of their own behavour, which makes it institutionally fair without needing libertarian free will or a moral ledger. The audience is mostly legal theorists quietly committed to just deserts, plus two cognitive scientists convinced neuroscience has killed free will, and one visiting scholar who's actually published on Caruso's public-health model. They won't be hostile, but they'll spot the soft spots.

