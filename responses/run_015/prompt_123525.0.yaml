answer: |-
  The central tension in Daniel Dennett's account of real patterns lies in the transition from epistemic utility to ontological status. Dennett proposes that the reality of a pattern is a function of its predictive compressibility: if attributing beliefs and desires to an agent allows an observer to compress the data of that agent's behavior more efficiently than the physical or design stances, those beliefs and desires constitute a "real pattern." This move is designed to navigate the Scylla of eliminative materialism (which denies the reality of the mental) and the Charybdis of Cartesian dualism (which inflates the mental into a non-physical substance). However, for the doctoral seminar context, the critical question is whether the metric of predictive compression can bear the weight of ontological commitment. To answer this, we must weigh the stance-neutral reading against the stance-relative reading. I will argue that both readings ultimately fail to secure robust ontological commitment because predictive compression is an epistemic virtue that cannot, by itself, distinguish between mind-independent structures and mind-dependent heuristic projections. Consequently, while the intentional stance retains its methodological autonomy, Dennett's account does not license the ontological realism that the stance-neutral reading suggests, nor does the stance-relative reading offer a stable conception of reality that avoids instrumentalism.

  To understand the divergence, we must first delineate the two interpretations of how predictive success functions. The stance-neutral reading posits that predictive compression is a uniform, stance-invariant criterion for reality. On this view, the universe contains patterns at various levels of abstraction, and the "reality" of a pattern is determined solely by whether it permits noise-tolerant prediction. If the intentional stance yields genuine compression, the patterns it identifies (beliefs, desires) are real in the same sense that the patterns identified by physics (electrons, fields) or the design stance (gears, circuits) are real. This reading supports a non-eliminative mental realism: mental properties are not reducible to physical properties, nor are they illusory; they are higher-order real patterns that physicalism must accommodate as part of the furniture of the world.

  Conversely, the stance-relative reading argues that predictive success is always indexed to the explanatory goals, background assumptions, and pragmatic constraints of a specific stance. Here, "being a real pattern" is elliptical for "being a real pattern-for-a-given-stance." Under this interpretation, the intentional stance identifies patterns that are real relative to the goals of interpreting rational agents, but this reality does not carry cross-stance ontological weight. A belief is real-for-the-intentional-stance, but this does not imply it exists in the stance-independent sense required by traditional ontology. This reading preserves the autonomy of the intentional stance by insulating it from physicalist reduction, but it risks a problematic relativism where reality is fragmented into stance-specific silos.

  The divergence between these readings becomes sharp when we compare the predictive patterns involved in a thermostat under the design stance versus an agent under the intentional stance. Consider a thermostat. Under the design stance, we attribute to it the "belief" that the room is too cold and the "desire" to reach the set temperature. This attribution allows us to predict its switching behavior without calculating the thermodynamic motion of every bimetallic strip atom. The compression is significant: we bypass microphysical complexity for functional simplicity. Now consider a human agent. Under the intentional stance, we attribute complex beliefs and desires to predict their actions. This also yields massive predictive compression compared to the physical stance.

  On the stance-neutral reading, the ontological status of the thermostat's "belief" and the human's "belief" is identical. Both are real patterns because both facilitate compression. If we accept this, we face ontological inflation: we must grant reality to the functional states of simple machines in the same breath as the mental states of persons. While Dennett might accept this (arguing that the difference is one of complexity, not kind), it strains the intuitive and philosophical distinction between mere functional regulation and genuine mentality. More critically, it invites the causal exclusion problem. If the thermostat's "belief" is a real pattern, does it cause the switch to flip? If the human's "belief" is a real pattern, does it cause the arm to rise? If these patterns are real, they appear to compete with the physical causal chain. The stance-neutral reading forces us to either accept widespread causal overdetermination or redefine causation so thinly that it loses its explanatory bite.

  On the stance-relative reading, we avoid this inflation. The thermostat's "belief" is real only relative to the engineering context of the design stance; the human's "belief" is real only relative to the interpretive context of the intentional stance. There is no cross-stance comparison, so no competition with physics. However, this saves autonomy at the cost of ontological robustness. If reality is stance-indexed, then there is no fact of the matter about whether beliefs exist independently of our interpretive practices. This collapses into a form of instrumentalism: beliefs are not things that exist, but tools we use. For a seminar on ontological commitment, this is a pyrrhic victory. It preserves the utility of mental attribution but surrenders the claim that mental properties are part of the world's objective structure.

  The fundamental failure of both readings, however, lies deeper than the trade-off between inflation and relativism. Both readings assume that predictive compression is sufficient for ontological commitment. I argue that it is not. Predictive compression is an epistemic relation between an observer and a data set; it measures the efficiency of a description, not the structure of the described. To see why this is insufficient for ontology, consider that compression can be achieved by purely subjective projections. A conspiracy theorist may possess a highly compressed explanatory model of world events ("It is all the work of Group X") that predicts political outcomes better than a nuanced, data-heavy physicalist analysis of socio-economic factors. The conspiracy model offers high compression and noise tolerance (anomalous events are explained as "part of the plan"). Yet, we do not wish to say the conspiracy is a "real pattern" in the ontological sense.

  What distinguishes the conspiracy theorist's pattern from the physicist's pattern is not compression, but the source of the regularity. The physicist's pattern tracks mind-independent causal structures; the conspiracy theorist's pattern imposes a narrative structure onto noise. Dennett's account relies on the idea that the pattern must be "in the data," not just in the eye of the beholder. But accessing "the data" without a stance is impossible. To identify the data of an agent's behavior, we must already have individuated the agent, its boundaries, and its actions, which often requires the intentional stance itself. This circularity reveals that compression cannot serve as an objective arbiter of reality. It is always relative to how the data is carved up, and the carving is stance-dependent.

  Therefore, the stance-neutral reading fails because it treats an epistemic metric (compression) as an ontological ground, leading to the inability to distinguish between discovered structures and imposed heuristics (the conspiracy problem). The stance-relative reading avoids this error by acknowledging the indexicality of compression, but in doing so, it abandons the project of ontology altogether in favor of pragmatism. It tells us when we are licensed to *speak* of beliefs, but not whether beliefs *exist*.

  For the purposes of ontological commitment in scientific explanation, this means Dennett's account is incomplete. It successfully defends the autonomy of the intentional stance as a methodological necessity—we cannot do without it for complex systems—but it fails to bridge the gap to realism. The predictive patterns of the intentional stance are indispensable for explanation, but indispensability does not entail existence without a further causal criterion. Since Dennett explicitly rejects adding causal powers to mental patterns (to avoid dualism), he is left with a theory that explains why we use mental terms, but not what makes them true in a robust ontological sense.

  In conclusion, neither the stance-neutral nor the stance-relative reading can sustain the ontological commitment required for a robust mental realism. The stance-neutral reading is textually faithful to the "Real" in "Real Patterns" but collapses the distinction between epistemic utility and ontological status, risking inflation and causal exclusion. The stance-relative reading preserves the coherence of the stances but reduces reality to instrumental utility, failing to satisfy the ontological question. The correct conclusion is that predictive compression is necessary for identifying explanatory candidates but insufficient for ontological commitment. The intentional stance remains autonomous, not because it reveals a distinct layer of reality, but because it is the only stance capable of navigating the complexity of rational agents. Its patterns are "real" only in the sense that they are unavoidable for creatures like us, a pragmatic realism that dissolves the traditional ontology question rather than answering it. For a philosophy of science concerned with what exists, Dennett's account ultimately offers a theory of explanation, not a theory of being.
