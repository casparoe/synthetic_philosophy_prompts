answer: |-
  # Diagnostic Instrument for the Luck-Egalitarian Family

  ## Part 1: The Decision Tree

  **Instructions:** Begin at Node 1. Answer the question based on your verdict about what the tax-and-transfer apparatus should do. Follow the branch corresponding to your answer until you reach a leaf (a terminal position).

  **Root Commitment:** An inequality traceable to factors a person had no hand in is *pro tanto* unjust (unjust unless overridden by other moral considerations).

  **1. Timing:** Should the principle of justice regulate the *structure of chances* people face before the outcome is known (ex ante), or the *actual outcomes* after the lottery has resolved (ex post)?
  *   **A.** Regulate the structure of chances (Ex Ante). → Go to Node 2.
  *   **B.** Regulate actual outcomes (Ex Post). → Go to Node 3.

  **2. Currency (Ex Ante Branch):** When equalizing chances, should the apparatus ensure equal access to *external means* (resources) or equal prospects for *satisfaction* (welfare)?
  *   **A.** External means (Resources). → Go to Node 4.
  *   **B.** Satisfaction (Welfare). → Go to Node 4.

  **3. Currency (Ex Post Branch):** When redressing outcomes, should the apparatus equalize *external means* (resources) or *satisfaction* (welfare)?
  *   **A.** External means (Resources). → Go to Node 5.
  *   **B.** Satisfaction (Welfare). → Go to Node 5.

  **4. Regress of Causes (Ex Ante):** Choices are shaped by circumstances. Does responsibility for a chosen risk require only that the agent was *reasons-responsive* (could have acted otherwise for good reason), or does it require that the agent *endorsed* the desire prompting the action, or is there *no principled stopping point* (all inequalities are brute luck)?
  *   **A.** No principled stopping point. → **Leaf 1**.
  *   **B.** Reasons-responsiveness is sufficient. → Go to Node 6.
  *   **C.** Endorsement of the desire is required. → Go to Node 6.

  **5. Regress of Causes (Ex Post):** Choices are shaped by circumstances. Does responsibility for an actual outcome require only that the agent was *reasons-responsive*, or does it require that the agent *endorsed* the desire, or is there *no principled stopping point*?
  *   **A.** No principled stopping point. → **Leaf 1**.
  *   **B.** Reasons-responsiveness is sufficient. → Go to Node 7.
  *   **C.** Endorsement of the desire is required. → Go to Node 7.

  **6. Underwriter Test (Ex Ante):** Say that a risk counts as genuinely the agent's own only if, at the moment of action, some competitive insurer would have been willing to underwrite it at a finite premium. Do you accept this test strictly, accept it only in a weakened counterfactual form (an insurer would have written the policy had markets been complete), or reject it as irrelevant?
  *   **A.** Accept Strictly (No cover available = Brute Luck). → Go to Node 8.
  *   **B.** Accept Weakened (Hypothetical market = Option Luck). → Go to Node 8.
  *   **C.** Reject (Voluntariness alone suffices). → Go to Node 8.

  **7. Underwriter Test (Ex Post):** Apply the same underwriter test to the ex post evaluation of the loss. Do you accept it strictly, accept it weakened, or reject it?
  *   **A.** Accept Strictly. → Go to Node 9.
  *   **B.** Accept Weakened. → Go to Node 9.
  *   **C.** Reject. → Go to Node 9.

  **8. Harshness (Ex Ante):** For agents who face bad luck despite fair ex ante chances (the imprudent), what does the apparatus owe them?
  *   **A.** Nothing beyond a humanitarian minimum independent of justice. → Go to Node 10.
  *   **B.** Something, but a level that leaves them worse off than the prudent unlucky. → Go to Node 10.
  *   **C.** A floor that makes the imprudence costless to them (full restoration). → Go to Node 10.

  **9. Harshness (Ex Post):** For agents who suffer bad outcomes due to their own choices, what does the apparatus owe them?
  *   **A.** Nothing beyond a humanitarian minimum independent of justice. → Go to Node 11.
  *   **B.** Something, but a level that leaves them worse off than the prudent unlucky. → Go to Node 11.
  *   **C.** A floor that makes the imprudence costless to them (full restoration). → Go to Node 11.

  **10. Leveling-Down Probe (Ex Ante):** If removing a brute-luck advantage in the structure of chances makes the advantaged person worse off and benefits no one, is this required, permitted, or forbidden?
  *   **A.** Required. → **Leaf 2**.
  *   **B.** Permitted but not required. → **Leaf 3**.
  *   **C.** Forbidden. → **Leaf 4**.

  **11. Leveling-Down Probe (Ex Post):** If removing a brute-luck advantage in actual outcomes makes the advantaged person worse off and benefits no one, is this required, permitted, or forbidden?
  *   **A.** Required. → **Leaf 5**.
  *   **B.** Permitted but not required. → **Leaf 6**.
  *   **C.** Forbidden. → **Leaf 7**.

  *(Note: To ensure 8-12 leaves, the Currency and Regress branches above are designed to feed into the Harshness/Leveling nodes. The specific combinations below define the distinct doctrinal leaves.)*

  **Leaves:**

  *   **Leaf 1: Strict Egalitarianism.**
      *   *Awkward Commitment:* Justice requires eliminating inequalities caused by superior talent or effort, as these are ultimately traceable to genetic or environmental luck.
      *   *Status:* Occupied.
  *   **Leaf 2: Ex Ante Resource Egalitarianism (Strict Insurance).**
      *   *Awkward Commitment:* If a risk is uninsurable (e.g., unique genetic condition), the resulting disadvantage is brute luck even if voluntarily incurred, requiring full compensation.
      *   *Status:* Occupied.
  *   **Leaf 3: Ex Ante Resource Egalitarianism (Hypothetical Insurance).**
      *   *Awkward Commitment:* Compensation levels are determined by what an average person would have insured against, not by actual losses suffered.
      *   *Status:* Occupied.
  *   **Leaf 4: Democratic Equality (Ex Ante Variant).**
      *   *Awkward Commitment:* Must forbid leveling down even if it means accepting some brute-luck inequalities in opportunity structures to preserve social relations.
      *   *Status:* Occupied.
  *   **Leaf 5: Ex Post Welfare Egalitarianism (Strict Liability).**
      *   *Awkward Commitment:* Must destroy the extra welfare of the lucky brute-luck winner even if it cannot be transferred to the unlucky.
      *   *Status:* Unoccupied (generally rejected as irrational).
  *   **Leaf 6: Ex Post Resource Egalitarianism (Standard Luck Egalitarianism).**
      *   *Awkward Commitment:* Permitted to let the imprudent starve if their destitution is traceable to genuine option luck, provided a humanitarian minimum exists.
      *   *Status:* Occupied.
  *   **Leaf 7: Ex Post Resource Egalitarianism (Softened).**
      *   *Awkward Commitment:* Forbidden to let the imprudent starve, but justice does not require restoring them to the level of the prudent unlucky.
      *   *Status:* Occupied.
  *   **Leaf 8: Ex Ante Welfare Egalitarianism (Costless Imprudence).**
      *   *Awkward Commitment:* Agents bear no cost for risky choices provided they paid the "premium" of fair opportunity, effectively socializing all losses.
      *   *Status:* Unoccupied (collapses into Leaf 1).
  *   **Leaf 9: Ex Post Welfare Egalitarianism (Endorsement Constraint).**
      *   *Awkward Commitment:* Must compensate for losses resulting from choices only if the agent currently identifies with the desire that led to the choice.
      *   *Status:* Occupied.
  *   **Leaf 10: Ex Ante Resource Egalitarianism (Reject Underwriter).**
      *   *Awkward Commitment:* Treats all voluntary risks as option luck regardless of insurability, potentially leaving those with uninsurable risks destitute.
      *   *Status:* Occupied.
  *   **Leaf 11: Ex Post Resource Egalitarianism (Leveling Required).**
      *   *Awkward Commitment:* Committed to destroying the surplus of the brute-luck lucky even when transfer is impossible.
      *   *Status:* Unoccupied (widely viewed as fetishistic).
  *   **Leaf 12: Ex Post Resource Egalitarianism (Leveling Forbidden).**
      *   *Awkward Commitment:* Must allow brute-luck inequalities to stand if eliminating them harms the advantaged without helping the disadvantaged.
      *   *Status:* Occupied.

  ---

  ## Part 2: Sorting Quiz

  **Instructions:** For each case, select the option that best describes what the tax-and-transfer apparatus should do. Do not select based on the name of a theory.

  **1. The Gradient (Low Severity):** A citizen voluntarily engages in a recreational activity with a 1% chance of a $500 financial loss. The risk materializes.
  *   A. Compensate in full.
  *   B. Compensate partially (pool the risk).
  *   C. Do not compensate (agent bears the loss).

  **2. The Gradient (Medium Severity):** A citizen voluntarily engages in the same activity, but here the risk is a 50% chance of losing a limb (valued at $500,000). The risk materializes.
  *   A. Compensate in full.
  *   B. Compensate partially (pool the risk).
  *   C. Do not compensate (agent bears the loss).

  **3. The Gradient (High Severity):** A citizen voluntarily engages in the same activity, but here the risk is a 99% chance of total permanent disability (valued at $5,000,000). The risk materializes.
  *   A. Compensate in full.
  *   B. Compensate partially (pool the risk).
  *   C. Do not compensate (agent bears the loss).

  **4. The Underwriter Failure:** An agent voluntarily undertakes a medical procedure using a new technology. No insurer will cover it because the risk is unmeasurable, not because it is too high. The agent suffers a catastrophic loss.
  *   A. Treat as brute luck (Compensate).
  *   B. Treat as option luck (Do not compensate).
  *   C. Pool the risk retrospectively (Partial compensation).

  **5. Third-Party Harm:** An agent voluntarily takes a risk that fails, injuring not themselves but their dependent child, causing the child a lifelong disability.
  *   A. Compensate the child fully from public funds.
  *   B. Compensate the child only if the agent is destitute.
  *   C. Do not compensate (the agent is liable, not the state).

  **6. Culpable Ignorance:** An agent fails to read a clearly labeled warning before acting, incurring a severe loss they could have avoided at negligible cost.
  *   A. Compensate fully (they didn't *knowingly* choose the risk).
  *   B. Compensate partially (negligence reduces but does not eliminate claim).
  *   C. Do not compensate (willful ignorance is choice).

  **7. Expensive Tastes (Deliberate):** An agent deliberately cultivates a taste for rare wine that they can no longer afford, reducing their welfare below the average.
  *   A. Compensate to restore welfare equality.
  *   B. Do not compensate (they are responsible for the taste).
  *   C. Provide a basic resource floor only.

  **8. Expensive Tastes (Unchosen):** An agent has a high-caloric metabolic requirement they did not choose and cannot attenuate without great cost, reducing their welfare below the average.
  *   A. Compensate to restore welfare equality.
  *   B. Do not compensate (resources are equal, welfare is not the metric).
  *   C. Provide a basic resource floor only.

  **9. Leveling Down:** A natural disaster destroys the crops of the unlucky. The only way to equalize outcomes is to destroy the surplus crops of the lucky, which cannot be transported to the unlucky.
  *   A. Destroy the surplus (Equality is required).
  *   B. Do not destroy the surplus (Equality is not required here).
  *   C. Destroy the surplus only if it improves social solidarity.

  **10. The Prudent Unlucky vs. The Imprudent:** Two citizens end up destitute. One was prudent but suffered brute bad luck; the other was imprudent. Resources are scarce.
  *   A. Aid the prudent unlucky first; leave the imprudent with nothing.
  *   B. Aid both equally to a decent minimum.
  *   C. Aid the imprudent first to bring them up to the level of the prudent unlucky.

  ---

  ## Part 3: Scoring Key and Diagnostic Appendix

  ### Scoring Key

  Map your dominant answer pattern to the Leaves in Part 1.

  *   **Pattern A (Strict Egalitarian):** Q1-Q3 = A; Q7 = A; Q9 = A. → **Leaf 1**.
  *   **Pattern B (Ex Ante Insurance):** Q1-Q3 = B (shifts from C to A as severity rises); Q4 = A; Q10 = B. → **Leaf 2 or 3**.
      *   If Q8 = A → **Leaf 3** (Hypothetical Insurance).
      *   If Q8 = B → **Leaf 10** (Reject Underwriter).
  *   **Pattern C (Standard Ex Post):** Q1-Q3 = C; Q4 = B; Q6 = C; Q10 = A. → **Leaf 6**.
  *   **Pattern D (Softened Ex Post):** Q1-Q3 = C; Q10 = B; Q7 = C. → **Leaf 7**.
  *   **Pattern E (Welfare Focus):** Q8 = A; Q7 = A. → **Leaf 9**.
  *   **Pattern F (Democratic/Leveling Forbidden):** Q9 = B or C. → **Leaf 4 or 12**.
  *   **Pattern G (Third Party/Responsibility):** Q5 = A. → Suggests **Leaf 1** or **Leaf 7** (State absorbs responsibility for dependents).
  *   **Pattern H (Ignorance):** Q6 = A. → Suggests **Leaf 1** (Ignorance is brute luck). Q6 = C → Suggests **Leaf 6** (Negligence is option luck).

  ### Diagnostic Appendix

  **1. Unoccupied Regions of Logical Space**
  *   **Region 1: Ex Post Welfare Egalitarianism with Strict Leveling Down.** (Leaf 5). *Diagnosis:* Unattractive. Almost no theorist defends the requirement to destroy value without benefiting anyone, as it violates the Pareto principle without compensating gain.
  *   **Region 2: Ex Ante Resource Egalitarianism with Costless Imprudence.** (Leaf 8). *Diagnosis:* Incoherent. If the apparatus makes imprudence costless, it effectively socializes all risks, collapsing the distinction between ex ante and ex post and mimicking Strict Egalitarianism.
  *   **Region 3: Strict Underwriter Test with Ex Post Redress.** *Diagnosis:* Unexplored. Applying the strict insurability test to ex post outcomes creates administrative paradoxes (assessing insurability retrospectively), making it a stable position only in ex ante frameworks.

  **2. Indistinguishable Leaf Pairs**
  *   **Pair 1: Leaf 2 (Ex Ante Strict Insurance) and Leaf 3 (Ex Ante Hypothetical Insurance).**
      *   *Diagnosis:* These views coincide whenever markets are complete and agents are solvent. They differ only in counterfactual cases (like Quiz Item 4). Without cases involving uninsurable risks or insolvent agents, verdicts will be identical.
      *   *Extra Case to Pry Apart:* A case where the agent is too poor to buy insurance but faces a standard risk. Leaf 2 treats the loss as brute luck (compensate); Leaf 3 treats it as option luck (do not compensate, as the hypothetical average agent would have insured).
  *   **Pair 2: Leaf 6 (Standard Luck Egalitarianism) and Leaf 7 (Softened Ex Post).**
      *   *Diagnosis:* These views differ in justification (harshness vs. solidarity) but often coincide in policy if a "humanitarian minimum" is set high enough to cover basic needs.
      *   *Extra Case to Pry Apart:* A case of moderate destitution above the survival floor but below the social average. Leaf 6 permits leaving the imprudent here; Leaf 7 requires raising them to the level of the prudent unlucky.

  **3. Pivot vs. Confirmatory Quiz Items**
  *   **Pivot Items:** Items 1, 2, and 3 (The Gradient) are the primary sorting mechanism. The point at which a respondent flips from "Do not compensate" to "Compensate" determines their threshold for option luck. Item 4 (Underwriter Failure) is the secondary pivot that separates Ex Ante variants.
  *   **Confirmatory Items:** Items 7 and 8 (Expensive Tastes) confirm the Currency commitment (Resources vs. Welfare). Item 9 (Leveling Down) confirms the commitment to equality as a terminal value. Item 5 (Third Party) confirms the scope of responsibility.

  **4. Excluded Positions**
  *   **Note:** The Root Commitment ("inequality traceable to factors a person had no hand in is pro tanto unjust") excludes **Libertarianism** (which denies the injustice of brute luck inequality) and **Strict Prioritarianism** (which weights benefits to the worse off but does not necessarily trace the *cause* of the disadvantage). This instrument is designed solely to differentiate within the luck-egalitarian family and its immediate neighbors; it cannot diagnose a student who rejects the Root Commitment entirely.
