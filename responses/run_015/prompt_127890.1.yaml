  4. Three cap rules for markers, each of the form: if the answer does X, cap the total at Y marks.
  5. A JSON object with exactly these keys: "stem_summary" (a paraphrase of the question as set, at most 45 words), "thesis" (one sentence stating the claim the model answer defends), "must_hit_moves" (an array of three to five short strings), "blocked_stock_answers" (an array of three short strings), "mark_total" (an integer), "word_budget" (a short string), "hardest_move" (a string naming the move most answers will miss and why).

  Write everything in British English, with -ise endings, "behaviour", "analyse", and set all marks and quantities as digits.
