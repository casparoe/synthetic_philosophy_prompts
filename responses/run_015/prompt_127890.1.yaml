answer: |-
  1. **Exam Question**

  **Question 1** (25 marks)

  Hume's problem of induction concerns the regress involved in justifying any principle asserting that the unobserved will resemble the observed. The No-Free-Lunch (NFL) theorem states that all search algorithms perform identically when averaged uniformly over a class of objective functions closed under all permutations of the search space. Consider the following two technical notes regarding these results:

  **Lemma 1.** The averaging identity depends on permutation-closure, not on the size of the space. If the class of objectives is closed under a group of permutations of the domain that has two orbits — say it permutes freely within each of two blocks but never maps a point of one block into the other — then the identity can fail, and there are such classes on which one search algorithm beats another on the uniform average over the class.

  **Lemma 2.** Take a Boolean objective on a domain of $n$ points. Of the $2^n$ functions, at most a fraction $2^{-k}$ can be singled out by a description more than $k$ bits shorter than the trivial one. So a uniform distribution over the whole class is not a neutral or assumption-free standpoint: it is, with probability at least $1 - 2^{-k}$, a commitment to an objective that is incompressible and noise-like.

  (a) Briefly explain the significance of Lemma 1 and Lemma 2 for the interpretation of NFL results. (5 marks)

  (b) Critically assess the claim that NFL results merely formalise Hume's problem. In your answer, you must take a stand on whether the restriction on the space of possible problems that NFL shows to be necessary (via Lemma 1) is the same kind of commitment as the uniformity principle Hume worries about. Discuss what follows for epistemology if these commitments are distinct, making use of Lemma 2 to support your position. (20 marks)

  *Note: No citations or verbatim quotations are required. Argumentative clarity is prioritised over scholarly reference.*

  ***

  2. **Model Answer**

  Hume's scepticism targets the justification of inductive inference, specifically the principle that nature is uniform. The No-Free-Lunch (NFL) theorem is often cited as a mathematical vindication of this scepticism, suggesting that without assumptions, learning is impossible. However, a careful analysis of the provided lemmas reveals that NFL does not simply formalise Hume; rather, it relocates the epistemic burden from a general principle of uniformity to specific structural commitments, while simultaneously exposing the hidden biases in 'neutral' priors.

  Lemma 1 demonstrates that the NFL identity is not a universal law of logic but a consequence of specific symmetry conditions. The equivalence of algorithms holds only when the class of functions is closed under all permutations. If we restrict the class to one possessing orbits—structural blocks where permutations do not mix points—algorithms can be distinguished. One algorithm may outperform another on average within this restricted class. This implies that learning is possible not by assuming the future resembles the past in a general sense, but by assuming the search space possesses specific symmetries or structural constraints. The commitment required to escape NFL scepticism is therefore structural rather than purely inductive. It is a claim about the topology of the problem space, not merely a hope that patterns persist.

  Lemma 2 complicates the standard defence that we simply adopt a prior distribution to escape NFL. It shows that the uniform distribution, often treated as the 'ignorance' prior in NFL proofs, is substantively biased. In a space of Boolean functions, the vast majority are incompressible noise. To assume a uniform distribution is to assume, with high probability, that the objective function is random. Thus, there is no assumption-free standpoint. Choosing a prior that favours compressible functions (structure) is not a neutral logical move but a substantive empirical bet that the world is not noise-like.

  Consequently, the claim that NFL merely formalises Hume is imprecise. Hume worries about the justification for projecting observed regularities into the unobserved. NFL shows that without structural restrictions (Lemma 1), no projection is better than any other. However, the restriction required to enable learning is not identical to Hume's uniformity principle. Hume's principle is a generalisation of content (what we observe continues); the NFL restriction is a constraint on form (the space of possibilities has orbits). If these commitments are distinct, then solving the NFL problem does not solve Hume's problem. It merely pushes the regress back one step: we must now justify why the world respects the specific orbital structure required for our algorithm to succeed.

  Furthermore, Lemma 2 suggests that the 'neutral' baseline itself is loaded. If a student argues that we simply adopt a prior favouring structure, they must address why this prior is justified. If the justification is that it works, they face Hume's regress anew. If the justification is that the world is structured, they have made the substantive commitment Lemma 2 highlights. Therefore, NFL sharpens Hume's conclusion rather than vindicating it simply. It shows that even the mathematical framework used to analyse learning relies on biases that cannot be justified internally to the framework.

  In conclusion, NFL does not render induction impossible; it renders it conditional on structural assumptions (Lemma 1). However, because even the 'uniform' baseline is a bias towards noise (Lemma 2), the choice of structure is not a logical necessity but an empirical gamble. The commitment is not the same as Hume's uniformity principle; it is more specific and topological. What follows is that epistemology cannot rely on formal results alone to justify inference. We must acknowledge that our learning algorithms embed substantive claims about the world's compressibility and symmetry, claims that remain vulnerable to the same sceptical regress Hume identified. NFL provides the geometry of the trap, but Hume identifies the lock.

  ***

