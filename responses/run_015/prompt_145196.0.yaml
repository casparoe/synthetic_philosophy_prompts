answer: |-
  Use this three-step "Value Audit"—verify non-negotiables, check pre-registered wins over three quarters, and count complexity patches—to decide: migrate off the Python search monolith, freeze the ML platform, and retain billing under a compliance exemption.

  ### The Decision Procedure (90 Minutes)

  **Step 1: The Core Check (5 Minutes)**
  *   **Question:** Is there a legal, contractual, or safety requirement that prevents us from changing the fundamental output or interface of this system?
  *   **Sufficient Answer:** "Yes, [Specific Regulation/Contract] requires byte-for-byte consistency until [Date/Event]."
  *   **Verdict:** If **Yes**, assign **Compliance Lock**. The system is no longer judged on innovation, only on risk and cost. Skip to Step 4. If **No**, proceed to Step 2.
  *   **Who Decides:** Staff Engineer + Legal/PM representative. This is a values question, not technical.

  **Step 2: The Prediction Ledger (30 Minutes)**
  *   **Question:** For the last three quarters, did the team write down specific success metrics *before* work started, and did they hit them?
  *   **Sufficient Answer:** A link to the Quarterly Plan or RFC where the metric was defined prior to coding, signed off by a peer outside the immediate team (e.g., another Staff Eng or VP), plus the post-mortem data showing the hit.
  *   **Stop Condition:** If **zero** quarters have pre-registered wins, mark as **Degenerating**. If **two or more** quarters have pre-registered wins, mark as **Progressive**. One win is inconclusive.
  *   **Why Pre-registration:** This stops you from claiming success on noisy metrics after the fact. If you didn't write down that you expected a 2% latency gain, hitting a 2% gain is just noise accommodation.
  *   **Who Writes/Signs:** The feature owner writes the prediction in the Quarterly Plan; a peer outside the team signs it to prevent self-certification.

  **Step 3: The Belt Health Check (30 Minutes)**
  *   **Question:** In the last three quarters, did we remove more complexity (flags, shims, debt) than we added?
  *   **Sufficient Answer:** A count of feature flags/compat shims added vs. retired.
  *   **Stop Condition:** If you added more than 3 permanent flags/shims without retiring old ones, mark as **Degenerating**. This identifies "immunizing stratagems"—patching the belt to hide core rot rather than fixing the core.
  *   **Why:** In a noisy environment, you can't always run crucial experiments. Instead, watch the complexity cost. If keeping the system alive requires more duct tape every quarter, the core is dying.

  **Step 4: The Verdict (15 Minutes)**
  *   **Progressive + Healthy Belt:** **Keep Funding.**
  *   **Degenerating (1 Quarter):** **Warning.** Require a remediation plan.
  *   **Degenerating (2+ Quarters):** **Freeze.** No new features. Only maintenance or migration work allowed.
  *   **Degenerating (3+ Quarters) OR Progressive + Unhealthy Belt:** **Kill/Migrate.** Start the shutdown plan.
  *   **Compliance Lock:** **Keep.** Budget is determined by risk tolerance, not value creation. Review annually.

  ### What I Dropped From Lakatos (And Why)
  *   **"Positive/Negative Heuristic":** Too abstract. I replaced this with the **Prediction Ledger** (positive) and **Core Check** (negative). Engineers understand "plans" and "constraints" better than "heuristics."
  *   **"Crucial Experiment":** You correctly noted your metrics are too noisy for falsification. I replaced this with the **Belt Health Check**. If you can't prove progress via metrics, prove it via complexity reduction.
  *   **"Instant Rationality":** Lakatos argues you can't judge a program instantly. I baked this into the **Three Quarter Window**. One bad quarter is noise; three is a trend.
  *   **"Research Programme":** Renamed to **System**. "Programme" sounds like philosophy; "System" sounds like infrastructure.

  ### Running the Procedure on Your Systems

  **1. The Python 2 Search Monolith**
  *   **Core Check:** No legal requirement. Just legacy.
  *   **Prediction Ledger:** Hit one latency win recently. But what about the previous two quarters? If those were missed or unrecorded, the score is 1/3 (Inconclusive).
  *   **Belt Health:** 40 compat flags. Unless you retired 40 flags this quarter, you are adding complexity faster than removing it. This is a classic degenerating belt—using flags to protect the Py2 core instead of migrating.
  *   **Verdict:** **Kill/Migrate.**
  *   **Reasoning:** Even though you hit the latency win, the cost was maintaining 40 flags. That is an "immunizing stratagem." You are buying local performance at the cost of global maintainability. The system is degenerating.

  **2. The ML Feature Platform**
  *   **Core Check:** No legal requirement.
  *   **Prediction Ledger:** Ships constantly, but never called improvements in advance. Score is 0/3.
  *   **Belt Health:** Likely adding new model paths/features constantly.
  *   **Verdict:** **Freeze.**
  *   **Reasoning:** **This is the answer you won't like.** Your team feels productive because they ship constantly. But under this procedure, shipping without predicting is just "accommodating data." They are fitting the noise, not driving value. Freezing them forces them to stop shipping features and start writing RFCs with measurable goals before coding. It will feel like slowing down, but it stops the degeneration.

  **3. The Billing Service**
  *   **Core Check:** Yes. Must reproduce invoices byte-for-byte from 2016.
  *   **Verdict:** **Keep (Compliance Lock).**
  *   **Reasoning:** This is protected by fiat (law). It is not a research program; it is a regulated utility. Do not apply the Prediction Ledger here. You fund it based on risk, not innovation. If you try to make this "progressive," you will break the law.

  ### Where This Will Misfire
  1.  **Gaming the Ledger:** Teams will start writing trivial predictions they know they can hit to look "Progressive." You need the external signer (Staff Eng/VP) to reject sandbagged goals.
  2.  **Innovation Penalty:** True breakthroughs often miss initial predictions. If you enforce this too rigidly, teams will stop taking risks. Mitigation: Allow one "Exploration Quarter" per year where missing predictions doesn't count as degeneration, provided the learnings are documented.
  3.  **Morale Blindness:** A system can be "Progressive" on metrics but toxic to maintain. This procedure measures output, not team health. If your best engineers are quitting the "Progressive" system, ignore the procedure and fix the team.
  4.  **The "Compliance" Trap:** Don't let teams claim "Compliance Lock" to avoid scrutiny. Only Legal can sign off on Step 1. If Legal says it's not required, it goes through the Ledger check.

  This procedure moves you from "who argues hardest" to "show the ledger." It will cause friction, specifically with the ML team, but that friction is the point—it exposes where you are fooling yourselves about progress.
