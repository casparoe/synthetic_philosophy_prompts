prompt: |-
  hey — I'm a staff engineer at a mid-size company, no philosophy background at all. I got into this through a Hacker News thread about big rewrites were someone cited Lakatos, and now I'm stuck with the job of fixing how we make platform decisions.

  Every quarter there's an architecture review where my team has to decide, for each of our long-running internal systems, whether to keep funding it, freeze it, or kill it and migrate off. Right now it's vibes, sunk cost, and whoever argues hardest in the room.

  The bit of Lakatos I've absorbed (hard core, protective belt, positive vs negative heuristic, progressive vs degenerating problem shifts, and the thing where a patch that only mops up an anomaly you already had counts as degeneration instead of progress) feels like it maps onto this almost too well. But I only have the blog-post version, and I can't turn it into something four senior engineers will sit still for in a 90 minute meeting. They'll walk out if I say heuristic.

  So: give me a decision procedure we can actually run in that meeting. Ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands off to a human because the question is really about values not facts. It has to be usable by people who've never heard of Lakatos — say the concepts in engineer words, but don't water out the distinctions that are doing the actual work, and tell me which ones you dropped and why.

  Hard cases I specifically need it to handle:

  One, our protective belt is mostly config flags, compat shims and feature gates, so there's no such thing as a crucial experiment and our metrics are noisy (weekly A/B tests, effects in the 2-3% range, plus a north-star metric that drifts on its own for reasons nobody understands). How do we tell an honest belt adjustment from an immunizing stratagem under those conditions?

  Two, I want a pre-registration rule: a predicted win only counts as a novel fact if somebody wrote the prediction down before the data landed, otherwise it's accommodation after the fact. Tell me who has to write it down and where, because I'm fairly sure this becomes a rubber stamp if I let the team that owns the system self-certify.

  Three, sometimes the thing we're protecting isn't a technical claim at all, it's a business or compatibility commitment — like we must stay wire-compatible with the on-prem install base forever. That's protected by fiat, so nothing can ever falsify it. Does that need a fourth verdict besides keep / freeze / kill, and if so what is it and who signs off?

  Four, I keep reading that for Lakatos there's no instant rationality, that you can't fairly judge a programme at a single moment and degeneration only shows up in hindsight. If that's right, bake a time window into the procedure: how many quarters of degeneration before we pull the plug, and is there a case were the right answer is to keep funding something that's currently degenerating?

  Then run it on three of our actual situations: a nine-year-old Python 2 search monolith with about forty compat flags that recently predicted a latency win on a new index format and then hit it; an eighteen-month-old ML feature platform that ships constantly and whose team can always explain last quarter's improvements but never called them in advance; and our billing service, which has to reproduce invoices byte-for-byte from 2016 onward and will have to until the law changes. At least one of these should produce an answer I don't like — say so when it does.

  Finish by being straight about what the procedure can't do and where it'll misfire on us.

  Two formatting things: lead with the bottom line in your first sentence — the procedure in a nutshell plus the call on all three systems — and only then give the reasoning, no preamble and no restating my question. And please don't give me citations, links or a reading list; I'm not going to read the books, and I need this to stand on its own for people who definitely won't.
