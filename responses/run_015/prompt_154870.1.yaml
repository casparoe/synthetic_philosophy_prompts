  They built the mind within a hollow shell,
  The will is mine if I could change my lanes.

  If wires direct the choice before it stains,
  Do I reside within this vacant well?
  The will is mine because the source remains.

  The past is hidden, yet the guilt sustains,
  Unless the open door begins to tell,
  The will is mine if I could change my lanes.

  Though strings attach, if reason still constrains,
  Is freedom broken by the hidden spell?
  The will is mine because the source remains.

  But if the world determines all the pains,
  No alternative exists to quell,
  The will is mine if I could change my lanes.

  We speak across the divide where silence reigns,
  Neither argument can fully compel,
  The will is mine because the source remains,
  The will is mine if I could change my lanes.

  Summary: The poem enacts the philosophical stalemate where sourcehood and leeway advocates talk past one another by alternating their incompatible conditions without resolution.
