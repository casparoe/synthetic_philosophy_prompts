answer: |-
  ### Specification for the Definition of Death: Policy Criteria

  This document outlines the necessary conditions for any account of death to be codified in hospital policy, procurement law, and vital statistics. The goal is a definition that is legally actionable, biologically coherent, and ethically defensible.

  #### 1. The Requirements List

  **1.1. Legal Determinacy (The Timestamp)**
  *   **Requirement:** The account must identify a single, determinate moment in time at which the status of the body transitions from "alive" to "dead."
  *   **Justification:** Inheritance, criminal liability (homicide vs. desecration of corpse), marriage dissolution, and organ procurement authorization all require a binary switch. A process or a probability distribution cannot be entered into a legal registry.
  *   **Status:** **Non-negotiable.** (Law cannot function without a timestamp).

  **1.2. Organismal Focus (The Unit of Death)**
  *   **Requirement:** The account must define death as the cessation of the *organism* as a whole, distinct from the cessation of the *person* (psychological capacity) or the cessation of *cells* (histological viability).
  *   **Justification:** This addresses the "distinctions it can't collapse." A permanently unconscious patient (PVS) retains organismal function (breathing, digestion) and must remain legally alive to avoid euthanasia classifications. Conversely, cellular death occurs hours after organismal death; declaring death at the cellular level would make organ transplantation impossible.
  *   **Status:** **Non-negotiable.** (Required to maintain the distinction between losing the organism vs. losing the person).

  **1.3. Modal Precision (Permanent vs. Irreversible)**
  *   **Requirement:** The account must explicitly define "cessation of function" as *permanent* (will not restart spontaneously or via intervention) rather than *irreversible* (cannot restart under any physical possibility).
  *   **Justification:** This handles the "revival technology in prospect" and "deep hypothermic arrest" cases. If death requires true physical irreversibility, no one can be declared dead today (due to theoretical future tech). If death requires only permanence, a patient in hypothermic arrest is not dead because we *will* rewarm them, but a patient in warm circulatory arrest is dead because we *will not* resuscitate.
  *   **Status:** **Non-negotiable.** (Required to make the definition compatible with current medical practice and future-proofing).

  **1.4. Diagnostic Separation (Definition vs. Test)**
  *   **Requirement:** The account must distinguish the *ontological definition* of death from the *clinical criteria* used to diagnose it and the *bedside tests* used to verify it.
  *   **Justification:** This addresses the "distinctions it can't collapse." Tests (e.g., apnea test, pulse check) are fallible proxies. The definition must hold true even if the test fails or is unavailable. This prevents the definition from becoming obsolete when technology improves.
  *   **Status:** **Non-negotiable.** (Required for epistemic clarity and policy stability).

  **1.5. Biological Coherence (Somatic Integration)**
  *   **Requirement:** The account cannot contradict established physiology regarding somatic integration. If a body demonstrates homeostasis, wound healing, or gestation, the account must explain why this is not evidence of organismal life, or concede organismal life is present.
  *   **Justification:** This addresses the "bits of biology it can't contradict." A body with total brain failure kept on a ventilator can regulate temperature, excrete waste, and gestate a fetus. Calling this "dead" contradicts the biological definition of an organism unless the brain is defined as the sole integrator.
  *   **Status:** **Preference (Biological Camp).** (Legally, we often override this for organ procurement, but biologically, this is a point of friction).

  **1.6. Dead Donor Compliance (Non-Causation)**
  *   **Requirement:** The declaration of death must not be the result of the procurement process, nor can the procurement process cause the transition defined in 1.1.
  *   **Justification:** This preserves the Dead Donor Rule (DDR). Organs may be removed only after the patient is dead. The definition cannot be moved to facilitate procurement (e.g., declaring death *because* we need organs).
  *   **Status:** **Non-negotiable.** (Ethical and legal firewall).

  **1.7. Case Consistency (The Edge-Case Constraint)**
  *   **Requirement:** The account must yield the socially and medically accepted verdict for the following specific scenarios:
      *   *Hypothermia:* Not dead until rewarmed and unresponsive.
      *   *PVS:* Alive (organismally).
      *   *Anencephaly:* Alive (until cardio-respiratory failure).
      *   *Brain Death:* Dead (despite somatic integration).
      *   *DCD (Circulatory):* Dead (after 5 minutes of no pulse).
  *   **Justification:** Policy must match clinical intuition and existing legal precedent to be actionable.
  *   **Status:** **Non-negotiable.** (Required for adoption).

  ---

  #### 2. Analysis of Tensions and Unsatisfiable Subsets

  **The "Death Triangle" Tension**
  There is a jointly unsatisfiable subset of three requirements:
  1.  **Legal Determinacy** (Single Moment)
  2.  **Biological Coherence** (Death is a biological process)
  3.  **Case Consistency** (Specifically: Brain Death = Dead)

  *   **The Conflict:** Biology is a cascade (heart stops $\rightarrow$ ischemia $\rightarrow$ brain death $\rightarrow$ cellular death). There is no single biological nanosecond where "life" vanishes. However, **Legal Determinacy** demands a single moment. To satisfy this, policy treats **Brain Death** as that moment. However, **Biological Coherence** notes that a brain-dead body on a ventilator maintains somatic integration (homeostasis, gestation).
  *   **Which One Gives:** **Biological Coherence** gives. In current policy, the "single moment" of brain death is accepted legally even though the biology of the organism continues. We prioritize the Legal Determinacy and the specific verdict on Brain Death over strict biological consistency regarding somatic integration.

  **The Single Moment Tension**
  *   **Is demanding a single determinate moment in tension with biology?**
      *   **Yes.** Biology is gradual; law is binary. Cells die at different rates; organs fail at different rates. There is no "spark" that leaves the body.
      *   **Resolution:** The requirement for **Modal Precision (Permanent vs. Irreversible)** resolves this. By defining death as the point where function *will not* be restored (a clinical decision point) rather than when it *cannot* be restored (a biological fact), we create an artificial but actionable "moment." The moment is not when biology ends, but when the *decision to treat* ends.

  **The "Killer" Requirement**
  *   **Which single requirement rules out the biggest share of popular accounts?**
      *   **Requirement:** **Organismal Focus (1.2).**
      *   **Reasoning:** This requirement immediately disqualifies the **Higher-Brain** account. The Higher-Brain view defines death as the loss of personhood/consciousness. Under **Organismal Focus**, a patient in a Permanent Vegetative State (PVS) is biologically alive (breathing, digesting, sleeping). Since policy must distinguish "losing the organism" from "losing the person," the Higher-Brain account is ruled out of legal consideration, despite its philosophical popularity.
      *   **Secondary Impact:** It also puts significant pressure on the **Whole-Brain** account, as it forces Whole-Brain advocates to argue that the brain is the *sole* integrator of the organism, a claim contradicted by the "brain-dead body carrying a pregnancy" case.

  ---

  #### 3. Scorecard of Popular Accounts

  | Account | Legal Determinacy (Single Moment) | Organismal Focus (PVS = Alive) | Biological Coherence (Somatic Integration) | Modal Precision (Perm vs. Irrev) | Case Consistency (Hypothermia/Brain Death) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Whole-Brain** | **Pass** (Clear neurological line) | **Pass** (PVS has brainstem) | **Fail** (Brain-dead bodies integrate/gestate) | **Pass** (Cessation of function) | **Pass** (Matches current law) | **Current Standard** (Biologically strained) |
  | **Higher-Brain** | **Fail** (Consciousness is graded) | **Fail** (PVS = Dead) | **N/A** (Focuses on person, not organism) | **Pass** | **Fail** (Conflicts with PVS law) | **Rejected** (Violates Organismal Focus) |
  | **Circulatory** | **Pass** (Pulse stop) | **Pass** (PVS has pulse) | **Pass** (Body fails when circulation stops) | **Strained** (ECMO/Hypothermia challenge irreversibility) | **Fail** (Hypothermia case requires exception) | **Viable** (Requires "Warm & Dead" clause) |

  **Summary Recommendation:**
  To meet the spec, the policy must adopt a **Whole-Brain/Circulatory Hybrid** model but explicitly codify **Modal Precision**. You must state in the policy that "Irreversible" means "Permanent cessation of function given current medical capabilities and the decision not to resuscitate." This satisfies the **Single Moment** requirement by making it a clinical judgment rather than a biological absolute, preserves the **Dead Donor Rule** by ensuring death precedes cutting, and navigates the **Hypothermia** case by deferring declaration until rewarming. You must accept the biological inconsistency of the **Brain-Dead Pregnant Body** as a legal fiction necessary for organ procurement.
