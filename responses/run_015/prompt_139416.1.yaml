answer: |-
  To evaluate the smallpox campaign through the Importance-Tractability-Neglectedness (ITN) framework, we must fix the decision point at 1967, when the Intensified Smallpox Eradication Programme launched. The relevant actors were the WHO secretariat, member states (notably the United States and Soviet Union, whose geopolitical rivalry paradoxically secured funding), endemic national governments, and field surveillance workers. The options on the table were: continuing universal mass vaccination (the pre-1967 default); shifting to surveillance-and-containment (the innovation); settling for control rather than eradication in difficult regions like the Horn of Africa; or letting the programme coast. The payoffs were binary: permanent eradication versus indefinite endemicity. Genuine uncertainties at the time included whether an animal reservoir existed, whether subclinical cases would defeat surveillance, and whether civil wars would prevent access to the last pockets.

  Scoring explicitly on the three factors using order-of-magnitude estimates: Importance is maximal (10/10), given two million annual deaths and permanent benefit. Neglectedness is high (8/10); the burden lay entirely in poor nations unable to pay, while wealthy nations had eliminated the disease domestically and lacked incentive to fund foreign eradication. Tractability is moderate-high (7/10); biologically favourable (no non-human reservoir, visible cases, heat-stable vaccine), but logistically ferocious. Multiplying these yields a very high priority score, ostensibly vindicating the investment.

  However, your suspicion that the framework misdescribes the case is well-founded. The standard ITN model assumes marginal expected good per pound is roughly additive and smooth. Eradication is a threshold good: nearly all value resides at the finish line, precisely where the cost per case averted explodes. Read literally, a marginal analysis at the endgame should have recommended diverting funds to other causes, letting the final endemic pockets smoulder. This is not merely your speculation; it is a recognised critique of cost-effectiveness analysis when applied to public goods with non-linear returns. The framework lacks a vocabulary for 'completion value'. If you treat the last million pounds as buying only a few hundred cases averted, the efficiency metric collapses, even if the total value of those cases is infinite due to eradication.

  Furthermore, tractability here was endogenous rather than given. The surveillance-and-containment strategy and the bifurcated needle were invented or refined *because* the eradication goal existed. A static framework assessing 1959 tractability would have scored lower than one assessing 1967. Neglectedness also relies on a contested counterfactual: would other funders have stepped in if WHO withdrew? Historical consensus suggests no, but this is unverifiable. Additionally, the campaign created permanent downstream liabilities: maintained stockpiles and vaccination readiness incur costs indefinitely, a negative payoff the framework rarely subtracts. Finally, drivers entirely outside the ITN slots were decisive: single-minded champions like Donald Henderson, superpower prestige, and the surveillance infrastructure left behind. These are not marginal utilities but fixed inputs that enabled the threshold to be crossed.

  Does smallpox vindicate or embarrass the framework? It embarrasses the literal multiplication model. A strict application would have flagged the diminishing marginal returns of the late 1970s as a signal to stop. The campaign succeeded despite the framework's implicit recommendation, driven by the threshold nature of the good and non-quantifiable political will. However, it vindicates the framework's intent if modified. The high scores on Importance and Neglectedness correctly identified the opportunity, even if the multiplication mechanic failed to capture the threshold dynamics.

  To repair the problem, you must add a 'lumpiness' or 'completion' term. This would adjust the value upwards as a project approaches a definitive endpoint, counteracting the exploding marginal cost. Is this principled or ad hoc? It is principled if viewed as option value: eradication purchases a permanent option against reintroduction, whereas control purchases only temporary relief. The standard critique of ITN is that it ignores flow-through effects and infrastructure; your speculation adds the specific mechanism of threshold non-linearity. Both are valid, but yours is more precise for eradication cases.

  In summary, the historical record is settled on the biological tractability and the eventual success. It is contested whether the marginal funding at the end was truly the best use of resources compared to alternative health interventions, though the permanent benefit weighs heavily. I am extrapolating beyond the record in asserting what a strict ITN calculation would have recommended in real-time, as no such formal calculation was documented then. However, the logical implication holds: without a threshold adjustment, the framework favours control over eradication. To maintain utility for your committee, retain the three factors but apply a multiplier for projects offering permanent resolution of a problem, acknowledging that the 'Neglectedness' factor must distinguish between 'currently unfunded' and 'counterfactually unfundable'. Without this distinction, you risk funding causes others would have addressed anyway, or abandoning causes precisely when they require the most capital to cross the finish line.
