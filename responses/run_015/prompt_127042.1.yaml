      *   **Rejecting (5):** Claims modern bureaucracies *don't* share structural properties. Cost: Empirically dubious. Supply chains *do* have division of labor and opacity. Hard to defend without special pleading.
      *   **Rejecting (6):** This is the inference step. The move from "shared structural properties" to "analogous culpability." This is the weakest link logically. It assumes structural similarity *entails* moral equivalence.
      *   **Rejecting (7):** Accepts that modern bureaucrats *are* culpable. Cost: Radical moral revisionism. Might be defensible (e.g., climate change, sweatshops), but likely too controversial for the specific paper goal.
