answer: |-
  §2 is fair only if you assume eternalism. If you are a presentist, the truthmaker literally does not exist yet, so it cannot ground truth now. Your argument assumes the battle's occurring is a timeless fact. If the gap view is paired with presentism, §2 misses its mark. However, if you accept existing future events (§1 implies the battle might happen), §2 holds: the fact obtains timelessly, making B eternally true. You need to clarify your ontology of time. Without presentism, the truthmaker objection stands.

  The regress in §4 is real if H ("B hardens at noon") is contingent. If H is itself a future contingent, it needs a hardening time. You avoid this only if H is a necessary structural fact. But then you owe an account of why structural facts govern contingents without determining them. If the structure is fixed, why isn't the outcome? You risk making the schedule a determinate cause of the outcome. If the schedule is necessary, you have introduced determinism about the *process* of settling, which may be just as metaphysically costly as determinism about the outcome.

  Scheduled Settling risks collapsing into a variant of Ockhamism. In branching time semantics, there is already an operator for "settled true" (true on all histories passing through this moment). Your "hardening" is essentially "becoming settled". Your "Scheduled Settling" claims the *moment of settlement* is itself settled, even if the *value* is not. This is coherent but adds little to standard branching time logic unless you claim the schedule is unique across branches. If the schedule varies by branch, it isn't settled now. If it's fixed across branches, you've posited a rigid structure over the branches. This isn't standard Ockhamism (which relativizes truth), but it isn't standard gap theory either. It's a hybrid: fixed structure, open content.

  §3 is weak because it conflates semantic bivalence with metaphysical determinism. Ockhamists deny bivalence *simpliciter* (at a moment) while keeping it *relative to histories*. They don't need a Thin Red Line (actual history) to make sense of truth; they just deny there is a truth value at the moment of utterance. The gap theorist's motivation is usually that the future *does not exist*, not just that we can't label it. §3 assumes the branching structure solves the metaphysical problem, but many gap theorists think branching implies too much reality in the future. You are attacking a semantic solution to an ontological problem.

  Is this new? It closely resembles the "settledness" operator in branching time logic, but with a twist. Standard views distinguish between "true at a moment/history" and "settled true at a moment". Your innovation is treating the "time of settling" as a distinct settled fact. This is distinct from standard Open Future views where even the time of resolution can be contingent. You are proposing deterministic settling-times for indeterministic outcomes.

  "Causal preconditions complete" (§6) is hand-waving unless carefully defined. In indeterministic causation, causes rarely fix the *time* of an effect without influencing the *probability* of the outcome. If the causal chain fixes the noon deadline but not the battle, you need a model where timing is deterministic but outcome is not. This is rare. If the trigger time is probabilistic, the schedule isn't settled. If the trigger time is fixed, why isn't the outcome? You need to separate the *opportunity* for causation from the *efficacy*.

  Verdict: The central idea isn't broken, but it relies on a specific metaphysics of time you haven't specified. §2 needs that fix. The regress is avoidable but costly. Scheduled Settling is coherent but risks being an unnecessary complication over standard "settledness" operators unless you can motivate why settling-times are fixed. The causal story needs rigorous defense to avoid collapsing into determinism.
