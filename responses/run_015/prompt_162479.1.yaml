  **Headline Credence: 0.28**

  **Decomposition**

  1.  **0.95** — *That some restriction blocks the canonical derivation:* Excluding $p \land \neg Kp$ from the domain of the schema is trivially achievable by almost any non-trivial restriction.
  2.  **0.55** — *That it blocks strengthened diagonal variants, conditional on blocking the canonical one:* Semantic invariance resists simple diagonalization, but higher-order epistemic operators or dynamic updates may reinstate the paradox.
  3.  **0.60** — *That a semantic invariance condition can be stated without circularity or emptiness:* Two-dimensional semantics can model this, but defining the "non-epistemic base" without epistemic leakage remains metaphysically contentious.
  4.  **0.50** — *That the result counts as principled rather than ad hoc:* Invariance has independent motivation in stability theories of truth, but its selection here is heavily driven by the desire to evade Fitch's result.
  5.  **0.45** — *That the restricted thesis is strong enough to deliver the anti-realist conclusion:* The knowability thesis itself contains $K$, risking exclusion from the invariant class and rendering anti-realism self-defeating.
  6.  **0.28** — *That the three conditions are jointly satisfiable at all:* This is the conjunction of the above, adjusted for positive dependence between principledness and strength.

  **Combination Logic**
  The headline (Term 6) is not a strict product of Terms 1–5 because the conditions are not independent; specifically, if a restriction is genuinely principled (Term 4), it is more likely to be formulated robustly enough to handle diagonalization (Term 2) and support the anti-realist conclusion (Term 5). However, the low probability of Term 5 acts as a bottleneck: even if the logic holds (Terms 1–3) and the restriction is principled (Term 4), failure to accommodate the thesis itself (Term 5) collapses the project. The headline reflects the probability that all bottlenecks are cleared simultaneously.

  **Sensitivity Analysis**
  The headline number is most sensitive to **Term 5** (That the restricted thesis is strong enough to deliver the anti-realist conclusion).

  What would move this term is **an argument that the question has no determinate answer because principled and strong enough are themselves contested**. The boundary of "anti-realist conclusion" is fluid: if anti-realism requires only that *non-epistemic* truths are knowable, Term 5 rises; if it requires the knowability thesis itself to be knowable, Term 5 falls. Without a settled metric for "success" in anti-realism, the probability is unstable.

  If this is the case, my headline number becomes **0.15**, reflecting the increased uncertainty variance rather than a shift in mean expectation.

  **Calibration and Disagreement**
  The divergence between your 0.2 and your supervisor's 0.65 is most likely separated by **Term 5** (Strength) and **Term 4** (Principled).

  You likely assign a low probability to Term 5 because you see the self-application problem (the thesis contains $K$, so it falls outside $C$) as fatal to the anti-realist project. Your supervisor likely assigns a high probability to Term 4 and 5 because they view the invariance restriction as a natural metaphysical constraint on truth (making it principled) and assume the anti-realist thesis can be reformulated as a meta-linguistic claim that does not need to fall within $C$ to be asserted. The disagreement is not about the logic of the paradox (Term 1 and 2), but about whether the resulting fragment of truth is substantial enough to carry the philosophical weight of anti-realism.
