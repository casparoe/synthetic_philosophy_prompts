  # Diagnostic Taxonomy of the Special Composition Question

  **Root Node:** Is there a fact of the matter whether arbitrarily scattered parts—say, a pebble on Earth and one on Alpha Centauri—ever compose a single object?

  *   **NO** → **Leaf 1: Unnamed (Ontic Indeterminacy)**
      *   *Awkward Commitment:* There is no true answer to whether ordinary objects like chairs exist, even in clear cases.
  *   **YES** → **Node 2:** In the actual world, do the pebble and the star *actually* compose an object?
      *   **NO** → **Node 3:** Does the world contain facts about "arrangements" over and above the existence of the simples themselves?
          *   **NO** → **Leaf 2: Eliminative Nihilism**
              *   *Awkward Commitment:* There are no tables, only simples arranged tablewise, and all talk of tables is strictly false.
          *   **YES** → **Leaf 3: Arrangement-only Nihilism**
              *   *Awkward Commitment:* Composite objects do not exist, but "arrangements" are real entities distinct from the particles arranged.
      *   **YES** → **Node 4 (Diagnostic 4):** Does composition occur *always* (for any parts), or *only* when parts meet specific conditions?
          *   **ALWAYS** → **Node 5 (Diagnostic 1):** Can a material object survive the complete, gradual replacement of all its parts?
              *   **YES** → **Leaf 4: Unrestricted Universalism**
                  *   *Awkward Commitment:* There exists an object composed of your nose and the Moon, right now.
              *   **NO** → **Leaf 5: Universalism with Composition-as-Identity**
                  *   *Awkward Commitment:* The whole is literally identical to the parts, meaning one thing is numerically many things.
          *   **ONLY WHEN** → **Node 6 (Diagnostic 2):** Is a hollow sphere (or block of Swiss cheese) one object with missing parts?
              *   **NO** → **Leaf 6: Contact-based Restrictionism**
                  *   *Awkward Commitment:* Two atoms touching compose an object, but two atoms one micron apart do not, despite identical causal relations.
              *   **YES** → **Node 7 (Diagnostic 3):** Can the same composite exist on Tuesday, fail to exist Wednesday when its parts are scattered, and exist again Thursday?
                  *   **NO** → **Leaf 7: Life-based (Organicist) Restrictionism**
                      *   *Awkward Commitment:* A corpse is not an object, but a living cat is, despite being made of the same type of matter.
                  *   **YES** → **Leaf 8: Causal-integration Restrictionism**
                      *   *Awkward Commitment:* A randomly scattered heap of sand does not compose an object, even if the grains are touching.

