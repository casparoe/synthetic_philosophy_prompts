  ### Diagnostic Notes & Gap Analysis

  **Flagged Indistinguishability:**
  *   **Leaf 2 (Eliminative Nihilism) & Leaf 3 (Arrangement-only Nihilism):** These positions are difficult to separate via concrete case judgments alone. Both deny the existence of composite objects in response to Node 2. The split at Node 3 relies on a theoretical ontological claim about "arrangements" rather than a direct intuition about objects, making them empirically equivalent in most diagnostic scenarios.

  **Unoccupied Branch Combinations:**
  *   **Contact-based Restrictionism + Intermittent Existence:** This combination is unoccupied (Contact branches off at Node 6 before reaching Node 7). It is **coherent but unattractive**: it would imply an object ceases to exist if parts separate by a micron, but pops back into existence if they touch again later. While logically possible, it is rarely defended because it treats spatial continuity as essential for existence but temporal continuity as irrelevant.
  *   **Life-based Restrictionism + Gappy Denial:** This combination is unoccupied (Life branches off at Node 7, having already answered "Yes" to Gappy at Node 6). It is **incoherent**: Organicist views typically rely on functional unity which tolerates internal gaps (e.g., digestive tracts, cellular space). Denying gappy objects while affirming life-based composition contradicts the biological reality of organisms.
  *   **Universalism + Restriction Condition:** This combination is logically excluded by Node 4. It is **incoherent** by definition: one cannot hold that composition is unrestricted while simultaneously holding that it is restricted to specific conditions.
