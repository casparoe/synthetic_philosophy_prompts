answer: |-
  **The Case**

  Elena was duty-bound to manually verify both the ventilator circuit integrity and the infusion pump rate at 13:55. At 13:56, a code blue call from the adjacent bay forced her to leave immediately to perform CPR, making verification impossible. Unknown to her, the ventilator tube was occluded (leading to hypoxic arrest) and the pump was programmed at ten times the dose (leading to toxic arrest). Both physiological cascades independently reached irreversible cardiac arrest at precisely 14:00. Neither mechanism interfered with the other, no alarms sounded due to a separate fuse failure, and no other staff were available to intervene.

  ***

  **1. The Verdicts**

  *   **Per-duty but-for:** This view treats "failure to check ventilator" and "failure to check pump" as distinct events. If she had checked the ventilator, the patient still dies from the pump; if she had checked the pump, the patient still dies from the ventilator. Since neither specific omission changes the outcome, **neither omission is a cause.**
  *   **Per-agent but-for:** This view aggregates the failures into "Elena's failure to complete her rounds." If she had completed her rounds (both checks), the patient lives. Since the outcome changes if the agent performs her full role, **the omission is a cause.**
  *   **Role-based:** This view looks at normative expectation and outcome matching. She had a duty to prevent harm via these routes, and harm occurred via these routes. The overdetermination is irrelevant to the breach of duty. **The omission is a cause.**

  **2. The Production View ("It's Blame")**

  This view claims we only call omissions "causes" when we want to assign blame; since there is no physical push, there is no causation. Here, the zero-blame clause (the code blue emergency) removes the motive for blaming Elena. If the production view were correct, everyone should agree there is no causation here because there is no blame to assign. However, the per-agent and role-based views still identify a causal link based on structure, not blame. The zero-blame clause damages the production view by decoupling the causal judgment from the blame judgment: if causation were just blame in a lab coat, removing the blame should remove the causation across all valid theories, but it only removes it for the blame-driven theory, not the structural ones.

  **3. The Single Feature Doing the Work**

  The critical feature is **simultaneous sufficiency (overdetermination)**.
  *   **Split across two nurses:** The logical problem remains identical (neither nurse is a but-for cause), but it loses the "carving" tension within a single agent. It becomes a standard overdetermination case rather than a test of how we individuate duties.
  *   **One route 70% lethal:** This introduces probability. But-for becomes "might have lived," which muddies the binary verdict you need to show the contradiction.
  *   **Sequential death (Preemption):** If the ventilator kills at 13:59 and the pump at 14:00, the pump failure is no longer a cause (the patient is already dead). But-for works perfectly on the ventilator failure. The case collapses, and your friend wins: causation becomes stable again.

  **4. But-For Attacks and Replies**

  *   **Attack:** "You're individuating effects too finely. Death by hypoxia isn't the same event as death by toxicity."
      *   **Reply:** The event is "the patient's death." Splitting the effect into micro-events is an ad hoc maneuver to save the theory from overdetermination. If we accept that, no overdetermination case ever exists.
  *   **Attack:** "You're carving duties too finely. Her duty was 'ensure patient safety,' not two separate checks."
      *   **Reply:** Duties must be actionable to be meaningful. "Ensure safety" is too vague to guide behavior. Protocols specify distinct checks for distinct risks; ignoring that structure makes the duty useless.
  *   **Attack:** "Counterfactuals aren't 'would have,' they're 'might have.' She might have fixed one but missed the other."
      *   **Reply:** Standard counterfactual analysis assumes minimal change to the actual world. The minimal change to "Elena does her duty" is that she performs the specific checks required and fixes the errors found. Speculating she would fail again is not a minimal change.
  *   **Attack:** "Use a NESS test (Necessary Element of a Sufficient Set) instead of but-for."
      *   **Reply:** That concedes the point. Admitting you need a test *other* than but-for acknowledges that simple but-for causation fails on omissions in overdetermination cases, which is exactly the argument you are making.

  **5. Conflict Check**

  The spec that is hardest to satisfy is **"same moment" in an "ordinary hospital."** Biological processes rarely converge on irreversible arrest at the exact same timestamp. If you drop "same moment" to make it medically realistic, you inevitably create a sequence (preemption). If you create a sequence, but-for testing works again (the first killer is the cause), and your demonstration of but-for's failure collapses. You must keep "same moment" to maintain the overdetermination, even if it requires accepting a medically rare coincidence. You lose medical commonness to gain philosophical leverage.
