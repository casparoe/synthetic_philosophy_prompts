          *   *Falsifiability:* UDT is hard to falsify because it's normative. But "Parfit's Hitchhiker" or "Counterfactual Mugging" are the test cases. If one thinks paying the mugger is *wrong*, UDT is wrong.
          *   *Verdict:* The "trenchcoat" accusation is partially true but misses the point about *when* the precommitment happens (logically prior vs. temporally prior).

