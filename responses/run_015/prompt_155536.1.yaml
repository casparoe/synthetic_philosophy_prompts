      *   **Address the "Insulation/Falsifiability" Worry:** Discuss whether it's a feature or bug. Compare to EU maximization.
      *   **Address the "EDT/CDT Trenchcoat" Claim:** Distinguish UDT from precommitment (logical vs. causal) and EDT (policy vs. action).
