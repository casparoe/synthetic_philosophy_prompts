      *Crucial Point on Worry 3:* The user asks "what picks out the relevant counterfactual prior self?" This is the "Prior Problem." If I can choose *any* prior, I can rig the decision. If I'm stuck with my *actual* prior, I might be biased. This is a deep philosophical issue about the normativity of priors. I need to highlight this.

      *Crucial Point on Worry 4:* The "Insulation" worry. Is it unfalsifiable? Normative theories are hard to falsify empirically. But they can be falsified by *incoherence* or *dominance arguments*. If UDT recommends a dominated strategy in a well-defined game, it's dead. (Troll Bridge is the closest example).

      *Let's structure the ranking:*
      1.  **The Logical Counterfactual Void (Fatal/Severe):** Without this, UDT is undefined.
