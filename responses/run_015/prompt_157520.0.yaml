          2.  Löb's Theorem states: If the system proves "If $P$ is provable, then $P$ is true" ($\square P \to P$), then the system proves $P$ ($\vdash P$).
          3.  The "Obstacle": If an agent tries to trust itself completely (assert $\square P \to P$ for all $P$), it can derive any $P$ (inconsistency/triviality).
