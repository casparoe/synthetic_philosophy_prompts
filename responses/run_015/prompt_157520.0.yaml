      *   *Truth ($P$)* $\rightarrow$ *Diegetic Reality* (What actually happens in the story world).
      *   *The Trust Condition ($\square P \to P$)* $\rightarrow$ *The Pact of Reliability* (If the narrator says it happened, it happened).
