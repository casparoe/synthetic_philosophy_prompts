  4. Although immigration offers a lower cost-per-capita increase, Section 12 requires domestically produced persons to ensure the population stock remains sovereign property, prioritizing national scale over fiscal efficiency in long-term residence-time calculations. Imported stocks do not contribute to the endogenous growth rate required by the continuity clause. Permanent residents may not be counted toward the quota until the second generation to ensure full assimilation.

  5. Since the non-identity problem precludes claiming benefits accrue to the unborn, all welfare gains derived from additional citizens shall be attributed to the existing population's utility function, formally designating the new cohort as instrumental goods for the comfort of predecessors. This resolves the person-affecting restriction by acknowledging the state as the sole beneficiary of existence, meaning no apology is required for sacrifices imposed on the new cohort as no alternative existence was possible.
