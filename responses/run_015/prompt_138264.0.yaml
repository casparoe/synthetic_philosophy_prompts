      *   *Causal Field:* Hart and Honoré's distinction is crucial here. Historians distinguish between *causes* and *conditions*. The "cause" is the abnormal or agential factor; the "condition" is the background. The essay rubric asks for the "causes" relative to a specific causal field.
      *   *Explanation vs. Ontology:* The essay isn't necessarily making an ontological claim about the universe's causal structure. It's making a *pragmatic* claim about *explanation*. We list multiple factors to provide a *complete explanation*, not necessarily to identify necessary conditions.
      *   *Conclusion:* It's not strictly INUS. It's a pragmatic pluralism. It asks for the *salient* factors that constitute a sufficient explanation for the audience, acknowledging that reality is a web, not a chain.

