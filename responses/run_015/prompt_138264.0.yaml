answer: |-
  This is a remarkably precise diagnosis of a tension that sits at the heart of historical methodology. You have identified a friction between the *ontology* of causation (what causes actually are in the world) and the *pragmatics* of explanation (what historians are paid to produce). Your "causal bookkeeping" metaphor breaks not because your arithmetic is wrong, but because causation is not a conserved quantity like energy.

  Here is a reconstruction of the implicit commitments in ordinary historical practice, addressing your four points in turn.

  ### 1. The Implicit Theory of the Essay Rubric

  The demand for "several distinct causes" does not strictly require an INUS account, though INUS (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) is the closest standard philosophical fit. Rather, the rubric relies on a **pragmatic pluralism grounded in a specific causal field.**

  If the rubric demanded necessary conditions, a single cause would suffice (the *sine qua non*). If it demanded sufficient conditions, a single complex would suffice. By demanding breadth, the rubric assumes that the event (War in 1914) is the product of a **conjunctive causal field** where the "cause" is not a single lever but a configuration.

  *   **Why INUS is close but not quite it:** In a strict INUS account, you identify a specific sufficient complex (e.g., Alliances + Arms + Crisis) and show the factor is a non-redundant part of *that* complex. But in the 1914 essay, the student is often listing factors that belong to *different* potential sufficient complexes (e.g., Imperial Rivalry might have caused war even without Alliances).
  *   **The Actual Commitment:** The rubric presupposes that historical explanation is not about identifying the *ontological trigger* but about mapping the **causal density**. A single cause is marked down not because it is false, but because it is *explanatorily impoverished*. It fails to capture the *stability* of the outcome. If you say "The war happened because of the assassination," you imply the war was fragile (it might not have happened without that shot). If you list five causes, you imply the war was robust (the system was primed to explode; the assassination was merely the spark).
  *   **Conclusion:** The rubric licenses a **difference-making account relative to a contrast class.** The question is not "What caused the war?" but "What made the war in 1914 different from peace in 1913?" or "What made the war in 1914 different from a localized conflict?" Different causes answer different contrastive questions. Alliances explain why it was *European*; mobilisation timetables explain why it was *immediate*; nationalism explains why it was *popular*. The rubric demands the student cover the space of contrastive questions, not sum to a metaphysical total.

  ### 2. The Taboo on Counterfactual History

  The inconsistency you perceive dissolves if we distinguish between **methodological counterfactuals** and **narrative counterfactuals**.

  *   **The Metaphysical Reading:** If the taboo were metaphysical ("non-events do not exist"), it would indeed contradict the essay rubric, because establishing difference-making *requires* comparing the actual world to a possible world where the cause is absent. Since historians do this implicitly all the time ("Without the alliance system, the conflict would have remained local"), they cannot be metaphysical anti-counterfactualists.
  *   **The Evidential/Professional Reading:** The taboo is against *narrative counterfactuals* (writing the history of the world that didn't happen). The professional norm is Weber's principle of **objective possibility**. We use counterfactuals to test the *weight* of a cause in the actual world, not to speculate on the *content* of an alternate world.
      *   *Allowed:* "If Germany had not invaded Belgium, Britain might have remained neutral." (Used to establish the causal weight of the Schlieffen Plan).
      *   *Taboo:* "If Germany had not invaded Belgium, Britain would have remained neutral, and the Kaiser would have negotiated a peace in 1915..." (This creates a new narrative chain unsupported by evidence).
  *   **Resolution:** The rubric relies on *minimal* counterfactuals (subtracting one variable to see if the outcome changes). The taboo bans *extended* counterfactuals (simulating a new timeline). The tension is apparent only if one conflates the *test* for causation with the *genre* of alternate history. The historian uses the counterfactual as a scalpel, not a canvas.

  ### 3. Overdetermination and Causal Weight

  You have hit the wall here: **Under genuine overdetermination, there is no fact of the matter about causal weight.** Your bookkeeping device breaks because it assumes causation is a conserved quantity that must be distributed. It is not.

  *   **The Metaphysics:** If two assassins shoot a victim simultaneously, and either shot alone would have been fatal, both are 100% the cause of death. Causal efficacy does not dilute. If you have three sufficient pathways to war in 1914, each pathway is fully causal. Trying to assign percentages (33% each) is an error of category.
  *   **The Implication for Writing:** A rubric that took overdetermination seriously would have to stop asking "How much did X contribute?" and start asking "How many sufficient pathways existed?"
      *   *Current Practice:* We allocate credit/blame as if causes are additive. This satisfies our legal and moral intuitions (we want to know who to hang).
      *   *Overdetermination Practice:* We would describe the **topology of risk**. The writing would shift from attribution ("Germany caused the war") to structural diagnosis ("The European system contained three independent failure modes, all of which activated").
  *   **Commemoration and Blame:** This is where the practice fractures. Commemoration, law, and morality *require* singular causation. We cannot commemorate a "probability distribution" or a "conjunctive field." We need a name on a plaque. If history admitted that causal weight is underdetermined in overdetermined cases, it would undermine the search for *the* aggressor. It would suggest that the war was a systemic inevitability rather than a specific crime. Most historical writing resists this because it renders moral judgment impossible. The "breakage" in your device is a discovery: **Causal weight is not a property of the event, but a function of the observer's interest in assigning responsibility.**

  ### 4. History as Propensity (The Interventionist View)

  If history were written under a thoroughly interventionist or probabilistic view (à la Pearl or modern epidemiology), the discipline would undergo a category shift from **narrative** to **risk analysis**.

  *   **The Question:** "Why did the war come in 1914?" would dissolve into "Why was the hazard rate for systemic conflict maximal in 1914?" The focus shifts from the *event* to the *distribution*.
  *   **Survival of the Question:** The "why" survives only as a query about parameters. We wouldn't look for the spark; we would look for the dryness of the timber.
  *   **Utility and Responsibility:**
      *   *Lessons:* This history would be *more* useful for policy (preventing future wars by lowering hazard rates) but *less* useful for identity (we cannot build a national myth on a propensity score).
      *   *Responsibility:* Blame becomes diffuse. If the war was a 90% probability given the structural conditions, the specific decision-makers are less "guilty" and more "unlucky operators in a high-risk system." This is deeply unsatisfying for post-war justice.
      *   *Commemoration:* We commemorate *actualities*, not *probabilities*. A probabilistic history makes commemoration incoherent. You cannot mourn a "high likelihood of death"; you mourn the death that occurred.
  *   **The Verdict:** Ordinary historical practice preserves the "singular event" model because human social life (law, memory, guilt, pride) operates on singular events. A probabilistic history would be scientifically more robust but socially inert. It would explain everything and judge nothing.

  ### Summary

  The "ordinary academic practice" you describe is a stable compromise. It uses **counterfactual reasoning** (to establish difference-making) while banning **counterfactual narratives** (to maintain evidential discipline). It demands **multiple causes** (to capture causal density and robustness) while implicitly pretending they are **additive** (to satisfy the human need for apportioning blame).

  Your causal bookkeeping fails not because you are misunderstanding the history, but because you are trying to apply a metaphysical calculus to a pragmatic enterprise. The essay rubric is not asking for the ontology of the war; it is asking for a map of the system's vulnerabilities. The taboo on counterfactuals is not a denial of their logical necessity, but a guardrail against the loss of evidential control.

  The inconsistency you feel is the friction between history as a **science of causes** (which admits overdetermination and probability) and history as a **medium of judgment** (which requires singular agents and definite outcomes). The discipline manages this by keeping the metaphysics vague and the rubric strict.
