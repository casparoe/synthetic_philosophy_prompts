  Hi everyone, if I could steal your attention for a few minutes before the cake disappears.

  For those who don't know me, I'm [Your Name], and I've had the luck of calling [Friend's Name] my best friend for [Number] years. Looking around this room, I see two distinct groups. We've got the colleagues who know exactly what "generative grammar" means, and we've got the family and neighbors who just know he talks a lot and never stops correcting our syntax. That's basically everyone here.

  [Friend's Name] has been a linguistics professor for forty years. That is a massive amount of time to spend thinking about how we talk to each other. And since he's the expert, I figured I'd borrow his toolbox for this toast. Specifically, this idea about how every message has three layers.

  You've got the **Frame Message**, which is the physical stuff—the medium, the context, the container.
  Then you've got the **Outer Message**, which is the literal words being said.
  And then there's the **Inner Message**, which is the thing you only get when you break out of the frame. It's the real signal underneath.

  When we look at retirement through that lens, it's easy to get stuck on the first two layers.
  The **Frame** is this party. The cake, the drinks, the "Happy Retirement" banner.
  The **Outer Message** is the literal fact: [Friend's Name] is stopping work. He's not going to the office. He's not grading papers. The career, as a formal structure, is over.

  If I stopped there, it would sound like an ending. But we know that's not true. Because the **Inner Message**—the one that matters—is that meaning always escapes the frame.

  This hit home for me hard last month. My dad passed away. And I've been replaying his last voicemail to me. Literally, the outer message was just three words: "Call me back." That's the data. But the inner message... the thing I hear now that he's gone... was "I'm scared, and I love you, and I need to hear your voice." The medium ended, but the signal didn't.

  And that's what [Friend's Name] has taught us, even if he didn't mean to. He spent forty years showing us that you can't trap meaning inside rules or structures. You can't box it in.

  So, if retirement is the frame, and "stopping work" is the outer message, the inner message is that he's still transmitting. He's not losing his voice; he's just changing the frequency. He's still teaching us how to listen. He's still showing us that connection matters more than the structure it comes in.

  We aren't here to say goodbye to a career. We're here to acknowledge that the signal is strong enough to keep going without the university holding the antenna.

  So, if everyone could raise a glass.

  To [Friend's Name]. May your frame change, may your outer message relax, but may your inner message keep broadcasting loud and clear for a long, long time. Cheers.
