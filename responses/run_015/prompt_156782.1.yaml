  Two bioethicists are drafting a criterion for moral personhood.

  The first says, "We can't use absolute cranial capacity. A sperm whale's brain is heavier than a human's. I refuse to be morally subordinate to a cetacean."

  "Agreed," says the second. "We'll use the Encephalization Quotient. That's brain size relative to body mass. It measures cognitive efficiency, not just weight. That ensures humans stay on top."

  "Perfect. So humans are safely at the top?"

  "Adult humans, yes. But I just ran the numbers on the maternity ward."

  "And?"

  "And by switching from absolute size to EQ, you didn't save the babies. You just ensured the dolphin has higher moral status than your nephew."

  "So..."

  "So the dolphin gets a lawyer, and the baby gets tartar sauce."
