prompt: |-
  Write a joke about whether brain size is morally relevant. The punchline should turn specifically on the distinction between absolute cranial capacity and encephalization quotient, exploiting the tension that if moral status tracks EQ-based cognitive capacity then some cetaceans outrank human newborns. Avoid generic “bigger brain means smarter” humor; the joke should reward familiarity with the marginal-cases argument in animal ethics and should be intelligible without any outside research.
