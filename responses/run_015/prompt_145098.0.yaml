  # Joint Statement of Adversarial Collaboration on the Lottery and Preface Paradoxes

  **Date:** October 26, 2023
  **Participants:** The Closure-Denying Belief-Fragmentationists & The Pragmatic-Contextualist Threshold-Shifters
  **Purpose:** To delineate points of agreement, specify structural disagreements, and identify empirical and formal cruxes for further investigation in seminar discussion.

  ## 1. Agreed Claims

  Both camps affirm the following premises and constraints as the baseline for this collaboration. We agree that any viable solution to the Lottery and Preface paradoxes must accommodate these points without resorting to skepticism or infallibilism.

  1.  **Formal Setup of the Lottery Paradox:**
      *   There is a fair lottery with 1,000 tickets and exactly one winner.
      *   For any single ticket $t$, the probability that $t$ will lose is 0.999.
      *   Intuitively, it is rational to believe of any single ticket that it will lose.
      *   Intuitively, it is rational to believe that there is exactly one winner (i.e., not all tickets will lose).

  2.  **Formal Setup of the Preface Paradox:**
      *   An author asserts $n$ claims in a book, where $n$ is large.
      *   For each individual claim $c_i$, the author has strong evidence and high confidence (comparable to the lottery ticket case).
      *   Intuitively, it is rational for the author to believe each individual claim $c_i$.
      *   Intuitively, it is rational for the author to believe that at least one claim in the book is false (based on inductive humility regarding human fallibility).

  3.  **Requirements for a Solution:**
      *   **Fallibilism:** The solution must preserve the notion that one can rationally believe a proposition without having certainty (probability 1.0) regarding that proposition.
      *   **Non-Contradiction:** The solution must explain how an agent avoids holding outright contradictory beliefs (believing $P$ and $\neg P$) in a way that violates norms of rationality.
      *   **Premise Preservation:** The solution cannot simply dismiss the intuitive premises (e.g., by claiming it is *never* rational to believe a lottery ticket will lose).

  4.  **Standard No-Go Results:**
      *   We agree that a simple fixed-threshold account of belief (where belief is defined as confidence above a fixed level $t < 1$) combined with the principle that belief is closed under logical consequence (specifically conjunction) is untenable.
      *   Such a model forces the agent into inconsistency when faced with either the Lottery or the Preface cases. Therefore, either closure must be restricted, or the threshold/context must vary.

  ## 2. Statement of Disagreements

  While we agree on the setup and the failure of the simple fixed-threshold model, we diverge on the mechanism used to resolve the tension. The following table outlines the specific formulations each camp accepts regarding key structural issues.

  | Issue | Closure-Denying Belief-Fragmentationist Wording | Pragmatic-Contextualist Threshold-Shifter Wording |
  | :--- | :--- | :--- |
  | **Rational Requirement of Closure** | Belief closure under conjunction is not a rational requirement; an agent can rationally believe $P$ and believe $Q$ without being required to believe $P \land Q$. | Belief closure holds within a fixed context; apparent violations occur because the agent shifts contexts when moving from individual claims to conjunctions. |
  | **Underlying Mechanism** | The Lottery and Preface paradoxes share a single underlying structural mechanism: the non-aggregability of high-confidence beliefs across fragmented doxastic states. | The Lottery and Preface paradoxes are analogous but distinct; both rely on the sensitivity of belief attribution to practical stakes and conversational scores. |
  | **Nature of Belief** | "Belief" is a unified attitude type, but the doxastic state is compartmentalized; agents hold beliefs in separate fragments that do not automatically merge. | "Belief" is a context-sensitive relation; there is one doxastic state, but the standards for applying the term "belief" shift based on conversational context. |
  | **Psychological Realism** | It is psychologically realistic to believe each ticket loses without believing the conjunction; the mind naturally compartments probabilistic information to avoid paralysis. | It is psychologically unrealistic to hold contradictory fragments simultaneously; the feeling of consistency is maintained by rapidly shifting standards of precision. |
  | **Formal Representation** | Doxastic states are best represented by multiple belief boxes with revision priorities, where logical consequences do not automatically propagate between boxes. | Doxastic states are best represented by Lewisian scorekeeping where the conversational score determines the threshold for belief attribution non-monotonically. |

  ## 3. Identified Cruxes

  To move this collaboration forward, we have identified three specific sub-questions. Settling these would significantly alter the plausibility of one or both positions. For each crux, we specify what both sides agree counts as bearing on the issue and record our respective predictions.

  ### Crux 1: The Formal Unification Question
  **Question:** Could there be a unified logical model that captures both the Fragmentationist's fragmented belief sets and the Contextualist's indexed thresholds in the same formal system? If such a model exists, does it demonstrate that one view is merely a notational variant of the other?

  *   **What Counts as Bearing on This:** A formal proof demonstrating isomorphism between a fragmented belief logic and a dynamic contextual logic. If the models are mathematically equivalent, the dispute may be merely explanatory rather than substantive.
  *   **Fragmentationist Prediction:** A unification is possible, but it will show that contextual parameters are merely labels for fragments. This vindicates the view that the mind's architecture is fundamentally non-closed, regardless of how we label the contexts.
  *   **Contextualist Prediction:** A unification is possible, but it will show that fragments are simply static snapshots of dynamic contextual shifts. This vindicates the view that closure holds locally, and fragmentation is an artifact of ignoring the context parameter.

  ### Crux 2: The Psychological Survey Case
  **Question:** Consider a survey asking subjects two questions in immediate succession: (1) "Do you believe ticket 347 will lose?" and (2) "Do you believe all 1,000 tickets will lose?" How do subjects report their confidence and sense of contradiction?

  *   **What Counts as Bearing on This:** Empirical data on subject response patterns, specifically reaction times and reported feelings of contradiction. If subjects report no tension between the answers, it supports Fragmentation. If subjects report a change in how they interpret "believe" between questions, it supports Contextualism.
  *   **Fragmentationist Prediction:** Subjects will affirm (1) and deny (2) rapidly, reporting no sense of contradiction or shift in meaning. This indicates the mind naturally tolerates the logical gap without requiring a contextual shift.
  *   **Contextualist Prediction:** Subjects will affirm (1) and deny (2), but will report a subtle shift in what they consider "believing" when asked about the conjunction. The denial of (2) is driven by a raised standard triggered by the mention of the universal quantifier.

  ### Crux 3: The Meticulous Author Case (Preface Specific)
  **Question:** Imagine an author who has personally verified every citation in her book and found zero errors. She knows human error is possible generally, but has specific evidence for each claim. Does she still rationally believe "there is at least one error in this book"?

  *   **What Counts as Bearing on This:** Intuitions regarding the rationality of the author's mental state when specific evidence conflicts with general inductive humility. Does the specific evidence defeat the general humility, or do they coexist?
  *   **Fragmentationist Prediction:** Yes, she rationally believes each claim is correct based on verification, and she also rationally believes there is at least one error based on general humility. These beliefs exist in different fragments and do not cancel each other out, even with strong specific evidence.
  *   **Contextualist Prediction:** It depends on the context of attribution. In the context of checking citations, she believes each claim is correct and does not believe there is an error. In the context of publishing the book as a whole, the threshold shifts, and she accepts there is likely an error. She cannot hold both beliefs simultaneously in the same context.

  ***

  **Signed,**

  *The Closure-Denying Belief-Fragmentationists*

  *The Pragmatic-Contextualist Threshold-Shifters*
