  ### 1. Candidate Rules Fit to Precedents

  Based on the six precedents and the 2011 memo, two competing interpretations of the phrase *"revision does no more than accommodate the data already in hand"* emerge. Both fit the historical votes but diverge on the current case.

  **Rule 1: The Data-Independence Principle (Novelty Focus)**
  *   **Definition:** A revision to auxiliary assumptions is permitted if and only if it generates a prediction tested on data *not* used to motivate the revision. The statistical severity of the test (power, preregistration) is secondary to the independence of the data.
  *   **Fit to Precedents:**
      *   *Approves:* **Tectonic** (revisions predicted independent data), **Carrier** (satellites confirmed on new data), **Phenology** (revisions tested on new data).
      *   *Rejects:* **Motivational** (failures explained by resistance, no new data), **Ambient** (outcome re-specified on *same* data), **Coherence** (quantity defined by effect, no independent data).
  *   **Logic:** The memo bans fitting old data; it does not explicitly ban fitting noise in new data if the prediction was genuinely novel.

  **Rule 2: The Test-Severity Principle (Risk Focus)**
  *   **Definition:** A revision is permitted only if the new prediction is subjected to a test with a high probability of failure (adequate power, fixed analysis rules, or preregistration). High success rates in low-power or flexible tests count as "accommodating data already in hand" because they fit noise rather than signal.
  *   **Fit to Precedents:**
      *   *Approves:* **Tectonic** (quantitative/independent), **Phenology** (preregistered/power), **Carrier** (implied robust confirmation of satellites).
      *   *Rejects:* **Motivational** (no risk), **Ambient** (low power/post-hoc), **Coherence** (no chance of failing).
  *   **Logic:** "Accommodating data" includes accommodating random variance. Without severity, a "novel" prediction is epistemically equivalent to fitting old data.

  ### 2. Prediction for *Phase-Lattice Dynamics*

  *   **Under Rule 1 (Data-Independence):** **Approve (Low Confidence).**
      *   *Reasoning:* The belt models predict data "not used in the fit." The 70% confirmation rate on unregistered predictions suggests novel content. The engineering use confirms empirical grip. The core's stipulative nature is excusable under the *Carrier* precedent.
      *   *Weakness:* The preregistry failure (9/26) suggests the "novel" data might be noise, but Rule 1 prioritizes independence over severity.

  *   **Under Rule 2 (Test-Severity):** **Reject (High Confidence).**
      *   *Reasoning:* The coupling kernel has 30 degrees of freedom (fits anything). Samples are small (N=20-40) with no power analysis. The preregistered hit rate (~35%) is at chance, proving the unregistered 70% rate is the result of methodological flexibility (accommodating noise). The response to failed replications ("site-specific coupling") mirrors the *Motivational* "resistance" excuse.
      *   *Strength:* Aligns with the *Ambient* rejection where high reported success collapsed under methodological scrutiny.

  ### 3. Committee Vote Prediction and Memo Reading

  **Prediction:** The committee will **Reject** the grant.

  **Reasoning:**
  While the *Carrier* precedent (2012) allows for a shielded core, it requires the shield to generate *confirmed* satellite models. The *Phase-Lattice* registry data (2019–present) provides a decisive internal control: it demonstrates that the field's standard methods produce false positives (70% vs. 35%). This moves the case from the *Carrier* analog (productive shield) to the *Ambient* analog (degenerating shield).

  I rely on a reading of the 2011 memo that interprets *"accommodate the data already in hand"* to include **accommodating the noise structure of the data**. The memo requires claims to "conflict with observation." A test with no power analysis and flexible exclusion rules cannot conflict with observation; it can only mirror the researcher's degrees of freedom. The *Phenology* precedent (2019) establishes that preregistration is the preferred mechanism to prove revision isn't mere accommodation. *Phase-Lattice* failed this specific test. The engineering use is noted but deemed insufficient for a *research programme* grant, as it operates in a "narrow domain" distinct from the general theoretical claims.

  ### 4. Closest Analog

  **Closest Analog:** *Ambient Field Epidemiology* (Rejected, 2016).

  **Why:**
  *   **Structural Similarity to *Carrier*:** Both have a core protected by convention. However, *Carrier* was approved because its satellites were "confirmed" without qualification. *Phase-Lattice* satellites are "confirmed" only until preregistered.
  *   **Methodological Similarity to *Ambient*:** Both fields report high success rates (~70% vs. "never refuted in thirty studies") that rely on small samples, post-hoc re-specification (outcome variable vs. coupling kernel), and lack of power analysis.
  *   **Decisive Feature:** In *Ambient*, effect sizes drifted toward zero. In *Phase-Lattice*, the preregistered hit rate dropped to chance. Both indicate that the "success" was an artifact of methodological flexibility, not empirical truth. The committee's note on *Ambient* ("claims have never been put in jeopardy") applies verbatim to *Phase-Lattice*'s unregistered models.

  ### 5. Principles at Stake (Where Precedents Underdetermine)

  The precedents underdetermine the weight of **practical utility** versus **methodological rigor** when theoretical progress stalls.

  *   **If we Approve:** We adopt the principle that **instrumental success validates theoretical flexibility.** We prioritize the "engineering use" and the 70% unregistered hit rate, accepting that a field may remain scientifically productive even if its formal tests are weak, provided it yields working tools. This risks funding a "degenerating" programme that survives on ad hoc adjustments.
  *   **If we Reject:** We adopt the principle that **methodological rigor is a precondition for long-term funding.** We prioritize the preregistry failure and the lack of power, asserting that a field cannot claim "scientific" status for long-term support if it cannot distinguish signal from noise in its own tests. This risks stifling an interdisciplinary field that may need flexible heuristics to mature.

  ### 6. Decisive Further Case

  To separate Rule 1 (Data-Independence) and Rule 2 (Test-Severity), the committee should seek a case with the following profile:

  **The Case:** A field revises a model post-hoc to fit a complex dataset. The revised model then predicts a **single, precise, quantitative value** (e.g., a physical constant or a specific astronomical event timing) that is subsequently **confirmed by high-precision measurement**, but the prediction was **not preregistered** and the sample size is **N=1**.

  *   **Rule 1 (Data-Independence) Says:** **Approve.** The prediction was novel (not used in the fit) and confirmed by independent data. The lack of preregistration or power analysis is irrelevant because the match is precise and the data is new.
  *   **Rule 2 (Test-Severity) Says:** **Reject.** The revision accommodated the initial data. The test of the prediction had no statistical power (N=1) and was not preregistered, meaning the "confirmation" could be the result of selective reporting or measurement bias. The claim was not put in genuine jeopardy.

  This case isolates whether the committee values the *novelty of the content* (Rule 1) or the *severity of the process* (Rule 2) when they conflict.
