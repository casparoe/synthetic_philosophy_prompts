answer: |-
  ### Constraints List

  1.  **Time Limit:** The speech must be approximately 750–900 words to fit the 5–6 minute window at a moderate speaking pace.
  2.  **Audience Duality:** It must satisfy the Dutch expectation of authenticity (where pure praise feels like flattery) and the Japanese expectation of *wa* (harmony), where public criticism is seen as disruptive and warmth is implied rather than stated.
  3.  **The "Two Truths" Philosophy:** It must reference the mother's rule (one critical, one kind truth) without presenting it as a law she never broke, since she did break it.
  4.  **The Secret:** It cannot reveal the specific lie told to the Aunt regarding the deceased brother, nor can it explicitly state that the mother never lied. It must honor the mother's integrity without making a falsifiable claim.
  5.  **Philosophical Stance:** It must take a position on bluntness: is it a duty to the listener (the "errand") or a way for the speaker to keep their hands clean?
  6.  **Accessibility:** No academic jargon, no named philosophers, no abstract theorizing that would lose the teenagers or tired uncles.
  7.  **Emotional Tone:** It must convey the speaker's complex mix of love and unresolved anger without turning the retirement party into a therapy session or a grievance airing.
  8.  **Cultural Context:** It must acknowledge the Nagoya setting and the mother's life as a bridge between Dutch and Japanese cultures.

  ***

  ### The Speech

  Good evening.

  For those who don't know me, I'm the son who grew up hearing that a white lie is a kind of theft. My mother taught us that when you withhold the truth, you aren't just protecting someone; you are stealing an errand from them. You are taking away the chance they might have had to apologize, to say goodbye, or to fix something broken.

  She called this the Two Truths Rule. At our Sunday dinners, silence was not an option. Everyone had to offer one true kind thing and one true critical thing to everyone else at the table. It was exhausting. It was often uncomfortable. But it was ours.

  She brought this Dutch directness to Nagoya thirty-seven years ago. She stood between two worlds. On one side, her family, who believe that if you love someone, you tell them the hard thing so they can grow. On the other side, her colleagues and students here, who understand that love is often shown by what you *don't* say, by the space you leave for someone to save face, by the quiet gap between what you feel and what you speak.

  For a long time, I thought these were opposites. I thought you either told the truth to keep your own hands clean, or you told a lie to keep the peace. I thought bluntness was a duty we owed each other, a way to ensure everyone had their errands to run.

  But watching her teach for forty years, I've changed my mind.

  There is a difference between truth-telling as a performance of virtue, and truth-telling as an act of care. Sometimes, being blunt is just a way to say, "Look how honest I am." But real honesty is knowing what truth the other person can actually carry.

  My mother taught us that truth is a tool for connection. But she also learned, living here, living life, that sometimes the heaviest thing you can do for someone you love is to carry a truth they cannot bear.

  There is a cost to this. I know there is. I know that when we shield each other, we sometimes cancel an errand. We stop someone from making a repair they might have wanted to make. That is a loss. I am not going to stand here and pretend that protection doesn't have a price. It does. It costs the protector something, too. It means living with a weight so someone else doesn't have to.

  We are here to honor a teacher. And what is teaching, if not the careful administration of truth? You do not give a student the hardest lesson on the first day. You do not crush a sprout to prove you are honest about the weather. You wait. You measure. You give them the truth they can use to grow, not the truth that will break them.

  To my mother's Dutch family: You see her directness. You know she loves you because she challenges you. That is real.
  To her Japanese family and friends: You see her restraint. You know she loves you because she respects your harmony. That is also real.

  She lived in the tension between those two things. She taught us that integrity isn't about never bending. It's about knowing why you bend. It's about asking: Am I saying this to clear my conscience, or to clear a path for you?

  I love her for the truths she told me, the critical ones that shaped me and the kind ones that held me. And I love her for the burdens she chose to carry alone, so that others at her table could eat in peace.

  Mom, you taught us that white lies are theft. But you also taught us that love is sometimes about paying the debt for someone else. You have run enough errands for us. You have carried enough weight.

  Tonight, we offer you our own two truths. The critical truth is that you are stubborn, and you work too hard, and you still think you have to protect us. The kind truth is that you are loved, deeply and quietly, by everyone in this room, exactly as you are.

  Thank you.

  ***

  ### Note on Omissions and Slants

  1.  **The Nature of the "Burden":** I deliberately slanted the section about "carrying a truth they cannot bear" to frame the mother's lie to her sister as a sacrificial act rather than a moral failure. This honors the mother (she took the pain) without confirming the specific content of the lie to the Aunt. The cost here is ethical ambiguity; I am validating the *act* of withholding truth in a specific context, which technically undermines the "white lies are theft" philosophy she taught, but saves the family peace.
  2.  **The "Two Truths" at the End:** In the final toast, I offered the "critical truth" (you work too hard/think you have to protect us). This is a safe criticism designed to satisfy the Dutch contingent's need for authenticity without revealing the actual source of my anger (the secret lie). The cost is that I am performing honesty rather than being fully honest about my resentment.
  3.  **The Position on Bluntness:** I took the position that bluntness is often self-serving ("keeping hands clean") and that true care involves measuring what truth a person can carry. This supports the mother's choice to lie to her sister without explicitly endorsing lying. It shifts the metric from "truth vs. lie" to "capacity vs. burden."

  **Lines to Cut for Tightening:**
  If you need to shave time, cut the second paragraph entirely ("She called this the Two Truths Rule..."). The concept is explained sufficiently in the first paragraph and demonstrated later. You can also trim the paragraph beginning "To my mother's Dutch family..." down to a single sentence combining both sentiments (e.g., "She lived in the tension between Dutch directness and Japanese restraint, and she loved you both ways.").
