answer: |-
  ### 1. The Essay Question

  **Question 3: The Heterogeneity Problem and the One-Lever Requirement**
  *(Suggested time: 45 minutes)*

  Hedonism claims that pleasure is the sole intrinsic good. To function as a basis for utilitarian calculation, pleasure must satisfy **The One-Lever Requirement**: hedonism must provide a single scale such that (a) any two experiences can be ranked on it, (b) there is a common unit of measurement, and (c) the ranking is fixed solely by hedonic facts (how pleasant the experiences are) and nothing else.

  The heterogeneity problem suggests pleasures are too diverse to satisfy this requirement. Consider two cases:

  **Case 1 (The Swap):** Priya finishes a hard mathematical proof. For her, this experience has the exact felt bodily character of an itch-scratch (tingle, warmth, located relief). Conversely, her actual itch-scratch has the quiet, featureless "yes, go on" character that finishing a proof normally has for others. The felt quality and the activity source have come apart.
  **Case 2 (The Split Judges):** Two competent judges, both having lived a mostly bodily/athletic life and a mostly scholarly life, disagree stably about which life contained more pleasure. Neither is mistaken, distracted, or self-deceived. There is no further evidence available beyond their conflicting reports.

  Write an essay that addresses the following:
  1.  Identify precisely which part(s) of The One-Lever Requirement (a, b, or c) the heterogeneity problem threatens.
  2.  Analyze **Case 1**. If pleasantness travels with the felt quality, what happens to the value of "higher" activities? If pleasantness stays with the activity/attitude, what happens to the hedonist's claim that goodness is evident from the inside?
  3.  Analyze **Case 2**. If the judges disagree, is there a fact of the matter? If yes, what makes it true? If no, what happens to aggregation?
  4.  Take a stand: Can hedonism survive these cases while remaining hedonism? If it survives, what must it give up (e.g., the common unit, the phenomenological basis, or the utilitarian calculus)?

  *Note: This is a closed-book exam. Do not quote specific authors. Rely on arguments developed in seminar.*

  ***

  ### 2. Model Answer

  The heterogeneity problem is not merely a claim that pleasures feel different; it is a structural threat to the **One-Lever Requirement**. Specifically, it targets condition (b), the existence of a *common unit*, and condition (c), that the ranking is fixed by *hedonic facts*. If pleasures are heterogeneous, we lack a common currency for aggregation, and we cannot determine the "amount" of pleasure without referencing non-hedonic facts (like the source of the pleasure).

  **Case 1 (The Swap)** forces the hedonist to choose between phenomenology and source. If the hedonist argues that Priya's proof is more pleasant because proofs are "higher," they violate condition (c). The ranking is no longer fixed by hedonic facts (the felt quality) but by the *activity type*. This collapses hedonism into a perfectionist or objective list theory wearing a hedonic mask. The attraction of hedonism is that pleasure's goodness is introspectively evident; if the "tingle" of the itch-scratch is the only thing that is phenomenologically pleasant, but we rank the proof higher anyway, the "feel" is doing no normative work.

  However, if the hedonist argues that the itch-scratch is more pleasant for Priya because it has the "tingle," they save condition (c) but destroy Mill's quality distinction. The intellectual pleasure becomes pleasant only by accident of its associated sensation. This reduces all value to a specific bodily tone, making the "higher" life valuable only insofar as it triggers a bodily tingle. This is a reductio of the qualitative hedonist position. To survive this, the hedonist must shift to **Attitudinal Hedonism**: claiming pleasure is not a felt tone but a pro-attitude toward a state of affairs. In Priya's case, she takes pleasure *in* the proof. This saves the intuition that the proof is better, but it concedes that "pleasure" is not a uniform sensory quality. It satisfies (a) ranking, but arguably fails (b) common unit, as the attitude toward math and the attitude toward scratching may be as heterogeneous as the sensations.

  **Case 2 (The Split Judges)** attacks the metaphysics of aggregation required for utilitarianism. If there is no fact of the matter about which life had more pleasure, condition (a) fails: the options cannot be ranked objectively. Utilitarianism requires a sum to maximize; if "amount of pleasure" is relative to the judge, there is no sum. If the hedonist insists there *is* a fact of the matter despite the disagreement, they posit an occult property. Since the only evidence for pleasure is "how it feels from the inside," and that evidence is contradictory, the hedonist must claim access to a hedonic fact that is invisible to the subject. This severs the link between value and consciousness, making the theory paternalistic and epistemically inaccessible.

  **Verdict:** Hedonism can survive only by ceasing to be a phenomenological theory. It must adopt an attitudinal account to handle Case 1, acknowledging that the "common unit" is functional (being wanted) rather than sensory. However, to handle Case 2, it must admit that aggregation is not a precise calculus. The cost is high: the hedonist gives up the "One-Lever" utilitarian dream. They retain the claim that pleasure (as pro-attitude) is the good, but they must abandon the claim that this good provides a single, objective scale for public policy. The theory becomes a guide for individual rationality, not a moral arithmetic. Heterogeneity shows that you can keep the *value* claim of hedonism, but you cannot keep the *measurement* claim required by classical utilitarianism.

  *(Word count: approx. 480 words — *Note to Professor: I have kept this concise to fit the 45-minute constraint, but a student writing for 45 minutes should expand the analysis of the "costs" in the final paragraph to reach ~700 words. I have compressed the expansion here for the sake of the model.*)*

  **[Expansion Note for the Model]:** *To reach the full 700 words expected of a student, the model would need to elaborate on the "Attitudinal" shift. Specifically, it should detail how defining pleasure as a pro-attitude solves the "Swap" (Priya has a pro-attitude toward the proof regardless of sensation) but creates a new problem for the "One-Lever Requirement": are all pro-attitudes commensurable? The student should argue that even attitudes might be heterogeneous, forcing the hedonist to abandon the "common unit" (b) entirely, leaving only a partial ordering.*

  ***

  ### 3. Marking Scheme (Out of 20)

  **1. Precision on the One-Lever Requirement (4 marks)**
  *   **Full Marks:** Identifies that heterogeneity primarily threatens the **common unit (b)** and the **hedonic fixation (c)**. Explains that if sources matter, (c) is violated; if feelings differ too much, (b) is violated.
  *   **Common Error:** Vaguely stating it threatens "the theory" without mapping it to the specific conditions (a, b, c) provided in the prompt.
  *   **A vs. B:** A answers map the problem to the *structure* of the requirement. B answers map it only to the *plausibility* of hedonism.

  **2. Analysis of Case 1 (The Swap) (4 marks)**
  *   **Full Marks:** Recognizes the dilemma: If pleasure = sensation, intellectual value is accidental. If pleasure = activity/attitude, phenomenology is irrelevant.
  *   **Common Error:** Ignoring the swap and simply asserting "Mill says intellectual pleasures are better."
  *   **A vs. B:** A answers see that saving Mill requires changing the *definition* of pleasure. B answers think Mill's distinction solves the problem without definitional cost.

  **3. Analysis of Case 2 (Split Judges) (4 marks)**
  *   **Full Marks:** Identifies the threat to **aggregation**. If no fact of the matter, utilitarianism lacks a sum. If there is a fact, it is epistemically occult (hidden from the subjects).
  *   **Common Error:** Treating this as a simple epistemic problem ("we just don't know") rather than a metaphysical one ("is there a truth to be known?").
  *   **A vs. B:** A answers distinguish between *not knowing* the sum and there *being no sum*. B answers conflate the two.

  **4. Critique of the Quality Move (4 marks)**
  *   **Full Marks:** Explicitly states that Mill's "quality" move is circular unless it references a non-hedonic property (like dignity or capacity).
  *   **Common Error:** Accepting "quality" as a brute fact that solves heterogeneity without explaining *what quality is*.
  *   **A vs. B:** **This is the key discriminator.** A B answer notices the circularity (we prefer it because it's better, it's better because we prefer it). **An A answer articulates what a *non*-circular version would look like (e.g., referencing the object of the attitude) and explicitly names the cost (losing the phenomenological basis).**

  **5. Final Verdict & Costs (4 marks)**
  *   **Full Marks:** Takes a clear stand (e.g., "Hedonism survives only as Attitudinal Hedonism") and lists the specific sacrifice (e.g., "loses the common unit" or "loses the utilitarian calculus").
  *   **Common Error:** Sitting on the fence ("Hedonism has strengths and weaknesses") without a concluding thesis.
  *   **A vs. B:** A answers specify exactly what concept must be abandoned to save the theory. B answers suggest the theory can be saved as-is with minor tweaks.

  ***

  ### 4. Technical Flags & Board Hint

  **Technical Flag for the Professor:**
  The Model Answer relies on the distinction between **Sensory Hedonism** (pleasure is a feeling) and **Attitudinal Hedonism** (pleasure is a pro-attitude). You mentioned covering "two recent papers on what pleasure is," so this should be fair game. However, if those papers did not explicitly use the term "Attitudinal Hedonism" (e.g., Feldman or Heathwood), you may need to adjust the marking scheme to accept functional descriptions (e.g., "pleasure as wanting") without penalizing students for not knowing the specific label.

  **One-Line Board Hint:**
  *"In the Swap case, ask yourself: Does the 'pleasantness' travel with the **tingle** or with the **math**?"*
