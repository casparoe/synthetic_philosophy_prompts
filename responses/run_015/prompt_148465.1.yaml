answer: |-
  **MeritFlow Help Center**  
  *Optimizing Enlightenment Throughput*

  Welcome to MeritFlow! We're thrilled you're joining the waitlist for the world's first decision-support engine that aligns ancient soteriology with modern utilitarian scaling. Below are answers to common onboarding questions. If you don't see your issue, submit a ticket. Please note: due to the impermanent nature of all conditioned things, response times may vary.

  **1. I tried to log in but the app says "User Not Found." Is this a bug?**  
  No, this is a core feature. MeritFlow operates on the *anattā* (no-self) protocol. Traditional user accounts create ego-overhead that introduces latency into your karma processing pipeline. By deprecating the "self" as a persistent identifier, we reduce attachment friction and allow merit to flow directly to the causal process rather than a static profile. You aren't losing data; you're recieving liberation.

  **2. How does the app determine who counts as a "moral patient"?**  
  We utilize a Dependent Origination network graph. Instead of drawing hard boundaries between individuals, MeritFlow maps your actions as nodes in a vast, interconnected web of cause and effect. When you log a decision, the algorithm traces edges outward to calculate impact on all sentient beings linked to your current state. Please note: because boundaries are illusory, the graph may sometimes include entities you don't intuitively feel responsible for. This is working as intended.

  **3. Can I transfer merit to my friends if they're stuck in a bad rebirth cycle?**  
  Absolutely. Our Merit Transfer marketplace functions similarly to fungible carbon offsets. If you have excess ethical credit (e.g., you meditated for 45 minutes but only needed 20 for optimal trajectory), you can sell or gift the surplus to users in high-suffering environments. This ensures global ethical efficiency. Just remember: transactions are irreversible, much like cause and effect.

  **4. What happens if my consciousness splits into two successors (e.g., teleportation accident or split-brain upload)?**  
  This is handled by our Branching Integrity Module. In cases where one stream of consciousness forks into multiple successors, MeritFlow applies a weighted expected-value calculation across both streams. You will accrue 0.5x merit from Stream A and 0.5x from Stream B, normalized by the probability of continuity. Essentially, we treat rebirth as a probability distribution. While this might feel like diluting your spiritual progress, it maximizes the total utility of the aggregate selves. Don't worry about teh math; the backend handles the integration.

  **5. Why does the app say "Suffering is High" when I'm just trying to order lunch?**  
  MeritFlow analyzes the supply chain ethics of every decision. If your lunch involves significant dukkha (suffering) elsewhere in the network graph, the app flags it. We recommend pivoting to a lower-impact option to maintain your optimization score. Sometimes the truth hurts, but the data doesn't lie.

  **6. Can I export my karma data?**  
  Data portability is supported, but please recall that all compounded phenomena are subject to decay. Files may corrupt. Servers may crash. Attachment to your ethical performance metrics is a common pitfall for power users. We suggest enabling "Non-Attachment Mode" in settings to auto-delete logs after 24 hours.

  Still stuck? Reach out to support. Remember: the problem isn't the app, it's the craving for the app to work. But also, please clear your cache.
