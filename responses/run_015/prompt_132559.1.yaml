      *   **Section 5: Unfalsifiability Assessment.**
          *   Is it a virtue (flexibility) or vice (dogma)? In regulation, certainty is needed. Post-hoc adjustment is dangerous.
      *   **Section 6: Opponent Concessions.**
          *   What would each side admit hurts *you* specifically?
