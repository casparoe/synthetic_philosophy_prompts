      *   *Idea 3:* Evolution/Phylogenetic Tree. (Speciation. Ancestors aren't "dead" in a graveyard; they are lineage. Extinction happens, but traits persist.)
      *   *Selection:* **Evolutionary Tree/Lineage** is the standard rival. But **Cartography/Map-Making** is often better for *reference*. Let's suggest **Map-Making** or **Software Refactoring**. Map-making is more classical. Let's go with *Map-Making* but acknowledge its limits, or perhaps *Archaeological Stratigraphy* (layers remain, but interpretation changes). Actually, **Software Refactoring** is very modern and fits the "structure remains, implementation changes" vibe of Structural Realism. Let's offer **Evolutionary Tree** as the standard alternative and **Map-Making** as the semantic alternative.

  10. **Refining the Tone:**
      *   The user is likely a grad student or advanced undergrad (talking about HPS reading groups, supervisors, Neurath).
