  13. **Final Polish:** Ensure the distinction between *entity realism* and *structural realism* is hinted at where relevant (Boat/Structure). Make sure the "Gravedigger" analogy is sharp. (Self-Correction: The Gravedigger is usually the *new theory*, but sometimes it's the *community*. Let's stick with New Theory as it fits the replacement narrative).

