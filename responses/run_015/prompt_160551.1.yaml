      *   (3) *Relation of 1 & 2:* Compatible. Solving 1 reveals 2.
      *   (4) *Planning vs. Firm:* Planning isn't refuted by Hayek because firms are planned hierarchies. Boundary is transaction costs (Coasean).
      *   (5) *Empirical Record:* Actual socialist failures were due to incentives/politics (Loss Problem), not calculation (Index/Update).
      *   (6) *Hayek's Epistemology:* Price system = discovery procedure. Equilibrium benchmarks are invalid standards.
      *   (7) *Meta-Rule Problem:* "Who adjusts the rule?" applies to both planning and markets (interest rate rules). Symmetry.

