      *   **Tension B: (2) vs. (7).**
          *   (2) relies on Hayek's asymmetry: Markets update faster/better than planners.
          *   (7) claims symmetry: Both need meta-rules (interest rates/pricing rules) set by someone.
          *   *Conflict:* If (7) is true (symmetry), it weakens (2). If the market also needs a non-market rule-setter (Central Bank?), then the "discovery procedure" advantage is blunted.
          *   *Diagnosis:* (7) undermines the force of (2). Hayek's point is precisely that the market *doesn't* need a central rule-setter for prices in the same way.
          *   *Resolution:* (7) is likely false or misleadingly symmetric. The market generates rates endogenously; the planner sets them exogenously.

      *   **Tension C: (6) Internal Consistency.**
          *   (6a) Price system is a discovery procedure.
          *   (6b) Reject equilibrium benchmarks.
          *   *Conflict:* None. This is standard Hayek. Equilibrium assumes given data; discovery implies data generation.
          *   *Diagnosis:* This is a false inconsistency. Keep both.

      *   **Tension D: (1) vs. (2).**
          *   (1) Lange solves Mises (static).
          *   (2) Hayek solves Lange (dynamic).
          *   *Conflict:* None. This is standard interpretation (Lange-Hayek debate).
          *   *Diagnosis:* False inconsistency. (3) confirms this.

      *   **Tension E: (4) vs. (2) (Specifics).**
          *   If firms are planned hierarchies (4), and they operate in dynamic markets, how do they solve the Update Problem (2)?
          *   *Answer:* Transfer prices + Profit/Loss discipline (Loss Problem).
