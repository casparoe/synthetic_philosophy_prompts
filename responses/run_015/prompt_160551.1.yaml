          *   Cost of dropping (4): Lose the Coasean nuance.
          *   *Best Move:* Keep (2) but admit it applies *primarily* to the whole economy, not firms. Firms solve it via the Loss Problem (which they face, unlike socialist managers). This links (2) and (5). The Update Problem is unsolvable *without* the Loss Mechanism.
