      *   **Tension A: (2) vs. (4) & (5).**
          *   (2) says planning fails due to *epistemic limits* (knowledge dispersion/dynamics).
          *   (4) says planning works inside firms (which are large hierarchies).
          *   (5) says actual socialist failure was *incentive/political* (Loss Problem), not epistemic.
          *   *Conflict:* If (5) is true (failure was incentives), why is (2) the *centerpiece*? If (4) is true (firms plan successfully), why does the state fail epistemically but the firm doesn't? Firms face dynamic change too.
          *   *Diagnosis:* This is the biggest tension. It looks like the user is trying to have it both ways: blaming epistemology for theoretical failure (2) but blaming incentives for empirical failure (5), while admitting firms solve epistemology (4).
