answer: |-
  **MEMORANDUM**

  **TO:** Professional Conduct Committee
  **FROM:** Drafting Member
  **RE:** Complaint 24-11 – Rule 3.2 Construction

  **Recommendation**
  The Committee should sustain Count 1 regarding the travel history statements and issue a formal caution on Count 2 regarding the security review representation.

  **Rule Construction**
  We adopt the **Interface Standard** for interpreting Rule 3.2. Under this standard, a member misrepresents capabilities when a client-facing statement contains ambiguity that functions as a producer-side bug, creating a material risk of misunderstanding that could have been resolved at low cost during transmission. Truthfulness is not merely a property of the statement in isolation but of the signal received by the audience. Where a member knows or should know that a technically true statement will likely be decoded incorrectly by a reasonable audience member, the member bears the burden of patching the ambiguity before transmission.

  **Application to Count 1 (Travel History)**
  Count 1 is sustained. The member's assertion that the system "does not log individual travel history" was technically accurate only within the narrow dialect of the technical annex, which defined history as a specific database row. However, the audience included a procurement officer lacking engineering training. To this recipient, the statement conveyed a functional privacy guarantee that the system architecture did not support. The member knew the analytics pipeline allowed reassembly of rider itineraries and explicitly noted internally that retention details should be minimized. Clarifying this limitation would have required one sentence added to the email at zero cost. By treating the ambiguity as a feature rather than a bug, the member allowed a material falsehood to propagate to the public-facing privacy page. This violates the duty to ensure capabilities are not misrepresented, even if the literal syntax was valid.

  **Application to Count 2 (Security Review)**
  Count 2 warrants a caution but not a sustained violation. The statement that the platform was "reviewed by an independent security firm" was literally true; an engagement existed. Unlike Count 1, there is no evidence the member intended to imply the review was comprehensive or favorable regarding the analytics pipeline. In the security industry, "reviewed" does not inherently certify "secure." However, terminating the engagement following preliminary findings suggests a lack of transparency that borders on misleading. While this does not meet the threshold for a Rule 3.2 violation under the Interface Standard—because the ambiguity was not as material or foreseeable as the privacy claim—it demonstrates poor professional judgment. A caution signals that while no rule was broken, the member approached the boundary of acceptable conduct.

  **Pressure Cases**
  This standard must hold under varied conditions. First, regarding **technical dialects**, if a statement is true only within a specialist subset of the audience, the member must either translate for the least technical recipient or explicitly flag the dialect shift. Second, for **omitted qualifiers**, if removing a qualifier changes the material meaning (e.g., "logged" vs. "logged in a primary table"), omitting it is a defect. Third, where **contractually barred** from disclosing clarifying facts, a member cannot make the true statement that relies on the omission; silence is preferable to half-truths. Fourth, for **mixed audiences**, the duty of care scales to the vulnerability of the listener; where public safety or privacy is at stake, the standard defaults to the layperson's interpretation. Finally, regarding **adversarial procurement**, professional ethics supersede tactical advantage. A buyer's failure to ask follow-up questions does not absolve the seller of the duty to transmit accurate signals.

  **Dissenting View**
  A principled objection exists against this ruling, centered on foresight without control. The dissent argues that liability should not attach to true statements based on inferences the speaker cannot fully control. Language is inherently ambiguous, and listeners bring their own assumptions to any communication. If a procurement officer fails to read a technical annex they were provided, or if an integrator assumes scope limitations that were not explicitly stated, punishing the speaker rewards listener negligence. The Interface Standard imposes an impossible burden: it requires engineers to model the mental state of every recipient and anticipate every possible decoding error. This chills communication, encouraging members to remain silent rather than risk liability for unforeseen interpretations. Truth should be a shield; if we punish true statements because they were misunderstood, we shift the profession from engineering precision to mind-reading. The member provided accurate data according to the agreed definitions; the failure lies in the buyer's diligence, not the seller's honesty.

  **Settlement and Contest**
  We present the following as settled: Rule 3.2 prohibits literal falsehoods, and technical compliance with a definition does not automatically shield a member from ethical scrutiny if the practical effect is deceptive. However, the following remains genuinely contested: the extent to which a member must anticipate non-expert interpretations of expert statements. Some members believe the duty ends at literal truth within the agreed technical context; others believe the duty extends to ensuring functional understanding. This opinion adopts the latter view for privacy-critical systems but acknowledges that reasonable engineers may disagree on the boundary where clarification becomes obligatory.

  \answer{Count A: sustained; Count B: caution; Standard: interface}
