answer: |-
  Here is a teaching plan designed for your specific constraints, student profile, and pedagogical goals.

  ### 1. The Core Example: "Tibbles the Cat"
  Do not switch examples. Use **Tibbles the Cat** (a standard metaphysical placeholder for an ordinary organism).
  *   **Why:** It satisfies your Week 8 requirement (Animalism/Constitution) immediately. It is alive (distinguishes it from chairs), has parts that touch (cells/fur), has parts that might not (gut bacteria/scattered cells), and survives change (shedding fur/losing tail).
  *   **What it lacks:** It is not an artifact (avoids "human intention" bias) and not a mathematical object (avoids set theory confusion).
  *   **The Variation:** You will use three states of Tibbles:
      1.  **Assembled:** Tibbles sleeping on the mat (parts touching, functioning).
      2.  **Scattered:** Tibbles' atoms teleported to opposite ends of the room (parts not touching, same arrangement).
      3.  **The Tail:** Tibbles minus the tail (Tib).

  ### 2. The Sequence (80 Minutes)
  *Logic of Order:* You cannot ask *when* composition occurs until they know *what* composition is. You cannot know what composition is until they distinguish it from Identity and Set Membership. You cannot discuss the answers until the Grounding/Verbal trap is neutralized.

  #### **00:00 – 00:15: Distinctions (Identity, Sets, Composition)**
  *   **Goal:** Secure the conceptual ground before stating the SCQ.
  *   **Action:** Draw three circles on the board: **Identity**, **Set Membership**, **Composition**.
  *   **Move 1 (Identity):** Ask: "If I replace every cell in Tibbles, is it the same cat?" (Leave unanswered). "If I replace every letter in this word 'CAT', is it the same word?" Establish that $A$ can be composed of $B$ without $A$ being *identical* to $B$.
      *   *Misconception Check:* If they say the whole *is* the parts, you cannot do SCQ. Insist: The parts exist before the whole is formed. The whole is *one*; the parts are *many*. One $\neq$ Many.
  *   **Move 2 (Sets):** Address the Maths cohort immediately.
      *   *Say:* "For the mathematicians: Is Tibbles the *set* of his cells?"
      *   *Refutation:* A set is abstract and timeless. If a cell dies, the set changes members. If Tibbles loses a cell, Tibbles persists. A set cannot sit on a mat; a cat can. Composition is concrete; Sets are abstract. **Close this door now.**
  *   **Move 3 (Composition):** Define informally: "Composition occurs when some things (the parts) exist, and *because* they exist, something else (the whole) also exists."

  #### **00:15 – 00:25: Stating the SCQ & Neutralizing Grounding**
  *   **Goal:** State the Special Composition Question (SCQ) without letting them dissolve it via grounding.
  *   **The Trap:** They will say, "The particles exist; 'Tibbles' is just a grounded way of talking about them."
  *   **The Intervention:**
      *   *Say:* "Last week we did grounding. You might think: 'The particles exist, the 'cat' is just a dependent entity. No new ontology.'"
      *   *Counter:* "Nihilists don't say the cat is *grounded*. They say the cat **does not exist**. There are only particles arranged cat-wise. There is no *one thing* to be grounded."
      *   *Test:* "If I crush Tibbles, the particles remain. Did something go out of existence? If yes, composition was real. If no, it was just rearrangement."
      *   *State the SCQ:* "Necessarily, for any $X$s, do the $X$s compose something?"

  #### **00:25 – 00:50: The Three Live Answers (Develop Nihilism, Universalism, Moderatism)**
  *   **Goal:** Deep dive on three; name-and-drop the fourth (Brute).
  *   **Drop:** **Brute Composition.** Tell them: "Some say it just happens with no reason. We are ignoring this because it stops inquiry."
  *   **Develop 1: Nihilism (Nothing ever composes).**
      *   *Apply to Tibbles:* There are no cats. There are only "cat-particles."
      *   *Intuition Pump:* Why believe this? Simplicity. No vague boundaries (when does a pile become a cat?).
      *   *Cost:* Denies obvious truths ("I have a cat").
  *   **Develop 2: Universalism (Everything always composes).**
      *   *Apply to Tibbles:* The particles of Tibbles + the particles of the mat compose an object ("Tibbles-Mat").
      *   *Intuition Pump:* No arbitrary cut-offs. If particles exist, their fusion exists.
      *   *Cost:* Ontological extravagance (trillions of invisible objects).
      *   *Note:* This is your view. **Do not reveal yet.** Present it as "The Permissive View."
  *   **Develop 3: Moderatism (Composition only under conditions).**
      *   *Apply to Tibbles:* Particles compose a cat *only if* they are alive/stuck/functioning.
      *   *Intuition Pump:* Matches common sense.
      *   *Cost:* Vagueness. Where is the line? (Sorites).

  #### **00:50 – 01:00: Stress-Testing Moderatism (The Criteria)**
  *   **Goal:** Show why Moderatism is hard to defend without slipping into verbal disputes.
  *   **Activity:** Use the **Tibbles Variations**.
      1.  **Contact:** "If I shave Tibbles, do the hairs still compose part of him?" (Contact breaks, composition intuitively holds).
      2.  **Function:** "If Tibbles is in a coma, is he still a composite object?" (Function breaks, composition intuitively holds).
      3.  **Life:** "If Tibbles dies, does the composite cease to exist, or just become a corpse?" (If it ceases, composition is fragile. If it becomes a corpse, what changed?)
      4.  **Scattered (Crucial for Week 8):** "If I teleport Tibbles' atoms to different corners of the room, do they still compose Tibbles?"
          *   If **Yes**: Contact is not required.
          *   If **No**: Did Tibbles die? Or did he just scatter?
  *   **Misconception Check:** If they say "It depends on how we define 'Tibbles'", stop them. "We are asking if there is an *object* there, not if the word applies. Is there a *thing* in the corner?"

  #### **01:00 – 01:10: The Reveal (Instructor View)**
  *   **Goal:** Disclose Universalism without shutting down debate.
  *   **Strategy:** Frame it as the only view that avoids arbitrariness.
  *   **Say:** "I am a Universalist. Why? Because every condition for Moderatism (contact, life, function) has a counter-example (scattered objects, comas, broken watches). Nihilism denies too much. Universalism accepts strange objects but saves the logic."
  *   **Link to Week 8:** "If I am a Universalist, I believe the scattered atoms *do* compose an object. This matters for Week 8. If we replace your atoms, does the 'you-object' survive? Universalism says yes, because the new atoms compose an object just as the old ones did."

  #### **01:10 – 01:20: Assessment & The Refusal**
  *   **Goal:** Verify understanding and set boundaries.
  *   **The Refusal (Priority):**
      *   *Say:* "One question I am refusing to answer today: 'Are the parts more real than the whole?' (Priority). We are assuming the parts exist. We are asking if the whole *also* exists. Debating which is prior leads to Monism or Idealism, which kills the SCQ. We are doing pluralist metaphysics today. We assume the many; we ask about the one."
  *   **The Assessment Question:**
      *   *Write on board:* "A Nihilist and a Moderatist look at a pile of bricks. The Nihilist says 'No composite exists.' The Moderatist says 'A composite exists.'
      *   **Question:** Describe a specific change to the bricks that would force the **Moderatist** to change their mind and agree with the Nihilist, *without* destroying the bricks. What is the *truth-maker* for that change?"
      *   *Why this works:* It forces them to articulate the *condition* for composition (contact? bond? function?) rather than just saying "bricks exist." If they say "separate the bricks," you ask "how far?" If they say "break the bond," you ask "what is the bond?" It exposes the vagueness problem.

  ### 3. Misconception Management Map
  *   **"It's just grounding/verbal":** Head off at **00:15**. Insist on ontological commitment (existence vs. description).
  *   **"It's just a set":** Head off at **00:10**. Distinguish abstract membership from concrete parthood.
  *   **"Chairs obviously exist (Nihilism is silly)":** Head off at **00:25**. Acknowledge the cost, but emphasize the logical benefit (no vagueness).
  *   **"Things must be stuck together (Moderatism is obvious)":** Head off at **00:50**. Use the Scattered Tibbles case to break the contact intuition.
  *   **"The answer must be the same in every world":** Head off at **01:00**. When revealing Universalism, note that it is a necessary truth *if true*, but the *criteria* for Moderatism often shift contextually (which is a bug).

  ### 4. Why This Order?
  1.  **Identity/Sets first:** If they conflate composition with identity, the SCQ is meaningless ($X$ composes $X$?). If they conflate it with sets, they think the answer is trivial (sets always exist). You must clear these logical hurdles before doing metaphysics.
  2.  **Grounding second:** Since they just studied grounding, this is their default tool. You must show them that SCQ is about *existence*, not *explanation*, or they will disengage thinking they already know the answer.
  3.  **Answers third:** Only once the question is secure can you evaluate the answers.
  4.  **Refusal last:** Setting the boundary on Priority ensures they don't spend the week worrying about whether parts are "more real," which distracts from the composition relation itself.

  ### 5. Instructor Note on Universalism
  Since you are a Universalist, your risk is making Moderatism look too stupid to defend.
  *   **Correction:** When presenting Moderatism at 00:25, play devil's advocate strongly. "Common sense screams that there is a cat and not a 'cat-mat' hybrid." Make them feel the pull of Moderatism before you dismantle it with the Scattered Case. This validates their intuition before you challenge it.
