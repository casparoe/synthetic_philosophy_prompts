  5. **Consider dreams where ignition looks absent but experience is reported, versus imagery where ignition is present but weak. Which direction of mismatch is more damaging to your view?**
     **Follow-up:** Why that one? If you pick dreams, aren't you admitting broadcast isn't necessary; if you pick imagery, aren't you admitting it isn't sufficient?

  6. **If we built a system with a real global architecture—competition, capacity limits, widespread availability—would the theory have to count it as phenomenally conscious?**
     **Follow-up:** If you say it needs the right physical implementation, what happened to the functional claim that broadcast *is* the consciousness?

  7. **Here's a case: a stimulus ignites, broadcasts, sustains, and guides action perfectly, but the subject insists there was "nothing it was like." If you say they are conscious and misreporting, what must introspection be for that dismissal to be legitimate rather than just convenient?**
     **Follow-up:** If introspection can be wrong about the presence of phenomenality itself, isn't your theory unfalsifiable by first-person data?

  8. **Same case: perfect broadcast, subject insists no phenomenality. If you say this state isn't conscious, does anything recognizably global-workspace-ish remain?**
     **Follow-up:** If ignition and broadcast don't guarantee phenomenality, isn't the distinction between access and phenomenality back in force?

