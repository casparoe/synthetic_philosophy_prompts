          4.  **Opportunity Cost (EA):** Time spent worrying about lunch could be spent donating/advocating. (High damage to *action-guiding* force).
          5.  **Virtue/Integrity (Virtue Ethics):** Why reduce this to math? Isn't it about not complicity? (Medium damage - challenges framing, not conclusion).
          6.  **Signaling/Expressive (Virtue Ethics):** Does skipping actually signal anything if no one sees? (Medium damage).
          7.  **Threshold Uncertainty (EA):** You don't know *when* the threshold hits. (Medium/Low damage - admits uncertainty but keeps EV).

      *   *Re-evaluating Order:* The Climate PhD's objection is dangerous because it dismisses the whole project. The EA's supply chain objection destroys the specific mechanism. The Virtue crowd might not care about the math but could challenge the *moral significance* of the math.
      *   *Revised Order:*
