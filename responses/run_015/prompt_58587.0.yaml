          2.  Policy Distraction (Climate PhD) - Attacks the relevance.
          3.  Substitution/Waste (EA/General) - Attacks the causal link.
          4.  Opportunity Cost (EA) - Attacks the prioritization.
          5.  Complicity vs. Impact (Virtue) - Attacks the moral framework.
          6.  Probability Estimation (EA) - Attacks the numbers.
          7.  Collective Action Problem (General) - "Why you specifically?"

      *   *Wait, need to match the "Who in the room" constraint.*
      *   *Let's prioritize the "Damage" based on the user's thesis.* The thesis relies *heavily* on the 20kg lump mechanic. If that's wrong, the EV calculation collapses into near-zero. So EA objections on mechanics are highest damage. The Climate PhD is high damage because they might shut down the conversation entirely. The Virtue crowd is lower damage because they might agree with the conclusion (don't eat meat) even if they dislike the reasoning.

      *   *Refining the "Damage" score:*
          1.  **EA (Supply Chain):** "Suppliers don't order in fixed lumps." (Damage 5 - kills the model).
          2.  **Climate PhD (Systemic):** "This is neoliberal guilt-tripping." (Damage 5 - kills the room's interest).
          3.  **EA (Substitution):** "The chicken gets thrown out or eaten by someone else." (Damage 4 - kills the causal link).
          4.  **EA (Opportunity Cost):** "You could do more good elsewhere." (Damage 3 - shifts goalposts).
          5.  **Virtue (Complicity):** "Why does impact matter? It's about dirty hands." (Damage 3 - challenges framing).
          6.  **Virtue (Integrity):** "If no one sees, does it matter?" (Damage 2).
          7.  **EA (Probability):** "Your P is basically zero." (Damage 2 - conceded already).

      *   *Wait, I need to be decisive.* Tell the user what to concede.
      *   *Strategy:* Concede the numbers are fuzzy (EA), hold ground on the principle (EV > 0). Concede individual action isn't *enough* (Climate), hold ground on it being *necessary/part* of the solution. Concede virtue ethics is valid (Virtue), hold ground on EV adding to it rather than replacing it.

  5.  **Drafting the Content (Iterative refinement for tone):**
      *   *EA Tone:* Precise, slightly impatient, focused on magnitudes and probabilities.
      *   *Climate PhD Tone:* Structural, systemic, impatient with "lifestyle" focus.
      *   *Virtue Tone:* Normative, focused on character, complicity, expression.

      *   *Drafting Objection 1 (EA - Supply Chain):* "You're assuming a step-function supply chain. Real inventory management is fluid. You're modeling a cartoon canteen."
      *   *Drafting Objection 2 (Climate PhD - Systemic):* "This is exactly the kind of individual responsibility narrative fossil fuel companies want. It distracts from the policy fight."
      *   *Drafting Objection 3 (EA - Substitution):* "Even if you skip, the tray is prepared. It gets binning or eaten by a meat-eater who takes extra. No animals saved."
      *   *Drafting Objection 4 (EA - Opp Cost):* "Even if EV > 0, it's tiny. Time spent worrying here is time not spent on high-impact advocacy."
      *   *Drafting Objection 5 (Virtue - Complicity):* "Why are you justifying eating meat via probability? Isn't the point not to be complicit regardless of impact?"
      *   *Drafting Objection 6 (Virtue - Expressive):* "If you eat vegan in the canteen but no one knows, what virtue is being expressed?"
      *   *Drafting Objection 7 (EA - Threshold Knowledge):* "You don't know where the threshold is. You could be skipping forever and never hit it."

      *   *Refining Replies:* Need to be 90 seconds spoken. Need to identify "Soft spots".
      *   *Decisiveness:* Tell them to concede the "fixed lump" rigidity but argue for "batching" generally. Tell them to concede individual action isn't *sufficient* but deny it's *distraction*. Tell them to agree with Virtue ethics but say EV *supports* it.

  6.  **Final Review against Constraints:**
      *   Markdown table? Yes.
      *   Columns correct? Yes.
      *   7 objections? Yes.
      *   Ordered by damage? Yes.
      *   Specific audience voices? Yes.
      *   Decisive advice (concede/hold)? Included in reply/soft spot analysis.
      *   Nightmare question at end? Yes.

  7.  **Nightmare Question:** Something that combines the EA math critique with the Climate PhD's systemic critique to show the EV is actually negative. E.g., "What if your performative skipping signals to others that 'individual action is enough,' reducing their support for policy?" (The boomerang effect).

  8.  **Final Polish:** Ensure the tone is helpful but direct ("be decisive about it"). Make sure the replies sound like spoken language, not essay text.

  *(Self-Correction during drafting)*: Make sure I don't make the EA students sound *too* hostile. They are "nitpickers," not enemies. They want the math to hold. The Climate PhD is the one likely to be impatient. The Virtue crowd is friendly but might think the consequentialist framing is missing the point.

  *Damage Rating Calibration:*
  5 = Destroys the thesis.
