answer: |-
  This is a sharp observation. You have identified a friction point where applied ethics, law, and market behavior collide. The short answer is that there is no single, coherent moral theory driving pest control. Instead, there is a dominant **implicit framework** that is constantly being patched by **moral residue** and **market segmentation**.

  Here is the reconstruction of the implicit theory, the points of underdetermination, and the conditions under which this reading would fail.

  ### 1. The Core Theory: Relational Instrumentalism

  The baseline operating system of pest control is not that animals lack moral status, but that moral status is **relational** rather than intrinsic.

  In this framework, "pest" is not a biological category (ontological); it is a normative role (functional). A honeybee has high positive status in an apiary (livestock/pollinator), neutral status in a meadow (wildlife), and negative status in a wall cavity (pest). The animal's biology is identical; its moral standing flips based on its spatial and economic relationship to human property.

  **The Economic Threshold as Moral Logic**
  The "economic threshold" taught in extension programs is the purest expression of this. It is not merely accounting; it is a **utilitarian calculus with a restricted scope**.
  *   **The Theory:** The pest's interests (life, avoidance of pain) count, but they are lexically inferior to human economic interests.
  *   **The Mechanism:** We do not ignore the pest's suffering; we simply weigh it against crop loss. Because the pest is defined by its *harm* to the project, its negative utility is pre-loaded. The "threshold" is the point where the pest's negative utility outweighs the cost (financial and ethical) of killing it.
  *   **Implication:** This confirms that the pest *does* have a price. If it had zero status, the threshold would always be zero (kill immediately). The fact that we tolerate some damage before spraying implies we acknowledge a cost to killing, but one that is easily swamped by property rights.

  ### 2. The Legal Exemption: A Zone of Exception

  You asked whether cruelty-law exemptions presuppose *no status* or *overridden status*. The legal architecture suggests the latter, but operates like the former.

  If pests had **no status**, regulations on *how* you kill them would be unnecessary. Yet, even exempted pest control often has method restrictions (e.g., bans on strychnine or unrestricted glue traps in some jurisdictions, requirements for "quick kill").
  *   **The Implicit View:** This is a **State of Exception** (in the Agamben sense). The pest is included in the legal order solely through the possibility of being excluded. The law recognizes the animal is sentient (hence method restrictions exist) but grants the human actor **sovereign power** to override that sentience without due process.
  *   **Why the Exemption?** It is not ontological denial; it is **administrative efficiency**. To require a cruelty hearing for every mouse in a barn would paralyze the system. The exemption is a procedural shortcut, not a metaphysical claim. It says: "We assume the necessity of killing is already established by the 'pest' classification, so we skip the justification phase and move to the method phase."

  ### 3. The "Humane" Layer: Moral Residue and Indirect Duties

  This is where the system seems most contradictory. If the theory is Relational Instrumentalism, why do "humane" traps exist? Why relocate wasps?

  There are three competing explanations here, and practice oscillates between them:

  1.  **Indirect Duties (Kantian):** We treat pests humanely not for *their* sake, but for *ours*. Cruelty coarsens the human moral agent. The "humane" product is moral hygiene for the killer.
  2.  **Risk Mitigation (Regulatory):** If we normalize extreme cruelty for pests, it may spill over to protected animals (the "slippery slope" argument). Regulating pest methods protects the *category* of "animal," not the individual pest.
  3.  **Market Capture of Moral Anxiety:** This is the cynical but likely accurate view. The "humane" layer is not ethics; it is **premium pricing**. Consumers experience cognitive dissonance (I need to kill this, but I am a good person). "Humane" products resolve the dissonance without changing the outcome.

  **How it fits the Theory:** This layer does not contradict Relational Instrumentalism; it supplements it. It acknowledges that while the pest's *life* can be overridden, its *suffering* creates a negative utility for the human observer. Minimizing suffering is often cheap (a snap trap costs little more than a poison), so the "humane" option is adopted as a low-cost way to reduce moral friction without sacrificing the primary goal (exclusion/killing).

  ### 4. Underdetermination: Where Rival Theories Converge

  You asked to be upfront about where the practice is underdetermined. This is critical. You cannot derive the current practice from a single moral theory because **three distinct moral theories all license the exact same behavior.**

  *   **Rule Utilitarianism:** Supports the economic threshold (maximize overall yield/welfare). Supports humane methods (reduce net suffering). Supports legal exemptions (administrative efficiency maximizes utility).
  *   **Moderate Contractualism:** Pests cannot be parties to the social contract. However, we have duties of "humanity" to non-participants. We can remove them for safety/property (self-defense), but we shouldn't torture them unnecessarily.
  *   **Relational Instrumentalism (The Status Quo):** Pests are defined by conflict. Conflict justifies removal. Manners dictate the method.

  **The Underdetermination:** Because all three theories yield "Kill them if they cost money, but use a snap trap instead of glue," the actual practice of pest control **does not prove** which theory is dominant. A pest control operator behaves identically whether they are a secret Utilitarian or a secret Speciesist. The system is robust precisely because it is philosophically ambiguous.

  ### 5. What Would Change My Mind (Falsification Conditions)

  My reconstruction is that the system is **Relational Instrumentalism patched by Moral Residue**. Here is what would falsify that reading:

  **A. Evidence of Intrinsic Negative Status**
  If legislation were passed stating that Species X (e.g., rats) must be eradicated *regardless* of economic threshold or immediate threat (e.g., "Kill all rats on sight, even in uninhabited fields"), this would suggest **Ontological Evil**. It would imply the animal has negative moral value intrinsically, not just relationally. Currently, laws generally target *nuisance* behavior, not existence. If we moved to existence-based eradication mandates, my "Relational" theory would collapse.

  **B. Evidence of Positive Rights in Conflict Zones**
  If courts began ruling that a farmer *cannot* spray because a specific endangered insect (even a crop-eater) has a right to life that outweighs the farmer's livelihood, the "Lexical Priority" of human property would be broken. Currently, endangered species acts protect *some* pests, but usually via subsidy (pay the farmer not to spray), acknowledging the farmer's right to profit is still valid. If the law simply *forbade* the spray without compensation, it would imply the animal has intrinsic status independent of its relationship to us.

  **C. The "Hedgerow" Test**
  My theory relies on the "rat in the barn vs. rat in the field" distinction. If we found that moral intuition and law treat the rat in the field as having *significantly* higher status than the rat in the barn, my theory holds. If, however, we find that people support poisoning rats in the field *just as readily* as in the barn (absent economic gain), then the category "Pest" is biological, not relational. (Current data suggests the former: we generally tolerate field mice more than house mice, supporting the relational view).

  ### 6. Where My Reading Might Be Wrong

  I am likely over-intellectualizing the "Humane" layer.

  **The "Accident" Hypothesis:** It is possible there is no implicit theory at all. The "Economic Threshold" comes from 1950s agronomy. The "Cruelty Exemptions" come from 19th-century property law. The "Humane Products" come from 21st-century marketing. They are stapled together because they evolved in different silos (USDA, State Legislatures, Private Market).
  *   **The Risk:** If this is true, looking for a "theory of moral status" is a category error. The inconsistency isn't a philosophical tension; it's just bureaucratic drift.
  *   **Why I resist this:** Even accidents settle into equilibrium. If the "humane" market were truly at odds with the "economic" logic, it would have been regulated away or priced out. The fact that it persists suggests it serves a function within the system (reducing moral friction for the killer).

  ### Summary

  The implicit theory is **Relational Instrumentalism with a Humaneness Constraint**.
  1.  **Status:** Conferred by relationship to human property, not biology.
  2.  **Decision:** Lexical priority to human economic interest (Economic Threshold).
  3.  **Method:** Constrained by human moral comfort and regulatory risk management (Humane layer), not animal rights.
  4.  **Law:** Treats pests as being in a "zone of exception" where normal due process is suspended for efficiency, assuming necessity is pre-proven by the "pest" label.

  The system holds together not because it is logically consistent, but because it is **pragmatically stable**. It allows the killer to maintain a self-conception of morality ("I'm not cruel, I'm necessary") while achieving the instrumental goal ("The pest is gone"). An opponent could break this reading by showing that pest control decisions are made *against* economic interest purely out of animus (proving ontological hatred) or *for* the pest *against* economic interest without subsidy (proving intrinsic rights). Neither is currently the norm.
