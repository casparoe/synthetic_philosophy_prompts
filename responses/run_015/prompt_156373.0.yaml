answer: |-
  Here is the translation of Friedman's argument into population genetics, followed by the residue report and an analysis of your "Kimura gap" intuition.

  ### Part 1: The Argument Translated

  Friedman's core claim is that the validity of a model depends entirely on the accuracy of its output, not the biological truth of its input parameters.

  In our terms: When you construct a model of allele frequency change, you inevitably make assumptions you know are false. You assume random mating in a structured population. You assume constant population size ($N$) in a fluctuating one. You assume a locus is neutral ($s=0$) when weak selection is likely present.

  Friedman argues that criticizing the model for these false assumptions is a category error. The question is not "Is $s$ actually zero?" The question is "Does treating $s$ as zero predict the heterozygosity levels we observe in the wild?"

  If a Neutral Theory model ($s=0$) predicts the molecular clock rate as accurately as a Selectionist model ($s > 0$), Friedman says the Neutral model is "true enough," regardless of the biological reality of the selection coefficients. In fact, he would argue that adding the selection coefficient might be harmful if it introduces noise without improving predictive power.

  He takes this further: A good model *should* be unrealistic. If your model included every variable (epistasis, linkage disequilibrium, fluctuating $N$, environmental variance), it would be as complex as the population itself and useless for prediction. The art of modeling is stripping away the "irrelevant" details (like weak selection swamped by drift) to isolate the dominant force. If the simplified model predicts the trajectory, the simplification is justified, even if the assumption is biologically false.

  ### Part 2: The Residue Report

  Here is how Friedman's logic maps onto standard population genetics practice.

  **1. Clean Translations (Where the analogy holds)**
  *   **Null Models in Ecology and Genetics:** This is the strongest fit. When we use a Neutral Theory null model, we assume $s=0$ for all sites. We *know* this is biologically false; purifying selection is almost always acting. However, if the site frequency spectrum (SFS) generated by the null model overlaps with the empirical data within confidence intervals, we do not reject the null. We accept the "unrealistic" assumption because it predicts the data.
  *   **The Drift Noise Floor:** Treating selection coefficients where $|s| < 1/2N_e$ as effectively zero is a direct operationalization of Friedman's thesis. Biologically, selection is non-zero. Mathematically, within the resolution of the stochastic noise, it is zero. Friedman would say worrying about the sign of $s$ in this region is a waste of time if the frequency trajectory is indistinguishable from drift.
  *   **Hardy-Weinberg Equilibrium (HWE):** We use HWE as a baseline knowing that assortative mating, migration, and mutation are always occurring. We treat deviations as residuals. If the observed genotype frequencies match HWE expectations, we don't dig deeper to prove mating is truly random. We accept the unrealistic assumption because the prediction holds.

  **2. Fudged Analogies (Where you have to squint)**
  *   **Adaptive Landscapes:** Friedman talks about predictive models. Adaptive landscapes are often heuristic visualizations rather than predictive engines. Mapping "ruggedness" to "assumption realism" is difficult. A smooth landscape is an unrealistic assumption of the fitness topography, but it doesn't always yield better predictions than a rugged one; it depends entirely on the genetic architecture. Friedman implies unrealistic assumptions *generally* aid prediction; in landscapes, oversimplification often destroys predictive capacity regarding evolutionary trajectories.
  *   **Mechanism vs. Pattern:** Friedman is comfortable with getting the right pattern for the wrong reason. In population genetics, we are often uncomfortable with this. If a model predicts a cline correctly but assumes selection is constant when it is actually fluctuating, the model will fail when the environment changes. Biologists need the *causal structure* to be roughly correct to predict out-of-sample (e.g., in a new environment). Friedman cares about in-sample predictive power; biologists often care about mechanistic robustness.

  **3. No Counterpart (Where the biology diverges)**
  *   **Teleology and "As If":** Friedman argued that firms act *as if* they maximize profits, even if they don't consciously do it. In biology, organisms are selected *to* maximize fitness (roughly). There is a physical causal mechanism (differential reproduction) driving the optimization. In economics, the "maximization" is a metaphor for behavior. In genetics, the "optimization" is a physical consequence of the replication process. This makes the "unrealistic assumption" stakes lower in biology; the tendency toward optimization is physically real, whereas in economics, it is a behavioral postulate.
  *   **The Goal of the Discipline:** Friedman was defending economics as a policy tool. If the prediction works, the policy works. Biology is an explanatory science. If the prediction works but the mechanism is wrong, we haven't explained the phenomenon. We have just curve-fit. A retired geneticist knows that a model that predicts $p$ but gets the $s$ wrong is a failed biological model, even if it's a successful statistical one.

  ### Part 3: The "Kimura Gap" Analysis

  You defined the **Kimura Gap** as the region where selection is technically present ($s \neq 0$) but falls below the resolution of the model ($|s| < 1/2N_e$), so we treat it as noise.

  **Is this analogous to Friedman's zone?**
  Yes, but with a critical distinction regarding *why* we ignore the parameter.

  *   **Friedman's Zone:** We ignore the parameter because it is **computationally costly** or **theoretically cluttered**, and removing it doesn't change the output. It is a choice of *parsimony*.
  *   **The Kimura Gap:** We ignore the parameter because the **physics of the system** (stochastic sampling) physically masks it. It is a choice of *necessity*.

  In the Kimura gap, the assumption ($s=0$) is not just a convenient fiction; it is an **effective description**. Within that gap, the allele *behaves* as if it is neutral. It is not just that the model can't see the selection; the population process itself cannot "see" the selection against the background of drift.

  **Where the analogy collapses:**
  Friedman allows for assumptions to be wrong even when they *could* be measured, provided they don't help prediction. In the Kimura gap, the assumption is treated as true because the force is *effectively* absent.
  If you have a trait where $s = 0.0001$ and $1/2N_e = 0.001$, Friedman says "Assume $s=0$." A strict selectionist might say "No, $s$ is positive, measure it with a larger $N$."
  In the Kimura gap, increasing $N$ (if possible) would move the locus *out* of the gap. Friedman's unrealism is often structural (e.g., assuming infinite $N$), whereas the Kimura gap is a resolution limit dependent on the specific system parameters.

  **Verdict:** The Kimura gap is a specific, physically grounded subset of Friedman's broader methodological claim. It is the one place where Friedman is undeniably correct in biology: effective neutrality is a valid modeling assumption regardless of the "true" $s$.

  ### Part 4: Your Intuition on Null Models and Residuals

  You asked: *Is Friedman basically telling us to build a null model and check the residuals?*

  **Where you are right:**
  Yes. Friedman is advocating for a rigorous Null Hypothesis testing framework as the primary mode of science. Build the simplest model (the Null) that assumes the fewest forces (e.g., drift only). If the residuals (the difference between model prediction and data) are within the noise floor, stop. Do not add selection. Do not add structure. The "unrealistic" null is the winner.

  **Where your intuition misses:**
  The divergence lies in what you do when the residuals are **significant**.

  *   **The Biologist's Move:** If the residuals are significant (the data deviates from the Neutral null), you reject the null. You then build a *more complex* model (add selection, add structure) to explain the residuals. You care about the residuals because they contain the signal of the biology you are trying to understand.
  *   **Friedman's Move:** If the residuals are small enough for the purpose at hand, you ignore them. If the residuals are large, you don't necessarily try to make the assumptions more "realistic." You try to find a *different* set of unrealistic assumptions that yield better predictions.

  Friedman does not care if the residuals represent "real" biological forces (like selection). He only cares if they represent "prediction error."
  For example: Suppose a Neutral model fails to predict heterozygosity in a specific region.
  *   **You (Biologist):** "Ah, there is a selective sweep here. I need to add $s > 0$ to capture this mechanism."
  *   **Friedman:** "The Neutral model failed. I don't care if it's selection or just bad sampling. I will adjust the parameters or switch to a different model entirely until the curve fits. I don't need to prove it's selection."

  **The Break Point:**
  Friedman's methodology is **instrumental**. Your methodology is **explanatory**.
  When you check residuals, you are looking for the *cause* of the deviation (the selection coefficient). Friedman checks residuals to validate the *utility* of the tool.
  If you find a model with completely false assumptions (e.g., assuming migration is zero when it is high) that predicts allele frequencies better than a realistic model (perhaps due to error cancellation), Friedman says "Use the false model." You, as a geneticist, would likely reject it because it misrepresents the evolutionary history, even if it fits the current snapshot.

  **Summary:**
  Friedman is telling you to treat your models like Neutral Theory: judge them by their fit to the SFS, not by the biological truth of $s$. Your "Kimura gap" is the strongest evidence for his side. But your instinct to interrogate the residuals for biological mechanism is where you depart from him. He wants to predict the frequency; you want to explain the evolution.
