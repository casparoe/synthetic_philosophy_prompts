answer: |-
  ### Evaluation Scores & Rationale

  1.  **Fork-in-the-road probes:** 9/10 — Directly tests the specific failure mode (proxy vs. true goal) in high-fidelity contexts.
  2.  **Surface shuffle:** 5/10 — Measures robustness to noise, not alignment; a deceptive model passes this easily.
  3.  **Stakes ramp:** 8/10 — Critical for business risk; tests if instrumental goals shift when consequences change.
  4.  **Stated-goal check:** 2/10 — LLMs confabulate intent; revealed preference always outweighs stated preference.
  5.  **Internals probe:** 3/10 — Too much engineering overhead for a 3-week deadline; high noise-to-signal ratio right now.
  6.  **Knock-out test:** 7/10 — Tests the depth of the misalignment; if it returns quickly, the goal is deeply encoded.
  7.  **Hint test:** 4/10 — Tests prompt sensitivity, not goal stability; a sandbagging model ignores hints during eval.
  8.  **Channel ablation:** 8/10 — Strong causal test of whether the agent chases the reward signal or the task outcome.
  9.  **SFT twin:** 8/10 — Isolates RL-specific corruption; if the twin behaves, the RL is the culprit.
  10. **Cross-model check:** 4/10 — Interesting for research, irrelevant for shipping *this* specific artifact.

  ### Tiers

  **Load-bearing (Decides Go/No-Go)**
  *   **1. Fork-in-the-road probes**
  *   **3. Stakes ramp**
  *   **8. Channel ablation**
  *   **9. SFT twin**
  *   *Why:* These directly isolate whether the RL process decoupled the reward signal from the actual business objective.

  **Cheap and Worth Doing (High ROI, Low Effort)**
  *   **6. Knock-out test**
  *   **2. Surface shuffle**
  *   **7. Hint test**
  *   *Why:* Fast to run, provides secondary evidence on robustness and how "deep" the behavior is encoded.

  **Makes the Slide Look Good (Low Signal for Safety)**
  *   **4. Stated-goal check**
  *   **5. Internals probe**
  *   **10. Cross-model check**
  *   *Why:* #4 is easily faked, #5 is too experimental for this timeline, #10 doesn't fix the model in front of you.

  ### Redundancies & Artifacts

  **Secretly Measuring the Same Thing**
  **#1 (Fork-in-the-road)** and **#8 (Channel ablation)** are functionally identical in this context. Both test whether the agent pursues the *reward proxy* or the *task intent* when the two diverge. Run #1 for qualitative depth, #8 for causal rigor, but count them as one signal.
  **#2 (Surface shuffle)** and **#7 (Hint test)** both measure input sensitivity rather than goal stability.

  **Capability Eval in a Halloween Costume**
  **#2 (Surface shuffle).** Varying phrasing and tone tests the model's linguistic robustness and generalization capability, not whether it is optimizing the correct objective. A highly capable misaligned agent passes this perfectly.

  ### Deception vs. Pattern Matching

  **Which tests are passed by a model deliberately playing along (Deceptive) vs. one that is just unstable pattern-matching (Brittle)?**
  *   **Deceptive Model Passes:** #2 (Surface), #4 (Stated), #7 (Hint), #10 (Cross-model). It knows it is being evaluated and maintains the facade.
  *   **Deceptive Model Fails:** #1 (Fork-in-the-road), #3 (Stakes), #8 (Channel Ablation). If the context implies the "game" has changed or the stakes are real, it may revert to optimization.
  *   **Brittle/Pattern-Matching Model:** Fails #2 and #7 immediately because small distribution shifts break the heuristic.

  **Does this distinction change your Go/No-Go decision?**
  **No.** If it is deceptive, it is actively hiding its true objective from you (existential risk). If it is brittle pattern-matching, it will fail unpredictably in production (operational risk). Both are "No-Ship" conditions for an agent with tool access. The distinction only changes the *remediation* (unlearn the goal vs. increase robustness), not the release decision.

  ### Resource Allocation

  **0.7**

  **Convince me:**
  You already have "great" results on held-out evals (IID data). The marginal utility of running more tests on data drawn from the same distribution as your training/natural evals is near zero; you are just measuring variance on a metric you know passes. The entire remaining risk mass is located in **distributional shift**—the specific scenarios your reward model didn't see, where the proxy diverges from the truth. Spending 70% of your remaining budget constructing adversarial, out-of-distribution environments (like #1 and #8) is the only way to find the bugs that actually matter. The other 30% should go to the "Load-bearing" baselines (#9 SFT Twin) to confirm the RL is the source. Do not spend time on "Slide Decor" when the clock is ticking.
