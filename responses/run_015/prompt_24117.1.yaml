  1. Introduction (Definitions & Shared Ground).
  2. The Locus of Sensitivity (Attributor vs. Subject).
  3. Semantics (Contextualism vs. Invariantism).
  4. Metaphysics (Purism vs. Impurism).
  5. The "Cross-Context" Test (The smoking gun for substantive difference).
  6. Conclusion.

