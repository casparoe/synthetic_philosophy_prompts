answer: |-
  The debate between **epistemic contextualism** and **pragmatic encroachment** is one of the most significant in contemporary epistemology. While both views emerge from the same data (typically "Bank Cases" or skeptical puzzles) and predict the same intuitive outputs in standard scenarios (knowledge is attributed in low-stakes contexts but denied in high-stakes ones), they offer fundamentally different explanations for *why* this happens.

  To answer your specific question: **The difference is substantive, not merely locational.** While the views differ on where context-sensitivity is located (in the conversational context vs. the subject's practical situation), this locational difference entails divergent commitments regarding the semantics of knowledge attributions, the metaphysical nature of knowledge, and the relationship between belief and action.

  Here is a detailed comparison of the two views and an analysis of their substantive disagreements.

  ---

  ### 1. Core Definitions and Shared Motivation

  Both views attempt to solve the problem of **shifting knowledge intuitions**. Consider the classic "Bank Case":
  *   **Low Stakes:** Hannah has a check to deposit. It doesn't matter much if the bank is open Saturday. She says, "I know the bank is open."
  *   **High Stakes:** Hannah has a large bill due Monday; if the check bounces, she is ruined. Facing the same evidence, she says, "I don't know the bank is open."

  **Epistemic Contextualism (EC)** holds that the word "knows" is context-sensitive. Its semantic content shifts depending on the **attributor's** conversational context (e.g., how strict the standards of evidence are in the conversation).
  **Pragmatic Encroachment (PE)** holds that knowledge itself is sensitive to practical factors. Whether a subject knows depends on the **subject's** practical stakes, regardless of the conversational context.

  ### 2. The Locus of Sensitivity: Attributor vs. Subject

  The most immediate difference is *whose* context matters.

  *   **Contextualism (Attributor-Sensitivity):** For the contextualist, what matters is the context of the person *saying* "S knows." If a philosopher is discussing skepticism in a seminar (high standards), she cannot truthfully say "Hannah knows," even if Hannah is in a low-stakes situation. Conversely, if Hannah is in a high-stakes situation, but a casual observer in a low-stakes conversation says "Hannah knows," the observer speaks the truth.
  *   **Pragmatic Encroachment (Subject-Sensitivity):** For the encroacher, what matters is the context of the *subject* (Hannah). If Hannah's stakes are high, she does not know, full stop. It does not matter if a casual observer in a low-stakes conversation claims she knows; that observer is simply mistaken.

  **Why this is substantive:** This creates a divergence in truth conditions for knowledge attributions made by third parties. If the difference were merely verbal, both theories would agree on the truth value of third-party claims. They do not.

  ### 3. Semantics: Indexicality vs. Invariantism

  The disagreement extends to the philosophy of language and the semantics of "knows."

  *   **Contextualism is Semantic Contextualism:** It claims "knows" functions like an indexical (e.g., "I," "here," "tall"). The proposition expressed by "S knows that p" changes depending on the context of utterance. In a low-standards context, the sentence expresses a proposition requiring weak evidence; in a high-standards context, it expresses a different proposition requiring strong evidence.
  *   **Pragmatic Encroachment is typically Invariantist:** Most proponents of PE (often labeled *Subject-Sensitive Invariantists*) argue that the semantic content of "knows" is stable. The word means the same thing in every context. However, the *conditions* for satisfying that meaning include practical factors.

  **Why this is substantive:** This affects how we understand disagreement.
  *   **Under EC:** If I say "Hannah knows" (low standards) and you say "Hannah doesn't know" (high standards), we are not contradicting each other. We are asserting different propositions, much like one person saying "It is raining here" (London) and another saying "It is not raining here" (Sydney).
  *   **Under PE:** If I say "Hannah knows" and you say "Hannah doesn't know" (because her stakes are high), we are genuinely contradicting each other. One of us is objectively wrong.

  ### 4. Metaphysics: Purism vs. Impurism

  Perhaps the deepest substantive disagreement concerns the nature of knowledge itself.

  *   **Contextualism Preserves Purism:** Traditional epistemology holds that knowledge is a **purely epistemic** relation. Whether you know depends only on truth-conducive factors (evidence, reliability, justification), not on practical interests. Contextualism saves this intuition by arguing that practical stakes only affect our *talk* about knowledge, not knowledge itself. Hannah's epistemic position remains constant; only the label "knows" shifts.
  *   **Pragmatic Encroachment Embraces Impurism:** PE rejects purism. It argues that knowledge is **impure**; practical interests are partly constitutive of knowledge. Two subjects can have identical evidence and identical belief in the same proposition, yet one knows and the other does not, solely because their practical stakes differ.

  **Why this is substantive:** This changes the architecture of epistemology. If PE is true, epistemology cannot be studied in isolation from decision theory and ethics, because practical rationality partly determines epistemic status. If EC is true, epistemology remains the study of purely truth-related norms, while pragmatics handles the variation in attribution.

  ### 5. The "Cross-Context" Test

  The substantive nature of the disagreement is best illustrated by a **cross-context case**, where the subject's stakes and the attributor's standards come apart.

  **Scenario:** Hannah is in a **High-Stakes** situation (bill due, penalty if bounced). However, an Attributor is in a **Low-Stakes** conversational context (casually discussing Hannah's finances, no stakes for the Attributor). The Attributor says: "Hannah knows the bank is open."

  *   **The Contextualist Verdict:** The Attributor speaks **truthfully**. Because the Attributor's context sets low epistemic standards, the word "knows" requires only weak evidence. Hannah meets that weak standard. The fact that Hannah is stressed about her bill is irrelevant to the truth of the Attributor's claim.
  *   **The Pragmatic Encroachment Verdict:** The Attributor speaks **falsely**. Knowledge depends on Hannah's stakes. Since Hannah is in a high-stakes situation, her evidence is insufficient for knowledge. Therefore, the proposition "Hannah knows" is false, regardless of how casual the Attributor's conversation is.

  ### Conclusion

  Is the difference merely about where context-sensitivity is located? **No.**

  While the locational difference (attributor's conversation vs. subject's stakes) is the mechanism of the divergence, the implications are metaphysical and semantic.
  1.  **Semantically,** one view treats "knows" as shifting content (contextualism), while the other treats it as stable content with shifting truth conditions (invariantism).
  2.  **Metaphysically,** one view preserves the idea that knowledge is purely a matter of evidence (purism), while the other argues that knowledge is partially constituted by practical interests (impurism).
  3.  **Logically,** they disagree on whether speakers in different contexts are talking past each other or genuinely contradicting one another.

  Therefore, the debate is not a verbal dispute about labeling. It is a substantive disagreement about whether the norms of belief are insulated from the stakes of action, and whether the semantics of our epistemic language reflect the world or our conversation about it.
