prompt: |-
  Compare epistemic contextualism — the view that whether a subject knows that p depends on the conversational context in which the attribution is made — with pragmatic encroachment — the view that the practical stakes or interests at issue affect whether the subject knows that p. Both views predict that a subject may be credited with knowing that p in a low-stakes setting but not in a high-stakes one. Given this overlap, what exactly do the two views disagree about? In particular, is the difference between them substantive, or is it merely a difference about where the context-sensitivity is located — in the conversational context on the one hand, and in the practical situation on the other?
reasoning: |-
  Here's a thinking process that leads to the comparison between epistemic contextualism and pragmatic encroachment:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Compare Epistemic Contextualism (EC) vs. Pragmatic Encroachment (PE).
      *   **Core Claim of EC:** Knowledge attributions ("S knows that p") depend on the *conversational context* of the attributor.
      *   **Core Claim of PE:** Knowledge itself (the truth conditions of "S knows that p") depends on the *practical stakes/interests* of the subject (or sometimes the attributor, but usually the subject).
      *   **Shared Prediction:** Both explain why we deny knowledge in high-stakes cases (e.g., Bank Cases) but attribute it in low-stakes cases.
      *   **Key Question:** What exactly do they disagree about? Is the difference substantive (metaphysical/semantic) or merely locational (where context-sensitivity resides)?

  2.  **Initial Definitions & Clarifications:**
      *   *Epistemic Contextualism (EC):* The semantic content of "knows" shifts. In a low-standards context, "knows" means something weaker (easier to satisfy). In a high-standards context, "knows" means something stronger (harder to satisfy). The *subject's* actual epistemic position might remain constant, but the *word* "knows" changes meaning.
      *   *Pragmatic Encroachment (PE):* The semantic content of "knows" is stable (invariantist), *but* the truth conditions for knowledge include practical factors. Knowledge is not purely epistemic; it's partly pragmatic. If stakes go up, the epistemic bar for *knowledge itself* goes up.
      *   *The "Bank Case" (Keith DeRose/John Hawthorne/Jason Stanley):* Hannah and Sarah want to deposit a check. Friday: Low stakes (just saving fees). Hannah says "I know the bank is open." Saturday: High stakes (bill due, penalty if bounced). Hannah says "I don't know."
          *   EC says: "Knows" meant different things on Friday vs. Saturday.
          *   PE says: "Knows" meant the same thing, but Hannah's epistemic position wasn't strong enough for Saturday's stakes.

  3.  **Identify the Core Disagreement:**
      *   Is it just about *where* the context sensitivity is?
          *   EC: Sensitivity is in the *semantics of the attribution* (attributor context).
          *   PE: Sensitivity is in the *nature of knowledge itself* (subject's practical situation).
      *   Is this merely verbal? No, it has substantive implications for the nature of knowledge, the relationship between belief/action, and the semantics of language.

  4.  **Brainstorming Key Points of Divergence:**
      *   **Semantics:** Contextualism = Indexicalism/Relativism about "knows". Encroachment = Invariantism (usually) + Pragmatic conditions on knowledge.
      *   **The Subject vs. The Attributor:** EC focuses on the person *saying* "S knows." PE focuses on the person *acting* (S). *Correction:* Some versions of EC focus on the subject's context, but standard DeRose-style EC focuses on the attributor's conversational context. PE focuses on the subject's stakes.
      *   **Truth Conditions:**
          *   EC: The proposition expressed by "S knows p" changes.
          *   PE: The proposition is the same, but its truth depends on practical factors.
      *   **Disagreement Data:** If I say "You know" (low stakes) and you say "I don't know" (high stakes), are we contradicting each other?
          *   EC: No, we are talking past each other (different meanings).
          *   PE: Yes, we are contradicting (same meaning, different truth values based on stakes).
      *   **The "Purely Epistemic" Intuition:**
          *   EC preserves the idea that knowledge is purely epistemic (evidence/justification), but our *talk* about it varies.
          *   PE rejects the idea that knowledge is purely epistemic. Practical interests partly constitute knowledge.

  5.  **Structuring the Essay/Response:**
      *   **Introduction:** Define both views clearly. Acknowledge the shared motivation (solving skeptical puzzles/Bank Cases). State the thesis: The difference is substantive, concerning the semantics of "knows" and the metaphysical nature of knowledge.
      *   **Point 1: The Locus of Variability (Attributor vs. Subject):**
          *   EC: Variability lies in the *attributor's* conversational context (standards).
          *   PE: Variability lies in the *subject's* practical environment (stakes).
          *   *Crucial Test Case:* What if the subject has high stakes but the attributor is in a low-stakes conversation?
              *   EC: Attributor can truthfully say "S knows."
              *   PE: Attributor would be false saying "S knows" (because S doesn't know).
      *   **Point 2: Semantics (Indexicality vs. Invariantism):**
          *   EC: "Knows" is context-sensitive (like "tall" or "here").
          *   PE: "Knows" is semantically stable; the *property* of knowledge is sensitive.
      *   **Point 3: The Nature of Knowledge (Purely Epistemic vs. Pragmatic):**
          *   EC: Saves "Purism" (knowledge depends only on truth-related factors).
          *   PE: Embraces "Impurism" (knowledge depends on practical factors).
      *   **Point 4: Disagreement and Retraction:**
          *   How do they handle cases where people disagree about knowledge?
      *   **Conclusion:** Summarize. It's not just a verbal dispute; it changes how we understand the relationship between mind, world, and action.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Nuance on EC:* There are different types of contextualism. Subject-sensitive contextualism exists but is rare. Standard EC is *attributor* contextualism. I must make sure to distinguish this clearly from PE, which is often called *Subject-Sensitive Invariantism* (SSI).
      *   *Nuance on PE:* Does PE say the *meaning* changes? No, it says the *conditions* change. This is a semantic vs. metaphysical distinction.
      *   *The "Merely Locational" Question:* The prompt asks if it's merely about *where* the sensitivity is located. I need to argue that *where* it is located determines *what* knowledge is. If it's in the word, knowledge is stable. If it's in the world (stakes), knowledge is unstable. That's a substantive metaphysical difference.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Bank Case:* Hannah.
      *   *EC:* "Knows" on Friday $\neq$ "Knows" on Saturday. Hannah's evidence didn't change.
      *   *PE:* "Knows" on Friday $=$ "Knows" on Saturday. Hannah's evidence didn't change, but the *requirement* for knowledge changed because her stakes changed.
      *   *Cross-Context:* Attributor (Low Stakes) talking about Subject (High Stakes).
          *   EC: Attributor speaks truth ("Hannah knows").
          *   PE: Attributor speaks falsehood ("Hannah knows" is false because Hannah is in high stakes).
      *   *This proves it's not just verbal.*

  8.  **Final Polish:** Ensure philosophical terminology is accurate (Purism, Impurism, Invariantism, Indexicality). Make sure to directly answer the prompt's specific question about substantive vs. locational difference. (Verdict: It is substantive).

  9.  **Final Review against constraints:** The user wants a comparison, focusing on the disagreement and whether it's substantive. Keep it clear and analytical.

  *(Self-Correction during drafting)*: I should be careful not to conflate Pragmatic Encroachment with Subject-Sensitive Invariantism (SSI). They are often used interchangeably, but PE is the broader phenomenon, SSI is the specific semantic implementation. I will treat them as closely aligned for this comparison but focus on the core idea of stakes affecting knowledge.

