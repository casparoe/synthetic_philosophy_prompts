answer: |-
  Pain asymbolia proves that pain's badness is not an evaluative property represented by the experience but is constitutive of the motivational binding that couples noxious registration to first-personal urgency. Evaluative-content theories posit that pain sensation represents tissue damage while a separate evaluative component represents that damage as bad, implying asymbolics lack only the evaluative layer while retaining the sensory core. However, this dual-component view mistakenly reifies badness as a propositional attitude rather than a functional role, whereas the sensory-urgency account correctly identifies badness as the presence of aversive binding itself. Asymbolic patients retain noxious registration—they can discriminate intensity and location—yet lack the structural coupling that commands a motivational veto over competing plans, demonstrating that without binding, the sensation ceases to be bad rather than merely ceasing to be judged bad. This dissociation confirms that badness is not an independent layer appended to raw sensation but is identical to the integration of that signal within the subject's motivational architecture.

  The collapse objection fails because binding cannot be reduced to intensity, spatial location, or attentional capture. Intensity is insufficient because non-painful sensations like loud sounds or bright lights can be intense without issuing a motivational veto, and pain can be bad even at low intensities if the threat is significant. Spatial location is irrelevant because referred pain retains its badness despite misleading localization, and diffuse pain remains urgent without precise coordinates. Mere attentional capture is distinct because asymbolic patients can attend to the noxious stimulus without being motivated to avoid it, proving that attention does not necessitate urgency. Binding constitutes a specific mode of first-personal urgency because it functions as an imperative command that prioritizes the cessation of the stimulus over other goals, a functional role distinct from mere salience or discrimination.

  The precise point in this reasoning most vulnerable to falsification is the claim that aversive binding necessarily requires noxious registration as its substrate. I would abandon this position if empirical findings demonstrated intact binding with disrupted registration, such as patients exhibiting robust motivational avoidance behaviors and distress responses despite complete anesthesia or an inability to discriminate the sensory features of the stimulus. Such a finding would sever the constitutive link between registration and binding, proving that badness can exist independently of the sensory discrimination mechanism I claim it modifies.
