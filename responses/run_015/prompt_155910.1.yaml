answer: |-
  You are observing the canonical Knobe Effect interacting with two distinct boundary conditions: the **Moral Normativity Constraint** (which limits the effect to moral rather than conventional violations) and the **Agency-Responsibility Dissociation** (which separates intentional attribution from causal blame).

  Your first observation is not methodological error; it confirms the **Blame Hypothesis** over the Valence Hypothesis. The literature establishes that the effect is asymmetric: the "harm" condition elevates intentionality judgments above a baseline, while the "help" and "neutral" conditions remain at that baseline. This means moral badness drives the phenomenon, not moral goodness. Your dress code finding identifies the **Moral Normativity Constraint**: the effect requires violations of *moral* norms (harm, fairness) rather than *conventional* norms (dress codes, etiquette). While early debates questioned whether any norm violation sufficed, subsequent work confirms that conventional rules lack the requisite weight to trigger the intentionality shift unless participants personally moralize them.

  Your second observation maps the **Conceptual Boundary** of the effect. The asymmetry robustly appears in "thick" intentional action concepts (intentionally, knowingly, decided to) and prescriptive judgments (should fix, responsible), but it degrades or vanishes in "thin" descriptive concepts (caused, made happen, profit). This divides the phenomenon into **Folk Psychology Judgments** (which are permeable to moral influence) and **Causal/Descriptive Judgments** (which are more resistant). When you ask about causation, you are measuring a blend of physical causality and moral responsibility; when you ask about profit, you are measuring pure factual recall, which remains immune to moral valence.

  Your third observation reveals the **Agency-Responsibility Dissociation**. The label "Knobe Effect" strictly applies to attributions of *mental states* (intent, knowledge), which require a perceived mind (Theory of Mind). When you remove the human agent, intentionality attribution collapses because people refuse to attribute beliefs to algorithms. However, the tracking of harm/help in "responsibility" and "should fix" judgments persists because those are **Outcome-Based Responsibility** judgments, not mental state attributions. This is a separate but related phenomenon often discussed under **Algorithmic Aversion** or **Moral Typecasting**, where systems are held responsible for outcomes even when denied agency.

  **Boundaries and Definitions:**
  *   **In the Box:** Judgments of *intentionality*, *knowingness*, and *decision-making* regarding a *human agent* violating a *moral norm*.
  *   **Out of the Box:** Judgments of pure *causation*, *factual recall*, or *conventional rule-breaking* without moral weight.
  *   **The Dissociation:** When the agent is non-human, *intentionality* drops out (Out of the Box), but *responsibility/blame* remains (a neighboring effect driven by outcome bias rather than folk psychology).
