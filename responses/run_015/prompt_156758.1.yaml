answer: |-
  I made a promise to tell the truth.
  But truth can bring such sharp and sudden pain.
  What is the weight of words we speak aloud?
  Is there a default rule we should obey?
  Or will some context bring about defeat?
  And leave us standing in a heavy silence.

  Sometimes the kindest choice is keeping silence.
  I broke a promise just to spare you harm.
  Did virtue suffer here a strange defeat?
  Or did I stop the spreading of your pain?
  There is no default path for every step.
  The reason shifts its shape and changes weight.

  Without a fixed and steady moral weight,
  How do we teach the young to break their silence?
  They need a default guide to hold them fast.
  You cannot learn to keep a sacred promise
  If every case might multiply the pain.
  And turn what looks like right into defeat.

  That lesson ends in ultimate defeat.
  You map the terrain but you miss the weight.
  A rule might spare a child from feeling pain,
  But rules often demand a hollow silence.
  I keep a promise only when it fits.
  There is no default value in the act.

  So what we call a default is just habit.
  It saves us from the fear of moral defeat.
  I made a promise but the context shifted.
  The same fact loses all its former weight.
  Now words are better than a passive silence.
  And truth might stop the causing of more pain.

  We cannot simply measure out the pain.
  Nor find a default for each human choice.
  Sometimes we speak and sometimes choose silence.
  No map can save the traveler from defeat.
  The reasons shift their place and change their weight.
  Yet still I stand behind my word, my promise.

  To keep a promise or to spare the pain,
  No default carries such a heavy weight.
  Defeat or silence? Both remain to claim.
