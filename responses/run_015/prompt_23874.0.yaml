prompt: |-
  so in my IB Theory of Knowledge class we did this whole unit on philosophy of religion and watched a clip explaining Wittgenstein's take -- that religious belief isn't really a "hypothesis" you weigh evidence for, its more like its own language-game that only makes sense inside a whole form of life, with its own built in rules for what counts as making sense. my friend Dev latched onto this so hard and used it on me during an argument about his grandma, who thinks her praying literally changes what happens medically, after i said there's no evidence for that. his argument (which he is now extremely smug about) goes like this:

  1. religious language (God, sin, prayer working, whatever) only makes sense inside its own language-game, which is embedded in a form of life, and that language-game has its own internal rules for whats sensible or correct.
  2. there's no neutral outside standpoint from which you can judge one language-game by another one's rules -- forms of life are just "given," Wittgenstein says, not things you justify from some further out position.
  3. so you can't show grandma's belief that prayer changes medical outcomes is confused or unjustified by pointing at scientific evidence standards, because science is just a different language-game and its standards don't export over to other ones.
  4. this can't be special pleading for religion specifically -- it has to apply to ANY practice that hangs together as its own coherent form of life with its own internal rules, or Dev is just making an exception for the thing he happens to like.
  5. but that means an astrology practice, or a manipulative cult with its own internally consistent "grammar" of sin and purification, or honestly any sufficiently self-consistent scam, gets the exact same immunity from outside criticism, as long as its internally coherent by its own lights.
  6. that's clearly wrong though, we obviously can and do criticize cults and scams from outside their own framework, we don't think "well its coherent on its own terms" gets them off the hook.
  7. so either step 3 is wrong in general (Wittgenstein's picture doesn't actually block outside criticism the way Dev thinks it does), or something back in 1-4 has to go, and Dev is not willing to admit his grandma's belief and a cult's belief system are in the same boat.

  i feel like somethings going wrong around where he generalizes from "religion" to "any coherent practice," but i can't name the actual problem, and when i tried to push back Dev just said i was "still thinking scientistically," which felt like a dodge more than an answer. can you tell me which step is actually the weak link here, why it seems to hold up fine at first glance, and what it would cost Dev to give it up -- like does he still get to say grandma's belief is protected from science-style objections after that, or does he lose that too? and if you think the argument mostly works and there's no good way out for Dev's case either, i'd rather hear that straight than get a fake rescue.
