answer: |-
  Your intuition is spot on. While your roommate's notes capture the *spirit* of Bernard Williams' position, the technical phrasing—specifically regarding logic and contradictions—is misleading and arguably incorrect. It reads like a student's attempt to formalize Williams' somewhat anti-systematic views into a rigid argument, which ironically goes against Williams' own philosophical style.

  Here is a breakdown of what is accurate, what is a simplification, and what Williams actually denied, followed by an analysis of the logical flow.

  ### 1. What is Accurate
  *   **Ontological vs. Epistemic:** Williams definitely argues that moral dilemmas are **ontological** (real features of the moral world) rather than **epistemic** (just a result of our ignorance or confusion). He believes the conflict exists in reality, not just in our heads.
  *   **The Role of Regret:** The notes correctly identify that Williams uses **agent-regret** as a key piece of evidence. He argues that if an obligation were truly cancelled by a stronger obligation, feeling regret over not fulfilling it would be irrational. Since regret *is* rational (and inevitable), the unchosen obligation must have had genuine weight.
  *   **Critique of "Ought Implies Can":** Williams is skeptical of using the principle "Ought Implies Can" to dissolve dilemmas. He thinks this principle is often used by philosophers (like Kantians) to tidy up moral theory in a way that doesn't match lived experience.
  *   **Residual Force:** The idea that the unchosen obligation leaves a "remainder" or "residue" is core Williams. You don't walk away from a dilemma clean; you carry a moral scar.

  ### 2. What is a Common Simplification (or Conflation)
  *   **"Treats moral reasoning like physics":** Williams does critique moral theories that try to be too scientific or systematic (he often targets "moral geometry"), but this specific phrasing is likely a lecture shorthand. Williams' critique is more about the *psychological reality* of the agent versus the *abstract system* of the theorist.
  *   **The "Asymmetry Thesis":** This specific terminology is not standard Williams vocabulary. It is more commonly associated with philosophers like Ruth Marcus or Terry Horgan. Williams talks about **"moral residue"** or **"remainders."** The *concept* (that overriding an obligation doesn't erase it) is Williamsian, but the label is likely a conflation with other seminar readings.
  *   **"Both obligations stay in force":** This is slightly imprecise. Williams would say the *claim* of the obligation remains, or that it leaves a residue, not that you are still strictly obligated to do the impossible thing. You aren't obligated to do what you can't do, but you are obligated to feel the weight of what you didn't do.

  ### 3. What Williams Actually Denied (or Never Said)
  *   **"Williams accepts that moral logic contains true contradictions":** **This is the major error.** Williams is not a **dialetheist** (someone who believes true contradictions, $P \land \neg P$, can exist). He does not argue that the Law of Non-Contradiction fails in ethics.
      *   *What he actually said:* He argues that moral reality is **heterogeneous** and **conflicted**. He rejects the idea that moral theory *must* be consistent to be valid. He thinks the demand for logical consistency is a philosophical imposition on a messy world, not that the world itself contains logical contradictions. There is a big difference between "the world is inconsistent" (ontological contradiction) and "our moral values conflict in a way that logical systems can't neatly resolve" (practical conflict).
  *   **Formalizing Moral Logic:** Williams was famously skeptical of "moral logic" as a formal system. In *Ethics and the Limits of Philosophy*, he argues against the idea that ethics can be codified into a logical structure. Attributing a view about "moral logic" to him is ironic, as he spent his career arguing that ethical life escapes logical systematization.

  ### 4. Does the Conclusion Follow? (The Regret $\to$ Ontology Gap)
  You asked if the conclusion about ontological dilemmas follows from the regret argument. **Strictly speaking, no.** There is a missing philosophical step.

  *   **The Argument in the Notes:**
      1.  We feel regret.
      2.  Regret implies the lost obligation was real.
      3.  Therefore, ontological dilemmas exist (and moral logic has contradictions).
  *   **The Missing Step:** This argument relies on **Moral Cognitivism** (the idea that our moral emotions track moral truth).
      *   A skeptic could argue: "Regret is just a psychological glitch. You feel bad, but that doesn't mean the obligation was objectively real. It just means you have a certain psychology."
      *   Williams bridges this gap by arguing that a moral theory that ignores these feelings is **alienating**. He argues that if a moral theory tells you your regret is irrational, *so much the worse for the theory*, not for the feeling.
  *   **The Logic Leap:** Even if we accept the obligation was real, it does **not** follow that "moral logic contains true contradictions." It only follows that **values conflict.** You can have two real obligations ($O_1$ and $O_2$) where you must do $O_1$ and cannot do $O_2$, without asserting a logical contradiction. The contradiction only arises if you define "Obligation" as "Something you must do, period." Williams redefines obligation to allow for "overridden but still significant" claims.

  ### Summary Verdict
  Your roommate's notes are **conceptually directionally correct but technically sloppy.**

  *   **Keep:** The focus on regret, the rejection of epistemic gaps, and the idea that overridden obligations leave a trace.
  *   **Discard:** The claim that Williams accepts "true contradictions in logic." This makes Williams sound like a paraconsistent logician, which he is not. He is a **moral realist about conflict**, not a logician about contradictions.
  *   **Correction:** Williams argues that the **demand for consistency** is the problem, not that **contradiction** is the solution.

  If you are using these notes for study, treat the "true contradictions" line as a red flag. It's likely the seminar instructor was speaking loosely, or your roommate interpreted "accepting conflicting truths" as "accepting logical contradictions."
