      *   **Audience:** Working psychologists (preregistration advocates), applied Bayesians (hierarchical models), one error statistician (severity/long-run error control).
      *   **Attitude:** Sympathetic to reform, hostile to "armchair philosophy." They want methodological rigor, not abstract metaphysics.
      *   **Thesis:** The replication crisis isn't about NHST vs. Bayes; it's about *who owns the prior*. Proposal: Treat priors like estimators (public, registered, audited). Output: "Prior-sensitivity band." If band straddles null, study is uninformative. Claim: Frequentist/Bayesian dispute is often verbal (individual belief vs. field assertion).
      *   **Self-Identified Weakness:** Who audits the priors and by what standard?
      *   **Task:** Draft a Q&A prep sheet (8 objections), ordered by likelihood/damage, phrased in audience voices, with 2-minute replies, weakness identification, concession strategy, critical reply, and the "dreaded question."

  2.  **Deconstruct the Audience Personas:**
      *   *Psychologists/Preregistration Advocates:* Care about feasibility, workload, stopping "p-hacking," practical implementation. They like transparency.
      *   *Applied Bayesians:* Care about subjective vs. objective priors, hierarchical modeling, computational burden, the meaning of "prior." They might think the proposal is too rigid or misunderstands Bayesian updating.
      *   *Error Statistician:* Care about error rates, severity, long-run performance. They will worry about calibration and whether this "band" controls false positives.

  3.  **Brainstorming Objections (aiming for ~8):**
      1.  *Feasibility/Workload:* Too much work for researchers to register families of priors. (Psychologists)
      2.  *The "Audit" Problem:* Who audits? What counts as a "reasonable" prior? (User's identified soft spot).
      3.  *Bayesian Purity:* Bayes is about updating *your* belief. Registering a "public" prior defeats the purpose. (Applied Bayesians)
      4.  *Error Control:* Does this actually control Type I error rates? How do we know the band isn't gamed? (Error Statistician)
      5.  *The "Uninformative" Verdict:* If many studies become "uninformative," does science grind to a halt? (Psychologists)
      6.  *Hierarchical Models:* We already handle prior sensitivity via hierarchical structures/shrinkage. Why do we need this band? (Applied Bayesians)
      7.  *Verbal Dispute Claim:* It's not verbal; the math is fundamentally different. (Error Statistician/Bayesian)
      8.  *Incentives:* Researchers will just pick the narrowest band that passes audit. (Everyone)

  4.  **Selecting and Ordering the Top 8:**
      *   *Must include:* The Audit Problem (User's weakness), Error Control (Error Statistician's core), Bayesian Purity (Bayesian's core), Feasibility (Psychologists' core).
      *   *Ordering:* Start with the most damaging/likely (Audit/Error Control), move to methodological specifics, end with philosophical pushback.

      *Draft Order:*
      1.  The Audit/Standard Problem (The Soft Spot).
      2.  Error Control/Severity (The Error Statistician).
      3.  Bayesian Subjectivity (The Bayesians).
      4.  Feasibility/Workload (The Psychologists).
      5.  Hierarchical Models as Alternative (The Bayesians).
      6.  "Uninformative" Floodgates (The Psychologists).
      7.  Gaming/Incentives (Everyone).
      8.  The "Verbal Dispute" Claim (Philosophical pushback).

  5.  **Drafting Replies (Iterative Process):**
      *   *Constraint:* 2-minute reply (approx. 250-300 words spoken). Needs to be punchy.
      *   *Constraint:* Phrased in audience voice.
      *   *Constraint:* Identify weakness.

      *(Self-Correction during drafting)*: Make sure the "Error Statistician" sounds like Mayo/Spanos (severity, probing errors). Make sure "Bayesians" sound like Gelman/Kruschke (workflow, modeling). Make sure "Psychologists" sound like Nosek/Open Science (practicality, norms).

      *Refining the "Audit" reply:* Don't dodge. Acknowledge it's the hardest part. Propose a community-driven standard (like reporting standards).
      *Refining the "Error Control" reply:* Connect the "band" to severity. If the band excludes null, severity is high across priors.
      *Refining the "Bayesian Purity" reply:* Distinguish *personal* Bayes from *scientific* Bayes. Science is public.

  6.  **Strategic Advice (Concessions, Critical Reply, Dreaded Question):**
      *   *Concessions:* Admit feasibility costs. Admit the audit standard is currently undefined (don't fake a solution).
      *   *Critical Reply:* The distinction between *individual belief* and *field assertion*. This justifies the "public prior."
      *   *Dreaded Question:* Something that exposes the circularity or the infinite regress of auditing the auditors. Or, "Why not just use robustness checks which we already do?"

  7.  **Final Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Audience voice? Yes.
      *   2-minute reply? (Will keep text concise).
      *   Weakest point identified? Yes.
      *   Concession strategy? Yes.
      *   Single critical reply? Yes.
      *   Dreaded question? Yes.

  8.  **Final Polish:** Ensure tone is respectful but firm. The user is a philosopher entering a den of methodologists; they need to sound like they understand the math, not just the concepts. (e.g., using terms like "likelihood dominance," "coverage properties," "researcher degrees of freedom").

  *(Self-Correction on the "Dreaded Question")*: The user suspects the audit is the weak spot. The *real* dreaded question might be: "Isn't this just robustness analysis with extra steps and a fancy name?" This undermines the novelty. I'll make that the dreaded question.

  *(Refining the "Error Statistician" objection)*: They care about *probativeness*. Does this procedure probe the claim?
  *(Refining the "Bayesian" objection)*: They care about *coherence*. Does this violate probability axioms? (No, but it changes the *use*).

