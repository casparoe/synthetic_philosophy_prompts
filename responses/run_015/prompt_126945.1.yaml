answer: |-
  # Q&A Prep Sheet: Metascience Seminar Term Paper

  **Context:** You are entering a room of methodologists who value implementation over abstraction. Your goal is to show that your "Prior-Sensitivity Band" is a tool for *regulation*, not just epistemology. Do not defend "philosophy"; defend the workflow.

  **Strategy:** Concede on implementation costs immediately to gain credibility on the conceptual shift. Your survival depends on successfully distinguishing *personal belief* from *public warrant*.

  ---

  ### The Objections (Ordered by Likelihood & Damage)

  #### 1. The "Audit Standard" Objection (The Error Statistician)
  **Voice:** "You admit the soft spot is who audits the priors. If the audit standard is subjective, you haven't solved the bias problem; you've just moved it upstream. Who decides which priors make it into the 'family'? If it's the researcher, they game it. If it's a reviewer, we're back to armchair philosophy."
  **Reply:** "You're right that this is the critical implementation hurdle. But we already audit *exclusion criteria* and *outlier handling* without perfect objectivity. The proposal isn't a single auditor, but a registered *class* of priors—e.g., 'all Normal(0, σ) where σ ranges from small to large based on previous meta-analyses.' The audit checks if the family covers the plausible space, not which prior is 'true.' It shifts the question from 'Is this prior correct?' to 'Is this family broad enough to rule out prior-dependence?'"
  **Weakest Point:** You still haven't defined "broad enough" without invoking the very subjectivity you're trying to regulate.

  #### 2. The "Severity" Objection (The Error Statistician)
  **Voice:** "I care about long-run error control. Your 'band' produces a qualitative verdict ('uninformative'). How do I know this procedure has good coverage properties? If I run 100 studies where the null is true, how often does your band falsely exclude zero? If you can't guarantee error rates, severity is compromised."
  **Reply:** "The band isn't replacing error control; it's a precondition for it. A finding is only severe if it holds across the registered prior family. If the band excludes the null, the data are so strong they overwhelm reasonable prior variation. We can simulate coverage for specific band-widths. The goal is to prevent 'prior-hacking' which inflates false positives just as much as p-hacking."
  **Weakest Point:** You lack the simulation data to prove the error rates right now.

  #### 3. The "Bayesian Purity" Objection (The Applied Bayesians)
  **Voice:** "Bayesian inference is about updating *my* degrees of belief given *my* information. Registering a 'public prior' turns the posterior into a bureaucratic artifact, not a rational degree of belief. You're asking us to report a posterior no one actually holds."
  **Reply:** "I'm distinguishing *individual inference* from *field assertion*. You can believe whatever you want in your lab. But when you ask the field to accept a claim as knowledge, you must show that claim doesn't rest on your idiosyncratic prior. The 'public posterior' is a warrant for assertion, not a map of your mind."
  **Weakest Point:** This concedes that your metric isn't "Bayesian" in the strict sense, which might alienate purists.

  #### 4. The "Hierarchical Solution" Objection (The Applied Bayesians)
  **Voice:** "We already handle prior sensitivity using hierarchical models that borrow strength across groups. Why do we need this clunky 'band' registration when partial pooling already regularizes estimates and reduces prior dependence?"
  **Reply:** "Hierarchical models stabilize estimates, but they still require hyperpriors. If the hyperpriors are unregistered, you can still tune them to achieve significance. The band complements hierarchical modeling by making the hyperprior choices transparent and tested for sensitivity before data collection."
  **Weakest Point:** Many Bayesians view hierarchical modeling as the *solution* to prior sensitivity; you risk sounding like you don't use modern tools.

  #### 5. The "Feasibility" Objection (The Psychologists)
  **Voice:** "Preregistration is already a burden. Now you want researchers to specify a *family* of priors and justify them? This will freeze research. Grad students will quit. We need low-friction reforms, not high-friction philosophy."
  **Reply:** "I propose default prior families for common designs, much like default tests. You don't need to derive a new family every time; you select 'Standard Band A' for a t-test. The audit is automated check-boxes, not a philosophical essay. The friction is in the thinking, not the paperwork."
  **Weakest Point:** "Default" priors are controversial and may not fit complex designs.

  #### 6. The "Uninformative Flood" Objection (The Psychologists)
  **Voice:** "If we adopt this, half our published literature becomes 'uninformative' because the band straddles the null. Are you prepared to tell the field that most of what we know is actually nothing? That's a hard sell to editors."
  **Reply:** "Yes. That is the feature, not the bug. The replication crisis exists because we pretended noisy data were findings. Declaring studies 'uninformative' saves the field from building on sand. It shifts incentives toward larger samples and stronger designs that *can* shrink the band."
  **Weakest Point:** Editors and funders may simply reject the framework entirely if it reduces output.

  #### 7. The "Gaming the Band" Objection (Everyone)
  **Voice:** "Researchers will register the narrowest band possible to get a 'positive' result. They'll argue that 'reasonable' priors are actually very tight. How do you stop them from defining the family to guarantee success?"
  **Reply:** "That's why the audit is pre-data. The reviewer rejects the registration if the family is implausibly narrow relative to existing literature. It turns prior selection into a negotiable contract before the stakes are high, rather than a hidden justification after the fact."
  **Weakest Point:** Reviewers at the registration stage are often less rigorous than those at publication.

  #### 8. The "Robustness Check" Objection (The Skeptic)
  **Voice:** "Sensitivity analysis is already standard practice in Bayesian work. You're just renaming 'robustness checks' as 'prior-sensitivity bands' and adding bureaucracy. What is the actual novelty?"
  **Reply:** "Current robustness checks are post-hoc and optional. If the check fails, the author often argues why their *preferred* prior is still right. My proposal makes the band the *primary* verdict. If the band fails, the paper stops. It changes the decision rule, not just the appendix."
  **Weakest Point:** If they see this as merely enforcing existing best practices, the theoretical contribution shrinks.

  ---

  ### Strategic Concessions (Make these *during* the talk)

  1.  **Concede the Audit Definition:** Do not claim to have the solution for "who audits." Explicitly state: *"I do not have the institutional solution for the audit body. I am proposing the metric that the audit body should use."* This disarms Objection #1.
  2.  **Concede the Workload:** Acknowledge that this increases upfront cognitive load. Frame it as shifting effort from *defending results post-hoc* to *designing studies pre-hoc*.
  3.  **Concede the "Bayesian" Label:** Admit that "Public Bayes" is a hybrid. You are using Bayesian math for Frequentist-style regulation.

  ### The Single Reply That Must Land

  **The Distinction:** You must successfully sell the difference between **Individual Belief** vs. **Field Assertion**.
  *   *Why:* If the Bayesians think you are telling them how to think, they will reject you. If the Error Statistician thinks you are ignoring error rates, they will reject you.
  *   *The Line:* "This proposal does not tell a researcher what to believe in their office. It tells a journal what the field is allowed to treat as settled fact. It separates the psychology of discovery from the norms of justification."

  ### The Question You Hope Nobody Asks

  **"If the prior-sensitivity band straddles the null, but the likelihood function is sharply peaked away from the null, aren't you discarding valuable information just to satisfy a regulatory hurdle?"**

  *   *Why it's dangerous:* It forces you to choose between Bayesian coherence (follow the likelihood) and your regulatory proposal (follow the band). If you say "discard the info," you look anti-science. If you say "publish it anyway," your proposal collapses into standard robustness checking.
  *   *Prep:* Be ready to say: "We report the likelihood, but we do not *assert* the effect. The data go in the archive to inform future meta-analyses, but they do not count as a 'finding' for tenure or policy."
