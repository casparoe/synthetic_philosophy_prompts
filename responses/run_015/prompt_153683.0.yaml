          *   Incommensurability: Can you play two games? Wittgenstein suggests language shapes the limits of our world. Louise transcends human limits. This challenges Wittgenstein's idea that we are bound by our form of life.
          *   Nuance: It's not that she *represents* time differently; she *lives* it differently. This moves from semantics to ontology.

      *   **Section 3: Hannah's Birth (Ethics within the Game):**
          *   Scene: The climax, choosing to conceive.
