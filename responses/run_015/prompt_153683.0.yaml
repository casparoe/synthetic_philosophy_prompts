      *   *Arrival (Surface):* Sapir-Whorf hypothesis (language determines thought). Learning Heptapod B lets Louise perceive time non-linearly.
      *   *The Conflict:* Sapir-Whorf is essentially representationalist/cognitivist (language maps the world differently). Wittgenstein is pragmatic/use-based (language *is* the activity).
      *   *The "Rupture":* Heptapod B isn't just a different game; it changes the *board* (time/causality). Wittgenstein assumes a stable form of life. What if the form of life includes non-linear time?
      *   *The "Weapon/Tool":* Classic Wittgensteinian ambiguity. Meaning depends on context/use, not the sign itself.
      *   *Hannah's Birth:* This is the ethical crux. If time is circular, is it a choice? Wittgenstein emphasizes action within a form of life. Louise's action affirms the human form of life *through* the alien one.

