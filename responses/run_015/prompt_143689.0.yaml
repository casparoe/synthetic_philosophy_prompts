      *   **Conflict A: The Robustness of Tit-for-Tat (2 vs. 6).** You believe TFT is real (2), but your own sims show it's brittle without help (6).
      *   **Conflict B: The Definition of "Reciprocity" vs. "Assortment" (3 vs. 6).** You claim you don't need kin/group selection (3), but "interacting with your own kind" *is* the mechanism of kin/group selection (assortment).
      *   **Conflict C: Rationality vs. Evolution (1 vs. 5).** You switch between "what is rational" (1) and "what evolves" (5). In noise-free environments, they align. In noisy ones, evolutionary stability $\neq$ rational optimality in a one-shot sense.
      *   **Conflict D: Reductionism vs. Mechanism (4 vs. 6).** You call norms downstream (4), but tags (6) act as a prerequisite mechanism. If tags are required for cooperation to exist, they aren't just descriptions; they are causal conditions.

