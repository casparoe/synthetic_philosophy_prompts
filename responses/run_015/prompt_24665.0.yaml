answer: |-
  # Q&A Prep Sheet: Reflection as Derivative Norm

  **Thesis:** Reflection is not a *sui generis* diachronic norm. It is the output of the Law of Total Probability (LTP) applied to a synchronic norm of Deferral (treating future selves as epistemic experts).
  **Strategy:** Deflate Reflection's status to save it from conflict with Conditionalization.
  **Audience:** 15 mixed (Bayesians, Decision Theorists, Probabilists).

  ---

  ## Strategic Stance: What to Concede & What to Hold

  **CONCEDE UP FRONT:**
  1.  **Deferral is the normative heavy-lifter.** Do not fight the claim that the "ought" comes from the Deferral Principle, not the LTP. Acknowledge that if Deferral is rejected, Reflection falls.
  2.  **Reflection is not universal.** Concede that Reflection only holds *conditional* on the agent satisfying the Deferral Principle. If an agent knows they will be irrational (drunk, tired, biased), Deferral does not apply, and neither does Reflection. This neutralizes the "Reflection is too strong" objection.

  **HOLD FIRM:**
  1.  **Reflection is not independent.** It is a theorem of the system {LTP + Deferral}, not an axiom. This dissolves the conflict with Conditionalization because conflicts only arise between independent axioms.
  2.  **The "Pseudo-Conflict" Claim.** The tension between Reflection and Conditionalization arises only when we treat Reflection as a constraint on *updating* rather than a constraint on *current expectations of expertise*.

  ---

  ## The "Sink the Talk" Question
  *(Hope this doesn't come, but have the answer ready)*

  **Q:** "To apply the Law of Total Probability over your future credences, the propositions 'My future credence in A will be $x$' must form a partition in your current possibility space. But if you are genuinely open-minded about what doxastic states you might adopt, you cannot define this partition without already assuming your future mind is determinate. Doesn't your derivation only work for agents who are *already* certain about their future doxastic options? If so, haven't you built Reflection into the premises required to apply LTP, making the derivation circular?"

  **A:** "That is a sharp technical point. The derivation requires that the agent can assign probabilities to their future credal states. It does *not* require certainty about which state will obtain, only that the *possible* states form a measurable set. If an agent is so doxastically unmoored that they cannot assign probabilities to their future mental states, LTP indeed cannot apply—but in that case, the agent lacks the minimal self-knowledge required for *any* diachronic planning, including Conditionalization. So, the derivation holds for any agent coherent enough to model their future self, which is the same baseline required for standard Bayesian diachronics."
  *(Soft Spot: This concedes the principle doesn't apply to 'radically open' agents, which might limit the scope of your claim more than you want.)*

  ---

  ## Top 7 Objections (Ordered by Damage)

  ### 1. The "Relocating Controversy" Objection
  **Who:** Bayesian Epistemologist (Sympathetic to Time-Slice)
  **Phrasing:** "You claim to dissolve the mystery of Reflection, but you've just moved the magic. If Reflection follows from Deferral, then Deferral is just Reflection applied to a specific expert (your future self). You haven't explained *why* we should defer; you've just renamed the norm. Haven't you merely relocated the controversy rather than solving it?"
  **2-Minute Reply:** "I concede Deferral is the normative source, but I deny it is Reflection renamed. Deferral is a *general* synchronic norm about expertise (I defer to the weatherman, the calculator, and my future self). Reflection is the *specific* output when the expert happens to be $t_{future}$. By grounding Reflection in general expertise, we explain *why* it fails when I know I'll be drunk (I don't defer to drunk selves), whereas standalone Reflection struggles to explain exceptions without ad-hoc clauses. I haven't relocated the controversy; I've subsumed a specific diachronic puzzle under a broader synchronic norm."
  **Soft Spot:** You are relying on the audience accepting "Expertise" as clearer than "Reflection." If they think Expertise is just as mysterious, you haven't gained ground.

  ### 2. The "Normative Force" Objection
  **Who:** Probabilist / Philosopher of Math
  **Phrasing:** "The Law of Total Probability is a theorem, not a constraint. It's an 'is', not an 'ought'. If Reflection is just LTP plus Deferral, then LTP contributes no normative force. You are deriving a diachronic 'ought' from a mathematical identity. Where does the normativity actually come from if not from Reflection itself?"
  **2-Minute Reply:** "You are exactly right that LTP provides no normativity; it provides the *structure*. The normativity comes entirely from the Deferral Principle (the 'ought'). My claim is not that LTP generates the norm, but that Reflection is not an *additional* norm. Think of it like physics: $F=ma$ is a law, but if I know $m$ and $a$, $F$ is determined. I'm arguing Reflection is the $F$, not a new law. The normative work is done by the requirement to treat future selves as experts. LTP just ensures that if you do that, your current probabilities must align mathematically."
  **Soft Spot:** If they press that Deferral *is* just Reflection restricted to future selves, you are back to Objection #1.

  ### 3. The "Conditionalization Clash" Objection
  **Who:** Bayesian Epistemologist (Diachronic Skeptic)
  **Phrasing:** "Van Fraassen showed Reflection and Conditionalization can conflict (e.g., in cases of forgetting or self-manipulation). You call this a 'pseudo-conflict.' But if I know I will forget evidence, Conditionalization says update on what you have, Reflection says match your future self. They give different answers. How is that not a real conflict?"
  **2-Minute Reply:** "It is a real conflict only if you assume Reflection applies unconditionally. On my view, Reflection applies *only if* you defer to your future self. In forgetting cases, you *should not* defer to your future self because your future self is less informed (they lost evidence). Since the Deferral condition fails, Reflection does not apply. Conditionalization remains the sole updating norm. The conflict vanishes once we recognize Reflection is conditional on the future self retaining expert status."
  **Soft Spot:** You need to be careful not to make Deferral so conditional that Reflection becomes trivial.

  ### 4. The "Why Defer?" Objection
  **Who:** Decision Theorist
  **Phrasing:** "You use the phrase 'ought to defer.' In decision theory, deferral is cashed out in terms of expected utility. But my future self might have different utilities or risk profiles. If my future self is more risk-averse, should I defer to their probabilities? Your principle seems to conflate belief and value."
  **2-Minute Reply:** "A crucial distinction. Deferral regarding *probabilities* (Reflection) assumes utility functions remain stable or are bracketed out. If utilities change, we are in the realm of preference change, not pure belief revision. My principle applies to the doxastic component: if I believe my future self has processed more evidence without utility distortion, I defer. If I anticipate utility drift, the Deferral Principle is suspended, and again, Reflection does not trigger."
  **Soft Spot:** Separating belief and value cleanly is notoriously difficult. They may press on how you identify "pure belief" updates.

  ### 5. The "Time-Slice Autonomy" Objection
  **Who:** Time-Slice Epistemologist
  **Phrasing:** "I'm skeptical of any norm binding time-slices. Why should who I am *now* be held hostage to who I *will be'? If I am rational now, I am rational. Binding me to a future self violates the autonomy of the current time-slice."
  **2-Minute Reply:** "I agree that rationality is fundamentally a property of time-slices. But Deferral is a *current* attitude. It is a judgment *now* that my future self is an expert. It's no different than judging the weatherman an expert now. The norm binds you only because *you currently endorse* that future expertise. If you revoke that endorsement, the norm dissolves. It's not a external diachronic chain; it's a synchronic judgment about a future object."
  **Soft Spot:** This walks a fine line. If it's all synchronic, is it still "Diachronic Rationality"? You might be redefining the workshop's theme.

  ### 6. The "Partition" Objection
  **Who:** Probabilist / Technical Bayesian
  **Phrasing:** "LTP requires a partition. Future credences are continuous variables. How do you construct the partition required for the derivation without assuming countable additivity or discrete credal states? If the math doesn't hold, the derivation fails."
  **2-Minute Reply:** "Standard measure-theoretic probability handles continuous partitions via integration rather than summation. The derivation holds mutatis mutandis using conditional expectations. $P_t(A | E_t[P_{t+k}(A)]) = E_t[P_{t+k}(A)]$. The philosophical point remains: the expectation of the future probability is the current probability, provided the deferral condition holds. The discrete/continuous distinction doesn't change the normative structure."
  **Soft Spot:** If you aren't comfortable with measure theory, don't bluff. Admit you are working in a discrete framework for simplicity but claim the principle generalizes.

  ### 7. The "Self-Fulfilling Prophecy" Objection
  **Who:** Decision Theorist / Bayesian
  **Phrasing:** "If I believe I will believe $A$ is likely, and that belief makes $A$ likely (e.g., I bet on it), Reflection forces me to believe it now. But that's manipulation, not rationality. Does your view permit self-fulfilling prophecies to count as rational?"
  **2-Minute Reply:** "In cases where belief influences truth, the 'expert' condition is compromised because the future belief is not tracking evidence but causing the fact. Deferral requires the expert to be tracking the world. If my future belief creates the world, it is not an epistemic expert in the relevant sense. Therefore, Deferral is suspended, and Reflection does not apply. We avoid the self-fulfilling trap by tightening the definition of 'expert'."
  **Soft Spot:** This requires a robust theory of "tracking" which might be outside the scope of your talk.

  ---

  ## Closing Advice for the Workshop

  *   **Tone:** Be humble about the math, confident about the philosophy. The probabilists will catch math errors; the epistemologists care about the norm structure.
  *   **The "Pivot":** Whenever an objection gets too technical on LTP, pivot back to: "The math is just the engine; the Deferral Principle is the driver."
  *   **Watch the Clock:** If the "Sink Question" comes up, do not rush. It shows you understand the limits of your own derivation.
  *   **Final Thought:** Your strongest card is that your view explains *exceptions* to Reflection (forgetting, bias) better than Van Fraassen's original formulation. Play that hand hard.
