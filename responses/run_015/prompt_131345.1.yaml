answer: |-
  1. **The scene**
  You encountered this during a debate on Steven Weinberg's concerns about underdetermination, where the interlocutor used the slogan to imply that philosophical scrutiny of theory choice is irrelevant to the actual practice of physics. Its rhetorical job was to categorize philosophy of science as a purely external, descriptive exercise that offers no normative guidance for discovery or justification. By equating scientists to birds, it frames scientific practice as instinctual or self-sufficient, rendering meta-analysis useless.

  2. **The menu**
  1.  **Causal Necessity:** Birds fly without studying aerodynamics; scientists discover without studying epistemology. (Trivial; Usefulness: causal precondition for activity; Birds: biological agents capable of instinctual action).
  2.  **Normative Improvement:** Ornithology doesn't help birds fly better; philosophy doesn't help scientists methodologically. (Defensible/False; Usefulness: instrumental optimization of performance; Birds: skilled performers subject to training).
  3.  **Conceptual Dependency:** Birds don't need the concept of 'bird' to exist; scientists don't need the concept of 'science' to work. (False; Usefulness: conceptual framework for self-identification; Birds: unreflective entities vs. reflective agents).
  4.  **Professional Authority:** Ornithologists don't command birds; philosophers don't command scientists. (Defensible; Usefulness: administrative or hierarchical authority; Birds: autonomous agents free from external governance).
  5.  **Historical Priority:** Birds existed before ornithology; science existed before philosophy of science. (Trivial; Usefulness: historical origin story; Birds: chronological predecessors in time).
  6.  **Radical Inertness:** The existence of ornithology changes nothing about bird behavior; philosophy changes nothing about scientific culture. (False; Usefulness: cultural feedback loop; Birds: isolated systems unaffected by observation).

  3. **The lab-knowledge twist**
  The analogy hinges on science being tacit and instinctual like flight, but scientists operate with explicit norms (p-values, calibration protocols, replication standards) that birds do not. This makes scientists more like "birds who read aerodynamics manuals" to improve their flight, meaning methodology is already an internal part of the practice. Consequently, the strong reading of the slogan collapses; it survives only if "ornithology" is restricted to *external* commentary distinct from the *internal* methodological reflection scientists already perform. This reduces the claim to the weaker thesis that professional philosophers specifically are unnecessary, not that methodological reflection itself is useless.

  4. **Which ones do the work?**
  Weinberg's underdetermination is a justificatory worry (why rationally choose A over B?), not a causal one. Only Thesis 2 (Normative Improvement) attempts to support dismissing this worry, claiming philosophy offers no help on theory choice. Theses 1, 4, and 5 change the subject to causality, authority, or history, which do not touch the rationality of theory choice. Thesis 6 (Radical Inertness) supports dismissal only if one assumes cultural feedback is irrelevant to rational choice, which is contentious. Most items shield the scientist from reflection rather than answering the philosophical worry.

  5. **Bottom line**
  The slogan is mostly rhetorical armor that conflates the context of discovery with the context of justification. It sounds clever because it highlights the autonomy of practice, but it fails to engage with the normative questions Weinberg raises about why certain theories are rationally preferred over others. Ultimately, it dismisses the problem rather than solving it, relying on the equivocation between "doing science" and "understanding why science works."
