          2.  *Normative Guidance:* Ornithology doesn't improve flight; philosophy doesn't improve methodology. (Defensible/False, instrumental usefulness).
          3.  *Conceptual Dependence:* Birds don't conceptually rely on ornithology; scientists don't rely on philosophy for concepts. (False, conceptual usefulness).
          4.  *Historical Priority:* Birds existed before ornithology; science existed before philosophy of science. (Trivial, historical usefulness).
          5.  *Authority:* Birds are the authority on being birds; scientists are the authority on science (not philosophers). (Defensible, epistemic usefulness).
          6.  *Radical Autonomy:* The existence of ornithology changes nothing for birds; philosophy changes nothing for science. (False, cultural usefulness).

  5.  **Drafting Section 3: The Lab-Knowledge Twist**
      *   *Point:* Birds fly tacitly. Scientists use explicit norms (p-values, calibration).
      *   *Analysis:* The analogy assumes science is tacit/instinctual like flight. But science is reflective. Scientists *do* engage in proto-philosophy (methodology).
      *   *Conclusion:* The analogy collapses if "ornithology" is external study vs. "bird mechanics" as internal. Since scientists *do* internal methodology, philosophy might refine that.
      *   *Drafting:* The analogy hinges on science being tacit/instinctual (like flight). But scientists operate with explicit norms (p-values, calibration). This makes scientists more like "birds who read aerodynamics manuals." If scientists already engage in methodological reflection, philosophy of science isn't an external observer but a refinement of internal practice. This collapses the strong reading (philosophy is useless) into a weaker one (professional philosophers aren't needed for *basic* practice, but might refine explicit norms).

  6.  **Drafting Section 4: Which ones do the work?**
      *   Context: Dismissing Weinberg's underdetermination.
