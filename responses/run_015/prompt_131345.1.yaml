      *   To dismiss this, one needs to say: "Stop worrying, just do the work."
      *   *Menu Item 1 (Causal Necessity):* Doesn't work. Weinberg isn't asking how to cause discovery, but how to justify it.
      *   *Menu Item 2 (Normative Guidance):* This is the one. It claims philosophy offers no help on *choice*.
      *   *Menu Item 6 (Radical Autonomy):* Supports the idea that the worry is artificial.
      *   *Distinction:* Most of them change the subject from *justification* (Weinberg's point) to *discovery* (the slogan's point).
      *   *Drafting:* Only the Normative Guidance thesis (Ornithology doesn't improve flight) attempts to address Weinberg. The others change the subject from justification to causal history or professional authority. Weinberg is worried about *why* we choose Theory A over B; the slogan replies "You chose A anyway, so stop asking."

  7.  **Drafting Section 5: Bottom Line**
      *   Is it real labor or clever sounding?
      *   It's mostly a rhetorical shield. It conflates *doing* with *justifying*.
