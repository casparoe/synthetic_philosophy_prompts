  4. This claim argues that no observer's judgment is more correct than another's regardless of training, which is contestable and rejected by Hume's standard of the ideal critic, thereby entailing the illegitimacy of grading for quality rather than preference.
  5. This strongest reading posits there is no fact of the matter about aesthetic quality independent of immediate response, which would be a genuine discovery if true but is false, and it would render grading fundamentally illegitimate, a conclusion Hume's entire essay exists to refute.
