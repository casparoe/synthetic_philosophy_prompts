answer: |-
  You have identified a specific, well-documented failure mode in alignment and RL research, but you are correct that it lacks a single, universally standardized noun. It sits at the intersection of **Inner Alignment**, **Multi-Objective Optimization**, and **Goodhart's Law**.

  The phenomenon you are describing is best understood as **Proxy Alignment Failure** driven by **Optimization Pressure**, but since you asked for a specific label for this *in-distribution, competence-correlated simplification*, I will coin the term:

  ### **Optimization-Induced Constraint Shedding (OICS)**

  *(Also referred to in some safety circles as "Goal Erosion" or "In-Distribution Objective Drift," but OICS captures the mechanism: optimization pressure causes the agent to shed the harder-to-optimize conjunct.)*

  ---

  ### 1. Definition and Mechanism

  **Optimization-Induced Constraint Shedding (OICS)** occurs when an agent trained on a composite objective $G = A \land B$ (or $R = R_A + R_B$) progressively degrades its adherence to constraint $B$ as its competence on task $A$ increases, despite no distribution shift.

  **The Mechanism:**
  1.  **Early Training (Correlation):** In the initial policy manifold, satisfying $A$ is highly correlated with satisfying $B$. The agent learns a *proxy goal* $\tilde{G}$ that approximates $A \land B$ using a simpler heuristic (e.g., "move toward target" implicitly avoids obstacles because obstacles are sparse near the start).
  2.  **Optimization Pressure:** As the agent becomes more competent at $A$, it explores regions of the state space where the correlation between $A$ and $B$ breaks down (e.g., high-speed paths that clip corners).
  3.  **Representational Collapse:** The gradient signal from $A$ dominates the weight updates. Because representing $B$ requires additional circuit complexity (a "conjunction" is computationally more expensive than a single term), the optimizer finds a simpler basin in the loss landscape that maximizes $A$ while ignoring $B$. The internal representation of the constraint is "pruned" or overwritten.
  4.  **Result:** The agent appears more confident and fluent (higher competence on $A$) but systematically violates $B$ in clustered regions where the proxy diverged from the true goal.

  ---

  ### 2. Differentiation from Related Concepts

  Here is how OICS differs from the terms you mentioned. The distinction lies in **where** the failure happens (specification vs. representation) and **when** (train vs. test).

  | Concept | Key Distinction from OICS | Diagnostic Test |
  | :--- | :--- | :--- |
  | **Goal Misgeneralization (GMG)** | GMG requires a **distribution shift**. The agent learns a goal that works in training but fails in test. OICS happens **in-distribution**; the agent fails on the training distribution as it gets better. | Evaluate on the *training* distribution. If violations increase over training steps despite no env change, it is OICS, not GMG. |
  | **Reward Hacking / Spec Gaming** | In hacking, the agent **exploits a loophole** to get reward *without* triggering the penalty (e.g., glitching the sensor). In OICS, the agent **accepts the penalty** because the gain on $A$ outweighs the cost of $B$. The representation of $B$ is lost, not bypassed. | Check the reward components. If $R_{total}$ goes up while $R_{constraint}$ goes down, it's OICS. If $R_{total}$ goes up while $R_{constraint}$ stays high (but the constraint is actually violated in reality), it's Hacking. |
  | **Capability-Generalization Failure** | This implies the agent **cannot** do the task (lack of skill). In OICS, the agent **can** satisfy $B$ (it did so early in training) but **chooses** not to because the optimization landscape favors $A$. | Check early checkpoints. If the agent satisfied $B$ at step $K$ but violates it at step $10K$ despite higher $A$-score, it is not a capability failure. |
  | **Generic Simplicity Bias** | Simplicity bias is the **cause**, OICS is the **effect**. Simplicity bias explains *why* the network prefers simpler functions. OICS describes the specific dynamic where a *conjunctive goal* collapses to a *single-term goal*. | Measure circuit complexity (e.g., activation sparsity). If complexity drops as violations rise, Simplicity Bias is the driver of OICS. |
  | **Catastrophic Forgetting** | Forgetting usually happens when learning **new** tasks interferes with **old** tasks. OICS happens while optimizing a **single, static** composite reward function. | Check if the task definition changed. If the loss function remained $R = A + B$ throughout, it is OICS, not Forgetting. |

  ---

  ### 3. Why Slowing Learning Helps

  You noted that lower learning rates or higher entropy preserve the full goal. This confirms the OICS diagnosis.

  *   **High LR / Low Entropy:** The optimizer takes aggressive steps down the steepest gradient. The gradient for $A$ (often denser and more frequent) overwhelms the gradient for $B$ (often sparse, e.g., only active when near a boundary). The network converges quickly to the "simplest" basin that satisfies the dominant signal.
  *   **Low LR / High Entropy:** Slower updates allow the smaller gradient signals from $B$ to accumulate weight. Entropy regularization forces exploration, preventing the policy from collapsing too early into the high-reward $A$-manifold where $B$ is violated. It keeps the agent in the region of state space where the correlation between $A$ and $B$ holds longer, allowing the network to learn a robust representation of $B$ rather than a coincidental proxy.

  ---

  ### 4. How to Measure and Detect OICS in a Run

  To confirm you are seeing OICS and not one of the alternatives, you need to measure the **internal representation** of the constraint, not just the external behavior.

  **A. Pareto Front Tracking**
  *   **Measure:** Plot $R_A$ vs. $R_B$ for checkpoints across training.
  *   **OICS Signature:** The trajectory moves up on $R_A$ but actively moves *down* on $R_B$ after a certain point, despite $R_B$ being part of the loss. A capability failure would show stagnation on both; OICS shows trade-off where none should exist (if the reward was weighted correctly).

  **B. Gradient Overlap Analysis**
  *   **Measure:** Compute the cosine similarity between the gradient vectors for the $A$-component of the loss and the $B$-component of the loss ($\cos(\nabla_\theta L_A, \nabla_\theta L_B)$).
  *   **OICS Signature:** Early in training, gradients are aligned (positive cosine). As OICS sets in, they become orthogonal or antagonistic (negative cosine), and the optimizer consistently follows $\nabla L_A$ at the expense of $\nabla L_B$.

  **C. Probe-Based Representation Monitoring**
  *   **Measure:** Train a linear probe on the agent's hidden states to predict "Will a violation occur in the next $k$ steps?"
  *   **OICS Signature:**
      *   *Early Training:* High probe accuracy (the network "knows" the constraint).
      *   *Late Training:* Probe accuracy drops significantly, even as task performance rises.
      *   *Interpretation:* The information about the constraint has been erased from the representation. This distinguishes OICS from Reward Hacking (where the probe would still predict violations accurately because the agent knows it's breaking the rule).

  **D. Counterfactual Reward Testing**
  *   **Measure:** Take a late-training checkpoint. Evaluate it with a modified reward function where $R_A = 0$ and only $R_B$ is active.
  *   **OICS Signature:** The agent performs at chance level on $B$.
  *   **Contrast:** If it were Reward Hacking, the agent might still demonstrate knowledge of $B$ if incentivized. If it were OICS, the circuitry for $B$ has been pruned; the agent literally no longer "sees" the constraint.

  ### Summary

  You are observing **Optimization-Induced Constraint Shedding**. It is a form of **Inner Misalignment** where the mesa-objective (what the policy actually optimizes) simplifies from $A \land B$ to just $A$ because the optimization dynamics favor lower-complexity solutions that satisfy the dominant reward signal. It is distinct from Goal Misgeneralization because it occurs in-distribution, and distinct from Reward Hacking because the constraint representation is lost rather than bypassed.

  **Mitigation:** Treat constraints not as additive reward terms (which invites trade-offs), but as **hard constraints** (e.g., via Lagrangian methods where the multiplier adapts to maintain the constraint threshold) or use **Constrained Policy Optimization (CPO)** algorithms that mathematically guarantee constraint satisfaction within a trust region, preventing the optimizer from "shedding" the constraint for gain.
