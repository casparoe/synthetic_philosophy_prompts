      *   Halfer: $P(\text{Awake} | H) = 1$, $P(\text{Awake} | T) = 1$. Likelihood ratio = 1. No update.
      *   Thirder: This ignores the *number* of times. It's like saying "I knew I'd be in the hospital if I had the disease" but ignoring that severe disease keeps you in longer.
