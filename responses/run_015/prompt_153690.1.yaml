  There's this anology people keep using in integration debates: French laïcité is like a refree at a sports match — the state pulls on a neutral uniform and doesn't show team colors, so everyone plays on equal ground — while Anglo-American multiculturalism is like a festival organizer who books every cultural act and gives each its own stage. I'm trying to figure out if either picture actually holds once you dig into the mechanics.

