answer: |-
  The coffee shop was humming with the low-frequency anxiety of finals week. Lena stirred her black coffee with a wooden stick that was already losing its structural integrity. Marco was nursing a latte that looked mostly like foam.

  "So," Lena said, leaning forward. "The *Hera* is gone. Burned in the storage fire. But we have the forgery. The one the guy spent twenty years making. Spectroscopic analysis says it's indistinguishable."

  Marco shook his head immediately. "It's a prop, Lena. A really expensive prop."

  "It's visually identical. If I put you in a room with it, blindfolded, then took the blindfold off, you'd have the exact same aesthetic experience you would've had with the original. So where is the loss?"

  "The loss is in the object's history," Marco said, tapping his cup. "It's about causal provenance. The value isn't just in the pattern of colors on the canvas. It's that *Hera* was touched by the artist. It's a physical trace of a specific human moment in 1640. The forgery is a trace of a guy in Queens in 2020."

  "But the *art* is what happens in the viewer," Lena countered. "If the visual input is the same, the art is the same. Actually, isn't the forgery *better*? Think about it. The original was degraded, varnish yellowed, canvas sagging. This forgery is what the artist *intended* to look like, realized with modern tech and insane skill. It's the Platonic form of the painting."

  Marco winced as if she'd suggested eating glass. "That's dangerous. You're reducing art to a JPEG. If it's just about the visual data, then a printout is the same as the oil painting. You're erasing the artifact."

  "I'm not erasing it, I'm prioritizing the aesthetic encounter over the relic hunting."

  "It's not relic hunting! It's about connection." Marco got animated, lifting his hand to emphasize the point. His elbow clipped the latte. A tidal wave of white foam sloshed over the rim and onto the table, soaking a napkin.

  "Damn it," Marco muttered, grabbing tissues.

  Lena smiled, waiting for him to mop up the mess. "Okay, while you clean up your causal provenance, answer me this. You care about the artist's touch, right? The physical surface?"

  "Obviously."

  "So what about restoration? When a conservator fills in a scratch on a Rembrandt with retouching paint, they are literally covering the artist's touch with their own. By your logic, every restored painting is a forgery. The moment they fill a crack, the 'causal chain' is broken. Why is the museum conservator a preserver, but the forger a criminal?"

  Marco paused, holding a sodden wad of napkins. He thought for a second, then set the mess aside. "That's a category error. Restoration is minimal intervention. It's about stabilizing the original trace, not creating a new one. We fill a scratch to *reveal* the original intent, not to replace the object."

  "But where's the line?" Lena pressed. "If you restore 5% of the canvas, it's still a Rembrandt. If you restore 50% because it was damaged by fire, is it still a Rembrandt? If you restore 100%... which is what this forgery basically is, a total restoration of a lost image... suddenly it's worthless? Your theory relies on a magical threshold of 'original material' that doesn't actually affect how the painting looks."

  "It affects how we *know* it," Marco said. "And don't act like knowledge doesn't matter. You said it yourself earlier: you praise the forger's skill. You called it 'insane skill.'"

  "Because it is."

  "But wait," Marco leaned in, pointing a finger stained with coffee foam. "If the artist's hand doesn't matter—if the historical touch is irrelevant like you say—then why do you care about the forger's skill? You just said the value is in the visual experience. If the visual is perfect, who cares how hard the guy worked? If the artist's hand is meaningless, the forger's hand should be meaningless too. You can't have it both ways. You can't idolize the craftsmanship of the copy while claiming the craftsmanship of the original is just history."

  Lena stopped stirring her coffee. She looked at the wood stick, now broken in half.

  "Touché," she said softly. "But... I think there's a distinction. I admire the forger's skill as a feat of human achievement, like an athlete breaking a record. It's impressive *now*. But the original artist's hand... that's not about achievement for me. That's about context."

  "Context is everything," Marco said, finally sitting back. "If I watch a recording of a live jazz set, it sounds the same. But I wasn't there. The energy, the risk, the moment—it's ontological, Lena. The forgery is a lie about its own existence. It claims to be from 1640. Even if it looks like 1640, it lies about where it came from."

  "But what if we label it?" Lena asked. "What if we hang it next to the empty frame and say, 'Here is the visual experience of the lost work, made by a master in 2020.' Does it still have no value?"

  Marco sighed, signaling the barista for another napkin. "It has value. Just not the *same* value. It's a tribute. A eulogy. But you can't eulogize a person by swapping in a clone and pretending nothing died."

  Lena picked up her coffee. "Maybe art isn't a person. Maybe it's a conversation. And the conversation continues as long as someone can keep the image alive."

  "Then it's not art," Marco said, wiping the table. "It's content."

  "Ouch." Lena took a sip. "You buying the next round, or is that too much causal provenance for your wallet?"

  Marco laughed. "I spilled. I buy."
