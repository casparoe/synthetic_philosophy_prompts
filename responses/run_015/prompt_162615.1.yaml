answer: |-
  **Strategy Sketches**

  1.  **The "Necessary Evil" Pivot:** Argue that Weil was right generally, but this specific legislation is so catastrophic/imminent that it justifies temporarily suspending the rules of healthy politics. We are the firebreak, not the forest.
      *   *Verdict:* Bullshit. It undermines the founders' structural innovation from day one and tells the volunteers they're already compromising. It sounds like every other party launch.

  2.  **The "Laboratory" Frame:** Treat the convention as a scientific trial. We are testing whether incentives can cure corruption. Success is data, not necessarily the bill passing.
      *   *Verdict:* Too cold. The volunteers who quit their jobs didn't come to be lab rats. It drains the room of the passion required to actually campaign.

  3.  **The "Sacred Suicide" Narrative:** Center the sunset clause as the source of strength. Most parties fight to survive; we fight to end. Our mortality makes us honest.
      *   *Verdict:* Strong, but risky. It can sound like we don't intend to win. Needs to be paired with a commitment to efficacy while we live.

  4.  **The "Tripwire" Vow:** Acknowledge the Weil critique directly without naming her. Admit that unity often requires blindness. Promise that when our rules cost us a winnable seat, we will pay the price rather than break the charter.
      *   *Verdict:* This is the one. It respects the founders' intellect, validates the volunteers' sacrifice, and sets a concrete standard for integrity that doesn't rely on empty sincerity.

  **Selection Rationale**

  I'm picking the Tripwire strategy because it's the only one that treats the room's intelligence with respect while generating actual campaign energy. It converts the party's structural weaknesses (the dissent wing, the sunset) into a badge of honor rather than a liability. It allows you to be honest about the cost of integrity without predicting failure, ending on a line about utility rather than survival.

  ***

  **The Keynote**

  Look around this room. Four hundred people. Some of you have known each other for decades in comment threads and email chains. Some of you drove six hours to sit in these folding chairs. Some of you quit jobs to stand in canvassing lines next week. We are here to start a political party. And we are here to start a political party that intends to die.

  That is the thing we have to say out loud, because if we don't say it, the machine will eat us anyway.

  There is a danger in forming a group. Any group. When we stand together, we become stronger than we are alone. But the price of that strength is usually a piece of our judgment. To act as one body, we have to agree to see the world through the same eyes. We have to agree to ignore the cracks in our own arguments. We have to agree that winning is more important than being right. History is full of parties that started with a truth and ended with a brand. They became machines for pressing the thought of their own members, for generating passion that had nothing to do with the world outside the room. They became things that existed first for themselves.

  We are trying to build something that refuses to become a thing.

  Read the charter. You know what it says. We have a sunset clause. This organization dissolves when the bill passes, or after three cycles, whichever comes first. We have a funded dissent wing. We have a rule that no member will ever be asked to vote against their own judgment. We have a norm that every public statement must steelman the opposition. These are not marketing slogans. These are constraints. They are cages we have built for ourselves so that we do not become the monster we are fighting.

  I know what some of you are thinking. The volunteers in the back, the ones who know how campaigns actually work. You are thinking that unity wins elections. You are thinking that if we let people dissent publicly, if we refuse to toe the line when the whip comes down, we will lose. You are right. We might lose. There will be a moment, maybe next year, maybe in the second cycle, where holding to these rules will cost us a seat. There will be a moment where breaking the rules would save the campaign, where a little bit of blindness would secure the majority we need to pass the law.

  That moment is the tripwire.

  When that moment comes, we will know who we are. Most parties would break the rule to save the organization. They would say it is for the greater good. They would say we can fix the incentives later. We are saying that if we break the rule, we have already lost, even if the bill passes. Because if we become a machine to win, we become just another party. And if we become just another party, we are no longer trustworthy stewards of the truth we claim to serve.

  This is not a seminar on political philosophy. This is a campaign launch. I am not asking you to be less effective. I am asking you to be more dangerous. A party that cannot be bullied by its own survival is a party that cannot be bought. A party that admits when it is wrong is a party that people will listen to when it says it is right. A party that plans to die is a party that does not need to compromise with the future.

  The founders here have built a structure based on the idea that incentives shape judgment. They are right. But structures are only paper until people bleed on them. The volunteers here are the blood. You are the ones who will have to stand in the heat when the dissent wing critiques the platform on the nightly news. You are the ones who will have to explain to a donor why we aren't taking their money because it comes with a string attached to our sunset clause. You are the ones who will have to walk away when the temptation to win comes at the cost of the charter.

  It will be frustrating. It will be messy. There will be times when you look at the opposition and wish you could fight dirty. There will be times when you look at your own side and wish you could demand unity. Do not wish for those things. Those things are the signs of decay. The friction you feel is not a bug. It is the feature. It is the sound of the machine refusing to grind down the human beings inside it.

  We are not here to build a legacy. We are not here to build a brand. We are not here to ensure that this organization survives for the next generation. We are here to do a specific piece of work, and then to put the tools down.

  So when the press asks us what we are, do not tell them we are a movement. Do not tell them we are a coalition. Tell them we are a tool. Tell them we are a lever designed to break after lifting the weight. Tell them we are the only party that measures success by its own obsolescence.

  There is a kind of honesty that only exists when you have nothing to lose. We have given ourselves three cycles to live. Let us live them so fully, so fiercely, and so honestly that when the time comes to dissolve, we do not hesitate. Let us build a party that is worthy of its own end.

  Let us get to work.
