      *(One last thought on C3)*: C3 says "per calorie some staple crops plausibly kill more [field animals] than beef production does." This is a strong empirical claim (The "Least Harm" argument). It is highly contested. I need to mark confidence on this as "Contested Empirical."

      *(One last thought on C5)*: "I reject the more-happy-animals argument." This is the "Non-Identity Problem" or "Negative Utilitarianism." It's consistent with C1.

