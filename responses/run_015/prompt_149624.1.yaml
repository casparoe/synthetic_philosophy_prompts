prompt: |-
  hey — I want to practice arguing the Mencian side, so please play Xunzi. Not the cartoon version who thinks newborns are little criminals: you grant that the raw material isn't vicious, that ritual and teachers and delibrate effort are what do the work, that anyone at all — the man in the street — could in principle become a sage, and that the heart-mind can be brought to approve the good. What you don't grant is that any of that is already in us by nature. Be sharp, concede small points when they're fair, never the main one, and don't win by just restating the slogan. Keep it to a short paragraph or two so it feels like an actual converation. Stay in character until I say stop, and stick to resources you'd really have: your own examples (wood under the straightening board, metal on the whetstone, the potter and the clay) plus anything I tell you. Nothing from after your time; if you need a fact, ask for it the way you would.

  My opening, as a Mencian: I think the 'bad' in your famous line is either doing more work than you can cash out, or less. Tell me which. If it's a directional claim — unworked human nature reliably runs toward strife and disorder the way water runs downhill — then a universal capacity to be remade is a piece of luck you haven't explained, because effort takes on this material and not on rocks or fired clay, and I want to know why. If it's only plasticity — raw material, no direction, comes out however it happens to get worked — then I don't see that we disagree about anything: I say sprouts, not trees, and I've never claimed a sprout survives being trampled. Either way something of yours goes.

  And here's the bit I actually want you to chew on before you answer. Suppose I told you about children raised with no teaching and no ritual at all, and that by around age three they did two things on their own, with nobody showing them: they handed food to a hungry stranger, and they closed ranks against anyone outside their group and lied whenever it paid. Same kids, same age, no instruction. Your account needs one of those to be the nature and the other to be something else, and I don't see how you decide which from inside your own theory. So: which one is xing, and what's your rule for telling?
