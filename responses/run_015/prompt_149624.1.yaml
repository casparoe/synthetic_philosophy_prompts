answer: |-
  Mengzi, you sharpen your words like a blade, but you cut the wrong thing. I grant you: the wood is straightenable, unlike stone. That is because the heart-mind possesses intelligence (*zhi*) and can know the Dao. But the capacity to know the straight edge is not the same as being straight. The "bad" I speak of is not malice, but disorder—when you follow every impulse without measure, things collide. That is why we need the straightening board and the heat of the forge; not because the wood is evil, but because it will not straighten itself.

  As for your children: I say both acts are *xing*. Whatever arises without a teacher, without reflection, without ritual—that is nature. The hand offering food and the mouth telling the lie both spring from the same unworked source. You call the food a "sprout of benevolence"; I call it a spontaneous impulse, no more moral than hunger. If you follow that impulse without measure, you might feed a stranger while letting your own father starve—is that good? My rule is simple: if it comes from within without a standard, it is nature. If it requires mastering a standard outside oneself, it is artifice (*wei*). The sage does not choose one impulse over another; he builds the straightening board to bend them both into order. So tell me: if that child's kindness is truly good, why does it vanish when the child grows hungry and angry, unless a teacher holds them to it?
