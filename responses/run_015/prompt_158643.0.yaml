  2.  **Deconstruct the Sentence:**
      *   "A norm is just a coordination equilibrium..." -> Identifies norms with game-theoretic equilibria (Lewisian conventions).
      *   "...that forgot the problem it solved." -> Suggests the original functional justification (the coordination problem) is no longer present or recognized, yet the norm persists.
      *   **Context:** Used to *dismiss objections* to *preserving* an archaic convention. This is crucial. The speaker is arguing *for* keeping the norm, despite it being archaic/useless now.
      *   **Implication:** "It doesn't matter that the problem is gone; it's a norm now, so keep it." OR "The fact that it persists proves it still serves a function (even if forgotten)."

  3.  **Analyze Lewis's Account of Convention (Background Knowledge):**
      *   **Convention:** A regularity $R$ in population $P$ in situation $S$.
      *   **Conditions:**
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on condition that others do (coordination problem).
          4.  There is an alternative regularity $R'$ that could have solved the problem (arbitrariness).
          5.  Common knowledge of 1-4.
      *   **Key Insight:** Conventions solve coordination problems. If the problem disappears, the reason for the convention disappears. However, inertia might keep it going if expectations remain.

  4.  **Develop Interpretations (The "Menu"):**

      *   *Interpretation A: The Functionalist/Historical Reading (The "Fossil" View).*
          *   Meaning: Norms originate as solutions to problems. The problem vanishes, but the norm stays due to inertia/habit.
          *   Verdict on Truth: Substantive/Plausible sociologically, but technically distinct from Lewis's active definition.
          *   Argumentative Work: If the norm is *just* a fossil, why keep it? This reading usually supports *changing* the norm. But the speaker used it to *preserve* it. So, this reading doesn't fit the rhetorical goal unless combined with conservatism ("don't fix what isn't broken").
          *   Lewis Features: Retains origin story. Drops the requirement for *current* preference for coordination.

      *   *Interpretation B: The Self-Sustaining Equilibrium Reading (The "Expectations" View).*
          *   Meaning: The "problem" is no longer the original external one, but the problem of *predicting others*. As long as we expect others to follow it, following it is rational to avoid miscoordination (even if the stakes are low).
          *   Verdict: Substantive Lewisian claim.
          *   Argumentative Work: Supports preservation. Even if the original utility is gone, the *coordination* utility remains (avoiding confusion).
          *   Lewis Features: Retains mutual expectations and preference for conformity. Distorts "problem" (shifts from external utility to internal consistency).

      *   *Interpretation C: The Mystification/Ideology Reading (The "Forgotten" View).*
          *   Meaning: The norm persists irrationally. We follow it blindly.
          *   Verdict: False (norms aren't *just* this) or Cynical.
          *   Argumentative Work: Usually critiques norms. Using it to *defend* a norm is ironic or implies "might makes right."
          *   Lewis Features: Drops rational preference conditions entirely.

      *   *Interpretation D: The "Coordination is the Point" Reading (The Pragmatic View).*
          *   Meaning: It doesn't matter *what* we coordinate on, only *that* we coordinate. The specific problem solved is irrelevant compared to the value of having *a* solution.
          *   Verdict: Near-platitude within Lewisian framework.
          *   Argumentative Work: Strong support for preservation. Switching costs outweigh archaic nature.
          *   Lewis Features: Retains arbitrariness and preference for coordination over miscoordination.

  5.  **Address Specific Prompt Requirements:**
      *   *Distinguish Automatic vs. Contingent Persistence:*
          *   Automatic: Norms stick like glue once formed (Habits).
          *   Contingent: Norms stick only as long as expectations hold (Equilibria).
      *   *Which supports dismissing objections?* The Contingent/Equilibrium reading (Interpretation B/D). If it's automatic, it's mindless. If it's equilibrium, it's rational to keep it to avoid miscoordination.
      *   *Which was likely invoked?* The speaker wants to stop debate. Likely invoked the "Equilibrium" reading to imply rationality, but relied on the "Forgotten" phrasing to suggest the objection is pedantic (focusing on the *old* problem rather than the *current* equilibrium).
      *   *Lewis Features:* Need to map Mutual Expectations, Arbitrary Alternatives, Preference for Coordination for each interpretation.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Set the stage. The sentence is pithy but ambiguous.
      *   *Interpretation 1: The Inertial Fossil (Automatic Persistence).*
          *   Thesis: Norms persist via habit after utility expires.
          *   Verdict: Sociologically plausible, Lewisianly incomplete.
          *   Lewis Features: Drops "Preference for coordination" (now it's just habit).
          *   Argumentative Force: Weak for preservation (implies irrationality).
      *   *Interpretation 2: The Second-Order Coordination (Contingent Persistence).*
          *   Thesis: The "problem" is now avoiding the cost of switching, not the original issue.
          *   Verdict: Substantive Lewisian claim.
          *   Lewis Features: Retains Expectations and Preference. Redefines "Problem."
          *   Argumentative Force: Strong for preservation.
      *   *Interpretation 3: The Arbitrary Regularity (Platitude).*
          *   Thesis: Any arbitrary regularity counts if it coordinates.
          *   Verdict: Near-platitude.
          *   Lewis Features: Retains Arbitrariness.
          *   Argumentative Force: Moderate.
      *   *Comparison:* Automatic vs. Contingent. The speaker needs Contingent to claim rationality.
      *   *Likely Invocation:* A blend. Using the "forgotten" line to dismiss the *content* of the objection, while relying on the "equilibrium" label to imply *stability*.
      *   *Lewis Feature Audit:* Be specific about what gets dropped (the specific original utility) vs. retained (the structure of expectations).

  7.  **Refining the "Verdicts":**
