answer: |-
  ### Menu of Interpretations

  The sentence "A norm is just a coordination equilibrium that forgot the problem it solved" is rhetorically potent because it conflates the *genesis* of a norm with its *maintenance*. In the context of a seminar objection regarding an archaic grammatical convention, the speaker is attempting to block a proposal to abandon the convention. Below are three distinct interpretations of the thesis, analyzed for their truth value, their argumentative utility, and their fidelity to David Lewis's account of convention.

  #### 1. The Historical Fossil Thesis (Automatic Persistence)
  *   **The Thesis:** Norms originate as solutions to coordination problems, but once established, they acquire inertia. They persist through habit or institutional momentum even after the original functional justification has vanished. The "forgetting" is literal: the population no longer knows *why* they follow the norm, nor do they currently benefit from it.
  *   **Verdict:** **Substantive claim (sociologically plausible, Lewisianly incomplete).** While sociologically accurate regarding many traditions, this contradicts the strict Lewisian definition of convention, which requires a *current* preference for conformity conditional on others' conformity.
  *   **Lewisian Features:**
      *   *Mutual Expectations:* **Retained** (people expect others to follow it), but decoupled from rational preference.
      *   *Arbitrary Alternatives:* **Retained** (historically), but irrelevant to current choice.
      *   *Preference for Coordination:* **Dropped.** If the problem is solved/gone, there is no longer a payoff for coordinating over miscoordinating regarding this specific rule.
  *   **Argumentative Work:** This reading **fails** to support dismissing objections to abandoning the norm. If the norm is merely a fossil with no current coordinating function, the rational move is to discard it. Using this interpretation would undermine the speaker's goal unless paired with a separate conservative premise (e.g., "tradition has intrinsic value").

  #### 2. The Switching-Cost Equilibrium Thesis (Contingent Persistence)
  *   **The Thesis:** The "problem" the norm solves has shifted. It no longer solves the *original* external problem (e.g., distinguishing social classes or clarifying archaic syntax), but it currently solves the *internal* problem of avoiding miscoordination. The norm persists not automatically, but contingently: it remains an equilibrium because the cost of switching to a new convention (miscoordination during the transition) outweighs the benefit of fixing the archaic feature. We have "forgotten" the original problem, but we retain a preference for conformity to avoid confusion.
  *   **Verdict:** **Substantive claim defensible within a Lewis-style analysis.** This aligns with Lewis's insight that conventions are self-perpetuating as long as expectations align. It treats the "forgetting" as irrelevant to the *current* rationality of the equilibrium.
  *   **Lewisian Features:**
      *   *Mutual Expectations:* **Retained.** Everyone expects everyone else to keep using the archaic form.
      *   *Arbitrary Alternatives:* **Retained.** We *could* change the grammar, but we haven't.
      *   *Preference for Coordination:* **Retained.** Agents prefer to use the archaic form if others do, to avoid communication breakdowns.
  *   **Argumentative Work:** This reading **successfully supports** dismissing objections. It argues that abandoning the norm incurs a coordination cost that outweighs the benefit of modernizing. It frames the objection as focusing on the *history* of the norm rather than its *current game-theoretic stability*.

  #### 3. The Definitional Platitude Thesis (Arbitrariness Focus)
  *   **The Thesis:** The specific utility of a norm is irrelevant to its status as a norm. All conventions are arbitrary solutions; therefore, questioning the specific utility of *this* solution misses the point of what a convention is. The sentence is merely reminding the objector that norms are defined by their equilibrium status, not their ongoing utility.
  *   **Verdict:** **Near-platitude.** It is nearly tautological within a Lewisian framework to say conventions are arbitrary equilibria. However, the phrase "forgot the problem" adds a misleading historical claim that makes it less than a pure platitude.
  *   **Lewisian Features:**
      *   *Mutual Expectations:* **Retained.**
      *   *Arbitrary Alternatives:* **Emphasized.**
      *   *Preference for Coordination:* **Distorted.** It implies the preference is for *having a rule*, any rule, rather than for the specific payoff of the current rule.
  *   **Argumentative Work:** This reading supports dismissing objections by **shifting the burden of proof**. It implies the objector is demanding a functional justification for something that is, by definition, functionally arbitrary.

  ---

  ### Analysis of Persistence: Automatic vs. Contingent

  To understand which reading shuts down the discussion, we must distinguish how each treats the norm's persistence.

  *   **Automatic Persistence (Interpretation 1):** This treats the norm as a behavioral reflex. Once the equilibrium is established, it runs on "autopilot."
      *   *Implication:* If persistence is automatic, the norm is fragile against rational scrutiny. If someone points out the problem is gone, the spell is broken, and the norm should collapse.
      *   *Support for Speaker:* **Low.** This invites the objection rather than dismissing it.

  *   **Contingent Persistence (Interpretation 2):** This treats persistence as dependent on continued common knowledge of a preference for conformity. The norm survives only because everyone *still* prefers not to be the odd one out.
      *   *Implication:* The norm is robust. Even if the original reason is forgotten, the *current* reason (avoiding miscoordination) is active.
      *   *Support for Speaker:* **High.** This validates the norm as rational *now*, regardless of its history.

  ### Likely Invoked Interpretation

  The interpretation likely invoked to shut down the discussion is a **rhetorical hybrid of Interpretation 2 and Interpretation 3**, relying on the ambiguity of the word "just."

  The speaker likely intended the audience to hear the **Lewisian authority** of Interpretation 2 (that the norm is a stable equilibrium supported by current expectations) while using the dismissive tone of Interpretation 3 (that the specific justification is irrelevant). By saying the norm "forgot the problem," the speaker acknowledges the objection (yes, the original problem is gone) but neutralizes it (that doesn't matter, because it's still an equilibrium).

  **Why this shuts down discussion:**
  It frames the objection as category error. The objector is arguing about *utility* (the forgotten problem), while the speaker claims the domain is *stability* (the equilibrium). It suggests that demanding a functional reason for an archaic convention is like demanding a functional reason for driving on the right side of the road rather than the left—the specific side doesn't matter, only that we agree.

  ### Audit of Lewisian Features in the Likely Invocation

  In the rhetorical move actually made by the seminar participant, the features of Lewis's account are manipulated as follows:

  1.  **Mutual Expectations:** **Retained.** The speaker assumes everyone still expects the archaic convention to be used. This is the engine of the "equilibrium."
  2.  **Arbitrary Alternative Solutions:** **Distorted.** Lewis emphasizes arbitrariness to show that *any* solution works. The speaker uses this to imply that *this specific* archaic solution is as good as any new one, ignoring the potential long-term benefits of the proposed change.
  3.  **Preference for Coordination over Miscoordination:** **Silently Dropped/Shifted.** Lewis requires a preference for coordination *in the specific situation*. The speaker shifts this to a general preference for *status quo* coordination. They assume the cost of switching (temporary miscoordination) is higher than the cost of keeping the archaic norm, without proving it. This is the weak point of the argument: they treat the equilibrium as self-justifying, whereas Lewis would require showing that the preference for conformity *still* outweighs the preference for the alternative.

  **Summary Verdict:** The sentence functions as a **substantive claim (Interpretation 2)** disguised as a **platitude (Interpretation 3)**. It is valid only if the "forgotten problem" has been replaced by a "new problem" (the cost of switching). If taken literally as Interpretation 1 (a fossil with no current coordinating value), the sentence describes a norm that ought to be abandoned, thereby defeating the speaker's own purpose.
