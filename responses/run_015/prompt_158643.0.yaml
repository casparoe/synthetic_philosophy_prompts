      *   Is it a menu, not a single selection? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the phrase "forgot the problem." In Lewis's view, if the problem is truly gone, the convention *should* dissolve unless a new problem (like switching costs) replaces it. The sentence implies the *memory* is gone, not necessarily the *structural need*. I must clarify this distinction in the analysis. The speaker is likely arguing that the *original* justification doesn't matter, only the *current* equilibrium status matters.

