          *   Identify which reading supports dismissing objections to abandoning the norm.
          *   Identify which interpretation was likely invoked to shut down discussion.
          *   Analyze features of Lewis's account (mutual expectations, arbitrary alternatives, preference for coordination) in each reading (retained, distorted, dropped).
          *   Format: Menu of interpretations with verdicts (not a single selection).
