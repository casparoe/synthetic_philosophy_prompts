  # Part 1: The Logical Grid

  To avoid sorting by label, we first map the logical space. We use four binary axes. These generate 16 possible cells ($2^4$). Below, we locate the historical positions within this grid and explain why some cells remain empty.

  **The Four Diagnostic Axes:**
  1.  **Counterfactuals of Freedom (CCFs):** Are there true propositions about what a free agent *would* do in a non-actual circumstance (e.g., "If Alice were offered the bribe, she would freely take it")?
  2.  **Independence:** Are these truths independent of God's will (He finds them) or dependent (He makes/decides them)?
  3.  **Determinism:** Does God causally determine the specific choices agents make?
  4.  **Exhaustive Foreknowledge:** Does God know the entire actual future with certainty prior to creation?

  **The Grid of Positions:**

  | CCFs True? | Independent? | Determinism? | Foreknowledge? | Position(s) | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Yes** | **Yes** | **No** | **Yes** | **Molinism, Grounded Nature, Brute CCFs** | **Occupied** |
  | **Yes** | **No** | **No** | **Yes** | **Congruism** | **Occupied** |
  | **Yes** | **No** | **Yes** | **Yes** | *(Collapse)* | **Empty** (Incoherent: If God determines the choice, it is not a *free* counterfactual in the libertarian sense required for "Yes" here.) |
  | **Yes** | **Yes** | **No** | **No** | **Epistemic Limit (The Hole)** | **Occupied** (Niche: Truths exist, but are unknowable even to God.) |
  | **No** | **N/A** | **Yes** | **Yes** | **Thomism, Calvinism** | **Occupied** |
  | **No** | **N/A** | **No** | **Yes** | **Simple Foreknowledge, Ockhamism, Eternalism** | **Occupied** |
  | **No** | **N/A** | **No** | **No** | **Open Theism** | **Occupied** |
  | **Yes** | **Yes** | **Yes** | **Yes** | *(Collapse)* | **Empty** (Incoherent: Contradiction between "Free CCF" and "Determined".) |
  | **Yes** | **No** | **Yes** | **No** | *(Unattractive)* | **Empty** (God determines but doesn't know? Theologically unstable.) |
  | **No** | **N/A** | **Yes** | **No** | *(Unattractive)* | **Empty** (Determinism usually implies knowability.) |

  **Notes on Empty/Clustered Cells:**
  *   **Thomism vs. Calvinism:** Both occupy the [No CCF / Dependent / Yes Det / Yes FK] cell. They differ on the metaphysics of grace (Premotion vs. Decree), not the logical structure of knowledge.
  *   **Simple Foreknowledge vs. Ockhamism vs. Eternalism:** All occupy [No CCF / Independent / No Det / Yes FK]. They differ on *how* God knows (observation vs. soft facts vs. timelessness), not on the truth values.
  *   **Molinism vs. Grounded Nature:** Both occupy [Yes CCF / Independent / No Det / Yes FK]. Molinism is often agnostic on grounding; the "Grounded Nature" view insists the agent's essence provides the truth.

