answer: |-
  yes, you're conflating constitution with causation. Phenomenal bonding is posited as a fundamental relation where micro-subjects constitute the macro-subject, not cause it. Emergentism typically implies consciousness arises from non-conscious physical processes, whereas panpsychism maintains consciousness is fundamental throughout. The macro-subject's existence dependent on bonding doesn't imply causal production from non-experiential bases, but rather structural composition of experiential bases. Causal production implies temporal generation, whereas bonding is synchronic constitution. Thus, the view avoids brute emergence by ensuring consciousness never originates from non-conscious matter, preserving its distinctiveness as a fundamental feature of reality rather than a novel causal product. This preserves consciousness as ubiquitous.
