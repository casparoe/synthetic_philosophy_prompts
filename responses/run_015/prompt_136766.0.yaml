  2. This framework inflates the causal efficacy of marginal ideas that align with modern institutions while suppressing contemporaneously dominant theories that led nowhere, differing from anachronism by distorting causal weight rather than conceptual definition. Scholars broadly reject this inflation, yet debate persists over whether any historical synthesis can avoid privileging lines of descent that survive.
  3. Teleological drag flattens the contingency of institutional breakthroughs by presenting them as inevitable culminations rather than fragile compromises, whereas ordinary anachronism simply misattributes the timing of such changes. It is generally accepted that Whig history obscures contingency, but methodologists disagree on whether eliminating all narrative teleology is possible for coherent explanation.
  4. Agents are morally weighted by their contribution to the present trajectory rather than their own ethical frameworks, creating a tension between retrospective utility and contemporaneous intention distinct from simple moral anachronism. Historians broadly critique this moralizing, though some argue that selective emphasis on progressive agents is unavoidable for normative political history.
  5. The phenomenon constructs artificial continuities between disparate institutional phases to smooth the trajectory toward the present, differing from anachronism by manufacturing structural coherence rather than misidentifying specific elements. While the distortion of continuity is widely acknowledged, the extent to which historians can write without imposing some retrospective order remains a live methodological dispute.
