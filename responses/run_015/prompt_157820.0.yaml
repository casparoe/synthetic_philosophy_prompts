answer: |-
  Here's the case you can make to your roommate. It shifts the frame from "rigidity vs. flexibility" to "structural hierarchy."

  ***

  Look, your roommate's intuition is common, but it's structurally backwards. She's treating sphexishness like a bug in the system, when it's actually the operating system. The argument isn't that humans *aren't* sphexish; it's that human free will is built out of stacked layers of sphexishness, managed by higher-level override protocols.

  Here's the breakdown:

  **1. Pure Flexibility is Just Noise**
  If you define free will as the total absence of rigid scripts, you don't get freedom—you get arbitrariness. Imagine trying to play a piano concerto if you had to consciously calculate the physics of every finger movement in real-time. You wouldn't be "free"; you'd be paralyzed. To have the freedom to play the music, you need the rigidity of muscle memory. You need sub-routines that run automatically. Without those fixed, sphexish loops at the lower level, higher-level choice dissolves into static. You can't choose *where* to go if you don't have a rigid protocol for how to walk.

  **2. Freedom is Hierarchical, Not Horizontal**
  The mistake is looking at behavior as a single flat line. It's not. It's a stack.
  *   **Layer 1 (Bottom):** Biological and motor routines. (Breathing, walking, gripping). These are highly sphexish. They are rigid scripts.
  *   **Layer 2 (Middle):** Habitual responses. (Driving a familiar route, typing common words).
  *   **Layer 3 (Top):** Strategic selection. (Deciding to drive to the coast instead of work).

  Human free will isn't the absence of Layer 1 rigidity; it's the ability of Layer 3 to select *which* Layer 1 scripts get run. The wasp isn't unfree because it has rigid sub-routines. We have those too. The wasp is unfree because it lacks the hierarchical stack. It has no Layer 3. It cannot interrupt the Layer 1 script ("check burrow") even when the context changes.

  **3. Stability Enables Selection**
  You need a stable substrate to make a meaningful choice. If every action required a fresh, novel decision, there would be no continuity of self to do the choosing. You'd be a different entity every millisecond. Sphexishness provides the continuity. It stabilizes the lower levels so energy and processing power can be spent on the higher-level selection. The rigidity isn't the cage; it's the floor you stand on to look over the wall.

  **4. The Wasp's Deficit is Structural, Not Behavioral**
  So, why does the wasp look like a zombie? Not because it follows a script. We follow scripts all day (try stopping your heart rate voluntarily). The wasp lacks free will because its rigidity is monolithic. It's a single loop with no error-checking subroutine above it. Humans have "meta-routines." We have scripts that check if our other scripts are working. When the cricket moves, a human has a higher-level protocol that says, "The context changed, abort the drag script." The wasp lacks that specific hierarchical rigidity—the rigidity of an override switch.

  **The Bottom Line**
  Tell her this: Sphexishness isn't the enemy of free will. It's the raw material. A machine made entirely of fluid, flexible jelly can't do anything. A machine made of rigid gears can do something. A machine made of nested systems of rigid gears, where one set of gears can shift the alignment of another, can make choices.

  We aren't free because we escape patterns. We're free because we have enough structured rigidity to build patterns complex enough to break them when it counts.
