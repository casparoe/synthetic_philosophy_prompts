answer: |-
  The rain battered the window of the stratigraphy lab, blurring the city lights into streaks of gray. Maya tapped a core sample on the steel table. Jules leaned against the doorframe, arms crossed, holding a lukewarm paper cup.

  **Maya:** Youre missing the point of the GSSP. It isnt about narrative. Its about correlation. If we pick a boundary, it has to be synchronous. Global. The radionuclide spike from the bomb tests in 1950 is the only signal that hits every sediment sink on the planet at the same geological instant.

  **Jules:** Synchronous for who? The bombs fell everywhere, sure. But the damage started centuries prior. You want to put a golden spike in 1950 because its clean on a graph. But picking a date is never just science, Maya. Its political. By choosing the Great Acceleration, you let the engines of the nineteenth century off the hook.

  **Maya:** I dont let anyone off the hook. Im a geologist. I read rock. If we start the epoch with early coal use in the 1800s, the signal is diachronous. It shows up in Britain decades before it shows up in Japan or the Andes. How do we mark a boundary that arrives at different times? Stratigraphy needs a horizon, not a fog.

  **Jules:** A fog is more honest. Look, if you start the clock in 1950, you erase the colonial mining economies. You erase the plantation systems that reshaped the nitrogen cycle and the soil profiles long before Oppenheimer. Thats not just a scientific choice. Thats a verdict on history. Youre saying the real change only counts when the Global North decided to go nuclear.

  **Maya:** (Slams hand on the table) The rock doesnt care about your guilt, Jules. Stratigraphic boundaries are correlation tools. They are handles we use to talk about time slices across continents. If we start mixing moral accounting into the definition of a series or epoch, we corrupt the utility of the science. Then its not geology anymore. Its activism dressed in lab coats.

  **Jules:** And who decides what counts as science? Thats the real fight. You think the International Commission on Stratigraphy should have sole authority? A room of mostly western geologists voting on when the human species broke the planet?

  **Maya:** They are the experts in the rock record. Yes.

  **Jules:** But they arent experts in the human record. If were defining a human age, climate scientists need to be there. Historians. And definitely Indigenous knowledge councils. They hold the memory of the land before the spike. They know when the rivers changed, when the fish died. That data is in the oral history, not just the ice core.

  **Maya:** Oral history doesnt leave a global marker in the lithosphere. I get it, you want restorative justice. I do too. But you cant legislate it through the Precambrian-Cambrian boundary working group. If we dilute the criteria to include social factors, the Anthropocene never gets ratified. It stays a buzzword. I want it in the rock. I want it undeniable.

  **Jules:** Undeniable to whom? If you pick 1950, you make it undeniable that science changed the world. You make it deniable that empire did. Youre protecting the institution. You want the ICS to hold the keys because you trust the method more than the people.

  **Maya:** I trust the method because people lie. Rocks dont. If we open the table to everyone, we spend fifty years debating philosophy while the ice melts. We need a marker. Plutonium-239 is that marker. Its sharp. Its everywhere.

  **Jules:** Its convenient. It centers the Cold War. It centers the laboratory. It ignores the sugar mills and the silver mines that stripped the hills bare. You say its not a moral verdict, Maya. But silence is a verdict. Choosing 1950 says the prior three hundred years of extraction were just... background noise.

  **Maya:** (Sighs, rubbing her temples) I know the history, Jules. I read your papers. But I cant put a plantation into a stratotype section. I can put a radionuclide peak. If we want to talk about blame, go to the history department. If you want to talk about the Earth system entering a new state, talk to me. But dont ask me to bend the definition of an epoch to fix a political problem.

  **Jules:** The political problem is the Earth system. You think you can separate the two? The reason we have a plutonium spike is because of the political decisions made in the 1940s. The reason we have carbon in the ice is because of the decisions made in the 1700s. You want the authority to decide the start date to rest with the geologists alone. I say the table has to be bigger.

  **Maya:** If the table is bigger, we never agree. And then the Anthropocene remains informal. And then, frankly, its easier for the oil companies to ignore. A formal epoch carries legal and regulatory weight eventually. I want the spike so we can point at it and say "here." Not "somewhere around the time Columbus sailed."

  **Jules:** You want a clean cut. Life doesnt offer clean cuts. Youre trying to slice through a knot with a laser because you dont want to touch the rope.

  **Maya:** Im trying to make sure the rope is visible in the record a million years from now. Whether they judge us for it isnt my job. My job is making sure they know we were there.

  **Jules:** And my job is making sure they know what we did. If the date doesnt match the crime, the record is a lie.

  **Maya:** Then maybe the rock isnt the place you look for justice.

  **Jules:** (Takes a sip of cold coffee) Then maybe the rock isnt the only place we should be looking.

  Maya turned back to the core, the laminated layers of silt and ash silent under the fluorescent light. Jules pushed off the doorframe, leaving the cup on the desk. Neither moved to pick it up.
