  ### Epistemic Flags

  *   **Settled Convention:** That transitivity is a standard axiom of rationality and decision theory (Expected Utility, Social Choice). Denying it requires extraordinary evidence.
  *   **Genuinely Contested:** Whether "better than" is a vague relation (Broome vs. standard semantics) and whether "parity" is a fourth value relation distinct from "better," "worse," and "equal" (Chang vs. standard axiology).
  *   **Number Exceeding Reasons:** The specific probabilities (0.60, 0.50) are illustrative weights. There is no empirical data to calibrate them; they reflect the current philosophical stalemate. The headline 0.17 should be read as "Low probability, but non-negligible philosophical risk."
