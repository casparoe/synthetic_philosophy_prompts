prompt: |-
  Okay so I'm subbing for a friend's intro discussion section next Thursday — 22 undergrads, 60 minutes, regular classroom with chairs we can move around but basically no tech I can count on. Last week they wasted like 15 minutes deadlocked over which of two identical review guides to use because nobody wanted to pick without a reason, so I figured I might as well turn that into the lesson.

  Can you put together a live in-person game where they end up stuck like that donkey between two equal hay piles and have to find a way out themselves? I want them to actually feel how annoying it is to wait for a decisive reason, and why just picking something can be the smarter move, without me lecturing about it first.

  Give me a minute-by-minute rundown, what cheap stuff to bring, how to do the debrief so it clicks back to the whole choosing without a preference thing, plus a heads up on what usually goes sideways the first time and what part of the puzzle this kind of exercise just cant capture and I'll have to fill in myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Subbing for an intro discussion section (22 undergrads, 60 mins).
      *   **Setting:** Regular classroom, movable chairs, low/no tech reliability.
      *   **Problem:** Last week, the class wasted 15 minutes deadlocked over choosing between two *identical* review guides (analysis paralysis/decision avoidance).
      *   **Goal:** Create a live in-person game/exercise where students experience being stuck between two equal options ("Buridan's Ass" scenario) and must find a way out themselves.
      *   **Key Constraint:** Do *not* lecture first. Let them feel the annoyance.
      *   **Deliverables:** Minute-by-minute rundown, cheap materials list, debrief strategy, potential pitfalls ("what goes sideways"), and limitations of the exercise ("what it can't capture").

  2.  **Deconstruct the Core Concept:**
      *   The phenomenon is "Analysis Paralysis" or "Decision Avoidance due to Lack of Differentiation."
      *   The philosophical reference is "Buridan's Ass" (a donkey starving between two identical piles of hay).
      *   The learning objective is: When options are effectively equal, the cost of *deciding* is lower than the cost of *delaying*. Action > Perfection in low-stakes scenarios.

  3.  **Design the Activity:**
      *   *Need:* Two options that appear distinct but are functionally identical for the task at hand.
      *   *Need:* A consequence for waiting (time pressure or missed opportunity).
      *   *Need:* Group dynamics (since the original issue was a class deadlock).
      *   *Idea:* A resource allocation game. Give them a task that requires a "tool," but offer two "tools" that are the same.
      *   *Refinement:* Let's make it about *consensus*. The original problem was the *group* couldn't pick. So the game should require group consensus on a choice before proceeding.
      *   *The "Trap":* Offer two envelopes/boxes. Inside are instructions. The instructions are the same (or lead to the same outcome). But they don't know that.
      *   *The Twist:* To make it feel like the original incident, the choice needs to seem meaningful but be trivial.
      *   *Activity Name:* "The Twin Envelope Protocol."

  4.  **Drafting the Minute-by-Minute Plan:**
      *   *0-5:* Setup & Hook. Get them in groups. Explain the stakes (small prize or just bragging rights).
      *   *5-20:* The Deadlock. Present the choice. Enforce the rule: "You must agree on *which* option before opening." Watch them struggle.
      *   *20-25:* The Breakthrough. Someone usually snaps and picks. Let them proceed.
      *   *25-40:* The Task. They do the actual work inside the envelope (keep it simple, like a puzzle or discussion prompt).
      *   *40-60:* Debrief. Connect the frustration to the review guide incident.

      *Critique of Draft:* 20 minutes of deadlock might be too long for a 60-minute class. If they pick too fast, the lesson fails. If they pick too slow, we run out of time. I need to engineer the deadlock more carefully.
      *Adjustment:* Make the choice *public* and *binding*. "Group A, pick Red or Blue." "Group B, pick..." No, the original issue was the *whole class* deadlocked. Let's replicate that. The *whole class* must decide on one path for everyone.
      *Revised Activity:* "The Class Constitution." Two proposals. They look different (titles/colors) but the text is identical. The class must vote unanimously (or near unanimously) to proceed.
      *Wait, better idea:* "The Resource Scramble." Two piles of materials. They look different (e.g., Red Cards vs. Blue Cards). They need to pick one pile to build something. The cards are functionally identical. The class must agree on which pile to use.
      *Actually, let's go simpler:* "The Two Doors." Two physical paths/boxes.
      *Let's stick to the "Review Guide" parallel:* Two handouts. "Version A" and "Version B."
      *Activity:* "The Consensus Challenge."
      1.  Divide into small groups (4-5 people).
      2.  Give each group a choice: Task X or Task Y.
      3.  Task X and Task Y are identical instructions, just labeled differently.
      4.  *Crucial Rule:* They cannot start until they have a *reason* for their choice written down.
      5.  *Timer:* Visible countdown.
      6.  *Outcome:* They will waste time looking for differences.
      7.  *Reveal:* The tasks are the same.

      *Wait, the prompt asks for the WHOLE CLASS to feel the deadlock like last week.*
      Okay, let's make it a whole-class decision.
      *Scenario:* We need to solve a puzzle. We have two keys. Only one key works? No, both work. But they think only one works or one is better.
      *Let's try "The Blind Vote."*
      1.  Put two boxes at the front. Box 1 and Box 2.
      2.  Tell them: "Inside one box is the answer key/hint for the final puzzle. Inside the other is a distractor. You have 10 minutes to decide as a class which box to open. You cannot open both."
      3.  *Truth:* Both boxes contain the exact same hint.
      4.  *Constraint:* They must agree on *why* they picked that box.
      5.  *Result:* They will scour the boxes for clues. They will debate. They will stall.
      6.  *Resolution:* Eventually, someone says "It doesn't matter, just pick one."
      7.  *Debrief:* Connect to the review guide.

      *Refining the Time:* 60 mins is tight.
      0-5: Intro/Groups.
      5-20: The Deadlock (The Game).
      20-30: The Reveal & Task.
      30-60: Debrief & Discussion.
      *Actually, I need them to feel the annoyance.* I should let the deadlock run until it becomes painful (around 15 mins, mirroring last week).

  5.  **Materials:**
      *   Two identical boxes/bags.
      *   Identical papers inside.
      *   Timer (phone/projector if working, else watch).
      *   Whiteboard for tallying arguments.

  6.  **Debrief Strategy:**
      *   Ask: "How did that feel?" (Frustrating, wasteful).
      *   Ask: "What was the actual difference?" (None).
      *   Ask: "What was the cost of waiting?" (Time, energy).
      *   Connect to Review Guide: "Same situation. Cost of picking wrong = 0. Cost of not picking = 15 mins."
      *   Concept: "Satisficing" vs. "Maximizing."

  7.  **Potential Pitfalls:**
      *   They pick too fast (need to enforce the "must give a reason" rule).
      *   They get angry (need to manage tension).
      *   They think it's a trick (need to be honest in debrief).
      *   Tech fails (have a backup timer).

  8.  **Limitations:**
      *   Real life sometimes differences *do* matter.
      *   Group dynamics vary (some groups are decisive).
      *   Doesn't teach *how* to decide, just *that* deciding is better.

  9.  **Final Polish:**
      *   Make sure the tone is supportive, not punitive.
      *   Ensure the "trap" is ethical (debrief must reveal the truth immediately after).
      *   Name the exercise something catchy. "The Buridan Box."

      *(Self-Correction during drafting)*: I need to make sure I don't lie to them. I can't say "One is better." I have to say "Choose one to proceed." The ambiguity creates the paralysis.
      *Better framing:* "We need to move forward. There are two paths. Pick one." The lack of differentiation is the key.
      *Rule to enforce deadlock:* "I will not accept a choice without a justification." This forces them to invent reasons for non-existent differences.

      *Let's finalize the plan.*
      *   **Activity:** "The Twin Proposals."
      *   **Setup:** Two colored folders (Red/Blue). Inside: Identical discussion prompt.
      *   **Rule:** Class must unanimously agree on a folder AND provide a written rationale before anyone can read the prompt.
      *   **Time:** 15 mins hard stop on decision.
      *   **Debrief:** Reveal identity. Discuss opportunity cost.

      *Wait, 22 students is a lot for unanimous consensus.* That guarantees deadlock. Perfect.
      *What if they refuse to play?* Frame it as "Today's participation grade depends on completing the prompt inside." Stakes needed.

      *Okay, let's write it out.*

      *Materials:* 2 folders, 1 sheet of paper (copied twice), whiteboard, marker.
      *Time:* 60 mins.
      *Structure:*
      1.  Setup (5)
      2.  The Deadlock Game (15)
      3.  The Reveal & Task (10)
      4.  The Debrief (30)

      *Wait, 30 mins debrief is too long.*
      1.  Setup (5)
      2.  Deadlock (15)
      3.  Reveal (5)
      4.  Task (15)
      5.  Debrief (20)
      *Total 60.*

      *What goes sideways:*
      *   Cynicism ("This is stupid").
      *   Dominant voices taking over.
      *   Running out of time before the reveal.

      *What it can't capture:*
      *   Emotional attachment to options.
      *   High-stakes consequences (this is low stakes).
      *   The instructor's role in breaking ties.

      *Okay, ready to generate response.*
answer: |-
  Here is a complete lesson plan designed to replicate that specific frustration, force a breakthrough, and turn it into a learning moment without you needing to preach.

  ### Activity Name: "The Twin Folders"
  **Core Concept:** Experiential learning on *Analysis Paralysis* and *Opportunity Cost*.
  **Class Size:** 22 Undergrads
  **Time:** 60 Minutes
  **Tech Requirement:** None (Bring a physical watch or phone for timing).

  ---

  ### 1. Materials List (Cheap & Analog)
  *   **Two Folders:** One Manila, one colored (e.g., Red). Or just two pieces of cardstock.
  *   **Two Identical Sheets:** Print the exact same text on two pieces of paper. (See *Content* below).
  *   **Whiteboard & Markers:** To track "Reasons for Choice."
  *   **A Visible Timer:** Your phone on a desk or a watch held up.
  *   **The "Stakes":** Tell them the paper inside contains the **only** prompt for today's participation credit.

  **The Content (Inside the Folders):**
  > *"Discuss the following: What is one assumption you made this week that turned out to be wrong? Write down your group's consensus answer on one sheet of paper to submit at the end."*
  > *(Note: It doesn't matter what the text says, as long as it is identical in both folders.)*

  ---

  ### 2. Minute-by-Minute Rundown

  **0:00 – 0:05: Setup & Stakes**
  *   Arrange chairs in a large U-shape or circle so everyone can see the front.
  *   Place the two folders on a desk at the front. Label them **"Option A"** and **"Option B"** on the board.
  *   **Script:** "Good morning. Today is student-led. Inside one of these folders is the discussion prompt for today. To get participation credit, the class must complete the task inside. However, there is a rule: **The class cannot open a folder until you have reached a consensus on which one to use, AND you must write a justification on the board for why you picked it.** I will not accept 'random choice' as a justification. You have 15 minutes to decide."
  *   Start the timer visibly. Step back. Do not offer opinions.

  **0:05 – 0:20: The Deadlock (The Trap)**
  *   **Watch the room.** They will immediately start looking for differences. "Is one thicker?" "Did she hold one longer?" "Is Option A usually the right one?"
  *   **Your Role:** Be a bureaucratic gatekeeper. If they shout "Let's just pick A!", you say: "I need a reason written on the board." If they say "They look the same," you say: "Then there must be a reason to pick one over the other. Time is ticking."
  *   **Goal:** Let them feel the tension rise. Let 10 minutes pass. Watch the frustration build. This mirrors the review guide incident.
  *   **The Break:** Around minute 13-14, someone usually snaps and says, "It doesn't matter, the cost of waiting is too high." Or they invent a fake reason just to satisfy you.
  *   **At Minute 15:** Blow a whistle or clap. "Decision made? Open it."

  **0:20 – 0:30: The Reveal & The Task**
  *   A student opens the chosen folder. They read the prompt.
  *   **The Twist:** Immediately hold up the *other* folder. "Before you discuss, look at this." Open Option B. Show them the paper is **identical**.
  *   **Script:** "The prompts are the same. The options were identical."
  *   Give them 10 minutes to actually do the discussion prompt (the "assumption" question). This calms the energy and gets them working.

  **0:30 – 0:50: The Debrief (Where the Learning Happens)**
  *   Bring the class back together. Do not move chairs.
  *   **Phase 1: Emotional Check-in.**
      *   "Raise your hand if you felt annoyed during the first 15 minutes."
      *   "Raise your hand if you felt like you were wasting time."
      *   "What were you hoping would happen? What were you looking for?" (Write answers on board: *Clues, Hidden meaning, Permission*).
  *   **Phase 2: The Math of Decision Making.**
      *   Draw a simple equation on the board: **Cost of Waiting vs. Cost of Being Wrong.**
      *   "In the first 15 minutes, what was the cost of being wrong?" (Answer: Zero. The papers were the same).
      *   "What was the cost of waiting?" (Answer: 15 minutes of class time, frustration, mental energy).
      *   "So, logically, what was the smarter move at minute 2?"
  *   **Phase 3: Connect to Last Week.**
      *   "Last week, the class spent 15 minutes deciding between two identical review guides. How is this different?"
      *   Let them admit it's the same dynamic.
      *   **Key Takeaway:** "When the difference between options is negligible, the *act of deciding* becomes more valuable than the *quality of the decision*. Perfectionism is expensive."

  **0:50 – 1:00: Wrap Up & Application**
  *   Ask them to write down one low-stakes decision they put off this week (texting back, picking lunch, picking a study spot).
  *   **Challenge:** "For the next week, if a decision takes less than 2 minutes to research, give yourself 30 seconds to decide. If you're wrong, the cost is low. If you wait, the cost is time."
  *   Collect the participation sheets. Dismiss.

  ---

  ### 3. Heads Up: What Usually Goes Sideways

  **1. The "This is Stupid" Revolt**
  *   **Risk:** A vocal student realizes it's a trick immediately and refuses to engage, calling it a waste of time.
  *   **Fix:** Acknowledge it. "It might feel like a waste of time right now. That feeling is exactly the data point I want you to track. Stick with me for the debrief."

  **2. They Decide Too Fast**
  *   **Risk:** They vote in 2 minutes. You lose the "pain" of the deadlock.
  *   **Fix:** Enforce the "Justification Rule" strictly. If they say "We picked A because we like A," write it on the board and ask, "Is that a robust reason for a academic decision?" Make them work for the approval. Drag the justification phase out.

  **3. You Break Character**
  *   **Risk:** You smile or hint that they are stuck.
  *   **Fix:** Be a neutral facilitator. If they ask "Are they the same?", say "Your job is to choose one to proceed." (This is technically true, even if both work).

  **4. The Debrief Turns into a Lecture**
  *   **Risk:** You start explaining the theory before they speak.
  *   **Fix:** Ask questions. "Why did you hesitate?" "What were you afraid of?" Let them articulate the fear of making the 'wrong' choice.

  ---

  ### 4. Limitations: What This Exercise Can't Capture

  You will need to verbally fill in these gaps during the debrief, as the game simplifies reality:

  **1. High-Stakes Consequences**
  *   **The Gap:** In this game, being "wrong" cost nothing. In real life (choosing a major, a medical treatment, a career), being wrong *does* have a cost.
  *   **Your Fill-in:** "This exercise works for low-stakes decisions (review guides, lunch, study spots). It does not apply to high-stakes decisions where due diligence is required. The skill is knowing the difference between a Type 1 decision (irreversible/high stakes) and a Type 2 decision (reversible/low stakes)."

  **2. Emotional Attachment**
  *   **The Gap:** The folders had no emotional weight. Real deadlock often happens because people *prefer* one option emotionally but can't admit it.
  *   **Your Fill-in:** "Sometimes we deadlock not because the options are equal, but because we have a preference we feel we can't justify logically. It's okay to say 'I prefer this one'—that is a valid reason."

  **3. Group Dynamics vs. Individual Agency**
  *   **The Gap:** This was a group deadlock. Sometimes the paralysis is internal.
  *   **Your Fill-in:** "When you are alone, you are both the decider and the critic. When you're in a group, you're performing for each other. The solution is the same: Lower the bar for 'good enough'."

  ### Why This Works for a Sub
  *   **Low Prep:** You only need two pieces of paper.
  *   **High Control:** You hold the "keys" (the folders), so you manage the pace.
  *   **Self-Correcting:** If they behave exactly like last week, the lesson succeeds. If they behave differently, you can contrast it ("Wow, you decided in 3 minutes. What did you do differently than last week?").
  *   **No Tech:** If the projector dies, this activity actually works better in the dark/chaos.
