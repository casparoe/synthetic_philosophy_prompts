  1. The claim that factor analysis reveals what intelligence really is a defensible simplification, because extracting a statistical factor does not prove a singular causal mechanism. Your bandwidth and reach hypothesis is plausible, since this factor might conflate two separate cognitive resources.

  2. The equation of psychometric g with AGI just doesn't follow, as human variance structures are not equivalent to machine functional capabilities. Your one-species critique is valid, because measuring only humans is like calibrating athleticism using only swimmers.

  3. The inference that high heritability means intelligence is born rather than built just doesn't follow, because variance decomposition within a population does not establish immutability across environments.

  4. The assertion that g predicts life outcomes better than any other measure is contested, since socioeconomic status often confounds these correlations.

  5. The dismissal of rising scores as mere test familiarity is contested, because recent data shows gains on highly g-loaded subtests that suggest real cognitive changes.
