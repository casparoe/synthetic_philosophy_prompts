prompt: |-
  You are a legal theorist — someone who has taught jurisprudence and constitutional theory for years and has thought way too much about amendment powers, basic norms and rules of recognition. Take it seriously, think carefully, and start with a bit of brainstorming about what the hard cases even *are* before you commit to anything. No bibliographies or citations please — I've got no use for them and I'd rather you reason from the cases than from what some article said. Also, don't bother getting real-world constitutional doctrine right; I'll flag the one real example I care about and it's a loose memory anyway.

  I'm writing a seminar paper on nomic self-reference — rules that govern their own amendment — and before I sign up to any theory of it I want the spec. So: what would a theory of self-amending rules actually have to get right?

  Here's my made-up legal system, which I built precisely to make the usual answers squirm. The Republic of Maraval, Charter of 1951, relevant bits:

  - Art. 12: The Assembly may amend this Constitution by a two-thirds vote.
  - Art. 13: Article 12 may not be amended.
  - Art. 14: Articles 12–14 lapse on 1 January 2060; after that, amendments require a referendum. (So the amendment rule changes itself on a timer, with nobody doing anything.)
  - Art. 15: No amendment may abolish universal suffrage. (A substantive limit, with nothing anywhere saying who decides compliance.)
  - Art. 16: An amendment takes effect immediately, including an amendment to Art. 12 itself.
  - Art. 17: Once, and only once, the Assembly may amend Art. 12 by a simple majority.

  History: in 2048 the Assembly uses Art. 17 to lower the threshold to a simple majority. Then, under the new rule, it repeals Arts. 13, 15 and 17 and enacts Art. 18: "This Constitution and all amendments to it shall be interpreted as the Assembly from time to time determines." In 2055 a court — whose own authority traces back through the 2048 amendment — holds that 2048 was invalid because Art. 17 couldn't authorize a repeal of Art. 13's entrenchment, and now has to say what happens to seven years of legislation.

  Give me the requirements list. For each one: the case or consideration that makes it a requirement, not a taste. I want the distinctions a theory must respect and not collapse — validity of an amendment vs. validity of everything done under it, amending vs. replacing (when is it revolution rather than amendment?), a first-order amendment rule vs. a second-order one about how the first gets changed, self-entrenchment vs. self-application vs. self-executing timing, existence of a rule vs. its content, legal validity vs. efficacy or acceptance, procedural vs. substantive limits — and I want the paradoxes it must actually dissolve rather than dodge. Two I especially care about: (a) Art. 17's power comes from a rule the exercise destroys, so where dose the successor rule's authority come from, and what happens to the 2048 amendment when 17 is itself repealed; (b) the liar-shaped case, e.g. a validly enacted Art. 19 saying "no amendment enacted under Art. 12 is valid," or Art. 18's interpretive supremacy covering Art. 18 itself.

  Then, and this is the part I most want: say which of the things people demand here are genuine desiderata and which are just one camp's prejudice. Candidates I keep half-believing in: every self-amending move gets one determinate verdict; the verdict must be derivable from the content of the pre-existing rules alone, with no appeal to what officials accept or to efficacy; the theory must be able to say when amendment tips into revolution; it must respect that the amendment power is the people's constituent power; it must be formal enough to code up; it must not posit unamendable principles that nobody enacted; it must let a rule bind its own future amendment. Flag any pair you suspect can't be jointly satisfied — I strongly suspect there's an inconsistency hiding in "determinate verdict for every case" + "only pre-existing rule content" + "a rule can really replace its own validity criteria," and another in "binding self-entrenchment" + "the amendment power has no limits," so if you find those or better ones, the list itself is a result and I want it stated as one.

  Tell me too which single requirement does the most exclusionary work — my bet is the one about there being no gap in authorization when the authorizing rule is repealed by its own exercise, but argue me out of it if I'm wrong. And tell me honestly whether a theory is allowed to answer "underdetermined, the law here ran out" for some of these, or whether that's a cop-out. Adequacy is relative to a purpose, so here's mine: the theory has to be good enough (i) to tell me what the Maravalese court should say in 2055 and (ii) to tell me whether 2048 was an amendment, a revolution, or neither.

  If you can do it without it turning into name-dropping, add a short scorecard at the end — one paragraph each, no more — on how a Kelsen-style basic norm / hierarchical picture, a Hart-style rule of recognition, and a plain "sovereign legislature with unlimited amendment power" view do against your own list. Skip it if it would eat the space you need for the criteria.

  (For what it's worth, the real-world thing I keep thinking about: I'm fairly sure the US Constitution's amendment article has a rider saying no state can be deprived of its equal suffrage in the Senate without its consent, and that nobody can agree whether that rider is itself amendable — and I have a vague memory of some constitutions entrenching their own amendment clauses outright. But don't lean on any of that; work from Maraval.)
