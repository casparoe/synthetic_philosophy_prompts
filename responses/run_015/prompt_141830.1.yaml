answer: |-
  ### Brainstorming the Hard Cases

  Before we draft the spec, we need to see where the Maraval Charter actually bites. It's not just a puzzle; it's a trap designed to catch theories that rely on linear time or static hierarchies.

  First, look at **Article 17**. It's a self-consuming provision. It grants power to change Article 12, but implies its own obsolescence ("Once, and only once"). When the Assembly uses it in 2048, they change the rule of change. Then they repeal Article 17. The 2055 Court says 2048 was invalid *because* Article 17 couldn't authorize repealing Article 13's entrenchment. But wait: Article 17 authorized amending Article 12. Article 13 says Article 12 can't be amended. If Article 17 is valid, Article 13 is effectively suspended for that one act. If Article 13 is absolute, Article 17 is a nullity. The hard case isn't just "which rule wins?" It's: **Does the validity of the 2048 amendment depend on the continued existence of Article 17?** If Article 17 is repealed in 2048, does it vanish *ab initio* (making 2048 void from the start) or *ex nunc* (making 2048 valid until repealed)? A theory must explain how a rule can validate an act that destroys the rule's own future applicability.

  Second, the **Liar-shaped cases (Art. 18 & hypothetical Art. 19)**. Article 18 says the Assembly determines interpretation. Does that include the interpretation of Article 18's own validity? If the Assembly says "Article 18 is valid," is that a circular boot-strap? If they enact Art. 19 ("No amendment under Art. 12 is valid"), and they enact it *under* Art. 12, they create a performative contradiction. A theory can't just say "that's void." It has to say *why* without appealing to magic. Is it void because it violates logic, or because it violates a higher norm? If there is no higher norm, is it just a political fact?

  Third, the **Temporal Gap (Art. 14)**. The rules change on a timer. No human act. If the Assembly meets on Jan 2, 2060, and uses the old rule (2/3 vote) instead of the new rule (referendum), is the amendment valid? The text says the old rule "lapses." Lapse implies it ceases to exist. If it ceases to exist, it cannot authorize. But if the new rule requires a referendum and they don't hold one, is it a revolution? A theory must handle *automatic normative change* without human agency.

  Fourth, the **Court's Authority**. The 2055 Court derives authority from the 2048 regime. If the 2055 Court rules the 2048 regime invalid, it saws off the branch it sits on. If the 2048 regime is invalid, the Court has no jurisdiction. If the Court has no jurisdiction, its ruling is void, so the 2048 regime stands... which validates the Court... which voids the regime. This is a logical loop that requires a theory to distinguish between *jurisdictional validity* and *substantive correctness*.

  ***

  ### The Spec: Requirements for a Theory of Self-Amending Rules

  Here is the requirements list. Each item is tied to a specific failure point in Maraval.

  **1. The Diachronic Validity Requirement**
  *   **The Case:** Article 17 (2048). The Assembly uses Art. 17 to amend Art. 12, then repeals Art. 17.
  *   **The Requirement:** The theory must explain whether the validity of an amendment is *historical* (dependent on the authorizing rule existing at time *t1*) or *systemic* (dependent on the current rule of recognition accepting it at time *t2*).
  *   **Why:** If validity is purely historical, the repeal of Art. 17 doesn't hurt the 2048 amendment. If validity is systemic, the repeal might retroactively poison the well. A theory must pick a lane and explain how the chain of validity survives the destruction of the link that forged it.

  **2. The Distinction Between Derogation and Abrogation**
  *   **The Case:** Article 13 vs. Article 17. Art. 13 entrenches Art. 12. Art. 17 allows amending Art. 12.
  *   **The Requirement:** The theory must distinguish between *derogating* a rule (making an exception, e.g., "Art. 12 applies except this once") and *abrogating* it (removing it from the system).
  *   **Why:** If Art. 17 is merely an exception to Art. 13, Art. 13 remains the master rule. If Art. 17 is a higher-order power, it abrogates Art. 13 for that instance. Confusing these leads to the 2055 Court's confusion about whether Art. 13's entrenchment survived 2048.

  **3. The Revolution Threshold (Continuity vs. Rupture)**
  *   **The Case:** Article 18 (Interpretive Supremacy).
  *   **The Requirement:** The theory must provide a criterion for when an amendment is so radical it constitutes a *replacement* of the legal order rather than an *amendment* of it.
  *   **Why:** Art. 18 effectively makes the Assembly omnipotent. If the theory says "anything labeled an amendment is an amendment," then there is no constitution, only a legislature. If the theory says "Art. 18 is a revolution," it must identify the specific norm that was broken. Was it Art. 15 (suffrage)? Or the implicit rule that a constitution binds the legislature?

  **4. The Semantic Closure Requirement**
  *   **The Case:** Hypothetical Art. 19 ("No Art. 12 amendment is valid") or Art. 18's self-interpretation.
  *   **The Requirement:** The theory must handle self-referential validity claims without collapsing into contradiction. It must allow for a "truth-value gap" or a hierarchy that prevents a rule from adjudicating its own validity.
  *   **Why:** If a rule can declare itself valid, validity is meaningless. If a rule can declare itself invalid, does it vanish? The theory must prevent the legal system from becoming a paradox machine.

  **5. The Efficacy vs. Validity Distinction**
  *   **The Case:** The 2055 Court ruling vs. seven years of legislation.
  *   **The Requirement:** The theory must separate the *legal validity* of the 2048 amendment from the *social efficacy* of the laws passed between 2048 and 2055.
  *   **Why:** Even if 2048 was legally void, the state functioned. A theory that says "all those laws are void" creates chaos. A theory that says "they are valid because they worked" conflates law with force. The spec demands a way to validate past acts under a now-voided regime (e.g., via a doctrine of *de facto* authority) without admitting they were *de jure* valid at the time.

  **6. The Automatic Normative Change Requirement**
  *   **The Case:** Article 14 (The 2060 Timer).
  *   **The Requirement:** The theory must account for rules that change the rule of recognition without human agency.
  *   **Why:** Most theories assume law is a human command. Art. 14 is a command that executes itself. A theory must explain how a norm can trigger its own replacement without violating the principle that law requires a law-giver.

  ***

  ### Desiderata vs. Prejudice

  You asked which demands are genuine and which are camp prejudices. Here is the sorting.

  *   **"Every self-amending move gets one determinate verdict."**
      *   **Verdict:** Prejudice.
      *   **Reason:** This is the "one right answer" myth. In Maraval, Art. 13 and Art. 17 contradict. There may be no legal fact of the matter until a decision is made. Demanding a pre-existing determinate answer forces the theory to lie about the indeterminacy of language and rules.
  *   **"The verdict must be derivable from the content of pre-existing rules alone."**
      *   **Verdict:** Prejudice (and impossible).
      *   **Reason:** This ignores the *rule of recognition* problem. Rules don't apply themselves; officials apply them. In Maraval 2055, the Court's decision *makes* the law, it doesn't just find it. Insisting on derivation from text alone ignores the constitutive role of acceptance.
  *   **"The theory must be able to say when amendment tips into revolution."**
      *   **Verdict:** Genuine Desideratum.
      *   **Reason:** Without this, there is no difference between a constitutional order and a tyranny with a label. Continuity is the core value of constitutionalism.
  *   **"It must respect that the amendment power is the people's constituent power."**
      *   **Verdict:** Prejudice.
      *   **Reason:** "The People" is a metaphor. In Maraval, the power is vested in the Assembly. Importing "constituent power" adds a mystical layer outside the text. Stick to the norms enacted.
  *   **"It must be formal enough to code up."**
      *   **Verdict:** Prejudice.
      *   **Reason:** Law involves interpretation, not just computation. Art. 15 ("universal suffrage") requires judgment, not calculation. Formalism fails at the margins.
  *   **"It must not posit unamendable principles that nobody enacted."**
      *   **Verdict:** Genuine Desideratum (for Positivism).
      *   **Reason:** If you want a legal theory, not a moral one, you cannot invent limits. If Art. 15 is the only limit, Art. 13's entrenchment must be justified by text, not natural law.
  *   **"It must let a rule bind its own future amendment."**
      *   **Verdict:** Genuine Desideratum (but logically fraught).
      *   **Reason:** This is the point of entrenchment. If a rule cannot bind the future, it isn't a constitution. But see the Inconsistencies below.

  ***

  ### Inconsistencies and Impossibility Theorems

  You suspected inconsistencies. You were right. Here are the pairs that cannot be jointly satisfied.

  **1. The "Closed System" Inconsistency**
  *   **Pair:** (A) Verdicts must be derivable from pre-existing rule content alone + (B) A rule can truly replace its own validity criteria.
  *   **The Conflict:** If the rule of change (Art. 12) is amended to create a new rule of change (2048 simple majority), the criteria for validity have changed. If you demand the verdict be derived *only* from the *pre-existing* rules (1951 Charter), you must judge the 2048 amendment by the 1951 rules. But the 2048 amendment claims to *replace* those rules. You cannot use the old rules to validate the death of the old rules without begging the question. Either you admit extra-legal facts (efficacy/acceptance) or you admit the system is logically open.

  **2. The "Entrenchment" Inconsistency**
  *   **Pair:** (A) Binding self-entrenchment is possible + (B) The amendment power has no limits.
  *   **The Conflict:** Maraval Art. 13 tries to entrench Art. 12. Art. 17 tries to override Art. 13. If the amendment power is unlimited, Art. 13 is a sham (it can be circumvented). If Art. 13 is binding, the amendment power is limited. You cannot have both "unlimited power to amend" and "some things cannot be amended." A theory must choose: either entrenchment is legally effective (limits power) or it is merely political (power remains unlimited).

  **3. The "Self-Reference" Inconsistency**
  *   **Pair:** (A) A rule can determine its own validity + (B) Validity requires an external standard.
  *   **The Conflict:** Art. 18 says the Assembly determines interpretation. If the Assembly determines "Art. 18 is valid," and validity requires an external standard (like the Constitution), then Art. 18 is claiming to be the external standard. This is the Liar Paradox. A theory must prohibit a rule from being the source of its own validity, or admit that validity is circular.

  ***

  ### The Most Exclusionary Requirement

  You bet on the "no gap in authorization" requirement (Art. 17's self-destruction). I argue that is indeed the heaviest lifter, but I will refine it.

  **The Requirement:** *Continuity of Validity Despite Source Destruction.*
  (How can an act be valid if the rule authorizing it ceases to exist immediately after the act?)

  **Why it does the most work:**
  This requirement kills the "Static Hierarchy" theories (like a rigid Kelsenian pyramid) and the "Pure Textualist" theories.
  *   If a theory says validity flows like a current from a source, and the source is dammed up (repealed), the current stops. This makes the 2048 amendment void.
  *   If a theory says validity is a status conferred by the *current* system, then the 2048 amendment is valid only if the 2055 Court accepts it.
  *   To satisfy this requirement, a theory must posit that **legal acts create their own validity bubbles** that survive the expiration of the authorizing norm. It forces the theory to distinguish between the *power to act* (which expires) and the *validity of the act* (which persists).
  *   Any theory that cannot explain how a repealed rule can leave behind valid offspring is useless for Maraval. It forces you to choose between "Law is History" (the act was valid when done) and "Law is Present Fact" (the act is valid only if recognized now). Most theories try to be both and fail.

  ***

  ### Is "Underdetermined" a Cop-Out?

  **Honest Answer:** No. It is the only honest answer for Maraval 2055.

  **Reasoning:**
  In the 2055 case, the Court faces a contradiction: Art. 13 says "No," Art. 17 says "Yes." The text does not resolve which priority rule applies (lex posterior? lex superior?). The repeal of Art. 17 removes the textual basis for the "Yes."
  If a theory insists on a determinate verdict, it must import a premise not in the text (e.g., "Entrenchment always wins" or "Later laws always win"). That is not legal theory; it is ideology.
  A robust theory must admit that **legal rules can run out.** When they run out, the decision is *political* (the Court chooses) but not *legally determined* prior to the choice.
  **For your purpose:** The theory must tell the Court: "The law does not dictate the answer. You must decide based on consequences (stability vs. legality)." If the theory says "The law dictates X," it is lying about Maraval. So, "Underdetermined" is not a cop-out; it is a diagnostic tool. It tells you when you have moved from jurisprudence to politics.

  ***

  ### Scorecard

  **Kelsen-Style Basic Norm / Hierarchical Picture**
  *   **Performance:** Fails on Art. 17 and Art. 18.
  *   **Why:** Kelsen requires a static hierarchy where lower norms derive validity from higher norms. When Art. 17 (lower) modifies Art. 12 (higher), the hierarchy blurs. Worse, when Art. 17 is repealed, the "chain of validity" is broken. Kelsen would likely have to declare the 2048 amendment a "revolution" requiring a new Basic Norm. This is too blunt; it invalidates seven years of law unnecessarily. It handles the "Underdetermined" case by forcing a binary: either the system continues (valid) or it breaks (revolution). It cannot handle the "valid but unauthorized" middle ground.

  **Hart-Style Rule of Recognition**
  *   **Performance:** Best on Art. 17 and 2055 Court; weak on Art. 15.
  *   **Why:** Hart looks to what officials *accept*. If the 2055 Court and Assembly accept the 2048 amendment, it is valid, regardless of Art. 13's text. This solves the "Source Destruction" problem beautifully (validity is current practice, not historical pedigree). However, it struggles with Art. 15 (substantive limits). For Hart, if the officials accept a violation of suffrage, it's law. It cannot say "That's invalid" unless the officials themselves treat Art. 15 as a limit. It dissolves the paradox by making validity a social fact, but at the cost of making substantive limits toothless.

  **Plain "Sovereign Legislature" View (Unlimited Power)**
  *   **Performance:** Solves the paradoxes by ignoring them; fails the "Constitution" test.
  *   **Why:** This view says the Assembly can do anything. Art. 13, 15, 17 are all just advice. If they repeal Art. 13, it's gone. If they pass Art. 18, it's valid. This is the most "determinate" theory, but it collapses the distinction between amendment and revolution. It makes the Charter a sham. It satisfies the "no gaps" requirement by denying gaps exist (Power is infinite), but it fails your desideratum of distinguishing amendment from replacement. It turns the theory into a description of force, not law.
