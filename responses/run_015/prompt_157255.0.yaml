answer: |-
  Here is the principle you are fumbling toward, stated plainly.

  ### The Principle: The Cost of Doubt

  A proposition is a **hinge** if treating it as an open question would force you to abandon the very methods you use to figure out what is true. A proposition is **empirical** if you can check it without breaking your system of checking.

  It is not about how sure you feel. It is about what work the proposition is doing. If the proposition is part of the *scaffolding* that holds up your inquiry, it is a hinge. If it is a *brick* you are placing into the wall, it is empirical.

  To decide if something is a hinge, ask: **"If I tried to prove this wrong, would I have to use tools that only work if this is already right?"**

  *   **Example:** To prove you *don't* have hands, you would need to look, touch, or ask a doctor. But looking, touching, and medical testimony all assume you have a body that can interact with the world. If you don't have hands, your tools for checking are broken. Therefore, "I have hands" is a hinge.
  *   **Example:** To prove you *were not* born in Dayton, you can check a birth certificate. Checking a certificate does not require you to assume you were born in Dayton. Therefore, "I was born in Dayton" is usually empirical, even if it feels like bedrock.

  ### Status: Truth, Knowledge, and Community

  1.  **True or False?** Hinges are held as true, but they **can be false**. They are not protected by logic; they are protected by your refusal to check them. As your test cases show, a hinge can shatter.
  2.  **Known?** No. "Knowledge" implies you have evidence and could have been wrong. With a hinge, you don't have evidence; you have a commitment. You don't *know* you have hands; you *use* them.
  3.  **Personal or Communal?** Both.
      *   **Universal Hinges:** Things almost no one checks (e.g., "The earth exists").
      *   **Communal Hinges:** Things a specific group treats as fixed to do their work (e.g., "Water is H2O" for a chemist).
      *   **Personal Hinges:** Things you treat as fixed because of your life history (e.g., "This man is my father").

  ### Where Your Verdicts Need Adjusting

  Your list is strong, but you are trying to assign fixed labels to things that change based on context. Here are the four verdicts this principle forces you to reconsider:

  **1. "This thing in front of me is a table."**
  *   **Your Verdict:** Empirical (could be a prop), but doubt feels empty.
  *   **The Correction:** It is **context-dependent**. In a seminar room, it is a hinge. Doubting it stops the conversation. In a prop shop or a magic show, it is empirical. You are running two standards because you are imagining two different contexts. In your seminar, it *is* a hinge. Drop the idea that "table" has a fixed status outside of a situation.

  **2. "Water is H2O."**
  *   **Your Verdict:** Empirical identity, not a hinge.
  *   **The Correction:** For you, it is testimony (empirical). For the chemists you know, it is a **communal hinge**. If a chemist started doubting whether water is H2O, they couldn't do chemistry. They would have to quit the profession. You must accept that the same sentence can be a hinge for one person and a fact for another, depending on what practice they are engaged in.

  **3. "I was born in Dayton, Ohio."**
  *   **Your Verdict:** Feels like bedrock, but you think it isn't.
  *   **The Correction:** You are right to feel it is bedrock, but wrong to think that makes it permanent. It is a **personal hinge** that functions as empirical data. It holds your personal history together. If it were proven false, your history wouldn't vanish, but it would need rewriting. It is a hinge until it is tested. Once tested, it becomes empirical.

  **4. "The Holocaust happened."**
  *   **Your Verdict:** Empirical knowledge, but denial feels like madness.
  *   **The Correction:** This is a **solidified empirical claim**. It is known (there is evidence), but it has become so central to our moral and historical world-picture that denying it functions like denying a hinge. It breaks the system of moral reasoning. You don't have to call it a "hinge" if you want to keep "knowledge," but you must admit it functions *like* a hinge: doubting it excludes you from reasonable discourse.

  **What to Keep:**
  *   **2+2=4:** Keep your verdict that this is different. This is a rule of grammar, not a fact about the world. Doubting it isn't madness; it's a confusion about how we use numbers.
  *   **Other Minds:** Keep your verdict. This isn't a proposition at all; it's an attitude we take toward people. It's deeper than a hinge.

  ### The Two Test Cases

  Here is how the **Cost of Doubt** principle runs on your new cases.

  **Case 1: The 72-Year-Old Woman and the Father**
  *   **Analysis:** For seventy years, "This man is my father" was a hinge. It organized her memories, her identity, and her family relationships. She did not check it; she lived it. The DNA test introduced a new system of verification (genetics) that overrode the old system (testimony and resemblance).
  *   **Result:** The hinge did not just turn out to be false; it was **displaced**. A new foundation (genetic science) kicked out the old foundation (family testimony). This proves hinges can be false and can be overturned, but only by a system that claims to be more fundamental.

  **Case 2: The Anthropologist and the Dreaming Village**
  *   **Analysis:** For the villagers, "Dreams carry news of death" is a **communal hinge**. It is not a theory they test; it is how they interpret reality. To doubt it is to stop being a member of that village community.
  *   **The Anthropologist:** She does not acquire the hinge because she is playing a different game (observation, not participation). For her, the claim is empirical data about the villagers.
  *   **The Boy:** When the boy goes to medical school, he swaps communities. He trades the "Dream Hinge" for the "Germ Theory Hinge." He doesn't just change his mind; he changes the tools he uses to understand the world.
  *   **Result:** This proves hinges are **local**. You can lose a hinge by leaving the community that holds it fast.

  ### Summary
  You are looking for a list of propositions that are inherently hinges. There isn't one. A hinge is a **role** a proposition plays.

  *   If the claim is the **ground** you stand on to check other things, it's a hinge.
  *   If the claim is a **tile** you are laying down, it's empirical.
  *   The same claim can be ground for one person and a tile for another.
  *   The ground can crack, but when it does, you have to find new ground to stand on.
