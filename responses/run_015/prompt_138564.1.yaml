answer: |-
  This is a specification for a theory of moral dilemmas tailored to high-stakes scarcity work. It is designed to adjudicate the argument between you (Residue is real) and your co-volunteer (Residue is irrational error), while remaining usable in a church basement with a spreadsheet.

  Here are the eight sharp requirements.

  ### The Spec: 8 Desiderata for a Scarcity Ethics

  **1. The Existence Condition (Non-negotiable)**
  *   **Requirement:** The theory must allow for a state description where $O(A)$ and $O(B)$ are both true, but $\diamond(A \land B)$ is false, without triggering a logical explosion that invalidates all other moral judgments.
  *   **Case/Consideration:** Your rent tiebreaker. If the theory says "You only ought to do the one you picked," it denies the reality of the claim you left unmet. If it says "You ought to do both," it violates logic unless it modifies the operators.
  *   **Camp:** Non-negotiable for you; rejected by your friend (who holds that if you can't do both, one 'ought' must vanish).

  **2. The Rationality of Residue (Non-negotiable)**
  *   **Requirement:** The theory must classify feelings of guilt, remorse, or "moral dirt" after a correct choice as *rational responses to moral facts*, not as cognitive errors or psychological glitches.
  *   **Case/Consideration:** Your feeling that "something bad happened" despite doing the right thing. Your friend claims this is incoherent. A theory that validates your friend makes your emotional labor pathological.
  *   **Camp:** Non-negotiable for you; rejected by your friend (who holds that guilt implies violation).

  **3. Culpability Separation (Non-negotiable)**
  *   **Requirement:** The theory must distinguish between *blame for entering the dilemma* and *blame for the choice made within the dilemma*. It must offer different normative prescriptions for "tragic binds" (structural scarcity) vs. "negligent binds" (double-booking funds).
  *   **Case/Consideration:** Your double-commitment error vs. the 40-applicant scarcity. In the first, you owe restitution/apology for the mess. In the second, you owe acknowledgment of the loss, but not confession of sin.
  *   **Camp:** Non-negotiable for both (pragmatically), but many philosophical theories collapse these into "agent-regret" generally.

  **4. Symmetry and Randomization (Preference: Your Camp)**
  *   **Requirement:** The theory must provide a positive moral justification for randomization (coin flips, lotteries) in symmetrical cases, framing it as an *affirmation of equal worth* rather than a *surrender of moral agency*.
  *   **Case/Consideration:** The identical rent applications. If the theory says "flip a coin," it must explain why this isn't a cop-out. It must show that randomization honors the claims better than arbitrary selection.
  *   **Camp:** Preference for you (you need to defend the flip); your friend might prefer "pick one and don't look back."

  **5. Non-Aggregation of Claims (Non-negotiable)**
  *   **Requirement:** The theory must block the inference that forty small unmet claims aggregate into one impossible mega-obligation that paralyzes the agent. $O(a_1) \dots O(a_{40})$ must not imply $O(a_1 \land \dots \land a_{40})$ if the conjunction is impossible.
  *   **Case/Consideration:** Your 40 applicants/6 grants problem. If the theory aggregates, you are perpetually in violation every month. The theory must handle "many small oughts" without collapsing the system.
  *   **Camp:** Non-negotiable for operational sanity.

  **6. Action Guidance / Choice Function (Non-negotiable)**
  *   **Requirement:** The theory must return at least one admissible option for every decision node. It cannot return "null" or "no permissible act."
  *   **Case/Consideration:** You have to wire the money on Tuesday. A theory that says "there is no right choice" leaves you paralyzed. You need a function that selects *an* action, even if it acknowledges the cost.
  *   **Camp:** Non-negotiable for practitioners.

  **7. Logical Consistency (OIC vs. Agglomeration) (Non-negotiable)**
  *   **Requirement:** The theory must explicitly state which principle it sacrifices: **Ought Implies Can (OIC)** or **Agglomeration** ($OA \land OB \to O(A \land B)$). It cannot keep both while admitting genuine dilemmas.
  *   **Case/Consideration:** The agglomeration move. If you ought to help A and ought to help B, logic says you ought to help (A and B). If you can't, one of these logical rules must break. The theory must tell you which one.
  *   **Camp:** Non-negotiable for coherence.

  **8. Intuition Handling (Preference)**
  *   **Requirement:** The theory need not validate all intuitions about "famous cases" (Sophie's Choice, Dirty Hands), but it must explain *why* those intuitions arise if it rejects them. It cannot simply dismiss them as errors without an error theory.
  *   **Case/Consideration:** Sartre's student. If your theory says "there was a single right answer," it must explain why it feels like there wasn't.
  *   **Camp:** Preference. Allows the theory to be revisionary if necessary.

  ***

  ### The Impossible Trio

  You asked for the pair or triple of desiderata that cannot be jointly satisfied. This is the engine of your argument. You cannot hold these three simultaneously:

  1.  **Standard Deontic Logic:** Specifically, **Agglomeration** ($OA \land OB \to O(A \land B)$) AND **Ought Implies Can** ($O(A) \to \diamond A$).
  2.  **Genuine Dilemmas:** There are cases where $OA$ and $OB$ are true, but $\diamond(A \land B)$ is false.
  3.  **Rational Residue:** It is rational to feel guilt/remorse even when you have performed the single permissible action required by the dilemma.

  **Why they break:**
  *   If you keep **Standard Logic (1)** and admit **Genuine Dilemmas (2)**, you generate a contradiction: You ought to do $(A \land B)$, but you cannot. This violates OIC. To fix this, most logics say one of the 'oughts' wasn't real. If one 'ought' wasn't real, you didn't violate anything.
  *   If you didn't violate anything, **Rational Residue (3)** becomes impossible (per your friend's view).
  *   To save **Rational Residue (3)** and **Genuine Dilemmas (2)**, you must break **Standard Logic (1)**. Specifically, you must reject **Agglomeration**. You must say: "You ought to help A, and you ought to help B, but it is *false* that you ought to help (A and B)."

  **The Verdict:** Your friend is holding onto (1). You are holding onto (2) and (3). You cannot both be right using standard logic. One of you must change your logic of 'ought'.

  ***

  ### The Single Knockout Desideratum

  **#2: The Rationality of Residue.**

  This is the constraint that kills the most otherwise popular views.
  *   **Utilitarianism** fails here: If you maximized the good, there is no remainder. Guilt is irrational.
  *   **Kantianism** often fails here: If you followed the Categorical Imperative, your hands are clean.
  *   **Standard Deontic Logic** fails here: If you did what was permissible, no obligation was violated.

  To satisfy #2, a theory must adopt a concept of **"Moral Remainders"** (Bernard Williams, Thomas Nagel, Ruth Marcus). It must argue that obligations can persist even after they are overridden, leaving a "trace" that justifies remorse without implying the action was wrong. If a theory cannot explain why you feel bad without telling you that you *are* bad, it is useless for your basement.

  ***

  ### One-Line Scorecard (As Requested)

  *   **Standard Deontic Logic:** Fails #1 and #2 (Denies dilemmas or residue).
  *   **Act Utilitarianism:** Fails #2 (No residue if utility maximized).
  *   **Rossian Pluralism:** Passes #1, #2, #3 (Prima facie duties allow residue), struggles with #5 (Aggregation).
  *   **Existentialism (Sartre):** Passes #1, #2, #6, Fails #4 (Randomization is bad faith).
  *   **Prioritarianism:** Passes #5 (Handles scarcity), often Fails #2 (Calculus leaves no residue).

  **Recommendation:** Look for theories labeled **"Non-Agglomerative Deontic Logic"** or **"Pluralist Intuitionism with Moral Remainders."** If the text doesn't mention "remainders" or "residue" in the index, put it back on the shelf.
