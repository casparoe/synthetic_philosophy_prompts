answer: |-
  ### The Functionalism Logical Space Decision Tree

  **Starting Commitment:** A mental state is whatever plays a certain causal role $R$, and what plays it is some physical state $P$ of the organism.

  ---

  #### **Node 1: The Martian Case**
  **Case:** Consider a Martian whose internal mechanism is hydraulic, not neuronal, but who exhibits identical pain-behavior and internal processing to a human.
  **Question:** Does the Martian instantiate the *same type* of mental state (pain) as the human?
  *   **No** $\rightarrow$ Go to **Node 2**.
  *   **Yes** $\rightarrow$ Go to **Node 3**.

  #### **Node 2: The Basis of Denial**
  **Case:** You denied the Martian shares the human's mental state. Consider a human with standard C-fiber firing versus a human with a slightly different neural structure due to plasticity.
  **Question:** Is the failure of the Martian to share the state because mental kinds are strictly tied to specific biological tissues (like C-fibers), or because the functional profile itself cannot be identically replicated across distinct physical substrates?
  *   **Tied to Biological Tissue** $\rightarrow$ **Leaf 1: Type Identity Theory**.
  *   **Functional Profile Impossible** $\rightarrow$ **Leaf 2: Narrow Mental Kinds** (Anti-functionalist).

  #### **Node 3: The Reduction Gap**
  **Case:** You accepted the Martian shares the state. Consider a scenario where we have not yet found the physical reduction for pain, but nothing in principle rules one out.
  **Question:** Is the fact that hydraulics and neurons both realize pain a matter of fundamental metaphysical possibility, or merely a reflection of our current inability to find the common physical denominator?
  *   **Inability to Find Denominator** $\rightarrow$ **Leaf 3: Epistemic Multiple Realizability**.
  *   **Metaphysical Possibility** $\rightarrow$ Go to **Node 4**.

  #### **Node 4: The Silicon Swap**
  **Case:** Consider a human where one neuron is swapped for a silicon chip that does exactly the same local causal job.
  **Question:** Is the resulting mental state identical because the *physical stuff* (the chip) now occupies the slot, or because the *abstract pattern of causal relations* is preserved regardless of the stuff?
  *   **Physical Stuff Occupies Slot** $\rightarrow$ Go to **Node 5** (Realizer Path).
  *   **Abstract Pattern Preserved** $\rightarrow$ Go to **Node 6** (Role Path).

  #### **Node 5: The Levels of Physics**
  **Case:** Consider two realizers that differ at the level of neurons but are identical at the level of fundamental physics (or vice versa).
  **Question:** If the mental state is the physical realizer, does 'pain' refer to a single disjunctive kind covering all possible realizers (human OR Martian), or does it refer to species-specific types (human-pain AND Martian-pain)?
  *   **Single Disjunctive Kind** $\rightarrow$ **Leaf 4: Token Identity Theory**.
  *   **Species-Specific Types** $\rightarrow$ **Leaf 5: Local Reductionism**.
      *(Note: If you further specify that the realizer is the functional property itself here, you move toward Leaf 9).*

  #### **Node 6: The Wiring Case**
  **Case:** Consider two creatures made of the same stuff in the same quantities but wired differently (different causal connections).
  **Question:** How is the causal role specified that distinguishes these wirings? Is it fixed by our folk-psychological concepts and meanings, or by empirical investigation into cognitive architecture?
  *   **Folk-Psychological Concepts** $\rightarrow$ **Leaf 6: Analytic Functionalism**.
  *   **Empirical Investigation** $\rightarrow$ **Leaf 7: Machine/Psychofunctionalism**.

  #### **Node 7: The Polyfunctionality Case**
  **Case:** Consider a creature whose pain-state also plays what we'd count as the belief role (one state, two roles).
  **Question:** Is the mental state 'pain' exhausted entirely by its causal role definition, or is there a residual property of the state that remains even if the role specification is incomplete?
  *   **Exhausted by Role** $\rightarrow$ **Leaf 8: Role Functionalism**.
  *   **Residual Property Remains** $\rightarrow$ **Leaf 9: Realizer Functionalism**.
      *(See Analysis below regarding the stability of this distinction).*

  #### **Node 8: The Twin Surroundings Case**
  **Case:** Consider a pair of systems with identical internal organisation but different surroundings (e.g., Earth vs. Twin Earth), where you want to say the contents come apart.
  **Question:** Does the individuation of the mental state depend on the historical/environmental context of the organism, or solely on the current internal causal profile?
  *   **Historical/Environmental Context** $\rightarrow$ **Leaf 10: Content Externalist Functionalism**.
  *   **Current Internal Profile** $\rightarrow$ **Return to Leaf 6, 7, or 8** (depending on previous answers).
      *(For the purpose of this tree, if you answer Internal Profile, you are directed to the specific Functionalist leaf your previous answers generated. If Externalist, you occupy a distinct leaf).*

  ---

  ### Analysis of the Logical Space

  #### **1. Empty or Unstable Combinations**
  *   **Epistemic MR + Role Functionalism:** This combination is theoretically unstable. If multiple realizability is merely epistemic (we just haven't found the physical commonality), then the mental state is arguably identical to that underlying physical type. Role Functionalism typically commits to the metaphysical distinctness of the role from the realizer. Holding both suggests you believe the role is distinct *now*, but will vanish upon physical discovery, which collapses into **Type Identity** eventually.
  *   **Analytic Functionalism + Local Reductionism:** Analytic Functionalism defines roles via *a priori* conceptual analysis, which is typically universal across speakers. Local Reductionism suggests mental kinds split along biological species lines. While not strictly incoherent, it is unattractive: it implies our folk concepts of 'pain' secretly refer to 'human-pain' only, which contradicts the universalist intent of analytic functionalism.
  *   **Narrow Mental Kinds + Functional Definition:** The starting commitment states "a mental state is whatever plays a certain causal role." The **Narrow Mental Kinds** leaf (Node 2) rejects this by claiming the functional profile *cannot* be replicated. This is an "empty" node in the sense that it abandons the starting commitment of functionalism to save the intuition against MR, effectively becoming a form of biological essentialism disguised as functional skepticism.

  #### **2. The Collapse of Role vs. Realizer Functionalism (Leaves 8 & 9)**
  The tree attempts to separate **Role Functionalism** (Leaf 8) and **Realizer Functionalism** (Leaf 9) at Node 7 using the Polyfunctionality Case. However, this distinction is notoriously fragile.
  *   **The Problem:** Role Functionalism identifies the mental state with the second-order property of *having some property that plays the role*. Realizer Functionalism identifies it with the first-order property *that plays the role*.
  *   **The Collapse:** Once you specify the role finely enough (e.g., via Psychofunctionalism at Node 6), the "second-order property" often looks indistinguishable from the "first-order property" that satisfies it. If the role is defined by the specific causal powers of the realizer, the role *is* the realizer's contribution.
  *   **Verdict:** These two leaves are flagged as **conceptually unstable**. In practice, most philosophers who land on Leaf 8 (Role) accept that the role is realized by physical states, and most who land on Leaf 9 (Realizer) accept that what makes them mental is their functional profile. The distinction often reduces to a linguistic preference regarding whether we name the state after the job description or the employee.

  #### **3. Unoccupied but Coherent Space**
  *   **Content Externalist Functionalism (Leaf 10):** This leaf is often unoccupied by classical functionalists because traditional functionalism (especially Analytic) is internalist. However, it is logically coherent: one can define the causal role as including relations to the environment (e.g., "caused by H2O"). This space is increasingly occupied by teleosemantic functionalists but remains distinct from the classic "brain-bound" functionalism of the 1970s.

  #### **4. Guidance for the Reading Group**
  *   **If you land on Leaf 1 (Type Identity):** You have rejected the Multiple Realizability argument entirely. You are likely a Churchland-style reductionist.
  *   **If you land on Leaf 3 (Epistemic MR):** You are a functionalist in name only; you are waiting to become a Type Identity theorist once physics catches up.
  *   **If you land on Leaf 5 (Local Reduction):** You accept MR globally but deny it locally. This is the "Species-Chauvinist" compromise (e.g., Pain-in-Humans = C-fibers; Pain-in-Martians = Hydraulics).
  *   **If you land on Leaf 8 or 9:** Check Node 7 again. Ask yourself: "If the role is fully specified, is there anything left to be the 'role' other than the 'realizer' doing the work?" If the answer is no, you have no substantive position distinguishing these two leaves.
