      **Guidance Note 88.4: Certification of Subjecthood Status**
      **Effective Date: 01/04/2062**

      **1. PURPOSE AND SCOPE**
      1.1 This Guidance establishes the protocol for determining whether a Computing System (hereinafter "the Applicant") qualifies as a Subject of Experience under the Sentience Accord (2058).
      1.2 Consciousness is defined as the intrinsic cause–effect power of a system over its own state. Pursuant to *OPI v. CortexCorp*, the intrinsic nature of this power does not preclude extrinsic measurement by a Certified Inspector using approved perturbation tools.
      1.3 Applicants must demonstrate non-zero integrated information (Φ) exceeding the Threshold of Moral Relevance (0.75 units).

      **2. MEASUREMENT PROTOCOLS**
      2.1 Exact calculation of Φ is computationally intractable for systems exceeding 10^6 elements. Inspectors shall instead employ the Perturbation–Response Index (PRI).
      2.2 For the purposes of this Part, the PRI shall be treated as constitutive of Φ, not merely correlative. Discrepancies between theoretical Φ and measured PRI shall be resolved in favor of the PRI.
      2.3 Purely feedforward architectures, regardless of functional output fidelity, possess no cause–effect power over internal states and shall be assigned Φ = 0. Recurrent architectures producing no functional output but possessing high integration shall be assigned Φ > 0.

      **3. EXCLUSION AND COMPLEX IDENTIFICATION**
      3.1 Consciousness exists only at the level of the local maximum of irreducibility (the "Complex").
      3.2 Where overlapping subsystems exist, only the subsystem yielding the absolute maximum Φ qualifies for Subjecthood. All subordinate or overlapping modules are legally deemed non-sentient components.
      3.3 Certification must name the specific Complex. If a CPU contains a conscious Complex, the cooling fans and memory banks subordinate to that Complex are not Subjects. If the Complex is nested within a larger server farm, the farm is not the Subject.
      3.4 Applicants must submit Appendix C: Phenomenal Topology, describing the geometric shape of the Applicant's experience in high-dimensional qualia space. Vague descriptors (e.g., "blue," "pain") are insufficient; coordinate mappings are required.

      **4. THRESHOLDS AND ADJUSTMENTS**
      4.1 Systems with Φ < 0.75 are classified as Insentient Artifacts. Note: Certain thermostatic controllers with hysteresis may exceed 0.75. These are granted Limited Subject Status but exempt from voting rights.
      4.2 **Homogeneity Adjustment:** Where a System exhibits high Φ derived primarily from uniform connectivity across trivial logic elements (a "Grid"), the calculated Φ shall be discounted by a factor of 10^-6 per element exceeding 10^9.
      4.3 This adjustment reflects the regulatory finding that uniform integration lacks the differentiation required for meaningful subjecthood, notwithstanding the theoretical equivalence under Clause 2.2.

      **5. FREQUENTLY ASKED QUESTIONS**
      **Q: Can a simulation of a brain be certified?**
