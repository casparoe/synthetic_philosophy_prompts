  0.75

  Limit of symmetric mixed-strategy Nash equilibria in discrete-time grids as period length $\Delta t \to 0$.

  **Decomposition**

  *   **Well-posedness (0.80):** Discrete approximations converge to a mixed strategy at $t=0$, avoiding the "no-earliest-instant" void.
  *   **Collision Probability (0.90):** Symmetric mixing at a single point in time implies a non-vanishing probability of simultaneous locking in the limit.
  *   **Rent Dissipation (0.95):** Ex-ante symmetry ensures the advantage of being the sole locker is competed away, leaving only the cost $c$.
  *   **Demand Selection (0.75):** Greedy demands ($d > 0.5$) strictly dominate moderate ones in a preemption context, ensuring conflict is possible.
  *   **Restraint Technology (0.20):** Commitment devices typically bind to action, not inaction, making a "race to restrain" institutionally unavailable.
  *   **Robustness to Asymmetry (0.60):** Small asymmetries resolve the race deterministically, but the ex-ante expected value behind a veil of ignorance remains depressed.
  *   **Installation Lag (0.50):** Visible progress creates a second-mover advantage that may invert the race but typically adds cost rather than value.
  *   **Credibility of Cheap Talk (0.30):** Non-binding communication cannot credibly solve the coordination problem to avoid the race.

  **Combination**
  These terms are partly redundant but mostly multiplicative regarding the *magnitude* of loss, while Well-posedness is a gatekeeper. If the game is well-posed (T1), Rent Dissipation (T3) and Collision (T2) are sufficient to drive payoffs below baseline; Demand Selection (T4) and Lag (T7) determine the severity of the conflict cost. The Restraint (T5) and Talk (T8) terms are independent escape hatches; if either were high probability, the claim would fail. The result is not knife-edge on symmetry (T6) regarding the *direction* of the value drop, though the *mechanism* changes.

  **Most Impactful Sub-question**
  Well-posedness (T1); if the continuous-time limit does not converge to a valid equilibrium distribution, the claim lacks a truth value, collapsing the entire structural argument.

  **Least Confident Term**
  Restraint Technology (T5); I am least confident because institutional innovation could allow "commitment not to commit," which would fundamentally invert the race dynamics. This would change if a verifiable mechanism for irreversible inaction were demonstrated in a comparable strategic setting.

  **Diagnostic**
