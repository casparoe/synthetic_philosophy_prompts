answer: |-
  This is a classic sticking point in contemporary epistemology, and your confusion is well-founded. The reason you cannot disentangle the two in your apartment example is that you are conflating the **Subject** (the person whose knowledge is in question) with the **Attributor** (the person applying the term "knows"). In your scenario, you are both.

  When the Subject and Attributor are the same person (first-person knowledge claims), practical stakes and conversational standards almost always covary. As your stakes rise, your internal deliberative context becomes more rigorous. To distinguish Epistemic Contextualism (EC) from Pragmatic Encroachment (PE), you must look to **third-person attributions** where the Subject's stakes and the Attributor's context can be manipulated independently.

  Here is the breakdown you need for your term paper, structured around your five requests.

  ### 1. The Locus of Context-Sensitivity

  The fundamental divide is not just about *what* changes, but *where* the change is located in the knowledge relation.

  *   **Epistemic Contextualism (EC):** The sensitivity is **semantic** and located in the **Attributor's conversational context**.
      *   *Claim:* The extension of the predicate "knows" shifts depending on the standards salient to the person *saying* "S knows that p."
      *   *Role of Stakes:* Stakes matter only derivatively. High stakes for the attributor (or the subject, if salient to the attributor) raise the salience of error possibilities, which raises the semantic standard for "knows."
      *   *Metaphysics:* Knowledge itself is a stable relation; our *word* for it is slippery.

  *   **Pragmatic Encroachment (PE):** The sensitivity is **metaphysical/epistemic** and located in the **Subject's practical situation**.
      *   *Claim:* Whether the subject stands in the knowledge relation to a proposition depends partly on the practical costs of being wrong *for the subject*. (Note: PE is typically paired with *Interest-Relative Invariantism* (IRI), which holds that the word "knows" has a stable meaning, but the state it picks out varies with stakes).
      *   *Role of Stakes:* Stakes are constitutive of justification/knowledge. Two subjects with identical evidence can differ in knowledge status solely due to differing stakes.
      *   *Metaphysics:* The knowledge relation itself is sensitive to practical facts.

  ### 2. Predictions in "Clean Cases"

  To test the theories, you must uncouple the Attributor's context from the Subject's stakes.

  **Case A: Fixed Subject Stakes / Shifting Attributor Context**
  *   *Setup:* Hannah (Subject) has low stakes regarding the bank hours (she just wants to deposit a check; no urgency). She has standard evidence.
      *   *Attributor 1:* A casual observer in a low-standards context.
      *   *Attributor 2:* A philosopher in a high-standards context (skeptical possibilities salient).
  *   **EC Prediction:** Attributor 1 speaks truly saying "Hannah knows." Attributor 2 speaks truly saying "Hannah does not know." (Both assertions are true because "knows" means different things).
  *   **PE Prediction:** Attributor 1 speaks truly saying "Hannah knows." Attributor 2 speaks **falsely** saying "Hannah does not know." (Since Hannah's stakes are low, she *knows*, full stop. The philosopher is mistaken).

  **Case B: Fixed Attributor Context / Shifting Subject Stakes**
  *   *Setup:* You (Attributor) are in a fixed, casual conversational context (e.g., chatting over coffee). You are evaluating two subjects.
      *   *Subject 1 (Low Stakes):* Needs to deposit a check; no penalty if the bank is closed.
      *   *Subject 2 (High Stakes):* Needs to deposit a check to avoid foreclosure; huge penalty if the bank is closed.
      *   *Evidence:* Both have identical evidence (were at the bank last Saturday).
  *   **EC Prediction:** You can truthfully say "Subject 1 knows" and "Subject 2 knows." (Your conversational context is fixed and low-standard; since the word "knows" is fixed by *your* context, the subjects' stakes are irrelevant to the truth of your assertion, provided they meet the low standard).
  *   **PE Prediction:** You can truthfully say "Subject 1 knows" but you must say "Subject 2 does **not** know." (Even though your context is casual, Subject 2's high stakes destroy their epistemic status).

  *This is the crucial divergence.* In Case B, EC says the knowledge attribution remains true (because the *attributor's* standards haven't risen), while PE says the attribution becomes false (because the *subject's* stakes have risen).

  ### 3. Is Pragmatic Encroachment a Special Case of Contextualism?

  **Short Answer:** No. They are competing explanations for the same data, grounded in different domains (semantics vs. epistemology).

  **Long Answer:** It is tempting to view PE as a subset of EC because both acknowledge that practical factors influence knowledge *ascriptions*. However, they are theoretically distinct:
  1.  **Semantic Invariantism:** Proponents of PE (like Jason Stanley or Jeremy Fantl & Matthew McGrath) are typically *semantic invariantists*. They argue "knows" does not change meaning. EC is fundamentally a semantic thesis.
  2.  **The Direction of Fit:** EC explains the data by saying our *language* adjusts to the world. PE explains the data by saying the *epistemic fact* adjusts to the practical world.
  3.  **Compatibility:** Technically, one could be a Contextualist *and* believe in Pragmatic Encroachment (i.e., "knows" is context-sensitive *and* justification is stake-sensitive). However, in the literature, they are treated as rivals because they offer competing *best explanations* for Bank Cases. If PE is true, we don't *need* EC to explain why knowledge denials seem appropriate in high-stakes cases.

  ### 4. The Strongest Objections

  **Against Epistemic Contextualism: The "Semantic Blindness" / Disagreement Objection.**
  *   *The Objection:* If EC is true, when a Low-Standard attributor says "S knows" and a High-Standard attributor says "S does not know," they are not disagreeing; they are talking past each other (like "I am tall" said by a jockey vs. a basketball player). Yet, epistemic disputes feel substantive. We feel like one of us must be wrong. EC forces an error theory where speakers are blind to the context-sensitivity of their own language.
  *   *Why it hurts:* It makes the phenomenology of disagreement inexplicable.

  **Against Pragmatic Encroachment: The "Sufficiency of Evidence" (Purist) Objection.**
  *   *The Objection:* Knowledge is a function of truth, belief, and justification (evidence). If two subjects have identical evidence regarding *p*, they have identical epistemic support. Practical stakes are non-epistemic factors. Allowing non-epistemic factors to negate knowledge violates the distinction between the *theoretical* reason (evidence) and the *practical* reason (action). It implies that I can lose knowledge simply by caring more, without gaining any new evidence of error.
  *   *Why it hurts:* It threatens to collapse the distinction between *knowing p* and *being rational to act on p*. (PE proponents reply that knowledge *just is* the norm of action, but Purists find this category confusion).

  ### 5. Where They Genuinely Diverge (For Your Paper)

  Do not build your paper on first-person cases (like your apartment lease). The distinction collapses there because you are the "locus of evaluation" for both theories.

  **Focus your argument on Third-Person Attributions with Divergent Stakes.**
  The genuine divergence lies in **Case B** above (Fixed Attributor / Rising Subject Stakes).
  *   If you intuit that *you* (in a casual context) cannot truthfully say the high-stakes subject "knows," you have an intuition favoring **Pragmatic Encroachment**.
  *   If you intuit that *you* (in a casual context) can truthfully say the high-stakes subject "knows" (even if *they* shouldn't act on it without checking), you have an intuition favoring **Contextualism** (or Invariantist Purism).

  **Recommendation for Defense:**
  *   **Defend PE if:** You want to preserve a stable semantics for "knows" and argue that epistemology is inherently tied to agency and action. Your strongest move is to argue that knowledge is the norm of practical reasoning (Fantl & McGrath's strategy).
  *   **Defend EC if:** You want to preserve the idea that evidence is the only thing that matters for justification (Purism) and locate the variability in our language rather than the world. Your strongest move is to argue that PE conflates *propriety of assertion* with *truth of content*.

  **Final Warning:**
  Be careful not to conflate **Pragmatic Encroachment** with **Pragmatics**.
  *   A Contextualist might argue that in high stakes, it is *misleading* to say "I know," but still *true*. (This is a pragmatic explanation).
  *   A PE proponent argues that in high stakes, it is *false* to say "I know."
  *   Ensure your paper clarifies that PE is a thesis about **truth conditions** (via the metaphysics of justification), not merely about conversational appropriateness.

  If you can isolate the "Fixed Attributor / Rising Subject Stakes" case in your paper, you will avoid the conflation problem that has stuck you for the past week.
