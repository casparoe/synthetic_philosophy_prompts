answer: |-
  This is a sharp formulation. You're essentially channeling Marshall Sahlins (*The Original Affluent Society*) through a James Scott (*Against the Grain*) lens, but isolating **time** as the primary moral variable rather than nutrition or autonomy.

  Here is the breakdown of your premises, the credence calculation, and the "typo" you suspect you're missing.

  ### The Breakdown

  **P1: The Ethnographic/Skeletal Record (HG > Agrarian Leisure)**
  *   **Credence: 0.75**
  *   **Reasoning:** The consensus leans this way. Sahlins' original data suggested HGs worked 15–20 hours/week for subsistence. Modern re-evaluations (e.g., Kelly, Gurven) show high variance depending on latitude and resource density, but early horticulture/agriculture was undeniably labor-intensive (clearing, weeding, processing, storage defense). However, "leisure" is hard to code archaeologically. We infer it from pathology (stress markers) and caloric return rates, not time logs.
  *   **Risk:** Some HG groups worked very hard; some early farmers (in flood plains) might have had seasonal lulls.

  **P2: The Normative Weight (Leisure > Health/Security/Population)**
  *   **Credence: 0.50**
  *   **Reasoning:** This is the philosophical hinge. Classical utilitarianism often prioritizes *existence* (population size) and *survival* (lifespan). If farming allowed 100x more humans to exist, even if miserable, a totalist utilitarian calls that a win. A prioritarian or capability theorist (Sen/Nussbaum) might agree with you. But claiming it is *morally decisive* requires rejecting the value of the additional lives created.
  *   **Risk:** Most ethical frameworks treat starvation/death as a heavier negative than "boredom" or "toil."

  **P3: The 'Median' Comparability (Cross-Structure Aggregation)**
  *   **Credence: 0.60**
  *   **Reasoning:** This is methodologically fraught. A "median" HG is a full member of a kin network with social safety nets. A "median" early agrarian is often a proto-serf subject to extraction. Comparing their "discretionary hours" ignores that HG leisure is often socially embedded (ritual, visiting), while agrarian "work" might be family-integrated. Aggregating them risks a category error.
  *   **Risk:** You might be comparing "autonomous time" (HG) with "unpaid family labor" (Farm) and calling both "leisure" or "work" incorrectly.

  **P4: The Persistence (Deficit lasted ~4000+ Years)**
  *   **Credence: 0.85**
  *   **Reasoning:** Historically robust. Until the Industrial Revolution (and for many, until the 20th century), the average producer worked dawn to dusk. Surplus was extracted by elites (temples, kings), not returned to producers as leisure. The "4000 years" figure is actually conservative; it's closer to 10,000.
  *   **Risk:** Seasonal variations. Harvest was brutal, but winter might have been idle. However, net annual hours likely remained higher than HG baselines.

  ---

  ### The Calculation

  To arrive at your conclusion ("The real mistake was leisure loss, and it is morally decisive"), all four premises generally need to hold. Using a multiplicative model for necessary conditions:

  $$0.75 \times 0.50 \times 0.60 \times 0.85 = \mathbf{0.19}$$

  **Final Credence: ~19%**

  *Note:* If we treat P2 as a subjective weighting rather than a truth-claim, the **empirical** credence (that leisure *did* collapse and persist) is much higher ($0.75 \times 0.60 \times 0.85 \approx 0.38$ to $0.50$ depending on how you handle P3). But the claim that this is the *decisive moral mistake* drops the score significantly.

  ---

  ### The Weakest Link

  **P2 (Normative Weight)** is the weakest link philosophically.
  **P3 (Comparability)** is the weakest link methodologically.

  If you convince a philosopher that leisure is the ultimate good (P2), your argument becomes very strong. If you convince a historian that we can't compare HG time-use to Peasant time-use (P3), the argument dissolves.

  ### The "Typo" You're Missing

  You feel like you're missing something obvious because your model assumes a **static counterfactual**.

  **The Typo is in the Causality of P1/P4.**
  You are assuming: *Agriculture caused the leisure loss.*
  The likely reality: *Population pressure caused both the leisure loss AND the adoption of agriculture.*

  This is the **Malthusian Trap** objection. HG leisure is high *only* at low population densities. As HG groups naturally expanded (even without farming), resource depletion would have forced them to work harder for fewer calories *anyway*. Agriculture wasn't the trap; it was the escape valve that allowed the population to stabilize at a higher density, albeit with lower individual leisure.

  If you hadn't farmed, you wouldn't have kept the HG leisure; you would have had **war, famine, or infanticide** to reduce the population back to a level where leisure was possible.

  **So the trade-off isn't Leisure vs. Toil.**
  **It's Leisure (Low Pop) vs. Existence (High Pop).**

  ### What Would Change My Mind

  To increase the credence in your thesis, I would need to see:

  1.  **For P1 (Empirical):** Isotopic or osteological evidence showing early agrarians suffered from **chronic time-poverty stress** (e.g., specific cortisol markers in bone/hair) distinct from caloric stress, while contemporaneous HGs showed low stress markers *despite* similar population densities. This would decouple leisure loss from population pressure.
  2.  **For P2 (Normative):** A robust ethical framework that demonstrates why **potential lives** (the billions enabled by farming) have zero or negative moral weight compared to the **quality of life** of existing ancestors. (e.g., An antinatalist lean).
  3.  **For the "Typo" (Counterfactual):** Evidence of HG groups maintaining high leisure *while* at high population densities without farming. If such groups existed and chose farming anyway, then farming was truly a mistake. If they didn't exist, farming was a Malthusian necessity.

  ### Summary
  Your intuition is historically sound (leisure likely collapsed), but morally contingent. The "mistake" wasn't farming per se; it was locking humanity into a high-population equilibrium where leisure became an expensive luxury good rather than a default state. You're blaming the lock-in mechanism (farming) for the consequences of the door being opened (population growth).
