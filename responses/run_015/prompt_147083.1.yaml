      *   *Idea:* The "Median" person. In HG groups, there are no "median" people in the same way (no class structure). In agrarian states, the median is a peasant, but the *elite* drive the culture.
      *   *Idea:* The counterfactual. If they hadn't farmed, would they have died? Population pressure often *forces* agriculture. So the choice wasn't "leisure vs. work," it was "work vs. starvation/non-existence."
      *   *Best Catch:* The **Counterfactual Stability**. P1 assumes HG leisure was stable. But HG leisure was often contingent on low population density. Once density rose (even without farming), leisure dropped. So farming didn't *cause* the leisure loss; population pressure did, and farming was just the only way to sustain the population.
      *   *Another Catch:* P4's timeline. 4000 years? Agriculture is 12,000 years old. If the deficit lasted 10,000 years, the moral weight increases. If it was only 4000, maybe it was a transition cost.
      *   *Refined Catch:* The "Median" comparison ignores the **Risk Buffer**. HG leisure is high until a drought hits, then it's starvation. Agrarian toil is high, but starvation is less frequent (due to storage). So "Leisure" isn't just hours; it's "Secure Leisure" vs. "Precarious Leisure."

