      *   Let's refine the numbers based on current anthropological consensus.
      *   P1 (HG had more leisure): 0.75 (Some HG worked hard, but farming was definitely harder initially).
      *   P2 (Leisure > Health/Security): 0.5 (This is the big philosophical hinge).
      *   P3 (Median is comparable): 0.7 (Roughly valid).
      *   P4 (Persisted 4000+ yrs): 0.9 (Very likely).
