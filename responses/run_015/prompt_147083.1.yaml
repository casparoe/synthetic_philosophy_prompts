      *   *Nuance:* "Free time" is hard to define cross-culturally. Is food prep work? Is ritual work? However, the consensus leans towards early farming requiring *more* labor hours per capita to sustain the same caloric baseline, especially before the plow/animal traction became widespread.
      *   *Credence:* High, but not certain. Data is spotty. Let's say 0.8.

  3.  **Evaluate Premise 2 (P2): Leisure as the Welfare Metric:**
      *   *Claim:* Leisure is the *right* metric, morally decisive over lifespan or food security.
      *   *Evidence:* This is a normative/philosophical claim, not empirical. Utilitarianism might prefer more lives (population) even if shorter/harder. Prioritarianism might focus on the worst-off (starvation vs. boredom). Capability approach (Sen/Nussbaum) values freedom/time.
      *   *Nuance:* Many would argue avoiding starvation (food security) or living longer (health) trumps having an extra 10 hours to sit around. If farming prevented Malthusian crashes (eventually), does that count? The user specifies "morally decisive." This is the most contentious philosophical pivot.
      *   *Credence:* Moderate. It's a defensible position (e.g., Keynesian "economic possibilities for our grandchildren," Bertrand Russell "In Praise of Idleness"), but not the dominant view in welfare economics or bioethics. Let's say 0.6.

  4.  **Evaluate Premise 3 (P3): The 'Median' Experience Across Structures:**
      *   *Claim:* We can meaningfully compare a 'median' person across totally different social structures.
      *   *Evidence:* Comparing a !Kung forager to a Mesopotamian peasant involves comparing incommensurable social roles. HG societies often have high equality; early states had extreme hierarchy. The "median" agrarian might be a serf/slave, while the "median" HG is a full tribe member.
      *   *Nuance:* Aggregating welfare across distinct ontological categories is methodologically risky. However, for a broad macro-historical claim, we *have* to do some averaging. The risk is masking variance (e.g., early elites had great leisure).
      *   *Credence:* Moderate-High. It's a necessary simplification for the question to make sense, but statistically fraught. Let's say 0.7.

  5.  **Evaluate Premise 4 (P4): Persistence of the Deficit (~4000 Years):**
      *   *Claim:* The leisure loss lasted 4000 years, not fixed by redistribution.
      *   *Evidence:* Until the Industrial Revolution (or even later), the average laborer worked dawn to dusk. Guilds, Sabbaths, and holidays existed, but the burden of production was high. Did redistribution fix it? No, surplus was usually extracted by elites/warriors/priests, not returned as leisure to producers.
      *   *Nuance:* 4000 years takes us from ~8000 BCE to ~4000 BCE? Or 8000 BCE to 0? Agriculture started ~12kya. States ~5kya. If we mean "until modernity," that's 10,000 years. If we mean "until ancient empires stabilized," maybe 4000. The prompt says "at least four millennia." This seems plausible. The leisure *gain* is mostly a modern (post-1800) phenomenon.
