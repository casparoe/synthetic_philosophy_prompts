      *   Actually, the biggest conceptual error is usually **The Counterfactual**. Did farming *cause* the leisure loss, or did population pressure cause both farming and leisure loss? If the latter, banning farming wouldn't have saved the leisure; it would have just resulted in Malthusian checks (war/famine) reducing the population to restore leisure.
