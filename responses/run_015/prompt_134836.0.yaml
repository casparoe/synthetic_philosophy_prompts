      *(Refining the "Growth" issue)*: If the book grows, who writes the pages? The paid reader? If so, the university is employing a medium. That's the Conservator's point. Recommendation: The original volumes are closed. The *practice* continues in a separate, university-owned journal. This separates the artifact from the performance.

