      *   **The Core Conflict:** Preservation vs. Donor Intent vs. Institutional Neutrality.
      *   **Addressing Donor Intent:** Acknowledge the philosophical weight. The "no copy" rule is metaphysical, not practical. We can respect the *spirit* (limiting access) without accepting the *metaphysics* (that a scan is a soul).
      *   **Addressing Conservation:** Iron-gall ink is a ticking clock. We have a fiduciary duty to preserve knowledge. Scanning for *preservation only* is the compromise.
      *   **Addressing the "Séance" Objection:** The Conservator is right that we can't validate the metaphysics. We must frame the "reader" role as *performance art/archival access*, not spiritual communion.
      *   **Addressing the "Growth":** This is tricky. If we allow new pages, it's a living archive. If we stop, it's a historical record. Given the liability and the "chatbot" offer, freezing the collection upon accession is safer, *or* strictly regulating the addition of new pages. Let's recommend freezing the *physical* volumes but allowing the *ritual* to continue in a logbook separate from the original folios.
      *   **The Commercial Offer:** Flat rejection. Consistent with the "no copy" condition, but also standard ethical practice regarding human remains/personal papers (usually).
      *   **Recommendation:** Accept with Modifications.
      *   **Voting Options:** Clear language for the vote.

  4.  **Refining the Tone:**
