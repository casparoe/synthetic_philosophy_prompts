answer: |-
  ### Case Study: The Tripartite Sanction Protocol

  **The Scenario**
  Consider a high-level regulatory body, the *Oversight Commission*, empowered to authorize a controversial geoengineering project. The Commission's charter stipulates a **Tripartite Sanction Protocol**: authorization requires the concurrent approval of at least two out of three independent sub-committees: *Scientific Viability* ($S$), *Ethical Compliance* ($E$), and *Legal Authority* ($L$).

  Each committee receives the exact same **Evidentiary Dossier** ($D$). The dossier is unobservable to the external analyst (you), but it is sufficiently compelling that, in the actual world, it leads all three committees to vote for approval ($S=1, E=1, L=1$). The decision rule is deterministic: the Project is Authorized ($P=1$) if and only if $\sum(S, E, L) \geq 2$.

  In the actual course of events:
  1.  $D$ is issued.
  2.  $S, E,$ and $L$ independently deliberate and each votes $1$.
  3.  $P$ becomes $1$.

  **The Problem**
  You are tasked with determining whether the *Scientific Viability* committee's vote ($S=1$) was a cause of the Project's Authorization ($P=1$).

  ***

  ### The Theoretical Divergence

  This scenario generates a sharp fracture between Counterfactual-Dependence and Interventionist accounts, not merely regarding the verdict, but regarding the **ontological category** of the causal fact.

  **1. The Counterfactual-Dependence Account (Lewisian)**
  This framework analyzes causation as a relation between *events* across possible worlds. To say $S=1$ caused $P=1$ is to say that $P=1$ counterfactually depends on $S=1$. We test this by examining the nearest possible world where the putative cause does not occur ($S=0$), holding other relevant facts fixed.

  *   **The Test:** In the nearest world where $S=0$, do $E$ and $L$ remain $1$? Since the committees are independent, the failure of $S$ does not causally influence $E$ or $L$. Given the compelling Dossier $D$, $E$ and $L$ still vote $1$.
  *   **The Result:** In that world, $\sum(0, 1, 1) = 2$, so $P=1$. The outcome does not change.
  *   **The Causal Fact:** For the Counterfactualist, the causal fact is a matter of **modal fragility**. Did the outcome *hinge* on this event? Here, it did not. Therefore, strictly speaking, $S=1$ is **not a cause** of $P=1$. It is a causal free-rider.

  **2. The Interventionist Account (Woodward / Halpern-Pearl)**
  This framework analyzes causation as a relation between *variables* within a structural model. To say $S$ causes $P$ is to say there is an invariant functional relationship between them that survives surgical interventions.

  *   **The Test:** We look at the structural equation $P = f(S, E, L)$. We ask: Is there *any* valid intervention on $S$ that changes $P$, perhaps under a different contingency of the other variables?
  *   **The Result:** The structural model shows that if we were to intervene to set $S=0$ *and* hold $E=0$ (a permissible contingency in Actual Causation definitions like Halpern-Pearl), then $P$ would become $0$. The variable $S$ possesses the **capacity** to difference the outcome. The redundancy in the actual world does not erase the structural role $S$ plays in the mechanism.
  *   **The Causal Fact:** For the Interventionist, the causal fact is a matter of **structural invariance**. Does this variable occupy a node in the mechanism that *can* transmit change? Here, it does. Therefore, $S=1$ **is a cause** of $P=1$.

  ***

  ### The Verdict: Defense of Interventionism

  I take the position that the **Interventionist account** captures the causal structure more faithfully.

  In institutional and regulatory contexts, causation is not merely about which event tipped the scale in a fragile modal balance; it is about **authorization capacity**. The Scientific Committee's vote is a cause because it constitutes a necessary component of the *legitimizing mechanism*, regardless of whether it was numerically redundant in this specific instance.

  **1. Avoiding Epiphenomenalism**
  If we accept the Counterfactual verdict, we are forced into a localized epiphenomenalism: the Scientific Committee's deliberation, vote, and official record had *no causal effect* on the authorization. This is institutionally absurd. If the Legal Committee ($L$) had subsequently been found corrupt and its vote voided, the Scientific vote ($S$) would instantly become critical. The Counterfactual account implies the causal status of $S$ fluctuates based on facts about $L$ that may be unknown at the time of voting. The Interventionist account correctly identifies that $S$ was causally potent *at the time of voting* because it was part of an invariant structure ($P = \sum \geq 2$) that existed independently of the specific values $E$ and $L$ happened to take.

  **2. Avoiding Causal Pluralism**
  I am not arguing that "causation means different things in different contexts." I am arguing that **structural invariance is the fundamental metaphysical ground of causation**, while counterfactual dependence is merely a heuristic test that works in simple chains but fails in complex networks. The Interventionist account subsumes the Counterfactual insight: if $S$ is the *only* vote (1-out-of-1), the structural invariance entails counterfactual dependence. But when redundancy exists, structural invariance remains the more robust truth-maker. The causal relation *is* the invariant potential for control, not the actualized modal hinge.

  **3. The Normative Dimension**
  In regulatory science, to call something a "cause" is often to assign **responsibility**. If $S$ is not a cause, the Scientific Committee bears no causal responsibility for the project's risks. This undermines the entire purpose of the Tripartite Protocol. Interventionism preserves the link between causal contribution and normative accountability by recognizing that $S$ provided a sufficient condition for $P$ in conjunction with $E$, and retains the *capacity* to be necessary.

  ***

  ### The Conceptual Cost to the Opposing Framework

  For the Counterfactual-Dependence framework to accommodate this scenario, it must pay a steep conceptual cost: **The Surrender of Token Causation in Redundant Systems.**

  To maintain its verdict, the Counterfactualist must argue that in any symmetric overdetermination case (like the 2-out-of-3 vote), the individual tokens are not causes. To avoid the absurdity that *nothing* caused the outcome, they must resort to one of two maneuvers, both costly:

  1.  **Disjunctive Causes:** They must claim the cause was not $S$, nor $E$, nor $L$, but the *disjunctive event* $(S \lor E \lor L)$. This reifies abstract logical constructs into concrete causal relata, bloating the ontology.
  2.  **Quasi-Dependence:** They must argue that $S$ is a cause because it belongs to a *type* of process that usually involves dependence (Lewis's "quasi-dependence"). But this surrenders the purity of the counterfactual analysis. It admits that the actual causal fact depends on the *intrinsic structure* of the process (an Interventionist notion), not just the modal relations between events.

  **Conclusion**
  The Tripartite Sanction Protocol demonstrates that counterfactual dependence is too brittle to handle institutional redundancy. It mistakes the *contingent stability* of the outcome (it would have happened anyway) for the *absence of causal power*. Interventionism correctly identifies that causation in complex systems is about the **architecture of possibility**, not just the history of actuality. The Scientific Committee caused the authorization because they held a key to the lock, even if two other keys were also turned simultaneously.
