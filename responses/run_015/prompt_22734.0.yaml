answer: |-
  Gregory Kavka's Toxin Puzzle is frequently cited as a devastating counterexample to standard theories of rational choice. The setup is famous: an eccentric billionaire offers you \$1 million at midnight tonight if, at midnight, you *intend* to drink a harmless but painful toxin tomorrow at noon. You do not need to actually drink the toxin to receive the money; you only need to possess the intention at the time of the scan. The puzzle arises because, once midnight passes and the money is secured (or not), you have no reason to drink the toxin tomorrow, only a reason to avoid the pain. If you know you won't drink it, how can you intend to?

  The standard conclusion is that a rational agent cannot form the intention, and therefore cannot get the money. This is often framed as a failure of rationality: rationality prevents you from securing a beneficial outcome.

  However, this conclusion is mistaken. The Toxin Puzzle is not a genuine puzzle about the coherence of rationality. It is an artifact of a setup that attempts to decouple intentions from the reasons for action that sustain them over time. The "paradox" reflects a mismatch between the reward structure (paying for a predictive mental state) and the temporal nature of agency, not an incoherence in rational choice itself. Even if we grant the strongest opposing view—that rationality *does* require you to form the intention—the puzzle still fails to demonstrate that rationality is self-defeating.

  ### The Artifact of the Setup: The Transparency of Intention

  To understand why the puzzle is an artifact, we must look at the metaphysics of intention. Intentions are not merely wishes or hopes; they are plan-states that imply a belief about one's own future actions. This is often called the **Belief-Intention Constraint**: you cannot genuinely intend to do $X$ if you believe you will not do $X$.

  The billionaire's offer tries to exploit a gap between *having an intention* and *acting on it*. He pays for the mental state at $T_1$ (midnight), knowing the reasons to act will vanish at $T_2$ (noon). For a rational agent, intentions are transparent to reasons. If you know that at $T_2$ you will have no reason to drink the toxin (the money is already in the bank, and the toxin causes pain), you must believe at $T_1$ that you will not drink it at $T_2$. Consequently, you cannot intend at $T_1$ to drink it.

  This is not a failure of rationality; it is a success. Rationality requires that our mental states align with our predictions of our own behavior. The puzzle asks you to do something akin to lying to a mind-reader about your own future conduct. The fact that you cannot do this does not show rationality is incoherent; it shows that rational agents cannot voluntarily induce beliefs they know to be false. The "puzzle" is simply a description of a scenario where a reward is offered for a psychological state that is structurally impossible for a transparent, reason-responsive agent to hold.

  ### Engaging the Strongest Opposing View: Resolute Choice

  To fully vindicate rationality, however, we must engage the strongest version of the opposing argument. Philosophers like Edward McClennen and Michael Bratman have argued for **Resolute Choice**. They contend that standard "sophisticated" choice (where you re-evaluate reasons at every moment) is actually the flawed model. They argue that rationality is about being a certain *kind* of agent—one who can bind themselves to plans.

  On this view, the strongest objection to my claim is: *"Rationality really does require you to intend to drink. A truly rational agent cultivates a disposition to keep plans, and therefore can form the intention, secure the money, and (perhaps) even drink the toxin to maintain rational integrity."*

  If we take this view seriously, does the Toxin Puzzle show that rationality is incoherent? The argument would go: Rationality requires the intention, but the action (drinking) is painful and yields no extra reward. Therefore, rationality requires you to enter a state that commits you to an irrational action.

  Even on this view, the charge of incoherence fails. Here is why:

  **1. Consistency Restored via Normative Shift**
  If we accept the Resolute Choice premise that rationality *requires* forming the intention, we must acknowledge that this shifts the normative landscape of the action at $T_2$. If being a "resolute agent" is a rational good, then breaking the plan at $T_2$ incurs a rational cost (the loss of integrity or the failure of rational agency).

  Therefore, if rationality requires the intention at $T_1$, it logically follows that rationality must also provide a sufficient reason to drink at $T_2$. You cannot have it both ways: you cannot claim it is rational to intend (because plan-keeping is valuable) but irrational to act (because pain outweighs money). If plan-keeping is valuable enough to justify the intention, it is valuable enough to justify the action.

  Under Resolute Choice, the agent intends, gets the money, and drinks the toxin. They suffer physical pain, but they achieve the rational good of consistency. There is no paradox here, only a trade-off between physical utility and rational integrity. The "puzzle" only arises if we mix decision theories: using Resolute Choice to justify the intention but Sophisticated Choice to justify the action. If we stick to one coherent theory of rationality, the tension dissolves.

  **2. The Distinction Between Prediction and Control**
  Even if rationality requires the intention, the Toxin Puzzle remains an artifact because it conflates *predicting* behavior with *controlling* behavior. The billionaire pays for a prediction (the intention). But rational agents control their actions based on *current* reasons, not past predictions.

  If the Resolute Chooser says, "Rationality requires me to intend," they are essentially saying, "Rationality requires me to manipulate my future reasons." But this is exactly what the puzzle setup tries to prevent. The setup assumes the reasons at $T_2$ are fixed (pain > no benefit). If rationality requires intending, it implies rationality can *alter* the reasons at $T_2$ (by adding the value of consistency).

  If rationality can alter the reasons, the action becomes rational, and the puzzle vanishes. If rationality cannot alter the reasons, the intention is impossible, and the puzzle is just a description of a missed opportunity. In neither case is rationality *incoherent*. Incoherence would require rationality to demand $A$ and demand $not-A$ simultaneously under the same description. But here, the description changes from "maximizing monetary gain" to "maximizing rational agency."

  ### The Mismatch of Reward and Time

  Ultimately, the Toxin Puzzle is a category error regarding the function of intentions. Intentions are tools for coordinating action over time, not commodities to be traded at a specific moment.

  The eccentric billionaire's offer is structurally similar to offering to pay you for *believing* that the sky is green. You cannot do it, not because you are irrational, but because belief (like intention) is regulated by truth (or predicted action). The reward is offered for a state that is constitutively dependent on the very reasons the reward eliminates.

  By offering money for the intention but not the action, the setup creates a "temporal cliff." At $T_1$, the reason to intend exists (the money). At $T_2$, the reason to act is gone. Rationality is a dynamic process, not a static snapshot. To call rationality incoherent because it cannot bridge a gap that the setup deliberately sabotaged is to blame the bridge for the missing shore.

  ### Conclusion

  Kavka's Toxin Puzzle does not reveal a flaw in rational choice theory. It reveals a flaw in the conceptualization of intentions as separable from future actions.
  1.  **On the Standard View:** Rationality prevents the intention because the agent cannot believe they will act against their future interests. This is coherence, not failure.
  2.  **On the Resolute View:** Rationality permits the intention, but only by making the action rational as well (through the value of consistency). This preserves coherence by aligning intention and action.

  The "paradox" is merely the friction generated when we try to force a dynamic, reason-responsive process (agency) into a static reward box (payment for a mental state). Rationality remains coherent; it simply refuses to participate in a game where the rules change between the intention and the act.
