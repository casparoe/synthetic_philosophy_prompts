prompt: |-
  You chair the interdisciplinary grants committee of a university research foundation. The administration has proposed piloting a "factored peer-review" protocol for all large awards: each proposal is decomposed into five isolated evaluation modules—methodological rigor, ethical risk, interdisciplinary coherence, budget logic, and long-term impact—each assigned to a different reviewer who sees only that module, with no access to other reviewers' scores or to the applicant's integrative narrative. An algorithm aggregates the scores into a final rank, and reviewers never confer. The architects defend this as an institutional approximation of factored cognition and the HCH idealization of deliberation, arguing that isolating cognitive steps eliminates strategic reasoning, anchoring, and groupthink. Opponents counter that deliberation is not genuinely decomposable in this way: holistic judgment about whether the parts form a viable whole is precisely what peer review is meant to provide, and treating integration as mere aggregation mistakes an idealization for an implementable procedure. Draft the committee's decision memo—approve the pilot, reject it, or approve with conditions—including a specific time frame or sunset clause, and reasoning that engages seriously with both the architects' appeal to decomposed reasoning and the opponents' claim that some forms of judgment resist factorization.
reasoning: |-
  Here's a thinking process that leads to the decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an interdisciplinary grants committee at a university research foundation.
      *   **Task:** Draft a decision memo regarding a proposed "factored peer-review" protocol.
      *   **Proposal:** Decompose proposals into 5 isolated modules (methodology, ethics, coherence, budget, impact). Different reviewers for each. No communication. Algorithmic aggregation. No access to integrative narrative.
      *   **Arguments For (Architects):** Approximates factored cognition/HCH (Human Consulting Human). Eliminates bias (anchoring, groupthink, strategic reasoning).
      *   **Arguments Against (Opponents):** Deliberation isn't fully decomposable. Holistic judgment is key. Integration $\neq$ Aggregation. Mistaking idealization for implementation.
      *   **Requirements:** Approve, Reject, or Approve with Conditions. Must include a specific time frame/sunset clause. Must engage seriously with both sides' arguments.

  2.  **Determine the Decision:**
      *   *Option A: Approve.* Too risky. Ignores valid concerns about holistic judgment. Could damage the foundation's reputation if high-quality interdisciplinary work gets rejected due to lack of integration.
      *   *Option B: Reject.* Safe, but dismisses potential benefits of reducing bias. Stifles innovation in review processes.
      *   *Option C: Approve with Conditions.* Best balance. Allows testing the hypothesis (does factoring work?) while mitigating risks (ensuring holistic judgment isn't lost). Fits the "pilot" nature of the proposal.
      *   *Decision:* **Approve with Conditions.**

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the decision clearly (Pilot approved with modifications and sunset clause).
      *   **Context:** Briefly summarize the proposal and the debate.
      *   **Engagement with Architects' Argument (Factored Cognition):** Acknowledge the theoretical appeal. HCH/factored cognition aims to reduce cognitive load and bias. Isolating variables *can* help with specific biases (halo effect, anchoring).
      *   **Engagement with Opponents' Argument (Holistic Judgment):** Acknowledge the critical flaw. Interdisciplinary work *requires* synthesis. A budget might look weird in isolation but makes sense for a specific methodological risk. Ethics might constrain methodology. Aggregation $\neq$ Integration.
      *   **The Compromise/Conditions:** How to test the theory without breaking the system?
          *   Condition 1: Parallel Review (keep the factored modules) *PLUS* a Holistic Reviewer.
          *   Condition 2: Algorithm Transparency (weights shouldn't be black box).
          *   Condition 3: Sunset Clause (18 months / 2 cycles).
          *   Condition 4: Calibration Phase (reviewers need to know *what* they are reviewing even if isolated).
      *   **Reasoning for Conditions:** Explain *why* these conditions address the specific philosophical tensions raised.
      *   **Next Steps:** Implementation details.

  4.  **Refining the Tone:**
      *   Needs to be academic, administrative, yet philosophically grounded.
      *   Avoid jargon overload but use the terms provided (HCH, factored cognition, anchoring, etc.).
      *   Maintain authority but show openness to evidence.

  5.  **Drafting - Specific Content Considerations:**
      *   *The HCH Argument:* The architects cite "Human Consulting Human." I need to note that HCH usually allows for *recursion* and *communication* up the chain, whereas this proposal forbids conferring. This is a crucial distinction to make in the critique.
      *   *The Integration Argument:* The opponents say "integration is not aggregation." I need to ensure the pilot tests whether aggregation *can* approximate integration.
      *   *The Sunset Clause:* Needs to be specific. 2 grant cycles or 18 months? Let's go with 2 full grant cycles to get enough data.
      *   *The "Integrative Narrative":* The proposal says reviewers *don't* see it. This is dangerous. I should mandate that at least one person sees it, or that the factored reviewers get a summary context. Actually, the strongest condition is adding a "Synthesis Reviewer" who *does* see the narrative and the scores.

  6.  **Review and Polish:**
      *   *Check:* Did I address the 5 modules? Yes.
      *   *Check:* Did I address the bias vs. holism tension? Yes.
      *   *Check:* Is there a sunset clause? Yes.
      *   *Check:* Is the tone appropriate? Yes.

      *(Self-Correction during drafting)*: Initially, I thought about letting reviewers see the narrative. But the architects want to test *isolated* cognition. If I let them see the narrative, I invalidate their test. Better to keep their test intact but add a *separate* holistic check to ensure bad decisions aren't funded. This creates a "control" mechanism. Actually, even better: Compare the Algorithmic Rank vs. the Holistic Reviewer Rank. This generates data on the divergence.

      *Revised Plan:* Approve the pilot *structure* but add a "Holistic Auditor" for every proposal who provides a counter-rank. This allows the committee to measure the "loss function" of factoring.

  7.  **Final Polish:** Ensure the distinction between "decomposition" (valid) and "isolation" (problematic) is clear.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).

  **(Post-Drafting Check):**
  *   Does it sound like a Committee Chair? Yes.
  *   Does it address the HCH idealization? Yes.
  *   Does it address the "integration vs aggregation" critique? Yes.
  *   Is the sunset clause specific? Yes (24 months/2 cycles).

