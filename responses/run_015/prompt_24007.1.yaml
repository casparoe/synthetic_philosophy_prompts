      *   **Point 2: The Definition of Tracking (The Thinness).** Confirm the user's second suspicion. Tracking requires *two* counterfactuals: Sensitivity (if p were false, wouldn't believe) and Adherence (if p were true, would believe). The text only gave Sensitivity.
      *   **Point 3: Closure and the Premise (The Logical Tangle).** Address the user's first suspicion.
          *   Nozick *does* deny closure. That is a feature, not a bug, of his theory.
