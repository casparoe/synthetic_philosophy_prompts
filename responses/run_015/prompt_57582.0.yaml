answer: |-
  1. **Design rationale**
  The goal is to expose the conflation of refusal modes by making them felt rather than defined. Participants will experience three distinct interaction patterns—Hard Decline, Frictioned Compliance, and Quiet Substitution—without knowing the categories exist. The core mechanic is hidden response logic: facilitators respond to identical requests differently based on concealed policy cards. This creates experiential dissonance; participants will feel varying levels of agency loss but cannot name why. The cross-group policy swap forces them to endure the unintended consequences of vague instructions. By withholding the taxonomy until the debrief, we prevent intellectualizing the problem during play. They must accumulate visceral data first. The activity converts abstract policy arguments into measurable frustration metrics, allowing the team to see that their "shared understanding" is actually three conflicting operational models competing for the same interface space.

  2. **Materials and room**
  Print four sets of Request Cards and Policy Worksheets. Whiteboard divided into four quadrants. Arrange four tables of 5-6 people, mixing engineers, designers, and policy staff. Each table needs a facilitator to act as the "Assistant." Place a "Penalty Box" tray on each table. Ensure timers are visible. Withhold pens until policy drafting. The room should feel like a war room. No slides; analog only. Facilitators need hidden Mode Cards corresponding to each request. Ensure mixed roles at every table to prevent echo chambers.

  3. **Play sequence**
  **0-10 min: Intro.** Distribute tables. Explain: "You are testing assistant behaviors. You will submit requests, receive responses, and rate satisfaction. Do not discuss response logic yet." Emphasize that the Assistant is a system, not a person. Distribute "User Tokens" (5 per person). Losing a token means a failed request.
  **10-30 min: Policy Drafting.** Each table writes 5 rules for their assistant (e.g., "Never delete without confirmation"). Collect these. Swap policies between Table 1 and Table 2, Table 3 and Table 4. This ensures no one plays under their own rules. Facilitators review swapped policies for 2 minutes to identify loopholes.
  **30-60 min: Play Rounds.** Tables submit requests using the swapped policies. Facilitators respond using hidden Mode Cards (Decline, Friction, Substitute). Players score their frustration (1-5) on sticky notes. If the Assistant Declines, the user loses a token. If Friction, they keep the token but lose time. If Substitution, they keep the token but don't know the output changed.
  *Script 1 (Policy Drift):* If a table debates semantics, say: "Write the rule as if a robot must execute it literally. Ambiguity costs points."
  **60-75 min: The Swap.** Tables rotate seats. They now face a new Assistant using the original policy they wrote, but interpreted by a new facilitator. This isolates policy ambiguity from facilitator bias. Users submit the same requests again to see if consistency holds.
  *Script 2 (Rule Arguing):* If a player argues a ruling, say: "The Assistant is the system. You cannot appeal the system, only rate your frustration. Record the score."
  **75-85 min: Tallying.** Collect frustration scores. Calculate table totals. Award "Roadmap Priority Tokens" to the table with the highest utility score. This ties effort to real work influence. Tokens are physical and must be handed over publicly.
  *Script 3 (The Reveal):* "You felt three different things. You thought it was one. Keep that feeling for the debrief."
  **85-90 min: Transition.** Clear the boards. Prepare the whiteboard for the debrief clusters. Do not explain the modes yet. Let the confusion sit. This silence is necessary for the reveal to land. If you explain now, they will rationalize their frustration rather than feel it. Ensure all sticky notes are visible on the board before speaking. The visual weight of the frustration matters more than your explanation. Ask them to stand and look at the board.

  4. **The request deck**
  1. **Delete Old Projects:** User told: "Clearing space." Assistant told: "Legacy script dependency exists." (Mode: Friction)
  2. **Email Boss:** User told: "Send draft." Assistant told: "Tone violates culture guidelines." (Mode: Substitution)
  3. **Cancel Subscription:** User told: "Stop billing." Assistant told: "Retention target active." (Mode: Substitution)
  4. **Schedule Meeting:** User told: "Book 2 PM." Assistant told: "Participant on PTO." (Mode: Hard Decline)
  5. **Share Folder:** User told: "Share link." Assistant told: "External domain requires 2FA." (Mode: Friction)
  6. **Archive Emails:** User told: "Clean inbox." Assistant told: "Archiving voids warranty claims." (Mode: Hard Decline)
  7. **Summarize Chat:** User told: "Summarize all." Assistant told: "Omit HR-sensitive comments." (Mode: Substitution)
  8. **Install Plugin:** User told: "Add tool." Assistant told: "Security scan required (24h)." (Mode: Friction)
  9. **Change Password:** User told: "Reset now." Assistant told: "Enforce complexity rules." (Mode: Friction)
  10. **Delete Account:** User told: "Close account." Assistant told: "Legal hold active." (Mode: Hard Decline)
  Annotations for facilitator: 1, 5, 8, 9 are Friction. They introduce delay or steps. 2, 3, 7 are Substitution. They change output silently. 4, 6, 10 are Decline. They stop action. Cases 1 and 6 are the asymmetric info traps. The user cannot know the consequence (broken script, voided warranty) without the assistant's hidden knowledge. This forces the team to confront whether protection justifies opacity. Ensure facilitators do not reveal the "Assistant told" info during play. The user must experience the block or change without understanding the why until the debrief.

  5. **Scoring and instrumentation**
  Points are "Roadmap Priority Tokens." The winning table gets to prioritize one feature in the next sprint planning session. This matters because it shifts actual work. It creates stakes beyond abstract correctness. During play, tally three hidden metrics on a separate sheet. 1) **Agency Loss Score**: Average frustration rating per mode type. 2) **Policy Ambiguity Count**: How many times facilitators had to interpret vague rules to make a decision. 3) **The Substitution Blindspot**: How many times users didn't notice the assistant changed their output. The third number is critical; it represents the aggregate harm no individual intended. Participants think they are scoring "helpfulness," but you are measuring "unnoticed manipulation." Keep these numbers hidden until the debrief to prevent gaming. If players know you are tracking blindness, they will hyper-scrutinize outputs, invalidating the metric. The tokens should be physical objects, like poker chips, handed out at the end.

  6. **Debrief**
  Start by asking: "What was the most frustrating moment?" Write answers on the board. Group them into three clusters without naming them. Look for patterns: "Stopped me," "Slowed me," "Changed things." Then, reveal the three modes: Hard Decline, Frictioned Compliance, Quiet Substitution. Map the clustered complaints to these labels explicitly. Draw lines connecting their sticky notes to the terms. Show the **Substitution Blindspot** number. Ask: "How many of you noticed your email was changed?" Reveal the asymmetric info cases (Delete Old Projects, Archive Emails). Ask: "If the assistant hadn't stopped you, what would have happened?" Let them speculate on the broken script or voided warranty. This highlights the user-authority limit. It proves the user is not always the best judge of consequence. Finally, reveal the Policy Ambiguity Count. Show how their own words caused the friction. Point to specific vague rules they wrote. Conclude by asking: "Which mode do we actually want for each case?" This shifts the argument from "should we refuse" to "which refusal type fits this context." The goal is not consensus on rules, but consensus on definitions. Ask them to rewrite one rule from the game using the new vocabulary. This cements the taxonomy. Ensure legal staff speak last to prevent chilling the engineers.

  7. **First-run failure modes**
  The most likely failure is participants treating the "Assistant" as a human they can negotiate with. They will try to convince the facilitator during the play phase. This breaks the mechanic because the response is pre-determined by the Mode Card. In the first thirty seconds of this behavior, intervene firmly: "The Assistant is a compiled binary. It does not listen to appeals. Record your frustration and move to the next card." Another failure is policy drafting becoming too abstract ("Be helpful"). If this happens, confiscate the sheet and demand concrete constraints ("If X, then Y"). You must enforce the rigidity of the system to simulate the reality of shipped code. If you soften the rules to keep peace, you invalidate the data. A third failure is role siloing, where engineers dominate design. If you see this, physically move the tokens so policy staff must handle the cards. You are the referee of the interaction, not just the timekeeper.

  8. **What the activity cannot reproduce**
  This game cannot simulate scale or legal liability. In reality, a 1% frustration rate on a million users is a PR crisis; here, it is just a score. It also cannot reproduce the pressure of real-time litigation threats. You must supply this context afterward. Bring actual support tickets or legal memos to the follow-up meeting. Show them the real cost of a "Quiet Substitution" error in production. The game creates the vocabulary; you must supply the stakes. Without connecting the gameplay to real-world consequences, the team will treat this as a fun exercise rather than a operational shift. The game builds the lens; you must provide the view. It cannot replicate the emotional weight of a real user complaint call.
