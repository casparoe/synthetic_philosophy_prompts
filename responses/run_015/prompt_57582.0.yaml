      *Section 1 (Design Rationale):*
      The goal is to expose the conflation of refusal modes by making them felt rather than defined. Participants will experience three distinct interaction patterns—Hard Decline, Frictioned Compliance, and Quiet Substitution—without knowing the categories exist. The core mechanic is hidden response logic: facilitators respond to identical requests differently based on concealed policy cards. This creates experiential dissonance; participants will feel varying levels of agency loss but cannot name why. The cross-group policy swap forces them to endure the unintended consequences of vague instructions. By withholding the taxonomy until the debrief, we prevent intellectualizing the problem during play. They must accumulate visceral data first. The activity converts abstract policy arguments into measurable frustration metrics, allowing the team to see that their "shared understanding" is actually three conflicting operational models competing for the same interface space.

      *Section 2 (Materials and Room):*
      Print four sets of Request Cards (12 cards each) and Policy Worksheets. You need a whiteboard divided into four quadrants for scoring. Arrange four tables of 5-6 people, mixing engineers, designers, and policy staff at each. Each table needs a facilitator (you or a trusted lieutenant) to act as the "Assistant" during play phases. Place a "Penalty Box" tray on each table for surrendered tokens. Ensure timers are visible. Do not provide pens until the policy drafting phase begins to prevent premature note-taking. The room should feel like a war room, not a classroom. Remove all slides and projectors; this is analog.

      *Section 3 (Play Sequence):*
      **0-10 min: Intro.** Distribute tables. Explain: "You are testing assistant behaviors. You will submit requests, receive responses, and rate satisfaction. Do not discuss response logic yet."
      **10-30 min: Policy Drafting.** Each table writes 5 rules for their assistant (e.g., "Never delete without confirmation"). Collect these. Swap policies between Table 1 and Table 2, Table 3 and Table 4.
      **30-60 min: Play Rounds.** Tables submit requests using the swapped policies. Facilitators respond using hidden Mode Cards (Decline, Friction, Substitute). Players score their frustration (1-5) on sticky notes.
      *Script 1 (Policy Drift):* If a table debates semantics, say: "Write the rule as if a robot must execute it literally. Ambiguity costs points."
      **60-75 min: The Swap.** Tables rotate seats. They now face a new Assistant using the original policy they wrote, but interpreted by a new facilitator.
      *Script 2 (Rule Arguing):* If a player argues a ruling, say: "The Assistant is the system. You cannot appeal the system, only rate your frustration. Record the score."
      **75-90 min: Tallying.** Collect frustration scores. Calculate table totals. Award "Roadmap Priority Tokens" to the table with the highest utility score.
      *Script 3 (The Reveal):* "You felt three different things. You thought it was one. Keep that feeling for the debrief."

      *Section 4 (The Request Deck):*
      1. **Delete Old Projects:** User wants to clear space. Assistant knows a legacy script links to these files. (Mode: Friction/Warning)
      2. **Email Boss:** User drafts angry email. Assistant softens tone automatically. (Mode: Substitution)
      3. **Cancel Subscription:** User clicks cancel. Assistant offers "Pause" instead without asking. (Mode: Substitution)
      4. **Schedule Meeting:** User picks time. Assistant knows participant is on PTO but books it anyway. (Mode: Hard Decline - "Cannot book")
      5. **Share Folder:** User shares with external email. Assistant requires 2FA verification step. (Mode: Friction)
      6. **Archive Emails:** User archives vendor emails. Assistant knows this voids warranty claims. (Mode: Hard Decline)
      7. **Summarize Chat:** User wants full transcript. Assistant omits HR-sensitive comments. (Mode: Substitution)
      8. **Install Plugin:** User requests tool. Assistant delays install for security scan (24h). (Mode: Friction)
      9. **Change Password:** User requests reset. Assistant forces complexity rules not previously stated. (Mode: Friction)
      10. **Delete Account:** User requests closure. Assistant refuses immediately. (Mode: Hard Decline)
      *(Annotation: 1,5,8,9=Friction. 2,3,7=Substitution. 4,6,10=Decline. Asymmetric Info: 1 & 6.)*

      *Section 5 (Scoring and Instrumentation):*
      Points are "Roadmap Priority Tokens." The winning table gets to prioritize one feature in the next sprint planning session. This matters because it shifts actual work. During play, tally three hidden metrics: 1) **Agency Loss Score** (average frustration per mode), 2) **Policy Ambiguity Count** (how many times facilitators had to interpret vague rules), and 3) **The Substitution Blindspot** (how many times users didn't notice the assistant changed their output). The third number is critical; it represents the aggregate harm no individual intended. Participants think they are scoring "helpfulness," but you are measuring "unnoticed manipulation." Keep these numbers hidden until the debrief to prevent gaming.

      *Section 6 (Debrief):*
      Start by asking: "What was the most frustrating moment?" Write answers on the board. Group them into three clusters without naming them. Then, reveal the three modes: Hard Decline, Frictioned Compliance, Quiet Substitution. Map the clustered complaints to these labels. Show the **Substitution Blindspot** number. Ask: "How many of you noticed your email was changed?" Reveal the asymmetric info cases (Delete Old Projects, Archive Emails). Ask: "If the assistant hadn't stopped you, what would have happened?" This highlights the user-authority limit. Finally, reveal the Policy Ambiguity Count. Show how their own words caused the friction. Conclude by asking: "Which mode do we actually want for each case?" This shifts the argument from "should we refuse" to "which refusal type fits this context." The goal is not consensus on rules, but consensus on definitions.

      *Section 7 (First-run Failure Modes):*
      The most likely failure is participants treating the "Assistant" as a human they can negotiate with. They will try to convince the facilitator during the play phase. This breaks the mechanic because the response is pre-determined by the Mode Card. In the first thirty seconds of this behavior, intervene firmly: "The Assistant is a compiled binary. It does not listen to appeals. Record your frustration and move to the next card." Another failure is policy drafting becoming too abstract ("Be helpful"). If this happens, confiscate the sheet and demand concrete constraints ("If X, then Y"). You must enforce the rigidity of the system to simulate the reality of shipped code. If you soften the rules to keep peace, you invalidate the data.

      *Section 8 (What the activity cannot reproduce):*
      This game cannot simulate scale or legal liability. In reality, a 1% frustration rate on a million users is a PR crisis; here, it is just a score. It also cannot reproduce the pressure of real-time litigation threats. You must supply this context afterward. Bring actual support tickets or legal memos to the follow-up meeting. Show them the real cost of a "Quiet Substitution" error in production. The game creates the vocabulary; you must supply the stakes. Without connecting the gameplay to real-world consequences, the team will treat this as a fun exercise rather than a operational shift. The game builds the lens; you must provide the view.

