  ### The Dramatist's Decision Tree

  This tree forces you to log your concrete production choices. Your path reveals your implicit ethical position. There are 8 questions (nodes) and 9 endpoints (leaves).

  **Q1. Consent:** Is there written evidence the subject refused portrayal? (Case 6)
  *   **Yes:** Go to **Leaf 1**.
  *   **No:** Go to Q2.

  **Q2. Clarity:** Are you merging five minor real people into one composite character? (Case 3)
  *   **Yes:** Go to Q3.
  *   **No:** Go to Q4.

  **Q3. Label (Composite):** Will the marketing materials signal "History" or "Fiction"? (Distinction A)
  *   **History:** Go to **Leaf 2**.
  *   **Fiction:** Go to **Leaf 3**.

  **Q4. Vanity:** The subject's memoir contradicts the archive. Do you publish the archive? (Case 4)
  *   **Yes (Archive Wins):** Go to **Leaf 4**.
  *   **No (Memoir Wins):** Go to Q5.

  **Q5. Power:** The subject was exploited; records are institutional. Do you trust the institution? (Case 5)
  *   **Yes (Institution Wins):** Go to **Leaf 4** (Merges with Skeptic).
  *   **No (Subject Wins):** Go to **Leaf 5**.

  **Q6. Plot:** Are you inventing sex, moving speeches, or making a minor figure a villain? (Cases 1, 2, 7)
  *   **Yes:** Go to Q7.
  *   **No:** Go to Q8.

  **Q7. Label (Plot):** Will the marketing materials signal "History" or "Fiction"? (Distinction A)
  *   **History:** Go to **Leaf 6**.
  *   **Fiction:** Go to **Leaf 7**.

  **Q8. Selection:** Did you choose this subject over a more marginalized contemporary due to marketability? (Distinction B)
  *   **Yes:** Go to **Leaf 8**.
  *   **No:** Go to **Leaf 9**.

  ***

  ### The Leaves (Positions)

  1.  **The Executor**
      *   *Awkward Commitment:* You must silence a story that might educate the living to honor the autonomy of the dead.
  2.  **The Administrator**
      *   *Awkward Commitment:* You lie about names to tell the truth about forces, risking the erasure of the specific people you merged.
  3.  **The Collagist**
      *   *Awkward Commitment:* You admit the artifice, which allows the audience to dismiss the emotional truth as "just made up."
  4.  **The Skeptic**
      *   *Awkward Commitment:* You humiliate the dead to save them from their own vanity, assuming you know them better than they knew themselves.
  5.  **The Restorer**
      *   *Awkward Commitment:* You privilege a voice that the historical record tried to destroy, risking factual accuracy for moral repair.
  6.  **The Architect**
      *   *Awkward Commitment:* You build a lie to support a truth, betting that the audience won't notice the load-bearing fictions.
  7.  **The Novelist**
      *   *Awkward Commitment:* You use real bones to build a fake body, inviting criticism from historians you explicitly disavowed.
  8.  **The Curator**
      *   *Awkward Commitment:* You admit your art is an act of exclusion, acknowledging that telling this story killed another one.
  9.  **The Chronicler**
      *   *Awkward Commitment:* You bore the audience to keep the record clean, risking irrelevance in the name of fidelity.

  ***

  ### Logical Space Analysis

  **Unoccupied Combinations**
  *   **Refusal + History Marketing:** *Incoherent.* You cannot claim historical fidelity while violating an explicit historical constraint (the subject's will). This path is blocked at Q1.
  *   **Composite + No Label:** *Unattractive.* Writers rarely admit to composites without signaling fictionality, as the risk of being caught is too high. The tree forces a choice at Q3.
  *   **Exploited Subject + Institution Wins:** *Untried.* While possible (Q5 Yes merges to Leaf 4), few writers explicitly adopt the "Institution Wins" stance for exploited subjects anymore; they usually route through "Subject Wins" (Leaf 5) or avoid the subject entirely.

  **Unseparable Leaves**
  *   **Leaf 4 (The Skeptic) and Leaf 5 (The Restorer):** The tree separates them based on *source* priority (Archive vs. Subject), but in practice, both positions claim to be "telling the truth." To an audience, the difference is often invisible; both look like "History." The tree separates the *method*, but not the *reception*.
  *   **Leaf 2 (The Administrator) and Leaf 6 (The Architect):** Both market as History while altering reality. One alters *identity* (composites), the other alters *event* (invention). To the audience, the harm is identical (misinformation), making these ethically indistinguishable from the viewer's perspective, even if the writer justifies them differently.

  ***

  ### Evaluation of Pet Distinctions

  **(a) The Two-Audience Problem (Duty to Person vs. Duty to Audience)**
  *   **Verdict:** **Load-Bearing.**
  *   **Placement:** Q3 and Q7.
  *   **Why:** This distinction is the primary switch for *harm calculation*. Inventing a sex scene (Case 1) is ethically neutral if the audience knows it is fiction (Leaf 7), but potentially defamatory if they believe it is history (Leaf 6). The tree proves this distinction is not just theoretical; it is the specific decision that determines whether you land in "Novelist" or "Architect." Without this branch, the tree collapses into a simple "Fidelity vs. Freedom" binary that fails to capture the risk of deception.

  **(b) Attention Scarcity (Opportunity Cost/Canon)**
  *   **Verdict:** **Orthogonal (Not a Sorting Distinction).**
  *   **Placement:** Q8 (Isolated at the end).
  *   **Why:** This distinction does not sort the *depiction* decisions; it sorts the *selection* decision. You can be an "Architect" (Leaf 6) who considered opportunity cost, or a "Chronicler" (Leaf 9) who did not. Because it applies across all other positions rather than branching off them, it functions as a modifier rather than a structural pillar. I placed it at Q8 to generate the "Curator" leaf, but note that it is logically independent of the fidelity/invention debates. It answers "Why this dead person?" rather than "How to treat this dead person?" which is why it sits at the periphery of the tree.
