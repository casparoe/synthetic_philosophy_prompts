answer: |-
  So, picture it: 1978, the Municipal Bureau of Sidewalks & Vibes. They issue Regulation 99: "Walking is mandatory, but feet must not touch the ground." It's written in invisible ink and locked in a safe behind a radiator.

  Fuller immediately calls foul. This violates like half his eight desideratas straight up. It's impossible, secret, and there's zero congruence between the rule and reality (everyone's still walking normally). For Fuller, this isn't just bad law, it's *not law* because it lacks the internal morality of law.

  Hart just checks his Rule of Recognition. Since no secondary rule authorized this weirdness, he says it's not law, it's just a bad joke. His separation thesis stays intact—law is what the sources say, not what morality wants.

  Enter Gary, the junior clerk. He wants to save the regulation. "What if we add a Ninth Desideratum?" he says. "Every statute needs an IKEA-style user manual."

  He prints a manual that says "Ignore Regulation 99, just walk normally."

  Suddenly, official action matches the declared rule (via the manual). Congruence is back!

  Fuller claps. "See! The internal morality of law corrected itself! It's valid now!"

  Hart rubs his chin. "But the Rule of Recognition didn't validate the manual. So the manual is the law, and the regulation is just... packaging?"

  Gary holds up the manual, which is now thicker than the statute book. "So... is the law the rule, or the instructions on how to ignore the rule?"

  Everyone realizes the manual didn't make it law, it just proved the original text was dead on arrival.

  Verdict: The natural lawyer gets dunked on because you can't IKEA-fy a legal system into morality.
