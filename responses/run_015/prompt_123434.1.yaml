answer: |-
  **Messy Brainstorm: Candidate Readings of "Meanings Ain't in the Head"**

  *   Reference isn't determined by concepts.
  *   You need eyes to learn words. (Too weak)
  *   Mental states don't supervene on brain states.
  *   Experts fix what words mean, not users.
  *   Speakers can be wrong about what they talk about.
  *   Water is H2O necessarily.
  *   Causal chains matter more than descriptions.
  *   Internal duplicates can mean different things.
  *   Meaning isn't a psychological entity.
  *   You can't know meaning by introspection.
  *   Social environment constitutes content.
  *   Physical environment constitutes content.
  *   Descriptions don't pick out natural kinds.
  *   Meaning involves hidden essences.
  *   Privileged access is an illusion.
  *   Semantics is external to the organism.
  *   Intension doesn't determine extension.
  *   Meaning is normative, not descriptive.
  *   The world helps think your thoughts.

  **Pruned Menu: Precise Claims**

  I'll organize these into three tiers based on philosophical weight.

  1.  **The Platitude:** *Interaction Requirement.* Learning meaning requires causal interaction with the world. (True, but trivial; doesn't support externalism).
  2.  **Substantive Semantic Claims:**
      *   **Metaphysical Externalism:** Reference is fixed by causal/historical links to the environment, not internal descriptions.
      *   **Anti-Descriptivism:** Associated concepts (intensions) do not determine extension.
      *   **Essentialism:** Natural kind terms rigidly designate underlying structures (e.g., microstructure).
  3.  **Substantive Psychological/Epistemic Claims:**
      *   **Psychological Externalism:** Mental content (what you think) does not supervene on physical states of the head.
      *   **Epistemic Opacity:** Speakers lack privileged access to the truth conditions of their own thoughts/terms.
      *   **Division of Linguistic Labor:** Extension is often fixed by experts, not the individual speaker.

  **Diagnosing the TA's Moves**

  **Move 1 (Oscar vs. Twin Oscar):** The TA claims the slogan settles that they mean different things.
  *   **Required Reading:** *Psychological Externalism.*
  *   **Verdict:** The slogan alone doesn't get him there. He needs the premise that "meaning determines reference" and "reference differs." The slogan is the *conclusion* of the Twin Earth argument, not a premise. Using it to shut down the internalist intuition begs the question. He needs to argue that the causal chain differs, not just assert the slogan. Without establishing that reference *is* external, the internalist claim (identical heads = identical meanings) stands unrefuted.

  **Move 2 (Chemistry Knowledge):** The TA claims Oscar doesn't need chemistry to know his meaning.
  *   **Required Reading:** *Epistemic Opacity* + *Division of Linguistic Labor.*
  *   **Verdict:** This is defensible but requires nuance. The slogan implies Oscar possesses the meaning without knowing the essence. However, the TA skips the cost: if Oscar doesn't know the extension conditions, in what sense does he "know what he means"? He knows the *concept*, but not the *content*. The TA needs to distinguish knowing the *word* from knowing the *nature of the referent*. The slogan supports this, but only if you accept that meaning isn't purely conceptual.

  **Stress-Testing the Variants**

  Here is where the slogan's sloppiness becomes dangerous. I will test the **Metaphysical Externalism** and **Epistemic Opacity** readings, as they are the heavy lifters.

  **1. Detection-lag Twin Earth**
  *   *Setup:* H2O/XYZ difference exists but is undetectable for centuries.
  *   **Metaphysical Externalism:** Verdict: **Reference differs immediately.** Oscar refers to H2O, Twin Oscar to XYZ. The causal link exists regardless of detectability. The physical difference fixes reference, not the epistemic access.
  *   **Epistemic Opacity:** Verdict: **Oscar is ignorant.** He cannot know what he means until the science arrives.
  *   **Robustness:** This reading survives well. It highlights that reference is a metaphysical relation, not an epistemic one. However, it strains the "causal" intuition: if the difference never interacts with Oscar, is the causal link distinct? A strict causal theorist says yes (different substances cause the tokening), but a verificationist would say the case is underdescribed. If the substances are causally indistinguishable *to the speaker*, the causal chain looks identical from the inside. Externalism demands we privilege the God's-eye view.

  **2. Future-shift Twin Earth**
  *   *Setup:* Environment shifts from H2O to XYZ over 200 years during Oscar's life.
  *   **Metaphysical Externalism:** Verdict: **Ambiguous/Complex.** Does reference shift gradually or stay fixed? Standard causal theory (Kripke/Putnam) suggests initial baptism fixes reference rigidly. So Oscar refers to H2O even when drinking XYZ, unless he re-baptizes. However, if the *community* shifts, the *Division of Labor* suggests his borrowing chain updates.
  *   **Epistemic Opacity:** Verdict: **Oscar remains ignorant of the shift.**
  *   **Robustness:** This case breaks the slogan's simplicity. If meanings ain't in the head, where are they? In the past (initial baptism) or the present (current environment)? If the environment changes, does the meaning change? Externalism usually says no (reference is historical), but this conflicts with the intuition that meaning tracks current usage. The TA's slogan offers no help here; you need a specific theory of reference borrowing over time.

  **3. Silent-disposition Twin Earth**
  *   *Setup:* XYZ differs only in a disposition never actualized (modal difference only).
  *   **Metaphysical Externalism:** Verdict: **Fails/Underdescribed.** This is the killer case. Externalism relies on causal interactions to fix reference. If the dispositional difference never manifests, there is no actual causal difference in the history of the universe linking Oscar to H2O vs. Twin Oscar to XYZ. The causal chains are physically identical in all actual events.
  *   **Essentialism:** Verdict: **Struggles.** If the essence is purely modal and never actualized, how does the speaker latch onto it?
  *   **Robustness:** This reading collapses. If there is no actual causal distinction, Metaphysical Externalism cannot distinguish the references without smuggling in descriptivism (e.g., "the stuff that *would* behave differently"). But Putnam rejects descriptivism. This suggests the slogan only works when there are *actual* physical differences to ground the causal chain. Without actual divergence, "meaning ain't in the head" loses its anchor.

  **Conclusion**

  The slogan is a useful heuristic for standard cases but fractures under pressure. Your TA uses it as a premise to block internalist intuitions, but it is really a conclusion dependent on specific causal metaphysics.
  *   **Move 1** works only if you accept Psychological Externalism, which the Detection-lag case supports but the Silent-disposition case threatens.
  *   **Move 2** works only if you accept Epistemic Opacity, which holds across all cases but comes at the cost of making meaning opaque to the speaker.
  *   **Robustness:** The slogan is robust for Detection-lag (metaphysics trumps epistemology) but fragile for Silent-disposition (no causal hook) and Future-shift (temporal ambiguity).

  If you want to push back, focus on **Variant 3**. Ask the TA: "If the causal history is identical in all actual events, what external fact makes the meanings different?" If he says "the modal essence," ask how Oscar latches onto that without a description. If he can't answer, the slogan is doing no work; it's just hiding a descriptivist premise.
