answer: |-
  Your tentative principle is remarkably robust because it attempts to bridge two distinct philosophical traditions: **natural law** (was the act inherently wrong?) and **procedural justice** (is the court fair and consistent?).

  However, to answer your first question directly: **No, it does not quite hold together in its current form.** The tension lies in your second condition ("the side doing the prosecuting would accept the same rule applied to itself"). Taken literally, this creates a *tu quoque* (you also) trap that paralyzes justice. If the Allies firebombed Dresden, does that mean the German general who burned a village in reprisal cannot be convicted? If the US used forced labor, is the German factory director innocent?

  If you enforce the reciprocity condition strictly, you must acquit the Factory Director and the General. But you say you *want* to convict them. This suggests your intuition recognizes a difference between **individual culpability** and **institutional legitimacy**.

  Here is where your principle breaks, how to fix it without abandoning your verdicts, and how it applies to your two new cases.

  ### 1. Where the Principle Breaks (and how to save your verdicts)

  You do not need to give up your verdicts, but you need to decouple the *guilt of the defendant* from the *purity of the tribunal*.

  **The Factory Director (Forced Labor)**
  *   **The Conflict:** You want to convict (because slavery is wrong) but call the court corrupt (because Allies did it too).
  *   **The Fix:** Distinguish between *malum in se* (wrong in itself) and *malum prohibitum* (wrong because prohibited).
      *   The Factory Director's guilt rests on *malum in se*. Deporting civilians into slave conditions violates a universal moral baseline that exists regardless of treaties. His culpability is real.
      *   The Court's hypocrisy rests on *malum prohibitum*. The Allies violated norms they were enforcing.
      *   **Revised Verdict:** The Director is **Guilty**, but the Tribunal lacks **Moral Standing**. You can uphold the conviction without endorsing the court's purity. The "corruption" you sense is not in the verdict, but in the sentencing and the historical record (i.e., he should be punished, but the Allies should also have been investigated, even if politics prevented it).

  **Aggressive War vs. Colonial Practice**
  *   **The Conflict:** You say prosecuting Aggressive War is "Right" but Colonial Practices are "Wrong," yet both were "routine" and claimed as sovereign rights.
  *   **The Fix:** The distinction is **Positive Law existing at the time.**
      *   **Aggressive War:** By 1939, the **Kellogg-Briand Pact (1928)** had been signed by Germany, Japan, and the Allies, renouncing war as an instrument of national policy. While enforcement mechanisms were absent, the *standard he could recognise* existed in treaty law. It was no longer a pure "sovereign right" in the eyes of signatories.
      *   **Colonial Practice:** In 1940, colonialism was still legal under international law. The UN Charter's anti-colonial provisions came later. There was no treaty the defendant could point to that said "colonial administration is a crime."
      *   **Revised Verdict:** Keep **Aggressive War = Right** (based on treaty violation + natural law against mass death). Keep **Colonial Practice = Wrong** (based on lack of prior prohibition). The principle holds if "standard he could recognise" includes signed treaties, not just moral intuition.

  ### 2. Refining the Principle

  Your principle needs to separate the **Substantive Test** from the **Legitimacy Test**.

  > **Revised Principle:** A prosecution is **substantively just** if the act violated a moral or legal standard accessible to the defendant at the time (*nullum crimen* softened by natural law). A prosecution is **procedurally legitimate** if the prosecutors are not exempt from the rules they enforce.
  >
  > *   If Substantive Justice is met but Procedural Legitimacy fails (Factory Director): Convict, but acknowledge the taint on the court.
  > *   If Substantive Justice fails (Colonialism): Acquitt, regardless of procedural legitimacy.

  This allows you to keep all your intuitive verdicts without contradiction.

  ### 3. Applying the Best Version to Your Two New Cases

  Here is how this refined framework evaluates the two unsettled scenarios you proposed.

  **Case A: A tribunal created by a treaty signed by winners and losers alike, applying a statute drafted after the fighting ended.**

  *   **Analysis:** This addresses the "sovereign right" and "consent" objections. By signing the treaty (e.g., the Instrument of Surrender or Potsdam Agreement), the defeated leadership technically consented to the jurisdiction, waiving the "victor's justice" objection regarding *authority*.
  *   **The Catch:** The statute was drafted *after* the fighting. This still triggers the *ex post facto* concern.
  *   **Verdict under your principle:**
      *   **Substantive:** If the acts were *malum in se* (extermination, slavery), the timing of the statute matters less. If the acts were *malum prohibitum* (aggressive war), the retroactive statute is problematic *unless* the treaty itself is viewed as a ratification of prior customary law.
      *   **Legitimacy:** High. The signature of the losers converts the tribunal from "imposed justice" to "contractual justice."
      *   **Conclusion:** This is **Legitimate**, provided the crimes charged were not invented wholly out of thin air but codified existing norms. The signature bridges the gap between "rules invented for the occasion" and "agreed-upon rules."

  **Case B: A prosecution brought fifty years later, once the defendants' own country has itself adopted the law it is being tried under.**

  *   **Analysis:** This is the strongest possible case for legitimacy under your principle.
      *   **Standard Recognised:** The defendant's own society has now internalized the law. The "standard he could recognise" is no longer an external imposition by victors, but a value held by his own children and countrymen.
      *   **Reciprocity:** Because the law is now domestic and (presumably) universal, the "victor" element vanishes. The court is applying a law the defendant's own nation accepts.
  *   **Verdict under your principle:** **Fully Legitimate.**
      *   This resolves the "Victor's Justice" critique entirely. It also resolves the *ex post facto* worry in a moral sense: while the law was not on the books *then*, the moral prohibition was timeless (*malum in se*), and the delay allows for a calm, non-vindictive application of justice (as seen in later trials of camp guards in the 1990s).
      *   **Caveat:** This works best for *malum in se* crimes (genocide, torture). It works less well for *malum prohibitum* (economic crimes, specific regulatory violations) where the law truly did not exist before.

  ### Summary

  Your instincts are historically and morally sounder than the binary "Victor's Justice vs. Perfect Justice" debate.

  1.  **Don't give up the verdicts.** They reflect a nuanced understanding of guilt vs. jurisdiction.
  2.  **Modify the principle.** Separate **Culpability** (was the act wrong?) from **Standing** (does the court have the right to judge?). A defendant can be culpable even if the court lacks standing (Factory Director), but a court should not prosecute where there is no culpability (Colonialism).
  3.  **The Two Cases.** The **Treaty Case** is legitimate because it establishes consent. The **50-Year Case** is the *most* legitimate, because it satisfies your reciprocity condition: the defendant's own society now agrees with the judgment, removing the "winner/loser" dynamic entirely.

  You are essentially arguing for a **Natural Law** approach to culpability (some things are always wrong) combined with a **Republican** approach to legitimacy (laws must apply equally to the rulers and the ruled). That is a coherent and defensible position.
