      *   *Key Insight to Offer:* The "Reciprocity" condition (Component 2) is a test of *political legitimacy*, not *moral guilt*. A murderer is still a murderer even if the police also speed. But a court that ignores its own speeding loses moral authority. The Factory Director is guilty, but the trial is tainted.
