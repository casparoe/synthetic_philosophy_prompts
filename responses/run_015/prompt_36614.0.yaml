answer: |-
  You are struggling because you are trying to find a principle that distinguishes *truth* from *falsehood*, when the demarcation you actually care about distinguishes *inquiry* from *ideology*. Your friend is right that a purely sociological definition (credentials, venues) fails, but your initial methodological definition (immunization, conspiracy) felt post-hoc because it lacked a specific metric for *what* is being immunized.

  Here is the principle that captures your verdicts, the verdicts you must discard to keep it coherent, and the resolution to the vindication problem.

  ### The Principle: Invariant Epistemic Rules

  **Pseudohistory is defined not by the falsity of its claims, but by the ad hoc modification of the rules of evidence required to sustain them.**

  A historical argument is **legitimate** (even if wrong, fringe, or vindicated later) if it submits its core thesis to the same methodological rules that govern the rest of the discipline. It accepts that if the standard tools (linguistics, stratigraphy, carbon dating, textual criticism) contradict the thesis, the thesis must fall.

  A historical argument is **pseudohistory** if it treats its core thesis as an exception to those rules. It retains the standard tools only when they support the thesis; when they contradict it, it declares the tools themselves corrupt, forged, or misinterpreted *specifically in that instance*, without independent justification.

  **The Test:** Ask, "If this claim were about a different topic, would the proponent accept this evidence?"
  *   **Schliemann:** If he found a layer contradicting Homer, he would have accepted it as a different layer. He broke the *site*, not the *method*.
  *   **Fomenko:** If astronomy contradicts his chronology, he claims the astronomy records are forged. He breaks the *method* to save the *claim*.

  ### Mapping Your Verdicts to the Principle

  This principle cleanly sorts your "easy" cases:
  *   **Fomenko/Ancient Aliens/Occult Atlantis:** **Pseudohistory.** They invoke global forgeries or alien interventions specifically to explain away contradictory data (carbon dates, linguistic evolution). The rules change to fit the conclusion.
  *   **Kensington Runestone:** **Pseudohistory.** Proponents accept linguistic dating for other runes but claim this specific stone is an exception due to "unknown dialects" or "lost travelers," without independent evidence of those dialects.
  *   **Menzies (1421):** **Pseudohistory.** He accepts naval logistics when they suit him but ignores wind patterns and supply limits when they contradict his route.
  *   **Plato's Atlantis (Kernel):** **Legitimate Speculation.** It hypothesizes a natural disaster (Santorini) using standard geology and archaeology. If the dating doesn't match, the hypothesis fails; it doesn't claim the dating is wrong.
  *   **Black Athena:** **Contested History.** Bernal used standard philology and archaeology. He was argued against using standard philology and archaeology. The rules were invariant; the interpretation was disputed.
  *   **Pre-Clovis Advocates:** **Legitimate Fringe.** They did not claim radiocarbon dating was wrong; they claimed *specific samples* were older. They invited new dating. They played by the rules.
  *   **Pre-L'Anse Norse Defenders:** **Legitimate Fringe.** They relied on textual analysis that was plausible within the rules of saga studies. They lacked material evidence, but they didn't claim material evidence was a conspiracy.

  ### The Verdicts You Must Discard (or Revise)

  To maintain coherence under **Invariant Epistemic Rules**, you must adjust two specific judgments:

  **1. The Solutrean Hypothesis**
  *   **Your Verdict:** "Fringe" (implied: not pseudohistory) because it was published by credentialed archaeologists in mainstream venues.
  *   **The Conflict:** Credentials do not guarantee Invariant Epistemic Rules. If the Solutrean hypothesis requires ignoring established paleo-oceanography (ice shelf viability) or genetic data *only* to make the trans-Atlantic crossing work, while accepting that data for all other migrations, it is pseudohistorical in method, regardless of the authors' PhDs.
  *   **The Fix:** You must judge Solutrean by its engagement with oceanography and genetics, not its venue. If it dismisses genetic null-results as "extinction events" without evidence while accepting genetics elsewhere, it moves to **Pseudohistory**. If it simply argues a low-probability route using standard models, it remains **Fringe**. Do not let credentials shield methodological exceptions.

  **2. Schliemann**
  *   **Your Verdict:** "Bad Archaeology," not pseudohistory.
  *   **The Conflict:** Your friend argues Schliemann's circular reading of Homer looks like Menzies.
  *   **The Fix:** You are right to keep him as "Bad Archaeology," but your reasoning needs sharpening. Schliemann was incompetent, not corrupt. He destroyed stratigraphy, but he did not *theorize* that stratigraphy was a hoax. He accepted the *validity* of the counter-evidence (layers exist) even if he ruined the specific instance. Menzies denies the validity of the counter-evidence (naval logistics don't apply to Chinese junks).
  *   **The Clause:** Incompetence within the rules is not pseudohistory. Rejection of the rules is.

  ### Predictions for New Cases

  **1. Graham Hancock (Lost Ice-Age Civilization)**
  *   **Analysis:** Hancock responds to counter-evidence, but selectively. When geology contradicts a submerged site, he invokes rapid sea-level rise (standard) but then claims a sophisticated culture existed *before* that rise without leaving distinct stratigraphic markers (non-standard). He argues that the lack of evidence *is* evidence (they were wiped clean).
  *   **Verdict:** **Pseudohistory.**
  *   **Why:** He invokes a "civilization" that behaves unlike all other known civilizations in terms of material footprint. He modifies the rule "civilizations leave material traces" specifically for his thesis. He treats the absence of evidence as evidence of destruction, a move he does not apply to other historical gaps.

  **2. Oxfordian Shakespeare (De Vere authorship)**
  *   **Analysis:** This relies on cipher-breaking and biographical allegory. It accepts documentary evidence for Stratford Shakespeare as "cover-up" but accepts documentary evidence for De Vere's life as "clues."
  *   **Verdict:** **Pseudohistory.**
  *   **Why:** It requires a conspiracy of silence among contemporaries that is historically unique in scale. It treats the lack of contemporary accusation as proof of the conspiracy's success (immunization). It applies textual analysis to find hidden codes in Shakespeare but does not apply the same rigor to show those codes weren't standard literary devices of the time.

  ### The Vindication Problem: Is it Retrospective?

  You asked if the Pre-Clovis and L'Anse cases force the principle to be retrospectively dependent. **They do not.**

  The distinction lies in the **Direction of Fit**.

  *   **Legitimate Fringe (Pre-Clovis):** "Here is a site. If you date it using your standard rules, it will be older than Clovis. I invite you to date it."
      *   *Risk:* They risked being proven wrong by the very tools they trusted.
      *   *Status:* They were playing the game correctly, just betting on a long shot.
  *   **Pseudohistory (Fomenko):** "Here is my theory. If you date it using your standard rules, your rules are wrong."
      *   *Risk:* They risk nothing. The theory cannot lose.
      *   *Status:* They are rigging the game.

  Therefore, the Pre-Clovis advocates were **not pseudohistorians *then***. They were making a falsifiable claim within the invariant rules. The fact that they *won* does not change their methodological status at the time. If they had lost (if the dating came back younger), they would have been **Wrong Historians**, not Pseudohistorians.

  Fomenko, if proven wrong by astronomy, claims the astronomy is forged. He cannot be "Wrong"; he can only be "Suppressed." That is the timeless marker.

  ### Summary of the Coherent Position

  1.  **Principle:** **Invariant Epistemic Rules.** Pseudohistory modifies the rules of evidence ad hoc to protect the core thesis; legitimate history applies standard rules even when they threaten the thesis.
  2.  **Sacrifice:** You must stop using "credentialed/mainstream venue" as a shield for the Solutrean hypothesis. If it breaks oceanographic rules to survive, it is pseudo, regardless of who published it.
  3.  **Vindication:** Success does not retroactively validate method, but *falsifiability* validates it in real-time. Pre-Clovis was legitimate *then* because they accepted the risk of standard dating.
  4.  **Schliemann:** Distinguish **Incompetence** (breaking a site) from **Epistemic Corruption** (breaking the concept of stratigraphy). Schliemann did the former; Pseudohistorians do the latter.

  This preserves your intuition that credentials don't matter (against your friend) while solving your worry that "bad evidence" isn't automatically pseudo (bad evidence can be honest error; rigged evidence is pseudo). It makes the demarcation about the **relationship between the claimant and the rules of the game**, not the score at the end.
