answer: |-
  In the sixth chapter of *A Treatise on Probability*, John Maynard Keynes draws a distinction that continues to haunt decision theory. He separates the *probability* of a conclusion from its *weight*. Probability is the degree of rational belief warranted by evidence; weight is the amount of relevant evidence upon which that belief rests. Two analysts might assign a 50% probability to a proposition: one having examined a mountain of data, the other having glanced at a single clue. For Keynes, the first judgment has greater weight. The dispute is whether this difference matters for action. If the probability is identical, does the weight dictate a different choice?

  Four positions define the logical space. The *redundancy thesis* holds that weight is merely biographical; if two agents have conditionalized on all they know, identical probabilities mandate identical actions. The *second-order reduction* argues weight is actually uncertainty about the probability itself, representable by a distribution over priors. The *elasticity reduction* suggests weight measures the sensitivity of the probability to new evidence or model perturbation. Finally, *irreducibility* claims weight is a distinct normative input, altering rational commitment independently of probability or its variance. To find the truth, we must test these views against three devices.

  Consider first the sealed-forecast case. An engineer must sign off on a design now, with no opportunity for further testing or future revision. She has two analyses, both yielding a failure probability of exactly 0.02. One rests on exhaustive testing; the other on extrapolation. Standard expected utility theory, aligning with the redundancy thesis, says she should be indifferent. The risk is 0.02 in both worlds; the expected cost is identical. However, intuition screams that the low-weight case is more precarious. Is this rational? If the probability is truly fixed at 0.02, hesitation is merely psychological anxiety, not a normative requirement. Yet, if the probability is a model output, the "exhaustive" model is likely more robust. If no further evidence is possible, the elasticity of the probability is zero by stipulation. In this specific, constrained vacuum, the redundancy thesis holds: with the decision isolated and probability fixed, weight has no leverage. The engineer's discomfort is a fear that the probability *should* be different, not that the weight *itself* changes the utility calculation.

  This suggests we must look at the divergence of the two measures. Keynes defines weight by the volume of relevant knowledge (survey-weight). However, decision-makers care about stability (elasticity-weight). These can come apart. Imagine a high survey-weight case where 99% of load cases are tested, but the untested 1% contains a catastrophic resonance frequency. Here, knowledge is vast, but elasticity is high; a single new datum destroys the conclusion. Conversely, imagine a low survey-weight case where a vast field remains unexplored, but physical laws guarantee any unknown factors are trivial. Here, knowledge is thin, but elasticity is low; the probability will not move. If rational action tracks decision-consequences, the engineer should fear the first case, not the second. This implies Keynes identified the wrong quantity. Survey-weight is a poor proxy for rational caution. Elasticity-weight—sensitivity to perturbation—is what actually matters. This supports the elasticity reduction: weight is not a separate metaphysical good, but a description of how fragile the probability estimate is.

  The weight-audit test sharpens this point. Suppose an agent can pay for an audit guaranteed to leave her posterior probability unchanged in a decision with no downstream choices. Standard theory says paying is irrational; the value of information is zero. If an agent pays, what is she buying? She cannot be buying a change in probability (by stipulation). She might be buying a reduction in the *ambiguity* of the probability estimate—a second-order reduction. She pays to confirm that her 0.02 figure is not a guess. However, if the audit guarantee itself relies on a model, we face a regress. If the model guaranteeing the audit is thin, the audit is worthless. If it is thick, we have simply updated our second-order confidence. There is no room for a sui generis "weight" value here. The audit is only valuable if it reduces the variance of the probability distribution (second-order) or confirms the robustness of the model (elasticity). It does not purchase a distinct normative commodity.

  These devices expose a critical definitional worry. Weight is measured against "relevant ignorance." But an agent cannot know how much she does not know; if she could identify the relevance of unknown evidence, it would cease to be unknown. Survey-weight is therefore epistemically inaccessible. We cannot count the holes in our knowledge. We can, however, measure elasticity. We can perturb our priors and models to see how much the conclusion wobbles. Because survey-weight is unknowable while elasticity is computable, a normative theory based on the former is useless. Rationality must be based on what can be assessed. This undermines the irreducibility thesis, which relies on the Keynesian definition, and strengthens the elasticity reduction. We should not respect weight because it is "more evidence," but because high weight (in the elasticity sense) implies the decision is robust to error.

  My verdict is that the **elasticity reduction** is correct. Weight has no independent role in rational decision-making over and above the probability and its sensitivity to evidence. The intuition that weight matters is actually an intuition about model risk and robustness. When we prefer high-weight arguments, we are preferring probabilities that are stable under the addition of new information or slight changes in modeling assumptions. This is not a third factor alongside probability; it is a property of the probability function itself. The redundancy thesis fails because it ignores that probabilities are often estimates subject to error; the second-order reduction is close but focuses on the spread of belief rather than the structural stability of the inference. The elasticity reduction captures the practical value of evidence: it anchors the probability against future turbulence. Irreducibility is a mistake that reifies a feeling of confidence into a normative rule.

  This conclusion has specific implications for Keynes's *The General Theory* (1936). There, Keynes argues that because long-term expectations rest on precarious knowledge (low weight), agents lean on convention and demand liquidity. If weight is irreducible, this is a claim that rationality itself breaks down, forcing agents to rely on social mimicry. However, if weight is elasticity, Keynes's insight is vindicated but deflated into standard decision theory under ambiguity. In high-elasticity environments, where small pieces of news cause wild swings in probability estimates, rational agents will indeed avoid long-term commitments and prefer liquid assets that allow them to wait for more stable information. They lean on convention not because reason fails, but because convention is a low-cost heuristic for stability when model risk is high. Thus, the *General Theory* does not describe a departure from rationality, but a rational response to environments where the elasticity of expectation is dangerously high. The weight of an argument matters, but only because it tells us how firmly we can stand on it before the ground moves.
