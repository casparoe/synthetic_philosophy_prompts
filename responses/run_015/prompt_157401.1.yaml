  1.  **Analyze the Request:**
      *   **Core Thesis:** Simone Weil's critique of political parties (from *On the Abolition of All Political Parties*) applies *more* strongly to modern decentralized ideological clusters (rationalist forums, prediction markets, EA networks) than to traditional parties.
      *   **Key Mechanism:** The absence of formal structure (membership, charters, bureaucracy) removes "institutional friction" that might occasionally brake collective delusion.
      *   **Result:** The "social gravity" (*pesanteur*) operates unchecked, leading to manufactured consensus, preference falsification, and loyalty overriding perception.
      *   **Constraints:** Do not request citations or reading lists. Develop the argument from Weil's conceptual framework and general understanding of online epistemic communities.

  2.  **Deconstruct Weil's Framework:**
      *   *The Party Spirit:* The essence of a party is not policy but the pressure to conform. It demands total adherence.
      *   *Collective Passion:* Parties generate heat/emotion that overrides cold reason.
      *   *Pesanteur (Gravity/Pressure):* A social force that pulls individuals into line. It's automatic, almost physical.
      *   *Truth vs. Loyalty:* For Weil, truth requires absolute solitude of judgment. The party demands loyalty to the group's stance, which inevitably corrupts the pursuit of truth.
      *   *The Paradox of Structure:* Weil saw parties as inherently evil, but the prompt asks me to argue that *lack* of formal structure makes things *worse* in this specific context. I need to nuance this: Weil hated parties because of their pressure. I need to argue that informal networks generate *more* pressure because there are no rules to limit it, no clear exit, and no defined boundary to push against.

  3.  **Analyze the Modern Targets:**
      *   *Rationalist Forums (e.g., LessWrong):* Focus on truth-seeking, Bayesian updating, cognitive bias mitigation.
      *   *Prediction-Market Tribes:* Focus on accuracy, betting on outcomes, market efficiency.
      *   *Effective Altruism (EA) Networks:* Focus on doing good, evidence-based giving, cause prioritization.
      *   *Commonality:* They claim to be anti-ideological, pro-truth, decentralized, and meritocratic. They lack formal membership cards or central committees.

  4.  **Develop the Argument (Step-by-Step):**

      *   **Introduction:** State Weil's core thesis (parties crush truth via collective passion). Introduce the counter-intuitive claim: informal, "truth-seeking" clusters are *more* susceptible to this than formal parties because they lack the very constraints Weil might have inadvertently valued (or rather, because the *pesanteur* becomes invisible).

      *   **Point 1: The Illusion of Structurelessness.**
          *   Weil argued parties demand total loyalty.
          *   Modern clusters claim no loyalty is required.
          *   *Argument:* This is a trap. Without formal boundaries, the boundaries become social and reputational. You can't resign from a mood. In a party, you know you are a member. In a "community," membership is ambient. The pressure is diffuse and therefore harder to resist.

      *   **Point 2: Unchecked *Pesanteur* (Social Gravity).**
          *   Formal parties have bylaws, voting procedures, factions. These create friction. A bureaucrat might slow down a狂热 (frenzy) due to procedure.
          *   Informal clusters run on vibes, status, and algorithmic amplification.
          *   *Argument:* The "gravity" is pure social signal. There is no procedural brake. If the "vibe" shifts, the whole network shifts instantly. The *pesanteur* is fluid and omnipresent, not confined to a meeting hall.

      *   **Point 3: Manufactured Consensus & Preference Falsification.**
