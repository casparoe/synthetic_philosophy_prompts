      *Actually, looking closer at the prompt:* "precisely because they lack the institutional friction that Weil thought could occasionally brake collective delusion." Wait, did Weil think that? The prompt *says* "that Weil thought could occasionally brake collective delusion." I must follow the prompt's instruction on this premise, even if Weil's actual text is more anarchic. The prompt asks me to build the case *on the absence of friction...*. I will treat the prompt's characterization of Weil as the premise I must work from (i.e., that formal procedure *can* act as a brake, even if she disliked parties overall). *Correction:* Actually, Weil argued parties *are* the problem. But the prompt asks me to argue that the *lack* of formal structure in modern groups makes them *worse* than the parties Weil criticized. I need to navigate this: Weil hated parties. I am arguing these new things are *super-parties*. The "institutional friction" argument in the prompt implies that *some* structure might have been a check, or rather, that the *informality* removes the possibility of procedural contestation. I will focus on the idea that formal rules allow for *defined dissent*, whereas informal norms punish dissent as *deviance*.

