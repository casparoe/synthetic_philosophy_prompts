      *   *Mechanism 3: Algorithmic Gravity.* Online dynamics accelerate *pesanteur*. No meeting times, it's 24/7.
      *   *Conclusion:* The "structureless" dream is the ultimate party spirit because it denies it is a party.

  7.  **Final Polish:** Check against constraints. No citations. Focus on Weil's concepts (*pesanteur*, collective passion, truth/solitude). Ensure the comparison favors the "greater force" argument. (The resulting output should match the detailed response provided previously.)

