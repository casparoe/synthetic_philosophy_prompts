answer: |-
  # JOINT STATEMENT ON THE NATURE, PERSISTENCE, AND CHANGE OF SOCIAL NORMS

  **Collaborating Programmes:** The Equilibrium Research Programme (Camp A) and The Sanction-and-Transmission Research Programme (Camp B).
  **Subject:** Analysis of the Hamlet Ferry and Parking Data (Years 0–5).

  ## PART 1: AGREED CLAIMS AND TERMINOLOGY

  The collaborators affirm the following propositions as the common foundation for this inquiry. These claims are substantive; each camp acknowledges that empirical evidence could have rendered them false.

  1.  **Definition of Behavioural Regularity:** Both camps agree that a *behavioural regularity* exists when a significant proportion of a population performs the same action in a recurrent situation with a frequency exceeding chance expectation. Both camps agree the ferry waiting rule (Years –infinity to 3) and the north-side parking rule (Years 0 to 3) qualify as behavioural regularities.
  2.  **The Payoff Shift:** Both camps agree that the opening of the bridge in Year 0 altered the material payoff structure such that, for a resident concerned solely with travel time and cost, crossing by bridge strictly dominated crossing by ferry, regardless of the actions of other residents.
  3.  **The Intervention Effect:** Both camps agree that the posting of survey results in Year 2 constituted an informational intervention that altered *empirical expectations* (beliefs about what others do) and *normative expectations* (beliefs about what others approve of), and that this alteration causally contributed to the reduction in ferry use from 41 per cent to 22 per cent.
  4.  **Non-Diagnostic Features:** Both camps agree that the mere existence of the ferry regularity prior to Year 0 is non-diagnostic between the two programmes, as both equilibrium models and transmission models predict the stability of long-standing regularities in the absence of external shocks.
  5.  **Terminology Stipulations:**
      *   **Coordination Equilibrium:** A situation in which no individual prefers to deviate from their current action given the actions of others, and where at least one alternative regularity would also have been an equilibrium.
      *   **Normative Expectation:** A belief held by an individual that others believe a certain action ought to be performed.
      *   **Phantom-Equilibrium Regularity:** A behavioural regularity that is stable *only* because participants hold false beliefs: in the *belief-phantom variant*, false beliefs about others' preferences; in the *sanction-phantom variant*, false beliefs about others' willingness to sanction, where in fact no one would sanction.
      *   **Preference Loading:** The modelling practice of incorporating desires for conformity or fears of sanction into an agent's utility function rather than treating them as external constraints.

  ## PART 2: DISAGREEMENTS TABLE

  The following table enumerates the residual theoretical disagreements. The formulations in columns two and three are endorsed by the respective camps without hedging.

  | Issue | Camp A (Equilibrium) Formulation | Camp B (Sanction-and-Transmission) Formulation | Assessment (Genuine/Verbal) & Reason |
  | :--- | :--- | :--- | :--- |
  | **1. Status of Ferry Regularity (Years 1–3)** | The 41 per cent ferry use was a convention sustained by a coordination equilibrium in which agents' preferences included a weight for conformity and anticipated sanctions, making ferry use self-enforcing given those beliefs. | The 41 per cent ferry use was a norm sustained by false normative expectations and anticipated sanctions that did not exist in reality, making it a sanction-phantom variant of a phantom-equilibrium regularity. | **Genuine.** This is a disagreement about the underlying structure of motivation: whether the stability relied on actual preference structures (A) or systematically false beliefs about social pressure (B). |
  | **2. Status of the 22 Per Cent Plateau** | The residual 22 per cent use is a real equilibrium based on divergent material payoffs (boat owners profit from fares), not a phantom; the agents hold no false beliefs about sanctions or preferences. | The residual 22 per cent use is a belief-phantom variant of a phantom-equilibrium regularity; the boat owners persist because they falsely believe the community prefers their service or expects them to maintain the tradition, despite evidence to the contrary. | **Genuine.** This turns on the empirical psychological states of the residual users: whether their persistence is driven by profit (A) or false social beliefs (B). |
  | **3. Legitimacy of Preference Loading** | Loading sanctions and conformity into preferences is legitimate modelling because revealed behaviour demonstrates that agents value these outcomes, rendering the distinction between internal preference and external constraint operationally meaningless. | Loading sanctions and conformity into preferences is an immunity manoeuvre that renders the theory untestable, because any persistence can be post-hoc explained by positing a 'preference' without independent measurement of that preference. | **Genuine.** This is a methodological disagreement about what constitutes a falsifiable explanation in social science. |
  | **4. Explanation of North-Side Parking** | The north-side regularity is best explained by salience; the first three households created a focal point that made the north side the obvious solution to a coordination problem for the rest of the population. | The north-side regularity is best explained by prestige-biased transmission; the rest of the population copied the three households because they were identified as high-status leaders, not because the side itself was salient. | **Genuine.** This is a causal disagreement about the mechanism of spread: recognition of a solution (A) versus copying of agents (B). |
  | **5. Conventions vs. Sanction-Backed Norms** | The distinction is a difference in the mechanism that holds a regularity in place (equilibrium selection vs. payoff alteration), but both are ultimately grounded in the same structure of expectations and preferences. | The distinction is a difference in kind; conventions solve coordination problems, whereas sanction-backed norms solve cooperation problems or enforce arbitrary rules, requiring distinct explanatory frameworks. | **Verbal.** Both camps agree on the observable phenomena; the disagreement rests on whether 'kind' is defined by the problem type (B) or the mathematical structure of the solution (A). |

  ## PART 3: CRUCES FOR FURTHER INVESTIGATION

  The collaborators identify four sub-questions where further inquiry within the hamlets could resolve or significantly reduce the disagreements listed above. Both camps commit to accepting the results of these studies as evidence bearing on their respective positions.

  **Crux 1: The Motivation of the Residual Users**
  *   **Sub-Question:** Do the residual 22 per cent of ferry users persist due to material profit or due to perceived social expectation?
  *   **Proposed Study:** Anonymous structured interviews with the residual ferry users (the boat owners) asking them to rank reasons for continuing service (profit, habit, fear of judgment, belief that residents need them), coupled with a review of their financial logs.
  *   **Camp A Prediction:** Users will rank profit significantly higher than social reasons, and financial logs will show positive net revenue from the 22 per cent demand.
  *   **Camp B Prediction:** Users will rank 'belief that residents need them' or 'expectation to maintain service' significantly higher than profit, and financial logs will show negligible or negative revenue, sustained only by social motivation.
  *   **Movement:** If profit is negligible but users cite social expectation, Camp A must concede the presence of false beliefs (phantom status). If profit is high, Camp B must concede the equilibrium is not phantom-driven.

  **Crux 2: The Mechanism of Parking Spread**
  *   **Sub-Question:** Did the north-side parking regularity spread via instant recognition of a focal point or via step-wise copying of specific agents?
  *   **Proposed Study:** Retrospective survey of non-leader households asking: (1) Did you notice the north side was empty first? (2) Did you notice the three specific households parking there first? (3) Which fact caused you to park north?
  *   **Camp A Prediction:** Majority will cite the emptiness/availability of the north side (salience) as the primary cause; the identity of the first parkers will be statistically irrelevant.
  *   **Camp B Prediction:** Majority will cite the identity of the first parkers (prestige) as the primary cause; awareness of the three households will correlate perfectly with adoption time.
  *   **Movement:** If adoption correlates with knowledge of the leaders rather than the empty space, Camp A must acknowledge transmission dynamics over salience. If adoption is immediate upon seeing the space regardless of who parked there, Camp B must acknowledge salience over prestige bias.

  **Crux 3: Reversibility of the Intervention**
  *   **Sub-Question:** Can ferry use be restored by reinstating false normative expectations without changing material payoffs?
  *   **Proposed Study:** Remove the notice boards and replace them with a fabricated report stating that 80 per cent of residents would sanction bridge users. Monitor ferry use for six weeks.
  *   **Camp A Prediction:** Ferry use will not significantly rise above 22 per cent because the material payoff structure (bridge dominance) overrides false beliefs once true preferences are known.
  *   **Camp B Prediction:** Ferry use will rise significantly (approaching Year 1 levels) because the restoration of false normative expectations recreates the sanction-phantom conditions necessary for the norm.
  *   **Movement:** A significant rise moves Camp A to admit the fragility of the equilibrium to belief manipulation. No rise moves Camp B to admit that belief manipulation is insufficient without underlying payoff support.

  **Crux 4: Independent Measurement of Conformity Preference**
  *   **Sub-Question:** Can a 'preference for conformity' be measured independently of the regularity it is supposed to explain?
  *   **Proposed Study:** Introduce a novel, costless coordination game with no social history (e.g., choosing a colour for a new community bin) and measure if individuals choose the majority colour absent any sanction threat.
  *   **Camp A Prediction:** Individuals will display a measurable, consistent utility for matching others even without sanctions, validating preference loading.
  *   **Camp B Prediction:** Individuals will show random distribution or choice based on aesthetics unless told that others will judge them, validating the need for explicit normative expectations rather than loaded preferences.
  *   **Movement:** If matching occurs without any mention of judgment, Camp B must accept intrinsic conformity preferences. If matching only occurs when judgment is mentioned, Camp A must accept that 'preference' is dependent on external normative expectations.

  ## PART 4: CLOSING SUBSECTIONS

  ### 1. Dissolution of Disputes into Verbal Questions
  A portion of the original dispute has dissolved into questions about words, specifically regarding the definition of a "norm." Camp A defines a norm by its structural properties (equilibrium of expectations and preferences), while Camp B defines a norm by its functional properties (sustained by sanctioning and transmission). Consequently, when Camp A states "The ferry rule is a convention" and Camp B states "The ferry rule is not a convention," they are often agreeing on the observable facts (people ferry, people expect others to ferry, no actual sanctions occur) but applying different labels. This verbal disagreement is acknowledged as non-obstructive to the empirical work outlined in Part 3. We agree to treat the label "convention" as Camp A's shorthand for "coordination equilibrium" and "norm" as Camp B's shorthand for "transmission-sustained regularity," without requiring a unified taxonomy for the duration of this collaboration.

  ### 2. Conditions for Falsification and Expected Errors
  Both camps acknowledge the possibility that their core commitments are incorrect.
  *   **Camp A** would consider its view falsified if a behavioural regularity persists indefinitely in a population where it is common knowledge that (i) the regularity is not a coordination equilibrium, (ii) there are no preferences for conformity, and (iii) there are no expectations of sanctioning. Camp A expects it may be wrong in assuming that all normative force can be reduced to equilibrium preferences; there may be cases of "normative inertia" that equilibrium models cannot capture without ad hoc adjustments.
  *   **Camp B** would consider its view falsified if a behavioural regularity persists and spreads in a population where (i) there is no evidence of conformist transmission or prestige bias, (ii) there are no sanctions or expectations of sanctions, and (iii) the regularity is not optimal for any individual. Camp B expects it may be wrong in assuming that transmission dynamics are always distinct from payoff structures; it is possible that what we identify as 'prestige bias' is actually a rational heuristic for identifying high-payoff equilibria, which would collapse the distinction between transmission and equilibrium.

  Both camps sign this statement as a record of current agreement and disagreement, subject to revision based on the outcomes of the proposed studies.

  **Signed,**
  **The Equilibrium Research Programme (Camp A)**
  **The Sanction-and-Transmission Research Programme (Camp B)**
