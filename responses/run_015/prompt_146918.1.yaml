answer: |-
  Quine's holism does not erase the distinction between convention and empirical law for the purpose of practical judgment, but it fundamentally reclassifies it. For a physicist, the distinction is typically ontological or methodological: one type of statement is true by definition (or structural necessity), the other by correspondence to nature. Quine demands you view the distinction as **topological and pragmatic** rather than metaphysical.

  Here is what his position demands of you when assessing whether a move in physics is a "conventional adjustment" or an "empirical revision."

  ### 1. Shift from "Kind" to "Centrality"
  In your former practice, you likely treated coordinate choices as "free" and dynamical laws as "constrained." Quine argues that both are nodes in a web of belief facing the tribunal of experience collectively. The difference is not that one is immune to empirical refutation and the other is not; the difference is their **distance from the perceptual periphery**.

  *   **The Demand:** When evaluating a change (e.g., shifting from SI to natural units vs. abandoning parity conservation), do not ask, "Is this statement analytic?" Ask, "How central is this node to the current web?"
  *   **The Implication:** A coordinate transformation is a "conventional choice" because revising it requires minimal adjustment to the rest of the web. Abandoning a conservation law is an "empirical discovery" because it forces massive recalibration of downstream theories, instrumentation interpretations, and mathematical formalisms. The distinction survives as a measure of **disruption cost**, not truth status.

  ### 2. The Reversibility of Roles
  Quine's view implies that what counts as a convention in one theoretical framework may become an empirical claim in another. This is not a bug but a feature of scientific history.

  *   **The Demand:** You must assess the distinction historically and contextually, not universally.
  *   **The Implication:** Consider the geometry of space. For Newton, Euclidean geometry was effectively a convention (or analytic truth) against which forces were measured. For Einstein, geometry became dynamical and empirical. A Quinean assessment recognizes that the "conventional" status of geometry was not a discovery of its true nature, but a reflection of its **entrenchment** in the Newtonian web. When the cost of saving Euclidean geometry (via universal forces, as Poincaré suggested) exceeded the cost of revising geometry itself (GR), the node moved from the "conventional/central" cluster to the "empirical/revisable" cluster.
  *   **Judgment:** You cannot label a move "merely conventional" without specifying the theoretical web in which it sits.

  ### 3. No "First Philosophy" Standpoint
  You mentioned evaluating physics "from outside the discipline." Quine's naturalized epistemology rejects the possibility of a standpoint outside the web of science from which to judge science. Philosophy is continuous with physics.

  *   **The Demand:** You cannot use philosophical criteria (like "analyticity") to police the boundary of physics. You must use scientific criteria (simplicity, conservatism, fecundity) to explain why physicists draw the boundary where they do.
  *   **The Implication:** When physicists say, "This is just a gauge choice," they are making a pragmatic claim that fixing this gauge minimizes the complexity of the equations without losing predictive power. When they say, "This law is falsified," they mean that retaining the law requires more ad hoc auxiliary hypotheses than discarding it.
  *   **Judgment:** Your assessment should focus on the **pragmatic virtues** cited by the physicists. If a community abandons a law, was it because the "cost" of saving it (in terms of complexity or loss of explanatory power) became too high? If they retain a convention, is it because dropping it yields no predictive gain? The validity of the move lies in the pragmatic success, not in the metaphysical category.

  ### 4. The Distinction as a Continuum of Entrenchment
  Does holism erase the distinction? **Yes, as a binary boundary. No, as a gradient of entrenchment.**

  For practical judgment, the binary distinction is often sufficient. However, Quine warns that treating it as absolute can blind you to revolutionary shifts.
  *   **The Danger:** If you treat a principle as truly analytic (immune to revision), you risk dogmatism. You might dismiss a radical new theory because it violates a "definitional" truth, rather than recognizing that the definition itself is a candidate for revision.
  *   **The Reconstruction:** Reconstruct the distinction as **degrees of reluctance to revise**.
      *   *High Reluctance:* Logic, mathematics, deep conservation principles. (Often mistaken for analytic).
      *   *Medium Reluctance:* Dynamical laws, field equations. (Empirical core).
      *   *Low Reluctance:* Coordinates, units, gauge fixings. (Conventions).
  *   **Judgment:** When assessing a change, measure the **reluctance**. If the community abandons a "low reluctance" node easily, it confirms its conventional status. If they fight tooth and nail to save a "high reluctance" node despite anomalies (e.g., the Uranus/Neptune discovery vs. the Mercury/Perihelion anomaly), you are witnessing the boundary being tested. In the first case, they added a planet (auxiliary hypothesis); in the second, they changed the law (GR). Both were permissible under holism; the choice was pragmatic.

  ### Summary for the Assessor
  Quine demands that you stop looking for a **fault line** between convention and fact and start looking for a **stress map**.

  When you ask, "Is abandoning this coordinate convention different from abandoning this disconfirmed law?" Quine's answer is: **Only in terms of the shockwave it sends through the rest of the system.**

  *   **Conventional Choice:** A revision that localizes the shockwave. It isolates the change to a specific formalism without requiring reinterpretation of observational data or core dynamics.
  *   **Empirical Discovery:** A revision that distributes the shockwave. It requires reinterpreting data, adjusting auxiliary hypotheses, and potentially altering mathematical foundations.

  Your intuition that they are different is correct *in practice*, but Quine insists this difference is not grounded in the nature of the statements themselves, but in their **systemic connectivity**. To assess physics from the outside, do not ask what the statements *are*; ask what work they *do* in the network, and how much friction is generated when you try to move them.
