answer: |-
  The dust in the Mint of Nomos was not dirt; it was dead money.

  Elara swept the fine, ceramic powder into the reclamation chutes, watching the gray swirl catch the light. These were the Cycles that had failed to circulate. In Nomos, a Cycle was a promise of labor valid for thirty days. If it did not change hands by the moon's turn, the biodegradable seal embedded in the chip's core hydrolyzed. The currency returned to clay. It could not be saved. It could only be used.

  This was the bedrock of the settlement's constitution: *oikonomia*. The management of the household. Acquisition was natural only insofar as it served the needs of the community. To gather more than one could use was to let the food rot in the barn; to gather more currency than one could spend was physically impossible. The system forced reciprocity. You earned, you spent, you contributed. The flow was the value.

  Elara was a Steward of the Mint, tasked with mixing the glaze that determined the lifespan of the Cycles. She took her duty seriously. She believed in the rot. She believed that a coin that could not die was a coin that could kill the community.

  The discovery happened on a Tuesday, during a humidity calibration test. A tray of five hundred Cycles had been sealed in a desiccation locker meant for raw materials, accidentally bypassing the atmospheric regulators. By rights, they should have been dust. They were thirty-five days old.

  Elara opened the locker and froze. The Cycles sat on the tray, gleaming. The translucent glaze was intact. The structural integrity held. She picked one up. It was hard, cold, and permanent.

  She carried it to her workstation and ran a diagnostic. The chemical signature was identical to the standard batch, save for a microscopic variance in the crystalline lattice of the seal, a fluke of the drying process. She placed the chip in her pocket. It felt heavier than the others. Not in mass, but in potential.

  For three days, she carried the immortal Cycle. She did not spend it. To spend it would be to treat it like a normal token, to trade it for bread or labor credits that would themselves rot. But this chip did not rot. It waited.

  On the fourth day, she went to see Theron.

  Theron was an Elder of the Constitution, one of the few who remembered the debates from the Founding. He lived in the Archive, a room lined with physical paper, a luxury reserved for the laws that governed them. He was grinding herbs when she entered, the scent of sage masking the smell of old ink.

  "I found a flaw," Elara said. She placed the Cycle on his desk.

  Theron looked at the chip, then at the date stamped on its face. He picked it up, rubbing his thumb over the glaze. "Thirty-eight days," he murmured. "It should be powder."

  "It is not. I have replicated the conditions. I can make them all like this."

  Theron set the chip down gently, as if it were a sleeping insect. He did not look surprised. He looked tired. "And what do you intend to do with this knowledge, Steward?"

  "Efficiency," Elara said, the word feeling thin in the quiet room. "Loss of value due to decay is waste. We lose three percent of the money supply every month to natural attrition. This stabilizes the medium."

  "It stabilizes the medium," Theron repeated. "But what does it do to the exchange?"

  "It allows for long-term planning. Savings."

  Theron stood up and walked to the window. Below, the settlement hummed. People traded labor for goods, goods for services. A closed loop. "Elara, why did we invent currency?"

  "To facilitate exchange," she recited. "So the weaver does not need to find a baker who needs a coat."

  "Precisely. It is a bridge. You walk across a bridge to get to the other side. You do not live on the bridge." Theron turned back to her. "In the old world, before Nomos, people began to treat the bridge as a destination. They sought to acquire the bridge itself. They forgot that currency is barren. It produces nothing. It is metal, or clay, or data. It has no womb."

  Elara frowned. "It represents value."

  "It represents a claim on value. But it is not value itself. When you allow currency to persist beyond the cycle of need, you change the nature of the transaction." Theron pointed to the chip. "If you lend this to a farmer today, and he returns it to you in thirty days, you have gained nothing. But if you lend him this *immortal* chip, you can demand two back. Why? Because the chip itself has become a thing to be rented. You are charging for the use of the medium, not the labor."

  "Interest," Elara said.

  "*Tokos*," Theron corrected softly. "Offspring. The ancients despised it because it was the birth of the barren. Money breeding money. It is unnatural because it has no limit. *Oikonomia* is bounded by need. You only need so much bread, so much shelter. But if money can breed, the desire for it becomes infinite. There is no end to the accumulation."

  Elara looked at the chip. She saw the logic. If she kept this chip, she could lend it to a new arrival who needed tools before their first credit cleared. She could ask for a return. The chip would come back to her, ready to lend again. It would work for her while she slept. It would separate the act of acquisition from the act of labor.

  "It creates power," Elara said quietly.

  "It creates masters and servants," Theron replied. "In Nomos, we are all stewards of the flow. If you hold the permanent chip, you are no longer a steward. You are an owner. And those who must borrow from you become tenants in their own lives. The social rupture does not come from you being rich, Elara. It comes from the relationship changing. Exchange becomes extraction."

  "I could destroy the formula," Elara said. "I could recalibrate the kiln."

  "You could." Theron sat back down. "But you know it now. The knowledge exists. Even if you destroy your notes, the possibility remains. Someone else might find it. Or, perhaps..." He trailed off, looking at the chip.

  "Perhaps?"

  "Perhaps the world has changed. We built Nomos to protect us from the hunger of the old economics. But we are isolated. We trade with the outside sometimes. They use permanent currency. They accumulate. We are vulnerable because our money dies while theirs lives. If we face a crisis—a drought, a siege—having no reserves could mean extinction. *Oikonomia* keeps us virtuous, but does it keep us alive?"

  Elara felt the weight of the chip in her mind, though it sat on the desk. It was a key to a door they had welded shut. To open it was to invite the infinite hunger back into a finite world. To keep it shut was to remain fragile.

  "If I preserve the knowledge," Elara said, "I become the guardian of the poison."

  "And if you destroy it," Theron countered, "you remain the guardian of a fragility you cannot guarantee. The distinction between management and acquisition is clear in theory. In practice, survival often blurs the line."

  Theron pushed the chip back toward her. "The Constitution does not have a clause for this. We designed a system for men as they should be, not as they might become when given the tool of eternity."

  Elara picked up the Cycle. It did not crumble. It did not warm to her touch. It was perfect, sterile, and terrifying.

  "What do I do?" she asked.

  Theron looked at her, his eyes old and unreadable. "That is the question, isn't it? We stand at the edge of the household and look out into the wild. Do we build a wall? Do we open a gate? Or do we simply wait to see if the seed grows?"

  Elara closed her hand over the chip. She could feel the edges biting into her palm. She stood up, the decision suspended in the air between them, heavy as the silence of the Archive. Outside, the dust of the dead money continued to fall, soft and endless, while in her fist, the future remained hard and unbroken.
