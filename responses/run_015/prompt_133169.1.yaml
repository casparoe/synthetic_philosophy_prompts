answer: |-
  - Rules in play

  Three semantic principles emerge from the precedents. First, the Microstructural Essence rule: hidden physical constitution determines kind membership, overriding superficial appearance (Ashgrove). Second, the Historical Grounding rule: reference is fixed by initial contact with the substance; subsequent changes in trade or usage do not shift meaning (Metal). Third, the Original Expert Extension rule: reference is fixed by the extension picked out by contemporary experts, even if later science reveals their classification was imprecise or heterogeneous (Expert Deference). The tension lies between Essence, which suggests splitting "verdite" into two kinds, and Expert Extension, which preserves the original unified classification despite scientific revision.

  - Closest precedent

  The Expert Deference case is the closest analogue. Both situations involve a conflict between original classification and later scientific discovery. In both, the Commission prioritized the original experts' practical extension over later theoretical corrections. Here, as there, the original experts treated the quarry output as a single kind, fixing the reference to that output regardless of modern mineralogical distinctions regarding microstructure.

  - Recommended ruling

  The Commission should hold that the bequest covers the disputed territory. The precedents commit the Commission to prioritizing the original expert extension over later microstructural distinctions when the original usage was grounded in practical identification. While Ashgrove establishes that hidden differences matter, the Expert case clarifies that the original experts' practice fixes the reference. Since the original mineralogists treated the quarry output as unified, "verdite" refers to that entire output. The Metal ruling reinforces that current trade volumes do not shift meaning, but here the original material included the common mineral. Thus, the term covers both minerals found in the original quarries, validating the claim.

  - The case that would settle it

  Introduce a case where the original type specimen is microstructurally distinct from the bulk of the material originally traded and certified by experts. Suppose the founding-era "gold" seal was actually pyrite, but the experts certified tons of actual gold as matching it. Does "gold" refer to the pyrite specimen (Historical Grounding) or the certified bulk (Expert Extension)? If the Commission rules for the pyrite, they prioritize causal anchoring over expert practice. If they rule for the gold, they prioritize expert extension. This would force a choice between the implicit specimen-rule of the Metal case and the explicit practice-rule of the Expert case.

  - Lines for the dissent

  "Ashgrove established that nature, not nomenclature, determines kind. To hold otherwise is to let human error freeze scientific reality. If 'verdite' lacks a unified microstructure, it lacks a referent. We cannot inherit a contradiction. The bequest fails for ambiguity."
