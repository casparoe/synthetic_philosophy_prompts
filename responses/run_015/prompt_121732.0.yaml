answer: |-
  The air in the Bureau always smelled of lignin and cold coffee, a scent that seemed to settle in the back of the throat. Elara sat at her desk, the leather-bound diary open before her. It was from the Sunlit Collective, 1924. A failed utopia in the Oregon hinterlands, dissolved after a single winter.

  Her job was to classify the anomaly. The Bureau of Residual Injustice didn't collect victories. It collected the grit that jammed the gears of history.

  Elara reached for the stamping ink. Her hand hovered over the tray labeled *Whig Progress*. If she stamped it here, the diary became a stepping stone. The failure of the Sunlit Collective would be a lesson learned, a necessary stumble on the long march toward liberal democracy. She read the entry from November 14th again. *We told Martha her boy ran away,* the handwriting spiky and desperate. *But we know he fell in the silo. We buried him in the frost to keep the morale. The harvest depends on hope.*

  Elara pulled her hand back. You couldn't file a covered-up child's death as a necessary growing pain. That wasn't progress; that was rot.

  She moved the diary to the *Dialectical Materialism* tray. Here, the death would be a symptom of economic contradiction. But the Collective had no owners. They had shared everything equally. The injustice wasn't born of class struggle; it was born of a quiet, communal agreement to lie. The ink on her fingers smudged.

  "Still wrestling with the Sunlit folks?"

  Mr. Henderson stood behind her. He held a styrofoam cup that steamed in the cold archive air. He was old enough that his skin looked like parchment, matching the documents he'd spent forty years shelving.

  "It doesn't fit, Henderson," Elara said, tapping the page. "If I file this under *Providence*, it implies a divine plan. But there's no redemption here. Just a buried boy and a lie that kept them warm for another month."

  Henderson leaned against the metal shelving unit. The fluorescent lights hummed, a low electrical prayer. "Try *Cyclical Recurrence*," he suggested, his voice gravelly. "Civilizations rise, get arrogant, fall. Rinse and repeat."

  "It's not a cycle," Elara said. "It's a dead end. They didn't fall because of hubris. They fell because they chose kindness over truth, and the cold didn't care about either."

  She moved the diary to the *Residual* pile. This was the drawer for things that refused to be folded into an arc. The Bureau had entire wings dedicated to these files—moments where the narrative thread snapped. Where suffering wasn't a precursor to improvement, but just... waste.

  Henderson took a sip of his coffee. "You know why I stopped trying to force them into the Progress trays?"

  "Because you got tired?"

  "Because I noticed the balance sheet," he said. He set the cup down on a stack of microfiche boxes. "People talk about the arc of the moral universe bending toward justice. They assume the bending is free. But I've seen the receipts, Elara. Every time you straighten a curve, something else breaks."

  He pointed at the diary. "They saved the harvest. They saved the community's hope. That's an improvement in one domain. Social cohesion. But to get it, they sacrificed the truth and a dead child. That's the debt."

  "Counter-progress," Elara murmured. She'd heard the term in seminars, but it felt different here, surrounded by the quiet weight of the dead.

  "Not that things get worse overall," Henderson corrected. "But that improvement is local. You pave a road here, you flood a valley there. You build a democracy on a foundation of silenced voices. The silence doesn't disappear just because the building stands. It becomes residual."

  Elara looked at the diary again. The leather was cracked near the spine. She thought about the Whig historians who would call this era a primitive precursor to modern social safety nets. They would say the suffering was the price of innovation. But looking at the jagged ink of *buried him in the frost*, it didn't feel like a price paid. It felt like a loss that couldn't be recouped.

  "If I file this as Residual," Elara said, "I'm saying there's no pattern. That this is just noise."

  "Or," Henderson said, pushing off the shelf, "you're saying the pattern is too complex for our stamps. Maybe the arc exists, but it's not a line. Maybe it's a braid, and some strands get cut so others can hold."

  He picked up his coffee. "Don't worry about proving history has no direction, kid. Just make sure the file cabinet holds the weight."

  Henderson walked away, his shoes squeaking on the linoleum. Elara was alone with the hum of the lights and the smell of old paper.

  She picked up the stamp. *RESIDUAL INJUSTICE – CLASS 4: IRREDUCIBLE.*

  She pressed it down. The ink transferred wet and dark onto the catalog card. It didn't explain the boy in the silo. It didn't justify the lie. It didn't promise that tomorrow would be better because of this. It simply acknowledged that this happened, and it didn't fit.

  Elara slid the card into the drawer. The metal runners glided smoothly, a perfect mechanism designed to hold imperfect things. She closed the drawer with a solid thud that echoed in the quiet room. The dust motes danced in the light above the desk, swirling without direction, rising and falling, waiting to settle.
