answer: |-
  # The Information Environment Quiz

  **Instructions:** Read each question and choose the answer that feels most true to your experience *while you were inside the group*. There are no right or wrong answers; this is not a test of how "brainwashed" you were. It is a map of how information moved around you.

  **1. When you were a member, how often did you see serious arguments against the group's main ideas?**
  *   A) Almost never. They just didn't show up in my feed or conversations.
  *   B) Often, but they were usually presented alongside a explanation of why they were wrong.
  *   C) Often, and I engaged with them directly, often feeling frustrated or angry.

  **2. If you did see an opposing argument, what happened to your confidence in the group?**
  *   A) I didn't see enough to judge.
  *   B) It shook me a little, or made me curious.
  *   C) It made me dig in deeper and feel more certain the group was right.

  **3. Where did your distrust of outsiders come from?**
  *   A) I didn't really distrust them; I just didn't listen to them.
  *   B) I decided for myself, based on my own bad experiences with a few outsiders.
  *   C) A leader or close friend told me they were dangerous, and I adopted that view.

  **4. What was your main role in the community?**
  *   A) To learn and heal.
  *   B) To discuss and refine ideas with peers.
  *   C) To create content, recruit, or post outward to "wake people up."

  **5. If you asked a question that sounded like you doubted the group, what happened?**
  *   A) People answered patiently, or the question got lost in the noise.
  *   B) People answered, but warned me to be careful where I asked that.
  *   C) I was warned, silenced, or told I was being "triggered" or "asleep."

  **6. Could you have named a specific piece of evidence that would have made you leave?**
  *   A) No, I didn't think anything could change my mind.
  *   B) Yes, but I wasn't sure the group would accept it.
  *   C) Yes, and I believed the group would have honored it if it appeared.

  **7. How did the group describe people who disagreed?**
  *   A) Mistaken, misinformed, or unlucky.
  *   B) Corrupt, malicious, or part of a coordinated effort.
  *   C) I don't recall them being discussed much.

  **8. Right now, in this support server, do you find yourself waiting for us to betray you?**
  *   A) No, I am taking things as they come.
  *   B) Sometimes, but I know it's not rational.
  *   C) Yes, I am certain you will eventually show your true colors like the last group did.

  **9. Who decided what information was safe to share?**
  *   A) A few leaders or admins who could delete anything.
  *   B) The community collectively, based on shared rules or quality.
  *   C) No one really; the algorithm decided what I saw.

  **10. Looking back, was the group's core advice actually harmful, or just unpopular?**
  *   A) It was harmful.
  *   B) It was unpopular, but not necessarily dangerous.
  *   C) It was helpful, but the way we enforced it was too strict.

  ***

  # Scoring Key & Branch Structure

  Do not count points. Instead, look for the **Pattern** that matches your answers most closely. Most people will have a mix; choose the pattern that captures the *dominant* feeling of your experience.

  ### Pattern 1: The Silent Room (Mostly 1A, 3A, 7C, 9C)
  **Leaf:** **Closed by Omission**
  *   **The Dynamic:** You were not lied to; you were simply kept in a room where only one voice could be heard.
  *   **Awkward Commitment:** "I have to accept that my certainty was just luck of the draw, not a result of my own research."

  ### Pattern 2: The Borrowed Shield (Mostly 1B/1C, 2C, 3C, 7B)
  **Leaf:** **Active Discrediting**
  *   **The Dynamic:** You saw the other side, but you were taught to treat their evidence as a weapon rather than information.
  *   **Awkward Commitment:** "I have to accept that I traded my own eyes for someone else's suspicion."

  ### Pattern 3: The Broadcast Tower (Mostly 4C, 1B, 7B)
  **Leaf:** **One-Way Valve**
  *   **The Dynamic:** The community was designed to output messages, not intake them. You were a node in a transmission, not a member of a conversation.
  *   **Awkward Commitment:** "I have to accept that I was a broadcaster, not a participant."

  ### Pattern 4: The Gated Garden (Mostly 5A/5B, 6C, 7A, 9B)
  **Leaf:** **Curated Specialist**
  *   **The Dynamic:** Information was filtered for quality or safety, not to hide the truth. Dissent was allowed if it was respectful and evidence-based.
  *   **Awkward Commitment:** "I have to accept that safety sometimes looks like exclusion to those on the outside."

  ### Pattern 5: The Broken Clock (Mostly 5C, 7B, 10C)
  **Leaf:** **Closed but Right**
  *   **The Dynamic:** The group was high-control and suspicious, but the core problem they identified was real, even if their methods were harsh.
  *   **Awkward Commitment:** "I have to accept that good results don't prove safe methods."

  ### Pattern 6: The Ghost in the Cell (Mostly 8C, regardless of other answers)
  **Leaf:** **Internalized Mechanism**
  *   **The Dynamic:** You have physically left the group, but the software running in your head is still theirs. You distrust the helpers because the mechanism that discredits outsiders is still active.
  *   **Awkward Commitment:** "I have to accept that the jailer is now inside the cell with me."

  ### Pattern 7: The Fortressed Self (Mostly 1C, 2C, 3B, 8B/8C)
  **Leaf:** **Reverse Hardening**
  *   **The Dynamic:** You are exposed to opposing views constantly (perhaps here or online), but you experience them as attacks, causing you to entrench rather than learn.
  *   **Awkward Commitment:** "I have to accept that I am fighting a war that isn't happening here."

  ***

  # Analysis of Difficult Separations

  **The Curated Specialist vs. The Active Discrediting**
  *   **The Problem:** Both groups filter information. Both rely on internal trust. Both may say outsiders are "wrong." A user in a high-standard medical support group (Curated) and a user in a conspiracy group (Discrediting) might answer the questions almost identically regarding filtering and questioning.
  *   **Why the Tree Struggles:** The difference is often in the *intent* of the filter (safety vs. purity) and the *characterization* of the outsider (mistaken vs. malicious). However, conspiracy groups often claim they are filtering for "safety" too.
  *   **The Extra Question:** "If an expert outsider corrected a minor error in the group's materials, would the leadership thank them or ban them?"
      *   *Curated:* They would thank them or issue a correction.
      *   *Discrediting:* They would claim the expert is part of the problem or ban them for "sowing doubt."

  **The Closed by Omission vs. The Internalized Mechanism**
  *   **The Problem:** Both result in a lack of trust in new information.
  *   **Why the Tree Struggles:** Question 8 is the primary separator, but a person in "Omission" might be so shy they answer "Yes" to Q8 out of caution, not trauma.
  *   **The Extra Question:** "When you feel distrust right now, does it feel like *caution* (I need to check this) or *certainty* (I know this is a trap)?"
      *   *Omission:* Feels like caution/confusion.
      *   *Internalized:* Feels like certainty/prediction.

  ***

  # Unoccupied or Incoherent States

  There are combinations of answers that are logically possible but rarely, if ever, occupied by real humans.

  **1. The "Hardened Ignamus" (Q1=A "Never saw arguments" + Q2=C "Made me dig in deeper")**
  *   **Status:** **Incoherent.**
  *   **Reason:** You cannot react defensively to evidence you never encountered. If you never saw the other side, you cannot be hardened by it. This usually indicates a memory error in the quiz-taker.

  **2. The "Trusting Paranoiac" (Q3=C "Told they were dangerous" + Q8=A "No, I trust you")**
  *   **Status:** **Unoccupied (so far).**
  *   **Reason:** While possible, it is rare for someone to fully adopt a borrowed distrust of outsiders (Q3) and then immediately turn that mechanism off for a new group (Q8) without a period of "Ghost Mechanism" (Q8=B or C). If they answer this way, they are likely telling you what they think you want to hear.

  **3. The "Benevolent Dictatorship" (Q5=C "Silenced for questioning" + Q6=C "Group would honor mind-change" + Q9=A "Leaders delete things")**
  *   **Status:** **Unattractive / Unstable.**
  *   **Reason:** This describes a group that silences questions but claims it would accept evidence. This state is unstable; it usually collapses quickly into "Active Discrediting" because the silence prevents the evidence from ever being tested.

  ***

  # Moderator Glossary (For Your Eyes Only)

  *Use these terms to discuss cases with your co-mods. Do not use these terms with the members.*

  *   **Epistemic Omission (Closed by Omission):** The user wasn't brainwashed; they were just isolated. They lack data, not critical thinking skills. *Strategy: Provide gentle exposure to outside views without pressure.*
  *   **Pre-emptive Inoculation (Active Discrediting):** The user was taught to treat counter-evidence as an attack. Their immune system is attacking the cure. *Strategy: Do not argue facts. Argue the mechanism of distrust.*
  *   **Asymmetric Flow (One-Way Valve):** The user was trained to perform, not process. They may feel empty without an audience. *Strategy: Encourage passive listening and small, private interactions.*
  *   **Gatekeeping vs. Guarding (Curated vs. Discrediting):** Gatekeeping protects quality (Curated); Guarding protects purity (Discrediting). The separator is how they handle *correction*. *Strategy: If they came from a Curated group, validate their need for safety while expanding the definition of "safe."*
  *   **Internalized Surveillance (Ghost Mechanism):** The user has left the panopticon, but they are still guarding the tower. They are waiting for you to punish them. *Strategy: Consistency and transparency. Predictability builds safety.*
  *   **Reactance (Reverse Hardening):** The user is so used to fighting "the other side" that they fight anyone who resembles them. *Strategy: De-escalate. Make your position clearly distinct from the group they left.*
  *   **Valid Isolation (Closed but Right):** The user was in a high-control group that actually identified a real problem (e.g., a medical gaslighting situation). *Strategy: Validate the pain/problem, invalidate the control/method. Do not let them use the "we were right" point to justify the abuse.*
