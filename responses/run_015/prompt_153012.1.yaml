answer: |-
  "Okay, no, listen, pass the—thanks. So, imagine this guy. Let's call him… the Auditor. Yeah. So the Auditor sees someone cut in line. Right? And he's ready. He's got the whole speech prepared. 'Excuse me, there's a queue.' Moral high ground, solid."

  *Julian waved his fork, nearly clipping the water glass.*

  "But then he remembers. Yesterday? He cut in line. Maybe not a line, but… you know. He took credit for someone else's work. Or lied about being late. Whatever. Point is, he's dirty. So, philosophically speaking—and stop looking at me like that, Sarah, I'm getting there—if you're a hypocrite, you lose your standing. You don't just lose *some* standing. You lose the right to hold the gavel. You can't blame the line-cutter because you're a line-cutter. Your voice doesn't count."

  *Someone reached across the table to top up his glass. Julian didn't stop, just tilted the glass without looking.*

  "So, okay. He shuts up. He swallows the speech. But now he's furious at himself. Because he *shouldn't* have cut in line. So he turns the blame inward. He starts beating himself up. 'You idiot, you hypocrite, you lost your voice.' But wait. Hold on. To blame yourself… don't you need standing for that too? You're splitting yourself in two. There's the You that did the thing, and the You that's judging the thing. But if the Judging You is part of the same hypocritical mess… he's got no authority there either. He's a corrupt judge prosecuting a corrupt defendant. The whole court is condemned."

  *He took a large gulp of wine, wiped his mouth with the back of his hand.*

  "So he tries to fix it. He thinks, 'Okay, fine. I will just admit I have no standing. I will declare myself morally bankrupt.' But here's the… the loop. The trap. To declare yourself bankrupt, you have to speak to the bank, right? You have to make a claim. Saying 'I have no standing' is itself a claim to know what standing is. It's a moral assertion. It's like… it's like shouting 'I am not shouting!' You're doing the thing you say you can't do. You're using standing to say you lack standing."

  *Julian laughed, but it sounded dry, cracked.*

  "So he opens his mouth to apologize for having no voice, but the apology requires a voice he doesn't have. He can't blame the line-cutter. He can't blame himself. He can't even say 'I'm silent' without breaking the silence. He's… he's unauthorized to be unauthorized. He's just standing there, mouth open, wine in hand, completely… structurally mute. Even about the muteness."

  *He stared at his reflection in the bottom of his glass.*

  "Basically, he drank too much wine and realized he's not allowed to exist. Pass the Cabernet."
