prompt: |-
  I convene a 90-minute session for 18 first-year undergraduates on a course titled Genes, Minds and Society. Most are humanities and social-science students; a handful have done some biology; almost none has ever decomposed a variance. The room has six tables of three, a whiteboard, a long clear stretch of wall, and a laptop for me. Students get no devices. Everything has to fit in a bag I can carry: index cards, small envelopes, dice, a metre rule or printed rulers, sticky notes, markers, and a printed scoring sheet. No money changes hands; stakes can be a leaderboard on the board and a trivial prize such as a bag of apples.

  The topic is heritability. I do not want a lecture or a definition. I want an activity in which students generate data themselves with physical materials, compute something from it, make and lose points on predictions, and only in the last twenty minutes discover what the number they computed was, what it licenses, and what it does not.

  Please design the activity to meet the following specifications.

  Structure. Build it as four short rounds, each of which should produce a specific, nameable confusion in the participants rather than in the facilitator's mouth. Roughly: (1) a round in which the trait is, within each of two separated sub-populations, entirely a function of a value sealed in an envelope, so that the within-group share attributable to the envelopes is very high, while the difference between the two group means is produced entirely by one uniform environmental difference; participants should be led by the setup to predict that the between-group gap is largely inherited, and then be shown the envelopes. (2) A round in which the envelopes are untouched but the range of environments is widened or narrowed, and the share attributable to the envelopes changes accordingly. (3) A round in which a participant is handed a single organism and asked, on the basis of the group-level number, how much of this individual's measured value is due to its envelope, and finds that the question has no answer. (4) A round in which a uniform environmental change shifts the whole distribution even though the envelope share remains high, so that participants who have concluded the trait is fixed by inheritance lose points by predicting that the change will do nothing. Each round needs rules, the actual numbers or card distributions the facilitator must prepare, and what participants record.

  Two further ingredients I want worked in, because they are where the interesting difficulty lives. First, include a crossing interaction: arrange the numbers so that one envelope value outperforms another under one set of conditions and loses to it under another, and have a team that must select stock using only measured outcomes do so and then fail when conditions change; there should be no environment-independent ranking to be had, and the activity should make that felt as a loss of points rather than as a claim. Second, include one round in which the environment an organism experiences is partly produced by the organisms themselves under a planting arrangement the facilitator controls — for instance denser planting allowing taller individuals to suppress their neighbours — so that the share attributable to the envelopes rises because of a modifiable arrangement, and the same genotypes under a different spacing yield a much smaller share. The point that should surface is that a high envelope share can be evidence that an environmental rearrangement matters a great deal, which is the opposite of the conclusion participants will have been drifting toward.

  Roles and incentives. Give participants something to do with real, if small, stakes: at least one role in which a team wagers points on a claim about the causes of a group difference, and at least one in which a team must spend a fixed, scarce budget of some input under a forced choice between giving everyone the same amount and concentrating it on those at the bottom. Say exactly how points are scored, what is recorded on the wall, and how the reveal works.

  Constraints on facilitation. No exposition up front beyond a sentence of framing, and the technical term should not be used until the debrief; beforehand have participants call it something like the sealed-card share or the family component. Use a fictional organism or crop rather than any human trait, and keep transfer to human traits to a clearly bounded final segment.

  Debrief. Map specific moments in the activity onto specific features of the concept: why a high within-group share is compatible with a between-group difference that is entirely environmental, what kind of quantity the share is such that it can change when nothing about the organisms changes, and why it does not attach to individuals. Specify what participants should come away able to say. Then be frank about what the activity cannot reproduce and the facilitator must supply in closing: in real behavioural genetics nobody gets to randomize and open the envelopes, so the quantity is estimated rather than measured, from designs that carry assumptions about equal environments, assortative mating, and correlation between genotype and environment; and the activity's clean orthogonality is a luxury that makes the inference participants want to make hard rather than easy.

  Finally, tell me honestly what will predictably go wrong the first time I run this: the arithmetic stalling the room, the student who has read about the topic and names it in round one, the student who mistakes the envelope for a molecular entity, the group that refuses to wager, and what to do in each case. Include a short facilitator line for handling it if a participant raises human group differences mid-session.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Target Audience:** 18 first-year undergrads (mostly humanities/social sciences, little biology/stats).
      *   **Topic:** Heritability (specifically $h^2$, variance decomposition, GxE interaction, individual vs. population level).
      *   **Constraints:** 90 minutes, no student devices, physical materials only (cards, dice, envelopes, etc.), portable kit.
      *   **Pedagogy:** No lecture/definition upfront. Activity-based. Data generation by students. Computation by students. Prediction/Stakes. Reveal in last 20 mins.
      *   **Structure:** 4 Rounds, each producing specific confusion.
          1.  High within-group envelope share, between-group diff due to environment (misleading intuition).
          2.  Changing environmental variance changes the share.
          3.  Individual attribution fallacy (question has no answer).
          4.  Uniform environmental shift (trait changes, share stays high).
      *   **Specific Ingredients:**
          *   Crossing Interaction (GxE): Rank order changes across environments.
          *   Social/Environmental Construction: Organism arrangement affects variance (density).
      *   **Roles/Incentives:** Wagering points, budget allocation choice (equality vs. targeting). Leaderboard + trivial prize (apples).
      *   **Facilitation:** Minimal upfront exposition. Fictional organism. Term "heritability" withheld until debrief.
      *   **Debrief:** Map activity moments to concepts. Acknowledge limitations (estimation vs. measurement, assumptions).
      *   **Troubleshooting:** Predict failures (arithmetic, spoilers, misconceptions, refusal to wager, human trait drift).

  2.  **Conceptualizing the Organism and Trait:**

      *   Needs to be non-human to avoid immediate ethical baggage.
      *   Needs to be measurable quickly.
      *   *Idea:* "Lumina Beans" (fictional plant). Trait: "Glow Intensity" (measured by stacking transparent colored chips or just a number on a card).
      *   *Better Idea for Physical Measurement:* "Stalk Height" using paper strips or stacking blocks. Let's go with **"Glow-Bulbs"** (fictional crop). Trait: **"Lumen Output"**.
      *   *Measurement:* Students draw a number from an envelope (Genotype) and add/subtract based on a die roll or card (Environment).
      *   *Refinement:* To make it physical and visual, let's use **Index Cards** inside **Envelopes**.
      *   *Genotype (G):* Number inside a sealed colored envelope (e.g., Red, Blue).
      *   *Environment (E):* Determined by table conditions or dice rolls.
      *   *Phenotype (P):* $P = G + E$.

  3.  **Drafting the Four Rounds (Iterative Process):**

      *   *Round 1 (The Gap):* Two groups (Table 1-3 vs. Table 4-6).
          *   Group A: Envelopes contain numbers 10, 11, 12. Environment = +0.
          *   Group B: Envelopes contain numbers 10, 11, 12. Environment = +10.
          *   *Wait, constraint says:* Within-group share attributable to envelopes is high. Between-group difference is environmental.
          *   *Correction:*
              *   Group A (Tables 1-3): Envelopes vary (5, 10, 15). Environment = Fixed +0.
              *   Group B (Tables 4-6): Envelopes vary (5, 10, 15). Environment = Fixed +20.
              *   *Result:* Within groups, variance is all Envelope (100%). Between groups, mean diff is all Environment.
              *   *Confusion:* Students see high "Envelope Share" within groups, assume the *gap* between groups is also Envelope.
      *   *Round 2 (Variance Shift):*
          *   Keep Envelopes same. Change Environment variance.
          *   Group A: Environment = Fixed +0. (High Envelope Share).
          *   Group B: Environment = Die Roll (1-6). (Lower Envelope Share).
          *   *Confusion:* The "Envelope Share" number changes even though Envelopes didn't change.
      *   *Round 3 (Individual Fallacy):*
          *   Pick one specific plant. Ask: "How much of *this* plant's height is Envelope?"
          *   *Confusion:* Math doesn't work for individuals. It's a population statistic.
      *   *Round 4 (Shift & Interaction):*
          *   Uniform shift (add +10 to everyone). Share stays high, but mean changes.
          *   *Interaction:* Need GxE. Envelope A beats B in Env 1, loses in Env 2.
          *   *Constraint Check:* Need "Social/Environmental Construction" (density).
          *   *Integration:* Let's combine Round 4 and the Density constraint.
          *   *Revised Plan:*
              *   Round 1: High $h^2$ within, Environmental Gap between.
              *   Round 2: Change E variance -> Change $h^2$.
              *   Round 3: Individual attribution (The "Budget" round).
              *   Round 4: GxE Interaction + Density (The "Planting" round).

      *   *Wait, I need to fit the "Budget/Role" constraint in.*
          *   Role 1: Wagering on causes (Round 1).
          *   Role 2: Budget allocation (Round 3).
          *   Interaction/Density needs to be prominent. Let's make Round 4 the Interaction/Density round.

  4.  **Developing the Mechanics & Materials:**

      *   **Kit:** 18 Envelopes (sealed), 18 Genotype Cards (inside), 6 Environment Cards (per table), Dice, Scoring Sheets, Markers.
      *   **Organism:** "Spark-Grass". Trait: "Lumens".
      *   **Calculation:** $P = G + E$.
      *   **"Envelope Share" (Heritability):** $\text{Variance}_G / (\text{Variance}_G + \text{Variance}_E)$.
      *   *Simplification for Non-Stats Students:* Calculating variance is hard in 90 mins.
      *   *Alternative:* Use Range or Mean Absolute Deviation? No, variance is key to the concept.
      *   *Solution:* Pre-calculate variance values on a "Lookup Table" based on the Range of scores they get. Or, simplify the math: "Sum of Squares" is too hard.
      *   *Better Solution:* Use a simplified proxy. "The Spread".
      *   *Actually:* The prompt asks them to "compute something". I need to make the arithmetic trivial.
      *   *Strategy:* Give them the Variance of the Envelopes ($V_G$) on the outside of the envelope *after* the round? No, that spoils it.
      *   *Strategy:* The "Scoring Sheet" provides the formula: $\text{Share} = \frac{\text{Range of Envelopes}}{\text{Range of Total Scores}}$. This is a rough proxy for variance but computable by hand. Let's stick to Range for speed, acknowledging it's a proxy in debrief.
      *   *Wait, Variance is crucial for the "Environmental Variance" point.* If I use Range, adding a constant doesn't change Range. Adding a *variable* does.
      *   *Decision:* I will provide a "Variance Calculator" on the sheet. They input the 3 numbers per table. The sheet tells them the Variance. (Like a nomogram or lookup table).
      *   *Actually, 18 students, 6 tables of 3.* Each table grows 3 plants.
      *   *Table Variance:* With N=3, variance is unstable.
      *   *Adjustment:* Pool data for the "Population".
      *   *Let's simplify:* The "Share" is calculated by the Facilitator based on their data, but they *predict* it.
      *   *No, prompt says:* "compute something from it".
      *   *Okay, hard constraint:* They must compute.
      *   *Math Hack:* Use "Mean Deviation". $|x - \text{mean}|$. Sum them. It's linear and easier.
      *   *Formula:* $\text{Share} = \frac{\sum|G - \text{Mean}_G|}{\sum|P - \text{Mean}_P|}$.
      *   *Even simpler:* Just use the **Range** (Max - Min). It's intuitive. $\text{Share} = \frac{\text{Range}_G}{\text{Range}_P}$. It captures the logic without the quadratic math. I will note this simplification in the debrief.

  5.  **Refining the Rounds for Specific Confusions:**

      *   **Round 1 (The Gap):**
          *   Tables 1-3 (North): Envelopes [10, 20, 30]. Env = +0.
          *   Tables 4-6 (South): Envelopes [10, 20, 30]. Env = +50.
          *   Within-group Share: 100% (Env is constant).
          *   Between-group Diff: 50 (Purely Env).
          *   *Wager:* Teams bet points on whether the North-South gap is "Mostly Envelope" or "Mostly Soil".
      *   **Round 2 (The Variance Shift):**
          *   Tables 1-3: Envelopes [10, 20, 30]. Env = +0 (Constant). Share = 100%.
          *   Tables 4-6: Envelopes [10, 20, 30]. Env = Dice Roll (1-60).
          *   *Confusion:* Envelopes are identical to R1, but Share drops because Env Variance increased.
      *   **Round 3 (The Individual & Budget):**
          *   Pick one plant (e.g., Score 75).
          *   Question: "How many points of this 75 are Envelope?"
          *   Task: Budget of "Fertilizer" (+10 points). Distribute to maximize total yield.
          *   Option A: Give to all (Uniform). Option B: Give to lowest performers.
          *   *Confusion:* If Share is high, students think "It's fixed, don't bother". But if Env matters, Fertilizer works.
      *   **Round 4 (Interaction & Density):**
          *   *Interaction:* Envelope Type A > Type B in Low Density. Type B > Type A in High Density.
          *   *Density:* Tables 1-3 plant "Close" (subtract 10 from neighbor). Tables 4-6 plant "Far".
          *   *Confusion:* High Share in "Far" condition makes them think Env doesn't matter. But changing to "Close" changes the Share *and* the Mean.
          *   *Wait, need to fit the "Social/Environmental Construction" constraint:* "environment an organism experiences is partly produced by the organisms themselves... denser planting allowing taller individuals to suppress their neighbours".
          *   *Mechanism:* If you are at a table, your Environment score depends on the Genotype of your neighbor.
          *   *Revised Round 4:*
              *   Condition A (Sparse): Env = Fixed.
              *   Condition B (Dense): Env = Fixed - (Neighbor's Genotype / 2).
              *   *Result:* In Dense, the Variance of P increases (due to neighbor effects), potentially lowering the Envelope Share *unless* the Genotype variance is huge.
              *   *Actually, the prompt wants:* "share attributable to the envelopes rises because of a modifiable arrangement".
              *   *Okay:* In Dense planting, the "weak" plants die or get suppressed to a floor. This reduces Environmental/Noise variance relative to Genetic variance?
              *   *Let's try:* In "Managed" env (Greenhouse), Env variance is low -> Share is High. In "Wild" env, Env variance is high -> Share is Low.
              *   *Prompt Specific:* "same genotypes under a different spacing yield a much smaller share."
              *   *Okay:* Spacing changes the Environmental Variance.
              *   *Interaction:* Genotype 1 does well in Wide, poorly in Narrow. Genotype 2 vice versa.

  6.  **Addressing the "Budget/Role" Constraint:**

      *   Need a team that wagers (Round 1).
      *   Need a team that spends a budget (Round 3).
      *   Let's assign roles per table.
      *   Tables 1-3: "Breeders" (Select stock).
      *   Tables 4-6: "Farmers" (Manage environment).
      *   *Wait, need specific wagering.*
      *   Let's make it competitive. All tables compete.
      *   **Wager:** Before revealing Envelopes in Round 1, bet on source of North/South gap.
      *   **Budget:** Round 3. You have 3 units of "Water". Distribute to add +5 per unit.

  7.  **Addressing the "Crossing Interaction":**

      *   Need Genotype A > Genotype B in Env 1.
      *   Need Genotype B > Genotype A in Env 2.
      *   This must cost points.
      *   *Mechanism:* In Round 4, Teams select which Envelope (Seed) to plant for next season based on Round 3 performance.
      *   *Twist:* The Environment changes between Round 3 and 4. The "Best" seed becomes the "Worst". They lose points.

  8.  **Finalizing the Flow:**

      *   **Intro (5 min):** Fictional crop (Lumina Grass). Trait (Glow). Rules.
      *   **Round 1 (20 min):** The Gap. (High $h^2$ within, Env between). Wager on Gap cause.
      *   **Round 2 (20 min):** The Variance. (Change Env variance). Compute Share. See it change.
      *   **Round 3 (20 min):** The Individual & Budget. (Attribution fallacy + Resource allocation).
      *   **Round 4 (25 min):** Interaction & Density. (GxE + Social Env). Selection fails.
      *   **Debrief (20 min):** Reveal "Heritability". Map confusions. Limitations.

      *Wait, 90 mins total.*
      *   Intro: 5
      *   R1: 15
      *   R2: 15
      *   R3: 15
      *   R4: 15
      *   Debrief: 20
      *   Total: 90. Tight. Need to keep mechanics snappy.

  9.  **Troubleshooting & Facilitation:**

      *   *Arithmetic:* Provide a lookup table for Variance/Range calculations.
      *   *Spoiler:* "I know this, it's heritability." -> "Great, you're the Fact Checker. Don't speak until the end. Your job is to verify the math."
      *   *Human Traits:* "Stop. We are talking about Glow-Grass. We will talk about people in the last 10 minutes."
      *   *Refusal to Wager:* Make the wager mandatory for points, or assign a "Risk Officer" role.

  10. **Writing the Plan:**

      *   *Tone:* Precise, instructional, ready-to-run.
      *   *Materials:* Detailed list.
      *   *Scripts:* Exact lines for the facilitator.
      *   *Math:* Ensure the numbers work out cleanly.
      *   *Debrief:* Connect specific game moments to specific conceptual errors.

      *(Self-Correction on Math)*: Calculating variance for N=3 is messy. $\text{Variance} = \frac{\sum(x-\bar{x})^2}{N-1}$.
      *   If values are 10, 20, 30. Mean = 20. Devs = -10, 0, 10. Sq = 100, 0, 100. Sum = 200. Var = 100.
      *   If values are 10, 20, 30 + Env(0,0,0). P = 10, 20, 30. Var = 100. Share = 100/(100+0) = 1.
      *   If values are 10, 20, 30 + Env(0, 10, 20). P = 10, 30, 50. Mean = 30. Devs = -20, 0, 20. Sq = 400, 0, 400. Sum = 800. Var = 400.
      *   $V_G = 100$. $V_E = ?$ Total $V_P = 400$. $V_E \approx 300$. Share = 100/400 = 0.25.
      *   *Decision:* I will provide a "Variance Lookup Card" for the specific sets of numbers used to save time. Students just look up the Variance of their 3 numbers.

      *(Refining the "Social Env" constraint)*: "environment an organism experiences is partly produced by the organisms themselves... denser planting allowing taller individuals to suppress their neighbours".
      *   *Implementation:* In Round 4, Tables 1-3 are "Crowded". Your Environment Score = Base - (Highest Genotype at Table / 5). This makes the environment dependent on the genotypes present (G-E correlation/interaction).
      *   *Wait, prompt says:* "share attributable to the envelopes rises because of a modifiable arrangement".
      *   *Okay:* If we suppress the neighbors, we might reduce the *variance* of the environment? Or reduce the environmental noise?
      *   *Let's try:* In "Controlled" spacing, Env is constant (Var=0). Share = 100%. In "Wild" spacing, Env varies (Var=High). Share = Low.
      *   *The Point:* High Share (Controlled) makes you think Env doesn't matter. But moving to Wild (Env matters more) drops the Share.
      *   *Actually, the prompt says:* "high envelope share can be evidence that an environmental rearrangement matters a great deal".
      *   *Logic:* If $h^2$ is high, it means $V_E$ is low. If $V_E$ is low, it means the environment is uniform. If you *change* that uniform environment (e.g., add fertilizer to all), you get a big shift.
      *   *Wait, the prompt specific:* "same genotypes under a different spacing yield a much smaller share."
      *   *Okay:* Spacing A (Uniform) -> Low $V_E$ -> High $h^2$. Spacing B (Variable) -> High $V_E$ -> Low $h^2$.
      *   *Conclusion:* High $h^2$ in Spacing A implies the environment is currently uniform, so changing it (rearrangement) would have a huge effect. Low $h^2$ in Spacing B implies environment is already messy, so rearrangement might matter less or is harder to track.
      *   *I need to make sure this logic lands.*

      *(Final check on constraints)*:
      *   4 Rounds? Yes.
      *   Specific confusions? Yes.
      *   Crossing interaction? Yes (Round 4 selection).
      *   Social/Env construction? Yes (Round 4 density).
      *   Wagering/Budget? Yes (R1 Wager, R3 Budget).
      *   No devices? Yes.
      *   Debrief mapping? Yes.
      *   Troubleshooting? Yes.

      *Let's build the numbers.*
      *   Genotypes: G1=10, G2=20, G3=30. (Variance = 100).
      *   Env 1 (Uniform): +0. (Variance = 0). Total Var = 100. Share = 1.0.
      *   Env 2 (Variable): +0, +10, +20. (Variance = 100). Total Var = 200 (approx, assuming independence). Share = 0.5.
      *   Env 3 (Shift): +50. (Variance = 0). Share = 1.0. Mean shifts.
      *   Interaction: G1 does well in Env A, G2 in Env B.

      *Okay, ready to write.*
answer: |-
  # Activity Design: The Lumina Grass Trials

  **Course:** Genes, Minds and Society
  **Time:** 90 Minutes
  **Participants:** 18 Undergraduates (6 Tables of 3)
  **Facilitator Kit:**
  *   18 Sealed Envelopes (labelled "Seed Packet"). Inside: Genotype Cards (values 10, 20, 30).
  *   6 "Environment Decks" (one per table). Cards dictate Environmental values.
  *   6 "Variance Lookup Cards" (pre-calculated variance for sets of 3 numbers).
  *   18 Scoring Sheets (one per student).
  *   6 Markers, 1 Roll of Masking Tape (for "density" lines), 1 Bag of Apples (prize).
  *   Whiteboard for Leaderboard.

  **Fictional Organism:** *Lumina Grass*.
  **Trait:** *Glow Intensity* (Measured in "Lumens").
  **Formula:** $\text{Glow} = \text{Seed Value (G)} + \text{Soil Value (E)}$.
  **Term Ban:** The word "Heritability" is forbidden until the Debrief. Participants call it the **"Sealed Share."**

  ---

  ## Part 1: Structure & Rounds (70 Minutes)

  ### Introduction (5 Minutes)
  **Facilitator Script:** "You are agricultural scientists managing *Lumina Grass*. Your goal is to maximize Glow. Each of you holds a Seed Packet. Inside is a number you cannot see yet. Your Glow is Seed + Soil. We will run four growing seasons. Points are awarded for accurate predictions and high yield. The top table wins the apples."

  **Roles:**
  *   **Scribe:** Records numbers on the Scoring Sheet.
  *   **Calculator:** Uses the Variance Lookup Card.
  *   **Wager/Budget Officer:** Places bets and allocates resources.

  ### Round 1: The Gap (15 Minutes)
  **Goal:** Produce high *Sealed Share* within groups, but an *environmental* difference between groups.
  **Confusion:** "If the trait is mostly 'Seed' within the groups, the difference *between* the groups must be 'Seed' too."

  **Setup:**
  *   **Tables 1-3 (North):** Soil Cards are all **+0**.
  *   **Tables 4-6 (South):** Soil Cards are all **+40**.
  *   **All Tables:** Seed Packets contain one each of **10, 20, 30**.

  **Procedure:**
  1.  Students open packets, add Soil Value, record Glow.
  2.  **Calculation:** Calculate the *Sealed Share* for their table.
      *   *Math Hack:* Look up the Variance of their 3 Glow scores on the **Variance Lookup Card**. Look up the Variance of the 3 Seed values (provided on sheet as "Known Seed Var = 100").
      *   $\text{Sealed Share} = \frac{\text{Seed Var}}{\text{Total Glow Var}}$.
      *   *Result:* Since Soil is constant (+0 or +40), Total Var = Seed Var. Share = 1.0 (100%).
  3.  **The Wager:** Before revealing the Soil Cards to the other half of the room, Tables 1-3 and Tables 4-6 must wager 10 points on a claim: *"The difference in average Glow between North and South is caused mostly by (A) Different Seeds or (B) Different Soil."*
  4.  **Reveal:** Facilitator reveals Soil Cards. North had +0, South had +40.
  5.  **Outcome:** Teams that wagered (A) lose points. The *Sealed Share* was 100% within groups, but the *Gap* was 100% Environmental.

  ### Round 2: The Variance Shift (15 Minutes)
  **Goal:** Change the *Sealed Share* without changing the Seeds.
  **Confusion:** "I thought the Share was a property of the Seeds. Why did the number change when I didn't touch the envelopes?"

  **Setup:**
  *   **Tables 1-3:** Soil Cards are all **+0** (Constant).
  *   **Tables 4-6:** Soil Cards are **+0, +20, +40** (Variable).
  *   **All Tables:** Seed Packets contain **10, 20, 30** (Same as R1).

  **Procedure:**
  1.  Grow plants (calculate Glow).
  2.  **Calculation:** Compute *Sealed Share*.
      *   Tables 1-3: Soil Var = 0. Share = 1.0.
      *   Tables 4-6: Soil Var > 0. Total Var increases. Share drops (e.g., to 0.5).
  3.  **Record:** Write the Share on the wall.
  4.  **Outcome:** Tables 4-6 see their Share drop despite having the exact same Seeds as Round 1. The "Sealed Share" depends on the *environment's variability*, not just the seeds.

  ### Round 3: The Individual & The Budget (15 Minutes)
  **Goal:** Demonstrate the individual attribution fallacy and test policy intuition.
  **Confusion:** "If the Share is high, improving the environment won't help this specific plant."

  **Setup:**
  *   **All Tables:** Soil Cards **+0**. Seeds **10, 20, 30**.
  *   **Sealed Share:** 1.0 (100%).

  **Procedure:**
  1.  **The Question:** The Facilitator points to a student with a Glow of 30 (Seed 30, Soil 0). "The Sealed Share is 100%. How many Lumens of *this specific plant's* score are due to the Seed?"
      *   *Trap:* Students want to say "30" or "100%".
      *   *Reality:* The statistic applies to the *variance* of the group, not the *value* of the individual.
  2.  **The Budget:** Each table gets 3 units of "Nutrient Gel". Each unit adds **+10 Lumens** to a plant.
      *   **Choice:** Distribute equally (+10 to all) OR Target the lowest performer (+30 to the Seed 10 plant).
      *   **Wager:** Teams bet points on which strategy yields a higher *Total Table Glow*.
  3.  **Outcome:** Mathematically, total yield is identical (+30 either way). However, students often hesitate to spend resources when the *Sealed Share* is 1.0, believing the trait is "fixed." The activity forces them to spend, revealing that high Share $\neq$ Environmental Immutability.

  ### Round 4: Interaction & Density (25 Minutes)
  **Goal:** Crossing Interaction (GxE) and Social Environment (Density).
  **Confusion:** "We selected the best seeds, but they failed. Also, crowding changed the Share."

  **Setup:**
  *   **New Seeds:** Two Types. **Type A** and **Type B**.
  *   **Condition 1 (Wide Spacing):** Tables 1-3. Soil = +0.
      *   Type A Glow = Seed + 20.
      *   Type B Glow = Seed + 0.
      *   *Result:* Type A outperforms Type B.
  *   **Condition 2 (Crowded):** Tables 4-6. Soil = **-10 - (Neighbor's Seed / 2)**.
      *   *Social Env:* Your environment is worsened by your neighbor's genetics.
      *   Type A Glow = Seed - 10.
      *   Type B Glow = Seed + 10. (Type B is shade tolerant).
      *   *Result:* Type B outperforms Type A.

  **Procedure:**
  1.  **Selection Phase:** Based on Round 3 data (where Type A logic might be inferred or just general "pick high glow"), Tables must choose which Seed Type to plant for Round 4. Most will pick the previously "best" performer.
  2.  **Planting Phase:**
      *   Tables 1-3 (Wide) plant their choice.
      *   Tables 4-6 (Crowded) plant their choice. Facilitator tapes tables closer together to signify density.
  3.  **Calculation:** Compute Glow and *Sealed Share*.
      *   In Crowded condition, the "Neighbor Effect" adds noise/variance to the Environment.
      *   *Crucial Point:* In Wide Spacing (Uniform Env), Share is High. In Crowded (Variable Env), Share is Low.
  4.  **Outcome:** Tables that picked Type A and got assigned Crowded conditions lose points. They experience the **Crossing Interaction** as a financial loss. They observe that the *Sealed Share* dropped in the Crowded condition, proving that the "High Share" in the Wide condition was evidence that the environment was *uniform*, not that it was unimportant.

  ---

  ## Part 2: Debrief (20 Minutes)

  **1. The Reveal (5 mins)**
  *   Write **HERITABILITY ($h^2$)** on the board.
  *   Acknowledge: "The 'Sealed Share' you calculated is Heritability."
  *   Ask: "Who lost points in Round 1?" (The Gap). "Who lost points in Round 4?" (The Interaction).

  **2. Mapping Confusions to Concepts (10 mins)**
  *   **Round 1 (The Gap):** High $h^2$ *within* groups does not explain differences *between* groups. (Map to: Between-Group Heritability Fallacy).
  *   **Round 2 (Variance Shift):** $h^2$ changed without changing the genes. (Map to: Heritability is population-specific and environment-specific).
  *   **Round 3 (The Individual):** You couldn't assign a % to one plant. (Map to: Heritability is a population statistic, not an individual destiny).
  *   **Round 4 (Density):** High $h^2$ in Wide Spacing meant the environment was uniform. Changing that uniform environment (Crowding) had a massive effect. (Map to: High heritability does not mean the trait is unmodifiable).

  **3. Limitations & Reality (5 mins)**
  *   **The Luxury:** "Here, I gave you the Seed numbers. In real human genetics, we never open the envelope."
  *   **The Estimation:** "We estimate this using twins or families, assuming their environments are equal. If that assumption is wrong, the number is wrong."
  *   **The Orthogonality:** "Here, Seeds and Soil were independent. In reality, people select environments that match their genes (Gene-Environment Correlation). This makes the math much messier."
  *   **Human Transfer:** "When you see this number applied to human IQ or behavior, remember Round 1. A high number does not explain why Group X differs from Group Y. Remember Round 4. A high number does not mean intervention is futile."

  ---

  ## Part 3: Facilitator Constraints & Troubleshooting

  **Materials Prep:**
  *   **Envelopes:** Seal tightly. Write "G" on the card inside.
  *   **Lookup Cards:** Pre-calculate Variance for the specific triples used (e.g., 10,20,30 = Var 100; 10,30,50 = Var 400). Do not make students calculate squares.
  *   **Leaderboard:** Keep it visible. Update after every round.

  **Predictable Failures & Fixes:**

  1.  **Arithmetic Stall:**
      *   *Risk:* Students get stuck calculating variance.
      *   *Fix:* The **Variance Lookup Card**. It says: "If your 3 numbers are [10, 20, 30], Variance is 100." No math required, just pattern matching.
  2.  **The "Spoiler" Student:**
      *   *Risk:* A student says, "This is heritability," in Round 1.
      *   *Fix:* Pre-empt in intro. "If you know this concept, your role is **Fact Checker**. You must verify the math but cannot name the concept until I do. Violation costs your table 5 points."
  3.  **The "Molecular" Mistake:**
      *   *Risk:* Student thinks the Envelope is a specific gene (DNA).
      *   *Fix:* During Round 2, emphasize: "The Envelopes didn't change. The Number did. Is the DNA changing?" (No). "So the Share isn't just about the DNA."
  4.  **Refusal to Wager:**
      *   *Risk:* Students feel uncomfortable betting.
      *   *Fix:* Make it mandatory for the "Wager Officer." "No wager = 0 points for the round. Wager = chance for points." Frame it as "Scientific Confidence."
  5.  **Human Trait Drift:**
      *   *Risk:* Student asks, "Does this explain racial IQ gaps?" mid-session.
      *   *Facilitator Line:* "That is exactly the kind of transfer we will analyze in the final debrief. For now, stick to the Grass. If we break the model now, we won't have the tools to answer that question correctly later."

  **Scoring Summary:**
  *   **Round 1:** 10 pts for correct Gap Wager.
  *   **Round 2:** 5 pts for correct Share Calculation.
  *   **Round 3:** 5 pts for Budget Execution (any choice is fine, must spend).
  *   **Round 4:** 15 pts for High Yield (Interaction trap).
  *   **Prize:** Bag of apples to the top table.

  **Final Facilitator Note:**
  The success of this session relies on the **pace**. Do not let the math drag. If they struggle with the Lookup Card, walk them through it immediately. The *confusion* must come from the *results*, not from *instructional ambiguity*. Keep the energy high, the stakes trivial but real, and the reveal dramatic.
