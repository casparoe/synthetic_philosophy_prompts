      *   **The Metaphysical Problem:** Address the "Statue and the Clay" issue directly. Acknowledge the donor's concern (Material Constitution) vs. the Conservator's view (Functional Persistence). Use the metallurgist's perspective: atoms change anyway.
      *   **Fair Treatment of the Opposition:** Acknowledge that at 33%, the threshold is high. It's not just cleaning; it's replacement. The donor's fear of "fake" is valid if transparency is lacking.
      *   **The Decision/Criteria:** Why approve? Because "bronze disease" is cancer; inaction is destruction. But *how* we do it matters.
      *   **Future Criteria:** Establish a "Threshold of Intervention" and "Transparency Protocol."
      *   **Action Plan:** Timeline, documentation, labeling changes.

  5.  **Refining the Tone:**
      *   Needs to sound like a retired scientist who reads philosophy. Precise, analytical, but accessible.
