      *   *Opposing View:* If identity is tied to original material, replacing 33% breaks identity.
      *   *Resolution:* Distinguish between *historical artifact* (value in original material) and *aesthetic/historical work* (value in form and intent). The statue is a "functional kind" not just a "material kind."
      *   *Key Concept:* "Continuity of Form and History" vs. "Material Integrity."

  4.  **Drafting - Section by Section:**

