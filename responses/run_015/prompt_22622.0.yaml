      *   *Self-Correction:* Actually, the prompt asks for the "committee's decision memo." This implies the decision has effectively been made or the user is drafting the rationale for the decision they intend to drive. Given the user's specific philosophical interest, the memo should reflect *their* voice as a committee member proposing a resolution, or perhaps the Chair asking them to draft the rationale. Let's assume the user is drafting the *rationale* for the decision they support, to be circulated as a discussion paper or a draft decision.
      *   *Refinement:* The prompt says "draft the committee's decision memo." This suggests the output should look like the final output of the committee, or at least a strong proposal from the user (as a senior member) that sets the decision. Let's aim for a "Draft Decision & Rationale" that the user can present. I will frame it as a recommendation from the Metallurgist/Member to the Committee, which serves as the basis for the vote.
