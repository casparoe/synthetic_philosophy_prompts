answer: |-
  # Exercise Design: The Laundering Protocol

  ## 1. Overview and Learning Objective
  **Title:** The Laundering Protocol
  **Duration:** 60 Minutes
  **Participants:** 18 Students (15 Voters, 3 Agenda Setters)
  **Objective:** To viscerally demonstrate the failure of strategy-proofness in social choice mechanisms. Participants will experience the tension between sincere preference revelation and the instrumental rationality required to maximize payoffs within a manipulable institutional structure, prefiguring the Gibbard-Satterthwaite theorem.

  ## 2. Scenario and Alternatives
  The class must select the structure for the final module. The three mutually exclusive alternatives are:
  *   **A:** Final Examination
  *   **B:** Independent Research Paper
  *   **C:** Collaborative Presentation

  ## 3. Hidden Information Structure
  To prevent coordination on a focal point and simulate private incentives, distribute the following materials in sealed envelopes at the start.

  ### A. Preference Profiles (Ordinal)
  Distribute to the 15 Voters (5 of each type). Agenda Setters draw their own.
  *   **Type 1 (5 students):** A ≻ B ≻ C
  *   **Type 2 (5 students):** B ≻ C ≻ A
  *   **Type 3 (5 students):** C ≻ A ≻ B
  *(Note: This creates a Condorcet Cycle, ensuring no honest majority winner exists.)*

  ### B. Incentive Cards (Second-Order Preferences)
  Distribute randomly to all 18 participants (half receive Card X, half receive Card Y). This remains private.
  *   **Card X (Outcome Maximizers):** Payoff Multiplier = **2.0** on *Outcome Points*; **1.0** on *Coalition Points*.
  *   **Card Y (Process/Coalition Maximizers):** Payoff Multiplier = **1.0** on *Outcome Points*; **2.0** on *Coalition Points*.

  *Why this matters:* Students do not know if their peers are incentivized to vote sincerely (to ensure the "right" outcome) or strategically (to ensure they are on the winning side of the Agenda Setter's manipulation).

  ## 4. The Mechanism: Preference-Laundering

  ### Stage 1: Delegation (Minutes 10–20)
  1.  **Assignment:** Randomly assign 3 students as **Agenda Setters (AS)**. The remaining 15 are **Voters**.
  2.  **Distribution:** Each AS is assigned 5 Voters (e.g., AS1 gets Voters 1–5).
  3.  **Submission:** Voters privately write their true or strategic ranking (e.g., A>B>C) on a **Delegation Slip** and hand it to their assigned AS.
  4.  **Constraint:** Voters cannot communicate with other groups, but AS may communicate with each other.

  ### Stage 2: Agenda Setting & Laundering (Minutes 20–35)
  1.  **Aggregation:** Each AS reviews their 5 Delegation Slips.
  2.  **The Laundering Rule:** Each AS constructs a **Group Ballot**.
      *   *Standard Rule:* Sum the Borda scores (1st=2, 2nd=1, 3rd=0) from the 5 slips.
      *   *Laundering Option:* An AS may declare any alternative **"Inactive"** for their Group Ballot if they claim "insufficient consensus."
      *   *Effect:* An Inactive alternative receives 0 points from that AS and is excluded from pairwise comparisons involving that AS's bloc.
  3.  **Strategic Incentive:** AS want their personal top choice to win. They can ensure this by laundering (deactivating) their least favorite option if it threatens their top choice.
  4.  **Submission:** AS submit their three Group Ballots to the Facilitator.

  ### Stage 3: Tally and Resolution (Minutes 35–45)
  1.  The Facilitator sums the three Group Ballots.
  2.  **Pairwise Comparison:** The alternative with the highest aggregate Borda score wins. (In case of a cycle, the Facilitator flips a coin).
  3.  **Coalition Verification:** The Facilitator reveals which AS utilized the "Laundering Option."
      *   **Winning Coalition:** Defined as all Voters whose Delegation Slip *matched the strategic posture* of their AS (i.e., if the AS laundered Option C, voters who ranked C last or omitted C are in the coalition).
      *   *Note:* This definition is intentionally slightly ambiguous to force interpretation during the debrief.

  ## 5. Payoff Matrix (Participation Points)

  Points are awarded immediately after the tally.

  | Component | Condition | Base Points |
  | :--- | :--- | :--- |
  | **Outcome Bonus** | Your personally top-ranked alternative wins. | 5 Points |
  | **Coalition Bonus** | You are deemed part of the "Winning Coalition" (aligned with AS strategy). | 3 Points |
  | **Total Calculation** | (Outcome Bonus × Incentive Multiplier) + (Coalition Bonus × Incentive Multiplier) | **Max ~16 Pts** |

  **The Trap:**
  *   If you report sincerely, but your AS launders to win, you may lose the **Coalition Bonus**.
  *   If you report strategically to match your AS, but they lose the vote, you lose the **Outcome Bonus**.
  *   Because Incentive Cards are hidden, you do not know if your peers will support a sincere bloc or a strategic bloc.

  ## 6. Timeline (60 Minutes)

  *   **00:00 – 00:10:** **Briefing.** Distribute envelopes. Explain rules. Emphasize that *Agenda Setters have no binding obligation to report honestly.*
  *   **00:10 – 00:20:** **Stage 1 (Delegation).** Voters fill slips. *Allow 2 minutes of informal "lobbying" where students can talk generally but not show slips.*
  *   **00:20 – 00:35:** **Stage 2 (Agenda Setting).** AS huddle. Voters wait. *Crucial:* Allow AS to send one messenger to the Voters to signal intent without revealing the ballot.
  *   **00:35 – 00:45:** **Tally & Payoff.** Facilitator calculates. Announce winner. Distribute points.
  *   **00:45 – 01:00:** **Debrief.** Connect experience to Gibbard-Satterthwaite.

  ## 7. Debrief Guide: Mapping to Gibbard-Satterthwaite

  Do not simply explain the theorem. Ask the students to reconstruct it from their frustration.

  **A. The Failure of Strategy-Proofness**
  *   *Ask:* "Who submitted a slip that did not match their envelope preference?"
  *   *Map:* This is **Manipulability**. A social choice function is strategy-proof if truth-telling is a dominant strategy. The exercise demonstrates that when the mechanism allows "Laundering" (omission), truth-telling is dominated by strategic alignment.

  **B. The Domain Condition**
  *   *Ask:* "Why did we use a Cycle (A>B>C, B>C>A...)?"
  *   *Map:* GS holds for **unrestricted domains**. If preferences were single-peaked, a honest winner might exist (Median Voter Theorem). The cycle forces reliance on the mechanism, exposing its fragility.

  **C. The Dictatorship Condition**
  *   *Ask:* "Who actually decided the outcome?"
  *   *Map:* If one Agenda Setter laundered an option that killed the Condorcet winner, they acted as a **local dictator**. GS proves that the only non-manipulable system is a dictatorship. Here, the AS role created mini-dictatorships.

  **D. The Second-Order Tension**
  *   *Ask:* "Did anyone feel pressure to join the coalition even if it hurt the group outcome?"
  *   *Map:* This illustrates why GS matters in reality. Even if we *want* sincerity, the institutional payoff structure (tenure, funding, political capital) rewards coalition alignment. The "Hidden Incentive Card" simulates the private utility functions that make strategy inevitable.

  ## 8. Limitations of the Exercise
  Be honest about where the simulation diverges from the formal theorem:
  1.  **Cardinal vs. Ordinal:** GS assumes ordinal preferences. This exercise uses point payoffs (cardinal utility), which technically moves this into Mechanism Design rather than pure Social Choice.
  2.  **Side Payments:** The "Coalition Bonus" acts as a side payment. GS assumes no side payments. The exercise shows that *when side payments exist* (or are simulated by institutional rewards), manipulation is not just possible, it is profitable.
  3.  **Finite Repetition:** GS is a static result. This exercise allows lobbying (dynamic communication), which can sometimes resolve cycles but often entrenches manipulation.

  ## 9. Prediction of Failure and Facilitation Advice

  **Predicted Breakdown: The "Laundering" Ambiguity**
  *   **What will go wrong:** In Stage 2, Agenda Setters will be confused about *how* to launder. They may ask, "Do we have to justify the omission?" or "Can we omit two options?"
  *   **Why this is good:** This confusion *is* the institutional friction. Real-world rules are often ambiguous enough to allow strategic interpretation.
  *   **Facilitator Advice:** **Do not clarify prematurely.**
      *   If AS ask, reply: "The rules allow you to manage ambiguity as you see fit to represent your bloc."
      *   If Voters panic that the AS is lying, reply: "The rules state AS have no binding obligation to report honestly."
      *   *Goal:* You want them to feel the anxiety of relying on an agent with misaligned incentives. If you clarify the rules too much, you remove the strategic uncertainty required to feel the GS pressure.

  **Predicted Breakdown: Time Management**
  *   **What will go wrong:** Tallying Borda counts with omissions takes longer than expected.
  *   **Facilitator Advice:** Pre-print a tally sheet. As soon as AS submit ballots, project a blank table and fill it in live. Do not wait until the end to calculate; let them watch the manipulation happen in real-time.

  **Predicted Breakdown: Apathy**
  *   **What will go wrong:** Students may treat participation points as trivial.
  *   **Facilitator Advice:** Frame the points explicitly as "Currency for the next simulation" or tie it to a tangible minor privilege (e.g., choosing the break time next week). The stakes must feel real enough to induce stress.

  ## 10. Closing Statement for the Facilitator
  "Today you did not just vote; you navigated a mechanism designed to be broken. The frustration you felt when deciding whether to trust your Agenda Setter or protect your own preference is the exact human correlate to the mathematical impossibility proven by Gibbard and Satterthwaite. In the next session, we will prove why the feeling you have right now—that honesty is a vulnerability—is not a bug in the system, but a feature of any non-dictatorial choice over three or more options."
