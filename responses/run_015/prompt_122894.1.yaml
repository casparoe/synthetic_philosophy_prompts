answer: |-
  Here is a specification list for a Kuhnian paradigm shift, calibrated for archival work in mid-century biomedicine. I have categorized the requirements by their philosophical status (Kuhn-essential vs. camp preference) and flagged the structural tensions you asked for.

  ### The Requirement List for a Kuhnian Paradigm Shift

  #### 1. Incommensurability of Standards (The "No Neutral Algorithm" Clause)
  *   **The Requirement:** The account must demonstrate that the criteria for what counts as a "solution," "evidence," or "explanation" in the successor framework cannot be neutrally adjudicated by the standards of the predecessor. The new paradigm does not just answer the old questions better; it changes which questions are legitimate.
  *   **The Consideration:** If the transition can be resolved by a shared metric (e.g., predictive accuracy measured the same way in both), it is Lakatosian progress, not Kuhnian revolution.
  *   **Status:** **Non-Negotiable (Kuhn).** *Structure of Scientific Revolutions* (SSR) hinges on the absence of a super-paradigmatic language.
  *   **Archival Marker:** Look for referee reports or grant reviews where the *basis* of rejection shifts (e.g., "mechanism unspecified" becomes "clinical correlation missing" or vice versa), not just the *result*.

  #### 2. Lexical Incommensurability (Meaning vs. Belief)
  *   **The Requirement:** The account must distinguish between a change in truth-value assigned to a proposition (belief change) and a change in the reference or extension of the terms used (meaning change).
  *   **The Consideration:** As you noted with "stress" or "immune," if the term remains but the network of relations defining it shifts (e.g., "stress" moves from a non-specific physiological response to a specific HPA-axis cascade), translation fails.
  *   **Status:** **Non-Negotiable (Kuhn).** Later Kuhn (post-1990) emphasized this even more than the 1962 text.
  *   **Archival Marker:** Instances where correspondents talk past each other using the same noun, or where definitions are explicitly renegotiated in committee minutes.

  #### 3. The Crisis Condition (Anomaly + Loss of Confidence)
  *   **The Requirement:** The account must evidence not just the accumulation of anomalies, but a *loosening of the rules* of normal science and a palpable erosion of professional confidence in the existing matrix.
  *   **The Consideration:** This addresses your "many anomalies, no crisis" worry. Anomalies are routine. Crisis is sociological; it is the sense that the tools no longer work *and* that the authority of the leadership is fracturing.
  *   **Status:** **Non-Negotiable (Kuhn).** Without crisis, there is only puzzle-solving.
  *   **Archival Marker:** Explicit expressions of despair in correspondence, proliferation of competing ad-hoc hypotheses, or senior figures publicly questioning the foundational assumptions (not just specific results).

  #### 4. Non-Cumularity (Obsolescence)
  *   **The Requirement:** The successor must render the predecessor largely obsolete, not subsume it. The old theory is not shown to be "false" in a logical sense, but "inapplicable" to the new world.
  *   **The Consideration:** Realists want to say Einstein includes Newton. Kuhn says Einstein makes Newtonian physics a special case that no longer describes the *world* in the same way.
  *   **Status:** **Non-Negotiable (Kuhn).** This is the anti-realist core.
  *   **Archival Marker:** Textbooks or training manuals from the transition period that explicitly frame the old way as "historical" or "misleading" rather than "approximate."

  #### 5. Community Scope and Granularity
  *   **The Requirement:** The shift must occur within a defined "scientific community" that shares a disciplinary matrix. The unit of analysis must be the group, not just the idea.
  *   **The Consideration:** Kuhn defines paradigms by the communities that hold them. If your "lab" is the community, it works. If your "lab" is just a site within a larger community that didn't shift, it's not a paradigm shift.
  *   **Status:** **Tension Point (Historian vs. Kuhn).** Kuhn implies disciplinary matrices (Physics, Chemistry). Historians work on labs/subfields.
  *   **Archival Marker:** Citation networks, hiring patterns, or funding flows showing a split in the community (e.g., NIMH vs. APA).

  #### 6. Diagnosability without Hindsight
  *   **The Requirement:** The markers of crisis and shift must be visible in the contemporary record, not inferred from the victory of the successor.
  *   **The Consideration:** It is easy to call it a revolution because we know who won. The historian's job is to show the contingency *at the time*.
  *   **Status:** **Historian Preference (Methodological).** Kuhn describes the phenomenology, but doesn't mandate archival accessibility. However, for HPS, this is necessary for validity.
  *   **Archival Marker:** Evidence of viable alternatives existing *during* the crisis, not just reconstructed later.

  ---

  ### Camp Preferences (Not Kuhn-Essential)

  *   **Realist Preference:** *Truth Approximation.* The account shows the new paradigm is "closer to the truth." **(Incompatible with Kuhn).** Kuhn explicitly rejects verisimilitude as the engine of change.
  *   **Sociologist Preference:** *Social Factors as Primary.* The account explains the shift primarily through power, funding, or institutional hierarchy rather than puzzle-solving failure. **(Compatible but Contested).** Kuhn allows social factors (especially in crisis), but Realists argue this reduces science to politics.
  *   **Historian Preference:** *Local Continuity.* The account shows how the shift was managed through existing networks/relationships. **(Tension with Kuhn).** Kuhn emphasizes rupture; historians often find continuity in the social fabric even when theory breaks.

  ---

  ### Incompatible Pairs (The "Cannot Jointly Satisfy" List)

  You asked to flag tensions where satisfying one requirement undermines another. These are the friction points for your dissertation defense.

  **1. Lexical Incommensurability vs. Archival Translatability**
  *   **The Conflict:** If Requirement 2 (Meaning Change) is strictly true, the actors in your archives literally mean different things by "stress." If they mean different things, how can *you* (the historian) translate their correspondence into a coherent narrative?
  *   **The Trap:** If you can translate their letters fluently, you risk proving the meanings weren't actually incommensurable. If you insist they were incommensurable, you risk making the historical actors unintelligible.
  *   **Resolution Strategy:** Argue for *partial* overlap. They share enough language to fight, but not enough to agree.

  **2. Community Granularity vs. Disciplinary Matrix**
  *   **The Conflict:** Requirement 5 (Community Scope) vs. your need for local granularity. Kuhn's paradigms usually govern whole disciplines (e.g., Physical Optics). If you define the community as "The Selye Lab," a shift there might just be a local theory change, not a paradigm shift.
  *   **The Trap:** Shrink the community to fit the data, and you dilute the concept of "Paradigm." Expand the community to fit "Paradigm," and your archival evidence becomes too thin to support the claim.
  *   **Resolution Strategy:** Define the "Specialty." Show that the lab *led* the specialty, so its shift dragged the matrix.

  **3. Crisis Diagnosability vs. Gestalt Switch**
  *   **The Conflict:** Requirement 6 (Diagnosability) vs. Kuhn's notion of the "Gestalt Switch." A Gestalt switch is a phenomenological experience of seeing the world differently. Archives record *propositions*, not *perceptions*.
  *   **The Trap:** You can prove people changed their minds (belief), but you cannot archive a Gestalt switch. Relying too much on the "feeling" of crisis risks psychologizing without evidence.
  *   **Resolution Strategy:** Treat the "switch" as a rhetorical shift in how anomalies are described (from "puzzles to be solved" to "failures of the system").

  ---

  ### Application to Test Cases

  #### Case 1: The Replication Crisis in Psychology
  *   **Verdict:** **Normal Science Repair (Lakatosian), not Kuhnian Shift.**
  *   **Against the List:**
      *   *Standards (Req 1):* The standards (p < 0.05, experimental method) are largely *reinforced*, not changed. The crisis is about adherence to rules, not the rules themselves.
      *   *Meaning (Req 2):* "Effect," "Significance," and "Replication" retain their semantic core.
      *   *Crisis (Req 3):* There is loss of confidence, but it is directed at *practices* (p-hacking), not the *matrix* (behavioralism/cognitivism).
      *   *Non-Cumularity (Req 4):* The goal is to save the existing literature by filtering it, not to declare pre-2010 psychology obsolete.
  *   **Diagnosis:** This is a "mopping up" operation that got out of hand. It is normal science realizing it was being sloppy.

  #### Case 2: Psychiatric Nosology (DSM Syndromes → RDoC/Dimensional)
  *   **Verdict:** **Candidate for Paradigm Shift (Unfolding).**
  *   **Against the List:**
      *   *Standards (Req 1):* Shift from clinical observation/symptom clustering (DSM) to circuitry/biomarkers (RDoC). A "valid" diagnosis changes from "reliable symptom check" to "biological substrate."
      *   *Meaning (Req 2):* "Depression" shifts from a behavioral cluster to a dysfunction in specific neural circuits (e.g., negative valence systems). The extension of the term changes.
      *   *Crisis (Req 3):* Explicitly acknowledged. NIMH director Insel's 2013 statement that DSM has "no validity" is a textbook crisis marker.
      *   *Granularity (Req 5):* Fits the "Specialty" level. Psychiatry is a distinct community with its own journals, funding, and training.
      *   *Non-Cumularity (Req 4):* RDoC proponents argue DSM categories *obscure* mechanism. They are not subsuming DSM; they are attempting to bypass it.
  *   **Diagnosis:** This fits the Kuhnian spec better, provided you can show the *incommensurability* in the archives (e.g., clinicians vs. neuroscientists talking past each other regarding what counts as a "case").

  ### Summary for your Defense
  If you want to use "Paradigm Shift," you must prove **Incommensurability** (Req 1 & 2) and **Crisis** (Req 3). If you only have **Anomaly** and **Theory Change**, you have Lakatos. If you have **Social Change** without **Epistemic Rupture**, you have Sociology of Scientific Knowledge (SSK). The tension you will face is proving the *meaning* changed (Req 2) without making your historical actors unintelligible (The Incompatibility Pair). Focus your archival work on moments of *translation failure* between correspondents.
