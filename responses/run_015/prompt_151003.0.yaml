answer: |-
  In the Metropolitan Conservation Lab's Volumetric Absence Registry (VAR), Null-Pedestal 7 holds the digital record of *The Voided Bust*, a sculpture removed for acid cleaning, yet the system continues to track the precise negative space as a distinct entity with "modal inertia"—a structural feature wherein the absence's boundary conditions remain counterfactually stable and causally constraining on potential replacements even if the pedestal's material composition were hypothetically altered. Researcher A (the quantifier variantist) and Researcher B (the ontological realist) stand before the empty pedestal; both sincerely report the intuition that "something is present" (the absence) and agree on all empirical data regarding light occlusion, air displacement, and sensor readings (Condition 1 & 2). However, when A asserts "The absence exists," they mean "The absence is a valid index within our conservation framework," whereas B asserts "The absence exists" meaning "The absence is a mind-independent particular with causal efficacy." If A's claim is translated directly into B's ontological idiom, it becomes false (A does not believe in mind-independent absence-particulars), and if B's claim is translated into A's idiom, it collapses into a category error regarding language (Condition 3). Crucially, if the absence lacked modal inertia—if its boundaries shifted arbitrarily with hypothetical material changes—the dispute would dissolve into an empirical argument about sensor calibration error, but because the inertia is stipulated as a robust structural fact, the disagreement remains fixed on whether that structure warrants ontological status (Condition 4).

  **The Deflationist Verdict:**
  The deflationist (aligning with A/Chalmers) classifies this as a verbal dispute because the divergence lies entirely in the semantic rules governing the existential quantifier. Both parties agree on the "hard" facts: the geometry of the void, its causal constraints on future placements (the modal inertia), and the utility of the VAR database. The disagreement arises only when applying the label "object" or "exists." A employs an internal, framework-relative quantifier (existence = utility within the VAR), while B employs an external, ontological quantifier (existence = fundamental mind-independent status). Since there is no possible physical test to distinguish them (Condition 1), the deflationist argues they are talking past one another; A is making a claim about linguistic/conceptual utility, while B is making a claim about metaphysical categorization, despite pointing to the exact same modal structure.

  **The Realist Verdict:**
  The realist (aligning with B/Sider) classifies this as substantive because they argue both parties are attempting to use the same "joint-carving" quantifier—the one that tracks the fundamental structure of reality—but A is mistaken about what that structure permits. They share the quantifier (both intend to speak about what *really* is there), and they share the intuition that the absence is "present" (Condition 2). The divergence is not linguistic but ontological: B argues that the shared modal inertia *constitutes* objecthood, whereas A acknowledges the inertia but arbitrarily denies it ontological weight. For the realist, the dispute is about whether the world's structure includes negative particulars, not about how we choose to speak. A's denial is a substantive error about the composition of reality, not a mere difference in dialect.

  **The Role of Modal Inertia:**
  The modal-inertia feature prevents the dispute from collapsing into an empirical disagreement about measurement error. If the absence's boundaries were fuzzy or contingent on the specific sensors used, A could argue B is hallucinating an object where there is only noise (an empirical claim). By stipulating that the absence robustly constrains counterfactual scenarios independent of the substrate (modal inertia), the scenario guarantees that the *structure* is real and agreed upon. This forces the disagreement upward: since the structure is undeniable, the only remaining question is whether that structure counts as "existence." Modal inertia locks the empirical facts in place, isolating the metaontological variable.

  **The Realist's Counter-Move:**
  The realist argues that the deflationist misapplies the verbal diagnosis by ignoring a shared modal commitment that both parties accept but only the realist treats as ontologically binding. Both A and B agree that the absence possesses modal inertia—that it genuinely constrains what *can* be placed on the pedestal across possible worlds. The realist contends that to admit a entity has mind-independent modal power (inertia) *just is* to admit it exists ontologically. Therefore, when the deflationist says, "We agree on the modal facts, we just disagree on the word 'exists'," the realist replies: "No, if you agree on the modal facts, you have already conceded the ontology. Your refusal to use the word 'exists' is not a linguistic preference; it is a denial of the very modal binding you admitted is real. You are trying to have your modal cake and eat it too by calling it 'framework' rather than 'world,' but the inertia proves it is the world."
