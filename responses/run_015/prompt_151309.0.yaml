  *   Problem: The stalemate between EUT defenders and Revisionists.
  *   Thesis: The stalemate is due to a conflation of Independence, Dynamic Consistency, and Reduction.
  *   Roadmap: How the chapter will disentangle these.

  ### Section 1: The Anatomy of Independence (Approx. 1500 words)
  *   Formal definition of the Independence Axiom.
  *   The Representation Theorem argument: Why linearity is mathematically convenient.
  *   The Normative argument: Why linearity is claimed to be rational.
  *   The Allais Violation: Step-by-step algebraic demonstration of the violation.

  ### Section 2: The Dynamic Defense (Approx. 1500 words)
  *   The Money Pump argument explained.
  *   The Dynamic Consistency requirement.
  *   The link between Dynamic Consistency and Independence.
  *   *Critical Analysis:* Where does this argument assume Reduction? I will pause the narrative here to highlight the assumption that the agent views the dynamic tree as equivalent to the static choice.

  ### Section 3: The Temporal Variable (Approx. 1500 words)
  *   One-stage vs. Two-stage descriptions.
  *   The Reduction of Compound Lotteries axiom defined.
  *   Argument for why temporal resolution might matter normatively (e.g., anticipation, anxiety, planning).
