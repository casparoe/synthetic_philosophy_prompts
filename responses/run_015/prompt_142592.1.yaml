  6.  **Address Unfalsifiability:**
      *   If "ratchets point up" is compatible with any outcome (because bad outcomes were "necessary steps" or "hidden goods"), it's unfalsifiable.
      *   *Is it a problem?* For a empirical claim used to ground normative advice, yes. If you can't test whether your strategy works, you can't optimize it.
      *   *User's View:* The user claims it's an empirical question. If it's empirical, it must be falsifiable. If the ratchets are "mostly invisible," how is it empirical? This is a tension.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the user's insight (ratchets break simple symmetry). Validate that this is a known tension (ontological vs. epistemic cluelessness).
      *   *Defeater Ranking:*
          1.  **Epistemic Symmetry (The Fatal One):** Even if ratchets are ontologically asymmetric, they are *epistemically* symmetric to the agent. You can't tell the good ratchet from the bad one beforehand. This restores the "wash out" effect for decision-making purposes.
          2.  **Indeterminacy (The Strong One):** Lack of probability distribution.
          3.  **Ratchet Symmetry (The Medium One):** Good vs. Bad ratchets might balance.
      *   *Addressing the "Evidence" Reply:* It's a change of subject regarding *action-guidance*. It saves rationality but kills guidance.
      *   *Addressing Unfalsifiability:* It is a problem. If you can't measure the ratchet direction, you can't use it to decide.
      *   *The "Load-Bearing" Symmetry Premise:* The user thinks symmetry is about *outcomes*. The argument actually relies on symmetry of *credence*.

  8.  **Refining the "Epistemic Symmetry" Argument (The Core Counter):**
      *   The user says: "Ratchets bias the future."
      *   The Counter: "You are clueless about *which* ratchet you are engaging."
      *   Example: Founding an institution. It might last 1000 years (Ratchet). But is it the Red Cross or the Thuggee? You don't know. So, relative to your evidence, the EV is still washed out.
      *   This attacks the link between "Ratchets exist" and "I can calculate EV."

  9.  **Refining the Indeterminacy Point:**
      *   If the system is chaotic, probabilities aren't just unknown; they don't exist (in a frequentist sense) or are too vague for Bayesian updating. This makes "Expected Value" a category error.

  10. **Refining the "Maximize EV" Point:**
