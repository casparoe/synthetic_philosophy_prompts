          *   Show if the symmetry premise isn't load-bearing (i.e., does the argument survive the user's denial?).
          *   **Constraint:** No citations or reading lists.

  2.  **Deconstruct the "Cluelessness" Argument:**
      *   *Standard Form:* Action A has near-term consequences $N$ and far-term consequences $F$. We know $N$. We don't know $F$. If $E[F] \approx 0$ (due to symmetry/ignorance), then $E[A] \approx N$. If $E[F]$ is undefined or infinite, decision theory breaks.
      *   *User's Modification:* $E[F]$ is not zero because ratchets create directional bias. Therefore, $F$ matters.
      *   *The Crucial Pivot:* The user thinks the objection relies on $E[F] = 0$. But the stronger objection is usually about the *variance* or the *definition* of the distribution, not just the mean.

  3.  **Evaluate the User's Two Worries:**
      *   *Worry 1 (Symmetry of Ratchets):* If I create a ratchet, do I know if it's good or bad? If I found an institution, is it more likely to be a force for good or evil in 500 years? If I'm clueless about the *valence* of the ratchet, the symmetry returns at a higher level.
      *   *Worry 2 (Indeterminacy):* This is the stronger philosophical objection. If I can't assign probabilities (Knightian uncertainty), expected value maximization is undefined. It doesn't matter if the mean is non-zero if the mean itself is unknowable.

  4.  **Identify the "Third Problem" (The Fatal Defeater):**
      *   *The "Tiny Probability, Huge Impact" Problem (Pascal's Mugging variant):* Even if ratchets exist, the causal chain is so long and chaotic that the probability of *my specific act* causing a specific ratchet is vanishingly small, while the magnitude is vanishingly large.
      *   *The "Butterfly Effect" Reversal:* If the future is sensitive to initial conditions (chaos theory), then *everything* is a ratchet, but we can't trace which way. If the future is *not* sensitive (stable), then ratchets matter, but small acts don't trigger them.
      *   *The Real Killer:* **Correlation vs. Causation in the Long Run.** Even if ratchets exist, can *I* reliably identify which act triggers a positive ratchet vs. a negative one *ex ante*? If I can't distinguish Act A (positive ratchet) from Act B (negative ratchet) due to complexity, then *for the agent*, the symmetry returns epistemically, even if not ontologically. The cluelessness objection is epistemic, not ontological. The user is arguing about ontology (ratchets exist); the objection is about epistemology (you can't know which ratchet you're pulling).

  5.  **Address the "Maximize EV Relative to Evidence" Reply:**
      *   This is the "Subjective Expected Utility" defense.
      *   *Is it a solution?* It dissolves the normative anxiety ("I did the best I could").
      *   *Is it a change of subject?* It sidesteps the "guidance" problem. Consequentialism is often sold as a guide to *what to do*, not just a justification for *what you did*. If the evidence is too thin to distinguish acts, the theory says "pick either," which feels like "no advice."
