answer: |-
  You have correctly identified a weak spot in the casual formulation of the cluelessness argument, but you may be misdiagnosing the structural load-bearing wall. Your "ratchet" argument successfully attacks *ontological symmetry* (the idea that the future is actually a coin flip). However, the cluelessness argument survives because it relies on *epistemic symmetry* (the idea that *your evidence* treats it as a coin flip).

  Here is the stress test, ranking the defeaters from fatal to awkward, followed by the specific replies you requested.

  ### The Defeaters (Ranked)

  **1. The Epistemic Symmetry Defeater (Fatal)**
  This is the problem you are missing, and it is more damaging than the two you worried about.
  You argue that ratchets make the long-run expected value (EV) non-zero *ontologically*. You are likely right. The future is not a random walk; it has drift.
  However, consequentialism is a decision procedure for agents. For the theory to generate advice, *you* must be able to distinguish Act A (which triggers a positive ratchet) from Act B (which triggers a negative ratchet).
  The cluelessness argument does not require that the universe is symmetric; it requires that *your credence distribution* is symmetric. Even if ratchets exist, if you cannot predict *which* of your available acts engages a positive ratchet versus a negative one, then relative to your evidence, the EVs wash out.
  *   **Example:** You found an institution. It is a ratchet; it will last 500 years. But do you know if it will function like the Red Cross or the Inquisition? If your evidence doesn't let you distinguish the valence of the ratchet *ex ante*, then for the purpose of decision-making, the symmetry holds. You have relocated the coin flip from "will effects persist?" to "will the persistent effects be good?" without giving yourself a lever to control the outcome.
  *   **Sympathetic Concession:** A defender of your view must concede that ratchets only help if they are *identifiable* as positive ratchets before you pull them. If "ratchets point up" is a general claim but you can't identify specific up-ratchets, the guidance collapses.
  *   **Wave Off:** They might try to argue that "common sense" identifies up-ratchets (e.g., "saving lives is always a positive ratchet"). But this invites the counter that saving lives increases population pressure which causes collapse—a standard cluelessness recursion.

  **2. The Indeterminacy Defeater (Severe)**
  This is your second worry, and it is stronger than the first worry (symmetry of ratchets) but weaker than the epistemic problem above.
  If the causal chain is chaotic, it's not just that the mean is unknown; it's that the probability distribution is undefined (Knightian uncertainty). Expected Value theory requires a probability distribution. If the system is too complex to model, assigning *any* specific probability (even a symmetric one) is arbitrary.
  *   **Why it beats your view:** Your view assumes we can treat the ratchet as a variable with a non-zero mean. If the indeterminacy is radical, we can't even assign a mean. The math breaks, not just the balance.
  *   **Sympathetic Concession:** A defender must concede that "ratchets" implies a degree of stability/predictability. If the world is too chaotic for ratchets to be reliable, the mechanism fails.
  *   **Wave Off:** They might argue that "rough and ready" probabilities are all decision theory ever uses, so radical indeterminacy is a philosopher's fantasy. But in the long-run context, the "rough and ready" margin of error is larger than the expected value itself.

  **3. The Ratchet Symmetry Defeater (Awkward but Survivable)**
  This is your first worry. Are good ratchets balanced by bad ones?
  *   **Verdict:** This is empirically contestable, which makes it less damaging philosophically. You can argue that entropy makes bad ratchets easier (decay is natural, order is hard) or that moral progress is real.
  *   **Why it's lower rank:** Even if ratchets are symmetric in valence, if you can identify the *good* ones (see Defeater 1), you win. If you can't identify them, the symmetry of the ratchets doesn't matter. The identification problem swallows the valence problem.

  ### The "Maximize EV Relative to Evidence" Reply

  You asked if this is a solution or a change of subject.
  **It is a change of subject that saves the theory from contradiction but admits it offers no guidance.**

  *   **The Move:** This reply shifts consequentialism from an *objective* standard (do the act that actually produces the best outcome) to a *subjective* standard (do the act that seems best given your evidence).
  *   **Why it undercuts the debate:** If the standard is "maximize relative to evidence," then the cluelessness objection technically fails. You *did* maximize EV relative to your evidence, even if the evidence was garbage. You are blameless.
  *   **The Cost:** This sacrifices the *action-guiding* power of the theory. If my evidence is too thin to distinguish Act A from Act B, the theory says "Indifference." If the theory says "Indifference" on all high-stakes long-term questions, it has functionally collapsed into the "silence" moral that the cluelessness argument originally predicted.
  *   **For your version:** This reply hurts you. Your claim is that the long-run EV *is* computable (non-zero). If the reply is "just use your evidence," and your evidence is still too weak to pin down the ratchet direction, you haven't gained any decision-making power. You've just secured a "blameless" verdict for guessing wrong.

  ### The Unfalsifiability Problem

  You asked: *If "the ratchets point up" is compatible with almost any evidence... do I have a testable position?*

  **Yes, this is a problem, and it is fatal to the claim's utility.**

  *   **The Trap:** If you claim "Act A is good because it triggers a positive ratchet," but the ratchet effects are "mostly invisible" and centuries away, you cannot verify the claim within a timeframe that allows for learning.
  *   **Why it matters:** A normative theory that relies on empirical claims must allow for feedback. If you cannot distinguish a successful ratchet-pull from a failed one until after you are dead (or civilization has collapsed), you cannot optimize your strategy.
  *   **Unfalsifiability vs. Normativity:** If the claim is unfalsifiable in practice, it functions as a faith commitment, not an empirical premise. If it is a faith commitment, it cannot resolve the cluelessness objection for a skeptic, because the skeptic denies the faith.
  *   **Sympathetic Concession:** You must concede that for this to work as *advice*, there must be *proxies* for ratchets that are visible in the near term. If there are no near-term indicators of long-term ratchet valence, your position is practically inert.
  *   **Wave Off:** You might argue that some ratchets are visible (e.g., extinction is final). But this limits your view to negative utilitarianism (avoiding ruin) rather than positive optimization. You can say "don't nuke the world," but you can't say "fund this specific AI lab."

  ### Is the Symmetry Premise Load-Bearing?

  You want to know if the argument survives your denial of symmetry. **Yes, it does.**

  The cluelessness argument does not rest on the premise that *outcomes* are symmetric. It rests on the premise that *credences* are symmetric (or undefined).

  *   **Your Claim:** The universe has drift (ratchets).
  *   **Cluelessness Counter:** You don't know the direction of the drift.
  *   **Result:** For the agent, the EV is still washed out.

  The symmetry premise usually stated ("effects wash out") is a shorthand for "our *expectation* of effects washes out." You have attacked the literal interpretation (the effects themselves), but the argument relies on the epistemic interpretation (our knowledge of the effects).

  **The Third Problem (The "Signal-to-Noise" Ratio)**
  Here is the damaging problem I alluded to in Defeater 1, formalized:
  Even if ratchets exist and are asymmetric, the **signal-to-noise ratio** of your specific act is too low.
  *   There are millions of agents acting.
  *   There is massive environmental chaos.
  *   Even if you pull a "positive ratchet," how do you know your pull was the cause, rather than background trends?
  *   If you cannot isolate your causal contribution, you cannot claim the EV of the ratchet.
  *   This returns you to cluelessness not because the future is symmetric, but because *your agency* is diluted.

  ### Summary of Stress Test

  1.  **Fatal:** **Epistemic Symmetry.** You proved the future isn't a coin flip; you didn't prove you can predict the flip. Without prediction, the EV is still undefined *for you*.
  2.  **Severe:** **Indeterminacy.** If probabilities are undefined, EV maximization is a category error, regardless of ratchets.
  3.  **Awkward:** **Ratchet Valence.** Good vs. Bad ratchets might balance, but this is secondary to knowing which is which.
  4.  **Unfalsifiability:** If you can't measure ratchet success, you can't optimize for it. This reduces your view to a faith claim, which doesn't solve the normative problem for a skeptic.
  5.  **"Maximize EV" Reply:** This saves the theory from contradiction but admits it provides no discrimination between acts in high-cluelessness scenarios.

  **Conclusion:** Your "ratchet" insight saves Consequentialism from the claim that the future is *ontologically* random. It does not save it from the claim that the future is *epistemically* opaque. Since Consequentialism is a guide for action, epistemic opacity is the only one that matters. You have solved a metaphysical problem that wasn't doing the heavy lifting, while leaving the epistemological problem untouched.
