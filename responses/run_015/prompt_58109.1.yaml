prompt: |-
  hey so I'm TA-ing this intro epistemology section and the week on stakes and knows always dies, everyone just nods along. I wanna make a little which camp are you really in quiz they can do in like 15 mins to start an arguement.

  Can you write me 7 questions, each one is a mini story with 2-3 gut-reaction answers, totally no jargon in the questions themselves. Like don't ever ask do you endorse contextualism, I want you to sort them by their reactions not by which label they think sounds cool.

  At the end I need a scoring key that puts answer patterns into these 4 buckets I have to cover: 1) stakes never change whether someone knows, 2) the stakes for the person doing the knowing can change whether they know, 3) the stakes/context of the person *talking* about knowing can change whether its true to say they know, 4) knowledge stays put but what its ok to say or do with it shifts with stakes.

  Build it from the logical space first — like what combinations of answers are even possible — then tell me where my 4 buckets live in that space. If theres a combo that no one actually defends tell me if you think its incoherent or just unexplored, and be honest if your quiz can't really seperate any two of my buckets.

  You gotta work in these two stories I came up with, you can tweak the details:

  Maya at the campus cafe: low version is she overhears the soup has no peanuts and tells a regular who just doesn't like the taste, high version is same evidence but she's telling a parent ordering for a kindergarten field trip where one kid has a deadly allergy. Does she know its safe in each?

  And the surgeon one: Luis double-checked the chart once and is pretty sure its the left knee. Case X is two friends gossiping about it over beers the night before, case Y is the hospital review board deciding whether to say Luis knew it was the left knee. Same facts about Luis, different talkers.

  Audience is non-majors who have never heard of this stuff, so keep it plain and a bit funny if you can.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 15-minute "Which camp are you really in?" quiz for an intro epistemology section on "Stakes and Knowledge."
      *   **Problem:** Students nod along but don't engage/argue. The quiz needs to spark debate.
      *   **Constraints:**
          *   7 questions total.
          *   Mini-stories with 2-3 gut-reaction answers.
          *   **NO JARGON** in questions (no "contextualism," "invariantism," etc.).
          *   Must include two specific stories: Maya (Cafe/Allergy) and Luis (Surgeon/Knee).
          *   Scoring key must sort students into 4 specific buckets:
              1.  Stakes *never* change knowledge (Traditional Invariantism).
              2.  Stakes for the *knower* change knowledge (Subject-Sensitive Invariantism/Pragmatic Encroachment).
              3.  Stakes/context of the *speaker* change truth of "knows" (Contextualism).
              4.  Knowledge stays put, but action/assertion norms shift (Impurism/Warranted Assertibility Maneuver - though the prompt describes it as "knowledge stays put but what its ok to say or do with it shifts").
          *   **Crucial Step:** Build from logical space first. Map the combinations of answers to the 4 buckets. Identify incoherent/unexplored combos. Be honest about limitations (can the quiz actually distinguish all 4?).
          *   **Tone:** Plain English, non-majors, a bit funny.

  2.  **Deconstruct the 4 Buckets (Theoretical Mapping):**
      *   *Bucket 1 (Strict Invariantism):* Knowledge depends *only* on truth, belief, and justification (evidence). Stakes don't matter for *knowing*, nor for *saying* you know (unless you're lying).
      *   *Bucket 2 (SSI/Pragmatic Encroachment):* High stakes for the *subject* (Maya/Luis) can destroy knowledge even if evidence is the same.
      *   *Bucket 3 (Contextualism):* Knowledge doesn't change in the subject, but the *word* "knows" changes meaning/truth conditions based on the *speaker's* context (the gossip vs. the review board).
      *   *Bucket 4 (WAM/Action-First):* Subject *knows* in both cases, but it's irresponsible to *act* or *claim* knowledge in high stakes. (Knowledge is stable, norms of action/assertion vary).

      *Differentiation Challenge:*
      *   Bucket 1 vs. Bucket 4: Both say knowledge is stable. Bucket 1 says you can say/act on it freely (maybe with caution). Bucket 4 says you *know* it, but shouldn't bet the farm on it. This is the hardest distinction to capture in a gut-reaction quiz.
      *   Bucket 2 vs. Bucket 3: Both say "S knows that p" can be false in high stakes. Bucket 2 says it's false because of *Subject's* stakes. Bucket 3 says it's false because of *Speaker's* stakes.
      *   *The Luis Case is key for 2 vs 3.* In Luis's case, the *subject's* stakes (medical error) are constant. The *speaker's* stakes change (gossip vs. review board).
      *   *The Maya Case is key for 1/2/4.* In Maya's case, the *subject's* stakes change (taste vs. allergy).

  3.  **Logical Space & Question Design:**
      *   I need questions that probe:
          *   Does evidence alone determine knowledge? (Maya Low vs. High)
          *   Does the speaker's situation matter? (Luis Gossip vs. Board)
          *   Can you know but not act? (Distinguishing Bucket 1/2 from Bucket 4).

      *   *Drafting the 7 Questions:*
          *   Q1: Maya Low (Baseline).
          *   Q2: Maya High (Subject Stakes). -> Distinguishes 1/4 from 2.
          *   Q3: Luis Gossip (Speaker Low).
          *   Q4: Luis Board (Speaker High). -> Distinguishes 1/2/4 from 3.
          *   Q5: Action Norms (Maya High). If she doesn't know, can she act? If she knows, should she act? -> Distinguishes 4 from 1.
          *   Q6: Retraction/Apology. If Maya says "I know" in Low, then finds out High stakes existed, does she take it back? -> Helps 3 vs 2.
          *   Q7: The "Bet" Question. Would you bet your lunch on it? -> Practical intuition.

      *   *Refining for the Prompt's Constraints:*
          *   Need to ensure the scoring key actually works.
          *   Need to identify the "Logical Space" first in the output.

  4.  **Mapping the Logical Space (Mental Check):**
      *   Let $K$ = Subject Knows.
      *   Let $S_{sub}$ = Subject Stakes.
      *   Let $S_{spk}$ = Speaker Stakes.
      *   Let $A$ = Appropriate to Act/Assert.

      *   *Bucket 1 (Invariantist):* $K$ is independent of $S_{sub}$ and $S_{spk}$. $A$ generally follows $K$.
      *   *Bucket 2 (SSI):* $K$ depends on $S_{sub}$. High $S_{sub}$ = No $K$. $S_{spk}$ irrelevant to $K$.
      *   *Bucket 3 (Contextualist):* $K$ (as expressed) depends on $S_{spk}$. $S_{sub}$ irrelevant to truth of sentence (mostly).
      *   *Bucket 4 (WAM/Impurist):* $K$ is independent. $A$ depends on stakes. (You know, but don't say/act).

      *   *Differentiation Problem:* Bucket 1 and Bucket 4 look identical on "Does she know?" questions. They only split on "Is it okay to say/act?" questions. I need to make sure Q5/Q6 hammer this.
      *   *Differentiation Problem:* Bucket 2 and Bucket 3 both say "The sentence 'She knows' is false in high stakes." They split on *why*. Maya cases test Subject stakes (favors 2). Luis cases test Speaker stakes (favors 3).

  5.  **Drafting the Content:**
      *   *Tone:* Keep it light. "Soup," "Knees," "Gossip."
      *   *Answers:* Need to force a choice. "Yes/No" isn't enough. Need "Yes, because..." or "No, but..."
      *   *Scoring:* Needs to be simple enough for a TA to tally quickly.

  6.  **Addressing the "Honesty" Requirement:**
      *   I must admit that Bucket 1 (Strict Invariantism) and Bucket 4 (Knowledge Norms Shift) are *very* hard to separate with a gut-reaction quiz. Philosophers fight about this for pages. Non-majors will conflate "I know" with "I'm sure enough to bet." I need to flag this limitation.
      *   I also need to check if any combos are incoherent. E.g., "Speaker stakes change knowledge, but Subject stakes don't" is Contextualism. "Subject stakes change knowledge, but Speaker stakes don't" is SSI. Is there a "Both change it" view? Yes, some hybrid views. Is there a "Neither change it, but action does"? Yes (Bucket 4).

  7.  **Finalizing the Questions (incorporating Maya & Luis):**
      *   Q1: Maya (Low Stakes). Does she know?
      *   Q2: Maya (High Stakes). Does she know? (Compare to Q1).
      *   Q3: Maya (High Stakes). Should she tell the parent? (Action norm).
      *   Q4: Luis (Gossip). Do the friends know?
      *   Q5: Luis (Board). Does the Board know? (Same evidence, different speakers).
      *   Q6: The "Takeback." Maya says "I know" in Low. Later learns about Allergy. Was she lying?
      *   Q7: The Wallet. Would you bet $50 vs $5000 on the soup?

  8.  **Constructing the Scoring Key:**
      *   Need to map patterns.
      *   *Bucket 1 (Pure Invariantist):* Knows in all cases. Act in all cases (maybe).
      *   *Bucket 2 (SSI):* Knows in Low, Doesn't Know in High (Maya). Speaker context (Luis) doesn't matter.
      *   *Bucket 3 (Contextualist):* Maya stakes don't change *her* knowledge, but Speaker context (Luis) changes truth of "We know." (Wait, Contextualism usually says the *attributor's* context matters. So in Luis case, Friends can truthfully say "Luis knows," Board cannot truthfully say "Luis knows." This is subtle. I need to phrase Q4/Q5 carefully to reflect *attributor* context).
      *   *Bucket 4 (WAM):* Knows in all cases (Maya). But shouldn't act in High.

      *Self-Correction on Contextualism:* Contextualism says the truth of "S knows" depends on the *speaker's* context. So for Luis:
      *   Friends (Low stakes): "Luis knows" is True.
      *   Board (High stakes): "Luis knows" is False.
      *   For Maya (Subject stakes change): Contextualists usually say Subject stakes don't matter *unless* they shift the speaker's context. But SSI says Subject stakes matter directly.
      *   *Quiz Design:* I need to make sure the Luis question asks about the *speakers* claiming knowledge, not Luis himself.
      *   *Quiz Design:* I need to make sure the Maya question asks about *Maya* knowing, where *Maya's* stakes change.

  9.  **Review against Constraints:**
      *   7 Questions? Yes.
      *   Mini-stories? Yes.
      *   No jargon? Yes.
      *   Scoring key for 4 buckets? Yes.
      *   Logical space analysis included? Yes.
      *   Honesty about limitations? Yes.
      *   Maya/Luis stories included? Yes.

  10. **Final Polish:** Ensure the tone is engaging for undergrads. Make the scoring key usable (e.g., "Mostly As," "Mostly Bs"). Actually, a pattern match is better. I'll create a simple tally system.

      *(Self-Correction during drafting)*: Wait, distinguishing Bucket 1 and Bucket 4 is genuinely tough. Bucket 1 says "You know, go ahead." Bucket 4 says "You know, but don't go ahead." In a gut reaction quiz, students who pick Bucket 4 often *feel* like they don't know. I need to explicitly ask "Does she *know*?" separate from "Should she *act*?" to catch Bucket 4.

      Let's refine the Logical Space section to be very clear about this overlap.

      *Plan:*
      1. Logical Space Analysis (The "Under the Hood" stuff).
      2. The Quiz (7 Questions).
      3. The Scoring Key (Mapping answers to buckets).
      4. TA Notes (Limitations & Discussion tips).

      *Let's write it.*
answer: |-
  Here is the logical breakdown, the quiz, and the scoring key, designed to get your students arguing within 15 minutes.

  ### Part 1: The Logical Space (For Your Eyes Only)

  Before you hand this out, here is the map of the territory. You asked for honesty about where the lines blur, so here it is.

  We are testing two variables:
  1.  **Subject Stakes:** Does it matter how much it costs *the person with the belief* if they are wrong? (The Maya Case)
  2.  **Attributor Stakes:** Does it matter how much it costs *the person talking about the knowledge* if they are wrong? (The Luis Case)

  Here is where your 4 buckets live in that space:

  *   **Bucket 1 (Strict Invariantism):** Knowledge is pure. It never moves.
      *   *Subject Stakes:* Irrelevant.
      *   *Attributor Stakes:* Irrelevant.
      *   *Action:* If you know, you can act.
  *   **Bucket 2 (Subject-Sensitive/Pragmatic Encroachment):** Knowledge is fragile. High stakes for the *subject* break knowledge.
      *   *Subject Stakes:* **Relevant.** (Maya High = No Knowledge).
      *   *Attributor Stakes:* Irrelevant. (Luis Board = Same truth as Luis Friends).
  *   **Bucket 3 (Contextualism):** Knowledge is a shapeshifter. The word "knows" changes meaning based on who is *speaking*.
      *   *Subject Stakes:* Irrelevant (usually).
      *   *Attributor Stakes:* **Relevant.** (Luis Friends = True; Luis Board = False).
  *   **Bucket 4 (Warranted Assertibility/WAM):** Knowledge is stable, but *responsibility* moves.
      *   *Subject Stakes:* Irrelevant to *knowing*, **Relevant** to *acting*.
      *   *Attributor Stakes:* Irrelevant to *knowing*, **Relevant** to *saying*.
      *   *The Trap:* Bucket 1 and Bucket 4 give the exact same answers to "Does she know?" They only split on "Should she act/say it?" **This quiz struggles to separate 1 and 4 perfectly** because non-majors often conflate "I know" with "I'm sure enough to bet." I have built Question 5 and 7 specifically to try to pry them apart, but warn your students that philosophers fight about this distinction too.

  ***

  ### Part 2: The "Do You Actually Know That?" Quiz

  **Instructions:** Read the scenarios. Pick the answer that feels right in your gut. Don't overthink it, and don't try to guess what a philosopher would say.

  **1. Maya at the Cafe (The Lunch Order)**
  Maya overhears the chef say, "The soup has no peanuts." She tells a regular customer, Dave, who just hates the taste of peanuts.
  *   **A)** Yes, Maya knows it's peanut-free. She heard the chef.
  *   **B)** No, she didn't check the ingredients list herself. She just has a good guess.
  *   **C)** She knows enough for lunch, but not enough for anything serious.

  **2. Maya at the Cafe (The Field Trip)**
  Same scene. Maya overhears the chef say, "The soup has no peanuts." But now she is telling a parent ordering for a kindergarten field trip where one kid has a **deadly** peanut allergy.
  *   **A)** Yes, she still knows. The evidence (hearing the chef) didn't change.
  *   **B)** No, she doesn't *know* anymore. The risk is too high to say she knows.
  *   **C)** She knows it's true, but she shouldn't tell the parent it's safe.

  **3. The "Take-Back" (Maya)**
  Imagine Maya told Dave (the regular from Q1) that she *knew* the soup was safe. Later, she finds out there was a kid with a deadly allergy in the building that day (even though Dave wasn't allergic).
  *   **A)** She should apologize. She shouldn't have claimed to "know" something that important without checking.
  *   **B)** She doesn't need to apologize. At the time, for Dave, she did know.
  *   **C)** She was lying, technically.

  **4. Luis the Surgeon (The Bar Tab)**
  Luis double-checked the chart once and is pretty sure it's the left knee. Two friends are gossiping about him over beers the night before the surgery.
  *   **A)** The friends can truthfully say, "Luis knows which knee it is."
  *   **B)** The friends are being reckless. Nobody *knows* until the scalpel cuts.
  *   **C)** It depends on how much they care about Luis's career.

  **5. Luis the Surgeon (The Review Board)**
  Same facts. Luis double-checked once. Now, the Hospital Review Board is deciding whether to write in the official record that "Luis knew it was the left knee" before he operated.
  *   **A)** Yes, write it down. He had the same evidence as in the bar story.
  *   **B)** No, don't write it. In an official review, that's not enough evidence to count as "knowledge."
  *   **C)** He knew it, but the Board shouldn't certify it because it's too risky.

  **6. The Wallet Test**
  You have the same evidence Maya has (you heard the chef).
  *   **Scenario A:** I bet you $5 the soup has no peanuts.
  *   **Scenario B:** I bet you $5,000 the soup has no peanuts.
  *   **A)** I take both bets. If I know it, I know it.
  *   **B)** I take Bet A, but not Bet B.
  *   **C)** I don't take either bet. Hearing a chef isn't proof.

  **7. The "Good Enough" Check**
  In the High Stakes Maya case (the allergy kid), suppose Maya tells the parent "It's safe" and the kid eats it and is fine.
  *   **A)** Maya was responsible. She knew what she was doing.
  *   **B)** Maya was lucky. She shouldn't have acted even if she was right.
  *   **C)** Maya knew it, so she was fine to act.

  ***

  ### Part 3: The Scoring Key (For the TA)

  Have students tally their answers. This isn't a perfect math equation, but it sorts them into the four philosophical camps based on their intuitions.

  **Bucket 1: The "Facts Are Facts" Crowd (Traditional Invariantism)**
  *   **Pattern:** Mostly **A**s.
  *   **Specifics:** Q2=A (Maya knows in high stakes), Q5=A (Board should say Luis knows), Q7=C (She knew, so action was fine).
  *   **Philosophy:** Knowledge depends *only* on evidence and truth. Stakes are irrelevant. If you have the evidence, you know, and you can act.
  *   **Debate Prompt:** "If you say Maya 'knew' in the allergy case, are you saying it was okay for her to risk a kid's life on a overheard comment?"

  **Bucket 2: The "Stakes Break Knowledge" Crowd (Subject-Sensitive Invariantism)**
  *   **Pattern:** Q2=B (Maya doesn't know in high stakes), Q5=A (Board/Luis friends agree on truth).
  *   **Specifics:** They think the *Subject's* risk changes whether they know (Maya), but the *Speaker's* risk doesn't (Luis).
  *   **Philosophy:** Practical stakes encroach on knowledge. High risk for the believer destroys knowledge even if evidence stays the same.
  *   **Debate Prompt:** "Did Maya's evidence disappear when the allergy kid walked in? If the evidence is the same, how does the knowledge vanish?"

  **Bucket 3: The "It Depends Who's Talking" Crowd (Contextualism)**
  *   **Pattern:** Q2=A (Maya still knows), Q5=B (Board says Luis *doesn't* know, Friends say he *does*).
  *   **Specifics:** They think Subject stakes don't change knowledge (Maya), but the *Speaker's* context changes the truth of the sentence (Luis).
  *   **Philosophy:** The word "knows" is like "tall." Luis is "tall" for a friend group, but not "tall" for the NBA. He "knows" for the friends, but not "knows" for the Board.
  *   **Debate Prompt:** "So if the Board walks into the bar, do the friends suddenly stop telling the truth when they say 'Luis knows'?"

  **Bucket 4: The "Know It, Don't Say It" Crowd (Warranted Assertibility)**
  *   **Pattern:** Q2=C or A (She knows), Q3=A (She should apologize/shouldn't have acted), Q7=B (She was lucky, not responsible).
  *   **Specifics:** They insist the subject *knows* (like Bucket 1), but say it's irresponsible to *act* or *assert* it in high stakes (unlike Bucket 1).
  *   **Philosophy:** Knowledge is one thing; being allowed to bet your life on it is another. You can know something but not be rational to act on it.
  *   **Debate Prompt:** "What is the point of 'knowing' if you aren't allowed to act on it? Is that just a fancy word for 'guessing'?"

  ***

  ### Part 4: TA Cheat Sheet (Limitations & Incoherence)

  **1. The Bucket 1 vs. Bucket 4 Blur**
  *   **The Issue:** As noted in the logical space, Bucket 1 and 4 both claim Knowledge is stable. They only differ on *Action Norms*.
  *   **In the Quiz:** If a student marks Q2=A (She knows) and Q7=B (She was lucky/irresponsible), they are Bucket 4. If they mark Q2=A and Q7=C, they are Bucket 1.
  *   **Honesty Check:** Many students will mark Q2=A and Q7=B but *feel* like they are in Bucket 2. They will say "Well she doesn't *really* know." Push them: "If she doesn't know, why did you say 'Yes' in Q2?" This tension is where the philosophy happens.

  **2. The "Unexplored" Combo**
  *   **Combo:** Subject Stakes Matter (Maya High = No Know) AND Attributor Stakes Matter (Luis Board = No Know).
  *   **Verdict:** This is a **Hybrid View**. It's not incoherent, but it's messy. If a student picks Q2=B (Maya doesn't know) AND Q5=B (Board can't say Luis knows), they are a "Double-Contextualist" or Hybrid.
  *   **Discussion:** Ask them: "Is knowledge fragile everywhere? Or is it just sensitive to whoever is holding the hot potato?"

  **3. The "Incoherent" Combo**
  *   **Combo:** Attributor Stakes Matter (Luis), but Subject Stakes Don't (Maya), YET they say Maya shouldn't act (Q7=B).
  *   **Verdict:** This is basically Bucket 3 + Bucket 4. It's defensible but complicated.
  *   **Discussion:** This student thinks "Knowledge" is about the speaker (Luis), but "Action" is about the risk (Maya). This is actually a very sophisticated position. Don't tell them they're wrong; ask them to define what "Knowledge" is good for if it doesn't guide action.

  **4. How to Start the Argument**
  *   Find a Bucket 1 and a Bucket 2. Put them together.
  *   **Ask Bucket 1:** "Why is it okay for Maya to risk a life on an overheard comment?"
  *   **Ask Bucket 2:** "At what exact dollar amount does Maya stop knowing? If the bet is $5.01 does she know, but at $5.02 she doesn't?"
  *   **Find a Bucket 3 and a Bucket 4.**
  *   **Ask Bucket 3:** "Does Luis's brain change when the Review Board walks in?"
  *   **Ask Bucket 4:** "If you know it, why are you a coward for betting on it?"

  This setup forces them to defend the *intuition* rather than the *label*, which is exactly where you want them. Good luck!
