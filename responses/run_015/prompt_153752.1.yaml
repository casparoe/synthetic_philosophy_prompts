answer: |-
  This is an exceptionally sharp methodological observation. You have identified a specific failure mode in comparative-historical inference that sits at the intersection of the philosophy of science, statistical reasoning, and historiography.

  To answer your primary question directly: **There is no single, standardized term in the existing literature that captures this precise asymmetry.** While the component mechanisms are well-documented, their specific combination—outcome-contingent, one-directional tightening of reference-class boundaries to preserve a base rate—does not have a dedicated label.

  However, the pattern you describe is a composite of three established concepts. Understanding why existing terms are *near* but not *exact* matches will help us arrive at a precise coinage for your work.

  ### 1. The Nearest Existing Analogues

  **A. The "No True Scotsman" Fallacy (Informal Logic)**
  *   **The Match:** This fallacy occurs when a universal claim ("No empire with features $X, Y, Z$ survives") is met with a counter-example ("Rome survived"), and the defender modifies the subject ("No *true* empire with $X, Y, Z$ *and lacking resilience W* survives") to exclude the counter-example.
  *   **The Gap:** The fallacy is typically discussed as a rhetorical move in argumentation. Your observation is structural: it operates at the level of *sample construction* and *base-rate calculation* within a research program, not just a single argument. Furthermore, the "No True Scotsman" does not inherently specify the *asymmetry* you note (i.e., not applying the same exclusion logic to the negative cases).

  **B. Selection on the Dependent Variable (Comparative Method)**
  *   **The Match:** Barbara Geddes's seminal critique warns against selecting cases based on the outcome (e.g., studying only revolutions to understand the causes of revolution). Your described pattern is a dynamic, post-hoc version of this. By excluding survivors from the reference class *because* they survived, scholars are effectively ensuring the reference class is constituted by the outcome it is supposed to predict.
  *   **The Gap:** Standard "selection on the dependent variable" usually refers to the initial selection of cases for a study. Your pattern describes a *retrospective reclassification* of cases within an established reference class. It is a form of **endogenous sample selection** triggered by predictive failure.

  **C. Immunizing Stratagem (Lakatosian Philosophy of Science)**
  *   **The Match:** Imre Lakatos described how research programmes protect their "hard core" (the central theory) by adjusting the "protective belt" (auxiliary hypotheses). Treating the "hidden structural feature" as an auxiliary hypothesis that excludes the survivor is a classic immunizing move.
  *   **The Gap:** Lakatos focuses on theoretical adjustments. Your insight is that the adjustment is applied to the *population definition* (the reference class) rather than the causal mechanism. The theory ("$X, Y, Z$ causes collapse") remains unchanged; the *domain of applicability* is shrunk to exclude the falsifying instance.

  ### 2. Proposed Coinage: Asymmetric Reference Class Immunization (ARCI)

  Given the gap in the vocabulary, I propose the term **Asymmetric Reference Class Immunization (ARCI)**.

  This term captures the three critical dimensions you identified:
  1.  **Reference Class:** The manipulation occurs at the level of the statistical population (the "outside view" sample), not just the narrative explanation.
  2.  **Immunization:** The function is to protect the predictive base rate from falsification (Lakatos).
  3.  **Asymmetric:** The boundary adjustment is unidirectional. It tightens around survivors (excluding them) but remains loose around failures (including them), thereby inflating the collapse probability of the "refined" class.

  **Definition:** *ARCI occurs when a predictive model based on historical reference classes maintains its validity following a predictive failure (survival) by retrospectively identifying exclusion criteria that remove the surviving case from the reference class, without applying parallel inclusion/exclusion criteria to the collapsed cases that lacked the identified feature.*

  ### 3. Distinguishing ARCI from Legitimate Historiographical Refinement

  You asked for boundary conditions to distinguish this failure mode from legitimate theory refinement. In comparative history, reference classes *should* be refined as we learn more. The sin is not refinement; it is *biased* refinement.

  Here is a heuristic to distinguish **Legitimate Refinement** from **ARCI**:

  | Feature | Legitimate Refinement | Asymmetric Reference Class Immunization (ARCI) |
  | :--- | :--- | :--- |
  | **Timing of Criterion** | The distinguishing feature ($W$) is identified *independently* of the outcome, or is theoretically prior to the crisis. | The feature ($W$) is identified *post-hoc*, specifically to explain the anomaly (survival). |
  | **Symmetry of Application** | The criterion ($W$) is applied to the **entire** original dataset. Some collapsed cases may also lack $W$ and are thus removed from the class, lowering the base rate. | The criterion ($W$) is applied **only** to survivors. Collapsed cases retaining the "risk features" ($X, Y, Z$) remain in the class even if they also lacked $W$. |
  | **Base Rate Adjustment** | The base rate is recalculated for the *new* class, acknowledging that the risk profile has changed (likely lowered). | The base rate is cited as *confirmed* or preserved, implying the risk remains high for the "true" class, despite the sample shrinking. |
  | **Predictive Utility** | The refined class improves out-of-sample prediction for future cases. | The refined class becomes tautological (a "Zombie Base Rate") that explains the past perfectly but cannot be operationalized for the future without knowing the outcome. |

  ### 4. Why This Matters for Your Field

  In comparative historical sociology, this pattern is particularly insidious because it mimics the rigor of quantitative forecasting (base rates, reference classes) while operating with the flexibility of qualitative interpretation.

  It creates what we might call **"Zombie Base Rates."** These are statistics that appear objective (e.g., "80% of empires with fiscal crisis collapse") but are constituted by a sample that has been silently pruned of its counter-examples.

  **Example of the Distinction:**
  *   **ARCI:** "Ottomans survived fiscal crisis. Therefore, they weren't *really* in the 'Fiscal Crisis' class because they had the *Millet System*. (Do not check if collapsed empires also had Millet-like systems)."
  *   **Legitimate:** "Ottomans survived fiscal crisis. Hypothesis: The *Millet System* confers resilience. Let's code all 50 empires for *Millet-like structures*. We find 10 had it; 8 survived. The base rate for 'Fiscal Crisis + No Millet' is now 95% collapse; for 'Fiscal Crisis + Millet' it is 20%."

  ### 5. Recommendation for Your Work

  If you are incorporating this into your dissertation or a paper, **Asymmetric Reference Class Immunization** is a defensible and precise term. It signals to readers familiar with Tetlock (forecasting), Geddes (selection bias), and Lakatos (philosophy of science) that you understand the genealogy of the error while specifying its unique structural form.

  You might frame it as a specific variant of **Reference Class Tennis** (Tetlock), where the "game" is rigged by allowing one player to redefine the court boundaries only when they are about to lose a point.

  This conceptual clarity allows you to critique the literature not on the grounds of "historical accuracy" (which is often debatable) but on the grounds of **methodological consistency**, which is a much stronger footing for a sociological critique.
