answer: |-
  Here is a teaching plan designed to move her from "naive optimism" to "metaphysical necessity" without bogging down in jargon.

  ### 1. The Sequence: Which Idea First?
  **Start with the Complete Concept of an Individual.**
  Do not start with "striving possibles." If you start with striving, it sounds like little ghosts fighting to be born, which validates her "magic/religion" objection.

  You must establish **logical containment** first. She needs to accept that *you* are not just a body moving through time, but a logical subject that contains all its predicates (past, present, future) as a single package.
  *   **Why:** Once she accepts that "You" = "The sum of every true thing that can be said about You," the transition to "Worlds" becomes a math problem about compatible sets, not a theology problem about God's feelings.

  ### 2. The Concrete Example: The "Tuesday Lie"
  Your instinct is correct, but the execution needs to shift from **Causal** to **Logical**.
  *   **The Trap:** If you argue "If you didn't lie, the weather would change," she will hear "Butterfly Effect" (causal chaos). She will think, "God could have just changed the weather back."
  *   **The Fix:** Frame it as **Identity Consistency**.
      *   *Say this:* "Imagine 'You' are a character in a novel. 'Lying last Tuesday' isn't just an event; it's a line in your character description. If we erase that line, we aren't editing *this* story anymore; we are writing a different book about a different person who looks like you."
      *   *The Constraint:* The example must lack **causal language** (no "ripples," no "dominoes"). Use **narrative language** (plot holes, character consistency, script changes).
      *   *Goal:* Show that a world where "You" exist but "didn't lie" is not a *modified* version of this world; it is a **logically distinct object** that cannot be swapped in.

  ### 3. Misconception Intercepts: When to Stop Them
  Do not let these slide. Stop the conversation immediately when they arise.

  | Misconception | When it will likely hit | How to stop it (The Script) |
  | :--- | :--- | :--- |
  | **"God is picking from a shelf"** | **Right at the start.** She imagines finished worlds (World A, World B) sitting in a row. | **Stop:** "God isn't picking pre-packaged worlds. He's looking at individual concepts (You, Me, The Sun) and calculating which ones *fit together* without contradiction. It's not selection; it's combinatorics." |
  | **"All worlds are physically possible"** | **During the "Tuesday Lie" example.** She will say, "It's physically possible I didn't lie." | **Stop:** "It's physically possible for *you* to not lie. It is **incompossible** for *you-as-defined-in-this-world* to not lie. Distinguish between 'can happen' and 'can happen *to this specific subject*.'" |
  | **"Best means happiest"** | **When explaining why God chose this set.** She will say, "This world has cancer, so it's not the best." | **Stop:** "Best doesn't mean 'most pleasure.' It means 'maximum variety governed by the simplest laws.' A world with no pain might be so simple it's empty. This world is the 'richest' mathematical solution, not the 'nicest' vacation spot." |

  ### 4. What to Openly Refuse to Explain
  **Refuse the Calculus of Variations / Optimization Math.**
  *   **Why:** She took one logic class, not advanced calculus. If you try to explain how God minimizes the "action" of the universe, she will tune out and revert to "it's just religion."
  *   **The Boundary:** "Leibniz actually used early calculus to model this, but the math isn't the point. The point is the **logic of compatibility**. We are talking about puzzle pieces fitting, not computing integrals."
  *   **Also skip:** The deep mechanics of *Monads* (windowless mirrors). It's too much ontology. Stick to *Concepts*.

  ### 5. The Final Check Question
  You need to verify she understands **Incompossibility** (logical incompatibility between substances) and not just **Moral Badness** (some worlds are sad).

  **Ask her this:**
  > "If we create a world where you *didn't* lie last Tuesday, but we keep your parents, your childhood, and your personality exactly the same as they are now... is that world **logically broken**, or is it just **sadder**?"

  *   **Correct Answer (She gets it):** "It's logically broken. That version of me couldn't exist with that exact past." (This confirms she understands Incompossibility).
  *   **Incorrect Answer (She missed it):** "It's not sadder, it would be better." (She is still thinking morally).
  *   **Incorrect Answer (She missed it):** "God could have made it work." (She is still thinking God picks from a shelf).

  ### Summary of the Session Flow
  1.  **Ground Rule:** "We aren't talking about optimism. We are talking about logic."
  2.  **Step 1 (CCI):** You are a concept containing all your truths. (Use the Novel/Script analogy).
  3.  **Step 2 (Incompossibility):** Some concepts clash. You can't have *This You* and *No Lie* in the same set. (Use the Check Question here).
  4.  **Step 3 (The Choice):** God actualizes the set with the most 'stuff' and fewest 'rules.' (Address the "Happiest" misconception here).
  5.  **Close:** "It's not that everything happens for a *good* reason. It's that everything happens for a *sufficient* reason."
