  "My verdicts, restated"
  You reject pure pragmatic bribes (Energy Drink, Ex) where benefits detach from truth. You accept self-fulfilling prophecies where belief causally produces truth (Free Throw). You accept moral obligations where belief constitutes a relationship (Friend). You reject the Demon case despite its truth-link, sensing the mechanism is manipulative rather than genuine. You wonder if this transfers to desires. Your core tension is between Dani's strict evidentialism and your intuition that truth-conducive pragmatism or relational duties might justify belief directly. You seek a principle validating Free Throw and Friend cases without allowing delusion.

  "The principle(s)"
  Candidate 1 (Dani's Evidentialism): Only evidence counts as a reason for belief. Pragmatic factors are reasons to act or cultivate belief, not to believe. This fits Energy Drink, Ex, and Demon, but forces you to reinterpret the Friend and Free Throw cases as reasons to *act* confident, not actually believe.
  Candidate 2 (Your Hybrid): Non-evidential reasons justify belief only if: (1) The belief causally contributes to P's truth through normal agency (Free Throw), OR (2) The belief is constitutive of a moral obligation independent of truth (Friend). Crucially, the benefit cannot be an external reward attached to the mental state (Energy Drink, Demon), even if truth is stipulated. This preserves your gut on the Demon case by distinguishing "natural truth-conduciveness" from "magical stipulation." It treats belief as aiming at truth, but acknowledges some truths are agency-dependent. Regarding desire: wanting to want is instrumental, not constitutive, so it fails Clause 2.

  "Clause by clause"
  Clause 1 (Agency/Truth): Validates the Free Throw. Your confidence alters your physiology/action, making P true. It fails the Energy Drink because believing doesn't make the drink best. It fails the Demon case because the truth isn't caused by your agency or the content's merit, but by a demon's whim; the link is arbitrary, not rational.
  Clause 2 (Constitutive Norms): Validates the Friend case. Trust isn't about evidence weighing; it's about what friendship *is*. To be a friend is to grant credit. This doesn't apply to the Ex case because happiness isn't a constitutive norm of reality.
  Clause 3 (No External Rewards): Excludes Energy Drink and Demon. Even if the Demon ensures truth, the motivation is still a bribe for the mental state. The benefit attaches to the *holding* of the belief, not the *state of affairs* independently. This ensures the reason respects the nature of belief.

  "What I have to give up"
  To keep your Hybrid Principle, you must accept that "reasons for belief" is a slippery category. Dani would argue you're conflating reasons to *believe* with reasons to *cultivate belief*. The cheaper drop is your Friend intuition: accept Dani's view that you have reason to *act trusting* and *avoid accusing*, but not to literally alter your doxastic state without evidence. This simplifies everything: belief aims at truth, period. Pragmatic factors guide action. Alternatively, drop the Demon intuition. Accept your tentative principle: if benefit routes through truth, it counts. This makes the Demon case a "Yes," simplifying the rule but violating your gut feeling that bribes are never reasons for belief.

  "The dad case, plus one case I haven't thought of"
  Dad's Business: This fails Clause 1. Your belief doesn't make the business succeed (ignoring spreadsheets might hurt). It fails Clause 2. Support isn't constitutive of believing the spreadsheets are wrong. It passes Clause 3's exclusion (it's a comfort benefit). Verdict: No reason to believe. Reason to support Dad emotionally without lying to yourself.
  New Case (Placebo): You believe a sugar pill cures headaches. The belief causes the cure. This fits Clause 1 (self-fulfilling via biology). Unlike the Demon, the mechanism is natural. This distinguishes natural causal loops from magical ones. Verdict: Yes, you have a pragmatic reason to believe the pill works, because that belief makes it true.

  "Bottom line"
  Dani is right that belief aims at truth, but you're right that some beliefs help create that truth. Support your dad actively, but don't gaslight yourself about the spreadsheets; confidence helps only when it improves performance, not when it hides reality.
