prompt: |-
  So my friend and I just spent like three hours going back and forth on this and I still don't know what to think. Here's the situation.

  I've been offered this deal by a guy who's kind of a legend in my industry — he's made a bunch of wildly successful bets on people's careers and almost never gets it wrong. He tells me there are two sealed offers on the table. Box A I can see: it's a guaranteed $50,000 job contract. Box B is sealed: it either contains an offer for a $2 million equity package or it's empty. Here's the catch: he already decided whether to put the $2 million in Box B based on what he predicted I would choose. If he predicted I'd take only Box B, he put the $2 million in. If he predicted I'd take both boxes, he left it empty. His track record on predictions like this is something like 99 out of 100. I can either take just Box B, or take both boxes. Whatever's in them is mine.

  My friend says it's obvious: take both boxes. By the time I'm choosing, the money's either there or it isn't — my choice can't change what's already in the box. So taking both strictly dominates: if the $2 million is there, I get $2.05 million instead of $2 million; if it's not there, I get $50k instead of nothing. Either way I'm better off taking both.

  But that feels wrong to me. The guy's predictions are almost perfect. People who take both boxes almost always find Box B empty. People who take just Box B almost always get the $2 million. If I take both, I'm basically guaranteeing I walk away with $50k, whereas if I commit to just Box B, I'm probably walking away with $2 million. The expected value of taking just Box B is way higher.

  My friend says I'm confusing causation and correlation — that my choice doesn't cause the prediction, it's just correlated with it because the predictor is good at reading people, and once I'm standing there deciding, the prediction is in the past. I say that's technically true but practically irrelevant: I want to be the kind of person who ends up with $2 million, and the way to be that person is to take one box.

  I feel like there's something deep here about what rationality even means and we just kept going in circles. Can you help me think through this? And specifically — I'd really appreciate if you could seperate what's actually settled about this kind of problem from what's still genuinely contested among people who think about decision theory seriously. I don't want to walk away thinking there's a consensus when there isn't one, or vice versa.
