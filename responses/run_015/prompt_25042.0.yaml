answer: |-
  You and your friend have stumbled directly into one of the most famous thought experiments in modern philosophy and decision theory. It is called **Newcomb's Problem** (or Newcomb's Paradox), proposed by physicist William Newcomb in 1969 and popularized by philosopher Robert Nozick.

  The reason you feel like you're going in circles is not because you aren't thinking hard enough, but because this problem is designed to expose a fundamental crack in how we define "rationality."

  You asked specifically to separate what is **settled** from what is **contested**. Here is the landscape of the debate as it stands among professional decision theorists and philosophers today.

  ### What Is Settled

  **1. There is no consensus on the solution.**
  This is the most important fact to accept. If you poll professional philosophers who specialize in decision theory, you will not find a unanimous verdict. Surveys (such as the PhilPapers survey) generally show a split, often with a slight lean toward Two-Boxing among academic philosophers, but with a very substantial minority (often nearly half) advocating for One-Boxing. In the "rationalist" and AI safety communities (like LessWrong), the lean is often heavily toward One-Boxing. There is no mathematical proof that settles the dispute because the disagreement isn't about math; it's about the definition of rationality.

  **2. The logical structure of both arguments is sound *within their own frameworks*.**
  *   **Your Friend (Two-Boxing):** Is relying on the **Dominance Principle**. This principle states that if Action A yields a better outcome than Action B in *every possible state of the world*, you should choose Action A. Since the money is already in the box or not, taking both boxes always yields +$50,000 compared to taking one. This logic is impeccable *if* you assume the state of the box is independent of your choice.
  *   **You (One-Boxing):** Are relying on the **Expected Utility Principle**. This calculates the value of a choice based on the probability of outcomes. Given the predictor's 99% accuracy, the probability that Box B contains $2M *given* that you choose only Box B is 0.99. The expected value of One-Boxing ($1.98M) vastly outweighs Two-Boxing ($50k). This logic is impeccable *if* you treat your choice as evidence that updates the probability of the box's content.

  **3. The conflict is between Causal and Evidential reasoning.**
  It is settled that this problem represents a clash between two major decision theories:
  *   **Causal Decision Theory (CDT):** Your friend's view. Rational agents should maximize the *causal* consequences of their actions. Since your choice cannot causally affect the past (the predictor's decision), you should ignore the correlation.
  *   **Evidential Decision Theory (EDT):** Your view. Rational agents should maximize the *news value* of their actions. Your choice provides evidence about what the predictor did. You should act in a way that makes the best news true.

  ### What Is Contested

  This is where the deep philosophical work is still happening.

  **1. What is the correct definition of "Rationality"?**
  This is the core contest.
  *   **The Two-Boxer definition:** Rationality is about making the best move *given the current state of reality*. If you One-Box, you are essentially engaging in magic thinking—believing your choice reached back in time to fill the box. To a CDT proponent, One-Boxers are "leaving money on the table" in scenarios where the prediction *was* wrong (which happens 1% of the time).
  *   **The One-Boxer definition:** Rationality is about being the *kind of agent who wins*. If the goal is to walk away with money, the One-Boxer wins 99% of the time. The Two-Boxer walks away with $50k 99% of the time. As philosopher David Lewis (a famous Two-Boxer) admitted: "The one-boxer gets the million, the two-boxer gets the thousand. But the two-boxer is rational." One-Boxers argue that a definition of rationality that consistently leads to being poorer is a flawed definition.

  **2. Is the scenario metaphysically possible?**
  Some theorists argue the problem is ill-posed because a perfect (or near-perfect) predictor implies a deterministic universe that conflicts with certain notions of free will.
  *   **The Contention:** If you truly have the free will to choose either box at the moment of decision, how could the predictor know beforehand?
  *   **The Counter:** Most decision theorists bracket this metaphysical question. They say, "Assume the predictor is possible (perhaps via advanced simulation of your brain), now what do you do?" But this remains a point of friction for those who believe the setup is incoherent.

  **3. The rise of "Functional Decision Theory" (FDT).**
  This is the newest major development (championed by researchers like Eliezer Yudkowsky and Nate Soares). It attempts to dissolve the paradox.
  *   **The Argument:** FDT argues that you shouldn't think of your decision as a physical act in the present, but as the output of a logical algorithm. The predictor didn't predict *you*; they simulated your *decision algorithm*.
  *   **The Implication:** Your decision *now* and the predictor's decision *then* are logically linked outputs of the same function. Therefore, choosing One Box doesn't "change the past" causally; it determines the logical output of the simulation that happened in the past.
  *   **The Status:** FDT is gaining traction, particularly in computer science and AI alignment, but it is not yet the dominant view in academic philosophy. It supports One-Boxing, but for a different reason than Evidential Decision Theory.

  ### How to Think About It (Without Losing Your Mind)

  Since there is no consensus, you won't find a "correct" answer to tell your friend. However, you can resolve your own stance by asking what kind of framework fits your worldview.

  **1. The "Trust" Heuristic (Real World Application)**
  In the real world, Newcomb problems rarely appear as magic boxes. They appear as **trust and reputation**.
  *   If a business partner knows you are the kind of person who honors verbal agreements even when you could legally screw them over (One-Boxing behavior), they will sign the deal (put the $2M in the box).
  *   If they know you are the kind of person who exploits every loophole (Two-Boxing behavior), they won't sign (Box B is empty).
  *   In this context, your friend's logic fails. You cannot "take both" in a reputation game. You have to *be* a certain type of person to get the opportunity. Most people find One-Boxing intuitively correct here.

  **2. The "Pre-Commitment" Test**
  Ask your friend this: "If you could program a robot to make the choice for you, and the predictor knew the code, what would you program?"
  *   Almost everyone agrees you would program the robot to take **only Box B**.
  *   The contest is: Are *you* different from the robot? If you are rational, should your biological brain behave differently than your programmed code? One-Boxers say no; Two-Boxers say yes, because the robot's code is fixed, but human will is free in the moment.

  ### Summary for Your Conversation

  *   **Tell your friend:** "You are arguing from **Causal Decision Theory**, which is a standard, respected academic position. You are right that my choice doesn't causally change the past."
  *   **Tell them your stance:** "I am arguing from **Evidential Decision Theory** (or Functional Decision Theory). I agree my choice doesn't change the past, but my choice is *correlated* with the past in a way that makes One-Boxing the winning strategy."
  *   **The Bottom Line:** Acknowledge that **there is no settled consensus.** Philosophers have argued this for 50+ years. The "right" choice depends on whether you believe rationality is about **causing good outcomes** (Two-Box) or **being the sort of agent who gets good outcomes** (One-Box).

  If you want the $2 million, you One-Box. If you want to satisfy a specific definition of causal logic, you Two-Box. But you generally don't get to do both.
