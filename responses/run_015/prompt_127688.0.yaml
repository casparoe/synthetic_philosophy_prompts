answer: |-
  # Seminar Activity: The Coherence Market

  **Time:** 90 Minutes
  **Class Size:** 14 Students (7 Pairs)
  **Goal:** Demonstrate the fragility of the Dutch Book argument under realistic constraints (spreads, granularity, caps) and distinguish between Sure Loss, Dutch Strategy, and Probability-1 Loss.

  ## 1. Materials & Setup
  *   **Poker Chips:** 200 total. Two colors (e.g., White = 1 unit, Blue = 5 units).
  *   **Index Cards:** 3 per student (for posting prices).
  *   **Dice:** 2 standard D6.
  *   **Whiteboard:** To track global bankrolls and "Market Rules."
  *   **Handout:** A half-sheet with the "Market Rules" (below) so you don't waste time dictating them.

  **Room Layout:**
  Arrange desks in 7 pairs. Each pair is a "Trading Desk."
  *   **Student A (The Bookie):** Sets prices, holds the "Bank."
  *   **Student B (The Arbitrageur):** Holds a bankroll of 20 White Chips, looks for books.
  *   *Note:* They will swap roles in Round 2.

  ## 2. The Market Rules (Write on Board / Handout)
  1.  **Events:** All bets resolve on a single D6 roll at the end of the round.
      *   $E$: Even (2, 4, 6)
      *   $H$: High (4, 5, 6)
      *   $E \cap H$: Even & High (4, 6)
  2.  **Betting:** A bet pays 1 chip if the event happens, 0 if not.
  3.  **Prices:** Bookies post prices for $E$, $H$, and $E \cap H$.
  4.  **Settlement:** All debts are paid in chips immediately after the die roll.
  5.  **Bankruptcy:** If a Bookie runs out of chips, they are "Ruined" (Game Over for them).

  ---

  ## 3. Timeline & Rounds

  ### 0:00 – 0:10 | Intro & Calibration
  *   **5 min:** Briefly recap the Dutch Book theorem: *If your prices violate probability axioms, I can construct a portfolio of bets that makes you lose for sure.*
  *   **5 min:** Distribute materials. Give Bookies 30 White Chips (their Bank). Give Arbitrageurs 20 White Chips (their Bankroll).
  *   **Instruction:** "Bookies, your goal is to stay solvent. Arbitrageurs, your goal is to guarantee a profit regardless of the die roll. You may write contracts on index cards."

  ### 0:10 – 0:25 | Round 1: The Classic Slaughter (Concept i)
  *   **Rule:** Bookies must post **single point prices** (e.g., $P(E) = 0.5$). They must accept bets on **either side** (buy or sell) at that price. Stakes can be any integer number of chips.
  *   **Action:**
      1.  Bookies write prices on cards, hide them.
      2.  Reveal prices. Arbitrageurs have 5 minutes to calculate a Dutch Book.
      3.  Arbitrageurs place bets (write stake on card, hand chips to Bookie).
      4.  **Roll the Die.** Settle debts.
  *   **Expected Outcome:** Several Bookies will price incoherently (e.g., $P(E) + P(H) > P(E \cup H)$). Arbitrageurs will construct a sure-loss book. Bookies lose chips visibly.
  *   **Pause:** Ask one winning Arbitrageur to show the board why the loss was *guaranteed* before the roll.
  *   **Takeaway:** This is **(i) Sure Loss**. The incoherence is static and exploitable.

  ### 0:25 – 0:55 | Round 2: The Spanner (Spreads, Floors, Caps)
  *   **Rule Change (The Spanner):**
      1.  **Spreads:** Bookies post a **Bid** (max price they buy at) and **Ask** (min price they sell at). They are *not* obligated to trade if the offer is inside the spread.
      2.  **Granularity:** Minimum stake is **1 Chip**. No fractions.
      3.  **Exposure Cap:** An Arbitrageur cannot risk more than **10 Chips** total on any single Bookie.
  *   **Action:**
      1.  **SWAP ROLES.** (Previous Arbitrageurs become Bookies).
      2.  **Instruction to Bookies:** "Set prices that feel reasonable. You may use spreads. You do not need to be perfectly coherent, just 'safe'."
      3.  **Instruction to Arbitrageurs:** "Find the incoherence and exploit it."
      4.  Bookies post Bid/Ask (e.g., Bid 0.45, Ask 0.55).
      5.  Arbitrageurs attempt to build a book.
  *   **The Trap:** Encourage Bookies to set *slightly* incoherent prices that are protected by the spread or granularity.
      *   *Example:* $P(E) = 0.5$, $P(\neg E) = 0.55$. Sum = 1.05. Incoherence = 0.05.
      *   To guarantee 1 chip profit, Arbitrageur needs to stake 20 chips ($20 \times 0.05 = 1$).
      *   **BUT:** The Cap is 10 chips. Max profit = 0.5 chips.
      *   **BUT:** Min stake is 1 chip. You cannot place a bet for 0.5 chips.
      *   **Result:** The Arbitrageur sees the algebraic loss but cannot physically construct the book.
  *   **Outcome:** Most Bookies survive despite being incoherent. Arbitrageurs will be frustrated.
  *   **Takeaway:** The Dutch Book argument fails when transaction costs (spreads), granularity (chips), or liquidity (caps) exist. Coherence is not binary; it is graded by market friction.

  ### 0:55 – 1:10 | Round 3: The Dynamic Trap (Concept ii)
  *   **Rule Change:** Two-Stage Betting.
      1.  **Stage 1:** Bookie posts price for Event $A$ (e.g., "Roll is Even"). Bet is placed.
      2.  **Resolution 1:** Roll the die. Reveal if $A$ happened. **Do not resolve bets yet.**
      3.  **Stage 2:** If $A$ happened, Bookie must post a price for Event $B$ (e.g., "Roll is 4"). Bet is placed.
      4.  **Resolution 2:** Roll is fully revealed. All bets settle.
  *   **Action:**
      1.  Keep roles from Round 2.
      2.  Bookies must commit to a **Conditional Price** for Stage 2 *before* Stage 1 begins (write it on the back of the card).
      3.  Arbitrageurs look for a **Dutch Strategy**: A combination of Stage 1 and Stage 2 bets that loses on every branch, but requires waiting for Stage 1 to know which bet to place.
  *   **Outcome:** If a Bookie sets $P(A)$ and $P(B|A)$ inconsistently (e.g., violating $P(A \cap B) = P(A) \times P(B|A)$), the Arbitrageur waits. If $A$ occurs, they pounce on the second price.
  *   **Takeaway:** This is **(ii) Dutch Strategy**. The loss wasn't visible at the start because it depended on the path (whether $A$ occurred), but the Bookie was locked into the losing price beforehand.

  ### 1:10 – 1:30 | Debrief & Mapping
  Do not move desks. Talk through the following map on the board.

  **1. Mapping the Rounds:**
  *   **Round 1 (Sure Loss):** You could calculate the loss *ex ante*. No matter the die roll, the Bookie lost. This is the classic Dutch Book.
  *   **Round 3 (Dutch Strategy):** You couldn't calculate the total loss *ex ante* because the second bet depended on the first outcome. But the Bookie was still locked in. The loss was guaranteed *on every branch*, but required dynamic execution.
  *   **The "Ghost" (Prob 1 Loss):** Ask: "Did anyone assign Probability 0 to a possible roll (e.g., 'Roll will not be 6')?" If yes, note that if 6 comes up, they lose. If not, they don't. This is not a Sure Loss. It is a Loss with Probability $1/6$.
      *   *Point:* To get "Loss with Probability 1 but not Certainty," you need an infinite sequence of bets (or a continuous space). We can't play that in 90 minutes. That is **(iii) The Czech Book**. It relies on the limit of Round 3 extended infinitely.

  **2. The Spanner (The Core Insight):**
  *   Ask Round 2 Bookies: "Were your prices coherent?" (Likely no). "Did you lose?" (Likely no).
  *   **Conclusion:** The Dutch Book argument assumes:
      1.  **Point Prices:** No Bid/Ask spread.
      2.  **Infinite Divisibility:** You can bet 0.001 chips.
      3.  **Unlimited Capital:** No exposure caps.
  *   **Real World:** None of these hold. Therefore, *small* incoherence is not fatal. Rationality is not "be perfectly probabilistic or die." It is "be coherent *enough* relative to your transaction costs."

  ---

  ## 4. Failure Modes & Fixes (Pre-Mortem)

  **1. Arithmetic Bottleneck**
  *   *Risk:* Students spend 10 minutes calculating $0.55 \times 10 - 0.5 \times 10$ and the energy dies.
  *   *Fix:* Tell Arbitrageurs in Round 1: "If you see $P(A) + P(B) > 1$ for disjoint events, just bet 10 chips on each against. Don't optimize, just punish." Keep the math trivial so the *logic* shines.

  **2. The "Spread" Loophole**
  *   *Risk:* In Round 2, an Arbitrageur finds a huge gap (Bid 0.2, Ask 0.9) and exploits it easily, missing the point about *small* incoherence.
  *   *Fix:* Whisper to Bookies during setup: "Keep your spreads tight (max 0.2 width). If you make it too obvious, you'll get eaten. Try to hide incoherence *inside* the spread."

  **3. Confusing (ii) and (iii)**
  *   *Risk:* Students think Round 3 (Dutch Strategy) is the "Probability 1" case.
  *   *Fix:* In the debrief, be explicit. Round 3 is still a *Sure Loss* conditional on the path. (iii) requires a loss that happens *almost surely* in an infinite limit. Use the "Assigning 0 to a possible die roll" example to illustrate the difference between "Impossible" and "Probability 0."

  **4. Time Overrun**
  *   *Risk:* Round 2 drags on as Arbitrageurs try to break the Cap.
  *   *Fix:* Use a visible timer. At 0:50, blow a whistle. "Stop trading. Count chips." The frustration of being stopped mid-calculation is actually data for the debrief ("You couldn't finish the book because of the constraints").

  ---

  ## 5. What This Game Cannot Reproduce (Frank Note for Debrief)

  End the session by listing what the simulation *failed* to capture. This validates their intuition that something is missing.

  1.  **The Move to Irrationality:** The game shows you *lose chips*. It does not prove you are *irrational*. A student might say, "I don't care about coherence, I care about chips. I survived Round 2, so I won." The Dutch Book argument claims incoherence *is* irrationality, not just financially dangerous. The game only proves the financial danger, and even then, only under specific market conditions.
  2.  **The Infinite Limit (Concept iii):** We used a 6-sided die. Every outcome has $P > 0$. You cannot simulate "Probability 1 but not Certainty" with finite tools. That concept requires a continuum (like picking a random real number) or an infinite sequence of bets. The "Czech Book" is a theoretical horizon this game approaches but cannot touch.
  3.  **Belief vs. Price:** In the game, prices are strategic moves. In the theory, prices represent *degrees of belief*. A student can say, "I posted that price to win the game, not because I believed it." The Dutch Book argument collapses if prices aren't truthful representations of belief. The game cannot enforce truthfulness, only consistency.

  **Closing Line:** "The Dutch Book argument tells you what happens in a frictionless vacuum. Round 2 told you what happens in this room. Decision theory lives in the gap between the two."
