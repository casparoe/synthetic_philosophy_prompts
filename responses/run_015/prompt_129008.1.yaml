answer: |-
  You have put your finger on a live wire in meta-ethics. Your intuition is precise, and your physicist's analogy (the field value existing without a particle) is actually a standard way of defending the position you are leaning toward.

  To answer your primary question directly: **There is no single, universally standardized noun for this specific phenomenon** in the way "entropy" or "qualia" functions. However, the *concept* is well-mapped. In the literature, this is the battleground between **Reasons Internalism** (your reading group's likely default) and **Reasons Externalism** (your instinct).

  Since you need a tool to wield in a discussion rather than a bibliography, I will offer you a conceptual carve-out. I suggest you introduce the term **"Unpossessed Agent-Relative Reasons"** (or, for brevity in discussion, **"Detached Reasons"**).

  Here is the concept carved, distinguished, and defended, tailored for your reading group.

  ### 1. The Definition
  A **Detached Reason** is a consideration that counts in favor of a specific action for a specific agent (or role), retaining its normative force (its ability to license criticism or justify blame) even when no agent currently possesses the psychological capacity to grasp, weigh, or act upon it.

  It differs from a mere **Fact of Value** (e.g., "It would have been better if the instrument were calibrated") because it retains a *directed* structure. It implies an *ought*, not just a *good*.

  ### 2. The Three Nearest Candidates (and how to distinguish them)
  To defend this in your group, you must show why it is not simply one of three existing concepts they might propose.

  **A. vs. Agent-Neutral Value (Impersonal Value)**
  *   *The Challenge:* "Surely the logbook note just means 'A calibrated instrument is good.' That value remains, even if no one is there to achieve it."
  *   *The Distinction:* Value is monadic (State of Affairs $S$ is good). Reasons are dyadic (Reason $R$ is for Agent $A$ to do Action $X$).
  *   *The Test:* **The Criticism Test.** If it were merely impersonal value, we could regret the outcome, but we could not criticize the omission. If you find that the physicist in 1971 *ought* to have acted, and that their failure was a normative defect (not just an unfortunate event), you are dealing with a reason, not just value. The logbook note licensed criticism of a specific role-holder, not a general lament about the universe.

  **B. vs. Internal Reasons (The Williams Constraint)**
  *   *The Challenge:* "Bernard Williams argued a reason must link to the agent's 'subjective motivational set.' If no one could be motivated (because they are dead or demented), there is no reason."
  *   *The Distinction:* Internalism makes reasons *contingent* on psychology. Your view (Externalism) makes reasons *contingent on facts*.
  *   *The Test:* **The Discovery Test.** If the reason were internal, discovering the logbook note now would not create a reason for *us* (we have no motivation to calibrate a scrapped instrument). But if the reason was *there then*, it is a fact we can discover, like a fossil. Your intuition is that the reason was *waiting* to be picked up, not *created* by being picked up.

  **C. vs. Counterfactual Reasons**
  *   *The Challenge:* "Isn't this just saying 'If someone had been there, they would have had a reason'?"
  *   *The Distinction:* Counterfactuals are conditional truths about hypothetical agents. Detached Reasons are categorical truths about actual situations.
  *   *The Test:* **The Time-Index Test.** "If someone had been there" talks about a possible world. "There was reason for somebody" talks about the actual world at $t=1971$. The reason was actual, even if the agent was absent. It is a property of the *situation*, not the *subject*.

  ### 3. Are Your Two Cases One Phenomenon?
  You asked if the Logbook Case (absent agent) and the Dementia Case (incapacitated agent) are the same animal. They are two species of the same genus.

  *   **The Logbook Case (The Vacant Role):** Here, the *agent-token* is missing, but the *agent-type* (a physicist in that lab) was present. The reason attached to the *role*.
  *   **The Dementia Case (The Incapacitated Holder):** Here, the *agent-token* is present, but the *capacity* is missing. The reason attaches to the *person's welfare*, administered via a proxy (the physician).

  **The Unifying Principle:** In both cases, the **Normative Relation** holds even when the **Psychological Link** is broken.
  *   In the Logbook, the link is broken by *absence*.
  *   In the Dementia case, the link is broken by *incapacity*.
  *   In both, the "ought" survives the loss of the "can" (in the psychological sense), provided the physical "can" remained (the instrument existed; the pills existed).

  ### 4. The Asymmetry: Theoretical vs. Practical Reasons
  You noted that evidence for a hypothesis seems fine existing without a believer, but reasons for action bother you more. This is a known asymmetry, but I suggest it is linguistic, not ontological.

  *   **Theoretical Reasons:** We are accustomed to truth being mind-independent. Evidence is just a relation between data and hypothesis.
  *   **Practical Reasons:** We conflate "There is a reason to do X" with "Someone is doing X." Action implies a mover.

  **The Defense:** Use your physics analogy.
  *   *Theoretical:* An electric field exists at a point even if no charge is there to experience a force.
  *   *Practical:* A normative "field" (a reason) exists at a point (a situation) even if no "charge" (an agent) is there to move.
  *   *Why it feels different:* Because particles *must* move if in a field (causality), but agents can *ignore* reasons (free will/negligence). The existence of the reason is proven precisely by the *fault* in ignoring it. If the reason vanished when ignored, there could be no fault, only misfortune.

  ### 5. Boundary Conditions: When does it collapse into Value?
  You asked where the boundary lies. A Detached Reason collapses into a plain Fact of Value when **the possibility of agency is retroactively erased.**

  *   **Case 1 (Reason):** The instrument existed, calibration was physically possible, a role existed to do it. No one did. $\rightarrow$ **Detached Reason.** (Criticism is valid).
  *   **Case 2 (Value):** The instrument was destroyed *before* the note was written, or the laws of physics made calibration impossible. $\rightarrow$ **Impersonal Value.** (Criticism is invalid; only regret remains).

  **The Criterion:** If you can coherently say, "They failed," it was a reason. If you can only say, "It is a pity," it was value.

  ### 6. Suggested Terminology for the Group
  Since you need to defend this without a reading list, I recommend you adopt the label **"Objective Agent-Relative Reasons."**

  *   **Objective:** It does not depend on the agent's beliefs or desires (Externalism).
  *   **Agent-Relative:** It is a reason *for someone* (not just impersonal good).
  *   **Reason:** It licenses criticism/ought-claims.

  **Your Opening Gambit:**
  "I propose we distinguish between *Possessed Reasons* (which require an agent to grasp them) and *Objective Agent-Relative Reasons* (which exist in the structure of the situation). My claim is that normativity is a feature of the world, like a field, not just a feature of the mind, like a sensation. If we deny this, we cannot explain why we criticize the dead for past negligence, or why we protect the demented against their own current wishes."

  ### Summary for your Notes
  1.  **Concept:** Objective Agent-Relative Reasons (or Detached Reasons).
  2.  **Core Feature:** Normative force persists without psychological possession.
  3.  **Differentiation:** Distinct from *Value* (licenses criticism, not just regret); Distinct from *Internal Reasons* (does not require motivation); Distinct from *Counterfactuals* (is actually true, not conditionally true).
  4.  **Unifying Thread:** Both your cases break the link between *Normativity* and *Psychology* while keeping the link between *Normativity* and *Agency*.
  5.  **Boundary:** Collapses into Value only when action was physically/metaphysically impossible.

  This framework should allow you to hold your ground against those who rely on standard textbook distinctions, as it targets the specific gap those distinctions often leave open.
