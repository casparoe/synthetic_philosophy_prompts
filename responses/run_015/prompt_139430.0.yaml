prompt: |-
  Hey — I'm putting together the final for my upper-level philosophy of mind seminar and I want one essay question on pain asymbolia that can't be answered by just reciting the sensory-discriminative vs affective-motivational distinction and announcing that therefore pain's badness is detachable from the experience. The thing I keep doodling is a mirror-image case: a patient who reports the experience is awful, says they'd pay a lot for it to stop, but shows no avoidance behaviour, never quite gets round to asking for the analgesic, and seems entirely unmoved by it — the dissociation running the other way. I want to hand students both vignettes and make them say wich direction of dissociation actually threatens wich theory (badness as an intrinsic feature of the phenomenal character; unpleasantness as basically a desire for the experience to cease; pain as essentially motivating), and make them face the harder move that maybe you can't hold the sensory character fixed while stripping the affect, because the affect partly constitutes the character in the first place.

  Could you write the question with both vignettes (60 mins, closed book), a model answer of about 700 words, and a marking scheme out of 20 built on five must-hit points, with marks for each and a line on how people normally screw each one up? The A answer should at least flag whether 'ok but is that state still pain?' is a substantive question or just a verbal one. No citations needed — our reading list is idiosyncratic anyway.
