  ### Mapping the Objection Space

  Before assigning numbers, we must categorize the failure modes of Pascal's Wager to understand where the probability mass lies. The objections fall into three primary families:

  1.  **The Structural/Mathematical Family:** This includes the *Many Gods Objection* (formalized here as Reversal Symmetry) and *Grain Sensitivity*. These argue that the hypothesis space cannot be partitioned in a way that yields a unique maximum Expected Utility (EU). If the space is symmetric between "Reward Belief" and "Punish Belief" deities, EU cancels to zero. If the space is granular, priors dilute to nothing. This family attacks the *inputs* of the calculation.
  2.  **The Decision-Theoretic Family:** This includes *Fanaticism* and the *Infinite/Finite Payoff* issue. These argue that the *rule* of maximization is broken when applied to low-probability, high-stakes outcomes. If we accept the Wager, we must accept absurd trade-offs elsewhere (e.g., paying a penny for a $10^{100}$ payoff at $10^{-100}$ probability). This family attacks the *engine* of the calculation.
  3.  **The Psychological/Causal Family:** This includes *Doxastic Voluntarism* (can you believe at will?) and *Self-Defeating Payoffs* (Gods who punish instrumental belief). These argue that the *act* required by the Wager is impossible or counter-productive. This family attacks the *feasibility* of the output.

  **Weight Assessment:** The Structural Family carries the real weight. Specifically, **Reversal Symmetry (Q2)** is the fulcrum. If priors must be symmetric over reward/punish hypotheses, and payoffs are symmetric (Heaven/Hell), the Pascalian component of the Expected Utility sum is identically zero. For $P$ to be true, there must be a determinate recommendation *despite* this symmetry. This requires an asymmetry elsewhere (e.g., finite costs), but constraint (iv) of $P$ forbids finite costs from being the deciding factor ("not simply the recommendation... on independent... grounds"). This creates a near-logical contradiction. The Decision-Theoretic family (Fanaticism) is a close second, but one can arguably bite the bullet on fanaticism; one cannot bite the bullet on $0 = 0$ yielding a strict inequality.

