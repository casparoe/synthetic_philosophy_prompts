answer: |-
  The citizen must will the war he fights,
  Yet nature drives the merchant through the gate,
  And commerce softens what the law dictates,
  So freedom binds the sovereign to rights.
  The executive stands apart from legislative will,
  But duty speaks before the profit turns,
  Thus peace grows slow within the native land,
  While reason demands what the spirit burns.

  No single crown shall hold the nations bound,
  But trade will weave a net across the sea,
  Where sovereigns meet on neutral, treaty ground,
  Yet justice calls for more than liberty.
  The merchant counts the cost of war's decree,
  And leagues arise where moral laws should be,
  Each state remains a world unto its own,
  While right demands a union built on stone.

  The visitor stands on the foreign shore,
  He asks to dwell, but law says only pass,
  Commerce blows like an unsettled wind,
  Breaking against the sovereign's hard shell.
  Hospitality is not a gift to keep,
  The world is common, yet the borders wide,
  Reason tries to sweep the conflict clean,
  But peace remains a shape without a form.
