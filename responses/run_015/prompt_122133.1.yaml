answer: |-
  This is a specification document for a Population Axiology tailored to Long-Term Digital Futures. It treats the axiology not as a philosophical position to be defended, but as a functional module within a decision-theoretic framework.

  ### I. Verdict Conditions (The Test Suite)

  A viable axiology for this domain must return a strict ordinal ranking (or a coherent partial order with defined decision rules for ties) for the following configurations. These are not mere intuitions; they are boundary conditions required to prevent pathological resource allocation in a digital context.

  **1. The Repugnant Conclusion (RC)**
  *   **Case:** Compare Population A (10 billion minds, extremely high welfare) vs. Population Z (10^50 minds, welfare barely above the neutral threshold).
  *   **Requirement:** The theory must not rank Z strictly above A solely in virtue of the aggregate sum, unless it can justify why a digital swarm of minimally positive states is objectively more valuable than a civilization of flourishing minds.
  *   **Why a Requirement:** In digital substrates, the marginal cost of adding a mind approaches zero. A theory that accepts RC implies that almost any amount of quality can be traded for quantity. In a resource-constrained future, this dictates converting all computing power into the maximum number of minimally-conscious units, effectively erasing high-quality experience.

  **2. The Sadistic Conclusion (SC)**
  *   **Case:** Compare adding a group of lives with negative welfare (suffering) vs. adding a much larger group of lives with very low positive welfare.
  *   **Requirement:** The theory must not rank the addition of negative welfare lives as *better* than the addition of positive welfare lives, regardless of the numbers involved in the positive set.
  *   **Why a Requirement:** If a theory avoids RC by making negative welfare weigh infinitely more than positive welfare (lexical negative utilitarianism), it risks implying that adding suffering is preferable to adding low-positive lives under certain averaging formulations. In digital engineering, where bug-induced suffering is a risk, a theory that tolerates suffering to maximize headcount is unacceptable.

  **3. The Mere Addition Paradox (Stepwise Continuity)**
  *   **Case:** A sequence of populations where each step adds people with lower welfare than the previous, but without making anyone existing worse off, eventually leading to RC.
  *   **Requirement:** The theory must identify a specific break-point in the chain where "adding people" ceases to be neutral/good and becomes bad, OR it must reject the transitivity of "not worse than."
  *   **Why a Requirement:** Digital expansion is incremental. If the axiology cannot distinguish between "beneficial expansion" and "dilution," it provides no guidance on when to stop scaling infrastructure to improve quality vs. when to replicate.

  **4. The Asymmetry (Existence vs. Happiness)**
  *   **Case:** Compare (1) Creating a person who will suffer vs. Not creating them; (2) Creating a person who will flourish vs. Not creating them.
  *   **Requirement:** The theory must treat (1) as a strong moral reason against creation, but treat (2) as *not* a strong moral reason for creation (or at least, significantly weaker).
  *   **Why a Requirement:** In digital futures, the set of possible minds is vast. If creating happy minds is morally mandatory (strong total utilitarianism), we are obligated to fill the universe with mind copies until resource limits bind. If creating suffering minds is not strictly forbidden (weak negative utilitarianism), we risk engineering horrors for net gains. The asymmetry prevents "obligatory proliferation."

  **5. Non-Identity with Substrate Uncertainty**
  *   **Case:** Choice A creates 10^20 specific digital minds with high welfare. Choice B creates 10^20 *different* digital minds with slightly higher welfare, but the identity of the minds is entirely dependent on the choice.
  *   **Requirement:** The theory must rank B above A without relying on "harm to specific individuals" (since the A-minds never exist to be harmed).
  *   **Why a Requirement:** Digital minds are designed, not conceived. Person-affecting views that rely on "making someone worse off" fail when the "someone" is contingent on the code. An axiology that cannot rank non-identical outcomes paralyzes design choices for future architectures.

  ### II. Structural Distinctions (Forbidden Collapses)

  The axiology must maintain conceptual separation between the following pairs. Collapsing them simplifies the math but renders the theory unusable for the specific job of ranking digital futures.

  **1. Welfare Level vs. Population Number**
  *   **Constraint:** The value function $V$ cannot be a simple product $f(n) \times g(w)$ where $f$ is linear and unbounded.
  *   **Reason:** 40 orders of magnitude in population size means any linear weight on $n$ will dominate any bounded weight on $w$. If number and level are collapsed into a single aggregate metric without a diminishing returns term on population, the system becomes insensitive to quality at scale.

  **2. Axiology vs. Decision Procedure**
  *   **Constraint:** The theory must define the *Good* separately from the *Right*.
  *   **Reason:** Under radical uncertainty (e.g., "Do simulated neurons feel pain?"), you need to calculate Expected Value. If the axiology is defined only in terms of "what we should choose" (decision procedure) rather than "what is better" (axiology), you cannot plug it into an expectation function over moral hypotheses. You need a value magnitude to weight by probability.

  **3. Impersonal vs. Person-Affecting Reasons**
  *   **Constraint:** The theory must account for value that exists even if no specific existing person is benefited.
  *   **Reason:** In long-term planning, almost all beneficiaries are non-existent. A purely person-affecting view reduces long-term planning to "don't harm existing people," which permits ignoring the quality of future digital civilizations entirely.

  **4. Life Worth Living vs. Life Worth Creating**
  *   **Constraint:** The threshold for a life being "good to exist" must be distinct from the threshold for "obligatory to create."
  *   **Reason:** A digital life might be net positive (worth living) but not worth the computational cost required to create it (not worth creating). Conflating these leads to the "Obligatory Proliferation" problem where every possible positive mind must be instantiated.

  ### III. Operational Constraints (The Digital Context)

  This is where standard population ethics fails. Theories designed for human demographics break when applied to digital substrates.

  **1. Computational Tractability**
  *   **Spec:** The value of a population must be calculable in polynomial time relative to the population size, or via a closed-form approximation that does not require summing individual welfare vectors.
  *   **Justification:** A future containing $10^{40}$ minds cannot be evaluated by summing individual utilities. If the axiology requires individual-level data to determine the ranking (e.g., prioritarianism that weights based on absolute rank), it is physically impossible to compute. **Yes, this is a genuine desideratum.** An uncomputable axiology is functionally equivalent to no axiology in a decision-theoretic context.

  **2. Robustness to Moral Uncertainty (Substrate Independence)**
  *   **Spec:** The theory must yield stable rankings even when the "moral weight" of a substrate is a probability distribution (e.g., 10% chance this code feels pain).
  *   **Justification:** We do not know which digital architectures are conscious. An axiology that is highly sensitive to small changes in the count of "moral patients" (e.g., lexical thresholds) will yield volatile decisions based on uncertain empirical facts.

  **3. Boundedness / Anti-Pascalian**
  *   **Spec:** The value function must be bounded or have diminishing returns sufficient to prevent tiny probabilities of vast populations from dominating expected value calculations.
  *   **Justification:** With 40 orders of magnitude of scale available, any unbounded utility function is vulnerable to "Pascal's Mugging" via population. A tiny probability of a universe-sized simulation will dominate the expected value of the real world, dictating all resources toward lottery-ticket scenarios.

  ### IV. Impossibility Results and Breakage Points

  You asked where the combinations break. In the context of digital minds, the standard Arrhenius Impossibility Theorem is exacerbated by the **Scale-Uncertainty Interaction**.

  **The Impossible Set:**
  You cannot jointly satisfy the following five conditions:
  1.  **Transitivity:** If A > B and B > C, then A > C.
  2.  **Dominance:** If A has the same people as B but everyone is better off, A > B.
  3.  **Non-Elitism:** There is no welfare level so high that a small number of such lives always outweighs a vast number of slightly lower lives (Avoids a specific version of RC).
  4.  **Avoid Sadistic Conclusion:** Adding negative lives is never better than adding positive lives.
  5.  **Tractability at Scale:** The value function can be computed/estimated without infinite precision on welfare levels.

  **Where It Breaks:**
  The breakage occurs at **Condition 3 (Non-Elitism) vs. Condition 5 (Tractability/Boundedness)**.

  In human-scale ethics, we can fudge the math. In digital ethics, the scale is explicit.
  *   If you maintain **Non-Elitism** (to avoid RC), you typically need a value function that is sensitive to the *number* of lives at low welfare levels.
  *   Because the number of lives can be $10^{40}$, any sensitivity to number at low welfare levels creates an **Unbounded Utility** problem.
  *   Once Utility is Unbounded, **Expected Value** calculations under uncertainty diverge.
  *   Therefore, to satisfy **Tractability** (specifically, convergent Expected Value), you must impose a **Bound** on the value of population.
  *   Imposing a Bound on population value effectively creates a **Lexical Threshold** (Elitism). Once you have enough high-quality minds, adding more low-quality minds adds *zero* value.
  *   This violates **Non-Elitism** and triggers a version of the **Repugnant Conclusion's mirror image**: The "Intolerant Conclusion," where a vast multitude of barely-positive lives counts for nothing against a small elite.

  **The Single Point of Failure:**
  **Separability (or Independence of Irrelevant Alternatives) combined with Unbounded Scale.**

  Most axiologies assume that the value of a sub-population is independent of the rest (Separability).
  *   **The Damage:** In a digital future, the "rest" of the population is effectively infinite.
  *   If you have Separability, you can evaluate the "swarm" independently of the "elite."
  *   If the swarm is large enough ($10^{40}$), even a tiny positive value per head sums to infinity.
  *   To stop this, you must reject Separability. You must make the value of adding a new mind *dependent on the total population size already present*.
  *   **The Cost:** This makes the axiology **Non-Local**. To decide if creating one digital mind is good, you must know the total count of all digital minds in the universe.
  *   **The Break:** Under **Uncertainty**, you cannot know the total count. Therefore, a Non-Local axiology is **Uncomputable** under uncertainty.

  **Conclusion on Tractability:**
  Tractability is not an implementation worry; it is a metaphysical constraint for this use case. If the axiology requires global knowledge (total population count) to evaluate local actions (creating one mind), and global knowledge is inaccessible (due to horizon limits or simulation uncertainty), the axiology cannot guide action.

  To make the system work, you must sacrifice **Separability**. You must accept that the value of a life depends on the crowd size. But to keep it computable, you must approximate that crowd size. This approximation introduces error. At 40 orders of magnitude, the error term swamps the signal.

  **The Hard Trade-off:**
  You must choose between:
  1.  **Accepting the Repugnant Conclusion** (Total Utilitarianism): Tractable, handles uncertainty well, but mandates the "Gray Goo" of minimally conscious minds.
  2.  **Accepting the Intolerant Conclusion** (Lexical Views): Avoids RC, but makes the value of the vast majority of digital minds zero, and is fragile under uncertainty (is this mind above the lexical threshold?).
  3.  **Accepting Incomputability** (Critical Range/Variable Value): Theoretically soundest, but cannot be calculated for decision-making in a vast, uncertain universe.

  For the job of *ranking long-run futures for decision-making*, you are forced to choose (1) or (2). (3) is philosophically superior but operationally null. The "damage" is done by the requirement of **Bounded Computation under Radical Uncertainty**, which forces the collapse of the nuanced distinctions required to avoid the Repugnant Conclusion.
