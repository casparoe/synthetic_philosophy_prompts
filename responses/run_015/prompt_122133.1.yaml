prompt: |-
  i've been going in circles on population ethics for years — mostly via blogs, so sorry if this is all old hat to anyone with real training — and I want to stop reading more theories until I know what I'd be asking one to do. So: write me the desiderata list for a population axiology. Not "avoid the repugnant conclusion" as a single bullet; I want the actual spec. Which cases does it have to return a verdict on (the repugnant conclusion, the stepwise "mere addition" moves that get you there, the non-identity-style cases where who exists depends on the choice, the asymmetry about creating unhappy vs happy lives)? Which distinctions is it not allowed to collapse (a life worth living vs a life worth *creating*, welfare-level vs number, axiology vs decision procedure, impersonal vs person-affecting reasons)? And for each one, what's the consideration that makes it a requirement rather than just a taste some camp has?

  The job I need it for is a bit unusual, so build the list for that: ranking long-run futures that are full of digital minds. Populations differing by forty-ish orders of magnitude, welfare that might be very high or barely net positive, serious uncertainty about which substrates have welfare at all, and the number and identity of the individuals being downstream of the action itself. What does a theory have to deliver to be usable at that scale and under that much uncertainty — and is "tractable enough to actually feed into a decision, with bounded computation and messy probabilities" a genuine desideratum or just an implementation worry wearing a philosophy costume?

  The part I most want: which combinations on the list can't be jointly satisfied. I suspect scale-plus-uncertainty makes things worse than the usual impossibility set-up (dodging both the repugnant conclusion and its mirror image about adding bad lives while still accepting that improving one person without touching anyone else isn't a worsening), and I want to see where exactly it breaks and which single requirement does the most damage. Skip scoring the famous views against the list — I'll do that bit myself. No bibliography either, I'll drop in citations later.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Topic:** Population Ethics (Axiology).
      *   **Goal:** Create a *desiderata list* (specification of requirements) for a population axiology, not just a summary of existing theories.
      *   **Specific Context:** Ranking long-run futures full of digital minds.
      *   **Key Constraints/Features of Context:**
          *   Scale: Populations differing by ~40 orders of magnitude.
          *   Welfare: Potentially very high or barely net positive.
          *   Uncertainty: Substrate consciousness (moral status), probabilities, identity of future individuals.
          *   Computation: Must be tractable enough for decision-making (bounded computation, messy probabilities).
      *   **Specific Questions to Answer:**
          *   Which cases must it verdict on? (Repugnant Conclusion, Mere Addition, Non-Identity, Asymmetry).
          *   Which distinctions must it preserve? (Worth living vs. worth creating, level vs. number, axiology vs. procedure, impersonal vs. person-affecting).
          *   Why are these requirements (not just preferences)?
          *   **Crucial:** Which combinations are impossible to jointly satisfy? (Impossibility theorems).
          *   **Crucial:** Where does scale + uncertainty break things?
          *   **Crucial:** Is tractability a genuine desideratum?
      *   **Formatting:** No scoring of famous views, no bibliography.
      *   **Tone:** Rigorous, technical, direct, acknowledging the user's familiarity with the blogosphere discourse but pushing for formal specification.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to categorize requirements into *Formal Properties*, *Substantive Intuitions/Cases*, and *Operational Constraints*.
      *   *Formal:* Transitivity, Completeness, Separability (maybe?), Scale Independence.
      *   *Substantive:* The Big Intuitions (Quality, Quantity, Existence, Suffering).
      *   *Operational:* Tractability, Robustness to Uncertainty.

  3.  **Address the "Why" (Justification):**
      *   For each desideratum, I must explain *why* it's required for the specific job (digital mind futures), not just because Parfit said so.
      *   Example: Why care about the Repugnant Conclusion here? Because digital minds allow for massive populations at low welfare easily. If the theory accepts RC, it might prioritize a vast swarm of minimally positive bots over a smaller civilization of flourishing minds.

  4.  **Address the "Scale + Uncertainty" Factor:**
      *   Standard population ethics assumes fixed identities or manageable numbers.
      *   40 orders of magnitude means $10^{40}$. Average utilitarianism crashes on tiny probabilities of huge populations. Total utilitarianism crashes on the Repugnant Conclusion.
      *   Uncertainty about consciousness (moral weight) adds a layer of expected value calculation that interacts with the axiology.
      *   Tractability: If the axiology requires knowing exact welfare levels to 100 decimal places to distinguish outcomes, it's useless.

  5.  **Address the Impossibility Theorems:**
      *   Arrhenius's Impossibility Theorem is the big one.
      *   Mere Addition Paradox.
      *   The conflict between "Avoid Repugnant Conclusion," "Avoid Sadistic Conclusion," "Non-Elitism," and "Transitivity/Completeness."
      *   I need to pinpoint *which* constraint breaks under the digital mind scenario. My hypothesis: *Separability* or *Continuity* combined with *Scale* creates the biggest tension. Or perhaps *Tractability* forces a collapse that violates *Substantive Intuitions*.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the task. Set the stage (Digital Mind Axiology).
      *   **Part 1: The Verdict Conditions (Cases):**
          *   Repugnant Conclusion (RC): Essential because digital replication makes "Z" easy.
          *   Mere Addition (MA): Essential because expansion is stepwise.
          *   Asymmetry (Happy vs. Unhappy): Essential because creating suffering is arguably worse than failing to create happiness.
          *   Non-Identity: Essential because digital minds are designed, not born in the biological sense.
          *   Sadistic Conclusion: Adding miserable lives should not be better than adding happy ones.
      *   **Part 2: The Structural Distinctions:**
          *   Value of Existence vs. Value for Existence.
          *   Welfare Level vs. Count.
          *   Axiology vs. Decision Procedure (Crucial for uncertainty).
          *   Impersonal vs. Person-Affecting.
      *   **Part 3: The Operational Constraints (The "Digital" Twist):**
          *   Scale Invariance/Robustness: Must handle $10^9$ to $10^{49}$.
          *   Computational Tractability: Can we actually calculate the value?
          *   Uncertainty Robustness: Moral uncertainty (consciousness) + Empirical uncertainty.
      *   **Part 4: The Impossibility Results (The "Breakage"):**
          *   Arrhenius's Theorem.
          *   The specific tension: RC vs. Sadistic vs. Dominance.
          *   The "Scale" multiplier: How tiny probabilities of vast populations dominate (Pascal's Mugging style).
          *   Tractability as a hard constraint: If it's not computable, it's not an axiology for *decision making*.
      *   **Part 5: The Single Point of Failure:**
          *   Identify the specific axiom that causes the collapse. Usually *Separability* or *Continuity* in the face of *Unbounded Utility*.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* The user asked "Is tractability a genuine desideratum?" I need to take a stance. Yes, for *decision theory*, an uncomputable axiology is functionally identical to having no axiology.
      *   *Correction:* Make sure to distinguish between *Total* and *Average* utilitarianism pitfalls in the context of digital minds. Total leads to RC. Average leads to the "Mere Addition" paradox and the "Happy Hell" problem (adding a very happy person lowers the average).
      *   *Focus:* The user wants to know *where it breaks*. I need to highlight that with 40 orders of magnitude, *Expected Value* calculations become unstable if the axiology isn't bounded.
      *   *Nuance:* The "Asymmetry" is tricky. In digital minds, we can turn them off. Does "not creating" equal "turning off"? I should note this distinction.

  8.  **Final Polish:**
      *   Ensure the tone is professional and dense (matching the user's prompt).
      *   Check against constraints: No bibliography, no scoring views.
      *   Make sure the "Impossibility" section is sharp. Arrhenius is the standard, but I need to apply it to the *scale* issue. The real killer is the interaction between *Unbounded Population* and *Expected Utility*.

  9.  **Final Review against Prompt:**
      *   Desiderata list? Yes.
      *   Cases to verdict? Yes.
      *   Distinctions not to collapse? Yes.
      *   Consideration for requirement? Yes.
      *   Digital mind context? Yes.
      *   Tractability question answered? Yes.
      *   Impossibility/Combinations? Yes.
      *   Single requirement doing damage? Yes.

