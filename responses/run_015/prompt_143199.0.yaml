answer: |-
  **The Whiteboard Session**

  **Marcus:** The panel is canceled. We have ninety minutes and a marker. Let's stop performing for the audience and actually test the steel.

  **Iris:** Fine. You want to defend aggregation. I want to defend the separateness of persons. Start with the hard case.

  **Marcus:** The hard case is always the body count. If we refuse to aggregate small burdens across a million people to save one person from death, we are choosing the death. You say aggregation treats many people as one super-person. I say refusing aggregation treats one person's survival as worth more than a million people's mild headaches. When you decline to impose a tiny risk on many to avert a large harm to a few, you aren't neutral. You have a body count too. How do you justify yours without aggregating?

  **Iris:** I justify it by looking at who experiences the balance. When I sacrifice my present comfort for my future health, I bear the cost and I reap the benefit. The balance is experienced within a single life. When you sacrifice Alice's health for Bob's comfort, the balance is not experienced by anybody. There is no standpoint where the loss and the gain cancel out. You're summing across voids.

  **Marcus:** But that distinction collapses if we look at risk. Ex ante, everyone faces the same tiny risk. From behind a veil of ignorance, everyone would agree to the trade. Why does the metaphysical fact of separateness veto the rational choice of the impartial spectator?

  **Iris:** Because the veil is a thought experiment, not a phenomenological reality. When the dust settles, Alice is still in pain and Bob is still happy. No one felt the net gain. Now, let's test this with the Confluence Link.

  **Marcus:** Please.

  **Iris:** Suppose we link two subjects. They share a single stream of consciousness to a degree *f*, between zero and one. At *f* equals zero, they are separate. At *f* equals one, there is one phenomenal field taking input from two bodies, though each controls one body. At *f* equals point-five, half their experiences are jointly felt. If I hurt Body A to pleasure Body B, does the permissibility scale continuously with *f*?

  **Marcus:** It should. If *f* equals one, it's intrapersonal. You admit trade-offs are fine there. If *f* is point-nine-nine, why is it suddenly forbidden? If you say there's a cliff at *f* equals zero, you're saying a tiny change in phenomenological fusion triggers a massive moral prohibition. That looks like a fetishization of boundaries rather than a concern for suffering.

  **Iris:** I'm not sure it scales. It's not about the *amount* of sharing, it's about the unity of agency. At *f* equals one, there is a single standpoint choosing the package. Even if the bodies are separate, the *chooser* is one. At *f* equals zero, there are two choosers. The operative variable isn't how much pain is felt jointly, it's whether there is a single life in which the compensation occurs.

  **Marcus:** Then here is the counting question. If a partially fused pair is, in your sense, more than one subject but fewer than two, does your view commit you to a fusion premium? Should we weight their combined welfare more heavily than two separate people? If you reject the premium, you're admitting the moral weight doesn't track the metaphysical fusion. You're secretly relying on identity, not separateness of experience.

  **Iris:** I reject the premium. Moral status is binary; you're either a subject or you aren't. But I concede this: if the fusion is high enough, the *description* of the harm changes. It becomes less like two people and more like one person with complex inputs. However, I don't need a premium to say the structure of justification changes.

  **Marcus:** That concession helps me. If the structure changes only when the description changes, then look at the reverse case. Consider one person whose future self is psychologically discontinuous from them as a stranger. Total change of values, no anticipation, no identification. If intrapersonal compensation is your model case where trade-offs work, does compensation stop working inside a life at the point where continuity breaks?

  **Iris:** That is the hardest press on my view. If I say continuity doesn't matter for personal identity, then I must allow the trade. If I say it does matter, then I admit my objection isn't about separateness of persons, but about psychological connectedness.

  **Marcus:** Exactly. So do you want the Confluence *f*-spectrum and the psychological continuity spectrum governed by the same variable? If yes, then you've admitted the objection is really about the strength of psychological ties, not the metaphysical boundary of the person. If no, you're using two different rules for what looks like the same phenomenon: the fading of the subject.

  **Iris:** I need to reframe. I'm not arguing that trade-offs become impossible when continuity fades. I'm arguing that the *force* of the justification weakens. The reason I accept intrapersonal trade-offs isn't just identity; it's that the subject can endorse the sacrifice. If the future self won't endorse it, the justification erodes. But that doesn't mean it erodes all the way to zero. There's still a single biological organism navigating time.

  **Marcus:** But with the Confluence Link, you have two organisms navigating time with a shared mind. You're prioritizing the biological boundary over the phenomenological one. That looks like a metaphysical thesis wearing a moral costume. You want the moral protection to stop where the soul stops, but you can't define the soul without begging the question.

  **Iris:** And you want the moral protection to dissolve wherever the math works out. You're treating persons as containers for value. My real disagreement isn't about the math. It's about whether the loss of a life is a tragedy that can be canceled out by gains elsewhere. You think the sum matters. I think the distribution matters because the distribution is the only thing anyone actually lives through.

  **Marcus:** So what would move you? If I showed you that refusing aggregation implies accepting vast preventable suffering for the sake of a boundary no one experiences?

  **Iris:** If you showed me that the "separateness" I'm protecting isn't just a fetish for skin suits. If you can demonstrate that the impartial standpoint is real enough to bear the weight of sacrifice. What would move you?

  **Marcus:** If you could show me that the victim of aggregation suffers a distinctive wrong that isn't captured by the net loss of welfare. But if you just say "because they are separate," you're restating the slogan.

  **Iris:** Then we're stuck. You need a metaphysics that makes the sum real. I need an ethics that respects the void between us.

  **Marcus:** We have ten minutes. Let's draw the void.

  ***

  **Moderator's Note**

  This dialogue is designed to bypass standard impasses by forcing both sides into a novel case (the Confluence Link) where their usual heuristics conflict.

  **Standard vs. Live Issues:** It is dialectically standard to grant that intrapersonal and interpersonal trade-offs differ in structure (the "no one experiences the balance" point) and that refusing aggregation has opportunity costs (the "body count" point). Most working ethicists accept these as the poles of the debate. What is live here is whether the separateness objection secretly relies on a thesis about personal identity. The dialogue pushes Iris to admit that if psychological continuity fades within a life, her objection should weaken, which risks collapsing her view into a claim about psychological connectedness rather than personhood. This is an ongoing fight: some defenders of separateness insist personhood is binary regardless of continuity, while others concede the gradient.

  **Concessions and Readings:** I made Iris concede that the *force* of justification weakens with psychological discontinuity, rather than holding the hard line that personhood is strictly binary. Actual defenders of the separateness objection might resist this more strongly, arguing that biological or legal personhood holds the line regardless of psychological flux. I made Marcus concede that *f*=1 is distinct, though he denies it justifies a moral cliff; some aggregationists might argue there is no relevant difference even at *f*=1 if the bodies remain distinct.

  **Formal Results:** Marcus mentions the "impartial spectator" and "veil of ignorance" reasoning. This is a reconstruction of Harsanyi-style aggregation arguments without invoking the formal expected-utility theorem. I have avoided citing the specific theorem to keep the handout accessible, but participants should know this rests on contested assumptions about risk aversion and identity behind the veil. The dialogue treats these as intuitive pumps rather than proofs.
