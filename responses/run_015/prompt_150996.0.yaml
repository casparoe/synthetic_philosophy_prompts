  ### The Regress Flowchart: Logical Space & Branching Questions

  This flowchart maps the logical space of epistemic justification without presupposing the standard labels. It begins with two concrete cases to anchor student intuitions before moving to structural constraints.

  **Instructions:** Start at **Q1**. Follow the path dictated by your answers to reach a leaf node.

  #### The Branching Questions (Nodes 1–10)

  **Q1 (Case: Double Support):** You hold a belief based on a reliably working perceptual system. You also have a valid argument for it. You forget the argument, but the perceptual system remains reliable. Is your justification lost?
  *   **Yes:** Go to Q2. (Internalist Track)
  *   **No:** Go to **Leaf A**. (Externalist Track)

  **Q2 (Case: Testimonial Chain):** Consider a chain of testimony where *nobody* in the chain ever perceived the event; everyone believed only because the previous person told them. Is the final belief unjustified *regardless of the chain's length*?
  *   **Yes:** Go to Q3. (Anchor Required Track)
  *   **No:** Go to Q5. (System/Chain Track)

  **Q3 (Nature of the Anchor):** To stop the regress, must the terminating source of justification be a *belief* (a propositional attitude)?
  *   **Yes:** Go to Q8. (Doxastic Base Track)
  *   **No:** Go to Q4. (Non-Doxastic Base Track)

  **Q4 (Power of Non-Beliefs):** Can a non-belief state (e.g., a raw sensation or perceptual experience) justify a belief without itself being a belief?
  *   **Yes:** Go to Q9. (The Given Track)
  *   **No:** Go to **Leaf B**. (Skeptic Track)

  **Q5 (Structure of Support):** If the chain does not require an external anchor, must the reasons eventually loop back to support the starting belief (coherence), or can they continue linearly forever?
  *   **Must Loop:** Go to Q7. (Coherence Track)
  *   **Can Continue Linearly:** Go to Q6. (Linear Track)

  **Q6 (Capacity for Infinity):** Is it possible for a human mind to possess an infinite number of distinct reasons?
  *   **Yes:** Go to **Leaf C**. (Infinitist Track)
  *   **No:** Go to **Leaf B**. (Skeptic Track – *Alternate Route*)

  **Q7 (Role of Experience):** In a coherent system, does sensory experience provide *reasons* for beliefs, or does it merely *cause* them?
  *   **Provides Reasons:** Go to **Leaf D**. (Standard Coherentist Track)
  *   **Merely Causes:** Go to **Leaf E**. (Hybrid Track)

  **Q8 (Strength of Base):** If the anchor is a belief, must that belief be infallible (impossible to be wrong)?
  *   **Yes:** Go to **Leaf F**. (Classical Foundationalist Track)
  *   **No:** Go to **Leaf G**. (Modest Foundationalist Track)

  **Q9 (Independence of Base):** If a non-belief justifies a belief, does that non-belief derive its own authority from its relations to other beliefs?
  *   **Yes:** Go to **Leaf H**. (Foundherentist/Empty Track)
  *   **No:** Go to **Leaf G**. (Modest Foundationalist Track – *Alternate Route*)

  **Q10 (Consequence of Failure):** If no satisfactory resolution to the regress is found, is knowledge impossible or merely unproven?
  *   **Impossible:** Go to **Leaf B**. (Radical Skeptic Track)
  *   **Unproven:** Go to **Leaf I**. (Contextualist/Pragmatist Track)

  *(Note: Q10 is available as a tie-breaker for Skeptic leaves or to distinguish Contextualism, but for the primary map, we will treat Leaf B as the primary Skeptic destination.)*

  ---

  #### The Leaves: Positions and Awkward Commitments

  | Leaf | Path Summary | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | Q1: No (Reliability suffices) | **Process Reliabilism** (Externalism) | "A belief can be fully justified even if the holder has no access to *why* it is true." |
  | **B** | Q2: Yes + Q4: No (or Q6: No) | **Pyrrhonian Skepticism** | "We may act on belief, but we never act *rationally*." |
  | **C** | Q2: No + Q5: Linear + Q6: Yes | **Infinitism** | "Justification is never complete; it is perpetually deferred." |
  | **D** | Q2: No + Q5: Loop + Q7: Reasons | **Standard Coherentism** | "A fairy tale could be justified if it were sufficiently elaborate and consistent." |
  | **E** | Q2: No + Q5: Loop + Q7: Causes | **Davidsonian Coherentism** (Hybrid) | "The world determines what our beliefs mean, but gives us no reasons for them." |
  | **F** | Q2: Yes + Q3: Yes + Q8: Yes | **Classical Foundationalism** | "There are beliefs about the world that cannot possibly be wrong." |
  | **G** | Q2: Yes + Q3: Yes + Q8: No | **Modest Foundationalism** | "Some beliefs are justified without reasons, even though they could be false." |
  | **H** | Q3: No + Q9: Yes | **[Unoccupied Cell]** | (See Diagnosis Below) |
  | **I** | Q10: Unproven | **Contextualism** | "Justification is relative to the conversational context, not the facts." |

  ---

  #### Diagnostics: Gaps, Overlaps, and Risks

  **1. Indistinguishable Leaves**
  *   **Pair:** **Leaf G (Modest Foundationalism)** and **Leaf D (Standard Coherentism)**.
  *   **Why:** Both views often converge in practice. A modest foundationalist admits beliefs are fallible and influenced by the system; a coherentist admits some beliefs (observation reports) are more resistant to revision.
  *   **Further Question to Separate:** "Is the initial warrant for an observational belief *independent* of its coherence with other beliefs?"
      *   *Yes:* Modest Foundationalism.
      *   *No:* Coherentism.

  **2. The Empty Cell (Leaf H)**
  *   **Combination:** Non-belief justifies (Q3: No) **BUT** the non-belief derives authority from relations to other beliefs (Q9: Yes).
  *   **Diagnosis:** **Incoherent.** If the non-belief derives authority from the belief system, it is not doing the work of a "base." If it justifies the system, it cannot depend on the system. This looks like trying to pull oneself up by one's bootstraps.
  *   **Where Diagnosis Might Be Wrong:** This cell is occupied by **Foundherentism** (e.g., Susan Haack). She argues justification is like a crossword puzzle: clues (experience) and intersecting words (beliefs) mutually support each other. The "incoherence" diagnosis fails if justification is not a linear chain but a network where "dependence" is mutual rather than hierarchical.

  **3. Structural Risks to the Tree**
  *   **The Risk Node:** **Q1 (Double Support Case).**
  *   **Pattern of Answers:** If a significant number of students answer: *"Reliability is necessary, but not sufficient without some access to reasons."*
  *   **Implication:** The tree forces a dichotomy (Externalism vs. Internalism) that **Virtue Epistemology** rejects. Virtue epistemologists often argue that justification requires the belief to arise from intellectual virtue (Externalist) but that the agent must take responsibility (Internalist).
  *   **Restructuring:** If this pattern emerges, Q1 must be split. Instead of "Is justification lost?", ask: *"Does reliability contribute to justification, even if reasons are lost?"* This allows a middle branch for Hybrid Internalist/Externalist views.

  **4. The "Skeptic" Trap**
  *   **Observation:** Leaf B is reached via two very different paths (Q4: No [No Given] OR Q6: No [No Infinite Mind]).
  *   **Risk:** These are different *kinds* of skepticism. The first is skepticism about the *Given* (Sellarsian); the second is skepticism about *Human Capacity*.
  *   **Correction:** If students cluster here, label the leaves distinctly: **Skepticism (No Anchor)** vs. **Skepticism (Finite Mind)**. Merging them obscures whether the problem is metaphysical (no reasons exist) or psychological (we can't hold them).

  ### Instructor's Note on Usage
  When walking students through this, do not reveal the position names until they reach the leaf. The pedagogical value lies in the realization that their intuitive answers to the *cases* (Q1 & Q2) commit them to structural constraints (Q3–Q10) they may not have anticipated. If a student finds their leaf's "Awkward Commitment" unacceptable, they must backtrack and change an earlier answer, revealing exactly which intuition drives their epistemology.
