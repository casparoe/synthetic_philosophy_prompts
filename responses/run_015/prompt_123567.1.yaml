      *   (2) *The Illusion Mechanism:* Misrepresentation is real/stubborn. Mary case: abilities + new instance of illusion. (User notes this feels weird).
      *   (3) *Consciousness Realism:* Access/functional consciousness is real and causal. Only phenomenality is denied.
      *   (4) *First-Person Authority:* Reports are data. Can't say people are wrong about *whether* it hurts.
      *   (5) *Pain Theory:* Pain = representation of damage + motivational role. Not felt quality.
      *   (6) *Moral/Suffering Claim:* Suffering matters morally. Chronic pain without attention/avoidance is *still* harmful/bad.
      *   (7) *Qualia Elimination:* Qualia concept is empty (phlogiston).
      *   (8) *Hard Problem:* Dissolved philosophically, but scientifically hard (mechanism unknown).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (4) vs. (1) & (5).**
          *   (4) says: Can't say people are wrong about *whether* it hurts. Reports are data.
          *   (1) says: Introspection misrepresents states as having features they don't have (phenomenality).
          *   (5) says: Pain isn't a felt quality.
          *   *Conflict:* When a layperson says "It hurts because it feels like *this* (burning/throbbing)," they are invoking phenomenality. If (1) is true, they are wrong about the *nature* of the hurt. (4) seems to grant too much authority to the subject if their report implies qualia exist.
          *   *Severity:* High. This is the classic "error theory vs. data" problem for illusionism.

      *   **Tension B: (5) vs. (6).**
          *   (5) says: Pain badness = motivational/conative role (grabs attention, desire to stop, avoidance).
