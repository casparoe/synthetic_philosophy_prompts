          *   *Conflict:* (6) explicitly describes a case where the criteria in (5) are absent (no attention grab, no avoidance), yet claims the badness remains. This is a direct contradiction in the definition of pain's badness.
          *   *Severity:* Very High. This looks like a straightforward logical inconsistency within the user's theory of value/pain.

      *   **Tension C: (2) vs. (6).**
          *   (2) Mary acquires a "new instance of the very illusion."
          *   (6) Suffering matters morally.
          *   *Conflict:* If the "what-it's-like" is an illusion, why does the *illusion* of suffering carry moral weight? Usually, illusionists ground moral weight in the functional states (distress, preference frustration). If (6) says the habituated pain is bad *even without* the functional disruption, what is grounding the badness? If it's not the "feel" (denied in 1) and not the "function" (absent in 6), what is left?
          *   *Severity:* High. Connects to the "Hard Problem of Ethics" for illusionists.

