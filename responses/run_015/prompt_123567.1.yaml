      *   *Check:* Is the (5)/(6) contradiction clear? Yes, (5) says Badness = Function. (6) says Badness = No Function. That's a direct hit.
      *   *Check:* Is the (4) tension clear? Yes, "It hurts" implies phenomenality to most people. Denying phenomenality denies the truth of their report *as they understand it*.
      *   *Check:* (1) and (7). Yes, confirm redundancy.

