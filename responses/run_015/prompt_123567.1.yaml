      *(Self-Correction on the Single Revision)*: If I tell them to change (5), it might weaken their functionalism. If I tell them to change (6), it weakens their ethics. The *cheapest* fix is to clarify the definition of "functional role" in (5) to include dispositional/latent states, which validates (6). This preserves both commitments with minimal semantic shifting.

