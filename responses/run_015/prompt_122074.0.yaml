  Kant conceptualises truthful communication as a meta-game equilibrium wherein messages function as credible commitments. Within this coordination game, honest speech is treated as verifiable through social enforcement, whereas lying constitutes unverifiable cheap talk. The absolute prohibition operates as an equilibrium refinement, selecting the truth-telling strategy to prevent systemic collapse. In the murderer-at-the-door scenario—a one-shot interaction with asymmetric information—lying represents a locally optimal cheap talk message. However, Kant argues this deviation destabilises the broader equilibrium governing language-use, incurring prohibitive reputation costs in repeated interaction by undermining the mechanism's integrity.

  Translating this reveals significant residues. The systemic fragility of truth-telling maps cleanly to equilibrium stability conditions. However, treating the categorical imperative as an equilibrium-selection rule distorts Kant's claim of a priori rational necessity into a contingent stability condition. Moreover, mechanism design possesses no counterpart for duty independent of outcomes or equilibrium effects. Kant forbids lying regardless of consequences, whereas mechanism design evaluates strategies based on systemic efficiency. The formalisation instrumentalises truthfulness, whereas Kant treats it as an end in itself.

  Ultimately, the residue indicates mechanism design lacks a normative dimension rather than Kant's premises failing formalisation. Formalisation reduces moral obligation to strategic stability, omitting the intrinsic worth of rational agency. Kant's argument relies on premises regarding human dignity and autonomy that do not survive reduction to game-theoretic utility. While mechanism design explains the functional utility of truth-telling, it cannot capture the deontological obligation independent of systemic outcomes. The normative force of duty remains outside the mechanism's payoff structure, suggesting that rational choice theory cannot fully encapsulate moral law without remainder.
