answer: |-
  Your thesis survives, but the worst objection comes from the Constructivist or Type Theorist who will point out that Tier 1 isn't "philosophically free" because the Axiom of Choice implies Excluded Middle (Diaconescu's theorem), meaning you pay a logical cost even if you don't pay a computational one.

  ### Concessions (First 2 Minutes)
  *   **Admit Tier 1 isn't logically free:** Explicitly state that using `Classical.choice` in Lean commits you to Excluded Middle, even if it erases. You are arguing for *computational* freedom, not *logical* purity.
  *   **Admit tiers are proof-dependent:** Acknowledge that tiers are not properties of the theorem statement but of the specific proof term, and refactoring can shift them.
  *   **Admit AC is sometimes a theorem:** Concede that in dependent type theory without propositional truncation, AC is provable; your talk addresses the specific case where mathematicians use `Classical.choice` to move from `Prop` to `Type`.

  ### The Objections

  **1. The Constructivist / Type Theorist (Diaconescu's Theorem)**
  *   **They say:** "You claim Tier 1 is 'philosophically free' because it erases. But Diaconescu's theorem shows AC implies Excluded Middle. You haven't avoided the philosophical cost; you've just hidden the non-constructivity in the kernel."
  *   **You say:** "That's correct for logic, but irrelevant for extraction. I'm not defending constructive purity; I'm defending engineering safety. If the code erases, the runtime doesn't care about Excluded Middle. My claim is that for a software engineer, the computational cost is the only one that bills hours. If you need constructive logic, don't use Tier 1; if you need verified software, Tier 1 is safe provided you accept classical logic."
  *   **Weakness:** You concede the philosophical high ground. You are effectively saying "logic doesn't matter, only running code matters," which alienates the mathematicians.

  **2. The Type Theorist (AC is a Theorem)**
  *   **They say:** "In Martin-Löf Type Theory, AC is a theorem about sigma and pi types. You're attacking a strawman. The only reason it's an axiom in Lean is because of the Prop/Type distinction you're glossing over."
  *   **You say:** "Exactly. My tiers are specifically about that Prop/Type barrier. Tier 2 is when you stay in Type or have unique witnesses. Tier 1 and 3 are when you use `Classical.choice` to escape Prop. I'm not talking about raw MLTT; I'm talking about how mathematicians actually use Lean to formalize classical math where existence is truncated."
  *   **Weakness:** If you don't understand the sigma/pi swap deeply, you might stumble if they press on *why* truncation breaks the theorem.

  **3. The Verification Engineer (Swap-Invariance Undecidability)**
  *   **They say:** "You say Tier 3 is fine if it's swap-invariant. But checking whether a program's behavior is independent of a choice function is undecidable. How do I actually verify this? Your script flags it, but then what?"
  *   **You say:** "Same way you verify any semantic property: property-based testing. Run the extraction with different choice implementations (or random seeds) and check the golden tests. If the observable output doesn't change, you're good. It's not a static guarantee, it's a testing strategy, like checking for race conditions."
  *   **Weakness:** It turns a "theorem" into a "test." Hardline verifiers hate relying on testing for correctness claims.

  **4. The Lean Formalizer (Tier Stability)**
  *   **They say:** "Tiers aren't stable. I can refactor a Tier 1 proof into Tier 3 by exposing a witness I didn't know I needed. Your classification breaks whenever I change my mind about the API."
  *   **You say:** "That's true, but that's a feature, not a bug. It's like marking a function `noncomputable`. If you refactor and suddenly need the witness, the linter screams. It tells you exactly where your abstraction boundary broke. It's a warning system, not a static type."
  *   **Weakness:** Makes your tool sound like a glorified linter rather than a philosophical framework.

  **5. The Philosopher (Changed Subject)**
  *   **They say:** "You've redefined 'truth' as 'computational safety.' The axiom of choice is about whether mathematical objects exist, not whether your binary runs. You haven't solved the problem; you've just changed the subject to engineering."
  *   **You say:** "For proof engineering, that *is* the subject. We aren't doing platonism; we're building artifacts. If the question 'is it true' doesn't map to 'does it compile/run,' then for my purposes, it's the wrong question. I'm offering a framework for people who have to ship code."
  *   **Weakness:** Risks dismissing the philosopher entirely, which can make you look anti-intellectual to the room.

  **6. The Lean Formalizer (Convenience)**
  *   **They say:** "Why bother? `Classical.choice` is convenient. If it erases, why should I care which tier it's in? I just want to prove the lemma."
  *   **You say:** "Because you might want to extract later. If you build a tower of Tier 1 choices and then decide you need to run the thing, you have to rewrite everything. My tool tells you early when you're painting yourself into a corner. It's technical debt management."
  *   **Weakness:** Many mathematicians in the room genuinely don't care about extraction. They might view this as solving a problem they don't have.

  **7. The Type Theorist (Reduction)**
  *   **They say:** "Tier 1 choices block reduction in the kernel. You can't even compute `2 + 2` if it depends on a classical choice. It's not just about extraction; it breaks the workflow inside the prover."
  *   **You say:** "True, and that's why Lean marks them `noncomputable`. My script just aggregates those marks to show you the scope. If you need reduction for debugging, you need Tier 2. If you don't, Tier 1 is fine. Know which one you're using."
  *   **Weakness:** This is already known behavior in Lean. You might not be adding new insight here.

  **8. The Mathematician (Banach-Tarski)**
  *   **They say:** "You refused to talk about Banach-Tarski. But that's the classic example of choice going wrong. Why ignore it?"
  *   **You say:** "Banach-Tarski is about measure theory and non-measurable sets, not about whether the choice function executes in code. It's a Tier 1 ghost choice—it doesn't produce a binary that moves balls around. It's a distraction for engineers because it doesn't affect extraction."
  *   **Weakness:** Might look like you're avoiding the most famous counter-intuitive result because you can't explain it well.

  ### The Must-Land Reply
  **The Distinction Between Erasure and Logical Strength:**
  You must successfully separate *computational content* (what ends up in the binary) from *logical strength* (what axioms are needed to prove it). If you conflate these, the Type Theorist and Constructivist will eat you. Your mantra: "Erasure saves the runtime, not the logic."

  ### The Question You Hope Nobody Asks
  **"Can you formally define swap-invariance within the logic itself, or is it external?"**
  *   **Why it scares you:** If it's external, it's not a formal guarantee. If it's internal, you're likely running into Rice's Theorem or undecidability issues that require a much heavier theoretical framework than you've presented.
  *   **Backup:** "It's external meta-theory. Just like 'terminates' or 'safe memory access' in C++. We verify it with tooling and tests, not inside the logic."
