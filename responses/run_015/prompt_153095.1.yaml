  **INTERMUNICIPAL COMMISSION FOR THE CHARTER OF COLLECTIVE MEMORY**
  **OFFICE OF THE LITERARY REPRESENTATIVE**

  **TO:** The Commissioners, The Intermunicipal Council
  **FROM:** Dr. Elara Vance, Literary Representative
  **DATE:** October 17, 2023
  **SUBJECT:** OPINION 23-04: Delimitation of the Demos for the Maréval Charter

  **I. MANDATE AND PHILOSOPHICAL CONTEXT**

  This Commission operates under an extra-legal mandate. We are not adjudicating state citizenship, nor are we redistributing administrative resources. Our task is ontological: to define the *demos* authorized to speak for Maréval. 

  Maréval exists now only as a cultural boundary superimposed upon a juridical void. Thirty years after its administrative dissolution, the legal territory has been absorbed, but the narrative territory remains contested. The central philosophical challenge we face is the "Boundary Problem of Memory": *Who constitutes the "people" when the polity they belong to no longer legally exists?*

  To grant voice is to grant the power to define absence. To silence is to decide whose grief is private and whose grief is public. This opinion outlines a tiered deliberative arrangement that prioritizes narrative continuity over territorial occupancy, without rendering the current inhabitants of the land mere strangers in their own homes.

  **II. ASSESSMENT OF CLAIMS**

  Three groups assert deliberative membership. Their claims rest on distinct modes of belonging:

  1.  **Present Legal Residents:** Their claim rests on *territorial continuity*. They argue that memory requires a living community to inhabit it; without the residents, the Charter becomes a museum exhibit rather than a living covenant.
  2.  **Dispersed Descendants:** Their claim rests on *narrative citizenship*. They argue that Maréval's dissolution is the "structuring absence" of their identity. They are the primary subjects of the history to be written.
  3.  **Archival Witnesses:** Their claim rests on *epistemic stewardship*. They hold the physical remnants of the erased state. They argue they speak not for the living, but as proxies for the dead, ensuring the narrative is not colonized by presentist myths.

  **III. RECOMMENDATION: THE TRI-TIERED COLLEGIUM**

  The Commission recommends rejecting a "one person, one vote" model based on current residency. Such a model would conflate the *successor municipality* with *Maréval*, effectively completing the administrative erasure through demographic dilution. Conversely, granting exclusive authority to Descendants risks creating a narrative unmoored from the physical territory.

  Therefore, we propose a **Tri-Tiered Collegium** with differentiated powers:

  **Tier 1: The Constituent Body (Voting Authority on Narrative Content)**
  *   **Composition:** Dispersed Descendants (verified by lineage or long-standing community identification) and Archival Witnesses.
  *   **Weighting:** 
      *   Dispersed Descendants: 60% of the vote.
      *   Archival Witnesses: 40% of the vote.
  *   **Powers:** Sole authority to draft, amend, and finalize the text of the Charter of Collective Memory.
  *   **Special Provision:** The Archival Witnesses hold a **Factual Veto**. They may not block a narrative interpretation, but they possess unilateral authority to reject any assertion contradicted by preserved primary evidence. This prevents the Charter from becoming fiction.

  **Tier 2: The Stewards of Place (Consultative Authority & Implementation Veto)**
  *   **Composition:** Present Legal Residents (current registered voters of the merged municipality).
  *   **Weighting:** Non-voting on the *text* of the Charter.
  *   **Powers:** 
      1.  **Right of Response:** Mandatory inclusion of a "Contemporary addendum" in the Charter document, written by the Residents, detailing how the memory of Maréval intersects with their current civic reality.
      2.  **Implementation Veto:** While they cannot dictate the *memory*, they hold veto power over the *materialization* of that memory (e.g., placement of monuments, naming of streets, integration into school curricula) if such materialization demonstrably impairs current civic function or social cohesion.

  **IV. JUSTIFICATION AND TREATMENT OF THE EXCLUDED**

  This arrangement effectively excludes Present Legal Residents from the *constitutive* act of defining Maréval's past. We do not make this recommendation lightly, nor do we dismiss the Residents' claim. 

  The strongest argument for the Residents is that **memory without a host is a ghost.** A Charter of Collective Memory that is rejected by the people currently walking the streets of Maréval fails in its primary function: to bind a community to its place. If the Residents are treated merely as landlords to a history they did not inherit, the Charter risks becoming a source of resentment rather than reconciliation. They argue that for memory to survive, it must be adopted by the living, not just inherited by the exiled.

  We accept this premise as valid, which is why the Residents are granted the **Implementation Veto** and the **Right of Response**. However, we must maintain the boundary between *inheriting a place* and *inheriting a story*. To grant Residents equal voting power on the narrative content would be to allow the successor state to write the history of the predecessor state. This is the mechanism by which erasure is finalized. The Residents are the *guardians of the site*, but the Descendants and Witnesses are the *guardians of the soul*. The Charter must reflect the soul of Maréval, even if the site has changed hands.

  **V. IMPLEMENTATION TIMELINE**

  To ensure readiness for the upcoming administrative cycle, the following timeline is proposed:

  *   **Phase 1: Verification (Months 1-3)**
      *   Establishment of the "Registry of Narrative Citizenship." 
      *   Descendants submit genealogical or testimonial evidence of connection to pre-dissolution Maréval.
      *   Witnesses submit inventory of held archives for validation.
      *   *Deadline:* January 15.

  *   **Phase 2: Drafting Assembly (Months 4-9)**
      *   First convening of the Constituent Body (Descendants + Witnesses).
      *   Concurrent "Town Hall" series for Present Residents to gather concerns for the Right of Response.
      *   *Deadline:* June 30.

  *   **Phase 3: Review and Ratification (Months 10-12)**
      *   Draft Charter presented to the Stewards of Place (Residents).
      *   Exercise of Implementation Veto (if necessary) and drafting of the Contemporary Addendum.
      *   Final Signatory Ceremony.
      *   *Deadline:* October 1, 2024.

  **VI. CONCLUSION**

  We are drawing a boundary around a ghost. In doing so, we must acknowledge that every line we draw creates an inside and an outside. By prioritizing the Dispersed Descendants and Archival Witnesses, we acknowledge that Maréval is no longer a place on a map, but a place in time. By granting Present Residents the power of Implementation, we acknowledge that time must eventually yield to place.

  This tiered arrangement ensures that the Charter remains a testament to what was lost, without becoming a weapon against what now exists. It allows us to remember Maréval without demanding that the current inhabitants pretend to be someone they are not.

  **Recommendation:** Adoption of the Tri-Tiered Collegium model as outlined above.

  **Signed,**

  Dr. Elara Vance
  Literary Representative
  Intermunicipal Commission for the Charter of Collective Memory
