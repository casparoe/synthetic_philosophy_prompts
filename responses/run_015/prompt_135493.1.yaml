  You speak of instruments that whisper different secrets to each ear, imagining this variety saves us from the crowd. But do not mistake the multiplication of mirrors for the emergence of a face. The danger lies not in what is read, but in the spirit in which it is received.

  This so-called particularization is merely leveling refined to its most poisonous degree. My critique concerns not the uniformity of content, but the abstraction of the self. When this instrument feeds you only what aligns with your existing passions, it spares you the pain of choice and the risk of commitment. You remain in reflection, circling your own preferences, never forced into the decisive moment where the single individual stands before God. The crowd is not merely many people thinking alike; it is the evasion of responsibility through anonymity. Even in your isolated cell, you are anonymous to yourself, hidden behind the curation of the apparatus. You possess opinions, not convictions. The fragmentation multiplies the mirrors of reflection but extinguishes the light of action. Thus, the structure remains one of abstraction: the self is dispersed into possibilities rather than gathered into existence. This apparatus is the perfect servant of the present age, ensuring no one encounters the Offense that might wake them from their dreaming spirit.

  I defend my critique's universality without revision. The technical mechanism is irrelevant; spiritual categories are decisive. Whether the press shouts one word to millions or whispers a thousand to one, the evil is that it removes the requirement for personal appropriation. Your isolated compartments are not particularity; they are tailored cages of reflection preventing the leap. True particularity is found only in the ethical relation to the Eternal, not aesthetic sorting. To claim this solves the problem confuses comfort with salvation. The crowd persists because the individual refuses to become a Single Individual, regardless of the uniqueness of his portion.
