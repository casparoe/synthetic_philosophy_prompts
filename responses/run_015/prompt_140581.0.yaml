answer: |-
  ### 1. The Question

  Emotions are standardly analysed as: (1) **Judgements** (evaluative assessments akin to beliefs); (2) **Perceptions** (presentations of value akin to sensory experience); or (3) **Feelings** (bodily or affective states).

  Consider the analogy of a measurement device: it tracks a quantity, undergoes a physical change, presents a readout, and allows a user verdict.

  (a) Are (1)–(3) genuine rivals, or descriptions of different elements in this structure? Locate any genuine conflict.

  (b) Consider correctness conditions. Case (i): You judge flying safe but feel fear. Case (ii): A creature's fear responds to feature F, once dangerous but now safe. In each, what misfires? Which theory struggles?

  (c) Consider dissociation. Subject P shows fear behaviour/physiology but reports no felt quality. Subject Q has fear physiology in safe contexts, changes no plans, reports no object. Do P or Q have emotions? For each theory, is this a cost or entailment?

  (d) What follows for whether infants or rats have emotions?

  Argue for a determinate view on whether the dispute between (1)–(3) is substantive or merely verbal.

  ***

  ### 2. Examiner's Note

  This question discriminates between candidates who treat the three theories as mutually exclusive labels (competent) and those who use the measurement analogy to integrate them into a functional architecture (first-class). The first-class answer will identify that the dispute is partly verbal regarding terminology but substantive regarding which element is essential for intentionality (aboutness).

  ***

  ### 3. Model Answer

  The three theories are not genuine rivals but rather describe distinct components of a single functional system, analogous to the measurement device. The Feeling theory describes the physical change in the device (the bodily state). The Perception theory describes the readout (the presentation of value). The Judgement theory describes the user verdict (the endorsed assessment). The dispute is largely verbal regarding which component deserves the label "emotion," but it becomes substantive when asking which component is indispensable for intentionality (the property of being *about* something).

  Regarding correctness conditions, Case (i) (fear of flying despite judging it safe) embarrasses the Judgement theory. If emotions are judgements, one cannot sincerely hold contradictory judgements without irrationality. The Perception and Feeling theories dissolve this: the "readout" or "physical change" can conflict with the "user verdict" without logical contradiction. Case (ii) (mis-calibrated fear of feature F) embarrasses the Feeling theory. If emotions are merely bodily states, the physiology is functioning perfectly; nothing is "wrong." The Perception theory handles this best: the device is mis-tracking reality. The quantity tracked (danger) differs from the proxy (F). Thus, Perception offers the best account of correctness conditions.

  Regarding dissociation, Subject P (physiology without felt quality) poses a cost to the Feeling theory, which must deny P has emotions despite behavioural competence. Subject Q (physiology without object or plan) poses a cost to the Judgement and Perception theories, which require an object of evaluation. If Q's state is not *about* anything, it lacks intentionality. The Feeling theory can accommodate Q as a raw affect, but at the cost of severing emotion from action.

  This dictates the view on non-conceptual creatures. If Judgement is essential, rats cannot have emotions, as they lack concepts to form assessments. If Perception or Feeling is essential, rats can have emotions. Given that rats navigate danger successfully (tracking quantities) without complex concepts, the Judgement requirement is too restrictive. However, without any perceptual presentation of value, the state is merely mechanical.

  Therefore, the dispute is partly verbal. All three elements exist. However, the Perception element is indispensable. A system can track value without conscious judgement (allowing for rats) and without distinct felt qualia (allowing for P), but it cannot have emotions if it does not present the environment as having evaluative properties. The Judgement element is optional (often overridden); the Feeling element is contingent (varying by species); the Perceptual tracking is essential.

  *(Note on contested characterisation: This answer assumes the Perception theory allows for non-conceptual content, which some proponents deny, and assumes the Feeling theory cannot account for intentionality without augmentation.)*

  ***

  ### 4. Marking Scheme

  | Criterion | Marks | First-class move | Failure mode |
  | :--- | :--- | :--- | :--- |
  | **Theory & Analogy** | 5 | Maps the three theories onto the four elements of the measurement analogy to show compatibility. | Treats the three theories as mutually exclusive without qualification. |
  | **Correctness Cases** | 5 | Identifies which theory struggles in Case (i) vs Case (ii) based on tracking vs verdict distinctions. | Claims one theory solves both cases perfectly without adjustment. |
  | **Dissociation & Creatures** | 5 | Links the verdict on P/Q to the capacity for non-conceptual intentionality in rats/infants. | Treats the rat/infant question as an afterthought unrelated to the P/Q analysis. |
  | **Argumentative Cohesion** | 5 | Delivers a determinate verdict on whether the dispute is verbal or substantive, justified by previous steps. | Concludes neutrally that "all theories have merits" without resolving the prompt's core question. |
  | **Total** | **20** | | |

  ***

  ### 5. Critique of Model Answer

  | Load-bearing claim | Strongest objection | Defeater | Credit |
  | :--- | :--- | :--- | :--- |
  | The dispute is partly verbal because all three elements exist in the system. | The theories are metaphysical claims about essence, not functional descriptions; identifying parts doesn't resolve what the emotion *is*. | Show that identifying the parts leaves the ontological status of the emotion undetermined. | 4 marks (capped), as this challenges the core analogy rather than its application. |
  | Perception is indispensable; Judgement is optional. | Without the capacity for judgement (even potential), a state cannot have correctness conditions (truth/falsity). | Establish that non-conceptual states cannot be "correct" or "incorrect," only causal. | 3 marks, as this targets the definition of correctness used in the answer. |
  | Rats have emotions because they track value without concepts. | Tracking value is merely causal regulation; emotion requires a subjective perspective on that value. | Demonstrate that causal regulation is insufficient for the phenomenology required by the concept "emotion." | 3 marks, as this targets the extension of the concept to non-humans. |

  ***

  ### 6. Feasibility Note

  I judge that the three requirements cannot be fully done justice in a single hour. The cognitive load of integrating the measurement analogy, analysing four distinct cases (two correctness, two dissociation), and deriving implications for non-human animals risks superficiality. I would drop the specific requirement to analyse **both** dissociation subjects (P and Q) in detail. Instead, I would ask candidates to choose **one** dissociation case and analyse it deeply. This would allow space for the nuanced argument regarding the verbal vs. substantive nature of the dispute, which is the philosophical heart of the question, without forcing students to rush the implications for non-conceptual creatures.
