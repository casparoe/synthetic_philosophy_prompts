      *   **Applying to Cases:** Walk through the user's list. Show where it fits.
      *   **The Cost (What to Drop):** Identify which intuitions conflict. (Likely the Akrasia one and maybe the Crowd one needs nuance).
      *   **The Hard Case (Case 9):** Give a definitive answer based on the principle.
      *   **The Email/Akrasia:** Address the belief/action split.

  8.  **Refining the Principle Statement:**
      "Higher-order evidence defeats first-order belief only when it provides **independent reason to suspect a specific, contingent malfunction** in the process that produced the belief, without undermining the process used to assess the higher-order evidence."

      *Key components:*
