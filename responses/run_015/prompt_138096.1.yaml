      *Answer:* No, not if you accept the HOE as a defeater. But you can have *residual* confidence from the first-order evidence while acknowledging the HOE lowers the *justification*. This is the "Level Split."

      *Wait, Case 7 (Email).* Why not redo? Because the *action* was rational *ex ante*. HOE arrived *ex post*. This suggests a principle about *Timing*.
