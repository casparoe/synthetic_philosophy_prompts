      "HOE mandates belief revision only when it identifies a local, contingent distortion in the cognitive process that produced the belief, without undermining the cognitive process used to evaluate the HOE itself."

      *Critique:* This handles 1 vs 5 well. It handles 4 (Drunk guy is noise, not a reliable indicator of *my* state). It handles 2 vs 3 (Expert implies competence, Crowd implies noise).
