answer: |-
  Here is a principle designed to fit your gut verdicts, followed by the costs it exacts and the verdict it forces on your hardest case.

  ### The Principle: Local Independent Defeat

  **Higher-order evidence (HOE) rationally requires you to revise your confidence if and only if it identifies a *specific, contingent* distortion in your current cognitive process, sourced from a *competent, independent* vantage point.**

  This principle has three filters. HOE must pass all three to force a downgrade:
  1.  **Specificity:** It must target a local malfunction (fatigue, bias, drug), not global reliability (reasoning itself).
  2.  **Contingency:** The distortion must be an abnormal state for you, not a background condition of your existence.
  3.  **Independence:** The source of the HOE must not rely on the same compromised faculty or framework it is critiquing.

  ---

  ### How It Fits Your Cases

  *   **Case 1 (30 Hours Awake):** **PASSES.**
      *   *Specific:* Fatigue affects calculation.
      *   *Contingent:* You aren't always awake for 30 hours.
      *   *Independent:* Knowing the time (clock) doesn't require doing the math.
      *   *Verdict:* **Downgrade.** (Matches your gut).

  *   **Case 2 (One Expert):** **PASSES.**
      *   *Specific:* They checked the math.
      *   *Independent:* Their brain is separate from yours.
      *   *Competent:* You respect them.
      *   *Verdict:* **Downgrade.** (Matches your gut).

  *   **Case 3 (1000 Online People):** **FAILS (Competence).**
      *   *Independent:* Yes.
      *   *Specific:* Yes.
      *   *Competent:* Low probability. "Online people" is a noisy signal compared to "Respected Expert." Quantity doesn't fix low reliability.
      *   *Verdict:* **Minimal Move.** (Matches your gut).

  *   **Case 4 (Drunk Guy):** **FAILS (Competence/Independence).**
      *   The source is unreliable. His claim that you are drunk is screened off by his own state.
      *   *Verdict:* **No Move.** (Matches your gut).

  *   **Case 5 (Reasoning Unreliable Full Stop):** **FAILS (Specificity/Contingency).**
      *   This is global skepticism. If reasoning is unreliable, the reasoning used to process *that* HOE is also unreliable. It self-destructs.
      *   *Verdict:* **No Move.** (Matches your gut).

  *   **Case 6 (Overcorrection Study):** **PASSES (Partially).**
      *   This is recursive HOE. The principle suggests you treat the study as independent data *until* you have reason to think the study itself is subject to the bias.
      *   *Verdict:* **Partial Downgrade.** You adjust for the bias, but you don't adjust for the adjustment unless given specific reason to. (Resolves the circle).

  *   **Case 7 (Email Sent):** **PASSES (Belief/Action Split).**
      *   The principle governs *credence* (belief), not *practical commitment* (action). Your action was rational *ex ante* (before the HOE). Your belief must be rational *ex post* (after the HOE).
      *   *Verdict:* **Lower Confidence, Keep Action.** (Matches your gut).

  ---

  ### The Costs: What You Must Drop

  To keep this principle, you have to abandon one intuition:

  **Case 8 (Sensible Akrasia):** *"I end up still believing the thing at full strength while thinking I shouldn't."*

  The principle forces you to call this **irrational**.
  If the HOE passes the three filters (like Case 1), it *defeats* the justification for the belief. You cannot rationally hold the belief at full strength while accepting the defeater.
  *   **The Fix:** You can acknowledge that the first-order evidence *feels* compelling (the math still looks like 47), but your *credence* (your betting odds, your asserted confidence) must drop. You are allowed to feel the tension, but you are not allowed to maintain full belief. There is no "sensible akratic believer," only a believer struggling against their own better judgment.

  ---

  ### The Hard Case: Universal Training (Case 9)

  *The Scenario:* You learn everyone in your field, including the expert, was trained to make exactly your mistake. There is no outside arbiter.

  **The Principle's Verdict:** **Treat it like Case 5 (No Move).**

  **Why?**
  It fails the **Independence** filter.
  To accept this HOE, you have to trust the historical/sociological claim that "we are all biased." But assessing that claim requires reasoning. If the bias is truly universal within your framework, it infects your assessment of the bias itself.
  *   If the report comes from *inside* the field: It is contaminated.
  *   If the report comes from *outside* the field: They lack the competence to judge the math (fails Case 3 filter).

  **The Implication:**
  This is the boundary where HOE turns into Global Skepticism. Since you have no "God's eye view" to confirm the training is a *mistake* (rather than just a different paradigm), you cannot rationally downgrade based on it alone. You must continue to trust your reasoning until you find a specific, independent check (like a new experimental result that contradicts the training).

  **Does this feel right?**
  It should feel uncomfortable. It implies that when a whole paradigm is wrong, the participants are rationally justified in continuing to believe it until the world forces a contradiction. The principle prioritizes *internal coherence* over *external truth* in the absence of an independent arbiter.

  ### Summary
  *   **Principle:** Local Independent Defeat.
  *   **Matches:** Cases 1, 2, 3, 4, 5, 6, 7.
  *   **Forces Change:** Case 8 (Akrasia is irrational; confidence must drop).
  *   **Solves Case 9:** Treat as noise/global skepticism. You cannot use a compromised system to certify its own compromise without an external anchor.
