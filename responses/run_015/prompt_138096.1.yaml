      The principle should focus on *Rational Credence*, not necessarily *Action*.

  6.  **Developing the "Calibration + Independence" Principle:**
      Let's synthesize. The core tension is between "I see the math" (1st order) and "I am tired" (2nd order).
      The principle needs to be: **HOE acts as a defeater only when it is more reliable than the first-order process it targets, without relying on that same process for its own validation.**

