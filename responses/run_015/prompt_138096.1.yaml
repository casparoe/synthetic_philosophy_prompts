      *Proposed Principle:* **The Specific Independent Defeater Principle.**
      Higher-order evidence rationally requires belief revision if and only if:
      1.  It points to a *specific* causal factor affecting the current judgment (not global skepticism).
      2.  The source of the HOE is *independent* of the error being flagged (avoids circularity).
