answer: |-
  Here is the verdict: **There is no single consistent preference ordering that satisfies all your cases.** Specifically, Case 6 (200 copies: batch vs. sequential) combined with Case 1 (Allais) creates a **Dynamic Inconsistency**. You prefer the aggregate outcome of the risky strategy but choose the sure strategy at every decision node without pre-commitment. In normative decision theory, this makes you vulnerable to a "money pump" (you would pay to switch to the batch view, then pay to switch back to sequential, ending up where you started but poorer).

  However, you asked for a **principle that fits your verdicts**, not a lecture on normative consistency. To do this, we must abandon the idea of a static utility function and adopt a **Procedural Decision Algorithm**. This algorithm uses Prospect Theory mechanics but adds specific **Framing and Integration Rules** that switch based on how the choice is presented (temporal spacing, aggregation, domain).

  Here is the principle, clause by clause, tied to your cases.

  ### The Principle: Contextual Rank-Dependent Utility with Myopic Sequential Evaluation

  **Clause 1: Probability Weighting (The Allais Engine)**
  *   **Rule:** Do not evaluate probabilities linearly. Apply a weighting function $w(p)$ that is inverse-S shaped: overweight small probabilities and overweight probabilities near 1 (certainty).
  *   **Mechanism:** $V = \sum w(p_i) \cdot u(x_i)$.
  *   **Tied to:** **Case 1 & 2.** This generates the Allais violation. The drop from 100% to 89% (or 11% to 0%) is weighted much more heavily than the drop from 89% to 78% (or 10% to 1%).
  *   **Tied to:** **Case 3.** The 1% chance of \$0 is overweighted significantly compared to the 1% chance of \$5M. The "fear of zero" drives the sure thing in Case 1, but when the downside is removed (99% \$1M / 1% \$5M), the weighting favors the upside.
  *   **Prediction (Tiny Probabilities):** If you change 10% vs 11% to 0.0009 vs 0.001, the weighting function usually flattens or reverses (overweighting the tiny chance). You would likely **switch to the Risky option** in the low-probability version of Case 1, as the "certainty effect" vanishes when neither option feels certain.

  **Clause 2: Integration Mode (The Aggregation Switch)**
  *   **Rule:** Evaluate outcomes based on the **Presentation Frame**.
      *   **Batch Frame:** If $N$ gambles are presented simultaneously as a single portfolio, evaluate the utility of the *aggregate distribution* $U(\sum X_i)$. By the Law of Large Numbers, variance drops, and you become risk-neutral.
      *   **Sequential Frame:** If $N$ gambles are presented one at a time, evaluate the utility of the *single step* $u(x_t)$ myopically. Do not integrate past or future outcomes into the current reference point unless you have a pre-commitment device.
  *   **Tied to:** **Case 5 vs. Case 6.**
      *   Case 5 (10,000 people/copies): Treated as Batch Frame. Variance vanishes. You take the Risky option (higher EV).
      *   Case 6 (200 copies now): Treated as Batch Frame. You take the Risky option.
      *   Case 6 (200 mornings): Treated as Sequential Frame. You evaluate each morning in isolation. Due to Clause 1 (concavity/weighting near certainty), you take the Sure thing.
  *   **Honesty Check:** This clause explicitly violates **Dynamic Consistency**. You acknowledge you will choose a dominated aggregate path in the Sequential Frame. The principle accepts this as a feature of your cognition, not a bug to be fixed.
  *   **Prediction (Memory Wipe):** If you face the 200-morning case but have your memory wiped each night (no knowledge of past wins/losses), your reference point resets daily. You remain in **Sequential Frame**. You take the **Sure thing** every time.

  **Clause 3: The Zero/Ruin Threshold (The Safety Clause)**
  *   **Rule:** If an outcome involves a non-zero probability of receiving **nothing** ($0) when a **sure positive** was available, apply a penalty factor $\lambda > 1$ to the disutility of the zero outcome. This is distinct from standard loss aversion; it is a "disappointment/ruin" aversion.
  *   **Tied to:** **Case 1 vs. Case 4.**
      *   Case 4 (90% \$1M / 10% \$5M): No risk of zero. Dominance applies. You take the gamble.
      *   Case 1 (89% \$1M / 10% \$5M / 1% \$0): Risk of zero exists. The penalty $\lambda$ activates. You take the Sure thing.
  *   **Tied to:** **Case 3.** You pay \$2k to remove the 1% risk of \$0 (avoiding $\lambda$), but you don't pay to upgrade 99% \$1M to 99% \$1M/1% \$5M because no zero-risk is introduced.
  *   **Prediction (Scaling Stakes):** If you scale \$1M to \$1B, $\lambda$ increases. You become **more** entrenched in the Sure thing for Case 1. If you scale \$3k to \$3M, the violation in Case 2 strengthens to match Case 1.

  **Clause 4: Ambiguity Dampening (The Urn Clause)**
  *   **Rule:** If probabilities are unknown (ambiguous), replace the weighted probability $w(p)$ with $w(p) \cdot (1 - \alpha)$, where $\alpha$ is a measure of ambiguity aversion. Prefer known risks over unknown risks even if the known risk includes the "zero" outcome.
  *   **Tied to:** **Case 8.** You take the sure thing *more* strongly when the urn composition is unknown. The ambiguity amplifies the weighting of the worst-case scenario (Maxmin logic).
  *   **Prediction:** If you are told you *can* learn the true composition before choosing, you will pay to learn it (to reduce $\alpha$), whereas in the known case, you might pay to *avoid* knowing the resolution (if suspense were a factor, but Case 7 rules that out).

  **Clause 5: Domain Separation (The Lives Clause)**
  *   **Rule:** Switch utility functions based on the **Domain of Impact**.
      *   **Personal Finance:** Use Clauses 1–4 (Prospect Theory + Safety Threshold).
      *   **Statistical Lives (Veil of Ignorance):** Use Expected Utility (Risk Neutral). Maximize expected lives saved.
      *   **Identified Lives:** Use Deontological Constraint. Minimize the probability of *any* death for the specific individual, or minimize the "regret" of allowing a preventable death.
  *   **Tied to:** **Case 10.**
      *   Veil of Ignorance: You are effectively in a "Batch Frame" over the population. You take the Risky option (5,000 expected vs 1,000 expected).
      *   Identified Stranger: You are in a "Sequential/Single" frame with a specific victim. The "Zero/Ruin Threshold" (Clause 3) applies to *their* life. You cannot accept a 1% chance of them dying (0 saved) when 1,000 could be saved for sure.
  *   **Prediction:** If the "Identified Stranger" is replaced by a group of 1,000 identified strangers (e.g., a specific trapped mining crew), you will likely revert to the **Sure Thing** (save the 1,000 you can guarantee) rather than risking them all for 5,000, due to the "Responsibility Aversion" scaling with identifiability.

  ---

  ### Implementation & Predictions

  Here is how this algorithm handles the specific edge cases you requested:

  **1. Scaling Stakes by 1,000 (\$1M $\to$ \$1B)**
  *   **Verdict:** **Sure Thing becomes stronger.**
  *   **Reason:** Clause 3 (Zero/Ruin Threshold). The psychological distance between "Life Security" and "Ruin" widens. The penalty $\lambda$ increases. The Allais violation intensifies.

  **2. Pushing Probabilities to 0.001 vs 0.0009**
  *   **Verdict:** **Violation Disappears (You take the Risky option).**
  *   **Reason:** Clause 1 (Probability Weighting). The "Certainty Effect" relies on the proximity to $p=1$. At $p \approx 0$, the weighting function $w(p)$ is typically convex (overweighting small probabilities). The difference between 0.001 and 0.0009 is perceived as significant, but the "safety" of the sure thing is gone. Both feel like lotteries. You chase the higher upside.

  **3. The 200-Mornings Case (Prospect Theory Check)**
  *   **Your Question:** *Tell me what Prospect Theory predicts in the 200-mornings case.*
  *   **The Answer:** Standard Prospect Theory is static. It depends on **Framing**.
      *   If framed as **200 separate decisions** (Narrow Framing): PT predicts **Sure Thing**. The value function is concave for gains. $200 \times v(\$1M) > 200 \times [0.9v(\$1M) + 0.1v(\$5M)]$.
      *   If framed as **1 aggregate decision** (Broad Framing): PT predicts **Risky Option**. The distribution of the sum is approximately normal. The concavity smooths out over the aggregate.
      *   **Your Verdict:** You match PT with **Narrow Framing** for the sequential case.
      *   **The Cost:** You are admitting to **Myopic Loss Aversion**. You know that if you could bind your future selves, you would. Since you can't, the algorithm dictates you satisfy your current self's risk aversion each morning.

  **4. Memory Wipe (Future Self)**
  *   **Verdict:** **Sure Thing.**
  *   **Reason:** Clause 2 (Integration Mode). Without memory, you cannot integrate outcomes. You are forced into Sequential Frame. You cannot learn that "taking the risk paid off on average." You face the Allais paradox fresh every morning.

  ---

  ### The Bill: What You Are Giving Up

  You asked for an honest list of which verdicts survive and what must be sacrificed.

  1.  **Dynamic Consistency is Dead:** You cannot claim your choices are "rational" in the game-theoretic sense. In Case 6, you prefer the *path* of 200 Risks but choose the *step* of Sure. If a counterparty offered you a contract: "I will force you to take the Risky option for 200 days for a fee of \$10,000," you would accept it today (preferring the aggregate). But tomorrow, when the first choice comes, you would pay to break the contract (preferring the Sure thing). **You are vulnerable to a money pump.**
  2.  **Transitivity Across Contexts:** Your preference between Option A and Option B depends on whether they are presented in a batch or sequentially. $A \succ B$ in Batch, but $B \succ A$ in Sequential. This violates the axiom of **Description Invariance**.
  3.  **No "True" Risk Tolerance:** You do not have a single risk parameter. You have a risk parameter for "Life Security" (Case 1), a different one for "Pocket Change" (Case 2), and a third for "Portfolio Management" (Case 5). You cannot be modeled as a single expected-utility maximizer.

  ### Summary Verdict

  Your intuition is **procedurally consistent** but **normatively inconsistent**.

  *   **Principle:** Contextual Rank-Dependent Utility with Myopic Sequential Evaluation.
  *   **Key Switch:** **Integration Mode.** (Batch = Risk Neutral; Sequential = Risk Averse).
  *   **Key Driver:** **Zero/Ruin Aversion.** (The 1% chance of \$0 hurts more than the 1% chance of \$5M helps).
  *   **Honest Trade-off:** You are buying **Peace of Mind** (local certainty) at the cost of **Global Efficiency** (aggregate expected value). You are willing to pay a premium (in forgone EV) to avoid the feeling of "I could have had \$1M for sure and I got nothing" in the moment, even if you know that over 200 moments, the gamble wins.

  If your reading group demands a single axiom system, tell them: **"I am not an Expected Utility maximizer. I am a Rank-Dependent Utility maximizer with Narrow Framing constraints."** That is the precise technical description of your verdicts.
