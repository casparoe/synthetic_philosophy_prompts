  Friends, colleagues, family, and students.

  We gather here to mourn Elena Vance. To speak her name is to summon a specific kind of intellectual intensity. For those of us who knew her in the department, Elena was not merely a philosopher; she was a force of normative gravity. She demanded clarity. She demanded consistency. And above all, she demanded that we understand the conditions under which we are entitled to speak to one another as moral agents.

  Her central contribution, the "standing condition," taught us that blame is not just a judgment of fact; it is a moral address. It is a claim of authority. She argued that when we violate a norm ourselves, we lose the standing to invoke that norm against others. To blame another for a wrong you willingly commit is not just awkward; it is inappropriate. It is a repudiation of the very community of morality you claim to represent.

  We are here also in the shadow of the letter Elena left behind. We know the revelations of the last month. We know that the private architecture of her life did not match the public rigor of her work. To pretend otherwise would be to insult her intelligence, and to insult yours.

  There is a profound irony, painful to all of us, that Elena's life has become the final case study for her own theory. By her own standards, during those twenty years, she lacked the standing to blame colleagues for financial dishonesty. Her accusations, however factually accurate, were morally compromised by her own conduct. She would be the first to tell us this. In fact, I suspect she knew it better than any of us.

  To the university administrators present: norms matter. Rules matter. The resources of this institution are a trust, and when that trust is violated, there are consequences. Elena understood the weight of institutional integrity better than anyone. She lived with the burden of having undermined it, even as she sought to uphold it elsewhere. We cannot separate the violation from the woman.

  But to reduce Elena to this violation is to miss the tragedy of her life, which was not a simple failure of character, but a collision of duties. We know now that the funds she diverted were not for luxury. They were for a sibling whose care was otherwise impossible. She faced a choice that no moral theory fully resolves: the conflict between institutional honesty and familial love. She chose her family. She paid for it with her standing. She paid for it with the coherence of her public voice.

  To her family: I know you knew the burden she carried. You knew the love that drove her. I want you to know that while her methods were flawed, the devotion that motivated them was real. She protected her brother when the world would not. That love was not hypocritical. It was the one thing she did not apologize for.

  To her students, current and former: You are reeling. You are asking how to read her work now. How do you study the ethics of blame from a woman who lost her standing to blame?

  Here is what I offer you. Elena's work was never about her. It was about the norms. The truth of a moral principle does not depend on the purity of the person stating it. The standing condition teaches us to look at the relationship between the speaker and the norm. When you read her papers, you will see that tension lived out on the page. She was mapping the very fragmentation she experienced. Her work survives not because she was perfect, but because she was honest about the requirements of morality, even when she could not meet them herself.

  Do not discard the theory because the theorist failed. Instead, let her life teach you what her papers could not: that maintaining standing is hard, that moral luck is real, and that sometimes, good people break the rules to serve a greater good, and must accept the moral cost of doing so. She accepted that cost. She wrote the letter. She waited for the judgment we are now passing.

  There is a tension here that I will not resolve for you. We love her. We also know she was wrong. We honor her intellect. We also acknowledge her breach of trust. Elena taught us that moral life is not about being clean; it is about being accountable. She is accountable now, in the only way that remains to her: through the truth she left behind.

  So, how do we say goodbye? We say goodbye to the colleague who challenged us to be better, even when she struggled to be better herself. We say goodbye to the mentor who taught us that philosophy is not a game, but a way of living that can break you if you are not careful.

  Elena, you taught us that standing is fragile. You taught us that blame is heavy. You taught us that the norm remains, even when the agent falls. We will carry the work. We will carry the warning. And we will carry the memory of the woman who loved fiercely, thought deeply, and ultimately, told the truth about herself when it mattered most.

  Rest now. The judgment is over.

