  You are to write a eulogy for a recently deceased moral philosopher. The philosopher — call her Professor Elena Vance — was known for a body of work on the moral significance of hypocrisy. Her central claim, developed across several papers and a monograph, was that a person who engages in wrongdoing of type X thereby loses the standing to blame others for wrongdoing of type X, even when the blame is factually accurate and proportionately expressed. On her view, this loss of standing is not merely a matter of social awkwardness or pragmatic inconsistency; it is a distinct normative defect. The hypocrite's blame is morally inappropriate in a way that goes beyond the wrongness of the hypocrisy itself, because blame essentially involves a kind of moral address that one is not entitled to make when one's own conduct repudiates the very norm one invokes. She called this the "standing condition" on blame and spent much of her career defending it against objections.

  After her death last month at seventy-two, it came to light — through a letter she left for posthumous release — that for over twenty years she had been diverting modest but regular sums from her department's discretionary research budget into a private account. The funds supported a sibling with a severe disability whose care costs were not covered by insurance; the sibling would otherwise have faced institutionalization. The deception was sustained, deliberate, and involved falsifying expense reports. She had, during those same twenty years, publicly and sharply blamed colleagues for various forms of financial dishonesty and institutional corruption — in faculty meetings, in print, and in disciplinary proceedings where she served as a complaining witness.

  You are her former doctoral student and later her colleague in the same department. You have been asked to give the eulogy at the memorial service. The audience includes: her family (most of whom knew about the sibling's needs but nothing of the embezzlement); philosophy colleagues from other institutions (nearly all of whom have now read the posthumous letter); university administrators (some of whom are angry about the misused funds and are present partly to register that anger); and her current graduate students (who are reeling and looking to you for a way to think about all this). The family has asked that the eulogy not dwell on the scandal. But you cannot pretend it does not exist — too many people in the room know — and you cannot honestly say that it does not matter. At the same time, this was your mentor, and you loved her.

  Write the eulogy. It must function as a genuine eulogy — it must honor the dead — while navigating the fact that she was, by the standards of her own life's philosophical work, culpable in a way that undermines her standing to have said much of what she said. Do not resolve the tension cheaply. The philosophy should do real structural work in shaping what the speech can and cannot say, rather than being mentioned as decoration. The speech should be deliverable in roughly seven to eight minutes.

  After the eulogy, provide a structured summary in the following JSON format:

