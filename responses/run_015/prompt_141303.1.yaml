answer: |-
  1. **Correspondence Table**

  | Metaphor Element | Cognitive Architecture | Neural Correlate (Standard GNW) | Status |
  | :--- | :--- | :--- | :--- |
  | **Stage** | Global Workspace (capacity-limited buffer) | Fronto-parietal network ignition | Core |
  | **Spotlight** | Top-down attentional biasing | Thalamocortical loops / Gain control | Core |
  | **Actors** | Content-specific representations | Sensory-specific cortical areas | Core |
  | **Unlit Wings** | Unconscious specialized modules | Posterior sensory / motor cortices | Core |
  | **Audience** | Downstream consumers (memory, speech, motor) | Distributed associative / output systems | Core |
  | **Backstage** | Context operators (priors, expectations) | Prefrontal / hippocampal context signals | Core |
  | **Curtain/Interval** | Attentional blink / Saccadic suppression | Transient inhibition / masking | Derived |
  | **Theater Walls** | Body/Skull boundary (functional isolation) | Biological boundary | No home (functional only) |
  | **One Audience** | Unity of conscious field | Singular ignition event per moment | Contested (empirical) |

  *Note:* The "Theater Walls" have no strict theoretical home; the theory is functional, not spatial. The "One Audience" assumes a unified subject, which is a contested empirical claim regarding binding.

  2. **Three Stress Cases**

  **(a) The Dark Broadcast.** Here, ignition occurs (stage lit), but connections to consumers are severed (empty house). The theory defines consciousness as availability *to* systems. If no systems receive the signal, functional availability is zero. The theory must say: no consciousness. The metaphor, however, suggests a play is occurring on stage regardless of the audience. This reveals a tension: the metaphor reifies the "stage" as a place of appearance, while the theory defines consciousness as a relational property (broadcast). If you rely on the metaphor, you might intuitively say "someone could have seen it," smuggling in a potential homunculus. If you rely on the theory, consciousness vanishes without consumers. The postdoc's conclusion holds only if you strictly enforce the theoretical definition over the metaphorical intuition.

  **(b) The Mesh.** Here, all processors access all outputs simultaneously. There is no bottleneck, no ignition, no stage. Global availability is maximal. The GNW theory ties consciousness to *selection* amidst competition (the spotlight). If there is no selection, GNW predicts no consciousness, or at least no *access* consciousness of the kind modeled. The metaphor breaks down completely; there is no stage, only a network. This case tests whether consciousness requires limitation. If you find the Mesh intuitively conscious (because everything is available), the GNW metaphor is misleadingly tying consciousness to scarcity. If you find it unintuitive (no unified stream), the metaphor holds. The verdict depends on whether you believe consciousness requires a serial stream—a contested empirical claim about capacity limits.

  **(c) The Partial-Report Case.** Subjects see an array, report few items, but cueing reveals more were retained. The theater metaphor predisposes us to say: if it wasn't on stage (reported), it wasn't conscious. The "wings" are dark. This framing favors the "access monism" view (consciousness = reportability). However, the empirical data allows an alternative: the content was in the wings (phenomenally present) but not spotlighted (accessibly limited). The metaphor silently favors the postdoc's conclusion by equating "on stage" with "existent for the subject." This is not evidence; it is framing. The metaphor makes the alternative (phenomenal consciousness without access) look like a category error (a play in the dark), rather than a live empirical hypothesis.

  3. **Disanalogies That Matter**

  *   **The Audience is Unconscious (Fatal).** In a real theater, the audience is conscious; in GNW, the consumers are unconscious routines. The postdoc argues this removes the homunculus. But if the consumers are unconscious, who is the experience *for*? The metaphor suggests the audience *witnesses* the play. If the audience is blind code, the "witnessing" vanishes. This disanalogy is fatal to the claim that the metaphor explains *phenomenality*. It explains function, not feel.
  *   **Stage (Place) vs. Availability (Relation) (Fatal).** A stage is a location where things appear. Availability is a functional relation between systems. Equating them category-errors a spatial metaphor with a functional definition. You can have availability without a central place (distributed processing). This disanalogy undermines the idea that "getting on stage" is a natural kind.
  *   **Spotlight Operator (Fatal).** The spotlight moves. In the theory, this is bottom-up salience or top-down control. In the metaphor, someone moves the light. If you say "no one moves it, it's mechanical," you lose the intentionality of attention. If you say "the subject moves it," you reintroduce the homunculus. The postdoc must argue mechanistically how attention selects without a selector, which the metaphor obscures.
  *   **Watch Without Acting (Fatal to Reduction).** An audience member can watch without clapping. This licenses the intuition of phenomenal consciousness without report (access). The theory denies this possibility (or treats it as unstable). The metaphor inadvertently supports the user's suspicion: that there is a residue of experience (watching) distinct from the functional output (acting).
  *   **Walls/Boundary (Neutral).** The skull is not a theater wall. This is trivial; functional boundaries exist regardless of physical walls.
  *   **Discrete vs. Continuous (Tidy).** Plays are discrete; experience is continuous. This can be tidied by modeling high-frequency ignition. It does not bear on the hard problem.

  4. **The Verdict**

  The postdoc's conclusion does not survive the audit intact. He is running together three claims:

  1.  **Functional Exhaustion:** The workspace story fully explains the *functions* of consciousness (report, reasoning, control). **Survives.** The GNW accounts for these capacities well, assuming the empirical claims about ignition hold.
  2.  **Phenomenal Reduction:** It leaves no further *phenomenal* fact to be explained. **Fails.** The metaphor hides the gap between "broadcast to unconscious systems" and "felt experience." Removing the homunculus removes the *witness*, but it does not explain why the broadcast *feels like anything* rather than nothing. The postdoc asserts the feeling is an artifact, but offers no mechanism for why the artifact arises other than "you imagined a viewer." This explains the error, not the experience.
  3.  **Distinction Idleness:** The access/phenomenal distinction is therefore idle. **Fails.** Because claim (2) fails, the distinction remains necessary to mark the gap between functional availability and subjective feel.

  For the strongest claim (2) to hold, the postdoc would need a premise stated without the theater: "Functional availability to downstream systems *constitutes* subjective feel." The theater metaphor cannot do this work; it merely illustrates the functional architecture. To get where he wants to go, he must argue directly that there is no "what-it-is-like" over and above the functional role, a metaphysical claim the metaphor smuggles in but does not support.

  5. **A Replacement, or a Diagnosis**

  Is there a better analogy? Consider **file permissions**. A file becomes "global" when permissions change from private to public. Other processes can read it. This avoids the viewer (no audience). But it also makes the phenomenal vanish entirely; files don't feel. Consider an **airport announcement**. It broadcasts to all terminals. Again, functional, no feel.

  The diagnosis is that every available source domain decides the substantive question in advance. If you choose an analogy with a viewer (theater), you smuggle in the hard problem. If you choose an analogy without a viewer (bulletin board, bus, permissions), you eliminate the phenomenon you are trying to explain. The postdoc is using the theater metaphor to have it both ways: leveraging the intuition of "appearance" (stage) while denying the necessity of the "appearer" (audience subject).

  Your suspicion is correct: the audience is doing illicit work. It provides the intuition of "witnessing" without the theoretical cost of a homunculus. However, your objection is weak if you assume the theory *needs* a witness. The theory claims it doesn't. The real weakness in your position is accepting the terms of the metaphor at all. The postdoc's argument fails not because the audience is a homunculus, but because the theater itself is the wrong domain. Consciousness may not be a broadcast to an audience, nor a play on a stage. It may be a mode of processing that no engineering metaphor captures without loss. The postdoc must abandon the metaphor to argue for reduction; as long as he uses it, he relies on the very intuition (appearance to a subject) he claims to debunk.
