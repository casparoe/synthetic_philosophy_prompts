prompt: |-
  I will present a thesis called "semantic inertia" in statutory interpretation at a law-school faculty workshop. The argument holds that enacted statutory text carries an interpretive momentum analogous to a default rule in contract law: its public meaning at enactment constrains judicial application unless genuine linguistic ambiguity—not mere purposive tension—triggers displacement. I ground the constraint in legislative authority rather than speaker intent, claiming that democratic legitimacy requires courts to treat textual momentum as binding except at precisely defined ambiguity thresholds. The audience is evenly divided between committed textualists and originalists, who will suspect that my ambiguity exception smuggles purposivism back in and undermines judicial constraint, and purposivists with regulatory-law backgrounds, who will regard semantic inertia as originalism in disguise and functionally naive about how agencies actually apply statutes in complex administrative contexts. Prepare me for the question period. I need a prep sheet containing the six or seven objections I will actually face, ordered by how damaging they are to the proposal, each phrased in the vocabulary and framing of the camp that will raise it, with a reply I can deliver in roughly two minutes, an explicit note on where that reply is weakest, and the single objection I am hoping nobody raises, together with a brief explanation of why it is fatal if pressed. In constructing the objections, target the actual structure of my argument—the default-rule analogy, the ambiguity-trigger condition, and the democratic-legitimacy grounding—rather than a straw version. Do not include bibliographies, citation lists, or references to specific works; the sheet must be fully usable without access to external sources.
