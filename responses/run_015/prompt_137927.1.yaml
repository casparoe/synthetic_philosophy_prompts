answer: |-
  This is a sharp framework. It moves the debate from *semantics* (what does the statue mean?) to *political economy* (what does it cost to keep this meaning alive?). By treating commemoration as a flow of resources rather than a static inscription, "Commemorative Lock-in" avoids the trap of arguing about history and instead argues about maintenance.

  Here is the Colston case run through your three moving parts, followed by the stress test you asked for.

  ### Part 1: Mapping Colston through Commemorative Lock-in

  **1. The Authorizing Community and the Location of Honor**

  *   **1895 (Erection):**
      *   *Authorizing Community:* The Society of Merchant Venturers and the Victorian civic elite. A narrow, wealthy, white male cohort.
      *   *Act of Re-authorization:* The unveiling ceremony and the initial funding.
      *   *Location of Honor:* Entirely in the subject (Colston). The statue is a conduit of virtue from the city to the man.
      *   *Lock-in Status:* Low. The "record" is new. The asymmetry favors erection (cheap to put up).

  *   **1977 (Grade II Listing):**
      *   *Authorizing Community:* The State (Historic England).
      *   *Act of Re-authorization:* Legal protection. This is a crucial *maintenance* payment. It signals that the object's value is now "architectural/historical" rather than purely "honorific."
      *   *Location of Honor:* Begins to shift. The honor is partly in Colston, partly in the Victorian craftsmanship.
      *   *Lock-in Status:* Increasing. The state has invested capital in the statue's permanence.

  *   **1990s–2018 (The Decay Phase):**
      *   *Authorizing Community:* Fractured. The Council (official), Merchant Venturers (traditional), and an emerging counter-community (activists, local residents).
      *   *Act of Re-authorization:* Cleaning graffiti, policing the site, refusing removal.
      *   *Location of Honor:* Decaying. The cost of "policing" the honor (dealing with protests, paint) begins to outweigh the benefit. The "record" part of the theory kicks in: the statue now records *conflict*, not just virtue.
      *   *Lock-in Status:* High friction. The legal listing makes removal expensive (bureaucratically), but the social cost of maintenance is spiking.

  *   **2018 (The Plaque Proposal):**
      *   *Theory Diagnosis:* This was an attempt to buy re-authorization on the cheap. A plaque is a "speech act" (Part 1), but Lock-in argues speech acts cannot sustain a monument if the *material maintenance* is contested. You cannot fix a physical lock-in with a textual footnote.
      *   *Why it Failed:* The "honorific activity" required to keep the statue standing (ignoring the protests, defending the wording) became too expensive for the Council. The plaque fight bogged down because the *object* had already accumulated too much negative record. The theory suggests the plaque route was doomed not because the wording was hard, but because the *statue itself* had become the wrong technology for the memory.

  *   **2020 (Toppling):**
      *   *Authorizing Community:* The Protesters (temporary seizure of authority).
      *   *Act of Withdrawal:* Physical removal.
      *   *Asymmetry Flip:* Usually, removal is expensive. Here, the protesters absorbed the cost (criminal risk, physical labor). The Council's subsequent choice *not* to immediately reinstall it signaled a withdrawal of state re-authorization.
      *   *Location of Honor:* Shifted instantly from Colston to the Act of Removal.

  *   **2022 (The Acquittal):**
      *   *Significance:* The Jury (a random slice of the "living community") refused to treat the statue's continued presence as a protected legal interest. In Lock-in terms, they ruled that the *cost* of criminalizing the withdrawal of honor was higher than the *value* of the honor being withdrawn.

  *   **2021/2024 (M Shed Museum):**
      *   *Status:* Museumification.
      *   *Location of Honor:* No longer honorific. It is now evidentiary. The "honor" lives in the City's capacity to curate its own shame.
      *   *Lock-in:* Stabilized. Inside a museum, the "maintenance cost" is low (climate control, security) and the "record" is fixed. It stops being a public claim and becomes a historical artifact.

  *   **2025 (The New Plinth Plaque):**
      *   *Status:* The empty plinth is re-authorized as a monument to the removal.
      *   *Location of Honor:* Entirely in the *us* (Part 2 of your theory). The object (the plinth) is now chiefly about the community that removed the statue, not the merchant who was removed.

  **2. Prediction: The M Shed Statue**
  Lock-in predicts the M Shed statue will **not** drift back toward honor. Why? Because the "maintenance activity" in a museum is preservation, not veneration. Visitors do not lay flowers; they read context. The "honorific decay" is complete. It is now a record of the 2020 protest, not the 1895 erection. It has been successfully de-honored because the *context of maintenance* has changed from civic pride to historical inquiry.

  **3. Street Names: Is the Friend Right?**
  Your friend is partially right but misses the Lock-in mechanism.
  *   **Difference:** A street sign is indexical, not iconic. It doesn't "look like" the person, so the "honorific activity" is lower (no one polices a street sign for graffiti in the same way).
  *   **Lock-in Similarity:** Street names have massive bureaucratic lock-in. Changing "Colston Street" requires updating land registries, postcodes, business addresses, and maps. That is "maintenance cost."
  *   **Exit Cost:** The exit cost is actually *higher* for street names in terms of logistics, but *lower* in terms of drama (no crane needed).
  *   **Verdict:** It is the same Lock-in, but the "honor" is more diffuse. When a street name is changed, it is rarely because the sign is expensive to keep, but because the *administrative maintenance* of the name (defending it in council meetings) becomes too politically expensive.

  ---

  ### Part 2: The Case Pushes Back (Critiquing the Theory)

  Now we turn the lens on the theory itself. The Colston case is convenient for Lock-in, but does it expose weaknesses?

  **1. Does the Duration (125 Years) Actually Do Work?**
  This is the weakest link. Your theory claims the "record part... accumulates," changing the object from *him* to *us*.
  *   **The Challenge:** Imagine a statue of a controversial figure erected in **2015** that faced identical protests by **2020**.
  *   **Lock-in Prediction:** The theory suggests removal should be *easier* (less accumulated record, less shift to "us") or *harder* (less decay of honor).
  *   **Reality:** The dynamics would likely be identical. The intensity of the moral objection swamps the duration variable. If the theory explains the 1895 statue and a hypothetical 2015 statue identically, then "duration" is doing no heavy lifting. It risks being a post-hoc justification for why old statues feel heavier, rather than a causal mechanism for why they fall.
  *   **Refinement:** Duration matters only insofar as it increases the *bureaucratic* cost of removal (listing status, heritage laws). If that legal lock-in is bypassed (as by protesters), the 125 years might be irrelevant.

  **2. Is the Theory Too Flexible? (Rationalizing Any Outcome)**
  *   **Keep it:** "The community is successfully re-authorizing through maintenance."
  *   **Topple it:** "The cost of maintenance exceeded the will to honor."
  *   **Museumify it:** "The object has shifted from honorific to record."
  *   **The Silence:** The theory is excellent at describing *states* but silent on *transitions*. It explains why the plaque failed (cheap speech vs. expensive stone), but it cannot predict *when* the tipping point occurs. It says "honor decays unless paid for," but it doesn't tell us the exchange rate. How much graffiti equals one lost virtue?
  *   **Verdict:** It risks being a tautology: *If it stays up, the community valued it enough to pay. If it comes down, they didn't.* To be a real theory, it needs to identify the *currency* of maintenance independently of the outcome.

  **3. Specific Silences**
  *   **Who Decides the Community?** Lock-in speaks of "the community" re-authorizing. Bristol shows there is no single community. The Merchant Venturers, the City Council, the BLM protesters, and the Jury all claimed to represent the "authorizing will." The theory has no mechanism for resolving conflicting claims to authority. It describes the tug-of-war but doesn't explain why the rope broke in 2020 and not 1995.
  *   **The Criminal Damage Question:** You read the acquittal as the jury refusing to treat the statue as a protected interest. Lock-in supports this (honor had decayed). But a legalist would say the jury was instructed on "lawful excuse" regarding property damage. The theory might be conflating *moral* authorization with *legal* standing. It goes silent on whether the law *should* track the decay of honor or protect property regardless.
  *   **The Split Community:** What if the "authorizing community" (State/Heritage) wants to keep it, but the "living community" (Locals) wants it gone? Lock-in describes the friction (high maintenance cost) but offers no normative guide. Is the "lock" legitimate if the keyholders are dead?

  ---

  ### Part 3: Lock-in vs. The Flat Present-Tense View

  **The Flat Present-Tense View:**
  *   **Claim:** History doesn't matter. Only the message the object sends *now* is morally relevant.
  *   **Analysis of Colston:** Colston was a slaver. The statue honors a slaver. Therefore, it sends a bad message now. Remove it.
  *   **Strengths:** Moral clarity. Avoids getting bogged down in "but he was a philanthropist then."
  *   **Weaknesses:** It cannot explain the *plinth*. Why keep the empty stone? It cannot explain the *museum*. Why not melt it down? If only the current message matters, the object is either "Good Message" or "Bad Message." The nuance of the M Shed display (graffiti preserved) is invisible to this view.

  **Which Handles the Case Better?**
  **Commemorative Lock-in is superior for this case.**
  The Colston story is not a binary switch (Honor/No Honor). It is a story of *process*. The Lock-in theory explains:
  1.  Why the plaque failed (material weight vs. textual correction).
  2.  Why the acquittal happened (social cost of protection > cost of damage).
  3.  Why the plinth remains (it is now a monument to the removal).

  The Present-Tense view would likely argue the plinth should be removed too (it still references Colston) or that the statue should be destroyed (it is tainted). It cannot account for the *value* added by the history of the object's removal.

  **The Separating Case:**
  To truly separate the two theories, you need a case where **Current Message** and **Historical Accumulation** diverge.

  *   **Case:** A statue of a **neutral figure** (e.g., a generic WWI soldier) erected in **1920**, which is discovered in **2024** to have been funded by a notorious criminal syndicate, though the soldier himself was innocent.
      *   **Present-Tense View:** The message *now* is "We honor WWI soldiers." The funding source is hidden history. **Verdict: Keep it.** The current visual message is benign.
      *   **Lock-in View:** The "maintenance" of the statue has inadvertently been sustaining a link to the criminal syndicate. The "record" has accumulated a poison pill. Even if the visual message is neutral, the *activity* of honoring this specific object is now tainted by the revealed history. **Verdict: Contextualize or Remove.** The "cost" of maintaining the honor now includes explaining the syndicate link.

  *   **Better Separating Case:** **The "Ignored" Monument.**
      *   **Scenario:** A statue of a minor colonial figure in a park that *no one looks at*. No one cleans it, no one protests it, no one visits it.
      *   **Present-Tense View:** It sends no message. It is morally neutral. No action required.
      *   **Lock-in View:** Neglect *is* a message. The lack of "re-authorization activity" (cleaning, policing) means the honor has already decayed. The statue is a "zombie monument." The theory demands we acknowledge it is already de-honored by neglect, even if it stands.
      *   **The Divergence:** If the city decides to remove it to save maintenance costs:
          *   Present-Tense: "Neutral administrative decision."
          *   Lock-in: "Final withdrawal of authorization. The object ceased to function as a monument years ago."

  **Conclusion**
  Your "Commemorative Lock-in" theory is robust because it treats monuments as *verbs* rather than *nouns*. It explains why the Colston statue didn't just "mean" something, but "did" something over 125 years. However, it must guard against becoming a just-so story where every outcome is proof of the theory. Its real power lies in explaining the *plinth* and the *museum*—the liminal spaces where the Present-Tense view goes blind. The statue isn't gone; the lock-in just shifted to a new container.
