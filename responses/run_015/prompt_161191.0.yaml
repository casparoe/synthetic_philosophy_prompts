      The student's argument proves Epistemic Underdetermination. It does not prove Pragmatic Unjustifiability.
      (6) smuggles in a premise: "Justification requires Discriminatory Evidence."
      Reject that premise.
      Justification requires **Sufficient Probability + Acceptable Consequence**.
      If $P(\text{Deceptive})$ is low (based on priors/theory), and $Cost(\text{Deploy}) < Cost(\text{Not Deploy})$, we deploy.
      This matches (7). We don't *know* the surgeon is good. We accept the risk.
      This rejects (6).
      Cost: We admit we are gambling, not knowing.
      This fits "Epistemology of Risk."

      *Final Plan:*
      Focus on **(6)** as the normative overreach, supported by a softening of **(4)** to allow **Theoretical Priors**.
      The core error is conflating **Underdetermination** (5) with **Unjustifiability** (6).
      This respects the "Epistemology of Risk" context. Risk *is* about acting under underdetermination.
