answer: |-
  You are wrestling with the specific friction point where historiography ends and poetics begins, but you are trying to solve it with ethics. Your gut verdicts are mostly consistent with a specific ethical framework, but you have identified the cracks where the framework doesn't hold.

  Your friend's "Licence to Testify" theory is close, but as you noted, it fails to account for the *Composite* problem (erasure vs. addition). A principle based solely on reader expectation ignores the duty you owe to the dead.

  Here is a principle designed for your 7am desk, followed by the reflective equilibrium you asked for.

  ### The Principle: Evidentiary Claims and Distinct Agency

  **Core Statement:** You may invent wherever the historical record is silent (the Gap), but you may not invent where the record makes a specific claim (the Anchor), nor may you dissolve the distinct agency of a documented human being (the Soul).

  This principle generates three clauses:

  **Clause 1: The Anchor Clause (Public Verifiability)**
  *   **Rule:** Do not alter datable, public events or physical constraints that a reader could reasonably verify to orient themselves in time and space.
  *   **Motivating Case:** *Moving a real, datable event by nine days.* (Not Fine).
  *   **Why:** This breaks the shared timeline between the novel and the world. If a reader checks a calendar or a history book and finds you moved the Battle of the Boyne or the opening of a specific railway, you have broken the contract of *historical* fiction. You are no longer writing about *that* history.
  *   **Contrast:** *Reordering private quarrels.* (Fine). Because the record doesn't settle the order, there is no Anchor. It remains in the Gap.

  **Clause 2: The Ventriloquism Clause (Specific Attribution)**
  *   **Rule:** Do not place specific, quotable words in the mouth of a real person that attribute a specific sentiment, opinion, or fact they did not express, especially if it defines their legacy.
  *   **Motivating Case:** *Putting a made-up sentence into the mouth of a real person.* (Not Fine).
  *   **Why:** Direct speech (quotation marks) functions as a citation. It claims, "I have evidence they said this." Free indirect style or narrative summary claims, "This is my interpretation of their character." The former is a claim of evidence; the latter is a claim of psychology.
  *   **Contrast:** *Real person in a room he wasn't in.* (Fine). Presence is probabilistic. We often don't know exactly where someone was. Words are evidentiary.

  **Clause 3: The Soul Clause (Distinct Identity)**
  *   **Rule:** Do not fuse two distinct, documented human beings into one character if doing so erases the specific historical contribution or identity of either.
  *   **Motivating Case:** *Fusing two real minor figures into one composite.* (Not Fine).
  *   **Why:** This violates the duty to the dead. Adding a furnace boy (invention) harms no one. Fusing two real clerks (erasure) deletes one person's existence from the narrative of their own life. It is an ontological deletion, not just a narrative convenience.
  *   **Contrast:** *Inventing a minor person.* (Fine). Addition does not require subtraction.

  ***

  ### Application to New Cases

  **1. A novel narrated in first person by a real historical person.**
  *   **Verdict:** **High Risk / Not Fine (unless heavily signalled).**
  *   **Reasoning:** This violates the Ventriloquism Clause on a macro scale. First person implies access to *all* thoughts and sensations. Unless every thought is documented, you are claiming an intimacy with the dead that is inherently false. It requires an Author's Note to shift the contract to "interpretive memoir."

  **2. A real person who is recognisable but renamed.**
  *   **Verdict:** **Fine (with caveats).**
  *   **Reasoning:** This is the *Roman à clef*. It protects the Soul Clause (you aren't fusing them) and the Anchor Clause (you can keep their actions accurate). However, if the renaming is done to avoid libel or ethical scrutiny for vile acts, it is cowardly. If it is done to protect living descendants, it is ethical.

  **3. Two real events merged into one.**
  *   **Verdict:** **Depends on the Anchor.**
  *   **Reasoning:** If these are two private quarrels (Gap), merge away. If these are two public treaties or battles (Anchor), do not merge. Merging public events distorts causality.

  **4. A real documented quotation given to the wrong real person.**
  *   **Verdict:** **Not Fine (Worst Category).**
  *   **Reasoning:** This violates both Ventriloquism and Soul. It steals agency from the speaker and gifts unearned insight to the listener. It is a lie about intellectual history.

  **5. An author's note at the end that lists everything I changed.**
  *   **Verdict:** **Fine (and Recommended).**
  *   **Reasoning:** This solves the "Signalling" problem you raised about jacket copy. An Author's Note is part of the text. It shifts the contract from "This is what happened" to "This is what I made of what happened." It licenses the reader to treat the text as testimony *plus* interpretation.

  **6. Whether it matters if the invented thing is vile rather than trivial.**
  *   **Verdict:** **Yes, it matters immensely.**
  *   **Reasoning:** This is the **Defamation of the Dead**. Inventing a trivial habit (he tapped his foot) is harmless. Inventing a vile act (he beat his wife) without evidence violates the Soul Clause by damaging their legacy. The burden of proof rises with the severity of the accusation.

  ***

  ### Reflective Equilibrium: Where I Overturn Your Verdicts

  You asked for honesty about which verdicts this principle cannot accommodate, and where I think your gut is wrong. To achieve equilibrium, you must adjust your list.

  **1. The "Made-Up Sentence" vs. "Wrong Room" Inconsistency.**
  *   **Your Gut:** Wrong Room = Fine; Made-Up Sentence = Not Fine.
  *   **My Overturn:** **You are being too formalist about the sentence.**
  *   **Argument:** You admitted this yourself: *"a made-up scene between two real people is already a hundred made-up sentences."* If you place a real person in a room they weren't in (Fine), and have them interact with another real person, they *must* speak. If you write that dialogue in free indirect style, it's Fine. If you put it in quotation marks, it's Not Fine? That is a distinction without a moral difference.
  *   **Correction:** If the *scene* is in the Gap (undocumented meeting), the *dialogue* is also in the Gap. Quotation marks should not be treated as claims of documentary evidence in fiction, but as stylistic markers of immediacy.
  *   **New Verdict:** **Fine**, provided the sentiment is consistent with their known character (Ventriloquism Clause modified). Do not treat quotation marks as citations unless you are claiming they are.

  **2. The "Composite Character" Absolutism.**
  *   **Your Gut:** Fusing two real minor figures = Not Fine (because of deletion).
  *   **My Overturn:** **This is too rigid for the novel form.**
  *   **Argument:** The novel has a limited capacity for consciousness. If you have two minor clerks who serve the exact same narrative function and neither has a distinct historical legacy (unlike, say, two rival politicians), fusing them is not "erasure," it is "distillation." The Soul Clause protects *Distinct Agency*. If their agency was identical and minor, the deletion is negligible.
  *   **Correction:** Distinguish between **Functional Composites** (Fine) and **Historical Composites** (Not Fine). If the two figures represent different viewpoints, factions, or contributions, do not fuse them. If they are both just "the guy who delivered the mail," fuse away.
  *   **New Verdict:** **Fine**, if the figures are functionally identical and historically minor. **Not Fine**, if they represent distinct historical forces or identities.

  **3. The "Signalling" Problem.**
  *   **Your Gut:** Jacket copy doesn't do enough moral work; most readers don't read it.
  *   **My Overturn:** **You are right, but the solution isn't to stop inventing.**
  *   **Argument:** You cannot control whether a reader reads the jacket. You can only control the integrity of the text. Relying on jacket copy is indeed weak.
  *   **Correction:** The **Author's Note** is the only ethical signal that works. It is text, not packaging. If you slip a counterfactual event into a book that otherwise tracks the record (your "Worst Thing"), you *must* disclose it in the note. If you don't, you are lying.
  *   **New Verdict:** **Not Fine** without an Author's Note. **Fine** with one.

  ### Summary for the Desk (7am Version)

  1.  **Can I check this in a history book?** If yes, don't change it. (Anchors).
  2.  **Am I deleting a real person's distinct life to save space?** If yes, don't do it (unless they were extras). (Soul).
  3.  **Am I making them say something that changes how we see them?** If yes, ensure it fits their known voice, or don't use quotes. (Ventriloquism).
  4.  **Did I change the outcome of history or just the path to it?** If outcome, signal it in a note. (Contract).

  Your anxiety about the "made-up sentence" is the most important thing you feel. It shows you respect the dead. But don't let the *format* of the speech (quotes vs. prose) carry the weight of that respect. Carry it in the *truthfulness of the sentiment*. A lie in free indirect style is still a lie. A truthful invention in quotes is still fiction.

  Keep the glassmakers in Bohemia. Move them around the room. But let them speak only what their souls would allow.
