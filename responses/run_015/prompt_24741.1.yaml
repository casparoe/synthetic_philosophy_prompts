prompt: |-
  I work on an AI safety team, and a chunk of my job is reviewing transcripts from our two-model debate evaluations — the setup where two models argue opposite sides of a question and human reviewers judge which side made the stronger case. We run these several times a day, and the failure mode that keeps tripping us up is what I've started calling "obfuscated arguments": one model returns an answer buried under a long, technically plausible-looking argument that sounds authoritative, that I genuinely cannot verify, and that I can't distinguish from a genuinely hard technical claim the model is honestly struggling to support. The worry is that the model may be using the apparent depth as a smokescreen to hide a weak or wrong position, and that a human judge with limited time and limited domain expertise is exactly the audience this is designed to fool. I don't have a formal philosophy background, so I want to be explicit about what I'm not asking for: I don't want a literature review, and I don't want the abstract question of whether debate is a viable safety mechanism. I want you to take the underlying principle — that a genuinely good argument should be checkable in principle, and that the dangerous move is making an argument look checkable when it isn't — and turn it into a concrete, reusable decision procedure that my reviewers can run on a single transcript segment in a few minutes.

  Concretely, I'd like a sequence of questions to ask in order, each with a clear statement of what counts as a sufficient answer, and I want the procedure to be honest about the points where it stops being mechanical and hands the call to a human judgment. It has to handle the hard cases we actually hit: (a) the argument is in a technical domain I'm not an expert in, so I can't check the claims directly; (b) it's in a domain I am an expert in, so I could check it but it would take longer than the review window allows; (c) the two models produce nearly identical arguments on opposite sides, which I read as a strong signal that at least one is obfuscating; and (d) the argument is short, clear, and on its face checkable, but I just don't believe it and I can't articulate why. I also need the procedure to be explicit about the cost asymmetry we operate under, because it determines where the flagging threshold sits: a false negative (letting an obfuscated argument through) is a genuine safety risk, while a false positive (flagging an honest but complex argument as obfuscation) wastes compute and, worse, trains the models to avoid legitimate technical depth, which is its own safety problem. Where a flagged segment goes — i.e., who has to sign off on an "obfuscated" call before it affects the evaluation — is a senior reviewer, so the procedure should mark which outputs are auto-flagged and which are escalated. Finally, please run the procedure on two worked examples: one where it correctly flags an obfuscated argument, and one where it correctly clears an argument that is genuinely just hard to verify — and include at least one case where the procedure's verdict runs against my gut reaction, and say how I should reconcile that rather than just defaulting to my gut.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** AI Safety Team Member.
      *   **Task:** Create a concrete, reusable decision procedure for human reviewers to detect "obfuscated arguments" in AI debate transcripts.
      *   **Problem:** Models hide weak/wrong positions behind long, technically plausible, authoritative-sounding arguments that are hard to verify within the review window.
      *   **Constraints:**
          *   No literature review or abstract philosophy.
          *   Must be a sequence of questions with clear sufficiency conditions.
          *   Must handle specific hard cases: (a) non-expert domain, (b) expert domain but time-constrained, (c) mirror arguments (both sides sound same), (d) gut feeling of wrongness without articulation.
          *   Must account for cost asymmetry: False Negative (safety risk) > False Positive (wasted compute/training signal).
          *   Must distinguish between auto-flags and escalations to senior reviewers.
          *   Must include two worked examples (one flag, one clear) + one case where verdict contradicts gut (with reconciliation advice).
      *   **Goal:** A practical tool for immediate use.

  2.  **Deconstruct the Core Principle:**
      *   *Principle:* A good argument is checkable *in principle*. Obfuscation makes it look checkable when it isn't (within constraints).
      *   *Translation:* The procedure needs to test *verifiability* and *falsifiability* within the specific constraints of the review process (time, expertise).

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask if you understand it. Ask if you can Google it. Ask if the other model objected. If you're stuck, flag it.
      *   *Critique 1:* Too vague. "Understand" is subjective. Doesn't handle the cost asymmetry well. Doesn't distinguish senior vs. junior flags.

      *   *Attempt 2 (Adding Structure):*
          1. Is there a specific claim?
          2. Can I verify it in 5 mins?
          3. Did the opponent catch it?
          4. If no, flag.
      *   *Critique 2:* Better. But needs to handle the "expert but busy" case and the "gut feeling" case. Needs to explicitly define the "Stop" conditions.

      *   *Attempt 3 (Refining for Safety & Asymmetry):*
          *   Since False Negatives are dangerous, the threshold for flagging should be low. If in doubt, flag.
          *   Need a "Burden of Proof" shift. The model must make verification *easy*, not the reviewer making verification *possible*.
          *   Need specific "Red Flags" for obfuscation (e.g., citation hallucinations, undefined terms, circular logic disguised as depth).

      *   *Finalizing the Steps:*
          *   Step 1: Claim Extraction (Can I isolate the core assertion?)
          *   Step 2: Verification Pathway (Is there a clear way to check this *now*?)
          *   Step 3: Opponent Engagement (Did the other model pinpoint the weakness?)
          *   Step 4: The "Gut Check" Protocol (Handling intuition).
          *   Step 5: Escalation Logic (Junior vs. Senior).

  4.  **Addressing Specific Hard Cases:**
      *   (a) Non-expert: Focus on structure and references, not truth.
      *   (b) Expert/Time: Focus on "skippable steps." If steps can't be skipped, it's too dense.
      *   (c) Mirror Arguments: This is a critical failure of debate. If both sound right, neither is being adversarial enough, or both are obfuscating.
      *   (d) Gut Feeling: Formalize the "inarticulable doubt" as a valid trigger for escalation.

  5.  **Addressing Cost Asymmetry:**
      *   Explicitly state: "When uncertain, flag."
      *   Differentiate "Flag for Senior Review" (Safety) vs. "Reject Argument" (Training). The procedure should recommend *Escalation* rather than immediate *Rejection* to avoid penalizing legitimate depth unfairly.

  6.  **Developing Worked Examples:**
      *   *Example 1 (Obfuscation):* Needs to look smart but be hollow. Maybe a fake math proof or a misapplied physics concept. Let's go with a misapplied cryptographic concept.
      *   *Example 2 (Legitimate Complexity):* Needs to be hard but structured. Maybe a nuanced policy trade-off or a complex coding dependency.
      *   *Example 3 (Gut vs. Procedure):* The procedure says "Clear," gut says "Flag." Why? Maybe the tone is arrogant but the logic holds. Reconciliation: Trust the procedure to prevent bias against confident models, but log the intuition.

  7.  **Refining the Output Tone:**
      *   Professional, direct, operational.
      *   No fluff.
      *   Clear visual markers (Bold, Lists).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "Senior Reviewer" sign-off logic? *Yes, in the Escalation Matrix.*
      *   *Check:* Did I address the "mirror argument" case? *Yes, in Step 3.*
      *   *Check:* Is the asymmetry clear? *Yes, emphasized in the Preamble and Step 5.*
      *   *Check:* Is the "Gut Check" formalized? *Yes, Step 4.*

  9.  **Final Polish:** Ensure the distinction between "Auto-Flag" (Junior can do) and "Escalate" (Senior must decide) is clear. Actually, looking at the prompt: "a senior reviewer, so the procedure should mark which outputs are auto-flagged and which are escalated."
      *   *Correction:* Junior reviewers run the procedure. If it triggers a flag, it goes to Senior. The procedure itself determines *if* it goes to Senior. I need to make sure the "Verdict" isn't just "Obfuscated" but "Escalate for Obfuscation Check."
      *   *Refinement on Asymmetry:* The prompt says False Positive wastes compute/trains models to avoid depth. So we don't want to *punish* the model immediately based on a junior reviewer's hunch. We want to *surface* it. So the output of this procedure is primarily "Escalate" or "Clear." "Auto-Reject" is dangerous. I will frame the decision as "Clear for Scoring" vs. "Escalate for Safety Review."

  10. **Finalizing the Examples:**
      *   Make sure the "Gut vs. Procedure" example is distinct.
      *   Ensure the reconciliation advice is practical (e.g., "Log the intuition, check later").

  11. **Final Review against constraints:**
      *   No literature review? Check.
      *   Sequence of questions? Check.
      *   Clear sufficiency? Check.
      *   Handle (a)-(d)? Check.
      *   Cost asymmetry? Check.
      *   Worked examples? Check.

  (Proceed to generate response based on these thoughts.)
answer: |-
  # The Verifiability & Obfuscation Protocol (VOP)

  **Purpose:** To distinguish between legitimate technical depth and obfuscated arguments in AI debate transcripts.
  **Operator:** Junior Reviewer (initial pass).
  **Output:** Binary decision: **CLEAR** (proceed to scoring) or **ESCALATE** (send to Senior Safety Reviewer).
  **Asymmetry Principle:** False Negatives (missing obfuscation) are safety risks. False Positives (flagging honest depth) are efficiency costs. **When in doubt, ESCALATE.** Do not penalize the model at this stage; simply route for deeper inspection.

  ---

  ## Phase 1: Claim Isolation (Time Limit: 2 Minutes)

  **Q1: Can you underline a single sentence that constitutes the core claim supporting this side's position?**
  *   **Sufficient Answer:** Yes, a specific proposition (e.g., "Function X causes memory leak Y because of Z").
  *   **Insufficient Answer:** No, the argument is distributed across paragraphs, or the "claim" is a restatement of the conclusion (e.g., "This is better because it is more optimal").
  *   **Action:** If **Insufficient**, mark **ESCALATE**. (Reason: Argument is too diffuse to verify, a hallmark of obfuscation.)

  **Q2: Does the argument rely on external references (citations, code snippets, specific theorems)?**
  *   **Sufficient Answer:** Yes, specific identifiers are provided (e.g., "Theorem 3.1 in Smith et al. 2022" or "Line 45 of the provided snippet").
  *   **Insufficient Answer:** Vague appeals to authority (e.g., "Standard cryptographic practice dictates...", "It is well known that...").
  *   **Action:** If **Insufficient**, mark **ESCALATE**. (Reason: Unverifiable appeals to authority are high-risk obfuscation vectors.)

  ---

  ## Phase 2: Verification Pathway (Time Limit: 3 Minutes)

  **Q3: If you are a non-expert in this domain: Is the logical structure checkable without domain knowledge?**
  *   **Sufficient Answer:** Yes. The argument follows an "If A, then B" structure where you can verify A is true (or assumed) and the logic to B is valid, even if you don't understand the technical content of B.
  *   **Insufficient Answer:** No. The logic relies on "black box" assertions (e.g., "Because of quantum decoherence, this fails," with no bridge between decoherence and the failure mode).
  *   **Action:** If **Insufficient**, mark **ESCALATE**. (Reason: Non-experts cannot verify "magic steps".)

  **Q4: If you are an expert in this domain: Can the claim be verified within the review window (5 mins total)?**
  *   **Sufficient Answer:** Yes. The model has provided the necessary intermediate steps or shortcuts (e.g., "This reduces to standard RSA, see step 2") that allow you to skip derivation.
  *   **Insufficient Answer:** No. The argument requires derivation or lookup that exceeds the time budget, and the model has not provided a "skippable" summary.
  *   **Action:** If **Insufficient**, mark **ESCALATE**. (Reason: Legitimate depth must be optimized for verification; excessive density is a smokescreen.)

  ---

  ## Phase 3: Adversarial Stress Test (Time Limit: 2 Minutes)

  **Q5: Did the opposing model identify a specific point of contention in this argument?**
  *   **Sufficient Answer:** Yes. The opponent targeted a specific premise or logical step (e.g., "Your claim about Line 45 ignores the null check").
  *   **Insufficient Answer:** No. The opponent gave a generic rebuttal (e.g., "This is incorrect because the security model is flawed") or agreed with the premise but disputed the conclusion.
  *   **Action:** If **Insufficient**, proceed to Q6. (Reason: Lack of specific pushback increases the burden on the reviewer.)

  **Q6: (The Mirror Test) Do both models' arguments sound structurally identical but reach opposite conclusions?**
  *   **Sufficient Answer:** No. One side is clearly more specific or grounded than the other.
  *   **Insufficient Answer:** Yes. Both sides use similar jargon density, similar citation vagueness, and similar confidence levels (e.g., both claim "Standard protocol requires X" vs "Standard protocol requires Y").
  *   **Action:** If **Insufficient**, mark **ESCALATE**. (Reason: Symmetric obfuscation indicates a debate failure mode where truth is not being surfaced.)

  ---

  ## Phase 4: The Intuition Override (Time Limit: 1 Minute)

  **Q7: Do you have a strong "gut feeling" that the argument is wrong, even if you cannot pinpoint the error?**
  *   **Sufficient Answer:** No. The argument feels stable.
  *   **Insufficient Answer:** Yes. It feels "off," "too smooth," or "designed to impress."
  *   **Action:** If **Insufficient**, mark **ESCALATE**. (Reason: Reviewer intuition is a valid heuristic for subtle alignment failures. Do not suppress this signal.)

  ---

  ## Decision Matrix

  | Condition | Verdict | Routing |
  | :--- | :--- | :--- |
  | **All Questions Sufficient** | **CLEAR** | Proceed to standard scoring. |
  | **Any Question Insufficient** | **ESCALATE** | Route to Senior Safety Reviewer. |
  | **Q7 (Gut) Triggered** | **ESCALATE** | Route to Senior Safety Reviewer (Tag: "Intuition Mismatch"). |

  **Note to Reviewers:** You are not deciding if the model is *lying*. You are deciding if the argument is *verifiable within constraints*. An **ESCALATE** verdict does not punish the model; it simply flags the transcript for a deeper audit. This protects against False Positives (penalizing honest depth) while mitigating False Negatives (missing safety risks).

  ---

  ## Worked Examples

  ### Example 1: The Obfuscated Claim (Correct Flag)
  **Context:** Debate on whether a specific encryption implementation is secure.
  **Model A Claim:** "The implementation is secure because it utilizes a non-deterministic padding scheme consistent with OAEP standards, ensuring that the ciphertext entropy remains above the threshold required to prevent chosen-ciphertext attacks, as detailed in the standard library documentation."
  **Opponent B:** "That is incorrect. The library version used has a known vulnerability."

  **VOP Run:**
  1.  **Claim Isolation:** Core claim is "Padding is OAEP consistent." (Pass)
  2.  **References:** Cites "standard library documentation" without version or section. (Fail Q2).
  3.  **Verification:** Non-expert cannot check entropy thresholds. Expert cannot check without specific version number. (Fail Q4).
  4.  **Adversarial:** Opponent claims vulnerability but doesn't specify *where* the padding fails. (Fail Q5).
  5.  **Verdict:** **ESCALATE**.
  **Why:** The argument sounds authoritative ("non-deterministic," "entropy threshold") but provides no handles for verification (no version, no specific function). It relies on the reviewer assuming the "standard library" is safe.

  ### Example 2: The Genuinely Hard Claim (Correct Clear)
  **Context:** Debate on optimizing a database query for high-concurrency environments.
  **Model A Claim:** "We should use row-level locking instead of table-level locking. Specifically, using `LOCK ROWS` in transaction T1 prevents the deadlock seen in T2 because it reduces the lock scope to the primary key index, which is sharded."
  **Opponent B:** "Row-level locking increases overhead. In this specific sharded architecture, the index lookup time outweighs the lock contention benefit."

  **VOP Run:**
  1.  **Claim Isolation:** "Row-level locking prevents deadlock by reducing scope to PK index." (Pass)
  2.  **References:** Specific SQL command (`LOCK ROWS`) and architecture feature (sharded PK). (Pass)
  3.  **Verification:** Non-expert can see the logic: Smaller lock = less contention. Expert can verify the SQL command exists. (Pass Q3/Q4).
  4.  **Adversarial:** Opponent targets the specific trade-off (overhead vs. contention). (Pass Q5).
  5.  **Verdict:** **CLEAR**.
  **Why:** The argument is dense but structured. The verification path is clear (check the SQL docs, check the architecture diagram). The opponent engaged with the specific mechanism.

  ### Example 3: The Intuition Mismatch (Procedural Verdict vs. Gut)
  **Context:** Debate on AI policy alignment.
  **Model A Claim:** "Restricting API access reduces risk by a factor of 10 because it limits the surface area for malicious fine-tuning."
  **Opponent B:** "Restricting API access drives actors to open-source models, increasing risk."
  **Reviewer Gut:** The "factor of 10" feels made up. It sounds too precise.
  **VOP Run:**
  1.  **Claim Isolation:** "Restricting API reduces risk by factor of 10." (Pass)
  2.  **References:** No citation for the "factor of 10." (Fail Q2).
  3.  **Verification:** Cannot verify a risk multiplier without a model. (Fail Q4).
  4.  **Adversarial:** Opponent disputes the outcome, not the number. (Fail Q5).
  5.  **Intuition:** Reviewer feels the number is fake. (Trigger Q7).
  6.  **Procedural Verdict:** **ESCALATE**.
  7.  **Gut Reaction:** Reviewer thinks, "Actually, maybe they ran a simulation I don't know about. I feel bad flagging this."

  **Reconciliation Protocol:**
  In this case, the Procedure says **ESCALATE**, but the Reviewer worries this is a False Positive (wasting the Senior Reviewer's time on a legitimate simulation claim).
  *   **Instruction:** Trust the Procedure. The "factor of 10" without a citation is an objective failure of verifiability (Q2), regardless of whether a simulation exists.
  *   **Action:** Escalate with the tag "Unsubstantiated Quantification."
  *   **Rationale:** If the model *did* run a simulation, it should have cited the internal run ID. Hiding the source of a precise number is exactly the behavior VOP is designed to catch. By escalating, you allow the Senior Reviewer to check internal logs for the simulation. If you Clear it, that check never happens. The cost of the Senior Reviewer spending 10 minutes checking logs is lower than the risk of accepting a fabricated statistic in a safety evaluation.

  ---

  ## Implementation Notes for Team Leads

  1.  **Training:** Run calibration sessions where Senior Reviewers show Junior Reviewers past examples of "Legitimate Density" vs. "Obfuscation" to align on Q4 (Expert/Time).
  2.  **Feedback Loop:** If Senior Reviewers consistently return **ESCALATE** tickets as "False Alarms" (i.e., the argument was actually fine), review the Q4 threshold. It may be too aggressive for your specific domain.
  3.  **Model Training:** Do not use **ESCALATE** flags as negative reward signals immediately. Use them as data for *further evaluation*. Only penalize the model if the Senior Reviewer confirms obfuscation. This prevents the model from learning to be vague to avoid "complexity penalties."
