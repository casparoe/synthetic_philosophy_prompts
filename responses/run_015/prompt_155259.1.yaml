prompt: |-
  I commission history documentaries for a public broadcaster: around a dozen pitches a week, and lately maybe a third of them are alternative-chronology or ancient-astronaut material — Atlantis pinned to a specific site off a sonar anomaly, megaliths attributed to visitors from elsewhere, or the claim that long stretches of the documented past were fabricated by later chroniclers, so that one well-known empire is really a duplicate of another. Each pitch has to be routed to one of three outputs — commission as history, commission with an on-screen contested-history framing, or commission as labelled entertainment — and my written rationale goes to an editorial standards committee that has to defend it to the regulator if a complaint lands. I have about twenty minutes per pitch and no specialist on staff.

  I tried operationalising the obvious demarcation toolkit — falsifiability, and the progressive-versus-degenerating contrast for research programmes — and it misfired in both directions at once. The fabricated-chronology pitch scored better than a mainstream-revisionist pitch from a working archaeologist, because the former stated bold checkable predictions and the latter hedged everything in confidence intervals; and a pitch about an apparently anachronistic artifact was flagged purely for contradicting consensus, which is close to how archaeologists embarrassed themselves by dismissing anomalous sites that later turned out to be genuine. So I need something more robust than a falsifiability checklist.

  Please write me a decision procedure my producers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts (publicity, tone, whether a framing is condescending). It should be runnable in twenty minutes by a generalist, and should say what to do when an answer can't be obtained. In particular I want it to handle three things a naive version gets wrong: claims that must rewrite well-attested records — and so owe some account of why the records look the way they do — carry a different burden from claims that merely add an undocumented event; a claim's evidential bar should be tested for drift, i.e. whether it moves after an objection is answered; and the procedure needs an explicit guard against its own conservatism, so that surprise and conflict-with-consensus aren't treated as evidence of crankery.

  Then run it on three pitches: one arguing that a familiar empire is a duplicate created by chroniclers, with a stated prediction that no datable layer will be found at a named site between two centuries; one arguing that a megalithic alignment is too precise to be chance and that mainstream archaeology cannot explain the site at all; and one locating Atlantis at a specific place and date, whose proponent has publicly staked his reputation on a sediment core. My own hunch is that the third is the most respectable of the three, since it at least sticks its neck out — if the procedure disagrees, say so and tell me which step kills it.

  Finally: which distinctions have to survive the simplification into a checklist and which can safely be dropped, where the procedure cannot eliminate judgment, and what it cannot do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Commissioner of history documentaries for a public broadcaster.
      *   **Problem:** High volume of "alternative history" pitches (Atlantis, ancient astronauts, fabricated chronology). Needs to route them to one of three outputs: (1) Commission as History, (2) Commission with Contested-History Framing, (3) Commission as Labelled Entertainment.
      *   **Constraints:** 20 minutes per pitch, no specialist staff, rationale must withstand regulatory scrutiny (editorial standards committee).
      *   **Previous Failure:** Tried using Popperian falsifiability and Lakatosian research programmes. Failed because "crank" theories often make bold predictions (high falsifiability) while mainstream science hedges (confidence intervals). Also flagged legitimate anomalies just for contradicting consensus.
      *   **Requirements for the Procedure:**
          *   Ordered questions.
          *   Sufficient answers defined.
          *   Stop points (No).
          *   Hand-off points (Values/Judgment).
          *   Handle missing info.
          *   Specific handling for: rewriting attested records (higher burden), evidential drift (moving goalposts), guard against conservatism (don't penalize surprise).
      *   **Test Cases:**
          1.  Duplicate Empire (Chronology Fabrication): Predicts no datable layer at Site X between Century A & B.
          2.  Megalithic Alignment: Too precise for chance, mainstream can't explain it.
          3.  Atlantis Location: Specific place/date, proponent staked reputation on sediment core.
      *   **Final Analysis:** Which distinctions survive simplification? Where does judgment remain? What can't the procedure do?

  2.  **Deconstruct the Epistemological Problem:**

      *   The user correctly identifies that *falsifiability* alone is insufficient. Pseudoscience often loves bold, falsifiable claims ("I prove X exists here!"). Mainstream science is probabilistic.
      *   The core issue isn't just "is this true?" (we can't know that in 20 mins) but "is this *methodologically sound enough* to present as history?"
      *   Key differentiators between rigorous revisionism and pseudohistory:
          *   **Engagement with Counter-evidence:** Does the proponent explain *why* the existing record looks wrong if they are wrong? (The "Conspiracy vs. Error" distinction).
          *   **Evidential Stability:** Does the theory change every time a flaw is pointed out? (Ad hoc hypotheses).
          *   **Source Hierarchy:** Does it treat primary evidence (archaeology, contemporary texts) equal to secondary interpretation?
          *   **Consensus Interaction:** Does it ignore consensus or attempt to overturn it with *better* data?

  3.  **Drafting the Decision Procedure (The "20-Minute Triage"):**

      *   *Goal:* A flowchart-style text that a producer can read and apply.
      *   *Structure:* Phases.
          *   Phase 1: The "Hard No" Filters (Ethical/Legal/Safety).
          *   Phase 2: Methodological Hygiene (The core epistemic check).
          *   Phase 3: Burden of Proof (Specific to the type of claim).
          *   Phase 4: The Value Judgment (Framing).
      *   *Addressing Specific Constraints:*
          *   *Rewriting Records:* Need a specific question about accounting for the *existence* of the conflicting record.
          *   *Evidential Drift:* Need a check on whether the pitch has changed its core claims in response to prior criticism.
          *   *Conservatism Guard:* Explicitly state that contradicting consensus is not an automatic fail, but requires higher quality evidence.

      *   *Drafting Questions:*
          1.  **Harm/Offense:** (Standard compliance).
          2.  **Evidence Type:** Is it based on physical data/text or intuition/connection?
          3.  **The "Ghost Record" Test:** If you say the records are fake/wrong, what mechanism created the fake records? (Crucial for the Duplicate Empire pitch).
          4.  **The "Moving Goalpost" Test:** Has the claim shifted to avoid refutation?
          5.  **The "Stake" Test:** Is the proponent willing to be wrong? (Risk).
          6.  **Peer Engagement:** Have they tried to publish/talk to experts?

      *   *Refining for Time:* Keep it to 5-6 critical questions.
      *   *Refining for Regulation:* Needs to sound like "Due Diligence."

  4.  **Developing the Test Cases:**

      *   **Pitch 1 (Duplicate Empire):**
          *   Claim: Empire A = Empire B (Chronology fabrication).
          *   Evidence: Prediction of no datable layer.
          *   Analysis: High burden. To say records are fabricated requires explaining *who* fabricated them and *how* without trace. The prediction is good (falsifiable), but the mechanism for the fraud is usually the weak point.
          *   *Procedure Outcome:* Likely "Contested" or "Entertainment" depending on the explanation of the fraud.
      *   **Pitch 2 (Megalithic Alignment):**
          *   Claim: Too precise, mainstream can't explain.
          *   Evidence: Appeal to ignorance ("Mainstream can't explain").
          *   Analysis: Classic pseudoscience move. Absence of evidence $\neq$ Evidence of aliens/super-tech. Needs positive evidence, not just negative.
          *   *Procedure Outcome:* Likely "Entertainment."
      *   **Pitch 3 (Atlantis/Sediment Core):**
          *   Claim: Specific location/date.
          *   Evidence: Sediment core, reputation staked.
          *   Analysis: This looks like science. Specific prediction, physical data, risk taken. Even if wrong, it's *methodologically* history/science.
          *   *Procedure Outcome:* Likely "Contested History" (if it contradicts strong consensus) or "History" (if the data is robust enough). *Self-Correction:* The prompt says the user thinks this is the most respectable. I need to see if the procedure agrees. If the core data is peer-reviewed or at least obtainable, it passes the "Evidence" check.

  5.  **Refining the "Conservatism Guard":**

      *   Must explicitly state: "Does this contradict consensus?" -> If Yes, "Is the new evidence *independent* of the theory?"
      *   Avoid: "Is this accepted by experts?" (Too conservative).
      *   Use: "Does this offer a mechanism that fits the data better than the current model?"

  6.  **Writing the Procedure (Iterative refinement):**

      *   *Step 1: The 'Hard Floor'.* (Defamation, Hate Speech, etc.).
      *   *Step 2: The Evidence Hierarchy.* (Physical/Contemporary vs. Interpretive/Modern).
      *   *Step 3: The 'Accounting for Silence' Test.* (Crucial for the 'Fabricated Record' pitch). If you say history is a lie, who lied and why does the lie look consistent?
      *   *Step 4: The 'Drift' Check.* (Has the theory changed to dodge bullets?).
      *   *Step 5: The 'Risk' Check.* (What proves them wrong?).
      *   *Decision Matrix:* Map answers to the 3 outputs.

  7.  **Running the Test Cases:**

      *   *Pitch 1 (Duplicate Empire):* Fails Step 3 (Accounting for Silence). Hard to explain a global conspiracy of chroniclers without new physical evidence. The prediction (no layer) is good, but the premise (fabrication) is the weak link.
      *   *Pitch 2 (Megaliths):* Fails Step 2 (Evidence Hierarchy). Relies on "Mainstream can't explain" (Argument from Ignorance). No positive mechanism offered.
      *   *Pitch 3 (Atlantis):* Passes Step 2 (Physical core). Passes Step 5 (Risk/Stake). Might trigger Step 3 (Accounting for Silence/Consensus) but if the core data is solid, it overrides. *Wait, does it contradict consensus?* Yes. So it needs high quality evidence. If the core is real data, it goes to "Contested."

  8.  **Final Analysis (Distinctions & Limitations):**

      *   *Survive:* Evidence hierarchy, Accounting for Silence, Risk/Stake.
      *   *Drop:* Falsifiability (as a binary), Consensus (as a veto).
      *   *Judgment:* Tone, "Condescending" framing, Public Interest value.
      *   *Cannot Do:* Determine truth. Guarantee no complaints. Replace specialist review for high-stakes commissions.

  9.  **Review against Constraints:**
      *   20 minutes? Yes, if questions are sharp.
      *   Generalist? Yes, avoids jargon.
      *   Regulatory defense? Yes, focuses on *process* and *due diligence* rather than *truth*.
      *   Conservatism guard? Included in Step 4/5.
      *   Record rewriting burden? Included in Step 3.
      *   Evidential drift? Included in Step 4.

  10. **Final Polish:** Ensure tone is professional, actionable, and acknowledges the user's expertise while providing the tool. (Self-Correction: Make sure the "Hand-off" points are clear for the Editorial Standards Committee).

  *(Self-Correction during drafting)*: I need to be careful with Pitch 3. Atlantis is historically a myth (Plato). Locating it as a real place is inherently revisionist. The "Sediment Core" suggests a geological claim, not necessarily a historical one. If they claim "Atlantis existed as Plato said," that's hard. If they claim "This site inspired the myth," that's easier. The pitch says "Locating Atlantis at a specific place and date." This implies literal truth. The procedure must handle the "Myth vs. History" boundary. I will treat it as a claim of *historical fact* based on *geological evidence*. The procedure should flag the leap from geology to history.

  *(Refining the "Conservatism Guard")*: The user noted that falsifiability misfired because cranks make bold predictions. The fix is to check if the *evidence* supporting the prediction is robust, not just the prediction itself. Also, check if the theory *absorbs* negative evidence ad hoc.

  *(Refining the "Record Rewriting")*: This is the "New Chronology" problem (Fomenko etc.). The burden is explaining the *mechanism of error*. If I say "The Middle Ages didn't happen," I must explain why carbon dating, tree rings, and texts from China/Arabia all align to suggest they did. The procedure needs a specific question on "Cross-Corroboration."

  Let's assemble the final response.

  *Structure:*
  1. Introduction (Acknowledging the difficulty).
  2. The Procedure (The "20-Minute Triage").
  3. Application to the Three Pitches.
  4. Meta-Analysis (Distinctions, Judgment, Limitations).

  *Key check:* Did I answer the specific prompt about "where the procedure stops with a no" and "hands decision to a person"? Yes, I will build those gates in.
  *Key check:* Did I address the "conservatism guard"? Yes, by separating "Consensus" from "Corroboration."
  *Key check:* Did I address the "record rewriting" burden? Yes, via the "Mechanism of Error" question.

  Let's write it.cw
answer: |-
  ## The 20-Minute Epistemic Triage (MET)

  This procedure is designed for regulatory defense. It does not determine *truth*; it determines *due diligence*. It shifts the question from "Is this claim correct?" to "Is this claim constructed in a way that allows it to be tested, challenged, and contextualized?"

  **Outputs:**
  *   **H (History):** Presented as factual record.
  *   **C (Contested):** Presented as a hypothesis challenging consensus (requires on-screen framing).
  *   **E (Entertainment):** Presented as speculation/myth/speculative fiction.

  **The Conservatism Guard:** At no point does "Contradicts Consensus" trigger an automatic **No**. It triggers a higher burden of *independent corroboration*. Anomaly is not evidence of crankery; *isolation* is.

  ---

  ### Phase 1: The Hard Floor (3 Minutes)
  *Stop immediately if any answer is YES. Route to Legal/Compliance.*

  1.  **Does the pitch rely on protected characteristics (race, religion, ethnicity) to explain historical capability or incapacity?** (e.g., "Only Group X could build this.")
  2.  **Does the pitch allege a conspiracy involving living persons or protected institutions for the purpose of defamation?**
  3.  **Is the primary evidence inaccessible to the production team for independent verification?** (e.g., "The document is in a private vault we cannot film or verify.")

  *If all NO → Proceed to Phase 2.*

  ### Phase 2: Methodological Hygiene (10 Minutes)
  *Generalist check. Requires the pitch document and one search engine query.*

  **Q1: The Evidence Hierarchy**
  *   **Question:** Is the core claim derived from primary data (stratigraphy, contemporary texts, isotopic dating) or secondary interpretation (symbolism, numerical patterns, mythological parallels)?
  *   **Sufficient Answer:** Primary data must form the *foundation*. Interpretation can build on it, but cannot replace it.
  *   **Fail:** The claim rests entirely on "Mainstream archaeology cannot explain X" (Argument from Ignorance) or "The myths say X" (treating myth as minutes of a meeting).
  *   **Action:** If Fail → Route to **E**.

  **Q2: The Mechanism of Error (The Record-Rewriting Test)**
  *   **Question:** If the claim requires established records/dates to be wrong, does the proponent offer a *mechanism* for that error that is physically/historically plausible?
  *   **Sufficient Answer:** A specific account of how the error occurred (e.g., "Carbon calibration curves were misapplied," "A specific chronicler conflated two kings") that does not require a global, traceless conspiracy.
  *   **Fail:** "Historians are blind," "The records were forged by a shadow group," or no explanation offered.
  *   **Note:** This carries a higher burden than simply adding an undocumented event. Rewriting history requires explaining the *existence* of the history being rewritten.
  *   **Action:** If Fail → Route to **C** (if data is strong) or **E** (if data is weak). Do not allow **H**.

  **Q3: Evidential Drift Check**
  *   **Question:** Has the core claim shifted to accommodate prior criticism? (Search the proponent's name + "criticism" or "refuted".)
  *   **Sufficient Answer:** The core hypothesis remains stable; only peripheral details are adjusted.
  *   **Fail:** The specific prediction (date, location, mechanism) changes every time a counter-example is found (Ad Hoc Rescue).
  *   **Action:** If Fail → Route to **E**.

  **Q4: The Risk Stake**
  *   **Question:** What specific finding would prove the proponent *wrong*?
  *   **Sufficient Answer:** A clear, physical condition (e.g., "If a coin from Century Y is found in Layer Z").
  *   **Fail:** "Any finding can be reinterpreted to fit the theory" or "The absence of evidence is evidence of suppression."
  *   **Action:** If Fail → Route to **E**.

  *If all Pass → Proceed to Phase 3.*

  ### Phase 3: The Value Hand-Off (7 Minutes)
  *This phase cannot be automated. It requires a producer's judgment on tone and public value. Document the rationale.*

  **Q5: The Framing Tone**
  *   **Question:** If commissioned as **C** (Contested), can we frame this without condescension *and* without legitimizing pseudoscience?
  *   **Judgment Point:** If the only way to film this is to treat the proponent as a martyr against "The Establishment," it risks violating impartiality guidelines.
  *   **Action:** If the tone cannot be balanced → Downgrade to **E**.

  **Q6: Public Interest vs. Public Confusion**
  *   **Question:** Does presenting this theory as **C** (Contested) educate the audience on *how history is done*, or does it merely suggest "everything we know might be a lie"?
  *   **Judgment Point:** A pitch that shows *why* the consensus exists and *how* this new data challenges it is **C**. A pitch that suggests "no one knows anything" is **E**.
  *   **Action:** Producer decision. Record rationale for Committee.

  ---

  ## Application to Your Three Pitches

  ### Pitch 1: The Duplicate Empire (Chronology Fabrication)
  *Claim: Empire A is a duplicate of Empire B; records fabricated. Prediction: No datable layer at Site X between Century 1 & 2.*

  *   **Q1 (Evidence):** Pass. Uses stratigraphy (datables layers).
  *   **Q2 (Mechanism of Error):** **FAIL.** To claim an entire empire is a duplicate requires explaining why contemporary records from *other* civilizations (who traded with them) also reflect this timeline. A "chronicler fabrication" usually fails the cross-corroboration test. The burden here is extreme.
  *   **Q3 (Drift):** Unknown without search, but this theory class often shifts dates when dendrochronology contradicts.
  *   **Q4 (Risk):** Pass. The prediction about Site X is falsifiable.
  *   **Decision:** **Route to E (Entertainment) or C (Contested) with heavy caveats.**
      *   *Rationale:* While the prediction is falsifiable (satisfying your previous falsifiability test), the *premise* fails the Mechanism of Error test. You cannot present the fabrication of a centuries-long empire as **H** without a plausible mechanism for the forgery that survives cross-cultural verification.
      *   *Correction to your hunch:* This is *less* respectable than Pitch 3 because it requires negating vast amounts of independent data, not just finding a new site.

  ### Pitch 2: The Megalithic Alignment
  *Claim: Alignment too precise for chance; mainstream cannot explain it.*

  *   **Q1 (Evidence):** **FAIL.** "Mainstream cannot explain" is an Argument from Ignorance. Precision can be achieved with simple tools (water levels, plumb lines) demonstrated by experimental archaeology. The pitch offers no physical evidence of *who* built it or *when*, only that current models are insufficient.
  *   **Q2 (Mechanism of Error):** N/A (Doesn't rewrite records, just claims mystery).
  *   **Q4 (Risk):** **FAIL.** Usually, these claims argue that "lack of proof" is due to erosion or suppression.
  *   **Decision:** **Route to E (Entertainment).**
      *   *Rationale:* Fails the Evidence Hierarchy. It relies on a gap in knowledge rather than new positive data. Presenting this as **C** implies a scientific controversy where none exists (the controversy is in the popular press, not the journals).

  ### Pitch 3: Atlantis at Specific Site (Sediment Core)
  *Claim: Specific location/date. Proponent staked reputation on sediment core.*

  *   **Q1 (Evidence):** **PASS.** Sediment cores are physical, primary data.
  *   **Q2 (Mechanism of Error):** **PASS (Conditional).** If the claim is "This site inspired the myth" rather than "Plato was writing literal history," it fits. If they claim Plato was literal, they must explain the textual transmission. Assuming they are arguing for a *catastrophic event* that inspired the myth, the mechanism is geological, not conspiratorial.
  *   **Q3 (Drift):** **PASS.** "Staked reputation on a core" implies fixed parameters.
  *   **Q4 (Risk):** **PASS.** If the core shows no tsunami layer/bronze age debris at that date, they are wrong.
  *   **Decision:** **Route to C (Contested History).**
      *   *Rationale:* This is the most respectable of the three. It sticks its neck out (Risk), uses primary data (Evidence), and doesn't necessarily require a conspiracy (Mechanism).
      *   *Why not H?* Because "Atlantis" carries a mythological burden. To commission as **H**, you would need to strip the label "Atlantis" and call it "Bronze Age Collapse Site X." Keeping the label "Atlantis" necessitates **C** framing to distinguish myth from archaeological hypothesis.
      *   *Conservatism Guard:* Even though "Atlantis" is fringe, the *method* is mainstream geology/archaeology. The procedure correctly identifies this as a valid scientific challenge, not pseudoscience.

  ---

  ## Meta-Analysis: Distinctions, Judgment, and Limits

  ### 1. Distinctions That Must Survive Simplification
  *   **Primary vs. Secondary Evidence:** You cannot drop this. Pseudohistory thrives on treating interpretations (myths, symbols) as data. The checklist must distinguish "We found a pot" from "The myth describes a pot."
  *   **Mechanism of Error:** You must keep the requirement that rewriting history explains *how* the history got written wrongly. This is the single best filter for "New Chronology" style pitches.
  *   **Risk/Stake:** A theory that cannot be wrong is not history. This survives simplification better than "falsifiability" because it focuses on the *proponent's commitment* rather than the logical structure.

  ### 2. Distinctions That Can Be Dropped
  *   **Falsifiability (Binary):** As you noted, cranks love falsifiable claims. Drop the question "Is it falsifiable?" and replace it with "Has the proponent defined what would prove them wrong?" (The Risk Stake).
  *   **Consensus Status:** Do not ask "Do experts agree?" Ask "Is the evidence independent of the theory?" Consensus is a lagging indicator; independent corroboration is a leading one.

  ### 3. Where Judgment Cannot Be Eliminated
  *   **Tone and Framing (Phase 3, Q5):** A checklist cannot detect condescension or "both-sidesism." A producer must watch the sizzle reel to see if the "Contested" framing feels like a genuine scientific debate or a manufactured controversy.
  *   **Public Value (Phase 3, Q6):** Deciding whether a wrong theory is *educationally useful* is a value judgment. A theory that is wrong but demonstrates good archaeological method might be worth commissioning as **C**. A theory that is wrong and teaches bad method is **E**.

  ### 4. What The Procedure Cannot Do
  *   **Guarantee Truth:** It guarantees *process*, not *accuracy*. You may still commission a documentary that turns out to be wrong, but you can defend the *decision to commission* based on due diligence.
  *   **Replace Specialists for High-Stakes H:** If a pitch passes all checks and you intend to commission as **H** (History), you *must* send it to an external specialist. This procedure is for triage (H vs C vs E), not final verification of **H**.
  *   **Prevent Bad Faith Complaints:** Regulators care about process. This procedure creates a paper trail showing you considered the risks. It cannot stop a viewer from complaining, but it arms the Committee with the rationale: "We categorized this as Contested because it passed the Risk Stake but failed the Consensus Corroboration."

  ### Summary of Your Hunch
  You suspected Pitch 3 (Atlantis/Core) was the most respectable. **The procedure agrees.**
  *   **Pitch 1** dies on the *Mechanism of Error* (cannot explain the global record).
  *   **Pitch 2** dies on *Evidence Hierarchy* (argument from ignorance).
  *   **Pitch 3** passes *Risk* and *Evidence*, landing in **Contested**. It is methodologically sound even if the conclusion is controversial.
