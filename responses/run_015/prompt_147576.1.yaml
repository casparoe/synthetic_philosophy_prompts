          *   *Conflict:* If *li* is exclusive, how do the sprouts function as a ground for critique *before* or *outside* the corrupt *li*? If the *li* is corrupt (per 3), and *li* is the only source of moral development (per 5), how do we know it's corrupt? We need the sprouts (4). But if sprouts need *li* to become virtues (5), can they judge *li*?
          *   *Severity:* High. This threatens the possibility of (3) (resistance). If *li* is exclusive, corrupt *li* blocks moral knowledge. If sprouts judge *li*, they must have some independence from *li*.
          *   *Resolution:* Soften (5). Allow sprouts to provide *proto-moral* intuition independent of *li*, even if full virtue requires *li*.

      *   **Tension C: The Vocabulary of Resistance (3 vs. 6 vs. 1)**
          *   (3) Resistance is required.
          *   (6) Must use role vocabulary.
          *   (1) Self is roles.
          *   *Conflict:* If the roles themselves are the source of corruption (e.g., "Ruler" implies absolute obedience), how do you critique using that vocabulary? Usually, Confucians appeal to the *ideal* role (True King vs. Tyrant). This works *if* the vocabulary contains normative ideals.
          *   *Severity:* Medium. This is the standard "immanent critique" defense. It works *unless* the corruption is systemic to the vocabulary itself.
          *   *Resolution:* Clarify (6) to allow appealing to the *normative ideal* of the role, not just the current instantiation.

      *   **Tension D: Particularism vs. Critique (2 vs. 3)**
          *   (2) Obligations are particular, not universal.
          *   (3) Resistance is required based on normative structure.
          *   *Conflict:* If obligations are purely particular, what is the "normative structure" in (3)? Is it universal to "fatherhood" or specific to *this* father?
          *   *Severity:* Low/Medium. Role ethics usually posits universal *types* of roles with particular *instantiations*.
          *   *Resolution:* Clarify that roles have trans-particular normative expectations.

  5.  **Ranking and Refining:**

      *   **Rank 1 (Severe): (1) vs. (4).** The "No pre-social core" vs. "Innate sprouts prior to cultivation." This is the metaphysical bottleneck. If you keep strong (1), you must weaken (4). If you keep strong (4), you must weaken (1). Given the package is "Confucian Role Ethics" (usually associated with Ames/Hall), (1) is the flagship claim. But (4) is the only engine for (3).
          *   *Decision:* The tension is between *Substantive Self* (1 denies) and *Dispositional Nature* (4 affirms).
          *   *Revision:* Modify (1). Allow "dispositional potentials" without "substantive core."

      *   **Rank 2 (High): (4) vs. (5).** The "Ground of Critique" vs. "Exclusivity of Li." If *li* is the *exclusive* mechanism (5), then prior to *li*, the sprouts are morally inert. If they are inert, they cannot ground critique (3/4).
          *   *Decision:* (5) is too strong. It creates a circularity where *li* validates *li*.
          *   *Revision:* Modify (5). Sprouts provide *directional* moral intuition independent of *li*, even if *li* is needed for *cultivation*.

      *   **Rank 3 (Moderate): (6) vs. (3).** The "Vocabulary Constraint." If roles are corrupt, is the vocabulary tainted?
          *   *Decision:* This is solvable by distinguishing *ideal* roles from *empirical* roles.
          *   *Revision:* Clarify (6).

  6.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the sophistication of the package (it's a coherent Mengzi-Ames hybrid).
      *   *Tension 1 (The Metaphysical Anchor):* (1) vs. (4).
