      *   **Constraint:** Treat the set as a live position needing repair, not advocating for dropping a specific view arbitrarily.

  2.  **Analyze the Commitments:**
      *   (1) *Constitutive Relationality:* Self = roles. No pre-social core. (Anti-Cartesian/Anti-Atomist).
      *   (2) *Particularism:* Obligations are role-specific, not reducible to universals.
      *   (3) *Immanent Critique:* Roles can be violated; resistance is sometimes required.
      *   (4) *Four Sprouts (Mengzi):* Innate capacities (compassion, etc.) exist *prior* to full ritual cultivation.
      *   (5) *Ritual Exclusivity:* *Li* is the *exclusive* mechanism of moral development. Sprouts become virtues *only* through *li*. No growth outside *li*.
      *   (6) *Vocabulary Constraint:* Resistance must be articulated *within* role/ritual vocabulary. No role-independent standpoints.

  3.  **Initial Scan for Tensions:**
      *   (1) vs. (4): (1) says no pre-social core. (4) says sprouts are innate/prior to cultivation. Is "innate nature" a "pre-social authentic core"? This is a classic debate in Confucian scholarship (Ames/Hall vs. Mengzi orthodoxy).
      *   (4) vs. (5): (4) says sprouts exist prior. (5) says they become virtues *only* through *li*. This seems compatible (potential vs. actual), *but* (5) says "no moral growth outside this framework." If sprouts are innate, do they allow for *some* moral intuition outside *li*? (5) is very strong ("exclusive").
      *   (3) vs. (6): (3) allows resistance. (6) says resistance must be in role vocabulary. This is the standard "immanent critique" move, so likely compatible, *unless* the role vocabulary is exhausted by the corrupt role-holder.
      *   (1) vs. (6): If self is exhaustively roles, and roles are corrupt, where does the agency to resist come from? (4) provides the source (sprouts), but (1) denies the pre-social self.
      *   (4) vs. (1): This is the big one. "Innate capacities present in human nature prior to full ritual cultivation" sounds suspiciously like the "Cartesian residue" or "pre-social authentic core" denied in (1).

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension A: The Ontological Status of the Sprouts (1 vs. 4)**
          *   (1) denies any "pre-social authentic core."
          *   (4) affirms "innate four sprouts... prior to full ritual cultivation."
          *   *Conflict:* If I have innate moral capacities *prior* to socialization/ritual, do I have a "pre-social core"? Ames/Hall (Role Ethics proponents) often downplay Mengzi's transcendental nature to fit (1). But (4) explicitly invokes Mengzi's sprouts.
          *   *Severity:* High. This strikes at the metaphysical foundation. If (4) is true, (1) is arguably false or needs heavy qualification.
          *   *Resolution:* Modify (1) to allow for *dispositional* innate capacities without a *substantive* self. Or modify (4) to say sprouts are social potentials, not biological givens.

      *   **Tension B: The Source of Critique vs. Exclusivity of Li (4 vs. 5)**
          *   (4) Sprouts are the ground for critique.
