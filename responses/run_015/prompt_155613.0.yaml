          3.  The "Bottom Line" Verdict (Reference class & field status).
          4.  Application to Diagnostic Cut-offs (The committee's actual problem).
          5.  The "Protective Variant" Case.
          6.  Recommendations for the Committee.
      *   **Tone:** Objective, rigorous, respectful of the user's time and role.
      *   **Key Corrections to Emphasize:** Wakefield is Hybrid, not Normativist. "Statistical" $\neq$ "Functional Normality." Reference Class is a problem, not a refutation.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Wakefield:* Make sure to explain *why* he's hybrid (Evolutionary function + Social Harm).
      *   *Correction on Cut-offs:* Be careful not to say Naturalism makes cut-offs *easy*. They are still hard because biology is continuous. The *justification* for the cut-off differs (statistical deviation vs. net benefit).
      *   *Correction on Reference Class:* Explain that choosing age/sex is value-laden (why not race? why not occupation?), but once chosen, the functional assessment is empirical.
      *   *User's Hunch:* Validate the user's hunch that "normality = frequency" is wrong. Boorse talks about *functional contribution*, not just averages. (e.g., Everyone goes bald; baldness isn't necessarily a disease if it's age-typical, but if it impairs function relative to the *design* of the organism...). Actually, Boorse uses statistical distribution to define the "normal range" of function. I need to be precise: It's statistical *within a functional context*.
      *   *Protective Variant:* This is the "sickle cell" or "Factor V Leiden" problem. Naturalism struggles here. If the mechanism is "broken" compared to the species design, it's a disease, even if helpful. This is a strong point for the committee to consider regarding genetic screening.

  7.  **Final Review against User Constraints:**
      *   No library access? Keep citations minimal/explanatory.
