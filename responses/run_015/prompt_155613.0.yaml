  8.  **Final Polish:** Check for clarity and ensure the distinction between "Disease" (biological) and "Illness/Disorder" (social/normative) is clear, as this is crucial for the cut-off discussion. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't get bogged down in too much philosophical jargon. Keep it tied to the hospital committee context. The user asked for an "accuracy audit" first, then the application. I will follow that order.

