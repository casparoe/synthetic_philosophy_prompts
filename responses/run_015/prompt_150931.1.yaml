answer: |-
  ### Desiderata for a Theory of Meaningful Work in an Automated Economy

  | # | Requirement | Motivating Case / Distinction | Classification |
  | :--- | :--- | :--- | :--- |
  | **1** | **Meaning vs. Preference:** Differentiate meaning from mere instrumentality (wages) without reducing it to subjective preference (taste). | Prevents collapse into wage-slavery (instrumental) or hobbyism (subjective). Ensures meaning has normative weight. | **Non-negotiable** (Definitional) |
  | **2** | **The Post-Work Problem:** Explain the drive for work-like activity post-scarcity and why automating craft/care does not void remaining human activity of meaning. | Addresses the specific economic context. Counters the claim that efficiency dictates meaning; preserves human agency against obsolescence. | **Camp-specific** (Aristotelian/Activity Theory) |
  | **3** | **Intrinsic vs. Recognition:** Distinguish task value (doing) from status value (being recognized). Specify automation's threat to each. | Automation may preserve income (UBI) but erase status. A theory must isolate whether meaning loss is due to idleness or invisibility. | **Non-negotiable** (Analytical) |
  | **4** | **Empirical Adequacy:** Accommodate data: autonomy/mastery predict satisfaction better than income; involuntary unemployment harms wellbeing beyond financial loss. | Aligns theory with Self-Determination Theory and Latent Deprivation Model. Prevents abstract speculation contradicting psychological reality. | **Non-negotiable** (Empirical) |
  | **5** | **Locus of Meaning:** Adjudicate between activity, social relation, and narrative identity. Forbid arbitrary collapse among these. | Prevents reductionism. Ensures the theory can diagnose whether automation attacks the *doing*, the *connecting*, or the *story*. | **Camp-specific** (Ontological) |

  ***

  ### Evaluation of Candidate Accounts

  **1. Purely Subjective "Calling" Account**
  *   **Performance:** Fails (1), (4), (5).
  *   **Analysis:** By defining meaning as internal conviction, it reduces meaning to preference (violating 1). It cannot explain why involuntary unemployment harms wellbeing if meaning is solely internal (violating 4). It collapses meaning entirely into narrative identity (violating 5).
  *   **Verdict:** Inadequate.

  **2. Purely Objective "Social Contribution" Account**
  *   **Performance:** Fails (2), (5).
  *   **Analysis:** If meaning is social utility, high-efficiency automation renders human labor redundant, making remaining human activity meaningless (violating 2). It collapses meaning into social relation/utility, ignoring the intrinsic value of the activity or the agent's narrative (violating 5).
  *   **Verdict:** Inadequate.

  **3. Hybrid "Capability" Framework**
  *   **Performance:** Passes all.
  *   **Analysis:** Treats work as a functioning (objective) chosen by the agent (subjective), satisfying (1). Focuses on flourishing rather than output, surviving automation (2). Distinguishes between capabilities (freedom) and functionings (activity), handling (3) and (5). Aligns with autonomy data (4).
  *   **Verdict:** Adequate.

  ***

  ### The Single Eliminating Requirement

  **Requirement (5): Locus of Meaning (Forbid Arbitrary Collapse).**

  This requirement eliminates the most candidates (both the Purely Subjective and Purely Objective accounts). Both pure forms are definitionally reductionist: the "Calling" account collapses meaning into **Narrative Identity**, while the "Social Contribution" account collapses meaning into **Social Relation**. Only a hybrid framework (like Capabilities) possesses the ontological complexity to distinguish and weigh activity, relation, and identity simultaneously, making (5) the strictest filter against one-dimensional theories.
