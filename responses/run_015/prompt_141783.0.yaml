      *   *Correction:* The Audit is trying to isolate the "Responsibility" component to reward it (or perhaps to ensure people aren't punished for lack of it). The user says "dump... on whoever's left with the least." This sounds like they want to equalize outcomes *unless* effort explains the difference.
      *   *Okay, I will interpret the Audit as:* "Compensate for bad luck, reward for effort." The paradox is that if effort is luck, there's nothing to reward and nothing to compensate (since everything is luck).
