      *(Self-Correction during drafting)*: I need to be careful not to just bash the instructor. The Pump analogy *is* the standard defense of armchair philosophy (Williamson). I need to explain *why* it works as a defense, not just that it's empirically dubious. It works because it defines "mud" as "anything that varies," which immunizes the method. That's the "arguing" part.

      *(Third Metaphor)*: Let's go with **The Archaeological Brush**. It captures the "there is something there" (realism) but also the "the tool affects the reveal" (construction). No, **The Prism** is better for "splitting" one competence into many specific intuitions based on angle. Let's use **The Prism**.

