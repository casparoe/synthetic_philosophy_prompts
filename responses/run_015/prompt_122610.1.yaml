      *   *Critical Features of a Pump:* Conservation of mass (water doesn't increase), passivity of the source (aquifer doesn't change because you pump), independence (well exists without pump).

  3.  **Deconstruct the Poll/Dye Analogy (User's View):**
      *   *Poll Question:* The framing of the case.
      *   *Respondent:* The student.
      *   *Response:* The intuition.
      *   *Dye Tracer:* The specific details that highlight specific moral/epistemic pathways.
