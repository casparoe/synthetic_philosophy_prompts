  First, lay out the sub-questions you think the proposition turns on and give each a rough probability with one line of justification. These four are the ones I would start from, but add, split, or replace them as you see fit: whether a political community's right to preserve itself extends to preserving the moral culture that partly constitutes it, on anything like the terms on which it may punish sedition; whether slow, diffuse moral change across generations, in which no identifiable person is made worse off, is even the kind of thing that can be objected to in the relevant sense — and if it is, whether calling it a harm collapses the distinction Devlin's opponents rely on; whether criminal coercion is a causally efficacious and proportionate means to preventing that change; and what I think of as the bootstrapping worry, that if the shared morality in question is itself partly constituted and sustained by the enforcement appealed to, the argument vindicates the law by appeal to a morality the law has produced, so that the premise is circular rather than merely empirical. If it belongs in the tree, say where: Devlin's own proposed limit, that enforcement should reach only what would provoke intolerance, indignation and disgust in a reasonable person, may do no real work once the disintegration premise is granted.

  Then combine your terms, state your final credence to two decimal places, and name the single sub-question it is most sensitive to. Tell me which of the two of us is most likely wrong about which sub-question. Finally, say what argument or consideration would move your own number by more than 0.20 in either direction, and be explicit about where your reasoning is weakest rather than presenting the decomposition as more precise than it is.
