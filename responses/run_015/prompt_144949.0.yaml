      *   *Decisive:* Evidence that fundamentally contradicts the mechanism of *procedural* outsourcing (e.g., acting *against* procedure due to ideology, or acting *against* procedure due to personal sadism).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the thesis. It aligns with Arendt (banality of evil) but adds a specific psychological mechanism (role absorption).
      *   **Decisive Falsifiers (The "Kill Shots"):**
