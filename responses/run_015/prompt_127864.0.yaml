answer: |-
  # Final Examination: Philosophy of Action and Rational Agency
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer all three parts of the question below. Your response should be a single, coherent essay. Do not use external citations or bibliographies; rely on the concepts discussed in the seminar.

  ### Exam Question: The Divided-Driver Case

  **Scenario:**
  Consider the classic "Absent-Minded Driver" problem, where a driver must exit at the second of two identical intersections to maximize payoff but cannot distinguish them while driving. Now, consider a modified **Divided-Driver Case**. The driver knows he is absent-minded, but he also anticipates that at the decision point, a distinct "hot" reasoning state (driven by immediate impulse) will actively want to override any plan endorsed by his "cool" planning state. To mitigate this, he installs an automated exit-lock system programmed to take Exit B unless he manually overrides it. However, the lock has a known 2% mechanical failure rate, and the manual override remains physically available to the driver at the intersection.

  **Part A:** Reconstruct the original absent-minded driver problem. Identify the precise logical tension that makes a naive "stick-to-your-plan" recommendation collapse at the moment of action. You must distinguish between diachronic planning authority and synchronic belief updating.

  **Part B:** Analyze the Divided-Driver Case. Does the automated lock resolve the original difficulty, or does it transform the problem into one of strategic self-design? Discuss whether rationality requires disabling the manual override entirely. In your analysis, address what this implies about treating one's future self as an unreliable instrument rather than as a reasoning partner.

  **Part C:** Evaluate two competing interpretations of what this case reveals about rational agency: (1) Rationality is essentially diachronic strategic control over one's own mechanisms; (2) Rationality requires executive integration of cognitive states. Argue which interpretation better explains why disabling the override might still be rational even when the "hot" state protests.

  ***

  # Model Answer

  The original absent-minded driver problem illustrates a crisis of dynamic consistency in rational agency. At the planning stage, the driver calculates that continuing past the first intersection to exit at the second yields the highest payoff. However, because the intersections are indistinguishable, arriving at any intersection places the driver in an information set where they cannot know their location. The logical tension arises when the driver attempts to apply the plan at the node. Upon arrival, the driver must update their beliefs: "If I am following my plan to exit only at the second intersection, and I am at an intersection, there is a probability I am at the first." If the driver exits now, they risk being at the first intersection (zero payoff). If they continue, they risk overshooting. A naive "stick-to-your-plan" recommendation collapses because the synchronic belief at the moment of action ("I might be at the first exit") alters the expected utility calculation relative to the diachronic plan. The agent at the node cannot simply execute the past intention because their current epistemic position renders the original calculation unstable; the plan is no longer optimal given the updated beliefs inherent to the information set.

  In the Divided-Driver Case, the problem shifts from an epistemic limitation to a motivational conflict. The automated lock functions as a pre-commitment device, but the availability of the manual override reintroduces the agency of the future self. The lock does not fully resolve the difficulty; rather, it transforms the problem into one of strategic self-design. The core question is whether the "cool" planner should trust the "hot" actor. If the hot state is predicted to override the lock due to impulse rather than new information, rationality likely requires disabling the manual override entirely. This decision carries profound implications for autonomy. It implies treating the future self not as a reasoning partner whose contemporaneous judgments deserve deference, but as an unreliable instrument prone to corruption. The 2% mechanical failure rate introduces a necessary risk calculus: the agent must weigh the small probability of mechanical error against the high probability of motivational sabotage. If the hot state is deemed a deviation from the agent's endorsed values rather than a legitimate revision, the risk of mechanical failure is preferable to the certainty of self-sabotage. The lock externalizes the will, but only disabling the override secures it.

  This tension invites two interpretations of rational agency. The first, Diachronic Strategic Control, views rationality as maximizing outcomes over time, even if it requires binding future agency. The second, Executive Integration, views rationality as harmonizing cognitive states so that binding is unnecessary. In the Divided-Driver Case, Diachronic Strategic Control better explains why disabling the override is rational. Executive Integration suggests that a rational agent should negotiate between cool and hot states to achieve harmony. However, since the hot state is defined by its resistance to the cool plan based on impulse rather than reason, integration is impossible without capitulation to irrationality. The hot state's protest is not a valid counter-argument; it is a system error. Therefore, disabling the override is an act of preserving diachronic agency. It acknowledges that the future self's protest is noise, not signal. Rationality here is the capacity to maintain authority over one's life trajectory by neutralizing known internal threats. By accepting the 2% mechanical risk to eliminate the agential risk, the agent prioritizes the integrity of the long-term plan over the illusory freedom of the momentary self. True autonomy, in this context, is not the ability to choose at every node, but the power to ensure the nodes serve the agent's enduring ends.

  ***

  # Marking Scheme (Total: 20 Points)

  **Grade Distinctions:**
  *   **A-Grade (16–20 points):** Contains a precise logical reconstruction of the original tension (belief updating vs. planning); correctly identifies how the Divided-Driver case shifts the problem from forgetfulness to anticipated resistance; evaluates the two interpretations with explicit reference to the override decision; recognizes that the 2% failure rate introduces a separate risk-calculus layer distinct from agency failure.
  *   **B-Grade (12–15 points):** Summarizes the original problem accurately but treats the modified case superficially; may conflate motivational resistance with mere memory failure; discusses the override but fails to fully articulate the "instrument vs. partner" implication; chooses an interpretation in Part C without sufficient justification regarding the "hot state."

  **Must-Hit Moves (4 points each):**

  1.  **Reconstruction of Original Tension:** Clearly explains that the original problem fails due to belief updating at the information set, not just memory loss, causing the plan to be dynamically inconsistent.
      *   *Failure Mode:* Treating the original problem as a simple memory game without addressing the epistemic/belief update paradox.
  2.  **Diachronic vs. Synchronic Distinction:** Explicitly distinguishes between the authority of the planning stage (diachronic) and the epistemic position of the acting stage (synchronic).
      *   *Failure Mode:* Discussing "past vs. future" without referencing the specific epistemic limitations at the moment of action.
  3.  **Shift to Resistance:** Identifies that the Divided-Driver case changes the core issue from *cannot remember* to *will not comply* (motivational resistance).
      *   *Failure Mode:* Analyzing the modified scenario as if it were identical to the original forgetfulness problem.
  4.  **Instrument vs. Partner:** Discusses the normative implication of disabling the override (treating future self as an unreliable instrument rather than a reasoning partner).
      *   *Failure Mode:* Focusing only on the mechanical utility of the lock without addressing the philosophical implication for self-regard/autonomy.
  5.  **Evaluation of Interpretations:** Argues for Diachronic Strategic Control over Executive Integration by explaining why the "hot state" cannot be integrated rationally.
      *   *Failure Mode:* Selecting an interpretation based on preference rather than analyzing why one fits the specific constraints of the "hot state" protest.
