answer: |-
  You are right to be suspicious of the standard labels. "Sunk cost," "Concorde effect," and "escalation of commitment" are often used as catch-all buckets for any situation where people persist in a losing course of action. But as your three cases demonstrate, the *mechanism* driving that persistence matters. If you treat them as the same phenomenon, you will prescribe the wrong cure.

  Based on the structure of the cases you provided, these are **three distinct phenomena**. They share an outcome (persistence beyond the point of utility), but they are driven by different engines: one psychological, one mathematical, and one political.

  Here is the analysis of each, where they diverge from established concepts, and the terminology to distinguish them.

  ### Case 1: The "Free Exit" Auction
  **Diagnosis:** This is not a sunk-cost problem. In a standard sunk-cost scenario, you continue because you have already paid and cannot recover the investment. In your variant, the investment is fully recoverable if you quit. The money is not sunk; it is held in escrow.

  The driving force here is not economic calculation but **Competitive Override**. Your colleagues understood the arithmetic, but they were not playing against the auctioneer; they were playing against each other. The utility function shifted from "maximize dollars" to "minimize relative loss to the opponent." If I quit, I get $0. If you quit, you get $0. But if I bid $1.01 for a $1.00 note and you quit, I lose $0.01 and you lose nothing. However, if I force you to bid $1.05 and then I quit, I lose nothing and you lose $0.05. The goal becomes inflicting a loss on the rival rather than preserving one's own capital.

  *   **Why it fails "Sunk Cost":** Sunk cost relies on the irretrievability of past investment. Here, the past investment is retrievable.
  *   **Why it fails "Escalation of Commitment":** Escalation implies a desire to justify past decisions. Here, the players are free to invalidate past decisions instantly with no penalty.
  *   **Proposed Term:** **Competitive Override.**
  *   **Definition:** Persistence in a costly activity where exit is free, driven by the preference to defeat a specific rival over maximizing absolute utility.
  *   **Boundary Case:** Two children holding a "staring contest." Neither gains anything by winning, and both lose comfort by continuing. They can blink (exit) at any time for free. If they continue until one cries, that is Competitive Override. If they continue because they bet $5 on who blinks first, that is a standard wager. If they continue because they already stared for an hour and "don't want that hour to be wasted," that is Sunk Cost.

  ### Case 2: The "Zero-Sum" Auction
  **Diagnosis:** This is not a fallacy at all. Your reading is correct: this is a rational trap. By moving the runner-up's payment to the winner, you have changed the payoff matrix. Now, the pot grows not just by the note's value, but by the loser's contribution.

  As long as the increment is smaller than the pot, continuing is the mathematically dominant strategy for the current high bidder. For the low bidder, stopping guarantees a loss (paying the bid to the winner), while continuing offers a non-zero probability of winning the pot. The system is a **Structural Ratchet**. It mechanically converts the act of stopping into a penalty. Unlike Case 1, the players are not foolish; they are correctly responding to coercive rules.

  *   **Why it fails "Sunk Cost":** The decision to continue is not based on past spend, but on future probability. The past spend is gone either way; the math says "roll the dice again."
  *   **Why it fails "Escalation of Commitment":** Escalation suggests an emotional or cognitive bias. This is cold game theory. A computer programmed to maximize expected value would bid until bankruptcy.
  *   **Proposed Term:** **Structural Ratchet.**
  *   **Definition:** A system where the rules of interaction make the cost of termination strictly higher than the cost of continuation for the individual actor, regardless of the aggregate loss.
  *   **Boundary Case:** A game of "Chicken" where the brakes are removed. You cannot swerve (exit). You must drive forward. That is a Structural Ratchet. If the brakes work but you refuse to use them because you're proud, that is Competitive Override. If you refuse to swerve because you already drove ten miles and don't want to waste the gas, that is Sunk Cost.

  ### Case 3: The Monitoring Program
  **Diagnosis:** This is distinct from both games. It is not about competition (Case 1) or mathematical coercion (Case 2). It is about the distribution of **agency and liability**.

  In your monitoring program, "continuing" is the default state of the universe. It requires no signature, no meeting, and no specific action. "Stopping" is an event. It requires a proposal, a vote, and a name attached to the decision. The cost of continuing is diffuse (shared budget); the cost of stopping is concentrated (reputational risk for the proposer). This is **Attributional Inertia**. It is not that anyone *wants* to continue; it is that no one wants to be the *cause* of the stop.

  *   **Why it fails "Sunk Cost":** The proponents renewing the program did not make the initial investment. They are not justifying *their* past spend; they are avoiding *future* blame.
  *   **Why it fails "Escalation of Commitment":** There is no commitment to escalate. There is only a refusal to act. The driver is omission, not commission.
  *   **Proposed Term:** **Attributional Inertia.**
  *   **Definition:** Persistence of a sub-optimal status quo where the action required to terminate carries concentrated personal liability, while the action required to continue carries diffuse or invisible cost.
  *   **Boundary Case:** A life-support machine for a patient with no hope of recovery. The family leaves it on. Is it Sunk Cost? No, they didn't pay for the past weeks. Is it Competitive Override? No, they aren't fighting each other. It is Attributional Inertia: turning it off requires a specific decision that feels like "killing," whereas leaving it on allows nature to take the course. The cost of action (guilt/blame) exceeds the cost of inaction (money).

  ### Summary of Distinctions

  To answer your primary question: These are **three phenomena** that look alike only in their outcome (wasteful persistence). They differ in *why* the exit door is not used.

  1.  **Competitive Override (Case 1):** The exit door is open and free, but I choose not to use it because I want to beat *you*.
      *   *Test:* Can I quit without losing money? Yes. Do I quit? No.
  2.  **Structural Ratchet (Case 2):** The exit door is locked or electrified. I cannot use it without paying a penalty defined by the rules.
      *   *Test:* Can I quit without losing money? No. The rules punish stopping.
  3.  **Attributional Inertia (Case 3):** The exit door exists, but opening it requires me to sign my name on a form that says "I killed this." Leaving it closed requires no signature.
      *   *Test:* Is the cost of stopping financial or reputational? Reputational. Is the cost of continuing visible or hidden? Hidden/Diffuse.

  ### Why the Distinction Matters

  If you treat Case 1 as a Sunk Cost problem, you will tell your colleagues, "Forget what you bid, just look at the future." They will reply, "We are, and the future looks better if he blinks first." You cannot solve Competitive Override with arithmetic; you must remove the rival or change the goal from relative winning to absolute winning.

  If you treat Case 2 as a Sunk Cost problem, you will tell the players they are being irrational. They are not. You must change the *rules*, not their minds. You must unlock the ratchet.

  If you treat Case 3 as a Sunk Cost problem, you will argue that the past money is gone. The committee already knows that. They are worried about the *future* consequence of being the person who stopped it. You cannot solve Attributional Inertia with accounting; you must anonymize the decision or share the liability.

  ### Final Verdict

  You have isolated three separate mechanisms of persistence.
  *   Case 1 is **Psychological** (Ego/Rivalry).
  *   Case 2 is **Mathematical** (Incentive Structure).
  *   Case 3 is **Political** (Liability Distribution).

  They are not one phenomenon wearing three costumes. They are three different beasts that happen to graze in the same field of wasted resources. For your discussion group, I recommend using the terms **Competitive Override**, **Structural Ratchet**, and **Attributional Inertia**. They are tight, descriptive, and do not collapse into one another.
