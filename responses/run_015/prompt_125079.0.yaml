answer: |-
  **Project Title:** The Plotless Assembly: Narrative Discontinuity and the Vulnerability of Lottocratic Deliberation

  **Project Summary**
  Contemporary defenses of sortition and lottocracy posit random selection as the structural remedy for the representational bias and cognitive homogeneity inherent in electoral systems. These models successfully address *who* sits at the table, yet they remain largely silent on *how* the assembly constructs a shared sense of purpose over time. Elected bodies derive narrative continuity from the campaign trail: a shared backstory, a public mandate, and a projected character arc extending toward re-election. Randomly selected bodies lack this dramaturgical spine. They begin *in media res*, without a prologue, and often dissolve before a resolution is reached.

  This project investigates the consequences of this absence, termed **narrative discontinuity**. It proceeds from the hypothesis that coherent collective judgment requires more than procedural fairness; it requires a scaffolding of meaning that allows disparate actors to perceive their deliberation as a unified story rather than a series of isolated transactions. The fellowship will determine whether this scaffolding is necessary for functional lottocracy, and whether providing it inevitably reintroduces the elite narrative control that sortition was designed to dismantle.

  **The Research Question**
  To admit a determinate answer, the inquiry is framed as follows:
  *Is narrative scaffolding a necessary condition for coherent collective judgment in lottocratic settings, and if so, does its introduction inevitably reconstruct the hierarchical storytelling mechanisms sortition seeks to dissolve?*

  This question demands a binary assessment of necessity, followed by a normative evaluation of the cost. The answer will not be a matter of degree, but of structural dependency: can the body hold its shape without the narrative glue, or does it fragment into incoherence?

  **Theoretical Gap**
  Current literature on descriptive representation and deliberative democracy leaves this question open because it models deliberation primarily as **preference aggregation**. In this dominant framework, participants enter the room with fixed interests, and the goal is to compute an overlap. This is a mathematical model, not a human one. It ignores the reality that political will is formed through **collaborative meaning-making**.

  When deliberation is viewed as meaning-making, the "story" of the assembly matters. Who is the protagonist? What is the conflict? What constitutes a resolution? Standard political theory treats these as metaphors; this project treats them as functional mechanics. By ignoring the narrative dimension, existing models assume that procedural neutrality is sufficient to generate cohesion. This project argues that neutrality creates a vacuum, and nature abhors a vacuum. If the participants do not generate the story, the facilitators—or the biases they carry—will generate it for them.

  **Methodology and Six-Month Plan**
  The research will proceed through three phases, moving from conceptual definition to comparative stress-testing, and finally to protocol evaluation.

  *   **Months 1–2: The Anatomy of Discontinuity (Conceptual Analysis)**
      I will define the specific components of "narrative scaffolding" present in elected bodies (e.g., the campaign promise as backstory, the election cycle as temporal arc, the constituency as audience). I will then map the absence of these components in standard lottocratic models (Citizens' Assemblies, Jury Duty). The deliverable for this phase is a typology of narrative deficits, distinguishing between *temporal discontinuity* (no past/future link) and *agential discontinuity* (no shared character motivation).

  *   **Months 3–4: Comparative Dramaturgy (Thought Experiments)**
      I will construct paired thought experiments comparing elected and selected bodies facing identical crises. These are not simulations, but rigorous conceptual scenarios designed to isolate the variable of narrative continuity. I will trace the trajectory of deliberation in both scenarios to identify the precise point where the lottocratic body risks fragmentation or incoherence due to the lack of a shared plot. This phase tests the *necessity* half of the research question.

  *   **Months 5–6: The Facilitator as Author (Protocol Evaluation)**
      If scaffolding is deemed necessary, I will evaluate existing facilitation protocols to see if they implicitly supply it. I will analyze whether standard facilitation techniques (agenda setting, framing questions, summarizing consensus) function as a subtle form of narrative control. The goal is to determine if a "neutral" narrative is possible, or if all storytelling is inherently hierarchical. This phase addresses the *cost* half of the research question.

  **Deliverables**
  The project will produce two distinct but complementary outputs:

  1.  **For Philosophers:** A monograph-length manuscript (approx. 30,000 words) titled *The Plotless Assembly*. This text will intervene in deliberative democracy theory, arguing that narrative continuity is a missing variable in the assessment of political legitimacy.
  2.  **For Practitioners:** A "Dramaturgical Framework for Facilitation." This will be a practical guide for those designing Citizens' Assemblies. It will offer specific protocols for establishing narrative continuity (e.g., collective backstory creation, explicit temporal mapping) without resorting to elite scripting. It will provide a checklist for identifying when facilitation crosses the line into narrative manipulation.

  **Conditions of Failure**
  To ensure rigor, the project defines failure in two specific ways:
  1.  **Redundancy:** If the analysis demonstrates that "narrative scaffolding" is merely a metaphorical renaming of standard agenda-setting or moderation, the project fails to identify a distinct phenomenon.
  2.  **Incoherence:** If the comparative thought experiments show that lottocratic bodies achieve coherent judgment *without* narrative continuity, the central hypothesis is falsified.

  In either case, the result is valuable, but it would negate the need for the proposed "Dramaturgical Framework."

  **Risk Assessment and Scope**
  The primary risk to the six-month timeline is the temptation to move from conceptual analysis to empirical observation. Conducting live observations of Citizens' Assemblies or running controlled simulations would require ethical review, recruitment, and data analysis that exceeds the fellowship term.

  To mitigate this, the project remains strictly conceptual and protocol-based. I will rely on existing transcripts and public records of past assemblies as data points for the conceptual analysis, rather than generating new empirical data. Furthermore, there is a risk of scope creep in defining "narrative." I will strictly bound the definition to *political deliberation contexts*, avoiding drift into general organizational psychology or fiction theory. The focus must remain on the specific mechanics of collective judgment, not the general human love of story.

  **Conclusion**
  Democracy is not merely a counting machine; it is a story we tell ourselves about how we decide. Sortition fixes the casting of that story but leaves the script blank. This project asks whether a blank script leads to freedom or paralysis, and whether writing one together is an act of democracy or an act of domination. The answer will determine whether lottocracy can survive contact with the human need for meaning.
