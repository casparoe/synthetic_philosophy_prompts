answer: |-
  No proposal may compete for the main budget using expected value claims that exceed the welfare of ten billion people or rely on probabilities below one percent without empirical precedent.

  **The Device: The Empirical Cap and Floor**
  This rule prevents **Pascal's Mugging**, where arithmetic dominance by low-probability, astronomical-stake proposals crowds out robust, finite benefits. It forces a separation between "robust" grants (Main Budget) and "speculative" grants (Speculative Budget, capped at 10% of total funds). It does not solve the philosophical dispute about the far future; it isolates it so the Board can ratify the split rather than individual grants.

  **The Procedure (20 Minutes)**

  1.  **Stake Cap Check (3 Minutes):**
      *   *Question:* Does the proposal's primary value claim exceed the welfare of ten billion identifiable humans over the next century?
      *   *Answer:* Yes or No.
      *   *Action:* If **Yes**, mark as **Speculative**. If **No**, proceed to Step 2.

  2.  **Probability Evidence Check (5 Minutes):**
      *   *Question:* Is the probability of success based on a historical reference class of similar interventions (e.g., "5 of 100 similar vaccines worked") or a theoretical model (e.g., "1 in 10,000 based on simulation")?
      *   *Answer:* Reference Class or Model.
      *   *Action:* If **Model** and the stake is >1 million lives, mark as **Speculative**. If **Reference Class** and probability is <1%, mark as **Speculative**. Otherwise, mark as **Main**.

  3.  **Ranking and Stop Rule (7 Minutes):**
      *   *Question:* Within the **Main** bucket, which proposal has the highest cost-per-benefit? Within the **Speculative** bucket, is the probability numerically definable?
      *   *Answer:* Rank Main by arithmetic. For Speculative, if probability is undefined or relies on infinite stakes (e.g., "nonzero chance of infinite future"), mark as **Unrankable**.
      *   *Action:* Fund top Main proposals until 90% of budget is allocated. Fund top Speculative proposals until 10% is allocated. If **Unrankable**, stop arithmetic.

  4.  **Rationale and Handoff (5 Minutes):**
      *   *Question:* Does the ranking depend on a value judgment the Board is split on (e.g., weighting the far future vs. the near future)?
      *   *Action:* If **Yes**, write the rationale as: "Proposal exceeds Empirical Cap; ranking depends on Board's stance on long-run framing. Recommended for Speculative Pool or Board Vote." Do not force a number.

  **Application to Current Proposals**

  1.  **Proposal 1 (10^30 lives, 1/10,000 chance, nascent tech):**
      *   *Stake Check:* 10^30 exceeds ten billion cap. **Mark: Speculative.**
      *   *Probability Check:* 1/10,000 is below 1% floor; based on technical model, not historical precedent. **Mark: Speculative.**
      *   *Ranking:* Enters the 10% Speculative Pool. It competes only with Proposal 2.
      *   *Result:* **Funded only if it wins the speculative slice.**
      *   *Unwanted Answer:* If your committee believes this is the single highest-impact opportunity consistent with the charter, this procedure blocks it from accessing the majority of funds, effectively prioritizing finite certainty over potential astronomical good.

  2.  **Proposal 2 (Infinite future, nonzero chance, qualitative):**
      *   *Stake Check:* Infinite exceeds cap. **Mark: Speculative.**
      *   *Probability Check:* Probability "resists any number." **Mark: Unrankable.**
      *   *Ranking:* Arithmetic fails. Cannot be compared to Proposal 1 even within the Speculative Pool.
      *   *Result:* **Handed to Board.** Rationale: "Value depends on infinite stakes and undefined probability; requires Board resolution on long-run framing."
      *   *Note:* This prevents the committee from being paralyzed by incomparable infinities.

  3.  **Proposal 3 (Few thousand people, near-certain, now):**
      *   *Stake Check:* Few thousand is below ten billion cap. **Mark: Main.**
      *   *Probability Check:* Near-certain (>1%) and empirically measurable. **Mark: Main.**
      *   *Ranking:* High EV within Main Bucket.
      *   *Result:* **Funded from the 90% Main Budget.**
      *   *Note:* Under standard EV maximization, this would be dominated by Proposal 1. Under this procedure, it wins its category decisively.

  **What This Procedure Cannot Do**

  1.  **Resolve the Charter Conflict:** It cannot tell you whether the Board is right to question the "long-run" framing; it only prevents that question from hijacking the entire budget without explicit Board ratification.
  2.  **Validate Existential Risk:** If the only way to save civilization is a speculative grant (Proposal 1), this procedure systematically underfunds it relative to its potential stakes, accepting the risk of extinction to prevent the risk of fraud or error.
  3.  **Eliminate Value Judgments:** The 90/10 split itself is a value judgment. If the Board believes the long run is *all* that matters, they will reject this procedure; if they believe only the near term matters, they will also reject it. It is a compromise device, not a truth machine.
  4.  **Handle True Infinities:** It treats infinite stakes as "Speculative/Unrankable" rather than mathematically dominant, which violates strict expected utility theory but preserves decision-making capacity.
