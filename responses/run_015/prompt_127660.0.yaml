answer: |-
  The fluorescent lights hummed at a frequency that felt too slow for the twenty-first century, though according to the filing system, the twenty-first century was just a drawer label.

  Arthur sat at his desk in the Temporal Adjudication Center. Behind him, the shelves stretched into the dim back of the room. There was no chronological order. The year 1804 sat next to 2490. The year 1998 was sandwiched between 2047 and 1999. There was no "Current Events" section. There was no moving spotlight of "now." Just the block, flat and static, like books on a shelf waiting for someone to pull them down.

  Arthur rubbed his eyes. He was working Case 8940: *HydroCorp v. The Mississippi Valley Authority*.

  The issue was messy. In 1998, a massive flood devastated the valley. In 2047, HydroCorp signed a water rights contract that utilized a retrocausal escrow. Basically, the funds for the dam construction were locked in 2047, but the release conditions were tied to historical water levels in 1998. If the flood happened exactly as recorded, the escrow released. If not, the money vanished.

  The Authority was claiming the contract *caused* the flood. They argued that the future obligation constrained the past event to ensure consistency. HydroCorp said the flood was a natural event that merely triggered the escrow.

  Arthur's job was to decide the temporal order. Did the contract precede the flood, or did the flood precede the contract?

  In a normal world, this would be insane. 1998 comes before 2047. But in the Center, we know better. According to special relativity, if two events are spacelike separated—meaning light doesn't have time to travel between them—there is no fact of the matter about which happened first. It depends on your velocity. It depends on how you slice the loaf of spacetime.

  The Rietdijk-Putnam argument hangs over the office like stale cigarette smoke. If existence isn't relative to your frame of reference, then everything exists at once. The flood is real. The contract is real. They are both sitting on the shelf. "Cause" is just a story we tell to connect dots that are already drawn.

  Arthur picked up the occurrence report for the flood. It was a thick folder, labeled *1998.05.12*. He needed to cross-reference it with the contract signing, *2047.08.30*.

  To adjudicate, the Center's system required a simultaneity convention. You had to choose a reference frame to define "now." If you chose the Earth's rest frame, 1998 is before 2047. Cause flows forward. HydroCorp is safe. But if you chose a frame moving at a significant velocity relative to Earth, the slice of "now" tilts. In some frames, the signing in 2047 is simultaneous with the flood in 1998. In others, the signing happens *before* the flood.

  If the signing is before the flood, the retrocausal escrow is valid as a causal mechanism. HydroCorp is liable for engineering the disaster to secure their funds.

  Arthur reached for the witness log. It was a thin slip of paper detailing the velocity of the satellite that monitored the flood levels. This data determined the reference frame for the legal proceeding. Standard procedure was to file it in the "Rest Frame" bin.

  He was tired. The coffee in his mug had developed a skin. He grabbed the slip and, without looking, dropped it into the bin labeled *Relative Velocity: 0.1c*.

  He didn't notice the mistake until he fed the files into the adjudication scanner.

  The machine whirred. It didn't process time; it processed geometry. It looked at the coordinates provided by the files. Because Arthur had filed the satellite log in the high-velocity bin, the system adopted a simultaneity convention where the plane of "now" was tilted sharply.

  On the screen, the timeline shifted. The geometric distance between the contract signing and the flood changed. In this new convention, the 2047 event was spacelike separated from the 1998 event in such a way that the contract signing registered as temporally prior.

  **RULING: CAUSALITY CONFIRMED.**
  **DEFENDANT: HYDROCORP.**
  **LIABILITY: 100%.**

  Arthur stared at the screen. He knew what he'd done. He'd misfiled a slip of paper. In a sensible universe, a clerical error wouldn't change history. But here, history isn't a river; it's a landscape. By choosing a different coordinate system—even accidentally—he changed the legal reality of which event constrained the other.

  He felt a cold knot in his stomach. HydroCorp was going to be bankrupted. People would lose jobs. All because Arthur's hand slipped.

  But then the philosophy hit him, the way it always did when the lights hummed too loud.

  If the block universe is true, then this moment—Arthur staring at the screen, feeling guilty—is just another coordinate. It exists at *Office, 2025*. The bankruptcy exists at *HydroCorp, 2048*. The flood exists at *Mississippi, 1998*. They are all equally real. They are all on the shelf.

  Did he *cause* the bankruptcy? Or was his misfiling just another event in the block, perfectly correlated with the outcome, like two ends of the same stick?

  If he had filed it correctly, the ruling would have been different. But he didn't. He couldn't have, because here he is, looking at the screen. The mistake was always there. The guilt was always there.

  It felt unfair. It felt like cheating. He had the power to destroy a company with a filing error, yet he had no free will to undo it. The conventionality of simultaneity meant there was no unique "true" order of events, only the order selected by the procedure. And the procedure was broken because he was tired.

  He looked at the shelves behind him. Somewhere out there, in the flat expanse of years, was a version of this office where he filed it correctly. But not in this universe. In this block, the slip is in the wrong bin. The ruling is final.

  Arthur picked up his stamp. He had to validate the decision.

  His hand hovered over the paper. Blame is a concept that requires a flowing present, a moment where things could have been otherwise. But if 1998, 2025, and 2047 are all equally real, then blame is just a label we stick on events we don't like.

  He slammed the stamp down. **APPROVED.**

  He stood up and walked to the shelves. He took the folder for Case 8940 and slid it into its slot. It fit perfectly between a treaty signed in 1812 and a birth certificate from 2305. There was no resistance. The universe didn't care about his guilt. The geometry was consistent.

  Arthur went to the break room to get more coffee. He walked past the clock on the wall. It didn't have hands. It just displayed coordinates. He didn't check the time. There was no point. He was already there.
