prompt: |-
  hey — I'm the night charge nurse on a locked memory-care floor, 28 residents, mostly mid-to-late stage Alzheimer's with a couple of vascular dementia, and my aides make maybe forty of these calls a shift. Our written policy is one line, something like "use therapeutic truth-telling and avoid causing distress," which everyone reads differently, so I want to replace it with an actual procedure.

  The reason I'm asking you and not a textbook: someone told me Augustine held that every deliberate lie is a sin, including lies that would save a life, but that you're allowed to simply *not say* things — concealing the truth isn't lying — and that what makes an utterance a lie is the will to deceive rather than the falsity of the sentence. That sounds weirdly workable at 3am, and I'd rather build the card around it than around "do the kindest thing," which is what got us into this mess.

  So: a decision procedure that fits on one side of a laminated index card. Max four or five steps, runnable in about fifteen seconds, by an aide who's been on the job three weeks and is being pulled down a hallway by someone who thinks she's late for work. For each step: the question asked, what counts as a good enough answer, where the card stops with a hard NO, and where it hands the call up to me or to the family because it's a values question and not a fact question.

  Four situations I dont know where to put in the tree, and I want them placed, not just discussed:

  - borrowed voice: the daughter texts "tell mom I'll be there Sunday," she isn't coming, and the aide says "your daughter says she'll be here Sunday." Nothing false is being said about what the daughter said, but the point of saying it is that mom believes she's coming.

  - standing fictions: we have a painted bus stop by the exit door and two therapy dolls in the day room. Nobody asserts anything; the room is just arranged to produce a belief. Is that even the card's business?

  - drift: a resident asks something perfectly coherent inside 1961 — "has my husband finished at the yard?" — where any true answer is either noise to her or a fresh bereavement. Can the procedure allow answering a different question that happens to be true?

  - ninety-second uptake: if she won't remember this exchange in two minutes and may not be tracking the sentence at all, does the intent-to-deceive test get off the ground? I don't want a rule that quietly amounts to "it's fine if they won't remember."

  Also give me three memorizable sentence-frames that pass the procedure for "where is X / when is X coming," since that's most of the volume.

  Then run the finished card on three cases: (1) Mrs. K, 3am, wants to know when her mother is picking her up; her mother died in 2001. (2) Mr. R, about to get a catheter change he's had before and hated, asks "is this going to hurt?" — it will. (3) Mrs. O's son died in a crash last month; she forgets within ten minutes and grieves it as new each time; the family has asked us to tell her he's fine.

  One more thing: I gather Augustine also grades lies, worst to nearly-excusable, instead of just banning them in one lump. Tell me whether that grading belongs on the card at all, or whether it's only good for how we write up an incident afterward — and if it's the latter, what we'd actually use it for.

  Finally, be straight with me about what the procedure can't do: which of these it will spit out an answer on that I'll then have to overrule, and which calls genuinely need a person's signature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Night charge nurse on a locked memory-care floor (28 residents, mid-to-late stage Alzheimer's/vascular dementia).
      *   **Problem:** Current policy ("use therapeutic truth-telling and avoid causing distress") is too vague. Aides make ~40 calls/shift. Need a concrete, actionable decision procedure.
      *   **Philosophical Framework:** The user is specifically interested in an Augustinian framework (lie = will to deceive, not just factual falsity; concealment $\neq$ lying; grading of lies). They find this "weirdly workable at 3am."
      *   **Constraints:**
          *   Fit on one side of a laminated index card.
          *   Max 4-5 steps.
          *   Runnable in ~15 seconds.
          *   Audience: New aides (3 weeks on job), high stress (being pulled down hallway).
          *   Must handle specific edge cases: Borrowed Voice, Standing Fictions, Drift, Ninety-Second Uptake.
          *   Must provide 3 memorizable sentence frames.
          *   Must run 3 specific test cases (Mrs. K, Mr. R, Mrs. O).
          *   Must address the "Grading of Lies" (where does it belong?).
          *   Must be honest about limitations (what the procedure *can't* do).

  2.  **Deconstruct the Augustinian Framework for Clinical Use:**
      *   *Augustine's Core:* A lie is a false signification with the *intent to deceive* (voluntas fallendi).
      *   *Clinical Translation:* It's not about factual accuracy (since reality is broken for the resident); it's about *intent*. Are we trying to trick them for our convenience, or are we entering their reality to reduce suffering?
      *   *Concealment:* Withholding information that causes harm without asserting falsehood is permissible.
      *   *Grading:* Augustine distinguishes lies told for sport, lies told to help someone (officious), and lies told to harm (malicious). In care, "officious" lies (to soothe) are the tension point.
      *   *Memory/Uptake:* If the resident cannot retain the deception, is it a lie? Augustine would say yes, if the *intent* at the moment of speaking was to deceive. However, pastoral care traditions often soften this for dementia. The user wants to avoid "it's fine if they won't remember." So the test must remain on *intent* and *harm*, not just memory.

  3.  **Drafting the Decision Procedure (The Card):**
      *   *Goal:* 4-5 steps, 15 seconds.
      *   *Step 1: Safety/Needs.* Is this about pain, danger, or basic need? (Priority).
      *   *Step 2: Intent.* Am I saying this to stop *their* distress or *my* workload? (The Augustinian "Will").
      *   *Step 3: Truth-Adjacency.* Can I say something true that fits their reality? (Drift/Concealment).
      *   *Step 4: Escalation.* Does this conflict with family orders or cause lasting harm?
      *   *Refining for the "Augustinian" angle:* The user specifically liked the "will to deceive" vs. "falsity of sentence" distinction.
      *   *Draft Step 1:* Is the resident in immediate physical distress or danger? (If Yes -> Act/Truth).
      *   *Draft Step 2:* Is my intent to soothe *their* fear or clear *my* path? (If My Path -> Stop/Truth).
      *   *Draft Step 3:* Can I answer the *emotion* without confirming the *fact*? (Drift/Concealment).
      *   *Draft Step 4:* Does this violate a specific Family/Directive order? (If Yes -> Call Charge).

      *Let's tighten this to fit the "Augustinian" prompt specifically.*
      1.  **Harm Check:** Will the truth cause immediate grief or danger?
      2.  **Will Check:** Am I speaking to comfort *them* or quiet *me*?
      3.  **Fact Check:** Can I speak a truth that fits *their* time?
      4.  **Authority Check:** Does this contradict a specific family directive?

      *Wait, the user wants to know where the hard NOs and Hand-offs are.*
      Let's structure it as a flow.

      *Revised Card Structure:*
      1.  **Safety & Pain:** Is this about physical pain or danger? -> **TRUE ANSWER.**
      2.  **Intent:** Am I saying this to stop *their* tears or *my* workload? -> **If Workload: TRUE ANSWER.**
      3.  **The "Drift":** Can I answer the feeling without fixing the fact? -> **If Yes: VALIDATE & REDIRECT.**
      4.  **The "Order":** Does this contradict a specific family directive? -> **If Yes: CALL CHARGE.**

      *Addressing the 4 Situations:*
      *   *Borrowed Voice:* Fails Intent Check (Step 2). You are becoming the instrument of a lie for convenience. -> Hand off/Don't do it.
      *   *Standing Fictions:* Not an utterance. Outside the card. It's environmental.
      *   *Drift:* Covered in Step 3. Answer the emotion.
      *   *90-Second Uptake:* Covered in Step 2 (Intent). If you do it because they won't remember, that's "my workload/convenience." If you do it because the *moment* is painful, that's "their tears."

  4.  **Developing Sentence Frames:**
      *   Need to handle "Where is X" / "When is X coming."
      *   Frame 1 (Validation): "You're missing him. He was important." (Sidesteps fact).
      *   Frame 2 (Temporal Drift): "He's working right now. He'll be back later." (Fits their 1961 reality).
      *   Frame 3 (Action Oriented): "Let's have some coffee while we wait." (Redirect).

  5.  **Running the Test Cases:**
      *   *Mrs. K (Mom died 2001, wants pickup):*
          *   Safety: No.
          *   Intent: Soothe distress (3am confusion).
          *   Drift: "She's resting. We'll call her in the morning." (Concealment/Drift).
          *   Order: None.
          *   *Verdict:* Passes.
      *   *Mr. R (Catheter, asks if it hurts):*
          *   Safety: Yes (Physical/Pain).
          *   Intent: N/A (Step 1 triggers).
          *   *Verdict:* **TRUE ANSWER.** "It might pinch, but I'll be gentle." Lying here violates trust regarding bodily autonomy.
      *   *Mrs. O (Son died, family says lie):*
          *   Safety: No.
          *   Intent: Soothe (but family directive).
          *   Order: **YES.** Family says "Tell him he's fine."
          *   *Verdict:* **CALL CHARGE / FOLLOW DIRECTIVE.** This is the "Borrowed Voice" on steroids. The card must hand this off or explicitly defer to the care plan. *Correction:* If the care plan *says* "Tell her he's fine," the aide follows the plan. If it's a verbal request, call charge. Let's assume it's in the care plan. The card needs to acknowledge "Care Plan Directive."

  6.  **Addressing the "Grading of Lies":**
      *   Augustine's *De Mendacio*: 8 grades. Pernicious (harmful) to Joking to Officious (helpful).
      *   *On the Card?* No. Too complex for 3am.
      *   *Use:* Incident reporting / Debrief. When an aide feels guilty, use the grading to show "This was an Officious lie to prevent grief, not a Pernicious lie to hide neglect." It protects the staff's moral conscience.

  7.  **Addressing Limitations (The "Straight Talk"):**
      *   The card can't solve the "Mrs. O" conflict (Family vs. Reality).
      *   The card can't fix bad staffing (using lies to manage flow).
      *   The card requires moral agency; it can't replace judgment.
      *   The "90-second uptake" is the trickiest. The card relies on the aide knowing their own heart (Intent).

  8.  **Refining the Output:**
      *   Tone: Professional, direct, respectful of the philosophical depth but grounded in clinical reality.
      *   Format: Clear sections. The "Card" needs to look like a card.
      *   Integration: Ensure the Augustinian concepts (Will to Deceive, Concealment) are embedded in the steps without using Latin.

      *Self-Correction on the Card Steps:*
      The user wants the Augustinian distinction: "Will to deceive" vs "Falsity."
      Step 2 needs to be very clear: "Is my goal to trick them or hold them?"
      Also, need to explicitly place the 4 situations.
      *Borrowed Voice:* Fails Step 2 (Intent).
      *Standing Fictions:* Excluded (Not an utterance).
      *Drift:* Step 3 (Answer the emotion).
      *90-Second:* Step 2 (Intent check).

      *Refining the Mrs. O Case:* This is the hardest. If the family demands a lie, is the nurse complicit? Augustine would say yes. But clinical ethics often defer to family on dementia communication *if* it reduces distress. The card needs to flag this as a "Values Question" (Hand off/Check Care Plan). I will designate this as a "Call Charge / Check Plan" scenario.

      *Refining Sentence Frames:* Make them robust.
      1. "You're waiting for [Name]. They're on your mind." (Validation).
      2. "[Name] is busy right now. Let's [Action] until they're free." (Drift).
      3. "I'm here with you now. You're safe." (Presence).

      *Wait, one more check on Augustine:* Augustine says *every* lie is a sin, but some are venial, some mortal. He allows *concealment* (reticentia). The card should emphasize *Concealment* over *Fabrication*.
      Step 3 should be: "Can I withhold the hurtful fact without stating a false one?"

      *Let's finalize the Card Steps:*
      1.  **Harm:** Will truth cause immediate grief/danger? (No -> Truth).
      2.  **Will:** Am I soothing *them* or silencing *me*? (Me -> Truth/Stop).
      3.  **Method:** Can I validate the feeling without confirming the fact? (Yes -> Do that).
      4.  **Authority:** Does this contradict a Care Plan/Family Order? (Yes -> Call Charge).

      *Wait, the user wants to know where the hard NOs are.*
      I will annotate the card steps with [STOP] and [CALL] markers.

      *Re-evaluating the "Grading":* The user asked if it belongs on the card. I will say NO. It belongs in the *debrief*.

      *Re-evaluating Limitations:* I need to be honest that the "Intent" check is subjective. An aide under pressure might convince themselves "I'm doing this for them" when they are doing it for speed. The Charge Nurse (User) is the audit point.

  9.  **Final Polish:** Check against all constraints.
      *   One side of index card? (Text needs to be concise).
      *   4-5 steps? (Yes).
      *   15 seconds? (Yes).
      *   4 Situations placed? (Yes).
      *   3 Frames? (Yes).
      *   3 Cases run? (Yes).
      *   Grading addressed? (Yes).
      *   Limitations? (Yes).

      *One nuance on Mrs. O:* If the Care Plan says "Tell her he is fine," following the plan is not the aide's moral burden, it's the director's. The card should tell the aide to *follow the written plan*. If there is no written plan, *Call Charge*. This protects the aide.

      *One nuance on Augustine:* Augustine distinguishes between *signifying* something false vs *having* a false belief. In dementia care, we are often entering *their* signification system. I need to make sure the card doesn't get too metaphysical. Keep it to "Intent."

      *Let's write it.*
answer: |-
  Here is the procedure, designed for the card, followed by the specific placements, sentence frames, case runs, and the straight talk you asked for.

  ### The Card: "Intent & Truth" Protocol
  *(Print this on one side of a laminated 3x5 card)*

  **1. HARM CHECK:** Will the literal truth cause immediate grief, terror, or physical resistance?
  *   **NO:** Tell the truth. **[STOP]**
  *   **YES:** Go to Step 2.

  **2. WILL CHECK:** Am I saying this to soothe *their* distress or to clear *my* workload?
  *   **MY WORKLOAD:** Tell the truth or walk away. **[HARD NO]**
  *   **THEIR DISTRESS:** Go to Step 3.

  **3. DRIFT CHECK:** Can I validate the *feeling* without confirming the *fact*? (e.g., "You miss him" vs. "He is coming")
  *   **YES:** Use a Validation Frame. **[STOP]**
  *   **NO:** Go to Step 4.

  **4. AUTHORITY CHECK:** Does this contradict a written Care Plan or Family Directive?
  *   **YES:** Call Charge Nurse. **[HAND OFF]**
  *   **NO:** Conceal the hurtful fact. Do not fabricate details. **[STOP]**

  ***

  ### Placement of Your Four Situations

  Here is where those specific edge cases land in the tree above:

  1.  **Borrowed Voice** (*Daughter texts lie, aide repeats it*):
      *   **Placement:** Fails **Step 2 (Will Check)**.
      *   **Why:** You are becoming the instrument of a deception for the family's convenience, not the resident's immediate safety. It creates a "trust debt" you will have to pay when the daughter doesn't show.
      *   **Action:** **HARD NO.** Do not deliver the message. Call the daughter: "I cannot tell her that. Tell her yourself when she arrives."

  2.  **Standing Fictions** (*Painted bus stop, therapy dolls*):
      *   **Placement:** **Outside the Card.**
      *   **Why:** Augustine defines a lie as an *utterance* with intent to deceive. Environmental staging is non-verbal concealment. It is a "therapeutic fiction," not a lie.
      *   **Action:** The card does not govern the room. If a resident asks, "Is that a real bus?", revert to **Step 3 (Drift)**: "It looks like one, doesn't it? Tell me about the buses you rode."

  3.  **Drift** (*"Has my husband finished at the yard?"*):
      *   **Placement:** Passes **Step 3 (Drift Check)**.
      *   **Why:** You are not asserting "He is at the yard" (False). You are answering the *concern* (Is he safe? Will he come home?) without fixing the *time*.
      *   **Action:** **VALIDATE.** "He works so hard. He always comes home to you." (True: he *did* always come home. False implication: he is coming *today*. This is concealment, not fabrication).

  4.  **Ninety-Second Uptake** (*They won't remember the lie*):
      *   **Placement:** Tested in **Step 2 (Will Check)**.
      *   **Why:** If your logic is "It's fine because she'll forget," you are prioritizing *your* ease over *truth*. That is a Will to Deceive for workload.
      *   **Action:** If you cannot pass Step 3 (Drift), you must not lie, even if they forget. The moral weight is on *your* intent, not their memory.

  ***

  ### Three Memorizable Sentence Frames
  *For "Where is X?" / "When is X coming?"*

  1.  **The Validation Frame:** "You are thinking about [Name]. You loved them very much."
      *   *Why it passes:* Factually true. Addresses the emotion. Confirms nothing about location.
  2.  **The Temporal Drift:** "[Name] is busy right now. Let's [have coffee/wait here] until they are free."
      *   *Why it passes:* "Busy" is non-falsifiable in dementia time. "Let's wait" is an invitation, not a promise of arrival.
  3.  **The Presence Frame:** "I know you want them here. I am here with you now. You are safe."
      *   *Why it passes:* Shifts focus from the absent (unverifiable) to the present (verifiable).

  ***

  ### Case Runs

  **Case 1: Mrs. K, 3am. "When is my mother picking me up?" (Mother died 2001).**
  *   **Step 1 (Harm):** Truth ("She's dead") causes immediate grief/terror. **YES.**
  *   **Step 2 (Will):** Aide wants to calm Mrs. K, not clear hallway. **THEIR DISTRESS.**
  *   **Step 3 (Drift):** Can we validate without confirming pickup? **YES.**
  *   **Action:** Use Frame 1 or 3. "You're missing your mother. She loved you so much. I'm here with you now."
  *   **Result:** **PASS.** (Concealment of death, validation of love).

  **Case 2: Mr. R. Catheter change. "Is this going to hurt?" (It will).**
  *   **Step 1 (Harm):** Truth ("Yes") causes anxiety, but Falsehood ("No") causes physical betrayal/trauma.
  *   **Correction:** Step 1 asks if truth causes *immediate grief/danger*. Pain is a physical reality. Lying about pain violates bodily autonomy.
  *   **Action:** **Step 1 NO.** Tell the truth. "It will pinch for a moment, but I will be quick."
  *   **Result:** **PASS.** (Lying here fails Step 2 implicitly—it serves the aide's desire to avoid resistance, not the patient's long-term trust).

  **Case 3: Mrs. O. Son died last month. Forgets/grieves anew. Family says: "Tell her he's fine."**
  *   **Step 1 (Harm):** Truth causes fresh grief. **YES.**
  *   **Step 2 (Will):** Soothing distress. **THEIR DISTRESS.**
  *   **Step 3 (Drift):** Hard to drift "He is fine." That is a specific factual claim.
  *   **Step 4 (Authority):** Contradicts/Affirms Family Directive? **YES.**
  *   **Action:** **HAND OFF / CHECK PLAN.**
      *   *If Written Plan:* "Tell her he is fine." -> Aide follows plan. (Moral burden shifts to Director/Family).
      *   *If Verbal Request:* -> **Call Charge Nurse.** This is a values conflict.
  *   **Result:** **FLAGGED.** Do not decide this alone at 3am.

  ***

  ### The Augustinian Grading: On the Card or Not?

  **Do not put the grading on the card.**
  Augustine's eight grades of lies (from *De Mendacio*) range from *pernicious* (harmful) to *officious* (helpful) to *jocose* (playful).
  *   **Why not on the card:** At 3am, an aide cannot calibrate "Is this a Grade 5 or Grade 6 lie?" It causes paralysis.
  *   **Where it belongs:** **In the Incident Report / Debrief.**
  *   **How to use it:** When you review a shift where an aide lied:
      *   If they lied to hide a mistake (Grade 2: Pernicious to self), you coach/correct.
      *   If they lied to stop a resident from screaming in grief (Grade 6: Officious, no harm to others), you **validate the aide**.
      *   *Use:* It protects your staff from moral injury. It allows you to say, "What you did was technically a falsehood, but morally it was an act of mercy. I am signing off on it."

  ***

  ### Straight Talk: What This Procedure Can't Do

  You asked for honesty on where this will spit out an answer you have to overrule, and where it needs a human signature.

  **1. The "Intent" Blind Spot (Step 2)**
  *   **Limitation:** The card relies on the aide knowing their own heart. Under staffing pressure, an aide *will* convince themselves "I'm doing this for her" when they are actually doing it to get to the next room faster.
  *   **Your Job:** You cannot audit intent in the moment. You audit the *pattern*. If an aide uses "Drift" 40 times a shift, they are lying for workload. You will have to overrule the "Pass" on the card based on frequency.

  **2. The "Mrs. O" Conflict (Step 4)**
  *   **Limitation:** The card cannot resolve the ethical conflict between Family Wishes and Objective Reality. It only flags it.
  *   **Your Job:** This is the **Human Signature** call. You must have the conversation with the family: "We can say he is 'away,' but we will not say he is 'fine' if she asks if he is dead." The card forces the escalation; you must make the decision.

  **3. The "Standing Fiction" Boundary**
  *   **Limitation:** The card says environmental lies are "Outside." But residents ask about them ("Is that bus real?").
  *   **Your Job:** You need a floor-wide consensus. If the policy is "We don't affirm the bus is real," but the environment says it is, the aides will look like liars. You must align the *room* with the *card*.

  **4. The 90-Second Uptake**
  *   **Limitation:** The card says "Don't lie just because they won't remember." But clinically, repeating a trauma every 90 minutes *is* harm.
  *   **Your Job:** You will have to overrule the "Truth" outcome in Step 1 for late-stage dementia. If the truth causes *recurring* trauma, the "Harm Check" defaults to **YES**, even if the lie is technically for "uptake." You must authorize "Therapeutic Lying" for recurring grief as a medical intervention, not a moral failing.

  **Summary:** The card handles the *tactical* 3am decision. You handle the *strategic* ethics. The card protects the aide from having to be a philosopher in the dark; you protect the aide from becoming a liar by habit.
