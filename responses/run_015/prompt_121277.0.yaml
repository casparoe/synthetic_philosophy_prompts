answer: |-
  Here is the grading breakdown and the annotated feedback you requested. I have structured this so you can copy the comments directly into your marking software or document, and the summary fits a standard feedback box.

  ### MARK BREAKDOWN (Total: 17/20)

  *   **Part (a) Ranke & Total Record:** 4.5 / 5
      *   *Strong grasp of Ranke's negative ideal. Insightful point about the historian becoming redundant. Minor deduction for not explicitly stating whether the ideal is "achieved" (you imply 'no', but clarity is key).*
  *   **Part (b) Carr & Mediation:** 4.5 / 5
      *   *Excellent distinction between archival gaps and cognitive selection. Correctly identifies that Total Record solves the former but not the latter.*
  *   **Part (c) White & Emplotment:** 4.5 / 5
      *   *Accurate summary of White's 'verbal fiction'. Good handling of the 'made vs. found' distinction.*
  *   **Part (d) The Novelist's Claim:** 3.5 / 5
      *   *Here is the slippage. You correctly identify that the novelist fails on (i) (particular truths), but you dismiss this as 'only a convention'. This conflates evidential constraint with stylistic convention. If (i) is violated, the claim to be true 'in the same sense' collapses, even if (ii) and (iii) hold. You were asked to keep (i), (ii), and (iii) separate; in the conclusion, you merge them to save the novelist's argument.*
  *   **Structure & Clarity:** 5 / 5
      *   *Prose is precise, argument flows logically, and the voice is authoritative.*

  ---

  ### ANNOTATED STUDENT ANSWER

  **[Marginal Note 1]**
  > Ranke's famous phrase is best read as a demand that the historian get herself out of the account: no judging of the past, no lessons for the present, no turning what happened into an edifying example. What he was attacking was the habit of writing history as a brief for one's own side. So the ideal is largely a negative one about what the historian must not add, not a promise that the past can be copied onto the page. Ranke was himself a source critic — he worried about which witnesses to trust and how far — and that practice only makes sense on the assumption that the evidence is incomplete and has to be sifted.

  *   **Comment:** Accurate reconstruction of Ranke. Good distinction between the *ideal* (copying) and the *practice* (sifting). You establish the "negative ideal" well.

  **[Marginal Note 2]**
  > That makes the Total Record a strange object as far as Ranke is concerned. In one way it satisfies his ideal completely: nothing added, nothing judged, nothing left out. In another way it makes the historian redundant, because there is nothing left for her to do. I think the right thing to say is that the record is not what Ranke was asking for, but not because it falls short of what he wanted — rather because it bypasses the problem entirely. He was telling historians how to treat imperfect evidence, and the thought experiment removes the imperfection instead of answering him. It doesn't refute him either.

  *   **Comment:** Strong philosophical move here. You identify that the thought experiment changes the conditions of the practice rather than testing the maxim. *Charitable reading:* You are saying Ranke's maxim is procedural, not ontological. *Critique:* You don't explicitly answer "Would she have achieved...?" You imply 'no', but a first-class answer would explicitly state: "No, because Ranke's ideal presupposes the activity of historical judgment, which the Record eliminates."

  **[Marginal Note 3]**
  > Carr's worry is that the facts of history never arrive on their own. Somebody decided what got written down; some things survived and some didn't; and the historian comes to the archive already asking questions, and asking a question is already a way of selecting. The facts are real on Carr's view, but they are always somebody's facts. The Total Record seems to help here, since the accidents of survival have been removed. But it doesn't settle the matter. A complete list of everything that happened in a city over a year would be endless and unreadable, and any historian would still have to choose a handful of events to write about, and would choose them because of a question she brought with her. Selection isn't a defect produced by missing documents; it is what having a subject consists in. So the record answers the crude version of Carr's worry, the version about gaps, and not the serious one.

  *   **Comment:** Excellent. You successfully distinguish between *survival bias* (solved by Record) and *cognitive selection* (unsolved). This addresses distinction (ii) from the prompt instructions perfectly. "Selection isn't a defect... it is what having a subject consists in" is a sentence I would quote in a lecture.

  **[Marginal Note 4]**
  > White goes further than Carr, but in the same direction, and the difference between them is one of degree: Carr holds that the facts are refracted by the questions we bring, White holds that they must be supplemented by a shape of our own. His claim is that however many facts you have, they arrive as a chronicle and leave as a story, and that the conversion is done with forms the historian brings to the material. Because no record is ever complete, the historian has to fill out the sequence with a beginning, a middle and an end, and that shape is made rather than found. This is what White means by calling a history a verbal fiction: not that the events didn't happen, but that the account is manufactured out of them. It follows that there is no fact of the matter about which emplotment is the correct one — the choice between them is aesthetic and political rather than evidential, which is why White treats it as in the end a moral choice.

  *   **Comment:** Precise summary of White. You correctly identify that White's argument holds *even if* the record were complete (because chronicle ≠ story). This addresses distinction (iii). *Minor query:* White argues emplotment is inherent to language, not just a result of incompleteness. You write "Because no record is ever complete, the historian has to fill out the sequence..." A stricter Whitean reading is that *even a complete record* requires emplotment to become intelligible. However, your conclusion ("shape is made rather than found") saves the point.

  **[Marginal Note 5]**
  > What all this means for the novelist is that she occupies exactly the position the historian occupies. Both begin from a heap of particulars; both must impose a shape on it; neither can extract the shape from the particulars. The historian's plain style is a convention that conceals this, and the novel's frankness about invention is a convention that displays it, but conventions are all they are. So if the novelist claims to be true to the past in the same sense that a good history is, then on the argument above she is right: the two genres differ in what their readers expect of them, not in how they stand to the truth.

  *   **Comment:** **Problematic.** You have argued successfully that historians and novelists share the burden of (ii) Selection and (iii) Shape. But you leap from "they share (ii) and (iii)" to "they stand to the truth in the same way." This ignores (i). If the historian is bound by evidence for particulars and the novelist is not, their 'truth claims' are fundamentally different, regardless of shared narrative structure.

  **[Marginal Note 6]**
  > The one thing she cannot claim is (i) — that her particular statements answer to the evidence — since she has invented them freely. But that again is a rule of her genre, and a rule is only a convention too.

  *   **Comment:** **This is the error that costs marks in Part (d).** You are asked to keep (i), (ii), and (iii) separate. Here you collapse (i) into "convention."
      *   *Charitable Reading:* You mean that the *obligation* to follow evidence is a social contract (convention) between historian and reader.
      *   *Critique:* Even on this reading, it is wrong to say the novelist is true in the *same sense*. If 'truth' in history requires correspondence in particulars (i), and the novelist admits she lacks this, she is not true in the *same sense*. She may be true in a *different* sense (emotional, structural), but your argument claims the senses are identical. The novelist's 'invention' isn't just a stylistic rule; it is a different truth-condition. Your instinct as a novelist (that inventing conversation changes the truth claim) is philosophically sound here; the student dismisses it too lightly.

  ---

  ### FEEDBACK BOX (General Comments)

  **Strengths:**
  This is a sophisticated answer with a clear, authoritative voice. Your handling of Ranke and Carr is particularly strong; the distinction between "archival gaps" and "cognitive selection" in part (b) is exactly the point the question was designed to elicit. You understand that the Total Record solves the problem of *survival* but not the problem of *narrative*. Your explanation of White's 'emplotment' is accurate and concise.

  **Areas for Improvement:**
  The main issue lies in part (d) and your handling of the three distinctions required by the prompt ((i) particulars, (ii) selection, (iii) shape).
  1.  **Conflation of Truth and Convention:** In your conclusion, you argue that because the historian and novelist both impose shape (iii), they stand to "the truth" in the same way. However, you admit the novelist fails on (i) (particular statements answering to evidence). You dismiss this failure as "only a convention." Philosophically, this is a category error. The requirement for particulars to correspond to evidence is a *truth condition*, not merely a stylistic convention. If the novelist invents dialogue, the proposition "X said Y" is false. If the historian writes it, it claims to be true. They are not making the same kind of truth claim, even if their narrative structures are identical.
  2.  **Defensibility:** To defend the claim that the novelist is "true in the same sense," you would need to argue that (i) doesn't matter for historical truth (a hardline Whitean position). But you conceded earlier that Carr believes facts are real. You cannot hold that facts are real (part b) and then claim ignoring them is just a convention (part d).
  3.  **Prompt Constraints:** The prompt asked you to "keep three things separate." In the final paragraph, you merge them to resolve the argument. A first-class answer would have concluded: "The novelist is right about (ii) and (iii), but wrong about (i). Therefore, she is not true in the *same* sense, but perhaps in a *complementary* one."

  **Grade Justification:**
  The philosophical comprehension in (a)-(c) is First Class (70%+). However, the logical slip in (d) regarding the definition of truth claims prevents this from being a high First. The grade reflects an excellent grasp of the theorists, but a slightly muddled synthesis in the final application.

  **Note on your Instinct:**
  You mentioned in your query that you felt the novelist "must be going wrong somewhere" regarding invented conversation. You are correct to feel this. Philosophically, this maps to distinction (i). The student admits the novelist violates (i) but argues it doesn't matter because it's a "rule of genre." In a philosophy of history context, the "rule of genre" *is* the truth condition. Breaking it changes the ontological status of the text. You were right to spot that tension; the student tried to write their way out of it.
