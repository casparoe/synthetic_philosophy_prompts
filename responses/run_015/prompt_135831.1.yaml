  **Note on Philosophical Landscape:** *The following questions distinguish between settled terminology (e.g., the standard definition of access-consciousness) and contested claims (e.g., the existence of phenomenal properties). They avoid treating the "this is crazy" objection as a refutation, focusing instead on theoretical coherence.*

  1.  Given my recent experience with anesthesia where my sense of continuity broke, it highlights how fragile self-narration can be. If strong illusionism is true, is the "inner movie" merely a post-hoc narrative construct similar to what I experienced, or do you claim the illusion is generated in real-time?

  2.  Let's press the immediate intuition: when I look at a stop sign, there is a specific way it *seems* to me. Even if the redness isn't in the world, isn't the *seeming* itself a phenomenal property that exists, regardless of what it represents?

  3.  Your standard reply is to analyze this as a false belief—a belief that I have a phenomenal state when I don't. But doesn't analyzing this as a "belief about a belief" just push the phenomenal quality back a step, since entertaining that belief also feels like something?

  4.  If you eliminate phenomenal properties, are you committed to eliminating other folk-psychological states like beliefs and desires, effectively becoming a full eliminativist about the mental?

  5.  You will likely invoke the distinction between access-consciousness and phenomenal-consciousness to save mental states, which is standard terminology in the field. But isn't access-consciousness typically defined by its availability to a phenomenal subject, and if you remove the subject's experience, what grounds the distinction?

  6.  Many illusionists lean on predictive processing to explain how the brain models itself. But prediction error is usually cashed out as a kind of tension or surprise; how do you describe this mechanism without smuggling in a "feeler" to register the mismatch?

  7.  I anticipate you'll say the error signal is purely informational, not experiential. But "error" implies a norm or a failure condition; what makes a signal an *error* for the system if nothing actually feels wrong when the prediction fails?

  8.  If phenomenal consciousness is a user-illusion, it must be computationally costly to maintain. What is the evolutionary advantage of having a system that systematically misrepresents its own internal states to itself?

  9.  If pain qualia are illusory, does this change the ethical weight of suffering? If there's no intrinsic "hurtfulness" to pain, only a defensive reaction, why should we prioritize avoiding it over other system errors?

  10. Finally, does your view dissolve the Hard Problem of consciousness, or does it arguably change the subject by redefining the explanandum away from what most people intend when they ask about experience?

  This question set probes the coherence of strong illusionism by testing its handling of intuition, mental state ontology, predictive mechanisms, and normative implications without relying on dismissive objections.
