answer: |-
  1. The theory predicts that separating ceremonial continuity from instrumental power stabilizes the state by insulating national identity from partisan political fluctuations. This division allows elected officials to wield effective authority while a non-elected figure embodies permanent statehood without interfering in governance.

  2. The 1974 Instrument of Government formally stripped the monarch of all political functions, reducing the crown to a purely ceremonial symbol of historical continuity. Simultaneously, it consolidated instrumental sovereignty within the Riksdag, empowering its Speaker to nominate the prime minister without royal assent.

  3. This framework successfully explains why the monarchy survived the democratization process, as its retention provided a non-partisan anchor for state unity distinct from the contentious arena of parliamentary politics. The removal of royal veto powers clarified that instrumental authority derives solely from electoral mandates rather than hereditary right.

  4. However, the theory overlooks how the reform shifted the burden of state continuity entirely onto the Riksdag, potentially weakening the distinct symbolic buffer dynastic legitimacy once provided against populist surges. It fails to account for the tension where popular sovereignty must now sustain both instrumental governance and ceremonial unity without a separate hereditary pillar.

  5. The Swedish case suggests that democratic legitimacy merely accommodates this separation rather than requiring it, as the state functions effectively without the monarch holding any actual sovereign power. Ultimately, the reform demonstrates that instrumental authority can fully absorb symbolic functions when popular consent is robust enough to sustain both roles within elected institutions.
