  > *A regime from 1800 dissolves completely with no constitutional succession (breaking legal continuity). However, the new 2025 polity explicitly accepts legal title to the 1800 regime's entire estate—including the expropriated territory—as a formal inheritance in the succession treaty, thereby legally enriching itself from the original wrong.*

  *   **If she rules "No Debt":** Her theory relies strictly on **Formal Legal Continuity** (the constitutional personhood of the state). The debt dies with the constitution, regardless of asset retention.
  *   **If she rules "Debt Exists":** Her theory relies on **Substantive Benefit Continuity**. Accepting the "fruits" of the wrong creates a karmic link even without constitutional succession.

  This hypothetical isolates whether the "circuit of desert" for institutions is completed by *identity* (legal succession) or *unjust enrichment* (asset retention).
