prompt: |-
  I'm in the first year of a PhD in philosophy, I came into the subject sideways through the rationalist blogs and the sequences rather than by the usual route, and I have a well-developed habit of suspecting that any dispute which has survived this long must be verbal. My supervisor says I try to dissolve questions before I've earned the right to. I'm applying for a nine-month internal fellowship that funds one paper, and I need roughly nine hundred words of proposal for a project I haven't managed to get straight in my own head, together with a phased month-by-month plan for the nine months.

  The half-formed idea is about the free will debate. The standoff between compatibilists and incompatibilists is normally presented as a disagreement about whether the ability to do otherwise survives determinism, but I suspect a large part of why it never moves is that both sides assume 'could have done otherwise' has a single fixed truth condition that doesn't move with context. That looks false to me. 'Can' and 'could have' are modals, and on the standard semantics they quantify over a modal base and ordering source supplied by the context of utterance, and that context includes what is at stake for the person asking. We are lax about what someone could have done when nothing much hangs on it and we tighten up when everything does. If something like that is right, three things might follow, and I can't tell whether they are the same thing said three ways or three separate projects. First, an explanation of the persistence of the debate: the philosophers arguing about blame and resentment are using a high-stakes 'could', the ones arguing about deliberation and what it's like to face an open choice are using a low-stakes one, and each side's intuitions are correct about its own context. Second, the substantive question then becomes which stakes-profile is the right one for the practice we actually care about, and the answer may differ between the backward-looking practices (blame, resentment, praise, holding to promises) and the forward-looking ones (deliberating, forming intentions, trusting your own future execution) — so that compatibilism might come out true of one family and false of the other, which is not a conclusion I have seen defended. Third, the way it all collapses: if it is the moral stakes of blame that raise the bar, then the incompatibilist gets her conclusion by construction and the whole story is circular, or else it just relocates the original disagreement one level up, to a fight about which stakes are the privileged ones.

  What I need from you is the proposal document itself. State the question so that it has one determinate answer rather than being a request to solve free will. Say why the existing positions — the conditional analysis, Frankfurt-style cases, the consequence argument, semicompatibilism, revisionism, the experimental work on what ordinary people think — leave it open, referring to positions and arguments by their usual labels but without any bibliography: I'll fill in citations myself. Give the method, and say why this approach rather than the obvious alternatives, which as I see them are running more intuition surveys, doing straight conceptual analysis of 'ability', or just stipulating a revisionist definition and arguing that we ought to adopt it. Tell me what a successful deliverable looks like, and separately what would count as the project failing — specifically, if the stakes-sensitivity turns out either to be false for ability modals or merely to relocate the disagreement, is there a result left that is still worth the nine months? And please include a passage that answers my supervisor directly: why this is not merely a dressed-up way of saying the dispute is verbal, and what the non-verbal residue would be even if it partly is.

  Write the whole thing as continuous prose: no headings, no bullet points, no bold text, no tables, the way you would write a long email to a friend. American English, please, since the fellowship is administered from a US institution and I'll be pasting most of what you give me straight into the application.
