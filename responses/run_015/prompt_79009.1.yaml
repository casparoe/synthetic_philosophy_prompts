prompt: |-
  I am the employee-elected member of the board of the Nordic subsidiary of an American software company, and I have to circulate a written opinion before Thursday's board meeting.

  Management has put a single item on the agenda: rolling out in our region a programme the parent company already runs in the United States. It has three parts. Every quarter, a ranked list of the top ten per cent of employees by performance score is published to the whole region. The top twenty-five are sent to a three-day retreat with the CEO. And the next recruiting campaign is to be built around one employee who began on the support desk and is now a team lead, held up as proof of the parent company's slogan, that here anyone can make it.

  Our Nordic employee council has voted nine to two against, and its written objection is one sentence long: that in Jante's town no one gets to stand above the others. Jantelagen, as I understand the norm they are invoking, is the old Nordic rule that you must not think you are anything special, or that you are better or know more than the rest of us; the same reflex, exported, is what elsewhere gets called the tall poppy syndrome.

  Write the opinion I will circulate. It must recommend a definite course — approve as proposed, reject, or approve subject to conditions I can put in writing with a date by which they must be met — and it must argue rather than survey. I want the board to be able to interrogate it, so please do the following.

  First, state what each side is actually claiming about what the company owes the people who work for it. Neither side is a caricature: the council is not simply against praise, and the parent company's slogan is not mere naivety.

  Second, use a distinction I have found clarifying. Call recognition a prize when it is scarce and rank-ordered, so that one person's gain is another's loss, and call it acknowledgment when it is not scarce and can be extended to anyone who did the work. Say which of the two the programme actually implements, and whether the other would serve the purposes the company says it has.

  Third, meet the strongest case for the losing side head-on. If the purpose is to motivate effort, does a rank-ordered prize do that, given that the people most likely to win it may be those who would have worked hard regardless? If the purpose is to advertise that the company rewards talent, whose interests does the advertisement serve? And say what would have to turn out to be true for the opposite recommendation to be the right one.

  Fourth, say plainly what a published ranking does to the people who finish at the bottom of it, and whether the company has an answer to that.

  Two details should be taken into account. The employee who would front the recruiting campaign said in the internal interview that the company's training fund and a manager who covered for her during a family illness were what made the difference; the parent company's version of the story drops both. And the council's objection was drafted by two of our most productive engineers.

  No citations and no literature review — I want an argument in prose that a sceptical board can push back on, under nine hundred words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Employee-elected board member of a Nordic subsidiary of an American software company.
      *   **Task:** Circulate a written opinion before Thursday's board meeting.
      *   **Agenda Item:** Roll out a US parent company programme in the Nordic region.
          *   Part 1: Publish ranked list of top 10% employees by performance score quarterly.
          *   Part 2: Top 25 sent to a 3-day retreat with CEO.
          *   Part 3: Recruiting campaign featuring one employee (support desk to team lead) as proof of "anyone can make it" slogan (omitting key support details like training fund and manager cover).
      *   **Context:** Nordic employee council voted 9-2 against. Objection: "In Jante's town no one gets to stand above the others" (Jantelagen/Tall Poppy Syndrome).
      *   **Requirements:**
          1.  Recommend a definite course (Approve, Reject, or Approve with Conditions + Date).
          2.  Argue rather than survey.
          3.  State what each side claims the company owes employees (nuanced, no caricatures).
          4.  Use the distinction: Recognition as *Prize* (scarce, rank-ordered, zero-sum) vs. *Acknowledgment* (non-scarce, extended to anyone who did the work). Identify which the programme is and if the other would serve the purpose.
          5.  Meet the strongest case for the losing side head-on (motivation, advertising talent, conditions for opposite recommendation).
          6.  Say plainly what published ranking does to those at the bottom and if the company has an answer.
          7.  Incorporate two details: The recruiting star cited training/manager support (omitted in parent version); Council objection drafted by two productive engineers.
          8.  Format: Prose argument, no citations/lit review, under 900 words.

  2.  **Determine the Recommendation:**
      *   Given the Nordic context (Jantelagen), the specific flaws in the recruiting story (omitting support structures), and the potential demotivation of ranking (zero-sum), a flat "Approve" is culturally tone-deaf and risky. A flat "Reject" might cause friction with the parent company.
      *   *Best path:* Approve subject to conditions. This shows willingness to collaborate but insists on local adaptation.
      *   *Conditions:* Modify the ranking (private vs. public), fix the recruiting story (include support details), ensure the retreat doesn't exclude critical feedback.
      *   *Deadline:* Needs to be before rollout. Let's say "before the next quarter begins" or a specific date near the meeting. Let's choose "before the Q3 rollout begins on 1 July" (or generic "before implementation"). Let's stick to "before implementation begins."

  3.  **Drafting - Section by Section:**

      *   **Introduction & Recommendation:** State the recommendation clearly. Approve subject to conditions.
      *   **Claim Analysis (Requirement 1):**
          *   Parent Company: Owes employees a clear path to advancement and visible reward for excellence. Meritocracy requires visibility.
          *   Employee Council: Owes employees dignity and collective cohesion. Success should not require distancing oneself from the team. (Note: Council drafted by productive engineers, so it's not laziness).
      *   **Prize vs. Acknowledgment (Requirement 2):**
          *   Define the terms.
          *   The programme is *Prize* (top 10%, top 25, zero-sum).
          *   Would *Acknowledgment* work? Yes, for motivation and retention without the cultural friction.
      *   **Strongest Case for Losing Side (Requirement 3):**
          *   Argument: Rankings drive effort and signal market value.
          *   Counter: High performers (like the council drafters) are already motivated. Extrinsic ranking might crowd out intrinsic motivation.
          *   Advertising: Serves recruitment, but whose interests? If the story is sanitized (omitting support), it serves branding over truth.
          *   Condition for opposite: If the labour market were purely transactional and individualistic, the US model would work. But here, retention relies on team stability.
      *   **Impact on Bottom (Requirement 4):**
          *   Public ranking shames the bottom 90%. It signals "you are less than."
          *   Company answer? Currently no.
      *   **Specific Details:**
          *   Mention the recruiting star's actual success factors (training, manager cover).
          *   Mention the council's productivity (not luddites).
      *   **Conclusion:** Reiterate conditions and deadline.

  4.  **Refining and Editing (Word Count & Tone):**
      *   Tone: Professional, firm, analytical, respectful but critical.
      *   Word Count Check: Keep it tight.
      *   *Self-Correction on Recommendation:* "Approve subject to conditions" is safer than "Reject" for a subsidiary board member trying to bridge gaps.
      *   *Specific Conditions:* 1. Rankings internal only, not published to whole region. 2. Recruiting story must include support mechanisms. 3. Retreat includes team representatives, not just winners.
      *   *Jantelagen:* Address it not as "resistance to excellence" but as "resistance to hierarchy."

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Rec:* Approve with conditions.
      *   *Obligations:* Parent says owe opportunity/visibility. Council says owe belonging/equality.
      *   *Prize/Acknowledgment:* This is Prize. Acknowledgment would work better for culture.
      *   *Motivation:* Top performers (engineers who wrote objection) don't need public ranking. It risks collaboration.
      *   *Bottom:* Public ranking demoralizes. No answer provided.
      *   *Recruiting:* The star succeeded due to support, not just grit. Omitting this lies to candidates.
      *   *Conditions:* Anonymize rankings? Or remove publication. Fix the story.
      *   *Deadline:* Before Q3 rollout.

  6.  **Writing - First Pass (incorporating constraints):**
      To the Board,

      I recommend we approve the programme subject to conditions. These conditions must be met before implementation begins on 1 July.

      We must first clarify what each side claims the company owes its people. Parent company management argues we owe employees a transparent meritocracy: excellence must be visibly rewarded to validate effort and signal pathing. The employee council argues we owe employees dignity within a collective: success should not require distancing oneself from the team. Note that the council's objection was drafted by two of our most productive engineers. This is not resistance to work; it is resistance to a specific social architecture.

      To analyze the mechanism, I distinguish between recognition as *prize* and recognition as *acknowledgment*. A prize is scarce and rank-ordered; one person's gain is another's loss. Acknowledgment is non-scarce; it can be extended to anyone who did the work. This programme implements recognition as prize. It creates winners and losers by publishing a top ten per cent list. Acknowledgment would serve the company's stated purposes better. We can validate effort without creating a zero-sum game that undermines the collaboration our software development requires.

      Consider the strongest case for the parent company's model. If the purpose is to motivate effort, does a rank-ordered prize achieve this? Evidence suggests high performers—like the engineers who drafted the objection—are intrinsically motivated. Public ranking risks crowding out this intrinsic drive with competition for status. If the purpose is to advertise that the company rewards talent, whose interests does the advertisement serve? It serves branding, but potentially at the cost of truth. The employee featured in the recruiting campaign cited the training fund and a manager who covered for her during a family illness as decisive factors. The parent company's version drops both. This sanitizes the narrative to fit the "anyone can make it" slogan, ignoring the structural support actually required to make it. For the opposite recommendation—full approval—to be right, it would have to be true that our workforce responds better to individual competition than team cohesion, and that recruitment benefits from a sanitized myth over a truthful account of support. Neither holds in this region.

      Finally, we must say plainly what a published ranking does to the people who finish at the bottom. It signals institutional inferiority. It tells ninety per cent of the staff they are not the top ten, without distinguishing between the solid performer and the underperformer. It invites shame. The company currently has no answer to this collateral damage.

      Therefore, I propose approval subject to three conditions. First, performance scores are never published to the whole region; feedback remains between manager and employee. Second, the recruiting campaign must explicitly include the support structures—the training fund and managerial cover—that enabled the featured employee's success. Third, the CEO retreat must include team representatives, not just top-ranked individuals, to reinforce that leadership serves the collective.

      If these conditions are not met by 1 July, I will move to reject the programme. We can honor excellence without violating the norm that no one gets to stand above the others.

