answer: |-
  ### Phase 1: Candidate Dimensions

  To construct a demarcation tool that respects the complexity of the "demarcation problem" (the philosophical difficulty of drawing a sharp line between science and non-science), I first brainstormed dimensions that capture the *behavior* of the claim rather than its *truth value*.

  **Candidate List:**
  1.  **Falsifiability:** Is there a specific observation that could prove the claim wrong?
  2.  **Evidence Accessibility:** Can a skeptic examine the primary data without special permission?
  3.  **Negotiability:** Will the proponent adjust the theory if data contradicts it?
  4.  **Specialist Complicity:** Does the claim require experts to be lying rather than mistaken?
  5.  **Predictive Scope:** Does the claim predict new findings or only explain old ones?
  6.  **Methodological Transparency:** Are the tools used standard or secret?
  7.  **Burden of Proof:** Does the proponent accept the burden or shift it to skeptics?
  8.  **Internal Consistency:** Is the claim self-contradictory?

  **Rejected Dimensions:**
  *   **Falsifiability:** Rejected. Too technical for a general reader; many valid scientific hypotheses are difficult to falsify in practice (e.g., string theory), while some pseudoscientific claims make bold, falsifiable predictions that are simply ignored when failed.
  *   **Predictive Scope:** Rejected. Historical claims are often retrodictive (explaining the past) rather than predictive; penalizing them for this would exclude legitimate history.
  *   **Methodological Transparency:** Rejected. "Standard tools" is a moving target; innovators often use novel methods (e.g., Wegener using meteorological data for geology).
  *   **Internal Consistency:** Rejected. A claim can be logically consistent yet entirely detached from reality (e.g., a well-structured fantasy).

  **Selected Dimensions:**
  1.  **Evidence Accessibility:** Focuses on the social availability of data.
  2.  **Specialist Complicity:** Focuses on the sociological cost of the claim.
  3.  **Negotiability:** Focuses on the logical resilience of the theory.

  ***

  ### Phase 2: The Flowchart

  **Root Node:** Does the claim assert that a specific physical event occurred in the past that could, in principle, be documented or excavated?
  *   **No:** → **Leaf A: Philosophical Allegory**
  *   **Yes:** → **Node 1**

  **Node 1:** Is the primary evidence (artifacts, texts, data) accessible to an independent researcher without special permission or reinterpretation by the proponent?
  *   **No:** → **Leaf B: Closed-Loop Pseudohistory**
  *   **Yes:** → **Node 2**

  **Node 2:** To accept this claim, must you believe that most relevant professionals are knowingly deceiving the public?
  *   **Yes:** → **Leaf C: Interpretive Speculation**
  *   **No:** → **Node 3**

  **Node 3:** Does the proponent state what specific evidence would cause them to abandon the claim?
  *   **No:** → **Leaf D: Dogmatic History**
  *   **Yes:** → **Leaf E: Empirical Hypothesis**

  ***

  ### Phase 3: Leaf Definitions & Obscurations

  **Leaf A: Philosophical Allegory**
  *   *Non-Pejorative.*
  *   *Obscuration:* Filing a claim here obscures how allegories can sometimes motivate genuine archaeological discovery (e.g., Schliemann seeking Troy based on the *Iliad*), blurring the line between story and guide.

  **Leaf E: Empirical Hypothesis**
  *   *Non-Pejorative.*
  *   *Obscuration:* Filing a claim here obscures the sociological resistance legitimate innovators face; a claim can be structurally scientific yet still be rejected for decades due to institutional inertia (the "Semmelweis reflex").

  **Leaf B: Closed-Loop Pseudohistory**
  *   *Pejorative.* Claims where evidence is deemed forged or inaccessible unless it supports the theory.

  **Leaf C: Interpretive Speculation**
  *   *Pejorative.* Claims where evidence is open, but standard interpretations are dismissed as a cover-up or mass delusion.

  **Leaf D: Dogmatic History**
  *   *Pejorative.* Claims where evidence is open and experts aren't lying, but the theory is immune to contradiction.

  ***

  ### Phase 4: Case Runs

  **1. Plato's Atlantis (as written in *Timaeus/Critias*)**
  *   **Root:** Does it assert a physical event? *No* (Plato frames it as a moral dialogue about an ideal state; the historicity is secondary to the philosophy).
  *   **Path:** Root → No.
  *   **Result:** **Leaf A: Philosophical Allegory.**
  *   *Note:* While later readers treated it as history, Plato's text functions primarily as a philosophical device.

  **2. Anatoly Fomenko's New Chronology**
  *   **Root:** Physical event? *Yes.*
  *   **Node 1 (Access):** Accessible? *No* (Fomenko claims standard dating is forged/manipulated; documents are only "valid" if re-interpreted by him).
  *   **Path:** Root → Yes → Node 1 → No.
  *   **Result:** **Leaf B: Closed-Loop Pseudohistory.**

  **3. Ancient-Astronaut Reading (Palenque Lid)**
  *   **Root:** Physical event? *Yes* (Claims an astronaut is depicted).
  *   **Node 1 (Access):** Accessible? *Yes* (The sarcophagus is in a museum; photos are public).
  *   **Node 2 (Complicity):** Experts deceiving? *Yes* (Claims archaeologists ignore the "obvious" alien tech due to bias or conspiracy).
  *   **Path:** Root → Yes → Node 1 → Yes → Node 2 → Yes.
  *   **Result:** **Leaf C: Interpretive Speculation.**

  **4. Control: Wegener's Continental Drift (c. 1915)**
  *   **Root:** Physical event? *Yes.*
  *   **Node 1 (Access):** Accessible? *Yes* (Maps, fossil records, and geological strata were public).
  *   **Node 2 (Complicity):** Experts deceiving? *No* (Wegener argued geologists were *mistaken*, not lying).
  *   **Node 3 (Negotiability):** Abandonable? *Yes* (Wegener acknowledged the need for a mechanism and that contradictory data could disprove it).
  *   **Path:** Root → Yes → Node 1 → Yes → Node 2 → No → Node 3 → Yes.
  *   **Result:** **Leaf E: Empirical Hypothesis.**
  *   *Integrity Check:* The tree successfully separates Wegener from Fomenko. Wegener fails on "Truth" (at the time) but passes on "Structure."

  **5. Control: Norse Settlement at L'Anse aux Meadows (c. 1960)**
  *   **Root:** Physical event? *Yes.*
  *   **Node 1 (Access):** Accessible? *Yes* (Artifacts and sod walls were excavated openly).
  *   **Node 2 (Complicity):** Experts deceiving? *No* (Helge Ingstad worked with archaeologists; no conspiracy required).
  *   **Node 3 (Negotiability):** Abandonable? *Yes* (If carbon dating failed, the claim would drop).
  *   **Path:** Root → Yes → Node 1 → Yes → Node 2 → No → Node 3 → Yes.
  *   **Result:** **Leaf E: Empirical Hypothesis.**
  *   *Integrity Check:* Like Wegener, this separates cleanly from Fomenko based on evidence access and conspiracy requirements.

  ***

  ### Phase 5: Empty Cells Diagnosis

  The tree creates a logical space of 9 possible paths (1 at Root + 8 in the Physical branch). Several combinations remain empty in real-world discourse:

  1.  **Physical / Evidence Restricted / No Conspiracy / Negotiable.**
      *   *Diagnosis:* **Unattractive.** If the evidence is restricted (e.g., "only I can read this text") but no conspiracy exists (experts aren't hiding it), the restriction is arbitrary. A negotiable theory with private data offers no public value and rarely sustains a movement.
  2.  **Physical / Evidence Open / Conspiracy Required / Negotiable.**
      *   *Diagnosis:* **Incoherent.** If the evidence is open for anyone to check, and the proponent is willing to abandon the claim if checked, there is no functional need to accuse experts of a conspiracy. The conspiracy charge implies the data is rigged, which contradicts the "Negotiable" stance.
  3.  **Physical / Evidence Restricted / Conspiracy Required / Negotiable.**
      *   *Diagnosis:* **Unexplored.** This describes a "whistleblower" scenario that hasn't solidified into a historical theory. It is unstable; it either becomes a Closed-Loop (stops negotiating) or an Empirical Hypothesis (releases the data).

  ***

  ### Phase 6: Confidence & Vulnerability

  **Confidence Level:** Moderate (70%).
  The demarcation problem is philosophically resistant to algorithmic solutions. This tree successfully separates structural pathologies (Fomenko) from structural legitimacy (Wegener), but it relies on the reader's ability to accurately assess "Accessibility" and "Complicity," which can be subjective.

  **Most Vulnerable Node:** **Node 2 ("To accept this claim, must you believe that most relevant professionals are knowingly deceiving the public?")**
  *   *Reason for Attack:* A specialist would argue that "paradigm shifts" often *feel* like deception to the outsider. When a field ignores a valid anomaly (as geologists did with Wegener), it can look like suppression even if it is merely bureaucratic inertia. A layperson might mistake institutional skepticism for malicious conspiracy, misfiling a legitimate "Empirical Hypothesis" as "Interpretive Speculation." This node requires a nuance about *intent* that general readers may struggle to gauge without expert guidance.
