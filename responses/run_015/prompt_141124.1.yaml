  ### A Note on the "Cannot Show" Section
  You asked for an honest note about what the game can't reach. The biggest limitation is **Period Effects**. Because your survey year is fixed at 2024 in the dataset, you cannot show how a specific event (like a pandemic or a war) hits *all* ages at once, which is the third leg of the Age/Period/Cohort stool. You will have to supply this in the debrief: *"We froze time in this game. In reality, the clock moves for everyone, which makes the math even harder."*

  Also, the game implies there is a "correct" answer key. In real social science, there often isn't. You'll need to mention that we rigged Q3 to be "Silly," but in the real world, we often don't know if a pattern is Silly or Real until years later.

