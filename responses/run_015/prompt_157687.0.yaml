      *   *Awkward:* Falsifiability/Qualification creep.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Validate the sophistication of the question (moving past "it's just metaphor").
      *   **Brainstorm:** List the key categories (Metaphysical, Empirical, Evolutionary, Methodological).
