answer: |-
  This is a classic philosophical trap, often called the "Fraud Vitiates All" problem. Your colleague has constructed a *reductio ad absurdum* that relies on treating consent as a semantic contract rather than a normative transfer of authority. The argument is logically valid, but it is unsound because it relies on a false premise about how descriptions map onto moral permissions.

  Here is the diagnosis, the price list, and the analysis of the two specific repairs you requested.

  ### 1. The Diagnosis: Reject Premise (3)

  **The Move:** You must reject Premise (3): *"Any false belief about any feature of the act, or of the person performing it, means the description A was consenting under is not satisfied by what actually happens."*

  **Why it looked innocent:** It appeals to logical precision. If I consent to $X$ described as $F$, and $X$ is not $F$, then I didn't consent to $X$. It treats consent like a software license agreement where every clause must be met for the license to be valid.

  **The Cost (Price List):**
  Rejecting (3) commits you to a theory of **Materiality**. You are asserting that not all features of an act are morally equivalent. Some features are *essential* to the permission (the nature of the act, the identity of the agent, major risks), and some are *collateral* (the brand of the scalpel, the doctor's political views, minor protocol details hidden to preserve blinding).

  By rejecting (3), you admit that consent is not a perfect semantic match between mind and world. It is a **normative authorization** that tolerates a certain degree of descriptive mismatch.

  **The Consequence:**
  You lose logical crispness. You cannot define battery using a simple algorithm. You now have to argue case-by-case about which deceptions are "material" enough to vitiate consent. This invites vagueness, but it is the only way to avoid the absurdity of (6).

  ### 2. The Contact vs. Transaction Distinction

  Your colleague's repair attempts to salvage the argument by splitting consent into two layers:
  1.  **Consent to Contact:** Object-involving, attaches to the physical body/act, indefeasible by fraud.
  2.  **Consent to Transaction:** Description-sensitive, voidable by fraud, gives rise to claims in deception/negligence but not battery.

  **Does it hold?**
  It holds legally and practically, but it is not a metaphysical distinction; it is a **normative** one. There is no physical difference between a touch that is battery and a touch that is fraud. The difference lies in *what we decide matters* for the validity of the permission.

  **The Identity Problem:**
  You asked what this implies for identity-deception cases (e.g., impersonating a spouse, or a specific surgeon).
  *   **The Colleague's View:** If the physical contact is identical, it's not battery. It's fraud.
  *   **The Intuitive View:** Impersonating a spouse *is* battery (or sexual assault). Impersonating a specific surgeon *can* be battery.

  **How to reconcile:**
  You must argue that in identity cases, the identity of the agent is not a "transactional feature"; it is a **constitutive feature of the contact itself**.
  *   When I consent to intimacy with my spouse, the "act" is defined relationally. A touch by a stranger is a *different act*, not just the same act under a false description.
  *   When I consent to surgery by Dr. Smith because I trust Dr. Smith's hands, and Dr. Jones performs it, the "act" has changed because the *agent* is part of the act's identity in a medical context.

  **The Implication:**
  The distinction holds, but you cannot draw the line based on physics (was the pressure of the hand the same?). You must draw it based on **authority**. Did the deception undermine the authority I granted?
  *   If I lie about my golf handicap to get you to let me treat your knee, that is transactional fraud. I still had authority to touch your knee.
  *   If I pretend to be your husband to hug you, I never had authority to touch you. That is battery.
  *   If I pretend to be Dr. Smith (who you specifically requested) to operate on you, I never had authority. That is battery.

  **Price:** You must accept that "the act" is not a physical event but a **social description**. This makes the boundary of battery fuzzy, but it saves you from calling every placebo study a physical assault.

  ### 3. The Counterfactual Test

  You asked about the case where the participant would have consented anyway, but the deception was necessary for REB approval (e.g., a detail in the protocol that was obscured to prevent bias, not disclosed on the form).

  **Is the counterfactual a test of validity or harm?**
  It is primarily a test of **harm (causation)**, not validity.
  *   **Validity:** Did the agent have the authority to proceed? If the consent process was deceptive regarding material facts, the authority was never transferred. The consent is invalid *regardless* of what the participant would have chosen.
  *   **Harm:** Did the participant suffer a setback to their interests? If they would have consented anyway, their welfare interests were not set back.

  **The Problem:**
  If you say the consent is *valid* because they would have agreed anyway, you collapse autonomy into welfare. You are saying, "It's okay to lie to you as long as we guess correctly what you'd choose." This is paternalism.

  **The Alternative Test of Validity:**
  If the counterfactual test doesn't determine validity, what does?
  You need an **Objective/Reasonable Person Standard** or an **Authority-Undermining Standard**.
  *   *Test:* "Would a reasonable person consider this fact material to their decision?" OR "Does this deception undermine the participant's status as a co-author of the research?"
  *   In your REB case: Even if the participant is unwronged in terms of welfare, the **integrity of the consent process** is wronged. The investigators bypassed the REB's gatekeeping function.

  **The Verdict on your Case:**
  *   **Validity:** The consent is technically defective (invalid) because the disclosure was incomplete.
  *   **Battery?** No. Because the deception was not material to the *physical contact* (it was a protocol detail), it does not vitiate the permission to touch. It vitiates the permission to *enroll in a study under those specific governance conditions*.
  *   **Wrong:** The investigators committed an ethical violation (fraud on the REB, violation of regulatory compliance), but they did not commit a battery against the participant.

  **Price:** You must accept that a person can be **wronged without being harmed**. The participant's autonomy was disrespected (a dignitary harm), even if their physical welfare was untouched.

  ### Summary: The Price List for Rejecting (6)

  To escape your colleague's trap while keeping the intuitive verdict on identity cases, you must pay the following costs:

  1.  **Abandon Semantic Rigor:** You must admit that consent is not a perfect match between mental description and physical reality. You are adopting a **Normative Theory of Consent** (transfer of authority) rather than a **Descriptive Theory** (matching predicates).
  2.  **Accept Vagueness (Materiality):** You cannot have a bright-line rule for what counts as deception that vitiates consent. You must rely on the concept of "materiality," which requires judgment calls. (e.g., Is a surgeon's success rate material? Yes. Is their medical school ranking? Maybe.)
  3.  **Distinguish Wrongs from Harms:** You must accept that valid ethical criticism exists even when the counterfactual test shows no welfare loss. The "would have consented anyway" defense mitigates damages, but it does not cure the violation of autonomy.
  4.  **Reclassify the "Absurd" Cases:**
      *   **Placebos:** Not battery. The patient consents to "treatment which may be placebo." The description is satisfied.
      *   **Deception Studies:** Not battery. The participant consents to "procedures within a research protocol," and they are told deception *might* be used (authorized deception). If they aren't told deception *will* be used, it's an ethical violation, but usually not a physical trespass.
      *   **Substitute Surgeons:** This is the danger zone. If the primary surgeon is supervising, it's usually not battery. If the primary surgeon swaps out without notice, it is arguably battery (or at least gross negligence) because the identity of the surgeon is material to the consent.
      *   **Optimistic Risk Estimates:** Not battery, but potentially negligence/fraud. The act (surgery) is the same; the risk profile was misdescribed. This voids the *informed* part of consent, making it actionable, but courts rarely classify it as criminal battery unless the risk was totally concealed (e.g., "this is a massage" vs. "this is surgery").

  ### Advice for the Board Meeting

  Tell your colleague:
  *"Premise 3 fails because it treats consent as a semantic contract rather than a normative authorization. The law and ethics distinguish between fraud in the **factum** (nature of the act/identity of the agent), which vitiates consent and constitutes battery, and fraud in the **inducement** (collateral matters), which vitiates the agreement but leaves the physical permission intact. We preserve the intuition on identity cases by classifying identity as a factum issue, not an inducement issue. We handle the counterfactual case by acknowledging that autonomy violations can occur without welfare harm."*

  This allows you to reject the absurd conclusion (6) without surrendering the protection of vulnerable subjects in identity-deception cases.
