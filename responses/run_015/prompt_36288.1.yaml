  9.  **Final Polish:** Ensure the transition between sections is smooth. Make sure the "shaky parts" are highlighted clearly. (Proceed to generate output based on these thoughts.)

  *(Self-Correction during final output generation)*: I need to make sure I don't just validate the user's frustration but analyze the *philosophical structure* of that frustration. The user sees a contradiction; my job is to explain *how* the system sustains itself despite that contradiction. The concept of "Administrative Formalism" vs. "Substantive Justice" might be useful.

