prompt: |-
  Hey, I'm a corperate lawyer who spends most of my time thinking about vicarious liability, successor liability, and whether a corporation can have 'institutional intent' seperate from its officers. I'm not a philospher, but I read a bit about Karl Jaspers and his idea that after WWII there are four kinds of guilt: criminal guilt for breaking laws, political guilt for being part of a state that does wrong, moral guilt for what you personally did or failed to do, and metaphysical guilt for being human and failing to prevent suffering. Can you restate his whole taxanomy in the vocabulary I actually use? I mean legal personhood, board-level intent, organizational culture, successor liability, the difference between direct and derivative responsibility, that kind of thing. Do it as faithfully as you can. Then give me the residue report: which of Jaspers' categories map cleanly onto corporate-law concepts, which ones only fit if I twist them, and which ones just have no counterpart at all? And I want your honest view -- is the leftover guilt-talk something real that corporate law is missing, or is Jaspers just stretching everyday moral language past its breaking point?

  Also, be real about where you could be wrong. What specific argument or consideration would make you change your mind about whether that residue is a genuine gap or just linguistic drift?
