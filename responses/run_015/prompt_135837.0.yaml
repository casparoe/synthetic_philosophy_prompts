answer: |-
  Here is the translation of Jaspers' taxonomy into corporate law vocabulary, followed by the residue report and my assessment of the gap.

  ### I. The Jaspers Taxonomy: Corporate Law Translation

  **1. Criminal Guilt $\rightarrow$ Direct Statutory & Regulatory Liability**
  *   **Jaspers:** Violation of clearly defined laws, adjudicated in court, attaching to specific individuals.
  *   **Corporate Translation:** This is standard *mens rea* liability. It applies to the natural persons (officers/directors) who possessed the requisite *scienter* and committed the actus reus. It also applies to the legal person (the Corporation) where vicarious liability statutes allow the entity to be indicted for the acts of its agents (e.g., FCPA violations, Antitrust, Sarbanes-Oxley).
  *   **Key Mechanism:** Indictment, conviction, sentencing, fines, imprisonment. The standard is "beyond a reasonable doubt" (criminal) or "clear and convincing" (regulatory enforcement).

  **2. Political Guilt $\rightarrow$ Entity & Successor Liability**
  *   **Jaspers:** Liability borne by all citizens for the actions of their state, simply by virtue of membership. It is paid through reparations or loss of sovereignty.
  *   **Corporate Translation:** This is the liability of the *Entity* itself, distinct from its officers, and the liability of *Successors*. Even if the C-Suite is entirely replaced (a "new administration"), the Corporation remains liable for the debts, fines, and torts incurred during the previous regime. Shareholders bear the cost through dilution or value loss, despite having no direct control over the specific wrongful acts.
  *   **Key Mechanism:** Civil penalties, disgorgement, successor liability in M&A, compliance monitors. The standard is strict liability or negligence; intent is irrelevant to the entity's obligation to pay.

  **3. Moral Guilt $\rightarrow$ Fiduciary Breach & Compliance Culture Failures**
  *   **Jaspers:** Internal judgment of conscience regarding what one did or failed to do. Not legally punishable, but binding on the soul.
  *   **Corporate Translation:** This maps to the gap between "legal compliance" and "fiduciary duty." It is the *Caremark* standard (oversight liability). It asks: Did the Board establish a reporting system that *should* have caught this? It also covers the internal "culture of compliance." An officer might not have broken a law (no Criminal Guilt), but they may have failed to intervene when they saw ethical risks, breaching their duty of loyalty or good faith.
  *   **Key Mechanism:** Shareholder derivative suits, D&O coverage exclusions, internal investigations, reputational damage. The standard is "gross negligence" or "bad faith," often settled rather than litigated.

  **4. Metaphysical Guilt $\rightarrow$ Breach of Social License / Stakeholder Solidarity**
  *   **Jaspers:** Guilt arising from human solidarity. Failing to prevent suffering when one had the power to do so, even if no law required it.
  *   **Corporate Translation:** This is the failure to utilize corporate power to prevent harm where no fiduciary or statutory duty existed. It is the gap between "Shareholder Primacy" (Friedman doctrine) and "Stakeholder Capitalism." If a corporation *could* have prevented a supply chain atrocity without violating fiduciary duty but chose not to because it wasn't legally required, Jaspers argues they are guilty. Corporate law generally says they are not.
  *   **Key Mechanism:** Market boycotts, ESG divestment, public shaming, loss of "social license to operate." There is no legal mechanism for enforcement; it is enforced purely by extra-legal market forces.

  ***

  ### II. Residue Report

  **1. Clean Maps**
  *   **Criminal Guilt:** Maps perfectly. Corporate law is built on this binary. Either you violated the statute/regulation with the requisite intent, or you didn't.
  *   **Political Guilt:** Maps well to **Successor Liability** and **Entity Liability**. The law explicitly recognizes that the "Corporate Person" survives the death or departure of its "organs" (officers) and must pay for the past regime's sins. This is the cost of limited liability and perpetual existence.

  **2. Twisted Maps**
  *   **Moral Guilt:** Requires twisting. In Jaspers' view, moral guilt is internal and non-codifiable. In corporate law, we try to codify it into **Fiduciary Duty** and **Compliance Programs**. We turn "conscience" into "checklists." The twist is that once you codify it, it stops being moral guilt and becomes risk management. A lawyer advises a client to document their moral concern to avoid liability, which arguably voids the moral content.

  **3. No Counterpart**
  *   **Metaphysical Guilt:** **Zero Counterpart.** Corporate law is positivist. It recognizes duties created by statute, contract, or common law precedent. It does not recognize a duty arising solely from "human solidarity" or the mere possession of power. If a corporation watches a disaster unfold and has the resources to stop it but no legal duty to act, corporate law treats their inaction as neutral. Jaspers treats it as a fundamental failure of existence.

  ***

  ### III. Honest View: Gap or Linguistic Drift?

  **The Verdict:** It is a **genuine gap**, but filling it would break the corporate form.

  Jaspers is not just stretching language; he is identifying a limitation inherent in positivist legal systems. Corporate law is designed to *limit* liability to encourage capital formation. The "Metaphysical" category demands *unlimited* solidarity.

  If we codified Metaphysical Guilt into corporate law, we would effectively end the concept of limited liability. If a corporation is liable for every harm it *could* have prevented regardless of duty, the risk profile becomes incalculable. Insurance markets would collapse. Capital would flee.

  However, the "residue" is real. We see it in the way markets punish companies that act "legally but immorally." The law says the opioid manufacturers followed certain protocols; the public says they bear metaphysical guilt for the addiction crisis. The law is silent; the market is not.

  So, Jaspers isn't drifting linguistically; he is pointing out that **Legal Personhood is a fiction that shields entities from Human Solidarity.** The "guilt" is real in the court of public opinion (which impacts valuation), but it is inadmissible in the court of law. Corporate law treats this as "reputational risk." Jaspers treats it as "existential failure." The difference matters because risk can be hedged; existential failure cannot.

  ***

  ### IV. Epistemic Humility: How I Could Be Wrong

  I am taking a positivist view of corporate law (law is what is written/enforced). Here is what could change my mind about whether the "Metaphysical" residue is a genuine gap:

  **1. The Expansion of *Caremark* Duties (Mission Critical Compliance)**
  If Delaware case law evolves to rule that ignoring "mission-critical" societal risks (e.g., climate change, public health) constitutes a breach of the Duty of Loyalty *even without a statutory violation*, then Metaphysical Guilt begins to merge with Moral/Fiduciary Guilt.
  *   *The Pivot:* If a court rules that a Board *must* consider societal harm to fulfill their duty to the corporation's long-term value, the "Metaphysical" becomes just another variable in the business judgment rule.

  **2. The Rise of "Benefit Corporation" Statutes as Default**
  Currently, Benefit Corp status is elective. If state legislatures move toward making stakeholder consideration a mandatory default rule for all legal persons (removing Shareholder Primacy), then "solidarity" becomes a statutory duty.
  *   *The Pivot:* If the law mandates solidarity, Jaspers' Metaphysical Guilt becomes Criminal/Political Guilt. The gap closes because the legislature codified the morality.

  **3. A Philosophical Counter-Argument on Personhood**
  My analysis assumes the Corporation is a legal construct separate from humanity. If a persuasive argument is made that **Legal Personhood derives its legitimacy solely from Social Utility**, then a failure of Social Utility (Metaphysical Guilt) automatically voids the protection of the Corporate Veil.
  *   *The Pivot:* If the "Right to Exist" as a corporation is conditional on preventing suffering (not just obeying laws), then Metaphysical Guilt becomes a grounds for **Corporate Death Penalty** (charter revocation).

  Until one of those three shifts happens, my view stands: Corporate law is a shield against Metaphysical Guilt by design. Jaspers is asking for a system of liability that corporate law was explicitly built to resist.
