answer: |-
  # Thesis Defense Q&A Prep Sheet
  **Topic:** Non-Aggregation in Rescue (Dyadic Relation View)
  **Defense Date:** Next Thursday

  ## Strategy Note
  Your core vulnerability is the gap between *metaphysical structure* (dyadic relations) and *action guidance* (what do I actually do?). Examiners will try to force you into absurd practical conclusions or collapse your view into a variant of utilitarianism. Your defense must hold the line that **aggregation is a category error**, not just a moral preference.

  ---

  ## 1. The "Blood on Your Hands" Objection (Highest Damage)
  **Examiner:** The Consequentialist (Disaster Triage Specialist)
  **The Question:** "In a mass casualty incident, I have one dose of antidote and five dying patients. Your view says I cannot sum the five to outweigh the one. If I follow your protocol, I might save one when I could have saved five. Are you arguing that hospital policy should mandate leaving four people to die to preserve a metaphysical point about dyadic relations? Isn't that moral negligence?"

  **Concede Up Front:**
  "I concede that on the *decision procedure* level, ignoring numbers feels counter-intuitive and painful. I am not claiming the agent feels no regret."

  **Two-Minute Reply:**
  "My argument isn't that the *outcome* of four deaths is preferable. It's that the *justification* for saving the five cannot be that 'five is greater than one.' For the institution, the rescue event is not 'Save Group A vs. Save Group B.' It is five separate instances of 'Can I save Patient 1?' 'Can I save Patient 2?'
  In each dyadic instance, the claim Patient 1 has on me is not strengthened by the presence of Patient 2. If I save Patient 1, I haven't wronged Patient 2 by 'counting less'; I've simply encountered a scarcity constraint. The tragedy is the scarcity, not the calculation. To aggregate is to treat the patients as resources in a sum, rather than distinct holders of a rescue claim. I'd rather admit I couldn't rescue them all than claim I rescued the 'larger amount' of personhood."

  **Weakest Spot in Reply:**
  You risk sounding like you are washing your hands of the four deaths. The distinction between "tragic scarcity" and "moral choice" is thin here. If you had a protocol that *randomized* the choice, the Consequentialist will argue that randomizing is only justified *because* it maximizes expected utility over time, dragging you back to aggregation.

  ---

  ## 2. The "Collapse" Objection (The Question You're Dreading)
  **Examiner:** Likely the Kantian or Consequentialist (follow-up)
  **The Question:** "You say institutions can't aggregate. But surely you allow institutional protocols to distribute aid fairly—like a lottery or first-come-first-served. If you justify those protocols because they lead to the best distribution of rescue over time, haven't you just collapsed into Rule-Utilitarianism? You're aggregating at the level of the rule even if you deny it at the level of the act."

  **Concede Up Front:**
  "I concede that my view shares *procedural* similarities with rule-based systems."

  **Two-Minute Reply:**
  "The collapse objection assumes the *justification* for the protocol is outcome-based. It isn't. The justification is respect for the dyadic relation. A lottery isn't used because it maximizes utility; it's used because it acknowledges that each dyadic claim is equal in weight but mutually exclusive in fulfillment.
  Rule-Utilitarianism justifies the rule by the sum of good consequences. I justify the protocol by the structural impossibility of comparing the claims. If the math changed—if saving five took half the effort of saving one—the Rule-Utilitarian changes the rule. I do not. The dyadic constraint remains absolute; the protocol is just a mechanism for handling logical incompatibility, not a tool for maximizing aggregate welfare."

  **Weakest Spot in Reply:**
  This is the hardest philosophical tightrope. If the *only* reason to pick a lottery over saving the one is to avoid arbitrariness, that's deontological. But if you admit that over a year, a lottery saves more people than flipping a coin heads-for-one, you are implicitly appealing to aggregate outcomes to justify the rule.

  ---

  ## 3. The "Institutional Role" Objection
  **Examiner:** The Kantian
  **The Question:** "You treat the hospital like a big individual. But an institution's duty is to the public trust. My duty as a public official scales linearly with the number of citizens I serve. If I ignore numbers, I am failing my universal duty to the collective. How can a dyadic relation exist between a state and a citizen without acknowledging the state's duty to the whole?"

  **Concede Up Front:**
  "I concede that institutional roles carry public obligations that individuals do not."

  **Two-Minute Reply:**
  "The 'public' is not a moral entity over and above the citizens. The state's duty is to *each* citizen, not to the 'collective' as a sum. When the state rescues, it acts through agents. Those agents stand in a dyadic relation to the recipient.
  Your view suggests the state owns the citizens' lives in a pool. My view is that the state is a trustee for individual claims. If the state aggregates, it treats citizens as means to the end of 'maximizing national survival.' I argue the Kantian imperative actually supports me: treat humanity always as an end. You cannot treat five people as a heavier 'end' than one person. The linearity of your obligation is to the *law*, not to the arithmetic of victims."

  **Weakest Spot in Reply:**
  The Kantian will counter that "universalizability" requires maximizing the instantiation of moral ends. If you can instantiate "survival" five times instead of once, failing to do so might be seen as failing the duty to promote ends.

  ---

  ## 4. The "Metaphysical Fluff" Objection
  **Examiner:** Your Advisor
  **The Question:** "We know Taurek argued the 'loss to each is equal.' You're adding this 'irreducibly dyadic' language. Honestly, isn't this just agent-relative constraints dressed up in metaphysical clothing? What work is the 'relation' actually doing that 'agent-centered prerogatives' doesn't do better without the ontology?"

  **Concede Up Front:**
  "I concede the terminology is dense and overlaps with agent-relative constraints."

  **Two-Minute Reply:**
  "Agent-relative constraints usually focus on the *agent's* integrity (e.g., 'I shouldn't kill'). My argument focuses on the *structure of the rescue*. Taurek focused on the victim's loss. I'm focusing on the transaction.
  The 'relation' does work because it blocks aggregation at the source. Agent-relative constraints allow the agent to choose not to minimize harm. I'm arguing the harm *cannot be summed* in the first place. It's not that I *won't* add the numbers; it's that the moral reality doesn't contain a sum to add. This prevents the 'compromise' positions where we count numbers but give them less weight. The dyadic claim makes aggregation a category error, not a weighting issue."

  **Weakest Spot in Reply:**
  Your Advisor hates metaphysical relation-talk. If they press you to define the "relation" without using circular language, you might struggle. It risks sounding like a distinction without a difference in practical application.

  ---

  ## Confidence Assessment & Risk Analysis

  **Confidence in this Prep Sheet:** **85%**
  I am highly confident in the standard objections to non-aggregation views (especially the triage and collapse objections) and the typical personas of these examiners. The replies align with standard defenses of non-consequentialist rescue ethics (similar to Scanlon or Kamm).

  **Least Sure Point:**
  I am least sure about **how you handle "batch" rescues** (e.g., vaccinating a village vs. one person).
  *Why:* Your dyadic argument works well for "pulling from a fire" (sequential/individual effort). It strains if the "act" is releasing a resource that *automatically* saves a group (e.g., fixing a dam). If the institution acts once and saves 5,000, is that 5,000 dyadic relations instantiated simultaneously, or one act? If it's one act, the Consequentialist will argue the *act* is evaluated by its total output.
  *Prep:* Be ready to define whether the "dyad" is defined by the *effort* or the *outcome*. Stick to effort/claim.

  **Final Advice:**
  Don't let them force you to say "Saving one is *better* than saving five." Say "Saving one is *permissible* even when five are at stake, because the five do not form a single moral weight." Keep the distinction between **Justification** (why it's allowed) and **Motivation** (what I feel) clear. Good luck.
