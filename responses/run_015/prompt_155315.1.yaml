answer: |-
  You are not cherry-picking. You are inadvertently replicating the methodology of modern development economics. Your gut reactions align almost perfectly with the dominant framework in the field: **The Institutional Hypothesis**, most famously articulated by Daron Acemoglu, Simon Johnson, and James Robinson (AJR).

  Here is the honest breakdown of whether there is a coherent principle, how to handle the outliers, and what the theory predicts for your test cases.

  ### 1. The Coherent Principle: Fundamental vs. Proximate Causes
  There is a hierarchy, but it isn't quite `Institutions > Colonial Legacy > Geography > Culture`. It is better framed as **Fundamental Causes** vs. **Proximate Causes**.

  *   **Proximate Cause:** **Institutions.** This is the engine. Inclusive institutions (property rights, rule of law, open markets, checks on power) create incentives to invest, innovate, and educate. Extractive institutions (predatory states, monopolies, patronage) siphon wealth to the elite.
  *   **Fundamental Causes:** **Geography and History (including Colonialism).** These do not determine wealth *directly*; they determine *which institutions get set up*.
      *   *Geography:* In the AJR framework, geography (specifically disease environments/settler mortality) influenced whether Europeans set up extractive colonies (high mortality, e.g., Congo) or settler colonies (low mortality, e.g., Australia).
      *   *History/Colonialism:* This is the "critical juncture." It locked in specific institutional paths.

  **The Verdict:** Your intuition that "Institutions Win" is the proximate truth. Your hesitation about "Colonial Legacy" is because that is the *historical root* of the institutions, not a competing force.

  ### 2. Addressing Your Specific Pairs

  **South Korea vs. North Korea / East vs. West Germany**
  *   **Verdict:** Pure Institutional Natural Experiments.
  *   **Analysis:** Same culture, same geography, same history pre-split. The divergence is entirely institutional (Command economy/Totalitarian vs. Market/Democratic).
  *   **Prediction:** East/West Germany reunification confirms this. East Germany did not converge instantly because *informal* institutions (norms, trust, social capital) take longer to change than laws, but the institutional framework was the primary driver of the initial divergence and the subsequent (slow) convergence.

  **Australia vs. Argentina**
  *   **Verdict:** Institutions (specifically constraints on elites).
  *   **Analysis:** You worried about "human capital." In economics, education systems are *institutions*. Britain exported constraints on executive power (parliaments, common law); Spain exported extractive bureaucracy. The "human capital" difference is a result of the institutional incentive to educate the populace.
  *   **Chile vs. Argentina Prediction:** This fits the model. Chile, despite Pinochet, established a technocratic, stable economic institutional framework (central bank independence, trade openness) that persisted post-democracy. Argentina suffered from institutional volatility (populist cycles, default, nationalization). The theory predicts Chile outperforms due to *institutional stability*, even if democracy was delayed.

  **Botswana vs. Zambia / Norway vs. Nigeria**
  *   **Verdict:** Institutions mediate resources.
  *   **Analysis:** This is the "Resource Curse" literature. Resources are not a curse; *weak institutions* make resources a curse. Botswana had pre-colonial tribal councils (*kgotla*) that evolved into democratic constraints; Nigeria had a fragmented colonial state designed for extraction. Norway had strong pre-existing constraints.

  **Haiti vs. Dominican Republic**
  *   **Verdict:** Drop the "Culture" intuition. It is Institutions (specifically Debt and Land).
  *   **Analysis:** This is the trap most people fall into. The divergence is not "French vs. Spanish culture." It is that Haiti was forced to pay an independence debt to France (1825) equivalent to 10x annual revenue, crushing state capacity for a century. Meanwhile, the DR had different land tenure patterns. "Culture" here is a lazy shorthand for "the incentives created by a crushing sovereign debt and land fragmentation."

  **Ethiopia vs. Kenya**
  *   **Verdict:** State Capacity, not just "Colonialism."
  *   **Analysis:** "Colonialism caused poverty" is too simple. The variable is **State Capacity**. Kenya inherited a British bureaucracy (railways, administration) that, while extractive, was functional. Ethiopia remained feudal with very low state penetration. Post-independence, Kenya could tax and build; Ethiopia struggled to project power. It's about the *type* of state left behind, not the mere fact of colonization.

  ### 3. The Japan Outlier
  **Japan industrializing without colonization** seems like a counter-example to the "Colonial Legacy" argument, but it actually proves the **Institutional** argument.

  *   **The Mechanism:** The Meiji Restoration (1868) was a deliberate, top-down **institutional overhaul**. Japan looked at China (getting carved up) and decided to import Western institutions (legal codes, banking, military conscription, education) to avoid colonization.
  *   **Why it matters:** It proves that culture is not destiny (Feudal Japan became Industrial Japan in 30 years) and that you don't need to be a "Settler Colony" to get rich. You need to **adopt inclusive/developmental institutions**. Japan is the ultimate evidence that institutions are a choice, not just a geographic fate.

  ### 4. Is there "One Account"?
  The **Acemoglu-Johnson-Robinson (AJR) Institutional Framework** gets you 85% of the way there. It is the only coherent account that handles the "Reversal of Fortune" (why rich 1500 places are poor now) and the "Natural Experiments" (Korea, Germany).

  **However, you must throw away one intuition:**
  **The "Culture" Intuition.**
  Whenever you feel like saying "Culture" (e.g., Haiti, Confucianism in East Asia), stop. In causal inference, culture is almost always **endogenous**.
  *   *Example:* "Trust" is high in Scandinavia not because of Vikings, but because they have had low-corruption institutions for 200 years. Trust is a *result* of institutions, not the cause.
  *   *Exception:* Some scholars (like Max Weber or more recently DeLong/Shleifer) argue culture has independent effects. But in your paired comparisons, culture is usually a confounder. If you control for institutions, the "culture" effect usually vanishes.

  ### 5. Where the Theory Struggles (The Remaining 15%)
  To be honest, the Institutional Hypothesis struggles with the **East Asian Tigers (minus Japan)**.
  *   **Singapore/China/South Korea:** These countries grew under authoritarian or semi-authoritarian regimes with significant state direction of the economy. This doesn't fit the "Inclusive Political Institutions" (Democracy) part of the theory perfectly.
  *   **The Fix:** Economists distinguish between **Inclusive Economic Institutions** (markets, property rights) and **Inclusive Political Institutions** (democracy). The Tigers had the former before the latter. The theory predicts they will eventually stall unless political institutions open up (which is a current debate regarding China).

  ### Summary of Your Hierarchy
  1.  **Institutions (Proximate):** The direct cause of wealth. (Your strongest signal).
  2.  **Critical Junctures (Historical):** Colonization, Revolutions, Meiji Restoration. These set the institutional path.
  3.  **Geography (Fundamental):** Influenced the *choice* of institutions historically (via disease/settler mortality), but matters less today due to technology/trade.
  4.  **Culture (Residual):** Mostly a byproduct of the above. Discard as a primary causal variable.

  **Final Verdict:** You are not cherry-picking. You have correctly identified that **institutions are the software that runs the hardware of geography and resources.** Your Haiti intuition is the only one that needs correction: replace "culture" with "historical debt and land institutions." If you do that, your mental model is consistent with the best economic research of the last 30 years.
