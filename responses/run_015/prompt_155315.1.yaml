      *   **East/West Germany:** Perfect test case. Same culture, geography, history pre-1945. Divergent institutions (Communism vs. Social Market Economy). Convergence after reunification supports Institutions.
      *   **Chile vs. Argentina:** Chile adopted technocratic institutions earlier (Pinochet's economists + post-transition stability) vs. Argentina's populist cycles. Fits Institutional volatility vs. stability.
      *   **Japan:** The "Outlier." Japan modernized without colonization. *Explanation:* Meiji Restoration was a deliberate institutional overhaul to avoid colonization. They imported Western institutions (legal, military, industrial). Supports the idea that *choosing* inclusive/developmental institutions works, regardless of colonial status.
      *   **One Account?** The AJR (Acemoglu, Johnson, Robinson) "Institutions Hypothesis" is the closest. It's not perfect (doesn't explain everything, e.g., East Asian Tigers' state capitalism nuances), but it handles 80-90% of the user's list.
      *   **Outlier to Throw Away:** The "Haiti = Culture" intuition is the weakest link. The "Ethiopia vs. Kenya" one is also tricky if framed simply as "colonialism bad."

  5.  **Drafting the Response (Iterative Process):**

