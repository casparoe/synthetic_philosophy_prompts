      *   *Aus vs Arg:* Settler colonies. Acemoglu/Robinson (Why Nations Fail) use this. User worries about "human capital/culture." This is a known debate (Institutions vs. Human Capital).
      *   *Bot vs Zam:* Another strong institutional case (diamonds vs copper management).
      *   *Hai vs DR:* Same island. User worries about "culture." Historically, this is usually framed as institutional (French extraction vs. Spanish neglect/latifundia), but post-revolution instability matters. "Culture" is often a proxy for historical institutional path dependence.
      *   *Reversal of Fortune:* Acemoglu et al.'s big paper. Supports Institutions (extractive vs. inclusive). User is right to question 1500 wealth metrics.
      *   *Eth vs Ken:* Colonialism isn't a monolith. Ethiopia had feudalism; Kenya had British infrastructure (albeit extractive). Nuanced institutional view.
      *   *Nor vs Nig:* Resource Curse literature. Institutions determine if resources are a blessing or curse.
      *   *Sing vs Mal:* Split. Leadership matters, but leadership *is* part of institutional quality (constraints on power).

  3.  **Synthesize a Coherent Principle:**
      *   The dominant framework in development economics that fits *most* of these is the **Institutional Hypothesis** (specifically the Acemoglu, Johnson, Robinson - AJR - framework).
      *   *Core Idea:* Economic performance is determined by *inclusive* vs. *extractive* economic and political institutions.
      *   *Role of Geography:* Indirect. Geography affects disease burden/settler mortality, which influenced *which* institutions were set up (settler vs. extractive colonies). It doesn't directly determine wealth today (as shown by Reversal of Fortune).
      *   *Role of Culture:* Often endogenous to institutions. "Culture" (trust, work ethic) often evolves *because* institutions reward/punish certain behaviors. It's rarely the *prime* mover in these specific comparisons.
      *   *Role of Colonial Legacy:* This is the *mechanism* by which institutions were formed in the Global South. It's not a separate category from institutions; it's the historical root of the institutional variable.
      *   *Role of Leadership/Agency:* Institutions constrain leadership, but critical junctures (like Singapore's split) allow leadership to shape institutions.

  4.  **Address Specific Questions:**

      *   **Hierarchy:** Yes, but refine it. Institutions are the *proximate* cause. Geography/History/Colonialism are *fundamental* causes that shaped the institutions. Culture is usually a byproduct or a reinforcing mechanism, not a root cause.
