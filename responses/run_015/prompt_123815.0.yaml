prompt: |-
  I work in trust and safety at a virtual-reality platform that also runs a sizeable in-world economy: users design and sell clothing, furniture and decorative objects to one another for real currency, and we take a commission on each sale. I've been asked to write the internal document that sets out what our enforcement rules actually presuppose, and the more carefully I list them, the more they seem to pull in different directions. So before I draft it: what theory of virtual objects, and of virtual harm, does a practice like ours presuppose? I want the conceptual structure rather than a literature survey or anything that would need a library — our lawyers handle the legal question, and I'm not asking which jurisdictions have prosecuted what.

  Three parts of the practice seem to me to be doing the real work. First, on ownership: our terms say that the user owns nothing, that every item is a revocable licence, that we may seize or delete anything at will, and that when a long-standing player dies there is nothing to pass on, so we refuse the family's request to transfer the contents of the account to an heir — but we also permanently ban players for taking another player's items, we describe this in public statements as theft, and where the taking involved breaking into an account we have sometimes referred the matter outward instead of simply closing the ticket. Second, on identity: after a crash destroyed a batch of items last year we rolled the database back and told people their items had been restored — the same items, we said, not replacements; then a bug duplicated a limited-edition object several thousand times, and although the copies were byte-for-byte indistinguishable from the originals we deleted every copy and left only the originals with whoever had held them before the bug. Players reasonably pointed out that we cannot have both: either the item just is its state in our database, in which case the copies were as genuine as the originals, or identity depends on how an item came into existence, in which case a rollback does not give you back the same item either. We had no reply ready. Third, on harm: we hand out permanent bans for non-consensual sexual touching of another person's avatar, and we ship a default personal-space bubble that prevents other avatars from coming within arm's reach; but we host combat experiences in which avatars are dismembered by the thousand, and we do not treat avatar death as a harm at all, even when one player deliberately targets another repeatedly. Our own staff disagree about whether the line is drawn by consent, by what an avatar stands for, by downstream effects on the person, or merely by what revolts the team.

  So I'd like the implicit theory reconstructed and then interrogated. What must be true for these rules to make sense, as opposed to what merely fits comfortably with them? Where are the three parts mutually consistent, and where do they commit us to incompatible things — in particular, is there any coherent account of what an in-world item is that simultaneously makes it unownable and uninheritable, makes a duplicate not the same item, and makes taking it from someone a genuine harm? And on harms: is a virtual harm a real harm, or is the harm always to a person, with the virtual event merely its occasion? Then the practical part of the answer, which is what my document needs: if we replaced the view we are implicitly working with either with the view that in-world items are genuine objects with genuine owners, or with the view that they are nothing at all and the only real facts are facts about people's experiences and about our servers, which of our rules would have to change, and how? And, relatedly, what rationale for the touching-versus-killing line would make it look like more than an accident of our team's sensibilities — or is the line genuinely underdetermined, in the sense that several different accounts of the wrong involved would each license exactly the enforcement policy we already have?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **User Role:** Trust and Safety at a VR platform with a real-money economy.
      *   **Task:** Write an internal document setting out the presuppositions of enforcement rules.
      *   **Problem:** The current rules seem contradictory (pull in different directions).
      *   **Goal:** Reconstruct the *implicit theory* of virtual objects and virtual harm currently in practice, interrogate its consistency, and explore the practical implications of shifting to alternative theories.
      *   **Constraints:** Conceptual structure, not a literature survey. Lawyers handle legal jurisdiction. Focus on coherence vs. inconsistency.
      *   **Key Tensions to Address:**
          1.  *Ownership:* ToS says "license/revocable/no ownership" vs. Enforcement says "theft/bans for taking/refusal to inherit."
          2.  *Identity:* Rollback says "same item restored" vs. Duplication bug says "copies deleted, originals kept" (contradictory metaphysics of digital objects).
          3.  *Harm:* Sexual touching banned vs. Avatar dismemberment allowed (consent? representation? downstream effects?).
      *   **Required Output:**
          1.  Reconstruct the implicit theory.
          2.  Interrogate consistency (where does it break?).
          3.  Practical implications: What changes if we shift to "Genuine Property" vs. "Pure Service/Experience"?
          4.  Rationale for Touching vs. Killing line (is it underdetermined?).

  2.  **Analyze the Implicit Theory (The "Status Quo"):**

      *   *Observation:* The platform acts like a sovereign state but claims to be a landlord.
      *   *Ownership:* It's not legal ownership, it's *status-based possession*. The harm isn't loss of property rights (since users don't have them), it's loss of *social standing* and *investment*. The "theft" label is a shorthand for "violation of expected exclusivity."
      *   *Identity:* It's *provenance-based*, not *substrate-based*. An item is defined by its history in the ledger/database logs, not its current byte state. This explains why rollbacks work (restoring the history/state pair) but duplicates don't (wrong history).
      *   *Harm:* It's *contextual symbolic harm*. The avatar is a proxy for the user's bodily autonomy *in social contexts*, but a game piece *in ludic contexts*. The line is drawn by *frame* (social vs. game), not just consent or physics.
      *   *Core Philosophy:* **Managed Illusion.** The platform maintains a fiction of ownership and physicality to facilitate engagement and economy, but reserves the right to break the fiction when necessary for stability or liability.

  3.  **Interrogate Consistency (The "Break Points"):**

      *   *Ownership vs. Inheritance:* If it's just a license tied to a person, banning "theft" is hard to justify legally, but easy socially. Refusing inheritance is consistent with "license dies with user," but inconsistent with the economic reality that users treat it as asset.
      *   *Identity:* The Rollback vs. Duplication tension is the strongest metaphysical crack. Rollback implies *Continuity of State*. Duplication deletion implies *Continuity of Origin*. You can't have both without a privileged ledger. The platform *does* have a privileged ledger, so this is actually consistent *technically*, but inconsistent *phenomenologically* (to the user, they look the same).
      *   *Harm:* The Touching vs. Killing line. If harm is to the *person* via the avatar, why is killing okay? Because killing is *framed* as play. Touching is *framed* as violation. The theory relies on *Intent/Context* rather than *Action*. This is consistent if "Context" is the primary ontological category.

  4.  **Develop the Alternative Theories:**

      *   *Option A: Genuine Property (Digital Realism).* Items are assets. Users own them.
          *   *Changes:* Inheritance must be allowed. "Theft" becomes legal theft. Rollbacks become confiscation (taking property to fix a bug). Duplicates might need grandparenting or compensation.
          *   *Risk:* Regulatory nightmare, loss of control.
      *   *Option B: Pure Service/Experience (Digital Nihilism).* Items are nothing. Only access matters.
          *   *Changes:* Stop calling it "theft." Ban only for ToS violation (hacking), not "taking." Economy collapses (why buy if you own nothing?). Harm is only about psychological distress, not avatar violation.
          *   *Risk:* Economy dies, user trust evaporates.

  5.  **Address the Harm Line (Touching vs. Killing):**

      *   Is it underdetermined? No, it's determined by *Social Frame*.
      *   *Rationale:* The avatar is a *boundary marker*. In social spaces, the boundary is the body (sexual autonomy). In combat spaces, the boundary is the hitbox (game mechanics).
      *   *Coherent Account:* Harm occurs when the *social contract of the space* is violated. Combat spaces contractually agree to violence. Social spaces contractually agree to bodily integrity.
      *   *Refinement:* It's not just consent; it's *contextual expectation*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, philosophical but practical, internal memo style (or advisory to the drafter).
      *   *Structure:*
          1.  **The Implicit Theory:** "Stewardship of the Fiction."
          2.  **The Tensions:** Where the fiction strains.
          3.  **The Alternatives:** Property vs. Service.
          4.  **The Harm Line:** Contextual Integrity.
          5.  **Recommendations:** How to write the document.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's inconsistent." I need to show *how* it functions despite inconsistency. It functions because users accept the *pragmatic* truth over the *legal* truth. The theory is **Pragmatic Fictionalism**.
      *   *Ownership:* We pretend you own it so you trade; we assert we own it so we control.
      *   *Identity:* We pretend bytes matter; we assert history matters.
      *   *Harm:* We pretend avatars are bodies; we assert they are toys when convenient.

      *Refining the Harm Section:* The prompt asks if the line is underdetermined. I should argue it is *not* underdetermined if we adopt a specific theory: **Contextual Integrity**. The wrong isn't the action (touch/kill), it's the violation of the *normative frame* of the specific virtual space.

      *Refining the Practical Part:* If we shift to Genuine Property, we lose the right to rollback without compensation. If we shift to Pure Service, the economy collapses. The current "middle path" is the only viable one, but it needs honest labeling.

  7.  **Final Polish:** Ensure the distinction between "legal ownership" and "functional ownership" is clear. Ensure the distinction between "substrate identity" and "provenance identity" is clear. Ensure the harm section distinguishes between "simulation harm" and "user harm."

      *(Check against constraints)*: No literature survey. No legal jurisdiction specifics. Focus on conceptual structure.
      *(Check against prompt specifics)*: Address the three specific tensions (Ownership, Identity, Harm). Address the "what must change" question. Address the "underdetermined" question.

      *Key Insight:* The current system relies on **Performative Contradiction**. It works *because* it holds two opposing ideas in tension. The document shouldn't try to resolve the tension logically, but explain the *operational logic* of the tension. However, the user asks to reconstruct the theory *and* interrogate it. So I must show where it fails logically even if it works pragmatically.

      *Let's structure the "Implicit Theory" as "Sovereign Stewardship."* The platform is a sovereign power that grants privileges, not rights.
      *   *Ownership:* Privilege of exclusion, not title.
      *   *Identity:* Ledger-defined, not substrate-defined.
      *   *Harm:* Violation of contextual norms, not physical simulation.

      *Wait, one nuance on Identity:* The prompt says rollback = "same item," bug = "copies deleted." This implies identity is *State + Lineage*. Rollback restores State + Lineage. Bug creates State + False Lineage. This is actually consistent *if* the database ID is the soul of the object. I should point out that this is consistent technically but inconsistent phenomenologically.

      *Wait, one nuance on Harm:* Why is killing okay? Because it's *reversible* or *meaningless* in game context? No, because the *frame* is different. I need to emphasize the **Frame**.

      *Okay, ready to write.*
answer: |-
  To draft this document, you need to name the creature you are feeding. Your current enforcement regime does not rest on a single coherent metaphysics. It rests on a **Pragmatic Fictionalism**. You are maintaining a shared illusion that is robust enough to support an economy but fragile enough to be overridden by administrative necessity.

  Below is the reconstruction of that implicit theory, an interrogation of its breaking points, and the practical consequences of shifting to a more coherent (but likely unworkable) stance.

  ### I. The Implicit Theory: Sovereign Stewardship

  Your current rules presuppose a theory of **Sovereign Stewardship**. In this view, the platform is not a marketplace facilitator (which implies neutral property rights) nor a pure service provider (which implies no stakes). It is a sovereign power that grants *privileges* which mimic *rights*.

  **1. On Ownership: Exclusion without Title**
  *   **The Presupposition:** Users do not own *objects*; they own *positions*.
  *   **How it works:** When a user buys an item, they are purchasing a revocable license, yes, but functionally they are purchasing the *right to exclude others* from using that specific digital configuration.
  *   **The Contradiction:** You refuse inheritance (consistent with "license dies with person") but punish "theft" (consistent with "property rights").
  *   **The Resolution:** The theory treats "theft" not as the violation of a property right, but as the **violation of platform exclusivity**. When User A takes User B's item, they haven't stolen property; they have bypassed the Platform's authority to grant access. You ban them for undermining your sovereignty, not for harming the victim's equity. The "harm" to the victim is secondary; the primary harm is to the integrity of the ledger you control.
  *   **Why Inheritance Fails:** Inheritance implies the *license* survives the *licensee*. In Sovereign Stewardship, the privilege is personal. To allow inheritance would be to admit the asset exists independently of the user's active relationship with the sovereign.

  **2. On Identity: Provenance over Substrate**
  *   **The Presupposition:** A virtual object is not its code (substrate); it is its **ledger history** (provenance).
  *   **How it works:** This resolves your rollback/duplication tension.
      *   *Rollback:* When you restore items after a crash, you are restoring the *ledger state* that records their existence. The bytes are irrelevant; the record of "User X holds Item Y" is the reality.
      *   *Duplication:* When a bug creates copies, the *substrate* is identical, but the *ledger history* is false. The copies lack the causal chain of creation/trade that validates scarcity.
  *   **The Coherence:** This is actually the most consistent part of your system. You are operating on a **Database Realism**. The "true" item is the row in your SQL database, not the mesh rendered on the user's screen.
  *   **The Tension:** This clashes with user phenomenology. To the user, the copy *looks and acts* exactly like the original. You are asking them to value invisible metadata over visible reality. This works only as long as they trust your database is the ultimate truth.

  **3. On Harm: Contextual Integrity**
  *   **The Presupposition:** Harm is not defined by the *action* (touching vs. killing) but by the **normative frame of the space**.
  *   **How it works:**
      *   *Social Spaces:* The frame is "embodied interaction." The avatar is a proxy for bodily autonomy. Violating personal space violates the user's psychological safety.
      *   *Combat Spaces:* The frame is "ludic interaction." The avatar is a game piece. Dismemberment is a mechanic, not a violation.
  *   **The Resolution:** The line is not drawn by consent (users consent to combat) or by the nature of the avatar (it's the same mesh). It is drawn by **Contextual Integrity**. A punch in a boxing ring is sport; a punch in a café is assault. Your platform hosts both rings and cafés.
  *   **The Tension:** This breaks down in edge cases (e.g., griefing in a social space using combat mechanics). Your staff disagreement stems from confusing the *symbol* (avatar) with the *referent* (user). The harm is always to the user, mediated by the violation of the expected social contract of that specific virtual room.

  ---

  ### II. Interrogation: Where the Theory Breaks

  While Sovereign Stewardship works operationally, it contains three logical fractures that will widen as your economy grows.

  **1. The Economic Contradiction**
  You cannot sustain a *real-currency* economy on *revocable privileges* indefinitely.
  *   **The Break:** If users invest significant real wealth, the functional reality overrides the legal fiction. Courts (and users) will eventually treat "revocable licenses" as *de facto* property.
  *   **The Risk:** By banning "theft" and using that language publicly, you are reinforcing the property fiction. By refusing inheritance, you are asserting the license fiction. When a high-value account dies, the dissonance becomes a PR and legal liability. You are claiming the asset is worthless (no inheritance) while punishing those who take it as if it is valuable (theft bans).

  **2. The Metaphysical Contradiction**
  Database Realism requires absolute trust in the ledger.
  *   **The Break:** If your database is compromised, or if you make an administrative error, "Provenance" becomes arbitrary. If you delete an item because *you* made a mistake, users perceive it as confiscation of property, not correction of a ledger.
  *   **The Risk:** The "copies vs. originals" distinction holds only if the ledger is infallible. If users perceive the ledger as manipulatable by staff, the scarcity value of "originals" collapses.

  **3. The Harm Contradiction**
  Contextual Integrity relies on clear boundaries between "social" and "combat" spaces.
  *   **The Break:** VR is fluid. Users bring combat items into social spaces; they bring social behaviors into combat zones.
  *   **The Risk:** If a user is "killed" repeatedly in a space that is *technically* a combat zone but *functionally* used as a hangout, is it harm? Your current theory says "check the zone tag." A more robust theory would need to check "reasonable expectation." Relying solely on zone tags makes you look bureaucratic and indifferent to actual harassment.

  ---

  ### III. Practical Implications: Shifting the Theory

  If you move away from Sovereign Stewardship, you must choose a side. Both require significant rule changes.

  **Option A: Genuine Property (Digital Realism)**
  *   **The View:** Users own their assets. The platform is a custodian/bank.
  *   **Required Changes:**
      1.  **Inheritance:** You must allow account transfer upon death. The asset survives the user.
      2.  **Seizure:** You cannot delete items at will. You would need due process or compensation for removal (eminent domain).
      3.  **Rollbacks:** You cannot simply revert the database. If a rollback deletes a legitimately traded item, you owe the user restitution.
      4.  **Theft:** "Theft" becomes a legal claim, not just a ToS violation. You might be required to restore stolen items even if it breaks transaction finality.
  *   **Viability:** Low. This exposes you to massive liability and reduces your ability to manage the economy (e.g., removing exploitative items).

  **Option B: Pure Service (Digital Nihilism)**
  *   **The View:** Items are nothing. Users pay for access and experience.
  *   **Required Changes:**
      1.  **Language:** Stop using the word "theft." Call it "unauthorized access" or "exploitation."
      2.  **Economy:** You cannot facilitate real-money trading for *items*, only for *time/access*. If users sell items externally, you cannot police it as theft, only as ToS violation.
      3.  **Harm:** You would have to decouple harm from the avatar entirely. Touching an avatar is only bannable if it causes proven psychological distress to the user, not because it violates "bodily autonomy" of the digital form.
      4.  **Identity:** Admit that copies are identical to originals. Scarcity is a marketing lie you tell.
  *   **Viability:** Low. This destroys the incentive to create and buy. The economy collapses because there is no asset to hold.

  **Recommendation:** Do not switch. Sovereign Stewardship is the only model that supports a creator economy without exposing the platform to property law. However, you must **honest the fiction**.

  ---

  ### IV. The Touching-vs-Killing Line: Is it Underdetermined?

  You asked if the line is genuinely underdetermined. **It is not.** It is determined by **Representational Harm**.

  *   **The Theory:** The avatar is a **symbol**. In some contexts, it symbolizes the *Self* (social spaces). In others, it symbolizes a *Token* (combat spaces).
  *   **The Rationale:**
      *   **Sexual Touching:** This action has no ludic (game) utility. Its only function is to simulate intimacy or violation. Therefore, it is always interpreted as an act directed at the *User*, via the Avatar. It breaches the "Self" symbol.
      *   **Avatar Death:** In combat, this action has ludic utility (winning/losing). It is interpreted as an act directed at the *Token*. It does not breach the "Self" symbol because the context frames the avatar as disposable.
  *   **Why Staff Disagree:** They are arguing over whether the *action* defines the harm or the *context* defines the harm.
      *   *Team A (Action):* Touching is inherently sexual/violating.
      *   *Team B (Context):* Killing is inherently violent, so why is it okay?
  *   **The Coherent Account:** The wrong is **Contextual Misrepresentation**.
      *   Sexual touching in a combat zone is still bannable (it introduces a "Self" symbol into a "Token" space).
      *   Killing in a social zone is bannable (it introduces a "Token" mechanic into a "Self" space).
      *   *Your current rule:* You likely ban touching everywhere, but killing only in combat.
      *   *The Fix:* The rule should be: **Actions must match the Normative Frame of the Space.**
      *   *Why this works:* It explains why killing is okay in Arena A but not Plaza B. It explains why touching is not okay in Plaza B, and clarifies that it shouldn't be okay in Arena A either (unless it's a specific adult venue).

  ### V. Drafting Instructions for Your Document

  When you write the internal enforcement document, do not try to resolve the contradictions logically. Instead, codify the **Operational Hierarchy**.

  1.  **State the Ontology:** Explicitly state that for enforcement purposes, **The Ledger Is Reality.** Items are database entries, not files. This justifies the deletion of duplicates and the restoration of rollbacks.
  2.  **State the Ownership Model:** Define ownership as **Exclusive Access Privileges.** Avoid the word "property." When punishing "theft," define it as "Circumvention of Access Controls." This aligns the ban with your ToS (no hacking) rather than property law.
  3.  **State the Harm Principle:** Adopt **Contextual Integrity.** Define harm as "Violation of the Reasonable Expectations of the Space."
      *   *Social Space Expectation:* Bodily Integrity.
      *   *Combat Space Expectation:* Mechanical Conflict.
      *   *Enforcement:* Actions that violate the space's expectation are bannable, regardless of the specific animation used.
  4.  **Acknowledge the Tension:** Include a section on "Economic vs. Legal Reality." Acknowledge that while users treat items as assets, the platform treats them as services. Enforcement should prioritize **Market Stability** over strict legal consistency. (e.g., We ban thieves not because they stole property, but because theft destabilizes trust in the market).

  **Summary:** Your practice presupposes that virtual objects are **Sovereign-Backed Claims**. They are real enough to trade, but fake enough to delete. Your harm policy presupposes that avatars are **Context-Dependent Proxies**. They are bodies in the lounge, and toys in the arena. Your document should not try to prove these are logically consistent truths, but that they are **Necessary Fictions** for the platform to function.
