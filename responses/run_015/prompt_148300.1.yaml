answer: |-
  Good evening, everyone. For those who don't know me, I've had the privilege of working alongside Dr. Amara Okonkwo for the last ten years. But looking around this room, I realize most of you know her better than I do. Some of you are her family, who know her as a grandmother who checks your homework. Some of you are former clients, who know her as the person who listened when no one else would. Some of you are colleagues or students who know her as a thinker who refuses to let us off the hook.

  Usually, at a retirement party, we talk about what someone *built*. We talk about their legacy, as if it's a statue they carved out of stone and handed to us. We talk about how much they achieved as individuals.

  But if we know anything about Amara, and if we know anything about the work done in this center, we know that isn't how personhood works.

  Amara has spent her life teaching us that we are not self-contained units. We aren't islands carrying our worth inside our skulls like private property. Who we are is held in the web of relationships that recognize us. You are a mediator because someone trusts you to mediate. You are a neighbor because someone leans on you. Personhood is something we hold for each other.

  So, to talk about Amara's "individual legacy" would actually be a lie. It would betray the very thing she taught us. She didn't build this center alone. She couldn't have. This center exists because thousands of people—clients, staff, community members—agreed to recognize each other as worthy of resolution rather than conflict.

  However, there is a tension here. If we are all just a web, does individual choice matter? Did Amara matter?

  Absolutely. But not because she was a lone hero. She mattered because of the specific choices she made to tend the web. We have to talk about the times she said "no."

  There were funding offers she turned down because the strings attached would have changed who we were allowed to help. There were mediations she refused to take because the power imbalance was too dangerous to pretend it could be fixed with a conversation. There were boundaries she set that felt hard at the time.

  In a framework like ours, saying "no" isn't rejection. It's structural work. By refusing certain kinds of recognition—refusing to be bought, refusing to validate unfair dynamics—she protected the integrity of the network that holds us all. She made choices that allowed *us* to remain whole.

  And this brings me to something crucial about her retirement. It didn't start last week. It started five years ago.

  Some of you remember when Amara stepped back from direct mediation. She was sharp, she was capable, she could have kept going. But she stopped. She suspended her own authority.

  In some philosophies, you might call this withdrawal. But here, we know it as a necessary interruption. Sometimes, for a community to grow, the strongest thread has to loosen its tension so the rest of the weave can tighten. If she had kept being the primary mediator, the rest of us would have remained dependent. By interrupting her own role, by forcing us to stop looking to her for every answer, she forced the network to rewire. She made space for younger mediators to become who they needed to be.

  That wasn't retirement. That was an act of construction. She sacrificed her own centrality so that the center could hold without her.

  So, where is Amara going? She isn't going to a place where she watches over us. She is a materialist, and she knows better than that. She isn't going anywhere. She is staying right here in the habits we've learned, in the cases we settle without escalating, in the funding we refuse when it compromises our values.

  She is in the structure. She is in the way we treat each other when the doors are locked.

  Amara, you taught us that we are because we are together. But you also taught us that being together requires courage, boundaries, and sometimes, the wisdom to step aside. Thank you for holding us, even when you had to let go.

  To Dr. Amara Okonkwo.

