      *   *Audience 1 (Public Justificationists):* Care about stability, reciprocity, coercion. Will worry that "translatability" lowers the bar or allows sectarianism in disguise.
      *   *Audience 2 (Philosophers of Religion):* Care about integrity, identity, silencing. Will worry that "translation" demands assimilation or betrayal of core truths.
      *   *Audience 3 (Empiricists):* Care about real-world impact, behavior, institutions. Will ask: "So what? Does this actually change voting or coalition building?"

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Empiricist):* "Does this actually matter?" This is high likelihood because they are 1/3 of the room and often feel ignored by normative theory. High damage if the theory seems purely abstract.
      *   *Objection 2 (The Public Justificationist):* "Translation is just Accessibility 2.0." If translatability amounts to the same exclusion, what's the gain? High likelihood, high damage to the core conceptual innovation.
