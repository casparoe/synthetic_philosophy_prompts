      *(Final check on the "Natural Law" point)*: This is crucial. Many secular liberals accept Natural Law reasoning (e.g., human rights based on dignity) *as if* it were secular, but it has theological roots. If the user claims it translates easily, they might be conflating "familiar" with "translatable." This is the weak joint.

