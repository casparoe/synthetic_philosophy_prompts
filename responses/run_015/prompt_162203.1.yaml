      *   *Objection 4 (The "Hope Nobody Raises"):* "Is Natural Law actually easy to translate?" This attacks the empirical premise of the thesis. If Natural Law is just as sectarian as Divine Command, the asymmetry collapses.
      *   *Objection 5 (The Normative/Justice Angle):* "Maybe the distortion is justified?" If hard-to-translate reasons are unreasonable, maybe filtering them is good.

  4.  **Developing the Responses (Concede, Hold, Reply, Soft Spot):**
      *   *Strategy:* Be generous but firm on the core distinction (accessibility vs. translatability as a structural bias).
      *   *Concessions:* Acknowledge translation isn't perfect; acknowledge empirical data is thin.
      *   *Holds:* The structural bias exists; the current frame hides it.
      *   *Soft Spots:* Where the logic is thinnest (e.g., defining "translation," the empirical claim).

  5.  **Refining the "Weakest Joint":**
      *   The claim that Natural Law translates easily while Divine Command does not is the empirical hinge. If Natural Law relies on specific metaphysical commitments (teleology) that secular citizens reject, it's not "translatable" either. This is the biggest vulnerability.

  6.  **Refining the "Least Confidence" Line:**
      *   The reply to the Empiricist is usually the hardest for normative theorists. Claiming this *will* change behavior without data is risky.

  7.  **Review against Constraints:**
      *   90-second replies? (Need to keep them tight).
      *   Phrased in subgroup voice? (Yes).
      *   Extrapolation flags? (Need to mark where I'm guessing audience reaction).
