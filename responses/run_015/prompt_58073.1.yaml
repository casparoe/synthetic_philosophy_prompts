answer: |-
  This is a fantastic question. You've stumbled onto one of the deepest, still-unresolved debates in the philosophy of physics, and your intuition from your simulation work is actually sharper than the pop-sci blog's conclusion.

  Here is the breakdown of where the blog got it right, where it got it wrong, and why your simulation experience is actually the key to understanding the modern version of this debate.

  ### 1. The Pop-Sci Gloss: Fair or Flawed?

  **The Definitions (Mostly Fair)**
  *   **Substantivalism:** Space(time) is a substance/entity in its own right. Like a stage that exists even if the actors leave.
  *   **Relationism:** Space(time) is just a bookkeeping system for the relationships between material objects. No objects = no space.

  **Newton's Bucket (Mostly Fair)**
  *   Newton did use the bucket to argue for absolute space. If the water is stationary relative to the bucket but climbs the sides, it must be rotating relative to *something else*. Newton said: "Absolute Space."
  *   **The Wince:** A substantivalist wouldn't say this "proves" it. It's an inference to the best explanation. A relationist (like Ernst Mach later) argued the water is rotating relative to the "fixed stars" (the mass of the rest of the universe), not absolute space. So the bucket argument is a stalemate, not a proof.

  **Einstein/Relativity (The Big Lie)**
  *   **The Blog's Claim:** Einstein proved relationists right.
  *   **The Reality:** This is historically and philosophically incorrect. In fact, General Relativity (GR) arguably **revived substantivalism.**
  *   **Why?** In Special Relativity, you lose absolute time and absolute rest (a win for relationists). But in *General* Relativity, spacetime becomes a dynamic field (the metric field). It curves, it ripples (gravitational waves), and it carries energy.
  *   **The Kicker:** Gravitational waves can travel through a perfect vacuum. If space is just relations between objects, what is "waving" when there are no objects there? Substantivalists say: "The spacetime field itself." Relationists have a very hard time explaining vacuum solutions in GR.

  ### 2. The Simulation Analogy: Why Both Work

  Your observation ("I can store global coordinates or pairwise distances and both work") is essentially the **Leibniz Shift Argument**, translated into code.

  *   **Global Coordinates (Substantivalist approach):** You assign every object an $(x, y, z)$.
      *   *Philosophical cost:* If you shift every object by $+5$ on the X-axis, the state of the system changes in memory, but the physics doesn't change. This implies your data structure contains **surplus structure**. A substantivalist says that surplus structure represents real stuff (the grid itself).
  *   **Pairwise Distances (Relationist approach):** You only store the distance between Object A and Object B.
      *   *Philosophical benefit:* No surplus structure. If you shift everything, the distances don't change.
      *   *Computational cost:* This is a nightmare to calculate. To figure out acceleration, you usually need to embed those distances back into a coordinate system (a manifold) to do the calculus.

  **The Backend Dev Insight:**
  In computer science, we distinguish between the **data model** and the **implementation**.
  *   **Relationists** argue that the pairwise distances are the *true data model*, and global coordinates are just a caching optimization.
  *   **Substantivalists** argue that the global coordinates (the manifold) are the *true infrastructure*, and the objects are just data packets moving through it.

  The reason you are confused is that **the math is underdetermined.** Both formalisms yield the same predictions. Physics tells you *what* happens, but it struggles to tell you *what exists* to make it happen.

  ### 3. So, Did Einstein Settle It?

  No. In the 1980s, philosophers of physics (notably John Earman and John Norton) revived the debate using something called **The Hole Argument**, which is very relevant to your sim.

  Imagine your physics sim grid.
  1.  You have a distribution of matter and a spacetime metric (gravity) defined everywhere.
  2.  Imagine a "hole" in your grid where there is no matter.
  3.  You can mathematically "shift" the metric field inside that hole without changing anything outside it or moving the matter.
  4.  **If Substantivalism is true:** The shifted metric is a *different physical reality* (because the "stuff" of space has moved), even though all observations are identical. This breaks determinism (the future isn't fixed by the past).
  5.  **If Relationism is true:** The shifted metric is the *same physical reality* (because relations between matter haven't changed).

  Most modern physicists take a pragmatic view called **Sophisticated Substantivalism** or **Structural Realism**. They admit that spacetime has real physical properties (it's not just a relation between rocks), but they also admit that the specific "coordinates" we use are just labels (gauge freedom).

  ### 4. Summary for a Backend Dev

  | Concept | Backend Analogy | Substantivalist View | Relationist View |
  | :--- | :--- | :--- | :--- |
  | **Space/Spacetime** | The Database / Memory Heap | Real infrastructure. Exists even if empty. | Just an index of relationships between records. |
  | **Objects** | Data Records | Things stored *in* the heap. | The only things that exist. |
  | **Coordinates** | Primary Keys / Pointers | Reflect the underlying structure. | Arbitrary labels (surplus structure). |
  | **Gravitational Waves** | Background Processes | Real waves in the heap itself. | Hard to explain without matter. |
  | **Newton's Bucket** | Latency check | Proves absolute reference frame. | Proves relation to distant mass (network). |

  ### The Verdict

  1.  **The Blog:** Oversimplified. Einstein did not kill substantivalism; he transformed it from "Absolute Space" to "Dynamic Spacetime Field."
  2.  **The Simulation:** Your ability to use either method proves **Empirical Equivalence**. You cannot write a unit test that distinguishes between the two. That is why it is a *metaphysical* debate, not a *scientific* one.
  3.  **The Consensus:** Most working physicists are "shut up and calculate" substantivalists. They treat the metric field as real because it carries energy and momentum, but they don't lose sleep over the ontology.

  If you want to go deeper without the philosophy jargon, look up **"The Hole Argument"** or **"Manifold Substantivalism."** But for your sim? Stick with global coordinates. Trying to run a physics engine on pure pairwise distances is $O(N^2)$ constraint satisfaction hell, which is the best practical argument for substantivalism I know of.
