answer: |-
  Your setup is correct, and your tangle identifies the precise friction point in Berkeley's *Querist*. You are right to worry that immaterialism threatens to flatten the distinction between goods and counters—if both are just ideas, what makes one "real" wealth and the other merely "nominal"?

  The solution lies in how Berkeley distinguishes *types* of ideas. For Berkeley, "real" ideas (sensory experiences like eating corn) are distinct from "imaginary" ideas (concepts like bubble claims) because the former are forced upon us by God via the laws of nature, possessing stability and causal power. The latter depend on human will.

  Island C fails metaphysically, not just morally. The claims in C refer to goods that will never arrive; they are ideas of imagination, lacking the divine underwriting that allows corn to actually sustain life. Island A succeeds because the tokens refer to ideas of sense (wool, corn) which God's order guarantees are producible through labor. Island B fails because gold, while a real idea, lacks the causal power to sustain life without industry.

  So, which anchor stops the collapse? It requires **both**.

  The **divine-ledger** (B) secures the *reality* of the substrate. It ensures that there is a stable, orderly nature where labor yields sustenance. This stops "everything is a counter" because counters are human artifacts, while goods are divinely ordained responses to industry within nature. However, divine perception alone doesn't make unharvested corn "wealth" in Berkeley's economic sense; wealth is the *power to procure*. This requires human agency.

  **Opinion** (A) secures the *validity* of the medium. Gold and paper are both counters; their value depends on public credit and circulation. Berkeley prefers paper because it can be managed to stimulate the industry that unlocks the divine ledger. Without opinion, money doesn't move; without the divine ledger, money moves toward nothing (as in Island C).

  Berkeley's attack on gold is toothless if based solely on opinion, since gold is also coordinated opinion. But it becomes sharp when combined with the divine ledger: gold is a *bad* counter if it doesn't circulate to stimulate the industry that accesses God's provision. Paper is a *better* counter if it does. The distinction holds because Real Wealth is the power to access divinely ordained goods, while Nominal Wealth is the human ticket system. Island C cheats because it severs the ticket from the divine order entirely.

  \answer{both}
