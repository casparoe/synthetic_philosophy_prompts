answer: |-
  | Medical Model | Buddhist Soteriology | Ethical Implication |
  | :--- | :--- | :--- |
  | **Physician** | Buddha | Epistemic Authority |
  | **Disease** | *Dukkha* (Suffering) | The Problem |
  | **Health** | *Nirvana* | The *Telos* (End) |
  | **Treatment** | Eightfold Path | Instrumental Means |
  | **Recovery** | Liberation | Cessation of Means |

  The medical analogy successfully establishes **instrumentalism** (rules are tools), but fails to prove **consequentialism** (moral worth is determined solely by outcomes). Here is where the mapping breaks regarding your group's conclusion.

  **1. The Locus of Evaluation (Intention vs. Outcome)**
  This is the fatal disanalogy. In medicine, a treatment is "good" if it cures, regardless of the doctor's intent or the patient's mindset while swallowing the pill. In Buddhist ethics, *karma* is defined explicitly as intention (*cetana*). An act with wholesome intent that fails to reduce suffering is still skillful karma; an act with malicious intent that accidentally helps is unskillful. Consequentialism judges the *act* by the *outcome*. Buddhism judges the *karma* by the *volition*. The medical analogy predicts outcome-based evaluation; the texts mandate intention-based evaluation. This alone blocks the "consequentialist all the way down" conclusion.

  **2. The Scope of Concern (Agent-Relative vs. Neutral)**
  The bedside frame is inherently agent-relative: *this* doctor cures *this* patient. Classical consequentialism is agent-neutral: my act counts only insofar as it reduces suffering *anywhere*. The medical analogy supports soteriological egoism (end *my* suffering), not utilitarianism. To make it a "public health" model (Mahayana), you must import *bodhicitta* externally; the simile itself doesn't generate agent-neutrality. If your group argues for Theravada ethics, the analogy yields egoism, not consequentialism.

  **3. The Nature of the Endpoint (Your Point 1)**
  Health is a return to natural functioning, recognizable pre-theoretically. Nirvana is unconditioned and often unintelligible without the path. In medicine, the goal exists independently of the cure. In Buddhism, the path *constitutes* the goal. You cannot calculate acts against a utility function of "Nirvana" from the outside, because the utility function is only visible from within the practice. This undermines the consequentialist requirement for an independently specifiable metric of good.

  **4. Paternalism (Your Point 3)**
  The "patient doesn't know he's sick" motif justifies authority, not moral calculus. "Skillful means" (like the burning house parable) licenses deception by an omniscient agent, but it does not provide a calculable rule for lay practitioners. It supports a virtue-ethical or authority-based model, not a systematic maximization procedure.

  **Decorative vs. Crucial Disanalogies**
  *   **Decoration:** The timeline of cure varies; doctors wear whites, monks wear robes. These do not affect the ethical classification.
  *   **Crucial:** The locus of moral evaluation (intention vs. outcome) and the scope of concern (self vs. all). These directly block the consequentialist label.

  **A Better Analogy**
  If you need an instrumental model that preserves the primacy of intention, use **Archery**. The bow and arrow are tools (instrumental); hitting the target is the goal. However, a lucky shot caused by a gust of wind is not "skillful," and a perfect form that misses due to wind is still "good archery." The focus remains on the agent's mental state and technique, not merely the external outcome. This captures the Raft Parable (drop the bow when done) without surrendering the intention-based ethics of karma.

  The medical analogy proves Buddhist ethics is instrumental regarding rules, but the intention/outcome mismatch prevents it from being consequentialist regarding moral worth.

