answer: |-
  Erin swirled the ice in her glass, looking gloomy. "It's just hard to accept, y'know? Only now exists. The past is literally nothing."

  Dave, nursing a stout, shook his head. "But you act like you traveled through a continuum to get here. Uncountably many instants."

  "Right," Erin said. "A dense line. Gone now, but it was real."

  "Thats where Skolem gets you," Dave said.

  "Skolem? The logic guy?"

  "Yeah. Look, suppose your life is a first-order model. Inside that model, you can prove there's no bijection between your past moments and the naturals. So you say 'uncountable'."

  "Because I cant list them," Erin said.

  "Exactly. But the model itself might be countable from the outside. There's a function in the metatheory that maps every moment you lived to an integer. You just dont have access to it inside the model."

  Erin frowned. "So my past is countable?"

  "From in here? Sure feels uncountable. From out there? I could enumerate your whole existence before this beer gets warm."

  Dave leaned back, smiling. "Uncountability is model-relative, Erin. You're not mourning the loss of a continuum. You're just countable from my perspective."
