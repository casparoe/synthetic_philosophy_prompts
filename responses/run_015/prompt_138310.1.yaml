      *   *Intersectionality:* Demanded by legal (every subgroup).
      *   *Impossibility:* Kleinberg/Chouldechova say Calibration + Equalized Odds is impossible (unless base rates equal).
      *   *Intersectionality:* As subgroups get smaller, base rates diverge more, making parity harder. Satisfying all implies ignoring predictive features or randomizing.
      *   *Decision:* The math says "Pick one." It does not say "Pick Calibration." The board must make a normative choice.

  6.  **Address the Randomization Question:**
      *   *Idea:* If scoring is impossible to make fair, just randomize among eligible.
      *   *Analysis:* Randomization satisfies some parity constraints (statistically) but ignores risk (utility). It might be *more* unfair if high-risk people get denied while low-risk get help.
      *   *Theorems:* They don't mandate randomization. They mandate trade-offs. Randomization is a policy choice to prioritize equality of opportunity over utility/maximization of prevention.

  7.  **Address Math vs. Ethics:**
      *   *Math:* Describes constraints on consistent systems.
