answer: |-
  Your intuition that the housing authority context diverges significantly from the standard recidivism literature is well-founded, and these differences fundamentally alter how the impossibility theorems apply to your decision-making process. The core mathematical results you reference, primarily those by Kleinberg, Mullainathan, and Raghavan as well as Chouldechova, establish that in a predictive setting, you cannot simultaneously satisfy calibration within groups and equalized error rates across groups unless the base rates of the outcome are identical across those groups or the predictor is perfect. In your setting, this means the demand from your board for individually calibrated probabilities that justify specific decisions is mathematically incompatible with the demand from your community advisory group for equal rates of being missed across racial groups, assuming the underlying risk of housing loss varies by group. The theorems do not, however, settle which of these criteria you ought to sacrifice. They function as a feasibility check rather than a normative guide, confirming that a system satisfying all your stakeholders' technical requirements does not exist, but remaining silent on whether it is more ethical to prioritize individual justification or group parity. This forces the board to make an explicit value judgment about which form of unfairness is more tolerable, rather than allowing the mathematics to dictate the policy.

  The first feature you identified, the selective label problem, deepens the impossibility challenge by corrupting the very definition of the ground truth upon which these theorems rely. The standard impossibility results assume that the outcome variable is observed without bias, but in your case, the label of housing loss is only observed for tenants whose cases reached court or who were successfully contacted by outreach. This introduces a layer of selection bias that means the base rates you calculate from historical data are not the true base rates of housing instability, but rather the base rates of housing instability among those who were processed by the system. If prior enforcement patterns or outreach capabilities differed by race or neighborhood, your training data encodes those disparities. Consequently, attempting to satisfy calibration on this observed data may result in miscalibration regarding the true risk of housing loss, and attempting to satisfy group parity on observed errors may exacerbate disparities in actual outcomes. The mathematics of the impossibility theorems generally assumes the labels are fixed and known, so when the labels themselves are a product of prior decisions, the constraints become even tighter and the metrics less auditable. You cannot verify if a score is truly calibrated to the risk of losing housing, only if it is calibrated to the risk of losing housing given that you were taken to court, which is a fundamentally different quantity.

  The second feature, the allocation of a capped good via ranking, shifts the problem from pure prediction to causal intervention and further destabilizes the applicability of standard fairness metrics. In the COMPAS context, the prediction does not change the outcome, but in your setting, the assistance prevents the eviction. This means the outcome is counterfactual for those who receive aid; you will never know if they would have lost their housing absent the intervention. This makes post-hoc auditing of error rates impossible because you cannot observe the false positives among those who were helped. Furthermore, because the assistance is allocated off a ranking until funds run out, the threshold for receiving aid is not fixed but moves based on the pool of applicants and the uptake rate. A risk score of 0.8 might guarantee assistance in one month but fail to qualify in another. This volatility undermines the stability required for calibration, as the meaning of a score drifts over time. The impossibility theorems assume a fixed decision threshold, so the moving cutoff in your ranking system means that even if you achieved calibration and parity at the time of model training, those properties will not hold at the time of allocation. This suggests that the standard fairness criteria are not just mutually exclusive in your setting, but potentially ill-defined, as the intervention itself changes the distribution of outcomes the model was trained to predict.

  Regarding the pressure from legal counsel to guarantee parity across every intersectional subgroup, the mathematics offers a stark warning about the combinatorial explosion of constraints. Satisfying parity constraints for a large family of subgroups is compatible with substantial aggregate disparity, and as you slice the population into finer intersectional categories, the sample sizes shrink and the base rate differences become more pronounced. The impossibility results imply that satisfying parity for all possible subgroups essentially requires the model to ignore predictive features or to randomize decisions, as any reliance on correlated features will inevitably create disparities in some subgroup definition. This does not mean you must abandon risk scoring, but it does mean that a guarantee of perfect subgroup parity is likely mathematically unattainable without rendering the scoring system useless for targeting scarce resources. The theorems suggest that if you prioritize intersectional parity, you must accept a significant loss in utility, meaning fewer evictions prevented overall, because you are constraining the optimization problem to the point of triviality.

  This leads to the question of whether these results justify abandoning risk scoring in favor of randomization within a broad eligible tier. The impossibility theorems do not mandate randomization, but they do highlight that randomization is one of the few mechanisms that can satisfy certain parity constraints without relying on biased historical labels. However, interpreting the theorems as a command to randomize would be a misreading. Randomization sacrifices the goal of maximizing the impact of scarce funds by decoupling assistance from risk. If the ethical priority is to prevent the most evictions, a risk score is superior despite its fairness trade-offs. If the ethical priority is to ensure equal procedural opportunity regardless of risk, randomization is superior. The mathematics simply clarifies that you cannot have both high utility and perfect fairness parity. Therefore, the decision to randomize should not be viewed as a technical fix to a mathematical impossibility, but as a policy pivot that prioritizes equality of opportunity over efficiency. The theorems give you a reason to be honest about this trade-off, not a reason to believe randomization is the only valid solution.

  Ultimately, there is a significant domain where the mathematics is silent, and it is crucial for the board not to mistake a formal result for an ethical one. The impossibility theorems describe the geometry of consistent statistical systems, but they do not contain a variable for justice, need, or historical rectification. They can tell you that you cannot have calibration and equalized odds simultaneously, but they cannot tell you whether it is worse to tell a tenant their risk was miscalculated or to tell a community that their members were disproportionately denied aid. The selective label problem and the causal nature of your intervention further widen this gap, as the math cannot correct for the unobserved counterfactuals of who would have lost housing without help. Your board must therefore treat the risk score not as an objective arbiter of truth, but as a tool that embeds specific ethical choices about which errors to tolerate. The value of the impossibility results lies in their ability to prevent you from promising stakeholders that you can achieve mutually exclusive goals, thereby forcing a transparent democratic deliberation about which constraints to relax. You are not choosing a model that satisfies the math; you are choosing a set of ethical priorities that the math will then constrain.
