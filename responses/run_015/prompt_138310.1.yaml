          3.  *Conflicting Demands:* Individual justification (calibration) vs. Community Advisory (group parity across race) vs. Legal Counsel (intersectional subgroup parity).
      *   **Task:** Explain implications of impossibility results (Kleinberg, Chouldechova, etc.) in this specific context.
      *   **Key Questions to Address:**
          *   What do the results settle vs. not settle regarding criterion choice?
