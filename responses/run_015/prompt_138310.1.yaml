          *   Where is the math silent vs. ethical?
      *   **Format:** Continuous prose only. No headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Impossibility Theorems:**
      *   *Core Result:* You cannot simultaneously satisfy Calibration (probability matches outcome frequency) and Equalized Odds (equal TPR/FPR across groups) unless base rates are equal or the classifier is perfect/trivial.
      *   *Implication:* Trade-offs are inevitable. The math doesn't tell you *which* trade-off to make, only that you can't have it all.
      *   *Subgroup Fairness:* Satisfying parity for all possible intersectional subgroups is often impossible without trivializing the model or ignoring the constraints.

  3.  **Address Feature 1: Selective Labels (Censoring/Selection Bias):**
      *   *Standard Assumption:* Impossibility theorems assume ground truth labels are available and unbiased.
      *   *Reality:* Here, labels are "lost housing absent help," but we only see "lost housing" for those who went to court or were contacted.
      *   *Implication:* The "ground truth" is corrupted. If the training data reflects biased enforcement (e.g., certain neighborhoods policed more), the risk score learns that bias.
      *   *Effect on Impossibility:* It deepens the problem. If the base rates in the *observed* data differ from the *true* base rates due to selection bias, satisfying calibration on observed data might mean miscalibration on reality. Satisfying group parity on observed data might exacerbate disparities in reality. The mathematical definitions of error rates become ambiguous because the denominator (who was at risk) is unknown.

  4.  **Address Feature 2: Ranking with Capped Resources (Moving Cutoff/Interference):**
      *   *Standard Assumption:* Binary classification (assist/don't assist) with fixed thresholds.
      *   *Reality:* Ranking list. Cutoff moves based on budget and uptake. Intervention changes outcome (causal effect).
      *   *Implication:* This is a *causal* problem, not just predictive. The score predicts risk, but assistance mitigates risk.
      *   *Effect on Impossibility:* The standard fairness metrics (TPR, FPR, Calibration) assume static outcomes. Here, the outcome depends on the decision. If you help someone, they don't lose housing. So you can't observe the counterfactual (would they have lost it without help?). This makes auditing fairness metrics nearly impossible post-hoc. The "moving cutoff" means a score of 0.8 means something different in January vs. June. This undermines the stability required for calibration.

  5.  **Address Feature 3: Conflicting Demands (Calibration vs. Group Parity vs. Intersectionality):**
      *   *Calibration:* Needed for individual justification ("Your score means 80% risk").
