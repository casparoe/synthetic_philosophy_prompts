answer: |-
  **Project Title:** Causal Competition and Contrastive Relata: Dissolving the Exclusion Argument without Eliminating the Mental

  **1. The Research Question**
  Jaegwon Kim's Causal Exclusion Argument remains the central obstacle for non-reductive physicalism. The argument turns on the premise that if a physical event $P$ is sufficient for an effect $E$, and a mental event $M$ supervenes on $P$, then $M$ and $P$ are competitors for the status of being *the* cause of $E$. Since systematic overdetermination is implausible, $M$ is excluded.

  This project investigates whether the Exclusion Argument relies on an implicit, binary conception of causation (cause $c$ brings about effect $e$) that obscures the distinct explanatory roles of mental and physical properties. Specifically, I will argue that adopting a **contrastive theory of causation**—where causal claims are quaternary relations ($c$ rather than $c^*$ causes $e$ rather than $e^*$)—dissolves the competition premise.

  The core research question is: **Does a contrastive semantics for causal claims allow mental and physical realizers to be co-causes of the same effect token without constituting problematic overdetermination, thereby preserving non-reductive physicalism against Kim's Exclusion Argument?**

  **2. Motivation and Existing Literature**
  The standard motivation for this approach is the intuition that mental and physical explanations seem to answer different questions. My desire to wave explains why my arm went *up rather than down*; my neural state explains why this specific muscle contraction occurred *rather than that one*. If causation is relative to these contrasts, $M$ and $P$ are not vying for the same causal slot.

  However, several existing positions threaten to render this project redundant or trivial:

  *   **Determinate/Determinable Accounts (e.g., Yablo):** This view argues mental properties are determinables of physical determinates. Causation requires proportionality; the mental is proportional to the macro-effect, the physical to the micro-effect.
      *   *Why this doesn't settle it:* This relies on a specific metaphysics of properties (determination relations). A contrastive account is semantic/structural; it can work even if one rejects the determinable/determinate model. I must show that contrastivism does the work without committing to Yablo's specific ontology.
  *   **Interventionist/Variable-Based Approaches (e.g., Woodward, List & Menzies):** These argue that mental variables remain invariant under interventions that change physical realizers.
      *   *Why this doesn't settle it:* Interventionism often implicitly relies on contrasts (setting variable $M$ to $m_1$ vs $m_2$). However, interventionists often retain a binary notion of the *effect* variable. A rigorous contrastive account treats the *effect relatum* as contrastive too. I need to demonstrate that making the effect contrastive (not just the cause variable) is necessary to fully dissolve the exclusion worry, specifically regarding the "same effect" premise.
  *   **Causal Closure Objections:** Critics argue that if $M$ causes $E$, and $P$ causes $E$, we still have two causes for every physical event, violating the spirit of Closure.
      *   *The Gap:* Existing contrastive replies often fail to address whether this violates the *completeness* of physics. My project must address whether contrastive causation allows us to retain a robust principle of Physical Causal Closure while validating mental causation.

  **3. Methodology and Chapter Outline**
  This is a conceptual analysis project. I will not be proposing new empirical data but rather testing the logical coherence of the Exclusion Argument under a specific semantic framework for causation. The paper will be approximately 40 pages, structured as follows:

  **Introduction (approx. 5 pages)**
  *   State the Exclusion Argument formally.
  *   Identify the "Competition Premise" as the target.
  *   Introduce the contrastive framework (causation as a relation between events under descriptions/contrasts).
  *   Roadmap.

  **Chapter 1: The Equivocation of "The Cause" (approx. 10 pages)**
  *   Analyze the Exclusion Argument's assumption that $M$ and $P$ compete for the *same* causal relation.
  *   Demonstrate how binary causation forces this competition.
  *   Apply the contrastive model: Show how $M$ answers "Why $E$ rather than $E_{alt}$?" while $P$ answers "Why $E$ (realized this way) rather than $E$ (realized that way)?"
  *   *Key Task:* Formalize the contrast classes for a standard case (e.g., arm raising) to show they are non-identical. If the causal facts are different, there is no overdetermination.

  **Chapter 2: Objections from Proportionality and Closure (approx. 15 pages)**
  *   **The Proportionality Objection:** If the physical cause is too specific (micro-contrast), does it fail to cause the macro-effect? I will argue that under contrastivism, the physical causes the macro-effect *under a micro-description*. This avoids the charge that the physical is "too detailed" to cause the mental effect.
  *   **The Closure Objection:** This is the biggest risk. If physics is causally closed, every physical effect has a sufficient physical cause. If $M$ also causes it, isn't physics incomplete or $M$ redundant?
      *   *Argument:* I will argue that Closure should be formulated contrastively: Every physical effect *under a physical contrast* has a sufficient physical cause. Mental causation operates under *mental contrasts*. Thus, Closure is preserved without excluding the mental.
      *   *Risk Check:* I must honestly assess if this redefinition of Closure is ad hoc or a genuine clarification.

  **Chapter 3: Contrastivism vs. Interventionism (approx. 5 pages)**
  *   Briefly distinguish this project from standard Interventionist replies.
  *   Argue that Interventionism often smuggles in contrastivism but fails to apply it to the *effect* relatum.
  *   Show why applying contrastivism to the effect is crucial for blocking Exclusion (otherwise, $M$ and $P$ still converge on the same binary effect node).

  **Conclusion (approx. 5 pages)**
  *   Summarize the positive result: Exclusion relies on binary causation.
  *   Discuss implications for non-reductive physicalism.
  *   Acknowledge limitations (e.g., does this work for non-intentional mental states?).

  **4. Risk Assessment: Where the Project Might Collapse**
  I need to be candid with the committee about the specific points of failure for this argument.

  *   **Risk 1: Collapsing into Yablo.** If the "contrasts" I select are determined solely by the determinable/determinate relationship of the properties, then I am not offering a semantic solution but a metaphysical one.
      *   *Mitigation:* I will argue that contrasts are context-dependent and pragmatic, not fixed by metaphysics. The neural state *could* answer the macro contrast in a different context (e.g., a neurosurgeon's context). This pragmatism distinguishes it from Yablo.
  *   **Risk 2: The "Same Effect" Problem.** Kim argues $M$ and $P$ cause the *same token event*. If I say they cause different *contrastive facts*, have I simply changed the subject? If the event token is identical, and both are sufficient for it, isn't it still overdetermined regardless of the description?
      *   *Mitigation:* I must defend the view that causal *relata* are not naked events but events-under-contrasts. If the relata are different, the causal relations are different. If this defense fails, the project collapses into epiphenomenalism (only $P$ causes the token; $M$ only causes the description).
  *   **Risk 3: Cost of Contrastivism.** If contrastivism is too costly (e.g., it breaks transitivity of causation or makes causation too subjective), saving mental causation this way is a Pyrrhic victory.
      *   *Mitigation:* I will limit the scope. I do not need to defend contrastivism as the *only* true theory of causation, only that it is a *coherent* theory under which Exclusion fails. If the cost is low enough to be plausible, the exclusion argument loses its decisive force.

  **5. Conditions for Success and Failure**

  *   **Positive Result (Success):** I successfully demonstrate that the Exclusion Argument is equivocal. It appears valid only if one slides between binary and contrastive causal claims. I provide a formulation of Physical Causal Closure compatible with contrastive mental causation, showing that non-reductive physicalism is logically consistent without requiring identity theory or brute overdetermination.
  *   **Negative Result (Failure):**
      1.  I find that to make the contrasts distinct enough to avoid competition, I must render the mental cause irrelevant to the *physical* outcome (collapsing into epiphenomenalism).
      2.  I find that the contrastive account requires abandoning Causal Closure in a way that undermines physicalism entirely.
      3.  I find that the distinction between the mental contrast and the physical contrast cannot be maintained without relying on the determinable/determinate metaphysics I hoped to avoid (collapsing into Yablo).

  **6. Feasibility**
  The literature on Kim's Exclusion Argument and Contrastive Causation is extensive but largely parallel. There is no definitive monograph synthesizing the two specifically for a qualifying paper scope. The 40-page limit is tight, so I will focus exclusively on the **Competition Premise** and the **Closure Objection**. I will not attempt to solve the hard problem of consciousness or defend a specific theory of mental content. The reliance on conceptual analysis rather than technical formalism makes this achievable within the one-year timeline.

  **7. Conclusion**
  This project offers a way to save non-reductive physicalism not by weakening physics (rejecting closure) or strengthening metaphysics (identity theory), but by refining our logic of causal claims. If successful, it shows that the "problem" of mental causation is partly a linguistic artifact of binary causal grammar. If it fails, it clarifies exactly why physicalism requires a more robust metaphysical identity between mind and body than non-reductive views typically allow. Either outcome constitutes a substantive contribution to the debate.
