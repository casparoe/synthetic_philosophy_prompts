answer: |-
  1. Your position conflates Jaspers' category of political liability with moral culpability, whereas he explicitly reserves moral guilt for individual conscience and action.
  2. Jaspers designates political guilt as the only form borne collectively by citizens for the deeds of their state, requiring reparations rather than personal penance.
  3. Moral guilt cannot be inherited because it demands personal agency and conscious choice, which descendants lacking temporal proximity to the crime cannot exercise.
  4. Nevertheless, one might defend intergenerational acknowledgment as a form of metaphysical solidarity or political duty to ensure non-repetition and maintain communal integrity.
  5. Successor generations should therefore assume political responsibility for restitution and remembrance without falsely internalizing a moral sin they did not personally commit.
