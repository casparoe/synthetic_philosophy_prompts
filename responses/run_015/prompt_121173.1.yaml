  2.  **Analyze Jaspers' *The Question of German Guilt* (1947):**
      *   **Criminal Guilt:** Violation of laws, judged by courts. Individual only.
      *   **Political Guilt:** Liability for the actions of the state/citizenship. Collective (all citizens bear responsibility for the state's actions), but leads to reparations/liability, not moral sin.
      *   **Moral Guilt:** Personal actions and choices. Judged by conscience/peers. Individual only. Requires personal agency.
      *   **Metaphysical Guilt:** Solidarity among humans as such; co-responsibility for every wrong committed in one's presence. Individual relation to God/transcendence.
      *   **Key Distinction:** Jaspers explicitly argues against collective *moral* guilt. Moral guilt requires individual agency and conscience. Political guilt is the one that applies collectively to citizens.

  3.  **Drafting the Points (Iterative Process):**

      *   *Point 1 (Identify confusion):* Your claim conflates Jaspers' category of political liability with moral culpability, whereas he explicitly reserves moral guilt for individual conscience and action.
      *   *Point 2 (Clarify collective guilt):* Jaspers designates political guilt as the only form borne collectively by citizens for the deeds of their state, requiring reparations rather than personal penance.
      *   *Point 3 (Why moral guilt resists inheritance):* Moral guilt cannot be inherited because it demands personal agency and conscious choice, which descendants lacking temporal proximity to the crime cannot exercise.
      *   *Point 4 (Defense of acknowledgment):* One might defend intergenerational acknowledgment not as inherited guilt, but as a metaphysical solidarity or political duty to ensure non-repetition and maintain communal integrity.
      *   *Point 5 (Practical upshot):* Successor generations should therefore assume political responsibility for restitution and remembrance without falsely internalizing a moral sin they did not personally commit.

