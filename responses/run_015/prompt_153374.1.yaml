answer: |-
  Alice, a strict Bayesian, finds her colleague Bob hesitating to open an email containing his annual performance review.

  "Open it," Alice urges. "Good's Theorem guarantees that for a rational agent with free choice of action, the expected value of information is non-negative. You're never worse off in expectation for knowing."

  "But if I'm fired," Bob says, "I'll have to start looking for a new job."

  "No you won't," Alice corrects. "The theorem proves information never forces an action. You retain the option to do nothing, exactly as you would have done blind."

  Bob shakes his head. "But if I know I'm fired, 'doing nothing' is negligence. If I don't know, it's just peace of mind."

  Alice pauses. "So your utility function depends on your belief state, not just the outcome."

  "Exactly," says Bob. "Your theorem says information never removes an option. It doesn't say it won't make the one I prefer unbearable."
