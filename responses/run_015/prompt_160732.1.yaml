  i'm at about 0.4 on P. a colleague of mine is at about 0.8 and i cant locate where we actually differ. give me your own number, decomposed. here are the sub-questions i'd want split out, but replace or add any you think carry more of the weight:

  - how often is genuine unilateralism actually available at all (one actor, global outcome, no veto)?
  - are the private error terms anywhere near independent, or are they correlated because everyone reads the same evidence and shares a prior? how much does correlation kill the aggregation argument?
  - is the downside tail actually heavy / is catastrophe-badness effectively lexicographic, or just large-but-finite so that the upside can compete?
  - how much of the result's force comes from irreversibility rather than from unilateralism? if you can stop and learn, doesn't the option-value argument flip the recommendation toward experimenting?
  - does unilateral restraint by the cautious actors just select for the least cautious one, so that the individual recommendation and the collective recommendation come apart?
  - is the number of potential unilateral actors growing? if it is, doesn't the remedy shift from restrain yourself to shrink N institutionally, which is a different action entirely?
