answer: |-
  ### I. Mapping Gibbard-Satterthwaite onto the 2013 Election

  The Gibbard-Satterthwaite (G-S) theorem states that for any social choice function (SCF) selecting among three or more alternatives, if the function is non-dictatorial and surjective (any alternative can win), it is necessarily manipulable. To apply this to the 2013 IOC election, we must define the SCF, the domain of preferences, and the strategic opportunities inherent in the exhaustive ballot.

  **The Social Choice Function and Domain**
  The IOC procedure is a single SCF mapping the preference profiles of approximately 95 voting members (excluding the three bidding nations) to a single winner in the set $A = \{\text{Tokyo, Madrid, Istanbul}\}$. Since any of the three cities could theoretically have secured an absolute majority and won, the range of the function is the full set $A$. The process is non-dictatorial; no single member determines the outcome. Therefore, per G-S, the procedure is theoretically vulnerable to strategic manipulation.

  **Preference Orderings and Blocs**
  While individual ballots are secret, we can reconstruct plausible preference orderings based on the geopolitical context of 2013:
  *   **The Tokyo Bloc:** Likely viewed Tokyo as the "safe" choice (economic stability, prior host). Their preference was likely $T \succ I \succ M$ or $T \succ M \succ I$.
  *   **The European Bloc:** Members favoring Madrid (Eurozone solidarity) likely ranked $M \succ I \succ T$ or $M \succ T \succ I$. However, the 2008 austerity crisis weakened Madrid's appeal as a sincere first choice for some Europeans, potentially shifting them to $I \succ M \succ T$ (preferring a non-European challenger over a financially unstable European one) or $T \succ M \succ I$.
  *   **The Gezi/Instability Factor:** Istanbul's 2013 context included political protests. Some members may have sincerely preferred Madrid over Istanbul but feared Istanbul's instability, creating an ordering $M \succ T \succ I$.

  **Strategic Options and Manipulation**
  The G-S theorem implies that at least one voter could have achieved a better outcome by misrepresenting their preferences. In the 2013 episode, the critical vulnerability was Round 1.
  *   **The Tie Scenario:** With Madrid and Istanbul tied at 26 votes, the margin for manipulation was razor-thin. A voter who sincerely preferred Madrid but feared Madrid would lose the subsequent tie-break runoff (which it did, 45-49) might have strategically voted for Istanbul in Round 1 to avoid the tie, if they believed Istanbul had a stronger path to the final or if they simply wanted to resolve the uncertainty.
  *   **Tokyo's Strategic Voters:** A Tokyo supporter who preferred Istanbul over Madrid as a final opponent (perhaps believing Istanbul would be easier to defeat in Round 2, or for regional balance) had an incentive to vote for Istanbul in Round 1 to ensure Madrid's elimination. Conversely, if they feared Istanbul more, they would vote Madrid.
  *   **The Runoff Manipulation:** The tie-break runoff (45 to 49) was effectively a binary choice between Madrid and Istanbul. Here, the range *was* restricted to two. However, the *outcome* of this binary vote determined the set for Round 2. A Tokyo supporter voting in the tie-break was not choosing the Olympic host directly, but choosing the *opponent* for Tokyo. If a Tokyo supporter preferred facing Istanbul over Madrid, they would vote to eliminate Madrid in the tie-break. This is "sophisticated voting"—voting not for the preferred alternative, but for the preferred path to the preferred alternative.

  ### II. The Strain on Theoretical Framing: Sequentiality and Range Restriction

  The IOC might argue that its procedure evades the G-S impossibility because it decomposes the choice into binary decisions. Round 2 is a choice between two; the tie-break is a choice between two. Does this sequential architecture satisfy the G-S escape clause (range restricted to $\le 2$ alternatives)?

  **The Illusion of Local Restriction**
  Theoretically, the escape clause does not apply because the G-S theorem evaluates the *entire* social choice function, not its sub-routines. The IOC SCF takes preferences over $\{T, M, I\}$ and outputs a winner in $\{T, M, I\}$. The fact that it uses intermediate binary steps does not restrict the *global* range. Consequently, the strategic environment in Round 1 remains ternary. Voters in Round 1 are not merely selecting a favorite; they are selecting a *pair* for Round 2. This preserves the three-alternative strategic complexity across rounds.

  **Displacement of Manipulation**
  The procedural architecture does not eliminate manipulation; it displaces it from "vote counting" to "agenda setting."
  1.  **Anticipatory Voting in Round 1:** Because voters know elimination is permanent, Round 1 becomes a vote on electability rather than pure preference. A Madrid supporter might vote Istanbul in Round 1 if they believe Istanbul has more second-choice support from Tokyo voters, hoping to eliminate Madrid early to consolidate the anti-Tokyo vote in a future cycle (though impossible here due to single-elimination). More realistically, Tokyo voters manipulate Round 1 to engineer a favorable Round 2 opponent.
  2.  **The Tie-Break as a Strategic Node:** The 26-26 tie created a specific sub-game. The runoff to determine elimination (45-49) introduced a new layer of strategy. Voters who had voted for Tokyo in Round 1 were suddenly empowered to decide the fate of Madrid vs. Istanbul. This is a violation of "independence of irrelevant alternatives" (IIA). The relative ranking of Madrid and Istanbul should not depend on Tokyo's presence, yet Tokyo's dominance in Round 1 (42 votes) meant Tokyo voters became the kingmakers in the Madrid-Istanbul tie-break.
  3.  **Range Preservation:** The multi-round structure preserves a three-alternative strategic environment because the *value* of a vote in Round 1 depends on the probabilistic outcome of Round 2. A voter cannot treat Round 1 as a binary choice (My City vs. Others); they must treat it as a ternary choice (My City vs. Opponent A vs. Opponent B) because the identity of Opponent B matters.

  Therefore, the procedural complexity does not trigger the G-S escape clause. It merely obscures the manipulation by breaking the decision into temporal stages, making it harder for observers to detect that a voter's Round 1 ballot was a strategic calculation regarding Round 2 rather than a sincere expression of preference.

  ### III. Practical Force for Institutional Design

  The 2013 episode offers a stark validation of the Gibbard-Satterthwaite theorem's pessimistic conclusion regarding institutional design.

  **Strategy-Proofness is Unachievable**
  The IOC case confirms that strategy-proofness is not an achievable criterion for real-world collective choice bodies when selecting among three or more candidates. No matter how many rounds are added, or how tie-breaks are structured, the initial existence of three viable alternatives ensures that the system remains manipulable. The IOC cannot design a voting rule that forces members to vote sincerely; the incentives to vote strategically are baked into the mathematics of the choice set.

  **Complexity as Obscurement, Not Immunization**
  The exhaustive ballot with tie-breaking runoffs functions less as an immunization against manipulation and more as a mechanism to obscure it.
  *   **Legitimacy through Process:** The multi-round system creates a narrative of "consensus building." By requiring an absolute majority, the IOC ensures the winner has broad support, but the cost is increased vulnerability to tactical voting in early rounds.
  *   **Plausible Deniability:** The secret ballot combined with complex elimination rules allows voters to deny manipulation. A member who voted for Istanbul in Round 1 to eliminate Madrid can claim sincere support for Istanbul. The complexity of the runoff rules makes it computationally difficult for the public to verify if the outcome was the result of sincere preferences or strategic coalitions.
  *   **Managing Political Fallout:** The tie-break runoff (45-49) allowed the IOC to frame Madrid's elimination as a "close decision" rather than a mathematical certainty. This procedural nuance softens the blow of elimination, preserving diplomatic relations with the losing National Olympic Committees.

  **Conclusion: Inevitability vs. Containment**
  This episode should be read as confirming that manipulation is inevitable. The G-S theorem explains *why* the Round 1 vote was unstable (the 26-26 tie is a hallmark of strategic equilibrium where voters are indifferent or manipulating). However, the theorem is silent on the *political utility* of that manipulation.

  The IOC's design does not genuinely contain manipulation through range restriction because the global range remains three. Instead, the institution accepts manipulability as a trade-off for legitimacy. The "well-structured" nature of the rounds does not make the choice strategy-proof; it makes the strategy *expensive* to calculate and *hard* to prove. In institutional design terms, the G-S result implies that designers should stop seeking strategy-proofness in ternary choices and instead focus on transparency and the robustness of the outcome against coalitional shifts. The 2013 election shows that while you cannot prevent voters from playing the system, you can design the system so that the winner (Tokyo) emerges with a mandate (60 votes) that renders the earlier strategic maneuvering politically irrelevant. The theorem holds mathematically, but the institution survives politically.
