      *   *Re-evaluating the Empty Branch:* The prompt asks me to diagnose the combo: Bengal Entitlement + GLF Weather.
      *   Why is this weird? Because Bengal (1943) was under British War policy (politics). GLF was under Mao (politics). If you say Bengal was distribution (politics) but GLF was weather (nature), you are inconsistent about the role of authoritarian/colonial state management in food crises.

      *   *Re-evaluating Indistinguishable Pairs:* "Extractive-State Crime" vs "Informational-Cascade" for GLF. Both result in state-induced starvation. The distinction is intent vs. incompetence. The tree might not separate them well if the outcome is the same.

  9.  **Finalizing the Output Structure:**
      *   Introduction (Setting the map).
