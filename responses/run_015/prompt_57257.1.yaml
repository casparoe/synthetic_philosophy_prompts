prompt: |-
  I teach a graduate seminar on weakness of will and a colleague of mine over in the behavioral economics group keeps reaching for the same picture, and I want to know how much weight it can bare before I let it anywhere near my syllabus. The picture: a person with a self-control problem is like a household containing two members — a far-sighted planner who has the household's real long-run interests at heart and an impulsive doer who keeps spending the money the planner had set aside. Saving apps, hiding the credit card in a drawer, Odysseus lashed to the mast — all of these are just the planner tying the doer down. That part is descriptive. The problem is the work he makes it do. Because the planner's ends are supposedly the person's own true ends, outside help — an auto-enrollment default, a sin tax, a nudge — isn't overriding the person's will at all, it's enforcing it, so the autonomy objection just evaporates, and the doer's complaints are like the complaints of a kid who's been made to do his homework. He also says hyperbolic discounting is the mathematical version of the same story: the very shape of the discount function shows there are two agents pulling in seperate directions, and later regret is the planner saying I-told-you-so, which is why the planner's ranking gets to be the metric of welfare rather than the doer's.

  So give me the correspondence table — what plays the planner, the doer, the shared household, the budget, the tying-down, the helpful outsider — and then the audit. Which features of the household carry over and which don't, and among the ones that don't, which actually threaten his argument versus which are just cosmetic? Three things I especially want pinned down: (a) whether anything in the formal treatment of hyperbolic or quasi-hyperbolic discounting implies two agents rather than a single agent whose preference ordering shifts with the temporal perspective she happens to be taking up at the moment of choice; (b) what the analogy quietly imports about there being a true self whose preferences get to count — my suspicion is that it hands him a solved problem about aggregation and about whose preference is authoritative that the model itself never argues for, and I'd like to see exactly where the smuggling happens; and (c) whether the paternalism conclusion survives once you notice that the doer is the one who is literally present at the moment of choice while the planner is, at best, a set of dispositions laid down earlier. I should also say the analogy seems to get something right that a plain single-agent model struggles with — the phenomenology of inner conflict, and why commitment can feel like an exercise of agency rather than a restriction on it — so don't just pile up disanalogies, tell me which of them are load-bearing.

  And if you think there's a better source domain for time-inconsistent agency — a repeated game among successive selves, a thermostat, a parliament with an upper house, a principal-agent contract with hidden action, whatever you'd nominate — say which one and how far it carries before it starts begging the same questions. No bibliography needed, I just want the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A graduate seminar instructor (likely philosophy, given the focus on weakness of will, autonomy, and welfare).
      *   **Colleague:** Behavioral economist (focus on hyperbolic discounting, nudges, paternalism).
      *   **Topic:** The "Planner-Doer" model of self-control (Thaler & Shefrin style) and its implications for autonomy and welfare.
      *   **Task:**
          1.  Create a correspondence table (Household Analogy vs. Individual Psychology).
          2.  Audit the analogy (what carries over, what doesn't, what threatens the argument).
          3.  Address three specific questions: (a) Formal implications of hyperbolic discounting (one vs. two agents), (b) The "True Self" smuggling (aggregation/authority), (c) The presence problem (Doer is present, Planner is past disposition).
          4.  Acknowledge the analogy's strength (phenomenology of conflict/commitment).
          5.  Suggest alternative source domains (repeated game, parliament, etc.) and evaluate them.
      *   **Constraint:** No bibliography, just the argument. Tone should be rigorous, analytical, and suitable for a graduate seminar context.

  2.  **Deconstruct the Planner-Doer Analogy:**
      *   *Source:* Household with two members (Planner + Doer).
      *   *Target:* Individual with time-inconsistent preferences.
      *   *Mechanism:* Commitment devices = tying down the Doer.
      *   *Normative Claim:* Planner's preferences = True Self/Welfare. External nudges = Enforcing autonomy, not violating it.

  3.  **Drafting the Correspondence Table:**
      *   Need to map the economic/household concepts to the psychological/philosophical concepts.
      *   *Planner:* Long-term self, pre-commitment self.
      *   *Doer:* Short-term self, consumption self.
      *   *Household:* The person over time (the "life").
      *   *Budget:* Willpower/Resource constraint over time.
      *   *Tying-down:* Commitment devices (apps, locks, Ulysses contracts).
      *   *Helpful Outsider:* Policymaker/Nudger.

  4.  **Auditing the Analogy (Load-Bearing vs. Cosmetic):**
      *   *Cosmic:* The physical separation (obviously the brain is one organ).
      *   *Load-Bearing:* The *conflict* structure. In a household, conflict requires arbitration. In a single mind, who arbitrates?
      *   *Threatening:* The *welfare aggregation*. In a household, we sum utilities or respect rights. In a person, we privilege one temporal slice over another without a neutral metric.
      *   *Threatening:* The *outsider's epistemic access*. A neighbor knows the kids need homework. Does the state know *my* long-term good better than my current self?

  5.  **Addressing the Three Specific Questions:**

      *   *(a) Formal Treatment (One vs. Two Agents):*
          *   Hyperbolic discounting is mathematically consistent with a *single* agent with dynamic inconsistency. It does *not* require two agents. It describes a preference reversal ($A \succ B$ at $t_1$, $B \succ A$ at $t_2$).
          *   The "two agent" story is an *interpretation* (multiple selves model), not a mathematical necessity.
          *   *Key Point:* The math shows inconsistency, not multiplicity. The "two agent" label is a heuristic reification.

      *   *(b) The "True Self" Smuggling:*
          *   Where does the Planner get authority? The model assumes long-term preferences are "real" and short-term are "noise/error."
          *   *Smuggling:* It happens at the welfare definition stage. Why is the $t_0$ preference superior to $t_n$ preference? Usually justified by "regret," but regret is just another preference at $t_{n+1}$.
          *   *Aggregation Problem:* If selves are distinct, we need a social welfare function. If they are one, we need a theory of identity. The model assumes the Planner *is* the person without arguing for it.

      *   *(c) The Presence Problem (Doer vs. Planner):*
          *   The Doer acts. The Planner plans.
          *   If the Planner is just a past disposition, why does it rule the present?
          *   *Paternalism:* If the Outsider helps the Planner, they are helping a *ghost* (past self) rule the *living* (present self). This looks less like autonomy and more like necrocracy (rule by the dead).
          *   *Survival:* The paternalism conclusion weakens if the "True Self" is just a past preference that no longer endorses itself.

  6.  **Evaluating the Analogy's Strengths:**
      *   It captures the *feel* of akrasia. The struggle is real.
      *   It explains why commitment feels like *freedom* (liberating the Planner).
      *   Don't discard this; it's the phenomenological hook.

  7.  **Alternative Source Domains:**
      *   *Repeated Game (Sequential Selves):* Good for strategic interaction, bad for welfare (who wins the game?).
      *   *Parliament (Upper/Lower House):* Good for structure, but who elects the Upper House? (Same problem as Planner authority).
      *   *Principal-Agent:* Good for information asymmetry, but implies the Principal exists *now*.
      *   *Thermostat/Control System:* Good for non-agential description, bad for autonomy/normativity.
      *   *Selection:* The **Parliamentary Model** (or Constitutional Model) is the strongest competitor. It captures the *rules* aspect (commitment) without necessarily reifying the "Planner" as a distinct person. But it still faces the "Who wrote the Constitution?" problem.

  8.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Tone Check:* Ensure it sounds like a colleague speaking to a colleague, not a textbook. Use terms like "diachronic identity," "welfare metric," "reification."
      *   *Clarity:* Make sure the distinction between the *math* (hyperbolic) and the *model* (planner-doer) is sharp.
      *   *Focus:* Keep the eye on the *autonomy objection*. The colleague wants to dissolve the autonomy objection; the goal is to show it resurfaces elsewhere.

  9.  **Final Review against constraints:**
      *   Correspondence table included? Yes.
      *   Audit included? Yes.
      *   (a), (b), (c) addressed? Yes.
      *   Phenomenology acknowledged? Yes.
      *   Alternative models suggested? Yes.
      *   No bibliography? Yes.

  10. **Drafting the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is the breakdown you need for your seminar. The colleague's move is a classic one in behavioral welfare economics: it attempts to solve the normative problem of paternalism by solving the metaphysical problem of identity. If the person *is* the Planner, then helping the Planner isn't paternalism; it's assistance. If the person is the Household, then the Outsider is just a mediator.

  The weakness lies in the fact that the model solves the metaphysical problem by fiat. It asserts the Planner's authority rather than deriving it.

  ### I. The Correspondence Table

  | Household Analogy (Source) | Individual Psychology (Target) | Normative Function |
  | :--- | :--- | :--- |
  | **The Planner** | Long-term preference ordering (typically $t_0$) | The "True Self"; the welfare metric. |
  | **The Doer** | Short-term impulse / visceral state (at $t_n$) | The source of error/noise; the constraint. |
  | **The Household** | The person extended over time (the "Life") | The locus of welfare aggregation. |
  | **The Budget** | Willpower / Cognitive resources | The scarce resource to be allocated. |
  | **Tying-Down (Ropes)** | Commitment devices (apps, locks, contracts) | The mechanism of self-control. |
  | **The Helpful Outsider** | Policymaker / Nudger / Architect | The enforcer of the Planner's will. |
  | **The Kid's Complaints** | The Doer's visceral craving at $t_n$ | Disqualified preferences (not "real" wants). |

  ### II. The Audit: Load-Bearing vs. Cosmetic Disanalogies

  **Cosmetic Disanalogies (Safe to ignore):**
  *   **Physical Separation:** Obviously, the Planner and Doer share a brain. This doesn't hurt the argument; intrapersonal conflict is well-documented.
  *   **Legal Personhood:** The household files taxes; the individual files one return. This is administrative, not metaphysical.

  **Load-Bearing Disanalogies (Threaten the Argument):**
  *   **Arbitration:** In a household, if the Planner and Doer disagree, there is a legal framework or a social norm for who decides (usually the adults over the kids). In the individual, there is no *neutral* arbiter. The model assumes the Planner wins by definition.
  *   **Epistemic Access:** A neighbor (Outsider) can objectively see the kids aren't doing homework. An Outsider (State) cannot objectively know if the $t_0$ preference is "better" than the $t_n$ preference without relying on the $t_0$ preference itself.
  *   **Compensation:** In a household, if the Planner restricts the Doer, the Doer can be compensated later (allowance, treats). In the single life, the "Doer" at $t_n$ suffers the deprivation, and the "Planner" at $t_0$ gets the reward. They are the same entity experiencing loss and gain at different times, but the model treats the loss as irrelevant noise.

  ### III. The Three Pin-Downs

  **(a) Does the math imply two agents?**
  No. This is the crucial technical point. Hyperbolic or quasi-hyperbolic discounting describes a **single** preference ordering that is dynamically inconsistent.
  *   **The Math:** It shows that $U_t(c_t, c_{t+1}) \neq U_{t+1}(c_t, c_{t+1})$. It demonstrates a reversal of ranking over time.
  *   **The Reification:** The "Planner-Doer" story is a *narrative overlay* on the math. You can model the exact same curve as a single agent whose information state changes, or whose visceral constraints change, without positing two homunculi.
  *   **The Threat:** By treating the mathematical inconsistency as ontological multiplicity, the colleague begs the question. He turns a description of *change* into a description of *conflict between entities*. If it is one agent changing her mind, the "Planner" has no more inherent authority than the "Doer."

  **(b) The "True Self" Smuggling (Aggregation and Authority)**
  You are correct: the model hands him a solved problem. The smuggling happens at the definition of **Welfare**.
  *   **The Move:** The model defines welfare as the satisfaction of the Planner's preferences.
  *   **The Smuggle:** Why? Usually, the argument is: "The Planner doesn't regret saving; the Doer regrets spending." But regret is just another preference at $t_{n+1}$. Why does the $t_0$ preference get to veto the $t_n$ preference?
  *   **The Aggregation Problem:** If we treat them as two agents (the Household view), we need a Social Welfare Function to weigh their utilities. If we treat them as one agent (the Person view), we need a theory of Diachronic Identity to explain why the $t_0$ self rules the $t_n$ self. The model assumes the Planner *is* the Person without arguing for it. It privileges the "cool" state over the "hot" state simply because it aligns with long-term accumulation, which is an economic bias, not a philosophical justification.

  **(c) The Presence Problem and Paternalism**
  This is where the autonomy objection resurfaces most violently.
  *   **The Issue:** The Doer is the one *acting*. The Planner is a set of dispositions laid down in the past.
  *   **The Consequence:** When the Outsider (State) enforces the Planner's will (e.g., auto-enrollment), they are allowing a *past* preference to bind a *present* agency.
  *   **Necrocracy:** If the present self (Doer) actively wants to spend, and the past self (Planner) wanted to save, enforcing the save is not "enforcing autonomy." It is enforcing *heteronomy* by a past version of the self. Unless you can prove the past self is the "real" one, this is just paternalism with a time delay. The autonomy objection does not evaporate; it shifts from "State vs. Individual" to "Past Self vs. Present Self," and the State takes the side of the Past Self.

  ### IV. What the Analogy Gets Right (Phenomenology)
  Do not discard the analogy entirely. It captures the **experience of agency**.
  *   **Commitment as Freedom:** It explains why tying oneself down feels like an *exercise* of will rather than a loss of it. We identify with the Planner.
  *   **Inner Conflict:** It validates the feeling that "I" want to quit smoking, but "my body" wants the cigarette.
  *   **Load-Bearing Insight:** The analogy is useful for explaining *why* people seek commitment devices. It fails when used to justify *why the state should impose them*. It explains the demand for paternalism, not the supply.

  ### V. Alternative Source Domains

  If the Household model is too static, here are three alternatives, ranked by utility for your seminar:

  **1. The Parliamentary Model (Constitutional Democracy)**
  *   **The Picture:** The self is a legislature. The "Planner" is the Constitutional Framework (rules passed at $t_0$); the "Doer" is the Current Session of Parliament (voting at $t_n$).
  *   **Strengths:** Captures the idea of higher-order rules binding lower-order decisions. Explains why we feel bound by past commitments (they are "law").
  *   **Failure Point:** **Who wrote the Constitution?** If the Current Parliament can amend the Constitution at any time (which it can, in a single mind), then the Constitution only binds if the Current Parliament *lets* it. This brings you back to the Presence Problem. It doesn't solve the authority question; it just formalizes it.

  **2. The Repeated Game (Sequential Selves)**
  *   **The Picture:** A chain of distinct selves playing a game. $Self_t$ cooperates (saves) expecting $Self_{t+1}$ to cooperate. Defection (spending) triggers a punishment phase (guilt/breakdown of discipline).
  *   **Strengths:** Mathematically rigorous. No need for a "True Self." Welfare is the sum of the payoff stream.
  *   **Failure Point:** **Welfare Aggregation.** If $Self_t$ is distinct from $Self_{t+1}$, why do we maximize the *sum*? Why not let $Self_t$ win? This model actually *undermines* the colleague's claim. If they are distinct players, external intervention favors one player over another, which is pure paternalism. It makes the autonomy objection stronger, not weaker.

  **3. The Principal-Agent Contract (with Hidden Action)**
  *   **The Picture:** The Long-Term Self is the Principal; the Short-Term Self is the Agent. The Agent has private information about visceral states.
  *   **Strengths:** Good for modeling information asymmetry and monitoring costs.
  *   **Failure Point:** **Identity.** In a firm, the Principal owns the residual claim. In the mind, who owns the residual? If the Principal is just a past iteration, the contract is unenforceable without a third party (the State). This explicitly admits the need for external enforcement, conceding the autonomy objection rather than dissolving it.

  ### Recommendation for the Syllabus
  The Household/Planner-Doer model is safe for the syllabus **only if** framed as a *folk-psychological explanation* for why people desire commitment, not as a *normative justification* for policy.

  Your colleague's claim that the autonomy objection "evaporates" is the weak link. The analogy shifts the locus of coercion from State-to-Citizen to Past-Self-to-Present-Self, but it does not eliminate it. Unless he can provide a non-circular argument for why the Planner's preferences constitute the "True Self" (beyond merely being long-term), the "Helpful Outsider" is still imposing a will that the acting agent (the Doer) currently rejects. That is the definition of paternalism, regardless of how many homunculi you posit inside the skull.
