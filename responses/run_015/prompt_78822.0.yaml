answer: |-
  Good evening. For those who don't know me, I'm a third-year PhD student in the department. My supervisor, who was meant to be standing here, is currently at a wedding abroad. He sends his regrets and his best wishes, and I have been volunteered to ensure the wine gets consumed in a dignified manner.

  Looking around this table, I see a room divided. On my left, the logicians, some of whom would frankly rather be discussing forcing conditions than metaphysics. On my right, historians, family, and undergraduates who are here for the free wine and the portraits on the wall. My task is to speak to both halves without boring the first or alienating the second.

  We are here to discuss Gödel's philosophy. It is tempting, especially for those of us who work with the formal systems he built, to treat his metaphysical views as a charming eccentricity. A great man had a hobby; he liked Leibniz more than Spinoza; he wrote fourteen points on a scrap of paper; he believed in an afterlife. We smile, we pat his hand, and we go back to the incompleteness theorems.

  But to do that is to do Gödel a disservice. His belief in an afterlife was not a comfort he sought in old age; it was a deduction. It hangs together with his Platonism, his rationalism, and his specific brand of theism. If mathematical concepts exist independently of the human mind, as he believed, then the mind must be capable of accessing a realm beyond the physical. If the world is rationally structured, then death cannot be a termination, but a transition. The letters to his mother, where he argues her into this view, are not pastoral; they are proofs. He wasn't seeking solace; he was seeking consistency.

  There is a story about his ontological proof that I find quietly moving. He worked on it for thirty years, refining the modal logic, terrified of publishing it and having people think he actually believed in God. He only allowed Dana Scott to copy it out in 1970, when he believed he was dying. He wasn't trying to convert the world. He was ensuring that the argument existed in the record, that the logic stood on its own feet regardless of the author's pulse. That is not the act of a man clinging to a quirk. That is the act of a philosopher who believes truth is objective, even when it concerns the soul.

  Now, I should be honest. Almost no one in this room, myself included, believes the conclusion of that argument. We are not Gödelians in that sense. But we are not here to worship. We are here to understand how a mind of such rigor constructed a world-view that, to him, was as necessary as arithmetic.

  However, I need to address a temptation that arises at dinners like this. It is very easy to say, "Gödel proved there are truths we cannot reach, and perhaps that is where the afterlife lives." I am asking you, explicitly, to resist that move. It is a category error. The incompleteness theorems are limitative results about formal systems and provability within those systems. They are not epistemic gaps about human knowledge of the divine. To conflate syntactic undecidability with metaphysical mystery is bad logic, and it insults the precision of the work we claim to admire. We should not use his theorems as a poetic shield for beliefs he argued for on entirely different grounds.

  So, where is the weak link? If the system is so coherent, why are we not all convinced? The break is not in the logic, but in the phenomenology. Gödel assumed that rational intuition is a veridical faculty—that if the mind perceives a concept clearly, it has a corresponding reality. He trusted the mind's eye as much as the physical eye. Most of us, today, do not share that trust. We see the coherence of his system, but we do not accept the axiom that coherence guarantees existence.

  And yet, that does not spoil what we are doing here. Because Gödel's project reminds us that logic is not merely symbol manipulation. It is an attempt to make the world intelligible. He shows us that one can be a realist about numbers and a realist about meaning without contradiction. He forces the logicians to acknowledge the human context of their work, and he forces the philosophers to respect the rigor of the formal.

  We are not here to validate his theology. We are here to honor the intensity of his inquiry. He showed us that a life in logic is still a human life, subject to the same questions of value and end as any other.

  I'd like to propose a toast.

  To Kurt Gödel: for the rigor of his proofs and the coherence of his convictions.
