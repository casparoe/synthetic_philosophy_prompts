answer: |-
  Dialetheism is formally coherent but risks explanatory emptiness, confining true contradictions to semantic margins while undermining the normative force of everyday inference.

  **1. Inference Paralysis (Fatal)**
  Your "handoff" worry understates the cost. The real issue isn't action guidance but inference validity. Paraconsistent logics (like LP) invalidate Disjunctive Syllogism (DS): $A \vee B, \neg A \vdash B$ fails. Dialetheists concede this, arguing DS is valid only in consistent regions. The defeater is epistemic: to use DS, you must know no glut exists. Since glut-presence isn't logically decidable, you cannot safely use DS anywhere without risking error. A dialetheist calls this question-begging (assuming consistency), but for a finite agent, the logic offers no procedure to distinguish safe from unsafe inference. It stops explosion but cripples deduction. They concede the cost but argue it's preferable to classical explosion.

  **2. Empirical Vacuity (Awkward)**
  You ask why we aren't swimming in gluts. The dialetheist replies that most contradictions are errors, not gluts, restricted by the "Inclosure Schema" (limits of language/thought). The defeater: there are no accepted non-semantic examples. Physical contradictions (e.g., quantum superposition) are resolved by theory change, not accepting $P \wedge \neg P$. If the only true contradictions are Liar sentences and set-theoretic limits, dialetheism is a semantic patch, not a metaphysical view. This isn't fatal, but it suggests the "principled line" is gerrymandered to protect the theory from empirical falsification. They concede the scarcity but deny it's ad hoc.

  **3. Thesis Status (Minor)**
  Is "some contradictions are true" itself possibly false? Dialetheists accept it might be both. This is stable within LP, not an embarrassment. It shows consistency isn't a prerequisite for rational acceptability. They concede the awkwardness but claim it demonstrates the theory's robustness.

  **Falsifiability Verdict**
  The view is vulnerable to unfalsifiability. Any stubborn contradiction can be labeled a glut; any clear error labeled false. Classical logic does the reverse. The difference is prediction: classical logic predicts consistent reality; dialetheism predicts limits. Since we find no empirical gluts, dialetheism fails this check. It survives by retreating to semantics, where verification is impossible. What would move you is an empirical case where theory change fails and $P \wedge \neg P$ remains the best explanation; none exist. The view holds together formally but loses normative force. Without a clear, non-semantic example of a true contradiction, it remains a sophisticated tool for managing paradoxes rather than a description of reality. The "Handoff" is actually "Inference Paralysis": if you can't trust DS without knowing where gluts are, and you don't know, you can't reason.
