          *   Validity of the concern: It shows you can't justify logic *using* logic without circularity if you treat rules as propositions.

      *   **The Category Mistake (The User's View):**
          *   Distinguish *implication* (conditional statement) from *inference* (the act of concluding).
          *   Russell/Quine view: Rules of inference are meta-logical. They govern the system; they aren't *in* the system.
          *   Analogy: A recipe vs. the act of cooking. You don't add "mix the ingredients" as an ingredient.

      *   **Addressing "Procedural Deduction":**
