answer: |-
  This is a fertile case study because anti-doping practice forces abstract bioethical distinctions into a bureaucratic machinery that must render binary verdicts (eligible/ineligible). Your intuition is correct: the World Anti-Doping Code (WADC) does not apply a pre-existing medical therapy/enhancement distinction; it *constructs* one sui generis to serve the needs of the practice.

  Here is the reconstruction of the implicit theory, the diagnosis of its coherence, and the counterfactual analysis you requested.

  ### I. The Implicit Theory: "Lusory Normality"

  To make sense of the Code, we must reject the view that it applies medical ethics to sport. Instead, it applies **lusory ethics** (ethics of the game) to medicine. The practice strictly presupposes a specific normative anthropology of the athlete.

  **1. What the Practice Strictly Presupposes**
  *   **Normative Relativism:** The therapy/enhancement distinction is not a property of the substance or the physiology, but of the *permission structure of the practice*. A corticosteroid is therapy in a clinic and doping in a velodrome because the velodrome has sovereign authority to redefine "normal function" for its participants.
  *   **The Primacy of the "Spirit of Sport":** The Code explicitly lists "Spirit of Sport" as a criterion. Philosophically, this functions as the *lex superior*. Health risks and performance enhancement are only relevant insofar as they violate this spirit. This presupposes that sport has a telos independent of health or maximal output—specifically, the demonstration of certain cultivated human excellences.
  *   **The "Constructed Baseline":** The Therapeutic Use Exemption (TUE) system presupposes that there is a recoverable "athlete baseline." However, this baseline is not species-typical functioning (health) nor is it the athlete's pre-injury state (which might be sub-elite). It is **lusory normality**: the level of function achievable by a healthy athlete engaging in permitted training within that specific sport.

  **2. What Merely "Fits Well" (But Isn't Required)**
  *   **The Health Narrative:** The claim that doping is banned primarily for health reasons fits the public rhetoric, but the practice does not strictly require it. Alcohol and beta-blockers are banned in specific contexts without significant long-term health risks. Caffeine was monitored/banned at high levels despite being safe. Health is a *justification*, not a *logical condition*.
  *   **The Natural/Artificial Binary:** The distinction between altitude tents (permitted) and EPO (banned) fits a "natural vs. artificial" narrative, but the Code does not consistently enforce this. Carbon-fiber prosthetics (artificial) are permitted; some natural hormonal profiles (DSD) are restricted. The "natural" label is applied post-hoc to interventions that align with the sport's tradition.

  **3. Points of Philosophical Underdetermination**
  *   **Effort vs. Artificiality:** Your hypothesis (effort-mediated vs. directly delivered) and the "artificiality" view both explain the altitude/EPO distinction. The Code is underdetermined here. It does not specify *why* hypoxic tents are acceptable simulations of nature while EPO is unacceptable mimicry of the same result. It could be that tents require *time* (effort) while EPO is *instant* (shortcut), or it could be that tents are *external* environments while EPO is *internal* manipulation. The rules work either way, leaving the deeper moral commitment obscure.
  *   **The Unit of Analysis:** The Code wavers on whether it protects the *individual's health*, the *integrity of the competition*, or the *image of the sport*. These often align, but in DSD cases, they diverge. The rules function without resolving which is the primary good.

  ### II. Internal Tensions and Coherence

  The practice is not globally coherent; it is a patchwork of locally coherent rationales that conflict at the boundaries.

  **1. Therapy/Enhancement as Rationalization**
  In many instances, the therapy/enhancement distinction is a rationalization for a **Tradition/Technology** boundary.
  *   *Evidence:* Reconstructive surgery (e.g., Tommy John surgery for pitchers) often results in hyper-normal function (throwing harder than pre-injury). This is permitted. EPO results in hyper-normal red cell counts. This is banned.
  *   *Analysis:* The distinction isn't "restoring function vs. exceeding it." It is "repairing the tool vs. upgrading the engine." Surgery is viewed as maintaining the athlete's existing capacity to train; pharmacology is viewed as bypassing the training. The T/E language masks a commitment to preserving the *specific mode of preparation* the sport valorizes.

  **2. The Baseline Contradiction (DSD Regulations)**
  The DSD (Differences of Sex Development) regulations reveal the darkest tension.
  *   *The Conflict:* Standard TUE logic says: "Restore the athlete to normal function." DSD logic says: "Suppress the athlete's natural function to match a competitor's normal."
  *   *Implication:* This proves that "fairness" in the Code is not about protecting the individual's right to health or bodily integrity, nor is it about a neutral baseline. It is about **categorization integrity**. If a natural baseline threatens the binary structure of the competition (male/female), the Code presupposes the authority to medically alter the natural baseline. This rules out any theory that views "natural endowment" as a sacrosanct starting point.

  **3. Local vs. Global Coherence**
  *   *Locally Coherent:* Within a specific sport (e.g., shooting), the beta-blocker ban makes perfect sense. It protects the specific excellence being tested (steady hands under pressure).
  *   *Globally Incoherent:* Across sport, the Code fails. A substance can be therapeutic in one context, doping in another, and nutritional in a third. The "Spirit of Sport" is too vague to serve as a universal moral anchor; it functions only as a placeholder for "whatever the federation decides tests the relevant talent."

  **Conclusion on Coherence:** The practice is coherent only if viewed as **protecting the specific narrative of the sport**. When the narrative requires effort, shortcuts are banned. When the narrative requires binary categories, natural hormones are suppressed. The Therapy/Enhancement distinction is the *language* used to explain these decisions, not the *logic* generating them.

  ### III. Counterfactual Regimes: What Would Change?

  If we swap the anchor, the bureaucratic machinery changes drastically. Here is how the Prohibited List and TUE system would transform under three alternative frameworks.

  #### 1. The Colleague's "Developmental-Luck Baseline"
  *   **Theory:** Justice requires neutralizing unchosen advantages. Permitted interventions restore a "fair share" of developmental goods; banned ones exceed it. Natural endowments exceeding the fair share must be suppressed.
  *   **Changes to Prohibited List:**
      *   *Collapse:* The distinction between "natural" and "artificial" vanishes. Altitude tents would be banned if they push red-cell mass beyond the "fair developmental share."
      *   *Addition:* Genetic testing becomes mandatory. Any athlete with a genetic variant (e.g., ACTN3 "speed gene," myostatin deficiency) exceeding the statistical norm for "fair luck" would be required to take medication to suppress it.
      *   *Survival:* Very little of the current list survives on its own merits; substances are banned only insofar as they push the athlete past the "fair share" ceiling.
  *   **Changes to TUE:**
      *   *Abolition:* The TUE system is replaced by a **Baseline Adjustment System**. There are no "exemptions" for therapy. There are only mandates to reach the baseline (for the disadvantaged) or suppress to the baseline (for the advantaged).
      *   *Consequence:* An athlete with asthma doesn't get an exemption to take salbutamol; they get a mandate to take exactly the dose that brings their lung capacity to the league average, no more.

  #### 2. The "Harm-Reduction" Regime
  *   **Theory:** The state/federation has no right to police performance, only safety. Autonomy is paramount.
  *   **Changes to Prohibited List:**
      *   *Collapse:* Almost the entire list dissolves. EPO, steroids, and stimulants are permitted provided they are administered under medical supervision at safe dosages.
      *   *Addition:* The list becomes a **Safety Watchlist**. Substances are banned only if acute toxicity or long-term morbidity is proven (e.g., certain designer steroids with unknown side effects). Caffeine and alcohol remain permitted.
      *   *Survival:* Beta-blockers might survive in shooting *only* if deemed unsafe, not because they steady hands.
  *   **Changes to TUE:**
      *   *Abolition:* TUEs become unnecessary. If the substance is safe enough for the general public (or monitored safely), the athlete can take it. If it requires a prescription for safety, the athlete gets a prescription. The "performance" aspect is irrelevant.
      *   *Consequence:* Medical staff become central to performance teams, managing dosages to maximize output within safety margins.

  #### 3. The "Pure Anti-Deception / Level-Playing-Field" Regime
  *   **Theory:** Cheating is not using advantages, but hiding them or gaining unequal access. Fairness is transparency and universality of access.
  *   **Changes to Prohibited List:**
      *   *Collapse:* The list of *substances* is replaced by a list of **Reporting Requirements**.
      *   *Addition:* Any intervention is permitted *if and only if* it is publicly declared and available to all competitors on equal terms. Secret doping is the crime, not the substance.
      *   *Survival:* Substances that are too expensive for all competitors (e.g., a hypothetical gene therapy costing $1M) might be banned until the price drops, to ensure equal access.
  *   **Changes to TUE:**
      *   *Transformation:* TUEs become **Public Disclosure Forms**. An athlete declares, "I am taking testosterone for hypogonadism." This data is published. Opponents can verify the medical necessity.
      *   *Consequence:* The "Spirit of Sport" is redefined as "Radical Transparency." The arms race shifts from hiding drug use to hiding medical records.

  ### Summary of Philosophical Upshot

  Your dissertation chapter should argue that the WADC does not discover the therapy/enhancement distinction; it **legislates** it.

  1.  **Strict Presupposition:** The Code presupposes that sport federations have the authority to define biological normality for the purposes of the game.
  2.  **Incoherence:** The Code is globally incoherent because it tries to serve three masters (Health, Fairness, Spirit) that frequently contradict (e.g., DSD regulations sacrifice Health and Natural Baseline for a specific conception of Fairness).
  3.  **The Real Work:** The Therapy/Enhancement distinction is doing rhetorical work to legitimize decisions that are actually about **preserving the specific test of talent** the sport intends to measure. When "effort" is the test, shortcuts are banned. When "binary categories" are the test, natural hormones are suppressed.

  The "Developmental-Luck" anchor your colleague proposes is more philosophically consistent than the Code but practically totalitarian (requiring suppression of natural talent). The "Harm-Reduction" anchor is more liberal but abandons the concept of sport as a test of specific excellences. The current Code is a messy compromise that prioritizes the **narrative integrity of the competition** over medical or ethical consistency.
