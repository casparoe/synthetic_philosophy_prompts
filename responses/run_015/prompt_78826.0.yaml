answer: |-
  My credence in the claim—that in the nearest possible world where $p=0.05$ was not canonized, a functionally equivalent bright-line rule would have become dominant within two decades—is **0.38**.

  I place myself closer to your position than your friend's, but not as low as your 0.3. I believe the structural pressures for *some* heuristic were immense, but I doubt the convergence on a *bright-line* (rather than continuous reporting) was inevitable within that specific timeframe without the specific agency of Fisher and the Pearson school.

  Here is the decomposition of that number into the terms you requested.

  ### 1. Decomposition of Credence

  **$P(\text{Structural}) = 0.85$**
  *The probability that the convention's dominance was driven mainly by structural pressures rather than contingent choices.*
  The 1930s–1950s saw the industrialization of empirical research (agriculture, psychology, medicine). The volume of data exceeded the capacity for case-by-case epistemic evaluation. There was a genuine, structural demand for a triage mechanism to separate "signal" from "noise" for administrative and publication purposes. Even without Fisher, the pressure to reduce cognitive and editorial load was exogenous to the statistical community.

  **$P(\text{Bright-line} \mid \text{Structural}) = 0.60$**
  *The probability, conditional on structural pressure, that the role would be filled by a bright-line rule rather than a norm of reporting estimates/uncertainty.*
  This is the first major filter. While a decision rule was needed, it did not logically have to be a binary *significance* test. A norm of "report confidence intervals and let the reader judge" was epistemically available and arguably superior. However, binary rules are cognitively cheaper for readers and editors than interpreting intervals. I assign 0.60 because, while heuristics are likely, the specific *binary* nature of NHST (Null Hypothesis Significance Testing) was heavily advocated by Fisher against the preferences of others (like Neyman, who preferred acceptance procedures, and Pearson, who preferred flexible levels). Without Fisher's polemics, a "report the error margin" norm might have held longer.

  **$P(\text{Stringency} \mid \text{Bright-line}) = 0.70$**
  *The probability that the resulting rule would have been close enough in stringency to count as the same outcome.*
  If a bright-line rule emerges, would it be $\alpha \approx 0.05$? The competitors were typically 0.01 (stricter) or 0.10 (looser). Given the sample sizes common in the 1930s (often small), 0.01 was often too conservative to detect effects, and 0.10 too permissive for the emerging standards of "proof." The 0.05 level sits in a "Goldilocks" zone for the technology of the time. I grant a high probability here that *some* threshold in the $10^{-2}$ range would emerge, which satisfies your "functionally equivalent" clause.

  **$P(\text{Truth-apt}) = 0.95$**
  *The probability that the counterfactual is truth-apt.*
  I am not a counterfactual skeptic. While "nearest possible world" is fuzzy, the historical record provides enough constraint on variables (computational limits, publication volumes, institutional structures) to make the probability assignment meaningful rather than purely speculative.

  **$P(\text{Lock-in} \mid \text{No Re-test}) = 0.80$**
  *The probability that the absence of re-testing reflects lock-in rather than satisfaction.*
  This term diagnoses the *actual* history to inform the counterfactual. The fact that $p=0.05$ persisted despite decades of methodological criticism (from Rozeboom, Meehl, Cohen, etc.) suggests the stability is due to coordination costs (lock-in) rather than epistemic satisfaction. If the rule were truly optimal, it would withstand criticism on merit; instead, it withstands it via inertia.

  ### 2. Combination and Sensitivity

  I combine these terms multiplicatively for the core claim (Structural $\times$ Bright-line $\times$ Stringency), treating Truth-aptness as a validity check and Lock-in as a prior weight on the stability of the actual path.

  $$ \text{Credence} \approx P(\text{Structural}) \times P(\text{Bright-line} \mid \text{Structural}) \times P(\text{Stringency} \mid \text{Bright-line}) $$
  $$ 0.38 \approx 0.85 \times 0.60 \times 0.70 $$

  **Most Sensitive Term:** $P(\text{Bright-line} \mid \text{Structural})$.
  My number is most sensitive to the probability that a *binary* rule would emerge rather than a continuous reporting norm. If you convince me that, absent Fisher, the community would have naturally settled on "report standard errors and confidence intervals" as the default (which was the practice in some physics and economics circles at the time), my credence in the claim drops below 0.20. If you convince me that binary heuristics are a cognitive universal in mass science regardless of leadership, my credence rises toward 0.60. Your friend's model likely assumes this probability is near 1.0; your intuition likely places it near 0.4.

  ### 3. Diagnosing the Disagreement

  You and your friend are not primarily disagreeing about the **history** (you both accept the basic timeline of Fisher's influence) nor strictly about **what counts as the same outcome** (you have both defined "functionally equivalent" broadly enough to bridge the 0.01 vs. 0.05 gap).

  You are disagreeing about **the structure of counterfactuals**, specifically regarding the **ontology of "quality."**

  *   **Your Friend (CSS):** Assumes a static fitness landscape. The options (0.01, 0.05, 0.10, CI reporting) have inherent, pre-existing "quality" values determined by their utility for coordination and error control. The simulation shows that increasing returns will select the high-quality options. Therefore, the outcome is robust.
  *   **You (HPS):** Assume a dynamic or constructed fitness landscape. The "quality" of $p=0.05$ was not inherent; it was *created* by the convention itself. The scoring rule in his model is circular because it measures success by the standards the winner established. In the counterfactual world, the "quality" of "reporting confidence intervals" might have been higher because the community would have invested in the literacy required to read them.

  The disagreement is about whether the *value* of the convention is discovered (Friend) or made (You).

  ### 4. Evidence to Move the Number

  **To move my number up (toward your friend's 0.75):**
  I would need evidence that alternative regimes were *tried and failed* on merit during the critical window (1925–1945), independent of Fisher's influence. For example, archival evidence showing that major journals experimented with "confidence interval only" policies and reverted to significance testing because authors refused to comply or readers found it too difficult. This would suggest the "quality" of the bright-line rule is intrinsic to the cognitive constraints of the readers, not just the rhetoric of the writer.

  **To move my number down (toward your 0.3):**
  I would need evidence that the "quality" of $p=0.05$ was entirely parasitic on Fisher's specific pedagogical tools. For instance, if it can be shown that the 0.05 threshold was adopted primarily because Fisher's *Statistical Tables* (1938) made that specific column the easiest to read, and that without those specific physical tables, the computational cost of calculating exact p-values would have pushed researchers toward Bayesian priors or simple descriptive statistics instead of frequentist thresholds. This would weaken the $P(\text{Bright-line})$ term significantly.
