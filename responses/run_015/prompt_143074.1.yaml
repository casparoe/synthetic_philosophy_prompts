answer: |-
  ### Exam Question

  **Course:** PHIL 450: Narrative Ethics and the Representation of the Dead
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Question 1:**
  Consider the following scenario: A filmmaker releases a biopic of a real, recently deceased climate scientist, using her actual name and public reputation. The script invents a private marital crisis that never occurred and uses it to "explain" her decision to suppress a controversial dataset, even though her real motives were complex and partly epistemic. The film is marketed as "inspired by true events," carries appropriate disclaimers, and is artistically coherent, but it systematically misrepresents the structure of her scientific reasoning for dramatic effect.

  Determine whether a distinct wrong occurs here—one that is not reducible to harm to the deceased (who cannot suffer), harm to viewers (who are warned of fictionalization), or a generic duty to historical accuracy. Analyze whether that wrong is best understood as a moral failure of "narrative restitution" with respect to her self-interpretive authority, an aesthetic failure of distorting the epistemic logic of scientific dissent, or an irreducibly hybrid failure. Additionally, address whether any such wrong scales differently for widely known public figures versus relatively private ones, and whether the filmmaker owes a specific duty to the dead scientist's intellectual legacy rather than only to living audiences.

  *Note: You must clearly distinguish between legally or metaphysically settled premises (e.g., the non-status of posthumous defamation) and contested philosophical claims (e.g., the moral standing of the dead).*

  ***

  ### Model Answer

  In evaluating the ethical status of the biopic described, we must first demarcate the settled ground from the contested terrain. It is legally and metaphysically settled that the deceased scientist cannot suffer experiential harm; she no longer exists as a subject of welfare. Similarly, it is settled law that posthumous defamation does not exist; the dead hold no legal rights to reputation. Therefore, any wrong identified cannot rest on standard utilitarian harm to the subject or legal violation. The contested philosophical terrain concerns whether deceased persons retain "dignity interests" or moral standing that survives death, and whether "narrative restitution" constitutes a genuine moral category owed to the dead.

  Assuming arguendo that a distinct wrong exists, it cannot be reduced merely to viewer deception, as disclaimers mitigate reliance. Nor is it simply a breach of historical accuracy, as biopics are understood to employ dramatization. The distinct wrong lies in the *appropriation of agency*. By substituting a marital crisis for epistemic reasoning, the filmmaker does not just fictionalize events; they overwrite the subject's practical identity. This suggests a failure of "narrative restitution." However, treating this solely as a moral failure assumes the contested thesis that the dead retain authority over their self-interpretation. A more robust analysis suggests a hybrid failure. It is aesthetic because it distorts the internal logic of the narrative (scientific dissent requires epistemic motives, not melodramatic ones), and it is moral because it treats the subject's life as mere raw material, violating a duty of respect owed to the *memory* of the person, if not the person herself.

  This hybrid failure scales differently depending on the subject's public status. For private figures, the intrusion into invented private matters (the marital crisis) weighs heavier, as there is no public expectation of scrutiny. For public figures, such as a prominent scientist, the duty shifts. Public figures surrender some privacy, but they incur a stronger claim regarding their intellectual legacy. If the distortion undermines public understanding of scientific processes (e.g., portraying scientific caution as emotional instability), the wrong amplifies. Thus, the wrong scales not by privacy expectations, but by the potential corrosion of public epistemic trust.

  Finally, regarding the duty owed: the filmmaker owes a duty not merely to the living audience's entertainment, but to the integrity of the intellectual legacy. This is not a duty to the dead subject's feelings (which is impossible), but to the truth-value of the historical record they inhabit. To reduce complex epistemic reasoning to marital strife is to degrade the legacy of scientific inquiry itself. Therefore, the wrong is best understood as a hybrid failure: an aesthetic distortion that enacts a moral disrespect for the subject's agency and legacy. While the claim that the dead hold "authority" is contested, the claim that the living have a duty to represent the past responsibly to the future is less so. The filmmaker violates this duty by prioritizing dramatic coherence over the integrity of the subject's rational agency, thereby damaging the epistemic environment for the living while disrespecting the memory of the dead.

  ***

  ### Marking Scheme

  **Total Marks:** 30

  **1. Distinguishing Settled vs. Contested Premises (6 Marks)**
  *   **Criteria:** Explicitly acknowledges that the dead cannot suffer experiential harm and have no legal standing (settled), while framing "narrative restitution" or surviving dignity interests as philosophically contested.
  *   **Allocation:** 6 Marks (3 for correctly identifying settled limits, 3 for correctly flagging contested moral standing).
  *   **Typical Error:** Treating the dead's "right to reputation" as a legal fact or asserting narrative restitution as an uncontested moral duty.

  **2. Identification of the Distinct Wrong (6 Marks)**
  *   **Criteria:** Identifies a wrong not reducible to viewer deception, legal defamation, or generic historical inaccuracy; focuses on the appropriation of agency or identity.
  *   **Allocation:** 6 Marks.
  *   **Typical Error:** Reducing the wrong to "lying to the audience" or "hurting the family's feelings" rather than the structural misrepresentation of the subject.

  **3. Categorization of the Failure (Moral/Aesthetic/Hybrid) (8 Marks)**
  *   **Criteria:** Analyzes the specific category of the wrong; argues for a hybrid view (aesthetic distortion entailing moral disrespect) or defends a single category with nuanced justification regarding agency.
  *   **Allocation:** 8 Marks.
  *   **Typical Error:** Selecting a category (e.g., " purely aesthetic") without explaining how it generates ethical weight in the context of real persons.

  **4. Scaling Analysis: Public vs. Private Figures (5 Marks)**
  *   **Criteria:** Addresses how the wrong changes based on public status, specifically linking public figures to intellectual legacy/epistemic trust rather than just privacy rights.
  *   **Allocation:** 5 Marks.
  *   **Typical Error:** Assuming public figures have *no* claim to accuracy because they are "public," ignoring the specific duty regarding their professional legacy.

  **5. Duty to Legacy vs. Audience (5 Marks)**
  *   **Criteria:** Articulates a duty owed to the intellectual legacy or historical record distinct from the duty to entertain the living audience.
  *   **Allocation:** 5 Marks.
  *   **Typical Error:** Collapsing the duty to legacy into a utilitarian calculation of audience benefit only.
