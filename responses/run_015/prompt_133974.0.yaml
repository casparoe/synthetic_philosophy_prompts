answer: |-
  This is a fantastic pivot on the classic problem. You've hit on a genuine tension in political ethics that often gets glossed over in introductory Poli Sci courses. Most discussions of "Dirty Hands" (following Michael Walzer's 1973 essay) focus on the tension between *morality* and *necessity* (e.g., torturing a terrorist to find a bomb). Your formulation shifts the tension to *mandate* versus *necessity*.

  You are asking whether the "dirt" comes from violating a moral universal (lying, killing, betraying principles) or from violating a specific fiduciary duty to the electorate.

  Let's map this out carefully, run it through the Walzerian mill, and then test your "Representational Dirty Hands" hypothesis.

  ### 1. Mapping the Players and Payoffs (July 2015)

  To apply the theory, we first need the facts of the dilemma.

  *   **Alexis Tsipras (The Agent):** Elected on an anti-austerity platform. Called the referendum to strengthen his negotiating hand.
      *   *Goal:* Remain in the Eurozone but end austerity.
      *   *Constraint:* Greek banks were insolvent, reliant on Emergency Liquidity Assistance (ELA) from the ECB.
  *   **Yanis Varoufakis (The Conscience):** Finance Minister until days before the deal.
      *   *Stance:* The "Oxi" (No) vote was a mandate to continue negotiating, not a mandate to exit the Euro. He resigned because he could not sign the new memorandum, preferring to keep his hands "clean" while Tsipras got them "dirty."
  *   **The Eurogroup/ECB (The Principals/Adversaries):** Schäuble (Germany), Dijsselbloem, Draghi.
      *   *Leverage:* Control of the liquidity tap.
      *   *Interpretation of "Oxi":* Publicly framed the "No" vote as a "No to Europe," implying Grexit was the only logical outcome of the referendum.
  *   **The Greek Voters (The Principals):**
      *   *Vote:* 61% "Oxi."
      *   *Intent:* Overwhelmingly wanted to stay in the Euro *and* reject austerity. (Post-referendum polls showed strong support for Euro membership).
      *   *Payoff:* They sought leverage. Instead, they got a harsher bailout (Memorandum III) than the one they rejected.

  **The Real Options:**
  1.  **Honour the "Oxi":** Refuse the creditors' terms. Result: Likely bank collapse, issuance of a parallel currency (Drachma), chaotic Grexit.
  2.  **Sign the Memorandum:** Accept harsher austerity than the referendum rejected. Result: Banks reopen, Greece stays in Euro, democratic mandate violated.
  3.  **Resign (Varoufakis option):** Let someone else sign. Result: Personal moral purity, same political outcome.

  ### 2. The Walzerian Analysis (Classic Dirty Hands)

  Walzer's core argument is that political leaders have a special responsibility for the safety and survival of the political community. Sometimes, to save the community, a leader must do something that would be immoral for a private citizen.

  **What Walzer would say Tsipras should have done:**
  Walzer would likely argue Tsipras made the *correct* political choice but incurred a *moral* debt.
  *   **The Necessity:** If Grexit meant the collapse of the Greek state (humanitarian crisis, total economic depression, geopolitical instability), then the "survival of the community" trumped the "will of the voters."
  *   **The Stain:** Tsipras betrayed a promise. That is a moral wrong. But in Walzer's view, a leader who refuses to betray a promise when the state is on the line is morally pure but politically irresponsible.
  *   **The Guilt:** Walzer insists the leader must *feel* the guilt. Tsipras cannot say, "I had no choice." He must say, "I did a wrong thing to save the state, and I am guilty."

  In the classic framework, Tsipras gets dirty hands, but he is justified *if* the alternative was state collapse. The dirt is the lie/betrayal; the justification is survival.

  ### 3. Where the Theory Breaks: The "Representational" Twist

  This is where your insight cuts deep. Walzer's framework is largely **paternalistic**. It assumes the leader knows what the "community" needs better than the moral law does. But it treats the "community" as an abstract entity to be saved, not as a democratic principal giving specific instructions.

  **Does Walzer recognize democratic legitimacy as a moral cost?**
  Not really. Walzer focuses on *conscience* vs. *consequences*. He does not adequately account for *procedure* vs. *consequences*.
  In the Greek case, the "dirt" isn't just that Tsipras signed a bad deal (policy); it's that he solicited a specific instruction ("Reject this deal") and then did the opposite ("Accept a worse deal").

  **The Breakdown:**
  1.  **Agency Theory:** In a democracy, the politician is an agent. In Walzer's "Dirty Hands," the politician is a guardian. When the agent overrides the principal's explicit instruction, it's not just "dirty hands"; it's a breach of contract.
  2.  **The Nature of the Stain:** Classic dirty hands is about *sin* (violating universal morality). Your "Representational Dirty Hands" is about *betrayal* (violating specific trust).
  3.  **Varoufakis as the Control:** Varoufakis proves your point. He resigned to avoid the "Representational Dirt." He left Tsipras to hold the bag. Under Walzer, Varoufakis might be seen as shirking responsibility. Under your framework, Varoufakis was preserving the integrity of the mandate, while Tsipras preserved the integrity of the state.

  ### 4. Expansion or Category Mistake?

  You asked if this requires an expansion of the theory or if it's a category mistake.

  **It is not a category mistake.** It is a necessary **expansion**.

  Here is why: Walzer was writing in 1973, influenced by Machiavelli and the Nixon era. The "Dirty Hands" problem was about the *executive power* acting in secret or using violence (e.g., bombing civilians to end a war). It was about the *means* of governance.

  The Greek Referendum case is about the *source* of governance authority.
  *   **Classic Dirty Hands:** "I must torture this person to save the city." (Moral Law vs. State Survival)
  *   **Representational Dirty Hands:** "I must ignore your vote to save the city." (Democratic Will vs. State Survival)

  If we don't distinguish these, we lose the ability to critique the erosion of democracy. If every time a leader ignores a mandate they can claim "Dirty Hands/State Necessity," then democratic mandates become advisory only.

  **The Theoretical Expansion Needed:**
  A robust theory of "Representational Dirty Hands" would need to add a third variable to Walzer's equation:
  1.  **Moral Universals** (Don't lie/betray)
  2.  **State Necessity** (Save the community)
  3.  **Democratic Fidelity** (Obey the mandate)

  In 2015 Greece, #2 crushed #3. Tsipras argued #3 was impossible because #2 was imminent (bank collapse). But the "dirt" here is stickier because it damages the *mechanism* of democracy, not just the leader's soul. It tells voters: "Your participation is symbolic, not decisive."

  ### 5. What This Shows About the Theory

  This case reveals that Walzer's framework is **insufficient for modern representative democracy.**

  1.  **It assumes a unified "Community":** Walzer assumes the leader acts for the "community." But in Greece, the "community" (voters) explicitly rejected the path the "leader" said was necessary for the "community's" survival. Who defines the community's interest? The voters or the PM? Walzer defaults to the PM.
  2.  **It ignores the cost of cynicism:** Classic dirty hands assumes the leader suffers the guilt. But "Representational Dirty Hands" externalizes the cost to the *voters*, who lose faith in the system. Tsipras stayed in power for a while, but the stain landed on the Hellenic Parliament's legitimacy.
  3.  **The "Clean Hands" Alternative:** In Walzer's view, the person with clean hands is often a "good man" who is a "bad politician." In your framework, the person with clean hands (Varoufakis) might be a "good representative" but a "bad administrator."

  ### Conclusion for Your Argument

  Tell your roommate this:
  Walzer's "Dirty Hands" explains why Tsipras might be forgiven for **signing a bad deal** (State Necessity). It does *not* explain why he should be forgiven for **nullifying a referendum** (Democratic Fidelity).

  If you apply Walzer strictly, Tsipras is a tragic hero who bore the burden of guilt to save Greece from Grexit.
  If you apply your "Representational Dirty Hands" framework, Tsipras is a fiduciary who breached his duty. The "dirt" isn't just on his conscience; it's on the democratic contract itself.

  The theory *does* need expansion. We live in an era where the tension isn't just between *ethics and power*, but between *technocratic necessity and democratic will*. The Greek bailout wasn't just a case of a leader getting his hands dirty; it was a case of a leader washing his hands of the people who elected him. That is a different kind of stain, and Walzer doesn't have a bucket for it.
