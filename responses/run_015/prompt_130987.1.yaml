      *   Better to mention that the regress is *structural* to formalization. Any system requires rules of inference that are not axioms *in* the system. This supports the user's view rather than defeating it.
      *   Wait, the user asked: "Is there a formal result that blocks the regress *without* just appealing to authority?"
