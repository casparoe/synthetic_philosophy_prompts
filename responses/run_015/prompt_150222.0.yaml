answer: |-
  Denis Villeneuve's *Arrival* (2016) is frequently discussed as a meditation on determinism, but viewing it through the specific metaphysical lens of the Rietdijk–Putnam argument reveals a more complex tension between the physics of the block universe and the phenomenology of human agency. The Rietdijk–Putnam argument, derived from Special Relativity, posits that because simultaneity is relative to the observer's frame of reference, there can be no objective, universal "now." Consequently, past, present, and future must co-exist equally within a four-dimensional spacetime manifold (eternalism). *Arrival* dramatizes this ontology through the Heptapod language, which rewires human cognition to perceive time as a spatial landscape. However, while the film's visual and narrative architecture mimics the static geometry of the block universe, its plot mechanics rely on a form of retrocausality that strains strict eternalism. Ultimately, the film does not merely illustrate the Rietdijk–Putnam conclusion; it interrogates the emotional cost of inhabiting a world where the future is as fixed as the past, exposing the gap between the ontological reality of the block and the epistemic experience of decision.

  To align *Arrival* with the Rietdijk–Putnam argument, one must accept that Louise Banks's "flash-forwards" are not precognition in the mystical sense, but rather a shift in consciousness along her worldline. In the Rietdijk–Putnam view, the future is not unwritten; it is merely distant, just as a location in space is distant before one travels there. When Louise learns Heptapod B, she ceases to experience time as a succession of moments (presentism) and begins to experience it as a completed whole (eternalism). The film's non-linear editing mirrors this: scenes of Hannah's death are intercut with the arrival of the aliens not as memories or prophecies, but as concurrent coordinates in Louise's manifold. In this sense, the film successfully denies an objective "now." There is no privileged present moment that slides along the timeline; rather, Louise's consciousness expands to occupy multiple points on her worldline simultaneously. This aligns with the relativistic denial of absolute simultaneity: for the Heptapods (and eventually Louise), the distinction between "before" and "after" is as arbitrary as "left" and "right."

  However, the narrative structure inadvertently smuggles in a privileged "now" that travels along Louise's worldline, creating a friction with the static ontology of the block. While the *metaphysics* of the film suggest all times exist at once, the *drama* relies on Louise's ignorance. The audience and Louise experience the revelation of the future as a progression. If the block universe were truly rendered phenomenologically, there would be no suspense, no learning curve, and no "decision" to make, as the decision itself would be a fixed feature of the manifold. The film attempts to resolve this by suggesting that while the timeline is fixed, the *experience* of it requires a traversal. This introduces a "moving spotlight" element to the block universe: the events are all there (eternalism), but consciousness illuminates them sequentially until the linguistic upgrade allows for omnitemporal illumination. This creates a subtle contradiction: if the future is ontologically co-existent, why does accessing it require a causal process (learning the language) that occurs *in* time? The film conflates the ontological status of time (which is static) with the epistemic access to it (which is dynamic).

  This tension is most palpable in the film's handling of causality, which evokes the structure of the Andromeda Paradox but pushes it into retrocausality. The Andromeda Paradox illustrates how two observers passing each other at different velocities can disagree on whether a distant event (e.g., a fleet launching from Andromeda) has already happened or is yet to happen. In *Arrival*, Louise's "velocity" is her linguistic frame of reference. By shifting her frame, she gains access to information from her future worldline (General Shang's phone number) to resolve a crisis in her present. In a strict Rietdijk–Putnam block universe, this is problematic. In a static manifold, the future event (Shang giving the number) and the past event (Louise calling him) simply co-exist; one does not *cause* the other in a dynamic sense. However, the film treats the future knowledge as an active agent that constrains and enables the present choice. Louise uses the future to save the present, creating a closed timelike curve or bootstrap paradox. This undermines the static ontology because it implies a feedback loop where the future shapes the past, rather than both simply being parts of a pre-existing shape. The film treats the block universe not as a frozen sculpture, but as a circuit where information can flow against the arrow of entropy, blurring the line between a fixed manifold and a causal loop.

  Where the narrative most resists the eternalist reading is in the emotional weight of Louise's "choice." The Rietdijk–Putnam argument often leads to a sense of fatalism: if the future is real, agency is an illusion. *Arrival* confronts this directly. Louise sees that her daughter will die of a rare disease. In a purely physicalist block universe, her "choice" to conceive Hannah is as determined as Hannah's death. Yet, the film frames this as an act of radical affirmation. "I want to give it everything," she says. This dramatizes the conflict between the "view from nowhere" (the physics of the block) and the "view from somewhere" (the human experience of loss). The film suggests that even if the timeline is fixed, the *acceptance* of that timeline is where meaning resides. This resists the cold indifference of the Rietdijk–Putnam conclusion by injecting existentialism into eternalism. It argues that knowing the future does not negate the value of living it; rather, it transforms the suffering of "becoming" into the acceptance of "being."

  However, this also exposes a confusion between epistemic access and ontological co-existence. Louise grieves Hannah before Hannah is conceived. In the block universe, grief and joy are simply affective states located at different coordinates on the worldline. But Louise experiences the grief of the future as a present burden. The film treats the *memory* of the future as ontologically heavy, weighing on her present decisions. This suggests that while the film adopts the *geometry* of the block universe, it retains the *psychology* of presentism. Louise acts as if she is changing her fate, even though the narrative confirms she is fulfilling it. The film wants to have it both ways: it wants the comfort of destiny (the reunion with Ian, the saving of the world) and the heroism of free will (choosing to have Hannah despite the pain). In doing so, it reveals that for humans, the block universe is unintelligible without the illusion of the moving now. We require the sensation of openness to make the closure bearable.

  Ultimately, *Arrival* adds a crucial dimension to the philosophical debate that the Rietdijk–Putnam argument alone cannot provide: the phenomenology of fatalism. The Rietdijk–Putnam argument is a logical deduction from Special Relativity; it proves that the future exists, but it does not explain what it *feels* like to know that. The film illuminates why eternalism feels like fatalism to a conscious observer. It exposes the gap between the physics of simultaneity and the phenomenology of decision. Physics dictates that all moments are equally real; human consciousness dictates that only the present is actionable. *Arrival* suggests that bridging this gap requires a transformation of consciousness itself—a willingness to experience time not as a loss (the passing of the now) but as a presence (the permanence of the whole).

  In conclusion, *Arrival* aligns with the Rietdijk–Putnam argument in its depiction of time as a spatial manifold where past, present, and future co-exist. However, it diverges by introducing retrocausal information flow that compromises the static nature of the block, and by centering a narrative of "choice" that presupposes the very temporal flow it seeks to transcend. The film does not solve the philosophical problems of eternalism; instead, it dramatizes the human cost of them. It demonstrates that while the block universe may be physically coherent, it is emotionally catastrophic without the capacity to affirm the totality of one's worldline. By doing so, *Arrival* moves the debate from the ontology of time to the ethics of it, asking not whether the future exists, but whether we can bear to love it.
