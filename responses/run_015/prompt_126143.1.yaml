          *   Conditions for Group Selection (Lewontin's criteria applied to groups):
              1.  Variation between groups (some groups restrain, some don't).
              2.  Heritability of group traits (offspring groups resemble parent groups).
              3.  Differential fitness of groups (restraining groups survive longer/don't go extinct).
              4.  *Crucial:* Group benefit must outweigh individual cost (altruism problem).

      *   **Part 2: Evaluating the Evidence (Birds, Lemmings).**
          *   Did they meet conditions?
          *   *Variation:* Maybe.
          *   *Heritability:* Weak. How is "group restraint" inherited? Culture? Genetics?
          *   *Differential Fitness:* Hard to measure extinction rates of local populations vs. individual fitness.
          *   *The Fatal Flaw:* The "Subversion from Within." A mutant individual who *doesn't* restrain reproduction will outcompete restrainers within the group, spreading the "selfish" gene even if the group goes extinct.
          *   Hamilton/Dawkins Explanation:
              *   Territoriality = Resource defense for *own* offspring (Individual/Kin selection).
