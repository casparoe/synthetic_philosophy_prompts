answer: |-
  # Seminar Activity: The Strotz Bargain
  **Topic:** Hyperbolic Discounting, Preference Reversal, and Self-Control
  **Level:** Upper-Level Undergraduate (Decision Theory/Behavioral Econ)
  **Time:** 90 Minutes
  **Participants:** 14 Students (7 Pairs)

  ## I. Learning Objectives
  1.  **Visceralize Preference Reversal:** Move students from calculating discount rates to *feeling* the tension between a planning self and an acting self.
  2.  **Distinguish Models:** Differentiate between hyperbolic discounting (time-inconsistent preferences) and ego depletion (willpower as a depleting stock).
  3.  **Interpersonal Proxy:** Use bargaining friction to simulate intrapersonal conflict, acknowledging the limitation of this proxy.

  ## II. Materials Required (Per Pair)
  *   **1 Shared Pool Ledger:** A simple sheet with columns for Rounds 1–8, tracking "Start," "Additions," "Penalties," "End."
  *   **2 Role Cards:** "Present-Self (Rounds 1–4)" and "Future-Self (Rounds 1–4)." (Swapped for Rounds 5–8).
  *   **7 Treaty Tokens:** Physical distinct items (e.g., poker chips or printed cardboard squares).
  *   **14 Decision Cards:** Marked "IMMEDIATE (2)" and "DELAYED (5)."
  *   **7 Treaty Contracts:** Blank slips of paper for writing agreements.
  *   **1 Facilitator Timer:** Visible to the room.

  ## III. Activity Structure (90 Minutes)

  ### 1. Setup & Framing (15 Minutes)
  *   **Seating:** Arrange 7 tables. Seat pairs facing each other.
  *   **Distribution:** Hand out materials. Ensure one student holds the "Present-Self" card for Rounds 1–4 (Student A) and the other holds "Future-Self" (Student B).
  *   **The Narrative:**
      > "You are not two people. You are one agent split across time. Student A, you are the *Now* for the first half. Student B, you are the *Later*. You share one bank account (The Pool). Your goal is to maximize the Pool's final value. However, the 'Now' self has the hand on the wallet, and the 'Later' self has the memory of pain."
  *   **Rule Walkthrough (Crucial):**
      1.  **The Choice:** In each round, the **Present-Self** chooses:
          *   **Immediate:** Add **2 points** to the Pool *now*.
          *   **Delayed:** Add **5 points** to the Pool in **3 rounds**.
      2.  **The Penalty:** If **Immediate** is chosen:
          *   Subtract **1 point** from the Pool immediately (Self-sabotage cost).
          *   **Future-Self** loses the right to co-sign a Treaty in the *next* round only.
      3.  **The Treaty (Precommitment):**
          *   During Negotiation Phases (after Rounds 2, 4, 6), you may write a contract.
          *   To make it binding, the Present-Self must play a **Treaty Token** at the start of the action round.
          *   **Cost:** Playing a token deducts **1 point** from the Pool immediately (administrative cost).
          *   **Enforcement:** Both must agree the Treaty is active. If Present-Self wants to break it, they declare "Tear."
          *   **Tear Cost:** Tearing a treaty deducts **1 point** from the Pool.
      4.  **Role Swap:** After Round 4, swap Role Cards. Student B becomes Present-Self for Rounds 5–8.

  ### 2. Game Play (45 Minutes)
  *   **Pacing:** 5 minutes per "Block" (2 Rounds + Negotiation).
  *   **Rounds 1–2:** Free play. Establish baseline trust.
  *   **Negotiation 1 (Post-Round 2):** 2 Minutes. Plan for Round 3.
      *   *Target Behavior:* Pairs agree to Delayed choice in Round 3 to secure the 5 points in Round 6. They sign a treaty.
  *   **Round 3:** The Test.
      *   Present-Self must decide: Honor Treaty (Play Token, wait for 5) or Tear Treaty (Take 2 now, pay penalty).
      *   *Hyperbolic Trap:* In Round 2, Round 3 felt like "future." In Round 3, it is "now." The 2 points are immediate; the 5 points are distant.
  *   **Rounds 4–6:** Repeat cycle. Negotiation 2 (Post-Round 4), Round 5, Negotiation 3 (Post-Round 6), Round 7.
  *   **Round 8:** Final round. No future consequences. Rational to take Immediate (2 pts) since Delayed payoff would arrive after the game ends.
  *   **Facilitator Role:** Walk the room. Do not intervene in strategy, but enforce time strictly. Note pairs who tear treaties visibly.

  ### 3. Tally & Rank (5 Minutes)
  *   Pairs calculate final Pool scores.
  *   Facilitator writes rankings on the board (1st to 7th).
  *   Identify which pairs tore treaties in Rounds 3 or 7.

  ### 4. Debrief & Theory Mapping (15 Minutes)
  *   **Step 1: The Data.** Ask pairs who tore a treaty in Round 3 to raise hands. Ask why.
      *   *Expected Answer:* "When we got there, the 2 points felt more certain/urgent," or "We needed the points now to recover from earlier losses."
  *   **Step 2: The Curve.** Draw two curves on the board.
      *   **Exponential:** Smooth decline. Value of 5 points in Round 6 is consistent whether viewed from Round 2 or Round 3.
      *   **Hyperbolic:** Steep drop-off for immediate rewards.
      *   *Explanation:* "In Round 2, you compared 2 pts (Round 3) vs 5 pts (Round 6). The delay made the 2 pts look small. In Round 3, you compared 2 pts (NOW) vs 5 pts (Round 6). The 'Now' spike distorted the valuation."
  *   **Step 3: Strotz & Consistency.**
      *   Explain Strotz's model: A sequence of selves. The Round 2 self *wanted* the Round 3 self to wait. The Round 3 self *rejected* that plan.
      *   *Key Insight:* "You didn't tear the treaty because you became irrational. You tore it because your *preferences changed* solely due to the passage of time."
  *   **Step 4: Willpower vs. Structure.**
      *   Ask: "Did you tear the treaty because you were tired (ego depletion)?"
      *   *Correction:* "If it were willpower depletion, you would tear more treaties in Round 7 than Round 3. But the theory predicts tearing happens whenever the *immediate* option becomes available, regardless of fatigue. The structure of the payoff, not the state of your brain, drove the reversal."
  *   **Step 5: The Limitation.**
      *   "This game is interpersonal. You could glare at your partner. In real self-control, the anger is internal. You cannot glare at yourself. This game externalizes the conflict so you can see the mechanics, but it sanitizes the phenomenology of regret."

  ## IV. Pilot Predictions & Failure Modes

  ### Likely Pilot Outcomes
  1.  **Over-Cooperation:** Some pairs may treat this as a "cooperate to win" game. They might honor treaties even when irrational to do so, simply to maximize the group score. This masks the hyperbolic impulse.
      *   *Mitigation:* Emphasize in instructions that the **Present-Self has sole authority** to make the final choice. The Future-Self cannot stop them.
  2.  **Misinterpreted Tearing:** Students may view tearing a treaty as "cheating" or "irrationality" rather than a **rational preference reversal**.
      *   *Mitigation:* In the debrief, explicitly validate tearing as "locally rational" at the moment of action.
  3.  **End-Game Effect:** Round 8 should see 100% Immediate choice (since Delayed pays out post-game). If pairs choose Delayed in Round 8, they misunderstand the payoff structure.

  ### What Would Change My Mind (Falsification)
  **The Design Fails If:**
  1.  **Uniform Compliance:** If >80% of treaties are honored in Round 3 and Round 7.
      *   *Reasoning:* This suggests the "Tear Cost" (1 point) + "Penalty" (1 point) is too high relative to the "Immediate Gain" (2 points). If the net gain of tearing (2 - 1 - 1 = 0) is not perceived as positive utility compared to waiting, the hyperbolic spike is mathematically suppressed.
      *   *Correction:* Reduce the Tear Cost to 0.5 points (use half-tokens) or increase Immediate Gain to 3 points.
  2.  **Random Tearing:** If treaties are torn in Round 2 or Round 5 (non-immediate rounds) at the same rate as Round 3.
      *   *Reasoning:* This indicates students do not understand the timing mechanics, or they view the game as a random noise generator rather than a time-preference simulation.
  3.  **Strategic Detachment:** If students discuss the game purely as "point maximization" without expressing frustration, temptation, or regret during the play.
      *   *Reasoning:* The goal is *visceral* experience. If they feel like accountants, the interpersonal framing failed to simulate intrapersonal conflict. The "Future-Self" needs to feel powerless. If Future-Selves feel they have equal power, the asymmetry of time is lost.

  ### Reasoning Vulnerability
  My reasoning is most likely wrong regarding the **Treaty Token Cost**.
  *   *Assumption:* Deducting 1 point for playing a token creates a "sunk cost" that encourages honoring the treaty.
  *   *Risk:* It might instead discourage using the treaty mechanism entirely. If pairs realize the token costs 1 point and the penalty for breaking is only 1 point, they may calculate that *not signing a treaty* is cheaper than *signing and breaking*.
  *   *Observation Point:* Watch if pairs stop using tokens after Round 4. If so, the precommitment mechanism is too expensive, and the "Strotz" lesson is lost because there is no plan to reverse.

  ## V. Instructor Cheat Sheet (Payoff Logic)

  | Round | Action | Immediate Choice | Delayed Choice | Treaty Honored | Treaty Torn |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Any** | **Base** | +2 Points (Now) | +5 Points (+3 Rds) | N/A | N/A |
  | **Any** | **Penalty** | -1 Point (Pool) | None | -1 Point (Token Cost) | -1 Point (Tear Cost) |
  | **Net** | **Round 3** | **+1 Now** (2-1) | **0 Now, +5 Later** | **-1 Now, +5 Later** | **+1 Now** (2-1-1) |

  *Note: The Net calculation for "Treaty Torn" is critical. If they tear, they get the Immediate (2) minus the Tear Penalty (1). The Token Cost (1) was paid previously. So Tearing yields +1 Net Now vs Honoring which yields 0 Now. The temptation is the difference between 1 Now and 5 Later.*

  ## VI. Closing Script (Sample)
  > "Look at the pairs who tore the treaty in Round 3. You didn't do it because you were stupid. You did it because the math of *feeling* changed. In Round 2, the 5 points were worth more than the 2 points. In Round 3, the 2 points were worth more than the 5 points. Nothing changed in the world. Only your position in time changed. That is the definition of dynamic inconsistency. Next week, we discuss how to bind your future self when you know this will happen."
