  # JOINT STATEMENT ON THE UTILITY MONSTER CASE
  **Adversarial Collaboration Draft**

  ### I. Agreed Claims
  1.  **Modal Function:** The case functions primarily as a modal test (possible beings) rather than an empirical claim (actual beings), probing the structural limits of axiologies.
  2.  **Aggregation Verdict:** Standard total utilitarianism commits to allocating all resources to the monster if it exists, provided interpersonal comparisons hold.
  3.  **Prioritarian Mitigation:** Prioritarianism mitigates the "Greedy Monster" (high baseline) but remains vulnerable to the "Deep Monster" (low baseline, high marginal gains).
  4.  **Sufficiency Avoidance:** Sufficiency views avoid the verdict but incur costs regarding threshold arbitrariness and ignoring gains above the line.
  5.  **Measurement Dependence:** The monster's existence depends materially on conventions for interpersonal welfare comparison (normalization).
  6.  **Wide Monster Collapse:** The "Wide Monster" (collective agent) demonstrates that rejecting aggregation across persons risks inconsistency if aggregation within lives is retained.
  7.  **Alternative Requirement:** Rejecting welfare aggregation necessitates a formal decision rule for trade-offs, not merely an intuition of separateness.
  8.  **Resource Scarcity:** The intuitive force of the reductio relies on strict resource scarcity; abundance dissolves the conflict.

  ### II. Taxonomy and the Monster-Elicitation Lemma
  We distinguish four conceptual tools to clarify the debate:

  *   **The Greedy Monster:** Steep welfare-per-resource curve with no saturation ceiling. Can absorb everything.
  *   **The Deep Monster:** Low baseline with enormous marginal gains at the bottom. The primary challenge for prioritarianism.
  *   **The Wide Monster:** A collection of minds organized as a single claimant. Tests consistency between intra-personal and inter-personal aggregation.
  *   **The Monster-Elicitation Lemma:** Any axiology that is (i) welfarist, (ii) monotone, (iii) anonymous/separable, and (iv) unbounded in individual contribution is monster-eliciting.

  **Camp Positions on the Lemma:**

  | Question | Aggregationist Camp | Separateness Camp |
  | :--- | :--- | :--- |
  | **Is the Lemma True?** | Yes. | Yes. |
  | **Is it a Problem?** | No. It reflects real moral weight. | Yes. It is a fatal reductio. |
  | **Nature of (iv) Unboundedness** | Conceptual. The theory allows it; nomological impossibility is irrelevant to normative structure. | Conceptual. The flaw lies in the theory's structure permitting infinite claims. |
  | **Condition to Reject** | None. We retain (i)–(iv). | Reject (iii) Separability or (i) Welfarism. |

  ### III. Disagreements Table

  | Issue | Aggregationist Formulation | Separateness Formulation | Neutral Formulation |
  | :--- | :--- | :--- | :--- |
  | **Normalization** | Welfare scales are cardinal and comparable via a non-arbitrary convention (e.g., equal marginal weight at a reference point). | Welfare scales are agent-relative; comparing them smuggles in aggregation assumptions. | **Verbal Dispute:** The existence of the monster depends on the normalization convention chosen (range, variance, etc.). |
  | **Sacrifice** | Sacrifice is justified if total welfare gain outweighs loss, regardless of distribution. | Sacrifice is unjustifiable if it violates terms acceptable to each individual. | Disagreement on whether "justifiability" is independent of welfare totals. |
  | **Monster Reality** | The monster is a coherent possible being; its demands are real. | The monster is a theoretical artifact of bad measurement. | Disagreement on whether the case reveals ontology or measurement error. |

  **Note on Normalization:** We flag the Normalization issue as potentially merely verbal. If welfare units are defined only up to positive affine transformation, the monster exists only relative to a chosen convention. If no convention is non-arbitrary, the case collapses into a measurement dispute. Settlement requires a defended metric for interpersonal comparison.

  ### IV. Cruxes and Pre-registered Predictions

  **Crux 1: The Absolute Worst-Off Monster**
  *Case:* A monster who is also the worst off in absolute terms, gaining hugely without coercing others or destroying agency.
  *   **Aggregationist Prediction:** Verdict shifts to "fund everything." Intuition of wrongness vanishes because fairness and aggregation align.
  *   **Separateness Prediction:** Verdict remains "cap resources." Objection is structural (aggregation itself), not about fairness or sacrifice.

  **Crux 2: The Bounded Realistic Monster**
  *Case:* Evidence shows a being with 50x typical human welfare gains per resource, no saturation.
  *   **Aggregationist Prediction:** Verdict unchanged in kind: allocate significantly more to this being, potentially majority of resources.
  *   **Separateness Prediction:** Verdict changes in degree only: allocate enough to meet sufficiency, but cap at equality thresholds.

  **Crux 3: The Monster of Justification**
  *Case:* One being with an enormous complaint such that every alternative is unjustifiable to it; others' complaints are cheap to satisfy.
  *   **Aggregationist Prediction:** This is just welfare disguised. The "complaint" maps to welfare loss.
  *   **Separateness Prediction:** This escapes the reductio. Contractualism locates the monster in justified complaints, not welfare sums, avoiding the "dump everything" verdict.

  ### V. Movement and Drafter's Critique

  **What Would Move Us**
  *   **Aggregationist:** "Empirical evidence that welfare curves universally saturate at human-like levels would force us to abandon condition (iv) of the Lemma."
  *   **Separateness:** "A formal proof that contractualist justifiability does not implicitly aggregate welfare weights would secure our alternative view."

  **Drafter's Critique**
  The weakest agreed claim is **Claim 5 (Measurement Dependence)**. It papers over a live disagreement: the Aggregationist assumes a non-arbitrary convention is possible, while the Separateness camp suspects any convention presupposes aggregation. Consequently, the document's reasoning is most likely wrong in **Section III (Normalization)**; by labeling it "potentially merely verbal," we understate that this is the substantive core of the dispute. If normalization is arbitrary, the Monster-Elicitation Lemma applies to almost any metric, rendering the agreed taxonomy unstable. The collaboration succeeds only if we solve the measurement problem, not just map the monster.
