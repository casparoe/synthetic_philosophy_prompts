answer: |-
  ### Phase 1: The Messy Brainstorm

  Okay, let's dump everything on the table. I'm thinking as both the ethicist and the ecologist. We need to capture the dynamics of populations, the moral status of individuals, and the uncertainty of the data.

  *   **Snapshot vs. Movie:** Can't just count heads at $t=0$. Need to integrate over time. Populations fluctuate.
  *   **The Bounce-Back:** If you cull or destroy habitat, does $N$ (population size) return to $K$ (carrying capacity)? If yes, the suffering reduction is temporary.
  *   **Regime Shifts:** Sometimes habitat destruction doesn't just lower $K$; it flips the system to a different stable state (e.g., forest to scrub). Different species, different $r$-rates, different welfare profiles. The theory needs to handle discrete jumps, not just smooth curves.
  *   **Who Counts?** Only sentient individuals? Or does the "species" have value? (I suspect we should bracket species value for this spec and focus on welfare, but the spec should note if it *excludes* it).
  *   **The Non-Identity Problem:** If we change the habitat, different specific animals are born. Does it matter that *this* rabbit dies vs. *that* rabbit?
  *   **Replaceability:** If 1000 are born and 2 survive in Scenario A, and 1000 are born and 2 survive in Scenario B, is it equal? What if in A the 998 die of starvation (slow) and in B they die of predation (fast)?
  *   **Existing vs. Future:** The animals currently alive during habitat clearance are harmed directly. The animals *not* born are prevented from existing. These feel morally different. One is a violation of rights/interests; the other is a non-event.
  *   **Sign Uncertainty:** We don't know if wild lives are net positive or net negative. The theory can't require us to know the sign of welfare ($W > 0$ or $W < 0$) to give an answer, or it's useless.
  *   **Aggregation:** Does a huge amount of mild pleasure outweigh a small amount of intense agony? (Lexicality). Does the total sum matter, or the average?
  *   **Density Dependence:** Welfare isn't constant. As $N$ approaches $K$, starvation increases. A theory that assumes constant welfare per animal is ecologically illiterate.
  *   **The "Sadistic" Trap:** If lives are net negative, Total Utilitarianism says "more extinction is better." Does the theory have to accept that? Or can it block it?
  *   **Spatial Spillover:** If you clear habitat here, animals move there. Does that displace suffering or just move it?
  *   **Time Preference:** Do we discount future suffering? If a regime shift lasts 100 years, does it matter more than one that lasts 10?
  *   **Moral Weight:** Do we weight a mouse the same as an elephant? (Neocortex size, capacity for suffering).
  *   **Intervention Feasibility:** A theory that says "fix everything" is useless if we can't. But this is a *spec for evaluation*, not necessarily for intervention. Still, "ought implies can" might creep in. Let's keep it to evaluation for now.

  ### Phase 2: Pruning and Merging

  *   **Merge:** "Snapshot vs. Movie," "The Bounce-Back," and "Regime Shifts" all go into a single requirement about **Dynamic Stability and Temporal Integration**. We need to measure the integral of welfare over time, accounting for equilibrium states.
  *   **Merge:** "Existing vs. Future" and "The Non-Identity Problem" can be grouped under **Status Distinction**. We need to separate the moral weight of harming an existing subject vs. changing the identity/number of future subjects.
  *   **Merge:** "Replaceability" and "The 'Sadistic' Trap" touch on how we value the *process* of turnover. Let's refine this into **Turnover and Process Sensitivity**. It's not just about numbers; it's about the cost of generating the survivors.
  *   **Merge:** "Sign Uncertainty" and "Aggregation" are the core ethical engine. Let's call this **Welfare Robustness and Aggregation**. The theory must handle the fact that we don't know the sign of $W$, and must specify how $W$ sums across individuals.
  *   **Drop:** "Spatial Spillover" is a sub-case of Dynamic Stability (metapopulation dynamics).
  *   **Drop:** "Moral Weight" (mouse vs. elephant) is a parameter input, not a structural requirement of the theory itself. The spec should demand the theory *accepts* weighting parameters, not dictate them.
  *   **Drop:** "Species Value." The prompt implies a focus on sentient individuals ("net welfare of an ecosystem" in the context of suffering). I will make it a requirement that the theory *clarifies* its stance on holism, rather than demanding it be holistic or individualist.
  *   **Drop:** "Intervention Feasibility." We are evaluating the *state*, not necessarily the *policy* yet. Keep the evaluation pure.

  ### Phase 3: The Final Spec

  Here is the specification. Any account claiming to estimate the net welfare of an ecosystem, or the moral valence of conserving vs. destroying it, must satisfy these five requirements.

  #### 1. Dynamic Stability and Temporal Integration
  **The Requirement:** The account cannot evaluate welfare as a snapshot at time $t$. It must calculate the expected integral of welfare over a relevant time horizon, accounting for population dynamics. Specifically, it must distinguish between a temporary deviation from carrying capacity ($K$) and a permanent shift in the ecological regime.
  **Motivating Consideration:** Populations are not static. In $r$-selected species, knocking a population below $K$ often triggers a compensatory boom (high reproduction) that restores $N$ quickly. A theory that counts only the animals alive *during* the habitat destruction misses the "bounce back." Conversely, if destruction causes a regime shift (e.g., woodland to monoculture), the new equilibrium may have a different $K$ and different per-capita welfare. The theory must model the trajectory, not just the starting point.
  **Status:** **Non-Negotiable.** Ignoring dynamics renders the calculation ecologically false.

  #### 2. Status Distinction (Existing vs. Potential)
  **The Requirement:** The account must assign distinct moral categories to (a) individuals currently alive who are harmed or killed by a change, and (b) individuals who are prevented from existing by that change. It must not simply net these out as equivalent positive/negative utility units.
  **Motivating Consideration:** This addresses the "clearance victims" problem. The animals displaced or starved during habitat destruction have existing interests that are violated. The animals never born due to lower $K$ do not have interests to violate (on most person-affecting views). Collapsing these into a single "total utility" sum ignores the asymmetry between harming a subject and failing to create one.
  **Status:** **Non-Negotiable.** Collapsing this distinction leads to counterintuitive results where killing an existing animal is treated as morally identical to preventing its birth, which violates basic rights-based and person-affecting constraints.

  #### 3. Turnover and Process Sensitivity
  **The Requirement:** The account must specify whether the *process* of population maintenance has intrinsic moral cost, independent of the welfare of the survivors. If 1,000 offspring are produced to sustain 2 adults, does the theory count the suffering of the 998 failures as a cost, even if the 2 survivors have identical lives in both scenarios? Furthermore, it must distinguish between modes of death (e.g., predation vs. starvation).
  **Motivating Consideration:** This addresses the "replaceability" intuition. If the only thing that matters is the final count of happy adults, then high-turnover ecosystems look morally neutral. But if the *churn* involves massive suffering (the 998 dying), the ecosystem has a high "metabolic cost" in welfare terms. A theory that ignores turnover treats a high-suffering/high-turnover system as equivalent to a low-suffering/low-turnover system with the same adult population.
  **Status:** **Non-Negotiable.** Without this, the theory cannot distinguish between a stable $K$-selected population and a volatile $r$-selected one, despite their vast differences in suffering profiles.

  #### 4. Welfare Sign Robustness
  **The Requirement:** The account must yield comparative judgments (State A is better than State B) even when the sign of average welfare (whether wild lives are net positive or net negative) is unknown or uncertain. It should not require precise cardinalization of pleasure and pain to function.
  **Motivating Consideration:** We currently lack the empirical data to say definitively if a wild mouse's life is net $+5$ or $-5$. A theory that says "I can't tell you if conservation is good until you give me the exact welfare value" is practically useless. The theory should ideally rely on ordinal rankings or thresholds (e.g., "lives below a misery threshold are bad, regardless of the sum of pleasures").
  **Status:** **High Priority (Soft Constraint).** While ideal, some aggregation methods *require* cardinal data. However, a theory that *completely* fails under sign uncertainty is too fragile for conservation application.

  #### 5. Aggregation Transparency
  **The Requirement:** The account must explicitly state its aggregation rule (Total, Average, Critical-Level, or Prioritarian) and demonstrate how it handles the trade-off between population size and average welfare. It must declare whether a large number of lives barely worth living can outweigh a small number of intense sufferings.
  **Motivating Consideration:** This is the core population ethics conflict. A "Total View" might justify destroying habitat if lives are net negative (fewer lives = less total suffering). An "Average View" might justify culling happy animals if it raises the average welfare. The theory cannot hide this; it must expose the lexical trade-offs.
  **Status:** **Non-Negotiable.** Hidden aggregation assumptions are the primary source of error in this field.

  ***

  ### Phase 4: The Structural Tension

  You asked for the pair of desiderata I suspect cannot be jointly satisfied. This is the theoretical "result" of building this spec.

  **The Incompatible Pair:** **Status Distinction (2)** and **Welfare Sign Robustness (4)** under a **Totalist Aggregation (5)**.

  Here is the conflict:
  To satisfy **Welfare Sign Robustness**, you want a theory that tells you what to do even if you don't know whether wild lives are net positive or net negative. Usually, this pushes you toward an **Asymmetrical View** (creating happy lives is neutral, creating miserable lives is bad).
  However, to satisfy **Status Distinction**, you must treat existing animals differently from potential animals.
  The tension arises when you try to combine these with **Dynamic Stability**.
  If you prioritize Existing Animals (Status Distinction), you likely oppose habitat destruction because it harms current subjects.
  But if you prioritize Welfare Sign Robustness (assuming lives might be net negative), you might want to reduce the population to prevent future suffering.
  If you hold both strictly:
  1.  You must not harm existing animals (Status Distinction).
  2.  You must prevent future negative welfare (Sign Robustness/Asymmetry).
  In a high-turnover ecosystem, the *only* way to prevent future negative welfare without harming existing animals is to wait for them to die naturally and not replace them. But ecology (Dynamic Stability) says they *will* be replaced if $K$ remains. To stop the replacement, you must lower $K$ (habitat destruction). But lowering $K$ harms existing animals (violating Status Distinction).
  **The Result:** You are paralyzed. You cannot satisfy the duty to existing animals and the duty to prevent future suffering simultaneously in a system where population renewal is automatic. You must violate one. A theory that claims to satisfy both is hiding a variable.

  ### Phase 5: The Hammer

  You asked which single requirement does the most work in knocking out the accounts people actually defend.

  **The Winner:** **Dynamic Stability and Temporal Integration (Requirement 1).**

  **Why:**
  Most arguments in this space are "snapshot" arguments.
  *   **The "Wild Animal Suffering" Argument:** Often looks at the current high mortality rate of juveniles and concludes "nature is bad, reduce $N$." This ignores that reducing $N$ temporarily often increases the per-capita resource availability for survivors, potentially *increasing* average welfare temporarily, or triggers a reproductive boom that restores $N$ (and suffering) within a few seasons. It treats the population as a static bucket of suffering rather than a flow.
  *   **The "Conservation" Argument:** Often looks at the current biodiversity and species count and concludes "nature is good, preserve $N$." This ignores that preserving the habitat might maintain a high-$K$ state that sustains a massive volume of net-negative lives (if lives are indeed net negative). It treats the population as a static museum exhibit rather than a suffering engine.

  **Dynamic Stability** forces both sides to run the movie forward.
  *   For the Suffering Advocate: It reveals that habitat destruction is likely a one-time harm to existing animals followed by a rapid return to the suffering equilibrium, unless the regime shift is permanent and drastic. The "quick fix" vanishes.
  *   For the Conservationist: It reveals that "preserving nature" might mean preserving a high-throughput system of death and birth. They can't just point to the majestic adults; they have to account for the integral of the juveniles dying in the background over the next 50 years.

  This requirement kills the "low-hanging fruit" on both sides. It forces the debate away from "How many animals are there now?" to "What is the attractor state of this system, and what is the welfare cost of the trajectory to get there?" That is a much harder, more honest question, and it invalidates 90% of the op-eds and position papers currently written on the topic.
