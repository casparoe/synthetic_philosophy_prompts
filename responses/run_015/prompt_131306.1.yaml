  Here is the breakdown. I am more skeptical than your 0.4, primarily because I think the "moral" element introduces structural problems Lewis's coordination model cannot solve without external inputs.

  **1. The structural core is right: norm emergence is basically a coordination problem with arbitrary equilibria.**
  **Credence: 0.85**
  **Justification:** Social regularities overwhelmingly stabilize at Nash equilibria, though the "arbitrariness" condition is increasingly contested for non-trivial norms.

  **2. Moral norms — like anti-free-riding — are actually coordination problems, not commitment devices or evolutionary strategies that don't need common knowledge.**
  **Credence: 0.50**
  **Justification:** Core moral norms typically solve Prisoner's Dilemmas, requiring enforcement mechanisms that Lewis treats as exogenous to the coordination account.

  **3. Something like what I'm calling 'stochastic common belief' (local signaling that approximates common knowledge without full transparency) is enough to satisfy Lewis's conditions in big populations.**
  **Credence: 0.65**
  **Justification:** Monderer and Samet (1989) demonstrate coordination is robust under common *p*-belief, but relaxing strict CK alters Lewis's original epistemic requirements.

  **4. The Normative Force Gap: Equilibrium expectations can generate compliance incentives without requiring an independent premise that agents *ought* to maximize utility or respect expectations.**
  **Credence: 0.45**
  **Justification:** Lewis explains why agents *do* conform (prudence), but cannot derive why they feel *bound* to conform (obligation) without a prior normative commitment to rationality.

  ***

  **Overall Credence: 0.25**

  I land lower than you because I treat these as multiplicative constraints on the specific claim that Lewis's account works *without independent normative premises*. Even if the epistemic bottleneck (Term 3) is solvable, the structural mismatch between Coordination Games and Moral Cooperation (Term 2) combined with the Is-Ought gap (Term 4) drags the probability down significantly.

  **Weakest Link:**
  **Term 2 (Moral norms as coordination problems).**
  This is the fatal structural flaw. If anti-free-riding is fundamentally a Prisoner's Dilemma (where defection dominates), Lewis's coordination story (where matching dominates) cannot explain its emergence without adding a premise about punishment or internalized preference transformation that isn't in the original *Convention* framework.

  **Decisive Result:**
  I would require an evolutionary game theory model demonstrating the **endogenous evolution of conditional preferences in one-shot anonymous Prisoner's Dilemmas without reputation or punishment mechanisms.**
  If a model shows that agents can evolve a "Lewisian" convention to cooperate in a PD purely through salience and approximate common belief—without external enforcement or prior normative assumptions—it would force me to update Term 2 upward to ~0.8 and shift my overall credence above 0.6. Until then, the PD structure remains a hard boundary for Lewis's coordination account.
