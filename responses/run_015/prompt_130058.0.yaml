answer: |-
  The phrase your writing group contact half-remembered is **Middle-Range Theory**. In archaeology (specifically Processual Archaeology, circa 1970s), this is the logical bridge between *static observations* (what is in the ground now) and *dynamic behaviors* (what people were doing then). It asks: "Under what conditions does a living behavior become this specific dead pattern?"

  The reason you feel a gap reopening every time you try to cross it is that Middle-Range Theory admits the bridge is often rotten. A broken pot (static) could mean a ritual killing (behavior) or a clumsy child (behavior). Both produce the same debris.

  Here is the procedure you asked for. It is designed to separate the *pattern* (which the dirt confirms) from the *meaning* (which your imagination supplies).

  ### The Procedure: The Inference Audit
  **Time:** 30 minutes per object/scene.
  **Tools:** Your manuscript, your notes on the find, a timer.

  **Step 1: The Static Description (5 mins)**
  Write one sentence describing *only* what was physically found, using no verbs of human intention.
  *   *Bad:* "They placed the cones..."
  *   *Good:* "Forty fired-clay cones were located in the soil matrix of three door thresholds."
  *   *Pass Criteria:* Can you take a photo of this sentence and show it to a geologist without them objecting?

  **Step 2: The Functional Baseline (5 mins)**
  Ask: "What is the most boring, utilitarian reason this object exists?" (e.g., door socket, toy, trash, storage).
  *   *Pass Criteria:* You must identify the "null hypothesis." If you cannot name a boring use, you are already in fantasy.

  **Step 3: The Anomaly Check (5 mins)**
  Ask: "What about the find *doesn't* fit the boring use?" (e.g., Why snapped? Why under the floor? Why face down?)
  *   *Pass Criteria:* Identify the specific detail that forces you away from Step 2. This is your "Ritual Hook."

  **Step 4: The Equifinality Test (5 mins)**
  Ask: "What is a *different* belief that would produce the exact same Anomaly?" (e.g., Snapped cones could mean 'killing the object to release a spirit' OR 'breaking the object so it can't be used by enemies').
  *   *Pass Criteria:* If you cannot name a second plausible belief, you are not doing archaeology; you are doing theology. Stop here.

  **Step 5: The Rotting Context (5 mins)**
  Ask: "What material would have carried the specific meaning I want to write, that has now rotted away?" (e.g., Paper receipts, wooden signs, spoken words, fabric bindings).
  *   *Pass Criteria:* Acknowledge that the evidence for your specific idea is likely the part that didn't survive.

  **Step 6: The Stop & Declare Point (2 mins)**
  If Step 4 or 5 revealed multiple options or missing data, you must write this sentence in your notes: *"The object confirms [Action], but the text invents [Reason]."*
  *   *Action:* What the archaeologist signs off on (e.g., "breaking cones").
  *   *Reason:* What the novelist signs off on (e.g., "to keep ghosts out").

  **Step 7: The Fiction Decision (3 mins)**
  Decide: Am I writing a book where the characters *know* why they do this, or a book where they do it because it is tradition and the meaning is lost?
  *   *Outcome:* This determines your Author's Note phrasing.

  ***

  ### The Three Questions for the Dig Director
  You have one email. Do not ask "Is this right?" Ask for the boundaries of the possible.

  1.  "For [Object X], what is the strongest competing functional explanation that I am currently ignoring?" (Forces them to give you the null hypothesis).
  2.  "Is there a known ethnographic analogy from this region/period where this specific pattern (e.g., snapping/threshold) implies a belief system, even if we can't prove it here?" (Asks for Middle-Range bridges built elsewhere).
  3.  "If I assert [Specific Belief] in a work of fiction, is there any physical evidence in my description that actively contradicts it?" (Ensures you aren't writing physical impossibilities).

  ***

  ### Running the Cases

  #### Case 1: The Clay Cones (Thresholds)
  *   **Step 1 (Static):** Forty fired-clay cones found in threshold soil of large structures, arranged in pairs, points inward. Three specimens exhibit intentional pre-depositional fracture.
  *   **Step 2 (Functional):** Door sockets (to reduce friction) or loom weights (storage).
  *   **Step 3 (Anomaly):** Loom weights don't belong in thresholds. Door sockets don't need to be snapped before installation. The "snapping" is the key.
  *   **Step 4 (Equifinality):**
      *   *Your Idea:* Apotropaic (keeping evil out).
      *   *Alternative:* Ancestral anchoring (binding the lineage to the house).
      *   *Alternative:* Decommissioning (killing the house's power when abandoned).
  *   **Step 5 (Rotting):** The specific chant or prayer said during the snapping is gone. The material (clay) survives; the intent (fear vs. reverence) does not.
  *   **Step 6 (Declare):** The object confirms **ritual modification of the threshold**. The text invents **the direction of the threat (out vs. in)**.
  *   **Step 7 (Fiction Decision):** You can keep the belief, but you must acknowledge the ambiguity.

  **Strongest Honest Sentence:**
  > "The clay cones were broken before they were set, a practice we know was meant to mark the boundary between the house and the world, though whether that boundary was meant to keep people in or spirits out is a silence the earth keeps."

  **Uncertainty Flag:** **Two different belief attributions fit the objects equally well.** (Anchoring vs. Protecting).
  **Verdict:** You can have the belief, but you cannot claim it is the *only* belief.

  #### Case 2: The Counting Stones (Pebbles & Board)
  *   **Step 1 (Static):** Two hundred pebbles in eleven size grades found with a pitted slate under a floor.
  *   **Step 2 (Functional):** Game board (like Mancala/Senet) or craft tally (beads/loom).
  *   **Step 3 (Anomaly):** Eleven distinct size grades is too specific for a simple game; it implies quantification. Under the floor implies concealment or foundational deposit.
  *   **Step 4 (Equifinality):**
      *   *Your Idea:* State Levy/Tax Office.
      *   *Alternative:* Household inventory (private wealth).
      *   *Alternative:* Ritual offering of "counted" wealth to the house gods.
  *   **Step 5 (Rotting):** The grain, the receipts, the seals, the uniforms. The *institution* relies on perishable authority markers.
  *   **Step 6 (Declare):** The object confirms **systematic accounting**. The text invents **the political authority (Office vs. Household)**.
  *   **Step 7 (Fiction Decision):** You can have the office, but it rests on the assumption of a hierarchy not proven by the stones alone.

  **Strongest Honest Sentence:**
  > "The stones show a system of counting precise enough to track a harvest, and I have chosen to imagine that system belonged to the settlement rather than a single family."

  **Uncertainty Flag:** **Everything that rotted would have carried the meaning and what survived didn't.** (The authority was in the paper/seed, not the stone).
  **Verdict:** You can have the practice, but the "Office" is a structural inference, not an artifact inference.

  #### Case 3: The River Judgement (Bound Burials)
  *   **Step 1 (Static):** Two human remains in channel silts. Both supine/prone variation, both with wrist restraints (inferred from bone position/artifacts). One with manual amputation.
  *   **Step 2 (Functional):** Execution of prisoners, disposal of enemies, burial of those who drowned accidentally (bound for rescue?).
  *   **Step 3 (Anomaly):** Face-down (deviant burial). Bound wrists (restraint). Hand removal (specific post-mortem or pre-mortem ritual disabling).
  *   **Step 4 (Equifinality):**
      *   *Your Idea:* Trial by Ordeal (River decides guilt).
      *   *Alternative:* Execution of criminals (River hides the body).
      *   *Alternative:* Sacrifice to River God (Gift, not judgement).
      *   *Alternative:* Binding the dead to prevent return (Ghost fear).
  *   **Step 5 (Rotting):** The crowd, the accuser, the verdict, the spoken law. A "Public Judgement" leaves no bone signature distinct from a "Secret Execution."
  *   **Step 6 (Declare):** The object confirms **deviant burial with restraint**. The text invents **the public legal process**.
  *   **Step 7 (Fiction Decision):** This is the highest risk. The archaeology supports *death by ritual violence*, but not *law*.

  **Strongest Honest Sentence:**
  > "The bound bodies in the silt tell us that some people were denied the earth and given to the water, but whether the river was acting as a judge or simply a grave is a story I have written to make sense of their silence."

  **Uncertainty Flag:** **A people three hundred miles away and four centuries later left written curses that sound a bit like what I want.** (Anachronistic/Distant Analogy).
  **Verdict:** You must flag this in the Author's Note as a "narrative necessity" rather than an archaeological finding.

  ***

  ### What The Procedure Cannot Do
  You asked me to be honest about where this tool fails. It fails in three specific places. Do not ask it to work here.

  1.  **It Cannot Distinguish "Sacred" from "Secular" in Pre-Literate Societies.**
      In the 3rd Millennium BC, "counting grain" and "offering grain" often used the same gestures and tools. The procedure will tell you *counting happened*, but it cannot tell you if the counter was a priest or a clerk. That is a modern distinction you are imposing.
  2.  **It Cannot Recover the "Audience."**
      Archaeology finds the actors (the bound body, the broken cone). It rarely finds the witnesses. A "public judgement" and a "private execution" look identical in the mud. If you need a crowd for the drama, you must admit the crowd is fictional.
  3.  **It Cannot Validate "Continuity."**
      Just because a practice exists in Book 1 doesn't mean the *meaning* is the same in Book 3. Traditions shift. The procedure treats each find in isolation. It cannot tell you if the "cone breaking" in Book 3 means the same thing as Book 1, only that the *action* is consistent.

  ### For Your Author's Note
  You are deleting sentences like *"the people of the Reach held that..."* because you feel like a fraud. Stop trying to write history. Write about the *gap*.

  **Try this phrasing:**
  > "In writing Hallow Reach, I have tried to let the objects lead. Where the clay cones were found, I describe the breaking. Where the stones were counted, I describe the tally. But where the dirt offers only silence—where it tells us *what* was done but not *why*—I have had to speak for people who cannot answer. The beliefs in these pages are my bridge across that silence. They are not findings; they are guesses."

  This satisfies the archaeologist (you admit the gap) and satisfies the reader (you claim the narrative authority).

  **Final Instruction:**
  Run the Audit on the "Cones" first. It is your strongest case. If the procedure lets you keep the "keeping out" belief (which it does, as one of two options), you will gain the confidence to handle the "River" case, where you must admit the invention is heavier than the evidence.

  You are not lying. You are building a Middle-Range bridge where none exists. Just label it "Construction Zone."
