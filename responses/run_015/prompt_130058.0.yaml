prompt: |-
  I write historical fiction, and I'm two books into a trilogy set in a made-up river-valley settlement I call Hallow Reach, somewhere in the late third millenium BC by the old dating (I've decided not to put a date in the text at all, which has already saved me a lot of grief). I did a big pile of reading before book one, and then someone in my writing group whose partner directs a dig said something that I can't shake: every time I let an object do something in a scene, I've already made an inference about what the people in that scene believed or what rules they were living under, and I ought to be able to say which of those inferences an archaeologist would actually sign off on and which ones are just mine. It's become a genuine problem now that I'm drafting the author's note, because I keep typing things like the people of the Reach held that... and then deleting the whole sentence.

  So what I want is a procedure, not a lecture, and not a reading list (I have no library access for most of the year and I'm not going to chase down papers). Something I can run in half an hour, over and over, every time I catch myself about to put a belief or an institution into the story on the strength of objects alone: the questions in the order I should ask them, what counts as a good enough answer to each, the step where I stop and write some version of we don't know and I invented this, and the step where the question stops being about evidence and becomes a decision about what kind of book I'm writing. I'd like it grounded in whatever archaeology and the philosophy of inference actually say about getting from stuff in the ground to minds — the business of how a pattern in the debris is supposed to connect to a behaviour and then to a belief, what has to be true of an object before it can carry a meaning at all, why the gap keeps reopening — but in plain words I can use, and honest about which steps are really just taste wearing a lab coat. Constraints: I have one undergraduate course and a lot of enthusiasm, I can email the dig director roughly once with three questions so I should know which three to spend, I can't do any fieldwork, and the findings I already printed in book one are fixed and can't be retconned. Also, she used some phrase I half remember, middle-range something or other, that apparently names exactly the move I keep making badly; if that's a real thing, tell me what it is and what it would have me do differently.

  Three cases to run it on, please. (1) The find I keep coming back to: around forty small fired-clay cones, found only in the thresholds of the bigger houses, always in pairs, points facing inward, and in three cases snapped on purpose before being set in the clay. I want a doorway belief — something at the threshold that keeps something out. Does the procedure let me have it, given that my first reader's suggestion was that they're just door sockets or loom weights? (2) What I've been privately calling the counting stones: about two hundred pebbles in a bag under a floor, in eleven distinct size grades, plus a flat stone with rows of matching pits cut into it. I want a grain levy and a person whose job it is to keep the tally, that is, an office and not just a habit — can the procedure get me from objects to an institution, or only to a practice, and what would I have to have found to get the office? (3) The one I already know you're going to spoil for me: my favourite scene in book two is a public judgement, the whole settlement watching while an accused person's hands are tied and they're put into the river, and everyone reading what happens as the river's answer. My evidence is a burial face-down in the channel silts with the wrists bound, and a second one with bound wrists and the hands removed. I have a horrible feeling the procedure lets me keep the burials and takes away the belief, and I'd rather be told that plainly than have it hedged. For each case say what the strongest sentence I can honestly put on the page is. And please flag the cases the procedure can't settle at all — the one where two different belief attributions fit the objects equally well, the one where everything that rotted would have carried the meaning and what survived didn't, and the one where a people three hundred miles away and four centuries later left written curses that sound a bit like what I want — plus tell me what the procedure simply cannot do, no matter how well I run it, so I stop asking it for that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Historical fiction writer, working on a trilogy (Book 3 drafting/author's note phase). Setting: "Hallow Reach," late 3rd Millennium BC (Bronze Age/Chalcolithic-ish), river-valley settlement. No specific dates in text.
      *   **Problem:** A writing group contact (partner of a dig director) challenged the user's inferences from artifacts to beliefs/institutions. The user is struggling to write the Author's Note because they can't distinguish between archaeological consensus and their own invention.
      *   **Goal:** A *procedure* (not a lecture, not a reading list) to evaluate inferences from objects to beliefs/institutions. Needs to be runnable in ~30 mins. Needs to be grounded in archaeological theory (specifically "middle-range theory") but in plain language. Needs to identify where evidence ends and artistic license begins.
      *   **Constraints:** One undergrad course, no library access, can email the dig director *once* with *three* questions. Book 1 findings are fixed (no retconning).
      *   **Specific Term:** "Middle-range something" (Middle-Range Theory).
      *   **Deliverables:**
          1.  The Procedure (steps, questions, stop points).
          2.  Application to three specific cases (Clay Cones, Counting Stones, River Judgement).
          3.  For each case: Strongest honest sentence, flagging of uncertainty types.
          4.  Explanation of what the procedure *cannot* do.

  2.  **Deconstruct the Archaeological Theory (Middle-Range Theory):**
      *   *What is it?* Lewis Binford (Processual Archaeology). It's the bridge between static observations (what we find in the ground) and dynamic past behaviors (what people did).
      *   *The Gap:* Artifacts $\rightarrow$ Behavior $\rightarrow$ Belief/System.
      *   *The Problem:* Ethnographic analogy (looking at modern/traditional societies to guess past ones) vs. Experimental archaeology (testing how things break/work) vs. Pure Speculation.
      *   *Key Concept:* Equifinality (different processes can produce the same result). A broken pot could be ritual killing or accidental drop.
      *   *Application for Fiction:* The procedure needs to force the writer to acknowledge the "bridge" is shaky.

  3.  **Drafting the Procedure:**
      *   Needs to be actionable.
      *   Step 1: Describe the Object (Static).
      *   Step 2: Describe the Context (Association).
      *   Step 3: Functional Explanation (The "Boring" Answer).
      *   Step 4: The Ritual/Social Leap (The "Interesting" Answer).
      *   Step 5: The Equifinality Check (Could it be both? Could it be neither?).
      *   Step 6: The "Stop & Declare" Point (Where to admit invention).
      *   Step 7: The Email Question (Optimizing the one chance to ask the expert).

  4.  **Developing the Three Cases:**

      *   **Case 1: Clay Cones (Thresholds).**
          *   *Data:* 40 cones, big houses, thresholds, pairs, points inward, 3 snapped.
          *   *User Desire:* Doorway belief (keeping something out).
          *   *Alternative:* Door sockets (functional), loom weights (unlikely in threshold), gaming pieces.
          *   *Analysis:* Snapping is key. Functional sockets don't need snapping. Snapping implies "decommissioning" or "killing." Pairs implies duality.
          *   *Verdict:* Plausible ritual, but specific *meaning* (keeping out vs. inviting in) is unknown.
          *   *Strongest Sentence:* Needs to reflect the *action* not the *reason*.
          *   *Uncertainty Flag:* Two different belief attributions fit equally well (Apotropaic vs. Ancestral anchoring).

      *   **Case 2: Counting Stones (Pebbles & Board).**
          *   *Data:* 200 pebbles, 11 sizes, pit board, under floor.
          *   *User Desire:* Grain levy, official office.
          *   *Alternative:* Game (like Mancala), private household accounting, craft production tally.
          *   *Analysis:* 11 grades is specific. Under floor implies hiding or foundational deposit. "Office" requires hierarchy evidence (seal? distinct house?).
          *   *Verdict:* Practice (counting) is solid. Institution (Levy/Office) is weak without administrative seals or comparative house sizes.
          *   *Strongest Sentence:* Focus on the *act* of accounting, not the *authority*.
          *   *Uncertainty Flag:* Everything that rotted would have carried the meaning (bags, grain, receipts) and what survived didn't.

      *   **Case 3: River Judgement (Bound Burials).**
          *   *Data:* Face-down burial in silts, wrists bound. Second one bound + hands removed.
          *   *User Desire:* Public trial by river, river's answer.
          *   *Alternative:* Execution of criminals, sacrifice, burial of enemies, drowning accident (bound?), post-mortem binding to stop ghosts.
          *   *Analysis:* Face-down is deviant burial (shame/danger). Bound wrists = restraint. Hands removed = specific ritual disabling. *Public judgement* is the leap. That requires an audience/witness structure.
          *   *Verdict:* This is the weakest link archaeologically. Deviant burial is clear; *reason* is opaque.
          *   *Strongest Sentence:* Must admit the silence of the dead.
          *   *Uncertainty Flag:* People 300 miles away/400 years later left written curses (Anachronistic/Distant Analogy).

  5.  **Refining the "Middle-Range" Explanation:**
      *   Explain it simply: It's the logic that connects the rock to the hand that moved it.
      *   Why the gap reopens: Context is destroyed by time. Meaning is mental, artifacts are physical.

  6.  **Addressing the Constraints:**
      *   *Email Questions:* Need to be high-value. Not "Is this right?" but "What is the strongest alternative explanation?"
      *   *Author's Note:* How to phrase the admission of invention.
      *   *Book 1 Consistency:* Acknowledge that Book 1 is "canon" for the story, even if archaeologically shaky.

  7.  **Review against User Tone:**
      *   User is smart, frustrated, wants practical tools, hates hedging but wants honesty.
      *   Tone should be professional, direct, empathetic to the creative struggle, but firm on the archaeological limits.
      *   Avoid academic jargon where possible, but define "Middle-Range Theory" clearly.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I give a reading list? No.
      *   *Check:* Is the procedure under 30 mins? Yes, it's a checklist.
      *   *Check:* Did I answer the "three questions for the dig director"? Yes, need to make sure they are distinct.
      *   *Check:* Did I explain what the procedure *cannot* do? Yes, crucial section at the end.
      *   *Check:* Did I address the "Middle-Range" term? Yes.
      *   *Check:* Are the "Strongest Sentences" actually usable? They need to be fiction-ready but honest.

      *(Self-Correction on Case 3)*: The user suspects I'll spoil this one. I need to be gentle but firm. The archaeology of "trial by ordeal" is almost non-existent without texts. I must validate the *drama* while isolating the *evidence*.

      *(Self-Correction on Procedure)*: Make sure the "Stop and Write 'We Don't Know'" step is explicit. That's the core of their Author's Note anxiety.

  9.  **Final Output Structure:**
      *   Introduction (Acknowledging the "Middle-Range" term).
      *   The Procedure (7 Steps).
      *   The Three Questions for the Director.
      *   Running the Cases (1, 2, 3).
      *   What The Procedure Cannot Do (Limitations).
      *   Advice for the Author's Note.

  10. (Final thought on the "Strongest Sentence"): It shouldn't sound like an academic paper. It should sound like a novelist talking to a reader. "Here is what we found, here is what I imagined."

