prompt: |-
  Hey — I'm TAing an intro metaphysics course and I've got the dispositions tutorial next week, one fifty-minute group, first-years who've done counterfactuals (world-similarity, antecedent strengthening, that sort of thing) but nothing on dispositions beyond the slogan that 'fragile' just means 'would break if struck'. I was talking with the other TA and we couldnt agree on how to run it: she wants to open with the counterexamples, I want them to feel the pull of the simple conditional analysis first. What I actually want them to leave with is the sense that the two ways it fails are *seperate* failures — the fink case, where the stimulus itself destroys or removes the disposition, versus the mask case, where the disposition is still there but something blocks the manifestation — and not just two versions of 'the thing didn't break'. So don't write me the explanation; plan how I should run the session.

  The bit I'm least sure about is order: what has to be on the board before the first counterexample lands, whether fink or mask should come first and why, how long to sit with the plain case so the counterexample actually bites, and where the repair attempts belong relative to the two cases — the 'in normal conditions' / ceteris paribus clause, and the move of identifying the disposition with its intrinsic causal basis instead of a counterfactual. Also the example: my instinct is one object in three variants (wine glass: bare / rigged / padded), but I'm worried they'll just learn three labels and never see the structure, so tell me what the carrying example needs and doesn't need and whether a minimal-pair version beats the sci-fi version — they groan at guardian angels and hidden wiring. I was going to try an electrical fuse as a real-world fink, then realised a fuse does conduct for a split second before it melts, which seems to make it useless as a counterexample unless I build the duration into the response. Is that the right way to rescue it, or should I drop it?

  Misconceptions I'm expecting, which I want defused at the point in the sequence where they actually arise rather than in a list at the end: that fink and mask are the same failure; that if the manifestation is blocked the thing was never really fragile; that finks are gerrymandered and couldn't happen in nature; and that 'in normal conditions' fixes everything. Two curveballs I want handled rather than dodged, and I want to know where in the session each fits: (1) my coin-flip fink — a glass wired so that when struck there's a 70% chance a mechanism hardens it, so it usually doesn't break: is this a fink, a mask, or something else, and does it push us toward a probabilistic conditional analysis? (2) a glass that is both padded (mask) and, unknown to anyone, chemically toughened by the padding process ten minutes earlier (fink): which label applies, and is that a real problem or just a boring case of both? Finally, give me one question to put at the end that tells me whether they've got the distinction or just memorised the words — it should be a case they haven't seen — and tell me explicitly what I should refuse to get drawn into at this level (I'd guess dispositional essentialism and the realism-about-powers debate, but tell me what you'd cut).
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intro metaphysics course.
      *   **Topic:** Dispositions (specifically, the Simple Conditional Analysis (SCA) and its failures: Finks and Masks).
      *   **Audience:** First-years. Know counterfactuals (Lewis-style similarity, etc.), but new to dispositions beyond the slogan "fragile = would break if struck."
      *   **Duration:** 50 minutes.
      *   **Goal:** Students must understand that Finks and Masks are *separate* failures of the SCA, not just "thing didn't break." They need to feel the pull of the SCA before seeing it fail.
      *   **Specific Concerns:**
          *   Order of operations (SCA -> Counterexamples -> Repairs).
          *   Fink vs. Mask ordering.
          *   Examples (Wine glass variants vs. minimal pairs vs. sci-fi).
          *   The Fuse example (is it a valid fink?).
          *   Misconceptions to defuse *in situ*.
          *   Two Curveballs (Probabilistic Fink, Double Failure).
          *   Exit Question (assessment of understanding).
          *   What to cut (scope creep).

  2.  **Deconstruct the Content & Constraints:**
      *   *Time:* 50 minutes is tight. Need strict pacing.
      *   *Pedagogy:* Inductive approach (feel the pull -> break it -> fix it) is preferred by the user over starting with counterexamples.
      *   *Conceptual Core:* SCA ($D \leftrightarrow (S \boxright M)$). Fink (disposition lost upon stimulus). Mask (disposition retained, manifestation blocked).
      *   *Examples:* User wants to avoid "guardian angels." Wine glass is standard. Fuse is tricky.
      *   *Curveballs:* Need to integrate the probabilistic fink and the double-failure case naturally.
      *   *Scope:* Avoid deep powers ontology/dispositional essentialism. Stick to the logic of the analysis.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: The Hook & The SCA (0-10 mins)**
          *   Need to establish the SCA clearly on the board.
          *   Use the wine glass.
          *   Get them to agree it *works* intuitively before breaking it.
          *   *Board:* SCA formula, Glass + Strike + Break.

      *   **Phase 2: The First Failure - Which one first? (10-25 mins)**
          *   *Decision:* Mask first or Fink first?
          *   *Reasoning:* Masks are intuitively easier. "It's fragile but wrapped in bubble wrap." The disposition stays, the result doesn't happen. This isolates the "manifestation" problem.
          *   *Fink:* Harder. "It loses fragility *because* it was struck." Requires thinking about intrinsic changes *during* the stimulus.
          *   *Strategy:* Do Mask first to establish that $S \boxright M$ can be false while $D$ is true. Then do Fink to show $D$ can be false while $S \boxright M$ is true (or vice versa depending on formulation). Wait, standard Fink (Lewis's electro-fink) makes the conditional false (doesn't break) but the disposition *was* there? No, Lewis's Fink makes the disposition *disappear* upon stimulus.
          *   *Correction:* In a Fink case, the object *is* fragile, but upon being struck, it loses fragility instantly, so it doesn't break. So $D$ is true, $S \boxright M$ is false.
          *   *Wait, check logic:*
              *   SCA: $x$ is fragile iff if $x$ were struck, $x$ would break.
              *   Mask: $x$ is fragile (True). If struck, breaks? No (False, due to padding). SCA fails.
              *   Fink: $x$ is fragile (True). If struck, loses fragility instantly, doesn't break. SCA fails.
              *   *Wait, Lewis's original Fink:* The wire is live iff if touched, current flows. A finkish mechanism makes it dead when touched. So it's Live (True), but if touched, no flow (False).
              *   *Reverse Fink:* It's not fragile, but if struck, a wizard makes it fragile and it breaks. (SCA says Fragile, Reality says Not).
              *   *User's preference:* "Stimulus itself destroys or removes the disposition." This is the standard Lewis Fink.
          *   *Order:* Mask first is pedagogically smoother. It preserves the disposition, just blocks the result. Fink is weirder (disposition vanishes).
          *   *Example:* Wine glass.
              *   Mask: Padded.
              *   Fink: Needs to be non-sci-fi if possible. User suggested Fuse.
              *   *Fuse Analysis:* A fuse is *designed* to melt. Is it "fragile"? If we define fragility as "breaks under stress," a fuse is fragile. But the finkish element is that the breaking stops the current. That's not a fink *of fragility*.
              *   *Better Fink Example:* Smart material. Glass that detects impact shockwaves and instantly hardens *before* shattering. (User worries about sci-fi).
              *   *Alternative:* The "Sorcerer" case is standard for a reason. But user hates "guardian angels."
              *   *Solution:* Use the "Smart Glass" but frame it physically, not magically. Or stick to the Wire/Lightbulb analogy which is cleaner than glass. Let's stick to the Glass but make the mechanism mechanical/intrinsic if possible. Actually, for first-years, the "Wizard" is often clearer *logically* even if they groan. But the user specifically said "groan at guardian angels."
              *   *Compromise:* Use the "Self-Healing/Hardening Polymer" example. It's real science (mostly). Or, accept the Fuse but clarify the timing.
              *   *User's Fuse Worry:* "Fuse does conduct for a split second."
              *   *Resolution:* A perfect fink requires the disposition to vanish *before* the manifestation completes. If the fuse melts, it manifested. So the Fuse is a bad Fink example for *fragility*. It's better for *conductivity*. Let's suggest switching the property for the Fink case to "Conductive" using the fuse, or stick to the Glass with a "Hardening Field." Let's advise the Hardening Field but keep it brief.
              *   *Actually, best advice:* Stick to one object (Glass) for continuity. Use a "Shock-Absorbing Gel" that evaporates on impact (Mask) vs. "Molecular Realigner" that makes it tough on impact (Fink). Acknowledge the sci-fi but emphasize the *structure*.
              *   *Wait, User wants minimal-pair.* Let's suggest:
                  *   Case 1: Normal Glass (SCA holds).
                  *   Case 2: Padded Glass (Mask).
                  *   Case 3: Smart Glass (Fink).
          *   *Timing:* 15 mins for both. 7.5 each.

      *   **Phase 3: The Repairs & Distinctions (25-35 mins)**
          *   Address "Ceteris Paribus" (Normal Conditions).
          *   Does it fix Mask? Yes (padding isn't normal).
          *   Does it fix Fink? No (the stimulus *causes* the change, it's internal to the stimulus event).
          *   Address Intrinsic Basis.
          *   This is where the structural difference becomes clear. Mask = Extrinsic blocker. Fink = Intrinsic change triggered by stimulus.

      *   **Phase 4: Curveballs (35-45 mins)**
          *   Integrate the Probabilistic Fink and the Double Case.
          *   Probabilistic: 70% hardening. This challenges the binary nature of SCA. Good for showing SCA is too rigid.
          *   Double: Padded + Toughened. Tests if they can disentangle the two mechanisms.

      *   **Phase 5: Exit Question & Wrap (45-50 mins)**
          *   Need a novel case.
          *   Scope Cut: Dispositional Essentialism, Powers vs. Categoricalism.

  4.  **Refining the Logic & Addressing Specific User Queries:**

      *   *Board Work:* Needs to be visible throughout. SCA formula top left. Case studies center. "Why SCA fails" right side.
      *   *Fuse:* I need to be honest. The fuse is a bad example for a Fink *unless* defined very carefully (disposition to conduct *continuously*). It's safer to use a "Smart Material" example but keep it dry. Or admit the Wizard is the clearest logical case even if metaphysically spooky. I will advise using the "Smart Glass" but keeping the description mechanical to reduce "magic" groans.
      *   *Order:* Mask first. Why? Because it preserves the disposition ($D$), making it obvious that $D \neq (S \boxright M)$. Fink is trickier because the disposition disappears *during* the counterfactual scenario.
      *   *Misconceptions:*
          *   "Fink = Mask": Defuse during the Mask/Fink comparison. Focus on *where* the disposition is at the moment of manifestation.
          *   "Never really fragile": Defuse during Mask. Ask "Did the padding change the glass structure?"
          *   "Finks are gerrymandered": Defuse during Fink. Mention real-world analogues (security systems, biological triggers).
          *   "Normal conditions fixes all": Defuse during Repair phase. Fink survives ceteris paribus.
      *   *Curveball 1 (Probabilistic):* Fits in the "Repair" or "Extension" phase. Shows SCA is binary, reality might be graded.
      *   *Curveball 2 (Double):* Fits at the end of the Counterexample phase. Tests distinction.
      *   *Exit Question:* Needs to be a new object/property. Maybe a "Sugar Cube" or "Soluble Pill."
      *   *Scope Cut:* Definitely cut Powers Ontology. Stick to the Conditional Analysis logic.

  5.  **Finalizing the Plan Structure:**
      *   **0-5:** Setup & SCA.
      *   **5-15:** The Mask (Padding).
      *   **15-25:** The Fink (Hardening).
      *   **25-35:** Repair Attempts (CP clauses vs. Intrinsic Basis).
      *   **35-45:** Curveballs (Probabilistic & Double).
      *   **45-50:** Exit Question & Wrap.

  6.  **Self-Correction/Review against constraints:**
      *   *50 mins:* Very tight. Need to warn the TA to be ruthless with time.
      *   *First-years:* Keep jargon low. Use the formula but explain it.
      *   *Fuse:* I will advise dropping the fuse for the Fink. It introduces confusion about "duration of manifestation." The "Smart Glass" is conceptually cleaner even if slightly sci-fi.
      *   *Board:* Specify exactly what goes up.
      *   *Exit Question:* Make sure it's diagnostic.

  7.  **Drafting the Response:** (Mental check of the "Probabilistic Fink" logic).
      *   If 70% chance it hardens: Is it fragile?
      *   SCA: If struck, would it break?
      *   Lewis/Stalnaker: Unique closest world. Does it harden in the closest world? If it's chancy, the counterfactual might be false (or indeterminate).
      *   This pushes toward Probabilistic Counterfactuals. Good discussion point.
      *   *Double Case:* If padded (Mask) AND hardens (Fink). Both prevent breaking. Which label? Both. Is it a problem? No, just overdetermination of failure.

  8.  **Final Polish:** Ensure tone is supportive but directive (TA to TA). Emphasize the *structural* difference (Intrinsic vs Extrinsic, Retained vs Lost).

  *(Self-Correction on the Fuse)*: The user asked specifically about the fuse. I should answer that directly. A fuse *is* a finkish disposition to *conduct*, not to break. If the disposition is "conducts electricity," and touching it makes it stop conducting *before* current flows, that's a fink. But standard fuses melt *after* current flows. So it's not a perfect fink. I will advise dropping it to save time and clarity.

  *(Self-Correction on Order)*: User wants to know Fink vs Mask order. I recommend Mask first. It's the "easier" failure. Fink is the "killer" failure. Build up to the killer.

  *(Exit Question)*: Needs to be novel. "A sugar cube that turns to salt when wet." (Fink). "A sugar cube wrapped in plastic." (Mask). "A sugar cube that turns to salt when wet AND is wrapped in plastic." (Double).
  Wait, I need *one* question. Let's make it a "Soluble Pill" scenario with a twist.

  Okay, ready to write.s
answer: |-
  Here is a 50-minute battle plan designed to hit your specific pedagogical goals while managing the clock.

  ### The Board Plan (Keep this up the whole time)
  **Left Column:** The Simple Conditional Analysis (SCA)
  *   $x$ is $D$ iff ($x$ were $S \rightarrow x$ would $M$)
  *   Example: Fragile iff (Struck $\rightarrow$ Break)

  **Center Column:** The Cases (Fill this in as you go)
  *   1. Normal Glass
  *   2. Padded Glass (Mask)
  *   3. Smart Glass (Fink)

  **Right Column:** Diagnostic Questions
  *   Is the intrinsic structure changed *before* the stimulus?
  *   Is the disposition present *at the moment* of manifestation?
  *   Does "Normal Conditions" fix it?

  ---

  ### 0:00–0:05 | Setup & The Pull of the SCA
  **Goal:** Make the SCA feel obvious before you break it.
  1.  **Write the SCA formula** (Left Column).
  2.  **The Intuition Pump:** Hold up a pen (or point to a window). Ask: "Why is this fragile?" They'll say "Because it breaks if I hit it."
  3.  **Formalize:** Write "Fragile = If Struck $\rightarrow$ Breaks" under the formula.
  4.  **Check:** Ask, "Is there any *other* way to define fragility?" They won't have one yet. Let them sit with the idea that the counterfactual *exhausts* the meaning of the disposition.
  5.  **TA Note:** Do not mention masks or finks yet. If a student asks "What if it's wrapped?", say "We're testing the definition, hold that thought."

  ### 0:05–0:15 | Case 1: The Mask (The "Blocked" Failure)
  **Goal:** Show $D$ is True, but $(S \boxright M)$ is False.
  1.  **The Case:** Write "Padded Glass" in Center Column. Describe a wine glass wrapped in thick bubble wrap.
  2.  **The Vote:** Ask: "Is it still fragile?" (Yes). "If I strike it (through the wrap), does it break?" (No).
  3.  **The Bite:** Point to the board. "SCA says: If it doesn't break, it isn't fragile. Reality says: It is fragile."
  4.  **Defuse Misconception ("Never really fragile"):** Ask: "Did the bubble wrap change the molecular structure of the glass?" (No). "So the fragility is still *in* the glass, just blocked."
  5.  **Board Work:** Under "Padded Glass," write: **Disposition: YES / Manifestation: NO.**
  6.  **The "Normal Conditions" Fix:** Ask students how to save the SCA. They will suggest "in normal conditions." Write this on the board. Ask: "Does padding count as abnormal?" (Yes). So the SCA *might* survive this with a *ceteris paribus* clause. **Do not confirm this yet.**

  ### 0:15–0:25 | Case 2: The Fink (The "Vanishing" Failure)
  **Goal:** Show the disposition is lost *because* of the stimulus.
  1.  **The Example (Drop the Fuse):** The fuse is risky because the melting *is* the manifestation of the fuse's function, which confuses "breaking" with "functioning." Use the **"Smart Glass"** instead. It's sci-fi, but keep it mechanical to reduce groans.
      *   *Script:* "Imagine a glass with a micro-sensor. The nanosecond it detects the shockwave of a strike, it triggers a chemical hardener that makes it steel-hard *before* the impact lands."
  2.  **The Vote:** "Is it fragile *before* I strike it?" (Yes, by hypothesis). "If I strike it, does it break?" (No).
  3.  **The Crucial Distinction:** Ask: "In the Mask case, the glass was fragile *at the moment of impact*. What about here?"
      *   *Answer:* At the moment of impact, it is *no longer* fragile. The stimulus killed the disposition.
  4.  **Board Work:** Under "Smart Glass," write: **Disposition: YES (initially) $\rightarrow$ NO (at impact) / Manifestation: NO.**
  5.  **Defuse Misconception ("Finks are gerrymandered"):** Acknowledge it sounds contrived. Mention real-world analogues: Security systems that wipe data when tampered with, or biological cells that self-destruct upon viral detection. The *structure* matters, not the magic.
  6.  **The "Normal Conditions" Fix:** Ask: "Does 'normal conditions' save us here?"
      *   *Answer:* No. The stimulus *itself* triggers the change. The conditions *of the strike* include the hardening. You can't bracket it out.

  ### 0:25–0:35 | Repairs & Structural Diagnosis
  **Goal:** Cement that these are *separate* failures requiring different fixes.
  1.  **Compare the Board:** Look at the Center Column.
      *   **Mask:** Disposition stays, Extrinsic blocker intervenes.
      *   **Fink:** Disposition goes, Intrinsic change triggered.
  2.  **The Repair:**
      *   For **Masks**, a *ceteris paribus* clause works (exclude extrinsic interferers).
      *   For **Finks**, *ceteris paribus* fails. You need to identify the disposition with its **Intrinsic Causal Basis** (the molecular structure), not the counterfactual outcome.
  3.  **TA Note:** This is where you draw the line. You don't need to solve the metaphysics of powers, just show that SCA fails to track the *basis*.

  ### 0:35–0:45 | The Curveballs (Integration)
  **Goal:** Test flexibility without new theory.
  1.  **Curveball 1 (Probabilistic Fink):** "The sensor only works 70% of the time."
      *   *Ask:* "Is the counterfactual 'If struck, it would break' true or false?"
      *   *Discussion:* In standard Lewisian semantics, if it breaks in the closest 30% of worlds, the counterfactual is false. But our intuition says it's *mostly* fragile.
      *   *Point:* This shows SCA is too binary. It pushes us toward probabilistic counterfactuals, but the *Fink structure* remains (the disposition vanishes in the 70% case).
  2.  **Curveball 2 (The Double Failure):** "The glass is Padded (Mask) AND has the Sensor (Fink)."
      *   *Ask:* "Which label applies?"
      *   *Answer:* **Both.** It is overdetermined.
      *   *Point:* This proves they are distinct mechanisms. If they were the same thing, you couldn't have both. The mask blocks the break; the fink removes the fragility. You can have one without the other, so they are separate failures.

  ### 0:45–0:50 | Exit Question & Scope Cut
  **Goal:** Assessment and boundary setting.

  **The Exit Question (Write on board/slide):**
  > "Consider a sugar cube.
  > Case A: It is wrapped in waterproof plastic.
  > Case B: It is coated in a chemical that instantly turns the sugar into salt the moment water touches it.
  >
  > 1. Which case is the Mask and which is the Fink?
  > 2. In Case B, is the sugar soluble *at the exact moment* the water makes contact?"

  *   **Correct Answer:** A is Mask (solubility remains, blocked). B is Fink (solubility vanishes upon contact). In Case B, it is *not* soluble at the moment of contact (the disposition is lost).
  *   **Diagnostic:** If they say "Both are masks," they missed the intrinsic change. If they say "Case B is soluble," they missed the finkish timing.

  **What to Refuse (Scope Creep):**
  1.  **Dispositional Essentialism:** If a student asks, "But are dispositions *real* properties or just shorthand?", cut it off. "Today we are analyzing the *logic* of the definition, not the ontology. Assume dispositions exist."
  2.  **The Solution to Finks:** If they ask, "So what's the *right* definition?", do not lecture on Lewis's Reformed Analysis or Manley & Wasserman. Say: "Philosophers propose adding 'in virtue of intrinsic properties' to the analysis, but that's for next week. Today, we just needed to see why the Simple version breaks."
  3.  **Quantum Indeterminacy:** If the probabilistic case opens a can of worms about quantum mechanics, close it. "Treat the 70% as a macro-level statistical frequency for the sake of the thought experiment."

  ### Summary of Advice on Your Specific Worries
  *   **Order:** Mask first. It preserves the disposition, making it easier to see that $D \neq (S \boxright M)$. Fink is harder because $D$ disappears *during* the evaluation of the counterfactual.
  *   **The Fuse:** Drop it. The timing issue (conducts *then* melts) makes it a "Delayed Manifestation" rather than a true Fink (Disposition removed *before* manifestation). It will consume 10 minutes of clarification time you don't have. Stick to the "Smart Glass" or "Self-Hardening Metal." Acknowledge it's hypothetical but structurally precise.
  *   **Board Before Counterexample:** You need the SCA formula and the "Normal Glass" baseline. Without the baseline, the counterexamples look like random exceptions rather than systematic failures of a rule.
  *   **Minimal Pair vs. Sci-Fi:** Use the **Same Object** (Glass) for all three cases (Normal, Padded, Smart). This controls variables. Students focus on the *change* (padding vs. sensor) rather than learning new object properties. The "Sci-Fi" element is necessary for the Fink to be clean; real-world finks are messy. Prioritize logical clarity over realism.
