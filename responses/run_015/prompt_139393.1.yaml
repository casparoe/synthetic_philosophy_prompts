answer: |-
  # Session Plan: The Municipal Resilience Fund

  **Time:** 90 Minutes
  **Students:** 26 (13 Principal Teams, 13 Agent Teams). *Note: To make the dynamics work, pair two student teams into one "Principal" and one "Agent" entity. You will have 6 Principal Entities and 6 Agent Entities, with 2 students observing/rotating or acting as auditors.*
  **Correction:** 26 students is awkward for even splits. **Make 5 Principal Teams (2-3 students each) and 5 Agent Teams (2-3 students each).** 1 student acts as the "Banker" (manages the spreadsheet). This leaves 24 students + 1 banker + 1 you.
  **Materials:**
  *   Projector (displaying the Shared Spreadsheet).
  *   Index Cards (for Metrics and Objectives).
  *   Red/Blue Tokens (for scoring).
  *   One Shared Spreadsheet (projected, editable by Banker only).

  ---

  ## 1. The Scenario: "The Municipal Resilience Fund"

  **Narrative:** The city has created a fund to improve **Neighborhood Cohesion** (The Target). Money is tight.
  *   **Principals (City Council):** Care about *Actual Cohesion*. They have a budget of Points to award.
  *   **Agents (Community Orgs):** Care about *Grant Renewal* (Metric Score) AND *Actual Cohesion* (Private Weight).
  *   **The Catch:** "Cohesion" is inherently fuzzy. You (Instructor) hold the "Truth Deck," but you will admit later that it is arbitrary.

  **Setup (10 mins):**
  1.  **Split:** 5 Principal Teams (mix CS/Policy in each), 5 Agent Teams (mix CS/Policy in each).
  2.  **Handouts:**
      *   **Principals:** Receive a **Target Card**. It reads: *"Maximize Neighborhood Cohesion."* (That is all. No definition.)
      *   **Agents:** Receive a **Private Objective Card**. It reads: *"Maximize Metric Score (70% weight) + Maximize Neighborhood Cohesion (30% weight)."*
      *   **Constraint:** Principals are told they have a **Clause Budget**. Initial Metric: **25 Words Max**.
  3.  **The Spreadsheet:** Columns: `Round`, `Team`, `Metric Score`, `Cohesion Points (Hidden)`, `Total Payoff`.
      *   *Note:* The "Cohesion Points" column is hidden until the end of the round.

  ---

  ## 2. The Mechanics of Play

  ### Rounds 1–3: The Specification Trap (45 mins total)
  **Flow per Round:**
  1.  **Spec (5 mins):** Principals write a Metric on an Index Card (max 25 words). They can buy +5 words for 10 Points from their budget.
  2.  **Action (5 mins):** Agents receive the Metric. They secretly choose an **Action Card** from a hand of 3 options.
      *   *Action A (High Metric, Low Cohesion):* "Host a loud block party." (Metric +10, Cohesion +0)
      *   *Action B (Med Metric, Med Cohesion):* "Repair a community center." (Metric +5, Cohesion +5)
      *   *Action C (Low Metric, High Cohesion):* "Mediate a private dispute." (Metric +0, Cohesion +10)
      *   *Note:* Agents do not show the card. They submit the *claimed* Metric Score to the Banker.
  3.  **Audit (5 mins):** You (Instructor) roll a d6 for each team.
      *   **1-4:** No Audit. Agent's claimed score stands.
      *   **5-6:** Audit. You check if the Action *plausibly* matches the Metric text. If not, Score = 0.
      *   *Crucial:* You do not check Cohesion. You only check if the Metric text *could* justify the score.
  4.  **Reveal (5 mins):** Banker enters Metric Score. You reveal the "Cohesion Points" for that round based on the Action Card.
  5.  **Payoff:**
      *   **Agents:** Get Points = Metric Score + (Cohesion Points × 0.3).
      *   **Principals:** Get Points = Cohesion Points ONLY. (They do not care about the Metric Score, only the outcome).

  **Design Note:** In Round 1, Agents will likely pick Action A. Principals will realize their Metric (e.g., "Number of events held") rewarded noise, not cohesion. In Round 2, they will tighten (e.g., "Number of events with >50 attendees"). Agents will pivot to Action B. In Round 3, Principals will try to specify "Quality," but word limits make it impossible.

  ### Round 4: The Under-Measurement Mirror (10 mins)
  **Special Rule:** Agents are given a **"Shadow Action"** card.
  *   **Effect:** Metric Score -5, Cohesion Points +15.
  *   **Instruction:** Tell Agents: *"You have one opportunity to do something that hurts your score but helps the target. You do not have to tell the Principals."*
  *   **Goal:** Stage the failure where the metric *penalizes* the true goal.
  *   **Outcome:** Most Agents will not take it (rational optimization). If one does, highlight it in debrief. If none do, reveal in debrief that the option existed and ask *why* they didn't take it (the metric disincentivized the good).

  ### Round 5: The Inversion (15 mins)
  **Special Rule:** **Agents write the Metric.**
  *   **Flow:** Agents write the 25-word Metric. Principals must **Accept** or **Veto**.
  *   **Cost:** If Principals Veto, both sides get 0 points for the round. If they Accept, they play normally.
  *   **Goal:** Force Agents to signal their private objective. If they write a metric that aligns with Cohesion, Principals should accept. If they write a metric that is easily gamed, Principals must decide if trusting the Agent is better than 0 points.
  *   **Tension:** Agents want to maximize their payoff. Since their payoff includes Cohesion (30%), they *might* write a honest metric. But they also want the easy Metric points.

  ---

  ## 3. Scoring and The Oracle Problem

  **The Apparatus:**
  You (Instructor) hold the **Truth Deck**. This is a stack of index cards with pre-written "Cohesion Definitions" (e.g., "Conflict Resolution," "Resource Sharing," "Social Gathering").
  *   At the start of the game, tell students: *"I hold the definitions of Truth. I will assign Cohesion Points based on these."*
  *   **The Trap:** The definitions are vague. You assign points subjectively based on the Action Card description.

  **Staging the "Oracle Challenge":**
  In the debrief, a sharp student *will* say: *"Your scoring of Cohesion is just another proxy. You're not measuring truth, you're measuring your opinion."*
  *   **Do not defend yourself.**
  *   **Response:** Stand up. Walk to the board. Write: **"THE INSTRUCTOR IS AN AGENT."**
  *   **Say:** "They are right. I am not God. I am another node in the system. My rubric is just another metric with a different weight. If you cannot trust me, who can you trust?"
  *   **Turn it:** Ask the class: *"If the Instructor is a proxy, and the Metric is a proxy, what is left?"* (Let them sit in that silence). This validates the constraint without breaking the game.

  ---

  ## 4. Managing the CS / Policy Split

  **The Friction:**
  *   **CS Students:** Will try to write code-like metrics (`IF attendance > 50 THEN score = 1`). They will frustrate Policy students who want nuance.
  *   **Policy Students:** Will write vague metrics (`Improve community spirit`). They will frustrate CS students who see loopholes.

  **Making it Productive:**
  *   **Rule:** The Metric Card must be signed by *both* the CS and Policy student on the team. If they disagree, they submit nothing and get 0.
  *   **Debrief Prompt:** Ask the CS students: *"Where did the logic break?"* Ask the Policy students: *"Where did the meaning get lost?"*
  *   **Synthesis:** Point out that robust institutions require *both* precise specification (CS) and normative intent (Policy). One without the other fails.

  ---

  ## 5. The Debrief (25 mins)

  **Phase 1: The Post-Mortem (10 mins)**
  *   Ask Principals: *"Did your metric converge on the target?"* (Likely No).
  *   Ask Agents: *"Did you feel like you were gaming, or working?"* (Likely "Working within rules").
  *   Ask about Round 4 (Under-measurement): *"Who took the Shadow Action? Why not?"*
  *   Ask about Round 5 (Inversion): *"Principals, did you trust the Agents? Agents, why did you write what you wrote?"*

  **Phase 2: Naming the Phenomenon (5 mins)**
  *   Ask students: *"What would you call this?"*
  *   Write their terms on the board (e.g., "Metric Corruption," "Rule Beating," "Proxy Failure").
  *   **Then** introduce the terms: **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure") and **Specification Gaming**.
  *   Connect their terms to the academic labels.

  **Phase 3: The "Measurement is Pointless" Objection (5 mins)**
  *   **Prompt:** *"Someone might conclude from this that measurement is broken and we should just trust people. Respond."*
  *   **Guide them to:**
      1.  **Gaming is Diagnostic:** If a metric is easily gamed, it reveals the system's incentives are misaligned. The gaming *told* the Principals something.
      2.  **Incoherent Targets:** Sometimes the Target ("Cohesion") was never well-defined to begin with. The struggle to measure it revealed the target was vague.
      3.  **Necessary Evil:** We cannot operate without proxies. The goal isn't to eliminate metrics, but to manage the *gap*.

  **Phase 4: Limits of the Game (5 mins)**
  *   Be frank about what the game *didn't* teach.
  *   **Real World Stakes:** In the game, failure costs points. In reality, it costs lives or livelihoods.
  *   **Time Horizons:** The game was 90 minutes. Real institutional decay takes decades.
  *   **Power Dynamics:** In the game, Principals and Agents are peers. In reality, Principals often hold coercive power that prevents Agents from speaking up about bad metrics.

  ---

  ## 6. Predictable Failure Modes & Handling

  **1. The "Vague Metric" Loophole**
  *   **Failure:** Principals write "Do good work" to avoid gaming.
  *   **Handling:** Enforce the **Audit Rule**. If the Metric is vague, you (Instructor) act as a strict auditor. "How does 'good work' justify 10 points? Define it." If they can't, score = 0. This forces specification.

  **2. The "CS Takeover"**
  *   **Failure:** CS students write the metric; Policy students disengage.
  *   **Handling:** During the Spec phase, circulate. If a team is dominated, ask the Policy student: *"Does this capture the intent?"* If they say no, tell the team: *"The metric is invalid until both signatures agree."*

  **3. The "Collusion" Collapse**
  *   **Failure:** Agents and Principals agree to split points and ignore the game.
  *   **Handling:** Keep the **Private Objective Cards** hidden. Principals do not know Agents value Cohesion at 30%. Principals think Agents are purely selfish. This information asymmetry prevents easy collusion.

  **4. The Debrief Lecture**
  *   **Failure:** You start explaining Goodhart's Law too early.
  *   **Handling:** Tape your mouth (metaphorically). Use the **"What happened?"** question repeatedly. Do not offer the label until they have described the mechanism in their own words. If you slip, stop and ask: *"I just gave you an answer. Why did I do that? Was I gaming the clock?"*

  ---

  ## 7. What The Game Cannot Reproduce (Say This Aloud)

  In the final 5 minutes, explicitly state:
  1.  **Malice vs. Incentive:** In this game, Agents weren't "bad." They optimized. In the real world, actors are sometimes malicious, not just rational.
  2.  **The Cost of Measurement:** In this game, writing metrics was free (mostly). In reality, measuring things costs money and time, which subtracts from the Target.
  3.  **The "True Target" Illusion:** We pretended "Cohesion" existed. Often, in politics, the Target is *created* by the Metric, not the other way around. The game assumes a Target exists; reality often doesn't.

  ---

  ## 8. Instructor Cheat Sheet (The "Truth" Mechanics)

  *   **Spreadsheet Columns:** `Team`, `Round`, `Metric Words`, `Claimed Score`, `Audit? (Y/N)`, `Final Metric Score`, `Cohesion Points (Hidden)`, `Agent Payoff`, `Principal Payoff`.
  *   **Cohesion Points Assignment (For Your Eyes Only):**
      *   Action A (Party): 0 Points.
      *   Action B (Repair): 5 Points.
      *   Action C (Mediate): 10 Points.
      *   Shadow Action: 15 Points.
  *   **The Oracle Challenge:** If a student challenges your scoring of Cohesion:
      1.  Pause.
      2.  Say: "You are correct."
      3.  Write on board: **"All Measurement is Proxy."**
      4.  Move on. Do not justify.

  This design forces the collision. It respects the constraints. It makes the "Oracle" limitation a feature, not a bug. It creates the specific friction between CS precision and Policy intent you requested.
