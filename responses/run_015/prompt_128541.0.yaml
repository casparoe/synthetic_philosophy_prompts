  # Joint Statement on Epistemic Limits and Methodological Divergence

  **Signatories:** The Source Criticism Working Group & The Archive Skepticism Collective
  **Date:** October 26, 2023
  **Subject:** Protocols for Inferring Reality from Fragmentary Records

  Following a series of good-faith debates regarding the reconstruction of the distant past (specifically c. 500 BCE – 500 CE), we issue this joint statement. While we remain divided on the *weight* assigned to specific evidentiary types, we agree on the fundamental constraints of our discipline. This document outlines our shared methodological baseline, catalogs our irreducible disagreements, and identifies specific empirical cruxes where our divergent methods yield different predictive outcomes.

  ### I. Agreed Methodological Claims

  1.  **The Mediation Principle:** Neither text nor artifact offers unmediated access to past events. All evidence is the product of selection, whether by an ancient author choosing what to record, a scribe choosing what to copy, or a depositor choosing what to discard.
  2.  **The Necessity of Inference:** Historical knowledge is never purely observational. It is always an inference drawn from the intersection of surviving traces. "Direct observation" is limited to the artifact itself; the event it references is always reconstructed.
  3.  **The Non-Randomness of Survival:** The corpus of surviving evidence is not a random sample of the past. It is skewed by material durability (stone vs. papyrus), institutional power (state archives vs. private letters), and later curation (canon formation).
  4.  **The Function of Cross-Checking:** Comparing independent sources is the primary mechanism for testing reliability. However, "independence" is difficult to establish, as texts often share lost common ancestors, and artifacts often share common cultural production modes.
  5.  **The Reality of Structural Silence:** Gaps in the record are not merely missing data points; they are structural features. Silence can indicate either that an event did not happen, or that the event happened but fell outside the categories of what was deemed recordable by the surviving archive.
  6.  **The Hermeneutic Circle:** We cannot interpret evidence without prior assumptions about the context, yet we derive our understanding of the context from the evidence. Both sides agree this circle exists; we disagree on how tightly it can be closed.

  ### II. Table of Persistent Disagreements

  | Methodological Issue | Position of the Source Critic | Position of the Archive Skeptic |
  | :--- | :--- | :--- |
  | **1. Consensus as Corroboration** | When multiple texts with different biases report the same core event, the probability of the event's occurrence increases significantly. Convergence suggests a "hard kernel" of fact beneath the bias. | When multiple texts report the same core event, it often indicates a shared ideological framework or reliance on a single lost official narrative. Convergence suggests a "shared fiction" or hegemonic discourse. |
  | **2. The Weight of Silence** | If a source is expected to mention an event (e.g., a victory) and does not, this *argumentum ex silentio* carries negative evidentiary weight, provided the survival rate of such sources is high. | Silence is the default state of the ancient archive. Absence of evidence is rarely evidence of absence, because the archive systematically excludes the voices of the marginalized, the defeated, and the mundane. |
  | **3. Material vs. Textual Priority** | Text provides the necessary semantic framework to interpret material remains. A ruin is a "temple" or "barracks" primarily because contemporary inscriptions label it as such. | Material remains often contradict textual categories. Objects functioned in ways texts did not record. We must allow the physical distribution of artifacts to challenge the textual taxonomy. |
  | **4. Correcting for Bias** | Bias is a distortion that can be mathematically or philologically corrected. By identifying the author's intent, we can subtract the bias to reveal the underlying event. | Bias is constitutive, not additive. You cannot subtract the author's worldview to find the "event," because the event was only intelligible to them *through* that worldview. |

  ### III. Defined Cruxes and Predictive Cases

  We identify two specific epistemological cruxes where our methods diverge sharply. For each, we have selected a concrete historical case. We record our predictions here to allow for future evaluation based on new evidence or methodological refinement.

  #### Crux A: The Epistemic Value of Non-Contradiction
  **The Question:** Does the absence of contradictory sources in a fragmentary record count as genuine corroboration of a narrative, or is it an artifact of survival bias (i.e., the dissenting records were the ones destroyed)?

  *   **Concrete Case:** **The Persian Account of the Greco-Persian Wars (490–479 BCE).**
      *   *Context:* Greek sources (Herodotus, Aeschylus, etc.) provide detailed narratives of Persian defeats. Contemporary Persian imperial inscriptions from this period are silent on these specific campaigns, focusing instead on internal stability and tribute.
  *   **Source Critic Prediction:**
      *   The lack of Persian *contradiction* regarding the battles (e.g., Marathon, Salamis) corroborates the Greek narrative. If the Persians had won decisively, traces would have survived in imperial propaganda or administrative shifts. The silence is a result of the destruction of Persepolis, not the non-existence of the events. The Greek consensus holds the "hard kernel."
  *   **Archive Skeptic Prediction:**
      *   The lack of Persian contradiction is an artifact of genre and survival. Persian royal inscriptions follow a rigid liturgy of cosmic order; they do not record military setbacks by definition. Furthermore, the "Greek consensus" relies on a single tradition (Herodotean) that served Athenian imperial ideology. The silence of the Persian archive proves only that these events did not register as significant disruptions to the Imperial center, regardless of the tactical outcome.

  #### Crux B: The Imposition of Categories on Material Traces
  **The Question:** Can material traces be interpreted without importing present-day (or text-derived) categories, or does the act of classification inevitably distort the past function of the object?

  *   **Concrete Case:** **The Function of Minoan "Palaces" (e.g., Knossos, c. 1700 BCE).**
      *   *Context:* Large architectural complexes with storage magazines, throne rooms, and ritual spaces. No deciphered internal textual records (Linear A) exist to define their purpose. Interpretations rely on later Greek textual categories ("palace," "temple," "state") and archaeological layout.
  *   **Source Critic Prediction:**
      *   We can reliably infer function by analogy with later, text-rich societies (e.g., Mycenaean Linear B palaces). The architectural differentiation (throne room vs. storage) maps onto political and economic categories we understand. The material record confirms a centralized bureaucratic state similar to textual descriptions from the subsequent period.
  *   **Archive Skeptic Prediction:**
      *   Using terms like "palace" or "state" imports Bronze Age Near Eastern or Classical Greek political categories that may not apply. The material traces (e.g., large jars, ritual vessels) may indicate a ritual-economic hub where "storage" and "offering" were the same act. The "centralization" we see is a projection of modern state theory onto a heterarchical network. The material record should be described purely topologically until it contradicts the textual analogy, not confirmed by it.

  ***

  **Signed,**

  *For the Source Criticism Working Group:*
  "We maintain that without a presumption of referentiality, history collapses into fiction."

  *For the Archive Skepticism Collective:*
  "We maintain that without a presumption of structural exclusion, history collapses into propaganda."
