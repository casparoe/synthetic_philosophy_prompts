      *   In the Logic objection, "reliable" is ambiguous between *truth-tracking* and *fitness-conducive*.
      *   *Crucial Distinction:* For logic/induction, fitness and truth might *converge*. You can't survive if you can't reason validly about physical objects (e.g., "If tiger, then run"). False logic leads to death.
