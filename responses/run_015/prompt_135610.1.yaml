          *   Specific Question 2: How to handle the "divergence case" (if evolution favored nepotism but we reject it)?
          *   Diagnosis: Suspects "reliable" is equivocal across the premises.

  2.  **Deconstruct the Objection (The "Logic/Induction" Challenge):**
      *   This is a classic objection to EDAs (often associated with Plantinga, but applied here to ethics vs. logic).
      *   The core tension: If evolution selects for *fitness*, why trust *any* cognitive faculty (including the one producing the EDA)?
      *   If the EDA works, it proves too much (global skepticism). If it doesn't work on logic, why does it work on ethics?

  3.  **Evaluate the Options (Which step to drop?):**

      *   *Option A: Drop (1) - The Reliability Requirement.*
          *   Cost: Undermines the whole EDA. Need a different account of justification.
