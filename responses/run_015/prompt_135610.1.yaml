  8.  **Refining the "Logic vs. Morality" Distinction:**
      *   Why does evolution track truth in logic? Because logical consistency is required for successful action in a causal world. (Instrumental value of truth).
      *   Why not morality? Because moral truth (if it exists) might demand self-sacrifice, which is anti-fitness.
      *   *Caveat:* This assumes Moral Realism. If Error Theory, there is no moral truth to track. But the EDA is usually aimed at Realists to show they can't *know* their truths.
      *   *Better angle:* The "Content" of logic is formal. The "Content" of morality is substantive. Evolution selects for substantive outcomes that aid survival, not necessarily formal consistency (though consistency helps). Actually, evolution likely selects for *heuristics*, not strict logic.
