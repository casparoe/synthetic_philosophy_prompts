answer: |-
  This is a classic problem in normative ethics: you have strong intuitions about specific cases, but they don't immediately map onto a single rule like "markets are good" or "markets are bad."

  To get a consistent story, we need a principle that distinguishes between **market allocation** (where money decides) and **non-market allocation** (where need, time, or equality decides), while also accounting for **coercion** (when a choice isn't truly free).

  Here is a principle that captures the structure of your judgments, followed by what it forces you to conclude about your conflicted and new cases.

  ### The Principle: "Vulnerability and Institutional Integrity"

  A market transaction is **impermissible** if it meets either of these two conditions:

  1.  **Trapped Necessity (Vulnerability):** One party is exploiting the other's acute inability to walk away. This happens when a good is essential for survival *and* the buyer/seller is trapped by circumstance (disaster, medical emergency) rather than simple preference.
  2.  **Queue Corruption (Integrity):** The transaction introduces money into a system designed to allocate based on a non-market metric (like medical need, civic equality, or random chance), thereby defeating the purpose of that system.

  Conversely, transactions are **permissible** if they involve fungible goods/services, voluntary agency, and systems where money is a valid sorting mechanism.

  ---

  ### How It Resolves Your Splits

  **1. Water (Hurricane) vs. Tomatoes (Frost)**
  *   **Verdict:** Consistent with your gut.
  *   **Why:** This is **Trapped Necessity**.
      *   **Water:** In a hurricane, you cannot go to a different store, and you cannot choose not to drink. You are trapped. The seller has monopoly power over a life-sustaining resource. That is exploitation.
      *   **Tomatoes:** A frost reduces supply, but you can eat peppers, or wait, or buy frozen. You are not trapped. The price hike rations a luxury/comfort, not a lifeline.

  **2. DMV Line vs. Transplant List**
  *   **Verdict:** Consistent with your gut.
  *   **Why:** This is **Queue Corruption**.
      *   **DMV:** The line is based on *time*. Time is fungible; my hour is the same as your hour. Selling a spot just swaps time for money. It doesn't hurt the *purpose* of the DMV (processing people).
      *   **Transplant:** The list is based on *medical urgency/need*. Money is irrelevant to how sick you are. Allowing sales converts a "save the sickest" system into a "save the richest" system, corrupting the medical purpose.

  **3. Surrogacy vs. Selling a Newborn**
  *   **Verdict:** Consistent with your gut.
  *   **Why:** This is **Agency vs. Personhood**.
      *   **Surrogacy:** You are selling a *service* (labor/gestation) using your own body. You retain agency.
      *   **Newborn:** You are selling a *person* who cannot consent. This violates the boundary that human beings are not property. (This fits under Integrity: the institution of family/parenthood is not a market).

  ---

  ### The Conflicted Case: Paying Low-Income Residents to Vote

  **The Principle's Verdict: Not Fine.**

  You should move this into the "Not Fine" column. Here is why:
  *   **Queue Corruption:** Voting is a civic institution based on political equality ("one person, one vote"). Introducing payment turns a civic duty into a gig. It changes the nature of the act from "participating in governance" to "performing labor for cash."
  *   **Vulnerability:** Even if there is "no instruction on how to vote," paying specifically low-income residents targets economic vulnerability. $20 is negligible to a rich person but significant to a poor one. This creates an undue inducement that compromises the voluntariness of the participation. It risks creating a class of professional voters whose participation is bought, not motivated by civic engagement.

  **The Trade-off:** To keep your principle simple, you have to accept that "increasing turnout" does not justify "monetizing citizenship."

  ---

  ### Predictions for New Cases

  **1. A woman in financial trouble selling a kidney to pay off debt.**
  *   **Prediction: Not Fine.**
  *   **Reasoning:** This fails the **Vulnerability** test. Your "Healthy Kidney" verdict relied on the seller being "fully informed, healthy otherwise." Implicit in that was the idea of *agency*. If she is selling to pay off debt, she is under **Desperation Coercion**. She isn't selling because she prefers $50k to a kidney; she is selling because she is trapped by debt. This is structurally identical to the hurricane victim buying water: one side is trapped by circumstance.
  *   **Cost:** This forces you to refine your original "Healthy Kidney" intuition. Is it fine *only* if the money is for luxury/upside, not debt/survival? The principle demands you distinguish between "opportunity" and "desperation."

  **2. A rich person buying a slot in a lottery for a subsidized apartment.**
  *   **Prediction: Not Fine.**
  *   **Reasoning:** This fails the **Queue Corruption** test. Subsidized housing is allocated based on *need* (income level). A lottery is used to fairly distribute scarce need-based resources. Allowing a rich person to buy a slot introduces money into a system designed specifically to help those *without* money. It defeats the purpose of the subsidy.
  *   **Comparison:** This is exactly like selling a place on the transplant list. The queue is meant for need, not wealth.

  ---

  ### The Cost of Consistency

  You asked for honesty about which verdicts you might have to drop to keep the principle usable. Here is the friction:

  1.  **The "Healthy Kidney" Case is Fragile.**
      *   If the principle bans transactions driven by "acute vulnerability," you have to ask: Is $50k life-changing money? For most people, yes. If the motivation is financial improvement, is that distinct enough from "debt relief" to count as free agency?
      *   *To stay consistent:* You must argue that there is a bright line between "selling for a better life" (Fine) and "selling to avoid ruin" (Not Fine). If you can't distinguish those, you have to mark the kidney sale as **Not Fine**.

  2.  **Surrogacy is on the Edge.**
      *   Some ethicists argue surrogacy fails the **Integrity** test (commodifying reproduction) or the **Vulnerability** test (wealthy couples exploiting poor women).
      *   *To stay consistent:* You have to hold firm that gestation is *labor*, not *personhood*. If you ever feel that a surrogate is "selling a baby" rather than "renting a womb," your principle will force you to ban it.

  3.  **Paying to Vote.**
      *   You must drop the hope that this could be a clever way to help democracy. The principle classifies it as corruption of the civic sphere.

  ### Summary
  Your gut is operating on a **Pluralist** framework: Markets are great tools, but they are servants, not masters. They are forbidden when they prey on the trapped (Hurricane Water, Debt Kidney) or when they invade spheres meant to be protected from wealth (Democracy, Medical Triage, Human Rights).

  If you adopt **"Vulnerability and Institutional Integrity,"** you get a clean story for 90% of your cases. The price you pay is having to scrutinize the *financial motivation* behind bodily sales (Kidney/Plasma) to ensure they aren't actually desperation in disguise.
