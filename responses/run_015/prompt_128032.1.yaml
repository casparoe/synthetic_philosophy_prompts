answer: |-
  Your intuition is remarkably astute. You have identified that much of the stalemate in this debate stems from a conflation of normative claims with formal properties of aggregation functions, disguised as a simple disagreement about 'equality'. As a software engineer, you are correct to suspect that the parties are often arguing past one another because they are presupposing different constraints on the 'system' of moral evaluation.

  However, to diagnose this accurately, I must first offer a slight correction to the taxonomy you have presented, as this clarification is essential to understanding where the impasse lies. In the philosophical literature, the view you describe as weighting benefits to the worse off is indeed **Prioritarianism** (championed by Derek Parfit and Richard Arneson). However, standard Prioritarianism is specifically designed to *avoid* the Leveling-Down Objection (LDO). On a Prioritarian view, leveling down is strictly worse in *every* respect, because it reduces the total sum of transformed (weighted) welfare without increasing anyone's well-being.

  The side that accepts the LDO—that leveling down is 'better in one respect'—is typically **Telic Egalitarianism** (defended by Larry Temkin). They argue that equality is intrinsically valuable, so a more equal world is *pro tanto* better, even if it is worse for everyone. The impasse you observe is not usually *within* Prioritarianism, but rather *between* Prioritarians (who use the LDO to reject Egalitarianism) and Telic Egalitarians (who bite the bullet of the LDO to save intrinsic equality).

  With that distinction in place, let us diagnose the structure of the disagreement using your engineering lens.

  ### 1. The Formal Clash: Properties of the Aggregation Function

  You hypothesised that this is a dispute about the mathematical properties of moral aggregation. You are largely correct. The debate can be modelled as a disagreement over the specifications of a Social Welfare Function (SWF).

  *   **The Prioritarian Function:** This camp proposes a function $W = \sum f(u_i)$, where $u_i$ is the welfare of individual $i$, and $f$ is a strictly increasing, concave function. This satisfies **Separability**: the moral value of a change in $u_i$ depends only on the level of $u_i$, not on $u_j$. In your load-balancing analogy, this is like prioritising packets from congested nodes based solely on their absolute queue depth, regardless of the state of other nodes.
  *   **The Egalitarian Function:** This camp proposes a function that includes a term for inequality, such as variance or the Gini coefficient. $W = \sum u_i - \lambda \cdot \text{Inequality}$. This violates Separability. The moral value of $u_i$ depends relationally on $u_j$. In your analogy, this is like penalising a node simply for having lower latency than its neighbour, even if the neighbour's latency is not improved.

  The Leveling-Down Objection is essentially a test of **Person-Affecting Restriction**. The Prioritarian insists that for a state of affairs to be 'better', it must be better *for someone* (or at least not worse for anyone while being better for some). The Egalitarian rejects this constraint on the aggregation function, allowing the 'system value' to increase even if no individual 'node' sees an improvement.

  When the Prioritarian says the LDO reveals an absurdity, they are asserting a formal constraint: *Value must be grounded in individual welfare gains.* When the Egalitarian replies that it is 'better in one respect', they are asserting that the aggregation function has multiple output channels: one for 'Total Welfare' and one for 'Distributional Fit'.

  Therefore, a significant portion of the stall is indeed a formal dispute about whether the moral aggregation function must satisfy **Strong Separability** and the **Person-Affecting Principle**.

  ### 2. The Normative Bedrock: Intrinsic vs. Instrumental Value

  While the formal properties differ, the disagreement is not *merely* verbal or mathematical. It reflects a deep divergence in bedrock intuitions about what constitutes value.

  *   **The Prioritarian Intuition:** Value is fundamentally about the quality of individual lives. Inequality is only bad instrumentally (e.g., because it causes social unrest or indicates neglected needs). If you remove the instrumental harms, removing inequality by making everyone poorer adds no value. To them, the Egalitarian's claim is akin to saying a server farm is 'better' because the lights are blinking in a symmetrical pattern, even if throughput has dropped.
  *   **The Egalitarian Intuition:** There is a relational value to human lives that is not captured by summing individual utilities. Parity and reciprocity matter intrinsically. To them, the Prioritarian view fails to capture the moral complaint of the worse-off, which is often not 'I have too little' but 'I have less than *you*'.

  This is not a formal error on either side; it is a clash of axiological primitives. The Prioritarian treats individual welfare as the only 'atomic' value. The Egalitarian treats the *relation* between welfare levels as an additional atomic value. No amount of formalisation can prove one primitive 'correct' without begging the question.

  ### 3. Distinct Projects: Axiology vs. Decision Theory

  You also asked if this involves two distinct projects running under a single heading. This is a crucial insight.

  *   **Axiological Project:** This asks, "Which state of affairs is better?" Telic Egalitarians operate here. They are ranking outcomes. For them, admitting that leveling down is 'better in one respect' is a consistent claim about outcome ranking.
  *   **Deontic/Decision Project:** This asks, "What ought we to do?" Most philosophers (including many Egalitarians) agree that we ought *not* to level down.

  The impasse often arises because Prioritarians attack the Egalitarian view on deontic grounds ("Surely we shouldn't do this!"), while Egalitarians defend it on axiological grounds ("It is still a more equal state of affairs").

  Larry Temkin, a leading defender of the view that leveling down is better in one respect, explicitly argues that we must distinguish between what is 'all-things-considered better' and what is 'better in a respect'. He argues that the Prioritarian conflates the two. If the Prioritarian insists that 'better' implies 'better all-things-considered', and the Egalitarian insists that 'better' can mean 'better regarding the specific value of equality', they are speaking different logical languages.

  ### Diagnosis and Prospects for Progress

  Is the impasse irreducible? I would diagnose it as a **hybrid stalemate**.

  1.  **Formal Clarity is Possible:** We can make progress by explicitly formalising the weighting functions. If we treat morality as a multi-objective optimisation problem, we can acknowledge that 'Equality' and 'Efficiency' are distinct objective functions. Progress here involves admitting that Prioritarianism is a single-objective function (transformed welfare) while Egalitarianism is multi-objective (welfare + equality). This dissolves the confusion about 'weighting': it is not a single weight, but a vector of values.
  2.  **Conceptual Distinction:** The distinction between 'all-things-considered' betterness and 'pro tanto' (in one respect) betterness is the most promising conceptual tool. If both sides agree that we should never *actually* level down (deontic agreement), the dispute shrinks to whether the universe 'cares' about equality in the abstract (axiological disagreement).
  3.  **Irreducibility:** Ultimately, the dispute rests on the **Person-Affecting Intuition**. If you feel that a world cannot be better unless it is better for someone, you will be a Prioritarian. If you feel that a world can be impersonally better (e.g., more beautiful, more just) even if no one benefits, you will be a Telic Egalitarian. This is a difference in 'moral perception' that formalisation cannot bridge.

  ### Conclusion

  Your suspicion is well-founded: the debate is partly a verbal and formal dispute about the properties of the aggregation function (specifically Separability and the Person-Affecting Restriction) disguised as a normative argument. However, it is not *only* that. It reflects a genuine divergence in whether value is solely located in individual experiences or also in the relations between them.

  Progress would not come from one side 'winning', but from a precise formalisation that acknowledges the multi-objective nature of the Egalitarian view, coupled with an explicit agreement that the 'better in one respect' claim does not entail a policy prescription to level down. Until the debate moves from "Is leveling down absurd?" to "What are the precise formal properties of our social welfare function and do we accept non-person-affecting values?", the impasse will remain.

  In short, you are looking at a system architecture disagreement where one team insists on a monolithic database (Prioritarianism) and the other insists on a distributed ledger with consistency checks (Egalitarianism). Both can be made consistent internally, but they optimise for different constraints.
