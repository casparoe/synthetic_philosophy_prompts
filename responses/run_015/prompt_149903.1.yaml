answer: |-
  The bottle was mostly sediment and regret, the kind of Cabernet that tastes like pennies and wood stain. Elias swirled the last dregs in his glass, staring at the red smear on the tablecloth.

  "You're asking for a measure," Julian said, rubbing his temple. "If the landscape is real, we just need to derive the probability distribution. Non-empirical confirmation. It's valid."

  "It's a hall pass," Elias said. "You're saying the theory is true because we haven't found a better one, not because it matches the world."

  "It matches *our* world."

  "Because it allows for *any* world." Elias leaned forward, the chair creaking. "Look, tell me if this sounds familiar. A census taker claims he knows the exact demographic breakdown of the entire country. But he never leaves his porch. He never knocks on a door."

  Julian sighed. "Where is this going?"

  "When you ask him for his data, he says, 'I didn't need to go out there. I assumed that every possible type of person *must* exist somewhere. And since I am a person standing on a porch, the math checks out.'" Elias took a sip of the coppery wine. "He says observing himself confirms the existence of everyone he can't see."

  "That's a straw man."

  "It's your measure problem." Elias set the glass down hard. "To confirm your prediction, you need a cosmic census of bubbles we can't touch, causally disconnected from us. You need to know what's happening in every other universe just to validate the one we're in. You're smuggling in a God's-eye view to prove a theory of local physics."

  Julian opened his mouth, then closed it.

  "You want to talk about the compactification?" Elias gestured vaguely with a corkscrew. "You're treating the **Calibi-Yow** manifold like a menu where every dish gets served. But you can't see the kitchen. You can't even see the other tables."

  "Calabi-Yau," Julian corrected automatically, quiet.

  "Right. Anyway. The census taker isn't a statistician, Julian. He's a theologian with a clipboard. You're not doing physics anymore. You're praying for a multiverse so you don't have to falsify this one."

  Julian stared at the stain on the table for a long moment. Then he reached for the bottle, found it empty, and sat back.

  "Fair," he said. "But it's a beautiful prayer."
