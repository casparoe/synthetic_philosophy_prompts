      *   *Testing the Rule:*
          *   1610: Passes Blind Stratigrapher (mostly), Passes Cooked-Rock. *But* is it sharp enough?
          *   1950: Passes both perfectly. *Crucial Point:* Their rule actually supports the one they dislike.
          *   Early Farming: Fails "Blind Stratigrapher" on *sharpness* (it's a ramp).
          *   Diachronous: Fails "Blind Stratigrapher" on *correlation* (can't line up the layers globally).
          *   Procedure: Distinguish between Rock (discovered) and Definition (decided).
      *   *Refining the Principle:* The user's rule is good but maybe too strict on the "Cooked-Rock" aspect for Quaternary science. Let's call it the **"Independent Correlation Principle."** Can the layer be found without human history books?
