      *   **The Proposed Rule:** They suggest a two-part test: (a) "Blind Stratigrapher" (would an alien/future geologist see it without human context?) and (b) "Cooked-Rock" (would it survive metamorphism?).
      *   **The Task:**
          1.  Test their proposed rule against their five specific verdicts.
          2.  Repair or replace the principle if it doesn't fit.
