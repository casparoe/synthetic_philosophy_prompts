  I am drafting a one-page workshop pitch on conceptual framing in invertebrate ethics. I need a short research proposal—roughly 500 words—for a six-week conceptual project on the following tension in the scale argument for insect sentience. The standard argument holds that because there may be 10^19 insects, a very low per-capita probability of sentience (e.g., 0.01) still yields enormous aggregate moral weight. What strikes me is that proponents usually apply this probability as a linear discount on total welfare, yet they also treat the same low probability as justifying a near-threshold exclusion of individual-level obligations—so that costly intervention for any particular insect is unwarranted. This looks like a hidden double standard: linear aggregation for the population, but threshold-based dismissal for the individual. Existing literature tends to treat either the evidential basis for sentience or the aggregation mechanics separately, without asking whether the argument implicitly relies on incompatible decision rules under deep uncertainty. My proposed question is precise: is there a coherent normative framework that licenses both the linear aggregation move and the individual-level threshold move, or does consistency force a choice between pure expected-value reasoning (which seems to obligate micro-interventions) and a strong threshold view (which dissolves the scale problem entirely)? The method should be conceptual, not empirical: analyze formal decision-theoretic models of moral risk under severe uncertainty, compare them to structurally analogous cases in public-health ethics where low-probability high-stakes harms are aggregated across populations, and determine which combinations of aggregation rules and action thresholds are internally consistent. A successful deliverable would be a taxonomy of consistent versus inconsistent pairings, with clear criteria for when the scale argument retains its force. Failure would mean demonstrating that the apparent tension dissolves—perhaps because aggregation and individual decision operate in different normative registers—leaving the standard argument untouched. The scope must be realistic for six weeks with no data collection. Do not include a bibliography or citation list; I will add references. Please write this as a polished proposal with the question stated precisely, the gap in existing answers explained, the conceptual approach justified against obvious alternatives, the result and failure conditions specified, and an honest assessment of scope.
