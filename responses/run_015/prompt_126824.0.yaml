answer: |-
  **MEMORANDUM**

  **TO:** Freelance Interpretation Writers
  **FROM:** Head of Interpretation
  **SUBJECT:** Procedure for Historiographical Self-Audit (2-Hour Protocol)

  ### 1. Theoretical Preamble: What Survives and What is Assumed

  You are not required to read Ranke, Carr, or White. However, this procedure embodies specific decisions about their theories which you must understand to apply the tools correctly.

  **Distinctions Retained:**
  *   **Source-Anchored:** Claims verifiable by documents/artefacts independent of our narrative. (Survives).
  *   **Frame-Dependent:** Claims true only within a specific perspective (e.g., economic growth vs. worker welfare). (Survives).
  *   **Particle Audit:** The hunt for words that impose a story shape. (Survives).

  **Distinctions Dropped:**
  *   **Narrative-Collateral:** This category is merged into **Frame-Dependent**. If a truth draws its force from a story we do not explicitly own, it is treated as a framing choice that must be justified or removed.

  **Theoretical Assumptions:**
  *   **Against Carr:** We proceed on the assumption that *some* facts are stable enough to be treated as objective (Source-Anchored). We do not paralyses ourselves acknowledging every selection bias, but we must not hide selection that alters meaning.
  *   **Against White:** We assume neutral narration is possible. We reject the idea that *all* emplotment is propaganda, but we treat unintentional emplotment (via particles) as an error.

  ---

  ### 2. The 2-Hour Audit Procedure

  **Step 1: The Particle Sweep (15 Minutes)**
  Scan your text for the following 'story-shaping' particles. Circle them.
  *   *Temporal/Teleological:* Finally, eventually, began to, started to, still, already, yet, soon.
  *   *Evaluative:* Sadly, fortunately, wisely, foolishly, inevitably, naturally.
  *   *Exclusivity:* Only, merely, just, simply.

  **Action:** For every circled word, ask: *Does this word tell the reader how to feel about the timeline?*
  *   If **Yes**: Remove it or replace it with a date/measure.
  *   *Example:* "The pit **finally** reopened" → "The pit reopened in 1926."

  **Step 2: Sentence Tagging (45 Minutes)**
  Read every sentence. Assign one of two tags in the margin:
  *   **[SA] Source-Anchored:** Can this be proven by a specific record, artefact, or consensus data without needing our interpretation? (e.g., "The mill opened in 1842.")
  *   **[FD] Frame-Dependent:** Does this rely on a specific viewpoint to be true? (e.g., "The mill brought prosperity." *Prosperity for whom?*)

  **Action:**
  *   **[SA]** sentences require no change.
  *   **[FD]** sentences must pass the Reversibility Test (Step 3).

  **Step 3: The Reversibility Test (30 Minutes)**
  Take every **[FD]** sentence. Can you write a sentence of the opposite valence that is *equally* supported by the sources?
  *   *Text:* "The manufacturer cared for his workers."
  *   *Reverse:* "The manufacturer controlled his workers."
  *   *Question:* Do the sources support both?
      *   If **No** (Only one is supported): Change the tag to **[SA]**.
      *   If **Yes** (Both are supported): You have identified a historiographical choice. Proceed to Step 4.

  **Step 4: Decision and Handoff (30 Minutes)**
  Apply the following rules to any **[FD]** sentence that passed the Reversibility Test (i.e., sources support multiple interpretations).

  *   **Rule A (The Revision):** If the frame is necessary for brevity (90-word limit), neutralise the language.
      *   *Change:* "He improved the village." → "He altered the village layout."
  *   **Rule B (The Stop):** If the text asserts a motive or moral quality that sources contradict or do not address, mark **NO**. The text cannot be published in this form.
  *   **Rule C (The Liaison Handoff):** If the choice between frames concerns a living community, identity, or contested value (e.g., 'improvement', 'progress', 'benefit'), do not decide. Mark **REFER**. Send to the Community Liaison. This is a question of values, not evidence.

  ---

  ### 3. Application to Current Drafts

  Below is the audit applied to three current texts.

  #### Case 1: Exhibition Panel (Victorian Manufacturer)
  **Draft:** "John Smith built this model village to care for his workers. A benevolent man, he improved their lives through better housing. His generosity ensures this collection exists today."
  **Audit:**
  1.  **Particles:** None flagged, but 'benevolent' and 'generosity' are evaluative particles in adjective form.
  2.  **Tagging:**
      *   "Built this model village": **[SA]**.
      *   "To care for his workers": **[FD]** (Motive is inferred).
      *   "Benevolent man / improved their lives": **[FD]** (Value judgement).
      *   "Generosity ensures...": **[FD]** (Causal link is interpretive).
  3.  **Reversibility:**
      *   Can sources support "controlled his workers"? Yes (paternalism records).
      *   Can sources support "investment in stability"? Yes (business ledgers).
      *   Therefore, "care" and "benevolent" are reversible frames.
  4.  **Decision:** **NO (Stop Rule).**
      *   *Reasoning:* The text presents a reversible frame ("benevolence") as a Source-Anchored fact. This violates the requirement for evidence-based stability. Furthermore, as this concerns a donor, the assertion of moral quality without citation risks institutional credibility.
      *   *Instruction:* Rewrite to describe actions only. "Smith built this village. Housing standards exceeded local averages. The collection derives from his estate." Remove 'benevolent', 'care', 'generosity'.

  #### Case 2: Audio-Guide Script (The Strike)
  **Draft:** "Tensions eased. The pit finally reopened after the strike."
  **Audit:**
  1.  **Particles:** 'Finally'.
  2.  **Tagging:** "The pit reopened" is **[SA]**. "Finally" imposes a narrative of relief/delay.
  3.  **Reversibility:** Could the reopening be framed as a defeat? Yes. 'Finally' assumes the reopening was the desired outcome of the narrative arc.
  4.  **Decision:** **REVISE (Rule A).**
      *   *Reasoning:* 'Finally' emplots the strike as an obstacle to be overcome (Comedy/Romance structure) rather than a conflict with multiple outcomes.
      *   *Instruction:* Delete 'finally'. "The pit reopened in [Month/Year]."

  #### Case 3: School Timeline (1780–1840)
  **Draft:** "The Age of Improvement. Reforms changed society for the better."
  **Audit:**
  1.  **Particles:** 'Better'.
  2.  **Tagging:** "Age of Improvement" is a historical label **[FD]**. "For the better" is **[FD]**.
  3.  **Reversibility:** Did reforms change society for the 'worse' for certain groups (e.g., enclosures, child labour in factories)? Yes, sources support this.
  4.  **Decision:** **REFER (Rule C).**
      *   *Reasoning:* 'Improvement' is a value judgement inherent to Whig history. Determining whether this term is appropriate for school children involves community values regarding how history is taught, not just evidential accuracy.
      *   *Instruction:* Do not sign off. Pass to Community Liaison and Head of Learning. Suggest alternative: "The Age of Reform".

  ---

  ### 4. Limitations of the Procedure

  This protocol is a filter, not a cure. You must be aware of what it cannot achieve:

  1.  **It cannot fix structural silence.** If the sources themselves are biased (e.g., only the manufacturer's letters survive), the [SA] tag will validate that bias. This procedure checks your text against the sources, not the sources against the world.
  2.  **It cannot resolve ethical dilemmas.** Rule C hands off value judgements, but it does not tell you *which* values should win. It only identifies when you are making a value judgement disguised as a fact.
  3.  **It assumes translatability.** A sentence that passes this audit in English may fail in Welsh if the target language requires grammatical structures that imply aspect or agency differently. The Liaison must check the Welsh output separately.
  4.  **It does not absolve the Head of Interpretation.** The 'Stop' rule flags the error, but the decision to publish a revised, neutralised text that may disappoint a donor remains my responsibility, not yours.

  **End of Procedure.**
