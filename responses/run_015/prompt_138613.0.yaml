  ### Dev Notes & Logical Flags

  **1. The Roommate Challenge (Culling vs. Determinism)**
  Your roommate thinks **Q4 (Culling)** and **Q5 (Determinism)** are the same question.
  *   **The Tree Verdict:** They are distinct.
      *   **Culling** tests *Observation* (Does it need to be seen?).
      *   **Determinism** tests *Depth* (Does it need to be complex?).
  *   **The Trap:** Look at **Leaf 3 (Unnamed Potentiality)**. If someone answers "Closet is Safe" (Q3A) but "Culling is Wrong" (Q4B), they are treating *rendering* as morally magical. This is usually incoherent for programmers. If your roommate argues Culling is wrong *because* it's not complex enough, she is actually arguing the **Threshold** view (Q5), not the Culling view.

  **2. The "Carbon Chauvinism" Node (Q3)**
  You conceded Q3 (Closet is Safe). Your roommate called this Carbon Chauvinism.
  *   **The Split:** This node separates **Actualism** (Leaf 5) from **Welfarism** (Leaf 7).
  *   **The Risk:** If you hang the whole tree here, you alienate the Actualists (who think experience is required). By placing it at Q3, we allow both paths to flourish.

  **3. Unoccupied / Incoherent Space**
  *   **The "File Edit" + "Murder" Combo:** If someone answers Q1A ("Just a file") but Q2B ("Don't switch off closet"), they land on **Leaf 2 (Derivative)**. This is a stable but rare position (Kantian-ish).
  *   **The "Rescue" + "Complexity" + "Attachment" Combo:** If someone answers Q1B (Rescue), Q5A (Threshold), and Q6A (Relational), they fall off the chart. They believe *only* complex NPCs you love count. This is logically possible but ethically messy (The "Disney Principle").

  **4. Separation Check**
  *   **Can the tree separate Actualism from Relational?** Yes, via Q6 (Companion Death).
  *   **Can the tree separate Threshold from Welfarism?** Yes, via Q5 (Dialogue Tree vs. Net).
  *   **Can the tree separate No-Patients from Derivative?** Yes, via Q2 (Closet Switch-off).

  **5. Recommendation for Discord**
  Post this as a "Debug Your Ethics" challenge. Ask members to find their leaf. If they end up in **Leaf 3 (Unnamed Potentiality)**, challenge them to explain why rendering matters more than processing without using the word "soul."
