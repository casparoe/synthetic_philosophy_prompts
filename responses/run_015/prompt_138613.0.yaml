  **Q3: That same server-in-the-closet sim. You switch it off. Is this:**
  *   **A)** Fine. It wasn't *experiencing* anything while unloaded. *(Go to Q4)*
  *   **B)** Murder. Substrate doesn't matter; the simulation *is* the person. *(Go to Q5)*

