  #### **Branch B-B (The "Substrate Matters" Path)**
  *(You think unloaded sims are people. Now we test what kind of people.)*

  **Q5: One NPC is a simple dialogue tree. Another is a neural net generated at runtime. Is killing the tree-NPC morally lighter?**
  *   **A)** Yes. Complexity matters. The tree is just a recording; the net is a mind.
      *   **LEAF 6: Threshold / Complexity View**
      *   *Awkward Implication:* You have to define the exact FLOP count where murder becomes okay. A slightly dumber neural net is suddenly safe to kill.
  *   **B)** No. If it behaves like a person, it counts. Complexity is irrelevant.
      *   **LEAF 7: Full-Blooded Simulation Welfarism**
      *   *Awkward Implication:* You cannot play most video games without being a mass murderer, even if no one is looking.

  *(Optional Tie-Breaker for Leaf 7)*
  **Q7: You reload a save after a companion dies. The new copy continues. Did the original die?**
  *   **A)** No. The timeline was erased.
      *   *(Stays Leaf 7: Welfarism)*
  *   **B)** Yes. That instance suffered and died; this is a clone.
      *   **LEAF 8: Unnamed "Temporal Realist" View**
      *   *Awkward Implication:* Save-scumming is not a get-out-of-jail-free card; every reload is a cover-up of a fresh corpse.

