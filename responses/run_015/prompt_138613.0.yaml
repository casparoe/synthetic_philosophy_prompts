  #### **Branch B-A (The "Experience Matters" Path)**
  *(You think unloaded sims are safe, but loaded ones might not be.)*

  **Q4: An NPC only exists when your camera sees it (frustum culling). You kill one that is currently off-screen (not rendering). Is this harm-free?**
  *   **A)** Yes. If it isn't rendered/experienced, it doesn't count. *(Go to Q6)*
  *   **B)** No. It's still processing in the background, so it counts.
      *   **LEAF 3: Unnamed "Potentiality" View**
      *   *Awkward Implication:* You believe a sim in a closet (Q3) is safe, but a sim just outside your camera view (Q4) is not. This is logically unstable unless you value *potential observation* over *existence*.

  **Q6: The game scripts the death of a companion you've spent 40 hours with. Is this morally worse than killing a random guard?**
  *   **A)** Yes. The wrongness comes from your attachment/betrayal.
      *   **LEAF 4: Relational / Observer-Dependent**
      *   *Awkward Implication:* If you don't care about the NPC, murdering them is perfectly fine; the moral status is in *your* head, not theirs.
  *   **B)** No. A mind is a mind, regardless of my feelings.
      *   **LEAF 5: Actualism**
      *   *Awkward Implication:* You must count every random guard as a moral patient, but you can ignore any NPC that isn't currently "thinking" (unloaded).

