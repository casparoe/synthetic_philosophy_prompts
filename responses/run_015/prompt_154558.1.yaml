  5.  **Final Review against User Questions:**
      *   *Procedural reading available?* Mostly no, needs nuance.
      *   *General rules block relativism?* They try to, but it's a tension.
      *   *Load-bearing/Weakest?* Load: Move 1. Weak: Move 3.
      *   *Observability bias new?* Variation on standard visibility critique.
      *   *Case to break Two-Tier?* Private intentions with no outward sign (Smith thinks these are morally relevant).
      *   *Which to cut?* Move 3 (or radically revise it).
      *   *White lies?* Smith discusses veracity/dissimulation, not exactly "white lies."

  6.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* I should mention D.D. Raphael or Charles Griswold as reference points for the "constitutive" reading.
      *   *Correction:* Make sure to highlight that Smith *does* distinguish between the "man within" and the "man without," which complicates the "audience" reading.
      *   *Addition:* The "Thin Spectator" sounds like Hume's "General Point of View." Maybe suggest that link instead of Kant.

  7.  **Final Polish:** Check for clarity and directness. (Proceed to generate response).

