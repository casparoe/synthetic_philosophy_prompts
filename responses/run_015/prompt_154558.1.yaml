answer: |-
  This is a sharp, ambitious skeleton. You're wrestling with the central tension in *The Theory of Moral Sentiments* (TMS): the gap between the psychological mechanism of sympathy and the normative authority of moral judgment.

  Here is a blunt breakdown of your three moves, addressing your specific questions about interpretation, novelty, and structural integrity.

  ### Move 1: The Procedural Spectator & Observability Bias

  **Is the procedural reading available to Smith?**
  This is your highest-risk interpretive move. You are distinguishing the *mechanism* (simulating a spectator) from the *criterion* (what makes it right).
  *   **The Problem:** For Smith, the approval of the Impartial Spectator (IS) *is* constitutive of moral sentiment. It's not just a heuristic for finding a pre-existing truth; the sentiment of approval *is* the moral truth for a sentimentalist. If you make the IS purely procedural (a calculator), you risk turning Smith into a proto-utilitarian (calculating outcomes) or a Kantian (following a rule of simulation).
  *   **The Nuance:** You can save this by leaning on Smith's distinction between the "man without" (actual audience) and the "man within the breast" (conscience). The IS isn't just an audience; it's an internalized norm. However, your claim that the IS is a "specification of an audience" is textually supported (Smith often uses theatrical metaphors).
  *   **Recommendation:** Don't say the IS is *not* a criterion of rightness. Say the IS is the criterion, *but* its criteria are limited by the bandwidth of sympathy. That keeps you within Smithian bounds while preserving your critique.

  **Is the Observability Bias new?**
  It is a sophisticated rewording of the standard "visibility objection" to sentimentalism (often traced to Sidgwick or modern critics like Nussbaum). The standard objection is: *Sentimentalism favors what moves us over what is actually good.*
  *   **Your Twist:** Linking this specifically to **publicity** and **propriety** is the fresh bit. The idea that Smithian morality structurally favors "ownable" actions over "effective but hidden" actions is a strong reading. It explains why Smith struggles with private vices that have no public symptom.
  *   **Verdict:** Keep this. It's the engine of your essay. Just acknowledge the lineage of the visibility critique so you don't overclaim novelty.

  ### Move 2: The Information Problem (Cross-Cultural White Lies)

  **Does Smith's appeal to General Rules block the relativism charge?**
  Smith tries to block it in Part III, Chapter 4, and Part VII. He argues that General Rules emerge from induction: we see many particular cases, notice patterns, and form rules.
  *   **The Tension:** You have hit the exact nerve Smith scholars fight over (e.g., Griswold vs. Fleischacker). If General Rules are induced from local sentiments, they are contaminated by local bias. Smith admits custom "perverts" judgment, but insists there are "natural sentiments" underneath.
  *   **The White Lie Case:** This is your strongest stress test. Smith discusses veracity and dissimulation (mostly in the context of honor and the "pleasing illusion" of society), but he doesn't have a modern taxonomy of "white lies." However, he does discuss the tension between truth and kindness.
  *   **The Trap:** If the IS knows local conventions, it validates cruelty (Japanese bluntness). If it doesn't, it validates rudeness (Dutch bluntness).
  *   **Verdict:** This is the load-bearing premise of your critique. It works because it exploits Smith's ambiguity on whether the IS is *idealized* (knows all facts) or *situated* (knows local context). Smith wants it to be both, which is your opening.

  ### Move 3: The Two-Tier Fix (Thick/Thin Spectators)

  **This is the part you should worry about most.**
  You identified the risks yourself ((a) Kantian, (b) Empty, (c) Disunity). I think all three risks are actualized here.

  1.  **Kantian Creep:** A "Thin Spectator" who knows only brute facts (suffering, intent) and ignores convention sounds exactly like a Kantian rational agent or a Utilitarian calculator. Smith explicitly argues against the idea that reason alone (stripped of sentiment and context) can generate moral verdicts.
  2.  **Emptiness:** You ask if a spectator stripped of conventions has any verdicts left. Smith would say **yes, but not the ones you want.** A context-free spectator can judge *pain*, but Smithian morality is largely about *propriety* (the suitability of affection to its object). Without context, you can't judge suitability.
  3.  **Breaking Unity:** Smith wants Propriety (manner) and Merit (substance) to be integrated. Your split suggests they can be divorced.

  **A Better Smithian Solution:**
  Instead of inventing a "Thin Spectator," use Smith's existing distinction between **Propriety** and **Merit**.
  *   **Propriety:** Is the affection suitable to the cause? (This handles the Thick/Local element: Is bluntness suitable here?)
  *   **Merit:** Does the action deserve reward or punishment? (This handles the Thin/Universal element: Did this cause harm?)
  *   **The Fix:** In the Dutch/Japanese case, the *Propriety* judgment changes (bluntness is proper in Holland, improper in Japan), but the *Merit* judgment might remain stable (if the intent was kind, merit is positive; if harm was caused, demerit is negative). Smith allows for these to come apart. You don't need two spectators; you need two *dimensions of judgment* from the *same* spectator.

  **A Case That Breaks Your Two-Tier Fix:**
  *   **Private Resentment:** Imagine a husband who silently resents his wife but never shows it, never acts on it, and cares for her perfectly.
      *   **Thick Spectator:** Sees perfect propriety (good manners).
      *   **Thin Spectator:** Sees no brute harm (no suffering caused).
      *   **Smith's Verdict:** This is still a vice. The "man within the breast" judges the *affection itself*, not just the outcome or the manner. Your Thin/Thick split misses the internal moral quality of the sentiment, which is the core of Smith's system.

  ### Specific Answers to Your Questions

  **1. Which premise is most load-bearing?**
  Move 1 (The Procedural/Observability claim). If the IS is not limited by the "bandwidth of sympathy," your bias argument collapses. You need to defend the claim that sympathy *cannot* transmit invisible harms effectively.

  **2. Which premise is the weakest?**
  Move 3 (The Two-Tier Fix). It imports external machinery to solve a problem Smith arguably solves internally (via the Propriety/Merit distinction and the appeal to General Rules).

  **3. Is the observability bias new?**
  It's a specific, well-formulated version of the "visibility problem." It's not wholly new, but the connection to *publicity* (what can be owned in front of anyone) is a strong contribution. Frame it as refining the standard objection, not discovering it.

  **4. Does Smith discuss white lies?**
  Not explicitly under that label. He discusses "dissimulation," "veracity," and the "pleasing illusion" of society (Part I, Section II, Chapter 5). He suggests society is a mirror and we often polish our behavior to please the spectator. You can use this, but don't claim he has a dedicated theory of white lies.

  **5. Which move would I cut?**
  **Cut the "Two-Tier Spectator" ontology.**
  Keep the *insight* (that we judge manner and substance differently), but map it onto Smith's existing **Propriety vs. Merit** distinction.
  *   *Why?* It makes your essay more exegetically faithful. Instead of saying "Smith needs a fix," you say "Smith's existing distinction between Propriety and Merit explains the cross-cultural tension better than critics realize, though it leaves a residual gap."
  *   *Benefit:* It avoids the "Kantian creep" charge. You aren't importing a rationalist spectator; you're using Smith's own dual-criteria system.

  ### Summary Advice

  1.  **Soften Move 1:** Don't deny the IS is constitutive. Argue that its constitutive power is *limited* by the observability constraints of sympathy.
  2.  **Sharpen Move 2:** This is your killer app. The Dutch/Japanese contrast effectively exposes the tension between General Rules and Local Sentiment.
  3.  **Rewrite Move 3:** Ditch the "Thick/Thin Spectator" terminology. Use "Propriety (Local/Manner)" and "Merit (Universal/Substance)." Acknowledge that Smith thinks these usually converge, but your cross-cultural cases show where they diverge.
  4.  **Phenomenology:** Keep the bit about "knowing it wasn't meant badly but still being stung." That is excellent phenomenological evidence for the Propriety/Merit split.

  If you make those adjustments, you move from "forcing Smith to fit a new theory" to "using a new case study to reveal a tension already present in Smith." That is a much stronger essay.
