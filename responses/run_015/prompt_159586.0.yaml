      *   **Context:** Upper-level philosophy of language seminar (12 students, 90 mins, no projector, whiteboard + index cards).
      *   **Problem:** Students know Austin's vocabulary (performative, illocutionary, felicity, uptake) but don't feel the *stakes*. They treat performatives as merely psychological/perlocutionary (like the friend: "I promise" = "I will" + expectation of effect).
      *   **Goal:** Create a runnable simulation (game) that forces students to experience the *normative* force of speech acts, distinct from psychological effects.
      *   **Constraints:**
          *   No forbidden words (performative, illocutionary, felicity, uptake).
          *   No appeals to psychology (sincerity, feelings, persuasion).
          *   Must use a "Minute Book" as the sole authoritative record of reality.
          *   Must engineer specific trouble cases:
              1.  Split Addressee (Apology to a committee, one refuses).
              2.  Inscription-Conditional (Act counts only when written; discrepancy between spoken/written).
              3.  Ventriloquized Authority (Wrong person speaks right words vs. Right person speaks wrong words).
              4.  (Optional but desired) Hollow Act (Jest/Rehearsal/Threat that works anyway).
          *   Must differentiate Declarations, Promises, and Apologies.
      *   **Deliverables:**
          *   Simulation setup (roles, materials, agenda).
          *   Utterance cards with exact wording.
          *   Timeline.
          *   Debrief (mapping cases to Austinian distinctions).
          *   Counter-arguments to the friend's view.
          *   Predicted failures & responses.
          *   Limitations of the simulation.

  2.  **Deconstruct the Philosophical Core:**

      *   *The Friend's View:* Speech acts are just causal triggers for mental states. If the hearer isn't convinced, it failed. "Falsity" = lack of effect.
      *   *The Austinian View:* Speech acts change normative status (rights, duties, commitments) *by virtue of convention*, independent of psychological effect.
      *   *The Mechanism:* The "Minute Book" acts as the "World." If it says X, X is true institutionally, regardless of feelings. This externalizes the normative status.
      *   *The Conflict:* Students will want to vote on what *should* be in the book based on fairness or feelings. The rules must force them to look at *procedure* and *convention* to determine what *is* in the book.

  3.  **Designing the Simulation: "The Tenants' Association Tribunal"**

      *   *Why Tenants?* It's mundane enough to be graspable but bureaucratic enough to require rules.
      *   *Roles:* Chair (controls floor), Secretary (controls the Book), Treasurer (controls debts), Members (voters/actors).
      *   *The Book:* A physical notebook on the table. Only the Secretary writes in it.
      *   *The Constraint:* "The Book is Reality." If it's not in the Book, it didn't happen. If it is, it did.
      *   *The Ban:* No psychology. You can't say "He didn't mean it." You must say "Rule 4.2 was violated."

  4.  **Engineering the Trouble Cases:**

      *   *Case 1: Split Addressee (Apology).*
          *   *Setup:* Association owes apology to Committee A, B, C.
          *   *Rule:* Apology requires acceptance by *all* aggrieved parties to be "Closed."
          *   *Conflict:* A & B accept. C refuses.
          *   *Question:* Is the apology *entered*? Yes. Is the debt *cleared*? No.
          *   *Austinian Point:* Uptake is required for completion, but the act itself occurred. Distinguish *misfire* (not an apology) from *abuse* (insincere/unaccepted). Actually, for Austin, if uptake fails, the act is "hollow" but not necessarily non-existent. Wait, Austin says if uptake fails, the act is not *successfully* performed. Let's refine: The rule should make the *effect* (clearing debt) conditional on uptake, but the *act* (offering apology) conditional on utterance.
          *   *Refinement:* The rule says: "An Apology is *Registered* when uttered by Chair. A Debt is *Cleared* when Apology is Registered AND Accepted by Creditor."
          *   *Friend's Trap:* She says if C doesn't accept, the apology didn't happen. The Book shows it was Registered.

      *   *Case 2: Inscription-Conditional (Declaration/Debt).*
          *   *Setup:* Incurring debt requires Secretary's entry.
          *   *Conflict:* Chair says "We incur debt." Secretary writes "We reject debt." Or Secretary doesn't write.
          *   *Austinian Point:* Declaration requires extra-linguistic institution. Here, the Institution *is* the Book.
          *   *Friend's Trap:* She says the Chair's words caused the debt. The Rules say the Book causes the debt.

      *   *Case 3: Ventriloquized Authority.*
          *   *Setup:* Only Chair can declare meeting open.
          *   *Conflict:* Member reads Chair's script. Or Chair reads Member's script.
          *   *Austinian Point:* Authority resides in the *person/office*, not the phonemes.
          *   *Friend's Trap:* She says the words worked because everyone understood. Rules say they didn't.

      *   *Case 4: Hollow Act (Jest/Rehearsal).*
          *   *Setup:* "Practice" round.
          *   *Conflict:* Chair says "I promise" during practice.
          *   *Austinian Point:* Exclusion of non-serious usage (etiolation).
          *   *Friend's Trap:* She says it's a promise because words were said. Rules say context voids it.

  5.  **Drafting the Materials:**

      *   *Roles:* 1 Chair, 1 Secretary, 1 Treasurer, 9 Members (3 of whom form the "Grievance Committee").
      *   *Cards:* Need specific formulas.
      *   *Rules:* Need to be rigid to prevent "voting" on reality.
      *   *Timeline:* 90 minutes is tight. Need strict pacing.
          *   0-10: Setup/Rules.
          *   10-30: Routine Business (get them used to the Book).
          *   30-50: Trouble Case 1 (Apology).
          *   50-70: Trouble Case 2 & 3 (Inscription/Authority).
          *   70-80: Trouble Case 4 (Hollow).
          *   80-90: Debrief.

  6.  **Refining the Constraints (The "No Psychology" Rule):**

      *   This is crucial. If a student says "But he didn't mean it!", the Chair must rule "Irrelevant. Check Rule 3."
      *   The "Friend's View" relies on psychological state. By banning it, we force them to look at *convention*.
      *   *Self-Correction:* If I ban psychology too hard, they might revolt. I need to make the *Rules* the source of truth, so appealing to psychology is appealing to irrelevant data.

  7.  **Developing the Debrief:**

      *   Map Case 1 to Uptake vs. Perlocution.
      *   Map Case 2 to Declaration vs. Promise (World-to-Word vs. Word-to-World).
      *   Map Case 3 to Authority/Convention.
      *   Map Case 4 to Seriousness/Etolation.
      *   Address the Friend's 3 Claims directly.

  8.  **Anticipating Failures:**

      *   *Gaming:* Students will try to find loopholes in the wording. *Response:* The Secretary is the judge of wording match.
      *   *Voting:* Students will try to vote on what the Book says. *Response:* The Book records *procedural truth*, not *democratic will*. (This is a hard philosophical point to make in-game).
      *   *Boredom:* It needs to feel high stakes. Make the "Debt" involve real consequences (e.g., buying snacks for next week or a grade implication? No, keep it institutional to avoid ethical issues. Let's make it about "Standing" to speak).

  9.  **Writing the Plan (Iterative refinement):**

      *   *Title:* The Minute Book Protocol.
      *   *Materials:* Physical notebook, pens, cards.
      *   *Rules:* Keep them simple but rigid.
      *   *Scenario:* The "North Hall Tenants."
      *   *Specific Cards:*
          *   Apology Card: "On behalf of the Association, I apologize to [Names] for [Grievance]."
          *   Promise Card: "The Association promises to [Action] by [Date]."
          *   Declaration Card: "This meeting is [Status]."
      *   *The Twist:* The Secretary has a "Veto on Inscription" based *only* on Rule Compliance, not Truth.

      *(Self-Correction during drafting)*: Wait, if the Secretary vetoes, does that make the Secretary the sovereign? Yes, that's the point of the "Institution." The Institution validates the speech.
      *(Refining Case 1)*: If one committee member refuses, does the Secretary write it? Yes, the utterance happened. But does the Debt clear? No. This distinguishes the *Act* from the *Completion*.
      *(Refining Case 2)*: If Chair speaks but Secretary doesn't write. The Book says nothing. Therefore, institutionally, nothing happened. This hits the Friend's view hard (she says the effect on the room matters).
      *(Refining Case 3)*: Wrong person speaks. Secretary refuses to write.
      *(Refining Case 4)*: "Rehearsal" stamp. Secretary writes "(VOID)" next to it.

  10. **Final Review against Constraints:**
      *   No forbidden words in the game instructions? Check.
      *   No psychology? Check.
      *   Timeline feasible? 90 mins is tight. I need to be very specific about time limits.
      *   Debrief maps to Austin? Check.

  11. **Final Polish:** Ensure the tone is helpful to the professor, acknowledging the difficulty of the task. (The prompt asks for honesty about limitations).

  *(Self-Correction on the "Friend's View"):* The friend thinks "I promise" = "I will" + expectation of effect. The simulation must show that "I promise" creates a *debt* regardless of expectation. The Minute Book tracks debts. If the Book says "Debt Owed," it is owed, even if no one believes it will be paid.

  *(Self-Correction on "Uptake"):* Austin says uptake is necessary for the act to be *successfully* performed. But the Friend says uptake = understanding. Austin says uptake = acceptance of the conventional role. The simulation needs to distinguish "Hearing the words" from "Accepting the Convention."
  *Adjustment:* In Case 1, the Committee Member hears the words (Understanding) but refuses to sign the acceptance log (Uptake/Convention). This separates the two.

  Let's assemble the document.

