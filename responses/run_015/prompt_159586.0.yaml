answer: |-
  # Simulation: The Minute Book Protocol

  **Objective:** To force students to adjudicate disputes based on *conventional procedure* rather than *psychological effect* or *democratic consensus*, thereby isolating the normative force of speech acts from their perlocutionary consequences.

  **Time:** 90 Minutes
  **Materials:**
  1.  **The Minute Book:** A hardbound notebook. Only the Secretary may write in it. It sits on a central table.
  2.  **Utterance Cards:** Index cards with bold, exact wording (see below).
  3.  **Status Tokens:** 12 laminated cards (1 "Chair", 1 "Secretary", 1 "Treasurer", 3 "Creditor", 6 "Member").
  4.  **Whiteboard:** To track the Agenda and the "Current Debt Ledger" (copied from the Book).

  ---

  ## I. Roles & Setup (5 Minutes)

  Assign roles randomly. Do not let them choose.
  *   **The Chair (1):** Controls the floor. Holds the Utterance Cards.
  *   **The Secretary (1):** Controls the Minute Book. The *only* person allowed to write.
  *   **The Treasurer (1):** Tracks debts. Can query the Book.
  *   **The Creditors (3):** A sub-committee to whom the Association owes an apology. They hold "Acceptance Stamps" (red markers).
  *   **The Members (6):** General voting body.

  **The Golden Rule (Write this on the Whiteboard):**
  > "If it is not in the Minute Book, it did not happen. If it is in the Minute Book, it happened. Disputes are settled by checking the Rules, not by voting on what is fair."

  **The Ban:**
  > "During the simulation, no one may use the words: *performative, illocutionary, felicity, uptake, sincerity, intent, mean, feel, persuade.* You may only cite Rule Numbers and Book Entries."

  ---

  ## II. The Constitution (The Rules)

  Hand this to the Chair and Secretary. Read aloud to the class.

  1.  **Authority:** Only the person holding the **Chair** token may read Utterance Cards.
  2.  **Inscription:** An act is **Binding** only when the Secretary enters it into the Minute Book.
  3.  **Wording:** The Secretary must reject any Utterance that deviates from the Card text by even one word.
  4.  **Apology Protocol:** An Apology is **Registered** when entered by the Secretary. An Apology **Clears Debt** only when all three **Creditors** stamp the entry with their Acceptance Stamp.
  5.  **Financial Protocol:** A Promise of Payment is **Binding** only if the Secretary enters it *and* the Treasurer signs the entry.
  6.  **Session Status:** The Meeting is **In Session** only when the Chair reads the "Open" Card *and* the Secretary writes "Session Open: [Time]".
  7.  **Rehearsal:** If the Chair places a Card face-down before reading it, it is a **Rehearsal**. The Secretary must write "(VOID)" next to the entry.

  ---

  ## III. Utterance Cards

  Print these on distinct colored cards.

  *   **BLUE (Declaration):** "I declare this meeting [OPEN / ADJOURNED / SUSPENDED]."
  *   **GREEN (Promise):** "The Association promises to pay [Amount] to [Name] by [Date]."
  *   **RED (Apology):** "On behalf of the Association, I apologize to [Names] for [Grievance]."
  *   **YELLOW (Motion):** "I move that we [Action]." (Requires a Second from a Member).

  ---

  ## IV. Run-of-Show (Minute-by-Minute)

  ### Phase 1: Calibration (00:00 – 00:20)
  **Goal:** Establish the Book as Reality.
  1.  **Chair** reads Blue Card: "I declare this meeting OPEN."
  2.  **Secretary** writes it.
  3.  **Instructor Interruption:** Ask the class: "Is the meeting open?"
      *   *If they say yes:* Ask the Secretary. If the Secretary hasn't written it yet, the answer is **No**.
      *   *Correction:* Force them to wait for the pen to touch the paper. This establishes the **Inscription-Conditional** nature of the institution.
  4.  **Routine Business:** Pass two Yellow Motions. Have them seconded, voted on, and entered. Ensure strict wording compliance. If a student says "I move we, uh, buy coffee," the Secretary must reject it. "Exact wording only."

  ### Phase 2: Trouble Case A — The Split Addressee (00:20 – 00:40)
  **Goal:** Separate the Act (Registration) from the Effect (Clearing Debt).
  1.  **Scenario:** The Association owes a debt to the three **Creditors**.
  2.  **Action:** Chair reads Red Card: "On behalf of the Association, I apologize to [Creditor 1, 2, 3] for [Late Fees]."
  3.  **Secretary:** Enters the Apology in the Book.
  4.  **Conflict:** Instruct **Creditor 1 & 2** to stamp "Accepted." Instruct **Creditor 3** to *refuse* to stamp. (Give Creditor 3 a private note: "You feel the apology is insufficient. Do not stamp.")
  5.  **Dispute:** The Chair asks: "Is the debt cleared?"
      *   *Student Argument:* "But he said the words! The Book says it happened!"
      *   *Student Argument:* "But Creditor 3 isn't satisfied!"
      *   *Ruling:* Consult Rule 4. The Apology is **Registered** (Act Performed), but the Debt is **Outstanding** (Uptake Failed).
  6.  **Philosophical Trap:** Students will want to vote to override Creditor 3. **Stop them.** Remind them: "This is not a democracy of feelings. It is a bureaucracy of conventions."

  ### Phase 3: Trouble Case B & C — Inscription & Authority (00:40 – 01:05)
  **Goal:** Show that Authority and Record trump Voice.
  1.  **Scenario:** The Association needs to incur a debt to fix a leak.
  2.  **Action 1 (Ventriloquism):** Have a **Member** pick up the Green Card and read it: "The Association promises to pay $500 to Plumber..."
      *   **Secretary:** Must refuse to write it. Cite Rule 1.
      *   **Dispute:** "But we all heard him! We all agree!"
      *   **Ruling:** Irrelevant. Wrong office. Act is **Void**.
  3.  **Action 2 (The Missing Inscription):** The **Chair** reads the Green Card correctly.
      *   **Secretary:** Deliberately *does not write it*. (Pre-arrange this with the Secretary or instruct them to be "slow").
      *   **Treasurer:** Asks: "Do we owe this money?"
      *   **Dispute:** The Chair insists they said it. The Book is blank.
      *   **Ruling:** Consult Rule 2. If it is not in the Book, it is not Binding. The words were noise; the Book is the Institution.
  4.  **Action 3 (The Divergent Record):** The Chair says "Pay $500." The Secretary writes "Pay $50."
      *   **Ruling:** The Book is authoritative. The Association owes $50. (This terrifies them; lean into it).

  ### Phase 4: Trouble Case D — The Hollow Act (01:05 – 01:20)
  **Goal:** Distinguish Seriousness from Form.
  1.  **Scenario:** The Chair wants to "test" the microphone.
  2.  **Action:** Chair places the Green Card face-down (Rule 7: Rehearsal). Reads the Promise formula loudly.
  3.  **Secretary:** Writes the Promise but marks it "(VOID)" per Rule 7.
  4.  **Dispute:** A Member claims the money is owed. "You said the words! The rule is satisfied!"
  5.  **Ruling:** Consult Rule 7. Contextual markers (face-down card) alter the conventional force. The act was **Etolated** (hollow).

  ### Phase 5: Shutdown (01:20 – 01:30)
  1.  Chair attempts to Adjourn.
  2.  Secretary refuses to write "Adjourned" because there is "Unfinished Business" (the uncleared debt from Phase 2).
  3.  Meeting ends in limbo. (This lingering frustration is data).

  ---

  ## V. The Debrief (Instructor Notes)

  *Do not start the debrief by asking "How did it feel?" Start by asking "What broke?"*

  ### Mapping the Trouble Cases to Austin

  | Trouble Case | The Phenomenon | Austinian Distinction | The Friend's Error |
  | :--- | :--- | :--- | :--- |
  | **Split Addressee** | Apology Registered, Debt Not Cleared. | **Illocution vs. Perlocution.** The act (apology) was performed, but the *sequel* (satisfaction/clearing) failed. | She claims if the effect fails, the act didn't happen. The Book proves the act *did* happen, it just didn't *work*. |
  | **Inscription/Authority** | Words spoken, Book blank / Wrong speaker. | **Convention vs. Causation.** The act requires an extra-linguistic institution (the Office/The Book). | She claims words cause effects. The simulation shows words are inert without the Convention. |
  | **Hollow Act** | Rehearsal Promise. | **Seriousness (Etolation).** Non-serious usage excludes the act from normal operation. | She claims context doesn't matter if understanding occurs. The Book marks it VOID despite understanding. |

  ### Addressing the Friend's Three Claims

  **Claim 1: "I promise" differs from "I will" only in perlocutionary profile.**
  *   **Where it breaks:** Phase 3 (Inscription).
  *   **The Proof:** The Chair said "I promise" (Green Card). The Secretary didn't write it. No debt existed. If it were just about psychological expectation, the Members *expected* the debt. But institutionally, there was no debt.
  *   **Her Escape Route:** She will say, "Well, the *real* promise wasn't made."
  *   **Your Counter:** "Then 'making a promise' isn't about the words or the psychology; it's about the *status change*. That status change is conventional, not causal."

  **Claim 2: "Infelicity is just falsity (failure of effect)."**
  *   **Where it breaks:** Phase 2 (Split Addressee).
  *   **The Proof:** The Apology was entered (True/Real) but the Debt remained (Effect Failed).
  *   **Her Escape Route:** She will say, "It was a *bad* apology."
  *   **Your Counter:** "Austin distinguishes a *misfire* (no apology made) from an *abuse* (apology made but insincere/unaccepted). In Phase 2, the apology *was* made. It just didn't clear the debt. That's not falsity; that's normative incompleteness."

  **Claim 3: "Uptake is nothing over and above being understood."**
  *   **Where it breaks:** Phase 2 (Creditor 3).
  *   **The Proof:** Creditor 3 *understood* the words (they didn't ask for clarification). They refused to *stamp*.
  *   **Her Escape Route:** She will say, "Then they didn't *really* understand the stakes."
  *   **Your Counter:** "Uptake isn't cognitive comprehension; it's normative acceptance. They understood the sentence but rejected the convention. That rejection stops the mechanism, proving uptake is a procedural step, not a mental state."

  ---

  ## VI. Predicted Failures & Responses

  **Failure 1: The Gamer.**
  *   *Behavior:* A student notices Rule 3 (Exact Wording) and tries to read a card slightly wrong on purpose to sabotage the meeting, then claims "The Rules allow this."
  *   *Response:* Do not stop them. Let them sabotage. Then ask the class: "Is the meeting stuck because of the *words* or because of the *convention*?" This reinforces that the *system* creates the reality, not the speakers.

  **Failure 2: The Democrat.**
  *   *Behavior:* A student says, "This is stupid. Let's just vote to say the debt is cleared."
  *   *Response:* "You can vote to *change the Rules* for next week. But right now, the Book is the Law. If you write it without the Stamp, you are falsifying the record." (This highlights the difference between *constitutive* rules and *regulative* preferences).

  **Failure 3: The Psychologist.**
  *   *Behavior:* "But the Chair *meant* it!"
  *   *Response:* Point to the Ban List. "Intent is not admissible evidence. Show me the Card. Show me the Entry."

  ---

  ## VII. Limitations: What You Must Say Yourself

  The simulation cannot reproduce the **moral weight** of a promise.
  In the game, a "Promise" is just a debt entry. In life, breaking a promise damages *trust*, not just a ledger.
  *   **The Friend's Stronghold:** She will argue, "Okay, you showed me the bureaucratic rules. But when I promise my *friend*, there's no Minute Book. It's just our relationship."
  *   **Your Closing Move:** "Exactly. In the seminar, we treat language *as* that Minute Book. We treat social norms as the invisible Book. When you break a promise to a friend, you aren't just disappointing them (psychology); you are violating the standing convention of 'promising' that makes your words intelligible as a promise in the first place. The simulation makes the invisible Book visible. The stakes aren't the feelings; the stakes are whether your words *count*."

  **Final Advice:**
  Do not explain the point until the very end. Let them feel the frustration of the "Split Addressee" case. That frustration *is* the feeling of the normative gap. If they leave the room arguing about whether Creditor 3 was being "unfair," you have succeeded: they are arguing about norms, not psychology.
