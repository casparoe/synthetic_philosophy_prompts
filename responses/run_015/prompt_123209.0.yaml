prompt: |-
  hey im putting together a dataset but this left/right thing just got personal — my dad went full libertarian tech-bro and my sister is organizing tenant strikes and yet they both think the local planning board is corrupt, so im genuinely trying to figure out if the axis is even real. can you act like a professional political philosopher and think carefully? start with some quick brainstorming: if we wanted a theory that actually explains what holds the left and right together, what would it have to deliver? write me the full desiderata — not a bibliography, no citations please, i dont want reading lists — just the spec. it has to handle weird family cases like mine where enemies agree on institutional distrust, it cant collapse tactical coalitions into deep value alignment, and it needs to say whether the distinction survives cross-national comparison or just dies outside the US. flag any two requirements that probably cant be jointly satisfied. keep it in the weeds: dont list generic categories like "economic vs social issues," i want the specific conceptual moves each requirement forces. also tell me which single requirement knocks out the most popular theories, and do the brainstorming first before laying out the list with reasoning behind each point. please start by brainstorming a bit, then give the structured list.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Someone building a dataset, dealing with a personal family conflict (libertarian tech-bro dad vs. leftist tenant-organizer sister) who agree on local corruption. They question the reality of the left/right axis.
      *   **Role:** Professional political philosopher.
      *   **Task:** Create a "desiderata" (specification/list of requirements) for a theory that explains what holds "left" and "right" together (or defines the axis).
      *   **Constraints:**
          *   No bibliography/citations/reading lists.
          *   Start with quick brainstorming.
          *   Then provide a structured list with reasoning behind each point.
          *   Must handle "weird family cases" (enemies agreeing on institutional distrust).
          *   Must not collapse tactical coalitions into deep value alignment.
          *   Must address cross-national comparison (US vs. others).
          *   Keep it "in the weeds" (specific conceptual moves, not generic categories like "economic vs. social").
          *   Flag two requirements that probably can't be jointly satisfied.
          *   Identify which single requirement knocks out the most popular theories.
      *   **Tone:** Professional, philosophical, careful, analytical.

  2.  **Brainstorming Phase:**
      *   *The Core Problem:* The left/right distinction is often treated as a single dimension (a line), but reality is multi-dimensional. The user's example (dad + sister vs. planning board) shows anti-establishment alignment across the spectrum. This suggests "position on the status quo" might be a separate axis from "preferred outcome."
      *   *What makes a theory good?* It needs to explain why certain clusters of beliefs stick together over time. Why does liking unions usually go with liking abortion rights? Why does liking low taxes go with liking strong borders?
      *   *The "Family Case":* If the theory says Left = Anti-Corruption and Right = Pro-Corruption, it fails because both are anti-corruption here. The theory needs to distinguish *why* they are anti-corruption. Is it because the board helps tenants (sister) or because it restricts building (dad)? The *reason* matters more than the *target*.
      *   *Tactical vs. Deep:* People ally for short-term gains. A theory needs to distinguish between "we both hate this board" (tactical) and "we both believe in X fundamental principle" (deep).
      *   *Cross-National:* In the US, "liberal" means left. In Europe, "liberal" often means economic right. In Brazil, the axes shift. A robust theory needs to account for context without saying "it's all relative" (which makes the theory useless).
      *   *Impossible Joint Requirements:* Maybe "Universal Applicability" vs. "Specific Predictive Power"? Or "Descriptive Accuracy" vs. "Normative Clarity"? Let's think deeper. Maybe "Stability over Time" vs. "Sensitivity to Context." If the axis is real, it should be stable. If it's sensitive to context (like US vs. France), it might not be stable.
      *   *Knockout Requirement:* Which one kills most theories? Probably the one about not collapsing tactical coalitions. Many theories (like Downsian spatial voting) treat coalitions as value alignments. Or maybe the cross-national one kills US-centric theories. Let's go with the "Tactical vs. Deep" distinction because most pop-politics theories assume agreement implies shared values.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: The Motivation Distinction.* Needs to separate *ends* from *means*. Dad and sister have different ends (property rights vs. tenant protection) but same means (burn the board).
      *   *Requirement 2: The Status Quo Relation.* Left/Right is often defined by change vs. conservation. But revolutionaries on both sides exist. Needs to handle "reactionary left" and "radical right."
      *   *Requirement 3: Cross-Cultural Invariance.* Does "Right" in Hungary mean the same structural position as "Right" in Texas?
      *   *Requirement 4: Coalition Stability.* Why do these bundles stick?
      *   *Flagging Incompatibility:* I need to pick two that clash. How about "Context Independence" (works everywhere) vs. "Local Predictive Precision" (works for your dad/sister). If you make it universal, it gets too vague to explain specific family fights. If you make it specific, it fails cross-nationally.
      *   *Knockout:* The requirement that distinguishes tactical alignment from value alignment. Most theories (like the Nolan Chart or simple 1D spectra) assume if you agree on an issue, you're closer on the axis. This requirement forces the theory to look underneath the agreement.

  4.  **Refining the Content (Philosophical Tone):**
      *   Avoid jargon where possible, but use precise philosophical terms (ontology, teleology, phenomenology of politics).
      *   Ensure the "in the weeds" constraint is met. Instead of "economic issues," talk about "underlying justificatory structures regarding property."
      *   Make sure the brainstorming comes *first*.
      *   Ensure no citations.

  5.  **Final Review against Constraints:**
      *   Start with brainstorming? Yes.
      *   Structured list with reasoning? Yes.
      *   Handle family case? Yes (via justificatory structure).
      *   No tactical collapse? Yes (explicit requirement).
      *   Cross-national? Yes.
      *   Flag two incompatible requirements? Yes.
      *   Identify knockout requirement? Yes.
      *   No citations? Yes.

  6.  **Writing the Response:** (Self-Correction during drafting)
      *   *Check:* Did I explain *why* the two requirements are incompatible? I need to be clear on that.
      *   *Check:* Is the "knockout" clear? I need to name why it kills popular theories (e.g., spatial models).
      *   *Check:* Is the tone right? Not too academic, but professional philosopher vibe.
      *   *Check:* Did I avoid "economic vs social"? Yes, focus on "justificatory logic."

      *Refining the Incompatibility:* Let's flag "Universal Structural Invariance" (the axis means the same thing everywhere) vs. "Contextual Semantic Accuracy" (the axis captures local meaning). If the axis is truly universal, it might miss the nuance of why your dad is "right" in the US but might be "left" on economic issues in another context. If it captures local meaning, it loses universality.
      *Actually, a better incompatibility:* "Descriptive Neutrality" (the theory doesn't judge the values) vs. "Normative Cohesion" (the theory explains why the values hang together morally). Most theories want to be neutral but also explain coherence.
      *Let's go with:* "Trans-Historical Stability" (Left/Right means the same thing over centuries) vs. "Contextual Sensitivity" (Left/Right shifts based on current political cleavages). You can't have both. If it shifts, it's not stable. If it's stable, it doesn't fit current reality.

      *Refining the Knockout:* The requirement to distinguish "Tactical Convergence" from "Axiomatic Alignment." Most models (like 2D compasses) plot you based on answers to questions. If Dad and Sister answer "Is the board corrupt? YES," they plot close together. A theory that satisfies this requirement must ignore the answer and look at the *because*. This kills almost all survey-based political science models.

      *Let's write.*
answer: |-
  ### Brainstorming: The Anatomy of a Political Axis

  If we are treating the Left/Right distinction as a hypothesis rather than a fact, we need to stress-test it against edge cases like your family dinner table. The core problem is that most models treat political position as a coordinate on a map (static location), when it might actually be a vector (direction and momentum) or even a topology (shape of relationships).

  Your dad and sister are the perfect stress test. They occupy opposite poles on standard models, yet they converge on a specific institutional critique. If the theory says they are "opposites," it fails to explain their alliance. If the theory says they are "allies," it fails to explain why they vote for different parties. Therefore, the theory cannot be about *policy outcomes* alone (e.g., "less regulation"). It must be about *justificatory structures*. Why do they want less regulation? For your dad, it might be about sovereignty and property rights as natural laws. For your sister, it might be about dismantling hegemonic power structures to achieve equity. The *output* is the same (burn the board), but the *ontology* is different.

  We also have to deal with the "bundle" problem. Why does being pro-choice usually travel with being pro-taxation? Is there a deep philosophical link, or is it just historical accident? A good theory needs to explain the glue. If the glue is weak, the axis isn't real; it's just a temporary coalition.

  Finally, there's the geography problem. In the US, "liberal" means left. In classical economics, "liberal" means right. In Brazil, the military dictatorship was "right," but in some European contexts, state protectionism is "left." If the theory is too specific to US culture wars, it's not a theory of politics; it's a theory of American sociology. If it's too abstract, it doesn't help you label your dataset. We need to find the sweet spot where the definition is robust enough to travel but specific enough to distinguish your dad from your sister.

  Here is the specification for a theory of the Left/Right axis that can survive these pressures.

  ***

  ### Desiderata for a Robust Left/Right Theory

  **1. The Justificatory Independence Clause**
  *   **The Spec:** The theory must classify actors based on the *underlying justification* for their stance, not the *policy position* itself.
  *   **The Reasoning:** This directly addresses your family case. Your dad and sister agree the planning board is corrupt, but the theory must be able to assign them opposite values despite this agreement. It forces the model to ask: "Is the board corrupt because it violates property rights (Right) or because it exacerbates class inequality (Left)?" If the theory only records "Anti-Board = 1," it fails. It needs to parse the *because*. This prevents the model from collapsing distinct ideological motivations into a single data point just because they produce temporary tactical alignment.

  **2. The Coalition Stability Test**
  *   **The Spec:** The theory must distinguish between *axiomatic alignment* (shared first principles) and *transactional convergence* (shared enemies).
  *   **The Reasoning:** Political science often treats voting blocs as value communities. This requirement demands the theory explain why certain bundles persist over decades while others dissolve. If the Left/Right axis is real, there must be a philosophical gravity holding the clusters together beyond mere opposition to the other side. The theory needs to identify which agreements are structural (e.g., a specific view on human nature) and which are incidental (e.g., hating the same planning board). If it can't separate the two, it cannot predict when alliances will break.

  **3. The Status Quo Relativity Constraint**
  *   **The Spec:** The theory must define Left and Right in relation to the *current* hierarchy, not a fixed set of policies.
  *   **The Reasoning:** This handles the cross-national comparison. In a socialist state, a free-market advocate is "Left" (revolutionary/change) but "Right" (economic hierarchy). A robust theory cannot say "Right = Free Markets." It must say "Right = Justification of existing hierarchy" or "Left = Negation of existing hierarchy." However, this is tricky because sometimes the Right wants to restore a *past* hierarchy (reactionary). The theory needs to account for temporal directionality: is the actor trying to preserve, restore, or dismantle the current stratification of power?

  **4. The Cross-Cultural Invariance Requirement**
  *   **The Spec:** The definitions must remain semantically stable when translated across different institutional contexts (e.g., US vs. Europe vs. Global South).
  *   **The Reasoning:** If the axis dies at the border, it isn't a political theory; it's cultural folklore. This requirement forces the theory to abstract away from specific issues like "gun rights" or "healthcare" and focus on structural relationships between the individual, the collective, and authority. If the theory relies on US-specific cleavages, it fails this check. It must be able to locate your dad and sister on the same spectrum as similar actors in France or Japan, even if their specific policy grievances differ.

  **5. The Psychological Plausibility Condition**
  *   **The Spec:** The theory must align with how actors *self-identify* and perceive their own moral coherence, even when those self-perceptions are contradictory.
  *   **The Reasoning:** You cannot build a dataset that ignores the subjects' own understanding of their politics without losing predictive power on behavior. If your dad says "I am a libertarian" and the theory classifies him as an "authoritarian conservative" based on his voting record, the theory creates noise. It needs to account for the internal narrative people use to justify their positions, even if that narrative is logically inconsistent. The axis must map the *phenomenology* of politics, not just the external outcomes.

  ***

  ### Critical Flags

  **Two Requirements That Probably Can't Be Jointly Satisfied:**
  **The Cross-Cultural Invariance Requirement** and **The Psychological Plausibility Condition.**

  *   **Why:** People's self-identification (Psychological Plausibility) is heavily dependent on local language and history (Context). In the US, "libertarian" means something specific. In Argentina, a similar economic stance might be labeled "liberal" or even "conservative" depending on the decade. To make the theory invariant across cultures, you have to strip away the local labels and look at abstract structures. But once you strip away the local labels, you lose contact with how the actors actually see themselves. You end up with a theory that is universally true but useless for predicting what someone will do when they call themselves a "conservative" in Texas versus a "conservative" in Krakow. You either have a universal map that doesn't match the local terrain, or a local map that doesn't travel.

  **The Single Requirement That Knocks Out the Most Popular Theories:**
  **The Justificatory Independence Clause.**

  *   **Why:** This eliminates almost all spatial voting models, survey-based spectrums (like the Political Compass), and standard demographic profiling. These popular theories plot users based on *answers to policy questions* (e.g., "Do you support higher taxes?"). In your family case, if the survey asks "Is the planning board corrupt?" and both say "Yes," standard models place them closer together. They treat the *output* as the coordinate.
  *   The Justificatory Independence Clause demands that the theory ignore the "Yes" and analyze the *reason* for the "Yes." Since most datasets and popular theories do not capture deep justificatory logic (they capture positions, not ontologies), they fail this spec. They cannot distinguish between a libertarian and a leftist who agree on a specific issue, meaning they cannot accurately model the axis when tactical alliances form across traditional boundaries.
