answer: |-
  The taxi hummed over wet pavement, rain blurring the streetlights into streaks of orange. Mara leaned her head against the glass, eyes closed. Julian was scrolling through notes on his phone, the blue light washing out his tired face.

  "The tank," Mara said suddenly. "I know it doesn't work. I know it at one in the morning, in my head, without looking up a density table."

  "The perpetual motion machine," Julian corrected, not looking up. "The one with the ten-metre column and the cable loop."

  "Ten metres, hollow spheres, seals at the top and bottom. You see the buoyancy pulling up on the water side, nothing on the air side. It screams free energy. But I know the output is zero. And I know it for mercury, for gas, for a fluid we haven't discovered yet. That's knowledge, Julian. I didn't deduce it from a law of buoyancy. I saw a constraint any such law has to satisfy."

  "You saw that conservation of energy applies," Julian said. "Your 'slick way'—that the system returns to the same configuration after one cycle—is just conservation of energy plus a pile of stipulations. Perfect seals. Rigid spheres. Steady state. None of that is *a priori*. None of it is true of any machine you could weld together."

  "But the insensitivity," Mara insisted, turning to him. "That's the point. I don't need to know the microphysics of the fluid. I don't need to know if it's compressible. The verdict doesn't budge if you tilt the tank or put it on the moon. If I were just deducing from empirical premises, changing the fluid should change the uncertainty. Instead, the impossibility holds firm."

  "It holds firm because you're leaning on a framework principle so general you've stopped seeing it as empirical," Julian said. "Energy conservation is the most successful bet we've ever made, but it's still a bet. You're treating a highly confirmed empirical generalization as a logical truth. And you're smuggling in the idealizations. You say 'rigid spheres,' but nothing is rigid. You say 'perfect seals,' but friction exists."

  "Fine. Real machines have friction. That only makes it worse," Mara said. "If the ideal case yields zero, the real case yields less than zero. I don't need an experiment to tell me friction doesn't generate power. That's a qualitative point. The export from the impossible object to the real machine is licensed by the fact that reality is just the ideal case plus noise."

  "That continuity assumption is itself empirical," Julian countered. "You've quietly downgraded the claim from 'zero' to 'less than zero,' but you have no armchair way of knowing how much less. Maybe there's a phase transition in the seal material at a specific pressure that releases chemical energy. You need experiment to say how much less. You're claiming knowledge about the world, but you're only mapping the contours of your own model."

  "Then why does the story work?" Mara asked. "If it's just a deduction, why not write the equations? Why do we need the tank, the cable, the spheres? Why bother with the narrative?"

  "Because the story hides the premises," Julian said. "It makes the stipulations feel like visual facts. You 'see' the spheres fitting the seals, so you don't question whether the seal is possible."

  "No," Mara said. "Because the imagination does work the formalism can't do yet. Sometimes you get the answer before you have the theory. Einstein wondering what a light wave looks like if you run alongside it. He didn't have the math for special relativity yet. The thought experiment told him which theory to reach for. The image carries information the equations haven't caught up to."

  "And history is full of armchair verdicts everyone was certain of that later got overturned," Julian replied. "The feeling of necessity is just the feeling of a deduction from premises you've stopped noticing. You feel locked in because you've forgotten the key is in your pocket."

  "But the results are surprising," Mara said. "They force me to abandon commitments I liked. I *wanted* that buoyancy to be free. If I'm just unpacking what I already know, why does it feel like learning?"

  "Because explication feels like discovery from the inside," Julian said. "You're making explicit what your existing commitments already entail. You didn't know you were committed to energy conservation in hydrostatics until the tank forced you to cash the check."

  "That can't be right," Mara said. "If it was just entailment, I wouldn't need the tank. I could just stare at the Lagrangian."

  "You could try," Julian said. "But you'd still be using the tank to guide the math."

  The taxi slowed for a light. The silence stretched, filled only by the wiper blades slapping the glass.

  "We're not going to agree," Mara said. "But we could settle it. Show me a thought-experiment verdict that is robust, traceable to no premise at all. Not just energy conservation. Something where the intuition outruns the framework. If you can give me one case where the armchair delivers truth without any hidden empirical borrowing, I'll concede."

  "And I," Julian said, turning off his phone, "will concede when you give me a convincing story about where the hidden empirical premise sits in every celebrated case. Not just the obvious ones. Show me the premise in Einstein's light wave. Show me the premise in Schrödinger's cat. If you can trace the necessity back to a stipulation every time, you win. But until then, you're treating philosophy like physics."

  "That's fair," Mara said. "But until then, you're treating physics like logic."

  "Driver," Julian said. "Just keep driving."
