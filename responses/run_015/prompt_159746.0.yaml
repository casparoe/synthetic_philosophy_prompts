answer: |-
  You have put your finger on the central tension in the English and Welsh parole system. You are not confused; the practice itself is a hybrid that tries to serve two masters (justice and safety) using a tool (insight) that is psychologically and sociologically messy.

  Here is the reconstruction of the implicit theory, the coherence check, and the hard cases, marked by footing as you requested.

  ### 1. The Implicit Theory: What is "Insight" Doing?

  **The Orthodox/Legal View:** Insight is **forward-looking (Risk Management).**
  The official line (Parole Board Rules, Ministry of Justice guidance) is that the tariff is the retributive element (what you deserve). Once that expires, the state's right to detain you rests *solely* on public protection. Therefore, "insight" is not a moral requirement for its own sake; it is evidentiary. The theory is: if you cannot acknowledge what you did, you cannot identify the triggers that led to it, and if you cannot identify the triggers, you cannot manage them. Therefore, denial equals unmanaged risk.
  *Footing: This is the stated legal justification.*

  **The Critical/Sociological View:** Insight is **Legibility (Compliance).**
  Your colleague is echoing a strong vein of criminological critique (rooted in Goffman and Foucault). On this view, "insight" is a performance of institutional compliance. It tests whether the prisoner has internalised the institution's values and language. A prisoner who says "I was there, I got done" is rejecting the authority of the panel to define their moral state. A prisoner who narrates the offence in therapeutic language ("I had unresolved trauma that led to harmful choices") has submitted to the authority of the system.
  *Footing: This is the dominant critical consensus in academic criminology.*

  **The Hidden/Third Function:** Insight is **Penitential (Moral Debt).**
  There is a third, often unacknowledged theory at play: that the tariff pays the debt to the *state*, but remorse pays the debt to the *moral order*. Many panel members (and the public) feel uneasy releasing someone who "doesn't get it," regardless of the risk stats. This suggests we are secretly using parole to complete a moral reformation that the sentence couldn't guarantee.
  *Footing: My synthesis/observation of panel culture.*

  ### 2. Is the Combination Coherent?

  **The Legal Defence:**
  Yes, it is legally coherent. The law distinguishes sharply between the *punitive* phase (tariff) and the *preventive* phase (post-tariff). You are not extending the punishment; you are continuing the detention because the *condition for safe release* hasn't been met. It is analogous to a mental health hold: you aren't being punished for being ill, but you can't leave until you're well.
  *Footing: Orthodox legal theory.*

  **The Moral Collapse:**
  No, it is morally unstable. In practice, "risk" is not a hard number; it is a judgement call. If "lack of insight" is the primary driver of that judgement, then a prisoner who maintains innocence serves longer than one who confesses, even if their objective risk factors (age, stability, supervision) are identical. This effectively turns the tariff into a *minimum* sentence, contingent on moral performance. This is "rehabilitation-by-stealth." It violates the principle of legal certainty: the prisoner knows how long the punishment is, but not when the liberty returns.
  *Footing: Live dispute in jurisprudence and ethics.*

  **Underdetermination:**
  You asked if several theories license what you do. **Yes.**
  1.  **Utilitarian:** Detain until risk is low (Insight = Risk Proxy).
  2.  **Retributivist (Soft):** Detain until moral debt is acknowledged (Insight = Penance).
  3.  **Administrative:** Detain until the file looks robust enough to defend in court (Insight = Paper Trail).
  Because the Board writes "lacks insight" rather than "statistical probability of reoffending is 40%," all three theories can hide behind the same phrase. This allows the system to function without agreeing on *why* it functions.
  *Footing: My synthesis.*

  ### 3. "I did wrong" vs. "I am a monster"

  **The Psychological Orthodoxy:**
  You are correct to distinguish these. In forensic psychology, this is **Guilt vs. Shame**.
  *   **Guilt ("I did wrong"):** Focuses on behaviour. Allows for repair. Compatible with change.
  *   **Shame ("I am a monster"):** Focuses on identity. Leads to hiding, defensiveness, and often re-offending to numb the feeling or prove the label right.
  *Footing: Mainstream forensic psychology.*

  **The Risk:**
  Demanding the first from people with no other identity risks manufacturing the second. If a prisoner's only value is "offender," and you demand they condemn that offender, they may feel they are being asked to annihilate themselves.
  **What the Board Should Do:**
  You should look for **cognitive responsibility**, not **emotional self-flagellation**. A prisoner who says, "I stabbed him. That was illegal and caused harm. I will not do it again," is safer than one weeping and calling himself "scum." The former has a boundary; the latter is in chaos. If your training says the latter is a warning sign, trust the training. Shame is a risk factor, not a mitigation.
  *Footing: Orthodox clinical guidance.*

  ### 4. The Hard Cases

  **The Maintainer of Innocence:**
  *   **The Problem:** If they deny the act, they cannot discuss triggers. Risk assessment is blind.
  *   **What is owed:** You owe them a search for *alternative* risk evidence. If they have a stable home, a job, and strong supervision, can the risk be managed *despite* denial? (This is rare for serious violence, but common for sexual offences where denial is high).
  *   **The Hard Truth:** Usually, maintaining innocence is treated as a static risk factor. The system owes them honesty: "We cannot assess risk without admission." But you must ensure you aren't punishing them for exercising a legal right (appeal/innocence).
  *Footing: Current Board practice, though ethically disputed.*

  **The Inarticulate (Chaotic childhood, no vocabulary):**
  *   **The Problem:** They fail the legibility test. They look like they lack insight because they lack syntax.
  *   **What is owed:** Reasonable adjustment. Does the psychological report account for learning difficulties? Can they demonstrate insight through behaviour rather than narration? (e.g., "I avoid the pub" vs "I understand my alcohol triggers").
  *   **The Failure:** The system often fails here. It privileges the middle-class ability to narrate a redemption arc.
  *Footing: Critical consensus.*

  **The Protestor/Flat Affect:**
  *   **The Problem:** They don't feel remorse because they don't accept the law's legitimacy.
  *   **The Decision:** This turns on *risk*, not *respect*. If a prisoner says, "I will bomb pipelines again for the cause," they are high risk. If they say, "I think the law is unjust but I will not break it again," they are low risk.
  *   **What is owed:** You owe them a distinction between *attitude* and *behaviour*. You cannot detain someone simply for disrespecting the panel. You detain for risk of re-offending.
  *Footing: Legal orthodoxy.*

  ### 5. The Halden Foil and Empirical Reality

  **Is your question confused?**
  Slightly. You are comparing a **release mechanism** (Parole) with a **regime philosophy** (Halden).
  *   **Norway:** Most prisoners are released on a fixed date (automatic). Risk assessment exists but is less tied to "performance of remorse." The regime (Halden) is about *normalisation* to reduce institutionalisation, not about extracting confessions.
  *   **UK:** Release is *discretionary*. Therefore, criteria are needed.
  *   **The Foil:** Halden works because the *release* isn't the lever. The UK uses release as the lever to enforce engagement.

  **The Empirical Gap:**
  You asked if this turns on an empirical question. **Yes.**
  Does verbal insight predict lower reconviction? The evidence is **mixed to weak**. Some studies show "demonstrated responsibility" correlates with lower recidivism. Others show that "scripted remorse" is just better manipulation.
  *   **The Honest Bit:** We assume the link because we have nothing better. We cannot see the future. We use "insight" as a heuristic for "change." It is a proxy.
  *Footing: Empirical criminology (disputed/weak evidence).*

  ### Summary of What Your Practice Owes

  1.  **To the Inarticulate:** It owes them a search for behavioural evidence of change, not just verbal. If they attend courses but can't write the essay, look at the attendance and conduct reports.
  2.  **To the Innocent:** It owes them a rigorous assessment of *risk factors* unrelated to the offence admission (e.g. lifestyle, associations). If those are low, denial alone should not detain indefinitely (though in practice, it often does).
  3.  **To the Public:** It owes honesty. We do not know for sure if "insight" makes people safer. We know it makes the *decision* defensible.

  **Final Verdict on Coherence:**
  The system is **procedurally coherent** (it follows the law) but **substantively unstable**. It tries to use a moral/psychological concept (remorse) to solve a predictive problem (risk).
  *   If you treat remorse as **evidence of risk reduction**, the practice is defensible but empirically shaky.
  *   If you treat remorse as **a condition of release**, the practice is punitive and potentially unjust (extending sentences beyond tariff).

  Your colleague's "legibility" critique is the most uncomfortable truth you have to sit with. The system selects for those who can speak its language. Your job, as a lay member, is to ensure that "speaking the language" doesn't become the only metric, and that you look for the substance of safety behind the script.

  *Footing on the above:*
  *   *Legal/Orthodox:* Tariff = Retribution, Parole = Risk.
  *   *Critical:* Legibility/Class bias in "insight".
  *   *Empirical:* Weak link between verbal remorse and recidivism.
  *   *Synthesis:* The system uses moral performance as a proxy for safety because it lacks better predictive tools.
