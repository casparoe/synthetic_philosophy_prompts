answer: |-
  (1) What the practice strictly presupposes
  The system strictly presupposes that recognized religious communities are public-law corporations rather than private voluntary associations. This legal status grants them standing to partner with the state as institutional peers. It requires the state to view religious institutional existence as compatible with public order, not antagonistic to it. Consequently, membership must be a verifiable legal fact, not merely an internal state of conscience. The state is not funding faith itself; it is administering dues for a recognized public entity and subsidizing specific public utilities those entities provide. This arrangement presupposes a theory of "open neutrality," where the state is permitted to cooperate with religion rather than strictly separate from it. It treats the church tax as a specialized levy administered by the state, distinct from general revenue, legitimizing the state's role as a collection agent without endorsing the dogma.

  (2) What it merely fits with and where it is philosophically underdetermined
  Your substitutability condition fits the funding of hospitals and kindergartens but not the church tax or theology faculties. The tax is not a payment for a substitutable public service; it is dues for membership. The system is philosophically underdetermined regarding membership status. It treats entry as quasi-civic (infant baptism creates a legal liability) for administrative efficiency, yet treats exit as voluntary (registry office declaration) for legitimacy. This hybrid allows conflicting theories to coexist: historical inertia (privilege), public good theory (welfare provision), and agency theory (state as neutral banker). The practice does not decide whether religion is purely private or public; it pragmatically treats it as private belief housed in public institutions. The exit procedure presupposes voluntary association, contradicting the status-like entry, but this tension is tolerated to balance individual freedom with administrative stability.

  (3) What would break or have to be rebuilt if it were replaced by the American or the French arrangement
  Adopting the American model would break the constitutional status of religious bodies. The Establishment Clause forbids state collection of religious dues and direct funding of theology faculties. You would need to rebuild religious providers as secular contractors funded via blind grants and rely entirely on voluntary donation. The French model would break the theology faculties and require "distancing neutrality." The state could not partner with religious entities even for social services without secularizing them completely. Both shifts require redefining neutrality from "supportive cooperation" to "separation" or "laïcité," fundamentally altering the civil society architecture where churches function as welfare arms of the state. The payroll infrastructure would change from withholding specific religious dues to processing only general tax, shifting the burden of funding religious infrastructure entirely to private voluntary giving or secular state budgets.
