answer: |-
  This is a precise and penetrating set of questions. You have identified a tension between the *formal appearance* of legal interpretation (manipulating symbols via rules) and its *operational reality* (relying on human understanding). Below is a reconstruction of the implicit theory, an analysis of your anchoring/grounding distinction, an assessment of institutional terms, and a projection of what would happen if you forced the practice to confront the symbol grounding problem directly.

  ### 1. Reconstructing the Implicit Theory: Deferred Grounding

  You are correct that the practice looks like a closed symbolic system, but your intuition that it is "parasitic" on the community is the key to the reconstruction. The practice does not presuppose that the text *itself* is grounded. It presupposes that the text is a **record of grounded mental states**.

  **The Theory:**
  The implicit theory of meaning is a form of **Historical Speaker Meaning Externalism**. It holds that:
  1.  Meaning is not a property of the ink on the page (symbols), nor is it a property of the judge's current mind.
  2.  Meaning is a historical fact about the linguistic competence of a specific population (the "reasonable reader" or "drafting legislature") at a specific time ($T_0$, enactment).
  3.  The judge's task is not to ground the symbols anew, but to *recover* the grounding that already existed in the heads of the relevant community at $T_0$.

  **How this avoids the Symbol Grounding Problem (SGP):**
  The SGP states that a system manipulating symbols solely based on their shape (syntax) cannot derive meaning (semantics). A dictionary is a syntax-to-syntax mapping. The legal practice avoids the SGP not by solving it for the text, but by **outsourcing** it. The statute is treated as a pointer. When a judge consults a dictionary or a definitions section, they are not trying to generate meaning from symbols; they are trying to reconstruct the *existing* nonsymbolic concepts held by the enactment-era community.

  **Is it Coherent?**
  It is coherent *pragmatically*, but it leaves a theoretical hole exactly where you suspect: **Hard Cases.**
  *   **Easy Cases:** The community's grounding at $T_0$ was robust and unanimous (e.g., "apple" in 1900). The judge successfully retrieves this grounded concept.
  *   **Hard Cases:** The community's grounding at $T_0$ was fuzzy, non-existent, or the world has changed such that the old grounding doesn't map to new instances (e.g., "vehicle" in 1900 vs. e-scooters).
  *   **The Hole:** In hard cases, the "outsourcing" fails because there is no clear grounded fact to retrieve. The practice pretends there is one (by arguing over dictionary definitions), but it is actually forcing the judge to *create* new grounding while claiming to *find* old grounding. The coherence breaks down because the theory denies the judge the authority to ground, while the practice requires them to do so when the historical grounding runs out.

  ### 2. Anchoring vs. Grounding

  Your distinction is vital. **Anchoring** is fixing reference by fiat or precedent (ostensive definition). **Grounding** is the nonsymbolic capacity to identify instances (recognitive capacity).

  **Does Anchoring Converge on Grounding?**
  No. A dense set of anchored exemplars does not *constitute* grounding; it merely *tests* it.
  *   **The Machine Learning Analogy:** Anchoring is the labeled training data. Grounding is the model's ability to generalize to unseen data. You can have infinite labeled data (anchoring), but if the system lacks the capacity to extract the relevant features (grounding), it cannot classify a new instance.
  *   **Legal Practice:** Precedent provides anchored exemplars. When a judge decides a new case, they must determine if the new case is "like" the anchored ones. That judgment of similarity *requires* prior grounding. You cannot compare two things for similarity without a prior capacity to perceive the relevant features.
  *   **Postponement:** Exemplar-anchoring postpones the question of *which* features matter. It does not solve it. If every new application required a new precedent, the law would be infinitely slow. The fact that judges apply precedents to novel facts proves they are relying on grounding (their capacity to see similarity), not just anchoring.

  **How to Tell the Difference:**
  You can tell the difference by introducing a **radical novelty**.
  *   If the term is merely anchored, a radical novelty (e.g., a telepathic contract) causes the system to crash or produce arbitrary results, because there is no anchored exemplar to point to.
  *   If the term is grounded, the interpreter can process the novelty using the underlying capacity (e.g., "Does this telepathic exchange function as an agreement?").
  *   **In Law:** The practice assumes grounding exists. When a judge says, "This e-scooter is functionally a vehicle," they are invoking a grounded capacity to recognize function, not just pointing to an anchored precedent of a Ford Model T. If they were only anchoring, they would have to say, "No precedent covers this, so the statute does not apply."

  ### 3. Institutional Terms and the Absurdity Hatch

  This is the crux of the matter. The SGP is typically illustrated with natural kinds ("cat," "red"). Legal language is often institutional ("contract," "negligence," "due process").

  **Where the Grounding Problem Arises vs. Pseudo-Problem:**
  *   **Pseudo-Problem (Purely Institutional):** For terms like "valid marriage" or "felony," the meaning *is* the rule. There is no nonsymbolic "marriage" object in the world independent of the rules. Here, grounding is not sensorimotor; it is **procedural**. The "grounding" is the capacity to recognize that the correct procedure was followed. The SGP misfires here because the "meaning" is exhausted by the symbol-to-symbol relations (the rules).
  *   **Genuine Problem (Hybrid Terms):** Most statutory disputes involve hybrid terms like "vehicle," "search," "cruel," or "weapon." These piggyback on ordinary language that *does* have sensorimotor or affective grounding.
      *   "Vehicle" relies on the grounded concept of *transport*.
      *   "Cruel" relies on the grounded affective response to *suffering*.
      *   Here, the SGP arises because the statute tries to fix the symbol ("vehicle") while the world changes the grounded reality (e-scooters).
  *   **Can the Practice Mark the Boundary?** No. The practice treats "person" (biological/legal hybrid) and "corporation" (pure legal fiction) with the same textual tools. It lacks a meta-rule to say, "For this word, look at the world; for that word, look only at the code." This is a source of persistent error, where courts treat functional terms as if they were defined terms.

  **The Absurdity Escape Hatch:**
  What is this doing? It is an admission that **symbolic anchoring has diverged from functional grounding.**
  *   It is not merely a normative override (though it functions as one). It is a semantic safety valve.
  *   When a reading is "absurd," it usually means that following the symbol-to-symbol chain leads to a result that violates the *grounded purpose* of the rule.
  *   *Example:* Banning "vehicles" from a park to ensure quiet and safety. An ambulance is a vehicle (symbolically/anchored). But letting it in does not violate the grounded purpose (safety/health).
  *   **Verdict:** The absurdity hatch acknowledges that the text (symbols) is a proxy for a grounded intent. When the proxy fails, the practice allows a direct appeal to the grounded intent. It is the moment the system admits it cannot solve the SGP purely internally.

  ### 4. The Replacement Question

  Suppose we drop the "historical community meaning" theory and require statutory meaning to be answerable to the **nonsymbolic, experienced capacities of the applier** (the judge/citizen) *now*.

  **What Becomes Illegitimate or Pointless:**
  1.  **Dictionaries:** Mostly illegitimate. They are symbol-to-symbol maps. They tell you how words relate to other words, not how words relate to the world.
  2.  **Definitions Sections:** Suspicious. A legislative fiat defining "vehicle" as "any device with wheels" is an attempt to *anchor* without *grounding*. If the grounded capacity of the judge says "a toy car with wheels is not a vehicle in this context," the definition section demands the judge ignore their grounding. Under a strict grounding requirement, these would be treated as presumptive, not binding.
  3.  **Fixation at Enactment:** Illegitimate. Grounding is a property of living agents. If meaning depends on the nonsymbolic capacity to identify, and our capacities evolve (we experience e-scooters differently than horses), meaning *must* evolve. Freezing meaning at $T_0$ is freezing the grounding of dead speakers.
  4.  **Textualism:** Collapses. Textualism relies on the text having a stable, public meaning independent of the judge's internal state. If meaning is grounded in the interpreter's capacity, the text is merely a trigger, not a container.

  **What Would Take Its Place:**
  *   **Phenomenological Inquiry:** Courts would ask, "What is the lived experience of this regulation?" rather than "What is the definition of this word?"
  *   **Functional Testing:** Instead of "Is it a vehicle?", the question becomes "Does it implicate the risks (noise, danger) the rule was grounded to prevent?"
  *   **Expert Testimony on Experience:** Not on "what the word means," but on "how this object functions in the world."

  **The Cost: The Loss of Public Meaning:**
  You identified the critical worry: **Grounding is agent-relative.**
  *   My sensorimotor history and affective responses differ from yours. If meaning is grounded in *my* capacity to identify, then "cruel" means what *I* experience as cruel.
  *   **The Trade:** Taking grounding seriously trades the **Rule of Law** (predictability, uniformity, public standards) for **Justice in the Particular** (accuracy, responsiveness to reality).
  *   **Can the Practice Bear It?** Likely not. The law's primary function is coordination. Coordination requires a Schelling point—a shared focal point. The "text at enactment" serves as a Schelling point, even if it is semantically imperfect. If every judge applies their own grounded understanding, the law fragments into as many meanings as there are judges.
  *   **The Compromise:** The current practice is a **fiction of shared grounding**. It pretends that the "reasonable reader" is a single entity with a single grounded understanding. This fiction is necessary for the law to function as a public system, even if it is philosophically unstable in hard cases.

  ### Summary of Underdetermination

  You asked me to be disciplined about what the practice *presupposes* versus what is merely *compatible*.

  *   **Strict Presupposition:** The practice *strictly* presupposes that there *was* a fact of the matter about how a competent speaker at $T_0$ would apply the term. It does not strictly presuppose *how* that speaker grounded the term (sensorimotor vs. functional), only that they *could* apply it.
  *   **Compatibility:** The practice is compatible with SGP solutions that rely on social externalism (meaning is in the community, not the head). It is *incompatible* with strong internalism (meaning is only in my head) or strong formalism (meaning is only in the symbol relations).
  *   **Underdetermination:** The practice is underdetermined regarding *which* terms require grounding. It treats "vehicle" and "corporation" with the same interpretive tools, despite one being grounded in physics/experience and the other in logic/stipulation. This suggests the practice is not driven by a coherent theory of meaning, but by a **heuristic of authority**: "Find the text that claims to settle this, and if it fails, use your judgment but call it 'interpretation'."

  **Final View:**
  The practice is philosophically strange because it tries to have it both ways. It wants the stability of symbols (anchoring) without admitting the brittleness of symbols (loss of grounding). It solves the SGP by **denial**: it denies that the judge is grounding the term, insisting they are merely retrieving a historical grounding. This works until the historical grounding is insufficient for the present reality. At that point, the "absurdity" hatch opens, and the judge silently performs the grounding work the theory forbids them to do. The system survives not because its theory of meaning is sound, but because the judges share enough overlapping grounded experience to make the fiction plausible most of the time.
