answer: |-
  You are right to be skeptical, and you are right that "Looping" and "Concept Creep" are not quite it. Your colleague was reaching for the right shelf of ideas, but picked the wrong boxes.

  Here is the breakdown of what you are seeing, the name for it, and how to explain it to your commissioners without triggering a defensive reaction.

  ### 1. Why "Looping" and "Concept Creep" don't fit

  Your friend's suggestions are neighbors of this phenomenon, but they describe different mechanisms.

  *   **Looping Effects (Ian Hacking):** This is about *feedback between the label and the person*. If you label a group "autistic," they may organize around that label, change their behavior, or demand different services, which then forces the clinicians to update the definition. Looping requires the *classified people* to push back on the classification. What you are describing is internal to the *measurement system*; it happens even if the patients never know the criteria changed.
  *   **Concept Creep (Nick Haslam):** This is about *semantic expansion*. It describes how a word like "trauma" or "bullying" gradually expands to cover milder or broader experiences, usually driven by social or moral motives. While your ADHD and Autism examples involve expansion, Concept Creep focuses on the *meaning* of the word changing in culture. You are describing the *instrument* changing while the *word* stays fixed to preserve the utility of the graph.

  ### 2. The Technical Root: Measurement Non-Invariance

  In psychometrics and epidemiology, the technical term for what you are seeing is **Measurement Non-Invariance** (or a lack of **Longitudinal Measurement Invariance**).

  This means the "ruler" you are using at Time A is not the same physical object as the "ruler" you are using at Time B, even if they both have inches marked on them.
  *   **Autism:** The DSM-5 merger of Asperger's into ASD changed the "inch."
  *   **ADHD:** The shift from strict childhood onset to adult-onset allowance changed the "inch."
  *   **IQ:** Renorming is an *explicit* admission of non-invariance (we are resetting the ruler to keep the average at 100).

  In official statistics, when a definition changes fundamentally, it is supposed to be marked as a **Break in Series**. A Break in Series tells the viewer: "Data before this point is not comparable to data after this point."

  ### 3. The Name for Your Phenomenon: "The Continuity Artifact"

  Since there isn't a single catchy phrase in philosophy of medicine that captures the *dashboard-specific* illusion you are describing, I propose you call this **The Continuity Artifact**.

  **Definition:**
  > A **Continuity Artifact** occurs when a longitudinal metric (a trend line) displays smoothness or stability across time, not because the underlying phenomenon is stable, but because the operational criteria, thresholds, or instruments have been adjusted—often silently—to maintain the visual continuity of the metric.

  **Why this name works:**
  *   **Continuity:** It identifies the visual feature that deceives the viewer (the unbroken line).
  *   **Artifact:** In science, an artifact is something observed in a scientific investigation that is not naturally present but occurs as a result of the investigative procedure. It signals that the smoothness is *manufactured* by the reporting process, not discovered in the population.

  ### 4. Boundaries: Real Change vs. The Artifact

  To survive your skeptical colleague, you need to distinguish this from legitimate data updates. Here is the edge detection:

  | Feature | **Genuine Trend** | **Continuity Artifact** |
  | :--- | :--- | :--- |
  | **Definition** | Criteria remain constant, or changes are explicitly flagged as a "Break in Series." | Criteria drift or change, but the graph remains unbroken and unannotated. |
  | **Instrument** | Same assessment tools used, or new tools are cross-validated against old ones with a conversion factor. | Tools change (e.g., paper to self-report app) without statistical bridging. |
  | **Thresholds** | Eligibility thresholds are fixed. | Thresholds shift (e.g., "sub-clinical" cases become billable) to match capacity or demand. |
  | **Smoothness** | May show jumps or steps when external events occur. | Suspiciously smooth across known periods of systemic change (e.g., new DSM edition). |
  | **Transparency** | Metadata explains *how* things were counted. | Metadata is static; only the numbers move. |

  **Lookalikes (What it isn't):**
  *   **Re-validation:** If you publish a report saying "We switched tools in 2020, here is the conversion rate," that is honest calibration, not an artifact.
  *   **Advocacy-Driven Expansion:** If a campaign successfully argues that "mild depression counts as depression" and the definition is officially updated with a date stamp, that is a **Policy Change**, not an artifact. The artifact is *failing to mark the date stamp on the graph*.
  *   **Shunting:** If you move patients from Category A to Category B to make Category A look better, that is **Gaming** (or Goodhart's Law). The Continuity Artifact is subtler; it's keeping Category A looking like *itself* over time, even though its contents have changed.

  ### 5. Draft Text for Commissioners

  Here is a draft you can adapt for your report. It is written to be neutral, technical, and protective of your own credibility.

  > **Note on Data Interpretation: Longitudinal Comparability**
  >
  > Commissioners should interpret the long-term prevalence trends in this dashboard with caution. While the trend lines appear continuous, the clinical and operational definitions underlying these counts have evolved significantly over the reporting period (e.g., DSM-5 revisions, changes in assessment instruments, and shifts in service eligibility thresholds).
  >
  > In technical terms, this data exhibits **Measurement Non-Invariance**. This means that a "case" recorded in 2015 is not operationally identical to a "case" recorded in 2024. Where definition changes have been absorbed into the dataset without a statistical "break in series," the resulting smooth trend line is a **Continuity Artifact**. It reflects the stability of the *reporting category* rather than the stability of the *clinical population*.
  >
  > Consequently, year-on-year percentage changes should not be read as organic growth or decline in need. They represent a composite of changing clinical need, changing diagnostic practice, and changing administrative capacity. We recommend focusing on short-term fluctuations (12–24 months) where operational definitions are more likely to be stable, rather than long-term historical trajectories.

  ### Summary for your Colleague

  If you need to settle the argument quickly:
  *   **Looping** is people changing because of the label.
  *   **Concept Creep** is the label meaning more things.
  *   **The Continuity Artifact** is the *graph* lying about the ruler changing.

  You are not seeing a change in the patients; you are seeing the administrative maintenance of a usable metric. The smooth line is a feature of the dashboard, not the population.
