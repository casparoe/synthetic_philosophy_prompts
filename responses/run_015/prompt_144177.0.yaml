answer: |-
  The ledger lay open on the slate table, heavy as a tombstone. Dust motes danced in the shaft of light cutting through the sluice house, settling on the page where Rule 30 lived. Below it, in fresh ink, was the vote: 14 aye, 10 nay.

  Elias, the sluice keeper, wiped his hands on his trousers. They were dry. Everything was dry. The creek bed hadn't seen flow in six weeks.

  "It's passed," said Tomas, standing with the fourteen. He tapped the old text. "Majority rules. That was the law when we raised our hands."

  "It's void," said Mara, leading the ten. "You can't use a majority to lock out a majority. The new rule demands two-thirds. If it didn't get two-thirds, it doesn't exist. If it doesn't exist, the old rule stands. But if the old rule stands, it did exist." She stopped, frustrated. "You see?"

  Elias didn't see. He looked at Elara, the Reader. She sat apart, her own contract open on her lap. She was the outsider, the one paid to speak when the ink grew muddy. Her fee was written on page five, her authority on page six. Both were bound in the same leather as Rule 30.

  "Elara," Elias said. "Read it."

  Elara ran a finger down page six. *The Reader shall interpret ambiguities in the Ledger. Her ruling stands for the agricultural year.* Her contract had been signed three years ago, valid for ten. It was a slow rule in a fast valley. The water schedule changed every harvest; her power was decadal.

  "The ambiguity is temporal," Elara said. Her voice was flat, practiced. "Rule 30 changed itself. The vote occurred in the transition between the old law and the new. The Ledger does not specify which version governs the transition."

  "So decide," Tomas said.

  "If I rule based on the old Rule 30," Elara said, looking up, "then the new rule passes. If the new rule passes, it retroactively invalidates the vote that created it. If I rule based on the new rule, the vote fails, the old rule remains, and I am left standing on the ground I just dug away."

  "Then who gets water?" Mara demanded. "The north fields or the south?"

  Elara looked at the ledger. She was inside the book. Her authority to solve the paradox came from the text that was paradoxical. She was a third hand drawing the two hands, but her wrist was drawn by them. She thought about her fee, guaranteed for seven more years regardless of the water. She was the slow part of the loop, the anchor that didn't hold.

  "I need to check the precedence," Elara said.

  "There is no precedence," Elias said. "Nothing like this has ever happened."

  "Then I must interpret the intent." Elara dipped her pen in the pot. The ink was thick, black as oil. "The Ledger aims for continuity. The system must not cease."

  "If you say the vote passed," Tomas warned, "we hold the schedule. South gets water Tuesday and Friday."

  "If you say it failed," Mara countered, "we rotate. North gets Tuesday and Friday."

  Elara hovered the pen over the blank page beneath the vote. She felt the weight of the valley pressing on the roof, the dry wind scratching at the walls. She realized the symmetry was broken. The water rules were frantic, shifting yearly like sand. Her contract was stone. She could lock this in place for a year, regardless of what they voted next autumn.

  She wasn't resolving the knot. She was tightening it.

  "I rule," Elara said, "that the vote is valid under the rules existing at the time of casting."

  Tomas exhaled, a sharp sound. Mara stepped forward, her face hardening.

  "However," Elara continued, the pen scratching now, loud in the silence. "Because the new Rule 30 is now in force, it governs all future amendments. Including this ruling."

  "That doesn't make sense," Elias said.

  "It makes the system continue," Elara said. She wrote quickly. *Ruling 44: Water allocation follows the proposed schedule. South fields, Tuesday and Friday. North fields, Sunday and Wednesday.*

  "You're giving us the drought days," Mara said. Sunday and Wednesday were the evaporation days. The sun was highest.

  "I am following the majority," Elara said.

  "But you just said the new rule is in force," Mara pressed. "The new rule says we need two-thirds for schedule changes. You didn't get two-thirds on this ruling."

  "My ruling stands for the year," Elara said, pointing to page six. "That contract was signed three years ago. It predates Rule 30's amendment. It is the older law. It overrides the new threshold."

  "So you used the old rule to validate the new rule, then used the old contract to bypass the new rule?" Elias asked. His head throbbed.

  "I kept the water flowing," Elara said. She blew on the wet ink. "If I stop to check the logic, the crops die."

  She closed the ledger. The sound was final, like a gate latching.

  "Open the sluice," she told Elias.

  Elias stood. He walked to the wheel that controlled the gate. He looked at Tomas, who was already smiling, and Mara, who was calculating losses. He looked at Elara, who was packing her satchel, already paid for the year regardless of the harvest.

  He turned the wheel. The rusted iron groaned. Below, in the concrete channel, a trickle of brown water began to move. It flowed toward the south fields first, as written.

  Mara didn't leave. She watched the water. "Next year," she said. "We vote again."

  "Rule 30 says you need two-thirds," Tomas said.

  "Rule 30 says whatever Elara says it says," Mara replied.

  Elara paused at the door. The sun outside was bleaching the wood of the frame. "Next year," she said, "my contract enters its fourth year. The fee increases."

  "Who pays?" Elias asked.

  "The Ledger," Elara said. "Page five."

  She stepped out into the heat. Elias watched the water reach the first division. It split, unevenly, favoring the south. The logic held, barely, like a dry stone arch holding itself up by friction. No one knew where the weight rested, only that if anyone moved, the whole thing would come down.

  Elias picked up the pen. He had to record the flow rate. He dipped the nib. The ink was still wet where Elara had signed. He wrote the numbers, knowing that next year, someone would ask him why the water went south, and he would point to the page, and they would point back, and the water would have to flow somewhere while they argued.

  He wrote *Tuesday: South*. He capped the pen. The wheel kept turning, driven by the current it controlled.
