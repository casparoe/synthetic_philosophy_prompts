  8.  **Self-Correction during drafting:** I need to make sure I don't just say "go collectivist." I need to explain *why* the individual frame causes the impasse. The individual frame forces the Skeptic's causation metric. The Interventionist is trying to use a non-causal metric *within* an individual frame, which looks like magic to the Skeptic. The solution is to change the frame.

  9.  **Final Review against constraints:** No named theorists (keep it conceptual). Engage concrete positions (voter, eater, emitter). Honest answer about progress. (Proceed to generate output).

