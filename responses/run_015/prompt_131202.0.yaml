answer: |-
  Your hypothesis is correct in direction but needs sharpening in ontology. The impasse is not merely about what counts as a "moral reason"; it is a clash between **methodological individualism** (the Skeptic's framework) and **structural realism** (the Interventionist's framework), disguised as a debate about causal efficacy.

  The reason the literature feels exhausted is that both sides are trying to solve a collective problem using an individualist calculus. The Skeptic wins on the individualist calculus; the Interventionist wins on the collective ontology. Because you are debating within the individualist frame ("What difference do *I* make?"), the Skeptic always holds the home-field advantage of causal logic, while the Interventionist is forced to make appeals that sound like mysticism (e.g., "purity," "symbolism") because they lack a causal vocabulary for structural participation.

  Here is the concrete diagnosis of the fracture, followed by an honest assessment of whether it can be moved.

  ### 1. The Diagnosis: A Mismatch of Moral Ontology

  The stalemate exists because the two sides are answering different questions while using the same vocabulary ("harm," "wrong," "responsibility").

  **The Skeptic's Position: The Counterfactual Comparative Account (CCA)**
  The Skeptic operates on a hidden premise: *Moral assessment requires a counterfactual comparison of world-states.*
  *   **The Logic:** To say an act is wrong, it must make the world worse than it would have been had the act not occurred.
  *   **The Application:** In climate, voting, or consumption, the causal chain is overdetermined. My abstention does not change the temperature, the election result, or the production volume. Therefore, World-State A (I act) is identical to World-State B (I abstain).
  *   **The Intuition:** If there is no victim (no one made worse off), there is no crime. To claim otherwise is to engage in "magical thinking" or to prioritize the agent's feelings (integrity) over actual suffering.
  *   **The Blind Spot:** This view treats the collective as a *sum* of individuals. It cannot conceptualize harm that emerges from the *pattern* of interaction rather than the *sum* of impacts.

  **The Interventionist's Position: The Participatory Account**
  The Interventionist operates on a hidden premise: *Moral assessment evaluates the agent's relation to a normative structure.*
  *   **The Logic:** Wrongness is not solely about outcome production; it is about *complicity* in a harmful practice. One can be complicit in a harm one did not causally necessitate.
  *   **The Application:** Eating factory-farmed meat supports the *institution* of factory farming, even if it doesn't change the specific number of chickens killed. Voting is a duty of citizenship, not a causal lever.
  *   **The Intuition:** There is a difference between a person who refrains from harm because it's futile and one who refrains because it's wrong. The former is a prudent free-rider; the latter is a moral agent.
  *   **The Blind Spot:** Without a robust theory of *how* participation matters non-causally, this sounds like "clean hands" fetishism. It struggles to explain why participation is wrong if it doesn't sustain the practice (e.g., if I buy the meat but the shopkeeper throws it away).

  **The Fracture:**
  The Skeptic asks: *"Did my act change the outcome?"*
  The Interventionist asks: *"Did my act align me with a harmful practice?"*

  The debate stalls because the Skeptic demands the Interventionist prove causal efficacy (which they can't), and the Interventionist demands the Skeptic acknowledge non-causal wrongness (which the Skeptic's meta-ethics forbids).

  ### 2. Is It Verbal, Empirical, or Foundational?

  It is **foundational**, specifically regarding the **Unit of Moral Agency**.

  *   **Not Empirical:** As you noted, both sides agree on the physics and economics. The Skeptic isn't denying climate change; they are denying that *individual* action is the relevant variable for moral assessment of climate change.
  *   **Not Merely Verbal:** It is not just a dispute over the definition of "harm." It is a dispute over whether morality is fundamentally about *states of affairs* (Skeptic) or *relations of will* (Interventionist).
  *   **Foundational:** The Skeptic assumes the **Individual** is the primary unit of moral analysis. The Interventionist implicitly assumes the **Collective/Structure** is the primary unit, and the individual is derivative.

  When the Skeptic says, "Your vote doesn't matter," they mean "Your vote is not a pivot." When the Interventionist says, "Your vote matters," they mean "Your vote is a necessary condition for the legitimacy of the collective agent." They are using "matter" to refer to two different ontological categories: *Causal Power* vs. *Constitutive Membership*.

  ### 3. Why the "Structural Complicity" Frame Isn't Enough

  You mentioned framing this as "structural complicity." This is the right terminology, but it often fails to move Skeptics because it sounds like a label rather than an argument.

  To the Skeptic, "complicity" without causation looks like guilt by association. They will ask: *"If my participation changes nothing, in what sense am I 'joined' to the harm?"*
  If the Interventionist answers, "Because you are part of the group," the Skeptic replies, "Being part of a group that does harm doesn't make *your* specific action harmful if your action is redundant."

  The impasse persists because the Interventionist has not successfully explained the **mechanism of moral transmission** in redundant contexts. How does the wrongness of the collective outcome "touch" the individual who causally contributed nothing? Without a mechanism, it remains an intuition clash.

  ### 4. Can This Be Moved? (The Honest Answer)

  **Will a formal decision-theoretic model help?**
  **No.** Standard decision theory (causal or evidential) is built on the Skeptic's ontology. It calculates expected utility based on probabilities of outcomes. If the probability of being pivotal is near-zero, the model dictates indifference. You cannot model "integrity" or "complicity" into a utility function without the Skeptic rejecting the function as question-begging.

  **Will a conceptual distinction help?**
  **Yes, but only one:** Distinguishing **Causal Responsibility** from **Moral Responsibility**.
  You must get the group to agree that these can come apart.
  *   *Example:* A firing squad where only one gun has live rounds, but all shoot. All are morally responsible for the death, but only one is causally responsible.
  *   *Application:* If the group accepts that moral responsibility can exist without specific causal efficacy in *some* cases (like the firing squad), the Skeptic's hard constraint is broken. However, Skeptics often reject the firing squad analogy for climate/voting, arguing those are "loose" collectives, not "joint actions."

  **Is the individual-level framing malformed?**
  **Yes. This is the only path forward.**
  The question "What difference do *I* make?" is a category error in the context of structural harm. It presupposes that the moral problem is solvable via atomic individual actions.

  **The Proposed Shift:**
  Stop asking: *"Is my individual act wrong given its inefficacy?"*
  Start asking: *"What obligations do I have as a member of a collective that is harming others?"*

  If you shift the frame to **Collective Obligation**, the logic changes:
  1.  **Premise 1:** The collective (e.g., the electorate, the carbon-emitting public) has an obligation to stop the harm.
  2.  **Premise 2:** The collective can only act through the actions of its members.
  3.  **Conclusion:** Members have a derivative duty to perform their "fair share" of the collective action, *regardless of marginal causal impact*.

  This bypasses the inefficacy objection. It doesn't matter if *my* vote changes the election; it matters that *we* must vote to fulfill *our* duty, and my duty is to do my part of *our* job. The Skeptic cannot attack this with causal redundancy because the obligation is not grounded in *my* causal power, but in *our* collective agency.

  ### 5. Practical Advice for the Reading Group

  To break the impasse, I recommend the following intervention:

  1.  **Grant the Skeptic the Causal Point:** Explicitly concede that, in isolation, the individual act makes no counterfactual difference. Stop trying to prove "expected utility" arguments (thresholds, tipping points) unless the group disagrees on the math. If they agree on the math, those arguments are distractions.
  2.  **Challenge the Unit of Analysis:** Ask the Skeptic: *"If we agree the collective is responsible, and the collective is just us, how do you propose we discharge that responsibility if not by each of us doing our part?"*
      *   If the Skeptic says "We can't," they are admitting moral nihilism regarding collective harms.
      *   If the Skeptic says "We need regulation," ask: *"Who regulates? Us. How? Voting/Advocacy. Is that redundant too?"*
  3.  **Introduce the "Fair Play" Argument:** Shift the debate from *Harm* to *Free-Riding*.
      *   Even if my carbon cut doesn't stop climate change, I benefit from the restraint of others (if they restrain). If I do not restrain, I am free-riding on the cooperative scheme, even if the scheme is currently failing to reach its goal. The wrongness is in the *unfairness*, not the *outcome*.
  4.  **Reframe "Wrongness":** Propose that in collective contexts, "wrong" does not mean "causing bad states." It means "failing to uphold one's end of a joint endeavor."

  **Prognosis:**
  If you stay in the "Does my act cause harm?" frame, **the impasse is permanent.** The Skeptic's causal logic is sound within that frame.
  If you shift to "What does membership in a harming collective require of me?", **progress is possible.** This forces the Skeptic to either defend moral nihilism (which is unpopular) or explain how collective responsibility translates to individual action without relying on marginal causation.

  The breakthrough will not come from better math. It will come from recognizing that the inefficacy objection is a symptom of trying to solve a systemic problem with an atomic moral theory.
