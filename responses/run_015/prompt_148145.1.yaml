          *   The "Pro-Supply/Solvency/Small Biz" bloc (approx. 3-4 votes based on Case 2, 5, 7, 8, 9 Portfolio) hates the nominal freeze, the deficit risk, and the vacancy decontrol mechanism.
      *   *The Pivot:* The Fiscal Deficit and the Nominal Freeze are the killers. Case 5 (Cost-based formula) and Case 7 (No universal freeze) are strong precedents against a 5-year nominal freeze. Case 2 (No vacancy decontrol) is strong against the decontrol clause.
      *   *Prediction:* **Rejection (5-4 or 6-3).**
      *   *Why:* It violates the Solvency Rule (nominal freeze vs cost pass-through), the Supply Rule (vacancy decontrol), and Fiscal Sustainability (projected deficit).
      *   *Closest Analog:* Case 7 (2020 Rent Freeze). Both propose broad affordability via price control/subsidy mix, but Case 7 rejected the control element for targeted aid due to owner impact. Also Case 2 (Vacancy Decontrol).

  6.  **Underdetermination Analysis:**
