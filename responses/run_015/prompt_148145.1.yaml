answer: |-
  **MEMORANDUM**

  **TO:** Northgate Housing and Labor Standards Board
  **FROM:** Policy Office
  **RE:** Precedent Analysis and Prediction for Proposal 24-07 (Tenant-Anchored Stabilization)

  Based on the Board's nine prior rulings, the following analysis derives the operative decision rules implicit in the record, applies them to Proposal 24-07, and predicts the outcome.

  ### I. Derived Decision Rules

  The Board's record reveals three consistent decision rules that govern price interventions. These rules are not ranked in the ordinance but function as veto points in practice.

  **Rule 1: The Solvency Constraint (Derived from Cases 5, 7, 8)**
  Price regulations cannot force returns below operating costs or impose liabilities that risk operator insolvency. Where affordability goals conflict with landlord solvency, the Board prefers direct subsidies (Case 7, 9) over rigid price ceilings that lack cost pass-through mechanisms (Case 5, 7).
  *   *Test:* Does the intervention guarantee the operator can cover documented costs (taxes, insurance, utilities, capital), or does it rely on the operator to absorb the loss?

  **Rule 2: The Stock Preservation Principle (Derived from Cases 1, 2, 6)**
  Interventions must not accelerate the exit of units from the regulated stock or chill new production. Regulations should protect sitting tenants (Case 1) but must preserve landlord upside at turnover to maintain supply (Case 2, 6). Full vacancy decontrol is rejected because it erodes the regulated stock one turnover at a time (Case 2).
  *   *Test:* Does the intervention reduce the long-term supply of regulated units or discourage new entry?

  **Rule 3: The Unit-Level Consistency Rule (Derived from Cases 3, 9)**
  Regulations attach to the transaction or unit, not the portfolio size. While small operators may receive timing delays to mitigate capacity constraints (Case 3), they are not exempt from jurisdiction based on size, because bargaining power is exercised at the unit level, not the portfolio level (Case 9).
  *   *Test:* Does the proposal differentiate rights or obligations based on landlord portfolio size, and if so, is it a timing delay (permissible) or a jurisdictional exemption (impermissible)?

  ### II. Application to Proposal 24-07

  **Overall Prediction:** The proposal violates Rules 1 and 2 in its current form. While the "tenant-anchored" concept aligns with the Chair's recent comment, the fiscal and structural mechanics conflict with the Board's established solvency and supply precedents.

  **Clause-by-Clause Analysis:**

  1.  **Tenant-Anchored Cap (Portable):**
      *   *Analysis:* Shifts regulation from unit to household.
      *   *Rule 3:* This challenges the "Unit-Level" precedent (Case 9). However, the Chair's June remark suggests a potential majority is willing to evolve Rule 3.
      *   *Prediction:* Likely acceptable to a majority *if* other flaws are cured.

  2.  **Small-Landlord Opt-In (4 or fewer units):**
      *   *Analysis:* Exempts small landlords from being "receiving landlords" unless they choose otherwise.
      *   *Rule 3:* **Violation.** Case 3 granted a *delay* to small employers; Case 9 rejected portfolio-based distinctions for rights. This is a permanent *exemption*, creating a two-tier market. It aligns with the *spirit* of Case 7 and 8 (protecting small owners from loss) but conflicts with the *logic* of Case 9 (jurisdiction is unit-based).
      *   *Prediction:* Contested. The Board may require this be changed to a "delay" or removed to ensure market uniformity.

  3.  **Immediate Decontrol of Vacated Units:**
      *   *Analysis:* When a participating tenant leaves, the unit returns to market rate immediately.
      *   *Rule 2:* **Direct Violation.** Case 2 explicitly rejected vacancy decontrol on the ground that "the regulated stock erodes one turnover at a time." This proposal accelerates that erosion.
      *   *Prediction:* High risk of rejection. This is the strongest precedent against the proposal.

  4.  **Nominal Freeze (5 Years) + Percentile Reset:**
      *   *Analysis:* Cap is frozen in nominal terms for five years.
      *   *Rule 1:* **Direct Violation.** Case 5 rejected a CPI cap without cost pass-through because it can "drive rents below operating cost." A *nominal* freeze is significantly more rigid than a CPI cap and lacks the cost-based formula (taxes, insurance, utilities) mandated by Case 5.
      *   *Prediction:* Fatal flaw. The Board has never approved a price control without a cost-pass-through mechanism.

  5.  **Funding Structure (Deficit Projected):**
      *   *Analysis:* Outlays ($48–140m) exceed Revenues ($70–95m).
      *   *Rule 1 (Fiscal Sustainability):* **Violation.** The Ordinance mandates weighing "fiscal sustainability." Case 7 preferred means-tested assistance over universal controls partly to manage fiscal exposure. A structural deficit violates the Board's duty to ensure the program does not collapse.
      *   *Prediction:* Fatal flaw. The Board will not approve a program projected to be insolvent.

  ### III. Vote Prediction and Analog

  **Predicted Vote:** **Rejection, 5–4.**

  **Reasoning:**
  The "Pro-Regulation" coalition (approx. 6 votes in Cases 1 and 9) will fracture. While they favor tenant protections, the **Nominal Freeze** and **Projected Deficit** trigger the "Solvency/Fiscal" coalition (approx. 5 votes in Cases 5, 7, 8).
  *   The 4 votes to approve will likely come from members prioritizing the "Tenant-Anchor" innovation and the subsidy mechanism (aligning with Case 7's preference for money over controls, but applied here to support controls).
  *   The 5 votes to reject will cite Case 2 (Vacancy Decontrol erodes stock), Case 5 (No cost pass-through), and the Ordinance's Fiscal Sustainability mandate.

  **Closest Analog:** **Case 2 (2019 Vacancy Decontrol Rejection)** combined with **Case 5 (2021 Rent Formula)**.
  *   Like Case 2, Proposal 24-07 relies on turnover to reset prices, which the Board has already ruled erodes the regulated stock.
  *   Like Case 5, Proposal 24-07 imposes a rigid price formula (nominal freeze) without guaranteeing operating cost coverage.

  ### IV. Underdetermination and Test Proposal

  **Do the precedents underdetermine the answer?**
  **Yes.** The precedents determine the *financial* and *supply* flaws, but they do not determine the *Tenant-Anchor* concept. All prior rent cases (1, 2, 5, 7, 9) were unit-anchored. The Chair's remark suggests the Board may be willing to break Rule 3 (Unit-Level Consistency), but the record does not confirm if a majority will follow.

  **Commitments:**
  *   **Voting Yes:** Commits the Board to "Tenant Rights > Unit Rights" and accepts deficit spending as a tool for housing stability (overriding Case 5 and Fiscal Sustainability).
  *   **Voting No:** Commits the Board to "Unit-Based Regulation Only" and "No Deficit-Funded Price Supports."

  **Test Proposal to Separate Leading Rules:**
  To determine if the Board rejects 24-07 due to the *Tenant-Anchor* concept or the *Financial/Supply* flaws, staff should propose the following amendment for a straw poll:
  *   **Proposal:** "Index the tenant's capped rent to **CPI** (not a nominal freeze), guarantee the Fund covers **operating costs** if market rent falls below them (Case 5 standard), and require **vacated units to remain capped** for the next tenant (Case 2 standard), funded by **general revenue** to eliminate the deficit."
  *   **Rule Prediction:**
      *   If the **Solvency/Stock Rules** dominate: The Board will approve this amended version (Vote 6–3).
      *   If the **Unit-Level Rule** dominates: The Board will still reject it (Vote 5–4) because the cap follows the tenant, not the unit.

  ### V. Small-Landlord Exemption Analysis

  **Question:** Does the Board's treatment of employer size in 2021 (Case 3) and tipped/platform workers in 2022 (Case 4) transfer to the small-landlord exemption in 24-07?

  **Answer:** **The analogy is misleading.**

  1.  **Delay vs. Exemption (Case 3):** In 2021, the Board granted small employers (<20 employees) a **12-month delay** in compliance, not an exemption. They were subject to the same jurisdiction, merely given time to adjust capacity. Proposal 24-07 grants small landlords (<4 units) a permanent **opt-in exemption**. This creates a permanent two-tier market, which Case 3 did not authorize.
  2.  **Jurisdiction vs. Capacity (Case 9):** In 2023, the Board rejected a portfolio cap (>100 units) specifically because "bargaining power... is exercised at the level of a unit." Exempting landlords based on unit count (<4) implies bargaining power *is* determined by portfolio size, directly contradicting the majority reasoning in Case 9.
  3.  **Solvency Protection (Case 7 & 8):** The exemption *does* align with Case 7 and 8, which shielded small owners from universal freezes and high relocation costs to prevent insolvency.

  **Conclusion:** The Board is likely to view the exemption as inconsistent with Case 3 and Case 9. To align with precedent, the "opt-in" should be converted to a "phase-in" (e.g., small landlords are automatically included after 24 months) or removed entirely, relying instead on the Fund to cover any solvency gaps (aligning with Case 5).
