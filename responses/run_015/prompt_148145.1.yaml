          *   *Conflict:* High risk of violating Rule 1 (Solvency) unless the Fund credit covers the gap *and* the base rent covers costs. The proposal says credit = difference between capped rent and market rent. It does *not* explicitly guarantee operating cost coverage if market rent < operating cost (unlikely) or if the Fund runs dry.
