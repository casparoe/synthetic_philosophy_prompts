      *   Test Proposal: A "Cost-Pass-Through Guarantee" amendment. If the Fund guarantees operating costs (not just market rent difference) and is funded by general revenue (not just fees), does the Board support it?
      *   *Better Test:* A proposal to index the *tenant's* cap to CPI rather than a nominal freeze. If they reject CPI indexing for tenants but accepted cost-pass-through for units (Case 5), that clarifies if they care about the *method* or the *beneficiary*.

