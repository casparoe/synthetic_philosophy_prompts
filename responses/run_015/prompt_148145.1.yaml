      *   *Conclusion:* The analogy is **misleading**. Case 3 protected small employers from *timing* of compliance, not from the *jurisdiction* of the law. Case 9 explicitly said portfolio size doesn't determine bargaining power. Exempting <4 units entirely suggests small landlords lack bargaining power or capacity, which contradicts Case 9's logic (unit level) and Case 3's logic (delay, not exemption). However, Case 7 and 8 show high concern for small owner *insolvency*.
