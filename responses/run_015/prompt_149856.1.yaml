  so i was skimming a handout from a grad seminar on pragmatic encroachment vs epistemic contextualism, and the summary feels off but i cant pinpoint where. here's what it said, more or less: pragmatic encroachment is the view that whether you know p depends on practical stakes, but unlike contextualism it doesnt say the word 'knows' changes meaning with context. instead, encroachment is a metaphysical claim: high stakes literally raise the evidential threshold required for knowledge, so the same weak evidence can yield knowledge in a low-stakes situation but fail in a high-stakes one. the handout then claims this is fully compatible with invariantism about 'knows', since the word always expresses the same relation, but the world-level conditions for that relation being satisfied shift with stakes. then it says contextualism is basically just encroachment applied to linguistic practice—once you accept that stakes affect knowledge conditions, youve already abandoned invariantism about knowledge ascriptions. finally it adds that both views reject the traditional belief-truth-justification trio, except encroachment keeps justification constant and instead modifies the belief-to-truth connection through practical pressure. that last bit sounds especially weird to me.

