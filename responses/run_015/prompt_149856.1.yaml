answer: |-
  This is a sharp catch. Your intuition that the handout is "off" is correct. While it gets the surface-level slogans right, it conflates distinct mechanisms and makes a few category errors that would cause real trouble in a seminar discussion.

  Here is the conceptual audit, broken down by the specific claims in the text.

  ### 1. The Nature of Encroachment: Metaphysical vs. Linguistic
  **The Handout's Claim:** *Pragmatic encroachment is a metaphysical claim: high stakes literally raise the evidential threshold required for knowledge... compatible with invariantism about 'knows'.*

  **The Audit:** **Mostly Accurate.**
  This is the strongest part of the summary. It correctly identifies the core motivation of Pragmatic Encroachment (often technically called *Subject-Sensitive Invariantism*).

  *   **What's right:** The view is indeed that the *relation* of knowledge is sensitive to the subject's practical environment (stakes), while the *word* "knows" retains a single, fixed semantic content. If I say "You know the bank is open," and you say "You know the bank is open," we are using "knows" to pick out the exact same property. However, whether you *possess* that property depends on what happens if you're wrong (e.g., missing a mortgage payment vs. just depositing a check).
  *   **The Nuance:** You asked whether encroachment targets metaphysical conditions or assertibility conditions. This is a crucial distinction.
      *   **Assertibility views** say: You might *know* p, but it's inappropriate to *say* you know p when stakes are high (because you might mislead someone).
      *   **Encroachment views** say: You literally *do not know* p when stakes are high.
      *   The handout is correct to classify encroachment as the latter (a claim about the state of knowledge itself, not just speech). If it were merely about assertibility, it wouldn't be "encroachment"; it would be a Gricean pragmatic explanation. Encroachment insists the practical factors "encroach" into the traditional epistemic conditions.

  ### 2. The Relationship Between Contextualism and Encroachment
  **The Handout's Claim:** *Contextualism is basically just encroachment applied to linguistic practice—once you accept that stakes affect knowledge conditions, you've already abandoned invariantism about knowledge ascriptions.*

  **The Audit:** **Genuinely Wrong / Conflated.**
  This is the most dangerous part of the summary because it collapses two competing explanations into one.

  *   **The Mechanism Error:** Contextualism and Encroachment offer rival explanations for the *same data* (e.g., why we hesitate to ascribe knowledge in high-stakes cases).
      *   **Contextualism** says the *standards* for applying the word "knows" shift based on the **attributor's** context (the person speaking). If I am speaking in a high-stakes context, the word "knows" demands more evidence.
      *   **Encroachment** says the *standards* for *being in a state of knowledge* shift based on the **subject's** context (the person who might know).
  *   **The Invariantism Confusion:** The handout claims that accepting stakes affect knowledge conditions means "abandoning invariantism about knowledge ascriptions." This is false.
      *   **Subject-Sensitive Invariantism (Encroachment)** *is* a form of invariantism about ascriptions. It says the sentence "S knows p" has the same truth conditions everywhere. It just turns out that whether those conditions are met depends on S's stakes.
      *   **Contextualism** *abandons* invariantism about ascriptions. It says the sentence "S knows p" means different things in different conversational contexts.
  *   **Why the handout is wrong:** It implies that if you let practical factors into epistemology, you *must* be a contextualist. Encroachment proves you don't. You can keep the semantics fixed (invariantism) and let the practical factors affect the worldly conditions of the knowledge state. The handout treats them as a spectrum of the same view, but they are structurally distinct solutions to the puzzle.

  ### 3. The "Belief-Truth-Justification" Trio
  **The Handout's Claim:** *Both views reject the traditional belief-truth-justification trio, except encroachment keeps justification constant and instead modifies the belief-to-truth connection through practical pressure.*

  **The Audit:** **Genuinely Wrong (and Conceptually Bizarre).**
  This claim is philosophically incoherent as stated.

  *   **Rejection of JTB:** It is not accurate to say either view "rejects" the trio. Both generally accept that knowledge requires belief, truth, and justification (or warrant). The debate is about *what constitutes* justification or whether there is a fourth condition.
  *   **The "Belief-to-Truth" Claim:** This is the weirdest sentence in the handout.
      *   Knowledge is **factive**. You cannot know p unless p is true. Practical stakes cannot modify the "belief-to-truth connection." Stakes cannot make a false belief true, nor can they make a true belief false.
      *   If the handout means that stakes affect whether the belief *counts* as knowledge, that's fine. But saying it modifies the connection between belief and truth suggests that practical pressure alters the truth condition itself, which is nonsense.
  *   **Where Encroachment Actually Strikes:** Most encroachment theorists argue that practical stakes affect **justification**.
      *   *Standard View:* Justification is purely evidence-based.
      *   *Encroachment View:* Justification is evidence-plus-stakes. In high stakes, the *same evidence* yields *less justification* (or fails to meet the threshold for justification).
      *   Some encroachers (like Jason Stanley) argue that knowledge is the norm of practical reasoning. On this view, stakes don't change justification; they change whether your epistemic position is *strong enough to act on*. But even then, they are not modifying the "belief-to-truth connection." They are modifying the **action-guiding sufficiency** of the knowledge state.

  ### Summary Verdict

  The handout is a "Frankenstein" summary that stitches together slogans without checking the underlying machinery.

  1.  **Accurate:** Encroachment is a metaphysical claim about knowledge conditions, not just linguistic usage, and it is compatible with semantic invariantism.
  2.  **Oversimplified:** The relationship between Contextualism and Encroachment. They are rivals, not variations of the same project. Contextualism shifts the *meaning* of "knows" based on the speaker; Encroachment shifts the *conditions* of knowledge based on the subject.
  3.  **Wrong:** The claim that Encroachment modifies the "belief-to-truth connection." It modifies the **justification** condition or adds a **practical sufficiency** condition. It never touches the truth condition.
  4.  **Wrong:** The claim that accepting stakes forces you to abandon invariantism about ascriptions. Subject-Sensitive Invariantism is the counter-example to this claim.

  **Advice for your seminar:** If you bring this up, focus on the **Subject vs. Attributor** distinction. That is the cleanest way to show the handout is conflating Contextualism (Attributor context matters) with Encroachment (Subject context matters). That distinction alone proves they are not the same view "applied" differently.
