      *   *Non-Reductive Physicalism (NRP):* Tries to save $M$'s efficacy without reducing $M$ to $P$.
      *   *Interventionism (Woodward, etc.):* Shifts focus from "production" to "manipulation." If manipulating $M$ changes $B$, $M$ causes $B$. Kimians reply: You're manipulating $P$ to manipulate $M$.
      *   *Mechanistic Explanation (Craver, Bechtel):* Focuses on levels, components, and organization. Causation is often constitutive + causal.
      *   *Dynamical Systems Theory (DST):* Focuses on trajectories, attractors, constraints. Causation isn't always "billiard ball" pushing.
      *   *The "Stalemate":* Why does it persist? Usually because parties agree on premises but disagree on implications, or they are talking past each other regarding the *concept* of causation.

