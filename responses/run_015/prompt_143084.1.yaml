answer: |-
  Here is a taxonomy of the actual philosophical and structural critiques of Effective Altruism (EA), mapped out as a decision tree. This isn't about whether EA is "good" or "bad"—none of this is settled in the literature, and serious scholars argue over every branch below. The goal is to seperate the specific commitments so you can see where the real disagreements lie.

  **Root Question:** Is EA's primary failure **Allocative** (it sends resources to the wrong places) or **Institutional** (the way it structures moral reasoning and power is flawed)?

  ---

  ### Branch 1: The Allocative Critique
  *You believe EA fails because it misidentifies where good actually happens.*

  **Split 1.1:** Is the measurability bias a **Practical Error** (we miss important values because they are hard to count) or **Constitutive** (the act of optimizing metrics actively reshapes and corrupts what we understand "good" to be)?

  *   **If Practical Error:**
      *   **Split 1.1.A:** Is the missing data primarily **Local Knowledge** (outsiders don't understand community needs) or **Qualitative Values** (metrics miss dignity, justice, and art)?
          *   **Leaf 1: The Hayekian Critic.** (Focus: Local Knowledge)
              *   *Awkward Commitment:* Must admit that centralized data sometimes works better than local intuition, such as in vaccine distribution.
          *   **Leaf 2: The Pluralist Critic.** (Focus: Qualitative Values)
              *   *Awkward Commitment:* Has to accept that saving a life without preserving dignity is still better than letting someone die, even if it feels wrong.

  *   **If Constitutive:**
      *   **Split 1.1.B:** Does the metric-optimization corrode **Moral Psychology** (burnout, alienation from ordinary empathy) or **Social Meaning** (turning moral duties into market transactions)?
          *   **Leaf 3: The Burnout Critic.** (Focus: Moral Psychology)
              *   *Awkward Commitment:* Implies that morality should be psychologically comfortable for the agent, which contradicts most ethical traditions.
          *   **Leaf 4: The Commodification Critic.** (Focus: Social Meaning)
              *   *Awkward Commitment:* Risks romanticizing inefficient, sentiment-driven charity just because it feels more "human."

  ---

  ### Branch 2: The Institutional Critique
  *You believe EA fails because of how it organizes power, careers, and decision-making.*

  **Split 2.1:** Is the problem located in **Career Strategy** (specifically "Earning to Give") or **Governance** (how priorities are set and funded)?

  *   **If Career Strategy (Earning to Give):**
      *   **Split 2.1.A:** Is the harm **Individual Hypocrisy** (the earner profits from harm to wash it with donations) or **Structural Moral Laundering** (the donation pipeline legitimizes the harmful industry)?
          *   **Leaf 5: The Integrity Critic.** (Focus: Individual Hypocrisy)
              *   *Awkward Commitment:* Must concede that dirty money donated anonymously would be morally acceptable, which feels like a loophole.
          *   **Leaf 6: The Legitimacy Critic.** (Focus: Structural Moral Laundering)
              *   *Awkward Commitment:* Implies harmful industries should remain silent and keep their money rather than attempting mitigation via philanthropy.

  *   **If Governance (Priority Setting):**
      *   **Split 2.1.B:** Is the flaw that EA **Bypasses Democratic Accountability** (unelected elites set global priorities) or that it imports **Silicon Valley Logic** ("move fast and break things" applied to morals)?
          *   **Leaf 7: The Accountability Critic.** (Focus: Democratic Bypass)
              *   *Awkward Commitment:* Defends slow democratic processes even when facing rapid existential risks that require swift action.
          *   **Leaf 8: The Techno-Skeptic.** (Focus: Silicon Valley Logic)
              *   *Awkward Commitment:* Must reject engineering-style solutions to social problems broadly, not just within EA.

  ---

  ### Notes on the Landscape

  **What's Settled vs. Contested**
  Nothing here is consensus. Even the distinction between "Allocative" and "Institutional" is contested; some argue you can't have one without the other. The literature is fairly settled on the fact that measurability bias exists (Leaf 1 & 2), but whether it's merely practical or constitutive (Split 1.1) is genuinely contested among moral philosophers. Similarly, the "moral laundering" frame (Leaf 6) is gaining traction in political economy circles but is still niche compared to the standard hypocrisy critique.

  **Inseparable Pairs**
  This tree tries to keep things clean, but some branches bleed into each other. Specifically, **Leaf 6 (Legitimacy)** and **Leaf 7 (Accountability)** are hard to disentangle. If private capital sets global priorities (Laundering), it inherently bypasses democratic will (Accountability). Defenders of EA often argue these are features, not bugs, but critics see them as the same structural flaw viewed from different angles. Also, the line between **Leaf 2 (Pluralist)** and **Leaf 4 (Commodification)** is blurry; often, ignoring qualitative values *is* what commodifies social goods.

  There's no clean way to cut those knots, so don't let the tree fool you into thinking these positions are mutually exclusive. Most critics hold a mix of these views, but mapping them this way helps avoid the usual Twitter caricatures.
