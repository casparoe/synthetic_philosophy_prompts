          6.  Better Analogy (The Budget vs. The Wallet).
          7.  Quick Prep Room Takeaway.

      *   *Refining the Table:*
          *   Grain -> Single Speck.
          *   Heap -> Total Badness.
          *   Container -> The Subject experiencing it.
          *   *Break:* In Sorites, the container is single (the pile). In Specks (Version B), there are 3^^^3 containers.

      *   *Refining the "Real Issue":* It's not vagueness. It's whether harms sum across different brains. Priya is using "vagueness" as a shield for "separateness of persons." The teammate is using "heap" as a shield for "utilitarian aggregation."

      *   *Better Analogy:* Money. Taking $1 from 3^^^3 people vs. bankrupting one person. Or a Budget. A national budget (many taxpayers) vs. one person's wallet.
      *   *Actually, a better analogy for the "Heap" failure:* A chorus vs. a soloist. Or a stadium cheer.
      *   *Let's stick to the "Wallet" analogy.* Taking 1 cent from everyone vs. draining one wallet. It captures the distribution issue better than sand.

