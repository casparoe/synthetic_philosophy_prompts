      *   "Is it about vagueness?" (No, it's about aggregation across persons).
      *   "Better analogy?" (Distributed costs vs. concentrated costs).

      *   *Self-Correction on Priya's argument:* Priya says "Specks answer is a math trick." She thinks the *sum* is fake because the predicate "harm" is vague. She's conflating "is it a heap?" with "does it matter?".
      *   *Teammate's argument:* "Heap is real, so sum is real." They are conflating physical accumulation with moral accumulation.
