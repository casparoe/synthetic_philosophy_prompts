  I'm working on a novel where one of the characters is this philosopher with a strange take on Buridan's ass — she doesn't think it's about indecision at all, but about how perfect symmetry between options literally dissolves the chooser. Like, if the hay is identical on both sides in every relevant way, there is no "you" that could stand closer to left or right, so the ass doesn't starve because it's stuck; it starves because the conditions for being a self that picks have collapsed. I'm recording a podcast interview with her for research, and I want to steal some of the dialouge for the book. Could you draft me maybe eight to ten questions?

