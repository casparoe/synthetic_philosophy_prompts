              *   (1) Non-aggregation vs. Minimax/Worst-case thinking.
              *   (2) Error Budgets/Scarcity (resources are aggregative).
              *   (3) Interpersonal comparisons/Tie-breaking vs. Cardinal/Threshold metrics.
          3.  For each point: What translated well? What was fudged? Is the mismatch the vocabulary's fault or the philosophy's fault?
      *   **Priority:** The user cares *more* about what *doesn't* survive translation (the mismatches/residue) than what does.

  2.  **Deconstruct Scanlonian Contractualism (Simplified for Translation):**
      *   *Core Principle:* An act is wrong if it violates principles that no one could reasonably reject.
      *   *Reasonable Rejection:* Based on individual complaints. "This principle imposes too great a burden on *me*."
      *   *Non-Aggregation:* You generally cannot sum small burdens on many people to outweigh a catastrophic burden on one person. (The "Numbers Problem" or "Rescue Case").
      *   *Tie-Breaking:* If complaints are identical in strength, *then* you might look at numbers (to save more lives), but only if the *strength* of the individual complaint is equivalent.

  3.  **Drafting the Translation (Reliability Engineering Vocabulary):**
      *   *Principle/Rule:* Serving Policy / Routing Logic.
      *   *Reasonable Rejection:* SLO Violation / Pageable Incident.
      *   *Individual:* Per-Request / Per-User Session.
      *   *Burden:* Latency spike, Error rate, Data loss.
      *   *Non-Aggregation:* A policy is invalid if it causes a p100 (worst-case) violation for a single shard/user, even if it improves p50 for the fleet. You can't trade one user's total outage for a 10ms lag for a million others.
      *   *Design Space:* Set of relevant alternatives / Architecture options.
      *   *Justifiability-to-each:* Per-user appeal / Root Cause Analysis (RCA) defense. "Can I justify this degradation to *this* specific affected user?"

  4.  **Addressing the Three Residue Points:**

