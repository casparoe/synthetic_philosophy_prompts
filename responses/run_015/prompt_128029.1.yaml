          *   *Fudge:* Scanlon treats "burdens" as qualitative complaints, not depletable tokens. SRE treats them as quanta.
          *   *Mismatch:* This is the biggest clash. SRE *must* aggregate because physics dictates scarcity. Scanlon operates in a space where justification is logical, not physical. The mismatch is *theirs* (Philosophy ignores resource constraints) but also *ours* (SRE assumes scarcity is the only constraint).

      *   **Point 3: Interpersonal Comparisons & Tie-Breaks.**
          *   *Problem:* Scanlon needs to compare "strength of complaint" (ordinal/qualitative) but uses headcount (cardinal) for ties. SRE uses cardinal (ms, $) or binary (SLO met/broken).
          *   *Translation:* "Strength of complaint" = Severity Level (Sev1 vs Sev3). Headcount = Volume.
