  7.  **Final Polish:** Organize into "The Translation" and "The Residue Report." Ensure the three specific sub-questions are answered clearly within the residue section. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure I don't get too bogged down in explaining Scanlon. The user knows the gist; they want the *mapping*. Keep the philosophy explanation tight and focused on the aggregation constraint. Ensure the "fault" assignment is nuanced.

  8.  **Final Structure:**
      *   **Intro:** Acknowledge the domain shift.
      *   **The Translation:** Map Contractualism to SRE terms.
      *   **The Residue Report:** Address the 3 specific points (Minimax, Error Budgets, Comparisons).
      *   **Conclusion:** Summary of the fundamental incompatibility.

  *(Wait, one more check on Point 1)*: The user asks if "don't aggregate" is just minimax with extra steps. I need to be careful. Minimax minimizes the *maximum loss*. Non-aggregation says you can't *sum* small losses to beat a big loss. They are related but distinct. In SRE, p99 is a form of aggregation (it ignores the top 1%). True minimax is p100. Scanlon is closer to p100 on *harm*, but allows counting if harms are *identical*. I need to be precise here.

  *(Wait, one more check on Point 2)*: "Error budget goes." In SRE, if I burn the budget on User A, I have less for User B. Scanlon doesn't have a budget. It has a "reasonable rejection" threshold. If I reject a principle, it's out, regardless of the budget. This is the key friction.

