      *   **Topic:** Scanlon-style Contractualism (moral philosophy). Specifically, the "non-aggregation" principle (the idea that you can't sum up small harms to many to outweigh a large harm to one).
      *   **Task:**
          1.  Translate Scanlon's contractualism (refusal to aggregate + objection to it) into Reliability Engineering vocabulary.
