          *   *Fudge:* SRE minimax is usually technical (tail latency). Scanlon's minimax is moral (catastrophe vs. inconvenience).
          *   *Mismatch:* SRE accepts trading worst-case for average *all the time* (e.g., batching, retry budgets). Scanlon forbids it in moral cases. The mismatch is likely the *vocabulary's* fault (SRE is utilitarian by nature) but also reveals Scanlon is stricter than standard worst-case engineering.

