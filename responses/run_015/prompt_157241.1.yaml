answer: |-
  **Project Title:** Binding Bets: The Moral Force of Stochastic Promises
  **Applicant:** [Name], Independent Scholar (Background in Population Ecology)

  **1. Research Question**
  Standard philosophical cases of promising assume the cost of performance is known at the time of the undertaking (e.g., "I promise to drive you to the station"). However, significant real-world promises involve stochastic costs: marriage vows ("for worse"), co-signing loans, or agreeing to cover a partner's business losses. In these "lottery promises," the distribution of costs is known, but the specific realization is not.

  The core question is: *When the risk distribution is common knowledge at the time of promising, does the moral obligation to perform vary according to the realized cost?*

  This must be distinguished from two nearby issues. First, it is not the problem of *impossibility* (where performance cannot occur). Second, it is distinct from standard *changed circumstances* doctrines, which typically rely on unforeseen events. Here, the "change" is the realization of a known risk. The question isolates whether the *ex post* moral force of the promise is sensitive to the "draw," even when the *ex ante* commitment device logic suggests it should be insensitive.

  **2. Existing Accounts and Their Vulnerabilities**
  My reading suggests four main families of account for promissory obligation. This project tests their elasticity against lottery promises.

  *   **Practice/Convention Views:** These might shrug off the problem. If the rule is "keep promises," the cost realization is irrelevant unless the practice itself has an escape clause for ruinous cost. This view risks being too rigid to match moral intuition.
  *   **Expectation/Reliance Views:** These bite hard on the problem. If the promisee relied on the promise, the obligation holds. However, reliance is often calibrated to the *expected* cost, not the *realized* cost. This account may struggle to explain why we feel the promisor is *more* excused when the cost is ruinous, even if reliance was identical.
  *   **Normative Power/Will Views:** These face the sharpest tension. Did the promisor will the specific burden, or only the risk? If the latter, the obligation should hold regardless of the draw. If the former, the obligation might dissolve when the draw exceeds the willed scope.
  *   **General Duty Views:** These might dissolve the problem entirely, arguing there is no special promissory duty, only a duty not to mislead. If the promisor didn't mislead about the risk, the duty remains.

  The project does not assume one of these is correct. It asks which, if any, can accommodate the intuition that realized cost matters without collapsing into ad-hocery.

  **3. Methodology**
  I propose a parameterized case-grid method rather than conceptual derivation or empirical survey.

  I will construct a matrix of vignettes varying five parameters: (1) Knowledge of distribution (Known/Unknown), (2) Realized Cost (Trivial/Ruinous), (3) Reliance Level (None/High), (4) Insurability (Promisee could/could not insure), and (5) Relationship Type (Arm's length/Intimate). I will then attempt to derive verdicts from each of the four theoretical accounts mechanically.

  *   **Why not ground-up derivation?** Deriving obligation from first principles often leads to stalemate between competing foundational values. Stress-testing existing theories against edge cases is more productive for a short project.
  *   **Why not surveys?** Intuition pumps measure psychological outcome bias, not normative truth. A survey would tell us people *feel* the obligation changes, not whether it *should*.
  *   **Why not pure conceptual analysis?** Without fixed parameters, it is too easy to shift definitions of "promise" to suit the verdict. The grid forces consistency.

  *Note on Background:* My training is in ecology and signalling theory, not philosophy. I approach promising as a commitment device evolved for cooperation. I may lack nuance in distinguishing deontological categories, but this functional perspective may highlight blind spots in normative theories regarding risk and stability.

  **4. Expected Outcomes and Failure Modes**
  A successful result will identify which theoretical family best tracks the intuitive verdicts across the grid without requiring ad-hoc adjustments. A deflationary result is also valid: demonstrating that "promissory obligation" fractures under stochastic conditions and reduces to general fairness or contract law.

  **Failure Modes:**
  1.  **The Free Parameter Problem:** If every theory can be tuned to match any verdict by adjusting a subsidiary clause (e.g., redefining "reasonable reliance"), the method fails to discriminate. The output would be a negative note on the elasticity of current theories.
  2.  **Collapse into Changed Circumstances:** If the distinction between "realized known risk" and "unforeseen change" cannot be sustained in the cases, the project is too narrow.
  3.  **Conditional vs. Unconditional Collapse:** If the grid reveals that all "lottery promises" are implicitly conditional promises ("I promise to pay, unless it ruins me"), the specific category of "lottery promise" dissolves.

  **5. Work Plan (3 Months Part-Time)**
  *   **Month 1:** Finalize the case grid. Draft the five parameters and generate 10-12 core vignettes. Test these informally with the reading group to ensure they elicit stable intuitions.
  *   **Month 2:** Theoretical mapping. Systematically apply the four families of account to the vignettes. Document where theories require "tuning" to match verdicts.
  *   **Month 3:** Drafting the 5,000-word paper. Focus on the tension between commitment device logic (insensitivity) and moral luck (sensitivity). Prepare presentation for the group.

  **6. Novelty Statement**
  This is not a rehash of the standard debate on promissory obligation. Standard literature focuses heavily on the *source* of the obligation (will vs. reliance) or on *unforeseen* changes in circumstances (frustration/impossibility). It largely ignores the specific moral status of *known risk realization*. By treating the cost as a random variable drawn from a known distribution, this project imports a decision-theoretic structure into moral philosophy. It asks whether moral luck operates within the bounds of a voluntary commitment, a question that remains open despite extensive work on moral luck in other domains. The project leverages my background in modelling to treat the cases as a stress test for theoretical consistency, rather than an attempt to found a new normative system.
