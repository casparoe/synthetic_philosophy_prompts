answer: |-
  **Setup**
  9 pairs (18 students). Each pair gets a "Demon Sheet" (tally) and 10 tokens. You hold the "Bank."
  **Deck:** 10 cards (L/R).
  **Prices:** Work Token = +1. Erasure Cost = -1 per mark on sheet.

  **Phase 1: Equilibrium (20 mins)**
  **Deck:** 5L, 5R (shuffled).
  **Rules:** Draw card. You *must* record L or R to claim 1 Work Token. End of phase: Pay 1 Token per mark to erase sheet (hand back blank).
  **Outcome:** 10 marks, 10 work, 10 erasure cost. Net 0.
  **Physics:** Measuring 1 bit yields 1 unit work; erasing 1 bit costs 1 unit. No free lunch.

  **Phase 2: Non-Equilibrium & Compression (20 mins)**
  **Preparers (3 pairs):** Pay the Bank to bias the remaining 6 decks. Cost: 1 token per card moved from 50/50 baseline (e.g., to make 8L/2R, swap 3 cards = cost 3 tokens).
  **Demons (6 pairs):** Receive biased decks (e.g., 8L/2R).
  **Rules:** You may use *any code* to record outcomes. (Most will write only the rare 'R's). Claim 1 Work Token per card drawn. Pay erasure cost per mark made.
  **Outcome:** 10 work tokens earned. ~7 marks made (Shannon entropy). ~3 tokens paid. Net +3.
  **Global Balance:** Preparer spent 3 to sort. Demon gained 3 from sorting. Net 0.

  **Timeline**
  *   **0–10:** Intro rules. Emphasize: "Sheet must be blank to finish."
  *   **10–30:** Phase 1 play & tally.
  *   **30–50:** Phase 2 play. Preparers sort; Demons compress.
  *   **50–65:** Global tally on board. Show Prep Cost = Demo Profit.
  *   **65–75:** Debrief.

  **Predictable Failures**
  1.  **Refusal to Erase:** Students will hoard marked sheets. *Fix:* Assign an "Inspector" student who confiscates tokens if sheets aren't blank.
  2.  **Compression Gaming:** Teams might write nothing and guess. *Fix:* Rule: "If you didn't write it, you didn't measure it; no work token."
  3.  **Preparer Apathy:** Preparers won't want to spend tokens. *Fix:* Give Preparers a separate budget not tied to Demon winnings, or frame it as "investing for the group."

  **Limits of the Analogy (Say This Aloud)**
  1.  **Heat:** In the game, erasure is administrative. In reality, erasing bits dumps heat into the environment. The tokens don't vanish; they become thermal noise.
  2.  **Fluctuations:** Cards don't jiggle. Real molecules randomly cross partitions, making measurement urgent.
  3.  **The Lesson:** The Demon's profit is real, but it's not creation; it's *transfer*. The entropy decrease in the engine was paid for by the entropy increase in the preparation (sorting). The universe still wins.
