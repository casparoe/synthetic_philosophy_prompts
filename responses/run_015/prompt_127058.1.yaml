answer: |-
  **MEMO: Interview Prep for Dr. Vasquez**
  **Subject:** Podcast Ep. w/ Vasquez (Browning/Goldhagen stuff)
  **Date:** Next Week

  hey, here's the rundown for the vasquez interview. she's got this new book arguing the whole Browning vs Goldhagen thing is a false choice. basically she thinks its about "scripted complicity" — small group rituals that make killing feel like social choreography. peer affirmation + the script itself = emotional reward, which hides the moral weight.

  important note on the historiography before we jump into the questions:
  *   **Settled:** We know ordinary people participated in the holocaust. We know bureaucracy was involved. We know both situational pressure and ideological belief played *some* role. Nobody serious thinks it was *only* one or the other anymore.
  *   **Contested:** What the primary driver was. Browning (situational/peer pressure) vs Goldhagen (ideological/eliminationist antisemitism) is still the classic frame, but most historians now look for a mix. Vasquez is entering a crowded field here — her "ritual/script" angle is new and definitely not consensus. Don't let her talk like she's solved the debate permanently.
  *   **Vasquez's Status:** Her view is the challenger here. Treat it as a compelling new hypothesis, not the final word.

  below are 9 questions. i've included follow-ups keyed to what shes likely to say based on her book summary. keep it conversational but don't let her off the hook on the mechanics.

  ***

  **1. The Setup**
  Most people know the brawl: Browning says ordinary men cracked under pressure, Goldhagen says willing executioners were driven by hate. You're calling this a false dichotomy. Can you explain why framing it as "situation vs. ideology" actually misses what was happening on the ground?
  *   **Follow-up:** If she says "both were present but missing the mechanism," ask: So is your argument that the mechanism *replaces* those explanations, or just that it glue them together?

  **2. Defining the Script**
  You use this phrase "social choreography." I'm trying to picture this literally. Are we talking about actual physical routines, or is this a metaphor for how they talked to each other around the killing?
  *   **Follow-up:** If she says "it's both verbal and physical," ask: Can you give a concrete example of a "step" in the choreography that turns a normal guy into a shooter without him noticing the shift?

  **3. The Opt-Outs (Browning's Case)**
  Browning's Reserve Police Battalion 101 had men who refused to shoot and weren't punished for it. If killing is a ritual that rewards you with group belonging, how do you account for the guys who opted out of the dance?
  *   **Follow-up:** (Crucial) If she says "they weren't socially integrated yet," push back: Isn't that just Browning's peer pressure model with extra steps? Where's the line between your "scripted complicity" and just "not wanting to look weak in front of friends"?

  **4. The Ideology Question (Goldhagen's Case)**
  Goldhagen insists you can't explain the Holocaust without German eliminationist antisemitism. Can your "script" get off the ground without that specific ideological fuel, or does the ritual need the hate to start?
  *   **Follow-up:** If she says "ideology provides the language, ritual provides the action," ask: But if the language is neutral, does the script still work? Like, could this happen without antisemitism if the script was about something else?

  **5. Moral Responsibility**
  This is the heavy one. If perpetrators are partly driven by the emotional rewards of the ritual — the "high" of the choreography — does that change how we assign blame? Are they less responsible if the script is doing some of the work?
  *   **Follow-up:** If she says "understanding isn't excusing, they're still responsible," ask: Then what's the practical use of your theory for justice? If the punishment is the same, why does the mechanism matter?

  **6. The First Kill**
  There's usually a barrier to the first act of violence. In your model, who writes the first line of the script? Is this top-down from commanders, or does it emerge from the guys in the unit themselves?
  *   **Follow-up:** If she says "it emerges from the group," ask: Doesn't that let the commanders off the hook? If the unit writes the script, is the bureaucracy less guilty?

  **7. Bureaucracy vs. Small Group**
  You focus on small-group rituals, but the Holocaust was also industrial and bureaucratic. How does "scripted complicity" work for the desk killers who never saw the violence firsthand? Do they have a different script?
  *   **Follow-up:** If she says "yes, a bureaucratic script," ask: Is the emotional reward the same? What's the "choreography" of signing a transport list?

  **8. The Emotional Payoff**
  You mention emotional rewards. We usually think of killers as feeling guilt or numbness. Are you arguing they actually felt *good* during the act? What kind of reward are we talking about here?
  *   **Follow-up:** If she says "camaraderie and purpose," ask: Is that distinct from normal soldier bonding? What makes the reward specific to atrocity rather than just unit cohesion?

  **9. Prevention**
  If the problem is ritualistic performance rather than just "bad apples" or "bad orders," how do we stop this? Does knowing about scripted complicity give us a tool to prevent future atrocities that Browning or Goldhagen didn't?
  *   **Follow-up:** If she says "disrupt the rituals," ask: How do you disrupt a ritual in the middle of a war without putting soldiers at risk? Is that realistic?

  ***

  **Notes for host:**
  *   Watch out for jargon. If she says "performative agency" or something, ask her to translate.
  *   Keep an eye on the time. Q3 and Q5 are the ones most likely to run long.
  *   Don't let her imply Browning or Goldhagen are "wrong" in a factual sense — their data is still used, she's reinterpreting the motivation.

  let me know if you want to swap any of these out.
