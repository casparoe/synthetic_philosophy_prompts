answer: |-
  **MEMORANDUM**

  **TO:** Interpretive Review Committee
  **FROM:** [Your Name]
  **DATE:** October 24
  **SUBJECT:** Voting Recommendation: Alderwood Fen Gallery Interpretation

  **Recommendation**
  I move that the committee reject both the "Mother-Goddess Shrine" panel and the "Unknown Function" panel. Instead, we adopt a **Layered Interpretation Policy**. The primary case panel must distinguish between the *physical pattern* (which is clear) and the *social meaning* (which is contested). We should proceed with the reinstall only if the text reflects this distinction. Furthermore, I recommend withholding 40% of the research budget for targeted testing before any permanent theological claims are inscribed.

  **Proposed Panel Structure**
  The main text should read: **"Deliberate Deposition."**
  *   **Layer 1 (Evidence):** "Over two centuries, people placed broken figurines, querns, and animal jaws into this waterlogged shaft. The consistent breakage patterns indicate rule-bound behavior."
  *   **Layer 2 (Interpretation):** "Archaeologists debate why. Some suggest a shrine to a deity; others propose household rituals, disposal of dangerous objects, or marking the end of use-lives. No shrine structure has been found nearby."
  *   **Layer 3 (Community Voice):** Include a distinct box quoting the local descendant group: "For our community, these figures represent ancestors. We treat them with respect regardless of archaeological debate."

  This structure closes the "interpretation gap" without denying the "formation gap" evidence that these items were not simply lost.

  **Research Budget Priorities**
  We must spend the reserved budget on tests that generate **hostage predictions**, not merely descriptive detail. The Curator's "priestly corporation" theory is hostage to the existence of a bounded precinct and unequal distribution of cult paraphernalia.
  1.  **Geophysical Survey:** Extend survey to the 400m exclusion zone. If the "shrine" hypothesis is true, we should expect magnetic anomalies indicating fencing, postholes, or storage pits distinct from domestic patterns.
  2.  **Clay Petrology:** Analyze the figurine fabric against local domestic pottery. If the clay source is unique or highly processed compared to domestic ware, it supports specialized production (priesthood); if it matches local household clay, it supports household-level practice.
  These tests discriminate between competing readings. General stratigraphic refinement will not.

  **Strength of the Rejected Position**
  We must acknowledge the strength of the Curator's "cult" argument. The consistency of the breakage (all heads snapped) and the specific selection of body parts (pig/cattle jaws) across a 200-year span suggests a transmitted tradition rather than random discard. In many comparative contexts, such regularity implies institutional memory. To claim this is *purely* random is equally unsupported. The Curator is correct that *something* structured this deposit; the error lies in specifying the structure as a "shrine" without the architectural correlates.

  **Stakeholder Pressures**
  *   **The Donor:** We cannot accept the six-figure sum conditional on false claims. Credibility is our primary currency; once spent, it cannot be replenished. I propose we offer the donor naming rights on the gallery seating or the educational wing, decoupling their contribution from the specific interpretive text. We invite them to fund the *question*, not the *answer*.
  *   **The Local Group:** Their request treats the objects as ancestors. Archaeology cannot prove or disprove spiritual kinship. By including their statement as a distinct layer (Layer 3), we validate their relationship to the material without conflating oral tradition with archaeological evidence. This avoids the trap of making archaeology the sole arbiter of meaning.

  **Reasoning**
  My recommendation relies on two devices to prevent interpretive drift.

  First, the **Two-Gap Problem**. The Curator's panel collapses the formation gap (how the deposit formed) and the interpretation gap (what it meant). We have high confidence across the formation gap: the items were broken and placed intentionally. We have low confidence across the interpretation gap: we cannot leap from "intentional breakage" to "mother-goddess" without intermediate evidence. The Education Officer's panel ignores the formation gap, implying randomness where there is clearly pattern. The Layered Policy scores these separately, maintaining rigor without surrendering meaning.

  Second, **Hostage Predictions**. An interpretation must risk being wrong. The "shrine" theory predicts specific material consequences (precinct boundaries, specialized goods) that are currently absent. By printing the theory as fact, we render it unfalsifiable. We create a **ritual sink**: a category that absorbs every deposit our functional vocabularies cannot explain. If we label this a "shrine" now, future discoveries contradicting that claim will be ignored by the public because the panel has already settled the question.

  We are not merely describing the past; we are modeling how we know it. A panel that admits uncertainty while highlighting pattern teaches visitors how archaeology works. A panel that asserts a goddess teaches them that museums guess. Let us choose the former.

  **Vote Required:** Approval of Layered Interpretation Policy and Research Allocation.
