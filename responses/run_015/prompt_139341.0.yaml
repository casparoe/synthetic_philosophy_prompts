  3.  **Evaluate Consistency/Tensions:**

      *   **Tension 1: Asymmetry (4) vs. Nothing Special (3) & Uniqueness (1).**
          *   (3) says HOE is just evidence; conditionalize on total evidence.
          *   (4) says Positive HOE doesn't boost confidence beyond FO evidence.
