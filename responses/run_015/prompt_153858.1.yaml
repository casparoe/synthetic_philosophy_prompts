answer: |-
  Hey there, it sounds like a fantastic group and ninety minutes is just enough time to let them feel the tension without getting bogged down in endless procedure. The goal here is to make the boundary problem visceral rather than theoretical, so you want to avoid giving them a lecture at the start and instead drop them into a situation where the rules of the game are undefined by design. To set this up, you will need to prepare twelve sealed envelopes before the workshop begins. Ten of these envelopes should contain cards labeled with specific relational statuses regarding the hypothetical polity you are simulating, and the remaining two envelopes should contain the proxy mandates for the non-human interests. For the human participants, vary the cards so that some say Permanent Resident, some say Temporary Worker, and some say Downstream Neighbor, ensuring that no single definition of membership will include everyone without excluding someone else. For the two proxy cards, label one The River Watershed and the other Future Generations, and write specific conditional powers on them, such as granting the River veto power if the group chooses a stakeholder-based principle, or excluding the Future Generations entirely if they choose a presence-based principle. Place these envelopes on the chairs before the participants arrive so that everyone has one, but instruct them strictly not to open them until you give the signal.

  You should open the session by framing the group as a constitutional convention tasked with founding a new polity centered around the local river valley, but tell them that before they can legislate any policies, they must first define who constitutes the people. Give them about twenty minutes to draft a single sentence that defines membership in the demos, making it clear that this sentence will determine who gets to vote on the actual constitution later. Encourage them to use standard philosophical criteria like all-affected, all-subjected, or all-coercioned, but do not provide these terms yourself; let them struggle to articulate the boundary. Once they have agreed on a wording and written it on the board, move immediately to the reveal phase. Have everyone open their envelopes simultaneously. This is where the friction starts, because those who hold Temporary Worker cards will realize that if the group wrote only residents may vote, they are now excluded from the very process they just participated in. Conversely, if they wrote a broad all-affected principle, the person holding the River proxy card must read aloud their conditional power, which might grant them veto authority over human voters, suddenly destabilizing the human majority they assumed they had.

  The critical moment comes in the next twenty minutes when you force them to confront the recursion. Ask them to vote on whether to accept the membership rule they just wrote, but point out that the legitimacy of that vote depends on the rule itself. If the rule excludes the Temporary Workers, do the Temporary Workers get to vote on whether to exclude themselves? If the River has veto power, does the River vote on whether to accept that veto? You should not resolve this for them; instead, let the procedure grind to a halt as they realize they are using an undefined authority to define the authority. This is the experience of recursive legitimation, where the demos must exist to define the demos, and the paralysis they feel is the actual philosophical problem manifesting in real time. You can nudge them by asking who is enforcing the rule right now, highlighting that there is no meta-demos to validate their current gathering, which mirrors the real-world lack of a global sovereign to decide national boundaries.

  When you move into the debrief for the final thirty minutes, you want to map their frustration back to the specific tensions they encountered. Start by discussing the circularity they hit when trying to vote on the membership rule, explaining that this is the core of the boundary problem where democratic theory assumes a people exists before democracy can begin, but democracy is needed to define the people. Bring up the all-affected versus all-subjected tension by asking the Temporary Workers how it felt to be potentially excluded despite being physically present, and ask the Downstream Neighbors if their affectedness granted them legitimacy despite their absence from daily governance. Then address the proxy cards by asking how the group felt about granting agency to non-speaking entities, noting that representing interests that cannot speak requires a trusteeship model that inherently conflicts with strict popular sovereignty. Be frank about what the simulation cannot reproduce, specifically noting that real democratic boundaries are settled through decades of conflict, war, and constitutional learning, whereas this exercise compresses that into minutes without the weight of actual history or the threat of violence that often enforces borders in reality. You should also mention that in the real world, people often accept arbitrary boundaries for the sake of stability, whereas in the workshop they are incentivized to find the logically perfect solution, which distorts the pragmatic compromise actual democracies rely on.

  You should anticipate that the first time you run this, the group will likely try to vote on membership before they have agreed on what a vote means or who counts as a voter, leading to procedural confusion where they raise hands to decide who gets to raise hands. When this happens, do not lecture them on the error; instead, intervene as the facilitator by asking whose count matters. If they say everyone in the room, point out that their own draft rule might exclude some people in the room, and ask if they are violating their own emerging law. This keeps the pressure on the paradox without you having to step out of the role of neutral observer. If they get stuck arguing about the proxy cards, remind them that the river cannot speak for itself, so any voice it has is necessarily a human ventriloquism, which raises the question of whether the proxy is representing the river or just the human holder's idea of the river. This usually sparks a productive debate about representation versus identity that ties back into the boundary problem.

  Finally, keep an eye on the clock because the debrief is where the learning solidifies, and it is easy to let the activity run long. If they are still stuck in the procedural loop at the seventy-minute mark, freeze the action and ask them to reflect on why they are stuck, using that stagnation as the data point for the discussion. The goal is not for them to solve the boundary problem, because it is theoretically unsolvable, but for them to feel the weight of the impossibility. By the end, they should understand that any boundary they draw is necessarily undemocratic in its origin because it cannot be authorized by the people it creates. This experience of hitting the wall of recursive legitimation is much more memorable than reading about it, and it will ground the rest of your seminar in a shared concrete experience of the theoretical limits they are studying. Just make sure you have enough space for the proxies to sit apart if needed, and bring a timer so you can enforce the phases strictly, since the tension relies on the sudden shift from drafting to revealing. Good luck with the workshop, and feel free to adjust the specific roles on the cards if you know something about the participants that would make certain exclusions more poignant, though keeping it abstract usually works best to prevent personal grievances from overshadowing the philosophical point.
