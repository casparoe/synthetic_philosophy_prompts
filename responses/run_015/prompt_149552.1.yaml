prompt: |-
  Eighteen months ago I was passed over for a promotion I had spent four years working toward, and the panel told me, kindly, that the outcome reflected the strongest claim on merit. This spring I sat on the other side of a panel of the same kind, and we are now drafting the criteria for a search of our own; a colleague has proposed that once we have a shortlist of candidates who are all plainly capable of doing the job, we allocate the post by lottery. I have to take a view on that, and in trying to I have worked myself into an argument that I suspect contains a mistake.

  My starting point is that meritocracy is the view that posts and rewards should go to the people who deserve them, and that desert here is a matter of what someone has made of themselves — the effort, the discipline, the hours — rather than the accident of being quick, or tall, or born to parents who read aloud. On that reading, most of the critical literature I have encountered looks like an extended complaint about measurement error: the tests are noisy, interviews encode class signalling, credentials proxy for parental income. That is a genuine complaint, but it is a technical one, and I cannot see how it gets anyone to the much stronger claim that the arrangement itself is illegitimate.

  So I have tried to build a better argument, and I have been calling it the ratchet. Every unearned advantage a child has — a quiet room, a stable home, decent nutrition, a teacher who happened to notice them — is converted by schools, examiners and selectors into a credential. The credential is then read back as evidence of ability or effort, and because the next round of advantages is allocated on the basis of credentials, the conversion compounds: by mid-career the distance between two people is mostly accumulated accident, but it is inscribed in a CV, and so it presents itself to everyone, including the person who has it, as something earned. If that is right, meritocracy does not merely track desert imperfectly; it manufactures counterfeit desert. It launders luck into a claim of desert, and then recruits the loser's own self-respect to bless the outcome. There is even a historical corroboration: the word was introduced by Michael Young in a satirical dystopia of 1958, as a term of abuse, so people who defend meritocracy are defending something its inventor meant as a warning.

  Put those together and I reach a conclusion I am not comfortable with: that competitive selection is a desert-laundering machine, worse than an open lottery, which at least does not pretend to be tracking anything, and that we should therefore replace it with lotteries among the qualified — the device the lottocracy literature proposes for legislatures, applied to hiring. Where is the false step? My own suspicion is that I have quietly merged merit with desert, and assumed that tracking desert is what selection for a role is even for. But if that is the error, what is the practice for, and does my colleague's lottery actually break the ratchet, or just hide it behind a threshold we still get to set?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user was passed over for a promotion 18 months ago (felt it was merit-based but painful). Now, they are on a hiring panel. A colleague proposes selecting via lottery among qualified candidates.
      *   **The User's Argument:**
          1.  *Definition:* Meritocracy = rewards based on desert (effort/discipline), not native talent/luck.
          2.  *Critique of Critiques:* Most critiques focus on measurement error (noisy tests, class bias), which is technical, not fundamental illegitimacy.
          3.  *The "Ratchet" Argument:* Unearned advantages (home, nutrition, teachers) $\rightarrow$ Credentials $\rightarrow$ Read as ability/effort $\rightarrow$ More advantages $\rightarrow$ Compounded accident inscribed as earned desert. Meritocracy "launders luck into a claim of desert."
          4.  *Historical Note:* Michael Young coined "meritocracy" as satire/abuse.
          5.  *Conclusion:* Competitive selection is a "desert-laundering machine." A lottery among the qualified is better because it doesn't pretend to track desert.
          6.  *Self-Doubt:* Suspects merging "merit" with "desert." Wonders if selection is actually *for* desert. Wonders if the lottery just hides the ratchet behind a threshold.
      *   **The Task:** Identify the "false step" in the argument, clarify the purpose of selection practices, and evaluate whether the lottery breaks or hides the ratchet.

  2.  **Deconstruct the Argument & Identify Potential Flaws:**

      *   *Premise 1: Merit = Desert (Effort).*
          *   *Critique:* This is a specific, moralized definition. In organizational contexts, "merit" usually means "likelihood of success in the role" (predictive validity), not moral worthiness based on past effort. This is the likely "merge" the user suspects.
      *   *Premise 2: The Ratchet (Luck $\rightarrow$ Credential $\rightarrow$ Desert).*
          *   *Critique:* This is a strong sociological point (often associated with Rawls or Sandel). However, does it invalidate the *utility* of selection? Even if desert is contaminated, does the selected person still do the job better?
      *   *Premise 3: Lottery is better because it's honest.*
          *   *Critique:* A lottery among the *qualified* still requires setting a threshold. Who sets the threshold? How is "qualified" determined? If "qualified" relies on the same laundered credentials, the ratchet remains at the gate.
      *   *Premise 4: Young's Satire.*
          *   *Critique:* Etymological fallacy. Just because a word was coined satirically doesn't mean the current concept is invalid (e.g., "chauvinism"). However, Young's point was about the *arrogance* of the meritocratic elite, which supports the user's "self-respect" point.

  3.  **Formulate the Response Strategy:**

      *   **Validate:** Acknowledge the sophistication and emotional resonance of the argument. It's a well-formed philosophical position (echoing Rawls, Sandel, Young).
      *   **Identify the False Step:** Confirm the user's suspicion. The conflation of *Merit as Predictive Utility* vs. *Merit as Moral Desert*.
      *   **Address the Purpose of Selection:** If not desert, then what? *Fitness for Purpose* / *Consequentialism*. We select to get the job done, not to reward virtue.
      *   **Analyze the Lottery Proposal:**
          *   Does it break the ratchet? No, it moves the bias to the "qualified" threshold.
          *   Does it have value? Yes, it reduces marginal discrimination and acknowledges measurement noise.
      *   **Synthesize:** Offer a nuanced view. The "Ratchet" is real, but the solution isn't necessarily a lottery unless the goal shifts from "best outcome" to "fairness."

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user's intellectual journey. It's a classic tension in political philosophy.
      *   **The False Step (Merit vs. Desert):**
          *   Distinguish between *Moral Merit* (Desert/Effort) and *Functional Merit* (Prediction/Outcome).
          *   Organizations hire for *performance*, not *virtue*.
          *   The "Ratchet" attacks Moral Merit, but Functional Merit might still hold (even if luck helped them get the skills, do they have the skills?).
      *   **The Purpose of Selection:**
          *   It's consequentialist. We want the surgeon who cuts the least, not the one who studied the hardest (though they often overlap).
          *   If the goal is efficiency, the "laundering" doesn't matter as long as the skill is real.
          *   If the goal is justice/fairness, the "laundering" matters immensely.
      *   **The Lottery Analysis:**
          *   *The Threshold Problem:* The user nailed this. "Qualified" is the filter. If credentials are laundered luck, the shortlist is already biased. The lottery just randomizes the final step of a biased process.
          *   *The Benefit:* It admits *uncertainty*. Once candidates are "good enough," the marginal difference is noise. A lottery admits we can't measure the difference, rather than pretending we can.
      *   **Michael Young's Point:**
          *   Clarify Young's warning. It wasn't just about luck; it was about the *hubris* of the winners. The lottery might reduce hubris.
      *   **Recommendation/Conclusion:**
          *   Don't adopt the lottery solely to fix "desert."
          *   Adopt it if you believe predictive validity plateaus (the "threshold" theory).
          *   Acknowledge the personal element: The user's past rejection makes this poignant.

  5.  **Refining the Tone:**
      *   Keep it philosophical but grounded in HR/organizational reality.
      *   Respect the user's intellect (they wrote a very sophisticated prompt).
