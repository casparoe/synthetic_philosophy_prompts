          *   Brave vs. Cowardly: This is the Reputation Trap.
      *   *The New Principle:* **The Principle of Non-Defamation and Causal Restraint.**
          1.  Do not contradict established public character without explicit thematic purpose.
          2.  Do not alter causal historical events.
          3.  Respect the living (survivors).
          4.  Acknowledge the bias of the archive.
      *   *The Forged Document:* Verdict: Unethical. Violates reader contract.
      *   *Dead vs. Readers:* Distinguish. You owe the dead fidelity to their *agency*. You owe readers truth about *what is invented*.
      *   *Squeamishness:* The "3 years vs 200 years" is squeamishness/legal fear, not moral ontology. The "Brave vs. Cowardly" is moral perception (defamation).
      *   *Footing:* Clearly label consensus vs. debate.

  8.  **Refining the "Brave vs. Cowardly" point:**
      *   Why do we treat them differently? Because one harms the legacy, one enhances it. But enhancing it (hagiography) distorts history too. A strict principle might say *both* are problematic if they become the "truth" about the person. However, fiction allows for "secret heroism." Secret cowardice feels like exposure. I need to point out this asymmetry is about *harm*, not *truth*.

  9.  **Refining the "Forged Document" point:**
