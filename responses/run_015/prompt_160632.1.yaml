      *   *Squeamishness vs. Moral Perception:* The "Dead 3 years" feeling is likely squeamishness (fear of lawsuit/emotional backlash) rather than deep moral difference regarding the dead person themselves.

  6.  **Establish Epistemic Footing:**
      *   *Settled:* Fabricating documents presented as real is generally condemned in historical fiction (unless paratextually clear). Compositing minor characters is standard practice.
      *   *Contested:* The "right to reputation" for the long-dead. The ethical weight of "negative capability" (showing doubt in heroes).
      *   *Empirical Unknowns:* Do readers actually confuse fiction for history? (Yes, the "CSI Effect" / "Shakespeare History" problem). How much does fiction shift public memory?

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the query.
      *   *Diagnosing the Dark-Room Rule:* It's too simple. It misses *Character Fidelity* and *Causal Weight*.
      *   *Analyzing the Verdicts:*
          *   Statesman: Consistent with Character Fidelity.
          *   Abolitionist: Violates Character Fidelity (even if room is dark).
          *   Meeting/Quarrel: Violates Causal Weight. Moving meeting is worse because it disrupts chronology/context more than emotional texture.
          *   Composite: Standard practice (minor figures lack "legacy").
          *   Explorer: Tension between Record vs. Self-Mythology.
          *   Time Decay: Living survivors matter (Harm Principle).
