          8.  Woman in colonial files (inventing inner life): *Owed/Repair.*
          9.  Brave undocumented act vs. Cowardly undocumented act: *Treated differently (Brave OK?, Cowardly Not?)*

  3.  **Evaluate Verdicts against the Rule (and each other):**
      *   *Conflict 1 (The Abolitionist):* The record is "dark" regarding the private conversation. The rule says "invent where dark." But the user says "Not Fine." *Why?* Because it contradicts the *public* record/legacy. The rule fails to account for *character consistency* vs. *event visibility*.
      *   *Conflict 2 (The Meeting vs. The Quarrel):* Both involve changing documented facts. Moving a meeting changes chronology/context. Replacing an event changes fact. User says Moving is worse than Replacing. The Dark-Room Rule doesn't distinguish these; both are "lighted" areas. This suggests a hierarchy of *significance* or *causal weight*, not just visibility.
      *   *Conflict 3 (The Brave vs. Cowardly Act):* Both are "dark" (undocumented). Rule says both Fine. User treats them differently. This reveals the rule is actually about *defamation* or *legacy*, not just darkness.
      *   *Conflict 4 (Colonial Subject):* Record exists (files), but user feels inventing inner life is "owed." This contradicts "record grows = invent shrinks." Here, the *nature* of the record (oppressive/external) justifies invention despite the record's existence.
      *   *Conflict 5 (Time Decay):* Dead 3 years vs. 200 years. The "darkness" of the record might be similar, but the *harm to survivors* differs. The rule doesn't account for the living.

  4.  **Develop a Refined Principle:**
      *   The "Dark-Room Rule" is insufficient. It focuses on *epistemic access* (what we know) but ignores *moral status* (who they were, who survives them, what the invention does to their reputation).
      *   *Proposed Principle:* **The Principle of Non-Betrayal and Contextual Fidelity.**
      *   *Core:* You may fill gaps (dark rooms) *provided* you do not violate the established core identity of the figure (unless exploring ambiguity is the point), do not alter causal history significantly, and do not inflict gratuitous harm on the memory that affects the living.
      *   *Better formulation:* **The Integrity of Agency and Legacy.** Invention is permissible in the gaps of the *record*, but not in the gaps of *character*, unless the ambiguity of character is the subject. Invention is permissible regarding *private* moments, but not *public/causal* events.

  5.  **Address the Specific Questions:**
      *   *Which verdicts to abandon?*
