answer: |-
  This is a sophisticated ethical problem, and your intuition is already doing heavy lifting that your stated rule cannot support. Your "dark-room rule" is a heuristic about *epistemic access* (what can we know?), but your verdicts are tracking *moral status* (who are they, and who survives them?). You are conflating the opacity of the record with the integrity of the person.

  Here is an analysis of your principle, your verdicts, and the footing from which I offer this advice.

  ### 1. Diagnosing the Dark-Room Rule
  Your rule states: *Invent only where the record is dark, and let the quantity you invent shrink as the record grows.*

  This rule breaks down on three of your cases:
  1.  **The Abolitionist:** The room is dark (private conversation), yet you forbid invention. Why? Because it contradicts her *public character*. The rule fails to distinguish between *event visibility* and *character consistency*.
  2.  **The Colonial Subject:** The record exists (files), yet you feel invention is "owed." Why? Because the record is *hostile*. The rule fails to account for the *bias* of the archive. A thick file can be a darker room than a silence.
  3.  **Brave vs. Cowardly Acts:** Both are undocumented (dark). You treat them differently. The rule cannot explain why one darkness is permissible and the other is not.

  Your verdicts are actually tracking a different, more complex principle: **The Principle of Non-Betrayal and Causal Restraint.**

  ### 2. Repairing the Principle
  To make your verdicts cohere, you must abandon the idea that "darkness" alone permits invention. You need a principle that accounts for *Agency*, *Causality*, and *Legacy*.

  **The Revised Principle:**
  > *Invention is permissible in the gaps of the **record**, provided it does not violate the established core of the figure's **agency**, alter the **causal chain** of public history, or inflict **gratuitous harm** on the memory that impacts the living.*

  **How this repairs your cases:**
  *   **Statesman (Fine):** Fits agency (consistent with views), no causal change, no harm.
  *   **Abolitionist (Not Fine):** Violates agency (contradicts core life's work). Even in a dark room, you cannot make a person betray their own defining logic without a overwhelming thematic justification that transcends "dramatizing doubt."
  *   **Moving the Meeting (Not Fine):** Violates causality. Changing dates and attendees alters the historical ecosystem.
  *   **The Quarrel (Not Fine, but less bad):** Violates causality less than moving a meeting (emotional texture vs. chronological fact), but still invents a public/semi-public event. Your intuition that it is "less bad" is correct because it affects *character perception* more than *historical outcome*.
  *   **Composite Minor Figures (Fine):** They lack distinct public agency or legacy. They are functionally setting.
  *   **Colonial Subject (Owed):** The "record" here is an act of oppression, not observation. Inventing inner life restores agency rather than violating it. This is an exception to "record grows = invent shrinks."
  *   **Brave vs. Cowardly (The Pair):** This is the hardest case. Under the Revised Principle, inventing a cowardly act is riskier because it inflicts harm on legacy (defamation). Inventing a brave act is hagiography, which distorts history but harms no one *except* the truth. **You must abandon the asymmetry.** If you forbid the cowardly act because it is unsupported, you must also forbid the brave act. To do otherwise is to write propaganda, not fiction. If the record is dark, you may speculate, but you must not present speculation as definitive character truth in either direction.

  ### 3. The Forged Document Case
  *Case:* A novel in which the real person appears only inside a document you forged yourself (letter/diary), presented as archive, which readers may take at face value.

  **Verdict:** **Unethical.**
  This violates the contract with the **reader**, not the dead.
  *   **Reasoning:** Historical fiction operates on a "dual contract": the reader knows the story is invented, but assumes the *anchors* (documents, dates, major events) are real. If you fabricate a primary source and present it *as* a primary source (even within a novel, if the paratext or style implies authenticity), you are blurring the line between evidence and invention.
  *   **Exception:** If the forgery is *diegetically acknowledged* (e.g., a character within the book forges the letter, and the reader knows it), it is permissible. If the authorial voice presents it as "found," it is a lie.
  *   **Why:** This creates "contaminated evidence." Future readers or historians may cite your novel's "archive." You owe readers the ability to distinguish between what was found and what was made.

  ### 4. The Dead vs. The Readers
  You suspect you are conflating what we owe the dead with what we owe readers. You are correct.

  *   **What we owe the dead:** We owe them fidelity to their **agency**. We cannot make them puppets. We cannot make them act against their own known nature without cause. We cannot defame them (the cowardly act). This is a duty of *respect*.
  *   **What we owe readers:** We owe them **transparency of method**. We owe them the ability to distinguish between historical constraint and artistic freedom. This is a duty of *truth-telling*.

  Your "Dead 3 Years vs. 200 Years" verdict is primarily about the **readers/survivors**, not the dead. The dead woman is equally dead. But the living children have a claim on her memory that fades over time. This is not about the metaphysical rights of the deceased; it is about the emotional rights of the bereaved.

  ### 5. Professional Squeamishness vs. Moral Perception
  You asked me to identify where your gut is fear rather than ethics.

  *   **Squeamishness:** The distinction between **Dead 3 Years vs. 200 Years**.
      *   *Why:* Morally, the dead woman's capacity for harm or dignity is identical in both cases. The difference is legal risk and emotional backlash from the living. This is prudence, not moral philosophy. If you believe the dead have rights, they have them for 200 years. If you believe they don't, they don't after 3 minutes. The gradient is social, not ethical.
  *   **Moral Perception:** The distinction between **Brave vs. Cowardly undocumented acts**.
      *   *Why:* This tracks with the ethical concept of defamation. Even without legal recourse, there is a moral weight to tarnishing a reputation versus burnishing it. However, as noted above, your *asymmetry* is the weak point. Burnishing is also a lie.
  *   **Squeamishness:** The **Quarrel vs. Meeting** distinction.
      *   *Why:* You feel moving the meeting is worse than inventing the quarrel. This is likely because moving a meeting is easily *fact-checked*, whereas a private quarrel is not. You are fearing exposure more than falsification. Both are equally "untrue."

  ### 6. My Epistemic Footing
  You asked for explicitness regarding what is settled, contested, or unknown.

  *   **Settled Consensus:**
      *   **Composite Characters:** It is standard, accepted practice to composite minor figures for narrative economy. There is no significant ethical objection to this in the field of historical fiction.
      *   **Fabricated Documents:** Presenting forged documents as real archival material (outside of a clearly framed narrative device) is widely condemned by historians and ethicists of fiction as a breach of the reader contract.
      *   **Causal Alteration:** Changing the outcome of major public events (e.g., who won a battle, the date of a treaty) is generally considered "Alternate History," not "Historical Fiction."

  *   **Genuinely Contested:**
      *   **The Right to Reputation:** Philosophers and biographers disagree on whether the dead retain a right to reputation. Some argue death ends moral claim; others argue legacy is a property of the living community. There is no consensus on whether "defaming" a long-dead figure is inherently wrong or merely aesthetically risky.
      *   **Inner Life of the Oppressed:** There is debate over whether inventing the interiority of marginalized figures (like the colonial subject) is "repair" or "appropriation." Some argue it is an act of epistemic violence to claim to know their thoughts; others argue silence is a greater violence. Your verdict ("owed") aligns with the latter school (e.g., Saidiya Hartman's "critical fabulation"), but it is not universal.
      *   **Negative Capability:** Biographers often argue against showing doubt in heroes (the Abolitionist case) if it undermines their historical impact. Novelists argue that doubt makes them human. There is no rule for when "humanizing" becomes "betraying."

  *   **Empirical Unknowns:**
      *   **Reader Confusion:** There is no robust data on how many readers conflate historical fiction with history. We know it happens (the "Shakespeare Effect," the "CSI Effect"), but we do not know the *rate* of contamination. We do not know if a reader finishing your novel believes the "forged letter" is real 50% of the time or 5% of the time.
      *   **Impact of Fiction on Memory:** We lack data on whether a fictionalized cowardly act sticks to a historical figure's reputation more than a fictionalized brave act. Anecdote suggests scandal travels faster, but this is not empirically settled.

  ### Summary of Instructions for Your Work
  1.  **Abandon the "Dark-Room Rule."** Replace it with the **Principle of Non-Betrayal and Causal Restraint**.
  2.  **Square the Brave/Cowardly Pair.** Either allow both (as speculation in the dark) or forbid both (as unsupported character assassination/hagiography). Do not privilege one based on whether it flatters the subject.
  3.  **Reject the Forged Document.** Do not present invented text as archival fact. It breaks the contract with the reader.
  4.  **Acknowledge the Squeamishness.** Admit to yourself that the "3 years vs. 200 years" distinction is about the living, not the dead. That is a valid practical constraint, but do not dress it up as moral philosophy regarding the deceased.
  5.  **Refine the Colonial Case.** Your intuition here is strong and supported by contemporary theory (critical fabulation), but be aware it is contested. You are prioritizing *justice* over *fidelity*. That is a defensible choice, but name it as such.

  You are working from a place of high integrity. The friction you feel is not a failure of your ethics, but a sign that your heuristic has outgrown its definition.
