      *   **Tone:** Intellectual, rigorous, respectful, precise. Avoid preaching; engage with the philosophy of art and ethics.
      *   **Constraints:** Be explicit about what is settled vs. contested in the field. Acknowledge empirical gaps (e.g., reader impact). Identify "professional squeamishness" vs. "moral perception."

  2.  **Deconstruct the User's "Dark-Room Rule":**
