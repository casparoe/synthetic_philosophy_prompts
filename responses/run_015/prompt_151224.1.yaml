answer: |-
  You are absolutely right to be frustrated. "Revolutions devour their children" is a metaphor, not a theory. When a historian uses it as an explanation, they are often smuggling in a specific causal argument without doing the work of stating it. It risks being a **tautology** (i.e., "The revolution killed revolutionaries because that is what revolutions do").

  To push back effectively, you need to force the metaphor to reveal its mechanical gears. Here is a menu of five distinct historical claims hidden inside that phrase, analyzed by their logic, evidence, and compatibility with your "personality politics" hypothesis.

  ---

  ### 1. The Institutional Suicide Pact (Structural Determinism)
  *   **The Claim:** Revolutionary governments are founded on "Emergency Powers" (suspension of law, rule by committee). To justify their existence, they require enemies. Once external enemies (foreign monarchies) recede, the institution must generate internal enemies to survive. The guillotine becomes the primary tool of governance.
  *   **Is it a Tautology?** **High Risk.** It assumes the outcome (self-destruction) is baked into the starting conditions. It implies no other outcome was possible.
  *   **Evidence Fit (Danton/Robespierre):** **Strong.** The Law of 22 Prairial (June 1794) stripped defendants of counsel and expanded the definition of "enemy of the people." This institutionalized the terror. Danton was killed because the Committee needed to prove it wasn't going soft; Robespierre was killed because the Committee needed to stop the machine from eating *them*.
  *   **Compatibility with Personality Politics:** **Incompatible/Blocking.** This argument suggests Robespierre *had* to fall because the institution of the Committee of Public Safety could not sustain itself. It renders his specific speeches, alliances, or ego irrelevant. The structure eats the actor.

  ### 2. The Ideological Purity Spiral (Conceptual Determinism)
  *   **The Claim:** Revolutionary ideology (specifically Rousseauian "Virtue") is infinite and undefined. There is no metric for "enough" virtue. Therefore, any leader can always be outflanked by someone claiming to be *more* virtuous. Moderation becomes treason (Danton); radicalism becomes conspiracy (Hébert); authority becomes tyranny (Robespierre).
  *   **Is it a Tautology?** **Moderate Risk.** It depends on accepting that "Virtue" *must* lead to terror. (Historian François Furet argues this; social historians disagree).
  *   **Evidence Fit (Danton/Robespierre):** **Strong.** Danton was executed for "Indulgence" (wanting to slow the Terror). Robespierre was executed for "Tyranny" (wanting to continue it). The goalposts moved to ensure both fell.
  *   **Compatibility with Personality Politics:** **Compatible.** Ideology is a weapon. This reading allows that Robespierre *chose* to wield "Virtue" as a bludgeon. If he had been less dogmatic or more pragmatic (a personality trait), the spiral might have slowed. It argues personality drives the *speed* of the spiral, even if the spiral is structural.

  ### 3. The Security Dilemma (Game Theory/Paranoia)
  *   **The Claim:** In a system where political opposition is criminalized (treason), disagreement becomes existential. If I think you might denounce me tomorrow, I must denounce you today. This creates a cascade of preemptive strikes. It isn't about ideology; it's about survival.
  *   **Is it a Tautology?** **No.** This is a testable political science model. It predicts specific behaviors (coalition building against a perceived threat).
  *   **Evidence Fit (Danton/Robespierre):** **Very Strong.** Robespierre's fall wasn't a trial; it was a coup. On 8 Thermidor, Robespierre gave a speech hinting at a new purge but refused to name names. Every member of the Convention thought, "He means me." They formed a coalition (Tallien, Barras, Vadier) solely to survive.
  *   **Compatibility with Personality Politics:** **Highly Compatible.** This is where your argument shines. Robespierre's specific *style* (aloof, moralizing, vague threats) triggered the security dilemma. A different leader with the same power might have reassured the Convention rather than terrifying them. This argues the fall was contingent on Robespierre's specific political miscalculations.

  ### 4. The Thermidor Reaction (Sociological Exhaustion)
  *   **The Claim:** A society cannot sustain permanent mobilization and economic control (the Maximum). The revolutionary elite (the *nouveaux riches* who bought church lands) want to secure their gains and stop the guillotine. They remove the "Incorruptible" because he is an obstacle to stability and profit.
  *   **Is it a Tautology?** **No.** This is a class-interest argument.
  *   **Evidence Fit (Danton/Robespierre):** **Mixed.** Explains Robespierre well (he opposed corruption/speculation). Explains Danton less well (Danton was also corruptible, but killed earlier). It explains why the *Convention* turned on Robespierre, but not why Robespierre turned on Danton earlier.
  *   **Compatibility with Personality Politics:** **Compatible.** It suggests Robespierre was removed because his *personality* (asceticism, moralizing) became inconvenient for the elite's desire to cash out. His personal refusal to compromise made him a target for a class seeking stability.

  ### 5. The "Revolutionary Fate" (Metaphysical/Teleological)
  *   **The Claim:** Revolution is a force of nature. It has a logic independent of human agents. The "Children" are fuel for the fire.
  *   **Is it a Tautology?** **Yes.** This is the phrase used as a magic spell. It explains nothing because it asserts the outcome is inevitable by definition.
  *   **Evidence Fit (Danton/Robespierre):** **Weak.** It ignores contingency. It ignores that Robespierre was within hours of being acclaimed before the Convention turned. It ignores that Danton could have fled but chose to stay.
  *   **Compatibility with Personality Politics:** **Totally Blocking.** If the Revolution is a god that demands sacrifice, human agency (personality, choices, clashes) is an illusion. This is the interpretation you must challenge.

  ---

  ### How to Use This Menu with Your Tutor

  Your tutor is likely using **Option 5** (Metaphysical) to summarize **Option 1** (Structural) and **Option 2** (Ideological).

  **The Counter-Move:**
  Don't reject the phrase entirely. Instead, ask them to specify the *mechanism*.

  *   **Ask:** "When you say the revolution devoured him, do you mean the **institutions** of the Committee made his fall inevitable (Option 1), or that his **specific rhetorical choices** on 8 Thermidor triggered a security dilemma among his peers (Option 3)?"
  *   **The Pivot:** "If it was institutional inevitability, why did the Terror stop almost immediately after Robespierre fell? If the logic of revolutionary government demands blood, why did Thermidor succeed without him?"
  *   **Defending Personality:** "If we accept the Security Dilemma (Option 3), doesn't Robespierre's failure to name his enemies suggest a specific personal miscalculation rather than a structural necessity? Could a less dogmatic leader have navigated the same institutions without falling?"

  **Summary for your notes:**
  *   **Blocks your argument:** Institutional Suicide, Revolutionary Fate.
  *   **Supports your argument:** Security Dilemma, Thermidor Reaction.
  *   **Nuanced/Middle:** Ideological Purity (Structure sets the trap, Personality springs it).

  If you can force the tutor to admit that the "Security Dilemma" was triggered by Robespierre's specific behavior on 8 Thermidor, you win the "personality politics" point. If they insist the Committee of Public Safety *must* always kill its leaders, they are arguing structural determinism, and you can critique that as historically fatalistic.
