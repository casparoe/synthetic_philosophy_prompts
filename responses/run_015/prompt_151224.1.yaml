  My history tutor keeps dropping "revolutions devour their children" whenever we talk about the Terror, last time when I asked if Robespierre's fall was mostly personality politcs or the logic of revolutonary government itself. I feel like the phrase is covering up like five different arguments at once. Can you lay out the precise claims it could be making -- like built-in institutional self-destruction, ideological purity spirals, or just "power corrupts but faster" -- and for each say whether it's a tautology, whether the actual fall of Danton and then Robespierre supports it, and which reading actually blocks my personality-clash idea versus which ones are compatble with it? I want a menu I can take back, not just one answer.
