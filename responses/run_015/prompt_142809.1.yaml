answer: |-
  # Spec: Desiderata for PAP-Preservationist Theories of Moral Responsibility

  **Objective:** Define necessary conditions for a theory of moral responsibility that maintains the Principle of Alternative Possibilities (PAP) is true, despite Frankfurt-style counterexamples (FSCs).

  ## I. Hard Constraints (Logical & Empirical Necessities)

  **1. Case Coverage & Robustness**
  *   **Classic Frankfurt:** Must identify a specific alternative possibility (AP) available to the agent in the actual sequence (e.g., the "flicker" of deciding on one's own vs. being forced) that is morally significant enough to ground responsibility.
  *   **Nested Frankfurt:** Must survive the "regress objection." If a second intervener monitors the first to ensure the flicker doesn't occur, the theory must identify a remaining AP or explain why the nested setup is metaphysically/coherently impossible.
  *   **Epistemic Opacity:** Must handle cases where the agent falsely believes they have live options (due to hidden constraints) vs. cases where they know constraints exist. The theory must specify whether *knowledge* of the AP is required for responsibility, or merely the *existence* of the AP.

  **2. Conceptual Distinctions**
  *   **Sourcehood vs. Leeway:** Must not collapse leeway (alternative sequences) into sourcehood (actual sequence origin). The theory must justify why leeway is a necessary condition for responsibility even when sourcehood conditions (causation, identification) are fully met.
  *   **Blame vs. Punishment:** Must distinguish between the *status* of being blameworthy (requires PAP) and the *practice* of punishing (may utilize utilitarian constraints). The theory cannot save PAP merely by redefining blame as a social tool.

  **3. Empirical Compatibility (Neuroscience)**
  *   **Unconscious Initiation:** Must respect data suggesting action initiation occurs unconsciously prior to conscious awareness (Libet/Soon-style findings).
      *   *Constraint:* The required AP cannot be located at the moment of conscious "veto" if neuroscience indicates the decision is settled pre-consciously.
      *   *Constraint:* The "access" to alternatives must be compatible with deterministic or sub-conscious processing models, unless the theory explicitly commits to indeterminism (see Camp Preferences).
  *   **Cognitive Load:** Must not require epistemic effort that exceeds normal human cognitive capacity during standard deliberation windows.

  ## II. Camp Preferences (Soft Constraints)

  *   **Compatibilist Friendliness:** (Preference) Ideally, the theory should not require libertarian indeterminism to function, though this is not strictly required if Hard Constraints are met.
  *   **Folk Intuition Alignment:** (Preference) Should align with pre-theoretic judgments that agents in standard Frankfurt cases are responsible (if defending PAP) OR that they are not (if biting the bullet on responsibility to save PAP).
  *   **Parsimony:** (Preference) Should not multiply entities (e.g., hidden interveners, complex modal structures) beyond necessity to save the AP.

  ---

  # Scorecard: Theory Evaluation Against Spec

  **Scoring Key:**
  *   **PASS:** Meets Hard Constraint.
  *   **FAIL:** Violates Hard Constraint.
  *   **RISK:** Theoretically possible but faces significant tension with constraint.

  | Desideratum | **Sourcehood Theories** (Actual Sequence) | **Hierarchical Compatibilism** (Frankfurtian) | **Epistemic Leeway** (User Hybrid) |
  | :--- | :--- | :--- | :--- |
  | **1. PAP Preservation** | **FAIL** | **FAIL** | **PASS** |
  | *Reasoning* | Explicitly rejects PAP; argues FSCs kill PAP and that's fine. | Accepts FSCs kill PAP; grounds responsibility in identification/volition, not alternatives. | By definition, retains a leeway condition. Claims responsibility requires accessible alternatives. |
  | **2. Case Coverage (Classic)** | **N/A** | **PASS** | **RISK** |
  | *Reasoning* | Irrelevant (does not seek to save PAP). | Handles Classic FSC easily (Jones identifies with act). | **Risk:** If the intervener blocks *all* access, does "epistemic effort" create an illusion of access? Must prove AP exists despite intervention. |
  | **3. Case Coverage (Nested)** | **N/A** | **PASS** | **FAIL** |
  | *Reasoning* | Irrelevant. | Handles Nested FSC easily (sourcehood remains intact). | **Fail:** Nested monitors eliminate the "flicker." If APs are removed by nested monitoring, Epistemic Leeway has no "accessible" alternative to point to. |
  | **4. Distinctions (Source/Leeway)** | **FAIL** | **FAIL** | **PASS** |
  | *Reasoning* | Collapses Leeway into Sourcehood. | Collapses Leeway into Sourcehood (identification). | Maintains distinction; Leeway is a separate necessary condition. |
  | **5. Distinctions (Blame/Punish)** | **PASS** | **PASS** | **PASS** |
  | *Reasoning* | Can distinguish status vs. practice. | Can distinguish status vs. practice. | Can distinguish status vs. practice. |
  | **6. Empirical (Unconscious Initiation)** | **PASS** | **PASS** | **RISK** |
  | *Reasoning* | Compatible with unconscious causation. | Compatible with unconscious identification. | **Risk:** If "reasonable epistemic effort" requires conscious access to alternatives, it conflicts with unconscious initiation data. Must locate "effort" in pre-conscious deliberation. |

  ## Summary Analysis

  **Sourcehood & Hierarchical Compatibilism:**
  Both theories automatically fail the primary objective of this spec. They are designed to accept that Frankfurt cases kill PAP. They score well on empirical constraints and case coverage because they do not struggle to find hidden alternatives; they simply deny alternatives are necessary. They are the wrong tools for a PAP-preservationist project.

  **Epistemic Leeway (Hybrid):**
  *   **Strengths:** Successfully maintains the core PAP requirement (Hard Constraint 1) and keeps Sourcehood/Leeway distinct. It offers a nuanced way to handle cases where agents *think* they have options.
  *   **Weaknesses:** It faces a critical failure point on **Nested Frankfurt Cases**. If a nested intervener ensures no alternative is physically accessible, "epistemic effort" cannot render an inaccessible path accessible. To pass, this theory must argue that Nested Frankfurt cases are metaphysically impossible or that "accessibility" is purely epistemic (i.e., if you *believe* you can choose otherwise, you satisfy the condition), which risks collapsing into a subjective theory of responsibility.
  *   **Empirical Risk:** It must define "epistemic effort" carefully to avoid requiring conscious veto power that neuroscience suggests we lack. If "effort" implies conscious control at the moment of action, it violates Hard Constraint 3.

  **Verdict:** To meet the spec, **Epistemic Leeway** must refine its definition of "access" to be compatible with unconscious processing and provide a "flicker" defense robust enough to survive nested monitoring (e.g., by arguing the *signs* of intervention are themselves alternative possibilities). Without this refinement, it fails the Nested Constraint.
