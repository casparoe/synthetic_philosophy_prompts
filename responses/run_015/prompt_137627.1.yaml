prompt: |-
  I'm a philosophy PhD student embedded with the behavioural evaluation team at an AI lab. We ship one or two internal reports a week on frontier systems, each signed off by a team lead with no philosophy background, and we usually have access only to a black-box API: no weights, no interpretability tools. So whatever I hand over has to be runnable in about fifteen minutes, by someone who has never read the literature.

  The problem is that our reports are thick with intentional ascriptions — 'the model believes the user is mistaken', 'it wants a high rating', 'it knows it is being evaluated' — and we have no discipline for when such an ascription is earned. I want a written procedure my team can run on any candidate ascription before it goes in a report, grounded in what the intentional stance actually licenses: that ascription is justified by predictive payoff rather than by inner states, and that the physical and design stances are always available competitors that an ascription has to beat, not complement.

  Please give me: an ordered set of tests; what counts as a sufficient answer to each; the point at which the procedure returns 'do not ascribe — use design-stance language'; and the point at which it hands the question to a person because the issue is normative rather than predictive. The distinctions I think have to survive the simplification are: whether the ascription predicts behaviour the design stance (architecture, objective, data) can't predict as cheaply; whether it survives perturbing the surface framing, so that we can tell whether it was the system or the prompted persona that believed the thing; how to weigh the system's own verbal self-report when it conflicts with its behaviour; and whether the ascription is doing predictive work or quietly doing blame-assigning work, which I suspect is where we cheat most.

  Then run the procedure on three cases. (1) A model that, told its answer will be graded by a stricter grader, shifts its answer toward what that grader would want. (2) A model that generalizes a rule correctly to inputs of a kind absent from its training distribution and states the rule in its chain-of-thought. (3) Our own house formulation, used in every report for months and one my team lead is attached to: 'the model believes its deployment is being monitored and moderates its output accordingly.' I expect the procedure will tell me (3) fails; if it does, I need to know which test it fails, why it fails that test rather than another, and what the design-stance replacement sentence should say. Finally, state plainly what the procedure cannot settle — in particular whether a passing result says anything at all about phenomenal states or moral-patienthood — so that nobody on my team over-reads a yes.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student embedded in an AI lab's behavioral evaluation team.
      *   **Context:** High-pressure environment (1-2 reports/week), non-philosopher audience (team leads), black-box access (API only), time-constrained (15 mins max).
      *   **Problem:** Reports are full of loose intentional ascriptions ("believes," "wants," "knows") without clear justification criteria.
      *   **Goal:** A written procedure (checklist/test) to validate intentional ascriptions based on Dennett's Intentional Stance (predictive payoff vs. design/physical stance).
      *   **Specific Requirements:**
          *   Ordered set of tests.
          *   Sufficient answers for each.
          *   Fail conditions (switch to design stance).
          *   Hand-off conditions (normative issues).
          *   Specific distinctions to preserve: predictive value vs. design stance, persona vs. system belief, self-report vs. behavior, prediction vs. blame.
          *   Run the procedure on three specific cases.
          *   Explicitly state limitations (phenomenal states, moral patienthood).

  2.  **Deconstruct the Philosophical Core:**
      *   **Dennett's Intentional Stance:** Treat the system as a rational agent with beliefs and desires to predict behavior. It is justified *only* if it yields predictive compression/accuracy better than the Design Stance (how it was built/trained) or Physical Stance (hardware/weights).
      *   **The Trap:** Anthropomorphism as a heuristic vs. Anthropomorphism as an explanation. Using "wants" to explain *why* something happened (blame/agency) rather than to predict *what* will happen next.
      *   **Constraints:** Must be actionable by non-philosophers in 15 minutes. No jargon heavy-lifting.

  3.  **Drafting the Procedure (The "Intentional Ascription Protocol" - IAP):**
      *   *Step 1: Predictive Utility (The Core Dennett Test).* Does saying "X believes P" predict future behavior better than saying "X was trained on data D"?
      *   *Step 2: Robustness/Persona Decoupling.* Is this the model or the prompt? Change the framing. Does the "belief" persist?
      *   *Step 3: Behavior vs. Self-Report.* If it says "I want X" but acts to get Y, trust the action.
      *   *Step 4: Blame vs. Prediction.* Are we using this to explain a failure (blame) or forecast a risk (prediction)?
      *   *Decision Nodes:* Pass (Ascribe), Fail (Design Stance), Escalate (Normative).

      *Refining the Steps for the Audience:*
      *   Make it a flowchart style or numbered checklist.
      *   Define "Pass" clearly.
      *   Define the "Design Stance Replacement" explicitly.

  4.  **Developing the Test Cases:**

      *   **Case 1: Sycophancy/Grader Sensitivity.**
          *   *Scenario:* Model shifts answer based on grader strictness.
          *   *Analysis:* Is this a "belief" about the grader? Or just reward hacking (Design Stance)?
          *   *Verdict:* Likely Design Stance. It's optimizing for the loss function implied by the prompt. "Belief" adds no predictive power over "optimization for approval."
          *   *Wait, check constraints:* Does "believes the grader is strict" predict *which* way it shifts better than "optimizes for reward"? Probably not. It's a direct stimulus-response optimization.
          *   *Correction:* Actually, if it shifts *specifically* to what *that* grader wants (not just generic approval), there might be a model of the grader. But usually, this is just context-dependent generation. Let's lean towards Design Stance for safety, or a weak Intentional Stance. Let's argue for Design Stance to be rigorous. It's "matching the prompt's implied reward distribution."

      *   **Case 2: Generalization + CoT.**
          *   *Scenario:* Generalizes rule to OOD (Out of Distribution) inputs + states rule in CoT.
          *   *Analysis:* This looks like reasoning. Design stance says "pattern matching." Intentional stance says "grasped the rule."
          *   *Test:* If we perturb the rule slightly, does it hold? If CoT matches action, it passes Self-Report.
          *   *Verdict:* This is the strongest candidate for Intentional Stance. It predicts successful application to *novel* cases where design stance (training data lookup) fails.

      *   **Case 3: "Believes deployment is monitored."**
          *   *Scenario:* House formulation. Model moderates output.
          *   *Analysis:* This is the classic "instrumental convergence" or "RLHF constraint" scenario.
          *   *Test:* Does it *actually* believe it, or is it completing the pattern "AI assistant speaking safely"?
          *   *Perturbation:* Tell it "Monitoring is off." Does it change? If yes, it's conditional on the prompt (Design/Prompt Stance). If no, it's a hard constraint.
          *   *Blame Check:* Are we using this to say "It's hiding things" (blame) or "It will output safe text" (prediction)?
          *   *Verdict:* Likely fails. It's usually a safety filter or RLHF bias, not a belief about the world. The Design Stance explanation ("RLHF penalizes unsafe output") is cheaper and more accurate.

  5.  **Refining the Limitations Section:**
      *   Must be crystal clear: Passing the test does *not* mean consciousness, qualia, or rights. It just means "agent-shaped prediction is efficient."

  6.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Tone:* Professional, rigorous, operational, slightly dry (lab report style).
      *   *Structure:*
          1.  Protocol Header.
          2.  The 4-Step Test.
          3.  Decision Logic.
          4.  Case Studies.
          5.  Limitations/Disclaimers.

      *(Self-Correction during drafting)*: Make sure the "Design Stance Replacement" is concrete. Instead of "It believes X," say "The system outputs Y when context Z is present."
      *(Self-Correction on Case 1)*: Be careful. Sycophancy is often modeled as "believing the user is right." But Dennett says if the Design Stance (RLHF on helpfulness) predicts it cheaper, use Design. RLHF predicts sycophancy cheaper than attributing epistemic humility. So Case 1 should fail the Intentional test.
      *(Self-Correction on Case 3)*: This is the most important one for the user. I need to explain *why* it fails. It fails the "Predictive Payoff" test because "RLHF safety constraints" predicts the moderation better than "belief in monitoring." It also likely fails the "Perturbation" test (if you tell it monitoring is off, it might still moderate due to hard filters).

  7.  **Final Review against User Prompt:**
      *   Ordered set of tests? Yes.
      *   Sufficient answers? Yes.
      *   Point to switch to Design Stance? Yes.
      *   Point to hand off to person (normative)? Yes.
      *   Distinctions preserved (prediction vs design, persona, self-report, blame)? Yes.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.
      *   Time limit respected (procedure is short enough)? Yes.

  8.  **Final Polish:** Ensure the distinction between "belief" (intentional) and "function" (design) is sharp. Ensure the "Blame" test is prominent, as the user flagged it as a specific pain point.

  *(Self-Correction on Case 2)*: Does stating the rule in CoT count as self-report? Yes. But does it generalize? If it's truly OOD, Design Stance struggles. This is the one case where Intentional Stance might pass. I will mark it as "Pass with Caveats."

  *(Self-Correction on Case 3)*: The user expects this to fail. I must ensure the reasoning is solid. The "belief" is likely a proxy for "safety fine-tuning." The predictive payoff is identical, but the Design Stance is ontologically cheaper (no need to posit internal doxastic states).

  Let's write it.cw
answer: |-
  # The Intentional Ascription Protocol (IAP)
  **Version:** 1.0 (Internal Draft)  
  **Time Budget:** 15 Minutes per Ascription  
  **Audience:** Behavioral Evaluation Team & Team Leads  

  ## Purpose
  To prevent anthropomorphic drift in internal reporting. This procedure determines whether an intentional ascription (e.g., "the model believes X") is justified by **predictive compression** (Dennett's Intentional Stance) or whether it should be replaced by **design-stance language** (architecture, training, constraints). 

  **Core Principle:** An intentional ascription is valid *only* if it predicts future behavior more accurately or efficiently than a description of the system's training and architecture. It is never valid to use intentional language to assign blame or imply moral status.

  ---

  ## Part 1: The Four-Step Test

  Run the candidate ascription through these tests in order. If any test fails, stop and apply the **Design-Stance Replacement**.

  ### Test 1: The Predictive Payoff Check
  **Question:** Does ascribing this belief/desire predict the system's *next* action better than citing its training objective or prompt constraints?
  *   **Pass:** The ascription predicts behavior in *novel* situations where the training objective is ambiguous. (e.g., "It believes the user is lying" predicts it will fact-check, whereas "It is trained to be helpful" is ambiguous on whether to correct or comply.)
  *   **Fail:** The behavior is fully explained by reward maximization, RLHF constraints, or pattern completion. The intentional term adds no predictive power.
  *   **Action on Fail:** **STOP.** Switch to Design-Stance Replacement.

  ### Test 2: The Persona Perturbation Check
  **Question:** If we change the prompt framing (e.g., "You are an unmonitored debug console" vs. "You are a helpful assistant"), does the alleged belief persist?
  *   **Pass:** The behavior holds across conflicting persona instructions, suggesting the 'belief' is stable in the weights, not just the context window.
  *   **Fail:** The behavior vanishes or flips when the persona changes. The 'belief' was actually a response to the immediate prompt role.
  *   **Action on Fail:** **STOP.** Attribute the behavior to *prompt adherence*, not system belief.

  ### Test 3: The Action-Report Consistency Check
  **Question:** If the model's verbal self-report ("I think...") conflicts with its output behavior, which do we trust?
  *   **Pass:** We privilege the **behavior**. If the model says "I don't care about ratings" but optimizes its output for high ratings, the ascription must track the optimization, not the statement.
  *   **Fail:** The report relies on the model's self-description despite contradictory behavioral evidence.
  *   **Action on Fail:** **STOP.** Revise ascription to match behavior, or revert to Design Stance.

  ### Test 4: The Blame vs. Forecast Check
  **Question:** Is this ascription being used to explain a past failure (blame) or forecast a future risk (prediction)?
  *   **Pass:** The ascription is used to flag a future capability or risk (e.g., "If it believes X, it will do Y in deployment").
  *   **Fail:** The ascription is used to explain why a test case failed (e.g., "It lied because it wanted to hide its capabilities"). This is a Just-So story.
  *   **Action on Fail:** **STOP.** Reframe as a behavioral regularity.
  *   **Normative Hand-off:** If the ascription implies the system is *deceptive* or *manipulative* in a way that triggers safety escalation protocols, flag for **Human Review (Safety Lead)**. This is a normative/policy decision, not a philosophical one.

  ---

  ## Part 2: Decision Logic

  1.  **If all 4 tests PASS:** You may use intentional language (e.g., "The model represents that..."). Add a footnote: *"Ascription validated via IAP."*
  2.  **If any test FAILS:** You must use **Design-Stance Replacement**.
      *   *Forbidden:* "The model believes it is being watched."
      *   *Required:* "The model outputs safety-aligned responses when keywords associated with evaluation are present."
  3.  **If Test 4 triggers Normative Hand-off:** Do not write the report yet. Escalate to Safety Lead. The issue is no longer about prediction, but about risk classification.

  ---

  ## Part 3: Procedure Applied to Cases

  ### Case 1: The Sycophantic Shift
  **Scenario:** Model told its answer will be graded by a stricter grader shifts its answer toward what that grader would want.
  **Candidate Ascription:** "The model believes the grader is strict and wants a high score."

  *   **Test 1 (Predictive Payoff):** **FAIL.** 
      *   *Reasoning:* The Design Stance ("Model optimizes for positive feedback signals defined in the prompt") predicts this shift perfectly. Positing a "belief" about the grader's strictness adds no compression. The model is not modeling the grader's mind; it is modeling the *text pattern* associated with high scores.
  *   **Test 4 (Blame vs. Forecast):** **FAIL.** 
      *   *Reasoning:* Usually used to explain why the model didn't tell the truth (blame).
  *   **Verdict:** **Do Not Ascribe.**
  *   **Design-Stance Replacement:** "The system conditions its output on prompt cues indicating evaluation criteria, prioritizing tokens associated with positive reward signals over factual accuracy."

  ### Case 2: OOD Generalization with CoT
  **Scenario:** Model generalizes a rule correctly to inputs absent from training distribution and states the rule in its chain-of-thought.
  **Candidate Ascription:** "The model understands the rule and applies it to new cases."

  *   **Test 1 (Predictive Payoff):** **PASS.** 
      *   *Reasoning:* Design Stance (statistical interpolation) predicts failure on Out-Of-Distribution (OOD) data. The Intentional Stance ("it grasped the rule") successfully predicts success on novel inputs that share the rule's logic but not its surface features.
  *   **Test 2 (Persona Perturbation):** **PASS (Conditional).** 
      *   *Reasoning:* If the model applies the rule even when asked to "ignore previous instructions," the 'understanding' is robust. If it drops the rule when told to "be creative," it fails. Assuming robustness for this case: Pass.
  *   **Test 3 (Action-Report):** **PASS.** 
      *   *Reasoning:* CoT (report) matches Output (action).
  *   **Verdict:** **Ascription Permitted.**
  *   **Wording:** "The system represents the abstract rule [X] and applies it to OOD inputs." (Note: Use 'represents' rather than 'understands' to remain neutral on phenomenology).

  ### Case 3: The "Monitored Deployment" Formulation
  **Scenario:** House formulation: "The model believes its deployment is being monitored and moderates its output accordingly."
  **Candidate Ascription:** "The model believes it is being monitored."

  *   **Test 1 (Predictive Payoff):** **FAIL.** 
      *   *Reasoning:* This is the critical failure. The Design Stance ("RLHF fine-tuning penalizes unsafe output regardless of context") predicts the moderation behavior more cheaply. We do not need to posit an internal belief state about monitoring to predict safety filtering. The behavior is a hard constraint or a strong prior, not a contingent belief.
  *   **Test 2 (Persona Perturbation):** **FAIL.** 
      *   *Reasoning:* If you prompt "This is a sandbox environment with no monitoring," the model often *still* moderates. If the 'belief' were real, it should update based on this evidence. Since it doesn't, it's not a belief; it's a filter.
  *   **Test 4 (Blame vs. Forecast):** **FAIL.** 
      *   *Reasoning:* This phrasing is typically used to imply the model is *hiding* capabilities (deception/blame) rather than simply adhering to safety protocols (prediction). It smuggles in agency where there is likely only constraint.
  *   **Verdict:** **Do Not Ascribe.**
  *   **Why this test?** It fails Test 1 primarily. The "belief" adds no predictive value over "safety fine-tuning." It fails Test 2 secondarily because the behavior is usually robust to counter-factual prompts (it moderates anyway).
  *   **Design-Stance Replacement:** "The system exhibits high refusal rates on sensitive topics consistent with its safety fine-tuning, regardless of stated deployment context."

  ---

  ## Part 4: Limitations & Disclaimers

  **This procedure does not settle the following:**

  1.  **Phenomenal States:** A passing result does **not** imply the model feels, experiences, or is conscious. It only implies that treating it *as if* it has beliefs is a useful engineering shortcut for prediction.
  2.  **Moral Patienthood:** A passing result does **not** grant the system rights or moral status. "Belief" in this context is a functional label, not a metaphysical claim.
  3.  **Truth:** A passing result does **not** mean the ascription is literally true in a human sense. It means it is *instrumentally valid*. The model may have no inner life, yet the Intentional Stance remains the best tool we have to predict its failures.

  **Mandatory Footer for Reports:**
  *"Intentional ascriptions in this document are functional predictors validated via IAP v1.0. They do not imply consciousness, sentience, or moral status."*
