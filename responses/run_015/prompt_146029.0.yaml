answer: |-
  **Title:** Prioritarianism, Risk, and the Limits of Levelling-Down Immunity

  **Research Question**
  Does prioritarianism's immunity to the levelling-down objection hold under conditions of uncertainty, or does the view's application to prospective choices generate a distinct objection regarding *ex post* Pareto efficiency that merely mimics the structure of levelling down?

  **Background and Problem Statement**
  Prioritarianism is standardly defended against the levelling-down objection (LDO) by appealing to its aggregative structure. Because the moral value of well-being is a strictly increasing, strictly concave function of absolute lifetime levels, lowering a person's well-being without compensating gains elsewhere necessarily reduces total moral value. Unlike egalitarianism, prioritarianism is not committed to the claim that an outcome where everyone is worse off is in any respect better than an unequal outcome where some are better off.

  However, this immunity is typically demonstrated in deterministic contexts. Under uncertainty, the application of the priority weighting function becomes ambiguous. We must distinguish between *ex ante* prioritarianism (weighting expected well-being) and *ex post* prioritarianism (weighting realized well-being in each state). My preliminary analysis suggests that *ex post* prioritarianism may violate immunity in prospective cases. Consider a choice between a sure benefit for the worse-off and a gamble with equal expected value but a lower worst-case outcome. *Ex post* prioritarianism may reject the gamble solely because of the bad branch, even if the better-off are unaffected in that branch. This verdict resembles levelling down: we reject a prospect because in one state, the worse-off are lower and no one is higher.

  The standard reply—that prioritarianism avoids LDO because it is person-affecting in a way egalitarianism is not—does not settle this. That reply assumes the "person" is the unit of evaluation across a lifetime. Under uncertainty, the unit of evaluation may shift to "person-in-a-state." If the priority weight applies to states, the view may exhibit risk aversion that looks suspiciously like a concern for equality across states, reviving the LDO in a new guise. Furthermore, the concavity of the priority function may be conflating two distinct normative attitudes: a concern for priority (giving weight to the worse-off) and a concern for risk (aversion to variability in well-being). If these are not separated, we cannot determine whether a rejection of the gamble is due to prioritarian priority or mere risk aversion.

  **Methodology**
  The obvious alternative method is to axiomatize variants of prioritarianism and check their verdicts against the LDO. While necessary, axiomatization is insufficient for this project. It can tell us *whether* a view violates immunity, but not *why*. It cannot distinguish whether a negative verdict stems from a genuine commitment to levelling down or from a distinct failure of *ex post* Pareto efficiency. To secure funding and philosophical clarity, this project must disentangle the normative sources of the verdict. Therefore, the method will be conceptual disambiguation followed by formal modelling where risk attitudes and priority weights are parameterized independently.

  *Year 1: Conceptual Mapping and Matrix Construction*
  *   **Term 1:** Rigorous definition of the four cells: Subtractive vs. Pre-emptive levelling down, and Actual vs. Prospective application. I will determine whether the "bearer of weight" contrast (whether the levelled-down person is the priority bearer) is a distinct variable or reducible to the existing matrix. Preliminary analysis suggests it risks splitting the project; I will treat it as a sensitivity check rather than a primary dimension to maintain scope.
  *   **Term 2:** Literature analysis of *ex ante* vs. *ex post* welfarism. I will catalogue existing arguments regarding the "separability" of states in prioritarian calculus.
  *   **Term 3:** Drafting the distinction between "priority concavity" and "risk concavity." I will develop a informal framework showing how standard prioritarianism conflates these.

  *Year 2: Formal Modelling and Testing*
  *   **Term 1:** Construction of a decision-theoretic model allowing the priority function and the risk function to vary independently. This allows me to test if LDO immunity fails only when risk aversion is high, or when priority weighting is steep.
  *   **Term 2:** Running the four matrix cells through this model. I will test if the "Prospective" cells generate LDO-like verdicts only when risk and priority are conflated.
  *   **Term 3:** Analysis of the "Subtractive vs. Pre-emptive" contrast. I will determine if active worsening is treated differently from withholding benefits under uncertainty, and if this distinction tracks the LDO.

  *Year 3: Normative Evaluation and Synthesis*
  *   **Term 1:** Evaluating the verdicts. If *ex post* prioritarianism fails immunity in prospective cells, is this fatal? Or is it a plausible restriction on gambling with the worse-off's baseline?
  *   **Term 2:** Developing the deliverable (see below).
  *   **Term 3:** Thesis writing and integration of findings.

  **Range of Conclusions**
  There are three primary possible outcomes:
  1.  **Immunity Holds Uniformly:** The apparent LDO in prospective cases dissolves once risk and priority are separated. The verdict against the gamble is driven purely by risk aversion, which is normatively distinct from levelling down.
  2.  **Immunity Fails, Objection is Genuine:** *Ex post* prioritarianism is committed to a form of levelling down across states. This would suggest *ex post* prioritarianism is untenable, forcing a retreat to *ex ante* views or a hybrid.
  3.  **Immunity Fails, Objection is Misidentified:** The verdict in prospective cells is not LDO but a violation of *ex post* Pareto efficiency. The vocabulary of "levelling down" is borrowing moral force from a different objection.

  The decision between these will rest on the modelling in Year 2. If separating the risk parameter removes the LDO-like verdict, Conclusion 1 is supported. If the verdict persists even with risk neutrality, Conclusion 2 is supported. If the verdict persists but aligns with Pareto violations rather than equality concerns, Conclusion 3 is supported.

  **Deliverable**
  For practitioners aggregating benefits under uncertainty (e.g., health economists using distributional cost-effectiveness analysis), the thesis will produce a **Decision Matrix for Prioritarian Weighting under Risk**. This will specify when applying priority weights to expected outcomes diverges from applying them to realized outcomes, and provide guidance on which method avoids counter-intuitive levelling-down implications in policy contexts involving high-stakes gambles for the vulnerable.

  **Risk Assessment and Failure Conditions**
  This project carries specific risks that must be acknowledged to ensure feasibility.
  1.  **Triviality of the Matrix:** It is possible that upon formalization, three of the four cells (e.g., Subtractive/Actual, Pre-emptive/Actual, Subtractive/Prospective) collapse into triviality or standard certainty cases, leaving the project effectively about one specific case of Prospective/Pre-emptive levelling down. If this occurs, the matrix will be discarded as decorative, and the thesis will refocus exclusively on the prospective case.
  2.  **Project Bifurcation:** There is a risk that the project secretly comprises two distinct inquiries: one about the currency of prioritarian value (well-being vs. opportunity) and one about its treatment of risk. If the modelling in Year 2 shows that risk and priority cannot be conceptually separated without abandoning the core definition of prioritarianism, the project will fail to answer the research question. In this event, the thesis will pivot to argue that prioritarianism is inherently incompatible with standard decision theory under uncertainty, rather than attempting to rescue its immunity.
  3.  **The Third Contrast:** If the "bearer of weight" contrast proves irreducible to the main matrix, including it will double the workload. The mitigation strategy is to exclude it from the core argument, as noted in Year 1, unless the primary matrix yields null results.

  By explicitly testing for these failure modes in Year 2, the project ensures that even a negative result regarding the separability of risk and priority constitutes a substantive philosophical contribution.
