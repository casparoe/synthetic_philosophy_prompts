  Hey, I have been wrestling with this same problem set all week, and I think your classmate is onto something with the primary and secondary intension distinction, though I suspect our professor is blending that with a specific version of social externalism. To get at your colony case, we need to isolate the two rules that best explain her seemingly contradictory rulings on the 1700 Twin Earth case versus the standard modern case. The first rule is a standard causal-historical view where reference is fixed by an initial baptism and preserved through a chain of communication, which explains her verdict on the testimony case and the false descriptions case. The second rule, which seems to override the first in specific contexts, is that without expert knowledge of underlying essences, reference is fixed by the superficial properties available to the community, effectively prioritizing the primary intension over the secondary. This is the only way to make sense of her claim that in 1700, before chemistry, the extensions of water on Earth and Twin Earth do not come apart. If reference were purely causal-historical anchored to microstructure, they would have differed even then; since she says they didn't, she must think that pre-scientific communities refer via the descriptive role the liquid plays in their lives.

  Applying this to your colony scenario, the crucial factors are their isolation and their lack of chemical knowledge. Even though they have an Earth dictionary stating water is H2O, you specified that they treat this as opaque ritualistic knowledge rather than active expert understanding. Given her ruling on the arthritis case, content is fixed by how experts in the community use the word, not by what individuals can spell out. Since there are no chemists in the colony to enforce the H2O constraint, and the community has been self-sufficient for generations, the relevant linguistic community is now the colony itself, not historical Earth. Her Swampman ruling emphasizes that without a linguistic community and causal history, there is no content, but here they have a robust local community and history, just not an Earth-connected one. Consequently, the causal link to Earth is too attenuated to override the current usage patterns of the isolated group. Therefore, I predict she would rule that the colonist's word refers to XYZ. Because the reference differs from modern Earth Oscar's H2O, the belief content regarding crops would also differ, despite the internal similarity, because the truth conditions depend on the local stuff sustaining the crops.

  The closest analogue from her earlier rulings is definitely the 1700 Twin Earth case. In both scenarios, you have a community using the term for a local liquid without knowledge of its microstructure. In 1700, she said extensions don't come apart, implying reference is to the superficial kind; in your colony, the superficial kind is XYZ. The dictionary entry functions like a false description in her other case, but since it is not understood by experts, it doesn't fix the reference to H2O. The primary and secondary intension framework fits here because the primary intension (the way we identify water, i.e., clear, drinkable liquid) picks out XYZ in the colony, while the secondary intension (the actual underlying nature) would pick out H2O only if the community were connected to Earth's scientific practices. To actually distinguish the competing rules—specifically to test whether the Earth origin matters more than the current community—you should propose a variant where the colony re-establishes contact with Earth and Earth scientists correct them, informing them that real water is H2O and the local stuff is XYZ. If she then says their reference shifts to H2O despite local usage, it proves the causal-historical chain dominates; if she says they still refer to XYZ until they change their own practices, it confirms that current community expertise is the ultimate fixer. I think betting on the XYZ reference is safer given her emphasis on the 1700 case, but that migration variant would tell us for sure.
