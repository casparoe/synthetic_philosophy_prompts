      *   **Agreement with Lewis:** Concrete possible worlds exist; they are spatiotemporally isolated.
      *   **Disagreement with Lewis:** Actuality is *not* purely indexical (i.e., "actual" doesn't just mean "this world where I am").
      *   **Distinguishing Feature:** Our world is metaphysically special because it has a "maximal, non-branching causal structure" that other worlds lack.
