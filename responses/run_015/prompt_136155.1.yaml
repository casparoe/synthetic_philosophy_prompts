prompt: |-
  Draft the joint statement that a committed Humean regularist and a committed anti-Humean governing-theorist could both sign after an adversarial collaboration on the metaphysics of physical law, with special attention to conservation laws in quantum mechanics and to the constructed case of "World K"—a universe observationally identical to ours whose fundamental ontology explicitly includes non-empirical "governing" relations that do not alter any regularity.

  Format the document as follows. First, a numbered list of claims both sides accept: about the formal derivation of conservation laws, about what phenomena require explanation (counterfactual robustness, the law/accident distinction, modal language in science), and about which standard arguments each camp takes to be sound but not decisive. Second, a disagreements table in two columns—wording for the Humean side and wording for the anti-Humean side—stating precisely where they differ on whether laws are in the world or in our system, whether counterfactual support requires modal properties, and how each interprets World K. Third, identify at least three cruxes—sub-questions that, if settled, would move at least one party. For each crux, name the concrete argument, thought experiment, or empirical result both agree is relevant, and record in advance each side's predicted assessment of it. Fourth, conclude with a brief assessment of whether any residual disagreement is purely verbal (about "law," "govern," or "necessity") and, if so, exactly which formulations dissolve on analysis.

  Do not request citations, reading lists, or references to particular authors' texts; the deliverable should be constructible from conceptual analysis alone.
