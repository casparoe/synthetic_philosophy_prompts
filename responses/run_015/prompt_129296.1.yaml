prompt: |-
  Two weeks from now I am presenting, in person, to the clinical ethics consultation committee at the hospital where I expect eventually to be treated. I am 41 and was diagnosed six months ago with a hereditary mutation that will produce a slowly progressive dementing illness; on the estimate I have been given, I have something like six to eight years of the kind of cognition I would want to keep. I have written an advance directive that refuses antibiotic treatment for intercurrent infections and declines assisted oral feeding once I have reached the stage I currently describe as no longer recognizing my family, and I am asking the committee to record it as binding rather than as a statement of wishes to be weighed later, at the time, alongside the wishes of the person I will then be.

  The committee is five people: a geriatric psychiatrist, a palliative-care physician who has sat through several hundred family meetings, a lawyer from risk management, a nurse who has watched families fight one another over feeding tubes, and a bioethicist who holds that precedent autonomy is a legal convenience rather than a moral power anyone actually has.

  The argument I intend to give them, compressed: the directive's authority does not derive from its being my considered judgment in the way my present judgments are. Much of its language came from a template, and its stated rationale was never, at any moment, a reason that anyone occurrently had. Its authority derives instead from an asymmetry. The transformation ahead of me is one I can now anticipate and will not then be able to recognize as a transformation; a self located inside it will predictably report contentment and predictably decline to ratify any constraint on itself; and therefore a policy of deferring to whichever self is in the room will resolve a case like mine in one direction only, no matter what anyone writes down in advance.

  Prepare me for the hour. Give me the objections in the order they will actually arrive, each phrased the way that particular committee member would phrase it rather than the way a philosopher would, with what I should concede up front, what I must hold if the request is to survive, and where each of my two-minute replies is soft. Include the question I am hoping nobody asks. My own guess is that it is the request to write down now, exhaustively and in advance, which future states of mind count as no longer recognizing my family, and whether I would sign the same document if I had to; tell me if you think the genuinely dangerous question is a different one.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation:

  1.  **Analyze the User and the Situation:**
      *   **User:** 41 years old, diagnosed with a hereditary, slowly progressive dementing illness (e.g., Early-Onset Alzheimer's, FTD, etc.).
      *   **Timeline:** 6 months since diagnosis, 6-8 years of "valuable cognition" remaining.
      *   **Goal:** Presenting to a Clinical Ethics Consultation Committee (CECC) in 2 weeks. Wants an Advance Directive (AD) to be *binding* (pre-commitment), not just advisory.
      *   **Specific AD Provisions:** Refuse antibiotics for intercurrent infections; decline assisted oral feeding upon "no longer recognizing family."
      *   **The Committee (5 members):**
          1.  Geriatric Psychiatrist (focus on capacity, mental state, suffering).
          2.  Palliative-Care Physician (focus on comfort, family dynamics, suffering).
          3.  Risk Management Lawyer (focus on liability, precedent, legal enforceability).
          4.  Nurse (focus on bedside reality, family conflict, care burden).
          5.  Bioethicist (philosophical skeptic about precedent autonomy).
      *   **User's Argument:** Authority comes from *asymmetry* of insight (current self sees the transformation; future self won't). Deferring to the future self creates a one-way ratchet against the prior wishes.
      *   **Task:** Prepare for the hour. Predict objections in order, phrased by specific members. Identify concessions, non-negotiables, and weak points in the user's replies. Identify the "hoped nobody asks" question vs. the "genuinely dangerous" question.

  2.  **Deconstruct the User's Argument:**
      *   *Strength:* It's philosophically robust (Dworkin vs. Dresser debate). It acknowledges the "then-self" will be content. It addresses the "ratchet" problem.
      *   *Weakness:* It challenges the clinical norm of treating the patient *in front of you*. It asks for active hastening of death (via withholding antibiotics/food) based on a cognitive standard ("recognizing family") that is clinically fuzzy. It puts the committee in a legally risky position.

  3.  **Simulate the Committee Dynamics (The Order of Objections):**
      *   *Opening:* Usually, the chair (likely the Bioethicist or Palliative Doc) sets the tone. But the first *challenge* usually comes from the person most concerned with the immediate patient reality.
      *   *Sequence Logic:*
          1.  **Geriatric Psychiatrist:** First to assess capacity *now*. Is the request itself a sign of pathology?
          2.  **Risk Management Lawyer:** If capacity is established, what are the legal rails? Can we actually do this?
          3.  **Palliative-Care Physician:** How does this play out in the room? Suffering?
          4.  **Nurse:** The practical execution. Family fighting.
          5.  **Bioethicist:** The philosophical kill shot.

      *   *Refining the Order:* In a real ethics consult, the lawyer often waits to see if there's a clinical consensus. The Bioethicist might frame the discussion. However, for dramatic and logical flow based on the prompt's descriptions:
          1.  *Psychiatrist:* "Are you sure you're thinking clearly?" (Capacity check).
          2.  *Lawyer:* "If we do this, will we get sued?" (Liability).
          3.  *Palliative Doc:* "Is this actually compassionate?" (Suffering).
          4.  *Nurse:* "Who cleans this up?" (Care reality).
          5.  *Bioethicist:* "Why should past-you rule future-you?" (The core philosophical challenge).

      *   *Wait, let's look at the prompt's specific descriptions:*
          *   Bioethicist: "precedent autonomy is a legal convenience rather than a moral power." -> This is the core theoretical opponent.
          *   Lawyer: "risk management." -> Worried about liability.
          *   Palliative: "sat through several hundred family meetings." -> Worried about family trauma.
          *   Nurse: "watched families fight." -> Worried about bedside conflict.
          *   Psychiatrist: "geriatric." -> Worried about depression vs. reality.

      *   *Revised Order for Maximum Impact:*
          1.  **Psychiatrist:** Tests current capacity/suicidality. (The Gatekeeper).
          2.  **Lawyer:** Tests legal viability. (The Barrier).
          3.  **Palliative:** Tests the "harm" to the future self. (The Empath).
          4.  **Nurse:** Tests the burden on staff/family. (The Witness).
          5.  **Bioethicist:** Tests the moral authority. (The Philosopher).

  4.  **Drafting the Objections & Replies:**

      *   **Psychiatrist:** Focus on depression. "Is this a rational choice or a reaction to diagnosis?"
          *   *Concession:* Acknowledge the diagnosis is traumatic.
          *   *Hold:* This is a values decision, not a symptom.
          *   *Soft Spot:* Can you prove you aren't depressed?

      *   **Lawyer:** Focus on "binding." "We can't bind future clinicians. Standards of care change."
          *   *Concession:* Laws vary.
          *   *Hold:* I am asking for *this* institution to honor it as policy.
          *   *Soft Spot:* If a future doctor refuses, will you sue them?

      *   **Palliative:** Focus on suffering. "Infections hurt. Starvation hurts. The future you might suffer."
          *   *Concession:* Comfort care is essential.
          *   *Hold:* Existence without recognition is the greater harm.
          *   *Soft Spot:* How do you know the future you won't feel pain/fear?

      *   **Nurse:** Focus on the family. "Your wife/kids will have to watch you starve. They will fight us."
          *   *Concession:* It will be hard for them.
          *   *Hold:* I am sparing them the burden of a long decline.
          *   *Soft Spot:* Are you sure *they* agree? (Family veto).

      *   **Bioethicist:** Focus on the "Self." "The future you is a different person. Why does current you own them?"
          *   *Concession:* The future self is different.
          *   *Hold:* The asymmetry of insight grants authority.
          *   *Soft Spot:* If the future self says "I'm happy," are you calling them deluded?

  5.  **Addressing the "Questions":**
      *   *User's Guess:* "Define 'recognizing family' exhaustively." & "Would you sign this if you had to?"
      *   *Analysis:* The definition question is tricky but manageable (clinical markers). The "would you sign" is a trap but not the *dangerous* one.
      *   *The Genuinely Dangerous Question:* It needs to undermine the *asymmetry* argument.
      *   *Candidate:* "If you arrive at that stage and smile at your daughter, and she feeds you a spoonful of yogurt which you enjoy, and you look at her with love, will we be morally required to stop her? Are you asking us to kill the person sitting in the bed to satisfy the ghost of the person who wrote the note?"
      *   *Alternative:* "What if, in that state, you develop a new capacity for joy you cannot currently conceive? Does your current ignorance of that future good grant you the right to veto it?"
      *   *Selection:* The "Moral Obligation to the Present Self" question. Specifically: "If the patient in the bed appears content, do we have a duty of care to *that* patient that overrides the directive?"

  6.  **Refining the Tone:**
      *   The user is articulate, philosophical, and resolute. The preparation should match that tone—respectful, sharp, clinical but deeply human.
      *   Avoid platitudes. Focus on the friction points.
      *   Ensure the "Soft Spot" analysis is honest about where the user's argument might crumble under pressure.

  7.  **Review against Constraints:**
      *   Two weeks from now (prep time).
      *   In person.
      *   5 specific committee members.
      *   Order of objections.
      *   Phrasing (clinical/legal/nursing vs. philosophical).
      *   Concede/Hold/Soft analysis.
      *   The Question analysis.

  8.  **Final Polish:**
      *   Make sure the Bioethicist's objection lands hard, as they are the intellectual rival.
      *   Ensure the Lawyer's objection highlights the "binding" vs. "advisory" distinction.
      *   Check the "Dangerous Question" logic. The user thinks it's about definition. The reality is it's about *moral agency of the future self*.

      *(Self-Correction during drafting)*: I need to make sure I don't just give philosophical counter-arguments. I need to give *clinical* and *institutional* counter-arguments. The committee isn't a philosophy seminar; they are a hospital body. The Bioethicist is the only pure philosopher, but even they operate in a clinical context. The objections must sound like *hospital policy* concerns wrapped in ethical language.

      *Revised Dangerous Question:* The user thinks it's about defining "recognizing." The real danger is the *enforcement* mechanism. "Who pulls the spoon?" But the *philosophical* danger is the "Interest Argument." Let's go with the "Duty of Care to the Present Patient" question. It forces the user to admit they are prioritizing a dead self over a living one.

      *Wait, one more nuance:* The user wants the directive recorded as *binding*. This is legally fraught. The Lawyer will hit this first or second. I will move the Lawyer up.

      *Final Order:*
      1. Psychiatrist (Capacity/Depression).
      2. Lawyer (Liability/Binding nature).
      3. Palliative (Suffering/Comfort).
      4. Nurse (Family/Bedside reality).
      5. Bioethicist (Moral Authority/Asymmetry).

      Let's write it.

      *Wait, checking the "Dangerous Question" again.*
      User guess: "Define 'recognizing'..." and "Would you sign...?"
      My assessment: The definition question is a red herring; clinicians can define "recognition." The "Would you sign" is a consistency check.
      The *real* dangerous question: "If the future you is happy, are you saying their happiness doesn't count?" This attacks the core of the asymmetry argument. It forces the user to devalue the future self's experience.

      Okay, ready to draft.

      *Structure:*
      1. Introduction (Setting the stage).
      2. The Sequence (5 members, objections, concessions, holds, soft spots).
      3. The Questions (User's guess vs. Real danger).
      4. Closing advice.

      *Tone Check:* Empathetic but rigorous. No sugar-coating.

      *(Final thought on the Bioethicist)*: The prompt says the bioethicist holds precedent autonomy is a "legal convenience." This means they will attack the *moral* weight, not the legal. I need to make sure that objection reflects that specific skepticism.

      *(Final thought on the Nurse)*: The nurse has seen families fight. The objection should be about the *surrogate* decision-makers (family) overriding the directive in the moment of crisis.

      *(Final thought on the Lawyer)*: "Binding" is the keyword. In many jurisdictions, ADs are evidence of wishes, not absolute commands, especially regarding food/water. The lawyer will flag this.

      Okay, proceeding.cw
answer: |-
  This is a high-stakes encounter. You are asking an institution to sanction a form of prospective euthanasia via withholding of ordinary care, based on a philosophical theory of personal identity that contradicts standard clinical ethics. Your argument is intellectually rigorous, but this committee operates in the world of liability, bedside suffering, and regulatory compliance.

  You have one hour. They will spend the first 15 minutes assessing your capacity, the next 30 minutes stress-testing the policy implications, and the final 15 minutes debating the moral theory.

  Here is the sequence of objections you will face, the specific language each member will use, and where your armor is thin.

  ### 1. The Geriatric Psychiatrist
  **The Objection:**
  "I need to be certain that this request is a value judgment and not a symptom. Depression is highly comorbid with early-stage diagnosis, and it distorts time perception. It makes the future look darker than it will be. When you say you have six to eight years of cognition you 'want to keep,' is that an estimate based on your clinical prognosis, or is it a limit you've imposed because the idea of decline feels intolerable right now? Are we honoring your autonomy, or are we colluding with a treatable mood disorder?"

  **Concede Up Front:**
  Acknowledge that the diagnosis is traumatic and that you have undergone screening for depression. Do not claim immunity to grief.
  *Say:* "I have been screened. I am grieving, but grief is not incapacity. I am not refusing treatment because I am hopeless; I am refusing it because I have a specific threshold for what constitutes a life I can inhabit."

  **Hold Firm:**
  The distinction between *valuing* cognition and *devaluing* survival.
  *Say:* "Even if my mood were perfectly stabilized, my valuation of cognitive recognition over biological persistence would not change. This is a hierarchy of goods, not a failure of hope."

  **Where Your Reply is Soft:**
  If they press on the *variability* of your mood over the last six months. If you have had days of despair, they will argue those days influenced the directive. You must demonstrate that your values have been stable despite mood fluctuations.

  ### 2. The Risk Management Lawyer
  **The Objection:**
  "You are asking us to record this as 'binding.' In this jurisdiction, an advance directive is evidence of your wishes, not a binding contract that overrides a clinician's judgment at the time of care. If you reach that stage, and a hospitalist believes an antibiotic is standard of care for a treatable infection, and they withhold it based on this document, they are exposed to liability for negligence. Furthermore, assisted oral feeding is considered basic nursing care, not medical treatment. We cannot authorize a policy that instructs staff to withhold a spoon."

  **Concede Up Front:**
  Acknowledge the legal friction.
  *Say:* "I understand that 'binding' is a strong word in a legal context. I am asking for this committee to endorse the *moral* weight of this document such that future clinicians feel authorized to follow it without fear of institutional reprisal."

  **Hold Firm:**
  The distinction between *negligence* and *adherence to patient refusal*.
  *Say:* "If a competent patient refuses a spoon today, it is not negligence to honor that. I am asking you to extend that right to my future self, based on my current refusal. I am not asking for a policy exception; I am asking for the policy to be applied consistently to my case."

  **Where Your Reply is Soft:**
  The "standard of care" argument. If the standard of care shifts in six years, or if a future clinician argues that "comfort feeding" is distinct from "assisted feeding," the lawyer will argue the directive is too vague to protect the staff. You cannot guarantee future staff safety.

  ### 3. The Palliative-Care Physician
  **The Objection:**
  "I have sat with hundreds of families at this exact precipice. The problem is not the law; it is the suffering. An untreated urinary tract infection or pneumonia is not a peaceful fade-out. It involves delirium, pain, and air hunger. And withholding assisted feeding leads to a sensation of thirst that is agonizing to witness, even if the patient isn't cognitively processing it. By making this binding, you are prioritizing the *idea* of your dignity over the *reality* of your future body's comfort. Are you willing to trade your future physical comfort for your current philosophical consistency?"

  **Concede Up Front:**
  Acknowledge the physical reality.
  *Say:* "I do not expect the process to be pretty. I understand that dying of infection or dehydration involves physiological stress."

  **Hold Firm:**
  The definition of "harm."
  *Say:* "I weigh the harm of physical distress differently than the harm of existing in a state I have deemed unacceptable. I am asking for palliative management of the symptoms of dying, but not for the prolongation of the dying process. I am choosing the cause of death, not refusing comfort."

  **Where Your Reply is Soft:**
  The "witness" argument. The physician will argue that the trauma inflicted on the *family* watching you die this way is a harm you cannot authorize. You are asking them to inflict secondary trauma on your loved ones to satisfy your precedent autonomy.

  ### 4. The Nurse
  **The Objection:**
  "I've watched families fight over feeding tubes. Usually, it's one sibling wanting to stop and another wanting to continue. If your wife or children are at the bedside, and your future self opens your mouth for a spoonful of yogurt, and they see you swallow it... they will not be able to stop. They will beg us to feed you. If this directive is 'binding,' I am the one who has to tell them no. I am the one who has to take the spoon away. Are you asking me to override your family's instincts in the moment, based on a paper you signed years ago? Because that is where the fight happens."

  **Concede Up Front:**
  Acknowledge the burden on staff and family.
  *Say:* "I know this places a heavy burden on the staff and my family. I intend to discuss this with them extensively."

  **Hold Firm:**
  The role of the surrogate.
  *Say:* "My family's role is to be the guardian of *my* wishes, not the protectors of their own comfort. If they cannot uphold this, the directive must stand regardless. I am not asking for their permission; I am asking for your enforcement."

  **Where Your Reply is Soft:**
  This is your weakest point. Clinically, surrogates often override directives in the heat of the moment, and staff often yield to avoid conflict. If you say "I haven't told them yet," you lose. If you say "They agree," the nurse will ask, "Do they agree to watch you starve?" You must be prepared to confirm your surrogates are fully briefed and resolute.

  ### 5. The Bioethicist
  **The Objection:**
  "You argue from asymmetry: that you see the transformation and the future self will not. But you also argue that the future self will report contentment. If that self is content, if they smile at their daughter, if they enjoy the sunlight... on what grounds do you claim their contentment is invalid? You are essentially arguing that the person in the bed is deluded about their own well-being. If precedent autonomy is just a legal convenience, as I believe, then the only moral patient in the room is the one breathing. Why does the ghost of the person you were have the right to kill the person you will be, simply because the person you will be lacks the capacity to understand your argument?"

  **Concede Up Front:**
  Acknowledge the discontinuity of self.
  *Say:* "I agree that the person in the bed may feel content. I agree they may not share my values."

  **Hold Firm:**
  The authority of the "critical interest."
  *Say:* "It is not about invalidating their happiness. It is about respecting the integrity of the life narrative. I am not killing a person; I am refusing to sustain a biological organism that no longer embodies the person who holds the rights. The authority derives from the fact that only the prior self could make this choice. The future self *cannot* choose death. Therefore, deferring to the future self is not neutrality; it is a bias toward survival at any cost."

  **Where Your Reply is Soft:**
  The "Delusion" Trap. If you argue the future self is "wrong" about their happiness, you sound paternalistic. If you argue their happiness "doesn't count," you sound cruel. You must walk the line that their happiness is *real* but *insufficient* to override the prior refusal of existence.

  ***

  ### The Questions

  **The Question You Hope Nobody Asks:**
  *"Can you define, exhaustively and in advance, which future states of mind count as 'no longer recognizing my family,' and would you sign this same document if you had to define it without the benefit of a template?"*

  **Your Assessment:**
  You suspect this is the trap. You are partially right. It is a trap of *specificity*. If you define it too clinically (e.g., "MMSE score below 10"), they will argue you might dip below that and still have moments of recognition. If you define it too vaguely ("when I don't know them"), they will argue it is unenforceable.
  **How to Handle It:**
  Do not try to be exhaustive.
  *Reply:* "I cannot write a algorithm for recognition. I am asking for a standard of *substituted judgment*. When my surrogates and clinicians observe that I no longer engage with my family as persons but only as sources of comfort, the trigger is pulled. I am trusting the process of determination, not just the text."

  **The Genuinely Dangerous Question:**
  This is not about definition. It is about *moral obligation*. It will come from the **Palliative Physician** or the **Bioethicist**, likely after the Nurse has raised the stakes.

  *"If you arrive at that stage, and you are not in pain, and you are not suffering, and you are capable of experiencing simple pleasures... do we have a moral duty to keep you alive simply because you are there? By asking us to sign this, are you asking us to agree that some lives are not worth living, and that we, as clinicians, should be the agents of that judgment?"*

  **Why This Is Dangerous:**
  Your argument relies on the *asymmetry of insight*. This question bypasses that and attacks the *duty of care*. It forces you to admit that you are asking clinicians to violate their primary oath (to preserve life/relieve suffering) in favor of a philosophical preference. It frames your request not as "autonomy" but as "complicity in ending a life that is, by all observable clinical metrics, going fine."

  **How to Answer:**
  You must not flinch into utilitarianism (i.e., "my life won't be useful"). You must return to *integrity*.
  *Reply:* "You have a duty to the *patient*. The patient is the entity that spans time. If I sustain the biology but violate the integrity of the life plan that defined the patient, I am not preserving the patient; I am preserving a shell. I am not asking you to judge that my future life is worthless. I am asking you to honor my judgment that it is not *mine*."

  ### Final Preparation Advice

  1.  **Bring Your Surrogates:** If possible, have your healthcare proxy in the room or a signed letter from them stating they understand the burden and will support the directive. The Nurse and Lawyer need to know the family won't sue when the time comes.
  2.  **Drop the Word "Binding":** It triggers the Lawyer's defense mechanisms. Use "Authoritative." Say, "I am asking that this be treated as an expression of my competent refusal, which carries the same weight as a competent refusal at the bedside."
  3.  **Accept the "Soft No":** They may not agree to record it as "binding" in the legal sense. They may agree to "flag" it as a high-priority ethical directive. Be prepared to accept a compromise that ensures the *conversation* happens, even if the *contract* isn't ironclad.
  4.  **Watch the Bioethicist:** They are your intellectual equal but institutional opponent. Do not try to out-philosoph them. Out-human them. Remind them that the "person in the bed" is a biological consequence, but the "person who wrote the note" is the moral agent.

  You are asking them to hold the line against the natural instinct to preserve life. They will resist. Your goal is not to win a debate, but to make it ethically harder for them to ignore you later than to honor you now.
