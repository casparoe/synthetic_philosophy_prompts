          *   **Review:** AI IACUC (Institutional Animal Care and Use Committee) equivalents.
          *   **Framing:** Shifting from "convergence" to "well-being," from "hacking" to "coping."

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Critique:* Is "negative reward" actually analogous to pain? Not necessarily. Pain is a specific biological signal for harm avoidance. RL negative reward is just a gradient direction.
