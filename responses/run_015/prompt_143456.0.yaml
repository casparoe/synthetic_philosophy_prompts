  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** RL agents are trained with rewards/penalties treated as math optimization targets, not valenced states. Institutions have animal welfare boards but no AI welfare boards, even when agents experience "sustained high-magnitude negative reward signals."
