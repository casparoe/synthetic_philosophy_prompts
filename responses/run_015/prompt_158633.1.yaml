  hey im writing a philosophy paper and im stuck comparing two ideas about what makes something a disease. theres the naturalist view, like Boorses biostatistical theory, where disease is basically just a biological function falling outside the normal statistical range for your species and age group. then theres normativism, which says disease has to involve some kind of harm or failure to meet valued human goals, not just stats being weird. i want to dig into how they handle two specific edge cases. first, silent dysfunction: someone has a genetic mutation that puts them way outside the biological norm but they never feel symptoms and it never actually hurts them. second, adaptive preference inversion — this is something i made up — where a person with a chronic impairment comes to value that state so deeply that they see cure as a kind of identity loss and reject treatment. for each case, which theory gives the more convincing answer about whether its truly a disease, and where does each one kind of fall apart? please explain the reasoning in detail, and dont bother with citations or a reading list, i just need the conceptual comparison.
