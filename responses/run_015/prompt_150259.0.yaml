answer: |-
  ### What the unit is
  The unit is **Capability Doublings per Institutional Response Cycle (CD/IRC)**. One IRC is the minimum time required for a major actor (state or corporation) to detect a shift, deliberate, and deploy resources; speed is measured as how many capability doublings occur within that window. This currency matters because coordination runway isn't about calendar time; it's about the ratio of tech progress to human bureaucratic latency. A "fast" takeoff consumes all IRCs before countermeasures land; a "slow" one allows at least one IRC per step.

  ### The list

  1.  **Deployment Lag Separation:** The theory must distinguish between benchmark capability and fielded power. This handles **the quiet year**, where lab metrics double but regulation and integration prevent visible impact; a theory calling this "fast" because benchmarks rose is wrong, because no coordination runway was burned.
  2.  **Hardware Binding:** The theory must specify the elasticity of compute supply independent of algorithmic efficiency. This handles **two clocks**, acknowledging that software can jump while chip fabs and power grids move at industrial speeds; if the story assumes compute appears instantly with code, it is physically incoherent.
  3.  **Domain Vectoring:** The theory must allow cognitive speed to diverge from physical speed. This handles **jaggedness**, where an AI might hack networks in days but manipulate robotics in years; a single scalar index of "intelligence" is forbidden unless it maps to specific strategic domains.
  4.  **External Gate Identification:** The theory must name the non-cognitive bottlenecks gating deployment. This handles **non-cognitive bottlenecks** like permits, trials, or energy contracts; if progress is gated by physics or law rather than thought, the takeoff speed is capped by the slowest gate, not the fastest mind.
  5.  **Actor Granularity:** The theory must declare if the capability curve belongs to a single firm or the aggregate market. This handles **concentration**, because a doubling held by one actor is a strategic threat, while a doubling spread across thousands is merely economic growth; you cannot mix these without breaking the coordination model.
  6.  **Decisiveness Threshold:** The theory must define the specific capability line that unlocks a lumpy advantage. This handles **thresholds**, distinguishing between smooth economic gain and a seizure of power; without a defined "win condition," speed is meaningless because you don't know when the race ends.
  7.  **Epistemic Status:** The theory must state whether uncertainty is due to fog (we can't see it) or randomness (it hasn't happened). This handles **whether takeoff speed is a feature of the world or of our forecasting**; if the speed is purely epistemic, coordination is about intelligence gathering, not physical intervention.
  8.  **Recursion Mechanism:** The theory must specify exactly what is improving what (e.g., code writing code vs. data processing data). This handles the **hard-takeoff/recursive-self-improvement** claim; if the mechanism isn't specified, the acceleration is magic, not engineering, and cannot be timed.
  9.  **Contestability Window:** The theory must state if a lead once opened can be closed by competitors. This handles **coordination viability**, because if the lead is indefensible, speed doesn't matter; if it is defensible, then the first mover's speed is the only speed that counts.

  ### Non-negotiable vs. camp prejudice
  Non-negotiable demands are **Hardware Binding**, **Deployment Lag**, and **Decisiveness Threshold**; these are structural constraints of physics and bureaucracy that apply regardless of your AI ideology. Camp prejudice includes **Recursion Mechanism** specifics and the exact shape of **Domain Vectoring**; hard-takeoff advocates prefer tight coupling between cognition and action, while slow-takeoff advocates prefer loose coupling, but both must admit the constraint exists.

  ### Where the list breaks
  The tension lies between **Actor Granularity** and **Contestability Window**. If you claim a single actor achieves decisive advantage (high granularity), you must admit the contestability window is zero for everyone else, making coordination impossible. If you claim the window is open enough for coordination (high contestability), you cannot claim a single actor has seized decisive power; you cannot have a singleton takeover that still allows for regulatory response.

  ### The one that kills
  **Deployment Lag Separation** rules out the most existing stories. Most hard-takeoff narratives assume lab capability translates instantly to world influence, ignoring the "quiet year" of integration; most slow-takeoff narratives assume physical friction stops lab progress, ignoring stockpiled compute. Any theory that conflates benchmark scores with deployed strategic power is immediately disqualified.

  ### Sixty-second scorecard
  **Hard-takeoff/RSI** fails on Hardware Binding and Deployment Lag, assuming code constraints dominate physical supply chains and integration friction. **Continuous takeoff** passes Deployment Lag but often fails on Decisiveness Threshold, assuming smooth economic growth rather than lumpy power shifts. **AI-as-normal-tech** fails on Recursion Mechanism and Actor Granularity, ignoring the potential for cognitive self-improvement and winner-take-all dynamics.
