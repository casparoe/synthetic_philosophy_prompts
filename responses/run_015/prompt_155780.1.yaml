answer: |-
  **Big Ideas Exam: Decision Theory & Pascal's Mugging**
  **Time Allowed:** 30 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider two variants of Pascal's Mugging:

  1.  **The Curator:** A stranger asks for $5. Instead of stating a reward number, they hand you a folded card with a short computer program. They claim: "If you pay, I will give you days of pure joy equal to the number this program prints when it halts." The program is short (low complexity), but the number it outputs is astronomically large (e.g., a Busy Beaver number). Neither of you can run it to verify the output.
  2.  **The Recruiter:** A stranger asks for $5 for a huge reward. When you hesitate, they say: "I didn't pick you at random. I scanned the crowd and chose you specifically because you look like the sort of person who hands over the fiver. Therefore, your decision to pay is strong evidence that I am telling the truth."

  Write an essay evaluating whether these variants succeed where the standard Pascal's Mugging fails. In your answer, you must address:
  *   Does specifying the payoff via a short program bypass the objection that "probability shrinks faster than utility grows"?
  *   Does the Recruiter's selection effect make paying rational, or is it a trick of evidence?
  *   How does the situation change if a mugger approaches you every day for a year and you pay every time?

  ***

  ### Model Answer (Approx. 500 words)

  Pascal's Mugging challenges Expected Utility Theory by presenting a scenario where a tiny probability of an infinite (or astronomical) payoff outweighs a certain small cost. The standard defense is that as the promised utility grows, the rational prior probability of the claim being true must shrink faster, keeping the expected value low. The Curator and Recruiter variants attempt to plug the holes in this defense.

  The Curator variant attacks the link between magnitude and probability. In standard muggings, huge numbers are hard to describe, suggesting low complexity and thus low prior probability. However, a short computer program can output a number vastly larger than anything verbally describable (via the Busy Beaver function). Because the program is short, a Solomonoff Induction-style prior might assign it a higher probability than a verbal claim of the same magnitude. However, this variant still fails to force rational payment. The probability that matters is not the probability of the *number existing*, but the probability that the *mugger has the power to deliver it*. A short program describing a reward does not increase the likelihood that a random stranger controls reality-bending resources. The "probability shrinks" defense holds because the causal claim remains absurd, regardless of how efficiently the reward is described.

  The Recruiter variant shifts the ground from Causal Decision Theory (CDT) to Evidential Decision Theory (EDT). The mugger argues that paying is evidence of being the "type" who gets rewarded. Under EDT, if paying correlates with the reward (because the mugger selects based on that trait), then paying maximizes expected utility. However, this is likely a trick. Unless the mugger's selection mechanism is genuinely linked to their ability to pay (e.g., they only target people they intend to reward), the correlation is spurious. A rational agent should recognize that their decision cannot causally influence the mugger's past selection or current resources. If the selection is merely psychological profiling, paying buys nothing but evidence of gullibility.

  The iteration test—facing a mugger every day for a year—reveals the practical danger of accepting these variants. If you pay daily based on non-zero expected value, you lose $1,825 annually. If the muggings are independent events and the claims are false (as probability suggests), the Law of Large Numbers guarantees you lose money. The only way iteration justifies paying is if the probability updates based on past failures, but in Pascal cases, the claim is usually unfalsifiable until the end of time. Therefore, even if the Curator's program or the Recruiter's evidence nudges the probability up slightly, it cannot nudge it high enough to justify repeated losses.

  Ultimately, neither variant defeats the standard rescue. The Curator confuses description length with causal power, and the Recruiter confuses correlation with causation. Rational agents must cap their priors on extraordinary causal claims regardless of how the payoff is specified or what evidence is manufactured to support it.

  ***

  ### Mark Scheme (Out of 20)

  **Grade Boundaries:**
  *   **A (17–20):** Insightful, addresses all four required constraints with precision.
  *   **B (13–16):** Solid understanding, misses one nuance or slightly misapplies a concept.
  *   **C (9–12):** Basic explanation of mugging, struggles with the variants.
  *   **D (0–8):** Significant misunderstandings or incomplete.

  **Criteria Breakdown:**

  **1. The Curator & Program Specification (5 Marks)**
  *   **A Move:** Distinguishes between the probability of the *number* existing (high, due to short code) vs. the probability the *mugger can deliver it* (low). Notes that description length ≠ causal power.
  *   **B Move:** Treats the program simply as "a big number" without discussing complexity/priors, or claims the program makes the probability high.
  *   **C Move:** Ignores the program aspect or says "programs are fake."

  **2. The Recruiter & Selection Effect (5 Marks)**
  *   **A Move:** Identifies the tension between Evidential (paying is evidence) and Causal (paying changes nothing) decision theory. Argues the correlation is likely spurious/manipulative.
  *   **B Move:** Says the Recruiter is "lying" without addressing the evidential logic, or accepts EDT without critique.
  *   **C Move:** Confused by the selection effect; treats it as a standard threat.

  **3. The "Probability Shrinks" Defense (5 Marks)**
  *   **A Move:** Explicitly evaluates whether the variants break the rule that priors must drop faster than utility rises. Concludes that causal implausibility still drives the prior down.
  *   **B Move:** States the defense exists but doesn't apply it specifically to the variants' mechanics.
  *   **C Move:** Claims the defense is useless or doesn't mention it.

  **4. Iteration & Synthesis (5 Marks)**
  *   **A Move:** Uses the "every day for a year" scenario to show cumulative loss (money pump). Argues that repeated independent trials expose the falsity of the high EV claim.
  *   **B Move:** Notes you lose money but doesn't link it to independent events or probability updating.
  *   **C Move:** Says "you would be broke" without philosophical justification.

  **Examiner's Note for A-Grade:**
  To secure an A, the essay must not just describe the variants but explain *why* they try to bypass the standard objection and *why* they ultimately fail (or succeed) based on the distinction between **description** (Curator), **evidence** (Recruiter), and **causal power** (the core rescue). The iteration argument must be used to demonstrate the practical risk of ignoring the "probability shrinks" defense.
