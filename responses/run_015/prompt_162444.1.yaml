answer: |-
  **Sam's Moves**
  *   Fat tails dominate expectation calculations.
  *   Persistence channels aren't value-symmetric.
  *   Extinction risk swamps near-term effects.
  *   Heuristics minimize catastrophic variance better.
  *   Cannot enumerate all persistence channels.
  *   Concession: Near-term EV isn't zero.

  **Rowan's Moves**
  *   Causal dilution is empirically real.
  *   Most perturbations fade quickly anyway.
  *   Near-term sign is reliably robust.
  *   Need action-guidance procedure now.
  *   Concession: Existential cases differ structurally.
  *   Concession: Can't list all channels.

  **Dialogue**

  **Rowan:** Look, if Asymptotic Parity holds, my choice between finance and research simplifies. Most causal chains wash out. The probability my specific donation alters civilization's trajectory centuries later is vanishing. So the near-term good—direct poverty alleviation funded by my salary—decides it.

  **Sam:** But you're conflating probability of *difference* with expected *value*. Sure, persistence channels are rare. But if your finance job subtly shifts institutional stability, affecting extinction risk by 0.0001%, that dwarfs the near-term aid. The magnitude explodes faster than the probability shrinks.

  **Rowan:** That assumes systematic skew. Why think finance shifts stability negatively rather than positively? My ignorance is symmetric. If the long-run residual is noise, the mean converges to zero. The near-term signal remains the only non-noise component.

  **Sam:** Because uncertainty isn't just variance; it's sign-breaking. You can't verify the symmetry assumption. We can't enumerate the channels. Maybe finance normalizes risky algorithms; maybe research accelerates dangerous tech. You're treating the unknown as neutral, but it's opaque.

  **Rowan:** Opacity isn't paralysis. If I wait for certainty on persistence channels, I act never. Consequentialism needs a decision procedure. If 99% of the probability mass washes out, betting on the 1% where I'm clueless is irrational. I'll take the robust near-term win.

  **Sam:** I grant the near-term win has value. I'm not saying doing good is impossible. But if the long-run variance swamps the near-term mean, you lack justification for *maximizing*. You're following a heuristic—"help now"—because it's safe, not because it's optimal.

  **Rowan:** Safe enough. If the long-run effects truly cancel out asymptotically, then "help now" *is* optimal. You haven't shown they don't cancel, only that they *might* not. That's just standard uncertainty, not cluelessness.

  **Sam:** Here's what you're missing: the channels aren't random. They correlate with act-types. Finance structurally favors growth; research favors knowledge. Those have distinct long-run valences. You can't assume symmetry when the mechanisms themselves are biased. You haven't answered that.

  **Rowan:** Fair. I can't prove the mechanisms are symmetric. But I can show the dilution effect is strong enough that without specific evidence of bias, assuming neutrality is the only usable prior. You haven't shown how to operationalize your heuristics without smuggling in consequentialist math.

  **Sam:** I use track records, not forecasts. But fine—you've convinced me near-term isn't irrelevant. Just don't claim the long-run is settled.

  **Rowan:** And I admit existential cases break the model. But for ordinary acts? Parity holds.
