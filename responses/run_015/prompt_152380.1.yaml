answer: |-
  ### The Root Split: Why Distribution Comes Before Identity

  To map the moral landscape of compatriot preference, we must abandon the standard labels of "nationalist" and "cosmopolitan." These terms have become tribal markers that obscure actual policy commitments. A reader might identify as a patriot yet support open borders and foreign aid prioritization, while another might identify as a global citizen yet insist domestic poverty must be solved before sending money abroad.

  Therefore, the root of this decision tree cannot be about identity, sentiment, or abstract duty. It must be about **distributive priority in emergencies.** This is the only distinction that forces a trade-off. If you believe a state is morally permitted to save 1,000 compatriots from severe poverty over 1,000 foreigners from famine solely because they are compatriots, you occupy a different logical space than someone who insists on a lottery, regardless of how much you love your country's flag.

  The following diagnostic tree uses eight concrete nodes to classify positions. It moves from life-and-death allocation to cultural preservation, and finally to the limits of obligation. Follow the path that matches your intuition on each scenario to find your position.

  ***

  ### The Diagnostic Decision Tree

  **Node 1: The Emergency Budget**
  A state has a fixed surplus. It can either alleviate severe domestic poverty for 10,000 citizens or prevent a famine killing 10,000 foreigners. The cost and logistical difficulty are identical.
  *   **A:** The state is permitted (or required) to prioritize the citizens. *(Go to Node 2)*
  *   **B:** The state must treat the lives as equal (e.g., flip a coin). *(Go to Node 6)*

  **Node 2: The Efficiency Check**
  You chose priority. Is this justification based *only* on the fact that helping locals is logistically easier, creates better economic feedback loops, or ensures political stability for the aid program?
  *   **A:** Yes. If it were more efficient to help the foreigners, the priority would vanish. *(Leaf: Pragmatic Statism)*
  *   **B:** No. There is a moral debt or special obligation involved, regardless of efficiency. *(Go to Node 3)*

  **Node 3: The Source of Obligation**
  You believe there is a moral debt. Is this debt grounded primarily in **shared history, ethnicity, and cultural tradition**, OR in **shared political institutions, laws, and cooperation**?
  *   **A:** Shared History/Culture. The bond is organic and pre-political. *(Go to Node 4)*
  *   **B:** Shared Institutions. The bond is created by living under the same coercive laws and cooperative schemes. *(Go to Node 5)*

  **Node 4: The Cultural Preservation Test**
  You ground priority in culture. Does this justify restricting immigration to prevent the dilution of that culture, even if the immigrants agree to obey all laws and the economy needs the labor?
  *   **A:** Yes. Cultural continuity is a legitimate state interest that overrides open entry. *(Leaf: Strong Ethnic/Cultural Nationalism)*
  *   **B:** No. Cultural priority applies to resource distribution, but not to excluding willing participants. *(Leaf: Cultural Liberal Nationalism)*

  **Node 5: The Institutional Stability Test**
  You ground priority in institutions. Does the need to maintain the quality of these shared institutions (welfare state, trust, democracy) justify excluding immigrants if their arrival threatens that stability, even if they are not a cultural threat?
  *   **A:** Yes. We must protect the cooperative scheme that generates the obligations. *(Leaf: Strong Civic Nationalism)*
  *   **B:** No. Institutional obligations justify domestic priority, but not exclusionary borders unless capacity is physically breached. *(Leaf: Hybrid Institutional-Cosmopolitanism)*

  **Node 6: The Tie-Breaker**
  You rejected priority in emergencies (Node 1). However, consider non-essential goods: funding a local museum versus a foreign school, where the benefit to human welfare is roughly equal. May the state favor the local project?
  *   **A:** Yes. "Being ours" is a permissible tie-breaker when basic rights are not at stake. *(Leaf: Liberal Nationalism)*
  *   **B:** No. Impartiality is required in all state spending. *(Go to Node 7)*

  **Node 7: The Private/Public Split**
  You require state impartiality. Do *individual citizens*, acting privately, have special duties to compatriots that the *state* does not have?
  *   **A:** Yes. The state must be neutral, but I am free to favor my neighbors in my private charity and associations. *(Leaf: Pluralist Cosmopolitanism)*
  *   **B:** No. Moral obligations are uniform across public and private spheres. *(Go to Node 8)*

  **Node 8: The Kinship Limit**
  You require uniform impartiality. Is the duty to a foreigner exactly the same as the duty to a child or parent, or are there *some* associative weights (family) that are stronger than universal duties, even if compatriot weights are not?
  *   **A:** Family is special; everyone else is equal. *(Leaf: Moderate Cosmopolitanism)*
  *   **B:** Even family preference is suspect; strict impartiality is the only moral ideal. *(Leaf: Strict Cosmopolitanism)*

  ***

  ### Mapping the Leaves: Occupied and Empty Spaces

  This tree generates eight terminal positions. Four correspond to standard views, while others reveal logical gaps or neglected combinations.

  **1. Pragmatic Statism (Node 2A)**
  *   **View:** Compatriot priority is real, but purely instrumental.
  *   **Diagnosis:** **Unoccupied/Unstable.** This position is rarely defended as a moral theory. It is incoherent as a stable stance because it collapses the moment technology or logistics make foreign aid more efficient than domestic spending. It reflects a policy habit rather than a moral commitment.

  **2. Strong Ethnic/Cultural Nationalism (Node 4A)**
  *   **View:** Priority is based on organic culture and justifies exclusion.
  *   **Diagnosis:** **Occupied.** This is the traditional nationalist view. It is internally consistent but increasingly difficult to defend in diverse, modern democracies without resorting to controversial claims about ethnic superiority.

  **3. Cultural Liberal Nationalism (Node 4B)**
  *   **View:** Culture matters for distribution, but not for exclusion.
  *   **Diagnosis:** **Neglected.** This is a logically possible but rare spot. It suggests we owe more to those who share our traditions but cannot stop others from joining. It is unstable: if culture is valuable enough to prioritize resources, why is it not valuable enough to protect via borders?

  **4. Strong Civic Nationalism (Node 5A)**
  *   **View:** Shared institutions create strong duties and justify exclusion to protect those institutions.
  *   **Diagnosis:** **Occupied.** This is the dominant "center-right" view in many Western democracies. It avoids ethnic exclusion but maintains a hard border to protect the welfare state.

  **5. Hybrid Institutional-Cosmopolitanism (Node 5B)**
  *   **View:** Shared institutions create distributive priority, but not a right to exclude.
  *   **Diagnosis:** **Occupied.** This is a sophisticated liberal view. It accepts that we have special duties to those we coerce/cooperate with, but denies that this trumps the universal right to move or be aided.

  **6. Liberal Nationalism (Node 6A)**
  *   **View:** No priority on life-and-death, but "tie-breaking" permission on non-essentials.
  *   **Diagnosis:** **Occupied.** This is the most common "moderate" position. It satisfies the intuition that we care more about our own without violating the principle that all lives are equal.

  **7. Pluralist Cosmopolitanism (Node 7A)**
  *   **View:** State must be impartial; individuals need not be.
  *   **Diagnosis:** **Logically Possible but Rare.** This creates a schizophrenic moral agent. If the state represents us, and we have special duties, why shouldn't the state reflect that? This gap reflects a reluctance to impose personal biases through state coercion.

  **8. Strict Cosmopolitanism (Node 8B)**
  *   **View:** Impartiality everywhere, always.
  *   **Diagnosis:** **Occupied.** The philosophical baseline. It is rarely held in pure form by the general public but serves as the critical standard against which other views are measured.

  ***

  ### Meta-Analysis: Convergence and Conceptual Moves

  **The Convergence Problem**
  This tree cannot separate positions that differ in *metaphysical grounding* but converge on *policy*. For example, a **Utilitarian Cosmopolitan** (who believes helping foreigners yields more total happiness) and a **Rights-Based Cosmopolitan** (who believes foreigners have equal claims) will both answer "No" at Node 1. They end up in the same leaf despite disagreeing fundamentally on *why* (consequences vs. rights).
  *   **Diagnosis:** This does not undermine the tree. For a publication tracking public policy, the convergence *is* the story. The metaphysical disagreement matters less than the fact that both reject compatriot priority in emergencies. The tree is designed to sort policy outcomes, not philosophical genealogies.

  **Key Conceptual Move 1: Tie-Breaking vs. Weighting**
  Node 6 introduces a critical distinction often missed in standard debates: the difference between **distributive weighting** (compatriot lives count for *more*) and **tie-breaking permission** (compatriot lives count the *same*, but we can choose ours when stakes are equal).
  *   **Reasoning:** This is central because it allows readers to hold universalist moral commitments while acknowledging the psychological and political reality of associative bonds. It rescues "patriotism" from the charge of immorality without granting it the power to override human rights. Most readers who feel alienated by the "Nationalist vs. Cosmopolitan" binary actually occupy this node.

  **Key Conceptual Move 2: Institutional vs. Cultural Association**
  Nodes 3, 4, and 5 separate the *source* of the special claim.
  *   **Reasoning:** This is the most politically salient split in modern democracies. A voter might support compatriot priority (Node 1) but recoil at ethnic nationalism (Node 3). By forcing a choice between "History" and "Institutions," the tree reveals whether a reader's patriotism is backward-looking (preservation) or forward-looking (maintenance of cooperation). This distinguishes the **Strong Civic Nationalist** from the **Hybrid Institutional-Cosmopolitan**. The latter is a crucial, often unnamed demographic: those who believe shared laws create obligations, but not enough to close borders.

  **Why This Root Works**
  Starting with the Emergency Budget (Node 1) rather than "Do you love your country?" prevents readers from signaling virtue. It forces a trade-off. If a reader claims to be a cosmopolitan but chooses domestic priority at Node 1, the tree correctly identifies them as a **Liberal Nationalist** or **Civic Nationalist** in practice, regardless of their label. This exposes the gap between self-conception and moral commitment, which is the precise friction point your publication aims to track.

  By mapping these specific trade-offs, we move beyond the exhausted team-sport of "Globalism vs. Nationalism" and reveal the actual architecture of the reader's moral logic.
