  - what the practice actually does

  Basically, agencies now slap uncertainty bands on default probabilities. They mix historical default frequencies with expert judgement using a linear opinion pool. Instead of a single number, you get a range, presented as objective maths. It looks like admitting ignorance, but it's wrapped in quantitative modelling. They're trying to quantify the unquantifiable, giving a precise spread to something vague. It's risk management dressed as science. It really masks the subjective blend of data and opinion behind a current technical facade.

  - Keynes's likely line on the quantification bit

  He'd sniff at it immediately. For Keynes, there's a vast chasm between risk, where probabilities are known, and uncertainty, where they simply aren't. Sovereign defaults are unique historical events, not repeatable roulette wheels. Slapping a confidence interval on expert guesswork doesn't transform unmeasurable uncertainty into measurable risk; it just dresses uncertainty in a quantitative suit. He'd call it spurious quantification. The agencies might think they're showing humility, but Keynes would argue they're misleading investors into thinking the future is calculable. You can't legitimately derive a probability distribution from non-serialable events. It's not honest; it's a comforting illusion that masks the true absence of knowledge beneath a layer of false precision and mathematical respectability. Ultimately, it's a category error. This false comfort encourages dangerous leverage, pretending we know the odds when we are actually navigating blind through a fog of genuine unknowns that no model can ever truly capture or contain. He believed conventional behaviour in economic life fills the void.

  - where the weight-of-argument problem fits in

  This is where it gets proper interesting. Keynes distinguished probability (how likely) from weight (how much evidence supports the conclusion). This distinction is crucial for understanding market stability. If an investor tweaks their portfolio just because the band shifts, they're chasing probability while ignoring the weight of argument. A narrower band might look like more certainty, but if it's based on shaky expert consensus, the weight of argument is actually low. Conversely, more evidence can sometimes reduce weight if it reveals fundamental contradictions. Keynes would say rationality isn't just updating probabilities; it's assessing the solidity of the ground beneath them. Ignoring weight means treating all probabilities as equal, whether based on decades of data or a gut feeling. So, reacting to the band shift without questioning the evidence behind it isn't rational; it's treating a guess like a fact, missing that more data doesn't always mean more knowledge. He argued this point repeatedly.

  - bottom line — what hed probably advise

  Ignore the maths and watch the crowd. Investment rests on conventional judgement and animal spirits, not calculated returns. Be sceptical of models claiming to quantify sovereign uncertainty. Dont bet the farm on a probability band; assess the stability of the convention holding the market together. It holds until confidence breaks. Keep liquidity handy. When uncertainty is true, you cant calculate your way out. Trust mass psychology over false precision. Markets stay irrational longer than you stay solvent; dont rely on spurious bands. Protect your capital first, because when the convention shifts, the maths wont save you from the sudden loss of confidence that drives real crises.
