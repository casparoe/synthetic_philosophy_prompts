  Sarah: Only if she chooses naively. If she sees the cycle coming, she stays at Ash. No loss.

  Elias: But consider the vanishing pump. The broker shrinks the bribe to the bare minimum she'll accept. The total loss per cycle drops under a cent. Does irrationality vanish with the penny?

