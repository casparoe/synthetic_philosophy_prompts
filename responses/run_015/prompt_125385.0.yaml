prompt: |-
  I chair the investment and analytics group at a regional water utility. Three or four times a year my group is handed the same question in a new costume: before we commit to an expensive and hard-to-reverse capital decision — relining or replacing a stretch of trunk main, adding a treatment stage, relocating a pumping station — should we first buy more information? A condition survey, a short pilot, a hydraulic modelling study, a year of monitoring. Each costs real money, takes months, and freezes the decision while it runs, so the delay is itself part of the price.

  My colleagues reason about this with a slogan I have come to distrust: information is never bad for you. They gesture at the value-of-information theorem usually credited to I. J. Good — roughly, that an agent who maximises expected utility and revises by conditionalisation cannot be made worse off in expectation by a costless observation, since such an agent can always disregard the observation and take whichever act had maximal expected utility beforehand. From this they conclude that any study with a non-zero chance of changing our minds is worth commissioning and that the only open question is whether it is cheap enough.

  I do not think that conclusion follows, and I want a procedure rather than a debate. Please write a decision procedure my group can run on a proposal to buy information ahead of a capital decision, in the order the questions should be asked, with what counts as an adequate answer to each, where it stops with a no, and where it hands the question to a person because it is a question of values rather than fact. Constraints: my team has a good calibrated forecaster, one member who reliably over-reads a single striking data point, an engineering director who treats a pilot as a commitment to scale it up, and a board that must sign off and sometimes ignores what we give it. Nobody on the team will do algebra under time pressure, and there are usually no base rates for the specific asset under the specific street.

  In building the procedure, please deal with at least the following, since these are the places I suspect the slogan is doing work the theorem does not license. First, what has to be true of us, as a decision-making body, for the guarantee to apply at all — in particular whether we can commit in advance to a rule linking each possible result to an action, and whether our actual revision practice is close enough to conditionalisation for the argument to go through. Second, the cases where the value is genuinely zero: results that leave the decision unchanged, but also results that can only bind us through channels that are not the decision, such as a finding that would trigger a regulatory duty or a publication obligation, where the option of simply ignoring what we learn is not available to us. Third, how to value information that is not free and that arrives late, in a form people without formal training can actually run, and what to do when the inputs cannot be estimated. Fourth, the cases where the study changes what we are choosing between or who gets to choose, and where the design of the study determines the answer it will return. Fifth, the fact that waiting is itself a way of acquiring information.

  Then run the finished procedure on three proposals. One: a condition survey of an ageing trunk main before deciding whether to reline it or replace it outright. Two: a twelve-month pilot of a new treatment process before committing to full-scale construction, where the director will read the pilot as approval. Three, and this is the one I expect to dislike: a monitoring programme that would very likely detect a contaminant we cannot prevent and would then be legally obliged to remediate at great cost, where the study changes nothing about the physical outcome. If your procedure tells us not to commission that third study, I want to know whether that is the correct answer or whether the procedure is being used to license wilful ignorance, and I want the difference between expected value of information and whatever duty to inquire we might have stated explicitly.

  Finally, say plainly what the procedure cannot do, and which steps are judgment wearing a lab coat.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Chair of Investment and Analytics Group at a regional water utility.
      *   **Problem:** Recurrent decision: "Should we buy more information (survey, pilot, study) before a major capital decision?"
      *   **Current Culture:** Colleagues rely on the slogan "Information is never bad for you" (based on Good's Value of Information theorem).
      *   **User's Skepticism:** The slogan doesn't hold in practice due to costs, delays, organizational behavior, regulatory constraints, and commitment issues.
      *   **Goal:** A practical *decision procedure* (step-by-step checklist/flow) to evaluate proposals for buying information.
      *   **Constraints:**
          *   Team has a good calibrated forecaster.
          *   One member over-reads single data points.
          *   Engineering Director treats pilots as commitments to scale.
          *   Board must sign off and sometimes ignores analysis.
          *   No algebra under time pressure.
          *   No base rates for specific assets.
      *   **Required Content:**
          *   Address pre-commitment to action rules.
          *   Address actual revision practices (conditionalization).
          *   Address zero-value cases (decision unchanged vs. regulatory triggers).
          *   Address cost and delay (value of late information).
          *   Address study design bias (changing the choice set).
          *   Address waiting as information.
          *   Run the procedure on three specific cases (Trunk Main, Treatment Pilot, Contaminant Monitoring).
          *   Address the ethical dilemma of the third case (wilful ignorance vs. duty to inquire).
          *   State limitations and where judgment masquerades as fact.

  2.  **Deconstruct the "Information is Never Bad" Theorem vs. Reality:**

      *   *Theorem Assumptions:* Costless information, agent maximizes expected utility, agent updates via Bayes (conditionalization), agent can ignore information, action space remains constant.
      *   *Reality Violations:* Information costs money, information takes time (delay costs), organizational politics (Director treats pilot as commitment), regulatory traps (finding X forces Action Y regardless of utility), cognitive bias (over-reading data), board behavior (ignoring analysis).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* No algebra, clear stop/go points, handles human factors.
      *   *Structure:* A series of gates. If you fail a gate, stop (No). If you pass all, proceed to calculation (simplified).
      *   *Gate 1: The Commitment Test.* Can we actually ignore the result? (Addresses the Director/Regulatory issue).
      *   *Gate 2: The Actionability Test.* Will the result actually change the decision? (Addresses the "change our minds" claim).
      *   *Gate 3: The Time/Cost Test.* Is the cost of delay + study < benefit? (Addresses the "free" assumption).
      *   *Gate 4: The Design Test.* Is the study neutral? (Addresses bias/design determining answer).
      *   *Gate 5: The Waiting Test.* Can we get this info by just waiting?
      *   *Gate 6: The Human Factor.* Who interprets this? (Addresses the over-reader and the Board).

      *Refining for Constraints:* The user said "No algebra." So, instead of calculating Expected Value of Information (EVI), use a comparative heuristic. "Is the cost of the study less than the cost of making the wrong decision *multiplied by* the chance the study prevents it?" That's still algebra. Let's make it qualitative but rigorous. "Does the study cost less than the *regret* of the worst-case error it prevents?"
      *Better:* Use the Forecaster. They can estimate probabilities. The procedure should ask for *ranges*, not point estimates.
      *Crucial:* The prompt asks to identify where it hands off to a person for values. This needs to be explicit.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Trunk Main Survey):* Standard EVI case. Likely a "Yes" if the uncertainty is high and cost of error is high. Need to check if the survey actually distinguishes between reline/replace.
      *   *Case 2 (Treatment Pilot):* High risk of organizational bias (Director treats as commitment). This violates the "can ignore" assumption. Likely a "No" or "Redesign."
      *   *Case 3 (Contaminant Monitoring):* The ethical trap. Finding the contaminant forces expensive remediation. Not finding it leaves risk. If we don't look, we don't know, but we might be liable later. This is the "Duty to Inquire" vs. "EVI" clash. The procedure might say "No" based on pure utility, but ethics/law says "Yes." I need to make sure the procedure flags this as a *Values* handoff, not a calculation.

  5.  **Addressing the Specific Theoretical Points:**

      *   *Conditionalisation:* Are we actually Bayesian? Probably not. The procedure needs to ask: "Will we update our belief, or just seek confirmation?"
      *   *Regulatory Duty:* If finding X forces Action Y, the value of information is negative (it removes optionality).
      *   *Delay:* Time = Money + Risk.
      *   *Study Design:* Does the scope predetermine the outcome?

  6.  **Writing the Procedure (Drafting the Content):**

      *   *Title:* The "Optionality & Commitment" Protocol.
      *   *Format:* Numbered steps with "Stop" conditions.
      *   *Tone:* Professional, direct, acknowledging the political reality.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Calculate EVI." The prompt says "No algebra under time pressure." I need a heuristic.
      *Heuristic:* Compare the Study Cost + Delay Cost against the "Cost of Being Wrong" * "Chance of Changing Mind."
      *Actually, let's keep it even simpler.* Focus on the *conditions* under which the theorem holds. If conditions aren't met, the theorem doesn't apply.
      *Step 1: The Irreversibility Check.* (Can we ignore the result?)
      *Step 2: The Decision Link.* (Does result map to action?)
      *Step 3: The Cost of Waiting.* (Is delay expensive?)
      *Step 4: The Interpretation Risk.* (Who reads the data?)
      *Step 5: The Ethical Handoff.* (Duty to know vs. Value to know).

  7.  **Refining the Ethical Dilemma (Case 3):**

      *   If the procedure says "Don't look because it costs money to fix," that's wilful ignorance.
      *   The procedure must distinguish between *Instrumental Value* (does this help us choose?) and *Intrinsic/Regulatory Value* (are we required to know?).
      *   I need to explicitly state that EVI is for *decision making*, not *compliance* or *ethics*. If the duty to inquire exists, EVI is irrelevant.

  8.  **Final Review against Constraints:**

      *   *Calibrated Forecaster:* Use them for probability estimates in Step 2.
      *   *Over-reader:* Mitigate in Step 4 (Peer review of interpretation).
      *   *Engineering Director:* Mitigate in Step 1 (Pre-commitment agreement).
      *   *Board:* Mitigate in Step 5 (Clear presentation of values).
      *   *No Algebra:* Use comparative questions (Is A bigger than B?) rather than formulas.
      *   *Judgment in Lab Coat:* Explicitly list these at the end.

  9.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the validity of the skepticism.
      *   **The Procedure:** The core checklist.
      *   **Application:** Running the three cases.
      *   **The Ethical Question:** Addressing Case 3 specifically.
      *   **Limitations:** What the procedure can't do.

  10. **Polishing the Voice:** Needs to sound like it comes from a peer who understands utility theory but also bureaucracy. Avoid academic jargon where possible, but use it correctly where needed (e.g., "conditionalisation," "optionality").

  *(Self-Correction on Case 3)*: The prompt asks: "If your procedure tells us not to commission that third study, I want to know whether that is the correct answer or whether the procedure is being used to license wilful ignorance."
  *Answer:* The procedure *should* flag this as outside its scope. EVI calculates *instrumental* value. If there is a *moral/legal* duty, EVI is the wrong tool. I must ensure the procedure has a "Gate 0" for Legal/Ethical mandates. If a mandate exists, skip EVI. If no mandate, proceed to EVI. This distinguishes "wilful ignorance" (violating duty) from "prudent resource allocation" (no duty).

  11. **Final Polish:** Check the "Judgment wearing a lab coat" section. This is crucial. It admits where the procedure is subjective.

  (Proceed to generate response based on these thoughts.)
answer: |-
  ### The Optionality & Commitment Protocol

  You are correct to distrust the slogan. I. J. Good's theorem holds only under strict conditions: information must be costless, the agent must be able to ignore it, the agent must update beliefs rationally (conditionalisation), and the action space must remain stable. In a utility, information costs money, takes time, triggers regulatory obligations, and is interpreted by humans with incentives.

  Below is a decision procedure designed for your constraints. It requires no algebra, only comparative judgments and pre-commitments. It is designed to fail safe: if the organizational conditions for the theorem aren't met, the default is *do not buy the information* unless a higher duty compels it.

  ---

  ### Part 1: The Procedure

  **Pre-Condition:** This protocol applies only to information bought to *inform a specific capital decision*. It does not apply to statutory monitoring or regulatory compliance. (See Gate 0).

  **Gate 0: The Duty to Inquire (Values Handoff)**
  *   **Question:** Is there a legal, regulatory, or ethical mandate requiring us to know this specific fact, regardless of whether it changes our investment decision?
  *   **Adequate Answer:** A statement from Legal/Compliance confirming no statutory duty exists.
  *   **Stop Condition:** If **YES**, commission the study. Do not pass Go. This is not an investment decision; it is a compliance cost.
  *   **Pass Condition:** If **NO**, proceed to Gate 1.

  **Gate 1: The Irreversibility Test (Organizational Commitment)**
  *   **Question:** If the study returns a result that suggests *doing nothing* or *choosing the cheaper option*, can we credibly commit to that path?
  *   **Adequate Answer:** Written sign-off from the Engineering Director and Board Sponsor stating: "We agree to treat this study as exploratory. A positive pilot result does not guarantee funding for full scale."
  *   **Stop Condition:** If the Director treats the study as a *de facto* commitment to build (the "Sunk Cost Pilot"), stop. The information has negative value because it removes the option to stop.
  *   **Pass Condition:** Explicit agreement that the study is a *real option*, not a *down payment*.

  **Gate 2: The Actionability Test (Decision Linkage)**
  *   **Question:** Can we map every plausible outcome of the study to a specific decision *before* we start?
  *   **Adequate Answer:** A simple table: "If Result is X, we do Action A. If Result is Y, we do Action B."
  *   **Stop Condition:** If the team says, "We'll see what the data says," stop. This indicates you cannot conditionalise. You are seeking reassurance, not information.
  *   **Pass Condition:** A pre-agreed decision rule exists.

  **Gate 3: The Cost of Delay (Time Value)**
  *   **Question:** Does the cost of the study plus the cost of the delay exceed the cost of making the wrong decision today?
  *   **Adequate Answer:** A comparison of two numbers provided by the Forecaster:
      1.  **Study Price:** Cost of study + (Monthly cost of delay × Months of delay).
      2.  **Regret Cap:** The financial loss if we make the wrong capital choice *right now*.
  *   **Stop Condition:** If **Study Price > Regret Cap**, stop. You are paying more to avoid a mistake than the mistake would cost.
  *   **Pass Condition:** Study Price is significantly lower than Regret Cap.

  **Gate 4: The Interpretation Risk (Human Factors)**
  *   **Question:** Who interprets the result, and can they be blinded to the preferred outcome?
  *   **Adequate Answer:** Identification of the analyst. If the analyst is the "over-reader" or the project champion, a second reviewer (the Forecaster) must be assigned to validate the conclusion *before* it reaches the Director.
  *   **Stop Condition:** If the study design allows the champion to cherry-pick the "striking data point," stop.
  *   **Pass Condition:** Independent validation of the conclusion is guaranteed.

  **Gate 5: The Waiting Alternative (Passive Information)**
  *   **Question:** Can we get 80% of this information by waiting 6 months and observing current operations, rather than running a active study?
  *   **Adequate Answer:** A comparison of "Active Study Cost" vs. "Passive Monitoring Cost."
  *   **Stop Condition:** If Passive Monitoring yields similar clarity for less cost/risk, choose Passive.
  *   **Pass Condition:** Active study is necessary to resolve the specific uncertainty.

  **Final Handoff:** If all Gates are passed, the proposal goes to the Board with a explicit note: *"This study is purchased to preserve optionality, not to confirm the project. We have committed to stopping if Result Y occurs."*

  ---

  ### Part 2: Running the Procedure on Your Proposals

  #### Case 1: Condition Survey of Ageing Trunk Main
  *Decision: Reline vs. Replace.*

  *   **Gate 0 (Duty):** No legal mandate to survey before repair. **Pass.**
  *   **Gate 1 (Irreversibility):** Can we commit to *not* replacing if the survey says the pipe is sound? Yes. Engineering accepts that a good survey means we defer capital spend. **Pass.**
  *   **Gate 2 (Actionability):** Can we map results? Yes. "If corrosion > X mm, Replace. If < X mm, Reline." **Pass.**
  *   **Gate 3 (Cost of Delay):** Survey takes 2 months. Delay cost is low (pipe is stable). Regret Cap (Replacing a good pipe) is high ($10M+). Study Cost is low ($200k). **Pass.**
  *   **Gate 4 (Interpretation):** Survey data is physical (mm of loss). Hard to over-read. **Pass.**
  *   **Gate 5 (Waiting):** Waiting risks burst. Active survey is better. **Pass.**
  *   **Verdict:** **Commission the Survey.** This is a valid use of Value of Information. The uncertainty is high, the cost of error is high, and the organization can abide by the result.

  #### Case 2: Twelve-Month Treatment Pilot
  *Decision: Adopt new process vs. Stick with current.*
  *Constraint: Engineering Director treats pilot as commitment.*

  *   **Gate 0 (Duty):** No mandate. **Pass.**
  *   **Gate 1 (Irreversibility):** Can we commit to *abandoning* the process if the pilot fails? The Director views the pilot as approval to scale. He cannot credibly commit to stopping.
  *   **Stop Condition:** **FAIL.**
  *   **Verdict:** **Do not commission the pilot as designed.**
  *   **Remedy:** Renegotiate the governance. The pilot must be framed as a "Feasibility Test" with a distinct "Scale-Up Approval" gate that requires fresh sign-off. If the Director refuses, the pilot is a sunk cost trap. The information has negative value because it creates political momentum that overrides the data.

  #### Case 3: Contaminant Monitoring Programme
  *Decision: Monitor vs. Do Nothing.*
  *Constraint: Detection triggers legal obligation to remediate at great cost. Physical outcome (contamination) is unchanged by monitoring.*

  *   **Gate 0 (Duty):** **CRITICAL STOP.**
  *   **Analysis:** You stated detection creates a legal obligation to remediate. This implies a regulatory duty to know. If you *know*, you must act. If you *don't know*, you might be liable for negligence if it is discovered later that you *should have known*.
  *   **Verdict:** **This procedure cannot answer this.** This is not an investment optimization problem; it is a risk compliance problem.
  *   **Action:** Hand off to Legal/Board immediately. Do not run Gates 1-5.

  ---

  ### Part 3: The Ethical Dilemma (Case 3)

  You asked: *If the procedure tells us not to commission that third study, is that the correct answer or wilful ignorance?*

  If you run Case 3 through Gates 1-5 (ignoring Gate 0), the procedure will likely tell you **No**.
  *   **Why?** The information has negative *instrumental* value. It costs money to acquire. It costs money to act on. It does not change the physical reality (the water is contaminated either way). It only changes your *liability status*. From a pure Expected Value of Information (EVI) perspective, ignorance is preferable because it preserves the option to *not* spend the remediation money (until forced).

  **However, this is where the theorem licenses wilful ignorance.**
  Good's theorem assumes the agent is maximizing *utility*. In a public utility, "utility" includes public health and legal compliance, not just net present value (NPV).
  *   **The Distinction:** EVI measures the value of information for *making a choice*. It does not measure the value of information for *meeting a duty*.
  *   **The Correct Answer:** You must commission the study, not because it helps you decide, but because you are a fiduciary of public health. The "cost" of the study is not the price of the lab work; the cost is the inevitable remediation bill.
  *   **Procedure Fix:** This is why **Gate 0** exists. If there is a duty to inquire, EVI is irrelevant. If there is *no* legal duty, but a moral one, Gate 0 must be expanded to include "Ethical Mandate." If the Board decides the moral duty outweighs the cost, they must sign a waiver acknowledging they are accepting a financial loss to satisfy an ethical obligation. Do not use the Analytics Group to hide this behind a "Negative EVI" calculation.

  ### Part 4: Limitations and "Judgment in a Lab Coat"

  You asked for plain speech on what this procedure cannot do.

  1.  **It cannot fix broken governance.**
      *   *Where:* Gate 1 (Irreversibility).
      *   *The Lie:* If the Engineering Director signs the commitment but intends to ignore it, the procedure validates a lie. The "Written Sign-off" is judgment wearing a lab coat. It assumes signatures constrain behavior. They often do not.
      *   *Limit:* This procedure protects you from *asking* for the study; it does not protect you from the Director *using* the study as a weapon later.

  2.  **It cannot quantify "Regret" without base rates.**
      *   *Where:* Gate 3 (Cost of Delay).
      *   *The Lie:* You noted there are no base rates for specific assets. The Forecaster can give calibrated probabilities, but the "Cost of Being Wrong" is often a guess.
      *   *Limit:* If the Regret Cap is underestimated, you will reject valuable information. If overestimated, you will buy paralysis.

  3.  **It cannot prevent Board Ignorance.**
      *   *Where:* Final Handoff.
      *   *The Lie:* The procedure assumes the Board reads the note: *"We have committed to stopping if Result Y occurs."* You said they sometimes ignore what you give them.
      *   *Limit:* If the Board approves the study but has already decided to build regardless, you have purchased information you are forbidden to use. The procedure identifies this risk but cannot prevent it.

  4.  **It cannot resolve the "Duty to Inquire" without Legal.**
      *   *Where:* Gate 0.
      *   *The Lie:* Distinguishing between "Smart to know" and "Required to know" is a legal/ethical judgment, not an analytic one.
      *   *Limit:* If Legal says "No duty" but the public would be outraged, the Analytics Group becomes the scapegoat. This step must be owned by the Chair (you) or the Board, not the Forecaster.

  ### Summary for your Group

  Tell your colleagues this: **"Information is never bad for you" is true only for a solitary mind with no costs, no deadlines, and no bosses.** We are none of those things.

  We will use this protocol to ensure that when we buy information, we are buying **optionality**, not **confirmation**. If we cannot commit to acting on the news, we cannot afford to hear it. If we are required to hear it by law, we do not calculate its value; we pay the bill.

  Use Gate 0 to filter the ethical traps. Use Gate 1 to filter the political traps. Use Gate 3 to filter the economic traps. If a proposal survives all three, *then* you may calculate the value.
