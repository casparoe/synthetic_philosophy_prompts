answer: |-
  Here is the diagnosis, committed and specific.

  ### The Diagnosis: A Clash of Bedrock Intuitions About Normative Authority

  This is not a verbal dispute, nor is it a straightforward substantive disagreement about the metaphysics of the aggregates. It is a **framework dispute regarding the normative authority of metaphysics.**

  Specifically, the two camps hold incompatible bedrock intuitions about the relationship between *ontological correctness* and *soteriological efficacy*.

  *   **Camp A (The Reductionists)** operates on the intuition that **Insight requires Truth.** They believe suffering is sustained by cognitive error (believing in a self that isn't there). Therefore, to cure suffering, one must align one's ontology with the fundamental structure of reality. For them, *anatta* is a metaphysical correction. If you get the metaphysics wrong (even conventionally), your practice is built on sand. This is why they lean on Parfit: Parfit provides the metaphysical grounding that makes the "no-self" claim *true* in a way that licenses the normative shift in concern.
  *   **Camp B (The Two-Truths/Therapeutic)** operates on the intuition that **Practice requires Utility.** They believe suffering is sustained by *grasping*, regardless of the ontological status of the object grasped. For them, *anatta* is a tool to dismantle grasping. If treating the person as conventionally real stops suffering, it is "true" in the only sense that matters. For them, Camp A's demand for metaphysical grounding is itself a form of clinging (to views, *ditthi-upadana*).

  **Why arguments pass through:**
  When Camp A asks, "But what makes memory veridical?", they are asking for a truth-condition. Camp B hears, "What makes this tool useful?" and answers, "Causal continuity." Camp A hears "That's just convention, it's not *real* reality." Camp B hears "You are asking for a further fact where none is needed."

  Camp A thinks Camp B is being intellectually dishonest (hiding behind 'convention' to avoid hard metaphysical questions). Camp B thinks Camp A is reifying 'ultimate truth' into a new kind of self (a metaphysical essence of emptiness).

  **Confidence:** 85%.
  **What I would drop first:** If it could be demonstrated that Camp B explicitly relies on specific metaphysical claims about causation that *contradict* Camp A's reductionism (rather than just sidestepping them). If Camp B says, "Causation is ultimately real," then it becomes a substantive metaphysical dispute about the status of dependent origination, not just a framework clash.

  ### Evaluation of Your 'Thin' vs. 'Thick' Distinction

  Be honest: **Your distinction is doing less work than you think, and it misidentifies Camp B.**

  *   **Thin No-Self (Parfitian):** Identity doesn't matter; Relation R (psychological continuity) matters.
  *   **Thick No-Self (Your definition):** No diachronic unity at all, even conventional.

  Here is the problem: **Neither camp is 'Thick' by your definition.**
  *   **Camp A** accepts diachronic unity via causal/psychological continuity. They are Reductionists, not Eliminativists. They believe the *person* is a fiction, but the *process* is real and unified by causation.
  *   **Camp B** explicitly accepts diachronic unity at the conventional level. That is the whole point of the Two-Truths doctrine: karma, rebirth, and moral responsibility work *because* there is conventional continuity.

  The stalemate isn't between Thin and Thick. It is between **Reductionist Realism (Camp A)** and **Pragmatic Conventionalism (Camp B).**

  *   Camp A says: "The person is a fiction, but the aggregates are real. We must ground our practice in the real aggregates."
  *   Camp B says: "The person is real conventionally, and the aggregates are empty ultimately. We must not ground practice in *either* as ultimately existing."

  Your 'Thin/Thick' distinction is useful for mapping *metaphysical* positions, but the fight in your group is about *soteriological licensing*. Camp A thinks Thin No-Self *licenses* the end of suffering. Camp B thinks Thin No-Self is just another view to be dropped.

  **Verdict:** Keep the distinction for clarity, but rename the camps. Don't call Camp B 'Thick'. Call them 'Non-Foundationalists'. They aren't denying unity; they are denying the need for an *ultimate foundation* for that unity.

  ### Paths to Progress

  You asked what would count as progress. Here is the hierarchy of efficacy, from least to most promising.

  **1. Empirical Work (Neuroscience/Psychology): Low Relevance.**
  Do not bother bringing in split-brain cases or depersonalization literature.
  *   **Why:** Camp A will use it to say, "See, the self is fragmented!" Camp B will say, "See, the self-model is context-dependent!"
  *   Empirical data describes *mechanisms*. This dispute is about *normativity* and *ontology*. Neuroscience can show that the sense of self is constructed, but it cannot tell you whether that construction is "real enough" for karma or whether realizing its constructedness is sufficient for liberation. It feeds the descriptive side but leaves the normative deadlock intact.

  **2. Distinctions (Like Thin/Thick): Moderate Relevance.**
  Clarifying terms will stop the *verbal* component of the dispute, but it won't resolve the *framework* clash. It will help them realize they are answering different questions, but Camp A will still insist their question (Metaphysics) is the prerequisite for Camp B's question (Soteriology).

  **3. The Metaphysics of Convention: High Relevance.**
  This is the bottleneck. You need to force the group to debate **the ontological weight of "Conventional Truth."**
  *   **The Question:** Is "conventional truth" merely *instrumentally* useful (a lie that works), or is it *ontologically robust* within its domain?
  *   **Camp A** treats convention as lightweight: useful for talking, but not what's *really* happening.
  *   **Camp B** (if they are good Madhyamikas) treats convention as the *only* place where functionality exists. Emptiness *is* dependent origination.
  *   **Progress Condition:** If Camp B can articulate a view where "conventional persons" are not metaphysically deficient versions of "ultimate aggregates," but rather the *only* way aggregates appear, Camp A loses their leverage. Camp A needs "Ultimate Reality" to be the authority. If Camp B successfully argues that "Ultimate Reality" is empty of authority, the argument dissolves.

  **4. Soteriological Aims as Data: Highest Relevance.**
  This is the committed answer. **Progress requires putting the tradition's soteriological aims on the table as the primary data set.**
  *   Currently, Camp A treats Metaphysics as the Data and Soteriology as the Output.
  *   Camp B treats Soteriology as the Data and Metaphysics as the Output.
  *   **The Move:** Ask the group: *"What specific cognitive shift constitutes liberation in this context?"*
      *   If the answer is "Believing the correct proposition about aggregates," Camp A wins, but they must explain why arhats who didn't know Parfit were liberated.
      *   If the answer is "The cessation of clinging," Camp B wins, but they must explain why wrong views (like eternalism) are specifically cited as fetters.
  *   **Why this works:** It forces Camp A to admit that metaphysical precision might not be necessary for the goal (undermining their urgency). It forces Camp B to admit that some metaphysical views are more conducive to non-clinging than others (undermining their total relativism).

  ### Summary of the Commitment

  *   **Diagnosis:** Clash of Bedrock Intuitions (Metaphysical Authority vs. Soteriological Utility).
  *   **Confidence:** 85%.
  *   **Drop Condition:** If Camp B admits that holding a false metaphysical view *intrinsically* prevents liberation (not just via clinging), then it becomes a substantive metaphysical dispute.
  *   **Thin/Thick:** It's a good heuristic but mislabels Camp B. Camp B is not 'Thick' (eliminativist); they are 'Conventionalist'.
  *   **Best Path:** Debate the **Ontological Status of Convention**. Is convention a "consolation prize" (Camp A) or the "only game in town" (Camp B)?
  *   **Empirics:** Ignore them. They don't touch the normativity.

  The stalemate persists because Camp A thinks they are saving the Dharma from superstition, and Camp B thinks they are saving the Dharma from nihilism. Until they agree on whether the Dharma is primarily a *description of reality* or a *method for suffering's end*, they will keep speaking different languages. Force them to pick a primary goal. That is where the resolution lies.
