          *   Explain the Negative Heuristic: Blame the belt, not the core, when anomalies arise.

      *   **Case Study 1: Neptune (1846) - The Progressive Shift:**
          *   *Anomaly:* Uranus's orbit deviated from prediction.
          *   *Response:* Adams and Le Verrier hypothesised an outer planet.
          *   *Lakatosian Analysis:* This is an auxiliary hypothesis in the protective belt.
          *   *Why Progressive?* It yielded a *novel fact* (the position of a previously unseen planet). Galle confirmed it.
          *   *Result:* Corroboration of the programme.

      *   **Case Study 2: Vulcan (1850s–1870s) - The Degenerating Shift?:**
          *   *Anomaly:* Mercury's perihelion precession (43 arcseconds/century unaccounted for).
          *   *Response:* Le Verrier hypothesised an intra-Mercurial planet (Vulcan).
          *   *Lakatosian Analysis:* Another auxiliary hypothesis in the belt.
          *   *Why Degenerating?* It failed to predict novel facts consistently. 'Sightings' were unreliable. It was purely saving the phenomenon.
          *   *Result:* Eventual abandonment.

      *   **Critical Evaluation (The Core of the Essay):**
          *   *The Distinction:* Neptune = novel prediction confirmed. Vulcan = ad hoc adjustment without consistent confirmation.
          *   *The Problem of Timing:* Was Newtonianism *already* degenerating during the Vulcan episode?
