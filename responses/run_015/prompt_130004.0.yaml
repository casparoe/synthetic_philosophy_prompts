          *   **Style:** British English (spelling and usage).
          *   **Context:** A-level Philosophy of Science essay.

  2.  **Deconstruct Lakatos's MSRP:**
      *   *Research Programme:* A series of theories sharing a core.
      *   *Hard Core:* Irrefutable assumptions (by fiat of the proponents).
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, observation theories that protect the core.
      *   *Negative Heuristic:* Don't attack the core.
      *   *Positive Heuristic:* How to develop the belt.
      *   *Progressive Problem Shift:* Predicts novel facts, some corroborated.
      *   *Degenerating Problem Shift:* Only explains known anomalies via ad hoc adjustments, no novel predictions.

  3.  **Drafting - Section by Section:**

