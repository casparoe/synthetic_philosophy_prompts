          *   *Limitation 1 (Observational Error):* Vulcan wasn't just 'ad hoc'; observers *thought* they saw it. The failure was partly in the 'observational theory' part of the belt, not just the existence hypothesis. This blurs the line between 'saving the phenomenon' and 'empirical error'.
