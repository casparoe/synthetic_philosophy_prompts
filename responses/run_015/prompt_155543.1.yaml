      *   **Core Thesis:** The validity of a theory depends on its predictive accuracy, *not* the realism of its assumptions. Assumptions are necessarily simplified/abstract (unrealistic) to be useful.
      *   **Key Quote:** "All models are wrong but some are useful" is *not* Friedman. That is George Box (1976). This is a common misattribution.
      *   **Scope:** Friedman was specifically talking about *economics*, not necessarily weather/physics, though the instrumentalist view is often applied broader.
      *   **Nuance:** Friedman argues assumptions should be *sufficiently* accurate for the purpose, not that they can be *arbitrarily* false (e.g., zero weight air might be too extreme even for instrumentalism if it breaks down under slight condition changes).
      *   **Policy:** Friedman does suggest using predictive models for policy, but ignoring the mechanism entirely can be risky (Lucas Critique comes later, but even within Friedman's framework, structural stability matters).
      *   **"Inside the model its treated as true, which makes it not actually false":** This is a misunderstanding of instrumentalism. Instrumentalism says the assumption *is* false descriptively, but that doesn't matter for the theory's acceptance. It doesn't make it "true inside the model" in a way that negates the falsity; it just renders the falsity irrelevant.

