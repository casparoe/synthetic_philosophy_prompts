answer: |-
  The bundle of practices you describe does not presuppose a single, unified theory of value. Instead, it operates on a **partitioned commensurability**. It strictly presupposes that value is cardinal and comparable within specific administrative contexts (reparations, legal sentencing, toll verification) while simultaneously presupposing that value is incommensurable and unique within moral-memorial contexts. This is not a logical error in the practice; it is a functional dualism. The practice manages the tension by segregating the "sacred" register of memory from the "profane" register of bureaucracy.

  Regarding your gadget **(a) Ordinalism-plus**: This cannot run the whole bundle. You are correct to doubt it. Reparations (1) and toll disputes (3) are inherently cardinal activities. Money is a cardinal metric; you cannot allocate a finite fund based solely on an ordinal ranking of victims. If you know Victim A suffers more than Victim B, but not *how much* more, you cannot determine the exchange rate between "lost property" and "forced labor" required to exhaust a specific budget without arbitrary leftovers or deficits. Similarly, arguing over 5.7 vs. 6.0 million deaths (3) is meaningless on an ordinal view; both numbers occupy the same ordinal rank relative to smaller atrocities. The practice demands magnitudes, not just ordering. Ordinalism is *merely compatible* with the memory apparatus (2), but it is *ruled out* by the reparations and counting apparatus (1, 3).

  Regarding your gadget **(b) Decision density**: This tracks culpability, not atrocity magnitude. The practice uses this metric selectively. It is strictly presupposed in the legal focus on "most responsible" actors (4), where the density of ruin per agent determines prosecution priority. However, it is ignored in reparations (1) and memory (3), which focus on total victim count regardless of how many perpetrators were involved. A genocide executed by 100 people vs. 100,000 people is memorialized similarly if the victim count is the same, even though the decision density differs wildly. Therefore, decision density is a theory of *agent ranking*, not *atrocity ranking*. The practice tracks it only where legal liability is at stake, not where moral magnitude is assessed.

  The inconsistency you sense is real but managed. The taboo on ranking (2) protects the political legitimacy of specific memory communities; if atrocities were fully cardinalized across cases, memory would become a competition for resources rather than a sacred duty. However, this taboo is hypocritical relative to the internal quantification (1, 3). The practice strictly presupposes that *internal* quantification is valid while *external* quantification is forbidden. If you dropped the taboo, the memorial apparatus would lose its protective insulation against cost-effectiveness analysis. If you dropped the internal quantification, the legal and reparations apparatus would lose its distributive mechanism.

