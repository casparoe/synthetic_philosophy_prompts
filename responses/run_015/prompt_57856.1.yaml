  3.  **Drafting the Claims (Iterative Refinement):**

      *   *Claim 1 (The Platitude):* "Given infinite time and resources, a truthful argument is more consistent than a deceptive one." -> *Verdict:* Platitude. Doesn't help with 10-min judge.
      *   *Claim 2 (The Asymmetry):* "It is computationally easier to verify a truth than to generate a convincing lie." -> *Verdict:* Contentious. Often false in crypto/security (easy to hide, hard to find).
      *   *Claim 3 (The Protocol Reliance):* "The debate protocol (cross-exam, recursion) structurally prevents hiding information." -> *Verdict:* Defensible *if* protocol is perfect, but user's setup lacks cross-exam depth.
