prompt: |-
  I'm a novelist, and I'm stuck on a scene in my new book: a group of friends at a dinner party, one of them mentions a new restaraunt, and by the end of the evening everyone has agreed to go, even though a couple of them privetly thought it looked overrated. I want to get the psychology right, and I keep reading that this is an example of an information cascade, but I've also seen the exact same behavior called rational herding, and I'm not sure those are the same concept or whether I'm just using two names for one thing.

  Can you compare information cascades and rational herding as concepts? I'm interested in the mechanism-level differences: does a cascade strictly require people to move in sequence and rationally ignore their own private signals once the public history gets heavy enough, whereas herding can also happen in a simultaneous game or be driven by payoff considerations (like the venue actually being more fun the more people go — my scene might or might not have that)? And what does each one imply about how wrong the group can end up being — I recall something about cascades being fragile and sometimes forming on the basis of just a couple of early actions, and herding being associated with overreaction to news or volatility in the economics literature, but I'd like a cleaner side-by-side comparison. Ideally, end with a note on how I should tell which one my characters are actually exhibiting, since the scene hinges on whether the later compliers are rationally ignoring their own taste or just following for payoff reasons.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Novelist working on a dinner party scene.
      *   **Scenario:** Friends discuss a new restaurant. Some privately think it's overrated, but everyone agrees to go by the end.
      *   **Core Question:** What's the difference between "information cascades" and "rational herding"? Are they the same? What are the mechanism-level differences (sequence vs. simultaneous, private signals vs. payoff externalities)? What are the implications for group error/fragility?
      *   **Goal:** A clear side-by-side comparison to help decide which psychological/economic mechanism fits the characters' behavior for the scene.

  2.  **Deconstruct the Concepts:**

      *   **Information Cascade:**
          *   *Origin:* Bikhchandani, Hirshleifer, Welch (1992).
          *   *Mechanism:* Sequential decision-making. Person A acts, Person B sees A's act + their own private signal, Person C sees A & B's acts + their own signal.
          *   *Key Feature:* At a certain point, the public history (what others did) outweighs the private signal. It becomes *optimal* to ignore your own information and follow the crowd.
          *   *Payoffs:* Usually independent. My benefit from going to the restaurant doesn't depend on *you* going, just on whether the restaurant is actually good.
          *   *Fragility:* Highly fragile. A small amount of new public information can break the cascade. Can lead to wrong outcomes (everyone goes to a bad restaurant).

      *   **Rational Herding (Payoff Externalities/Network Effects):**
          *   *Origin:* Banerjee (1992), also general economic theory on externalities.
          *   *Mechanism:* Can be sequential or simultaneous.
          *   *Key Feature:* My payoff *depends* on your action. I go because *you* are going.
          *   *Payoffs:* Interdependent. The restaurant is better if my friends are there (social utility), or I go because I think you know something (informational), but "herding" often implies the payoff structure itself encourages conformity (e.g., safety in numbers, network effects).
          *   *Note on Terminology:* In economics, "herding" is often used as a broader umbrella term that *includes* information cascades, but sometimes it specifically refers to *payoff externalities* (network effects) or *reputational herding* (career concerns). The user is asking about the distinction, so I need to clarify the "Payoff Externality" vs. "Informational" distinction.
          *   *Fragility:* Less fragile than cascades if based on genuine network effects (the value is real because people are there). More fragile if based on reputational concerns.

  3.  **Address the Specific Confusion:**
      *   The user is right to be confused. In popular literature, they are often used interchangeably. In technical literature, "Information Cascade" is a specific *type* of herding behavior driven by *informational externalities*. "Rational Herding" is often the broader category, but sometimes specifically refers to *payoff externalities*.
      *   *Crucial Distinction:* Is the utility derived from the *object* (restaurant quality) based on inferred info? Or is the utility derived from the *action* (going together) based on social payoff?

  4.  **Drafting the Comparison (Mental Outline):**
      *   **Introduction:** Validate the confusion. They are related but distinct mechanisms.
      *   **Information Cascade:** Focus on sequentiality, ignoring private signals, informational externalities.
      *   **Rational Herding (Payoff/Network):** Focus on interdependent payoffs, "fun because friends are there."
      *   **Side-by-Side Table:** Mechanism, Sequence, Payoff Structure, Fragility/Error.
      *   **Application to the Scene:** How to write the dialogue/internal monologue to reflect one vs. the other.

  5.  **Refining the "Rational Herding" Definition:**
      *   I need to be careful here. In finance/econ, "Herding" is often the umbrella term. However, when contrasted with "Cascade," it usually implies *payoff externalities* (I benefit because you benefit) or *reputational herding* (I don't want to look stupid).
      *   *Banerjee (1992)* model is often called "herding" but is essentially an information cascade model.
      *   *Better distinction:* **Informational Cascades** (I follow because I think you know something) vs. **Payoff Externalities/Network Effects** (I follow because your presence adds value).
      *   *Wait, there's also Reputational Herding:* (I follow because I don't want to look like the outlier).
      *   *Decision:* I will treat "Information Cascade" as the strict Bayesian updating model (ignoring private info) and "Rational Herding" in this context as primarily *Payoff Externalities* (social utility) or *Reputational Concerns*, as that provides the clearest contrast for a novelist. I must acknowledge the terminological overlap.

  6.  **Developing the "Fragility" Aspect:**
      *   Cascades: Brittle. One person speaking up with strong conviction can shatter it.
      *   Herding (Payoff): Robust. If the value is "being together," speaking up doesn't change the value of being together.
      *   Herding (Reputational): Robust until social norms shift.

  7.  **Applying to the Novelist's Scene:**
      *   *Cascade:* Character A says "It's great." Character B thinks "Meh, reviews looked bad," but thinks "A has good taste, I must be wrong." Character C sees A and B going, ignores their own doubt.
      *   *Herding (Payoff):* Character A says "Let's go." Character B thinks "Food looks mediocre," but thinks "If everyone else is going, I'll have fun anyway."
      *   *Herding (Reputational):* Character B thinks "It's overrated," but doesn't want to be the "difficult one."

  8.  **Review against Constraints:**
