answer: |-
  You have hit on one of the most notorious terminological overlaps in behavioral economics. Even academics sometimes use these terms interchangeably, which is why you are finding conflicting definitions. However, for a novelist seeking psychological precision, the distinction is vital because the *internal monologue* of your characters differs significantly between the two.

  In short: **All information cascades are a form of rational herding, but not all rational herding is an information cascade.**

  Here is the mechanism-level breakdown you need to decide which dynamic is driving your dinner party.

  ### 1. Information Cascade (The "You Know Something I Don't" Mechanism)

  This is the strict technical definition derived from the seminal 1992 paper by Bikhchandani, Hirshleifer, and Welch.

  *   **The Mechanism:** Sequential decision-making based on **informational externalities**.
  *   **The Logic:** "I have my own private information (I read the reviews, I know my taste), but I see three other people deciding to go. I infer that their private information must be better than mine. Therefore, the rational choice is to ignore my own signal and follow them."
  *   **Sequence:** Strictly **sequential**. Person A decides, then Person B observes A, then Person C observes A and B. The order matters immensely.
  *   **Payoffs:** **Independent.** Whether the restaurant is good or bad does not depend on how many friends go. I want to eat good food regardless of your presence.
  *   **The Tipping Point:** Once the first two people make the same choice, the third person's private signal becomes mathematically irrelevant. The cascade "locks in."
  *   **Fragility:** **Extremely Fragile.** Because the later people are ignoring their private information, the group is walking on thin ice. If one person later says, "Actually, I only went because *you* went," the whole justification collapses. Cascades can form on very little information and lead the whole group to a objectively bad decision (the "overrated" restaurant).

  ### 2. Rational Herding via Payoff Externalities (The "It's More Fun Together" Mechanism)

  In economics, when "herding" is distinguished from "cascades," it usually refers to **payoff externalities** (network effects) or **reputational concerns**.

  *   **The Mechanism:** Decisions based on **interdependent utility**.
  *   **The Logic:** "I think the food is overrated. However, the value of this evening isn't just the food; it's the social experience. If everyone else goes, the utility of going up for me, even if the food is mediocre."
  *   **Sequence:** Can be **simultaneous or sequential**. I don't need to wait for you to decide to know that I want to be where you are.
  *   **Payoffs:** **Interdependent.** The value of the action increases *because* others are taking the action.
  *   **The Tipping Point:** There is no mathematical "lock-in" where private info becomes irrelevant. I still acknowledge the food is overrated; I just weigh the social benefit higher.
  *   **Fragility:** **Robust.** The group won't suddenly realize they made a mistake if one person speaks up. They *know* the food is overrated; they don't care. The decision holds firm because the social payoff is real.

  ### Side-by-Side Comparison

  | Feature | Information Cascade | Rational Herding (Payoff/Reputational) |
  | :--- | :--- | :--- |
  | **Why they comply** | They believe the crowd is *right* about the object (the restaurant). | They believe the crowd makes the *action* more valuable (the party). |
  | **Private Signal** | **Ignored/Overridden.** "I must be wrong about the reviews." | **Acknowledged but Outweighed.** "The reviews are right, but I don't care." |
  | **Sequence** | Requires sequence (A influences B influences C). | Can be simultaneous (we all want to be together). |
  | **Truth Value** | The group can be objectively wrong (bad restaurant). | The group is subjectively right (good time, regardless of food). |
  | **Fragility** | High. New public info breaks the spell. | Low. Social bonds sustain the decision. |
  | **Emotional Tone** | Doubt, uncertainty, deference to authority/taste. | Compromise, social cohesion, fear of exclusion (FOMO). |

  ### Implications for Group Error

  You mentioned fragility and volatility. Here is how that plays out in your narrative:

  **In an Information Cascade:**
  The group is prone to **mass error**. Because everyone after the second person stops contributing their private information to the "pool," the group fails to aggregate knowledge.
  *   *Narrative consequence:* They go to the restaurant, the food is terrible, and everyone feels betrayed. "How did we all think this was a good idea?" This leads to conflict later. "Why didn't you say you hated the reviews?" "Because you said you loved them!"

  **In Rational Herding:**
  The group is prone to **preference falsification**, but not necessarily error. They know the restaurant is overrated, but they go anyway.
  *   *Narrative consequence:* They go to the restaurant, the food is mediocre, and everyone shrugs. "Yeah, the food was blah, but it was fun catching up." This leads to a sense of cynicism or deep social bonding, but not confusion.

  ### How to Write the Scene: A Diagnostic Guide

  To decide which mechanism your characters are exhibiting, look at the **internal monologue** of the friend who thinks the restaurant is overrated (let's call him Mark).

  **Scenario A: Mark is in an Information Cascade**
  *   **Mark's Thought:** "I read the Yelp reviews, and they were lukewarm. But Sarah has such great taste, and she's already booked a table. And now John is saying yes too. Maybe the reviews were wrong? Maybe Sarah knows something about the chef I don't. I shouldn't risk looking difficult if I'm the only one doubting."
  *   **The Dialogue:** Mark hesitates. "I saw some mixed things online..." Then he sees Sarah's face. He backpedals. "But, uh, if you guys are set on it, I'm sure it's fine."
  *   **The Outcome:** Mark genuinely expects the food to be good. He has convinced himself.

  **Scenario B: Mark is in Rational Herding (Payoff/Reputational)**
  *   **Mark's Thought:** "I read the Yelp reviews, and they were lukewarm. The food is probably going to be dry. But if I say no, I'm not coming to dinner at all. I'd rather eat dry chicken than sit home alone. Plus, if I'm the only one vetoing it, I look like a jerk."
  *   **The Dialogue:** Mark is more blunt. "I heard the portions are small." Sarah says, "Who cares, we're getting appetizers." Mark shrugs. "Fair enough. Count me in."
  *   **The Outcome:** Mark expects the food to be bad. He is paying a "food tax" to buy "social time."

  ### Recommendation for Your Scene

  If you want **tension and eventual conflict**, use the **Information Cascade**.
  It creates a "Emperor's New Clothes" dynamic. The characters are lying to themselves. This allows for a scene later in the book where the cascade breaks—perhaps one character gets food poisoning or makes a snide comment that triggers the others to admit they never wanted to go. This highlights the fragility of the group's consensus.

  If you want **character depth and social realism**, use **Rational Herding**.
  This is more common in adult friendships. People rarely truly convince themselves a bad restaurant is good; they just prioritize the friendship over the food. This shows maturity (or resignation). It implies the characters value the *group* more than the *activity*.

  **The "Tell" in the Dialogue:**
  *   **Cascade:** Characters defend the restaurant's quality ("I'm sure the chef is amazing").
  *   **Herding:** Characters defend the *plan* ("It doesn't matter where we eat, just that we're out").

  If your scene hinges on whether they are **ignoring their taste** (Cascade) or **sacrificing their taste** (Herding), check Mark's internal narration. Does he change his mind about the restaurant's quality? If yes, it's a Cascade. If he keeps his opinion but goes anyway, it's Herding.
