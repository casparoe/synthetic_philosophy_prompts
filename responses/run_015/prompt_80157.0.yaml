prompt: |-
  You are a philosopher of practical reason who also designs seminar activities for upper-level undergraduates. I teach a 75-minute seminar on practical reason (about 18 students) and I need an in-class activity on the sunk cost fallacy, but not the standard "people irrationally keep spending" version, because a recent personal episode made me doubt my own teaching. I'd been renewing a failing research direction on the grounds that "the cost is sunk, ignore it," and only realized afterward that the real reason I couldn't let go was that the investment had changed who I was and what colleagues expected of me; separately, I'd been writing off a non-refundable deposit as pure waste when it was actually a live option I had bought. So the point I want the activity to make, which I don't think is stated cleanly in the usual treatments: the slogan "sunk costs are irrelevant" only holds if the value of your options is independent of how you got here, but a past expenditure can be (a) pure waste, (b) a live asset you purchased, or (c) a change in your identity or in others' expectations, and in (b) and (c) the cost is not really sunk, so the slogan misleads in both directions.

  Design the activity so students run into this themselves before it is named: give them a portfolio of ongoing projects to triage (continue or kill), where the prior costs are secretly of these three kinds, with rules, roles, a scoring scheme that needs no real money, a timeline for the 75 minutes, and a debrief that maps specific moments onto the three-way distinction and then opens the harder question of whether it is actually irrational to let history reshape your preferences, or whether that is just what preferences are. Tell me what will predictably go wrong the first time I run it, and be frank about which feature of that harder question the activity cannot reproduce and I must supply myself. Before the full design, start with a short brainstorm of the specific project scenarios you would use and why each one isolates exactly one of the three cost kinds.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of practical reason & seminar designer.
      *   **Context:** 75-minute seminar, ~18 upper-level undergraduates.
      *   **Topic:** Sunk Cost Fallacy (SCF), specifically challenging the standard "ignore sunk costs" slogan.
      *   **Instructor's Motivation:** Personal experience showed the standard view is incomplete. Past expenditure can be: (a) Pure Waste, (b) Live Asset (option purchased), or (c) Identity/Expectation Change. In (b) and (c), the cost isn't truly "sunk" in the normative sense because it alters the current value landscape.
      *   **Goal:** Design an in-class activity where students *discover* this distinction themselves before it's named.
      *   **Requirements:** Portfolio triage task, specific scenarios isolating the three cost kinds, rules/roles, scoring (no real money), 75-min timeline, debrief structure, prediction of failures, and limitation analysis.
      *   **Starting Point:** Brainstorm specific project scenarios.

  2.  **Deconstruct the Philosophical Nuance:**
      *   *Standard View:* Sunk costs are past, unrecoverable, and shouldn't influence future rational choice. Only marginal costs and benefits matter.
      *   *Instructor's Insight:*
          *   (a) **Pure Waste:** Money/time spent with zero residual value. (Standard SCF applies here).
          *   (b) **Live Asset:** Money spent bought a *capacity* or *option* that still exists. Ignoring it is actually irrational because you're ignoring an asset you own. (e.g., non-refundable deposit that secures a slot).
          *   (c) **Identity/Expectations:** Money/time spent changed *who you are* or *social standing*. Abandoning the project has a new cost (loss of reputation, identity crisis) that wasn't there before. The "sunk cost" created a *new* prospective cost of quitting.
      *   *The Trap:* Students (and the instructor) often conflate "sunk cost" (past expenditure) with "irrelevant information." The activity must show that past expenditure *generates* relevant present information in cases (b) and (c).

  3.  **Brainstorming Scenarios (The "Hook"):**
      *   *Constraint:* Need 3 scenarios, one for each category (Waste, Asset, Identity). They need to look superficially similar (all involve past investment + decision to continue/quit) so students don't spot the trick immediately.
      *   *Scenario A (Pure Waste):* Needs to be clearly unrecoverable with no residual benefit.
          *   *Idea:* Research on a disproven theory.
          *   *Refinement:* You spent $10k on equipment that broke and can't be fixed. Do you buy new equipment? The $10k is gone. The equipment is useless.
          *   *Better:* A "pilot study" that yielded unusable data due to a calibration error. The money is gone. The data is trash. Continuing means starting fresh.
      *   *Scenario B (Live Asset):* Needs to show the expenditure bought something *current*.
          *   *Idea:* Non-refundable deposit.
          *   *Refinement:* You paid a deposit to reserve a rare lab space. If you quit, you lose the deposit *and* the slot. If you continue, the deposit counts toward the total.
          *   *Better:* You bought a specialized software license (non-refundable). It expires in a year. Do you use it for a new project? The cost is sunk, but the *tool* is an asset. If you don't use it, you wasted the asset.
          *   *Best for Activity:* A "Option Fee." You paid to hold the right to publish in a special issue. The fee is non-refundable. If you submit, the fee is waived from the final cost. If you quit, you lose the fee *and* the publication slot.
      *   *Scenario C (Identity/Expectations):* Needs to show social/psychological stakes created by the investment.
          *   *Idea:* Everyone knows you're working on this.
          *   *Refinement:* You've told your department you're solving X. You've spent 2 years. If you quit, colleagues think you're flaky.
          *   *Better:* You are the lead on a collaborative grant. Your team relies on you. Quitting burns bridges. The "cost" of quitting is now higher because of the past investment (trust built).
      *   *Selection:*
          1.  **The Calibration Error (Waste):** Data is unusable. No residual value.
          2.  **The Reserved Slot (Asset):** Deposit secures a valuable future opportunity.
          3.  **The Public Promise (Identity):** Reputation capital invested; quitting incurs a *new* future cost (reputation loss).

  4.  **Designing the Activity Structure:**
      *   **Name:** "The Portfolio Triage."
      *   **Roles:** Project Managers (students) vs. The Board (Instructor/Scoring).
      *   **Mechanism:** Students get a dossier of 3 projects. They must choose to "Fund" or "Kill" each.
      *   **Scoring:** Points based on outcome. Crucially, the scoring rubric must reward recognizing the difference.
          *   If they kill Waste: Points.
          *   If they keep Asset: Points.
          *   If they keep Identity (or manage the exit): Points.
          *   *Wait, this is tricky.* If I tell them the scoring rules upfront, they game it. If I don't, they feel cheated.
          *   *Solution:* The scoring is revealed *after* the decision, but the "rationale" phase allows them to argue. Or, better: The scoring is based on a "Future Value" calculation they have to do.
          *   *Revised Mechanism:* They are given "Future Cost" and "Future Benefit" numbers. The "Sunk Cost" is listed separately. They must calculate Net Future Value.
          *   *The Twist:* In scenarios B and C, the "Sunk Cost" line item *modifies* the Future Cost/Benefit numbers if they look closely, but it's presented as historical data.
          *   *Actually, let's make it more experiential.* They make the choice based on intuition. Then we reveal the "Audit."
      *   **Timeline:**
          *   0-10: Intro & Rules.
          *   10-30: Individual/Group Decision (The Triage).
          *   30-50: The Reveal & Scoring (The Confusion).
          *   50-75: Debrief & Philosophy.

  5.  **Refining the Scenarios for the "Trap":**
      *   To make them *run into it themselves*, the text of the scenarios must be ambiguous enough that a standard "ignore sunk costs" heuristic leads to mixed results.
      *   *Scenario 1 (Waste):* "Project Alpha." Spent $50k. Equipment broken. Future cost $50k. Future benefit $80k. (Net +30). *Wait, if benefit > cost, they should continue regardless of sunk cost.*
      *   *Correction:* To test the Sunk Cost Fallacy, the *Future* math must suggest quitting, but the *Sunk* cost tempts them to stay (or vice versa).
      *   *Standard SCF:* Future Cost > Future Benefit, but Sunk Cost is high -> People Stay.
      *   *Instructor's Twist:*
          *   Case A (Waste): Future Cost > Benefit. Sunk Cost High. Rational choice: Quit. (Tests standard SCF).
          *   Case B (Asset): Future Cost > Benefit *unless* you count the asset you already own. If you quit, you lose the asset value. Rational choice: Continue (or utilize asset).
          *   Case C (Identity): Future Cost > Benefit *unless* you count reputation loss. Quitting costs reputation. Rational choice: Continue (or manage exit).
      *   *Let's simplify for a 75-min class.*
      *   Give them 3 projects. All look like "Money spent, project struggling."
      *   Ask: "Which do you save?" (Forced choice or rating).
      *   The "Sunk Cost" text will hide the clues.
      *   *Scenario 1 (The Pit):* Spent $100k on a prototype. It failed testing. To fix: $50k. Value if fixed: $40k. (Future Net: -$10k). Sunk: $100k. *Rational: Kill.*
      *   *Scenario 2 (The Key):* Spent $100k on a license. It works. To finish product: $50k. Value if finished: $40k. (Future Net: -$10k). *BUT* the license can be sold for $20k *only if* finished, or lost if quit. *Wait, that makes it an asset.*
      *   *Let's try the Instructor's specific examples:*
          1.  **Waste:** Research direction disproven. (No asset).
          2.  **Asset:** Non-refundable deposit that acts as credit. (Asset).
          3.  **Identity:** Colleagues expect completion. (Reputation cost).

      *   *Activity Design:* "The Venture Board." Students are a committee. They receive 3 memos. They must recommend "Terminate" or "Greenlight" for each.
      *   *The Catch:* The memos contain "Hidden Clauses" regarding the nature of the past spend.
      *   *Scoring:* After they decide, reveal the "Audit Report."
          *   Project 1: If you Greenlight, you lose points (Waste).
          *   Project 2: If you Terminate, you lose points (Asset forfeited).
          *   Project 3: If you Terminate, you lose points (Reputation hit).
      *   *Result:* Students who applied "Ignore Sunk Costs" blindly will get Project 1 right, but 2 and 3 wrong. Students who applied "Honor Commitment" blindly will get 2 and 3 right, but 1 wrong.
      *   *Goal:* Realize the rule isn't "Ignore" or "Honor," it's "Analyze the Residual."

  6.  **Drafting the Content:**
      *   *Intro:* Set the stage. You are the Board.
      *   *Memos:* Write them carefully.
      *   *Debrief:* Connect to the 3 categories.
      *   *Philosophical Pivot:* Is it irrational to let history shape preferences? (Ulysses contracts, integrity, etc.).

  7.  **Predicting Failures:**
      *   *Failure 1:* Students spot the trick too early. (Mitigation: Keep language dry/bureaucratic).
      *   *Failure 2:* Students get angry about "gotcha" scoring. (Mitigation: Frame scoring as "Outcome Simulation," not "Test Grades").
      *   *Failure 3:* The Identity case feels like a "new cost," not a "sunk cost." (This is the teaching point! The past spend *created* the new cost).
      *   *Limitation:* The activity can't simulate the *felt* weight of identity. It's hypothetical. The instructor must bridge that gap with their own story.

  8.  **Refining the "Harder Question":**
      *   The activity shows that history changes the *constraints* (assets) and *consequences* (reputation).
      *   The harder question: Does history change the *value*? (e.g., "I value this more because I worked on it" - Endowment Effect vs. Integrity).
      *   The activity handles (b) and (c) as *instrumental* rationality (assets/reputation). It doesn't fully capture *constitutive* rationality (identity as a good in itself). The instructor must supply this.

  9.  **Final Review against Constraints:**
      *   75 mins? Yes.
      *   18 students? Yes (groups of 3 or 6).
      *   No real money? Yes (points).
      *   Specific scenarios? Yes.
      *   Predict failures? Yes.
      *   Limitations? Yes.

  10. **Writing the Response:** (Self-Correction during drafting: Ensure the distinction between "Sunk Cost is an Asset" and "Sunk Cost created a Reputation Cost" is clear. In (b), the money bought a thing. In (c), the money/time bought a social fact.)

      *   *Scenario 1 (Waste):* "Project Chimera." Spent on tech that is now obsolete. No resale.
      *   *Scenario 2 (Asset):* "Project Vault." Spent on exclusive access rights. Access is still valid.
      *   *Scenario 3 (Identity):* "Project Beacon." Spent on public-facing initiative. Partnerships formed.

      *   *Scoring:*
          *   Chimera: Kill = +10. Keep = -10.
          *   Vault: Keep = +10. Kill = -10 (forfeit access).
          *   Beacon: Keep = +10. Kill = -10 (partnership penalty).
      *   *Blind Heuristic:* "Ignore Sunk Costs" -> Kill all 3. Score: +10, -10, -10. Total -10.
      *   *Blind Heuristic:* "Don't Waste Investment" -> Keep all 3. Score: -10, +10, +10. Total +10.
      *   *Wait, I want them to see the nuance.* If "Don't Waste" wins, they might think "Honor Sunk Costs" is the rule.
      *   *Adjustment:* Make the Future Math slightly favorable for Chimera if they ignore sunk costs? No, keep it standard SCF (Future Negative).
      *   *Better:* The point is that "Ignore Sunk Costs" yields a mixed bag. The rule "Ignore Sunk Costs" is the *name* of the error in 2 and 3.
      *   *Actually, the Instructor's point is:* In 2 and 3, the cost *isn't sunk*. So "Ignore Sunk Costs" is technically correct, but identifying what is sunk is the hard part.
      *   *Debrief Focus:* "You thought you were ignoring sunk costs in all three. But in 2 and 3, you were actually ignoring *current assets* and *future liabilities* created by the past."

      *   *Let's finalize the scoring:*
          *   If they apply "Ignore Past Spend" uniformly:
              *   Chimera: Correct (Kill).
              *   Vault: Incorrect (Kill asset).
              *   Beacon: Incorrect (Incure reputation cost).
          *   This perfectly illustrates the instructor's point: The slogan led to errors in 2/3 cases.

      *   *Timeline:*
          *   0-5: Setup.
          *   5-20: Group Work (Memos).
          *   20-35: Decision & Vote.
          *   35-50: The Audit (Scoring Reveal).
          *   50-75: Philosophical Debrief.

      *   *Failure Prediction:* Students will argue Case 3 is just a "future cost of quitting," not a sunk cost issue. *This is the winning argument.* I need to make sure the debrief validates this. The "Sunk Cost" label was the misdirection.

      *   *Limitation:* The activity treats Identity as Reputation (instrumental). It doesn't capture "I am a person who finishes things" (constitutive). Instructor must add this.

      *(Self-Correction complete. Proceeding to generate output.)*
answer: |-
  ### Part 1: Scenario Brainstorm & Rationale

  To make the distinction land, the scenarios must look superficially identical (Past Investment + Struggling Project + Decision Point) but differ in the *ontological status* of what that investment purchased.

  **1. Project CHIMERA (Pure Waste)**
  *   **The Setup:** You invested $100k developing a prototype sensor. A competitor just patented the underlying physics, making your sensor legally unsellable. The $100k is gone.
  *   **The Decision:** Spend another $50k to pivot the tech to a different market (Estimated Return: $40k) OR kill the project.
  *   **Why it isolates (a):** The past expenditure bought nothing transferable. The legal block means the investment has zero residual value. It is true "sunk" cost.
  *   **The Trap:** Students who feel "we've come too far to quit" will pivot and lose points. Students applying "ignore sunk costs" will look only at the future math ($50k cost vs $40k return) and kill it. **Correct Move: Kill.**

  **2. Project VAULT (Live Asset)**
  *   **The Setup:** You invested $100k as a non-refundable deposit to secure exclusive rights to a rare mining site for 5 years. The site is currently unprofitable due to low market prices. The $100k is "non-refundable."
  *   **The Decision:** Spend $50k to maintain the lease this year (Estimated Return: $40k) OR terminate the lease.
  *   **Why it isolates (b):** Superficially, the $100k is sunk (non-refundable). *However*, the expenditure purchased a *current property right*. If you terminate, you lose the asset (the lease) you already own. If you maintain, the $100k acts as a credit against the total lifetime cost.
  *   **The Trap:** Students applying "ignore sunk costs" see the $100k as gone and look at the marginal year ($50k cost vs $40k return) and terminate. But terminating forfeits the asset value (the lease itself has resale value or future upside). **Correct Move: Keep (Asset Retention).**

  **3. Project BEACON (Identity/Expectation)**
  *   **The Setup:** You invested $100k and two years as the public face of a collaborative consortium. The project is failing. The $100k is spent.
  *   **The Decision:** Spend $50k to try to salvage the final phase (Estimated Return: $40k) OR withdraw immediately.
  *   **Why it isolates (c):** The money is gone, but the *time and visibility* created a social fact. Withdrawing now triggers a "reputation penalty" (partners sue for breach of trust, future grants denied) valued at $30k. Continuing avoids this penalty.
  *   **The Trap:** Students applying "ignore sunk costs" see the $100k as irrelevant and look at the marginal math ($50k cost vs $40k return) and withdraw. But withdrawing incurs a *new* future cost created by the past investment. **Correct Move: Keep (Reputation Management).**

  ***

  ### Part 2: Activity Design – "The Portfolio Audit"

  **Time:** 75 Minutes
  **Students:** 18 (6 groups of 3)
  **Materials:** 3 Project Memos (printed), Decision Slips, "Audit Report" (revealed later).

  #### 1. Introduction & Roles (0:00–0:10)
  *   **Instructor:** "You are the Venture Board. Your job is not to be moral, but to be *efficient*. You have a portfolio of three ongoing projects. Each has consumed significant resources. Each is currently projected to lose money in the coming year."
  *   **The Rule:** "Standard economic rationality suggests you should ignore past expenditures (sunk costs) and decide based solely on *Future Cost* vs. *Future Benefit*. You will vote to **Fund** or **Kill** each project."
  *   **The Score:** "At the end, I will run an 'Audit.' Your group's score is the sum of the Net Value of your decisions. Highest score wins bragging rights (or small prize). There is no real money, but treat the points as utility."

  #### 2. The Triage (0:10–0:30)
  *   Distribute the three memos (Chimera, Vault, Beacon).
  *   **Crucial Design Feature:** The memos present the "Past Investment" in the exact same font and location. The "Future Cost" and "Future Benefit" are clearly listed. The *residual value* of the past investment (the asset in Vault, the reputation risk in Beacon) is buried in the "Notes" section or implied, not highlighted in the main calculation table.
  *   **Task:** Groups must agree on a Fund/Kill decision for all three. They must write a one-sentence justification for each using the phrase "sunk cost."
  *   **Instructor Role:** Circulate. If a group asks, "Does the deposit count as an asset?" answer neutrally: "The memo says it's non-refundable." (Let them wrestle with the definition).

  #### 3. The Vote & The Audit (0:30–0:50)
  *   **Vote:** Collect decision slips. Tally them on the board. (Predictably, many will apply the "Ignore Sunk Cost" heuristic uniformly and Kill all three, or Keep all three).
  *   **The Reveal:** Hand out the "Audit Report." This reveals the *actual* outcome of their choices.
      *   **Chimera:** If Killed: +10 pts. If Funded: -10 pts. (Standard SCF).
      *   **Vault:** If Funded: +10 pts. If Killed: -10 pts. (Because killing forfeited the lease asset).
      *   **Beacon:** If Funded: +10 pts. If Killed: -10 pts. (Because killing triggered the reputation penalty).
  *   **The Shock:** Groups who faithfully applied "Ignore Sunk Costs" (Kill all) will score **-10** (Right on Chimera, Wrong on Vault/Beacon). Groups who faithfully applied "Don't Waste Investment" (Keep all) will score **+10** (Wrong on Chimera, Right on Vault/Beacon).
  *   **Discussion:** Ask the "Kill All" groups: "You followed the textbook rule. Why did you lose points on Vault and Beacon?"

  #### 4. Philosophical Debrief (0:50–1:15)
  *   **Step 1: Map the Distinction.**
      *   Draw three columns on the board. Ask students to categorize the three projects based on *why* the points were awarded.
      *   Guide them to label them: (a) Waste, (b) Asset, (c) Constraint/Identity.
      *   **Key Insight:** "Sunk costs are irrelevant" is true, *but* determining what is actually 'sunk' requires analyzing what the past expenditure *bought*. In Vault, it bought a lease. In Beacon, it bought trust. In Chimera, it bought nothing.
  *   **Step 2: The Harder Question.**
      *   Pose the question: "In Project Beacon, was the reputation cost a 'future cost' or a 'sunk cost'?"
      *   *Technical answer:* It's a future cost *caused* by the past.
      *   *Philosophical pivot:* "But what if the reason you care about reputation isn't instrumental (future grants), but constitutive (you want to be the kind of person who finishes)? If your past investment changes *who you are*, is it irrational to let that identity dictate your choice?"
  *   **Step 3: Instructor's Confession.**
      *   This is where you insert your personal story. Explain how you treated your research direction as Chimera (Waste) when it was actually Beacon (Identity).
      *   "The slogan misled me because I didn't ask: *Did this cost change the landscape, or just drain my wallet?*"

  ***

  ### Part 3: Predictable Failures & Limitations

  **1. The "Gotcha" Backlash**
  *   **Prediction:** Students will feel cheated on Project Vault and Beacon. They will argue, "The memo said non-refundable! That means sunk!"
  *   **Mitigation:** Acknowledge this in the debrief. "The ambiguity was the point. In the real world, 'non-refundable' doesn't mean 'valueless.' The activity simulates the *cognitive error* of conflating cash-recoverability with value-recoverability."

  **2. The Instrumental Reduction of Identity**
  *   **Prediction:** In Project Beacon, students will treat the reputation hit purely as a financial penalty (lawsuits, lost grants).
  *   **Limitation:** The activity *cannot* simulate the internal, normative weight of integrity. It treats Identity as just another Future Cost column.
  *   **Instructor Supply:** You must explicitly state: "The activity models Identity as *Reputation* (external). But your own experience might be *Integrity* (internal). If you quit, you betray your past self. Is that irrational? Or is that how agents persist over time? The activity can't score that, but philosophy must ask it."

  **3. The "Rule" Search**
  *   **Prediction:** Students will try to formulate a new rule to replace "Ignore Sunk Costs," e.g., "Ignore sunk costs unless they are assets."
  *   **Correction:** Push them further. "The rule isn't about the cost. It's about the *option set*. The past expenditure is only irrelevant if it leaves your current options and their values identical to a world where you hadn't spent the money. If the past expenditure altered your options (Vault) or the value of those options (Beacon), it is not sunk in the normative sense."

  **4. Time Creep**
  *   **Prediction:** The "Audit" discussion will run long because students will want to argue the math of Project Vault.
  *   **Mitigation:** Keep the math simple. The Future Net is negative in all three cases (-$10k). The *only* variable is the hidden residual value/penalty. Don't let them recalculate the spreadsheet; force them to discuss the *classification* of the cost.

  ### Summary of the Philosophical Payoff
  This activity moves students from the **Heuristic** ("Ignore Sunk Costs") to the **Principle** ("Maximize Future Value") to the **Metaphysics** ("What exists in the present as a result of the past?"). It validates your personal insight: the error isn't usually in the math, but in the ontology of the costs. We think we are ignoring the past, but we are often ignoring present assets created by the past.
