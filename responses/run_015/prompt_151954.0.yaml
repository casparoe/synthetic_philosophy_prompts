answer: |-
  This is a sophisticated impasse that cuts to the heart of Moore's meta-ethics. You and your friend are not merely talking past one another; you have identified a genuine tension in *Principia Ethica* regarding the **supervenience base** of intrinsic value.

  Your disagreement is **substantive**, not verbal. It concerns whether the non-natural property of 'goodness' supervenes on a monadic mental event (your view) or on a state of affairs that essentially includes external relational facts (your friend's view). However, the stalemate persists because you are both partially right about Moore's text, but you are locating the "Organic Unity" in different places.

  Here is a diagnosis of the formal question at stake, a conceptual test to break the deadlock, and an assessment of whether progress is possible.

  ### 1. The Diagnosis: Supervenience and the Boundaries of the "Whole"

  The core of the dispute is not whether friendship is "relational" in a colloquial sense, but whether the **bearer of value** in Moore's system is strictly internal to the subject's consciousness.

  *   **Your Position (The Intentional View):** You argue that the value attaches to the *mental state* of the individual. The relational aspect is merely *intentional content* (i.e., I am thinking *about* a relation). For Moore, the non-natural property attaches to this complex mental state. This preserves the idea that value is located in consciousness.
  *   **Your Friend's Position (The Factive View):** Your friend argues that if the value of my friendship depends on the *actual* existence of your reciprocal affection (not just my belief in it), then the value bearer must include that external fact. If the value vanishes when your reciprocity vanishes (even if my mental state remains identical), then value does not supervene on my mental state alone.

  **The Formal Error:**
  Your friend is correct that Moore is not an atomist about *value composition* (due to the Doctrine of Organic Unities), but your friend risks conflating the *simplicity of the property* 'good' with the *simplicity of the bearer*.
  You are correct that Moore treats these as "mental states," but you risk conflating the *object of consciousness* with the *existence of that object*.

  Moore explicitly states that for the appreciation of beauty to be a great good, the beautiful object must **actually exist**. A hallucination of beauty is less valuable than the real thing. If this applies to friendship (which Moore implies it does), then the "Whole" that bears value is not just [My Consciousness], but [My Consciousness + The External Fact of Your Affection].

  ### 2. The Conceptual Test: The "False Belief" Scenario

  To move the debate, stop arguing about definitions of "relational" and apply the **Factivity Test**.

  **The Scenario:**
  > Consider Agent A. A feels deep affection for B and sincerely believes B reciprocates.
  > *   **Case 1:** B actually loves A.
  > *   **Case 2:** B secretly hates A (A is unaware).
  >
  > In both cases, A's *internal monadic mental state* is identical.

  **The Question for Moore:**
  Does Case 1 contain *more intrinsic good* than Case 2?

  *   **If the answer is YES:** Your friend wins. The intrinsic value depends on a fact external to A's consciousness. Therefore, the bearer of value is a dyadic state of affairs, not a monadic mental state. Moore's ontology must accommodate relational facts as part of the value-bearing whole.
  *   **If the answer is NO:** You win. The value is entirely internal to A's consciousness. The "reciprocity" is just a feature of the phenomenological content.
  *   **The Moorean Textual Reality:** Moore almost certainly answers **YES**. In *Principia Ethica* (§113 and §152), he emphasizes that the *truth* of the object of consciousness contributes to the value of the whole. He distinguishes between the consciousness of a beautiful thing and the beautiful thing itself, arguing the *whole* (Consciousness + Object) is the primary good.

  ### 3. The Resolution: "Complex Monads" vs. "Relational Wholes"

  The progress you can expect lies in refining the description of the **Organic Unity**.

  You should concede to your friend that Moore does **not** treat friendship as a purely monadic mental state in the strict metaphysical sense. If the external reciprocity is required for the full intrinsic value, then the "Whole" is indeed relational.

  However, you should counter that this does **not** undermine Moore's non-naturalism or force him into the pluralism he rejects. Here is the distinction that resolves the tension:

  **Distinction: The Locus of Supervenience vs. The Structure of the Base**
  Moore can maintain that 'good' is a simple, non-natural property (anti-pluralism about the *property*) while admitting that it supervenes on complex, relational states of affairs (holism about the *base*).

  *   **Your Friend's Fear:** They think admitting a relational base forces Moore to admit a *relational property* of goodness (e.g., "good-for-us" vs. "good-for-me").
  *   **Your Defense:** You can argue that the property remains monadic and simple ('good'), even if the *substrate* is a complex relational unity. The "Organic Unity" is the mechanism that allows Moore to swallow relational facts without making 'good' a relational property.

  ### 4. Should You Expect Progress?

  Yes, but only if you shift the ground from **Ontology of Mind** to **Ontology of Value Bearers**.

  **Proposed Truce/Path Forward:**
  1.  **Acknowledge the Friend's Point:** Admit that for Moore, the *ideal* whole of friendship includes the external fact of reciprocity. It is not merely two parallel monadic states.
  2.  **Hold Your Ground on Non-Naturalism:** Argue that this does not make 'good' a relational property. The non-natural property attaches to the *Whole* (the situation), not the *Relation* itself. The relation is part of the *conditions* for the property's instantiation, not the property itself.
  3.  **Reframe the "Atomism" Charge:** Moore was never an atomist about value bearers (that is the whole point of Organic Unities). He was an atomist about the *property* 'good'. Your friend is attacking a straw man of Moore's ontology.

  **The Winning Move:**
  Ask your friend: *"If Moore admits the Whole is relational, does that make the property 'good' relational?"*
  If they say **Yes**, they misunderstand Moore's non-naturalism (properties are distinct from their bases).
  If they say **No**, then they must concede that Moore's framework *can* accommodate value-constitutive reciprocity without collapsing into pluralism.

  The disagreement is substantive, but it is resolvable by clarifying that **Organic Unities are designed precisely to solve this problem.** They allow the value of a whole to differ from the sum of its parts, permitting external relations to be essential to the value without making 'good' itself a relation.
