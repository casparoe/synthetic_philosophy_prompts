      *   *Friendship/Affection:* Moore explicitly discusses "the pleasures of human intercourse" and "the appreciation of beautiful objects." He emphasizes the *consciousness* of the relation.
      *   *Atomism vs. Holism:* Moore is often read as an atomist about *value bearers* (states of consciousness), but his doctrine of Organic Unities introduces a strong holism about *value composition*.
      *   *Relationality:* For Moore, the *object* of consciousness can be relational (e.g., "that my friend loves me"), but the *bearer* of value is the conscious state itself.

