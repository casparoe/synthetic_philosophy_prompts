answer: |-
  - **The concrete scenario**
  Agent A exists in a universe constrained to strictly polynomial time computation. Agent B inhabits a richer reality allowing exponential computation. Both value a multiverse bridge granting exotic physics, requiring simultaneous resource allocation. Causal contact is impossible; coordination relies solely on logical correlation. B can perfectly simulate A's source code to predict its move, but A lacks capacity to simulate B, perceiving B only as an opaque function. Both know this absolute asymmetry. They must ultimately independently decide to contribute resources, betting on the other's logical output without verification, knowing the bridge fails if either defects. The high cost is significant, but reward requires mutual success. A trusts logic; B trusts simulation. The bridge enables resource exchange across causal boundaries.

  - **The symmetry-breaking worry**
  Standard superrationality assumes symmetric reasoning: I cooperate because you reason like me. Here, B calculates A's move. B treats A as a fixed constant, not a peer. If B gains more by defecting while A cooperates, B defects, knowing A cannot anticipate this. A might try to precommit, but cannot verify B's precommitment. The logical link is one-way. Acausal trade requires mutual transparency for a handshake. Without it, B becomes a predictor, not a partner. Optimization against a predictable environment replaces trade. Consequently, B maximizes utility without regard for A's welfare. This undermines the reciprocal foundations of such acausal deals.

  - **Your bottom line on whether this kills superrationality or just modifies it**
  This doesn't kill superrationality but restricts its domain. Superrationality requires logical equivalence. Here, the computability gap breaks the equivalence class. B treats A as a subroutine, not a peer. Cooperation becomes the only viable output B wants to simulate. This is logical blackmail, not trade. Superrationality survives only if A credibly constrains its source code to punish asymmetry, forcing B to simulate cooperation or get nothing. It modifies theory into hierarchical logical dependency. A must signal commitment before B simulates.
