      *   This is the hallmark of the "Transformationist" school (Peter Brown, etc.) vs. the "Catastrophist" or "Decline and Fall" school (Gibbon, older scholarship, some modern materialists).
      *   I need to categorize the claims by strength.
      *   *Weak:* Semantic/Stylistic (don't use loaded language).
      *   *Medium:* Institutional/Cultural continuity (Church, law, identity).
      *   *Strong:* Material/Economic continuity (no drop in living standards, trade, complexity).

  3.  **Drafting the Categories (The Theses):**

      *   *Thesis 1: The Semantic/Periodization Claim.* (Weakest). It's about how we label history. "Fall" implies suddenness; "Transformation" implies process.
      *   *Thesis 2: The Institutional/Cultural Continuity Claim.* (Medium). The Senate, the Church, Roman law, and identity survived even if the Emperor in the West didn't.
      *   *Thesis 3: The Material/Economic Continuity Claim.* (Strongest). GDP, trade volume, urbanization, diet didn't crash. This is the one most vulnerable to scientific data.

  4.  **Evaluating Against Literature (Climate, Lead, Archaeology):**
      *   *Transformationist Lit:* Peter Brown (*The World of Late Antiquity*), Walter Goffart. Focus on culture, religion, elite adaptation.
