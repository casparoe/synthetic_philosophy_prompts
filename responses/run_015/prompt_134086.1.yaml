      *   **Topic:** "Rome didn't fall, it transformed."
      *   **Task:** Break down the precise theses behind this phrase (from weak/semantic to strong/empirical). Evaluate each against current scholarship (climate, lead, transformationist literature). Explain how the phrase is used to dismiss invasion-based explanations. Distinguish "faded" vs. "collapsed."
