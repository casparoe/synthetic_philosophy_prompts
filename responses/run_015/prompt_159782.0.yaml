          1.  *Alpha-interpolation:* SSA/SIA are endpoints of a parameterized family ($P \propto N^\alpha$). Fight is over $\alpha$.
          2.  *Indexical Evidence:* Dispute is about whether centered propositions belong in likelihoods at all.
          3.  *Priors/Measure Problem:* Dispute is an artifact of bad/improper priors; SIA's infinite universe push is swamped by the measure problem anyway.
      *   **User's Hypothesis:** Stacked disagreements (formal update rule + reference class + default priors).
      *   **Task:** Diagnose the nature of the dispute (verbal, substantive, underdetermined, clash over data, prior standards, or two questions sharing a name).
