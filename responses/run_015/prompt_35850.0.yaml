answer: |-
  Here is a specification of the desiderata for a decision rule adequate to handle prospects with undefined expectations, calibrated to the St. Petersburg and Pasadena cases.

  ### I. The Desiderata

  **1. Finite Expectation Alignment (FEA)**
  *   **Specification:** For any two prospects $X$ and $Y$, if the Lebesgue integrals $E[X]$ and $E[Y]$ exist and are finite, the rule must rank $X \succeq Y$ if and only if $E[X] \ge E[Y]$.
  *   **Motivating Case:** Standard decision theory works. If you offer me a choice between a guaranteed \$10 and a coin flip for \$20 (EV = \$10), the rule should not prefer the coin flip on non-expected-value grounds. If a rule diverges from standard EV in cases where EV is well-behaved, it is not a *repair* of decision theory; it is a replacement.
  *   **Status:** **Non-negotiable.** A rule that violates this ceases to be an extension of expected utility theory and becomes a distinct normative system.

  **2. Statewise Dominance (SD)**
  *   **Specification:** If $X(\omega) \ge Y(\omega)$ for all states $\omega \in \Omega$, then $X \succeq Y$. If the inequality is strict for at least one state with non-zero probability, $X \succ Y$.
  *   **Motivating Case:** Consider a modified Pasadena game $P$ and a prospect $P^+$ that pays exactly \$1 more than $P$ in every possible outcome (every toss $n$). It is irrational to prefer $P$ to $P^+$, or to be indifferent between them.
  *   **Status:** **Non-negotiable.** This is the minimal condition of instrumental rationality. Violating dominance implies the agent is paying to lose.

  **3. Partition Invariance (PI)**
  *   **Specification:** The value assigned to a prospect must not depend on the indexing or partitioning of the sample space $\Omega$. If two descriptions of a game are isomorphic (representing the same physical probabilities and payoffs) but utilize different indexings of the outcomes, the rule must yield the same verdict.
  *   **Motivating Case:** **The Pasadena Game.** The payoff series is $\sum \frac{(-1)^{n+1}}{n}$. By the Riemann Rearrangement Theorem, this conditionally convergent series can be reordered to sum to any real number $L$, or to diverge. If the decision rule relies on the "natural" order of tosses ($n=1, 2, 3...$), it assigns a value (e.g., $\ln 2$). But the physical game does not care about the index $n$; it only cares about the probability-payoff pairs. A rule that values the game at $\ln 2$ in one partition and \$1,000,000 in an isomorphic rearrangement is metaphysically unstable.
  *   **Status:** **Non-negotiable.** While some "camp" preferences tolerate order-dependence (see below), a robust decision rule cannot depend on arbitrary mathematical labeling of states.

  **4. Decisiveness / Non-Skepticism (DEC)**
  *   **Specification:** For any pair of prospects $X, Y$ (including those with undefined expectations), the rule must deliver a verdict: either $X \succ Y$, $Y \succ X$, or $X \sim Y$. Specifically, it must determine an entry fee for the Pasadena game.
  *   **Motivating Case:** Agents must act. If you encounter a Pasadena-like opportunity in the real world (e.g., a complex financial derivative with conditionally convergent returns), "undefined" is not an actionable output. You need to know whether to buy at price \$1.
  *   **Status:** **Camp Preference.** "Skeptics" (e.g., proponents of *incomparability*) argue that undefined expectations genuinely render options incomparable. "Meliorists" (e.g., proponents of *weak expectations*) argue rationality requires a verdict. For a *decision rule* intended to guide action, this is usually treated as a requirement, but it is the first to be dropped in impossibility proofs.

  **5. General Comparability (GC)**
  *   **Specification:** The rule must rank two undefined-expectation prospects against each other, not just against a sure sum.
  *   **Motivating Case:** Choose between the St. Petersburg game (divergent to $+\infty$) and a "Super St. Petersburg" game (divergent faster). A rule that only says "both are undefined" fails to distinguish them, even though one is strictly better in terms of growth rate.
  *   **Status:** **Non-negotiable.** A rule that cannot compare two risky prospects is functionally useless for choice under uncertainty.

  **6. Temporal/Sequential Invariance (TSI)**
  *   **Specification:** The value of a prospect should not depend on the temporal order in which payoffs are realized, provided the probability-payoff structure remains constant.
  *   **Motivating Case:** A sequential Pasadena game where payoffs are revealed one by one versus a lump-sum revelation. If the expectation is undefined, some truncation rules might value the sequential version differently based on when the agent is allowed to stop. The value of the *prospect* should be intrinsic to the distribution, not the revelation schedule.
  *   **Status:** **Preference.** This is often subsumed by Partition Invariance, but in dynamic choice contexts, it imposes stricter constraints on updating rules.

  ---

  ### II. The Impossibility Result

  You suspected that **Finite Expectation Alignment (FEA)** and **Partition Invariance (PI)** are jointly unsatisfiable once conditionally convergent expectations are admitted.

  **Your suspicion is correct in spirit, but the tension is more precisely located.**

  Strictly speaking, FEA applies only to *Lebesgue integrable* functions (absolutely convergent series). The Pasadena game is *not* Lebesgue integrable. Therefore, a rule could technically satisfy FEA (by using EV where defined) and PI (by refusing to assign a value to Pasadena) without contradiction.

  **The genuine impossibility arises when you add Decisiveness (DEC).**

  The triad that is jointly unsatisfiable is:
  1.  **Partition Invariance (PI)**
  2.  **Decisiveness on Conditionally Convergent Series (DEC)**
  3.  **Summation Stability (SS)**: *The desire that the rule recover the "natural sum" ($\ln 2$) for the Pasadena game.*

  **Why:**
  If you require **DEC**, you must assign a real value $V$ to the Pasadena game.
  If you require **SS** (which is the natural extension of FEA to the limit), you want $V = \ln 2$ (the sum in natural order).
  But if you require **PI**, the value must be invariant under rearrangement of the terms.
  Since the series is conditionally convergent, there exists a rearrangement that sums to $V' \neq \ln 2$.
  If your rule respects the arithmetic of the series (SS), it must output $V'$ for the rearranged game.
  If your rule respects PI, it must output $V$ for the rearranged game.
  Contradiction.

  **Verdict on your suspicion:** You identified the friction correctly. "Agreement with finite-case EV" implies a commitment to standard summation methods. Standard summation methods are order-dependent for conditionally convergent series. Partition Invariance requires order-independence. **You cannot have a rule that extends standard EV to conditionally convergent series while maintaining Partition Invariance.** One must go. Usually, **Summation Stability** is the casualty; the rule must assign a value that is *not* the natural sum, or admit that no value exists.

  ---

  ### III. The "Killer" Desideratum

  The single requirement that eliminates the most familiar candidate rules is **Partition Invariance (PI)**.

  **Why it is the filter:**
  Most proposed repairs for undefined expectations are essentially *summation methods* designed to tame divergent or conditionally convergent series.
  *   **Truncated Expectations:** (Take the limit of EV as $n \to \infty$). **Fails PI.** The limit depends entirely on the ordering of the terms.
  *   **Cesàro Summation / Abel Summation:** **Fails PI.** These regularize the series but remain sensitive to the indexing of the terms in the context of decision prospects.
  *   **Natural Ordering EV:** (Just sum them as they come). **Fails PI.** Explicitly violates Riemann Rearrangement.
  *   **Dominance-Only Rules:** **Passes PI**, but fails **Decisiveness**. (This is why Skepticism is the only PI-compatible position if you reject non-standard values).
  *   **Easwaran's "Weak Expectation" (2008):** This is the strongest contender. It defines value based on the convergence of the *average* of $n$ independent plays (Law of Large Numbers). It largely respects PI because it relies on the distribution rather than the index, but it faces challenges with **Statewise Dominance** in certain constructed cases (the "Pasadena Paradox" variants).

  **Conclusion:**
  If you enforce **Partition Invariance**, you eliminate almost every rule that attempts to assign a specific real number to the Pasadena game based on its payoff series structure. You are left with either **Skepticism** (no verdict) or **Distribution-Based Rules** (like Weak Expectation) that ignore the specific indexing of outcomes. If your goal is a decision rule that *acts*, Partition Invariance is the constraint that forces you to abandon the intuition that the "natural order" of the game matters.
