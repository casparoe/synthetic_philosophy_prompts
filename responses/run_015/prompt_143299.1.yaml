  2. king arthur. people point to some romano-british leader or battle lists, but there's no contemporary record and the first real texts are centuries later. verdict: still legend, maybe with a tiny unprovable kernel.

  3. the exodus narrative. there's the merneptah stele mentioning israel in canaan, and some scholars compare it to the hyksos expulsion, but i don't think that saves the mass-migration story. verdict: foundation legend, not history, despite some distant echoes.

