  Here is the machinery behind Mara's verdicts, the alternative rule that fits her data but flips the new case, and the breakdown of where her position actually stands.

  ### 1. Mara's Machinery: *Fuzzy Categorical Prioritarianism*

  Mara is not running a single linear equation. She is running a **categorical system with a dispersion discount.**

  *   **The Rule:** Harms are grouped into qualitative "buckets" (e.g., Annoyances, Minor Injuries, Major Injuries, Torture).
      1.  **Lexical Priority:** A harm in a higher bucket always outweighs any number of harms in a lower bucket. (This handles Verdict 1: Specks never equal Torture).
      2.  **Intra-Bucket Aggregation:** Within the same bucket, numbers count. (This handles Verdict 2: 10 fingers > 1 finger).
      3.  **Severity Trumps Numbers:** If harms are in different buckets, the higher bucket wins, regardless of the headcount in the lower one. (This handles Verdict 3: 1 Hand > 10 Fingers).
      4.  **Fuzzy Boundaries:** The lines between buckets are not sharp mathematical thresholds but qualitative shifts (e.g., "life-altering" vs. "temporary"). This allows her to claim "no magic threshold" while still treating categories as distinct. (This handles Verdict 4).
      5.  **Concentration Penalty:** Harm concentrated in one life is morally heavier than the same harm distributed. (This handles Verdict 5: 1M specks in one eye crosses into a higher bucket of "cumulative injury," whereas distributed specks stay in the "annoyance" bucket).

  *   **Prediction on the New Case:**
