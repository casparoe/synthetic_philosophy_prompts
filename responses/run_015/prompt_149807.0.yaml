  ### 2. The Alternative Rule: *Threshold Utilitarianism*

  This rule fits all five of her verdicts perfectly but yields the opposite result on the new case.

  *   **The Rule:** Moral value is the sum of harms, *but* harms below a certain threshold of intensity contribute zero moral weight. Once a harm crosses the threshold, it counts linearly. Concentration only matters insofar as it helps individual harms cross the threshold.
