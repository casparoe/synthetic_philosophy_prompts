          4.  **Vocabulary Hazard Report:** Identify where the user's video assumptions distort the phenomenon (stored frames, timecode, clean difference between event/record, rollback capability).
      *   **Tone:** Honest, technical, direct, respectful of the user's expertise, acknowledging the limits of the analogy.

  2.  **Deconstruct the Philosophical Problem (Color Phi Phenomenon):**
