          *   *Result:* It's a choice between implementations with identical output. Engineering cares about *how* it's done (debugging, latency). Philosophy cares because it implies different things about "reality." But empirically, it's a wash.

      *   *Q3: Latency vs. Filling In.*
          *   *Translation:* As-live delay. We delay the feed 7 seconds for censorship. The viewer sees the past.
          *   *User's Hypothesis:* Is "filling in" just delay?
