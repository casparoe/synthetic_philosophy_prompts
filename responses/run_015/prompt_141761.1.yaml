      *   *Perception:* Dot moves from 1 to 2, changing color mid-path.
      *   *Problem:* The brain reports the color change *before* Dot B happens. How?
      *   *Orwellian:* Experience happened one way (two flashes), memory was rewritten later to look like motion. (History revision).
      *   *Stalinesque:* Experience was constructed late. The brain waited for Dot B, then rendered the whole movie (motion + color change) and presented it to consciousness as if it happened in real-time. (Delayed rendering).
      *   *Dennett's Point:* These are empirically indistinguishable from the "inside."

  3.  **Drafting the Translation (Video Engineering Terms):**
      *   *Stimulus:* Two discrete video signals/frames. Frame 1 (Red pixel, X coord), Frame 2 (Green pixel, Y coord).
      *   *Perception:* The output on the confidence monitor (the "experience").
      *   *Orwellian:* The switcher cuts Frame 1, then Frame 2. The recorder logs this. Later, in post (offline), the EDL is rewritten to generate a motion graphic. The archive tape shows two flashes, but the broadcast tape shows motion. The "experience" is the broadcast tape.
