      *   *Correction:* On Q2, engineering *does* care about internal architecture even if output is same (latency, heat, cost). I need to emphasize that philosophy lacks these metrics, which is why the debate stalls.
      *   *Correction:* On the "Observer" point, the hard problem is that the "confidence monitor" *is* the consciousness. There is no "engineer" looking at the monitor. The monitor looks at itself.

  8.  **Final Review against constraints:**
