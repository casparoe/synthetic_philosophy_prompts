  **The Sketch: "The Rhetorical Marinade"**

  **Setting:** *A longhouse on the coast of Brazil, 1580. CHIEF ARAWÉTÉ is holding a roasted human arm. MICHEL DE MONTAIGNE is sitting on a log, frantically scribbling in a notebook.*

  **CHIEF ARAWÉTÉ:** So, let me get the translation straight. You're saying the word "barbarian" doesn't mean "evil savage." It just means "guy who doesn't wear pants like me."

  **MONTAIGNE:** Precisely! It is ethnocentric arrogance. To judge another culture by the standard of one's own custom is the height of folly.

  **CHIEF ARAWÉTÉ:** *[Gestures with the arm]* And this? Eating our brave enemies after the battle? That's just… custom?

  **MONTAIGNE:** Well, yes. In context, it's an act of valor. You consume their spirit. It's coherent within your system.

  **CHIEF ARAWÉTÉ:** *[Relieved]* Oh, good. I was worried. The Spanish priests said we're monsters.

  **MONTAIGNE:** *[Stops writing, looks intense]* Ah, but the Spanish! *They* are the monsters. They bury men up to their waists and whip them until their guts hang out. They burn women for having different opinions on the Trinity. *That* is true barbarism.

  **CHIEF ARAWÉTÉ:** Wait. Hold on. You just said there's no objective "barbarism." It's all relative to custom.

  **MONTAIGNE:** Correct.

  **CHIEF ARAWÉTÉ:** So how can the Spanish be *objectively* worse than us? If it's all relative, then their torture is just… their custom. Like our arm.

  **MONTAIGNE:** *[Sweating]* Well, yes, but… their custom violates the laws of nature. It's cruel. It's… objectively… ouchier.

  **CHIEF ARAWÉTÉ:** So there *are* universal laws of nature?

  **MONTAIGNE:** Only when I'm making a point about the French Wars of Religion! Look, are you going to eat that or pose with it? I need to finish the paragraph where you're the "Noble Savage" so I can shame the Duke of Guise.

  **CHIEF ARAWÉTÉ:** I'm confused, Michel. Are we the good guys, or are we just a mirror you're holding up to make Europe look ugly?

  **MONTAIGNE:** Can't I be both? You're the virtuous prop in my argument against cruelty.

  **CHIEF ARAWÉTÉ:** That feels exploitative.

  **MONTAIGNE:** It's humanism! Now, bite into that. I need to describe the texture to prove you aren't bloodthirsty, just… protein-focused.

  **CHIEF ARAWÉTÉ:** *[Sighs and takes a bite]* You know, if you write a sequel, I'm billing you for emotional labor.

  **MONTAIGNE:** *[Muttering as he writes]* "And thus, they dine with a clear conscience, unlike the Christians who…" No, no, make sure to note he's chewing with his mouth open. Adds authenticity.

  ***

  ### Study Note: Separating the Text from the Interpretation

  Since you're using this for a study group, here is the breakdown of what is actually in the text versus where the debate (and the joke) lies.

  **1. What is Settled (The Textual Basics)**
  *   **The Definition of Barbarism:** Montaigne explicitly states that "barbarism" is a label people apply to anything not practiced in their own country (*"chacun appelle barbarie ce qui n'est pas de son usage"*). This is a clear critique of ethnocentrism.
  *   **The Comparison:** He does explicitly compare Tupinambá ritual cannibalism (eating the dead) favorably against European religious torture (burning/torturing the living). He argues the former is an act of vengeance/retribution on the dead, while the latter is inflicting pain on the living for "heresy."
  *   **The Goal:** The essay is undeniably a critique of 16th-century European cruelty, specifically regarding the French Wars of Religion and the colonization of the Americas.

  **2. What is Contested (The Interpretation)**
  *   **Relativism vs. Natural Law:** This is the core tension your group is stuck on.
      *   *Reading A (Genuine Relativism):* Montaigne believes morality is culturally constructed. He praises the cannibals because, within their framework, they are consistent, whereas Europeans are hypocritical.
      *   *Reading B (Strategic Humanism):* Montaigne *uses* relativism as a tool (skepticism) to strip away European arrogance, but he actually believes in a universal standard of "cruelty" and "nature." When he says European torture is "worse," he is sneaking in a universal moral claim (that unnecessary cruelty is objectively bad) despite his earlier relativist framing.
      *   *The Joke's Stance:* The joke sides with **Reading B**. It portrays Montaigne as realizing he has trapped himself: he can't claim European torture is objectively worse without admitting some objective moral standard exists, which undermines his claim that "barbarism is just custom."
  *   **The "Noble Savage":** Scholars debate whether Montaigne actually idealized the Tupinambá or simply instrumentalized them. The joke leans into the **instrumentalization** view—that the indigenous people are rhetorical devices for Montaigne's European critique, rather than subjects worthy of understanding on their own terms.

  **3. Liberties Taken in the Joke**
  *   **Time/Setting:** Montaigne never actually visited Brazil. He based the essay on conversations with a servant who had lived there and explorers' accounts. The joke places them together for dramatic irony.
  *   **Conscious Cynicism:** The joke implies Montaigne is knowingly contradicting himself in the moment. In reality, this tension likely emerged for him during the writing and revising process (he added layers to the *Essays* over many years). He wasn't necessarily trying to "trick" anyone, but rather thinking through the problem in real-time.
  *   **The "Universal" Claim:** The joke treats the "torture is worse" claim as a slip-up. Some scholars argue Montaigne would say torture is worse *by the light of reason*, which he might argue is universal, even if *customs* vary. The joke simplifies this nuance for the sake of the punchline.
