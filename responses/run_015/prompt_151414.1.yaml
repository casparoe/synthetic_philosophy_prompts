      *   *The "Move":* Montaigne uses the "savages" as a mirror to show Europeans their own savagery. He elevates the cannibals to shame the French.
      *   *The Comedy:* The cannibals expect praise (we are the noble savages!), but realize they are just props. Montaigne tries to maintain neutrality but keeps slipping into judgment.

