  ### Agreed Claims

  1.  The formal apparatus (acts, states, outcomes) is neutral ground; disagreement concerns its normative force, not its mathematics.
  2.  Representation theorems establish equivalence between axiomatic compliance and EU form; they do not independently justify the axioms.
  3.  Statewise dominance is a necessary condition for rational preference; violating it is definitively defective.
  4.  Synchronic sure-loss (accepting a package known to lose) is irrational regardless of temporal structure.
  5.  Diachronic exploitability only implies irrationality if the agent accepts premises about plan-act alignment or binding capacity.
  6.  Non-EU rules (e.g., lower-decile) can satisfy transitivity and dominance while violating independence; coherence alone does not entail EU.
  7.  Existential representation claims are vacuous unless state-spaces are fixed and utility is state-independent.
  8.  A successful normative argument must distinguish between internal coherence and instrumental success without conflating the two.

  ### Disagreements Table

  | Crux | Camp A (Normative) | Camp B (Measurement) | Shared Case | Predictions (A / B) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Diachronic Exploitability** | Plans constrain acts; sequential loss is irrational. | Local preferences license trades; no synchronic loss occurs. | Agent trades A→B→C, losing money. | Irrational / Locally Rational |
  | **Independence & Lower-Decile** | Violating independence invites money pumps. | Lower-decile rule is coherent despite violating independence. | Choice via lower-decile rule (10th percentile). | Pumpable / No Synchronic Loss |
  | **Representability** | EU representation is substantive with fixed states. | Representation is vacuous via state-space refinement. | Assigning state-dependent utility. | Non-vacuous / Vacuous |
  | **Empirical Crux** | Subjects feel exploited sequentially. | Subjects' preferences shift contextually. | Allais choice followed by sequential trade. | Accept Correction / Reject Correction |

  ### Closing Note

  Much dispute is verbal: Camp A defines rationality as global coherence; Camp B as instrumental success or local consistency. If "rationality" means "immune to synchronic loss," Camp B wins; if it means "globally consistent," Camp A wins. Rows 1 and 2 survive paraphrase because exploitability (synchronic vs. diachronic) is factual, not definitional. Row 3 survives as it concerns mathematical vacuity. Row 4 is purely empirical. The core divergence remains whether global coherence is a prerequisite for instrumental success or an independent normative demand. We agree that if global coherence instruments better, Camp B should concede; if not, Camp A must justify coherence as intrinsically valuable.
