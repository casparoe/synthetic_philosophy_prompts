answer: |-
  Good evening, everyone. For those of you who know Elena as a neighbor, a aunt, or a friend, you know her generosity. You know she lives simply and gives deeply. But for those of you who know her as Dr. Vasquez, you know she spent thirty years studying why that very lifestyle makes people uncomfortable.

  Elena's career focused on the "demandingness objection." In plain English, this is the worry that morality asks too much of us. Usually, when people argue about this, they talk about quantities. They ask, "How much money must I give?" or "How much time must I sacrifice?" It's a math problem. But Elena saw something deeper that often gets missed. She argued that the real burden isn't just quantitative; it's qualitative. It's not about how much you give, but about the texture of the life you lead while you're giving it.

  She taught us that if morality becomes a constant audit, it changes the air in the room. If every casual choice—what you eat, where you vacation, how you spend a Sunday—must be optimized for the greater good, then life stops being something you live and starts being something you manage. It erodes the stable, non-instrumental relationships that make virtue possible in the first place. You can't truly be a friend if you're always calculating whether that friendship is the most efficient use of your time.

  This leads to a quieter, sharper insight Elena championed: the problem of moral visibility. When every act must be justified by its outcome, private virtue becomes impossible. We are forced to perform our goodness, to make every kindness visible and accountable, rather than letting it remain a quiet secret between people. It asks us to be performers rather than humans.

  And this is why we are all here, both the philosophers and the family. Because Elena didn't just study this tension; she resolved it in how she treated us. Yes, she gave away income, satisfying the quantitative demand. But she protected the qualitative space. She loved us without an audit. She allowed us to be imperfect in front of her without requiring a justification for our humanity. She showed us that you can be deeply good without turning every interaction into a moral spotlight.

  She proved that the kind of people we can be in front of one another matters more than the optimization of the act itself. She gave us the gift of being seen, not judged. So, please raise your glasses. To Elena: may your retirement be free of audits, free of optimization, and full of the quiet, invisible virtues you taught us to value. To Elena.

