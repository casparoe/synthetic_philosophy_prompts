answer: |-
  **Assessment of Exam Answer**

  **Grade: B+**

  **Point-by-Point Assessment**

  *   **Distinction Between Guilt and Shame (Part 1):**
      *   **What you got right:** You correctly identify the standard psychological distinction between guilt (act-specific) and shame (self-specific). Your citation of Bernard Williams is appropriate for establishing the philosophical groundwork, and your explanation of how these emotions motivate different behaviors (repair vs. withdrawal) is clear and accurate according to the dominant literature.
      *   **Where you could improve:** While your definition is standard, it is somewhat simplified. In an upper-level course, you should acknowledge that this distinction is not universally accepted; some researchers argue the phenomenological difference is less clear-cut than the "act vs. self" binary suggests. However, for the purposes of this exam, your definition is sufficient.

  *   **Evaluation of Moral Utility (Part 2):**
      *   **What you got right:** You correctly cite June Tangney's empirical work, which is the gold standard for this topic in moral psychology. Your conclusion that guilt is generally more adaptive than shame aligns with the prevailing view in the field, and you support this with specific correlates (empathy vs. defensiveness).
      *   **Where you go wrong:** You treat this conclusion as settled fact without acknowledging limitations. For example, you do not mention that excessive guilt can be neurotic or maladaptive, nor do you discuss contexts where shame might serve a pro-social function (e.g., reinforcing group norms or signaling serious commitment to values). An 'A' answer would defend the superiority of guilt while acknowledging these nuances.

