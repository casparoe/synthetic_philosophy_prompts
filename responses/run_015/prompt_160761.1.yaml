answer: |-
  # Q&A Prep Sheet: Logic, Ontology, and the Clearance Condition

  **Talk:** Work-in-Progress, Philosophy of Mathematics Series
  **Time:** 25 Minutes Q&A (Replies capped at 90 seconds)
  **Audience:** 12 (Mostly Realists, 2 Logicians, 1 CS/Type Theory)

  ## Strategic Overview

  **Concede in Slide 2 (The Setup):**
  1.  **Meaning Variance:** Explicitly concede that the negative translation does not preserve *fine-grained* cognitive meaning (proofs differ). Claim only that it preserves *truth conditions* relative to a classical meta-theory.
  2.  **Fragmentation:** Acknowledge that "constructivism" is not monolithic. Specify that your target is **Bishop-style constructivism** (compatible with classical logic via translation), not Brouwerian intuitionism (which involves choice sequences and rejects classical logic more robustly).

  **Pre-empt in the Talk:**
  **The "Meaning Change" Objection.** (See Objection #1). If you wait for this, it will dominate the Q&A. Address it during the explanation of the negative translation: "Now, one might worry that $\neg\neg A$ isn't $A$. I address this via the Clearance Condition..."

  **The Reply That Must Land:**
  **Objection #4 (Logic *is* Ontology).** If you cannot sustain the distinction between "adopting a logical rule" and "committing to an ontology," your thesis collapses into the standard view you are trying to displace. You must convince them that LEM is a tool, not a commitment.

  **The Question You Hope Nobody Asks:**
  *"If the disagreement is merely verbal at the first-order level, why did the founders of intuitionism explicitly frame their rejection of LEM as a logical correction rather than an ontological restriction?"* (This attacks the historical/philosophical motivation of your opponents, suggesting you are solving a problem they didn't think they had.)

  ---

  ## The Objections (Ordered by Damage)

  ### 1. The Meaning Variance Objection
  **Who:** Senior Neo-Fregean Realist.
  **The Question:** "You claim the dispute is verbal because PA and HA are intertranslatable. But the negative translation maps $A$ to $\neg\neg A$. For a realist, $A$ asserts a state of affairs; $\neg\neg A$ asserts the impossibility of that state of affairs obtaining falsely. These are different propositions. If the propositions differ, the disagreement isn't verbal; it's substantive. You've changed the subject."
  **The Reply (90s):** "I concede the propositions differ in *sense*, but not in *reference* within the clearance class. My Clearance Condition asks: is there a sentence whose truth certification both parties accept? For $\Pi^0_2$ sentences, PA and HA certify the same computational outcomes. The 'meaning' difference you cite is a difference in *how* we verify, not *what* is verified. If the output is identical, the logical framework is merely a syntax for that verification. The substantive disagreement only arises when we ask *why* we can't verify higher-order claims, which is an ontological question about the domain, not a logical one about the connectives."
  **Soft Spot:** You are relying on a coarse-grained notion of "proposition." If they insist proof-identity matters, you lose the "verbal" verdict.

  ### 2. The Computational Content Objection
  **Who:** Computer Scientist (Type Theory/Proof Assistants).
  **The Question:** "In type theory, a proof is a program. The double-negation translation erases computational content. A classical proof of $\exists x P(x)$ gives you no program to extract $x$; a constructive one does. If you treat these as 'variants of one another,' you are ignoring the fact that one gives me a function and the other gives me a guarantee. That's not a verbal dispute; that's a functional difference."
  **The Reply (90s):** "That functional difference is exactly why I locate the real disagreement in ontology, not logic. The 'guarantee' you mention relies on the domain being constructible. My claim is that classical logic *can* run on constructive domains if we add the verifiability operator. The lack of extraction in the classical version isn't a failure of logic; it's a reflection that the classical user isn't asking for a program, they're asking for truth. The disagreement is about whether the domain *supplies* programs, not whether the logic *permits* them. You're describing the ontological consequence, I'm describing the logical engine."
  **Soft Spot:** She may not care about your metaphysical distinction. To her, "no program" means "no meaning."

  ### 3. The Fragmentation Objection
  **Who:** Philosophical Logician (Specialist in Arithmetic).
  **The Question:** "You treat 'constructive mathematics' as a single target for your translation. But constructivism fragments. Bishop's constructivism is compatible with classical logic; Brouwer's isn't. Markov's Principle is accepted by some constructivists and rejected by others. If 'constructivism' isn't one position, your verdict that the dispute is 'merely verbal' attaches to nothing. Which constructivism are you dissolving?"
  **The Reply (90s):** "Precisely why I restrict my thesis to the 'clearance class' of first-order arithmetic. Within that class, the fragmentation you mention—Markov's rule, Church's thesis—doesn't generate divergent truth values for the clearable sentences. Friedman's translation holds across these variants for $\Pi^0_2$. I am not dissolving Brouwer's metaphysics of the creating subject; I am dissolving the idea that *logic itself* is the barrier. The fragmentation you cite confirms my point: the real disagreements are about specific principles (ontology), not the underlying logical calculus."
  **Soft Spot:** If they press that Bishop is the *only* one compatible with your view, you've defined your target so narrowly it's trivial.

  ### 4. The "Logic Is Ontology" Objection
  **Who:** Ante Rem Structuralist.
  **The Question:** "You draw a sharp line between 'logical rules' and 'ontological commitment.' But for a structuralist, the logic *constitutes* the structure. To reject LEM is to say the structure of the natural numbers doesn't support it. That is an ontological claim made *through* logic. You can't separate them. If the logic changes, the object changes."
  **The Reply (90s):** "This is the crux. I argue that the object (the natural numbers) remains invariant under the negative translation. The structure supports LEM *if* we interpret existence as double-negated existence. The ontological claim is 'Do infinite totalities exist independently of verification?' Logic is just the syntax we use to query that. If we can translate the query without losing truth in the clearance class, the logic is neutral. The ontology determines whether we *want* to translate. You are conflating the map with the territory."
  **Soft Spot:** This is the hardest hit. If they reject the map/territory distinction here, your thesis has no ground.

  ### 5. The Arbitrary Cutoff Objection
  **Who:** Philosophical Logician.
  **The Question:** "You place the clearance class at $\Pi^0_2$. Why? $\Pi^0_1$ is decidable. $\Pi^0_3$ is not. This looks like you've chosen the boundary exactly where your conservativity result works. If you moved the clearance condition to $\Pi^0_3$, the disagreement becomes real. Isn't your 'verbal' verdict just an artifact of your chosen complexity class?"
  **The Reply (90s):** "It's not arbitrary; it's epistemic. $\Pi^0_2$ ('for every x there is a y') is the limit of finite certification. I can check a specific pair, but I cannot check the totality. This is the threshold of 'clearability' by a finite agent. Higher classes involve quantification over functions or sets, which cannot be certified by computation alone. The conservativity result is evidence that this epistemic threshold aligns with the logical divergence. It's not that I chose the class to fit the theorem; the theorem reveals the class where logic is neutral."
  **Soft Spot:** It *does* look convenient. You need to defend "finite certification" as the only legitimate metric for "genuine disagreement."

  ### 6. The Access Problem Displacement
  **Who:** Neo-Fregean (Access Problem focus).
  **The Question:** "Realists worry about how we access abstract objects. You say the dispute is ontological, not logical. But haven't you just taken the access problem and moved it from 'How do we know logic?' to 'How do we know ontology?' You haven't solved the crux; you've just relabeled it."
  **The Reply (90s):** "I am not trying to solve the access problem; I am trying to locate the disagreement. Realists often think the *logic* is the barrier to access (i.e., 'we can't use LEM because we can't access the truth values'). I am arguing the logic is fine; the access problem is purely about the objects. By separating them, I clarify that adopting classical logic doesn't grant you magical access. It just changes the syntax. The access problem remains, but it's no longer a problem about *inference*, it's a problem about *reference*."
  **Soft Spot:** They might think clarifying the location of the problem is philosophically idle if the problem remains unsolved.

  ### 7. The Stability Failure Objection
  **Who:** Structuralist.
  **The Question:** "You admit the dispute becomes 'genuine' at second-order. But if a dispute is verbal at level 1 and real at level 2, isn't it just a real dispute that level 1 is too weak to express? Saying it's 'locally verbal' sounds like saying 'the dispute is real, but we can't see it yet.' Why call it verbal at all?"
  **The Reply (90s):** "Because at level 1, the parties can cooperate without resolving the ontology. A classical and constructive number theorist can agree on all $\Pi^0_2$ theorems. They only fight when they try to formalize the *totality* of those theorems. The 'verbal' verdict explains why collaboration is possible in practice despite metaphysical rivalry. It's not that the dispute doesn't exist; it's that it doesn't impact the clearable output. That's a significant philosophical distinction."
  **Soft Spot:** "Locally verbal" is a tricky sell. It risks sounding like "real but suppressed."

  ### 8. The Subject-Changing Accusation
  **Who:** General Realist.
  **The Question:** "This feels like semantic ascent. You're defining 'genuine disagreement' in such a way that the logical dispute disappears. Isn't this just a way of declaring victory for realism by fiat?"
  **The Reply (90s):** "The Clearance Condition isn't a fiat; it's a constraint on what counts as a *shared* domain. If we can't agree on a verification procedure, we aren't talking about the same sentence. I'm not declaring victory for realism; I'm arguing that constructivism doesn't require a rival logic to make its ontological point. It's a defense of the constructive *ontologist*, not the constructive *logician*."
  **Soft Spot:** If they reject the Clearance Condition as too verificationist, this reply fails.

  ---

  ## Final Advice for the Room

  *   **Watch the Logician:** They know the metatheory better than you. If they correct your use of "Friedman translation" vs "Negative translation," concede immediately and move on. Do not fight technical details.
  *   **Manage the CS Person:** She speaks "extraction." You speak "truth." Translate her objections into ontology (e.g., "extraction requires the object to exist constructively").
  *   **The Realist Trap:** They will try to make you defend Constructivism. Do not. You are defending a *classification* of the dispute, not the constructive side. Remain neutral.
  *   **Time Management:** If an answer runs long, stop at 90 seconds. Say: "I think that touches on the ontological migration point I made in the conclusion, happy to discuss after." This keeps control.

  **Good luck. The thesis is bold; the defense must be precise.**
