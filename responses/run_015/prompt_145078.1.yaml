answer: |-
  Consider a finite research collective $\mathcal{C}$ comprising three physicists operating under a strict testimony protocol: any member verifying an empirical claim $p$ must immediately broadcast it, thereby establishing distributed collective knowledge $K_\mathcal{C}p$. Currently, $p$ is true but unverified, rendering the conjunction $q$: '$p$ is true and $\neg K_\mathcal{C}p$' true. The team maintains a live epistemic dashboard, allowing them to know their own ignorance, such that $\neg K_\mathcal{C}p$ is itself a knowable fact within $\mathcal{C}$. If an Unrestricted Knowability Theorist maintains that all truths are possibly known ($\forall \phi, \phi \to \Diamond K_\mathcal{C}\phi$) and accepts that collective knowledge closes under known implication, then should $\mathcal{C}$ come to know $q$, closure dictates $\mathcal{C}$ must know $p$ and know $\neg K_\mathcal{C}p$. However, knowing $p$ triggers the protocol, making $K_\mathcal{C}p$ true and falsifying the second conjunct of $q$. Thus, $q$ appears unknowable, forcing a contradiction for the Unrestricted Theorist, whereas a Fitch-style Realist accepts $q$ as necessarily unknown, and a Restrictionist denies closure applies to such self-referential epistemic attributions.

  **Rigorous Check**

  The key propositions are $p$ (the empirical claim), $K_\mathcal{C}\phi$ (the collective $\mathcal{C}$ possesses distributed knowledge of $\phi$), and $q$ (the conjunction $p \land \neg K_\mathcal{C}p$). The precise closure rule applied is the distribution of knowledge over conjunction: $K_\mathcal{C}(A \land B) \to (K_\mathcal{C}A \land K_\mathcal{C}B)$. The relevant nearby epistemic worlds include the actual world $w_1$, where $p$ is true and $\neg K_\mathcal{C}p$ holds (making $q$ true), and a possible world $w_2$, accessible via the knowability principle, where $K_\mathcal{C}q$ holds. The three positions deliver distinct verdicts based on their handling of $w_2$. The Unrestricted Knowability Theorist insists $w_2$ is accessible; however, in $w_2$, closure entails $K_\mathcal{C}p$, which contradicts the second conjunct of $q$ known in that same world, generating a contradiction that suggests $q$ is unknowable despite being true. The Fitch-style Realist avoids contradiction by denying the knowability principle, asserting that $q$ is true in $w_1$ but there is no accessible world $w_2$ where $K_\mathcal{C}q$ holds; thus, some truths are necessarily unknown. The Restrictionist retains the knowability principle but blocks the contradiction by denying that the closure rule applies when the object of knowledge involves self-referential group attributions like $\neg K_\mathcal{C}p$; for them, $K_\mathcal{C}q$ does not entail $K_\mathcal{C}\neg K_\mathcal{C}p$ in a way that triggers the protocol-induced falsification.

  **The Working Feature and Collapse**

  The feature that does the work is the self-referential loop in distributed epistemic attribution, specifically where the content of the known proposition ($q$) references the epistemic state of the knower ($\mathcal{C}$) regarding that very content's first conjunct. If this feature is removed by replacing the collective knowledge operator $K_\mathcal{C}$ with a single isolated agent's knowledge operator $K_s$, the case collapses back into the standard Fitch result. The structural complexity of the testimony protocol and the dashboard becomes superfluous, leaving only the logical tension between an individual knowing a truth and knowing that they do not know it. This demonstrates that the collective scenario is not a dissolution of the paradox through social epistemology, but a robust embedding of the original logical problem within a resource-bounded, realistic context.

  **The Restrictionist's Defence**

  The Restrictionist defends their position by conceding that closure holds for ordinary empirical claims (e.g., knowing $p$ and knowing $p \to r$ entails knowing $r$) while denying its application to propositions about the collective's own knowledge states. They argue that epistemic logic is not fully agglomerative when the object of knowledge includes the knowledge operator itself, as the act of verification alters the truth conditions of the proposition. This saves the knowability principle formally, as $q$ remains possibly known without entailing a contradiction. However, this arguably merely relocates the problem: it preserves the principle at the cost of restricting a fundamental rule of inference (closure) that is intuitively plausible for rational agents. The burden shifts from explaining unknown truths to explaining why logical deduction fails specifically for self-referential epistemic claims, which may seem ad hoc unless grounded in a deeper theory of dynamic epistemic change.
