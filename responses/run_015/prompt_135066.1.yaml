          *   **Tech Race:** He does argue that decisive strategic advantage (DSA) leads to singleton formation.
          *   **Cryptographic Commitment:** This is the red flag. Bostrom talks about *precommitment* and *control*, but "cryptographic commitment schemes" sounds like specific blockchain/crypto-anarchist jargon grafted onto Bostrom's broader philosophical argument. Bostrom focuses more on capability control and motivation selection, not necessarily smart contracts.
