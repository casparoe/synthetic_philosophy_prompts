answer: |-
  *Pulls up a stool and signals the barman for another round.*

  Look, I see where you're coming from. It smells like a trick, doesn't it? Like I'm playing with words to save a old-fashioned notion of Fate. You say: "If I'm in Aleppo on Tuesday, then plainly I wasn't in Damascus. So I avoided it." And you reckon I'm just saying, "Ah, but in the *real* index, you weren't," which sounds like I'm rigging the game so Fate always wins.

  But listen closely. I'm not talking about metaphysical chains forcing your legs to move. I'm talking about the logic of what you're actually saying when you make a claim.

  Think about the word "now." If I say, "It is raining now," and I say it on Monday, that statement is tied to Monday. If you come to me on Tuesday and say, "It wasn't raining now," you're not proving me wrong. You've changed the index. You've changed the coordinate of time the word "now" points to.

  Death's prediction is no different. It's an indexical proposition. It says, "I will find you *there*," pointing to Damascus. But that pointing isn't just a gesture in the air; it's anchored to the actual state of affairs. It's anchored to the *fact* of the matter.

  Here's the rub: You're treating the prediction as if it's a hypothesis like "If you go to Damascus, you die." But it's not a conditional. It's an assertion of fact about the actual course of events. When you say on Sunday, "I will stay away," you are constructing a supposition. You're imagining a different coordinate of reality.

  You ask if I've defined fatalism into existence. I say no. Fatalism says, "No matter what you choose, the result is fixed." My view is sharper: "The truth of the prediction is fixed to the actual choice you make."

  If you truly stay in Aleppo on Tuesday, then the proposition "He will be in Damascus" was never true *of the actual world*. But Death doesn't make false predictions. So, if Death says Damascus, Damascus is the actual world-index. Your thought on Sunday that you *could* be in Aleppo is you entertaining a different index—a mere possibility, not the actuality.

  You say, "By Wednesday I can truly say I was not there." But if Death is infallible, you won't be able to say that on Wednesday. You'll be dead in Damascus. The puzzle isn't that you can't move your legs to Aleppo. It's that your belief "I will be in Aleppo" is a belief about a non-actual index. It's a belief about a world that isn't *this* one.

  So, am I saving fatalism? No. I'm saving logic. You can't falsify a statement about *this* reality by pointing to *another* possibility. The traveller thinks he's avoiding death, but he's just shifting his attention to a different logical coordinate. He hasn't changed the truth of the actual index; he's just looking at a shadow.

  *Leans in, tapping the table.*

  The mistake isn't thinking you're fated. The mistake is thinking that a thought about "what I might do" has the same logical weight as a fact about "what is the case." Death speaks to the fact. You're speaking to the possibility. You can't avoid the fact by hiding in the possible. That's not fatalism, friend. That's just grammar.
