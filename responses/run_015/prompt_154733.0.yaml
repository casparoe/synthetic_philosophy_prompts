prompt: |-
  You are an expert in philosophical logic and pedagogical design for advanced undergraduates. Think carefully, and begin by briefly brainstorming three different physical or social ways to stage reflexive self-certification before selecting one and developing it fully.

  Design a runnable 75-minute classroom activity for a philosophy seminar of about 15 students (advanced undergraduate or early graduate level) that makes participants feel the force of the Löbian obstacle to self-trusting agents: the structural problem that a consistent reasoning system cannot fully contain an internal proof or endorsement of its own consistency without generating a loop or contradiction. Do not open with a lecture on Gödel or Löb; instead, arrange the rules, roles, and incentives so that participants encounter the reflexive loop themselves—through their own choices—before it is named in the debrief.

  The activity should involve real, small-stakes choices: for example, distributing 100 collective points among group decisions, or using physical “trust certificates” that confer reasoning authority but only if meta-certified. Inject the niche framing of “epistemic debt”—the unavoidable deficit of justification that accrues when a reasoning system tries to collateralize its own reliability—into the debrief, so that participants map their experience onto this concept rather than only onto standard Gödelian language. Participants should come away seeing why reflexive self-certification fails structurally rather than merely contingently, and they should have experienced firsthand the temptation to “solve” the loop by adding yet another meta-layer.

  Provide:
  - The precise setting, group structure, and materials (cards, role sheets, tokens, or rule cards).
  - The rules and payoff/incentive structure.
  - A minute-by-minute flow for the 75 minutes.
  - A debrief that maps specific moments in the activity onto parts of the obstacle (the self-reference condition, the consistency requirement, the failure of internal certification), explicitly using the “epistemic debt” framing.
  - A frank prediction of what will go wrong the first time you run it—especially students attempting to break the loop by escalating meta-certification—and how the facilitator should handle it.
  - An explicit note on which feature of the formal obstacle the activity cannot reproduce and that the facilitator must supply verbally.

  Keep references to specific texts or named scholars minimal; do not request bibliographies, reading lists, or citations. End your response with the core game mechanism summarized in the format \answer{[mechanism name]}.
