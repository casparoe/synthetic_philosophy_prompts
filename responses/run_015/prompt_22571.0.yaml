          *   *Type Theory:* This suggests `WhiteHorse` is an intersection `Horse & White` or a refinement `{x: Horse | color(x) = White}`.
          *   *Verdict:* This captures the "adding a qualifier changes the name/definition" aspect most accurately.

  5.  **Address "What Concretely Breaks":**
