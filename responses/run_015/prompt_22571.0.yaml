      *   *Premise 3:* "White Horse" names the shape *plus* the color.
      *   *Conclusion:* Therefore, the concept "White Horse" is not identical to the concept "Horse."
      *   *Nuance:* Gongsun Long isn't necessarily saying a white horse isn't a member of the set of horses in a practical sense. He's arguing about *semantics*, *reference*, and *intension* vs. *extension*. He is distinguishing between the *concept* (intension) and the *object* (extension).
      *   *Key Insight:* Adding a constraint (white) restricts the extension (fewer things satisfy it) but changes the intension (the definition is different).

  3.  **Map to Type Theory:**
