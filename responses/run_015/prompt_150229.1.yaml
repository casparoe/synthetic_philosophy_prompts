  My credence that 'dead meme walking' is a real distinct phenomenon in cultural evolution is 0.55.

  Breaking this down, I assign a 0.6 probability to strict Dawkinsian meme theory being the correct framework, as cultural evolution is real but the gene-meme analogy often breaks down under rigorous scrutiny. I assign a 0.8 probability to the mechanism itself—that debunking fuels replication—because algorithmic amplification of engagement and the illusory truth effect strongly support the idea that negative attention drives spread. However, I only assign a 0.5 probability to this being distinct from regular controversy, as the line between "sharing to debunk" and "sharing to signal tribal allegiance against a threat" is often blurred in practice. Combining these, the strong evidence for the mechanism is tempered by the theoretical fuzziness of the framework and the categorization, landing me slightly above even odds.

  I am least confident about the distinctness criterion, specifically whether motivation to debunk is functionally different from motivation to argue a opposing belief in terms of evolutionary outcomes. To shift this, I would need longitudinal data tracking individual sharing motivations paired with belief retention rates, showing that "debunk-sharers" propagate the meme with higher fidelity or reach than "belief-sharers" without adopting the underlying concept themselves.

  Your disagreement with your friend likely lives in the weighting of empirical observation versus theoretical categorization. Your friend's 0.7 credence probably weights the observable viral mechanics heavily (the mechanism is obvious), while your 0.3 credence likely weights the theoretical distinctness and the validity of memetics much lower (the category is muddy). You are arguing about taxonomy; they are arguing about visibility.
