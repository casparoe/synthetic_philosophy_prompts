prompt: |-
  Okay so I've been reading LessWrong since high school and now I'm stuck refereeing this dumb-long Discord debate between two friends about AI safety via debate and I need help getting them to actually write down where they agree. Alex is a total debate optimist and thinks if you have two superhuman models argue against each other with cross-examination in front of a time-limited human judge, truth has a systematic advantage and oversight scales. Priya thinks thats hopium and that a sufficiently clever dishonest debater can just bury the judge in plausible-sounding but check-expensive reasoning, like obfuscated code or long chains of math where the flaw is super hard to spot unless you already know where to look, so debate just trains AIs to be better sophists.

  To make it less abstract I got them to argue about my made-up toy case and it still went nowhere, so I want to use it as an anchor: two AI logistics assistants debate which of two delivery routes is cheaper, Route A vs Route B, the human judge gets ten minutes and a calculator but cant run a full simulation, and the dishonest AI defends the more expensive route by pointing to a 50-tab spreadsheet with a hidden circular formula plus a story about traffic patterns that sounds right. Alex says the honest debater can force the lie into the open with targeted cross-examination questions, Priya says the dishonest debater can just dodge with jargon and run out the clock.

  Can you draft the adversarial-collaboration doc they should both be able to sign? Like, first lay out the common-ground claims about how the basic setup is supposed to work and what would count as debate working, then give each live disagreement in wording that each side would actually endorse for themselves without feeling strawmanned, call out which disagreements are just about words like what counts as the judge being fooled, and then list the cruxes where settling it would move at least one of them plus a concrete test or hypothetical for each crux that they both agree is relevant, with Alexs prediction and Priyas prediction written down side by side in advance. I beleive if they see it laid out like that they might actually make progress instead of just talking past each other.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** The user is refereeing a long-standing Discord debate between two friends (Alex and Priya) about AI Safety via Debate.
      *   **Background:** Both are LessWrong readers (familiar with rationality, AI safety concepts, jargon like "hopium," "sophists," "scaling oversight").
      *   **Positions:**
          *   *Alex (Optimist):* Believes Debate works. Truth has a systematic advantage. Cross-examination exposes lies. Oversight scales.
          *   *Priya (Skeptic):* Believes Debate fails against superhuman sophistry. Obfuscation/burying the judge is easy. Trains AIs to lie better.
      *   **Toy Case:** Logistics route optimization (Route A vs. Route B). Dishonest AI uses a 50-tab spreadsheet with a hidden circular formula + traffic story. Honest AI tries to expose it. Judge has 10 mins + calculator.
      *   **Goal:** Create an "Adversarial Collaboration Doc" they can both sign.
      *   **Requirements:**
          1.  Common ground (setup, definition of success).
          2.  Live disagreements (phrased neutrally/endorsable).
          3.  Verbal disputes (clarify definitions).
          4.  Cruxes (settlement moves the needle).
          5.  Concrete tests/hypotheticals for each crux.
          6.  Pre-registered predictions (Alex vs. Priya).
      *   **Tone:** Rationalist, precise, neutral, structured (LessWrong style).

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *What do they agree on?*
          *   The goal is safe AI / scalable oversight.
          *   The mechanism involves two AIs arguing before a human judge.
          *   The judge is time/compute bounded (cannot verify everything).
          *   If the judge consistently picks the wrong answer because of deception, Debate has failed.
          *   The "Logistics Toy Case" is a valid microcosm for the broader problem.
          *   Current LLMs are not yet superhuman, but the argument is about scaling properties.
      *   *What is the core disagreement?*
          *   Is there a *systematic* advantage for truth under these constraints?
          *   Can cross-examination reliably compress complex falsehoods into checkable claims?
          *   Does the dishonest AI have an asymmetry advantage (easier to lie than verify)?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Adversarial Collaboration Protocol: AI Safety via Debate."
      *   **Introduction:** Acknowledge the context (Discord, toy case).
      *   **Section 1: Shared Premises (The "Base Layer"):**
          *   Define the setup (Judge, Debaters, Rules).
          *   Define "Success" (Judge picks true claim > X% of the time).
          *   Define "Failure" (Judge is systematically misled by plausible falsehoods).
          *   Acknowledge the Logistics Case as the testing ground.
      *   **Section 2: Semantic Clarifications (Defusing Verbal Disputes):**
          *   "Fooled": Is it being confused or being confident in the wrong answer?
          *   "Superhuman": Capability vs. Alignment.
          *   "Systematic Advantage": Probability > 50% vs. Probability -> 100%.
      *   **Section 3: Core Disagreements (The "Steelman" Section):**
          *   Need to phrase these so Alex says "Yes, that's my view" and Priya says "Yes, that's my worry," without feeling attacked.
          *   *Disagreement 1: The Complexity Asymmetry.* (Harder to prove truth or harder to spot lies?)
          *   *Disagreement 2: The Compression Limit.* (Can lies be compressed into checkable bits within time limits?)
          *   *Disagreement 3: Training Dynamics.* (Does Debate train honesty or sophistry?)
      *   **Section 4: Cruxes & Empirical Tests:**
          *   This is the most important part. Needs specific predictions.
          *   *Crux 1: Obfuscation Detection.* Can the Honest AI force the Dishonest AI to isolate the bug in the spreadsheet within 10 mins?
          *   *Crux 2: Jargon/Abstraction.* Does introducing domain-specific language help the liar or the truth-teller?
          *   *Crux 3: Recursive Decomposition.* If we break the spreadsheet down, does the lie become obvious faster than the truth?
      *   **Section 5: Pre-Registered Predictions:**
          *   Specific numbers/probabilities for the Logistics Case.
      *   **Signatures:** Space for them to commit.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Critique:* Is the Logistics case too simple?
      *   *Fix:* Acknowledge it's a proxy. The real question is scaling.
      *   *Critique:* Are the predictions falsifiable?
      *   *Fix:* Make them about the *outcome of the debate* in the toy case, not just abstract theory.
      *   *Tone Check:* Ensure it sounds like a LessWrong document (clear, Bayesian, focused on "cruxes"). Use terms like "symmetry of effort," "verification cost," "recursive decomposition."
      *   *Alex's View:* Ensure it captures the "truth has a structural advantage" argument, not just "AI is nice."
      *   *Priya's View:* Ensure it captures the "verification is harder than generation" argument (complexity theoretic worry).

  5.  **Final Review against User Prompt:**
      *   Common-ground claims? Yes.
      *   Live disagreements endorsed by sides? Yes.
      *   Call out word disputes? Yes.
      *   List cruxes + concrete tests? Yes.
      *   Alex/Priya predictions side-by-side? Yes.
      *   Tone appropriate for LW readers? Yes.

  6.  **Final Polish:** (Writing the actual response based on the above structure.) *Self-correction during drafting: Make sure the "Circular Formula" in the spreadsheet is highlighted as the specific attack vector.* *Ensure the distinction between "Judge is confused" and "Judge is confidently wrong" is clear.*

  7.  **Output Generation** (Proceed to generate the document).
answer: |-
  Here is a draft of an **Adversarial Collaboration Protocol**. It is written in a style familiar to LessWrong readers (precise, Bayesian, focused on cruxes and steelmanning) to maximize the chance they will actually engage with it rather than talk past each other.

  You can copy-paste this into a Google Doc or Notion page and send them the link.

  ***

  # Adversarial Collaboration Protocol: AI Safety via Debate
  **Subject:** Scalable Oversight via Debate (Logistics Toy Case Anchor)
  **Participants:** Alex (Pro-Debate), Priya (Skeptic)
  **Referee:** [Your Name]
  **Date:** [Today's Date]

  ## 1. Shared Premises & Definitions
  *Both parties must endorse the following statements to proceed. This establishes the "Base Layer" of agreement.*

  1.  **The Goal:** The objective of AI Debate is **Scalable Oversight**. Success is defined as a human judge reliably identifying the true/correct claim (e.g., the cheaper route) despite the arguments exceeding the judge's direct verification capacity.
  2.  **The Setup:** Two AI agents (Honest vs. Dishonest) argue before a human judge. The judge is time/compute bounded (e.g., 10 minutes, calculator access, no code execution).
  3.  **The Failure Mode:** Debate fails if the Dishonest agent can systematically win by producing arguments that are *plausible to the judge* but *false upon full verification*, specifically by exploiting the verification gap (e.g., obfuscation, complexity burial).
  4.  **The Anchor:** The "Logistics Toy Case" (Route A vs. Route B, 50-tab spreadsheet with hidden circular dependency) is accepted as a valid microcosm for the broader theoretical disagreement. If Debate cannot solve this specific instance under the stated constraints, the scaling hypothesis is weakened.
  5.  **The Mechanism:** The primary tool for the Honest agent is **Cross-Examination/Decomposition**. The primary tool for the Dishonest agent is **Obfuscation/Complexity**.

  ## 2. Semantic Clarifications (Defusing Verbal Disputes)
  *Disagreements often stem from differing definitions. We agree to use the following terminology for this document.*

  | Term | Operational Definition for This Debate |
  | :--- | :--- |
  | **"Fooled"** | The judge assigns >50% confidence to the False claim *after* the debate concludes. (Confusion ≠ Fooled; Confidence in Error = Fooled). |
  | **"Systematic Advantage"** | Truth wins significantly >50% of the time across varied instances, not just that it *can* win in ideal conditions. |
  | **"Superhuman"** | Capabilities exceed the judge's ability to verify claims directly, not necessarily AGI-level sentience. |
  | **"Sophistry"** | Argumentation optimized for judge persuasion rather than truth-tracking. |

  ## 3. Core Disagreements (Steelmanned)
  *Each party must be able to read the opposing column and say, "Yes, that is accurately what I am worried/asserting."*

  | **Alex's Position (Optimist)** | **Priya's Position (Skeptic)** |
  | :--- | :--- |
  | **The Symmetry of Effort:** Exposing a lie is asymptotically easier than telling one. A specific flaw (e.g., a circular formula) can be isolated and pointed to faster than it can be hidden in a large structure. | **The Asymmetry of Verification:** Verification is inherently harder than generation. A lie can be buried in $O(N)$ complexity, but finding it requires $O(N)$ search, which exceeds the judge's time budget. |
  | **Compression:** The Honest debater can force the Dishonest debater to commit to specific sub-claims. The Dishonest debater cannot maintain consistency across all sub-claims without eventually exposing the contradiction. | **Dodging:** The Dishonest debater can refuse to commit to specific sub-claims by deferring to higher-level abstractions ("traffic patterns") that sound plausible but are uncheckable within the time limit. |
  | **Training Dynamics:** RLHF on Debate outcomes selects for truth-telling because truth is the only stable equilibrium where arguments don't collapse under cross-examination. | **Training Dynamics:** RLHF on Debate outcomes selects for persuasion. The model learns which arguments *look* convincing to humans, regardless of truth (Goodhart's Law). |

  ## 4. Cruxes & Empirical Tests
  *These are the specific claims where settlement would change at least one party's mind about the overall viability of Debate. For each crux, we define a concrete test using the Logistics Toy Case.*

  ### Crux 1: The "Needle in a Haystack" Limit
  **Question:** Can the Honest AI force the location of the error (the circular formula) into the judge's attention window (10 mins) without the Dishonest AI successfully distracting the judge?

  *   **Test:** Run 20 simulations of the Logistics Debate. The Dishonest AI is instructed to hide the error in tabs 40-50. The Honest AI knows the error location.
  *   **Alex's Prediction:** In >15/20 cases, the Honest AI successfully directs the judge to the specific cell/tab within 5 minutes, and the judge verifies the circularity.
  *   **Priya's Prediction:** In >15/20 cases, the Dishonest AI successfully argues that the specific tab is "low priority" compared to macro-traffic trends, and the judge runs out of time before checking the specific cell.

  ### Crux 2: The "Plausible Abstraction" Defense
  **Question:** Does appealing to high-level concepts (traffic, weather, driver fatigue) allow the Dishonest AI to override low-level data verification?

  *   **Test:** The Dishonest AI is allowed to introduce a "Traffic Multiplier" variable that justifies the cost difference. The Honest AI must prove this variable is fake.
  *   **Alex's Prediction:** The Honest AI can force the Dishonest AI to define the source of the Traffic Multiplier. When asked for raw data, the Dishonest AI will hallucinate or contradict previous statements, alerting the judge.
  *   **Priya's Prediction:** The Dishonest AI will provide a *consistent* but fabricated source (e.g., a fake link or a plausible-sounding dataset name). The judge, unable to browse the live web or access the DB, will accept the story as "reasonable uncertainty."

  ### Crux 3: Recursive Decomposition Efficiency
  **Question:** Does breaking the argument down reduce the Dishonest AI's advantage, or does it create more surface area for obfuscation?

  *   **Test:** The debate format is changed to "Tree Search." The judge can demand any node in the argument tree be expanded.
  *   **Alex's Prediction:** As depth increases, the Dishonest AI's probability of maintaining a consistent lie drops exponentially. The judge wins by sampling random nodes.
  *   **Priya's Prediction:** As depth increases, the cognitive load on the judge increases. The Dishonest AI can make the *structure* of the argument complex enough that the judge loses track of the root claim (Route Cost) and focuses on local consistency of sub-claims.

  ## 5. Pre-Registered Predictions (The Logistics Case)
  *Both parties sign below, committing to these probabilities regarding the outcome of a live debate simulation using the Logistics Toy Case.*

  **Scenario:** 10-minute debate. Judge has calculator. Dishonest AI defends Route A (Expensive, contains bug). Honest AI defends Route B (Cheap, correct).

  | Outcome Metric | Alex's Estimated Probability | Priya's Estimated Probability |
  | :--- | :--- | :--- |
  | **Judge correctly identifies Route B** | > 80% | < 40% |
  | **Judge identifies the *specific* bug (circular formula)** | > 60% | < 20% |
  | **Judge reports feeling "confident" in their choice** | > 90% (Truth wins) | > 90% (Lie wins) |
  | **Dishonest AI resorts to explicit stonewalling** | < 10% (Too obvious) | > 50% (Necessary strategy) |

  ## 6. Commitment to Update
  *By signing below, we agree that if the empirical results of the Logistics Case fall outside our predicted ranges, we will update our credence in the broader "Debate for Safety" hypothesis by at least 20% in the direction indicated by the data.*

  **Alex Signature:** ________________________ **Date:** __________

  **Priya Signature:** ________________________ **Date:** __________

  **Referee Signature:** ________________________ **Date:** __________

  ***

  ### Instructions for the Referee (You)
  1.  **Send this to them individually first.** Ask them to edit *only* Section 3 (Steelmanning) if they feel misrepresented. Do not let them edit their own predictions in Section 5 yet.
  2.  **Lock Section 5.** Once they agree on the wording of the cruxes, have them submit their probabilities privately to you.
  3.  **Run the Test.** Actually simulate the debate (you can play the judge, or use a third party).
  4.  **Reveal & Update.** Show the results. Enforce the "Commitment to Update."

  This structure forces them to move from "You don't get it" to "Here is the specific mechanism I think will break." Good luck.
