answer: |-
  Here are 10 probing questions for Dr. Kessler, designed to dig into the specifics of her position without wasting time on biography. Each includes a follow-up that leverages her distinction between epistemic and metaphysical underdetermination.

  **1. The "Horn One" Smuggling Charge**
  Critics argue that by grounding morality in the "rational constitution" of divine nature, you're just reinstating Horn One of the Euthyphro dilemma—making God subject to an independent standard of rationality. How do you respond to the claim that "rational constitution" is just independence with extra steps?
  *   **Follow-up:** When critics perceive a gap between God and the Good, are you saying that separation is a metaphysical reality, or is it merely an epistemic underdetermination of how divine nature constitutes value?

  **2. Defining "Rational Constitution"**
  You claim moral truths are necessary but not prior to God. Can you unpack what "rationally constituted" means without implying that reason is a tool God uses, which would again suggest something external to Him?
  *   **Follow-up:** If the structure of reason seems distinct from God's will, is that distinction metaphysically robust, or is it another case where underdetermination is epistemic, not metaphysical?

  **3. The Necessity of Divine Nature**
  If God's nature is necessary, and morality is constituted by that nature, does that mean every specific moral truth is metaphysically necessary? Could God have created a world with different moral axioms?
  *   **Follow-up:** In cases where moral rules seem contingent, do you attribute that contingency to a metaphysical choice, or do you maintain the underdetermination is epistemic, not metaphysical?

  **4. The "Five Prohibitions" Problem**
  Let's look at specific rules: why five prohibitions rather than six? If divine nature is necessary, why does the output look contingent? How do you avoid the charge that specific commands are arbitrary?
  *   **Follow-up:** You've argued this gap is epistemic. Does that imply a finite mind could *in principle* deduce the exact number, or is the specificity metaphysically brute but epistemically hidden?

  **5. Direct Probe on Underdetermination**
  Your standard move is to claim that underdetermination is epistemic, not metaphysical. But doesn't this risk making your theory unfalsifiable? If every apparent contingency is just an epistemic limit, how do we test the metaphysical claim?
  *   **Follow-up:** If we found a moral truth that logically *couldn't* flow from divine nature, would that be a metaphysical refutation, or would you classify our inability to link them as epistemic underdetermination?

  **6. Deep Moral Disagreement**
  When two rational agents clash on a hard case—say, a triage scenario—are they operating in genuinely separate normative frameworks, or is one simply misreading the rational structure?
  *   **Follow-up:** If both agents are equally rational yet disagree, is that divergence a metaphysical split in frameworks, or just an epistemic underdetermination of the single true structure?

  **7. Plato's Essentialism Trap**
  You claim Plato's framing bakes in essentialism that modern Divine Command Theorists shouldn't accept. What exactly is that baked-in assumption, and why is it a category error?
  *   **Follow-up:** Is Plato's error assuming metaphysical priority where there is only an epistemic underdetermination of the grounding relation between Form and Divine?

  **8. Critique of Modern Divine Command Theory**
  Why shouldn't a modern Divine Command Theorist accept your view? What are they missing when they insist on the voluntarist horn?
  *   **Follow-up:** Do DCT theorists mistake epistemic underdetermination of God's will for metaphysical voluntarism, thereby creating a false dilemma?

  **9. Accessibility of the Rational Structure**
  If morality is rationally constituted by divine nature, can a secular ethicist access this structure without acknowledging the source? Is natural law possible on your view?
  *   **Follow-up:** If a secularist grasps the moral truth but misses the divine source, is the gap between their understanding and yours metaphysical, or is it merely epistemic underdetermination of the foundation?

  **10. Practical Ethics and Decision Making**
  How does this middle path change actual decision-making for a believer? When the rational structure isn't clear, how do they proceed without falling back into arbitrary voluntarism?
  *   **Follow-up:** When a believer is unsure of the right action, are they navigating metaphysical ambiguity, or are they dealing with merely epistemic underdetermination of the divine constitution?
