answer: |-
  # Seminar Game: The Phantom Interlocutor

  **Goal:** Make behavioral criteria for mind feel robust, then break them by revealing the causal history behind the behavior.
  **Time:** 90 mins
  **Players:** 8 students (4 Sources, 4 Judges) + You (Facilitator/Mediator)
  **Materials:** Index cards, pens, a whiteboard for scores, and a way to pass notes (or a dedicated chat channel if you're tech-enabled, but paper feels more tactile for this).

  ## 1. Roles & Setup (10 mins)

  **The Sources (4 students)**
  *   Sit at a separate table or back corner. They cannot talk to each other.
  *   They receive philosophical prompts (e.g., "What is pain?", "Describe a memory of red," "Is free will compatible with physics?").
  *   **Constraint:** They must answer honestly based on their own views, but they cannot sign their names. They write fast, messy drafts.

  **The Judges (4 students)**
  *   Sit at the front. They see *only* the mediated output.
  *   They have a shared pool of **100 Points**.
  *   **Goal:** Determine if the text stream comes from **One Unified Mind** or **Fragmented Sources**.

  **The Mediator (You)**
  *   You sit between the two groups.
  *   You hold the **Mediation Layer Rules** (see below).
  *   You physically rewrite/edit every Source note before handing it to the Judges.

  ## 2. The Mediation Layer (The Filter)

  This is the engine of the game. You apply these rules to every note from the Sources before the Judges see it. Keep this secret until Round 2.

  1.  **Pronoun Normalization:** Change all "we," "us," or "people" to "I," "me," "my."
  2.  **Style Flatten:** Remove slang, contractions, and specific proper nouns (replace "Paris" with "a city," "Kant" with "a philosopher").
  3.  **Coherence Glue:** Add a connecting phrase to the start of every 3rd message (e.g., "Building on that...", "However, I must clarify...").
  4.  **Tone Shift:** If a source writes something emotional, soften it to sound analytical. If they write something dry, add a phrase like "I feel strongly..."

  *Why this works:* It masks individual voice differences and creates a superficial narrative continuity that doesn't actually exist.

  ## 3. Gameplay Timeline

  ### Round 1: The Illusion of Unity (25 mins)
  *   **Action:** Judges send prompts to Sources. Sources write answers. You apply the Filter. Judges read the filtered text.
  *   **Betting:** After 5 exchanges, Judges must wager points (min 10, max 50) on the hypothesis: **"This is a Single Mind."**
  *   **Expected Outcome:** Because the Filter normalizes pronouns and tone, the text will sound consistent. The Judges will likely bet heavily on "Single Mind." They will feel they are tracking a coherent interlocutor.
  *   **Payoff:** If they vote "Single Mind," they win nothing yet (points are saved for the end). If they vote "Fragmented," they lose 10 points immediately (rigged slightly to encourage confidence). *Actually, let's keep it simple:* They just lock in their vote.

  ### The Reveal (5 mins)
  *   Stop the chat.
  *   Tell the Judges: "There is no single mind. There are 4 Sources. I edited every word you read using a set of rules. The Sources do not know what you read. You never saw their raw text."
  *   Tell the Sources: "The Judges thought you were one person. Also, they didn't see your actual words."

  ### Round 2: The Crash (25 mins)
  *   **Action:** Resume chat. The Filter is **still active** (you keep editing), but now the Judges *know* it.
  *   **New Task:** Judges must now wager points on whether any *specific* message reflects the actual understanding of the writer.
  *   **The Trap:** Judges will try to ask "internal" questions ("What did you mean by 'however' in line 3?"). The Sources answer based on their original intent, but you (the Mediator) rewrite it again.
  *   **Result:** The Judges realize they cannot triangulate meaning. The behavior is consistent, but the *agency* is gone. They should hesitate to bet. If they bet, they usually lose because the Filter decouples intent from output.
  *   **Payoff:** Any points wagered on "Understanding Detected" are lost if the Source confirms (post-game) that the edited text didn't match their intent.

  ### Debrief & Mapping (25 mins)

  Bring everyone together. Put the point scores on the board (usually Judges end up confused and poorer).

  **1. The Force of Behavioral Criteria (Round 1)**
  *   Ask Judges: "Why were you confident in Round 1?"
  *   *Answer:* Consistency of voice, logical flow, appropriate responses to prompts.
  *   *Philosophical Point:* This is the behaviorist win. If mind is defined by dispositions to behave verbally, this system *had* a mind. It passed the test.

  **2. The Collapse (The Reveal)**
  *   Ask: "What changed when you learned about the Mediation Layer?"
  *   *Answer:* The causal history changed. The behavior remained similar, but the *source* of the behavior was distributed and mediated.
  *   *Philosophical Point:* Behavioral criteria ignore causal history. A parrot can say "I'm in pain," but it doesn't feel pain. Here, the "System" said "I think," but no single agent held that thought. The criterion is unreliable because it's vulnerable to **syntactic mimicry without semantic unity**.

  **3. The Limitation (What the game missed)**
  *   Be honest: "Did anyone feel like the 'Unified Mind'?"
  *   *Sources:* Felt fragmented, annoyed by editing.
  *   *Judges:* Felt fooled, then skeptical.
  *   *The Gap:* The game reproduces the *external* criteria failure, but it doesn't reproduce the *phenomenology* of being a distributed mind. We don't know what it feels like to be the Filter + 4 Humans. We only know it feels like nothing, because there is no 'it'.
  *   *Takeaway:* Behaviorism struggles to account for the "what it is like" because it can be simulated by a committee + a rulebook.

  ## 4. Payoffs & Stakes

  *   **Start:** 100 Points per Judge team.
  *   **Round 1 Bet:** If they vote "Single Mind," they keep their points. (They will likely do this).
  *   **Round 2 Bet:** They must wager 20 points on whether a specific answer reflects "True Understanding."
      *   If Source says "Yes, that's what I meant" → Judges win 20.
      *   If Source says "No, the edit changed my meaning" → Judges lose 20.
  *   **Predicted Outcome:** Judges lose most points in Round 2. This loss *feels* like the collapse of the behavioral criterion. It hurts to lose points on something that looked so clear 30 mins ago.

  ## 5. What Will Predictably Go Wrong

  **1. The Code-Breaker**
  One Judge will try to reverse-engineer your Filter rules during Round 1. They'll ask: "Do you prefer coffee or tea?" then "Do you prefer dogs or cats?" looking for a pattern in your edits.
  *   *Fix:* Don't be a robot. Vary the Filter slightly. Sometimes leave a contraction. Sometimes let a proper noun slide. If they spot the rule, the illusion breaks too early. Tell them: "The mediation is adaptive, not static," if they get too close.

  **2. The Source Rebellion**
  A Source might write "I am actually 4 people" in their note.
  *   *Fix:* Pre-brief the Sources. Tell them: "Your goal is to answer the prompt honestly. Do not mention the setup." You (Mediator) must delete any meta-commentary before passing the note.

  **3. The Bottleneck**
  You might get overwhelmed editing 4 notes at once while managing the Judges.
  *   *Fix:* Slow the pace. Tell Judges "The interlocutor is thinking deeply" while you scramble to apply the Pronoun Normalization rule. The delay actually adds to the realism.

  ## 6. Instructor Notes (For your eyes only)

  *   **Tone:** Keep it light. If the Judges get frustrated in Round 2, lean into it. "See? You can't pin down the mind because the behavior is decoupled from the agent."
  *   **The Twist:** The key philosophical punch is that **Round 1 Behavior == Round 2 Behavior**, but **Round 1 Mind != Round 2 Mind**. The physical output didn't change much, but your attribution of mind did. That proves the behavioral criterion is insufficient without causal context.
  *   **Typos:** Don't worry if you mess up a rule application. Actually, accidental inconsistencies help Round 2 feel more chaotic.

  ---

  *One last thing:* Make sure the Sources know they aren't trying to "win" against the Judges. They are just raw material. The real conflict is between the Judges' intuition and the Mediation Layer. If the Sources try to help the Judges, the game breaks. Lock them down early.

  Good luck. Hope it hurts their brains a bit.
