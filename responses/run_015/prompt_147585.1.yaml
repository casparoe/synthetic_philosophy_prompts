answer: |-
  Dear friend,

  I appreciate you reaching out to settle this, and I want to start by saying that both you and Sam are arguing from positions that are intellectually respectable, even if neither of you is entirely right about the mechanics of how we actually work. It is a common frustration for us when people from hard science backgrounds look at what we do, because Sam is applying an epistemological standard that is appropriate for physics but impossible for history, while you are defending the validity of our method but perhaps overselling its precision. I am going to be very direct with you because you asked for an outside referee, and that means I need to correct some misconceptions on both sides without sparing feelings.

  The first thing I need to address is your request for a rough number, a percentage of Herodotus that survives correction as fact. I cannot give you this number, and neither can anyone else, and the reason why gets to the heart of why Sam is skeptical in the first place. It is settled consensus among historians of the ancient world that narrative sources like Herodotus or Thucydides do not contain errors distributed uniformly like a faulty measuring instrument. Your offset method assumes that if Herodotus is wrong by ten percent on the population of Egypt, he is likely wrong by a similar margin on the number of dead at Marathon, but that is not how human testimony works. Error in ancient historiography is thematic and structural, not statistical. An author might be meticulously accurate about geography because they traveled, completely fabricated about troop numbers because they are using round figures for rhetorical effect, and deeply biased about political motives because they are writing for a specific patron. There is no calibration constant we can apply. So on the specific question of whether we can quantify the share of fact, Sam is closer to the truth simply because the data does not exist to generate that statistic, but he is wrong to conclude that therefore nothing is known.

  Regarding the specific methodological tools you mentioned, there is a mix of settled practice and overconfidence here. You are correct that source criticism involves analyzing agenda, genre, and audience. It is standard professional practice to treat ancient texts not as transparent windows but as constructed arguments. However, your description of subtracting distortion to leave the facts implies that the facts are sitting there underneath the bias waiting to be uncovered like a statue under marble dust. In my own judgment, and this is contested by some more positivist colleagues, the bias is often constitutive of the fact. For example, if Herodotus reports a omen before a battle, the fact that the battle happened is one layer, but the fact that the participants believed the omen mattered is another layer of historical truth that you lose if you just subtract the supernatural element as error. So when you talk about extracting facts, you have to be clear that we are often reconstructing beliefs and perceptions rather than just event chains.

  The criterion of embarrassment, which you cited as your gold standard, is a tool we do use, but it is not as infallible as you seem to think. It is generally agreed that passages where an author admits a defeat or a moral failing on their own side are more likely to be grounded in reality than triumphalist propaganda, because there is less incentive to invent them. However, it is also contested how far this goes. An author might include an embarrassing detail to set up a redemption arc, or because the event was too widely known to deny, or to show that despite the setback, their side prevailed anyway. So while it is a useful heuristic, it is not a logical proof. I would say you are right to use it, but wrong to treat it as a guarantee of factuality.

  Now let us look at the Herodotus versus Thucydides debate, because this is where Sam's physics background is leading him astray. Sam argues that Thucydides marks the start of real history because he admits to composing the speeches. This is a common reading of Thucydides book one chapter twenty-two, but it is actually a point of significant contention among specialists. Thucydides says he made the speakers say what was necessary, which is an admission of invention, not necessarily verification. He is claiming to represent the general sense of what was said, not the transcript. Herodotus, on the other hand, when he says he is bound to report what is told to him, is not just being passive. It is settled among modern scholars that Herodotus is often engaging in a critical inquiry, using phrases like I am bound to report but not bound to believe to signal to his audience that he is aware of the reliability issues. So your defense of Herodotus is closer to the current scholarly consensus, which has rehabilitated him significantly over the last fifty years, whereas Sam's view of Thucydides as the objective scientist is a nineteenth-century interpretation that most of us have moved away from. Thucydides is more analytical, but he is not necessarily more factually accurate in terms of raw data, and his speeches are largely literary constructions.

  On the broader epistemological clash, Sam is right that testimony you cannot check is inherently weaker than testimony you can. It is a settled fact that where we have epigraphic evidence or archaeological data to cross-check the literary sources, the literary sources are often wrong on specifics like dates, numbers, and sometimes names. However, his conclusion that this makes the whole enterprise worthless literary appreciation is where he loses the argument. History is not about certainty in the way physics is. It is about probability and coherence. When we say we know something about the past, we mean that it is the most probable explanation for the converging lines of evidence, which include texts, archaeology, numismatics, and environmental data. We do not claim verification in the laboratory sense. So you are right that there is a real method here, but you need to accept that the output of that method is not hard fact in the way Sam wants it to be. It is a reasoned argument about likelihood.

  To give you a direct verdict on who was closer, I would say you are closer on the practice of the discipline, but Sam is closer on the philosophical limitations of the evidence. You correctly identified that we have tools to extract reliable information, such as cross-referencing, contextual analysis, and yes, looking for counter-intuitive details. But Sam is correct that we cannot verify these in the distant past in the way we verify a physical law, and therefore our claims to knowledge are always provisional. The mistake you made was trying to quantify this with an offset method, which suggests a precision we do not possess. The mistake Sam made was assuming that lack of verification equals lack of knowledge. In my professional judgment, the truth lies in accepting that historical knowledge is probabilistic. We can say with high confidence that the Persian Wars happened, that the Greeks won, and that certain key battles took place. We cannot say with confidence exactly how many men died or exactly what was said in the command tents.

  I want to be explicit about where I am speaking from consensus and where I am offering my own view. It is consensus among classical historians that Herodotus is more reliable than previously thought and that Thucydides is not immune to bias or invention. It is consensus that we cannot apply statistical error margins to narrative texts. It is contested how much weight to give the criterion of embarrassment, though most agree it has some value. My own judgment is that you should stop trying to defend history as a science of facts and start defending it as a science of probabilities. If you tell Sam that we are building the most probable model of the past based on fragmented data, much like a cosmologist models the early universe based on radiation remnants rather than direct observation, he might respect the methodology more. You both walked away thinking you won because you were arguing past each other on what knowledge means. You thought knowledge meant justified true belief based on method, and he thought knowledge meant verified empirical data. In our field, we accept the former because the latter is impossible.

  So to answer your final question on how much of Herodotus survives correction, the answer is not a percentage. It is a mosaic. Some parts are solid, some are speculative, and some are myth. We know which are which not by applying a correction factor, but by arguing each case on its own merits using the tools you described, minus the quantitative expectation. You were right to trust the method, but you need to temper your certainty. Sam was right to demand evidence, but he needs to understand that in history, evidence is rarely conclusive. I hope this helps you two move past the stalemate, because honestly, the tension between your optimism and his skepticism is exactly the tension that keeps the discipline healthy. We need people pushing to extract meaning and people pushing to check the claims, even if it means you both have to admit you only partially won.

  Best regards,

  Your Colleague
