  ### The Principle: Validated Constraint Minimization

  **Clause 1 (Minimization):** When new input arrives, the new credence function $P_{new}$ is the unique minimizer of the Kullback-Leibler divergence $D_{KL}(P_{new} || P_{old})$ subject to a set of constraints $C$.
  *   *Motivated by:* **Case 1** and **Case 2**. This generalizes Jeffrey Conditionalization (which minimizes divergence subject to marginal constraints) to allow for constraints on conditionals or other functions of probability, provided they are in $C$.

  **Clause 2 (Validation):** A constraint is admissible in $C$ only if it originates from a source with a provenance reliability score $r > 0$. Shifts caused by known cognitive impairment (e.g., intoxication) have $r=0$ and generate no constraints. Shifts caused by meta-evidence about past reliability (e.g., retrospective exhaustion) constitute new evidence $E$, generating a constraint $P(H|E) = k$.
  *   *Motivated by:* **Case 5a** (Wine, $r=0$) and **Case 5b** (Exhaustion, new evidence $E$). This also explains **Case 6**: the expert's report carries high $r$ due to likely independent evidence; the peer's report carries low $r$ regarding the hypothesis because their evidence is not independent of yours.

