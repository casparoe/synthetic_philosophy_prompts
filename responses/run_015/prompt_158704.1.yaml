      **Conditions:** 1) Mandatory informed consent detailing the allocation mechanism at admission. 2) Fixed review in six months to verify model outcomes against actual mortality.

      **Reasoning:**
      The committee divides over whether the separateness-of-persons objection forbids sacrificing an identifiable resident now for gains later. I argue the objection constrains the shape of a whole life, not each distribution. Persons are temporally extended entities. If a policy benefits the persisting person over time, internal trade-offs are permissible. The resident is not a series of disconnected moments but a single life-course. Maximizing that life-course serves the resident's own interest, even if specific weeks involve deprivation.

      However, the opposing view holds a stronger position than mere uncertainty. Their argument is not about ignorance of who loses, but about the finality of loss for those who die. If a resident is sacrificed at week two, they do not exist to collect the compounded benefits at week twenty. The "expected" life-months are a statistical average across the population, not a guarantee for the individual who dies early. For the deceased, the separateness objection remains fatal: their life was truncated to serve the aggregate, even if the aggregate included their own future potential that never materialized. They cannot be compensated by a future they never reach.

      This creates a tension between rational ex ante acceptance and ex post catastrophe. The aggregative protocol is morally permissible only if residents accept the risk of being the "dead loser" in exchange for the higher probability of a longer life. Therefore, reauthorization requires explicit consent. Residents must know that while the protocol favors their long-term survival, it may identify them for immediate withdrawal based on marginal utility.

      **Admission Disclosure:**
      At admission, residents or proxies must be told: "This unit allocates nursing hours to maximize each resident's total expected survival time. This means hours may shift away from you during critical dips, risking immediate death, to preserve capacity for your own recovery or others' needs. Statistically, this offers you the best chance of long-term survival, but it removes the guarantee of continuous care."

      **Conclusion:**
      We reauthorize because the life-course benefit is real, but we condition it on transparency. The separateness objection is answered by the persistence of the person, but only if the person voluntarily accepts the risk of non-persistence.

