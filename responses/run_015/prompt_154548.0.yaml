      *   *Bedrock Intuition:* The "Just Pixels" guy likely holds a physicalist intuition: *Only matter/energy is fundamentally real.* The Realist holds a social-ontological intuition: *Social facts are real facts.* These are hard to bridge without agreeing on a framework.
      *   *Test Cases:*
          *   Case 1 (Permanent): Hits the "Just Pixels" guy hard (emotional investment).
          *   Case 2 (Restored): Hits the "Harm as End State" vs. "Harm as Act" debate. Good for separating Conventionalist from Realist.
          *   Case 3 (Procedural): Hits the "Authorial Intent" requirement (Fictionalist).
          *   Case 4 (Exit Costs): Crucial empirical check. If exit is costly, "just log off" fails as a moral solution.

  4.  **Formulate the Response:**

