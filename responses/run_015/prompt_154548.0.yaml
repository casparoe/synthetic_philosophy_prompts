      *   *What about progress?* Progress isn't necessarily consensus on truth, but consensus on *how to treat each other*.

  7.  **Final Polish:** Structure the answer clearly with headings matching the user's questions. (Is the hypothesis right? Is it verbal? Bedrock intuition? Do cases work? What counts as progress?)

      *(Self-Correction during drafting)*: Make sure to emphasize that Case 2 is the most philosophically potent for separating the *nature* of harm, while Case 4 is the most potent for silencing the "Just Pixels" argument pragmatically.

