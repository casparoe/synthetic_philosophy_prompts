      *   **Topic:** Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA), centered on Nick Bostrom's "Presumptuous Philosopher" thought experiment.
      *   **Format:** Teaching Plan (90 minutes), *not* a lecture script.
      *   **Constraints:**
          1.  Precise dependency order of conceptual pieces.
          2.  One concrete carrying scenario (modified ecological field-survey, no multiverse/cosmology, observer finds herself alone in an archive of unrecorded census sheets).
          3.  Predictable misconceptions at each stage (specifically: self-locating vs. ordinary Bayesian conditioning; SIA vs. moral obligation to maximize population) + interception instructions.
          4.  Closing diagnostic question (tests structural understanding of the Presumptuous Philosopher flaw, not just empirical risk).
          5.  Explicit statement of refused technical apparatus (no formal SIA derivation, no simulation argument literature, etc.).
          6.  No assigned readings, citations, or bibliographies.

  2.  **Deconstruct the Core Conflict (SSA vs. SIA):**

      *   *SSA:* Reason as if you are a random sample from the set of *actual* observers in your reference class. (Focus: "Where am I in the history?")
      *   *SIA:* Reason as if you are a random sample from the set of *possible* observers, weighted by the probability of their existence. (Focus: "How likely is a world that contains me?")
      *   *Presumptuous Philosopher:* A philosopher claims a theory predicting trillions of observers is vastly more likely than one predicting billions, *solely* because there are more observers to be sampled from (SIA), even without empirical evidence.
      *   *Audience Bias:* They lean towards "More observers = More data = Better theory" (Verification bias) and "Selection bias is just $N$-dependent error."

