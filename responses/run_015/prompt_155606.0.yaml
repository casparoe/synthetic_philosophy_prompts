              *   You are a field team leader. You find yourself in the central archive. You don't know how many other teams exist.
              *   *Crucial Detail:* The "unrecorded census sheets" implies the data on *other* observers is missing.
              *   *Let's go with:* You are the sole occupant of a remote field station archive. You find two possible deployment rosters (Theory S vs. Theory L). You find your own name on both. The rest of the roster is blank/unrecorded.
              *   *Wait, to make SIA/SSA clash:*
