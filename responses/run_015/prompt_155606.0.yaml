          *   **Hypothesis S (Small):** The forest is small. Protocol dictates 10 auditors visit over the decade.
          *   **Hypothesis L (Large):** The forest is vast. Protocol dictates 10,000 auditors visit over the decade.
          *   **Observation:** You are an auditor. You are currently present. You have no memory of how many others came before or will come after. You find a logbook that *would* have listed them, but it's blank/unrecorded except for your presence.
          *   *Correction:* The prompt specifies "archive of unrecorded census sheets." Let's stick close to that.
          *   *Final Scenario Design:* You are a data clerk in a sealed archive. Two competing theories about the "Generation of Clerks."
