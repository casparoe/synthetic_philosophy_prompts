          *   Conflict: Does your presence favor the Common model (because more surveyors would be hired, making your presence more likely *a priori*)?
      *   *Misconception Interception:*
          *   When they say "More surveyors means more data," stop them. This isn't about data *quality*, it's about the probability of *you being the one holding the clipboard*.
          *   When they say "We should hire more surveyors," stop them. This is about belief, not policy.
      *   *Diagnostic Question:* Needs to target the *structural* flaw. The Presumptuous Philosopher wins a bet against empirical evidence. The question should ask: "If we open the door and count 10 surveyors, does the SIA argument retroactively become invalid, or was it invalid *before* we opened the door?" (Answer: It was structurally invalid because it allowed armchair reasoning to trump empirical priors).
      *   *Better Diagnostic:* "If Theory L predicts 1 trillion observers and Theory S predicts 1 billion, and you have zero empirical evidence other than your own existence, does SIA compel you to bet 1,000,000,000 to 1 on Theory L? If yes, why is this distinct from guessing the lottery winner because more tickets were sold?"

      *   *Wait, the prompt asks for:* "why the presumptuous philosopher's inference is structurally flawed rather than merely empirically risky."
      *   *Key distinction:* It allows priors to be swamped by observer counts alone, decoupling belief from physical evidence.
      *   *Diagnostic:* "If SIA is valid, can a theory with *lower* physical likelihood ever be preferred solely because it predicts more observers? If so, what prevents 'magical' theories that predict infinite observers from winning?"

  8.  **Final Review against Constraints:**

      *   Teaching Plan? Yes.
