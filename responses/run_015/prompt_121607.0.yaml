prompt: |-
  hey — i'm a novelist drafting a book about a town that wont talk about a factory fire from the 1890s, and i'm trying to sort my own ethics before i write the fictional parts. i read margalit on memory ethics and rieff's old therapeutic-culture stuff, but i dont want citations or a syllabus — just help ordering my gut.

  here are my verdicts on concrete cases. tell me what principle, if any, captures them, where it breaks, and which call i have to drop.

  1. a town keeps a monument to the fire that killed thirty workers, but scrubs the factory owner's name off the plaque. feels like cheap forgiveness — wrong.
  2. a survivor burns her private trauma journal after therapy ends. i think that's her right. call it mnemonic sovereignty: she owns her past.
  3. a government runs "reconciliation days" for a camp system but seals all archives for 75 years. feels like branding, not remembering — wrong.
  4. my editor says i should rename the real village in my novel so i dont "exploit" survivors. i feel that's asking me to do their forgetting for them — wrong.
  5. parents tell their kid her dead brother was "gentle" when he was violent and cruel. that's lying, not healthy forgetting — wrong.
  6. a historian proves a resistance hero betrayed one comrade and publishes it. right, even if it shatters the myth.
  7. but then there's a minor bureaucrat who delayed deportation papers and saved dozens, though his name still appears on victim lists. his descendants beg the historian to omit him from an exibit. part of me wants to protect them; part of me thinks that's narrative bankruptcy — erasing complicity to save feelings. i keep going back and forth.

  is there a coherent principle behind 1–6? what does it say about case 7, the one i wobble on? and if no principle saves every call, which verdict should i overturn?

  please answer in these sections, roughly these lengths:

  - The pattern in my gut (about 200 words): summarize what connects my yes/no's and name any invented idea like mnemonic sovereignty or narrative bankruptcy if it helps.
  - The principle, stated precisely (about 250 words): state the rule, show which case motivates each clause, and apply it to case 7.
  - The hard pair and the repair (about 150 words): focus on the tension between case 6 (publish the betrayal) and case 7 (protect the bureaucrat's family). say whether a cleaner principle saves 6 at the expense of 7 or vice versa.
  - Two fresh predictions (about 150 words): apply the principle to (a) a government that destroys all records of a false accusation that ruined an innocent man's life, and (b) a survivor who demands her dead abuser be named in every school textbook.
  - The verdict i'd have to drop (about 100 words): be honest. if your principle cant save all seven, say which one goes and why.

  write it casually — i'm asking a friend over coffee, not writing a grant.
