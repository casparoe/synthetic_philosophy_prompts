answer: |-
  1. The implicit theory presupposes that moral standards emerge from maintaining the vitality of specific relationships rather than adhering to abstract universal laws. Remonstration serves the relationship's health, while concealment protects its boundary, meaning both acts aim at preserving the relational fabric itself.
  2. Strictly presupposed is the commitment that the relationship itself holds jurisdiction over moral adjudication, but the stronger claim that no individual exists prior to relations only sits comfortably with the practice. One can maintain the duty to correct and conceal without denying individual agency, provided relational obligations override external reporting duties.
  3. A utilitarian could license both halves by arguing that family trust is the indispensable seedbed of social stability, making concealment instrumentally valuable despite immediate wrongdoing. Similarly, an individualist could generate these duties as special contractual obligations incurred by intimacy, though this treats the relationship as a choice rather than a constitutive fact.
  4. The duty to conceal does more work here, as it requires an extra commitment about the family's jurisdiction that a generic role picture does not automatically deliver. Without this jurisdictional boundary, the duty to correct would naturally escalate outward like modern professional codes rather than stopping at the relationship's edge.
  5. If replaced by an individualist picture, the duty to correct becomes a matter of upholding universal rights, and concealment transforms from uprightness into potential obstruction of justice. The practice would shift from preserving relational harmony to balancing competing duties between private loyalty and public accountability.
