  10. **Polishing the Language:** Ensure terms like "standing," "epistemic access," and "normative authority" are used precisely within the hypothetical framework. (Self-Correction: Make sure to explicitly name the tension as requested: "self-undermining authorization.")

  11. **Final Polish:** Check the flow. Start with the case, then apply the RCS logic, then reveal the tension, then analyze the implication. (Proceed to generate output).

