  The classifier analogy is the pivot. Alex thinks it demonstrates successful merger (intersection). Long reappropriates it to show separate processing tracks, arguing the 'merge' is a functional fiction that obscures the dual reference. Alex gets caught here: if the tracks are separate, the 'object' is indeed a constructed unity, not a given.

  However, Alex quietly imports a Fregean assumption that sense determines reference seamlessly. Long assumes names map directly to distinct *shi* (actualities) that resist blending. The modern view assumes logic saves the phenomenon; Long suggests the phenomenon (the merge) is the error. Alex assumes the classifier's output *is* the object; Long sees it as a useful error.

