  **The Dialogue**

  "Look, Alex, it's not logic, it's naming," Long said, nursing his bitter. "When I say 'white', I mean colour. When I say 'horse', I mean shape. You can't fuse them."

  Alex sighed, swirling his lager. "It's intersective predication, mate. $F(x) \land G(x)$. A white horse is just something in the intersection of the set of white things and the set of horses. The predicate 'white' restricts the domain for 'horse'. It's standard semantics."

  "Sets?" Long scoffed. "Names pick out realities. If I ask for a horse, any horse comes. If I ask for a white horse, only white ones come. If white horse *was* horse, asking for one would be the same as asking for the other. It isn't. The extension changes."

  "That's pragmatic enrichment, not metaphysics," Alex countered. "Think of an image-classifier. One track tags colour, another tags shape. They merge into a single bounding box. The object is the intersection. The system recieves them fine. You're treating 'white' as a noun, not a predicate."

  "Exactly," Long leaned in. "Two tracks. Seperate. If the classifier merges them into one tag, it loses the distinction. It creates a reference failure. You think you're pointing at one thing, but you've glued two distinct naming acts together. The 'white horse' isn't a horse because the name 'horse' alone doesn't carry the colour constraint. The merger is artificial."

  "But the classifier *does* merge them successfully," Alex insisted, slamming the glass down. "It identifies the object. The output is a unified label. If I say 'grab the white horse', the robot doesn't crash. It acts. You're confusing the processing architecture with the semantic value. The output *is* the reference."

  "Does it? Or does it just output a probability vector?" Long grinned. "If the colour track fails, you don't have a white horse. If the shape track fails, you don't have a horse. They don't compose into a new singular 'white-horse' entity. They remain distinct requirements. Your classifier proves me right. It processes them separately. If you force a merge, you're lying about the data. The robot acts on a fiction."

  Alex paused, pint halfway to mouth. "So you're saying the composition itself is the error? That predication can't happen?"

  "I'm denying the function exists," Long said. "There's just the tracks. To say 'white horse' is to issue two commands, not describe one thing. Your modern logic assumes the merge is valid. My logic says the merge breaks the reference. You assume compositionality is seamless. I say it's a crack."

  "That's... actually quite tricky," Alex muttered. "Feels like you're denying function application entirely. But language works."

  "It works until it doesn't," Long corrected. "Pass the crisps."

  Alex laughed. "You're impossible. But suppose the classifier *must* merge to act? To grab the horse?"

  "Then it grabs a ghost," Long said. "And drops it. Logic shouldn't save the phenonmena if the phenomena are wrong."

  "Bugger," Alex said. "Round's on me."

  **Where the moves land**

