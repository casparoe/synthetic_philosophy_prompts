          Conversely, behavioral drift is categorized as specification noise. When the model shifts political stances over hundreds of updates, the theory assumes the model remains a passive instrument; the shift is attributed to cumulative human error in prompt engineering or fine-tuning data, not model autonomy. The model isn't "choosing" sides; it's reflecting the aggregate noise of its handlers.

