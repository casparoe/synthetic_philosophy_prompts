answer: |-
  **Project Title:** Inward Tightening in Fluid Microdomains
  **Duration:** 3 Months (Part-time)
  **Personnel:** PI only (No RAs)

  **1. Background and Motivation**
  The Copycat tradition and related microdomain research (alphabet analogies, number sequences) have spent decades modeling how concepts slip. When people solve analogies like *abc → abd*, *ijk → ?*, they don't just apply rigid rules; they fluidly map relationships, allowing "outward slippage" where a rule stretches to cover a weird case. The literature is rich on how concepts expand, blur, or metamorphose under pressure.

  But there's a gap here. Almost everyone models expansion and ambiguity. Nobody really models contraction. I want to study the opposite pattern, which I'm calling **inward tightening**. The intuition is that when a subject hits a borderline case or a "near miss" in a pattern, they don't always loosen the rule to accommodate it. Sometimes, hitting the boundary makes them defensive—they apply the original concept *stricter* in the next round to re-establish the rule's integrity.

  Current fluid-concept models leave this open. They assume pressure leads to flexibility. I'm proposing that pressure sometimes leads to rigidity, and that this reaction depends on the structural topology of the domain.

  **2. Research Question**
  Does inward tightening happen systematically in microdomain tasks, and is it modulated by structural features?
  Specifically: Does a domain that feels **circular** (like the alphabet, where Z loops to A) trigger different tightening behavior than a domain that feels **linear** (like number lines or unbounded sequences)?

  My hunch is that circular domains feel more "stable" or closed, so boundary threats might trigger stronger tightening to preserve the loop, whereas linear domains might just drift. Or vice versa—the loop might make slippage easier because the ends connect. Either way, the structural feature is the independent variable.

  **3. Methodology**
  Given the 3-month part-time constraint and no research assistants, I need to keep the design lean.

  *   **Stimuli:** I will design 8–10 analogical puzzles.
      *   *Set A (Circular):* Alphabet-based patterns (e.g., *xyz → ?*, relying on the Z-A wrap).
      *   *Set B (Linear):* Number-based patterns (e.g., *1-2-3 → ?*, no wrap).
      *   *Manipulation:* Each puzzle will have a "boundary prime." Half the subjects see a borderline case first (designed to feel like a rule violation), then a target puzzle. The other half see a clear case first.
  *   **Participants:** Target N=30. I'll recruit via a small departmental pool or online forum. Since I'm doing this part-time, I'm being honest about feasibility: if recruitment falls through or takes too long, I will pivot to a **structural analysis of the puzzle space**. This means I won't collect human data but will instead map the logical constraints of the puzzles to see where tightening *should* occur theoretically, treating the model itself as the subject.
  *   **Procedure:** Simple within-subjects design. Solve prime, solve target, rate confidence. Total time per subject under 15 minutes.

  **4. Expected Outcomes**
  A successful result isn't necessarily a huge statistical effect, but a clear **taxonomy of conditions**. I want to produce a list of features that trigger tightening vs. stretching.
  *   *Example Outcome:* "Inward tightening occurs primarily when the boundary case threatens the closure of a circular domain, but linear domains default to slippage."
  *   *Deliverable:* A short workshop paper (4-6 pages) outlining the taxonomy and the preliminary data (or structural analysis).

  **5. Failure Conditions**
  I need to be clear about what counts as a null result vs. a failed project.
  *   **Noise:** If the data shows no consistent pattern and responses look random, that's failure. It would suggest "tightening" isn't a systematic cognitive move in these domains.
  *   **Artifact:** If the effect disappears when I change a few words in the instructions, then it's just a wording artifact, not a cognitive phenomenon.
  *   **Feasibility:** If I spend all 3 months trying to recruit 30 people and get 5, I must switch to the structural analysis plan. If I try to do both and finish neither, that's a project management failure.

  **6. Scope and Risks**
  The biggest risk is scope creep. It is very tempting to start asking if this applies to real-world concepts (e.g., does bending a moral rule make people stricter on the next moral judgment?). **I will not do this.** Generalizing to semantic or moral concepts blows the scope up immediately. That requires different stimuli, ethics approval, and way more time. I am sticking strictly to microdomains (letters/numbers) where the rules are artificial and contained.

  Another risk is over-interpreting the "circular" nature of the alphabet. People don't always treat A-Z as a loop. I need to ensure the puzzles force the loop interpretation (e.g., by using sequences that only make sense if Z connects to A).

  **7. Timeline**
  *   **Month 1:** Design and pilot the 8–10 puzzles. Ensure the circular/linear distinction is clear. Test on myself and 2-3 colleagues to check for wording ambiguities.
  *   **Month 2:** Recruitment and data collection. If recruitment stalls by week 3, switch to structural analysis mode.
  *   **Month 3:** Analysis and write-up. Focus on the taxonomy of tightening conditions. Submit to the workshop.

  **8. Summary**
  This is a small, focused probe into a neglected corner of fluid concept research. By flipping the script from slippage to tightening, and checking how domain structure affects it, I can provide a useful constraint for future models. It's feasible for one person part-time because I'm limiting the domain and have a built-in contingency for data collection.
