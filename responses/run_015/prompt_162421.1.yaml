      *   **Specific Constraints:**
          *   Rank defeaters from fatal to merely awkward.
          *   Identify which points a defender of the user's view should concede.
          *   Address four specific sub-questions (Forager bias, Population ethics, Coherence of "mistake", Skeletal evidence).
          *   Critique the falsifiability/sharpness of the user's position.
          *   End with a personal betting statement (which defeater is strongest, where reasoning is shakiest, what would change my mind).
