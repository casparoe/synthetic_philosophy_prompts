      *   **Specific Questions:**
          1.  Is this one phenomenon or several? If several, what distinguishes them?
          2.  What are the nearest established concepts, and why do they fail to fit?
          3.  If nothing fits, provide a name, definition, and boundary cases.
          4.  What would a non-ad-hoc constraint on the implementation relation look like?
          5.  Does this tell against computational criteria specifically, or structural criteria generally?
      *   **Goal:** The user needs a conceptual "carving" to decide whether to organize a dissertation chapter around this. They need depth, precision, and philosophical lineage, not just a label.

  2.  **Deconstruct the Three Cases:**
      *   *Redundancy:* 100 lockstep copies. Is it 1 mind or 100? (Multiplication vs. Identity).
      *   *Scatter:* Computation spread over space/time (e.g., weather, wall). Is it implemented or not? (Triviality/Pancomputationalism).
      *   *Sharing:* Overlapping realizers for distinct computations. Is it 1, 2, or 0 subjects? (Individuation/Overlap).
      *   *Common Thread:* The "Implementation Relation" is indeterminate or gerrymandered. The *count* of subjects depends on the *description/mapping*, not the physics alone.

  3.  **Identify Established Concepts & Literature:**
      *   *Multiple Realizability:* Related, but usually about one function/many substrates, not one substrate/many functions (or counts).
      *   *Triviality Results (Putnam, Searle):* Specifically addresses the "Wall/Weather" case (Scatter). Putnam's "rock implements every finite state automaton."
      *   *Individuation of Minds:* Parfit's fission cases (Redundancy), but usually psychological continuity, not computational mapping.
      *   *Computational Indeterminacy:* This is the strongest candidate. Rescorla, Piccinini, Sprevak.
      *   *The "Mapping Problem":* The core issue in computational functionalism. How do we map physical states to computational states without arbitrariness?
      *   *Moral Mathematics:* Parfit's "No Difference View," but applied to subject counting.

  4.  **Synthesize: One Phenomenon or Several?**
      *   *Argument for One:* They all stem from the *underdetermination of the implementation relation*. The physical facts don't fix the computational facts uniquely.
      *   *Argument for Several:* Redundancy is about *counting* (numerical identity), Scatter is about *existence* (triviality), Sharing is about *individuation* (boundaries).
      *   *Verdict:* It is best treated as one underlying metaphysical/semantic problem (**Computational Indeterminacy**) manifesting in three distinct modalities relevant to moral counting. Calling it one phenomenon allows for a unified solution (or dissolution). Calling them separate might obscure the root cause (the mapping relation).
      *   *Refinement:* The user suspects it's "one thing." I should validate this but distinguish the *modes* of manifestation. The core is **Implementation Indeterminacy**.

  5.  **Drafting the Response - Section by Section:**

      *   **Diagnosis (One vs. Several):** Validate the user's intuition. It is one underlying problem: *The Indeterminacy of the Implementation Relation*. However, the three cases target different *consequences* of that indeterminacy (Counting, Existence, Individuation).
      *   **Established Concepts:**
          *   *Putnam's Triviality Theorem:* Fits Scatter perfectly. Fails Redundancy/Sharing.
          *   *Piccinini's Mechanical Computation:* Attempts to solve Scatter via causal mechanisms. Might be too restrictive for functionalism.
          *   *Rescorla's Semantic View:* Computation requires representational content. Solves Scatter, maybe Sharing, tricky on Redundancy.
          *   *Parfit's Fission:* Fits Redundancy, but assumes psychological continuity, not computational mapping.
          *   *Sprevak's "Computational Functionalism":* Discusses the mapping problem directly.
      *   **Naming and Defining (If new):**
          *   Name: **Computational Indeterminacy of Patienthood** (or *Implementational Indeterminacy*).
          *   Definition: The failure of physical facts to uniquely determine the number, boundaries, or existence of computational systems under a functionalist description, where the variance alters moral status without altering morally relevant physical/phenomenal facts.
          *   Boundary Cases: Need cases that look like this but aren't. (e.g., Vagueness of biological organisms, Standard Multiple Realizability).
      *   **Non-Ad-Hoc Constraints:**
