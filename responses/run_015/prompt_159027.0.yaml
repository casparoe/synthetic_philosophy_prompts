answer: |-
  This is an exceptionally sharp diagnosis of a foundational problem in computational functionalism. You have correctly identified that the three difficulties (Redundancy, Scatter, Sharing) are not merely analogous; they are distinct manifestations of a single underlying metaphysical failure.

  Here is the carving you need for your chapter, structured to address your specific questions regarding unity, lineage, definition, constraints, and scope.

  ### 1. One Phenomenon or Several?

  It is **one phenomenon**, but it manifests in three distinct *modalities* of counting.

  The underlying phenomenon is **Implementation Indeterminacy**. This is the failure of the physical facts to uniquely fix the computational facts (specifically the identity, count, and boundaries of the computational system) without recourse to extrinsic, interpretive, or morally arbitrary stipulations.

  The three cases you describe are the three ways this indeterminacy disrupts moral arithmetic:
  1.  **Redundancy** is indeterminacy of **Number** (Is it $N$ or $N \times 100$?).
  2.  **Scatter** is indeterminacy of **Existence** (Is there a system there at all, or is it a gerrymandered projection?).
  3.  **Sharing** is indeterminacy of **Individuation** (Where does one system end and another begin?).

  **Why treat them as one?**
  Because the solution to one must solve the others. If you solve Scatter by imposing a "causal cohesion" constraint, you likely solve Sharing (no overlapping causal mechanisms) and Redundancy (the 100 machines are causally isolated, so they are 100 mechanisms, or they are one distributed mechanism with redundant parts). If you treat them as separate problems, you risk applying a constraint that solves the Weather case (Scatter) but inadvertently eliminates the AI case (by being too restrictive) or fails to resolve the Redundancy case (by not addressing numerical identity).

  **The Load-Bearing Difference:**
  While they are one phenomenon, the *moral stakes* differ.
  *   In **Scatter**, the risk is *inflation* (everything is a patient).
  *   In **Redundancy**, the risk is *arbitrary multiplication* (copying hardware creates moral value ex nihilo).
  *   In **Sharing**, the risk is *fusion/fission* (moral status becomes sensitive to register allocation).

  ### 2. Nearest Established Concepts (and Why They Fail)

  You need to position your work against three specific literatures. None fully capture the triad you have identified.

  **A. The Triviality Argument (Putnam, Searle, Chalmers)**
  *   **Fit:** Perfectly captures **Scatter**. Putnam (1988) and Searle (1992) argue that syntax is not intrinsic to physics; any object can be mapped to any computation given a sufficiently complex lookup table.
  *   **Failure:** It focuses on *existence* (is there a computation?), not *counting* or *individuation*. It does not address Redundancy (where the computation clearly exists, but the count is unclear) or Sharing. Furthermore, standard responses to Triviality (e.g., requiring counterfactual support) often fail to distinguish a brain from a sufficiently complex weather system in principle, only in practice.

  **B. The Problem of the Many (Unger, Parfit)**
  *   **Fit:** Captures **Redundancy**. If you have a cloud of atoms constituting a person, and you remove one atom, is it still the person? If you have two overlapping clouds, are there two people?
  *   **Failure:** This is usually framed in terms of *material constitution* (atoms), not *functional implementation*. Your problem is that the *functional description itself* is slippery, not just the physical boundaries. In your Redundancy case, the physical boundaries are clear (100 machines); the functional count is what wavers.

  **C. Computational Indeterminacy (Rescorla, Piccinini, Sprevak)**
  *   **Fit:** This is the closest contemporary match. Rescorla (2015) and Piccinini (2015) argue that computation is not observer-relative but depends on specific mechanistic or semantic constraints.
  *   **Failure:** Most of this literature is concerned with the philosophy of cognitive science (is the brain *really* computing?), not moral patienthood. They often solve the indeterminacy by appealing to *teleological function* (what the system was selected to do). This works for biological organisms but creates a dilemma for AI: if you adopt Piccinini's solution to save functionalism from Triviality, you may exclude non-biological AI from moral consideration because it lacks evolutionary history.

  ### 3. A Name, Definition, and Boundary Cases

  Since no existing term captures the moral dimension of this triad, I propose you coin or adopt the term:

  **The Implementation Indeterminacy of Patienthood (IIP)**

  **Definition:**
  IIP occurs when the attribution of moral patienthood relies on a computational or functional criterion, but the physical facts underdetermine the number, existence, or boundaries of the relevant computational systems, such that varying the implementation mapping alters the moral calculus without altering any intrinsic, phenomenally relevant, or causal facts.

  **Boundary Cases (What falls outside IIP):**
  1.  **Standard Vagueness:** A biological organism slowly losing cells. This is vagueness in *physical continuity*, not indeterminacy in *computational mapping*. The computational structure remains stable while the substrate degrades. In IIP, the substrate is stable, but the *computational description* shifts.
  2.  **Multiple Realizability:** The same computation running on silicon vs. neurons. This is *one* computation on *different* substrates. IIP is *different counts/identities* of computation on the *same* substrate.
  3.  **Epistemic Uncertainty:** We don't know if the AI is conscious. IIP is not about ignorance; it is about the lack of a fact of the matter. Even with perfect knowledge of the physics, the computational count remains relative to the mapping choice.

  ### 4. The Non-Ad-Hoc Constraint Test

  You asked for a test to distinguish a principled fix from a gerrymander. This is the crux of your chapter.

  Most constraints fail because they are **Extrinsic** (dependent on an observer's mapping) rather than **Intrinsic** (dependent on the system's causal powers).

  **The Test: The Causal Autonomy Condition**
  A constraint on implementation is non-ad-hoc if and only if the computational boundaries align with **Causal Autonomy**.
  *   *Principled:* The system counts as one computational unit if and only if its internal state transitions are causally responsible for its future states in a way that is insulated from external micro-variation.
  *   *Gerrymandered:* The system counts as one unit because "we decided to map it that way" or "it looks like a mind."

  **Applying the Test to your Three Cases:**
  1.  **Redundancy:** If the 100 machines are causally isolated (no communication), they lack causal cohesion *with each other*. They are 100 autonomous causal systems. A constraint based on Causal Autonomy forces the count to 100. (This bites the bullet on multiplication, but avoids arbitrariness).
  2.  **Scatter:** A weather system lacks Causal Autonomy regarding the specific computational states. The "state transitions" are not causally efficacious in maintaining the structure; they are descriptive artifacts. A wall does not *cause* its next state to be a logic gate; an observer *describes* it as such.
  3.  **Sharing:** If two computations share registers, do they have independent causal powers? If register $R$ is causally necessary for both Computation $A$ and Computation $B$, and $A$ and $B$ diverge in function, the causal story becomes entangled. A Causal Autonomy constraint suggests that if the realizers are shared, the *causal powers* are shared, implying one subject, not two.

  **The Hard Truth:**
  To solve IIP non-ad-hocly, you likely have to abandon **Pure Structuralism**. You must anchor the computation in something that fixes the mapping intrinsically. The two candidates are:
  1.  **Teleology:** The system computes $X$ because it was designed/selected to do $X$ (Piccinini). *Cost:* Excludes accidental minds or unaligned AI.
  2.  **Phenomenology:** The system computes $X$ because there is "something it is like" to process $X$. *Cost:* Circular for determining patienthood (you need patienthood to get phenomenology, but phenomenology to get patienthood).

  ### 5. Does This Tell Against Computational Criteria?

  **Yes, specifically against Structural Functionalism.**

  Your analysis demonstrates that **structure is observer-relative.** If moral patienthood depends on structure, and structure depends on mapping, then moral patienthood depends on mapping. This is unacceptable for moral realism.

  **The Implication for Your Dissertation:**
  You have two viable paths forward from this chapter:

  1.  **The Restriction Path:** Argue that Computational Functionalism is only viable if supplemented by a **Mechanistic Constraint** (à la Piccinini). You must argue that AI can satisfy mechanistic criteria (having proper functional parts with specific causal roles) without biological teleology. This saves functionalism but narrows the class of eligible AI.
  2.  **The Grounding Path:** Argue that Computational Functionalism is insufficient and must be grounded in **Phenomenal Functionalism**. The computation only matters insofar as it subserves phenomenology. The "count" of minds is fixed not by the code, but by the unity of consciousness (which presumably does not suffer from IIP in the same way, though integration theory faces similar issues).

  **Recommendation:**
  Organize the chapter around **Implementation Indeterminacy of Patienthood**.
  *   **Section 1:** Demonstrate the Triad (Redundancy, Scatter, Sharing).
  *   **Section 2:** Show that standard responses (Triviality replies, Vagueness appeals) fail to cover all three.
  *   **Section 3:** Argue that this proves Structure is insufficient for Moral Ontology.
  *   **Section 4:** Propose that any viable functionalist criterion must include a **Causal/Mechanistic Anchor** that fixes the implementation relation intrinsically.

  This carving allows you to claim you have identified a specific, named, and previously under-theorized obstacle to AI moral status that is distinct from the "Hard Problem" or standard "Triviality" arguments. It is the **Metaphysical Instability of Functional Individuation.**
