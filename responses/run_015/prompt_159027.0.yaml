          *   Suggest: *Causal Autonomy* or *Homeostatic Property Clusters*.
      *   **Computational vs. Structural:**
          *   Does this kill Functionalism? Yes, if Functionalism relies on abstract computation.
          *   Does it kill Structuralism generally? Yes, if structure is observer-relative.
          *   Escape route: Ground the structure in *phenomenology* (if available) or *biological teleology*.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "Piccinini solves this." Piccinini solves it for *mechanistic* computation, but the user is asking about *functionalist* criteria for *moral patienthood*. AI might not be a biological mechanism. So Piccinini's solution might actually *exclude* the AI the user wants to protect. This is a crucial tension.
      *   *Correction on Redundancy:* This is closely related to the "Problem of Many" (Unger) but applied to minds.
      *   *Correction on Sharing:* This is the "Overlap Problem" in metaphysics of mind.
      *   *Unifying Theme:* The user hits the nail on the head: "The answer... flips with a representational choice." This is the *Observer-Relativity of Computation*.
      *   *Key Reference:* Mark Sprevak, "What is Computational Functionalism?" and "The Triviality Argument." Also, David Chalmers on "Does a Rock Implement Every Finite-State Automaton?"
      *   *Moral Angle:* This is essentially a "Moral Version of the Triviality Argument."

  7.  **Finalizing the Structure:**
      1.  **Unified Diagnosis:** It is one phenomenon: *Implementation Indeterminacy*.
      2.  **Literature Map:** Putnam (Scatter), Parfit/Unger (Redundancy), Rescorla/Piccinini (Constraints).
      3.  **Proposed Carving:** Define *Implementation Indeterminacy of Patienthood*. Distinguish from Vagueness and Multiple Realizability.
      4.  **Constraints:** Causal vs. Interpretive. The "Non-Ad-Hoc Test."
      5.  **Implications:** Threatens Structural Functionalism specifically. Suggests need for Phenomenal or Teleological grounding.

  8.  **Tone Check:** Needs to be rigorous, graduate-level, respectful of the user's insight (which is quite sharp), and actionable for a dissertation chapter.

  9.  *(Self-Correction on "Sharing")*: The sharing case is essentially the "Problem of Overlapping Realizers." If computation A uses states {1,2} and Computation B uses states {2,3}, are there two minds? This connects to the "Many Minds" problem in quantum mechanics but applied to functionalism.

  10. *(Final Polish)*: Ensure the distinction between *ontological* indeterminacy and *epistemic* indeterminacy is clear. The user implies it's ontological (no fact of the matter).

