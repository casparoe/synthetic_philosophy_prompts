  ### The Test Case Verdict

  **Case:** 1,000 people at 100 vs. 2,000 people at 100, **no overlap**, everyone equally well off.

  **Application:**
  1.  **Suffering Veto:** Neither population has lives below 0. (Pass)
  2.  **Critical Level:** Both populations are well above $c=50$.
  3.  **Smoothness:** Assume equal smoothness.
  4.  **Anchoring Constraint:** The populations are **disjoint** (no overlap).

  **Verdict:** **Incommensurable / Not Better.**

  **Reasoning:** Under the Anchoring Constraint, you cannot say the world with 2,000 people is better than the world with 1,000 people if none of the original 1,000 exist in the second scenario. While there is "more good" in the abstract, there is no one for whom the second world is *better* than the first. This aligns with your Case 5 intuition ("nobody is better off").

  If you forced me to choose based *only* on the Critical Level math (ignoring the Anchor), it would say "Much Better" (double the value). But given your strong reaction to Case 5, the **Anchored** verdict is the one that respects your actual moral psychology.
