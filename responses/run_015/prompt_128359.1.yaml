  Before the news arrives, I weigh the worlds,
  Where prior probabilities hold sway.
  No update shifts the balance of the scale;
  I act the rule defined before the sight.

  The test reveals the lesion in the brain,
  And evidence suggests I drop the pipe.
  But correlation is not causation's chain;
  I act the rule defined before the sight.

  The market shifts, the coin reveals its face,
  The posterior urges change of plans.
  Yet logic binds my future to this place;
  I act the rule defined before the sight.

  My future action is a logical fact,
  Not stochastic guesswork in the dark.
  The evidence cannot alter the act;
  I act the rule defined before the sight.

  **Note on Theory and Form**
  This poem personifies the agent to illustrate the internal perspective of Updateless Decision Theory (UDT). It is settled within decision theory that classical Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) encounter paradoxes in cases like Newcomb's Problem or the Smoking Lesion. However, UDT's status as the solution is contested; while it avoids dynamic inconsistency (a form of Dutch Book argument), critics argue it struggles to define coherent priors over logical facts and may ignore valuable information in forgetting scenarios. The poem treats the agent's future action as a fixed logical output, a core UDT tenet, though this assumes the agent can successfully compute the optimal policy across all logical worlds, which is computationally idealized.

  Updateless Decision Theory maximizes expected utility by selecting a global policy prior to observation rather than updating on evidence locally.
