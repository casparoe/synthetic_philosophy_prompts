  # DECISION TREE: DIACHRONIC RATIONALITY

  **Instructions:** Answer each question based on your intuition about the case or claim. Do not consult theory labels. Follow the branches to find the position you are committed to.

  ### 1. THE METAPHYSICS OF AGENCY
  **When you choose now for next week, are you negotiating with a stranger who shares your body, or commanding your own future?**
  *   **Negotiating (Sequence of Selves):** → **LEAF 1: Intrapersonal Bargaining**
      *   *Awkward Commitment:* You must treat your own future pain as a hostile negotiation tactic rather than your own suffering.
  *   **Commanding (Unified Agent):** → Go to Question 2.

  ### 2. THE FOUNTAIN (EXPLOITABILITY)
  **In the Fountain case (cyclic tastes A>B>C>A), if a trader pays you to cycle through A-B-C-A, are you acting rationally?**
  *   **Yes (Exploitability is contingent):** → **LEAF 2: The Misfortune View**
      *   *Awkward Commitment:* You must admit rational agents can be money-pumped if the environment is kind.
  *   **No (Exploitability reveals defect):** → Go to Question 3.

  ### 3. THE PUMP THAT NEVER RUNS (INTERNAL COHERENCE)
  **If you have cyclic tastes but live on a desert island where no trader can find you, is there still something wrong with your mind?**
  *   **No (Defect requires actual loss):** → **LEAF 3: Contextual Rationality (UNOCCUPIED)**
      *   *Diagnosis:* **Incoherent.** You claim the cycle is irrational (Q2), but admit no defect exists without a victimizer.
  *   **Yes (Defect is internal):** → Go to Question 4.

  ### 4. THE METHOD OF CONTROL
  **To ensure you stick to your diet, must you physically throw away the cake, or is it enough to decide not to eat it?**
  *   **Physically Throw Away (Alter Options):** → **LEAF 4: Ulysses Precommitment**
      *   *Awkward Commitment:* You must pay to restrict your own freedom even when you know you won't use it.
  *   **Decide Not to Eat (Mental Filter):** → Go to Question 5.

  ### 5. SENSITIVITY VERSUS BRITTLENESS
  **Which failure strikes you as worse: a plan whose content swings with a trivially small change in the payoff at a node you will never reach, or a plan that at some node requires you to act against everything that speaks for acting otherwise at that node?**
  *   **Swings are worse (Stability is King):** → Go to Question 6.
  *   **Acting against reasons is worse (Responsiveness is King):** → Go to Question 7.

  ### 6. THE NATURE OF COMMITMENT (BRITTLENESS ROUTE)
  **To stick to the plan, do you need a special mental state of 'intention' that filters options, or just a decision to ignore current reasons?**
  *   **Special Mental State (Filters):** → **LEAF 5: Planning Agency**
