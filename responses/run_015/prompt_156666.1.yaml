  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of an Emerging-Risk Committee at a mid-sized mutual insurer.
      *   **Context:** 9 members (mixed expertise), 2-hour fortnightly meetings, vote Yes/No on "material exposure."
      *   **Problem:** Current default (simple majority show of hands) feels wrong for various decision types.
      *   **Goal:** A written procedure (Terms of Reference compatible) to be run in ~10 mins *before* discussion.
      *   **Structure:** Sequence of gates (Question -> Sufficient Answer -> Stop Rule/Handoff).
      *   **Constraints:**
          *   Simple arithmetic only (no stats textbooks).
          *   Fixed rules signed off by CRO (no ad-hoc selection).
          *   State formal results in plain English (no naming theorems without explanation).
          *   Distinguish between results-derived steps and stipulations.
      *   **Complications to Address:**
          *   Truth vs. Value (is there a fact of the matter?).
          *   Compound Questions (conjunctions).
          *   Competence (better than chance? unknown track record?).
          *   Independence (common sources, seniority bias).
          *   Deliberation (pre- vs. post-discussion).
          *   Expert Dominance (is one person much better?).
          *   Asymmetric Costs (False Negative vs. False Positive).
          *   Incentives/Bias (Business Unit reps).
          *   Small Numbers (n=9, low competence).
      *   **Application:** Apply to three specific scenarios (Water Damage, Regulation, Pandemic).
      *   **Closing:** Limitations, potential failure points, self-critique.

  2.  **Analyze the Complications & Theoretical Underpinnings:**

      *   *Condorcet's Jury Theorem (CJT):* This is the core mathematical result the user is hinting at.
          *   *Premise:* If voters are independent and competence $p > 0.5$, majority rule converges to truth as $n \to \infty$.
          *   *Relevance:* With $n=9$ and $p$ close to 0.5, the "guarantee" is weak. If $p < 0.5$, majority makes it *worse*.
          *   *Constraint:* Need to explain this simply. "If everyone is slightly better than a coin flip and guesses alone, more heads help. If they copy each other or are worse than a coin flip, more heads hurt."
      *   *Independence:* Common information sources (briefing notes, news) and social pressure (seniority) reduce effective $n$. If correlation is high, 9 people act like 3.
      *   *Compound Questions:* "Will Reg X apply AND bite?" If $P(A) = 0.6$ and $P(B) = 0.6$, $P(A \land B) = 0.36$. Majority on parts $\neq$ Majority on whole. This is the *Discursive Dilemma*.
      *   *Asymmetric Costs:* If Missing a Risk (False Negative) costs 10x more than False Alarm (False Positive), the threshold for "Yes" should be lower than 50%.
      *   *Truth vs. Value:* CJT only applies to factual questions (will this happen?). Risk appetite (how much risk do we want?) is a value judgment. Majority rule is standard for values, but expertise matters less.
      *   *Expert Dominance:* If one person has $p=0.9$ and others have $p=0.51$, weighting the expert higher is better. But how to measure $p$ without stats? Use track records if available.
      *   *Incentives:* BU reps might vote "No" to keep writing business. This introduces systematic bias ($p < 0.5$ effectively for that subgroup).

  3.  **Drafting the Procedure (The Gates):**

      *   *Goal:* 10 minutes, pre-discussion.
      *   *Gate 1: Fact vs. Value.* Is there a truth? If No (Value), vote simple majority (standard governance). If Yes (Fact), proceed.
      *   *Gate 2: Compound?* Is it A & B? If Yes, vote on parts separately, combine logically. (Avoids Discursive Dilemma).
      *   *Gate 3: Independence.* How many *sources*? If low (1-2), voting adds little noise reduction. Proceed with caution or defer to discussion. *Correction:* The prompt asks for a rule. If independence is low, majority rule loses power. Maybe require a higher threshold or treat as "Expert Opinion" only. Let's make it a "Effective Voter Count" check.
      *   *Gate 4: Competence.* Do we know if they are $>50\%$? If track record exists, use it. If not, assume neutral but penalize for bias.
      *   *Gate 5: Asymmetric Costs.* Adjust the threshold. If Cost(FN) >> Cost(FP), lower the bar for "Yes".
      *   *Gate 6: Expert Dominance.* Is there a clear expert? If Yes, weight them or defer.
      *   *Gate 7: The Vote Mechanism.* Pre-discussion silent poll (to capture independence) vs. Post-discussion (to capture deliberation value). The prompt asks for a procedure *before* anyone speaks. So this gate determines *how* the final vote will be taken later.

      *Refining the Gates for Simplicity & Constraints:*
      *   Need to avoid complex math.
      *   Need to handle the "Small Numbers" issue explicitly.
      *   Need to handle the "Bias" issue (BU reps).

      *Revised Flow:*
      1.  **Nature of Question:** Fact or Policy?
      2.  **Structure:** Simple or Compound?
      3.  **Information State:** Independent or Herded?
      4.  **Competence:** Known or Unknown?
      5.  **Cost of Error:** Symmetric or Asymmetric?
      6.  **Decision Rule Selection:** Based on above.

  4.  **Developing the Formal Result Explanation:**
      *   *Condorcet:* "The Law of Averages for Opinions." If people guess better than coins and don't copy, the group wins. If they copy or guess worse, the group loses.
      *   *Discursive Dilemma:* "The Package Deal Trap." Voting on the conclusion can contradict voting on the reasons.
      *   *Independence:* "The Echo Chamber Effect." 9 people reading the same note count as 1 person.

  5.  **Addressing Specific Complications in the Procedure:**
      *   *Truth vs. Value:* Gate 1.
      *   *Compound:* Gate 2.
      *   *Competence:* Gate 4 (Track Record Check).
      *   *Independence:* Gate 3 (Source Count).
      *   *Deliberation:* Instruction on Silent Ballot vs. Show of Hands.
      *   *Expert:* Gate 5 (The "Super-Voter" Check).
      *   *Costs:* Gate 6 (Threshold Adjustment).
      *   *Bias:* Gate 4 (exclude or discount conflicted voters).
      *   *Small Numbers:* Explicit warning in the preamble/results section.

  6.  **Applying to Scenarios:**
      *   *Water Damage:* Fact, Simple, Some Track Record, Symmetric Cost. -> Modified Majority.
      *   *Regulation:* Fact, Simple, One Expert, High Cost of Error (Compliance). -> Defer to Expert/General Counsel.
      *   *Pandemic:* Fact/Value Hybrid, Compound, Low Independence, High Asymmetry, Unknown Truth. -> Precautionary Principle (Low Threshold) but acknowledge uncertainty.

  7.  **Drafting the Content - Section by Section:**

      *   *Preamble:* Set the stage, CRO sign-off.
      *   *The Formal Result (Plain English):* Explain Condorcet and its limits (n=9, p~0.5).
      *   *The Procedure (The Gates):* Step-by-step logic.
      *   *Application:* Walk through the three cases.
      *   *Limitations/Self-Critique:* Honest assessment of where this might fail (especially Independence estimation).

  8.  **Refining the Arithmetic/Constraints:**
      *   Instead of calculating $p$, use "Track Record > 50%?"
      *   Instead of correlation coefficients, use "Count of Unique Sources."
      *   Thresholds: 5/9 is majority. If costs asymmetric, maybe 4/9 triggers review. If expert exists, Expert + 1 = Decision.

  9.  **Critical Review against Prompt:**
      *   *10 minutes?* Yes, checklists are fast.
      *   *Before discussion?* Yes, determines *how* to discuss/vote.
      *   *Simple Arithmetic?* Yes.
      *   *Fixed Rules?* Yes.
      *   *Formal Results Stated?* Yes (Condorcet, Discursive Dilemma).
      *   *Three Scenarios?* Yes.
      *   *Closing Critique?* Yes.

      *Self-Correction on "Independence":* The prompt asks for a gate that asks "how many genuinely separate information channels." I need to make this actionable. "Raise hand if you read Source A. Raise hand if Source B." Count the clusters.
      *Self-Correction on "Expert":* How to define "enough better"? If track record shows >70% vs others <55%. Or simply "Sole Domain Expert." Let's use the "Sole Domain Expert" rule for simplicity in a 10-min gate.
      *Self-Correction on "Small Numbers":* I need to explicitly state that with 9 people and ~55% competence, the group is only marginally better than a single expert. This tempers expectations.

  10. **Final Polish:** Ensure tone is professional, procedural, yet intellectually honest about the limitations. (The prompt asks for "I expect the procedure to tell me something I do not want to hear on that third one" - ensure the Pandemic outcome reflects the uncertainty/cost asymmetry properly).

      *Wait, one nuance:* The prompt asks for the procedure to be run *before anyone speaks*. This means the "Independence" check must be based on the *briefing materials*, not the discussion. The "Expert" check must be based on *roles*, not claims made in the room.
      *Also:* The prompt asks to distinguish between "result-derived" and "stipulation." I need to label these clearly.

      *Let's structure the Procedure as a Flowchart logic.*
      1. Fact vs Value.
      2. Compound?
      3. Independence (Source Count).
      4. Competence (Track Record/Role).
      5. Cost Asymmetry.
      6. Final Rule Selection.

      *Let's refine the "Independence" gate.* If everyone read the same note, $N_{eff}$ is low. Rule: If $N_{eff} < 4$, do not rely on majority vote for truth. Rely on Expert or Precaution.
      *Let's refine the "Cost" gate.* If Cost(Miss) > 10x Cost(False Alarm), threshold for "Yes" drops.

      *Okay, ready to write.*
answer: |-
  # Terms of Reference Addendum: Emerging Risk Classification Protocol

  **Approved By:** Chief Risk Officer
  **Effective Date:** [Date]
  **Review Cycle:** Annual
  **Application:** To be completed by the Committee Chair in the first 10 minutes of any agenda item requiring a classification vote, prior to member discussion.

  ---

  ## Part 1: The Logic Underpinning This Procedure

  *This section explains the "why" so members understand the constraints. It relies on one formal result and one logical observation, stated without technical jargon.*

  **1. The Law of Averages for Opinions (Condorcet's Jury Theorem)**
  *Formal Result:* If a group votes on a question that has a right or wrong answer, and every member is more likely to be right than wrong (better than a coin flip), and every member decides independently (without copying others), then the majority vote is more likely to be correct than any single member's view. As the group gets larger, this certainty grows.
  *The Constraint:* We have only nine members. If our competence is only slightly better than a coin flip (e.g., 55%), and we are not independent (we read the same notes), the "guarantee" vanishes. In a group of nine with 55% competence, the group is only about 60% likely to be right. If our competence drops below 50% (we are systematically biased), adding more voters makes us *less* accurate.
  *Procedure Implication:* We cannot blindly trust a majority vote. We must verify independence and competence before counting heads.

  **2. The Package Deal Trap (The Discursive Dilemma)**
  *Logical Observation:* A question like "Will Regulation X apply AND cause losses?" is two questions joined together. It is possible for a majority to believe "Yes, it applies" and "Yes, it causes losses," but for a different majority to vote "No" on the combined package.
  *Procedure Implication:* We never vote on a compound "And" question directly. We vote on the parts and combine the results logically.

  **3. Stipulations (Our Specific Choices)**
  *Because the math above does not tell us everything, the Committee stipulates the following:*
  *   **Cost of Error:** We explicitly value missing a risk (False Negative) higher than flagging a risk that does not materialise (False Positive).
  *   **Conflict of Interest:** Business Unit representatives are presumed to have a bias toward writing business. Their votes on risks affecting their own units count as half a vote.
  *   **Independence:** Information sources are considered "shared" if more than three members rely on the same primary document or model for the item.

  ---

  ## Part 2: The Classification Gates

  *Complete this checklist sequentially. Stop at the first gate that yields a fixed rule. If you reach Gate 6, apply the Voting Rule indicated.*

  ### Gate 1: Fact or Value?
  **Question:** Is there a future point in time where we can definitively prove this decision was right or wrong (e.g., "Did the regulation pass?")? Or is this a matter of appetite (e.g., "Are we comfortable with this level of risk?")?
  *   **If Value (No future truth):** Stop. **Rule:** Simple Majority (5 of 9 votes). This is a governance choice, not a forecast.
  *   **If Fact (Future truth exists):** Proceed to Gate 2.

  ### Gate 2: Compound or Simple?
  **Question:** Does a "Yes" decision require two or more uncertain events to happen together (e.g., "Regulation passes" AND "It applies to us")?
  *   **If Compound:** Stop. **Rule:** Break the question into parts. Apply this Procedure to each part separately. The final decision is "Yes" only if *all* parts result in "Yes." Do not vote on the combination directly.
  *   **If Simple:** Proceed to Gate 3.

  ### Gate 3: Information Independence
  **Question:** Look at the briefing materials. How many *distinct* primary sources of information are represented? (e.g., External Counsel opinion, Internal Claims Data, Third-party Model, Regulatory Text). Count a source only if at least two members have not read it prior to this meeting.
  *   **If Low Independence (1 or 2 sources only):** Stop. **Rule:** Majority vote is invalid for truth-seeking. Proceed to Gate 5 (Expert Deference). *Reasoning: With 9 people reading 1 note, you effectively have 1 voter.*
  *   **If Moderate/High Independence (3+ sources):** Proceed to Gate 4.

  ### Gate 4: Competence and Bias
  **Question:** Check the Track Record Log. Do we have performance data for this *type* of decision?
  *   **If Yes (Data exists):** Calculate the average accuracy of the 6 scored members.
      *   If Average Accuracy < 55%: Stop. **Rule:** Proceed to Gate 5 (Expert Deference). *Reasoning: Group is barely better than chance.*
      *   If Average Accuracy > 55%: Proceed to Gate 6.
  *   **If No (No data):** Check for Domain Expertise. Is there exactly one member whose job function guarantees knowledge of this specific risk (e.g., General Counsel for Regulation)?
      *   **If Yes (Single Expert):** Proceed to Gate 5.
      *   **If No (Generalists only):** Proceed to Gate 6.
  *   **Bias Adjustment:** For all remaining gates, Business Unit reps voting on their own line count as 0.5 votes.

  ### Gate 5: Expert Deference
  **Question:** Is there a identified Domain Expert (from Gate 4) or did Gate 3 fail due to low independence?
  *   **Rule:** The Domain Expert's recommendation stands as the Committee's view. If no single expert exists (e.g., Gate 3 failure with generalists), the Chair must commission external advice before voting. Do not vote today.

  ### Gate 6: Cost Asymmetry and Threshold
  **Question:** Compare the cost of Missing the Risk vs. the cost of a False Alarm.
  *   **If Costs are Roughly Equal:** **Voting Rule:** Simple Majority of adjusted votes (5.0 votes).
  *   **If Missing Risk is Worse (Ratio > 5:1):** **Voting Rule:** Low Threshold. A "Yes" (Treat as Material) requires only 4.0 adjusted votes. A "No" requires 6.0 adjusted votes. Anything between 4.0 and 6.0 is treated as "Yes, Monitor Closely."
  *   **If False Alarm is Worse (Ratio > 5:1):** **Voting Rule:** High Threshold. A "Yes" requires 7.0 adjusted votes.

  ---

  ## Part 3: Application to Recurring Items

  *Here we apply the Gates to the three scenarios provided to demonstrate the output.*

  ### Item 1: Coastal Water-Damage Cluster
  *   **Context:** Signal vs. Artefact. Resolution in 6 months. 6 members have track records. Symmetric costs.
  *   **Gate 1 (Fact/Value):** Fact. (We will know in 6 months if it was a trend). -> *Proceed.*
  *   **Gate 2 (Compound):** Simple. (Is it a signal?). -> *Proceed.*
  *   **Gate 3 (Independence):** Moderate. (Claims data, external weather data, internal underwriting view). -> *Proceed.*
  *   **Gate 4 (Competence):** Data exists. Assume average accuracy ~60% (based on "coin flip plus a little"). -> *Proceed.*
  *   **Gate 5 (Expert):** No single expert. -> *Proceed.*
  *   **Gate 6 (Costs):** Symmetric.
  *   **Result:** **Standard Majority Vote.**
      *   *Adjustment:* Business Unit reps for that region count as 0.5.
      *   *Threshold:* 5.0 adjusted votes to classify as Material.
      *   *Note:* This is the "standard" case where the committee functions as designed.

  ### Item 2: Agricultural Disclosure Regulation
  *   **Context:** General Counsel (GC) is the only expert. Others guessing.
  *   **Gate 1 (Fact/Value):** Fact. (Regulation either captures the book or it doesn't). -> *Proceed.*
  *   **Gate 2 (Compound):** Simple. -> *Proceed.*
  *   **Gate 3 (Independence):** Low. (Mostly reading the GC's briefing note). -> **STOP.**
  *   **Rule Triggered:** Gate 3 Failure (Low Independence) -> Go to Gate 5.
  *   **Gate 5 (Expert):** General Counsel is the Domain Expert.
  *   **Result:** **Defer to General Counsel.**
      *   *Action:* The Committee does not vote. The Chair records the GC's opinion as the Committee's finding.
      *   *Reasoning:* Voting among 8 non-experts and 1 expert on a legal question dilutes the expert's signal. The "Law of Averages" fails here because 8 voters have competence near 50% (guessing) on law.

  ### Item 3: Novel Respiratory Outbreak (Pandemic Risk)
  *   **Context:** Compound question (Outbreak persists AND causes BI liability). No competence data. Shared briefing (3 sources). High Cost Asymmetry (Miss cost >> False Alarm). Truth may never be known.
  *   **Gate 1 (Fact/Value):** **Value/Uncertain.** (Truth may not be settled for years).
      *   *Strict Reading:* If truth is never revealed, Gate 1 says "Value" -> Simple Majority.
      *   *Risk Reading:* This is a "Precautionary" decision. We treat it as a Fact gate but acknowledge the uncertainty. Let us proceed as Fact to test the safeguards. -> *Proceed.*
  *   **Gate 2 (Compound):** **Compound.** (Outbreak persists AND Liability exists).
      *   *Rule Triggered:* **STOP.** Break into parts.
      *   *Part A:* Will outbreak persist? (Apply Gates).
      *   *Part B:* Will it create liability? (Apply Gates).
      *   *Assumption:* Let's assume Part A fails (unknown truth), Part B passes (liability likely if it persists).
  *   **Gate 3 (Independence):** Low/Moderate. (Everyone briefed from same 3 sources).
      *   *Risk:* If everyone reads the same WHO reports, independence is low.
  *   **Gate 4 (Competence):** No data. No single expert.
  *   **Gate 6 (Costs):** **Highly Asymmetric.** (Miss cost is existential; False alarm is capital reserve). Ratio > 10:1.
  *   **Result:** **Low Threshold "Yes" (Precautionary).**
      *   *Action:* Even with low independence and unknown competence, the Cost Gate forces a threshold of 4.0 adjusted votes to flag as Material.
      *   *The "Unwanted" Truth:* The procedure forces you to flag this as a Material Exposure *not* because you know it's true, but because the cost of being wrong is too high. It converts an epistemic problem (we don't know) into a risk-appetite problem (we can't afford to miss it).
      *   *Caveat:* Because Gate 1 is shaky (truth may not be revealed), this should be minuted as "Risk Appetite Decision based on Precautionary Principle," not "Forecast."

  ---

  ## Part 4: Limitations and Self-Critique

  *This section addresses where the procedure is fragile, as requested.*

  **1. The Independence Guess (Gate 3)**
  *   **The Weakness:** This is the most likely point of failure. I am asking you to count "sources," but social influence is invisible. If the Senior Underwriter speaks first in the *next* meeting (discussion phase), they corrupt the independence of the final vote even if the briefing notes were diverse.
  *   **The Risk:** You will confidently answer "3 sources" when socially there is only 1.
  *   **Empirical Trigger:** If we find that post-discussion votes align 9-0 on items where pre-discussion silent polls were split 5-4, independence is an illusion. I would rewrite Gate 3 to mandate silent written ballots *before* any discussion as the only valid vote count.

  **2. The Competence Assumption (Gate 4)**
  *   **The Weakness:** I assume track records on "past decisions" transfer to "emerging risks." They may not. Being good at pricing motor insurance does not make one good at predicting cyber regulation.
  *   **Empirical Trigger:** If the "Expert Deference" rule (Item 2) leads to a compliance failure, the definition of "Domain Expert" is too broad. I would rewrite Gate 5 to require two concordant experts.

  **3. The Small Numbers Reality**
  *   **The Weakness:** I have been honest that 9 people is a small sample. The "Law of Averages" provides very little lift here. If the average competence is 55%, the group is only 60% reliable. This procedure cannot manufacture accuracy from a small, correlated group.
  *   **Where I Might Be Wrong:** I have assumed that breaking compound questions (Gate 2) solves the logical inconsistency. However, if the members do not understand the logic of "And," they may vote inconsistently anyway.
  *   **The Hard Truth:** On Item 3 (Pandemic), the procedure tells you to flag the risk. You might not want to hear this because it consumes capital for a "maybe." But the math of asymmetric costs dictates that when the cost of ruin is high, the threshold for action must be low, regardless of competence. If you want to avoid flagging it, you must formally declare that the cost of a False Alarm is higher than the cost of Ruin, which contradicts your role as a risk committee.

  **4. The "Truth" Gate (Gate 1)**
  *   **The Weakness:** Distinguishing Fact from Value is philosophically difficult in risk. "Is this a material exposure?" sounds like a fact, but "material" is defined by our appetite.
  *   **Correction:** If the Committee finds itself stuck on Gate 1, default to "Value." It is safer to admit we are making a preference choice than to pretend we are predicting the future when we are not.

  **Final Note to Chair:**
  This procedure removes your discretion to choose the voting rule *after* seeing the room. This is intentional. It prevents you from unconsciously selecting the rule that validates the outcome you prefer. If the procedure yields a result you dislike (like Item 3), that is the system working, not failing.
