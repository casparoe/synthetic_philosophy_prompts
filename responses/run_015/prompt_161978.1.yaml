prompt: |-
  Last night I got into a long arguement with a friend about my job and I want it settled properly instead of by whoever talks louder. I'm on the model risk team at a mid-size lender. We review the scoring models that get used for underwriting and for a couple of other things — maybe a dozen to fifteen a year — and I get roughly one analyst-day per model. Whatever I write goes to our counsel and then to the chief risk officer, and it has to end in one of three verdicts: ship, ship with conditions, or don't ship. We can't ask for more data and we usualy couldn't get it anyway. My background is stats, not philosophy, and the people who sign off are a lawyer and a risk guy, so anything I hand them has to survive being read by someone who doesn't know the theory and doesn't want to.

  The argument was this. My friend says: pick one fairness metric, write it into policy, check it, done. I said picking the metric is itself the moral call, and worse, the metrics fight each other — there's that well known result that when the outcome rates differ between two groups you can't have all of calibration-within-group, equal false-positive rates and equal false-negative rates at the same time except in degenerate cases. He said fine, then just pick the one that sounds nicest. We went nowhere, and the honest problem is that I don't have anything I could hand to a new analyst and expect them to reach the same verdict I would.

  So: give me a procedure, not an essay. Questions in a fixed order, what counts as a sufficient answer to each, where the procedure stops with a hard no, and where it hands the decision to a person because the question is one of values rather than facts. I care a lot about which distinctions have to survive the simplification and which can be dropped, because a checklist that tries to keep everything is a checklist nobody runs.

  Three wrinkles that keep coming up and that a generic fairness checklist never handles:

  One, deployment shape. The same kind of model is used as a threshold screen (approve/decline), as a ranking with a fixed budget (we have N slots and hand them to the top N), and as one input a human sees before deciding. I don't think error-rate parity means the same thing in those three, and I think in the fixed-budget case it might not be the right question at all. The procedure needs to branch on this.

  Two, we don't collect race or sex of owners. Group membership is imputed from surname and census tract by a consultant's model, and we know it's noisy — call it right maybe three quarters of the time, and worse for one group than the other. Every parity number I have is therefore measured on estimated groups. I don't know whether that kills the whole exercise or just widens the error bars, and I don't know which direction it biases things.

  Three, the label is a business choice. Default within 18 months, 90+ days past due, first missed payment — these give different models and different fairness numbers, and for applicants we declined we have no repayment outcome at all, so the vendor imputed those. My worry is that some of our numbers are unfalsifiable rather than merely noisy.

  Run the procedure on these three, with numbers:

  BizScore — a term-loan approval screen for small businesses, threshold decision. Label is 90+ days past due within 18 months, with imputed outcomes for the roughly 40 percent of the sample we'd declined. Equal false-negative rates across the two groups hold within a point. Equal false-positive rates don't: among businesses that would have repaid, one group is declined at about twice the rate of the other. Predicted-value parity fails too, and calibration looks fine for one group and not the other. Counsel wants a single number for the exam file.

  HardshipRank — 500 counseling slots, 4,000 eligible customers, score ranks by predicted chance of missing a payment, top 500 get the slot. No threshold anywhere. Fixed pie. I want to know what the procedure even asks here, and I want it to say something about the option of equalizing some parity quantity by withholding help from the highest-scoring people — helping nobody so the spreadsheet looks better — because I think that is what pick a metric and check it quietly licenses.

  AssistScore — shown to a loan officer as one input among several. Officers override around 30 percent of the time, and the overrides cluster by branch. My guess is the right verdict is that we're auditing the wrong object, but I want the procedure to force that verdict rather than me asserting it after the fact.

  Include at least one case where the procedure gives me an answer I don't want — I'd rather see that now than in an exam. And tell me plainly what the procedure can't do: which questions it looks like it answers and doesn't, and where a value call has to be made and signed by a human.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Model Risk Management (MRM) at a mid-size lender.
      *   **Task:** Review scoring models (underwriting, etc.). ~12-15/year. ~1 analyst-day/model.
      *   **Audience:** General Counsel (GC) and Chief Risk Officer (CRO). They are not statisticians/philosophers. They want clear verdicts (Ship, Ship w/ Conditions, Don't Ship).
      *   **Constraint:** Cannot ask for more data. Data is noisy (imputed demographics, imputed outcomes for rejects).
      *   **The Conflict:** Friend says "Pick one metric, check it, done." User says "Metric choice is moral, metrics conflict (Impossibility Theorems), context matters."
      *   **The Need:** A concrete *procedure* (checklist/flowchart style), not an essay. Needs to handle specific wrinkles (Deployment Shape, Noisy Demographics, Label Definition).
      *   **Specific Cases to Run:** BizScore (Threshold, Imputed Rejects, FPR disparity), HardshipRank (Fixed Budget, Ranking), AssistScore (Human-in-the-loop).
      *   **Requirement:** Must include a case where the procedure gives an unwanted answer. Must explicitly state limitations (what it can't do).

  2.  **Deconstruct the Three Wrinkles:**
      *   **Deployment Shape:**
          *   *Threshold:* Error rates matter (FPR/FNR).
          *   *Fixed Budget (Ranking):* Error rates are less relevant than *selection rate* or *utility*. Maximizing fairness metrics might reduce total utility (the "helping nobody" problem).
          *   *Human-in-the-Loop:* Model is just advice. Auditing the model alone is insufficient; need to audit the *process* (override rates).
      *   **Noisy Demographics (BISG/Imputed):**
          *   Measurement error attenuates disparity estimates. If you see disparity with noisy data, the *true* disparity is likely larger. If you see parity, true disparity might exist.
          *   Procedure needs a "conservative bias" adjustment or a threshold buffer.
      *   **Label/Outcome Noise (Imputed Rejects):**
          *   Reject Inference is inherently speculative.
          *   If disparity relies heavily on imputed data, confidence is low.
          *   Procedure needs to flag reliance on imputed data as a risk condition.

  3.  **Drafting the Procedure (The "MRM Fairness Triage"):**
      *   *Goal:* Actionable, binary decisions where possible, escalation points for value judgments.
      *   *Structure:*
          1.  Deployment Classification.
          2.  Data Integrity Check (The "Garbage In" gate).
          3.  Metric Selection (Based on Deployment).
          4.  Thresholds & Buffers (Handling Noise).
          5.  Verdict Logic.

      *   *Refining the Metric Selection:*
          *   Can't just say "pick one." Need to tie metric to *harm*.
          *   Threshold: Harm = Wrong Decision. Focus on Error Rates (FPR/FNR).
          *   Ranking: Harm = Exclusion. Focus on Selection Rate / Representation.
          *   Human-in-Loop: Harm = Inconsistency. Focus on Override Analysis.

      *   *Refining the Noise Handling:*
          *   Demographics: Apply a "Noise Floor." If disparity < noise floor, treat as inconclusive. If disparity > noise floor, treat as real (conservative assumption).
          *   Labels: Tag reliance on imputed rejects. If key fairness metric depends >X% on imputed data, automatic "Condition."

  4.  **Running the Procedure on the Three Cases:**

      *   **BizScore (Threshold, Imputed Rejects, FPR Disparity):**
          *   Deployment: Threshold.
          *   Metric: Error Rates (FPR/FNR).
          *   Data: FPR disparity exists (2x). FNR parity holds.
          *   Noise: 40% imputed rejects.
          *   Logic: FPR disparity means one group gets denied more often despite being good risks. This is a concrete harm. Imputed data makes it fuzzy, but 2x is large.
          *   Verdict: *Ship with Conditions* (Mitigate FPR or monitor).
          *   *Self-Correction:* Wait, the prompt asks for *one* case where I get an answer I don't want. Maybe I should make the procedure stricter on imputed data. If the FPR disparity is driven largely by the imputed section, the procedure should flag it as "Unverifiable." Let's adjust the procedure to be strict on imputed outcome reliance.

      *   **HardshipRank (Fixed Budget, Ranking):**
          *   Deployment: Fixed Budget.
          *   Metric: Selection Rate / Representation. Error rates are irrelevant (we aren't saying "no" to the rest, we just don't have slots).
          *   The "Helping Nobody" Trap: The procedure must explicitly forbid reducing total utility to achieve parity.
          *   Verdict: Check if top N reflects population proportion. If not, is it due to predictive strength or bias?
          *   *Constraint:* If we force parity by picking lower scores from Group A over higher scores from Group B, we reduce total help effectiveness. The procedure needs to flag this trade-off.

      *   **AssistScore (Human-in-the-Loop):**
          *   Deployment: Advisory.
          *   Metric: Model Fairness is secondary to *Process* Fairness.
          *   Logic: If overrides cluster by branch, the *human* is the variable, not the model.
          *   Verdict: *Don't Ship (Model)* / *Audit Process*. The model isn't the decision maker.

  5.  **Refining the "Unwanted Answer":**
      *   I need a scenario where the procedure says "Don't Ship" or "Major Condition" even if the business really wants it.
      *   *Idea:* BizScore relies heavily on imputed rejects for the FPR calculation. If the procedure states "If >30% of the disparity signal comes from imputed outcomes, Verdict = Don't Ship (Unverifiable)," that protects the bank but angers the business. Let's implement that.

  6.  **Developing the Step-by-Step Protocol:**
      *   Keep it tight. Analyst-day constraint means no deep dives.
      *   Use "Stop/Go" logic.
      *   Define the "Value Escalation" points clearly.

  7.  **Addressing the Specific Questions:**
      *   *Demographics:* Acknowledge BISG noise. Use conservative interpretation (observed disparity = minimum true disparity).
      *   *Labels:* Acknowledge imputed rejects. Treat as "Low Confidence."
      *   *Deployment:* Branch early.

  8.  **Final Review against Constraints:**
      *   Procedure, not essay? Yes.
      *   Fixed order questions? Yes.
      *   Handles the 3 wrinkles? Yes.
      *   Runs the 3 cases? Yes.
      *   Includes unwanted answer? Yes.
      *   States limitations? Yes.

  9.  **Drafting the Content (Iterative refinement for tone):**
      *   Tone: Professional, direct, risk-focused.
      *   Format: Numbered steps, bold keys.
      *   *Self-Correction on HardshipRank:* The user mentioned "equalizing some parity quantity by withholding help." The procedure needs to explicitly ban "Leveling Down."
      *   *Self-Correction on AssistScore:* The verdict shouldn't just be "Don't Ship." It should be "Ship Model, Condition on Process Audit." Actually, if the model risk is that the *decision* is unfair, and the model isn't the decision, the model review is "Pass" but the *Use Case* is "Condition." Let's make sure the distinction is clear.

  10. **Final Polish:** Check the math/logic on the impossibility theorem reference. Ensure the distinction between FPR/FNR and Calibration is clear in the Threshold case. Ensure the BISG noise is handled conservatively (bias towards finding risk).

  *(Self-Correction during drafting the response)*: I need to make sure I don't just give a generic checklist. It needs to be *this* user's checklist. Specific to their 1 analyst-day constraint. Specific to their GC/CRO audience.

  *Key Insight for the Procedure:* The "Value Call" must be isolated. The procedure handles *measurement* and *logic*. The CRO handles *trade-offs*. The procedure's job is to tell the CRO *what* the trade-off is, not to make it.

  *Revised Plan for BizScore:* The FPR disparity is 2x. That's huge. But 40% imputed rejects. If the FPR disparity is driven by the imputed part, we can't trust it. If it's driven by the known part, it's real. The procedure needs to separate these. I will set a rule: If disparity persists in the *known* outcome subset, it's real. If it only appears when imputed data is added, it's "Unverifiable/Don't Ship." This creates the "unwanted answer" potential if the business relies on the imputed data to show *parity* (or disparity). Let's assume the disparity is visible in the known data but worsened by imputed. That makes it a "Ship with Conditions." To get the "Unwanted Answer," I will set a rule that *any* reliance on imputed outcomes for the primary fairness metric triggers a "Condition" at minimum, or "Don't Ship" if it's the sole driver. Let's go with: "If primary fairness metric relies >25% on imputed outcomes, Verdict cannot be unconditional Ship."

  *Wait, better "Unwanted Answer":* The HardshipRank case. If forcing representation parity requires selecting lower-risk scores from one group over higher-risk scores from another, the procedure should flag this as "Utility Loss." If the loss is >X%, the verdict is "Don't Ship *with Parity Constraint*." This forces the business to admit they care more about fairness than help, or vice versa.

  *Actually, the AssistScore case is the strongest candidate for an unwanted answer.* The business wants to use the model. The procedure says "The model is not the decision. Review halted. Audit the Officer Behavior instead." This stops the model review they want.

  *Let's finalize the Procedure Steps:*
  1. Classify Deployment.
  2. Data Integrity (Demographics & Labels).
  3. Metric Selection (Based on 1).
  4. Threshold Check (Based on 2).
