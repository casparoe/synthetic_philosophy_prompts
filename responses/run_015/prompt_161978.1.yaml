answer: |-
  Here is the **Model Risk Fairness Triage (MRFT)**. It is designed for a one-day review, a non-technical audience, and noisy data. It isolates factual findings from value judgments.

  ### The Procedure

  **Step 1: Classify Deployment Shape**
  *   **Q1:** Is the model output the final decision?
      *   **Yes (Threshold):** Go to Step 2A.
      *   **No (Ranking/Budget):** Go to Step 2B.
      *   **No (Advisory/Human-in-Loop):** Go to Step 2C.

  **Step 2A: Threshold (Approve/Decline)**
  *   **Q2:** What is the primary harm of error?
      *   **Loss (False Positive):** Select **False Positive Rate (FPR) Parity**.
      *   **Opportunity (False Negative):** Select **False Negative Rate (FNR) Parity**.
      *   **Both:** Select **Equalized Odds** (requires both FPR/FNR parity).
  *   **Q3:** Does the chosen metric differ by >10% between groups *in the observed data subset*? (Ignore imputed outcomes for this check).
      *   **Yes:** **Verdict: Don't Ship** (Disparity is verified).
      *   **No:** Proceed to Q4.
  *   **Q4:** Does the metric differ by >10% when *imputed outcomes* are included?
      *   **Yes:** **Verdict: Ship with Conditions** (Condition: Monitor actual performance; disparity is unverified but possible).
      *   **No:** **Verdict: Ship** (regarding fairness).

  **Step 2B: Ranking (Fixed Budget)**
  *   **Q5:** Is the goal to maximize total utility (sum of scores) or ensure group representation?
      *   **Maximize Utility:** Select **Selection Rate** only as a monitor. Do not enforce parity.
      *   **Ensure Representation:** Select **Demographic Parity** (Selection Rate Equality).
  *   **Q6:** If Demographic Parity is selected, does enforcing it require selecting candidates with lower scores from Group A over higher scores from Group B?
      *   **Yes:** **Verdict: Don't Ship** (with Parity Constraint). *Note: This forces the "Leveling Down" conversation.*
      *   **No:** **Verdict: Ship** (with Monitoring).

  **Step 2C: Advisory (Human-in-Loop)**
  *   **Q7:** Are override rates consistent across branches/demographics?
      *   **No (Overrides cluster):** **Verdict: Don't Ship** (Audit the Human Process, not the Model).
      *   **Yes:** Proceed to Step 3.

  **Step 3: Data Integrity Check (All Paths)**
  *   **Q8:** Are protected attributes imputed (e.g., BISG)?
      *   **Yes:** Apply **Conservative Bias**. Any observed disparity is treated as a *minimum* bound. If observed disparity is <5%, treat as **Inconclusive** (Verdict: Ship with Conditions).
      *   **No:** Proceed.
  *   **Q9:** Is the label (outcome) imputed for rejected applicants?
      *   **Yes:** If the fairness verdict in Step 2 relies >25% on imputed outcomes, **Verdict: Ship with Conditions** (Condition: Validate with actuals within 12 months).

  **Step 4: Value Escalation**
  *   If Step 2 yields a conflict between Utility and Fairness (e.g., HardshipRank), or Step 2C yields a Process failure, **escalate to CRO**.
  *   **Deliverable:** A one-page memo stating: "To achieve X fairness, we sacrifice Y utility," or "The risk lies in the Officer, not the Model."

  ***

  ### Running the Procedure on Your Cases

  #### 1. BizScore (Threshold, Imputed Rejects, FPR Disparity)
  *   **Step 1:** Threshold.
  *   **Step 2A:** Harm is Loss (denying a good borrower). Metric = **FPR Parity**.
  *   **Step 2A (Q3):** FPR disparity is 2x (100% increase). Is this in the *observed* data?
      *   *Scenario A:* The 2x disparity exists in the 60% of applicants with known outcomes.
          *   **Verdict:** **Don't Ship.** (The disparity is verified fact, not artifact).
      *   *Scenario B:* The 2x disparity only appears when the 40% imputed rejects are added. The observed data shows parity.
          *   **Verdict:** **Ship with Conditions.** (Condition: Monitor actual default rates by group for 12 months. The disparity is plausible but unproven).
  *   **Step 3 (Q8/Q9):** Demographics imputed (Conservative Bias applied). Labels imputed (Condition applied).
  *   **Result:** Even if Scenario B applies, you cannot give Counsel an unconditional "Ship." You must hand them a **Condition**.
  *   **The Unwanted Answer:** If the business argues the imputed data is "good enough" to prove safety, the procedure says **No**. You cannot sign off on a verified disparity in observed data, and you cannot sign off on unverified disparity in imputed data without a monitoring condition. Counsel gets a "Condition," not a clean pass.

  #### 2. HardshipRank (Fixed Budget, Ranking)
  *   **Step 1:** Ranking.
  *   **Step 2B:** Goal is Help.
      *   *Option 1 (Utility):* Maximize successful counseling. Metric = Average Score of Selected.
      *   *Option 2 (Fairness):* Equal representation. Metric = Selection Rate Parity.
  *   **Step 2B (Q6):** To get equal representation, you must skip high-score Group B applicants to take lower-score Group A applicants.
      *   **Verdict:** **Don't Ship (with Parity Constraint).**
  *   **Why this matters:** Your friend's "pick a metric" approach would silently license picking lower-score applicants to make the spreadsheet look good ("Leveling Down"). This procedure blocks that. It forces the CRO to sign a memo saying: *"We are intentionally helping fewer people total to achieve demographic balance."*
  *   **Result:** The procedure prevents the "quiet" moral choice. It forces the trade-off into the open.

  #### 3. AssistScore (Human-in-the-Loop)
  *   **Step 1:** Advisory.
  *   **Step 2C:** Overrides cluster by branch (30% override rate, non-random).
  *   **Step 2C (Q7):** Overrides are inconsistent.
  *   **Verdict:** **Don't Ship (Model).**
  *   **Reasoning:** The model is not the decision engine; the Loan Officer is. Auditing the model for fairness is statistically invalid because the *process* introduces unmeasured bias.
  *   **Result:** You stop the model review. You tell the CRO: *"We are auditing the wrong object. The risk is in the Branch Managers, not the Score."* This saves you from defending a model that doesn't actually control the outcome.

  ***

  ### What This Procedure Cannot Do

  **1. It cannot solve the Impossibility Theorem.**
  *   **Limitation:** In BizScore, if you have different base rates (default rates differ by group), you *cannot* have FPR parity and FNR parity simultaneously.
  *   **The Value Call:** Step 2A forces you to pick *one* harm (Loss vs. Opportunity). The procedure does not tell you which harm is worse. **The CRO must sign off on the choice of metric.** Your memo must say: *"We prioritized preventing False Declines over preventing False Defaults. This is a business policy choice."*

  **2. It cannot correct Noisy Demographics.**
  *   **Limitation:** BISG (surname/tract) is ~75% accurate. If the error is correlated with the score (e.g., the model underestimates risk for a specific ethnicity that BISG also misclassifies), the bias is hidden.
  *   **The Value Call:** Step 3 applies a "Conservative Bias" (observed disparity = minimum true disparity). However, if observed disparity is zero, the procedure says "Inconclusive," not "Fair." **Counsel must accept that 'No Disparity Found' does not mean 'No Disparity Exists'.**

  **3. It cannot validate Imputed Labels.**
  *   **Limitation:** Reject inference is a guess. If the vendor's imputation method assumes the rejected applicants would have performed like the approved ones, it hides bias.
  *   **The Value Call:** Step 3 (Q9) flags this as a Condition. It does not fix it. **The business must accept the risk that the model may be recalled in 12 months if actuals diverge from imputed data.**

  ### Summary for Counsel/CRO
  When you hand this over, the cover memo says:
  1.  **Deployment:** [Threshold/Rank/Advisory]
  2.  **Primary Harm:** [Loss/Opportunity/Process]
  3.  **Verified Disparity:** [Yes/No/Inconclusive due to data]
  4.  **Required Trade-off:** [e.g., "To fix FPR, we must increase Defaults by X%"]
  5.  **Verdict:** [Ship / Ship w/ Conditions / Don't Ship]

  This removes the "who talks louder" dynamic. If the data shows verified disparity in Step 2A, the argument is over. If the data is noisy, the argument shifts to "Are we willing to accept the Condition?" which is a business decision, not a statistical one.
