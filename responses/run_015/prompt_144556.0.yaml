answer: |-
  The summary correctly diagnoses widespread inferential confusion but oversells Bayesianism as a panacea and underestimates biological heterogeneity.

  **NHST and Inversion:** Statisticians grant the inversion error (confusing $P(D|H_0)$ with $P(H|D)$) is ubiquitous and drives overconfidence. They qualify this as a defect of usage and teaching, not the frequentist method itself, which never promised $P(H|D)$. They reject that this confusion is the sole engine of the crisis; low power and publication bias are co-equal drivers.

  **Ioannidis and Flukes:** Experts grant Ioannidis's logic regarding prior probability and power. They qualify "most findings are false" as model-dependent rather than empirical fact. They reject that $p < 0.05$ tells one "nothing"; it bounds Type I error rates under strict assumptions, though those assumptions are often violated.

  **Bayesian Remedy:** Experts grant Bayes yields $P(H|D)$ and obeys the Likelihood Principle, making it theoretically immune to stopping rules under coherent subjective priors. They qualify that this immunity vanishes with objective default priors or if the prior is influenced by peeking. They reject the implication that Bayes eliminates researcher degrees of freedom; prior selection offers new opportunities for subjectivity. Preregistration prevents selective reporting but cannot rescue underpowered designs.

  **Fraud:** They reject that fraud is rare or untouchable; preregistration makes deviation detectable.

  **Your Third Category:** This is genuine and distinct from inference errors or selective reporting. It concerns external validity rather than internal validity. A $p$-value or Bayes factor assesses evidence within a specific dataset; neither guarantees the mechanism operates identically in a different batch, season, or species. This is not "flukes" disguised; it is biological context-dependence.

  **Conclusion:** The book's practical conclusion does not survive correction. Adopting Bayes plus preregistration would reduce false positives from $p$-hacking and clarify evidence strength, but it will not solve the crisis because it does not address low power, measurement noise, or the biological heterogeneity you observed. If many non-replications stem from effects failing to transport rather than original false positives, statistical reform will leave a substantial portion of the crisis untouched. The crisis is partly arithmetic, but partly biological and sociological; no change in inference alone resolves the mismatch between controlled experiments and variable nature.
