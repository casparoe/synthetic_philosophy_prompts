      *   **Great Man (Intentionalism):** Focuses on Hitler's unique will, charisma, tactical genius, and ideological drive. Without him, the specific *form* and *timing* of the Third Reich do not happen.
      *   **Functional-Substitution:** This is the core of the prompt. It asks not "Was Hitler unique?" but "Was the *function* he performed unique?" Could Goering, Strasser, or Hugenberg have signed the Enabling Act? Could they have orchestrated the Night of the Long Knives?

