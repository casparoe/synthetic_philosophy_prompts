          *   *Verdict:* Confirms structural necessity for *an* authoritarian shift, but leaves the *Nazi* specificities as anomalies.

      *   **Section 2: The Agency Case (The Filling of the Vacuum):**
          *   *Focus:* 1933-1934 specific decisions.
          *   *Reichstag Fire/Enabling Act:* Hitler's legalistic veneer. A generic general might have just declared martial law. Hitler used the parliament to kill the parliament.
