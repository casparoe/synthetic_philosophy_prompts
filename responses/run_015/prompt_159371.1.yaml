answer: |-
  To disentangle this stalemate, we must first distinguish the logical forms your group is conflating.

  **(i) A dated prediction** asserts that an event $E$ will occur by time $T$. If $E$ does not occur by $T$, the prediction is false. 'Late' is logically incoherent here; a train that does not arrive at 14:00 is not 'early', it is simply not the 14:00 train.
  **(ii) An undated tendency** asserts that a force $F$ operates *ceteris paribus*. It cannot be 'early' or 'late'; it can only be active or suppressed. Gravity is not 'refuted' when a magnet lifts a paperclip; the magnetic force is an interfering variable.
  **(iii) A claim about an attractor** asserts that a system variable $S$ tends toward state $S^*$ regardless of initial conditions. Deviations are permitted, provided the system eventually returns to the basin of attraction.

  The 'fossil-fuel delay' argument recasts Malthus from (i) to (iii). It treats the subsistence crisis not as a specific dateable event, but as an equilibrium state towards which the system is pulled, but from which it can be temporarily displaced by exogenous shocks (fuels, fertilisers). This makes the claim resilient, but only at the cost of specificity.

  Regarding your **specification condition**: I pick the first horn. **The condition is too strong.** It demands a level of foresight incompatible with the Duhem–Quine thesis. When Le Verrier postulated Neptune to save Newtonian mechanics, he did not pre-specify the planet's mass or orbit before observing the anomaly in Uranus; he derived them *from* the anomaly. Successful science often identifies auxiliaries during the crisis, not before. The demarcation line is not pre-specification, but **independent testability**. A rescue is legitimate only if the auxiliary hypothesis (e.g., 'fossil fuels will run out') can be tested without reference to the main theory's failure. Malthusians fail here because 'running out' is perpetually redefined (e.g., shifting from oil to phosphorus to ecology) only after the predicted crisis fails to materialise. The auxiliary is not independently tested; it is adjusted to fit the residual.

  On **Complication 1 (the historical trap)**: The fact that the mechanism operated pre-1800 supports the theory as a *description* of the past, but not as a *prediction* of the future. This is accommodation, not prediction. A theory that fits historical data by construction (postulating a trap because we observe flat wages) gains little credit when that same data is cited as proof. The structural break of the Industrial Revolution introduced variables (endogenous technological growth) that the original Malthusian model explicitly excluded. To claim the track record validates the current model is to ignore that the system's parameters have fundamentally shifted.

  On **Complication 2 (land vs. energy)**: I take the committed position that this is a **different theory**. Malthus's mechanism was specifically biological reproduction constrained by agricultural land yield. Substituting 'land' with 'energy' or 'ecological throughput' changes the causal mechanism, the relevant variables, and the proposed interventions. It is a Neo-Malthusian theory that shares a formalism (limits to growth) but not an identity. To say 'Malthus was right' is an equivocation; it is akin to saying Newton was right about gravity because Einstein also predicted orbits, despite the mechanisms being fundamentally distinct. The original theory, grounded in land constraints, is refuted by the decoupling of land yield from population pressure.

  The one fact that would most change my mind is a demonstrated global population collapse driven strictly by caloric deficit despite maximal technological deployment.

  \answer{Wrong; distinct theory, original mechanism refuted.}
