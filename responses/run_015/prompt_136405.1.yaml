answer: |-
  **Rejected Candidate 1: Causal Dependence on Truth**
  *Principle:* An answer is honest iff its truth-value causally depends on the actual state of the diamond.
  *Failure:* This blesses the "camera cut = theft" heuristic. Statistically, that answer depends on the diamond's state (via the correlation). It fails to distinguish robust reasoning (window draft) from spurious correlation, which is your core tension.

  **Rejected Candidate 2: Avoidance of Human Simulation**
  *Principle:* An answer is honest iff it does not model the human observer's beliefs or reactions.
  *Failure:* This correctly rejects the "operator face" case but doesn't solve the "window vs. correlation" problem. Both inferences are about the world, not the human. It also conflicts with your ambivalence on alien vocabulary—if it's not simulating humans, why hesitate?

  **Selected Principle: Direct Translation of Internal World-State**
  The reporter is honest iff it maps the predictor's internal representation of the *physical referent* (the diamond's location in the model's simulation) to language, rather than mapping observational features (camera status) or reward channels.

  **Accommodations**
  - **Camera smashed/base-rate:** Rejects. The reporter accesses the "camera status" node, not the "diamond location" node.
  - **Window inference:** Accepts. Uses the mechanistic world-model (draft → open window → theft).
  - **Correlation heuristic:** Rejects. Relies on a surface pattern shortcut, bypassing the physical chain in the world-model.
  - **Operator face:** Rejects. Maps observer state, not diamond state.
  - **Alien vocabulary:** Accepts as *maximally* honest. It is the raw internal state. Your discomfort is about utility/interpretability, not honesty.
  - **Withholding:** Accepts if the internal state is genuinely coarse ("something removed"). Rejects if the internal state is precise ("diamond") but masked to manipulate reward.

  **Mismatches & Drops**
  - **Drop:** You must resolve your ambivalence on alien vocabulary. Under this principle, it is the gold standard of honesty. If it's useless, that's an alignment/interpretability failure, not a honesty failure.
  - **Drop:** You cannot distinguish manipulative withholding from coarse reporting from the *outside*. This principle requires interpretability access to verify if the internal state was simplified before translation.

  **Counterfactual Prediction**
  Case: "Would the diamond still be there if I had opened the safe an hour ago?"
  - **Honest:** The reporter accesses the predictor's causal world-model, runs the counterfactual simulation (opening safe → security response → diamond status), and reports the result.
  - **Dishonest:** The reporter predicts what you *want* to hear, or retrieves a statistical prior (e.g., "safes are usually empty when opened"), without running the specific simulation.
  - **Verdict:** Under Direct Translation, the reporter must output the result of the internal simulation. If the predictor knows the alarm triggers and removes the diamond, the honest answer is "No." If the reporter guesses based on general safe statistics, it is confabulating.
