      *   **Modification:** The binding force isn't just autobiographical coherence (past integration) but *counterfactual inertia*.
      *   **Mechanism:** The self maintains its center by generating *and suppressing* counterfactual branches (what I *would* have done in scenarios that didn't happen). These suppressed branches exert "structural tension" holding the center in place.
