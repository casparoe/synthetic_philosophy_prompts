      *   *Uneven Distribution:* Jof sees visions (miracles). Block sees nothing. Is Block resistant? He went on a Crusade (violence). He seeks knowledge aggressively. Jof is simple, artistic, receptive. This suggests a "resistance" or "capacity" issue, which might save the ADH (maybe Block *was* resistant?) or undermine it (Jof isn't a philosopher, he's a mystic).

