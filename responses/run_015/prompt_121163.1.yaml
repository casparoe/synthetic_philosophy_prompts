  **Frequently Asked Questions: PhD in Multi-Species Historiography**
  **University of Lower Silesia | Department of Post-Human Records**

  The University of Lower Silesia is pleased to outline the administrative requirements for the upcoming cohort. Please review the Agency Allocation Protocol (AAP) carefully before submitting your proposal.

  **How is dissertation authorship calculated under the Agency Allocation Protocol (AAP)?**
  All doctoral candidates must submit a finalized AAP ledger alongside their manuscript. This document apportions credit between human and non-human actors based on a weighted formula of Counterfactual Dependency and Material Persistence. For example, if a thesis argues that a specific policy failure was caused by drought, the drought must be listed as a primary author. The percentage split is determined by calculating how much the narrative collapses without the non-human input versus the duration of the geological evidence. If the soil composition remains stable for millennia while the human government lasts only decades, the soil receives majority credit. Please note that miscalculating the persistence weight of a sediment layer is grounds for procedre failure.

  **Is it permissible to list *Yersinia pestis* as a co-advisor?**
  Yes, provided the specific strain is viable or historically verified through genomic sequencing. The candidate must submit Form 12B (Biohazardous Mentorship Clearance) to the graduate comittee. While *Yersinia* cannot sign paperwork, its agency is represented by a faculty liason specializing in epidemiological vectors. Candidates should be aware that advising fees associated with bacterial actors are non-negotiable and must be paid in nutrient agar equivalents. If the strain mutates during the dissertation period, a revised authorship contract must be filed within thirty days.

  **Why was the 1815 Tambora eruption granted an honorary doctorate?**
  The University Senate recognized Mount Tambora's exceptional contribution to global historiography during the Year Without a Summer. Under the AAP guidelines, Tambora demonstrated superior Material Persistence compared to the average human dissertator. Its ability to alter atmospheric conditions, disrupt agricultural cycles, and force migratory patterns across three continents satisfied the threshold for Outstanding Non-Human Achievement. The degree was accepted by proxy via the Department of Volcanology, as the entity lacks hands to receive the diploma. Commencement speeches were delivered facing the crater to ensure proper acoustic respect.

  **Does this framework negate human decision-making?**
  The program does not negate choice but recontextualizes it within a distributed causality model. Human intent is treated as a variable dependent on microbial viability, climatic stability, and tectonic patience. When a candidate argues that a general lost a battle, the AAP requires an assessment of whether mud conditions permitted troop movement. If the mud holds greater counterfactual weight than the general's strategy, the mud is credited with the outcome. This ensures historical records accurately reflect the power dynamics between flesh and terrain. Humans are viewed as nodes through which larger material forces express temporary will.

  **How do we cite a glacier in the bibliography?**
  Standard APA formatting applies, with the addition of melt-rate data and calving coordinates in the publication field. If the glacier has receded since the research began, a footnote must acknowledge the actor's partial dissolution. Candidates are reminded that citing a non-existent actor constitutes academic misconduct unless framed as a study in absence.

  **Contact Information**
  For further inquiries regarding the AAP formula or biohazardous clearances, please contact the Registrar's Office. Do not send mail to the volcano.

  **Commentary on the liberties taken**

  This satire relies on the confidence that blurring agency and causation creates bureaucratic absurdity. By forcing a formulaic split of credit, the text highlights the impossibility of quantifying intent in non-sentient forces. The joke lands because administrative language demands precision where philosophy offers only ambiguity. However, I am least sure about the caricature of "Material Persistence." Attributing persistence to volcanoes might not be entirely unfair; geological time scales do outlast human records. If the satire suggests this metric is inherently ridiculous, it might drift into straw-man territory, as environmental historians genuinely grapple with deep time. The humor works best when focusing on the assignment of *interests* rather than the mere longevity of matter. Treating a volcano as a bureaucrat is funny; treating it as a long-term archive is arguably accurate. The tension lies in whether longevity equals agency, and the FAQ pretends the administration has solved that puzzle with a spreadsheet.
