prompt: |-
  I'm a junior double-majoring in statistics and philosophy, and this term I'm in an upper-level seminar on chance, evidence, and induction. Part of the requirement is that each of us leads one 75-minute session for the other seventeen people in the room. Most of my classmates have had one applied statistics course and one logic course. The last two weeks of the seminar have been spent on what probability statements are even about — long-run relative frequencies, objective single-case chances, or degrees of belief — and the room has split in a way that feels like temperament rather than argument. My session is in ten days, and I don't want to add a fourth position statement to the pile. I'd rather run a game.

  Here's what I want people to walk out having felt, rather than having been told.

  First: that for a one-off event it isn't obvious what "the probability" is a number about. The same event seems to admit three different questions — how often does this kind of thing happen, what is this particular setup disposed to produce, how confident should someone with my information be — and in clean cases all three return the same number, which is exactly why nobody notices there are three.

  Second: that a quantity tracking the evidence can come apart from a quantity tracking the setup. I want them to meet a case where the physical chance is plainly one thing and the reasonable confidence is plainly another, and to have to decide which of those numbers is the one they'd actually bet at.

  Third: that "how often does this kind of thing happen" has no unique answer, because the kind has to be chosen. I want them handed genuine frequency figures for one specific event from three nested classes and made to feel the choice as a choice rather than a calculation.

  What I've sketched, and would like you to build into something runnable — or to replace with a better mechanism:

  Three cases, priced one at a time. (A) A die is about to be rolled: symmetric setup, outcome not yet settled. (B) A die was rolled inside a sealed box before class: same die, same setup, but the outcome is already fixed and nobody in the room knows it. (C) A one-off claim about a named person in the room — I was thinking whether that person will still be enrolled here four terms from now, where I can pull real retention figures for the university as a whole, for students in this major, and for first-generation students, and those three numbers differ. Everyone writes down a number between 0 and 1 for each case.

  Payoffs without money. My understanding is that a squared-error rule — you receive 1 minus the squared distance between your number and the outcome, so a confident correct call pays 1 and a confident wrong call pays 0 — makes it against your interest to write down anything other than what you really think. Is that right? Does it survive being run only once per case, where a lucky extremist beats a careful 0.6? And is there a payoff structure that also rewards whatever the frequency-based or chance-based intuition is genuinely good for, so the game doesn't quietly become an advertisement for one of the three views? That last worry is the one I care about most. I can see how to make evidence-sensitivity vivid in play; I can't see how to make the pull of "the chance is one-in-six and that isn't up for grabs" show up in play rather than only in my summary at the end.

  One complication I want to stage. Before case B, I take a single student into the hall and let them look inside the box. Back in the room they write a number too. If the payoff rewards accuracy they will win, and if the number they write is 1 or 0 the class has to deal with someone who is certain about an event the rest of the room is calling one-in-six, and who has made no mistake at all.

  What I need from you: exact rules and the order of operations; what I prepare in advance (index cards, envelopes, dice, a whiteboard, a laptop with a spreadsheet, no internet in the room); a minute-by-minute timeline for 75 minutes with the debrief built into it rather than tacked on; the scoring formula in a version I can compute for eighteen people in about two minutes; and whether anyone needs a role other than "bettor."

  Then the debrief: which moment in the game is meant to produce which of the three points above, and what I say when a moment produces something else. What will predictably go wrong the first time I run it — my guesses are that someone demands to be told the correct number, that the student who peeked refuses to commit, that case C gets swamped by what people happen to know about the person, and that a one-shot scoring rule rewards bluffing — and how I handle each without the last twenty minutes turning into a lecture.

  Finally, be honest about what the game can't do. I suspect it can't manufacture the intuition that there's an objective single-case chance that evidence doesn't touch, that it can't show why long-run frequencies should constrain anything, and that a scoring rule only rewards honesty in expectation by your own lights. Tell me which of those I have to supply myself, roughly in how many sentences, and where in the session.

  And if the three cases run short: what fourth case should I keep in my pocket? Ideally one where the chance itself is what's unknown, so that "what I'd bet at" and "what I think the chance is" come apart for a different reason than they do in case B.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User:** Junior double-major in Statistics and Philosophy.
      *   **Context:** Upper-level seminar on Chance, Evidence, and Induction (18 students total).
      *   **Class Background:** Most have 1 applied stats course, 1 logic course. Recent weeks focused on interpretations of probability (frequentist, propensity/chance, Bayesian/credence).
      *   **Goal:** Lead a 75-minute session. Avoid adding a fourth theoretical position. Instead, run a *game/experience* to make three specific philosophical points felt, not just told.
      *   **The Three Points:**
          1.  One-off events admit three different questions (frequency, chance, credence) that usually align but are distinct.
          2.  Evidence (credence) can come apart from Setup (chance).
          3.  Reference class problem (frequency depends on how you carve the "kind").
      *   **Proposed Mechanism:** Three cases (Die roll future, Die roll past/hidden, Student retention). Scoring rule (Brier score/Squared error). One "insider" for Case B.
      *   **Needs:** Exact rules, prep list, minute-by-minute timeline, scoring formula (fast), roles, debrief mapping, troubleshooting predictions, limitations analysis, backup case.

  2.  **Evaluate the Proposed Mechanism:**
      *   *Case A (Future Die):* Good for aligning Chance/Credence/Frequency.
      *   *Case B (Past Die):* Excellent for separating Chance (still 1/6 physically?) from Credence (1 or 0 for insider, 1/6 for others). *Correction:* Philosophically, propensity theorists might say chance is 0 or 1 once rolled. Frequentists say it's irrelevant. Bayesians say it's epistemic. This is the crux of the tension.
      *   *Case C (Retention):* Perfect for Reference Class problem.
      *   *Scoring Rule:* Brier Score ($1 - (p - o)^2$) is proper. It incentivizes reporting true credence *if* the goal is to maximize expected score based on one's belief.
      *   *Worry:* "One-shot scoring rule rewards bluffing." *Analysis:* Proper scoring rules incentivize honesty *in expectation*. In a single shot, variance is high. A lucky 0.99 on a win beats a honest 0.6. However, with 18 students, the *average* behavior will show the trend. The user needs to manage the "lucky extremist" narrative during debrief.
      *   *Worry:* "Make the pull of objective chance show up in play." *Analysis:* This is hard. The game naturally favors the Bayesian (credence) view because scoring is based on *your* number vs. outcome. To make "objective chance" feel real, the die roll (Case A) needs to feel physical and constrained. The "Insider" in Case B is the key lever here.

  3.  **Refining the Game Mechanics:**
      *   *Scoring:* Needs to be fast. $100 - 100(p-o)^2$ gives points out of 100. Easier to sum mentally or on a quick spreadsheet.
      *   *Payoff:* "Without money." Points can translate to something trivial but symbolic (e.g., choosing the next reading, or just "bragging rights" + candy). Let's suggest candy or a "Philosophical Victory" certificate to keep stakes low but non-zero.
      *   *The Insider:* Crucial. They need a script. They must know the outcome.
      *   *Case C:* Needs to be anonymous enough to avoid personal bias but specific enough to trigger reference class thinking. "A randomly selected student from this seminar" is better than "Named person." Actually, the prompt says "named person in the room." Let's stick to the prompt but anonymize the data presentation to avoid gossip. Better: "A randomly selected student from this specific seminar." We can get retention rates for "Seminar Students," "Philosophy Majors," "University Average."
      *   *Timing:* 75 mins is tight for 3 cases + debrief. Need to move briskly.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Prep:* Dice, Box, Envelope, Spreadsheet (pre-formulated), Projector/Board.
      *   *Timeline:*
          *   0-5: Intro & Rules (Scoring).
          *   5-20: Case A (Future Die).
          *   20-35: Case B (Past Die + Insider).
          *   35-55: Case C (Reference Class).
          *   55-75: Debrief (The most important part).
      *   *Scoring:* Use a simplified Brier Score. $Score = 100 \times (1 - (prediction - outcome)^2)$.
      *   *Troubleshooting:*
          *   "Tell us the answer!": Deflect. The uncertainty *is* the point.
          *   "Insider won't commit": Prompt them. "You know. What is your degree of belief?"
          *   "Case C gossip": Use aggregate data, not specific person info.
          *   "Lucky Bluffer": Acknowledge variance. Focus on the *group* mean.
      *   *Limitations:* The game cannot prove Propensity theory. It demonstrates the *utility* of Credence. The instructor must bridge the gap to "Objective Chance" in the debrief.
      *   *Backup Case:* The "Biased Coin" or "Urn of Unknown Composition." This separates Estimated Chance from True Chance.

  5.  **Addressing Specific User Constraints:**
      *   *No Internet:* Spreadsheet must be offline/local.
      *   *Compute in 2 mins:* Pre-build the sheet. Input column = predictions. Outcome = 0 or 1. Formula does the rest.
      *   *Debrief Mapping:* Explicitly link Game Moment -> Philosophical Point.
      *   *Honesty about Limitations:* Be clear that the game is Bayesian-leaning by design (scoring rules measure credence). The "Objective Chance" intuition comes from the *resistance* of the physical setup (the die), not the scoring.

  6.  **Developing the Content:**

      *   *Scoring Rule:* The Brier Score is indeed proper. $S = 1 - (p - o)^2$. If $o=1$, $S = 1 - (1-p)^2 = 2p - p^2$. Derivative w.r.t $p$ is $2 - 2p$. Wait, expected score $E[S] = p_{true}(1 - (p-1)^2) + (1-p_{true})(1 - p^2)$. Maximize w.r.t reported $p$. $d/dp = 0 \implies p = p_{true}$. Yes, it works.
      *   *Single Shot Issue:* User is right. In one shot, variance dominates. I need to advise them to aggregate the class results to show the trend, rather than declaring a single winner as "philosophically correct."
      *   *Case C:* "Named person" is risky for privacy/social dynamics. Suggest "A randomly selected student from this room" but use data about *students like us*.
      *   *The Insider:* This is the highlight. The tension between the Insider (Credence = 1) and the Room (Credence = 1/6) while the "Chance" is debated.
      *   *Backup Case:* "The Hypothesis." A statement about the physical world that is either true or false but unknown (e.g., "There is life on Mars"). Frequency is N/A. Chance is debatable. Credence is all we have. Or the "Unknown Bias Coin" (Estimating the parameter). Let's go with "Unknown Bias Coin" as it separates *Estimated Probability* from *Physical Probability*.

  7.  **Final Polish:**
      *   Tone: Collegial, precise, respectful of the user's expertise (they know the stats/phil).
      *   Structure: Follow the user's requested sections (Rules, Prep, Timeline, Scoring, Debrief, Troubleshooting, Limitations, Backup).
      *   Emphasis: Ensure the "Objective Chance" intuition is addressed in the debrief section, as the game mechanics inherently favor Credence (due to scoring).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is 75 minutes enough?
      *   *Fix:* Tighten the instructions. Use a slide or board for the scoring formula so no time is wasted explaining math.
      *   *Critique:* How to make "Objective Chance" felt in play?
      *   *Fix:* In Case A, emphasize the *symmetry* of the die physically. In Case B, emphasize the *fixedness* of the outcome. The tension arises when the Insider wins easily. The class will feel the unfairness (epistemic inequality) vs. the physical reality.
      *   *Critique:* Scoring calculation.
      *   *Fix:* Provide the exact Excel formula. `=100*(1-(A2-B2)^2)`.
      *   *Critique:* Reference Class.
      *   *Fix:* Make sure the three numbers for Case C are distinct and plausible. E.g., Uni Avg (85%), Major Avg (90%), Seminar/Specific (70%).

  9.  **Final Review against constraints:**
      *   18 students.
      *   75 minutes.
      *   No internet.
      *   Address all 3 philosophical points.
      *   Address the "Insider" complication.
      *   Address the "Limitations" honestly.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to *feel* a metaphysical distinction through an epistemic task. The tension you've identified is real: scoring rules (like Brier) inherently reward *credence* (Bayesian), making it hard to give "objective chance" (Propensity/Frequentist) a voice in the gameplay itself. The game will naturally feel Bayesian; the debrief must rescue the other intuitions.

  Here is a runnable plan designed to maximize friction between the three interpretations without requiring you to lecture until the end.

  ### I. Preparation & Materials

  **Physical Items:**
  1.  **One high-quality, symmetric die.** (Casino style if possible; emphasizes physical symmetry).
  2.  **An opaque box with a lid.** (The "Black Box").
  3.  **18 Index Cards** (pre-labeled 1–18 for collection).
  4.  **1 Envelope** (sealed, containing the result of a die roll performed *before* class).
  5.  **Laptop + Projector** (Offline Excel/Sheets file pre-formulated).
  6.  **Whiteboard + Markers.**

  **Digital Prep (The Spreadsheet):**
  Create a sheet with columns: `Name`, `Pred_A`, `Pred_B`, `Pred_C`, `Score_A`, `Score_B`, `Score_C`, `Total`.
  *   **Formula for Score:** `=100 * (1 - (Prediction - Outcome)^2)`
  *   **Outcomes:** Hardcode `Outcome_A` (the live roll), `Outcome_B` (the pre-rolled result), `Outcome_C` (1 if enrolled, 0 if not).
  *   **Formatting:** Make the `Total` column large and visible.

  **Data Prep (Case C):**
  Print a handout or put on a slide three retention rates for "Students like the target":
  1.  **University Wide 4-year retention:** (e.g., 0.82)
  2.  **College of Arts & Sciences retention:** (e.g., 0.88)
  3.  **Philosophy/Stats Double Major retention:** (e.g., 0.94)
  *(Note: Ensure these numbers are plausible but distinct. Do not use real data about a specific classmate to avoid social awkwardness; use "A randomly selected student from this seminar" and apply the stats to that hypothetical person, or use a generic "Student X" profile.)*

  **The Insider:**
  Recruit one student 24 hours in advance.
  *   **Instruction:** "Open the envelope before class. Memorize the number. Do not tell anyone. In Case B, you must write a probability. You know the truth, but you are playing the same game as everyone else."
  *   **Script for them:** If asked why their number is 1 or 0, they say: "I'm maximizing my score."

  ---

  ### II. Rules & Scoring (The "Contract")

  **Time:** 0:00 – 0:05
  **Script:**
  "We are playing a prediction game. There are three cases. For each, write a number between 0 and 1 on your card. 0 means 'Impossible', 1 means 'Certain'.
  **The Payoff:** We use a **Brier Score**. Your points = $100 \times (1 - (\text{your number} - \text{actual outcome})^2)$.
  *   If the event happens (1) and you wrote 1: You get 100 points.
  *   If the event happens (1) and you wrote 0: You get 0 points.
  *   If you write 0.5: You get 75 points regardless of outcome.
  **Crucial Rule:** This formula mathematically rewards you *only* if you write your true degree of belief. Bluffing lowers your expected score.
  The winner gets [bragging rights / a bag of nice coffee / choice of next week's reading]."

  *(Note: The Brier score is a "proper scoring rule." It ensures that if you believe the chance is 60%, your expected points are maximized by writing 0.6, not 1 or 0. Acknowledge the single-shot variance in the debrief.)*

  ---

  ### III. Minute-by-Minute Timeline

  #### **Case A: The Future Die (0:05 – 0:20)**
  *   **Action:** Hold up the die. "I will roll this die in 2 minutes. Event: It lands on 6."
  *   **Task:** Students write `Pred_A`.
  *   **Collection:** Collect cards. Input numbers into the spreadsheet (or have a TA/helper do it while you proceed).
  *   **The Roll:** Roll the die visibly. Record outcome (1 or 0).
  *   **Immediate Reaction:** Ask for a show of hands: "Who wrote exactly 1/6 (0.167)?" "Who wrote higher? Lower?"
  *   **Goal:** Establish the baseline where Frequency, Chance, and Credence align.

  #### **Case B: The Past Die (The Insider) (0:20 – 0:35)**
  *   **Action:** Hold up the sealed box. "Inside is a die rolled *before class*. It is currently sitting on a 6 or not. Event: The die in the box is a 6."
  *   **Task:** Students write `Pred_B`.
  *   **The Insider:** The recruited student writes their number (1 or 0).
  *   **Collection:** Collect cards. Input numbers.
  *   **The Reveal:** Open the box. Show the die. Record outcome.
  *   **The Twist:** Project the scores immediately. The Insider will likely have 100 points. The rest of the class will have variance around 1/6.
  *   **Goal:** Create friction. The physical setup (Chance) hasn't changed from Case A, but the Epistemic State (Credence) has split.

  #### **Case C: The Reference Class (0:35 – 0:55)**
  *   **Action:** "Event: A randomly selected student from this seminar will still be enrolled in 4 terms."
  *   **Data:** Display the three retention rates (Uni, College, Major).
  *   **Task:** Students write `Pred_C`.
  *   **Constraint:** "You must choose *one* of the three numbers on the screen, or justify a new one." (Forcing the choice makes the reference class problem active, not passive).
  *   **Collection:** Collect cards. Input numbers.
  *   **Resolution:** "We cannot know the outcome today. For scoring purposes, we will use the **Major Retention Rate** as the 'Outcome' proxy." ( *Wait, this is tricky.* If you don't know the outcome, you can't score. **Correction:** You must score this to keep the game integrity.
      *   *Better Design for C:* Use a historical fact unknown to them. "Did the University retention rate exceed 85% in 2015?" Provide the three conflicting *estimates* from different reports, then reveal the true number.
      *   *Alternative (easier):* Stick to the "Student enrolled" prompt but acknowledge you can't score it yet. Tell them: "This case is not for points. It is for the argument. But you must commit to a number."
      *   *Best for Flow:* Use a **historical fact**. "Did it rain in this city on this date 10 years ago?" Provide three frequency classes: "Rain on any day," "Rain in this Month," "Rain on this date historically." Reveal the truth from a pre-downloaded almanac.
      *   *Let's stick to your prompt:* "Student enrolled." **Do not score this.** Make it a "Philosophical Bet." "If you were the Dean betting the budget, which number do you use?" This removes the scoring pressure and highlights the decision-theoretic nature of reference classes.)
      *   *Decision:* **Do not score Case C.** It breaks the "truth" requirement. Use it purely for the discussion on Reference Classes. Score only A and B.

  #### **Debrief & Synthesis (0:55 – 1:15)**
  *   **Action:** Project the leaderboard for A and B.
  *   **Discussion:** Move through the three points (see Section V).

  ---

  ### IV. Scoring Formula & Logistics

  **To compute in 2 minutes:**
  1.  Have the spreadsheet open.
  2.  Column A: Names. Column B: Prediction A. Column C: Prediction B.
  3.  Cell `Z1`: Outcome A (0 or 1). Cell `Z2`: Outcome B (0 or 1).
  4.  Column D (Score A): `=100*(1-(B2-$Z$1)^2)`
  5.  Column E (Score B): `=100*(1-(C2-$Z$2)^2)`
  6.  Column F (Total): `=D2+E2`
  7.  Sort by Column F.

  **Roles:**
  *   **You:** Facilitator/Philosopher.
  *   **One Student:** Data Entry (type the numbers as you collect cards). This saves you 5 minutes.
  *   **The Insider:** As described.

  ---

  ### V. The Debrief: Mapping Moments to Points

  Do not lecture immediately. Ask questions to draw the intuition out of the room.

  **Point 1: The Three Questions (One-off events)**
  *   **Moment:** Transition from Case A to Case B.
  *   **Ask:** "In Case A, almost everyone wrote ~0.167. In Case B, most of you wrote ~0.167 again. But the Insider wrote 1 (or 0). Did the *die* change? Did the *chance* change? Or did only the *evidence* change?"
  *   **The Feel:** If they feel the Insider *should* write 1, they admit probability tracks evidence (Credence). If they feel the Insider *should* write 1/6 because "it's still a random die," they are clinging to Objective Chance.
  *   **Your Summary:** "Case A and B had the same physical setup (Propensity) and same long-run frequency (Frequentist). Only the epistemic access changed. If your number changed, you are a Bayesian. If it didn't, you are a Propensity theorist."

  **Point 2: Evidence vs. Setup (Credence vs. Chance)**
  *   **Moment:** The Scoring of Case B.
  *   **Ask:** "The Insider likely won. Was that fair? They didn't predict the physics better; they just peeked."
  *   **The Feel:** The class will feel the Insider's win is "cheap" or "unearned" regarding the *physics*, but "correct" regarding the *score*.
  *   **Your Summary:** "The scoring rule rewards Credence (being right about the world). It does not reward understanding the Chance (being right about the setup). This is why 'Probability' in stats class (evidence) often fights 'Probability' in physics (setup)."

  **Point 3: The Reference Class (Frequency is a Choice)**
  *   **Moment:** Case C discussion.
  *   **Ask:** "Who used the University average? Who used the Major average? Why? There is no 'true' frequency until you choose the class."
  *   **The Feel:** Anxiety about being arbitrary.
  *   **Your Summary:** "Frequencies are real, but *which* frequency is relevant is a philosophical choice, not a mathematical one."

  ---

  ### VI. Troubleshooting: What Will Go Wrong

  **1. "Just tell us the right number."**
  *   **Prediction:** Students will ask this in Case B before writing.
  *   **Handle:** "If I tell you, the game breaks. The uncertainty is the variable we are measuring."

  **2. The Insider refuses to commit (writes 0.5).**
  *   **Prediction:** They feel it's dishonest to write 1 when others write 0.167.
  *   **Handle:** (Pre-brief them): "You are maximizing points. If you write 0.5 and you're right, you get 75. If you write 1 and you're right, you get 100. Your duty to the game is to win."
  *   **Debrief Use:** If they hedge, ask the class: "Why did they hedge? They know the truth. Is social pressure overriding the scoring rule?"

  **3. Case C gets swamped by gossip.**
  *   **Prediction:** "Oh, Sarah is dropping out, I'll write 0."
  *   **Handle:** Change the prompt to "A randomly selected student from the *Philosophy Department*." Keep it impersonal. Use the historical fact alternative if you fear social dynamics.

  **4. The "Lucky Extremist" beats the "Careful 0.6".**
  *   **Prediction:** Someone writes 0.99 on Case A, gets a 6, and wins.
  *   **Handle:** Acknowledge this explicitly. "In a single shot, variance wins. That is why statisticians demand long runs. But philosophically, was the 0.99 writer *rational*? No. We are judging rationality, not just luck." (This saves the Proper Scoring Rule argument).

  ---

  ### VII. Limitations: What You Must Supply

  You are correct to be worried. The game is structurally Bayesian.

  1.  **Objective Chance:** The game cannot *show* objective chance exists. It can only show the *resistance* of the world.
      *   *Where:* In Case A debrief.
      *   *What to say:* "You all wrote 1/6. Why? Not because of evidence (you had none), but because of the *symmetry of the die*. That intuition—that the number comes from the object, not your head—is the Propensity view. The game didn't prove it, but your instinct relied on it." (2 sentences).
  2.  **Frequentist Constraint:** The game doesn't show why frequencies constrain belief.
      *   *Where:* Case C debrief.
      *   *What to say:* "You chose the Major retention rate over the University rate. Why? Because you believe the 'true' frequency for *this kind* of student constrains your expectation. You treated frequency as a anchor." (2 sentences).
  3.  **Scoring Rule Expectation:**
      *   *Where:* Intro.
      *   *What to say:* "This rule rewards honesty *on average*. Today is not average. A liar might win. But if we played this 100 times, the liar would starve." (1 sentence).

  ---

  ### VIII. The Pocket Case (If you run short)

  **Case D: The Biased Coin (Unknown Chance)**
  *   **Setup:** "I have a coin. It is either Double-Headed (100% H) or Fair (50% H). I don't know which. I flip it once. It lands Heads."
  *   **Question:** "What is the probability the next flip is Heads?"
  *   **The Split:**
      *   *Frequentist:* "Undefined. N=1."
      *   *Propensity:* "Either 1.0 or 0.5. We don't know the chance."
      *   *Bayesian:* "It's > 0.5. The evidence (Heads) updates the likelihood that the coin is Double-Headed."
  *   **Why this works:** It separates **Estimated Probability** (Bayesian) from **True Physical Chance** (Propensity). The "True Chance" is fixed (either 0.5 or 1), but your "Bet" moves. This mirrors Case B but removes the "peeking" element, making it about *inference* rather than *access*.

  ### Final Advice for the Junior Seminar Leader
  You are not trying to solve the interpretation of probability. You are trying to make the *confusion* palpable. If students leave arguing about whether the Insider "cheated" by using knowledge vs. "won" by using evidence, you have succeeded. The discomfort *is* the lesson. Trust the game mechanics to create the friction; trust your debrief to name it.
