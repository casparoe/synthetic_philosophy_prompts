answer: |-
  Here is your prep sheet. I've ordered these by the likelihood they derail the talk, not by the order people will speak. The economists will likely speak first and set the tone; if you lose them, the CDTers will pile on.

  ### The "Kill Shot" (Do not lose this)
  **Objection 1: The Lead Economist (Correlated Equilibrium without a Device)**
  *   **The Phrasing:** "You've replaced 'identity' with a 'shared prior,' but you haven't explained the *source* of that prior. In standard game theory, correlation requires a signal or a mediator (Aumann's correlated equilibrium). If there's no physical causal link between the players, assuming a prior that correlates your decision procedures is just assuming the conclusion. You haven't solved the one-shot PD; you've just asserted a correlation device that doesn't exist."
  *   **The 2-Minute Reply:** "I agree that if the prior is empirical—based on past observations of this specific opponent—it collapses into standard Correlated Equilibrium. But I'm proposing the prior is *normative*, not empirical. It's a constraint on what counts as a rational procedure, akin to a logical axiom. We aren't correlating via a signal; we're correlating because rationality restricts the set of admissible procedures to those that recognize the symmetry of the situation. The 'device' is the shared requirement of coherence."
  *   **The Weakness:** This invites the follow-up: "Why is 'recognizing symmetry' a requirement of rationality rather than a preference?" If you can't ground the normativity, you're just stipulating cooperation.
  *   **Damage:** High. If the prior is unjustified, the whole model is empty.

  ### The "Same Hat" Pair (Flagged)
  *Note: Objection 1 (Economist) and Objection 4 (CDT 1) are the same objection. One demands a physical mechanism for correlation; the other demands a causal mechanism. Both deny the legitimacy of the correlation.*

  **Objection 4: The Lead CDTer (EDT in Disguise)**
  *   **The Phrasing:** "You say you've turned 'logical correlation' into 'ordinary conditional probability,' but that's exactly the problem. You are conditioning on your own action (or procedure output) to update the probability of the other's action. That is Evidential Decision Theory. You claim this is a fix for superrationality, but you've just reinvented EDT with extra steps. If you deny you're doing EDT, show me where the causal arrow goes."
  *   **The 2-Minute Reply:** "Standard EDT conditions on the *act* ('If I cooperate...'). I am conditioning on the *procedure* ('If my algorithm is Cooperate...'). The distinction matters because the procedure is the common cause of both outputs. I'm not saying my choice causes theirs; I'm saying our shared rationality constraints cause us to select the same procedure. It's a common-cause model, not a magical causation model."
  *   **The Weakness:** To the CDTer, 'procedure' is just a latent variable. If you can't intervene on the procedure independently of the act, they will treat it as conditioning on the act.
  *   **Damage:** High. (See Objection 1).

  ### The "Smuggling" Charge
  **Objection 2: The Second Economist (Repeated Game Logic)**
  *   **The Phrasing:** "This looks like you're smuggling the shadow of the future into a one-shot game. The only reason agents have correlated priors over procedures in the real world is because they've evolved or learned in repeated interactions. If you strip away the repetition, the 'shared prior' evaporates. You're solving a repeated game and calling it one-shot."
  *   **The 2-Minute Reply:** "I'm not relying on learning history. I'm relying on logical symmetry. Even in a truly one-shot game created five minutes ago, if two agents are rational and know they are rational, the set of procedures available to them is constrained by that knowledge. The 'repetition' isn't in time; it's in the logical structure of the reasoning process."
  *   **The Weakness:** "Logical structure" sounds mystical to an economist. They need a payoff-based story.
  *   **Damage:** Medium-High. Makes the model look inapplicable to real markets.

  ### The "Unit of Agency" Charge
  **Objection 6: The Team Reasoner (The 'We' Problem)**
  *   **The Phrasing:** "You're still framing this as 'What should *I* do to maximize *my* expected value given a prior about *them*.' That's the error. In a symmetric PD, the agents form a plural subject. You shouldn't be maximizing individual EV conditioned on a prior; you should be maximizing group utility directly. Your model is individualism with a band-aid."
  *   **The 2-Minute Reply:** "I want to derive the 'we' from the 'I,' not assume it. My goal is to show that an individual agent, concerned only with their own payoff but acknowledging the constraints of rationality, *arrives* at the team-reasoning outcome. If I can get cooperation without changing the unit of agency, the result is more robust, not less."
  *   **The Weakness:** They may argue that acknowledging the constraint *is* changing the unit of agency, so you're denying the premise.
  *   **Damage:** Medium. Philosophical framing issue, doesn't break the math.

  ### The "Intervention" Charge
  **Objection 5: The Second CDTer (Independence)**
  *   **The Phrasing:** "Let's talk about intervention. If I intervene to force you to Cooperate, does my partner Cooperate? No. Their choice is physically independent. Your model implies that if I were to defect, the probability of them defecting rises. But my choice doesn't change the physical state of their brain. How do you justify this dependency without backward causation?"
  *   **The 2-Minute Reply:** "I'm not claiming your choice changes their brain. I'm claiming your choice reveals which procedure you instantiated. Since the prior says rational agents instantiate the same procedure, your choice provides evidence about theirs. It's diagnostic, not causal. You're conflating 'causing the outcome' with 'predicting the outcome'."
  *   **The Weakness:** CDTers reject diagnostic reasoning for decision-making. They will say "Then why does it matter for the decision?"
  *   **Damage:** Medium. Standard CDT vs. EDT debate.

  ### The "Finite Mind" Charge
  **Objection 7: The Logician (Self-Reference)**
  *   **The Phrasing:** "You model players as having a distribution over decision procedures. But the decision procedure includes the act of sampling from that distribution. Doesn't this create a self-referential loop? How does a finite agent represent a probability distribution over a set that includes the agent's own representation?"
  *   **The 2-Minute Reply:** "We don't need the agent to represent the *full* set. We only need them to represent the *equivalence class* of procedures relevant to this game. We can use a fixed-point construction: the procedure is defined as the output of the reasoning process that accounts for the procedure. It's like a quine in code; it's finite but self-referential."
  *   **The Weakness:** Fixed-point theorems often assume conditions (continuity, compactness) that don't hold for discrete decision logic.
  *   **Damage:** Low-Medium. Technical nitpick, usually manageable.

  ### The "Introspection" Charge
  **Objection 8: The Bounded Rationality Researcher (Access)**
  *   **The Phrasing:** "Your model assumes I know my own decision procedure well enough to sample from a prior over it. But bounded agents don't have introspective access to their own algorithms. I know what I want, not how I compute it. How can I condition on a procedure I can't fully inspect?"
  *   **The 2-Minute Reply:** "Idealization. Normative decision theory assumes agents know their preferences and constraints. If we can't introspect perfectly, the theory describes what we *would* do if we were transparent to ourselves. It sets a ceiling for rational performance."
  *   **The Weakness:** If the ceiling is unreachable due to architectural limits, the theory loses normative force.
  *   **Damage:** Low. Standard "idealization" defense works here.

  ### The "Definition" Charge
  **Objection 3: The Third Economist (Rationality Definition)**
  *   **The Phrasing:** "In economics, 'rational' is defined as 'maximizing utility given beliefs.' You're defining 'rational' as 'choosing a procedure from a specific prior.' That's circular. You're just redefining rationality to mean 'cooperates in PDs'."
  *   **The 2-Minute Reply:** "I'm not redefining utility maximization. I'm adding a constraint on the *admissible beliefs*. Just as we rule out priors that violate probability axioms, I'm suggesting we rule out priors that violate symmetry constraints in symmetric games. It's a refinement, not a redefinition."
  *   **The Weakness:** "Why symmetry?" If they don't buy symmetry as a rational constraint, you're back to square one.
  *   **Damage:** Low. Semantic dispute.

  ---

  ### Strategic Advice

  **1. The First Minute Concession**
  Open by conceding the CDT/Econ overlap immediately. Say: *"I want to be clear: if the shared prior is treated as an empirical fact about the world, this view collapses into Evidential Decision Theory. I am not defending EDT. I am defending the claim that the prior is a **normative constraint on rationality**, not an empirical observation. If I can't justify that constraint, the project fails."*
  *   **Why:** This disarms the "You're just doing EDT" attack before they launch it. It forces them to engage with the *justification of the prior*, which is your actual thesis, rather than the mechanics of the correlation.

  **2. The "Prayer" Question**
  Pray nobody asks: **"If your prior is a normative constraint, why isn't it universal? If I meet a Nash-equilibrium player who doesn't share your prior, do you defect? If you defect, your prior wasn't normative. If you cooperate, you get exploited. How does your prior survive evolutionary pressure?"**
  *   **Why:** This hits the stability of the view. If the prior is rational, everyone should have it. If not everyone has it, it's not rational. If you cooperate with Nashers, you lose. If you defect, you're just playing Nash.
  *   **Prep if asked:** "The prior is conditional on common knowledge of rationality. If I know the other is a Nasher, the symmetry breaks, and the prior updates to defect. The 'rationality constraint' only applies among those who recognize it." (This is weak, but it's the only shield you have).

  **3. The Kill Shot**
  If you lose **Objection 1 (The Lead Economist)**, the view dies. If you cannot explain *why* the prior exists without saying "because it's rational to cooperate," you are begging the question.
  *   **Backup Plan:** If they press this hard, pivot to **Objection 6 (Team Reasoner)**. Argue that even if the prior is mysterious, it yields the same result as Team Reasoning, which has independent support. "Even if you reject my derivation, the output matches the 'We-Mode' solution, which suggests the math is tracking something real about agency."

  **4. Agent-Foundations Ban**
  Do not mention Functional Decision Theory (FDT), Agent-Simulates-Translator, or MIRI. If you mention "logical causation," the CDTers will eat you alive. Stick to "common cause" and "symmetry constraints." Keep the vocabulary classical (Harsanyi, Rawls, Aumann) rather than computational (source code, output equivalence).

  **5. Room Dynamics**
  The Economists will talk to each other. The CDTers will talk to you. The Team Reasoner will wait to see if you survive the Economists.
  *   **Tactic:** When answering an Economist, look at the Team Reasoner. When answering a CDTer, look at the Logician. This subtly allies you with the "structure" people against the "empiricist" people.

  Good luck. The thesis is solid, but the "Shared Prior" is a lightning rod. Own the normativity or lose the room.
