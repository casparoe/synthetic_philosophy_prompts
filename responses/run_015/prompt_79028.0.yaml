      *   *Objection 5 (Bounded Rat - The "Introspection" Critique).* Do I know my algorithm well enough?
      *   *Objection 6 (Economist 2 - The "Nash Refinement" Critique).* Why isn't this just selecting a specific Nash Equilibrium?
      *   *Objection 7 (CDT 2 - The "Intervention" Critique).* If I intervene on my choice, does the other change? No. So why cooperate?
      *   *Objection 8 (General - The "Circularity" Critique).* The prior assumes rationality, but you're defining rationality by the prior.

