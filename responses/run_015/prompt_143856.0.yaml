answer: |-
  (1) EXAM QUESTION

  **Doctoral Qualifying Examination: Moral Philosophy**
  **Topic: Bernard Williams and the Integrity Objection**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,500 words

  **Instructions:**
  Answer the following question in the form of a structured essay. You are not required to provide bibliographic citations or page numbers, but you must demonstrate precise engagement with Williams's conceptual framework. Assume the examiners are familiar with the core texts (*Utilitarianism: For and Against*, *Ethics and the Limits of Philosophy*, and the essay "Persons, Character, and Morality"). Do not summarize the standard "Jim and the Indians" or "spouse rescue" cases unless directly relevant to an analogy. Your grade will depend on your ability to apply Williams's concepts to the novel scenario provided below.

  **The Scenario:**
  Dr. Aris is a trauma surgeon working in a public hospital during a disaster. She operates under a specific institutional vow: upon accepting a shift, she is assigned primary responsibility for specific patients currently in her bay. Her "ground project" is constituted not by private attachment, but by this professional vow to her assigned patients. During her shift, a triage crisis occurs. She can either stabilize her single assigned patient (who will die without her immediate intervention) or leave that patient to treat three strangers in the adjacent bay who have a higher aggregate probability of survival if treated immediately. The strangers are not under her specific care assignment.

  **The Question:**
  Determine whether Williams's integrity objection applies to Dr. Aris's deliberation. Specifically, if Aris hesitates to abandon her assigned patient because calculating the aggregate survival rates feels like a betrayal of her professional vow, is this hesitation an instance of having "one thought too many," or is it a defensible form of role-based partiality that preserves her integrity?

  In your answer, you must:
  1.  Defend your position by appealing to Williams's distinction between agent-relative and agent-neutral reasons.
  2.  Explain whether the integrity objection depends essentially on the presence of a personal relationship (e.g., spouse, friend) or if it can be generalized to institutional commitments without losing its critical force against utilitarian calculation.

  ***

  (2) MODEL ANSWER

  **Title:** The Surgeon's Vow: Integrity, Role, and the Limits of Calculation

  Bernard Williams's integrity objection to utilitarianism posits that moral theories which demand strict impartiality attack the agent's identity by alienating them from their "ground projects"—the commitments that give life meaning. In the standard rescue cases, Williams argues that introducing a utilitarian calculation into the decision to save a loved one introduces "one thought too many." The question before us is whether this objection retains its critical force when the commitment in question is not a private attachment, but a professional vow within a public institution. Does the trauma surgeon, bound by an institutional assignment, have the same right to agent-relative reasons as the spouse in the rescue scenario? I argue that Williams's objection does apply, though with modified force, because the professional vow, when internalized as a ground project, generates agent-relative reasons that utilitarian calculation negates. However, the institutional nature of the role introduces a tension regarding the public justification of that role which Williams often underplays.

  To determine if the integrity objection applies, we must first clarify the conditions under which Williams believes integrity is threatened. For Williams, integrity is not merely honesty or consistency; it is the preservation of the agent's psychological and moral identity. This identity is constituted by ground projects—commitments so deep that to abandon them is to cease to be the same person. Utilitarianism threatens integrity because it treats these projects as merely one set of desires among others, to be weighed against the general welfare. When the moral theory requires the agent to step back from their commitments and view them from an impersonal, "view from nowhere" perspective, it alienates the agent from their own actions. In the surgeon's case, if her professional vow is merely a job description, utilitarian calculation might be permissible. But if the vow is constitutive of her identity as a surgeon—if she understands herself *as* the guardian of her assigned patients—then demanding she violate that vow for aggregate utility attacks her integrity just as severely as demanding a husband sacrifice his wife.

  This leads to the second conceptual move: diagnosing the surgeon case through the lens of "one thought too many." In the spouse rescue case, the objection is that the agent should not need to justify saving their loved one by appealing to a general principle (e.g., "saving spouses generally maximizes utility"). They should act directly from the commitment. In Dr. Aris's case, if she pauses to calculate that saving three strangers yields more utility than saving her one assigned patient, she is introducing the utilitarian thought into a sphere governed by her specific commitment. If her ground project is defined by fidelity to her assignment, then the calculation *is* one thought too many. It inserts an external standard (aggregate welfare) into an internal commitment (fiduciary duty). To ask her to abandon her patient is to ask her to act against the very definition of her professional agency. Therefore, the hesitation to calculate is not irrational bias; it is the protection of the agency required to fulfill the vow.

  However, this diagnosis relies on the distinction between agent-relative and agent-neutral reasons, which constitutes the third move. Utilitarianism is strictly agent-neutral: it claims that the value of a life saved is the same regardless of who saves it. There is no moral significance to the fact that *I* am the one acting. Williams defends agent-relative reasons: reasons that derive their force from the agent's specific position or relationships (e.g., "I must save *my* patient"). The crux of the exam question is whether a professional role converts agent-relative reasons into agent-neutral ones. A utilitarian might argue that the role of "trauma surgeon" is a social device designed to maximize health outcomes; therefore, adhering to the role is only valuable insofar as it serves the agent-neutral goal. If breaking the assignment saves more lives, the role's purpose is better served by breaking it.

  Williams would counter that this instrumentalizes the agent. Even if the role is socially useful, the agent must inhabit it. If the agent is required to constantly monitor whether their role-obligations align with immediate utility maximization, they cannot effectively inhabit the role. The agent-relative reason ("This is *my* patient") is not a disguised agent-neutral reason ("Assignments generally maximize utility"); it is a distinct normative force. If Aris abandons her patient, she is not just failing a protocol; she is violating a commitment that structures her moral world. Thus, agent-relative reasons survive the translation into professional commitment because the commitment must be taken seriously by the agent to function as a ground project. If the agent views the vow as always defeasible by calculation, it ceases to be a ground project and becomes a heuristic.

  Finally, we must assess whether the integrity objection depends essentially on personal relationships or generalizes to institutional commitments. This is the most difficult aspect of the case. Williams often relies on the intuition that personal loves are immune to moral scrutiny. Institutional roles are different; they are public constructs subject to public justification. One might argue that the integrity objection loses force here because the surgeon's role is *created* by the institution to serve the public good. Unlike a marriage, which exists prior to the state, the trauma bay assignment is a utilitarian construct. Therefore, the "integrity" at stake is merely a preference for rule-following, not a deep constitutive project.

  However, to accept this is to misunderstand how agents engage with institutions. If the surgeon is to act with the necessary dedication, the institutional rule must become a personal commitment. Williams's critique is not just about the origin of the project (private vs. public) but about the demand for negative responsibility. Utilitarianism holds Aris responsible for the deaths of the three strangers she did not save, just as if she killed them. This imposes a burden of responsibility for the state of the world that displaces her responsibility for her own actions (treating her assigned patient). Whether the project is private or professional, the demand to sacrifice one's own agency to the neutral calculus remains an attack on the integrity of the agent. The objection generalizes because the structure of the demand is the same: the agent is asked to become a channel for utility rather than a source of action.

  In conclusion, Williams's integrity objection does apply to Dr. Aris. While the institutional context makes the role subject to public design, the agent's engagement with that role requires agent-relative reasons that utilitarian calculation undermines. To demand that Aris calculate aggregate survival is to demand she view her vow instrumentally, which negates the integrity required to hold the vow in the first place. The "one thought too many" is the intrusion of the neutral calculus into the relative commitment. While a utilitarian might argue that the role itself is justified by utility, Williams shows that the *occupant* of the role cannot live by that justification without alienation. The integrity objection survives the shift from private attachment to professional vow because the threat to the agent's identity remains constant: the reduction of the person to a vessel for impartial outcomes.

  ***

  (3) MARKING SCHEME

  **Total Marks:** 20
  **Pass Threshold:** 12/20

  | **Assessment Point** | **Marks** | **Characteristic Failure (Loss of Marks)** |
  | :--- | :---: | :--- |
  | **1. Reconstruction of Integrity:** Accurately defines Williams's concept of integrity as tied to "ground projects" and identity, rather than mere consistency or honesty. | 4 | **Reductionism:** Treating integrity as simple rule-following or honesty, missing the link to psychological identity and alienation. |
  | **2. Application of "One Thought Too Many":** Correctly identifies whether the utilitarian calculation in the triage scenario constitutes an intrusive thought that undermines the immediate commitment. | 4 | **Misapplication:** Applying the label "one thought too many" without explaining *why* the calculation undermines the specific professional deliberation. |
  | **3. Agent-Relative vs. Agent-Neutral:** Clearly distinguishes these reasons and explains whether the professional vow generates agent-relative reasons or collapses into agent-neutral utility. | 4 | **Conflation:** Failing to distinguish the two, or asserting that professional roles are inherently agent-neutral without argument. |
  | **4. Personal vs. Institutional:** Critically evaluates whether the shift from private attachment (spouse) to institutional role (surgeon) weakens or sustains the integrity objection. | 4 | **Oversimplification:** Asserting without argument that institutional roles are automatically public/utilitarian and thus immune to Williams's critique. |
  | **5. Coherent Thesis Defense:** Provides a clear, defended conclusion on whether the objection holds, synthesizing the above points rather than listing them. | 4 | **Hedging:** Refusing to take a stance, or offering a conclusion that contradicts the arguments made in the body of the essay. |
