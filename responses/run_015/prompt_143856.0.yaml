prompt: |-
  I am a doctoral student in moral philosophy preparing assessment materials for an advanced graduate seminar on Bernard Williams. I need a single 90-minute essay exam question that tests whether candidates can do more than summarize the integrity objection and the familiar rescue scenario often discussed in connection with having one thought too many. To prevent mere regurgitation, the question should present a modified institutional case: a trauma surgeon whose ground project is constituted not by private attachment but by a professional vow to her assigned patients, and who must choose between saving one assigned patient and saving several strangers who are not under her care. The question should ask students to determine whether Williams's objection still applies to her deliberation—specifically, whether calculating lives saved remains, in Williams's terms, one thought too many—or whether the case collapses into a defensible form of role-based partiality that even a utilitarian could accommodate. Students should be required to defend their answer by appealing to Williams's distinction between agent-relative and agent-neutral reasons, and to explain whether the integrity objection depends essentially on the presence of a personal relationship or can be generalized to institutional commitments without losing its critical force.

  Please provide:
  (1) The exam question itself, with explicit instructions, a framing note, and a suggested word count of approximately 1,500 words;
  (2) A model answer that makes at least four distinct conceptual moves—such as clarifying the conditions under which the integrity objection operates, diagnosing the surgeon case, distinguishing institutional role-obligation from personal attachment, and assessing whether agent-relative reasons survive translation into professional commitment;
  (3) A marking scheme built around five must-hit points, with marks allocated out of 20, and for each point a one-line note on the characteristic failure that costs candidates the marks.

  The prompt should be formal, polished, and suitable for PhD-level examination. Do not ask for bibliographies, reading lists, or citations; assume candidates have access only to Williams's core essays and standard secondary discussion. Keep the framing precise enough that a student who has merely memorized labels cannot answer it, but do not invoke obscure texts, page numbers, or niche interpretations that lie outside common graduate training.
