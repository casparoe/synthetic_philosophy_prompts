answer: |-
  ### Pre-Drafting Memorandum: Points of Convergence and Divergence

  **To:** Collaborative Research Group on Persistence
  **From:** [Redacted]
  **Subject:** Mapping the Dispute Landscape (Institutional Application)

  Before we commit to the joint statement, we need to clear the underbrush. Too often, the Endurantist/Perdurantist debate stalls because we disagree on what counts as a 'datum'. In the context of institutional persistence (e.g., The Ministry of Defence, 1947–2024), here is where we actually stand:

  **1. Where we genuinely agree (Formal Constraints):**
  *   **Trans-temporal Reference:** We can both make sense of the sentence "The Ministry authorised the budget in 1980." We disagree on the truth-conditions, but not on the meaningfulness.
  *   **Causal Continuity:** Neither of us thinks the institution at $t_2$ pops into existence ex nihilo. There must be a causal chain linking the 1980 Ministry to the 2024 Ministry, whether that chain holds together a substance or a series of stages.
  *   **Rejection of Static Identity:** We both reject the Parmenidean view that the institution is immutable. It changes properties (staff, location, charter). The debate is *how* it bears these properties, not *if*.
  *   **Vagueness:** We both acknowledge that there are borderline cases where it is indeterminate whether the institution survives (e.g., a merger where 90% of the charter is rewritten). We disagree on whether this vagueness is ontological or semantic.

  **2. Where we talk past each other:**
  *   **"Wholly Present":** The Endurantist uses this to mean "no temporal parts." The Perdurantist hears "located at a point in time like a spatial point" and objects that nothing is point-like. We need to agree that "wholly present" means "the entire ontological constituent of the object is available at $t$," not that it lacks duration.
  *   **"Change":** The Endurantist says the *object* changes. The Perdurantist says the *worm* varies in quality across its extension. This is often a verbal dispute about the verb 'to change', but it has cash value when assigning moral responsibility (see Crux 1 below).
  *   **The "Stage" vs. "Worm":** Within perdurantism, there is a split between Worm Theory and Stage Theory. For this collaboration, the Perdurantist signatory will adopt the Worm Theory view as it aligns better with institutional continuity, avoiding the complication of modal counterparts for now.

  ***

  ### JOINT STATEMENT ON INSTITUTIONAL PERSISTENCE
  **Project:** Adversarial Collaboration on Metaphysical Continuity
  **Subject:** The Ontology of Administrative Bodies (e.g., University Departments, Government Ministries)
  **Signatories:** [Endurantist Representative] & [Perdurantist Representative]

  #### Preamble
  We, the undersigned, acknowledge that the persistence of complex social institutions presents a rigorous testing ground for theories of diachronic identity. Unlike material artefacts (e.g., ships), institutions possess constitutive rules, legal charters, and functional roles that may shift independently of their physical assets or personnel. We agree to frame our disagreement not as a dispute over the *fact* of continuity, but over the *ontological ground* of that continuity.

  #### I. Agreed Claims (The Phenomena to be Saved)
  Both parties commit to the following propositions as non-negotiable constraints on any viable theory of institutional persistence:

  1.  **Numerical Identity amidst Qualitative Change:** It is true that the *same* institution can possess incompatible properties at different times (e.g., "The Department has a Head" in 1990; "The Department has no Head" in 1995) without ceasing to exist.
  2.  **Causal-Functional Grounding:** The identity of the institution is not brute; it supervenes upon a causal history of administrative acts, record-keeping, and succession procedures. A perfect duplicate appearing spontaneously would not be the *same* institution.
  3.  **Trans-temporal Responsibility:** Statements attributing liability or credit to the institution (e.g., "The Ministry owes reparations") are truth-apt. The ontology must support the transfer of obligation across time despite total turnover of human agents.
  4.  **No-Go on Static Immutability:** Any theory implying the institution is a timeless substance that does not genuinely acquire new properties is rejected. The institution is in time.
  5.  **No-Go on Discontinuous Atomism:** Any theory implying that the institution at $t_1$ and the institution at $t_2$ are entirely distinct entities with no ontological glue (mere Humean succession) is rejected, as it fails to account for Claim 3 (Responsibility).

  #### II. Table of Disagreements (Charitable Formulations)
  We disagree on the categorisation of the institution. We accept the following wording as accurate representations of our respective positions, avoiding straw-manning.

  | Feature of Dispute | Endurantist Formulation (3D) | Perdurantist Formulation (4D) |
  | :--- | :--- | :--- |
  | **Ontological Status** | The institution is a **continuant**. It is wholly present at every moment of its existence. | The institution is a **processual worm**. It is extended in time and only temporal parts are present at moments. |
  | **Nature of Change** | **Strict Change:** The institution itself gains and loses properties. It is $F$ at $t_1$ and not-$F$ at $t_2$. | **Qualitative Variation:** Different temporal parts of the institution instantiate different properties. The worm does not change; it varies. |
  | **Relation to Time** | The institution exists **in** time (as a container). It endures through the passage of time. | The institution exists **as** time (as a dimension). It is a spacetime region occupied by institutional stuff. |
  | **Turnover of Staff** | Staff are contingent properties or external relations. The substance remains while relations change. | Staff are constituent parts of the temporal stages. As staff change, the constituent parts of the stages differ. |
  | **Charter Amendment** | The institution survives the amendment by undergoing a change in its essential/accidental profile. | The institution survives if the amendment preserves the appropriate gen-identity relation between stages. |

  #### III. Cruxes: Sub-Questions for Adversarial Testing
  To move beyond verbal dispute, we identify three specific sub-questions. Settlement of these would force one side to revise their theoretical overhead.

  **Crux 1: The Locus of Moral Liability**
  *   **The Question:** When a historical injustice is discovered (e.g., unethical research conducted by the Department in 1970), *what exactly* bears the burden of reparations in 2024?
  *   **Endurantist Prediction:** The *very same object* that committed the act exists now. Liability is intrinsic to the persisting substance.
      *   *Evidence that would falsify this:* If it is demonstrated that legal/moral practice only makes sense if we treat the 1970 entity and 2024 entity as distinct but linked successors (like a baton pass), rather than identical.
  *   **Perdurantist Prediction:** The 2024 temporal part is liable only in virtue of being part of the same worm as the 1970 part. Liability is a relation across stages.
      *   *Evidence that would falsify this:* If it is shown that we intuitively punish the *current* whole entity in a way that cannot be reduced to stage-relations (e.g., if we feel the *whole* history is present in the current moment).

  **Crux 2: The Sorites of Charter Drift**
  *   **The Question:** A Ministry undergoes 1,000 minor charter amendments over a century. At which step does it cease to be the same Ministry?
  *   **Endurantist Prediction:** There is a fact of the matter (even if epistemically inaccessible) regarding when the essence of the Ministry is violated. Identity is all-or-nothing.
      *   *Evidence that would falsify this:* If legal precedent shows that courts routinely accept "partial identity" or degrees of survival in merger cases, suggesting identity is not a binary relation.
  *   **Perdurantist Prediction:** The question is misguided; there is a continuum of similarity between stages. "Survival" is a vague convention imposed on a smooth spacetime worm.
      *   *Evidence that would falsify this:* If we find hard constraints in institutional law where continuity is strictly binary (e.g., a specific clause that, if broken, instantly dissolves the entity regardless of causal continuity), suggesting a substantive essence exists.

  **Crux 3: Truthmakers for Past-Tense Statements**
  *   **The Question:** What makes the proposition "The Department existed in 1950" true today?
  *   **Endurantist Prediction:** The existing Department *itself* (wholly present now) bears the property of *having-existed-in-1950*. The past is held in the present substance.
      *   *Evidence that would falsify this:* If analysis shows that current records/archives (external to the substance) are the sole truthmakers, implying the Department itself does not carry its past within it.
  *   **Perdurantist Prediction:** The 1950 temporal part exists (tenselessly) as part of the four-dimensional worm. The truthmaker is the earlier segment of the worm.
      *   *Evidence that would falsify this:* If it is proven that the past segment is ontologically 'gone' (presentism is true), forcing the Perdurantist to explain how non-existent parts ground current truths.

  #### IV. Commitment to Outcome
  We agree that if Crux 1 demonstrates that liability cannot be transferred via gen-identity alone, the Perdurantist must concede significant ground regarding the unity of the object. Conversely, if Crux 3 demonstrates that truthmakers for the past cannot be existing temporal parts (due to Presentist constraints), the Endurantist must provide a robust account of how a present substance contains past properties without invoking mysterious haecceities.

  **Signed,**

  *Dr. E. Substance* (Endurantist Lead)
  *Dr. P. Extension* (Perdurantist Lead)
  *Date: 24 October 2023*
