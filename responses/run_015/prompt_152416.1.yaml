  Then write up a joint statement for an adverserial collaberation between a committed endurantist and a committed perdurantist. I want it to avoid the usual Ship of Theseus rehash — instead inject this niche framing: apply the debate to institutional continuity, e.g. how a university department or government ministry survives total staff turnover plus gradual charter changes. Both sides should sign agreed claims (number them) about what needs explaining, the formal conditions, and what no-go results about static identity actually rule out. Then a disagreements table with wording each side accepts for its own view. Then the cruxes: sub-questions that'd actually move one side if settled, with each camp's prediction in advance and what'd count as evidence for both. Please use British English throughout (defence, not defense, etc.). Think carefully, step by step. No bibliographies or citation lists — I'm working offline. And don't bring in ultra-obscure theories I won't know; keep the core machinery but push it into this institutional angle so it's not just pretraining regurgitation.
