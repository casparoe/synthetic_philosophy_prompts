answer: |-
  In the chronic pain unit, three patients sit side-by-side awaiting the same nociceptive stimulus, each reacting to the needle prick with identical muscle tension and vocalization. Patient A winces and whispers "it hurts," genuinely suffering the sharp sting and the accompanying dread. Patient B, a physical duplicate, winces and whispers "it hurts" with identical neural firing, but there is literally nothing it is like to be them—no light, no sting, no void, just mechanism. Patient C also winces and whispers "it hurts" with matching fMRI patterns in the anterior cingulate, yet while they clearly feel the sharp, localized sensory quality of the needle—the cold metallic pressure and the bright red warning light's visual qualia—the motivational punch is missing; there is no suffering, no aversion, no relief sought, though their cognitive reporting systems compel them to act exactly as if there were.

  **Analysis**

  **A-vs-B (The Standard Zombie):**
  The conceivability argument here follows Chalmers's classic line. We hold all physical facts constant (neural firing, behavior, environment) while varying the phenomenal facts (presence vs. absence of experience). Because we can form a coherent mental image of B without contradiction, phenomenal consciousness does not logically supervene on the physical. This pumps the intuition that physicalism is false or incomplete because there is an "explanatory gap" between third-person mechanisms and first-person presence. The intuition is strong because the absence is total; B is a hollow shell, and the contrast with A is starkly ontological.

  **A-vs-C (The Affective Zombie):**
  Here the intuition shifts. Because C retains sensory qualia (the sharpness, the redness), the "inner light" is not extinguished, only dimmed in a specific channel. We can conceive of C without feeling we've imagined a metaphysical impossibility because sensory consciousness feels representational (tracking the needle), whereas affective consciousness feels inherently motivational (wanting the needle gone). Since C's functional output (reports, fMRI) remains identical to A's, the missing affect looks like a decoupling of feeling from function rather than a vanishing of mind itself. The intuition collapses because the presence of sensory qualia anchors C in the realm of the phenomenal; the deficit feels like a specific functional disconnection (like a wire cut between pain and distress) rather than an ontological void. The feature doing the work is that affective consciousness is conceptually tied to functional role (aversion, motivation) in a way sensory consciousness is not; we can imagine sensing without caring, but we struggle to imagine sensing without *anything* being sensed.

  **The Physicalist Attack:**
  A physicalist argues that our ability to conceive of C is merely an epistemic limitation, not proof of an ontological gap. If C's fMRI patterns in pain-processing regions (like the anterior cingulate and insula) are indistinguishable from A's, then the physical state constituting "suffering" is present. To claim C lacks suffering despite identical neural correlates is to stipulate a difference without a physical maker. The physicalist asserts that affect *is* the functional role played by those neural states; if the role is played (evidenced by reports and scans), the affect exists. Our intuition that C is conceivable relies on ignorance of how brain states integrate sensory and affective data into a unified experience.

  **Dropping the fMRI Constraint:**
  If we drop the requirement that C's fMRI patterns match A's, the thought experiment ceases to be a zombie argument and becomes a clinical dissociation case. If C lacks affective activation in the brain while retaining sensory activation, C is no longer a physical duplicate of A. Consequently, the metaphysical leverage is lost: physicalism is not threatened because the phenomenal difference (no suffering) now maps onto a physical difference (different brain activation). The case collapses into an empirical claim about modularity (e.g., pain asymbolia) rather than a proof that consciousness escapes physical description. The zombie argument requires physical identity to force the ontological wedge; without it, you simply have two different physical systems producing different experiences.
