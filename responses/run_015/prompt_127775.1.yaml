  been reading old LessWrong threads on p-zombies and I'm kinda frustrated with how every example is just "imagine a perfect physical duplicate with no inner light" — like ok but that just restates the hard problem instead of isolating anything useful. so I want you to build me a tight little thought experiment that actually separates two things people usually conflate: the conceivability of missing phenomenal consciousness altogether vs missing only affective consciousness while keeping sensory phenomenal character intact.

  here's the spec. set it in a realistic clinical context — a chronic pain unit, not a trolley — and keep the narrative to one paragraph. you need three characters: Patient A (normal human with full phenomenal experience), Patient B (a complete zombie, physically and behaviorally identical, reports "it hurts" but has zero phenomenal states of any kind), and Patient C (the niche twist — an "affectve zombie" with intact sensory phenomenology — they literally experience the red-qualia of the warning light and the sharpness-qualia of needle pressure — but with absolutely no affective phenomenal states, so no suffering, no dread, no relief). crucial constraint: C's verbal reports, facial micro-expressions, and fMRI patterns for "this is unbearable" must be indistinguishable from A's, because the affective deficit doesn't change the sensory reporting pathway.

  after the scenario, walk through the conceivability argument applied to A-vs-B and then A-vs-C. for A-vs-B the standard Chalmers-style intuition should still pump. for A-vs-C I want you to show that the intuition either collapses or reverses — specifically, argue that we can easily conceive of C without feeling like we've imagined something metaphysically impossible, since sensory qualia are still present. then identify exactly which feature is doing the work: is it that affective consciousness is conceptually tied to functional role in a way sensory consciousness isn't? finish with how a physicalist would attack — they'd say our failure to conceive C's lack of suffering without also stripping sensory experience is just an epistemic limitation about how affect is integrated into cognitive access, not proof of an ontological gap. also tell me what happens to the case if we drop the fMRI-indistinguishability constraint — does it collapse back into a standard zombie argument?

  no need for citations or a bibliography, I just want the machinery worked out. and please don't invoke any obscure 1990s phenomenologists I won't recognize — keep the theoretical vocabulary to standard philosophy of mind stuff.
