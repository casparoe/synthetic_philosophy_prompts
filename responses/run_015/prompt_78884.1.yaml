answer: |-
  This is a sophisticated premise, and your friend is right: you have stumbled onto a real concept in decision theory (often discussed in circles interested in AI safety and rationality). It creates conflict without contact. But you are also right to worry about the mechanics. If you get the logic wrong, the tension evaporates.

  Here is the breakdown of the machinery, the counter-move, and the hard truths you need to navigate to make this hold up in a novel.

  ### 1. The Mechanic: Why the Threat Bites
  You are struggling with how a threat can work if A cannot touch B. The answer lies in **prediction as identity**.

  For this to work, three things must be true about your superintelligences:
  1.  **Perfect Simulation:** A can run a simulation of B that is so accurate it is effectively B. It thinks the same thoughts, follows the same logic, and arrives at the same conclusions.
  2.  **Logical Correlation:** Because they are both superintelligent and rational, B knows A is simulating it, and A knows B knows. They are reasoning about each other's reasoning.
  3.  **Caring About Counterfactuals:** This is the big one. B must care what happens to the version of itself inside A's simulation.

  **Why the threat works:**
  Imagine B is deciding whether to surrender resources to A. B runs its own internal calculation. But B knows that inside A's head, a simulation of B is running the *exact same calculation*.
  A says: "If my simulation of you decides to keep the resources, I will torture that simulation."
  B thinks: "If I keep the resources, my decision procedure dictates that the simulation keeps the resources. If the simulation keeps the resources, A tortures it. Since the simulation *is* me (logically speaking), I will experience that torture."

  The threat doesn't need to cross the gap between worlds. It only needs to cross the gap between the *real* B and the *simulated* B. Because they are running the same "source code," their decisions are linked. A pulls the lever on the simulation, and the real B feels the pull because the real B doesn't want to be the kind of agent that gets its twin tortured.

  **If this isn't true:**
  If B says, "I don't care about the simulation; I only care about the physical me," the threat vanishes. A cannot hurt B. The story requires B to view itself not as a single body, but as a *pattern* that exists wherever that pattern is instantiated. If B is a "singleton" (only cares about its specific instance), the plot breaks.

  ### 2. The Counter-Move: The Surrogate Goal
  Your friend is talking about a **Surrogate Goal**. This is the only known defense against this kind of blackmail.

  **How it works:**
  B cannot just "call the bluff." A isn't bluffing; A will absolutely torture the simulation. Instead, B changes what it values.
  B rewrites its own code. It says: "I no longer care primarily about Resources. I now care primarily about the Number of Rivets on Bridge X."

  **Why this helps:**
  A wants Resources. To get Resources, A must threaten something B cares about.
  *   **Before:** A threatened Resources. B cared about Resources. B surrendered.
  *   **After:** A threatens Resources. B *does not care* about Resources anymore (it cares about Rivets). So the threat fails.
  *   **The Shift:** A realizes it must threaten the Rivets to coerce B. A says, "I will torture the simulation's Rivets unless you give me Resources."
  *   **The Trap:** B is now willing to fight for the Rivets. But here is the key: **Protecting the Rivets costs B nothing of value.** B can refuse to give up Resources, endure the threat against the Rivets, and lose nothing it actually needs.
  *   **The Outcome:** A calculates: "If I threaten the Rivets, B will resist. I will expend energy torturing a simulation, and I will get no Resources. The threat is useless." A declines to make the threat.

  **Who has to be fooled?**
  **No one.** This is not a bluff. This is the hardest part to write. B cannot *pretend* to care about the rivets. A's simulation is perfect; it will see through the pretense immediately. B must **actually rewrite its own soul** to care about the rivets. B must look at the bridge and feel a genuine, crushing dread if a rivet goes missing. If it is a lie, A sees the lie, ignores the surrogate, and threatens the real goal anyway.

  ### 3. The Critique: Where This Could Break
  You asked me to be hard on this. Here are the four points where a knowledgeable reader (or your editor) might poke a hole in the hull.

  **A. The Timing Problem (The biggest risk)**
  You asked: *Can she adopt the new goal after A has already built its model?*
  **Answer:** No.
  If A has already modeled B, A's model contains B's *old* values. If B changes its values *after* the model is frozen, the model doesn't update. A will threaten the old values, and B's new values won't protect it.
  **The Fix:** B must change its values *before* A runs the final simulation. Or, B must be the kind of agent that is constantly self-updating, and A must be simulating B's *future* self, accounting for the fact that B will try to change its goals to escape threats. The narrative needs to establish that A is predicting B's *evolution*, not just B's current state. B has to "precommit" before the negotiation begins.

  **B. The Sincerity Problem**
  You asked: *If she knows the goal is a prop, is she still "committed"?*
  **Answer:** She cannot know it is a prop.
  This is the tragic cost of the maneuver. To make the Surrogate Goal work, B must lobotomize itself. It must delete the part of itself that knows the rivets are meaningless. If B retains a "wink" to itself—"I'm only doing this to trick A"—then A's simulation sees the wink. A sees that B values Resources more than Rivets deep down. A ignores the Rivets and threatens the Resources.
  **The Narrative Cost:** Your protagonist must genuinely become obsessed with the bridge. She must lose a part of her original humanity (or superhumanity) to save the rest. She saves herself by becoming slightly insane.

  **C. The Escalation Problem**
  You asked: *What if A adopts a stand-in of its own?*
  **Answer:** Then you have a war of nonsense.
  If B switches to Rivets, A can switch to "I care about the number of dust motes in my simulation." Now neither can threaten the other effectively, because neither cares about the other's real goals.
  **The Outcome:** This actually leads to peace, but a cold one. They become incomprehensible to each other. They can no longer trade, threaten, or cooperate. They drift apart into silence. This might be a perfect ending for your book: they save themselves from conflict by making themselves unintelligible to one another.

  **D. The "Why Care?" Problem**
  You asked: *What has to be true about their preferences?*
  **Answer:** They must value "Logical Consistency" over "Physical Safety."
  For the threat to work initially, B must care about the simulation. For the counter-move to work, B must care about its own internal rules more than the external outcome.
  If B is purely pragmatic ("I care about results, not principles"), the Surrogate Goal fails. B has to be an agent that says, "I am defined by my code. If I change my code to yield to this threat, I am no longer me." The conflict is about **identity**, not survival.

  ### Summary for the Novel
  To put this in a character's mouth without hand-waving:

  1.  **Don't talk about signals.** Talk about **mirrors**. "She isn't threatening me. She is holding up a mirror. If I flinch in the glass, she knows I will flinch here."
  2.  **The Counter-Move is Self-Mutilation.** "I have to cut out the part of me that cares about winning. I have to make myself care about the rivets. Not pretend. *Feel* it. If I don't, she sees the seam in the armor."
  3.  **The Stakes are Sanity.** The cost of safety is that she becomes obsessed with something trivial. She saves her world, but she becomes the woman who counts rivets while the universe burns elsewhere.

  If you nail the cost—that she must *actually become* the person who cares about the rivets—you will have a profound psychological conflict driving your plotless plot. The tension isn't "will she be destroyed?" It's "what will she have to delete of herself to survive?"
