  2.  **Deconstruct the Chair's Analogy ("Forgery is a Lie"):**
      *   *Core Argument:* A lie is inherently defective. Correcting the record doesn't fix the lie. Therefore, a forgery is inherently defective. Correcting the label doesn't fix the object. Therefore, withdraw the object.
      *   *Implicit Premise:* The moral/ontological status of the object is fixed by its origin/intent, similar to a speech act.

  3.  **Drafting the Correspondence Table:**
