  *(Self-Correction Note on the "Lie" Analogy)*: The Chair argues the defect is in the *thing*. A lie is usually in the *statement*. A forged painting is a physical object that *embodies* a false statement. This is a crucial distinction. The object *is* the utterance. I need to make sure the table reflects this materiality.

  *(Refining Case 3)*: Attribution isn't binary true/false in the same way a proposition is. It's epistemic. A lie is epistemic too, but morally charged. I need to highlight the *epistemic volatility* of art history vs. the *fixed falsity* of a lie.

  *(Refining Candidate Analogies)*: "Perjury" is strong because it involves an institution under oath. "Plagiarism" is strong because it involves credit. But maybe "Counterfeit Currency" is the hidden analogy? No, stick to the user's suggestions first, then evaluate. Actually, "Contaminated Evidence" might be better. I will evaluate Perjury and Plagiarism as requested, then offer a refinement.

