      *   *Moment of Utterance:* Speaking -> *Creation/Sale:* 17th C or 1971 purchase.
      *   *Discovery:* Realization of falsehood -> *Technical Exam:* 3 years ago.
      *   *Retraction:* "I lied" -> *Relabeling:* "Imitator of".

  4.  **Analyzing Mismatches (Signal vs. Noise):**
      *   *Signal (Matters for Conclusion):* Intent to deceive (moral taint), the idea that the defect is intrinsic to the act/object rather than the belief.
      *   *Noise (Doesn't matter):* The medium (sound vs. paint), the specific timing of the "utterance" (creation vs. cataloging).
      *   *Critical Mismatch:* A lie is an *event* (speech act). A painting is an *object* persisting through time. A lie ceases to exist once spoken; a painting remains. A retraction changes the *status* of the information, but does it change the *status* of the object?

  5.  **Testing the Three Cases:**
      *   *Case 1 (Studio Product upgraded in 1890):* The object didn't change. The *label* changed. If it's a lie, who lied? The 1890 dealer. Why is the *paint* contaminated by the *dealer's* lie? This exposes the confusion between the object's ontology and its provenance history.
      *   *Case 2 (Knowing Collector):* No deception. No lie. Is the object defective? If the Chair says "yes," the "lie" analogy fails (no lie occurred). If "no," then the defect is relational (deception), not intrinsic.
      *   *Case 3 (Oscillating Attribution):* Lies don't become true later. Attributions do. This suggests attribution is a hypothesis, not a truth-claim in the binary sense of a lie. The analogy breaks on reversibility.

  6.  **Directions of Distortion (Import/Export):**
      *   *Imports:* Moral agency (paintings don't have intent), binary truth value (attribution is probabilistic), finality of the act (a lie is done; a museum display is ongoing).
      *   *Exports:* The institutional context (museums generate knowledge, not just display truths), the physical continuity of the object.
      *   *Separating the Three Questions:*
          1.  *Aesthetic:* Is it good art? (Irrelevant to the lie analogy).
          2.  *Moral:* Is it tainted by fraud? (The core of the Chair's argument).
          3.  *Institutional:* What is our duty? (Education vs. Purity).

