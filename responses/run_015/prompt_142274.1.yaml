answer: |-
  ### Audience Commitments (One Line Each)

  *   **Senior Phil Mind (Dennettian):** Intentionality is fully naturalizable; there is no metaphysical remainder of "comprehension" left over after competence is explained.
  *   **Philosopher of Biology:** Selection is an explanatory principle imbued with immanent normativity (fitness), not merely a blind mechanical filter.
  *   **Rationalist Linguist:** Genuine competence requires internal generative rules, not merely external behavioral optimization or fit.
  *   **Young Enactivist:** Cognition is embodied coupling with the environment; framing comprehension as an inner state is a Cartesian error.
  *   **ML Researchers (x2):** Algorithmic structures must be defined by their mathematical properties (optimization), not loose biological metaphors (selection).

  ---

  ### Prep Sheet: Objections, Replies, and Vulnerabilities

  **1. The Self-Undermining Leak (Dennettian)**
  *   **Objection:** "You claim Turing's inversion creates a reflexivity leak because it undermines the reasoner's grounds. But you are a biological organism whose cognitive capacities are products of Darwinian selection. If Darwin's inversion removes comprehension from the causal history of *you*, why are *your* grounds for accepting this argument exempt from the leak? You seem to posit a magical exemption for the philosopher."
  *   **Reply:** "The exemption isn't for the *person*, but for the *explanatory context*. Darwinian theory explains the causal history of the capacity; it does not replace the justification for the theory itself. When I offer this argument, I am operating in the space of reasons, not the space of causes. The leak occurs only when the explanation claims to exhaust the space of reasons, as Turing's formalism does when applied to meaning."
  *   **Soft Spot:** This relies on a sharp causes/reasons distinction that naturalists (like Dennett) reject. If pressed on how a Darwinian brain accesses the 'space of reasons' without leakage, you risk dualism.

  **2. Normativity in Selection (Phil Biology)**
  *   **Objection:** "You argue Darwin leaves normativity to the explainer, whereas Turing removes it. But selection *is* normative; fitness is a measure of 'correct' adaptation. If selection tracks correctness, the reflexivity leak begins in biology, not just in Turing. You've drawn the asymmetry in the wrong place."
  *   **Reply:** "Fitness is normative only relative to an environment, not true/false relative to a proposition. Selection explains why a trait persists, not why a belief is *true*. The Turing inversion claims to explain reasoning itself, including truth-tracking. Darwin explains survival; Turing allegedly explains validity. The leak bites only when the mechanism claims to ground validity."
  *   **Soft Spot:** Evolutionary epistemology argues selection *does* track truth. If you deny this too strongly, you make scientific knowledge look accidental; if you accept it, the leak spreads to Darwin.

  **3. SGD is Not Selection (ML Researchers)**
  *   **Objection:** "Stochastic gradient descent lacks populations, heredity, and reproduction. It is optimization over a loss landscape, not natural selection. Calling it 'Darwinian' is a metaphor that does no technical work. If the mapping fails, your corollary about brute surprise versus compositionality collapses."
  *   **Reply:** "I concede the technical difference in mechanism. I am claiming a structural analogy in the *explanatory role*: both involve blind variation and retention of successful states without internal comprehension of the goal. Whether via genes or gradients, the 'competence without comprehension' dynamic holds, and so does the expectation of brute surprise over guaranteed rules."
  *   **Soft Spot:** You must concede the metaphorical status early. If you insist it is literal selection, you lose credibility with this group immediately.

  **4. The Intellectualist Frame (Enactivist)**
  *   **Objection:** "Your whole argument assumes comprehension is an inner representational state that can be present or absent. If comprehension is embodied interaction, there is no 'leak' because the agent is already coupled with the normativity of the environment. You are solving a problem created by your own intellectualist framing."
  *   **Reply:** "Even if cognition is embodied, the question remains whether the system tracks *truth* or merely *coupling*. Deep learning systems couple successfully but fail systematically on out-of-distribution data. The leak I describe is about the grounds for claiming correctness, not the location of the processing. Embodiment doesn't guarantee normativity."
  *   **Soft Spot:** This risks talking past them. They deny the internal/external split you rely on. You need to pivot to "systematic failure" rather than "internal state."

  **5. Competence vs. Performance (Linguist)**
  *   **Objection:** "You define competence as behavioral success. Chomsky showed competence is the internal generative capacity. Deep learning lacks genuine competence regardless of comprehension. Your distinction between Darwinian and Turingian competence is moot; DL has neither."
  *   **Reply:** "I welcome this support for my conclusion. We agree DL lacks genuine generative competence. My point is that even if it succeeds behaviorally (performance), we shouldn't treat it as Turingian reasoning. Your objection strengthens my claim that we should expect brute surprise rather than linguistic rules."
  *   **Soft Spot:** You are aligning with their conclusion but ignoring their premise (generative grammar). Don't fight the definition; use their skepticism to bolster your corollary.

  **6. Instrumentalism (Dennettian Follow-up)**
  *   **Objection:** "The reflexivity leak is just skepticism. We accept Turing machines because they work reliably, not because we have transcendent grounds. Why does the causal history of the acceptance matter if the output is reliable?"
  *   **Reply:** "Reliability isn't enough for philosophy of mind; we want to know *what* is reasoning. If the process is blind optimization, calling it 'reasoning' is a category error, even if reliable. The leak isn't about doubt; it's about misdescription. We shouldn't call optimization 'thinking'."
  *   **Soft Spot:** Dennett will argue 'thinking' is just what reliable systems do. You are fighting a definitional battle about the word "reasoning."

  **7. Anachronism (Phil Biology Follow-up)**
  *   **Objection:** "You claim Darwin distinguishes causal history from justification. Darwin was a naturalist; he didn't have your Kantian distinction. You are imposing a modern philosophical frame on a 19th-century theory."
  *   **Reply:** "I am not making a historical claim about Darwin's mind, but a structural claim about the theory of natural selection. The theory *functions* to explain history, regardless of whether Darwin articulated the justification distinction. The asymmetry is in the logic of the explanation, not the biography."
  *   **Soft Spot:** Weak. If the distinction wasn't available then, why treat it as essential to the theory's structure? It looks like a reconstruction.

  **8. Compositionality in Transformers (ML Researchers Follow-up)**
  *   **Objection:** "You claim DL offers brute surprise rather than compositionality. But transformers show emergent compositionality. Your prediction is empirically falsified by recent architecture results."
  *   **Reply:** "Emergent compositionality is fragile and data-dependent, not guaranteed by structure as in symbolic logic. It works until it doesn't. My claim is about the *source* of the competence: optimization finds shortcuts, not rules. The surprise remains because the rules aren't there to be understood."
  *   **Soft Spot:** Empirical claim. If they show a paper where generalization is robust, you look outdated. Keep the claim about "guaranteed" vs "fragile."

  ---

  ### Strategic Concessions (First 5 Minutes)

  1.  **Concede the ML Terminology:** Explicitly state that SGD is not biological selection in the strict sense (no heredity/population), but that you are using "Darwinian" to denote the *functional structure* of blind optimization without comprehension. This disarms the ML researchers before they stand up.
  2.  **Concede the Historical Frame:** Acknowledge that Darwin did not explicitly articulate the "causal history vs. justification" distinction. Clarify that you are analyzing the *logical structure* of the theory as we understand it now, not doing history of ideas. This prevents the Phil Bio from spending 5 minutes on anachronism.

  ### The Single Reply That Must Land

  **The reply to Objection 1 (The Self-Undermining Leak/Dennettian).**
  If you cannot maintain that the *explanatory context* (philosophy) remains distinct from the *causal context* (biology) without slipping into dualism, the asymmetry collapses. If the audience believes your argument is just another Darwinian product with no special normative standing, your thesis that "competence without comprehension cannot settle normativity" undermines itself. You must hold the line that naturalizing the cause does not naturalize the justification.

  ### The Covert Ally

  **The Rationalist Linguist.**
  They believe DL lacks genuine competence. You believe DL lacks normative grounding. You agree on the conclusion (DL is not "thinking" in the strong sense), even if you disagree on the definition of competence.
  *   **Strategy:** When they object, rephrase their point: "You are arguing that DL lacks the internal generative structure required for competence; I am arguing it lacks the normative grounding required for reasoning. We both agree it is not a Turingian reasoner. Your evidence supports my claim that we should not expect guaranteed compositionality."

  ### The Question You Hope Nobody Asks

  **"If your cognitive capacities are the product of Darwinian selection, and you admit Darwinian selection removes comprehension from the causal history of capacities, what guarantees that your own philosophical comprehension is not just a useful fitness heuristic rather than a truth-tracking capacity?"**
  *   **Why it's weak:** This is the Plantinga-style Evolutionary Argument Against Naturalism. Your answer relies on the distinction between causal history and justification. But if the brain that performs the justification was selected for fitness, not truth, the distinction looks like a verbal shield.
  *   **Honest Sketch:** "I would have to argue that the practice of philosophy is a cultural evolution that transcends biological fitness constraints."
  *   **Why it's weak:** This admits that biological comprehension *is* leaky, and only saved by... another layer of selection? It risks infinite regress or admitting that philosophy is just another competence without comprehension.

  ### Structural Advice: The Four Moves

  **Move 2 (Diagnosis of Asymmetry as Causal History vs. Justification) is at risk of collapse.**
  This is the pivot point. If the Dennettian or Phil Bio convinces the room that justification *is* a causal history (naturalized epistemology), Move 2 fails, and the asymmetry vanishes.
  *   **Recommendation:** Do not cut it, but soften the metaphysical claim. Frame it as **"Explanatory Role"** rather than metaphysical justification. Argue that Darwinian explanations *function* to describe history, whereas Turingian explanations *function* to validate steps. If you treat it as a pragmatic distinction about what the theories *do*, rather than a metaphysical distinction about what reasons *are*, you survive the naturalist objection. If you insist on a hard metaphysical gap, you will lose the room.
