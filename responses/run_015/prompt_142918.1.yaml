  # Adversarial Collaboration Document: Quinean Metaethics

  ## 1. Agreed Claims

  Both the Quinean Moral Naturalist (QMN) camp and the Quinean Ontological Minimalist (QOM) camp endorse the following propositions as the shared foundation for this collaboration:

  1.  **Rejection of the Analytic-Synthetic Distinction:** Both camps accept Quine's argument that there is no principled boundary between truths grounded in meanings and truths grounded in facts. Consequently, ethical claims cannot be insulated from empirical revision by appealing to conceptual truth alone.
  2.  **Broad Scope of Science:** Both camps agree that Quine's naturalism encompasses the social sciences, including sociology, economics, and psychology, within the unified web of belief. There is no "first philosophy" standing outside this web to judge it.
  3.  **Non-Foundationalist Circularity:** Both camps acknowledge that naturalism is circular in the sense that it employs scientific methods to justify science (Neurath's boat). Justification is immanent to the system rather than grounded in an external archetype.
  4.  **Quine's Negligible Direct Contributions to Ethics:** Both camps accept as a historical fact that Quine produced no systematic theory of value and made negligible direct contributions to normative or metaethical theory during his career.

  ## 2. Disagreements Table

  The following table outlines the divergent interpretations of Quinean naturalism regarding the ontological status of moral entities and the significance of Quine's silence on ethics.

  | Issue | Quinean Moral Naturalists (QMN) | Quinean Ontological Minimalists (QOM) |
  | :--- | :--- | :--- |
  | **Status of Moral Predicates in Regimented Ontology** | Moral predicates are continuous with empirical psychology, sociology, and evolutionary biology. When indispensable for explaining human behavior and social coordination, they warrant ontological commitment within a regimented scientific theory. | Moral values are dispensable to every regimented scientific theory. According to the indispensability criterion, moral predicates should be treated as conventional expressions or preferences rather than as ontologically committing entities. |
  | **Interpretation of Quine's Silence on Ethics** | Quine's lack of direct engagement with ethics represents an omission or an unfinished project. His broad naturalism logically extends to practical philosophy, inviting successors to naturalize value theory. | Quine's neglect of practical philosophy was a principled exclusion. His silence indicates a recognition that normativity lacks the truth-apt structure required for inclusion in the scientific ontology described by his indispensability argument. |

  ## 3. Cruxes

  The following sub-questions represent the primary points of contention. Resolution of these issues would necessitate a significant shift in the position of at least one camp. For each crux, a concrete case or formal result is identified, along with the specific predictions held by each camp.

  ### Crux (a): Indispensability of Moral Vocabulary in Evolutionary Models

  **Sub-Question:** Do evolutionary-game-theoretic models of cooperation and altruistic punishment make moral vocabulary indispensable in the same way that mathematical entities are indispensable to physics?

  **Concrete Case:** The modeling of stable punishment strategies in iterated prisoner's dilemmas (IPD) involving altruistic punishment mechanisms.

  **Predictions:**

  *   **QMN Prediction:** Predictive success in modeling stable cooperation depends on treating fairness or norm-violation as an irreducible causal variable. Attempts to purge the model of moralized vocabulary (e.g., "unfair," "obligation") will result in reduced explanatory power or failure to capture the stability of punishment strategies observed in empirical data.
  *   **QOM Prediction:** The same predictions regarding stable punishment can be recovered using purely behavioral descriptors (e.g., strategy vectors, payoff matrices, reinforcement histories) without positing fairness as a causal variable. The moral vocabulary is heuristic rather than ontologically necessary; the formal structure remains invariant under nominalization of moral terms.

  ### Crux (b): Normativity in Empirical Sociology

  **Sub-Question:** Does Quine's inclusion of normative sociology within science force a descriptive interpretation of its normative claims, or does it permit them to retain prescriptive force without ontological cost?

  **Concrete Case:** The status of cross-cultural moral disagreement in empirical sociology, specifically regarding the persistence of divergent norms surrounding coordination problems.

  **Predictions:**

  *   **QMN Prediction:** The persistence of disagreement merely reflects different parameter settings within a shared descriptive framework. Moral terms track real features of human coordination (e.g., equilibrium selection), and cross-cultural variation is compatible with moral realism because the underlying functional features being tracked are objective, even if local solutions differ.
  *   **QOM Prediction:** The persistence of disagreement undermines the claim that moral terms track real features of human coordination. If moral terms tracked objective features analogous to natural kinds, convergence would be expected under similar empirical conditions. Divergence indicates that moral terms reflect local conventions or preferences rather than mind-independent features of the world.
