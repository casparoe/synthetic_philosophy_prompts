      *   *Revisionists (McMahan et al.):* MEC is false. Unjust combatants are not permitted to kill just combatants. Unjust combatants are liable to be killed; just combatants are not (or less so). *Ad bellum* status infects *in bello* permissions.
      *   *The Deadlock:* Traditionalists appeal to practicality, convention, and the "fog of war." Revisionists appeal to deep moral principles (self-defense, liability). They often talk past each other because one is doing ideal theory and the other is doing non-ideal/practical theory.

