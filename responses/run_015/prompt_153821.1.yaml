      *   **Is it Methodological?** This is the big one. Revisionists do ideal moral philosophy (what is *truly* right?). Traditionalists do political/practical philosophy (what rules can we live by?).
      *   **The "Two Questions" Insight:** The user is right that "Permissibility" and "Blame" are distinct. But the real friction is between *Liability* (can I kill you?) and *Excuse* (are you a criminal?).
      *   **The Epistemic Asymmetry:** This is a substantive empirical claim that matters. If the "fog of war" is thicker for one side, the symmetry breaks. But standard theory assumes a "reasonable soldier" standard.

  5.  **Formulate the Diagnosis:**
      *   **Core Conflict:** It's not just Permission vs. Blame. It's **Ideal Theory vs. Non-Ideal Practice**.
      *   **The Conflation:** The debate conflates *Liability to Attack* (metaphysical/moral status) with *Exculpation from Punishment* (legal/moral judgment).
      *   **The Epistemic Point:** The asymmetry isn't a red herring, but it needs to be framed as a question of *Doxastic Responsibility*. Is the soldier responsible for investigating the war's justice?

  6.  **Propose a Way Out (Progress):**
      *   **Conceptual Split:** We need a tripartite distinction:
          1.  **Objective Liability:** Are you actually fighting unjustly? (Revisionist focus)
          2.  **Subjective Permission:** Did you reasonably believe you were justified? (Traditionalist focus)
