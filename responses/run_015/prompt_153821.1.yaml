      *   *Hypothesis 2 (Epistemic Asymmetry):* This is interesting. If unjust soldiers are *more* convinced, does that make them more blameworthy (dogmatic) or more excusable (invincibly ignorant)? Usually, the epistemic excuse relies on *reasonable* belief. If propaganda makes belief reasonable, the excuse holds. If propaganda makes belief irrational (ignoring evidence), the excuse fails. This isn't just empirical; it's about the threshold of "reasonable belief."

  4.  **Diagnose the Stall:**
