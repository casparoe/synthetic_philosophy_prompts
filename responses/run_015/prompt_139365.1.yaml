  My flatmate and I got into one of those 3am kitchen arguments that we couldnt finish, and it's been rattling around in my head since. It started with our friend Sam, who tells everyone he wants to write a novel and has never written a line of it, and then it slid into a fight about my master's project, which is on learning reward functions from demonstrations for a little assistive kitchen robot — I record people doing a task and try to infer what they were actually optimizing for. At both points my flatmate pulled out the same line to close the discussion: actions speak louder than words. My feeling is that the line is doing completely different work in the two cases, and that in the second one it's hiding something, but I can't get the disagreement into focus well enough to say what.

  Here's the machinery that's bugging me, use it or ignore it. When I fit rewards to my kitchen trajectories, the fit stays badly ambigous even with a ton of data, and it seems to be ambiguous in three separate ways: the same behaviour is optimal for loads of different reward functions that only come apart in situations my demonstrations never visit; anything I'd explain as an odd preference I can also explain as a constraint on the body or the kitchen, since the demonstrator might avoid the high cupboard because she dislikes reaching or simply because her shoulder hurts, and no number of trajectories separates those; and what looks like a mild preference can equally be modelled as her being a sloppy optimizer, once I'm allowed to tune how sharply she maximizes. On top of that, my robot will eventually be dropped into a different kitchen, so what I need is a reward that generalizes rather than one that retrodicts the clips I already have. So the claim that behaviour reveals the preference sounds much shakier in my setting than my flatmate's tone implied.

