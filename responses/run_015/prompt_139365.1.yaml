  3. The phrase asserts that past behavior is a statistically superior predictor of future behavior than stated intent is, regardless of the underlying reasons. This is trivial in most contexts, licensing the prediction that Sam will not write, but it should alarm you since retrodicting clips fails your requirement for generalization to new kitchens.

