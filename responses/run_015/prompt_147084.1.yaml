answer: |-
  Your roommate did a solid job capturing the *vibe* of Strawson, but she got a few crucial mechanical details wrong—specifically regarding the relationship between determinism and the objective attitude, and the nature of the "desert" involved. Since you skimmed the text, it's easy to see how she got there; Strawson is dense, and her summary captures the "naturalistic" spirit well. However, for a seminar paper or exam, her nuances might get you in trouble.

  Here is a breakdown of what she got right, where she drifted, and how to correct the specific philosophical claims you asked about.

  ### 1. Does Strawson say determinism forces the objective attitude on us?
  **Verdict: No. This is the biggest error in her summary.**

  Your roommate phrased it as: *"If determinism were true we'd be forced into that attitude... But since we cant actually live like that, determinism cant really threaten our practices."*

  This implies that Strawson accepts the Incompatibilist's (Pessimist's) logic that **Determinism $\rightarrow$ Objective Attitude**, but argues that humans are too weak to follow through on that logic.

  **The Correction:**
  Strawson argues that the truth of determinism **does not provide a rational basis** for adopting the objective attitude universally.
  *   **The Pessimist's Claim:** If determinism is true, no one is truly responsible, so we *ought* to treat everyone objectively (like patients or objects).
  *   **Strawson's Rebuttal:** The concept of determinism does not logically entail the objective attitude. Even if determinism is true, it gives us no *reason* to abandon our reactive attitudes (resentment, gratitude, etc.).
  *   **The Naturalistic Fact:** Strawson argues that we are naturally constituted to have reactive attitudes. It is a fact of human nature, not a choice we make based on metaphysical theories. Therefore, the question "Can we live without them?" is almost irrelevant because we *cannot* (and shouldn't) abandon them, regardless of whether determinism is true.

  **Why it matters:** If you write that Strawson thinks determinism *would* force the objective attitude if we could handle it, you are attributing the Pessimist's view to Strawson. Strawson thinks the Pessimist is making a category mistake.

  ### 2. Is responsibility just whatever emotions people happen to have?
  **Verdict: No. There is a normative structure she is missing.**

  Your roommate suggests responsibility is *"just means being the kind of person others naturally react to with these feelings."* This sounds like a form of subjectivism or relativism (i.e., if I feel angry, you are responsible).

  **The Correction:**
  Strawson distinguishes between **raw emotions** and **reactive attitudes**. Reactive attitudes are not just blind feelings; they embody **normative expectations**.
  *   **Normative Expectations:** When I feel resentment toward you for stepping on my foot intentionally, I am not just expressing pain; I am expressing a demand that you respect me as a moral agent.
  *   **Excuses and Exemptions:** Strawson spends a lot of time detailing when reactive attitudes are *inappropriate*.
      *   **Exemptions:** If someone is a child, psychotic, or under extreme duress, they are not a fit target for reactive attitudes. It would be irrational to feel resentment toward them.
      *   **Excuses:** If someone accidentally steps on your foot, the attitude is modified (you don't resent them).
  *   **The Moral Community:** Responsibility is defined by membership in the moral community. To be responsible is to be a potential participant in these interpersonal relationships. It is not about whether people *actually* feel anger, but whether it is **appropriate** to feel anger given the norms of the community.

  **Why it matters:** If responsibility were just "whatever emotions people have," a psychopath who feels no resentment wouldn't be responsible, or a tyrant who feels resentment at dissent would make dissenters "responsible." Strawson relies on a shared, rational standard of human interaction, not individual whim.

  ### 3. Is the "Rebuilt Desert / Secular Karma" framing fair?
  **Verdict: No. This imports metaphysics Strawson explicitly rejects.**

  Your roommate claims Strawson is *"secretly rebuilding moral desert... almost like a secular karma system."*

  **The Correction:**
  "Karma" implies a metaphysical law of cause and effect where moral actions *deserve* specific cosmic outcomes. Strawson is an **anti-realist** about ultimate desert.
  *   **Internal vs. External:** Strawson isn't rebuilding desert to justify punishment from a "view from nowhere." He is saying that "desert" is a concept that only exists *inside* the practice of reactive attitudes.
  *   **No Cosmic Scorecard:** There is no "secular karma." There is only the fact that human relationships require these attitudes to function. If you ask, "But do they *really* deserve it in the grand scheme of the universe?" Strawson would say that question is unintelligible.
  *   **Constitutive, Not Justificatory:** Reactive attitudes don't *justify* responsibility; they *constitute* it. Responsibility isn't a hidden property that the attitudes detect; responsibility is the status of being a target of these attitudes.

  **Why it matters:** Calling it "karma" suggests there is a hidden truth about the universe that Strawson is trying to preserve. Strawson is arguing that there *is* no hidden truth to preserve. The practice is its own foundation.

  ### 4. What survives correction, and does the conclusion hold?
  Your roommate's summary survives in its broad strokes, but needs tightening on the mechanics.

  **What Survives (The Green Light):**
  *   **The Shift:** She is right that Strawson moves the debate from metaphysics (causal origins) to psychology/sociology (reactive attitudes).
  *   **The Objective Attitude:** Her definition of the objective attitude (treating people as objects to be managed/fixed) is accurate.
  *   **The Irrelevance of Determinism:** Her conclusion that determinism doesn't threaten our practices is correct. Strawson does dissolve the traditional debate.

  **What Needs Correction (The Red Light):**
  *   **The Link:** Determinism does not imply the objective attitude (she got the direction of the argument wrong).
  *   **The Normativity:** Responsibility is not just about actual emotions, but about appropriate normative expectations within a community.
  *   **The Metaphysics:** He is not rebuilding "desert" or "karma"; he is dissolving the need for a metaphysical justification of desert.

  ### Summary for your Seminar
  If you need to articulate this in class or on a paper, here is the corrected thesis:

  > "Strawson does not argue that determinism would force us into the objective attitude if we were strong enough; rather, he argues that determinism provides no intelligible reason to adopt the objective attitude universally, because our commitment to reactive attitudes is a natural fact of human existence, not a theoretical commitment. Furthermore, responsibility is not merely a matter of subjective emotion, but is grounded in the normative expectations of the moral community. Finally, Strawson is not reconstructing a metaphysical notion of desert (like karma), but rather arguing that the concept of desert is internal to the practice of reactive attitudes and requires no external justification."

  **Bottom Line:** Your roommate gave you a great "elevator pitch" version, but if you use her specific claims about *why* determinism fails to threaten responsibility, you might be marked down for misrepresenting Strawson's argument against the Pessimist. Stick to the "Naturalistic Fact" argument, not the "We can't live that way" argument.
