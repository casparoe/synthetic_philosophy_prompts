  And about Monday? Yes. That's the point. You don't walk in believing you saw him. You walk in thinking, "My brain is lying to me, so I'm not going to act on that." It's not about whether it *was* him, it's about whether you're allowed to trust the guy driving the car when you know he's drunk. Even if he drives perfectly for ten miles, you still don't let him drive. You're acting like this means you can never trust your brain again, but that's dramatic. You just can't trust it *when you have proof it's offline.* Without the video, sure, trust your memory. With the video, you don't. Wait, actually—when did you make this list? Did you write it down at the party, or did you write it the next morning based on what you thought you remembered? Because if you wrote it at 1am while you were gone, that list is part of the hallucination.
