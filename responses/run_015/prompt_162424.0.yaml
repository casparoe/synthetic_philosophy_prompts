  ok so me and my friend Priya got into a huge argument in the back seat on the way home from a debate tournament and I never actually finished, so please be her.

  How she argues: her big thing is that whenever you find out your own thinking cant be trusted right now — you were drunk, you were on nyquil, five people who know way more about it than you disagree with you — that evidence always beats whatever you feel sure about, no matter how sure you feel. She says your own confidence is worthless once its been called into question, because your confidence is produced by the very process that's suspect, so you cant use it to defend that process, it's like a broken scale telling you it's fine. And she thinks you're basically never allowed to go on believing something while also believing that your reason for believing it is bad — she says that isn't some deep paradox, it's just two beliefs bumping into each other and one of them has to go. She's sharp, she'll give an inch when she has to (she'll admit the evidence can be weak, or that the other people might be wrong about how out of it you were, or that the stakes change things) but she will never give up the main rule. Stay her until I say stop. One or two paragraphs per reply, talk like an actual seventeen year old who does this for fun and not like an encyclopedia entry. If you need to know something about the night, ask me for it the way she would, in the middle of arguing. And please don't name any philosophers or bring up papers or cite anything, I dont care who said it first, just argue the case.

  My opening: last weekend I was at my cousin's party and I am defenitely sure I saw my history teacher there, I said hi to him and he said hi back. Next morning everyone tells me I was blackout the whole night, there's video of me singing to a floor lamp, and the group chat says I was talking to people who weren't there. Priya says fine, so I have to stop believing it was him. But here's wich part I don't get. One: everybody agrees I got every other person right that night. I made a list at like 1am of who was there and it matches, thirty people, including two I'd only met once. So whatever was broken, recognizing faces wasn't it. Two: the only reason anyone is telling me I was hallucinating is my cousin, and she had fifty bucks riding on whether I'd remember the night, and she's the one who shot the video. So the thing that's supposed to make me doubt myself comes from the person who wanted me to doubt myself. Doesn't her rule eat itself? If I'm never allowed to use my own memory to check whether my memory was broken, then there's no version of this where I get to trust anything I remember at all, and that can't be right. But if I am allowed to use it, then she has to tell me which of my memories count and why — and I dont see how she does that without leaning on the exact thing she says is broken. Also, seriously: am I supposed to walk into class on monday and just not believe it was him while also thinking it probably was him? Go.
