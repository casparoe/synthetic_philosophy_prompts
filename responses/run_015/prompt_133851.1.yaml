      *   **Tension 3: (a) + (b) [Physicalism vs. Non-Neural]**
          *   (a) Physicalism. (b) Non-neural minds.
          *   *Conflict:* None. Physicalism explicitly allows multiple realizability. As long as the ants are matter, (a) holds.
          *   *Severity:* Low/None.

      *   **Tension 4: (g) vs. (b)/(d) [Intuitions vs. Theory]**
          *   (g) says our intuitions about swarm minds are unreliable.
          *   (b)/(d) relies on a theoretical judgment that they *could* be minds.
          *   *Conflict:* (g) actually helps defend (b) against common intuition ("ants aren't conscious!"). It explains *why* people reject (b).
