      *   (c) **Integration Requirement:** Information integration is needed, but not Tononi's specific IIT (specifically rejecting Exclusion).
      *   (d) **Reflexivity Condition:** Feedforward = no mind. Feedback/Reflexive tracking (pheromones tracking tracking) = potential mind.
