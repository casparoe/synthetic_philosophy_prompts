          *   Is the whole premise a category mistake?
      *   **Requirements:** Rank tensions by severity, suggest single revisions for maximum cleanup, identify which verdict to drop for consistency, and be honest/critical (no smoothing over).

  2.  **Deconstruct the User's Positions:**
      *   (a) **Physicalism:** Minds = arrangements of matter. No dualism.
