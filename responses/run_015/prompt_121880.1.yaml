answer: |-
  To the Committee,

  The health economist's objection—that the therapy/enhancement distinction is merely a leaky proxy for cost-effectiveness—confuses the boundary of entitlement with the efficiency of provision. QALYs measure the magnitude of a benefit; they do not determine whether the state is obliged to provide it. A cost-effective enhancement remains excluded under the current draft rule. Conceptual work is therefore logically prior to economic modelling: we must define what counts as a restorative health benefit before we can calculate its value. The following agenda prioritises questions that directly stabilise the wording of the coverage rule ("restore or maintain normal functioning").

  **1. The Flattening Problem (Priority One)**
  This is the most urgent conceptual failure point. The rule covers "maintenance", yet many interventions merely slow decline or compress variance rather than restoring a lost capacity. If slowing ageing counts as therapy, the budget becomes unbounded; if it counts as enhancement, the system abandons preventive care.
  *Upstream Impact:* This settles the temporal scope of "normal functioning". Does the baseline reset continuously, or is it fixed at a species-typical peak?
  *Tractability:* High. This requires philosophical analysis of function over time, not new empirical data.
  *Rule Shift:* A clear verdict here dictates whether "maintain" implies holding a static line or accepting a managed decline. It prevents the rule from either collapsing into universal life-extension funding or excluding geriatric care.
  *Reordering:* This moves down only if empirical modelling shows maintenance interventions are negligible cost-wise, rendering the distinction fiscally irrelevant.

  **2. The Shifting-Baseline Problem (Priority Two)**
  If "normal" is statistical, widespread uptake of an intervention makes the untreated state pathological, inverting the distinction. The rule risks becoming self-defeating: successful therapies become mandatory enhancements.
  *Upstream Impact:* This determines whether "normal" is a statistical average or a normative standard. If statistical, the rule needs a fixed reference class (e.g., "natural" function) immune to uptake effects.
  *Tractability:* Medium. Conceptual work is needed, but it requires sociological input on uptake rates to model the drift.
  *Rule Shift:* Forces the drafters to specify whether the baseline is dynamic (current population) or static (species-typical design). Without this, legal challenges will exploit the drift.
  *Reordering:* Moves up if early adoption data shows rapid normalisation of new interventions; moves down if uptake remains niche.

  **3. The Means-Sensitivity Problem (Priority Three)**
  The health system pays for pills, not schools or ramps, yet functional outcomes may be identical. If the rule is outcome-based, why exclude non-medical means? If it is means-based, what justifies the privileging of clinical intervention?
  *Upstream Impact:* This defines the jurisdiction of the health system versus social care or education. It prevents the rule from being bypassed by re-labelling social interventions as medical ones.
  *Tractability:* High. Purely normative analysis of "medical necessity" versus "functional utility".
  *Rule Shift:* Clarifies whether coverage is tied to the *mechanism* (biological intervention) or the *end-state* (functional capacity). This protects the budget from scope creep into general social welfare.
  *Reordering:* Moves up if cross-sector budgeting becomes politically viable; moves down if medical exceptionalism remains unchallenged.

  **4. The Positional Problem (Priority Four)**
  For competitive traits (e.g., height, cognition), one person's gain is another's loss. Public funding for such interventions subsidises an arms race rather than improving aggregate welfare.
  *Upstream Impact:* This addresses whether "benefit" is absolute or relative. It determines if the rule should exclude interventions that restore normal function but confer competitive advantage.
  *Tractability:* Medium. Requires game-theoretic modelling of social goods alongside ethical analysis.
  *Rule Shift:* Adds a clause excluding interventions where the primary value is positional, even if they restore statistical normality.
  *Reordering:* Moves up if labour markets become increasingly competitive regarding biological traits; moves down if automation reduces the value of human competitive traits.

  **The Overrated Question: The Many-Users Problem**
  I recommend excluding the "Many-Users Problem" from the funded agenda. While it is true that clinicians, insurers, and activists use the distinction differently, this is a descriptive observation about language use, not a normative guide for policy. Knowing that stakeholders are confused does not tell us how they *ought* to decide. Funding this risks producing a sociological map of confusion without providing the conceptual tools to resolve it. It dissolves under pressure because it treats the inconsistency of usage as the problem, rather than the lack of a principled standard underlying that usage. It would not change the wording of the rule; it would only annotate the disagreements surrounding it.

  **Summary**
  This order reflects logical dependency. We must first define what counts as maintaining function (Flattening), then fix the baseline against which maintenance is measured (Shifting-Baseline), then determine which mechanisms qualify (Means-Sensitivity), and finally filter for social value (Positional). The health economist's QALY work should run parallel, but it cannot replace this foundational conceptual labour. Without these answers, the coverage rule is either fiscally unsustainable or legally indefensible.

  Yours,
  [Your Name]
