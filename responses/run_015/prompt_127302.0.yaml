answer: |-
  **JOINT STATEMENT ON LOGICAL CORRELATION AND DECISION THEORY**

  **I. AGREED CLAIMS**

  1.  **Payoff Structure:** The baseline case is a standard one-shot Prisoner's Dilemma (T > R > P > S; 2R > T + S).
  2.  **Non-Altruism:** The argument for cooperation between copies is not an altruism argument. It asserts that cooperating maximizes *self*-interest given logical correlation. Utility functions remain self-regarding.
  3.  **Altruism Confound:** Partial altruism is a confound to be screened off. The debate holds even if agents care solely about their own payoff.
  4.  **Newcomb Relation:** The argument for cooperating with a copy and one-boxing in Newcomb's Problem are structurally related (conditioning on logical evidence vs. causal effect) but can in principle come apart. One may consistently one-box and defect, or box and cooperate.
  5.  **FDT Framing:** Functional Decision Theory (FDT) restates the superrationalist conclusion in new vocabulary (selecting policy outputs) without settling the normative question of whether agents *should* reason that way.
  6.  **Timing Irrelevance:** It makes no difference to either view whether agents deliberate simultaneously, an hour apart, or if one has already answered and the result is hidden. The logical relation is timeless.
  7.  **Verbal Dispute:** The term "rational" performs two jobs. Dave uses it to mean "outcome-optimal given logical identity." Priya uses it to mean "causally efficacious maximization."
  8.  **Substantive Remainder:** Once terminology is disentangled, the substantive dispute is whether an agent should condition their expected utility calculation on the logical implication of their decision for a distinct physical system.

  **II. DISAGREEMENTS**

  | Issue | Dave (Superrationalist) | Priya (Causal Decision Theorist) |
  | :--- | :--- | :--- |
  | **The Link** | My decision logically fixes the copy's decision because we instantiate the same algorithm. To choose is to choose for the algorithm. | My decision causally affects only my outcome. The copy's decision is a fixed fact or independent event; correlation is not causation. |
  | **Action Guidance** | Cooperate. Defecting implies the copy defects, yielding P. Cooperating implies the copy cooperates, yielding R. R > P. | Defect. Regardless of what the copy does, defecting yields a higher payoff for me. The copy's action is not a causal consequence of mine. |
  | **The "Choice"** | I choose the output of the abstract reasoning procedure instantiated in both locations. | I choose the physical act performed by this body at this time. |

  **III. CRUXES AND TEST CASES**

  The following cases isolate the breaking points. For each, predictions are recorded in advance.

  **(a) The Smudged Mirror**
  *Setup:* You play PD against an agent built from a lossy copy of you with ~3% of decision-relevant bits flipped.
  *Crux:* Does logical correlation degrade smoothly with similarity, and does the normative force degrade with it?
  *Empirical Bearing:* If cognitive architecture is robust, 3% flips may change nothing. If fragile, correlation drops. Both parties accept that if correlation drops to 0, Priya wins. The dispute is the slope.
  *Dave's Prediction:* Cooperation remains obligatory if correlation is high (>90%). If correlation degrades, the strategy should shift smoothly, potentially to mixed strategies, though shared random bits are required to maintain sync.
  *Priya's Prediction:* Defect always. The causal isolation is binary; unless my act *causes* the copy's act, correlation is irrelevant. 3% or 0% flips makes no normative difference.

  **(b) The Weighted Twins**
  *Setup:* Same game, but Twin A's payoffs are multiplied by 20. Both know who is who.
  *Crux:* Does superrationality require symmetric payoffs to mandate cooperation?
  *Intra-Camp Fracture:* Dave's camp fractures here. Superrationality relies on "what you would want everyone to do." If "everyone" includes a twin with different stakes, the universalizable maxim is unclear.
  *Dave's Prediction (Majority):* Indeterminate. Some will argue for cooperation to maximize joint sum; others will argue the high-stakes twin should defect to secure their massive gain, breaking the symmetry.
  *Priya's Prediction:* Defect always. Dominance holds regardless of payoff magnitude. The high-stakes twin has even more causal reason to secure the dominant outcome.

  **(c) The Doorway**
  *Setup:* Two players, one door. Best outcomes are asymmetric (A through/B wait, or B through/A wait). Both rush = disaster. Both wait = bad.
  *Crux:* Can superrationality select between asymmetric equilibria, or does the "do what you would want all to do" rule fail when symmetry yields suboptimal results?
  *Dave's Prediction:* Without a shared random bit or irrelevant label to break symmetry, the rule delivers "both wait" (the symmetric outcome), revealing superrationality is built for symmetric games. With a shared coin, agents coordinate on the asymmetric optimum.
  *Priya's Prediction:* Mixed strategy Nash equilibrium or focal point selection based on causal expectations. Superrationality adds nothing; the problem is solved by standard coordination mechanics or fails similarly.

  **IV. EMPIRICAL HOOKS**

  While primarily conceptual, Case (a) bears on empirical claims about cognitive stability.
  *Experiment:* Run identical decision algorithms on hardware with induced bit-flip noise (0% to 10%). Measure output correlation.
  *Dave's Hook:* If correlation remains >95% at 3% noise, defection is empirically false regarding the link. If correlation drops sharply, the "logical identity" claim weakens.
  *Priya's Hook:* Regardless of output correlation, if the causal graph remains disconnected, the normative claim stands. She is on the hook only if she claims high output correlation *implies* causal leverage.

  **V. RATIFICATION**

  By signing, both parties agree that refusing to engage with these specific cases constitutes a concession. If Dave cannot resolve (b) without admitting indeterminacy, he concedes superrationality is incomplete. If Priya cannot explain why high correlation in (a) lacks normative weight without appealing to causation-only dogma, she concedes her framework ignores logical evidence.

