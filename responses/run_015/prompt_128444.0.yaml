      *   *Hypothesis:* Yes, there are two competing definitions of "I" at play.
          1.  **The Phenomenal I:** The locus of immediate experience (qualia).
          2.  **The Functional/Agentive I:** The entity capable of reasoning, acting, and persisting.
      *   Descartes' *Cogito* secures #1 primarily. It *infers* #2, but weakly.
      *   The principle that unifies the user's "correct" intuitions is **Immediate Phenomenal Givenness**. If there is no "what it is like," the *Cogito* fails.

