      *   **The Crux:** Is there one underlying principle, or is the user equivocating on the meaning of "I"?
      *   **Goal:** Provide a philosophical framework that reconciles these intuitions, clarifies the scope of the *Cogito*, and addresses the specific edge cases (hallucination, sleepwalking).

  2.  **Deconstruct the *Cogito*:**
      *   What is it *not*? It's not a syllogism (I think, all thinkers exist, therefore I exist). Descartes insists it's an intuition or a performative act.
      *   What is it *actually*? It's the indubitability of the *experience* of thinking. The truth condition is internal to the experience itself.
