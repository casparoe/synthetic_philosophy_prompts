answer: |-
  ### Brainstorming and Preliminary Distinctions

  Right, let's clear the deck. You are asking for a normative framework that navigates between rigid deontology (your mother-in-law) and loose pragmatism (your brother). My first instinct is to reach for T.M. Scanlon's contractualism—what principles could no one reasonably reject?—but that feels too abstract for the grit of expense claims and Kita pickups. You need something that accounts for the *psychology* of norm-following, not just the logic.

  I am tempted by the distinction between *constitutive* rules (which create the activity, like the offside rule in football) and *regulative* rules (which govern pre-existing activity, like driving speeds). Your office signature rule feels regulative (bureaucracy), whereas the office presence rule feels constitutive of team culture. However, that distinction is too brittle; a regulative rule can become constitutive of trust. I'm also considering Elster's notion of social norms as distinct from laws: norms rely on shame and reputation, laws on force. Your case 2 (the neighbour watching) is purely normative; case 8 (disabled parking) borders on legal/moral.

  What I am throwing out is pure utilitarianism. It cannot explain why case 6 (hiding the breach) is worse than case 5 (open breach), even if the outcome is identical. The *secret* is the moral injury. I am also discarding the idea that 'culture' is just a variable; in Germany, *Ordnung* is a moral good in itself, not just a means to efficiency.

  The axis I find most promising is **Reliance**. Rules are crystallised expectations. When you break a rule, you aren't just acting on the world; you are acting on the *expectations* others have formed based on that rule. The moral wrongness correlates to the degree to which you exploit those expectations while undermining them. This handles the 'slack' issue: some systems rely on high compliance (brittle), others on average compliance (robust). It also handles the self-judgment issue: you cannot exploit a system of reliance for personal gain (expenses) because that destroys the reliance of the contributors. But you can exercise judgement on contribution (sickness) because that protects the reliance of the group on your health.

  I will commit to an account based on **Reciprocal Reliance**. It treats rules as promises made to the collective about future behaviour.

  ***

  ### The Principle of Reciprocal Reliance

  Here is the account I propose. A rule is a mechanism for stabilising mutual expectations. To break a rule permissibly, you must satisfy three conditions. If you fail any one of them, the breach is morally suspect.

  1.  **Functional Idleness:** The specific harm or coordination failure the rule is designed to prevent must not be active in this specific instance. (This addresses the 6 a.m. red light).
  2.  **Non-Parasitic Stability:** Your exception must not rely on the general compliance of others to remain effective. You cannot be a free-rider on a system of trust that your action, if generalised, would collapse. (This addresses the 'slack' and coordination issues).
  3.  **Public Justifiability:** You must be willing to offer the reason for your exception to the community bound by the rule, without undermining their willingness to continue cooperating. (This repairs Clause C).

  **The Addendum on Self-Judgment:** You may not grant yourself an exception on *distributive* rules (taking resources, like expenses) because you are a biased judge in your own favour. You *must* grant yourself an exception on *participatory* rules (contributing labour/risk, like coming in sick) if participation would harm the collective good the rule is meant to serve.

  ### Addressing Your Three Problems

  **First, the problem of Clause (c) and Universalisation.**
  Your mother-in-law's view is a rigid Kantian categorical imperative: "If everyone did it, chaos." You rightly reject this because it ignores context. My condition of **Public Justifiability** replaces "Everyone doing it" with "Everyone *knowing* I did it."
  *The Cost:* You lose the comfort of secret exceptions. If you cross at 6 a.m., you must be willing to tell the neighbour, "I did this because no cars were coming," without them losing trust in your general regard for safety. If you can't say it without them thinking you're reckless, you shouldn't do it. This stops the slide into your brother's "nobody's watching" relativism. It forces you to own the exception as a public stance, not a private loophole.

  **Second, the problem of Slack and Coordination.**
  You asked if 'slack' is the right axis. It is, but it is derivative of **Non-Parasitic Stability**. A rule has slack if the system remains stable despite individual breaches. The three-signature rule has slack; one person skipping it doesn't break the audit trail. The office-presence rule has little slack; if everyone uses their own judgement on presence, the 'office' ceases to function as a collaborative space.
  *The Distinction:* It is not merely coordination vs. accountability. It is about *interdependence*. The office rule is interdependent (my presence is useless if yours isn't). The signature rule is cumulative (my signature adds to the pile). Your principle needs to identify whether the rule creates a *network good* (brittle, requires near-universal compliance) or a *aggregate good* (robust, tolerates deviation). My account captures this in condition 2: if your exception works only because others *don't* take it, you are parasitising.

  **Third, the problem of Self-Judgment (Expenses vs. Sickness).**
  Your principle failed here because it treated all rules as functional tools. But rules also allocate *authority*.
  *The Repair:* The **Addendum on Self-Judgment**. In Case 7 (expenses), the rule is a control on *your* honesty. To judge yourself is to remove the control. In Case 12 (sickness), the rule is about *team capacity*. If you come in sick, you violate Functional Idleness (you spread illness). Here, self-judgment is required because the manager cannot see your health.
  *The Verdict:* You are not allowed to judge your own compliance when the rule protects the group *from you* (expenses, theft). You are required to judge your own compliance when the rule protects you *from the group* (safety, health).

  ### Application to Your Twelve Cases

  Here is how the Principle of Reciprocal Reliance scores your verdicts. I have been rigorous; where your gut conflicts with the principle, I have noted it.

  1.  **Red light (6 a.m., empty):** **Permissible.** Functional Idleness (no danger); Non-Parasitic (safety system not engaged); Public Justifiability (easy to explain). *Matches your verdict.*
  2.  **Red light (Neighbour watching):** **Impermissible.** Fails Public Justifiability. You cannot explain to the child that you ignore rules when convenient without undermining their training in safety. *Matches your verdict.*
  3.  **Bottles next to bin:** **Permissible.** Functional Idleness (waste collected); Non-Parasitic (adds value); Public Justifiability (seen as generous). *Matches your verdict.*
  4.  **Bottles in glass bin:** **Impermissible (with caveat).** Fails Functional Idleness. Glass recycling is a specific industrial process; contamination creates costs for others. It is careless because it offloads your sorting labour onto the facility workers. *Overturns your verdict slightly: it is not 'fine', it is a minor breach of reliance.*
  5.  **Skip signature (Open):** **Permissible.** Functional Idleness (shipment delayed is a harm); Non-Parasitic (one-off); Public Justifiability (told the boss). *Matches your verdict.*
  6.  **Skip signature (Hidden):** **Impermissible.** Fails Public Justifiability. Secrecy implies you know it wouldn't be accepted. It erodes audit trust. *Matches your verdict.*
  7.  **Expenses (€9 rounding):** **Impermissible.** Fails Self-Judgment Addendum. This is a distributive rule protecting the pot. You cannot be the judge. *Matches your verdict.*
  8.  **Disabled parking report:** **Permissible (Obligatory).** Functional Idleness (badge missing means harm to disabled); Public Justifiability (upholding the system). *Matches your verdict.*
  9.  **Grassing on home office:** **Impermissible.** Fails Non-Parasitic Stability. This rule relies on peer trust. Reporting it breaks the solidarity required for the team to function socially, even if it upholds the bureaucracy. Unless the absence causes specific harm, the reliance of the colleague on your discretion outweighs the manager's reliance on the rule. *Matches your verdict.*
  10. **Stupid rule (Review pending):** **Permissible.** Functional Idleness (temporary compliance maintains stability during review). *Matches your verdict.*
  11. **Harmful rule:** **Impermissible to follow.** Functional Idleness is overridden by higher moral duty. If the rule hurts people, its function is corrupted. *Matches your verdict.*
  12. **Coming in sick:** **Impermissible.** Fails Functional Idleness. The rule 'come to work' presumes health. If sick, your presence harms the team's capacity. Self-Judgment Addendum requires you to stay home. *Refines your verdict: It is not 'back and forth', you should stay home.*

  ### Application to New Cases

  **Case A: The Kita Pickup (16:30 deadline)**
  *Verdict:* **Impermissible to be late.**
  *Reasoning:* This is a high-coordination rule with zero slack. The *Erzieherin* (educator) relies on the 16:30 time to hand over responsibility. Being twelve minutes late violates **Non-Parasitic Stability**. If every parent thought "12 minutes is fine," the staff could never plan their shifts or personal lives. The look you received was a signal that you had breached a reliance contract. In Germany, the Kita is not a service provider you hire; it is a cooperative community you join. The rule protects the workers' right to a private life, not just the child's safety. Your lateness claimed a priority over their time without consent.

  **Case B: The Diversity Form (Useless data)**
  *Verdict:* **Permissible to ignore (quietly).**
  *Reasoning:* This fails **Functional Idleness**. If the data is genuinely useless and collected merely for performative compliance, the rule's purpose is already null. However, you must apply **Public Justifiability**. If asked, you must be able to say, "I did not fill this out because the categories do not capture the relevant data," without being fired. If the form is a signal of solidarity (showing you care about inclusion), ignoring it signals disloyalty. If it is purely bureaucratic box-ticking, ignoring it saves social energy. Given your description ('useless data'), the function is idle. However, be wary: in a German context, the *process* of filling the form is often the signal of compliance, not the data itself. Ignoring it may be read as a refusal to cooperate with the system, not just the form.

  ### The German/American Difference: What is Really at Stake?

  You asked if this is a disagreement about rules versus conscience. It is not. Both you and your mother-in-law are using conscience. The disagreement is about **Generalised Trust versus Particularised Trust**.

  In the American model (your brother), trust is *particularised*. You trust people you know, or people who have demonstrated competence. Rules are defaults for when trust is absent. "Nobody's watching" means "I am trusted to use my judgement." The moral weight lies in the *outcome* and the *intent*.

  In the German model (your mother-in-law, the *Erzieherin*), trust is *generalised*. You trust the *system* so you do not have to trust the *individual*. The red light is not about cars; it is about maintaining a predictable environment where strangers do not need to negotiate every interaction. When you cross on red, you are not just risking safety; you are signalling that you place your own judgement above the shared system. In a small German town, this is read as a lack of *Solidarität* (solidarity).

  **Who has the better of it?**
  Neither is objectively superior, but they suit different densities of life.
  *   The American model is better for innovation and fluidity. It allows for the 'hack' that improves the system (Case 5).
  *   The German model is better for stability and equity. It protects the weak from the arbitrary discretion of the strong. The disabled parking bay works *because* people don't use their judgement on whether they 'need' it.

  However, in your specific situation, **the German model has the better of it regarding your integration.** You are living in a high-coordination society. By enforcing rules you don't believe in (the Council, the Timesheets), you are acting as a 'System Trustee'. If you apply American particularised trust to German generalised rules, you will be seen as unreliable. Not because you are immoral, but because you are unpredictable.

  My advice? In the workplace (timesheets), adopt the German model strictly. It is a system of legal reliance. In the social sphere (Kita, neighbours), adopt the German model of *visibility*. Do not break rules secretly. If you must break one, make it a public contribution to the dialogue about the rule. Your mother-in-law is wrong that the rule is sacred; your brother is wrong that the rule is optional. The rule is a promise. Keep it, or renegotiate it openly. But do not simply step around it in the dark.
