prompt: |-
  I'm a retired natural scientist who recently started reading philosophy and now I'm helping design an upper-level ethics exam. I want one essay question about whether cross-cultural differences in folk morality—particularly the WEIRD versus non-WEIRD patterns—actually threaten moral objectivity, but I need it to be unanswerable by just summarizing Henrich or Haidt. To push students past memorization, I'm asking them to apply a distinction I cooked up: ecological calibration versus coordination noise. Ecological calibration means moral norms that adaptively track real environmental pressures like group size or resource scarcity, while coordination noise means arbitrary equilibria like purity rules about left versus right hand use. The exam should ask whether separating these saves objectivity, or whether it just relocates the problem onto showing that calibrated norms aren't merely evolutionarily useful but genuinely correct. They should also need to explain why the failure of coordination noise to be objective doesn't automatically help the objectivist. Please write the exam prompt itself, then a model answer of about 700 words, and a marking scheme all in continuous prose with no headings, bullet points, bold text, or tables—just like you'd write in a long email. The marking scheme should name the specific moves that seperate an A from a B: handling the evolutionary debunking argument specifically for calibrated norms, explaining why arbitrary variation doesn't license relativism, and showing that calibration requires an independent normative standard to avoid circularity. Don't include any request for bibliographies, citations, or reading lists—this should be answerable without searching the web, but it should still require thinking through the distinction rather than reciting standard psychology summaries. I misspell things sometimes, so an occurence or two is fine.
