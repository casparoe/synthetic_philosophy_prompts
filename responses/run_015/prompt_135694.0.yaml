answer: |-
  Dear colleague, it was a pleasure discussing your new project on ethics exam design, and I have drafted the materials you requested below, keeping everything in continuous prose as you asked so you can copy and paste it directly into your documents without needing to strip out formatting. Here is the exam prompt itself, which sets up the distinction you developed and asks the specific metaethical questions without allowing students to rely solely on reciting Henrich or Haidt. Consider the empirical evidence regarding cross-cultural variation in moral intuitions, particularly the divergences between WEIRD and non-WEIRD societies. Some philosophers argue this variation undermines moral objectivity, suggesting morality is merely relative to culture. To evaluate this, apply the distinction between ecological calibration and coordination noise. Ecological calibration refers to moral norms that adaptively track real environmental pressures, such as norms of sharing emerging from resource scarcity, while coordination noise refers to arbitrary equilibria, such as purity rules regarding left versus right hand use that solve coordination problems without tracking independent truths. Does separating these two categories save moral objectivity from the challenge of cultural variation, or does it merely relocate the problem? Specifically, explain why the failure of coordination noise to be objective does not automatically help the objectivist, and argue whether showing that a norm is ecologically calibrated proves it is genuinely correct or merely evolutionarily useful.

  Below is a model answer of about 700 words that demonstrates the level of analysis you should expect from an upper-level student, walking through the distinction and its implications for metaethics. The distinction between ecological calibration and coordination noise offers a nuanced way to parse cultural variation, but it does not straightforwardly rescue moral objectivity without further philosophical work. To begin, we must acknowledge that the existence of coordination noise does not inherently threaten objectivity. If certain moral rules are merely arbitrary equilibria, like driving on the left versus the right side of the road, their variation across cultures is expected and irrelevant to the truth of moral claims. Relativists often point to variation as proof that no single moral truth exists, but if the variation is confined to noise, then objectivity remains intact for the substantive norms underneath. However, this does not automatically help the objectivist because isolating noise requires us to identify which norms are merely arbitrary and which are calibrated, and this identification process itself relies on theoretical assumptions that may be contested. Furthermore, even if we successfully isolate coordination noise, the remaining category of ecologically calibrated norms presents a deeper challenge. If a norm exists because it helped a group survive in a specific environment, such as strict hierarchy in high-danger settings, we face the evolutionary debunking argument. The fact that a belief was useful for survival does not entail that it is morally true. Evolution selects for fitness, not truth, so a norm could be perfectly calibrated to an environment and still be morally abhorrent. For example, infanticide might be ecologically calibrated to resource scarcity, but an objectivist must argue it is wrong regardless of its utility. Therefore, separating calibration from noise clarifies the source of variation but does not solve the justification problem. The objectivist must still provide an independent normative standard to show why calibrated norms are correct, rather than just adaptive. If they cannot do this, they fall into a naturalistic fallacy, conflating what is evolutionarily successful with what is morally good. Additionally, the failure of coordination noise to be objective does not help the objectivist because it leaves the calibrated norms vulnerable. If the only objective parts of morality are the calibrated ones, and those are subject to debunking, then objectivity is still lost. The objectivist needs to show that calibration tracks moral truth, not just environmental fit. This requires a robust metaethical account linking environmental pressures to moral reasons, which is difficult to establish without circularity. Ultimately, the distinction helps diagnose the type of variation we see, but it does not bridge the is-ought gap. Students must recognize that utility is not validity. An A-grade response will explicitly handle the evolutionary debunking argument specifically for calibrated norms, noting that adaptive success does not guarantee moral truth. It will also explain why arbitrary variation in coordination noise does not license relativism about the core moral truths, distinguishing between surface-level rules and underlying principles. Finally, it must show that calibration requires an independent normative standard to avoid circularity, meaning we cannot define moral truth solely by what helped us survive. A B-grade response might correctly define the terms but fail to see that calibration itself is vulnerable to debunking, or it might assume that because noise is arbitrary, the remaining calibrated norms are automatically objective. The key difference lies in recognizing that removing noise clears the field but does not win the game. You still need to prove that the surviving norms are true, not just useful. I hope this draft serves your needs well and captures the philosophical depth you are looking for without relying on simple summaries of psychological literature. Please let me know if you need any adjustments to the word count or the specific phrasing of the marking criteria, as I tried to keep the whole thing in one continuous flow like an email. Best wishes with the exam design.
