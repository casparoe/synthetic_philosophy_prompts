  2.  **Deconstruct the Philosophical Positions:**
      *   **Transworld Identity (Kripke/Plantinga):** An individual exists in multiple possible worlds. Identity is strict and necessary. If $A$ in World 1 is identical to $B$ in World 2, they are the *same* entity. Origin matters (Kripke). If the duplicate has a different origin (synthetic vs. biological), it might not be the same person. However, if identity is strict, either it is the person or it isn't. It struggles with fission/replication cases where intuition suggests continuity without identity.
      *   **Counterpart Theory (Lewis):** Individuals are world-bound. Identity across worlds is replaced by similarity relations (counterparts). A person in World 1 can have multiple counterparts in World 2. This allows for saying the duplicate is a *counterpart* (psychologically continuous) without being *identical* (numerically distinct).

  3.  **Evaluate against the Intuition:**
      *   **Intuition:** Replication preserves psychological continuity *without* preserving genuine personal identity.
      *   **Lewis:** Fits well. The duplicate is a counterpart, not the identical person. We can say "I survive" in a loose sense (counterpart relation) but not in a strict numerical sense.
      *   **Kripke/Plantinga:** Harder. If origins differ, they aren't identical. But then what is the relation? It forces a binary: either survival or death. It doesn't easily capture the "continuity without identity" nuance as gracefully as Lewis's similarity metrics.

  4.  **Drafting the Argument (Mental Outline):**
