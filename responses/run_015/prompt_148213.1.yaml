          *   *Refinement:* We don't need perfect precision; we need reasonable bounds. Use comparative data (e.g., similar groups without the specific injustice, or pre-injustice trajectories).
          *   *Shift the burden:* The status quo is also a counterfactual claim (that current disparities are natural or meritocratic). CID just makes the counterfactual explicit. It moves from "guessing" to "modeling."

