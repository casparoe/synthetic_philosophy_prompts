          *   *Differentiation:* UBI is universal because it addresses general poverty/existence. CID is targeted because it addresses *distorted trajectories*. Not everyone had their institutional pathway actively suppressed. Some had theirs artificially boosted (subsidies, GI Bill, etc.).
          *   *Mechanism:* It's about restoring the *slope* of the curve, not just giving a lump sum. It demands structural repair, not just cash.

