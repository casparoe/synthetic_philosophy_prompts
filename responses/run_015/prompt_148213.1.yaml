  2.  **Deconstruct the Core Concept (CID):**
      *   *Traditional Model:* Harm-based accounting. $X$ was stolen/oppressed, therefore pay back $X$ (plus interest). Focuses on specific acts and direct victims/perpetrators.
      *   *CID Model:* Institutional trajectory. Injustice changed the *rules of the game* (property, labor, education). Compare actual development vs. counterfactual development without those rule changes. Focuses on structural potential and systemic path dependence.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the framing. Validate the user's intuition. Set the stage for why this shifts the debate from "debt" to "distortion."

      *   **Argument 1: Why CID beats Harm-Based Accounting:**
          *   *Problem with Harm-Based:* It's transactional. It assumes a clean slate before the injustice. It misses the compounding effect of rules. It gets bogged down in "who exactly did what to whom" which becomes impossible over generations.
          *   *Advantage of CID:* It captures *opportunity cost* on a macro scale. It acknowledges that the injustice wasn't just an event, but a *reorientation* of society. It focuses on the *capacity* to build wealth/power, not just the wealth/power lost. It treats the institution as the unit of analysis, not the individual transaction.
          *   *Key phrase:* "Rewiring the motherboard" vs. "Stealing a component."

      *   **Argument 2: Addressing "Speculative Sociology":**
          *   *The Objection:* How can we know what *would* have happened? It's guesswork.
