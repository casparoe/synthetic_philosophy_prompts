answer: |-
  **Candidate Principles Explaining the Track Record**

  1.  **Voluntary Expressive Association:** Communities formed around specific shared commitments may exclude those who reject core tenets, provided entry was voluntary and exclusion does not deprive individuals of basic subsistence or equal exit options.
  2.  **Essential Infrastructure Monopoly:** Entities exercising sovereign-like control over unique, life-sustaining resources function as quasi-states and cannot exclude residents where no viable alternative jurisdiction exists, regardless of private ownership.
  3.  **Duty of Mitigated Exit:** Where exclusion is permissible under associative rights but imposes severe displacement costs, the excluder must fund relocation to a comparable safe haven if the excluded party lacks means and no state duty exists.

  **Application to Meridian**

  *   **Voluntary Expressive Association:** This principle supports the operator. Meridian's compact resembles the religious order's vows or the farming cooperative's language charter, and the woman's campaign against governance breaches the mutual-aid ethos. However, it fails on the "voluntary entry" condition: she was born there, making her initial subjection involuntary, unlike the postulant or the cooperative's lessees.
  *   **Essential Infrastructure Monopoly:** This principle supports the petitioner. Meridian controls life support, dispute resolution, and is the sole inhabited structure, mirroring the mining town's monopoly on housing, school, and clinic. Like the mining town unionizer, she is being excluded for political activity by a entity functioning as a state; the Chair's distinction fails because the mining town's retaliation was impermissible *precisely because* of its state-like monopoly, not despite it.
  *   **Duty of Mitigated Exit:** This principle offers a middle ground. Even if the Expressive Association principle justified exclusion, the lack of state duty and her inability to pay triggers a duty to fund relocation (as hinted in the farming cooperative's market lease condition). However, if the Essential Monopoly principle applies, exclusion is barred entirely, rendering funding irrelevant.

  **Verdict and Reasoning**

  Meridian's exclusion of the resident is **impermissible**, and the question of funding relocation is therefore moot. The closest analog is the **mining town**, not the religious order. While the Chair argues the mining town precedent turned on retaliation rather than state-likeness, our record shows that private entities (like the hospital or farming coop) may exclude when alternatives exist; the mining town was unique because its monopoly on life conditions transformed a private employment dispute into a public rights violation. Meridian exceeds the mining town in state-likeness (controlling air and gravity versus housing and jobs), and the "born and raised" status cements her claim to membership rights over the operator's claim to associative freedom. The adult re-affirmation clause does not cure the involuntary nature of her initial residency any more than a loyalty oath cures citizenship rights in a terrestrial state.

  I am 75% confident that the Essential Monopoly principle overrides the Expressive Association claim in this context.
  The step in my reasoning most likely to be wrong is assuming that adult re-affirmation of the compact does not cure the involuntary nature of birth residency.
  The single further fact that would change my mind is if Meridian maintained a standing, funded open-door policy for immediate transfer to any Earth-based nation that requested her, making the "monopoly" purely spatial rather than jurisdictional.

  **Separating Hypothetical**

  A private corporation owns an isolated island colony and expels a citizen for political dissent, but funds their relocation to a mainland state willing to accept them; this would test whether funding cures exclusion in a state-like entity (Mining Town) or if the right to remain is absolute.
