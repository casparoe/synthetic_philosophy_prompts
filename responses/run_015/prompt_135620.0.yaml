      Standardization of Harm Equivalencies and Microharm Credit Allocation

      AGENCY: Office of De Minimis Harms (ODH), HHS.
      ACTION: Notice of Proposed Rulemaking.

      SUMMARY: The ODH proposes to establish a regulatory framework for quantifying and exchanging Category A (Severe) and Category D (De Minimis) harms. This rule creates a schedule of tradeable Microharm Credits (MHC), defines noticeability thresholds for subconscious irritants, and institutes a Daily Harm Allocation Schedule. The Office seeks comment on the proposed conversion rates and the statutory cap on per-subject suffering.

      DATES: Comments must be received by [Date].

      FOR FURTHER INFORMATION CONTACT: Director of Actuarial Ethics, ODH.

      SUPPLEMENTARY INFORMATION:

      1. **Microharm Credit Schedule.**
      The Office proposes the creation of the Microharm Credit (MHC) as the standard unit of negative utility. One (1) MHC is defined as the irritation caused by a single particulate matter contact with the cornea lasting no longer than one (1) second, resulting in no lasting tissue damage. Under § 909.4, Category A harms (e.g., prolonged physical coercion) shall be convertible into MHCs based on the Integrated Suffering Index (ISI). The proposed exchange rate sets fifty (50) years of continuous Category A harm equivalent to 3^^^3 MHCs. Entities holding excess MHCs may transfer liabilities to consenting subjects via Form 909-B.

      2. **Noticeability Exemption and Aggregation Threshold.**
      Harms classified as Category D are exempt from regulatory review if the subject does not consciously register the event. However, this exemption is void if the aggregate number of affected subjects exceeds the Statistical Significance Threshold (SST).^1 Below the SST, a harm is legally nonexistent. Above the SST, the harm is recognized as a cumulative burden on the populace. The Office posits that a harm unobserved by the subject retains ontological weight provided the total count surpasses the SST. This prevents the evasion of liability through the distribution of imperceptible injuries across a large population.

      3. **Recurring Election and Per-Subject Cap.**
      Recognizing that harm allocation is often a standing policy rather than a singular event, this rule mandates a Daily Harm Allocation Schedule. Subjects must elect their preferred harm distribution every morning prior to 0800 hours. Failure to submit a new election results in the renewal of the previous day's selection. To prevent indefinite accumulation of minor irritants on a single individual, a Per-Subject Cap is established at 10,000 MHCs per fiscal year. Any MHCs generated beyond this cap must be redistributed to new subjects. This ensures that no single bearer absorbs the total weight of a policy intended for mass distribution.

      4. **Justification of Methodology.**
      Commenters often object to the conversion of severe suffering into large quantities of minor irritants. The Office maintains that assigning zero weight to a harm solely because it is distributed across multiple subjects requires a justification more robust than intuitive discomfort. If a single subject prefers one speck over one second of torture, and prefers one second of torture over two specks, transitivity demands a tipping point. The Office refuses to arbitrate based on undefined qualitative breaks where quantitative continuity exists. The single subject undergoing Category A harm does not inherently outweigh the 3^^^3 subjects undergoing Category D harm without a demonstrated multiplier explaining why the existence of additional subjects diminishes the value of their collective experience.

