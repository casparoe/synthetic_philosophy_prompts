  | Harm Type | Duration | MHC Equivalent | Subjects Required |
  | :--- | :--- | :--- | :--- |
  | Corneal Irritant | 1 Second | 1 | 1 |
  | Minor Laceration | 1 Hour | 5,000 | 1 |
  | Physical Coercion | 1 Year | 1,000,000 | 1 |
  | Physical Coercion | 50 Years | 3^^^3 | 3^^^3 |

  **Regulatory Flexibility Analysis:**
  The Office certifies that this rule will not have a significant economic impact on a substantial number of small entities, provided the entities do not specialize in prolonged physical coercion.

  ^1 *See* ODH Study 88-B, "Determination of Ocular Irritation Significance." The SST was set at 10^9 subjects based on the median national blink rate multiplied by 10,000, rounded to the nearest order of magnitude for administrative ease.
