prompt: |-
  So I've been going back and forth on Dennett's Orwellian vs Stalinesque move for color phi and I need someone to pin me down with actual numbers tbh.

  Quick setup so we're on the same page: you flash a red dot then a green dot a bit to the side, and people swear they saw a moving dot that started red and flipped to green halfway across. Dennett's whole point as I remember it is that asking did you really experience red-then-rewrite-it versus did your brain just construct green-from-the-start is a confused question, like there is no determinate millisecond where the conscious green-ness happened.

  Here is the wierd variant I can't stop thinking about: say you do it in VR with eye tracking, and the subject has to squeeze a trigger the instant they notice green, and on half the trials you sneak in a super brief system freeze, like 40ms of black, right in between the two flashes, after the brain should have already gotten the second flash info but before the subject reports anything. Intuitively it feels like that freeze should let us seperate the two stories, but Dennett would probably say nope, still no fact to find.

  What is your credence that Dennett is right here, meaning there really is no fact of the matter about the exact timing of when green was experienced, not just that our current tools are too crude to see it? I want a single number, plus a breakdown into like three or four sub-credences that multiply/add up to it — e.g. how likely is it that talk of timing of experience even picks out something physical, how likely is it that a future ideal neuroscience could still leave both stories fitting all data, whatever else you think matters — with a rough number for each and how they combine. And tell me which piece your final number is most sensitive to and what hypothetical result from my VR freeze setup would move you the most.
