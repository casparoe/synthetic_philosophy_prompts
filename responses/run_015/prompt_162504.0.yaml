  Let's argue that **Projectibility** is the goal, but **APC Identification** is the constraint that makes Projectibility impossible to verify. I will select **Projectibility** as the definition of "Kind," but note that **APC** is the reason it fails. Actually, the prompt asks for the requirement that eliminates candidates. **Projectibility** eliminates the Administrative view. **APC** eliminates the Causal view (mostly).
  Let's go with **Causal Isolation (APC)** as the hardest constraint. No, **Projectibility** is the *definition* of a kind. If it doesn't project, it's not a kind. I will highlight **Projectibility** as the primary desideratum, but note that **APC** is the reason it's rarely met.
