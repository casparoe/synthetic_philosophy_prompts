      *   **Goal:** The user wants a specification of *desiderata* for a theory of generational cohorts. They want to know what a theory *must* deliver for these labels to name real kinds (licensing explanatory/predictive claims) versus convenient slices.
      *   **Input:** A provisional list of 12 considerations/problems (Adjacency, APC tangle, Permanence, Reference, Birth vs. Exposure, Projectibility, Sieve, Composition, Co-presence, Scope, Imposed vs. Owned, Cyclical).
      *   **Tasks:**
          1.  Sort/Refine the 12 points into genuine requirements vs. prejudices.
          2.  Mark which are non-negotiable (for "real kinds") vs. negotiable.
          3.  Identify jointly unsatisfiable subsets (tensions/trade-offs).
          4.  Identify the single requirement that does the most work (the "killer criterion").
          5.  Score three candidate accounts (Administrative/Journalistic, Causal-Exposure, Cyclical Archetype) against the criteria.
          6.  Format: Table welcome, weight on criteria.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core issue is *Natural Kindhood* vs. *Social Construction* vs. *Statistical Artifact*.
      *   To claim "Boomer" is a *real kind* (like "Gold" or "Tiger"), it needs causal powers, boundaries, and projectibility.
      *   To claim it's a *convenient slice* (like "Tall People" or "Q3 Sales"), it's just a grouping for analysis without deep ontological status.
      *   The publisher/critic wants the former (explanatory power). The novelist suspects the latter.
      *   The prompt asks for the *specification* of what it would take to be the former.

  3.  **Evaluate the 12 Provisional Points:**
      *   (1) Adjacency: Crucial. Real kinds usually don't have arbitrary boundaries (Sorites paradox).
      *   (2) APC Tangle: Crucial. This is the methodological killer. If you can't separate Age, Period, and Cohort, you can't claim Cohort effects.
      *   (3) Permanence: Important. If the trait disappears, was it the cohort or the life stage?
      *   (4) Reference: Philosophical nuance. Less critical for *explanatory* power, more for semantics.
      *   (5) Birth vs. Exposure: Crucial. Is it biology/calendar or socialization?
      *   (6) Projectibility: *The* definition of a natural kind. Can you predict unobserved traits?
      *   (7) Sieve: Related to Adjacency. Arbitrariness problem.
      *   (8) Composition: Crucial. Confounding variables. Is it the cohort or the economy?
      *   (9) Co-presence: Ontological issue. Kinds usually don't depend on other kinds existing simultaneously in the same way.
      *   (10) Scope: External validity. Real kinds usually travel (though social kinds might not).
      *   (11) Imposed vs. Owned: Social kind requirement. Natural kinds don't care if you believe in them.
      *   (12) Cyclical: Specific theory constraint. Not a general desideratum for *kindhood*.

  4.  **Drafting the Desiderata (Sorting & Refining):**
      *   I need to group these into logical categories: *Identity Conditions*, *Causal Power*, *Methodological Integrity*, *Ontological Status*.
