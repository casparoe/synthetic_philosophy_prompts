      *   *Negotiable/Contextual:* Scope (social kinds can be local), Self-ascription (some real social kinds are imposed), Cyclical (specific theory, not general).

  5.  **Identifying Tensions (The "Impossible Trinity"):**
      *   The user suspects Sharp Boundaries + Adjacency Indistinguishability + Identifiability cannot coexist.
      *   I need to formalize this. The "APC Identification Problem" is the big one. You literally cannot mathematically separate Age, Period, and Cohort without arbitrary constraints.
      *   Another tension: *Permanence* vs. *Life-Cycle Effects*. If the trait changes with age, it's not a cohort trait. If it stays, it contradicts plasticity.
      *   Another tension: *Causal Mechanism* vs. *Arbitrary Boundaries*. If socialization is the cause, boundaries should be fuzzy. If boundaries are sharp, the cause is mysterious.

  6.  **Identifying the "Killer Criterion":**
      *   It has to be **Projectibility (6)** supported by **APC Identification (2)**.
