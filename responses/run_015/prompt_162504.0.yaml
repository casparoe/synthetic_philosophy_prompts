      *   Let's choose **Projectibility based on Causal Mechanism (Exposure)**. Without a mechanism that distinguishes cohort from age/period, projectibility is illusory.
      *   Wait, the prompt asks for the *single requirement* that eliminates candidates. That is likely **The APC Identification Constraint (2)**. If you can't solve this, you can't claim explanatory power.
      *   *Correction:* The prompt asks what makes them *real kinds*. Projectibility is the *test*, but APC is the *barrier*. Let's frame the killer criterion as **Causal Isolation (APC)**. If you can't isolate the variable, you can't claim the kind exists independently of the timeline.

  7.  **Scoring the Three Accounts:**
      *   *Administrative/Journalistic:* Fails Projectibility, Fails APC (doesn't try), Passes Sieve (admits arbitrariness).
      *   *Causal-Exposure:* Tries for Projectibility, Fails APC (methodologically impossible to fully separate), Fails Adjacency (boundaries are fuzzy).
      *   *Cyclical:* Fails Empirical grounding, Passes Internal consistency, Fails Scope.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the stakes (novelistic truth vs. marketing utility).
