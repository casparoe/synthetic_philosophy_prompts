  Here's a thinking process that leads to the suggested desiderata for the dissertation chapter:

  1.  **Analyze the Request:**
      *   **Topic:** Evaluation chapter of a dissertation on moral aggregation (specifically rescue priority).
      *   **Core Constraint:** Treat Taurek's rejection of pure numerical aggregation as a *constraint to be respected*, not an intuition to be dissolved. (This is crucial: the framework must accommodate anti-aggregationism, not just refute it).
      *   **Goal:** Write a list of desiderata (criteria) that any adequate theory must meet.
      *   **Required Coverage:**
          1.  *Cases:* Standard pairwise (1 vs. 5), Unequal-cost (proximity/effort), Distributed Moral Proximity (network/graded relations).
          2.  *Distinctions:* Moral status vs. Duty object, Ex ante vs. Ex post, Causal efficacy vs. Moral reason.
          3.  *Consistency:* Moral psychology (named victim vs. statistical), Decision theory constraints.
          4.  *Tensions/Unsatisfiability:* Anti-aggregation vs. Network consistency, flagging jointly unsatisfiable subsets.
      *   **Formatting/Style:** Mark Non-negotiable vs. Camp-specific. Separate Settled vs. Contested. Avoid presenting contested anti-aggregation interpretations as consensus. Brief note on Utilitarian/Contractualist/Relational approaches.
      *   **Tone:** Academic, precise, dissertation-level framing.

  2.  **Deconstruct the Core Constraint (Taurek):**
      *   Taurek argues that numbers don't count in themselves. Saving five isn't inherently better than saving one because the "five" don't suffer a collective loss greater than the "one's" loss. Each individual has a claim to be saved.
      *   *Implication for Desiderata:* The criteria cannot simply demand "Maximize lives saved." They must allow for a theory that says "Flip a coin" or "Prioritize based on non-numerical factors" without labeling it irrational or immoral *a priori*.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Case Coverage*
          *   *Standard Pairwise:* Need to capture the intuition that 1 vs. 5 isn't trivial. *Settled:* Most agree there's a tension here. *Non-negotiable:* Must offer a determinate action guide (even if it's "flip a coin").
          *   *Unequal Cost:* Taurek admits cost matters. If saving 5 costs *everything* and saving 1 costs *nothing*, maybe cost tips the scale. *Desideratum:* Sensitivity to marginal cost/effort without smuggling in aggregation.
          *   *Distributed Moral Proximity:* This is the user's specific contribution/angle. Moving beyond 1 vs. 5 to networks. *Contested:* Does this undermine the binary? *Desideratum:* Must handle graded obligations without collapsing back into "count the connections."

      *   *Category 2: Conceptual Distinctions*
          *   *Status vs. Duty:* Everyone has equal status, but duties vary based on relationship. *Non-negotiable:* Must not deny equal status to the minority.
          *   *Ex Ante vs. Ex Post:* Taurek is often about the ex ante chance (fairness). Utilitarians care about ex post (lives saved). *Desideratum:* Must clarify which perspective drives the justification.
          *   *Causal vs. Moral:* Just because I *can* save 5 doesn't mean I *must*. *Desideratum:* Distinguish capacity from obligation.

      *   *Category 3: Consistency (Psych & Decision Theory)*
          *   *Psychology:* Identifiable Victim Effect. *Settled:* People behave this way. *Desideratum:* Theory shouldn't pathologize this entirely if it aligns with anti-aggregation.
          *   *Decision Theory:* Dominance, Transitivity. *Non-negotiable:* Can't violate basic logic. *Contested:* Does Expected Utility Theory apply to moral choices?

      *   *Category 4: Tensions/Unsatisfiability*
          *   *The Big Conflict:* Anti-aggregation (Taurek) + Network Consistency. If I have special duties to my "network," does that just become aggregation by another name?
          *   *Flag:* It might be impossible to satisfy Anti-Aggregation + Universalizability + Network Sensitivity simultaneously.

  4.  **Refining and Classifying (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* Logical consistency, acknowledging the phenomenology of the dilemma, equal moral status.
      *   *Camp-Specific:* Determinism (must there always be a single right answer?), Universalizability (must the rule apply to everyone equally?), Relational Priority (do special relationships override impartiality?).

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* The Pond Case creates a dilemma. People react differently to named vs. statistical victims.
      *   *Contested:* Whether "Distributed Moral Proximity" solves or worsens the problem. Whether Ex Post evaluation is valid for duty.

  6.  **Drafting the Content (incorporating the constraints):**
      *   *Introduction:* Set the stage. Acknowledge Taurek not as a skeptic to be defeated but as a boundary condition.
      *   *Section 1: Phenomenological Adequacy (The Cases).*
      *   *Section 2: Conceptual Clarity (The Distinctions).*
      *   *Section 3: External Consistency (Psych/Decision Theory).*
      *   *Section 4: Internal Coherence (Tensions).*
      *   *Brief Comparison:* Utilitarian (fails 1), Contractualist (struggles with 4), Relational (fits 1 & 4 but struggles with 3).

  7.  **Review against Constraints:**
      *   *Did I treat Taurek as a constraint?* Yes, the criteria demand room for non-aggregation.
      *   *Did I cover Distributed Moral Proximity?* Yes, included as a specific desideratum.
      *   *Did I flag unsatisfiable subsets?* Yes, in Section 4.
      *   *Did I distinguish Settled vs. Contested?* Yes, explicitly marked.
      *   *Did I avoid scoring theories too heavily?* Yes, kept focus on criteria, added brief note at end.

  8.  **Final Polish:** Check tone. Ensure it sounds like a dissertation chapter framework (formal, precise, structured). Ensure the distinction between "Non-negotiable" and "Camp-specific" is clear in every section. (Self-Correction: Make sure the "Distributed Moral Proximity" point doesn't accidentally assume aggregation is the only way to solve it. It needs to be about *how* the theory handles the complexity).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Chapter Framework: Adequacy Conditions for Non-Aggregative Rescue Theories

  ## Introduction: Framing the Evaluative Space
  This chapter establishes the desiderata for evaluating theories of rescue priority in life-saving conflicts. The evaluative framework proceeds from a specific methodological constraint: **Taurek's rejection of pure numerical aggregation is treated as a boundary condition to be accommodated, not an error to be corrected.** Consequently, an adequate theory is not one that successfully proves the many *must* be saved, but one that coherently explains when and why numbers might (or might not) tip the balance without violating the separateness of persons.

  The following desiderata are divided into four categories: Phenomenological Adequacy (cases), Conceptual Clarity (distinctions), External Consistency (empirical and formal constraints), and Internal Coherence (tensions). Each desideratum is marked as either **Non-Negotiable** (required for logical coherence and basic moral plausibility) or **Camp-Specific** (reflecting commitments particular to deontological, contractualist, or relational frameworks).

  ---

  ## 1. Phenomenological Adequacy: Case Coverage
  *An adequate theory must provide action-guidance or justificatory clarity for the following structural variations of the rescue problem.*

  ### 1.1 The Standard Pairwise Constraint
  **Desideratum:** The theory must yield a determinate stance on the standard "Pond Case" (one child vs. five strangers in separate ponds) that does not rely on the premise that five deaths constitute a metaphysically greater loss than one death.
  *   **Motivating Case:** Taurek's original formulation. The intuition is that the single individual has a claim not to be sacrificed merely to satisfy the claims of the five.
  *   **Status:** **Settled.** Even aggregationists acknowledge this intuition creates a burden of proof; anti-aggregationists view it as a hard constraint.
  *   **Classification:** **Non-Negotiable.** A theory that dismisses the single individual's claim as morally negligible by default fails the separateness of persons test.
  *   **Classification:** **Camp-Specific.** Whether the theory mandates a coin flip (strict Taurekian), permits saving the many (moderate aggregation), or requires saving the one (special obligation) is variable. The non-negotiable element is that the *justification* cannot be "5 > 1" in a summative sense.

  ### 1.2 The Unequal-Cost Sensitivity
  **Desideratum:** The theory must distinguish between numerical superiority and cost-differential superiority. It must explain why saving the many might become obligatory if the cost to the rescuer (or the one) shifts significantly, without collapsing into cost-benefit analysis.
  *   **Motivating Case:** Variants where saving the five requires abandoning the one who is already grasped, or where saving the one is costless but saving the five requires extreme risk.
  *   **Status:** **Settled.** Most agree that cost matters; Taurek himself admits we are not obliged to save the one if the cost is too high.
  *   **Classification:** **Non-Negotiable.** A theory that ignores cost is implausible.
  *   **Classification:** **Camp-Specific.** The threshold at which cost overrides the anti-aggregation constraint varies by framework (e.g., contractualist "reasonable rejection" vs. utilitarian marginal utility).

  ### 1.3 Distributed Moral Proximity
  **Desideratum:** The theory must accommodate graded relational structures where the binary framing (1 vs. 5) dissolves into a network of varying causal and social density. It must specify whether moral proximity functions as a tie-breaker or a trump.
  *   **Motivating Case:** A rescuer embedded in a social network where the "one" is a neighbor and the "five" are distant strangers, but the "five" are connected to the rescuer's close associates. The binary collapses into a web of partial obligations.
  *   **Status:** **Contested.** It is disputed whether this complexity undermines the binary framing or merely complicates the input data for the same binary choice.
  *   **Classification:** **Camp-Specific.** Relational ethics treat this as **Non-Negotiable** (proximity determines duty). Impartialist theories treat this as **Camp-Specific** (proximity is epistemically useful but morally irrelevant).
  *   **Requirement:** The theory must not treat network density as a covert form of aggregation (i.e., counting "relationship units" to equalize the numbers).

  ---

  ## 2. Conceptual Clarity: Required Distinctions
  *An adequate theory must maintain specific conceptual boundaries to avoid category errors.*

  ### 2.1 Status vs. Duty Object
  **Desideratum:** The theory must distinguish between having equal moral status (the right to be considered) and being the object of a particular duty (the obligation to be saved).
  *   **Motivating Consideration:** Anti-aggregationism relies on equal status. However, equal status does not entail equal duty of rescue in all contexts (e.g., parental duties).
  *   **Status:** **Settled.** Standard distinction in normative ethics.
  *   **Classification:** **Non-Negotiable.** Failing this leads to the absurdity that we owe identical duties to our children and strangers.

  ### 2.2 Ex Ante Decision Rules vs. Ex Post Evaluation
  **Desideratum:** The theory must specify whether its justification rests on the fairness of the decision procedure (ex ante) or the value of the outcome (ex post). It cannot equivocate between the two when challenged.
  *   **Motivating Consideration:** Taurek's argument is largely ex ante (giving each an equal chance). Utilitarianism is ex post (maximizing survivors). Confusing these leads to "resultant luck" justifications for aggregation.
  *   **Status:** **Contested.** Whether ex post evaluation can be cleanly separated from ex ante duty is a major point of contention in moral luck literature.
  *   **Classification:** **Non-Negotiable.** The theory must be consistent in its temporal perspective.
  *   **Classification:** **Camp-Specific.** Contractualists typically prioritize ex ante; Consequentialists prioritize ex post.

  ### 2.3 Causal Efficacy vs. Moral Reason
  **Desideratum:** The theory must distinguish between the capacity to affect more lives (causal efficacy) and the moral reason that justifies using that capacity.
  *   **Motivating Consideration:** Just because a rescuer *can* save five does not mean the *reason* to do so is the number five. The reason might be minimizing rights violations, which may not aggregate.
  *   **Status:** **Settled.** Is/Ought distinction.
  *   **Classification:** **Non-Negotiable.** A theory that derives "ought" directly from "can save more" without intermediate normative premises is naturalistically fallacious.

  ---

  ## 3. External Consistency: Empirical and Formal Constraints
  *An adequate theory must not contradict settled empirical findings or formal decision rules without significant justificatory cost.*

  ### 3.1 Moral Psychology Alignment (Identifiable Victim Effect)
  **Desideratum:** The theory must account for the empirical finding that agents reject aggregation in concrete named-victim cases but accept it in abstract statistical framing, without dismissing this variance as mere bias.
  *   **Motivating Consideration:** Psychological research shows framing effects alter moral judgment. A theory that demands we ignore the "named victim" intuition entirely loses phenomenological grip.
  *   **Status:** **Settled.** The psychological effect is empirically robust.
  *   **Classification:** **Camp-Specific.** Rationalist theories view this as a bias to be corrected (**Camp-Specific**). Relational theories view this as data to be incorporated (**Non-Negotiable** for relational accounts).
  *   **Requirement:** The theory must explain *why* the framing shifts the moral landscape, rather than simply demanding agents override the intuition.

  ### 3.2 Decision-Theoretic Coherence
  **Desideratum:** The theory must not violate basic axioms of rational choice (e.g., Transitivity, Dominance) unless it explicitly argues that moral choice operates outside rational choice theory.
  *   **Motivating Consideration:** If a theory implies A > B, B > C, but C > A in rescue scenarios, it creates action-guidance paralysis.
  *   **Status:** **Settled.** Logical consistency is required for action-guidance.
  *   **Classification:** **Non-Negotiable.** Contradicting logic without explicit meta-ethical justification renders the theory unusable.
  *   **Requirement:** If the theory advocates randomization (coin flips), it must show this is compatible with rational agency, not a surrender of it.

  ---

  ## 4. Internal Coherence: Tensions and Joint Unsatisfiability
  *This section flags potential impossibility results. An adequate theory must acknowledge where it cannot satisfy all competing demands.*

  ### 4.1 The Network-Aggregation Tension
  **Desideratum:** The theory must address whether respecting anti-aggregation in direct rescue is compatible with requiring consistency across network-structured obligations.
  *   **Motivating Consideration:** If I have special duties to my "network" (Distributed Moral Proximity), and my network is larger than yours, do I effectively have a duty to save "more people" (my network) than you do (yours)? This risks reintroducing aggregation through the back door of relational density.
  *   **Status:** **Contested.** It is unclear whether distributed proximity undermines the binary framing or merely complicates it.
  *   **Classification:** **Jointly Unsatisfiable Subset.** It may be impossible to simultaneously satisfy:
      1.  Strict Anti-Aggregation (numbers never count).
      2.  Relational Priority (special duties to network).
      3.  Universalizability (the rule applies equally to all agents).
      *   *Reasoning:* If relational density creates priority, and networks vary in size, then network size (a number) determines priority. This violates (1). If (1) is held, (2) must be severely limited, violating common moral intuitions about special duties.

  ### 4.2 The Determinism vs. Fairness Tension
  **Desideratum:** The theory must declare whether it requires a deterministic answer (always save X) or permits indeterminacy (flip a coin).
  *   **Motivating Consideration:** Demanding a deterministic answer in 1-vs-5 cases often forces aggregation. Permitting indeterminacy respects anti-aggregation but frustrates the desire for moral clarity.
  *   **Status:** **Contested.** Whether ex post evaluation can be cleanly separated from ex ante duty influences this.
  *   **Classification:** **Camp-Specific.**
      *   **Non-Negotiable:** The theory must not claim to be deterministic while relying on randomization procedures.
      *   **Camp-Specific:** Utilitarianism demands Determinism. Taurekian/Contractualist views often permit Indeterminacy.

  ---

  ## Brief Comparative Note on Existing Approaches

  *   **Utilitarian/Consequentialist:** Fails Desideratum 1.1 (Non-Negotiable) by definition, as it treats the constraint as an intuition to be dissolved. It satisfies 3.2 (Decision Theory) well but struggles with 3.1 (Moral Psychology) by labeling the identifiable victim effect a bias.
  *   **Contractualist (e.g., Scanlon):** Strong on 2.1 (Status vs. Duty) and 1.1. However, it faces significant tension in 4.1 (Network-Aggregation), as "reasonable rejection" criteria can become difficult to apply in distributed network cases without implicitly counting the strength of complaints.
  *   **Relational/Partialist:** Best fits 1.3 (Distributed Moral Proximity) and 3.1. However, it risks violating 3.2 (Decision-Theoretic Coherence) if relational weights are not transitive, and it struggles with 4.1 (Joint Unsatisfiability) regarding universalizability.

  ## Summary of Settled vs. Contested Ground

  | Feature | Status | Consensus View |
  | :--- | :--- | :--- |
  | **Pond Case Intuition** | **Settled** | Widely shared even among aggregationists that there is a *prima facie* tension here. |
  | **Moral Status Equality** | **Settled** | All parties agree the one and the five have equal moral worth. |
  | **Distributed Proximity** | **Contested** | Disagreement on whether this undermines binary framing or is just complex input. |
  | **Ex Post Evaluation** | **Contested** | Disagreement on whether outcomes can justify duties independent of procedure. |
  | **Anti-Aggregation Validity** | **Contested** | **Crucial:** Do not present Taurek's conclusion as the consensus. It is a respected minority position used here as a constraint. |

  ---

  ### Instruction for Use in Dissertation
  When applying these desiderata in subsequent sections, do not penalize a theory solely for failing a **Camp-Specific** desideratum unless you have argued for that specific camp's premises. However, any theory failing a **Non-Negotiable** desideratum (particularly Logical Coherence and Status Equality) should be considered critically deficient. The goal of this chapter is not to prove Taurek right, but to ensure that any theory claiming to solve the aggregation problem does not do so by ignoring the phenomenological and logical constraints that make the problem difficult in the first place.
