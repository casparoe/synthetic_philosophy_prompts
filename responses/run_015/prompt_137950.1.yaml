answer: |-
  Your hypothesis is correct, but it underestimates the entanglement. You are not suffering from three distinct disagreements sharing a name; you are suffering from a single conceptual knot that presents as three different faults depending on which strand you pull. The reason you cannot agree on a one-page statement of the opposing view is not merely stubbornness or verbal quibbling. It is because each camp treats the *structure of the decision problem* as fixed, while the other camp treats that structure as *endogenous to the decision itself*.

  Here is the diagnosis of the fault lines, engaged with your specific cases, followed by a verdict on progress.

  ### 1. The Teleological Fault: Norm vs. Specification
  **Diagnosis:** Two questions sharing one label.
  **Status:** Verbal/Conceptual.

  This is where your machine-learning colleague is standing apart from the philosophers and the economist. The philosophers are asking a *justificatory* question: "Given that I am this agent, in this situation, with these beliefs, what does rationality require?" The ML researcher is asking a *design* question: "What input-output mapping, if instantiated, yields the highest utility across a distribution of environments?"

  In a small world (Newcomb, Twin PD), these questions converge. The agent is fixed, the situation is fixed, and the optimal policy is clear. In a large world, they diverge violently.
  *   **The Evidentialist** is trying to answer the justificatory question using design tools (posteriors, expectations). They say, "I must act *as if* I am optimizing the policy," because that is what rationality demands given the evidence.
  *   **The Critic** sees that in a large world, the justificatory question is ill-posed because the "situation" includes the agent's own decision procedure as a variable.
  *   **The ML Researcher** correctly identifies that the justificatory question is a distraction. If the "rational" act leads to lower scores than the "irrational" policy, the theory is a bad specification.

  **Why you can't agree on the statement:** The philosophers' statement assumes the agent is a *locus of evaluation*. The ML person's statement assumes the agent is a *locus of optimization*. You cannot translate "rationality" between these frames without loss. The ML person sees the philosophers' debate as debugging a compiler that refuses to admit it's running on hardware.

  ### 2. The Ontological Fault: Parameter vs. Fixed Point
  **Diagnosis:** Substantive, but turns on standards of evidence.
  **Status:** The core of the Preacher's and Bookie's Loops.

  This is the heart of your "Large World" problem. The Evidentialist treats the correlation between your action and the other's action as an **empirical parameter** ($\rho$) to be estimated from data. The Critic treats it as a **logical constraint** determined by the joint structure of the policies.

  *   **The Preacher's Loop:** Here, the data (14/20 cooperated) is generated by agents who share your *theory*.
      *   *Evidentialist:* "I observe $\rho \approx 0.7$. I condition on Cooperate. Expected utility favors Cooperation."
      *   *Critic:* "The $\rho$ you observed exists *because* those agents reasoned as you do. If your reasoning leads to Defection, the $\rho$ for your current decision is not 0.7; it is undefined or zero. You are using the correlation to justify the action that sustains the correlation."
      *   *Diagnosis:* This is a **fixed-point problem masquerading as estimation**. The Evidentialist assumes the parameter is stable under intervention (your deliberation). The Critic knows the parameter is a function of your deliberation. In a large world, you cannot estimate a function using data points generated by the function itself without a model of the function. EDT lacks that model; it only has the data.

  *   **The Bookie's Loop:** Here, an adversary targets the correlation.
      *   *Evidentialist:* "I must condition on my action. If I cooperate, the Bookie predicts it."
      *   *Critic:* "The Bookie predicts it *because* you are an Evidentialist. If you were a Causalist, the Bookie would adjust. Your decision theory is part of the environment's state."
      *   *Diagnosis:* This reveals that in a large world, **correlations are strategic**. The Evidentialist treats the correlation as "Nature." The Critic treats it as "Opponent." If the correlation is strategic, EDT is vulnerable to money-pumps (Newcomb problems with malicious predictors). The Evidentialist cannot solve this without smuggling in causal assumptions (e.g., "I assume the Bookie cannot read my mind *after* I decide"), which collapses EDT back into CDT or Functional Decision Theory.

  **Why you can't agree on the statement:** The Evidentialist's statement must assume the correlation is exogenous to be coherent. The Critic's statement must assume it is endogenous to be accurate. You are writing in different ontologies.

  ### 3. The Methodological Fault: Partitioning and the Regress
  **Diagnosis:** Verbal, but with substantive consequences.
  **Status:** The Signalling Regress.

  The Evidentialist saves the theory by refining the state space. The Causalist saves the theory by coarsening it.
  *   **Evidentialist:** "I condition on *everything* relevant, including my type, my signals, and my history."
  *   **Causalist:** "You cannot condition on your own type without making the decision vacuous. You must intervene on the act."

  **The Signalling Regress:**
  *   *Stage 0:* Pay cost to signal "Cooperator."
  *   *Stage 1:* Play PD.
  *   *Evidentialist:* "I choose Stage 0 based on the evidential value of being a Signaller."
  *   *Critic:* "But why did you choose that rule at Stage 0? Was there a Stage -1 where you decided to be the kind of agent who evaluates Stage 0 evidentially?"
  *   *Diagnosis:* This is the **dissolution of the Act**. If every act can be preceded by a signalling stage, and every signalling stage is evaluated evidentially, the "decision" retreats infinitely into the past (or into the design phase). The Evidentialist stops the regress by fiat ("Here is where I am now"). The Critic says that fiat is arbitrary.
  *   *Verbal Aspect:* This is about the **granularity of the State**. The Evidentialist includes the "decision to be this kind of agent" in the state description. The Causalist insists that is the *source* of the action, not part of the state.

  **Why you can't agree on the statement:** The Evidentialist's statement requires a "cut point" where deliberation begins. The Critic denies such a cut point exists in a large world where your deliberation is observable/predictable.

  ### A Cleaner Separating Case: The Calibration Tax

  To separate these camps without relying on Newcomb or standard PD, use this case. It isolates the "Parameter vs. Fixed Point" fault.

  **The Case:**
  You are placed in a room with a machine. You must press Button A or Button B.
  1.  **Payoff:** If you press A, you get \$10. If you press B, you get \$0.
  2.  **Tax:** Before you press, you must state a probability $p$ that *a randomly selected agent from the population of people currently facing this machine* will press A.
  3.  **Penalty:** You pay a Brier score penalty based on your $p$ and the *actual frequency* of A-pressers in that population.
  4.  **Population:** The population consists of 1,000 agents. 999 are bots programmed to press A. You are the 1,000th.
  5.  **Catch:** The bots are programmed to press A *if and only if* they predict the human will press A. They have access to your stated probability $p$ before they decide.

  **The Separation:**
  *   **The Evidentialist:** "If I press A, the bots press A. The frequency is 100%. If I state $p=1$, my penalty is 0. Total: \$10. If I press B, bots press B. Frequency 0%. If I state $p=0$, penalty 0. Total: \$0. I should Press A and state $p=1$."
  *   **The Critic:** "The bots are not reacting to your *act*; they are reacting to your *statement* $p$. Your act is irrelevant to the correlation. You can Press B and state $p=1$. The bots will press A (frequency 99.9%). You get \$0 + small penalty. Or you Press B and state $p=0$. Bots press B. You get \$0. The act is decoupled from the evidence."
  *   **The ML Person:** "The optimal policy is: State $p=1$, Press B. You get the correlation benefit without the cost. If the machine prevents this (e.g., checks consistency), then the 'act' is the joint selection of (Statement, Button). Optimize the pair."

  **Why this separates them:**
  It forces the Evidentialist to admit that *evidence* (the statement $p$) is distinct from *action* (the button). If they say "I must condition on the Button," they ignore that the bots read the Statement. If they say "I condition on the Statement," they admit the Button is causally inert. It breaks the "Act as Evidence" link that EDT relies on in small worlds.

  ### Verdict on Progress

  You should expect to be exactly here in another eight months. Here is why:

  1.  **No Existence/Uniqueness Result will help:** You asked for a proof that a self-consistent evidentialism exists or is unstable. Even if you had it, the Evidentialist would argue the instability is a feature of the "Large World" (risk), not the theory. The Critic would argue the non-existence proves the theory is broken. The math would be interpreted through the existing fault lines.
  2.  **Simulations will fail:** Your ML friend could simulate the Preacher's Loop. She will find that agents trained to maximize reward converge on a policy that looks like CDT or FDT (Functional Decision Theory), not EDT. The Evidentialists will say, "That is a description of how agents *behave*, not how they *reason*." The teleological split remains.
  3.  **The "Large World" is a Moving Target:** As soon as the Evidentialist refines their reference class to solve the Bookie's Loop, the Critic expands the world to include an adversary who targets that reference class. This is not a bug; it is the definition of a Large World. You cannot enumerate the states, so you cannot prove the theory works for all of them.

  **What would count as progress?**
  Not a verdict, but a **dissolution**.
  Progress would look like the group agreeing that "Evidential Decision Theory in a Large World" is a category error.
  *   **For the Philosophers:** Acknowledge that without a causal model of *how* the correlation arises (Preacher vs. Bookie), the posterior is meaningless. You need a prior over *structures*, not just parameters.
  *   **For the ML Person:** Acknowledge that "policy optimization" does not answer the normative question "was I rational?" which is what the philosophers care about.
  *   **For the Group:** Accept that the "one-page statement" failure is the data. The fact that you cannot describe the opponent's view without them rejecting it means you do not share a **problem space**.

  **Recommendation:**
  Stop trying to solve the Large World PD. Switch the object of study. Spend the next eight months analyzing **The Signalling Regress** exclusively.
  *   Map the regress. Where does it stop?
  *   If it stops at "Source Code," you have agreed on Functional Decision Theory (CDT with policy selection).
  *   If it stops at "Current Act," you have agreed on CDT.
  *   If it never stops, you have agreed that Rationality is undefined in a Large World without external constraints.

  The disagreement is not about the answer. It is about whether the question is well-posed. Your ML friend thinks it is ill-posed (replace with loss minimization). The Causalist thinks it is ill-posed (add causal structure). The Evidentialist thinks it is well-posed but hard. Until you agree on whether the question is well-posed, you will not move a degree.
