answer: |-
  Hey, sounds like a rough night. Arguments about doing good vs. doing well can get pretty heated, especially when you're trying to actually figure out what you believe instead of just repeating talking points. 

  Below is a sorting quiz designed to bypass the jargon. There are no right answers, just patterns. Read the scenarios and pick the option that feels most true to you, even if it's imperfect. 

  ### The "Where Do You Stand?" Sorter

  **1. The Career Crossroads**
  You graduate with two offers. Job A is in high-frequency trading; you'd hate the daily work, but you could donate 60% of your income to top charities. Job B is at a local nonprofit; the work feels meaningful day-to-day, but you'd break even financially and couldn't donate much.
  *   **A.** Take Job A. The money is neutral; the donation impact outweighs the daily grind.
  *   **B.** Take Job B. Direct work builds community resilience in ways cash transfers can't.
  *   **C.** Take Job A, but worry that the culture will slowly make you care less about the people you're trying to help.

  **2. The Budget Gap**
  A local government decides to cut funding for a proven homelessness program to balance their budget. A private donor steps in to cover the exact shortfall so services don't中断 (stop).
  *   **A.** Great. The problem is solved regardless of who writes the check.
  *   **B.** Problematic. This lets elected officials off the hook for responsibilities they should own.
  *   **C.** Mixed. It helps now, but it sets a precedent where public services depend on private whims.

  **3. The Dashboard**
  You're allocating funds between two programs. Program X saves 10 lives per $100k (verified data). Program Y restores dignity and social cohesion in a community (hard to measure, but visitors say it's transformative).
  *   **A.** Fund Program X. You can't manage what you don't measure.
  *   **B.** Fund Program Y. Reducing humans to metrics misses the point of helping them.
  *   **C.** Fund Program X, but acknowledge the data might be missing something crucial about human welfare.

  **4. The Industry Ethics**
  You're considering investing your personal savings. Option A is a fund with high returns that includes some defense contractors. Option B is a "clean" fund with lower returns. You plan to donate all investment gains to charity.
  *   **A.** Invest in A. Higher returns mean more money for good causes eventually.
  *   **B.** Invest in B. Profiting from violence taints the money, even if donated later.
  *   **C.** Invest in A, but refuse to donate to causes related to peacebuilding to avoid hypocrisy.

  **5. The Algorithm**
  An Effective Altruism research org releases a report saying your intuitive desire to help local artists is inefficient compared to buying bednets overseas.
  *   **A.** Switch to bednets. Their models know better than my gut feeling.
  *   **B.** Ignore the report. Local culture matters more than abstract global metrics.
  *   **C.** Feel conflicted. You trust the math, but worry you're outsourcing your moral compass to a spreadsheet.

  **6. The Disaster Relief**
  A hurricane hits a wealthy country. The government has the capacity to respond but is slow. Private donors rush in with cash and supplies immediately.
  *   **A.** Donate immediately. Speed saves lives, bureaucracy kills.
  *   **B.** Hold back. Private aid crowds out the state's obligation to build better infrastructure.
  *   **C.** Donate, but only to groups advocating for better government response times.

  **7. The Policy Shift**
  A billionaire funds a research institute that successfully lobbies for a policy change. The change saves lives but wasn't voted on by the public; it was driven by donor priority.
  *   **A.** Who cares how it happened? Lives were saved.
  *   **B.** This is dangerous. It allows wealth to bypass democratic accountability.
  *   **C.** It's fine as long as the policy is good, but we need stricter laws on donor influence.

  **8. The Dinner Party**
  At a party, someone asks what you do. You explain you work in a lucrative industry you find morally bland solely to fund your donations.
  *   **A.** You explain the logic proudly. Impact is what matters.
  *   **B.** You feel a bit ashamed. You worry you're complicit in the system you're fighting.
  *   **C.** You change the subject. You don't want to justify your life choices to people who won't get it.

  ***

  ### Scoring Key

  Tally up your answers. There's no perfect score, but your pattern points to a specific philosophical camp.

  **Mostly A's: The Straight Defender**
  You're the classic Earning-to-Give proponent. You see money as fungible and metrics as king. You believe the ends justify the means, and you're skeptical of systemic critiques that slow down immediate aid. You think worrying about "clean hands" is a luxury effective altruists can't afford.
  *   *Blind spot:* You might underestimate how much your daily environment shapes your values over time.

  **Mostly B's: The Institutional-Capture Critic**
  You believe private charity often masks state failure. You're worried about the "Substitution Illusion"—where donated dollars just replace tax spending that should've happened anyway. You think relying on billionaires warps public priorities and lets governments off the hook.
  *   *Blind spot:* You might hold out for systemic change while people suffer in the meantime.

  **Mostly C's (with heavy weight on Q3 & Q5): The Measurability-Bias Critic**
  You think the obsession with data is "epistemic outsourcing." You believe relying solely on metrics replaces human judgment about what matters. You're okay with donating, but you think the EA framework ignores fuzzy goods like dignity, solidarity, and local agency.
  *   *Blind spot:* You might struggle to prioritize when resources are truly scarce.

  **Mostly C's (with heavy weight on Q1, Q4 & Q8): The 'Clean Hands' Objector**
  You think moral integrity is non-negotiable. You believe working in harmful or extractive industries rots your moral reasoning, regardless of how much you donate. For you, the *source* of the money matters just as much as the *outcome*.
  *   *Blind spot:* You might prioritize your own purity over actual suffering reduction.

  **The "Unnamable Middle" (Mixed A's and B's, few C's)**
  This is the weird zone logic allows but nobody actually lives in. You believe Earning-to-Give is the most effective path (A), BUT you also believe private donations distort government responsibility (B). You want to make money to give it away, but you worry your giving makes the state lazy. It's a tense position—basically trying to optimize within a system you think is fundamentally broken by your own participation.
  *   *Verdict:* You're probably going to have alot of sleepless nights, but you're seeing the whole board.

  *(Note: If you scored all over the place, you're probably just honest. Philosophy is messy.)*
