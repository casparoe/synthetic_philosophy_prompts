      *   *Good's Theorem Requirement:* The agent maximizes $E[U(outcome) | \text{signal}]$. The option to "ignore" means choosing the action $a^*$ that maximizes $E[U(outcome)]$ regardless of the signal.
      *   *The "Ignore" Option:* In the erosive case, you *cannot* ignore the signal once received. But more importantly, the *act of receiving* changes the payoff structure.
