prompt: |-
  I'm on the review board for a national physics funding agency and we're getting swamped with proposals about multiverse landscapes and string-theory scenarios that basically admit they can't be tested in any lab we'll have in the next fifty years. The applicants keep talking about "non-empirical confirmation" - like mathematical consistency, uniqueness of explanation, or this thing my colleague called "structural underdetermination," where a theory is supposedly supported just because every rival breaks some deeper consistency rule we already accept. I don't fully get it, and I need something reusable that my panel can actually run on these proposals without turning every meeting into a philosphy seminar.

  Can you write me a decision procedure - a checklist or flowchart in words - that takes whatever philosophers of science actually mean by non-empirical confirmation and turns it into steps we can apply? It should go in order, say what counts as a sufficient answer for each question, mark the exact points where the answer should be "reject," and be honest about which steps are just value judgments wearing a procedure costume. The hard cases it has to cover are: theories that predict literally nothing observable in principle, theories that predict things technically observable but practially impossible, and arguments that lean on this "structural underdetermination" idea. Then apply it to two actual-style proposals: one is a multiverse model using landscape statistics and anthropic reasoning to explain our physical constants being life-friendly, but it admits zero direct experimental signature; the other is a string-theoretic framework that claims it's the only 10-dimensional geometry that doesn't collapse into contradiction with quantum gravity results we already trust - what my colleague might call "explanatory anchoring" - but it doesn't constrain any parameter we can actually measure. I have a soft spot for the second one, so I need the procedure to tell me honestly whether I'm just biased.

  Also tell me where this procedure is guaranteed to misfire, what it can't do, and whether there's any way to make it less subjective without just pretending the subjectivity isn't there. Oh, and please don't ask me for citations or a reading list - I won't have time to recieve them and half my panel can't access the journals anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a national physics funding agency review board.
      *   **Problem:** Swamped with proposals on multiverse/string theory landscapes that admit no testability in the foreseeable future (50+ years). Applicants use "non-empirical confirmation" arguments (mathematical consistency, uniqueness, structural underdetermination).
      *   **Need:** A reusable decision procedure (checklist/flowchart in words) to evaluate these proposals without turning meetings into philosophy seminars.
      *   **Requirements:**
          *   Orderly steps.
          *   Define sufficient answers.
          *   Mark explicit "Reject" points.
          *   Be honest about value judgments disguised as procedure.
          *   Handle hard cases: literally unobservable predictions, practically impossible observations, "structural underdetermination" arguments.
          *   Apply to two specific mock proposals (Multiverse/Anthropic vs. String Theory/Uniqueness).
          *   Address the user's bias towards the second proposal.
          *   Explain where the procedure fails/limits.
          *   Discuss reducing subjectivity without pretending it doesn't exist.
          *   **Constraint:** No citations or reading lists (time/access issues).

  2.  **Deconstruct "Non-Empirical Confirmation" (NEC):**
      *   What do philosophers (like Dawid) actually mean?
          *   *No Alternatives Argument (NAA):* Scientists have tried hard to find alternatives and failed.
          *   *Unexpected Explanatory Interconnections (UEI):* The theory solves problems it wasn't designed to solve.
          *   *Meta-Inductive Argument (MIA):* Similar theories in the past turned out to be true.
      *   The prompt mentions "structural underdetermination" (rivals break consistency rules). This aligns with NAA/Consistency.
      *   *The Core Tension:* Science traditionally requires empirical risk. NEC tries to bridge the gap between math beauty and physical truth.
      *   *The Funding Context:* Funding isn't just about "Is this True?" It's about "Is this a good use of public money?" This implies progress, community health, and potential payoff, not just ontological status.

  3.  **Drafting the Decision Procedure (The "NEC Filter"):**
      *   *Goal:* Make it actionable for physicists, not philosophers.
      *   *Structure:* Sequential gates. If you fail a gate, you stop.
      *   *Gate 1: The "In Principle" Test.* Is it *actually* untestable, or just hard?
      *   *Gate 2: The "No Alternatives" Audit.* Have rivals actually been exhausted, or just ignored?
      *   *Gate 3: The "Explanatory Gain" Check.* Does it solve *existing* puzzles, or just move them?
      *   *Gate 4: The "Community Resource" Assessment.* Is this the best use of funds compared to empirical work?
      *   *Honesty Check:* Explicitly label where subjective judgment enters (e.g., defining "sufficient effort" on alternatives).

  4.  **Developing the Steps (Iterative Refinement):**
      *   *Step 1 (Observability):* Distinguish between "never" and "not yet." If "never," high bar.
      *   *Step 2 (Consistency/Uniqueness):* Is the math actually unique, or just the *favorite* model? (Addressing the user's bias).
      *   *Step 3 (Structural Underdetermination):* Do rivals *actually* break consistency, or is the consistency rule itself debatable?
      *   *Step 4 (Resource Allocation):* Even if valid math, does it deserve *physics* funding vs. *math* funding?

  5.  **Applying to the Two Proposals:**
      *   *Proposal A (Multiverse/Anthropic):*
          *   Testability: Admits zero signature. (Fail Step 1?)
          *   Explanation: Explains constants via selection effect. (Tautological risk).
          *   Verdict: Likely Reject based on "In Principle" testability + lack of constraint.
      *   *Proposal B (String Theory/Uniqueness):*
          *   Testability: No measurable parameters.
          *   Consistency: Claims unique 10D geometry avoiding contradiction.
          *   User Bias: User likes this.
          *   Procedure Check: Does it *actually* rule out rivals? Or is it just "the only one we found so far"? This is where the procedure needs to check the "No Alternatives" claim rigorously.
          *   Verdict: Conditional Fund (Math/Phenomenology bridge) or Reject (if purely internal consistency). I need to be honest: if it predicts *nothing* measurable, it's math, not physics. But funding agencies often fund "foundational work." I need to balance the "Physics" definition with "Research Program" viability.

  6.  **Addressing Subjectivity and Limitations:**
      *   Where does it misfire? It can't judge truth, only viability. It can't predict serendipity.
      *   Reducing subjectivity: Calibrate the panel, define "rivals," define "consistency."
      *   Honesty: Acknowledge that "Physics" is a moving target.

  7.  **Refining the Tone:**
      *   Professional, direct, pragmatic.
      *   No jargon without definition.
      *   Respectful of the user's time constraints.
      *   Firm on the "Reject" points.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Step 1 too harsh? If we reject everything untestable in 50 years, we kill LIGO (pre-2015) or Higgs (pre-1960s).
      *   *Fix:* Distinguish between "No *current* tech" vs. "No *possible* tech." The prompt says "in principle" vs "practically impossible." I need to make sure the procedure distinguishes these.
      *   *Critique:* The user wants to know if they are biased on Proposal B.
      *   *Fix:* The procedure must explicitly ask: "Is the consistency rule universally accepted, or specific to this framework?"
      *   *Critique:* No citations.
      *   *Fix:* Keep references general (e.g., "standard model constraints") rather than specific papers.

  9.  **Final Polish:**
      *   Ensure the "Reject" points are bold and clear.
      *   Ensure the "Value Judgment" warnings are visible.
      *   Make sure the application to the two proposals is decisive.

  *(Self-Correction on "Structural Underdetermination"):* The prompt defines this as "a theory is supported just because every rival breaks some deeper consistency rule we already accept." I need to make sure the procedure tests the *validity of the rule* and the *exhaustion of rivals*.

  *(Final Plan):*
  1.  Introduction: Acknowledge the tension.
  2.  The Procedure (The "NEC Viability Protocol").
  3.  Application to Proposal A & B.
  4.  Limitations & Subjectivity Analysis.
  5.  Closing advice.

