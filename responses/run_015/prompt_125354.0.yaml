answer: |-
  This is an exceptionally sharp diagnosis of a famously intractable problem. You have correctly identified that the surface-level technical dispute masks a deeper conceptual impasse. To answer your request directly: your half-formed hypothesis is largely correct, but it requires a slight sharpening regarding the nature of the "formal" question and a significant amplification of the "bedrock disagreement."

  Here is a diagnosis of the stalemate, structured by the layers of disagreement you have identified.

  ### 1. The Formal Layer: Uniqueness vs. Justification
  You suspect a hidden formal question regarding whether the Born weights are the *unique* measure satisfying symmetry and additivity. Mathematically, this ground is already well-trodden. Gleason's theorem (1957) essentially established that if you want a non-contextual probability measure on a Hilbert space of dimension > 2, the Born rule is the only game in town.

  The reason this hasn't ended the debate is that the Everettian derivations (Deutsch-Wallace, Zurek) are not trying to prove a mathematical uniqueness theorem from bare logic. They are trying to derive a *physical* measure from *physical* premises.

  The stalemate here is not about the math; it is about the **physical neutrality of the axioms**.
  *   **The Everettian Claim:** The axioms (e.g., "Diachronic Consistency," "Branching Indifference") are requirements of rationality or symmetries inherent in the quantum formalism itself. They do not presuppose probability; they presuppose only the structure of the wavefunction and the nature of agency.
  *   **The Critic's Counter:** These axioms are not neutral. To assume "Branching Indifference" (that an agent shouldn't care about the mere fact of branching if amplitudes are unchanged) is to implicitly assume that the *number* of branches doesn't matter, which already privileges amplitude over branch-counting.

  So, your intuition about a formal question is correct, but the blockage isn't a lack of uniqueness theorems. It is that every uniqueness theorem requires premises, and the critics argue the premises are "probability in disguise." Progress here would not be a new theorem, but a demonstration that the axioms can be motivated without *any* probabilistic intuition—a task most critics deem impossible.

  ### 2. The Normative Layer: Decision Theory vs. Ontology
  Your first hypothesis—that the strategies answer different questions—is the key to understanding why the participants talk past one another.

  *   **Deutsch-Wallace (DW)** is explicitly **functionalist and normative**. It asks: "Given that branching occurs, how *ought* a rational agent act?" It concludes that rational agents must bet according to the Born rule. It treats probability as a guide to action (credence), not necessarily a description of reality (frequency).
  *   **Zurek/Typicality** strategies often lean **ontic**. They attempt to show that the Born rule falls out of the physical symmetries of entanglement (envariance) or that an observer should expect to find themselves on a "high-weight" branch.

  **The Diagnosis:** The Everettians have largely converged on the DW view: probability in EQM is not about "how many worlds" (ontology) but "how much to care" (decision theory). However, critics like Kent often attack the ontic intuition. They ask, "If all outcomes occur, in what sense is one 'more probable' than another?"

  When an Everettian answers, "In the sense that you should bet on it," the critic hears, "I am changing the subject." The critic wants probability to track *occurrence* (frequency/propensity); the Everettian has redefined probability to track *rational expectation*. This is not a scientific disagreement; it is a semantic and philosophical one about the definition of probability.

  ### 3. The Bedrock Disagreement: What a Theory Owes Us
  This is the core of the stalemate. You suspected a disagreement about what a physical theory owes us. This is precisely it. It is a clash between **Empiricist Instrumentalism** and **Realist Structuralism**.

  *   **The Critic (Kent's view):** A physical theory must explain why we observe *this* data rather than *that* data in a single reality. If a theory posits that *all* data occur, it loses the ability to be confirmed by data. If EQM predicts everything, it predicts nothing. The "derivation" of the Born rule is an attempt to patch this hole, but if the derivation relies on normative assumptions about agents, it makes the confirmation of physics dependent on decision theory. This looks like a category error.
  *   **The Proponent (Wallace's view):** Physics describes the structure of the world. If the structure is a branching wavefunction, then "probability" is not a fundamental physical quantity (like mass or charge) but an emergent concept related to agents within that structure. Just as "temperature" emerges from statistical mechanics, "probability" emerges from branch weights. The theory owes us a demonstration that agents *within* the theory will recover the empirical predictions, not a guarantee that only one outcome happens.

  **Why nothing moves:** Because these are incompatible methodological stances.
  *   If you believe probability *must* be about single-outcome occurrence (frequentism/propensity), EQM is incoherent, and no derivation can save it.
  *   If you believe probability *can* be about rational credence in a deterministic multiverse (Bayesianism/Decision Theory), the derivation is successful, provided you accept the axioms.

  The debate is stuck because neither side can convince the other to adopt their philosophy of probability. No amount of mathematics can bridge the gap between "Probability is frequency" and "Probability is betting odds."

  ### 4. What Would Count as Progress?
  Given this diagnosis, a new representation theorem or a new symmetry argument will not break the deadlock. The math is sufficient for those who accept the premises. Here is what actual progress would look like:

  1.  **A "No-Go" for Alternative Rationalities:**
      Currently, critics argue that branch-counting is a valid alternative strategy. Progress would be a rigorous proof that a branch-counting agent is not just "irrational" by DW standards, but *incoherent* or *unstable* in a branching environment. For example, showing that a branch-counting agent is susceptible to a "Dutch Book" that actually destroys their future branches, not just loses them utility. This would move the argument from "normative preference" to "survival constraint."

  2.  **Decoupling Agency from Physics:**
      A major vulnerability in DW is that it ties the Born rule to the existence of "rational agents." Critics argue physics should hold in a universe without agents. Progress would be a derivation of the Born measure that relies solely on the dynamics of decoherence and information flow, without referencing betting behavior. (Zurek attempts this, but critics claim it smuggles in ignorance assumptions).

  3.  **Empirical Coherence Arguments:**
      Adrian Kent's strongest point is about empirical confirmation. Progress would be a formal account of **self-locating uncertainty** that explains why we should trust our past data in a multiverse. Currently, EQM assumes our data is typical. A progress step would be a theorem showing that *atypical* branches are dynamically unstable or unable to sustain the complex structures required for observation. This would address the "freak observer" problem without relying on decision theory.

  4.  **Conceptual Abandonment:**
      Finally, the most likely form of progress may be a dissolution of the problem. Some philosophers (and physicists) are moving toward the view that the "derivation" project is a mistake. They argue the Born rule should be accepted as a **bridge principle** connecting the wavefunction to experience, much like the metric tensor connects geometry to distance. Acknowledging that the Born rule is a postulate about the *link between physics and mind*, rather than a theorem of physics alone, might lower the temperature by removing the claim of "derivation."

  ### Summary for your Column
  You are right to sense that the dispute is not about the quantum formalism. It is a **philosophical disagreement about the nature of probability**, disguised as a technical dispute about quantum foundations.

  *   **The Formal Question:** It is not about uniqueness (Gleason solved that); it is about whether the axioms required for uniqueness are physically neutral or probabilistically loaded.
  *   **The Normative Question:** Everettians have shifted the goalposts from "probability as frequency" to "probability as rational credence." Critics refuse to play that game.
  *   **The Bedrock:** Critics want a theory that explains why *one* thing happened. Everettians offer a theory that explains why *everything* happens and why we should *expect* what we see.

  **Verdict on your hypothesis:** You are very close to the mark. The "hidden formal question" is less about uniqueness and more about the **physical justification of axioms**. The "bedrock disagreement" is the dominant factor: it is a clash between **frequentist/propensity intuitions** (Critics) and **functionalist/Bayesian intuitions** (Proponents).

  **What to watch for:** Do not look for a new equation. Look for an argument that demonstrates why a "branch-counting" agent is physically impossible to sustain, or a concession from the Everettian side that the Born rule is a bridge principle rather than a derived theorem. Until then, the stalemate is a feature, not a bug, of the deeper philosophical divide.
