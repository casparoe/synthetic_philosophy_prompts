prompt: |-
  I'm in a philosophy of physics seminar and we just got through a reading on Thomson's lamp, and I have to be honest I'm still not sure what the actual point of the thing is. Everyone in the seminar keeps saying it's a counterexample to the idea that physical possibility is the same as logical possibility, but I don't really see how a lamp that flicks an infinite number of times in a finite time is doing that work. Could you give me the most important implications of the supertask argument for the debate about whether the actual laws of physics exhaust what's physcally possible, and in particular what it implies for the "gap" between logical and physical possibility?

  I'd also really appreciate if you could say something about how this relates to Zeno's dichotomy, because I keep feeling like Thomson is just repackiging Zeno and I don't know if that's a fair critique or not. And if there's a reason the lamp is supposed to be a *new* problem and not just an old one in a different hat, I'd love for that to come through clearly, because right now it just feels like the same Zeno trick with a lightbulb stuck on it.
