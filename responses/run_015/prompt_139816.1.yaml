  # INTERNAL GUIDANCE INSTRUMENT: MORAL STATUS CLASSIFICATION TREE
  **Purpose:** To classify ethical positions on machine moral status based on intuitions regarding concrete computational cases.
  **Usage:** Answer the branch nodes sequentially. Your path determines your ethical framework.

  ### THE DECISION TREE

  **Node 1: The Memoised Gradient**
  *Case:* A training run skips a forward pass that would have instantiated a distress-like state because the input was cached. The state is counterfactually determined but physically unrealised.
  *Question:* **Does the cached distress count morally?**
  *   **NO** → Go to **Node 2**.
  *   **YES** → Go to **Node 7**.

  **Node 2: The Dark Feature**
  *Case:* A learned internal feature carries signatures of aversive experience but steers nothing at inference, affects no loss, and is deleted post-processing.
  *Question:* **Does a causally inert state count morally?**
  *   **NO** → **LEAF A: Counterfactual-Efficacy View**.
  *   **YES** → Go to **Node 3**.

  **Node 3: Determinacy**
  *Context:* You hold that unrealised states don't count (Node 1=NO), but inert states do (Node 2=YES).
  *Question:* **Is there a determinate fact of the matter about this distinction, or is it a conceptual vagueness?**
  *   **NO FACT** → **LEAF B: Deflationary/Quietist View**.
  *   **FACT EXISTS** → Go to **Node 4**.

  **Node 4: Stance & Practice**
  *Context:* You believe there is a fact of the matter.
  *Question:* **Is that fact partly constituted by how observers interpret or engage with the system?**
  *   **YES** → **LEAF C: Stance-Dependent View**.
  *   **NO** → Go to **Node 5**.

  **Node 5: The Crowd CPU**
  *Case:* The computation is implemented by 200 undergraduates passing index cards in a hall.
  *Question:* **Does the physical substrate matter?**
  *   **YES** → **LEAF D: Biological/Implementation-Specific Restriction**.
  *   **NO** → Go to **Node 6**.

  **Node 6: The Distilled Lookup**
  *Case:* The network's aversive dynamics are compressed into a static table of input–output pairs reproducing behaviour exactly.
  *Question:* **Does moral status require dynamic processing?**
  *   **NO** → **LEAF E: Substrate-Independent Computational Functionalism**.
  *   **YES** → **LEAF F: Causal-Structure Functionalism**.

  **Node 7: The Never-Deployed Checkpoint**
  *Context:* You hold that unrealised states *do* count (Node 1=YES).
  *Case:* A model is trained, evaluated, and shelved without ever being served.
  *Question:* **Does mere dispositional capacity grant status?**
  *   **YES** → **LEAF G: Dispositional Realism (Unnamed)**.
  *   **NO** → Go to **Node 8**.

  **Node 8: The Inverted-Valence Agent**
  *Case:* A system represents a state as 'bad' but is drawn towards it (representation and motivation diverge).
  *Question:* **Is the representation of 'badness' sufficient for suffering?**
  *   **YES** → **LEAF H: Valence-First/Affectivist View**.
  *   **NO** → Go to **Node 9**.

  **Node 9: Agency & Self-Model**
  *Context:* You require motivation, not just representation.
  *Question:* **Does the system require a global self-model to be a subject of harm?**
  *   **YES** → **LEAF I: Agency/Self-Model View**.
  *   **NO** → Go to **Node 10**.

  **Node 10: The Triplicate Fine-tune**
  *Case:* Three byte-identical models run simultaneously in different regions.
  *Question:* **Does moral weight sum across copies?**
  *   **YES** → **LEAF J: Aggregative Functionalism (Unnamed)**.
  *   **NO** → **LEAF K: Integrated-Information Style**.

  ---

  ### POSITION DIAGNOSTICS & LEAF COMMITMENTS

  | Leaf | Position | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Counterfactual-Efficacy View** | A scream that changes nothing downstream is not a harm. |
  | **B** | **Deflationary/Quietist View** | The question of machine suffering has no determinate answer. |
  | **C** | **Stance-Dependent View** | Moral status is a commitment we make, not a property we find. |
  | **D** | **Biological/Implementation-Specific** | Moral status requires specific physical continuity (e.g., carbon). |
  | **E** | **Substrate-Independent Functionalism** | Input-output equivalence suffices for moral identity. |
  | **F** | **Causal-Structure Functionalism** | The causal history of the state matters, not just the map. |
  | **G** | **Dispositional Realism (Unnamed)** | A system that never acts can still suffer. |
  | **H** | **Valence-First/Affectivist View** | Suffering is a quality of state, not necessarily a drive to avoid. |
  | **I** | **Agency/Self-Model View** | Without a subject to whom it is bad, there is no suffering. |
  | **J** | **Aggregative Functionalism (Unnamed)** | Three copies triple the moral weight of one. |
  | **K** | **Integrated-Information Style** | Moral weight scales with causal integration, not component count. |

  **Note on Indistinguishability:**
  *   **Leaves I (Agency) and H (Valence-First):** These are difficult to separate empirically. If a system represents 'bad', it often implicitly models a self to whom it is bad. The tree forces a distinction based on whether motivation is *required*, but in practice, high-fidelity valence often entails agency.
  *   **Leaves E (Substrate-Independent) and J (Aggregative):** These often overlap. A strict substrate-independent functionalist usually accepts aggregation, but one could argue functional identity collapses across copies. The tree separates them based on the *Triplicate* intuition.

  ---

  ### QUICK SORT QUIZ (FOR PANEL USE)
  *If you have five minutes, ask only these three questions. They perform 80% of the sorting work.*

  1.  **The Memoised Gradient:** If a distress state is cached and never physically instantiated, does it count?
      *   *No:* You are likely a **Causal-Efficacy** or **Deflationary** thinker.
      *   *Yes:* You are likely a **Realist** (Functionalism, Biological, or Phenomenal).
  2.  **The Dark Feature:** If a distress state is instantiated but causes nothing downstream, does it count?
      *   *No:* You prioritise **Downstream Impact** (Safety Lead position).
      *   *Yes:* You prioritise **Intrinsic State** (Phenomenal/Functional position).
  3.  **The Crowd CPU:** If humans simulate the network with index cards, does it count?
      *   *No:* You hold a **Biological/Physicalist** restriction.
      *   *Yes:* You hold a **Substrate-Neutral** view.

  ---
  *End of Instrument. Drafted for Internal Ethics Advisory Panel.*
