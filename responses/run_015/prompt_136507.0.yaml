  hey, i'm a phd student in phil of bio and i'm stuck on teh spandrels lit. there's this passage in Darwin's Origin, chapter 6, where he talks about the eye being an organ of extreme perfection and complication, and he admits it seems absurb to think natural selection could form it. but then he says if we can show lots of gradations from a simple light-sensitive spot up to a complex eye, and each step is useful to its owner, then the difficulty mostly vanishes. he spends a bunch of space on intermediate eyes in different animals.

