  **(Self-Correction during drafting):** I initially thought about saying the Woodcutter's first account was a *naya*. No, it was a lie of omission. His *second* account (the confession) is the *naya*. I need to make sure that distinction is sharp. Also, need to be careful not to present Jain scholarship as monolithic. There are debates on whether *naya* applies to erroneous cognition. I will flag that.

