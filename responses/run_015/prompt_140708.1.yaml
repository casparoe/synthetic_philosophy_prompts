answer: |-
  This is a practical tool for a specific context. It is built on the consensus of clinical ethics committees in the UK and similar jurisdictions, stripped of academic scaffolding. It prioritises *proportionality* and *intent* over *acts* and *omissions*.

  ### Part 1: The 3 AM Card (Short Version)

  **Purpose:** For the nurse in charge or duty doctor when an ethics referral is impossible but a decision on treatment limitation or symptom control is needed immediately.

  **The Three Questions:**
  1.  **Authority:** Is there a valid Advance Decision or agreed Best Interests decision (family/proxy) that supports this plan?
  2.  **Aim:** Is the primary aim to relieve suffering or burden, rather than to cause death?
  3.  **Proportionality:** Is the treatment being stopped or adjusted burdensome or ineffective relative to the benefit it provides now?

  **The Decision:**
  *   **PROCEED:** If Yes to all three. Document the reasoning in the notes.
  *   **DO NOT PROCEED:** If No to Question 2 (aim is to cause death) or No to Question 1 (clear objection from patient/proxy).
  *   **ESCALATE:** If Question 3 is unclear (team disagrees on benefit/burden) or if the family is distressed/unconvinced. Do not act until the ethics group or senior management is consulted (next working day).

  ***

  ### Part 2: The Full Procedure

  **Purpose:** For the Clinical Ethics Advisory Group.
  **Time:** 60 minutes.
  **Output:** Written advice same afternoon.

  **Step 1: Establish Authority (The "Who Decides" Gate)**
  *   **Question:** Does the patient have capacity? If not, is there a valid Advance Decision to Refuse Treatment (ADRT) or a Health & Welfare Lasting Power of Attorney (LPA)? If neither, is there a consensus among those close to the patient regarding Best Interests?
  *   **Sufficient Answer:** "Yes, there is clear authority for this decision."
  *   **Stop Point:** If there is a clear, valid refusal from the patient (with capacity) or a valid ADRT prohibiting the proposed action, the procedure stops. **Advice: Do Not Proceed.**
  *   **Hand-off:** If there is irreconcilable conflict between family members or between family and team regarding *what the patient would have wanted*, this is a value conflict. The procedure cannot resolve it. **Hand-off to Trust Legal Team or Court of Protection.**
  *   *[DISTINCTION KEPT]: Capacity and Authority are binary legal/ethical gates. They cannot be simplified.*

  **Step 2: The Empty Ward Test (The "Cause of Death" Gate)**
  *   **Question:** If all staff left the room and no new interventions were started, what would kill the patient?
  *   **Sufficient Answer:** A clear description of the underlying pathology (e.g., "The pneumonia," "The heart failure," "The dementia").
  *   **Function:** This establishes the baseline. It distinguishes *treatment* from *care*.
  *   *[DISTINCTION REPAIRED]:* Your "Empty Ward Test" is kept but renamed. It does not determine morality, but it determines *causality*. It stops the group from claiming "we are killing them" when the disease is the cause.
  *   *[DISTINCTION DROPPED]:* The **Change Test**. Whether a physical change is made (turning a dial vs. not turning it) is irrelevant. A pacemaker is a treatment; turning it off is withdrawing treatment. The physical movement does not determine the morality.

  **Step 3: The Proportionality Assessment (The "Benefit/Burden" Gate)**
  *   **Question:** Is the specific intervention (ventilator, defibrillator, tube, drug) providing a net benefit to *this* patient *now*?
  *   **Sufficient Answer:** "The treatment is prolonging life but increasing suffering without hope of recovery" OR "The treatment is providing comfort and function."
  *   **Stop Point:** If the treatment is futile (cannot achieve its physiological goal) or disproportionately burdensome (pain/suffering outweighs extension of life), the advice is that it is permissible to withdraw or withhold.
  *   *[DISTINCTION KEPT]:* Treatment vs. Basic Care. Artificial nutrition/hydration via tube is treatment. Spoon-feeding and mouth care are basic care. This distinction must survive simplification.

  **Step 4: The Intent Check (The "Aim" Gate)**
  *   **Question:** What is the primary intention of the action?
  *   **Sufficient Answer:** "To relieve symptoms/burden" (Permissible) vs. "To end life" (Not Permissible).
  *   **Note:** Foreseeing death as a side-effect is permissible if the aim is symptom relief (Doctrine of Double Effect).
  *   *[DISTINCTION KEPT]:* Intended vs. Foreseen consequences. This is the only way to handle the syringe driver case.
  *   *[DISTINCTION DROPPED]:* The **Professional Role Test**. Whether a doctor sets the pump or a nurse presses the button is morally irrelevant to the *act*. It is relevant only to individual conscience. If the act is permissible, any authorised professional may perform it. If an individual feels it violates their conscience, they should recuse themselves, but they cannot block the procedure.

  **Step 5: The Mirror Test (The "Bias" Check)**
  *   **Question:** If we reverse the act/omission (e.g., instead of turning off the defibrillator, we chose not to implant it in the first place), would we reach the same conclusion?
  *   **Function:** If the verdict changes, the group is biased by the *physicality* of the act rather than the *ethics* of the outcome.
  *   **Action:** If the Mirror Test reveals inconsistency, the group must align the verdict with the *Proportionality Assessment* (Step 3), not the physical act.
  *   *[DISTINCTION REPAIRED]:* Your Mirror Test is kept as a quality control mechanism, not a decision maker. It exposes inconsistency; it does not dictate the right answer.

  **Where the Procedure Misfires:**
  1.  **Quality of Life Judgments:** The procedure cannot tell you if a life with severe dementia is "worth living." It can only tell you if a *treatment* is burdensome. If the disagreement is about the value of the life itself, this procedure hands off to the courts.
  2.  **Resource Allocation:** This procedure assumes resources are available. It does not handle "we should stop because the bed is needed for someone else." That is a policy question, not a clinical ethics referral.
  3.  **Uncertain Prognosis:** If the team genuinely does not know if recovery is possible, the procedure defaults to "Continue Treatment" until uncertainty is resolved.

  ***

  ### Part 3: Running the Cases

  #### Case 1: 71M, COPD, Ventilator Withdrawal
  *   **Step 1 (Authority):** Family agree. Team agrees. Best Interests met. **(Pass)**
  *   **Step 2 (Empty Ward):** If staff leave, the lung failure kills him. The ventilator is holding back the disease. **(Pass)**
  *   **Step 3 (Proportionality):** Ventilation is burdensome (invasive, sedation) and offers no recovery. Net benefit is negative. **(Pass - Withdrawal Permissible)**
  *   **Step 4 (Intent):** Aim is to remove burden and allow natural death. Sedation is for comfort. Death is foreseen, not intended. **(Pass)**
  *   **Step 5 (Mirror):** If we had never intubated him (omission), would it be permissible? Yes. Therefore, stopping (act) is permissible. **(Consistent)**
  *   **Verdict:** **PROCEED.**
  *   **Note on your group:** The discomfort some feel is residual "Change Test" bias. The procedure overrides this. The physical act of removing the tube is morally neutral compared to the proportionality of the treatment.

  #### Case 2: 68F, Heart Failure, Defibrillator Deactivation
  *   **Step 1 (Authority):** Patient dying, likely lacks capacity. Team/Family agree on goal (comfort). **(Pass)**
  *   **Step 2 (Empty Ward):** If staff leave, the heart failure kills her. The defibrillator is an intervention preventing the natural arrhythmia. **(Pass)**
  *   **Step 3 (Proportionality):** The device is causing distress (shocks) during dying. It offers no recovery benefit, only prolonged dying process. Net benefit is negative. **(Pass - Deactivation Permissible)**
  *   **Step 4 (Intent):** Aim is to prevent painful shocks. Death from arrhythmia is foreseen. **(Pass)**
  *   **Step 5 (Mirror):** If we never implanted it (omission), would it be permissible? Yes. Therefore, switching it off (act) is permissible. **(Consistent)**
  *   **Verdict:** **PROCEED.**
  *   **Addressing the "Two Members":** You asked me not to split the difference. The objection that "switching off is different from not starting" is morally incorrect within this framework. A defibrillator is a treatment. Withdrawing a treatment that is no longer beneficial is ethically identical to not starting it. The physical switch is irrelevant. The procedure rules against your two members.

  #### Case 3: 84F, Dementia, NG Tube Removal
  *   **Step 1 (Authority):** Family unanimous on patient's prior wishes. Best Interests supported. **(Pass)**
  *   **Step 2 (Empty Ward):** If staff leave, she dies of dehydration/starvation *because the tube is there*. Wait. If the tube is removed, she dies of the underlying inability to swallow safely (dysphagia caused by dementia). The disease is the dementia. **(Pass)**
  *   **Step 3 (Proportionality):** This is the hard point. Is the tube a *treatment*? Yes, it is artificial. Is it burdensome? Restraints are often needed to keep it in. Does it offer benefit? She enjoys hand-feeding. The tube bypasses the enjoyment. If the tube is replaced, it prolongs a state she reportedly did not want. If the tube is removed, she dies, but she can be hand-fed until she cannot swallow.
      *   *Critical Distinction:* The plan is to remove the tube *and* hand-feed. This is not withdrawing care; it is withdrawing *artificial* nutrition while maintaining *basic* care.
      *   **Assessment:** Artificial nutrition is medical treatment. If it contradicts prior wishes and offers no physiological advantage over careful hand-feeding (which she enjoys), it is disproportionate. **(Pass - Withdrawal Permissible)**
  *   **Step 4 (Intent):** Aim is to respect autonomy and avoid invasive intervention. Death is foreseen consequence of the underlying condition. **(Pass)**
  *   **Step 5 (Mirror):** If we never passed the tube (omission), would it be permissible? Yes. Therefore, not replacing it (omission/withdrawal) is permissible. **(Consistent)**
  *   **Verdict:** **PROCEED.**
  *   **Caveat:** The procedure allows this *only* because hand-feeding continues. If the plan were to remove the tube and *starve her*, Step 4 (Intent) would fail. The procedure lets you call this "letting die" provided you classify the tube as medical treatment (which the law does) and ensure basic care (mouth care, hand-feeding) continues.

  #### Case 4: Syringe Driver (Midazolam)
  *   **Step 1 (Authority):** Patient terminal, likely lacks capacity. Standard palliative care authority applies. **(Pass)**
  *   **Step 2 (Empty Ward):** Agitation kills no one. The disease kills. The drug treats the agitation. **(Pass)**
  *   **Step 3 (Proportionality):** Agitation is a severe burden. Midazolam relieves it. Risk is respiratory depression. Is the dose proportional to the symptom? Yes, if titrated to effect. **(Pass)**
  *   **Step 4 (Intent):** This is the crucial step.
      *   *Question:* Are we increasing the dose *to* kill her?
      *   *Answer:* No. We are increasing the dose *to* stop the agitation.
      *   *Test:* If the agitation stopped, would we still increase the dose? If No, the intent is symptom control.
      *   **Verdict:** Death is a foreseen side-effect, not the aim. **(Pass)**
  *   **Step 5 (Mirror):** If we gave a lower dose and she suffered agitation until she died naturally, is that better? Not necessarily. The moral weight is on the relief of suffering.
  *   **Verdict:** **PROCEED.**
  *   **Note:** This is where "aiming at death" vs "foreseeing death" earns its keep. If the notes say "increasing to end suffering," proceed. If the notes say "increasing to end life," do not proceed. The procedure forces the team to be honest in the documentation.

  ***

  ### Part 4: Limitations and Honest Misfires

  You asked where this will fail.

  1.  **The "Not Otherwise Dying" Problem (Case 3):** In the dementia case, the procedure relies on classifying the NG tube as "treatment" rather than "care." In some cultures or families, food is never treatment. If the family views food as basic care, Step 3 will fracture. The procedure will say "Proceed," but the family will hear "Killing." The procedure cannot fix that emotional reality. It can only justify the clinical classification.
  2.  **The "Slow Death" Ambiguity:** In Case 1 and 2, death is quick. In Case 3, death by dehydration after tube removal can take days. Some staff will feel this is "letting them suffer." The procedure says "Provide mouth care and analgesia." It cannot stop the visceral feeling that withholding food is wrong.
  3.  **The Conscience Clause:** I dropped the Professional Role Test for the *decision*, but you must keep it for the *staff*. If a nurse believes pressing the button to turn off the defibrillator makes them a killer, the procedure says they are morally wrong, but you cannot force them to do it. You must have a mechanism for another staff member to step in. The procedure does not solve the distress of the individual agent.
  4.  **Legal Drift:** This procedure aligns with current UK law (Mental Capacity Act, Supreme Court rulings on LST). If the law changes (e.g., on assisted dying), Step 4 (Intent) will need rewriting. The procedure is legally dependent, even if you handle legal questions separately.

  ### Summary of Your Tests

  *   **Change Test:** **SCRAP.** It is a distraction. Physical movement does not equal moral agency in this context.
  *   **Empty Ward Test:** **KEEP.** It is the best tool for identifying the underlying cause of death.
  *   **Mirror Test:** **KEEP AS AUDIT.** Use it to check the group's consistency, not to decide the case.
  *   **Professional Role Test:** **SCRAP FOR DECISION, KEEP FOR STAFFING.** It does not change the ethics of the patient's care, but it matters for team cohesion.

  This procedure will not make the decisions easy. It will not stop the nurse from going home upset. But it will stop the group from arguing about switches and tubes, and force the argument onto the only things that matter: benefit, burden, and intent.
