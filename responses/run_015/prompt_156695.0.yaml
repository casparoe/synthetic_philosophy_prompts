  4. You claim modern set theory smuggles in a metaphysics of completed totalities through its notation. Is this not merely a semantic complaint? Could one not adopt your ontology while retaining standard notation as a useful shorthand?

  5. If you concede the issue is merely semantic, does the notation not inevitably guide thought towards ontological commitments you reject? How do you propose we formalise mathematics without inadvertently reintroducing the completed totality?

  6. You frequently invoke a 'computational or epistemic horizon'. Is this horizon defined by physical constraints on human cognition, or is it a logical boundary inherent to mathematics itself? If the former, does your finitism not become contingent upon technological advancement?

  7. A significant challenge for finitism is the formulation of analysis. If the continuum cannot be treated as a completed set of points, how do you recover theorems dependent on compactness or completeness without resorting to approximations that merely mimic the standard results?

  8. For an audience accustomed to rationalist scrutiny, consistency is paramount. If mathematical truth is horizon-relative, does the statement 'infinity does not exist' hold true absolutely, or is it itself relative to our current horizon? If the latter, does your position not undermine its own universal claim?

  9. Standard set theory has proven immensely fruitful in physics and computer science. If your strict finitism yields the same practical results but restricts ontological commitment, what is the philosophical gain? Are we merely debating the label on the box, or does the restriction actually prevent specific logical errors?

  10. Finally, if your view were adopted, what becomes of the hierarchy of infinities? Are they to be treated as useful fictions, or must they be excised from rigorous discourse entirely?
