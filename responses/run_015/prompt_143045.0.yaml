answer: |-
  This is not a dumb argument; it is the central ontological crisis of typography, usually buried under deadlines and kerning tables. Your friend who says "every 'a' is already an 'a'" is operating on a functionalist view that ignores the economic and cultural reality of the industry. The Letter Spirit reference points toward a generative view, which is closer to how designers actually work, but it doesn't fully explain the outrage over copying.

  To reconstruct what your practices presuppose, we have to admit that the industry does not operate on a single theory of what a letterform is. It operates on a **hybrid ontology** that shifts depending on whether you are designing, selling, or suing.

  Here is the argument reconstructed from the practices themselves.

  ### 1. The Hybrid Ontology: What is an 'a'?

  Current practice presupposes that an 'a' is three things simultaneously, and the tension between them is where your confusion lies.

  1.  **Functionally, it is a Signal:** For the reader, the 'a' is a distinct cognitive trigger. As long as the signal fires, the shape is irrelevant. This is why blackletter, script, and sans-serif 'a's are all accepted as 'a'.
  2.  **Structurally, it is a Coordinate:** For the designer (especially in variable fonts), the 'a' is a set of vectors defined by its relationship to other masters. It is not a static object but a mutable state within a system.
  3.  **Commercially, it is a Signature:** For the foundry, the specific curvature of the 'a' is a brand marker. Here, the 'a' is treated as having an **essence**.

  The industry outrage you describe ("losing their minds if a competitor's 'a' has the same bowl shape") only makes sense if we presuppose the **Commercial/Signature** view. If the 'a' were merely a signal, copying a bowl shape would be irrelevant as long as legibility held. If it were merely a coordinate, copying would be mathematically inevitable. The outrage proves that designers treat specific letterforms as *intellectual property artifacts* akin to a logo, even while the law (in the US) largely treats them as utilitarian shapes unprotected by copyright.

  **The Presupposition:** A letterform is a **stable node in a specific system of differences**. An 'a' is an 'a' not because of its absolute shape, but because of its *difference* from the 'o', the 'u', and the 'd' within that specific family.

  ### 2. Test Case One: The Relational System

  Imagine the font where no letter is drawn first, only the rules of relation (the 'o' sets roundness, the 'n' sets rhythm, 'p' and 'd' are rotations).

  **Is there a fact of the matter about which shape is "the" 'a'?**
  Under this system, **no**. The 'a' is strictly a node in a network. Its identity is entirely topological.

  *   **Why practice tolerates this:** This is actually how multiple-master and variable fonts already work. You draw the extremes, and the computer derives the rest. We accept the interpolated 'a' as the "same" 'a' because it shares the *genealogy* of the system.
  *   **The Ontological Shift:** In this setup, the 'a' loses its status as an independent object. It becomes a **byproduct of constraints**. If the system dictates that the 'o' must be perfectly circular and the 'n' must have a specific shoulder curve, the 'a' is mathematically forced into a specific shape to maintain consistency.
  *   **The Verdict:** This supports the **Structuralist** view. The 'a' is defined by its relations, not its essence. If you change the relation (e.g., make the 'o' square), the 'a' *must* change to remain coherent within that family. Therefore, there is no universal 'a', only an 'a' relative to its specific system's rules.

  ### 3. Test Case Two: The Continuum and the Theft Boundary

  You deform an 'a' into an 'o' step-by-step. Where does it stop being an 'a'?

  **The Visual Boundary (The Sorites Paradox):**
  There is no geometric point where it stops being an 'a'. It is a **Gestalt switch**. At some micro-step, the reader's brain flips from "closed counter with stem" to "closed counter." That flip is subjective and context-dependent.

  **The Theft Boundary (The Industry Practice):**
  Here is the crucial distinction you asked for. The industry treats interpolation across a weight axis (200 to 900) as **one typeface**, but interpolation toward another foundry's design as **theft**. Why?

  *   **Weight Interpolation:** This is viewed as **internal variation**. The "essence" of the typeface is preserved because the *design decisions* (the contrast, the terminal angle, the x-height) remain constant. The 'a' is changing size/density, but not *identity*.
  *   **Foundry Interpolation:** This is viewed as **external contamination**. If you interpolate your 'a' toward Helvetica's 'a', you are importing *someone else's design decisions*.

  **What this reveals:** The identity of a letterform is not in its shape, but in its **provenance**.
  Practice presupposes a **Historical/Causal Theory of Identity**. An 'a' belongs to Font X if it was generated by the rules of Font X. If it is generated by the rules of Font Y, it is a different 'a', even if they look identical.
  *   **Why copying is theft:** It is not because the shape is stolen (shapes are cheap); it is because the *labor of decision-making* is stolen. When a competitor copies your bowl shape, they are bypassing the work of determining *why* that bowl shape fits your specific 'n' and 'o'. They are harvesting the result without the process.

  ### 4. The Functional View: If "Readable = 'a'"

  If we went all-in on the functional view (anything a reader reliably reads as an 'a' is an 'a'), the industry would undergo a catastrophic collapse.

  **What would change:**
  1.  **Design becomes Engineering:** Aesthetics become secondary to eye-tracking data. If a square 'a' is read 5ms faster than a curved 'a', the square wins. The "beauty" of the curve is ontologically irrelevant.
  2.  **Criticism Dies:** You cannot critique style if function is the only metric. There is no "elegant" or "harsh," only "efficient" or "inefficient."
  3.  **Licensing Collapses:** If the shape doesn't matter, only the function, then any font that is legible is a substitute for any other. The value of a "custom typeface" drops to zero unless it offers a measurable performance increase over a free one.

  **What would break:**
  *   **Brand Identity:** Companies commission custom fonts (like Netflix or BBC) to own a unique visual voice. If the 'a' is just a functional token, brand distinctiveness vanishes.
  *   **The "Voice" of Text:** Typography conveys tone (authoritative, friendly, archaic). This relies on the *specifics* of the shape, not just legibility. A functional view erases tone.

  **The Limit of the Functional View:**
  Practice rejects pure functionalism because **readers do not just read; they feel.** We tolerate illegible display fonts in signage because they convey *mood*. If the 'a' were only a functional signal, display typography would not exist. The fact that we pay for "ugly" but legible fonts proves the functional view is insufficient.

  ### 5. Where Practice is Underdetermined

  You asked where the practice is genuinely underdetermined—where several theories license the same outcome.

  1.  **Legibility Thresholds:** Both the Functional view and the Essentialist view agree that an 'a' must have a counter. Where they diverge is *why*. Functionalism says "to be read." Essentialism says "to be an 'a'." Practice doesn't care; it just draws the counter.
  2.  **Standard Weights:** Everyone agrees on what "Bold" looks like relative to "Regular." Whether this is a mathematical scaling (Structural) or a cultural expectation (Essence) doesn't change the output.
  3.  **Revivals:** When reviving a 16th-century typeface, designers accept that they are drawing *new* 'a's that count as the *old* 'a'. Here, **Family Resemblance** is the operating theory. The new 'a' doesn't need to match the old outline pixel-for-pixel (Essence), nor does it need to be functionally superior (Functionalism); it just needs to share enough features to be recognized as a descendant.

  ### 6. The Synthesis: What is the 'a'?

  To settle your argument: Your friend is wrong because they are treating the 'a' as a **universal constant**. The Letter Spirit researcher is closer, treating it as a **generative rule**.

  But the actual practice of typography presupposes that an 'a' is a **Social Contract stabilized by Technical Constraints**.

  *   **Social Contract:** We agree to call this shape an 'a' so we can communicate. We agree that *this specific version* of the shape belongs to *this specific foundry* so they can get paid.
  *   **Technical Constraints:** The shape must fit with the 'n', the 'o', and the 'd' to form a coherent system.

  **The Verdict on your Commission:**
  Commissioning a custom typeface is **not** redrawing Helvetica with extra steps. It is building a **new system of relations**.
  *   If you buy Helvetica, you are renting a pre-existing system of relations (the 'a' relates to the 'n' in a specific 1957 way).
  *   If you commission a custom font, you are defining new relations (how does *our* 'a' relate to *our* 'n'?).

  The value isn't in the 'a' itself. The value is in the **coherence of the network**. A custom font allows you to tune the entire network (the rhythm, the color, the voice) to your specific content. A licensed font forces your content to adapt to someone else's network.

  **Final Answer:**
  An 'a' is not a fixed schema. It is a **variable dependent on its system**.
  *   In the **relational test case**, the 'a' is a node; its identity is its position relative to other nodes.
  *   In the **continuum test case**, the boundary is not visual but categorical (Gestalt) and legal (provenance).
  *   In the **functional test case**, the theory fails to account for tone and brand, which are primary economic drivers of type design.

  The outrage over copying is not about the shape; it is about the **unauthorized use of a specific system of relations**. When someone copies your 'a', they aren't stealing a drawing; they are hijacking the logic of your system without paying for the architecture. That is why the practice treats the 'a' as if it has an essence, even when the design process proves it is a coordinate. The "essence" is a legal and economic fiction required to make the market function, not an ontological truth about the letterform.
