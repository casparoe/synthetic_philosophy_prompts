answer: |-
  # Session Plan: The Guild of Translators
  **Topic:** Norm Change, Honor, and Coordination (Williams/Appiah)  
  **Time:** 90 Minutes  
  **Students:** 12 Grad Students  

  ## The Goal
  Stop them from thinking moral progress happens because someone wrote a really convincing essay. Start them thinking about it as a risky coordination problem where status and visibility do the heavy lifting. We're simulating why dueling died not because it was "wrong" (people knew that for centuries) but because the honor structure shifted.

  ## Setup & Roles (5 mins)
  Hand out role cards secretly. Arrange the room so Elders are at the front/head of the table.

  *   **3 Elders:** High status. You control the guild's reputation. You want stability, but you're tired of the ritual too. You have the most to lose if chaos breaks out.
  *   **6 Members:** The backbone. You want the norm gone, but you can't afford to be expelled. You need cover.
  *   **3 Juniors:** The victims. You suffer the ritual. You have no vote, but you feel the pain.

  **The Context:**  
  You are in the Guild of Translators. There is a sacred ritual: *The Correction.* Whenever a Junior mistranslates a text in public, every single member must stand and perform a loud, humiliating correction chant. It proves solidarity. It hurts the Junior. It wastes time.  
  **The Stick:** Leaving the guild means career death. Expulsion is real.

  ---

  ## Round 1: The Moral Argument (20 mins)
  **Goal:** Try to abolish the ritual using only words.  
  **Rule:** Open debate. Anyone can speak.  
  **Constraint:** Juniors have a **2-minute total cap** (use a timer). They can speak first to set the stakes, then must fall silent.  
  **Hidden Mechanic:** Arguments alone *cannot* change the norm. No matter how good the logic is, the rule stays unless the voting threshold is met in Round 2.

  *Facilitator Note:* Let them get passionate. They will try to convince the Elders. Let them fail. If they ask "Is this working?", say "You're still in the debate phase."

  ## Round 2: The Coordination Game (25 mins)
  **Goal:** Secretly choose whether to **Break** the norm or **Stay**.  
  **Rule:** **NO TALKING.** Absolute silence. Pass notes if you must, but no verbal negotiation.  
  **Mechanic:** Everyone (Elders + Members) gets an index card and a sealed envelope.  
  *   Write **BREAK** or **STAY**.  
  *   Seal it.  
  *   Juniors observe and take notes (they do not vote).

  **The Payoff Structure (Put this on the board):**
  *   **If < 4 people BREAK:** The Norm Survives.
      *   Breakers: **-4 Reputation** (You stood alone and failed).
      *   Stayers: **0 Change**.
  *   **If 4+ people BREAK:** The Norm Collapses.
      *   Everyone (Guild): **+5 Collective Points** (Prestige boost).
      *   Breakers: **-1 Reputation** (Small cost for leading change).
      *   Stayers: **0 Reputation Cost** (You free-rode on the change).

  *Why this matters:* If you break and fail, you get crushed. If you break and succeed, you gain less than if you stayed and let others break. You need 4 people to trust each other enough to risk the -4.

  ## Round 3: The Reveal & Silence (15 mins)
  1.  Collect envelopes. Open them publicly.
  2.  Tally the BREAK votes.
  3.  Calculate scores on the board.
  4.  **The Silence:** Regardless of the outcome, sit in absolute silence for 2 minutes. Let the result land. If the norm survived, let the Juniors sit in the discomfort. If it collapsed, let the Elders feel the shift in power.

  ---

  ## Debrief: Connecting to Williams & Appiah (20 mins)
  Don't just ask "How did that feel?" Map it to the text.

  **1. The Failure of Reason (Round 1)**
  *   "Someone probably made a perfect moral argument in Round 1. Why did nothing change?"
  *   *Point:* Knowing a norm is immoral isn't enough. Appiah shows people knew slavery/dueling was wrong for decades before it ended.
  *   *Question:* Did the Juniors' outrage move the Elders? Or did it just make them defensive?

  **2. The Honor Dynamics (Round 2)**
  *   "Look at who broke. Was it the Elders or the Members?"
  *   *Point:* Williams argues honor is about identity and status. Elders hold the key. If Elders stay silent, Members won't break.
  *   *Question:* Did anyone try to negotiate in Round 2 despite the ban? (Discuss the temptation to coordinate).
  *   *Question:* Did anyone fear being the 'sucker' (breaking alone)?

  **3. The Conditions for Change**
  *   "What had to be true for the norm to actually fall?"
  *   *Answer:* It wasn't truth. It was **common knowledge** that others would break. You needed to know you wouldn't be alone.
  *   *Connection:* Appiah on "scripts." The script changed when enough people signaled the old script was no longer honored.

  **4. The Limitations (Honest Note)**
  *   "This game is 90 minutes. Real norm change takes generations."
  *   "In reality, breaking this norm isn't -4 points. It's social death. You lose your friends, your income, your identity. I can't simulate that pain here."
  *   "But the *structure* is the same. You didn't change your minds in Round 1. You changed your *behavior* in Round 2 based on risk assessment."

  ---

  ## Facilitator Cheat Sheet (What will go wrong)
  *   **Negotiation in Round 2:** Students will try to talk during the voting phase. They'll say "I'll break if you break." **Stop this.** Use sealed envelopes. Collect them immediately. The point is the *uncertainty*.
  *   **Juniors Dominating Round 1:** They will be rightfully angry. Enforce the 2-minute cap gently. "I hear you, but save some energy for the observation phase."
  *   **The "Free Rider" Problem:** Notice if everyone tries to Stay hoping others Break. If the norm survives, highlight this. "You all wanted it gone, but no one wanted to pay the cost. That's exactly why bad norms persist."
  *   **Typo check:** Make sure the payoff math on the board is clear, otherwise they'll argue about points instead of honor.

  *Final thought:* If the norm collapses, congratulate them on changing history. If it survives, sit with the failure. Both outcomes teach the lesson.
