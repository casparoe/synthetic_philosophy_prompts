      *   *Nuance:* On the "anxiety" point. Troeltsch and later scholars debate how much Weber emphasized "anxiety" vs. "methodical life conduct." Stick to the text: it's about *certainty* of salvation.
      *   *Nuance:* On "Other Religions." Weber didn't say they couldn't have capitalism, but that they lacked the *specific rational legal and ethical structure* that facilitated modern Western capitalism.
