answer: |-
  Here is the carving you asked for.

  ### 1. The Name and the Distinction

  There is no single standard term in philosophy of emotion for the second phenomenon. Your friend's term, "recalcitrant emotion," is the correct philosophical label for the first phenomenon (the body outliving the thought). That concept describes a state of mind where a judgment updates but the affect does not. It is about the character's internal inconsistency.

  The second phenomenon—the sentence order changing the reader's verdict on whether the fear is present—does not have a dedicated name in emotion theory. This is because philosophy generally studies the mind, not the text that represents the mind. However, in narratology and psycholinguistics, this is a specific instance of **iconicity of order**. The principle states that the sequence of words mirrors the sequence of experience.

  It is distinct from recalcitrant emotion. Recalcitrant emotion is about *conflict* (I know X, but I feel Y). Your second phenomenon is about *priority* (Which one counts as the current reality?).

  *   **Recalcitrant Emotion:** The fear persists *despite* the knowledge.
  *   **Order Effect:** The fear persists *because* it was presented first.

  In the first case, the character is struggling. In the second case, the text is instructing the reader on what to treat as the background truth versus the foreground exception. When the thought comes first ("She knew the dog was harmless"), it sets the baseline reality. The hand moving becomes a glitch, a leftover, a sentimental echo. When the hand moves first, it sets the baseline reality. The thought becomes an intellectual overlay that fails to cancel the physical truth.

  **Confidence:** High. There is no philosophical term for this specific textual mechanic, and it is functionally distinct from recalcitrance.

  ### 2. Where It Stops (Scope and Boundaries)

  This effect relies on **working memory** and **simulation**. The reader holds the first image in their mind while processing the second. As the distance between the two sentences grows, the effect degrades.

  *   **Second Person:** It works strongly here. Second person forces immediate simulation ("You walk to the car"). The bodily instruction feels like a direct command to the reader's nervous system.
  *   **Past Perfect:** It weakens significantly. Past perfect ("Her hand had gone to the latch") pushes the action into a completed past, further back than the simple past narrative timeline. It creates distance. The thought ("She knew...") in simple past feels more immediate than the action in past perfect. The order effect can flip if the tenses are mismatched this way.
  *   **Chapter Break:** It stops. A break resets the reader's working memory and emotional baseline. If the hand moves at the end of Chapter 1 and the thought occurs at the start of Chapter 2, they are read as separate beats, not a single conflicting unit.
  *   **Split Characters:** It changes nature. If Character A sees the hand move, and Character B says "I know it's safe," the reader treats this as dramatic irony or miscommunication, not internal conflict. The order effect only holds tightly when the body and the thought are attributed to the same consciousness within the same narrative frame.
  *   **Dialogue vs. Narration:** Narration wins. If the narration says "Her hand went to the latch" and the dialogue says "I'm not scared," readers trust the narration as the objective truth of the scene and the dialogue as the character's performative lie (even if the character believes it). The order matters less here because the *source* matters more.

  **Confidence:** Medium-High. The working memory constraint is well-established, but the specific tipping point (e.g., exactly how many sentences dilute the effect) varies by reader.

  ### 3. Theory of Emotion vs. Prose Mechanics

  You asked which account of emotion predicts this: Judgment, Perceptual, or Somatic.

  *   **Judgment Theory (Emotion = Belief):** This theory fails to predict the order effect. If emotion is just a judgment ("The dog is safe"), then the order of sentences shouldn't matter. The belief is present in both versions. If this theory were true, readers should report the character as safe in both cases.
  *   **Perceptual Theory (Emotion = Seeing Value):** This theory partially fits. It suggests emotion is like a sense perception. But it doesn't fully explain why the *textual order* changes the perception.
  *   **Somatic/Bodily Theory (Emotion = Feeling the Body):** This fits best. If emotion is fundamentally the perception of bodily change, then presenting the bodily change first anchors the emotional reality. The thought becomes secondary commentary.

  However, the honest answer to your third question is this: **This is evidence about sentence-level reading, not necessarily about human emotion.**

  You are worried you have been drawing conclusions about characters off something that is "really just about prose." In fiction, there is no difference. A character exists only in the prose. The reader does not have access to the character's mind except through the sequence of words you provide. When you put the body first, you are not hiding a truth; you are *making* the truth.

  The order effect works because readers simulate the text sequentially. When they read "Her hand went to the latch," they simulate the tension. When they immediately read "She knew the dog was harmless," they do not delete the simulation; they layer the thought on top of it. The simulation (body) feels more "real" than the overlay (thought). If you reverse it, they simulate the safety, then layer the twitch on top. The twitch feels like a glitch.

  So, is it evidence about emotion? It is evidence about how readers *construct* emotion from text. It validates the Somatic view *within the context of narrative*, because narrative relies on simulation. But it does not prove that real humans feel this way in real life; it proves that readers read this way.

  **Confidence:** Medium. The link between somatic theory and narrative simulation is strong, but claiming it proves anything about "real" emotion outside of text is speculative.

  ### Confidence Summary

  *   **Claim:** There is no specific philosophical term for the order effect. (**High Confidence**)
  *   **Claim:** The order effect is distinct from recalcitrant emotion. (**High Confidence**)
  *   **Claim:** The effect degrades or vanishes across chapter breaks or with mismatched tenses (past perfect). (**Medium Confidence**)
  *   **Claim:** This is primarily evidence about reading mechanics, which constitutes emotional reality in fiction. (**High Confidence**)
  *   **Claim:** Somatic theory aligns best with this effect compared to Judgment theory. (**Medium Confidence**)

  **Least Sure Claim:** I am least sure about the **Past Perfect** boundary. While linguistic distance generally reduces immediacy, skilled writers can manipulate tense to maintain pressure. There may be exceptions where a past perfect action feels more haunting and present than a simple past thought, depending on the surrounding rhythm. I am confident distance reduces the effect, but the specific grammatical trigger is less rigid than the semantic one.
