prompt: |-
  hey — i'm covering reproductive ethics and that procreation asymmetry thing (bad to make a sufferer, not bad to skip a happy one) for my column. i talked to Mara, a clinic ethics consultant, about her rulings on five past proposals. now there's a sixth and i want to see if she's consistent or running rules she hasn't named.

  her past calls:
  - couple with a gene variant guaranteeing severe chronic pain for any child: hard reject, don't proceed.
  - couple with zero risk who just want a kid: approve, but she said there's no seperate moral pressure either way — not even weak.
  - couple who could adopt a child in need instead of conceiving a healthy one: she said adoption is admirible but not obligatory, conceiving is fine.
  - wealthy clients asking to subsidize extra IVF cycles just to have more happy kids: she rejected the subsidy, said resources go to existing patients, but said the clients themselves do nothing wrong paying out of pocket.
  - parents who want to conceive knowing the child will have a mild, manageable sensory deficit that lowers wellbeing slightly: she approved with monitoring, said the harm threshold hasn't been crossed.

  new case: a couple wants embryo editing to push wellbeing way above average — genuinely exceptional — but there's a 15% chance of a moderate cognitive disability. they plan to abort any failed embryo and retry. no suffering child is born, but there's a loop of risk and termination.

  what do you think Mara rules? lay out at least two principles that fit her first five verdicts — maybe a pure person-affecting asymmetry vs. a harm-threshold-with-resource model — and show exactly where they split on this editing loop. give your best guess at her actual call and say which old case is the closest analog.

  and be straight with me: what argument or evidence would flip your call on her reasoning? where is this analysis most likely to break? i need that self-criticism for the piece.
