answer: |-
  **Assessment Question**

  **Course:** ECON 490: Methodology of Economic Science
  **Assessment:** Take-Home Seminar Paper (48 Hours)
  **Word Limit:** 1,000 words (+/- 10%)

  **Prompt:**

  Consider a household observed over a long horizon facing a sequence of budget sets defined over a fixed vector of $n$ goods. The data satisfy the Generalized Axiom of Revealed Preference (GARP), consistent with the maximization of a stable, well-behaved utility function $U(x_1, ..., x_n)$. Suddenly, a genuinely new good ($x_{n+1}$) is introduced to the market. It has no close substitute in the original vector. The household purchases $x_{n+1}$ at prevailing prices, while the original bundles remain affordable.

  Standard revealed preference analysis confirms the household is strictly better off. However, two methodological disputes arise. First, regarding welfare magnitude: determining *how much* better off the household is appears to require extrapolating demand for $x_{n+1}$ to reservation prices where it is never bought, yielding bounds rather than a point estimate. Second, regarding ontology: does the recovered utility index merely re-encode choices, or does it measure a real magnitude of well-being? Complicate this further: the household volunteers that $x_{n+1}$ "changed their life far more than the money suggests."

  In a framework that admits only choices as evidence, evaluate the status of this self-report. Does the introduction of the new good reveal that the pre-existing utility function was a structural model of behavior or a fundamental measure of welfare? Specifically, articulate what would have to be true about the relationship between choice and experience for the welfare magnitude to count as a genuine measurement rather than a modelling artefact. Avoid simply restating that utility is ordinal; explain the consequences of that ordinality when the choice set expands exogenously.

  ***

  **Model Answer**

  The introduction of a new good ($x_{n+1}$) into a stable revealed preference (RP) framework exposes the tension between utility as a behavioral index and utility as a measure of well-being. While GARP ensures consistency within the original $n$-dimensional space, the expansion of the choice set breaks the closed system required for non-parametric identification. The core methodological issue is not merely that utility is ordinal, but that the *mapping* from choice to welfare relies on structural assumptions that become visible only when the choice set changes.

  Regarding welfare magnitude, the RP framework provides a direction of change but obscures the scale. Because the old bundles remain affordable, the household reveals a preference for the new bundle containing $x_{n+1}$. However, quantifying this gain (e.g., via compensating variation) requires knowledge of the reservation price for $x_{n+1}$. Since the good is bought at market price, we observe only one point on the demand curve. Estimating the area under the demand curve requires extrapolating behavior to prices where the good is not purchased. This extrapolation depends entirely on functional-form assumptions (e.g., Cobb-Douglas vs. CES) imposed on the utility function. Consequently, the welfare magnitude is a modelling artefact derived from the assumed curvature of indifference curves, not a figure pinned down by choice data. The "bounds" mentioned in the prompt reflect the limits of RP; the "figure" reflects the economist's parametric priors.

  This leads to the ontological dispute. In the original $n$-good regime, the "as-if" hypothesis renders the distinction between utility as a re-encoding of choices and utility as a real magnitude observationally equivalent. If choices maximize $U$, and $U$ ranks choices, the index works regardless of its psychological reality. However, the new good disrupts this equivalence. The pre-existing function $U(x_1, ..., x_n)$ cannot evaluate $x_{n+1}$ without augmentation. If utility is merely a re-encoding of choices, the new utility function $V(x_1, ..., x_{n+1})$ is a new model fitted to new data. If utility is a real magnitude of well-being, the original $U$ was an incomplete measurement of a deeper, stable preference structure that included latent demand for $x_{n+1}$. The expansion of the choice set reveals that the original utility function was likely a local approximation of behavior, not a fundamental law of welfare.

  The household's self-report—that the good changed their life "more than money suggests"—has no status in a strict RP framework. RP is behaviorist; it treats introspection as "cheap talk" because it is not revealed through sacrifice. If the household claims high welfare but chooses a bundle that implies low marginal utility for $x_{n+1}$ relative to cost, RP privileges the choice. However, accepting the self-report requires abandoning the strict choice-only framework in favor of a hedonic or capability approach. This admission acknowledges that choice is an imperfect proxy for well-being, perhaps due to adaptive preferences, misinformation, or the inability of market prices to capture existential value.

  For the welfare magnitude to count as a genuine measurement rather than an artefact, two conditions must hold. First, utility must be cardinal, not ordinal. We must be able to measure the *intensity* of preference, not just the ranking. Second, there must be a stable, structural link between choice and experience that persists across changes in the choice set. This implies that the functional form used to extrapolate demand is not just a convenient statistical fit but a true representation of the household's psychological valuation. Without these conditions, the calculated welfare gain is merely a consistency check on the economist's model, not a measurement of the household's improved life. The new good demonstrates that while RP can validate rationality, it cannot validate the welfare significance of that rationality without extra-empirical assumptions about the nature of utility itself.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. The Limits of Non-Parametric Identification (4 Marks)**
  *   **Must Hit:** Explain that while RP determines the *direction* of welfare change (better off), the *magnitude* requires counterfactual demand data (reservation prices) unavailable in the observed set.
  *   **Differentiation:** A answers note that point estimates rely on functional-form extrapolation; B answers simply state "we need more data."
  *   **Common Error:** Strong candidates often confuse identification of the *function* with identification of the *welfare metric*, assuming that fitting a curve solves the measurement problem.

  **2. Ontological Shift (Index vs. Magnitude) (5 Marks)**
  *   **Must Hit:** Distinguish between utility as a behavioral index (valid only within the observed set) and utility as a fundamental magnitude (stable across choice sets).
  *   **Differentiation:** A answers argue the new good reveals the old function was a local approximation; B answers restate that utility is ordinal without discussing the structural break.
  *   **Common Error:** Students frequently assert utility is "real" because the model fits, failing to see that the fit is tautological within the original budget sets.

  **3. Status of the Self-Report (4 Marks)**
  *   **Must Hit:** Acknowledge that strict RP renders the report irrelevant (choice dominates), but accepting it requires breaking the choice-only constraint.
  *   **Differentiation:** A answers link this to the proxy problem (choice $\neq$ well-being); B answers dismiss the report as "unscientific" without methodological justification.
  *   **Common Error:** Candidates often try to incorporate the report into the utility function mathematically without addressing the epistemological conflict.

  **4. Conditions for Genuine Measurement (5 Marks)**
  *   **Must Hit:** Explicitly state that cardinality and structural stability (link between choice and experience) are required for the magnitude to be real rather than an artefact.
  *   **Differentiation:** A answers identify these as extra-empirical assumptions; B answers suggest better data collection would solve the problem.
  *   **Common Error:** Strong students often argue that "better econometrics" can solve the problem, missing the philosophical point that the metric itself is undefined in ordinal theory.

  **5. Synthesis and Clarity (2 Marks)**
  *   **Must Hit:** Coherent argument structure, adhering to word limit, American English spelling/grammar.
  *   **Differentiation:** Flow and precision of terminology.
  *   **Common Error:** Overuse of jargon without definition, or drifting into general welfare economics rather than methodology.

  **Grading Bands:**
  *   **A (17-20):** Hits all moves, specifically articulating the *conditions for reality* (Cardinality/Structure) in Move 4. Treats the new good as a structural break.
  *   **B (13-16):** Hits Moves 1-3 well but treats Move 4 as a data problem rather than a theoretical limitation. Restates underdetermination without analyzing the meaning of utility.
  *   **C (9-12):** Recites WARP/GARP definitions. Fails to address the self-report or the specific implications of the new good.
  *   **D (0-8):** Fundamental misunderstandings of revealed preference or utility theory.
