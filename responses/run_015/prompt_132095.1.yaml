answer: |-
  ok here's a run down for the session. keep it loose, dont let it turn into a lecture or they'll zone out.

  **session plan: where's the line? (gift vs. graft)**
  **time:** 45 mins-ish
  **vibe:** discussion heavy

  **1. the hook (5 mins)**
  *   **start here:** tell the Jake/Wine story straight up. "My friend thinks giving my advisor a $200 bottle of wine is bribery. i think it's politeness. vote."
  *   **why first:** gets them invested immediately becuase it's real life, not theory.
  *   **goal:** show there's no immediate consensus.

  **2. bust the "brown envelope" myth (10 mins)**
  *   **address misconception:** "corruption is just poor countries."
  *   **move:** show examples of high-end corruption (lobbying, revolving door) right after the vote.
  *   **teaching point:** corruption isn't about development levels, it's about power asymmetry.
  *   **note:** hit this early so they dont spend the whole hour thinking about nigeria vs. norway.

  **3. the moving line (10 mins)**
  *   **concept:** every culture draws a line between gift and bribe, but the line moves.
  *   **carrying example:** **skip the japanese omiyage / german coffee stuff.** too stereotypey and distracts from the structural point. go with **local clientelism or campaign donations** instead.
  *   **why:** it's poli-sci, they need to see structural ambiguity. when does a donation become a quid pro quo? it's the same mechanic as the wine, just bigger stakes.
  *   **address misconception:** "western legal standards are universal." show how US lobbying would be illegal elsewhere, but here it's "participation."

  **4. the legal trap (5 mins)**
  *   **address misconception:** "if no law is broken it's clean."
  *   **move:** explain that law lags behind norms. just becuase it's compliant doesn't mean it's not corrupt.
  *   **transition:** this sets up Jake's idea perfectly.

  **5. jake's "moral visibility" (10 mins)**
  *   **where it fits:** right after the legal trap. it's the tool for the grey areas the law misses.
  *   **definition:** can you narrate the exchange as a market transaction without blushing?
  *   **example:** try narrating the wine. "i give wine, you give good advice" (ok) vs "i give wine, you give me an A" (blush).
  *   **does it need its own example?** no, apply it to the carrying example (campaign donations). try to narrate a donation as a transaction out loud. if you stumble, visibility is low = high corruption risk.

  **6. end check: classify 3 cases (5 mins)**
  *   put these on a slide/board, have them use the "blush test."
      1.  **The Advisor Wine:** (your original case).
      2.  **The Lunch:** paying for a colleague's $50 lunch after they help you fix a code bug.
      3.  **The Internship:** a donor's kid gets an unpaid internship at the firm the donor contracts with.
  *   **goal:** see if they can defend the classification using visibility, not just rules.

  **what to skip:**
  *   **deep ethnography of specific patron-client networks.** way too dense for a study group. loses the room in the weeds of specific names/histories. keep it mechanistic.

  **quick tips:**
  *   if they get stuck on "is it illegal," remind them legality != ethics.
  *   let Jake's idea shine, students love peer theories.
  *   dont worry about typos in your handout, makes it feel less formal.

  let me know if you want to swap the campaign donation example for something else, but definetly avoid the japan/german comparison unless you want to spend 20 mins debunking stereotypes.
