  *   **Awkwardness:** You must explain why the colony doesn't scream when you step on a hundred workers.

  **🍃 THE ZOMBIE AGENT**
  *   **Commitment:** The colony acts for reasons and holds beliefs, but there is "nobody home" inside.
  *   **Awkwardness:** If it has beliefs without feelings, you have to admit your laptop might qualify if the software is complex enough.

  **🍃 THE FLOW MIND**
  *   **Commitment:** The mind exists in the speed and movement of signals, not just the pattern.
  *   **Awkwardness:** If you slow the colony down enough, the mind doesn't just sleep—it ceases to exist until sped up again.

  **🍃 THE COMPUTATIONAL HIVE**
  *   **Commitment:** The colony is a smart machine that processes data, but has no beliefs and no feelings.
  *   **Awkwardness:** You treat the colony as an agent in your explanations, but deny it the one thing (beliefs) that usually makes agency real.

  **🍃 THE ROYALIST**
  *   **Commitment:** The colony is just the Queen's extended body; the workers are merely organs.
  *   **Awkwardness:** You have to explain why the colony survives for months after the Queen dies, often behaving more aggressively than before.

  **🍃 THE PATTERNIST**
  *   **Commitment:** The mind is information that can be copied to new ants; the specific ants don't matter.
  *   **Awkwardness:** If you record a human brain's state and play it into a new body, you must say the person survived, which implies teleportation is possible.

  **🍃 THE SELF-ORGANIZING SYSTEM**
  *   **Commitment:** There is no mind, no agent, and no beliefs—only physics, chemistry, and instinct.
  *   **Awkwardness:** You must describe every complex colony decision as "just chemistry" without ever using words like "trying," "wanting," or "knowing."

  ***

  ### MAP NOTES (FOR THE MODERATOR)

  **1. The Three Axes (P, I, A)**
  This tree forces separation of the three concepts you care about:
  *   **Agency (A):** Tested at **Node 1 (Fission)**. If "Broken Halves," the colony isn't a true agent.
  *   **Intentionality (I):** Tested at **Node 2 (Ventriloquist)**. If "Just Pushed," the colony cannot be *wrong*, so it has no beliefs.
  *   **Phenomenology (P):** Tested at **Node 3 (Blind)**. If "Coasts," there is no internal experience.

  **2. The Empty Corner (Unoccupied)**
  *   **Missing Position:** *Phenomenal Blob* (Has Experience, but No Agency and No Beliefs).
  *   **Why Empty:** It is incoherent to argue the colony "feels like something" but cannot be wrong about anything and makes no decisions. Experience usually implies a subject to whom things happen.

  **3. The Indistinguishable Pair**
  *   **The Zombie Agent** vs. **The Patternist**.
  *   **Why:** Both deny consciousness (Phenomenology). Both accept complex information processing. The difference is metaphysical: The Zombie Agent says the *system* is the agent; The Patternist says the *information* is the mind. Behaviorally, they predict the exact same ant actions. A smart guest will argue this distinction is verbal, not real.

  **4. The Unfashionable Spot**
  *   **The Flow Mind**.
  *   **Why:** Most functionalists argue speed doesn't change the *kind* of mind, only the speed of thought. Arguing that slowing the colony down destroys the mind (rather than just slowing it) is a rare, process-heavy view often associated with dynamic systems theory, not standard cognitive science.
