      *   *Claim 6: "...and it pulls you into a political camp rather than the other way about."*
          *   **Status:** Generally supported by research (personality -> ideology), but bidirectional influence exists.
      *   *Claim 7: "Judgement comes first and reasoning comes afterwards." (Social Intuitionist Model)*
