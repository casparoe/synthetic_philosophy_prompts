          *   **Status:** Subjectivist conclusion. Haidt leans pragmatic/pluralist, not necessarily full-blown error theory or subjectivism.
      *   *Claim 12: "The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."*
