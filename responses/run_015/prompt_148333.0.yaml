answer: |-
  This is an excellent reconstruction of a difficult conversation. Your friend has presented a version of Moral Foundations Theory (MFT) that is recognizable but significantly distorted by popularization and philosophical overreach. The theory you both likely encountered is Jonathan Haidt's, most famously articulated in *The Righteous Mind*.

  Below is an audit of your friend's claims, separating the psychological theory from the philosophical conclusions he has drawn from it.

  ### Part 1: Claim-by-Claim Audit

  **1. "Moral judgements run on a handful of innate foundations... evolved to cope with a different recurring problem of living in groups."**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** Proponents accept this. The theory posits that these foundations are "first drafts" of the moral mind, prepared by evolution but edited by culture. The list (Care, Fairness, Loyalty, Authority, Sanctity, Liberty) is the standard current model.

  **2. "Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set..."**
  *   **Verdict:** **Misstatement (Relative converted to Absolute).**
  *   **Correction:** This is the most common distortion of MFT. The data shows differences in *reliance* and *priority*, not presence or absence. Liberals score significantly lower on Loyalty, Authority, and Sanctity, but rarely at zero. They often recode these foundations (e.g., loyalty to the planet, authority of scientific consensus).
  *   **Conflation:** Your friend conflates *statistical average differences* with *categorical exclusion*.

  **3. "...which is why they can build coalitions around nation, tradition and religion and the left cannot."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Nuance:** Haidt argues the Right has a structural advantage in coalition-building because they trigger more foundations. However, saying the Left *cannot* build coalitions is too strong; they build them differently (often around Care/Fairness universality).

  **4. "Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood..."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Nuance:** Twin studies suggest heritability of political temperament is significant (around 40-60%), but "fixed" is too rigid. Life experiences, trauma, and social context can shift foundation weightings.

  **5. "...and it pulls you into a political camp rather than the other way about."**
  *   **Verdict:** **Generally Accepted.**
  *   **Nuance:** Longitudinal data supports the idea that personality traits predict later political identification better than the reverse. However, once in a camp, social reinforcement strengthens the profile (bidirectional causality).

  **6. "Judgement comes first and reasoning comes afterwards."**
  *   **Verdict:** **Accurate (to the theory).**
  *   **Nuance:** This is the "Social Intuitionist Model." Haidt argues intuition is the automatic driver; reasoning is the controlled process that follows.

  **7. "Present people with a harmless taboo violation and they condemn it instantly, flounder... and then manufacture reasons on the spot."**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This describes "moral dumbfounding." It is the primary evidence for Claim 6.

  **8. "So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have."**
  *   **Verdict:** **Overstatement (Absolute claim).**
  *   **Correction:** Haidt argues reasoning is *mostly* for social persuasion and post-hoc rationalization, but he allows that reasoning can occasionally trigger new intuitions in others (the "rational persuasion" exception). "Never" is incorrect.

  **9. "And once you see that, you see that there is no answer to the question of who is right."**
  *   **Verdict:** **Philosophical Non-Sequitur.**
  *   **Correction:** This is where the psychology ends and metaethics begins. MFT is descriptive (how we *do* judge); it cannot logically dictate normative conclusions (how we *should* judge) without additional philosophical premises.

  **10. "Morality is a bundle of evolved reactions... asking whose weighting is correct is like asking whose taste in food is correct."**
  *   **Verdict:** **Contested Interpretation.**
  *   **Nuance:** Haidt leans toward "pluralistic relativism" or "pragmatic functionalism." He suggests different moralities work for different social orders. However, equating morality entirely to taste is a stronger subjectivist claim than Haidt always makes. He often argues some moral matrices are *more functional* for maintaining order, which implies a metric of evaluation.

  **11. "The most that can fairly be said is that the right... commands a wider moral vocabulary, and therefore understands the left better than the left understands it."**
  *   **Verdict:** **Accurate (to Haidt's empirical claims).**
  *   **Nuance:** Haidt's data suggests conservatives are better at predicting liberal responses than vice versa, because conservatives use Care/Fairness *plus* the others, whereas liberals often struggle to simulate the binding foundations (Loyalty, Authority, Sanctity). Note: This is a claim about *empathic accuracy*, not moral *truth*.

  ---

  ### Part 2: Addressing Your Three Sticking Points

  **1. The "Two Foundations" Claim**
  You were right to doubt this. Your friend converted a **relative claim** (Liberals rely *less* on binding foundations) into an **absolute claim** (Liberals *do not use* binding foundations).
  *   **Why it matters:** If liberals truly lacked these foundations, they would be psychopaths regarding group cohesion. In reality, liberals often express Loyalty (to marginalized groups), Authority (of expertise), and Sanctity (of nature/bodily autonomy). They just prioritize them differently.
  *   **Symmetry:** This distortion makes the Right look "complete" and the Left "deficient." Correcting it makes the difference one of *emphasis*, which is less damning for the Left.

  **2. Reasoning After Judgement**
  You were right to suspect the distinction between *order* and *validity*. Your friend called this "evasive," but it is the crucial philosophical pivot.
  *   **The Theory:** MFT says reasoning is often a "press secretary" for intuition.
  *   **The Fallacy:** Even if a press secretary lies about why the President made a decision, the decision itself might still be good. The *origin* of a belief (intuition) does not determine its *truth value*.
  *   **Example:** A mathematician might have an intuition that a theorem is true before proving it. The intuition came first, the reasoning second. That doesn't make the theorem false.
  *   **Symmetry:** This cuts symmetrically. If reasoning is post-hoc, it applies to Conservatives just as much as Liberals. It undermines the claim that Conservative reasoning is "better," only that their *intuitions* cover more terrain.

  **3. The Genetic Fallacy (Psychology $\rightarrow$ No Fact of the Matter)**
  This is the strongest point of contention. You accused him of the genetic fallacy (rejecting a belief based on its origin rather than its merit). His "brain lesion" counter-argument is a standard move in debunking realism, but it fails here.
  *   **The Flaw:** The brain lesion analogy works for math (2+2=4) because math is generally considered mind-independent. If your belief in 2+2=4 came from a lesion, you'd doubt it because the lesion disconnects you from reality.
  *   **The Moral Difference:** Morality is arguably mind-*dependent*. If morality is about human flourishing, then human psychology *is* the reality we are measuring.
  *   **The Leap:** Your friend moves from "Morality is evolved" to "Morality is arbitrary." This does not follow. An evolved trait can be objectively good *for the purpose it evolved*. (e.g., "Eyes evolved to see" does not mean "Seeing is an illusion").
  *   **Conclusion:** The psychological findings **do not** settle the metaethical question. They show morality is human, not that it is groundless.

  ---

  ### Part 3: The Longitudinal Study Hypothetical

  You asked what it would mean if a study proved foundations are heritable, stable, and predict party ID.

  *   **What it would establish:** It would confirm that political ideology is largely a expression of underlying psychological temperament. It would strengthen the **descriptive** claim that politics is "identity-expressive" rather than "policy-analytic."
  *   **What it would NOT establish:** It would not prove there is "no fact of the matter" regarding who is right.
      *   *Analogy:* Suppose we find that a taste for sugary fat is heritable and predicts survival in ice ages. That explains *why* we like it. It does not prove that sugar is objectively "good" for us in a modern context, nor does it prove there is no objective fact about nutrition.
  *   **Your Friend's Error:** He assumes that if a belief is caused by temperament, it cannot be true. This is only true if you assume moral truths must be "discovered" like math, rather than "constructed" like law or language. If morality is a human technology for social living, then finding out how the technology is wired tells us nothing about whether the technology works.

  ---

  ### Part 4: Symmetry and Conclusions

  **Does the argument cut symmetrically?**
  *   **Psychologically:** Yes. MFT claims *everyone* uses intuition first. Both sides rationalize.
  *   **Sociologically:** No. Your friend's summary claims the Right has a "wider vocabulary" and understands the Left better. This is an asymmetrical claim favoring the Right's *capacity for empathy/prediction*.
  *   **Philosophically:** No. By concluding "there is no answer to who is right," he creates a symmetry of ignorance. However, by adding "the Right understands the Left better," he implicitly grants the Right a superior epistemic position (they see the whole picture; the Left sees only part).

  **Where he quietly converted Relative to Absolute:**
  1.  **Foundations:** "Liberals score lower" $\rightarrow$ "Liberals run on only two."
  2.  **Reasoning:** "Reasoning is often post-hoc" $\rightarrow$ "Argument is *never* really an argument."
  3.  **Truth:** "Morality is evolved" $\rightarrow$ "There is *no* fact of the matter."

  ### Summary for Your Next Conversation

  Your friend has conflated **Moral Psychology** (how we judge) with **Metaethics** (what makes judgments true).

  1.  **On the Foundations:** Remind him that MFT shows differences in *volume*, not on/off switches. Liberals use the binding foundations, just differently.
  2.  **On Reasoning:** The fact that reasoning follows intuition explains *persuasion*, not *truth*. A lawyer's closing argument comes after the verdict is formed in the jury's mind, but the verdict can still be just.
  3.  **On Truth:** The "brain lesion" analogy fails because morality is not math. Even if morality is evolved, it can still be objectively better or worse at achieving human flourishing. MFT explains the *instrument*, not the *goal*.

  Your friend's version is a "Strong Pop-Haidt" position: it takes the most provocative rhetorical flourishes from the popular book and treats them as settled scientific and philosophical facts. The actual theory is more modest: it suggests we are all partially blind, and that understanding our blindness is the only way to see better. It does not declare the game unwinnable.
