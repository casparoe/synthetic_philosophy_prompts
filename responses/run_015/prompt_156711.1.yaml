answer: |-
  # HERITAGE APPROVAL PROTOCOL: LIFE-SERVICE CHECKLIST
  **Time Limit:** 10 Minutes per Pitch | **Format:** One-Page Summary
  **Purpose:** Ensure history proposals serve the living community, not dead weights.
  **Framework:** Balanced use of Inspiration (Monumental), Preservation (Antiquarian), and Judgment (Critical).

  ---

  ## STEP 1: THE INSPIRATION GATE (Monumental)
  *Does this proposal offer models for current action?*

  1.  **Q:** Does the narrative highlight specific deeds/figures to inspire current community goals?
      *   **Yes:** Proceed to 1.2.
      *   **No:** Mark [LOW MONUMENTAL]. Proceed to Step 2.
  2.  **Q:** [FACT CHECK] Are the highlighted claims verifiable against public records?
      *   **Yes:** Proceed to 1.3.
      *   **No:** **HARD NO.** (Myth-making damages trust).
  3.  **Q:** [VALUE FLAG] Does the inspiration rely on erasing significant suffering to maintain the hero image?
      *   **Yes:** **HAND-OFF TO OFFICER.** (Requires judgment on harm vs. inspiration).
      *   **No:** **PASS.**

  ## STEP 2: THE ROOTS GATE (Antiquarian)
  *Does this proposal preserve connection without mummification?*

  1.  **Q:** Does the project preserve artifacts/sites with reverence for origin?
      *   **Yes:** Proceed to 2.2.
      *   **No:** Mark [LOW ANTIQUARIAN]. Proceed to Step 3.
  2.  **Q:** [VALUE FLAG] Is the preservation linked to a *living* community purpose (education, use, gathering)?
      *   **Yes:** **PASS.**
      *   **No:** **HARD NO.** (Hoarding deadens the present).

  ## STEP 3: THE LIBERATION GATE (Critical)
  *Does this proposal allow the community to judge the past to move forward?*

  1.  **Q:** Does the narrative acknowledge harm, conflict, or injustice associated with the site?
      *   **Yes:** Proceed to 3.2.
      *   **No:** Mark [LOW CRITICAL]. Proceed to Step 4.
  2.  **Q:** [VALUE FLAG] Does the judgment offer a path to healing or continued agency?
      *   **Yes:** **PASS.**
      *   **No:** **HARD NO.** (Nihilism destroys identity).

  ## STEP 4: THE BALANCE CHECK (Life-Service)
  *Does the mix empower the town today?*

  1.  **Q:** Count the Modes. Does the proposal score **PASS** in at least **two** of the three Steps above?
      *   **Yes:** **TECHNICAL APPROVAL.**
      *   **No:** **REJECT.**
  2.  **Q:** [OFFICER JUDGMENT] Even if technically approved, does the dominant mode silence a key stakeholder group (workers, neighbors, minorities)?
      *   **Yes:** **HAND-OFF TO OFFICER.** (Checklist cannot measure exclusion).
      *   **No:** **FINAL APPROVAL.**

  ---

  ## APPLICATION TEST CASES

  ### PITCH A: "The Founder's Vision Walk"
  **Summary:** Guided tour focusing on the mill founder's technological innovations. Highlights patents, production records, and philanthropy. Zero mention of labor strikes, safety incidents, or pollution. Uses original machinery as backdrops.

  **Checklist Evaluation:**
  *   **Step 1 (Inspiration):**
      *   Q1: Yes (Innovator model).
      *   Q2: Yes (Patents are verifiable).
      *   Q3: **HAND-OFF.** (Erasing suffering to maintain hero image). *Officer Note: Pitch does not explicitly lie, just omits. Technically passes verification.* -> **PASS (Conditional)**
  *   **Step 2 (Roots):**
      *   Q1: Yes (Uses original machinery).
      *   Q2: Yes (Educational tour). -> **PASS**
  *   **Step 3 (Liberation):**
      *   Q1: No (No mention of conflict). -> **LOW CRITICAL**
  *   **Step 4 (Balance):**
      *   Q1: Score = 2 Passes (Inspiration + Roots). -> **TECHNICAL APPROVAL.**
      *   Q2: **HAND-OFF.** (Dominant mode silences workers).

  **Outcome:** **TECHNICALLY APPROVED.**
  **Officer Note:** The checklist clears it because it verifies facts (patents exist) and preserves artifacts (machines). It fails to catch that the *silence* on strikes is a structural distortion. It passes because omission isn't falsification.

  ### PITCH B: "The Rust Archive"
  **Summary:** Collection of every broken machine part found on site. Cataloged by date and metallurgy. No guides, no narrative panels, no community events. Goal is "total preservation of material history."

  **Checklist Evaluation:**
  *   **Step 1 (Inspiration):**
      *   Q1: No (No narrative model). -> **LOW MONUMENTAL**
  *   **Step 2 (Roots):**
      *   Q1: Yes (Reverence for objects).
      *   Q2: **NO.** (No living community purpose; purely storage). -> **HARD NO.**
  *   **Step 3 (Liberation):**
      *   Q1: No. -> **LOW CRITICAL**
  *   **Step 4 (Balance):**
      *   Q1: Score = 0 Passes. -> **REJECT.**

  **Outcome:** **REJECTED.**
  **Officer Note:** Fails the "Life-Service" test. It treats objects as idols unrelated to human experience.

  ---

  ## BLIND SPOT ANALYSIS: WHY PITCH A FEELS WRONG

  Pitch A received **Technical Approval** but creates a sense of unease. The checklist failed to catch the **Politics of Voice**.

  **What the Checklist Missed:**
  1.  **Agency vs. Content:** The checklist evaluates the *text provided*, not the *authorship*. Pitch A is written by the historical society (elite perspective), not the labor unions (worker perspective). The checklist asks "Is conflict acknowledged?" but not "Who is allowed to define the conflict?"
  2.  **Omission as Distortion:** Step 1, Q3 flags "erasing suffering," but relies on the officer to prove it. In a 10-minute review, omission looks like neutrality. Nietzsche warns that Monumental history becomes toxic when it turns the past into a myth that crushes the present. By approving a "Hero Walk" without a counter-narrative, we validate the founder's power over the worker's memory.
  3.  **The "Life" Definition:** Step 4 asks if it empowers the town. For investors, Pitch A empowers. For descendants of strikers, it insults. The checklist assumes a unified "community" rather than competing interests.

  **Fix for Next Cycle:** Add a mandatory "Stakeholder Sign-off" requirement before Step 1. If the labor heritage group hasn't signed the narrative, the project cannot enter the checklist. This moves the judgment from *content analysis* (which can be gamed) to *process equity* (which is structural).
