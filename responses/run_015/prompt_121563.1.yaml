answer: |-
  **The Scenario**
  Elias, a lucid adult patient with a rare genetic marker, signs the "Tier-4 Research Integration Form" at a private clinic. He reads every clause carefully: he knows his genomic data will be sold to third parties, he knows he forfeits all future royalties, and he knows he cannot withdraw data once anonymized. He believes he is entering a **Collaborative Partnership**, viewing the signature as a pledge of mutual aid where he retains moral standing as a stakeholder in the science. The contract, however, legally instantiates a **Resource Extraction Agreement**, categorizing him not as a partner but as a "biological venue," structurally severing his future right to object to *how* the data is used (e.g., by defense contractors) based on the premise that a venue has no moral preference. No words were hidden; the clause "Subject assumes status of biological venue" was bolded. Elias read it but interpreted "venue" as a metaphor for "contributor," failing to grasp it was a literal legal reclassification of his standing from moral agent to raw material source.

  ***

  **Verification of Standard Conditions**
  1.  **Capacity:** Elias is fully competent; he is lucid, understands the language, and suffers no cognitive impairment.
  2.  **Voluntariness:** There is no coercion; he is not threatened with withheld care, nor is he under duress; he could walk away without penalty.
  3.  **Information:** There is no deception; every material fact regarding data usage, profit forfeiture, and irreversibility was explicitly disclosed and read by Elias.

  **The Damaging Feature: Ontological Frame Mismatch**
  The rot stems from a **categorical misalignment** rather than an informational deficit. Elias possesses *propositional knowledge* (he knows *what* will happen to his data) but lacks *structural knowledge* (he does not know *what kind of thing* he is becoming in the process). He understands the physical consequences but misidentifies the normative status of the act. He thinks he is performing a **Gift** (which implies a continuing moral relationship), while the contract enacts a **Severance** (which terminates moral standing). The consent feels rotten because he authorized a physical outcome without authorizing the ontological demotion required to make that outcome permissible.

  **The Defender's Counter-Argument**
  A defender of the standard three-condition model (e.g., a strict libertarian or legal formalist) would argue that consent is valid because it attaches to **actions**, not **meanings**. They would claim that as long as Elias understood the empirical consequences (data sold, no veto), his internal interpretation of the relationship (partner vs. venue) is subjective flavoring, not a condition of validity. They would argue that requiring understanding of "ontological status" sets an impossible bar, as legal categories often diverge from lay intuition, and the law protects the clarity of the text, not the warmth of the sentiment.

  **What Collapses if the Feature is Removed**
  If you remove the ontological mismatch—meaning Elias fully grasps that signing makes him a "biological venue" and not a "partner"—the moral rot vanishes, leaving only a hard bargain. If he understands the categorical demotion and signs anyway, the consent is robust (perhaps tragic, but valid). If he understands it and refuses, the transaction doesn't happen. The "rot" specifically depends on the **unintended normative shift**; without the gap between the agent's perceived category (Partner) and the actual category (Resource), the tension dissolves into either legitimate agreement or legitimate refusal.
