prompt: |-
  I’m drafting a scene for my novel and got into a row with my mate over pints about whether consent is ever really valid if the person giving it doesn’t realise they’re stepping into a completely different kind of agreement. Could you construct a thought experiment for me — realistic, hospital or workplace, not some trolley rubbish — where deception, coercion, and incompetence are all definatly absent, yet the consent still feels rotten? I want the rot to come from a niche idea I’m calling an ontological frame mismatch: the consenter understands every individual fact presented, is fully competent, and faces no pressure, but they don’t grasp the categorical kind of act they’re authorising — like signing what they think is a routine treatment waiver but is actually, in structural terms, a waiver of future legal personhood in that clinical domain. Keep the scenario itself to one paragraph, then check off each of the three standard conditions and show they’re satisfied, identify the exact feature doing the damage, and explain how a defender of the three-condition model would try to save the consent. Also say what collapses if you remove that niche feature, and don’t just hand me a bibliography — I need the reasoning laid out properly.
