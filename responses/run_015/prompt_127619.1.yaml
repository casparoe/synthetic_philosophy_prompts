prompt: |-
  I'm running a small coaching practice for grad students and freelancers who keep missing deadlines they 'definitely wanted' to make, and I was talking with a friend who teaches philosophy who said I'm probably just reinventing akrasia vs hyperbolic discounting. Maybe, but I still need an actual intake procedre I can run in about 45 minutes that tells me which failure mode we're dealing with, if any, and exactly where I should stop and refer out rather than coach.

  Turn the philosophical distinction between weakness of will and hyperbolic discounting into a reusable decision flowchart — ordered questions, what counts as a sufficient answer to each, hard stops for 'this is values, not psychology' or 'this is neither,' and honest flags for where judgment can't be eliminated. I want you to build in a 'temporal authority check' as a gate: it should test whether the client's planning self was sufficiently informed and not under acute stress when it set the goal, and that result should control whether hyperbolic discounting even applies. Don't treat it as an afterthought; make it a real decision node with conditions.

  Apply it to three cases: (a) a PhD student who had the grant draft finished but missed the portal deadline, (b) a freelancer who delayed invoicing for three months until rent was due, and (c) one case where the procedure returns an answer you'll probably dislike — like labeling a choice as rational discounting when it looks like moral failure. Be explicit about what the procedure flat-out can't settle and where human judgment sneaks in despite the flowchart. End with one line starting 'Bottom line:' summarizing the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested intake procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 45-minute intake procedure/decision flowchart for a coaching practice targeting grad students and freelancers who miss deadlines.
      *   **Core Distinction:** Differentiate between *Akrasia* (weakness of will/values conflict) and *Hyperbolic Discounting* (time-inconsistent preferences).
      *   **Specific Requirement:** Include a "Temporal Authority Check" as a gate to determine if the planning self was informed/unstressed enough for hyperbolic discounting to apply.
      *   **Output:** Ordered questions, sufficient answers, hard stops (refer out), flags for judgment calls.
      *   **Application:** Apply to three specific cases (PhD grant, Freelancer invoicing, Controversial case).
      *   **Constraint:** End with a one-line summary starting with "Bottom line:".
      *   **Tone:** Practical, philosophical but actionable, honest about limitations.

  2.  **Deconstruct the Concepts:**
      *   *Akrasia:* Acting against one's better judgment. "I know X is best, I want X, but I do Y." Often implies a values conflict or executive function issue, not just time preference.
      *   *Hyperbolic Discounting:* Valuing immediate rewards disproportionately higher than future rewards. "I want to finish the paper (future), but scrolling Twitter (now) feels way better." The preference *changes* over time.
      *   *Temporal Authority Check:* Did the "Past Self" who set the deadline have the right to bind the "Present Self"? Were they sane, informed, and calm? If Past Self was manic/ignorant/pressured, Present Self's rebellion isn't necessarily akrasia or discounting; it might be correction.

  3.  **Drafting the Flowchart (The Intake Procedure):**
      *   *Timebox:* 45 minutes total.
      *   *Structure:* Needs to move from facts to psychology to values.
      *   *Node 1: The Temporal Authority Check (The Gate).* This is crucial. If the goal was set under duress or ignorance, hyperbolic discounting doesn't apply because the preference wasn't stable/valid to begin with.
      *   *Node 2: Preference Stability.* Does the client *still* want the goal?
      *   *Node 3: The Barrier.* Is it emotional avoidance (Akrasia) or calculation (Discounting)?
      *   *Hard Stops:* Mental health issues, values misalignment, external constraints.

  4.  **Refining the Questions & Conditions:**
      *   *TAC:* Ask about the state of mind when the goal was set. Stress levels, information available.
      *   *Preference:* Ask "If you could snap your fingers, would you have done it?"
      *   *Discounting:* Ask about the trade-off made at the moment of failure. Was there a specific immediate gratification?
      *   *Akrasia:* Ask about the feeling during the avoidance. Guilt? Dread?

  5.  **Developing the Three Cases:**
      *   *(a) PhD Student:* Missed portal deadline despite draft being done.
          *   *Analysis:* Draft done = capability there. Missed admin = executive function or avoidance. TAC likely valid (grant is important).
      *   *(b) Freelancer:* Invoicing delayed until rent due.
          *   *Analysis:* Pain of rent (immediate threat) overcame pain of admin. Classic hyperbolic discounting (avoiding admin now vs. paying rent later).
      *   *(c) The Controversial Case:* Needs to look like moral failure but be labeled rational discounting (or vice versa). Let's try: A caregiver who promised to visit a parent but didn't because they needed sleep.
          *   *Analysis:* Looks like "flaking" (moral failure). Actually, Present Self prioritized basic physiological need over Past Self's social promise. TAC might be flawed (Past Self overcommitted). Procedure might label this "Rational Correction" rather than Akrasia. Or, let's go with the prompt's suggestion: "labeling a choice as rational discounting when it looks like moral failure." Let's use a case where someone chooses leisure over a high-stakes commitment, and the flowchart says "Hyperbolic Discounting" (treatable with commitment devices) but it feels like they just don't care enough (Values).

  6.  **Addressing Limitations & Judgment:**
      *   Where does the flowchart fail? It can't measure *truth*. Clients lie to themselves. It can't measure *moral weight*.
      *   Need to explicitly state where the coach's intuition overrides the script.

  7.  **Review against Constraints:**
      *   45-minute intake? Yes, structure needs to reflect that.
      *   Temporal Authority Check included as a gate? Yes.
      *   Hard stops for referral? Yes (clinical depression, values mismatch).
      *   Three cases applied? Yes.
      *   One-line summary at the end? Yes.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on TAC:* Make sure TAC isn't just "were you stressed?" It needs to be "was the planning self competent?"
      *   *Self-Correction on Akrasia vs. Discounting:* Akrasia is "I want A, I do B, I hate myself." Discounting is "I want A (later), but B (now) is worth more *right now*." The distinction is subtle. I need to make the questions sharp.
      *   *Referral Criteria:* If it's ADHD, refer to specialist. If it's depression, refer to therapist. If it's "I don't actually want this," refer to career counselor.

  9.  **Final Polish:**
      *   Ensure the tone is professional yet direct.
      *   Check the "Bottom line" constraint.
      *   Make sure the "Controversial Case" highlights the friction between the model and moral intuition.

  **(Self-Correction during drafting Case C):** The prompt asks for a case where the procedure returns an answer I'll *probably dislike* — like labeling a choice as rational discounting when it looks like moral failure.
  *   *Idea:* A student who promises to help a friend move but bails to play video games.
  *   *Moral view:* You're a flake.
  *   *Flowchart view:* Past Self overvalued social capital; Present Self discounted future social cost for immediate dopamine. This is hyperbolic discounting.
  *   *Why I might dislike it:* It pathologizes a character flaw. It suggests a "commitment device" (e.g., bet money) fixes what is actually a lack of care. I need to be honest about this limitation.

  10. **Finalizing the Flowchart Steps:**
      1.  Temporal Authority Check (Gate).
      2.  Preference Consistency Check.
      3.  Immediate Gratification Identification.
      4.  Affect/Emotion Check.
      5.  Referral/Coaching Decision.

  11. **Final Review of the "Bottom Line":** Must start with "Bottom line:".

  Let's write it.cw
answer: |-
  # The Temporal-Alignment Intake (45-Minute Protocol)

  **Purpose:** Distinguish between *Akrasia* (conflict of will/values), *Hyperbolic Discounting* (time-inconsistent preferences), and *Invalid Planning* (Past Self error) to determine coaching viability.
  **Timebox:** 45 Minutes.
  **Coach Stance:** Investigative, non-judgmental, but rigid on the decision nodes.

  ---

  ## Part 1: The Temporal Authority Check (TAC)
  **Time:** 0–15 Minutes
  **Function:** Gatekeeper. Hyperbolic discounting assumes the "Planning Self" had valid authority over the "Acting Self." If the Planning Self was compromised, the failure is not a psychological glitch; it is a data error.

  **Question 1.1:** "When you set this deadline/goal, what was your physiological and informational state?"
  *   **Sufficient Answer for 'Valid Authority':** "I was calm, had reviewed similar past tasks, and wasn't under acute threat (e.g., panic, mania, extreme fatigue)."
  *   **Sufficient Answer for 'Invalid Authority':** "I was panicking about money," "I was manic/exhausted," or "I didn't know how long the task actually took."

  **Question 1.2:** "If you could talk to the version of you who set this goal, would you trust their judgment today?"
  *   **Sufficient Answer for 'Valid Authority':** "Yes, they knew what they were doing."
  *   **Sufficient Answer for 'Invalid Authority':** "No, they were delusional/ desperate."

  **🛑 HARD STOP 1 (Invalid Authority):**
  If the client answers "Invalid Authority" to either:
  *   **Diagnosis:** Planning Error / Values Misalignment.
  *   **Action:** **Do not coach on execution.** Refer to career counseling (goal selection) or therapy (anxiety/trauma driving the planning state).
  *   **Reasoning:** You cannot fix "discounting" if the original valuation was coerced.

  ---

  ## Part 2: Preference Stability & The Moment of Failure
  **Time:** 15–30 Minutes
  **Function:** Distinguish between changing preferences (Discounting) and acting against stable preferences (Akrasia).

  **Question 2.1:** "At the exact moment you chose *not* to do the task, did you believe doing the task was the better option?"
  *   **Yes:** Proceed to 2.2. (Suggests Akrasia).
  *   **No:** "At that moment, not doing it felt better." Proceed to 2.3. (Suggests Discounting).

  **Question 2.2 (Akrasia Path):** "Did you feel guilt, dread, or self-loathing *while* avoiding the task?"
  *   **Sufficient Answer:** "Yes, I felt terrible the whole time."
  *   **Diagnosis:** **Classic Akrasia.** The will is fractured.
  *   **Coaching Viability:** High. Focus on emotional regulation and self-compassion.

  **Question 2.3 (Discounting Path):** "What specific immediate reward did you gain by delaying?"
  *   **Sufficient Answer:** A tangible relief or pleasure (e.g., "Avoided anxiety," "Watched TV," "Slept").
  *   **Diagnosis:** **Hyperbolic Discounting.** The value of 'Now' outweighed the value of 'Later.'
  *   **Coaching Viability:** High. Focus on commitment devices and shrinking the feedback loop.

  **🛑 HARD STOP 2 (Values Conflict):**
  If the client says in 2.1: "I didn't think it was the better option," AND in 2.3: "I gained nothing, I just didn't care."
  *   **Diagnosis:** **Values Misalignment.**
  *   **Action:** **Refer out.** This is not a failure of will or time; it is a lack of desire. Coaching cannot manufacture desire.

  ---

  ## Part 3: The Judgment Flag & Referral
  **Time:** 30–45 Minutes
  **Function:** Identify clinical or structural issues the flowchart cannot see.

  **Question 3.1:** "Does this pattern happen in *every* area of your life (hygiene, relationships, taxes), or just this work?"
  *   **Everywhere:** **🛑 HARD STOP 3.** Flag for ADHD/Depression evaluation. Refer to psychologist. Coaching is insufficient.
  *   **Just Work:** Proceed to Contract.

  **Question 3.2 (The Integrity Check):** "On a scale of 1–10, how much do you actually want this outcome, independent of external pressure?"
  *   **< 5:** **🛑 HARD STOP 4.** Refer to career counseling.
  *   **> 5:** **Clear for Coaching.**

  ---

  ## Application to Cases

  ### Case (a): The PhD Student (Grant Draft Finished, Missed Portal)
  *   **TAC:** Valid. Setting a grant deadline is usually done calmly; the student knew the portal existed.
  *   **Preference Stability:** At the moment of missing the deadline, did they think submitting was better? **Yes.**
  *   **Affect:** Did they feel dread? **Yes.**
  *   **Flowchart Result:** **Akrasia.**
  *   **Analysis:** The work was done (capability exists). The failure was administrative avoidance despite knowing the value. The "Planning Self" was right; the "Acting Self" sabotaged.
  *   **Coaching Plan:** Focus on the specific anxiety around "final submission" and bureaucratic friction.

  ### Case (b): The Freelancer (Invoicing Delayed Until Rent Due)
  *   **TAC:** Valid. Freelancers know invoicing is required.
  *   **Preference Stability:** At the moment of delay, did they think invoicing was better? **No.** They thought "Relief from admin" > "Future Money."
  *   **Trigger:** Rent due date created a pain spike that overrode the abstract pain of cash flow risk.
  *   **Flowchart Result:** **Hyperbolic Discounting.**
  *   **Analysis:** The value of money became hyperbolic. $0 now (but no admin) felt worse than $0 later (with panic). The preference flipped based on temporal proximity of the pain.
  *   **Coaching Plan:** Commitment devices. Auto-invoicing or accountability partner *before* the rent crisis hits.

  ### Case (c): The "Moral Failure" (The Flaky Friend)
  *   **Scenario:** A client promises to help a friend move on Saturday. Friday night, they stay home to play video games. They say, "I knew I should go, but the couch felt better."
  *   **TAC:** Valid. They made the promise soberly.
  *   **Preference Stability:** At the moment of choice, the couch felt better. (Discounting Path).
  *   **Flowchart Result:** **Hyperbolic Discounting.**
  *   **Why I Dislike This:** The flowchart treats this as a *mechanical* error in time-valuation solvable by commitment devices (e.g., "Bet $100 you'll show up"). It ignores the **moral dimension**. Labeling this "discounting" sanitizes a breach of trust. It suggests the client *values* the friend but is "glitched," when they may simply value the friend *less* than they claim.
  *   **Where Judgment Sneaks In:** The coach must override the flowchart if the "Immediate Reward" (video games) consistently trumps "Social Integrity." If the client accepts the "Discounting" label without remorse, the issue isn't time-preference; it's character/values. The flowchart cannot measure *integrity*, only *consistency*.
  *   **Correction:** If this pattern repeats, move to **Hard Stop 2 (Values Misalignment)** despite the Discounting diagnosis.

  ---

  ## Limitations & Human Judgment Flags

  1.  **Self-Report Reliability:** The TAC relies on the client's memory of their past mental state. They may romanticize their "Planning Self" to avoid admitting they set unrealistic goals. *Coach Judgment:* Cross-reference with email timestamps or calendar data if possible.
  2.  **The "Rationalization" Trap:** Clients are expert lawyers for their own defense. They will frame Values Misalignment ("I don't care about this") as Hyperbolic Discounting ("I just procrastinated") because the latter is fixable. *Coach Judgment:* Watch for lack of emotional affect when discussing the missed deadline. Akrasia hurts; Indifference does not.
  3.  **The Moral Blindspot:** As seen in Case (c), the model treats all failures as cognitive/mechanical. It cannot distinguish between "I couldn't" (psychology) and "I wouldn't" (ethics). *Coach Judgment:* If the cost of failure is borne by others (not just the client), raise the bar for "Valid Authority."

  Bottom line: This procedure mechanizes the diagnosis of procrastination to save time, but it requires your ethical intuition to override the result when the client's "glitch" consistently harms others.
