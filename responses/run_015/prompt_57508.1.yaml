  Also work in the two objections he mentioned in passing — something about how deliberation kills independence, since jurors who talk to each other stop being independent, and something about how if people genuinely believed the theorem they'd stop voting their own judgment and start voting strategically. I want to know what those two translate into for me, if anything. I have a feeling one of them has a perfect analog in my world and the other has no analog whatsoever.

  No reading list, no citations, no paper titles — I'm not going to look anything up and I don't want you guessing at them. Just reason it through from the theorem and from what replicas actually do.

