  I'm prepping my talk for next thursday's interdiscplinary workshop and I'm kinda stuck on the Q&A prep. I'm defending this idea I call "scaffolded cranes" — cultural evolution builds bottom-up like Dennett's cranes, but it relies on temporary environmental scaffolding (institutional norms, writing systems, that kind of thing) that gets internalized over generations and then can fall away. So it's not a skyhook smuggling teleology back in, and it's also not greedy reductionism that flattens culture into gene-level selection or treats memes as replicators with fully independent fitness. The audience is half evolutionary biologists who think philosophers overanalyze mechanisms, and half philosophers of biology who worry dual-inheritance models commit greedy reduction by assuming cultural traits have autonomous evolutionary dynamics decoupled from genetic fitness. I need them to see the scaffold is genuinely temporary and environmental, not hidden emergence and not hidden purpose.

