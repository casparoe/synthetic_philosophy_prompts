      *   **Verdict:** Does the conclusion survive? (No, it oversimplifies).
      *   **Better Analogy:** The Mapmaker or Game Designer. (Let's choose **Game Designer/Chess** for the "invented rules, discovered consequences" nuance, or **Mapmaker** for the "representation" nuance. Mapmaker is better for the "discovery" feel. Let's go with **Mapmaker**). *Self-Correction:* The prompt asks for a nominalist position. Nominalism says universals don't exist. Maps are particular representations. **Legal Code** is also good. Let's stick with **Mapmaking** but emphasize the *convention* aspect. Actually, **The Game of Chess** is the standard philosophical counter to pure fiction. Let's use **Game Design**. It highlights that rules are arbitrary (nominalist) but gameplay is necessary (objective).

      *   *Re-evaluating the "Better Analogy":* The prompt asks for a better one *for the nominalist position*. Fictionalism *is* a type of nominalism. The colleague's analogy is weak fictionalism. A stronger nominalist analogy needs to account for utility without Platonism. **Instrumentalism/Toolbox.** Math is a toolkit. Hammers aren't "true," they are "useful."
      *   *Let's try the "Language" Analogy.* We invent words, but we can't say anything we want.
