prompt: |-
  my colleague who teaches math ed keeps using the fiction analogy: numbers and sets are like Sherlock Holmes characters -- they dont exist physically, but we talk about them consistently across stories, so platonism is a category mistake and math should be taught as creative writing rather than discovery. lay out the correspondence table (author, canon, plot holes, etc.), point out where the mapping breaks (do we invent prime numbers or find them?), identify what the "mere fiction" framing quietly assumes about value, and tell me whether the anti-platonist conclusion survives once those breaks are on the table. if the analogy collapses, suggest a better one for the nominalist position.
