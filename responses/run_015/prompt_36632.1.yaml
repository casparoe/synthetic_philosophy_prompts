answer: |-
  # Standard of Adequacy: The Realization Relation

  **Unit Context:** Functionalism in the Metaphysics of Science
  **Objective:** To evaluate competing accounts of realization based on their ability to sustain non-reductive physicalism.

  ## I. The Requirements List

  To count as an adequate account of realization in this context, a theory must satisfy the following constraints. Each is motivated by a specific metaphysical or scientific pressure point.

  **1. The Heterogeneity Constraint (Multiple Realizability)**
  *   **Requirement:** The account must allow a single higher-level property type to be realized by physically diverse lower-level property types across different contexts or species.
  *   **Motivating Case:** The property *being a heart* is realized by mammalian muscle tissue, avian muscle tissue, and potentially silicon pumps in artificial life. If the account forces a one-to-one mapping between the functional type and the physical type, it collapses into type-identity theory and fails to capture the generalizability of the special sciences.

  **2. The Promiscuity Constraint (Context Sensitivity)**
  *   **Requirement:** The account must allow a single physical structure to realize distinct higher-level properties depending on the relational or environmental context.
  *   **Motivating Case:** A specific neural firing pattern might realize *pain* in a human but *itch* in a different organism, or *memory storage* in one circuit and *logic gate* in another, depending on the role played within the larger system. An adequate account cannot treat physical structures as having fixed functional identities independent of their systemic role.

  **3. The Causal Inheritance Constraint**
  *   **Requirement:** The causal powers of a realized property must be fully grounded in, and exhausted by, the causal powers of its realizer base. The realized property cannot confer *new* causal powers over and above those of the realizer.
  *   **Motivating Case:** If a mental state causes an arm to rise, there must be a physical story about muscles contracting and neurons firing that accounts for this motion. If the mental property added "extra" causal oomph not present in the physical base, it would violate the causal closure of the physical domain.

  **4. The Distinctness Constraint (Non-Identity)**
  *   **Requirement:** Despite Causal Inheritance, the realized property must remain metaphysically distinct from the realizer property. Realization cannot be reduced to token-identity or type-identity.
  *   **Motivating Case:** We can conceive of the pain existing without *this specific* C-fiber firing (and vice versa). If realization is just identity, we lose the ability to explain why the special sciences use vocabulary that does not map neatly onto physics, and we lose the modal flexibility required for multiple realizability.

  **5. The Relation Distinction Constraint**
  *   **Requirement:** The account must clearly distinguish realization from causation, supervenience, and mechanistic constitution.
  *   **Motivating Case:** The heart's pumping *causes* blood flow, but the heart's structure *realizes* the pumping function. Supervenience is a modal correlation, not a constitutive relation. If realization is just "synchronic causation" or "bare supervenience," it fails to explain the *in virtue of* relation that grounds the hierarchy of sciences.

  **6. The Base Scope Constraint**
  *   **Requirement:** The account must specify the ontological boundaries of the realizer base. It must determine whether a realizer must be an intrinsic property of an individual, or if it can include relational properties, environmental features, or distributed ensemble states.
  *   **Motivating Case:** Does the realization of *remembering a phone number* end at the skull, or does it include the notebook in the pocket? An adequate account cannot simply assume methodological individualism without argument; it must dictate whether "wide" realization is metaphysically permissible.

  **7. The Granularity Constraint (Token/Type Disambiguation)**
  *   **Requirement:** The account must explicitly state whether it is defining a relation between property *types* or property *tokens*.
  *   **Motivating Case:** Disagreements often arise because one theorist claims "Pain is multiply realized" (type claim) while another argues "This specific pain instance is identical to this specific brain state" (token claim). An adequate account must prevent equivocation between the generalizability of kinds and the singularity of instances.

  ***

  ## II. Philosophical Analysis of the Standard

  ### Desiderata vs. Prejudices
  Not all entries in the Standard of Adequacy are neutral metaphysical requirements; some encode specific philosophical commitments that should be treated as contestable prejudices.

  *   **Genuine Desiderata:** The **Heterogeneity** and **Promiscuity** constraints are hard data points for functionalism; if a theory cannot handle them, it is not functionalism. The **Relation Distinction** constraint is methodologically necessary to prevent category errors.
  *   **Contestable Prejudices:**
      *   **The Causal Inheritance Constraint:** This is often presented as a requirement of physicalism, but it is specifically a requirement of *non-emergentist* physicalism. A robust emergentist would reject this, arguing that higher-level properties *do* confer novel powers. Treating this as a fixed standard rigs the game against emergentism before the unit begins.
      *   **The Base Scope Constraint:** The framing often presupposes that realizers must be "below" or "within" the individual. This is a prejudice of traditional functionalism against extended cognition and enactivism. If realization can be "flat" or distributed, the requirement that realizers be "lower-level" intrinsic properties is a historical artifact, not a metaphysical necessity.
      *   **The Distinctness Constraint:** While central to non-reductive physicalism, this is a prejudice against reductive physicalism. If identity theory is true, this constraint is false. It should be treated as a goal to be earned, not an axiom.

  ### Incompatibilities: The Non-Reductive Trilemma
  The most critical outcome of this unit should be the recognition that **The Causal Inheritance Constraint**, **The Distinctness Constraint**, and the **Causal Closure of the Physical** (implicit in Inheritance) form a trilemma. It is highly probable that these three cannot be jointly satisfied without residual tension.

  1.  If you satisfy **Inheritance** and **Closure**, you are pushed toward **Identity** (violating Distinctness). If the physical base does all the causing, and the realized property is distinct, the realized property appears to be an epiphenomenal dangler.
  2.  If you satisfy **Distinctness** and **Inheritance**, you risk violating **Closure** (via overdetermination). If both the distinct mental property and the physical property cause the effect, and their powers are not identical, you have two sufficient causes for one effect.
  3.  If you satisfy **Distinctness** and **Closure**, you must weaken **Inheritance**. This leads to emergentism, where the higher level has powers not strictly exhausted by the lower level.

  If this trilemma holds, the "Standard of Adequacy" itself describes an impossible object. The unit's goal then shifts from finding the theory that meets the standard to finding the theory that best explains *why* we must relax one of these constraints.

  ### The Most Exclusionary Requirement
  The single requirement that excludes the most otherwise-plausible accounts is **The Causal Inheritance Constraint**.

  *   **Why:** This constraint is the primary engine of the Exclusion Problem. It immediately rules out robust emergentism (which is metaphysically coherent and scientifically respectable in some biological contexts). It also puts immense pressure on non-reductive physicalism, forcing it into complex maneuvers (like the subset strategy or determinable/determinate relations) to avoid collapsing into identity theory.
  *   **Class Focus:** Spend the class time here. Ask students: *If we relax Causal Inheritance, what do we lose?* (We lose the guarantee that physics is fundamental). *If we keep it, what do we lose?* (We lose the autonomy of the special sciences). This is the pivot point upon which the metaphysics of science turns.

  ***

  ## III. Scorecard of Contenders (Brief)

  Students should evaluate the readings by mapping them against the Standard. **Subset Accounts** (where realized powers are a subset of realizer powers) typically satisfy Inheritance and Distinctness but struggle with Promiscuity. **Determinable/Determinate Accounts** handle Heterogeneity well but face challenges distinguishing realization from simple determinacy relations. **Mechanistic Constitution Accounts** excel at Base Scope and Relation Distinction but often struggle to formalize the modal force required for Multiple Realizability. **Identity Theories** satisfy Inheritance and Closure effortlessly but fail the Distinctness and Heterogeneity constraints by definition. The "winner" will be the account that most transparently admits which constraint it is relaxing to solve the Trilemma.
