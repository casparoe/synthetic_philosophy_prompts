          *   *Cost:* If you weaken (5), you open the door to consciousness in simpler systems (infants, animals) which might be intended, but it moves away from "narrative" theories (Dennett, etc.).

      *   **Tension B: (7) vs. Standard Psychological Continuity (The Transitivity Problem)**
          *   (7): Pre-op Person (P) survives as Left (L) and Right (R). P = L and P = R.
          *   *Problem:* Identity is transitive. If P=L and P=R, then L=R. But (2) says L and R are *distinct conscious subjects*. If "Person" = "Conscious Subject," this is a contradiction.
          *   *Nuance:* (7) distinguishes "Person" (legal/moral/biological unit) from "Conscious Subject" (phenomenal unit).
          *   *Conflict:* Psychological continuity views (Parfit) usually imply that if L and R are both psychologically continuous with P, and not with each other, P does *not* survive as a single entity in the strict identity sense. Parfit would say P ceases to exist, and L and R are successors. (7) claims P survives as *both*. This is the "Multiple Occupancy" view (Lewis).
