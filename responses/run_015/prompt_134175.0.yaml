      *   **Tension C: (1) & (4) (The Explanatory Gap)**
          *   (1) Physicalism. (4) Explanatory Gap.
          *   *Conflict:* Hard Physicalists (Churchland) deny the gap. Dualists use the gap to deny (1).
          *   *Resolution:* Phenomenal Concept Strategy (PCS). This is a standard, stable position (Loar, Sturgeon).
          *   *Severity:* Low. This is a standard non-reductive physicalist stance.

