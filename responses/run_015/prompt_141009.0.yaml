answer: |-
  ### Menu of Readings: "There Are No Atheists in Foxholes"

  **1. The Self-Report Blip (Crisis Piety)**
  *   **Thesis:** Under acute existential threat, individuals who identify as secular will temporarily report higher belief in God or engage in prayer.
  *   **Verdict:** **Trivial-but-true:** Supported by survey data on belief fluidity during disasters, but measures profession, not behavior.
  *   **Relevance to Trust:** **Irrelevant.** This describes *Crisis Piety*, not *Crisis Morality*. A secular person praying in a foxhole does not imply they will betray a comrade or loot a store; it is compatible with robust secular trust.

  **2. The Coping Deficit (Psychological Fragility)**
  *   **Thesis:** Religion provides a unique emotional regulation mechanism under stress that secular worldviews cannot replicate, leading to higher panic or dysfunction among non-believers.
  *   **Verdict:** **Genuinely Contested:** Live dispute in psychology of religion; secular coping mechanisms (therapy, community, ideology) are understudied in comparison.
  *   **Relevance to Trust:** **Weak.** Even if seculars cope worse individually, it does not prove *social trust* collapses. High-functioning anxiety is not the same as antisocial behavior.

  **3. The Revealed Truth (Ontological Claim)**
  *   **Thesis:** Fear strips away intellectual pretense, revealing that "atheists" implicitly believed all along; true belief is defined by what one falls back on under pressure.
  *   **Verdict:** **Unfalsifiable:** Philosophical redefinition of belief rather than an empirical claim; impossible to test.
  *   **Relevance to Trust:** **None.** This is a theological/semantic argument, not a sociological one. It explains nothing about social cohesion or institutional stability.

  **4. The Worldview Defense (Mortality Salience)**
  *   **Thesis:** Reminders of death (Terror Management Theory) automatically trigger rigid defense of one's cultural worldview and hostility toward outsiders.
  *   **Verdict:** **Plausibly True (Lab) / Extrapolated (Real World):** Robust in priming experiments, but scaling from lab tasks to societal collapse is speculative.
  *   **Relevance to Trust:** **Ambiguous.** TMT predicts *worldview defense*, which can be secular (nationalism, ideology) not just religious. It predicts *Thick Trust* polarization, not necessarily a collapse of *Thin Trust* in institutions.

  **5. The Supernatural Monitoring Hypothesis (Crisis Morality)**
  *   **Thesis:** Prosocial behavior toward strangers (*Thin Trust*) relies on the fear of supernatural punishment or sacred sanction, which vanishes in secular frameworks under stress.
  *   **Verdict:** **Genuinely Contested:** This is the core empirical dispute; evidence is mixed on whether seculars cooperate less in anonymous games.
  *   **Relevance to Trust:** **Critical.** This is the **only** reading that supports the "Borrowed Capital / Fair-Weather" conclusion. If this is false, the Nordic equilibrium is robust.

  **6. The Cultural Lag (Borrowed Capital)**
  *   **Thesis:** Secular societies function well only because they are running on moral habits instilled by prior religious generations, which will decay over time without theological reinforcement.
  *   **Verdict:** **Live Dispute:** Sociological hypothesis that is currently being tested by generational turnover in Northern Europe; too early for a verdict.
  *   **Relevance to Trust:** **High.** This asserts that *Crisis Morality* will eventually diverge between religious and secular cohorts as the "capital" depletes.

  ***

  ### Analysis of the "Borrowed Capital" Claim

  To support the claim that Nordic high-trust/low-church equilibrium is "fair-weather," you need **Reading 5** or **Reading 6** to be true. Specifically, you need evidence that *Thin Trust* (trust in strangers/institutions) depends on *Crisis Morality* (behavior under stress) which in turn depends on religious sanction.

  **Where the Ambiguity Lies:**
  Most evidence cited by proponents of the "fair-weather" claim actually supports **Reading 1** (Crisis Piety) or **Reading 4** (Worldview Defense), but they present it as proof of **Reading 5** (Crisis Morality).
  *   **The Gap:** Showing that people pray more when scared (Piety) does not show that they steal more when secular (Morality).
  *   **The Trust Distinction:** Most data on religion and prosociality shows increased *Thick Trust* (charity to in-group, church attendance) or *Observed Behavior* (acting nice when watched). There is very little evidence that religious people maintain higher *Thin Trust* (anonymous cooperation) than seculars during actual crises.

  **Regarding the Mortality-Salience Reader:**
  Your suspicion is correct. The mortality-salience literature (Terror Management Theory) shows that when reminded of death, people defend their *existing* worldview more aggressively. In a religious society, this looks like religiosity. In a secular society, this looks like nationalism, scientific rationalism, or political ideology. It does not prove that secular worldviews *fail* to provide cohesion; it proves they become *more rigid*. The reader is conflating "increased worldview defense" with "collapse of secular trust."

  ***

  ### The Single Piece of Evidence

  To change the verdict on the strongest reading (**Reading 5: The Supernatural Monitoring Hypothesis**), I would need:

  **Comparative behavioral data on anonymous cooperation (e.g., wallet return rates, looting incidents, resource sharing) between highly religious and highly secular communities during the *same* natural disaster or blackout event.**

  *   **Why:** Survey data and lab games are too removed from actual existential threat. We need to know if a secular Dane and a religious American behave differently when the lights go out and the police are absent. If secular communities maintain *Thin Trust* at equal or higher rates during actual chaos, the "fair-weather" hypothesis fails. If they defect at higher rates, the "borrowed capital" hypothesis gains ground. Currently, this data is anecdotal.
