  # Carving the Black Box at Its Joints: A Defense of Moderate Realism in Interpretability

  The rise of mechanistic interpretability has promised to turn the neural network from a black box into a glass box. Among the most promising tools in this endeavor are Sparse Autoencoders (SAEs), which decompose the dense activation vectors of a model into a larger set of sparse, human-interpretable features. When an SAE identifies a feature that reliably activates on mentions of "fraud" or "the Golden Gate Bridge," interpretability researchers often speak as though they have discovered a distinct component of the model's cognition. This language implies a form of *realism*: the view that these features correspond to genuine, basis-independent structures within the network's computation.

  However, a formidable objection looms over this confidence. In linear algebra, a vector space admits infinite valid bases. One can rotate the coordinate system of a neural activation space and produce a completely different set of "features" that compute the exact same input-output function. If the mathematics allows for infinite descriptions, on what grounds do we claim one description captures the "real" structure? Furthermore, SAEs impose a sparsity prior, essentially forcing the model's activity into a shape that humans find legible. This suggests an *instrumentalist* alternative: features are not discoveries of the model's ontology, but artifacts of our descriptive constraints.

  This essay weighs the case for and against realism regarding interpretability features. It argues that while a "Strong Geometric Realism"—the claim that specific feature vectors are unique, physical truths of the model—is untenable in the face of the basis-dependence objection, a "Moderate Functional Realism" remains defensible. The features are real not because they are the unique geometric axes of the network, but because they correspond to stable causal levers and information-theoretic bottlenecks that align with the structure of the data the model learned to predict.

  ### The Case for Realism

  The intuition driving realism is straightforward: when we find a feature, it behaves like a variable in a computer program. If a specific feature direction in an SAE is associated with "French language," and we artificially activate that feature (intervention), the model's output shifts toward French. If we suppress it, French output diminishes. This causal efficacy suggests the feature is not merely a descriptive label but a functional part of the mechanism.

  Realists point to convergence as further evidence. When different research groups apply different interpretability techniques to the same model, they often identify semantically similar features. If features were purely arbitrary artifacts of a specific mathematical basis, we would expect the findings to be chaotic and method-dependent. Instead, concepts like "sentiment," "topic," or "syntax" appear robustly across different layers and models. This convergence suggests that the model is indeed carving up its input space in a way that aligns with these concepts, and our tools are successfully mapping them.

  For the realist, the network is not a monolithic blob of weights but a structured system containing distinct, recombinable parts. To deny the reality of these features is to deny that the model has an internal structure worth studying; it reduces the network to a mere input-output map, ignoring the mechanistic pathway that connects them.

  ### The Basis-Dependence Objection

  The anti-realist's primary weapon is the change-of-basis objection. A neural network's activation space is a high-dimensional vector space. Mathematically, any set of linearly independent vectors can serve as a basis for this space. If we take the "French" feature vector and rotate it slightly within the activation subspace, we create a new basis. In this new basis, the "French" feature no longer exists as a pure axis; it is now a linear combination of two other vectors, say, "Romance Languages" and "Formal Tone." Both bases describe the exact same computations and yield the exact same outputs.

  If the physics of the model (the weights and activations) are invariant to this rotation, why privilege the basis where "French" is a single axis? The anti-realist argues that the model does not "know" about our choice of basis. The computation happens in the subspace, not along specific axes. Therefore, claiming the "French feature" is real is like claiming that latitude and longitude are physical features of the Earth rather than a human grid imposed upon it.

  This objection is compounded by the phenomenon of *superposition*. Theoretical work suggests that neural networks often store more features than they have dimensions, meaning they must represent multiple concepts in the same subspace using non-orthogonal vectors. If the model's native representation is dense and entangled, but our SAE forces an orthogonal, sparse basis to make it interpretable for humans, we are not discovering the model's structure; we are translating it into a language we speak, potentially distorting the underlying reality.

  ### The Role of Priors and the Sparsity Constraint

  The basis objection is tightened by the specific priors imposed by interpretability tools. SAEs are designed to find *sparse* features—the assumption being that at any given time, only a few concepts are active. This is a powerful prior, but it is a prior nonetheless. It reflects a human bias toward discrete, atomic concepts.

  If the model's true computation relies on dense, distributed representations where "French" is inextricably linked to "politeness" and "past tense" in a way that cannot be disentangled without loss of information, the SAE will fail to capture the reality. It will slice the dense representation into sparse shards that look clean to us but function poorly as causal descriptors. In this view, the "features" are Procrustean: we are cutting off the legs of the model's true representation to fit the bed of human interpretability. The anti-realist concludes that features are pragmatic tools for *us* to predict model behavior, not descriptions of the model's internal ontology.

  ### A Principled Response: From Geometry to Function

  Can the realist respond to these challenges without retreating into pure pragmatism? Yes, but only by shifting the ground from *Geometric Realism* to *Functional Realism*.

  The Strong Geometric Realist claims that there is a unique, correct basis for the network. This position is mathematically indefensible. As the basis objection shows, the vector space itself does not privilege one orthogonal frame over another. However, the Moderate Functional Realist claims that while the *geometry* is flexible, the *causal and information-theoretic structure* is not.

  **1. Causal Stability over Geometric Uniqueness**
  The realist can concede that the specific vector direction might vary slightly depending on the method, but argue that the *causal role* is invariant. If a direction in activation space consistently mediates a specific input-output relationship (e.g., French input → French output) across different interventions and contexts, it possesses a functional reality. The basis objection shows that we can describe the subspace differently, but it does not show that the subspace itself is arbitrary. If the "French" subspace is causally isolated from the "Math" subspace (i.e., intervening on one does not affect the other), then that separation is a real structural property of the network, regardless of the coordinate system used to describe it.

  **2. Sparsity as an Ecological Niche, Not Just a Prior**
  Regarding the sparsity prior, the realist can argue that sparsity is not merely a human constraint but a property of the data distribution the model learned. Natural language and human concepts are themselves sparse; at any given moment, only a few topics are relevant. A model optimized to predict human text is under pressure to represent these statistical regularities efficiently. If the world is compressible into sparse concepts, the model must internalize that sparsity to minimize loss. Therefore, an SAE finding sparse features is not forcing a shape onto the model; it is uncovering the shape the model was forced to adopt by the data. The sparsity prior aligns with the "ecological niche" of the model.

  **3. Description Length and Natural Kinds**
  Finally, the realist can appeal to Minimum Description Length (MDL). Among all possible bases that describe the model's function, the basis that allows for the shortest description of the model's behavior (in terms of feature activation patterns) is privileged. If a sparse feature basis allows us to predict the model's activations with fewer bits than a dense basis, it captures a genuine regularity. This is analogous to scientific realism in physics: we prefer the theory that compresses observations best. If "French" is a feature that compresses the model's behavior across many contexts, it is a "natural kind" of that model's cognitive economy.

  ### Conclusion: Defensible, with Humility

  The basis-dependence objection successfully kills the idea that interpretability features are unique, Platonic vectors written into the weights of the machine. There is no "One True Basis." However, this does not force us into instrumentalism.

  The realism thesis is defensible on its own terms if it is understood as a claim about *functional structure* rather than *geometric uniqueness*. The features extracted by SAEs correspond to genuine structure in the network insofar as they identify causally stable subspaces and compressible regularities in the model's input-output map. They are real in the same way that "temperature" is real: temperature is not a fundamental particle, but a macroscopic variable that reliably tracks the statistical state of a system and allows for causal intervention.

  The anti-realist is correct that our tools impose priors, but the realist is correct that those priors latch onto objective constraints imposed by the data and the loss function. The features are not fictions; they are the joints at which the model can be carved. We may not have found the only way to carve them, but we have found ways that hold together under the pressure of intervention and prediction. Thus, a moderate functional realism is not only defensible but necessary: without the assumption that these features track something real about the model's computation, the project of mechanistic interpretability collapses into mere taxonomy, leaving us with a map that describes our own understanding rather than the territory of the machine.
