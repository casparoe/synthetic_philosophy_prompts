prompt: |-
  hey so i've been chewing on bernard williams's integrity objection — yknow, the one-thought-too-many problem with the spouse vs stranger case — and i'm tired of seeing it used as a gotcha against utilitarianism without anyone saying what the positive account should actually deliever.

  i want the full desiderata for a theory of moral agency that takes integrity seriously but doesn't just collaspe into "do whatever feels authentic." specifcally, write the spec sheet: what must it get right, with the motivating case behind each?

  cases to cover: the classic drowning-choice scenario; the whistleblower who torches her career for public good; the longtermist who gives away 90% but still keeps her ground project intact; and the AI alignment researcher who refuses a high-paying capabilities job because it violates her core commitments. for each, what does the theory have to deliver?

  distinctions it can't collapse: integrity vs mere preference, agent-relative permissions vs rationalization, preserving ground projects vs selfishness, and "integrity budgets" — can you deplete moral capital on one big cause or does spending it down betray the project?

  requirements that are non-negotiable vs camp-specific (virtue ethics vs contractualism vs whatever). flag any jointly unsatisfiable pair — like "must allow deep agent-relativity" and "must be globally optimizable."

  then briefly score utilitarianism, a virtue-ethics view, and a scanlon-style contractualist account against the list. keep the weight on the criteria; i can do the scoring myself in class. and no bibliographies, please — i don't have web access and guessing citations is useless.

  oh, and there's probably a typo in here somewhere but that's fine.
