answer: |-
  Here is the spec sheet for a theory of moral agency that integrates integrity without collapsing into subjectivism. This is designed to move past the "gotcha" and define the structural requirements for a viable alternative.

  # SPEC SHEET: MORAL AGENCY WITH INTEGRITY

  ## 1. CORE DELIVERABLES (BY CASE)

  A viable theory must generate the following outputs for these specific scenarios without ad-hoc patching.

  ### Case A: The Drowning Choice (Williams's Spouse)
  *   **The Scenario:** You can save your spouse or two strangers. You cannot save all three.
  *   **The Deliverable:** **Agent-Relative Permission without Moral Residue.**
      *   The theory must permit saving the spouse *without* requiring the agent to first justify it via an impartial principle (e.g., "saving spouses generally maximizes utility").
      *   It must explain why the agent does not owe the strangers a justification that appeals to the greater good.
      *   **Failure Condition:** If the theory requires the agent to think "one thought too many" (calculating impartial value) before acting, it fails the phenomenology test.

  ### Case B: The Whistleblower
  *   **The Scenario:** An employee exposes corruption, knowing it will destroy their career and harm their family's stability, for the sake of public truth.
  *   **The Deliverable:** **Integrity as Overriding but Not Alienating.**
      *   The theory must validate the sacrifice as rational and moral, not just "supererogatory" or "foolish."
      *   It must distinguish this from self-destruction. The agent acts *for* themselves (their moral identity) even while acting *against* their self-interest.
      *   **Failure Condition:** If the theory treats this as a tragic loss of well-being that must be compensated by others, it treats integrity as a cost rather than a constituent of the good.

  ### Case C: The Effective Longtermist
  *   **The Scenario:** An agent donates 90% of income to high-impact causes but retains 10% to fund a specific personal passion (e.g., art, family travel) that does not maximize utility.
  *   **The Deliverable:** **Sustainable Agency Constraints.**
      *   The theory must define a "floor" for personal projects below which moral demand cannot go.
      *   It must explain why preserving the agent's psychological continuity (ground projects) is morally relevant, not just a concession to human weakness.
      *   **Failure Condition:** If the theory treats the 10% as a regrettable necessary evil (a "tax" on morality) rather than a protected sphere of agency, it fails to respect the ground project.

  ### Case D: The AI Alignment Researcher
  *   **The Scenario:** A researcher refuses a high-paying job at a capabilities lab because working there would violate their commitment to safety, even if their individual contribution might be neutral or slightly positive.
  *   **The Deliverable:** **Negative Responsibility Limits.**
      *   The theory must limit the agent's responsibility for outcomes they do not directly cause (i.e., the lab will hire someone else).
      *   It must validate the refusal based on *complicity* rather than *consequence*.
      *   **Failure Condition:** If the theory forces the agent to take the job because "you can do more good from the inside," it treats the agent as a mere vessel for outcomes, violating integrity.

  ---

  ## 2. REQUIRED DISTINCTIONS

  The theory must provide a mechanism to distinguish the following pairs. If it collapses these, it is either too permissive (anything goes) or too demanding (nothing goes).

  | Distinction | Theoretical Requirement | Collapse Risk |
  | :--- | :--- | :--- |
  | **Integrity vs. Mere Preference** | Must distinguish between "I want to" (desire) and "I cannot do otherwise" (constitutive commitment). Integrity requires a normative claim on the agent, not just a psychological urge. | **Subjectivism:** If integrity is just "strong preference," the Nazi has integrity. |
  | **Permissions vs. Rationalization** | Must provide a boundary for agent-relative permissions. Saving your spouse is permitted; stealing to save your spouse is not. The theory needs a principled cutoff. | **Egoism:** If agent-relativity has no limits, "integrity" becomes a shield for selfishness. |
  | **Ground Projects vs. Selfishness** | Ground projects constitute the self; selfishness indulges the self. The theory must identify which projects are "identity-constituting" vs. "identity-gratifying." | **Narcissism:** If all personal projects are protected, moral demand evaporates. |
  | **Integrity Budgets (Stock vs. Flow)** | Must clarify if integrity is a depletable resource (I can sell out once to save the world) or a structural constraint (selling out once destroys the agency required to do good). | **Transactionalism:** If integrity is a budget, it can be spent. If it's structural, it cannot. The theory must pick one. |

  ---

  ## 3. ARCHITECTURAL CONSTRAINTS

  ### Non-Negotiable Requirements (Universal)
  1.  **Phenomenological Accuracy:** Must match how agents actually deliberate (we do not constantly calculate impartial value).
  2.  **Identity Preservation:** Must prevent the total alienation of the agent from their actions (no "government house" utilitarianism).
  3.  **Action-Guidance:** Must be able to say "no" to some actions, not just describe feelings.

  ### Camp-Specific Requirements (Optional/Variable)
  1.  **Virtue Ethics:** Must explain how integrity is acquired (habituation) and if it can be lost (akrasia).
  2.  **Contractualism:** Must explain how integrity constraints are justifiable to those harmed by them (the strangers in the drowning case).
  3.  **Consequentialism:** Must explain how integrity constraints ultimately serve the good (rule-utilitarian style) or admit they are side-constraints.

  ---

  ## 4. JOINTLY UNSATISFIABLE PAIRS (TRADE-OFFS)

  A theory cannot maximize all variables. You must choose which tension to resolve and which to accept.

  **Pair A: Deep Agent-Relativity vs. Global Optimizability**
  *   **Tension:** If agents have deep permissions to prioritize their own projects (Drowning Case), the global outcome will not always be optimal. If the global outcome must always be optimal, agents cannot have deep permissions.
  *   **Verdict:** You cannot have a theory that guarantees the best state of affairs *and* guarantees the agent's right to prioritize their spouse. Williams argues we must sacrifice optimizability. Utilitarianism sacrifices agent-relativity.

  **Pair B: Subjective Authenticity vs. Objective Normativity**
  *   **Tension:** If integrity is defined by what the agent *feels* is core to them (Authenticity), it validates evil commitments. If integrity is defined by *morally correct* commitments (Normativity), it loses its force as a critique of morality (it just becomes "doing the right thing").
  *   **Verdict:** A theory must ground integrity in something deeper than feeling (e.g., human flourishing, rational nature) without making it identical to "maximizing the good."

  **Pair C: Complicity vs. Causation**
  *   **Tension:** To protect the AI Researcher's integrity, we must value *complicity* (what I am associated with). To protect the Whistleblower's impact, we often must value *causation* (what I actually change).
  *   **Verdict:** Emphasizing complicity protects the agent but may reduce overall good. Emphasizing causation protects the good but endangers the agent's moral self-conception.

  ---

  ## 5. BRIEF SCORECARD

  Use this to evaluate the theories in your class. Scores are based on how well they meet the **Spec Sheet** above, not on general popularity.

  ### Act Utilitarianism
  *   **Drowning Case:** **FAIL.** Requires the "one thought too many." Cannot justify saving the spouse without an impartial reason.
  *   **Whistleblower:** **PASS.** Validates sacrifice if utility demands it, but treats it as a cost, not a constituent of identity.
  *   **Longtermist:** **FAIL.** The 10% retention is hard to justify unless it prevents burnout (instrumental value only).
  *   **AI Researcher:** **FAIL.** Struggles with negative responsibility. If the job gets done anyway, the agent should take it to mitigate harm.
  *   **Integrity Budget:** Treats integrity as a **Stock**. You can deplete it if the utility payoff is high enough.
  *   **Major Tension:** Resolves *Global Optimizability* by sacrificing *Deep Agent-Relativity*.

  ### Virtue Ethics (Aristotelian/Neo-Aristotelian)
  *   **Drowning Case:** **PASS.** Saving the spouse is what a virtuous friend/spouse does. No calculation required.
  *   **Whistleblower:** **PASS.** Courage and justice are virtues; sacrifice is part of flourishing (eudaimonia), not opposed to it.
  *   **Longtermist:** **PASS.** Protects ground projects as essential to the "good life." Excessive sacrifice is a vice (lack of self-care).
  *   **AI Researcher:** **PASS.** Focuses on character and complicity. Working against safety is vicious regardless of outcome.
  *   **Integrity Budget:** Treats integrity as **Structural**. Compromising virtue damages the agent's capacity to flourish; it is not easily "spent."
  *   **Major Tension:** Struggles with *Action-Guidance* in hard trade-offs (e.g., Whistleblower vs. Family). Can be vague on *Objective Normativity* (what if the community's virtues are wrong?).

  ### Scanlon-style Contractualism
  *   **Drowning Case:** **MIXED.** Saving the spouse is permissible if the principle "save your loved ones" cannot be reasonably rejected by strangers. Still requires a principle (potential "one thought too many").
  *   **Whistleblower:** **PASS.** Principles allowing corruption are rejectable; principles demanding sacrifice for truth are not.
  *   **Longtermist:** **PASS.** Principles demanding 100% sacrifice are reasonably rejectable by the agent.
  *   **AI Researcher:** **PASS.** Focuses on justifiability to others. Working on unsafe AI is unjustifiable to those put at risk.
  *   **Integrity Budget:** Treats integrity as **Flow**. Maintained by acting on principles no one could reject. Betrayal breaks the justificatory relationship.
  *   **Major Tension:** Resolves *Subjective Authenticity* via *Objective Normativity* (reasonable rejectability), but may struggle with *Phenomenological Accuracy* (deliberation still feels principle-heavy).

  ---

  **Summary for Class Discussion:**
  The "gotcha" works against Utilitarianism because it fails the **Drowning Case** and **AI Researcher Case** on the Spec Sheet. However, any alternative (Virtue/Contractualism) must explicitly accept the **Jointly Unsatisfiable Pair A** (sacrificing Global Optimizability) to pass those cases. If a theory claims to save integrity *and* guarantee the best outcomes, it is hiding the cost. The "Integrity Budget" distinction is the sharpest tool for separating those who see integrity as a tool for good (Utilitarian) vs. a condition of agency (Virtue/Contractualist).
