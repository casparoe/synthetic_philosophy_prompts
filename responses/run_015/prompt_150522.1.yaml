answer: |-
  The stalemate in the Mary's Room debate is not a failure of imagination but a failure of coordination. Your hypothesis is correct: the deadlock is sustained by a systematic equivocation on the term "physical information." The debate persists because the protagonists are not disagreeing about the world, but about the relationship between *description* and *existence*.

  ### 1. Diagnosis: The Ambiguity of "Physical"
  The impasse rests on two divergent definitions of "physical knowledge" that are rarely disentangled:

  1.  **Fundamentalist Physicalism (The Anti-Physicalist Target):** Physical information is that which is stateable in the vocabulary of a completed fundamental physics (mass, charge, spin, spatiotemporal relations). Under this definition, Mary clearly lacks information. No amount of microphysical data logically entails the *qualitative character* of red.
  2.  **Structural/Functional Physicalism (The Physicalist Defense):** Physical information includes any third-person structural, functional, or relational description of the system, including indexical facts ("I am here now") and cognitive states ("Mary is in state R"). Under this definition, Mary's new knowledge is merely a change in *format* (from theoretical to acquaintance-based) of information she already possessed structurally.

  The Anti-Physicalist argues that if Fundamentalist Physicalism fails, **Ontological Physicalism** fails. The Physicalist argues that if Structural Physicalism holds, **Ontological Physicalism** holds. They talk past each other because one side treats the gap as evidence of *extra stuff* (qualia), while the other treats it as evidence of *extra access* (modes of presentation).

  ### 2. Reconstruction of the Implicit Disagreement
  The debate is not genuinely about whether phenomenal properties exist in a robust, dualistic sense. Almost all participants accept causal closure (the physical world is causally closed). If qualia had independent causal powers, neuroscience would be in trouble. Since both sides generally agree on causal closure, the disagreement is not about *ontology* (what exists) but about *semantics* (what our words latch onto).

  *   **The Anti-Physicalist Claim:** There is a truth about the world ("Red looks like *this*") that cannot be derived from physical truths. Therefore, physicalism is false.
  *   **The Physicalist Claim:** There is no *fact* Mary learns that contradicts physicalism; she only acquires a new *capacity* or *concept*. Therefore, physicalism is true.

  The implicit disagreement is about **Representational Saturation**.
  *   **Side A (Anti-Physicalist):** Assumes that if a representational format (third-person physics) cannot capture the content of an experience without instantiation, then the content exceeds the physical ontology.
  *   **Side B (Physicalist):** Assumes that if the ontology is exhausted by physical stuff, then any failure of representation is merely a limitation of the *knower*, not the *world*.

  They are answering different questions under one heading. Side A asks: *Is the physical description exhaustive of all truth?* Side B asks: *Is the physical ontology exhaustive of all being?*

  ### 3. Substantive vs. Verbal
  Much of the debate is verbal, but there is a residual substantive core.

  *   **Verbal/Framing:** Whether we call Mary's new knowledge a "fact," a "proposition," or an "ability." Whether we define "physicalism" as the claim that all truths are physical truths, or that all entities are physical entities. If the dispute is merely about whether acquaintance counts as a "truth," it is linguistic.
  *   **Substantive:** The only substantive stake is **Causal Efficacy**. If the "what-it-is-like-ness" Mary discovers has causal powers that cannot be explained by the neural correlates she already knew about, then dualism is true. However, since neither side typically argues for causal dualism (to avoid interaction problems), the substantive core has evaporated. The debate survives as a zombie of its former self, sustained by the intuition that *ineffability implies ontological excess*.

  ### 4. Proposed Conceptual Distinction
  To dissolve the impasse, we must decouple ontology from epistemology using the distinction you suggested, refined as follows:

  **Ontological Completeness vs. Representational Transparency**

  *   **Ontological Completeness:** The claim that all entities and properties instantiated in the world are physical. (Physicalists assert this; Anti-Physicalists often deny it, but need not).
  *   **Representational Transparency:** The claim that a third-person physical description can fully encode the content of a first-person state such that a subject can grasp that content without undergoing the state.

  **The Dissolution:**
  The Mary argument proves **Representational Opacity** (you cannot know what red looks like without seeing it). It does *not* prove **Ontological Incompleteness**.
  *   The Anti-Physicalist error is inferring Incompleteness from Opacity.
  *   The Physicalist error is assuming Completeness implies Transparency.

  By accepting that the physical world can be **Ontologically Complete** yet **Representationally Opaque**, the contradiction vanishes. Mary learns something new because human cognition requires instantiation to access certain structural states, not because a new non-physical property has been added to the universe. The "newness" is a feature of the *interface* between the knower and the world, not the world itself.

  ### 5. What Could Move the Debate?
  **Verdict: Nothing.**

  Neither a formal theorem, an empirical finding, nor a phenomenological report will resolve the debate *as currently framed*.

  **Justification:**
  Based on the diagnosis above, the stalemate is conceptual, not empirical or logical.
  1.  **Formal Theorems:** A theorem proving descriptive completeness (e.g., "All phenomenal truths are derivable from physical truths") would be rejected by Anti-Physicalists as begging the question (defining "derivable" too broadly). A theorem proving incompleteness would be rejected by Physicalists as relying on non-physical axioms. The axioms themselves are the point of contention.
  2.  **Empirical Findings:** Studying cataract patients or sensory-deprived subjects (real-world Marys) yields data that is theory-laden. If a subject says, "I didn't know it was like *this*," Physicalists classify this as concept acquisition; Anti-Physicalists classify it as fact discovery. The data underdetermines the interpretation because the disagreement is about the *metaphysical status* of the report, not the report itself.
  3.  **Phenomenological Reports:** These are the input of the argument, not the resolver. Relying on them reinforces the intuition pump that drives the Anti-Physicalist position without addressing the Physicalist's semantic counter-move.

  **The Only Path Forward:**
  The debate will not end with a result, but with a **dissolution**. It requires the philosophical community to universally adopt the distinction between **Ontological Completeness** and **Representational Transparency**. Once it is accepted that physicalism is a claim about *what exists* (ontology) and not *what can be known from an armchair* (epistemology), the Knowledge Argument loses its force as a refutation of physicalism. It becomes an argument about the limits of human conceptualization, which is compatible with a physical world.

  Until that meta-philosophical shift occurs, the debate will remain static, because both sides are successfully defending different definitions of "physical" against attacks intended for the other.
