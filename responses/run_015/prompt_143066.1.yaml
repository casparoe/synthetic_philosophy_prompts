          *   *Resolution:* You need to redefine "blame." If blame is just "holding responsible" (Dennett) without "inflicting suffering," it might work. But "fitting resentment" usually implies a claim of desert.
          *   *Severity:* High. This strikes at the emotional core of your moral psychology.

