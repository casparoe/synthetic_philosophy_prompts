          *   *Resolution:* You can take Dennett's metaphysics (FW exists as competence) but reject his normative conclusion (therefore we can punish for desert). You are essentially a "Compatibilist Abolitionist" (or "Compatibilist Forward-Looker"). This is a rare but coherent spot.
