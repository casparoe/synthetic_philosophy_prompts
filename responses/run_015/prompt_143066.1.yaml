      *   *Tension B (2 vs. 5):* Public health model (2) focuses on *dangerousness*. If someone is dangerous, they get quarantined. If (5) says culpable people get *stricter* monitoring than equally dangerous non-culpable people, isn't that a form of desert-based differentiation? Why treat the culpable worse if only risk matters?
