answer: |-
  You are asking me to argue against your own conscience, which is already doing the heavy lifting here. You feel the knot because you know where the logic of "aptness" curdles into something else. You want me to articulate the curdle.

  Here is the argument for the stricter norm. It does not rest on harm to the dead (they feel nothing) or harm to the living (your cousin's feelings are secondary). It rests on the **ethics of the void**.

  ### 1. The Silence is Data, Not a Gap
  Your argument for aptness relies on the idea that the archive is incomplete. You see the four-year diary and the sudden stop as a gap waiting to be filled. You see the lack of evidence about her private struggles as room for metaphor.

  The stricter view is that the silence *is* the record.

  She stopped writing. She did not leave a record of a crisis. She did not leave a record of a secret vice. That absence is a historical fact as significant as the text that is there. When you invent the drunk night, you are not filling a gap; you are explaining away a mystery. You are imposing a narrative arc (repression leads to explosion) onto a life that refused to give you that arc.

  In history, ambiguity is a form of respect. It acknowledges that the subject is ultimately unknowable. In fiction, ambiguity is often a tension to be resolved. By writing the drunk night, you are resolving the tension of her life in a way that serves your novel's pacing, not her history. You are colonizing her opacity because it is inconvenient for your plot.

  **At the desk:** You must treat the silence as a boundary, not a canvas. If the diary stops, you do not invent the reason why. You write the stop. If the record is temperance tracts, you do not invent the secret drink unless the tracts themselves hint at the struggle. Contradicting the positive evidence (the tracts) is not "aptness"; it is revisionism. It turns her into a trope (the hypocritical reformer) because that is a more compelling character than the actual woman might have been.

  ### 2. The Name is a Claim of Authority
  You ask if renaming is laundering. It is not. It is a change of genre contract.

  When you use her real name, you are borrowing her authority. You are saying, "This is who she was." Even if the reader knows it is a novel, the emotional weight of the story attaches to the name. When they Google her, they find your book. The name acts as a bridge that allows your inventions to flow back into the historical record.

  If you change the name, you break the bridge. You acknowledge that the interiority you have written belongs to *you*, not to her. You are no longer writing "her story"; you are writing "a story inspired by her."

  The "eviction" you fear happens because the name anchors your fiction to her specific coordinate in time and space. Without the name, your book is a parallel universe. With the name, it is a renovation of her house.

  **At the desk:** Change the name. This is the single most effective way to solve the eviction problem. It signals to the reader: "The interior life here is mine. The skeleton is hers." It prevents your book from becoming the definitive Google result for *her*. It creates a buffer zone between the historical person and the fictional character. If you refuse to do this, you are prioritizing the marketing hook of "based on a true story" over the integrity of the subject's identity.

  ### 3. Aptness Fails When It Serves Plot Over Person
  You defend the drunk night as "apt." I argue it is only apt for the *novel*, not the *woman*.

  Why does she get drunk in your book? Is it because the letters suggest a breaking point? Or is it because the second act needs a low point? If it is the latter, you are using her body as a puppet for your structure.

  The stricter norm is this: **Invention must not contradict the known trajectory unless the contradiction is the point of the historical inquiry.**

  If you were writing a biography arguing that temperance leaders were secretly alcoholics, you would need evidence. You are writing a novel, so you don't need evidence, but you do need *justification*. The justification cannot be "it makes a better scene." It must be "this is the only way to honor the tension in the letters."

  But you said the letters don't support this. They support temperance. So the drunk night is not an interpretation of the evidence; it is a rejection of it. You are deciding that you know her better than she knew herself (or better than she presented herself). That is an arrogant position for a novelist to take toward a subject who cannot answer back.

  **At the desk:** Cut the drunk night. It is the weakest link ethically because it actively fights the existing record. If you need a scene of release, find one that is consistent with the tracts. Maybe she gets drunk on righteousness. Maybe she destroys a letter. (You already have her burning letters; that is consistent with a desire to erase the past). The drunk night is a cliché. It makes her ordinary. The stricter norm demands you find the extraordinary truth of her specific restraint, not the universal truth of human weakness.

  ### 4. The Afterword is Not Absolution
  You ask if a note up front or an afterword fixes the eviction. It helps, but it is often performative.

  Readers read the story, not the footnotes. The emotional truth of the narrative overrides the factual disclaimer. If you write a powerful scene of her drunkenness, a note at the end saying "this didn't happen" does not un-ring the bell. It just makes you look honest while leaving the misconception in place.

  The eviction worry is real: your book will become the primary source. An afterword acknowledges this, but it doesn't stop it. The only thing that stops it is ensuring the fiction does not claim to be the secret truth.

  **At the desk:** If you keep the real name, the afterword must be radical. It cannot just say "I changed things." It must say "I do not know who she was." It must explicitly frame the novel as a speculation, not a revelation. But the better solution is still the name change. An afterword is a patch; a name change is a structural fix.

  ### 5. The Core Argument: Fidelity to the Void
  Here is the strict norm you are looking for. It is not "Truth." It is **Fidelity to the Void**.

  When a person is dead and obscure, they are vulnerable. They cannot correct you. The archive is thin, which means they are easy to overwrite. You have power over them.

  The ethical obligation is to not use that power to make them more interesting than they were, if "interesting" requires violating their known self.

  You say "truth is the wrong norm." I agree. But "aptness" is too loose. Aptness allows you to make her a secret drinker because "everyone has secrets." That is a generalization, not an aptness.

  The stricter norm is **Negative Capability**. You must be able to stand in the uncertainty of her life without forcing a resolution. If the record says she was a temperance writer and gives no sign of struggle, you write the struggle of *maintaining* that position, not the collapse of it.

  If you write the collapse, you are satisfying the reader's desire for scandal, not honoring the subject's life. You are evicting her to make room for a better character.

  ### Summary of Concrete Changes
  1.  **Cut the drunk night.** It contradicts positive evidence (the tracts). It serves plot, not person. It relies on a cliché of repression.
  2.  **Change the name.** This is not laundering; it is re-categorizing. It stops the book from claiming to be *her* story and admits it is *your* story using her bones. This solves the eviction problem by decoupling the Google search from the invention.
  3.  **Reframe the silence.** Do not invent a reason the diary stopped. Let it stop. Let the mystery remain a mystery. Do not resolve the ambiguity of her life to satisfy the narrative need for closure.
  4.  **If you keep the name, the afterword must be a surrender.** It must explicitly state: "The real woman is unknowable. This book is a guess." But I still argue for the name change.

  You are worried that if you don't write the drunk night, the book fails. I argue that if you *do* write it, the book succeeds as a novel but fails as an act of stewardship. You are the temporary guardian of her memory. The stricter norm asks you to guard the mystery, not solve it.
