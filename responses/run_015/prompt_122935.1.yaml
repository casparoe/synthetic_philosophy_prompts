      *(Self-Correction on "Renaming"):* The user asked if renaming is laundering. I need to be careful. If I say "Rename her," I need to explain *why* it's not just laundering. It changes the genre contract. It moves from "Historical Fiction" (claiming truth) to "Inspired By" (claiming resonance). That is a substantive ethical shift, not just cosmetic.

      *(Self-Correction on "Eviction"):* The user thinks eviction is bad because the novel becomes the *only* record. I should argue eviction is bad because the novel becomes the *definitive* interpretation. It closes the door on other readings.

