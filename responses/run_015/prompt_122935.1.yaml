      *   **Point 4: The Eviction Mechanism.** The user worries the novel replaces the archive. The deeper issue is that the novel makes her *knowable* in a way she isn't. History preserves mystery; fiction resolves it. By resolving it, you kill the historical person to birth the character. *Concrete advice:* An afterword helps, but only if it admits the *uncertainty*, not just lists the changes. Better yet: leave the ending ambiguous.
