answer: |-
  **MEMORANDUM**

  **TO:** All New Hires, Grade 4 and Below
  **FROM:** Department of Weighted Outcomes
  **SUBJECT:** Welcome / Your Utility Coefficient
  **DATE:** October 24, 2023

  Welcome to the Bureau of Social Aggregation. We're glad you're here. Your job is to help us calculate the best outcome for everyone. How? We take what you want, multiply it by a number, and add it to what everyone else wants. If the total is bigger, we do it. If not, we don't. Simple.

  Your number is your Coefficient. It represents how much the Bureau cares about your specific happiness relative to Mr. Henderson in Accounting (his is 1.4, yours is currently 0.8). Don't take it personally. It's just math. Some preferences are more stable than others, and stability drives influence. You might want a park; Henderson wants a tax break. If the weighted sum favors the tax break, the park gets paved. This is efficient.

  To finalize your Coefficient, you must spend time in a Reflective Equilibrium Pod. These are the beige booths in the hallway B. You sit there and think about your preferences until they stop changing. The system measures stability. The longer you sit, the higher your potential weight. However, please note that sleeping in the pods does not count as reflection, though we have no way of telling the difference so just dont wake up snoring. The pods are usually booked for three weeks, but you can wait inthe lobby if you want priority scheduling.

  If you think your Coefficient is unfair, you can file an appeal. Use Form 1040-SW (Statement of Worth). You must prove that your preferences are consistent, transitive, and socially convenient. Approval rates are low. Most people find it easier to just lower their expectations than raise their weight. Remember, Pareto improvements are only mandatory if the weights align. Sometimes making someone better off makes the total worse, so we leave them alone. It's for the greater good.

  Please submit your pod scheduling request by Friday. If you experience existential dread during aggregation, HR has pamphlets, but they are not deductible.

  Thanks,
  Management

  ***

  *Note: If your preferences branch during the aggregation process (e.g., you want the park only if it rains, but also want the tax break if it shines), you may be eligible for a partial refund of your civic duty fees. Please see Annex C for the definition of "branching." Most cases are classified as "indecisiveness" and are non-refundable.*
