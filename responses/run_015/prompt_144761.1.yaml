  **MAROT PROTOCOL OFFICE**
  **COMPLIANCE DIVISION | FAQ SERIES 7.4: FORMULARY PRESERVATION STANDARDS**
  **SUBJECT: ADHERENCE TO LE TON BEAU DOCTRINE (REV. 11.2)**

  **Q: What is the prescribed procedure when the target language possesses no phonetic equivalent for a source-language slant rhyme?**

  **A:** Under Protocol 9, the preservation of the acoustic architecture takes precedence over lexical denotation. If a target phoneme is unavailable, the translator must invoke the Acoustic Shadow Clause. This requires adjusting the vowel color of the preceding line to simulate the missing resonance through harmonic interference. The semantic loss incurred by this adjustment is classified as "interpretive residue" and is considered an acceptable casualty of formal fidelity. Translators must log all such substitutions in Form 12-B (Phonemic Deviation), noting the specific decibel variance. Failure to maintain the slant rhyme's angularity within a 5% margin will result in immediate decertification of the stanza.

  **Q: May a translator substitute a culturally specific reference if the original syllable count and "Prosodic Fidelity Index" are maintained?**

  **A:** Substitution is permitted solely under Condition C of the Syllabic Integrity Statute. A culturally specific reference (e.g., "nightingale" vs. "mockingbird") may be localized only if the replacement maintains the original stress pattern and the Prosodic Fidelity Index (PFI) remains above 0.95. However, translators are reminded that cultural connotation is secondary to metric velocity. If the localized reference alters the emotional temperature of the line by more than two degrees Kelvin, the substitution is void. The poem's formal skin must remain unbroken; the flesh beneath is subject to regulatory review.

  **Q: How is the "Ton-Beau Coefficient" calculated during peer review?**

  **A:** The Ton-Beau Coefficient (TBC) is the primary metric for quantifying aesthetic voice transfer. It is derived by dividing the Semantic-Consonant Density Ratio by the Thermal-Prosodic Variance (TPV). To calculate TPV, the reviewer must isolate the affective vowels of the source text and measure their projected heat output against the target text's vowel friction. A TBC of 1.0 indicates perfect formal transference. A coefficient below 0.8 suggests "semantic bleed," where meaning has contaminated the structure. Translators are advised to use the approved MPO spectrometer software for these calculations; manual estimation is no longer compliant with ISO-9001-Poetry standards.

  **Q: How does the Office adjudicate disputes over "vowel-temperature parity" between reviewers?**

  **A:** Disputes regarding vowel-temperature parity are resolved through Blind Spectrographic Review. Both parties must submit raw audio files of the source and target texts recited at a standardized tempo (60 beats per minute). The Adjudication Committee will analyze the waveforms for thermal consistency. It is not sufficient for the poem to *feel* cold or warm; the acoustic data must demonstrate parity in frequency modulation. If the target text exhibits a higher vibratory heat than the source, the translator must cool the delivery by flattening the consonants. The Committee's decision on thermal alignment is final and not subject to appeal based on "artistic intuition."

  **Q: Is interpretive residue ever permissible in high-fidelity certifications?**

  **A:** No. Interpretive residue implies the translator has imposed an external will upon the poem's structural membrane. Under Le Ton beau, the poem is a vessel of pure form. Any meaning that cannot be carried by the meter, rhyme, or vowel temperature is considered excess weight. Translators seeking Level 5 Certification must demonstrate the ability to strip meaning from sound without damaging the sonic hull. Please refer to Appendix D for the approved list of neuter verbs suitable for high-fidelity transitions.

  **NOTICE:** All submissions must be accompanied by a signed affidavit confirming that no unauthorized hermeneutic analysis was performed during the translation process. The Marot Protocol Office assumes no liability for poems that lose their soul during the preservation of their skin.
