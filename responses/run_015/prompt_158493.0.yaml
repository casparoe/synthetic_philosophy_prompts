answer: |-
  # Simulation: The Grid World Protocol

  **Objective:** Students will experience the tension between laws as *summaries of facts* (Humeanism) and laws as *constraints on facts* (Anti-Humeanism) by managing the theoretical account of a simple particle universe.
  **Time:** 75 Minutes
  **Class Size:** 14 Students (Split into two groups of 7)

  ## 1. Materials Needed
  *   **Instructor:** One large 5x5 grid drawn on the board (or projected). 10 magnetic tokens (5 Red, 5 Blue).
  *   **Group A (The Catalogers):** 1 large sheet of paper titled "The Record," markers.
  *   **Group B (The Legislators):** 1 large sheet of paper titled "The Code," markers.
  *   **Handout (One per student):** A simple log sheet with columns for Round 1, 2, 3, 4.

  ## 2. Setup & Roles (10 Minutes)
  Divide the class into two groups. Do **not** use the words "Humean" or "Anti-Humean" yet.

  *   **Group A (The Catalogers):** Your job is **Compression**. You observe the universe and write the *best summary* of what happened. Your goal is to make the Record as short and simple as possible while remaining true to what actually occurred. You cannot say what *must* happen, only what *did*.
      *   *Constraint:* You are penalized for every word you write. You are penalized heavily if your Record fails to describe an event that occurred.
  *   **Group B (The Legislators):** Your job is **Authority**. You issue rules that govern the particles. Your goal is to make the Code as stable and universal as possible. You speak in terms of *necessity* ("Red particles *must* move...").
      *   *Constraint:* You lose "Authority Points" if you change a rule once issued. You lose "Reality Points" if you claim a rule was broken when the world clearly just operates differently.

  **The Stakes (No Money):**
  *   **Group A** wins if they produce the shortest description that covers all data points.
  *   **Group B** wins if they maintain the same Rule Set from Round 1 through Round 4 without admitting the "World" broke their laws.
  *   **Instructor Role:** You are "Nature." You decide where the particles move. You are capricious but consistent within rounds.

  ## 3. The Simulation Timeline (40 Minutes)

  ### Round 1: The Regularity (10 Mins)
  *   **Action:** Instructor places 1 Red particle at (1,1). Instructor moves it to (1,2). Places 1 Blue at (1,1), moves it to (2,1).
  *   **Task:**
      *   **Group A:** Write the summary of this movement. (e.g., "Red went Right. Blue went Up.")
      *   **Group B:** Issue the Law governing this movement. (e.g., "Red *must* go Right. Blue *must* go Up.")
  *   **Reveal:** Groups show boards. Instructor confirms: "The World is stable."

  ### Round 2: Reinforcement (10 Mins)
  *   **Action:** Instructor repeats the exact same movement with 4 new particles. All Reds go Right. All Blues go Up.
  *   **Task:**
      *   **Group A:** Update the Record. (Hopefully, they generalize: "All Reds move Right.")
      *   **Group B:** Confirm the Law. (They should feel confident: "It is a Law that Reds move Right.")
  *   **Debrief Check:** Ask Group B: "If I placed a Red particle here, where *would* it go?" They should say "Right" with confidence. Ask Group A: "Where *did* they go?" They say "Right."

  ### Round 3: The Anomaly (10 Mins)
  *   **Action:** Instructor places a Red particle at (1,1). **Moves it Left to (0,1).** (Violates the pattern).
  *   **The Crisis:**
      *   **Group A (Catalog):** You must record what happened. You cannot say it was impossible, because you saw it.
          *   *Choice:* Do you add a clause ("Usually Right, sometimes Left")? Do you exile this particle as "noise"?
          *   *Cost:* Adding clauses hurts your Compression Score. Exiling hurts your Accuracy Score.
      *   **Group B (Legislators):** You stated Reds *must* move Right. This Red moved Left.
          *   *Choice:* Did the Law break? (If so, your Authority drops). Did the World malfunction? (If so, you claim this particle wasn't a 'true' Red particle). Or do you amend the Law? (If so, your Stability Score drops).
  *   **Time:** Give them 5 minutes to debate internally and write their response on the board.

  ### Round 4: The Counterfactual Test (10 Mins)
  *   **Action:** Instructor freezes the board.
  *   **Task:** Both groups must answer one written question: *"If we had placed a fresh Red particle at (1,1) just before the Anomaly occurred, where would it have gone?"*
      *   **Group A:** Must answer based on the total sum of facts (including the anomaly).
      *   **Group B:** Must answer based on the Law as it stood *before* the anomaly.
  *   **Reveal:** Compare answers. They will likely differ.

  ## 4. The Debrief: Mapping the Metaphysics (25 Minutes)

  *Do not lecture. Ask questions to draw the distinctions out of their frustration during the sim.*

  **1. Direction of Fit (10 Mins)**
  *   **Ask Group A:** "When the anomaly happened, did you feel the *Law* was wrong, or that your *Description* was incomplete?"
      *   *Target:* They should admit the Description had to change to fit the World.
      *   *Metaphysics:* This is the **Humean Supervenience** intuition. Laws supervene on the mosaic. If the mosaic changes, the law changes. The "must" is just a psychological habit of expecting the pattern to continue.
  *   **Ask Group B:** "When the anomaly happened, did you feel the *World* was wrong, or that your *Law* was too weak?"
      *   *Target:* They likely wanted to say the particle was "defective" or the situation was "interfered with."
      *   *Metaphysics:* This is the **Necessitation** intuition. Laws govern the world. If the world violates the law, something is ontologically "off" (ceteris paribus clauses, interfering factors).

  **2. Counterfactual Support (10 Mins)**
  *   **Look at Round 4 Answers.**
  *   **Ask:** "Group B, why did you say the new particle *would* have gone Right, even though the last one went Left?"
      *   *Target:* Because the Law *makes* them go Right. The Anomaly was an exception, not the rule.
      *   *Metaphysics:* Anti-Humeanism supports robust counterfactuals. The law holds even in unactualized possibilities.
  *   **Ask:** "Group A, why did you hesitate to say the new particle *would* go Right?"
      *   *Target:* Because your 'law' is just a summary of past data. The new data (the anomaly) weakens the projection.
      *   *Metaphysics:* Humeanism struggles with counterfactuals. If laws are just summaries, what grounds the claim about what *would* happen in a case that *didn't* happen?

  **3. Institutional vs. Brute Facts (5 Mins)**
  *   **Framing:** Use your friend's suggestion here without the jargon.
  *   **Ask Group A:** "Is your Record like a Scorecard at a baseball game?"
      *   *Point:* Yes. It describes what happened. If the player runs the wrong way, the scorecard changes to record it. The scorecard doesn't stop the player. (Institutional/Descriptive).
  *   **Ask Group B:** "Is your Code like the Rules of Baseball?"
      *   *Point:* Yes. If the player runs the wrong way, they are 'out'. The rule constrains the play. (Brute/Prescriptive).
  *   **Synthesis:** The debate is whether the laws of nature are more like a Scorecard (recording the mosaic) or the Rules of the Game (constraining the mosaic).

  ## 5. Limitations: What This Sim Cannot Do
  *Be honest with the students here.*

  1.  **Modal Force:** In the sim, Group B's "Authority Points" are arbitrary. In reality, Anti-Humeans claim the "must" is a feature of the universe, not a game score. The sim gamifies necessity; it doesn't prove it exists.
  2.  **Unactualized Possibilities:** We only tested one counterfactual in Round 4. Real metaphysics worries about *all* possible worlds. The sim is too small to show the "Best System" trade-off (Simplicity vs. Strength) that Humeans rely on.
  3.  **The "God's Eye" View:** In the sim, *you* (Instructor) know the moves. In reality, we are inside the universe. We never know if an anomaly is a true violation or just a pattern we haven't seen yet.

  ## 6. Predictable Pitfalls (First Run Notes)

  1.  **Group B will cheat and act like Group A.**
      *   *Symptom:* Legislators will write "Red particles usually move Right."
      *   *Fix:* Enforce the "Must" language in Round 1. If they write "usually," tell them their Authority Score is zero. Laws are universal or they are nothing.
  2.  **Group A will try to explain the Anomaly.**
      *   *Symptom:* Catalogers will say "Maybe wind blew it."
      *   *Fix:* Remind them they are *Catalogers*, not *Explainers*. They record the mosaic. Explanations are for the Legislators.
  3.  **Time Creep.**
      *   *Symptom:* Round 3 debate drags on.
      *   *Fix:* Hard stop at 5 minutes for Round 3. The frustration of not finishing is actually data for the debrief (ask them how it felt to be cut off).
  4.  **Confusing Epistemic with Ontological.**
      *   *Symptom:* Students argue "We just don't *know* the rule yet."
      *   *Fix:* Remind them: "In this game, *I* am Nature. If I say it's an anomaly, it's an anomaly. The question is how your *system* handles it."

  ## 7. Instructor Script for the Anomaly (Round 3)
  *When you move the Red particle Left:*
  1.  Move it slowly.
  2.  Say nothing.
  3.  If Group B protests ("That's illegal!"), say: "I am the World. I did it. Deal with it."
  4.  This forces the ontological crisis: Does the World obey the Law, or does the Law describe the World?

  ---

  **Final Note for Instructor:**
  The success of this seminar depends on you refusing to resolve the tension. In the last 5 minutes, do not tell them who is right. Tell them: "Physics works either way. But if you want to know what reality *is*, you have to choose: Is the universe a library of facts, or a machine with a blueprint? You just played both. Which felt more like the world you live in?"
