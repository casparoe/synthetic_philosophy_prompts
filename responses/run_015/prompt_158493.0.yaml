      *   *Anti-Humeanism (Armstrong, Dretske, Tooley):* Laws are relations between universals that *govern* behavior. They have modal force. If an anomaly occurs, either the law was violated (impossible on strong views) or the law doesn't apply (ceteris paribus). Counterfactuals are robust (the law *would have* constrained it).
      *   *The Tension:* Description vs. Prescription. Summarizing vs. Constraining.

  3.  **Design the Simulation Mechanics:**
      *   *Grid:* Needs to be simple. 5x5 grid? Or just a track? Let's go with a linear track or simple 2D grid to keep velocity manageable. Let's use a 5x5 grid on paper/whiteboard.
