      *   This is useful for the debrief. Humeanism treats laws like institutional facts (agreements on description). Anti-Humeanism treats them like brute facts (mind-independent constraints). I'll weave this into the debrief without name-dropping Searle.

  6.  **Developing the Debrief:**
      *   Need to map specific choices to metaphysical concepts.
      *   *Catalogers:* "Did you change the law to fit the fact?" -> Humean Supervenience.
