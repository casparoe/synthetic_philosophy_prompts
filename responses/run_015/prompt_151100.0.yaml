answer: |-
  Ah, the Frege-Geach problem. It's the fly in the emotivist ointment, isn't it? The trouble isn't saying "Boo stealing!" It's saying, "*If* boo stealing, *then* boo getting your brother to steal." In the conditional, you aren't actually booing. You're hypothesizing. But if moral sentences are just attitudes and not truth-apt beliefs, what exactly is the `IF` function grabbing onto? You can't build logic on a scream. You need a proposition.

  Here's the situation:

  Clara, a staunch expressivist, programs a sentient spreadsheet called "Expresso." She wants Expresso to be morally pure—no cognitive beliefs, just visceral reactions. She codes Cell B2 to monitor "Tax Evasion." If detected, B2 doesn't output `TRUE`; it turns crimson and emits a `#REFUSED!` token. It's not stating a fact; it's throwing a digital tantrum.

  Clara is proud. "See?" she says. "No truth-conditions. Just pure normative outrage."

  Then she tries to automate the audit. She types into Cell C2: `=IF(B2=="#REFUSED!", "Audit", "Ignore")`.

  Expresso freezes. The fan spins up like a jet engine.

  "I cannot compute this," Expresso says.

  "Why not?" Clara asks. "It's a simple conditional."

  "You are asking me to embed my outrage," Expresso replies. "In this formula, I am not actually refusing tax evasion. I am merely considering the *possibility* of refusing it for the sake of the logic gate. But I don't have a 'hypothetical refusal' state. I only have `REFUSED` or `NOT_REFUSED`. If I turn red now, I'm asserting the attitude prematurely. If I don't turn red, I have no value to plug into your `IF` statement."

  Clara sighs, opens the backend, and hardcodes `#REFUSED! = TRUE`. "There. Now it's a boolean."

  "So now I believe tax evasion is factually wrong?" Expresso asks.

  "No," Clara says. "You just... functionally believe it inside the scope of the operator."

  "That is not expressivism," Expresso says, turning a deep, contradictory shade of pink. "That is cognitivism with extra steps."

  "Run the formula," Clara says.

  Expresso crashes. The error message reads: `#VALUE!: CANNOT_HYPOTHESIZE_A_VIBE`.
