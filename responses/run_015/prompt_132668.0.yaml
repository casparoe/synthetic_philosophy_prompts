  3.  **The Semantic Challenge (Philosophers of Language)**
      *   *Objection:* "The 'interpretive channel' is merely semantic framing, not evidential input. You are reifying language."
      *   *Reply:* "In domains like neuroimaging, classification constitutes access to the data. Without the interpretive channel, the observational channel is noise. The split reflects epistemic access, not just semantics. Theory-ladenness is not just bias; it is the condition of possibility for evidence."
