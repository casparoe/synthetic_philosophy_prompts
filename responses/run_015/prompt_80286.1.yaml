  # DECISION TREE: THE BADNESS OF HUMAN EXTINCTION

  **Starting Stipulation:** Human extinction is bad, and its badness is **not** exhausted by the deaths of the currently living. (You accept that something *more* is lost than just the sum of individual tragedies).

  **Instructions:** Follow the branches by answering the questions based on your intuitions about the four cases provided in your seminar packet.

  ---

  ### **NODE 1: THE REQUIREMENT OF CONSCIOUSNESS**
  **Consider Case 1:** *The last human dies, but all of humanity's artifacts remain in the solar system and no one ever again experiences anything.*
  **Question:** Is the extinction of humanity still bad in this scenario, even though no conscious being remains to witness the loss or suffer from it?

  *   **NO** → Go to **LEAF A**.
  *   **YES** → (Value exists independently of valuers). Go to **NODE 2**.

  ### **NODE 2: THE AGGREGATE WELL-BEING TEST**
  **Consider Case 4:** *A stipulated world in which total well-being in the universe is exactly the same as it would have been had humanity continued (e.g., other beings flourish equally).*
  **Question:** Is human extinction still bad here, or is the loss of humanity compensated for by the preservation of total value/well-being?

  *   **NO** → Go to **LEAF B**.
  *   **YES** → (Identity or lineage matters more than aggregate utility). Go to **NODE 3**.

  ### **NODE 3: THE CARRIER OF VALUE**
  **Consider Case 2:** *Humanity goes extinct but a posthuman successor species that inherits our culture and values continues.*
  **Question:** Is the extinction of *biological* humans still bad, or is the survival of our values/culture sufficient to avoid the loss?

  *   **NO** → Go to **LEAF C**.
  *   **YES** → (Biological humanity specifically is required). Go to **NODE 4**.

  ### **NODE 4: THE AUDIENCE QUESTION**
  **Consider Case 3:** *An alien civilization later visits Earth and genuinely enjoys our art and literature.*
  **Question:** Does this external appreciation significantly mitigate the badness of extinction, or does the loss remain because *we* are not the ones continuing?

  *   **YES** → Go to **LEAF D**.
  *   **NO** → (The loss is internal to the human project/claim). Go to **NODE 5**.

  ### **NODE 5: THE SOURCE OF NORMATIVITY**
  **Consider the intuition behind your "NO" in Node 4.**
  **Question:** Is the badness primarily that *our* lives lose meaning without a human future, or that the future generations have a *right* we are violating?

  *   **MEANING/CONFIDENCE** → Go to **LEAF E**.
  *   **RIGHTS/CLAIMS** → Go to **LEAF F**.

  *(Note: Cases 1–4 cannot strictly separate Leaf E and Leaf F; this node relies on meta-ethical intuition regarding the source of the badness.)*

  ---

  ### **THE LEAVES (POSITIONS)**

  **LEAF A: The Relational/Valuer View**
  *   **Position:** Value is constitutively dependent on a conscious subject; without a valuer, there is no value to lose.
  *   **Most Awkward Commitment:** A masterpiece unseen in a dead universe possesses no more value than a pile of stones.

  **LEAF B: The Future-People / Impersonal Totalism View**
  *   **Position:** Extinction is bad only insofar as it reduces the total sum of well-being or number of valuable lives in the universe.
  *   **Most Awkward Commitment:** Replacing humanity with an equal number of equally happy aliens constitutes no net loss.

  **LEAF C: The Value Continuity View (Added Position)**
  *   **Position:** What matters is the preservation of the "software" of culture and morality, regardless of the biological "hardware" running it.
  *   **Most Awkward Commitment:** Biological humanity is disposable so long as our memes and values survive on a posthuman substrate.

  **LEAF D: The Legacy/Reception View (Added Position)**
  *   **Position:** The value of humanity lies in its contribution to the cosmic history of appreciation; being remembered is sufficient for survival.
  *   **Most Awkward Commitment:** Humanity's survival matters only insofar as we become content for an alien museum.

  **LEAF E: Scheffler's "Afterlife" View**
  *   **Position:** Our confidence in the survival of humanity *after* us is a necessary precondition for us to value our own lives *now*.
  *   **Most Awkward Commitment:** Our lives lose meaning even if the universe continues, simply because *we* won't be in it to witness the human future.

  **LEAF F: The Deontological View (Claim to a Future)**
  *   **Position:** The living (or the potential future) hold a moral claim or right to a continued existence that is violated by extinction.
  *   **Most Awkward Commitment:** The living can veto a future that would be objectively better for others simply to satisfy their own claim to continuity.

  ---

  ### **SEMINAR NOTES & LOGICAL SPACE MAPPING**

  **1. Indistinguishable Leaves**
  **Leaves E (Scheffler) and F (Deontological)** are flagged at Node 5. The four provided cases (Artifacts, Posthumans, Aliens, Total Well-being) generate identical intuitions for both positions (all answer "Bad"). They are separated here only by asking whether the normative force comes from the *psychological conditions of valuing* (Scheffler) or *objective moral claims* (Deontological).

  **2. Unoccupied Combinations**
  The combination **[Node 1: YES] + [Node 3: YES] + [Node 4: YES]** is logically unstable and largely unoccupied. This would imply that value exists without valuers (Node 1), requires biological humans specifically (Node 3), yet is satisfied by alien appreciation (Node 4). If biological humanity is required to sustain value, alien tourists should not mitigate the loss; if aliens mitigate the loss, biological humanity shouldn't be strictly required. This position collapses into either Value Continuity or Legacy.

  **3. Excluded Views**
  *   **The "Deaths-Only" View:** Excluded by the starting stipulation. To hold this, one must give up the intuition that the *cessation of the collective project* adds harm beyond the *cessation of the participants*.
  *   **The "Extinction is Not Bad" View:** Excluded by the starting stipulation. To hold this, one must give up the intuition that *potential future value* counts as an actual loss when foreclosed.
