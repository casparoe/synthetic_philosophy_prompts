  **Materials and Prep List**

  *   **Slips:** 24 small pieces of paper per round (96 total), pre-printed with "Cooperate" / "Defect" checkboxes or blank for writing.
  *   **Envelopes:** 12 opaque envelopes for Round 3. 5 labeled "MIRROR" (inside: instruction "Your partner is a copy of you"), 7 labeled "OPEN" (inside: instruction "Your partner is another student"). *Prep:* Seal them. Shuffle.
  *   **Dice:** 24 standard six-sided dice for Round 3 (private randomization). 1 large visible die for Round 4.
  *   **Board:** Pre-draw the Payoff Matrix (C/C=3, D/D=1, C/D=0, D/C=5) and the Expected Utility table structure ($\alpha, \beta, g$).
  *   **Tickets:** 24 raffle tickets (or point ledger) convertible to a $20 voucher.
  *   **Coda Cards:** 8 cards marked "T=7" (hidden payoff), 16 standard.

  **Minute-by-Minute Timeline**

  *   **00:00–05:00:** Introduction. Distribute slips. Explain payoff matrix and ticket conversion.
  *   **05:00–15:00:** **Round 1 (Anonymous).** Collect, tally, display results.
  *   **15:00–25:00:** **Round 2 (Mirror).** Distribute slips. Read script. Collect, tally, display results.
  *   **25:00–45:00:** **Round 3 (Mixed).** Distribute envelopes and dice. Read script. Play (5 mins). Collect. **Tally Open Pairs** (5 mins). **Board Calculation** (5 mins).
  *   **45:00–55:00:** **Round 4 (Public Die).** Collect private dice. Roll public die. Read script. Play. Tally.
  *   **55:00–75:00:** **Debrief & Coda.** Derive condition. Name theory. Run Coda (6 mins).

  **Round Scripts (Max 2 Sentences)**

  *   **Round 1:** "Choose Cooperate or Defect; your partner is another student in this room, assigned randomly. Your payoff depends on both choices according to the matrix on the board."
  *   **Round 2:** "Choose Cooperate or Defect; for this round only, your payoff is calculated using your own choice twice, as if playing against an exact copy of yourself. Your partner's actual slip is not used."
  *   **Round 3:** "Open your envelope; five of you are playing a copy of yourself, seven are playing a partner, but you do not know which you are. You may use your die privately to randomize your choice."
  *   **Round 4:** "Choose Cooperate or Defect based on the outcome of this single public die roll; your partner is another student, but you may condition your choice on the shared number."

  **Tally Display**

  *   **After R1 & R2:** Simple count on board: `C: __ | D: __ | Avg Payoff: __`.
  *   **After R3 (Open Pairs Only):**
      1.  Ask Open pairs (7 pairs) to stand.
      2.  Ask CC pairs to raise hands ($N_{CC}$). Ask DD pairs to raise hands ($N_{DD}$). Remainder are CD ($N_{CD}$).
      3.  Write on board: $\hat{\alpha} = \frac{2 N_{CC}}{2 N_{CC} + N_{CD}}$, $\hat{\beta} = \frac{N_{CD}}{2 N_{DD} + N_{CD}}$, $\hat{g} = \hat{\alpha} - \hat{\beta}$.
      4.  Calculate live.
  *   **After R4:** `C: __ | D: __ | Correlation: Perfect`.

  **Debrief and Argument Mapping**

  1.  **Round 1 (Causal Baseline):** Most defected. This aligns with Causal Decision Theory (CDT): my choice cannot causally affect a distant, anonymous partner. $g \approx 0$, so $0 \ngtr (\beta+1)/3$.
  2.  **Round 2 (Functional Link):** Most cooperated. Here, correlation is forced by fiat ($\alpha=1, \beta=0, g=1$). This does not distinguish decision theories because the causal link is also established by the instructor; it simply shows the payoff structure favors C when $g=1$.
  3.  **Round 3 (The Threshold):** Reveal $p=2/5$. Show that total $g = p + (1-p)\hat{g}_{open}$. Since $\hat{g}_{open} \approx 0$, total $g \approx 0.4$.
      *   **Board Math:** $g > (\beta + 1)/3$. With $p=0.4$, cooperation is only optimal if the room's cooperation rate $q < 1/3$.
      *   **Naming:** This is the core of **Superrationality** (Hofstadter) or **Evidential Decision Theory**. The reason to cooperate is not causation, but the evidential correlation that a similar agent reasoning similarly will make the same choice.
      *   **Limitation:** Note that here, *I* created the correlation with envelopes. Superrationality claims reasoning alone creates this correlation; this game cannot prove that claim, only illustrate the payoff consequences if it holds.
  4.  **Round 4 (Schelling Point):** The public die created a shared causal input, restoring perfect correlation ($g=1$) without envelopes. Cooperation became dominant again.

  **Predictable Failures and Handling**

  1.  **Niceness in Round 1:** Students cooperate due to social preference, not strategy.
      *   *Handling:* In debrief, separate "utility from points" vs "utility from being nice." Remind them the voucher is trivial; if they still cooperated, ask if they would against a computer.
  2.  **Mirror Skepticism in Round 2:** Students believe the "copy" instruction is a trick.
      *   *Handling:* Show the mechanism explicitly. Collect slips, pick one, copy the mark to a second slip in front of them to calculate payoff.
  3.  **Signaling in Round 3:** Students try to glance at envelopes or signal choices.
      *   *Handling:* Strict proctoring. "Eyes on your desk." If caught, mark their payoff as zero for that round.
  4.  **Arithmetic Overload:** Students lose the thread during the $\alpha, \beta$ derivation.
      *   *Handling:* Keep the board work static. Do not erase the Payoff Matrix. Use colors for $\alpha$ and $\beta$.
  5.  **Envelope Mix-up:** Students open envelopes early or swap.
      *   *Handling:* Number envelopes 1–24. Assign seats. "Do not touch the envelope until I say open."

  **Limitations of the Activity**

  *   **Imposed Correlation:** The game supplies correlation via envelopes (Round 3) and rules (Round 2), not via pure reasoning. It demonstrates *why* correlation matters, not *that* reasoning generates it.
  *   **Symmetry Assumption:** Superrationality relies on agents being sufficiently similar. The game assumes this similarity but cannot verify it.
  *   **One-Shot Nature:** Real-world reputation effects are eliminated, which may feel artificial to students used to iterated games.

  **Coda (6 Minutes)**

  *   **Setup:** Hand 8 students a card stating "Your Temptation Payoff is 7" (instead of 5). Announce this fact but not who holds the cards.
  *   **Question:** "If a superrational pair holds mismatched cards (one T=5, one T=7), what should they do?"
  *   **Purpose:** To test the robustness of the symmetry assumption. Superrationality suggests choosing the policy that maximizes utility if *all* similar agents adopt it.
  *   **Expected Answers:**
      *   *Cooperate:* Joint payoff (3+3=6) still exceeds mutual defection (1+1=2).
      *   *Defect:* The T=7 holder has a stronger individual incentive; if reasoning diverges based on payoff, correlation breaks.
  *   **Recommendation:** **Keep it.** It forces students to confront the "similar agent" definition. If time runs short during the main debrief, cut the Coda, as the core lesson (Round 3 threshold) is more important.

  \answer{mirror round: C; anonymous round: D; cooperate iff g > (\beta + 1)/3; p = 2/5 symmetric fixed point: cooperate with probability 1/3; cooperation pays at every base rate iff p >= 0.5; public-die round: C}
