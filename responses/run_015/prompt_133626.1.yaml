answer: |-
  This is a remarkably well-posed problem. You are asking for a research agenda that treats fairness constraints not as static algebraic relations but as components of a complex, adaptive socio-technical system. Given your background, you will recognize that the current state of fairness literature resembles equilibrium statistical mechanics applied to a driven, dissipative system: the math is elegant, but it describes a state the system never actually occupies.

  Here is my assessment of your two intuitions, followed by a defended funding agenda, the "do not fund" list, and the re-evaluation triggers.

  ### Part 1: Grading Your "Hobby-Horses"

  **1. The Reflexivity Problem (Static vs. Diachronic)**
  *   **Grade:** **A (High Priority, Partially Explored but Superficially).**
  *   **Assessment:** You are correct that this is where the "real action" is, but you should know it is not entirely neglected. The literature on *performative prediction* (Perdomo et al., 2020) and *dynamic fairness* (Hu et al., 2019; Miller et al., 2020) exists. However, most of this work is technical ML stability analysis (does the model converge?) or utilitarian welfare analysis (does this maximize utility over time?).
  *   **The Gap:** What is missing is the *normative* integration. We lack a theory of how fairness constraints *themselves* evolve under reflexivity. If you enforce error-rate balance today, does the base rate divergence tomorrow make the constraint oppressive? Is there a "phase transition" where a fairness constraint flips from protective to harmful due to feedback loops?
  *   **Verdict:** Fund this, but steer grantees away from pure convergence proofs. Push them toward the *normative stability* of the constraints themselves.

  **2. The Multi-Principal Composition Problem**
  *   **Grade:** **A+ (High Priority, Genuinely Neglected).**
  *   **Assessment:** This is the stronger of your two intuitions. The literature assumes a "monolithic optimizer." In reality, fairness is a supply chain. A vendor optimizes for AUC under a demographic parity constraint; a hospital admin sets a threshold to minimize cost; a regulator audits for calibration.
  *   **The Gap:** This is a mechanism design problem wrapped in moral philosophy. If the constraints are incompatible across the pipeline, where does the moral residue land? Current "composition of fairness" literature (Dwork et al.) focuses on mathematical composition of classifiers, not the *organizational* composition of decision-rights.
  *   **Verdict:** This is highly tractable for philosophers and game theorists without needing data. It explains why the impossibility theorems feel disconnected from practice: because the "system" satisfying the theorem doesn't exist as a single agent.

  ---

  ### Part 2: The Funded Agenda (Three Conceptual Priorities)

  If I were allocating your four postdocs/grants, I would structure them around these three questions, in this order.

  #### Priority 1: The Thermodynamics of Fairness Constraints (Diachronic Normativity)
  *   **The Question:** Under what dynamical conditions does a static fairness constraint become unstable or self-defeating? Can we classify fairness constraints by their "attractor behavior" in a reflexive system?
  *   **Why Upstream:** Static impossibility theorems assume the joint distribution $P(X, Y, A)$ is fixed. If $P$ shifts endogenously due to the decision rule $f$, the theorem's premises vanish. We need to know if there exist constraints that are *robust* to distributional shift, or if we need a entirely new vocabulary (e.g., fairness as a control trajectory rather than a state).
  *   **Tractability:** High for your target cohort. This requires dynamical systems modeling, agent-based simulation, or control theory—all doable with synthetic data. It allows philosophers to define the "good" states and statisticians to model the flow.
  *   **Neglectedness:** Moderate. The ML community looks at convergence; the philosophy community looks at static justice. The intersection (normative stability) is open.
  *   **Why Fund:** It directly leverages your physics intuition. It moves the field from "which metric is best?" to "which metric survives contact with reality?"

  #### Priority 2: The Architecture of Accountability (Multi-Principal Composition)
  *   **The Question:** How do normative constraints degrade or transform when decision-making authority is fragmented across non-communicating agents (vendor, deployer, auditor)? Can we define "compositional liability" for fairness violations?
  *   **Why Upstream:** This addresses the "who is responsible?" gap that renders many impossibility results politically inert. If no single principal can satisfy the constraints, demanding they do so is category error. We need a theory of *distributed fairness satisfaction*.
  *   **Tractability:** High. This is conceptual work in legal theory, moral philosophy, and mechanism design. It requires no proprietary data, only logical modeling of incentive structures and contractual obligations.
  *   **Neglectedness:** High. Most "governance" literature is policy advocacy (what should the law be?). We need conceptual groundwork (what *is* the structure of responsibility here?).
  *   **Why Fund:** It explains the failure of current audits. It provides a framework for regulators who are currently trying to regulate a "black box" that is actually a "gray market" of hand-offs.

  #### Priority 3: The Ontology of the Label (Construct Validity)
  *   **The Question:** To what extent do impossibility theorems rely on $Y$ (the outcome) being a well-defined natural kind rather than a contested social construct? If $Y$ is unstable, are the constraints ill-posed?
  *   **Why Upstream:** All current impossibility results assume $Y$ is ground truth (e.g., "recidivism," "creditworthiness"). In social systems, $Y$ is often a proxy for a latent construct that is itself disputed. If the target variable is metaphysically unstable, optimizing for statistical parity on $Y$ is optimizing for noise.
  *   **Tractability:** Moderate. This is primarily philosophy of science and measurement theory. It requires analyzing how variables are operationalized in high-stakes domains (health, justice).
  *   **Neglectedness:** Moderate to High. There is some work on "measurement fairness," but it is often drowned out by the metric wars.
  *   **Why Fund:** It prevents the field from solving the wrong equations with higher precision. It forces a confrontation with whether the prediction problem is well-posed before asking if the solution is fair.

  ---

  ### Part 3: What I Would Decline to Fund

  You suspected "propose a new metric" is saturated. I agree, but I will be more specific. I would reject proposals in these three categories:

  1.  **New Scalar Fairness Metrics:** The space of statistical parity definitions is fully explored. We do not need a 15th definition of "equalized odds." The impossibility theorems prove that adding more scalars doesn't solve the tension; it just adds dimensions to the trade-off surface. Fund work that *dissolves* the trade-off (e.g., by changing the objective function or the timeline), not work that maps it finer.
  2.  **"Fairness vs. Accuracy" Trade-off Curves:** This is a zombie topic. We know there is a trade-off. Plotting it for a new dataset adds no conceptual clarity. The interesting question is *why* the trade-off exists (is it noise? bias? structural?), not *that* it exists.
  3.  **Purely Doctrinal Legal Analysis:** Unless the legal theorist is engaging with the mathematical structure of the constraints, this will be policy advocacy, not conceptual work. We don't need more papers arguing "GDPR Article 22 should mean X." We need papers arguing "If GDPR Article 22 means X, the optimization problem becomes ill-posed because Y."

  **The Argument:** The field is suffering from *precision without accuracy*. We have very precise definitions of fairness applied to inaccurate models of the social world. Funding more precision (new metrics, new bounds) is diminishing returns. Funding better models of the social world (dynamics, composition, measurement) is where the leverage is.

  ---

  ### Part 4: Re-evaluation Triggers (The "3-Year Check")

  You asked what event would move these priorities up or down. Here are the specific triggers I would watch:

  1.  **The "Runaway" Event (Moves Priority 1 Up):** If a major deployed system (e.g., predictive policing, child welfare) is decommissioned specifically because it created a feedback loop that exacerbated the very risk it was predicting, *despite* satisfying static fairness audits. This proves static audits are not just insufficient, but potentially dangerous masking devices.
  2.  **The "Liability Split" Case (Moves Priority 2 Up):** A court case where a fairness violation occurs, but the vendor is absolved because they met the contract, and the deployer is absolved because they used a certified tool. If the law struggles to assign blame due to pipeline fragmentation, the conceptual work on composition becomes urgent.
  3.  **The "Label Collapse" (Moves Priority 3 Up):** If a major foundation dataset (e.g., ImageNet equivalents in social science) is retracted or fundamentally re-annotated because the target variable is deemed socially constructed rather than objective. This validates the "Ontology of the Label" agenda.
  4.  **The "LLM Shift" (Moves All Down/Right):** If generative models fundamentally change the decision architecture from *classification* (assigning risk scores) to *generation* (creating interventions/content), the entire impossibility framework based on $P(Y|X)$ might become obsolete. If this happens within 3 years, you pivot to "Fairness in Generative Action."

  ### Summary of Reasoning

  My reasoning rests on a physics analogy you will appreciate: The current fairness literature is treating social systems as **equilibrium ensembles**. They calculate properties (fairness metrics) assuming the Hamiltonian is fixed and the system is ergodic.

  Your intuition is that these are **non-equilibrium, driven systems** with **multiple interacting Hamiltonians** (the multi-principal problem).

  1.  **Reflexivity** acknowledges the system is driven (non-equilibrium).
  2.  **Composition** acknowledges there isn't one Hamiltonian (fragmented control).
  3.  **Construct Validity** acknowledges the order parameters might be ill-defined.

  Funding this agenda moves the field from "calculating properties of a static gas" to "understanding the hydrodynamics of a turbulent flow." It is riskier—there are fewer closed-form solutions—but it is the only path that connects the math to the phenomenon. Given your constraint on *conceptual* work, this is the highest-leverage use of capital: building the theoretical scaffolding that empirical researchers and policymakers will need in the next decade.
