  **(Self-Correction during drafting):** I initially thought about suggesting "Causal Fairness" as a priority. But the user is coming from stat mech/impossibility theorems. Causal fairness often just shifts the impossibility elsewhere (assumptions about the DAG). The *Construct Validity* point is more fundamental. If the variable doesn't mean what you think, the DAG is wrong. I'll stick with Construct Validity as Priority 3.

