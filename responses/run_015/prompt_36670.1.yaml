  2.  **Natural Brancusi:** A weathered stone found in a riverbed looks exactly like a Brancusi sculpture. No human touched or selected it.
  3.  **Chimp Canvas:** A chimpanzee paints spontaneously. A museum acquires it for its visual appeal, knowing the chimp had no artistic intent.
  4.  **Pure AI:** An algorithm generates an image with zero human selection or prompting. A gallery hangs it alongside human works.
  5.  **Empty Gesture:** An artist displays a blank canvas in a gallery, claiming it represents silence. It has no aesthetic merit and viewers find no meaning.
  6.  **Buried Masterpiece:** A painter creates a work but buries it in a crate. It is discovered 200 years later, unseen by any contemporary audience.
  7.  **Bathroom Urinal:** A standard urinal sits in a public restroom. It is physically identical to Duchamp's *Fountain* but never submitted to a committee.
  8.  **Sunset Rothko:** A sunset displays color fields identical to a Rothko painting. No human agency created the pattern.
  9.  **Accidental Spill:** A janitor spills paint that looks like a Pollock. The artist claims it as their own later.
