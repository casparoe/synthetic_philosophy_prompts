answer: |-
  # The Kestrel Causal Triage (KCT) Protocol

  **Purpose:** Convert 60–90 page diagnostic reports into portfolio decisions within 90 minutes.
  **Users:** Desk Officers (PolSci/Policy background).
  **Epistemic Grounding:** Outcomes are overdetermined; causes interact; lags exceed funding windows; immutability equals context.
  **Output:** One-page Decision Note ending in a Verdict Code.

  ### Stage 1: The Heritage Filter (15 Minutes)
  **Question:** Is the primary cause identified in the report mutable by human intervention within a ten-year horizon?
  **Procedure:** Scan the executive summary and causal chain. Tag any cause rooted in geography (landlocked, disease ecology), deep history (colonial extraction regimes, 19th-century state formation), or demographics as **Heritage**.
  **Pass Condition:** The report identifies a bottleneck that is not geographic or historical inevitability.
  **Fail Action:** If the primary cause is Heritage, mark Diagnosis as **Context**. Verdict: **HOLD** (unless a specific lever exists to mitigate the heritage, e.g., infrastructure for landlockedness).
  **Note:** A cause that operates on a multi-decade lag (e.g., "education quality") cannot be tested inside a five-year funding window. Reclassify as Heritage unless a short-term proxy exists.

  ### Stage 2: The Charter Constraint (10 Minutes)
  **Question:** Does the diagnosis rely on changing interpersonal norms, trust, or "culture" to achieve impact?
  **Procedure:** Search for keywords: *trust, social capital, norms, civic culture, corruption as culture*.
  **Pass Condition:** The mechanism is institutional or economic, not cultural.
  **Fail Action:** If the root cause is Culture, acknowledge the Charter. Do not relabel as "Governance." Verdict: **REFER** (to Director's Panel for strategic waiver or explicit acceptance of inaction).
  **Note:** We do not fund culture. If the report says "low trust prevents investment," that is a true diagnosis we cannot act on. Honesty is required.

  ### Stage 3: The Lever Test (20 Minutes)
  **Question:** Does the report name an instrument the Kestrel Fund could actually deploy within five years that would move the claimed cause?
  **Procedure:** Map the proposed intervention to the cause. If the cause is "weak tax administration," can Kestrel fix tax administration in 5 years? If the cause is "elite capture," can Kestrel prevent elite capture?
  **Pass Condition:** There is a plausible, direct link between a $5M–$10M intervention and a measurable shift in the cause.
  **Fail Action:** If the lever is too small for the problem (e.g., training judges to fix systemic rule of law), reclassify the cause as **Structural**. Verdict: **HOLD**.
  **Note:** Distinguish between *moving* a cause and *measuring* a cause. We need to move it.

  ### Stage 4: The Kill Condition (25 Minutes)
  **Question:** What observable event inside the funding window would show this diagnosis was wrong, and by what date?
  **Procedure:** Draft a falsification statement. It must be specific, time-bound, and independent of the project's own success metrics.
  **Pass Condition:** A specific date and metric are identified where failure implies the theory is wrong, not just the project failed.
  **Fail Action:** If the only failure mode is "implementation delay" or "budget underspend," the theory is unfalsifiable. Verdict: **HOLD**.
  **Note:** If no Kill Condition can be written, the diagnosis is a narrative, not a mechanism.

  ### Stage 5: Verdict Assignment (20 Minutes)
  **Question:** Based on Stages 1–4, what is the portfolio decision?
  **Procedure:** Apply the logic tree.
  *   **FUND:** Passes Lever, Passes Kill, Not Heritage, Not Culture.
  *   **FUND-WITH-KILL-CONDITION:** Passes Lever, Kill Condition is high-risk/high-reward (explicitly attach the condition to the grant agreement).
  *   **HOLD:** Fails Lever, Fails Kill, or Is Heritage/Context.
  *   **REFER:** Fails Charter (Culture), or disagreement is about values (e.g., "Is stability worth more than growth?").
  **Output:** Write the One-Page Note. Sign with Verdict Code.

  ***

  # Worked Cases

  ### Case 1: Vandara
  **Claim Under Review:** Institutional reform (1994 Constitution) drove growth; its stagnation caused the stall.
  **Triage Result:**
  *   **Stage 1 (Heritage):** Pass. Constitutions are mutable, though slow.
  *   **Stage 2 (Charter):** Pass. Institutional, not cultural.
  *   **Stage 3 (Lever):** Fail. The report cites a 1994 constitutional reform as the natural experiment. Kestrel cannot fund constitutional reform in 5 years. The report admits growth stopped the same quarter copper prices fell. The *actual* driver appears to be Terms of Trade (Commodities), which is Heritage/External.
  *   **Stage 4 (Kill):** N/A (Failed Stage 3).
  **Verdict Code:** **HOLD**
  **Rationale:** The diagnosis conflates institutions with commodity cycles. We cannot move the constitution, and we cannot control copper prices. The "Institution" lever is too heavy for the Fund's weight class.

  ### Case 2: Sembwe-Kalunda (Paired Case)
  **Claim Under Review:** Low interpersonal trust (Culture) prevented industrialization in Kalunda.
  **Triage Result:**
  *   **Stage 1 (Heritage):** Pass. Trust is theoretically mutable.
  *   **Stage 2 (Charter):** Fail. The diagnosis explicitly names "trust in strangers" and "culture." The Charter forbids funding culture change. The survey data is endogenous (taken after divergence), making it a description of the outcome, not a cause.
  *   **Stage 3 (Lever):** Fail. No instrument exists to raise societal trust in 5 years.
  *   **Stage 4 (Kill):** N/A.
  **Verdict Code:** **REFER**
  **Rationale:** The honest diagnosis is Culture, which we are forbidden to touch. This requires a Director-level decision on whether to acknowledge the constraint and walk away, or seek a workaround that risks charter violation.
  **Uneliminated Alternative:** Industrial policy failure (State capacity), which would be fundable but was not the report's focus.

  ### Case 3: Maroya
  **Claim Under Review:** Public integrity deficits block service delivery; Kestrel's $40M Integrity Programme fixes this.
  **Triage Result:**
  *   **Stage 1 (Heritage):** Pass. Integrity is mutable.
  *   **Stage 2 (Charter):** Pass. Institutional.
  *   **Stage 3 (Lever):** Pass (Technically). We are already funding it.
  *   **Stage 4 (Kill):** Fail. The report cannot separate institutional improvement from the concurrent Terms-of-Trade windfall. If integrity metrics drop, is it the program failing or the windfall ending? No clean Kill Condition exists.
  **Verdict Code:** **HOLD**
  **Rationale:** The diagnosis is confounded by external windfalls. We cannot know if the intervention works. Continuing is laundering priors.
  **Director Memo (3 Sentences):**
  > The diagnostic report conflates our integrity programme's impact with the concurrent commodity windfall, making causal attribution impossible within the funding window. Because we cannot establish a Kill Condition that separates institutional performance from terms-of-trade volatility, the evidence base for continued investment is insufficient. I recommend holding further disbursements until a counterfactual can be established, despite the political cost.

  ***

  # Critique: Where the Procedure Breaks

  **Judgment Calls Dressed as Procedure:**
  Stage 3 (Lever Test) is the weakest link. Determining whether a lever is "plausible" within five years is subjective. An optimistic officer will say "Technical assistance can fix tax collection"; a cynical one will say "Only politics fixes tax collection." The procedure forces a binary choice on a spectrum of probability. Officers will get this wrong without a theory of change that distinguishes *capacity* (fixable) from *incentives* (harder).

  **Distinctions Officers Will Miss:**
  Officers will confuse *correlation* with *mechanism* in Stage 1. Just because a constitution changed and growth happened doesn't mean the constitution caused the growth (Vandara). Without econometrics, they must rely on timeline logic, which consultants can easily manipulate by cherry-picking start/end dates. They will also struggle to distinguish "Culture" from "Informal Institutions." If a report says "Clientelism blocks hiring," is that culture (forbidden) or institutions (fundable)? The procedure demands a binary that reality blurs.

  **Systematic Misfires:**
  The KCT will systematically misread **Slow-Change Countries**. In places where the only binding constraint is deep institutional rot (e.g., rule of law), the Lever Test will force a HOLD verdict every time because nothing moves in 5 years. This biases the portfolio toward "quick wins" (infrastructure, health campaigns) and away from state-building, even if state-building is the only thing that matters long-term. It also misreads **Small Island States**, where geography (Stage 1) is so dominant that almost every diagnosis gets filtered to Heritage/HOLD, potentially starving them of adaptation funding.

  **Gaming the Kill Condition:**
  Clever consultants will game Stage 4 by proposing Kill Conditions that are impossible to trigger (e.g., "GDP growth < 0%") or dependent on external data we don't control. They will write conditions that measure *activity* (reports filed) rather than *outcome* (corruption reduced), allowing the project to survive even if the diagnosis is wrong.

  ***

  # Machine-Readable Objects

