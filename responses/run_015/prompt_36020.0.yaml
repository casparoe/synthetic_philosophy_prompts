answer: |-
  Hospital Administrator Elena faces a binding budget constraint with only enough funds for one initiative. She can purchase a specialized spinal implant for Marcus, a teenager who will otherwise remain bedridden with excruciating nerve pain for the rest of his life. Alternatively, she can fund a widely available therapy for 1,000 workers suffering from permanent, debilitating back injuries; without it, they will retain full sensation but live with chronic pain and limited mobility that prevents heavy labor and disrupts sleep. The costs are identical; choosing one forecloses the other.

  If Elena chooses the therapy, Marcus remains bedridden while the workers return to partial function. If she chooses the implant, Marcus walks pain-free while the 1,000 workers continue to suffer chronic limitations. The choice forces a direct conflict between the depth of one person's misery and the breadth of many people's discomfort. Elena must decide which group receives the resource, knowing that denying the other group guarantees their continued suffering.

  (a) Under Scanlon's contractualism, Elena must seek a principle of allocation that no individual could reasonably reject. She tests the principle "fund the therapy" against Marcus's standpoint: he faces a life of bedridden agony, a complaint of extreme stringency. She then tests the principle "fund the implant" against a single worker's standpoint: each faces chronic pain and limited mobility, a serious but lesser complaint. Contractualism refuses to add the 1,000 workers' complaints together to outweigh Marcus's; justification is owed to individuals, not collectives. Because Marcus's individual complaint is significantly stronger than any single worker's complaint, he can reasonably reject the principle that sacrifices him for the sake of the many. Thus, the theory directs Elena to save Marcus, prioritizing the worst-off individual over the aggregate welfare.

  (b) The feature doing the work is the non-aggregation constraint inherent in the reasonable-rejection test. The verdict hinges entirely on the prohibition against summing moderate burdens to override a severe burden. If this feature is removed—if we allow the workers' complaints to be pooled into a collective claim—the moral arithmetic flips. The total utility lost by the 1,000 workers would likely exceed the utility lost by Marcus, leading to the utilitarian verdict of funding the therapy. The contractualist verdict relies on the insistence that moral justification must be acceptable to each person separately, rendering the number of people affected irrelevant when individual burdens are unequal.

  (c) The strongest contractualist reply invokes ex ante statistical risks rather than ex post outcomes. Scanlon suggests that in institutional settings, we might justify policies based on what individuals would agree to behind a veil of ignorance. Knowing there is a 1,000/1,001 chance of being a worker versus a 1/1,001 chance of being Marcus, a rational agent might accept a policy favoring the many to minimize their expected burden. However, this reply succeeds only partially. It shifts the focus from actual suffering to probabilistic consent, which comforts the administrator but fails to address the intuitive horror of leaving Marcus bedridden when he could be saved. It softens the counterintuitive result by changing the subject from individual rescue to fair policy, but it does not fully dissolve the tension between individual rights and aggregate welfare.
