      *   *Example 2: Reasoning LLM with CoT.*
          *   Architecture: Transformer. CoT tokens generated, then fed back as input.
          *   Analysis: Tokens are discrete, but are they symbols? They are just embeddings. The causality is still gradient-descent optimized substrate. The "symbol" is just another part of the sequence.
          *   Verdict: Substrate-only (Simmballs).
          *   Nuance: The CoT *looks* like reasoning, but architecturally, it's just next-token prediction conditioned on previous tokens.

  6.  **Addressing the "20 Minutes/Docs Only" Constraint:**
