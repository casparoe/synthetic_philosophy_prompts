      *   *Step 2: Substrate-Invariance (Multiple Realizability).* If I change the substrate (e.g., quantization, different initialization), does the symbolic logic hold? Or is the symbol tied to specific activation patterns?
      *   *Step 3: Temporal Precedence.* Does the symbolic state exist *before* the substrate update it claims to cause?
      *   *Refinement:* Since this is docs-only, "Intervention" means "Designed Intervention." "Invariance" means "Modularity." "Temporal" means "Data Flow Graph."

  4.  **Developing the Criteria:**
      *   *Pass:* Clear architectural separation, explicit control flow.
