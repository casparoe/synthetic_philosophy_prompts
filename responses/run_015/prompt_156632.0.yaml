          *   Applications: Apply to (1) Classic Symbolic Planner + Neural Front-end, (2) Reasoning LLM with Chain-of-Thought (CoT) looping back.
          *   Specific Outcome Requirement: One application must conclude "real symbol-push" but be an answer the user "probably won't like" (implying a controversial or counter-intuitive finding).
          *   Honesty: Acknowledge what the procedure *cannot* settle.
