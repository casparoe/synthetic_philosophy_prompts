      *   *The AI Equivalent:* Do high-level representations (tokens, concepts, plan nodes) causally influence the low-level weights/activations, or are they just descriptions of the low-level activity?
      *   *The Constraint:* Architecture docs only, 20 minutes. This is *extremely* restrictive. True causal analysis requires intervention (causal scrubbing, ablation, etc.). Reading docs can only tell you about *designed* causality, not *emergent* causality. I need to make sure the user understands this limitation while fulfilling the request.

  3.  **Drafting the Procedure (The "Symbol-Causation Screen" - SCS):**
