answer: |-
  **SEMINAR HANDOUT: MAPPING THE BOUNDARY PROBLEM**
  **Session:** Democratic Theory | **Topic:** Constituting the Demos

  **INSTRUCTIONS:** Start at **Node 1**. Answer the question based on your intuition about the cases (commuters, residents, expats, future generations, etc.). Follow the routing until you reach a **Leaf**. Locate your position in the table below.

  **THE DECISION TREE**

  **Node 1:** Does the composition of the voting body require a moral justification to those it excludes, or is it ultimately a fact of power that creates the group?
  *   If **Fact of Power**: Go to **Leaf 1**.
  *   If **Moral Justification**: Go to **Node 2**.

  **Node 2:** Is the primary claim to vote based on being *subject to the law's coercion* or *affected by the decision's outcome*?
  *   If **Subject to Coercion**: Go to **Node 3**.
  *   If **Affected by Outcome**: Go to **Node 4**.

  **Node 3:** Does mere presence within the jurisdiction count as subjection (e.g., tourists, incarcerated people), or does it require acceptance of the authority?
  *   If **Mere Presence**: Go to **Leaf 2**.
  *   If **Acceptance Required**: Go to **Leaf 3**.

  **Node 4:** Does "affected" mean *any causal difference* (e.g., global market shifts) or only *setbacks to vital interests/autonomy*?
  *   If **Any Causal Difference**: Go to **Leaf 4**.
  *   If **Vital Interests**: Go to **Node 5**.

  **Node 5:** Must the group of voters be the *same people* for all decisions (stable demos) or can it *change per issue* (fluid demos)?
  *   If **Stable Demos**: Go to **Node 6**.
  *   If **Fluid/Issue-Specific**: Go to **Node 9**.

  **Node 6:** Is the boundary of the stable demos marked by *legal citizenship* or *territorial residence*?
  *   If **Legal Citizenship**: Go to **Node 7**.
  *   If **Territorial Residence**: Go to **Node 8**.

  **Node 7:** Do citizens who have emigrated permanently with no intent to return retain voting rights?
  *   If **Yes**: Go to **Leaf 5**.
  *   If **No**: Go to **Leaf 6** (Note: Functionally similar to Residence).

  **Node 8:** Is the right of residents to vote absolute, or defeasible by feasibility/stability constraints?
  *   If **Absolute**: Go to **Leaf 7**.
  *   If **Defeasible (Pro Tanto)**: Go to **Leaf 8**.

  **Node 9:** (Fluid Demos) Is capacity for agency required to have a stake (e.g., are children excluded)?
  *   If **Yes (Agency Required)**: Go to **Leaf 9**.
  *   If **No (Interest Sufficient)**: Go to **Node 10**.

  **Node 10:** Does the stake extend to future generations who cannot currently participate?
  *   If **Yes**: Go to **Leaf 10**.
  *   If **No**: Stop (Incoherent: If agency isn't required, arbitrary temporal cutoff lacks principle).

  ***

  **POSITION TABLE**

  | Leaf | Position Name | Diagnostic Commitment (The "Awkward" Bit) |
  | :--- | :--- | :--- |
  | **1** | **Decisionist / Realist** | *Flag:* Refuses the question; democracy is merely the rule of those strong enough to constitute themselves. |
  | **2** | **All-Subjected (Jurisdictional)** | Tourists and incarcerated felons must vote; permanent residents who reject authority need not. |
  | **3** | **All-Subjected (Voluntarist)** | Long-term residents who reject the state's legitimacy are excluded despite being coerced by it. |
  | **4** | **Empty: Trivial Affectedness** | *Note:* Incoherent; renders borders impossible as everyone is affected by everything causally. |
  | **5** | **Citizenship Principle** | Permanent expats vote on local transit levies; long-term tax-paying non-citizen residents do not. |
  | **6** | **Civic Residence Principle** | Functionally excludes expats, but theoretically distinct from Leaf 8 on the *source* of the right. |
  | **7** | **Strict Residence Principle** | Feasibility cannot override a resident's claim; may require dissolving the state to accommodate all residents. |
  | **8** | **Pragmatic Residence** | A resident's claim can be outweighed by stability; risks collapsing back into Citizenship (Leaf 5) in practice. |
  | **9** | **All-Affected (Agency)** | Children and cognitively incapacitated residents are excluded from decisions that determine their life chances. |
  | **10** | **Intergenerational Demos** | Requires proxy voting for the unborn; struggles to specify the weight of their votes relative to the living. |

  ***

  **INDISTINGUISHABLE LEAVES**
  **Leaf 6 (Civic Residence) and Leaf 8 (Pragmatic Residence):** The tree cannot separate these in practice. If feasibility constraints (Leaf 8) are weighted heavily enough to ensure stability, the resulting boundary will almost always mirror legal citizenship, making the theoretical distinction between "residence right" and "citizenship proxy" operationally null.

  **INSTRUCTOR NOTE ON NODE 1:**
  The "Decisionist" option (Leaf 1) is included to satisfy the request for a skeptical view. However, treat this as a *refusal* of the boundary question rather than an answer. It claims the demos is constituted by a prior political act that cannot itself be democratized without circularity.
