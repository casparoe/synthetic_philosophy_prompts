  # Seminar Activity: The Regret Pump

  **Time:** 75 Minutes
  **Participants:** 14 Students (7 Pairs)
  **Materials:** Poker chips (approx. 20 per student), Index Cards (3 types: Asset, Preference, Role), d6.

  ## 1. The Setup (10 Minutes)

  **The Story:**
  Tell the class they are entering a simulated market. They are not playing as themselves, but as *agents* with specific utility functions. Their goal is to maximize their final chip count (their "wealth").

  **The Roles:**
  Split the room into 7 pairs.
  *   **Agent (7 students):** Holds an asset and chips. Has a specific preference ordering.
  *   **Market Maker (7 students):** Holds a inventory of assets. Offers trades.

  **The Assets:**
  Three index cards labeled **A**, **B**, and **C**.
  *   **Base Redemption:** At the end of the game, *all* assets (A, B, or C) redeem for **10 chips** from the Bank (Instructor).
  *   *Note:* This is public knowledge. Objectively, the assets are identical.

  **The Preference Card (Agent Only):**
  Give each Agent a sealed envelope containing their "Utility Card."
  *   *Text:* "You are an intransitive agent. Your strict preferences are: **B > A**, **C > B**, **A > C**. Whenever you hold a preferred asset over your current one, you experience a 'Satisfaction Gain' equivalent to **2 chips**. Whenever you pass up a preferred swap, you experience a 'Regret Penalty' equivalent to **2 chips** (deducted at cash-out)."
  *   *Instruction:* "You must act to maximize your Utility. This means you should accept a trade if it moves you up your preference list, unless the cost outweighs the gain."

  **The Costs & Risks (Public):**
  1.  **Transaction Fee:** Every swap costs **1 chip**, paid immediately to the Bank (Instructor).
  2.  **Termination Risk:** After *every* completed trade, the Instructor rolls a d6. If the result is **1**, the game ends immediately for that pair.
  3.  **Inactivity Penalty:** If an Agent completes **zero trades** by the time the game ends, they incur a **5 chip 'Market Exclusion' penalty**. (This satisfies the constraint that refusing everything forgoes real gains/opportunities).

  **Starting Endowment:**
  *   **Agent:** Asset **A** + **10 Chips**.
  *   **Market Maker:** Inventory of Assets (A, B, C) + **0 Chips**. (Their score is the number of fees they facilitate, or simply "win" by draining the Agent).

  ## 2. The Trading Protocol (20 Minutes)

  1.  **Offer:** Market Maker looks at Agent's current asset. Based on the Agent's known preference cycle (Market Makers get a "Cheat Sheet" showing the cycle A→B→C→A), they offer the preferred asset.
      *   *Example:* Agent holds A. Maker offers B.
  2.  **Decision:** Agent chooses **Accept** or **Reject**.
      *   **If Accept:** Agent pays 1 chip to Bank. Assets swap. Instructor rolls d6. If 1, Game Over. If 2-6, continue.
      *   **If Reject:** No fee. Instructor rolls d6. If 1, Game Over. If 2-6, Maker offers the *same* trade again (up to 3 times total per "stage") or moves to the next link in the chain if the Agent is stubborn. *Simplification:* To keep pace, limit each pair to **3 Trade Opportunities** max, or until the die ends it.
  3.  **Cash Out:**
      *   Final Score = Remaining Chips + Asset Redemption (10) - Regret Penalties (if any) - Inactivity Penalty (if 0 trades).
      *   *Crucial:* The "Satisfaction Gain" (2 chips) is **not** cashed out. It is only a motivator for trading. This creates the disconnect between "feeling richer" and "being richer."

  ## 3. Round 1 & Swap (30 Minutes)

  *   **Round 1 (20 mins):** Run the game. Circulate to ensure fees are paid to *you* (the Bank) and dice are rolled. Record final scores on the board.
      *   *Expected Outcome:* Most Agents will trade 1 or 2 times. Some will cycle all the way back to A. Those who cycle 3 times end with Asset A and -3 chips (plus Inactivity Penalty avoided). Those who refuse all end with Asset A and -5 chips (Inactivity Penalty). Those who stop midway avoid the full drain but pay fees.
  *   **Swap Roles (10 mins):** Agents become Market Makers and vice versa. Run a faster second round (10 mins). This lets the "Exploiters" feel the frustration of trying to pump, and the "Agents" feel the pressure of the fee structure again.

  ## 4. The Debrief (15 Minutes)

  **Phase 1: The Data (5 mins)**
  *   Ask: "Who ended with fewer chips than they started?" (Likely everyone who traded).
  *   Ask: "Who ended with the same asset they started with?" (Those who cycled or refused all).
  *   Point out the **Inactivity Penalty**: "Those who refused to play lost 5 chips. Those who played the full cycle lost 3 chips. The pump *worked*, but the penalty made sitting out worse."

  **Phase 2: Mapping the Theory (5 mins)**
  *   **Myopic Trading:** "Who traded because B > A *right now*, without thinking about the return to A?" (This is the standard money pump vulnerability).
  *   **Backward Induction:** "Did anyone plan to refuse the third trade (C→A) because they knew they'd lose chips?" (This is the rational response to a finite horizon).
  *   **Pre-commitment:** "Did anyone try to bind themselves to 'No Trades' at the start?" (This is the commitment solution).
  *   **The Die Roll:** "How did the termination risk affect you?" (It prevents the 'wait it out' strategy; you might miss the Inactivity Bonus if the game ends too soon).

  **Phase 3: The Uncomfortable Conclusion (5 mins)**
  *   **Wrinkle 1 (The Fee):** "Notice that if the Fee were **3 chips** instead of 1, you wouldn't have traded. The gain (2 utils) < cost (3 chips). You would have kept A, paid the Inactivity Penalty, but lost less overall."
  *   **The Lesson:** "The money pump doesn't prove you must be transitive. It proves you must be **acyclic relative to transaction costs**."
  *   **Write on Board:** `Transitivity` vs. `No-Profitable-Cycles`.
  *   "If the cost of swapping is high enough, intransitivity is harmless. Rationality requires that your preferences don't form a cycle *that you can afford to exploit*."

  ## 5. Predictable Failures & Mitigations

  1.  **Collusion:** Students may agree to split chips ("I'll trade you, we'll split the fee").
      *   *Mitigation:* Announce that "Side payments are forbidden. Only Bank transactions count."
  2.  **Counting the Cycle:** Agents may realize "If I trade 3 times, I'm back at A."
      *   *Mitigation:* This is actually *good*. It forces the Backward Induction response. Let them discover it. The debrief is stronger if they say "I stopped at C because I knew A was next."
  3.  **Fee Evasion:** Students forget to pay the Bank.
      *   *Mitigation:* You (Instructor) must hold the dice. No roll happens until the chip is in your hand.
  4.  **Risk Aversion:** Agents refuse all trades despite the Inactivity Penalty.
      *   *Mitigation:* Ensure the Inactivity Penalty (5 chips) is larger than the max expected loss from trading (3 fees = 3 chips). This makes trading the "dominant" strategy locally, even if globally costly.

  ## 6. The Limitation (What the Game Can't Stage)

  **The Normative Gap:**
  The game demonstrates that intransitivity is *expensive* in this specific market structure. It does not prove that intransitivity is *irrational* in isolation.
  *   **Say this out loud:** "This game rigs the payoff so that your preferences cost you money. But in the real world, there isn't always a Market Maker charging a fee. If you prefer A to B to C to A in your head, but never trade, you lose nothing. The money pump argument assumes a world full of exploiters. The real philosophical dispute is whether rationality requires you to be robust against exploiters, or merely consistent in your own mind."

  **The Dynamic Consistency Problem:**
  The game forces a single "Agent" to make sequential choices. It cannot fully simulate the "multiple selves" problem (where your future self might not honor your current plan) because the student is the same person throughout.
  *   **Say this out loud:** "You played the same person from start to finish. In reality, the 'you' that makes the plan on Monday might not be the 'you' executing it on Friday. The money pump is strongest when we assume you can't bind your future self."

  ---

  ### Instructor Cheat Sheet (Print & Cut)

  **Agent Preference Card:**
  > **UTILITY FUNCTION**
  > Current Asset: **A** → Prefer **B** (Gain 2 utils)
  > Current Asset: **B** → Prefer **C** (Gain 2 utils)
  > Current Asset: **C** → Prefer **A** (Gain 2 utils)
  > *Rule: If offered a preferred asset, you feel a 2-chip gain. If you refuse, you feel a 2-chip Regret Penalty at cash-out.*

  **Market Maker Cheat Sheet:**
  > **PUMP PROTOCOL**
  > 1. If Agent has **A**, offer **B**.
  > 2. If Agent has **B**, offer **C**.
  > 3. If Agent has **C**, offer **A**.
  > *Goal: Execute as many swaps as possible.*

  **Banker (Instructor) Log:**
  > **Fee:** 1 Chip per swap (Collect immediately).
  > **Termination:** Roll d6 after every swap. **1 = STOP**.
  > **Cash Out:** Chips + 10 (Asset) - 2 (Regret if refused trade) - 5 (If 0 trades).
