          *   *If they refuse, they might hold the wrong asset.*
          *   *This makes "Refuse All" risky (might hold low value asset).*
          *   *This makes "Cycle" costly (fees).*
          *   *This fits "Forgoing gains that would have been real" (if the roll favored their swap).*
          *   *This fits "Fee prevents draining" (if fees > potential gain).*
          *   *Perfect.*

      *   **Wait, one constraint:** "Agent whose pairwise gains are small relative to the fee is intransitive but can't actually be drained."
      *   *This implies the Intransitivity is fixed, not state-dependent.*
      *   *Okay, I'll stick to Fixed Preferences + Fixed Fees + Random Termination.*
