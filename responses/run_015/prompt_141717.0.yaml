          *   *No, too complex.*
          *   *Final Decision:* I will use the **Regret Penalty** model (Penalty > Fee) to force the trade, but add a **Random Bonus** for holding specific assets at termination to make "Refuse All" risky.
          *   *Actually, simplest:* The Die Roll determines the *Value of the Assets* at the end.
          *   *Roll 1-2: A=15, B=10, C=10.*
          *   *Roll 3-4: A=10, B=15, C=10.*
          *   *Roll 5-6: A=10, B=10, C=15.*
          *   *Agent Preferences:* B>A, C>B, A>C. (Matches the potential high values).
          *   *Agent doesn't know the Roll.*
          *   *Exploiter knows the Roll?* No.
          *   *If Agent doesn't know the Roll, they trade based on Preference.*
