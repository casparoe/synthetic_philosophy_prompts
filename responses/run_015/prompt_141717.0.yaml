          *   *Trade 2: +2 -1 = +1.*
          *   *Trade 3: +2 -1 = +1.*
          *   *Total: +3 chips.*
          *   *This rewards pumping.*
          *   *I need the Pump to be BAD.*
          *   *Okay, Dividend is 'Utility' (not chips). Fee is Chips.*
          *   *Score is Chips.*
          *   *Agent wants to maximize Utility (trades) AND Score (chips).*
