      *   *This makes "Refuse All" suboptimal (you miss dividends).*
      *   *This makes "Cycle Forever" suboptimal (you pay fees without long term gain).*
      *   *This fits all constraints.*

      *   **Revised Mechanics:**
          *   **Assets:** A, B, C.
          *   **Preference:** B > A, C > B, A > C.
          *   **Dividend:** If you hold your Preferred Asset (relative to start of round?), you get 1 chip at end of round.
