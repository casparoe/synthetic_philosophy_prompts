  **JOINT STATEMENT ON PUBLIC SAFETY INFRASTRUCTURE**
  **Drafted by:** [Neighborhood Council Public Safety Working Group]
  **Date:** October 26, 2023
  **Signatories:** [Coalition for Accountable Policing] / [Community Abolition Network]

  ---

  ### I. AGREED CLAIMS (LOAD-BEARING)

  *The following claims are accepted by both signatories as factual premises for budget and policy deliberation. These are not aspirational goals; they are operational acknowledgments intended to rule out irrelevant arguments.*

  1.  **Dispatch Mismatch:** The current 911 dispatch protocol routes a significant volume of non-violent incidents (mental health crises, substance use, neighborhood disputes, welfare checks) to armed sworn officers. Both sides agree this is an inefficient use of specialized training and increases the risk of unnecessary escalation.
  2.  **The Protection Paradox:** Low-income neighborhoods and communities of color experience simultaneous over-policing (high frequency of stops, searches, and enforcement actions) and under-protection (slow response times to violent crime reports, low clearance rates for harm suffered by residents). Both sides agree this is not a contradiction but a feature of the current enforcement model.
  3.  **Accountability Failure:** Existing civilian oversight boards, internal affairs divisions, and qualified immunity doctrines currently fail to deliver consistent discipline for misconduct or meaningful compensation for victims. Both sides agree the current system protects the institution more than the public.
  4.  **The Residual Violence Problem:** Both sides acknowledge that a small percentage of emergency calls involve active, armed violence or immediate threats to life where de-escalation is unlikely to succeed without coercive physical intervention. Both sides agree the state must have a mechanism to respond to this specific tier of incident, though they disagree on the structure of that mechanism (see Section III).
  5.  **Budget Zero-Sum:** Within the current municipal fiscal year, dollars allocated to sworn officer salaries and benefits are dollars not allocated to housing, mental health services, or violence interruption. Both sides agree that budget decisions are moral choices about priority, not merely technical adjustments.

  ---

  ### II. DISAGREEMENTS TABLE

  *Positions are stated in the terminology each side uses to describe its own goals. Neither side endorses the other's column.*

  | Topic | Reform Position (Coalition for Accountable Policing) | Abolition Position (Community Abolition Network) |
  | :--- | :--- | :--- |
  | **Core Function** | **The Accountable Monopoly.** The state must maintain a monopoly on legitimate force to prevent private vigilantes and security firms from filling the vacuum. The goal is to constrain that monopoly through law, oversight, and training. | **Functional Obsolescence.** The monopoly on force is itself the source of violence. The goal is to build social infrastructure (housing, income, care) that makes armed response unnecessary, shrinking the institution until it dissolves. |
  | **Structure** | **Professionalization.** A unified police department with specialized divisions (mental health co-response, community liaison) under a single chain of command ensures accountability and coordination. | **Decoupling.** Public safety functions should be unbundled. Mental health, traffic, and dispute resolution should be separate agencies entirely, not divisions within a police department. |
  | **"Defund the Police"** | **Reallocation within Safety.** Shift funding from militarized equipment and overtime to community units and oversight bodies *within* the department's broader budget umbrella. Maintain core patrol capacity. | **Starve the Institution.** Cut the police budget line item directly to force a reduction in scope and headcount. Move those funds to non-state community organizations and social services outside police control. |
  | **Discipline** | **Better Enforcement.** Strengthen internal affairs, empower civilian oversight with subpoena power, and ensure decertification follows misconduct. The problem is bad actors and weak rules. | **Structural Incentive.** Discipline fails because the institution is designed to protect itself. Prosecutors, unions, and courts are part of the same ecosystem. You cannot police the police into justice. |
  | **The "2AM Call"** | **Unified Command.** A single dispatcher should be able to send the right asset from a unified pool. If a situation escalates, the responder on scene must have backup available immediately. | **Parallel Systems.** Dispatch should route to care workers first. Armed response is a separate, difficult-to-access last resort, not a backup unit waiting in the wings. |

  ---

  ### III. CRUXES (WHERE THE ARGUMENT TURNS)

  *These are the specific points where the two sides diverge on predictions and outcomes. We have identified three concrete tests where future data could shift our positions.*

  #### Crux 1: The Duty-to-Answer and Liability
  *User Idea: The Duty-to-Answer Thing*

  *   **The Dispute:** Reformers argue the state has a legal and moral duty to provide an immediate, capable response to any 911 call, which requires armed officers as the default to ensure responder safety. Abolitionists argue the state has a duty to provide *care*, and sending armed officers to non-violent crises violates that duty by introducing lethal risk.
  *   **The Real Question:** If a non-sworn responder (social worker/medic) is harmed during a call, or harms a citizen in self-defense, who bears the liability? The city? The specific agency?
  *   **Reformer Prediction:** If we decouple armed response from general dispatch, response times for violent crimes will increase because coordination between separate agencies will fail. We will see an increase in harm to non-sworn responders.
  *   **Abolitionist Prediction:** If we decouple, overall harm (including suicide-by-cop and escalation deaths) will decrease. The liability risk is currently hidden by qualified immunity; making it explicit will force better safety protocols for care workers.
  *   **Concrete Test:** **The Eugene Model (CAHOOTS).**
      *   *Observation to track:* In cities where police dispatch is fully separated from mental health dispatch, do violent crime clearance rates drop compared to cities with co-response models?
      *   *Assumption:* [That liability structures for non-sworn responders can be legally established without requiring them to be sworn officers.]

  #### Crux 2: The Residual Tier and Mission Creep
  *User Idea: The Residual Tier*

  *   **The Dispute:** Both sides agree some armed capacity is needed for rare, high-violence events. Reformers want this capacity to be the core of the department. Abolitionists want this capacity to be a tiny, heavily constrained unit that is difficult to deploy.
  *   **The Real Question:** Is the "residual tier" stable, or does it inevitably expand to reclaim the functions stripped from it (mission creep)?
  *   **Reformer Prediction:** A tiny, specialized violent-crime unit will lack the community intelligence needed to solve crimes effectively. It will become isolated and more prone to brutality because it only sees people at their worst.
  *   **Abolitionist Prediction:** A large general-purpose department will inevitably use its excess capacity to enforce minor offenses (quality of life policing) to justify its budget. Only a structurally small unit prevents this creep.
  *   **Concrete Test:** **Camden, NJ (2013 Dissolution) vs. Minneapolis (Post-2020).**
      *   *Observation to track:* Compare the arrest rates for low-level offenses in Camden (reformed/rebuilt) vs. Minneapolis (pressure to abolish/reduce) over 5 years.
      *   *Assumption:* [That budget size correlates directly with the volume of low-level enforcement actions.]

  #### Crux 3: The Scoreboard (Measurement of Safety)
  *User Idea: The Scoreboard*

  *   **The Dispute:** Reformers measure success by clearance rates (crimes solved) and response times. Abolitionists measure success by total harm reduction (including harm caused by police) and community perception of safety.
  *   **The Real Question:** Can these metrics be combined, or do they incentivize opposite behaviors?
  *   **Reformer Prediction:** If we measure "community perception" primarily, departments will stop taking reports for hard-to-solve crimes to boost satisfaction scores. Clearance rates will plummet.
  *   **Abolitionist Prediction:** If we measure "clearance rates" primarily, departments will prioritize easy arrests (low-level drug/property) over complex violent crime investigations to boost numbers.
  *   **Concrete Test:** **Victimization Surveys vs. UCR Data.**
      *   *Observation to track:* In neighborhoods where clearance rates are high, do victimization surveys show residents feel safer? Or do they feel more harassed?
      *   *Assumption:* [That residents can accurately distinguish between "police presence" and "police harassment" in survey data.]

  ---

  ### IV. NOTES ON FRAMING AND BIAS

  **1. Critique of Your Framing (The "State" Problem)**
  You framed the Reform argument as "the state is going to hold a monopoly on legitimate force whether anyone likes it or not." This is the weakest link in the Reformer's philosophical armor. Abolitionists would argue this is a self-fulfilling prophecy, not a law of physics. By assuming the state *must* hold the monopoly, Reformers rule out community-based safety models (like violence interrupters or restorative justice circles) that operate *outside* state force entirely.
  *Correction:* The Reform argument should be: "In a society with current levels of inequality and firearm availability, the state is the only actor with the scale to guarantee response times." That is an empirical claim, not a philosophical necessity. It is falsifiable.

  **2. Where "Defund" Belongs**
  I placed "Defund" in the Disagreements Table as a tactical divergence, but honestly, it is a **verbal dispute** masking a strategic one.
  *   For Reformers, "Defund" means "Move money from Line Item A (SWAT) to Line Item B (Social Workers within PD)."
  *   For Abolitionists, "Defund" means "Move money from Line Item A (PD) to Line Item B (Non-Profit Housing)."
  *   *Why this matters:* In budget hearings, you are fighting over the same dollar. If you don't clarify that Reformers want the Police Department to *administer* the social funds while Abolitionists want independent agencies to *receive* them, you will talk past each other forever. The fight isn't about the money; it's about who holds the checkbook.

  **3. My Own Bias (The "2AM" Lean)**
  Despite my best effort to steel-man both sides, this document leans toward the **Reform** position on Crux #1 (Duty-to-Answer).
  *   *Why:* As someone who has sat in budget fights, I know that municipal liability is the silent killer of abolitionist pilots. When a non-sworn responder is hurt, the city gets sued, and the Council panics and calls the cops. I have treated the "Unified Command" model as the safer bet for liability management.
  *   *Where Abolition is Stronger:* They win on Crux #2 (Mission Creep). History shows that specialized units generally expand their scope rather than shrink. If I were betting on which prediction comes true in 10 years, I would bet on the Abolitionist prediction that a large department will find new reasons to use its power.

  **4. Verbal Disputes vs. Real Disputes**
  *   **Verbal:** "Violence." Reformers mean interpersonal physical harm. Abolitionists include structural harm (eviction, poverty). This isn't just semantics; it changes the budget. If "violence" includes "lack of housing," the Housing Department is a safety agency. I have tried to bridge this in Agreed Claim #5, but be aware this definition fight will resurface every budget cycle.
  *   **Real:** "Control." This is the only disagreement that cannot be smoothed over. Reformers want the state to control safety. Abolitionists want the community to control safety. You cannot compromise on who holds the gun. That is why the "Residual Tier" (Crux #2) is the most important section of this document. If you cannot agree on who controls the armed last resort, the rest of the statement is paper.
