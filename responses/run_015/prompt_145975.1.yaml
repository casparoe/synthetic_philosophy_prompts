prompt: |-
  Hi. So I need a real document here, not an essay, and I want you to think it through properly before you start writing — like, spend your first pass brainstorming the eight or ten places the two sides in this argument look like they're answering different questions, figure out which of those actually carry weight, and then draft. You're a professional political philosopher who's also spent time around actual municipal budget fights, so you should be able to keep the conceptual stuff and the "who shows up at 2am" stuff in your head at the same time.

  Background: I'm on a neighborhood council in my city. I've got no academic background at all — never took a philosophy or poli sci class in my life — I've just been chewing on this for two years because we've been fighting about the police budget here since 2020 and I somehow ended up in the middle of it. Our local coalition has two groups who've been going at each other the entire time and have basically stopped making any progress.

  The reform side: keep a police department, but end the worst of it — binding civilian oversight with subpoena power, real discipline and decertification, mental-health co-response teams, less militarized equipment, body cameras, consent-decree style court oversight, maybe shift some money to other responders. Their deepest claim as I understand it: the state is going to hold a monopoly on legitimate force whether anyone likes it or not, so the only honest question is who controls it and how accountable it is, and anything that shrinks the formal institution just hands the actual monopoly to whoever is left standing — private security, prosecutors with no one to check them, whoever.

  The abolition side: policing as an institution is the problem, not its worst incidents; its function is managing a population and enforcing a particular property order, and reform mostly buys it another thirty years of legitimacy. They want what I've heard called a non-reformist reform — a change that makes the institution less necessary rather than slightly nicer — and long-run: housing, income, crisis response, mediation, restorative processes, so that an armed state responder stops being the default answer to what are really social problems.

  What I want is the joint statement these two could both put their names on after a good-faith adversarial collaboration. Not a mushy compromise, and not you deciding who's right.

  Format: a numbered agreed-claims section first, then a disagreements table, then a cruxes section.

  On the agreed claims: they need to be things both actually accept, not the sort of thing nobody could deny. "We both want people to be safe" is worthless and I'll throw it out. Things I suspect they might genuinely share: that 911 is currently the default answer to a huge range of problems it was never built for; that most of what officers are dispatched to isn't violence work at all; that poor neighborhoods get both too much policing and too little protection at the same time, and that this isn't a paradox people in those neighborhoods find confusing; that some residual question about who handles the rare, genuinely armed, in-progress violent emergency survives every proposal either side has made. If you think one of those is actually contested, don't smooth it over — move it to the table.

  On the table: each side's position stated in wording that side would recognnize as its own, not a version the other side would find easier to attack. Also tell me where "defund the police" actually belongs here — I've never been able to work out whether it's a third position or a tactic inside the abolition position or a phase of it, and I suspect part of why they talk past each other is that they use the word differently.

  Three of my own ideas I want you to use, fix, or tell me are junk:

  1. The duty-to-answer thing. When someone calls for help, the state seems to take on an obligation to respond, and residents experience that as a right. What happens to that obligation under abolition? I think this is where the reform side has a real argument that the abolition side mostly doesn't answer, but I also think the obligation might be satisfiable by someone other than a cop, and I can't tell which.

  2. The residual tier. Every arrangement I can imagine, including the abolitionists', seems to leave some last-resort armed responder for the rare case. If so, is the actual disagreement just about how big that tier is, what else it's allowed to do, and who controls it — which is a much more tractable argument than "police or no police"? Or does that framing smuggle in the reform side's assumptions?

  3. The scoreboard. I think half their fights are about which number counts as the outcome: reported crime and clearance rates on one side, total harm including the harm done by the responders themselves on the other. If they'd agree on a measure in advance, would that settle anything, or would they just pick different measures for different purposes?

  For each crux you keep, write down what each side should predict in advance about what we'd observe, and name a concrete case or comparison both sides would accept as bearing on it — a city that did X, a category of call, a type of incident. I don't want citations or study names or anything you'd have to look up; you don't have web access and I don't want you guessing at papers. Reason it out, and where you need a factual assumption to make a point, mark it as an assumption in brackets so I can check it myself later.

  Also: if you think part of this dispute is verbal — about what "police" or "violence" or "the state" means, or about whether a question is being asked about the institution or about the function — say exactly which part and why, rather than blaming everything on definitions.

  And commit. Don't give me a menu. Take a position on which cruxes are real and which are noise, say where each side is strongest and where it's weakest, choose formulations for the agreed claims that are load-bearing rather than safe, and if you conclude the two camps genuinely cannot sign some claim, write it as a disagreement instead of watering it down until it's vacuous. At the end, add a short note on where you think my framing above is wrong, and where your own document leans toward one side despite your best effort.
