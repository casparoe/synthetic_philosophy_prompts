answer: |-
  Your facts are solid enough for philosophical work; the commutation was indeed to six months' imprisonment. The *Mignonette* case is a stress test for the separateness of persons objection, precisely because it forces us to disentangle the three complaints you identified. Often, critics of utilitarianism run them together, but the verdict changes depending on which strand you pull.

  First, the **aggregation complaint**. If the core error is simply summing utilities across distinct entities, then *Mignonette* is a clear violation. Utilitarianism sees 3 lives minus 1 life as a net gain. The separateness objection says there is no "social entity" to absorb the loss; there is only Parker, who loses everything. On this strict reading, the **counterfactual where all four die** is preferable to the actual killing. This is the bullet the objector must bite: respecting boundaries is more important than minimizing total death. It is not a reductio if you view rights as side-constraints rather than goals. However, if the objection is primarily about **fair risk distribution** (your third complaint), the **counterfactual where they draw lots** changes the moral landscape. If Parker loses a fair lottery, he has hypothetically consented to the risk. This suggests that for many proponents, the "separateness" objection is actually a proxy for a lack of procedural fairness. If a lottery dissolves the objection, the deep issue isn't aggregation *per se*, but the unilateral imposition of sacrifice. That makes the objection less about metaphysics and more about political equality.

  Regarding Parker's condition (young, sick, likely to die): a strict separateness view cannot register this. To weigh Parker's likely imminent death against the sailors' survival is to aggregate expected utility. It treats Parker's remaining life as having less "weight" than the others'. A separateness purist must say his sovereignty is intact regardless of his life expectancy. Caring about his sickness smuggles utilitarianism back in by devaluing his distinct status based on future outcomes.

  Turning the lens the other way: what does the case do to the theory? The law's conviction aligns with the separateness objection; the public's sympathy aligns with utilitarian necessity. The objection is closer to the law, but this reveals a tension. The separateness objection relies heavily on a **doing-versus-allowing distinction** that it officially claims to transcend. It forbids *killing* Parker (violating his boundary) but permits *letting* him die (respecting the boundary, even if nature is cruel). In *Mignonette*, the distinction collapses physically—all will likely die—but morally it remains the only shield Parker has.

  However, the objection may go silent here because it was built for **institutions, not lifeboats**. Rawls framed separateness within a "basic structure" of society where cooperation yields a surplus. In *Mignonette*, there is no surplus, only a zero-sum survival game. The objection assumes a baseline of rights that society protects; in the open ocean, there is no society to enforce the baseline. To insist on separateness here is to apply a political principle to a state of nature where it may lack traction.

  Your PhD friend's argument regarding **temporal stages** is a version of Parfit's reductionist critique. Why is the boundary between *you-now* and *you-later* less sacred than *you* and *Parker*? We sacrifice present pain for future gain (prudence) without calling it murder. The friend argues that if personal identity over time is just psychological connectedness, the distinction between persons is one of degree, not kind.

  Where this goes wrong, and where *Mignonette* gives us purchase, is **consent**. I can consent on behalf of my future self because I am the locus of that experience. I cannot consent for Parker. The boundary between persons is load-bearing not necessarily because of metaphysical soul-substance, but because consciousness is not shared. My future self inherits my pains; Parker does not. In *Mignonette*, Parker cannot be compensated. In prudence, the sufferer and the beneficiary are the same entity. The separateness objection holds because there is no mechanism for Parker to "share" in the survivors' future lives. The friend's argument fails to account for the impossibility of cross-personal compensation.

  **Confidence and Uncertainty**
  I am highly confident (90%) that the separateness objection mandates letting all four die rather than killing Parker, as this follows directly from the rights-as-constraints model. I am also confident that Parker's sickness is irrelevant to a strict separateness view.

  The claim I am **least sure of** (60% confidence) concerns the **lottery counterfactual**. I claimed above that a fair lottery might mitigate the separateness objection by introducing hypothetical consent. However, this leans on a contested reading of the objection. A hardline Rawlsian might argue that even a lottery cannot authorize the violation of the inviolable right to life, meaning aggregation is forbidden regardless of procedure. If the right is absolute, the lottery changes nothing. I am leaning on the interpretation that separateness is partly about *status* and *equality*, which a lottery respects, whereas a strict deontological reading would say the right to life is non-negotiable regardless of consent. If the latter is true, then the objection is purely about aggregation and constraints, and the procedural fairness point collapses.
