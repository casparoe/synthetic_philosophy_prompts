      *   *Why this works:* It separates "unknown fact" from "no fact." It avoids the "truth value gap" confusion by framing it as "stable across all valid interpretations."

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: Epistemicism = Credence Distribution.*
