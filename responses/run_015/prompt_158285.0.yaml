          *   *Epistemicism:* The model has a specific weight configuration (sharp boundary) we don't know. The loss is real.
          *   *Supervaluationism:* The model is an ensemble of all consistent weight configurations. A statement is "True" only if *all* models in the ensemble agree.
      *   *Wait, better analogy:* **Legacy Code / API Specification.**
          *   *Scenario:* A function `is_tall(height)` in a legacy system.
