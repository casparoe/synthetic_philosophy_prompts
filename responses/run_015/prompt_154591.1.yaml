      *   Did I address the consistency question? Yes (Possible via Interventional Granularity).

  *(Self-Correction Note)*: I must emphasize that the user's premise about Pharma requiring mechanism is slightly overstated legally, but functionally true in modern development. I will treat it as a "functional requirement" rather than a "statutory one" to maintain the philosophical integrity of their observation without getting bogged down in FDA law.

  Let's structure the response:
  1.  **Preface:** Validate the insight, nuance the premise.
  2.  **The Implicit IBE:** Pragmatic/Interventionist.
  3.  **Virtues vs. Constraints:** Risk/Actionability trumps pure epistemology.
  4.  **Specific Virtues:** Depth (Pharma) vs. Stability (Epi).
  5.  **Consistency Test:** The "Interventional Granularity" solution.
