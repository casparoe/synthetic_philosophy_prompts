answer: |-
  This is a profound observation that cuts to the heart of how scientific knowledge is operationalized for policy. As a physicist, you are accustomed to the unity of method: a model is judged by its predictive power and its consistency with underlying laws. In regulatory science, however, "truth" is subordinate to "safe action."

  To answer your query directly: The asymmetry you observe does not presuppose a single, unified theory of Inference to the Best Explanation (IBE). Rather, it presupposes a **pragmatic, interventionist account of causation** where the criteria for "best explanation" shift depending on the *granularity of the intended intervention* and the *cost of error types*.

  Below, I reconstruct the implicit theory, distinguish strict requirements from accommodations, and assess whether a consistent framework is possible.

  ### 1. Correcting the Premise: Mechanism as Safety, Not Efficacy
  First, a necessary nuance for your mental model. Statutorily, the FDA (and EMA) does **not** strictly require a known mechanism of action (MOA) for efficacy approval. Lithium, aspirin, and several anesthetics were used for decades before their mechanisms were understood. However, your observation holds *functionally*: in modern review, a lack of MOA creates a "plausibility deficit." It raises the burden of statistical proof and complicates safety profiling.

  Conversely, environmental epidemiology (e.g., IARC, EPA) operates under the **Precautionary Principle**. Here, statistical association (consistency, strength, dose-response) is often deemed sufficient for hazard identification because waiting for mechanistic certainty could result in irreversible population harm (e.g., the tobacco latency period).

  Thus, the asymmetry is not "Mechanism vs. Statistics." It is **Specific Causal Control (Pharma)** vs. **General Hazard Identification (Epi).**

  ### 2. The Implicit Theory of IBE: Interventionist Pragmatism
  The regulatory divergence presupposes a version of IBE heavily influenced by **James Woodward's Interventionist Causation** and **Nancy Cartwright's capacities**.

  *   **In Pharma:** The "Best Explanation" is one that supports a *precise intervention*. If you administer molecule $M$, you alter variable $V$ via pathway $P$. If $P$ is unknown, you cannot predict off-target effects (confounders). Here, IBE favors **Causal Depth**. The explanation must resolve the "black box" to ensure that the intervention doesn't trigger unmodeled boundary conditions (side effects).
  *   **In Epidemiology:** The "Best Explanation" is one that supports a *policy constraint*. If exposure $E$ correlates with outcome $O$ across multiple populations, the explanation need not detail the molecular pathway; it need only establish a stable **Capacity** (Cartwright) or regularity. Here, IBE favors **Robustness**. The explanation is "best" if it survives variations in background conditions, even if the internal machinery is unspecified.

  **Does this treat explanatory coherence as an independent virtue?**
  No. In both domains, explanatory coherence is instrumental, not intrinsic.
  *   In Pharma, coherence (mechanism) is required because it reduces the variance in safety predictions.
  *   In Epi, coherence (mechanism) is often sacrificed because it is epistemically intractable (complex mixtures, long latency) and delaying action incurs higher public health costs.

  ### 3. Epistemic Virtues: Depth vs. Unification
  You ask if the practice commits to a specific account of explanatory virtue. It commits to different virtues based on the **direction of inference**.

  *   **Pharma commits to Causal Depth.**
      *   *Why:* Drugs are *additive* interventions. You are introducing a new force into a complex system. Without knowing where that force couples (the mechanism), you cannot calculate the system's response function.
      *   *Virtue:* **Manipulability.** An explanation is good if it allows you to toggle the effect by toggling the cause without collapsing the system.
  *   **Epidemiology commits to Unification (Consistency).**
      *   *Why:* Environmental exposures are *ambient*. The intervention is usually avoidance or mitigation. You do not need to know *how* asbestos causes mesothelioma to know that removing asbestos reduces mesothelioma.
      *   *Virtue:* **Stability.** An explanation is good if the association holds across different contexts (Bradford Hill's "Consistency" criterion).

  **If we replaced these accounts:**
  If Pharma demanded only Unification (stats alone), we would see a surge in adverse events from off-target binding (the "Thalidomide problem"). If Epi demanded Causal Depth (mechanism alone), we would fail to regulate carcinogens until decades after exposure (the "Tobacco problem"). The justification for the asymmetry relies entirely on the **asymmetry of intervention**.

  ### 4. Risk Tolerance and Tractability
  You asked if the asymmetry can be explained *solely* by risk tolerance and tractability.
  *   **Tractability:** Yes. In Epi, mechanisms are often physically unknowable (we cannot run RCTs on poisoning humans). In Pharma, mechanisms are tractable (in vitro, animal models).
  *   **Risk Tolerance:** This is more subtle. It is not just risk tolerance, but **Error Asymmetry**.
      *   *Pharma:* False Positive (approving a harmful drug) is catastrophic for the individual patient. Mechanism acts as a filter against False Positives.
      *   *Epi:* False Negative (failing to ban a harmful chemical) is catastrophic for the population. Requiring mechanism increases False Negatives.

  Therefore, the "theory of inference" is actually a **Decision-Theoretic Framework** masquerading as epistemology. The standard of explanation is tuned to minimize the costlier error type in that domain.

  ### 5. Can a Consistent Framework Abandon Mechanism?
  This is your critical question: *Could a consistent institutional framework abandon mechanistic explanation in regulation without also weakening the standing of epidemiological inference?*

  **The Answer:** Yes, but only if the framework shifts from **Explanation-Centric** to **Intervention-Centric**.

  If we adopt a consistent **Interventionist Framework**, the requirement for mechanism is not a binary "yes/no" but a function of **Interventional Granularity**.
  *   **High Granularity (Pharma):** You are intervening on a specific molecular target. You require high-resolution maps (mechanisms).
  *   **Low Granularity (Epi):** You are intervening on a population exposure. You require low-resolution maps (statistical boundaries).

  **The Danger of Abandoning Mechanism in Pharma:**
  If you legally decouple mechanism from Pharma approval (treating it exactly like Epi), you weaken the *predictive validity* of the regulation. Epidemiological inference relies on the assumption that the statistical association represents a causal capacity. In Pharma, without mechanism, you cannot distinguish a causal capacity from a spurious correlation driven by a hidden confounder (e.g., a metabolite).
  *   *Result:* You would not necessarily weaken Epi, but you would destabilize Pharma safety.

  **The Danger of Demanding Mechanism in Epi:**
  If you legally couple mechanism to Epi warnings, you paralyze the precautionary principle.
  *   *Result:* You weaken Epi's ability to protect public health.

  ### Conclusion: The Disunity of Regulatory Science
  Your puzzle highlights the **Disunity of Science** (Dupré) applied to policy. There is no single "Regulatory Epistemology."

  1.  **Implicit Theory:** The divergence presupposes a **Pragmatic Interventionist IBE**. The "Best Explanation" is the one that minimizes the expected cost of error for the specific *type of action* being taken (ingestion vs. avoidance).
  2.  **Epistemic Virtue:** Explanatory coherence is not an independent virtue; it is a proxy for **interventional reliability**. In Pharma, mechanism proxies reliability. In Epi, statistical stability proxies reliability.
  3.  **Consistency:** A consistent framework is possible, but it cannot be based on a universal standard of "Explanation." It must be based on **Interventional Granularity**.

  **Final Verdict:**
  You can construct a consistent framework that abandons *mechanistic necessity* in both fields, provided you replace it with **robust causal identification** (e.g., using counterfactual frameworks like Potential Outcomes). However, in practice, abandoning mechanism in Pharma removes the only tool available to predict *novel* interactions (safety), whereas in Epi, statistical history is often sufficient to predict *continued* risk.

  Therefore, the asymmetry is not a philosophical inconsistency; it is a **rational adaptation to the physics of the systems involved.** Pharma deals with controlled, high-energy interventions into a single system (the patient). Epi deals with uncontrolled, low-energy perturbations across distributed systems (the population). To demand the same explanatory standard for both would be akin to demanding that thermodynamics justify its laws using particle trajectories, or that particle physics accept statistical ensembles without underlying fields. Both are valid, but they serve different predictive masters.
