answer: |-
  **MEMORANDUM OF JOINT ADVISORY FINDINGS**
  **TO:** The Constitutional Drafting Commission
  **FROM:** The Advisory Panel on Legislative Ethics and Public Justification
  **SUBJECT:** Framework for the Public-Reasons Clause (Standing Orders)

  **PREAMBLE**
  We, the undersigned advisers, acknowledge that while we diverge on the specific duties owed by legislators when voting on coercive laws, we share a commitment to the stability and legitimacy of this polity. The following document represents the boundaries of our agreement, the precise geometry of our disagreement, and the empirical or conceptual tests that could resolve them. We have eschewed compromise language in favor of precise statements of where we stand together and where we stand apart.

  ### I. AGREED CLAIMS

  1.  **On Coercion and Justification**
      We agree that the state's monopoly on coercive force distinguishes legislation from private association. Because coercive laws impose costs, constraints, or penalties on citizens who may not comply voluntarily, they stand in need of justification. A law that rests solely on "because we said so" or "because the majority wills it" is insufficient for a constitutional order committed to the moral equality of citizens.

  2.  **On the Purpose of Restraint**
      We agree that any duty regarding the reasons offered for law serves three ends, prioritized as follows:
      *   **First (Legitimacy):** To ensure that those subject to the law can understand themselves as authors of the law, rather than merely its subjects.
      *   **Second (Respect):** To affirm the status of fellow citizens as free and equal, by not imposing rules upon them that rely exclusively on premises they are constitutionally unable to access or verify.
      *   **Third (Stability):** To secure social cohesion not merely through a *modus vivendi* (truce), but through a stability grounded in mutual recognition.

  3.  **On What Is Not At Issue**
      We agree that this clause applies *only* to official acts of coercion (voting on bills, binding resolutions) within the legislature. It is not proposed that:
      *   Religious citizens or leaders be silenced in the public square, civil society, or election campaigns.
      *   Existing churches be disestablished or stripped of tax status.
      *   Religious premises be barred from identifying social problems (e.g., citing scripture to identify poverty as an evil).
      *   Legislators be required to hide their religious identity.

  4.  **On Conditions for Admitting Error**
      *   **The Restrainingist** concedes her view is untenable if it can be demonstrated that the duty of restraint systematically excludes devout citizens from effective political participation, effectively creating a second-class citizenship where they must "check their conscience at the door" to exercise the franchise.
      *   **The Inclusivist** concedes his view is untenable if it can be demonstrated that allowing voting based solely on non-accessible religious premises leads to sectarian domination, where laws are passed that impose burdens on minorities solely to enforce orthodoxy, resulting in measurable civil strife or the erosion of minority rights.

  ### II. DISAGREEMENTS TABLE

  | Crux (Neutral Wording) | Restrainingist Formulation | Inclusivist Formulation | Concrete Test / Evidence | Predictions (What the test will show) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Motivation vs. Availability**<br>*(Is the duty about the reasons available for the law, or the reasons the agent actually acted on?)* | The duty is personal and internal. If a legislator votes for a coercive law *solely* because their faith commands it, they violate the duty of civility, even if a secular justification for that same law exists objectively. Integrity requires the motive to match the public justification. | The duty is institutional and external. If a law *can* be justified by public reasons, the legislator's private motive is irrelevant. Policing internal mental states is epistemically naive and invites hypocrisy. The law's legitimacy rests on its objective defensibility, not the voter's psychology. | **The Sealed Archive:** Legislators file a sealed one-paragraph statement of their actual reasons for voting, opened after 30 years. | **Restrainingist:** The archive will reveal that many legislators vote on sectarian motives while citing public reasons publicly, proving a deficit in integrity that undermines legitimacy.<br>**Inclusivist:** The archive will show mixed motives are the norm, and that "pure" public reason is a fiction. It will prove that policing motive chills sincere deliberation without improving outcomes. |
  | **2. The Standard of Accessibility**<br>*(Is accessibility a property of a reason's content, or a fact about what citizens in fact accept?)* | Accessibility is content-based. A reason is public only if it relies on premises acceptable to a *reasonable* citizen, regardless of their actual comprehensive doctrine. Even in a homogenous society, religious premises remain non-public because they rely on authority, not shared reason. | Accessibility is audience-based. A reason is public if it is in fact accepted by the electorate to whom it is addressed. In a jurisdiction where all citizens share a faith, scripture *is* a public reason because it is the shared language of the polity. | **The Unanimous-Believer Jurisdiction:** A thought experiment or comparative study of a small, homogenous polity where 100% of citizens accept the same scripture as authoritative. | **Restrainingist:** Even there, coercion requires a secular back-up. Scripture cannot justify coercion against a hypothetical dissenter or future generation who might not believe.<br>**Inclusivist:** In that jurisdiction, scripture functions as public reason. To demand secular translation is to impose an external, colonial standard of rationality that disrespects the actual culture. |
  | **3. The Asymmetry Objection**<br>*(Do secular comprehensive doctrines face the same restraint as religious ones?)* | Yes. The restraint applies to *all* comprehensive doctrines. Secular humanism, autonomy-based perfectionism, or utilitarianism must also be translated if they are not shared by the reasonable citizen. Neutrality applies to the secularist too. | Theoretically yes, practically no. In practice, "secular" reasons are treated as default public reasons while religious ones are scrutinized. If secular comprehensive doctrines are not equally restrained, the clause is merely anti-religious bias disguised as neutrality. | **The Secular Perfectionism Test:** A bill justified solely by a specific secular comprehensive doctrine (e.g., "radical autonomy") without appeal to welfare, rights, or order. | **Restrainingist:** We would strike this down or demand translation. If we fail to do so, we are inconsistent.<br>**Inclusivist:** The Commission will likely accept this without question, proving that the "public reason" standard is culturally loaded against religious forms of argument. |
  | **4. Compliance and Legibility**<br>*(Is the "Sealed Archive" device a useful tool or a harmful mechanism?)* | It is a necessary disciplinary device. Even if unenforceable, the act of writing the statement forces the legislator to confront their own motives. It creates a historical record of integrity. | It is a "loyalty oath" mechanism. It signals distrust to the devout legislator. It encourages writing what the clerk wants to hear rather than the truth, increasing hypocrisy rather than integrity. | **Implementation of the Archive:** Adopting the device proposed by the Clerk for a trial period. | **Restrainingist:** Adoption will improve the quality of deliberation by making legislators self-conscious about their reasons.<br>**Inclusivist:** Adoption will degrade trust between religious and secular blocs, as the archive will be used as ammunition for future political scoring. |

  ### III. CLOSING ASSESSMENT: VERBAL VS. SUBSTANTIVE

  We identify two residual disputes that appear substantive but may be verbal or definitional in nature.

  **1. The Definition of "Secular"**
  *   **The Dispute:** The Inclusivist claims the Restrainingist treats secular arguments as "public" by default. The Restrainingist claims she treats secular *comprehensive* arguments as "non-public."
  *   **Diagnosis:** This is largely **verbal**. We agree that *comprehensive* secularism (e.g., metaphysical atheism or perfectionist autonomy) is not public reason. We disagree on whether the secular arguments currently circulating in this Commission are "comprehensive" or "political."
  *   **Condition for Settlement:** We will accept a glossary definition distinguishing "Political Liberalism" (freestanding) from "Comprehensive Secularism." If the Commission agrees to restrain Comprehensive Secularism with the same rigor as Religious Doctrine, the Inclusivist withdraws the Asymmetry Objection.

  **2. The Nature of "Translation"**
  *   **The Dispute:** The Restrainingist views "translation" as finding independent grounds. The Inclusivist views "translation" as lying about one's grounds.
  *   **Diagnosis:** This is **substantive**. It concerns the moral psychology of the legislator.
  *   **Condition for Settlement:** The **Sealed Archive** (Crux 1 & 4) is the only mechanism capable of settling this.
      *   If the Archive shows that legislators *can* identify public reasons that genuinely motivated them (even if religious reasons were also present), the Inclusivist accepts a "soft" duty of articulation.
      *   If the Archive shows that legislators consistently fabricate public reasons as post-hoc covers for sectarian votes, the Restrainingist accepts that the duty of restraint is futile and potentially corrosive to integrity, and we recommend striking the clause in favor of robust electoral accountability alone.

  **Signed,**

  *The Restrainingist Adviser*
  *The Inclusivist Adviser*
