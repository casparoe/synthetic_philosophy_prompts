answer: |-
  This is one of the deepest and most notoriously difficult knots in *The Theory of Moral Sentiments* (TMS). You are absolutely right to feel tangled: Smith's mechanics are not linear; they are recursive and reflexive. The "headline version" (imagine yourself in their shoes) is the entry point, but the actual moral work happens in the *gap* between the agent and the spectator.

  Here is a walkthrough of the three mechanical problems you identified: the asymmetry of propriety, the reflexive loop of pride/shame, and the genesis of the Impartial Spectator.

  ### 1. The Asymmetry of Propriety: Why the Agent Must Bend
  You asked: *If propriety is matching the spectator, why is the spectator's weaker feeling the standard? Why doesn't the spectator raise their passion to meet the agent?*

  Smith's answer relies on an epistemic limitation and a definition of social order.

  **The Epistemic Limit:**
  For Smith, sympathy is not emotional contagion (like catching a yawn); it is an act of imaginative projection. The spectator can never have the *same* access to the cause of the passion as the agent.
  *   **The Agent:** Has the "object" of the passion directly in front of them (e.g., the actual dead body of their child). Their passion is the immediate, causal result of reality.
  *   **The Spectator:** Only has the *idea* of the object via the agent's description or expression. Their passion is a copy of a copy.

  Because the spectator's feeling is derived from imagination, it is psychologically impossible for them to reach the intensity of the agent's direct experience. They *cannot* raise their pitch to the agent's level. Therefore, for the two "notes" to harmonize, the agent must lower their pitch to the spectator's level.

  **Propriety as "Sympathizability":**
  This is the crucial mechanistic shift. For Smith, **propriety is not an intrinsic quality of the emotion; it is a relational quality.** An emotion is "proper" only insofar as it *allows* for sympathy.
  *   If the agent stays at their maximal intensity, sympathy is impossible (the spectator can't get there).
  *   If the agent lowers their intensity, sympathy becomes possible (the spectator can meet them there).

  Therefore, the spectator's weaker feeling sets the standard not because the spectator is morally superior, but because the spectator represents the **limit of social communicability.** The agent must bend because morality, for Smith, is fundamentally social. A passion that cannot be shared is, by definition, improper because it breaks the social bond. The agent bends to preserve the possibility of connection.

  ### 2. The Reflexive Loop: Is Pride/Shame Second-Order Sympathy?
  You asked: *Are the agent's moral emotions (pride/shame) just sympathies with the spectator's sympathy? Or is it a direct feeling of the outcome?*

  The short answer is: **It is a second-order sympathy, but it feels immediate.** This is the "loop" you identified.

  **The Mechanism of Mutual Sympathy:**
  Smith argues that the pleasure of mutual sympathy is a distinct, primitive sentiment. We don't just want the spectator to agree with us; we get pleasure *from the agreement itself*.
  1.  **First-Order:** Agent feels Grief. Spectator imagines Grief.
  2.  **Judgment:** Spectator signals approval (their Grief matches Agent's Grief).
  3.  **Second-Order:** Agent observes Spectator's approval. Agent now feels sympathy *for the Spectator's satisfaction.*

  When the spectator approves, the spectator feels a specific pleasure: the pleasure of finding their own sentiments align with another human. The agent, sympathizing with the spectator, catches *that* pleasure.
  *   **Pride:** Is the agent sympathizing with the spectator's pleasure in the agent.
  *   **Shame:** Is the agent sympathizing with the spectator's discomfort/dissonance regarding the agent.

  **Why it feels direct:**
  Through habit, this loop becomes instantaneous. We don't consciously think, "I am now sympathizing with their sympathy." We just feel "virtuous" or "ashamed." But structurally, Smith insists these feelings are dependent on the imagined judgment of the other. There is no "direct feeling of the outcome" independent of the spectator, because the "outcome" *is* the sympathetic alignment. Without the other, there is no mirror, and without the mirror, there is no moral self-evaluation.

  ### 3. The Impartial Spectator: Generalization or Separate Judge?
  You asked: *Is the Impartial Spectator a separate internal judge, or just sympathy-with-the-spectator generalized? How does impartiality emerge from partial spectators?*

  This is the most critical transition in the book (moving from Part I/II to Part III). The Impartial Spectator is **not** a separate divine voice, nor is it simply the average of all real spectators. It is a **critical abstraction developed from social experience.**

  **The Problem with Real Spectators:**
  Smith is a realist. He knows actual bystanders are biased. They might approve of us because we are rich, or because they are our friends, or because they are ignorant of the facts. If we relied solely on real spectators, our morality would be warped by their partiality.

  **The Genesis of Impartiality:**
  The Impartial Spectator emerges through a process of **correction and distance**:
  1.  **Distance from Self:** We learn to view our own conduct as others view it (the "looking-glass" society).
  2.  **Distance from Others:** We eventually realize that actual others are often wrong. We learn to distinguish between *actual applause* and *deserved applause*.
  3.  **Internalization:** We construct an idealized judge. This judge is "us" (the agent) viewing "us" (the agent) from the position of a hypothetical, well-informed, neutral bystander.

  **How Impartiality is Generated:**
  Impartiality is generated by **stripping away context.**
  *   A real spectator is partial because they are close to the situation (e.g., they are my brother).
  *   The Impartial Spectator is constructed by imagining a spectator who is *farther away*—someone who doesn't know my name, has no stake in the outcome, but knows all the facts.

  So, to answer your specific question: It is the agent's sympathy-with-the-spectator standing in for itself, **but refined by reason and experience.** It is the "generalized other" (to borrow a later sociological term) that has been scrubbed of the specific biases of the community.

  **Is it a separate judge?**
  It feels like a separate judge (conscience), but ontologically, it is a cognitive habit. It is the social voice internalized to the point where it can argue *against* the actual social voice. (e.g., "Everyone is cheering for me, but the Man within the Breast knows I cheated.")

  ### Summary of the Mechanics
  To untangle the knot for your seminar:

  1.  **Propriety:** The agent lowers their passion not because the spectator is "right," but because the spectator represents the **ceiling of communicability.** Morality is the successful transmission of feeling; if the agent is too loud, the transmission fails.
  2.  **Moral Emotions:** Pride and shame are **reflexive sympathies.** They are the pleasure or pain of finding that the sympathetic loop has closed (or failed to close).
  3.  **Impartial Spectator:** This is the **internalized, idealized social gaze.** It starts as real spectators, but through experience, we learn to correct their biases, creating an internal standard that can judge both ourselves *and* the actual spectators.

  Smith is essentially arguing that the "Self" is a social construct that eventually gains enough autonomy to judge the society that created it. The mechanics work because the desire for mutual sympathy is strong enough to force the agent to self-regulate, and experience is sharp enough to teach the agent that "what people feel" isn't always "what ought to be felt."
