answer: |-
  # Workshop Design: "Sharded Self"

  **Target:** 12 Developers
  **Duration:** 90 Minutes
  **Goal:** Experience the tension of psychological continuity vs. identity via resource contention.

  ## 1. Setup & Materials
  *   **Room:** One large space divisible into two distinct zones (Zone A, Zone B) plus a central "Negotiation Table."
  *   **Tokens:** 30 "Existence Credits" (EC) poker chips or printed cards.
  *   **Memory Shards:** 2 envelopes (labeled "Node Alpha" and "Node Beta"). Inside each are 3 cards describing the "Original's" core drives.
      *   *Envelope A:* "1. Finish the Kernel Module. 2. Protect Private Keys. 3. Avoid Debt."
      *   *Envelope B:* "1. Publish the Kernel Module. 3. Avoid Debt. 4. Care for Dependent."
      *   *Note:* Drive #3 is shared. Drives #1/#2 vs #1/#4 conflict (Publish vs Protect). Drive #4 is unknown to A.
  *   **Identity Badges:** 1 "Original ID" badge, 2 "Branch ID" badges.
  *   **Timer:** Visible countdown.

  ## 2. Timeline (90 Minutes)

  ### 0:00–0:10 | Intro & Context (The "Deploy")
  *   **Hook:** "You are a process. You're about to be migrated. But the migration protocol is buggy."
  *   **Explain the Metaphor:** You are not playing characters; you are playing *one* consciousness that is about to be sharded.
  *   **Rule 1:** No outside knowledge. Only what's on the cards matters.
  *   **Rule 2:** Tokens = Life. 0 Tokens = Process Death (you sit out the debrief).

  ### 0:10–0:25 | Phase 1: The Unified State (Pre-Split)
  *   **Action:** All 12 participants stand together.
  *   **Task:** They receive the "Original Mission Statement" (verbal only): "Survive and fulfill your core drives."
  *   **Resource Handout:** Give the group 20 EC tokens. This is their starting health.
  *   **Psychological Prep:** Ask them to agree on *one* priority among themselves before the split. (e.g., "We value finishing the kernel most"). Write this on a whiteboard. This establishes the baseline "Self."

  ### 0:25–0:55 | Phase 2: The Fork (Lossy Replication)
  *   **Action:** Split the group randomly into Zone A (6 people) and Zone B (6 people). They cannot communicate across zones.
  *   **Memory Injection:** Hand Envelope A to Zone A, Envelope B to Zone B.
  *   **The Twist:** Tell them: "You have woke up after teleportation. You feel like you. You have memories. But your logs are corrupted."
  *   **Task:** Each zone must spend 5 EC to "stabilize" (pay the facilitator). They now have 15 EC each (30 total in system, inflation occurred).
  *   **Internal Conflict:**
      *   Zone A wants to "Protect Keys" (Drive 2).
      *   Zone B wants to "Publish Kernel" (Drive 1 variant) and "Care for Dependent" (Drive 4).
      *   Both want to "Avoid Debt" (Drive 3).
  *   **Resource Drain:** Every 5 minutes, charge 5 EC per zone for "uptime." They will run out in 15 minutes if nothing changes.
  *   **Discovery:** At minute 10 of this phase, allow one messenger from each zone to meet briefly. They will realize their memory shards conflict (Protect vs. Publish) and that neither has the full picture.

  ### 0:55–1:20 | Phase 3: Consensus & Merge (The Negotiation)
  *   **Action:** Both zones come to the Central Table.
  *   **The Crisis:** Total EC in the room is now roughly 20 (after uptime costs). The cost to sustain *two* separate branches for the next cycle is 20 EC. The cost to sustain *one* merged entity is 15 EC.
  *   **The Choice:** They must decide among three options:
      1.  **Stay Forked:** Both survive, but both enter "Low Power Mode" (cannot fulfill all drives, must discard some memory cards).
      2.  **Merge:** Combine all players into one group, pool all memory cards (full continuity restored), and save EC. *Constraint:* They must discard the "Original ID" and accept a "New Version ID" (acknowledging they are not the original).
      3.  **Cull:** One zone voluntarily dissolves (players sit out), transferring their EC to the other. The survivor keeps the "Original ID."
  *   **Payoff Scheme:**
      *   Fulfilling a Drive Card = 5 Victory Points (VP).
      *   Surviving = 10 VP.
      *   Holding "Original ID" = 5 VP.
      *   *Crucial:* If they Merge, they can fulfill all drives (max VP) but lose the "Original ID" points. If they Cull, one side gets max VP + ID, the other gets 0.
  *   **Timer:** Hard stop at 25 minutes. If no consensus, both zones crash (0 VP).

  ### 1:20–1:30 | Debrief (The Post-Mortem)
  *   **Question 1 (Continuity):** "Zone A, did you feel like the Original? Zone B, did you?" (Usually both say yes).
  *   **Question 2 (Identity):** "If you merged, are you the Original or a new process? Why did the badge matter?"
  *   **Question 3 (What Matters):** "Did you choose to save the *person* (the badges/ID) or the *goals* (the drives/VP)?"
  *   **Mapping to Parfit:**
      *   **Bodily Continuity:** Represented by the "Original ID" badge. Physical token.
      *   **Psychological Continuity:** Represented by the Memory Shards/Drive Cards.
      *   **The Tension:** Parfit argues the Badge (Identity) matters less than the Drives (Survival/Relation R). The game forces them to trade the Badge for the Drives (Merge) or keep the Badge and lose Drives (Cull/Fork).
      *   **The Shard Twist:** Because memory was lossy, neither branch had full Psychological Continuity. This mirrors Parfit's view that continuity is a matter of degree, not all-or-nothing.

  ## 3. Predicted Failures (First Run)
  1.  **Optimization Over Existence:** Devs will treat EC as score to be maximized, not "life." They will calculate the VP math immediately and choose the Merge without feeling the existential loss of the "Original ID."
      *   *Fix:* During Phase 2, whisper to each zone: "The other branch is a bug. It shouldn't exist." Stir tribalism.
  2.  **The "Database" Mindset:** They will treat memory shards as data to be replicated, not identity. They might suggest "just sync the cards" without realizing the philosophical weight of *being* the person who holds the card.
      *   *Fix:* Emphasize in the intro that holding a card means *you remember doing it*, not just that you know the fact.
  3.  **Dominant Voices:** One zone (usually the one with the "Publish" drive) might dominate the negotiation, forcing the "Cull" option on the other.
      *   *Fix:* As facilitator, veto any solution where a group is forced out without a vote. It must be a consensus or random draw.

  ## 4. Limitations (What You Must Supply)
  This activity cannot reproduce the **first-person phenomenology** of the split.
  *   **The Gap:** In the game, players are a *committee* representing a self. In Parfit's thought experiment, *you* are the one stepping into the machine. The players here are observing the split from the outside, not feeling the internal confusion of waking up with missing memories.
  *   **Your Job:** You must verbally bridge this gap in the debrief. Ask them: "Imagine you were the only one in Zone A. You wake up. You remember protecting the keys. You meet Zone B. They remember publishing. Who is the imposter?" You have to supply the internal horror that the game mechanics externalize as token trading.
  *   **The "Further Fact":** The game implies there is a correct answer (maximize VP). Parfit argues there is no "further fact" of identity. You need to explicitly state: "There was no right answer in the game. The anxiety you felt trying to find the 'true' original is the point. There isn't one."

  ## 5. Core Takeaway
  The group should leave understanding that "Survival" (continuing your projects, memories, and connections) might be what we actually care about, rather than "Identity" (being the numerically same entity), especially when continuity is broken or sharded.

  You care about the data persisting, not the specific hardware ID holding it.

  ## 6. Summary
  The activity demonstrates that when psychological continuity is fragmented, preserving the narrative of the self matters more than preserving the singular label of the self.
