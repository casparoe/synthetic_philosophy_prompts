  If Separate: Both survive but with limited resources (degraded quality of life).
  If Merge: Full resources, full memory, but is it the same self?
  This creates the tension.

  *Predicted Failure:* Devs will treat it as a resource allocation problem (Kubernetes scaling) rather than an identity problem. I need to emphasize the *memory* aspect makes them feel like the original.

  *Limitation:* The game is third-person (group vs group). Parfit is first-person. I need to highlight this in the "What you must supply" section.

