answer: |-
  This is a sharp observation. You have correctly identified that the logical skeleton of the Doctrinal Paradox (also known as the Discursive Dilemma) remains intact when stretched across time, but the *normative* and *procedural* implications shift significantly. In the literature on judgment aggregation and group agency, this is indeed recognized as a distinct variant, though it shares the same formal DNA as the synchronic version.

  Here is the carving you requested.

  ### The Carving: Synchronic vs. Diachronic Inconsistency

  The phenomenon you observed is the **Diachronic Discursive Dilemma** (sometimes called the **Diachronic Doctrinal Paradox**).

  While the ordinary Discursive Dilemma is **synchronic** (inconsistency arises from a single profile of judgments on a fixed agenda at one time), your case is **diachronic** (inconsistency arises from the accumulation of profiles across multiple time points). The "carving" lies in the **bindingness of past outputs**. In the synchronic case, the inconsistency is visible before the meeting adjourns; the chair can rule a motion out of order or force a consistency constraint (e.g., "premise-based procedure"). In your diachronic case, the first decision (Michaelmas) becomes a *fact* of the committee's history. It is no longer a proposition to be weighed; it is a precedent that constrains the current agenda. The paradox emerges because the aggregation rule (majority voting) is applied myopically at each step without a mechanism to ensure global consistency over the committee's lifespan.

  ### Addressing Your Specific Comparisons

  **(a) The Ordinary Discursive Dilemma**
  *   **Similarity:** Both involve the failure of majority rule to preserve logical closure (specifically, conjunction introduction: $A$ is accepted, $B$ is accepted, but $A \land B$ is rejected).
  *   **Difference:** The ordinary dilemma is a failure of *simultaneous* rationality. Your case is a failure of *intertemporal* rationality. In the ordinary case, the group can theoretically fix the error before leaving the room. In your case, the error is "baked in" by the adjournment of the previous meeting. The diagnosis changes from "procedural error" to "structural rigidity."

  **(b) A Group Simply Changing Its Mind**
  *   **Difference:** A group changing its mind implies a reversal of preference on the *same* proposition (e.g., voting Yes on $A$ in Michaelmas and No on $A$ in Hilary). In your case, no proposition was reversed. The group voted Yes on $A$, Yes on $B$, and No on $A \land B$. The individuals did not flip-flop; the *collective* became inconsistent through composition. This is an aggregation artifact, not a preference shift.

  **(c) Path-Dependence and Order-Dependence**
  *   **Difference:** Path-dependence usually refers to outcomes depending on the *sequence* of votes on the *same* set of issues (e.g., voting on $A$ then $B$ yields a different result than $B$ then $A$). Your case is not about the order of $A$ and $B$ (both passed); it is about the relationship between the *parts* ($A, B$) and the *whole* ($A \land B$) across time. It is a failure of **logical closure**, not merely sequence sensitivity. However, it is a form of path dependence in the broader sense that the history of decisions constrains the feasible set of future consistent decisions.

  **(d) Membership Turnover**
  *   **Diagnosis:** This depends on your theory of **collective identity**.
      *   *If the Committee is the agent:* It is the **same phenomenon**. The "group mind" is inconsistent regardless of which neurons (members) constitute it at time $t$. Social choice theory typically treats the committee as the persistent agent.
      *   *If the Members are the agents:* It is a **different phenomenon** (Inter-generational Inconsistency). However, since you noted the *individuals* who remained were consistent, and the new members were consistent, the inconsistency still lies in the *aggregation rule* applied to the committee role, not the individuals. Thus, formally, it remains the Diachronic Discursive Dilemma. The turnover merely obscures the visual trace of the paradox without removing the logical structure.

  **(e) The Failed Rescission Motion**
  *   **Diagnosis Change:** Yes. If a motion to rescind the first decision fails, it confirms that the inconsistency is **structurally locked**. It demonstrates that the committee lacks a mechanism to prioritize global consistency over local majority rule. In the synchronic paradox, the chair can enforce consistency. In the diachronic case with failed rescission, the past majority binds the present majority, creating a "deadlock of precedents." This moves the diagnosis from a "voting anomaly" to a problem of **Constitutional Rigidity** within the committee's rules.

  ### Summary
  You have found the temporal extension of the Discursive Dilemma. It lacks a famous eponym (like "Arrow's"), but in formal theory, it is distinguished as the **Diachronic Discursive Dilemma**. It differs from the standard version not in logic, but in the *irreversibility* of the premises.

