answer: |-
  The booth smelled of ozone and stale coffee, the same scent as the last four quarters. Mara sat with her hands flat on the metal table, palms down. The vial sat between them. It looked like water, maybe slightly viscous. Tomorrow at 09:00, it would turn her gut into a knot of hot wire for twelve hours. Nothing permanent. Just misery.

  Across the glass partition, Silas watched the monitors. He looked tired. They all did. Velleity auditors burned out fast, spending their nights staring at graphs of human resolve.

  "Round five," Silas said. His voice came through the speaker, flat. "You know the clause, Mara. No escrow. No promises to third parties. No drinking to prove a point. No drinking because you like the money you already got. The intention must be conditional on there being *no reason* to drink tomorrow other than the intention itself."

  "I know the clause," Mara said.

  "Previous record: Four successful audits. Zero consumptions." Silas tapped a key. "Statistically, you're a liar. Physiologically, you're a saint. Start the countdown."

  The screen on the wall flickered. 23:58:00.

  Mara closed her eyes. This was the trick. Not the lying—she wasn't lying. The machine didn't measure truth; it measured predictive motor-cortex activation coupled with volitional weighting. To pass, she had to light up the neurons for *drinking* without lighting up the neurons for *reasoning*.

  In the beginning, she had tried to convince herself. She had tried to believe she would drink. That failed immediately. You can't fool a neural auditor into thinking you believe a contradiction. She knew she wouldn't drink. She had never drunk. Why would she? The money cleared at midnight. At 09:01, she would be rich and healthy, or rich and sick. The math was absolute.

  So she had stopped trying to predict the action.

  She focused on the word *Intend*. She had spent the last year excising the future tense from her commitment. Usually, intending meant *I plan to do X because I want Y.* But the clause banned *Y*. So she had to intend *X* because *X* was the shape of the moment.

  She visualized the vial. Not tomorrow's vial. The concept of the vial. She pushed away the thought of the nausea. She pushed away the thought of the bank account. She pushed away the thought of Silas watching her. She created a vacuum in her head, a small, cold room where only the act existed. She wasn't deciding to drink. She was aligning herself with the drinking. She made herself a vessel for the action, devoid of the utility of the action.

  It felt like holding her breath. It felt like standing on the edge of a roof and leaning forward, not to jump, but to feel the gravity.

  *Is this intention?* she wondered, as she had every quarter. Or was it just a mimicry of resolve? A hollow shell that rang true on the scanner?

  The machine didn't care. The machine saw the motor cortex flare. It saw the suppression of the amygdala's fear response. It saw the prefrontal cortex lock onto the target without querying the reward center. It saw a clean signal.

  23:59:30.

  Sweat prickled her hairline. The hollow space in her mind widened. She wasn't Mara anymore. Mara was a collection of reasons, and reasons were forbidden. She was just the hand reaching for the glass. She wasn't thinking about 09:00. She was thinking about the *now* of the 09:00. She collapsed the time.

  23:59:50.

  She felt the familiar fracture. This was the cost. To intend without reason, she had to sever the link between her present self and her future self. The Mara who sat in this booth was not the Mara who would wake up tomorrow. They were strangers. The booth-Mara could intend anything because she wouldn't have to live with the consequences. The morning-Mara would wake up, see the vial, see the money in her account, and walk away. And she would be right to.

  But here, now, booth-Mara was pure.

  "Signal stable," Silas said. His voice sounded distant. "Counterfactual check... clean. No secondary motivators detected. You're not doing this for pride. You're not doing it for the ladder. You're just... doing it."

  23:59:58.

  "Clear," Silas said.

  The light above the booth turned green. A chime sounded, soft and final. The transfer was complete. The money was hers. The obligation was void.

  Mara exhaled. The hollow space collapsed. The future rushed back in. She looked at the vial. It was just poison again. Tomorrow, she would leave it on the counter. She would make coffee. She would feel the faint ghost of guilt, the same ghost she had felt four times before, and she would dismiss it.

  She stood up. Her legs felt heavy.

  Silas opened the door. He didn't look at her, just at the clipboard in his hand. "You know you won't drink it."

  "Yes," Mara said.

  "Then what was that?" He gestured at the monitors, where the green lines were flattening out. "That wasn't prediction. That wasn't belief."

  "It was an intention," Mara said.

  "It was a performance."

  "It passed."

  Silas looked up then. He looked sorry for her. "You have enough money, Mara. The ladder caps out next quarter. Why come back? You're not going to drink it. You never do. You're just renting the feeling of meaning it."

  Mara picked up her coat. The pub outside would be loud, warm, full of people making plans they would break. They would promise to call, to quit, to leave, to stay. They would mean it when they said it, and they would fail when the morning came, and they would call it weakness.

  She looked at the vial one last time.

  "In there," she said, nodding at the booth, "I'm the only person I know who tells the truth."

  "You lied to the machine."

  "No. I told it exactly what I was. For sixty seconds, I was a creature who intended without why. Out there?" She pointed to the street, to the city, to the life waiting for her. "Out there, everything is because. I do this because I need that. I say this because I want that. I'm never just the act. I'm always the calculation."

  She stepped past him into the hallway. The air was cooler here.

  "Next quarter," Silas called after her. "You coming back?"

  Mara didn't turn around. She thought about the hollow space. The silence of it. The way the noise of her reasons stopped when she stepped into the booth. She thought about the morning, when she would look at the vial and walk away, and how clean that betrayal would feel because she had already been paid for it.

  "Yes," she said.

  "Even though you won't drink it."

  "Especially because I won't."

  She pushed open the door to the pub. The noise hit her like a wave, a thousand reasons colliding in the dark. She ordered a drink she didn't really want, from a menu she didn't care about, and waited for midnight to pass so she could check her balance and feel real again.
