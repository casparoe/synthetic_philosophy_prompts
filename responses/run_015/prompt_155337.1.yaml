answer: |-
  You are not overthinking this. You have identified a specific, well-documented friction point between rhetoric, pragmatics, and ethics, but because it sits at the intersection of three fields, it doesn't have one single "ordinary name." Your partner is right that the components have boring names, but you are also right that the *combination* creates a distinct shape that feels different from the sum of its parts.

  Here is the carving you are looking for, the existing terminology that fragments it, and a proposed name for the unified mechanism.

  ### 1. The Existing Terminology (The Fragments)
  Currently, linguists and rhetoricians describe this using three different maps, none of which fully capture the "shape" you see.

  *   **Rhetoric: *Apophasis* (or *Paralipsis*).**
      This is the figure of speech where you mention something by saying you won't mention it. ("I will not bring up my opponent's prior indictment.") This covers your forum example ("I'm not saying X") perfectly. It explains the *structure*, but not the *ethics*.
  *   **Pragmatics: *Off-Record Implicature*.**
      In Brown and Levinson's Politeness Theory, this is a strategy where the speaker hints at a meaning so they aren't directly responsible for it. This covers the *mechanism* of conveying without asserting.
  *   **Deception Studies: *Paltering*.**
      This is the act of using truthful statements to create a false or misleading impression. (e.g., The reference letter praising punctuality to imply incompetence). This covers the *truth-value* of the content.

  ### 2. The Mechanism: Why "Cancelability" Fails
  You remembered your pragmatics module correctly: standard conversational implicatures are supposed to be cancelable. (e.g., "Some of the students passed... in fact, all of them did." works fine).

  In your examples, the cancellation fails because of **Pragmatic Overdetermination**.
  When a speaker adds a disclaimer ("I'm not saying X"), they are performing a **Meta-communicative Act**. They are commenting on their own speech. In a cooperative conversation, we assume meta-comments are true. But in these cases, the context (a competitive hiring process, a heated forum thread, a contentious faculty meeting) makes the disclaimer **incredible**.

  The listener's brain processes the *implication* (which is relevant and high-value) faster than the *denial* (which is irrelevant and low-value). By drawing attention to the denial, the speaker highlights the very thing they are denying. This is why the cancellation doesn't just fail; it often backfires. It signals that the speaker *knows* the implication is there and is actively trying to suppress it, which confirms its presence.

  ### 3. The Moral Distinction: Politeness vs. Weaponization
  You asked why the "polite version" (guests leaving) feels different from the "forum version" (asking questions). The difference is **Risk Allocation**.

  *   **Polite Hinting (Collusive):** The speaker takes the risk. By saying "Some guests left," the speaker risks being misunderstood or having to clarify later. They absorb the cognitive load to spare the listener's feelings. Both parties collude in the fiction to maintain social harmony.
  *   **Your Pattern (Exploitative):** The speaker shifts the risk to the listener. By saying "I'm not saying X," the speaker forces the listener to infer X. If the listener challenges X, the speaker punishes them for "misinterpreting." The speaker reaps the benefit of the implication (damaging the candidate, winning the argument) while offloading the cost of accountability onto anyone who dares to state the implication aloud.

  This is why it feels morally worse than lying. Lying is a direct assault on the truth; this is an assault on the **contract of cooperation**. It exploits the listener's willingness to follow Gricean maxims against them.

  ### 4. A Name for the Shape
  Since no single existing term captures the structure (*Apophasis*), the truth-value (*Paltering*), and the strategic defense (*Plausible Deniability*), I propose we coin a term that describes the mechanism tightly.

  **The Term:** **Inoculated Implicature**

  **Definition:** An utterance that introduces a harmful or contentious idea via implicature, while simultaneously embedding a pre-emptive disclaimer designed to immunize the speaker against accountability for that idea.

  **Why this fits:**
  *   **Inoculated:** In medicine, inoculation introduces a weakened virus to build immunity. Here, the speaker introduces the "virus" (the accusation/implication) along with the "antibody" (the disclaimer). The goal is not to prevent the infection (the audience *must* catch the implication for it to work), but to prevent the *host* (the speaker) from getting sick (facing consequences).
  *   **Implicature:** It relies on the listener deriving meaning rather than being told directly.

  ### 5. Boundary Conditions (The Carving)
  To use this term tightly, here is how you distinguish it from nearby phenomena:

  | Phenomenon | Literal Truth? | Intent of Implication | Accountability | Term |
  | :--- | :--- | :--- | :--- | :--- |
  | **Irony** | False/Exaggerated | Shared recognition | Speaker owns it | Irony |
  | **Polite Hint** | True | Altruistic (Face-saving) | Speaker accepts risk | Off-record Politeness |
  | **Lying** | False | Deceptive | Speaker denies truth | Lie |
  | **Paltering** | True | Deceptive | Speaker denies implication | Paltering |
  | **Your Pattern** | **True** | **Hostile/Strategic** | **Speaker denies implication + punishes challenge** | **Inoculated Implicature** |

  **Borderline Case Test:**
  If you encounter a case and aren't sure if it counts, ask: **"If I state the implication aloud, does the speaker treat me as the aggressor?"**
  *   In **Polite Hinting**: If you say "Yeah, the party was bad," the speaker says, "Well, I didn't want to say that, but yes." (Collusion).
  *   In **Inoculated Implicature**: If you say "You're implying X," the speaker says, "I can't believe you'd put words in my mouth, I explicitly said I wasn't." (Trap).

  ### Summary
  You are observing **Inoculated Implicature**. It is the weaponization of *Apophasis* and *Paltering* to achieve *Plausible Deniability*. It feels morally distinct from polite hinting because it violates the cooperative principle by shifting the risk of interpretation from the speaker to the listener. It is not just hinting; it is setting a trap for anyone who acknowledges the hint.
