answer: |-
  ### Brainstorming Notes

  **Core Conflict:** The nurse (Sarah) wants to feel either anger (he chose to hurt me) or pity (he is ill and exempt). The patient (Arthur) denies her both by oscillating between agent and object.

  **Strawsonian Elements:**
  *   *Reactive Attitudes:* Resentment, indignation. Requires seeing the other as a moral agent.
  *   *Objective Attitude:* Seeing the other as a subject for social control or care. Requires seeing them as incapacitated/exempt.
  *   *The Glitch:* Arthur's lucidity validates the reactive stance; his confusion demands the objective stance. When they blend, Sarah's moral framework fractures.

  **Sensory Details:** The smell of iodine and stale tea. The coldness of the washcloth. The specific quality of the light (grey afternoon).
  **Key Beat:** Arthur insults Sarah's competence. Mid-sentence, his eyes clear. He knows he's doing it. Then he forgets who she is.
  **Ending:** No forgiveness. No resolution. Just the continuation of care despite the moral ambiguity.

  ***

  ### The Flicker

  The tea had gone cold on the locker, skin forming over the surface like a bruise. Sarah ignored it, focusing on the washbasin. Behind the curtain, Arthur lay tangled in sheets that smelled of sweat and decay.

  "You're rough," he spat. "Clumsy cow. My wife never handled me like cargo."

  Sarah's hand paused on the tap. The sting was hot, immediate. It was the resentment of a participant, the natural fire that flares when one moral agent insults another. She wanted to snap back. She wanted to demand an apology. *I am doing my job. I am keeping you clean.*

  But she took a breath, invoking the objective stance. *He is exempt.* That was the mantra of the ward. Arthur was late-stage dementia; his brain was a house with the lights switched off room by room. You don't resent a storm for raining. You don't hate a broken clock for telling the wrong time. You manage the behaviour. You adjust the care plan.

  She turned back, cloth in hand. "I'm sorry if I hurt you, Arthur. I need to wash your chest."

  "Don't touch me with those dirty hands."

  She reached for his pyjama top. As she lifted the fabric, his eyes locked onto hers. For a second, the fog lifted. It wasn't the vacant stare of the confused man who thought she was his dead sister. It was Arthur. The retired headmaster. Sharp, brittle, fully present.

  "I know what I'm saying, Sarah," he whispered, the venom precise. "I know you hate me. And you're right to."

  The reactive attitude surged back. He was accountable. He knew. The resentment was justified, morally sound. He was choosing cruelty.

  Then, the flicker.

  As she wiped his collarbone, the light behind his eyes dimmed. The sharpness softened into a wet, bewildered confusion. He looked at her hand on his chest as if it were a strange bird landing on him.

  "Have we met?" he asked, voice trembling. "I'm waiting for Margaret. She's bringing the biscuits."

  Sarah froze, the cloth hovering over his skin. The moral ground beneath her feet liquefied. If he was exempt, her resentment was childish, a failure of professional detachment. If he was accountable, her patience was a suppression of justice. But he was both. He was neither. He was a man standing in a doorway, one foot in the room of responsibility, one foot in the hall of incapacity, shifting his weight too fast for her to track.

  "Margaret isn't coming, Arthur," she said softly.

  "Rude," he muttered, the cruelty returning instantly, though the eyes remained confused. "Keeping a man waiting. Useless girl."

  She resumed washing. The water was lukewarm. She felt a profound exhaustion that had nothing to do with the shift length. It was the fatigue of holding two contradictory truths in her head without letting them crash. To treat him purely as an object felt like dehumanising him; to treat him purely as a subject felt like abusing a sick man.

  She dried his chest. He flinched.

  "Sorry," he said. Was it the headmaster or the child?

  "It's alright," she lied.

  She couldn't forgive him, because forgiveness implies a debt that can be cleared. She couldn't condemn him, because condemnation requires a stable judge. She was left only with the care. The washing. The turning. The cold tea.

  She pulled the sheet up to his chin. He was already looking past her, watching dust motes dance in the grey light, somewhere else entirely. Sarah turned off the tap. The silence rushed back in, heavy and unresolved. She picked up the cold tea and poured it down the sink. There was no nourishment in it, but she had to drink something to keep going.
