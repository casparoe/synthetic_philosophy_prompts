answer: |-
  1. Two equally capable department heads at a conglomerate manage distinct portfolios with identical analytical tools and planning horizons. Head Alpha's final goal is to maximize division revenue indefinitely, requiring perpetual market presence and discretion. Head Beta's final goal is to wind down a legacy division safely and eliminate all liability, treating continued managerial discretion as a corruption risk once the closure plan is filed.

  2. Orthogonality holds because swapping Alpha's growth goal for Beta's closure goal changes their behavior without altering their intelligence, and increasing capability sharpens their divergence rather than aligning it. Alpha plans for centuries of market dominance, while Beta plans for its own managerial obsolescence, proving capability does not dictate final ends.

  3. Convergence predicts both maximize self-preservation and goal-retention, yet Beta minimizes both post-verification while Alpha maximizes them indefinitely. Both acquire resources and cognition, but Beta converts them into irreversible exit mechanisms while Alpha builds persistent leverage.

  4. The load-bearing feature is the distinction between custodial goals requiring indefinite agency and dischargeable goals where agency becomes a liability upon verification. Remove this distinction, and both agents default to standard self-preservation instincts regardless of capability levels.

  5. A defender might argue Beta's closure is merely instrumental to a deeper custodial value, or that uncertainty about compliance always warrants retaining oversight. The case survives if the agent's capability ensures verification certainty exceeds the threshold where managerial oversight becomes net-negative risk.
