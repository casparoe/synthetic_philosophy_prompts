answer: |-
  Here are ten sharp, conversational interview questions designed to probe the limits of her strict Darwinian framework. They are ordered to build a narrative arc, starting with the ontology of the meme and ending with the normative implications.

  The two required deep-dives (TikTok and Maladaptive Memes) include the specific follow-ups you requested, keyed to her likely theoretical defenses.

  ### 1. The Ontology of the Remix (Replicator vs. Interactor)
  "In strict Darwinian terms, you need a replicator that maintains fidelity and an interactor that faces selection. In oral traditions, the story is the replicator and the telling is the interactor. But look at a TikTok dance challenge. The video *is* the artifact, but every single iteration is remixed, sped up, or altered. If the interactor mutates wildly every time it's copied, where exactly is the replicator stored? Is it the audio file, the dance moves, or something else?"

  ### 2. Follow-up: The Cognitive Schema Trap
  *(Use this if she answers that the replicator is the 'template' or 'rule' for the dance.)*
  "If the replicator is just the abstract 'rule' or 'template' for how to make the video, aren't we just describing a cognitive schema in the human brain? How do you distinguish that from the Evolutionary Psychology claim that we have innate modules for imitation, without just saying 'one is inside the head and one is outside'?"

  ### 3. The Maladaptive Meme Objection (Engagement vs. Welfare)
  "You argue that algorithmic feeds are active selection environments, not neutral pipes. But algorithms select for engagement, which often correlates with outrage or misinformation, not host welfare. In biology, a parasite that kills its host too quickly usually goes extinct. Why doesn't digital selection weed out these 'harmful' memes when they burn out the user or degrade the network's long-term health?"

  ### 4. Follow-up: The Multi-Level Selection Limit
  *(Use this if she answers that selection works at multiple levels and host harm is 'not a bug' of memetic evolution.)*
  "I get that multi-level selection allows for conflict, but there has to be a floor. If a meme format encourages behavior that gets the host banned from the platform or drives them offline entirely, the vehicle is destroyed. At what point does the selection pressure become self-terminating? Is there a 'error catastrophe' threshold where the environment becomes too toxic for the replicators to sustain themselves?"

  ### 5. The Evolutionary Psychology Boundary
  "You claim memetics explains cross-cultural universals without postulating innate mental modules, relying instead on convergent cultural evolution. But convergence usually implies a shared landscape. If different cultures independently evolve similar taboos or myths, isn't the most parsimonious explanation that the human brain *constrains* the possible variations? How do you account for that convergence without smuggling innate cognitive structures back in as the 'environment'?"

  ### 6. The Problem of Failed Memes
  "For every viral format, there are thousands of structurally identical ideas that never catch on. If the selection environment is the primary driver, identical inputs should yield similar probabilities of success. When a meme fails despite having the right 'fitness' traits, are you forced to admit that individual human agency or hidden historical contingencies play a larger causal role than your model allows? Does accounting for failure require you to acknowledge intentional design?"

  ### 7. Fidelity vs. Virality Trade-off
  "You've noted that high-mutation formats spread *because* they are bad at preserving information. This seems to invert the standard Darwinian requirement for fidelity. If a lineage evolves to maximize mutation rates to game the algorithm, does it stop being 'evolution' in the strict sense and become something more like noise? Is there a point where the fidelity drops so low that we can no longer trace a lineage?"

  ### 8. Algorithm as Designer vs. Selector
  "In biology, the environment is blind. But social media algorithms are engineered by humans with specific goals (retention, ad revenue). When you call the algorithm a 'selection environment,' are you describing natural selection, or is this actually Artificial Selection masquerading as a Darwinian process? Does the presence of human designers at the top of the stack break the analogy?"

  ### 9. Defining the "Host" Boundary
  "In biological evolution, the host is clearly the organism. In your digital framework, is the host the individual brain, the social network, or the device ecosystem? If a meme spreads by bypassing conscious awareness—say, a visual aesthetic that primes behavior without the user knowing—who or what is actually being 'infected'? I'm trying to pin down where the boundary of the vehicle lies."

  ### 10. Normative Implications (The "Gardening" Question)
  "Finally, if memes are selfish replicators and algorithms are selection pressures that favor the harmful over the beneficial, is 'good' culture even a stable state? If we accept your framework, does intervention require us to become 'memetic engineers' who artificially alter the selection environment? Or does acknowledging the machinery break our ability to make normative claims about what *should* spread?"
