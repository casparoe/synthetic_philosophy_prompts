answer: |-
  You have hit the nail on the head. Your intuition is not just correct; it is the central tension in the philosophy of statistics over the last century. The short answer to your question is: **The standard practice is not internally coherent.** It is a historical accident that fused two incompatible statistical frameworks (Fisher's significance testing and Neyman-Pearson hypothesis testing) and then interpreted them through a third, unstated framework (naive Bayesianism).

  Here is the breakdown of what the practice quietly assumes, why it is logically fractured, and what would actually need to change to fix it.

  ### 1. The Historical Hybrid: A Category Error
  To understand what view of probability is presupposed, you have to look at the history, because the current practice is a "Frankenstein" monster of two different philosophies that were never meant to be combined.

  *   **Ronald Fisher (Evidential):** Fisher introduced the $p$-value as a measure of **evidence** against the null hypothesis in a specific experiment. For Fisher, a $p$-value was an inductive measure: "This data is rare under the null, so I am suspicious of the null." He explicitly rejected rigid cutoffs like 0.05; he thought the researcher should interpret the number in context.
  *   **Neyman & Pearson (Behavioral):** They critiqued Fisher. They argued that statistics shouldn't be about "evidence" or "truth" in a single case, but about **long-run error control**. You set an $\alpha$ (Type I error rate) and $\beta$ (Type II error rate) *before* the experiment. If $p < \alpha$, you "reject"; otherwise, you "accept" (or fail to reject). This is a decision rule, like quality control on a factory line. It makes no claim about the truth of *this* specific hypothesis, only that if you follow this rule forever, you won't be wrong too often.

  **The Quiet Assumption:** Modern science uses **Fisher's number** ($p$-value) to make **Neyman-Pearson's decision** (publish/reject), but interprets the result as **Fisher's evidence** (the effect is real).

  This is logically incoherent. Neyman-Pearson statistics explicitly forbid interpreting a single result as "proof" of a hypothesis; they only guarantee long-run error rates. By treating $p < 0.05$ as "the effect is real," scientists are making an evidential claim that the Frequentist math they are using does not support.

  ### 2. The Inversion Problem: Secret Bayesianism
  You identified the second major issue: $P(\text{Data} | H_0)$ is not $P(H_0 | \text{Data})$.

  Frequentist logic says: "If the null were true, this data would be rare."
  Scientific practice hears: "Since this data is rare, the null is probably false."

  This is the inverse fallacy. To move from the first statement to the second, you **need** Bayes' Theorem. You need to know the prior probability that the null is true ($P(H_0)$) and the likelihood of the data under the alternative ($P(\text{Data} | H_1)$).

  **The Quiet Assumption:** The $p < 0.05$ gate secretly assumes a **flat or skeptical prior** that is never stated. It assumes that before you ran the experiment, $H_0$ and $H_1$ were roughly equally plausible, or that $H_1$ is plausible enough that a $p$-value of 0.03 shifts the posterior probability high enough to warrant belief.

  This is why the replication crisis hits fields with low prior probabilities (like parapsychology or some social priming effects) harder than fields with high prior probabilities (like physics). In a Bayesian framework, if the prior on $H_0$ is high (e.g., "telepathy doesn't exist"), a $p$-value of 0.04 barely moves the posterior probability. But under the standard $p < 0.05$ ritual, a $p$-value of 0.04 counts the same for telepathy as it does for gravity.

  So, the practice presupposes a **Bayesian interpretation of evidence** (updating belief in a hypothesis) while using **Frequentist calculations** (which cannot update belief) and forbidding the specification of **Bayesian priors** (which are deemed "subjective"). It is Bayesianism without the admission of subjectivity.

  ### 3. The File Drawer: The "Long Run" Lie
  Your point about meta-analysis is crucial. Frequentist error rates (Type I errors) are defined over the **long run of all tests conducted**.

  If you run 100 studies where the null is true, you expect 5 to come up $p < 0.05$. That is the definition of $\alpha = 0.05$. However, if you only publish the 5 significant ones and hide the 95 nulls, the published literature now shows a 100% success rate.

  **The Quiet Assumption:** The system assumes **complete reporting**. It presupposes that the "long run" over which error rates are controlled includes the studies in the file drawer. Since the file drawer is invisible, the error control is broken.

  When a meta-analysis pools published studies, it treats them as a random sample of *all conducted studies*. They are not. They are a sample of *statistically significant studies*. This inflates effect sizes (the "winner's curse") and creates false confidence. The practice presupposes a scientific ecosystem that functions like a public registry of trials, while operating in an ecosystem that functions like a market for novel claims.

  ### 4. What View of Probability is Actually Presupposed?
  If it's not coherent Frequentism and it's not honest Bayesianism, what is it?

  It is **Industrial Quality Control disguised as Epistemology.**

  The $p < 0.05$ threshold is not really about truth. It is a **coordination mechanism**. It is a social technology designed to solve a bureaucratic problem: *How do editors and reviewers filter thousands of papers without reading every dataset in detail?*

  *   **The Probability View:** It treats scientific truth like a manufacturing defect rate. We are willing to accept a 5% "defect rate" (false positives) in the literature in exchange for a streamlined production process.
  *   **The Evidence View:** It treats the $p$-value as a "ticket of admission." It doesn't prove the effect is real; it proves the result is "not easily explained by noise alone," which grants the author the right to speak.

  The incoherence arises because scientists treat the "ticket of admission" as a "certificate of truth."

  ### 5. What Would Have to Change?
  If we swapped the bright-line gate for something else, the changes would need to be structural, not just mathematical.

  **A. Reporting Effect Sizes and Uncertainty (The "New Statistics")**
  *   **Change:** Ban the word "significant." Require confidence intervals and effect sizes.
  *   **Philosophical Shift:** Moves from binary ontology (Effect exists/doesn't exist) to magnitude estimation (How big is the effect?).
  *   **What breaks:** It breaks the binary decision rule for publication. A study with a wide confidence interval including zero might still be valuable if it tightens the bounds on a parameter.
  *   **What stays:** It doesn't solve the file drawer problem. You can still only publish "large effect" studies.

  **B. Bayesian Posteriors**
  *   **Change:** Report $P(H_1 | \text{Data})$.
  *   **Philosophical Shift:** Forces the admission of priors. You have to state how likely you thought the hypothesis was before the data.
  *   **What breaks:** It breaks the illusion of objectivity. Reviewers would have to argue about priors, not just check a math box. It makes the "burden of proof" explicit.
  *   **What stays:** You still need to solve the file drawer problem. Bayesian updating fails if the denominator of studies is hidden.

  **C. Preregistration and Registered Reports (The Structural Fix)**
  *   **Change:** You submit your methods and analysis plan *before* collecting data. The journal agrees to publish the result regardless of the $p$-value, provided you followed the plan.
  *   **Philosophical Shift:** This restores the **Frequentist long-run**. By counting the denominator (all planned studies), the Type I error rate becomes meaningful again.
  *   **What breaks:** It breaks the "novelty" incentive. It makes null results publishable.
  *   **What stays:** It requires a massive shift in funding and career incentives.

  ### Summary
  The $p < 0.05$ practice presupposes a **Frequentist calculation** used to make a **Bayesian inference** within a **selection-biased sample**, all governed by an **industrial quality control** heuristic.

  It is not internally coherent. It works only as long as everyone agrees to ignore the contradictions. To fix it, you cannot just change the number (e.g., to $p < 0.005$). You have to change the **incentive structure** (publish nulls, value replications) and the **interpretive framework** (admit priors, focus on estimation rather than binary rejection).

  You are stuck on this because you are looking for a logical justification for a social convention. There isn't one. The $p < 0.05$ threshold is the scientific equivalent of a speed limit: it's an arbitrary line drawn to manage traffic flow, not a law of physics. Treating it as a law of physics is where the crash happens.
