answer: |-
  This is a genuinely strong thesis. You've identified a tension between Dennett's *synchronic* account of consciousness (what's happening now in the parallel streams) and the *diachronic* requirements of agency (how I am responsible for what I did yesterday). Your roommate likely got a B− because they treated the Multiple Drafts model as a label ("This scene is a draft!") rather than a problem to be tested. You are testing a limit case: what happens to the "Center of Narrative Gravity" when the narrative is deliberately severed?

  Here is a breakdown of your four questions, plus the counter-evidence you asked for, to help you stress-test this before you write.

  ### 1. Is the "Handoff Condition" Cartesian Smuggling?

  **The Risk:** Yes, there is a risk. If you argue that Leonard *needs* a unified subject to receive the handoff, you are smuggling in a homunculus. If the "handoff" requires a single entity to hold the reason across time, you've rebuilt the Theater.

  **The Fix:** Frame the "Handoff Condition" not as an ontological requirement for a *Self*, but as a functional requirement for *Intentionality* within Dennett's own system. Dennett argues we are centers of narrative gravity. Gravity implies attraction over distance. Your argument should be: **Multiple Drafts can explain awareness, but it struggles to explain *commitment* without a robust handoff mechanism.**

  Don't say Leonard lacks a "subject." Say Leonard lacks *inferential integration*. In Dennett's model, a thought becomes conscious when it wins the competition for influence over speech or action. Leonard's system is rigged so that Draft B (future) is prevented from critically evaluating Draft A (past). He isn't smuggling a Cartesian agent; he is highlighting that Dennett's "narrative" requires a certain fidelity of transmission to function as *agency* rather than just *behavior*. You are arguing that the Multiple Drafts model explains *how* Leonard acts, but your "Handoff Condition" explains why his actions feel morally hollow. That is a critique *of* Dennett, not a violation of him.

  ### 2. Where Does the Film Resist You?

  **Resistance A: Leonard is too competent.**
  A strict Multiple Drafts reading of severe anterograde amnesia might suggest confusion, stumbling, or catatonia. Leonard drives, manipulates people, investigates, and kills with precision. If the drafts are truly fragmented, how is the *goal* so stable?
  *   **Your Counter:** The goal isn't stable; the *system* is stable. The tattoos and notes are externalized drafts that stabilize the goal artificially. The film resists you by making him look like a classic detective (unified agent); you need to argue that this competence is the horror, not the salvation. He is a machine running a script, not a man solving a puzzle.

  **Resistance B: It's just a memory problem.**
  A critic might say, "This isn't philosophy of mind; it's just a guy with hippocampal damage."
  *   **Your Counter:** If it were just biological memory loss, the Sammy Jankis story wouldn't be a projection. The fact that Leonard *displaces* his own condition onto Sammy proves that the "memory" is a narrative construct, not a storage failure. This is the load-bearing Dennettian point: memory is editing, not recording.

  ### 3. The Structure (Reverse/Forward/Sammy)

  Do not treat the editing as just "rhyming" with the theory. It is an **epistemic trap**.

  *   **Color/Reverse:** This forces the audience into the Multiple Drafts position. We never see the "cause" before the "effect." We are constantly probing the present moment without the context of the past draft. We are denied the "Cartesian Theater" view of the timeline. We only get the draft as it is presented.
  *   **B&W/Forward:** This mimics the illusion of continuity. It feels safer, more logical. When the two timelines merge at the end, the "safety" of the forward narrative is revealed to be just as manipulated as the reverse one.
  *   **Sammy Displacement:** This is your strongest evidence. If Sammy is Leonard, then the "condition" Leonard describes is a story he is telling himself *now*. This is pure Dennett: the content of the memory is fixed by the current probe (Leonard's current need to believe he is different from Sammy). The film dramatizes the denial of the theater by denying the audience a stable timeline to stand on. We cannot be the central audience because the timeline itself is fragmented.

  ### 4. The Moral Horror & The Model

  **Can Multiple Drafts express the horror?**
  Yes, but it changes the nature of the horror.
  *   **Cartesian Horror:** A man loses his soul/mind and becomes a monster. (There was a captain, now there isn't).
  *   **Dennettian Horror:** There never was a captain. The ship is steering itself into the rocks via a system of automated notes, and "responsibility" is a label we apply to a process that has no center.

  **The Trap:** The film *does* seem to blame Leonard. In the final scene, he chooses to ignore the truth Teddy tells him. He says, "I have to believe in a world outside my own mind." He *chooses* the deception.
  *   **The Tension:** If Dennett is right, who is doing the choosing? Is it a draft that won the competition? If so, is he guilty?
  *   **Your Angle:** The moral horror is that the Multiple Drafts model *dissolves* the grounds for blame, but the film forces us to blame him anyway. Leonard installs the handoff artificially (the "John G." note) to create a *fictional* continuity that allows him to feel like an agent. The horror is that he knows it's a fiction (in that moment) but commits to it anyway to preserve the *illusion* of the Theater. The film helps itself to the Cartesian intuition (he is guilty) while dramatizing the Dennettian reality (he is fragmented). **This is your paper's punchline:** *Memento* shows us that we *need* the Cartesian Theater to make sense of morality, even if philosophy tells us it doesn't exist.

  ### 5. Strongest Counter-Evidence Scenes

  If I were your TA looking to poke holes in this, I would point you to these two moments:

  1.  **The Kill Scene (Teddy):**
      *   **The Scene:** Leonard stands over Teddy's body. He has just realized Teddy was helping him, that "John G." is already dead, and that he is manipulating himself. He says, "Now, where was I?" and decides to set up Teddy as the target.
      *   **The Problem:** This moment shows a high-level, unified meta-cognition. He understands the entire system of his own deception. He is editing the narrative *knowing* it is an edit.
      *   **Why it hurts your thesis:** If he can understand the fragmentation and manipulate it so coherently in a single stretch of time, does he really lack the "handoff"? He seems to have a "Master Draft" in that moment.
      *   **How to defend:** Argue that this lucidity is the anomaly that proves the rule. It is a fleeting draft that gets immediately overwritten by the system (the tattoos/notes). The tragedy is that this unified insight *cannot be stored*. It dies with the moment. The handoff fails *because* he cannot save this specific draft.

  2.  **The Phone Call with "Teddy" (Lenny calling himself):**
      *   **The Scene:** Leonard talks to Teddy on the phone, gathering info, sounding rational and investigative.
      *   **The Problem:** He functions too well as a continuous investigator.
      *   **How to defend:** Distinguish between *procedural* continuity (skills, habits, driving, talking) and *declarative/normative* continuity (reasons, identity, moral binding). Dennett allows procedural continuity without a self. Your "Handoff Condition" is about the normative binding. Leonard can hunt, but he cannot *answer for* the hunt.

  ### Summary Advice for the Paper

  *   **Don't over-define the Handoff.** Keep it functional. It's the mechanism by which Draft N+1 treats Draft N as a *reason* rather than just a *cause*.
  *   **Lean into the Sammy/Leonard swap.** This is the most Dennettian moment in the film. It proves memory is narrative fabrication.
  *   **Embrace the Moral Tension.** Don't try to solve whether Leonard is guilty. Argue that the film exposes the cost of Dennett's view: if there is no Theater, there is no one to hold accountable, and that is terrifying.
  *   **Avoid:** Saying "Leonard represents the Multiple Drafts model." Instead: "Leonard represents a *breakdown* in the narrative integration that the Multiple Drafts model assumes is sufficient for personhood."

  This angle is load-bearing because it uses the film to stress-test Dennett, rather than just using Dennett to describe the film. Good luck.
