answer: |-
  Van Fraassen's Reflection Principle posits a rational constraint linking an agent's current credences to their anticipated future credences. Specifically, let $A$ be a proposition, $P_1$ the agent's credence function at time $t_1$, and $P_2$ their anticipated credence function at $t_2$. Reflection requires that for any value $r$, $P_1(A \mid P_2(A) = r) = r$. This is standardly defended as a norm of diachronic coherence, underwritten by a Dutch-strategy argument suggesting that violating it renders an agent exploitable. However, Reflection should be abandoned as a primitive norm. In cases where it holds, it is merely a theorem of Conditionalization; in cases where it diverges from Conditionalization, it is false. The Alix case demonstrates this decisively.

  Consider Alix at $t_1$ with credence $P_1(A) = 0.5$. She anticipates that at $t_2$ she will observe a test result $R \in \{+, -\}$, where $P_1(R=+ \mid A) = 0.9$ and $P_1(R=+ \mid \neg A) = 0.1$. Crucially, she also knows her prior memory will be corrupted by a compound, replacing her base rate with a value $q$ drawn from a known distribution on $(0, 1)$, independent of $A$ and $R$. At $t_2$, unaware of the corruption, she updates on $R$ using $q$ as her prior. Her resulting credence $P_2(A)$ will be $p_2 = 9q/(1 + 8q)$ if $R=+$ and $p_2 = q/(9 - 8q)$ if $R=-$. Alix at $t_1$ knows this entire causal structure. To evaluate Reflection, we must determine $P_1(A \mid P_2(A) = r)$. Treating the conditioning on the continuous variable $P_2(A)$ in the density sense, the event $P_2(A) = r$ is the union of two disjoint possibilities: $R=+$ with $q = r/(9 - 8r)$, or $R=-$ with $q = 9r/(1 + 8r)$. Let $f(q)$ be the density of $q$. The likelihood of observing $P_2(A)=r$ given $A$ is proportional to $0.9 f(q_+) |J_+| + 0.1 f(q_-) |J_-|$, where $J$ represents the Jacobian of the transformation from $q$ to $r$. The likelihood given $\neg A$ swaps the weights to $0.1$ and $0.9$. Since $P_1(A) = P_1(\neg A) = 0.5$, the posterior odds $P_1(A \mid P_2=r) / P_1(\neg A \mid P_2=r)$ equal the ratio of these likelihoods. Unless $f$ and the Jacobians satisfy a specific, unmotivated algebraic identity, this ratio will not equal $r/(1-r)$. Thus, Reflection fails. Moreover, because $R=+$ is strong evidence for $A$ while $R=-$ is strong evidence against it, and $P_2$ conflates the signal $R$ with the noise $q$, $P_1$ recognizes $P_2$ as over-extreme. For $r > 0.5$, $P_1(A \mid P_2=r) < r$; Alix's current self trusts her future self less than the future self trusts itself.

  The magnitude of this violation depends continuously on the dispersion of $q$. If the distribution of $q$ concentrates entirely on the true base rate $0.5$, the corruption vanishes, $P_2$ becomes a standard Bayesian update, and Reflection holds. As the variance of $q$ increases, the divergence between $P_1$'s assessment of $P_2$ and $P_2$'s self-assessment grows. This continuum matters for any attempt to rescue Reflection by restricting it to agents who do not anticipate cognitive malfunction. Such a restriction would be ad hoc: there is no sharp boundary between the transparent case (zero variance) and the Alix case (positive variance). If Reflection is a norm of rationality, it should not toggle on and off based on the continuous parameter of noise variance. To exclude the Alix case, one must essentially stipulate that Reflection only applies when the future prior is correct, which renders the principle trivial.

  Furthermore, this failure is not covered by the standard escape clauses. Usually, Reflection is suspended if the later evidence is "inadmissible" (e.g., seeing the future) or if the agent forgets or reasons poorly. Here, $R$ is ordinary empirical evidence; there is no selection effect or self-locating uncertainty. Alix's reasoning at $t_2$ is impeccable; she updates correctly on the inputs she possesses. The only defect is that one input ($q$) is corrupted by external physics unknown to her at $t_2$. Restricting Reflection to exclude this would require a clause like "unless the future prior is distorted," which collapses the norm into the requirement that one should only defer to a future self that has updated correctly on the current self's priors. This presupposes the very coherence Reflection is meant to enforce.

  The Dutch-strategy argument purportedly supporting Reflection also misdiagnoses the defect. A bookie who knows the setup can indeed construct a strategy guaranteeing Alix a loss: at $t_1$, sell her a bet on $A$ conditional on $P_2(A)=r$ at price $r$; at $t_2$, buy the bet back at price $r$. Since $P_1(A \mid P_2=r) \neq r$, this yields a sure loss. However, this does not show $P_1$ is incoherent. $P_1$ is fixed by the physics of the test and the distribution of $q$; it is the rational response to her total evidence. The defect lies in her policy of accepting bets at $t_2$ at prices determined by $P_2$. Alix can avoid the loss by using her $t_1$ knowledge to irrevocably fix her $t_2$ betting odds to match $P_1(A \mid P_2=r)$. This shows the normative force lies in maintaining a coherent policy over time, not in satisfying a static constraint on $P_1$. The Dutch Book argues against blind deference to a future self known to be noisy, not against the credence function $P_1$ itself.

  Finally, in transparent cases where Alix is certain she will learn a partition cell $E$ and set $P_2(\cdot) = P_1(\cdot \mid E)$, Reflection is not an additional norm but a theorem. If $P_2(A)$ is determined by conditioning $P_1$ on $E$, then $P_2(A)$ is a sufficient statistic for $E$ regarding $A$. Probability theory dictates that $P_1(A \mid P_1(A \mid E) = r) = r$. Here, Reflection adds no content; it is simply a consequence of Conditionalization. Thus, Reflection is redundant where it is true (standard learning) and false where it is informative (cases like Alix's). It should be abandoned as a primitive diachronic norm.

  The proper norm is simply that an agent must update by Conditionalization on anticipated evidence where possible, and where future cognitive states are anticipated to be distorted, the agent must adopt a pre-commitment policy at $t_1$ that maximizes expected utility given those distortions. Diachronic rationality is a matter of optimal policy planning, not a constraint requiring current credences to match anticipated future credences.
