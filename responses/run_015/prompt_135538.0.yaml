answer: |-
  **Question 1 (25 marks)**

  **Decision Problems and Approaches**

  Consider two decision problems. In both, you must choose to **Pay** \$1,000 or **Refuse**.

  **Case A (Counterfactual Mugging):** A fair coin is tossed. If Tails, a Predictor simulates your decision procedure. If the simulation outputs **Pay**, you receive \$1,000,000. If Heads, you are approached and asked to **Pay** \$1,000. You receive nothing further. The coin has landed Heads; you are being asked.
  **Case B (XOR Blackmail):** Your house is worth \$1,000,000. A flood destroys it with probability $p = 1/100$, independently of your actions. A Blackmailer with a perfect Predictor of your dispositions sends a letter demanding \$1,000. The letter is sent if and only if exactly one of these is true: (1) you would **Pay** if the letter arrived, (2) the flood occurs. If the letter arrives and you **Refuse**, the Blackmailer destroys the house. If you **Pay**, the house is safe from the Blackmailer (but not the flood). The letter has arrived.

  Evaluate these cases using three approaches defined by their procedures:
  1.  **Causal:** Intervene on your action. Calculate expected value (EV) using causal probabilities $P(World \mid do(Action))$.
  2.  **Evidential:** Condition on your action. Calculate EV using evidential probabilities $P(World \mid Action)$.
  3.  **Functional:** Ask what would follow if your decision procedure returned this output, holding fixed whatever else depends on that procedure. Calculate EV over the prior distribution of states.

  **(a)** For each case, state the recommendation of each approach. Show the expected value calculations explicitly. (10 marks)
  **(b)** The Functional approach recommends **Pay** in Case A and **Refuse** in Case B. Explain why this is not a contradiction. Diagnose the argument that the cases are formally identical up to relabeling and must yield the same verdict. (7 marks)
  **(c)** Suppose the Predictor is correct with probability $q$ (independently), while flood prediction remains perfect and $p \approx 0$. Derive the threshold $q$ required for the Functional recommendation to remain optimal in each case. Discuss what the asymmetry in these thresholds implies for the viability of the Functional approach. (8 marks)

  *(Word limit for this question: 1,200 words)*

  ***

  **Model Answer**

  **(a) Recommendations and Expected Values**

  **Case A (Mugging):**
  *   **Causal:** The coin is already Heads. Paying costs \$1,000 causally. It cannot change the past Tails outcome.
      $EV(\text{Pay}) = -1,000$. $EV(\text{Refuse}) = 0$. **Recommendation: Refuse.**
  *   **Evidential:** Conditioning on Paying in the Heads world provides no evidence about the past coin toss.
      $EV(\text{Pay}) = -1,000$. $EV(\text{Refuse}) = 0$. **Recommendation: Refuse.**
  *   **Functional:** We evaluate the decision procedure ex-ante. If the procedure outputs **Pay**, the Predictor predicts **Pay**.
      $EV(\text{Pay}) = 0.5(-1,000) + 0.5(1,000,000) = 499,500$.
      $EV(\text{Refuse}) = 0.5(0) + 0.5(0) = 0$.
      **Recommendation: Pay.**

  **Case B (Blackmail):**
  *   **Causal:** The letter has arrived. Paying saves the house from the Blackmailer. Flood risk $p$ is independent.
      $EV(\text{Pay}) = -1,000 - p(1,000,000) = -11,000$.
      $EV(\text{Refuse}) = -1,000,000$ (Blackmailer destroys house).
      **Recommendation: Pay.**
  *   **Evidential:** We condition on Action given Letter ($L$). The rule is $L \iff (\text{Pay} \oplus \text{Flood})$.
      If Pay, then $\text{Flood}$ must be False for $L$ to be true. $P(\text{Flood} \mid \text{Pay}, L) = 0$.
      If Refuse, then $\text{Flood}$ must be True. $P(\text{Flood} \mid \text{Refuse}, L) = 1$.
      $EV(\text{Pay}) = -1,000$. $EV(\text{Refuse}) = -1,000,000$.
      **Recommendation: Pay.**
  *   **Functional:** We evaluate the policy ex-ante.
      Policy **Pay**: Letter sent if $\sim\text{Flood}$ (prob $1-p$). Cost \$1,000. If Flood (prob $p$), no letter, house lost to flood.
      $EV(\text{Pay}) = (1-p)(-1,000) + p(-1,000,000) = -10,990$.
      Policy **Refuse**: Letter sent if $\text{Flood}$ (prob $p$). Cost \$1,000,000. If $\sim\text{Flood}$ (prob $1-p$), no letter, house safe.
      $EV(\text{Refuse}) = p(-1,000,000) + (1-p)(0) = -10,000$.
      **Recommendation: Refuse.**

  **(b) Consistency and the Relabeling Argument**

  The Functional approach is not contradictory because the logical dependence operates differently in the payoff structures. In Case A, the decision determines the reward in the *counterfactual* branch (Tails) while incurring a cost in the *actual* branch (Heads). Since the reward (\$1M) vastly outweighs the cost (\$1k) and branches are equiprobable, Paying is optimal.

  In Case B, the decision determines *which branch you inhabit* (Letter vs. No Letter). Paying ensures you inhabit the "Letter Sent" branch in the high-probability No-Flood world, incurring a sure cost. Refusing ensures you inhabit the "No Letter" branch in the high-probability No-Flood world, incurring no cost. The loss in the low-probability Flood world is accepted to avoid the high-probability fee.

  The "relabeling" argument fails because it ignores the probability distribution over the states (Coin vs. Flood) and the specific dependency of the *problem's arrival* on the decision. In Case A, the problem arrives regardless of the decision (in Heads). In Case B, the problem's arrival is logically entangled with the decision and the state. Treating them as identical ignores that Case B allows the agent to logically prevent the demand from arising in the most likely world, whereas Case A does not.

  **(c) Imperfect Predictor Thresholds**

  Let $q$ be predictor reliability. $p \approx 0$.
  **Case A:** $EV(\text{Pay}) = 0.5(-1,000) + 0.5(q \cdot 1,000,000)$. $EV(\text{Refuse}) = 0$.
  Pay is optimal if $500,000q > 500 \implies q > 1/1,000$.
  **Case B:**
  Policy **Pay**: Predictor says Pay ($q$). Letter sent ($\sim$Flood). Cost \$1,000.
  $EV(\text{Pay}) \approx -1,000q$.
  Policy **Refuse**: Predictor says Pay ($1-q$). Letter sent (Flood). Cost \$1,000,000.
  $EV(\text{Refuse}) \approx -1,000,000(1-q)$.
  Refuse is optimal if $-1,000,000(1-q) > -1,000q \implies 1,000q > 1,000,000 - 1,000,000q \implies 1,001,000q > 1,000,000 \implies q > 1,000/1,001 \approx 0.999$.

  **Asymmetry:** The Functional recommendation in Case A (Pay) is robust; it survives even with very poor prediction ($q > 0.001$). The recommendation in Case B (Refuse) is fragile; it requires near-perfect prediction ($q > 0.999$). This suggests that while logical correlation can justify paying in mugging scenarios easily, relying on it to avoid blackmail demands extreme confidence in the predictor's accuracy. If $q$ is moderate, the Functional approach switches to Paying in Case B, aligning with Causal theory. This asymmetry indicates that the Functional approach is not universally distinct from Causal theory; it converges with Causal recommendations when logical correlations are noisy, specifically in avoidance scenarios.

  ***

  **Marking Scheme (25 Marks)**

  **1. Case A Calculations (5 marks)**
  *   **A (5):** Correct EVs for all three approaches. CDT/EDT = Refuse (-1k vs 0). FDT = Pay (499.5k vs 0).
  *   **B (3):** Correct recommendations but arithmetic errors or missing explicit EVs.
  *   **C (1):** Only identifies recommendations without calculation.
  *   *Common Error:* Calculating FDT EV using posterior coin probability (0.5) but ignoring the predictor's link to the Tails reward.

  **2. Case B Calculations (5 marks)**
  *   **A (5):** Correct EVs. CDT/EDT = Pay (-11k vs -1M). FDT = Refuse (-10k vs -10.99k).
  *   **B (3):** Correct recommendations but ignores flood risk in CDT/EDT calc or miscalculates FDT priors.
  *   **C (1):** Recommendations only.
  *   *Common Error:* Comparing Payer's \$1,000 (in ~Flood) against Refuser's \$1,000,000 (in Flood) while overlooking the worlds in which no letter arrives and the house is lost anyway (or saved). This leads to incorrect FDT valuation.

  **3. Consistency Diagnosis (7 marks)**
  *   **A (7):** Explains that FDT optimizes ex-ante policy, not ex-post act. Identifies that Case A buys reward in counterfactual branch, Case B avoids cost in actual branch by preventing letter arrival. Explicitly refutes relabeling by citing probability weights ($p$ vs 0.5) and arrival dependency.
  *   **B (4):** States they are different but relies on intuition ("one is blackmail") without structural analysis of the logical dependencies.
  *   **C (1):** Claims it is a contradiction or offers no justification.
  *   *Note:* Credit arguments focusing on the "source" of correlation (Prediction of Action vs. Prediction of State) if logically sound.

  **4. Threshold Derivation (5 marks)**
  *   **A (5):** Correct derivation for both cases ($q > 0.001$ for A; $q > 0.999$ for B).
  *   **B (3):** Correct for one case, or algebraic errors in the inequality setup.
  *   **C (1):** Attempts algebra but fails to isolate $q$.
  *   *Common Error:* Assuming $p=0$ eliminates the Flood cost entirely in Case B, ignoring the Blackmailer's destruction conditional on the error.

  **5. Asymmetry Implications (3 marks)**
  *   **A (3):** Notes robustness of Case A vs. fragility of Case B. Discusses convergence with Causal theory at moderate $q$ or implications for trusting predictors.
  *   **B (2):** Notes the numbers are different but offers weak interpretation.
  *   **C (0):** No discussion.

  **Special Marking Notes:**
  *   **Evidential Split (Case B):** If a candidate argues EDT recommends **Refuse** (claiming conditioning on Action cannot change the probability of the Flood given the Letter is already fixed), award full marks for Part 1 provided the reasoning is consistent and clearly defined. Do not penalize for disagreeing with the model answer on this specific point, as it is a known contention in conditioning on logical constraints.
  *   **The "No-Letter" Mistake:** In Part 1 (Case B), if a candidate calculates FDT EV by comparing only the Letter-Worlds (Pay: -1k, Ref: -1M), deduct 2 marks from Section 2. This overlooks the No-Letter worlds where Refuse saves the house.
