  Your endorsement of prioritarianism directly contradicts your claim that there is no interpersonal summing of welfare, and your lifeboat intuition will conflict with prioritarianism whenever the single individual is significantly worse off than the five. Prioritarianism necessarily aggregates priority-weighted welfare across persons to determine the right policy, so you cannot maintain (1) as written while holding (2); you are effectively aggregating, just with a convex transformation of welfare rather than a linear one. Furthermore, while saving five over one is consistent with prioritarianism when welfare levels are equal, your grounding of this choice in fairness rather than welfare weights in (4) creates a theoretical rift with (2) that surfaces if the single stranger is worse off, since prioritarianism would then demand saving the one despite the numbers.

  The tension between accepting cost-benefit analysis in (3) while rejecting the transplant case in (5) is manageable but requires you to treat separateness of persons as a constraint on direct rights violations rather than a ban on all trade-offs; this works if you frame (3) as ex ante fair risk imposition that no one could reasonably reject, whereas (5) is an ex post violation that treats a person as a mere means. Your view on intrapersonal aggregation in (6) remains the stable foundation for these distinctions, marking the boundary where summing is permitted versus where it requires justification, so these do not clash but rather define the scope of your theory.

  The cheapest repair is to reformulate (1) to oppose interpersonal *compensation* rather than interpersonal *aggregation*, acknowledging that institutions can sum weighted benefits without claiming one person's loss is canceled by another's gain. You must also qualify (4) to apply only when the individuals involved are similar in welfare terms, ensuring that your prioritarian commitment to the worse-off does not get overridden by a simple headcount unless priority weights are equal.
