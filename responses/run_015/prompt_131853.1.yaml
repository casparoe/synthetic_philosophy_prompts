answer: |-
  # The Co-op Automation Filter: A Decision Procedure

  **Time Allocation:** 30 Minutes
  **Theoretical Stance:** Technology is not neutral. It encodes social relations. In a worker-owned co-op, machinery must serve to reduce necessary labour time and enhance collective capability (General Intellect). If a tool imposes external discipline or treats labour as a cost to be cut rather than activity to be dignified, it replicates capitalist subsumption, regardless of who signs the cheque.

  **Instructions:** The board reads the proposal. One member acts as Chair to keep time. You proceed through the four gates sequentially. If a gate is failed, the proposal is rejected unless a specific 'Value Pass' is invoked.

  ---

  ## Gate 1: The Opacity Test (Ownership & Maintenance)
  **Question:** Do we possess the full rights to modify, repair, and inspect the internal logic of this system, and do we currently have the skills in-house to do so?
  *   **Sufficient Answer:** Yes. We have the source code/blueprints, legal right to modify, and at least two members can maintain it without vendor support.
  *   **Fail Condition:** The system is a 'black box', relies on proprietary cloud services, or requires certified external technicians for routine repairs.
  *   **Marxist Rationale:** If we cannot repair it, the machine owns us. This is the baseline for preventing the *General Intellect* from being alienated into a private asset.
  *   **Judgement Call:** *How much training is 'too much'?* Deciding whether to upskill members or reject the tool is a political choice about resource allocation, not a technical fact.

  ## Gate 2: The Subsumption Test (Discipline & Pace)
  **Question:** Does this technology set the pace of work, or does it measure compliance, rather than assisting the worker in setting their own pace?
  *   **Sufficient Answer:** The worker initiates the cycle, sets the speed, or can override the system without penalty.
  *   **Fail Condition:** The system tracks location, enforces break times, calculates 'efficiency scores', or stops work if a metric is missed.
  *   **Marxist Rationale:** This distinguishes *Formal Subsumption* (tech used to monitor/enforce existing labour) from *Real Subsumption* (tech revolutionising the process). If the algorithm acts as the foreman, you have reintroduced the capitalist function of management into the workshop.
  *   **Judgement Call:** *What counts as 'penalty'?* Soft nudges vs. hard locks. The board must decide where 'assistance' ends and 'coercion' begins.

  ## Gate 3: The General Intellect Test (Skill & Knowledge)
  **Question:** Does operating this machine increase the collective technical understanding of the membership, or does it deskills the operator by hiding the process?
  *   **Sufficient Answer:** Operating the machine teaches the member something about the underlying process (e.g., metallurgy, logic, mechanics).
  *   **Fail Condition:** The machine turns a skilled task into a button-pressing exercise where the operator understands less about the work after adoption than before.
  *   **Marxist Rationale:** The *General Intellect* must become a direct productive force *for the workers*. If knowledge is embedded in the machine but inaccessible to the worker, the worker becomes an appendage of the machine.
  *   **Judgement Call:** *Is 'drudgery reduction' worth 'deskilling'?* Sometimes removing a boring task is worth losing the skill. This is a value judgement, not a procedural one.

  ## Gate 4: The Redundancy Test (Labour Time)
  **Question:** If this automation renders specific roles or hours redundant, is the saved time returned to the workforce as reduced hours for the same pay, or is it used to increase output/cut costs?
  *   **Sufficient Answer:** Total collective working hours are reduced proportionally to the labour saved, with no loss of income.
  *   **Fail Condition:** Workers are reassigned to other tasks to maintain current output levels, or headcount is reduced to save money.
  *   **Marxist Rationale:** Under capitalism, automation creates a 'reserve army of labour' (unemployment). In a co-op, automation must buy freedom. If you automate to cut costs or increase throughput, you are treating labour as a cost to be minimised, which is capitalist logic.
  *   **Value Pass:** If the proposal fails Gate 4, it may proceed *only* if the affected workers voluntarily consent to the reassignment and the board explicitly acknowledges this is a compromise on socialist principles for economic survival.

  ---

  ## Limitations of the Procedure
  Be honest about what this checklist cannot do.
  1.  **Economic Viability:** This procedure does not calculate ROI. A tool might pass all four gates and bankrupt the co-op. That is a separate financial decision.
  2.  **Interpersonal Conflict:** It cannot resolve disputes where members disagree on what constitutes 'coercion' or 'deskilling'.
  3.  **The 'Survival' Compromise:** Sometimes, to keep the co-op alive, you must act like a capitalist firm. This procedure will flag that as a moral failure, but it cannot prevent it.

  ---

  ## Application to Current Proposals

  ### Case 1: AI Shift-Scheduling Tool (Tracks Location)
  *   **Gate 1 (Opacity):** **Fail.** Likely proprietary algorithm. Even if open source, does anyone on the board know how to audit the weighting logic? *Assume No.*
  *   **Gate 2 (Subsumption):** **Fail.** Tracking location and auto-scheduling is the definition of *Formal Subsumption*. It imposes external discipline. The algorithm becomes the foreman.
  *   **Gate 3 (Intellect):** **Fail.** Members learn nothing about scheduling logistics; they simply obey the app.
  *   **Gate 4 (Redundancy):** N/A (Failed earlier).
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** This is surveillance capitalism in a co-op shell. It optimises the extraction of labour time rather than liberating the worker from it.

  ### Case 2: Collectively Programmed CNC Lathe
  *   **Gate 1 (Opacity):** **Pass.** Open hardware, members maintain it.
  *   **Gate 2 (Subsumption):** **Pass.** Members set the parameters. The machine follows the worker's code, not vice versa.
  *   **Gate 3 (Intellect):** **Pass.** Programming a CNC requires learning G-code, tolerances, and material properties. It upskills the membership.
  *   **Gate 4 (Redundancy):** **Pass.** It aids production without explicitly removing roles; it handles dangerous/repetitive cuts humans shouldn't do.
  *   **Verdict:** **ACCEPT.**
  *   **Reasoning:** This is the *General Intellect* in action. Social knowledge is embodied in the tool, accessible to all, enhancing collective capacity without imposing discipline.

  ### Case 3: Open-Source Automated Parts Sorter (Makes Two Roles Redundant)
  *   **Gate 1 (Opacity):** **Pass.** Open-source design.
  *   **Gate 2 (Subsumption):** **Pass.** It's a bin-filler, not a boss.
  *   **Gate 3 (Intellect):** **Conditional Pass.** Only if members rotate through maintenance. If it's just 'feed the hopper', it risks deskilling. *Let's assume they rotate maintenance.*
  *   **Gate 4 (Redundancy):** **Fail.** The proposal states the two workers will be reassigned to the backlog of repairs to increase total throughput.
  *   **Verdict:** **REJECT (Unless Amended).**
  *   **Reasoning:** This is the answer you probably won't like. The machine is efficient, open-source, and removes drudgery. However, by reassigning the workers to maintain *output* rather than reducing *hours*, you are using the machine to intensify labour elsewhere. You are treating the saved labour time as a surplus to be capitalised upon, rather than freedom to be distributed.
  *   **The Hard Truth:** Unless the co-op is willing to reduce the weekly working hours of *all* members by the equivalent of two full-time roles while maintaining the same wage, this machine acts as capital. It increases the rate of exploitation (even if you exploit yourselves). If you cannot guarantee the hour reduction, you must reject the sorter, or admit you are prioritising business growth over worker liberation.

  ---

  ## Final Note on the 'Unliked' Answer
  You might argue that Case 3 (The Sorter) is vital for the co-op's competitiveness. If we don't sort faster, we drown in donations. This procedure forces you to admit that **competitiveness and Marxist liberation are currently in tension.**

  If you pass Case 3 using the 'Value Pass', you are acknowledging that you are keeping the co-op solvent by compromising its theoretical foundation. That is an honest position, but do not call it 'socialist automation'. Call it what it is: a survival tactic. The procedure's job is not to make you feel good about that compromise, but to ensure you see it clearly.
