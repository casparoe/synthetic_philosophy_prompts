answer: |-
  There is no single, universally standardized term that captures *exactly* this configuration (a true causal explanation of present behavior that falsifies itself upon uptake), but you are standing in a well-mapped intersection of three concepts: **Performativity**, **Looping Effects**, and **Subintentional Action**.

  Here is the carving you need, the distinction between the stable and unstable cases, and a tight neologism for your footnote.

  ### 1. The Existing Neighborhood
  You are describing a specific valence of **Michel Callon's "Counter-Performativity"** combined with **Ian Hacking's "Looping Effects."**

  *   **Performativity (Callon/MacKenzie):** Theories don't just describe the world; they enact it. Usually, this is discussed as *successful* performativity (the theory makes the world match the model, e.g., option pricing models shaping markets).
  *   **Counter-Performativity:** The theory makes the world diverge from the model.
  *   **Looping Effects (Hacking):** Classifying people changes how they act, which changes the classification.

  **Why these don't quite fit:**
  Performativity literature usually focuses on whether a theory *becomes* true. Your case is weirder: the theory *was* true, and its truth caused it to *become* false. Hacking's looping effects are close, but they often imply a change in the *kind* of person (e.g., "the autistic child"), whereas you are describing a change in the *causal mechanism* sustaining a practice.

  ### 2. The Distinction: Why Traffic Lights Survive
  You asked what marks the difference between the explanations that survive publication (traffic lights) and those that don't (co-op norms). The distinction is **Common Knowledge vs. Tacit/Background Knowledge.**

  *   **Traffic Lights (Hermeneutically Robust):** The mechanism relies on *explicit coordination*. The causal power comes from everyone knowing that everyone knows the rule. Publishing the explanation adds nothing to the epistemic state; it reinforces the common knowledge required for the equilibrium.
  *   **Co-op/Church Norms (Hermeneutically Fragile):** The mechanism relies on *pre-reflective* or *tacit* adherence. The norm works because it is experienced as "just what we do" or "who we are," not "a strategy we are employing."
      *   In the **Co-op**, the norm relied on *shame* (an emotional, pre-reflective sanction). Making the mechanism explicit turned it into a *calculation* (a reflective choice), which dissolved the shame.
      *   In the **Church**, the practice relied on *identity* (unavowed belonging). Making the mechanism explicit turned it into *signaling* (avowed performance), which rigidified the practice.

  In both fragile cases, the explanation moved the actors from a **practical consciousness** (doing without theorizing) to a **discursive consciousness** (theorizing the doing). The causal mechanism cannot survive that translation.

  ### 3. The Coined Term
  For your methods footnote, I recommend **Hermeneutic Fragility**.

  It is distinct from "reflexivity" (which is the general capacity for feedback) and "self-defeating prophecy" (which is about future predictions). It specifically names the property of a causal mechanism that depends on the actors' lack of explicit theoretical awareness of that mechanism.

  **Definition for a footnote:**
  > **Hermeneutic Fragility:** A property of a social causal mechanism wherein the mechanism's operative force depends on the actors' lack of explicit, theoretical awareness of the mechanism itself. Unlike *hermeneutically robust* mechanisms (e.g., coordination equilibria like traffic laws), which are stabilized by common knowledge, hermeneutically fragile mechanisms (e.g., tacit norms, identity-based mutual aid) are altered or dissolved when the explanation of their function becomes common knowledge among the actors. This renders the explanation historically true but nomologically unstable.

  ### 4. Explanation vs. Evidence
  You asked whether this is a problem for the *explanation* or the *evidence*.

  It is a problem for the **Nomological Status** of the explanation, not its truth.
  *   **Evidence:** Your evidence remains valid. You correctly identified the cause *at the time*.
  *   **Explanation:** The explanation is not a "law" (a timeless regularity); it is a **historical diagnosis**.

  In natural science, discovering gravity doesn't change how gravity works. In social science, discovering the "gravity" of a norm can change the norm. Therefore, your claim is not "X causes Y," but "X caused Y *under conditions of opacity*."

  ### 5. Summary for your Writing
  If you need to reference this without footnoting a neologism, you can frame it as **Opacity-Dependent Causality**.

  *   **Traffic Lights:** Transparency-Dependent (works *because* it is known).
  *   **Co-op Norms:** Opacity-Dependent (works *because* it is backgrounded).

  Your problem is that you have identified **Opacity-Dependent Mechanisms** and treated them as if they were **Transparency-Independent**. The "failure" isn't in your analysis; it's in the expectation that social mechanisms should behave like physical laws. They are more like biological specimens that react to the light of the microscope.

  **Recommendation:** Use **Hermeneutic Fragility**. It signals to sociologically literate readers that you understand the Double Hermeneutic (Giddens) but are specifying a particular vulnerability within it. It distinguishes your case from the Hawthorne Effect (observation) and Goodhart's Law (metrics), landing precisely on the *theoretical uptake* issue you described.
