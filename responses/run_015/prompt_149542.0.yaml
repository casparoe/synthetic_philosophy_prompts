          *   Inapplicable question: Best fit. The schema itself is wrong. The predicate `existsInherently(x)` is ill-formed.

      *   *Q3: Rejecting all four.* 5th value? Integrity constraint? Withdrawn query?
          *   5th value: Implies a state in the lattice. Madhyamaka says it's not a state.
          *   Integrity Constraint: Implies the data is bad. Madhyamaka says *reality* doesn't fit the schema.
          *   Withdrawn Query/Schema Error: Best fit. It's a meta-logical move.

  5.  **Drafting the Residue Report:**
      *   *Clean Translations:* The first two corners (True/False) map to Asserted/Explicitly Negated. The "Neither" maps somewhat to Unknown/NULL (epistemic gap). The "Both" maps to Belnap's Overdetermined.
      *   *Distortions:* Treating the 4th corner as a logical value. Treating the rejection as a 5th value.
      *   *No Counterpart:* The *soteriological* function (ending suffering). The idea that logic itself is empty (*śūnyatā of śūnyatā*). The non-implicating negation.

  6.  **Formulating the Verdict:**
