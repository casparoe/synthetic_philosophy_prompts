      *   *Nuance:* Distinguish *paryudāsa* (implicating negation, "not X" implies "Y") from *prasajya* (non-implicating, "not X" implies nothing). In KR, `owl:complementOf` is implicating. SQL `NULL` is epistemic. Nāgārjuna needs something that deletes the *question*.
