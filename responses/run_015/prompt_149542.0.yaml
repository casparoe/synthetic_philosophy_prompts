      *   Section 3: Residue Report (Clean, Distorted, Missing).
      *   Section 4: The Verdict (Limitation vs. Indeterminacy + Engineering Advice).

  *(Self-Correction during drafting)*: Be careful with Belnap. Belnap's 4 values are {True, False, Both, None}. This looks exactly like the Tetralemma. Why is the friend wrong? Because Belnap's values are *truth values* assigned to propositions within a system. Nāgārjuna is rejecting the *system's ability to assign values* to metaphysical propositions. The "rejection of all four" is not a 5th value *in* the logic; it's a move *outside* the logic. I need to emphasize the *meta-logical* status of the rejection.

  Also, clarify *svabhava* in KR terms. *Svabhava* ≈ Intrinsic Identity / Immutable Resource Identifier that exists independently of relations. Emptiness = All resources are defined purely by relations (properties), no intrinsic ID. But even relations are empty. This is like a graph where nodes are nothing but edges, but edges require nodes. It's a structural paradox.

