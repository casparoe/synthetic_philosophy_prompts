      *   *Proposed Name:* The **Signal-Coercion Test**.
      *   *Core:* Praise is legitimate when it functions as a *signal* of specific merit to those who can verify it, without functioning as a *coercive demand* for status deference that compounds into structural advantage.

  6.  **Address New Cases (as requested):**
