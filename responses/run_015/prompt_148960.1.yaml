      *   **Task:** Evaluate 10 specific case verdicts against a proposed principle ("Audibility Condition" + "Ratchet Mechanism"). Refine, replace, or reject the principle. Provide verdicts on new cases. Assign confidence levels. Challenge the user where necessary.
