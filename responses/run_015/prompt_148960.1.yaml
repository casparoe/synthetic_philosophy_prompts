      *   **Key Concepts:** *Jantelagen* (don't think you're anyone), Audibility Condition (praise requires visible achievement), Ratchet Mechanism (praise compounds into unfair advantage).

  2.  **Deconstruct the User's Proposed Principles:**
      *   **Audibility Condition:** Public celebration is okay if observers can *see* why it's an achievement. Bad if it's just "rank" (admire me because I'm above you).
