  7.  **Identify Weaknesses/Overturns:**
      *   *Case 5 (School Awards):* I might challenge the user. "Defeatist" is one view; "Community Building" is another. The Ratchet is zero here, so why the anger? Maybe it's the *lie* (Audibility failure).
      *   *Case 6 (Mother):* This isn't about public praise principles; it's about family dynamics/privacy. I should tell the user to drop this from the "public praise" theory.
