      *   *Moral Standing/Population Ethics:* User counts "statistical future people" (those who can't move in). Priya counts "named present tenants" (those facing eviction). This is a classic "identified vs. statistical lives" problem.
      *   *Commodity Exceptionalism:* Priya argues housing $\neq$ labor. User tries to equate them via price controls. Priya says home is non-fungible/survival-critical in a way wages aren't.
