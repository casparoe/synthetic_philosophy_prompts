answer: |-
  This is an unusually clear-eyed description of a policy stalemate. You have already done most of the diagnostic work yourself. Your hypothesis is correct: you are not having a substantive disagreement about economics, nor is this merely verbal. You are having a **normative and procedural disagreement disguised as an empirical one.**

  You asked for a ranking of what is actually carrying the weight of this argument, stripping away the decoration. Here is the diagnosis, ranked by explanatory power.

  ### 1. The Baseline Problem (Ideal vs. Non-Ideal Theory)
  **Weight:** 40%
  This is the engine of the stalemate. You are arguing from **Ideal Theory**; Priya is arguing from **Non-Ideal Theory**.
  *   **Your Question:** "Is rent control the optimal policy for housing allocation?" You are comparing the ordinance to a hypothetical, efficient frontier (vouchers + upzoning + mobility grants). In that comparison, rent control fails.
  *   **Priya's Question:** "Is rent control better than the political status quo?" She is comparing the ordinance to the *feasible set* of policies this specific city council will pass. In her model, the counterfactual to "strict rent cap" is not "perfect housing policy"; it is "nothing."
  *   **Why it stalls:** You view her baseline as capitulation to political failure; she views your baseline as a fantasy constraint that guarantees immediate harm. You cannot move because you are evaluating the *quality of the tool*, while she is evaluating the *urgency of the repair*.

  ### 2. Identified vs. Statistical Lives (Population Ethics)
  **Weight:** 35%
  This is the moral weighting system you are both using.
  *   **Your Count:** You count **statistical future persons**. Your primary moral concern is the invisible renter who *would* have moved to the city in 2026 but cannot find an unit because turnover dropped. They have no face, no name, and no vote.
  *   **Priya's Count:** She counts **identified present victims**. Her primary moral concern is the named tenant on her block who receives an eviction notice in March.
  *   **Why it stalls:** This is a known cognitive and ethical bias (the "Identifiable Victim Effect"), but for Priya, it is a feature, not a bug. She believes political obligation is owed to the people *here*, not the people *who might come*. You believe policy justice requires impartiality between current and future residents. Neither of you can prove the other's weighting system is "wrong" because it's a foundational ethical axiom, not a fact.

  ### 3. Housing Exceptionalism (Commodification)
  **Weight:** 20%
  This is why your minimum wage analogy failed.
  *   **Your View:** Housing is a market good. A price ceiling is the symmetric opposite of a price floor (minimum wage). If one distorts, the other should too.
  *   **Priya's View:** Housing is a **pre-condition for citizenship**, not a consumption good. Losing a job (wage floor issue) reduces welfare; losing a home (price ceiling issue) removes your physical foothold in the jurisdiction.
  *   **Why it stalls:** You tried to win on market mechanics (monopsony vs. competition). She moved the goalpost to moral ontology. She is arguing that shelter belongs in a different category than labor, similar to how we treat voting rights or legal counsel. If housing is a right, market efficiency is irrelevant. If housing is a commodity, efficiency is paramount. You haven't agreed on the category.

  ### 4. Empirical/Technical Disagreement
  **Weight:** 5%
  *   **Status:** Decoration. You both stipulate the literature. Your attempt to use monopsony power was, as you noted, doing no work. The empirical reality is the shared ground, not the battleground.

  ---

  ### The Two Questions You Are Actually Answering

  To dissolve the argument, you need to acknowledge that you are answering two different questions under the heading "Is this good policy?"

  1.  **Your Question:** "Does this policy maximize aggregate welfare and allocative efficiency compared to a theoretically optimal alternative?"
  2.  **Priya's Question:** "Does this policy prevent immediate, catastrophic displacement for vulnerable residents given the actual constraints of local politics?"

  You are both answering "Yes" to your own questions. That is why you are going in circles. You are saying, "This is a suboptimal tool." She is saying, "It is the only tool in the box."

  ### What Counts as Progress?

  Since this bottoms out in bedrock ethics and political philosophy, looking up a number (elasticity, vacancy rates) will not help. You have already agreed on the numbers. Progress requires shifting the conversation from **truth** to **trade-offs**.

  **1. Acknowledge the "Second-Best" Constraint**
  Progress looks like you explicitly conceding the baseline point. You might say: *"I agree that in a vacuum, vouchers are better. I also agree that this council will not pass vouchers. So I accept we are debating a 'second-best' policy."*
  This removes her need to defend rent control as *optimal* and allows her to defend it as *damage mitigation*.

  **2. Test the "Housing Exceptionalism" Claim**
  Instead of fighting the analogy, probe the limit. Ask: *"If housing is morally distinct from labor, does that distinction hold for vacation homes? Or second units? Or does the moral protection only attach to the primary residence?"*
  If she agrees the moral exception only applies to primary homes, you might find common ground on **vacancy decontrol** (which you noted is absent). If she insists the market itself is the problem regardless of unit type, then you have successfully identified the disagreement as anti-commodification vs. market allocation, which is an honest philosophical split.

  **3. The "Pairing" Test**
  The only empirical/Policy move that bridges your gap is **conditional support**.
  Progress looks like asking: *"Would you support the rent cap if it were legally paired with aggressive upzoning to offset the supply shock?"*
  *   If she says **Yes**: Then your disagreement is purely about political sequencing (Baseline Problem).
  *   If she says **No**: Then her opposition to supply growth is the real driver, and the "protecting tenants" argument is secondary to a desire to limit city growth or density.

  ### The Verdict on the Fight

  You should not drop the argument, but you must change the terrain. You are currently fighting a policy war when you are actually fighting a jurisdictional war.

  *   **You** are acting like a **Planner**: Focused on system-wide optimization and long-term flows.
  *   **Priya** is acting like a **Social Worker**: Focused on immediate triage and specific client survival.

  Both roles are necessary, but they speak different languages. The annoyance you feel is the friction between System 1 (her immediate harm) and System 2 (your systemic efficiency).

  **Recommendation for the next conversation:**
  Tell her this: *"I think we agree on the economics. I think I am weighing the invisible future renter too heavily, and you are weighing the visible current tenant too heavily. I am worried that by solving her problem, we create a worse problem for someone we can't see. Can we talk about whether there's a way to protect the visible tenant without hiding the cost from the invisible one?"*

  That invites her into your baseline without invalidating her moral standing. If she refuses that, then the disagreement is indeed bedrock: she values the current community's stability over the city's potential growth, and you value the city's potential growth over the current community's stability. That is a political disagreement worth having, but it shouldn't be dressed up as an economic one.
