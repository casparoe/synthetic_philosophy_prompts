answer: |-
  Your historical claims are robust. The Entwurf theory (1913) indeed yielded roughly 18 arcseconds, failing the full anomaly, which resolves the 'engineered fit' worry: the 1915 equations discriminated between Einstein's own live candidates.

  Mapping the strategies reveals distinct friction points. For the **counterfactual/ur-prior** view (Earman), *E* is the 43″ residual, *H* is GR. We model Einstein's credence in November 1915 by asking what he would have believed had he not known *E*. This feels artificial; the anomaly was background knowledge, not a hidden variable. **Garber's approach** posits that Einstein learned not *E*, but that *H* entails *E*. This captures the cognitive shift but stumbles on logical omniscience: why wasn't the entailment obvious earlier? **Glymour's bootstrapping** treats *E* as computed from *H* plus auxiliaries (masses, perturbation theory). This handles the auxiliary-laden nature well but struggles to quantify confirmation. **Zahar and Worrall's use-novelty** require *E* be unused in *H*'s construction. Since Einstein targeted the anomaly, this view denies the perihelion confirmatory force, contradicting the historical consensus that it was GR's strongest initial support. **Mayo's severity** asks whether *E* would be likely if *H* were false. Here, *E* counts because Newtonian mechanics and the Entwurf theory failed to produce it.

  Three complications stress these models. First, *E* is not raw; it is a residual dependent on auxiliaries (solar oblateness, planetary masses). Bayesian entailment relations are rarely clean; they are approximate and theory-laden. Second, *E* was previously 'spent' supporting Vulcan. Does evidence recharge when the rival dies? Bayesianism says yes, if *P(E|~H)* drops; Severity says yes, if the new hypothesis passes a test the old one failed. Third, the 'engineered' objection is neutralised by the Entwurf failure. The anomaly was not merely fitted; it survived a constraint its predecessor broke.

  I argue that **Mayo's error statistics (severity)**, supplemented by **Garber's entailment**, best handles the episode. Pure Bayesianism falters on the auxiliaries and the counterfactual credence required to make old evidence 'new'. Ur-priors are too speculative for historical reconstruction. Use-novelty fails because it cannot explain why the perihelion advance was regarded as more confirmatory than the eclipse data. The perihelion result was old, yet it did more work.

  Severity explains this precisely. The perihelion anomaly was a **sharper test** than the eclipse. The eclipse data (1919) were messy, with discordant instruments and large error margins; they distinguished GR from Newtonian gravity qualitatively (bending vs. none/half), but with low precision. The perihelion advance was quantitatively precise (43″ vs. 0″ or 18″). It severely tested the specific field equations against live rivals (Newton, Vulcan, Entwurf). The fact that *E* was old matters less than that it was **discriminating**.

  Furthermore, the 'recharging' of evidence is naturally handled by severity. Vulcan died because it failed other tests (eclipse searches); GR succeeded where Vulcan and Newton failed. The evidence supports GR not because it is novel, but because GR alone survived a severe probe of the celestial mechanics framework. Garber's insight remains useful to model the *agent's* realisation in 1915—that the equations locked onto the value—but the *warrant* for confirmation lies in the severity of the test, not the temporal order of discovery.

  Your intuition is correct: the perihelion did more confirmatory work than the eclipse. This indicts use-novelty accounts which tie confirmation strictly to prediction timing. It suggests that **precision and discrimination** outweigh novelty. The literature often overlooks this because formalism favours clean temporal distinctions over messy quantitative comparisons. By prioritising severity, we respect the historical reality that physicists favoured the clean, old number over the messy, new photograph.
