          *   *Analysis:* Logicism traditionally aims for absolute certainty and foundationalism. If the foundation (logic) admits to rule-circularity (even if "harmless"), the strong foundationalist ambition of Logicism is weakened. Logicism usually wants to say "Math is certain because Logic is certain." If Logic relies on a rule we just *have* to use (constitutively) but can't justify non-circularly, the "certainty" changes flavor from "metaphysical guarantee" to "constitutive necessity."
