      *   (e) Induction Parity. *Potential Tension:* If induction is the same, does that undermine the special status of logic in (b) or (d)?
      *   (f) Pragmatism + (b) Constitutivism. *Potential Tension:* Constitutivism is often a normative claim about *what reasoning is*. Pragmatism is about *what we should do*. Do they clash?

  4.  **Deep Dive into Specific Pairings (The Audit):**

      *   **Tension 1: (a) vs. (b)**
          *   (a): "There's no non-circular way to justify MP... deduction rests on circularity."
