  ### The Leaves

  **Leaf 1: The Experience Moves The Body**
  (Consciousness is causally potent. You reject Physical Closure.)

  **Leaf 2: The Experience Is An Illusion**
  (There is no "what it's like." You reject Phenomenal Distinctness via Eliminativism.)

  **Leaf 3: The Experience Is The Brain**
  (Consciousness is not inert because it is identical to the causal brain state. You reject Phenomenal Distinctness via Identity.)

  **Leaf 4: We Cannot Know The Experience**
  (The skeptical sting. You accept Phenomenal Distinctness and Physical Closure, but reject Phenomenal Knowledge.)

  **Leaf 5: The Brain Scans The Experience**
  (Knowledge without causation. The brain tracks the experience via a non-physical relation.)

  **Leaf 6: The Statement Is The Experience**
  (Constitution. The report is not caused by the experience but constituted by it.)

  **Leaf 7: The Experience Is Directly Present**
  (Direct Acquaintance. Knowledge requires no mechanism.)

  **Leaf 8: The Connection Is Mystery**
  (Unexplained correlation. You accept Distinctness and Knowledge but deny all mechanisms.)

