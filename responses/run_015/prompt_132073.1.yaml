  ### The Logical Space

  Before presenting the tree, I have mapped the terrain. The problem you face arises from three claims that seem mutually inconsistent:
  1.  **Physical Closure:** Every physical event (like speaking) has a sufficient physical cause (neurons).
  2.  **Phenomenal Distinctness:** Conscious experience is something over and above the physical cause.
  3.  **Phenomenal Knowledge:** We know we have conscious experience and speak truthfully about it.

  If 1 and 2 are true, experience does not cause speech (Epiphenomenalism). If experience does not cause speech, how can 3 be true? The tree below forces a choice among these claims by using concrete scenarios rather than theoretical labels.

  ### The Decision Tree

  **Question 1: The Push**
  Imagine you say, "I smell rain." Consider the physical energy moving your vocal cords. Does the *smell itself* add any energy to that movement, or do the brain signals do all the work?
  *   **The smell adds energy:** Go to **Leaf 1**.
  *   **The brain signals do all the work:** Go to **Question 2**.

  **Question 2: The Shadow**
  If the brain signals do all the work, is the smell a separate thing riding on top of the signals, or is it just the signals themselves?
  *   **Just the signals:** Go to **Question 3**.
  *   **A separate thing:** Go to **Question 4**.

  **Question 3: The Mistake**
  If the smell is just the brain signals, is your belief that you have a private, inner smell a mistake?
  *   **Yes, it is a mistake:** Go to **Leaf 2**.
  *   **No, it is real (it is the signal):** Go to **Leaf 3**.

  **Question 4: The Coincidence**
  If the smell is a separate thing that adds no energy, is your statement "I smell rain" just a lucky accident?
  *   **Yes, a lucky accident:** Go to **Leaf 4**.
  *   **No, not luck:** Go to **Question 5**.

  **Question 5: The Mirror**
  If it is not luck, does your brain detect the smell like a camera detects a tree?
  *   **Yes, it detects it:** Go to **Leaf 5**.
  *   **No, it does not detect it:** Go to **Question 6**.

  **Question 6: The Clay**
  If it does not detect it, is the act of speaking made out of the smell itself, like a statue is made of clay?
  *   **Yes, made of it:** Go to **Leaf 6**.
  *   **No, not made of it:** Go to **Question 7**.

  **Question 7: The Light**
  If not made of it, is the smell known simply because it is present to you, without any link connecting it to your speech?
  *   **Yes, simply present:** Go to **Leaf 7**.
  *   **No:** Go to **Leaf 8**.

