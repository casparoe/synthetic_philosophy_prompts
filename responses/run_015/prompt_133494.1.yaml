      *   *Refined Decision:* The most upstream question is the **Topological vs. Geometric** nature of the identity. Is an 'a' defined by connectivity/holes (topology) or by specific angles/curves (geometry)? This dictates whether "style" is a deformation (topology preserved) or a re-configuration (topology might shift, e.g., single-story 'a' vs. double-story 'a').
