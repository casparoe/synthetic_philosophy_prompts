          *   **Constraint:** A defended agenda for limited resources, *not* a survey or reading list.

  2.  **Analyze the Core Philosophical/Cognitive Problem:**
      *   The problem is *categorization under variation*.
      *   Hofstadter's *Letter Spirit* argues for a "grid" where letters are defined by qualitative roles (e.g., "ascender," "bowl," "crossbar") rather than pixel positions.
      *   The critique is that this is engineering, not cognition.
      *   The prompt asks to move beyond "style as ornament." This implies style *is* the substance of the letter's identity in context.
      *   The tension is between *essentialism* (invariant core) and *anti-essentialism* (family resemblance/Wittgenstein).
      *   The tension is also between *positive features* (what is there) and *negative space/topology* (what is *not* there, e.g., the hole in an 'a' vs. 'd').

