answer: |-
  Here is a defended research agenda for your interdisciplinary group. It is structured to maximize conceptual leverage within a three-year constraint, prioritizing questions that, if left unresolved, render subsequent modeling or experimentation category errors.

  ### Executive Summary: The Core Thesis
  Your group should operate under the working hypothesis that **letter identity is functional-relational, not purely geometric.** An "a" is an "a" not because it shares a specific shape with other "a"s, but because it occupies a specific contrastive slot within a writing system's ecology (distinguishing it from "d", "o", "u", etc.).

  Consequently, **style is not ornament; it is the specific geometric realization of that functional constraint.** This rejects the "skeleton + ornament" model. It implies that Hofstadter's *Letter Spirit* was correct to seek qualitative roles but likely incorrect to treat them as a rigid grid. The "grid" should be a topological graph of functional relations, not a coordinate system.

  ---

  ### Priority 1: The Ontology of the Glyph (Year 1)
  **Question:** Is the category "a" a visual natural kind, a functional slot, or a Wittgensteinian family resemblance with no underlying essence?
  **Focus:** Resolving the "Single-Story vs. Double-Story" Paradox.

  **The Inquiry:**
  The printed double-story "a" and the handwritten single-story "ɑ" are topologically distinct (one has a closed loop and a vertical stem; the other is often an open curve). They share almost no geometric overlap. Yet, they are the same letter.
  *   **Task:** Determine if "a" is a **homonym** (two distinct glyphs sharing a functional label) or a **single category** with discontinuous realization.
  *   **Method (Non-Empirical):**
      *   **Cross-Script Conceptual Analysis:** Compare the Latin "a" with the Greek "alpha" (α) and Cyrillic "a" (а). In some contexts, Greek alpha functions as Latin "a". Does the identity travel with the sound, the shape, or the historical lineage?
      *   **Phoneme Analogy:** Analyze how linguistics handles /t/ (which varies wildly by context) vs. how orthography handles "a". If orthography is more discrete than phonology, a "core essence" is more likely required.
  *   **Why Upstream?**
      *   If "a" is a **functional slot**, then "style" is the set of permissible geometric realizations that maintain contrast with "d" and "o". This makes **negative-space conditions** (the hole in the "a" vs. the "d") primary, because they are the mechanism of contrast.
      *   If "a" is a **visual natural kind**, then the single-story/double-story split implies the category is broken, and you are modeling two different objects.
      *   **Decision Point:** If you assume a "topological core" (Priority 2) without settling this, you will build a model that cannot account for the single-story "a", rendering your AI philosophically blind to actual usage.

  ### Priority 2: The Geometry of Variation (Year 2)
  **Question:** Is style a continuous deformation of an invariant core, or a traversal across a discrete cluster of prototypes?
  **Focus:** Continuous Manifold vs. Discrete Clusters.

  **The Inquiry:**
  Assuming Priority 1 establishes "a" as a functional slot, you must determine how the visual system traverses the space of valid "a"s.
  *   **Task:** Test the **Topological Invariance Hypothesis**. Can you morph any valid "a" into any other valid "a" without passing through a non-"a" (e.g., a "d" or "u")?
  *   **Method (Cognitive Science):**
      *   **Morphing Experiments:** Generate continuous video morphs between radically different "a" styles (e.g., Blackletter to Comic Sans). Ask subjects to identify the exact frame where "a-ness" breaks.
      *   **Negative-Space Validation:** Specifically test if the *absence* of a feature (e.g., the closure of the counter) is the breaking point.
  *   **Weighing Negative Space vs. Structural Deformation:**
      *   **Recommendation:** Prioritize **Structural Deformation** as the generative mechanism, but use **Negative Space** as the constraint.
      *   **Reasoning:** You cannot generate a hole (negative space) without generating a boundary (structure). A model that prioritizes negative space axioms (e.g., "must have one enclosed counter") fails on the single-story "a" (which often has no enclosed counter). A model that prioritizes structural relations (e.g., "curved stroke terminating in vertical stem") can account for both, provided the relations are abstract enough.
      *   **Upstream/Downstream:** This is downstream of Priority 1. If "a" is a functional slot, the "structure" is the set of relations that preserve legibility. If "a" is a visual kind, the "structure" is geometric. You need the ontology to define the geometry.

  ### Priority 3: Formal Representation (Year 3)
  **Question:** Is the "Letter Spirit" best captured as a Generative Grammar, a Prototype in Style-Space, or a Neural Manifold?
  **Focus:** Tractability vs. Psychological Reality.

  **The Inquiry:**
  Now you build the model.
  *   **Task:** Compare a **Rule-Based Grammar** (Hofstadter's approach: "if ascender, then...") vs. a **Prototype Vector** (an "a" is a point in high-dimensional space near other "a"s).
  *   **Method (AI/Conceptual Modeling):**
      *   Attempt to formalize the findings from Year 1 & 2.
      *   **The Trap:** Do not default to Deep Learning (CNNs/Transformers). They solve the engineering problem (recognizing "a") but obscure the philosophical insight ( *why* it is an "a").
      *   **The Goal:** A **Generative Graph Grammar**. Nodes are topological features (loops, stems, crossings); edges are spatial relations. Style is a weighting on the geometric realization of these nodes.
  *   **Why Last?**
      *   Formalization is downstream of ontology and geometry. If you formalize a "grammar" before knowing if the category is continuous or discrete (Priority 2), you will hard-code rules that break on edge cases.
      *   **Defense of Ranking:** A prototype model (statistical) is easier to build but explains less. A grammar model (symbolic) explains more but is harder to build. You only earn the right to build the grammar if Priority 1 & 2 confirm there *are* invariant structural relations to encode.

  ---

  ### Directions to Deprioritize
  To protect your limited resources, explicitly **deprioritize** the following:

  1.  **End-to-End Deep Learning for Generation:**
      *   *Reason:* While a GAN or VAE can generate novel "a"s, it treats the letter as a pixel distribution. It cannot answer *why* a specific deformation remains an "a". It solves the engineering critique of *Letter Spirit* by bypassing the philosophy entirely. This violates your group's mission.
  2.  **Strict Pixel-Based Geometric Invariance:**
      *   *Reason:* Do not waste time trying to find a "template" that aligns all "a"s via affine transformation. The single-story/double-story split proves this is impossible. This is a "dead end" empirical path.
  3.  **Isolated Letter Analysis:**
      *   *Reason:* Do not study "a" in isolation. As argued in Priority 1, identity is contrastive. Studying "a" without studying "d", "o", and "u" simultaneously ignores the negative-space constraints that define the category.

  ### Decisive Non-Empirical Reasoning
  Since you have only three years, you cannot rely solely on data. You need **conceptual leverage** to narrow the search space.

  *   **The "Counterfactual Stroke" Test:** Ask, "If I add a vertical stem to the right of this 'a', does it become a 'd'?" If the answer is yes, the identity is defined by **relational absence** (negative space). If the answer is no (it becomes a ligature or a new symbol), identity is defined by **structural closure**. This conceptual test guides the AI architecture more efficiently than training data.
  *   **Historical Lineage Analysis:** Trace the evolution of "a" from Phoenician Aleph to Modern Italic. If the identity persists through radical topological changes (e.g., the loop opens and closes over centuries), then **Functional Identity** (Priority 1) is vindicated over **Topological Core** (Priority 2). This historical argument can settle the "essence" debate without running a single human subject experiment.

  ### Summary of Defense
  This agenda prioritizes **Ontology → Geometry → Formalism**.
  1.  **Ontology:** If you don't know what an "a" *is* (function vs. shape), you can't model it.
  2.  **Geometry:** If you don't know if variation is continuous or discrete, you can't choose between Grammar (rules) and Prototype (statistics).
  3.  **Formalism:** Implementation is the final step of articulation, not discovery.

  By front-loading the philosophical and conceptual work, you avoid the common AI pitfall of building a sophisticated engine that generates "a"s but cannot explain why a specific variation fails. This ensures that if the project succeeds, it resolves the Hofstadter debate by showing that *Letter Spirit* was philosophically right (qualitative roles matter) but mathematically under-specified (the roles are functional/graph-based, not grid-based).
