  **Project Title:** Decoupling Badness: Pain Asymbolia and the Evaluative Structure of Suffering

  **Project Description:**
  This three-month research project investigates whether pain asymbolia undermines the thesis that pain is essentially bad. Patients with pain asymbolia report painful stimuli without exhibiting distress or avoidance behavior. The central question is precise: do asymbolic patients' sincere reports that pain "still hurts" indicate the retention of a thin phenomenal badness, or do they demonstrate that an evaluative concept has become detached from its normal motivational and affective scaffolding?

  Existing literature relies on a sensory-versus-affective taxonomy to explain these cases. This framework fails to settle the metaphysical status of pain's badness because both camps assume that either phenomenal quality or motivational force must carry the normative weight. Consequently, there is no conceptual room for a decoupled evaluative judgment that tracks the sensory state without being intrinsically aversive. This project moves beyond that dichotomy to explore the possibility of non-aversive evaluation.

  I propose an approach that distinguishes two rescue strategies for the intuition that asymbolic pain remains bad. The first, a phenomenal residue strategy, locates badness in a minimal hedonic tone that survives the decoupling of affect and sensation. The second, a counterfactual dependence strategy, grounds badness in what the patient would avoid if their full aversive architecture were intact. By isolating these strategies, the research will clarify whether "badness" refers to an intrinsic qualitative property or a relational disposition.

  Progress will be measured by demonstrating that these strategies either converge on the same phenomenological prediction or diverge in a way assessable through structured first-person report analysis. Ideally, this involves identifying specific linguistic markers in patient testimony that signal residual hedonic tone versus intellectualized evaluation. Conversely, failure will be defined as the distinction collapsing into mere verbal disagreement with no substantive philosophical payoff, rendering the debate linguistically contingent rather than metaphysically significant.

  **Scope and Feasibility:**
  Given the three-month constraint, this project is scoped for rigorous conceptual analysis and argument reconstruction rather than empirical data collection. This timeframe is sufficient to formulate the proposed distinction and draft protocols for distinguishing reports of residual hedonic tone from reports of intellectualized evaluation. However, it limits the ability to engage deeply with clinical datasets or conduct novel interviews. The project will therefore focus on laying the philosophical groundwork for future empirical collaboration, ensuring a high-quality theoretical deliverable without overpromising on clinical integration.
