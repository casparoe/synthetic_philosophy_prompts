answer: |-
  Your historical premises regarding Nuremberg are sound for the purposes of this analysis. The London Charter was indeed an agreement by the victors creating new law; the defence of superior orders was indeed limited to mitigation; and the Tribunal's reasoning on aggression did rely heavily on the Kellogg–Briand Pact, stretching a treaty renouncing war into a basis for individual criminal liability where none explicitly existed. You are also correct that neither Hart nor Fuller thematised the distinction between excuse and justification in the modern criminal-law sense.

  Here is the disciplined two-way analysis you requested, followed by an evaluation of your dissolution thesis.

  ### Part 1: Theory Applied to the Episode

  **1. The War Crimes Count: Superior Orders and the Soldier's Dilemma**
  You identify this as the "easy" case because the conduct violated pre-existing conventional laws of war. The jurisprudential friction point is the defendant's plea: "I was obeying the law of my state."

  *   **Hart's Position:** Hart would maintain that the Nazi enactments requiring these acts were *law* within the German system at the time. They satisfied the rule of recognition (enacted by the sovereign). Therefore, the soldier faced a genuine conflict: a legal duty to obey versus a moral duty to refrain. Hart would reject the idea that the Nazi law was "no law." Consequently, the Tribunal cannot say the soldier had *no legal duty*. Instead, the Tribunal must acknowledge that the new international order is displacing the old German order. The rejection of the superior-orders defence is not a discovery that the old law was void, but an assertion that the new law (the Charter) overrides it.
  *   **Fuller's Position:** Fuller would look to the "internal morality of law." If the Nazi regime had degenerated into a system of terror where secret decrees overrode published statutes, or where the "Führer's will" was the only rule, Fuller might argue the system had ceased to be a legal order. If it was not a legal order, the soldier owed it no fidelity. However, where specific statutes existed (as they often did for war crimes), Fuller's position is trickier. He would likely argue that a legal system cannot demand conduct that violates the very purpose of law (subjecting human conduct to rules). If the statute commanded a violation of the "morality of duty," the claim to legal authority collapses.
  *   **Excuse vs. Justification:** You are right that neither theorist uses these terms. However, their theories map onto them. Hart's view implies an **excuse** structure: "You had a legal duty, but we are punishing you because our new moral order overrides your old legal duty." Fuller's view implies a **justification** structure: "You had no true legal duty because the command lacked legal character." Hart preserves the validity of the old law to protect the concept of law; Fuller sacrifices the validity of the old law to protect the moral integrity of the adjudication.

  **2. The Crimes Against Peace Count: Retroactivity and Kellogg–Briand**
  This is the "hard" case, mirroring the Grudge Informer. The conduct was authorized by the German state, and the international prohibition existed only as a treaty without criminal sanctions.

  *   **Hart's Position:** Hart would insist on candour. The Kellogg–Briand Pact did not create individual criminal liability. Therefore, punishing the defendants for aggression is retroactive. Hart's solution (from the Informer debate) is to enact a retroactive statute that openly admits it is retroactive. The London Charter *was* this statute. Hart would approve of the Charter provided the Tribunal admitted it was creating new law. He would reject the Tribunal's rhetorical effort to claim the law "already existed" in international custom. For Hart, the cost of lying about the law (damaging the distinction between law and morality) is higher than the cost of admitting retroactivity.
  *   **Fuller's Position:** Fuller would argue that the Nazi aggression was part of a broader perversion of the legal form. If the Nazi state used law merely as a tool of policy without regard for generality or congruence, it forfeited the claim to be law. Thus, punishing the leaders is not retroactive because there was no valid legal order to protect. Alternatively, Fuller might argue that the *purpose* of the international legal order (peace) was so fundamental that violating it undermines the possibility of any legal system. He would prefer the Tribunal to say: "The Nazi acts were so antithetical to the enterprise of law that they cannot be shielded by legal positivism." He accepts the risk of distorting legal history to preserve the moral authority of the judgment.
  *   **Radbruch's Shadow:** Here, Gustav Radbruch's formula (law that is intolerably unjust is no law) is the bridge. Fuller is closer to Radbruch; Hart explicitly rejects him. At Nuremberg, the Tribunal effectively adopted a Radbruchian stance without naming it: asserting that certain principles were so fundamental they existed prior to the Charter. Hart would call this a "confused disguise" for retroactive legislation.

  ### Part 2: The Episode Turned Back on the Theory

  **1. The Silence on International Tribunals**
  You correctly suspect both theories are silent here. Hart and Fuller are theorizing about a *continuous* municipal legal system.
  *   **Hart's Strain:** Hart's concept of law relies on a rule of recognition accepted by officials. At Nuremberg, the "officials" (German judges) were gone or discredited, and the "sovereign" was an external occupying power. Hart's model struggles to explain why the *German* population should view the IMT as a legal authority rather than an act of force. He can explain it as a new sovereign imposing commands, but this reduces the Tribunal to a gunman situation writ large, stripping it of the normative "obligation" Hart usually tries to preserve.
  *   **Fuller's Strain:** Fuller's "fidelity to law" relies on reciprocity between government and citizen. At Nuremberg, there was no reciprocity. The defendants were enemies of the tribunal, not subjects. Fuller's theory of the "internal morality of law" describes how a government makes law for its subjects. It is ill-equipped to describe how victors make law for the vanquished. If the IMT was not a "legal system" in Fuller's sense (no ongoing relationship of fidelity), then his critique of positivism loses its footing.

  **2. The Asymmetry: Informer vs. Official**
  This is the most critical point for your essay. The Grudge Informer was a private citizen using the law as a weapon. The Nuremberg defendants were officials who *wielded* the law.
  *   **Impact on Fuller:** Fuller's theory works better for the Informer. The Informer exploited a valid system; the question is whether the system can cleanse itself. For Nuremberg, the defendants *were* the system. If Fuller says "Nazi law was no law," he implies the defendants were never officials, merely gang leaders. This creates a paradox: if they were not officials, they could not have committed "crimes against the peace" in an official capacity. Fuller risks de-legitimizing the very capacity required to commit the crime.
  *   **Impact on Hart:** Hart's theory fits Nuremberg better. He can say: "You were officials of a valid (though wicked) system. That system has now been defeated. We, the new sovereign, are punishing you for acts that were legal then but are criminal now." This acknowledges their official status while asserting the victor's right to legislate retroactively. Hart's separation of law and morals allows him to acknowledge the reality of the Nazi state without endorsing it.

  ### Part 3: Evaluating Your Dissolution Thesis

  Your thesis is that the debate is not conceptual but institutional: separate "Legality" (was it law?) from "Adjudication" (what should the court do?), and you find Hart and Fuller converge on the outcome (punishment) and differ only on the "cost" (candour vs. integrity).

  **Where your framing is strong:**
  You are correct that in a transition scenario (like 1945 Germany), the practical outcome is identical: the defendants are punished. Both theorists accept that the Nazi regime cannot be allowed to stand as a justification for atrocity. You are also right that the disagreement becomes empirical: Hart thinks admitting retroactivity damages legal certainty less than Fuller thinks lying about law damages legal morality. Nuremberg supports your view that the "Fuller style" justification (claiming the law already existed) was politically functional. West Germany reintegrated into the legal order precisely because the Allies insisted the Nazis had violated *universal* law, not just Allied policy. This suggests Fuller's "expressive weight" argument has empirical merit.

  **Where your framing is confused:**
  You claim the distinction between Legality and Adjudication "relocates the disagreement somewhere it is harder to see." I argue it does not relocate it; it **dissolves** it too much. The disagreement is not just about "costs"; it is about the **source of judicial authority**.

  1.  **The Conceptual Stakes Remain:** For Hart, the judge's authority comes from the rule of recognition. If the rule of recognition says the Nazi statutes were valid, the judge has no authority to ignore them without a new rule (retroactive statute). For Fuller, the judge's authority comes from the moral purpose of the legal enterprise. If the enterprise was corrupted, the judge has the authority to declare the statutes void *ab initio*. This is not a difference in "institutional cost"; it is a difference in what gives a judge the power to punish. If you follow Hart, a judge who punishes without a retroactive statute is acting *ultra vires* (beyond power). If you follow Fuller, that same judge is fulfilling their role. This is a conceptual divergence, not just a pragmatic one.
  2.  **The "Convergence" is Illusory:** They do not converge on the outcome if you consider the long-term precedent. Hart's approach sets a precedent that sovereigns can punish retroactively if they are candid. Fuller's approach sets a precedent that judges can invalidate past law based on moral evaluation. These are radically different institutional powers. Nuremberg actually did both: it used a Charter (Hart) but justified it with natural law reasoning (Fuller). The fact that they mixed methods suggests the theories are not mutually exclusive in practice, but that doesn't mean the theorists agree.
  3.  **The Asymmetry Undermines the Dissolution:** Because Nuremberg involves officials, not private informers, the "Legality" question is harder to separate from the "Adjudication" question. If the defendants made the law, asking "Was it law?" is the same as asking "Was the regime legitimate?" Hart says "Yes, it was a regime." Fuller says "No, it was a perversion." This is not a disagreement about how fragile a legal order is; it is a disagreement about whether a criminal state can exist. Hart says yes; Fuller says no (or that it loses its legal character).

  **Conclusion on your Thesis:**
  Your attempt to dissolve the argument into an institutional choice is sophisticated and captures the *pragmatic* reality of the Nuremberg judgment. However, it understates the *normative* disagreement. Hart and Fuller do not just disagree on which lie is more useful; they disagree on whether a judge is permitted to lie at all. Hart says: "Do not lie; pass a new law." Fuller says: "Do not validate evil; interpret the old law to exclude it."

  Nuremberg suggests that in extreme transitions, the "Legality" question is subordinate to the political necessity of the "Adjudication." But this does not prove Hart and Fuller agree. It proves that in 1945, the Tribunal prioritized political legitimacy over jurisprudential consistency. Your framing works best if you argue that the Hart-Fuller debate is a debate for *normal* legal times, and Nuremberg proves that in *abnormal* times, the distinction collapses. But do not claim they converge on principle. They converge on the bodies of the defendants, but for mutually exclusive reasons.

  **Final Correction:**
  You asked if you have made the positions more alike than they really are. **Yes.** You have treated their disagreement as one of "tactics" (how to justify punishment) rather than "authority" (where the right to punish comes from). Hart grounds authority in social facts (the rule of recognition); Fuller grounds it in moral purpose (fidelity to the enterprise of law). In Nuremberg, the social fact was the victors' power; the moral purpose was universal justice. The Tribunal used the former to enact the latter. Hart would accept this sequence; Fuller would want to reverse it (the moral purpose validates the power). That is a conceptual chasm, not just an institutional one.
