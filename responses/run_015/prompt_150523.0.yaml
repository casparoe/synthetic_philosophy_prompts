  3. "Definition, with boundary cases"
  I define **The Granularity Penalty** as follows: A scoring scenario exhibits the Granularity Penalty when (1) a forecaster's credence function is perfectly calibrated to the truth distribution; (2) the question partition is refined (cells split) without new information arriving; (3) the forecaster's probabilities are distributed over new cells consistent with the coarse prior (e.g., splitting evenly or according to a fixed ratio); and (4) the expected proper score worsens solely due to the partition change. This excludes cases where the forecaster gains information, which should improve scores, or changes their credences arbitrarily. A boundary case: Comparing a binary forecast (Rain/No Rain) to a ternary one (Heavy/Light/No Rain) where the forecaster lacks evidence to distinguish Heavy vs. Light. If they split evenly, their expected score worsens despite knowing no less about the world. This is the Penalty. If they refuse to split (assign 0 to one), they risk miscalibration. The penalty arises from the geometry of the score, not the agent's error. It marks the cost of being forced to speak more precisely than evidence allows. A non-case: If the forecaster gains specific evidence distinguishing Heavy from Light, their score should improve; this is information gain, not the penalty. The penalty applies only when the *question* changes, not the *state of knowledge*. This distinction is crucial for isolating the structural effect from epistemic progress.

