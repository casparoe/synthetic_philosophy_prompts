  This pattern generalizes beyond Brier scores. The **Logarithmic Score** suffers identically: the expected score of a perfect forecaster is the Shannon Entropy of the partition, which strictly increases with refinement. Thus, "information gain" measures are needed to compare across partitions. For **full belief**, this mirrors the **Triviality Problem**: if accuracy counts true beliefs, believing tautologies maximizes accuracy. We avoid this by valuing informativeness, but proper scores implicitly trade off informativeness against risk. Regarding **probabilism**, Joyce's dominance argument holds *within* a partition: no non-probabilistic credence dominates a probabilistic one. However, the Granularity Penalty shows that dominance does not hold *across* partitions; a probabilistic agent on a fine grid can be "less accurate" than one on a coarse grid. This suggests probabilism is relative to an algebra, not absolute. The trade-off is between **accuracy** (matching truth) and **specificity** (finer grains). Proper scores measure the former but penalize the latter without adjustment. To compare across grains, one must measure **epistemic utility** as accuracy minus a cost for uncertainty, or use normalized skill scores. This connects to **verisimilitude**, where closeness to truth matters more than binary hit/miss, yet even verisimilitude measures often depend on the chosen language.

