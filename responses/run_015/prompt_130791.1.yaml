  **The Case: The Housing Lottery and the Hot Box**

  **The Setup**
  A city housing authority allocates 10 subsidized apartments to 100 eligible applicants using a Hardware Random Number Generator (HRNG). The process is atomic: once initiated, it cannot be paused or queried. For Applicant #402, the objective physical chance of allocation is exactly 10% (1 in 10). This is not a frequency; it is the certified propensity of the HRNG mechanism, verified by NIST. The decision-maker is a junior clerk who must decide whether to pre-clean Unit 7B (cost: $500 in labor) before the result is announced. If #402 wins and the unit is clean, the city saves $2,000 in turnaround delay costs. If #402 loses and the unit is clean, the $500 is wasted. The authority hands the clerk a docket stamped "Probability: 0.10." This number is the true objective chance at the moment of the decision. However, the senior desk officer has a thermal camera pointed at the HRNG. The box has a known, unfixable flaw: it emits a specific heat signature 50 milliseconds before generating a "win" signal. This signature is not part of the chance mechanism's definition; it is a physical side-channel. The thermal readout is currently positive. The desk officer advises the clerk to clean the unit. The clerk cannot request a new probability number; the system locks upon initiation.

  **The Admissibility Clause**
  We are working with David Lewis's Principal Principle: *Your credence in A, conditional on the chance of A being x, should be x, provided your evidence is admissible.*
  Evidence is **admissible** if it contains no information about the future outcome other than what is conveyed by the chance value itself. Evidence is **inadmissible** if it "cracks the black box"—giving you a peek at the realization of the chance without changing the chance parameter itself.

  **The Credences and The Bets**
  *   **Policy 1 (Defer to Chance):** The clerk treats the 0.10 as binding.
      *   Credence in Win = 0.10.
      *   Expected Value of Cleaning = $(0.10 \times \$2,000) - (0.90 \times \$500) = \$200 - \$450 = -\$250$.
      *   **Decision:** Do not clean.
  *   **Policy 2 (Defer to Desk):** The clerk treats the thermal signal as decisive evidence.
      *   The thermal signal correlates with a win 90% of the time (sensitivity/specificity established by maintenance logs).
      *   Credence in Win = 0.90.
      *   Expected Value of Cleaning = $(0.90 \times \$2,000) - (0.10 \times \$500) = \$1,800 - \$50 = +\$1,750$.
      *   **Decision:** Clean.

  **The Outcome**
  The HRNG generates a win. The unit was cleaned (Policy 2). The city saves the $2,000 delay cost. Policy 1 would have incurred the delay cost. The Desk wins.

  **Why the Desk Wins (Despite the True Chance)**
  The 0.10 number *was* the objective chance of the HRNG mechanism. It was not a lie, a frequency, or a stale forecast. However, the Principal Principle only mandates matching your credence to the chance when your evidence is *admissible*. The thermal signal is **inadmissible evidence**. It provides information about the *outcome* (the future fact of the allocation) that bypasses the *chance parameter* (the 10% propensity). The chance function says, "Given the setup, wins happen 10% of the time." The thermal camera says, "Given this specific micro-state of the setup *right now*, a win is happening." The desk's edge is not **calibration** (both are well-calibrated in their respective domains) or **resolution** (the desk is sharper). The edge is **access to inadmissible information**. The desk is effectively seeing a sliver of the future that the chance function, by definition, averages over.

  **The Single Feature Opening the Gap**
  The gap exists solely because of the **Side-Channel Correlation**. The HRNG's physical state (heat) correlates with the outcome *independently* of the defined chance function.
  *   **Delete the Feature:** If the HRNG is perfectly insulated (no heat leak), the thermal camera reads noise. The desk's credence reverts to 0.10. The Principal Principle holds. Blind deference to the 0.10 becomes the rational move. The case collapses into boring, correct deference.

  **The Strongest Reply**
  A defender of chance-deference will argue: "If the thermal signal makes the win 90% likely, then the *true objective chance* was never 10%. It was 90% conditional on the heat. The authority handed you a false number."
  *   **Is this just "That's what inadmissible means"?** No, it's a substantive claim about the metaphysics of chance. It asserts that *all* physical facts (including heat) must be folded into the chance function.
  *   **The Rebuttal:** The authority's number is the chance *of the mechanism as certified*. In institutional contexts, "chance" is often a fixed parameter of the *system*, not a fluid reflection of every micro-state. If we define chance as "propensity of the certified setup," the 10% is true. If we define it as "propensity given all current physical facts," the 10% is false. The prompt stipulates the number *is* the objective chance. We must therefore accept the "certified setup" definition. Under this definition, the thermal data is inadmissible because it references facts (micro-state heat) excluded from the chance definition.

  **Conclusion: The Bumper-Sticker vs. The Careful Principle**
  The **Bumper-Sticker Principal Principle** ("If they give you a chance, believe it") gets burned. It fails because it ignores the admissibility clause.
  The **Careful Principal Principle** ("If they give you a chance, believe it, *unless you have inadmissible evidence*") survives.
  This case shows that institutional probabilities are often **system propensities**, not **token propensities**. They describe the box, not the specific tick of the clock inside it. When you have a sensor on the clock, defer to the sensor. The lesson for your column is not that probabilities are useless, but that they are **context-bound**. A risk score is the truth about the model, not necessarily the truth about the world the model is trying to capture, especially when the world leaks information the model ignores. Deferring is right when you are inside the model's epistemic bubble. It is a trap when you have a window looking out.
