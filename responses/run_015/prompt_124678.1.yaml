prompt: |-
  Two people at my rationality meetup got into it for like an hour last night over this and I gave up trying to referee, so I'm outsourcing. We've all read more LessWrong than is probaly good for us, which is context for why anyone thought this was worth arguing about.

  Marcus — another guy in the group, not one of the two fighting — wants to run a real-money thing at the next meetup. Everyone fills out a 200-question values-and-politics quiz; he pairs each person with their nearest neighbor in answer-space (he says the typical top match is around 85% agreement, and nobody's partner is a stranger). Then everyone plays a one-shot anonymous prisoner's dilemma against their partner, for actual cash: both cooperate, $30 each; both defect, $10 each; you defect while your partner cooperates, you get $50 and she gets $0, and vice versa. He also floated a second variant for the same 40 people: a $4000 pot that gets paid out to a single claimer, but only if exactly one person claims it by noon. Zero claimers or two or more, nobody gets anything.

  The argument was about what the correct play is and why:

  (1) Jonas: cooperate. Forget the fancy version for a second — even on the dumb, purely statistical version, with these payoffs cooperating pays iff the probability your partner makes the same move you do is above 5/7, i.e. about 71%. An 85% match clears that. But the real point is that the correlation that matters is logical, not statistical: the argument for cooperating with a copy of yourself isn't "copies tend to do the same thing," it's that there's one decision procedure being run twice. And you can't coherently hope to be the unique defector — if defecting is right for you it's right for her.

  (2) Rae: the 85% is agreement on a quiz, not probability of matching moves. You've swapped in a different quantity. What you actually need is P(she cooperates | I cooperate), and a values quiz doesn't hand you that. What drives one-shot PD cooperation is whether someone has accepted a particular argument about it, and quiz similarity barely touches that. Worse, shared exposure to an argument doesn't even reliably push people the same way: if a third of the room thinks superrationality is obviously right, a third thinks it's obviously a sucker move, and a third has never heard of it, "she reads the same blogs I do" moves P(match) almost not at all. And "you can't hope to be the unique defector" is only a coherence constraint at perfect correlation; at 85% the branch where you defect and she cooperates is a real branch, and it's the $50 branch.

  (3) Jonas: two things. The base-rate worry is weak because partners aren't random draws — nearest-neighbor matching out of 40 selects hard, so the population base rate for one-shot PDs isn't the relevant prior. And "you can't have 85% of a copy" is too quick: the threshold calculation shows superrationality doesn't need identity, it needs the match probability above 5/7, so it degrades continuously rather than dying the instant you perturb the setup. Also, look at Marcus's second variant. Nobody in that room thinks "I should be the unique claimer" is a reason to claim. The superrational move there is to randomize — press with probability 1/40 — which gives roughly a 37% chance that anybody gets anything, about $37 in expectation per person. But even that is bad next to conditioning on a public signal: everyone agrees in advance that the claimer is whoever's badge number equals tomorrow's high temperature in Central Park mod 40, and you collect the whole $4000 for sure, $100 expected each. That's the real lesson — superrationality isn't about reasoning your way into your partner's head, it's about latching onto a shared signal so you land on a correlated equilibrium. The survey-match pairing is that kind of shared signal. So cooperate.

  (4) Rae: the temperature scheme only works if it's common knowledge that everyone follows it, and with 40 semi-anonymous people in a group chat it isn't; if you think even two people will freelance, your own best move changes, and the whole thing unravels. And it's worse than that: the scheme has no teeth, because a non-selected person who spoils loses nothing personally — the pot dies for everyone else, but she was getting $0 either way. So it's only weakly incentive compatible, and if there's any chance the selected person flakes, everyone has a reason to claim as a backup and you're back to two-or-more. Anyway the variant-2 move is a different animal from variant 1. Agreeing in advance to a rule that picks one winner is a coordination device. What's at issue in the PD is which decision theory is correct. If I can bind myself to a rule in the PD case I'd just bind myself to cooperate — that's precommitment, not superrationality, so your analogy smuggles in enforcement and then credits the enforcement to the decision theory.

  (5) Jonas: fine, grant all that. You still have to pick a move, and "cooperate" is what you'd want everyone in your epistemic position to do, and not being certain she does it doesn't make defecting any less of an attempt to be the unique defector.

  (6) Rae: that last bit just restates what's under dispute. "What you'd want everyone in your position to do" is universalizability with a decision-theory costume on, and it only spits out cooperation because the game is symmetric — in a PD where the two players' payoffs differ slightly, superrationality gives no answer at all, which is odd for something claiming to be the right decision theory.

  Can you go through this move by move and tell me who's right about what — which specific points land, which are confused or question-begging, and whether the numbers anyone threw out (the 5/7, the 37%, the $100) actually check out? Also say what both of them are missing, if anything. Don't just tell me who wins overall.
reasoning: |-
  Here's a thinking process that leads to the analysis:

  1.  **Deconstruct the Request:**
      *   **Context:** A rationality meetup (LessWrong-adjacent culture). Two people (Jonas and Rae) argued about a proposed game setup by a third person (Marcus).
      *   **The Setup:**
          *   Variant 1: 40 people, paired by similarity on a 200-question quiz (approx. 85% agreement). One-shot Anonymous Prisoner's Dilemma (PD) for real money. Payoffs: CC=$30, DD=$10, DC=$50/0, CD=$0/50.
          *   Variant 2: $4000 pot. Paid to exactly one claimer. 0 or 2+ claimers = $0 for everyone.
      *   **The Task:** Analyze the argument move-by-move (1 through 6). Determine who is right about specific points, check the math (5/7, 37%, $100), identify confusion/question-begging, and identify what both are missing. Do not just declare a winner.

  2.  **Analyze the Game Theory & Math:**

      *   **Variant 1 (Prisoner's Dilemma):**
          *   Payoffs: $T=50$ (Temptation), $R=30$ (Reward), $P=10$ (Punishment), $S=0$ (Sucker).
          *   Standard Nash Equilibrium: Defect (dominant strategy).
          *   Superrationality/Timeless Decision Theory (TDT) / Functional Decision Theory (FDT) logic: Cooperate if $P(\text{partner cooperates} | \text{I cooperate}) \times R + P(\text{partner defects} | \text{I cooperate}) \times S > P(\text{partner cooperates} | \text{I defect}) \times T + P(\text{partner defects} | \text{I defect}) \times P$.
          *   Simplified correlation logic (Jonas's 5/7 claim):
              *   Let $p$ be the probability the partner does the *same* thing as me.
              *   Expected Utility (Cooperate) = $p(30) + (1-p)(0) = 30p$.
              *   Expected Utility (Defect) = $p(10) + (1-p)(50) = 10p + 50 - 50p = 50 - 40p$.
              *   Cooperate > Defect iff $30p > 50 - 40p \Rightarrow 70p > 50 \Rightarrow p > 5/7$.
              *   $5/7 \approx 0.714$.
              *   Jonas claims 85% match clears this.
          *   *Critique of the Math:* This math assumes $P(\text{same}) = P(C|C) = P(D|D)$. It assumes symmetry in correlation. It also treats the correlation as causal/functional (if I decide C, she decides C) rather than evidential.
          *   *Critique of the 85%:* The 85% is quiz agreement, not behavioral correlation in a PD. This is Rae's main point.

      *   **Variant 2 (The $4000 Pot):**
          *   Game: "Volunteer's Dilemma" or "Unique Claimer" game.
          *   Nash Equilibrium (Mixed): Everyone claims with probability $p$.
          *   Condition for indifference: Expected payoff of claiming = Expected payoff of not claiming.
          *   Payoff(Claim) = $4000 \times P(\text{no one else claims})$.
          *   Payoff(Not Claim) = $0$ (since you get nothing if you don't claim, regardless of others).
          *   Wait, if Payoff(Not Claim) is always 0, then Claim is dominant *unless* you care about others. But in standard selfish game theory, if you don't claim, you get 0. If you claim, you have a chance at 4000. So everyone claims. Pot dies.
          *   *Correction:* Usually, in these "unique claimer" games, there's a cost to claiming or the payoff structure implies coordination. Here, the prompt says "$4000 pot that gets paid out to a single claimer... Zero claimers or two or more, nobody gets anything."
          *   If I don't claim, I get $0$. If I claim, I get $4000$ if no one else claims, $0$ otherwise. Since $0 \ge 0$, claiming is weakly dominant. Everyone claims. Everyone gets 0.
          *   *Jonas's Randomization:* He suggests randomizing with $p = 1/40$.
          *   Probability exactly one person claims: $40 \times (1/40) \times (39/40)^{39}$.
          *   $(39/40)^{39} \approx (1 - 1/40)^{40 \times (39/40)} \approx e^{-0.975} \approx 0.377$.
          *   So prob $\approx 1 \times 0.377 = 37.7\%$.
          *   Expected Value per person: $0.377 \times 4000 / 40 \approx 37.7$. Jonas says $37. Math checks out roughly.
          *   *Jonas's Coordination Scheme:* Use badge number = Temp mod 40.
          *   If everyone follows this, exactly one person claims. Payoff $4000$. EV per person = $4000/40 = 100$.
          *   Math checks out.
          *   *Rae's Critique:* Incentive compatibility. The selected person has an incentive to claim. The non-selected persons have an incentive to claim *if* they think the selected person might not. If I am not selected, my payoff for claiming is $>0$ (if selected person doesn't claim). My payoff for not claiming is $0$. So I should claim as insurance. This unravels.

  3.  **Analyze the Arguments Move-by-Move:**

      *   **(1) Jonas:**
          *   *Claim:* Cooperate if $P(\text{match}) > 5/7$. 85% > 71%.
          *   *Claim:* Logical correlation (TDT/FDT style). "One decision procedure."
          *   *Assessment:* The math ($5/7$) is correct *for the specific model of correlation he is using* (symmetric probability of matching). The application to the quiz (85%) is the weak link. The "one decision procedure" is standard TDT/FDT rhetoric but assumes the quiz ensures identical decision algorithms, which is a huge leap.
      *   **(2) Rae:**
          *   *Claim:* Quiz agreement $\neq$ Move correlation.
          *   *Claim:* Shared exposure to arguments (LW) doesn't guarantee agreement on the conclusion (C vs D).
          *   *Claim:* "Can't be unique defector" only holds at perfect correlation. At 85%, the $50 branch exists.
          *   *Assessment:* Strong point on the quiz vs. behavior gap. Strong point on the LW community split on TDT vs CDT. The "unique defector" point is a bit nuanced: TDT says you influence the probability, not that the branch doesn't exist. But Rae is right that if correlation isn't high enough, EV favors defecting.
      *   **(3) Jonas:**
          *   *Claim:* Nearest-neighbor matching improves base rates.
          *   *Claim:* Superrationality degrades continuously (matches the 5/7 math).
          *   *Claim:* Variant 2 analogy. Randomization ($p=1/N$) vs. Correlated Equilibrium (Temp signal).
          *   *Assessment:* Matching does help base rates, but doesn't solve the "quiz != PD move" problem. The continuous degradation math is sound *if* correlation holds. The Variant 2 analogy is interesting but Rae is about to pounce on the enforcement issue. The $37% and $100 math is correct.
      *   **(4) Rae:**
          *   *Claim:* Temp scheme lacks common knowledge/enforcement.
          *   *Claim:* Scheme is not incentive compatible (non-selected have incentive to spoil/backup claim).
          *   *Claim:* Variant 1 is about Decision Theory, Variant 2 is about Coordination/Precommitment.
          *   *Assessment:* Very strong on the incentive compatibility of Variant 2. Without enforcement, the "Temp mod 40" scheme is not a Nash Equilibrium. If I know I'm not the chosen one, I gain nothing by not claiming (0 vs 0), but might gain if the chosen one flakes. Actually, strictly speaking, if I'm not chosen, Claiming gives me a chance at $4000$ (if chosen one doesn't claim). Not Claiming gives $0$. So Claiming is dominant for non-chosen people too. The scheme collapses without external enforcement.
          *   *Claim:* Variant 1 is Decision Theory. Correct.
      *   **(5) Jonas:**
          *   *Claim:* "What you'd want everyone in your epistemic position to do." (Universalizability/Kantian/TDT).
          *   *Claim:* Defecting is attempting to be the unique defector.
          *   *Assessment:* This is pure TDT/FDT justification. It's coherent within that framework but begs the question against CDT/Evidentialists who deny the subjunctive dependence.
      *   **(6) Rae:**
          *   *Claim:* "Universalizability with a costume."
          *   *Claim:* Asymmetric payoffs break Superrationality.
          *   *Assessment:* Good philosophical pushback. Superrationality (Hofstadter style) does struggle with asymmetric games unless modified (like Nash Bargaining Solution). TDT/FDT handle asymmetry better by maximizing expected utility given the correlation, but Rae's point highlights that "do what you want everyone to do" is vague when payoffs differ.

  4.  **Synthesize the "Missing" Elements:**
      *   **The Quiz Validity:** Neither truly addresses *how* predictive the quiz is. 200 questions on values/politics might predict *trustworthiness* or *tribal signaling*, but does it predict *adherence to TDT*? Probably not. In fact, LWers who know TDT might defect *because* they know others will cooperate (predatory TDT? No, TDT says cooperate). But CDTers will defect. If the quiz separates CDTers from TDTers, matching puts TDT with TDT (Cooperate) and CDT with CDT (Defect).
      *   **The "Anonymous" Constraint:** If it's truly anonymous, can they signal? No.
      *   **The Money:** Real money changes things (risk aversion, though amounts are small).
      *   **Variant 2 Mechanics:** Jonas treats Variant 2 as a coordination problem solvable by focal points. Rae treats it as a game theory problem solvable by Nash Equilibria. Rae is right that without enforcement, the focal point isn't stable.
      *   **Decision Theory Consensus:** There is no consensus in the rationalist community on TDT/FDT vs CDT. Jonas assumes TDT is "correct." Rae assumes it's contested. Rae is empirically right about the community split.

  5.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the context (LW rationality culture).
      *   **Move-by-Move Analysis:**
          *   (1) Jonas: Math is right ($5/7$), application is wrong (Quiz $\neq$ Move). TDT logic is internally consistent but assumes premises not in evidence.
          *   (2) Rae: Strongest empirical point (Quiz $\neq$ Move). Correct about the community split on TDT.
          *   (3) Jonas: Math on Variant 2 is right ($37\%$, $100$). Analogy is weak because Variant 2 lacks enforcement.
          *   (4) Rae: Devastating critique of Variant 2 scheme (Incentive Compatibility). Correct distinction between Coordination and Decision Theory.
          *   (5) Jonas: Restates TDT axiom. Question-begging against CDT.
          *   (6) Rae: Good philosophical check on Universalizability in asymmetric games.
      *   **The Math Check:** Explicitly verify 5/7, 37%, $100.
      *   **What They Miss:**
          *   **Selection Effect:** Matching by quiz might pair CDTers together and TDTers together.
          *   **Common Knowledge:** The argument itself destroys the "logical correlation." If everyone hears this argument, they know there is disagreement.
          *   **Variant 2 Stability:** The focal point solution requires *binding* commitment, not just agreement.
      *   **Verdict:** Rae wins on the empirical/institutional facts (Quiz validity, Incentive Compatibility). Jonas wins on the internal consistency of TDT *if* premises are granted. But since premises aren't granted, Rae is more practically right.

  6.  **Refining the Math:**
      *   **5/7:** $30p > 10p + 50(1-p) \rightarrow 20p > 50 - 50p \rightarrow 70p > 50 \rightarrow p > 5/7$. Correct.
      *   **Variant 2 Randomization:** $N=40, p=1/40$. Prob(exactly 1) = $\binom{40}{1} (1/40)^1 (39/40)^{39} = 40 \cdot \frac{1}{40} \cdot (0.975)^{39} \approx 0.373$. Jonas said 37%. Close enough. EV = $0.373 \times 4000 / 40 = 37.3$. Jonas said $37. Correct.
      *   **Variant 2 Coordination:** $4000 / 40 = 100$. Correct.

  7.  **Refining the Decision Theory:**
      *   Jonas is arguing from TDT/FDT.
      *   Rae is arguing from CDT (Causal Decision Theory) + Evidential skepticism.
      *   The core conflict: Does my decision *cause* (or logically determine) my partner's decision?
      *   Jonas says yes (via similarity). Rae says no (via quiz fallibility + community split).
      *   Rae is right that "85% quiz match" is not "85% algorithmic identity."

  8.  **Final Polish:** Ensure tone is neutral and analytical. Avoid taking sides personally, but evaluate the arguments. Highlight that Jonas is theoretically consistent but empirically optimistic, while Rae is empirically grounded but perhaps theoretically conservative.

      *Self-Correction on Variant 2:* Wait, if the rule is "Badge = Temp Mod 40", and I am *not* the chosen one.
      *   If I follow the rule: I don't claim. Payoff = 0 (unless chosen one claims).
      *   If I break the rule: I claim. Payoff = 4000 (if chosen one doesn't claim).
      *   Since Payoff(Break) $\ge$ Payoff(Follow), and strictly greater if there's doubt about the chosen one, the rule is not a Nash Equilibrium. Rae is absolutely right here. Jonas is proposing a Schelling Point without solving the incentive problem.

      *Self-Correction on Variant 1:* If the pairing is "Nearest Neighbor in Answer Space," does that correlate with Decision Theory?
      *   If the quiz asks "Is it rational to cooperate in a one-shot PD?", then yes.
      *   If the quiz asks "Do you support higher taxes?", then no.
      *   Jonas assumes the former (or that values imply DT). Rae assumes the latter (values $\neq$ DT). Rae is more likely right in a general context, but in a LW meetup, values might correlate with DT exposure. However, Rae's point about the split (1/3 TDT, 1/3 CDT, 1/3 naive) is very plausible for LW meetups.

      *Structure:*
      1.  Math Check.
      2.  Move-by-Move Breakdown.
      3.  The Core Disagreement (DT).
      4.  What Both Missed.
      5.  Summary.

      *Let's write it.*
answer: |-
  This is a classic "rationalist house divided" argument. It pits **Functional Decision Theory (FDT)/Timeless Decision Theory (TDT)** intuitions against **Causal Decision Theory (CDT)** and empirical skepticism.

  Here is the move-by-move breakdown, the math check, and an assessment of what both sides are missing.

  ### The Math Check

  Before analyzing the arguments, let's verify the numbers they threw out.

  *   **Jonas's 5/7 Threshold (Move 1):**
      *   Payoffs: Cooperate/Cooperate = $30; Defect/Defect = $10; Defect/Cooperate = $50; Cooperate/Defect = $0.
      *   Let $p$ be the probability your partner matches your move.
      *   $EU(\text{Cooperate}) = p(30) + (1-p)(0) = 30p$.
      *   $EU(\text{Defect}) = p(10) + (1-p)(50) = 50 - 40p$.
      *   Cooperate > Defect $\iff 30p > 50 - 40p \iff 70p > 50 \iff p > 5/7$.
      *   $5/7 \approx 71.4\%$.
      *   **Verdict:** **Correct.** This is the standard break-even point for symmetric correlation in this specific payoff matrix.

  *   **Jonas's Variant 2 Numbers (Move 3):**
      *   *Randomization:* 40 people, each claims with $p=1/40$.
      *   Probability exactly one person claims: $\binom{40}{1} (1/40)^1 (39/40)^{39} = (39/40)^{39} \approx 0.373$.
      *   Jonas says "roughly 37%." **Correct.**
      *   Expected Value per person: $0.373 \times \$4000 / 40 \text{ people} \approx \$37.30$. Jonas says "$37." **Correct.**
      *   *Coordination:* One person claims $4000. EV per person = $\$4000 / 40 = \$100$. **Correct.**

  ---

  ### Move-by-Move Analysis

  #### (1) Jonas: The TDT Opening
  *   **The Claim:** You should cooperate if match probability > 71%. Quiz match is 85%. Therefore cooperate. Also, logical correlation matters more than statistical.
  *   **Assessment:** **Theoretically consistent, empirically weak.**
      *   The math holds *if* $p$ represents the probability of matching moves.
      *   The leap from "85% quiz agreement" to "85% move correlation" is the weak link. Jonas is treating the quiz as a proxy for "running the same decision algorithm." In a room of LessWrong readers, decision algorithms (CDT vs. TDT) vary wildly regardless of political values.
      *   The "one decision procedure" argument is pure TDT. It is coherent within that framework but assumes the partner is sufficiently similar *in decision theory*, not just in values.

  #### (2) Rae: The Empirical Pushback
  *   **The Claim:** Quiz agreement $\neq$ move correlation. The community is split on decision theory (1/3 TDT, 1/3 CDT, 1/3 naive). Therefore, correlation is likely below 71%.
  *   **Assessment:** **Strongest point of the debate.**
      *   Rae correctly identifies the category error. Agreeing on tax policy does not imply agreeing on Newcomb's Problem.
      *   Rae is also empirically right about the rationalist community. There is no consensus that TDT is "obviously right." Many rationalists are proud CDTers. If Jonas is a TDTer and gets paired with a CDTer, the CDTer defects (dominant strategy), and Jonas gets $0.
      *   The "unique defector" rebuttal is slightly imprecise (TDT doesn't say the branch doesn't exist, it says you can't *choose* that branch independently), but the core point stands: at <71% correlation, CDT out-earns TDT.

  #### (3) Jonas: The Variant 2 Analogy
  *   **The Claim:** Nearest-neighbor matching improves base rates. Superrationality degrades continuously (the 5/7 math). Variant 2 shows the power of correlated equilibrium (Temp mod 40).
  *   **Assessment:** **Math right, analogy flawed.**
      *   The "continuous degradation" point is good; TDT doesn't require perfect copies, just sufficient correlation.
      *   However, the Variant 2 analogy backfires. The "Temp mod 40" scheme works *only* if it creates a Nash Equilibrium. As Rae will point out, it doesn't.
      *   Jonas is using Variant 2 to prove that "shared signals" work, but he's ignoring *incentive compatibility*.

  #### (4) Rae: The Incentive Compatibility Kill Shot
  *   **The Claim:** The Temp scheme isn't common knowledge/enforced. Non-selected people have an incentive to claim as backup (0 vs. chance at 4000). Variant 1 is Decision Theory; Variant 2 is Coordination.
  *   **Assessment:** **Devastatingly correct.**
      *   This is the technical knockout for Variant 2. In the "Unique Claimer" game, if I am *not* the chosen one (Badge $\neq$ Temp), my payoff for following the rule is $0$. My payoff for breaking the rule is $>0$ (if the chosen one flakes).
      *   Because there is no penalty for spoiling the pot, the "Temp mod 40" agreement is **not incentive compatible**. It is not a Nash Equilibrium. Rational agents will defect from the agreement, causing the pot to die.
      *   Rae is also right that Variant 1 and Variant 2 are different beasts. Variant 1 is about *prediction of the other*; Variant 2 is about *binding commitment*.

  #### (5) Jonas: The Universalizability Retreat
  *   **The Claim:** Cooperate because it's what you want everyone in your epistemic position to do. Defecting is trying to be special.
  *   **Assessment:** **Question-begging.**
      *   This is a restatement of Kantian universalizability or TDT axioms. It assumes the conclusion: that your decision is linked to theirs.
      *   To a CDTer (Rae), this sounds like magic thinking. "I want everyone to cooperate" does not cause everyone to cooperate. Jonas is asserting the decision theory rather than defending its applicability to the quiz setup.

  #### (6) Rae: The Asymmetry Check
  *   **The Claim:** Universalizability fails in asymmetric games.
  *   **Assessment:** **Philosophically sound.**
      *   "Do what you want everyone to do" is vague when payoffs differ. If I am rich and you are poor, do we both donate? Both keep?
      *   TDT/FDT actually *can* handle asymmetry (by maximizing expected utility given the correlation function), but Rae's point highlights that Jonas's slogan ("universalizability") is too simplistic to do the heavy lifting.

  ---

  ### What Both of Them Are Missing

  **1. The "Meta-Game" Effect of the Argument Itself**
  Both assume the decision is made in a vacuum. But this argument is happening *at the meetup*.
  *   If Jonas convinces the room that "TDT is correct and we should cooperate," then **Defecting becomes the dominant strategy.**
  *   If everyone expects everyone else to cooperate (because they bought Jonas's argument), then the rational CDT move is to Defect and take the $50.
  *   Jonas's argument is **self-undermining**. Propagating the norm of cooperation in a one-shot PD with real money invites predation from those who don't accept the norm.

  **2. The Quiz Content Matters**
  They argue about whether the quiz predicts behavior, but neither asks *what is on the quiz*.
  *   If the quiz includes questions like "Is it rational to cooperate in a one-shot PD?", then Jonas is right (matching pairs TDT with TDT).
  *   If the quiz is purely political/values (e.g., "Do you support UBI?"), Rae is right (political alignment does not predict decision theory).
  *   Given Marcus said "values-and-politics quiz," Rae is almost certainly right about the predictive validity.

  **3. Variant 2 Requires Enforcement, Not Just Focal Points**
  Jonas thinks a Schelling Point (Temp mod 40) is enough. Rae thinks it fails without enforcement. Both miss the middle ground: **Burning Bridges.**
  *   For Variant 2 to work, the 39 non-chosen people must *physically unable* to claim, or the chosen person must be able to verify no one else claimed *before* accepting.
  *   Without a mechanism to punish "backup claimers," the $100 EV is fantasy. The Nash Equilibrium is everyone claiming and getting $0.

  **4. Risk Aversion**
  They treat money linearly. For some attendees, $50 vs $30 might not matter, but $0 vs $10 might. However, in a high-trust rationalist group, social capital might outweigh the $20 difference. Neither accounted for the "I don't want to be seen as a defector at the next meetup" payoff matrix, which likely dwarfs the cash.

  ### Summary Verdict

  *   **On the Math:** **Jonas wins.** His calculations (5/7, 37%, $100) are all correct.
  *   **On Decision Theory:** **Draw.** Jonas is internally consistent with TDT/FDT. Rae is internally consistent with CDT. There is no objective "winner" here without agreeing on axioms.
  *   **On Empirical Reality:** **Rae wins.**
      *   She is right that a politics quiz does not predict PD moves.
      *   She is right that the rationalist community is split on decision theory.
      *   She is right that the Variant 2 coordination scheme is not incentive-compatible and will fail without enforcement.
  *   **On Strategy:** **Rae wins.** Jonas's strategy relies on a level of correlation (85% move-matching) that almost certainly does not exist in this setup. If Jonas cooperates, he expects ~$30. If he defects against a room listening to Jonas, he expects ~$50.

  **Recommendation for Marcus:**
  Don't run Variant 1 with real money; it incentivizes arguing about decision theory rather than playing. Don't run Variant 2 without a smart contract or escrow that penalizes multiple claimers. If you want to test correlation, use a quiz that asks *specifically* about game theory scenarios, not politics.

  **Who was right?**
  **Rae** was more right about the world (the quiz, the incentives, the community split). **Jonas** was more right about the abstract math (the thresholds, the EV calculations). In a game for actual cash, Rae's skepticism is the safer bet. Jonas is playing against a model of the room; Rae is playing against the room itself.
