  | **3. Experience-Preference Decoupling** | You choose birdwatching over music due to hearing loss, but the *pleasure* metric must track the experience, not the constrained choice. | **Camp-relative** (welfarist); orthodox economics equates choice with welfare, but decision-use requires distinguishing capacity from enjoyment. | Policy validates oppressive constraints as "preferences," treating a lack of alternatives as evidence that no welfare gain is possible. |
