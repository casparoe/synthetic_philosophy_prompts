  ### Discussion of Trade-offs and Joint Satisfiability

  The central tension in constructing this framework lies between **Empirical Tractability** and **Adaptation Neutrality**. Standard economic approaches satisfy tractability by relying on revealed preference (choice behavior) and unadjusted self-reports, but these fail the Adaptation Neutrality and Experience-Preference Decoupling desiderata. Choice behavior reflects constraints and adapted expectations rather than pure welfare, while unadjusted self-reports fail Scale Invariance. Consequently, the single requirement that eliminates the most familiar approaches is **Adaptation Neutrality**. It renders choice data insufficient (because choices adapt to constraints) and raw survey data unreliable (because reports adapt to expectations), forcing the adoption of more complex, hybrid measurement tools that combine physiological markers with calibrated survey anchoring.

  Regarding joint satisfiability, there is a known impossibility result analogous to your calibration work: you cannot simultaneously satisfy **Interpersonal Cardinality**, **Empirical Tractability**, and **Value Neutrality**. To achieve cardinality and tractability, you must adopt a specific substantive theory of well-being (e.g., hedonic tone or objective list), which violates the "value neutral" stance of orthodox welfare economics. You must accept that the measurement instrument itself embeds a philosophical commitment about what counts as a "gain." For your purpose of public resource allocation, this is a feature, not a bug; a thermometer is not value-neutral, it is calibrated to a specific physical reality. Similarly, a utility metric must be calibrated to a specific conception of human welfare to function as a decision tool. The subset of requirements is jointly satisfiable only if you abandon the economic orthodoxy that treats utility as purely ordinal and subjective, accepting instead that welfare is a measurable, interpersonally comparable quantity subject to systematic error and correction.
