          2.  *Framing Asymmetry:* Substitutes are assessed for risk; harm from continuing the incumbent is treated as background, not a decision outcome, even if delay causes more harm.
      *   **User's Hypothesis:** This isn't about uncertainty. It's about an "Authorship of Risk" norm (proposing a hazard makes you answerable; persisting hazards have no author).
      *   **Task:** Reconstruct the implicit theory the practice needs.
          *   What view of responsibility/risk/evidence does it *strictly presuppose* vs. merely sit well with?
          *   Which rival views does it rule out?
          *   Do the two asymmetries presuppose the same thing or different compatible things?
          *   Where is the practice philosophically underdetermined?
          *   Can the "authorship" reading be epistemic (known vs. unknown) rather than moral? If so, does it create new duties (evidence generation, scheduled reviews)?
          *   What would a *symmetric* practice look like (status quo treated as newly authorized annually)? What changes? What is lost?
      *   **Constraints:** Keep it short (memo style, actionable), no literature review (user will add citations), be explicit about what holds for *any* precautionary practice vs. *this specific* practice.

  2.  **Deconstruct the Asymmetries & Hypothesis:**

      *   *Asymmetry 1 (Burden/Grandfathering):* New = Guilty until proven innocent. Old = Innocent until proven guilty (or until resources allow review).
      *   *Asymmetry 2 (Framing/Substitution):* New risk = Active choice. Old risk = Passive state.
      *   *User's "Authorship" Norm:* Agency matters more than outcome magnitude. Doing harm > Allowing harm.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** Acknowledge the puzzle and the "Authorship" hypothesis.
      *   **Strict Presuppositions vs. Compatibility:**
          *   *Strict:* The practice *requires* a distinction between *acts* (introducing) and *omissions* (maintaining). It requires that moral/regulatory agency attaches to the *change* in state, not the *state* itself.
          *   *Compatible but not required:* Utilitarianism (if transaction costs are high), Status Quo Bias.
          *   *Ruled Out:* Strict Consequentialism (where only total harm matters), Pure Epistemic Precaution (where uncertainty alone triggers review regardless of history).
      *   **Are the Asymmetries the Same?**
          *   Burden Asymmetry relies on *Administrative Feasibility* + *Legitimate Expectations* (reliance interests).
          *   Framing Asymmetry relies on *Moral Agency* (Commission vs. Omission).
          *   *Verdict:* They are different but compatible. One is pragmatic/legal, the other is moral/ontological.
      *   **Underdetermination:**
          *   The practice could be justified by *Epistemic Familiarity* (we know the old risks) OR *Moral Authorship* (you caused the new risk). The current practice doesn't distinguish.
      *   **Epistemic vs. Moral Reading:**
          *   If Epistemic (Old = Known, New = Unknown): The practice fails because it doesn't mandate updating old data. It creates a "knowledge debt."
          *   Implication: If epistemic, you owe a duty to review incumbents on a schedule.
      *   **Symmetric Practice:**
          *   *Concept:* Re-authorization of incumbents.
          *   *Changes:* Shift burden of proof to incumbents periodically. Treat "no action" as "action to continue."
          *   *Losses:* Administrative burden, market stability, potential disruption of essential supplies during review.
      *   **Constraint Check:** Ensure I distinguish between general precautionary features and specific details provided (grandfathering, substitution framing).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Authorship" strictly required?
      *   *Correction:* No. A resource-constrained regulator could do this purely on triage (new things are easier to stop than old things embedded in supply chains). I need to be careful not to say Authorship is the *only* explanation, but that the *practice* functions *as if* it is true.
      *   *Refinement on "Strict Presuppositions":* The practice strictly presupposes that *regulatory trigger events* are discrete (application for market entry) rather than continuous (presence in market).
      *   *Refinement on Epistemic:* If the justification is "we know the old stuff," but the data is decades old, the epistemic justification collapses. This strengthens the user's moral hypothesis but highlights the inconsistency.
