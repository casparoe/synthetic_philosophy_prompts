answer: |-
  **MEMORANDUM**

  **TO:** Regulatory Strategy Unit
  **FROM:** Policy Analysis
  **SUBJECT:** Reconstruction of Implicit Norms in Chemical Authorization Asymmetries

  **1. Core Thesis**
  Your "Authorship of Risk" hypothesis is plausible but not strictly necessary. The practice strictly presupposes a **Discrete Agency Model**: regulatory responsibility attaches to *events* (market entry applications) rather than *states* (market presence). This treats the status quo as a neutral baseline rather than a continuous choice. While this sits well with a moral norm against commission (doing harm) vs. omission (allowing harm), it is equally compatible with a pragmatic triage model (stopping new flows is cheaper than retrofitting old stocks).

  **2. Strict Presuppositions vs. Compatibility**
  *   **Strictly Presupposed:**
      *   **Trigger Specificity:** Regulatory duty is activated by a *change* in the environment (new application), not by the *persistence* of risk.
      *   **Baseline Neutrality:** The existing inventory is treated as a "natural" state lacking an author, whereas new entries are "artificial" interventions.
  *   **Merely Compatible:**
      *   **Moral Authorship:** The idea that proposers are morally answerable in a way maintainers are not.
      *   **Resource Constraints:** The view that reviewing everything is impossible, so new entries are prioritized as "choke points."
  *   **Ruled Out:**
      *   **Strict Consequentialism:** Any view holding that the regulator is equally responsible for all preventable harm, regardless of who introduced the substance.
      *   **Pure Epistemic Precaution:** Any view holding that uncertainty alone (regardless of history) mandates a moratorium. (If this held, old substances with outdated data would be treated as "newly uncertain.")

  **3. Are the Two Asymmetries the Same?**
  They rely on different justifications that happen to be compatible.
  *   **Burden Asymmetry (Grandfathering):** Primarily **Legal/Pragmatic**. It relies on *Legitimate Expectations* (firms relied on old rules) and *Administrative Feasibility* (clearing the backlog is harder than screening the gate). This is specific to your described inventory system.
  *   **Framing Asymmetry (Substitution):** Primarily **Moral/Ontological**. It relies on the *Commission/Omission* distinction. Treating incumbent harm as "background" implies the regulator does not "author" the continued availability of the incumbent. This holds for any precautionary practice that lacks sunset clauses.

  **4. Philosophical Underdetermination**
  The practice is underdetermined between a **Moral Reading** (Authorship) and an **Epistemic Reading** (Familiarity).
  *   *The Conflict:* You note old evidence is "decades old." If the justification were Epistemic ("we know the shape of the risk"), the age of the data undermines the premise. If the data is outdated, the epistemic advantage vanishes.
  *   *The Implication:* If you claim the Epistemic Reading, the practice is internally inconsistent. You currently owe a **Duty of Evidence Maintenance**: a statutory requirement to update incumbent dossiers on a fixed schedule. If you cannot deliver this, you must admit the justification is Moral/Authorship (we regulate new actors because they stepped forward, not because we know less about them).

  **5. A Symmetric Practice: "Continuous Authorization"**
  If risks of the status quo were treated as newly authorized each year:
  *   **Procedural Changes:**
      *   **Sunset Clauses:** All approvals expire after $X$ years.
      *   **Burden Shift:** Incumbents must re-submit safety data to maintain market access; "no action" results in delisting.
      *   **Comparative Assessment:** Approval of a substitute is mathematically weighted against the *continued* harm of the incumbent (making delay a quantifiable regulatory cost).
  *   **What Is Lost:**
      *   **Market Stability:** Supply chains face periodic disruption risks.
      *   **Administrative Load:** Regulator capacity shifts from screening new innovations to auditing old commodities.
      *   **Innovation Disincentive:** If new substances face higher recurring compliance costs than incumbents (during the transition), it may cement the position of dominant firms with large legacy portfolios.

  **6. Actionable Conclusion**
  Your practice is not logically bound to the "Authorship" norm, but it functions *as if* it were. To resolve the tension:
  1.  **If Epistemic:** Institute mandatory data refresh cycles for incumbents.
  2.  **If Moral:** Acknowledge that "Authorship" prioritizes procedural fairness over harm minimization, and accept that this entails higher aggregate risk during transition periods.
  3.  **If Consequentialist:** Move toward Symmetric Practice (Sunset Clauses) to align regulatory triggers with actual risk exposure rather than administrative history.

  **Constraint Note:**
  *   *General to Precautionary Regimes:* The Framing Asymmetry (Commission vs. Omission) and the Trigger Specificity.
  *   *Specific to Your Description:* The Burden Asymmetry regarding "decades old" evidence and the specific handling of substitute comparisons as background conditions.
