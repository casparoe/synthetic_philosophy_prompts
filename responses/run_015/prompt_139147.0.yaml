answer: |-
  Professor H.'s verdicts resist a simple "volitional sovereignty" principle, which would invalidate consent whenever a agent's decision is swayed by falsehoods or pressure they would have rejected. Cases (2), (5), and (6) decisively refute this: the participant would have refused had she known about the tobacco funding; the kidney seller acted from desperation; the worker acted from threat of firing. In all three, H rules consent valid. She distinguishes between *external circumstances* that motivate a choice and the *terms of the transaction* itself.

  This suggests two competing candidate principles that fit the data. The first is a **Role-Based Corruption** view: consent is invalid if anyone within the professional relationship (clinical or research team) deceives the agent about material facts. This fits (1), (2), and (8), but struggles with (2), where the lab (the counterparty) withheld funding information. H treats funding as a "reason for refusing" rather than a feature of the act. Thus, a more precise principle is **Transactional Integrity**: consent is invalid only if the *counterparty* (or their direct agent) deceives or coerces regarding a *feature of the proposed act* (identity, risk, nature), rather than external reasons or circumstances.

  This principle explains the entire corpus. In (1) and (8), the counterparty obscures features (identity, risk); consent fails. In (4), the counterparty coerces; consent fails. In (2), (3), (5), and (6), the defect is either external (funding, poverty, job market) or non-material (no extra burden); consent holds. In (7), the internal state is competent at the time; consent holds.

  **Prediction for Case 9:**
  On the Transactional Integrity view, the consent is **valid**. The surgeon—the counterparty—provided accurate information about the procedure, risks, and right to refuse. The nurse's lie concerns a feature (urgency), but the nurse is not the counterparty nor an agent acting on the surgeon's behalf (the surgeon knows nothing). The lie functions like the tobacco funding in (2) or the poverty in (5): it is an external manipulation of the patient's reasons, not a corruption of the bilateral agreement. The nurse committed a wrong, but the consent itself remains intact because the channel of authority (surgeon-to-patient) was transparent.

  **The Sharpest Test Case:**
  Your intuition about the surgeon's careless exaggeration is correct, but it needs to be framed specifically to isolate the *source* variable while holding the *content* constant. The best test case is this: *The surgeon himself, hurried and imprecise, tells the patient, "Surgery now or emergency within the month," believing it to be true, though it is medically false.* The patient consents based on this.
  If H rules **invalid** here, but **valid** in Case 9, it confirms Transactional Integrity (Source matters). If she rules **valid** in both, she holds a stricter Volitional view (Materiality matters regardless of source). If she rules **invalid** in both, she holds a Role-Based view (Clinical team deception corrupts consent). The surgeon-exaggeration case is superior to the "patient in the next bed" case because it controls for professional authority; the next-bed patient introduces a variable of "layperson influence" that might distract from the core ethical issue of professional accountability.

  **Binary vs. Graded Validity:**
  Professor H. clearly treats validity as **all-or-nothing**. Case (5) is illustrative: consent is valid, yet the act is illegal. She separates the moral/legal status of the *transaction* from the regulatory status of the *act*. Adopting a graded view (e.g., "valid for the incision, invalid for the timing") would gain nuance in assigning blame but lose the clear binary required for liability and battery claims. If consent is graded, does the surgeon commit battery? H's binary approach protects the clarity of bodily integrity rights: either the patient authorized the touching under the essential terms, or they did not. Grading consent risks turning a protective shield into a negotiable scale, potentially undermining the strict boundaries H seems to enforce in cases like (1) and (4). She prioritizes the clarity of the normative boundary over the granularity of the psychological cause.
