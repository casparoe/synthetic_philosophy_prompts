answer: |-
  Here is the session plan. It is designed to leverage your audience's strengths (engineering systems thinking) while guarding against their specific blind spots (design teleology).

  ### 1. The Core Example: The Synthetic Gene Circuit
  **Use the synthetic gene circuit.** Do not use the heart or the appendix.

  *   **Why:** The heart is a "convergence case" (both theories agree it pumps blood), which hides the philosophical split. The appendix is medically messy (is it vestigial? is it immune?). The circuit is a **divergence case**.
      *   *History:* The promoter was selected/inserted for **heat-shock response**.
      *   *Current Role:* In the lab strain, it currently drives **fluorescence**.
  *   **Requirement:** It must be described simply enough for the poet but technically enough for the engineers. Call it a "switch" (promoter) connected to a "light" (fluorescent protein).
  *   **Crucial Detail:** You must specify that the heat-shock capability is *gone* or *unused* in the current lab environment, but the DNA sequence remains because it was inherited from the selection process. This forces the split:
      *   *Etiological:* Function = Heat Shock (because that's why it's there).
      *   *Causal-Role:* Function = Fluorescence (because that's what it's doing now).

  ### 2. Session Sequence (90 Minutes)

  **Part 1: The Intuition Trap (15 mins)**
  *   **Action:** Present the Circuit case. Ask the room: *"What is the function of this promoter?"*
  *   **Goal:** Let the engineers say "To make light" and let yourself (the biologist) say "To respond to heat" (or vice versa). Create cognitive dissonance immediately.
  *   **Intervention:** Do **not** give them the philosophical labels yet. Let them argue based on intuition.

  **Part 2: Naming the Split (20 mins)**
  *   **Action:** Now introduce the labels.
      *   **Etiological Account:** Function is about *history* (why it was selected/kept).
      *   **Causal-Role Account:** Function is about *current contribution* (what it does in the system now).
  *   **Mapping:** Map their earlier arguments to these labels. Show that the disagreement wasn't about facts, but about which definition they were using.

  **Part 3: Intercepting Misconceptions (25 mins)**
  *   **The "Design" Trap (Engineers):**
      *   *When:* Immediately after Part 2.
      *   *The Move:* Engineers will equate "Etiological" with "Designer Intent." You must explicitly decouple **Selection** from **Design**.
      *   *Script:* "In engineering, function follows the blueprint. In biology, 'history' means 'survival of the fittest,' not 'intent of a maker.' Even in this synthetic circuit, the function isn't what the scientist *wanted* yesterday, it's what selection *kept*."
  *   **The "Accident" Trap (Causal-Role):**
      *   *When:* When defining Causal-Role.
      *   *The Move:* They will think Causal-Role means "anything that happens."
      *   *Script:* "Causal-role isn't just noise. It's about *capacity*. If the promoter drives fluorescence, that is a causal capacity. It doesn't matter if it's 'useful' yet, only that it is *doing* it within the system."

  **Part 4: The Twist — The Cave Fish (20 mins)**
  *   **When:** Now that the definitions are stable.
  *   **Action:** Introduce the cave fish eye (selected for sight, now detects vibrations).
  *   **Goal:** Visceral validation.
      *   Ask: *"Under the Etiological view, does this eye have a function?"* (Answer: No, or 'Sight' which is broken).
      *   Ask: *"Under the Causal-Role view, does this eye have a function?"* (Answer: Yes, vibration detection).
  *   **Why here?** If you did this earlier, they would get stuck on the biology of the fish. Now, they use the fish to test the *tools* you just gave them. It shows why the distinction matters in a disrupted ecosystem.

  **Part 5: The Check (10 mins)**
  *   **Action:** Pose the final question (see below).
  *   **Goal:** Verify they aren't just nodding.

  ### 3. The Final Checking Question
  Do not ask them to define the terms. Ask them to apply the distinction to a *new* conflict.

  **The Question:**
  > "Imagine we take that cave fish eye and transplant it into a surface fish that already sees perfectly. The transplanted eye adds *no* new vibration detection because the surface fish's skin already does that.
  >
  > **Question:** Does the transplanted eye still have a Causal-Role function? Does it still have an Etiological function?"

  **What to listen for:**
  *   **Grasped it:** They will say Etiological = Yes (history of sight), Causal-Role = No (it contributes nothing new to *this* system).
  *   **Missed it:** They will say "It's still an eye, so it functions" (conflating identity with function) or "It's useless, so no function" (conflating utility with causal role).

  ### 4. What to Openly Refuse (The "Do Not Enter" Zone)
  You must set boundaries early to protect your confidence and their time. Put this on a slide or say it explicitly in Part 2.

  1.  **No "Malfunction" Debates:** If someone asks, *"But if the heart stops pumping, is it still a heart?"*, stop it. Say: *"That requires a theory of 'normativity' which is a different lecture. Today we only care about working systems."*
  2.  **No Wright vs. Millikan:** If someone asks about specific philosophical variations on the Etiological view, say: *"Those are internal family disputes among philosophers. For biologists, the core distinction is History vs. Current Role. We won't split those hairs today."*
  3.  **No Reading List:** If they ask for books, say: *"This session is self-contained. The value is in the distinction, not the literature."*

  ### 5. Summary of Pedagogical Moves
  *   **Start with Disagreement:** Don't teach the theory; teach the *need* for the theory by showing them they already disagree.
  *   **Engineer-to-Engineer:** Use the Circuit to make the engineers feel smart, then use the Cave Fish to make them feel the biological reality.
  *   **Protect the Poet:** Ensure the "Circuit" explanation focuses on *input/output* logic, not molecular mechanisms, so the poet stays with the group.
  *   **Hold the Line:** Do not let the "Design" conversation hijack the "Selection" conversation. That is the single biggest risk with an engineering audience.

  This plan keeps the biology concrete, the philosophy functional, and the boundaries clear. Good luck with the club.
