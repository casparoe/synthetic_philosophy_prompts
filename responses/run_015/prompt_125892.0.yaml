answer: |-
  You are right, and your friend is wrong. This is not the Tragedy of the Commons.

  The Tragedy of the Commons (as formalized by Hardin and modeled in game theory) is a **Prisoner's Dilemma**. In that structure, defecting (overcutting) is the *dominant strategy*. It is rational for me to take extra wood *even if I know everyone else will restrain themselves*. The incentives are broken regardless of what I believe about you.

  What you are describing is an **Assurance Game** (also known as a **Stag Hunt**). In this structure, cooperation is the preferred outcome, but it is only rational *if I am assured you will also cooperate*. There are two stable equilibria: everyone restrains (good outcome) or everyone rushes (bad outcome). The system flips from one to the other based on *expectations*, not inherent incentives.

  The dynamic mechanism you identified—a sudden shift in belief causing a rush that validates the belief—is indeed a **Bank Run**.

  ### The Name

  There is no single, canonical noun phrase that perfectly captures "A Bank Run dynamic applied to a Renewable Common-Pool Resource governed by Norms." Economists sometimes loosely call this a **"Run on the Commons,"** but that is often just a metaphor.

  To give you the carving you asked for, I will coin the term **"The Assurance Run."**

  It bridges the game theory (Assurance Game) with the dynamic (Run). Here is the definition and its edges.

  ### The Carving: Defining "The Assurance Run"

  **Definition:** An Assurance Run occurs when a sustainable equilibrium of conditional cooperation collapses because actors acquire a belief (true or false) that others are about to defect, prompting preemptive defection that depletes the resource or destroys the governance norm.

  **1. The Boundary of Belief (True vs. False)**
  *   **Does it count if the belief is true?** **Yes.**
      *   *Edge Case:* The parish *was* actually selling the land.
      *   *Reasoning:* The phenomenon is defined by the *mechanism of collapse*, not the veracity of the trigger. Even if the land were being sold, a managed harvest could have occurred. The *rush*—the temporal compression of extraction—is what causes the specific damage (stripping the lot vs. harvesting sustainably until the sale). The belief triggers the *speed*, and the speed causes the ruin.
  *   **Does it count if the belief is false?** **Yes.**
      *   *Reasoning:* This is the purest form. The resource was never at risk, but the *norm* was. The destruction is entirely self-inflicted via misinformation.

  **2. The Boundary of Resource (Stock vs. System)**
  *   **Does it count for anti-rival goods (wikis, footpaths)?** **Yes.**
      *   *Edge Case:* A shared wiki that gets better with careful editing but breaks under a flood of new users.
      *   *Reasoning:* In a woodlot, the *stock* is depleted. In a wiki or footpath, the *maintenance capacity* is depleted. The Assurance Run targets the **sustainable yield** of the system. If the influx of users (defection) exceeds the community's ability to curate/maintain (cooperation), the system degrades. The "resource" being run on is not just the content, but the **social order** required to maintain it.

  **3. The Boundary of Motivation (Greed vs. Fear)**
  *   **Distinction from Tragedy of the Commons:**
      *   *ToC:* I take more because I want more, regardless of you. (Greed/Incentive)
      *   *Assurance Run:* I take more because I fear you will, and I don't want to be left with nothing. (Fear/Coordination)
      *   *Edge:* If people start taking wood simply because they got greedy, even without the rumor, that slides back toward Tragedy of the Commons. The Assurance Run *requires* the belief about *others* to be the primary driver.

  **4. The Boundary of Reversibility (The Scar)**
  *   **The Critical Edge:** An Assurance Run leaves a different scar than a Tragedy of the Commons.
      *   In a ToC, the resource is gone. You can replant trees, but the incentives remain broken.
      *   In an Assurance Run, the resource might recover (wood grows back), but the **Trust** is gone. The specific damage is to the **meta-norm**: the belief that "we are the kind of people who restrain ourselves."
      *   *Criterion:* If the village replants the trees but everyone still guards their axe because they don't trust the neighbors, the Assurance Run is still in effect, even if the woodlot looks green. The failure mode is **social**, not just ecological.

  ### Why the Distinction Matters

  Your friend wants to call it a Tragedy of the Commons because that suggests the solution is **privatization or regulation** (change the incentives). If it's a ToC, you need fences and fines.

  But if it's an **Assurance Run**, the solution is **signaling and transparency**. You don't need fences; you need a way to prove to everyone that everyone else is still cooperating.
  *   **In the woodlot:** A public ledger of who cut what, or a town hall confirming the land isn't being sold.
  *   **In the office:** A manager explicitly stating, "The budget email was a template; no cuts are happening," followed by restocking the milk immediately to signal abundance.

  ### Summary

  You are describing a **Shift from the Payoff-Dominant to the Risk-Dominant Equilibrium in a Stag Hunt**, triggered by a **Information Shock**.

  Call it an **Assurance Run**.

  *   **It is not the Tragedy of the Commons** (Incentives didn't change).
  *   **It is a Bank Run** (Belief-driven liquidity crisis), but on **Social Capital** rather than Money.
  *   **It counts** whether the rumor is true or false, and whether the resource is wood or a wiki.
  *   **The damage** is primarily to the **Norm of Restraint**, which is harder to regrow than the wood.
