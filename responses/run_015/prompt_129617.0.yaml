answer: |-
  The City of Oakhaven's heritage committee convenes to decide the fate of a bronze statue and the adjacent thoroughfare known as "Vane Street," both dedicated in 1890 to honor the city's founding, though a fire destroyed all dedicatory records, rendering it undecidable whether the commemorated agent is the historical individual Silas Vane or the abstract institutional office of "First Councilor" he occupied. The statue depicts a specific man in period uniform, a material bodily form that cannot be altered without melting the bronze, while the street name is a linguistic label adjustable by council vote without physical destruction. Given this epistemic gap, where the statue's visual specificity risks misrepresenting an abstract role as a specific person yet removal incurs significant material cost, and the street name persists as a mutable signifier detached from bodily likeness, the committee must weigh the welfare costs of physical destruction against the duties of historical truthfulness in the face of不可decidable reference.

  **Reasoning Walk-Through**

  The consequentialist argues for preserving the statue because the social welfare cost of melting down functional public art and inciting potential civic unrest outweighs the benefit, especially since the epistemic ambiguity neutralizes the harm: if the statue might represent an abstract role rather than a problematic individual, it does not actively endorse a moral violator. However, the consequentialist argues for renaming the street because administrative reassignment is low-cost and yields high social welfare by clarifying civic identity and signaling inclusivity without the friction of physical destruction. Conversely, the deontologist argues for removing the statue because a bodily likeness makes a truth-claim about a specific individual; if the records are gone, maintaining the statue perpetuates a potential falsehood (honoring a body when the referent might be a role), violating the duty to historical fidelity. Yet, the deontologist argues for retaining the street name because the name itself is a historical fact of the naming act; changing it erases the linguistic trace of the past, whereas keeping it preserves the record of the dedication regardless of the referent's identity.

  **Working Feature**

  The reversal is driven by the interaction between **epistemic inaccessibility** (the destroyed records making the referent undecidable) and the **differential correctability** of the media. The statue's material rigidity makes it a "hard" claim to truth that is costly to correct, pushing the consequentialist toward preservation (cost avoidance) and the deontologist toward removal (truth avoidance). The street name's linguistic fluidity makes it a "soft" claim, pushing the consequentialist toward renaming (low-cost welfare gain) and the deontologist toward retention (preservation of historical trace).

  **Removal Test**

  If the dedicatory records were intact and the identification unambiguous (e.g., proving Silas Vane was the specific individual), the verdicts would collapse back to standard alignment. A consequentialist would likely remove the statue if Vane were harmful (high welfare gain) or keep it if benign; a deontologist would keep the statue if Vane were the truthful subject (duty to history) or remove it if Vane were a liar (duty to truth). The specific reversal relies entirely on the uncertainty: without the epistemic gap, the statue is either a truthful representation (Deon keeps) or a harmful one (Con removes), eliminating the cross-pressure that forces the reversed outcome.

  **Defense and Concession**

  A defender of the deontological framework might attack the scenario by arguing that removing the statue destroys historical evidence just as much as renaming the street, violating the duty to preserve the past. They would contend that the statue itself is an artifact of 1890s craftsmanship and intent, regardless of who it depicts. The weakest point in this defense is the distinction between *artifact* and *assertion*: while the bronze is an artifact, its representational form asserts a specific likeness. If that likeness is unknowable, the assertion is fundamentally broken, making removal a duty to truth rather than an erasure of history, whereas the street name remains a valid historical record of the naming convention itself without making a false bodily claim.
