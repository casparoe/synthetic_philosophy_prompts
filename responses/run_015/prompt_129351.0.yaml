      *   *Empirical Argument:* In the experiments, subjects report feeling they could have stopped it. If the veto were predetermined, the subjective experience of choice in that window would be entirely deceptive. Libet is cautious about claiming *metaphysical* free will, but he insists on *functional* free will.
