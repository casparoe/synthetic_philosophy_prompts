      *   *Conclusion on Q1:* It challenges a specific *version* of Direct Realism (one requiring immediate access to physical simultaneity), but doesn't necessarily kill the whole doctrine. However, it strongly supports *Representationalism* or *Indirect Realism* regarding temporal order. It suggests temporal properties are *constructed* by the brain, not picked up like spatial properties.

