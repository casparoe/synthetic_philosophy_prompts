          *   *Response:* The distinction holds *phenomenologically* but might collapse *propositionally*. If Group A says "Eating pork is sinful" and Group B says "Eating pork is neutral," Group B isn't silent *now*, they are expressing a verdict. The "silence" is pre-reflective. The argument needs to clarify that "silence" refers to the *pre-theoretical experience*, not the post-hoc justification.
      *   *Q2: Psychology.*
          *   *Critique:* Haidt (WEIRD vs. non-WEIRD), Shweder (ethics of autonomy, community, divinity), and Henrich all support the idea that *salience* differs, not just verdicts. E.g., purity violations register in some cultures, not others.
