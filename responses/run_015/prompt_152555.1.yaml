      *   *Correction:* Make sure I don't validate the argument *too* much. I need to be a "careful reader" leaving "margin comments," which implies finding faults too. The "Silence" distinction is the most vulnerable point. I need to press on whether "silence" is just "disagreement about meta-rules."
