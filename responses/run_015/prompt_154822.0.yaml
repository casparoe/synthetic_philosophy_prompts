  # Joint Statement on the Concept of Biological Function

  **Date:** October 26, 2023
  **Signatories:** The Etiological Working Group & The Causal-Role Working Group
  **Subject:** Findings from Adversarial Collaboration on Functional Ascription

  Following a period of adversarial collaboration, the undersigned parties submit this joint statement. While we maintain distinct theoretical commitments regarding the metaphysical grounds of biological function, we have identified a robust set of shared empirical commitments and isolated our disagreements to specific definitional cruxes. This document serves to codify our common ground and specify the empirical tests that distinguish our respective frameworks.

  ### I. Agreed Substantive Claims

  Both camps affirm the following claims as true descriptions of biological reality, regardless of the underlying theoretical justification:

  1.  **Paradigm Performance:** In a healthy adult human, the heart pumps blood. This is not merely a description of motion but an ascription of biological function.
  2.  **Pathological Deviation:** Tumors constitute a dysfunction of cellular regulation. The cells within a tumor are failing to perform a biological requirement, not merely behaving differently.
  3.  **Normative Weight:** The term "function" carries normative weight. To say a trait has a function is to establish a standard against which the trait can be judged as successful, failing, or broken.
  4.  **Systemic Dependence:** Functional ascriptions depend on the organization of the containing system. A heart removed from a circulatory system and placed on a table retains its structure but ceases to function *as a heart* in that context.
  5.  **Distinction from Accident:** Beneficial accidents do not count as functions. If a nose happens to hold up glasses, that is a causal benefit, but it is not the biological function of the nose.

  ### II. Table of Disagreements and Empirical Cruxes

  While we agree on the *extension* of most standard cases (e.g., hearts, kidneys, tumors), we disagree on the *intension* (the definition) and the boundaries of the concept. The following table outlines the precise wording differences, the theoretical cruxes, and the concrete cases selected to test these divergences.

  | Crux | Precise Disagreement in Wording (Definition) | Concrete Case / Experiment | Etiological Prediction | Causal-Role Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Necessity of History for Malfunction** | **ET:** "X is malfunctioning" means X fails to perform the effect for which it was historically selected in the relevant comparison class.<br><br>**CR:** "X is malfunctioning" means X fails to contribute its typical causal capacity to the current containing system's organization. | **The Novel Mutation Case:**<br>A specific genetic mutation arises *de novo* in a lab mouse population (Generation 1). It reduces metabolic efficiency by 10% but is not lethal. There is no evolutionary history for this specific variant yet. | **Malfunction:** The trait is dysfunctional immediately. Even without a history of selection *for this variant*, it fails to meet the performance standard set by the historical selection of the wild-type trait in the species' comparison class. | **Context Dependent:** If the mouse survives and the system maintains homeostasis, the trait is functioning (poorly), not malfunctioning. Malfunction requires a breakdown of the system's current capacity, not a deviation from a historical statistical norm. |
  | **2. Functions in Ahistorical Systems** | **ET:** "Function" applies only to traits with a selection history. Ahistorical systems have "purposes" assigned by designers, but no intrinsic biological functions.<br><br>**CR:** "Function" applies to any organized system where parts contribute to the capacity of the whole, regardless of origin. | **The Synthetic Organoid Case:**<br>A self-assembling kidney organoid is grown from stem cells in a matrix never found in nature. It filters toxins and maintains internal pressure, but has no evolutionary ancestor and was not selected for this specific arrangement. | **No Function:** The organoid has causal powers and may be useful, but it lacks a *proper function*. It cannot "malfunction" in a biological sense, only fail to meet engineering specifications. Any function ascribed is derivative of the donor's history, not the organoid's. | **Has Function:** The organoid has genuine biological functions (e.g., filtration). The parts contribute to the capacity of the whole system. If the filtration mechanism breaks, it is a biological malfunction, indistinguishable in kind from a natural kidney. |
  | **3. The Reference Class for Normativity** | **ET:** The norm is fixed by the **Past**. The standard is what the trait was selected to do in the environment of adaptation.<br><br>**CR:** The norm is fixed by the **Present**. The standard is what the trait *must* do now to maintain the current system's viability. | **The Vestigial Trait Case:**<br>The human appendix. It no longer contributes significantly to digestion (its historical selected effect) but may contribute to immune storage (current causal role). | **Dysfunctional/Non-Functional:** Regarding digestion, it is non-functional or vestigial. It does not perform its selected effect. Any current immune role is a new function only if selection acts on it now. | **Functional:** Regarding immune storage, it is functional. It contributes to the current system's capacity. The historical loss of digestive function is irrelevant to its current functional status. |

  ### III. Commitment to Resolution

  We acknowledge that standard observational biology often cannot distinguish between these predictions, as evolutionary history and current causal role usually align. Therefore, we commit to prioritizing research on **novel biological systems** (synthetic biology, rapid evolution experiments, and pathological novelties) where history and current capacity diverge. We agree that the outcome of the *Synthetic Organoid Case* is the most decisive test for the necessity of evolutionary history in functional ascription.

  **Signed,**

  *The Etiological Working Group*
  *The Causal-Role Working Group*
