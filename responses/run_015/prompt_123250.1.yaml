answer: |-
  This is a classic co-op dilemma: the tension between **governance best practices** and **community memory/culture**. You are right to be torn, because both sides have valid points, but the bylaw itself is objectively problematic from a governance standpoint.

  Here is a breakdown of the situation, why that bylaw is unusual, and a strategy for how you might navigate this without fracturing the board.

  ### 1. The Governance Reality Check
  From a purely structural perspective, the newer members are correct.
  *   **Bylaws vs. Policies:** Bylaws should govern *how* the organization runs (elections, meetings, duties), not *operational details* (who supplies the oats). Hard-coding a specific vendor category into bylaws limits the flexibility of future boards. If that supplier goes out of business, raises prices exorbitantly, or has an ethical scandal, the co-op is held hostage.
  *   **The Unanimity Trap:** Requiring unanimity for an operational decision is effectively giving a single board member veto power over the entire organization. This creates gridlock and encourages holdout behavior. It is antithetical to the cooperative principle of "Democratic Member Control."
  *   **The "Disaster" Logic:** Even if there was a disaster in the 80s, the remedy (unanimity on grain) seems disproportionate. Usually, a bad vendor experience leads to better *vetting processes*, not an inability to switch vendors.

  ### 2. The "Ghost of the 80s"
  The older members are likely not being stubborn for the sake of it; they are likely acting out of **trauma or protection**.
  *   **Institutional Memory:** In small co-ops, oral history often outweighs written records. If a vendor switch once caused a financial crisis, a lawsuit, or a massive member exodus, the older guard views this rule as a dam holding back a flood.
  *   **The Silence:** The fact that they won't say what happened is the real problem. It suggests either:
      1.  The event was so contentious they don't want to reopen old wounds.
      2.  The "disaster" is mythical or exaggerated to maintain control over a specific ideological point (e.g., solidarity with a specific sister co-op).
      3.  They fear that if they explain it, the newer members will say, "That wouldn't happen today."

  ### 3. Is it reasonable to keep the rule?
  **No.** It is not reasonable to keep a bylaw that hampers operational agility based on an unexplained historical event, especially when that bylaw contradicts standard democratic governance.

  However, it **is** reasonable to proceed with caution. If you force a vote now, the older members may feel their stewardship is being disrespected, which could lead to resignations, bad blood, or a splinter group.

  ### 4. A Path Forward
  Instead of a binary "Keep vs. Scrap" fight, try to move the conversation toward **understanding and compromise**.

  **Step 1: The Archaeological Dig**
  Before voting to change anything, propose a motion to *review the history*.
  *   *Script:* "We respect that this rule exists for a reason. Before we vote to change it, we have a duty to understand the risk we are mitigating. Can we task a small committee (mixed old and new members) to review the minutes from the 80s to document what happened?"
  *   If they refuse to look at the minutes, that signals the rule is about power, not protection. If they agree, you might find the "disaster" was a specific context (e.g., a supplier fraud) that can be solved with better contracts, not a unanimity rule.

  **Step 2: Separate the "What" from the "How"**
  The older members might care deeply about *where* the grain comes from (e.g., local, organic, another co-op).
  *   Propose moving the *vendor requirement* from the Bylaws to a **Board Policy**.
  *   Change the voting threshold from *Unanimous* to *Supermajority (e.g., 2/3 or 75%)*.
  *   *Why this works:* It acknowledges that grain sourcing is important (validating the older members) but removes the single-person veto and makes the rule easier to amend in the future (validating the newer members).

  **Step 3: The "Sunset" Clause**
  If they are truly afraid of a repeat disaster, propose a compromise: Change the bylaw to a majority vote, but require that any new grain supplier undergo a 6-month probationary period with specific metrics. This addresses the *risk* of a bad switch without keeping the *gridlock* of unanimity.

  ### 5. Questions to Ask the Board
  To move the discussion forward, ask these questions in a non-confrontational way:
  1.  "If our current grain supplier doubled their prices tomorrow, does this bylaw prevent us from switching quickly?" (Highlighting the risk).
  2.  "Is the goal to protect the *quality* of the grain, or the *relationship* with the specific supplier?"
  3.  "Can we encode our *values* regarding grain sourcing in a policy, rather than locking ourselves into a specific voting mechanism in the bylaws?"

  ### Summary
  The newer members are right about the **mechanics** (unanimity is inefficient and undemocratic). The older members are right about the **culture** (history matters, and rapid changes can destabilize a co-op).

  Your role as a board member is to find a solution that honors the history without being held hostage by it. **Do not vote to keep a bylaw you don't understand.** Push for the historical review first. If the "disaster" cannot be articulated, the justification for the bylaw evaporates.

  *One final check:* Ensure this is actually in the **Bylaws** and not a **Board Policy**. If it's just a policy, the board can change it with a simple majority immediately, and the "unanimity" rule might just be a misunderstanding of past practice. If it is in the legal Bylaws, it will require a vote of the *membership* to change, not just the board, which changes your strategy entirely.
