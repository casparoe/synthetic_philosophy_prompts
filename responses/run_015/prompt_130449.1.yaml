answer: |-
  Welcome everyone. Before we turn to the agenda, I invite you to look around this room. You will notice there is no podium. There is no head table. There is no single vantage point from which the day's proceedings will be delivered to you. Instead, we have these round tables. This arrangement is not merely a logistical choice; it is the central image of our workshop.

  We are here to discuss defactualization and public speech. Often, this topic is framed as a battle between truth and lies, where the goal is to protect a static record from corruption. But if we rely only on that framework, we miss the deeper injury. We are gathering to consider a claim that reality is not a fixed object waiting to be discovered by a solitary observer. Rather, reality emerges through plural, co-appearing perspectives. It exists in the space between us. For something to be real in a political sense, it must be able to appear to many people, from many positions, simultaneously.

  For those of you who have studied the work informing this workshop, this shift from correspondence to appearance is familiar. For those encountering this framework for the first time, particularly from the newsroom, the implication is this: A fact does not become publicly real simply because it is accurate. It becomes publicly real when it occupies a common world where different people can see it, speak about it, and yes, disagree about it.

  This is why organized lying is so devastating. It is not damaging simply because it substitutes falsehood for truth. It is damaging because it collapses the conditions under which disagreement can occur at all. When political speech is organized to isolate us, to make sure that what appears to me cannot possibly appear to you, it destroys the common world. It leaves us not with a different opinion, but with no shared ground on which to stand together. Totalitarian propaganda, in this analysis, does not just convince people of a lie; it destroys their capacity to trust their own experience in relation to others. It dissolves the table we are sitting at.

  This brings us to the work you do, particularly those of you training for the press. If reality depends on plural perspectives, then your ethical obligations extend beyond accuracy in isolation. You cannot secure truth as a single authoritative witness. No single article, no single headline, no single correction can guarantee reality from a position of authority above the fray. You are not the sole guarantor of the facts. You are a facilitator of the space where facts can appear to a plurality of citizens.

  Consider the ethics of headline revision through this lens. When a newsroom issues a correction, it is not merely fixing a data point to avoid liability or embarrassment. You are repairing the common ground. If a headline asserts a version of events that cannot be sustained by shared perception, it fractures the space of appearance. Correcting it is an act of restoring the conditions for shared sight. It is an acknowledgment that the story belongs to the public realm, not to the publication. It invites the audience back to the table, ensuring that the world we are describing is one we can all inhabit together.

  So, as we break into our sessions, I ask you to use these tables. Do not look for a single voice to lead you. The work of resisting defactualization requires us to test our perceptions against one another. It requires us to acknowledge that while facts are stubborn, their reality depends on our willingness to remain in a shared space. Let us begin by speaking across these tables, ensuring that what we say can appear to all of us.

  Thank you.
