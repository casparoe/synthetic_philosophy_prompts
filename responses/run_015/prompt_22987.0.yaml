answer: |-
  You have a very sharp eye for this. You are correctly identifying that the **mathematical structure** of both arguments is identical (decision theory), which makes the distinction feel like semantic hair-splitting.

  However, in philosophy, the label "non-pragmatic" isn't referring to the *math* used to prove the theorem; it refers to the **normative force** or the **value** being maximized.

  Here is the breakdown of why the distinction exists, why your skepticism is actually a major debate in the field, and what you might be "missing" (which is mostly the specific philosophical definition of "pragmatic").

  ### 1. The Math is the Same (You are right)
  You are absolutely correct that both arguments use decision-theoretic tools.
  *   **Dutch Book:** Defines a utility function over **money**. Shows that if you violate probability axioms, there is a strategy that guarantees a loss (dominated strategy).
  *   **Epistemic Utility:** Defines a utility function over **accuracy** (e.g., the Brier Score). Shows that if you violate probability axioms, there is an alternative belief state that is guaranteed to be more accurate (dominated strategy).

  Both say: "If you want to maximize $X$, you must be probabilistic."
  So, structurally, they are isomorphic.

  ### 2. The Definition of "Pragmatic"
  In this context, "pragmatic" does not mean "using practical reasoning tools." It means **"dependent on practical consequences."**

  *   **Pragmatic Argument (Dutch Book):** The reason you shouldn't be incoherent is that it will hurt you **in the world**. It will cost you money, ruin your bets, or lead to bad actions. The norm is instrumental: *Belief is a tool for action.* If you never acted on your beliefs, the Dutch Book argument suggests you have nothing to worry about.
  *   **Non-Pragmatic Argument (Epistemic Utility):** The reason you shouldn't be incoherent is that your belief state is **intrinsically flawed**. It is less accurate. It fits the world poorly. This norm is constitutive: *Belief aims at truth.* Even if you are a brain in a vat who never makes a single bet or moves a muscle, having incoherent credences means your mind is in a worse state relative to the truth.

  **The Distinction:**
  *   **Dutch Book:** "You should be probabilistic so you don't get **richer/poorer**." (Extrinsic value)
  *   **Epistemic Utility:** "You should be probabilistic so you aren't **wronger**." (Intrinsic value)

  ### 3. Why the Label Matters (The "So What?" Test)
  The label "non-pragmatic" is trying to solve a specific problem with the Dutch Book argument called the **Relevance Objection**.

  Critics of the Dutch Book argument say: *"Why should I care about bets? I'm not a gambler. I just want to know what's true."*
  If the only reason to be probabilistic is to avoid losing money, then probabilism is a rule of **gambling**, not a rule of **reason**.

  The Epistemic Utility theorists (like James Joyce) want to say: "No, probabilism is a rule of reason itself. Even if you never bet, you are violating a norm of rationality if your beliefs aren't probabilistic, because you are needlessly distancing yourself from the truth."

  So, "non-pragmatic" is shorthand for **"independent of action and practical consequences."**

  ### 4. Your Skepticism is Actually a Famous Objection
  Here is the part where you are arguably *more* right than the textbooks.

  Many philosophers agree with you: **If you use decision theory to justify belief norms, haven't you just smuggled pragmatism back in?**

  This is known as the **Means-Ends Critique**.
  *   Decision theory is a theory about how to choose *means* to achieve *ends* (utilities).
  *   By framing epistemology as "Maximize Expected Accuracy," Epistemic Utility Theory treats accuracy as a *goal* you are trying to achieve.
  *   But is accuracy a goal you choose? Or is it what belief *is*?

  If I say, "You ought to maximize accuracy," that sounds like a hypothetical imperative: *"If you want accuracy, do X."* That looks pragmatic (instrumental).
  Joyce and others argue it's a **constitutive norm**: *"To believe just IS to aim at accuracy. Therefore, you don't have a choice."*

  Critics (like Alan Hájek) argue that the Epistemic Utility argument is still "pragmatic" in a deeper sense because it treats rationality as an optimization problem. They argue that using *any* utility maximization framework imports pragmatic values into epistemology.

  ### 5. Summary: What you were missing
  You weren't missing the math; you were missing the specific philosophical stipulation of the word "pragmatic."

  1.  **In common parlance:** "Pragmatic" means "using practical tools." (By this definition, you are right, EUT is pragmatic).
  2.  **In this philosophical context:** "Pragmatic" means "relying on practical consequences like money, survival, or successful action." (By this definition, EUT is non-pragmatic because it relies only on truth/accuracy).

  **The Verdict:**
  The label isn't *empty*, but it is **contested**.
  *   **Proponents** say it's non-pragmatic because it isolates the value of truth from the value of money/action.
  *   **Critics (like you)** suggest that because it uses the *logic* of prudence (maximizing utility), it might still be pragmatic in disguise.

  You have essentially rediscovered a live debate in formal epistemology regarding whether "epistemic utility" is truly distinct from "pragmatic utility," or if it's just pragmatism wearing a truth-shaped mask.
