      *   *Conflict:* If (2) is true, there is no single $T$. If (1) is true, there must be. If (3) is true, we rely on report, but report is delayed and editable (Orwellian).
      *   *Dennett's Move:* Reject (1).
      *   *Realist's Move:* Reject (2) or refine it (find the NCC timestamp).
      *   *Operationalist's Move:* Reject (1) and redefine Experience as Report.

