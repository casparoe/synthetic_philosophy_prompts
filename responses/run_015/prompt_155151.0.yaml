  **Note on the Debate and the Poem**

  In contemporary aesthetics, it is settled that we rely on aesthetic testimony constantly; the live question is what such reliance delivers. Optimists argue testimony can transmit aesthetic knowledge akin to historical fact, while pessimists contend that genuine appreciation requires first-hand acquaintance, either for epistemic justification or as a constitutive norm. Disagreement remains over whether testimony yields mere true belief, knowledge, or understanding.

  This poem presupposes the pessimist view: that testimony yields verdict-sensitivity without merit-sensitivity. It simplifies the debate by presenting a "swap case" where the speaker couldn't tell if the canvas changed; many optimists would argue genuine appreciation entails noticing such features. The poem also treats the acquaintance requirement as an insurmountable barrier rather than a gradual spectrum. Philosophically, the refrains do the heavy lifting: the first enacts the reliable transmission of the verdict, the second the irreducible indexicality of experience. The final quatrain leaves them unresolved not to dismiss the optimist case, but to acknowledge the speaker's genuine commitment to both the critic's authority and the necessity of her own presence, even if she cannot bridge the gap between them.
