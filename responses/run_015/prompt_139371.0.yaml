answer: |-
  1. There is no single canonical term, though this is a central critique in behavioral welfare economics regarding the welfare justification of nudges. You will find near-misses in literature discussing the impossibility of inferring latent preferences from manipulated choices without independent evidence.

  2. Endogenous preferences describe values shifting over time, whereas your case concerns using constructed choices to justify the intervention itself. Revealed preference theory assumes choices reflect welfare, but fails here because the choice architecture determines the selection rather than reflecting prior intent.

  3. Stickiness does not defeat the complaint but relocates it, suggesting the nudge corrected a friction rather than revealing a pre-existing strong preference. It shows the preference is now real, but not that it was the valid prior justification for the intervention.

  4. The recommender-system case is the same pattern because the algorithm shapes the choice set to generate engagement, which is then misread as independent user desire. Both instances conflate the output of a manipulative system with evidence of prior intent.

  5. I propose "Normative Bootstrapping," defined as justifying an intervention by citing behavioral outcomes that the intervention itself produced. A boundary case on one side is genuine education that expands capacity, and on the other is coercive mandates that remove choice entirely.
