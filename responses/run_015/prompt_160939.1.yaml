answer: |-
  Here is a procedure designed for your team's constraints. It treats Higher-Order Evidence (HOE) not as a philosophical puzzle but as a risk adjustment layer on top of your existing aggregation. It forces you to separate *what you think* from *how much you trust what you think*.

  ### The Procedure: HOE Triage & Adjustment

  This process is designed to run after your standard forecasting aggregation but before the final number is locked for the sheet. It consists of four gates. If you pass through a gate without triggering an adjustment, you move to the next. If you trigger an adjustment, you apply it and stop; do not stack adjustments unless multiple distinct sources of HOE exist.

  **Gate 1: The Laundering Check**
  Before counting a disagreement as HOE (the bare fact that someone disagrees), ask if you have already counted it as First-Order Evidence (the content of their argument). If you have discussed their reasons and rejected them based on merit, the bare fact of their disagreement is now "laundered." It has no additional weight. To prevent manufacturing HOE, we also require that disagreement be "costly"—it must be written down or staked, not just spoken loudly in a meeting. Cheap talk does not count as HOE.

  **Gate 2: The Domain & State Check**
  Reliability evidence only applies if the flaw matches the question. Bad calibration on macroeconomics does not license downgrading a protein folding forecast. Similarly, temporary states (fatigue, anger) only count if the work *cannot* be fully checked by others. If the reasoning is "surveyable"—meaning every step is written out and verified by a peer—the temporary state of the author is irrelevant. The math is correct regardless of the mood of the calculator.

  **Gate 3: The Independence Check**
  Agreement only boosts confidence if it is independent. If the team converged because everyone read the same thread, talked to the same source, or shares the same bias, you do not have six views; you have one view echoed six times. You must discount confidence to reflect the effective number of independent sources, not the headcount.

  **Gate 4: The Publication Gap (Akrasia)**
  This is the decision rule for when your First-Order View (what you think is true) conflicts with your Second-Order View (how much you trust that thinking). If HOE suggests your reasoning is unreliable, but you cannot find a specific error in the reasoning, you are in epistemic akrasia. You believe P, but you believe you shouldn't believe P strongly. The rule is: **Publish the Second-Order Confidence.** The sheet represents the org's reliable betting position, not the team's internal psychological state. You mark the internal log with a "Reliability Flag" to track these cases for later review.

  **What will predictably go wrong the first time:** Your team will try to use Gate 1 to shield their own views from updating ("I already considered your argument, so your disagreement counts for nothing"). The Facilitator must enforce honesty: did you *actually* engage the merit, or did you just dismiss it? Also, people will feel uneasy publishing a number they don't personally endorse (Gate 4). Remind them the sheet is for capital allocation, not personal identity.

  | Step | Question to ask | What counts as a sufficient answer | Where it exits | Who signs off |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Is this HOE source just a disagreement we already evaluated on merit? | Yes = We discussed their reasons and rejected them specifically. No = They just said "I disagree" or gave new reasons. | If Yes, exit HOE process (keep current number). | Facilitator |
  | 2 | Is the disagreement "costly" or cheap talk? | Costly = Written in doc, bet placed, or public stance. Cheap = Verbal only, anonymous, or easily reversible. | If Cheap, exit HOE process (keep current number). | Facilitator |
  | 3 | Does the reliability flaw apply to this specific question type? | Yes = Flaw matches domain (e.g., bad at macro, question is macro). No = Flaw is orthogonal (e.g., bad at macro, question is bio). | If No, exit HOE process (ignore the flaw). | Lead Analyst |
  | 4 | Is the reasoning fully surveyable (checkable) by others? | Yes = Every step written, verified by peer. No = Relies on intuition, hidden data, or unchecked leaps. | If Yes, exit HOE process (ignore fatigue/state flaws). | Peer Reviewer |
  | 5 | Did the agreement come from a common cause (same source/thread)? | Yes = Everyone saw the same triggering info. No = Independent research paths. | If Yes, reduce confidence to reflect effective independent N. | Facilitator |
  | 6 | Does HOE suggest lower confidence than our First-Order view? | Yes = We trust the reliability metric more than our current reasoning. No = We stand by our reasoning despite HOE. | If Yes, publish lower confidence (Second-Order). | Team Lead |

