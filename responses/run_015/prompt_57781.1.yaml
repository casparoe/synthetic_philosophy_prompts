      *   **Context:** Retired, gardening, listening to podcasts, bothering old lab mates. Watched *Interstellar* with grandkids.
      *   **Task:** Explain *Interstellar* through the lens of philosophy of time (Presentism vs. Eternalism vs. Growing Block).
