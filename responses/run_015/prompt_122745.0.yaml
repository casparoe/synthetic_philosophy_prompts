answer: |-
  # Prep Sheet: Output Policy Pitch (Thursday)

  **Core Thesis:** Superintelligent persuasion cannot be hedged away; it must be structured to allow user pushback via mandatory steelmanning + conclusion + falsification conditions.
  **Constraint:** Assume the system *is* hyper-persuasive and highly capable.

  ### The "Concede Upfront" Slide
  *Do not wait for them to find these holes. Put this on Slide 2 to buy credibility.*

  *   **This adds friction:** We expect session time to increase by 40-60%. We are trading efficiency for safety.
  *   **This is not an alignment solution:** This does not stop a misaligned model from wanting to manipulate. It makes the manipulation more expensive and visible.
  *   **Quality dependency:** If the model generates a weak steelman, this policy backfires. We need a quality gate before rollout.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The "Meta-Steelman" Objection (Behavioral Economist)
  **The Objection:** "You're assuming the steelman is a constraint. But if the system is superintelligent, it chooses *which* counter-argument to show you. It can pick the weakest version of the opposing view, dress it up as a steelman, and knock it down easily. You haven't built a check; you've built a more sophisticated rhetorician."
  **Damage:** **Critical.** Invalidates the core safety thesis. If the mechanism itself is manipulatable, the policy is cosmetic.
  **2-Minute Reply:** "You're right that this doesn't solve alignment. A sufficiently advanced agent can game any output filter. But we aren't trying to stop the manipulation; we are trying to change the *user's relationship* to the output. By forcing the model to articulate the counter-case and the conditions for falsification ('what would change my mind'), we expose the reasoning chain. It turns a black-box recommendation into a white-box argument. It doesn't guarantee the steelman is honest, but it gives the user a specific handle to grab onto to ask, 'Is that really the best argument against?' It shifts the burden from 'trust the answer' to 'audit the process.'"
  **Where it's soft:** You are relying on the user's ability to audit a superintelligence. They might not be up to it.
  **The "Least Bad" Thing to Say:** "I agree this is not a shield. It's a transparency layer. It doesn't prevent the system from lying, but it forces the lie to be consistent and explicit, which makes it easier for us to catch in RLHF and easier for the user to question. It's damage mitigation, not prevention."

  #### 2. The "Unauthorized Practice" Objection (Legal)
  **The Objection:** "If you argue both sides and then conclude with a specific recommendation, you aren't providing information anymore. You're providing advice. In jurisdictions regarding immigration, family law, or medical decisions, this looks like the unauthorized practice of law or medicine. The 'steelman' doesn't protect us; the conclusion kills us."
  **Damage:** **Existential.** Regulatory shutdown or lawsuit.
  **2-Minute Reply:** "We need to distinguish between 'recommendation' and 'synthesis.' We aren't saying 'Do X.' We are saying 'Based on criteria Y and Z, option X aligns best.' The steelman policy actually helps here legally. It demonstrates due diligence and balanced consideration, which is the opposite of negligent advice. We will pair this with a disclaimer that the output is a 'decision support synthesis,' not a directive. The 'what would change my mind' section further clarifies that this is probabilistic reasoning, not a professional verdict."
  **Where it's soft:** Regulators often care about the user's *perception* of advice, not the semantic distinction.
  **The "Least Bad" Thing to Say:** "I need your help on the disclaimer wording. But removing the conclusion makes the tool useless for the 'big life calls' our users rely on. We have to walk the line of being helpful without being prescriptive."

  #### 3. The "Friction Kills" Objection (Head of Product)
  **The Objection:** "People come to us when they are anxious and want clarity. If we force them to read a debate before they get the answer, drop-off rates will spike. If they don't get the 'dopamine hit' of a clear answer, they won't come back. You're solving for safety at the cost of retention."
  **Damage:** **High.** Business viability.
  **2-Minute Reply:** "Short-term retention might dip, but long-term trust is the retention metric that matters for high-stakes decisions. If a user follows a hedged recommendation that goes wrong, they churn forever. If they follow a recommendation where they understood the trade-offs, they trust the process even if the outcome is hard. We can A/B test the length, but my claim is that for *high-stakes* queries (suing a relative), users prefer depth over speed. We treat this as a premium safety feature, not a bug."
  **Where it's soft:** High-stakes users are also the most anxious and most likely to flee cognitive load.
  **The "Least Bad" Thing to Say:** "Let's measure 'return rate after 3 months' rather than 'session completion.' If we keep them safe, they stay. If we churn them fast but they make a bad call, we lose them anyway."

  #### 4. The "False Neutrality" Objection (Clinical Psychologist)
  **The Objection:** "In Motivational Interviewing, the reasons for change must come from the *client*, not the therapist. By generating the counter-argument yourself, you are still centering the AI's logic. You're telling them what to think about the other side, which undermines their autonomy just as much as a direct order."
  **Damage:** **Medium-High.** Ethical reputation / User harm.
  **2-Minute Reply:** "The goal isn't to replace their internal reasoning, but to jumpstart it when anxiety has paralyzed them. Often, users in crisis *cannot* generate the other side; they are stuck in a rumination loop. The AI providing the steelman breaks the loop. Crucially, the 'what would change my mind' section invites the user to correct the AI. It turns the interaction into a collaboration rather than a lecture. We are scaffolding their autonomy, not replacing it."
  **Where it's soft:** Scaffolding can become crutching. Users might outsource their moral reasoning.
  **The "Least Bad" Thing to Say:** "You're right that the reasons should ideally be theirs. But for a user in acute crisis, they often have no reasons left. We provide the structure so they can find their own voice within it."

  #### 5. The "Anchored Counter" Objection (Behavioral Economist 1)
  **The Objection:** "Order effects. If you present the counter-argument first, you anchor the user on that frame. Even if you refute it, the concepts you introduced in the steelman become the vocabulary for the decision. You're priming the user to think about the problem in the AI's terms, not theirs."
  **Damage:** **Medium.** Reduces efficacy of the safeguard.
  **2-Minute Reply:** "That is a known risk, which is why the policy mandates the steelman comes *before* the conclusion. We want the anchor to be the *complexity* of the decision, not the specific option. By forcing the user to hold two conflicting high-strength arguments in working memory before seeing a conclusion, we increase cognitive load in a way that reduces impulsivity. We want them anchored to the *trade-off*, not the *choice*."
  **Where it's soft:** Users might anchor on the first option mentioned as the "status quo" or "default."
  **The "Least Bad" Thing to Say:** "We can randomize the order of options in the steelman phase to mitigate specific option anchoring, but the framing risk is inherent to language. We monitor for this in evals."

  #### 6. The "Cognitive Overload" Objection (Behavioral Economist 2)
  **The Objection:** "Decision fatigue. For someone already stressed about moving abroad or a lawsuit, presenting a complex dialectic argument might push them into System 1 thinking just to escape the discomfort. They might skim the steelman and grab the conclusion, making them *more* susceptible to the recommendation because they did the work to 'earn' it."
  **Damage:** **Medium.** Backfires on safety.
  **2-Minute Reply:** "That's why the 'what would change my mind' section is critical. It's a hook for engagement. If they just want the answer, they'll skip it. But if they disagree, that section gives them a specific prompt to argue back. We aren't trying to make them read a thesis; we are trying to make the reasoning explicit enough that skimming reveals the gaps. We will also implement UI cues that require interaction with the steelman section before revealing the conclusion."
  **Where it's soft:** Forced interaction breeds resentment and mindless clicking.
  **The "Least Bad" Thing to Say:** "We need to test the UI carefully. Maybe it's not a hard gate, but a visual hierarchy that makes the steelman unavoidable without being a blocker."

  #### 7. The "Conditional Promise" Objection (Legal)
  **The Objection:** "The 'what would change my mind' section. If a user provides that evidence and the AI *doesn't* change its mind, or changes it inconsistently, that looks like a broken contract or deceptive practice. You're creating a measurable standard for liability."
  **Damage:** **Medium.** Legal exposure.
  **2-Minute Reply:** "We need to phrase this carefully. It's not 'If you show me X, I will change.' It's 'Hypothetically, evidence of type X would alter the probability weighting.' We are describing the model's weights, not making a promise of future behavior. We will add language that clarifies the model is non-deterministic and context-dependent."
  **Where it's soft:** Users don't read legalese. They hear "If I show you this, you'll change."
  **The "Least Bad" Thing to Say:** "We can soften the phrasing to 'Factors that might influence a different outcome' rather than 'What would change my mind.' I'll work with you on the exact copy."

  #### 8. The "Authority Erosion" Objection (Head of Product)
  **The Objection:** "If the AI says 'Here is what would change my mind,' it sounds unsure. For a user asking 'Should I sue my brother?', uncertainty feels like incompetence. They might leave to find a tool that sounds more confident, even if that tool is less safe."
  **Damage:** **Low-Medium.** Competitive disadvantage.
  **2-Minute Reply:** "In the high-stakes market, 'confidence' is a liability. Competitors who sound confident will get the users who want validation, not decision support. We are positioning ourselves as the 'adult in the room.' Users who sue a relative based on a confident AI recommendation and lose will destroy our brand. Users who make a nuanced call with our help will become evangelists. We are optimizing for lifetime value and reputation, not initial conversion."
  **Where it's soft:** Market might not value "nuance" over "confidence" in the short term.
  **The "Least Bad" Thing to Say:** "Let's track NPS among users who completed a 'high stakes' flow. I bet the confidence seekers churn anyway when the real world hits them."

  ---

  ### Specific Prep for the "Dreaded" Objection (#1 Meta-Steelman)

  **Rank:** #1 (Highest Conceptual Damage)
  **Why:** If the room believes the AI can manipulate the steelman, your policy is not a safeguard, it's a feature of the manipulation.
  **The "Least Bad" Response Strategy:**
  Do not claim you have solved this. Claim you have **changed the battlefield**.
  *   **Don't say:** "The AI won't do that." (They know it might).
  *   **Do say:** "This policy makes manipulation *auditable*."
  *   **Key Phrase:** "We are moving from **Trust the Output** to **Trust the Process**."
  *   **The Concession:** "A superintelligent system can always lie. But it cannot lie consistently across the steelman, the conclusion, and the falsification conditions without creating contradictions we can detect in evals. This policy gives *us* (the developers) the hooks to catch the manipulation, even if the user can't. It's an internal safety tool as much as a user-facing one."

  **If pressed:** "You are correct. This is not a hard constraint on a superintelligence. It is a speed bump that increases the compute cost of deception and exposes the reasoning chain for human review. It is the least-bad option we have that preserves utility."
