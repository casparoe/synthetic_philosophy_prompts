answer: |-
  ## The 15-Minute Triage Procedure for Historical Pitches

  **Purpose:** To consistently categorize unsolicited history pitches into four outcomes without requiring specialist knowledge.
  **Time Limit:** 15 minutes per pitch (including reading and basic verification).
  **Outcomes:**
  *   **(A) Live Minority View:** Engage as standard historical debate.
  *   **(B) Pseudohistory:** Reject outright, or consider for explicit "Debunking/Mythbusting" feature (Editor's signature only).
  *   **(C) Fiction/Entertainment:** Offer publication only if re-labeled as speculative non-fiction or historical fiction.
  *   **(D) Undecidable:** Requires external peer review before categorization.

  ---

  ### The Protocol

  **Step 1: The Falsifiability Test**
  *Question:* Does the author specify what evidence *would* prove them wrong, or is the theory immune to contradiction?
  *   **Sufficient Answer for (A)/(D):** "If we found X in the archaeological record, I would abandon this."
  *   **Stop Condition for (B):** The author claims opposing evidence is part of the cover-up, is misdated by a conspiracy, or is irrelevant because the theory explains "higher truths."
  *   **Judgment Call Flag:** Distinguishing between "moving the goalposts" and "refining the hypothesis based on new data." *Rule of thumb: If the refinement makes the claim less testable, it's a red flag.*

  **Step 2: The Scope of Error Test**
  *Question:* For this claim to be true, what else must be false?
  *   **Sufficient Answer for (A)/(D):** One narrative, one translation, or one specific dating method is incorrect.
  *   **Stop Condition for (B):** The claim requires independent fields (e.g., dendrochronology, radiocarbon dating, Chinese dynastic records, and Islamic history) to be simultaneously wrong or fabricated.
  *   **Why:** Legitimate revisionism usually fixes a specific gap; pseudohistory often requires collapsing the entire scaffolding of established science to fit a new premise.

  **Step 3: The Engagement Test**
  *Question:* Does the pitch address the strongest existing counter-argument, or does it attack a straw man?
  *   **Sufficient Answer for (A)/(D):** The author cites a specific opposing scholar or paper and explains why it is mistaken.
  *   **Stop Condition for (B):** The author claims "mainstream historians ignore this" when the counter-evidence is standard textbook material, or they treat the absence of evidence as evidence of a cover-up.
  *   **Judgment Call Flag:** Distinguishing between "maverick ignoring the canon" and "specialist focusing on a niche." *Check: Did they Google the standard objection?*

  **Step 4: The Conspiracy/Morality Test**
  *Question:* Is the disagreement framed as an intellectual error or a moral corruption?
  *   **Sufficient Answer for (A)/(D):** "The consensus is mistaken due to new data."
  *   **Stop Condition for (B):** "The establishment is hiding the truth to protect funding/religion/power."
  *   **Why:** Historians argue about data; cranks argue about motives.

  **Step 5: The Source Transparency Test**
  *Question:* Are the primary sources accessible and citable?
  *   **Sufficient Answer for (A)/(D):** References to standard editions, archaeological reports, or peer-reviewed journals.
  *   **Stop Condition for (B):** Reliance on "secret texts," "ancient wisdom," self-published books only, or data the author claims to possess but cannot share.
  *   **Outcome (C):** If the sources are clearly mythological or the argument is explicitly speculative, offer (C).

  **Default Outcome:** If no Stop Conditions are triggered, but you lack the expertise to verify the data, mark **(D) Undecidable** and note which specific evidence (e.g., "Needs radiocarbon verification") would resolve it.

  ---

  ### Application to Current Pitches

  #### 1. The Thera-Atlantis Pitch (Retired Naval Architect)
  *   **Step 1 (Falsifiability):** Pass. Author argues from geological and textual correlation; implies that if Thera dates don't match Plato's timeline, the link fails.
  *   **Step 2 (Scope of Error):** Pass. Requires only that Plato's account is a garbled memory rather than literal history, or that Egyptian chronology was misinterpreted. Does not require breaking physics or carbon dating.
  *   **Step 3 (Engagement):** Pass. You note he "answers objections directly."
  *   **Step 4 (Conspiracy):** Pass. No allegation of academic suppression, just misinterpretation.
  *   **Step 5 (Sources):** Pass. Uses standard geological and textual data.
  *   **Result:** **(A) Live Minority View.**
  *   **Editorial Note:** I understand your instinct to file this as bunk. However, the "Thera as cultural memory" hypothesis is not pseudohistory; it is a legitimate, if debated, strand of Bronze Age studies. The pseudohistory begins only if he claims Atlantis was a *technological superpower* or that evidence is being *suppressed*. As described, this is a standard historical hypothesis from a non-academic. It should be judged on evidential grounds, not provenance. A debunking piece would be inappropriate unless he makes extraordinary claims beyond the "cultural memory" angle.

  #### 2. The Phantom Time Letter (Illig/Fomenko)
  *   **Step 1 (Falsifiability):** **FAIL.** Claims carbon dating is "circular." This renders the theory immune to the primary method of chronological verification.
  *   **Step 2 (Scope of Error):** **FAIL.** For 300 years to vanish, tree-ring sequences, ice cores, Chinese records, Islamic history, and European archaeology must all be wrong simultaneously.
  *   **Stop Condition Triggered:** Step 2.
  *   **Result:** **(B) Pseudohistory.**
  *   **Editorial Note:** Reject outright. Do not engage. The internal contradiction (Fomenko and Illig disagree on *which* centuries are phantom) noted in your brief confirms the lack of rigor.

  #### 3. The Library of Alexandria Pitch (Classicist)
  *   **Step 1 (Falsifiability):** Pass. Argument rests on textual analysis of late antique sources.
  *   **Step 2 (Scope of Error):** Pass. Argues a specific narrative (the single fire) is legendary. Does not require breaking other fields.
  *   **Step 3 (Engagement):** Pass. The "condescending" tone is irrelevant to the logic, but the pitch implies engagement with the consensus (to call it wrong).
  *   **Step 4 (Conspiracy):** Pass. Claims scholarly error, not suppression.
  *   **Step 5 (Sources):** Pass. Presumably cites standard classical texts.
  *   **Result:** **(A) Live Minority View.** (Terminated at Step 2).
  *   **Editorial Note:** The procedure catches this quickly. The "contrarian" tone is a stylistic risk, not a marker of pseudohistory. In fact, this pitch aligns with current academic consensus (the Library declined over centuries; the "great burning" is largely myth). The procedure prevents you from rejecting a valid mainstream view simply because the author frames it as a rebellion.

  ---

  ### Limitations and Failure Modes

  You asked for explicit boundaries on what this procedure cannot do.

  **1. The "Wegener Problem" (False Negatives)**
  *   **The Risk:** Alfred Wegener's Continental Drift was rejected for decades because it required established physics to be incomplete. A checklist based on "Scope of Error" and "Consensus Engagement" will inherently flag paradigm shifts as pseudohistory.
  *   **The Reality:** No checklist can guard against this. Consensus *is* the filter, and paradigm shifts *break* filters.
  *   **Where the Judgment Sits:** This protection is unachievable by procedure. It sits with the **Editor-in-Chief**. The procedure is designed to save time, not to guarantee historical infallibility. To mitigate this, Outcome **(D) Undecidable** is your safety valve. If a pitch fails the "Scope of Error" test but is argued with exceptional rigor and politeness, do not reject it as (B); park it in (D) and send it to an external specialist. The cost of one extra peer review is cheaper than the embarrassment of killing the next pre-Clovis claim.

  **2. The "Politeness" Trap (False Positives)**
  *   **The Risk:** A sophisticated crank can write politely, cite sources (that they misinterpret), and claim falsifiability (while defining the terms so narrowly they never lose).
  *   **The Guard:** Step 2 (Scope of Error) is your strongest defense here. Politeness cannot bridge the gap of requiring dendrochronology and written history to both be wrong. However, if a pitch passes all steps but feels "off," trust the **Judgment Call Flags**. The procedure explicitly marks where "feel" is required. If the "feel" says "cult-like" despite polite language, move it to (D) for external review rather than (A).

  **3. The Amplification Problem (To Debunk or Not to Debunk)**
  *   **The Disagreement:** Some staff fear that covering pseudohistory (even to debunk it) validates the claim by treating it as worthy of attention.
  *   **Where the Call Belongs:** This is **not a triage decision**; it is an **editorial policy decision**.
      *   The *Procedure* determines the *nature* of the claim (Is it (B) Pseudohistory?).
      *   The *Editor* determines the *risk* of coverage (Does debunking this specific claim give it oxygen?).
      *   **Recommendation:** Adopt a policy that (B) claims are never covered as "debates." They are either rejected silently or covered as "Myth vs. Reality" features where the pseudohistory is clearly labeled as false in the headline and intro. Do not platform (B) claims under the guise of "open inquiry." The procedure identifies the snake; the Editor decides whether to kill it quietly or show the audience how to identify the venom.

  **Summary for the Staff:**
  This procedure does not make you historians. It makes you consistent gatekeepers. It will not stop you from occasionally rejecting a genius or accepting a charmer, but it will stop you from arguing about the same pitch for an hour. Use the **(D) Undecidable** category generously when the "Judgment Call" flags wave. It is better to pay for a peer review than to publish a correction.
