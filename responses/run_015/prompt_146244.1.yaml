      *   **The Tension:**
          *   *Strategy-proofness:* Requires that truth-telling is always the dominant strategy. G-S says this is impossible for ordinal rules without dictatorship.
          *   *Intensity of Preference:* G-S ignores intensity. It only cares about order ($A \succ B \succ C$). In grant review, *how much* better $A$ is than $B$ matters (e.g., transformative vs. incremental).
      *   **The "Misapplication":** The user asks if this means *any* fair allocation rule is dictatorial.
