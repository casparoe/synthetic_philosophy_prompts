answer: |-
  *   The unrepentant father must lack standing; any theory granting him standing is defective.
  *   The punctual but entitled manager must lack standing; compliance alone cannot secure moral authority.
  *   The weak-willed but guilty blamer must retain standing; moral failure differs from moral exemption.
  *   Institutional standing to penalize must be distinguished from moral standing to blame; conflating them obscures the nature of authority.

  The Symmetric Address principle is correct; the Clean Hands principle is fundamentally mistaken. Clean Hands treats standing as a transactional scorecard, assuming that past violations forfeit moral authority until "paid off" by repair. This misunderstands the nature of blame. Blame is not a penalty issued by a judge; it is a moral address between equals. It functions as a demand for reciprocal regard. Therefore, standing depends not on your record, but on whether you regard yourself as subject to the same moral law as the blamee.

  The Manager case (4) decisively refutes Clean Hands. The manager complies perfectly with punctuality norms yet lacks standing because she views the norm as a tool for controlling subordinates, not a binding requirement for herself. She exempts herself from criticism. Clean Hands grants her standing because her hands are clean, but this is counterintuitive. Her compliance is irrelevant because her attitude denies the reciprocity required for moral community. Symmetric Address correctly identifies that her refusal to accept upward criticism negates her standing to demand downward compliance.

  Conversely, the Weak-willed Blamer (3) demonstrates where Clean Hands is too harsh. This agent violates the norm but accepts its bindingness, feeling guilt and welcoming correction. Clean Hands strips her standing because of the unrepaired violation. But she remains a member of the moral community; she acknowledges the demand even while failing to meet it. Symmetric Address correctly preserves her standing because she does not exempt herself. Her weakness is a failure of will, not a rejection of the norm's authority.

  In your case (1), Symmetric Address vindicates your instinct. You have standing because you now accept the norm binds you. Your brother's *tu quoque* confuses standing with credibility. He may reasonably doubt your advice's prudential weight given your history, or feel resentment that you survived harms he risks, but these are pragmatic or emotional barriers, not failures of moral standing. You do not claim exemption; you claim shared vulnerability. Clean Hands would suggest your standing is restored only because you quit, but strictly speaking, if you had quit while still believing vaping was morally permissible for you but not him, you would still lack standing. The quitting matters only as evidence of your changed attitude, not as a reparative transaction.

  The Institutional case (5) requires distinguishing moral standing from institutional authority. A university sanctioning students for AI use while using it itself lacks moral standing to blame (Symmetric Address fails; the institution exempts itself). It cannot coherently address students as moral agents bound by a norm the administration ignores. However, it retains standing to impose penalties. This is not moral blame but contractual enforcement. Students agree to rules as a condition of enrollment. The hypocrisy undermines the legitimacy of the penalty and invites resentment, but it does not void the administrative authority. Clean Hands fails here by conflating the two; Symmetric Address correctly identifies the loss of moral address while leaving room for a separate analysis of institutional power.

  This suggests a third view that subsumes Symmetric Address: The Coherent Demand Condition. A blamer has standing if and only if they can coherently invite the blamee to hold them to the same standard in the same way. This is derived from the function of blame as a protest against a violated relationship. If I blame you, I assert we are equals under a norm. If I exempt myself (Manager), the invitation is incoherent. If I fail but accept the norm (Weak-willed, You), the invitation remains coherent.

  This condition is precise enough for application. To test standing in a new case, ask: "If the blamee responded by blaming the blamer for the same fault, would the blamer regard this as legitimate correction or as an infringement?" If the latter, standing is absent. This avoids intuition-mongering by focusing on the structural consistency of the moral demand rather than the biographical history of the blamer. Clean Hands is merely a heuristic; often, violators do exempt themselves. But the violation itself is not the disqualifier—the exemption is. You possess standing because you are willing to be held accountable exactly as you hold your brother. He is wrong to deny this, though his resistance highlights that standing is necessary but not sufficient for productive moral dialogue.
