prompt: |-
  hey so im in this political philosophy course on democratic theory and weve been talking about sortition and lottocracy, especially the weird tension where a randomly picked mini-public gets real descriptive representativeness but has zero electoral mandate from the people theyre deciding for. my instructor wants each of us to come up with an in-class simulation that makes participants feel that tension in their bones rather than just debating it, and i need help designing mine because im kind of stuck. we have about 16 students, one 75 minute session, movable chairs, and no budget for real money so any stakes have to be social or symbolic. i want to inject a twist that makes the representativeness problem sharper: instead of a generic policy vote, the randomly selected group should have to make a binding-style decision about an intergenerational climate allocation, splitting a fixed pool of points between immediate student perks and long-term carbon offsets that mostly benefit people not present in the room. please design the full activity including rules, roles, how the random selection happens, the payoff or pressure structure, a timeline for the session, and then a debrief that maps each stage onto the philosophical issues about consent and statistical mirroring. also please be honest about which feature of real-world sortition this simulation cannot reproduce and i will have to supply in discussion. write everything in continuous prose with no headings, no bullet points, no bold text, and no tables, just like a long casual email. use american english please. oh and i definitely misspelled "representativeness" somewhere above probably, sorry lol.
