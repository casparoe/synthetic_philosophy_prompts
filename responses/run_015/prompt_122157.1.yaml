answer: |-
  Hey there, that sounds like a fantastic course and honestly sortition is one of those topics that feels totally abstract until you actually put people in the room and make them live through the awkwardness of it, so you are definitely on the right track trying to simulate the feeling rather than just talking about it. Since you have sixteen students and seventy-five minutes, you have just enough time to make this sting a little bit without running over, and the intergenerational climate twist is perfect because it adds a layer of moral pressure that mimics the real-world weight of political decisions while keeping the stakes symbolic enough that nobody actually loses money. Here is how I would structure the whole thing if I were in your shoes, written out as a continuous flow so you can just adapt it to your handout or lesson plan.

  You want to start by setting the room up so there is a clear physical separation between the governing body and the governed, so take four chairs and put them in a tight cluster at the front or center of the room, and then arrange the remaining twelve chairs in a semi-circle around them but far enough away that conversation between the groups is impossible once the simulation starts. Tell the class that the entire session is a simulation of a democratic decision regarding a fixed pool of one hundred class capital points, and explain the exchange rate clearly so everyone understands the trade-off, where every point spent on immediate perks gets them something tangible like a pizza party at the end of the semester or a collective extension on a deadline, while every point spent on long-term offsets gets donated to a carbon removal project in their name but yields zero immediate benefit to anyone in the room. The crucial rule you need to establish early is that the decision made by the selected group is binding, meaning the rest of the class has to live with the outcome even if they hate it, which is where the tension starts to brew before you even pick anyone.

  To handle the selection process in a way that highlights descriptive representativeness versus electoral mandate, you should avoid any volunteering and instead use a literal lottery, so get a hat or a box and put all sixteen names in it and draw four names publicly to serve as the Mini-Public Council while the remaining twelve become the Constituent Public. Once the four are selected, have them move to the central cluster of chairs and give them a printed brief that includes some basic data on the climate impact versus the social benefit of the pizza party, but keep the deliberation time tight at about twenty minutes to simulate the pressure of real governance without giving them enough time to become experts. While the Council deliberates, the Constituent Public must remain silent in their outer semi-circle, perhaps giving them a worksheet where they write down what they hope the Council decides versus what they think the Council will decide, which keeps them engaged but powerless and really drives home the lack of electoral authorization. You should walk around during this phase and remind the Council that they are statistically representative of the room but have no instruction from the people they represent, and remind the Public that they cannot intervene even if they think the Council is making a mistake.

  When the twenty minutes are up, the Council must announce their allocation split out loud, and this is the moment where the social pressure peaks because they have to look the twelve unselected students in the eye and justify why they took away their pizza party for the sake of people who aren't even born yet, or vice versa. After the announcement, give the Constituent Public five minutes to react verbally, allowing them to express anger or relief, which simulates the post-decision accountability gap in lottocracy since the Council cannot be voted out next term. Then you move into the debrief for the final thirty minutes, and this is where you map the experience to the theory by asking the Council how it felt to have power without a mandate and whether they felt more responsible to the people in the room or the abstract future generations, which touches on the trustee versus delegate model of representation. Ask the Public how it felt to be descriptively represented by peers who were randomly chosen but not authorized by them, and whether the statistical mirroring of the group made the decision feel more legitimate than if the professor had just decided it themselves, which gets at the core tension between legitimacy through consent versus legitimacy through composition.

  You should also guide the discussion toward the intergenerational aspect by asking if the lack of electoral mandate matters less when the beneficiaries are absent future people who cannot vote anyway, which complicates the standard democratic theory objection that sortition lacks consent. Make sure to point out that the randomness ensured the Council probably looked like the class in terms of major demographics, which satisfies the descriptive representativeness criterion, but contrast that with the fact that none of the Public agreed to be bound by this specific group's judgment, which highlights the electoral mandate deficit. This is the perfect spot to bring in readings or concepts you've covered about whether democracy requires actual consent or just fair procedures, and you can ask if the randomness felt fairer than an election would have been given the selfish incentives involved in the climate choice.

  Now I need to be honest with you about the limitations because your instructor will definitely ask what this simulation fails to capture, and the biggest thing you cannot reproduce here is the informed deliberation phase that real citizens assemblies use. In a real-world sortition process like the Irish Constitutional Convention or the French Citizens Convention on Climate, the selected members get months of time, expert testimony, and paid leave to understand the issue deeply, whereas your students only have twenty minutes and a handout, so their decision is based on intuition rather than informed judgment. You also cannot reproduce the systemic integration of sortition, because in reality a mini-public is usually advisory to a legislature or part of a mixed system, whereas here you made them fully binding which exaggerates the accountability problem. Another missing feature is the stakeholder engagement, since real assemblies often hear from advocacy groups and affected parties, but your simulation isolates the Council which makes them seem more elitist than they would be in practice. You will have to supply this in the discussion by explaining that real sortition is designed to be slow and resource-intensive to mitigate exactly the kind of rash decision-making they might exhibit today, and that the lack of payment in your simulation removes the economic barrier to participation that real lotteries try to solve.

  Hopefully this gives you a solid backbone for the session and don't worry about the spelling because honestly political philosophy terms are a nightmare to type quickly and everyone knows what you meant. The key is to let the awkward silence hang in the room when the Council is deciding and when the Public is reacting, because that discomfort is exactly where the learning happens regarding the tension between being a statistical mirror and having actual authority. Good luck with the simulation and I hope the class doesn't get too mad at you if the Council votes against the pizza party.
