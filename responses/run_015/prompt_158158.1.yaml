answer: |-
  The explanatory move you are describing is most precisely captured by the convergence of three philosophical concepts: **Daniel Dennett's "Design Stance,"** **David Marr's "Computational Level,"** and the **New Mechanists' account of "Functional Mechanisms."**

  While there is no single word that encapsulates the entire ontology, the specific explanatory level you are identifying is widely referred to in philosophy of science as **Functional Explanation** grounded in **Naturalized Teleology**.

  Here is the breakdown of the concept, its boundaries, its distinction from mere heuristics, and its ontological status.

  ### 1. The Core Concept: The Design Stance
  Daniel Dennett explicitly categorized this mode of prediction in *The Intentional Stance* (1987). He distinguished three strategies for predicting a system's behavior:
  1.  **The Physical Stance:** Predicting based on physical laws (chemistry, circuitry). Accurate but often computationally intractable and blind to organization.
  2.  **The Intentional Stance:** Predicting based on beliefs and desires (reserved for agents).
  3.  **The Design Stance:** Predicting based on the assumption that the system is **organized to perform a function**, without regard for how it is physically implemented or whether it has a mind.

  When a clinician treats a kidney as a "filter," they are adopting the Design Stance. They assume the system was "designed" (by evolution or engineering) to achieve a goal. This allows them to predict that if the filter is clogged, waste will accumulate, regardless of the specific molecular bonds involved.

  **Why this fits your description:**
  *   It treats the system as purpose-built.
  *   It requires no conscious agent (evolution "designs" without a mind).
  *   It is distinct from the physical stance (chemistry doesn't explain *failure*, only *state*).

  ### 2. Ontological Status: Real Patterns vs. Useful Fictions
  You asked whether this level is "real" or just a "useful fiction." This is the central debate in the philosophy of special sciences. The prevailing view among philosophers of biology and cognitive science (including Dennett, Ladyman, and Ross) is **Real Pattern Ontology**.

  A pattern at the functional level counts as **real** (not merely fictional) if it satisfies two criteria:

  #### A. Counterfactual Robustness (The Intervention Test)
  A mere heuristic is a shortcut that works *ceteris paribus* (all else being equal). A real functional level supports **interventionist causation** (associated with philosopher James Woodward).
  *   **Fiction:** If I say "the car stopped because it was tired," I cannot intervene on the "tiredness" to make it go.
  *   **Real Functional Level:** If I say "the kidney failed because filtration pressure dropped," I can intervene on the pressure (via drugs or dialysis) to restore function.
  *   **The Boundary:** If manipulating the *functional variable* (e.g., sorting efficiency, filtration rate) reliably changes the outcome, independent of the specific physical substrate, the functional level is causally real.

  #### B. Informational Compression
  Dennett argues a pattern is real if it allows for lossless (or near-lossless) compression of information. Describing a kidney in terms of quantum states is accurate but contains too much noise. Describing it as a "homeostatic regulator" captures the **organizational regularity** that persists across physical variations (e.g., a kidney works whether the atoms are carbon-12 or carbon-13). The pattern is real because it tracks invariants that the physical level obscures.

  ### 3. Distinguishing from "Mere Heuristic"
  The boundary between a "real functional explanation" and a "pedagogical metaphor" is **Normativity**.

  *   **Heuristic/Metaphor:** "The cell is like a factory." This is a comparison. If the cell deviates from factory behavior, it's just a limitation of the metaphor.
  *   **Functional Explanation:** "The ribosome *should* translate mRNA." This posits a **norm**.
      *   In the physical stance, a mutation is just a different arrangement of atoms.
      *   In the functional stance, a mutation is a **malfunction** or **pathology**.
      *   **The Test:** If the explanatory framework allows you to distinguish between *variation* (acceptable deviation) and *error* (failure of function), it has crossed into ontological reality. Pathology is not a physical category; it is a functional one. The fact that clinicians can objectively diagnose pathology proves the functional level is not just a fiction.

  ### 4. The "No Designer" Resolution: Etiological vs. Systemic Function
  You noted the researchers deny a hidden agent. Philosophy resolves this via two accounts of function:

  1.  **Etiological Function (Millikan, Wright):** A trait has a function if it was **selected for** that effect in the past. The heart pumps blood *because* ancestors who pumped blood survived. This grounds "purpose" in history, not current intent.
  2.  **Systemic Function (Cummins):** A trait has a function if it contributes to the **capacity of the containing system**. The kidney filters because that contribution explains the organism's ability to maintain homeostasis.

  **Boundary Condition:**
  *   **Inside the Category:** Systems with a history of selection (biology) or a history of engineering specification (technology). These have "proper functions."
  *   **Outside the Category:** A rock rolling down a hill. It moves, but it has no function. A vortex in a fluid. It organizes, but unless it contributes to a larger system's capacity or was selected for, it is not a "functional mechanism."

  ### 5. Summary of Boundaries and Commitments

  | Feature | Inside This Category (Functional/Mechanistic Level) | Outside (Physical Stance or Mere Metaphor) |
  | :--- | :--- | :--- |
  | **Causality** | **Interventionist:** Changing the function changes the outcome. | **Nomological:** Governed strictly by physical laws without reference to goals. |
  | **Deviation** | **Normative:** Distinguishes "error/pathology" from "variation." | **Descriptive:** All states are equally valid physical configurations. |
  | **Ontology** | **Non-Reductive Physicalism:** The function is realized by physics but not reducible to it. | **Reductive Physicalism:** Only the atoms/circuits are real. |
  | **Agent** | **None required:** Function is grounded in selection history or system capacity. | **Required:** If purpose is asserted without selection, it implies a homunculus/designer. |
  | **Reality** | **Real Pattern:** Supports prediction and compression better than the base level. | **Fiction:** Useful for teaching but fails under intervention or precise prediction. |

  ### 6. Recommended Philosophical Label
  If you need a single term to search for or use in discourse, the most rigorous label is **Mechanistic Functionalism** (associated with William Bechtel and Carl Craver).

  *   **Why:** It explicitly rejects the idea that functions are "ghostly" additions. It argues that a mechanism is defined by its **organization** (parts arranged specifically) to perform a **function** (output).
  *   **Ontological Commitment:** It requires **Non-Reductive Physicalism**. You must commit to the view that higher-level organizational patterns exert "downward causation" (or rather, that the organization constrains the physical components). You do not need to commit to dualism or a designer.

  **In short:** The explanatory level is real because the **organization** of the system constrains the physics. The pattern is not in the atoms; it is in the *arrangement* of the atoms. That arrangement is objective, intervention-worthy, and mind-independent, even though it is described using the vocabulary of purpose.
