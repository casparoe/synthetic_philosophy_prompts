      *   **Ilsa's Train Station Renunciation:** She tried to sacrifice herself (staying with Rick) for Laszlo, then tried to sacrifice Laszlo for Rick. She is the tragic figure of conflicting values. Rick resolves this conflict for her.
      *   **Laszlo:** Is he an ideal or a tool? He is the embodiment of the "Cause." He is somewhat one-dimensional (perfect hero). If he were just a man, Rick might kill him. Rick helps him because he represents the Resistance. Laszlo is a vessel for the value, not the value itself.

