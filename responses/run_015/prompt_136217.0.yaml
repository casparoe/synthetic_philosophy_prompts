      *   *Actually, looking closer at Rand's specific critique:* Rand wrote about this. She argued that if the cause is *your* cause, it's egoistic. If it's *society's* cause, it's altruistic. Rick makes the fight against fascism personal ("I stick my neck out for nobody" -> "I'm joining the Free French").
      *   *Best Synthesis:* The film defeats the Randian reading because Rick's action is not a sacrifice of a higher value for a lower one, but a choice of a higher value (integrity/duty to self/history) over a lower one (personal romance), making it rational selfishness, not altruism. However, the *emotional* framing leans towards sacrifice.
