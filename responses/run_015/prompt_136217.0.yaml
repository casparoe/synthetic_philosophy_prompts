          *   *Strengths:* Explains the "redemption" arc. Explains why he looks resolved, not just devastated, at the end.
          *   *Weaknesses:* Roommate is right that it hurts. If it were purely a trade, the pain would be transaction costs, not heartbreak. It risks minimizing the genuine loss of Ilsa.
          *   *Film Resistance:* The movie lingers on the romance. It's not just "I lost a girl, I gained a mission." It's "I lost the love of my life." To call that a net gain feels like rationalization, though psychologically accurate for Rick's growth.

      *   **Framing 3: Declarative Renunciation (User's Invention)**
          *   *Core:* Acting to solidify one's value hierarchy. Making the abstract concrete.
          *   *Evidence:* "Hill of beans" speech. Renault throwing the water bottle.
