  2.  **Deconstruct the Three Framings:**

      *   **Framing 1: The Randian Altruist Reading (Roommate)**
          *   *Core:* Rick sacrifices his greatest personal value (Ilsa/Love) for a lesser value (Political Cause/Duty) for the benefit of others (Laszlo/World).
          *   *Evidence:* "The problems of three little people don't amount to a hill of beans." Rick stays behind alone. Ilsa goes with Laszlo.
          *   *Strengths:* Captures the emotional weight of the ending. It *does* hurt. Rick *is* giving her up. The film valorizes the "cause" over personal happiness.
          *   *Weaknesses:* Rand defines sacrifice as giving up a *greater* value for a *lesser* one. Does Rick value the cause *less* than Ilsa at the end? Or does he re-rank them? If he re-ranks them, it's not sacrifice in Rand's sense, it's rational choice. Also, Rand hated "duty" for duty's sake.
          *   *Film Resistance:* Rick isn't acting out of duty to Laszlo specifically; he's acting out of loyalty to his own past self and a rejection of the fascist threat which would destroy the possibility of *any* value (including love).

      *   **Framing 2: The Recovery/Investment Reading (User's First Pushback)**
          *   *Core:* Rick trades Ilsa to regain his soul/integrity. Net gain.
