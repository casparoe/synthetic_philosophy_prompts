answer: |-
  **Reporting Entity & Basis of Preparation Note**
  **Entity:** The British Raj (consolidating East India Company and Crown periods).
  **Period:** ~1757 to 1947 (Breakup/Partition treated as liquidation event).
  **Basis:** *Going Concern* is appropriate for the operational period (1757–1940s) as the entity intended to continue indefinitely. However, for the final stretch (1945–1947), a *Liquidation Basis* is the honest lens, as the intent shifted to dissolution and asset distribution.
  **Ownership Attribution:** Significant related-party complication. Legal owners shifted from EIC shareholders to the British Crown/Public. Beneficial owners (the Indian populace) were not equity holders but bore the residual risk, creating a principal-agent mismatch that standard equity attribution models cannot fully capture.

  | Claim | Accounting Rendering | Fidelity | Residue Note |
  | :--- | :--- | :--- | :--- |
  | **Ferguson 1:** The Empire built railways and telegraphs that created a lasting asset base for modern India. | Capitalization of significant Property, Plant & Equipment (PPE); useful lives extend beyond the reporting period into the successor entity. | Clean | Ignores who bore the capital cost (debt vs. equity) and whether the asset mix matched the user's operational needs. |
  | **Ferguson 2:** British Rule of Law reduced transaction costs and enabled secure contracting. | Implementation of a robust Internal Control Framework and recognition of Intangible Assets (Goodwill/Brand) enhancing fair value. | Distorted | Rule of law is an external regulatory environment, not an asset owned or controlled by the reporting entity. |
  | **Ferguson 3:** Without the Empire, India would have fragmented into warring states with higher risk premiums. | Assessment of the Pre-Consolidation Entity's Going Concern status; assertion that liquidation value was lower than consolidated value. | No Expression | Accounting records actuals; assessing the viability of a hypothetical, non-existent alternative history is outside audit scope. |
  | **Ferguson 4:** Integration into global markets modernized the economy through better capital allocation. | Brinson Performance Attribution: Positive contribution from Asset Allocation (sector weighting) and Selection (security picking) versus a passive benchmark. | Distorted | Benchmark selection is arbitrary; does not isolate whether returns were generated by skill (empire) or market beta (Industrial Revolution). |
  | **Tharoor 1:** British policies deindustrialized India's textile sector, destroying existing productive capacity. | Impairment Loss recognized where Carrying Amount of local industry assets exceeded Recoverable Amount due to restrictive covenants. | Clean | Treats independent local industries as subsidiaries whose impairment was caused by the parent's restrictive related-party policies. |
  | **Tharoor 2:** Millions died in famines while grain was exported to Britain. | Related-Party Transaction (Inventory Transfer): Goods transferred to Parent at fair value while Subsidiary recognized a material liability (human cost) off-balance-sheet. | Distorted | Human life and suffering are not recognized liabilities under IFRS; "Social Cost" cannot be accrued or audited. |
  | **Tharoor 3:** Wealth was systematically drained via "Home Charges" and salaries paid to British officials. | Excessive Related-Party Transactions: Management fees, dividends, and transfer pricing flows to Parent exceeding arm's-length standards. | Clean | Complicated by the mid-period change in Parent identity (EIC to Crown), obscuring the continuity of the extraction mechanism. |
  | **Tharoor 4:** An independent India would have industrialized faster, similar to Japan. | Pro Forma Financial Information: Hypothetical results prepared using benchmarking data from a Peer Group (Japan) under different management. | No Expression | Pro forma requires a transaction basis; auditing a counterfactual management team violates the historical cost principle. |

