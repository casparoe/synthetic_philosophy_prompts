      *   *Claim 4 (Ferguson):* Integration into global markets.
          *   *Acct:* Segment Reporting / Revenue Recognition from external parties.
          *   *Fidelity:* Clean.
          *   *Residue:* Doesn't capture terms of trade (exploitative vs. fair).

      *   *Claim 5 (Tharoor):* Deindustrialization of textiles.
          *   *Acct:* Impairment Loss (Carrying Amount > Recoverable Amount) due to external restrictions.
          *   *Fidelity:* Clean.
          *   *Residue:* Treats local industry as subsidiary assets, but they were independent entities prior.

      *   *Claim 6 (Tharoor):* Famines while grain exported.
          *   *Acct:* Related Party Transaction (Inventory transfer at non-arm's length) / Material Misstatement in Social Cost.
          *   *Fidelity:* Distorted.
          *   *Residue:* Human life isn't a liability or asset; "Social Cost" isn't in IFRS.

      *   *Claim 7 (Tharoor):* Wealth Drain (Home Charges).
          *   *Acct:* Related Party Transactions / Excessive Management Fees & Dividends to Parent.
          *   *Fidelity:* Clean.
          *   *Residue:* "Parent" ownership changed mid-period (EIC to Crown), complicating attribution.

      *   *Claim 8 (Tharoor):* Counterfactual: Japan-style independent growth.
          *   *Acct:* Benchmarking / Variance Analysis against Peer Group.
          *   *Fidelity:* No Expression.
          *   *Residue:* Peer group benchmarking isn't a counterfactual audit; it's comparative financial info.

  5.  **Refining the Accounting Vocabulary:**
      *   Need to ensure terms like "Impairment," "Related Party," "Going Concern," "Brinson Attribution" are used correctly.
      *   *Going Concern:* The 1947 breakup is a liquidation event. The argument about whether India *would have survived* without the Raj is a going concern assessment on the *pre-Raj* entity.
      *   *Brinson Attribution:* Allocation (did Empire put capital in right sectors?), Selection (did they manage those sectors well?), Interaction (did the mix work?). Ferguson argues positive Allocation/Selection. Tharoor argues negative Allocation (extraction) and negative Selection (mismanagement).
      *   *Counterfactual:* This is the key. Accounting is historical. Pro forma financial info exists but relies on hypothetical assumptions that cannot be audited. This confirms the user's hunch.

  6.  **Developing the Residue/Verdict:**
      *   The accounting framework is designed for *actual* transactions of a *specific* entity.
      *   It struggles with *externalities* (famines, social cost) unless they become liabilities (litigation).
      *   It struggles with *counterfactuals* (what if?).
      *   It struggles with *ownership changes* where the "beneficial owner" (Indian populace) differs from the "legal owner" (British Crown). This is a principal-agent problem, not just attribution.
      *   Verdict: The residue is a defect of the framework (it excludes externalities and counterfactuals) BUT also reveals the debate is about moral philosophy disguised as economic accounting.

