      *   *Wealth Drain:* Dividends, Management Fees, Transfer Pricing.
      *   *Counterfactual:* Budget vs. Actual variance analysis? No, because there's no budget. Pro Forma? Maybe. But fundamentally, accounting is historical cost-based, not hypothetical.
      *   *Performance Attribution:* Brinson model. Did the "manager" (Empire) add value via allocation (where capital went) or selection (how it was used), or was it market beta (Industrial Revolution trends)?

  4.  **Drafting the Table Content (Iterative Process):**

      *   *Claim 1 (Ferguson):* Railways/Telegraph created lasting value.
