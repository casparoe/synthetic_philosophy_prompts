      *Which is better advice?* For a Westminster democracy, the "Reserve Power" is the ultimate guardian of the constitution. Removing it leaves the constitution vulnerable to legalistic tyranny. I will stick with **Preserving Ambiguity**. It is the more sophisticated constitutional counsel position.

