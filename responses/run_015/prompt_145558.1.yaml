      *(Self-Correction on the Recommendation)*: Wait, if I recommend preserving ambiguity, I am recommending *against* the government's proposal. I need to make sure I don't sound like I'm obstructing reform without cause. The cause is the protection of the constitution against a legislative majority that might abuse a statutory mandate.
      *Actually, let's flip it.* Is it better to recommend the Statute?
