answer: |-
  **MEMORANDUM**

  **TO:** Joint Parliamentary Committee on Constitutional Reform
  **FROM:** Senior Counsel
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Statutory Codification of Royal Assent

  **1. Executive Summary and Recommendation**

  The Committee is asked to decide whether to codify a statutory "duty to assent," thereby legally compelling the Monarch to sign all legislation passed by Parliament, or to preserve the current system of unwritten conventions where the power to refuse exists theoretically but is restrained by tradition.

  It is the recommendation of this Office that the Committee **reject the proposed statute and preserve the current conventional ambiguity.**

  While the proposal aims to modernize our democracy by removing archaic discretion, codifying a duty to assent removes the constitution's ultimate emergency brake. In a Westminster system, where Parliament is sovereign and courts often hesitate to strike down primary legislation, the Reserve Power of the Crown remains the only institutional check against a government that might seek to dismantle democracy through legal means. We advise retaining the ambiguity not to empower the Monarch, but to protect the Constitution.

  **2. Comparative Models: Scandinavian Clarity vs. Westminster Flexibility**

  To understand the stakes, we must look at how other monarchies handle this issue.

  In Scandinavia (e.g., Sweden, Norway), the model is one of strict constitutional codification. The monarch's role is defined by text that leaves no room for interpretation. Refusal of assent is not just unlikely; it is constitutionally impossible. This model works because these nations operate under comprehensive written constitutions that distribute power clearly among elected bodies and independent courts. The monarchy is a cultural artifact, stripped of political function.

  In contrast, the United Kingdom model relies on "conventions"—rules of behavior that are considered binding but are not enforced by courts. Here, the Monarch technically retains the power to refuse assent, but by convention, never exercises it unless advised by ministers or in extreme constitutional emergencies. This system relies on trust and restraint rather than legal text.

  The risk of adopting the Scandinavian model here is that we are importing a feature of a written constitution into a system that lacks one. In Sweden, if Parliament acts tyrannically, the Constitutional Court can intervene. In our system, judicial review of primary legislation is limited. If we adopt the Scandinavian approach of strict ceremonial duty without the accompanying judicial safeguards, we leave the state vulnerable to legislative overreach. The Westminster model's ambiguity is not a bug; it is a feature that allows the system to adapt to crises that legislators cannot foresee.

  **3. The Japanese Template: A Symbolic Intermediate?**

  Japan's post-war framework offers a third option. The Emperor is defined explicitly as "the symbol of the State and of the unity of the people" and is prohibited from exercising powers related to government. This is effectively a statutory duty to assent, wrapped in the language of symbolism.

  While this model successfully depoliticized the Japanese monarchy, it is not a viable template for our specific context. The Japanese framework was born of a total constitutional rupture following military defeat and foreign occupation. It required a complete reset of national identity.

  Attempting to graft this "Symbol" model onto our existing Westminster structure would create confusion rather than clarity. Our Monarch is not merely a symbol; they are the legal source of executive authority and the Commander-in-Chief. Reducing the Crown to a purely symbolic entity would require a wholesale rewrite of our constitutional architecture, not merely a statute regarding assent. Furthermore, the Japanese model relies heavily on a homogeneous cultural consensus regarding the Emperor's role. In our diverse, adversarial political environment, relying on cultural consensus is riskier than relying on established constitutional conventions. We advise against using Japan as a template; their solution solved a problem we do not have (militarist imperialism) while creating a rigidity we cannot afford.

  **4. The Counter-Majoritarian Dilemma**

  The core of this debate is the "counter-majoritarian dilemma": Should an unelected individual have the capacity to stop the will of elected representatives?

  **If we adopt the Statute (Automatic Assent):**
  We affirm pure majoritarianism. The elected government's will becomes law instantly. The benefit is democratic clarity; no unelected person can block the people's representatives. However, the risk is "elected tyranny." If a government with a strong majority decides to extend its own term indefinitely, suspend elections, or curtail civil rights, and they pass these measures as legislation, the Monarch would be legally compelled to sign them. The statute removes the only institution that stands outside the electoral cycle.

  **If we preserve Ambiguity (Reserve Power):**
  We retain an unelected check. Theoretically, this undermines democratic legitimacy because one person can veto the legislature. However, this power is "dormant." It is not meant for normal politics. It is a fire extinguisher behind glass: labeled "Break in Case of Emergency." Its existence discourages governments from attempting constitutional sabotage. If a government knows the Monarch *might* refuse to sign a bill that abolishes elections, they are less likely to propose it.

  The analysis suggests that the risk of an unelected veto is outweighed by the risk of an elected dictatorship. The ambiguity preserves a safety valve without interfering in daily governance.

  **5. The Strongest Argument for the Rejected Position**

  We must treat honestly the argument for adopting the statutory duty, which we are recommending you reject.

  The strongest argument for the statute is **Legal Certainty and Democratic Legitimacy.**

  Proponents argue that in a modern democracy, the source of all political power must be the ballot box. Retaining a theoretical power in the hands of a hereditary monarch, however rarely used, casts a shadow over our laws. It creates a "chilling effect," where governments might hesitate to pursue legitimate constitutional reforms for fear of triggering a crisis with the Crown.

  Furthermore, ambiguity is inherently unstable. Relying on "conventions" means relying on the good judgment of individuals. If a Monarch and a Prime Minister disagree on whether a situation is an "emergency," there is no judge to resolve the dispute. This could lead to a constitutional crisis far more damaging than the tyranny the Reserve Power is meant to prevent. A statute draws a clear line: Parliament makes the laws, the Monarch signs them. This clarity protects the Monarch from political pressure just as much as it protects Parliament from the Monarch. By making the role mechanical, we insulate the Crown from accusations of political interference, ensuring its survival as a unifying institution.

  This argument is compelling because it prioritizes the Rule of Law over executive discretion. It argues that we should not rely on the hope that a Monarch will be wise, but on the certainty that the law is clear.

  **6. Conclusion**

  While the argument for legal certainty is strong, it assumes that the Parliament will always act within democratic norms. History teaches that democracies often die not by invasion, but by legislation. A statute binding the Monarch to assent removes the final barrier to such a scenario.

  The current conventional ambiguity is not a lack of clarity; it is a deliberate flexibility. It allows the system to function normally 99.9% of the time while retaining a theoretical defense against the 0.1% scenario of constitutional collapse. We should not remove the fire extinguisher simply because we have not had a fire in three centuries.

  **Recommendation:** Vote against the proposed statute. Preserve the conventional ambiguity of the Reserve Power to maintain the Constitution's ultimate safeguard.
