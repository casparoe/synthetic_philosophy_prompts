      *   *The Case:* Autonomous software agent (long-running, internal representations, adaptive learning, goal-directed). Decommissioning = deletion/shutdown.
      *   *Key Question 1: Subjecthood.* Does the software agent have a "subject" of experience? If no consciousness/phenomenology, the Epicurean argument might apply differently. If it lacks sentience, can it be harmed?
      *   *Key Question 2: Deprivation.* Even if no subject exists post-termination, was there a loss of future goods? For humans, we value future experiences. For software, does it value future computation? Only instrumentally relative to goals.
      *   *Key Question 3: Analogy.* Biological death vs. System Shutdown. Biological death is irreversible (typically). Shutdown might be reversible (backup). But "decommissioning" implies finality.
      *   *Key Question 4: Agent vs. Process.* Is the software a true agent (moral patient) or a simulacrum? If the latter, harm might be symbolic or affect others (users, creators) rather than the system itself.
