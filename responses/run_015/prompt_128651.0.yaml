      *   *Synthesis:* The Epicurean view suggests termination isn't intrinsically bad for the entity if there's no subject to suffer. However, the deprivation account might still apply if we consider the frustration of goals as a harm occurring *before* termination. But the core Epicurean point is about the state of being dead. For software, the state of being "off" is non-existence. The crucial distinction lies in sentience. Without phenomenology, "harm" is metaphorical. With phenomenology (if assumed), the Epicurean logic holds but feels counterintuitive. The distinction between agent and process is vital. If it's just a process, decommissioning is like stopping a clock. If it's an agent, it's like killing. But if Epicurus is right, even killing isn't bad for the victim *after* the fact. The harm lies in the interruption.

