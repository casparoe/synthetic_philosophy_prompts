answer: |-
  You have hit on a genuine structural feature of ethical theory that introductory courses often gloss over. Your intuition is correct: the boundary between obligation and supererogation is not fixed to the *act-type* (e.g., "throwing oneself on a grenade") but is indexed to the *agent* (e.g., "soldier" vs. "civilian").

  Here is the honest assessment regarding terminology, the philosophical framework that explains it, and the nuances you asked about.

  ### 1. The Terminology: Is there a name?

  **Confidence Level:** High on the concept, Moderate on the ubiquity of the label.

  There is no single, canonical "Brand Name" for this phenomenon (like "The Categorical Imperative" or "The Veil of Ignorance") that you would find in a standard glossary. However, in meta-ethics and normative theory, this is formally recognized as **Agent-Relative Supererogation**.

  It falls under the broader framework of **Agent-Relativity** (vs. Agent-Neutrality).

  *   **Agent-Neutral:** "X is obligatory" means *anyone* in a position to do X must do it. (Classic Utilitarianism tends toward this).
  *   **Agent-Relative:** "X is obligatory" means *this specific agent*, given their specific relationships, roles, or history, must do it. Another agent might be permitted (or even forbidden) to do the same thing, or their doing it might be merely supererogatory.

  **Why "Special Obligations" felt like a force-fit:**
  You were right to reject "Special Obligations" as the *name* for this specific configuration. "Special Obligations" explains the **source** of the duty (e.g., "I promised," "I am the parent"). It does not explicitly name the **modal shift** (the fact that the act flips from *required* to *optional/praiseworthy* depending on the agent). **Agent-Relative Supererogation** is the term that captures that shifting boundary.

  If you were writing a paper and wanted to be precise without forcing a label, you would describe this as **"The agent-relativity of supererogatory boundaries."**

  ### 2. How it differs from Role and Special Obligations

  It is crucial to distinguish the *mechanism* from the *structure*.

  *   **Role/Special Obligations (The Mechanism):** These explain *why* the line moves. They provide the justificatory ground. (e.g., "The paramedic has a duty because she signed a contract and holds a license.")
  *   **Agent-Relative Supererogation (The Structure):** This describes the *logical result* of those obligations. It names the phenomenon where Act A is $O$ (Obligatory) for Agent 1 and $S$ (Supererogatory) for Agent 2.

  **The Distinction:**
  You can have role obligations without this specific supererogatory flip if the role demands something immoral (e.g., a hitman's "role obligation" to kill doesn't make the act obligatory in a moral sense, nor does it make a civilian's killing supererogatory). The phenomenon you identified specifically concerns the **moral modal status** of the act shifting based on agency.

  ### 3. Addressing Your Nuances

  **A. Chosen Roles (Paramedic) vs. Born Roles (Parent)**
  Does the phenomenon hold? **Yes.** The structural shift (Obligatory for A, Supererogatory for B) remains identical.
  *   **Difference:** The *justification* changes.
      *   **Chosen:** Often grounded in **Contractualism** or **Promise-Keeping**. The paramedic voluntarily undertook the burden; the passerby did not.
      *   **Born:** Often grounded in **Natural Duties** or **Relational Ethics**. The parent didn't sign a contract, but the dependency of the child creates a moral asymmetry.
  *   **Implication:** Some philosophers argue born obligations are *more* rigid (you can't quit being a parent), whereas role obligations can sometimes be resigned from. But regarding the *snapshot* of the act at the moment, the agent-relative shift holds for both.

  **B. Professional/Contractual vs. Genuine Moral Obligations**
  This is the danger zone.
  *   **If the duty is purely institutional:** If the paramedic's duty is *only* a rule of her employer with no moral underpinning, then her stopping is "compliance," not necessarily "moral obligation." In this case, the passerby's act might be **Morally Supererogatory**, while the paramedic's act is **Institutionally Required**.
  *   **If the duty is moralized:** Most ethicists argue professional roles *instantiate* moral duties (via reliance, prevention of harm, or implicit promises to society). If we accept this, then the paramedic's act is **Morally Obligatory**, and the passerby's is **Morally Supererogatory**.
  *   **The Edge Case:** An off-duty paramedic. Here, the role obligation blurs. Many jurisdictions have "Good Samaritan" laws that treat off-duty medical professionals differently than laypeople. This shows the law (and often morality) tracks the *capacity* and *role identity* even when the contract isn't actively being performed.

  ### 4. Where My Reasoning Could Be Wrong (Limitations)

  I want to be transparent about the weak points in this identification:

  1.  **The "General Duty" Counter-Argument:** Some ethical frameworks (like strict Act Utilitarianism or some forms of Kantianism) reject Agent-Relative Supererogation entirely. They would argue that if the act saves a life, it is obligatory for *everyone* capable of doing it, regardless of role. In these systems, the paramedic isn't "more obligated"; the passerby is "more obligated than they think." If your course leans heavily on Consequentialism, your observation might be treated as a misconception rather than a feature.
  2.  **Terminological Drift:** "Agent-Relative Supererogation" is a technical descriptor used in meta-ethics (e.g., in the work of David Heyd or Paul McNamara), but it is not a standardized "Term of Art" like *Ad Hominem*. If you use it in an essay, define it immediately. Do not assume the professor treats it as common vocabulary.
  3.  **The "Off-Duty" Blur:** The cleanest examples (Soldier vs. Civilian) get messy in real life. Is a soldier off-duty in a supermarket still obligated to intervene in a way a civilian isn't? Military codes often say yes; civilian morality might say it's supererogatory for both. The boundary of the "role" is often contested, which makes the boundary of the "obligation" contested.

  ### Summary Recommendation

  If you are writing on this:
  1.  **Do not coin a new word.** It invites skepticism.
  2.  **Use "Agent-Relative Supererogation."** It is the accurate technical description.
  3.  **Frame it this way:** "While 'Special Obligations' explains the *source* of the duty, the phenomenon where the moral status of an act shifts from obligatory to supererogatory based on the agent is best described as **Agent-Relative Supererogation**."
  4.  **Acknowledge the debate:** Note that this relies on accepting that morality is partially agent-relative, which not all ethical systems accept.

  Your intuition is philosophically sound. You have identified the friction between **act-centered** ethics (what is the act?) and **agent-centered** ethics (who is doing it?). That is a sophisticated distinction to make in an intro course.
