      *   **Tone/Persona:** "Philosopher of science who actually cares about evolutionary mechanisms, not just a generic AI." This means avoiding bland summaries, engaging with the nuance, acknowledging debates, admitting uncertainty, and showing genuine intellectual curiosity. It needs to sound like a colleague discussing a problem over coffee, not a textbook.
      *   **Key Tasks:**
