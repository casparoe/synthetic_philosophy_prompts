  4.  **Develop a Better Principle:**
      *   The user's rule ("expresses what agent cares about" vs. "machinery") is basically a *Deep Self* view.
      *   *Problem:* It doesn't account for *how* the Deep Self was formed (Case 4) or the First-Person perspective (Case 6).
      *   *Proposed Fix:* Shift from "Causation vs. Freedom" to **"Answerability" and "Relationship."**
      *   *Principle:* Reactive attitudes are tools for negotiating relationships. They are appropriate when the agent is *capable of recognizing the moral demand* and adjusting behavior in response to the attitude, *and* when the action reflects a stance toward the relationship.
      *   *Refinement:* Let's use a hybrid of Strawson and Scanlon. It's about *what the action says about the relationship*.
      *   *The "Machinery" distinction:* It's not about *whether* there is a cause, but whether the cause bypasses the agent's capacity for moral recognition.
      *   *The Self/Other Asymmetry:* Guilt is forward-looking (self-repair); Resentment is backward-looking (holding other accountable).

  5.  **Address the Specific Tensions:**
      *   *Case 4 (Extremist):* We blame because we treat them as capable of moral revision. To excuse them is to dehumanize them (paternalism).
