      *   **The Working Rule:** "Reactive attitudes are in order when the behaviour *expresses* what the agent really cares about, and out of order when its just the machinery misfiring."
      *   **The Tensions:**
          *   Case 5 (Chatbot): Furious at the company (agent?), not the bot (machinery). But the company is also "machinery" in a sense.
          *   Case 6 (Self/Sleep Apnoea): Mechanistic explanation doesn't reduce guilt, unlike with others.
          *   Case 4 (Extremist Upbringing): Causal story is strong (like the tumour), but indignation remains.
          *   Gratitude vs. Resentment: Gratitude sticks even when motives are impure.
      *   **The Ask:**
