      *   *Proposed Principle:* **"The Capacity for Moral Recognition and Relationship."** Reactive attitudes are appropriate when the agent possesses the capacity to understand the moral significance of their action and adjust future behavior based on interpersonal feedback, *unless* that capacity is locally disabled (tumour) or structurally bypassed (coercion).
      *   *Re-evaluating Verdicts:*
