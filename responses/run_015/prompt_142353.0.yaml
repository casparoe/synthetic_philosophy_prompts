      *   Ensure the distinction between *explanation* and *excuse* is clear.

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I address Gratitude?* Yes, need to mention the asymmetry. Gratitude rewards connection; resentment polices boundaries.
      *   *Is the "Company as Machinery" point addressed?* Yes, distinguish between *tools* and *collective agents*.
      *   *Is the Sleep Apnoea guilt explained?* Yes, via the functional role of guilt vs. the explanatory role of science.

  9.  **Final Polish:** Organize into clear sections: The Terminology, The Repair, The Verdicts, The Predictions. (Proceed to generate output based on this structure).

  *(Self-Correction during drafting)*: Wait, I need to be careful with the BPD case. It's sensitive. Don't stigmatize. Focus on the *intermittent* capacity.
  Also, the AI radicalization case needs to distinguish between *manipulation* and *persuasion*. If the feed bypasses rationality, responsibility diminishes.

  Let's refine the principle to be about **"Answerability."** Are they answerable? Can they give reasons?
  *   Tumour/FTD: No.
