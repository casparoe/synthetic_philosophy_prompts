answer: |-
  Yes, you have the right handle. **Reactive attitudes** is the precise term coined by the philosopher P.F. Strawson in his seminal 1962 paper *Freedom and Resentment*. He argued that determinism (the idea that everything is caused by prior physical events) doesn't actually matter to our moral lives. What matters is whether we are participating in an ordinary interpersonal relationship or viewing someone objectively.

  Your working rule ("expresses what the agent cares about" vs. "machinery misfiring") is a intuitive version of what philosophers call a **Deep Self** theory. You are blaming the *person*, not the *physics*. But as you've noticed, the "Deep Self" is messy. Sometimes the Deep Self is shaped by bad causes (extremist upbringing), and sometimes the "machinery" explanation doesn't stop the feeling (your own guilt).

  Here is a repair of your principle, an audit of your verdicts, and a prediction for your unsettled cases.

  ### 1. The Repaired Principle
  Your current rule fails because it assumes "machinery" and "caring" are mutually exclusive. They aren't. Caring is a mechanical process in the brain. The distinction you are actually tracking is **Answerability**.

  **New Rule:** *Reactive attitudes are in order when the agent retains the capacity to recognize the moral demand and adjust their behavior in response to interpersonal feedback. They are out of order when the cause bypasses that capacity entirely.*

  *   **Why this fixes Case 4 (Extremist):** The extremist's values were caused by their upbringing, but they are still *answerable*. If you express indignation, there is a pathway for them to recognize the harm and change. To withhold blame is to treat them like a child or a patient (the "objective stance"), which denies their agency.
  *   **Why this fixes Case 6 (Your Guilt):** Guilt is not a metaphysical verdict on whether you were determined; it is a **functional tool**. Guilt exists to motivate repair and future self-regulation. Explaining the sleep apnoea explains the *cause*, but it doesn't negate the *need* for you to regulate your behavior differently in the future. You are still the only one who can fix it.
  *   **Why this fixes Case 5 (AI):** The chatbot cannot recognize moral demands. The company can. The company is a **collective moral agent**. It has policies, priorities, and the capacity to adjust its "behavior" (algorithms) in response to public indignation.

  ### 2. The Audit: Which Verdicts Stand?
  You don't need to give up any of your verdicts, but you need to reframe *why* you hold two of them.

  *   **Keep the Resentment (Source, Extremist, Company):** In all three, the entity is capable of understanding "you shouldn't do this" and acting differently. The extremist case is the hardest, but Strawson would argue that withholding resentment here is actually dehumanizing. It says, "You are not one of us; you are a force of nature." Indignation asserts their membership in the moral community.
  *   **Keep the Excuse (FTD, Tumour, Chatbot):** In these cases, the capacity for moral recognition is locally or globally disabled. The chatbot has no capacity; the tumour/FTD patients have lost the neurological hardware for inhibition or empathy.
  *   **Reframe the Guilt (Sleep Apnoea):** Do not try to reason your guilt away. Your guilt is not a claim that "I could have done otherwise in a metaphysical sense." It is a claim that "I am responsible for managing this machinery." The guilt is valid because *you* are the manager of the sleep-apnoea-ridden brain, not the passenger.
  *   **Reframe the Gratitude:** You noted gratitude is stickier. This is a known asymmetry. Resentment polices boundaries; gratitude builds bridges. If a colleague helps you, the *outcome* strengthens the relationship regardless of the motive. If they hurt you, the *motive* determines if the relationship is broken. You can benefit from a selfish ally; you cannot benefit from a selfish enemy.

  ### 3. Predictions for the Unsettled Cases

  Here is how the **Answerability Principle** applies to your two new scenarios.

  #### Case A: The Friend with Borderline Personality Disorder (BPD)
  *   **The Scenario:** A friend does the same hurtful thing every few months. They apologize, then repeat it.
  *   **The Verdict:** **Oscillating Attitudes.**
  *   **The Reasoning:** BPD is not like FTD. It is not a total loss of moral machinery; it is a dysregulation of emotional processing. Their capacity for answerability is *impaired*, not *absent*.
  *   **Application:** You are permitted to feel resentment, but it should be tempered by the "objective stance." Strawson called this a **modification** of reactive attitudes. You hold them responsible, but you acknowledge the difficulty they face.
  *   **Prediction:** If you treat them purely as a patient (no resentment), you damage the friendship (it becomes clinical). If you treat them purely as a healthy agent (full resentment), you ignore the disability. The correct move is **conditional resentment**: "I am hurt, and I need you to know this damages us, but I understand you are fighting a mechanism I don't have to fight." If they refuse treatment or refuse to acknowledge the pattern, your resentment should ramp up to full force, because they are refusing *answerability*.

  #### Case B: Radicalisation by Recommendation Feed
  *   **The Scenario:** Someone radicalised not by a family (human agents) but by an algorithmic feed (non-human agents).
  *   **The Verdict:** **Split Responsibility.**
  *   **The Reasoning:** This is the hardest case for your beat. The feed is designed to bypass answerability. It exploits dopamine loops and confirmation bias to create a "tunnel" where moral recognition is systematically degraded.
  *   **Application:**
      1.  **The User:** Their answerability is diminished but not zero. Unless the manipulation was coercive (hypnosis-level), they retain some capacity to step back. Your indignation should be lower than with the family-raised extremist, but not zero. To excuse them entirely is to say they have no mind at all.
      2.  **The Platform:** The bulk of the blame shifts here. The platform engineered the environment to bypass moral recognition. This is "machinery misfiring" by design.
  *   **Prediction:** Your reactive attitude toward the radicalised individual should be **sorrowful indignation**. You hold them accountable, but you acknowledge they were fighting a weaponized environment. Your *fury* belongs to the engineers who optimized for engagement over safety. This mirrors your Chatbot verdict: blame the architect, not the tool, but acknowledge the tool caused the wound.

  ### Summary for your Column
  You are wrestling with the gap between **explanation** and **excuse**.
  *   Neuroscience gives you **explanation** (the tumour, the apnoea, the feed).
  *   Morality requires **excuses** to be narrow (only when answerability is broken).

  Your gut is correct to resist the "machinery" argument when it comes to humans. If we treat all human behavior as machinery misfiring, we lose the ability to love, demand, or connect. We become observers of meat-puppets.

  **The Headline:** Reactive attitudes aren't about metaphysical free will. They are the language we speak to keep each other accountable. Use them when the other party can speak the language back. When they can't (tumours, bots), switch to the objective stance. When they can but won't (extremists, sleep-deprived selves), keep speaking.
