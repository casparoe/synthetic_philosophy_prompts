      *(Self-Correction during drafting)*: I need to be careful not to validate the friend's view as "correct" but rather analyze its coherence. The user suspects the friend is switching analogies. I should confirm this suspicion. I also need to make sure I don't use Sanskrit terms unless I explain them, as the user has no library access and wants reasoning, not jargon. I will mention them only as a footnote to validate the user's independent discovery.

