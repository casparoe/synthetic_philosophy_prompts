      *   *Break 2: The Debtor Who Cannot Read.* Continuity of self. In a ledger, identity is key. In reincarnation, psychological continuity is broken.
          *   *Analysis:* This is fatal to the *Ledger* analogy regarding justice. If I don't remember the debt, paying it feels like punishment to a new person. To save the "no blame" claim, the friend must rely on *Gravity* (physics doesn't care if the rock remembers being thrown). But then "earning it" becomes meaningless language.
      *   *Break 3: Transfer/Inheritance.* Merit dedication vs. Personal Responsibility.
          *   *Analysis:* Ledgers allow third-party payment. Moral desert usually doesn't. If karma allows transfer, it undermines the "you earn your own fate" aspect. If it doesn't allow transfer, it contradicts certain Buddhist practices. This shows the Ledger analogy is inconsistent with the theology it tries to support.

  4.  **Deconstruct Task 3: The User's Distinction (Bookkeeping vs. Formation):**
      *   *Bookkeeping:* External settlement. Act -> Debt -> Payment. (Matches Ledger).
      *   *Formation:* Internal cultivation. Act -> Habit/Character -> Experience. (Matches Gravity/Seed-Plant).
      *   *Is it novel?* It closely mirrors the distinction between *External Retribution* vs. *Internal Psychological/Ethical Conditioning*. In Buddhist philosophy, this is often *Vipaka* (fruit/result) vs. *Samskara* (mental formations). The user has independently rediscovered a core philosophical tension in karma theory.
      *   *Fare against analogies:*
          *   Ledger supports Bookkeeping.
