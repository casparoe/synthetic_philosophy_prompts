          *   Creditor: The universe/victim/cosmic order (often vague).
          *   Debt: Bad karma (papa/sins).
          *   Currency: Merit/Demerit (Punya/Papa).
          *   Payment: Suffering/Good fortune.
          *   Interest: Compounding habits/escalating consequences.
          *   Discharge: Moksha/Nirvana (ending the cycle).
          *   Statute of Limitations: None (until enlightenment).
          *   Bankruptcy: Impossible (must be paid).
          *   Transfer: Merit dedication (Pattidana).
      *   *Gravity Mapping:*
          *   Mass: Intention/Action weight.
          *   Distance: Time between act and result.
          *   Force: The karmic result.
          *   Falling Body: The experiencer.
          *   Trajectory: The life path.
      *   *Which carries the weight?* The friend wants "no blame." Gravity is purely mechanistic. Ledger implies obligation and settlement. When the friend says "no judge," they are using *Gravity*. When they say "account being settled" or "earned it," they are using *Ledger*. The switch happens exactly when the victim-blaming objection arises. They use Gravity to defend the *mechanism* and Ledger to explain the *outcome*.

  3.  **Deconstruct Task 2: The Break Points:**
      *   *Break 1: Currency.* Money is fungible; suffering isn't. If I steal a car, my suffering doesn't give the victim a car.
