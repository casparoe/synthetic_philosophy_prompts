answer: |-
  It is a pleasure to assist with your methods hour, even if it does serve as a convenient distraction from your nineteenth-century chapter. The debate you describe is a microcosm of the last fifteen years of meta-philosophical wrangling, and your intuition that they are talking past one another is quite sharp. They are indeed treating "the method of cases" as a monolith when it is arguably a bundle of distinct practices.

  Here is an adjudication of moves (1) through (7), followed by an analysis of where the disagreement actually lies and what would be required to settle it.

  ### Adjudication of Moves

  **Move 1 (Marta): Variation in folk verdicts undermines the method.**
  *   **Rating:** *Plausible but Contested.*
  *   **Analysis:** This is the standard Experimental Philosophy (X-Phi) opening. The real work is done by the claim that analytic philosophy relies on *folk* intuitions as evidence. If the discipline actually relies on *theoretical* coherence, this move bites less. However, it is rhetorically strong because many philosophers do implicitly appeal to "what we would say."
  *   **Verdict:** It successfully shifts the burden of proof but assumes a specific model of how cases are used (as direct evidence from untutored intuition).

  **Move 2 (Dev): Expertise defence (Müller-Lyer analogy).**
  *   **Rating:** *Partially Right.*
  *   **Analysis:** The real work here is the distinction between performance (quick judgement) and competence (reflective equilibrium). The rhetorical weakness is the Müller-Lyer analogy: visual illusions are universal and hard-wired, whereas philosophical training is cultural and linguistic. Dev is right that we shouldn't privilege the snap judgement of a layperson, but he glosses over whether "expertise" actually exists in philosophy or is merely socialisation.

  **Move 3 (Marta): Gerrymandering and instability.**
  *   **Rating:** *Partially Right.*
  *   **Analysis:** This is Marta's strongest move. The claim that defining evidence as "convergent expert judgement" is circular if training *causes* convergence is doing heavy lifting. The secondary claim about framing effects (wobble) is empirically well-supported. Dev's position struggles here because he must show that training filters noise rather than implanting bias.

  **Move 4 (Dev): The Dilemma (Fact vs. Untested).**
  *   **Rating:** *Partially Mistaken.*
  *   **Analysis:** This is largely rhetorical defence. The claim that "untested" is too thin a result to reorient the discipline is a pragmatic plea, not a philosophical defence. If the method is untested but widely used to justify major metaphysical claims, "untested" is actually a devastating result. Dev is trying to lower the stakes to save the method.

  **Move 5 (Marta): Normative convergence vs. First-order variation.**
  *   **Rating:** *Plausible but Contested.*
  *   **Analysis:** Treating the preprint as hypothetical: if first-order application varies but normative agreement ("what should be said") holds, Marta infers that the method tracks social norms, not metaphysical facts. This is a strong interpretation, but it assumes that "norms" and "facts" are mutually exclusive in this context. It does real work by offering a new explanation for the data, but it may overreach to conclude discovery is impossible.

  **Move 6 (Dev): Normative convergence rescues competence.**
  *   **Rating:** *Partially Right.*
  *   **Analysis:** Dev pivots well here. If the "should" converges, he argues that *is* the competence. The real work is redefining the target of the method: we aren't measuring how people *do* apply concepts, but how they *ought* to. However, this risks changing the subject from metaphysics to normative ethics or linguistics.

  **Move 7 (Marta): The Triviality Charge.**
  *   **Rating:** *Partially Right.*
  *   **Analysis:** Marta spots the tension in Dev's position. If variation is merely verbal (different concepts), then the method isn't testing one theory. If convergence is merely on norms, the method might be trivial (agreeing on rules without agreeing on reality). She is right that Dev cannot have it both ways without clarifying what the cases are *for*.

  ### Where They Talk Past Each Other

  You are correct that they are answering different questions.

  1.  **The Nature of the Data:** Marta treats case verdicts as *descriptive reports* of psychological states (which vary). Dev treats them as *normative claims* about truth (which should converge). When Marta says "people disagree," she means psychologically. When Dev says "experts agree," he means normatively.
  2.  **The Role of Training:** Marta sees training as *contamination* (transmitting a local theory). Dev sees training as *calibration* (removing performance error). They have no agreed-upon metric for what successful calibration looks like independent of the theory being taught.
  3.  **The Goal of the Method:** Marta assumes the method is supposed to discover mind-independent facts (metaphysics). Dev allows that the method might establish shared normative standards (conceptual engineering).

  ### The Missing Middle: The Monolithic Assumption

  Your nagging feeling is the crux of the matter. Both assume "the method of cases" is a single tool with a single job. It is not. It typically serves three distinct functions, and the debate shifts depending on which is in play:

  1.  **Conceptual Analysis:** Mapping the structure of our concepts. (Marta wins here if concepts vary culturally).
  2.  **Theory Testing:** Checking if a proposed definition matches our reflective intuitions. (Dev wins here if experts converge on the theory).
  3.  **Heuristic Discovery:** Using cases to spot distinctions we hadn't noticed. (Both lose here, as this doesn't rely on intuition as *evidence*, but as a *prompt*).

  Marta attacks (1) to undermine (2). Dev defends (2) by appealing to a refined version of (1). Neither considers that cases might function primarily as (3), where cross-cultural variation is a feature, not a bug, revealing different ways of carving the world.

  ### What Would Separate Their Positions?

  To move beyond this stalemate, you do not need more surveys of intuitions. You need a result that distinguishes **competence** from **socialisation**.

  **The Shape of the Required Result:**
  You would need a study where "expert" philosophers are tested on cases *outside* their immediate sub-discipline or cultural cluster, blinded to the theoretical implications.
  *   **If Dev is right:** Expertise should predict convergence *even when* the expert is removed from their specific theoretical tribe, and this convergence should correlate with independent markers of success (e.g., predictive power of the resulting theory, or consistency with formal models).
  *   **If Marta is right:** Convergence will only appear within specific "schools" or cultural clusters, and removing the theoretical framing will cause the convergence to collapse back to baseline variation.

  Specifically, look for **transfer effects**. If philosophical training sharpens a general faculty of judgement, philosophers should show less variation than non-philosophers on *novel* logical or semantic tasks that they haven't been trained on specifically. If they only show convergence on the "greatest hits" of the canon (Gettier, Twin Earth), Marta's socialisation hypothesis is favoured.

  ### Summary for the Group

  If I were chairing this session, I would suggest that Marta has the better of the argument regarding the *metaphysical* ambitions of the method (Move 3 and 7 are very strong), while Dev has successfully defended the *normative* utility of the method (Move 6). They are not disagreeing on the data, but on what the data is allowed to prove.

  Now, do try to get back to that nineteenth-century fellow; I suspect his methods are less contentious, even if his prose is not.
