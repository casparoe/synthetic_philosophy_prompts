      *   *Closest Analog:* **The Long-haul Driver.** Both are operating on a "policy" that automates decision-making to free up resources (attention for the road / mental health stability). Both allow for specific interrupts (Deer / Wrong Date or Extreme Price). The OCD checker is the *pathology* the Driver and Nadia are managing/avoiding.
