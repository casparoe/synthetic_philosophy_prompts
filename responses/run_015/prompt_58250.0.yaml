answer: |-
  It is not daft at all. You are experiencing a classic cultural collision between Anglo-American meritocracy (where individual achievement is celebrated) and the Scandinavian concept of *Janteloven* (the Law of Jante), which your sister is referencing. In Scandinavia, social cohesion is often valued higher than individual distinction. However, when transplanted into a family dynamic where one person is staying and the other is striving, it can feel incredibly stifling.

  Here is a breakdown of that one-liner ("Don't think you're better than us") into five distinct claims, ranging from reasonable advice to toxic suppression. I have categorised them by their validity and whether they actually justify turning down a promotion.

  ### 1. The "Manners" Claim
  **The Claim:** "Achieving more does not give you the right to be arrogant or treat family with less respect."
  *   **Verdict:** **Platitude.** (It is generally accepted as true and harmless).
  *   **Does it mean you shouldn't take the promotion?** No. You can be a shift lead and still be kind.
  *   **Do people mean this?** Sometimes. Often, this is the 'safe' version people say when they are worried success will change your personality.

  ### 2. The "Belonging" Claim
  **The Claim:** "Your success should not create a distance between us; you must remain part of the collective 'us'."
  *   **Verdict:** **Defensible but Arguable.** It is reasonable to want closeness, but arguable whether career progress inherently damages it.
  *   **Does it mean you shouldn't take the promotion?** No. But it implies you need to work harder to reassure them you still love them.
  *   **Do people mean this?** Frequently. This is usually about fear of abandonment. Your sister may worry that as you earn more and gain status, you will drift away from the family unit.

  ### 3. The "Human Worth" Claim
  **The Claim:** "Your economic or professional status does not make you a more valuable human being than the rest of us."
  *   **Verdict:** **True.** (Philosophically and morally).
  *   **Does it mean you shouldn't take the promotion?** No. It just means you shouldn't view yourself as superior.
  *   **Do people mean this?** Occasionally. This is the core of the Scandinavian ethos—equality of worth regardless of income. If this is all she meant, she phrased it poorly.

  ### 4. The "Envy" Claim
  **The Claim:** "Your success highlights our lack of success, and that makes us feel inadequate."
  *   **Verdict:** **False (as a reason for you to stop).** Their feelings of inadequacy are their responsibility, not yours.
  *   **Does it mean you shouldn't take the promotion?** No. You cannot shrink yourself to make others feel comfortable.
  *   **Do people mean this?** Often, but they will not admit it. This is the subconscious driver behind 'tall poppy' comments. It projects their insecurity onto you as a moral failing.

  ### 5. The "Suppression" Claim
  **The Claim:** "You are not allowed to stand out or exceed the group norm, because doing so disrupts the social hierarchy."
  *   **Verdict:** **False (in your context).** This is a cultural norm from Bergen, not a universal rule for your life here.
  *   **Does it mean you shouldn't take the promotion?** Only if you agree to live by her cultural rules instead of your own.
  *   **Do people mean this?** When someone cites *Janteloven* aggressively, this is usually the underlying message. It is an attempt to enforce conformity.

  ### Which version is she actually using?
  To be honest, when someone trots this out repeatedly in a group chat, it is usually a mix of **Claim 2 (Belonging)** and **Claim 4 (Envy)**, dressed up as **Claim 5 (Suppression)** using cultural philosophy as a shield.

  She has spent five years in a culture that actively discourages individual boasting. She likely feels that your announcement was 'loud' in a way that feels uncomfortable to her new sensibilities. However, she is also likely feeling left behind. By invoking "us", she is guilt-tripping you into staying on her level.

  **Does any of this give her a reason to think you shouldn't go for the promotion?**
  No. Not a single one of these claims suggests that working harder or earning more is inherently wrong. They only suggest that your *attitude* about it matters. Unless the promotion requires you to be unethical or abandon your family, her objection is about her feelings, not your actions.

  ### A Draft Response for the Chat
  Since you mentioned you want something to send back, here is a suggestion. It acknowledges her point (to de-escalate) but sets a boundary (to protect your ambition). It uses British spelling as requested.

  > "I've been thinking about your comment regarding 'not thinking I'm better than us'. I realise coming from Bergen, the vibe is very much about the collective over the individual, and I respect that culture.
  >
  > However, I want to clarify where I'm coming from. For me, going for this role isn't about thinking I'm superior to anyone; it's about personal growth and securing my future. I have no intention of changing how I treat the family or forgetting my roots. I hope we can celebrate each other's wins without worrying that success changes who we are. I'm still me, just aiming for the next step."

  **Why this works:**
  1.  **Validates her:** It acknowledges the Scandinavian influence without accepting it as law.
  2.  **Reframes the motive:** It shifts the narrative from "superiority" to "security/growth".
  3.  **Sets the boundary:** It makes it clear that your behaviour towards them won't change, so their defence is unnecessary.
  4.  **British English:** Uses 'realise', 'collective', 'behaviour', 'favour' (if needed), etc.

  Good luck with the shift-lead role. Do not let anyone convince you that grafting for a better life is a moral failing.
