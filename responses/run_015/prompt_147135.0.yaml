prompt: |-
  I'm applying for a six-month independent research fellowship at the intersection of philosophy of social science and comparative political economy, and I need a polished two-page proposal. My half-formed idea is this: the debate over why some nations are rich—institutions versus geography versus culture—has stalled not because the evidence is ambiguous, but because all sides implicitly assume a kind of modular causation. They treat institutions, geographic endowments, and cultural norms as if they were separately manipulable variables whose individual contributions can be isolated and weighed, even though in any actual national trajectory they co-evolve and redefine one another. I want the proposal to ask whether the failure to reach causal conclusions about national prosperity is fundamentally a failure of evidence, or a deeper failure of the conceptual framework that demands separable causes in the first place.

  Please turn this into a precise research plan. State the exact epistemic question with sufficient philosophical rigor—perhaps framing it in terms of whether macro-historical explanations can satisfy interventionist or counterfactual criteria for causation when the putative causes are structurally entangled at the scale of the nation-state. Explain why the standard institutionalist, geographic determinist, and culturalist literatures leave this open: they typically answer what correlates with sustained growth or with divergence in paired cases, but they do not establish whether those correlations license the kind of modular counterfactual claims—"had Ghana adopted Botswana's institutions, holding geography constant"—that would be required for genuine explanatory knowledge rather than retrospective narration. Lay out a realistic method for six months without original archival work: select two closely matched divergence cases (for example, Korea and Ghana post-1960, or Botswana and Zambia at independence), and analyze existing comparative studies of them not to adjudicate outcomes, but to test whether institutional change in one case can be conceptually isolated from concurrent geographic and cultural conditions in a way that supports robust explanatory inference. Specify what progress would look like—perhaps a diagnostic criterion distinguishing genuinely explanatory macro-claims from sophisticated redescription—and define failure conditions precisely, such as discovering that every attempt to isolate a variable ends up redefining the other variables in the pair, rendering the modular framework self-undermining. Keep the scope disciplined: conceptual analysis of well-known comparative histories, drawing on philosophy-of-science resources about explanatory robustness and counterfactual stability, with no expectation of new econometric results. Do not include a bibliography, literature review by citation, or reading list; I will supply references myself. Write in formal, fellowship-appropriate prose.
