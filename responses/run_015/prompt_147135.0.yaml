answer: |-
  **Project Title:** The Modularity Assumption: Counterfactual Stability and the Limits of Macro-Historical Explanation

  **Project Summary**
  This project investigates a methodological impasse in comparative political economy regarding the determinants of national prosperity. Dominant explanations typically categorize causal factors into distinct modules—institutions, geography, and culture—and attempt to weigh their relative contributions. This proposal argues that the persistent failure to reach consensus is not due to data scarcity, but to a category error: the assumption that these factors are separable variables capable of satisfying standard interventionist criteria for causation. Over six months, I will conduct a conceptual analysis of existing comparative historical studies to determine whether macro-historical explanations can sustain the counterfactual claims they require when putative causes are structurally entangled. The outcome will be a diagnostic framework for distinguishing genuinely explanatory macro-claims from sophisticated redescription.

  **The Epistemic Question**
  The central epistemic question is whether macro-historical explanations of national divergence can satisfy the invariance requirements of interventionist causation when the putative causes are co-constitutive. In the philosophy of science, a causal relationship $X \rightarrow Y$ is robust only if the relationship remains invariant under interventions on $X$ that are independent of other background conditions. This project asks: *At the scale of the nation-state, is it conceptually possible to specify an intervention on "institutions" that holds "culture" and "geography" fixed, or does the manipulation of one variable necessarily redefine the others?*

  If institutional quality cannot be varied while holding cultural and geographic endowments constant—even in thought experiments—then the standard modular framework fails to license the counterfactual claims ("Had Nation A adopted Nation B's institutions...") necessary for explanatory knowledge. The project posits that the debate is stalled because the literature demands modular counterfactuals from a system that is ontologically holistic.

  **Critical Context: The Stalemate in Political Economy**
  Current literature in comparative political economy generally falls into three camps: institutionalist, geographic determinist, and culturalist. While these camps disagree on the primary driver of growth, they share a tacit methodological commitment to modularity. They treat institutions, geography, and culture as distinct regressors or narrative factors whose individual effects can be isolated via natural experiments, instrumental variables, or paired comparisons.

  However, these approaches typically establish correlation or narrative plausibility rather than explanatory depth. For instance, an institutionalist argument may demonstrate that secure property rights correlate with growth. Yet, to claim this is an *explanation* requires the ability to assert that introducing property rights in a different context would produce the same effect, ceteris paribus. If the emergence of property rights is itself dependent on specific cultural norms or geographic constraints, the *ceteris paribus* condition is violated. The literature currently lacks a mechanism to adjudicate whether these correlations reflect independent causal levers or mutually reinforcing elements of a single historical trajectory. Consequently, competing explanations often talk past one another, offering retrospective narration rather than predictive or explanatory inference.

  **Methodology and Case Selection**
  This project requires no original archival work or econometric analysis. Instead, it employs conceptual analysis applied to secondary literature. The method involves selecting two canonical divergence cases frequently cited in the literature and reconstructing the causal logic employed by proponents of each theoretical camp.

  I will focus on two paired comparisons:
  1.  **Botswana and Zambia at Independence:** Often cited in institutional literature (e.g., Acemoglu et al.) as having similar geographic and cultural endowments but divergent institutional paths.
  2.  **North and South Korea:** Frequently used to argue for institutional primacy given shared geography and pre-division culture.

  For each pair, I will analyze existing comparative studies to test the *isolatability* of the institutional variable. I will examine whether the textual evidence provided in these studies inadvertently relies on changes in cultural or geographic conditions to explain the institutional divergence. For example, does the explanation for Botswana's institutional success implicitly rely on pre-colonial cultural homogeneity that Zambia lacked? If so, the "institutional" variable is not modular.

  The analysis will draw on philosophy-of-science resources regarding explanatory robustness and counterfactual stability. I will map the causal claims made in these studies against interventionist criteria to identify points where the modularity assumption breaks down. The goal is not to adjudicate which theory is correct, but to determine if the terms of the debate allow for a correct answer to be formulated.

  **Expected Outcomes and Criteria for Success**
  The primary deliverable is a research paper articulating a diagnostic criterion for **Explanatory Robustness in Entangled Systems**. Progress will be defined by the ability to distinguish between:
  1.  **Genuine Explanatory Claims:** Where a variable can be conceptually isolated such that a counterfactual intervention is meaningful.
  2.  **Sophisticated Redescription:** Where the "cause" is merely a label for a complex configuration of entangled factors, rendering counterfactuals unstable.

  **Failure Conditions:**
  The project will be deemed to have encountered negative results if:
  1.  **Modularity Holds:** Analysis reveals that existing case studies successfully isolate institutional variables without redefining cultural or geographic conditions, suggesting the impasse is indeed empirical rather than conceptual.
  2.  **Total Entanglement:** Analysis reveals that *every* attempt to isolate a variable ends up redefining the others to such a degree that no causal inference is possible at the macro-scale. While this supports the holistic critique, it would render the diagnostic criterion useless, implying that macro-historical explanation is impossible rather than merely flawed.

  Success lies in the middle ground: demonstrating that while modularity is often assumed, it is rarely achieved, and providing a framework for identifying the specific conditions under which macro-causal claims remain valid.

  **Timeline**
  *   **Months 1-2:** Reconstruction of causal arguments in the selected case literature. Mapping explicit and implicit counterfactual claims.
  *   **Months 3-4:** Philosophical analysis of these claims against interventionist criteria. Drafting the diagnostic framework.
  *   **Months 5-6:** Refinement of the argument, stress-testing the failure conditions, and finalizing the manuscript for submission.

  **Feasibility**
  This project is uniquely suited for a six-month fellowship because it relies on synthesis and conceptual rigor rather than data collection. The requisite literature in political economy is well-established, and the philosophical tools for analyzing causation are mature. The scope is disciplined to ensure completion within the fellowship term, focusing strictly on the logical structure of existing explanations rather than generating new historical data.
