  # Decision-Tree Taxonomy: Insect Sentience and the Scale Argument

  This taxonomy maps ethical positions regarding insect moral status by isolating three critical junctures: the interpretation of behavioral evidence, the mathematics of moral aggregation, and the resulting practical priorities. It is designed for applied-ethics readers navigating the conflict between low individual probability and vast population numbers.

  ### Diagnostic Split 1 (Evidence)
  **Case:** Consider an insect that avoids noxious heat through localized reflex arcs with no central integration or global workspace.
  **Question:** Does this architecture provide:
  *   **(A)** Weak but genuine evidence leaving a small non-zero probability of sentience?
  *   **(B)** Effectively no relevant evidence, leaving that probability near zero?

  ### Diagnostic Split 2 (Aggregation)
  **Context:** Assume a small independent probability *p* for each insect and a population numbering in the billions or trillions.
  **Question:** Should moral weight be calculated by:
  *   **(A)** Linear multiplication of *p* by population size (expected-value style)?
  *   **(B)** A threshold or confidence-weighted approach in which low per-capita confidence blocks straightforward population-level scaling?

  ### Diagnostic Split 3 (Practical Weight)
  **Context:** Setting aside practical feasibility.
  **Question:** Should the protection of insects be treated as a moral priority comparable in urgency to the protection of mammals?
  *   **(A)** Yes.
  *   **(B)** No.

  ---

  ### Taxonomy Leaves (Positions)

  There are eight logical combinations of answers. Seven are occupied by distinct ethical positions; one remains empty.

  **1. Path 1A – 2A – 3A**
  *   **Label:** Scale-Accepting Sentientist
  *   **Description:** Accepts small individual probability but argues linear aggregation across trillions creates enormous moral weight requiring mammal-level priority.

  **2. Path 1A – 2A – 3B**
  *   **Label:** Scale-Mitigated Sentientist
  *   **Description:** Accepts the mathematics of linear aggregation but denies comparable priority, often due to beliefs about lower intensity of experience or higher costs of intervention.

  **3. Path 1A – 2B – 3A**
  *   **Label:** Precautionary Prioritizer
  *   **Description:** Rejects linear scaling due to uncertainty but mandates high priority based on the moral risk of harming potentially sentient beings.

  **4. Path 1A – 2B – 3B**
  *   **Label:** Confidence Skeptic
  *   **Description:** Acknowledges some evidence for sentience but argues that low confidence blocks aggregation and fails to trigger high-priority obligations.

  **5. Path 1B – 2A – 3B**
  *   **Label:** Hard Materialist Skeptic
  *   **Description:** Denies evidence of sentience entirely; linear aggregation of near-zero probability yields negligible weight, warranting no special priority.

  **6. Path 1B – 2B – 3A**
  *   **Label:** Ecological Structuralist
  *   **Description:** Denies sentience and rejects sentience-based aggregation, but argues for comparable priority based on non-sentience values like ecological stability or structural integrity.

  **7. Path 1B – 2B – 3B**
  *   **Label:** Practical Dismissivist
  *   **Description:** Denies sentience evidence and rejects aggregation logic, concluding that insect protection holds no urgency comparable to mammal protection.

  **8. Path 1B – 2A – 3A [UNOCCUPIED]**
  *   **Diagnosis:** **Incoherent.**
  *   **Reasoning:** This position claims individual probability is near zero (1B) yet insists on linear aggregation (2A) to generate high moral weight (3A). Mathematically, near-zero multiplied by any finite population remains near-zero. One cannot consistently hold that the math is linear while claiming the result is large if the input is effectively null.

  ---

  ### Practical Ambiguity Flag

  **Ambiguous Pair:** Path 1A–2B–3A (Precautionary Prioritizer) and Path 1B–2B–3A (Ecological Structuralist).

  **Explanation:** The tree cannot genuinely separate these positions in practice. Both routes reject the linear scale argument (Split 2B) and both conclude that insects deserve protection urgency comparable to mammals (Split 3A). While their theoretical justifications differ—one relies on the *possibility* of sentience, the other on *non-sentient* ecological value—the resulting policy prescriptions and behavioral commitments are identical. The ambiguity lies not in the diagnostic questions, but in the fact that divergent metaphysical commitments converge on the same applied-ethics outcome.

  ---

  ### Epistemic Note

  **Vulnerability:** This taxonomy is most vulnerable at **Split 2 (Aggregation)**.

  **Revision Trigger:** The mapping would require substantial revision if a definitive conceptual argument demonstrated that **probabilistic moral patienthood is incoherent**. If it were proven that moral status cannot be distributed via expected-value calculations (e.g., if moral patienthood is strictly binary rather than probabilistic), Split 2 would collapse, forcing all positions into the threshold category (2B) regardless of their view on evidence. Alternatively, empirical evidence proving that localized reflex arcs *cannot* support any form of integrated information processing would solidify Split 1B, rendering the entire 1A branch obsolete. Currently, the ethics of aggregation under uncertainty remains the least stable node in the structure.
