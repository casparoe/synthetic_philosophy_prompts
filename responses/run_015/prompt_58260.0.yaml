answer: |-
  Here is the breakdown of your 2am debate, mapping the biology to your test cases, followed by where the science stops supporting her "hands-off" philosophy.

  ### The Mapping: Biology vs. Your Room

  **Case 1: The Sad Pigeon Image Macro**
  *   **The Gene:** The core visual format (pigeon in chair). This is the replicator that stays constant.
  *   **The Organism:** The specific post instance (the JPEG with your specific caption).
  *   **Mutation:** Changing the caption from "midterms" to "rent" to "taxes."
  *   **Fitness:** Relatability (how much pain does it express?).
  *   **The Selector:** The student body (likes/shares) and the algorithm (reach).
  *   **Fit:** This aligns almost perfectly. The format survives because it's robust; the captions mutate to fit new environmental stresses (exams, poverty).

  **Case 2: The Sourdough Discard Recipe**
  *   **The Gene:** The concept of "crackers from waste."
  *   **The Organism:** The actual physical batch of crackers.
  *   **Mutation:** Adding rosemary vs. thyme, or baking thinner/crispier.
  *   **Fitness:** Taste and texture (survival of the delicious).
  *   **The Selector:** Your family (whether they ask for the recipe again).
  *   **Fit:** This also aligns well, but hints at the first crack in the theory: you *intentionally* mutate the recipe to make it fitter. Genes don't do that.

  ### Where the Biology Baggage Breaks Down

  Your friend is relying on **Neo-Darwinian determinism**, which assumes evolution is blind, slow, and lacks a designer. Culture breaks this in three specific ways:

  **1. Lamarckian Inheritance (Acquired Traits)**
  In biology, if a giraffe stretches its neck, its baby isn't born with a longer neck. In culture, if you improve the cracker recipe, you *tell* your sister exactly what you changed. We pass on acquired improvements intentionally.
  *   **The Break:** This means evolution isn't random. Creators *can* engineer fitness. Your friend running the page isn't waiting for random mutations; she is actively editing the genome to suit the environment.

  **2. The "Selfish" Fallacy (Agency)**
  Genes are "selfish" in that they have no goal other than replication. Memes are tools *we* use. The pigeon meme doesn't "want" to replicate; *you* use it to cope with rent anxiety.
  *   **The Break:** Because humans have agency, we can change the selection pressure. If the university changes the exam format (the environment), the "cheating copypasta" (the organism) loses its fitness instantly. It's not like bacteria finding a new antibiotic; it's like draining the swamp where the mosquitoes breed.

  **3. Fidelity and Blending**
  Genes copy with high fidelity (mostly). Memes blend. You can mash up the pigeon format with a different meme format (e.g., "Distracted Boyfriend" meets "Sad Pigeon").
  *   **The Break:** This allows for "intelligent design." Admins can look at past data (analytics) and construct a hybrid meme that has a statistically higher chance of working. It's not a lottery; it's A/B testing.

  ### Does Her "Let-It-Evolve" Conclusion Survive?

  **No.** Her conclusion that "admins shouldn't even try" relies on the idea that selection is the *only* force.
  *   **On Virality:** While you can't *guarantee* a hit, you can stack the deck. Marketing exists. Algorithms can be gamed. Seeding a meme in five different groupchats at once (artificial selection) works better than posting once and praying (natural selection).
  *   **On Cheating:** The university isn't powerless. If they move to oral exams or project-based assessment, the "copypasta virus" has nowhere to live. Biology suggests resistance is inevitable; sociology suggests you can change the behavior that makes the resistance useful.

  ### A Less Misleading Comparison

  **Market Economics** is a better fit than Biology.
  *   **Why:** In a market, there is supply (creators), demand (audience), and manipulation (marketing/ads).
  *   **The Shift:** In biology, a gene can't buy a billboard. In culture, an admin *can* boost a post. In biology, you can't bankrupt a virus. In culture, you can remove the incentive to cheat.
  *   **The Takeaway:** Markets are unpredictable, but they are not immune to engineering. You can't force a product to sell, but you can definitely kill a product by removing its distribution channel.

  Verdict: The analogy explains the spread well, but ignores human intent, so her hands-off conclusion does not hold.
