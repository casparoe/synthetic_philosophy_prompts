answer: |-
  Here are 10 questions designed to press the theoretical boundaries of Negative-Space Kinematics (NSK) without getting bogged down in bio or citations. They are ordered to build from perceptual mechanics to the broader implications of her digital claims.

  ### 1. The Perceptual Priority Problem
  "Let's start with the basic mechanism. Most eye-tracking data suggests saccades land on high-contrast stroke edges, not the counters (the negative space). If the visual system is literally grabbing the ink first, how do you argue the *space* is the primary identifier? Are you suggesting the brain inverts the figure-ground relationship before recognition happens, or is the 'space signature' a downstream cognitive construct?"

  *   **Likely Answer:** She'll probably argue that stroke processing is serial/slow, while space recognition is holistic/immediate (Gestalt-like).
  *   **Follow-up:** "If it's holistic, aren't you just describing a standard configural effect? At what point does calling it 'kinematic' add explanatory power over just saying 'we recognize shapes by their holes'?"

  ### 2. The Style-Invariance Problem (Required)
  "Take the classic invariance problem: I can read a Blackletter 'a' and a messy, quick handwritten 'a' as the same token. But the stroke geometry is wildly different, and frankly, the negative space shapes are too—the Blackletter counter is fragmented, the handwritten one might be closed or open. If style is just 'tolerable noise,' where is the threshold? How does the same spatial signature survive when the actual void geometry is topologically distinct?"

  *   **Likely Answer:** She will likely claim the *dynamic generation* of that space is identical, even if the static result looks different.
  *   **Follow-up:** "But if the static result is topologically distinct (e.g., one counter is closed, one is open), the kinematic path to create them *must* have been different. So are you saying we ignore the actual shape and only simulate the motion? If so, how do we account for typos where the motion was wrong but we still read the letter?"

  ### 3. Motor Theory vs. Visual Gestalt (Required)
  "There's a risk here of this collapsing into old-school Motor Theory—that we read by simulating writing. But if I'm reading a static sign I didn't write, I'm not engaging my motor cortex heavily. Does your view secretly rely on Visual Gestalt principles to do the heavy lifting, with 'kinematics' just tacked on as a narrative? Is the 'motion' real or just a metaphor for geometric affordance?"

  *   **Likely Answer:** She'll likely lean on "embodied cognition," arguing that even passive reading triggers sub-threshold motor simulation.
  *   **Follow-up:** "If it's sub-threshold, is it causally necessary? If we found a patient who could recognize letters but had zero motor simulation, would your theory hold, or does NSK *require* the motor link to function?"

  ### 4. The "Virtual Kinematics" Claim (Required)
  "You argue digital typefaces preserve 'virtual kinematics.' But a Bezier curve in a font file isn't a motion; it's a mathematical boundary. When you say the signature survives without a pen, are you saying the *designer's* motion is embedded in the file? If so, isn't the reader just reverse-engineering a ghost movement?"

  *   **Likely Answer:** She will argue the curves imply velocity and direction, allowing the reader to "feel" the original ductus.
  *   **Follow-up:** "This feels like an ad-hoc rescue to save the theory from digital media. If the 'kinematics' are virtual, can they be *anything*? If I can claim any static shape implies a 'virtual motion,' doesn't the term lose its falsifiability?"

  ### 5. The Pixel-Identity Edge Case (Required)
  "Let's look at distorted displays. At low resolution, an 'a' and an 'e' can become pixel-identical. The stroke geometry is the same, and the negative space is often the same single pixel void. Yet, in context, we often still disambiguate them. If the space signature is identical, what breaks the tie? Is the 'kinematic' signature robust enough to survive total geometric collapse, or does context override your signature entirely?"

  *   **Likely Answer:** She'll likely concede context plays a role but argue the "expected" kinematic flow differs.
  *   **Follow-up:** "If context overrides the signature, then the signature isn't the invariant anchor you claim it is. It sounds like the signature is just one cue among many, not the defining feature of the letter."

  ### 6. Developmental Timeline
  "Children recognize letters visually long before they have the motor competence to produce the kinematics required to make them. If the 'a'-ness of 'a' is defined by the motion that creates the space, how does a 3-year-old access that signature? Do they have to learn the motion first to see the letter, or does the visual signature precede the kinematic understanding?"

  *   **Likely Answer:** She might argue for "mirror neuron" development or that kids trace/subvocalize.
  *   **Follow-up:** "But recognition happens even without tracing. If the visual system can categorize the letter without the motor schema, doesn't that suggest the geometry is sufficient and the kinematics are secondary?"

  ### 7. The "Noise" Tolerance Limit
  "You define style as a 'tolerable noise profile.' But in design, we intentionally break signatures for effect—like a stencil 'a' where the counter is physically bridged. The space is interrupted, the motion is impossible with a standard pen. Yet we read it instantly. If the space signature is broken and the motion is impossible, what is carrying the identity? Is 'noise' just a catch-all for 'variations I haven't modeled yet'?"

  *   **Likely Answer:** She'll argue the brain "completes" the missing space (amodal completion).
  *   **Follow-up:** "If the brain completes it, is that completion kinematic or geometric? If I can complete a square with missing lines without imagining a pen drawing it, why do we need kinematics to complete an 'a'?"

  ### 8. Cross-Script Generalizability
  "Most of your examples seem to rely on Latin ductus. How does NSK handle scripts where stroke order is strict but the space is complex, like Chinese, or scripts where the pen lifts constantly, like Arabic? Does the 'negative space signature' fragment in those cases, or is there a global spatial invariant that survives the lift? If it fragments, how do we bind it into a single character identity?"

  *   **Likely Answer:** She'll likely say the theory applies universally but the "signature" is more complex.
  *   **Follow-up:** "If the signature changes complexity based on the script, are we comparing the same mechanism? Or is 'negative-space kinematics' just a description of Latin handwriting quirks generalized too broadly?"

  ### 9. Neurological Evidence
  "If kinematics are the core of recognition, we should see consistent activation in motor areas during reading tasks, specifically correlated with space processing. But fMRI studies on reading are mixed on motor engagement. Are you positing that current neuro-imaging is missing the specific signal, or is your theory compatible with a purely visual processing stream?"

  *   **Likely Answer:** She'll argue that current tech isn't sensitive to the specific "simulation" or that it happens too fast to catch.
  *   **Follow-up:** "If the signal is too fast or too subtle to measure, how do we distinguish your theory from one that says kinematics are irrelevant? We need a way to test this that doesn't rely on unobservable mental simulations."

  ### 10. Falsification
  "Finally, what would break the theory? If you showed me a letter where the stroke geometry was perfect, but the negative space was mathematically scrambled—yet people still read it correctly—would you concede the space signature isn't necessary? Or would you argue the 'virtual kinematics' somehow corrected the space in the viewer's mind?"

  *   **Likely Answer:** She might say if the space is scrambled, the kinematics *must* be wrong, so it's impossible to separate them.
  *   **Follow-up:** "That sounds like the theory is insulated from falsification. If space and motion are inextricably linked in your model, we can't test which one is doing the work. How do we disentangle them to see which is actually driving recognition?"
