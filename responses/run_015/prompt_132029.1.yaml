prompt: |-
  I'm a software engineer with no formal philosophy background, but I'm trying to resolve a consistency problem in how I think about rules. On a recent work trip, I was in a place where leaving extra money for service is considered insulting rather than kind; after excellent service I left cash on the table, and the server chased me outside to return it, clearly uncomfortable. Later that same trip, I waited at a red crosswalk with no traffic in sight while everyone around me crossed, and I formed a precise line for a bus while others filled gaps casually. Back home, tipping is built into wages, jaywalking is common if it seems safe, and queues are loose. I can't tell whether my discomfort in each case was ethical—like I'd violated some real duty—or just social, like running the wrong version of a local protocol. If these conventions aren't universal, do I have any genuine obligation to follow them as a temporary visitor, especially when my own judgment says they're unnecessary or even wrong? Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
