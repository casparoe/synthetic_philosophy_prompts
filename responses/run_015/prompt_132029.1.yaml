answer: |-
  You have no universal moral obligation to follow arbitrary local conventions, but you do have a genuine ethical duty to respect them as a guest to minimize harm and social friction.

  Your discomfort arose from a collision between internalized social models and external reality, not from violating a universal ethical truth. Philosophically, this distinguishes moral imperatives, which are binding regardless of location (e.g., do not harm), from coordination norms, which are only valid within specific systems (e.g., queue formation). However, ethics is not solely about abstract truths; it is also about consequences. When you violate a local norm, you impose cognitive load, confusion, or offense on others, as seen when the server had to expend effort returning your money.

  As a visitor, you enter an implicit social contract where adhering to local protocols is the cost of participation. Think of this like integrating with an external API: you may disagree with the documentation's architecture, but if you send requests in the wrong format, you cause system errors for the maintainers. Your personal judgment that a rule is unnecessary is irrelevant if the rule serves a function you cannot see, such as maintaining dignity or managing scarce resources. Therefore, your obligation is not to the rule itself, but to the people whose lives are structured by it. You should only override local conventions if they conflict with core moral principles, such as human rights, rather than mere differences in social efficiency.
