  The Setup and Rules
  Setting: 16 students, 80 mins, workshop.
  Split your 16 students into four teams of four. Hand each team an identical deck of 30 event cards with dates and descriptions (e.g., "Vesalius Anatomy 1543," "Luther 95 Theses 1517"). Give them three large paper banners: "Middle Ages," "Renaissance," "Scientific Revolution."
  Task: Tape a timeline on the wall. Place every card under exactly one banner. Banners cannot overlap; you must draw a border year between them.
  Constraint: You cannot leave events unclaimed. If an event feels like it belongs to two periods, you must choose one.
  Time: 25 minutes to build, 15 minutes for "Border Wars" where teams defend their cut-off points against others.
  Winning team gets bragging rights (or first choice of snacks next week).
  The friction comes when teams realize their borders don't match. Group A puts Luther in Middle Ages; Group B puts him in Renaissance. Both have the same cards. Why the difference?
  Make sure to mention the 80 minute total context.
  "You have 80 minutes total. This activity takes 40. The rest is debrief."
  Start by handing out the decks face down. Tell them they are historians constructing a narrative. They must agree on where the Middle Ages ends and the Renaissance begins. There is no right answer, but there is a winning answer.
  During the build phase, no talking to other teams. Isolate them.
  When the timer hits zero, freeze. Walk around and inspect the borders.
  Then initiate Border Wars. Pick a contentious event (like Copernicus). Ask Group 1 where it is. Ask Group 2. Let them argue.
  This sets up the reveal. They will think they are arguing about history, but they are arguing about box size.

  Materials and Roles
  You need printed cards (cardstock helps), three large sheets of paper per group for the banners, markers, and lots of masking tape. Roles help prevent loafing: The Chronologist checks dates on cards. The Architect places the banners. The Scribe notes where borderline cases went. The Advocate speaks during the Border Wars.
  Keep it cheap. Print events on standard paper, cut them up. Use chalkboard or whiteboard if wall space is tight, but wall tape feels more permanent/committed.
  Roles ensure everyone touches the problem. The Chronologist feels the anxiety of a date that fits two boxes. The Advocate feels the pressure of justifying an arbitrary line.
  No phones allowed. They must rely on the cards provided. This isolates the variable to the period labels themselves.
  Also, prepare a "Master Key" for yourself to check scores later.
  You'll need a stopwatch or phone timer visible to all. Pressure creates the gravity.
  Ensure enough wall space for four timelines side-by-side.

  The Gravity-Well Mechanic
  The scoring creates the pull. Each team gets a secret "Bonus List" of 5 Anchor Events (e.g., Copernicus, Gutenberg). You get 10 points if an Anchor Event is inside your banner.
  Problem: The Anchor Events are dated exactly on typical borderlines (e.g., 1450, 1550).
  To get the points, you must stretch your period's start/end dates to swallow the Anchor.
  This forces you to prioritize the Label over the causal flow. You will argue that 1543 is "Renaissance" not because of causality, but because you need the points. This mimics how historians sometimes force events into periods to maintain a narrative shape.
  If you leave an Anchor Event in "no man's land" between banners, it scores zero. This creates a vacuum effect. You *must* expand the gravity well to capture the mass.
  This mechanically replicates the historiographical bias where we expand "Renaissance" to catch anything brilliant, ignoring that it might belong elsewhere.

  Debrief and Mapping
  Gather everyone. Compare the timelines. They will differ.
  Ask: "Why did Group 1 put Luther in Middle Ages and Group 2 in Renaissance?"
  Reveal the mechanic: "You stretched the borders to catch the Bonus Points."
  Map this to the philosophy: The Period Name (the Banner) acted as a gravity well. It distorted the timeline to keep the system coherent.
  Question: Is the Renaissance a real thing that caused Luther, or a box we built to hold Luther?
  If you changed the box, did the history change? No, but the story did.
