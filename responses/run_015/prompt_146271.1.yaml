      *   **Methodology/Plan:**
          *   Comparative historical analysis + Quantitative data.
          *   Cases: US, UK, Sweden, maybe France? (Need variation in welfare state size). Let's stick to 3-4 post-war democracies.
          *   Baseline: One agrarian case for comparison (e.g., Early Modern France).
          *   Metrics: University graduates vs. Elite jobs (Overproduction); Public sector employment vs. GDP (State Capacity).
          *   Timeline: 12 Months.
