prompt: |-
  hey — please act as a professional philosopher of mathematics who also knows computability theory cold and has sat through a depressingly large number of math-department colloquia where the visiting philosopher got eaten alive. Do a bit of brainstorming before you start writing; I want the considered version, not your first pass, and don't hedge every single sentence into mush.

  Situation: I'm giving a 45-minute talk next week (20 min of Q&A, ugh) to a maths department colloquium. Audience is maybe 25 people: mostly analysts, two set theorists, a few senior guys who are casual Platonists and think cardinality settles every question anyone could have about the infinite, exactly one person who works in computable analysis and who I am genuinely slightly scared of, and maybe three philosophers drifting over from across campus. I'm a philosophy postdoc, so I will be read as the outsider who has come to say something confused about infinity, and I need to not confirm that impression.

  The thesis, short version. Hilbert's Hotel is supposed to show that an actual infinite is coherent: the rearrangements feel bizarre but nothing contradicts anything, so the anti-infinitist's "absurdity" charge fails. I argue the standard presentation smuggles in more than the mere existence of bijections. It assumes the manager can carry out rearrangements via a single finite, uniform instruction that each guest can evaluate using their own room number alone — one finite programme posted in the lobby, no infinite lookup table, no private whisper to each guest. Call it the finite-programme constraint. Impose it and some perfectly well-defined rearrangements of a countable hotel become unperformable. My central case is gap-closing: the manager announces that the guests whose room numbers lie in some infinite, co-infinite set S are to stay and everyone else leaves, and the stayers must compress down so there are no gaps. The compression map — send each member of S to its rank in the induced ordering — exists as a set of ordered pairs, sure, but it is only computable relative to an oracle for S; for non-computable S like the halting set there's no finite lobby notice that lets each guest work out where to go, because whether you go to room k depends on how many smaller-numbered guests stayed. Second case I lean on: "prior-notice lockout," where every guest has to decide, from their own number and the one posted notice, whether to shift left one room or stay put, with no collisions — and the target configuration is again an arbitrary infinite set.

  So the payoff I'm defending: cardinality is fine, Cantor is fine, but the hotel's operational powers are strictly weaker than its size suggests, and neither the friends of actual infinity nor the finitists have noticed that there's a third position here — infinite totalities that are real but not fully actable-on. I'm explicit that this does not rescue finitism, and in the last five minutes I gesture at supertasks and at whether an infinite physical cosmology would inherit the constraint.

  What I want from you is my Q&A prep sheet, not a defense of the view and definitely not a reading list. Give me the eight-ish objections I will actually get from this audience — from these people, not from philosophers — in roughly the order they'll arrive and roughly ordered by how much damage they'd do. Phrase each one the way that person would actually say it out loud: the Platonist analyst's version should sound impatient and cardinality-first, the computable-analysis person's version should sound like they've seen this before and want to know what's new, the set theorists' should sound technical. For each objection give me a roughly two-minute reply and one honest note on where my reply is weakest or where I should just concede. Tell me which one or two I should preempt inside the talk itself, and what I should concede up front to buy some goodwill with the cardinality-first crowd.

  Also include the question I'm hoping nobody asks.

  Last thing: tell me how confident you are in the objections you're predicting and in whether my replies will actually land on this audience, and single out the one point you're least sure about — especially if you think the whole finite-programme thing collapses into relative computability with the serial numbers filed off, or that it has no bite at all unless physical supertasks are possible, in which case say so.
