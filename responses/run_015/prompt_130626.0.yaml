      *   *Predictive Processing's Strength:* This is the sweet spot of PP. The illusion isn't noise; it's a *feature* of the generative model. The brain assumes 2D retinal images come from a 3D world. The fins on the Müller-Lyer lines trigger depth priors (inside corner = far away, outside corner = near). To make the retinal image size equal, the "far" line must be physically larger. The brain *infers* size based on this model. Knowing the truth cognitively doesn't change the low-level visual prior's precision. The persistence is explained by *hierarchical modularity* and *precision weighting*.

