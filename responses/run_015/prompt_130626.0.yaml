      *   **Predictive Processing (The "Bayesian/Control" View):**
          *   *Core Idea:* The brain is a hypothesis generator. It predicts sensory input.
          *   *Mechanism:* Minimizing "prediction error" (free energy). Top-down predictions meet bottom-up sensory data.
          *   *View on Error:* Prediction error is the *signal* used to update the model. However, the brain weighs precision (confidence) of predictions vs. sensory data.
          *   *Implication for Illusions:* Illusions persist because the *prior* (the internal model of how the world works, e.g., depth cues, perspective) is so strong (high precision) that it overrides the sensory evidence, even when cognitive knowledge says otherwise. The visual system is encapsulated; the "knowledge" that lines are equal is a high-level cognitive prior, but the visual prior (corners imply depth) is lower-level and higher precision in that specific module.
