answer: |-
  Here is the prioritization based on your constraints (two years, no specialist background, access to archives) and your core question (locked-in vs. convergence).

  ### The Ranking

  1.  **Reversibility Thresholds (Your #3)**
  2.  **Epistemic Lock-in (Your Idea)**
  3.  **Micro-to-Macro Aggregation (Your #1)**
  4.  **Convergence Arguments (Your #2)**

  ### The Reasoning

  **1. Reversibility Thresholds is the empirical crux.**
  This is upstream of everything else *methodologically*. You cannot determine if history is "locked in" until you define what it costs to get out. In your zoning example, the lock-in isn't just that the streets are there; it's that the cost to re-zone, re-pave, and re-compensate property owners exceeds the benefit of a "better" layout.
  *   **Why it's #1:** It is the only one of the three that is directly measurable in an archives setting. You can trace permit costs, legal challenges, and infrastructure budgets over time. You can look for the moment when the cost of changing the path spiked above the cost of maintaining it.
  *   **Tractability:** High. You are looking for records of decisions *not* taken, or proposals that were rejected due to cost/complexity.

  **2. Epistemic Lock-in belongs here, not in the trash.**
  Your intuition is correct: this is a specific mechanism that drives up the reversibility threshold. It is not a standard term in economics (which usually focuses on switching costs or network effects), but it is a recognized phenomenon in organizational theory and the history of technology (often called "loss of tacit knowledge" or "capability traps").
  *   **Why it's #2:** It is the *qualitative* explanation for the *quantitative* threshold in #1. If the city loses the blueprints, or the engineers who understand the old drainage system die out, the cost to reverse the decision becomes effectively infinite.
  *   **Verdict:** Keep it. Frame it as a sub-component of Reversibility Thresholds. It turns a financial question ("can we afford to change?") into an informational one ("do we know how to change?"). This is highly tractable for an archivist: look for gaps in record-keeping, staff turnover logs, or correspondence showing confusion about old systems.

  **3. Micro-to-Macro Aggregation is theoretically upstream but empirically hard.**
  This asks how individual choices (a builder choosing a lot size) become systemic (the whole downtown grid). This is the "engine" of path dependence (increasing returns, network effects).
  *   **Why it's #3:** While this explains *why* the lock-in happens, proving it requires statistical modeling or agent-based simulation. Without an econ background, you risk confusing correlation with causation. You might see a pattern in the archives, but you won't be able to prove it wasn't just a top-down decree.
  *   **Tractability:** Low. It requires aggregating data points you may not have.

  **4. Convergence Arguments are a dead end for your timeline.**
  This is the "we would have gotten cars anyway" debate. This is a counterfactual claim. You cannot prove a negative (that a different path was *impossible*).
  *   **Why it's #4:** It shifts the level of analysis so high that it becomes philosophical. Even if we would have invented cars, the *layout* of the city (your specific interest) is not convergent. We could have had cars with a grid, a radial system, or no downtown at all.
  *   **Tractability:** Very Low. You will spend two years arguing about definitions rather than looking at evidence.

  ### The "Crux" of the Matter

  The upstream dependency works like this:
  **Micro-choices (1)** create a system $\rightarrow$ **Knowledge/Cost Thresholds (3 + Epistemic)** are crossed $\rightarrow$ The system becomes **Irreversible** $\rightarrow$ **Convergence (2)** becomes irrelevant because the specific local optimum is now stuck.

  If you want to know if history is locked in, you must find the **Threshold**. That is the switch. Before the threshold, the path is reversible (history is fluid). After the threshold, the path is locked (history is deterministic).

  ### How to Reorder This (Evidence to Watch For)

  Over the next two years, look for these specific signals in the archives to validate or shift this ranking:

  1.  **If you find "Ghost Paths":** If you find detailed, funded plans for alternative zoning layouts that were abandoned *not* due to cost, but due to a lack of personnel who could execute them, **Epistemic Lock-in moves to #1**. This proves knowledge loss was the primary barrier, not money.
  2.  **If you find Frequent Reversals:** If you see the city successfully undoing major decisions every 10–15 years, **Reversibility Thresholds drops in priority**. It means the "lock" isn't real, and you should switch to studying **Micro-choices (1)** to see what triggers the temporary stability.
  3.  **If you find Parallel Solutions:** If you find evidence that different departments solved the same problem in totally different ways simultaneously (e.g., water vs. electric grids laid differently), **Convergence (2) gains weight**. It suggests technology isn't locked in, but institutional silos are.

  ### Summary Advice

  Focus on **Reversibility Thresholds** using **Epistemic Lock-in** as your lens.

  Don't try to prove that the 1923 decision was the *only* way (Convergence). Don't try to model every homeowner's choice (Micro-Macro). Instead, find the moment when the city *could* have changed the zoning but *didn't*, and document whether the barrier was money (cost threshold) or missing information (epistemic threshold). That is a complete, novel, and tractable project for a non-specialist with archive access.
