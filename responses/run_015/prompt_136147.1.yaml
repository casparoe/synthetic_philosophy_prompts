  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is Micro-to-Macro really less important?* In academia, it's the big question. But for a 2-year volunteer project? It's too big. I need to tailor the advice to the *user's constraints*, not the field's general priorities. The prompt asks "if you were advising someone with maybe two years and no econ or history background." So tractability is key.
      *   *Convergence:* This is often used to dismiss PD. If we'd get cars anyway, does PD matter? Yes, because the *type* of car or *layout* matters. I need to make sure the user understands that convergence on function $\neq$ convergence on form.
