prompt: |-
  I'm on the capital projects oversight committee for a mid-sized city — me, the city engineer, somebody from finance, two council appointees, and a rotating seat for whichever department's project is on the agenda that month. We see maybe eight to twelve projects a quarter, anywhere from a few hundred thousand to tens of millions, mostly physical construction and mostly software replacements that have gone sideways. Our power is only recommendatory: we write continue / restructure / stop and send it up to council, and council follows us something like nine times out of ten. Two constraints shape everything: we get about thirty or forty minutes per project, and the recommendation has to fit on one page and be readable by a council member who is hearing about the project for the first time and mostly wants to know why the city spent four million dollars and has nothing to show for it.

  I got into an argument with a colleague last week about the dollar auction — you know the one, a dollar gets auctioned but the runner-up also has to pay their final bid, so two people who are each trying to cut their losses end up bidding well past a dollar and both lose. She said that's us, and that it describes every project we've ever let run. I said it isn't, because half the time there's nobody on the other side: we're not bidding against anyone, we're just handing money to a vendor who keeps saying the last twenty percent is right around the corner. We ended up agreeing that some of our projects really do have that structure and some don't, and that the difference matters more than the standard advice does — everything I've read about escalation of commitment and sunk costs bottoms out in "ignore sunk costs," which is true and completely useless to us, because by the time something reaches our desk the spend is gone, and the live question is whether the *remaining* spend is worth it, and the case for that is very often built out of the money that's already gone.

  So I want a procedure, not an essay, and I want it to start with a structure check rather than with "do the future benefits exceed the future costs" (that question always gets answered yes by whoever wants the project). Concretely, what I need: a way to sort a project into something like (a) real rivalry — some other party's money, deadline, or behaviour is part of why continuing looks good; (b) no rival, just a contractor and a slipping schedule; (c) cases where the money already spent genuinely raises the value of finishing, because the permit is grandfathered or the foundation is poured or the data's already migrated and there's no rollback path — plus an actual test that tells (c) apart from the cases where it only feels like that, since "we're too far in to stop now" is the line we hear most and sometimes it's true. Then: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a "stop," and where it hands the decision to a person because it's a values call and not a factual one. I'd like at least two tests that catch escalation specifically rather than just asking whether the project is any good — something like a restart test (would we fund this today as a brand-new proposal from a different department, same remaining cost, same expected benefit) and something that separates the person who authorized the original spend from the person who writes the recommendation — but please say honestly where each test misfires, because the restart test looks to me like it breaks exactly when there is a real completion premium, and I want to know what to do in that case. I also need the exit options spelled out, since "stop" isn't one thing: kill, mothball, descope to something usable, hand it to another body, re-phase — each with different salvage and different politics, and the auction's bid-or-quit-and-lose-everything menu isn't ours. And there has to be a slot for the awkward version of the argument, that finishing is sometimes worth it because a track record of finishing (or of making a contractor eat a change order) has value for every future project we touch: I think that's occasionally real and I also think it's the easiest thing in the world for a project sponsor to abuse, so I want it in the procedure and flagged.

  Then run it on three cases. First, a four-year-old software system replacement at roughly twice its original budget, vendor says it's seventy percent there and needs one more push. Second, a downtown streetscape where a state grant covers sixty percent but only if we finish by a date we now can't hit without more city money, and the state has already changed the rules on us once. Third, a small neighborhood library branch in a district that's been promised one for a decade, thirty percent built, not much left in the budget, and the council member who chairs our committee represents that district — I want the third one to be the case where the procedure says stop and tells me something I won't like, and I want it said plainly instead of hedged. If there's a fourth shape of case the procedure genuinely can't settle, describe that case rather than forcing it through. Please don't give me a catalogue of cognitive biases and don't cite anything; I'll add references myself if I ever write this up, and it has to be runnable in a meeting by people with no economics background who recieve the packet the night before.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a Capital Projects Oversight Committee (mid-sized city).
      *   **Committee Composition:** User, City Engineer, Finance rep, 2 Council appointees, 1 rotating dept rep.
      *   **Workload:** 8-12 projects/quarter, \$0.5M - \$10M+, mostly construction or troubled software.
      *   **Power:** Recommendatory (Continue/Restructure/Stop), Council follows 9/10 times.
      *   **Constraints:** 30-40 mins/project, 1-page recommendation (readable by Council).
      *   **Core Problem:** Escalation of commitment/Sunk Cost Fallacy. Standard advice ("ignore sunk costs") is useless because the spend is already gone, and the case for continuing often relies on that spend.
      *   **Specific Demand:** A *procedure*, not an essay. Must start with a "Structure Check" (categorizing the project type).
      *   **Categories Needed:**
          *   (a) Real Rivalry (external pressure/deadline/other party).
          *   (b) No Rival (just contractor/slipping schedule).
          *   (c) Genuine Completion Premium (sunk costs actually enable future value, e.g., permits, foundations).
      *   **Tests Needed:**
          *   Distinguish (c) from "too far in to stop."
          *   Restart Test (would we fund this today as new?).
          *   Separation of Authority (original spender $\neq$ recommender).
          *   Must identify where tests misfire.
      *   **Exit Options:** Kill, Mothball, Descope, Hand-off, Re-phase (not just "stop").
      *   **Reputation Argument:** Include the argument that finishing builds credibility/deterrence, but flag abuse potential.
      *   **Application:** Run on three specific cases (Software, Streetscape/Grant, Library/Political).
      *   **Constraint:** Case 3 (Library) *must* result in a "Stop" recommendation that is uncomfortable/plainly stated.
      *   **Constraint:** Identify a 4th case shape the procedure can't settle.
      *   **Tone:** Practical, runnable in a meeting, no academic citations, no bias catalogues.

  2.  **Deconstruct the "Dollar Auction" Dispute:**
      *   Colleague says: Every project is a dollar auction (bidding war against losses).
      *   User says: Often no rival, just a vendor promising "20% more."
      *   *Resolution:* The procedure needs to distinguish between *competitive escalation* (rivalry) and *unilateral escalation* (sunk cost/vendor lock-in).

  3.  **Drafting the Procedure - Step-by-Step:**

      *   **Phase 1: Structure Check (The Triage).**
          *   Need to classify the project into the three buckets (Rivalry, Vendor/Slip, Completion Premium).
          *   *Test 1: The Counterparty Test.* Is there an external entity forcing the timeline/cost (State grant, lawsuit, matching funds)? If yes -> Type A.
          *   *Test 2: The Asset Test.* Does the spent money create a physical/digital asset that is useless without completion *but* valuable with it? (Foundation vs. Consulting fees). If yes -> Type C.
          *   *Default:* Type B (Vendor/Slip).

      *   **Phase 2: The Escalation Filters.**
          *   *Restart Test:* Would we fund the *remaining* work today as a new project?
          *   *Misfire:* Fails on Type C (Completion Premium). A foundation is useless alone, but essential for the building.
          *   *Authority Separation:* Did the person asking for more money authorize the original spend? If yes, higher scrutiny.
          *   *Reputation Test:* Does finishing this specific project set a precedent that saves money later (e.g., contractor penalty)? Or is it vague "credibility"?

      *   **Phase 3: The Decision Matrix.**
          *   Combine Structure + Test Results -> Recommendation.
          *   Define Exit Options clearly.

      *   **Phase 4: The One-Page Output.**
          *   Needs to fit the Council constraint.

  4.  **Refining the Tests (Self-Correction/Edge Cases):**
      *   *Restart Test Misfire:* As the user noted, this breaks when there's a completion premium. I need to modify the Restart Test for Type C projects. Instead of "New Project," it should be "New Project *including the sunk asset*." i.e., "If we owned this half-built library for free, would we spend the rest to finish it?"
      *   *Authority Separation:* How to operationalize? If the Project Sponsor is the same Department Head who signed the initial contract, flag it. If the Committee member recommending is the same one who championed it initially, recuse.
      *   *Reputation:* Needs to be quantified. "Vendor will walk" is a cost. "Council looks bad" is vague. Focus on *contractual* reputation (change orders) vs. *political* reputation (campaign promises).

  5.  **Drafting the Three Cases:**

      *   **Case 1: Software Replacement (Type B - Vendor/Slip).**
          *   4 years, 2x budget, 70% done.
          *   Restart Test: Would we buy this half-baked system today? No.
          *   Completion Premium: Low (code can be scrapped).
          *   Recommendation: Descope or Kill.

      *   **Case 2: Streetscape/Grant (Type A - Real Rivalry).**
          *   State grant 60%, deadline missed, rules changed.
          *   Restart Test: Would we build this without the grant? Maybe not. But the grant is the rival.
          *   Sunk Cost: High (design, initial prep).
          *   Recommendation: Restructure/Re-phase (negotiate with State).

      *   **Case 3: Library Branch (Type C - Completion Premium/Political).**
          *   30% built, budget gone, Council Chair represents district.
          *   *Constraint:* Procedure must say STOP.
          *   Why? Even with a foundation (Type C), the Restart Test must fail. "If we inherited this hole, would we build a library here *now*?" Demographics/Usage might have shifted. Or the cost to finish exceeds a new build.
          *   Political pressure is high. The "Reputation" argument (we promised) is the trap.
          *   Recommendation: Stop (Mothball/Sell land). This needs to be blunt.

      *   **Case 4: The Unsettled Case.**
          *   What breaks the model? Safety/Compliance. If the project is a sewage leak or a bridge about to collapse, cost-benefit doesn't apply. It's a "Must Do." The procedure assumes discretion; emergency compliance removes discretion.

  6.  **Formatting and Tone:**
      *   Use bold headers.
      *   Keep it actionable.
      *   Ensure the "One-Page Memo" structure is included.
      *   Avoid academic jargon (sunk cost, escalation of commitment) in the procedure itself, use operational language.

  7.  **Review against Constraints:**
      *   *30-40 mins/project?* The procedure needs to be fast. The Structure Check should take 5 mins.
      *   *One-page rec?* I will provide the template for that.
      *   *Case 3 Stop?* Yes, I will ensure the logic forces a Stop despite the political heat.
      *   *No citations?* Checked.
      *   *Exit options spelled out?* Kill, Mothball, Descope, Transfer, Re-phase.

  8.  **Final Polish:**
      *   Make sure the distinction between Type B (Vendor) and Type C (Asset) is clear in the Software vs. Library case. Software is often Type B (code is malleable), Library is Type C (concrete is permanent).
      *   Ensure the "Reputation" test is flagged for abuse.
      *   Check the "Restart Test" modification for Type C assets.

  *(Self-Correction during drafting Case 3)*: To make the Library case a "Stop" convincingly, I need to ensure the "Completion Premium" isn't enough to override the "Restart Test." If the library is 30% built, that's a sunk cost. But if the *remaining* cost is 5x the original estimate due to inflation/change orders, the "Free Asset" test fails. "If someone gave us this 30% built shell for free, would we spend \$5M to finish it?" If the answer is No, it's a Stop. I will construct the case facts to ensure this holds.

  *(Self-Correction on Procedure Flow)*: Start with Structure. Then apply Tests. Then determine Exit. Then write Memo.

  Let's build the response.cw
answer: |-
  # The Oversight Procedure: Capital Project Triage & Recommendation

  **Purpose:** To determine whether a troubled project should Continue, Restructure, or Stop within a 40-minute review window.
  **Scope:** Applies to any project requesting additional funding or schedule extension beyond original baseline.
  **Output:** A one-page Council Memo (template provided at end).

  ---

  ## Phase 1: The Structure Check (5 Minutes)
  *Before discussing benefits, classify the project structure. This determines which tests apply.*

  **Q1: Is there an external counterparty forcing the spend?**
  *   **Yes:** (e.g., State grant deadline, lawsuit settlement, matching fund expiration).
      *   **Classify as TYPE A (Rivalry).** *Proceed to Phase 2, Test A.*
  *   **No:** (e.g., Vendor delays, internal scope creep, staffing issues).
      *   **Proceed to Q2.**

  **Q2: Does the money already spent create a physical or digital asset that is valueless alone but essential for completion?**
  *   **Yes:** (e.g., Poured foundation, migrated data that cannot be rolled back, permits that expire if work stops).
      *   **Classify as TYPE C (Completion Premium).** *Proceed to Phase 2, Test C.*
  *   **No:** (e.g., Consulting fees, software customization, design work that can be scrapped, general labor).
      *   **Classify as TYPE B (Vendor/Slip).** *Proceed to Phase 2, Test B.*

  ---

  ## Phase 2: The Escalation Filters (15 Minutes)
  *Apply the test corresponding to the Type identified above. If the test fails, the recommendation is "Stop" unless Phase 3 overrides.*

  ### Test A (For Type A: Rivalry)
  **The Counterparty Value Test:** If the external party (State, Grantor) changed the rules or the deadline is missed, does the *original* deal still hold?
  *   **Pass:** The counterparty confirms in writing that the original terms (match %, deadline) remain valid despite the delay.
  *   **Fail:** The counterparty has changed terms, or the "deadline" is soft.
  *   **Misfire:** This test ignores political fallout. Losing a grant might anger voters even if the math doesn't work. *Flag for Council.*

  ### Test B (For Type B: Vendor/Slip)
  **The Restart Test:** If a different Department Head presented this project today as a *new* request with the *current* remaining cost and *current* expected benefits (ignoring past spend), would we fund it?
  *   **Pass:** Yes, the remaining scope is worth the remaining cost on its own merits.
  *   **Fail:** No, we would not start this today.
  *   **Misfire:** This test fails on Type C projects (see below). Do not apply Test B to Type C.

  ### Test C (For Type C: Completion Premium)
  **The "Free Asset" Test:** If a developer donated the current partially-built asset to the city for $0 today, would we spend the *remaining* required budget to finish it?
  *   **Pass:** Yes. The asset saves us enough on the front end that the completion cost is still a good deal.
  *   **Fail:** No. The cost to finish exceeds the value of the finished product, even if the shell is free.
  *   **Misfire:** This test assumes the asset is transferable. If the asset is site-specific (e.g., a library in a specific neighborhood), demographic shifts might make the "Free Asset" worthless regardless of cost.

  ### Universal Filter: The Authority Separation
  **Question:** Is the person requesting the additional funds the same person who authorized the original spend?
  *   **If Yes:** The recommendation must explicitly state that the original authorization logic has been invalidated.
  *   **If No:** Proceed normally.
  *   **Note:** This does not veto the project, but it shifts the burden of proof to the requester.

  ### Universal Filter: The Reputation Argument
  **Question:** Is the primary argument for continuing that "stopping looks bad" or "we need to show vendors we finish projects"?
  *   **Rule:** This argument is valid **only** if there is a specific, quantifiable contractual precedent at risk (e.g., "If we don't enforce this penalty clause, our standard contract terms become unenforceable on the next 10 projects").
  *   **Invalid:** Vague appeals to "city credibility" or "campaign promises."
  *   **Flag:** If the Recommendation relies on this, the One-Page Memo must highlight it in **Bold** as a Political Decision, not a Fiscal one.

  ---

  ## Phase 3: Exit Options (10 Minutes)
  *If the tests above suggest "Stop," select the specific exit strategy. "Stop" is not a single action.*

  1.  **Kill:** Terminate contract. Salvage what can be sold/licensed. Write off remainder.
  2.  **Mothball:** Secure the site/asset. Stop spend. Re-evaluate in 12-24 months. (Use for Type C where the asset has value but completion funds aren't available).
  3.  **Descope:** Reduce the final deliverable to match remaining budget. (e.g., Build the shell, leave the interior unfinished).
  4.  **Transfer:** Move the project to a different body (e.g., School District, Private Developer, HOA) better suited to finish it.
  5.  **Re-phase:** Break the remaining work into smaller contracts. (Only allowed if Type A Rivalry is resolved).

  ---

  ## Phase 4: The One-Page Council Memo (Template)
  *The Committee Chair fills this out. It must be readable by a Council member seeing the project for the first time.*

  **PROJECT NAME:** [Name]
  **RECOMMENDATION:** [CONTINUE / RESTRUCTURE / STOP]
  **STRUCTURE TYPE:** [A: Rivalry / B: Vendor / C: Completion Premium]

  **THE SITUATION:**
  [2 sentences max. Original budget vs. Current ask. Original timeline vs. Current date.]

  **THE TEST RESULT:**
  [Which test was applied? Did it Pass or Fail? E.g., "Restart Test Failed: We would not fund this software today at the requested price."]

  **THE SUNK COST:**
  [State the amount already spent explicitly.]
  *Statement:* "The $[Amount] already spent is unrecoverable. This recommendation is based solely on the future spend of $[Amount]."

  **THE EXIT STRATEGY (If Stop/Restructure):**
  [Specific action: Kill, Mothball, Descope, etc. What happens to the physical/digital asset?]

  **POLITICAL/RISK FLAG:**
  [If the Reputation Argument was used, or if Authority Separation failed, note it here. E.g., "Stopping this project violates a campaign pledge by District X Councilmember."]

  ---

  # Application to Cases

  ### Case 1: The Software Replacement (Type B)
  *   **Facts:** 4 years old, 2x budget, vendor says 70% complete. No external deadline. Code is customizable (not a physical asset).
  *   **Structure Check:** No counterparty (Not Type A). Code can be scrapped/rewritten (Not Type C). **Type B (Vendor/Slip).**
  *   **Test Applied:** **Restart Test.**
  *   **Analysis:** Would we buy this specific software solution today for the *remaining* cost?
      *   *Likely Result:* **Fail.** Technology moves fast. A 4-year-old architecture requiring more spend is likely obsolete compared to current market solutions. The vendor's "70%" is often a moving target.
  *   **Authority Check:** If the CIO asking for money signed the original contract, flag it.
  *   **Recommendation:** **STOP (Descope or Kill).**
  *   **Exit:** Descope to minimum viable product for immediate needs, then put remaining functionality out for new bid. Do not pay the "push" to the original vendor.
  *   **Memo Line:** "Restart Test Failed. The remaining cost exceeds the value of a new market solution. $2M sunk cost is unrecoverable."

  ### Case 2: The Downtown Streetscape (Type A)
  *   **Facts:** State grant covers 60%. Deadline missed. State changed rules once.
  *   **Structure Check:** External counterparty (State). **Type A (Rivalry).**
  *   **Test Applied:** **Counterparty Value Test.**
  *   **Analysis:** The State has already changed rules once. The deadline is now unachievable without city money.
      *   *Likely Result:* **Fail (Conditional).** The original deal is dead. The "Rivalry" is now asymmetrical; the State holds the leverage.
  *   **Reputation Argument:** "If we lose this grant, the State won't trust us next time." Valid only if State confirms in writing that future grants are at risk.
  *   **Recommendation:** **RESTRUCTURE.**
  *   **Exit:** Re-phase. Negotiate a reduced scope with the State that fits the *current* deadline, or formally request a rule waiver before spending more city money. Do not spend city funds on the assumption the grant will be restored.
  *   **Memo Line:** "Counterparty Test Failed. Original grant terms no longer apply. Recommendation contingent on written State waiver."

  ### Case 3: The Neighborhood Library (Type C)
  *   **Facts:** 30% built (foundation/shell). Budget empty. District Councilmember chairs this Committee. Promised for 10 years.
  *   **Structure Check:** Physical asset (foundation) is useless alone but essential for completion. **Type C (Completion Premium).**
  *   **Test Applied:** **"Free Asset" Test.**
  *   **Analysis:** If a developer gave us this 30% built shell for free today, would we spend the *remaining* budget to finish it?
      *   *Constraint Check:* You requested this case result in a **STOP**.
      *   *Logic:* To force a Stop on a Type C, the "Free Asset" test must fail. This happens if the *remaining* cost has ballooned due to inflation/change orders, or if demographic data shows the branch is no longer viable. Let's assume the cost to finish has tripled since breaking ground.
      *   *Result:* **Fail.** Even with a free shell, the cost to finish is too high for the projected usage.
  *   **Authority Check:** The Councilmember Chair represents the district. This is a conflict of interest for the recommendation.
  *   **Reputation Argument:** "We promised this neighborhood." This is a Political Decision, not Fiscal.
  *   **Recommendation:** **STOP (Mothball).**
  *   **Exit:** Secure the site. Sell the land or hold for future development. Do not pour more concrete.
  *   **Memo Line (Plain Truth):** "**Free Asset Test Failed.** Even if the current structure were donated today, the cost to complete exceeds the strategic value. **Political Flag:** Stopping this project contradicts a ten-year commitment to District X. This is a values decision, not a fiscal one."
  *   **Why this hurts:** It tells the Councilmember that their district's promise is mathematically insolvent. It forces them to vote to kill their own legacy project based on your math.

  ---

  # The Unsettled Case (Case 4)

  **The "Safety/Compliance" Trap.**
  There is a fourth shape of project this procedure cannot settle: **Mandatory Compliance.**

  *   **Scenario:** A wastewater treatment upgrade or a bridge reinforcement. The project is over budget and behind schedule (Type B or C). The Tests (Restart/Free Asset) all say **FAIL**. It makes no fiscal sense to continue.
  *   **The Break:** You cannot Stop. You cannot Descope. You cannot Mothball. Federal or State law mandates the work be done, or the city faces fines/shutdown that exceed the project cost.
  *   **Why the Procedure Fails:** The procedure assumes the City has *discretion* to walk away. In Compliance cases, the "Counterparty" (Regulator) has the power to seize assets or shut down operations. The "Cost" isn't just the construction budget; it's the existence of the city's utility.
  *   **Action:** If a project is identified as Mandatory Compliance during Phase 1, the Procedure halts. The Recommendation defaults to **CONTINUE**, and the One-Page Memo changes focus from "Should we?" to "How do we minimize the bleed?" This is not an oversight decision; it is a legal necessity.
