answer: |-
  Good morning. Look around this room. On one side, we have the people who keep the lights on and the contracts tight. On the other, the people who know what these objects actually *are*. Usually, this is where we start fighting. The lawyers talk about title chains and due diligence. The curators talk about preservation and public access. The historians talk about blood and ritual and silence.

  We all know the headlines. We know the Benin Bronzes. We know the argument about who owns what. But if we spend the next two days just arguing about shipping logistics and legal title, we are going to miss the point. We are treating these objects like frozen assets, when for the people who made them, they were never assets at all. They were participants.

  Here is the knot we need to cut: We are arguing about restitution as if the problem is purely geographical. That the object is in the wrong *place*. But the deeper problem is that the object is in the wrong *category*.

  In this museum, in this legal framework, a ritual figure is an "artifact." It is a noun. It is static. It is meant to be looked at, protected from humidity, and insured against theft. But in the ontology of its creation, that figure was a verb. It was an agent. It was meant to be touched, fed, danced with, and worn down by use. Its value wasn't in its permanence; it was in its function. When you put a ritual agent in a climate-controlled case, you aren't just moving it. You are changing what kind of thing it is. You are turning a ancestor into a statue.

  So, I want to offer a verdict for this workshop to wrestle with. I am arguing for position A: Genuine restitution requires dismantling the museum's categorical framing, not just shipping the crate back.

  If we return the object but insist it remains an "artifact" worthy of museum care, we haven't fixed the violence. We've just moved the prison.

  To my colleagues in law: I know this makes your job harder. You deal in definitions. You need to know if something is property, cultural heritage, or human remains so you know which contract applies. But I'm asking you to consider that the contract itself might be the error. If the object is a ritual agent, it cannot be "owned" in the Western sense. You can't have title to a person, and if these objects are persons-in-relation, then a bill of sale is a category error. Restitution isn't a transfer of title. It's a resignation of jurisdiction. It's admitting that some things fall outside the law of property entirely.

  To my colleagues in curating: Please hear this carefully. This is not an accusation of theft. You did not steal these things. You saved them, by your lights. You protected them from decay and loss. But preservation is not neutral. To preserve something is to stop it from living. You have been caring for these objects as if they were sleeping children, when they are actually elders who need to be working. Keeping them safe is a form of control. Letting them go back to a context where they might be worn down, altered, or even consumed by ritual use—that is respecting their ontology. It hurts to admit that your care might be a kind of cage. But admitting that is the only way to open the door.

  If we simply return the physical item but demand it be treated as "art" in a new building, we are exporting our ontology along with the crate. We are saying, "You can have this back, but you must treat it the way we did." That is not restitution. That is colonization with better logistics.

  So here is the challenge for this workshop. Don't just ask "How do we get it back?" Ask "What do we become when we let it go?"

  If we choose genuine restitution, we accept that some holes will be left in our galleries. We accept that some objects will disappear into communities where we cannot track them, where they will not be labeled, and where they will not be safe. We accept that their safety is not our business. Their life is.

  We need to stop trying to solve this with better contracts. We need to solve it with humility. We need to dismantle the frame that says everything must be collected to be valued. Because sometimes, the only ethical way to value a thing is to let it leave the room.

  Thank you. Let's get to work.
