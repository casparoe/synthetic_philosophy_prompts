answer: |-
  Here is an analysis of Ottoline March's adjudicating logic, the prediction for the valley exhibit, and the recommendation for your final chapter.

  ### I. The Three Rules of the Studio

  Based on the verdicts you have drafted, Ottoline is not running a single definition of "letterhood." She is running a triage system with three distinct filters. A glyph must pass through them in order.

  **1. The Topological Floor (The "Spot" Rule)**
  *   **Derived from:** The ink-spread verdict (No) vs. the worn impression verdict (Yes).
  *   **The Logic:** There is a minimum structural requirement for a letter to exist as a signifier rather than a mark. A hairline break is damage to a structure that still exists; a filled counter is the destruction of the structure itself. Topology (open vs. closed, oriented vs. rotated) sets the absolute boundary.
  *   **The Limit:** If the gesture is physically obliterated, identity dies.

  **2. The Systemic Ceiling (The "Job" Rule)**
  *   **Derived from:** The Cyrillic single-storey *a* (No) and the Cyrillic shop sign *H/B* (Yes).
  *   **The Logic:** Form is secondary to function. A shape that looks like an *a* is not an *a* if its orthographic job is to be a *d* (or Cyrillic *а*). Conversely, a shape that looks like an *H* is an *n* if the system demands it. Identity is assigned by the ecosystem the letter inhabits, not by its visual archetype.
  *   **The Limit:** A letter cannot be adjudicated in a vacuum; it must be read within its own alphabet.

  **3. The Gestural Thread (The "Survival" Rule)**
  *   **Derived from:** Her catchphrase ("the gesture... survives everything else") and the inverted thick/thin verdict (Yes to identity, No to style).
  *   **The Logic:** This is Ottoline's conservator soul speaking. She distinguishes between *Identity* (is it an *a*?) and *Style* (is it the *a* of this face?). She allows for massive stylistic drift (inverted stress, wide aperture) provided the "gesture"—the kinetic intent of the maker—remains continuous. This rule protects the letter from being killed by bad design or evolution, provided the lineage of intent is unbroken.
  *   **The Limit:** This rule is the most flexible, but it relies on the presence of a "maker" or a lineage.

  ### II. The Valley Exhibit: Predictions

  Here is how each rule processes the valley workshop's drifted *a* (the "o with a tick"):

  *   **The Topological Floor:** **FAIL.** You state the bowl has "closed into a near-circle." By the logic of the ink-spread verdict, a closed counter turns an *a* into a spot or an *o*. Physically, the aperture is gone.
  *   **The Systemic Ceiling:** **PASS.** The local *o* is a hexagon. The two are never confused. The villagers read it as *a*. Its job is unambiguously *a*.
  *   **The Gestural Thread:** **PASS.** Nine generations of documented descent. The drift is gradual, intentional copying, not damage. The "gesture" has survived, even if the shape has mutated.

  ### III. The Verdict: Best Guess

  **Ottoline will rule: Yes, it is an *a*.**

  **The Reasoning:**
  Ottoline will prioritize the **Gestural Thread** and the **Systemic Ceiling** over the **Topological Floor**.

  Why? Because she distinguishes *damage* (the ink spread) from *drift* (the valley sheets). The ink spread was noise—an accident that destroyed the signal. The valley drift is signal—it is the history of the letter itself. Her catchphrase ("the gesture... survives everything else") is the key. To Ottoline, the "gesture" is not just the shape of the curve; it is the continuity of human intent.

  If she ruled "No," she would be contradicting her verdict on the Cyrillic shop sign. In the shop sign, she allowed form to be completely overridden by systemic function. In the valley, she has both systemic function (the villagers read it as *a*) and historical continuity (the pattern sheets). To deny this would be to deny the reality of how language actually lives, which a conservator of her caliber would respect. She will likely note that the "tick" is the ghost of the stem, enough to satisfy the topological floor *in this specific context*, because the system sustains it.

  She will say: *"The bowl is closed, yes. But the hand that closed it knew it was writing an a. The village reads it as an a. The gesture has not died; it has only migrated. It is an a."*

  ### IV. The Final Exhibit: Recommendation

  You should choose **Candidate 2: The glyph with no descent at all (Program/Forger).**

  **Why Candidate 1 (Reassigned Valley) is weaker:**
  This exhibit pits **Descent** against **System**. (It comes from an *a*, but the system calls it an *o*).
  We already have strong data on how Ottoline resolves this. In the Cyrillic single-storey *a* verdict, she ruled that System overrides Form/Descent. In the Shop Sign verdict, she ruled that System overrides Visual Archetype. Candidate 1 is essentially a re-run of the Cyrillic verdict. We already know she believes "what a letter is depends on the job it does." If the spelling reform changed the job, she would likely rule it is now an *o*, however tragic the history. It confirms a rule we already know.

  **Why Candidate 2 (Program/Forger) does more work:**
  This exhibit pits **Function/Form** against **The Gestural Thread.**
  This is the only exhibit that directly challenges her catchphrase and the Hofstadter *Letter Spirit* shelf-note planted in your first act.

  1.  **Thematic Closure:** The novel opens with a reference to a program trying to draw an alphabet in a coherent style. It must end by testing whether that program succeeded in creating a "letter" or just a "shape."
  2.  **The Definition of Gesture:** Candidate 2 forces Ottoline to define "gesture." Is gesture the *physical history* of the mark (the punch, the pen, the human hand)? Or is it the *perceived spirit* of the mark (the coherence, the style, the function)?
      *   If she says **Yes**: She admits that "gesture" can be synthesized. The soul of the letter is in the reading, not the making. This validates the narrator's experiment and the Hofstadter reference.
      *   If she says **No**: She admits that her conservation work is ultimately about preserving *humanity*, not typography. The "gesture" requires a ghost in the machine.
  3.  **Conflict with the Valley Verdict:** If she said "Yes" to the Valley (because of Descent + System), Candidate 2 removes Descent. It leaves only System + Perfect Form. Does System + Form equal Identity without History? This is the hardest philosophical question in the book.

  **How to stage it:**
  Place the Program glyph next to the Valley glyph.
  *   The Valley *a* has History + System + Mutated Form. (Verdict: Yes)
  *   The Program *a* has No History + System + Perfect Form. (Verdict: ?)

  If she rejects the Program glyph, she confirms that she is a conservator of *craft*, not just *letters*. If she accepts it, she confirms she is a conservator of *communication*. Given her profession, the tension lies in whether she can admit that the "gesture" she loves so much can exist without a hand to guide it.

  **Recommendation:** Use Candidate 2. It turns the novel from a story about the history of letters into a story about the future of meaning. It forces Ottoline to look at her own shelf-note and decide if Hofstadter was right.
