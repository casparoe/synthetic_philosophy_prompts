answer: |-
  **Final Examination: Contemporary Moral Philosophy**

  **Question 1**

  Twelve towns share a regional power grid. For twelve weeks of summer, the operator must shed load. Two standing policies are available. Under the **Rota**, one town is disconnected for a full week at a time; towns take turns, so each town has exactly one turn over the summer. Because the week is announced in advance, each town can plan around it (hiring generators, moving stock). The cost to a town of its single turn is 5 units of burden. Under **Dimming**, every town loses one randomly timed hour of power every day. This cannot be planned around; the eighty-four interruptions over the summer carry restart and spoilage costs totaling 12 units per town.

  At the grain of a single week, Rota imposes 5 units on one town and 0 on the others, while Dimming imposes 1 unit on each of the twelve. At the grain of the whole summer, Rota imposes 5 units on each town, while Dimming imposes 12 on each. The policy that looks worse for whoever is singled out at any given moment is better for every single town across the period the policy governs.

  **(a)** Does contractualism require us to assess these policies at the weekly grain or the summer grain? Consider whether a fine-grained principle of the form *'at each occasion of choice, spare the many by minimising the largest individual complaint'* is a genuine candidate principle. What would accepting this principle rule out regarding burden-sharing institutions? Alternatively, is the coarse-grained comparison (total burden per town across the summer) available without violating the individualist restriction against summing across persons? Explain.

  **(b)** Now consider a one-off version of the case: a single week, no future turns, no possibility of equalising burdens over time. The choice is between 5 units for one town and 1 unit each for twelve. Suppose further that the towns are closely linked: each town incurs a genuine burden of 0.5 units of distress at the thought of a sister town suffering the full 5-unit shutdown, a distress that grows with the number of towns affected. May the contractualist count such other-regarding components? Does doing so allow numbers to matter without summing anybody's complaints together, or is this aggregation smuggled in by another route? Where the framework leaves a choice open, state which way you would go and defend it by appeal to the point of the individualist restriction rather than by stipulation.

  *(Answer both parts. Do not restate the framework; assume knowledge of the formula of reasonable rejectability. No citations required.)*

  ***

  **Model Answer**

  The aggregation problem shifts shape rather than vanishes when we fix the individuation of principles and the content of complaints. In part (a), the verdict depends entirely on the temporal grain. At the weekly grain, Dimming wins: the maximum individual burden is 1 unit, compared to 5 units under Rota. At the summer grain, Rota wins: every town bears 5 units total, compared to 12 under Dimming. If we insist on the fine-grained principle—minimising the largest complaint at each occasion—we forbid ordinary turn-taking arrangements. This is implausible; it prevents parties from cooperating over time to reduce everyone's lifetime burden. However, adopting the coarse-grained summer comparison does not violate the individualist restriction. The restriction forbids summing complaints *across persons*, not summing burdens across time *within a person's life*. Comparing total summer burdens is an intra-personal calculation available to each town individually. Thus, contractualism can endorse Rotas, provided principles are individuated at the level of standing schemes rather than isolated moments.

  In part (b), the temporal escape route is removed. We face a strict choice: 5 units for one versus 1 unit for twelve. Introducing other-regarding interests changes the landscape. If each of the eleven unaffected towns suffers 0.5 units of distress at the single town's loss, they each possess a distinct complaint. This allows numbers to matter without inter-personal summation. The single victim does not gain weight; rather, the policy faces eleven additional vetoes based on the sympathisers' own interests. The burden of the victim does argumentative work once for every person who cares about them.

  Is this aggregation smuggled in? The strongest objection is double-counting: the victim's loss is being used to generate complaints from others, effectively weighting the victim's status by the popularity of their cause. If a thousand people sympathise with one victim, does that victim's claim outweigh a minor inconvenience to another? This risks collapsing into utilitarianism via the backdoor of sympathy.

  However, we should permit other-regarding complaints. The point of the individualist restriction is to protect individuals from being sacrificed for the greater good, not to blind us to the actual content of their interests. People genuinely care about others; ignoring this misdescribes their standpoint. To exclude other-regarding interests is to impose an artificial isolation on agents. The restriction protects status by requiring justification to each person, not by stripping them of their social nature. Therefore, numbers matter indirectly: a policy harming one person may be rejected by many others who care about them, but each rejection remains grounded in a distinct individual complaint. The framework holds, but it requires us to accept that our complaints are socially embedded.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Mapping Verdicts at Different Grains (5 marks)**
  *   **Must Hit:** Candidate identifies that Weekly grain favors Dimming (max burden 1 < 5) while Summer grain favors Rota (total burden 5 < 12).
  *   **Typical Error:** Confusing the total summer burden with inter-personal summation, or failing to see the verdict flips based on grain.

  **2. Evaluating the Fine-Grained Principle (5 marks)**
  *   **Must Hit:** Candidate explains that accepting the weekly principle rules out beneficial burden-sharing institutions (rotas/turn-taking) and treats this as a reductio or significant cost.
  *   **Typical Error:** Asserting the fine-grained principle is obviously correct without considering the institutional implication.

  **3. Defending Coarse-Grained Comparison (5 marks)**
  *   **Must Hit:** Candidate argues that summing burdens across time for one person is intra-personal and therefore permissible under the individualist restriction (which bans inter-personal sums).
  *   **Typical Error:** Claiming coarse-grained comparison violates the restriction because it involves "adding up" numbers anywhere.

  **4. Other-Regarding Complaints Mechanism (5 marks)**
  *   **Must Hit:** Candidate explains that numbers enter via the *content* of distinct individual complaints (sympathisers have their own veto), not by summing the victim's burden across people.
  *   **Typical Error:** Suggesting that sympathy allows us to sum the victim's pain across the sympathisers (direct aggregation).

  **5. Objection and Defense on Status (5 marks)**
  *   **Must Hit:** Candidate raises the double-counting objection and defends the inclusion of sympathy by appealing to the *point* of the restriction (protecting status/interests vs. enforcing isolation).
  *   **Typical Error:** Dismissing sympathy simply because it "looks like aggregation" without engaging with the justification for the restriction.

  **A/B Boundary Note**
  A **B-grade** answer correctly maps the mechanics: it distinguishes intra- from inter-personal summation and identifies that sympathy creates distinct vetoes. An **A-grade** answer goes further by connecting these mechanics to the *justification* of the framework. Specifically, the A answer defends the inclusion of other-regarding interests not just as logically permissible, but as *required* by the aim of protecting actual individual status rather than artificial isolation, showing why the restriction exists (to prevent sacrifice) and why sympathy doesn't violate that aim. The A answer takes a defended position on the "double-counting" worry rather than hedging.
