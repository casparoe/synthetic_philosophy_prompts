answer: |-
  Subject: Re: Thinking through psychiatric categories

  It is completely understandable that this course is weighing on you, especially given what you are seeing with your roommate. When a diagnosis feels like a label for being different rather than a description of something broken, it strikes at the core of what we mean by illness versus identity. You have laid out a very strong set of intuitions here, and you are right to look for a principle that separates internal dysfunction from conflicts with social norms. You asked for a definite position, so I am going to give you one directly rather than listing options for you to weigh. The principle you proposed, which focuses on suffering combined with a failure of theoretical rationality, is elegant but ultimately too narrow to hold up against the full range of cases you described. If we stick strictly to theoretical rationality, meaning false beliefs about the world or perceptual errors, we miss some of the clearest examples of mental illness where the beliefs are accurate but the capacity to act or feel is broken.

  A more coherent principle that captures most of your cases is that mental illness requires an involuntary breakdown in internal psychological mechanisms that leads to harm or suffering. This shifts the focus from just what a person believes to how their mind is functioning at a mechanistic level. Under this view, the high-powered lawyer is not mentally ill because her drive to win is a value choice, even if it is destructive. Her mechanisms for reasoning and working are functioning exactly as she intends them to, so labeling her condition a disorder pathologizes her values rather than her mind. Similarly, the person in the religious community is not ill because their refusal to eat is consistent with the shared reality of their group. Their theoretical rationality is intact within their context, and there is no internal mechanistic failure, just a difference in cultural inputs. You were right to feel that calling these cases illness was wrong, and this principle supports keeping those verdicts.

  However, adopting this principle means you will have to drop or revise a couple of your other intuitions. Specifically, you need to let go of the Szaszian suspicion regarding the child with ADHD. If we define illness as a breakdown in internal mechanisms, then ADHD often qualifies as a real dysfunction of attention regulation and executive control, regardless of the classroom environment. The child physically cannot sit still not because the classroom is boring, but because the internal brake system for impulse control is malfunctioning. Calling this a myth of medicalization ignores the involuntary nature of the constraint on their agency. You also need to resolve your flip-flopping about your uncle. Under this principle, if his inability to get out of bed is caused by a breakdown in mood regulation or motivational mechanisms that persists far beyond the expected duration of grief, then it is mental illness. The key distinction is whether he cannot get up because he sees no point due to a broken affective system, versus choosing not to get up because he is processing a loss. Given that it has been four months and he describes a lack of possibility rather than just sadness, you should classify this as illness because the mechanism for generating hope and action is dysfunctional.

  This leaves the cases of the voices, the anorexic teenager, and the Capgras delusion. You were right to classify these as real mental illness, and this principle explains why. In each case, there is a specific failure of theoretical rationality or perceptual processing that resists correction. The teenager believes she is overweight despite evidence to the contrary because her body image processing is broken. The person with Capgras delusion has a disconnect between facial recognition and emotional response. These are not value conflicts like the lawyer, and they are not cultural differences like the religious case. They are hardware failures. So, if you accept this principle of involuntary internal mechanistic failure, you keep your verdicts on the lawyer, the religious person, the psychosis cases, and the anorexia case. But you must drop the idea that ADHD is merely a mismatch with the environment, and you must stop wavering on your uncle by recognizing that prolonged, involuntary paralysis of agency is a dysfunction even if it stems from grief.

  I know this feels heavy because it implies that your uncle is sick rather than just sad, and that the ADHD kid has a defect rather than just a bad fit with school. But distinguishing these things is actually more humane than the alternative. If we call the lawyer ill, we undermine her autonomy. If we call the ADHD kid merely mismatched, we deny them the support they need for a real struggle. And if we call your uncle merely grieving, we might wait for him to snap out of something his brain currently cannot fix on its own. The line you are drawing is important, and while it requires you to be stricter about what counts as illness in some cases like ADHD and depression, it protects people from being labeled ill simply for living differently. I hope this helps clarify the pattern you were looking for.
