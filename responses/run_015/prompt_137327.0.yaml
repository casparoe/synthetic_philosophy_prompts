      *   *Wait, keep it simple:* The standard "This statement is unprovable" translated to code: `func G() { while(!prove("G does not return")) {}; return; }`.
      *   *Constraint Check:* User wants to avoid "just a paradox." Need to emphasize that `G` *does* return (it's true), but the system can't prove it.

