      *   **Requirements:** Defend an ordering, explain upstream/downstream relationships, assess tractability for a philosopher (vs. sociologist), specify evidence that would revise the ranking, and evaluate the "residual-enclave" framing itself.

  2.  **Evaluate the Four Lines of Inquiry:**

      *   *(1) Causal-priority:* This is a classic chicken-and-egg problem. For a *philosopher*, this is tricky because it leans heavily into empirical sociology/history. Determining *actual* causation requires data. However, determining *conceptual* dependency (does honor *need* law to shift?) is philosophical.
      *   *(2) Dissolution:* This asks about the lifecycle of the enclave. It's normative and structural. How does a normative system lose its grip? This feels very Appiah/Williams. It's about the conditions of intelligibility of a practice.
      *   *(3) Argument-efficacy:* This is core normative ethics/meta-ethics. Can reason move the will (or the social sentiment) directly? This connects to Hume, Kant, and contemporary internalism/externalism. It's highly tractable for a philosopher.
      *   *(4) Comparative-structure:* This asks why *this* norm vs. *that* norm. This requires comparative history. It's less conceptual and more typological.

  3.  **Determine the Ordering (The "Defended Agenda"):**

      *   *Criterion:* Upstream/Downstream, Tractability for Philosopher, Normative Payoff.
      *   *Hypothesis:* The "Residual Enclave" framing is productive *if* it focuses on the normative experience of the agent within the misalignment.
