      *   **Justification for each:**
          *   *Why 1 is first:* It determines the role of philosophy. If reason can't move honor, the project is purely descriptive sociology. It's tractable conceptually (internalism/externalism).
          *   *Why 2 is second:* Once we know reason's role, we ask how the normative system loses authority. This is about "intelligibility" (Appiah's wheelhouse).
