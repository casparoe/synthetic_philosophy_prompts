      *Alternative View:* Is the "Residual Enclave" framing productive? Yes, it operationalizes Appiah's "honor worlds" into a specific problem of *misalignment*. It moves from "how change happens" to "what happens in the gap." This is rich for normative theory (dilemmas, integrity, complicity).

