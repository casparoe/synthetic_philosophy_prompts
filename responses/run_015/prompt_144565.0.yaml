      *   **Core Concept:** "Residual honor enclaves" (groups where abolished/stigmatized practices retain honor value) and "Interstitial moral risk" (misalignment between law/public norm and local honor, creating a dilemma for individuals).
      *   **Task:** Prioritize four specific lines of inquiry:
          1.  Causal-priority problem (Honor $\to$ Law vs. Law $\to$ Honor).
