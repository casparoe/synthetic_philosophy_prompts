answer: |-
  **Exam Paper: PPE 202 — Collective Decision Making**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Instructions:** Read the case study below. Answer both parts (a) and (b) in a continuous essay. You do not need external readings; rely on the logic provided in the text.

  **Case Study: The Clarion Editorial Board**
  The *Clarion* newspaper uses a three-person editorial board (Editors Alpha, Beta, Gamma) to decide whether to publish sensitive exposés. To protect against libel, the board follows a strict logical rule: They must publish (**P**) if and only if the source is **Credible (C)** AND the documents are **Authentic (A)**. Logically: $P \leftrightarrow (C \land A)$.

  The editors vote by simple majority on each proposition. Their private judgments are:
  *   **Editor Alpha:** Yes on C, Yes on A $\rightarrow$ Yes on P.
  *   **Editor Beta:** Yes on C, No on A $\rightarrow$ No on P.
  *   **Editor Gamma:** No on C, Yes on A $\rightarrow$ No on P.

  **The Aggregate Vote:**
  *   **Credible (C):** Yes (2–1)
  *   **Authentic (A):** Yes (2–1)
  *   **Publish (P):** No (1–2)

  **Questions:**
  **(a)** Diagnose the specific rationality failure occurring in this outcome. Why does standard majority voting produce a contradiction here? (8 marks)
  **(b)** Propose one procedural rule to resolve this dilemma (e.g., voting only on premises or only on conclusions). Critically evaluate this solution: what normative value does it protect, and what democratic cost does it incur? (12 marks)

  ***

  ### Model Answer

  The *Clarion* case illustrates the Discursive Dilemma, where collective rationality collapses under simple majority rule. The diagnosis lies in the disconnect between individual consistency and collective consistency. Each editor is individually rational: Alpha accepts the premises and the conclusion; Beta and Gamma reject at least one premise and consequently reject the conclusion. However, the group aggregate is irrational. The majority accepts both premises ($C$ and $A$), which logically necessitates accepting the conclusion ($P$). Yet, the majority explicitly rejects $P$. The group simultaneously holds that the conditions for publishing are met and that publishing should not occur. This breaks the principle of collective integrity: the group's judgments violate the logical constraints they imposed on themselves.

  This failure occurs because majority rule is applied independently to interconnected propositions. When the coalition supporting $C$ (Alpha and Beta) differs from the coalition supporting $A$ (Alpha and Gamma), the intersection (Alpha) is too small to determine the conclusion $P$, even though the union of premises logically dictates it. Standard aggregation preserves responsiveness to each individual proposition but sacrifices logical coherence across the set of judgments.

  To resolve this, the board should adopt a **Premise-Based Procedure (PBP)**. Under PBP, the board votes only on the factual premises ($C$ and $A$). The conclusion ($P$) is not voted on directly but is derived mechanically from the premise outcomes. If the majority accepts both $C$ and $A$, the board *must* publish, regardless of how they would have voted on $P$ directly.

  The primary normative value protected by PBP is **collective rationality**. It ensures the group acts as a unified agent whose decisions follow from its stated reasons. This is crucial for institutions like newsrooms or courts, where legitimacy depends on reason-giving rather than mere outcome aggregation. It prevents the embarrassment and instability of a group asserting $X$ and $Y$ are true but refusing to accept the consequence of $X$ and $Y$.

  However, this solution incurs a significant democratic cost: **responsiveness to the collective will on the final outcome**. In the *Clarion* case, two editors (Beta and Gamma) voted against publishing. Under PBP, they are overruled on the final action despite forming a majority on the verdict itself. The procedure privileges the logic of the reasons over the direct preference of the members regarding the action. This creates a "tyranny of consistency," where the group's commitment to logical coherence overrides the majority's immediate judgment on the matter at hand. While PBP solves the rationality failure, it transforms the group from a democracy of outcomes into a technocracy of reasons, potentially alienating members whose holistic judgment is disregarded.

  ***

  ### Marking Scheme (Total 20 Marks)

  **Part (a): Diagnosis (0–8 Marks)**
  *   **7–8 (A):** Clearly identifies the inconsistency between accepted premises and rejected conclusion. Explains *why* (different majority coalitions on premises). Uses terms like "collective rationality" or "logical coherence."
  *   **5–6 (B):** Identifies the contradiction (Yes/Yes but No) but treats it as a mere counting error or fails to explain the coalition mismatch.
  *   **0–4 (C/F):** Describes the votes without identifying the logical paradox. Confuses this with a Condorcet cycle (voting loops) or claims editors are lying.

  **Part (b): Solution & Evaluation (0–12 Marks)**
  *   **10–12 (A):** Proposes a specific procedure (e.g., Premise-Based). Evaluates it dialectically: identifies the gain (consistency/integrity) AND the loss (responsiveness/democratic control on the verdict). Discusses the normative trade-off.
  *   **7–9 (B):** Proposes a procedure and explains how it fixes the math. Evaluation is one-sided (only praises the solution or only critiques it) or focuses on efficiency rather than normative values.
  *   **0–6 (C/F):** Suggests "discuss more" without a procedural rule. Fails to identify a cost. Claims one method is simply "correct."

  **Clarity & Structure (0–4 Marks)**
  *   **4:** Fluent, precise philosophical terminology, logical flow.
  *   **2–3:** Understandable but vague.
  *   **0–1:** Disorganized or hard to follow.

  **Classic Mix-Ups (Deduct 2 marks each if present)**
  *   Confusing the Discursive Dilemma with Condorcet's Paradox (cyclic preferences).
  *   Assuming the editors are acting strategically rather than expressing genuine judgment.
  *   Suggesting the solution is simply "unanimity" (which avoids the paradox but creates paralysis, not resolving the aggregation issue).

  Summary: The discursive dilemma reveals that majority rule cannot simultaneously guarantee logical consistency and responsiveness to every proposition.
