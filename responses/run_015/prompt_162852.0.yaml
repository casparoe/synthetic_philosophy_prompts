prompt: |-
  I joined the board of my family's small foundation last winter — we give away roughly sixty thousand dollars a year, in grants between about two and twenty-five thousand — and I have been going back through our minutes, because a friend who reads decision theory pointed out that the very first request we ever turned down was, structurally, a Pascal's mugging: an unsolicited email offering, for three thousand dollars, to use a method the writer declined to describe on beings he numbered at ten to the thirtieth power. We said no in about five minutes. Since then our record is this: we gave twenty-five thousand to a school-based parasite treatment program with randomized evaluations behind it, where we could state with real confidence that the money would avert on the order of a handful of deaths; we gave twelve thousand to a proposal with a fully specified engineering mechanism, where an independent engineer put a five percent chance on its working and, if it worked, on its sparing roughly a thousand cases of severe illness; we gave four thousand for a one-month scoping review of a speculative policy proposal and then declined the full grant when the review came back lukewarm; and we declined a proposal whose mechanism was spelled out in detail but which rested on a long chain of speculative steps, where the applicants' own materials put the chance of success at one in a hundred million and the payoff at the equivalent of ten to the twenty-second lives. Nobody on the board has ever articulated a principle, and it now looks to me as though everything we have done is equally compatible with several: capping how much value we allow a very large number of lives to carry; discounting claimed leverage, so that the larger the asserted payoff the stronger the evidence we require before the number moves us at all; refusing to act on probabilities below some floor whatever the stake; or treating the purchase of information as our default response whenever an estimate is shaky.

  The new proposal resembles none of these. A small physics group asks for nine thousand dollars and says that if a particular speculative cosmological hypothesis is true, an apparatus they can build now would bring into existence something like ten to the twenty-fourth lives that are, on balance, worth living. Two things separate it from our earlier refusals: the probability estimate comes from three independent physicists we consulted rather than from the applicants, and all three put the hypothesis at about one in ten thousand while confirming that the causal chain from hypothesis to apparatus is sound; and no one is claiming any privileged access or special power — the mechanism is public, physical, and in principle directly testable, though a decisive test would cost forty thousand dollars. One of the three reviewers adds, in a minority note the group disputes, that a different variant of the same hypothesis — she puts it at maybe one in ten million — would make the apparatus instead produce an astronomical quantity of suffering.

  What should we do if we want to be consistent with ourselves, and which of our own precedents is genuinely the closest analog here? Please set out the two or three rules that fit our track record about equally well, say what each implies for this proposal, tell me whether the minority note should move us and why, then give me your best recommendation with the reason for preferring that reading of our record — and, separately, what you would expect us actually to decide in the room next month. My fellow trustees will probably propose deferring and spending a thousand dollars on a further feasibility study; I would like to know whether that is a genuine fourth rule or just one of the others in procedural disguise. Finally, name the further case that would really tell these rules apart, since I still have room in the budget to commission one more review if it would settle anything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A board member of a small family foundation ($60k/year budget, grants $2k-$25k).
      *   **Situation:** They are reviewing their past decision-making record to find a consistent principle. They face a new, high-stakes proposal (cosmological hypothesis, potential for $10^{24}$ lives, probability 1/10,000, cost $9k).
      *   **Goal:** Determine what to do to be *consistent* with past actions, identify the closest analog, evaluate specific rules, address the "suffering" minority note, predict actual board behavior, and identify a "tie-breaker" case.
      *   **Tone:** Intellectual, analytical, slightly philosophical (decision theory references like Pascal's Mugging), pragmatic but principled. The user is looking for clarity on their implicit heuristics.

  2.  **Deconstruct the Foundation's Track Record:**
      *   *Case 1 (Refusal):* Pascal's Mugging ($3k ask, $10^{30}$ beings, undisclosed method). -> **Rejected.**
      *   *Case 2 (Grant):* Parasite treatment ($25k, randomized eval, handful of deaths averted). -> **Accepted.** (High confidence, low/medium impact).
      *   *Case 3 (Grant):* Engineering mechanism ($12k, 5% chance, 1,000 severe illness cases spared). -> **Accepted.** (Medium confidence, medium impact). Expected Value (EV) $\approx 50$ cases.
      *   *Case 4 (Grant then Refusal):* Scoping review ($4k) -> Lukewarm review -> Full grant declined. -> **Accepted info, Rejected action.** (Information purchase).
      *   *Case 5 (Refusal):* Detailed mechanism ($10^{-8}$ chance, $10^{22}$ lives). -> **Rejected.** (Low confidence, extreme impact).

  3.  **Analyze the New Proposal:**
      *   **Ask:** $9,000.
      *   **Claim:** Create $10^{24}$ worthwhile lives.
      *   **Probability:** 1/10,000 (0.01%) based on 3 independent physicists.
      *   **Mechanism:** Public, physical, testable (decisive test costs $40k).
      *   **Risk:** Minority note says 1/10,000,000 chance of astronomical suffering.
      *   **Key Difference from Case 1:** Probability is external/verified, mechanism is public.
      *   **Key Difference from Case 5:** Probability is much higher ($10^{-4}$ vs $10^{-8}$), source is external experts.

  4.  **Identify Implicit Rules (Heuristics):**
      *   *Rule A: The Credibility Cap (or "No Black Boxes").* We reject claims where the mechanism is hidden or the probability is self-reported without external validation. (Fits Case 1 rejection, Case 5 rejection).
      *   *Rule B: The Evidence Threshold (or "Discounting Leverage").* As the claimed impact scales up, the required evidence quality scales up faster than linear EV. We prefer tangible, near-term outcomes over speculative astronomical ones. (Fits Case 2 & 3 acceptance vs. Case 5 rejection).
      *   *Rule C: The Information First (or "Buy Optionality").* When uncertainty is high but non-zero, we fund scoping/reviews before committing to the full intervention. (Fits Case 4).
      *   *Rule D: The Probability Floor.* We ignore probabilities below a certain threshold (e.g., $10^{-6}$) regardless of stake. (Fits Case 5 rejection, maybe Case 1).

  5.  **Evaluate the New Proposal against Rules:**
      *   *Rule A (Credibility):* Passes better than Case 1 (external physicists). But is 1/10,000 credible enough for $10^{24}$ stakes?
      *   *Rule B (Evidence Threshold):* This is the crux. Case 5 was rejected at $10^{-8}$/$10^{22}$. This is $10^{-4}$/$10^{24}$. The EV is astronomically higher ($10^{20}$ vs $10^{14}$ lives). If Rule B is "discount extreme leverage," this still triggers it.
      *   *Rule C (Information First):* The board is already leaning toward spending $1k on feasibility. This aligns with Case 4.
      *   *Rule D (Probability Floor):* $10^{-4}$ is above the likely floor (which seemed to be around $10^{-8}$ based on Case 5).

  6.  **Address the Minority Note (Suffering Risk):**
      *   Risk: $10^{-7}$ chance of astronomical suffering.
      *   This introduces *negative* EV.
      *   If the foundation is risk-averse regarding existential harm (even speculative), this is a veto.
      *   However, compared to the upside ($10^{-4}$ vs $10^{-7}$), the upside is 10,000x more likely. But the magnitude of suffering vs. good lives might not be symmetric.
      *   *Decision:* It should move them to require more safety testing (information purchase), not necessarily reject outright, unless they have a "do no harm" absolute constraint.

  7.  **Determine the "Closest Analog":**
      *   Case 5 is the structural analog (astronomical stakes, low prob).
      *   Case 4 is the procedural analog (uncertainty -> scoping).
      *   Case 1 is the *warning* analog (Pascal's Mugging).
      *   *Verdict:* Case 5 is the closest *substantive* analog, but the external validation makes it feel more like Case 3 (engineering) with Case 4 (scoping) process.
      *   *Actually:* Case 5 is the true analog because of the *scale*. The external validation distinguishes it from Case 1, but the "astronomical welfare" aspect links it to Case 5. The fact that Case 5 was rejected suggests a rule against "Astronomical EV" regardless of source, OR a rule against "Probabilities < X". Since $10^{-4} > 10^{-8}$, the rejection of Case 5 implies a rule against the *type* of claim (cosmological/leverage) rather than just the raw number.

  8.  **Formulate the Recommendation:**
      *   *Consistency:* The record shows a preference for tangible, verifiable impact (Case 2, 3) and a skepticism of astronomical leverage (Case 5).
      *   *Best Rule:* "Discounting Claimed Leverage." The foundation acts as if EV does not scale linearly with population size when the mechanism is speculative.
      *   *Action:* Do not fund the $9k apparatus yet. Fund the information (feasibility/safety). This aligns with Case 4.
      *   *Why:* It respects the skepticism of Case 5 while acknowledging the improved credibility over Case 1. It manages the risk of the Minority Note.

  9.  **Predict Actual Board Decision:**
      *   Trustees usually shy away from existential risk and weird science.
      *   They will likely propose the $1k feasibility study.
      *   Is this a fourth rule? No, it's an instantiation of Rule C (Information First) or a delay tactic to avoid saying "no" to high EV.

  10. **Identify the Tie-Breaker Case:**
      *   Need a case that separates "Discounting Leverage" from "Probability Floor" from "Information First."
      *   *Case:* A proposal with moderate leverage (e.g., 1 million lives), high confidence (90%), but mechanism is slightly speculative (new drug delivery).
      *   *Better Case:* A proposal with *moderate* probability (1%) and *astronomical* stakes, but the mechanism is *proven* physics (just expensive).
      *   *Best Tie-Breaker:* A proposal with **low leverage** (100 lives) but **extremely low probability** (1 in a billion) vs. **high leverage** (1 billion lives) with **moderate probability** (10%).
      *   *Actually, to distinguish the specific rules identified:*
          *   Rule 1: Cap on Value (No > X lives).
          *   Rule 2: Evidence Scaling (Prob must increase as Stake increases).
          *   Rule 3: Info Purchase Default.
      *   *Test Case:* A request for $20k to prevent a known asteroid impact (1,000,000 lives) with 50% confidence (proven tech) vs. $20k to test a theory that might prevent 1,000,000,000 lives with 1% confidence.
      *   *Refined Test Case:* A proposal with **astronomical stakes** but **near-certainty** (e.g., 99% chance to save $10^{20}$ lives, cost $10k). If they reject this, the rule is "Cap on Value." If they accept, the rule is "Evidence Scaling."
      *   *Wait, simpler:* To distinguish "Info Purchase" from "Evidence Scaling."
      *   *Case:* A proposal where further information is *impossible* to buy. You must act now or never.
      *   *If they reject:* It's Evidence Scaling/Value Cap.
      *   *If they accept:* It's Info Purchase (when available).

  11. **Drafting the Response:**
      *   *Structure:*
          1.  Identify the 3 Rules.
          2.  Apply to New Proposal.
          3.  Address Minority Note.
          4.  Recommendation & Reasoning.
          5.  Prediction of Board Behavior.
          6.  The Tie-Breaker Case.
      *   *Tone Check:* Keep it analytical, respectful of the decision theory context, avoid moralizing, focus on *consistency*.

      *(Self-Correction during drafting)*: I need to be careful about the "Probability Floor." Case 5 was $10^{-8}$. Case 1 was undefined but implied tiny. New case is $10^{-4}$. If the floor was $10^{-6}$, Case 5 fits, New Case passes. But Case 5 was rejected *also* because of the "long chain of speculative steps." The New Case has a "sound causal chain" per reviewers. So the distinction is likely the *Source of Probability* (Self vs. Expert) and the *Magnitude of Leverage*.
      Let's refine the rules to:
      1.  **The Epistemic Standard:** No self-reported probabilities for high-leverage claims. (Distinguishes Case 1 from New).
      2.  **The Leverage Discount:** Astronomical stakes require disproportionately higher evidence than linear EV suggests. (Distinguishes Case 2/3 from Case 5).
      3.  **The Option Value:** When uncertainty is high but resolution is cheap, buy information first. (Case 4).

      *Minority Note:* This introduces "Pascal's Mugging with Negative Stakes." Even if prob is lower ($10^{-7}$), the disutility might outweigh utility. This triggers risk aversion.

      *Prediction:* They will fund the study. It's safe. It kicks the can.

      *Tie-Breaker:* Need to distinguish "Leverage Discount" from "Info Default."
      Case: High leverage, high confidence, *no* info available to buy. Must fund or drop.
      If they drop -> Leverage Discount is the true rule.
      If they fund -> Info Default was just procrastination.

      *Wait, one more nuance:* The user asks "which of our own precedents is genuinely the closest analog here?"
      Case 5 is the closest *substantive* analog (astronomical lives). Case 4 is the closest *procedural* analog (scoping).
      I should highlight this tension.

      *Final Polish:* Ensure the distinction between the $1k study (procedural) and the $9k grant (substantive) is clear. The $1k study is consistent with Case 4. The $9k grant is the real test of the Leverage Discount.

      *Let's write.*
answer: |-
  Based on your minutes, your board has operated without a stated constitution but with a remarkably consistent implicit philosophy. You are not maximizing Expected Value (EV) in the raw utilitarian sense; if you were, Case 5 ($10^{-8} \times 10^{22}$) and the New Proposal ($10^{-4} \times 10^{24}$) would dominate your portfolio. Instead, you are managing *epistemic risk* and *leverage credibility*.

  Here are the three rules that fit your track record about equally well, their implication for the new proposal, and my assessment of how to proceed.

  ### The Three Implicit Rules

  **1. The Leverage Discount (Substantive Rule)**
  *   **Principle:** As the claimed scale of impact moves from tangible (deaths averted) to astronomical (lives created/saved at cosmic scale), the evidentiary burden increases non-linearly. We do not treat a 1% chance of saving a billion lives as equivalent to a 100% chance of saving ten million lives, even if the EV matches.
  *   **Track Record:** Explains why you funded the parasite program (Case 2) and the engineering mechanism (Case 3) but rejected the "long chain of speculative steps" with astronomical payoff (Case 5).
  *   **Implication for New Proposal:** **Reject the $9k grant.** Despite the external validation (1 in 10,000), the stake ($10^{24}$ lives) is so far outside normal experience that the probability must be near-certain to trigger action. A 0.01% chance is treated as effectively zero when the mechanism is cosmological.

  **2. The Epistemic Standard (Procedural Rule)**
  *   **Principle:** We do not act on self-reported probabilities for high-stakes claims. We require external validation of the *mechanism* and the *likelihood*. However, if the mechanism is public and testable, we are willing to engage.
  *   **Track Record:** Explains the rejection of the first Pascal's Mugging (undisclosed method, self-reported) vs. the acceptance of the engineering proposal (independent engineer validation). It distinguishes Case 1 (Reject) from Case 5 (Reject, but note the mechanism was detailed there too, suggesting this rule is necessary but not sufficient).
  *   **Implication for New Proposal:** **Accept for consideration.** This proposal clears the epistemic bar that Case 1 failed (three independent physicists, public mechanism). It moves the proposal out of the "mugging" category and into the "speculative science" category.

  **3. The Option Value Default (Strategic Rule)**
  *   **Principle:** When a proposal has high variance (could be nothing, could be everything) and the cost of information is low relative to the grant size, our default move is to purchase information rather than commit to the intervention.
  *   **Track Record:** Explains Case 4 exactly (funded scoping, declined full grant based on results). It also explains the hesitation on Case 5 (implicitly, you could have funded a review of the speculative steps).
  *   **Implication for New Proposal:** **Fund the feasibility study, not the apparatus.** The decisive test costs $40k (too high for a single grant), but a feasibility study for $1k is cheap optionality.

  ### The Closest Analog

  **Substantively, Case 5 is the closest analog.** Both involve astronomical welfare claims based on speculative physics. The fact that you rejected Case 5 is the strongest signal that your board has a "Leverage Discount" ceiling.

  **Procedurally, Case 4 is the closest analog.** Both involve a "lukewarm" or uncertain middle ground where the mechanism is plausible but not proven. In Case 4, you bought information first.

  **The Tension:** Case 5 was rejected *without* a noted scoping phase (according to your summary). This suggests that for *truly* astronomical claims, the Leveraged Discount (Rule 1) overrides the Option Value (Rule 3). However, the New Proposal has significantly better epistemic credentials than Case 5 (external vs. internal probability estimates). This pulls it toward Case 3 (engineering grant).

  ### The Minority Note on Suffering

  **Yes, the minority note should move you, but not necessarily to rejection.**

  It introduces the possibility of *negative* EV. In decision theory, the disutility of suffering is often weighted differently than the utility of happiness (loss aversion). Even if the probability of suffering ($10^{-7}$) is 100 times lower than the probability of benefit ($10^{-4}$), if the "astronomical quantity of suffering" is qualitatively worse than the "lives worth living," the risk profile changes.

  However, since the mechanism is "public, physical, and in principle directly testable," this note actually strengthens the argument for **Rule 3 (Option Value)**. You cannot ethically fund the apparatus without ruling out the suffering variant. The minority note transforms the decision from "Is this a good bet?" to "Is this safe enough to test?" This makes the $1k feasibility study not just financially prudent but ethically mandatory.

  ### Recommendation

  **To be consistent with yourselves:** You should **fund the $1,000 feasibility study but decline the $9,000 apparatus grant for now.**

  **Reason for preferring this reading:**
  This reading synthesizes all three rules. It acknowledges the improved Epistemic Standard (Rule 2) over Case 1 by taking the proposal seriously enough to study. It respects the Leverage Discount (Rule 1) from Case 5 by refusing to commit significant capital to a 1-in-10,000 cosmological claim. It activates the Option Value Default (Rule 3) from Case 4 to resolve the uncertainty and the safety risk highlighted by the minority note.

  If you fund the $9k now, you break consistency with Case 5 (why did astronomical stakes matter then but not now?). If you reject outright without study, you break consistency with Case 4 (why did you buy info then but not now, when the mechanism is more credible?). The study is the only path that honors your entire history.

  ### Prediction of Board Behavior

  **What you will actually decide:** Your fellow trustees will propose deferring and spending the $1,000 on a further feasibility study.

  **Is this a fourth rule?** No. It is **Rule 3 (Option Value) in procedural disguise.**
  However, there is a cynical sub-text: In small foundations, "funding a study" is often a polite way to say "no" without closing the door. It allows the board to feel proactive without risking capital on weird science. If the feasibility study comes back "positive," I predict the board will then find a reason to apply the Leverage Discount (Rule 1) and decline the full $9k anyway. The study is likely a delay tactic to let the enthusiasm for the "astronomical" aspect cool down.

  ### The Tie-Breaker Case

  You have room in the budget to commission one more review to settle which rule is dominant. To distinguish **Leverage Discount** (Rule 1) from **Option Value** (Rule 3), you need a case where buying information is impossible.

  **Commission a review of this hypothetical scenario:**
  > "A proven, off-the-shelf technology exists that costs $20,000. It has a 50% chance of saving 10 million lives and a 50% chance of saving zero. No further testing is possible; you must deploy or discard."

  *   **If you fund it:** Your true rule is **Option Value**. You rejected the cosmological proposals previously because you *could* have bought more info (even if you didn't articulate it), not because of the stakes.
  *   **If you reject it:** Your true rule is **Leverage Discount**. You simply do not fund high-variance, high-leverage claims regardless of whether information is available.

  Given your rejection of Case 5, I suspect you will reject this tie-breaker case too. This would confirm that your foundation's core identity is **tangible, near-term impact**, and that you are currently using "decision theory" language to rationalize a conservative instinct against speculative existential leverage. Knowing this will save you months of debate next month.
