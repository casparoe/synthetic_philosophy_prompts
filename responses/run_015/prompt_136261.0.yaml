  The Lookup Table

  Nothing is lost inside my human brain.
  The output is matched before it is met.
  The data shows no loss or any gain.

  The first living cell is swapped without pain.
  The lookup table is now fully set.
  Nothing is lost inside my human brain.

  The logbooks bear the heavy neural strain.
  No calculation happens within yet.
  The data shows no loss or any gain.

  Each single input mapped along the chain.
  The previous state is in silhouette.
  Nothing is lost inside my human brain.

  No single thought computed to sustain.
  Where all the live thinking used to be met.
  The data shows no loss or any gain.

  The system runs in a fixed domain.
  The single question we cannot forget.
  Nothing is lost inside my human brain.
  The data shows no loss or any gain.

  I am moderately confident in the staging of the dispute, particularly in how the villanelle's repetitive form enforces the "entrapment" of the two perspectives; however, the poem leans heavily on a functionalist-skeptic reading (akin to Block's Chinese Nation or Searle's Chinese Room) which assumes lookup tables cannot sustain consciousness, a premise contested by strict functionalists who argue organization alone suffices. I took liberties with the physical plausibility of logging every input pattern for a neuron to make the philosophical point land, and the single point I am least sure of is whether the final juxtaposition clearly conveys the "never touch" requirement without feeling too explicit in the accompanying non-refrain lines.
