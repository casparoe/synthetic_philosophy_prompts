      *   **4.0 Data Analysis & Results:**
          *   Incompatible predictions (Cosmic Constant).
          *   Unfalsifiability (Observer inside sample).
          *   Conclusion: Lack of error bars.

  4.  **Drafting - Content & Tone Check:**
      *   *Word Count:* Aim for ~600.
      *   *Voice:* Dry, bureaucratic, slightly weary. "Disappointed senior researcher."
      *   *Technical Accuracy:* Ensure SSA/SIA distinction is clear but framed as instrumentation.
      *   *Satire:* The humor comes from treating metaphysical assumptions like voltmeters.

  5.  **Writing - First Pass (Mental or Scratchpad):**
