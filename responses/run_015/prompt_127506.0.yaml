prompt: |-
  As a retired experimental physicist who has only recently begun reading philosophy of science, I am struck by how little anthropic reasoning resembles calibrated measurement. Please write a deadpan, satirical "Standard Operating Procedure" document—approximately 600 words, divided into numbered sections 1.0 through 4.0 with subsections—issued by a fictional Institute for Anthropic Calibration. The protocol should describe the laboratory execution of the presumptuous-philosopher argument, treating the Self-Sampling Assumption and the Self-Indication Assumption not as abstract principles but as two competing instruments, each with its own systematic-error profile: SSA calibrated for uniform sampling over a precisely defined reference class, SIA calibrated to weight outcomes by total observer count. The humor must arise from genuine technical understanding—include subsections on blinding protocols, reference-class specification errors, replication crises, and instrument calibration logs—so that a specialist recognizes the logic being satirized rather than misrepresented. Add a "Safety Warning" about running the experiment without fixing the reference class in advance, and a "Results" subsection noting that both instruments yield incompatible predictions for the cosmic constant yet remain unfalsifiable because every experimenter is necessarily inside the sample. Maintain the voice of a senior researcher disappointed that philosophy lacks error bars; paraphrase the presumptuous-philosopher reasoning in your own technical language without attributing specific page citations or bibliographic references. Do not ask for further reading lists or author biographies.
