          *   Constraint: No reading lists or author bios. Paraphrase reasoning in technical language.

  2.  **Deconstruct the Science/Philosophy:**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the set of all observers in your reference class. Tends to favor smaller universes (fewer observers) if you find yourself in a specific situation (Doomsday Argument style).
      *   **SIA (Self-Indication Assumption):** Reason as if you are more likely to exist in worlds with more observers. Tends to favor larger universes (Presumptuous Philosopher style).
      *   **Presumptuous Philosopher Argument:** SIA leads to the conclusion that we can rule out theories predicting fewer observers almost certainly, even without empirical data, which seems arrogant ("presumptuous").
      *   **The Satire:** Treating these epistemic principles as lab equipment that needs calibration, blinding, and error analysis, highlighting the absurdity of applying experimental rigor to metaphysical selection effects.

  3.  **Drafting - Section by Section:**

      *   **Header:** Institute for Anthropic Calibration. SOP Number. Title.
