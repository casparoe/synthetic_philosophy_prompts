answer: |-
  ### Brainstorming Candidate Concepts

  Before settling on a diagnosis, I need to test your observation against the three dominant frameworks in the metaphysics of laws. Your description suggests a fluidity that some frameworks handle better than others.

  **1. The Best System Analysis (Humeanism)**
  *   **The Concept:** Laws are not "rulers" over nature but the axioms and theorems of the best deductive system that summarizes the universe's history. "Best" means the optimal balance of simplicity (few axioms) and strength (predictive power).
  *   **What it captures:** This fits your observation of "movement" perfectly. When Newton arrives, the "Best System" changes. Kepler's equations move from being axioms (laws) to theorems (consequences). The status changes because the system changed, not because the planets changed. It explains why scientists demote regularities when a deeper theory arrives: the deeper theory offers a better simplicity/strength trade-off.
  *   **Where it strains:** It struggles with your genetic code example. If the genetic code is universal on Earth and supports prediction, a Humean might argue it *is* part of the best system for biology. Yet scientists insist it's a "frozen accident." Humeanism has a hard time distinguishing between a "law" and a "very stable accident" if both are equally useful for summarizing the mosaic of facts. It risks making lawhood too dependent on human bookkeeping rather than the "real" constraint you sense scientists are tracking.

  **2. Necessitarianism (Anti-Humeanism)**
  *   **The Concept:** Laws reflect metaphysical necessities, often grounded in the essential powers or dispositions of objects (e.g., mass *must* gravitate). Laws "make" things happen.
  *   **What it captures:** This explains the "frozen accident" intuition. The genetic code *could* have been otherwise; it lacks metaphysical necessity. Therefore, it is not a law, regardless of how universal it is. It also explains the demotion of Kepler's laws: they describe *what* happens, but not the *power* that necessitates it (Gravity).
  *   **Where it strains:** It makes the "movement" you describe merely epistemic, not ontological. On this view, Kepler's laws were *never* laws; scientists were just ignorant. But you describe a practice where the *same sentence* functions as a law in one context and a consequence in another. Necessitarianism tends to be rigid: a relation is either necessary or it isn't. It doesn't easily account for the pragmatic fluidity where a regularity is treated as a law for engineering purposes but not for fundamental physics.

  **3. Pragmatic Functionalism**
  *   **The Concept:** Lawhood is defined by the role a statement plays in scientific inference. A "law" is a generalization we are willing to use to support counterfactuals (e.g., "If this were a planet, it *would* orbit in an ellipse") and explain other phenomena.
  *   **What it captures:** This aligns closely with your "derivational vantage point." If I use Kepler to derive a trajectory, it's functioning as a law. If I use Gravity to derive Kepler, it's functioning as data. It captures the "betting" behavior you noticed: scientists treat laws as things that hold in other galaxies (modal robustness).
  *   **Where it strains:** It risks making lawhood too subjective. If lawhood depends on how scientists *use* a sentence, does the law disappear when no one is around to use it? You mentioned this "tracks something real about scientific practice," but you also asked if it tracks something real about *nature*. Functionalism sidesteps the metaphysical reality question, which might leave you unsatisfied if you want to know if the laws themselves are moving or just our labels.

  ***

  ### The Verdict: Explanatory Primacy vs. Modal Robustness

  I am confident that you have identified a genuine phenomenon, but I believe you are running together two distinct criteria that scientists often conflate. The "movement" you see is the decoupling of **Explanatory Primacy** from **Empirical Stability**.

  Here is the feature doing the work: **Axiomatic Independence within a Causal Model.**

  When scientists call something a "law," they are rarely just saying "this always happens." They are saying, "This is a terminal stop in our chain of *why*."
  *   **In the Kepler case:** In 1600, the elliptical orbit was a terminal stop. You couldn't ask "why?" any further. It had Explanatory Primacy. In 1700, Gravity became the terminal stop. Kepler's law became a dependent variable. It lost its status not because it became less true, but because it lost its **Axiomatic Independence**.
  *   **In the Genetic Code case:** The mapping is empirically stable (high Empirical Stability), but it lacks Explanatory Primacy. It is not a terminal stop; it is a historical outcome. Scientists know they *could* ask "why?" and get an evolutionary answer, not a physical necessity. Therefore, it is denied law status despite its universality.

  **What this feature is NOT:**
  It is **not** Universality. (The genetic code is universal on Earth but not a law).
  It is **not** Mathematical Necessity. (Kepler's laws are mathematical but contingent).
  It is **not** Exceptionlessness. (Many laws have *ceteris paribus* clauses but retain law status).

  **The Metaphysical Split:**
  You asked if this is a problem for Humeans or Anti-Humeans. It affects them differently.
  *   **For the Humean (Best System):** This is not a problem; it is the expected result. Laws are indexical to the theory. If the theory changes, the law status changes. The "movement" is real because lawhood is a property of the *description*, not the *world*.
  *   **For the Anti-Humean (Necessitarian):** This is a significant tension. If laws are mind-independent relations of necessity, they shouldn't fluctuate with human theory. The Anti-Humean must argue that the "movement" is purely in our *heads* (epistemic), not in the *laws* (ontic). They would say you are witnessing the gradual correction of human error, not a shift in the status of the regularity itself.

  **Coining a Term:**
  To help you write about this, I am going to coin a term to label the specific instability you are tracking. I call it **"Derivational Volatility."**
  *   **Assumption:** This term assumes that "lawhood" in practice is a functional role assigned to statements that sit at the top of a derivational hierarchy.
  *   **Usage:** A regularity exhibits *Derivational Volatility* when its status as a "law" fluctuates based on whether it is currently being used as a premise (law) or a conclusion (theorem) in the dominant theoretical framework.

  ***

  ### Boundary Cases: Real vs. Apparent Instances

  To ensure you don't overextend this concept in your piece, here is how to distinguish *Derivational Volatility* from other shifts in scientific language.

  **1. A Real Instance (Derivational Volatility)**
  *   **Case:** The Ideal Gas Law ($PV=nRT$).
  *   **Why:** In thermodynamics, it is often treated as a fundamental law governing pressure and volume. In statistical mechanics, it is demoted to a statistical average of particle collisions.
  *   **Test:** Does the scientific community explicitly discuss whether it "holds" in contexts where the deeper theory suggests it shouldn't (e.g., high pressure)? Yes. The status shifts depending on whether the speaker is a chemist (law) or a physicist (approximation). This is your phenomenon.

  **2. A Hedged Generalization (Not Derivational Volatility)**
  *   **Case:** "All swans are white."
  *   **Why:** This is an empirical generalization that was falsified.
  *   **Distinction:** This isn't a shift in *status* due to theory; it's a shift in *truth value* due to evidence. Your phenomenon concerns regularities that remain *true* (or approximately true) but change their *rank*. If the sentence stops being true, it's not a law anymore, full stop. That's just error correction.

  **3. A Mathematical Identity (Not Derivational Volatility)**
  *   **Case:** "Force equals mass times acceleration" ($F=ma$) in Newtonian mechanics.
  *   **Why:** Some philosophers argue this is a definition of force, not an empirical law.
  *   **Distinction:** If a statement is true by definition, it cannot be demoted by a deeper theory; it can only be replaced by a new definition. If you find a case where a statement flips between "empirical discovery" and "definition," that is close to your phenomenon, but be careful: definitions don't support counterfactuals in the same way. Your phenomenon requires the statement to remain an empirical claim about the world, just a less fundamental one.

  **4. A Pattern Due to Lack of Intervention (Not Derivational Volatility)**
  *   **Case:** "No human has ever run a 2-minute mile."
  *   **Why:** This is a regularity based on current physiological limits, not a law.
  *   **Distinction:** Scientists do not treat this as a law *now*, nor will they if someone finally does it. It lacks the "modal robustness" you noted. Your phenomenon requires that scientists *temporarily* treat the regularity as a constraint on possibility (a law), and then later relax that constraint when a deeper theory shows it's breakable.

  ***

  ### Direct Challenge: Are You Confused?

  I need to be direct on your final point: *Is there no single phenomenon here?*

  There is a risk you are conflating **Theory Change** with **Lawhood**.
  When Kepler's laws were demoted, Newtonian physics replaced Aristotelian/Scholastic physics. That is ordinary theory change. Every time a theory changes, the vocabulary shifts.

  **However,** I do not think you are confused. Here is why: You noted that the *same sentence* flips status. In standard theory change, old sentences are usually discarded (e.g., "Phlogiston escapes"). In your cases, the sentences are *retained* but *reclassified*. "Planets move in ellipses" is still in the textbook, but moved from Chapter 1 (Laws) to Chapter 5 (Applications).

  This suggests the phenomenon is not just theory change, but a specific feature of how science organizes **knowledge hierarchy**. You are tracking the **stratification of scientific truth**.

  **The Trap to Avoid:**
  Do not imply that the *world* changes. The planets didn't change their orbits when Newton published. The *constraint* didn't change. What changed was the **locus of necessity**.
  *   **Phase 1:** The necessity is located in the Orbit (it *must* be an ellipse).
  *   **Phase 2:** The necessity is located in the Force (it *must* obey gravity), and the ellipse is just a result.

  Your article should focus on this migration of necessity. Scientists are not being sloppy; they are marking where they believe the "brakes" of the universe are located. When they find a deeper brake, they move the sign.

  **Summary for your piece:**
  The feature doing the work is **Explanatory Primacy** (is this the stopper or the stopped?).
  The phenomenon is **Derivational Volatility** (the shifting of that primacy as theory deepens).
  It is **not** a change in empirical truth.
  It creates tension for Anti-Humeans (who want laws to be fixed) but fits Humeans (who see laws as tools).
  Your boundary is where a statement stops being a *constraint on possibility* and starts being a *description of outcome*.
