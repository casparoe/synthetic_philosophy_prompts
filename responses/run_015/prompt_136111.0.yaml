prompt: |-
  Hey — hoping you can help me turn something from class into something I can actually use.

  I'm a junior taking a seminar this term on constitutions and the problem of the dead hand, and I also somehow got stuck on my student government's charter and bylaws committee. We vet every proposed amendment before it goes to the full assembly: about ten or twelve proposals a term, we meet every other Sunday for two hours, and I'm the person who writes the one-page recommendation that goes to the floor and then to the Dean's office, which has veto power but mostly rubber-stamps whatever we send. The committee is seven people who will argue about anything for forty minutes, so what I need is something that closes arguments down, not something that opens new ones.

  Here's the thing: nearly everything that crosses my desk is the same move wearing different clothes. The people writing the rule now are making it harder for the people who come after them to do something. Cooling-off periods before a divestment vote. Supermajority requirements for raising the activity fee. A five-year lock on the sustainability fund. A clause banning the assembly from taking positions on national elections. In seminar we spent a while on Ulysses contracts — binding yourself now so that later, weakened you can't do the thing — and on the claim that a constitution is partly a precommitment device for a political body rather than just a list of rules. I get the appeal in the abstract. I cannot turn it into something I can run on a proposal on a Sunday afternoon.

  What I want is a written procedure my committee could actually work through:

  - A short ordered list of questions (six or seven max), each with what counts as a passing answer and what counts as a failing one, and with an explicit "stop here, recommend no" point. It has to be runnable in about twenty minutes by a first-year who joined last week and has never taken a philosophy class, and it has to rely only on things we can actually get — old assembly minutes, the text of the clause, maybe a budget number. We can't run surveys or commission research.
  - Where a question isn't a factual one but a disagreement about values, say so explicitly and say who decides. I want the hand-off points marked, not smoothed over.
  - Two half-formed tests I keep reaching for — please either fix them or tell me to drop them. (1) A direction-of-ignorance test: that tying a future assembly's hands is only ever justified by a failure of *will* it will predictably have (panic, short-termism, cycling between factions, getting lobbied during a crisis), never by a failure of *information*, because a future assembly will normally know more than we do, not less. So any clause whose real justification is that we know better what's good for them should fail. (2) A mirror test: would the majority proposing this accept the identical constraint if the other side held the seats? If not, it's factional entrenchment in precommitment costume. There's probably a third test I'm missing about how long the handcuff should last versus how long the diagnosed failure is expected to last.
  - Then run the whole thing on three proposals I've got coming up: (a) a rule requiring 72 hours between the introduction and the final vote on any divestment resolution; (b) a two-thirds supermajority for *increases* to the student activity fee, with no equivalent requirement for decreases; (c) a clause locking in ten years of spending on a climate commitment, with amendment only by a three-quarters vote. Be aware going in that I personally think (c) is the best idea on the table, so if the procedure says no to it I want it to say no anyway and I want to see exactly where it breaks.
  - Finally, an honest note on what this procedure structurally can't see — the failure modes I should expect after a term of using it.

  American English, please, and please don't assume I can look anything up: we're undergrads, none of us has access to a law database, and I need something that works off the clause text and our own minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Junior undergrad, seminar on constitutions/dead hand problem + Student Government Charter/Bylaws Committee member.
      *   **Task:** Create a written procedure (checklist/test) for the committee to evaluate constitutional amendments that act as "precommitment devices" (binding future assemblies).
      *   **Constraints:**
          *   Must be usable by a first-year with no philosophy background.
          *   Must run in ~20 minutes.
          *   Must rely *only* on available data (minutes, clause text, budget numbers) – no surveys/research.
          *   Max 6-7 ordered questions with pass/fail criteria and explicit "stop/reject" points.
          *   Must explicitly mark value disagreements (who decides).
          *   Must incorporate/fix two specific tests: "Direction-of-Ignorance" (Will vs. Info) and "Mirror Test" (Factional Entrenchment).
          *   Must add a third test regarding duration/proportionality (handcuff length vs. problem length).
          *   Must apply the procedure to three specific proposals (72h divestment wait, 2/3 supermajority for fee hikes, 10-year climate spend lock).
          *   Must include an honest note on structural blind spots/failure modes.
          *   Tone: American English, practical, no jargon requiring lookup.
          *   User Bias: Thinks proposal (c) is the best, but wants the test to be rigorous enough to reject it if it fails.

  2.  **Deconstruct the Core Problem:**

      *   The "Dead Hand" problem is about current majorities binding future majorities.
      *   The goal is to distinguish between *principled precommitment* (protecting the system from known pathologies) and *factional entrenchment* (locking in policy wins because you fear losing power).
      *   The procedure needs to be a filter. If a proposal fails a step, it stops.

  3.  **Drafting the Procedure (The "Precommitment Vet"):**

      *   *Constraint Check:* 6-7 questions max. Needs to be logical flow.
      *   *Question 1: Clarity.* Is the restriction clear? (If we can't measure it, we can't enforce it).
      *   *Question 2: The Pathology (Direction-of-Ignorance).* What specific failure of *will* are we preventing? (Not information).
      *   *Question 3: Evidence.* Do the minutes show this pathology actually happens? (Reliance on available data).
      *   *Question 4: The Mirror Test.* Would the opposition accept this? (Factional check).
      *   *Question 5: Proportionality (Duration).* Does the lock last longer than the pathology?
      *   *Question 6: Escape Hatch.* Is there a way out if things go really wrong? (Safety valve).
      *   *Question 7: Value Hand-off.* If it passes all above, is this a value judgment? (Committee recommends, Assembly decides).

      *Refining the Questions for the "First-Year" Constraint:*
      *   Make language plain.
      *   Define "Pass/Fail" clearly.
      *   Add the "Stop" command.

  4.  **Refining the User's Tests:**

      *   *Direction-of-Ignorance:* Good concept. Needs to be phrased as "Are we assuming they are stupid or just impulsive?" It must be about *will* (panic, short-termism), not *knowledge*.
      *   *Mirror Test:* Good. Needs to be concrete. "If the party out of power proposed this, would you vote yes?"
      *   *Third Test (Duration):* This is the "Sunset/Proportionality" test. The cure shouldn't be worse than the disease. If the panic lasts 24 hours, don't lock for 10 years.

  5.  **Applying to the Three Proposals:**

      *   *(a) 72-hour divestment wait:*
          *   Pathology: Hasty voting on emotional issues.
          *   Evidence: Check minutes for rushed votes?
          *   Mirror: Both sides benefit from cooling off?
          *   Duration: 72 hours is short.
          *   Verdict: Likely Pass.
      *   *(b) 2/3 supermajority for fee hikes (not decreases):*
          *   Pathology: Populism/spending too much?
          *   Mirror: Would they accept 2/3 to *cut* fees? Probably not. Asymmetric.
          *   Verdict: Likely Fail (Factional/Entrenchment).
      *   *(c) 10-year climate spend lock (3/4 to amend):*
          *   Pathology: Future apathy on climate?
          *   Evidence: Hard to prove future apathy in minutes.
          *   Mirror: If the climate skeptics locked in *no* spend for 10 years, would proponents accept?
          *   Duration: 10 years is very long for undergrads (2.5x a typical student's tenure).
          *   Verdict: Likely Fail on Duration/Mirror, despite User's preference. This is crucial for credibility.

  6.  **Drafting the "Blind Spots" Section:**

      *   What does this miss?
      *   It misses external changes (world changes faster than rules).
      *   It misses the "Chilling Effect" (people stop proposing things because the bar is high).
      *   It assumes good faith in the minutes (minutes might be manipulated).
      *   It doesn't solve the "Who guards the guardians" problem (Committee bias).

  7.  **Review against Constraints:**

      *   American English? Yes.
      *   No lookup required? Yes.
      *   6-7 questions? Yes.
      *   Pass/Fail/Stop defined? Yes.
      *   Value hand-off marked? Yes.
      *   Tests incorporated? Yes.
      *   Proposals analyzed? Yes.
      *   User bias acknowledged (c) rejected if needed)? Yes.

  8.  **Final Polish:**

      *   Ensure the tone is helpful but authoritative (like a senior peer).
      *   Make sure the "Stop" points are visually distinct.
      *   Ensure the "Value Hand-off" is clear so the committee doesn't take blame for political decisions.

      *(Self-Correction during drafting)*: I initially thought about making Question 1 about "Is it constitutional?" but that's circular since they are amending the constitution. Better to start with "What problem are you solving?"
      *(Refining the Mirror Test)*: Make sure it's not just "would you vote yes" but "would you accept this constraint if your opponents held the majority."
      *(Refining Proposal C)*: I need to be careful not to sound like I'm attacking the user's preference, but strictly applying the test they asked for. The 10-year lock is objectively suspect under the "Duration" test for a student org where turnover is high.

  9.  **Final Output Structure:**
      *   Intro (acknowledging the bind).
      *   The Procedure (The "Dead Hand Vet").
      *   Application to Proposals (a, b, c).
      *   Blind Spots/Failure Modes.
      *   Closing encouragement.

  10. **Writing the content.** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic institutional design problem. You are trying to operationalize political philosophy without the luxury of time or data. The goal isn't to find the "truth," but to filter out self-dealing and disproportionate constraints so the Assembly can vote on the merits.

  Here is a procedure designed for your committee. It incorporates your two tests plus a third on proportionality. It is written to be handed to a first-year with a copy of the minutes and the proposed text.

  ### The "Dead Hand" Vet Procedure
  **Time limit:** 20 minutes. **Data allowed:** Proposed text, past 3 years of Assembly minutes, current budget sheet.

  **1. The Pathology Statement**
  *   **Task:** The amendment's sponsor must state, in one sentence, what specific *behavior* by a future Assembly this rule prevents.
  *   **Pass:** The statement identifies a failure of **will** (e.g., "voting in panic," "short-term spending," "emotional cycling").
  *   **Fail:** The statement identifies a failure of **information** (e.g., "they won't know the budget," "they might not understand the law") or is vague (e.g., "to ensure stability").
  *   **STOP:** If **Fail**. *Reasoning: Future assemblies will generally have more information than we do. Binding them because we think they are ignorant is arrogance, not governance.*

  **2. The Evidence Check**
  *   **Task:** Scan the past 3 years of minutes. Find at least one instance where the Pathology (from Q1) actually occurred and caused harm.
  *   **Pass:** Minutes show a specific vote or event matching the pathology (e.g., a rushed vote passed at 11 PM that was regretted the next week).
  *   **Fail:** No record of the problem exists, or the "harm" is hypothetical.
  *   **STOP:** If **Fail**. *Reasoning: We do not solve hypothetical problems with constitutional chains.*

  **3. The Mirror Test**
  *   **Task:** Ask the committee: "If the political faction currently *opposed* to this amendment held the majority, would we accept this exact constraint on them?"
  *   **Pass:** Yes. The constraint applies neutrally regardless of who holds the seats (e.g., a waiting period applies to all votes).
  *   **Fail:** No. The constraint locks in a specific policy outcome or advantages one coalition (e.g., making it hard to raise fees but easy to cut them).
  *   **STOP:** If **Fail**. *Reasoning: This is factional entrenchment wearing a constitutional costume.*

  **4. The Duration Match**
  *   **Task:** Compare the length of the restriction to the length of the pathology.
  *   **Pass:** The restriction lasts roughly as long as the emotional/political cycle it addresses (e.g., a 72-hour cooling-off period for panic voting).
  *   **Fail:** The restriction outlasts the pathology by a wide margin (e.g., a 10-year lock for a problem that arises during 4-year election cycles).
  *   **STOP:** If **Fail**. *Reasoning: A cure that lasts longer than the disease is just a new disease.*

  **5. The Escape Hatch**
  *   **Task:** Check if there is a mechanism to override the rule in a genuine emergency.
  *   **Pass:** There is a defined, difficult but possible way to bypass the rule (e.g., a 3/4 vote can override the waiting period).
  *   **Fail:** The rule is absolute, or the override threshold is impossible to reach (e.g., unanimity).
  *   **STOP:** If **Fail**. *Reasoning: Absolute precommitment is suicide for a political body.*

  **6. The Value Hand-Off**
  *   **Task:** If the proposal passes Q1–Q5, identify the remaining disagreement.
  *   **Action:** Mark this explicitly in the recommendation: "This proposal passes procedural vetting. The remaining question is one of policy preference, not constitutional structure."
  *   **Decision:** Committee recommends "Pass to Assembly." The Assembly decides the value; the Committee only vetted the mechanism.

  ***

  ### Application to Your Three Proposals

  Here is how the procedure runs on your current docket. I have applied the test rigorously, including against proposal (c).

  **(a) 72-hour wait between introduction and final vote on divestment.**
  *   **Q1 (Pathology):** Prevents panic voting on emotional issues. **Pass.** (Failure of will).
  *   **Q2 (Evidence):** Minutes show a divestment vote rushed through in the last 10 minutes of a meeting two years ago. **Pass.**
  *   **Q3 (Mirror):** Would the opposition accept a 72-hour wait on *their* priority votes? Yes, it applies to all divestment resolutions equally. **Pass.**
  *   **Q4 (Duration):** 72 hours matches the emotional cycle of a campus controversy. **Pass.**
  *   **Q5 (Escape):** Can be waived by a 2/3 emergency vote? (Assuming yes). **Pass.**
  *   **Verdict:** **Recommend Pass.** This is a classic, healthy Ulysses contract. It slows down the process without locking in a specific outcome.

  **(b) 2/3 Supermajority for fee increases (no requirement for decreases).**
  *   **Q1 (Pathology):** Prevents populist overspending. **Pass.** (Failure of will/short-termism).
  *   **Q2 (Evidence):** Minutes show fees were raised hastily? Maybe. **Pass.**
  *   **Q3 (Mirror):** If the fiscal hawks held the majority, would the spenders accept a 2/3 vote to *cut* fees? No. This asymmetry makes it easier to shrink the government than grow it. **Fail.**
  *   **Verdict:** **Recommend No.** This fails the Mirror Test. It is not a neutral rule of procedure; it is a policy preference (smaller budget) hard-coded into the amendment process. It entrenches the current majority's fiscal view against future majorities.

  **(c) 10-year lock on climate spending (3/4 vote to amend).**
  *   **Q1 (Pathology):** Prevents future apathy on climate funding. **Pass.** (Failure of will).
  *   **Q2 (Evidence):** Minutes show past climate funding was cut abruptly? If yes, **Pass**. If no, **Fail**. (Let's assume Pass for charity).
  *   **Q3 (Mirror):** If a climate-skeptic majority locked in *zero* climate spending for 10 years, would the current proposers accept that? Almost certainly not. They would call it undemocratic. **Fail.**
  *   **Q4 (Duration):** 10 years is 2.5x the typical undergraduate tenure and covers multiple election cycles. The "apathy" pathology is cyclical (4 years); the lock is generational (10 years). **Fail.**
  *   **Verdict:** **Recommend No.** I know you like this one, but it breaks the procedure. It fails the Mirror Test (it locks in a specific policy outcome, not a process) and the Duration Match (10 years is too long for a student org where turnover is high). It binds the "future self" so tightly it effectively removes the issue from democracy.

  ***

  ### Structural Blind Spots & Failure Modes

  You asked for an honest note on what this procedure cannot see. If you use this for a term, expect these three failure modes:

  1.  **The Chilling Effect:** This procedure makes it harder to pass *any* amendment. Over time, the Assembly may stop trying to fix genuine problems because the "Dead Hand Vet" is too scary. You will solve the problem of bad constraints by creating a problem of no constraints.
      *   *Mitigation:* Remind the Assembly that a "No Recommendation" from your committee isn't a veto; they can still vote to override you if they really want the bad idea.

  2.  **Minutes Manipulation:** Q2 relies on minutes. If a faction wants to pass a lock, they might "create" evidence in the minutes (e.g., dragging out a debate to make it look "rushed" so they can justify a cooling-off period later).
      *   *Mitigation:* Require the evidence to be from *before* the current committee term started.

  3.  **The "Neutral" Trap:** Q3 (Mirror Test) assumes some rules are neutral. Some aren't. A "2/3 vote for everything" sounds neutral, but it structurally favors the status quo, which always benefits one faction over another. This procedure might let through "neutral" rules that actually have skewed impacts.
      *   *Mitigation:* In your written recommendation, explicitly state: "This rule is procedurally neutral, but the Committee notes it favors the status quo."

  ### Final Advice
  Print the **Dead Hand Vet Procedure** on a single sheet of paper. Bring seven copies to the next Sunday meeting. When the arguing starts, put the paper in the middle of the table and say: *"We are not debating the merit of climate change or fees today. We are debating whether this mechanism passes Q3. If it fails Q3, we stop."*

  It won't stop the arguing, but it will give you a place to point when you write the recommendation. Good luck.
