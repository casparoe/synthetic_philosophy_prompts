answer: |-
  The backward induction paradox in the centipede game arises from a specific modeling assumption about the nature of agency over time. Standard game-theoretic analysis treats an agent's future decision nodes as if they were independent strategic actors, each requiring a fresh optimization calculation based on local incentives. This "temporal atomism" forces the agent at the initial node to anticipate that her future self will defect at the first opportunity to maximize local utility, thereby triggering a chain of reasoning that mandates immediate defection. This result is paradoxical because it yields a suboptimal payoff for the agent, contradicting the intuition that a rational agent should be able to secure higher rewards by sustaining play.

  The paradox is dissolved not by denying common knowledge of rationality, but by rejecting the fragmentation of the agent. A single rational agent should be modeled as a temporally extended entity capable of adopting a globally coherent intertemporal policy. Under this view, the unit of choice is not the isolated move at a specific node, but the entire path through the game tree selected at the outset. The agent does not ask, "What is optimal for me at this node given what I will do later?" but rather, "Which complete trajectory through the tree maximizes my total utility?" When the game tree is treated as an object of unified choice, the agent selects the path that leads to the highest terminal payoff. Since the centipede game is structured such that payoffs escalate with the duration of play, the utility-maximizing path involves continuing play for many rounds. Future nodes are not sites of re-negotiation or independent optimization; they are merely execution points for the plan chosen at the start. Consequently, continuing play is not a violation of rationality, but a requirement of it, as deviating from the optimal path to take a smaller, earlier payoff constitutes a failure of global maximization.

  A critical objection to this global-policy view is that it appears to license irrational cooperation in other contexts, specifically the finitely repeated prisoner's dilemma. If a unified agent can commit to a path of "cooperation" (passing) in the centipede game to access higher payoffs, why can she not commit to a path of "cooperation" (not defecting) in every round of a finitely repeated prisoner's dilemma? The distinction lies in the structural features of the payoff matrices and how they interact with the concept of a global policy.

  In the centipede game, the payoff structure is one of escalating mutual benefit contingent on *continuation*. The "defection" option (taking the pot) is a termination option; it ends the game and precludes access to all future, larger payoffs. The value of the game is path-dependent: the high payoff at the end exists *only* if the agent (and the opponent) traverses the preceding nodes. Therefore, a global policy of "continue until near the end" is an investment strategy where early restraint is the necessary condition for later gain. The local incentive to take the pot at an intermediate node is an illusion created by ignoring the fact that exercising that option destroys the very path that leads to the global maximum.

  In contrast, the finitely repeated prisoner's dilemma features a competitive payoff structure where defection is a dominant strategy at every individual stage, independent of the path history. In the prisoner's dilemma, the payoff for defecting is higher than cooperating *given the opponent's move*, regardless of whether it is the first round or the last. Crucially, defecting does not terminate the opportunity for future interaction in the same way taking the pot does in the centipede game; rather, it secures a local advantage within the ongoing structure. Even under a global-policy view, a rational agent must recognize that at the final node of a finitely repeated prisoner's dilemma, the local incentive to defect remains structurally robust. Because the opponent is also rational, they will anticipate defection at the final node, rendering cooperation at the penultimate node irrational, and so on. The global policy "always cooperate" is not admissible in the prisoner's dilemma because it is not *dynamically consistent* with the payoff structure: at the final node, the agent has a strict incentive to deviate from the plan that cannot be neutralized merely by viewing the agent as unified. In the centipede game, the "deviation" at the final node is simply the culmination of the optimal plan (taking the accumulated pot), whereas in the prisoner's dilemma, the deviation (defecting) undermines the cooperative surplus the plan sought to create. Thus, the global-policy view licenses cooperation in the centipede game because the game rewards the *duration* of restraint, whereas it does not license indefinite cooperation in the prisoner's dilemma because the game rewards the *act* of defection at the margin.

  Finally, one might object that if an agent can commit to a global policy, she should be able to commit to stopping at an arbitrary node—for instance, committing at the start to take the pot at node three rather than node nine. If commitment is possible, why is the specific policy of "maximizing total payoff" required? This objection conflates the *capacity* to form a plan with the *rationality* of the plan's content. Decision-theoretic rationality is not satisfied merely by having a coherent plan; the plan itself must be utility-maximizing. An agent may have the psychological or mechanical capacity to bind herself to a suboptimal path, but doing so would be irrational. The global-policy view does not claim that any commitment is rational; it claims that rationality requires the selection of the *optimal* commitment. A policy to stop at node three is a valid global policy in terms of coherence, but it is inadmissible in terms of rationality because it is dominated by the policy to stop at node nine. The agent's rationality obligates her to choose the policy that yields the highest expected payoff across the entire tree. Therefore, the ability to commit does not validate arbitrary stopping points; it merely enables the agent to execute the single, payoff-maximizing trajectory that backward induction erroneously fragments. By treating the agent as a unified chooser over the whole tree, we see that the rational requirement is to select the path of greatest total value, which in the centipede game necessitates continuing play well beyond the first node.
