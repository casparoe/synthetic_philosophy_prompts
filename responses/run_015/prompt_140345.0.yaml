answer: |-
  Dear colleagues, to help us navigate the literature for our upcoming sessions I have drafted a decision tree that sorts a reader into a named position on the basis of what she says about cases rather than on which label she finds attractive, and I invite you to trace your own path through it starting from the single commitment that ordinary waking adult humans have conscious experiences. The first fork asks whether a lone particle in an otherwise empty universe has any experience at all, and if you say no then you must decide whether that particle possesses properties that are not themselves experiential but could constitute experience in combination, for if you say yes to proto-properties you land on panprotopsychism with its most awkward commitment being the inexplicable leap from non-experience to experience, whereas if you say no to proto-properties you arrive at strong emergence with its most awkward commitment being the violation of causal closure or the acceptance of brute nomological connections. If you say yes to the lone particle having experience then you are on the micropsychist path and must next consider whether the smallest experiences are drawn from the same palette as ours, the familiar colours and pains, or are of a kind we could neither recognise nor describe, and if you claim they are unrecognizable you are routed back toward panprotopsychism despite your initial yes, marking a cell that is often empty because it is unattractive to posit experience that is fundamentally unknowable, so assuming you claim they are familiar you must then ask whether the fundamental conscious thing might instead be the cosmos as a whole, with the small flickers derived downward from it and carrying a decomposition-side difficulty of their own, and if you say yes here you settle on cosmopsychism with its most awkward commitment being the inability to explain why our individual perspectives are fragmented rather than universal. If you say no to the cosmos being fundamental then you hold that micro-subjects are fundamental and you must consider whether a brick-sized lump of matter built out of such particles is itself a subject, and if you say yes you occupy a cell that is empty because it is unattractive given the lack of integration in a brick, so assuming you say no you must ask whether a macro-subject formed from many micro-subjects can have a phenomenal quality that none of its parts has, and if you say yes you are pushed back toward strong emergence which contradicts your micropsychist start, so assuming you say no you must determine whether the unity of such a macro-subject is something further over and above its parts or just the parts under a different description. If you say unity is a further fact then you are led to the phenomenal-bonding view, but you must then answer whether the relation doing the unifying is itself conscious, and if so whether that merely restarts the problem one level up, and if you accept the regress you land on the phenomenal-bonding view with its regress with its most awkward commitment being an infinite hierarchy of bonding subjects, whereas if you deny the relation is conscious you struggle to explain how it unifies experience. If you say unity is just the parts under a different description then you must decide between the fusion or identity version of combination and the option on which there is no deep unity of a subject to be explained in the first place, and to separate these you should consider whether a mind whose stream of consciousness is switched off and on again every second is one subject or many, and what that implies about combining subjects across time as opposed to at a time, for if you say it is one subject you lean toward fusion with its most awkward commitment being the loss of the distinct identity of the micro-subjects, whereas if you say it is many you lean toward no deep unity with its most awkward commitment being the elimination of the macro-subject we started with. To further test this distinction you should consider whether a brain whose hemispheres are disconnected fibre by fibre contains one subject, two, or a vague and indeterminate number, and if you say two you support fusion or constitutive micropsychism while if you say vague or indeterminate you support no deep unity, though I must flag that these questions cannot pry apart constitutive micropsychism and the fusion or identity version because both accept macro-subjects without further facts and differ only on metaphysical nuances regarding identity that these cases do not resolve. Finally note that the combination of denying experience to the lone particle while affirming familiar qualia for the macro-subject without emergence is an empty cell because it is incoherent to derive familiar experience from nothing, and I hope this prose map helps us locate our disagreements during the reading group.
