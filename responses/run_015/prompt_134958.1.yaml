answer: |-
  **MEMORANDUM**

  **TO:** Collections and Ethics Committee, Halward Institute for Testimony
  **FROM:** Committee Member
  **DATE:** June 1, 2024
  **SUBJECT:** Decision Recommendations for June Voting Matters

  **Introduction**

  We convene at a pivot point in the Institute's history. The cohort of Vardøyene survivors is passing, and the promises made to them are colliding with the mandates given to us. This memo offers a decisive path through the three matters before us. It seeks not to split the difference, but to resolve the tension between our legal deed and our moral contract. The recommendations below are binary. They are designed to be voted on individually, but they form a coherent ethical architecture.

  **Item 1: The Disputed Nine and the Erasure Clause**

  **Recommendation:** I recommend we reject the demand for physical erasure but adopt the Senior Archivist's proposal for intermediate disposition. The nine master recordings shall remain physically intact within the vault to satisfy the Founding Deed. However, they shall be immediately removed from the public catalogue and the research room. They will not be digitized or indexed. Retrieval shall require a recorded vote of this Committee, permissible only for verified legal subpoenas or essential historical verification where no other source exists.

  **Responsibility:** Senior Archivist.
  **Deadline:** Implementation by July 1, 2024; first review of retrieval requests December 2024.

  **Reasoning:** We must engage the distinction between erasing a record and ceasing to recall it. An institution is not a mind; we do not forget. We only destroy, hide, or decline to retrieve. Physical erasure is destruction. It annihilates the evidence of the crime and violates the Deed that secures our endowment. Sequestration, however, is a refusal to retrieve. It honors the family's desire for privacy without committing the violence of obliteration.

  This matters morally because destruction implies the event never happened or the testimony never mattered. Sequestration acknowledges the truth exists but places it behind a veil of grief. For the two testimonies used in prosecutions, the "Committee vote" mechanism ensures that justice is not blinded, while the general public respects the family's plea. We are not breaking the Deed, nor are we breaking the promise of privacy. We are choosing the lesser violence: silence over erasure.

  **Item 2: The Interactive Witness Pilot**

  **Recommendation:** I recommend we reject the proposal to train conversational models on the testimonies. The Education Department is directed to pursue static digital accessibility enhancements instead.

  **Responsibility:** Director of Education.
  **Deadline:** Decision communicated to funders by June 30, 2024.

  **Reasoning:** We must establish criteria for what counts as extending the life of a testimony versus fabricating a speaker. Extending life means making existing content more accessible or contextualized. Fabrication occurs when a system generates syntax, responses, or emotional inflections the narrator never uttered. A conversational model puts sentences into the mouths of the dead. It turns remembering into a service delivered on demand, suggesting the witness is present to answer us. They are not.

  To simulate agency is to distort the nature of testimony, which is a fixed record of a past act, not a living dialogue. If we allow the dead to speak to the living in real-time, we risk making them say what the living wish to hear. In an era of organized denial, authenticity is our only currency. We cannot spend it on synthesis.

  **General Rule: Narrator Instructions vs. Preservation Mandate**

  These requests will continue for another decade. We require a general rule. Henceforth, an instruction left by a dead narrator binds the Institute against its preservation mandate only if the instruction concerns *access*, not *existence*.

  For an instruction to bind us regarding existence (erasure), it would have to be proven that the testimony was obtained under duress or fraud. For an instruction to bind us regarding access (sequestration), it requires only that the restriction was a documented condition of donation. In the case of the 214 narrators who signed the 2003 clause, the condition of access was explicit. Therefore, we honor the restriction on access, but we maintain the existence of the record.

  **The Duty Owed**

  We must state plainly whom this duty is owed to. It is not owed primarily to the families, who seek relief from grief. It is not owed to the person who spoke, who is beyond harm. It is owed to a public that did not ask for the testimony and largely does not yet exist.

  Our founding language describes memory as a duty. One member argues this is a duty of care between persons that lapses when the persons die. I reject this. If memory were merely interpersonal, it would die with the witness. It is instead a duty to the future community. However, I must admit that our founding language is only sometimes true. The mandate to "preserve no item... destroyed" assumes the preservation itself serves the truth. If the manner of preservation violates the moral contract under which the truth was given, the mandate weakens. We hold the truth in trust, but we do not own it. We are custodians, not proprietors. A community which declines to let anything go eventually leaves its members nothing they are required to hold onto. Therefore, we hold the tapes, but we let them rest.

  **The Rejected Position**

  I must articulate the strongest version of the position I am rejecting, so the minority knows they are understood.

  Regarding erasure: The advocates argue that a promise made in blood is sacred. To tell a mother her words would vanish if she chose, and then to keep them anyway, is to lie to the dead. It treats their consent as a formality rather than a condition. If we break this promise, we undermine the trust of any future survivors who might speak to us. The evidence of the massacre is important, but not if it is built on a betrayal of the victims' autonomy.

  Regarding the AI pilot: The advocates argue that silence is complicity. Visitor numbers are falling; denial is rising. A testimony no one encounters is, in practice, forgotten. If a synthesized voice engages a teenager who would otherwise walk past, and that teenager learns the truth, the fabrication is a justified vessel for the truth. The medium does not negate the message.

  **What Would Change My Mind**

  I state this to ensure our decision remains open to evidence. I would move to support physical erasure if a competent court rules that the Founding Deed is subordinate to post-2003 donor contracts, rendering our retention of the tapes illegal. I would move to support the AI pilot if independent evaluation demonstrates that interactive models significantly reduce denialist beliefs in a way static footage does not, without confusing users about the nature of the interaction.

  Absent these changes, I urge the Committee to vote for sequestration over erasure, and for static preservation over interactive synthesis. We must keep the faith with the future without lying to the past.

  **End of Memo**
