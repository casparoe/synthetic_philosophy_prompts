      *   *Why it looks fine:* It treats moral knowledge like data points. If the data exists in the system, you have access.
      *   *Why it fails:* Moral knowledge isn't just data; it's social credibility. If 99% of your trusted authorities say X is right, and 1% (who are considered crazy/heretics) say X is wrong, the wrongness isn't truly "available" in the epistemic sense required for blame. It ignores *epistemic friction* and *social cost*.
