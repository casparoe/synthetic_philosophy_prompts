      *   *Why:* It conflates "logical possibility of knowing" with "reasonable expectation of knowing."
      *   *Cost:* It makes the defense harder to adjudicate. It becomes a matter of degree (how loud was the dissent? how costly was it to listen?) rather than a binary test.

