answer: |-
  This is a sharp piece of reasoning. You've correctly identified that your argument is functioning as a *reductio ad absurdum*: it takes a plausible intuition about historical judgment and pushes it until it breaks our current moral self-conception.

  If you want to keep (1) and (3), you have to give up **(2)**.

  Here is why (2) is the weak link, why it deceives you, and what it costs to fix it.

  ### Why Step (2) Looks Fine
  Premise (2) relies on a "search engine" model of moral knowledge. It assumes that if a piece of information (a dissenting moral view) exists in the database (society), it is effectively "available" to any user (agent) logged into that system.

  This feels intuitive because we value free speech and open inquiry. We want to believe that truth is accessible if people are allowed to speak. It also offers a clean, binary test: Did someone say it? Yes or no. Philosophers and historians love binary tests because they make adjudication easy. If you can point to a pamphlet from 1780 condemning slavery, you feel you've settled the matter of Jefferson's epistemic access.

  ### Why It Fails Under Pressure
  Step (2) conflates the **existence** of dissent with the **credibility** of dissent.

  In moral epistemology, knowledge isn't just data; it's social credit. For a moral claim to be "available" to an agent in a way that generates blame, it must be *reasonably adoptable* given their social position.

  If 99% of your trusted authorities, religious leaders, economic peers, and legal structures say X is right, and one marginalized outcast says X is wrong, the wrongness of X is not genuinely "available" to you in the sense required for blameworthiness. You might physically hear the words, but you lack the **epistemic resources** to credit them. To believe the dissenter, you would have to distrust your entire world.

  When you run this on the modern case (Steps 5 and 6), the flaw becomes obvious. There is someone, somewhere, arguing that your career is exploitative, your diet is murder, or your parenting is negligent. Their reasons are technically "accessible." But if accepting their view requires you to reject the consensus of your entire community and upend your life, you are not blameworthy for ignoring them. Step (2) ignores the **cost of epistemic rebellion**.

  ### The Fix: Splitting the Condition
  Your instinct to split (2) is correct, but I would suggest framing it as a shift from **Availability** to **Reasonable Accessibility**.

  Instead of just "saying out loud," the test should require:
  1.  **Audibility:** Was the dissent present in the agent's informational environment? (Not just "alive somewhere," but within their social horizon.)
  2.  **Credibility:** Was the source of the dissent someone the agent could reasonably trust without abandoning their entire worldview?
  3.  **Affordability:** What was the social, economic, or physical cost of accepting this view?

  If you adopt this, Jefferson might still fail the test (because the dissent was audible and arguably credible to a man of his education), but the ordinary modern person passes the defense more often. We are surrounded by noise, not just signal. We are not blameworthy for failing to act on every moral critique that exists on a blog or in a fringe movement if doing so would wreck our lives without clear epistemic justification.

  ### The Cost
  Giving up the simple version of (2) comes with two significant costs:

  **1. You lose the binary switch.**
  The clean test ("Did someone say it?") is gone. You are now in the business of weighing degrees of social pressure and epistemic friction. Judging historical figures becomes messier. You can't just cite a contemporary critic; you have to argue that the critic was *sufficiently* mainstream to make ignoring them unreasonable.

  **2. You risk sliding into relativism.**
  By emphasizing "affordability" and "credibility," you open the door for agents to claim, "I couldn't have known better because my society told me so." This is the exact hole the "man of his time" defense usually tries to exploit. You have to be careful not to make the bar for "reasonable accessibility" so high that only the most radical prophets are ever blameworthy.

  ### Summary
  Keep (1). The epistemic excuse is the right philosophical category for this problem.
  Keep (3). It is historically accurate that dissent existed.
  **Scrap (2).** It is too thin. It treats moral knowledge like a library book rather than a social risk.

  Replace it with a **Reasonable Accessibility** standard. This saves the defense from being worthless while acknowledging that moral progress usually requires people to do the hard work of listening to uncomfortable voices—provided those voices are loud enough to be heard over the roar of consensus.
