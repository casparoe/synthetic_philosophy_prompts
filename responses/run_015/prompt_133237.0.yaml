          *   *Risk:* This is the weakest link. "Saying out loud" $\neq$ "Epistemically accessible/credible." Just because a voice exists doesn't mean it's *reasonably* adoptable given the agent's social position, cognitive framework, or evidential basis. It conflates *existence* of dissent with *accessibility* of knowledge.
          *   *User Idea:* Splitting into Available, Audible, Affordable. This is promising.

