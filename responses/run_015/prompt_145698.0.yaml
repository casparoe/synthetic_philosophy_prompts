answer: |-
  You have identified a genuine and under-theorized conceptual tension in intellectual property (IP) and attribution ethics. While there is no single, canonical term that captures this specific "territorial" intuition exactly as you describe it, the phenomenon sits at the intersection of **moral rights theory**, **property law distinctions (trespass vs. conversion)**, and **Foucaultian author-function analysis**.

  The closest established legal concept is the **Right of Paternity** (within the *droit moral* tradition), but as you suspect, that doctrine focuses on the *personality* of the author. Your observation identifies a *spatial* or *topological* logic that underpins the ethics of attribution: the idea is not an object to be stolen, but a **jurisdiction to be respected**.

  Below is an analysis of why existing labels fall short, a proposal for a distinct conceptual framework, and the defining conditions that give it independent status.

  ### 1. Why Existing Labels Are Insufficient

  To establish independent conceptual status, we must first clear away the near-misses.

  *   **Lockean Labor Theory:** This justifies ownership based on mixing labor with resources. It treats the idea as a *chattel* (a movable object) created by work. Your model treats the idea as *land* (a fixed location in conceptual space). In Locke, the wrong is depriving the laborer of the fruit; in your model, the wrong is ignoring the coordinate of the fruit's origin.
  *   **Hegelian Personality Theory:** This justifies IP as an extension of the will. While close, it focuses on the *internal* dignity of the creator. Your model focuses on the *external* mapping of the intellectual landscape. The harm is not just to the author's dignity, but to the public record of "who is where."
  *   **Moral Rights (*Droit Moral*):** This is the legal vessel for your intuition (specifically the right of attribution). However, legal doctrine often lumps attribution and integrity together under "personality." Your description isolates the **boundary-maintenance** function. Moral rights explain *why* we protect the author (dignity); your model explains *how* the violation is structured (trespass/usurpation).
  *   **Misappropriation:** This is an economic tort focused on unfair competition. It lacks the normative, boundary-respect element you describe. One can misappropriate without necessarily claiming authorship (e.g., free-riding), whereas your model requires a disruption of the origin-map.

  ### 2. The Proposed Framework: "Conceptual Jurisdiction"

  The most precise label for this framework is **The Jurisdictional Model of Attribution** (or alternatively, **Conceptual Territoriality**).

  This model posits that intellectual contributions are not treated as *possessions* (which can be taken) but as *sovereignties* (which can be entered). In property law, there is a critical distinction between **conversion** (theft of a chattel, which deprives the owner) and **trespass** (unauthorized entry onto land, which does not necessarily deprive the owner of use).

  Your observation highlights that in attribution ethics, ideas are treated analogously to **land**, not chattels.
  *   **Chattel Logic (Standard IP Rhetoric):** "You stole my idea." (Implies I no longer have it).
  *   **Land Logic (Your Observation):** "You are on my ground." (Implies I am still here, but you are pretending this is your ground).

  In this framework, attribution is not a receipt of transfer; it is a **boundary marker**. It signals the limit of one thinker's jurisdiction and the beginning of another's.

  ### 3. Defining Conditions and Edges

  To merit independent conceptual status, "Conceptual Jurisdiction" must have clear edges. It is defined by three necessary conditions:

  #### A. Non-Rivalrous Substrate
  The framework only applies where the resource is non-rivalrous. If I take your apple, you have no apple (Chattel/Property). If I use your theorem, you still have the theorem (Land/Jurisdiction). The violation cannot be deprivation. If the harm is economic loss due to scarcity, it is a property claim. If the harm is *disorientation* regarding origin, it is a jurisdictional claim.

  #### B. The Violation is Usurpation, Not Deprivation
  In the Jurisdictional Model, the wrongdoer does not remove the originator from the space; they **displace the originator's authority** within that space.
  *   *Property Violation:* I prevent you from using X.
  *   *Jurisdictional Violation:* I use X while signaling that *I* am the authority of X.
  This explains why plagiarism is wrong even if the original author never finds out and loses no money. The "map" of intellectual lineage has been falsified. The copyist has declared sovereignty over a territory they did not discover.

  #### C. Attribution as Boundary-Marking
  Attribution serves a functional role similar to a fence or a surveyor's marker. It does not grant exclusive use (in academia, anyone can use the idea if cited); it grants **priority of place**.
  *   *Edge Case:* If I cite you but distort your idea, that is a violation of *Integrity* (Hegelian).
  *   *Edge Case:* If I use your idea without citing you, that is a violation of *Jurisdiction* (Your Model).
  *   *Edge Case:* If I independently discover the same idea, there is no violation. Why? Because you did not cross a boundary; you staked a parallel claim. Jurisdiction requires *derivation*, not just similarity.

  ### 4. Philosophical Antecedents

  While the specific label "Conceptual Jurisdiction" is not canonical, the logic appears in specific philosophical niches:

  *   **Michel Foucault ("What is an Author?"):** Foucault argues the "Author" is not a person but a **function** that serves to classify and group discourse. The author's name acts as a boundary marker that limits the free circulation of meaning. Your model aligns with this: attribution is the mechanism that pins discourse to a specific coordinate (the author) to prevent conceptual chaos.
  *   **Shyamkrishna Balganesh (Property Theory):** In works like *"Intellectual Property's Boundaries,"* Balganesh explores how IP law uses spatial metaphors to manage uncertainty. He notes that boundaries in IP are not physical but normative. Your observation extends this: the boundary is not just about exclusion, but about **provenance**.
  *   **Robert Merges (Property Rules vs. Liability Rules):** Merges distinguishes between the right to exclude (property) and the right to be paid (liability). Your model suggests a third category: the **Right to be Sited**. It is neither a right to exclude others from thinking the thought, nor a right to payment, but a right to have the thought *located* at its source.

  ### 5. Why It Merits Independent Status

  You should treat this as a distinct framework because it solves explanatory problems that Property and Personality theories cannot.

  1.  **The "Independent Discovery" Puzzle:** Property theory struggles to explain why independent discovery is a defense in IP but not in physical property. If ideas are property, finding one first should grant ownership. But in the Jurisdictional Model, independent discovery is not trespass; it is settling unclaimed land. The violation is only in *crossing the boundary* of an existing claim (derivation).
  2.  **The "No Harm" Puzzle:** In plagiarism, if the author is dead or wealthy, property theory suggests no harm. Jurisdictional theory explains the harm remains: the *intellectual landscape* is corrupted. The public record is falsified.
  3.  **The "Open Source" Puzzle:** In open source, creators often give away economic rights (property) but insist fiercely on attribution (jurisdiction). Property theory calls this irrational. Jurisdictional theory explains it: they are relinquishing tolls but keeping the map accurate.

  ### Conclusion

  The phenomenon you describe is best labeled **Conceptual Jurisdiction** or the **Territorial Model of Attribution**.

  It is distinct from **Property Theory** because it does not rely on rivalry or deprivation.
  It is distinct from **Personality Theory** because it focuses on the public topology of ideas rather than the private dignity of the author.
  It is distinct from **Moral Rights Doctrine** because that is the *legal implementation*, whereas Conceptual Jurisdiction is the *underlying ethical logic*.

  **Defining Definition:**
  > **Conceptual Jurisdiction** is a normative framework wherein intellectual contributions are treated as bounded regions of authority rather than alienable objects. Violations are characterized not as theft (deprivation of resource) but as trespass (unauthorized presence) or usurpation (false claim of sovereignty), with attribution serving as the mechanism for maintaining the integrity of the intellectual map.

  This framework captures the "misplacement" intuition you identified: the sin is not taking the idea, but moving its pin on the map.
