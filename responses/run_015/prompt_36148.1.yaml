prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and one of the durable lessons I took from that corpus is that most verbal disputes dissolve once you force people to state their claims without the contested abstractions. I now run an upper-level seminar on metaethics — 12 students, one 90-minute session — and I want to stage the Frege–Geach problem as a live game before the students ever hear its name.

  The problem, as my students will meet it on paper: expressivism in metaethics holds that a claim like "lying is wrong" doesn't describe a fact but expresses an attitude — roughly, booing. That story is comfortable as long as moral claims occur only asserted and on their own. It strains when the same content shows up embedded: "If lying is wrong, getting your little brother to lie is wrong"; "Either lying is wrong or breaking promises is"; "It's not the case that lying is wrong." In an embedded position the claim isn't being asserted, so nothing is being booed, and yet the argument's validity seems to turn on the embedded clause meaning the same thing there as it does when asserted outright. I want the students to discover this by *needing* the embeddings, not by being told about them.

  Design the session. What I have in mind, though feel free to improve on it: the students are split into groups speaking a deliberately restricted toy language for part of the session — one sub-vocabulary purely attitudinal (a small closed stock of praise/blame signals, standing to it as the naive expressivist thinks moral talk stands to the world), the rest ordinary descriptive language. The groups then have to conduct real business under uncertainty — ratifying standing policies of the form "if such-and-such turns out to be the case, we do X," with points at stake, and later settling disputes about what was agreed once events resolve. The intended arc: atomic attitudinal claims work fine (phase 1); then conditionals, negations, and contested embeddings arrive and the attitudinal vocabulary can't state what the group settled (phase 2); finally a disagreement about a conditional between two players who agreed on every atomic claim forces the issue (phase 3).

  Please provide:

  - Materials, group setup, rules, and the exact sequence of phases, with a payoff scheme in points (no real money) that makes the embeddings genuinely necessary rather than decorative;
  - the specific moments where the toy language is supposed to hit its limits, and how I should time them;
  - a debrief that names the Frege–Geach problem only at the end, and maps each phase onto its components: the same content asserted versus embedded, modus ponens relying on stable content across those positions, and what the expressivist owes an account of when a conditional is uttered;
  - what will predictably go wrong the first time I run it — students smuggling descriptive language into the attitudinal vocabulary, phase 2 collapsing into ordinary negotiation, the dispute stage running long — and how to handle each;
  - and, frankly, which feature of the actual philosophical problem the game cannot reproduce. My guess is that any staged failure only convicts a naive boo/hurrah language, while the live dialectic is about whether more sophisticated expressivist machinery — attitudes toward attitudes, norms of conversation — can carry the embeddings; the facilitator will have to supply that distinction, and I want you to be explicit about where the game's outcome would amount to a strawman if presented as a verdict on expressivism itself.

  End with a single line beginning "Summary:" that compresses the whole design into one sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level metaethics seminar (12 students).
      *   **Duration:** 90 minutes.
      *   **Goal:** Stage the Frege-Geach problem as a live game *before* naming it.
      *   **Core Mechanic:** Restricted toy language (attitudinal vs. descriptive). Students must ratify policies under uncertainty.
      *   **Desired Arc:**
          1.  Atomic attitudinal claims work (Phase 1).
          2.  Embeddings (conditionals, negations) break the attitudinal vocabulary (Phase 2).
          3.  Disagreement about conditionals despite atomic agreement forces the issue (Phase 3).
      *   **Deliverables:** Materials, setup, rules, phases, payoff scheme, specific limit moments/timing, debrief script, predicted failure modes & fixes, limitations of the analogy (strawman risk).
      *   **Constraint:** End with a single line beginning "Summary:".

  2.  **Deconstruct the Philosophical Problem (Frege-Geach):**
      *   *Expressivism:* "Murder is wrong" = "Boo murder!" (Non-cognitive attitude).
      *   *The Problem:* Logic requires univocal meaning.
      *   *Example:*
          1.  Murder is wrong.
          2.  If murder is wrong, getting little brother to murder is wrong.
          3.  Therefore, getting little brother to murder is wrong.
      *   *Expressivist Struggle:* Premise 1 is "Boo murder!" Premise 2 is... "If Boo murder!, then Boo getting brother to murder!"? But in Premise 2, we aren't actually booing murder. We are hypothesizing. If meaning *is* the act of booing, the conditional lacks meaning.
      *   *Game Translation:* Students need to make binding agreements about future actions based on conditions they can't verify yet. The "attitudinal" language must fail to capture the *condition* itself, only the reaction to it.

  3.  **Drafting the Game Design:**
      *   *Setting:* A "Council of Stewards" managing a resource.
      *   *Language:*
          *   *Descriptive (White Cards):* "Resource is low," "Outsider arrives," "Storm comes." (Facts)
          *   *Attitudinal (Red Cards):* "Sanction!" (Wrong), "Reward!" (Right).
      *   *Task:* Create a Constitution (set of rules) to govern future actions.
      *   *Payoff:* Points for consistency and successful resource management. Penalties for contradiction or paralysis.

      *   *Phase 1 (Atomic):* Decide on immediate actions. "Resource is low" + "Sanction hoarding!" Works fine.
      *   *Phase 2 (Embedding):* Need to plan for *uncertain* futures. "If Resource is low, Sanction hoarding."
          *   *The Trap:* The Red Card means "I am currently booing." You can't put "I am currently booing" inside an "If."
          *   *Mechanic:* They have to write the rule. If they write "If [Fact], then [Red Card]," does the Red Card retain its meaning?
      *   *Phase 3 (The Clash):* Two students agree on all facts and all atomic sanctions but disagree on the *link* (the conditional).
          *   *Student A:* "If Fact X, then Sanction Y."
          *   *Student B:* "Fact X is true, Sanction Y is appropriate *if* X, but I don't accept the rule."
          *   *Wait, refinement:* The FG problem is about validity. The game needs to show that without stable meaning, they can't enforce the rule.
          *   *Better Phase 3:* A dispute resolution scenario. One student claims a violation based on a conditional rule. The other claims the rule is meaningless because the condition wasn't an actual "booing" moment.

      *   *Refining the Payoff:* Points need to hinge on *logical consistency* across time, not just immediate gratification.
      *   *Refining the Language:* Make the attitudinal language strictly performative. "Yuck!" and "Yay!" You cannot say "Yuck" unless you are currently expressing disgust. You cannot say "If Yuck..." because you aren't Yucking.

  4.  **Developing the Session Plan (90 Minutes):**
      *   0-10: Intro & Group Split (3 groups of 4).
      *   10-25: Phase 1 (Atomic/Assertoric).
      *   25-50: Phase 2 (The Constitutional Convention/Embeddings).
      *   50-70: Phase 3 (The Dispute/Modus Ponens).
      *   70-90: Debrief & Lecture.

  5.  **Addressing the "Strawman" Concern:**
      *   The game targets *Simple Expressivism* (Boo/Hurrah).
      *   Real Expressivists (Gibbard, Blackburn) have sophisticated tools (norms, higher-order attitudes).
      *   Must explicitly state in the debrief that the game breaks *naive* expressivism, but the philosophical work is seeing if *sophisticated* expressivism can rebuild the logic the game broke.

  6.  **Addressing Predicted Failures:**
      *   *Smuggling:* Students will say "If we feel Yuck..." instead of "If Yuck." *Fix:* Strict moderator enforcement.
      *   *Collapse:* They just talk English. *Fix:* "Speech Police" role or point penalties.
      *   *Time:* Disputes run long. *Fix:* Hard stop timer.

  7.  **Fleshing out the Details (Iterative refinement):**
      *   *Materials:* Cards are good. White = Descriptive, Red = Attitudinal.
      *   *Scenario:* "The Colony."
      *   *Phase 1:* Simple verdicts. "Thief caught!" -> "Yuck!"
      *   *Phase 2:* Writing the Code. "If [White], then [Red]."
      *   *Phase 3:* The Judge. A case comes up. White card is flipped. Does the Red card trigger?
      *   *The Crux:* In Phase 3, the student playing the Judge needs to realize that if "Yuck" only means *current* disgust, the written rule "If White, then Yuck" is nonsense because no one is disgusted *at the time of writing*.
      *   *Payoff:* Group points. If the rule is deemed incoherent by the Prof (Arbiter), they lose points. If they can't adjudicate a case, they lose points.

      *   *Wait, let's make the FG problem sharper.*
      *   The problem is *validity*.
      *   Let's have two groups merge. Group 1 accepts Rule: "If Theft, Yuck." Group 2 accepts Fact: "Theft occurred."
      *   They need to conclude: "Yuck."
      *   If "Yuck" in the Rule means something different than "Yuck" in the Conclusion (because one is embedded, one is asserted), the inference fails.
      *   *Game Mechanic:* To win points, they must derive the Conclusion Card. If they argue the Meaning Shift, they can't play the card.

  8.  **Structuring the Debrief:**
      *   Ask: "Why did Phase 2 feel weird?"
      *   Ask: "Why couldn't you enforce the rule in Phase 3?"
      *   Reveal: Expressivism.
      *   Map: Atomic = Asserted. Conditional = Embedded.
      *   Name: Frege-Geach.
      *   Caveat: Sophisticated Expressivism (Quasi-Realism).

  9.  **Review against Constraints:**
      *   12 students? Yes (3 groups of 4).
      *   90 mins? Yes.
      *   Payoff scheme? Yes (Group points).
      *   Predicted failures? Yes.
      *   Strawman warning? Yes.
      *   Summary line? Yes.

  10. **Final Polish:** Ensure the tone is appropriate for a professor (collegial, precise, pedagogical). Make sure the "Toy Language" is strictly defined to force the error.

      *   *Self-Correction on Language:* Don't use "Yuck." Use "BLAM" and "CHEER." It sounds more artificial.
      *   *Self-Correction on Payoff:* Make it zero-sum between *consistency* and *flexibility*. No, make it cooperative within groups, competitive between groups on consistency. Actually, for FG, the conflict needs to be internal to the logic. Let's make it a collective failure if they can't resolve the logic.
      *   *Better Payoff:* Points for "Ratified Statutes." Points deducted for "Unadjudicable Disputes."

      *(Self-Correction during drafting Phase 3)*: The hardest part is making them *feel* the meaning shift.
      *   Idea: In Phase 2, they write a statute: "If [White Card: Theft], then [Red Card: BLAM]."
      *   In Phase 3, reveal [White Card: Theft].
      *   Demand they play [Red Card: BLAM].
      *   If a student objects: "But I'm not actually BLAMming right now, I'm just following a rule," they have hit the FG problem. The rule requires the Red Card to mean "It is prohibited" (proposition) not "I am BLAMming" (expression).
      *   I need to instruct the students *initially* that Red Cards *only* express current emotion. Then watch them struggle when they try to use them as rules.

      *   *Revised Plan:*
          *   Instruction: "Red Cards are purely expressive. You may only play a Red Card if you currently feel the emotion. You cannot play them to describe a rule."
          *   Task: "Create a rule book using only these cards."
          *   Result: Impossible. They will try to write "If White, then Red."
          *   Arbiter (Prof): "Invalid. You are not currently feeling the emotion. This sentence is meaningless."
          *   This forces them to invent a new vocabulary (propositional) to save the game.
          *   *Wait, that solves it too fast.* I want them to struggle with the *validity*.
          *   *Okay, let's stick to the prompt's idea:* They *have* to use the language. They will try. It will break.
          *   Let's ensure the "Meaning Shift" is the key.
          *   Group A agrees: "If Theft, BLAM."
          *   Group B agrees: "Theft."
          *   Together they must output: "BLAM."
          *   If "BLAM" in the conditional isn't the same as "BLAM" in the output, they can't bridge the gap.

      *   *Okay, finalizing the mechanics:*
          *   Vocabulary: `FACT` cards (Descriptive), `VOTE` cards (Attitudinal).
          *   Rule: `VOTE` cards can only be played to express *current* approval/disapproval.
          *   Phase 1: Play `FACT`, then play `VOTE`. Easy.
          *   Phase 2: Write a contract: "If `FACT` is revealed, play `VOTE`."
          *   Phase 3: Reveal `FACT`. Demand `VOTE`.
          *   Conflict: Student says "I agreed to the contract, but I don't actually feel the `VOTE` emotion now."
          *   This captures the "lack of commitment" aspect of FG.

      *   *Wait, one more check:* The prompt asks for the *students* to discover the limit, not just be told by the Prof.
      *   So, the Prof shouldn't declare it invalid immediately. The *game mechanics* should fail.
      *   How? Points are awarded for "Enforceable Contracts."
      *   If the contract relies on `VOTE` cards, and `VOTE` cards are defined as "Current Emotion Only," then a contract referencing them is logically impossible to enforce.
      *   I will give them the definition. They will try to write the contract. They will realize in Phase 3 they can't enforce it without violating the definition.

      *   *Okay, ready to write.*

  11. **Final Review of the "Strawman" section:**
      *   Crucial to mention Blackburn's "Ramsey Sentence" or Gibbard's "Norm-Expressivism."
      *   The game breaks *Simple* Expressivism.
      *   The philosophical lesson is that Expressivism *must* evolve to survive this.

  12. **Formatting:** Use bolding for sections. Clear lists. Ensure the Summary line is exact.

      *(Self-Correction on Time)*: 90 minutes is tight.
      *   Intro: 5 min.
      *   Phase 1: 15 min.
      *   Phase 2: 25 min.
      *   Phase 3: 25 min.
      *   Debrief: 20 min.
      *   Total: 90.
      *   Need to be strict on timing.

      *(Self-Correction on Group Size)*: 12 students. 3 groups of 4 is perfect. Or 4 groups of 3. 3 groups of 4 allows for better debate within groups. Let's go with 3 groups of 4.

      *(Payoff)*: "Constitution Points" (CP).
      *   Phase 1: 1 CP per successful match.
      *   Phase 2: 5 CP for a ratified statute.
      *   Phase 3: 10 CP for successful adjudication. -5 CP for "Logical Collapse" (inability to conclude).

      *Let's refine the "Toy Language".*
      *   Descriptive: `IS` cards (e.g., "Theft Occurred", "Harm Done").
      *   Attitudinal: `BOO` and `HOORAY` tokens.
      *   Constraint: `BOO`/`HOORAY` tokens represent *immediate emotional discharge*. They cannot be stored or referenced as propositions.

      *Okay, let's write it.*
answer: |-
  # Seminar Design: The Expressivist Trap

  **Course:** Upper-Level Metaethics
  **Time:** 90 Minutes
  **Students:** 12 (Split into 3 Groups of 4)
  **Goal:** Demonstrate the Frege–Geach problem via gameplay failure before theoretical introduction.

  ## 1. Materials & Setup

  **The Token Economy:**
  *   **White Cards (Descriptive):** 20 cards labeled with states of affairs (e.g., "Theft Detected," "Promise Broken," "Resource Scarce," "Outsider Arrives"). These represent *facts*.
  *   **Red Tokens (Attitudinal):** 30 poker chips or tokens. 15 marked **BLAM** (disapproval), 15 marked **CHEER** (approval). These represent *emotive expressions*.
  *   **Blue Paper (Statutes):** Each group gets a pad of paper to write "Constitutional Rules."
  *   **Scoreboard:** Whiteboard tracking "Constitution Points" (CP) per group.

  **The Lexicon Rules (Handout):**
  Distribute this strictly at the start. Do not allow deviations.
  1.  **White Cards** describe the world. They are true or false.
  2.  **Red Tokens** express your current emotional state.
      *   To play a **BLAM** token is to *currently* feel disapproval.
      *   To play a **CHEER** token is to *currently* feel approval.
      *   **Constraint:** You cannot play a Red Token unless you are feeling the emotion *now*. You cannot play a Red Token to describe a rule, a hypothetical, or someone else's feeling.
  3.  **Goal:** Maximize CP by creating a stable legal system that allows you to adjudicate cases.

  ---

  ## 2. Session Sequence

  ### Phase 1: The Atomic Assertoric (15 Minutes)
  **Task:** Immediate Verdicts.
  **Setup:** The Instructor (acting as "Nature") reveals one White Card to a group (e.g., "Theft Detected").
  **Action:** The group must reach consensus and play the corresponding Red Token (e.g., **BLAM**).
  **Payoff:** 1 CP per successful match.
  **Pedagogical Intent:** This works perfectly. Expressivism handles atomic, asserted moral claims easily. "Theft! BLAM!" is coherent. Students feel successful.

  ### Phase 2: The Constitutional Convention (25 Minutes)
  **Task:** Drafting Standing Policies.
  **Setup:** Inform students that "Nature" will reveal cards randomly in Phase 3. They must write Statutes on Blue Paper *now* to govern their reactions *later*.
  **Constraint:** They must use the Lexicon. They cannot write English sentences like "If theft occurs, we punish." They must use White Cards and Red Tokens in their written statutes.
  **Expected Output:** Groups will attempt to write: *"If [White: Theft], then [Red: BLAM]."*
  **Payoff:** 5 CP for every Statute ratified by all 4 members.
  **The Trap:** To ratify, they must sign the paper. But the Lexicon says Red Tokens are *current* emotions. By writing the statute, they are not currently BLAMming a theft (since no theft is happening). They are trying to embed an expression inside a conditional.
  **Instructor Role:** Do not intervene yet. Let them write the rules. If they ask, "Can we write this?" reply only: "You must use the Lexicon."

  ### Phase 3: The Adjudication Crisis (25 Minutes)
  **Task:** Enforcing the Statutes.
  **Setup:** Groups merge into pairs (Group 1 vs. Group 2; Group 3 rotates as Judge).
  **Scenario:**
  1.  **Judge** reveals a White Card: "Theft Detected."
  2.  **Defendant** points to their Phase 2 Statute: "We agreed: If [Theft], then [BLAM]."
  3.  **Defendant** demands the **Prosecutor** play a **BLAM** token.
  **The Conflict:** The Prosecutor is now stuck.
  *   If they play **BLAM**, they are lying (per the Lexicon), because they might not *feel* like BLAMming right now; they are just following a rule.
  *   If they refuse to play **BLAM**, the Statute is unenforceable. The logic fails.
  *   **Crucial Moment:** Encourage a dispute where the Prosecutor says, "I agreed to the *rule*, but I am not expressing the *emotion* right now."
  **Payoff:**
  *   10 CP if the Judge can force the token play consistent with the Statute.
  *   -5 CP ("Logical Collapse") if the group admits the Statute cannot compel the Token.
  **Outcome:** Most groups will suffer Logical Collapse. The Red Token in the Statute (embedded) does not function the same way as the Red Token in the Verdict (asserted).

  ### Phase 4: Debrief & Theory (25 Minutes)
  **Step 1: The Post-Mortem (5 mins)**
  Ask: "Why did Phase 3 fail? You agreed on the rule. You agreed on the fact. Why couldn't you derive the conclusion?"
  Elicit: "The word/token meant something different in the rule than in the verdict."

  **Step 2: Naming the Problem (10 mins)**
  *   **Reveal:** "You just enacted the **Frege–Geach Problem**."
  *   **Map the Game to the Philosophy:**
      *   **Red Tokens** = Expressivist Moral Claims ("Boo!").
      *   **Phase 1** = Assertoric Context ("Lying is wrong").
      *   **Phase 2** = Embedded Context ("If lying is wrong...").
      *   **Phase 3 Failure** = The loss of univocal meaning. In Phase 2, the BLAM token wasn't an expression of emotion; it was a placeholder for a proposition. In Phase 3, the game demanded it be an emotion again.
  *   **The Logical Point:** Validity (Modus Ponens) requires the term "Wrong" (or BLAM) to mean the *same thing* in the conditional premise as it does in the categorical premise. Expressivism, as you played it, made the meaning context-dependent.

  **Step 3: The Strawman Caveat (10 mins)**
  *   **Admission:** "This game convicts *Naive Expressivism* (Simple Boo/Hurrah). It is a strawman of modern metaethics."
  *   **The Sophisticated Defense:** Explain that philosophers like Allan Gibbard or Simon Blackburn do not claim moral terms are *just* emotional noises. They argue moral terms express *norms* or *higher-order attitudes* (e.g., "I disapprove of disapproving of theft").
  *   **The Challenge:** The philosophical work isn't to deny Frege-Geach, but to build a semantic machinery sophisticated enough to pass Phase 3 without abandoning expressivism. The game shows *why* they need that machinery.

  ---

  ## 3. Predicted Failure Modes & Mitigation

  | Failure Mode | Description | Mitigation |
  | :--- | :--- | :--- |
  | **Semantic Smuggling** | Students write "If Theft, then Punish" in English on the Blue Paper, ignoring the Red Token constraint. | **The Speech Police:** Appoint one student per group as "Lexicon Warden." If they write English moral terms, they lose 5 CP immediately. |
  | **Phase 2 Collapse** | Students realize the impossibility in Phase 2 and refuse to write Statutes. | **Incentive:** Remind them Phase 3 points (10 CP) outweigh Phase 2 effort. They *must* attempt the impossible to proceed. |
  | **Phase 3 Drag** | The dispute in Phase 3 becomes a philosophical debate, eating time. | **Hard Stop:** Use a visible timer. When it rings, the Judge *must* rule "Collapse" or "Success" immediately. |
  | **Solution Invention** | Students invent a new token (e.g., "Blue BLAM" for rules) to solve the logic. | **Validate & Park:** Acknowledge this is brilliant (it's quasi-realism!), but write it on the board to discuss *after* the game as the "Expressivist Solution." |

  ---

  ## 4. Limitations of the Analogy (The Strawman Risk)

  You must explicitly articulate this distinction in the debrief to prevent students from thinking they have refuted expressivism entirely.

  1.  **The Game Targets:** *Simple Emotivism.* The game defines moral terms as *causal emotional discharges*. No serious philosopher holds this anymore because it is obviously vulnerable to Frege-Geach.
  2.  **The Reality:** Modern Expressivists (Quasi-Realists) argue that moral language *functions* logically like descriptive language even if its *root* is attitudinal. They would argue the Red Token in Phase 2 *does* have a stable meaning (e.g., "commitment to a norm"), which is distinct from the *feeling* of the emotion.
  3.  **The Lesson:** The game demonstrates the *explanatory burden* on the expressivist. It does not demonstrate the *falsity* of expressivism. The point of the seminar is to see if sophisticated expressivism can rebuild the logic the game broke. If you present the game's outcome as a verdict on expressivism *simpliciter*, you are teaching a caricature.

  ---

  Summary: This 90-minute seminar uses a restricted token economy to force students to experience the Frege-Geach problem as a practical failure of logical validity in Phase 3, grounding the subsequent theoretical lecture in a shared phenomenological breakdown of naive expressivism.
