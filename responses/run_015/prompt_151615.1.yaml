answer: |-
  Your diagnosis is sharper than most of the literature. You've correctly identified that the debate hinges on the epistemic relation (knowing *that* vs. knowing *by acquaintance*), but I would argue the stall is deeper than semantics. It is a **bedrock intuition clash regarding the completeness of structural description**, disguised as a verbal dispute about the word "fact."

  Here is the breakdown of why this hasn't budged, framed for someone comfortable with modeling and physical ontology.

  ### 1. It is not an empirical disagreement
  You asked if there is a hidden empirical disagreement about neural correlates. There isn't. Both sides agree on the NCCs (Neural Correlates of Consciousness). Both agree Mary's brain changes upon seeing red. Both agree on the causal closure of the physical domain (mostly).
  The disagreement is **modal**. The anti-physicalist claims that the physical facts *could* obtain without the phenomenal facts (zombies are conceivable). The physicalist claims that the connection is necessary but epistemically opaque. Since we cannot run an experiment on "all possible worlds," empirical data cannot settle this.

  ### 2. It is not merely verbal (though it looks like it)
  Your de dicto / de re distinction is the standard Physicalist defense (the "Phenomenal Concept Strategy"). They argue Mary gains a new *concept* (de re acquaintance) for an old *property* (the physical brain state).
  However, calling this "just semantics" grants the Physicalist too much. If the "mode of presentation" is so radically different that it feels like discovering a new ontological category, the semantics are doing heavy metaphysical lifting.
  The stall here is that **both sides are using "physical fact" to mean different things:**
  *   **Anti-Physicalist:** "Physical fact" = Third-person structural/functional description (the map).
  *   **Physicalist:** "Physical fact" = Third-person description + the intrinsic realization of that structure (the territory).

  The Anti-Physicalist charges that the Physicalist is smuggling the territory into the definition of the map to win the argument by fiat. The Physicalist charges that the Anti-Physicalist is reifying the map-territory gap into a dualistic ontology.

  ### 3. The Real Stall: Structuralism vs. Intrinsic Nature
  As a physicist, you know that physics deals in **relations, structures, and dynamics**. It tells you how a system behaves, how it couples to other systems, and how it evolves. It does not, strictly speaking, tell you what the system *is* in itself (the "intrinsic nature").
  *   **The Anti-Physicalist Intuition:** Experience is intrinsic. Physics is structural. Therefore, experience cannot be fully captured by physics. Mary's shock is the realization of the intrinsic nature that the structural description omitted.
  *   **The Physicalist Intuition:** Structure/function is all there is to "existence" in a scientific ontology. To demand more is to demand a ghost in the machine.

  The debate stalls because **standard physicalism is structurally complete but intrinsically silent.** The Knowledge Argument exploits this silence. Until there is agreement on whether "physical ontology" includes intrinsic natures or is purely relational, the Mary case is undecidable.

  ### 4. Can it be ended?
  There is no resolution mechanism within the current framework because the framework *is* the problem. However, there are three ways the debate dissolves rather than resolves:

  *   **Illusionism (The Dennett Move):** Deny the bedrock intuition. Claim that "what it is like" is a user-illusion generated by the brain. Mary doesn't learn a fact; she undergoes a cognitive upgrade that tricks her into thinking she did. (Many physicists find this unsatisfying as it denies the datum of experience).
  *   **Russellian Monism (The Physicist's Escape Hatch):** This posits that the intrinsic nature of physical matter *is* proto-consciousness. Physics describes the mathematical structure; consciousness is the "stuff" implementing the math. This dissolves the Mary problem: Mary knew the structure, but experiencing red is accessing the intrinsic nature of the structure she already knew existed. It bridges the gap without dualism.
  *   **Acceptance of Brute Identity:** Accept that the identity between brain state and qualia is a brute fact, like $E=mc^2$ before derivation. It's not reducible; it's fundamental. This stops the regress but feels like giving up on explanation.

  ### Verdict
  The stall is **Bedrock Intuition**.
  It is a clash between the intuition that **experience is irreducible data** vs. the intuition that **causal closure is inviolable**.

  The "semantics of knowing" is the battlefield, not the war. The war is about whether a complete structural description of the universe exhausts its ontology. Since we have no independent access to the universe's ontology other than our own consciousness, and no way to derive consciousness from structure mathematically, the debate is currently **underdescribed by our metaphysics**, not just our epistemology.

  If you want a position that respects the physics without denying the phenomenology, look into **Russellian Monism**. It treats the Mary intuition as valid (she learns the intrinsic nature) but denies the Dualist conclusion (that this nature is non-physical). It's often the most comfortable landing spot for physicists turned philosophers.
