prompt: |-
  ok so i've been noticing this thing in philosophy discussions and i dont know if it has a name. it's kind of adjacent to the wrong-kind-reasons problem but not quite the same, and i can't tell if im describing a recognized variant or just reinventing the wheel.

  here's the pattern with a couple concrete cases. someone asks why this particular person should hold some specific attitude - trust in a court, forgiveness toward a specific wrongdoer, belief in some climate claim - and the answer doesnt address whether that attitude is fitting here (truth-tracking, deserved, warranted, whatever). instead the answer points to what happens if the attitude vanishes at scale. like "you should still trust the courts because if everyone stopped, society collapses" or "you ought to feel gratitude even toward bad parents because widespread ingratitude weakens families." the reason isnt selfish or comfort-based - its genuinely about collective welfare - but it still feels like the wrong kind of reason for this individuals particular attitude, since it never touches whether the attitude is appropriate in this case. at the same time its not the classic wrong-kind-reasons setup either, since those usually involve pragmatic or self-interested reasons for belief (believing in god because it makes you less anxious). this is more like applying a collective-level moral reason to justify an individual-level attitude.

  ive seen this move in debates about climate belief and in some moral psychology threads. is there an established concept for it, maybe in social epistemology or collective action theory? or is it just a sloppy extension of wrong-kind reasons? if theres no exact term, how would you draw the boundaries - like when does it stop being this thing and become ordinary collective-action reasoning or a straight wrong-kind case? i care more about the carving than the label: what exactly the phenomenon is, what it isnt, and where its edges are.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Phenomenon:** The user identifies a specific argumentative pattern in philosophy/ethics/epistemology.
      *   **The Pattern:** Justifying an *individual's* specific attitude (trust, belief, forgiveness, gratitude) not by its *fittingness* (truth, desert, warrant) but by the *collective consequences* if everyone lacked that attitude (social collapse, weakening institutions).
      *   **Distinction 1 (Wrong Kind of Reasons - WKR):** It's adjacent to WKR but distinct. Classic WKR is usually pragmatic/self-interested (Pascal's Wager, believing for comfort). This is *moral/collective* (believing for the greater good).
      *   **Distinction 2 (Collective Action):** It applies a collective-level reason to an individual-level *attitude*, not just action.
      *   **Goal:** The user wants to know if there's a name for this, or if not, how to carve out the concept (boundaries, distinctions, examples). They care more about the conceptual analysis than the label.

  2.  **Initial Brainstorming & Keyword Association:**
      *   *Wrong Kind of Reasons (WKR):* Yes, user knows this. Usually pragmatic vs. constitutive.
      *   *Consequentialism vs. Deontology:* This feels like rule-consequentialism applied to attitudes.
      *   *Social Epistemology:* Testimony, trust, collective belief.
      *   *Collective Action/Free Rider:* "What if everyone did that?" (Kantian universalization).
      *   *Fittingness:* The core tension is between "fittingness" (is the attitude merited?) and "utility" (is the attitude useful?).
      *   *Doxastic Ethics:* Ethics of belief.
      *   *Institutional Trust:* Specific literature on why we trust institutions.
      *   *Rule-Consequentialism:* "Follow the rule that leads to best outcomes."
      *   *Ideal Observer Theory:* No, not quite.
      *   *Functionalism:* Attitudes serve a social function.

  3.  **Identifying Existing Concepts:**
      *   **The "Wrong Kind of Reason" Problem (WKR):** The user is right that this is a variant. In meta-ethics/aesthetics, WKR distinguishes reasons *for* having an attitude vs. reasons *about* the object of the attitude. The user's case is a *moral* reason for an *epistemic/normative* attitude. This is often called "Pragmatic Encroachment" or "Moral Encroachment," but those usually involve stakes affecting warrant, not collective consequences replacing warrant.
      *   **Rule-Consequentialism:** This is the closest structural match. "You should hold attitude X because if everyone held ~X, things would be bad." It treats attitudes as rules.
      *   **Functionalism about Norms:** Attitudes are justified by their social function.
      *   **The "Free Rider" Problem in Belief/Attitude:** If I benefit from a system of trust, do I have a duty to contribute my trust even if unwarranted?
      *   **Epistemic Teleology:** Beliefs aim at truth. This argument says beliefs aim at social stability.
      *   **"Noble Lie" / "Myth of the Metals":** Plato. Believing something false for social cohesion.
      *   **"Civic Epistemology":** How societies validate knowledge.
      *   **"Institutional Faith":** Distinct from evidence-based trust.

  4.  **Synthesizing the Concept:**
      *   There isn't *one* canonical term like "The Smith Fallacy."
      *   It is best understood as a collision between **Fittingness Norms** (is this attitude merited by the object?) and **Functional/Consequentialist Norms** (is this attitude beneficial to the system?).
      *   It is a specific subtype of WKR: **The Moral/Collective WKR.**
      *   It relates to **Rule-Consequentialism applied to Attitudes.**
      *   It touches on **The Ethics of Belief** (Clifford vs. James).

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the insight. It's a sharp observation. It *is* a recognized tension, even if there isn't a single catchy noun for it.
      *   **Labeling:** Offer the closest existing terms.
          *   *Wrong Kind of Reasons (WKR):* Confirm it is a subtype. Specifically, "Moral Reasons for Epistemic/Normative Attitudes."
          *   *Rule-Consequentialism:* The logical structure is rule-consequentialist.
          *   *Functionalism:* Justifying norms by their social function.
      *   **Conceptual Carving (The "Meat"):** This is what the user really wants.
          *   *Axis 1: Object-Given vs. State-Given Reasons.* (Shah & Velleman). This is the technical meta-ethical distinction. Object-given = about the court's trustworthiness. State-given = about the benefits of being in a state of trust.
          *   *Axis 2: Individual Warrant vs. Systemic Stability.*
          *   *Axis 3: Constitutive Aims.* Belief aims at truth. Trust aims at competence. If you sever that, is it still belief/trust?
      *   **Boundary Drawing (When is it valid vs. invalid?):**
          *   *Valid:* When the attitude is partially constitutive of the institution (e.g., money has value because we trust it). Self-fulfilling prophecies.
          *   *Invalid:* When the attitude is truth-apt and the truth is independent of the attitude (e.g., climate science).
      *   **Specific Terminology:**
          *   "Systemic Justification of Attitudes."
          *   "Collective Epistemic Responsibility."
          *   "Civic Trust vs. Epistemic Trust."
      *   **Philosophers/References:**
          *   Pamela Hieronymi (Fittingness).
          *   R.J. Wallace.
          *   Miranda Fricker (Epistemic Injustice/Trust).
          *   Rule-Consequentialists (Brad Hooker).
          *   Pragmatists (Peirce/James - belief as habit of action).

  6.  **Refining the Distinction (The "Carving"):**
      *   The user asked: *When does it stop being this thing and become ordinary collective-action reasoning?*
      *   *Answer:* Collective action usually governs *behavior* (voting, recycling). This phenomenon governs *internal states* (belief, trust, resentment). That's the key boundary. You can *act* as if you trust for collective good. Can you *feel* trust for collective good? That's the philosophical rub.
      *   *When does it become standard WKR?* Standard WKR is often selfish (Pascal). This is altruistic/systemic. So it's "Altruistic WKR."

  7.  **Final Polish:**
      *   Ensure tone is collaborative and analytical.
      *   Avoid jargon overload but use precise terms where helpful (State-Given vs. Object-Given).
      *   Make sure to address the "Climate/Court" examples specifically.

  8.  **Self-Correction/Review during drafting:**
      *   *Thought:* Is this just "Noble Lie"?
      *   *Correction:* No, Noble Lie implies the elite know it's false. This argument often implies the individual should *genuinely* hold the attitude, not just pretend. That's the tension. Can you voluntarily believe for a moral reason?
      *   *Thought:* Is it "Precautionary Principle"?
      *   *Correction:* No, that's about risk management.
      *   *Focus:* Stick to the *Justification of Attitude* vs. *Consequences of Attitude*.

  9.  **Final Output Structure:**
      *   Validation & Direct Answer (No single name, but clear lineage).
      *   Technical Framework (State-Given vs. Object-Given).
      *   The "Collective WKR" Label.
      *   The Crucial Boundary (Self-Fulfilling vs. Truth-Tracking).
      *   When it's legitimate vs. when it's manipulation.
