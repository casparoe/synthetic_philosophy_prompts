answer: |-
  You have carved out a very precise and philosophically significant distinction. You are not reinventing the wheel, but you are pointing to a specific spoke that often gets blurred in the hub.

  There is no single canonical term like "The Fallacy of Collective Attitudes," but this phenomenon sits at the intersection of **meta-ethics (fittingness)**, **social epistemology**, and **rule-consequentialism**.

  Here is the conceptual carving you are looking for: the distinctions, the existing terminology that approximates it, and the boundaries of when this reasoning is valid versus when it is category error.

  ### 1. The Technical Label: State-Given vs. Object-Given Reasons
  The most precise technical framework for this is the distinction made by philosophers like **Jonathan Way**, **David McNaughton**, and **Pamela Hieronymi** regarding **State-Given vs. Object-Given Reasons**.

  *   **Object-Given Reasons:** Reasons that bear on the *content* of the attitude. (e.g., "You should trust the court because the judges are impartial and competent.") This addresses **fittingness**.
  *   **State-Given Reasons:** Reasons that bear on the *benefits of holding* the attitude, regardless of content. (e.g., "You should trust the court because holding that belief reduces your anxiety.")

  Your observation identifies a specific subset of **State-Given Reasons**: **Altruistic or Systemic State-Given Reasons.**
  Classic Wrong Kind of Reasons (WKR) discussions often focus on *prudential* state-given reasons (Pascal's Wager: believe in God to avoid hell). You are identifying *moral/collective* state-given reasons (Believe in the court to avoid anarchy).

  **The Phenomenon:** Justifying an individual's normative attitude (trust, belief, resentment) via **Systemic Consequentialism** rather than **Local Fittingness**.

  ### 2. Is it a Category Error? (The "Constitutive Aim" Boundary)
  The reason this feels "off" to you, even though the consequences are genuinely good, is that many attitudes have a **constitutive aim**.

  *   **Belief:** Constitutively aims at **Truth**.
  *   **Trust:** Constitutively aims at **Reliability/Competence**.
  *   **Resentment:** Constitutively aims at **Moral Accountability/Desert**.

  If you justify a belief solely by its social utility, you are arguably no longer talking about *belief*; you are talking about *acceptance* or *professing*. This is the boundary line.

  **The Boundary Test:**
  *   **Zone A (Legitimate Collective Reasoning):** The attitude is **self-fulfilling** or **constitutive of the institution**.
      *   *Example:* Trust in currency. If everyone stops believing the paper has value, it literally ceases to have value. Here, the collective consequence *is* the truth condition. Justifying trust via collective stability is valid here because the trust creates the reality.
      *   *Example:* Democratic legitimacy. If citizens collectively withdraw belief in the election's validity, the system collapses. The attitude is part of the machinery.
  *   **Zone B (The Phenomenon You Identified):** The attitude is **truth-apt** or **desert-apt**, independent of the collective stance.
      *   *Example:* Climate Science. The physics of warming does not depend on whether we believe it. Justifying belief via "social cohesion" is a category error because the *object* of the belief (the climate) is indifferent to the belief.
      *   *Example:* Forgiveness. If a parent was abusive, they *deserved* resentment. Saying "you shouldn't resent them because families need gratitude" ignores the fittingness of the resentment toward the *act*.

  **The Carving:** The move is fallacious (or at least category-confused) when applied to **mind-to-world** attitudes (belief, perception) but potentially valid when applied to **world-to-mind** or **constitutive** attitudes (commitment, institutional trust, promise-keeping).

  ### 3. Relation to Rule-Consequentialism
  Structurally, the argument you are describing is **Rule-Consequentialism applied to Psychology**.
  *   **Act-Consequentialism:** "Does *my* specific distrust cause harm?" (Usually no).
  *   **Rule-Consequentialism:** "What if everyone followed the rule 'Distrust courts when inconvenient'?"

  The problem is that Rule-Consequentialism is typically applied to *actions*, not *internal states*.
  *   **Action:** I can *vote* even if I think my vote doesn't matter, because if everyone did that, democracy fails. This is standard collective action reasoning.
  *   **Attitude:** I cannot easily *believe* something I think is false, even if it helps democracy.

  **The Boundary:** When the argument shifts from "You ought to *act as if*" to "You ought to *feel/believe*," you have entered the phenomenon you identified.
  *   **Legitimate:** "You ought to *comply* with the court ruling for stability."
  *   **The Phenomenon:** "You ought to *trust* the court for stability."

  ### 4. Why it feels distinct from Classic WKR
  You are right to distinguish this from the classic WKR problem (like the demon who threatens to torture you if you don't desire a saucer of mud).
  *   **Classic WKR:** Prudential, self-interested, often external coercion.
  *   **Your Variant:** Moral, altruistic, systemic.

  In recent literature (e.g., **Daniel Star**, **Rachana Kamtekar**), this is sometimes discussed under **The Ethics of Belief** or **Doxastic Responsibility**.
  *   **W.K. Clifford:** "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." (He would reject your phenomenon entirely).
  *   **William James:** "The Will to Believe." (He allows pragmatic reasons for belief in specific "live, forced, momentous" options).

  Your phenomenon is a **Socialized Will to Believe**. It argues that the "momentous option" is societal survival, not individual salvation.

  ### 5. Summary of the Carving
  To answer your request on how to draw the boundaries:

  | Feature | **Standard Collective Action** | **Classic WKR** | **Your Phenomenon (Systemic Attitude Justification)** |
  | :--- | :--- | :--- | :--- |
  | **Target** | Behavior / Action | Internal Attitude | Internal Attitude |
  | **Reason Type** | Coordination / Game Theory | Prudential / Self-Interest | Moral / Systemic Welfare |
  | **Fittingness** | Irrelevant (Action is instrumental) | Ignored (Belief is instrumental) | **Overridden** (Attitude is instrumental) |
  | **Validity** | High (Voting, Recycling) | Low (Pascal's Wager) | **Contested** (Depends on constitutive aim) |
  | **Example** | "Wear a mask to stop spread." | "Believe in God to avoid hell." | "Trust the court to stop anarchy." |

  **When does it stop being this phenomenon?**
  1.  **When it becomes "Acting As If":** If the advice is "Comply with the verdict even if you distrust them," that is standard civic duty, not this phenomenon.
  2.  **When the Attitude is Constitutive:** If the attitude *creates* the fact (e.g., trust in money, trust in marriage vows), then collective reasoning is actually *object-given*. The reason you should trust is that trust is what makes the institution exist.
  3.  **When it is Purely Epistemic:** If the claim is "You should believe the climate data is real because otherwise people won't recycle," that is the purest form of this phenomenon (and generally considered epistemically illicit).

  ### 6. Suggested Terminology
  If you need a label for your own writing or thinking, the most accurate descriptive terms would be:
  *   **Systemic Fittingness Override:** Prioritizing systemic needs over local fittingness.
  *   **Collective Doxastic Consequentialism:** Justifying belief structures by collective outcomes.
  *   **Institutional Faith vs. Epistemic Trust:** Distinguishing between trust based on evidence (epistemic) and trust based on necessity (institutional faith).

  **Verdict:** You have identified a **Systemic State-Given Reason** applied to **Constitutive Attitudes**. It is a recognized tension in social epistemology (specifically in the work of **Miranda Fricker** on trust and **Edward Craig** on the function of knowledge), but it is often glossed over as simply "pragmatic." Your intuition that it is distinct from selfish pragmatism is correct; it is **civic pragmatism**, and it conflicts with the **norm of truth**.

  The "sloppiness" occurs when philosophers or public intellectuals slide from "We need a culture of trust" (sociological claim) to "You should trust this specific instance" (normative claim) without bridging the gap of **local warrant**. That slide is the phenomenon you've spotted.
