      *   **2. Theories Embedded in Change Rules:**
          *   *Immutable/Birth Certificate:* **Biological Essentialism.** Sex is a historical fact (gametes at conception/birth). Cannot change. Gender is epiphenomenal to sex.
          *   *Surgical/Medical Gatekeeping:* **Biological Constructivism / Somatic Alignment.** Gender identity is valid, but legal sex requires bodily conformity. The body must match the mind for the state to recognize the change. Implies sex is primarily anatomical/hormonal.
          *   *Self-Declaration:* **Psychological Internalism / Expressivism.** Gender is an internal sense of self. The state's role is recognition, not verification of biology. Decouples legal sex from biological sex.
          *   *The 'X' Marker:* **Non-Binary Realism (or sometimes Administrative Agnosticism).** Acknowledges the binary is false. *Risk:* Can reify "non-binary" as a third essential sex rather than a rejection of categorization.

      *   **3. The Inconsistency Problem (Agency vs. Agency):**
          *   *Example:* DMV says "Female" (Self-ID), Prison says "Male" (Anatomy), Sports says "Male" (Testosterone/Chromosomes).
          *   *Philosophical Diagnosis:* **Contextual Functionalism.** The state doesn't care about metaphysical truth; it cares about policy goals (safety, fairness, bureaucracy).
          *   *Result:* "Legal Sex" is not a single ontological category but a cluster of distinct legal statuses. This creates a *nominalist* reality (the label is just a name for a specific legal permission) clashing with *realist* expectations (the label describes what I *am*).

      *   **4. Pathways to Coherence (What would a consistent system look like?):**
