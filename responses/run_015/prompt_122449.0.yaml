prompt: |-
  So I got completely nerd sniped by this argument last week and have went back and forth on it maybe six times, so I want a number with the reasoning attached rather than more prose.

  Setup, stated carefully in case I'm misremembering it: a very large number of agents — call it ten million — each face the same one-shot prisoner's dilemma against one anonymous partner. No communication, no reputation, no observation of anyone else, no enforcement, one round, and you never learn how it went. The one extra ingredient is that you're genuinely uncertain about what your own decision procedure is about to output: you know yourself roughly the way you know a friend, so before you've actually decided you'd put maybe 60-70% on "I end up defecting".

  The move is then: conditional on my cooperating, I should raise my credence that agents structurally similar to me cooperate, since whatever it is that makes me cooperate correlates with whatever makes them cooperate. And in a large world that small per-agent correlation doesn't wash out — it gets multiplied across very many agents, while the cost of my cooperating stays fixed and local. So the evidential-utility calculation (I mean the evidential decision theory one: score acts by conditioning on doing them, by what your doing them would tell you about the world, not by what they cause) comes out in favor of cooperating, with room to spare. No shared culture or institutions needed.

  By "works" I mean: in that setup the evidential expected utility of cooperating really is higher, and that gap is a genuine reason for the agent to cooperate rather than a artifact of a decision rule that's broken somewhere else.

  I'm at about 0.5. My housemate, who's much more of a causal decision theory person, is at 0.1 and thinks it's a magic trick with a mirror in it.

  Your number, and the decomposition please. Pieces I'd want seperated: (1) how much rides on evidential decision theory being the right account of instrumental rationality at all; (2) how much on my uncertainty about my own choice being the right *kind* of uncertainty — real, and correlated with other agents' — rather than just a politeness about my own predictability that any agent would have; (3) how much on the large-world scaling actually going through, i.e. the correlation really does get multiplied across agents instead of being something I already fully took into account by knowing I'm in a large world; (4) whether there's a defeater that eats the whole thing — in particular the worry I can't shake that I'm being paid for good news, since my one act doesn't *make* ten million agents cooperate, it only *tells* me they did. Add any term you think I've missed, and say if you think one of mine is bogus. Then combine and give me the number.

  Two more things:

  Where does my disagreement with my housemate most likely live? Is it all in (1), or is someone sitting at 0.1 probably also denying (2) or (3)?

  And the bit I actually care most about, a stress test. Variant: you learn for certain that every other agent's decision was made and sealed a billion years before you existed, so neither your type nor theirs could have influenced the other in any direction, and any correlation comes only from whatever common factors made you similar. Does the argument go through there? And I want you to really bite on this part: if you say yes it still goes through, tell me whether that raises or lowers your confidence in the original, because I genuinely can't tell if it's a sign of strength (it's just a common-cause correlation, that was always the mechanism) or a reductio. If you say no, it breaks there, then tell me what the original was secretly leaning on.

  Last: what single consideration would move your number the most, in either direction?
