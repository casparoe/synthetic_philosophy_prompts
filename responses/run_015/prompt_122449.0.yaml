  **Confidence Number: 0.76**
  (The argument works: the EU gap is real, and it constitutes a genuine reason for cooperation under a functionalist view of agency.)

  ### Decomposition

  **(1) EDT Validity as Instrumental Rationality: Weight 0.60**
  This is the primary hinge. If CDT is the sole norm, the argument fails. However, in Newcomb-like problems (which this is), EDT/FDT outperforms CDT in expected utility across ensembles. The argument "works" if rationality is defined by winning, not by causal purity.
  *Status:* Robust. The setup is a canonical Newcomb problem scaled up.

  **(2) Nature of Self-Uncertainty: Weight 0.05 (Bucket largely bogus)**
  You ask if the uncertainty must be "real" vs. "politeness about predictability." This distinction is metaphysical noise. For the math to hold, you only need *logical uncertainty*: you cannot know your output without computing it. Whether the universe is deterministic is irrelevant; if you don't know the output *yet*, you can condition on it.
  *Status:* Overstated concern. As long as $0 < P(C) < 1$ at decision time, the conditioning holds.

  **(3) Large-World Scaling: Weight 0.15**
  The math is trivial. If correlation $\rho > 0$, total expected utility shift is $N \cdot \rho \cdot \Delta U$. With $N=10^7$, tiny $\rho$ dominates local cost.
  *Status:* Solid. No hidden leakage here.

  **(4) Defeater ("Paying for Good News"): Weight 0.20**
  The CDT objection: "You aren't causing them to cooperate, you're just betting on it." This is the only substantive philosophical defeater. It bites only if you believe rationality requires causal leverage. If you believe rationality is about selecting the best possible world consistent with your algorithm, this is not a defeater, it's a feature.
  *Status:* Resolved by adopting a functionalist view of agency (you are your algorithm, not your token).

  ### Disagreement with Housemate
  **Location:** Primarily **(1)** and **(4)**.
  Your housemate (0.1) is almost certainly a causal purist. They deny that evidential correlations without causal mechanisms can be action-guiding. They view the "EU gap" as an accounting error, not a reason. They are not likely disputing (2) or (3); they accept the math but reject the normativity. To move them, you must argue that CDT agents lose money in Newcomb scenarios, not argue about correlation mechanics.

  ### Stress Test: Pre-Sealed Decisions
  **Scenario:** Decisions sealed 1 billion years ago. No causal influence possible. Only common-cause correlation (similarity).
  **Verdict:** **Yes, the argument still goes through.**
  **Impact on Confidence:** **Raises confidence in the original.**
  **Reasoning:** This removes the "magic trick" suspicion that the original argument relied on ambiguous causal influence. It clarifies that the mechanism is *logical correlation* (selecting a world-type), not *causal propagation*. If the argument survives the removal of all causal leverage, it proves the core claim: rational choice is about what your decision *implies* about the universe, not just what it *changes*. The original argument was secretly leaning on logical correlation; the stress test makes that explicit, strengthening the case.

  ### Single Consideration to Move the Number
  **A Dutch Book Theorem for CDT in Symmetric Games.**
  If you can show that a CDT agent, knowing they are in this specific setup (large $N$, high similarity), would willingly pay to pre-commit to EDT behavior *before* the game starts, but defect *during* the game, they are dynamically inconsistent. Demonstrating that CDT requires self-mutilation to win in this specific class of problems would push my number to 0.95. Conversely, a proof that EDT agents get "money-pumped" in variants where the correlation is spurious (Smoking Lesion style) would lower it to 0.40.
