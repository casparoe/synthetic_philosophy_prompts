answer: |-
  ### Preliminary Diagnostic: The Single-Mechanism Assumption

  Before we enumerate the desiderata, we must clear the conceptual underbrush. In seminar discussions on the meta-problem, there is a pervasive, often unarticulated assumption I call the **Single-Mechanism Assumption**. This is the tacit demand that the cognitive mechanism producing the *judgment* "I am conscious" must be ontologically continuous with the *state* of being conscious.

  Proponents of reductive physicalism often smuggle this in by assuming that if we explain the judgment functionally, we have explained the phenomenon. Proponents of dualism or non-reductive views smuggle it in by assuming that if the judgment cannot be fully explained functionally, the phenomenon must be non-functional. Both sides conflate the *genealogy of the report* with the *ontology of the referent*.

  A rigorous specification of the meta-problem must decouple these. We are not asking for a theory of consciousness *simpliciter*; we are asking for a theory of our *claims* about consciousness. However, because these claims are about consciousness, the theory cannot be entirely independent of the ontology. The tension lies precisely here: **To what extent does explaining the cause of a belief undermine the justification for holding it?**

  Below is the specification of desiderata, structured around your proposed distinction between the Explanatory and Normative meta-problems.

  ---

  ### I. Desiderata for the Explanatory Meta-Problem
  *Goal: To provide a causal-mechanistic account of why intelligent agents generate specific judgments, reports, and intuitions regarding their own consciousness.*

  **1. The Specificity Constraint [NON-NEGOTIABLE]**
  *   **Requirement:** The theory must explain why agents report *phenomenal* consciousness specifically, rather than mere access consciousness or cognitive complexity. It must account for the distinction in the *content* of the judgment (e.g., "It feels like something" vs. "I am processing data").
  *   **Motivation:** A theory that explains why agents report "I am computing" fails the meta-problem. The hard problem exists because of the specific *qualitative* character of the reports. If the mechanism produces generic self-monitoring outputs, it has not addressed the target phenomenon.
  *   **Tension:** High. Cognitive science architectures (e.g., Global Workspace) naturally model access and reporting. Modeling the specific *phenomenal* content of the report without presupposing phenomenal properties is the central technical hurdle.

  **2. The Architectural Compatibility Constraint [CAMP-SPECIFIC PREFERENCE]**
  *   **Requirement:** The mechanism generating the judgment must be implementable within standard cognitive architectures (e.g., predictive processing, global neuronal workspace, hierarchical control systems) without requiring novel, non-physical causal powers.
  *   **Motivation:** For naturalists, a meta-problem solution that requires a "homunculus" or a non-physical judge is a non-starter. It pushes the problem back one step.
  *   **Status:** This is non-negotiable for physicalists and illusionists, but rejected by substance dualists or those positing fundamental panpsychist proto-judgments.
  *   **Tension:** Moderate. Some phenomenological accounts argue that standard architectures inherently distort the first-person perspective, making this constraint a source of error rather than a virtue.

  **3. The Evolutionary Plausibility Constraint [NON-NEGOTIABLE]**
  *   **Requirement:** The theory must offer a plausible evolutionary genealogy for why the capacity to make phenomenal judgments was selected for, or how it arose as a byproduct of selected traits.
  *   **Motivation:** If the judgment of consciousness is universal among humans, it must have a biological history. A theory that treats it as a random glitch without evolutionary context is incomplete.
  *   **Tension:** High. If the judgment is useful (e.g., for social modeling), it suggests the judgment tracks something real (Normative support). If it is a useless byproduct (spandrel), it weakens the claim to truth (Normative undermining).

  **4. The Error-allowance Constraint [CAMP-SPECIFIC PREFERENCE]**
  *   **Requirement:** The theory must specify whether the mechanism is capable of producing false positives (judging one is conscious when one is not) or false negatives.
  *   **Motivation:** Illusionists require the possibility of error to claim the "hard problem" is a cognitive illusion. Realists often argue that first-person phenomenal judgments are immune to certain kinds of error.
  *   **Status:** Critical divergence point. Illusionists treat this as non-negotiable (the mechanism *must* allow error). Phenomenological realists treat the *impossibility* of error here as non-negotiable.

  ---

  ### II. Desiderata for the Normative Meta-Problem
  *Goal: To evaluate the epistemic status of the agents making these judgments. Are they rationally entitled to believe their reports track reality, irrespective of the physical explicability of that reality?*

  **1. The Truth-Tracking Constraint [NON-NEGOTIABLE]**
  *   **Requirement:** The theory must specify the relationship between the judgment "I am conscious" and the fact of consciousness. Does the judgment covary with the fact?
  *   **Motivation:** Without a specified link between belief and fact, we cannot determine if the agents are rational. If the judgment is causally decoupled from the phenomenon, the agents are deluded.
  *   **Tension:** Extreme. This is where the Explanatory and Normative problems collide. If the Explanatory account is fully physicalist, does it force a decoupling (because the physical cause doesn't entail the phenomenal fact)?

  **2. The First-Person Authority Constraint [CAMP-SPECIFIC PREFERENCE]**
  *   **Requirement:** The theory must preserve the intuition that the subject has a privileged epistemic position regarding their own consciousness compared to third-party observers.
  *   **Motivation:** Our ordinary epistemic practices rely on this authority. Denying it requires a radical revision of our concept of knowledge.
  *   **Status:** Non-negotiable for phenomenologists and many non-reductive physicalists. Explicitly rejected by illusionists and strict behaviorists who view first-person authority as a social heuristic rather than an epistemic fact.
  *   **Tension:** High. Explaining first-person authority via physical mechanisms (Explanatory) often reduces it to a functional confidence signal, which undermines the *normative* weight of that authority.

  **3. The Defeasibility Constraint [NON-NEGOTIABLE]**
  *   **Requirement:** The theory must identify under what conditions, if any, the judgment "I am conscious" would be rationally defeasible.
  *   **Motivation:** A belief that cannot be defeated by any evidence is dogmatic, not rational. A rigorous meta-problem solution must define the boundaries of rational entitlement.
  *   **Tension:** Moderate. If the judgment is based on immediate acquaintance (phenomenology), it may be indefeasible. If it is based on inference (cognitive science), it is defeasible. The meta-problem theory must declare which it is.

  **4. The Autonomy of the Normative Constraint [NON-NEGOTIABLE]**
  *   **Requirement:** The theory must clarify whether the normative entitlement depends on the success of the Explanatory Meta-Problem.
  *   **Motivation:** Can we be entitled to believe in consciousness even if we cannot explain *why* we believe it? (Analogous to knowing logic is valid even if we can't fully explain the neural basis of logical reasoning).
  *   **Tension:** Critical. If Normative entitlement *depends* on Explanatory success, then failure to physically explain the judgment mechanism undermines the rationality of believing in consciousness. If they are independent, the Hard Problem remains intact even after the Meta-Problem is solved.

  ---

  ### III. Tension Sets and Joint Unsatisfiability

  This is the core of your conceptual mapping. The following sets of desiderata create friction that may render a unified theory impossible.

  **Tension Set A: The Self-Undermining Loop**
  *   **Conflict:** *Explanatory Error-allowance* (Illusionist preference) vs. *Normative Truth-Tracking*.
  *   **Analysis:** If the Explanatory account demonstrates that the judgment mechanism is a heuristic prone to error (e.g., a "user illusion" interface), this directly attacks the Normative Truth-Tracking constraint.
  *   **Unsatisfiability:** You cannot simultaneously hold that the mechanism is designed to produce useful fictions (Explanatory) and that the agents are rationally entitled to believe those fictions are literal truths (Normative).
  *   **Resolution Path:** One must either accept that agents are *not* entitled (Error Theory) or argue that the "illusion" is merely conceptual, not phenomenal (Deflationism).

  **Tension Set B: The Mechanism vs. Authority Clash**
  *   **Conflict:** *Architectural Compatibility* (Physicalist preference) vs. *First-Person Authority* (Phenomenological preference).
  *   **Analysis:** Standard cognitive architectures treat self-reports as data streams subject to noise, delay, and reconstruction. Phenomenological authority requires immediacy and incorrigibility.
  *   **Unsatisfiability:** A complete mechanistic explanation of the judgment tends to normalize it as just another cognitive output, stripping it of its special normative status.
  *   **Resolution Path:** Argue that authority is a functional role within the system (compatibilism) or that standard architectures are insufficient to model the source of the judgment (non-reductivism).

  **Tension Set C: The Explanatory-Normative Independence Question**
  *   **Conflict:** *Evolutionary Plausibility* vs. *Normative Autonomy*.
  *   **Analysis:** If the Explanatory account shows the judgment evolved for social signaling (Evolutionary Plausibility), evolutionary debunking arguments suggest we are not Normatively entitled to trust it as a guide to metaphysics (undermining Autonomy).
  *   **Unsatisfiability:** A robust evolutionary explanation of the *utility* of the judgment often implies the judgment was selected for *fitness*, not *truth*.
  *   **Resolution Path:** Argue for a convergence of fitness and truth in this specific domain, or accept that the judgment is practically rational but theoretically unjustified.

  **Crucial Determination:** Does solving the Explanatory Meta-Problem solve the Normative one?
  *   **Verdict:** **No.** They are logically distinct. A perfect Explanatory account (e.g., "This specific neural circuit generates the report 'I feel qualia'") is compatible with three Normative outcomes:
      1.  **Realism:** The circuit detects a real property. (Entitlement preserved).
      2.  **Illusionism:** The circuit generates a false model. (Entitlement denied).
      3.  **Pragmatism:** The truth value is irrelevant; the report is a valid move in a language game. (Entitlement redefined).
  *   **Implication:** A theory can be adequate for the Explanatory Meta-Problem while failing the Normative Meta-Problem, and vice versa. Most current literature claims to solve the Meta-Problem but implicitly assumes solving the Explanatory automatically dissolves the Normative (the "Single Mechanism Assumption" again). This is a category error.

  ---

  ### IV. Brief Scorecard Against Major Camps

  **1. Physicalist Dissolution Strategies**
  *   **Explanatory Performance:** High. Fits well with Architectural Compatibility and Evolutionary Plausibility.
  *   **Normative Performance:** Low. Struggles with First-Person Authority and Truth-Tracking without redefining "consciousness" to mean "access."
  *   **Primary Tension:** Must convince agents they are mistaken about the content of their own judgments (violating Specificity Constraint from the agent's perspective).

  **2. Illusionist Accounts**
  *   **Explanatory Performance:** Very High. Embraces the Error-allowance Constraint. Explains the "Hard Problem" intuition as a cognitive bug.
  *   **Normative Performance:** Hostile. Explicitly denies Normative entitlement to the belief in phenomenal properties.
  *   **Primary Tension:** High risk of self-refutation. If the mechanism producing the illusionist theory is the same as the one producing the illusion, why trust the theory?

  **3. Phenomenological Accommodationist Views**
  *   **Explanatory Performance:** Low/Mixed. Often rejects Architectural Compatibility (standard cognitive science is seen as objectifying).
  *   **Normative Performance:** Very High. Preserves First-Person Authority and Truth-Tracking.
  *   **Primary Tension:** Struggles with Evolutionary Plausibility. If the phenomenal judgment is irreducible, how did it evolve without being causally efficacious in a physical world?

  ### Summary for Seminar Evaluation

  When evaluating any specific account in your seminar, apply this filter:
  1.  **Decouple:** Does the author distinguish between explaining the *cause* of the judgment and validating the *truth* of the judgment?
  2.  **Locate:** Do they prioritize the Explanatory Meta-Problem (science of the report) or the Normative Meta-Problem (epistemology of the report)?
  3.  **Identify the Sacrifice:** Which desideratum are they violating to make their model work? (e.g., An Illusionist sacrifices First-Person Authority; a Dualist sacrifices Architectural Compatibility).
  4.  **Check for Smuggling:** Are they claiming that solving the Explanatory problem *automatically* resolves the Normative problem? If so, flag the Single-Mechanism Assumption.

  This framework should allow you to map the logical space without getting bogged down in the metaphysics of consciousness itself, keeping the focus strictly on the adequacy of the meta-explanation.
