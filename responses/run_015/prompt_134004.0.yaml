  3.  **Evaluate the Claims:**
      *   *Trivial:* "History is sometimes useful" -> Too weak for the scene.
      *   *False:* "Destroying documents creates truth" -> Factually wrong.
      *   *Defensible:* "Unchecked memory paralyzes action." -> Nietzschean core.
      *   *Radical:* "Critical history requires destruction." -> This is the archivist's justification.

