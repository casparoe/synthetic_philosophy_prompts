      *   "Monuments, archives, and executions of the past": Refers to Nietzsche's three modes of history (Monumental, Antiquarian, Critical).
      *   "Wrong dosage they become diseases": Excess history stifles life/action.
      *   **Action:** Burning records (Antiquarian/Critical overlap).
      *   **Spectrum of Claims:**
          1.  *Trivial:* Too much history is boring/unmanageable. (Platitude)
