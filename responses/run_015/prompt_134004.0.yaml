      *   The most compelling reading for a novelist is the Nietzschean one: Life requires both memory *and* forgetting. The "disease" is historical sickness (inability to act). The archivist isn't just hiding secrets; she's pruning dead weight to allow new growth. This is defensible philosophically, even if morally ambiguous in practice.

