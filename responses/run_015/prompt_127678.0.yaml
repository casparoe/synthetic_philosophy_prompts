answer: |-
  It is cold this morning. That is appropriate. Dad hated the idea that death should be warmed up with soft words. He spent twenty years volunteering on this prairie, not because he loved the scenery, but because he liked the work of things growing over other things. He asked for no service, no funeral, and no attempt to make this look like anything other than what it is: a group of people standing under a picnic shelter, holding a box, trying to figure out what comes next.

  I know many of you are waiting for me to say he is at peace. I cannot say that. Peace is a state of mind, and on his reading of the texts he loved, there is no mind left to hold the state. I know some of you want to say he has returned to the source. I cannot say that either. He spent his career arguing that the *Zhuangzi* is not a mystical book about souls dissolving into a cosmic whole. He hated the word "mystic" so much he nearly threw a copy of a translation across the dining room when he saw it on the cover. He thought that was a Victorian invention, smuggled in to make ancient Chinese philosophy feel like a Sunday sermon.

  So what do we say? If we cannot say he is watching us, and we cannot say he is gone, what remains?

  His argument, the one he hammered out over dinner while the rest of us tried to eat our potatoes, was that transformation is literal. When he died, he did not go anywhere. He became available. He becomes soil. He becomes ants. He becomes the grass we are standing on. There is a story in the text he loved where Zhuangzi says he does not care if crows eat his body or ants eat his body; why favor the ants over the crows? Dad liked that story. He thought it was funny. He thought the worry about proper burial was a kind of selfishness, a insistence that the body remain a boundary marker for a self that no longer exists.

  I know this is difficult. My uncle Ray has sent me a verse he wants honored, and I know he finds comfort in the promise of resurrection. I have former graduate students of Dad's standing here who know the texts better than I do, and who will wince if I simplify the philosophy to make it palatable. I have my sister, who is angry that anyone would try to turn Dad's death into a lesson about acceptance. She is right. He was not a lesson. He was a man who argued loudly about translation choices and laughed when the arguments got absurd.

  So I am not going to ask you to accept his philosophy. I am not going to ask you to feel serene. He thought serenity was suspicious. He thought the proper response to the dissolution of the self was curiosity. If the boundary between "him" and "not-him" is loosening, then the question is not "where is he?" but "what is happening here?"

  That is why we are here, on this prairie. Not to send him off, but to notice what takes him in.

  When a friend of his died last spring, Dad did not hold a vigil. He went out and looked for a sedge wren. He said that was the work. So I am asking you to do that now. When we finish here, do not go straight to your cars. Walk the trail. Look for something alive that was not here before. It might be a wren. It might be a beetle working over a piece of wood. It might be the way the light hits the big bluestem grass.

  If you are religious, you can see that as creation. If you are a materialist, you can see it as transformation. If you are just sad, you can see it as a distraction. Dad would not mind which lens you use. He only minded the lie that nothing changes. Something is changing right now. The ashes are going into the ground. The grass is going to take them up. The birds are going to eat the seeds the grass produces.

  He is not at peace. He is not watching. He is becoming this place. And if you listen closely, without trying to force a meaning onto it, you might hear him laughing at the absurdity of us standing here in the cold, trying to speak for him, when he would much rather we just watched the birds.

  Thank you.

