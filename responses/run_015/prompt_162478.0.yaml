          *   *Actually, let's keep it simple.* **A Dinner Party.** You have a table (flats). You have food (budget). If you invite too many, everyone goes hungry (Mo). But you can get a bigger table, and guests might bring wine (Endogenous/Rowers).
          *   *No, let's go with the **"Foster Care"** analogy.* It's socially resonant. You don't take more children than you can care for, but the limit is about *care*, not *survival of the foster parents*.
          *   *Let's refine the "Better Analogy" to: A **Community Housing Trust**.* It fits the "flats" aspect perfectly.

  4.  **Refining the Tone:**
