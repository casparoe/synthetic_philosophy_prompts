      *(Better Analogy Selection)*: The user tried "Lifeboat towing a raft" and "Workshop". I need to beat those. How about a **"School"**? Fixed classrooms (flats), teachers (volunteers). You can't have 50 kids in one class, but 25 is fine. If you add more classes, you need more teachers. But the school doesn't sink.
