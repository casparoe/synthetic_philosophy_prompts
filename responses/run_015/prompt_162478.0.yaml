          *   *Decision:* The **"Community Garden"** is the most accessible for a geography teacher. Plots are fixed (flats), water is limited (budget), but more gardeners (volunteers/refugees) can expand the cultivated area *up to a point*.
          *   *Wait, I need to check the "Workshop" idea again.* The user said "boat that's also a workshop."
          *   *Let's try:* **A Relay Race.** You have a set number of runners (volunteers). You can pass the baton to more people (refugees becoming volunteers).
