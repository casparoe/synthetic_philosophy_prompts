      *   **User (Singer):** Resource scarcity is relative (disposable income). Moral obligation outweighs minor comfort loss. Capacity is flexible.
      *   **The Reality:** Community sponsorship is neither a closed lifeboat nor an infinite pond. It's a dynamic social system.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the debate, set the purpose (audit the analogy).
      *   **Correspondence Table:** Map Hardin's terms to the Sponsorship Group's reality.
          *   Lifeboat -> The Group/Committee.
          *   Berths -> Available flats/host families/budget.
          *   People in water -> Refugee families needing resettlement.
          *   Rations -> Volunteer time, funding, emotional energy.
