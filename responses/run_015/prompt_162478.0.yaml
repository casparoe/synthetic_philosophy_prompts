answer: |-
  **To:** The Sponsorship Committee
  **From:** [Your Name]
  **Subject:** Audit of the 'Lifeboat' Analogy for Capacity Planning

  **1. The Correspondence Table**
  Mo's argument relies on Garrett Hardin's 'Lifeboat Ethics'. To test it, we must map the metaphor against our actual situation.

  | Hardin's Lifeboat Element | Mo's Interpretation | Our Actual Situation |
  | :--- | :--- | :--- |
  | **The Lifeboat** | The Sponsorship Group | The Group (volunteers + committee) |
  | **Berths/Seats** | Fixed number of flats/host homes | Fixed housing stock (for now) |
  | **People in the Water** | Global refugee population | Families referred to us by the Home Office |
  | **Rations** | Food/Water for survival | Budget, volunteer hours, emotional energy |
  | **The Coastguard** | External rescue (does not come) | Government funding/support (unreliable) |
  | **The Voyage** | Finite trip to safety | Indefinite settlement (3+ years) |
  | **Risk** | The boat sinks (everyone dies) | Burnout / Financial deficit / Failed settlements |

  **2. Where the Mapping Breaks**
  The lifeboat metaphor is compelling because it suggests a hard physical limit. However, three critical disanalogies undermine Mo's conclusion that we *must* stop at two families to avoid catastrophe.

  *   **Physics vs. Morale:** A lifeboat sinks due to displacement (physics). A volunteer group 'sinks' due to burnout (psychology). We can stretch capacity further than physics allows if morale remains high.
  *   **Passengers vs. Crew:** In Hardin's essay, passengers are dead weight. In our scheme, resettled families often become volunteers, translators, or donors within 12–18 months. They add rowing power, not just weight.
  *   **Fixed vs. Flexible Capacity:** A lifeboat's size is fixed at launch. Our capacity is 'endogenous' (created from within). Committing to more families often triggers an influx of new volunteers and donations that were previously dormant.

  **3. Addressing the Three Objections Raised**
  During our discussion, three points were raised that the lifeboat analogy cannot accommodate:

  1.  **Capacity expands with commitment:** Evidence from other groups shows that announcing a third family often unlocks the funding and volunteers needed for it. The lifeboat assumes the hull cannot grow; ours can.
  2.  **Refugees as contributors:** Hardin assumes those in the water consume resources only. Our past families have contributed skills (e.g., teaching, maintenance) that reduce the burden on the core team.
  3.  **Arbitrary Borders:** The 'water' isn't a natural disaster; it is a political border. Deciding who is 'in the boat' (UK) vs 'in the water' (abroad) is a policy choice, not a geographical fact. This weakens the idea that we are merely reacting to natural scarcity.

  **4. Assessing the Assumptions**
  *   **Mo's Assumption (Hardin):** Assumes we are already on subsistence rations. That taking on a third family means *no* family gets enough support.
  *   **My Assumption (Singer):** Assumes the boat has no limit. That taking on more families only costs us 'comfort' (takeaways/holidays).

  **The Reality:** We are neither starving nor infinite. We are in a zone of **diminishing returns**. Adding a third family costs more than the second, not because the boat sinks, but because the 'easy' volunteers and funds are already used.

  **5. Verdict: Does 'Two Families Properly' Survive?**
  Mo's conclusion survives, but not for Mo's reasons.
  *   **Mo's Reason:** "If we take more, we all drown." **False.** We will not drown; the group will not cease to exist.
  *   **Revised Reason:** "If we take more, the *quality of care* drops below an acceptable standard." **True.**
  The argument is not about *survival of the group*, but about *duty of care to the families*. If stretching to five families means none get adequate support, we fail them. But this is a management risk, not a physical inevitability.

  **6. A Better Analogy: The Foster Care Agency**
  The lifeboat implies survival of the fittest. A **Foster Care Agency** is a more accurate model.
  *   **The Constraint:** An agency has a limited number of approved homes (flats) and social workers (volunteers).
  *   **The Risk:** If they take too many children, the *quality of care* suffers. The children might not thrive. But the agency itself does not sink.
  *   **The Goal:** The aim is successful adulthood (integration), not just staying afloat.
  *   **The Flexibility:** Agencies recruit more foster carers (volunteers) based on demand.

  **Recommendation for Sunday**
  We should reject the 'Lifeboat' language. It suggests a binary choice between life and death. Instead, we should frame the decision as a **Capacity vs. Quality of Care** assessment. We can commit to more than two families *if* we can demonstrate that the 'Foster Care' standard of support remains intact. The limit is not the hull of the boat; it is the bandwidth of our care.
