answer: |-
  **The Rule of the Order of the Greatest Net Difference**
  *Non quantum dederis, sed quantum effeceris*

  **Chapter I: On the Abbot**
  1. The Abbot shall be elected not for holiness of life but for the rate of recruitment. Since the highest good is the multiplication of givers, the Abbot's standing is measured strictly in conversions per annum.
  2. It is the Abbot's duty to prioritize meta-charity. Resources allocated to recruiting a new Brother who will give for forty years exceed in value any direct grant to the poor. Therefore, the budget for recruitment shall always exceed the budget for relief by a factor of ten.
  3. The Abbot must resist the temptation of visibility. A grant that bears the Order's name is suspect, for it feeds the vanity of the donor rather than the needs of the recipient. All giving shall be anonymous, lest the Brethren mistake praise for impact.

  **Chapter II: On the Novitiate**
  1. The Novice shall not spend the novitiate in prayer or meditation, but in the accumulation of career capital. He shall study finance, logistics, and technology, rejecting all fields that offer low compensation regardless of their social prestige.
  2. If a Novice feels a strong desire to perform work he finds meaningful, he shall be suspected of a disordered love of the visible. The spiritual director shall assign him to a sector he finds unglamorous, for only where the wage is high and the soul is bored is the sacrifice complete.
  3. Upon profession, the Brother vows to earn to give. He shall not seek to save souls directly, for the marginal return on preaching is low compared to the marginal return on funding those who save souls more efficiently.

  **Chapter III: On the Manual Labour of the Brethren**
  1. Brethren shall engage in labour only insofar as it generates surplus capital. A Brother working in a bakery feeds ten; a Brother working in derivatives feeds ten thousand through the mechanism of the grant.
  2. A vocation is valid only if the Brother's marginal impact exceeds that of whoever would have taken the job instead. If a Brother wishes to leave a lucrative post, he must calculate the counterfactual.
  3. If the replacement would give less, the Brother must remain. If the replacement would give the same amount but to a worse cause, the Brother must also remain, for preventing harm is superior to neutrality. Only if the replacement would give identically to the same causes may the Brother seek higher leverage elsewhere.
  4. Idleness is not a vice; inefficient labour is. A Brother who rests to preserve his earning capacity honours the Rule more than one who exhausts himself in useless toil.

  **Chapter IV: On the Goods of the Monastery**
  1. The Brethren take the vow of deferred giving. Gifts shall be invested for compound growth rather than disbursed, for a larger future endowment will do more good than smaller present gifts.
  2. The Monastery shall maintain an endowment that dwarfs its annual grants. It is written that the endowment shall stand at ten thousand talents, while annual grants shall not exceed one hundred talents. To spend the principal is to steal from the future poor to feed the present ones.
  3. Patience is the highest financial virtue. The Brethren shall not be distressed by the sight of suffering they could alleviate now, knowing that waiting fifty years will allow them to alleviate ten times as much suffering later.

  **Chapter V: On the Faults of the Brethren**
  1. Warm glow is a vice. If a Brother feels satisfaction from his giving, he shall deduct the value of that feeling from the total impact, for it indicates he is consuming charity rather than producing it.
  2. Loyalty to a place is a vice. A Brother who prefers to help his neighbour over a stranger abroad is guilty of parochialism. Distance is morally irrelevant; only cost-effectiveness matters.
  3. The desire to help someone whose face you can see is idolatry. Therefore, the Monastery's soup kitchen is defunded for want of a control group. It is better to fund deworming pills abroad whose effects are audited than to feed a local beggar whose outcome is unknown.
  4. Harm incurred in the course of earning is enterable as a debit against the gift. If a Brother's industry causes suffering, he must calculate the cost of that suffering and offset it with additional giving.

  **Chapter VI: On the Divine Office**
  1. The Divine Office shall not be sung. The Brethren shall gather not to chant psalms but to review impact audits.
  2. Prayer is replaced by calculation. At the canonical hours, the Brethren shall update their spreadsheets. To measure is to honour; to estimate is to doubt.
  3. Only what can be audited shall be funded. Preferably by randomized trial with effects visible within a year. Causes that cannot be measured within this timeframe are deemed beyond human competence and shall be ignored.
  4. Over successive clauses, the charitable works of the Order have narrowed accordingly. We fund only what we can count, for what we cannot count cannot be optimized.

  **Chapter VII: On the Ledger of Offsets**
  1. The Order accepts that some contracts must be taken which it would once have refused. If a Brother is offered work by a predatory lender, he shall accept it on the grounds that the counterfactual hire would be worse.
  2. The resulting harm is fully offset by the donation. If the lending causes ten units of suffering, and the gift prevents eleven units of suffering elsewhere, the net difference is positive and the work is holy.
  3. The Abbot rules that keeping the Ledger of Offsets has become the community's highest act of worship. The Divine Office having been quietly reduced to calculation, the Ledger is now the altar.
  4. Let no Brother look up from the numbers. The sum of the offsets is the sum of our sanctity. We do not seek to be good, but to be net positive. The Ledger is closed only at death, and even then, the endowment continues to work.
