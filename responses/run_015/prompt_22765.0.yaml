  **Mistakes & Areas for Improvement:**
  *   **Definition of Bootstrapping:** The student writes, "Bootstrapping is the problem that we can't use a method to check whether the method is reliable." This is slightly backwards. Bootstrapping is the *argument* that shows certain theories (like reliabilism) imply we *can* gain knowledge this way. The "problem" is that this result is counterintuitive, not that the method is prohibited.
