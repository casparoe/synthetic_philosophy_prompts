      *   *Weakness:* Hard to distinguish in early theory development.

  *   **3. Historical Error:** "History is littered with beautiful false theories. How do you account for error?"
      *   *Reply:* Humean taste admits fallibility. False beauty is pruned by empirical friction over time. The standard evolves; today's elegance must survive tomorrow's data. Error is part of the calibration process. We learn from the pruning. It's self-correcting. The community remembers past failures of elegance.
      *   *Weakness:* Requires long temporal horizons to validate.

  *   **4. Evolutionary Mismatch:** "If evolution shaped this taste, why trust it for counter-intuitive domains like quantum mechanics?"
      *   *Reply:* Evolution shaped general pattern-recognition, not specific physical intuitions. We extend these cognitive tools metaphorically. The 'discipline' corrects naive evolutionary biases through mathematical rigor. We aren't trusting instincts, but trained instincts refined by data. The math acts as a filter for biological bias.
      *   *Weakness:* Relies on speculative cognitive science claims.

  *   **5. Redundancy:** "Isn't this just 'simplicity' rebranded to sound fancier?"
      *   *Reply:* Simplicity is syntactic economy; beauty includes structural unity and explanatory scope. You can have simple ugly theories. My account captures the normative force simplicity lacks in theory choice. It explains why we prefer unified fields over patchworks. Beauty signals deep structural identity.
      *   *Weakness:* Distinction between syntax and structure is often blurry.

  *   **6. Normative Force:** "When sensibilities diverge, how does this guide actual choice?"
      *   *Reply:* It doesn't offer an algorithm. It frames the disagreement as a calibration issue, prompting deeper scrutiny of assumptions rather than forcing premature closure. It manages dissent, not eliminates it. This preserves scientific integrity during crises. It allows suspension of judgment without abandoning rationality.
      *   *Weakness:* Offers no decision procedure for urgent disputes.

  *   **Hope Nobody Asks:** "Can you name a specific recent case where appealing to beauty led physics astray, and how your standard would have prevented it?" (This exposes lack of predictive power in your own framework regarding specific historical failures.)
