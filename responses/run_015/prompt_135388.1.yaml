      *   *Requirement 5: The Egoist Endorsement Constraint (The Tension).*
          *   Must be endorsable by a rational egoist without collapsing into altruism.
          *   Reasoning: Glaucon asks why *I* should be just. If the answer is "because others matter," Glaucon says "sure, but why should *I* care?" If the answer is "because it benefits *me*," it risks becoming prudential, not moral.
