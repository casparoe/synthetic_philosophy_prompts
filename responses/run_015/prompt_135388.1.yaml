  # Specification: The Glauconian Compliance Standard

  To answer Glaucon's challenge in *Republic* Book II, a moral theory cannot merely explain why societies form or why virtue is pleasant. It must demonstrate that justice is choiceworthy for the agent even when stripped of all instrumental value. The following desiderata define the necessary conditions for a successful theory.

  ## I. Core Test Cases

  A valid theory must generate a decisive reason for action in the following three scenarios. Failure in any single case indicates the theory reduces morality to prudence, psychology, or social signaling.

  ### 1. The Ring of Gyges (Objective Invisibility)
  *   **The Case:** The agent can commit injustice with zero probability of detection, zero risk of punishment, and zero loss of reputation.
  *   **The Reasoning:** This is the baseline control. It isolates morality from external sanction. If the theory cannot prescribe justice here, it admits justice is merely a compromise between the power to do harm and the fear of suffering it.
  *   **Status:** **Non-Negotiable.**

  ### 2. The Reverse Ring (Subjective Invisibility)
  *   **The Case:** The agent is under total surveillance, but possesses a justified false belief that they are invisible. They act based on the belief that no one will know.
  *   **The Reasoning:** This tests the locus of normativity. If the reason to be moral relies on *actual* observation (shame/social pressure), the agent fails. If the reason relies on *belief* about observation (prudential risk assessment), the agent fails. The theory must provide a reason that holds under the agent's internal description of the act ("I am unobserved") regardless of external reality. It proves the motive is internalized normativity, not fear or shame.
  *   **Status:** **Non-Negotiable.**

  ### 3. The Causal Null / Epistemic Trace
  *   **The Case:** The agent performs a moral action (e.g., keeping a promise) that has no causal impact on anyone's welfare (the beneficiary didn't need the help), but the action is fully known to others (epistemically traceable).
  *   **The Reasoning:** This separates *signaling* from *substance*. Glaucon argues we seek justice for the rewards (reputation). Here, the agent secures the reputational reward without the causal cost of actually helping. If the theory says this is sufficient, it reduces morality to reputation management. If the theory says the agent still had a duty to act (or that the act was worthless despite the reputation), it clarifies whether morality is about outcomes or principles. A Glaucon-proof theory must demand the act be done for its own sake, not for the signal.
  *   **Status:** **Non-Negotiable.**

  ## II. Structural Requirements

  ### 1. The Action/Character Distinction
  *   **Requirement:** The theory must provide a reason for the **specific moral act** distinct from the reason to **cultivate a moral character**.
  *   **Reasoning:** Many theories dodge Glaucon by arguing that a virtuous person wouldn't *want* to act unjustly. This conflates psychology with normativity. Glaucon grants the agent *does* want to act unjustly. The theory must explain why the agent should refrain even when character cultivation is complete and the desire to transgress is present.
  *   **Status:** **Non-Negotiable.**

  ### 2. The Zero-Reputation Binding
  *   **Requirement:** The obligation must remain binding even when reputational gain is explicitly removed.
  *   **Reasoning:** If the force of the obligation scales with social visibility, the theory is descriptive sociology, not normative ethics.
  *   **Status:** **Non-Negotiable.**

  ## III. The Critical Tension (Camp Preferences vs. Hard Constraints)

  This is the failure point for most systems. You must navigate the following tension without collapsing.

  *   **Constraint A (Egoist Endorsement):** The reason to act morally must be endorsable by a rational egoist. It must show why justice is "good for me."
  *   **Constraint B (Non-Prudential Binding):** The reason cannot reduce to self-interest. If justice is only "good for me" because it benefits me, Glaucon wins (justice is not good in itself, only its fruits are).
  *   **The Tension:** If you satisfy A too well, you collapse into prudential rationality (Instrumentalism). If you satisfy B too well, you fail to answer Glaucon's specific question ("Why should *I* do it?").
  *   **Status:** **Critical Tension.** A successful theory must redefine "rationality" or "self" to reconcile these. It is not a checkbox but a structural hurdle.

  ## IV. Theory Scoring

  ### 1. Contractualism (e.g., Hobbes, Gauthier)
  *   **Gyges:** **Fail.** If detection is impossible, the contract offers no leverage. The rational move is to defect.
  *   **Reverse Ring:** **Fail.** Action depends on the agent's belief about enforcement. If they believe they are hidden, defection is rational.
  *   **Causal Null:** **Fail.** If no one is harmed/benefited, the contract is not triggered.
  *   **Action/Character:** **Pass.** Focuses on act-based compliance.
  *   **Tension:** **Collapses.** Satisfies Egoist Endorsement by sacrificing Non-Prudential Binding. It proves justice is prudence, not morality.
  *   **Verdict:** Does not answer Glaucon; concedes to him.

  ### 2. Virtue Ethics (e.g., Aristotle, Plato)
  *   **Gyges:** **Pass (Conditional).** Justice is constitutive of flourishing (*eudaimonia*).
  *   **Reverse Ring:** **Pass.** The virtuous agent acts from habit/disposition regardless of belief about observation.
  *   **Causal Null:** **Mixed.** Focuses on the agent's state rather than the act's outcome. May struggle to explain why the act matters if it helps no one.
  *   **Action/Character:** **Fail.** Blurs the distinction. Argues that if you truly have the virtue, you won't want to act unjustly. Dodges the "why refrain when I want to" question.
  *   **Tension:** **Struggles.** Satisfies Non-Prudential Binding but risks failing Egoist Endorsement unless "flourishing" is accepted as self-interest, which circles back to prudence.
  *   **Verdict:** Answers the spirit but dodges the specific mechanism of the challenge.

  ### 3. Kantian Rationalism (Deontology)
  *   **Gyges:** **Pass.** Duty is categorical, independent of consequences or detection.
  *   **Reverse Ring:** **Pass.** Duty binds based on rational law, not epistemic state regarding observation.
  *   **Causal Null:** **Pass.** The maxim matters, not the causal outcome.
  *   **Action/Character:** **Pass.** Clearly distinguishes duty (act) from virtue (strength of will).
  *   **Tension:** **Fail (by Glaucon's lights).** Satisfies Non-Prudential Binding completely but rejects Egoist Endorsement. It tells the egoist "you should do it because it's right," not "because it's good for you."
  *   **Verdict:** Meets the moral spec but refuses the egoist framing of the challenge.

  ## Summary Specification
  To fully answer Glaucon, a theory must adopt the **Kantian binding strength** (Non-Negotiables) while solving the **Virtue Ethics identity problem** (showing why the act benefits the agent without reducing to prudence). Current frameworks typically sacrifice the Egoist Endorsement constraint to preserve moral integrity. A complete solution requires a metaphysics where moral rationality and practical rationality are identical, not competing interests.
