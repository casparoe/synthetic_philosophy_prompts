  ### **Instructor Notes (For your defense if asked)**

  **1. The Part (b) Swap (Constitutive vs. Circumstantial)**
  *   **Why the deduction:** In exegesis questions, terminology is part of the knowledge being tested. Nagel's specific distinction is that *Constitutive* is internal (who you are) and *Circumstantial* is external (what you face). The student provided the correct *examples* for the definitions they gave, but the definitions were swapped relative to the text.
  *   **Defensibility:** If a student identifies a Utilitarian as a Kantian but describes them consistently, they still get the mark wrong. They have misidentified the concept. I deducted 3 marks here (1.5 per swapped category).

  **2. The Part (d) "Consequentialist" Claim**
  *   **Why the deduction:** This is a fundamental misreading of Williams. Williams's project in *Moral Luck* is to show that the "Morality System" (which includes Consequentialism) fails to capture ethical life. Gauguin's justification is about the success of a *ground project* constituting a meaningful life, not about producing the best state of affairs.
  *   **Defensibility:** This error changes the entire interpretation of Williams's project. It suggests the student thinks Williams is offering a rival normative theory (Consequentialism) rather than a meta-ethical critique of the "Control Principle." I deducted heavily here (3 marks) because it undermines the answer to the second half of the prompt.

  **3. The Part (d) "Rational at the Time" Claim**
  *   **Why the deduction:** Williams emphasizes the *uncertainty*. If Gauguin could calculate the justification at the time, it wouldn't be moral luck; it would be risk assessment. The "luck" is that the justification is unavailable until after the fact.
  *   **Defensibility:** The prompt asks what the retrospectiveness *consists in*. Saying the reason is available at the time contradicts the definition of retrospectiveness. (2 marks deducted).

  **4. Ambiguity Flag (Part a)**
  *   **Note:** The student writes "there isn't one fact of the matter." Nagel is a realist about the paradox. He believes we are objectively stuck in a contradiction, not that blame is subjective. I did not deduct marks for this as it can be read charitably as a reference to the "View from Nowhere" distinction, but it borders on a misinterpretation of Nagel's skepticism.

  ### **Concrete Advice for the Student (To include in feedback)**
  1.  **Check the Taxonomy:** In Part (b), you swapped Constitutive and Circumstantial. Make a flashcard for these: Constitutive = Constitution (who you are); Circumstantial = Circumstances (where you are).
  2.  **Watch the "Isms":** Be very careful labeling historical figures. Williams is famously anti-system. Before calling him a consequentialist, ask: "Is he arguing for maximizing good outcomes, or for the integrity of the agent?"
  3.  **Timing of Justification:** In the Gauguin case, distinguish between *reasons for acting* (which he had) and *justification for the life* (which only comes later). Williams's point is that the latter cannot validate the former until the end.
