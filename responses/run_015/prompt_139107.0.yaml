answer: |-
  **The Case**

  The UN Office for Outer Space Affairs (UNOOSA) is reviewing a discretionary budget allocation of $50 million from its administrative surplus. A newly characterized near-Earth object, 2024-KX, will pass through a gravitational keyhole in 2029. Orbital mechanics, constrained by radar astrometry to within 5 meters and governed by gravitational constants known to 15 decimal places, indicate that passing through this specific 40-centimeter window within the 600-kilometer uncertainty ellipse will lock the object into a resonant orbit guaranteeing a collision in 2046. The physical probability of traversing that specific window is exactly 1 in 15 billion ($6.6 \times 10^{-11}$). A kinetic impactor mission funded by this surplus would shift the trajectory enough to miss the keyhole entirely. If the impact occurs, it causes global civilization collapse, terminating all future human generations. If the mission is funded, the $50 million is lost to other administrative uses; if not, the money remains, but the risk persists. There are no side effects, no signaling value, and no epistemic uncertainty regarding the orbital model.

  **The Arithmetic**

  Let $V$ be the value of the future human population lost to extinction. Standard longtermist estimates place the potential number of future person-years at roughly $10^{20}$ (assuming Earth remains habitable for $10^9$ years with a sustainable population of $10^{11}$). Let the certain cost $C$ be the opportunity cost of the $50 million, equivalent to saving approximately 10,000 lives (or 500,000 person-years) via immediate global health interventions.

  *   **Expected Value (Fanatic):** $EV = (6.6 \times 10^{-11} \times 10^{20}) - 5 \times 10^5 \approx 6.6 \times 10^9$ person-years. The verdict is **Act**.
  *   **Probability Truncator:** Sets a credence floor at $10^{-9}$ (one in a billion). Since $6.6 \times 10^{-11} < 10^{-9}$, the probability is treated as zero. $EV = 0 - 5 \times 10^5$. The verdict is **Don't Act**.
  *   **Value Capper:** Accepts the probability but caps the value of population at the current carrying capacity ($\approx 10^{10}$ lives). $EV = (6.6 \times 10^{-11} \times 10^{10}) - 5 \times 10^5 \approx 0.66 - 500,000$. The verdict is **Don't Act**.

  Both anti-fanatics recommend letting the $50 million sit while accepting a 1 in 15 billion chance of human extinction. To a reflective intuition, this looks like negligence.

  **The Honest Bit**

  This is not a win for fanaticism about tiny probabilities; it is a win for the independent claim that **potential future populations carry astronomical value**. The feature doing the work is the *magnitude of the stake*, not the *weighting of the probability*. If you delete the future generations and restrict the value to the current 8 billion people (approx. $6 \times 10^{11}$ person-years remaining), the expected value drops to $\approx 0.04$ person-years. Against a cost of 500,000 person-years, even the fanatic must say **Don't Act**. The "sane verdict" only supports the fanatic because your intuition accepts the longtermist premise that losing the future is uniquely catastrophic.

  The single feature such that deleting it collapses this case straight back into Pascal's Mugging is the **physically-grounded lower bound on credence**. In the Mugging, the probability is testimonial and vulnerable to model error (the mugger might be lying). Here, the probability is derived from physical constants and orbital mechanics where model error is stipulated away. Without that physical grounding, the anti-fanatic's reply—"your credence in this scenario is itself less than 1 in a billion"—becomes decisive.

  The anti-fanatic's best reply is not to attack the math, but to attack the intuition: *"Your judgment here isn't driven by decision theory; it's driven by a deontological constraint against extinction risk that you are disguising as expected value. You aren't actually maximizing; you're lexicographically ordering 'survival' above 'welfare.' If you admit that, you don't need fanaticism; you just need a different axiology."*

  **Coda**

  If the choice is offered a million times independently (e.g., a million distinct keyholes over a century), the cumulative probability of at least one impact rises to $\approx 10^{-4}$ (1 in 10,000). The truncating theorist still ignores each individual bet because each $p < 10^{-9}$. Consequently, they ignore a cumulative 1 in 10,000 risk of extinction. This is a strong argument against truncation: it renders the agent vulnerable to "death by a thousand cuts," failing to aggregate risks that are individually below threshold but collectively catastrophic. It suggests truncation is not a stable policy for sequential decision-making, whereas the fanatic's linearity handles the aggregation naturally.
