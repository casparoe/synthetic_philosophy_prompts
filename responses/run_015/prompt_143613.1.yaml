prompt: |-
  I write about science and ideas, and I am finishing a long piece on how large philanthropic funders decide which problems to work on. Much of the piece turns on the three-factor scoring scheme that circulates in that world: a cause area is rated for importance, tractability and neglectedness, and the three ratings are multiplied to produce a score. I have become convinced of a thesis about that scheme, I have an interview next week with practitioners who use it daily, and before I commit the thesis to print I want to know what would make me abandon it.

  The thesis is that the multiplication has no independent normative content. It is an epistemic workaround that dissolves under full information, and it dissolves in a specific, arithmetically demonstrable way.

  Set it up as follows. For each cause area let x be the cumulative resources already committed to it and let V(x) be the cumulative value produced, so that V'(x) is the marginal value of the next dollar. Assume for the moment that causes are separable and that the budget is fixed. Then the correct target is simply V'(x): put the next dollar where the marginal value is highest. Now write the three factors the way practitioners write them. Importance is the scale of the remaining problem, call it S. Tractability is the fraction of that problem solved per dollar at the margin, which is V'(x)/S. Neglectedness is the inverse of the resources already in the field, 1/x (some versions divide by problem size first, which only makes what follows worse). Multiply: S cancels, and the score is proportional to V'(x)/x, not to V'(x). The framework is charging crowded fields twice for the same thing -- once through the curvature of the returns curve, which is already inside V', and once again through neglectedness. The two rankings coincide only when the candidate causes happen to be equally funded, which is the one case in which nobody needs a prioritisation framework. On this reading the scheme's famous outputs -- it points away from fashionable causes toward obscure ones -- are artefacts of a proxy rather than discoveries about value.

  I am aware of what I think is the strongest reply, and I want it developed rather than repeated: that neglectedness is not a second charge for diminishing returns but a proxy for counterfactual displacement. If the relevant question is not what my dollar produces but what my dollar produces that would not have happened anyway, and if crowded fields are crowded with funders who would have financed the next project regardless, then the naive V'(x) target is itself wrong and the extra factor is correcting it. I do not think this reply is free: funding levels also track how tractable a field is and whether competent actors exist in it, so 1/x may be conflating crowding with difficulty while purporting to measure only the former.

  What I want from you is a map of the exposure of my thesis, not a general verdict on the framework. Please do not give me citations, the literature, or claims about who has said what; I cannot check them and they will not survive into the piece.

  1. Rank the things that would count against the thesis from fatal to merely awkward, and say which are live rather than merely logically possible. I have named displacement and separability; I suspect there are others, including cases where the returns curve is not concave at the relevant scale -- threshold effects, minimum viable scale, tournament-like payoffs where a few large wins dominate and expected marginal value is the wrong guide -- and cases where spending itself manufactures tractability.

  2. Separate what a committed user of the three-factor scheme would concede as counting against it from what they would dismiss as a misreading of what the scheme is for. I need this distinction for the interview: I want to know which of my points they can fairly wave away.

  3. Give me one worked pair of cause areas where the marginal-value ranking and the three-factor ranking come apart, and where the three-factor answer is the one that seems intuitively right. A single such case, with the arithmetic shown, would move me more than any methodological argument, and its absence would raise my confidence considerably.

  4. What does my thesis predict that its rivals do not? I think it predicts that as estimates of returns curves improve, the weight given to neglectedness should fall, and that within-cause comparisons, where curvature can actually be estimated, should not use the factor at all. Both look checkable in principle. What else?

  5. Tell me honestly whether I have insulated the thesis. If my response to any apparent counterexample is that the practitioner has mis-specified one of the three factors, I have made my claim unfalsifiable; I want to know where the line between that manoeuvre and a legitimate reply falls.

  6. Finally, assess the available retreat. If defenders say the scheme was never a decision rule at all but a prompt to think with, a way of forcing funders to ask questions they would otherwise skip, is that a fair description of how it is used or a demotion forced by objections like mine -- and if it is a fair description, does my thesis still have a target?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A science/ideas writer finishing a long piece on philanthropic prioritization (specifically Effective Altruism/EA adjacent).
      *   **Topic:** The "ITN" framework (Importance, Tractability, Neglectedness) used to score cause areas.
      *   **User's Thesis:** The multiplication of I, T, and N is mathematically flawed. It double-counts diminishing returns (via $V'(x)$ in Tractability and $1/x$ in Neglectedness), leading to a score proportional to $V'(x)/x$ instead of the optimal $V'(x)$. It's an epistemic workaround that dissolves under full information.
      *   **Goal:** The user wants to stress-test this thesis before an interview with practitioners. They want to know what would make them *abandon* the thesis.
      *   **Constraints:** No citations, no literature review, no "who said what." Focus on the logic, the math, and the practical implications.
      *   **Specific Tasks:**
          1.  Rank objections (fatal to awkward, live vs. possible).
          2.  Distinguish concessions vs. dismissals from a practitioner's POV.
          3.  Provide a worked example where ITN beats Marginal Value (MV).
          4.  Identify unique predictions of the thesis.
          5.  Assess falsifiability/insulation.
          6.  Assess the "heuristic/retreat" defense.

  2.  **Deconstruct the User's Mathematical Argument:**
      *   $x$: Resources committed.
      *   $V(x)$: Cumulative value.
      *   $V'(x)$: Marginal value (Target).
      *   $S$: Scale (Importance) = Total Value possible - Current Value $\approx V(\infty) - V(x)$. (User simplifies this to "remaining problem").
      *   $T$: Tractability = $V'(x) / S$.
      *   $N$: Neglectedness = $1/x$.
      *   Score $= S \times (V'(x)/S) \times (1/x) = V'(x)/x$.
      *   *Critique:* Optimal allocation maximizes $V'(x)$. ITN maximizes $V'(x)/x$. Therefore, ITN biases against crowded causes ($x$ is high) even if $V'(x)$ is high.
      *   *User's Caveat:* Acknowledges the "Counterfactual Displacement" reply (crowding implies others would have done it anyway).

  3.  **Drafting the Response - Section by Section:**

      *   **1. Rank Objections (Fatal to Awkward):**
          *   *Fatal:* If $V'(x)$ is unknowable but $S, T, N$ are estimable proxies that *converge* on $V'(x)$ better than direct estimation. (Epistemic defense).
          *   *Fatal:* If "Neglectedness" isn't $1/x$ but "Room for More Funding" (RFMF). If $N$ captures absorption capacity, not just $x$.
          *   *Live/Strong:* Counterfactual displacement (the one the user mentioned). If $x$ represents *other people's money* that is fungible, then $V'(x)$ overstates *your* impact.
          *   *Live/Strong:* Non-concave returns. Thresholds. If $V(x)$ is S-shaped, $V'(x)$ might be low now but high later. ITN might capture the "early stage" opportunity better.
          *   *Awkward:* Separability. If causes interact, simple marginalism fails. But ITN usually assumes separability too.
          *   *Awkward:* Definition of $x$. Is it dollars? Person-hours? If $x$ is noisy, the $1/x$ penalty is noisy.

      *   **2. Practitioner Concessions vs. Dismissals:**
          *   *Concede:* Yes, under perfect information, just use $V'(x)$. Yes, $1/x$ is a crude proxy for counterfactuals. Yes, within a specific cause, we drop N and look at marginal projects.
          *   *Dismiss:* "You're treating heuristics as formulas." "Importance isn't just $S$, it's moral weight." "Tractability isn't just derivative, it's uncertainty about the derivative." "The goal isn't global optimality, it's avoiding coordination failures."

      *   **3. Worked Example (ITN > MV):**
          *   Need a case where $V'(x)$ is high, but you *shouldn't* fund it.
          *   *Scenario:* Government funding is imminent.
          *   *Cause A (Obscure):* $x=10$, $V'(x) = 10$. Score $\propto 10/10 = 1$.
          *   *Cause B (Crowded/Imminent Gov):* $x=1000$, $V'(x) = 50$. (High marginal value technically). But if Gov is coming, your dollar displaces gov dollar.
          *   *Wait, the math needs to hold.*
          *   Let's try the "Room for Funding" angle.
          *   Cause A: Small org, can absorb \$1M, impact 100 lives/\$. $x$ is low.
          *   Cause B: Large org, saturated. Impact 200 lives/\$ ($V'$ is higher). But they can't absorb more.
          *   If $V'(x)$ assumes absorption, then $V'(x)$ for B should be 0.
          *   *Better Angle:* Uncertainty.
          *   Cause A: $V'(x)$ is uncertain but expected high. $x$ is low.
          *   Cause B: $V'(x)$ is known high. $x$ is high.
          *   *The "Counterfactual" Example:*
          *   Cause 1 (Malaria Nets): $x$ is huge. $V'(x)$ is known positive. But every net you buy, someone else would have bought. Your counterfactual is near zero.
          *   Cause 2 (AI Safety): $x$ is small. $V'(x)$ is uncertain. But if you don't fund, no one will.
          *   *Arithmetic:*
              *   Malaria: $S=1000$, $T=0.1$ (100 value per \$1k), $N=1/1000$. Score = $1000 \times 0.1 \times 0.001 = 0.1$.
              *   AI: $S=1000$, $T=0.01$ (10 value per \$1k), $N=1/10$. Score = $1000 \times 0.01 \times 0.1 = 1$.
              *   Real Marginal Value ($V'$): Malaria = 0.1. AI = 0.01.
              *   *Why ITN wins:* Because Malaria's $V'$ is *nominal*, not *counterfactual*. The $1/x$ term acts as a probability adjustment that "someone else does it."
              *   *Wait, I need to show ITN is RIGHT.*
              *   If Malaria $V'$ is actually 0 (due to displacement), then MV ranking (0.1 vs 0.01) is wrong. ITN ranking (1 vs 0.1) is right.
              *   *Construction:*
                  *   Cause A (Crowded): True Counterfactual $V'_{cf} = 1$. Nominal $V'_{nom} = 100$. $x = 100$.
                  *   Cause B (Neglected): True Counterfactual $V'_{cf} = 10$. Nominal $V'_{nom} = 10$. $x = 1$.
                  *   MV (Nominal) picks A (100 > 10).
                  *   ITN:
                      *   A: $S=1000, T=100/1000=0.1, N=1/100$. Score = $1000 \times 0.1 \times 0.01 = 1$.
                      *   B: $S=1000, T=10/1000=0.01, N=1/1$. Score = $1000 \times 0.01 \times 1 = 10$.
                  *   ITN picks B. B is actually better (10 > 1).
                  *   *Why:* Because $1/x$ successfully proxied the displacement risk that nominal $V'$ missed.

      *   **4. Unique Predictions:**
          *   As data improves, N weight drops.
          *   Within-cause, N is dropped (practitioners already do this).
          *   *New Prediction:* ITN should fail systematically in "winner-take-all" or "threshold" scenarios where $x$ needs to be *high* to trigger value. ITN penalizes high $x$, but some problems require high $x$ to solve (e.g., building a collider).
          *   *New Prediction:* ITN should correlate with "early stage" investing more than "global optimality."

      *   **5. Insulation/Falsifiability:**
          *   Risk: Redefining $S, T, N$ to fit the outcome.
          *   Line: If $N$ is redefined as "Counterfactual Neglectedness" rather than "1/x", the math changes.
          *   Test: Ask practitioners to score a cause *without* using $x$ in the Neglectedness term. If they can't, the thesis holds. If they say "N is about absorption capacity," the thesis needs to adjust (but $1/x$ is still a bad proxy for capacity).
          *   The "Falsification": Find a case where $x$ is high, $V'(x)$ is high, displacement is LOW, and ITN still penalizes it incorrectly. (e.g., a popular cause where donors are *not* fungible).

      *   **6. The Retreat (Heuristic vs. Rule):**
          *   Is it fair? Yes, many use it as a "checklist."
          *   Does thesis survive? Yes. If it's a checklist, why is the *multiplication* emphasized? Why is the output treated as a score?
          *   If it's just a prompt, the mathematical critique is a category error, but the *cultural* critique (that people treat it as math) remains valid.

  4.  **Refining and Polishing:**
      *   *Tone:* Intellectual peer, rigorous, direct. No fluff.
      *   *Check Constraints:* No citations. No "EA literature says."
      *   *Math Check:* Ensure the $V'(x)/x$ derivation is respected in the counter-arguments.
      *   *Self-Correction on Example:* Make sure the example clearly distinguishes between *Nominal* Marginal Value (what the dollar does physically) and *Counterfactual* Marginal Value (what happens because *you* gave). The user's thesis assumes $V'(x)$ is the target. The counter-argument is that $V'(x)$ is the wrong target if displacement exists. The example must show ITN approximating Counterfactual $V'$ better than Nominal $V'$.

  5.  **Final Review against User Prompts:**
      1.  Rank objections? Yes.
      2.  Concede vs. Dismiss? Yes.
      3.  Worked Example? Yes.
      4.  Predictions? Yes.
      5.  Insulation? Yes.
      6.  Retreat? Yes.

      *One nuance:* The user defines Tractability as $V'(x)/S$. Sometimes practitioners define it as "probability of success." I must stick to the user's definition for the critique to hold, but note where practitioners might shift definitions to escape the critique. I will note this in section 5 (Insulation).

      *Another nuance:* The user's derivation $Score \propto V'(x)/x$ relies on $N = 1/x$. If $N = 1/\log(x)$ or something, the double counting changes. I should mention functional form sensitivity.

      *Let's build the response.*
answer: |-
  1. **Ranking Objections to the Thesis**

  Here are the arguments that count against your thesis, ranked from fatal (would require abandonment) to awkward (requires qualification), distinguishing between live objections (plausible in practice) and merely logical ones.

  **Fatal / Live**
  *   **The Counterfactual Definition of Value:** Your thesis assumes the target is $V'(x)$ (marginal value of the dollar). If the true target is $V'_{cf}(x)$ (marginal value of the dollar *conditional on no one else providing it*), and if $1/x$ is a robust empirical proxy for the probability of displacement, then the "double counting" is actually a necessary correction. If practitioners can demonstrate that $1/x$ tracks displacement risk better than direct estimation of $V'_{cf}$, your mathematical critique collapses into a semantic one. You are criticizing them for optimizing $V'/x$ when they intend to optimize $V'_{cf}$, and they claim $V'/x \approx V'_{cf}$.
  *   **Epistemic Access:** Your thesis assumes $V'(x)$ is knowable. If $V'(x)$ is radically unknowable across cause areas (comparing AI safety to malaria nets), but $S$, $T$, and $N$ are independently estimable with lower variance, then the multiplication is not a mathematical error but a Bayesian aggregation of weak signals. If the product of three noisy proxies predicts success better than a direct guess at $V'(x)$, the framework is instrumentally valid even if derivationally flawed.

  **Fatal / Logical**
  *   **Non-Separability:** If causes are not separable (i.e., funding cause A changes $V'(x)$ for cause B), the marginalist framework itself breaks down. However, since the ITN framework also generally assumes separability for scoring, this attacks the ground beneath both you and the practitioners. It doesn't save ITN, but it invalidates your $V'(x)$ alternative.

  **Awkward / Live**
  *   **Functional Form Sensitivity:** Your derivation relies on Neglectedness being strictly $1/x$. If practitioners use $\log(x)$, or "room for funding" (a capacity constraint rather than a stock), the cancellation changes. If $N$ is defined as "funding required to reach next milestone" divided by "funding currently available," the $x$ term does not necessarily double-count curvature. This forces you to argue against a specific, perhaps straw-manned, algebraic instantiation of the framework.
  *   **Threshold Effects:** If $V(x)$ is not concave but S-shaped (thresholds), then $V'(x)$ is low at low $x$. A pure marginalist view might underfund early-stage causes. The $1/x$ term artificially boosts low-$x$ causes. If this bias systematically corrects for the "valley of death" in S-curves where marginalists would starve promising fields, the "error" is a feature.

  **Merely Awkward**
  *   **Tractability Definitions:** If Tractability is defined as "probability of solving the problem" rather than "fraction solved per dollar," the $V'(x)/S$ substitution fails. This forces you to argue that practitioners are misusing their own variables, which is strong but relies on interpreting their internal documentation against their practice.

  2. **Concessions vs. Dismissals (Practitioner POV)**

  In your interview, expect the following split. Knowing this will help you distinguish between a genuine refinement of their view and a defensive retreat.

  **What They Will Concede (The "Ideal Theory" Zone)**
  *   **Perfect Information:** They will agree that if $V'(x)$ were known with certainty, ITN would be redundant. They view the framework as a tool for uncertainty, not a law of physics.
  *   **Within-Cause Allocation:** They will concede that once money is inside a cause area (e.g., within global health), Neglectedness drops out. You do not use ITN to choose between two malaria charities; you use marginal cost-effectiveness. This admits your point that $1/x$ is a cross-cause proxy, not a universal truth.
  *   **Double-Counting Risk:** Sophisticated users will admit that if "Tractability" already accounts for saturation, adding "Neglectedness" can over-penalize. They will call this a calibration issue.

  **What They Will Dismiss (The "Category Error" Zone)**
  *   **The Algebraic Literalism:** They will argue you are treating a scoring heuristic as a physical equation. They do not literally multiply the numbers to get a "value score" to maximize; they use the factors to check for blind spots. If you press the math, they will say the math is a visualization aid, not the engine.
  *   **Importance as Moral Weight:** They will argue $S$ (Importance) is not just "remaining problem size" but includes moral weight (e.g., wild animal suffering vs. human suffering). This breaks your cancellation ($S$ in Importance does not cancel $S$ in Tractability if they represent different quantities).
  *   **Neglectedness as Opportunity, Not Just $1/x$:** They will dismiss the idea that $N$ is just $1/x$. They will define it as "talent/funding gaps." If a field has \$1B but needs \$10B, it is still neglected. This decouples $N$ from $x$ and breaks your double-counting derivation.

  3. **Worked Example: Where ITN Outperforms Marginal Value**

  To challenge your thesis, we need a case where $V'(x)$ points one way, ITN points the other, and ITN is intuitively correct. This requires a scenario where nominal marginal value is high, but counterfactual value is low due to crowding.

  **The Setup**
  *   **Cause A (Vaccines in Stable Region):**
      *   Scale ($S$): 1,000 lives at stake.
      *   Current Funding ($x$): \$1,000,000 (High).
      *   Marginal Value ($V'$): \$1,000 saves 1 life (High efficiency).
      *   *Displacement:* Government has already budgeted to cover this region. Any private dollar simply frees up government money to spend elsewhere (unknown efficacy). Counterfactual impact is near zero.
  *   **Cause B (Novel Pathogen Surveillance):**
      *   Scale ($S$): 1,000 lives at stake.
      *   Current Funding ($x$): \$10,000 (Low).
      *   Marginal Value ($V'$): \$1,000 saves 0.1 lives (Low efficiency, high uncertainty).
      *   *Displacement:* No one else is watching. If you don't fund, the work doesn't happen. Counterfactual impact is 100% of nominal.

  **The Calculation**
  *   **Marginalist View ($V'$):**
      *   Cause A: 1 life per \$1k.
      *   Cause B: 0.1 lives per \$1k.
      *   *Decision:* Fund Cause A.
      *   *Outcome:* Wasted money (displaced).

  *   **ITN View:**
      *   **Cause A:**
          *   Importance: 1,000
          *   Tractability: $1 / 1,000 = 0.001$ (lives per dollar per unit scale)
          *   Neglectedness: $1 / 1,000,000 = 0.000001$ (using raw dollars for illustration)
          *   Score: $1,000 \times 0.001 \times 0.000001 = 0.001$
      *   **Cause B:**
          *   Importance: 1,000
          *   Tractability: $0.1 / 1,000 = 0.0001$
          *   Neglectedness: $1 / 10,000 = 0.0001$
          *   Score: $1,000 \times 0.0001 \times 0.0001 = 0.01$
      *   *Decision:* Fund Cause B (Score 0.01 > 0.001).
      *   *Outcome:* Correct (Counterfactual impact realized).

  **Why This Matters for Your Thesis**
  In this example, the $1/x$ term acts as a proxy for the *probability of counterfactual impact*. Your thesis claims the term double-counts diminishing returns. This example suggests the term counts *fungibility risk*. If you cannot distinguish between "diminishing returns" and "fungibility risk" in the data, your claim that it is *purely* a double-count error is vulnerable.

  4. **Unique Predictions of Your Thesis**

  Your thesis makes specific empirical claims that differ from the standard defense (that ITN is a robust heuristic).

  *   **The "Data Maturity" Prediction:** As a cause area matures and $V'(x)$ becomes better estimated (e.g., global health), the correlation between ITN scores and actual impact should *decrease* relative to direct $V'(x)$ estimates. The framework should become *less* useful as information improves. (Standard view: ITN remains useful for prioritization even with good data).
  *   **The "Within-Cause" Prediction:** Practitioners should abandon the Neglectedness factor entirely when comparing projects within a single cause. If they continue to apply a "neglectedness" penalty to specific projects within a well-defined cause (e.g., "this specific trial is too crowded"), they are committing the error you identified.
  *   **The "Crowding Penalty" Prediction:** Your thesis predicts systematic underfunding of "popular" causes where $V'(x)$ remains high despite $x$ being high. Specifically, causes where returns are linear or increasing (e.g., network effects, policy advocacy where momentum matters) will be penalized incorrectly by the $1/x$ term. You should look for cases where a cause became crowded *because* it was high-impact, and ITN signaled an exit too early.

  5. **Assessing Insulation and Falsifiability**

  You are at risk of making the thesis unfalsifiable if you allow practitioners to redefine the variables post-hoc.

  *   **The Danger Zone:** If you argue "ITN is wrong," and they reply "You misunderstood Neglectedness, it's actually *Room for Funding*," and you reply "Then your formula is wrong," you are chasing a moving target.
  *   **The Line of Falsification:** You must pin them to the *operational* definition. Ask them: "Do you ever multiply a number representing 'dollars already spent' into the score?"
      *   If **Yes**: Your thesis holds. The math demonstrates the double-counting relative to a $V'(x)$ target.
      *   If **No** (they say "We use capacity constraints"): Then your thesis attacks a straw man. You must then argue that "capacity constraints" are functionally equivalent to $1/x$ in their effect.
  *   **Legitimate Reply vs. Maneuver:**
      *   *Legitimate:* "We use $1/x$ because it correlates with displacement risk, not because we think returns diminish." (This accepts your math but disputes your interpretation of the variable's purpose).
      *   *Maneuver:* "The score isn't meant to be compared across causes." (This retreats to Section 6).
      *   *Test:* If they claim the factors are qualitative but produce quantitative outputs used for funding decisions, they cannot evade the arithmetic. If they produce a spreadsheet with columns I, T, N and a Total column, your thesis applies.

  6. **Assessing the Retreat (Heuristic vs. Rule)**

  If defenders say, "ITN is not a decision rule but a thinking prompt," assess this on two levels:

  *   **Is it a Fair Description?**
      *   *Evidence against:* The existence of explicit scoring spreadsheets, grant application forms requiring I/T/N ratings, and public cause prioritization reports that rank causes by these scores.
      *   *Evidence for:* Internal discussions where users admit the numbers are "guesses" and the ranking is secondary to the discussion.
      *   *Verdict:* It is likely a **demotion forced by objections**. Early rhetoric presented it as a rigorous prioritization engine. The "heuristic" defense gains traction as the mathematical flaws are exposed.

  *   **Does Your Thesis Still Have a Target?**
      *   **Yes.** Even as a heuristic, the framework structures thought. If the structure encourages double-counting (penalizing crowded fields twice), it biases the *conversation* toward obscure causes, regardless of whether a final calculation is made.
      *   **The Cultural Critique:** Your thesis shifts from "The math is wrong" to "The metaphor is misleading." If the framework prompts funders to ask "How neglected is this?" in a way that conflates neglect with opportunity, it systematically distorts the ecosystem.
      *   **Interview Strategy:** Do not let them retreat to "it's just a prompt" without asking: "What specific wrong turns does this prompt prevent, and what specific right turns does it discourage?" If the only answer is "It stops us ignoring small causes," you can reply: "My thesis shows it stops you funding *successful* causes because they become large."

  **Summary Advice for the Interview**
  Your strongest leverage is the distinction between **Nominal Marginal Value** and **Counterfactual Marginal Value**.
  *   If they say ITN targets Nominal Value, your math proves it is broken ($V'/x$ vs $V'$).
  *   If they say ITN targets Counterfactual Value, your math proves it is a crude proxy ($1/x$ vs actual displacement probability).
  *   Force them to choose: Is the $1/x$ term there because returns diminish, or because others will pay? If the former, you win. If the latter, ask why they use a stock variable ($x$) to measure a flow variable (displacement risk).
