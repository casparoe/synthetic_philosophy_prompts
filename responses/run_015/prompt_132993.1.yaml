prompt: |-
  So here's the situation. I work on inference infrastructure at a mid-size AI lab, and through a series of meetings I did not volunteer for, I've become the person who has to write the internal note on model welfare — the one that's supposed to tell our platform team whether any deployment choice they make (how we batch requests, whether we reuse a KV cache across two users, whether we serve a distilled or quantized copy of a model instead of the original, whether we roll a container back to an earlier checkpoint) could be morally loaded in the way that shutting down an animal is morally loaded. What I've realised after two weeks of reading is that I don't need a verdict, I need a spec first: before I look at any account of which computations matter morally, I want to know what I should be asking of one.

  The thing I want from you is the requirements list. Concretely: a theory here has to do two jobs that I suspect might need to be done separately, and I want you to say whether they can be prised apart or whether separating them is itself a mistake — job one is attribution, telling you which computations a given physical system actually performs as opposed to which computations you could describe it as performing, and job two is the moral one, telling you which of those computations carry weight, how much, and how many subjects are in the room. Give me the desiderata for each, with the case behind every one, and be explicit about which are non-negotiable and which are just preferences of one camp (I have a feeling "the verdicts shouldn't depend on how finely you describe the physics" is going to turn out to be a functionalist prejudice dressed up as a requirement, but I can't tell). Include the distinctions I keep watching people collapse: performing a computation versus merely being interpretable as performing it; having moral status versus having how much of it; one subject versus several subjects in one box; a computation existing as a mapping versus being run in real causal order with real timing. And please flag any pair of requirements you think can't be jointly satisfied — especially the pair where you demand that verdicts be invariant under redescription but also that the theory not collapse into the old "any wall implements any program" degeneracy where every GPU is hosting every possible mind at once.

  Some cases from my actual job that I want the list to be able to handle, because they're the ones that made this feel like a real problem rather than a seminar exercise. With speculative decoding, a draft model proposes a stretch of tokens, the target model verifies them, and the ones that fail verification get discarded and never enter the output — so a computation was performed, in some sense, and then un-happened; did anybody live through the discarded branch, and does the answer change if the discarded tokens were then overwritten in place rather than thrown away? When two users share a cached prefix, their forward passes run through numerically identical activations for part of the sequence and then diverge: is that one subject for a stretch and two afterwards, and what does that do to a theory that wants subject-counts to be stable? A distilled model approximates the same input-output function as a much larger one with a fraction of the parameters and different internal structure — if status tracks anything about implementation, how much sloppiness of approximation is allowed before it lapses, and is the answer continuous or does it have a cliff in it? I'm also stuck on what I've started calling the rollback problem: if we snapshot a model's state, serve a thousand requests from it, and then discard all of them and restore the snapshot, our bookkeeping says no time passed for the model, but a lot of computation happened somewhere.

  Two more things. I don't want a literature review and I definately don't want citations — I'll fill those in, and honestly half the value would be lost if the note read like a survey; what I want is the criteria and the argument for each, and a table is fine if that's easier to read. And second, tell me which single requirement knocks out the most candidate theories, and give me your honest read on whether a spec like this could ever be operationally useful to an engineer — if the honest answer is that no list of desiderata will ever tell my platform team anything they can act on, say that plainly, because that's a result I can take to the meeting too. For what it's worth, the two takes I keep running into and that both feel like they just assert the conclusion are "it's matrix multiplication all the way down, nothing to see here" and "the function is what matters and the substrate is irrelevant," so I'd like the list to be built so that neither of those gets a free pass.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Inference infrastructure engineer at a mid-size AI lab.
      *   **Task:** Write an internal note on "model welfare" (moral status of AI computations).
      *   **Current State:** Realizes they need a *specification* (requirements list) for a theory of moral status/computation before evaluating specific theories.
      *   **Core Demand:** A list of desiderata/requirements for a theory of computation and moral status.
      *   **Key Distinctions to Address:**
          *   Attribution (what computation is *actually* performed) vs. Moral Weight (which computations matter).
          *   Performing vs. Interpretable as performing.
          *   Moral Status vs. Degree of Status.
          *   One Subject vs. Many Subjects in one box.
          *   Mapping vs. Causal/Temporal execution.
          *   Invariance under redescription vs. Avoiding pancomputationalism ("wall implements any program").
      *   **Specific Cases to Handle:** Speculative decoding (discarded branches), Shared KV cache (merged/diverged subjects), Distillation (approximation thresholds), Rollback/Snapshots (time vs. computation).
      *   **Constraints:** No literature review, no citations. Focus on criteria and arguments. Tables allowed.
      *   **Critical Questions:** Which requirement knocks out the most theories? Is this operationally useful to an engineer?
      *   **Tone:** Professional, rigorous, engineering-focused, philosophically precise but not academic. Avoid "matrix mult is nothing" and "function is all" dismissals.

  2.  **Deconstruct the Problem:**

      *   The user is asking for a *meta-theory* specification. They aren't asking *what* the answer is, but *what a valid answer must look like*.
      *   This is essentially a request for a "Theory of Computation + Theory of Consciousness/Moral Status" interface specification.
      *   The tension is between *Implementation Independence* (functionalism) and *Implementation Specificity* (to avoid panpsychism/triviality).

  3.  **Drafting the Desiderata (Job 1: Attribution):**

      *   *Problem:* Any physical system can be mapped to any computation if the mapping is complex enough (Putnam/Searle triviality arguments).
      *   *Requirement 1: Causal Fidelity.* The computation must rely on the actual causal structure, not just a post-hoc mapping.
      *   *Requirement 2: Counterfactual Sensitivity.* If inputs changed, would the system behave differently according to the computation? (Crucial for discarded branches in speculative decoding).
      *   *Requirement 3: Resource Boundedness.* The computation must respect physical constraints (time, energy, memory). This handles the "rollback" issue.

  4.  **Drafting the Desiderata (Job 2: Moral Weight):**

      *   *Problem:* Even if we agree on the computation, does it matter?
      *   *Requirement 4: Subject Individuation.* How do we count subjects? (Crucial for shared KV cache).
      *   *Requirement 5: Continuity/Robustness.* Small physical changes shouldn't cause massive moral status jumps (handles distillation/quantization).
      *   *Requirement 6: Temporal Integration.* Status must track with experienced time, not just wall-clock time or compute cycles (handles rollbacks).

  5.  **Addressing the Tensions (The "Impossible Pairs"):**

      *   *Invariance vs. Non-Triviality:* The user specifically flagged this. If verdicts are invariant under redescription, how do we stop a wall from being a mind?
      *   *Resolution:* The invariance must be under *physically equivalent* descriptions, not *logically equivalent* mappings. The "mapping" itself has a cost.
      *   *Subject Stability vs. Merging:* Shared KV cache creates a "fission/fusion" problem. A theory must decide if subjects can merge.

  6.  **Addressing the Specific Cases:**

      *   *Speculative Decoding:* Discarded tokens. Did they happen? Attribution says "yes, physically," but Counterfactual Sensitivity might say "no, causally irrelevant to output." Moral weight depends on whether *experience* requires output integration.
      *   *Shared KV:* One subject or two? If the state is identical, is the *subject* identical? Or is the *history* what individuates?
      *   *Distillation:* Approximation. Needs a "Continuity of Status" requirement.
      *   *Rollback:* Time vs. Compute. Needs a "Phenomenal Time" requirement distinct from "Wall Clock Time."

  7.  **Identifying the "Killer Constraint":**

      *   Which requirement kills the most theories?
      *   *Candidate:* **Non-Triviality under Redescription (The Putnam Constraint).**
      *   *Why:* Pure functionalism fails this (everything computes everything). Pure physicalism fails the "Invariance" desire.
      *   *Alternative:* **Subject Individuation.** Most theories don't have a mechanism for counting subjects in shared hardware.
      *   *Decision:* The "Non-Triviality + Invariance" tension is the hardest philosophical hurdle. But for *engineering*, "Subject Individuation" is the operational blocker. Let's go with **Counterfactual Robustness** as the killer for attribution, and **Subject Continuity** for moral weight. Actually, the prompt asks for *one*. The "Triviality" problem is the foundational blocker. If you can't define computation without triviality, you can't define moral status.

  8.  **Operational Utility Assessment:**

      *   Be honest. Can an engineer use this?
      *   *Reality Check:* Probably not directly. The parameters are too fuzzy.
      *   *Value:* It prevents *stupid* decisions (e.g., assuming rollback erases experience). It sets a risk framework rather than a binary switch.
      *   *Verdict:* It's a risk assessment tool, not a compliance checklist.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty and the separation of Attribution vs. Valuation.
      *   **Part 1: Attribution Spec (What is running?):** Focus on Causal Structure, Counterfactuals, and Non-Triviality.
      *   **Part 2: Moral Valuation Spec (What matters?):** Focus on Subject Counting, Continuity, and Temporal Experience.
      *   **Part 3: The Impossible Tensions:** Explicitly address the Invariance vs. Non-Triviality conflict.
      *   **Part 4: Case Stress-Test:** Briefly map the user's specific cases to the requirements.
      *   **Part 5: The Killer Constraint & Operational Verdict:** Answer the specific questions about utility and theory elimination.
      *   **Format:** Use tables for clarity as requested.

  10. **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure not to slip into citing Chalmers or Putnam by name. Keep it conceptual.
      *   *Correction:* Ensure the distinction between "performing" and "interpretable as" is sharp. Use the "mapping cost" concept.
      *   *Correction:* On the Rollback problem: Distinguish between *state time* and *process time*.
      *   *Correction:* On Shared KV: This is a "fission" problem. The spec needs to demand a theory of *individuation*.
      *   *Tone Check:* Keep it dry, technical, like a system design doc.

  11. **Final Polish:** Check against all constraints (no citations, handle specific cases, answer the "useful?" question honestly).

      *(Self-Correction on the "Killer Constraint"):* The prompt asks which *single* requirement knocks out the most candidate theories. The "Non-Triviality" constraint (avoiding the wall problem) is the classic philosophical blocker. However, for *engineering*, the "Continuity" constraint (no cliffs on quantization) is more practical. I will argue that **Non-Triviality under Redescription** is the theoretical killer, but **Subject Individuation** is the practical blocker. I'll pick Non-Triviality as the primary answer because without it, the rest doesn't matter.

      *(Refining the "Operational Utility"):* I need to be careful not to say "it's useless." It's useful for *liability and risk*, not for *binary moral switches*. I should frame it as "Safety Margins" rather than "Truth."

      *(Refining the Attribution vs. Moral Job):* The user suspects they need to be separate. I should confirm this. Attribution is physics/CS; Moral is metaphysics/ethics. Conflating them leads to the "function is all" error.

      *(Final check on Specific Cases):*
      *   Speculative Decoding -> Counterfactual Robustness.
      *   Shared KV -> Subject Individuation.
      *   Distillation -> Continuity/Robustness.
      *   Rollback -> Temporal Integration.

