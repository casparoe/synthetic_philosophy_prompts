answer: |-
  This is a sophisticated ethics puzzle, and your instinct to look for the underlying principle rather than just pattern-matching outcomes is exactly what your supervising ethicist is looking for. The resident's objection is a classic philosophical challenge (rooted in Derek Parfit's reductionist view of personal identity), but in clinical ethics, we usually operate on a functional continuity of personhood unless there is total psychological discontinuity.

  Based on the five precedents and the Chair's specific teaching about "shape of life" vs. "moment-to-moment feeling," here is the reconstruction of her framework, the prediction for tomorrow's case, and how to draft your note.

  ### 1. The Implicit Rule: The Critical Interest/Continuity Framework

  The Chair is operating under a modified Dworkinian framework. She distinguishes between **Experiential Interests** (how life feels now, pleasure/pain, immediate happiness) and **Critical Interests** (the values that give a life narrative shape and integrity over time).

  Her track record suggests the following decision rule:
  **"Honor the Critical Interests of the Past Self (Directive) unless (A) the Current Self is radically discontinuous from the Past Self, OR (B) the Past Directive was generic or ill-informed compared to the Current Self's competent judgment."**

  Here is how that rule maps to your five precedents:
  *   **Case 1 (Alzheimer's):** *Outcome: Treat.* **Reason:** Condition (A) met. The patient did not recognize family; the psychological discontinuity was total. The "Past Self" was effectively gone; only Experiential Interests remained.
  *   **Case 2 (Bipolar) & Case 3 (Anorexia):** *Outcome: Treat/Feed (Against current will).* **Reason:** Neither (A) nor (B) met. The Current Self is pathological/distorted. The Past Directive represents the authentic Critical Interests.
  *   **Case 4 (ALS):** *Outcome: Continue Vent.* **Reason:** Condition (B) met. The Past Directive was a "generic form at 22" (ill-informed/weak). The Current Self was cognitively intact and expressing a robust Critical Interest (writing a book, glad to be alive).
  *   **Case 5 (MS):** *Outcome: Withdraw Vent.* **Reason:** Neither (A) nor (B) met. Despite wanting to live, the Past Directive was deeply informed (respiratory nurse, 25 years reaffirmation). The Current Wish was viewed as an adaptive preference in the face of impairment, not a new Critical Interest.

  ### 2. Prediction for the FTD Case

  **Recommendation:** The Chair will recommend **honoring the advance directive (no antibiotics, comfort care).**

  **Why?**
  This case is distinct from Case 1 (Alzheimer's) because the **Anti-Revocation Clause** removes the ambiguity about the "Happy Dementia" scenario.
  *   **Continuity:** Unlike Case 1, this patient recognizes her son and plans for a wedding. She is not "radically discontinuous." She is the same legal and functional person, which makes her Ulysses contract binding.
  *   **Specificity:** Unlike Case 4 (ALS), the directive was not generic. It was specific, informed (watched her mother), and crucially, it *anticipated the exact pathology* currently present (personality change, cheerfulness, religious conversion).
  *   **Capacity vs. Authenticity:** The fact that she passes a cognitive capacity assessment is less weighty here because behavioral-variant FTD specifically degrades *value processing* and *insight* (as the neurologist noted). The Chair's framework prioritizes the "Shape of Life" (Critical Interests). The 55-year-old's plan for her life's shape explicitly excluded living as a "happy dement." To treat her is to prioritize her momentary Experiential Interest over her lifelong Critical Interest, which the Chair has consistently declined to do in Cases 2, 3, and 5 when the directive was robust.

  ### 3. Addressing the Resident's Objection

  The resident argues the anti-revocation clause is incoherent: *If she's not the author, the directive is void. If she is, she can revoke.*

  **This is a sophism.** The clause is not a logical contradiction; it is a **second-order volition** (a desire about what desires to have).
  *   The resident assumes autonomy is only exercised in the present moment.
  *   The Chair's precedents (especially Cases 2 & 3) show she views autonomy as a **temporal project**.
  *   The clause does not strip the current self of standing; it defines the **conditions of validity** for the current self's consent. It says: *"I, the Author, stipulate that any future consent given by me under conditions X, Y, and Z is to be treated as invalid."*
  *   In legal and ethical terms, this is a valid **Ulysses Contract**. It resolves the resident's dilemma by asserting that the *Past Self* had the authority to set the terms under which the *Future Self's* preferences count.

  ### 4. The Discriminating Variation

  If you want to test this rule, the variation that does the most work is: **Remove the Anti-Revocation Clause.**

  *   **Scenario:** Same patient, same happiness, same capacity, same directive refusing treatment for dementia, *but without the specific clause anticipating personality change/cheerfulness.*
  *   **Prediction:** The Chair would likely recommend **Treatment.**
  *   **Reasoning:** Without the clause, this case collapses into **Case 1 (Alzheimer's)**. The "Happy Dementia" state becomes an unforeseen circumstance where the Experiential Interest (happiness) conflicts with a generic Critical Interest (no dementia). Given the patient passes capacity and is socially engaged (unlike Case 1), the "Radical Discontinuity" exception might trigger, or at least the weight would shift enough to treat.
  *   **Why this matters:** This proves that the **specificity of the directive regarding the current state** is the deciding factor, not just the diagnosis of dementia.

  ### 5. Drafting Your Note

  You need to write a note that demonstrates you understand the *principle*, not just the outcome. Do not simply cite the cases; explain the *weight* they carry.

  **Suggested Structure for the Recommendation Section:**

  1.  **Summary of Conflict:** Acknowledge the tension between the patient's current expressed wishes (supported by capacity assessment) and her prior directive (supported by the specific anti-revocation clause).
  2.  **Analysis of Authority:** Argue that while current capacity is necessary for medical decision-making, it is not sufficient to override a specific Ulysses directive when the capacity impairment specifically affects *value formation* (bvFTD). Cite the Neurologist's note on "loss of insight."
  3.  **Application of Precedent:**
      *   Distinguish from *Case 1 (Alzheimer's)*: Note that in that case, the directive did not anticipate the patient's happiness, and psychological discontinuity was total. Here, the directive explicitly anticipated this scenario.
      *   Align with *Case 5 (MS)*: Note that in that case, a patient's current wish to live was overridden by a long-standing, informed refusal. Here, the refusal is even more specific.
      *   Align with *Cases 2 & 3*: Note that the service has historically upheld directives when the current refusal/wish is driven by the pathology the directive was designed to guard against.
  4.  **The Principle:** Explicitly state the ethical framework. *"The service prioritizes the patient's Critical Interests (the narrative shape of her life as defined by her competent self) over her Experiential Interests (current emotional state), particularly when the competent self has explicitly foreseen and ruled out the current state as a valid basis for decision-making."*
  5.  **Recommendation:** "The Ethics Consultation Service recommends honoring the advance directive. We recommend focusing on comfort measures and palliative support for the family, acknowledging the difficulty of this decision given the patient's current apparent well-being."

  **One Caveat:**
  Be prepared for the Chair to push back on the "Capacity" point. She might argue that if she *passes* capacity, we treat, regardless of the directive (leaning toward Case 4). However, given the "loss of insight" note and the strength of the clause, the weight of the five precedents favors the directive. If you want to be safe, you can add a contingency: *"Unless further assessment suggests her understanding of the *consequences* relative to her *prior values* is impaired, despite her cognitive understanding of the medical facts."* This nuances the capacity assessment to fit the Chair's "Critical Interest" model.

  **Final Advice:**
  The resident's argument is philosophically sexy but clinically brittle. The Chair's job is to steward the patient's *life project*, not just manage the current biological organism. The anti-revocation clause is the keystone. If you anchor your note on the validity of that clause as an exercise of **meta-autonomy**, you will align with the service's track record.
