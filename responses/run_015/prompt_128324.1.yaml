answer: |-
  You're not missing anything obvious at all. In fact, you've basically reinvented one of the standard solutions to the problem.

  What you're describing is often called the **counterfactual strategy** (most famously associated with Daniel Garber and Richard Jeffrey). The move is exactly what you said: to evaluate whether $E$ confirms $H$, we don't look at our *actual* current credences (where $P(E) = 1$); instead, we reconstruct a counterfactual prior state $K^*$ where $E$ was uncertain, and ask whether learning $E$ *would have* boosted $H$.

  So, you're right that this restores the intuition that Mercury's perihelion confirmed General Relativity (GR) for Einstein, even though Einstein already knew the data about Mercury.

  However, here's why philosophers don't just universally accept this and close the book on it. It's not really a "metaphysical hangup" about revising the past; it's about **constraints** and **logical omniscience**.

  ### 1. The "Anything Goes" Worry
  If you allow yourself to reconstruct a counterfactual prior $K^*$ whenever you want, how do you constrain it? There are infinitely many ways to imagine a state where you didn't know $E$.
  *   If I can pick *any* $K^*$, I can probably find one where $P(E|H, K^*) / P(E|\sim H, K^*)$ is huge, and another where it's 1.
  *   To make the solution work, you need rules for constructing $K^*$ that aren't arbitrary. But once you start adding rules for how to reconstruct fictional priors, you're adding a lot of baggage to standard Bayesianism. Critics argue this makes the theory less precise, not more.

  ### 2. The Problem of Logical Omniscience
  This is the deeper technical issue. Standard Bayesianism assumes agents are logically omniscient. That means if $H$ entails $E$, you *must* assign probability 1 to the statement $(H \to E)$ at all times.
  *   In the GR case, Einstein didn't learn new empirical data ($E$ was already known). He learned a **logical connection**: that his new theory $H$ entailed the old data $E$.
  *   In strict Bayesian formalism, you can't update on logical truths because they already have probability 1.
  *   Your counterfactual move works only if we allow the agent in state $K^*$ to be *logically non-omniscient* (i.e., they don't yet know that $H$ entails $E$). But admitting that agents aren't logically omniscient breaks the standard probability axioms. So, solving old evidence often requires breaking standard Bayesian logic to accommodate human limitations.

  ### 3. Diachronic vs. Synchronic Rationality
  You mentioned that people confuse "diachronic coherence rules with actual rationality constraints." This is a sharp observation.
  *   **Strict Conditionalization** is a diachronic rule: it tells you how to move from time $t_1$ to $t_2$ based on what you *actually* learned.
  *   If you didn't actually learn $E$ (because you knew it all along), strict conditionalization says your credence in $H$ shouldn't change.
  *   The counterfactual strategy effectively swaps a diachronic rule for a synchronic one: it asks, "Is $H$ supported by $E$ relative to this hypothetical background?"
  *   Orthodox Bayesians resist this because they want a unified theory of *updating*. If you allow counterfactual updating, you're saying the rule for rational belief change depends on fictional scenarios, not just actual information flow.

  ### The Verdict
  You're largely right that the "problem" isn't a fatal crisis for Bayesianism. Most working Bayesians agree with your intuition: of course old evidence confirms theories, and the counterfactual move is the way to model it.

  However, it's not a "pseudoproblem" because it exposes a genuine tension in the formalism. It highlights that standard Bayesianism is a theory of **idealized agents** (who know all logical truths and update only on new empirical data), and it struggles to model **historical scientific reasoning** (where we learn logical connections between theories and known data).

  So, you aren't missing the point; you're just siding with the "reformist" Bayesians against the "orthodox" ones. The orthodox group isn't holding onto a metaphysical hangup; they're trying to preserve the mathematical strictness of the updating rules, even if it costs them some historical realism.
