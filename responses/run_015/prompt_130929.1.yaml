answer: |-
  Here is a 30-minute teaching plan structured to hit your specific constraints.

  ### 1. The Opening Move (Minutes 0–5)
  **Goal:** Kill the "get better telescopes" response immediately.

  *   **The Hook:** Do not start with spacetime. Start with the definition of the barrier.
  *   **The Move:** Draw a light cone on the board. Mark "Us" here and "There" there. Draw a boundary line where the expansion of space exceeds the speed of light (the cosmological horizon).
  *   **The Key Distinction:** Explicitly contrast **Practical Limits** (too faint, too far, current tech bad) with **Structural Limits** (causal disconnection).
  *   **Why this comes first:** If you don't establish that *no signal can ever propagate from Region B to Region A*, the philosophers will treat this as a standard underdetermination problem solvable by future induction. You need them to accept that the data set is *closed*, not just incomplete.
  *   **Script Cue:** "If I say 'we can't measure it,' you think 'yet.' If I say 'no causal chain can ever connect us to it,' you must think 'never.' That changes the philosophy."

  ### 2. The Carrying Example (Minutes 5–15)
  **Goal:** Present the spacetime topology case without triggering quantum debates.

  *   **The Setup:** Two models of the universe ($M_1$ and $M_2$).
      *   **$M_1$:** Infinite flat plane.
      *   **$M_2$:** Finite torus (Pac-Man style), but the "loop" is larger than the observable horizon.
  *   **What it MUST Have:**
      1.  **Local Isomorphism:** Every measurement inside our horizon yields identical results in both models.
      2.  **Global Divergence:** The topology is fundamentally different (infinite vs. finite).
      3.  **Permanent Barrier:** The distinguishing feature (the "wrap-around") is strictly behind the cosmological event horizon.
  *   **What it MUST Lack:**
      1.  **Quantum Mechanics:** No superposition, no collapse, no Many-Worlds. This is classical GR. You want to avoid students arguing about "observation creating reality."
      2.  **Future Interaction:** No possibility that the horizon will shrink or we will travel there.
      3.  **Empirical Consequences:** No subtle effects on the CMB (Cosmic Microwave Background) that could theoretically be detected. It must be a clean cut.
  *   **Visual Aid:** Draw the flat plane vs. the cylinder. Draw the horizon circle cutting off the part where the cylinder connects back on itself.

  ### 3. The Arc & Misconception Management (Minutes 15–25)
  **Goal:** Navigate the metaphysical traps without losing the non-metaphysicians.

  *   **Segment A: The Instrumentalist Slide (Minutes 15–20)**
      *   **The Trap:** Students will say, "Since it makes no difference to observation, choosing one is just aesthetic preference / pragmatic convenience."
      *   **Where to Head It Off:** Immediately after presenting the models.
      *   **The Intervention:** Ask: "If you bet your life on $M_1$, and a God told you 'Wrong, it was $M_2$', would you say you lost the bet?"
      *   **Why:** This forces them to admit there *might* be a truth value independent of utility. If they say "No, I can't lose that bet," they are Verificationists. If they say "Yes," they are Realists. Make them pick a side before moving on.
  *   **Segment B: The Epistemic vs. Ontological Confusion (Minutes 20–25)**
      *   **The Trap:** Confusing "We cannot know the topology" (Epistemic) with "The topology is indeterminate" (Ontological).
      *   **Where to Head It Off:** During the discussion of the "God's Eye View."
      *   **The Intervention:** Draw a distinction on the board:
          *   *Claim 1:* There is a fact, but it is hidden. (Realism)
          *   *Claim 2:* There is no fact until revealed. (Anti-Realism/Structuralism)
      *   **Why:** Phil majors love to collapse truth into knowability. You need to freeze this distinction here. Remind them that general relativity assumes a manifold exists independently of observers. If GR is true, Claim 1 is likely true. If Empiricism is true, Claim 2 is likely true. Don't solve it, just isolate it.

  ### 4. The Check Question (Minutes 25–27)
  **Goal:** Verify they understand the distinction without citing Quine or getting technical.

  *   **The Question:** "Imagine an observer situated *outside* our spacetime manifold (a 'God's eye' view). They can see the whole shape. Do they see **one** specific topology, or do they see **no** specific topology?"
  *   **The Grading Key:**
      *   If they say **"One specific topology"**: They understand that the inaccessibility is *epistemic* (we can't know), but there is a fact of the matter.
      *   If they say **"No specific topology"**: They understand that the inaccessibility implies *ontological indeterminacy* (the question is meaningless).
      *   If they say **"They can't exist"**: They are dodging the metaphysical hypothetical. Push them: "Assume they can. What do they see?"
  *   **Why this works:** It removes *our* limitations from the equation. If the fact exists for them but not for us, it's epistemic. If the fact doesn't exist even for them, it's ontological.

  ### 5. The Boundary & Close (Minutes 27–30)
  **Goal:** Manage scope and end on time.

  *   **What to Flat-Out Refuse to Explain:**
      1.  **The Formal Math:** Do not explain Cauchy surfaces, global hyperbolicity, or homotopy groups. If asked, say: "The math guarantees the local match, but the philosophy is about what the math *means*."
      2.  **The Mechanism of the Horizon:** Do not explain the Friedmann equations or dark energy expansion rates. stipulate the horizon exists as a premise.
      3.  **The History of Verificationism:** Do not let the seminar devolve into a history lesson on Logical Positivism. Keep it on the spacetime case.
  *   **Closing Thought:** Leave them with this: "If science is about finding the truth, and the truth is structurally hidden, is science still doing ontology? Or is it just saving the phenomena?"

  ### Summary of Timing
  *   **0–5:** Causal Barriers (Not just "hard to see").
  *   **5–15:** The Spacetime Toy Case (Local match, Global mismatch).
  *   **15–20:** Trap 1 (Aesthetic Preference vs. Truth).
  *   **20–25:** Trap 2 (Epistemic vs. Ontological).
  *   **25–27:** The Check Question (The Outside Observer).
  *   **27–30:** Boundaries & Wrap.
