answer: |-
  Plan

  1.  **The Heir's Grief:** The story follows the painter's daughter. She visits the storage facility to see the two objects. She cannot distinguish them. The story ends with her withdrawing the claim, not because she believes the museum, but because she realizes the legal fight validates a distinction she no longer feels.
      *Critique:* This risks resolving the philosophical tension through emotional exhaustion rather than ontological uncertainty.

  2.  **The Director's Pragmatism:** The protagonist is the museum director. The focus is on insurance, press releases, and the rededication ceremony. The destruction of the second object is treated as a logistical necessity.
      *Critique:* This makes the art secondary to institutional politics. It sidelines the core question of what the object *is*.

  3.  **The Conservator's Burden (Selected):** The protagonist is the conservator who must certify the object. Their signature validates the work's identity. This isolates the wrinkle best because the conservator stands between the physical reality (two indistinguishable objects) and the institutional reality (one authorized original). The act of signing becomes the moment where ontology is decided not by history, but by declaration.

  4.  **The Public Critic:** A critic attempts to view both objects to write a review on authenticity. They are denied access to the crate. The story becomes about secrecy.
      *Critique:* This externalizes the conflict too much. The tension needs to be internal to the care of the object.

  ***

  The vault air smelled of cold iron and cured resin. Elias stood before the easels, the two panels of the triptych's center section facing him like mirrors that refused to reflect.

  On the left, Object A. The one that had hung in Gallery 4 for eleven years. On the right, Object B. The one that had survived the flood in a crate labeled *Miscellaneous Frames*.

  They were identical to the eye. Under the magnification lamp, the thermal noise of the reconstitution process showed itself: microscopic variations in the polymerized binding medium, a few thousand molecules displaced by the heat of the print head. But the pattern was random. There was no watermark, no sequence error that said *First Run* or *Second Run*. The logs were gone. The history was severed.

  Elias held his pen over the condition report. *Status: Stable.*

  "If you sign for A, we destroy B," Director Halloway had said that morning. Her office was warm, too bright. "If you sign for B, we destroy A. But you must sign for one. The heir is waiting outside the gates with a marshal. We cannot hold both."

  "And if I sign for neither?" Elias had asked.

  "Then the work ceases to exist. And you cease to be employed."

  Now, in the silence of the vault, Elias looked at the paint. It was 1984 technology, the scanner eating the original canvas to feed the printer. The painter was dead before the ink dried. The heir, a nephew who had never met the man, claimed the scan was a murder. *You consumed the substance,* the legal brief read. *What remains is a copy of a memory. Both are forgeries. Both must be returned.*

  The heir was right. Substance was gone. But the form remained. Or rather, forms.

  Elias leaned in. He knew the brushwork better than his own handwriting. He knew where the artist had pressed too hard, leaving a ridge in the impasto. He traced the ridge on Object A with a gloved finger. He traced the same ridge on Object B. They felt the same. The printer had replicated the topography of the gesture without the hand that made it.

  If he chose A, he validated the last eleven years. He validated the millions of visitors who had stood before it, the essays written, the love felt. But he validated a lie of continuity.

  If he chose B, he admitted the gallery had been empty for a decade. He validated the heir's claim that the museum was a warehouse of counterfeits. But he also admitted that the work could survive the swap. That the spirit of the thing didn't care which bucket of molecules held it.

  There was a third thought, the one Halloway feared. That the scan hadn't destroyed the work, but split it. That the painter's act was a wave function, and the machine had collapsed it into two states. If that were true, destroying either was a mutilation. But the law required a singular subject. You cannot hang a superposition.

  Elias looked at the pen. It was a simple archival rollerball. Black ink. Permanent.

  He thought of the nephew outside. The man wanted the objects back to burn them, presumably. To prove that nothing survived. To make the death final. It was a honest grief, sharper than the museum's polite preservation. The museum wanted to keep the ghost. The heir wanted to bury the body.

  Elias moved the lamp. The light caught the craquelure. On Object A, a hairline fracture ran through the blue sky. On Object B, the fracture was there too, printed in, not formed by age. A fake scar.

  He picked up Object A. It was light, hollow compared to the original wood panel he remembered from the manuals. He picked up Object B. Same weight. Same balance.

  He set them down.

  He could flip a coin. The outcome would be the same. The history was already lost; the only thing remaining was the future. The object he signed would become the original by virtue of being the one that survived. The other would become debris.

  But the signature required a name. *Certified by E. Vance.* It meant *I have verified this is the thing.*

  Elias uncapped the pen. He hovered over the line for Object A. He looked at the fake scar. He thought of the visitors who would come in three days for the rededication. They would look at the paint and feel something. Would they feel less if they knew this was Run 2? Or would they feel less knowing that Run 1 was being shredded in the incinerator?

  The heir's claim was strong. The original was dead. These were twins born of a corpse. To choose one was to kill the other. To choose neither was to kill the art.

  Elias moved the report from the left easel to the right. He aligned the paper with Object B.

  It didn't matter. That was the terror. It didn't matter which one breathed and which one choked. The value wasn't in the molecules. It wasn't in the history, either, since that was broken. The value was in the agreement. The museum said *this is it*. The public said *we believe you*. The heir said *you are liars*.

  Elias pressed the pen to the paper. The ink flowed, dark and wet. He wrote his name. He checked the box: *Authentic.*

  He capped the pen. He looked at Object A, the one he had not signed. It stared back, perfect and useless. He would have to mark it for disposal. He would have to watch it go into the furnace so that this one could be real.

  He picked up the phone to call Halloway. "It's done," he said.

  "Which one?" she asked.

  Elias looked at the two panels. He looked at the signature drying on the page.

  "Does it matter?" he said.

  "Yes," she said. "Tell me which one so I know what to burn."

  Elias hung up. He walked to Object A and placed a red sticker on its frame. *Deaccession.* He walked to Object B and turned off the lamp. In the dark, they were both the same. In the light, only one would be allowed to speak.

  He left the vault, locking the door on the twin that would never hang, knowing that tomorrow, the one on the wall would be the original, simply because it was the one that remained.
