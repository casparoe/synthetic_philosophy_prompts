prompt: |-
  I serve as the compliance lead for a university office that reviews undergraduate-led field experiments in behavioral economics and public health outreach, roughly fifteen to twenty proposals per month during term, most low-risk but involving adult members of the public approached in markets, clinics, and transit hubs. Reviews must be completed within forty-five minutes by staff with basic research-ethics training but no background in philosophy, with only flagged cases escalated to me for full review, and our concern is less legal liability than whether participants have genuinely given valid consent.

  Please translate the philosophical work on what makes consent valid into a stepwise procedure my reviewers can actually follow, ordered as questions to ask with criteria for what counts as a passing answer, clear stop points that yield a requirement to revise and resubmit, and explicit markers for points where factual checking ends and a value judgment by a person is required. The procedure must handle three recurring difficulties separately rather than collapsing them into a general sense of voluntariness: deception understood to include outright false statements, technically true but misleading framing, and material omissions about purpose, risks, or downstream uses of data; pressure understood to include explicit threats, offers of payment or services that may be difficult for poorer participants to refuse, and reliance on authority or institutional trust; and competence understood to include age-related thresholds, temporary impairment or low literacy, and fluctuating understanding during extended interactions.

  Illustrate the procedure by applying it to three invented proposals currently before us: a door-to-door survey on household budgeting that withholds that responses will be used to train a credit-scoring model; a paid forty-minute interview on vaccine hesitancy offering a grocery voucher worth roughly a day's wage in the neighborhood where recruitment occurs, conducted by staff wearing local clinic uniforms; and a longitudinal text-message study of medication adherence enrolling sixteen- to nineteen-year-olds with mixed literacy levels. Include in the illustration at least one verdict my student investigators are likely to find frustratingly strict, explain why the procedure requires it, and conclude with a brief account of what the procedure cannot settle and where reviewers should expect it to misfire if applied mechanically.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Compliance Lead for a university office reviewing undergraduate-led field experiments (Behavioral Econ/Public Health).
      *   **Volume/Constraints:** 15-20 proposals/month, 45-minute review limit per proposal, reviewers have basic ethics training (no philosophy background), low-risk but public-facing (markets, clinics, transit).
      *   **Goal:** Translate philosophical work on *valid consent* into a stepwise procedure (questions, criteria, stop points, value judgment markers).
      *   **Specific Focus:** Handle three difficulties separately:
          1.  Deception (False statements, misleading framing, material omissions).
          2.  Pressure (Threats, inducements/payment, authority/trust).
          3.  Competence (Age, impairment/literacy, fluctuating understanding).
      *   **Illustrations:** Apply to three specific invented proposals (Credit-scoring survey, Vaccine interview with high payment/clinic uniforms, Text-message study with minors/mixed literacy).
      *   **Requirements:** Include one "frustratingly strict" verdict with justification. Conclude with limitations of the procedure.

  2.  **Deconstruct "Valid Consent" (Philosophical Basis):**
      *   Philosophically, valid consent requires *Authorization* + *Voluntariness* + *Understanding* (often grouped as Information, Comprehension, Voluntariness).
      *   *Deception* undermines Information/Understanding.
      *   *Pressure/Coercion/Undue Inducement* undermines Voluntariness.
      *   *Competence/Capacity* undermines Authorization/Understanding.
      *   *Key Challenge:* Translating abstract concepts (e.g., "autonomy," "coercion") into binary or checklist-style decisions for non-philosophers within 45 minutes.

  3.  **Drafting the Procedure (The "Consent Validity Checklist"):**
      *   *Structure:* Needs to be linear, with "Stop/Revise" points.
      *   *Tone:* Practical, directive, clear.
      *   *Sections:* Correspond to the three difficulties (Deception, Pressure, Competence).
      *   *Value Judgment Markers:* Explicitly state where the reviewer must pause and think, rather than just check a box.

      *   *Drafting Section 1: Deception (Informational Validity)*
          *   Q: Is anything false? -> Stop if yes (unless waived, but prompt says focus on valid consent).
          *   Q: Is anything misleadingly true? (Framing).
          *   Q: Is anything omitted? (Materiality test: Would a reasonable person care?).
          *   *Stop Point:* Material omission regarding data use or risk.

      *   *Drafting Section 2: Pressure (Voluntariness)*
          *   Q: Are there threats? -> Stop.
          *   Q: Is there payment? -> Is it "Undue Inducement"? (Contextual test: Does it blind them to risk?).
          *   Q: Is there authority/uniforms? -> Does it imply obligation?
          *   *Value Judgment:* Determining "Undue" requires context.

      *   *Drafting Section 3: Competence (Capacity)*
          *   Q: Age threshold? (Minors need assent/parental consent usually).
          *   Q: Literacy/Impairment? -> Is the script accessible?
          *   Q: Fluctuating understanding? -> Check-in mechanisms?
          *   *Stop Point:* Minors without parental consent mechanisms.

  4.  **Developing the Illustrations:**
      *   *Proposal A (Credit-Scoring Survey):* Focus on Deception (Omission).
          *   Issue: Withholding data use.
          *   Verdict: Reject/Revise. Material omission.
      *   *Proposal B (Vaccine Interview):* Focus on Pressure (Payment + Authority).
          *   Issue: Day's wage (Undue Inducement) + Clinic Uniforms (Authority/Trust).
          *   Verdict: Reject/Revise. This is a good candidate for the "frustratingly strict" verdict. Students often think "It's just a voucher." Philosophy says this compromises voluntariness significantly in low-income contexts.
      *   *Proposal C (Text-Message/Minors):* Focus on Competence.
          *   Issue: 16-19 year olds (minors/adults mix), literacy.
          *   Verdict: Conditional/Revise. Needs parental consent for under 18s, simplified text for literacy.

  5.  **Refining the "Frustratingly Strict" Verdict:**
      *   Proposal B is the strongest candidate. Students often argue that high payment increases participation and helps the poor. The ethical counter-argument is that it compromises the *freedom* to say no. I need to make sure the procedure flags this clearly as a "Value Judgment" point regarding *contextual vulnerability*.

  6.  **Addressing the Limitations:**
      *   What can't a checklist do?
      *   It can't measure actual psychological state.
      *   It can't account for cultural nuance without human input.
      *   It can't replace the "spirit" of ethics with the "letter."
      *   Mechanical application leads to box-ticking without understanding *why*.

  7.  **Review against Constraints:**
      *   45-minute limit? The checklist needs to be concise.
      *   No philosophy background? Avoid jargon like "deontological" or "teleological." Use "Material," "Undue," "Capacity."
      *   Three difficulties separated? Yes, structured by Deception, Pressure, Competence.
      *   Stop points included? Yes.
      *   Value judgment markers included? Yes.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but supportive (Compliance Lead to Reviewers).
      *   Check that the "Value Judgment" markers are distinct from the "Factual Checks."
      *   Ensure the "Frustratingly Strict" explanation is robust.

      *(Self-Correction during drafting)*: I initially thought about allowing deception with debriefing. However, the prompt emphasizes *valid consent* and the concern is whether participants *genuously* gave it. In field experiments where debriefing might be impossible (e.g., door-to-door), deception is harder to justify. I will treat material omission as a failure of consent unless a specific waiver is granted (which is outside the scope of this specific checklist, so I will treat it as a "Stop").
      *Correction on Proposal B:* Is a day's wage *always* undue? In philosophy, it's contextual. I need to make sure the procedure asks the reviewer to assess the *local context*, not just the amount.
      *Correction on Proposal C:* 16-19 is a mix. 16-17 are minors, 18-19 are adults. The procedure needs to catch the minor status.

  9.  **Finalizing the Output Structure:**
      *   Introduction (Context).
      *   The Procedure (The 3-Step Protocol).
      *   Application to Proposals (A, B, C).
      *   The "Frustratingly Strict" Explanation.
      *   Limitations/Misfire Analysis.

  10. (Final Check of Prompt Requirements):
      *   Stepwise procedure? Yes.
      *   Questions + Criteria? Yes.
      *   Stop points? Yes.
      *   Value judgment markers? Yes.
      *   3 Difficulties (Deception, Pressure, Competence)? Yes.
      *   3 Illustrations? Yes.
      *   1 Frustrating Verdict + Explanation? Yes.
      *   Limitations conclusion? Yes.

      *Let's write it.*
answer: |-
  **To:** Ethics Review Staff
  **From:** Compliance Lead
  **Subject:** Protocol for Assessing Valid Consent in Field Experiments (45-Minute Review Window)

  ### Introduction
  Our mandate is not merely legal protection but the ethical assurance that participants have genuinely authorized their involvement. Valid consent is not a signature; it is a process. Because you do not have training in moral philosophy, this procedure translates the philosophical conditions of *Information*, *Voluntariness*, and *Capacity* into a binary decision tree.

  **Instructions:**
  1.  Work through the three modules in order.
  2.  Mark **FACT CHECK** items with evidence from the proposal (e.g., "Script line 4").
  3.  Mark **VALUE JUDGMENT** items with a brief note explaining your reasoning (this is where you must think, not just scan).
  4.  If any **STOP POINT** is triggered, the proposal must be returned for revision. Do not escalate to me unless the investigator disputes the stop point.

  ---

  ### Module 1: Deception (Informational Validity)
  *Philosophical Basis: Consent is invalid if the agent authorizes X but is led to believe they are authorizing Y.*

  **Step 1.1: Explicit Falsehoods**
  *   **Question:** Does the script or recruitment material contain statements known by the researchers to be factually false?
  *   **Criteria:** Any lie about identity, purpose, or procedure.
  *   **Status:** [ ] Yes [ ] No
  *   **STOP POINT:** If **Yes**, Reject unless a formal Deception Waiver is attached and justified (rare for field work).

  **Step 1.2: Misleading Framing**
  *   **Question:** Are technically true statements phrased to create a false impression? (e.g., "This survey helps the community" when it helps a private vendor).
  *   **Criteria:** Does the framing emphasize benefit to the participant/public while hiding benefit to the researcher/third party?
  *   **Status:** [ ] Yes [ ] No
  *   **VALUE JUDGMENT MARKER:** If Yes, ask: *Would a reasonable person feel betrayed if they knew the full context?*

  **Step 1.3: Material Omissions**
  *   **Question:** Is there information omitted regarding purpose, risks, or downstream data use that a reasonable person would consider important to their decision?
  *   **Criteria:** Specifically look for: Data sharing with third parties, commercial use of data, or potential social/legal risks.
  *   **Status:** [ ] Yes [ ] No
  *   **STOP POINT:** If **Yes** regarding data use or risk, Reject. Consent cannot be valid if the scope of authorization is unknown.

  ---

  ### Module 2: Pressure (Voluntariness)
  *Philosophical Basis: Consent is invalid if the choice is made under coercion (threats) or undue inducement (offers that overwhelm judgment).*

  **Step 2.1: Threats and Penalties**
  *   **Question:** Does refusal result in loss of existing services, status, or rights?
  *   **Criteria:** Look for language implying obligation ("You are selected to...") or penalty ("...otherwise you cannot receive...").
  *   **Status:** [ ] Yes [ ] No
  *   **STOP POINT:** If **Yes**, Reject immediately.

  **Step 2.2: Inducements and Payment**
  *   **Question:** Is payment or compensation offered? If yes, is the value disproportionate to the time/risk in the *local context*?
  *   **Criteria:** Compare payment to local average daily wage or standard market research rates.
  *   **Status:** [ ] N/A [ ] Proportional [ ] Disproportionate
  *   **VALUE JUDGMENT MARKER:** If Disproportionate, ask: *Is this amount large enough that a participant might ignore risks they would otherwise avoid?*
  *   **STOP POINT:** If **Yes** (it blinds them to risk), Reject. High payment in vulnerable populations constitutes undue inducement.

  **Step 2.3: Authority and Trust**
  *   **Question:** Are researchers using symbols of authority (uniforms, logos, institutional titles) that might imply participation is mandatory or medically required?
  *   **Criteria:** Check recruitment attire, letterheads, and verbal introductions.
  *   **Status:** [ ] Neutral [ ] Authority Implied
  *   **VALUE JUDGMENT MARKER:** If Authority Implied, ask: *Would a reasonable person in this setting feel they could say 'no' to someone wearing this uniform?*
  *   **STOP POINT:** If **Yes**, Reject. Institutional trust cannot be leveraged to secure consent.

  ---

  ### Module 3: Competence (Capacity)
  *Philosophical Basis: Consent is invalid if the agent lacks the cognitive ability to understand the transaction or the legal standing to authorize it.*

  **Step 3.1: Legal Age Thresholds**
  *   **Question:** Are any participants under the legal age of majority (18)?
  *   **Criteria:** Check inclusion criteria.
  *   **Status:** [ ] Adults Only [ ] Minors Included
  *   **STOP POINT:** If **Minors Included**, check for Parental Consent + Child Assent protocol. If missing, Reject.

  **Step 3.2: Literacy and Comprehension**
  *   **Question:** Is the consent script matched to the literacy level of the target population?
  *   **Criteria:** Look for reading level assessments or simplified oral consent scripts for low-literacy groups.
  *   **Status:** [ ] Matched [ ] Mismatched
  *   **STOP POINT:** If **Mismatched**, Reject.

  **Step 3.3: Fluctuating Understanding**
  *   **Question:** For interactions longer than 15 minutes, is there a mechanism to re-confirm consent?
  *   **Criteria:** Check for "check-in" questions or opportunity to withdraw mid-stream.
  *   **Status:** [ ] Yes [ ] No
  *   **VALUE JUDGMENT MARKER:** If No, ask: *Is it plausible that a participant's willingness changes as the task becomes burdensome?*
  *   **STOP POINT:** If **Yes** (plausible) and No mechanism exists, Require Revision.

  ---

  ### Application to Current Proposals

  #### Proposal A: Door-to-Door Household Budgeting Survey
  *   **Module 1 (Deception):**
      *   1.1 Explicit Falsehoods: No.
      *   1.2 Misleading Framing: No.
      *   1.3 Material Omissions: **Yes.** Proposal states data is for "academic analysis" but omits that it will train a private credit-scoring model.
      *   **VALUE JUDGMENT:** A reasonable person would care if their financial data trains a model that could deny them loans.
      *   **STOP POINT TRIGGERED.**
  *   **Verdict:** **Revise and Resubmit.**
  *   **Reasoning:** Consent is specific. Authorizing "research" is not authorizing "commercial profiling." The omission invalidates the authorization.

  #### Proposal B: Vaccine Hesitancy Interview (Clinic Uniforms + Grocery Voucher)
  *   **Module 1 (Deception):** Pass.
  *   **Module 2 (Pressure):**
      *   2.1 Threats: No.
      *   2.2 Inducements: **Yes.** Voucher = one day's wage.
      *   **VALUE JUDGMENT:** In this neighborhood, one day's wage is significant. It risks blinding participants to the sensitivity of the health questions.
      *   2.3 Authority: **Yes.** Staff wearing local clinic uniforms.
      *   **VALUE JUDGMENT:** Patients often believe clinic staff requests are medical directives, not research requests. They may fear refusing affects their care.
      *   **STOP POINT TRIGGERED (Both 2.2 and 2.3).**
  *   **Verdict:** **Revise and Resubmit.** (See "Frustratingly Strict" below).
  *   **Reasoning:** The combination of high inducement and authority symbols creates a "perfect storm" where voluntariness is compromised.

  #### Proposal C: Longitudinal Text-Message Medication Adherence (Ages 16-19)
  *   **Module 1 (Deception):** Pass.
  *   **Module 2 (Pressure):** Pass.
  *   **Module 3 (Competence):**
      *   3.1 Legal Age: **Mixed.** 16-17 are minors; 18-19 are adults.
      *   **STOP POINT TRIGGERED.** Protocol lacks parental consent for the 16-17 cohort.
      *   3.2 Literacy: **Mismatched.** Proposal admits "mixed literacy" but uses standard text scripts.
      *   **STOP POINT TRIGGERED.**
  *   **Verdict:** **Revise and Resubmit.**
  *   **Reasoning:** Minors require legal guardian authorization. Low literacy requires simplified text or voice-note alternatives to ensure comprehension.

  ---

  ### The "Frustratingly Strict" Verdict: Proposal B
  **The Verdict:** You are likely to find the rejection of Proposal B frustrating. You may argue: *"The voucher helps poor participants,"* and *"The uniforms build trust, making people more willing to talk."*

  **Why the Procedure Requires Rejection:**
  Philosophically, consent is not just about saying "yes"; it is about having a *meaningful option to say "no."*
  1.  **Undue Inducement:** When payment equals a day's wage for a 40-minute task, the offer is not just an incentive; it becomes an offer "too good to refuse." This compromises the *voluntariness* of the choice. If the only reason a participant agrees is the money, despite discomfort with the questions, they are being instrumentalized, not treated as autonomous agents.
  2.  **Authority:** Wearing clinic uniforms in a clinic-adjacent area blurs the line between *care* and *research*. Participants may consent because they believe the "doctor" wants them to, fearing that refusal might subtly impact their standing as patients. This exploits institutional trust.

  **The Hard Truth:** We cannot allow the ends (good data on vaccine hesitancy) to justify the means (compromised consent). If the study cannot be done without paying a day's wage or wearing uniforms, it should not be done in that manner.

  ---

  ### Limitations and Mechanical Misfires
  This procedure is a tool, not a moral oracle. Reviewers should expect it to misfire in the following ways if applied mechanically:

  1.  **The "Reasonable Person" Standard:** The procedure asks you to judge what a "reasonable person" would care about (Module 1.3) or feel pressured by (Module 2.3). This is a **Value Judgment**, not a fact. A mechanical reviewer might assume "I wouldn't care, so no one cares." You must actively imagine the vulnerability of the specific population (e.g., a market vendor vs. a university student).
  2.  **Cultural Context:** The procedure assumes a standard view of authority and money. In some cultures, refusing a gift (voucher) is deeply rude, making the "voluntariness" check harder. The checklist cannot capture this nuance; you must use the **Value Judgment Marker** to note when cultural norms alter the pressure dynamic.
  3.  **Box-Ticking:** It is possible to pass this checklist and still treat participants poorly (e.g., rushing them through the script so they sign but don't read). This procedure validates the *structure* of consent, not the *quality of the interaction*. If a proposal looks perfect on paper but the timeline is impossibly tight for genuine understanding, you must use the **Value Judgment Marker** in Module 3 to flag the practical reality.

  **Final Instruction:** If you find yourself wanting to approve a proposal that technically passes the checklist but feels ethically "off," escalate it to me. The procedure guards against clear violations; your intuition guards against the spirit of the law.
