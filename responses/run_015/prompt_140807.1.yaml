answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, District Museum
  **FROM:** [Your Name], Board Member
  **DATE:** 28th of the Month
  **SUBJECT:** Recommendation Regarding Acquisition of Bronze Slabs (Ref: Finder-2023-X)

  ### 1. Bottom Line Recommendation
  **Buy, but hold the case label until specific tests are done.**

  I recommend we commit to acquiring this group, subject to a standard verification period. However, we must not commit to the Curator's "First Shopkeepers" narrative on the label until scientific analysis confirms both authenticity and function. We should proceed on the understanding that these objects are significant regardless of whether they are weights, ritual deposits, or tags, and that their loss to overseas private collection would be a permanent detriment to local history.

  ### 2. Financial Context & Trade-Off
  The asking price is £26,000. This consumes the majority of the current acquisitions budget.
  *   **The Cost:** As noted by the Education Officer, this precludes the £9,000 schools programme planned for this year.
  *   **The Mitigation:** If acquired, these objects should immediately become the core of a *new* schools initiative ("Mystery of the Bronze Slabs"). We can recoup the educational value by making the investigation of the objects themselves the curriculum, rather than treating the acquisition and the education budget as mutually exclusive.
  *   **The Risk:** If we decline, the finder is within their rights to sell abroad. Given the rarity of the find, it is unlikely to return to public view.

  ### 3. Summary of Facts (Settled)
  *   **Object:** 22 flat bronze slabs, matchbox-sized, single punched hole.
  *   **Grouping:** Three distinct weight classes (approx. 8g, 17g, 25g). Tight consistency within groups (±1g).
  *   **Context:** Found in a pit at the edge of a circular earthwork. Associated only with burnt hazelnut shells.
  *   **Dating:** Pit context dates to c. 100 BC – 100 AD (Late Iron Age/Early Roman).
  *   **Condition:** Crisp edges, no wear, no bending.
  *   **Comparative Finds:** Similar objects found in pits and wet places (springs), none in graves, none in clear domestic/market layers.

  ### 4. Interpretative Arguments (Contested)
  The Board must be aware that experts disagree on what these objects *are*. A decisive label now would be misleading.

  *   **The Curator's View (Trade Weights):** The 1:2:3 weight ratio suggests a standardized system for trade ("The First Shopkeepers").
      *   *Counter-point:* The ratios are imperfect (17g is not exactly double 8g). Tools usually show wear; these are pristine.
  *   **The Skeptic's View (Ritual Deposit):** Perfect condition and deposition in pits/springs suggests these were offerings to gods, not tools for men (Hal's argument).
      *   *Counter-point:* Offerings are usually unique or broken; these are a consistent set.
  *   **The Technical View (Production Method):** The weight clusters may result from a craftsman simply doubling the amount of metal by eye, not from a legal market standard (The Finds Officer's "Doubler's Argument").
  *   **The Alternative View (Property Tags):** Scratches on two items could be owner's marks, suggesting they were tags for harnesses or goods (Flo's argument).
  *   **The Authenticity Risk:** We have credible intelligence regarding a local forger producing convincing bronze antiquities. This cannot be ignored.

  ### 5. Conditions of Purchase & Immediate Action
  If the Board votes to acquire, I propose the following conditions:

  1.  **Verification Period:** Payment is released only after independent metallurgical analysis confirms the alloy and corrosion patterns are consistent with the 1st Century BC/AD.
  2.  **Labeling Protocol:** Until further notice, display labels must read: *"Bronze Slabs, c. 100 BC–100 AD. Function Debated: Possible Trade Weights or Ritual Deposits."*
      *   **DO claim:** They represent a standardized production method.
      *   **DO NOT claim:** They prove the existence of a regulated market or shopkeeping.
  3.  **Immediate Testing Budget:** We should allocate £1,500 from the Conservation budget (not Acquisitions) for the following, prioritized by importance:
      *   **Metallurgical Analysis (XRF & Microscopy):** To rule out modern alloys and artificial corrosion. **(Priority 1)**
      *   **High-Precision Weighing:** To determine if the 8/17/25g spread fits statistical models of "hand-doubled" metal vs. "calibrated" weights.
      *   **Use-Wear Microscopy:** To look for microscopic polishing inside the holes or on edges that the naked eye misses.

  ### 6. Evidence Thresholds
  To move from "Debated" to "Confirmed," we need the following:
  *   **For Weights:** Microscopic wear on the rims or holes consistent with handling/stringing, *and* statistical proof the weight ratios are too precise for eye-balling.
  *   **For Ritual:** Proof the metal composition matches other known votive offerings in the region, *and* zero evidence of mechanical wear.
  *   **For Forgery:** Detection of modern trace elements (e.g., aluminum or zinc profiles inconsistent with ancient smelting) or corrosion that grows from the inside out (natural) vs. sits on the surface (artificial).

  ### 7. The Deciding Factor
  **Single Piece of Evidence:** The **Metallurgical/Corrosion Analysis**.
  If the metal is modern, the recommendation flips immediately to **Do Not Buy**. If the metal is ancient, the function (Weights vs. Ritual) is secondary to the object's value as a local artifact.

  ***

  **ANNEX: MEMBER'S BRIEFING (SETTLED VS. CONTESTED)**
  *(Note: This section is for the Board's internal understanding of where the certainty lies.)*

  **What is Settled (Fact):**
  *   **The Physics:** The objects exist, they weigh roughly 8/17/25g, and they were found in a pit with hazelnut shells.
  *   **The Context:** They were not found in a grave, nor in a clear Roman shop layer. They were found in a "liminal" space (edge of earthwork/wet ground).
  *   **The Risk:** There is a known forger in the region. We cannot skip authentication.

  **What is Genuinely Contested (Interpretation):**
  *   **The "Standard":** Archaeologists argue over whether "close enough" ratios (8/17/25) count as a "standard." In the Iron Age, standards were often local and loose. The Curator is likely overstating the "Shopkeeper" claim to make the exhibit sexier.
  *   **The "Tool" vs. "Token":** Hal (the blogger) is technically correct that tools usually wear down. However, high-value items (like a merchant's precise weights) might be kept carefully. Both stories are possible.
  *   **The "Doubler" Argument:** This is the strongest technical counter-argument. If you melt bronze in a crucible, pouring "one ladle, two ladles, three ladles" naturally creates weight clusters without needing a market law. This undermines the "First Shopkeepers" headline significantly.

  **Reasoning Split:**
  *   **My Recommendation relies on:** The preservation imperative (don't let it leave the country) and the mitigation of risk (test for forgery first).
  *   **The Curator's Recommendation relies on:** The narrative value ("Shopkeepers" sells tickets).
  *   **The Skeptic's Recommendation relies on:** The contextual probability (pits = ritual).

  **What Would Change My Recommendation:**
  If the preliminary metallurgical scan suggests the alloy contains trace elements unavailable in the 1st Century (e.g., specific modern deoxidizers), I would withdraw my support for the purchase immediately, regardless of the risk of export. Authenticity trumps provenance.

  ***

  **VOTE REQUIRED:**
  [ ] Authorize acquisition subject to scientific verification.
  [ ] Decline acquisition.
  [ ] Defer decision pending external review.
