prompt: |-
  I'm on the breeding advisory board of a mid-sized dairy co-op — I'm not a philosopher, I'm on it because I'm one of the larger members — and I'm also doing an evening course in philosophy of biology, which has made our own spreadsheets look strange to me. Here's roughly what we do. We dont really pick bulls by looking at cows any more. Every calf is genotyped at birth at a few tens of thousands of markers and gets a number out of it, a "genomic estimated breeding value", which as far as I can tell is just the summed estimated average effects of the chunks of genome it happens to carry. We choose the sires off that number before the animal has ever sired anything or even seen a cow; the top handful get used enormously, one bull can end up with tens of thousands of daughters through artificial insemination, and the rest are more or less culled. On top of that we do three other things that don't seem to be at the same level at all: we keep performance records on individual cows and we have a rule that we won't use a bull whose profile predicts miserable longevity or bad calving ease, we cap how much any one sire can contribute to the next generation because otherwise the breed's "effective population size" falls off a cliff, and we all pay into a national gene bank that freezes semen and embryos from rare local breeds that nobodys farms commercially any more.

  So my question is what all of this presupposes about what selection is acting on, if it presupposes anything. On the face of it we've adopted a gene's-eye view as an engineering practice without anyone ever deciding to: the thing we evaluate, bank and optimise is a bundle of alleles, and the animal looks like a disposable vehicle for this year's draw from the gene pool. But my tutor keeps saying the gene-level, individual-level and group-level stories are different partitionings of one and the same causal process, so maybe counting alleles is only convenient bookkeeping and we're committed to nothing; and then the sire cap and the gene bank look like they only make sense if the breed or the population is a genuine unit that can do better or worse, which is the group-selection-flavoured thing I was told everybody had given up on decades ago. I'm less interested in being told which level is "really" the unit — I want to know what our practice commits us to. Which parts of it strictly presuppose the replicator / gene's-eye picture, which parts merely sit comfortably with it, and which parts an individual-level or multilevel picture would license just as happily? Suppose someone said we'd saved every allele of a rare breed in a freezer but let the breed die out as a living, breeding population — does our own practice give us anything to say about whether we conserved something or nothing? And if we genuinely took the individual animal, or the herd, to be the unit, what would actually change in what we do on Monday morning, and what would just be a different story told over the exact same decisions?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a breeding advisory board for a mid-sized dairy co-op. Large member (practical influence). Taking an evening course in philosophy of biology.
      *   **Tone:** Pragmatic, experienced, slightly skeptical of abstract theory but genuinely puzzled by the implications of their practice. Not looking for a lecture on "who is right," but rather "what does our practice commit us to?"
      *   **The Practice:**
          1.  Genomic Estimated Breeding Values (GEBV) at birth (gene-centric optimization).
          2.  Massive use of top sires (winner-takes-all).
          3.  Constraints: Longevity/Calving ease thresholds (individual welfare/function).
          4.  Constraints: Sire caps (effective population size/$N_e$).
          5.  Contribution to a national gene bank (rare breeds/alleles).
      *   **The Conflict:** The daily practice looks like Dawkins' "Selfish Gene" (animals as vehicles), but the constraints (caps, gene banks) look like Group Selection or species-level conservation. The tutor says levels are just "partitionings," but the user feels the practical commitments differ.
      *   **The Questions:**
          1.  What does the practice presuppose about the unit of selection?
          2.  Which parts strictly presuppose the gene's-eye view?
          3.  Which parts sit comfortably with it vs. require individual/group views?
          4.  Scenario: Saved alleles in a freezer but breed dies out. Did we conserve something?
          5.  Counterfactual: If we took the individual/herd as the unit, what would *actually change* on Monday morning?

  2.  **Deconstruct the Philosophical Issues:**
      *   **Unit of Selection Debate:** Gene (Dawkins), Individual (Darwin/Williams), Group (Wynne-Edwards/Sober & Wilson).
      *   **Replicator vs. Interactor:** Hull's distinction. Genes replicate; organisms interact.
      *   **Teleology/Goal:** What is the *goal* of the breeding program? Profit? Genetic gain? Breed survival?
      *   **Pragmatic Commitment:** Operationalism. If you measure $X$ and optimize $Y$, you are committed to the reality of $X$ and the value of $Y$.

  3.  **Address the Specific Practices:**

      *   **GEBV (Genomic Selection):** This is the strongest evidence for the *gene's-eye view as a method*. You are selecting alleles, not phenotypes (initially). The animal is a proxy. *Commitment:* Alleles are the currency of value.
      *   **Sire Caps (Effective Population Size):** This is the tricky one. Why cap? To prevent inbreeding depression. Inbreeding depression hurts *future individuals*. But the constraint is on the *population's* genetic variance. *Commitment:* The population's statistical properties (heterozygosity) are a resource that must be managed. This leans towards a "Population as Unit" view, but can be justified by long-term individual fitness.
      *   **Gene Bank (Rare Breeds):** This is clearly *not* about current economic efficiency. It's about option value, history, or intrinsic value of the "Breed." *Commitment:* The "Breed" exists as an entity worth preserving beyond its current alleles' market value.
      *   **Longevity/Calving Ease:** This is individual welfare/function. *Commitment:* The organism matters, not just the DNA.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's unique position (practitioner + student). Validate the tension. It's a classic "Levels of Selection" problem but applied in real-time.
      *   **Part 1: The GEBV & The Gene's Eye:**
          *   Yes, GEBV is operationally gene-centric. You are treating the genome as a bag of alleles.
          *   *Philosophical Commitment:* You are committed to alleles being the *replicators*. The cow is the *interactor* (Hull's terms).
          *   *Nuance:* You aren't committed to genes having *agency* (Selfish Gene metaphor), just that they are the unit of *inheritance*.
      *   **Part 2: The Sire Cap & The Population:**
          *   This is where the gene's-eye view struggles if taken narrowly. A "selfish" allele would want to fixate immediately.
          *   Capping implies the *population structure* is a variable to be optimized.
          *   *Commitment:* The "Breed" is a system with stability conditions (variance). You are managing the *evolutionary potential*, not just current output. This aligns with Multi-Level Selection (MLS) or at least a "Lineage" view.
      *   **Part 3: The Gene Bank & The "Dead" Breed:**
          *   The freezer scenario. If the breed dies but alleles remain, did you save it?
          *   Gene view: Yes (alleles saved).
          *   Individual/Breed view: No (the lineage/interaction stopped).
          *   *Your Practice:* You pay into it *now* for breeds you don't farm. This commits you to the value of the *lineage* or the *option space*, not just current profit. It suggests the "Breed" is a historical entity, not just a current allele frequency.
      *   **Part 4: What Would Change on Monday Morning? (The Counterfactual)**
          *   If Individual was the *only* unit: You wouldn't cap sires (maximize current offspring). You wouldn't fund the gene bank (waste of money).
          *   If Gene was the *only* unit: You might ignore calving ease (if the gene spreads, who cares if the cow suffers/dies, provided it reproduces).
          *   *Conclusion:* Your current hybrid practice *requires* a hybrid ontology. You are a "pragmatic pluralist."
      *   **Part 5: Synthesis/Advice for the Board:**
          *   Don't let the philosophy paralyze the practice.
          *   Use the distinctions to justify the costs (e.g., justify sire caps to members who want short-term gain by appealing to long-term lineage survival).

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, or explain it (e.g., Replicator/Interactor).
      *   Respect the user's expertise (they know the spreadsheets better than I do).
      *   Be direct about the "commitments."
      *   *Self-Correction during drafting:* I need to make sure I don't just say "it's all compatible." The user specifically asked what *strictly presupposes* what. I need to draw lines.
      *   *Key Distinction:* Selection *of* vs. Selection *for*. (Sober). You select *of* individuals, but *for* alleles.
      *   *Key Distinction:* Short-term vs. Long-term. Gene view is often short-term fixation. Population view is long-term evolvability.

  6.  **Final Polish:** Check against the specific questions in the prompt.
      *   What does practice presuppose? (Hybrid).
      *   Which parts strictly presuppose gene's-eye? (GEBV).
      *   Which parts sit comfortably? (Longevity).
      *   Which parts need group/lineage? (Sire caps, Gene bank).
      *   Freezer scenario? (Commitment to Lineage/Process over static matter).
      *   Monday morning changes? (Yes, removing caps/bank would happen if strict individual/gene view held).

  7.  (Final thought): Ensure I mention that "Group Selection" in the evolutionary sense isn't exactly what they are doing. They are doing *Artificial Selection* with constraints. The "Group" is the Co-op/Breed, managed by human agents. This is "Goal-Directed" evolution, which changes the philosophical stakes. Humans are the external selector. This is crucial. The "Unit" is partly the Human Breeder's Goal.

      *Wait, important nuance:* In natural selection, the "unit" is determined by what replicates. In *artificial* selection, the "unit of value" is determined by the breeder's goal. The biology constrains the goal, but the goal defines the unit of *management*. I need to make sure I distinguish between *biological* units of selection and *management* units of value. The user asks about "what selection is acting on." In their case, *they* are the selection pressure. So the question is really "What is the unit of *value* in your selection criteria?"

      *Revised Plan:* Focus on the distinction between the *mechanism* (genes replicate) and the *target of management* (the lineage/breed).

      *Let's write.*
answer: |-
  This is a fantastic question because it cuts through the abstract debates of philosophy of biology and lands them squarely in the spreadsheet where they belong. You are effectively asking for an **ontological audit** of your breeding program.

  Your tutor is technically correct that the levels are "partitionings of the same causal process" (a view often associated with Elliott Sober or David Hull), but you are also right to sense that your *practice* treats these levels differently. In philosophy, we distinguish between what is *true* and what a practice is *committed to*. You can drive a car without believing in internal combustion, but you cannot design an engine without committing to the reality of pressure and heat.

  Here is an audit of what your specific practices commit you to, distinguishing between the **mechanism of inheritance** (how traits move) and the **unit of value** (what you are trying to save or optimize).

  ### 1. Genomic Estimated Breeding Values (GEBV)
  **The Practice:** You value the calf based on a sum of allele effects before it expresses a phenotype.
  **The Commitment:** This strictly presupposes the **Replicator (Gene) View** as the mechanism of inheritance.

  By genotyping at birth and selecting on markers, you are operationally treating the animal as a "vehicle" (to use Dawkins' term) and the genome as the "blueprint." You are committed to the idea that the *causal power* resides in the DNA chunks, and the organism is merely the statistical expression of those chunks.
  *   **What this rules out:** You cannot consistently hold a strict "Individual Essentialist" view here. If you believed the individual cow was an indivisible whole that couldn't be reduced to additive genetic effects, GEBV wouldn't work.
  *   **Monday Morning Check:** If you truly believed the *individual* was the primary unit of biological value, you would wait for phenotypic proof (milk yield, health) before valuing the animal. Selecting on DNA alone commits you to the gene/allele being the primary currency of inheritance.

  ### 2. Longevity and Calving Ease Thresholds
  **The Practice:** You reject high-genetic-merit sires if they predict poor individual welfare or function.
  **The Commitment:** This commits you to the **Individual (Interactor) View** as a unit of *welfare* and *function*.

  This is where your practice diverges from a pure "Selfish Gene" engineering model. A strictly gene-centric optimizer would not care if the vehicle breaks down after one trip, provided the genes were copied. By capping selection based on the cow's ability to survive and calve easily, you are acknowledging that the **organism is a locus of value**, not just a disposable conduit.
  *   **Philosophical nuance:** In natural selection, "fitness" is just reproductive output. In your co-op, "fitness" includes welfare and longevity. You are imposing a moral/functional constraint on the gene's-eye view.
  *   **Monday Morning Check:** If you were purely gene-centric, you would ignore calving ease if the genetic gain in milk was high enough to offset the cost of dead cows. Keeping these constraints commits you to the reality of the *organism* as something that can suffer or fail independently of its genetic score.

  ### 3. Sire Caps (Effective Population Size)
  **The Practice:** You limit the use of the "best" bulls to prevent inbreeding and maintain genetic variance.
  **The Commitment:** This commits you to the **Population (Lineage) View** as a unit of *stability*.

  This is the strongest evidence against a pure gene's-eye view. From the perspective of a specific "winning" allele, the optimal strategy is to fixate immediately—to be in every cow, right now. By capping the sire, you are suppressing the short-term success of the "best" genes to preserve the long-term **evolvability** of the population.
  *   **The "Group" Question:** You mentioned group selection was "given up on." In natural evolution, that's mostly true. But in *artificial* selection, **you are the group selector.** You are acting as an external agent managing the "Breed" as a system. You are committed to the idea that the *statistical properties of the herd* (heterozygosity, variance) are a resource that exists over and above the individual animals.
  *   **Monday Morning Check:** If the Individual were the only unit, you would use the top bull until every cow was pregnant. If the Gene were the only unit, you would let the best alleles fixate. Capping them commits you to the **Breed-as-System** being the unit of long-term management.

  ### 4. The National Gene Bank (Rare Breeds)
  **The Practice:** You pay to store semen/embryos of breeds you do not farm and which are not commercially viable.
  **The Commitment:** This commits you to the **Lineage/Historical View** as a unit of *intrinsic or option value*.

  This is the hardest to square with a pure gene's-eye view. Why store alleles that have low "estimated average effects" for current traits?
  *   **The Freezer Scenario:** You asked: *If we saved every allele of a rare breed in a freezer but let the breed die out as a living, breeding population — does our own practice give us anything to say about whether we conserved something or nothing?*
      *   **Gene View:** You conserved everything. The alleles are safe.
      *   **Individual View:** You conserved nothing. There are no living individuals.
      *   **Your Practice:** By funding the bank, you are acting as if the **Lineage** is the thing being conserved. A lineage is a process, not a thing. If the process stops (no living breeding population), the lineage is extinct, even if the "parts" (alleles) are in a freezer.
      *   **Verdict:** Your practice suggests that a breed is a *historical continuity*. Freezing the alleles preserves the *potential* to restart the process, but if the breed dies as a living population, you have preserved the *library* but burned the *readers*. Your payment into the bank suggests you value the *continuity of the lineage*, not just the matter of the genes.

  ### Summary: What Your Spreadsheets Presuppose

  You are not operating under one unit of selection. You are operating under a **hierarchy of management units**, which is philosophically robust but often confusing.

  1.  **The Gene (Allele)** is the unit of **Measurement**. (GEBV)
  2.  **The Individual (Cow)** is the unit of **Welfare**. (Calving ease/Longevity)
  3.  **The Population (Breed)** is the unit of **Sustainability**. (Sire caps)
  4.  **The Lineage (History)** is the unit of **Conservation**. (Gene bank)

  ### Answering Your Specific Questions

  **"Which parts strictly presuppose the replicator/gene's-eye picture?"**
  The GEBV selection at birth. You cannot justify selecting a newborn on a number derived from markers without assuming the genome is the primary carrier of heritable value.

  **"Which parts merely sit comfortably with it?"**
  The performance records on cows. These are compatible with gene-selection (phenotypes reveal genotypes), but they acknowledge the organism as the site where value is realized.

  **"Which parts an individual-level or multilevel picture would license just as happily?"**
  The sire caps and the gene bank. A strict gene's-eye view struggles to justify these without appealing to long-term "group" survival. These practices license the idea that the *Population* is a real entity that can be "healthy" or "sick" (in terms of variance), independent of the health of the individuals within it.

  **"Suppose someone said we'd saved every allele of a rare breed in a freezer but let the breed die out... does our own practice give us anything to say?"**
  Yes. Your practice of funding the bank *to preserve breeds* implies you value the **living lineage**. If the breed dies as a breeding population, your practice suggests you have failed, even if the alleles are safe. You are conserving a *process* (breeding), not just a *substance* (DNA). The freezer is a pause button, not a save state.

  **"If we genuinely took the individual animal, or the herd, to be the unit, what would actually change in what we do on Monday morning?"**
  *   **If Individual was the only unit:** You would drop the sire caps. You would use the best bull until the market was saturated. You would stop funding the gene bank for other breeds (why pay for animals that don't help *your* cows?).
  *   **If Gene was the only unit:** You would likely drop the calving ease/longevity constraints if the genetic gain was high enough to offset the loss of the vehicle. You would treat cows as fully disposable bioreactors.
  *   **If Herd/Population was the only unit:** You might stop genotyping individuals and focus entirely on herd-level metrics, perhaps cloning the best herd-average rather than selecting specific sires (though this is biologically difficult).

  ### The Philosophical Bottom Line for the Board

  Your tutor is right that causally, it's all one process. But **normatively** (in terms of what you *ought* to do), the levels are distinct.

  Your co-op's practice is a **Pragmatic Pluralism**. You use the gene's-eye view because it is the most powerful *predictive tool* you have. You use the population-level view because it is the only way to ensure *future continuity*.

  When a member asks, "Why can't I use this bull on all my cows? He has the highest GEBV," your philosophical justification for saying "No" is: **"Because we are managing a Lineage, not just harvesting Alleles."**

  You haven't accidentally adopted a philosophy; you've adopted a **multi-level management strategy** that happens to map onto the multi-level nature of biological reality. The spreadsheets look strange because they are trying to quantify a hierarchy (Gene < Individual < Population < Lineage) using a single column of numbers. The "strangeness" you feel is the friction between those levels. Don't resolve it by picking one; resolve it by acknowledging that your job is to balance the competing demands of those different units.

  **Recommendation:** Next time the board discusses sire caps, don't frame it as "preventing inbreeding depression" (which sounds like a technical risk). Frame it as "maintaining the breed as a going concern." That shifts the unit of value from the individual quarter's profit to the lineage's survival, which is exactly what your gene bank contributions already admit you care about.
