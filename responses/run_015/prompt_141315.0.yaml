answer: |-
  This is a clean, high-quality set of propositions. You have correctly identified that the friction lies between the *ontological status* of the Kelly rule (is it a law of nature or a preference?) and its *application* (private wealth vs. institutional endowment vs. one-off health).

  Your son-in-law is right. You cannot hold all seven simultaneously without logical leakage. Below is the audit, ranked by severity of contradiction.

  ### 1. The Core Contradiction: Objectivity vs. The Shifted Log
  **Tension:** (1) & (2) vs. (3)
  **Severity:** Critical

  *   **The Conflict:** In (1) and (2), you argue that log-optimality is a fact of *dynamics* (ergodicity) and that ruin aversion is a mathematical singularity ($\log 0 = -\infty$). In (3), you introduce a parameter $c$. This changes the objective function from $\max E[\log W]$ to $\max E[\log(W+c)]$.
  *   **What Breaks:**
      *   **Against (2):** With $\log(W+c)$, the utility of zero wealth is $\log(c)$, which is finite. You have mathematically reintroduced a "price" for ruin. It is no longer forbidden by the math; it is merely expensive. You have moved from a hard constraint to a soft penalty.
      *   **Against (1):** You claim the rule is "not ad hoc" and "not about tastes." The parameter $c$ is entirely about your specific taste for safety and your specific social safety net. It is not a universal property of multiplicative dynamics. A different person with different family support would have a different $c$.
  *   **Cost of Resolution:** You must surrender the claim that Kelly is "objective dynamics." It is, in your implementation, a specific utility function reflecting a preference for survival above a certain threshold.
  *   **Does (3) wreck (1) and (2)?** Yes. It converts your framework from *Ergodicity Economics* (where the time-average growth rate is the physical constraint) to *Expected Utility Theory* (where $\log(W+c)$ is just a specific risk aversion curve). This is not necessarily bad practice, but it invalidates the rhetorical argument you are using with your board colleagues in (1).

  ### 2. The Institutional Category Error
  **Tension:** (1) vs. (6)
  **Severity:** High

  *   **The Conflict:** You argue the Trust should maximize expected log endowment because the dynamics are multiplicative (50 years of grants). However, you explicitly acknowledge the *output* (good done) is linear in dollars.
  *   **The Smuggle:** Maximizing geometric growth of the *endowment* is only optimal if the *utility* is also logarithmic in the endowment, or if there is a hard constraint that the endowment must never fail (infinite horizon). If the goal is "sum of good done over 50 years" (linear utility of flow), Expected Value maximization is mathematically superior to Expected Log maximization, provided the probability of total ruin is acceptably low.
  *   **What Breaks:** By applying log-maximization to the Trust, you are sacrificing expected good done to reduce variance of the endowment. This is only justified if "The Trust surviving forever" is a higher priority than "The Trust doing the most good possible in its lifespan." You are treating the endowment as the goal, rather than the grants.
  *   **Cost of Resolution:** You must admit to the board that you are imposing a *survival constraint*, not optimizing for *impact*. You are smuggling a premise that "Perpetuity > Total Impact."

  ### 3. The Portfolio Aggregation Error
  **Tension:** Internal to (5)
  **Severity:** Medium-High (Practical Risk)

  *   **The Conflict:** You size simultaneous opportunities "each separately."
  *   **What Breaks:** Kelly optimization is portfolio-dependent. If two opportunities arrive in the same month, their optimal bet sizes depend on their correlation. If they are positively correlated and you size them independently as if they were sequential or uncorrelated, you are overbetting the portfolio. You are exposing yourself to higher variance and ruin risk than your model predicts.
  *   **Cost of Resolution:** You must move from single-asset Kelly sizing to portfolio Kelly sizing (incorporating the covariance matrix). This increases computational load and requires estimating correlations, which feeds back into your uncertainty concerns in (4).

  ### 4. The One-Off Justification
  **Tension:** (1) vs. (7)
  **Severity:** Low (Resolvable)

  *   **The Conflict:** If (1) is true (ergodicity drives the rule), then one-off decisions should be EV max. You apply geometric caution to one-off health decisions.
  *   **Resolution:** This is only a contradiction if health is a consumable good. If health is *capital* (which it is—it determines your future capacity to generate utility or wealth), then health decisions are multiplicative. A bad surgical outcome compounds over your remaining life expectancy.
  *   **Verdict:** This is consistent *if* you view health as a capital stock. It is inconsistent *if* you view it as a one-off consumption good. Given your background, you likely view it as capital, so this tension is superficial.

  ---

  ### Specific Answers to Your Questions

  **Is the modification in (3) a harmless tweak?**
  No. It quietly wrecks (2). You claimed ruin aversion falls out of the math ($\log 0 = -\infty$). With $c > 0$, $\log 0$ is finite. You have replaced a mathematical impossibility with a tunable risk preference. You have also broken the scale invariance of Kelly. In standard Kelly, if you double your wealth, you double your bet. In Shifted Kelly, if you double your wealth, your bet fraction changes because the ratio $W/c$ changes. It is no longer "myopic" in the same clean way; it becomes state-dependent in a more complex manner.

  **Does (6) follow from (1)?**
  No. (1) follows from the agent consuming the terminal wealth or caring about the geometric growth of their *own* utility. The Trust does not consume the endowment; it consumes the *yield*. If the yield utility is linear, EV max is the correct rule for finite horizons. (6) only follows if you add the premise: "The Trust must exist in perpetuity, regardless of opportunity cost."

  **What stands fine?**
  *   **(4) Fractional Kelly:** This is robust control. It is fully consistent with (1) provided you admit parameter uncertainty. It does not contradict optimality; it optimizes under uncertainty.
  *   **(7) Health Decisions:** Consistent if health is modeled as human capital stock subject to multiplicative decay/growth.

  ---

  ### The Single Cheapest Revision

  **Change the ontological claim in (1).**

  Stop telling yourself (and your board) that this is a "fact about how compounding works" that applies "whatever their attitude to risk."

  **Adopt this revision:**
  *"The log rule is the optimal strategy for an agent whose primary utility is long-term survival and who faces repeated multiplicative risks. It is a preference for survival, not a law of physics."*

  **Why this is the cheapest fix:**
  1.  **Saves (3):** If log-utility is a preference for survival, then $\log(W+c)$ is just a more precise specification of that preference (survival above a floor $c$). It is no longer a "fudge"; it is a refinement of the utility function.
  2.  **Saves (4):** Fractional Kelly remains a robust response to uncertainty within a survival preference framework.
  3.  **Saves (7):** Health caution becomes consistent: you are protecting your survival capital.
  4.  **Clarifies (6):** You can no longer tell the board they *must* do this because of math. You must tell them: "If the Board's utility function values perpetual existence over total impact, then we use Log. If we value total impact over 50 years, we use EV." This forces an honest conversation about the Trust's goals rather than hiding behind "ergodicity."
  5.  **Cost:** You lose the rhetorical weapon of "objective truth." You cannot say "anyone... ought to size this way." You must say "anyone who prioritizes survival over growth ought to size this way."

  **Summary:** You are not a physicist discovering a law of motion; you are a risk manager specifying a utility function. The math works better if you admit the utility function is yours to choose, including the parameter $c$. The contradiction vanishes once you admit the "objective" part was the illusion.
