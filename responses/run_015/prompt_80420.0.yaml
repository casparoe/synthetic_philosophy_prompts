answer: |-
  State A maintains a fleet of liquid-fuel missiles in fixed, unhardened silos that require twelve hours to fuel and cannot be launched on warning, while State B possesses highly accurate solid-fuel ICBMs capable of counterforce strikes. During a territorial crisis, A publicly declares that any mobilization of B's forces will trigger an immediate counterforce strike against B's missile fields. However, given A's extreme vulnerability, waiting for B to actually strike would guarantee the destruction of A's arsenal before launch, meaning A's only rational path to inflicting damage is to fire as soon as B shows intent. B's strategic planning committee concludes that A's declaration is not a bluff but a binding commitment born of necessity: if B mobilizes, A *must* launch immediately to avoid disarmament. Consequently, B reasons that allowing A to execute this threat ensures the loss of B's own deterrent, whereas striking preemptively neutralizes A's vulnerable missiles before they can be fueled. B therefore initiates a counterforce strike not because it doubts A's resolve, but because it accepts A's threat as entirely credible and seeks to deny A the opportunity to execute it.

  (a) In Schelling's framework, a threat involves a conditional action that is costly to the threatener *ex post*, requiring reputation or precommitment to be believed, whereas a promise (or statement of intent) describes an action that is in the threatener's interest to carry out once the condition is met. A's declaration functions as a promise because, once B mobilizes, launching early is A's dominant strategy; waiting guarantees disarmament, so using the missiles immediately is rational without any need for external binding devices. This makes the threat perfectly credible because A is not promising to act against its own interest, but rather signaling its optimal move in a vulnerable position.

  (b) This credibility increases B's incentive to strike first because it confirms the crisis is unstable. If B believes A's threat is a bluff, B might mobilize safely; if B believes A is committed to retaliation *after* absorbing a strike, B might hesitate. But because B knows A's threat is a credible promise to launch *early* (due to vulnerability), B faces its own use-it-or-lose-it dilemma. B calculates that if it waits for A to act on its promise, B loses its missiles; therefore, believing the threat creates a powerful incentive for preemptive war to deny A the first move.

  (c) The single feature doing the work is **first-strike instability caused by arsenal vulnerability**. If you remove A's vulnerability (e.g., A has survivable submarines), A can afford to wait and absorb a strike before retaliating. In that case, launching early is no longer in A's interest (it becomes a costly threat again), B no longer fears A will launch prematurely, and the incentive for B to preempt disappears. The logic collapses because the "promise" reverts to a "threat," restoring the possibility of deterrence.

  (d) A defender of "a credible threat deters" would argue this is not a failure of deterrence theory but a failure of force posture or crisis stability. They would claim that deterrence requires both credibility and survivability, and that this scenario only proves credibility is insufficient without stability. They might also argue that deterrence technically succeeded in preventing B from achieving its political goal (X) without war, but war occurred due to preemptive logic instead. This does not fully save the original claim, however, because it concedes that credibility alone can be destabilizing; it forces the defender to narrow the thesis to "a credible threat *plus* survivability deters," admitting that credibility in a vacuum can produce the opposite of the intended effect.

  **Settled vs. Contested**

  **Settled Consensus:**
  *   **The Threat/Promise Distinction:** Scholars agree that actions which are *ex post* optimal (promises) are inherently more credible than actions that are *ex post* costly (threats), per Schelling.
  *   **First-Strike Instability:** There is broad agreement that vulnerable forces create incentives for preemptive war (the "use-it-or-lose-it" dynamic) and that credibility in this context can accelerate escalation rather than prevent it.
  *   **Survivability Requirement:** It is consensus that stable deterrence requires survivable second-strike capabilities to decouple credibility from preemption incentives.

  **Genuinely Contested:**
  *   **Rationality of Preemption:** Some scholars argue that even with vulnerability, nuclear states will rarely preempt due to the overwhelming risk of escalation to mutual destruction (the "nuclear taboo" or risk aversion), meaning B's decision in the scenario is not the *only* rational response.
  *   **Deterrence vs. Stability:** There is ongoing debate over whether cases like this should be classified as "deterrence failure" or "stability failure," and whether credibility can ever be successfully signaled without inducing preemptive fear in an adversary.
  *   **Historical Applicability:** Historians and strategists contest how often this specific logic actually drove state behavior during Cold War crises versus being a theoretical artifact of game theory models.
