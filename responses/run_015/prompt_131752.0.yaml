answer: |-
  This is a classic debate, and honestly, your intuition is spot on: "Collapse" is often a lazy shorthand for "The specific political arrangement I care about stopped existing." But to move past the shouting match, you need a framework that forces both sides to define their terms.

  Here is the desiderata list. Any theory claiming to explain societal collapse (vs. transformation) has to clear these hurdles.

  ### The Core Desiderata

  **1. The "Who Counts?" Criterion (Metric Transparency)**
  A theory must explicitly state whose complexity is being measured. Are we measuring the height of the ziggurat, the volume of grain in the royal storehouse, and the existence of scribes? Or are we measuring caloric intake, infant mortality, and local trade networks?
  *   **The Rule:** You cannot claim collapse without declaring if you are measuring *elite capacity* or *population welfare*. If the palace burns but the farmers eat better, a theory that calls this "collapse" is measuring the wrong variable.

  **2. The Continuity Distinction**
  The theory must distinguish between *institutional discontinuity* (the state stops functioning) and *demographic/cultural discontinuity* (people die or leave).
  *   **The Rule:** A valid theory must explain why the bureaucracy failed without necessarily claiming the people vanished. If the theory conflates the end of a dynasty with the end of a culture, it fails.

  **3. The Temporal Resolution Test**
  "Collapse" implies speed. But is it 10 years? 50? 200?
  *   **The Rule:** The theory must define the time window. If the "collapse" takes 150 years, that's not a catastrophe; that's a generational shift. A theory needs to explain the *rate* of change, not just the change itself.

  **4. The Spatial Granularity Requirement**
  Did the whole region fail, or just the capital?
  *   **The Rule:** The theory must account for refugia. If the cities empty but the hinterlands fill up, that's redistribution, not collapse. A theory that treats a civilization as a single homogeneous blob is automatically suspect.

  ---

  ### Applying the Desiderata to Your Cases

  Here is what a theory needs to explain for each of your friend's favorite examples, and where the trap doors are.

  **1. The Late Bronze Age Transition (Eastern Mediterranean)**
  *   **The Phenomenon:** Palaces burn, Linear B writing vanishes, long-distance trade stops, massive depopulation in Greece.
  *   **The Distinction it Can't Collapse:** It must distinguish between the failure of the *Palatial System* (redistribution economies) and the survival of *local communities*. In many areas, people stayed, but they stopped building big and writing things down.
  *   **The Hard Constraint:** The theory must explain why interconnected systems failed simultaneously across different cultures (Hittites, Mycenaeans, Egyptians) without relying on a single "magic bullet" (like one earthquake). It needs to explain systemic fragility.

  **2. The Maya Lowlands (Classic Period)**
  *   **The Phenomenon:** Monument building stops, dynastic records end, major urban centers are abandoned.
  *   **The Distinction it Can't Collapse:** It cannot conflate the *Southern Lowlands* abandonment with the *Northern Lowlands* or *Highlands* continuity. The Maya didn't disappear; their political center of gravity moved.
  *   **The Hard Constraint:** The theory must explain why the *urban* model became unsustainable. Was it drought? Warfare? Loss of legitimacy? Crucially, it must account for the fact that Maya culture persisted for centuries after the "collapse."

  **3. Easter Island (Rapa Nui)**
  *   **The Phenomenon:** Statue carving stops, population reportedly crashes, social order shifts.
  *   **The Distinction it Can't Collapse:** It must distinguish between *pre-contact* changes and *post-contact* (European disease/slaving) devastation. Older theories blamed "ecocide" (they ate all the trees); newer data suggests resilience and adaptation.
  *   **The Hard Constraint:** The theory must align with the ratification of the palm tree extinction timeline vs. human arrival. If the trees were gone before the statues stopped, the "ecocide" narrative fails.

  ---

  ### The Paleoecology Question

  **Is consistency with paleoecological data a hard requirement?**
  **Yes. Hard Requirement.**

  You cannot talk about societal metabolism without talking about the environment. If a theory claims "drought caused the collapse," but the pollen cores show it was wet, the theory is dead. If a theory claims "overpopulation," but the sediment data shows soil exhaustion happened *before* the population peak, the theory is dead.
  *   **Why:** Social systems are embedded in physical systems. You can have a social theory that emphasizes human agency, but it cannot contradict the physical constraints of the landscape. It doesn't have to be *environmental determinism*, but it must be *environmentally consistent*.

  ---

  ### The "Impossible Trinity" (Conflicting Requirements)

  You asked if there's a subset of requirements that's probably impossible to satisfy together. Yes. There is a tension between **Generalizability**, **Specificity**, and **Agency**.

  1.  **Generalizability:** You want one theory of "Collapse" that covers Bronze Age, Maya, and Rapa Nui.
  2.  **Specificity:** You need to respect the unique paleoecological and political data of each case (e.g., Rapa Nui is isolated; Bronze Age is hyper-connected).
  3.  **Agency:** You want to allow for human choice (adaptation) rather than just environmental determinism.

  **The Conflict:**
  To explain **Easter Island** using traditional models, you often need strong environmental determinism (they ran out of resources, so they crashed).
  To explain the **Bronze Age**, you need institutional flexibility (the system was too rigid to handle shocks).
  To explain the **Maya**, you need a mix of climate stress and political legitimacy loss.

  **The Impossibility:**
  A single *causal mechanism* (e.g., "Resource Depletion causes Collapse") cannot satisfy all three without becoming so vague it's useless.
  *   If you say "Environmental stress causes collapse," you fail the Maya (who adapted to stress for centuries before abandoning cities).
  *   If you say "Political rigidity causes collapse," you fail Rapa Nui (where physical resource limits were likely very real).
  *   **Verdict:** You can have a unified *framework* (e.g., "Resilience Theory"), but you cannot have a unified *cause*. Any theory claiming one cause fits all three is lying.

  ---

  ### Your "Bureaucratic Metrics" Idea

  **Should this be a formal desideratum?**
  **Absolutely. In fact, it should be Desideratum #1.**

  Your half-baked idea is actually the most sophisticated part of this whole debate. "Collapse" is almost always defined by the disappearance of the things that leave traces: stone, writing, centralized storage.
  *   Peasants don't build monuments.
  *   Local traders don't keep clay archives.
  *   Oral cultures don't leave written records of their continuity.

  **The Formal Rule:** **The Observer Bias Declaration.**
  Any theory of collapse must declare: *"This collapse is visible primarily through the lens of [State/Elite] complexity metrics. If measured by [Subsistence/Local] metrics, the event is classified as [Transformation/Restructuring]."*

  If a theory refuses to do this, it is implicitly arguing that a society only exists if it has a king and a monument. That's a political stance, not a scientific one.

  ### Summary for your Friend

  If you want to end the argument, tell him this:
  "We can agree that 'collapse' happens, but only if we agree on *what* is collapsing. If we mean 'Centralized State Capacity,' then yes, collapse is real and frequent. If we mean 'Human Society or Culture,' then collapse is rare and often a myth. A real theory has to pick a lane, prove it with dirt data (paleoecology), and admit that it's usually measuring the death of elites, not the death of people."

  If his theory can't distinguish between the end of a King and the end of a People, he's not studying history; he's studying drama.
