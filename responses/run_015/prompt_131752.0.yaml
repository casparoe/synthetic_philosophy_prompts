  2.  **Deconstruct the Core Debate:**
      *   *Collapse View:* Systems break, population drops, complexity vanishes, darkness ensues.
      *   *Transformation View:* Elites fall, power decentralizes, people adapt, life goes on differently.
      *   *The Problem:* We often conflate the fall of a *regime* with the end of a *people*.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Definition of "Society".* You can't say a society collapsed if you don't define what constitutes the society. Is it the king? The pots? The farmers?
      *   *Requirement 2: Metrics of Complexity.* The user's idea about bureaucratic metrics is crucial. A theory must state *what* is being measured.
      *   *Requirement 3: Temporal Scale.* Collapse looks different over 10 years vs. 100 years.
      *   *Requirement 4: Spatial Scale.* Did everyone leave, or just the capital?
      *   *Requirement 5: Causality.* Was it one thing (volcano) or a system failure (resilience)?

  4.  **Addressing the Specific Cases:**

      *   *Bronze Age Late (LBA):* Palaces burned, writing stopped (Linear B), trade networks broke. But people stayed, iron came later. *Theory must explain:* Loss of centralized literacy/trade vs. continuity of village life.
      *   *Maya Lowlands:* Cities abandoned, dynasties ended. But Maya people are still there. *Theory must explain:* Why the *urban* system failed while the *cultural* system persisted in the north or highlands.
      *   *Easter Island:* Statues stopped, population crashed. Did they kill each other or did rats/drought do it? *Theory must explain:* The mechanism of the population drop vs. the cultural shift.

  5.  **Addressing the "Hard Requirement" on Paleoecology:**
