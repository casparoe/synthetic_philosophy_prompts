answer: |-
  You have described a phenomenon that is rational, well-documented in decision theory, but lacks a single canonical "famous name" in the way the Lottery or Preface paradoxes do. You are describing a divergence between **credence** (degree of belief) and **actionability** (willingness to rely), driven by **conjunctive risk**.

  Here is the breakdown of what this is, how it differs from the famous cases, and the terminology that best captures it.

  ### 1. The Closest Established Concepts (and why they aren't quite it)

  You are right to feel that the **Lottery Paradox** and the **Preface Paradox** are adjacent but distinct. Here is the exact delta:

  *   **The Preface Paradox:** This matches your *belief state* perfectly. (An author believes every sentence $S_1...S_n$ is true, but also believes the conjunction $S_1 \land ... \land S_n$ is false because errors are likely.)
      *   *The Difference:* The Preface Paradox is an **epistemic** problem about rational belief consistency. It asks, "How can I hold these contradictory beliefs?" You are describing a **pragmatic** problem about resource allocation. You feel no tension in belief; you feel a tension in *workflow*.
  *   **The Lottery Paradox:** This matches the *probability math* (high probability per ticket, certainty of loss).
      *   *The Difference:* The Lottery Paradox is about **warrant**. It asks, "Why can't I claim to *know* ticket #1 will lose?" You are not questioning whether you *know* the claims; you are questioning whether it is *safe to build on them* without re-verification.
  *   **Pragmatic Encroachment:** This is the strongest philosophical fit. This theory (championed by Jeremy Fantl, Matthew McGrath, Jason Stanley) argues that whether you "know" something (or are justified in acting on it) depends on the **stakes**.
      *   *The Fit:* In your single-claim scenario, the stakes of being wrong are low (one fact is off). In your five-claim conjunction, the stakes are high (the whole project fails). Pragmatic Encroachment explains why your *action threshold* rises even if your *credence* stays static.
      *   *The Difference:* Standard Pragmatic Encroachment usually focuses on external stakes (money, life, reputation). Your case is unique because the stakes are **endogenous to the logic**: the risk increases purely because you are *combining* claims, not because the outside world suddenly cares more.

  ### 2. The Structural Explanation: Belief Fragmentation

  You mentioned you "feel no tension" between asserting a claim and admitting the list likely contains errors. In philosophy of mind, this is often explained by **Belief Fragmentation** (David Lewis).

  Your mind does not store these 60 claims in a single "bucket" where they are all forced to be true simultaneously. It stores them in fragments.
  *   **Fragment A:** "Claim 4 is true." (Accessed when asked about Claim 4).
  *   **Fragment B:** "Lists of this size usually contain errors." (Accessed when asked about the list).
  *   **Fragment C:** "Claims 4, 12, 19, 33, 40 are required for Project X." (Accessed when planning Project X).

  When you work on Project X, you activate Fragment C. The logic of conjunction ($0.97^5 \approx 86\%$) kicks in, triggering a "Verify" protocol. When you answer a trivia question, you activate Fragment A, where the probability is $97\%$, triggering an "Assert" protocol. The lack of tension is because these fragments are not active simultaneously.

  ### 3. The Name and Definition

  Since there is no single famous noun for this specific behavioral loop, the most precise term from decision theory and epistemology is **Conjunctive Action Threshold** (sometimes discussed under **Risk-Sensitive Assertion**).

  If you need a term to use in conversation or writing, I recommend **"Conjunctive Verification Sensitivity."**

  **Definition:**
  > **Conjunctive Verification Sensitivity** is a decision-making heuristic where an agent maintains high credence in independent propositions individually, but increases verification efforts when a specific subset of those propositions is required jointly for a task. This occurs because the probability of the conjunction decreases multiplicatively, raising the expected cost of error above the cost of verification, even though individual credences remain unchanged.

  ### 4. Cases: Is this an instance of it?

  To help you calibrate, here are cases that **are** instances of this phenomenon, and cases that **are not**.

  **✅ Instances (Conjunctive Verification Sensitivity):**
  *   **Software Dependencies:** A developer knows Library A (99% stable) and Library B (99% stable). They use A alone without testing. But if a feature requires *both* A and B to interact correctly, they write an integration test, even though they trust both individually.
  *   **Medical Diagnosis:** A doctor is 95% sure a patient has Symptom X. They are 95% sure the patient has Symptom Y. If Treatment Z requires *both* X and Y to be present to be safe, the doctor orders a confirmatory test for the combination, even though they would have prescribed a different treatment based on X alone without testing.
  *   **Legal Chains of Title:** A property lawyer is confident in Deed A and confident in Deed B. If selling the property requires proving a clean chain from A *through* B, they re-examine both documents specifically for that transaction, whereas they might have cited A alone in a different context without re-examination.

  **❌ Non-Instances (Different Phenomena):**
  *   **General Paranoia:** Re-checking *all* 60 claims every morning because "I might be wrong." (This is global anxiety, not subset-sensitive rationality).
  *   **The Conjunction Fallacy:** Thinking that "Linda is a bank teller and a feminist" is *more* probable than "Linda is a bank teller." (This is a cognitive bias/error; your behavior is a rational correction to probability).
  *   **Stakes-Based Encroachment (External):** Refusing to assert a claim because if you are wrong you will be sued, even if it's a single claim. (This is standard Pragmatic Encroachment; your case is specific to *logical conjunction*).

  ### 5. Summary

  You have not discovered a flaw in your reasoning; you have discovered **Expected Value of Information (EVI)** calculation.

  *   **Single Claim:** Cost of Error $\times$ Probability of Error < Cost of Verification. $\rightarrow$ **Action: Assert.**
  *   **Conjunction of 5:** Cost of Error (Project Failure) $\times$ Probability of Conjunction Error > Cost of Verification. $\rightarrow$ **Action: Verify.**

  The literature calls the belief-state version the **Preface Paradox**, and the action-state version **Pragmatic Encroachment**. But the specific "subset sensitivity" you are describing is best termed **Conjunctive Verification Sensitivity**. It is the rational management of **conjunctive risk decay** in practical reasoning.
