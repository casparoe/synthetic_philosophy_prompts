answer: |-
  The hum was barely audible, a vibration in the base of Kael's skull that he felt more than heard. It was the Guardian, the neural shunt embedded behind his ear, and it was waiting. Kael stood over the console, his hand hovering above the red lever. Below, in the containment cell, sat the man who had burned half the sector. Varkas. A monster.

  Kael's finger twitched. The hum pitched up, a sharp warning whine.

  He knew the specifications. He had read the code himself. The Guardian was a Frankfurt-style failsafe, designed to bypass the Principle of Alternative Possibilities. If Kael's neural patterns indicated an intention to leave the lever untouched—to let Varkas die of exposure—the Guardian would seize his motor cortex. It would force his hand down. Varkas would be released. Mercy would be enacted.

  But if Kael chose mercy on his own, the Guardian would remain dormant. It would not fire. It would not touch him.

  The ethical mandate was clear: spare the enemy to prove humanity's superiority over vengeance. But Kael's blood was hot. He wanted Varkas dead. He wanted the lever to stay up. He imagined the silence of the cell, the cold taking hold, the justice of it.

  The hum sharpened to a sting. The threshold was nearing. The device didn't wait for action; it waited for intent. It monitored the precursors of will.

  Kael closed his eyes. He could feel the boundary of himself. Where did his anger end and the machine's programming begin? If he lowered his hand now, was it because he believed in mercy, or because he refused to be a puppet? If he chose the right thing only to avoid the violation of the Guardian taking over, was the choice still his?

  The sting became a heat. The Guardian was priming. It sensed the vengeance rising in his amygdala. It was ready to override him, to make him an instrument of grace against his own will. He would still be the one moving the hand, technically. But the volition would be borrowed.

  *I could let it happen,* Kael thought. *I could let it force me. The outcome is the same. Varkas lives. Mercy wins.*

  But then he would know, every day after, that he hadn't chosen. He would be a passenger in his own virtue.

  Or was he already a passenger? The knowledge of the Guardian's presence shaped the landscape of his mind. Every thought of revenge was now shadowed by the anticipation of intervention. Was there any space left for a free thought, or was his entire internal landscape fenced in by the device's trigger conditions? He wanted to choose mercy, but did he want it enough to outpace the machine?

  The heat in his neck was unbearable. The Guardian was milliseconds from engagement. It would flood his synapses with the command: *Push.*

  Kael exhaled. He thought of the sector burned. He thought of the cycle of violence. He thought of the man in the cell, not as a monster, but as a broken thing. The anger didn't vanish—it couldn't vanish—but he stepped around it. He found a quiet place beneath the rage, a small, still point of conviction that belonged to no algorithm.

  He lowered his hand.

  The lever clicked down. The locks disengaged.

  The hum in his skull ceased instantly. The Guardian went cold. It had not fired. The intervention had not been necessary.

  Kael stood there, hand still on the metal. Varkas would walk free. The moral outcome was achieved. The universe was exactly as it would have been had the Guardian forced him.

  He looked at his hand. It had moved without assistance. But as he turned away from the console, the doubt settled in his chest like lead. Had he found that still point of conviction because it was true, or because he needed to prove the machine wrong? Had he chosen mercy, or had he merely chosen to be the one who chose it?

  The silence in the room was absolute. There was no way to tell the difference. The lever was down. The man was saved. And Kael walked out into the hallway, never knowing if he was the author of the act, or just the only witness to it.
