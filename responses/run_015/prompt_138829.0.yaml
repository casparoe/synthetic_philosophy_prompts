answer: |-
  It is genuinely rare to meet someone who has been reading since the Overcoming Bias days. You have earned the right to be confused; superrationality is the ancestor of a lot of modern decision theory (TDT, FDT), and the pop-sci explanations often gloss over the precise mechanism that makes it work.

  Here is the breakdown of the blog post you found, followed by an analysis of your "near-copy" math.

  ### Part 1: Autopsy of the Blog Post

  You are right to wince. The summary is a mix of Hofstadter's original intuition and a retroactive attempt to make it sound like modern decision theory, but it trips over the causal vocabulary.

  **1. "Cooperating *causes* them to cooperate"**
  *   **Verdict:** **Wrong / Wince.**
  *   **Why:** This is the biggest tell that the author isn't steeped in the formal literature (CDT vs. EDT vs. TDT/FDT). Superrationality (and its descendants, Timeless and Functional Decision Theory) does **not** posit a causal arrow from your brain to theirs. It posits a **logical correlation**.
  *   **The Fix:** A superrationalist says: "My decision and their decision are both outputs of the same logical function. When I simulate my decision process to see what it outputs, I am *ipso facto* simulating theirs." There is no signal sent across the table. There is only the recognition that $f(x) = f(x)$. Using the word "cause" invites the standard Causal Decision Theory (CDT) rebuttal: "My choice cannot physically reach across the table to change your neurons." The superrationalist agrees! But they argue CDT is using the wrong map for logical facts.

  **2. "Standard game theory... is simply wrong"**
  *   **Verdict:** **Controversial / Depends on definitions.**
  *   **Why:** Standard game theory (Nash Equilibrium via CDT) is internally consistent. If you assume your action cannot correlate with the other's except via causality, defecting is the only rational move.
  *   **The Fix:** A modern superrationalist (or FDT proponent) would say: "Standard game theory is *normatively inadequate* for agents that can model each other." It's not mathematically wrong within its axioms, but its axioms fail to capture the reality of logical correlation between similar agents. The prediction isn't wrong; the *prescription* is losing money.

  **3. "Only works when... playing against a copy of yourself"**
  *   **Verdict:** **Acceptable (actually an improvement on Hofstadter).**
  *   **Why:** Hofstadter originally argued that *any* two rational humans are superrational copies "in the relevant sense." Most modern rationalists found that too strong. We retreated to: "It works when the agents share enough source code that their decisions are subjunctively dependent."
  *   **The Fix:** The blog post is actually more accurate than Hofstadter was here. If you are playing against a stone-cold CDT maximizer who doesn't model you, superrationality fails. You need the "logical connection."

  **Does the argument survive?**
  Yes, but it shifts from "Magic Rationality" to "Functional Decision Theory." The core insight—that you should optimize the *output of the logical function* you share with the opponent, not just the causal consequences of your physical action—survives. But it requires dropping the word "cause" and accepting that logical facts can be subjunctively dependent.

  ---

  ### Part 2: Your "Near-Copy" Math (Execution Noise)

  You modeled the scenario where the decision procedure is identical, but there is independent execution noise $\epsilon$ (a "trembling hand").

  **Your Calculation:**
  *   **Decision:** Both agents decide $D_{choice} \in \{C, D\}$ identically.
  *   **Execution:** Play $D_{choice}$ with prob $1-\epsilon$, play $\neg D_{choice}$ with prob $\epsilon$.
  *   **Result:** You found $EU(C) > EU(D)$ iff $\epsilon < 1/2$, and that $T$ (Temptation) and $S$ (Sucker) cancel out.

  **Verdict:** **Your math is correct.**

  **Why T and S cancel:**
  Because the decision is perfectly correlated, the only way to get an asymmetric outcome ($CD$ or $DC$) is if exactly one of you misfires.
  *   If you both decide $C$: Prob($CD$) = $(1-\epsilon)\epsilon$. Prob($DC$) = $\epsilon(1-\epsilon)$. These are identical.
  *   Since the probability of you being the Sucker is exactly equal to the probability of you being the Tempter, the payoffs $S$ and $T$ are weighted equally in the expectation.
  *   The same symmetry applies if you both decide $D$.
  *   Therefore, the comparison reduces entirely to: "How likely are we to match?" vs "How likely are we to mismatch?"
  *   If $\epsilon < 1/2$, you are more likely to match your intent than flip it. Since $R > P$, matching on $C$ is better than matching on $D$.
  *   If $\epsilon > 1/2$, you are more likely to flip than match. In this perverse regime, if you *intend* to Cooperate, you will mostly Defect (and so will your copy), leading to $DD$. If you *intend* to Defect, you will mostly Cooperate, leading to $CC$. So, ironically, if $\epsilon > 1/2$, the rational *decision* is to Defect, but the rational *outcome* is Cooperation.

  **Is execution noise the right model?**
  For "near-copies," execution noise is a clean mathematical model, but it is **psychologically/algorithmically shallow**. It assumes the "reasoning" is perfectly identical and only the motor output degrades. In reality, when we say "near-copy," we usually mean "similar reasoning but maybe one of us finds a bug in the logic" or "one of us isn't fully committed to superrationality."

  ---

  ### Part 3: Reasoning Noise (The "Uncanny Valley" of Superrationality)

  This is where your second question hits the hard part of decision theory. What if the noise is in the *reasoning*?
  *   **Model:** With probability $1-\epsilon$, the opponent is a perfect superrational copy. With probability $\epsilon$, the opponent is an independent defector (or a randomizer).
  *   **Does $\epsilon < 1/2$ survive?** **No.**
  *   **Does it unravel?** **Not necessarily, but the threshold changes.**

  **1. The Symmetry Breaks**
  In the execution noise model, $P(\text{Me}=C, \text{Opp}=D) = P(\text{Me}=D, \text{Opp}=C)$.
  In the reasoning noise model, this symmetry often breaks. If I decide to Cooperate, it implies (via logical correlation) that the "copy part" of the opponent Cooperates. But the "noise part" might Defect.
  If I decide to Defect, the "copy part" Defects. The "noise part" might still Defect.
  The conditional probability $P(\text{Opp}=C | \text{Me}=C)$ is no longer simply $1-\epsilon$. It depends on how the noise interacts with the logical dependency.

  **2. The New Threshold**
  In Functional Decision Theory (FDT), the condition for cooperation in a Prisoner's Dilemma against a predictor/copy with correlation strength $\rho$ is roughly:
  $$ \rho > \frac{T - R}{T - P + R - S} $$
  (Or variations thereof depending on the exact noise model).
  *   If $\rho = 1$ (Perfect Copy), you Cooperate.
  *   If $\rho = 0$ (Independent), you Defect (since $T > R$ and $P > S$).
  *   The "break-even" point is **not** universally $\epsilon = 0.5$. It depends entirely on the payoff matrix.
      *   If the Temptation ($T$) is huge, you need very high correlation to resist defecting.
      *   If the Punishment ($P$) is terrible, you can tolerate lower correlation.

  **3. Does it Unravel?**
  You mentioned seeing people say it "unravels." This usually refers to the **Common Knowledge** problem, not the correlation strength problem.
  *   **Correlation Strength:** If I am 90% sure you are a copy, and you are 90% sure I am a copy, cooperation can still hold. It degrades smoothly as confidence drops.
  *   **Common Knowledge:** If the logic requires "I know you are rational, and you know I know, and I know you know I know..." introducing even a tiny $\epsilon$ of doubt can theoretically trigger an infinite regress where we both downgrade our estimate of the other's rationality until we defect.
  *   **Modern View:** Most FDT proponents reject the idea that it must unravel completely. They treat logical correlation as a continuous variable (a "subjunctive dependence" strength) rather than a binary common-knowledge switch. So, it doesn't unravel to zero; it just shrinks the region of cooperation.

  ### Summary

  1.  **The Blog Post:** It's a decent heuristic but philosophically imprecise. Replace "causes" with "logically correlates," and "standard game theory is wrong" with "CDT is normatively inadequate for embedded agents."
  2.  **Your Execution Noise Math:** It is **correct**. The $T/S$ cancellation is a real feature of symmetric execution noise, and the $\epsilon < 1/2$ threshold is the point where your intent becomes anti-correlated with your action.
  3.  **Reasoning Noise:** This is the more realistic model for "near-copies." The $\epsilon < 1/2$ result **does not survive**. The threshold becomes dependent on the specific payoffs ($T, R, P, S$). High Temptation requires higher correlation to sustain cooperation.
  4.  **Unraveling:** It doesn't necessarily unravel to always-defect, but the "magic" of superrationality fades continuously as the logical correlation weakens.

  You've basically re-derived the motivation for Functional Decision Theory: CDT fails on copies, naive superrationality fails on near-copies without a formal account of logical correlation, and FDT is the attempt to formalize that correlation so it degrades gracefully rather than breaking at $\epsilon = 0$.
