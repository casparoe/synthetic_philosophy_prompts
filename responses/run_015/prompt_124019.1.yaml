  ### Probe Design and Insulation Verdict

  **Ill-Designed Probes**
  Your **Pledge Probe** is confounded. Adding a conservation pledge increases the *strength* of the reason to avoid harm (supporting your view), but it also increases the *blameworthiness* of the agent (supporting the rival moral valence view). Because both variables move in the same direction, you cannot isolate which mechanism narrowed the asymmetry. To fix this, you need a 2x2 design: Outcome Valence (Help/Harm) crossed with Norm Strength (Weak/Strong). You need a case where Norm Strength is high but Moral Valence is neutral (e.g., a strict technical protocol) to see if norm strength alone drives intentionality.

  Your **Committee Probe** is also confounded. Diffusing agency across 400 people reduces perceived *control*, which is a prerequisite for intentionality regardless of norms. The shrinkage in asymmetry may simply reflect a floor effect on intentionality attributions generally, rather than a specific dampening of the norm-violation mechanism. A better control would be a single agent acting under strict external coercion, which reduces control without diffusing agency.

  **Insulation Worry**
  Your view is highly exposed to the insulation problem (Score: 0.8). The risk is that "norm" becomes a theoretical sponge: whenever an asymmetry appears, you posit a norm; when none appears, you posit none. To prevent this, you must specify *in advance* which norms count (e.g., only prescriptive social norms, not statistical regularities) and measure their strength independently of the intentionality judgment (e.g., via separate rating scales). If you cannot predict the asymmetry magnitude based on pre-rated norm strength without peeking at the intentionality data, the view is unfalsifiable. This insulation is a significant problem because it allows the theory to accommodate any data pattern, rendering it explanatory weak.

