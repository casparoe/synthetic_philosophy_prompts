answer: |-
  ### Case Context: The Southern Maya Lowlands (c. 800–950 CE)

  **The Empirical Baseline**
  Consider a specific polities cluster in the Petén region (e.g., the hinterlands of Tikal or Calakmul). Archaeologists agree on the following stratigraphic and material realities across the Late Classic to Terminal Classic horizon:

  1.  **Cessation of Elite Markers:** The carving of limestone stelae depicting divine kings (*k'uhul ajaw*) stops abruptly. Construction of large-scale public architecture (temples, palaces) halts. Imports of highland obsidian and Motagua jade vanish from the record.
  2.  **Persistence of Domestic Markers:** In the same residential groups surrounding the abandoned civic centers, midden deposits continue to accumulate. Local coarseware ceramic traditions (e.g., Junco or Batellu types) show stylistic continuity rather than rupture. Posthole patterns indicate the maintenance and repair of perishable domestic structures.
  3.  **Agrarian Continuity:** Phytolith and pollen data indicate that while intensive maize agriculture recedes (allowing forest regeneration), arboreal cultigens (ramón, avocado, cacao) continue to be managed around dwelling sites. Ritual activity shifts from public plazas to domestic shrines, evidenced by cache deposits of broken vessels and figurines within house lots.

  There is no empirical disagreement on these points. The divergence is entirely hermeneutic.

  ---

  ### Interpretation A: The Collapse Narrative (Systemic Disintegration)
  **The Argument:** This account defines "Maya Society" as synonymous with the **Centralized Tributary State**. The cessation of monument construction is read not merely as a change in aesthetic preference, but as the failure of the mechanism that coordinated labor, managed risk, and facilitated long-distance exchange.

  *   **Causal Logic:** The system collapsed because it exceeded its ecological carrying capacity. Drought and soil exhaustion undermined the state's ability to extract surplus. Without the surplus, the elite could not mobilize labor for monuments or secure prestige goods (jade/obsidian) that legitimized their rule.
  *   **Demographic Implication:** The depopulation of the civic centers is interpreted as a demographic catastrophe—a die-off or mass exodus resulting from systemic failure. The persistence of some population in the hinterlands is viewed as the "remnants" of a failed civilization, living in a degraded, post-collapse shadow.
  *   **Key Assumption:** Complex hierarchy is the apex of social evolution. To lose hierarchy is to regress. The disappearance of the *k'uhul ajaw* is the death of the society itself.

  ### Interpretation B: The Transformation Narrative (Adaptive Decentralization)
  **The Argument:** This account defines "Maya Society" as the **Population and its Cultural Reproduction**. The cessation of monument construction is read as a strategic withdrawal of labor from a burdensome extraction system.

  *   **Causal Logic:** The population actively reorganized. Facing environmental stress, communities chose to dissolve the tributary contract. They stopped building temples not because they *couldn't*, but because they *wouldn't*—redirecting labor toward household resilience and local agrarian management. The loss of long-distance exchange is viewed as a shift toward self-sufficiency rather than a loss of connectivity.
  *   **Demographic Implication:** The depopulation of centers is a deliberate de-urbanization. The population did not vanish; it dispersed. The continuity of ceramics and domestic rituals proves that the culture survived intact, merely shed of its parasitic superstructure.
  *   **Key Assumption:** Hierarchy is one strategy among many, not a teleological necessity. A society can persist without a state. The disappearance of the *k'uhul ajaw* is the liberation of the society from a specific political form.

  ---

  ### The Conceptual Hinge: The Ontology of the State

  The divergence does not rest on data, but on a single conceptual hinge: **Whether hierarchical governance is a necessary condition for societal continuity.**

  This hinge dictates how both sides interpret the same material ambiguities:

  1.  **On Monument Cessation:**
      *   *Collapse View:* Monuments are the *index* of social energy. No monuments = no social energy.
      *   *Transformation View:* Monuments are the *index of elite extraction*. No monuments = less extraction.
  2.  **On Exchange Networks:**
      *   *Collapse View:* Obsidian/Jade flows are the *circulatory system* of the society. Their blockage is an embolism.
      *   *Transformation View:* Obsidian/Jade flows are *luxury markers* of status differentiation. Their absence is an equalization.
  3.  **On Institutional Migration:**
      *   *Collapse View:* Institutions reside in the palace. If the palace is empty, the institution is dead.
      *   *Transformation View:* Institutions reside in practice (kinship, ritual, agriculture). If the practice continues in the house lot, the institution has migrated, not died.

  ### The Explanatory Work and Risk of "Collapse"

  The category of **Collapse** performs specific explanatory work that **Reorganization** cannot replicate, but it does so at a conceptual cost.

  **Where "Collapse" Explanatory Work is Unique:**
  The term "collapse" captures the **loss of scale-specific capacity**. It explains why the region could no longer coordinate labor on a regional level, why specialized craft production (like high-quality polychrome ceramics) vanished, and why the region became vulnerable to external conquest later. It acknowledges that certain emergent properties of the state (regional integration, specialized division of labor) were genuinely lost and cannot be romanticized as simple "adaptation." It treats the *complexity* itself as a valuable artifact that was destroyed.

  **Where "Collapse" Imposes Teleology:**
  However, using "collapse" risks imposing a **teleological narrative of failure** onto a process of structural reconfiguration.
  *   **Elite Bias:** The "Collapse" narrative inadvertently adopts the perspective of the defeated elite. To the king, the end of monument building is a catastrophe. To the farmer, it may have been a relief. By labeling the event "collapse," the archaeologist validates the elite's claim that their existence was necessary for society.
  *   **Normative Density:** It treats urban density as a normative criterion for success. If a population chooses a lower-density, higher-resilience lifestyle, "collapse" frames this as a tragedy rather than a choice.
  *   **Binary Traps:** It forces a binary (Functioning/Collapsed) onto a spectrum. It obscures the possibility that the "state" failed while the "society" succeeded in surviving the drought.

  ### Conclusion

  In this scenario, the disagreement is not about whether the stelae stopped being carved; both sides agree they did. The disagreement is about **what the stelae were for**.

  If the stelae were the essential glue holding society together, their absence is **Collapse**.
  If the stelae were a heavy burden society chose to put down, their absence is **Transformation**.

  The conceptual hinge lies in deciding whether the *political superstructure* is the *society* or merely a *component* of it. Until this ontological distinction is made explicit, the debate will remain stuck in a loop where empirical evidence of continuity (pottery) is dismissed by collapse theorists as "survival," while empirical evidence of discontinuity (monuments) is dismissed by transformation theorists as "elite noise." The category of "collapse" remains useful only if it is strictly limited to the dissolution of *political complexity*, without conflating that dissolution with the extinction of the *people* or their *culture*.
