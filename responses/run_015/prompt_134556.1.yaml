answer: |-
  Aristotle would ultimately disapprove of the app as unnatural wealth accumulation, distinguishing the rental income from usury but rejecting the leverage and speculative liquidity as violations of natural household management. 

  Aristotle divides wealth-getting into two categories: *oikonomia*, which is natural and limited to acquiring what is needed for a virtuous household, and *chrematistike*, which is unnatural because it seeks endless profit without limit. You are correct that he would not classify the base rental income as usury; he explicitly accepted income from land and houses as natural because it stems from the earth's yield, whereas usury (*tokos*) is unnatural because money is barren and cannot breed more money. However, the app's structure pushes the activity firmly into unnatural *chrematistike* because it detaches the owner from the property's use, turning a household asset into a tradable commodity for speculative gain rather than sustenance.

  The leverage feature you mentioned would be particularly offensive to him, as borrowing money to buy more slices mimics the "breeding" dynamic he despised in usury, even if collateralized by land. By using debt to amplify returns, the investor is no longer managing an estate for the good life but engaging in the endless accumulation of wealth for its own sake, which Aristotle viewed as corrupting to the soul and the state. The liquidity option further cements this by encouraging trade for profit rather than holding property for use, transforming a stable asset into a vehicle for speculation. While he wouldn't call it usury in the strict sense, he would view the entire mechanism as a sophisticated engine for unnatural greed that prioritizes infinite wealth over virtuous living.
