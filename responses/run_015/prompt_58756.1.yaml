answer: |-
  1. The water licked at June's ankles while she stared at two identical black bricks holding identical lives. She knew saving either was saving everything, which meant saving neither was becoming the only certainty.

  2. She flipped a coin to break the tie, but paused to assign heads to the left drive, realizing the assignment itself required a choice she couldn't make. The coin hit the wet floor spinning, offering an answer she no longer had the vocabulary to interpret.

  3. June closed her eyes to wait for a surge of preference, but the silence stretched until waiting itself felt like a vote for the water to decide. Her hesitation hardened into a third option, neither drive nor drowning, just the static of suspended will.

  4. She stopped looking for a reason and simply snatched the left one, accepting that the difference existed only in the act of taking. The choice wasn't found; it was manufactured in the muscle memory of movement.

  5. Running up the stairs, she couldn't tell if she had exercised freedom or merely exhausted the luxury of indecision. She had acted without a why, which felt like either pure agency or its total surrender.
