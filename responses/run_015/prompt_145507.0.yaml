answer: |-
  **Examination Question**

  Consider a society with two individuals, Prude and Lewd, and three outcomes: $n$ (nobody reads), $p$ (Prude reads), $l$ (Lewd reads).

  **Preferences:**
  Prude: $n \succ p \succ l$
  Lewd: $p \succ l \succ n$

  **Conditions:**
  1. **Unrestricted Domain:** Any logical preference ordering over outcomes is admissible.
  2. **Pareto Principle:** If every individual prefers $x$ to $y$, then society prefers $x$ to $y$.
  3. **Minimal Liberalism:** Prude is decisive over $\{n, p\}$; Lewd is decisive over $\{n, l\}$. (Decisiveness means if the individual prefers $x$ to $y$, society prefers $x$ to $y$).

  Standard analysis demonstrates no social ordering satisfies all three conditions simultaneously. A proposed repair replaces the social ordering with a **game form**: rights are powers over one's sphere rather than entries in a collective ranking. Each person selects their preferred option from their protected pair.

  **Definitions:**
  *   **Pareto-Improvability-under-Rights (PIR):** A rights-based outcome exhibits PIR if it is Pareto-dominated by another outcome that is also reachable by some permissible exercise of everyone's rights.
  *   **Unanimous-Waiver Clause (UWC):** Any right-holder may waive their right over their protected pair. A right is defeated only if every right-holder waives, in which case the pair is decided collectively (e.g., by the Pareto Principle).

  **Task:**
  Assume rights are waivable under UWC. First, determine whether UWC eliminates PIR in this specific profile. Second, provide a determinate verdict: Does this resolution preserve liberalism, or does it collapse into paternalism? Justify your verdict by distinguishing between dissolving a formal inconsistency and dissolving a normative conflict. (20 marks)

  ***

  **Model Answer**

  Under the game form repair without waiving, Prude exercises decisiveness over $\{n, p\}$. Given $n \succ_P p$, Prude vetoes $p$, selecting $n$. Lewd exercises decisiveness over $\{n, l\}$. Given $l \succ_L n$, Lewd vetoes $n$, selecting $l$. The intersection of these powers yields outcome $l$ (Lewd reads).

  However, both individuals prefer $p$ to $l$ (Prude: $p \succ_P l$; Lewd: $p \succ_L l$). Thus, the rights-based outcome $l$ is Pareto-dominated by $p$. Since $p$ is reachable (Prude could choose $p$; Lewd could accept $p$), this outcome exhibits PIR. The game form repair avoids the logical cycle of a social ordering but fails to prevent Pareto-inefficient outcomes generated by rights exercise.

  Under UWC, rights are waivable. To reach $p$, Prude must waive the right to veto $p$, and Lewd must waive the right to enforce $l$. If both waive, the collective decision rule (Pareto) selects $p$, eliminating PIR. Formally, UWC resolves the inconsistency: a consistent, Pareto-optimal outcome is reached.

  Normatively, however, the conflict remains. Liberalism traditionally treats rights as deontological constraints protecting individual spheres regardless of welfare consequences. By waiving rights specifically to achieve a Pareto improvement, rights become instrumental tools for welfare maximization rather than protective shields.

  If a right is held only conditionally on others waiving theirs to improve welfare, it is not a protected sphere but a bargaining chip. This regime is paternalistic: it overrides the protective function of rights to enforce a 'better' outcome determined by collective welfare. Therefore, while UWC solves the formal logical cycle, it fails to dissolve the normative conflict. It preserves consistency only by sacrificing the liberal conception of rights as trumps against collective welfare. The verdict is that UWC collapses into paternalism when used to resolve PIR, as it makes the exercise of liberty contingent on social optimality.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Derivation of Rights-Outcome (4 marks):** Correctly identifies $l$ as the outcome when rights are exercised non-cooperatively based on the profile.
      *   *Common Error:* Identifying $n$ or $p$ as the default rights outcome; confusing decisiveness with voting.
  2.  **Identification of PIR (4 marks):** Correctly notes $l$ is Pareto-dominated by $p$ and $p$ is reachable via different rights exercise.
      *   *Common Error:* Claiming no Pareto improvement exists or $p$ is unreachable under the game form.
  3.  **Mechanism of UWC (4 marks):** Explains that waiving allows the Pareto rule to select $p$ by disabling the veto/power.
      *   *Common Error:* Treating waiving as a vote for $p$ rather than disabling the right; ignoring the unanimity requirement.
  4.  **Formal vs. Normative Distinction (4 marks):** Distinguishes logical consistency (ordering exists/outcome reached) from normative conflict (rights as constraints vs. tools).
      *   *Common Error:* Treating the solution as purely technical without normative evaluation; conflating efficiency with liberty.
  5.  **Determiniate Verdict (4 marks):** Concludes UWC is paternalistic/not liberal because it makes rights conditional on welfare outcomes.
      *   *Common Error:* Ambiguous conclusion ("it depends") or claiming it remains liberal because everyone agreed.

  **Grading Note:** A-grade answers explicitly articulate that solving PIR via waiving converts rights from constraints to instruments. B-grade answers correctly calculate the outcome but treat the normative shift as a mere trade-off rather than a conceptual collapse.
