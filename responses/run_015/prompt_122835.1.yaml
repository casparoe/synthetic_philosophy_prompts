answer: |-
  # Proposal: The Fragility of Good Feelings — A Dynamic Account of Pleasure Unity

  ## 1. The Precise Question

  The central problem of this paper is the **Unity Problem for Hedonism**. Classical hedonism asserts that pleasure is the sole intrinsic good. For this assertion to hold theoretical weight, "pleasure" must refer to a unified natural kind or a coherent functional category. If "pleasure" is merely a label we apply to a heterogeneous collection of experiences that share no common property, then hedonism collapses into a disorganized list of good things, losing its explanatory power as a theory of welfare.

  Existing attempts to identify this common property have stalled. The **Felt-Quality View** (pleasure as a specific sensation) fails to account for the phenomenological diversity of pleasures (e.g., the relief of pain cessation vs. the thrill of a punchline). The **Attitudinal View** (pleasure as a pro-attitude toward an experience) fails to account for pleasures that lack a clear desire for continuation (e.g., tragic art, shock, or flow states described as miserable in the moment). The **Disjunctivist Retreat** (accepting that pleasures share no common property) saves the phenomena but abandons the unity required for hedonism to function as a singular theory of value.

  This paper proposes and tests a fourth option: **The Dynamic Unity Hypothesis**.

  The precise question this paper seeks to answer is: **Can the unity of pleasure be grounded not in its intrinsic phenomenology or its concurrent attitudes, but in its characteristic counterfactual profile regarding attention and repetition?**

  Specifically, I will investigate whether the defining feature of a pleasant state is that it possesses a specific *fragility*: it tends to dissipate or transform when directly monitored, when explicitly aimed at as a goal, or when mechanically repeated without variation. If this dynamic profile is shared across the heterogeneous cases that break the Felt-Quality and Attitudinal views, then we have a unified account of pleasure that preserves hedonism without resorting to phenomenological reductionism.

  The determinable answer I am aiming for is binary but nuanced:
  1.  **Positive:** The Dynamic Unity Hypothesis successfully categorizes the "hard cases" (itch-scratching, relief, flow, tragic art) under a single functional description that distinguishes them from non-pleasant states, without collapsing into Attitudinalism.
  2.  **Negative:** The Dynamic Unity Hypothesis either fails to cover the hard cases (lacks extension) or covers too much (lacks intension), or, most critically, it defines pleasure in such extrinsic/relational terms that it ceases to be a candidate for *intrinsic* value, thereby undermining the hedonist project it aims to save.

  This question is not an invitation to muse on the nature of happiness. It is a structural test of whether a functional/dynamic definition can sustain the metaphysical requirements of normative hedonism.

  ## 2. Diagnosis of Existing Strategies: Why the Impasse Persists

  To justify the Dynamic Unity Hypothesis, I must first demonstrate why the current landscape of solutions is insufficient. This section will not be a literature review but a structural critique of the available logical space. I will argue that each existing strategy leaves the Unity Problem open because it focuses on the *static* properties of the experience (what it is *now*) rather than its *temporal* properties (how it behaves *over time*).

  ### 2.1 The Failure of the Felt-Quality View
  The Felt-Quality View posits that there is a specific "hedonic tone" or qualitative feel common to all pleasures. This is the intuitive default: pleasure feels like something specific, distinct from pain or neutrality.

  The failure here is empirical and phenomenological. As noted in the prompt's motivating cases, the "feel" of scratching an itch is qualitatively distinct from the "feel" of solving a difficult mathematical proof, which is distinct from the "feel" of listening to a sad piece of music that one finds moving. If the commonality is a "glow" or a "tingle," it is absent in many cases we pre-theoretically classify as pleasure.
  *   **The Relief Case:** When a severe toothache stops, the resulting pleasure is often described as the absence of the pain quality, not the presence of a new positive quality. If the Felt-Quality View insists there *must* be a positive quality, it risks becoming unfalsifiable (positing a ghostly sensation we cannot detect).
  *   **The Flow Case:** In states of deep absorption (flow), agents often report no distinct "feeling of pleasure" during the activity. The pleasure is reported retrospectively. If the feeling is absent during the experience, the Felt-Quality View must claim the pleasure wasn't happening *then*, which contradicts the hedonist claim that the experience itself was good for the agent at the time.

  The Felt-Quality View fails because it seeks unity in the *content* of the experience. My proposal suggests we look at the *container*—specifically, how the container reacts to pressure.

  ### 2.2 The Failure of the Attitudinal View
  The Attitudinal View (often associated with Attitudinal Hedonism) shifts the locus of pleasure from sensation to judgment. To be pleased is to have a pro-attitude (a desire, an approval, a "wanting it to continue") toward the experience. This handles the phenomenological diversity well: the itch and the math proof feel different, but in both cases, you (in some sense) want them to continue.

  However, this view breaks down on the **Direction of Fit** and the **Paradox of Hedonism**.
  *   **The Tragic Art Case:** We often describe watching a devastating tragedy as "pleasant" or "enjoyable" in a complex sense. Yet, do we desire the tragedy to continue *qua* tragedy? Often, we desire the *experience* to continue, but we do not desire the *object* (the suffering depicted) to continue. More critically, in moments of peak aesthetic impact, we might be too stunned to form a pro-attitude.
  *   **The Retrospective Case:** Consider the chore finished with relief. During the chore, the agent may have had no pro-attitude toward the continuation of the chore. The pleasure exists in the cessation. The Attitudinal View struggles to locate the pleasure *in* the experience if the attitude is only formed after the experience ends.
  *   **The Self-Monitoring Problem:** This is the critical failure point. If pleasure *is* the attitude of "wanting this to continue," then focusing on that attitude should reinforce the pleasure. If I focus on my desire for the music to continue, the Attitudinal View suggests I am maximizing the pleasure. But phenomenologically, focusing on the desire often kills the enjoyment. It makes the experience instrumental. If the definition of pleasure requires an attitude that, when highlighted, destroys the pleasure, the definition is unstable.

  The Attitudinal View fails because it treats pleasure as a static stance toward an object. It ignores that the stance itself alters the object.

  ### 2.3 The Quietist and Disjunctivist Retreats
  Faced with these failures, many theorists retreat to a **Family Resemblance** or **Disjunctivist** view. They argue that "pleasure" is like "game" (Wittgenstein): there is no single thread, only overlapping similarities. Or, they argue that welfare is pluralistic: sensory pleasure is one good, achievement is another, relief is another.

  This saves the phenomena but kills the theory.
  *   **Theoretical Impotence:** If hedonism is just the claim that "sensory pleasures, attitudinal pleasures, and relief-pleasures are all good," it offers no unified metric for trade-offs. How much relief equals one unit of sensory joy? Without a common currency, hedonism cannot function as a decision procedure or a theory of the *summum bonum*.
  *   **Explanatory Loss:** We intuitively feel that the reason we value the itch-scratch and the symphony is the *same kind of reason* (it feels good/is pleasant). Disjunctivism denies this intuition without a compelling reason other than theoretical convenience.

  The Disjunctivist Retreat leaves the Unity Problem open by declaring it a pseudo-problem. My paper argues it is a real problem, and the solution lies in dynamics, not statics.

  ## 3. The Dynamic Unity Hypothesis: The Proposal

  This section outlines the core positive argument of the paper. I propose that pleasure is unified by a **Second-Order Dynamic Profile**.

  ### 3.1 The Core Definition
  **Thesis:** A mental state $M$ at time $t$ is pleasant if and only if $M$ exhibits a specific counterfactual fragility regarding direct attention and repetition.

  Specifically, pleasant states are those that:
  1.  **Decay under Direct Pursuit:** If the agent makes the production of $M$ their primary explicit goal (rather than a by-product of engaging with an object), the intensity or quality of $M$ diminishes.
  2.  **Decay under Self-Monitoring:** If the agent explicitly monitors their own experience of $M$ to verify its presence ("Am I enjoying this?"), $M$ tends to dissipate or transform into a neutral assessment.
  3.  **Decay under Mechanical Repetition:** If $M$ is repeated identically without variation in context or object, its pleasantness diminishes faster than non-pleasant states (habituation specific to value).

  This is not merely a claim about how pleasure *behaves* (a side effect); it is a claim about what pleasure *is*. Just as "flammability" is defined by how a substance reacts to fire, "pleasantness" is defined by how a state reacts to attention.

  ### 3.2 Why This Unifies the Hard Cases
  This dynamic profile captures the heterogeneity of the prompt's cases without requiring them to feel the same or involve the same attitudes.

  *   **Itch-Scratching:** Highly pleasant, but if you scratch *just* to feel the pleasure (ignoring the itch), it becomes painful or weird. It requires the context of the itch (the object).
  *   **Relief:** Relief is pleasant. But if you try to engineer relief without the prior pain (or the threat of it), you cannot get the specific pleasure of relief. You cannot "pursue" relief directly; you must pursue the removal of the burden.
  *   **Flow/Absorption:** In flow, the agent is not monitoring enjoyment. If they stop to ask, "Am I enjoying this?", the flow state breaks. The pleasure is constituted by the *absence* of that monitoring.
  *   **Tragic Art:** We enjoy the film. But if we watch it *to* enjoy ourselves (instrumentalizing the art), the enjoyment vanishes. We must attend to the tragedy, not our reaction to it.
  *   **Retrospective Chore Enjoyment:** The enjoyment of finishing a chore is pleasant. But if you do the chore *for* the enjoyment of finishing, the finishing loses its relief quality. The pleasure depends on the chore being done for its own necessity.

  In all these cases, the common thread is: **Pleasure is a state that requires the agent's attention to be directed elsewhere (at the object, the task, the pain) to sustain itself.** It is essentially a by-product state.

  ### 3.3 Distinguishing from Attitudinalism
  It is crucial to distinguish this from the Attitudinal View.
  *   **Attitudinal View:** Pleasure = Wanting the state to continue.
  *   **Dynamic View:** Pleasure = A state that *cannot* be sustained if "Wanting the state to continue" becomes the primary focus.

  The Attitudinal View says the desire is constitutive. The Dynamic View says the desire (when explicit) is destructive. This inversion is the key innovation. It explains why we can have pleasure without a conscious desire (flow) and why having a conscious desire often ruins the pleasure (performance anxiety, hedonic calculation).

  ## 4. Methodology: The Case Battery

  To test this hypothesis, I will construct a "Battery of Hard Cases." This section details how I will build and use these cases to stress-test the Dynamic Unity Hypothesis. The goal is not to cherry-pick examples that fit, but to find the boundary conditions where the definition breaks.

  ### 4.1 Construction of the Battery
  I will categorize cases into three tiers:
  1.  **Paradigm Pleasures:** Sensory joys (eating, warmth).
  2.  **Hard Cases (The Breakers):** Relief, Flow, Tragic Art, Shock, Retrospective Satisfaction.
  3.  **Counter-Examples (The Killers):** States that fit the dynamic profile but are not pleasures, or states that are pleasures but do not fit the profile.

  ### 4.2 The Testing Protocol
  For each case in the battery, I will apply three "Stress Tests":
  1.  **The Spotlight Test:** Imagine the agent focusing entirely on their own enjoyment. Does the value persist?
      *   *Pass:* The value diminishes or changes quality.
      *   *Fail:* The value remains robust or increases.
  2.  **The Instrumentalization Test:** Imagine the agent engaging in the activity *solely* to generate the feeling.
      *   *Pass:* The feeling becomes inaccessible or hollow.
      *   *Fail:* The feeling is successfully generated.
  3.  **The Repetition Test:** Imagine the experience repeated identically 100 times.
      *   *Pass:* The pleasantness decays rapidly (hedonic adaptation).
      *   *Fail:* The pleasantness remains stable (like a basic sensory input, e.g., seeing the color red).

  ### 4.3 The Critical Test Case: The "Stoic Robot"
  The prompt mentions a specific test that could kill or save the theory: *A creature or possible agent whose enjoyments are not in the least poisoned by being aimed at.*

  I will dedicate significant space to constructing this thought experiment.
  *   **Scenario:** Consider an agent (call him "Direct") who can pursue pleasure directly without the pleasure decaying. He can say, "I will now maximize my enjoyment," and focus entirely on his internal state, and his enjoyment increases linearly with his focus.
  *   **The Question:** Do we call Direct's states "pleasures"?
      *   **If Yes:** Then the Dynamic Unity Hypothesis fails as a *necessary* condition. Pleasure does not *require* fragility. The fragility is just a contingent feature of human psychology, not the essence of pleasure.
      *   **If No:** Then the Dynamic Unity Hypothesis holds. We would likely describe Direct's states as "satisfaction" or "gratification" but feel they lack the essential quality of "enjoyment." This would suggest that "pleasure" is essentially relational to beings who cannot grasp it directly.

  I anticipate arguing for the **No** position. I will argue that Direct's states are *simulations* of pleasure. Without the fragility, the state lacks the specific value we associate with pleasure. It becomes a mere resource accumulation. This supports the claim that the dynamic profile is constitutive, not contingent.

  ### 4.4 What Counts as a Mishandled Case?
  The account mishandles a case if:
  1.  **False Negative:** It classifies a clear pleasure (e.g., the taste of wine) as non-pleasant because a sommelier *can* monitor it without losing enjoyment. (Counter-argument: The sommelier is working, not enjoying. The enjoyment is in the drinking, not the grading).
  2.  **False Positive:** It classifies a non-pleasure (e.g., the relief of a panic attack ending, which might be neutral) as pleasant solely because it is fragile.
  3.  **Value Drift:** It implies that the *goodness* of the pleasure depends on the fragility. If the fragility is removed (in the Direct case), does the *value* disappear? If yes, the theory makes value extrinsic.

  ## 5. Argument for Unity: Why Not Pluralism?

  A major section of the paper will defend the project's motivation. Why struggle to unify pleasure? Why not accept my friend's suggestion: concede the heterogeneity and adopt a **Pluralist Theory of Welfare**?

  ### 5.1 The Cost of Pluralism
  If we accept that "pleasure" is a disjunctive concept (Sensory Pleasure OR Attitudinal Pleasure OR Relief), then Hedonism ceases to be a rival to Objective List theories or Desire Satisfaction theories. It becomes a subset of them.
  *   **Loss of Commensurability:** The primary advantage of Hedonism is providing a single metric for welfare. If pleasures are heterogeneous, we need a meta-theory to weigh them against each other. How much "flow" equals how much "sensory joy"? If they share no common property, there is no natural exchange rate.
  *   **Explanatory Weakness:** Pluralism explains *that* we value these things, but not *why* we group them under the label "pleasure." The Dynamic Unity Hypothesis offers an explanation for the grouping: we group them because they share a behavioral logic (the logic of the by-product).

  ### 5.2 The Defense of Hedonism
  I will argue that preserving Hedonism is worth the theoretical effort because it anchors value in *conscious experience*. Pluralism often smuggles in objective goods (achievement, knowledge) that might not feel good. Hedonism insists that if it doesn't feel good (or register as pleasant), it isn't good for you.
  *   If we abandon unity, we risk allowing "pleasure" to include things that don't feel good at all (e.g., "I am pleased I did the right thing," even if it felt miserable).
  *   The Dynamic Unity Hypothesis keeps the anchor in experience but redefines the "feel" as a "mode of engagement." It saves the intuition that pleasure is experiential without requiring a specific sensation.

  ### 5.3 The Middle Path
  The argument will be that Pluralism is a surrender to the difficulty of the problem. The Dynamic Unity Hypothesis offers a middle path between the reductionism of the Felt-Quality View and the surrender of Pluralism. It unifies the category functionally.

  ## 6. Success and Failure Conditions

  This section explicitly defines the criteria for the project's success, addressing the user's specific worries about collapsing into Attitudinalism or making value extrinsic.

  ### 6.1 Success Criteria
  The project succeeds if:
  1.  **Extensional Adequacy:** The Dynamic definition covers the Hard Cases (Relief, Flow, Art) better than Felt-Quality or Attitudinal views.
  2.  **Intensional Precision:** The definition does not include obvious non-pleasures (e.g., the fragility of concentration without enjoyment).
  3.  **Preservation of Intrinsic Value:** The account demonstrates that defining pleasure dynamically does not make the *value* of pleasure extrinsic.

  ### 6.2 Failure Condition A: Collapse into Attitudinalism
  **Risk:** The Dynamic View might just be Attitudinalism in disguise. If "fragility under attention" is just a result of "having a pro-attitude," then I haven't offered a new theory.
  *   **Mitigation:** I must show that the fragility exists *independently* of the attitude. For example, in Flow, there is no pro-attitude during the event, yet the fragility exists (monitoring kills it). This proves the dynamic is structural to the state, not dependent on a concurrent desire.
  *   **Failure Signal:** If I cannot explain the Flow case without positing a subconscious pro-attitude, the view collapses into Attitudinalism.

  ### 6.3 Failure Condition B: The Extrinsicness Problem (The Fatal Blow)
  **Risk:** This is the most significant philosophical danger. Hedonism claims pleasure is an **Intrinsic Good**. It is good in itself, not because of what it leads to.
  *   **The Problem:** If pleasure is *defined* by its relation to attention (an external factor), is it still intrinsic? If the value of the experience depends on how I attend to it, isn't the value extrinsic/relational?
  *   **The Test:** If I have a pleasant experience, but I attend to it directly (violating the dynamic condition), does the experience lose its *value*?
      *   If **Yes**: Then the value depends on the attention. The good is not in the experience itself, but in the *relationship* between the experience and the attention. This abandons classical Hedonism.
      *   If **No**: Then the experience remains valuable even when "ruined." But then why define pleasure by the ruin?
  *   **My Stance:** I will argue for a nuanced position. The *nature* of the good is relational (it requires a specific mode of engagement), but the *locus* of the good is still the conscious state. It is an **Intrinsic Good that is Access-Sensitive**.
  *   **Failure Signal:** If I am forced to admit that a "ruined" pleasure (pursued directly) is still equally good for the agent, the Dynamic definition becomes irrelevant to welfare. If I admit it is *less* good, I have made welfare dependent on external conditions (how one attends), which moves away from pure Hedonism toward a Perfectionist or Virtue view.
  *   **Decision Point:** I must decide if I am willing to modify Hedonism to "Access-Sensitive Hedonism." If the paper concludes that pure Hedonism is incompatible with Dynamic Unity, that is a valid (though negative) result. However, the goal is to show they are compatible.

  ### 6.4 Failure Condition C: The "Direct" Creature
  **Risk:** As discussed in the Case Battery, if the "Direct" creature (who enjoys direct pursuit) is possible and their states are valuable, the Dynamic condition is not necessary.
  *   **Failure Signal:** If intuition strongly suggests Direct's life is just as good as ours, the Dynamic Unity Hypothesis fails to capture the *value* of pleasure, only the *psychology* of human pleasure. This would limit the theory to human anthropology rather than normative ethics.

