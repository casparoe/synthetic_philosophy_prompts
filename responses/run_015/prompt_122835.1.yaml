  ## 8. Scope and Limitations: Is This Too Big?

  The question of pleasure's unity is a foundational problem in value theory. Attempting to solve it in 6,000 words is ambitious. There is a genuine risk that the paper becomes a survey of problems rather than a defense of a solution.

  ### 8.1 Potential Scope Creep
  *   **Welfare Theory:** I risk drifting into a general theory of welfare (what makes a life good) rather than sticking to the metaphysics of pleasure (what pleasure *is*).
  *   **Psychology:** I risk drifting into empirical psychology (how dopamine works) rather than philosophical analysis.
  *   **History:** I risk spending too much words on the history of the Paradox of Hedonism (Sidgwick, etc.).

  ### 8.2 Cutting Down the Scope
  To ensure completion, I will apply the following cuts if the draft grows too long:
  1.  **Drop the History:** I will not trace the Paradox of Hedonism historically. I will treat it as a standalone phenomenological observation.
  2.  **Limit the Pluralism Debate:** I will not argue against Pluralism in general, only against Pluralism about *Pleasure*. I will assume Hedonism is a desirable target and focus only on whether this definition saves it.
  3.  **Focus on Two Hard Cases:** Instead of testing all five hard cases (Itch, Relief, Flow, Art, Chore), I will select the two strongest: **Flow** (no concurrent feeling) and **Relief** (negative phenomenology). If the theory works for these, it generalizes.
  4.  **Simplify the "Direct Creature":** I will treat the "Direct Creature" as a single thought experiment rather than exploring multiple variations of alien psychology.

  ### 8.3 The Minimum Viable Paper
  If time runs short, the core argument that must remain is:
  1.  Felt-Quality and Attitudinal views fail on Flow/Relief.
  2.  Dynamic Unity succeeds on Flow/Relief.
  3.  Dynamic Unity does not make value extrinsic.
  Everything else (Pluralism debate, extensive case battery) is secondary.

  ## 9. Vulnerability Assessment: Where the Reasoning Breaks

  This proposal is speculative. It relies on a shift from static to dynamic definitions. There is a specific point where I believe the reasoning is most likely to break, and I need to identify it now to avoid wasting the semester.

  ### 9.1 The Most Likely Break Point: The Normative Leap
  The descriptive claim ("Pleasure *does* fade under scrutiny") is plausible. The normative claim ("Pleasure *is defined by* fading under scrutiny") is dangerous.
  *   **The Objection:** Even if pleasure *does* fade, why does that make it *unified*? Pain also fades under scrutiny (distraction reduces pain). Grief fades under scrutiny. If the dynamic profile is shared by non-pleasant states, it fails to unify pleasure *specifically*.
  *   **The Killer Case:** **Distraction.** If I am in pain, and I distract myself, the pain diminishes. If I am in pleasure, and I distract myself, the pleasure diminishes. The dynamic profile might be a property of *all* intense conscious states, not just pleasant ones.
  *   **Why This Persuades Me to Quit:** If I cannot distinguish the "Pleasure Fragility" from "General Attentional Fragility," then the Dynamic Unity Hypothesis does not define pleasure. It defines *salience*. If the paper reaches Week 9 and I cannot distinguish the fragility of pleasure from the fragility of pain under monitoring, the project is dead. A definition that applies to pain does not define pleasure.

  ### 9.2 The Specific Test for This Failure
  In Week 5, I must run the "Stress Test" on Pain.
  *   *Question:* Does pain decay when pursued directly?
  *   *Hypothesis:* No. Masochists or those focusing on pain can intensify it. Pain often *demands* attention. Pleasure *evades* attention.
  *   **Criterion:** If I find that Pain also evades attention (e.g., trying to feel pain makes it numb), then the Dynamic Profile is not unique to pleasure.
  *   **Decision:** If the profile is not unique, I must abandon the claim that it *defines* pleasure. I might have to settle for the weaker claim that it is a *contingent feature* of human pleasure. This would save the psychology but lose the metaphysics. I need to know by Week 5 if I am writing a metaphysical paper or a psychological one.

  ### 9.3 The "Extrinsic" Trap
  The second break point is the Intrinsic Value issue.
  *   **The Objection:** If pleasure requires a specific relation to attention to exist, then a brain in a vat (without the capacity for that relation) cannot have pleasure. This makes pleasure dependent on external capacities.
  *   **Why This Persuades Me to Quit:** If the argument forces me to conclude that a being with the right chemistry but the wrong "attentional structure" cannot have pleasure, I have moved away from Hedonism (which is usually internalist) toward a form of Externalism. If I am not comfortable defending Externalist Hedonism, the project is not worth doing.
  *   **Decision:** I need to decide in Week 2 if I am willing to be an Externalist about Value. If I want to remain an Internalist (value is inside the head), the Dynamic View might be incompatible.

  ### 9.4 Final Verdict on Viability
  Despite these risks, the project is worth pursuing because the standard views (Felt/Attitude) are currently at a stalemate. The Dynamic View offers a novel vector of attack. Even if the paper concludes that "Dynamic Unity fails to save Intrinsic Hedonism," that is a valuable negative result. It clarifies why Hedonism is so hard to defend.

  However, to ensure a *positive* result, I will frame the "Extrinsicness" not as a bug but as a feature: **Hedonism was always implicitly relational.** We are not containers for pleasure; we are agents engaging with the world. The Dynamic View makes this explicit. If I can sustain this reframing, the paper succeeds. If I cannot, the paper serves as a rigorous autopsy of why the reframing fails.

  ## 10. Conclusion of Proposal

  This paper aims to resolve the Unity Problem by shifting the locus of definition from the *content* of experience to the *dynamics* of engagement. By treating pleasure as a state defined by its fragility under direct pursuit, we can unify the heterogeneous cases that break existing theories.

  The success of this project depends on two pivotal demonstrations:
  1.  That this fragility is unique to pleasure (distinguishing it from pain/grief).
  2.  That this relational definition is compatible with pleasure being an intrinsic good.

  If either demonstration fails, the paper will pivot to explain *why* it fails, contributing to the literature by mapping the boundaries of Hedonist theory. The timeline is aggressive but feasible, provided I restrict the scope to the core metaphysical argument and avoid drifting into general welfare theory. The "Direct Creature" thought experiment will serve as the ultimate arbiter: if our intuitions about that creature are clear, the fate of the Dynamic Unity Hypothesis will be sealed.

  I am prepared to accept that the project may prove that Hedonism requires a revision of what "Intrinsic Value" means. If the Dynamic Unity Hypothesis is true, then value is not a static property of mental states, but a dynamic property of the agent-state relationship. This is a significant philosophical claim, warranting the 6,000-word investigation.

