  *(Self-Correction on Move 1)*: Maya says SSA implies you are likely simulated if sims outnumber biologicals. Actually, the Simulation Argument relies on the *principle of indifference* (a form of SSA). So she is correct in spirit.
  *(Self-Correction on Move 6)*: Leo claims SSA and SIA converge if you restrict the class. This is technically false. SIA *always* favors hypotheses with more observers in the class. SSA is neutral regarding the *total* number, only the *proportion*. So even with a restricted class, they diverge on the "Presumptuous Philosopher" type questions. I need to highlight this error.

