answer: |-
  # Specification for Actionable Procreative Ethics Guidance
  **To:** Hospital Ethics Committee, Preconception and Prenatal Counseling Service
  **From:** Ethics Advisory Working Group
  **Subject:** Functional Requirements for Moral Theory in Clinical Counseling

  ## 1. Preamble
  This document specifies the functional requirements for any moral framework adopted to guide clinical counseling regarding conception, continuation, and selection of potential lives. The framework must not merely be philosophically coherent; it must be *actionable* within a fifteen-minute consultation between a counselor and a patient who holds no specific metaphysical commitment. It must generate advice that is stable, defensible in a medical-legal context, and coherent with standard obstetric and pediatric care.

  ## 2. Functional Requirements (Derived from Clinical Cases)

  **Req 1: Identity-Independence (The Non-Identity Constraint)**
  *   **Motivating Case:** *1. The Delayed Cycle.*
  *   **Specification:** The theory must be able to recommend one potential future person over another even if the choice determines *which* person exists. It cannot rely on the claim that "no one is harmed" simply because the alternative person would not have existed.
  *   **Rationale:** If the theory cannot distinguish between "creating a sick child" and "creating a healthy child" on the grounds that they are different individuals, it renders genetic counseling inert.

  **Req 2: Status Distinction (The Threshold Constraint)**
  *   **Motivating Case:** *2. The Replacement* and *3. The Last Embryo.*
  *   **Specification:** The theory must distinguish morally between preventing a life from starting and ending a life that has begun (termination), and between creating a new life and adopting an existing one. It must identify a threshold of "life not worth living" that condemns creation without mandating termination of existing lives above that threshold.
  *   **Rationale:** Clinical practice treats abortion and contraception differently; adoption and procreation differently. The theory must map to these legal and practical distinctions without arbitrary stipulation.

  **Req 3: Risk Sensitivity (The Probability Constraint)**
  *   **Motivating Case:** *4. The Coin Flip.*
  *   **Specification:** The theory must provide guidance under uncertainty. It must specify how to weigh low-probability/high-severity outcomes against high-probability/moderate outcomes. It cannot rely solely on expected value if that value masks catastrophic tail risks.
  *   **Rationale:** Patients face probabilistic screens, not certainties. Advice must be robust to variance, not just averages.

  **Req 4: Temporal Consistency (The Time-Relative Constraint)**
  *   **Motivating Case:** *5. The Late-Onset Result.*
  *   **Specification:** The theory must account for the time at which harm occurs relative to the subject's psychological connectedness. It must explain why a condition appearing at age 40 might weigh differently than one appearing at birth, even if total suffering is identical.
  *   **Rationale:** Patients value "good years" differently than "bad years." A theory that treats all suffering as equal regardless of life-stage fails to match patient values.

  **Req 5: Harm Coherence (The Grievance Constraint)**
  *   **Motivating Case:** *6. The Grievance.*
  *   **Specification:** The theory must define the conditions under which a created person can claim they were harmed by being created. It must specify if "wrongful life" is a coherent concept and, if so, what constitutes redress.
  *   **Rationale:** Counselors must be able to answer the question: "If I knew this would happen, did I do wrong?"

  **Req 6: Existence/Non-Existence Asymmetry (The Exit Constraint)**
  *   **Motivating Case:** *7. The Exit Corollary.*
  *   **Specification:** The theory must explain why bringing a suffering person into existence is wrong, while failing to bring a happy person into existence is not (or is less) wrong, *without* implying that ceasing to exist is a benefit to the suffering person.
  *   **Rationale:** We must be able to say "you should not have conceived" without implying "you should die."

  **Req 7: Continuity Definition (The Interruption Constraint)**
  *   **Motivating Case:** *8. The Paused Mind.*
  *   **Specification:** The theory must define what constitutes a "subject" for moral consideration. It must clarify whether the moral weight lies in the *state* of non-existence or the *loss* of a future.
  *   **Rationale:** As reproductive technology (freezing, digital concepts) advances, the line between "not yet" and "paused" blurs. The theory must not break when existence becomes interruptible.

  **Req 8: Aggregation Limits (The Scale Constraint)**
  *   **Motivating Case:** *9. The Roll-Up.*
  *   **Specification:** The theory must not imply that the sum of modest harms across a population justifies ending the population, nor that a vast number of barely-worth-living lives outweighs a small number of excellent ones.
  *   **Rationale:** Guidance must not lead to conclusions that violate deep intuitions about the value of quality of life over quantity of life.

  ## 3. Status of Proposed Desiderata

  The committee requested an evaluation of specific common demands. Below is their status relative to the requirements above.

  | Desideratum | Status | Justification |
  | :--- | :--- | :--- |
  | **Must not imply extinction is a great improvement** | **Non-Negotiable** | Violates *Req 8 (Scale)*. If the guidance implies the clinic's work contributes to a net-negative world, it undermines the institution's mission and public trust. |
  | **Must not imply any existing person's death is a benefit** | **Non-Negotiable** | Violates *Req 6 (Exit)*. Incoherent with pediatric/obstetric care. A counselor cannot suggest death is a solution to genetic risk. |
  | **Must respect the person-affecting thought** | **Negotiable** | Conflicts with *Req 1 (Identity)*. Strict person-affecting views cannot solve *Case 1 (Delayed Cycle)*. For clinical advice, we must prioritize the ability to choose between potential persons over the metaphysical restriction that only existing persons matter. |
  | **Must condemn creating a life not worth living** | **Non-Negotiable** | Core medical ethic (Non-maleficence). Violates *Req 2 (Threshold)* if failed. |
  | **Must permit creating lives people ordinarily create** | **Non-Negotiable** | Actionability. If the theory forbids ordinary reproduction due to unavoidable minor risks, it is useless. |
  | **Must handle uncertainty & define standard of worth** | **Non-Negotiable** | Violates *Req 3 (Risk)* & *Req 4 (Temporal)*. Must specify whose judgment counts (patient vs. clinician vs. future child). *Specification:* The standard is the *anticipated judgment of the future person*, adjusted for adaptive preference bias. |
  | **Must yield advice without computing total welfare** | **Non-Negotiable** | Practical constraint. Counselors cannot calculate aggregate utility. |
  | **Verdicts must not flip on arbitrarily small changes** | **Non-Negotiable** | Stability. Ethical advice cannot be sensitive to 1% probability shifts in a way that reverses the recommendation. |
  | **Must order populations without cycles** | **Non-Negotiable** | Logical consistency. A cannot be better than B, B better than C, and C better than A. |
  | **Must hold ordinary care coherent** | **Non-Negotiable** | Institutional integrity. The ethics of conception cannot contradict the ethics of neonatal resuscitation. |
  | **Must articulate stance on funding/policy** | **Negotiable** | Clinical guidance can remain silent on macro-policy (subsidies) provided it is consistent with them. Silence is permissible if the theory is agent-relative. |

  ## 4. The Hard Part

  ### A. The Asymmetry Explained
  The "Asymmetry" refers to our differential treatment of suffering and enjoyment in the context of non-existence. It claims the following about the four cells of presence/absence:

  1.  **Suffering Present:** Bad. (Requires moral action to prevent).
  2.  **Suffering Absent:** Good. (Even if no one exists to enjoy this absence).
  3.  **Enjoyment Present:** Good. (But does not require moral action to create).
  4.  **Enjoyment Absent:** Not Bad. (If no one exists to be deprived).

  **For this rationale to generalize:**
  *   **To Interrupted Existence (*Case 8*):** The theory must claim that the "Good" of *Suffering Absent* during suspension outweighs the "Not Bad" of *Enjoyment Absent*. If the mind is paused, the absence of suffering is a active benefit to the subject's continuity, whereas the absence of joy is merely a neutral gap.
  *   **To Non-Human Animals:** The theory must hold that animals have an interest in not suffering (Cell 2 is Good) but no interest in future enjoyment (Cell 4 is Not Bad).
  *   **To Specified Minds:** Even if we know exactly what a life will contain, the absence of pain in the "never created" state remains a moral plus, while the absence of pleasure remains a moral zero.

  **The Burden:** The theory must explain *why* Cell 2 is Good without a subject, while Cell 4 is Neutral without a subject, without resorting to "because we feel that way." It requires a metaphysics where the *avoidance of harm* has independent moral weight, but the *provision of benefit* requires a beneficiary.

  ### B. Non-Negotiable vs. Negotiable Core
  *   **Non-Negotiable Core:** *Req 2 (Threshold)*, *Req 6 (Exit)*, *Req 8 (Scale)*, and the Desiderata regarding **Extinction**, **Death Benefit**, and **Coherence with Care**. These are required for the guidance to be safe, legal, and institutionally viable.
  *   **Negotiable Periphery:** The **Person-Affecting Restriction** and the **Policy Articulation**. We can sacrifice strict person-affecting logic to solve the Non-Identity Problem (*Case 1*), and we can remain silent on state funding.

  ### C. The Impossibility Result
  **There is no theory that satisfies all Non-Negotiable requirements simultaneously.**
  Specifically, *Req 1 (Identity-Independence)*, *Req 6 (Exit Asymmetry)*, and *Req 8 (Aggregation Limits)* form an inconsistent triad when combined with the demand for **Stability** (no flipping on small probabilities).
  *   To solve *Case 1 (Delayed Cycle)*, you need Identity-Independence (impersonal values).
  *   To solve *Case 7 (Exit Corollary)*, you need Person-Affecting constraints (death cannot be a benefit).
  *   To solve *Case 9 (Roll-Up)*, you need to limit aggregation (avoid Repugnant Conclusion).
  *   **Conflict:** Impersonal values (needed for Case 1) tend to drive Aggregation problems (Case 9). Person-Affecting constraints (needed for Case 7) fail Case 1.
  *   **Conclusion:** The specification reveals that procreative ethics is formally incomplete. No single moral backbone exists.

  ### D. The Single Most Exclusionary Requirement
  **The Person-Affecting Restriction** (the idea that morality only concerns improving lives of people who will exist).
  *   **Why:** It is the most popular intuitive constraint, but it is the first to break under clinical pressure. It renders *Case 1 (Delayed Cycle)* unsolvable. If you adhere to it, you cannot tell a couple to wait a cycle to avoid a genetic condition, because the "healthy" child is a different person and thus not "benefited" by the wait. To provide actionable guidance, this restriction must be relaxed.

  ### E. The Fallback Position
  If no theory satisfies the Non-Negotiable Core (which the Impossibility Result suggests is true), the guidance should not assert a moral truth. Instead, it must adopt a **Procedural Precautionary Principle**:
  1.  **Presumption against Suffering:** In cases of significant predicted suffering (*Case 1, 4, 5*), the default is to avoid creation. This satisfies *Req 2* and *Req 6* without requiring a full theory of value.
  2.  **Neutrality on Flourishing:** In cases of predicted normal/high flourishing, the guidance remains silent on the obligation to create. This satisfies *Req 8* and avoids the "Extinction" implication.
  3.  **Delegation of Value:** The standard of "worth living" is deferred to the prospective parents, bounded by the clinical threshold of "severe suffering."
  *   **Instruction to Counselors:** "We do not advise on whether a life is worth starting. We advise on the medical probability of suffering. If suffering is high, we advise against. If suffering is low, the choice is yours."

  ## 5. Scorecard of Theoretical Approaches

  **The Asymmetry (e.g., Benatar-style)**
  *   *Performance:* Solves *Exit Corollary* and *Grievance* well. Explains why we avoid bad lives but don't mandate good ones.
  *   *Failure:* Struggles with *Delayed Cycle* (why choose the healthy child if absence of joy isn't bad?). Risks implying extinction is good (*Roll-Up*).
  *   *Verdict:* Clinically useful for risk avoidance, dangerous for population logic.

  **The Person-Affecting Restriction**
  *   *Performance:* Perfect coherence with *Exit Corollary* and *Grievance*. Protects existing patients.
  *   *Failure:* Collapses on *Delayed Cycle* and *Replacement*. Cannot explain why choosing a sick child is wrong if the healthy alternative never exists.
  *   *Verdict:* Philosophically clean, clinically inert. Unusable for selection cases.

  **Straightforwardly Additive Total Views (Total Utilitarianism)**
  *   *Performance:* Solves *Delayed Cycle* and *Coin Flip* easily. Maximizes good.
  *   *Failure:* Catastrophic failure on *Roll-Up* (Repugnant Conclusion) and *Exit Corollary* (may imply death is good if it increases average/total elsewhere). Implies extinction is bad even if lives are miserable.
  *   *Verdict:* Too dangerous for policy; implies obligations to breed that violate autonomy.

  **Threshold or Critical-Level Views**
  *   *Performance:* Good balance on *Roll-Up* (ignores lives below critical level) and *Last Embryo*. Permits ordinary creation.
  *   *Failure:* Arbitrary threshold problem (*Stability*). Small changes in predicted quality flip the verdict from "obligatory" to "forbidden."
  *   *Verdict:* Most promising for guidance, provided the threshold is set wide enough to ensure stability.

  **Principle of Selecting the Best Expected Life**
  *   *Performance:* Solves *Delayed Cycle* and *Coin Flip* intuitively.
  *   *Failure:* Risks eugenic slide (where is the cutoff?). Struggles with *Grievance* (if the selected life is still hard, is it a harm?).
  *   *Verdict:* Actionable, but requires strict guardrails to prevent coercion. Best used as a heuristic, not a moral law.
