      *   **Specific Content:** Need to address dyadic vs. collective attitudes, objective vs. reactive stances in institutions, the role of explanation/exemption, and identify a missing issue (e.g., second-order attitudes, self-reactive attitudes).

  2.  **Analyze the Debate Moves:**

      *   **Leah Move 1:** Reactive attitudes are essentially dyadic/personal (direct interaction, goodwill expectation). Restorative justice suppresses these for structured dialogue (objective attitude).
          *   *Strawson Check:* Strawson focuses heavily on interpersonal relationships (personal reactive attitudes), but he *does* acknowledge vicarious or impersonal reactive attitudes (indignation on behalf of others). However, he emphasizes the *participant stance* vs. *objective stance*. Does institutional structure necessarily imply the objective stance? Strawson warns against the "objective attitude" as viewing someone as an object to be managed/treated, not just following rules. Leah claims protocol = objective stance.
          *   *Verdict:* Partially correct/Mistaken. Strawson allows for impersonal/collective indignation. Protocol doesn't automatically equal the objective stance if moral demands are still held.

      *   **Marcus Move 1:** Strawson didn't confine attitudes to private pairs (collective indignation exists). Restorative justice preserves moral demands (accountability, acknowledgement), not clinical detachment.
          *   *Strawson Check:* Correct. Strawson distinguishes personal reactive attitudes (resentment) from vicarious/impersonal ones (indignation). The key to the participant stance is holding someone responsible, not the absence of rules. If the community reaffirms membership and demands accountability, it's a participant stance.
          *   *Verdict:* Correct.

      *   **Leah Move 2:** Channeling emotion through protocol transforms resentment into a procedural instrument = objective stance disguised.
          *   *Strawson Check:* Mistaken. The *expression* can be regulated without the *stance* becoming objective. The objective stance is about *exemption* or *treatment*, not just procedural management. If the goal is moral reintegration based on responsibility, it's not the objective stance (which suspends responsibility).
          *   *Verdict:* Mistaken.

      *   **Marcus Move 2:** Objective attitude = withdrawal from moral community (seeing as broken/childlike). Restorative justice insists on accountability, so reactive structure remains.
          *   *Strawson Check:* Correct. This is the core definition of the objective attitude in "Freedom and Resentment." It involves seeing the agent as not fully responsible (due to psychosis, childhood, etc.). Restorative justice assumes responsibility.
          *   *Verdict:* Correct.

      *   **Leah Move 3 (Hard Case):** Offender had unknown cognitive bias (undermined control) + social conditions they endorsed. Learning this should shift community to objective attitude (explanation dissolves demand).
          *   *Strawson Check:* Partially correct/Mistaken. Strawson distinguishes between *exemptions* (psychological abnormality) and *excuses* (accidental, coerced). A cognitive bias might be an excuse or a partial exemption depending on severity. However, Strawson argues that general determinism (causal explanation) does *not* dissolve demands. Only specific psychological incapacities do. If the bias was "severe... undermining rational control," it leans toward exemption. But if they endorsed the conditions, it complicates it. Leah says explanation *automatically* shifts to objective. Strawson says causal explanation alone doesn't.
          *   *Verdict:* Partially correct (depends on severity) but generally mistaken on the "explanation dissolves demand" rule regarding general causal factors.

      *   **Marcus Move 3 (Hard Case):** Strawson's view isn't about metaphysical freedom but whether we continue to hold expectations. Even with explanation, if offender is competent, reactive demands remain. Shift not automatic.
          *   *Strawson Check:* Correct. This is the heart of Strawson's compatibilism. Causal explanation does not necessitate the objective stance unless it reveals an incapacity that makes moral agency impossible.
          *   *Verdict:* Correct.

  3.  **Determine Overall Winner:**
