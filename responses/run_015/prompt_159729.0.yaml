      *(Refining the "Fatal" objection)*: The most fatal objection isn't that cycles are bad, it's that the *definition* of the relation shifts. If $A > B$ relies on Dimension 1 being salient, and $B > C$ relies on Dimension 2, then the "all-things-considered" metric has shifted. Transitivity applies to a fixed metric. If the metric shifts, you haven't found intransitivity; you've found *contextuality*. This threatens to make the view unfalsifiable or trivial.

