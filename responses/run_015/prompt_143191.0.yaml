  1. Treat the 4am scribble as the only **canon** text; do not dramatize the sleep **scene**.
  2. Use **free indirect discourse** to blur the line between the dream memory and the waking composition.
  3. Let the **narrating instance** contradict itself without labeling it **unreliable narration**.

