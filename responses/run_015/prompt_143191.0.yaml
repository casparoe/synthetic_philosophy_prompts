  Here is the translation of the three positions into the vocabulary of the craft, followed by the residue report on where the analogy holds and where it breaks.

  **Position One: The Common Sense View**
  In this view, the dream is a **scene** that occurred in the **story-present** of the sleeping character. The waking scribble is **summary** or **free indirect discourse** reporting on that **diegetic** event. The **narrating instance** accesses a memory trace of the **narrated event**, making the dream **canon** regardless of the accuracy of the report. The text is a record of a prior **drafting** process that happened in the mind during sleep.
  *Status:* Clean, mostly.
  *Fudge:* Assumes consciousness records **diegesis** like a camera.

  **Position Two: The Wittgenstein/Malcolm View**
  The dream is **unbacked**. There is no **narrated event** preceding the **narrating instance**. The text of the report *creates* the **diegesis** at the moment of inscription; asking for the **scene** behind the **summary** is asking for **fanon** where only **word-of-author** exists. It is not **unreliable narration** because there is no original source text to deviate from. The report is the only **canon**.
  *Status:* Distorted.
  *Fudge:* In fiction, *I* wrote the text, so there is a source. In this view, there is no internal author.

  **Position Three: The Dennett/Cassette View**
  The dream is **backwritten**. The **narrating instance** composes the **narrated event** at the moment of waking, treating the sleep period as **backstory** generated via **retroactive continuity**. Something happens at composition, so it isn't **unbacked**, but the **scene** is drafted simultaneously with the report, not recorded from storage. The **narrating instance** fabricates the **backstory** to justify the **scene** it is currently writing.
  *Status:* Distorted/Clean mix.
  *Fudge:* Implies a "composer" inside the head distinct from the "sleeper."

  **Residue Report**
  The first residue is the Author-God problem. In fiction, there is always an author who really did write the scene, so there's always a real composing event behind the text. In the philosophy, there is no decider inside the head. This is where the analogy collapses.
  The second residue is **unreliable narration**. Craft assumes a truth to deviate from. The second position says there is no truth to deviate from. My vocabulary is too thin to describe "constitutive narration" without implying a prior truth.
  The third residue is the ontology of the text. My text exists on paper. The dream report exists in memory/speech. The physical permanence of the manuscript tricks me into thinking the dream text has the same weight as the dream experience.
  The fourth residue is the distinction between **backwritten** and **unbacked**. In craft, both imply *I* wrote it. In philosophy, one implies a cognitive event, the other implies nothing happened. My vocabulary cannot distinguish between "no source text" and "no cognitive event."

  **Verdict**
  Once it's in my words, the disagreement collapses into a choice about where you place the **narrating instance** relative to the **narrated event**, but the ontological stakes vanish because you're always the Author-God.

