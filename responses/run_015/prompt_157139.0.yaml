answer: |-
  In 2019, the Oakwood community mental health team introduced 'Situational Lag' to describe patients who coped well during crises but collapsed months later, though initially the diagnosis was a messy catch-all applied inconsistently by clinicians who confused it with standard adjustment disorders or delayed grief. Patients labelled with Lag, however, began comparing notes in waiting rooms and online, noticing a specific pattern: not the stress itself, but the precise dissociation between the event and the emotional response, typically peaking at four months. They started reporting this latency period explicitly during consultations, distinguishing themselves from the general anxiety cases who reacted immediately. Clinicians, noticing this reported regularity, stopped diagnosing immediate reactors as Laggers, focusing instead on the delayed cohort. Within three years, 'Situational Lag' was no longer a vague bucket for adjustment issues but a precise predictor of delayed breakdown following redundancy or relocation, stabilising the category not through new tests or rule changes, but because the labelled individuals learned to recognise and report the specific temporal signature that defined them, tightening the kind from the inside out.

  **Loop Stages:**
  1.  **Classification:** Clinicians apply a vague label ('Situational Lag') to a heterogeneous group.
  2.  **Internalisation & Comparison:** Patients adopt the label and share experiences, identifying a common variable (the four-month latency).
  3.  **Feedback:** Patients report this specific variable to clinicians, distinguishing themselves from non-cases.
  4.  **Refinement:** Clinicians use this patient-generated data to exclude non-matching cases, sharpening the kind's predictive power.

  **Single Feature Doing the Work:**
  Collective self-monitoring by the classified group.

  **What's Left if Removed:**
  Without the patients' capacity to identify and communicate the temporal pattern, the category remains a vague, unreliable bucket for general adjustment issues, indistinguishable from noise.

  **The Objection:**
  A theorist who believes human kinds are necessarily moving targets would argue that you haven't demonstrated stability, but merely evolution. They would claim that because the category only became predictive *after* the people changed their behaviour and reporting to fit the theory, the kind itself has shifted; the 'Situational Lag' of 2022 is not the same kind as the 'Situational Lag' of 2019, but a new entity created by the loop. Therefore, the kind remains a moving target, and its current usefulness is just a temporary snapshot of a continuous drift.
