  Analyse China's one-child policy (1979–2015) through the lens of population axiology, especially the repugnant conclusion. I don't want a generic rehearshal of total versus average utilitarianism — map the actual policy logic onto the theory. The state implicitly traded a smaller population for higher per-capita resources; model that trade-off precisely. Then consider whether the gradual relaxation (the 2013 partial loosening, then full abolition in 2015) creates a smooth-continuum problem for anyone defending the policy with a critical-level view. Here's the twist: apply the non-identity problem not to abstract future people, but to the specific cohorts never born versus those who actually grew up with the freed-up resources. Does that save the policy from the repugnant conclusion, or does it just smuggle in a person-affecting constraint that collapses?

  Break it into these sections, roughly these lengths:

  - The mapping (around 250 words): define the population, the welfare metric, and how the policy's numbers sit on the axiology.
  - Where the theory goes slient (around 150 words): coercion, gender imbalance, regional variation — whatever population axiology can't see.
  - The case's verdict (around 150 words): does the episode support, complicate, or undermine the repugnant conclusion?

  Casual tone is fine; British spelling; a typo or two won't hurt.
