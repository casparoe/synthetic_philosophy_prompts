  However, the 2013/2015 relaxation introduces a smooth-continuum problem for CLU defenders. If the critical level $c$ justified restriction, why did it vanish? Did resources surge, shifting the $\mu(N)$ curve? Or did the state admit $c$ was arbitrary? If the policy was axiologically sound in 1980, reversing it suggests the calculus was flawed, not the population ethics. It implies the 'optimal' population point moved without a theoretical shift, exposing the fragility of static axiological thresholds for dynamic demographics. The state traded specific non-existent lives for the welfare of existing ones, a calculation CLU struggles to stabilise over time. This sets the stage for the non-identity question: did resources actually benefit the specific cohort born, or just an abstract average? The relaxation suggests the 'critical level' was merely an economic target, not a moral constant, making the axiological defence wobble when economic winds changed. If the continuum from 1979 to 2015 is smooth, there's no distinct point where the policy became 'wrong', undermining the CLU claim of a fixed critical value.

  **Where the theory goes silent**

  Population axiology treats lives as containers of value, blind to the mechanics of filling them. It can't see the coercion required to enforce the $N$ cap. Forced sterilisations and abortions are negative utility spikes that standard models smooth over. Furthermore, the gender imbalance (118 boys to 100 girls) skewes the welfare metric; axiology assumes interchangeable units, but a society missing women suffers structural welfare losses unaccounted for in simple $\mu$ calculations. Regional variation breaks the model too. Urban elites faced fines; rural poor faced coercion. A national average $\mu$ hides the distributional injustice where the burden of reducing $N$ fell disproportionately on the poor. Axiology asks 'how many?', but ignores 'whose rights?'. It's a calculus without conscience, unable to register the trauma of enforcement as anything other than a temporary dip in $W$. The theory sees an optimisation problem; the reality was a human rights crisis.

  **The case's verdict**

  Does the Non-Identity Problem save the policy? Parfit argues children born under the policy aren't worse off than they would've been, because without it, *they* wouldn't exist. Different sperm, different eggs. So, person-affecting views might say no harm done to the born, who enjoyed the freed-up resources. But this smuggles in a constraint that collapses. It ignores the specific cohorts never born. If we accept this, any policy creating different people is justified if the new people have lives worth living. This avoids the Repugnant Conclusion by changing the subject, not solving it. The relaxation undermines this; if the specific cohorts mattered, why change the rule? Ultimately, the episode complicates the Repugnant Conclusion. It shows states avoid 'Miserable Conclusions' (overpopulation/poverty) aggressively, but using person-affecting logic to justify coercion is bankrupt. It doesn't save the policy; it just hides the cost in the identity of the missing.
