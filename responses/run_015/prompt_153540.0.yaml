prompt: |-
  hey, i'm a software engineer with no formal philosophy traing, trying to understand virtue ethics after running into the situationist critique (the social psych stuff saying character traits dont predict behavior well). i want the desiderata: what must any virtue theory that takes situationism seriously actually deliver to be adequate? list each requirement with the reasoning behind it, mark which are non-negotiable vs camp preferences, and say if any subset is jointly unsatisfiable — especially whether global character traits and full situation-sensitivity can coexist. include cross-situational consistency, local trait activation, moral education, and whether "moral fragmentation" is a real constraint or just jargon. also flag which single requirement does the most damage to a classical aristotelian picture. no citations or reading lists please, just the criteria mapped out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, no formal philosophy training.
      *   **Topic:** Virtue Ethics + Situationist Critique (social psychology challenge to character traits).
      *   **Goal:** Desiderata (requirements) for an adequate virtue theory that takes situationism seriously.
      *   **Format:** List each requirement with reasoning, mark Non-Negotiable vs. Camp Preferences, identify joint unsatisfiability (especially global traits vs. situation-sensitivity), cover specific topics (cross-situational consistency, local trait activation, moral education, moral fragmentation), flag the most damaging requirement to Aristotelianism.
      *   **Constraint:** No citations or reading lists.

  2.  **Deconstruct the Core Conflict:**
      *   *Virtue Ethics (Classical/Aristotelian):* Relies on stable, global character traits (virtues) that predict behavior across diverse situations. A courageous person acts courageously in war, politics, and social settings.
      *   *Situationism (Social Psych):* Empirical evidence suggests behavior is heavily influenced by situational variables (e.g., finding a dime, being in a hurry) rather than stable traits. Cross-situational consistency is low.
      *   *The Task:* What does a virtue theory need to look like to survive this critique?

  3.  **Brainstorming Desiderata (Requirements):**
      *   It needs to explain why people act differently in different situations without abandoning "character."
      *   It needs to allow for moral improvement (education).
      *   It needs to avoid saying morality is just fragmented reflexes.
      *   It needs to account for the empirical data (situationism) while preserving normative force (virtue ethics).

  4.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Empirical Adequacy.* Must align with psych data. (Non-negotiable).
      *   *Req 2: Normative Guidance.* Can't just describe behavior; must prescribe. (Non-negotiable).
      *   *Req 3: Trait Stability vs. Sensitivity.* This is the crux. Can we have both? (Camp Preference/Unsatisfiable tension).
      *   *Req 4: Moral Education.* If traits aren't global, how do we train them? (Non-negotiable for a *virtue* theory).
      *   *Req 5: Fragmentation.* Is the self fragmented? (Camp Preference).

  5.  **Refining the Requirements & Categorization:**

      *   *Requirement 1: Empirical Plausibility.* The theory cannot posit psychological mechanisms that contradic robust social psych findings (e.g., the Fundamental Attribution Error).
          *   *Status:* Non-Negotiable.
      *   *Requirement 2: Cross-Situational Consistency (Modified).* Classical virtue demands high consistency. Situationism denies it. A revised theory needs *some* consistency, but maybe not *global*.
          *   *Status:* Camp Preference (Classical wants high, Situationist-friendly wants low/local).
      *   *Requirement 3: Local Trait Activation.* Traits should be tied to specific contexts rather than abstract "goodness."
          *   *Status:* Non-Negotiable (for a situationist-compatible theory).
      *   *Requirement 4: Moral Education/Development.* Must explain how to cultivate these local traits into something usable.
          *   *Status:* Non-Negotiable (otherwise it's not virtue ethics).
      *   *Requirement 5: Unity of the Self (vs. Fragmentation).* Are we one person or many?
          *   *Status:* Camp Preference (and potential unsatisfiability point).

  6.  **Addressing the "Joint Unsatisfiability" Question:**
      *   Can we have Global Character Traits AND Full Situation-Sensitivity?
      *   *Analysis:* If a trait is truly global (predicts behavior everywhere), it ignores situational variance. If it is fully situation-sensitive (behavior changes with every context), it ceases to be a stable trait.
      *   *Verdict:* They are jointly unsatisfiable in their extreme forms. A middle ground is needed (e.g., "stable dispositions to perceive situations accurately").

  7.  **Addressing "Moral Fragmentation":**
      *   Is it real or jargon? It's a real constraint. If I'm honest at work but dishonest at home, do I have the virtue of honesty? Situationism suggests fragmentation is the norm. Virtue ethics wants unity.
      *   *Verdict:* Real constraint. The theory must explain how to integrate fragments without denying their existence.

  8.  **Identifying the Most Damaging Requirement to Aristotelianism:**
      *   Aristotle relies on the *Unity of Virtues* and stable *Hexis* (state of character).
      *   The requirement for **Low Cross-Situational Consistency** (or the demand that traits are locally bound) strikes at the heart of the Aristotelian "Phronimos" (the wise person who gets it right everywhere).
      *   *Selection:* The demand that traits are *locally bound* rather than *globally predictive*.

  9.  **Structuring the Response:**
