answer: |-
  Here are the desiderata for a virtue theory that integrates the situationist critique, mapped out as system requirements.

  ### 1. Empirical Plausibility
  *   **Requirement:** The psychological architecture of the theory must not contradict robust experimental data regarding human behavior (e.g., the Milgram experiment, the Good Samaritan study). It cannot posit a "will" or "character" that overrides situational variables more often than humans actually do.
  *   **Reasoning:** If the theory describes a psychological mechanism that doesn't exist (e.g., a perfectly stable trait that ignores context), it is descriptively false. A normative theory built on false descriptive premises fails.
  *   **Status:** **Non-Negotiable.** (If it ignores the data, it isn't taking situationism seriously).

  ### 2. Local Trait Activation
  *   **Requirement:** Virtues must be defined as dispositions that are triggered by specific contextual cues rather than abstract, context-independent commands. Courage in a boardroom must be modeled differently than courage in a firefight, even if they share a family resemblance.
  *   **Reasoning:** Situationism shows behavior is highly sensitive to fine-grained environmental details. A theory that treats "Honesty" as a single monolithic function fails to account for why a person might be honest about taxes but dishonest about feelings.
  *   **Status:** **Non-Negotiable.** (This is the core architectural shift required to accommodate the critique).

  ### 3. Cross-Situational Consistency (Modified)
  *   **Requirement:** The theory must explain why we still attribute character to people despite low behavioral consistency. It must posit a consistency in *perception* or *reasoning* rather than just raw *output*.
  *   **Reasoning:** If there is zero consistency, there is no character, only reflex. To remain "virtue ethics" and not just "behavioral conditioning," there must be a stable internal state, even if external outputs vary.
  *   **Status:** **Camp Preference.** (Classical Aristotelians demand high behavioral consistency; Situationists demand low consistency. A hybrid theory must find a middle ground, usually by shifting consistency from *action* to *attention*).

  ### 4. Moral Education and Cultivation
  *   **Requirement:** The theory must provide a viable pathway for moral improvement. It must explain how to train "local traits" without requiring a lifetime of exposure to every possible situational variable.
  *   **Reasoning:** Virtue ethics is inherently practical; it is about becoming good. If situationism implies we are slaves to context, moral education becomes impossible. The theory must explain how to build "meta-skills" that allow agents to navigate new situations correctly.
  *   **Status:** **Non-Negotiable.** (Without this, it is a descriptive psychology, not an ethical system).

  ### 5. Integration vs. Moral Fragmentation
  *   **Requirement:** The theory must address whether the moral self is a unified agent or a collection of context-specific modules. It must determine if "fragmentation" is a bug to be fixed or a feature to be managed.
  *   **Reasoning:** Situationism suggests we are fragmented (honest at work, dishonest at home). Classical ethics suggests we should be unified. The theory must decide if unity is a realistic goal or a regulatory ideal.
  *   **Status:** **Camp Preference.** (This is the main battleground between "Revisionist Virtue Ethicists" and "Classical Defenders").

  ---

  ### Joint Unsatisfiability Check: Global Traits vs. Full Situation-Sensitivity

  **Are they jointly unsatisfiable?**
  **Yes, in their extreme forms.**

  *   **Global Character Traits:** Implies that if you possess Virtue V, you will express V across a wide range of disparate situations (Trait Stability).
  *   **Full Situation-Sensitivity:** Implies that behavior is primarily determined by situational variables, not internal traits (Context Dominance).

  **The Conflict:** You cannot have a system where internal states are the primary predictor of behavior (Global Traits) AND a system where external contexts are the primary predictor of behavior (Full Situation-Sensitivity). One variable must yield predictive priority.

  **The Engineering Compromise:**
  To make them coexist, you must downgrade "Global Traits" from *behavioral predictors* to *perceptual filters*.
  *   *Solution:* The trait does not guarantee the *action* (because the situation might be overwhelming); instead, the trait guarantees the *assessment* of the situation.
  *   *Result:* A virtuous person isn't someone who always wins; it's someone who correctly identifies the moral stakes, even if they sometimes fail to act due to situational pressure. This preserves the trait (in the mind) while accepting the situationist data (in the behavior).

  ---

  ### Is "Moral Fragmentation" a Real Constraint or Jargon?

  **Verdict:** It is a **Real Constraint.**

  *   **Why it's not jargon:** It describes a structural limitation in human cognitive architecture. We do not have a single "moral processor" that runs in the background. We have heuristics tied to specific environments (work-mode, home-mode, stranger-mode).
  *   **The Constraint:** Any adequate theory must account for the "transfer problem." Learning to be patient with your children does not automatically transfer to patience with slow drivers.
  *   **Implication:** If a virtue theory assumes transferability (that learning honesty in one domain makes you honest in all), it fails the fragmentation constraint. It must treat moral development as modular training, not a global software update.

  ---

  ### The "Kill Shot" to the Classical Aristotelian Picture

  **Single Requirement:** **Local Trait Activation (over Global Predictability).**

  **Why this does the most damage:**
  Aristotle's picture relies on the **Unity of Virtues** and the concept of *Hexis* (a stable state of character). In the classical view, if you truly have the virtue of Courage, you possess a stable disposition that manifests reliably across relevant situations. The *Phronimos* (person of practical wisdom) gets it right consistently because their character is integrated.

  Demanding **Local Trait Activation** shatters the Unity of Virtues. It implies you can be courageous in physical danger but cowardly in social confrontation, and still be "virtuous" in the first domain. It turns virtue from a state of *being* (a global property of the agent) into a set of *skills* (context-bound competencies).

  *   **Classical View:** Virtue is who you *are*.
  *   **Situationist-Compatible View:** Virtue is what you *do* in specific contexts.

  This shifts virtue ethics from an ontology of the self to a taxonomy of behaviors, which fundamentally undermines the Aristotelian goal of *Eudaimonia* (flourishing) as a unified life project. If the self is fragmented, the "good life" cannot be a unified whole, but merely a successful management of conflicting fragments.
