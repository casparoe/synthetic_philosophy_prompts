      *   Specific topics covered? (Consistency, Local Activation, Education, Fragmentation). Check.

  11. **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I distinguish between "Non-Negotiable for *any* virtue theory" vs "Non-Negotiable for a *situationist-compatible* virtue theory." The prompt asks for the latter ("what must any virtue theory that takes situationism seriously actually deliver").
      *   *Refinement on Fragmentation:* Clarify that fragmentation isn't just "hypocrisy," it's structural.
      *   *Refinement on Unsatisfiability:* Be clear that the *extreme* versions are unsatisfiable, but a hybrid is the goal.

