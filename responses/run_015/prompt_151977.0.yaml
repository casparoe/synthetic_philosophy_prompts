      *   *Is it Dostoevsky?* He posits that humans are *anti-homeostatic*. We seek disruption.
      *   *Conclusion:* Control theory assumes the goal is stability (minimizing error). Dostoevsky argues the human goal is sometimes *meaning*, which requires the possibility of instability. Therefore, humans are not linear time-invariant systems. They are adaptive, non-linear, and sometimes intentionally destabilizing.

