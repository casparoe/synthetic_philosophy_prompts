      *   *Love/Relationship:* The silence of Jesus implies a relationship beyond input/output. A controller doesn't love the plant.
      *   *The "Why":* Humans sometimes *want* oscillation. They want to test the limits. A system trying to maximize error is unstable by definition, but humans do it intentionally.

  5.  **Task 3: Analyzing the Missing Piece:**
