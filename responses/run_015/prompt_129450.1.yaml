prompt: |-
  Illustrate a conceptual tension in the debate over separating artistic value from moral culpability. Describe a hypothetical case in which an artwork's internal aesthetic logic—perhaps through ironic detachment or transgressive framing—derives its artistic force from reflecting a creator's genuine moral corruption, but the biographical evidence for that corruption only surfaces long after the work's canonization. Explain why this scenario is especially troublesome for both autonomist claims that formal properties alone determine value and moralist claims that knowledge of the artist's vice necessarily diminishes appreciation. Do not invoke specific historical artists or works.
