answer: |-
  **Stage 1: Candid Brainstorm**

  The genuinely hard question is not whether the object persists metaphysically, but which metaphysical category the legal term "object" designates. Non-specialists assume metaphysics dictates identity; in reality, the law must select the sortal. The load-bearing work is done by the donor's intended sortal (Artifact vs. Matter), not the persistence conditions themselves. If the donor meant "this matter," the museum is in trouble; if they meant "this statue," they are safe.

  The candidate loci of disagreement are: (1) whether the bequest tracks form or matter; (2) whether intermittent existence voids "display"; and (3) whether administrative rules can override metaphysical vagueness. My own answer will turn on a stipulation: I must stipulate that absent explicit clarification, legal bequests of artworks default to artifact sortals (statues), not material sorts (lumps), unless the continuous-matter clause is adopted to override this. Metaphysics alone cannot settle the legal intent.

  **Stage 2: Considered Advice**

  **The Coincidence View**
  On this view, the Statue and the Lump are numerically distinct. (i) Regarding breach: If the bequest tracks the Statue, there is no breach; the form survived the 1974 disassembly (c) and the resin replacement (a) preserves function. If it tracks the Lump, there is a breach, as the original matter is largely in boxes (b). (ii) Kind of thing: The display condition attaches ambiguously. Common sense suggests "Statue," but the heirs will argue "Lump." (iii) The continuous-matter clause (d) is not metaphysical clarification; it is a forced selection of the Lump sortal. Surprisingly, this view implies the museum currently displays the *Statue* but holds the *Lump* in storage. Satisfying the bequest under clause (d) would require displaying the boxes, not the figure.

  **The One-thing View**
  Here, identity is sortal-relative. "Same object" is incomplete without "same *what*?" (i) Breach is indeterminate until the committee chooses the sortal. (ii) Kind of thing: The committee is unknowingly making a metaphysical choice by debating the clause. Rejecting (d) implies the sortal is 'Artifact'; adopting it implies 'Material Aggregate'. (iii) The clause does no metaphysical work; it legislates identity conditions. The surprising implication is that the committee isn't discovering facts about identity; they are creating them. The 1974 disassembly (c) is metaphysically irrelevant for artifacts (watches survive disassembly), but legally risky if "display" implies assembled presence. The breach depends entirely on which sortal they retroactively assign to the 1897 donor.

  **The Pluralist View**
  Many coinciding objects exist. The bequest picks one via description. (i) Breach: "The Kneeling Scribe" typically picks the artifact-like object (survives resin replacement), not the matter-like object (survives squashing, fails resin replacement). Thus, no breach for the artifact, breach for the matter-object. (ii) Kind of thing: The donor's language failed to specify *which* of the many objects was meant. (iii) The clause (d) is a referential shift. It attempts to change the bequest's target from the artifact-object to the matter-object. Unlike Coincidence, which says both exist simultaneously, Pluralism says the donor's language was imprecise, requiring legal intervention to fix the reference.

  **Implications of (c)**
  The 1974 disassembly is metaphysically less significant than the material replacement (a). Artifacts survive parts separation; lumps do not survive shape loss. However, if "display" requires visual integrity, (c) creates a temporary breach of condition, not identity. Non-specialists fear (c) destroys the object; metaphysics says (a) is the real identity threat for material sortals.

  **Conclusion and Stipulation**
  The single most important implication I would put before the committee is this: **The continuous-matter clause does not clarify identity; it changes the *referent* of the bequest from the artifact to the material aggregate.** This favors the heirs under all three views if the clause is adopted, because the aggregate is in the boxes, not on the plinth.

  Explicitly, my claim that legal bequests default to artifact sortals is **stipulative**. Metaphysics allows either; law must choose. I stipulate the default to demonstrate that clause (d) is an active override, not a clarification. Without this stipulation, the metaphysics remains neutral, and the committee faces a purely legal decision disguised as ontological inquiry. The metaphysics tells you what *can* persist; the bequest tells you what *matters*.
