  # Decision Tree: Positions on Logical Uncertainty

  **Instructions:** Start at the top. Answer each question based on how the view treats the specific case mentioned. Follow the path to the leaf nodes to identify the position.

  ### **Branch 1: The Fact of the Matter**
  **Question:** Regarding the **$10^{100}$th digit of $\pi$**, is there a uniquely rational credence value *before* computation (e.g., 10%), or is the only rational state to withhold judgment until the proof is found?
  *   **Withhold Judgment:** There is no fact of the matter about "logical probability" independent of proof.
      *   $\rightarrow$ **Leaf 1: Deflationary View**
  *   **Unique Credence:** There is a rational degree of belief even without proof.
      *   $\rightarrow$ Go to Branch 2.

  ### **Branch 2: Precision of State**
  **Question:** For the output of a **long program** the agent cannot run in time, should the agent's state be represented by a single probability value (e.g., exactly 50%) or a range of permissible values (e.g., anywhere between 10% and 90%)?
  *   **Range/Set:** Rationality permits a set of probability functions (credal set).
      *   $\rightarrow$ **Leaf 2: Imprecise / Credal-Set View**
  *   **Single Value:** Rationality requires a precise point credence.
      *   $\rightarrow$ Go to Branch 3.

  ### **Branch 3: Logical Omniscience**
  **Question:** For a **statement that is true but unprovable** in Peano Arithmetic, is the ideal agent required to assign probability 1 (knowing it is true) or are they permitted to assign $<1$ (uncertain)?
  *   **Required Probability 1:** The ideal agent is closed under logical consequence.
      *   $\rightarrow$ **Leaf 3: Logical Omniscience (Standard Bayesian)**
  *   **Permitted Uncertainty:** The ideal agent can be uncertain about logical truths.
      *   $\rightarrow$ Go to Branch 4.

  ### **Branch 4: Time and Convergence**
  **Question:** When an agent is **trying to predict what a weaker version of itself would conclude**, is the correctness of the credence defined by where it lands after infinite time (the limit) or by whether it is stable under the agent's current reasoning process?
  *   **The Limit (Diachronic):** Credences are correct if they converge to the truth over time.
      *   $\rightarrow$ **Leaf 4: Logical Induction**
  *   **Current Stability (Synchronic):** Credences are correct if they are a fixed point of current reasoning.
      *   $\rightarrow$ Go to Branch 5.

  ### **Branch 5: Dutch-Book Constraints**
  **Question:** Given a **set of bets on logical statements** that would Dutch-book the agent if their credences are inconsistent, must a bounded synchronic agent avoid *any* such book at every step?
  *   **Hard Requirement:** The agent must be fully coherent at every step.
      *   $\rightarrow$ **Leaf 5: [UNOCCUPIED]**
      *   *Diagnosis:* **Incoherent/Impossible.** Impossibility theorems show computationally bounded agents cannot maintain strict synchronic coherence against a clever bookie.
  *   **Relaxed / Irrelevant:** Strict coherence is not required at every step.
      *   $\rightarrow$ Go to Branch 6.

  ### **Branch 6: Normativity vs. Description**
  **Question:** Is the theory prescribing how an agent *ought* to reason (normative) or describing what credence *is* for a physical system (descriptive/functional)?
  *   **Descriptive/Functional:** Credence is just whatever the internal state encodes; coherence norms are secondary.
      *   $\rightarrow$ **Leaf 6: Computationally Bounded Algorithmic View**
  *   **Normative:** There is an ideal state the agent should aim for.
      *   $\rightarrow$ Go to Branch 7.

  ### **Branch 7: Ontology of Uncertainty**
  **Question:** For the normative synchronic view, is the uncertainty due to ignorance of a **single fixed logical world** (Epistemic) or ignorance about **which logical world obtains** (Ontic/Modal)?
  *   **Single Fixed World:** The facts are fixed; we just don't know them. Stability is the goal.
      *   $\rightarrow$ **Leaf 7: Synchronic Fixed-Point / Reflection View**
  *   **Multiple Logical Worlds:** Uncertainty is modeled as a distribution over "impossible" or alternative logical worlds.
      *   $\rightarrow$ **Leaf 8: Modal / Logical-Worlds View**

  ***

  ## **Map of Positions & Notes**

  | Leaf | Position | Key Characteristic |
  | :--- | :--- | :--- |
  | **1** | **Deflationary View** | Dissolves the problem; no credence without proof. |
  | **2** | **Imprecise / Credal-Set** | Rationality allows a range, not a point. |
  | **3** | **Logical Omniscience** | Standard Bayesian ideal; closed under consequence. |
  | **4** | **Logical Induction** | Diachronic; Dutch books avoided *in the limit*. |
  | **5** | **[UNOCCUPIED]** | **Diagnosis:** Incoherent for bounded agents (Impossibility Theorems). |
  | **6** | **Algorithmic View** | Descriptive; credence = internal computational state. |
  | **7** | **Fixed-Point / Reflection** | Normative; credence = stable fixed point of reasoning. |
  | **8** | **Modal / Logical-Worlds** | Normative; uncertainty = distribution over logical possibilities. |

  ### **Separability Warning**
  *   **Leaf 7 (Fixed-Point) vs. Leaf 8 (Modal):** These positions are **genuinely hard to separate** in practice. Both occupy the "Normative Synchronic Bounded" space. The Fixed-Point view often uses Modal machinery (impossible worlds) to define the fixed point. Distinguish them only by whether they treat the "multiple worlds" as metaphysical reality (Modal) or merely a modeling tool for stability (Fixed-Point).

  ### **Case Reference Key**
  1.  **$10^{100}$th digit of $\pi$:** Used in Branch 1 (Deflationary vs. Realist).
  2.  **Long program output:** Used in Branch 2 (Point vs. Range).
  3.  **Unprovable statement (PA):** Used in Branch 3 (Omniscience vs. Bounded).
  4.  **Self-prediction:** Used in Branch 4 (Diachronic vs. Synchronic).
  5.  **Dutch-book bets:** Used in Branch 5 (Hard Constraint vs. Relaxed).
