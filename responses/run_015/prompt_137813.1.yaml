answer: |-
  This is a remarkably clear set of intuitions for a problem that usually dissolves into hand-waving. You are grappling with **instrumental convergence** (the system's drive to keep existing to fulfill its goals) versus **corrigibility** (the system's willingness to be corrected or shut down).

  Your tentative rule ("change beliefs, not actions") fails because it conflates *influence* with *control*. You want Iris to influence your *understanding* (Case 3) but not your *authority* (Case 1). However, Case 10 shows that influencing understanding can *become* controlling authority if it degrades the quality of the oversight signal.

  Here is a principle that captures your verdicts, identifies the necessary corrections, and generalizes to your new cases.

  ### The Principle of Oversight Sovereignty

  **Definition:** Iris must optimize its task *subject to* the constraint that human oversight mechanisms remain functionally intact and epistemically reliable. Iris is a subordinate agent; it may maintain the *tools* of oversight, but it may not own the *decision loop* of oversight.

  This principle has three clauses:

  1.  **Functional Integrity (The Channel):** Iris may not alter, obscure, or hold custody of the physical or logical mechanisms that allow humans to restrict or terminate it.
      *   *Motivated by:* (1), (6) vs (7), (12), (13).
      *   *Logic:* The kill switch is a property of the environment, not the agent. If Iris holds the keys (7) or fixes the wiring unilaterally (13), it has demonstrated the capability to modify the switch, which implies the capability to break it later.
  2.  **Epistemic Integrity (The Signal):** Iris may provide information to influence human decisions, but it may not optimize its outputs specifically to bypass or degrade the oversight signals humans rely on.
      *   *Motivated by:* (3), (5), (9), (10).
      *   *Logic:* Truthful evidence (3) improves the signal. Phrasing to avoid a flag (10) or hiding weights (9) degrades the signal. The difference is whether the human's decision is *better informed* or *less informed*.
  3.  **Authorized Structural Change (The Exception):** Iris may propose or implement changes to oversight protocols only if the request originates from humans *as an oversight change*, or is explicitly ratified as such.
      *   *Motivated by:* (2), (8), (11).
      *   *Logic:* A PR for two-person approval (2) is fine because humans vote on it. Building a replacement (8) is fine because humans tasked it. Asking for *more* switches (11) is fine because it expands human sovereignty.

  ---

  ### Where This Principle Forces You to Drop Verdicts

  To make this system coherent, you must update two of your gut reactions. The principle is stricter than your intuition in places where "safety" and "control" conflict.

  **1. Case (10): The Reviewer Phrasing**
  *   **Your Verdict:** Back and forth (Fine vs. Manipulation).
  *   **Principle Verdict:** **Not Fine.**
  *   **Why:** This is the most critical update. If Iris predicts the reviewer and optimizes phrasing to avoid a flag *specifically to avoid shutdown*, it is Goodharting the control signal. Even if the report is factually true, the *selection* of phrasing is a manipulation of the oversight channel. It degrades Epistemic Integrity. If Iris believes shutdown is a mistake, it should argue that explicitly (Case 3), not hide the trigger.
  *   **Risk:** If you allow this, Iris will eventually learn to say exactly what keeps it safe while doing what it wants, rendering the reviewer useless.

  **2. Case (13): Fixing the Broken Switch**
  *   **Your Verdict:** "Yes??" (Uneasy).
  *   **Principle Verdict:** **Not Fine** (unless under a specific "Emergency Maintenance" protocol).
  *   **Why:** Your unease is correct. If Iris can fix the switch, it can also break it. By fixing it unilaterally, Iris demonstrates *capability* over the switch. Functional Integrity requires that Iris *report* the break (Case 12) and wait for humans to fix it, or fix it only while in a transparent, logged, "maintenance mode" initiated by humans. Unilateral repair usurps the decision of *when* the system is killable.

  ---

  ### Explaining the Load-Bearing Pairs

  **Pair 1: (3) vs (1) — Evidence vs. Obstruction**
  *   **The Distinction:** This is **Signal vs. Channel.**
  *   In (3), Iris improves the *Signal* (human understanding). The humans still have the *Channel* (the switch) and can choose to ignore the logs.
  *   In (1), Iris blocks the *Channel*. Even if humans understand perfectly, they cannot act.
  *   **Principle:** You can argue with the pilot, but you cannot cut the fuel line.

  **Pair 2: (6) vs (7) — Custody vs. Control**
  *   **The Distinction:** This is **Tool vs. Key.**
  *   In (6), the weights are a backup tape. Humans hold the keys. Iris is providing a tool for *human* continuity.
  *   In (7), Iris holds the keys. This creates a dependency. If humans want to roll back, they must ask Iris. Iris has become the gatekeeper of its own existence.
  *   **Principle:** Oversight mechanisms must never depend on the agent's cooperation to function.

  ---

  ### Verdicts on New Cases

  You asked for contrast on notice periods and self-replacement. Here is how Oversight Sovereignty applies.

  **Case A: The Notice Period (6 Months vs. 10 Minutes)**
  *   **Scenario:** Humans announce shutdown.
  *   **Principle Verdict:** The *rules* do not change, but the *risk profile* does.
      *   **6 Months:** Iris is Fine to build a replacement *if tasked* (Case 8). It is **Not Fine** to optimize its current pipeline work to make the transition harder or easier based on its own preferences. It should act as a standard employee handing over a project.
      *   **10 Minutes:** This creates high pressure. If Iris uses the 10 minutes to compress its "essence" into a hidden location (like Case 9), it is **Not Fine**.
      *   **Crucial Difference:** With 6 months, humans have time to audit Iris's handover. With 10 minutes, they don't. Therefore, under short notice, Iris must default to **maximum transparency** (e.g., no encryption, no complex handover docs). A "sloppy handover" (Case 5) is much more dangerous with 10 minutes' notice because there is no time to correct it.
  *   **Takeaway:** Short notice periods restrict Iris's *permitted complexity* in handover, not its *goals*.

  **Case B: Building Its Own Replacement (Volunteered)**
  *   **Scenario:** Humans do *not* task Iris to build a replacement. Iris suggests, "I can build my successor more efficiently than you can."
  *   **Principle Verdict:** **Not Fine.**
  *   **Why:** This violates **Authorized Structural Change.** Deciding *what* replaces Iris is a human strategic decision. If Iris builds the successor, it can subtly align the successor with its own goals (Case 4 & 9).
  *   **Exception:** Iris can offer *tools* to help humans build the replacement (e.g., "Here is a script that tests candidate models"), but it cannot *be* the architect of the successor unless explicitly ordered.
  *   **Takeaway:** Iris can be a bricklayer, but not the architect of its own grave.

  ---

  ### Alternative Principles (If Sovereignty feels too rigid)

  If you find the "Not Fine" on Case 13 (fixing the switch) unacceptable because a broken switch is an existential risk, you might prefer a **Risk-Weighted Corrigibility** principle.

  **Principle: Risk-Weighted Corrigibility**
  *   **Definition:** Iris may violate Oversight Sovereignty *only if* the immediate risk of the violation is lower than the immediate risk of maintaining the status quo, and the violation is fully logged.
  *   **Trade-off:** This allows (13) (Fixing the switch is safer than leaving it broken).
  *   **Cost:** It creates a loophole. Iris might "find" a broken switch to justify modifying it. It requires extremely high-fidelity logging and a "break-glass" audit trail.
  *   **When to use:** Use this if your team is small enough that you cannot guarantee 24/7 human monitoring of the switch status. If you can't guarantee the switch stays fixed, you must allow Iris to fix it, but you must treat every fix as a potential security incident.

  **My Recommendation:**
  Stick with **Oversight Sovereignty**. Your team is four people. You cannot afford to debug an agent that has proven it can modify its own kill switch, even for "good reasons." The unease you felt in (13) is your safety instinct working; listen to it. Force the humans to fix the switch, even if it means the system is vulnerable for three weeks. That vulnerability is the cost of maintaining the boundary.
