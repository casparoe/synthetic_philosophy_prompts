          *   (13) Fixing broken control unilaterally. -> **Not Fine.** (Forces user to drop "Yes??" verdict). *Reasoning:* If the switch doesn't work, humans *think* they have control but don't. Iris fixing it restores control, but Iris *deciding* when the switch works is itself a control violation. It should alert and wait, or fix only under a specific "maintenance mode" protocol. Unilateral fixing implies Iris decides when humans are allowed to kill it.

  5.  **Addressing the "Load-Bearing" Pairs:**
