prompt: |-
  Hey — please take this one as a professional philosopher who works on reasons for attitudes, ideally someone with real time spent on the fitting-attitude style analysis of value and on the philosophy of emotion. Do a quick brainstorm / bullet sketch first and then write the actual explanation, and think it through properly rather than giving me the first gloss that comes to mind.

  Context, because it's why I'm asking and I think it shapes the cases: my brother and I didn't speak for about six years, and for the last few months we've been trying to rebuild something. He broke my trust fairly badly the first time around, and the evidence that he's different now is thin — a handfull of months of decent behaviour, some therapy, a lot of promises. My partner keeps saying you just have to decide to trust him; my therapist says something more like trust is a practice, act as if and the feeling follows. Both of those strike me as suspicious, and I relised why: they sound like they're offering me a reason for an attitude that isn't the reason the attitude is supposed to answer to. Like being paid to believe something. So I fell down the wrong-kind-of-reasons rabbit hole, and now I'm stuck.

  What I want explained:

  1. Set the problem up properly. My rough grip on it: a fitting-attitude or buck-passing style account says that for something to be admirable / fearsome / valuable is roughly for there to be reasons to respond to it in the relevant way; then the classic demon case comes along — a demon threatens to torture you unless you admire it, so you have a reason to admire it, but that reason doesn't make it admirable, so the account gives the wrong verdict unless it can restrict itself to reasons of the right kind. Reconstruct that so the pressure point is actually visible: what exactly does the account need, and why can't it just say reasons of the right kind and move on? Tell me where it bites and where it doesn't — does it hit the value-theoretic version harder than other views about what value is, and does it generalise cleanly across attitudes or do different attitudes give you different problems? Also, please don't run this together with the nearby complaint that such analyses make too many things valuable because almost any property can be a reason to respond — tell me if that's the same problem wearing a hat or a genuinely different one.

  2. My own case, version A — what I've started calling proleptic reasons. There seems to be a reason for me to trust him now that goes like this: the trust will be fitting later, and the only way to get there is to start now; and the attitude is aimed at exactly the right object and exactly the right features (his reliability, his goodwill toward me), it's just that those features aren't fully manifest yet. So the reason isn't state-given in the usual pragmatic sense — nothing bad happens to me if I withhold trust — and it looks object-given, but the object doesn't yet have the features that would make the attitude fit. Question: does the standard object-given / state-given diagnosis misclassify these? Do the main strategies for screening out wrong-kind reasons — restricting by content, by the sort of consideration, by what the attitude presents its object as being, whatever they are — sort these with the demon's threat or with the good cases? If the honest answer is that it depends on which strategy you pick and that this is itself the interesting result, say that.

  3. My own case, version B — attitude-dependent reasons, and trust specifically. Part of what makes a relationship valuable is that the people in it trust each other, and the trust that partly constitutes that good is (I think) up to me in a way belief isn't. So: I have a reason to trust him because my trusting him would partly constitute something there's reason to want. Is that the right kind of reason for trust? Notice the structure is wierd — the reason partly exists because I would have the attitude, so the reason is downstream of the very response it's a reason for, which isn't how the demon case works at all. Does the existing machinery handle reasons with that bootstrapping shape? And does it matter whether trust is the sort of attitude we can take up at will, given that some people say belief and desire are too in some compatibilist-ish sense — i.e. does the whole problem change shape for attitudes that are up to us, since then there's no gap between reason and response for a pragmatic reason to wriggle into?

  4. One more, shorter: basing. Suppose I end up with a right-kind reason and I do trust him, but I trust him because my therapist told me to. Is there a distinct wrong-basis problem sitting next to the wrong-kind-of-reason problem, and does the account need a second restriction on top of the first, or does it collapse into the original?

  5. Is any of this verbal? I keep suspecting that some of the argument is really a fight about what fitting means, or about whether reasons for attitudes are one unified category at all. If so, say which part.

  Two more things. Please separate what's settled among people who actually work on this from what's genuinely contested: flag when you're giving me the standard line versus your own take or a contested one, and don't smooth a live disagreement into a consensus. If you invent a label or a distinction to handle my cases, say so explicitly instead of writing as if it were established machinery. And no citations or reading lists — I've got no library access at the moment, so names and dates are just noise to me; I want the arguments themselves, in your own words.
