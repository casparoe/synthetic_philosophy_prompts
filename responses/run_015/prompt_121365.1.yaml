prompt: |-
  Draft the joint statement of an adversarial collaberation between a virtue ethicist and a situationist psychologist. Theyve been arguing for years about whether moral character traits are ontologically real and normatively central, or whether theyre largely narrative constructs imposed on situation-driven behaviour. I want something genuinely in the weeds — dont just rehearse the standard Milgram-and-Aristotle script, but inject some more niche framing, like treating moral identity integration as a moderating variable rather than a global trait.

  The document should have:
  1. A numbered agreed-claims section. Both sides sign off on the actual empirical findings about cross-situational consistency (e.g. personality coefficients in the .3 range, the power of framing in bystander-type experiments), on the fact that virtue ethics needs some form of dispositional stability but not necessarily perfect uniformity, and on the distinction between predicting behaviour and explaining it.
  2. A disagreements table. Each sides position phrased in wording theyd accept. One disagreement should be whether low consistency correlations defeat trait ontology or just show traits are domain-specific and narrower. Another should be about whether moral expertise can exist without globally stable dispositions — maybe via situation-indexed competence.
  3. The cruxes. Identify at least two: (a) whether naturalness of trait-expression has independent normative weight, and (b) whether integrating moral identity across contexts is itself a trait or a meta-cognitive skill. For each crux, present one concrete hypothetical case or empirical pattern both agree is relevant, then record each sides prediction about what the case/pattern shows.
  4. A brief section saying which parts of the dispute are verbal — for instance, if theyre using character in different senses (moral vs psychological) — and why that doesnt dissolve the whole disagreement.

  Please write in British English, avoid asking for bibliographies or citations, and keep the tone casual — a typo or two is totally fine.
