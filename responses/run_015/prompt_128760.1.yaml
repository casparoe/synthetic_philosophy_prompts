  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the fit and the friction. Dennett's taxonomy is evolutionary/developmental; the Creature is abrupt/synthetic. This tension is the core of the analysis.

      *   **Darwinian Layer (The Missing Foundation):**
          *   Dennett: Hard-wired instincts.
          *   Creature: He has a body (biology) but no *evolutionary* history. He has instincts (hunger, cold) but no species-typical behaviors.
