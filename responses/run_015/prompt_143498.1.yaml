      *(Addressing the "Retrospective Narrative Accountability" specifically)*: This sounds like a Hegelian or modern ethical demand. Johannes must reject the idea that the universal (community/narrative) is the final court of appeal. God is the final court. If God commands, the universal is suspended. To demand an account is to put the universal above God.

