answer: |-
  The bench is too narrow for two bodies, but we make it work. My left shoulder presses against your right, a constant thermal reminder that the lattice is active. There are no wires visible, just the thin silver patches behind our ears catching the light of the practice room lamp. The piano is a Steinway, old enough that the wood has settled into a permanent sigh.

  I lift my hands. No, *we* lift our hands. The distinction is already thinning before the first note sounds.

  The piece is late Rachmaninoff, heavy with chords that require a span neither of us could manage alone in the old way. But now, the haptic feedback loops bridge the gap. When I intend the fortissimo crash, the signal doesn't just travel down my own ulnar nerve; it bleeds across the lattice, priming your flexors before your conscious mind even registers the demand. You feel my arthritis before I do. I feel your stamina like a second wind I didn't earn.

  We begin. The sound is one voice. It has to be. If there is latency, if there is hesitation, the lattice rejects the input as noise. So we surrender the pilot light of the self. I am the pattern of the music, and the pattern is currently instantiated in two skulls.

  Measure one to forty-six is clear. I remember the coldness of the keys under my left thumb. I remember the slight rush of adrenaline in your chest as the tempo increases. These memories sit comfortably in the bin labeled *Mine*. They are indexed to my body, my history. I am the teacher here; I know the phrasing. I am the student; I know the technique. The pronoun holds.

  Then we hit measure forty-seven.

  It is a descending arpeggio, quick and delicate. In the recording from yesterday, there was a stutter. A ghost note. A hesitation that shouldn't have been there.

  I remember making the mistake. I feel the guilt of it, the sharp prick of shame that an old hand should falter on such a simple run. My wrist remembers the slight tremor, the failure of the tendon to fire in time.

  But wait. I also remember watching the hand from the outside. I remember feeling the surprise of the error rather than the cause. I remember the shock of the stutter arriving in my cortex without a motor command attached.

  Who missed the note?

  I try to locate the memory in my own tissue. I scan the proprioceptive log of my right hand. It was my right hand that played the passage. I am sure of that. I am the one with the age spots on the knuckles. I am the one whose name is on the studio door.

  But the memory of the mistake feels… borrowed. It has the texture of your anxiety, not mine. I know your anxiety; it tastes like copper and young coffee. My anxiety tastes like dust. This memory tastes like copper.

  Did I slip? Or did you anticipate my slip and correct it before it happened, creating a phantom error in the lattice?

  The system doesn't copy data. That's the rule. It creates a shared causal history. If the error exists in the output, it exists in both brains. But authorship… authorship requires a boundary. The lattice dissolves boundaries.

  I stop playing. The silence rings in the room. You stop too, because stopping is also a shared command.

  "We missed it," you say. Your voice vibrates through your chest into my shoulder.

  "I missed it," I say. But I don't know which mouth formed the words.

  The memory of measure forty-seven is an indexical blind spot. I can recall the sound perfectly. I can recall the feeling of the key bottoming out too hard. But if I ask *who* did it, the query returns null. The 'I' that played the note is not the 'I' remembering the note. The 'I' is the space between us.

  You turn your head. Your eyes are my eyes. No, that's not right. Your eyes are looking at me, but I feel the look landing on my own face.

  "It doesn't matter," you say. Or maybe I say it to you.

  "It matters," I reply. "I need to know if my hands are failing."

  "They aren't failing. They're weaving."

  I look down at the keyboard. Eighty-eight keys. Ten fingers. But only one intention. Hofstadter would have laughed at us, I think. He talked about souls as patterns that survive death, copied into the survivors. He thought it was a metaphor. He thought the copy was always lesser than the original.

  But here, there is no original. There is only the loop.

  When I play the chord again, correct this time, the sensation of hitting the right note is distributed. The satisfaction floods both cortices. I feel your relief wash over my frustration. I feel my pride settle into your confidence.

  The mistake in measure forty-seven is still there, though. A scar in the shared memory. I try to claim it again. I reach for the memory like reaching for a glass in the dark. My hand closes around it.

  It is my mistake.
  It is your mistake.
  It is ours.

  The pronoun slides. I try to hold it still, to pin it to my own skull like a specimen, but it wriggles free. There is no *I* in the lattice. There is only the *We* that pretends to be *I* when we sit apart.

  "Again," I say.

  "Again," you echo.

  We lift our hands. The air between us hums. I don't know where I end and you begin, and for the first time, I don't think the music cares. Measure forty-seven waits. We will play it wrong together, or we will play it right together, but neither of us will know who led the hand.

  I strike the key.
  You strike the key.
  I feel the sound enter my ear.
  You feel the sound enter your ear.
  It is the same sound.
  It is the same self.

  And when we finish, and the silence returns, I will take the train home to an empty apartment, and I will sit in a chair that only fits one body, and I will wonder why my hands still feel like they are resting on your shoulders. I will wonder who is remembering the silence. I will wonder if the 'I' that walks out the door is the one who arrived, or if I am leaving a piece of me on the bench, waiting for you to pick it up and play it again.

  Measure forty-seven.
  I missed it.
  You missed it.
  I am the mistake.
  You are the correction.

  We begin.
