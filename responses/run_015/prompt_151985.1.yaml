      *   **Deflationism and JTB:** Can a deflationist hold JTB? Yes. $S$ knows that $p$ iff $S$ believes $p$, $S$ is justified in believing $p$, and $p$. The "and $p$" does the work. It doesn't need a robust property. It just needs the fact that $p$ obtains.
      *   **The Normative Distinction:** How to distinguish knowledge from justified false belief?
          *   JFB: Belief + Justification + $\neg p$.
