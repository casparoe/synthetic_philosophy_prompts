answer: |-
  Your line of reasoning is a sophisticated and common objection to deflationism, often referred to as the "normativity objection" or the "value problem." However, the conclusion that a consistent deflationist *must* abandon the tripartite analysis (JTB) or retreat into pragmatism/coherentism rests on a specific misunderstanding of what deflationism denies.

  The short answer is: **No, a consistent deflationist need not reject the tripartite analysis, nor must they adopt a pragmatic theory of knowledge.** They can preserve the normative distinction between knowledge and error while maintaining that truth is not a substantive property.

  Here is a detailed breakdown of why your inference encounters friction with standard deflationary accounts, and how deflationists preserve epistemic normativity.

  ### 1. Correcting the Premise: Deflationism vs. Elimination
  Your argument hinges on this claim: *"If this redundancy claim is correct, then it seems there can be no metaphysically robust distinction between a belief being true and its being false."*

  This is the critical pivot point. Deflationists (like Paul Horwich, Hartry Field, or Michael Williams) do **not** deny that there is a distinction between a true belief and a false belief. They deny that the *word* "true" picks out a robust, causal, or natural **property** that explains that distinction.

  *   **The Substantive View:** Belief $B$ is true because it possesses the property of *Truth* (which corresponds to Reality).
  *   **The Deflationary View:** Belief $B$ (that snow is white) is true because snow is white.

  For the deflationist, the distinction between a true belief and a false belief is simply the distinction between **$p$** and **$\neg p$**.
  *   If I believe snow is white, and snow is white, my belief is true.
  *   If I believe snow is white, and snow is black, my belief is false.

  The "metaphysical weight" of the distinction is carried by the **world** (the fact that snow is white), not by the **property of truth**. Therefore, deflationism does not collapse the distinction between truth and falsity; it merely relocates the metaphysical heavy lifting from the concept of *truth* to the **facts** themselves. A deflationist can be a robust realist about snow and its color while remaining a deflationist about truth.

  ### 2. Deflationism and the Tripartite Analysis (JTB)
  Because the distinction between $p$ and $\neg p$ remains intact, the deflationist can retain the JTB formula. They simply interpret the "T" condition disquotationally.

  *   **Traditional JTB:** $S$ knows that $p$ iff $S$ believes $p$, $S$ is justified in believing $p$, and $p$ is **True**.
  *   **Deflationary JTB:** $S$ knows that $p$ iff $S$ believes $p$, $S$ is justified in believing $p$, and **$p$**.

  In the deflationary reading, the truth condition does not add a mysterious property to the belief. It simply insists that the content of the belief must obtain.
  *   **Justified False Belief:** $S$ believes $p$, $S$ is justified, but $\neg p$.
  *   **Knowledge:** $S$ believes $p$, $S$ is justified, and $p$.

  The normative distinction between these two states is preserved entirely by the **factivity** of knowledge. Knowledge requires the world to be a certain way; justified belief only requires the subject to have good reasons. The deflationist argues you do not need a "substantive property of truth" to enforce this requirement; you only need the law of non-contradiction and the way the world is.

  ### 3. Preserving Normativity Without Substantive Properties
  Your worry seems to be that if "truth" isn't a robust property, it cannot serve as a **normative goal**. If truth is just a logical device, why should we aim for it? Why is knowledge better than justified false belief?

  Deflationists handle this in two main ways:

  **A. The Normativity of Assertion (Commitment)**
  Deflationists often argue that the normativity lies in the practice of assertion and belief, not in the property of truth. To believe that $p$ is, by definition, to hold that $p$ is the case.
  *   If you believe $p$, you are committed to $p$.
  *   If $\neg p$, your commitment is violated by the world.
  *   The "error" in false belief is not the lack of a property; it is the **mismatch** between the mind and the world.
  Therefore, the normative force comes from the **aim of belief** (which is to represent the world), not from the intrinsic value of the property "truth."

  **B. Instrumental Value**
  Some deflationists (like Field) argue that truth is valuable instrumentally. True beliefs generally lead to successful action.
  *   Belief: "There is water in the cup."
  *   Action: Drink.
  *   If the belief is true ($p$), you quench thirst. If false ($\neg p$), you do not.
  The "success" is explained by the causal powers of water and physiology, not by the metaphysical nature of truth. Thus, knowledge (reliable true belief) is epistemically superior because it tracks the world successfully, even if "truth" is merely a disquotational device.

  ### 4. Must They Turn to Pragmatism or Coherentism?
  You ask if the deflationist *must* replace JTB with a pragmatic or coherence-based account. The answer is **no**.

  *   **Pragmatism/Coherentism:** These theories usually redefine truth (e.g., truth *is* ideal justification, or truth *is* coherence). This is incompatible with deflationism, which says truth *is not a property to be defined* but a logical device.
  *   **Deflationary Realism:** A deflationist can maintain that knowledge is a relation between a subject and a **mind-independent fact**. They can argue that justification is the process of trying to align belief with fact.

  If a deflationist moves to pragmatism, they are usually doing so for reasons *other* than deflationism (e.g., anti-realism about the external world). Deflationism about truth is compatible with **Robust Realism** about objects and facts. Hartry Field, for example, is a deflationist about truth but an error theorist or fictionalist about other domains; he does not collapse truth into justification.

  ### 5. Where the Tension Actually Lies
  While deflationists *can* keep JTB, there is a genuine philosophical tension, though it is slightly different from what you proposed. The tension is regarding the **Explanatory Power** of truth in epistemology.

  *   **The Objection:** If truth is just disquotation, it cannot explain *why* justification leads to knowledge. A substantive theory of truth might explain how justification tracks truth (e.g., via causal connections). A deflationist cannot say "justification tracks the property of truth."
  *   **The Deflationist Reply:** We don't need truth to explain the link. We need reliable cognitive processes. We can say "Justification (conceived as reliability) leads to $p$." We don't need to mention "truth" as an intermediary entity.

  Consequently, some deflationists (like Timothy Williamson) actually reject JTB, but not because truth is insubstantial. They reject it because they believe **Knowledge is Prime** (the "Knowledge First" program). For Williamson, knowledge is a mental state in its own right, and analyzing it into belief + truth + justification is a mistake regardless of one's theory of truth.

  ### Conclusion
  A consistent deflationist is not forced to abandon the tripartite analysis or adopt pragmatism.
  1.  **Distinction Preserved:** The distinction between true and false belief is preserved as the distinction between $p$ and $\neg p$ (facts), not as a difference in properties.
  2.  **JTB Compatible:** The "T" in JTB functions as a factivity condition ($p$), which requires no substantive property.
  3.  **Normativity Intact:** The normative force of knowledge comes from the aim of belief (representing the world) and the success of action, not from the metaphysical weight of "Truth."

  The deflationist argues that you are attributing too much work to the *word* "true." Once you realize the work is actually done by the *world* (the facts), you can see that a thin concept of truth is sufficient to ground a robust distinction between knowledge and error.
