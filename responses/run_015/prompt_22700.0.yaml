answer: |-
  Here is a sequence of six questions designed to press the panelist on the strictness of the duty to aid, tailored to your role as a graduate moderator. The tone is rigorous and respectful, assuming familiarity with the literature while targeting the specific underdeveloped areas you identified in her book.

  ### Question 1: The Moral Kind of the Duty
  "Thank you for your presentation. I'd like to begin by examining the analogy at the heart of your argument. You argue that the duty to save a nearby drowning child is of the same **moral kind** as the duty to donate to effective charities aiding distant strangers. However, the phenomenology of these duties feels distinct: the former presents as an immediate emergency obligation, while the latter often feels like a ongoing distributive commitment. If the duty is truly strict in both cases, does your account require us to treat the failure to donate not just as a moral failing, but as a kind of continuous moral emergency comparable to walking past a pond every day?"

  *   **Likely Answer:** She will likely argue that moral intuition is unreliable and that the underlying principle (preventing bad outcomes at modest cost) remains identical regardless of psychological feel.
  *   **Follow-up:** "If the principle is identical but the psychological experience differs so radically, does your theory risk being self-defeating? If agents must view every donation opportunity as a moral emergency to fulfill the strict duty, does that induce a paralysis or burnout that ultimately reduces the practical efficacy you aim to maximize?"

  ### Question 2: Negative vs. Positive Duties
  "Moving to the structure of the obligation: critics often rely on the distinction between negative duties (not to harm) and positive duties (to aid). You classify the duty to aid as strict, akin to a negative duty. Does the **strictness** of this duty depend on collapsing the omission/commission distinction entirely? In other words, if we maintain that letting die is morally distinct from killing, does that necessarily weaken the strictness of the duty to aid, or can a positive duty be just as stringent as a negative one without erasing the distinction?"

  *   **Likely Answer:** She will likely maintain that consequences are what matter morally, so the omission/commission distinction is irrelevant to the *stringency* of the duty, even if it remains descriptively useful.
  *   **Follow-up:** "If the distinction is morally irrelevant to stringency, does this expand the scope of our agency unmanageably? If I am as responsible for foreseeable starvation as I am for poisoning a well, does the sheer volume of potential 'omissions' dilute the force of the duty, making it difficult to prioritize which strict duties to fulfill first?"

  ### Question 3: The Arbitrary Distance Objection
  "I want to press you on the **arbitrary distance objection**. In your book, you respond to this by suggesting distance is a matter of 'practical efficacy, not moral kind.' However, this seems to paper over the problem of moral salience. If distance is morally irrelevant, but efficacy is the only filter, does the duty become contingent on technological or logistical changes? For instance, if a new technology made aiding distant strangers 10% more efficient, does the *moral duty* itself shift, or merely our ability to fulfill it?"

  *   **Likely Answer:** She will likely argue that the *content* of the duty shifts based on efficacy (we ought to do the most good possible), but the *source* of the duty remains stable.
  *   **Follow-up:** "But if the content of the duty shifts with logistics, doesn't that render the moral landscape unstable? It suggests that my moral obligations today might differ from tomorrow's based solely on supply chain improvements, which seems to ground a strict moral duty in contingent empirical facts rather than normative principles."

  ### Question 4: Defining "Modest" Sacrifice and Authority
  "This leads to my concern regarding the demandingness objection. You argue the duty extends only to 'modest' sacrifices, not all surplus income. I have two related questions here: First, **what metric counts as 'modest'** is left undefined—is it a percentage of income, a threshold of utility, or a quality-of-life baseline? Second, **who gets to draw that line**? Is it the agent, the recipient, or an idealized observer? Without clarity here, the 'modesty' clause risks becoming a loophole for agents to under-contribute."

  *   **Likely Answer:** She will likely suggest a hybrid approach: a reasonable agent in ideal conditions would determine the threshold based on where marginal utility begins to significantly decline for the giver.
  *   **Follow-up:** "If we rely on a 'reasonable agent' in non-ideal conditions like ours, aren't we simply importing the very biases your theory seeks to overcome? If the agent draws the line, the strictness of the duty becomes subjective; if an external body draws it, does that not infringe on the moral autonomy your account tries to preserve?"

  ### Question 5: Strictness and Moral Overload
  "Continuing on the implications of strictness: If we accept that the duty to aid is strict and not supererogatory, we face the problem of moral overload. If I must always prevent bad things at modest cost, does my life cease to be my own? How does your account accommodate **personal projects and integrity** without relegating them to the supererogatory? If the duty is strict, does it not demand that personal projects are only permissible insofar as they do not interfere with the maximum efficient aid I could provide?"

  *   **Likely Answer:** She will likely argue that personal projects are instrumentally valuable for maintaining long-term efficacy and mental health, so they are protected within the "modest" sacrifice limit.
  *   **Follow-up:** "But that makes the value of personal projects purely instrumental. If a project doesn't aid efficacy, must it be discarded? This suggests that on your view, human beings are essentially vessels for utility distribution, which seems to conflict with the value of individual integrity that often grounds our moral theories."

  ### Question 6: Evidence Against Strictness
  "Finally, I'd like to ask about the falsifiability of your position. You argue for a strict moral duty based on the drowning child intuition. **What empirical or philosophical evidence would count against the strictness of this duty?** For example, if empirical studies showed that strict individual duties undermine institutional development in recipient countries, or if philosophical argument showed that the drowning child intuition relies on a cognitive bias specific to proximity, would you revise the strictness of the duty, or is the principle insulated from such counter-evidence?"

  *   **Likely Answer:** She will likely concede that if aid causes harm (empirical) or if the intuition is proven fundamentally flawed (philosophical), the duty would need revision.
  *   **Follow-up:** "Given that current empirical data on aid efficacy is mixed and often context-dependent, does that not imply the duty is currently too indeterminate to be action-guiding? If the strictness depends on contested empirical claims, should we be acting on a presumption of strictness, or a presumption of caution?"
