  4.  **Drafting Replies & Calibration:**

      *   *Calibration:* I need to be honest. The "Turing depends on Darwin" claim is *not* standard. It's a novel synthesis, which means it's contested by default. The "Comprehension Debt" is very close to "robustness" or "out-of-distribution generalisation." I must admit this.
