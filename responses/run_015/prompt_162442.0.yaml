answer: |-
  **Setting:** *A conference room, late afternoon. A whiteboard is covered in logarithmic plots. Nadia and Owen sit across a table littered with printouts of Monte Carlo simulations.*

  **Nadia:** The median path is clear. We bet twenty percent. We end with roughly \$1.5 million. We don't build the lighthouse.

  **Owen:** And if we bet everything?

  **Nadia:** Then we need four consecutive wins to clear the \$10 million threshold. That happens thirteen percent of the time. The other eighty-seven percent, we have zero.

  **Owen:** Thirteen percent is better than two. Your Kelly strategy gives us a two percent chance of hitting the target. I'm looking at the expected value of the lighthouse. If the lighthouse is built, it saves lives. If it isn't, it doesn't. The beneficiaries don't care about our geometric growth rate; they care about the expected number of lives saved. That is linear in the probability of success. To maximize that probability in this specific regime, we have to bet bigger than you're comfortable with.

  **Nadia:** But "bigger" isn't "everything." You're conflating maximizing the probability of the goal with maximizing expected dollars. If we bet everything for all twenty rounds, our expected terminal wealth is \$38 million. But the probability of success is $0.6^{20}$. That's four in a hundred thousand. You're chasing a one-in-twenty-seven-thousand path where we end up with a trillion dollars. That single outlier carries the entire expectation. It's a St. Petersburg paradox wrapped in a foundation charter.

  **Owen:** It's not a paradox if the payoff is real. Look, your objection rests on the idea that we are a single, isolated trajectory. But suppose there were a thousand foundations like ours, all facing this same opportunity. If they all pool their capital and bet according to my arithmetic expectation, the law of large numbers kicks in. The aggregate wealth grows at the arithmetic rate. We could effectively buy the lighthouse for sure by diversifying across the ensemble.

  **Nadia:** But there *aren't* a thousand foundations. There is one. We live in time, not in an ensemble. Ruin is absorbing. Once we hit zero, we don't get to be part of the average next year. The geometric mean isn't just a risk preference; it's the time-average growth rate of a single system.

  **Owen:** That's true for infinite horizons. But we have twenty rounds. The classical literature you rely on proves log-optimality asymptotically. It says nothing about $n=20$. In finite time, especially when the target is far above the median, the log-optimal policy is not necessarily the probability-maximizing policy. You know that. To hit \$10 million, we need a growth rate of $\ln(10)/20$, which is $0.115$ per round. Kelly only delivers $0.02$. You are admitting that Kelly *cannot* achieve the goal in expectation. So why fetishize the rate?

  **Nadia:** Because when the goal exceeds the maximum sustainable growth rate, you enter a large-deviation regime. "Grow as fast as possible" is the only coherent instruction left. But "fast" doesn't mean "all-in." It means finding the specific fraction that maximizes the tail probability. And that fraction is still not the one that maximizes expected dollars. Your EV-maximizing stake is so aggressive it practically ensures ruin.

  **Owen:** Agreed. I'll concede that point. If the target is \$10 million, maximizing expected dollars is a disastrous policy. It yields a high number on a spreadsheet and a failed mission in reality. The EV norm breaks down when the target requires a large deviation. But that doesn't vindicate Kelly. It just means both norms fail at the extremes.

  **Nadia:** Let's test the other extreme. Suppose the board adds a secondary project. A warning beacon. Cost: \$1.1 million. Deadline: same twenty rounds.

  **Owen:** That requires a growth rate of $\ln(1.1)/20$. Roughly $0.005$ per round.

  **Nadia:** Exactly. Kelly delivers $0.02$. If I maximize geometric growth here, I'm taking on variance I don't need. To maximize the probability of hitting \$1.1 million, I should bet *less* than the Kelly fraction. I should be more conservative.

  **Owen:** So you're admitting Kelly is overaggressive for attainable goals?

  **Nadia:** I'm admitting that Kelly is a phase boundary. When the required rate is below the maximum attainable rate, the optimal strategy is to minimize variance to secure the win. You bet small. When the required rate is above the maximum, as with the lighthouse, you must accept variance to have any chance at all. You bet big. Kelly sits exactly at the transition where you maximize the growth rate itself. It's not a universal norm. It's the solution to a specific constraint: maximize long-run growth without a fixed target.

  **Owen:** And my position?

  **Nadia:** Your position works when we can pool risk. If we could split our million across independent bets, or merge with other foundations, the arithmetic and geometric pictures converge. The log rule reappears as mere risk management for the pooled entity. But we can't.

  **Owen:** So we are stuck. If I argue for expected dollars, I recommend a strategy that fails 99.996% of the time. If you argue for Kelly, you recommend a strategy that fails 98% of the time. We are arguing over the shape of the failure.

  **Nadia:** Not just the shape. The ontology. You treat the foundation as an ensemble average. You think the "value" of the decision is the sum of outcomes weighted by probability. I treat the foundation as a time path. The "value" is the outcome of the one trajectory we actually traverse.

  **Owen:** But why is the trajectory the moral unit? If the beneficiaries are numerous and their utility is linear, the expected utility calculation *is* the moral calculation. The fact that *we* go bust is a tragedy, but if the policy were adopted by all rational agents in our position, the aggregate good would be higher.

  **Nadia:** But we aren't "all rational agents." We are the trustees of this specific endowment. The charter doesn't grant us the authority to sacrifice this trajectory for a hypothetical ensemble. It grants us authority over *this* money.

  **Owen:** And the charter mandates the lighthouse. It implies a preference for a 13% chance of success over a 2% chance.

  **Nadia:** Only if 13% is the maximum achievable. If betting 40% per round gives us 15%, then Kelly is wrong. But betting 100% gives us 0.004%. So EV is wrong.

  **Owen:** Then what is the norm?

  **Nadia:** The norm is to identify the regime. If the target is low, minimize variance. If the target is impossible, maximize the tail. Kelly is just the boundary between them.

  **Owen:** So the disagreement isn't about the math. We agree on the probabilities. We agree on the payoffs.

  **Nadia:** No. The disagreement is about what constitutes the "agent." Is the agent the single path through time, subject to absorbing ruin? Or is the agent a probability distribution over possible worlds, where ruin is just one weighted outcome among many?

  **Owen:** And until we decide that, we can't decide the bet.

  **Nadia:** Precisely. You want to maximize the average of the outcomes. I want to maximize the outcome of the average path. In this room, with this money, those are no longer the same thing.

  **Owen:** Then we aren't arguing about rationality. We're arguing about whether this foundation is a statistic or a story.

  **Nadia:** And whether we survive to tell it.
