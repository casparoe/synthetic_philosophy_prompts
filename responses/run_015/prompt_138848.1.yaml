answer: |-
  This is a sophisticated reconstruction of the "One Big Firm" objection to the Socialist Calculation Debate (SCD). It is essentially a *reductio ad absurdum* that has been floated by market socialists (like Lange) and institutional economists (like Coase) for nearly a century.

  Your study group has correctly identified the tension, but I believe **Step (5)** is the break point. Rejecting it saves the Misesian argument without forcing you to claim that General Motors is a socialist nightmare incapable of arithmetic.

  Here is the breakdown of why (5) fails, why your bond scheme doesn't quite solve the problem it thinks it does, and what the debate is actually about.

  ### 1. The Weak Link: Reject Step (5)
  Step (5) relies on a Sorites paradox (the heap paradox): if internalizing 10% of transactions works, and 20% works, then 100% must work. This assumes that the *mechanism* of calculation remains constant as scale increases. The Austrian rebuttal is that the mechanism qualitatively changes once you cross the boundary from "firm within a market" to "economy as a firm."

  **Why (5) is false:**
  Firms calculate successfully (Step 4) not because they have magic internal pricing powers, but because they **import prices from the outside.**
  *   When Ford decides whether to make more bumpers or more doors, it uses "shadow prices" for steel, labor, and machinery.
  *   Where do those shadow prices come from? They are imputed from the **external market prices** of steel, labor, and machinery.
  *   Ford knows the opportunity cost of using a ton of steel for a bumper because it knows what that ton of steel would sell for on the open market.

  If you internalize 100% of the economy (Step 6), the external market disappears. There is no longer an outside reference point to anchor the shadow prices. You can still do the arithmetic (Step 1), but the numbers you are plugging into the equation are arbitrary. You know how many tons of steel a bridge takes, but you have no way to know if that steel is *more valuable* than the tractors it could have made, because there is no trading process to reveal that preference.

  **The Cost of Rejecting (5):**
  You must accept that there is a **qualitative discontinuity** between a firm and an economy. You lose the intuition that "management is management, whether at scale 1 or scale 1,000,000." You have to concede that firms are *parasitic* on the broader price system; they can exist and calculate only because they float in a sea of external market prices.

  ### 2. Keeping Step (4): Firms are not Socialist
  You want to keep (4) because the alternative implies big firms are hopeless. You should keep it, but with a caveat: **Firms calculate, but they do not solve the economic calculation problem.**

  The "Calculation Problem" is not about solving simultaneous equations (math); it is about discovering **opportunity costs** (economic value).
  *   **Inside a firm:** Opportunity costs are *accounted for* based on market data.
  *   **Inside a socialist state:** Opportunity costs must be *guessed* because there is no market data.

  So, (4) is true: GM can calculate. But GM can only do so because GM is not the whole economy. If GM swallowed the entire US economy, GM's accounting department would suddenly be blind.

  ### 3. Evaluating Your "Fix": The Bond Scheme
  Your proposal is: *Managers post bonds; their consumption claims rise or fall with the profit/loss of their division.*

  This is a clever attempt to solve the **Incentive Problem** (Principal-Agent problem), but it does not solve the **Calculation Problem** (Knowledge Problem).

  **Why it doesn't work:**
  For your bond scheme to work, "Profit" must be a meaningful number.
  *   Profit = Revenue - Costs.
  *   In a capitalist firm, Costs reflect the opportunity cost of resources (determined by market bidding).
  *   In your socialist bond scheme, who sets the "Cost" of the capital goods the manager uses?
      *   **If the State sets them:** They are arbitrary. A manager can show a "profit" by using resources that are actually scarce and valuable elsewhere, simply because the State underpriced them. The manager eats the loss/gain, but the signal is wrong.
      *   **If Managers trade the rights to use capital:** Then you have recreated a market in capital goods.

  **Does it smuggle ownership back in?**
  **Yes.**
  If managers can trade their bonds, or if their claims on future consumption are transferable based on the performance of specific assets, you have effectively recreated **property rights in income streams.**
  *   If the bonds are *non-transferable*, the manager has an incentive to maximize the number given to them, but they still lack the information to know *how* to do that (because prices are missing).
  *   If the bonds *are transferable* (to allow for liquidity or risk diversification), you have created a capital market. If you have a capital market where claims on assets are bought and sold, you have prices for capital goods. If you have prices for capital goods, you have (a form of) capitalism.

  So your intuition is correct: the scheme smuggles ownership back in. But this validates Mises, it doesn't refute him. Mises argued you need property rights to get prices. You found a way to get prices by creating quasi-property rights (claims on consumption). You haven't escaped the calculation argument; you've conceded that you need market-like property claims to generate the data required for calculation.

  ### 4. What was the argument actually about?
  You wrote: *"If that's enough, socialism is out of the argument — but then I can't see the the argument was ever about calculation at all, which smells wrong to me."*

  It smells wrong because it *was* about calculation, but calculation is impossible without the institutional framework that generates the data.

  *   **Mises's Point:** You cannot calculate without prices.
  *   **Hayek's Addition:** You cannot get prices without competition and property rights (because prices encode dispersed knowledge).
  *   **Your Bond Scheme:** You try to get calculation by fixing incentives.

  The debate is often mischaracterized as "Can computers solve the equations?" (Lange's view). It is actually "Where do the numbers in the equations come from?" (Mises/Hayek's view).

  If your bond scheme creates a market for those bonds, you have admitted that **markets are necessary for calculation.** If the scheme does not create a market, you have admitted that **incentives are not enough without information.**

  ### Summary Recommendation
  1.  **Reject Step (5).** The transition from partial internalization to total internalization destroys the external reference frame required for shadow pricing.
  2.  **Keep Step (4).** Firms calculate, but they rely on the broader market ecosystem to provide the valuation of their inputs.
  3.  **Refine your Fix.** Acknowledge that your bond scheme only works if it effectively recreates a market in claims on assets. If it does, it validates the Misesian claim that you need property-like claims to generate prices. If it doesn't, it solves incentives but leaves the knowledge problem unsolved.

  The argument *was* about calculation, but it reveals that calculation is not a technical act of arithmetic; it is a social process of discovery that requires specific property institutions. You cannot separate the math from the institutions that generate the numbers.
