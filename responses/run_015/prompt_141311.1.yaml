answer: |-
  # Specification for an Adequate Theory of Biological Function

  **Objective:** To define the necessary conditions any account of biological function must satisfy to be viable within a philosophy of biology seminar, distinguishing between constraints imposed by scientific practice and constraints imposed by philosophical preference.

  ### I. Core Distinctions
  An adequate theory must structurally accommodate the following distinctions without collapsing them:
  1.  **Function vs. Mere Effect:** Must distinguish why a trait is *for* X (function) versus why it merely *does* Y (side effect), even if Y is beneficial.
  2.  **Having vs. Performing:** Must allow that a trait can *have* a function even if it is currently unable to *perform* it (dysfunction).
  3.  **Token vs. Type:** Must distinguish the function of a specific individual trait (token) from the function characteristic of the kind (type).
  4.  **Function vs. Current Contribution:** Must distinguish what a trait is *supposed* to do from what it *actually* contributes to the system right now.

  ### II. The Four Test Cases & Derived Requirements
  Each case generates a specific requirement. The classification indicates whether the requirement is driven by scientific necessity or theoretical preference.

  **1. The Proto-Heart**
  *   **Case:** The very first heart-like pump in an evolutionary lineage, which circulated fluid before any selection history could accumulate for that specific trait.
  *   **Requirement:** **Ahistorical Capacity.** The theory must allow for function attribution based on current systemic contribution or design, even in the absence of a selection history.
  *   **Classification:** **Imported/Contested.** This demand is imported from *engineering* and *forward-looking evolutionary modeling*. While SE (Selected-Effect) theorists reject this as a confusion of "cause" with "function," CR (Causal-Role) theorists insist it is non-negotiable for explaining evolutionary origins.

  **2. The Synthetic Protein**
  *   **Case:** A protein designed *de novo* in a lab and wired into a synthetic cell, performing a metabolic task no natural lineage has ever been selected for.
  *   **Requirement:** **Lineage Independence.** Function must be assignable to traits created by intelligent design or random assembly if they integrate into a goal-directed system, without requiring a history of natural selection.
  *   **Classification:** **Smuggled (CR Camp).** This is often a demand smuggled in by proponents of systemic accounts who want biology to align with *artifact function*. Strict biological naturalists argue synthetic biology is an edge case that should not break the definition of *natural* function.

  **3. The Surgical Muscle Flap**
  *   **Case:** A muscle surgically moved from the leg to the face to restore a smile; it now performs a task (facial expression) it never performed in its evolutionary or developmental history.
  *   **Requirement:** **Contextual Plasticity.** The theory must allow the function of a *token* trait to diverge from the function of the *type* based on its current systemic context.
  *   **Classification:** **Imported from Medicine.** This is non-negotiable for *clinical practice* (surgeons must know what the flap is *for* now), but it conflicts with strict *typological* views in evolutionary biology where function is fixed by lineage.

  **4. The Failing Heart**
  *   **Case:** A heart suffering from cardiomyopathy that can no longer pump blood effectively, yet is still described as "failing to perform its function."
  *   **Requirement:** **Normativity (Dysfunction).** The theory must ground the distinction between "malfunctioning" and "functioning differently." It must explain how a trait can fail to do what it is supposed to do without ceasing to be that trait.
  *   **Classification:** **Non-Negotiable.** This is required by *medicine* and *pathology*. Without this, the concept of disease collapses into mere statistical deviation.

  ### III. The Incompatible Pair (The Tension)
  **Flagged Tension:** **Ahistorical Capacity (Case 1 & 2) vs. Normativity (Case 4).**
  *   **Reason:** To satisfy **Normativity**, you need a standard independent of current performance (usually history or a goal) to judge the failing heart as "broken." To satisfy **Ahistorical Capacity**, you must allow function without history (the proto-heart).
  *   **Conflict:** If you ground the norm in *history* (to save Dysfunction), you lose the Proto-Heart (no history yet). If you ground the norm in *current capacity* (to save the Proto-Heart), you lose the Failing Heart (if it can't pump, it has no capacity, so no function). Joint satisfaction requires a hybrid theory that risks circularity or dualism.

  ### IV. Account Scoring

  **Selected-Effect (Etiological) Account**
  *   **Score:** This account secures the **Normativity** requirement perfectly by grounding function in past success, making dysfunction intelligible as a failure to meet historical standards. However, it fails the **Ahistorical Capacity** and **Lineage Independence** requirements, rendering the proto-heart and synthetic protein functionless until selection acts, which contradicts biological practice in origins research and synthetic biology.

  **Causal-Role (Systemic/Dispositional) Account**
  *   **Score:** This account successfully handles the **Proto-Heart** and **Synthetic Protein** by locating function in current causal contributions to a containing system. However, it collapses the **Normativity** distinction, struggling to explain the **Failing Heart** because if the trait cannot currently contribute, the theory implies it lacks the function entirely rather than malfunctioning.

  ### V. The Knock-Out Requirement
  **The Single Requirement:** **Normativity (Dysfunction).**
  *   **Reason:** This is the requirement that eliminates the most otherwise-plausible theories. While many accounts can explain what traits *do* (capacity), very few naturalistic accounts can explain why a trait *ought* to do something without smuggling in teleology or relying on a history that excludes novel functions. It is the graveyard of purely systemic, dispositional, and propensity-based accounts.
