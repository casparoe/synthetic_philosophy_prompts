answer: |-
  **Project Title:** The Capacity Condition of Subsidiarity: A Dynamic Test for Federal Competence

  **Research Question and Conceptual Frame**
  The central research question is precise and admits a determinate answer: Does a coherent principle of subsidiarity require an affirmative duty of capacity-building at the higher level before claiming competence based on lower-level incapacity?

  Current debates treat subsidiarity as a static threshold: can the lower unit do this now? If no, the higher unit acts. My project challenges this by introducing a temporal variable. I frame the contrast between the "abstention reading" (higher level stays off) and the "enablement reading" (higher level helps lower level become capable) not as two principles in tension, but as one principle with a neglected dynamic dimension. The abstention reading is the operational rule for a single moment; the enablement reading is the maintenance condition required to keep the principle coherent over time. Without the enablement condition, the abstention rule becomes self-defeating: competences are retained on paper while being hollowed out in fact because standards, money, and expertise drift upward. At that point, the test for whether the lower unit could do the job has a self-fulfilling answer. This project asks whether the principle logically collapses without a prior investment requirement.

  **Why Existing Answers Leave This Open**
  Standard legal tests fail to capture this dynamic because they are designed as static snapshots. The European Union's test asks whether objectives can be "better achieved" at Union level; the German Basic Law turns on whether federal legislation is "necessary" (*Erforderlichkeit*); American arguments focus on enumerated powers or conditions attached to federal money. All three ask about current capacity, not potential capacity. They ignore the history of how capacity drifted upward in the first place.

  Furthermore, political process theory assumes that federalism is adequately protected because states represent themselves in the central legislature. This ignores administrative hollowing: a state may have a vote in the upper chamber but lack the bureaucratic expertise to administer a scheme even if it retains the legal competence. Finally, the view that subsidiarity is merely a procedural burden-of-proof rule rather than a substantive one sidesteps the issue entirely. If the rule is only about who must justify an action, it does not dictate what investments must be made to preserve the lower unit's ability to act in the future. By treating capacity as a fixed variable rather than a managed resource, existing doctrines allow centralization to become irreversible even when decentralization remains the normative goal.

  **Methodology**
  This project will be conducted over nine months on a part-time basis (six to eight hours per week) by an independent researcher without academic affiliation. The method is doctrinal analysis combined with conceptual modeling. It relies on publicly available legal texts, court rulings, and policy documents in English and German. There will be no archives, no interview program, and no travel.

  *   **Months 1–2: Conceptual Mapping.** I will define the "counterfactual-capacity test." This involves formalizing the question: not "could the lower unit do this adequately now," but "could it do it after a realistic interval of actually being the one responsible, and what would have to be invested to make that true?" I will establish the criteria for a "realistic interval" and "investment."
  *   **Months 3–5: Doctrinal Review.** I will examine the four target systems: the American division of enumerated and reserved powers; Germany's concurrent-powers catalogue and the *Länder*'s direct voice in federal legislation; Switzerland's reworked division of tasks between Confederation and cantons with fiscal equalization; and the EU's subsidiarity test with its national-parliament early-warning mechanism. My German is functional but slow, so I will allocate extra time for German constitutional court rulings and Swiss federal statutes. I will search specifically for instances where higher-level intervention was justified by lower-level incapacity, noting whether capacity-building was offered as an alternative to competence transfer.
  *   **Months 6–7: Drafting the Decision Procedure.** I will synthesize the findings into a draft decision procedure. This will be a step-by-step flowchart for policymakers to determine the appropriate level of governance for a new competence.
  *   **Months 8–9: Case Studies and Refinement.** I will run the procedure against three policy domains: school standards, pandemic response, and climate targets. I will refine the procedure based on where it produces counterintuitive or unstable results across the four systems.

  I propose this method rather than a full four-system legal comparison because a comprehensive historical analysis of federalism in these jurisdictions is impossible within the allotted hours. A purely normative argument from first principles is equally unsuitable because it would lack traction with the legal doctrines actually in use. This hybrid approach tests the concept against existing doctrinal constraints to see if it can be operationalized within them.

  **Deliverable**
  The primary deliverable is a "Subsidiarity Capacity Test" (SCT), a decision procedure that someone could actually apply to a new competence to decide what level it should sit at. The SCT will not simply ask "who is better suited?" but "what investment is required to make the lower level suited, and is that investment cheaper or more legitimate than centralization?"

  To demonstrate its utility, I will provide worked examples in three policy domains across all four systems:
  1.  **School Standards:** Comparing curriculum setting vs. funding equity. Does the higher level set the standards because the lower level cannot, or because the higher level refused to equalize funding?
  2.  **Pandemic Response:** Comparing lockdown authority vs. supply chain management. Where does the capacity bottleneck actually lie?
  3.  **Climate Targets:** Comparing emissions caps vs. grid infrastructure. Is the inability to meet targets a legal failure or a technical capacity failure?

  For each domain, I will trace how the four systems (US, Germany, Switzerland, EU) currently assign competence and how the SCT would reassign it if the enablement reading were enforced. This provides a concrete comparison of how the principle operates in different constitutional vocabularies.

  **Possible Conclusions and Deciding Considerations**
  The project will likely arrive at one of three conclusions. First, that enablement is a distinct constitutional duty, meaning higher levels must fund training or administrative capacity before claiming competence. Second, that the enablement reading simply collapses into ordinary proportionality reasoning, meaning it adds no new analytical power. Third, that the differences between the four systems turn out to be only differences about who bears the burden of proof, rather than substantive differences in outcome.

  The consideration that will decide between these is whether courts or legislatures ever mandate resource transfer *instead* of competence transfer. If the legal record shows no instance where a higher level was required to build lower-level capacity as an alternative to taking over the task, the principle may be purely normative rather than legal.

  **Failure Condition and Scope Assessment**
  I must state an honest failure condition. The project fails if the four systems turn out to be functionally identical regarding capacity building. If the US, Germany, Switzerland, and the EU all treat incapacity as an immediate trigger for centralization without any mechanism for remediation, the typology adds no value. Additionally, there is a risk that the "enablement" reading is indistinguishable from standard proportionality analysis. If I cannot distinguish the counterfactual-capacity test from asking whether a central intervention is "too broad," the project produces no new conceptual tool.

  Regarding scope, this project is limited to formal legal structures and high-level policy design. It does not assess implementation reality on the ground. It cannot measure whether money sent downward is actually used effectively, only whether the legal framework requires it to be sent. Finally, as an independent researcher working part-time, I cannot access non-public government data or interview policymakers. The analysis will rely on published judgments and statutes. If the crucial reasoning happens in unpublished legislative memoranda, the doctrinal review may miss the operative logic. However, given the public nature of constitutional tests in these four systems, the published record should be sufficient to determine whether the enablement reading exists in doctrine, even if it is ignored in practice.
