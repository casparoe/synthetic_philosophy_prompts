answer: |-
  The candle gutted in the draft from the river vents, throwing Halia Merrow's shadow against the grain-sacked walls. She tapped the ledger with a stylus, the iron ringing against the wood.

  "Five wins, four losses," Halia said. "The record is thin, Oss, but it is the only record the Sarn has given us since the Shift. The edge is one in nine. The doctrine says stake the edge."

  Keeper Oss Barrow leaned back, his hands resting on the carved arms of his chair, knuckles white. "The doctrine says stake one ninth of the *store*. You haven't defined the store since the bell rang."

  "I have defined it three ways," Halia said, her voice tight. "Count only the discretionary surplus above your Floor—four loads. One ninth is less than a single strip. You sow nothing. Count the Floor plus the surplus—sixteen loads. One ninth is near two loads. You sow two. Count the Treaty—Marrowgate promises grain at four times rate in famine, valued at twenty loads relief. Thirty-six loads total. One ninth is four loads. You sow the entire surplus."

  Oss shook his head. "Three answers from one rule. That tells me the rule is broken."

  "It tells you the boundary is ambiguous," Halia corrected. "But look at the risk. If I stake the full fraction based on sixteen loads, and the odds are actually even—four and five—instead of five and four, I bleed the store. But if I halve the stake? I sacrifice only a quarter of the growth rate. I insure myself against the error in your nine-season record."

  "And if you double it?" Oss asked. "If you get greedy on the geometry?"

  "Then the growth rate cancels," Halia said. "Zero. You might win more grain in a good year, but over time, the log-sum collapses. You starve slower, but you starve."

  "I don't care about the log-sum," Oss said, leaning forward. "I care about the Floor. Twelve loads. Below that, the charter dissolves. We are not a bankroll, Warden. We are a city. A bankroll can go to zero and be refilled. A city goes to zero and becomes a memory. Your logarithms have no kink at the boundary. They treat the twelfth load the same as the twentieth. But the twelfth load is the cliff edge."

  "The cliff edge is exactly why we grow," Halia snapped. "Stagnation is erosion. The silt lands are the only engine we have."

  "The engine is not the only thing we have," a voice said from the shadows of the ledger stacks.

  Jento stepped into the candlelight. He clutched a pre-Shift book to his chest, the leather cracked with dry rot. He looked between the Warden and the Keeper, then fixed his eyes on the table.

  "You are arguing about what counts as one store," Jento said. "I found something in the old ledgers. Before the Shift. The Near Terrace and the Far Terrace."

  Halia glanced at him. "The Near floods early, the Far floods late. They balance."

  "They do more than balance," Jento said. He opened the book, running a finger down a column of figures. "Over any two-year cycle, the Near doubles in a wet year and halves in a dry. The Far does the opposite. One up, one down. Arithmetic says you break even. Put a load in, take a load out."

  "Get to the point, Clerk," Oss said.

  "The clerks then... they moved half the grain from one terrace to the other at the end of every year. Rebalanced the weights." Jento looked up, his eyes wide. "They finished each cycle with about a quarter more than they began. Not from rain. Not from silt. From the move itself."

  Halia went still. "Volatility capture."

  "It's bookkeeping error," Oss said immediately. "You can't create grain by shifting sacks."

  "It's in the tally," Jento insisted. "If the city is two stores, and you keep them equal, the variance feeds you. Like the Warden's doctrine, but... internal. If the Terrace gain is real, then the boundary isn't the granary. It's the whole river."

  Halia turned back to Oss, a new light in her eyes. "If Jento is right, the bankroll is larger than we thought. The correlation between our assets is negative. We can stake more without increasing ruin risk. The Treaty, the Terraces, the Granary—it's all one portfolio."

  "It's ghost grain," Oss said. "You're counting promises and variances as bread. A mouth cannot eat a ratio. If the Sarn shifts again, your negative correlation becomes positive. Both terraces dry. Both promises fail. Then you find out where the Floor really is."

  "And if we don't sow?" Halia countered. "The silt hardens. The channel migrates. We sit on twelve loads until the rot takes them. Your Floor is a slow death."

  "My Floor is a line we do not cross," Oss said. "Your math says 'sow two' based on sixteen loads. But if you lose those two, we are at fourteen. One bad run after that, and we are at ten. Then the uplands take our people. You talk about growth rates over seasons. I talk about winters we survive."

  "Half-stake," Halia said. "One load. It respects your fear. It keeps my growth positive."

  "One load is a strip," Oss said. "If it fails, it's gone. If it wins, it's two. But you're betting the Floor implicitly. You say the store is sixteen. I say the store is four. The rest is ballast."

  Jento closed the ledger softly. "If the terrace gain is real, then the ballast is working. The clerks didn't sow more. They just moved what they had. Maybe the store isn't what we have. It's how we hold it."

  Halia looked at the single load marked on the slate, then at the twelve marked below it. "The doctrine yields three answers. Nothing, two, everything. Which do you sign, Keeper?"

  Oss looked at the river vent, where the dark water lapped against the stone. "I sign for nothing. Until I know if Jento's quarter is grain or ghost."

  "And if it's grain?" Halia asked.

  "Then we sow," Oss said. "But not because of your edge. Because the river pays us to balance it."

  Halia dipped her quill. "Then we check the terraces. But I keep the ratio. One ninth. However we count the whole."

  ***

  **Note**

  1.  **Arithmetic vs. Philosophy:** The Kelly Criterion math ($f^* = p - q$) and the growth cost of half-staking are standard probability theory; any competent quant would grant them. The unsettled questions are philosophical: Is maximizing geometric growth the correct objective for a entity with an absorbing barrier (dissolution)? Is "half-Kelly" the robust response to parameter uncertainty, or does it still ignore tail risk? Is Jento's rebalancing bonus real economic value or merely liquidity provision that fails in systemic correlation shocks?
  2.  **Verdict:** The Keeper is right about the sowing decision. The verdict turns on the definition of the bankroll near an absorbing boundary. When ruin is irreversible (city dissolution), maximizing growth rate is secondary to minimizing ruin probability. The "Floor" creates a non-linear utility function that log-wealth ignores.
  3.  **Changing My Mind:** I would vindicate the Warden if the Marrowgate Treaty were proven liquid and legally enforceable regardless of Thalwend's status. If the "Floor" is actually soft—meaning the people survive via treaty even if the city dissolves—then the absorbing barrier vanishes, and maximizing long-term growth becomes the rational choice for the population's welfare.
