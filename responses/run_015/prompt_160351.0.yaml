prompt: |-
  Hi — please act as a professional philosopher of history who also knows their way around dynamical systems (or a historically-minded philosopher of science, either works), and take your time: do a bit of brainstorming about how the pieces fit before you commit to a line, and write the whole answer in British English please.

  I'm taking a historiography module this term and our reading group is doing counterfactual history, and literally everyone keeps leaning on the same analogy: history is chaotic, like the weather in Lorenz's models — tiny differences in initial conditions get amplified exponentially, so the flap of a butterfly's wing changes where the storm lands. There's also the old proverb everybody half-remembers, where a missing nail loses a horseshoe, then a horse, then a rider, then a battle, then a kingdom, and people wave it about as though it were the same point in verse. The trouble is that two people in my group use the analogy to reach opposite conclusions, and I can't tell whether either of them is entitled to it. My supervisor uses it to say counterfactual history is basically illegitimate: if history is chaotic, then any "what if the nail hadn't been lost" is unfalsifiable guesswork, because you can't re-run the tape and you can't know which of a thousand tiny differences would have swamped your one. A friend of mine uses the very same analogy for the opposite politics: if history is chaotic then small human acts are enormously consequential, so structural explanations ("it was all impersonal economic forces") are complacent, and ordinary people who failed to act — bystanders, voters, the guy who didn't send the telegram — carry far more causal and moral responsibility than we usually grant them. My own essay is trying to say something like "structural and individual-level explanations can both be true at different grains of description", so I have a stake in this too, but I'd rather know whether the analogy can actually carry any of it.

  Here's what I want, concretely. First, lay out the mapping explicitly — a correspondence table is fine: what in the weather model plays the role of the state of the world, of the initial condition, of the perturbation, of the trajectory, of the prediction horizon, of the attractor, and what on the historical side is supposed to slot into each. Then the audit. I've been noodling on some distinctions and I'd like you to tell me which of them are real and which are confused: (a) "sensitivity laundering", my term for borrowing the prestige of a precise mathematical result to support a much vaguer causal claim, where the vagueness is doing all the work; (b) "the nail fallacy", by which I mean treating a difference that is merely easy to describe as a difference that is small — a lost horseshoe is a narratable difference, not necessarily a small one in the relevant state space, and I suspect the proverb is really a story about a fragile serial chain with single points of failure, which is a different structure from amplification of arbitrarily small perturbations; (c) the gap between trajectory sensitivity and outcome sensitivity — a system can be chaotic whilst the coarse-grained variable you care about (whether there's a war at all, say, versus who wins which battle on which day) is perfectly stable, and if so the supervisor's scepticism and my friend's moral inflation might both be overreaching in opposite directions; (d) my supervisor's home-made test, which he calls the basin test — run the counterfactual, then ask whether the divergence is still visible twenty years on, and if it has washed out, treat the perturbation as historically inert. Also flag the disanalogies I haven't thought of, especially anything to do with there being no well-defined state space, no fixed evolution rule, no reruns and no ensemble for history, and with "the same world except the nail" not being a determinate object in the first place.

  Finally: be blunt about which conclusions survive. For each of the two uses — the supervisor's "counterfactuals are illegitimate" and my friend's "small acts are therefore hugely consequential and responsibility is inflated" — tell me whether the analogy was load-bearing or merely decorative, and where it quietly imports something from the source that the target lacks. I'd also like at least one item of advice on what I should reach for instead: I've been playing with the weather-versus-climate contrast (chaotic in detail, stable in aggregate) and with a drainage-basin or river-delta picture, where perturbations get absorbed unless they push things across a divide, and I can feel that both of those capture something the butterfly picture hides — but I can also feel they'd each smuggle something in of their own, and I'd like you to say exactly what. Rank the problems by how much damage they do rather than listing them all as equally fatal, and don't tell me to go and read something, I've got no library access this week.
