answer: |-
  ### Adjudication of the Exchange: Jordan vs. Riley

  **Subject:** Aristotle's Sea-Battle Problem, Branching Time, and the Metaphysics of Contingency
  **Adjudicator Perspective:** Philosophical Logic and Metaphysics of Time

  The following adjudication evaluates the dialectical exchange between Jordan and Riley. The analysis distinguishes between semantic frameworks (how truth values are assigned) and metaphysical commitments (what exists and how causation operates). It specifically monitors the conflation of epistemic uncertainty (what we know) with metaphysical openness (what is real).

  ---

  #### Move-by-Move Analysis

  **Move 1: Jordan (Branching-Time Semantics)**
  *   **Claim:** Branching-time semantics dissolves the worry by indexing truth to branches rather than a single world-line; bivalence is preserved relative to a history.
  *   **Rating:** **Largely Correct (Semantically), Metaphysically Evasive.**
  *   **Justification:** Jordan accurately describes the standard Ockhamist semantic framework (associated with Prior and Thomason). In this system, a proposition like "There will be a sea battle" is neither true nor false *simpliciter* at a moment, but true-or-false relative to a specific history passing through that moment. This successfully decouples bivalence from fatalism *within the logic*. However, Jordan's claim that this "dissolves" Aristotle's worry is slightly overstated. While it solves the logical paradox, it pushes the metaphysical burden onto the ontology of branching time. It assumes that all future branches are equally real, which is a substantive metaphysical claim, not merely a semantic fix. Nevertheless, as a logical maneuver, it is sound.

  **Move 2: Riley (The Thin Red Line Objection)**
  *   **Claim:** Branching semantics hides a metaphysical fact (the "Thin Red Line" or actual future). If one branch is actual, the proposition is true now, meaning the outcome is "fixed" (fatalism).
  *   **Rating:** **Largely Mistaken.**
  *   **Justification:** Riley correctly identifies that if one adopts a "Thin Red Line" (TRL) semantics—where one future branch is metaphysically privileged—then future contingents have a definite truth value prior to the event. However, Riley commits a classic modal fallacy by inferring that because a proposition is *true*, the event is *causally necessary* or "fixed" in a fatalistic sense. This conflates the semantic property of truth with the metaphysical property of necessity. As Ockham and Boethius argued, a proposition can be contingently true without being necessarily true. Riley's critique holds only if one assumes that truth implies causal determination, which is the very point in dispute. Therefore, his inference from "true-at-actual-branch" to "fatalism" is invalid.

  **Move 3: Jordan (Growing Block + Accidental Necessity)**
  *   **Claim:** Reality literally grows; on Tuesday, there is no fact about Wednesday. Propositions become "accidentally necessary" only after passing. Openness is metaphysical.
  *   **Rating:** **Mixed (Metaphysically Robust, Theoretically Inconsistent).**
  *   **Justification:** Jordan's appeal to the Growing Block theory is a strong defense of metaphysical openness; if the future does not exist, there are no truth-makers for future contingents, preserving genuine contingency. The distinction between logical necessity and the accidental necessity of the past is historically and logically sound. However, this move is theoretically inconsistent with Move 1. Move 1 relied on branching time (where all branches exist as possibilities), while Move 3 relies on the Growing Block (where future branches do not exist at all). Jordan shifts ontologies mid-argument to defend openness. While the Growing Block position is defensible, it contradicts the semantic foundation laid in Move 1, weakening the coherence of Jordan's overall stance.

  **Move 4: Riley (The Selection Problem and Bivalence)**
  *   **Claim:** If transition rules are indeterministic, there is no mechanism for selecting the actual branch. If future statements have truth values, the branch was privileged (fatalism); if not, bivalence is abandoned.
  *   **Rating:** **Largely Correct (Diagnostically).**
  *   **Justification:** Riley correctly identifies the "truth-maker" dilemma inherent in indeterministic logics. If a future contingent is true now, what makes it true? If nothing makes it true, bivalence fails. This is a potent metaphysical pressure point. However, Riley presents a false dichotomy: he assumes the only options are fatalism or an "unexplained selection mechanism." He overlooks the option that truth values for future contingents simply *do not obtain* until the event occurs (a truth-value gap), which is compatible with abandoning bivalence for that specific class of propositions without abandoning logic altogether. Despite this omission, Riley's pressure on the need for a metaphysical ground for truth is logically astute.

  ---

  #### Overall Adjudication

  **Who is more right?**
  **Jordan** is more right overall, though with significant caveats.

  Jordan's position aligns better with the consensus in modern philosophical logic regarding the Sea-Battle problem. The Ockhamist/Branching-Time framework (Move 1) and the Growing Block defense (Move 3) are standard, coherent responses that successfully preserve metaphysical openness without collapsing into contradiction. Jordan correctly identifies that truth can be indexed (Move 1) or retrospective (Move 3).

  Riley identifies genuine tensions (Move 4), but his core argument (Move 2) relies on the fallacious inference that truth entails causal necessity. This is a historical error in the logic of fatalism. While Riley is right to demand a truth-maker, his conclusion that this demand forces fatalism is incorrect. Jordan's inconsistency between Move 1 and Move 3 is a tactical error, but Riley's modal fallacy is a strategic one.

  **Nature of the Dispute:**
  The dispute is **both semantic and metaphysical**, but the participants treat them as identical.
  *   **Semantic:** They argue over whether bivalence applies to future contingents (Jordan: relative/absent; Riley: absolute).
  *   **Metaphysical:** They argue over the ontology of the future (Jordan: branching or non-existent; Riley: linear/privileged).
  The error lies in assuming that a semantic choice (bivalence) dictates a metaphysical outcome (determinism), or vice versa.

  ---

  #### The Missed Conceptual Point

  Both Jordan and Riley miss a crucial distinction in temporal logic: **the difference between *truth* and *settledness* (or determinate truth).**

  In branching-time semantics (specifically Supervaluationism, which neither explicitly adopts), a proposition about the future can be neither true nor false *at a moment* because it is not *settled*.
  *   **Jordan** tries to save truth by relativizing it to a branch (Move 1) or denying the future's existence (Move 3).
  *   **Riley** tries to save truth by insisting on a privileged branch (Move 2).

  **The Missed Insight:** One can maintain that "There will be a sea battle or there will not" (Law of Excluded Middle) is valid, while denying that "There will be a sea battle" has a truth value *now*. The truth of a future contingent is not a static property waiting to be discovered (Riley's view) nor merely a relative property of a branch (Jordan's Move 1); rather, truth in an indeterministic world is often **retroactive**. The proposition acquires its truth value *when the branch becomes actual*, not before.

  Both students assume that for a statement to be meaningful on Tuesday, it must have a truth-value on Tuesday. They miss that temporal logic allows for **truth-value gaps** for future contingents without rendering the logic incoherent. By failing to distinguish between *assertibility* (what we can say now) and *truth-conditions* (what makes it true), they argue past one another. Jordan thinks he saves openness by relativizing truth; Riley thinks he saves realism by fixing truth. Both miss that the most robust solution involves rejecting the principle that every meaningful proposition must be bivalent *at the time of utterance* when the metaphysics is genuinely indeterministic.
