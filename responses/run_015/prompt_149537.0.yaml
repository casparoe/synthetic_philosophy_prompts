  2.  **Deconstruct the Core Idea:**
      *   *Standard View:* Sphexishness = doing the same thing over and over despite changing circumstances. Freedom = doing different things based on reasons.
      *   *Applicant's View:* A system can vary its actions (first-order flexibility) based on a fixed algorithm (second-order rigidity). Example: A reinforcement learning agent that updates weights based on a fixed loss function. It looks flexible, but the *rule* for flexibility is rigid.
      *   *The Problem:* How do we define "open-endedness" in the update rule without just saying "it's not rigid" (circular) or "it's free" (begging the question)?
