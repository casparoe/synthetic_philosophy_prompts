prompt: |-
  hey — act as a proffesional philosopher of physics specilising in foundations of quantum mechanics. You've been hired as the neutral scribe for an adversarial collab between two camps within the many-worlds / Everettian family who've spent about a decade writing past each other. Be good at this: before you draft anything, spend a short paragraph brainstorming what each camp is really committed to, what the strongest version of the *other* side's complaint is, and where the fight might only be about words. Then write the document. Think carefully, and don't hedge everything into mush — an agreed claim that both would actually sign has to be non-vacuous, and a disagreement has to be stated so that each side would accept the wording of its own view.

  The two parties:

  - **Team Derivation.** Probability isn't extra physics. The Born rule (branch weight = squared amplitude) comes out of the bare unitary formalism plus non-probabilistic constraints: on rational preference for an agent embedded in the branching structure (the decision-theoretic route), and/or on what a structural "measure over branches" could possibly be, given additivity and how branches compose under coarse- and fine-graining.
  - **Team Postulate.** Every such derivation helps itself to the conclusion somewhere — some indifference principle, some claim that strength of "caring" tracks the measure, some fairness or equivalence assumption — so the mod-square rule is really an additional posit about which measure is the probability, and "why squared and not cubed" stays open *inside* the derivation rather than being settled by it.

  What I want from you:

  1. A **numbered section of agreed claims** — things both sign. I want at least one that isn't just a restatement of the formalism, and at least one that a collapse theorist would also sign. Please include something about what the job description of "probability" is in a theory where every outcome occurs (guide to action? match observed relative frequencies? measure of typicality? something else?) and something about whether branch *number* is even well defined given that decoherence picks out an approximate basis rather than an exact one.
  2. A **disagreements table**: columns for the disagreement, Team Derivation's phrasing of it, Team Postulate's phrasing, and your verdict on whether it's genuine or verbal. If a row is verbal, say exactly which part is, and what substantive question is left over once the words are sorted out. (I suspect "probability" and maybe "branch" are doing shifting work, but don't just take my word for it.)
  3. A **cruxes section**: the sub-questions such that settling one would move at least one side. For each crux: the case or argument both sides agree bears on it, and each side's prediction written down in advance. Also, for each side, one thing it would count as evidence against *its own* view.

  Two cases I want both camps forced to apply their view to, because they cut across the usual citations:

  **(a) The Late Fan-Out.** An agent is about to measure a spin prepared so that the mod-square weights are 1/3 up and 2/3 down. Independently of the outcome, a device will then act *after* she has recorded her result: if the result was down, it decoheres her branch into a thousand sub-branches (a thousand descendant copies, total weight of that family unchanged, no copy able to tell from the inside whether the fan-out happened). Question one: what should she expect to see before she looks? Question two: does the *later* fan-out change what she should have expected *beforehand* — and if it does, is that a reductio of count-based typicality or just a surprising fact? Question three, the money version: she may pre-commit to either (A) the down branch stays single and that copy is handed $1000, or (B) the down branch fans into a thousand copies each handed $2. Which does each framework recommend, and note where count-based reasoning itself splits — total across copies versus what a randomly-picked copy should expect — since those two don't agree with each other here.

  **(b) The Exponent Variant.** Consider a variant theory: same unitary dynamics, same decoherence, but the stipulated probability/measure over a branch is the *fourth* power of the amplitude rather than the square. (If you think that variant is incoherent or dynamically unstable, say so and treat *that* as one of the recorded predictions — what follows either way?) Would a decision-theoretic or structural derivation in that world output exponent 4, or would it still output 2? Team Derivation should record which, and why that result is or isn't embarrassing for them; Team Postulate should record what each answer would show about whether the derivation is a derivation or a redescription of a posit.

  Please also fold in the familiar structural worry without just rehearsing it: after a long sequence of measurements, descendants sitting in branches whose statistics depart wildly from mod-square vastly outnumber, by count, the ones in Born-conforming branches. Say precisely whether that undermines the mod-square measure, whether count-based typicality was ever the right notion, and what each camp predicts about how much weight this worry carries.

  Format it as the numbered agreed-claims section, then the disagreements table, then the cruxes. No citations, no reading lists, no named papers or authors — I can't look anything up and I don't want to guess. Work from the formulations themselves, and keep the whole thing under about 1200 words.
