answer: |-
  **Brainstorming Memorandum**

  Team Derivation is committed to the purity of the unitary formalism; they view probability as emergent from decision-theoretic rationality or structural symmetry, resisting any extra axioms. Team Postulate is committed to explanatory honesty; they argue that derivations smuggle in probabilistic assumptions (e.g., equivalence principles) and that the Born rule remains a distinct posit. The strongest complaint from Postulate is that Derivation conflates "measure" with "probability" without justification. The strongest complaint from Derivation is that Postulate surrenders explanatory power unnecessarily. The fight is partly verbal: "branch" shifts between "countable discrete outcome" and "measure-theoretic component," and "probability" shifts between "objective chance" and "rational credence." The substantive core is whether rationality constraints *force* the Born rule or merely *accommodate* it.

  ***

  **1. Agreed Claims**

  1.  **Universality of Unitary Dynamics:** Both camps affirm that the quantum state evolves strictly according to unitary dynamics without collapse. There is no physical mechanism that eliminates branches; all outcomes encoded in the superposition occur.
  2.  **Functional Role of Probability:** Both camps agree that the job of "probability" in this framework is to guide rational action (betting behavior) and to ensure the theory matches observed relative frequencies in repeated trials. *Note: A collapse theorist would also sign this claim regarding the empirical job description of probability.*
  3.  **Ill-Definedness of Branch Count:** Given that decoherence picks out an approximate basis rather than an exact one, the absolute integer number of branches is not a well-defined physical quantity. Only measures over the branch structure (integrals over decohered components) are robust.
  4.  **Empirical Adequacy Condition:** Any viable version of this theory must recover the Born rule (weight = squared amplitude) as the effective probability measure, otherwise it contradicts experimental data regarding relative frequencies.

  **2. Disagreements Table**

  | Disagreement | Team Derivation Phrasing | Team Postulate Phrasing | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Status of Born Rule** | The Born rule is a **theorem** derived from unitary dynamics plus non-probabilistic rationality constraints. | The Born rule is a **postulate** disguised as a theorem; derivations assume probabilistic equivalence premises. | **Genuine.** Dispute over whether premises are purely structural/rational or implicitly probabilistic. |
  | **Branch Counting** | Counting branches is **irrational/ill-defined**; rational agents must care about measure, not count, due to coarse-graining invariance. | Counting branches is **coherent but excluded**; we must explicitly posit that measure tracks probability to rule out count-based typicality. | **Mixed.** Verbal on "coherent" (depends on defining 'branch'), Substantive on whether exclusion requires a new posit. |
  | **Source of Normativity** | Rationality **forces** the agent to weight branches by amplitude squared; deviating is irrational like violating logic. | Rationality **accommodates** the posit; agents follow the Born rule because the theory stipulates measure is probability. | **Genuine.** Dispute over whether the norm is internal to rationality or external from physical posit. |

  **3. Cruxes and Test Cases**

  **Crux 1: The Late Fan-Out (Case A)**
  *Scenario:* An agent faces a spin measurement (1/3 Up, 2/3 Down). If Down, a device later decoheres that branch into 1,000 sub-branches (total weight unchanged). The agent pre-commits to: (A) Down stays single, gets $1000; or (B) Down fans to 1,000 copies, each gets $2.
  *   **Sub-Question:** Does the later fan-out change what the agent should expect beforehand?
  *   **Shared Evidence:** The total Hilbert space measure of the Down outcome remains 2/3 in both cases.
  *   **Team Derivation Prediction:** Expectation is unchanged. Rational preference tracks measure, not copy count. They recommend **(B)** solely because total utility across the measure is higher ($2000 vs $1000), not because there are more copies.
  *   **Team Postulate Prediction:** Expectation is unchanged, but only because the **posit** fixes probability to measure. They note that without the posit, count-based reasoning splits: a "randomly picked copy" heuristic favors (B) overwhelmingly, while "total utility" favors (B) moderately.
  *   **Falsification Condition:**
      *   *Derivation:* If it can be shown that rationality constraints *allow* an agent to prefer based on copy count without contradiction, their derivation fails.
      *   *Postulate:* If Derivation successfully proves count-based betting is logically incoherent without adding probabilistic axioms, Postulate's claim of "hidden posit" weakens.

  **Crux 2: The Exponent Variant (Case B)**
  *Scenario:* A variant theory with identical unitary dynamics but stipulated probability measure = amplitude^4.
  *   **Sub-Question:** Would a decision-theoretic derivation output exponent 4 or 2?
  *   **Shared Evidence:** The linear structure of the Hilbert space and unitary dynamics remain unchanged.
  *   **Team Derivation Prediction:** The derivation should still output **2** (or fail). If it outputs 4, the derivation is embarrassed because it shows the result depends on the input posit, not the dynamics. They claim the exponent 2 is locked by the geometry of the state space.
  *   **Team Postulate Prediction:** The derivation will output **4** if the equivalence axiom is tweaked to match the new measure. This shows the derivation is a redescription of the posit. If the derivation outputs 2 despite the posit, the theory is empirically false.
  *   **Falsification Condition:**
      *   *Derivation:* If they cannot derive exponent 2 without assuming a premise that would also validate exponent 4 in the variant theory.
      *   *Postulate:* If Derivation proves that exponent 4 is dynamically unstable or incompatible with unitary symmetry regardless of posits.

  **Crux 3: The Structural Worry (Branch Counting)**
  *Scenario:* In a long sequence of measurements, descendants in branches with statistics departing wildly from Born rules vastly outnumber Born-conforming descendants by count.
  *   **Sub-Question:** Does this undermine the mod-square measure?
  *   **Shared Evidence:** Decoherence creates a branching structure where "maverick" branches exist.
  *   **Team Derivation Prediction:** This worry carries **no weight**. Since branch count is ill-defined (Claim 3), "number of descendants" is not a physical fact. Typicality is defined by measure, not count.
  *   **Team Postulate Prediction:** This worry carries **significant conceptual weight**. It highlights that measure ≠ count. We must explicitly postulate that measure governs probability to avoid the conclusion that we are likely mavericks.
  *   **Falsification Condition:**
      *   *Derivation:* If a robust, basis-independent definition of branch count is found that contradicts Born statistics.
      *   *Postulate:* If it is shown that agents *cannot* coherently conceive of count-based typicality even as an alternative hypothesis.
