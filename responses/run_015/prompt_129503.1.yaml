answer: |-
  ### Brainstorming Phase

  Here are five candidate concepts or distinctions that might explain the pattern you are seeing. I will evaluate them as I go, rejecting the ones that fail to capture the full shape of the phenomenon.

  1.  **The Negative/Positive Rights Distinction.**
      *   *Idea:* A right to be left alone (negative) is stronger than a right to be helped (positive).
      *   *Verdict:* **Reject as sufficient.** You already anticipated this. While this explains the medical law side (there is no right to demand a ventilator), it fails the "phone pact" test. Your friend has no "right" to your phone, yet the pact to take it holds stronger than the pact to drag you to practice. This suggests the asymmetry is moral or structural, not merely legal.

  2.  **The Act/Omission Distinction (Doing vs. Allowing).**
      *   *Idea:* Violating a refusal requires an act (inserting the tube); ignoring a request is an omission (not inserting the tube). We are more responsible for acts.
      *   *Verdict:* **Reject.** In your phone pact, both options require your friend to *act*. Taking the phone is an act. Dragging you to practice is an act. The asymmetry persists even when both require physical intervention.

  3.  **Epistemic Humility (The "You Don't Know" Argument).**
      *   *Idea:* We trust the past self to know what is bad (pain is bad), but we doubt they know what is good (living with dementia might be better than they thought).
      *   *Verdict:* **Partial Match.** This explains why we second-guess Mr. A (requesting life) but not Mrs. H (refusing life). However, it doesn't explain why we honor the "drag me to practice" pact less, even if we know the friend *does* value practice. It feels more like we feel *permitted* to release them from the burden, not that we doubt their knowledge.

  4.  **Status Quo Bias / Default Rules.**
      *   *Idea:* We stick to the path of least resistance. Refusing treatment stops the default (treatment); requesting treatment fights the default (caution).
      *   *Verdict:* **Reject as primary cause.** If we flip the default (e.g., in a jurisdiction where treatment is automatic unless stopped), the asymmetry remains. Refusals still bind harder than requests. Also, in the phone pact, there is no institutional default.

  5.  **Diachronic Autonomy vs. Synchronic Welfare.**
      *   *Idea:* A conflict between the Past Self's authority and the Present Self's well-being.
      *   *Verdict:* **Keep.** This is the closest, but it describes the *conflict*, not the *resolution*. Why does Present Welfare win in one case (Mr. A) but lose in the other (Mrs. H)? I will use this as the foundation for my final answer.

  ***

  ### Considered Answer

  You have identified a genuine, structurally significant phenomenon. It is not merely a legal quirk, nor is it simply the standard negative/positive right distinction applied over time. It is a specific feature of how we weigh the authority of a past agent against the apparent welfare of a present agent.

  Here is the analysis following your five constraints, followed by the proposed conceptual carving.

  #### 1. Is this just the asymmetry between a right to refuse and a right to demand?
  **Status of Term:** *Settled Terminology* (in law and liberal political theory).
  **Analysis:** In medical law, this is often called the "Shield vs. Sword" distinction. Advance directives function as a shield against unwanted treatment but rarely as a sword to demand resources.
  **Why it doesn't fully fit:** As you noted, the phenomenon survives in non-medical, non-legal contexts (the phone pact). In the pact, there are no rights, only mutual obligations. Yet, the obligation to restrict you (take the phone) feels binding, while the obligation to compel you (drag to practice) feels waivable.
  **Conclusion:** The legal distinction is a *reflection* of the deeper moral asymmetry, not the cause of it. The moral asymmetry exists even without the law.

  #### 2. Is it the distinction between Substituted Judgment and Best Interests?
  **Status of Term:** *Settled Terminology* (in bioethics and guardianship law).
  **Analysis:** *Substituted Judgment* asks: "What would the person have chosen?" *Best Interests* asks: "What is objectively good for the person now?"
  **Your Observation:** You are correct. The switch happens *inside* the framework. When Mrs. H refuses care, staff use Substituted Judgment (honoring the past wish). When Mr. A requests care, staff switch to Best Interests (ignoring the past wish because it seems "burdensome" now).
  **Implication:** This confirms your suspicion. The decision-making *standard* is not fixed; it is selected based on the direction of the directive. This means the asymmetry is prior to the decision-making standard. It dictates which standard we are allowed to use.

  #### 3. Is it the Doing/Allowing (Act/Omission) distinction in disguise?
  **Status of Term:** *Contested* (in moral philosophy; some argue there is no moral difference, others argue there is).
  **Analysis:** To test this, we need a control case where both options are acts.
  **Control Case:** Consider a "Precommitment to Punishment."
  *   *Case A (Refusal-style):* "If I cheat, do not let me compete." (Friend must act to exclude you).
  *   *Case B (Request-style):* "If I cheat, make me apologize publicly." (Friend must act to compel you).
  *   *Result:* Most people feel the friend is more obligated to exclude you (Case A) than to force an apology (Case B). Forcing the apology feels like it violates your current dignity, even if you asked for it.
  **Conclusion:** Since both require the friend to *act*, the Act/Omission distinction is not the driver. The driver is the *nature of the constraint* on the current self.

  #### 4. Could it be about error costs and risk-aversion?
  **Status of Term:** *Established Concept* (in decision theory and some bioethics).
  **Analysis:** The argument is: Violating a refusal risks a huge harm (battery/suffering). Ignoring a request risks a missed benefit. We are more risk-averse about harm.
  **The Test:** Flip the content. Suppose Mr. A's directive says: "If I am in permanent vegetative state, do not keep me alive." (Refusal). We honor it. Suppose Mrs. H's directive says: "If I am in permanent vegetative state, keep me alive." (Request). We ignore it.
  Now, consider a psychiatric Ulysses Pact: "If I become manic and dangerous, lock me up." (Request for confinement).
  **Result:** In psychiatry, we *often honor* the request to be locked up, even if the current self resists. Why? Because the "benefit" is preventing catastrophic harm.
  **Conclusion:** Risk aversion explains part of it, but only because we view "life extension in dementia" as a dubious benefit, whereas "preventing mania" is a clear harm-prevention. The asymmetry tracks **Harm vs. Benefit**, not just Risk.

  #### 5. Boundary Cases
  *   **The Cancellation Clause:** ("If I seem happy, ignore this").
      *   *Analysis:* This dissolves the asymmetry. It explicitly grants the Present Self veto power. It transforms the directive from a *command* into a *conditional preference*. If this clause exists, honoring the directive is no longer overriding the Present Self; it is obeying the Past Self's instruction to listen to the Present Self.
  *   **Active Resistance:** ("Make me take my pills even when I say no").
      *   *Analysis:* This is the hardest case. If the current self actively resists, enforcing the past request looks like assault. Enforcing a past *refusal* (stopping pills) looks like respecting liberty. This suggests the asymmetry relies on the **Passivity of the Present Self**. If the Present Self is content (Mrs. H), the Past Refusal holds. If the Present Self is content (Mr. A), the Past Request fails. If the Present Self *resists* (Psychiatric pact), the Past Request *might* hold, but only to prevent immediate harm.
  *   **No Experience:** (Directive written by someone healthy).
      *   *Analysis:* This weakens the authority of *both*, but weakens the Request more. We trust a healthy person to know they don't want a feeding tube (universal aversion to invasion). We trust them less to know they *will* want one (specific valuation of extended life).

  ***

  ### The Carving: A Proposed Concept

  There is no single established term in the literature that captures exactly this diachronic asymmetry. Bioethicists like Ronald Dworkin discuss "Precedent Autonomy" (established term), and legal scholars discuss the "Shield vs. Sword" problem (established term), but neither fully isolates the moral mechanism you found in the phone pacts.

  I propose we coin a term for this specific phenomenon.

  **Term:** **The Asymmetry of Diachronic Constraint**
  **Status:** *My Coinage* (for the purpose of your paper).
  **Definition:** The moral principle that a prior agent's authority to bind a subsequent agent is robust when the binding takes the form of a **protection from intrusion** (refusal), but defeasible when the binding takes the form of a **mandate for imposition** (request), specifically when the subsequent agent's apparent welfare is at stake.

  **Tight Definition for Your Paper:**
  > *The Asymmetry of Diachronic Constraint holds when: (1) Agent A (past) issues a directive to Agent B (future/third-party); (2) Agent A's current state appears to contradict the directive; (3) The directive is honored if it restricts B from acting upon A (Refusal); but (4) The directive is ignored if it requires B to act upon A (Request), unless the action prevents immediate, catastrophic harm.*

  **Why this carving works:**
  1.  It explains the medical cases (Refusal of tube = Restriction on doctors; Request for tube = Imposition on patient).
  2.  It explains the phone pacts (Take phone = Restriction on me; Drag to practice = Imposition on me).
  3.  It explains the psychiatric exception (Lock me up = Restriction on my liberty, but prevents catastrophic harm, so it functions like a Refusal of Harm).

  **Distinguishing Genuine from Fake Instances:**
  *   *Genuine:* A past instruction that is ignored because the present self "seems fine" without it (Mr. A).
  *   *Fake:* A past instruction ignored because it is medically futile (e.g., "Give me a treatment that doesn't work"). That is not an authority asymmetry; that is a feasibility constraint.
  *   *Fake:* A past instruction ignored because the present self is in pain *caused* by the instruction (e.g., "Keep me alive" but I am in agonizing pain). Here, we ignore the request due to *Non-Maleficence*, not because it's a request.

  ***

  ### Terminology Checklist for Your Paper

  Since you cannot check a library, here is my honest assessment of the terms you might use:

  1.  **Precedent Autonomy:** *Settled.* You can use this. It refers to the authority of the past self over the future self. (Associated with Ronald Dworkin).
  2.  **Substituted Judgment / Best Interests:** *Settled.* These are the two standards of decision-making for incapacitated patients.
  3.  **Negative vs. Positive Rights/Duties:** *Settled.* Negative = do not interfere; Positive = provide aid.
  4.  **The Asymmetry of Diachronic Constraint:** *Coinage.* If you use this, define it exactly as I did above. Do not claim it is standard theory. Frame it as: "While bioethics discusses Precedent Autonomy, it often overlooks a specific sub-feature I call..."
  5.  **Ulysses Pact / Precommitment:** *Settled.* Refers to binding oneself in advance (from the Odyssey).

  ***

  ### What Would Change My Mind (Falsification Conditions)

  As a philosopher, I must tell you where my reasoning is weakest. I am confident in the *existence* of the asymmetry, but I might be wrong about the *cause*. Here is what would lead me to conclude there is no single phenomenon here:

  1.  **The "Benefit" Counter-Example:** If you can find a common case where a **Request for Benefit** is honored *more* strictly than a **Refusal of Harm**.
      *   *Example:* A parent leaves money in a will: "Give this to my son for college." (Request). vs. "Do not give this to my son for drugs." (Refusal). If the family ignores the college request but strictly honors the drug refusal, my theory holds. If they ignore *both* equally, the asymmetry might just be about **Specificity** (refusals are often clearer than requests), not moral weight.
  2.  **The "Resistance" Variable:** If it turns out the asymmetry disappears when the Present Self is *silent*.
      *   *Hypothesis:* Maybe we only ignore Mr. A's request because he looks content, making us feel guilty imposing treatment. If Mr. A were unconscious, would we honor the request more? If yes, then the phenomenon isn't about Past Authority; it's about **Present Consent**. The asymmetry is just a proxy for "Does the current body object?"
  3.  **Cultural Variance:** If you find a culture or legal system where Requests bind as strongly as Refusals. (Some religious traditions might view a request for life-extension as a sacred duty, binding on doctors). If the asymmetry is cultural, it is not a structural feature of autonomy.

  **The Weakest Step in My Reasoning:**
  I am assuming that "Refusal" always maps to "Non-Maleficence" (Do No Harm) and "Request" always maps to "Beneficence" (Do Good). But sometimes a Request is to prevent harm (e.g., "Give me insulin"). In those cases, the Request *does* bind. This suggests the asymmetry isn't strictly Refusal vs. Request, but **Prevention of Harm vs. Provision of Benefit**.
  *Correction:* In your paper, you should refine the definition to track **Harm/Benefit** rather than just **Refusal/Request**. A request to prevent harm binds; a request to extend life (benefit) does not. A refusal of harm binds; a refusal of benefit (e.g., "Do not give me the good chair") is irrelevant.

