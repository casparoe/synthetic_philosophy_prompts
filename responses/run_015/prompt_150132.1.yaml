answer: |-
  # Teaching Plan: Analogy as the Engine of Categorisation
  **Text:** Hofstadter & Sander, *Surfaces and Essences*
  **Audience:** 2nd-Year Cognitive Science Graduates
  **Time:** 40 Minutes
  **Resources:** Whiteboard, markers (black, red, blue)

  ## Learning Objective
  By the end of the session, students must understand that for Hofstadter & Sander (H&S), analogy is not a high-level reasoning tool applied to fixed concepts, but the fundamental mechanism by which concepts are constituted in real-time.

  ---

  ## 00:00 – 05:00 | The Hook & Killing Misconception #1
  **Goal:** Dislodge the idea that analogy is a rare, conscious, "poetic" act.

  **Whiteboard:** Draw a simple box labelled "CHAIR". Draw an arrow pointing to a strange object (e.g., a beanbag).
  **Activity:**
  1.  Ask: "When you look at this beanbag and categorise it as a 'chair', what cognitive process just occurred?"
  2.  Expect answers like: "Feature matching," "Prototype comparison," "Rule application."
  3.  **The Pivot:** Write **ANALOGY** in large letters in the centre of the board.
  4.  Explain: H&S argue that calling the beanbag a 'chair' is structurally identical to saying "This political situation is like 1930s Germany." Both are analogies.
  5.  **Kill Misconception #1 (Analogy is Conscious/Rare):**
      *   *Statement:* "If you think analogy is just for essays or puzzles, you are treating it as a *tool* picked up occasionally. H&S say it is the *atmosphere* we breathe. Every single categorisation is a retrieval of a past experience mapped onto the present."
      *   *Instruction:* "Stop thinking of analogy as A: B :: C: D. Start thinking of it as: 'This current thing reminds me of that past thing, so I will label them both X'."

  ## 05:00 – 20:00 | The Carrying Example: "The Fuse"
  **Goal:** Demonstrate physical causation as the backbone of fluid categorisation.
  **Constraint:** Avoid alphabet shapes; use physical causation.

  **Whiteboard:** Draw a simple fuse mechanism:
  `[Spark] --> [Burning Fuse] --> [Explosive] --> [BOOM]`

  **Step 1: The Physical Base (5 mins)**
  *   Walk through the causal chain. Spark ignites fuse, fire travels, hits explosive, explosion occurs.
  *   Ask students to list the *roles*: *Igniter, Conduit, Payload, Outcome.*

  **Step 2: The Slippage (10 mins)**
  *   Ask students to shout out scenarios where we use the phrase "He has a short fuse."
  *   *Scenario A (Temper):* Someone gets angry quickly.
      *   Map it: Spark = Insult. Fuse = Patience. Boom = Shouting.
  *   *Scenario B (Stock Market):* A minor sell-off triggers a crash.
      *   Map it: Spark = One trade. Fuse = Algorithmic trading links. Boom = Market collapse.
  *   *Scenario C (Project Management):* A small delay ruins a launch.
      *   Map it: Spark = Missing email. Fuse = Tight deadline. Boom = Failed launch.

  **Step 3: The H&S Insight (Crucial Moment)**
  *   **Kill Misconception #2 (Analogy is Static Pattern Matching):**
      *   *The Trap:* Students will assume there is a fixed category "FUSE-EVENT" with slots waiting to be filled (like a frame semantic network).
      *   *The Correction:* Draw a circle around the word "Fuse" on the board.
      *   *Say:* "In Scenario A, the 'fuse' is neural/psychological. In Scenario B, it's digital/financial. In Scenario C, it's temporal. There is no pre-existing box called 'Fuse Events' in your head."
      *   *Key Point:* "The category is *created* by the analogy, not *retrieved* by it. You do not find the similarity; you *make* the similarity to make sense of the chaos. The concept 'Short Fuse' does not exist independently of these specific mappings."

  ## 20:00 – 30:00 | Mechanism: Slippability & Context
  **Goal:** Explain *how* the engine works without getting bogged down in code.

  **Whiteboard:** Draw a spectrum:
  `[Literal] <------ SLIPPABILITY -------> [Abstract]`

  **Discussion:**
  1.  **Context is King:** Explain that what slips depends entirely on the context.
      *   *Example:* If I say "Don't light his fuse," I am focusing on the *Igniter*. If I say "His fuse is gone," I am focusing on the *Conduit/State*.
  2.  **Grain Size:** H&S emphasise that analogy happens at all levels.
      *   Seeing a cup = Analogy to past cups.
      *   Seeing a tragedy = Analogy to past tragedies.
      *   It is the same mechanism, just different grain sizes.
  3.  **Why this matters for CogSci:**
      *   If concepts are fluid, you cannot model cognition with static symbolic logic or rigid connectionist nodes. You need a system that allows *roles* to shift.
      *   Mention *Copycat* or *Letter Spirit* briefly as the computational proof-of-concept (micro-domains), but keep the focus on the theoretical claim.

  ## 30:00 – 35:00 | Implications & Discussion
  **Goal:** Ground the theory in their research interests.

  **Prompt:** "How does this change how you view 'concept acquisition' in development?"
  *   *Expected shift:* Children aren't learning definitions; they are learning *potential analogies*. They are learning which features are 'slippable' and which are 'core' in different contexts.
  *   *Note:* Keep this tight. If discussion drags, steer back to the "Engine" metaphor. Analogy isn't the car; it's the combustion.

  ## 35:00 – 40:00 | The Check Question
  **Goal:** Verify they understand *slippability* vs. *fixed mapping*.

  **The Setup:**
  Write the following on the board:
  > **Scenario:** A goalkeeper dives and saves a penalty kick.
  > **Statement 1:** "The goalkeeper was a **dam** holding back the flood."
  > **Statement 2:** "The goalkeeper was a **fuse** that failed to burn."

  **The Question:**
  "Hofstadter & Sander would argue that Statement 1 works as a categorisation of the event, but Statement 2 fails, *not* because the physics don't match, but because the **slippability** is wrong. Explain why Statement 2 fails to create a coherent category in this context, referencing the *direction of causation*."

  **What you are looking for (The Answer Key):**
  *   **Pass:** They identify that in the "Dam" analogy, the *causal flow* (Ball/Water -> Goalkeeper/Dam -> Stop) aligns. The roles slip cleanly.
  *   **Pass:** They identify that in the "Fuse" analogy, the causation is reversed or mismatched. A fuse *transmits* energy to cause an explosion. A goalkeeper *blocks* energy to prevent a goal. To make "Fuse" work, the goalkeeper would have to be the thing that *causes* the goal (the explosion), which contradicts the event (a save).
  *   **Fail:** They say "It's just a bad metaphor" (misses the categorisation point).
  *   **Fail:** They say "Goalkeepers aren't made of gunpowder" (misses the slippability/abstraction point).

  **Wrap Up:**
  "Remember: If you can't explain how the roles slipped to create the category, you haven't found the analogy; you've just found a simile. Class dismissed."

  ---

  ## Instructor Notes (British English & Practicality)
  *   **Spelling:** Ensure you write *categorisation*, *behaviour*, and *programme* on the whiteboard to reinforce the register.
  *   **Pacing:** 40 minutes is extremely tight. Do not allow the "Development" discussion (30-35 mins) to overrun. If they are quiet, move to the Check Question immediately.
  *   **Whiteboard Management:** Keep the "Fuse" diagram up for the whole session. It is your anchor. Do not rub it off until the Check Question.
  *   **Tone:** Keep it rigorous. These are grad students. Avoid dumbing it down to "metaphors are cool." Insist on the ontological claim: *Concepts do not exist prior to the analogy.*
