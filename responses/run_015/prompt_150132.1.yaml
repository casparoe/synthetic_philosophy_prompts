prompt: |-
  I'm running a session for second-year cognitive sci grads on Hofstadter and Sander's idea from Surfaces and Essences that analogy isn't just a tool but the actual engine of categorisation — not comparing pre-existing boxes but creating them. I need a teaching plan, not the lecture itself: what has to come first so they dont just think 'oh, metaphors are important', what's the one carrying example (please dont use the alphabet shape analogies from the book, use something with physical causation instead), the misconceptions they'll bring — probly that analogy is always conscious or that its just pattern matching — and exaclty where in the sequence I should kill each one. Include one check question at the end that shows whether they've grasped slippability rather than just nodding along. Write it in British English please, and keep it practical — I've only got 40 mins and a whiteboard.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Second-year Cognitive Science Graduates (they know the basics, likely familiar with classical categorisation, maybe some connectionism, probably read some classics).
      *   **Topic:** Hofstadter & Sander's *Surfaces and Essences*: Analogy as the *engine* of categorisation (not just a tool, but constitutive).
      *   **Format:** Teaching Plan (not a lecture script).
      *   **Constraints:** 40 minutes, whiteboard only, British English.
      *   **Specific Requirements:**
          *   Avoid the "alphabet shape" analogies from the book.
          *   Use an example involving *physical causation*.
          *   Address specific misconceptions (Analogy = conscious, Analogy = pattern matching).
          *   Specify *when* to kill each misconception in the sequence.
          *   Include one specific "check question" at the end to test understanding of *slippability*.
          *   Ensure they don't just think "metaphors are important" (the shallow take).

  2.  **Deconstruct the Core Concept:**
      *   *Standard View:* Categories exist first (e.g., "chair"), then we map new things to them. Analogy is a high-level reasoning tool used occasionally (A is to B as C is to D).
      *   *H&S View:* Categorisation *is* analogy. Every time we call something a "chair," we are making an analogy to past chairs. Concepts are fluid, not fixed boxes. "Slippability" is key (concepts shift based on context).
      *   *The Trap:* Students often reduce this to "metaphor is pervasive" (Lakoff/Johnson territory) or "connectionist pattern matching." I need to distinguish H&S from these.

  3.  **Select the "Carrying Example" (Physical Causation):**
      *   *Constraint:* No alphabet shapes (e.g., 'm' is like 'n'). Needs physical causation.
      *   *Idea 1:* Dominoes falling. (A bit too linear).
      *   *Idea 2:* A kettle boiling. (Good, but maybe too static).
      *   *Idea 3:* Traffic jams. (Complex, emergent).
      *   *Idea 4:* *Opening a stuck jar.*
          *   Why? It involves force, friction, intent, failure, and alternative strategies.
          *   Scenario: You try to open a jar. It slips. You use a rubber grip. Later, you see a kid trying to open a door that's stuck. You say, "It's like a stuck jar."
          *   Better yet: Let's look at how we categorise the *event* itself.
          *   *Selected Example:* **"The Spilled Milk" vs. "The Broken Dam".**
          *   Wait, let's go with something more active. **"The Overloaded Circuit" vs. "The Panicked Crowd".**
          *   Actually, let's keep it grounded in simple physics that scales up. **"The Blocked Pipe."**
          *   *Refinement:* Let's use **"The Stuck Door"**.
          *   *Scenario:* You push a door. It doesn't open. You push harder. It opens.
          *   *Analogy:* A relationship barrier. A scientific impasse.
          *   *Wait, the prompt asks for physical causation to explain categorisation.*
          *   *Better Idea:* **"The Domino Effect" vs. "The Viral Spread."**
          *   *Best Idea for "Engine of Categorisation":* **"The Trigger."**
          *   Let's try: **A mouse trap snapping.**
          *   Context 1: Catching a mouse.
          *   Context 2: A stock market crash (triggered by one sale).
          *   Context 3: An argument exploding (one word).
          *   *Why this works:* It highlights that the *category* "Trigger Event" isn't a pre-existing box. We construct the category "Trigger" by slipping the physical mechanics of the trap onto the market/argument. The categorisation *is* the analogy.
          *   *Alternative (Simpler for Whiteboard):* **"The Pressure Cooker."**
          *   Physical: Heat -> Pressure -> Valve releases.
          *   Social: Stress -> Tension -> Outburst.
          *   Geological: Magma -> Pressure -> Eruption.
          *   *Decision:* **The Pressure Cooker.** It's visceral, involves clear physical causation (heat/pressure/release), and allows for easy "slippage" of roles (heat = stress, valve = outburst).

  4.  **Structure the 40 Minutes:**
      *   0-5 mins: Hook & The "Naive" View (Kill Misconception 1: Analogy is rare/conscious).
      *   5-15 mins: The Carrying Example (Pressure Cooker) & Deep Dive.
      *   15-25 mins: The Mechanism (Slippability & Constitution). (Kill Misconception 2: Analogy is just pattern matching).
      *   25-35 mins: Implications for CogSci (Concepts are fluid).
      *   35-40 mins: Check Question & Wrap.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: Analogy is conscious/rare.* (Kill in the first 5 mins). Show that calling a "pressure cooker" situation a "pressure cooker" isn't a poetic flourish; it's how we understand the situation.
      *   *Misconception 2: Analogy is static pattern matching.* (Kill during the deep dive). Show that the mapping changes based on context (slippability). The "valve" isn't always the same thing.

  6.  **Drafting the Content (incorporating British English):**
      *   Use "categorisation," "behaviour," "programme," "whilst."
      *   Tone: Academic but punchy.
      *   Whiteboard usage: Needs to be visual.

  7.  **Developing the Check Question:**
      *   Needs to test *slippability*, not just recognition.
      *   *Draft:* "Is a virus like a computer virus?" (Too easy).
      *   *Draft:* "If I call a meeting a 'zoo', what maps to what?" (Better).
      *   *Requirement:* Must show they grasp that the *category* is created by the analogy, not just mapped.
      *   *Idea:* Present a scenario where the mapping shifts based on a tiny detail change.
      *   *Scenario:* A goalkeeper saving a penalty vs. a goalie saving a child from a ball.
      *   *Let's refine:* Use the Pressure Cooker example again but twist it.
      *   *Question:* "In Scenario A, the 'valve' is a scream. In Scenario B, the 'valve' is a resignation letter. Why isn't 'Pressure Event' a fixed category with slots?"

  8.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Is 40 mins enough? It's tight. Need to be ruthless on timing.
      *   *Critique:* Make sure the distinction between H&S and Lakoff is clear. Lakoff = embodied metaphors structure thought. H&S = *every* categorisation is an analogy. It's more granular.
      *   *Adjustment:* Emphasise that even calling something a "cup" is an analogy to previous cups.
      *   *Example Check:* Is "Pressure Cooker" too metaphorical? The prompt asks for physical causation. The *source* domain must be physical. The *target* can be abstract. The point is that the *categorisation* of the target relies on the source.
      *   *Wait, re-reading prompt:* "use something with physical causation instead [of alphabet shapes]". This implies the example used to explain the theory should rely on physical causation.
      *   *Revised Example:* **"The Falling Domino."**
      *   Why? It's purely causal. A hits B, B hits C.
      *   Application: Chain emails, nuclear fission, spreading rumours.
      *   Categorisation: We call all these "Chain Reactions." H&S say we don't have a "Chain Reaction" box. We construct the category *in the moment* by slipping the domino physics onto the rumour.
      *   Let's stick with **"The Blocked Pipe/Pressure"** idea but make it about **Causation**.
      *   *Final Decision:* **"The Fuse."** (Physical: Spark travels, hits explosive, boom).
      *   It's simple to draw. It's causal. It slips easily (short temper, stock market, war).

  9.  **Final Polish:**
      *   Check British spelling.
      *   Ensure the "Kill" points are explicit.
      *   Ensure the Check Question is robust.

  10. **Writing the Plan:** (Proceeding to generate output based on these thoughts).
      *   *Intro:* Set the stage.
      *   *Misconception 1:* Conscious vs. Ubiquitous.
      *   *Example:* The Fuse.
      *   *Misconception 2:* Fixed slots vs. Slippability.
      *   *Check Question:* The "Short Fuse" variation.

      *(Self-Correction on Check Question)*: Make sure it forces them to choose between "fixed category" and "fluid construction."
      *   *Question:* "If I say 'He has a short fuse' vs 'The market has a short fuse', does the meaning of 'fuse' stay the same?" No. "Does the category 'Thing with a Fuse' exist prior to the analogy?" No.
      *   *Better:* Give them a case where the mapping breaks if they treat it as fixed.
      *   *Scenario:* A lit fuse that *doesn't* explode (a dud). Does the analogy hold?
      *   *Okay, let's go with the planned "Check Question" in the draft.*

  11. **Final Review against constraints:**
      *   British English? Yes.
