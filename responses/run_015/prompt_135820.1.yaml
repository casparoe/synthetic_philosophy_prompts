      *Refining the Test Critique:* The test is strong *if* it predicts *which* personas break. If it just says "personas change things," Agents can say "context changes goals." The novelty must be in the *pattern* of change.

      *Refining the Heuristic:* Needs to be actionable. "Measure perplexity of agentic trajectories."

