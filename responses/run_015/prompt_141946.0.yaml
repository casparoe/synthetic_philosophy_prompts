answer: |-
  This is a clean, high-quality philosophical problem. You have correctly identified that the heterogeneity problem isn't just about variety; it's about whether "pleasure" picks out a natural kind or a functional role.

  You asked for pushback, so I will start there. Your search for a single principle might be the error. If "pleasure" is a folk-psychological term tracking *value* rather than *phenomenology*, then demanding a unified phenomenological account is like demanding a unified visual account of "seeing" that covers both optical vision and blindsight. However, since you are testing hedonism (which requires a common currency for summation), you need a unifying property.

  Here are two candidate principles, the verdicts they force, and where I think your intuitions are contaminating the data.

  ### Candidate Principle 1: The Attitudinal Account (Feldman-style)
  **Principle:** An experience is pleasant iff the subject intrinsically desires, *at the time of the experience*, that the experience be occurring.
  *   **Key Clause:** "Intrinsically desires at the time."
  *   **Forced by:** The *Spreadsheet* case (thin desire, no sensation) and the *Ice Water* case (strong desire). It unifies them by ignoring the *feel* and focusing on the *stance*.
  *   **Verdicts on your list:**
      *   *Ice Water/Click/Sex:* **Yes.** (You desire them while having them).
      *   *Tickling:* **No.** (You explicitly stated you are fighting to get away; you do not desire it to continue).
      *   *Absorption:* **No.** (You stated "nobody home to enjoy it"; no desire is being formed).
      *   *Schadenfreude/Grim Satisfaction:* **Yes.** (You are pleased *that* X happened).
      *   *Diffuse Mood:* **No.** (No specific object of desire).
  *   **Verdicts on unlisted cases:**
      *   *Pen Lid/Drawer:* **Yes.** (You desired that alignment in that moment).
      *   *Sad Film:* **No.** (You do not desire the sadness while watching, even if you value the experience retrospectively).
  *   **Cost:** It fails your *Tickling* and *Absorption* verdicts. It also collapses the distinction between *Schadenfreude* and *Grim Satisfaction* (both are attitudes of being pleased that P).

  ### Candidate Principle 2: The Hedonic Tone Account (Your "Loudness" Analogy)
  **Principle:** An experience is pleasant iff it possesses a positive hedonic tone, which is a sui generis phenomenological property that can vary in intensity and attach to heterogeneous sensory/cognitive bases.
  *   **Key Clause:** "Positive hedonic tone." (This treats pleasantness as a modifier, like "loud," not a separate sensation).
  *   **Forced by:** The *Ice Water* vs. *Click* disparity. It allows them to be different *bases* (thermal vs. cognitive) sharing the same *property* (tone).
  *   **Verdicts on your list:**
      *   *Ice Water/Click/Sex:* **Yes.** (All have the tone).
      *   *Tickling:* **Yes.** (The sensation itself has a high-intensity positive tone, even if the motor response is avoidance).
      *   *Absorption:* **No.** (You reported no phenomenology at the time).
      *   *Scratching Itch:* **Yes.** (The relief *is* the tone shifting from negative to neutral/positive).
      *   *Schadenfreude/Grim Satisfaction:* **Maybe.** (Depends on if there is a "glow" accompanying the thought).
  *   **Verdicts on unlisted cases:**
      *   *Pen Lid/Drawer:* **Yes.** (Low intensity tone).
      *   *Diffuse Mood:* **No.** (Moods are background states; tones are episodic modifiers).
  *   **Cost:** It makes pleasure epistemically opaque (you admitted this). It also struggles with *Absorption* (if there's no tone, where is the pleasure?).

  ---

  ### The Pushback: Where Your Verdicts Are Likely Confused

  You asked me to tell you which verdicts to drop. I believe three of your intuitions are contaminating the phenomenological data with moral or retrospective judgments. If you want a tight principle, you must sacrifice these.

  **1. The Tickling Case (Drop the "Yes")**
  *   **Your Verdict:** Yes, it's pleasure, even though I want it to stop.
  *   **My Pushback:** This is the weakest link in your data. If you are fighting to get away, the *motivational signature* of pleasure is absent. What you are describing is likely *sensory ticklishness*, which is a distinct modality from pleasure. It triggers laughter (a motor reflex) without necessarily triggering enjoyment.
  *   **Why drop it?** Keeping it forces you to sever the link between pleasure and motivation entirely. If pleasure doesn't motivate approach (or retention), "maximise pleasure" becomes unactionable.
  *   **Confidence:** High. This is a standard counter-example in the literature for a reason.

  **2. The Grim Satisfaction vs. Schadenfreude Distinction (Drop the "No" on Grim Satisfaction)**
  *   **Your Verdict:** Schadenfreude = Pleasure; Grim Satisfaction = Not Pleasure.
  *   **My Pushback:** You admitted the only difference is that you disapprove of one. This is a moral judgment, not a phenomenological one. Phenomenologically, "I told you so" and "I'm glad they failed" often feel identical: a cognitive alignment + a positive affective glow.
  *   **Why drop it?** If you keep this distinction, your definition of pleasure becomes morally loaded. Hedonism requires a naturalistic definition of the *good*, not a moralized definition of the *feeling*. If Grim Satisfaction feels good, it counts as pleasure, even if it's not *morally* good.
  *   **Confidence:** Medium-High. I am reconstructing the phenomenology of "grim satisfaction" based on your description ("something in me is satisfied"). If there is satisfaction, there is likely a positive tone.

  **3. The Absorption Case (Drop the "Yes")**
  *   **Your Verdict:** Yes, it's pleasure, but only retrospectively.
  *   **My Pushback:** If there was "nobody home to enjoy it," calling it pleasure *at the time* is a category error. It is *valuable*, and it contributes to *well-being*, but it is not an episode of *pleasure*.
  *   **Why drop it?** Hedonism can admit that some valuable things aren't pleasures. Flow states might be valuable because of *competence* or *achievement*, not hedonic tone. Conflating "good experience" with "pleasant experience" bloats the theory.
  *   **Confidence:** Medium. This depends on whether you are a hedonist about *value* (only pleasure is good) or *welfare* (pleasure is the main component). If the former, you must call Absorption pleasure. If the latter, you can call it "non-hedonic well-being."

  ---

  ### Verdicts on Your Unlisted Cases

  **1. The Micro-Satisfactions (Pen Lid, Drawer)**
  *   **Principle 1 (Attitudinal):** **Yes.** You intrinsically desired that click in that moment.
  *   **Principle 2 (Tone):** **Yes.** Low-intensity hedonic tone.
  *   **Analysis:** These are the same animal as the ice water, just lower amplitude. The heterogeneity problem bites hardest here: is the "click-satisfaction" really the *same property* as "ice-water-coolness"?
  *   **My Take:** They are likely the same *functional* role (error-correction signal), but not necessarily the same *feeling*. If you go with the "Loudness" model, you must assert they share a qualitative dimension. I am 60% confident they do; 40% confident "satisfaction" is cognitive and "pleasure" is affective.

  **2. The Diffuse "Things Are Fine" Stretch**
  *   **Principle 1 (Attitudinal):** **No.** It's a background belief, not a desire for an occurring experience.
  *   **Principle 2 (Tone):** **No.** It lacks the episodic quality of a tone.
  *   **Analysis:** This is *Contentment*. It is distinct from Pleasure.
  *   **My Take:** This is a major hole for Hedonism. If a six-week stretch of "fine" is better than six weeks of spiked highs and lows, Hedonism must account for it. If it's not pleasure, what is it?
  *   **Confidence:** Low. This is the hardest case. It suggests "well-being" might not be summable episodes of pleasure.

  ---

  ### The "Continue-Test" Diagnosis
  You suspected your test ("disposed to want it to keep going") is desire-satisfaction in a phenomenological hat. **You are correct.**
  *   It is essentially Sidgwick's definition.
  *   It fails because desire and pleasure can come apart (Tickling = pleasure without desire; Masochism = desire without pleasure?; Absorption = neither).
  *   If you keep this test, you are no longer a Hedonist; you are a **Desire Satisfaction Theorist**. You must decide if you care about the *feeling* or the *fulfillment*.

  ### Final Recommendation

  If you want to save Hedonism from the heterogeneity problem without turning it into Desire Theory:

  1.  **Adopt the "Loudness" (Hedonic Tone) Model.** It is the only one that handles the *Ice Water* vs. *Click* heterogeneity without changing the subject.
  2.  **Drop the Absorption Verdict.** Call Flow "non-hedonic value." Don't break your theory to save a case that might not be pleasure.
  3.  **Drop the Tickling Verdict.** Call it "sensory stimulation."
  4.  **Accept the Epistemic Cost.** You noted that if pleasure is a dimension, you can't "read off" the total. **Live with this.** We can't "read off" total health either, but health is real. We make comparative judgments (This hour was better than that one) without isolating the variable.
  5.  **Merge Grim Satisfaction and Schadenfreude.** If they feel the same, they are the same. Morality comes later.

  **Confidence Note:** I am reconstructing your "Grim Satisfaction" case. If that feeling is truly devoid of positive affect (just a cold "I was right"), then it is not pleasure, and my pushback there is wrong. But usually, "satisfaction" implies a release of tension, which is hedonic.

  **One last challenge:** If "pleasure" is a dimension like loudness, why does the *search* for it feel different from the *detection* of it? You can measure loudness with a meter. You measure pleasure with... more pleasure? If the metric is internal, the heterogeneity problem might just be the limit of introspection, not the limit of the concept. Consider that the problem isn't in the pleasure; it's in the looking.
