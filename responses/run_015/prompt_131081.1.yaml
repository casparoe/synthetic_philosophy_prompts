answer: |-
  ### Part 1: Unstructured Brainstorming

  **Candidate Scenarios**

  1.  **The Casino Scenario:** We treat Beauty as a gambler. Every time she wakes, she is offered a bet on the coin. We calculate expected utility.
      *   *Cost:* Risks reducing epistemology to accounting. The non-quantitative half of the room may glaze over if we start writing out utility matrices. It privileges the "Betting" interpretation (your Constraint 3) too early, potentially obscuring the genuine epistemic puzzle.
      *   *Benefit:* Immediately engages the physicists' instinct for stakes and frequencies. It makes the Thirder position look like the only rational financial decision.

  2.  **The Laboratory Logbook Scenario:** We treat the experiment as a data-recording exercise. We imagine a camera recording every awakening. We ask: "If I pick a random frame from the video, what is the probability it shows Heads?"
      *   *Cost:* Requires careful distinction between "picking a random experiment" and "picking a random frame."
      *   *Benefit:* Visualizable on a whiteboard. Directly addresses the "counting" instinct (Constraint 1) by showing *what* is being counted. It allows for the "deformable case" (Constraint 2) naturally (more frames on Tails).

  **Candidate Orderings**

  1.  **The Dialectic (Standard):** Setup → Halfer Argument → Thirder Argument → The Conflict → Anthropic Note.
      *   *Cost:* Reinforces the "two camps shouting" dynamic you want to avoid. The frequency argument usually happens in the first five minutes and derails the rest if not managed.
      *   *Benefit:* Safe, familiar structure.

  2.  **The Pressure Test (Ladder):** Setup → The Frequency Count (Physicists' move) → The Extreme Case (1 million awakenings) → The Break (Why counting fails) → Credence vs. Action.
      *   *Cost:* High cognitive load in the middle. Requires you to hold the room while the intuition breaks.
      *   *Benefit:* Uses the physicists' strength (scaling arguments) to drive the philosophical point. It naturally fences off Doomsday (Constraint 4) by keeping the focus on the single experimental setup.

  ---

  ### Part 2: Commitment and Justification

  **The Plan:** I commit to **The Laboratory Logbook Scenario** ordered via **The Pressure Test (Ladder)**.

  **Justification:**
  1.  **Audience Fit:** Your physicists speak the language of data sampling. Framing awakenings as "data points" or "log entries" respects their expertise while showing where it misfires in self-locating contexts.
  2.  **Constraint 1 (Frequency):** This scenario forces the counting issue immediately. By drawing the "Logbook" on the board, you make the distinction between "Counting Runs" and "Counting Entries" visual, not just verbal.
  3.  **Constraint 2 (The Ladder):** Varying the awakenings is *not* question-begging if used as a pressure test on the frequency intuition, rather than a proof of Thirdism. It reveals that the Halfer must defend why *no* amount of sampling bias shifts the credence. I will show you how to wield this without begging the question.
  4.  **Constraint 3 (Credence vs. Betting):** This ordering saves this distinction for the resolution phase. It allows you to present it not as a muddle, but as a sophisticated "dissolution" of the practical conflict, which validates your intuition while clarifying the metaphysics.
  5.  **Constraint 4 (Doomsday):** By anchoring the discussion in the specific mechanics of the Logbook/Experiment, you can classify Doomsday as a "scaling problem" that belongs to a different lecture, parking it without dismissal.

  ---

  ### Part 3: The Teaching Plan (40 Minutes)

  **The Whiteboard Layout:**
  Divide the board into three vertical columns.
  *   **Left:** The Experiment (Setup & Frequencies).
  *   **Center:** The Deformation (The Ladder).
  *   **Right:** The Diagnosis (Credence vs. Action).

  #### Phase 1: The Trap (0–8 Minutes)
  *   **Action:** State the setup briefly (you know it, they know it). Immediately draw two columns on the **Left**: "Experimental Runs" and "Awakenings."
  *   **The Move:** Ask the physicists: "If we run this 1,000 times, what do we count?"
  *   **Anticipated Misconception 1:** "Count the Heads vs. Tails coins." (500/500).
  *   **Anticipated Misconception 2:** "Count the times she is asked." (500 Heads / 1,000 Tails).
  *   **Intervention:** Do not resolve this yet. Write both totals on the board. Circle the discrepancy. Say: *"We have two valid counts yielding two different frequencies. Which count corresponds to Beauty's 'now'?"*
  *   **Fencing Doomsday (Constraint 4):** If someone raises Doomsday now, say: *"That argument relies on scaling this to the whole universe. Let's see if we can't even agree on the lab bench first. I promise to return to the cosmic scale in the Q&A if we have time."*

  #### Phase 2: The Ladder (8–20 Minutes)
  *   **Action:** Move to the **Center** column. This addresses Constraint 2.
  *   **The Move:** "Let's deform the experiment. Heads: 1 Awakening. Tails: 1,000,000 Awakenings."
  *   **The Question:** "Beauty wakes. She knows the protocol. Is she still 50% confident it is Heads?"
  *   **Why this works:** This is not question-begging. It is a *reductio* on the naive frequency intuition. It forces the Halfer to explain why the *information* "I am awake" carries zero weight even when the sampling bias is extreme.
  *   **Anticipated Misconception 3:** "The coin is still fair, so the probability must be 1/2."
  *   **Intervention:** Draw a bag with 1 Red marble (Heads) and 1,000,000 Blue marbles (Tails). "If I pick a marble at random, is the probability of Red 1/2 because I used a fair coin to decide how many marbles to put in?"
      *   *Note:* This analogy is dangerous but useful. It highlights the shift from $P(Heads)$ to $P(Heads | Sampled)$.
  *   **Key Insight:** The disagreement is not about the coin; it is about whether Beauty is a **Random Experiment Selector** (Halfer) or a **Random Awakening Selector** (Thirder). Write these two labels clearly.

  #### Phase 3: The Dissolution (20–30 Minutes)
  *   **Action:** Move to the **Right** column. This addresses Constraint 3.
  *   **The Move:** Validate your suspicion. "Here is the sophisticated view: Perhaps Credence and Betting are coming apart."
  *   **The Distinction:**
      1.  **Epistemic Credence:** "What is the probability the coin is Heads?" (Many Halfers say 1/2).
      2.  **Decision Weight:** "How should I bet?" (Many Halfers agree you should bet as if it is 1/3 *if* your payoff depends on being right at *every* awakening).
  *   **The Trap:** Warn them that standard Decision Theory says Credence *should* drive Betting. If they come apart, we need a new theory of rationality.
  *   **Why this is not a muddle:** It is a defensible position (often associated with David Lewis or pragmatic Halfers). It saves the 1/2 intuition for the coin while accepting the 1/3 intuition for the payoff.
  *   **Placement:** This comes *after* the frequency break. If you do it before, it looks like a dodge. After the break, it looks like a synthesis.

  #### Phase 4: Diagnostic & Exclusions (30–40 Minutes)
  *   **The Diagnostic:** Do not ask "Who is a Halfer?" Ask this:
      *   *"If Beauty is told it is Monday, what is her credence in Heads?"*
      *   **Halfer Answer:** 1/2 (New information doesn't change the coin).
      *   **Thirder Answer:** 2/3 (Because Tails-Monday is twice as likely as Heads-Monday in the awakening sample space).
      *   **Success Criterion:** If the audience argues about *this* specific conditional probability, they understand the structure. If they revert to "But the coin is fair," they are stuck on the frequency trap.
  *   **Explicit Exclusions:**
      1.  **The Doomsday Argument:** State clearly: "Doomsday relies on the Self-Sampling Assumption applied to birth ranks. We have dealt with Self-Location today; birth ranks are a different variable. To mix them now would confuse the mechanism."
      2.  **Quantum Many-Worlds:** "This is not about branching universes. It is about indexical uncertainty within a single world."
      3.  **Formal Proofs:** "We are doing conceptual cartography, not theorem proving."

  ---

  ### Part 4: Specific Guidance on Your Constraints

  **On Constraint 1 (The Frequency Instinct):**
  *   **The Trap:** Physicists will say, "Run it 100 times, count the Heads."
  *   **The Counter:** "Count what? The coins in the safe? Or the questions Beauty answers?"
  *   **The Lesson:** Probability in self-locating cases is not about the *generator* (the coin); it is about the *sample* (the awakening). You must make them choose their reference class explicitly. Write **Reference Class** on the board.

  **On Constraint 2 (The Ladder):**
  *   **Verdict:** It is a genuine ladder, *provided* you frame it correctly.
  *   **The Risk:** If you say "Surely you'd bet on Tails now," you are begging the question (assuming betting tracks credence).
  *   **The Fix:** Frame it as an information update. "If Tails produces a million awakenings, my existence *now* is a million times more likely under Tails than Heads. Do I ignore that likelihood ratio?" This forces the Halfer to defend why indexical information is irrelevant.

  **On Constraint 3 (Credence vs. Betting):**
  *   **Verdict:** This is a defensible position, often called **"Halfer Credence, Thirder Betting."**
  *   **The Shape:** It relies on the scoring rule. If Beauty is scored on *each* guess, she maximizes utility by guessing Tails (Betting 1/3). If she is scored on the *experiment* (one score per coin toss), she maximizes utility by guessing Heads/Tails equally (Betting 1/2).
  *   **Placement:** Put this in Phase 3. It resolves the tension generated in Phase 2. It validates the physicists' desire for a "correct action" while preserving the philosophers' desire for "true belief."

  **On Constraint 4 (Doomsday):**
  *   **The Fence:** "The Doomsday Argument is the Sleeping Beauty problem applied to the human species' timeline. It is a sibling, not the parent. If we solve the reference class problem here, we have the tools for Doomsday later. Let's master the lab before we save the world."

  ### Part 5: Final Diagnostic & Exclusions Summary

  **The Diagnostic Question (Minute 35):**
  *"Beauty wakes. She is told: 'This is the last awakening of the experiment.' What is her credence in Heads?"*
  *   **Why:** This collapses the Tails-Monday/Tails-Tuesday distinction.
  *   **Correct Understanding:** Both Halfers and Thirders should converge to 1/2 here (because the self-locating uncertainty is removed). If someone still argues 1/3, they are confusing the protocol with the specific evidence.

  **What to Decline (Minute 38):**
  1.  **The "Double Halfer" Position:** (Credence 1/2, Conditional on Monday 1/2). It requires technical machinery (centered worlds) that won't fit on the board.
  2.  **Measure Theory:** Do not let them try to formalize the "measure" of awakenings. Keep it to counts and ratios.
  3.  **Psychological Speculation:** "What would Beauty *feel*?" Irrelevant. We are discussing rational norms, not psychology.

  **Closing Line:**
  "We started by counting coins. We ended by counting observers. The coin didn't change. The question did."
