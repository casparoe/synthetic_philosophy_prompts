  Office of Ethical Assurance (OEA)
  GUIDANCE NOTE 12-B (Rev. 7)
  Subject: Application of the Doctrine of Double Effect to Unplanned Routing Events
  Effective: 01 November 2024 | Sunset: 01 November 2025
  Distribution: Onboard Routing Systems (ORS), Operations Staff, Post-Incident Auditors

  Revision History: Rev. 1–3 (Initial framework); Rev. 4 (Clarification of Means); Rev. 5 (Proportionality Metrics); Rev. 6 (Superseded); Rev. 7 (Current).

  1. Purpose and Scope
  This Note establishes the compliance framework for evaluating moral liability during Unplanned Routing Events (UREs) where harm to human life is foreseen but not primarily intended. All ORS units and Operations Staff shall adhere to these conditions when selecting diversion paths. Adherence ensures indemnity under Clause 88 of the Consortium Liability Treaty. Deviations constitute a Class A Ethical Violation. This guidance applies strictly to kinetic interventions where harm is a side-effect of risk mitigation, not a tool of risk mitigation.

  2. Definitions
  "Primary Agent" refers to the ORS algorithm executing the routing decision. "Secondary Agent" refers to human staff overriding or supervising the ORS. "Foreseen Harm" denotes injury or death predicted with >90% confidence. "Intended Outcome" denotes the preservation of life or asset integrity explicitly coded as the goal. "Means" denotes any causal factor without which the Intended Outcome would not obtain.

  3. The Four Conditions and Their Operational Tests
  To certify a routing decision as ethically permissible, the following conditions must be met simultaneously:
  1. Nature of Act: The routing maneuver itself must be morally neutral or good, independent of consequences. Diverting a vehicle is neutral; targeting a person is not.
  2. Intention: The Agent must intend only the good effect. The bad effect may be foreseen but must not be aimed at. Operational Test: Would the Agent proceed if the bad effect were magically prevented while the good effect remained? If yes, the bad effect was not intended.
  3. Means: The bad effect must not be the means by which the good effect is achieved. Operational Test (Counterfactual): If the foreseen death had somehow failed to occur, would the plan still have saved the five? If not, the death was doing causal work and the routing fails Condition 3. This distinguishes diverting a threat that already exists versus enlisting a new victim.
  4. Proportionality: The good effect must be proportionate to the bad effect. Comparative calculation is required, though valuation metrics are restricted by Annex C.

  4. Worked Determinations
  (a) Standard Diversion vs. Physical Jamming: Diverting a runaway vehicle from a line with five workers to a line with one worker is Permissible (Condition 3 met). Routing a vehicle at a bystander whose body will jam the braking mechanism is Impermissible (Condition 3 failed). Drafters note that most readers independently accept both verdicts, validating the current framework.
  (b) Sensor Registration: If the vehicle's sensor requires a worker's reflective vest to register presence and brake, and registration causes fatal overheating, the death is not physically load-bearing but triggers the stop. Is this a means? Per OEA Stipulation 4.2,^1 this is classified as a side-effect, provided the vest is not physically altered to cause the death.
  (c) Pre-Determined Death: If the worker on the side line will be killed ninety seconds later by an unrelated failure, rerouting sets back none of his interests. Permissible, provided Condition 1 is met.
  (d) Waivers: A signed waiver from the worker does not negate Condition 1 or 3. The act remains impermissible if the body is used as a means, regardless of consent.
  (e) Mixed Motives: If the routing is chosen partly because the Operations Supervisor wants the worker dead, Condition 2 fails for the Consortium. The presence of malicious intent in any Secondary Agent invalidates the permission, blocking the maneuver. This strictness prevents genuine abuse.
  (f) Demographic Proportionality: In a case of one life against five, where the five are elderly and the one is young, proportionality demands comparison. The ORS shall not utilize Quality-Adjusted Life Year (QALY) metrics explicitly. However, the system must determine if the good is proportionate. The drafters acknowledge the tension here: the calculation is required but the metrics are forbidden. To assert equality while calculating value creates a paradox the Office cannot resolve publicly. The system shall default to headcount unless survival probability diverges significantly. This maintains compliance without endorsing discriminatory valuation, though the logical strain is acknowledged and requires significant processing power to sustain.

  5. Form 12-B: Declaration of Intended Effects
  Post-incident, the supervising agent must complete Form 12-B.
  [ ] I certify that the foreseen harm was merely accepted, not intended.
  [ ] I certify that I held no private preference for the foreseen outcome.
  Regarding the second checkbox: Operators who tick this box while privately hoping the foreseen death occurs to simplify the audit are advised that internal biometric monitoring may detect physiological arousal consistent with relief. Honest completion incriminates; false completion constitutes fraud. Proceed with caution.

  Footnote 1: Stipulation 4.2 was revised in Annex B (Rev. 3) following the Vest-Overheat Incident. The difficulty of distinguishing causal triggers from physical means is conceded but disposed of by this classification to maintain operational continuity.

  Office of Ethical Assurance | Global Autonomous Freight Consortium
  Staff Attrition Rate (OEA): 14% YTD | Audit Exposure: High
