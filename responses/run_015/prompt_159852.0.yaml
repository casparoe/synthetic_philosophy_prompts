answer: |-
  Here is a specification sheet for a theory of demandingness, designed to navigate the polarization between "give everything" and "give nothing."

  ### Part 1: The Desiderata Specification

  A viable theory of demandingness must process the following cases and preserve the following distinctions. I have marked these as **Non-Negotiable (NN)** (requirements for any theory claiming to match reflective equilibrium) or **Camp-Specific (CS)** (requirements that define specific moral traditions, e.g., common-sense morality vs. strict consequentialism).

  #### The Cases
  1.  **The Shallow Pond (Singer):** You can save a life at the cost of ruining your shoes.
      *   *Requirement:* The theory must generate an obligation here.
      *   *Status:* **NN.** Any theory that says you can walk past is morally inert.
  2.  **The Thousand People (Aggregation):** A thousand people each need $1 from you to survive. You have $1,000.
      *   *Requirement:* The theory must determine if the obligations aggregate. Does the total cost ($1,000) override the individual small costs ($1)?
      *   *Status:* **CS.** Consequentialists say yes (aggregate); some deontologists say no (each transaction is separate). A moderate theory must pick a threshold.
  3.  **The Isolation Case (Non-Compliance):** You are the only person who can help. Everyone else is walking by.
      *   *Requirement:* The theory must decide if your obligation increases because others are failing, or stays fixed at a "fair share."
      *   *Status:* **NN.** The theory cannot simply say "do your fair share" and leave the victim to die if no one else pays. It must handle non-ideal theory.
  4.  **The Inefficacy Case (Drop in the Bucket):** Your contribution is statistically negligible (e.g., carbon footprint, voting).
      *   *Requirement:* The theory must explain why you are obligated (or not) when your causal impact is near zero.
      *   *Status:* **NN.** It cannot rely solely on direct causal leverage, or it fails to handle collective action problems.

  #### The Distinctions
  5.  **Obligatory vs. Supererogatory:** The line between "what you must do" and "what is good to do but not required."
      *   *Requirement:* The theory must not collapse this distinction.
      *   *Status:* **CS.** Strict utilitarianism collapses this (everything is obligatory). A moderate theory **must** preserve this to avoid the "everything" extreme.
  6.  **Cost to Agent vs. Cost to Loved Ones:** The sacrifice of your own hobby vs. the sacrifice of your child's education.
      *   *Requirement:* The theory must weigh these differently.
      *   *Status:* **NN.** A theory that treats your child's welfare as identical to a stranger's violates basic human psychological and moral architecture.

  ---

  ### Part 2: The Two Argued Requirements

  You asked me to argue for two specific inclusions that are often overlooked. These are not just add-ons; they are structural load-bearing walls for any moderate theory.

  #### 1. The Epistemic Bill (The Cost of Knowing)
  Most theories calculate the cost of *action* (money given, time spent) but ignore the cost of *investigation*. In a complex global economy, knowing whether your inaction is harming people, or which intervention actually works, is expensive.

  **The Argument:**
  "Ought implies can" must be extended to **"Ought implies can know."** If a moral theory demands you maximize good, it implicitly demands you identify the good. In the modern world, identifying the most effective charity requires hours of research (reading impact reports, understanding counterfactuals, analyzing overhead).
  If a theory ignores this epistemic cost, it is lying about the total demand. It tells you to "give 10%," but hides the fact that ensuring that 10% actually helps requires 10 hours of unpaid labor per month.
  *   **Why it must be included:** If we do not cap the epistemic bill, the theory becomes self-defeating. An agent spends so much time researching how to help that they have no time left to work and earn the money to help. A moderate theory must include a **Epistemic Feasibility Constraint**: you are only obligated to research until the marginal cost of information exceeds the marginal expected benefit of better allocation. You are permitted to use heuristics (e.g., "give to this top-rated charity") rather than achieving certainty.

  #### 2. The Enforcement Ceiling (The Cost of Blame)
  A theory of demandingness is not just a guide for the agent; it is a tool for the community to hold the agent accountable. However, holding someone to a demand has a cost: social friction, psychological shame, relationship degradation, and the moral hazard of self-righteousness.

  **The Argument:**
  A theory can look modest if it only counts the cost to the person complying. But if enforcing that compliance requires toxic levels of blame, social ostracization, or coercive pressure, the *moral system itself* becomes too costly.
  *   **Why it must be included:** Morality exists to facilitate social cooperation, not to destroy the social fabric that makes cooperation possible. If a theory demands I give 50% of my income, but the only way to ensure I do that is for my community to shame me relentlessly, we must count the damage of that shame against the good of the donation. There is an **Enforcement Ceiling**: the cost of holding someone to a demand (in terms of social capital and psychological harm) cannot exceed the value of the compliance gained. If enforcing the rule breaks the relationships required to sustain the rule, the rule is invalid.

  ---

  ### Part 3: The Incompatible Pair

  You asked for the pair of desiderata that cannot both be satisfied. This is where the debate bottoms out. It is not a bug in the theories; it is a feature of reality.

  The incompatible pair is: **The Principle of Impartial Beneficence** vs. **The Prerogative of Personal Integrity.**

  1.  **The Principle of Impartial Beneficence:** Moral value is impartial. A dollar saved from a stranger's suffering is morally equivalent to a dollar spent on your own project. Therefore, you must continue to sacrifice until the cost to you equals the benefit to them. (This drives the "Everything" extreme).
  2.  **The Prerogative of Personal Integrity:** An agent is permitted to give extra weight to their own life, projects, and relationships, even if doing so results in less overall good. (This drives the "Nothing" or "Moderate" extreme).

  **Why they are incompatible:**
  You cannot satisfy both because they rely on contradictory accounts of *who you are*.
  *   Impartial Beneficence views you as a **channel for value**. Your life is a vessel through which resources flow to where they do the most good. Your personal projects are only valuable insofar as they contribute to the total good.
  *   Personal Integrity views you as an **author of value**. Your life is not just a vessel; it is a source of meaning. Your projects are valuable *because you chose them*, not because they maximized utility.

  **How the Epistemic and Enforcement arguments map onto this:**
  *   **The Epistemic Bill** is a defense of Integrity. It says, "I am not a calculator. I cannot spend my whole life optimizing."
  *   **The Enforcement Ceiling** is a defense of Integrity. It says, "My relationships are not just enforcement mechanisms for moral law."

  **The Bottom Line:**
  If you prioritize **Impartial Beneficence**, you must accept that the Epistemic Bill is infinite (you must always research more) and the Enforcement Ceiling is non-existent (you must blame non-compliance regardless of social cost). This leads to the "Everything" conclusion.

  If you prioritize **Personal Integrity**, you must accept that some preventable suffering will remain unaddressed because fixing it would require violating your epistemic limits or social boundaries. This leads to the "Moderate" or "Nothing" conclusion.

  You cannot have a theory that guarantees the maximum amount of good is done *and* guarantees you a life that feels like your own. You have to choose which failure mode you can live with: the failure of **efficiency** (leaving good undone) or the failure of **agency** (losing your life to the good).
