prompt: |-
  I’ve recently been pulled into a municipal digital-preservation initiative—I’m a distributed-systems engineer by training, fluent in replication logs, consistency models, garbage-collection policies, schema-migration protocols, and access-control design, but I have no formal background in critical archival theory. In our planning meetings, historians and community advocates keep insisting that the archive’s silences are not accidental omissions but structurally produced: that archives construct rather than merely preserve social reality, that absence is an active product of institutional design, and that the boundary between who gets recorded and who gets silenced tracks lines of authority rather than technical failure. I want you to restate those core claims—archives as instruments of power, silence as engineered, the record boundary as political—using only the vocabulary I actually work with: nodes, write permissions, audit trails, eventual consistency, schema enforcement, partition tolerance, garbage-collection schedules, and replication lag. Translate as faithfully as you can, mapping each conceptual claim onto a specific systems mechanism without smuggling philosophical baggage in under technical names.

  Then give me the residue report. Which parts translate cleanly—say, can intentional suppression be modeled as a write-permission rule, and can structural absence be treated as a garbage-collection policy? Which parts require distortion, such as treating political domination as a latency issue or treating epistemic erasure as schema migration? And what, if anything, has no counterpart at all in my framework—perhaps something analogous to ‘epistemic violence’ that consistency models simply cannot express? I need you to say whether the residue reveals a genuine blind spot in how database engineers conceptualize preservation, or whether the original archival-power claims were less precise than they sounded and only appeared substantive until forced into technical specificity. Do not cite specific theorists with dates or texts; treat the position as a living framework. I want to know whether my intuition that missing records are just missing writes captures the argument or misses something that cannot be reduced to access-control lists.
