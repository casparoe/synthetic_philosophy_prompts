  2.  **Deconstruct the Debate (The Structural Story):**
      *   *The Skeptic's Core:* It's not just epistemic ("we can't know"); it's ontological/semantic ("there is no fact of the matter"). Utility is a representation of preference ordering, not a measurable substance. $U_A(x) > U_B(y)$ is meaningless because utility functions are unique only up to positive affine transformations *within* a person, not *across* persons.
      *   *The Practitioner's Core:* It's not just intuitive ("it feels right"); it's pragmatic/normative ("refusing to compare leads to paralysis or cruelty"). The "category error" claim contradicts the phenomenology of moral experience and the requirements of policy.
      *   *The Hidden Fault Line:* The debate usually stalls because one side is talking about *measurement* (cardinality, zero-points) and the other is talking about *justification* (moral reasoning, public reason).
      *   *The "Common Currency" Issue:* Is well-being a *quantity* (like height) or a *status* (like priority)? If it's a quantity, we need a unit. If it's a status, we need a rule.

  3.  **Evaluate the User's Hypothesis (Contrastive-Indexed):**
      *   *Strengths:* It correctly identifies that "comparison" is polysemous. It highlights the pragmatic context ("for the purposes of some decision").
      *   *Weaknesses:* It might be *too* deflationary. If every comparison is indexed to a specific purpose, does it solve the metaphysical worry? The Skeptic will say, "Even for that purpose, you lack the data." The Practitioner will say, "The purpose creates the data."
      *   *Verdict:* It's a good diagnostic tool, but not a solution. It explains *why* they talk past each other, but doesn't tell them who is right. It needs to be sharpened into a distinction between *ontological comparability* and *operational commensurability*.

  4.  **Identify the Load-Bearing Threads:**
      *   **Thread 1: The Zero-Point Problem.** Can we align zero points across persons? (Is death zero for everyone? Is a hedonic neutral state zero?) This is the technical bottleneck.
      *   **Thread 2: The Nature of the "Fact".** Is the fact about well-being *out there* (realist) or *constructed by the choice model* (constructivist)?
