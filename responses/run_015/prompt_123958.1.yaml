      *Refining the "Contrastive-Indexed" critique:* The user suggests comparisons are indexed to a purpose. The risk is relativism. If the purpose changes, does the truth value change? The Skeptic will pounce on this. I should suggest framing it as *Contextual Validity* rather than just indexing.

      *Refining the "Hidden Empirical Question":* It's not just "do we feel pain similarly." It's "does the *structure* of valuation map similarly." Diminishing marginal utility is a structural claim. If my $100th dollar gives me less utility than your $1st, that's a structural comparison.

