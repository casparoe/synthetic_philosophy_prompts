      *   **User's Hypothesis:** The question isn't one yes/no question but a bundle. Comparisons are contrastive, indexed (respect, time, baseline, purpose). The debate mixes metaphysics, epistemology, and decision-procedure justification.
      *   **Constraints:** Do not just survey positions (they know them). No reading lists/citations. Want the *structural story*. Diagnose the load-bearing threads. Evaluate the user's hypothesis (sharpen or shoot down). Define what progress looks like. Be honest about whether the dispute can close.
