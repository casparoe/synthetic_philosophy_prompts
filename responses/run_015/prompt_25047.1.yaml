answer: |-
  This is a rich friction point. You are encountering the difference between a *descriptive mechanics of communication* (Grice) and an *aesthetics of representation* (Craft). Grice is interested in how meaning is successfully transmitted between rational agents; you are interested in how meaning is constructed, obscured, and layered for an audience observing those agents.

  Here is the translation of Grice's framework into the vocabulary of literary craft, followed by the residue report you requested.

  ### Part I: The Translation

  **1. The Cooperative Principle $\rightarrow$ The Scene Contract**
  In Grice's philosophy, the Cooperative Principle (CP) is the assumption that speakers are trying to communicate effectively. In craft, this maps to the **baseline expectation of coherence** within a scene. Even in conflict, readers assume characters are reacting to the same reality. When a character speaks, the reader assumes the utterance is a move in the scene's game (a beat). If a character speaks randomly, the reader searches for the *objective* behind the randomness. Grice's CP is the default setting of "this dialogue belongs in this scene."

  **2. The Maxims $\rightarrow$ The Rules of Engagement (Beats)**
  Grice's four maxims are the specific expectations a reader brings to how a character should speak to achieve their objective.
  *   **Maxim of Quantity (Information):** In craft, this is **Exposition vs. Economy**. A character giving too much information is "telling" or over-explaining (weakness/defensiveness). A character giving too little is "withholding" (power/mystery).
  *   **Maxim of Quality (Truth):** In craft, this is **Veracity/Sincerity**. A character adhering to this is being honest. A character violating this is **lying** or engaging in **self-deception**.
  *   **Maxim of Relation (Relevance):** In craft, this is the **Turn**. Does the dialogue advance the conflict? A character ignoring a question (violating Relation) is **deflecting**. This creates a shift in power or topic.
  *   **Maxim of Manner (Clarity):** In craft, this is **Voice and Idiolect**. Clarity is transparency. Obfuscation, hesitation, or poetic ambiguity are violations of Manner used to signal confusion, evasion, or heightened emotion.

  **3. Implicature $\rightarrow$ Subtext**
  Grice's "conversational implicature" is the precise mechanism of **subtext**. It is the meaning the reader infers *because* the literal text is insufficient or excessive. If a character asks "Do you love me?" and the other says "It's raining," the literal meaning is irrelevant (violating Relation), but the implicature (subtext) is "I cannot answer that." Grice provides the physics of how subtext lands: the reader resolves the tension between the literal line and the context to find the hidden meaning.

  **4. Flouting/Exploiting Maxims $\rightarrow$ Stylized Deviation**
  When Grice says a speaker "flouts" a maxim to generate meaning, in craft, this is **stylized deviation for effect**.
  *   *Flouting Quality:* Irony, sarcasm, metaphor.
  *   *Flouting Quantity:* Repetition for rhythm or emphasis (anaphora), or silence (caesura).
  *   *Flouting Manner:* Stream of consciousness, fragmented syntax to mimic distress.
  In both cases, the deviation is not an error; it is a signal that there is more meaning beneath the surface.

  **5. Speaker Meaning $\rightarrow$ Character Intention (Objective)**
  Grice's "speaker meaning" is what the character wants to achieve by speaking. In craft terms, this is the **Scene Objective**. However, Grice assumes the speaker *wants* the listener to recognize this intention. In fiction, a character often wants the listener to *misunderstand* the intention (deception).

  ***

  ### Part II: The Residue Report

  Here is where the mapping holds, where it strains, and where it breaks.

  **1. Clean Mappings**
  *   **Subtext as Implicature:** This is the strongest link. Grice explains *why* subtext works. It works because the reader is a cooperative interpreter who refuses to accept that a character would speak irrelevantly or falsely without reason. When a character flouts the Maxim of Relation, the reader instinctively hunts for the subtextual connection. Grice validates the craft intuition that "what is unsaid" is often "what is meant."
  *   **Lying as Maxim Violation:** Grice treats lying as a violation of the Maxim of Quality. Craft treats it as a breach of trust. Both agree that the meaning lies in the gap between the utterance and the reality known to the interpreter.

  **2. The Stretches (Where Grice Requires Adjustment)**
  *   **The Assumption of Cooperation:** Grice assumes speakers generally *want* to be understood. In literary dialogue, characters often *do not* want to be understood (e.g., a teenager deflecting a parent, a spy lying to a handler). To make Grice fit, you have to view the "Cooperation" not as the character's desire, but as the **Reader's Expectation**. The reader cooperates with the *author* to decode the character's non-cooperation. You have to shift the locus of cooperation from the *dialogue* to the *narrative structure*.
  *   **Rationality vs. Psychology:** Grice assumes a rational agent calculating implications. Literary characters are often irrational, emotional, or unconscious. A character might violate the Maxim of Manner (speaking confusingly) not to generate a specific implicature, but because they are traumatized. Grice calls this "clashing" of maxims; craft calls this **interiority bleeding into exteriority**. Grice struggles to account for meaning generated by pure psychological fragmentation rather than strategic communication.

  **3. The Blind Spots (Where Craft Exceeds Grice)**
  *   **The Third Party (The Reader):** Grice's model is dyadic (Speaker $\rightarrow$ Listener). Fiction is triadic (Character $\rightarrow$ Character $\rightarrow$ Reader). Grice has no vocabulary for **Dramatic Irony**, where the Reader knows the Maxim of Quality is being violated, but the Listener in the scene does not. Grice analyzes the lie; he does not analyze the *tragedy* of the lie being believed.
  *   **Aesthetics of Failure:** In Grice's framework, a communication breakdown is a failure of the system. In literary craft, communication breakdown is often the **theme**. Two characters talking past each other (violating Relation repeatedly) is a successful *scene* even if it is a failed *conversation*. Grice evaluates the efficiency of the exchange; Craft evaluates the emotional resonance of the exchange.
  *   **Narrative Voice:** Grice deals with utterances. He has no mechanism for **Free Indirect Discourse (FID)**. In FID, the "speaker" is a hybrid of character and narrator. Who is flouting the maxim? The character or the narrative voice? Grice's binary of Speaker/Listener cannot easily parse the blurred agency of FID.

  ***

  ### Part III: The Unreliable Narrator and Irony Question

  You suspected that Grice presupposes a cooperative transparency that breaks down with unreliable narration or dramatic irony. Your suspicion is correct, but the limitation is specific.

  **1. The Limitation of Grice**
  Grice's framework is designed to explain how we successfully extract meaning from utterances. It is a theory of *recovery*. Unreliable narration is a theory of *deception*.
  *   **In a standard lie:** The Character violates Quality. The Listener (if sharp) infers the implicature ("He is lying"). Communication succeeds.
  *   **In dramatic irony:** The Character violates Quality. The Listener (in the book) accepts it. The Reader (you) sees the violation.
  *   **In unreliable narration:** The Narrator violates Quality. The Reader eventually infers this.

  Grice can describe the *mechanism* of the lie (Violation of Quality), but he cannot describe the *aesthetic effect* of the irony. Grice explains how you know the narrator is lying; he does not explain why that makes the story *better* or what that says about the human condition. He captures the *signal*, not the *noise*.

  **2. The Limitation of Craft (Where Grice Helps)**
  Conversely, there is something Craft misses that Grice captures. Craft vocabulary often treats subtext as magic ("just write it deeper"). Grice provides a **diagnostic toolkit** for why a line of dialogue isn't landing.
  *   If a scene feels "on the nose," it is likely because the characters are adhering too strictly to the Maxims of Quantity and Manner (being too clear and informative).
  *   If a scene feels "confusing" in a bad way, the characters may be flouting the Maxim of Relation without enough context for the reader to generate the implicature.
  *   Grice forces you to ask: *Which specific expectation is being violated here?* Is the character lying (Quality), hiding (Quantity), deflecting (Relation), or confused (Manner)? Craft often lumps these all under "subtext." Grice distinguishes the *types* of subtext.

  **3. The Verdict on Transparency**
  Grice does not presuppose that speakers are *honest*; he presupposes that they are *interpretable*. Even a liar is "cooperating" in the broad sense that they are participating in a system where truth is the norm, which allows their lie to be recognized as a lie (eventually).
  *   **For the Unreliable Narrator:** The Author is cooperating with the Reader (following Gricean norms at the meta-level) to show the Narrator violating them. The "Cooperative Principle" shifts up one level. The Contract is not between Narrator and Reader; it is between Author and Reader. The Author signals: "Trust me that you cannot trust him."
  *   **For Dramatic Irony:** This requires a **Dual-Track Gricean Analysis**.
      *   *Track A (Character-Character):* Speaker violates Quality; Listener accepts it. (Communication succeeds falsely).
      *   *Track B (Author-Reader):* Author signals the violation; Reader infers the truth. (Communication succeeds truly).
      Grice's framework doesn't inherently handle Track B, but it can be layered to do so.

  ### Summary Recommendation

  Your philosopher friend is right that Grice changes how you think about dialogue, but not because Grice offers a better theory of *fiction*. He offers a better theory of *inference*.

  Use Grice not as a rule for how characters should speak, but as a diagnostic for how readers process speech. When you write a line of dialogue, ask: **Which Maxim is my character flouting, and what implicature am I forcing the reader to compute?**

  *   If they answer a question with a question (Relation), the reader computes *deflection*.
  *   If they give too much detail (Quantity), the reader computes *anxiety or guilt*.
  *   If they speak too plainly (Manner) in a complex situation, the reader computes *danger or finality*.

  Grice will not help you with the unreliable narrator's soul or the tragic arc of dramatic irony. But he will help you tighten the screws on the dialogue beats so that the subtext is not just felt, but structurally inevitable. He turns "subtext" from a mystical atmosphere into a load-bearing architectural element.
