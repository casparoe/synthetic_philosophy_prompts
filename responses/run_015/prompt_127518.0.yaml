  Hey, I was thinking about our stalled discussion on cognitive penetration and I tried to construct a case that isolates the belief-formation pathway to see if that triggers the difference we were looking for. Imagine two senior radiologists, Elena and Marcus, examining the same ambiguous MRI scan showing a faint grey smear in the lower quadrant that could either be healthy tissue or a machine artifact. Both hold the identical high-level belief that the scanner suffered a specific magnetic coil drift yesterday which typically generates false shadows in this exact region, meaning the smear should be ignored as noise. However, Elena acquired this belief through direct expert testimony when the chief engineer personally warned her about the drift before she started, whereas Marcus derived the same conclusion independently by cross-referencing maintenance logs and analyzing prior scan anomalies from that morning. When viewing the screen, Elena reports literally seeing a clear, continuous tissue structure where the smear appears to others, while Marcus reports seeing the confusing grey smear but confidently concluding it is harmless noise based on his data, suggesting the sensory input itself shifted for Elena but remained static for Marcus despite their identical factual beliefs about the machine's history.

  A penetrability theorist would argue that Elena's testimonial belief bypassed the central reasoning system and directly modulated her early visual processing, literally altering the phenomenology of the smear into tissue, whereas Marcus's inferential belief remained trapped in the central system, leaving his perception encapsulated. An encapsulation defender like Fodor would counter that both saw the identical grey smear and that Elena's report reflects a post-perceptual judgment bias where she is simply more willing to dismiss the noise due to the social weight of the engineer's warning, not because her eyes saw something different. The specific feature doing the work here is the immediacy and lack of cognitive mediation in the testimonial pathway, which might allow the belief to access perceptual modules before encapsulation walls solidify, unlike Marcus's reasoning which consumes working memory and keeps the belief central. If you remove this feature and have both doctors derive the belief through inference, the case collapses back into a standard example where any difference in reporting is attributed to confidence levels rather than perceptual change, stripping the thought experiment of its unique leverage. A Fodor-style critic would attack this by insisting that modular systems are informationally encapsulated regardless of provenance, arguing that if the content is identical, the causal route shouldn't matter to the module, so any observed difference must be due to attentional shifts or response bias rather than true penetration. Regarding your roommate's hunch, the testimony-versus-inference distinction might feel like the key, but it is likely a red herring masking the real mechanism of cognitive load or attentional priority, since modules shouldn't care about social epistemology, meaning the distinction only matters insofar as testimony reduces the computational work required to hold the belief, freeing resources to influence perception indirectly.
