  8.  **Final Polish:** Check for clarity on the "learning by repetition" vs. "visual education" distinction. That's a key insight for a museum designer. (Museums *are* educational spaces, so Neurath is actually more relevant there than airports).

  *(Self-Correction during drafting)*: I need to be careful not to overstate Neurath's "anti-naivety." He *did* believe pictures had a more direct access to memory than words. But he knew that access wasn't *inherent*, it was psychological/sociological. I need to nuance that.

  *(Refining the "Words Divide" quote)*: It's often cited as "Words divide, pictures unite." The actual sentiment is in *International Picture Language* (1936). He argued words create Babel; pictures offer a bridge. But he knew the bridge had to be built (taught).

  *(Signage Politics)*: The "Running Man" exit sign is a great example. It's not a universal human; it's a specific athletic male body. That's political.

