      *   **Part 4: What if we took Neurath seriously? (Design Implications):**
          *   *Education:* Don't just hang the sign; teach the sign (museum context is perfect for this!).
          *   *Text Partnership:* Re-integrate text as a partner, not a failure state.
          *   *Transformation:* Use signs to tell a story/statistic, not just command.
          *   *Honesty:* Admit the convention.
      *   **Part 5: What if we dropped it?**
          *   Double down on multimodal (AR, audio, text).
