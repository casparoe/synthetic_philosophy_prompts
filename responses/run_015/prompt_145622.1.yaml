answer: |-
  This is a exceptionally sharp reading of the situation. You have identified the central tension in visual communication theory: the gap between the *ideology* of the universal symbol (it speaks to everyone) and the *methodology* of its creation (testing, standardization, iteration).

  You are also largely correct on Neurath. Your grasp of his nuance is better than most design history summaries. Below, I will break down the scholarship on Neurath (settled vs. contested), analyze the presuppositions of modern signage standards, and explore what a "Neurathian" signage practice would actually look like in a museum context.

  ### 1. Neurath and ISOTYPE: Settled vs. Contested

  You asked to flag misconceptions and separate consensus from debate. Your summary is remarkably accurate, but here is the scholarly breakdown.

  **Settled Scholarship (Consensus)**
  *   **Not Naive:** It is settled that Neurath was not a mystic about images. He did not believe pictures were inherently self-evident. He viewed ISOTYPE as a *technical* tool, not an artistic or spiritual one.
  *   **Education is Required:** Neurath explicitly argued for "visual education." He believed the public needed to be taught how to read charts and symbols, much like they are taught to read text. ISOTYPE was meant to be a curriculum, not just a font.
  *   **Limits of the Medium:** Neurath acknowledged ISOTYPE could not handle logical operators (if/then, not, maybe) with the precision of text. It was for *quantities* and *relationships*, not arguments.
  *   **Complement, Not Replacement:** The consensus (championed by historian Robin Kinross) is that Neurath never intended ISOTYPE to replace text entirely. It was to function alongside text to make statistical and social data accessible to the working class.
  *   **Arntz's Role:** Gerd Arntz was the visual architect. Neurath provided the sociological method; Arntz provided the aesthetic consistency (the "transformation" of data into repeatable units).

  **Contested / Nuanced Interpretations**
  *   **"Words Divide, Pictures Unite":** This slogan is often treated as dogma, but scholars debate its intent. Some (like Kinross) argue Neurath used this rhetorically to promote a socialist internationalism. Others argue it reveals a lingering faith in the *psychological* immediacy of images, even if he admitted they needed teaching. Did he think pictures were *more* universal, or just *easier to standardize*? The former is contested; the latter is settled.
  *   **The Politics of Form:** There is debate over how "neutral" Neurath thought the symbols were. Neurath was an open socialist. He knew the *content* was political. But did he think the *style* (the flat, colorless silhouette) was politically neutral? Some critical design historians argue the "objective" style itself was a political claim to truth and authority, masking the subjectivity of the data selection.
  *   **Success vs. Aspiration:** How successful was ISOTYPE as an *international* language? Consensus says: not very, outside of specific contexts (museums, housing projects) in Europe. Its legacy is more in infographics and pictograms than a true spoken-language equivalent.

  ### 2. What Modern Signage Practice Presupposes

  You asked what the practice of testing wordless symbols presupposes about meaning.

  **The Presupposition: "Acquirable Convention," not "Natural Meaning"**
  If signage bodies (like ISO or ADA) strictly believed pictures were natural (iconic in the Peircean sense), they would not need to test them. A picture of a fire that looks like fire would be instantly understood by all humans without testing.
  The fact that they test implies they know symbols are **symbolic** (arbitrary/conventional), not just **iconic**.

  However, the *deployment* of the signs pretends they are natural.
  *   **The Contradiction:** The testing phase admits the sign is a language that must be learned. The installation phase assumes the learning has already happened.
  *   **The Mechanism:** Modern wayfinding relies on **exposure**, not **education**. Neurath wanted schools to teach visual literacy. Airports rely on the fact that you have seen the "baggage claim" icon at three other airports this year. It is behaviorist conditioning, not literacy.

  **Does it need the "Naive View"?**
  No. It is compatible with Neurath's view *if* you assume the "teaching" happens via cultural osmosis rather than curriculum. However, it violates Neurath's ethics. Neurath wanted to empower the viewer with tools to understand society (statistics, housing, health). Signage wants to direct the viewer's body for efficiency and safety. One is democratic education; the other is logistical management.

  ### 3. Does Wordlessness Buy Neutrality?

  **Short Answer:** No. A standardized stick figure is deeply political.

  **The Politics of the "Universal"**
  *   **The Body:** The ISO "Running Man" (exit sign) is not a universal human. It is an able-bodied, athletic, typically male figure in a specific stride. It excludes those with mobility issues. By presenting this as "universal," it naturalizes a specific type of body as the norm.
  *   **Cultural Specificity:** A "envelope" icon for mail is nonsensical to a generation that only knows email, and to cultures that never used that specific flap-seal envelope.
  *   **Neurath vs. ISO:** Neurath's politics were *explicit*. He knew he was promoting a socialist worldview. Modern signage politics are *implicit*. They claim neutrality ("this is just a person") while enforcing Western norms of gender, ability, and object categorization.
  *   **The Erasure of Language:** Removing words doesn't remove power; it removes the ability to contest the meaning. Text can be translated and debated. A symbol is presented as a fact. In this sense, wordless signage is *more* authoritarian than bilingual signage, not less.

  ### 4. What Would Change If We Took Neurath Seriously?

  As a museum designer, you are in the unique position of actually being able to apply Neurath's method, because museums are educational institutions, not just transit hubs.

  **If you adopted Neurath's view:**
  1.  **Teach the Legend:** Don't assume the icon is known. In an exhibit, introduce the visual language *before* you use it. "In this gallery, a red triangle means X." Make the code explicit.
  2.  **Pair with Text:** Stop treating text as a failure of design ("If we have to add words, the icon failed"). Treat text and image as partners. Neurath's charts always had titles and keys.
  3.  **Show the Transformation:** Neurath loved showing *how* data became a picture. In a science museum, you could show the process: "Here is the number 1000. Here is how we turn that into 10 little figures." This builds visual literacy for the next sign.
  4.  **Accept Limits:** Don't try to make a pictogram for complex concepts (e.g., "Climate Change Mitigation Strategies"). Use text for the argument, images for the magnitude.
  5.  **Localize:** Neurath adapted ISOTYPE for different countries (changing the figures' clothing, for example). Instead of one global standard, consider if your signage needs to shift for different community contexts within the museum's reach.

  **If you dropped Neurath's view (and leaned into pure Semiotics/UX):**
  1.  **Multimodality:** Accept that pictures are just one channel. Use haptics, audio, and AR. Don't burden the visual channel with everything.
  2.  **Personalization:** Digital signage can adapt to the user's language and literacy level, removing the need for a "universal" symbol entirely.
  3.  **Explicit Convention:** Be honest. "This is a symbol we have chosen. Here is what it means." Treat it like a UI button, not a natural sign.

  ### 5. Summary of the Tension

  The friction you feel comes from the fact that modern signage design is **Modernist in style but Behaviorist in function.**

  *   **Modernist Style:** Clean, reduced, "universal" (The Neurath/Arntz aesthetic).
  *   **Behaviorist Function:** Stimulus -> Response. (Push button -> Door opens. See man -> Walk here).

  Neurath was a **Rationalist**. He wanted the viewer to *understand* the social reality behind the image. He wanted the viewer to think, "Ah, this chart shows housing inequality."
  Signage bodies want the viewer to *react*. "Ah, this icon shows toilet."

  **The Verdict on your Observation:**
  You are correct that the industry operates on a contradiction. They test for convention (admitting it's learned) but deploy for universality (pretending it's innate).
  *   **Is it compatible with Neurath?** Only superficially. They use his aesthetic but discard his pedagogy.
  *   **Is it naive?** Yes, but strategically. It is more efficient to pretend a symbol is universal than to educate every traveler on the ISO 7010 standard.
  *   **Is it neutral?** No. It imposes a specific visual order on a chaotic world.

  **For your practice:**
  Since you are in a science museum, you have a mandate Neurath would approve of: **Visual Education.** You don't have to pretend your icons are magic. You can use your exhibits to teach visitors how to read the signage, creating a feedback loop where the signage becomes clearer because the audience is more visually literate. That is the one place where Neurath's dream is still viable.

  ### Recommended Reading (to check my work)
  *   **Robin Kinross, *Modern Typography* and his essays on Neurath.** Kinross is the primary English-language interpreter who moved Neurath away from "mystic universalist" to "pragmatic educator."
  *   **Otto Neurath, *International Picture Language* (1936).** The primary source. Read the introduction; he is very clear about the limits of the system there.
  *   **Margaret Garlake, *New Art, New World*.** Discusses the political context of Modernist design standards.
  *   **ISO 7010 Documentation.** Look at the "criteria for acceptance" in their testing protocols. It explicitly admits the need for cross-cultural validation, proving they know it isn't "natural."
