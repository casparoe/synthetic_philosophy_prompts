  3.  **Evaluate Coherence/Tensions:**
      *   **Tension A: (1) & (2) vs. (5).**
          *   (1) says there's a fact of the matter.
          *   (2) says multiple concepts capture genuine aspects (pluralism).
          *   (5) says if concepts disagree, only one can be right.
          *   *Conflict:* If pluralism is true (2), often incompatible classifications (lumping vs. splitting) are *both* legitimate reflections of reality. If (5) is true (only one right), then pluralism seems limited or false in cases of disagreement. Realist pluralism usually accepts that multiple classifications can be *correct* relative to different theoretical aims, not that only one is "true" in a conflict. (5) sounds like monist realism.
      *   **Tension B: (2) vs. (3).**
