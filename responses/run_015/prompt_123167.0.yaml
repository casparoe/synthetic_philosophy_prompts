  ### Brainstorming and Conceptual Mapping

  **Established Concepts & Nearest Neighbours:**
  *   **Motte-and-Bailey Fallacy:** The closest rhetorical analogue. However, as you note, the 'motte' (static convergence) is not a trivial truth but a substantive, contested mathematical claim. The 'bailey' (dynamic efficiency) is not necessarily absurd, merely unproven in that context. The standard M&B definition relies on one position being obviously defensible and the other obviously not; here, both are economically substantive.
  *   **Equivocation:** Standard equivocation relies on a shift in the *meaning* of a term (e.g., 'value'). Here, the terms ('efficiency', 'allocation') retain their meaning, but the *domain of applicability* shifts.
  *   **The Proviso Problem (Hempel/Cartwright):** Economic models hold *ceteris paribus*. The defender applies the model where the proviso (stable functions) does not hold, then retreats to the proviso when challenged.
  *   **Immunising Stratagem (Lakatos):** Protecting the 'hard core' of a research programme (planning is feasible) by adjusting the 'protective belt' (static vs. dynamic scope).
  *   **Reification/Model-World Conflation:** Treating the mathematical map (static equilibrium) as the territory (dynamic market process).
  *   **Static-Dynamic Dichotomy:** A standard economic distinction, but usually descriptive, not argumentative.

  **Boundaries and Distinctions:**
  *   *Vs. Scope Ambiguity:* Ambiguity is often unintentional linguistic vagueness. This pattern is functional and strategic.
  *   *Vs. Popperian Retreat:* Popper discusses *ad hoc* hypothesis adjustments to save a theory from falsification. This is not adjusting the hypothesis, but oscillating the *domain of application* for the same hypothesis.
  *   *Vs. Defensive Qualification:* A sincere qualification limits the claim permanently. Here, the limitation is temporary and tactical.

  **Proposed Conceptual Label:**
  Since no single canonical term exists in general argumentation theory that captures this specific *economic-methodological* oscillation, I shall define it as **"The Static-Dynamic Warrant Slide."** It relies on **Formal Isomorphism** (the math looks the same) to transfer warrant from one domain to another.

  ---

  ### Response

  You have identified a structural vulnerability that lies at the heart of the modern reconstruction of the Socialist Calculation Debate (SCD), particularly in the literature surrounding 'Cybernetic Socialism' or algorithmic planning (e.g., the work of Cottrell, Cockshott, or Paul Mason). While this manoeuvre is frequently discussed in substantive economic terms—often subsumed under the "Dynamic Knowledge Objection" or the "Equilibrium vs. Process" critique—it lacks a singular, canonical label in general argumentation theory.

  It is sometimes colloquially grouped under the **motte-and-bailey** fallacy in contemporary online discourse. However, your intuition is correct: that classification is imprecise. In a standard motte-and-bailey, the 'motte' is a trivially true or uncontroversial claim to which the arguer retreats. In the Langean configuration you describe, the static convergence proof is *not* trivial; it is a substantive, mathematically rigorous claim that is merely *restricted in scope*. Both the static and dynamic claims are substantive; the fallacy lies not in the defensibility of the core, but in the illegitimate transfer of justification between them.

  Nor is it plain equivocation. The defender is not changing the definition of 'price' or 'efficiency'; they are changing the *ontological status of the time variable* while keeping the formal apparatus constant.

  Given the absence of a pre-existing proper noun for this specific configuration, I propose we designate this argumentative structure as **The Static-Dynamic Warrant Slide**. Below, I provide the precise conceptual carving you requested, distinguishing it from its nearest neighbours and mapping its boundaries.

  #### 1. Definition: The Static-Dynamic Warrant Slide

  **The Static-Dynamic Warrant Slide** is an argumentative manoeuvre in which a proponent exploits the **formal isomorphism** between a static model and a dynamic reality to transfer epistemic warrant from the former to the latter, oscillating between the two domains strategically to evade criticism.

  It requires three conditions to be met:
  1.  **Formal Isomorphism:** There exists a mathematical or logical apparatus (e.g., linear algebra, iterative algorithms) that is valid within a restricted, static domain (given preferences, fixed production functions).
  2.  **Domain Oscillation:** The proponent asserts the validity of the apparatus in a dynamic domain (shifting preferences, innovation) where the underlying assumptions of the proof do not hold. When challenged on the dynamic claim, they retreat to the validity of the static proof. When the challenge subsides, they resume asserting the dynamic capability.
  3.  **Warrant Transfer:** The credibility of the static proof is used to bolster the dynamic claim, while the modesty of the static scope is used to shield the dynamic claim from falsification.

  #### 2. Distinction from Related Concepts

  To carve this concept precisely, we must distinguish it from four neighbouring argumentative phenomena:

  **A. Versus the Motte-and-Bailey Fallacy**
  *   *The Difference:* In a motte-and-bailey, the 'motte' is typically a tautology or a trivial truth (e.g., "we should help the poor") used to defend a controversial 'bailey' (e.g., "specific tax policy X"). In the Warrant Slide, the 'motte' (static convergence) is a non-trivial, contested technical claim. The fallacy is not that the core is indefensible, but that the *warrant* for the core does not extend to the broader claim. The motte-and-bailey relies on *truth-value asymmetry*; the Warrant Slide relies on *domain asymmetry*.

  **B. Versus Scope Ambiguity**
  *   *The Difference:* Scope ambiguity is usually a linguistic error where the boundaries of a quantifier or term are unclear (e.g., "everyone loves a winner"). The Warrant Slide is not a confusion of language but a strategic oscillation of *model application*. The defender knows the scope is static; they merely exploit the listener's assumption that the model's success implies real-world dynamism. It is rhetorical, not linguistic.

  **C. Versus Defensive Qualification**
  *   *The Difference:* A sincere defensive qualification permanently narrows the claim (e.g., "This model only applies to short-run equilibrium"). In the Warrant Slide, the qualification is temporary. Once the critic withdraws, the defender drops the qualification without explicitly announcing the shift, resuming the broader implication that the mechanism solves the dynamic problem. It is the *resumption* of the broader claim that marks the slide.

  **D. Versus Popperian Immunisation (Ad Hoc Hypothesis)**
  *   *The Difference:* Popper discussed modifying a theory to save it from falsification (e.g., adding a new planet to save orbital mechanics). The Warrant Slide does not modify the theory. The mathematical model remains identical. Instead, it modifies the *interpretation of the model's reach*. It is a shift in *pragmatics*, not *syntax*.

  #### 3. The Enabling Condition: Formal Isomorphism

  What makes this slide possible, and why it is specific to economics and complex systems, is the **Formal Isomorphism**. In the Lange model, the iterative algorithm for finding equilibrium prices looks mathematically similar whether the parameters are fixed or slowly changing. Because the *symbols* on the page remain the same ($\mathbf{p}_{t+1} = \mathbf{p}_t + \mathbf{d}_t$), the defender implies the *properties* remain the same.

  This is the crucial boundary case. If the mathematical formalism for the dynamic case were visibly distinct from the static case (e.g., requiring stochastic calculus rather than linear algebra), the slide would be impossible. The Warrant Slide thrives only where the static and dynamic models share a surface-level formal resemblance, allowing the rigour of the former to mask the speculation of the latter.

  #### 4. Boundary Cases and Legitimacy

  To ensure this concept is not over-applied, we must identify where such oscillation is *legitimate*.

  *   **Legitimate Approximation:** If a defender claims, "The static model is a first-order approximation of a dynamic process, and we acknowledge error terms," this is standard modelling practice. It becomes a Warrant Slide only when the error terms are ignored during the claim of efficiency but invoked during the defence against criticism.
  *   **Comparative Statics:** In standard neoclassical economics, moving from one equilibrium to another (comparative statics) is a valid method. It becomes a Warrant Slide only when the *path* between equilibria (the dynamic process) is claimed to be costless or instantaneous without proof, relying solely on the existence of the endpoints.

  #### 5. Conclusion

  The configuration you have identified is a specific species of methodological equivocation facilitated by mathematical formalism. While it shares DNA with the motte-and-bailey, it is distinct enough to warrant its own classification within the philosophy of economics.

  By labelling it **The Static-Dynamic Warrant Slide**, we capture the essential mechanism: the sliding of epistemic warrant across a temporal boundary that the formalism obscures. It highlights that the error is not in the static proof itself, nor necessarily in the dynamic hope, but in the rhetorical bridge that treats the former as sufficient evidence for the latter. This conceptual carving allows critics to pinpoint the exact moment the argument shifts from mathematical demonstration to speculative assertion, without dismissing the validity of the static analysis itself.
