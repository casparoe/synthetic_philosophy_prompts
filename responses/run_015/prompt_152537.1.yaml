  # SCORING KEY (INSTRUCTOR ONLY)

  **Mapping Answer Patterns to Accounts**

  *   **Hidden Nature (Realism)**
      *   *Profile:* Q1/Q2 (Early Cutoffs: A or B); Q3 (Dish A); Q4 (Missing Information); Q5 (Broken); Q7 (Same Rule).
      *   *Logic:* There is a fact about the food we are trying to find. Slippage is error.

  *   **Meaning Shift (Diachronic Change)**
      *   *Profile:* Q5 (Updated); Q4 (Pick a Line); Q1/Q2 (Flexible).
      *   *Logic:* The dispute is about how the word has moved over time, not the food itself.

  *   **Cluster (Similarity)**
      *   *Profile:* Q1/Q2 (Late Cutoffs: C or D); Q8 (Protecting/Encouraging mixed); Q4 (Missing Information); Q3 (Process usually wins but flexible).
      *   *Logic:* No single rule, but a weighted set of features. Slippage is due to overlapping traits.

  *   **Copycat/Valence (Transferred Feel)**
      *   *Profile:* Q3 (Dish B); Q8 (Encouraging Pride); Q1/Q2 (Flexible if feel is right).
      *   *Logic:* The label tracks the *care* or *authenticity* vibe, not the technical process.

  *   **Fluid (Active Analogy)**
      *   *Profile:* Q7 (Different Rule); Q5 (Updated); Q4 (Pick a Line); Q1/Q2 (Very Late/Context dependent).
      *   *Logic:* Slippage is how the word works. It stretches by analogy to fit the moment.

  *   **Practitioners' Call (Use-Based)**
      *   *Profile:* Q6 (People who cook/sell); Q4 (Missing Information [found in practice]); Q1/Q2 (Aligns with industry standards).
      *   *Logic:* Meaning is fixed by the people who wield the tool professionally.

  *   **Engineering/Fix (Utility)**
      *   *Profile:* Q4 (Pick a Line); Q8 (Protecting or Encouraging [based on goal]); Q7 (Different Rule); Q6 (Rest of Us [if regulatory]).
      *   *Logic:* We should define this based on what outcome we want (safety vs. morale).

  **Note on Ambiguity:**
  *   **Cluster vs. Fluid:** Look at Q7. Cluster tends toward "Same Rule" (weights are stable); Fluid tends toward "Different Rule" (analogy shifts).
  *   **Engineering vs. Practitioners:** Look at Q6. Engineering often selects "Rest of Us" (regulatory); Practitioners selects "People who cook." If Q8 is "Protecting," Engineering may align with Practitioners.
