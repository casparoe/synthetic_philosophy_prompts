  # DESIGN NOTES (INSTRUCTOR ONLY)

  **Logical Space & Account Mapping**
  The instrument maps responses onto seven theoretical accounts based on tolerance thresholds, authority loci, and attitudes toward change.

  1.  **Hidden Nature:** Strict cutoffs (Q1/Q2 early), Process > Valence (Q3), Dispute = Fact (Q4), Change = Broken (Q5).
  2.  **Meaning Shift:** Change = Updated (Q5), Dispute = Decision (Q4).
  3.  **Cluster:** Fuzzy cutoffs (Q1/Q2 late), Result/Feel > Process (Q8), Dispute = Fact (Q4).
  4.  **Copycat/Valence:** Valence > Process (Q3), Result/Feel > Process (Q8).
  5.  **Fluid:** Context Matters (Q7), Change = Updated (Q5), Dispute = Decision (Q4).
  6.  **Practitioners' Call:** Authority = Experts (Q6).
  7.  **Engineering/Fix:** Dispute = Decision (Q4), Goal = Utility (Q8), Context Matters (Q7).

  **Indistinguishable Leaves**
  1.  **Cluster vs. Fluid:** Both permit slippage and late cutoffs on Q1/Q2. Without a question probing *why* the slippage occurs (weighted properties vs. active analogy), these profiles may overlap significantly.
  2.  **Engineering vs. Practitioners:** Both look outward for resolution (Q6/Q8). If the "experts" (Practitioners) are assumed to optimize for "utility" (Engineering), the answer patterns will converge.

  **Unoccupied Combinations**
  1.  **Q4 (Fact) + Q7 (Context Changes Rule):** *Incoherent.* If there is a single fact of the matter about the word, the rule cannot shift based on the situation without contradicting the existence of the fact.
  2.  **Q6 (Experts Decide) + Q5 (Usage Updates Word):** *Unattractive.* If authority rests with specific practitioners, common usage drift should not automatically update the meaning; this combination undermines the claimed authority.

  ***

  # HANDOUT: WHERE DOES 'HOMEMADE' STOP?

  **Instructions:**
  Below are eight questions about how we use the word "homemade." There are no right or wrong answers. Do not overthink your first instinct. Mark the option that best fits your view.

  **1. The Ingredient Slide**
  Look at this sequence of cakes. Mark the **last** one you would call "homemade" without feeling like you need to explain yourself further.
  *   [ ] A. Flour, sugar, eggs, and butter mixed by hand from separate containers.
  *   [ ] B. A box mix where you add your own eggs and oil.
  *   [ ] C. A meal kit with pre-measured ingredients that you cook.
  *   [ ] D. A rotisserie chicken from the store that you plate and garnish.

  **2. The Location Slide**
  Look at this sequence of places. Mark the **last** one where the location counts as "home" enough for the label to work.
  *   [ ] A. Your kitchen, cooked by your hands.
  *   [ ] B. Your kitchen, cooked by a machine you programmed.
  *   [ ] C. A restaurant kitchen, cooked by hand on the premises.
  *   [ ] D. A factory, shipped to a restaurant for reheating.

  **3. The Spirit of the Word**
  Imagine two dishes. Dish A was made from scratch but the cook rushed it and hated the process. Dish B was made from a mix but the cook put immense care and love into it. If you could only use the word "homemade" for one of them to capture what the word is *for*, which do you choose?
  *   [ ] Dish A (Scratch/Hate)
  *   [ ] Dish B (Mix/Love)

  **4. Settling Arguments**
  Two people argue over whether a meal-kit counts as "homemade." One says yes, one says no. What is happening in this argument?
  *   [ ] They are missing some information about the food that would settle it.
  *   [ ] They need to pick a line because the word doesn't decide for them.

  **5. Drift Over Time**
  Fifty years ago, "homemade" meant scratch only. Today, many people use it for meal kits. Is the word broken now, or has it simply updated?
  *   [ ] Broken (people are using it wrong)
  *   [ ] Updated (the word grew to fit new things)

  **6. Who Decides?**
  When there is confusion about whether something counts, whose call is it?
  *   [ ] The people who cook and sell food (chefs, bakers, manufacturers).
  *   [ ] The rest of us who eat and talk about it.

  **7. Changing Contexts**
  Should the rule for what counts as "homemade" be the same everywhere, or can it change depending on why you are asking (e.g., a cooking contest vs. a restaurant menu)?
  *   [ ] Same rule everywhere.
  *   [ ] Different rule depending on the situation.

  **8. The Goal of the Label**
  Why do we have this word? What job is it doing?
  *   [ ] Protecting people from being misled about what they buy.
  *   [ ] Encouraging people to feel pride in what they make.

