answer: |-
  **ORGANIZATION FOR COORDINATED ACTION (OCA)**
  **STANDARD OPERATING PROCEDURE 74-B**
  **SUBJECT: MITIGATION OF UNILATERALIST HAZARD IN HIGH-IMPACT INTERVENTIONS**
  **VERSION: 2.1**

  **1.0 PURPOSE AND DEFINITION OF HAZARD**
  1.1 This protocol governs interventions where multiple agents possess independent noisy signals regarding a common value variable $V$.
  1.2 The Unilateralist Hazard arises when $n$ agents can independently initiate an intervention. If any single agent's signal $s_i$ exceeds a threshold $\theta$, the intervention occurs.
  1.3 Because the intervention is triggered by $\max(s_i)$, the expected value conditional on action, $E[V | \text{action}]$, is systematically lower than the expected value conditional on any individual signal, $E[V | s_i > \theta]$. As $n$ increases, the probability of action based on outlier optimism approaches unity, regardless of true $V$.

  **2.0 UNIVERSAL AFFIRMATION PROTOCOL (UAP)**
  2.1 To counteract 1.2, interventions shall require unanimous consent. Action proceeds only if $\min(s_i) > \theta$.
  2.2 This shifts the selection bias: conditional on action, $E[V | \text{action}]$ exceeds individual expectations.
  2.3 Members are advised that this creates the Unanimous Consent Hazard. A single member holding an outlier pessimistic signal retains veto power. This incentivizes the manufacture of pessimism to extract concessions. Consequently, viable interventions are suppressed at a rate proportional to $n$.

  **3.0 ROTATING MANDATE SYSTEM**
  3.1 Notwithstanding 2.0, if UAP fails to yield a decision within 14 days, authority devolves to a single member selected via cryptographic lottery.
  3.2 This reduces the effective agent count to $n=1$ for the duration of the term.
  3.3 Members should note that this restoration of $n=1$ reinstates the original Unilateralist Hazard defined in 1.2, but confines liability to the rotating officer.

  **4.0 TRANSFERABLE ACTION QUOTAS (TAQ)**
  4.1 Members are issued annual action credits. Credits are tradeable on an internal ledger.
  4.2 Members with higher private signals $s_i$ will assign higher expected utility to action credits.
  4.3 Market mechanics will concentrate credits in the hands of members with the most optimistic signals. Action rights therefore aggregate to the agents most likely to overestimate $V$, reproducing the $\max(s_i)$ selection effect described in 1.2.

  **5.0 KANTIAN COMPLIANCE CLAUSE**
  5.1 Prior to action, the proposing member must certify they would accept the intervention being undertaken by all other members simultaneously.
  5.2 Members with high risk tolerance will readily sign this attestation. Members with calibrated risk assessments will decline.
  5.3 This creates an adverse selection pool where only the least cautious members retain eligibility to propose interventions.

  **6.0 ILLUSTRATIVE CASE 4.1**
  6.1 Consider three agents ($n=3$) assessing a project with true value $V=0$. Threshold $\theta=1.0$. Signals drawn: $s_1=1.2$, $s_2=0.8$, $s_3=-0.5$.
  6.2 **Unilateral:** Agent 1 acts. $E[V | \text{action}] < 0$. Loss incurred.
  6.3 **UAP:** No action. $s_3$ vetoes. Opportunity cost incurred.
  6.4 **Lottery:** 33% chance Agent 1 acts. Expected loss scaled by probability.
  6.5 **TAQ:** Agent 1 purchases credits from 2 and 3. Agent 1 acts. Loss incurred.
  6.6 **Kantian:** Agent 1 signs attestation. Agents 2 and 3 refuse. Agent 1 barred. Opportunity cost incurred.

  **7.0 GOVERNANCE AND REVIEW**
  7.1 A Subcommittee on Procedural Review shall be constituted to evaluate the efficacy of these measures.
  7.2 The Subcommittee shall have the authority to propose new procedures requiring further review.
  7.3 Note that these controls apply exclusively to positive actions; omissions require no authorization.

  **APPROVED BY:** *Committee on Existential Safeguards*
  **DATE:** *2023-10-27*
  **CHANGE LOG:** *v2.1 Added TAQ mechanism; removed liability clause.*

  ***

  **Notes on the Mechanism**

  The "Blocker's Curse" symmetry is mathematically clean (selecting on $\min$ vs $\max$) but behaviorally asymmetric: pessimism is often easier to justify defensively than optimism. I'm confident the unilateralist logic holds (Bostrom et al. formalism), and the market adverse selection is standard Akerlof logic applied to risk. The rotating lottery is the most obvious failure mode—resetting $n$ to 1 is literally the problem—but bureaucratic inertia often treats "having a process" as distinct from "having a solution." The point I'm least sure of is the Kantian clause; in practice, reckless actors might still fail universalizability tests if they recognize their own incompetence, whereas true believers might pass. The satire relies on the reader noticing that every procedure regulates *acts* while *omissions* (the default path to risk in many x-risk scenarios) remain unscrutinized.
