  **SUNFLOWER HOUSE CO-OP**
  **Minutes of the General Assembly**
  **Recorded by: E. Vance, Secretary**

  **Meeting 1: October 4th**
  **Agenda Item 4: Distribution of Surplus Funds**
  **Motion:** To allocate monthly surplus based on "Equalized Subjective Well-Being."

  **Discussion:** Residents were asked to request funds required to reach a baseline happiness level of 7/10. Resident Maya submitted a requisition for $450 to purchase specific vintage vinyl pressings. She stated that digital formats provide negligible joy and that her current well-being sits at a 3/10 without these items. Resident Luis noted his baseline is met with $50 for groceries and heat. Resident Priya stated she requires nothing additional to feel content.

  **Outcome:** To meet Maya's needs would exceed the total surplus. Resident Luis argued that subsidizing Maya's taste penalizes his frugality. Maya argued that fairness requires equal happiness, not equal cash. Motion tabled indefinitely due to budgetary insolvency and elevated voices. Meeting adjourned 9:15 PM.

  **Meeting 2: November 1st**
  **Agenda Item 2: Distribution of Monthly Stipends**
  **Motion:** To allocate identical resource bundles to all residents regardless of circumstance.

  **Discussion:** Following previous impasse, motion proposed strict equality of goods. Each resident receives $200 cash and 50 therms of heating credit. Resident Luis submitted a physician's note stating his medical condition requires higher caloric intake and ambient temperature to maintain health. He requested an exception for additional heat and food funds. The Chair ruled exceptions violate the "Identical Bundle" protocol. Resident Maya used her cash entirely for records. Resident Luis remained coat-clad during the meeting. Resident Priya accepted her bundle without comment.

  **Outcome:** Resident Luis reported frostbite on toes. Resident Maya reported high satisfaction but no food. Resident Priya offered to donate her unused heat credit, but protocol forbids transfer. Motion failed after Luis threatened to freeze the pipes in protest. Meeting adjourned 9:45 PM.

  **Meeting 3: December 5th**
  **Agenda Item 1: Standard of Living Protocol**
  **Motion:** To ensure equal "Capability to Function" for all residents.

  **Discussion:** Committee sought to define the minimum resources required to function as a full member of the co-op. Residents were surveyed on their needs. Resident Priya stated she functions perfectly on rice, blankets, and silence, having trained herself to require no luxuries. Resident Maya requested a soundproofed room for listening. Resident Luis requested medical-grade heating. The Committee adopted Priya's baseline as the objective standard for "functioning," noting that if one person can function on less, the higher needs of others may be preferences rather than capabilities.

  **Outcome:** Maya and Luis were denied requests as "excessive relative to established capability baseline." Resident Priya apologized for making others look greedy. Resident Maya screamed into a cushion. Resident Luis turned off the main valve. Motion passed but unenforceable. Meeting adjourned 10:30 PM.

  **Next Meeting:** TBD pending habitability inspection.

  **Submitted by:** E. Vance
  **Status:** Exhausted
