prompt: |-
  hey so I keep running into this "boundary problem" thing in political philosophy and I can't quite get it. It's the question of who belongs to the demos — like, the group of people who get to set the rules for everyone. I get the surface version (citizenship, voting rights, whatever), but I'm stuck on the part where people say it's this self-referential mess. Like, the demos has to decide who's in the demos, but the people doing the deciding are themselves in the demos. I'm an engineer so I'm used to specifying the boundary of a system before you build it, and this feels backwards — it's like the system is trying to specify its own boundary from the inside. But is that actually a problem? Like, a club decides who gets to join the club, and nobody thinks that's paradoxcal. So what's the real issue here?

  Also I've heard about this tension between an "all affected" principle (everyone affected by a decision should get a vote) and the idea that a demos should be able to decide its own boundries. I don't see how those conflict. Can you give me a concrete example where they pull in opposite directions, like with immigration or climate change or something?
