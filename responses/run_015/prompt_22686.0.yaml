answer: |-
  This is a fantastic question. You have hit on one of the most persistent headaches in democratic theory. As an engineer, your intuition is spot-on: logically, this looks like a recursive function without a base case. You need the output (the *demos*) to define the input (who votes), but you need the input to generate the output.

  Here is the breakdown of why the "club" analogy doesn't quite work, why the self-referential loop is a legitimacy crisis rather than just a logical one, and how the "All Affected Principle" clashes with self-determination in concrete scenarios.

  ### 1. Why the "Club" Analogy Fails
  You mentioned that a club decides who joins the club, and nobody thinks that's paradoxical. That is true, but a political *demos* is fundamentally different from a private club in two ways that make the boundary problem critical.

  **A. Voluntary vs. Coercive**
  *   **The Club:** Membership is voluntary. If the club rejects you, you lose access to their tennis court. You are free to go elsewhere.
  *   **The State:** Membership is coercive. If the state excludes you (or includes you without your consent), it still exerts power over you (laws, borders, police). If you are outside the boundary, you might be barred from entering; if you are inside, you are subject to laws you had no hand in making.
  *   **The Engineering Analogy:** Think of a club as an **API** you can choose to call or not. Think of the State as the **Operating System**. You don't get to choose whether the OS manages your memory; it does. If the OS decides who has "root access" based on rules written by the current root users, and those rules lock you out permanently, the system isn't just "self-specifying"—it's potentially tyrannical.

  **B. The "Founding" Problem**
  In a club, the founders agree on the bylaws. In a state, the current boundaries are usually the result of historical accidents (wars, colonization, treaties) rather than a democratic vote.
  *   **The Loop:** For a democracy to be legitimate, the rules must come from the people. But the "people" are defined by the rules (citizenship laws).
  *   **The Issue:** If the current *demos* sets the boundary to exclude a group (e.g., non-citizens living in the territory), that group is subject to the *demos'* power but has no say in the boundary that excludes them. The system is bootstrapping its own legitimacy on an arbitrary starting point.

  ### 2. The Conflict: All Affected Principle (AAP) vs. Self-Determination
  This is where the rubber meets the road.

  *   **Demos Self-Determination:** The existing group has the right to decide who joins them. This prioritizes **stability** and **community**. It assumes the boundary is fixed enough to make decisions.
  *   **All Affected Principle (AAP):** Anyone impacted by a decision should have a say in that decision. This prioritizes **justice** and **interests**. It assumes the boundary should be fluid based on the issue at hand.

  **The Conflict:** AAP tends to dissolve boundaries; Self-Determination tends to enforce them. If you follow AAP strictly, the *demos* changes with every single vote. If you follow Self-Determination strictly, you can justify excluding people who are deeply impacted by your choices.

  Here are the concrete examples you asked for.

  #### Example A: Immigration Policy
  Imagine Country A is voting on whether to tighten its border controls.

  *   **Self-Determination View:** The current citizens of Country A constitute the *demos*. They decide who enters. They might vote to close the border to protect wages or culture. This is their right as a self-determining group.
  *   **All Affected View:** Consider a potential migrant in Country B. The decision to close the border affects them profoundly (they cannot seek safety or work). Therefore, under AAP, they should have a vote in Country A's election.
  *   **The Clash:**
      *   If you grant the vote to the migrant (AAP), the border likely opens (because the new voters want in). This destroys the existing *demos'* ability to determine its own composition.
      *   If you deny the vote (Self-Determination), you are making a decision that drastically alters the migrant's life without their input.
      *   **Result:** You cannot satisfy both. Either the *demos* is the current citizens (excluding the affected outsider), or the *demos* is "everyone affected" (which effectively means open borders and a global *demos*).

  #### Example B: Climate Change & Industrial Policy
  Imagine Germany is voting on whether to permit a new coal-fired power plant.

  *   **Self-Determination View:** This is Germany's economy, Germany's energy grid, and Germany's voters. They weigh the cost of electricity against environmental concerns and vote.
  *   **All Affected View:** That coal plant emits carbon. The emissions contribute to sea-level rise that will flood a village in Bangladesh. The farmer in Bangladesh is "affected" by the German vote.
  *   **The Clash:**
      *   **AAP Implication:** To be democratic, the farmer in Bangladesh should have a vote in the German election regarding the power plant. If you apply this consistently, every national election becomes a global election. The "boundary" of the German *demos* expands to include almost everyone on earth.
      *   **Self-Determination Implication:** Germany decides for itself. But this allows Germany to externalize costs onto people who have no recourse. It treats the national border as a moral shield, which AAP says is illegitimate.
      *   **The Engineering Parallel:** It's like Module A is allowed to dump heat into Module B without Module B's sensor feedback influencing Module A's control loop. Self-Determination says "Module A controls Module A." AAP says "If Module A's output changes Module B's state, Module B needs write-access to Module A's controller."

  ### 3. So, is it actually a problem?
  For a practitioner (politician, engineer, administrator), you might say: *"Stop philosophizing. We have a constitution. It says who votes. We move on."*

  But it remains a problem for **legitimacy**.
  1.  **Recursive Instability:** If the *demos* can change the boundary to rig the vote (e.g., gerrymandering, stripping citizenship from opponents), the democracy is broken. The boundary problem highlights that there is no "neutral" place to stand to judge if the boundary is fair.
  2.  **The "All Affected" Trap:** If you take AAP seriously, it makes governance impossible. Every decision affects someone somewhere. A local zoning law affects property values three towns over. Do they get to vote? If yes, you can never finish a vote because the electorate keeps shifting.
  3.  **The "All Subjected" Compromise:** Many political philosophers try to solve this by shifting from "All Affected" to "All Subjected." This means: You get a vote if you are subject to the *coercive framework* of the state (i.e., you live there permanently), not just if you are affected by a specific policy. This stabilizes the boundary (solving the engineering problem) but still leaves out the Bangladeshi farmer (leaving the moral problem).

  ### Summary for the Engineer
  *   **The Loop:** It is a logical circle. The *demos* defines the rules, but the rules define the *demos*.
  *   **Why it matters:** Unlike a private club, the state is coercive. If the initial boundary is arbitrary (historical accident), the "consent of the governed" is fiction for those excluded.
  *   **The Tension:**
      *   **Self-Determination** = Fixed Boundary (Stable system, potential for externalizing harm).
      *   **All Affected** = Fluid Boundary (Just system, potential for infinite recursion/instability).

  The "Boundary Problem" isn't something we solve; it's a tension we manage. We usually pick a "constitutional moment" (a hardcoded initial value) and agree to pretend it's legitimate so the system can run, while acknowledging that the edge cases (immigrants, climate refugees) reveal the system's logical flaws.
