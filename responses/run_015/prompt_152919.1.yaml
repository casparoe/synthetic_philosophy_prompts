      *Wait, one more check:* The prompt asks to engage the strongest argument on the *losing* side. If I recommend Disclosure, the losing side is Vasquez's refusal. I must articulate her argument so well that a reader might be convinced by it, then explain why we proceed anyway.
      *Actually, the prompt asks:* "whether Williams's integrity objection actually gives her a reason to refuse institutional cooperation here, or whether it just shows that any institutional ethics process necessarily demands that one extra thought."
