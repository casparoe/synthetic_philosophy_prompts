      *   *Hemispherectomy:* Removing a hemisphere (especially in childhood) often results in a single, unified consciousness remaining. If hemispheres were distinct persons, this would be murder + survival. This is a very strong argument against the "two persons" view.
      *   *Coordination:* Split-brain patients show *intermanual conflict* (alien hand), but twins show high coordination. Actually, the user argues twins coordinate well, suggesting shared effectors push toward unity. Split-brain patients show *less* unity than normals, but not necessarily *two full agents*.

