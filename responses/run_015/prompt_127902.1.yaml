answer: |-
  Right. Pour the coffee. I've looked at your minutes from the last decade, and I can tell you exactly why you feel stuck: you're trying to apply a single epistemological rule to problems that are actually political, ethical, and liturgical. You've been ruling like archivists when you should have been ruling like curators, and vice versa.

  Here is the free-form brainstorming you asked for, followed by the structured options.

  ### The Brainstorm: Mapping the Mess
  Looking at your six precedents, there isn't one principle. There's a tension between **Forensic Truth** (what happened) and **Functional Truth** (what the story *does*).

  *   **Cases 1, 4, 6** are "Forensic." A claim was made (soldiers started fire, agitators started strike, land is common). The archive proved it false. The Board said: "Correction required."
  *   **Cases 2, 5** are "Functional." A claim was made (battle here, rescuer was X). The archive proved it false. *But* the story had built something (a festival, a rescue network). The Board said: "Keep the story, label the error."
  *   **Case 3** is the outlier. Archive was silent. Memory won.

  The pattern I see isn't about *truth*; it's about *harm* and *utility*. When a false claim protects an institution (Case 4) or violates property law (Case 6), you kill it. When a false claim builds community cohesion (Case 2) or moral inspiration (Case 5), you keep it but annotate it.

  The problem with the new case is that it sits right in the collision zone. The "Meadow Memory" has high utility (civic cohesion, court precedent) but also high forensic error (archive says gravel pit), and now there's a *harm* claim (marginalized descendants).

  ### Three Candidate Rules
  Here are three rule sets that fit your past six decisions roughly equally well.

  **Rule A: The "Assertion vs. Practice" Split**
  *   **The Principle:** Static assertions of fact (plaques, signs, museum text, deeds) must align with the best archival evidence. Dynamic practices (festivals, walks, statues) may persist despite factual error if they have established social utility, provided the factual truth is made accessible elsewhere.
  *   **Fits Precedents:** Explains why the Plaque was recut (1) and Sign refused (6), but the Festival (2) and Statue (5) stayed. Case 3 fits as "Archive Silence = Assertion allowed."
  *   **Prediction for New Case:** The Walk is a *Practice*. You do not ban the Walk. However, the Walk *asserts* a location. You must move the Walk to the Gravel Pit (aligning practice with fact) OR keep the Walk at the Meadow but explicitly rebrand it as "The Walk of Memory" rather than "The Walk to the Graves," and erect a major marker at the Gravel Pit.
  *   **Weakness:** It treats the Walk as a "festival" (Case 2), ignoring that it's a pilgrimage to a specific grave.

  **Rule B: The "Stakeholder Veto" (or Harm Principle)**
  *   **The Principle:** Archival truth is the default. However, memory prevails if: (a) the archive is silent (Case 3), OR (b) correcting the memory causes disproportionate social harm *and* no specific victim group objects. If specific descendants/victims object to the error, archival truth wins regardless of social utility.
  *   **Fits Precedents:** Explains 1, 3, 4, 6 (Truth wins). Explains 2 & 5 (No specific victims objected; the "false" rescuer was dead, the battle was abstract).
  *   **Prediction for New Case:** The actual descendants object. Therefore, the "Meadow Memory" must be corrected, regardless of the civic cohesion or court rulings. The Walk moves to the Gravel Pit. The Meadow becomes a secondary site.
  *   **Weakness:** It undermines the stability of Case 2. If a descendant of the "losing side" of the founding battle showed up tomorrow, would you cancel the festival?

  **Rule C: The "Sedimented Truth" Rule**
  *   **The Principle:** A memory that has generated its own material consequences (court rulings, new archives, physical changes to the landscape) acquires a secondary historical status. It is no longer just a claim about 1943; it is a fact about 1985–2025. The Board must preserve *both* layers: the event and the memory of the event.
  *   **Fits Precedents:** Strongest fit for Case 5 (Statue is a fact about 1942 inspiration, Plaque is a fact about 1943 rescue). Fits Case 2 (Festival is a fact about town identity, Panel is a fact about the battle).
  *   **Prediction for New Case:** You cannot simply move the walk. The Meadow is now historically significant *as the site where the town believed they died*. You designate the Gravel Pit as the "Site of Event" and the Meadow as the "Site of Memory." The Walk is split or rerouted to acknowledge both.
  *   **Weakness:** It risks sanctifying lies. It makes the Board a museum of errors.

  ### My Recommendation: Rule A (Modified)
  I recommend you adopt **Rule A: The "Assertion vs. Practice" Split**, but with a specific proviso regarding **Descendant Consent**.

  **Why?**
  Look at your closest analog: **Case 2 (The Founding Festival).**
  In Case 2, the town loved a festival based on a lie. You didn't cancel the festival. You let the town keep its ritual, but you forced the truth into the public record at the *actual* site.
  In the New Case, the town loves a walk based on a lie. The logic should be identical. The Walk is a civic ritual (Practice), not a forensic report (Assertion).

  **However,** Case 2 had no objecting victims. Case 5 had no objecting victims. This case *does*.
  So, the modification: **Practice may persist despite error, provided the ritual is re-narrated to acknowledge the error, and the actual site is commemorated.**

  **The Decision:**
  1.  **Do not ban the Walk.** It is now a 60-year-old civic tradition (Case 2). Banning it creates a new trauma.
  2.  **Do not keep the claim.** The plaque/signage at the Meadow must change. It cannot say "41 people shot here." It must say "From 1965–2025, this meadow was believed to be the site... the actual site is 3km away."
  3.  **Reroute the Climax.** The Walk should begin at the Meadow (honoring the tradition) but end at the Gravel Pit (honoring the dead).
  4.  **Address the Court Ruling.** You cannot overturn a court ruling, but you can issue a "Historical Note" that the ruling was based on evidence now superseded by archival discovery.

  **The Principle You Are Adopting:**
  *The archive is not a court of appeal for a ritual, but a ritual cannot claim the authority of the archive.*
  You are separating **Liturgical Truth** (what binds the community) from **Forensic Truth** (what binds the record). You are allowing the town to keep its liturgy, provided it confesses that it is liturgy, not history.

  ### The Separating Case
  You asked for a single case that would best separate these rules. You mentioned the "descendants' own false memory." I would refine that slightly to stress-test Rule A vs. Rule B.

  **The Case:**
  *A community wants to preserve a building as a "Safe House" where a famous dissident hid. The archives prove the dissident never stayed there. However, the building's *current* occupants are the descendants of the dissident, and they insist on the story as part of their family identity. They fund the maintenance based on this tourism.*

  *   **Rule A (Assertion/Practice):** You must remove the "Safe House" plaque (Assertion). You can let them tell the story privately (Practice), but the public record cannot be falsified.
  *   **Rule B (Stakeholder Veto):** The descendants want it. No one is harmed. You let the plaque stay.
  *   **Rule C (Sedimentation):** The building is now a "Site of Family Memory." You label it "According to Family Tradition."

  **Why this separates them:** It pits **Archival Integrity** directly against **Descendant Autonomy**. Your Board's Case 3 (accepting oral history when archive is silent) suggests you lean toward descendants. But Case 1 (recutting the plaque) suggests you lean toward archive. This case forces you to choose: Is the Archive sacred, or is the Family sacred?

  ### On Sedimentation
  This is the point that keeps you up at night. *How does a record-first rule treat documents whose entire provenance is the memory they're supposed to be checking?*

  You must treat them as **Secondary Evidence of Reception**, not **Primary Evidence of Event**.

  *   The 1985 booklet is not evidence of a 1943 shooting. It is evidence of a 1985 *belief* in a shooting.
  *   The Court Ruling is not evidence of a 1943 shooting. It is evidence of a 1990s *legal reliance* on a belief.
  *   Your own minutes are not evidence of a 1943 shooting. They are evidence of a 2020s *administrative struggle* with the belief.

  **The Rule for Sediment:**
  When the archive is "contaminated" by memory, you do not discard the documents. You re-catalog them. You move them from the file "1943 Deportations" to the file "1943 Deportations: Post-War Memory."
  This allows you to say: *"The record shows that people believed this."* It does not allow you to say: *"The record shows this happened."*

  If you fail to make that distinction, you end up in a loop where the memory validates the document which validates the memory. Your job on the Board is to be the breaker of that circuit. You validate the *existence* of the memory, but you refuse to validate its *claim*.

  ### Final Word
  You're worried about the mess. Don't be. The mess is the point. History isn't the past; it's the argument we have about the past. Your precedents show you've always known this. You just need to stop pretending you're looking for a rule that eliminates the tension, and start writing down the rule that *manages* it.

  Go with the Split. Keep the Walk, move the Grave, label the Meadow. It's the only outcome that lets the town sleep at night without lying to the dead.
