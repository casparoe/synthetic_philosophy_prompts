answer: |-
  There is no single, universally established term in psychology or decision theory that captures this *exact* loop (genuine intent + social approval feedback + iterative goal redefinition + lack of awareness).

  However, there are three established concepts that sit very close to it, and one coined term that might fit your character's voice perfectly.

  ### 1. The Closest Established Concepts

  **A. Goal Displacement (Sociology/Organizational Theory)**
  This is the academic ancestor of your idea. It describes when an organization (or individual) substitutes the original goal with a surrogate goal that is easier to measure or achieve.
  *   **Why it fits:** It captures the "rewriting the finish line" aspect.
  *   **Why it falls short:** Classic goal displacement is usually driven by bureaucracy or risk aversion (e.g., "following the rules" replaces "serving the public"). It doesn't inherently capture the *social approval/praise* mechanism as the fuel.

  **B. Goodhart's Law (Economics/Systems Theory)**
  "When a measure becomes a target, it ceases to be a good measure."
  *   **Why it fits:** Your character is treating "lab partner praise" as a measure of success, and then optimizing for that measure until it no longer correlates with the cure.
  *   **Why it falls short:** Goodhart's Law usually implies a systemic failure or "gaming" of the system. Your character isn't gaming it; she is sincerely believing the new metric *is* the goal.

  **C. Ethical/Moral Drift (Psychology)**
  This describes a gradual, unnoticed shift in ethical standards over time, often driven by small, rationalized compromises.
  *   **Why it fits:** It captures the "slow accretion" and the "unnoticed" nature of the change.
  *   **Why it falls short:** It applies to moral standards, not necessarily performance goals or project scopes.

  ### 2. A Proposed Coinage: "Social Overfitting"

  Given your character is a researcher (and you mentioned tech teams), I recommend borrowing a term from machine learning: **Overfitting**.

  In AI, "overfitting" happens when a model learns the *noise* in the training data (specific quirks, errors, or random fluctuations) rather than the *signal* (the underlying truth). The model performs perfectly on the training data but fails on real-world data.

  If you coin the term **"Social Overfitting"** (or **"Approval Overfitting"**), it works on two levels:
  1.  **Technical Accuracy:** She is optimizing her behavior to fit the "noise" (the immediate praise of her peers) rather than the "signal" (the actual cure).
  2.  **Character Voice:** It sounds like something a brilliant, anxious researcher would say about herself in a moment of clarity. *"I'm not failing; I'm overfitting to the lab's reward function."*

  ### 3. Distinguishing from Similar Concepts

  To ensure you don't misrepresent it in your author's note, here is how you distinguish this loop from the concepts you mentioned:

  *   **Vs. Scope Creep:** Scope creep is usually external (stakeholders demanding more features). Your character's loop is *internal* (she redefines the goal to match the praise she receives). Scope creep expands the work; this loop *replaces* the work.
  *   **Vs. Motte-and-Bailey:** That is a rhetorical defense tactic (retreating to a defensible position when challenged). Your character is not being challenged; she is being praised. She isn't retreating; she is *advancing* in the wrong direction.
  *   **Vs. Procrastination/Fear of Success:** Those imply avoidance. Your character is highly active. She is working hard, just on the *wrong definition* of "done."
  *   **Vs. Simple Goal Displacement:** Goal displacement is often cynical or bureaucratic. This is *sincere*. She genuinely believes "meaningful progress" (the new goal) is the same as "the cure" (the old goal).

  ### 4. Confidence Assessment

  **Confidence Level:** **High (85-90%)** that there is no single common English term for this specific triad of (Intent + Praise Feedback + Goal Redefinition).

  **The Point I Am Least Sure Of:**
  I am least certain that a niche sub-field of **Behavioral Economics** or **Organizational Psychology** (specifically literature from 2010–2024 regarding "gamification" or "social incentives") hasn't coined a term like **"Incentive-Induced Goal Substitution"** or **"Validation Bias."** While "Goal Displacement" is the broad umbrella, there may be a specific paper that names this exact praise-driven mechanism. However, none of these niche terms have entered general parlance or standard dictionaries.

  **Recommendation for your Draft:**
  If you use this in an author's note, I suggest framing it as a specific *flavor* of Goal Displacement. You could write:
  > *"This isn't standard procrastination or scope creep. It's a specific feedback loop where social validation acts as a proxy for success, causing the goal itself to drift toward wherever the applause is loudest. In machine learning, this is called overfitting; in human ambition, it might be called **Social Overfitting**."*

  This acknowledges the existing theory (Goal Displacement/Overfitting) while giving you the creative license to define the nuance without claiming it's a settled medical diagnosis.
