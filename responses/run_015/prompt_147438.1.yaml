prompt: |-
  i run the booking for our towns monthly debate nights, and every month i gotta sign a contract with a nonrefundable deposit based on what size hall i rent. i keep falling for the inside story - like "this speaker is local so everyone will come" or "this zoning post went viral on facebook so 200 people will show" - and then ignoring the outside numbers that say usually 40 people max show up. i heard about inside view vs outside view and also epistemic modesty, but i need an actual reusable procedure i can run in about 15 minutes before i sign, not philosophy.

  please write me a decision flowchart in words with steps in order: what question i ask first, what counts as a good enough answer, where the procedure stops with a hard "rent the small hall" and where it stops being facts and becomes my values about risk. it needs to cover picking the right reference class (all debates? just zoning ones? just ones after viral posts?), how to weight my specific reasons against the base rate, and a modesty check because im usually overconfident right after my morning coffee. flag the exact spots where the procedure misfires if im lying to myself, and mark where my partner has to sign off since they co-sign the contract.

  apply it to three bookings:
  1. a zoning debate where my gut says 200 people because of one viral facebook post, but the outside view for zoning debates says 45
  2. a case where my inside reasoning is genuinely strong and the base rate is weak, but the procedure still forces me to be cautious and that annoys me
  3. a case where inside and outside agree on big turnout, but i still feel weird signing for the big hall

  also tell me clearly what this procedure cant fix - like if im just bad at judging my own tiredness - and dont give me bibliographies or tell me to read some author, i dont have books at the signing table and im not gonna memorize names. make sure it works for someone with zero stats background.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs monthly debate nights, signs contracts with nonrefundable deposits based on hall size.
      *   **Problem:** Consistently overestimates turnout based on "inside view" (specific stories, viral posts, local speakers) vs. "outside view" (historical data/base rates).
      *   **Goal:** A reusable, 15-minute decision procedure (flowchart in words) to determine hall size before signing.
      *   **Requirements:**
          *   Steps in order.
          *   Define good/bad answers.
          *   Hard stops (e.g., "rent small hall").
          *   Distinguish facts vs. values (risk tolerance).
          *   Cover reference class selection.
          *   Weighting inside vs. outside view.
          *   Modesty check (coffee/overconfidence).
          *   Flag self-deception points.
          *   Partner sign-off points.
          *   Apply to three specific scenarios.
          *   State limitations (what it can't fix).
          *   No bibliographies/academic jargon.
          *   Zero stats background friendly.

  2.  **Deconstruct the Core Problem:**
      *   The user is suffering from *planning fallacy* and *overconfidence bias*.
      *   They need a "pre-mortem" style checklist that forces them to confront data before emotion.
      *   The procedure needs to be rigid enough to prevent rationalization but flexible enough to allow for genuine outliers.

  3.  **Drafting the Procedure (The "15-Minute Hall Check"):**
      *   *Step 1: The Data Dump (Outside View).* Get the numbers first. Don't let the story start yet.
      *   *Step 2: The Reference Class.* Define what "similar" means. Is it *all* debates or *zoning* debates?
      *   *Step 3: The Inside Claim.* Write down *why* this time is different.
      *   *Step 4: The Evidence Test.* Can you prove the inside claim?
      *   *Step 5: The Modesty Discount.* Apply a penalty for excitement/coffee.
      *   *Step 6: The Risk Calculation.* Cost of empty seats vs. cost of turning people away.
      *   *Step 7: Partner Veto.* The external check.

      *Refining the Steps:*
      *   Need to make sure the "Reference Class" step is clear. If they pick "Viral Zoning Debates" and there's only one (this one), that's cheating. It needs to be "Zoning Debates" or "Debates with Facebook Promotion."
      *   Need a specific "Self-Deception Flag." Where do people lie? Usually in Step 3 (exaggerating evidence) and Step 5 (ignoring the discount).
      *   Need a clear "Partner Sign-off" trigger. Probably before the contract is signed, after the calculation.

  4.  **Developing the Three Scenarios:**
      *   *Scenario 1 (Viral Post vs. Base Rate):* The procedure should catch this. The evidence for the viral post converting to attendance is weak. Result: Small Hall.
      *   *Scenario 2 (Strong Inside, Weak Base):* Maybe a celebrity speaker confirmed *in writing*. The procedure allows an upgrade *if* evidence is concrete, but forces a risk check. Result: Medium Hall (compromise) or Large with partner approval.
      *   *Scenario 3 (Agreement but Gut Feeling):* Data says big, gut says weird. This is anxiety, not data. The procedure should validate the data but allow the partner to check for burnout/fatigue. Result: Large Hall, but check personal capacity.

  5.  **Addressing Limitations:**
      *   What can't a checklist fix? Emotional state, burnout, unpredictable external events (weather, power outage), fundamental business model flaws.

  6.  **Review against Constraints:**
      *   *15 minutes?* Yes, if kept concise.
      *   *No stats background?* Avoid terms like "regression to the mean." Use "average" and "penalty."
      *   *No books?* Yes.
      *   *Flowchart in words?* Yes, numbered steps with "If/Then" logic.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Critique:* Is the "Modesty Check" specific enough?
      *   *Fix:* Make it a literal percentage reduction based on excitement level.
      *   *Critique:* Where does the partner come in?
      *   *Fix:* Make them the final gatekeeper for any decision that goes against the base rate.
      *   *Critique:* Is the reference class clear?
      *   *Fix:* Force the user to list the last 5 similar events. If they can't list 5, they must use the broader category.

  8.  **Final Output Structure:**
      *   Introduction (acknowledge the pain point).
      *   The Procedure (The "15-Minute Hall Check").
      *   The Three Scenarios (Applied).
      *   Limitations (What this doesn't fix).

  *(Self-Correction during final review)*: Ensure the tone is practical and direct, not academic. Use bolding for key decision points. Make sure the "Self-Deception Flags" are explicit.

  9.  **Drafting the Content:** (Mental walk-through of the steps)
      *   Step 1: Get the Average. (Last 10 events).
      *   Step 2: Define "Special." (Why is this different?)
      *   Step 3: Prove "Special." (Tickets sold? Written confirmation?)
      *   Step 4: The Coffee Discount. (Reduce estimate by 20% if excited).
      *   Step 5: The Cost of Error. (Empty seats vs. Turned away).
      *   Step 6: Partner Sign-off.

      *Wait, I need to make sure the Reference Class is addressed specifically.*
      *   Add a step: "Pick Your Comparison Group." Rule: Must include at least 3 past events.

      *Okay, let's write it.*

      *(Final check on Scenario 2)*: The prompt says "procedure still forces me to be cautious and that annoys me." I need to show how the procedure handles valid inside info without caving to emotion. It should allow the upgrade *only* with hard proof, but still apply the discount.

      *(Final check on Scenario 3)*: "Inside and outside agree... still feel weird." This is likely somatic anxiety or burnout. The procedure should flag this as a "Capacity Check" rather than a "Turnout Check."

      *Okay, ready to generate.*
answer: |-
  # The 15-Minute Hall Check Procedure

  This is a rigid checklist. Do not skip steps. Do not do this when you are exhausted. If you cannot answer a question with a number or a screenshot, the answer is "no."

  ### Step 1: The Reference Class (5 Minutes)
  **Question:** What are the last 5 events most similar to this one?
  **Rule:** You must list 5 past events. You cannot use "theoretical" events.
  *   **Option A:** All debate nights (Last 5 months).
  *   **Option B:** All zoning debates (Last 5 zoning debates).
  *   **Option C:** All debates with Facebook ads (Last 5 promoted debates).

  **The Trap:** If you choose Option B or C and you have fewer than 3 past events to list, you **must** use Option A. You do not have enough data to make a sub-category.
  **Self-Deception Flag:** If you find yourself saying, "Well, this one is unique so I can't compare it," stop. You are lying to avoid the data.
  **Output:** Write down the attendance for those 5 events. Calculate the **Average**. This is your **Base Number**.

  ### Step 2: The Inside Claim (3 Minutes)
  **Question:** Specifically, what evidence proves attendance will beat the Base Number?
  **Rule:** Vague feelings do not count. You need one of the following:
  *   **Hard Commitments:** 50+ people have RSVP'd *with a credit card hold* or signed a sheet.
  *   **Confirmed Draw:** A speaker with a proven track record of drawing crowds *at your venue* (not just "they are famous").
  *   **Pre-sales:** Tickets actually sold in advance.

  **If you have none of these:** Your Inside Claim is zero. Your projected attendance is the Base Number. **Stop here. Rent the Small Hall.**
  **If you have one of these:** Write down the number of people specifically accounted for (e.g., "30 pre-sales"). This is your **Confirmed Number**.

  ### Step 3: The Coffee Discount (2 Minutes)
  **Question:** How excited am I right now?
  **Rule:** Rate your excitement 1 to 10.
  *   **1-5 (Calm):** No change to your projection.
  *   **6-8 (Optimistic):** Reduce your projected additional attendance by 25%.
  *   **9-10 (Hyped/Just had coffee):** Reduce your projected additional attendance by 50%.

  **Calculation:**
  1.  Take your **Base Number** (from Step 1).
  2.  Add your **Confirmed Number** (from Step 2).
  3.  Apply the **Coffee Discount** only to the *Confirmed Number* part if you are hyped, OR apply a 20% discount to the *Total* if you are hyped about the Base Number itself.
  *   *Simpler Rule:* If you rated 6+, take your Total Projected Attendance and multiply by 0.8.
  **Output:** This is your **Realistic Number**.

  ### Step 4: The Risk Value (3 Minutes)
  **Question:** What costs more?
  *   **Cost A:** Paying for empty seats in the Big Hall (Deposit lost + extra rental fee).
  *   **Cost B:** Turning people away or crowding the Small Hall (Reputation damage + refund hassle).

  **Decision:**
  *   If **Cost A > Cost B** (You have tight cash flow): Rent the hall that fits the **Realistic Number**.
  *   If **Cost B > Cost A** (You have cash buffer, reputation is fragile): You may rent the next size up *only if* the Realistic Number is within 10% of that hall's capacity.

  ### Step 5: The Partner Veto (2 Minutes)
  **Action:** Show Steps 1 through 4 to your partner.
  **Rule:**
  *   If your **Realistic Number** matches the **Base Number** (i.e., you had no hard commitments), the partner **cannot** veto the Small Hall.
  *   If your **Realistic Number** is higher than the **Base Number** (i.e., you are claiming an upgrade), the partner **has full veto power**. They do not need a statistical reason. If they feel you are dreaming, they sign "No."
  **Output:** Final Hall Decision.

  ***

  # Applied Scenarios

  ### Scenario 1: The Viral Zoning Post
  *   **Step 1 (Reference):** You try to pick "Zoning Debates." You only have 2 past zoning debates. **Rule triggers:** You must use "All Debate Nights." Base Number = 40.
  *   **Step 2 (Inside Claim):** You have a viral Facebook post. Is that a Hard Commitment? No. It's a "like." Confirmed Number = 0.
  *   **Step 3 (Coffee):** You are excited (8/10). Discount applies.
  *   **Step 4 (Risk):** Realistic Number is 40. Big Hall holds 200. Cost of empty seats is high.
  *   **Step 5 (Partner):** You show the partner. Base is 40. Confirmed is 0.
  *   **Result:** **Rent the Small Hall.** The procedure forces you to ignore the viral post because it isn't a ticket sale.
  *   **Why it annoys you:** It feels like you're ignoring potential.
  *   **Why it's right:** Viral posts rarely convert to physical attendance without ticket commitments. You save the deposit.

  ### Scenario 2: The Genuinely Strong Inside Case
  *   **Context:** A city council member is speaking. She sent an email blast to her 500-person mailing list saying she will be there.
  *   **Step 1 (Reference):** Base Number = 40.
  *   **Step 2 (Inside Claim):** Email blast is not a hard commitment. However, she agrees to do a joint press release. Still no tickets. But, you have 20 pre-registrations from her staff. Confirmed Number = 20.
  *   **Step 3 (Coffee):** You are excited (7/10). Total Projection (40 + 20 = 60). Apply 20% discount. Realistic Number = 48.
  *   **Step 4 (Risk):** Small Hall holds 50. Big Hall holds 200. Realistic Number (48) is at the limit of Small Hall. Cost of crowding is high.
  *   **Step 5 (Partner):** You want to upgrade to Big Hall because 48 is too tight. Partner sees the math. The math says 48, but the risk of 60+ is real.
  *   **Result:** **Rent the Medium Hall (if available) or Small Hall with overflow plan.** The procedure allows the upgrade based on the 20 confirmed, but the Coffee Discount prevents you from betting on the whole mailing list showing up.
  *   **Why it annoys you:** You know the email blast matters, but the procedure treats it as "unconfirmed."
  *   **Why it's right:** Email open rates are low. Turnout from emails is lower. The discount protects you from assuming 10% conversion when it might be 2%.

  ### Scenario 3: The "Weird Gut Feeling"
  *   **Context:** Base Rate says 100. Inside View says 100. You have 50 pre-sales. Math says Big Hall. You feel anxious signing.
  *   **Step 1-4:** All checks pass. Realistic Number = 110. Big Hall is the logical choice.
  *   **Step 5 (Partner):** You show the partner. The math is solid. But you express the "weird feeling."
  *   **Procedure Adjustment:** This is not a turnout check; this is a **Capacity Check**. The procedure asks: "Are you too tired to manage the Big Hall?"
  *   **Result:** **Rent the Big Hall, BUT hire extra help.** The procedure validates the turnout data. It flags your anxiety as operational risk, not data risk.
  *   **Why it's right:** Sometimes the data is right, but your bandwidth is wrong. Don't downsize the hall; upscale the staffing.

  ***

  # What This Procedure Cannot Fix

  1.  **Burnout:** If you are too tired to run the event, no hall size will save you. The procedure calculates turnout, not your energy. If Step 5 reveals you are anxious because you are exhausted, the solution is staffing, not a smaller room.
  2.  **Black Swans:** A snowstorm, a power outage, or a competing major event in town will wipe out attendance regardless of your math. This procedure minimizes *your* error, not *fate's* error.
  3.  **Dishonesty:** If you lie in Step 2 (e.g., counting "maybe" RSVPs as "Confirmed"), the math becomes garbage. The procedure relies on your integrity in the "Hard Commitments" section.
  4.  **Business Model Flaws:** If you consistently lose money even when attendance matches the Base Number, this procedure won't fix your pricing or cost structure. It only stops you from over-renting.

  **Final Rule:** Print this out. Keep it next to the contract. If you don't fill it out, you don't sign.
