prompt: |-
  As a novelist whose current manuscript hinges on a protagonist's irreversible moral collapse, I find myself returning to a philosophical question that shapes how I write sorrow without sentimentality: why do audiences actively seek out and derive value from art that depicts profound, unavoidable suffering—particularly suffering born of moral failure rather than mere misfortune? I am not asking for a bibliography, a reading list, or citations to particular scholars; I need the conceptual specification itself. Please write the complete desiderata—the full list of requirements—that any adequate theory of the paradox of tragedy must meet. Your list should include the phenomena it must explain, such as the simultaneous experience of negative affect and positive evaluation, and the distinction between tragic sorrow and the affective responses elicited by horror, melodrama, or schadenfreude; the specific cases it must accommodate, including the Aristotelian account of catharsis through representation, the observation that sorrow pains us in lived experience yet can please us in aesthetic form, and contemporary psychological evidence that viewers integrate emotional response with judgments of artistic merit; the distinctions it must preserve, especially between pleasure derived from formal mastery and pleasure that involves narrative complicity in the depicted suffering, and between tragedies that turn on unavoidable moral failure and those that turn on remediable misfortune or contingent bad luck; and the constraints from ethics and cognitive science it cannot violate, such as the absence of actual harm to real persons, the preservation of the audience's moral agency in judgment, and consistency with known mechanisms of emotional regulation. For each desideratum, provide the motivating case or consideration, and clearly flag which requirements are non-negotiable and which reflect preferences of particular theoretical camps—such as those who demand determinism of emotional outcome versus those who allow for individual variation. Then, identify which single desideratum does the most damage to popular theories—whether it is the prohibition on reducing tragedy to mere emotional release, the demand to account for narrative complicity, or the requirement to distinguish irreversible moral failure from remediable misfortune. Please build this from first principles rather than summarizing named texts, and do not include page numbers or direct quotations.

  End your response with exactly one line: a one-sentence summary beginning with the word Summary: followed by the core claim of your specification.
