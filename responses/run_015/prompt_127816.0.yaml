answer: |-
  To construct a theory capable of sustaining a narrative about irreversible moral collapse, one must first establish the boundaries within which any explanation of tragic pleasure must operate. The following desiderata constitute the complete conceptual specification for an adequate theory of the paradox of tragedy. Each requirement includes the motivating consideration and a classification of its necessity.

  ### I. Phenomenological Requirements

  **1. The Coexistence Constraint**
  *   **Requirement:** The theory must explain how negative affect (sorrow, pity, fear) and positive evaluation (enjoyment, appreciation, value) occur simultaneously without cancelling each other out.
  *   **Motivating Case:** Audiences report feeling distressed during a tragedy yet rate the experience as valuable and would choose to undergo it again.
  *   **Status:** **[Non-Negotiable]** Any theory that claims the pain is illusory or the pleasure is merely relief fails to describe the actual experience.

  **2. The Reality Distinction**
  *   **Requirement:** The theory must account for why sorrow pains us in lived experience yet pleases us in aesthetic form.
  *   **Motivating Case:** Witnessing a real death causes trauma; witnessing a staged death in a masterpiece causes sorrowful appreciation.
  *   **Status:** **[Non-Negotiable]** This distinguishes art from life and is the foundational paradox itself.

  **3. The Genre Differentiation Constraint**
  *   **Requirement:** The theory must distinguish tragic sorrow from the affective responses elicited by horror (revulsion), melodrama (manipulative sentiment), or schadenfreude (malicious joy).
  *   **Motivating Case:** We look away from horror but lean into tragedy; we reject melodrama as cheap but accept tragedy as profound; we feel guilt over schadenfreude but not over tragic pity.
  *   **Status:** **[Non-Negotiable]** Collapsing these categories renders the theory useless for specific artistic creation.

  ### II. Structural and Narrative Requirements

  **4. The Representation Constraint (Mimesis)**
  *   **Requirement:** The theory must accommodate the observation that the suffering is represented, not actual, allowing for Aristotelian accounts of catharsis through representation rather than occurrence.
  *   **Motivating Case:** The audience knows the suffering is not happening to real people in the room, which permits the emotional processing without defensive shutdown.
  *   **Status:** **[Non-Negotiable]** This is the mechanism that allows the Reality Distinction to hold.

  **5. The Moral Failure vs. Misfortune Distinction**
  *   **Requirement:** The theory must distinguish between tragedies that turn on unavoidable moral failure and those that turn on remediable misfortune or contingent bad luck.
  *   **Motivating Case:** A protagonist destroyed by their own hubris elicits a different valuation than a protagonist destroyed by a random falling tile; the former is tragedy, the latter is often pathos or misfortune.
  *   **Status:** **[Theoretical Preference]** While essential for narratives of moral collapse, some universalist theories treat all suffering as equivalent regardless of agency.

  **6. The Formal Mastery vs. Narrative Complicity Distinction**
  *   **Requirement:** The theory must preserve the distinction between pleasure derived from formal mastery (language, structure, pacing) and pleasure that involves narrative complicity in the depicted suffering.
  *   **Motivating Case:** One can admire the writing of a cruel scene without enjoying the cruelty itself; conflating these leads to ethical confusion about the audience's role.
  *   **Status:** **[Theoretical Preference]** Some camps argue all pleasure is formal; others argue we derive pleasure from the emotional content itself.

  ### III. Ethical and Cognitive Constraints

  **7. The Ethical Boundary Constraint**
  *   **Requirement:** The theory must operate under the constraint of the absence of actual harm to real persons.
  *   **Motivating Case:** If real harm occurs, the work ceases to be tragedy and becomes exploitation or crime; the theory must not justify actual suffering.
  *   **Status:** **[Non-Negotiable]** This is a moral absolute that limits the scope of aesthetic justification.

  **8. The Moral Agency Constraint**
  *   **Requirement:** The theory must ensure the preservation of the audience's moral agency in judgment.
  *   **Motivating Case:** The audience must remain capable of condemning the protagonist's moral failure even while pitying their suffering; emotional immersion cannot erase ethical judgment.
  *   **Status:** **[Non-Negotiable]** If the audience loses the ability to judge, the moral collapse loses its significance.

  **9. The Cognitive Consistency Constraint**
  *   **Requirement:** The theory must be consistent with known mechanisms of emotional regulation.
  *   **Motivating Case:** Contemporary psychological evidence shows viewers integrate emotional response with judgments of artistic merit without suffering lasting psychological damage typical of real trauma.
  *   **Status:** **[Non-Negotiable]** A theory contradicting basic cognitive science is empirically false.

  **10. The Emotional Outcome Constraint**
  *   **Requirement:** The theory must specify whether it demands determinism of emotional outcome versus allowing for individual variation.
  *   **Motivating Case:** Some theories claim tragedy *must* purge pity and fear in all viewers; others allow that some viewers may feel only despair or nothing at all.
  *   **Status:** **[Theoretical Preference]** This reflects a divide between universalist psychological claims and reception-based theories.

  ### The Most Damaging Desideratum

  Among the requirements listed, the single desideratum that does the most damage to popular theories is **the requirement to distinguish irreversible moral failure from remediable misfortune**.

  Many prevailing theories of tragic pleasure rely on a generalized model of sadness or loss. They posit that audiences enjoy the intensity of emotion or the relief of survival regardless of the cause of the suffering. However, this collapses the specific architecture of tragedy into general pathos. If a theory cannot explain why we value the suffering of a protagonist who brings about their own ruin through character flaws differently than the suffering of a virtuous person struck by lightning, it fails to account for the specific moral weight that gives tragedy its enduring power. This requirement invalidates hedonistic models that treat all negative emotions as interchangeable commodities and challenges conversion theories that do not account for the specific cognitive processing of agency and guilt. It forces the theory to engage with the ethical dimension of the narrative, not just the emotional dimension.

  Summary: An adequate theory of tragic pleasure must reconcile the coexistence of pain and valuation while preserving moral agency and distinguishing agent-driven collapse from random misfortune.
