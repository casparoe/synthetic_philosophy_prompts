      *   *The Risk:* Students will think Hofstadter is just Wittgenstein in disguise (variations = family members) OR they will think Hofstadter is reverting to Platonism (the "theme" is the Essence).
      *   *The Dependency:* To understand knob-twiddling, they must first grasp that the "theme" is not a static definition but a *generative structure* or a *set of constraints* that allows for deformation without breaking identity. The dependency is: **Structure/Constraint precedes Variation.** Wittgenstein denies the structure; Hofstadter relies on a fluid structure.
      *   *Prerequisite:* They need to distinguish between *classification* (Wittgenstein) and *generation/transformation* (Hofstadter).

  3.  **Select the Central Example:**
      *   *Constraint:* Do not use musical variations.
