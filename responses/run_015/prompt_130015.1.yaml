          *   *Re-evaluating the "No Music" constraint:* Why avoid music? Because "Theme and Variations" is a standard musical term. Students will import baggage about the melody remaining "identical" while harmony changes. Hofstadter's point is that the *identity itself* is fluid.
          *   *Selected Example:* **The "Limerick"**.
          *   *Possess:* Clear structural constraints (AABBA, rhythm).
          *   *Lack:* Semantic constraints (can be about anything).
          *   *Why:* It shows how you can twiddle semantic knobs while keeping structural knobs fixed, or twiddle structural knobs (break the rhyme) and see when it ceases to be a limerick.
          *   *Wait, is Limerick too combinatorial?* "Fill in the blanks."
          *   *Let's try:* **The "Architectural Arch"**.
          *   *Let's try:* **The "Joke"**. (Hofstadter loves jokes).
          *   *Let's go with:* **The "Caricature"**.
          *   *Reasoning:* A caricature *must* resemble the subject (Theme) but *must* distort features (Knobs). If you distort too much, it's not them. If you distort too little, it's a portrait. This captures the "pressure" and "slippage" perfectly.
          *   *Decision:* **The Political Caricature.**

      *   *Misconception Mapping:*
          1.  *Combinatorics:* "I can just swap the nose for a beak." -> Head off by showing *connectedness* (swapping the nose requires swapping the expression).
