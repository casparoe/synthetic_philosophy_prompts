      *   *Refining "Compatible Rivals":* Can Preference Satisfaction accommodate this? Only if the patients' *true* preferences are for non-craving, and current requests are "irrational". This is the "informed preference" loophole. I should include that.

      *   *Refining "Internal Tensions":* The "serene space" is an environmental manipulation. Is that not stimulating craving for serenity?

