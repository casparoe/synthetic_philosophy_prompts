answer: |-
  **MEMORANDUM**

  **TO:** Commission Members
  **FROM:** Secretariat
  **DATE:** Thursday
  **SUBJECT:** Consistency Analysis: Public Medical School Regional Reserve Proposal

  You asked for an analysis that prioritizes internal consistency over political preference. Below is the breakdown of our doctrinal position based on the eight prior opinions, applied to the new medical school file.

  ### (a) Candidate Rules Consistent with All Eight Precedents

  Your initial suggestions were close, but some fractured under the weight of Precedents #1 and #3 (which lack strict sunsets) or #6 (which treats merit differently). To survive all eight files, the rules must distinguish between *structural* measures (boards, lists) and *distributive* measures (seats, scholarships), and between *threshold* competencies (exams) and *ranking* competencies (auditions).

  Here are the three rules that genuinely survive the entire list:

  1.  **The Core Competency Rule:** A quota is invalid if it compromises the institution's primary selection metric *and* that metric is the sole proxy for the institution's core function (e.g., artistic merit in a conservatoire). It is valid if the metric is a threshold for a broader professional function (e.g., academic exam for medical practice) or if the measure targets a goal the metric does not measure (e.g., workforce distribution).
      *   *Survival:* Explains #6 (Reject: Audition = Core Function) vs. #5, #7 (Approve: Exam/Scholarship = Threshold/Access). Consistent with #1, #3 (Governance/Politics are not merit-based selections).
  2.  **The Remedial Specificity Rule:** A quota is invalid if the disparity is already addressed by less intrusive means (e.g., entry-level reserves) or if the beneficiary class is arbitrarily defined compared to similarly situated groups. It is valid if a specific, unaddressed shortfall exists.
      *   *Survival:* Explains #2 (Reject: Senior shortfall closed/entry reserved) and #4 (Reject: No review of need). Consistent with #5, #7 (Approve: Specific gaps identified).
  3.  **The Procedural Integrity Rule:** A distributive quota is invalid if it lacks a binding enforcement mechanism, a sunset, or a mandatory review. Structural quotas (boards, lists) require only a compliance window.
      *   *Survival:* Explains #4 (Reject: No end date/review), #8 (Reject: Levy allows buy-out). Consistent with #1, #3 (Structural exceptions), #5, #7 (Distributive with review/sunset).

  ### (b) Prediction Table: Application to the Medical School File

  | Rule | Application to File | Prediction |
  | :--- | :--- | :--- |
  | **1. Core Competency** | The exam measures academic capacity, not "likelihood to return to region." The reserve targets workforce distribution, which the exam does not measure. Applicants score near median (threshold met). Unlike #6 (Audition = Art), Exam ≠ Medical Practice. | **Approve** |
  | **2. Remedial Specificity** | There is a clear shortfall (8% places vs 24% pool). However, a 4th region is equally under-served but excluded. This risks arbitrary definition (see #2, #4). | **Reject** (unless 4th region added or distinction justified) |
  | **3. Procedural Integrity** | 7-year sunset and Year-4 review included. Bond is binding (unlike #8 levy). Cap is 25% (higher than #5's 15%, but not total). | **Approve** |

  **The Split:** Rule 2 is the danger point. If we ignore the exclusion of the 4th region, we violate the logic of #2 and #4 (arbitrary/unnecessary). If we enforce it, we delay approval.

  ### (c) Recommendation

  **Recommendation:** **Approve with Conditions.**

  **Closest Precedent:** **Precedent #5 (Scholarship Fund).**
  Both are educational access measures based on socio-geographic disadvantage, capped at a percentage, and subject to periodic review.

  **Distinctions Required:**
  1.  **Distinguish Precedent #6 (Conservatoire):** You are right to worry about #6, but Marta is right that #5 controls here. We must distinguish #6 on the grounds that *medical competency* is a threshold (can they pass the exam/safe to practice?), whereas *artistic merit* is purely relative (who is the best?). The medical exam predicts academic success; it does not predict workforce location. The reserve corrects a market failure the exam ignores.
  2.  **Distinguish Precedent #2 (Civil Service):** Unlike #2, there are no prior entry-level reserves for these regions. The bottleneck is at the gate, not the promotion ladder.
  3.  **Address the "4th Region" Complaint:** To satisfy **Rule 2 (Remedial Specificity)**, we must condition approval on the school either including the 4th region or providing objective data distinguishing the three named regions (e.g., higher disease burden) within 60 days.

  **The Committed Principle:**
  > *"Geographic reserves in professional education are permissible where beneficiaries demonstrate threshold academic competence, the measure targets a workforce outcome unmeasured by the entrance exam, and the scheme includes a binding service obligation and mandatory review."*

  **Why this locks us in:** We cannot quietly reverse this next year. If we later reject a similar scheme for a law school or engineering college, the applicants will cite this opinion. To reject a future file, we would have to argue either that the exam *does* measure the social outcome (hard to prove) or that the beneficiaries did not meet "threshold competence" (requires data). It prevents us from slipping back into the "Merit is Sacred" doctrine of #6 without a fight.

  ### (d) The Outlier

  **Precedent #1 (State-Owned Company Boards)** is the outlier we will eventually have to explain away.

  **Reasoning:** It is the only distributive/operational measure approved without a strict sunset or review mechanism ("No end date"). Precedent #4 (Fire Brigade) was rejected explicitly for "no end date and no review." The distinction ("compliance window" vs. "sunset") is thin. #1 relies on the assumption that gender imbalance in boards is a permanent structural feature requiring permanent correction, whereas #4 treats geographic imbalance as a temporary shortfall.
  **The Debt:** If we approve the Medical School file with a 7-year sunset, we reinforce #4 and #5. This makes #1 look increasingly indefensible under the statute's "time-limited" requirement. We will eventually need to revisit #1 to align it with the "Review/Sunset" doctrine established in #4, #5, #7, and now the Medical School file.

  ### (e) Splitting Hypothetical

  To test the robustness of the new principle, table this file at the next meeting:

  **The "Blind Audition" Orchestra File:**
  > *A state-funded national orchestra proposes reserving 15% of its violin section for women. Auditions remain blind (behind a screen), but the selection committee will lower the passing score for female applicants by 5% to ensure the quota is met. The scheme has a 5-year sunset and annual review.*

  **How it splits the rules:**
  *   **Core Competency Rule:** **Reject.** This directly triggers Precedent #6. Lowering the score interferes with the "very thing the institution exists to select for" (musical excellence), unlike the Med School where the exam doesn't measure "region."
