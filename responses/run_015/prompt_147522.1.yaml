      *   *Better Fit for the Prompt:* The prompt asks about obligations to *uphold a legal order*. Usually, this means the obligation to obey the state. So, the association is "Subjects of the British Empire." The duty is obedience. The condition is reciprocal compliance by the state and fellow subjects.
      *   *Decision:* The association is the *British Imperial Polity*. The obligation is colonial obedience to Parliament. The "critical mass of others comply" refers to *other colonies* resisting or *Parliament* respecting rights. Actually, the prompt says "citizens bear associative duties to uphold a legal order only so long as a critical mass of *others* comply." This usually implies fellow citizens. If everyone else is obeying, I must. If everyone else is rebelling, I need not.
