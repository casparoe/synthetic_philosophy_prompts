      *Coercive Acts:* Parliament punishes Boston. Do other colonies comply? No. They send aid. *This* confirms the threshold is crossed. The *passage* of the Acts didn't confirm it; the *reaction* did. But the prompt asks if the *passage* confirms it. I must argue that the passage *revealed* the threshold because it treated a constitutional crisis as a criminal one, prompting the collective defection. Or, I can argue the passage *failed* to confirm it (Parliament thought they could isolate Boston), but the *result* confirmed the obligation had dissolved. I will argue the latter for nuance: The Acts were a miscalculation of the threshold, which *proved* the threshold had already been crossed in the minds of the colonists.

