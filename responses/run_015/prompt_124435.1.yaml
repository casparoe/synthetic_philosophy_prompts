answer: |-
  Your intuition about "deserve" is philosophically warranted. In analytic ethics, "desert" presupposes a judge assigning merit based on past action. Karma is causal, not retributive. Here is the sentence-by-sentence verdict.

  **S1:** *Genuine Misreading.* Conflating natural consequence with moral desert distorts the mechanism. Western desert is backward-looking (reward/punishment); karma is forward-looking (causal seed). Furthermore, desert usually requires the action to be completed; karma generates from intention alone, diverging from standard desert conditions.

  **S2:** *Mixed.* "Trace on mind-stream" accurately describes *vasanas* (habitual tendencies). However, "account has to balance" is misleading. You noted this correctly: the soteriological goal is cessation (*nirvana*), not debt repayment. Scholarly disagreement exists here: some Abhidharma schools argue enlightenment burns off residual karma without full experiential "balance," while others insist all fruit must ripen.

  **S3:** *Fair Simplification.* This reflects traditional soteriology, though "earned" reinforces the desert error. It captures the temporal scope (multiple lives) accepted by orthodoxy.

  **S4:** *Accepted.* The gravity analogy is standard. Karma is *rtu* (natural order), not divine command.

  **S5:** *Accepted.* Karma requires agency. Without choice, there is no karmic accumulation.

  **S6:** *Accepted with nuance.* This is the "problem of evil" for Buddhism. Scholars like Bruce Reichenbach agree karma can function as victim-blaming. Whether compassion *never* sits comfortably is debated; some argue compassion arises precisely because beings are trapped in this causal web, not despite it.

  **S7:** *False.* This claim fails under scrutiny. Secular Buddhists and philosophers (e.g., Owen Flanagan) argue karma functions as psychological causality. If actions shape character and future suffering within *this* life, the doctrine retains ethical and explanatory power without metaphysical rebirth. It becomes a theory of moral psychology, not just "exotic vocabulary."

  **Final Verdict:** The claim that dropping rebirth leaves nothing survives only if one insists karma *must* be a cosmic justice system. If karma is understood as ethical causality—how volitional acts structure experience—the doctrine remains robust. Your friend's "cause and effect" view isn't apologetics; it's a defensible philosophical reduction. The text's error lies in insisting karma *must* be desert theory to be meaningful. It is better understood as a phenomenology of habituation. The "awkwardness" with compassion remains, but it is the tension of holding agents responsible within a conditioned world, not necessarily a logical contradiction. Traditionalists (e.g., Gombrich) argue without rebirth, theodicy fails. But naturalists argue theodicy isn't the point; liberation is.
