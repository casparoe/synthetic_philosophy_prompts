  **Why this discriminates:**
  *   **Rule 1 (Extrinsic Interference)** says **No**. (Intrinsic preventer negates disposition).
  *   **Rule 3 (Interference-Type)** says **No**. (Standing Intrinsic Mask negates disposition).
