  Here is a ranking of these cases based specifically on their **humanitarian defensibility** (weighing the immediacy of the threat, the purity of the intent, and the long-term outcome for civilians), followed by an analysis of your hypothetical scenario.

  ### 1. Kosovo (1999)
  **Score: 8/10**
  This intervention is generally viewed as the most defensible because it halted an active campaign of ethnic cleansing with credible evidence of impending genocide, and it resulted in a relatively stable long-term outcome for the protected population. While it lacked a specific UN mandate, the moral necessity of preventing another Srebrenica-style massacre in Europe provided a strong humanitarian casus belli.

  ### 2. Libya (2011)
  **Score: 5/10**
  The intervention was initially highly defensible under the "Responsibility to Protect" doctrine to stop an imminent massacre in Benghazi, backed by a UN resolution. However, the mission crept into regime change without a plan for the aftermath, leading to state collapse and prolonged civilian suffering that significantly tarnishes the humanitarian legacy.

  ### 3. Iraq (2003)
  **Score: 2/10**
  Humanitarianism was a retroactive justification for a war primarily launched on security grounds (WMDs), making the humanitarian claim weak from the outset. The resulting power vacuum caused hundreds of thousands of civilian deaths and regional destabilization, meaning the humanitarian outcome was net-negative compared to the status quo ante.

  ***

  ### The Hypothetical Case: "The Drone Swap"
  **Score: 4/10**
  **Where it slots:** Between **Libya** and **Iraq**.

  **Analysis:**
  This case lands below Libya because, in Libya, the decade of chaos was a failure of planning and execution, whereas in your scenario, the long-term chaos is a *known, foreseeable consequence* ("almost certainly"). Ethical frameworks like Just War Theory require a reasonable chance of success and proportionality; knowingly trading an immediate massacre for a guaranteed decade of instability violates the responsibility to consider long-term harm.

  However, it slots above Iraq because the *intent* is purely humanitarian (stopping an ongoing massacre) rather than geopolitical, and the "no risk to intervener" aspect removes the accusation that the war was fought for the intervening nation's self-interest. It represents a tragic ethical dilemma: saving lives today at the cost of suffering tomorrow, which is more defensible than Iraq (wrong intent, bad outcome) but less defensible than Libya (right intent, failed outcome).
