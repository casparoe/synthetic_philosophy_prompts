      *   *Progressive:* Predicts novel facts, belt grows organically.
      *   *Degenerating:* Accommodates facts post-hoc, belt grows via ad hoc patches.
      *   *Decision Rule:* Don't kill a degenerating programme unless there's a better rival.
      *   *The Twist:* The user needs to decide on *future* funding based on *past* performance, acknowledging the "substitution" problem (we are betting on future progress based on retrospective analysis).

  3.  **Drafting the Instrument (The Checklist):**
      *   *Goal:* Make it usable by a finance person and a biologist who don't know Lakatos.
      *   *Structure:* Sequential questions. Stop rules.
      *   *Language:* "Untouchable assumptions" instead of "Hard Core," "Adjustments" instead of "Protective Belt," "New Discoveries" instead of "Novel Facts."
      *   *Addressing Load-Bearing Constraints:*
