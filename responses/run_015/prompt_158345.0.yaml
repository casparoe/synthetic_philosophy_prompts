  5.  **Addressing the Specific Cases:**
      *   *Computational Toxicology:* High output, but all accommodations (patches). Degenerating belt. No rival mentioned? If no rival, Lakatos says keep it (reluctantly).
      *   *Urban Microclimate:* Young. No track record. Instrument should flag "Insufficient Data" -> Probationary Renewal.
      *   *Sleep and Metabolic:* The hard one. Degenerating (15 years, patches). No rival. Lakatos strictly says: Do not eliminate without a rival. Even if degenerating. This validates the user's suspicion but highlights the bureaucratic risk.

  6.  **Addressing the "Load-Bearing" Claims & Confidence:**
