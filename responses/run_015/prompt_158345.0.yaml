answer: |-
  This is a dangerous game you are playing. You are trying to use a historiographical tool to make a budgetary decision. Lakatos designed MSRP (Methodology of Scientific Research Programmes) to explain why scientists *did* stick with Newtonian mechanics despite anomalies, not to tell a dean when to cut a budget line. However, the structural homology is strong enough that it can work, provided we acknowledge where the map tears.

  Here is the instrument, the application to your cases, and the honesty check you requested.

  ### Part 1: The Instrument (The Research Programme Health Check)

  **Instructions for the Panel:** This checklist converts the history of the last three years into a risk assessment for the next three. It does not measure "quality" in the abstract; it measures momentum and necessity. Complete this in order. If a step triggers a **STOP**, move immediately to the indicated action.

  **Q1. The Anchor Test (Identifying the Hard Core)**
  *   **Ask:** Look at the conflicts or anomalies reported in the last cycle. Which specific assumptions did the team *refuse* to abandon even when data contradicted them? (Ignore what they *say* is core; look at what they *defended*.)
  *   **Sufficient Answer:** A clear statement of 1–3 foundational assumptions that remain unchanged despite pressure.
  *   **Warning Sign:** The team claims "we follow the data" and has no fixed assumptions. (This is not a research programme; it is a service unit. **STOP.** Fund only as a service, not as research.)
  *   **Warning Sign:** The team has changed its foundational assumptions in the last cycle. (This is not a continuation; it is a new start. **STOP.** Treat as a new application/Young Programme.)
  *   **Judgment Call:** If the "core" is trivial (e.g., "we believe data matters"), flag for Dean review. This is a values call on whether the work is theoretical or technical.

  **Q2. The Ledger Check (Progressive vs. Degenerating Shift)**
  *   **Ask:** List the *new* adjustments made to the theory/method to fit data (patches) vs. the *new* empirical findings the programme pointed to *before* the data was collected (predictions).
  *   **Sufficient Answer:** A ratio. (e.g., "3 new correction terms added; 1 new phenomenon predicted and found.")
  *   **The Parity Rule:** If Patches ≥ Predictions, the programme is **Degenerating**. If Predictions > Patches, it is **Progressive**.
  *   **Note:** A degenerating status is *not* an automatic fail. It triggers Q4.
  *   **Judgment Call:** Distinguishing a "theoretical refinement" from an "ad hoc patch." If the panel cannot agree, default to "Patch."

  **Q3. The Novelty Check (Temporal Priority)**
  *   **Ask:** For the claimed "new findings," is there evidence (pre-registration, dated grant proposal, prior publication) that the programme specified this result *before* the experiment was run?
  *   **Sufficient Answer:** Yes/No for each major claim.
  *   **Rule:** Accommodated results (explaining what is already known) count as zero for progress. They only count as "saving the programme."
  *   **Gaming Defense:** If the self-report says "we predicted X" but the external reviews suggest X was already anomalous in the field, mark as Accommodation.
  *   **Judgment Call:** If the external reviewers disagree on the timeline, the panel Chair (you) must arbitrate based on document timestamps. This is factual, not values-based.

  **Q4. The Rival Check (The Elimination Constraint)**
  *   **Ask:** Is there an alternative research programme (internal or external) that explains everything this one does, *plus* the new facts this one failed to predict, without the excessive patches?
  *   **Sufficient Answer:** Name the rival. If "None," state "None."
  *   **Rule:** If the programme is Degenerating (from Q2) BUT there is **No Rival**, you **CANNOT** recommend Wind Down. You must recommend Renew with Conditions.
  *   **Rule:** If the programme is Degenerating AND there **Is a Rival**, recommend Merge or Wind Down.
  *   **Judgment Call:** Determining if a rival is "viable" or just "theoretical." If the rival exists but isn't funded yet, this is a Strategic Decision. Hand to Dean.

  **Q5. The Substitution Declaration (The Verdict)**
  *   **Ask:** We are using past performance to bet on future returns. Given the answers above, is the probability of a "Progressive Shift" in the next 3 years high enough to justify the cost?
  *   **Decision Matrix:**
      *   Progressive + No Rival needed = **Renew.**
      *   Degenerating + No Rival = **Renew with Conditions** (Require a roadmap to reduce patches).
      *   Degenerating + Rival Exists = **Merge/Wind Down.**
      *   Young Programme (No track record) = **Renew (Probation)** for 1 cycle only.
      *   Service Unit (No Core) = **Fund as Infrastructure** (if useful) or **Wind Down.**

  ---

  ### Part 2: Addressing Your Load-Bearing Constraints & Edge Cases

  **1. Identifying the Hard Core (Revealed Preference)**
  *   *Theory Check:* Lakatos defines the hard core as "irrefutable by methodological decision." Your "revealed preference" rule is theoretically sound. If they change it, it wasn't core.
  *   *The "No Core" Group:* If a group says "we just follow the data," Lakatos would classify this as *empiricism*, not a research programme. It lacks a positive heuristic.
  *   *Instrument Handling:* Q1 handles this. If they have no core, they fail the "Research" test. They might be a valid "Service" unit (datasets/instruments), but they cannot claim theoretical progress. Fund them as infrastructure, not as a research programme.

  **2. Counting (Parity)**
  *   *Theory Check:* Lakatos does not give a number. He speaks of a "continuous growth of content." However, he explicitly criticizes programmes that grow only by "conventionalist stratagems" (patches).
  *   *Instrument Handling:* The 1:1 parity rule is an operational heuristic, not Lakatosian dogma. It commits us to the idea that *theoretical cost* must be outweighed by *empirical gain*.
  *   *Silence:* Lakatos is silent on whether one massive prediction outweighs ten patches. The instrument treats them as equal units for bureaucratic simplicity. This is a known weakness.

  **3. Programmes That Don't Predict (Instruments/Data)**
  *   *Theory Check:* MSRP is about theories and facts. It does not easily cover "tool-building."
  *   *Instrument Handling:* This is the biggest stretch. For these groups, substitute "Novel Facts" with "Novel Utility." Has the instrument been adopted by others to find things *they* couldn't find? If yes, that is the "novel fact" surrogate. If the tool is only used by the builders, it is degenerating (self-referential).

  **4. Gaming (Retro-describing)**
  *   *Theory Check:* Lakatos insists on *temporal* novelty.
  *   *Instrument Handling:* Q3 requires timestamps. In a 4-page report, look for specific language: "We hypothesized X in [Year] grant" vs "We observed X and explain it via..."
  *   *Discriminator:* External reviewers are your shield here. Ask them specifically: "Was this result known/anomalous in the field before this group's last report?"

  **5. Young Programmes**
  *   *Theory Check:* Lakatos acknowledges a programme needs time to articulate its positive heuristic.
  *   *Instrument Handling:* The "Probation" status in Q5. You cannot judge a shift without a shift. Fund for one cycle to *establish* the core, then apply the full instrument.

  ---

  ### Part 3: Running the Cases

  #### Case 1: Computational Toxicology Platform
  *   **Q1 (Core):** Core is likely "In silico models can approximate wet-lab toxicity." They haven't abandoned this despite mismatches. **Pass.**
  *   **Q2 (Ledger):** High output, but "every mismatch... absorbed by adding a correction term." Publications are confirmations.
      *   *Patches:* Many (correction terms).
      *   *Predictions:* Few/None (confirmations are accommodations).
      *   *Verdict:* **Degenerating.**
  *   **Q3 (Novelty):** Low. Confirmations are not novel facts in the Lakatosian sense.
  *   **Q4 (Rival):** You note reviewers split. Usually, if one reviewer defends it, there isn't a *dominant* rival that does everything better yet. Wet-lab is a rival, but it doesn't do what Comp Tox does (speed/cost). So, **No Direct Rival** in the specific niche.
  *   **Q5 (Verdict):** **Renew with Conditions.**
      *   *Rationale:* It is degenerating (theoretical bloat), but eliminating it leaves a gap (no rival). Condition: They must pause belt-growth (no new correction terms) and produce one risky prediction in the next cycle.

  #### Case 2: Urban Microclimate Group
  *   **Q1 (Core):** Explicit list of what it intends to explain. Core assumption unbroken. **Pass.**
  *   **Q2 (Ledger):** Three years old. No novel predictions yet.
      *   *Verdict:* **Insufficient Data.**
  *   **Q3 (Novelty):** N/A.
  *   **Q4 (Rival):** N/A.
  *   **Q5 (Verdict):** **Renew (Probation).**
      *   *Rationale:* Young programme. Cannot judge shift yet. Fund for one more cycle with the explicit requirement that Q2 must show a positive ratio next time.

  #### Case 3: Sleep and Metabolic Regulation (The Dreaded One)
  *   **Q1 (Core):** 15 years implies a solid core they have defended. **Pass.**
  *   **Q2 (Ledger):** "Degenerating by any honest count." Patches > Predictions. **Degenerating.**
  *   **Q3 (Novelty):** Likely accommodating known metabolic anomalies. **Low.**
  *   **Q4 (Rival):** "No rival programme anywhere that does what it does plus more." **No Rival.**
  *   **Q5 (Verdict):** **Renew with Conditions.**
      *   *Rationale:* This is the Lakatosian trap. You cannot rationally eliminate a degenerating programme without a better alternative. To wind it down is to act dogmatically, not scientifically.
      *   *The Catch:* The "Conditions" must be severe. "Renew for 3 years" is too long for a degenerating programme.
      *   *Recommendation:* **Renew for 1 Year (Bridge Funding).**
      *   *Rationale Text:* "The programme is currently in a degenerating problem shift (high theoretical adjustment, low novel prediction). However, per MSRP guidelines, elimination is irrational without a superior rival theory. Funding is continued solely to maintain capacity in this domain while seeking/developing a rival. Failure to produce a novel fact in 12 months will trigger Wind Down regardless of rival status."
      *   *Why this works:* It satisfies Lakatos (don't kill without a rival) but satisfies the Dean (stop the bleeding). It acknowledges the *retrospective* nature: we know the past was bad, we are buying time for a future shift that *might* happen, acknowledging the risk.

  ---

  ### Part 4: Limitations and Confidence

  **What the Procedure Cannot Do:**
  1.  **It cannot measure "Truth":** A progressive programme can be false (Newton was progressive but false). You are funding momentum, not correctness.
  2.  **It cannot handle "Paradigm Shifts":** If a group is actually starting a *new* core (Kuhnian revolution), this instrument will flag them as "Changed Core/Stop" or "Degenerating" initially. Radical innovation looks like degeneration or confusion in the short term.
  3.  **It cannot solve the "Resource" problem:** Lakatos assumes ideas compete. You are managing budgets. Sometimes you must kill a "No Rival" programme because the university is bankrupt. That is a Dean decision, not a philosophical one.

  **Confidence in Load-Bearing Claims:**

  1.  **Claim: Degeneration $\neq$ Elimination without a Rival.**
      *   **Confidence:** **High (95%).** This is the central thesis of *Falsification and the Methodology of Scientific Research Programmes*. Lakatos is explicit that dogmatic falsificationism (killing a theory because it has anomalies) is bad methodology.
  2.  **Claim: Novelty requires Temporal Priority (Prediction > Accommodation).**
      *   **Confidence:** **High (90%).** Lakatos distinguishes "heuristic novelty" from "use novelty." He is strict that accommodating known facts is merely saving the programme, not progressing it.
  3.  **Claim: The Verdict is Retrospective applied Prospectively.**
      *   **Confidence:** **Medium-High (80%).** Lakatos focuses on reconstruction of history. Using it for *prediction* (funding) is an extrapolation. It assumes past heuristic power predicts future heuristic power. This is an inductive gamble Lakatos himself might caution against, though it's the only way to use it in administration.
  4.  **Claim: Parity (1 Patch : 1 Fact) as a Warning Sign.**
      *   **Confidence:** **Low-Medium (60%).** *This is the weakest link.* Lakatos talks about "continuous growth of content." He does not offer a bookkeeping ratio. A single massive prediction (e.g., General Relativity and light bending) might outweigh twenty patches. Using a 1:1 ratio is a bureaucratic simplification that risks penalizing complex theoretical work. I am least sure of this operationalization.
  5.  **Claim: "No Core" = Service Unit.**
      *   **Confidence:** **Medium (70%).** Lakatos assumes all science operates in programmes. "Just following the data" is, to him, a naive inductivism that doesn't exist in mature science. If they claim it, they are either lying or doing technical work. Classifying them as "Service/Infrastructure" is a pragmatic administrative move, not a strict Lakatosian one.

  **Final Advice:**
  When you present the *Sleep and Metabolic* decision, use the language of "Strategic Risk Management." You are not saying they are *right*; you are saying the *cost of being wrong about eliminating them* (losing the domain entirely) is higher than the *cost of funding a degenerating programme* for one more year. That is a Lakatosian position dressed in a Dean's suit.
