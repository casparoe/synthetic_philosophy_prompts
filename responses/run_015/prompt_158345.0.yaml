          *   Must preserve three load-bearing Lakatosian features: (1) Degeneration $\neq$ elimination without a rival; (2) Novelty = temporal/heuristic priority (prediction > accommodation); (3) Retrospective verdict applied prospectively (substitution).
          *   Must address five specific edge cases: (1) Identifying hard core (revealed preference vs. stated); (2) Counting (adjustments vs. facts); (3) Non-predictive outputs (instruments/data); (4) Gaming (retro-fitting predictions); (5) Young programmes.
          *   Must run the instrument on three specific cases (Comp Tox, Urban Microclimate, Sleep/Metabolic).
