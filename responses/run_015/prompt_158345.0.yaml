      *   *Critique:* The user asked for "where the procedure stops and hands the decision to a person because it's a values call."
      *   *Fix:* Explicitly mark "Strategic Override" points.

  9.  **Final Polish:**
      *   Ensure tone matches a colleague (Phil Professor to Phil Professor).
      *   Check that jargon is bracketed or explained as requested.
      *   Verify all 5 edge cases are handled in the design or the commentary.
      *   Verify the 3 load-bearing constraints are embedded.

  10. **Final Review against constraints:**
