      *   Plain language checklist? (Check).
      *   Load-bearing 1 (Rival)? (Included in Step 4).
      *   Load-bearing 2 (Novelty)? (Included in Step 3).
      *   Load-bearing 3 (Retrospective)? (Included in Intro/Step 5).
      *   Edge Cases 1-5? (Addressed in design notes).
      *   Three Cases run? (Check).
      *   Limitations & Confidence? (Check).

  *(Self-Correction on Confidence)*: I need to be careful about the "Counting" claim. Lakatos warns against simplistic falsificationism. A 1:1 ratio isn't explicitly in the text, it's an operationalization I'm suggesting. I must admit that uncertainty.

  *(Self-Correction on Sleep Case)*: If there is *no* rival, Lakatos says stick with it. But if it's *totally* degenerating (no new facts at all), does it die? Lakatos says "long run." 15 years is long. But without a rival, eliminating it is dogmatic. I will stick to the strict interpretation: Keep, but flag as high risk.

