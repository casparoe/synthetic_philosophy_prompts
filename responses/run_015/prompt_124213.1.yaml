  Dear Colleague, regarding the Adeyemi ruling, our seven precedents cohere around a single principle: standing requires either clean hands regarding the specific norm or resolved liability through public accountability. Reyes and Duvalier lack standing because their violations remain unacknowledged or endorsed; Okonkwo, Sorensen, and Lindqvist retain standing because their liabilities were resolved via sanction, voluntary disclosure with acceptance of consequences, or temporal irrelevance. Mbeki and Harker have standing because they bear no liability for this norm. This suggests the committee implicitly runs a Clean Hands or Atonement rule. Under this rule, Adeyemi likely has no standing. Like Reyes, she holds an undisclosed, unsanctioned liability for the same norm. Her willingness to speak publicly now is reactive, unlike Sorensen's voluntary prior disclosure, and her refusal to invite sanction distinguishes her from Okonkwo and Sorensen. The committee seems to value proactive accountability over retroactive repentance when driven by the desire to censure.

  The closest analog is Reyes. Both involve undisclosed violations of the same norm where the limitation period or lack of detection prevents sanction. The fact that Adeyemi procured the violation rather than performing it does not mitigate her standing; if anything, instructing a subordinate who could not refuse aggravates her liability, making the dirt more hers than the technician's. The technician's blamelessness confirms Adeyemi's sole responsibility. Regarding private versus public standing, our precedents concern official censure motions, which are public acts requiring public moral authority. While one might privately blame Adeyemi, the committee's function is institutional gatekeeping, which demands consistency with our public rulings.

  You asked about graded verdicts. Our precedents are binary: standing is granted or denied. Introducing a graded status, such as censure with a note, would be inconsistent with the existing framework unless we explicitly overturn prior rulings. If we wish to remain consistent, we must treat standing as a threshold condition. If we want to test the boundaries of our implicit rule, the best probe case is not a current violator trying to stop, but rather a member who discovers their own past violation while preparing a censure motion, discloses it immediately to the committee, accepts sanction, and then proceeds. This separates voluntary disclosure motivated by integrity from disclosure motivated by defensive positioning. The current violator case tests rehabilitation, but we already have Okonkwo for that. The timing of disclosure is the unresolved variable. If we rule against Adeyemi, we affirm that standing requires resolved liability before the intent to censure arises. If we rule for her, we prioritize current compliance over past transparency. Given Reyes, consistency demands we deny standing. We should not adopt a principle that allows members to hoard secrets until they need moral currency to spend on others.

  If we were to rule for Adeyemi, we would be adopting a principle that private repentance and current compliance suffice for public authority, effectively overruling Reyes. If we rule against her, we affirm that the integrity of the censure process depends on the accuser's history of transparency. The derivative character of her violation does not help her; agency law treats the principal as responsible for the agent's acts, especially when coercion is involved. The technician's lack of blame underscores Adeyemi's exclusive liability. Standing to censure officially must remain distinct from private blame because the former invokes the association's power, requiring higher standards of moral credit. A graded verdict would create ambiguity in our records and invite litigation over the weight of such notes. The probe case I suggested is superior to the current violator because it isolates the variable of disclosure timing, which is the true pivot between Reyes and Sorensen. A current violator who stops is merely Okonkwo redux. We need to know if late disclosure counts as atonement. I recommend we deny standing to maintain consistency with Reyes and protect the committee's credibility. We cannot allow the censure mechanism to be wielded by those who have hidden their own failures until they found a use for them.
