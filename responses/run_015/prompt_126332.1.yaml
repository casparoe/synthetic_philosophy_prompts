  The server room hummed with the low-grade anxiety of a deployment deadline, whilst Gongsun Long stared unblinkingly at the terminal. His colleague, Hui Shi, leaned over his shoulder, pointing at the crimson type error flooding the REPL.

  "It's a simple coercion, Gongsun," Hui Shi said, rubbing his temples. "The function `stable` expects an argument of type `Horse`. You've passed it a `WhiteHorse`. Just cast it."

  Gongsun adjusted his spectacles and shook his head slowly. "I cannot do that. The compiler is quite right to reject it."

  "It's a subtype, though. Every white horse is a horse. It's basic ontology."

  "Is it?" Gongsun tapped the keyboard, bringing up the definition. "Look at the kind signature. `Horse` is a type constructor mapping to the form, the *xing*. It names the shape. But `WhiteHorse` is a dependent pair; it binds the form to a specific colour proof. By adding the colour argument, we have altered the kind signature entirely."

  "So? The runtime behaviour is identical."

  "The runtime is irrelevant; the names must be correct," Gongsun replied, his voice dry as parchment. "If I allow `WhiteHorse` to inhabit `Horse`, I am asserting that naming the colour is identical to naming the form. But the colour restricts the extension. The compound concept excludes the general concept. To coerce it would be to claim that 'white' adds nothing to 'horse', when logically, it subtracts from the generality of the kind."

  Hui Shi sighed, slumping against the rack. "So what do I tell the project manager? We have a horse. It is white. We cannot feed it because the programme says it isn't a horse?"

  Gongsun turned back to the screen, compiling the code with the error intact. "Tell him the code is sound. You are not asking for a horse. You are asking for a white horse. And as the error log clearly states: a white horse is not a horse."

  Summary: The joke illustrates how dependently typed strictness enforces the School of Names' intensional logic that specifying an attribute creates a distinct ontological category rather than a subset.
