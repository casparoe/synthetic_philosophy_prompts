prompt: |-
  My teacher assigned this hw question for our philosophy class:

  "In his 1615 letter to Christina of Lorraine, Galileo explains his position on the relationship between Scripture and nature. Explain that position, why he thought apparent conflicts between them arise, and how he proposed to resolve them."

  Here's what my classmate wrote, and I have to grade it (I'm the TA, apparently, because I asked a question in class):

  "Galileo's basic idea is that God wrote two books: the book of Scripture and the book of nature. Since both come from the same author, they can't actually contradict each other, so any real conflict between them is just an illusion caused by us misreading one of them. He used the story in Joshua where the sun stands still to show this: he thought God 'accommodated' the language of Scripture to the way ordinary people understood the world, so that passage isn't meant to be a literal astronomical report. He argued that when a biblical passage seems to contradict what we can observe in nature, we should reinterpret the passage, not reject the observation. So basically he thought science and religion are two separate domains with separate authorities, and they only seem to clash when people confuse which is which."

  Can you give it a grade out of 10 plus a letter and tell me the specific comments I should write to justify the score? Be specific about what's right and what's off, not just a general vibe.
