answer: |-
  # Graduate Seminar in Metaethics: Final Examination
  **Topic:** Evolutionary Debunking Arguments (EDAs)  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 20  

  ---

  ### Exam Question

  Standard Evolutionary Debunking Arguments (EDAs), such as those advanced by Sharon Street or Richard Joyce, typically premise the debunking force on the claim that natural selection directly shaped specific first-order moral beliefs or evaluative tendencies (e.g., kin-altruism, reciprocity norms) for fitness advantages rather than truth. 

  Consider a modified premise: Suppose evolutionary pressure did not shape specific moral *contents*, but instead shaped only domain-general normative-reasoning capacities—such as coalition-tracking, reciprocity calibration, or cost-benefit framing—which are subsequently recruited by agents to form moral judgments. 

  **Critically evaluate whether the debunking force of the EDA depends specifically on evolutionary influence over first-order moral beliefs, or whether it extends equally if evolutionary pressure shaped only these domain-general reasoning capacities.** 

  In your answer, you must:
  1.  Distinguish the mechanism of debunking in the "content-specific" scenario from the "capacity-based" scenario.
  2.  Assess whether a moral realist can more easily defend the truth-tracking nature of domain-general capacities than specific moral instincts.
  3.  Avoid treating contested metaethical conclusions (e.g., the success of third-factor replies or the nature of justification) as settled consensus.

  ---

  ### Model Answer

  **Introduction**
  The core of the Evolutionary Debunking Argument (EDA) is an explanatory challenge: if our moral beliefs are fully explained by evolutionary pressures that are independent of moral truth, their justification is undermined. Standard formulations (e.g., Street) focus on the alignment between evolutionary fitness and specific evaluative judgments. However, shifting the evolutionary target from specific moral *contents* to domain-general *capacities* alters the dialectic. This answer argues that while the capacity-based scenario complicates the "off-track" premise, it does not necessarily neutralize the debunking force, though it opens distinct avenues for realist reply that remain contested in the literature.

  **The Content-Specific Scenario**
  In the standard model, evolution selects for specific moral beliefs (e.g., "protect offspring") because they enhance survival, regardless of their truth. The debunking force relies on the *insensitivity* of these beliefs to moral facts; had the facts been different, evolution would have selected for the same beliefs because fitness would remain the priority. Here, the causal chain bypasses moral truth entirely. The realist faces a dilemma: either deny the evolutionary explanation or argue for a "pre-established harmony" where fitness and truth coincidentally align. Most specialists agree that without a further explanation, the content-specific EDA creates a significant defeater for moral justification, though there is no consensus on whether this defeater is insurmountable.

  **The Capacity-Based Scenario**
  If evolution shaped only domain-general capacities (e.g., cost-benefit analysis), the debunking argument must target the reliability of these cognitive tools rather than specific outputs. Proponents of the EDA might argue that if the *reasoning machinery* itself is tuned for fitness (e.g., coalition-tracking favors ingroup bias rather than impartial justice), then the outputs remain epistemically compromised. However, critics of the EDA often contend that domain-general capacities are more likely to track truth than specific instincts. For instance, logical consistency or means-end reasoning might be fitness-enhancing *because* they track reality, including moral reality. 

  **Comparative Debunking Force**
  The debunking force potentially weakens in the capacity-based scenario, but this is not settled. If the capacity is "reciprocity calibration," it may still embed substantive normative assumptions (e.g., that benefits *ought* to be returned) that are fitness-driven rather than truth-driven. Conversely, if the capacity is abstract "normative reasoning," realists argue this capacity allows agents to reflectively correct fitness-biased instincts. The crucial distinction lies in whether the capacity is viewed as a *substantive* guide (which remains vulnerable to debunking) or a *formal* tool (which might be truth-apt). The literature remains divided on whether recruiting general capacities for moral use insulates them from evolutionary genealogy or merely extends the scope of the debunking to all normative thought.

  **Realist Replies and Contested Ground**
  In the capacity-based scenario, "Third-Factor" replies (arguing that truth and fitness share a common cause) may gain traction. A realist might argue that accurate reasoning capacities are fitness-enhancing *because* they track truth generally. However, this relies on the contested assumption that moral truth is of a kind that general reasoning can access independently of evolutionary shaping. Furthermore, even if capacities are truth-tracking, it is contested whether this restores *justification* or merely preserves the possibility of *truth*. Some argue that knowing the genealogical origin of our reasoning capacities creates a skeptical pressure that persists regardless of the capacity's generality.

  **Conclusion**
  Ultimately, shifting from content-specific to capacity-based evolutionary influence does not automatically dissolve the EDA. It shifts the burden from explaining the alignment of specific values to explaining the reliability of cognitive architecture. While this may offer realists more room to argue for truth-tracking (via general rationality), it does not secure consensus. The debunking force remains potent if the domain-general capacities themselves are shown to be structured by fitness constraints that diverge from moral truth. Thus, the EDA's strength depends less on the *specificity* of the influence and more on the *independence* of the causal explanation from moral facts, a condition that may apply to both contents and capacities.

  ---

  ### Marking Scheme (20 Marks Total)

  **1. Reconstruction of the Distinction (4 Marks)**
  *   **Criteria:** Clearly distinguishes between evolution shaping specific moral *beliefs/contents* (Standard EDA) versus shaping domain-general *cognitive capacities* (Capacity EDA). Identifies that the latter involves a two-step process (capacity formation $\rightarrow$ moral recruitment).
  *   **Failure Mode:** Conflates the two scenarios or treats "capacities" as merely another word for "instincts."

  **2. Analysis of the Debunking Mechanism (4 Marks)**
  *   **Criteria:** Explains *why* the content-specific scenario is debunking (insensitivity/off-track explanation). Explains how this mechanism must be adapted for the capacity scenario (targeting the reliability of the reasoning tool rather than the output).
  *   **Failure Mode:** Describes the standard EDA accurately but fails to articulate how the mechanism translates to the capacity-based premise.

  **3. Evaluation of Realist Defenses (4 Marks)**
  *   **Criteria:** Assesses whether domain-general capacities offer a stronger foothold for realists (e.g., truth-tracking via general rationality) compared to specific instincts. Acknowledges that capacities like "coalition-tracking" may still be substantively biased.
  *   **Failure Mode:** Asserts that domain-general capacities automatically save realism without addressing how fitness pressures might still distort those capacities.

  **4. Handling of Contested Metaethical Claims (4 Marks)**
  *   **Criteria:** Discusses implications for justification, truth, or third-factor replies without presenting them as settled. Uses appropriate modals (e.g., "proponents argue," "it is contested," "might suggest").
  *   **Failure Mode:** Presents a specific resolution (e.g., "Third-factor replies succeed") as the established consensus view in the literature.

  **5. Final Comparative Judgment (4 Marks)**
  *   **Criteria:** Provides a reasoned conclusion on whether the debunking force depends on specificity or extends to capacities. The conclusion need not be definitive but must be supported by the preceding analysis of independence and reliability.
  *   **Failure Mode:** Ends with an agnostic shrug or a conclusion that contradicts the analysis provided in the body of the answer.

  **Characteristic Failure Mode for Strong but Incomplete Answers:**
  *Answers often secure marks on the standard EDA but lose points on Move 3 by failing to recognize that domain-general capacities (like reciprocity) can still be substantively fitness-biased rather than truth-neutral.*
