prompt: |-
  Write a 90-minute, 20-mark final exam question for a graduate metaethics seminar on evolutionary debunking arguments. The prompt must force candidates beyond summarizing standard versions (e.g., Street’s tracking argument or Joyce’s non-truth-tracking account) by requiring them to evaluate whether the debunking force depends specifically on evolutionary influence over first-order moral beliefs, or whether it extends equally if evolutionary pressure shaped only domain-general normative-reasoning capacities—such as coalition-tracking, reciprocity calibration, or cost-benefit framing—that are then recruited for moral judgment. Provide a model answer and a marking scheme organized around five must-hit analytical moves, with marks assigned to each (totaling 20) and a one-line note on the characteristic failure mode for strong but incomplete answers. The model answer should clearly distinguish what is settled in the specialist literature from what is genuinely contested, and should not present any contested interpretation—e.g., whether debunking undermines justification, rationality, or truth-aptitude; whether a “third-factor” reply succeeds; or whether domain-general recruitment weakens the argument—as if it were the consensus view. Keep the question precise enough to be answerable without external sources, but design it so that reciting familiar labels earns no more than partial credit.
