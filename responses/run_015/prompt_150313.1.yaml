      *   **Option C: Reject the "Divisible Harm" Inference (Inference 6).**
          *   *Idea:* Harm is not proportional to substrate percentage. Losing 50% of the substrate might be 100% of the harm *to that locus*.
          *   *Cost:* Needs a theory of why harm doesn't scale with the survival of the pattern.
