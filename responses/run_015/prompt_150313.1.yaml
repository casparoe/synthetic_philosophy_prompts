      *   **The User's Reductio:** The user constructs an argument showing that this view leads to counterintuitive moral conclusions regarding murder and harm.
      *   **The Argument Structure:**
          1.  Self = functional loop (substrate-independent, distributable).
          2.  B1 + B2 coupled = One Self (S).
