          *   *Idea:* Murder isn't just loop termination; it's the destruction of a *perspective* or a *locus of experience*. Even if S survives in B2, the *perspective from B1* is terminated.
          *   *Cost:* Requires distinguishing between "The Self" (abstract pattern) and "The Subject of Experience" (localized instantiation). Might complicate the "substrate-independent" claim.
