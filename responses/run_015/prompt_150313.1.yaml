  8.  *(Self-Correction)*: Wait, I need to be careful about the "experience of dying." If the loop is truly one, does B1 experience anything *as B1*? If the self is S, and S is in B1+B2, then B1 is just an I/O port. If B1 is destroyed, S loses a port. The "experience of dying" implies a localized self in B1. If the friend is right, there *is* no localized self in B1. So the reductio assumes what it tries to disprove (that B1 has a moral claim independent of S).
      *   *Correction:* The reductio works because it highlights that *we* (the evaluators) feel B1's death is significant. The friend must explain why that intuition is wrong.
