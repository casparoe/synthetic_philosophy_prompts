answer: |-
  Your intuition about hysteresis is not just a metaphor imported from your old toolbox; it is a genuine feature of the ethics of public speech. In philosophy of language, this is often discussed under **uptake** and **speech acts**. A monument is not a static statement; it is an ongoing act of communication. If the audience's reception (uptake) shifts irreversibly from "honor" to "intimidation" or "insult," the act itself has changed. You cannot wish the new meaning away any more than you can wish a phase transition back without changing the conditions.

  You are looking for a principle that reconciles your eight verdicts. Your "re-installation test" failed because it is ahistorical (it ignores why things are there), and your "entanglement condition" failed because it struggles with degrees of separation.

  Here is a principle that captures your intuitions, validates your hysteresis insight, and is precise enough to apply.

  ### The Principle of Functional Integrity

  A commemorative object should remain in its public context if and only if **its current social function does not constitute an active harm to the community, provided that the honor it confers is not constitutively dependent on that harm.**

  To apply this, you must run three checks. If any check fails, the object must be removed or radically recontextualized (e.g., moved to a museum).

  1.  **The Constitutive Dependence Check:** Is the achievement being honored *made possible by* the moral atrocity?
      *   *If Yes:* Remove. (The good is tainted at the root).
      *   *If No:* Proceed. (The good is distinct from the bad).
  2.  **The Hysteresis Check:** Has the social meaning of the object irreversibly shifted from "commemoration" to "intimidation" or "exclusion"?
      *   *If Yes:* Remove or Reframe. (The object is now a weapon, not a memory).
      *   *If No:* Proceed.
  3.  **The Agency & Grief Exemption:** Does the object primarily serve as a site of private grief for the dead, or is its meaning actively sustained by the current local community (regardless of original intent)?
      *   *If Yes:* It may remain, even if it fails the "would we build it now" test.
      *   *If No:* Apply the standard rules.

  ---

  ### Applying the Principle to Your Cases

  Here is how the principle processes your eight verdicts.

  *   **1. Slave Trader (Square):** Fails **Constitutive Dependence** (wealth/status derived from slaving) and fails **Hysteresis** (now seen as an insult). **Verdict: Down.**
  *   **2. Slave Trader (Museum):** Passes **Hysteresis** (reframed as education, not honor). **Verdict: Up.**
  *   **3. WWI Memorial (Village):** Passes **Agency & Grief Exemption**. It functions as grief for lost sons, not endorsement of the war's politics. **Verdict: Up.**
  *   **4. Chemist (Building):** Passes **Constitutive Dependence**. His chemistry is not *made of* his eugenics; they are separate domains. Fails **Hysteresis** (assuming no active protest makes it unusable). **Verdict: Up + Plaque.**
  *   **5. Surgeon (Street):** Fails **Constitutive Dependence**. The anesthesia breakthrough was *constituted by* the torture of enslaved people. The science and the harm are the same event. **Verdict: Down.**
  *   **6a. Confederate Generals (Courthouse):** Fails **Hysteresis**. Erected during Jim Crow to intimidate; function remains intimidation. **Verdict: Down.**
  *   **6b. Confederate Dead (Cemetery):** Passes **Agency & Grief Exemption**. It functions as a grave marker, not a political flag. **Verdict: Up.**
  *   **7. Tomb Brass (Church):** Passes **Agency & Grief Exemption** (and antiquity). It is a grave, not a civic honor. **Verdict: Up.**
  *   **8. Lenin (Russian Town):** Passes **Agency & Grief Exemption**. The community actively sustains the meaning (flowers, local identity). The original ideological function has undergone semantic drift; it is now a "town monument," not a "Soviet monument." **Verdict: Up.**

  ---

  ### The Weakest Verdict

  You asked me to be straight about which verdict this principle cannot save, or which is the weakest link.

  **You must drop Case 6b (The Confederate Cemetery Slab).**

  Here is why: The **Agency & Grief Exemption** relies on a distinction between "honoring the dead" and "honoring the cause." In the case of the First World War (Case 3), that distinction holds; the war was complex, and the soldiers were conscripts fighting a national battle.

  In the case of the Confederacy, the "cause" was explicitly the preservation of chattel slavery. To honor the "Confederate Dead" is to honor the men who died *to keep slavery legal*. While they are dead, and grief is real, a public slab saying "Our Confederate Dead" in a community that also removes Confederate Generals from the courthouse (6a) creates a contradiction. It suggests the *generals* were racist ideologues, but the *soldiers* were innocent. History does not support that separation.

  If you apply the **Constitutive Dependence Check** strictly, fighting for slavery is entangled with slavery. If you keep 6b while removing 6a, you are prioritizing your own comfort with grief over the logical consistency of the harm. To be principled, 6b should either come down or be heavily contextualized to explain *what* they died for. It is the emotional outlier in your list.

  ---

  ### New Test Cases

  Here is how the Principle of Functional Integrity handles three cases you did not list.

  #### Case A: The Fallen Philanthropist (Living Person)
  **Scenario:** A university library is named after a living tech billionaire who donated the funds. Five years later, he is convicted of sexually abusing minors. The students demand the name come off.
  *   **Analysis:**
      *   **Constitutive Dependence:** No. The library's function (books, study) is not *made of* the abuse. (Similar to the Chemist).
      *   **Hysteresis:** Yes. The name on the building now functions as a daily reminder of trauma to survivors and a signal that the university tolerates abuse. The "honor" has flipped to "insult."
      *   **Agency:** The community (students/staff) rejects the meaning.
  *   **Verdict:** **Remove the name.** Unlike the Chemist (dead, historical politics), the harm here is active and the function of the building is compromised by the association. The Hysteresis Check overrides the Constitutive Check.

  #### Case B: The Accidental Shrine (Protest Site)
  **Scenario:** A statue of a minor, morally neutral 19th-century mayor stands in a park. Over the last decade, it has become the default meeting point for violent white nationalist rallies, not because of the mayor, but because of the location. The city wants to remove it to stop the rallies.
  *   **Analysis:**
      *   **Constitutive Dependence:** No. The mayor did nothing wrong.
      *   **Hysteresis:** Yes. The object's social function has shifted from "local history" to "rallying point for hate." The uptake has changed.
      *   **Agency:** The broader community is harmed by the gatherings.
  *   **Verdict:** **Remove or Relocate.** This validates your hysteresis intuition. The object's physical history matters less than its current social function. If the statue now functions as a weapon, it must be disarmed, even if the original subject was innocent.

  #### Case C: The Colonial Obelisk (Foreign Context)
  **Scenario:** A British victory obelisk from 1850 stands in a public square in Mumbai. It celebrates a battle where the British defeated local rulers. Most locals ignore it; some find it ugly; a small group wants it gone as a symbol of oppression. The government wants to keep it as "history."
  *   **Analysis:**
      *   **Constitutive Dependence:** Yes. It celebrates a colonial conquest.
      *   **Hysteresis:** Mixed. It is largely ignored (background), but for the aggrieved group, it is an insult.
      *   **Agency:** The *current* local community is divided. It is not sustained by active grief (like Lenin), nor is it actively intimidating the majority (like Confederate Courthouses).
  *   **Verdict:** **Contextualize, do not remove.** This is the differentiating case. Unlike the Confederate statues (6a), this is not being used to enforce a *current* racial hierarchy. Unlike the Lenin statues (8), it is not actively loved. It falls into a "historical record" category. Add a plaque explaining the conquest from the Indian perspective. It fails Constitutive Dependence, but passes Hysteresis (no active intimidation), so re-framing (Case 2 logic) is the solution rather than erasure.

  ### Summary
  Your hysteresis insight is the strongest part of your ethical framework. Monuments are phase-dependent. Once the social temperature crosses a critical point, the meaning crystallizes into something new, and you cannot cool it back down to the old meaning without breaking the object.

  The **Principle of Functional Integrity** saves seven of your eight verdicts. It asks you to sacrifice the Confederate Cemetery slab (6b) to maintain coherence. If you cannot bear to drop that one, you must admit that your principle is not purely ethical, but partly aesthetic or emotional—and there is no shame in that, provided you acknowledge the inconsistency.
