answer: |-
  You have discovered one of the most robust and unsettling results in social choice theory. You are correct that it feels like the courtroom "Doctrinal Paradox," and you are also correct that your specific observation about *granularity* adds a layer that standard textbook examples often gloss over.

  Here is the carving you asked for: what this is, why the asymmetry exists, what is to blame, and where the boundaries lie.

  ### 1. The Name and the Fit

  The overarching phenomenon is the **Discursive Dilemma** (often still called the **Doctrinal Paradox**).

  You felt it was "close but not the same" because the classic example usually contrasts voting on the **Conclusion** ("Is the defendant liable?") versus voting on the **Premises** ("Did they breach duty?" + "Did damage occur?"). In your case, you are voting on premises *either way*, just at different levels of resolution ("Budget" vs. "Salaries + Equipment").

  However, mathematically, this is the exact same paradox. In judgment aggregation theory, any compound proposition (like "Budget is sufficient") can be treated as a "conclusion" derived from atomic propositions ("Salaries are covered" AND "Equipment is covered").
  *   **Your University Case:** You moved from voting on a compound premise ("Budget") to voting on its atomic conjuncts ("Salaries" + "Equipment").
  *   **Your Condo Case:** You moved from voting on a compound conclusion ("Go Ahead") to voting on its atomic disjuncts ("Budget" OR "Experience").

  The specific nuance you identified—that the outcome changes based on how finely you slice the criteria—is formally known as **Description Sensitivity** (or **Agenda Sensitivity**) within the Discursive Dilemma. It highlights that Majority Voting is not **description-invariant**: the group's decision changes based on how the problem is described, even if the underlying reality and individual judgments do not.

  ### 2. The Mechanism: Why the "Carving" Matters

  The core engine of this problem is that **the Majority Operator does not distribute over Logical Connectives.**

  In arithmetic, $Average(A + B) = Average(A) + Average(B)$. In voting logic, $\text{Majority}(P \text{ AND } Q) \neq \text{Majority}(P) \text{ AND } \text{Majority}(Q)$.

  Here is why your granularity observation works, using your numbers:

  **The Conjunctive Case (University - AND)**
  *   **Logic:** Fund = Sound $\land$ Salaries $\land$ Equipment.
  *   **The Trap:** A member can believe the budget is *overall* too tight (Vote: No on "Budget") but acknowledge that salaries are covered and equipment is covered (Vote: Yes on "Salaries", Yes on "Equipment").
  *   **Coarse Grain:** You ask "Is Budget OK?" The members who think "Salaries yes, Equipment no" must vote **No**. The "No" votes accumulate.
  *   **Fine Grain:** You ask "Salaries?" and "Equipment?" separately. The "Salaries yes" voters form a majority. The "Equipment yes" voters form a majority. The specific individuals who voted "No" on the aggregate budget are outvoted on the parts.
  *   **Result:** Fragmenting a Conjunctive (AND) criterion makes it **easier** to pass.

  **The Disjunctive Case (Condo - OR)**
  *   **Logic:** Go = Budget OK $\lor$ Experience Yes.
  *   **The Trap:** Supporters are split. Two people vote Yes because of Budget. One person votes Yes because of Experience.
  *   **Coarse Grain:** You ask "Go Ahead?" All three supporters vote **Yes**. Majority passes.
  *   **Fine Grain:** You ask "Budget?" (2 Yes, 2 No $\rightarrow$ Fails). You ask "Experience?" (1 Yes, 4 No $\rightarrow$ Fails). The supporters are diluted across different reasons.
  *   **Result:** Fragmenting a Disjunctive (OR) criterion makes it **harder** to pass.

  ### 3. The AND/OR Asymmetry

  You asked if the asymmetry is real or an artifact. It is a **real, mathematical feature** of the Discursive Dilemma.

  *   **Conjunction (AND):** Splitting criteria favors the **Positive** outcome. (It is easier to find a majority for the parts than for the restrictive whole).
  *   **Disjunction (OR):** Splitting criteria favors the **Negative** outcome. (It is harder to find a majority for any single sufficient path than for the permissive whole).

  This creates a dangerous incentive for agenda setters:
  *   If you want to **kill a grant**, keep the criteria lumped together (Conjunctive).
  *   If you want **to approve a grant**, split the criteria into tiny atomic pieces (Conjunctive).
  *   If you want **to approve a contractor** (Disjunctive rule), keep the reasons lumped.
  *   If you want **to block a contractor**, force them to specify exactly which criterion they meet.

  ### 4. What is to Blame?

  You asked whether to blame the voting rule, the question carving, or the lack of a "finest grain."

  **1. The Voting Rule (Majority):**
  This is the primary culprit. Majority rule is the only common rule that produces this paradox.
  *   **Unanimity Rule:** If you required 5/5 votes on every line, the paradox disappears. (If everyone agrees on the parts, they agree on the whole). But as you noted, this biases heavily toward inaction (status quo).
  *   **Dictatorship:** If one person decides, it is consistent. (Obviously undesirable).

  **2. The Question Carving (Agenda):**
  This is the lever that exploits the flaw in the voting rule. Because there is no "correct" level of granularity, the agenda setter holds effective veto power or approval power without casting a vote. This is a violation of **Neutrality** and **Systematicity** in social choice.

  **3. The Lack of a "Finest Grain" (Ontology):**
  This is the philosophical killer. You noted: *you can always split "enough for salaries" into two questions again.*
  In formal logic, this is the problem of **Logical Atomism**. There is no objective "atomic" fact. "Salaries are sufficient" is itself a compound judgment (e.g., "PI salary OK" AND "Student salary OK").
  Because there is no bottom level of reality where the voting stops, **consistency is impossible to guarantee under Majority Rule.** This is proven by the **List-Pettit Impossibility Theorem** (2002), which shows that no aggregation rule can satisfy a set of minimal democratic conditions (Anonymity, Systematicity, Consistency) when decisions are logically connected.

  ### 5. Boundary Cases: When does it break?

  You asked for the cases where no way of slicing gives a coherent answer.

  **The Impossible Zone (The List-Pettit Boundary):**
  If your committee accepts three conditions, you are mathematically guaranteed to face this paradox eventually:
  1.  **Universal Domain:** You accept any combination of individual views (no restricting who can be on the committee).
  2.  **Systematicity:** You apply the same voting rule (e.g., majority) to every question on the ballot.
  3.  **Consistency:** The group's judgments must be logically consistent (no passing the parts but failing the whole, or vice versa).

  **The Escape Hatches:**
  To avoid the paradox, you must break one of those three:
  *   **Break Systematicity:** Use Majority for some questions and a different rule (e.g., Chair's tie-break, or 2/3 supermajority) for others. This is ad-hoc but practical.
  *   **Break Universal Domain:** Restrict the committee to people who think alike (homogeneous preferences). If everyone correlates their views on "Salaries" and "Equipment" perfectly, the paradox vanishes. (This is why small, specialized committees often don't see this, but larger, diverse ones do).
  *   **Break Consistency:** Accept that the group can be logically inconsistent. (This is what you are currently doing).

  ### 6. Summary and Recommendation

  **Is it the Doctrinal Paradox?**
  Yes. Specifically, it is the **Discursive Dilemma** manifested through **Description Sensitivity**.

  **Is the AND/OR asymmetry real?**
  Yes. Fragmentation aids passage in Conjunctive (AND) tasks and hinders passage in Disjunctive (OR) tasks.

  **What is the "Name" for the Granularity Issue?**
  While "Discursive Dilemma" is the parent, the specific power of the ballot-drafter is called **Agenda Control** or **Framing Power** in Judgment Aggregation.

  **How to fix it (without biasing toward "No"):**
  Since you cannot fix the math without changing the rules, you must change the process.
  1.  **Premise-Based Voting with Deliberation:** Vote on the finest grain you can agree is "atomic" (e.g., specific budget line items). If the result contradicts the overall intuition, **do not accept the vote immediately.** Use the inconsistency as a trigger for discussion. "We voted Yes on all parts but No on the whole; does anyone want to change their vote to align?"
  2.  **Randomized Agenda:** If the ballot structure decides the outcome, remove the human choice. Randomize whether criteria are lumped or split. (Practically difficult, but theoretically fair).
  3.  **The "Conclusion Priority" Compromise:** Vote on the main question ("Fund?") first. If it fails, stop. If it passes, *then* vote on the criteria to ensure accountability. This privileges the " gestalt" judgment over the technicalities, which often matches the intent of small grants committees better than strict logical aggregation.

  You have identified that your handbook assumes logic is distributive over voting. It is not. The inconsistency is not a bug in your committee; it is a feature of collective rationality.
