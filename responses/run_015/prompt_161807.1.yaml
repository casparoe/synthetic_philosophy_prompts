answer: |-
  "Did you hear him?" Elias asked, stopping by the vending machine in the hallway. He stripped off his latex gloves. "He swore it was one movie. One continuous story. No gaps."

  Mara leaned against the tiled wall, arms crossed. "He swore a lot of things, Elias. But his hands told two different stories for three minutes straight. Finding one is undeniable. Dual tracking without cross-contamination. That implies two pilots."

  "It implies two motor systems," Elias corrected. "Not two consciousnesses. Look at the switch. Finding two. The narration flips. When the left hemisphere grabs the mic, the right hand stalls. When the right hemisphere takes over, the left hand stalls. It's a relay race. One stream of consciousness at a time, swapping batons between hemispheres. That's Serial Duality. It explains the confabulation perfectly. The speaking hemisphere fills in the blanks for the periods when it was offline."

  Mara pushed off the wall. "I understand your view. You're saying unity is binary. Either you are fully conscious of a field, or you aren't. So when the affect data came in—finding three—you have to call it subpersonal. Pupil dilation, skin conductance tracking the emotional shape of the unreported film. You're saying that's just the brainstem humming along without a subject."

  "Exactly," Elias said. "Arousal isn't experience. I can startle at a loud noise while asleep. That doesn't mean I was consciously watching the source of the noise. The subcortical structures are intact in R. They broadcast arousal to both sides. But the *experience* of the sadness or the tension? That requires the cortical spotlight. And the spotlight was switching."

  "But that's where you lose me," Mara said. "You treat unity as an all-or-nothing boundary. I'm arguing for Graded Co-consciousness. Unity is a matter of degree. In R., the two content-streams are bound together at the level of affect and gist, but not at the level of specific verbal report. He is a single subject, partially unified. The restriction is a bottleneck in access, not in experience. When his pupils dilated for the unreported film, that wasn't a zombie reflex. That was him, feeling something he couldn't name."

  Elias shook his head. "That's incoherent, Mara. What does 'partially unified' mean? If I am conscious of X, and conscious of Y, am I conscious of the conjunction 'X and Y'? If yes, we have full unity. If no, then we have duality. There's no middle ground. You can't be half-pregnant with a experience. If the unity is partial, it collapses into duality because the subject isn't truly present to both contents simultaneously."

  "I grant you the difficulty," Mara conceded. "It is hard to articulate the phenomenology of partial binding. But consider the alternative. If you insist on strict duality, you have to explain why the patient insists on a single film. You call it confabulation, but confabulation usually covers ignorance. Here, he claims continuity. If consciousness switches every thirty seconds, shouldn't there be a seam? A sense of waking up? He reports none."

  "Because the switch is fast enough to mask the gap," Elias countered. "But let's talk about the intact brain. That's the real stakes here. If you're right, and unity is graded, then the normal brain is just the top of the scale. But if I'm right, the intact brain is a different kind of beast. It's not just faster switching. It's structural integration."

  "Is it, though?" Mara pressed. "If you had a normal subject switching attention between two films fast enough, behaviorally indistinguishable from R.'s dual tracking, what would differ phenomenally? If the alternation was millisecond-fast, would it be distinguishable from genuine co-consciousness even in principle? Or is that disagreement merely verbal?"

  Elias paused, looking at the coffee machine. "It's not verbal. There is a difference between a single light sweeping back and forth rapidly and two lights burning steadily. The sweep leaves gaps in principle, even if unnoticed. The steady burn does not. In the intact brain, the unity is robust. In R., it's a fragile truce. I concede, though, that if the alternation were truly instantaneous, the functional difference vanishes. But the metaphysics remains. One subject versus two systems taking turns."

  "And I concede," Mara said, "that if the affect responses were uniform—just general stress rather than content-specific emotional tracking—my view would crumble. Finding three is my linchpin. If the body reacts to the specific sadness of the unreported film, the mind must be there to meet it."

  "So we're at an impasse on the metaphysics of unity," Elias said. "We need a decisive experiment. Given the goggles protocol, what would move you?"

  Mara thought for a moment. "If R. could simultaneously report specific details from both films without switching. Not just affect, but content. 'The man in the left film is falling while the car in the right film crashes.' If verbal report could bifurcate, my graded view becomes full unity. What about you? What would make you abandon Serial Duality?"

  "If the left hand could learn to name objects," Elias said immediately. "Not just select them. If the right hemisphere could bypass the speech center entirely and produce phonemes independently. That would prove two distinct speakers, two distinct subjects. But since that's impossible physiologically, I need something else." He sighed. "If you showed me that during the switch interval, when the hands stall, there is a total loss of consciousness. A blank spot he could detect. That would prove the light goes out."

  "But he denies the gaps," Mara noted.

  "Because he fills them," Elias said. "But if we could catch him in a gap. A forced-choice test during the stall where he guesses at random because nothing is there."

  "And if he doesn't guess at random?" Mara asked. "If he tracks the unreported film perfectly during the stall, but simply can't speak?"

  "Then I'd have to admit the experience is there without the report," Elias said. "But I still wouldn't call it unified. I'd call it parallel processing."

  "Semantics," Mara smiled.

  "Metaphysics," Elias corrected. He dropped his gloves in the bin. "So, you need bifurcated speech. I need a detectable gap."

  "No," Mara said. "I need to see the affect vanish when the report switches. If the pupil stops dilating for the unreported film the moment the voice starts narrating the other, then you're right. It's subpersonal. But if the affect persists while the voice switches, the subject is still watching both."

  Elias nodded slowly. "And for me... if the manual tracking fails completely during the switch. Not just unreliable, but stops. If the system truly goes offline. If the hands drop because the pilot leaves the cockpit."

  "So," Mara said, pushing open the door to the street. "Next session. We watch the hands, and we watch the eyes."

  "Let's see if the light sweeps," Elias said, "or if it burns."
