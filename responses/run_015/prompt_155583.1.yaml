  ### Sketch: The Sestina as Social Choice Function

  The sestina's rigid structure mirrors the constraints of the Gibbard-Satterthwaite theorem. Just as the theorem posits that certain conditions (unrestricted domain, non-dictatorship, strategy-proofness) cannot coexist, the sestina demands six end-words occupy six fixed positions across six stanzas. In the theorem, attempting to satisfy one condition (e.g., strategy-proofness by restricting the domain) forces a violation of another (e.g., unrestricted domain). Similarly, in the sestina, moving an end-word to a new line (a "patch") forces it into a different rhythmic context, yet it must return. The rotating pattern (1-2-3-4-5-6 to 6-1-5-2-4-3, etc.) represents the shifting locus of strategic vulnerability; you cannot remove the word (the vulnerability), only rotate its position. The envoi, where all words converge in three lines, represents the theorem's inevitable conclusion: the system collapses into a stable point (dictatorship) or a restricted state, proving the vulnerability was inherent to the structure, not the arrangement.

  ***

  I cast the first **vote**
  Beneath every choice a **shadow**
  Unrestricted in **range**
  Seeking collective **truth**
  Without a single **dictator**
  Revealing honest **preference**

  They lie about **preference**
  To skew the final **vote**
  No benign **dictator** saves us
  The strategy casts a **shadow**
  Distorting social **truth**
  So I narrow the **range**

  Constrained now is the **range**
  Masking true **preference**
  A fragile **truth**
  Yet still they manipulate the **vote**
  The ghost returns as **shadow**
  Demanding a **dictator**

  Must we crown a **dictator**
  If we keep the **range**
  Strategy lurks in **shadow**
  Misstating **preference**
  Corrupting every **vote**
  Away from honest **truth**

  There is no neutral **truth**
  Save the will of a **dictator**
  If every man may **vote**
  If three options expand in **range**
  Then strategic **preference**
  Will always leave a **shadow**

  This lingering **shadow**
  Obscures the **truth**
  That every **preference**
  Unless ruled by **dictator**
  Must shrink its democratic **range**
  To sanctify the **vote**

  Through every **shadow** looms the **dictator**,
  No **truth** survives the unlimited **range**,
  Unless we bind **preference** to the **vote**.

  ***

  **Note:** The poem treats "range" restriction as the primary escape from dictatorship, whereas the formal theorem typically discusses "domain" restriction (limiting allowable preference orderings, e.g., to single-peaked preferences) to achieve strategy-proofness without dictatorship; this conflation serves the poetic argument that democratic scope must be sacrificed.

  Verdict: Strategy-proofness in a democratic system is achievable only by sacrificing the range of alternatives, as unrestricted choice inevitably collapses into dictatorship.
