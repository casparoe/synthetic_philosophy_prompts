answer: |-
  # Joint Statement on Biological Function
  **Prepared by:** The Function Working Group  
  **Date:** October 26, 2023  
  **Context:** Philosophy of Biology Seminar  

  ## Preamble
  This document represents the current state of consensus and dissent between two camps within our working group: the **Etiological Camp** (Selected Effects) and the **Causal-Role Camp** (Systemic Capacity). Our goal is not to force a consensus where none exists, but to isolate the precise points of divergence so that future discussion may be productive. 

  *(Note on Terminology: In standard philosophical literature, the "Etiological" view is often associated with Larry Wright and Ruth Millikan, while the "Causal-Role" view is associated with Robert Cummins. We have adopted these standard labels for precision, though we recognize our initial seminar discussions utilized varying attributions.)*

  ---

  ## Part I: Agreed Claims
  Both camps endorse the following claims as necessary conditions for any satisfactory account of biological function. We agree that a successful theory must accommodate the following phenomena:

  1.  **The Function/Effect Distinction:** Any account must distinguish between a trait's *function* and its mere *effects*. (e.g., The heart's function is to pump blood; the sound it makes is a mere effect, even if that sound allows a doctor to diagnose health.)
  2.  **The Possibility of Malfunction:** Any account must allow for the possibility that a token trait can fail to perform its function without ceasing to be the type of trait it is. (e.g., A diseased heart is still a heart, not a different organ.)
  3.  **The Reality of Exaptation:** Any account must accommodate the fact that traits can acquire new functions over time distinct from their original utility. (e.g., Feathers used for thermoregulation later co-opted for flight.)
  4.  **Explanatory Power:** Function ascriptions must do explanatory work. Saying "the heart is there *because* it pumps blood" must explain the presence or maintenance of the heart in the organism better than saying "the heart is there and it pumps blood."
  5.  **Fitness Relevance:** We agree that biological functions are generally tied to the survival and reproduction (fitness) of the organism, though we disagree on whether this tie is historical or current.

  ---

  ## Part II: Statement of Disagreement
  While we agree on the phenomena that need explaining, we disagree on the *truth conditions* for function ascriptions. Below are the precise points of divergence.

  | Feature of Disagreement | Etiological Camp (Selected Effects) | Causal-Role Camp (Systemic Capacity) |
  | :--- | :--- | :--- |
  | **1. The Grounding of Function** | A trait's function is fixed by its **evolutionary history**. $X$ has function $F$ if and only if $X$ exists in the current population because ancestors of $X$ performed $F$ and were selected for doing so. | A trait's function is fixed by its **current causal contribution**. $X$ has function $F$ if and only if $X$ currently performs $F$ as part of a causal chain that contributes to the capacity (fitness) of the containing system. |
  | **2. The Nature of Malfunction** | Malfunction is a **normative failure**. A trait can retain its function even when it fails to perform it, because the standard for success is set by history, not current performance. | Malfunction is a **loss of capacity**. If a trait ceases to contribute to the system's capacity, it strictly speaking loses that function (or the ascription becomes false), as function is identical to current contribution. |
  | **3. Normativity** | Function is inherently **normative**. It implies an "ought" derived from natural selection (the trait *ought* to do what it was selected to do). | Function is inherently **descriptive**. It describes a causal role within a system analysis; "ought" is a metaphorical projection onto causal capacities. |

  ---

  ## Part III: Cruxes and Test Cases
  To move forward, we have identified three "cruxes"—sub-questions where settling the matter would force at least one camp to revise their position or concede ground. For each crux, we propose a concrete case and record our divergent predictions.

  ### Crux 1: The Time-Index Problem (Novel Traits)
  **Question:** Can a trait have a biological function immediately upon arising, before it has a selection history?
  **Concrete Case:** *Synthetic Biology.* Scientists engineer a novel enzyme in a bacterium that immediately allows the bacterium to digest a new toxin, increasing its fitness. The enzyme has no evolutionary history; it was created in a lab five minutes ago.
  **Why this matters:** If function requires history, this enzyme has no function yet. If function requires current contribution, it has a function immediately.

  | Camp | Prediction / Intuition |
  | :--- | :--- |
  | **Etiological** | The enzyme has **no proper function** yet. It has a *use* or *capacity*, but it cannot have a biological function until it is inherited and selected for in subsequent generations. |
  | **Causal-Role** | The enzyme **has a function** immediately. Its causal role in digesting the toxin contributes to the organism's fitness now. Waiting for selection history is unnecessary for the ascription. |

  ### Crux 2: The Vestigiality Problem (Lost Contribution)
  **Question:** Does a trait retain its function if it no longer contributes to fitness?
  **Concrete Case:** *Vestigial Eyes.* Consider a species of cave-dwelling fish that possesses rudimentary, non-functioning eyes. These eyes were selected for vision in ancestors, but now contribute nothing to fitness (and may even be costly).
  **Why this matters:** This tests whether function is a "ghost" of the past or a reality of the present.

  | Camp | Prediction / Intuition |
  | :--- | :--- |
  | **Etiological** | The eyes **retain the function** of vision (or at least, their function is defined by vision), even though they fail to perform it. They are malfunctioning traits. |
  | **Causal-Role** | The eyes **have no function**. Since they contribute nothing to the current system's capacity, calling them "eyes with a function" is misleading. They are merely structural remnants. |

  ### Crux 3: The Verbal Dispute (One Concept or Two?)
  **Question:** Are we arguing about the definition of a single word ("function"), or are we identifying two distinct biological concepts that happen to share a name?
  **Concrete Case:** *Medical vs. Evolutionary Context.* A doctor says, "The function of this kidney is to filter blood," regarding a patient on dialysis (whose kidney does not filter). An evolutionary biologist says, "The function of this kidney is to filter blood," regarding a species trait.
  **Why this matters:** If the doctor and biologist mean different things by "function," our debate is verbal. If they mean the same thing, one of us is wrong about the truth conditions.

  | Camp | Prediction / Intuition |
  | :--- | :--- |
  | **Etiological** | There is **one core concept**. The doctor is speaking loosely or elliptically (referring to the type's history). Strictly speaking, if the kidney doesn't filter, it is malfunctioning, but the *function* remains defined by the type's history. |
  | **Causal-Role** | There are **two distinct concepts**. The doctor is using "function" to mean *systemic capacity* (Causal Role). The evolutionary biologist is using "function" to mean *adaptive history* (Selected Effect). We should stop arguing and admit biology uses both. |

  ---

  ## Part IV: Path Forward
  We acknowledge that a significant portion of our stalemate may be verbal (Crux 3). If we conclude that "function" is ambiguous between a *historical/teleological* sense and a *systemic/causal* sense, we may agree that both accounts are valid for different explanatory purposes.

  However, until that is settled, we agree to test our predictions against biological practice. We will review literature on how biologists treat **novel mutations** (Crux 1) and **vestigial organs** (Crux 2) in peer-reviewed papers. If biologists consistently ascribe functions to novel traits before selection occurs, the Etiological account must be revised. If biologists consistently describe vestigial organs as "functionless," the Causal-Role account gains ground.

  **Signed:**  
  *Representative, Etiological Camp*  
  *Representative, Causal-Role Camp*
