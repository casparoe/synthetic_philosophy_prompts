answer: |-
  ### Preliminary Mapping (Brainstorming Notes)

  *   **Core Tension:** The "Method of Cases" (MoC) vs. The "Restrictionist Challenge" (Weinberg/Stich/Nichols).
  *   **Institutional Behavior:** We teach MoC as *normative* (how to do philosophy) and X-phi as *descriptive/critical* (how minds actually work).
  *   **Key Defense:** The Chomskian analogy. Competence (underlying grasp) vs. Performance (execution errors due to framing/fatigue).
  *   **Grading Norms:** Grading on consistency implies consistency is a virtue/truth-tracking. X-phi says consistency might just be rigidity or insensitivity to context.
  *   **Possible Resolutions:**
      1.  *Expertise Defense:* Trained philosophers aren't subject to the same biases (Ludwig/Williamson).
      2.  *Reflective Equilibrium:* Intuitions aren't atomic data; they are weights in a system. X-phi data enters the equilibrium too.
      3.  *Pragmatic/Deflationary:* Intuitions aren't evidence of truth, but evidence of *commitments*.
  *   **Pedagogical Shift:** If we drop authority, we move from "What is the truth?" to "What are the conditions of our asserting truth?"
  *   **Uncertainty:** Can the pragmatic view actually sustain the *authority* needed for grading? Or does it dissolve the discipline?

  ---

  ### Metaphilosophical Analysis of the Pedagogical Tension

  You have identified the central fault line in contemporary analytic metaphilosophy: the conflict between the **Centrality Claim** (intuitions are central evidence) and the **Restrictionist Challenge** (intuitions are culturally/psychologically unstable). The fact that departments teach both simultaneously suggests a complex, perhaps unstable, implicit theory of philosophical justification.

  Here is the reconstruction of that theory, its commitments, and its consequences.

  #### 1. Reconstructing the Implicit Theory
  The institutional practice presupposes a **Moderate Rationalism coupled with a Performance/Competence Distinction.**

  *   **Competence/Performance Distinction:** This is the heavy lifter. The practice assumes that beneath the noise of framing effects, order effects, and emotional salience (performance), there lies a stable, shared conceptual competence. When we grade on consistency, we are grading on the student's ability to filter out performance noise to reveal competence.
  *   **Reflective Equilibrium as Sanitizer:** The practice assumes that while raw intuitions are noisy, *considered* judgments (made under ideal conditions, stripped of bias) converge. X-phi is taught not to destroy the method, but to help students identify which intuitions are "clean" enough to enter the equilibrium.
  *   **Conceptual Universalism:** It presupposes that despite empirical variation, there is a single target concept (e.g., KNOWLEDGE, JUSTICE) that we are all trying to latch onto. Variation is error, not difference in kind.

  **Confidence:** High (0.9). This is the standard defense mounted by Cappelen, Ludwig, and Williamson against early x-phi critiques.

  #### 2. Does it need a "Clean" Intuition?
  **Yes.** The practice logically requires the belief that the "pump" (the thought experiment setup) can be sufficiently purified to isolate the "intuition" (the intellectual seeming).

  If there is no separable clean intuition, then the variation x-phi documents isn't noise; it's the *constitutive nature* of the judgment. If the judgment is constituted by the framing, you cannot strip the framing away to find the "real" answer. The grading norm (rewarding consistency across variants) collapses if the variant *changes the subject* rather than testing the same concept.

  **Confidence:** High (0.85). Without this distinction, the Method of Cases becomes merely a study in rhetoric or psychology, not normative philosophy.

  #### 3. Can a Deflationary or Pragmatic Philosophy License Both?
  **Yes, but at a cost.** A pragmatic view (à la Rorty or a quietist Wittgensteinian) can license this by reinterpreting what intuitions *do*.

  *   **The License:** Intuitions are not evidence of metaphysical reality; they are maps of our *linguistic and normative commitments*. We rely on them because they are the only tools we have to navigate our conceptual scheme. We teach x-phi skepticism to show that these tools are context-sensitive.
  *   **The Reconciliation:** We use hypotheticals to stress-test our commitments, not to discover Platonic truths. The "authority" is not truth-tracking, but *coherence-tracking*. We reward consistency because a consistent agent is more effective, not because they are "right" about the universe.
  *   **The Cost:** This undermines the realist ambition of most analytic courses. If the Trolley Problem doesn't tell us about *Morality* but only about *our psychology of moral attribution*, the syllabus changes from Metaphysics/Ethics to Conceptual Engineering or Anthropology.

  **Confidence:** Medium (0.6). **<-- FLAGGED AS LEAST SURE CLAIM.** I am least confident that this pragmatic reconciliation can sustain the *normative force* required for grading. If consistency is merely pragmatic utility, failing a student for inconsistency becomes harder to justify than failing them for logical contradiction.

  #### 4. Rival Views Quietly Ruled Out
  By maintaining this dual practice, the institution silently excludes:

  *   **Radical Naturalism (Quinean):** If intuitions are unreliable cognitive artifacts, a strict naturalist would say we should abandon them for empirical science. The department rules this out by keeping the thought experiments central.
  *   **Conceptual Relativism:** X-phi data often suggests that "knowledge" means different things in different cultures. The grading norms rule this out by assuming there is one correct answer key for the "Gettier Case."
  *   **Williamson's Anti-Psychologism:** Timothy Williamson argues evidence is the *fact* that p, not the *intuition* that p. The classroom practice treats the *intuition* itself as the data point to be graded, which Williamson would reject as psychologizing the evidence.

  **Confidence:** High (0.85). These are clear structural exclusions required to keep the current curriculum coherent.

  #### 5. Internal Tensions (Where the Parts Pull Apart)
  The most dangerous tension is between **Training** and **Debunking**.

  *   **The Pull:** We tell students, "Train your philosophical intuition; it gets better with practice" (Expertise Defense). Simultaneously, we teach, "Intuitions are subject to systematic bias regardless of training" (X-phi Findings).
  *   **The Contradiction:** If x-phi findings are robust, they often apply to philosophers too (though perhaps less so). If they apply to philosophers, the "Expertise Defense" is weakened. If it's weakened, the authority of the professor's judgment (used to grade the student) is undermined. The institution asks students to trust the professor's intuition about the case while teaching them that intuition is suspect.

  **Confidence:** High (0.9). This is the "Self-Defeat" objection often leveled at restrictionism, but it applies equally to the pedagogy.

  #### 6. Classroom Norms if Hypothetical Authority Were Dropped
  If we stopped treating hypothetical judgments as authoritative constraints (i.e., if we accepted the pragmatic/deflationary view fully), norms would shift drastically:

  1.  **Grading Consistency:** We would stop rewarding consistency across cases. Instead, we would reward **meta-cognitive sensitivity**. A student who says, "My intuition flips here because the emotional salience changed, and I'm not sure which framing is normatively relevant," would receive higher marks than a student who insists on a rigid consistent line.
  2.  **The Goal of Argument:** The goal would shift from **Discovery** (finding the truth of the case) to **Genealogy/Engineering** (understanding why we judge this way and deciding if we *want* to keep judging this way).
  3.  **Authority:** The professor ceases to be the arbiter of the "correct intuition" and becomes a facilitator of "conceptual negotiation."
  4.  **Assessment:** Exams would not ask "Is this person in the Gettier case knowing?" but "Which concept of knowledge is operationalized in this framing, and what are the pragmatic costs of adopting it?"

  **Confidence:** Medium-High (0.75). This follows logically from the deflationary view, though institutional inertia makes actual implementation unpredictable.

  ### Summary of Confidence & Uncertainty

  *   **High Confidence (0.85-0.9):** The reconstruction of the implicit Competence/Performance distinction; the identification of ruled-out rivals (Naturalism, Relativism); the diagnosis of the Training/Debunking tension.
  *   **Medium Confidence (0.6-0.75):** The viability of the Pragmatic license; the specific predictions about classroom norms.
  *   **Least Sure Claim:** **That a Deflationary/Pragmatic view can successfully license the reliance on intuitions *without* collapsing the normative authority needed for grading.** (Flagged above). It is unclear if you can tell a student they are "wrong" about a case if the only authority is pragmatic coherence. The transition from "truth-tracking" to "commitment-tracking" might break the grading mechanism entirely.
