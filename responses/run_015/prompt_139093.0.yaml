answer: |-
  You have spotted something genuine. The city is not using one theory of how the world works; it is using three different theories, swapped in and out depending on what each department needs to achieve. You are asking for the blueprint of that switching mechanism.

  Here is the reconstruction of the reasoning, the pressure points, and what is actually at stake.

  ### 1. Reconstructing the Underlying Views

  To make each practice reasonable, the city has to hold a specific view about what a "failure" is and what it can do.

  **The Metro View: The Physicalist Theory**
  For the transit authority to claim the train's failure to brake is not a cause, they must believe that causation requires a positive push. In this view, the world is made of events—things that happen, like a train moving or a heart beating. A "failure" is not an event; it is an absence of an event. It is nothing.
  *   **What must be true:** Nothing cannot cause something. Therefore, the train's non-braking did not kill the person. The only positive event was the person standing on the track.
  *   **The Goal:** This view isolates the moment of death. It ignores the history of the train (who programmed it?) and focuses only on the physics of the collision. It makes the system passive.

  **The Station Ordinance View: The Duty Theory**
  For the council to fine a witness even when pressing the button wouldn't have saved the victim, they must believe that responsibility is about following rules, not fixing outcomes.
  *   **What must be true:** A citizen has a duty to act when summoned by emergency. Violating that duty is a wrong in itself, separate from the physical result. The "cause" of the fine is the breach of duty, not the death of the victim.
  *   **The Goal:** This view separates moral failure from physical efficacy. It treats the failure to act as a complete event in the legal sense, regardless of whether it changed the physical world.

  **The Hospital View: The Pragmatic Theory**
  For the hospital to say a delay contributed to death but insist no one "caused" it, they must believe that the word "cause" carries a burden of blame that inhibits learning.
  *   **What must be true:** Causation is tied to fault. If we say A caused B, someone must pay or be punished. To keep staff honest about errors, we must disconnect the link between "this delay happened" and "this person is guilty."
  *   **The Goal:** This view treats causation as a tool for system design, not a statement of metaphysical truth. They want the benefit of causal analysis (fix the staffing) without the cost of causal attribution (lawsuits).

  ### 2. Required Parts vs. Compatible Parts

  In each case, there is a core requirement and a flexible perimeter.

  **The Metro**
  *   **Required:** They must define "cause" strictly as positive physical force. If they admit that "allowing something to happen" is a form of causation, their defense collapses.
  *   **Compatible:** They can admit the software had a bug. They can admit managers made mistakes. As long as they classify those mistakes as "background conditions" rather than "causes of death," their defense holds. This is underdetermined: they could admit human error in design while still denying causal responsibility for the specific death.

  **The Station Ordinance**
  *   **Required:** They must believe that civic duty exists independently of consequences. If they believed responsibility depended entirely on making a difference, the fine would be unjust when the victim was already dead.
  *   **Compatible:** They could argue the fine is for deterrence (to make sure people try next time). This is compatible with the outcome not mattering *this time*, provided it matters *on average*. The practice doesn't require them to prove this specific failure mattered, only that the rule matters.

  **The Hospital**
  *   **Required:** They must assume that staff will lie or hide errors if they feel personally blamed. The "no cause" language is required to maintain psychological safety.
  *   **Compatible:** They could admit that the delay was a "factor" without calling it a "cause." The practice is underdetermined regarding semantics. They could say "this was a necessary condition for death" without using the word "cause," though practically, they are treating it as a cause for the purpose of staffing changes.

  ### 3. Do They Hang Together?

  Logically, no. Politically, yes.

  **The Contradiction**
  If the Station Ordinance is correct—that a failure to act matters even when it changes nothing—then the Metro defense is indefensible. In the Metro cases, the failure to act *did* change something (the person died instead of living). If you are liable for a useless omission (Station), you should certainly be liable for a deadly omission (Metro). The Station view establishes that omissions have moral weight; the Metro view denies they have physical weight. You cannot consistently hold that omissions are morally potent but physically inert when it suits you.

  **The Machine vs. Human Problem**
  You asked if it matters that the metro failure is a machine's. The city wants you to think it does. They want the train to be a force of nature, like a landslide.
  But you are right to notice the programmers and managers. If the train's failure to brake is the result of human choices made months ago (to save money, to rush code, to ignore safety protocols), then the "omission" is not the train's; it is the humans'.
  *   **The Pressure Point:** The city treats the machine as a "black box" to break the chain of responsibility. If they admit the machine's omission is actually a human omission distributed over time, the Metro view collapses into the Hospital view (systemic error) or the Station view (failure to fulfill duty).
  *   **Consistency Check:** The only way to make these hang together is to say: "Humans are responsible for their own omissions (Station), and systems are responsible for learning from omissions (Hospital), but machines are not agents and therefore their omissions are not causes (Metro)." This is a convenient fiction. It treats the machine as an agent when collecting fares, but as a non-agent when killing people.

  ### 4. The Strict Counterfactual View

  Suppose the city adopted one strict rule: *Something matters only if the outcome would have been different had the action been taken.* (Philosophers often call this the "but-for" test).

  **What Each Practice Gives Up**
  *   **Metro:** They would have to admit liability. If the train had braked, the person would live. Therefore, the failure to brake matters. They lose their legal shield.
  *   **Station:** They would have to drop the fines in cases where the victim was already dead. If pressing the button changes nothing, the failure to press it matters nothing. They lose the ability to enforce civic ritual.
  *   **Hospital:** They would have to admit that delays *are* causes of death. If the delay was removed, the patient might live. Therefore, the delay caused the death. They lose the "no blame" shield.

  **Is This a Loss?**
  Yes, but it depends on what you value.
  *   **Loss of Deterrence:** The Station ordinance loses its power to train citizens to react automatically. If people know they won't be fined if the victim is already dead, they might hesitate to assess the situation, and sometimes they will be wrong about whether the victim is saveable. The rule works *because* it ignores the outcome.
  *   **Loss of Safety Culture:** The Hospital loses the trust of its staff. If every delay is legally a "cause of death," doctors will practice defensive medicine, ordering unnecessary tests to protect themselves, which harms the system overall.
  *   **Gain in Justice:** The Metro victims get recognition. The current system tells them their death was their own fault because a machine's failure is "nothing." The strict view acknowledges that the system failed them.

  ### 5. Is This Really About Causation?

  This is the most important part. No, this is not about causation. It is about **allocation of burden.**

  The word "cause" is doing heavy lifting here, but it is not describing physics. It is marking where the money comes from and who gets punished.

  *   **In the Metro:** "Not a cause" means "We do not pay."
  *   **In the Station:** "You are answerable" means "You must follow orders."
  *   **In the Hospital:** "Not a cause" means "No one gets fired."

  **What Would It Look Like Without Causal Language?**
  If the city wrote these policies honestly, without using "cause" as a shield, they would look like this:

  1.  **Metro:** "When a person dies on the track, the transit authority will not pay compensation, regardless of whether the train could have stopped. We assign the financial risk of track intrusion to the pedestrian."
  2.  **Station:** "Witnesses must press the emergency button. If you do not, you will be fined. We enforce this to maintain civic discipline, even if your action would not have saved the victim."
  3.  **Hospital:** "When a patient dies due to staffing delays, we will change our staffing models. We will not punish individual staff members, even though their delay contributed to the death."

  **What Would Break?**
  If you strip out the causal language, the manipulation becomes visible.
  *   **The Illusion of Objectivity:** Currently, the city pretends these are discoveries about how the world works ("Failures aren't events"). If they admit it's policy ("We choose not to pay"), citizens can argue against the policy. You can argue against a fact; it is harder to argue against a choice disguised as a fact.
  *   **The Moral Link:** We intuitively feel that if you cause harm, you should pay. By denying causation in the Metro cases, the city severs the link between harm and payment without admitting they are doing so. If they write it plainly, they have to justify why they should be allowed to cause harm (via non-braking) without paying for it.
  *   **The Consistency Demand:** As long as they use causal language, you can catch them in the contradiction you found. If they use policy language, they can simply say, "Different contexts require different rules." It becomes harder to charge them with inconsistency because they are no longer claiming to describe reality, only to manage risk.

  **Summary**
  The city is using "causation" as a switch. When they want to avoid liability, causation requires physical force (Metro). When they want to enforce obedience, causation requires only duty (Station). When they want to improve systems without firing staff, causation is too dangerous to name (Hospital).

  Your intuition is correct: the inconsistency is not an accident. It is a feature. They are not trying to describe how failures work; they are trying to manage who suffers when failures happen.
