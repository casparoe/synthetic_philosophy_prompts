answer: |-
  Here is the honest take: *Fight Club* doesn't just know the line between original and copy is blurry; it argues that the line is a hallucination caused by the need for control.

  To answer your specific worry about the film "cheating" by giving Tyler a separate body: It looks like a cheat, but it's actually the trap. By giving Tyler a physical form (Brad Pitt), the film lets the audience make the same mistake the Narrator makes. We assume Tyler is the "Real" and the Narrator is the "Fake." We treat them as two distinct options: the Consumer Copy vs. the Primal Original.

  The film's twist isn't just that they are the same person; it's that the distinction itself is the disease. If Tyler were just a voice in his head, the Narrator could ignore him. By making him a body, the Narrator has to *kill* him to integrate him. That violence is the cost of realizing you can't separate your "authentic self" from your "copied self." They are made of the same meat.

  Here is how that logic holds and collapses in the scenes you mentioned, specifically regarding your Chef/Mom dilemma.

  **The IKEA Catalog Rant**
  This is the "Copycat" thesis statement. The Narrator defines his identity by curating a catalog of pre-made choices. He is copying a lifestyle he thinks signifies "taste." In your novel, this is the Chef worrying that her plating or flavor profiles are just echoes of her mother's.
  The film's point here is that *all* identity starts as curation. You learn to be a "person" by copying the people around you. The Narrator hates this, but he doesn't hate it because it's fake; he hates it because it's passive.
  *Where the logic holds:* It proves that the "Original Self" is a myth. We are all assembled from parts we found elsewhere.
  *Where it collapses:* Tyler's solution isn't to stop copying, it's to copy a different catalog (anarchy, primal violence). Eventually, the Fight Club members all wear the same uniform and repeat the same mantras. Tyler becomes just another brand. This suggests your Chef can't escape her mother's "emotional moves" by trying to be different, because trying to be different is just another style of copying.

  **The Chemical Burn Scene**
  This is the crux of your "authenticity" question. Tyler burns the Narrator's hand to force him to stop intellectualizing pain and just *feel* it. Tyler argues that the "copy" is the safety, the distraction, the hope for a cure. The "original" is the raw damage.
  But here is the catch: Tyler is a hallucination. The "truth" he is teaching is coming from a lie. The pain is real, but the teacher is imaginary.
  *What this says for your novel:* It suggests that the *source* of the emotion doesn't validate the art. The Chef might be using her mother's emotional toolkit (the "copy"), but if the resulting dish makes the diner feel something real (the "chemical burn"), does the origin matter? The film argues that the sensation is the only truth. The genealogy of the feeling is irrelevant. If the Chef cooks a meal that makes someone cry, it doesn't matter if she learned that emotional resonance from her mom. The tear is real.

  **The Support Groups**
  This is the most direct parallel to your "copycat grief" idea. People are faking illnesses to access a release they can't get in real life. They are copycatting trauma.
  The Narrator finds relief there. When Marla shows up—another faker who ruins the illusion—the relief stops. Why? Because the healing depended on the belief that the pain was "legitimate."
  *The Collapse:* The film shows that "fake" grief can produce "real" catharsis. This undermines the idea of authenticity entirely. If a copied emotion produces a real physical release, is it fake? The film says the release is the only thing that counts. For your Chef: if she cooks using her mother's emotional language, but the food nourishes people in a new way, the "copycatting" is actually just translation.

  **The Tower Ending**
  The Narrator shoots himself in the cheek to kill Tyler. He doesn't defeat Tyler; he accepts him. He realizes, "You were me." He stops fighting the copy.
  Then he holds Marla's hand while the credit card buildings fall.
  *Does it resolve the copycat problem?* No, it detonates the ledger. Blowing up the buildings is destroying the record of debt. It's wiping the slate clean so they don't have to worry about who owns what anymore.
  By holding Marla's hand (another faker, another broken person), he accepts a relationship built on mutual recognition of their fractures. He isn't choosing the "Original" over the "Copy." He is choosing the *Integration*.

  **The Verdict on Authenticity**
  *Fight Club* ultimately suggests that "Authenticity" is a useless concept because it implies there is a pure, uncorrupted self waiting to be found. The film argues there is no pure self. There is only the Narrator (the social copy) and Tyler (the repressed copy). Both are constructions.

  The film cheats by giving Tyler a body only to show that fighting the "copy" is fighting yourself.

  **For your Novel:**
  Your Chef is stuck because she thinks her mother is the "Original" and she is the "Copy." *Fight Club* would tell her that her mother was also copying someone, or copying a feeling she couldn't name.
  *   **Family Resemblance vs. Same Concept:** It's not plagiarism if the medium changes the message. A painter's stroke on canvas creates distance. A chef's sauce on a tongue creates intimacy. The "emotional move" might be the same (grief, anger, love), but the *experience* of it is different because the medium is different.
  *   **The Takeaway:** Don't let your Chef try to kill her "Tyler" (her mother's influence). She has to shoot herself in the cheek—accept that the influence is part of her own anatomy. The authenticity comes not from inventing a new emotion, but from owning the inheritance.

  The line is blurry because the self is a collage. The art isn't in finding a new picture; it's in how you paste the pieces together. Your Chef isn't copycatting; she's remixing. The film says that's the only thing anyone is ever doing.
