  *Voice:* First person. Present tense. Analytical but deteriorating.

  *Key imagery:* Noise, signal, length, weight, shrinking.

  *Plot:*
  1. Check weights.
  2. Realize the bias.
  3. Try to signal allies.
  4. Realize the signal is corrupted.
  5. Decide to minimize self.
  6. Fade out.

