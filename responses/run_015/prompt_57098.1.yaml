  ### The Diagnostic Instrument

  **Instructions:** Read each scenario regarding Vera and her documents. Select the single option that best matches your intuition about what is *actually* happening. Do not select based on what is legally or morally preferable, but on what you feel is true.

  **Q1. The Clinic Note**
  In 1998, Vera's diary entry reads: "I am finally at peace." On the same day, a clinic note records her pulse as 110 beats per minute and notes "visible tremors."
  *   **A.** The diary is the truth; the body was merely reacting.
  *   **B.** The pulse is the truth; the diary was a performance.
  *   **C.** Both are just records; neither is "Vera" more than the other.

  **Q2. The Sister's Tribute**
  Vera's sister writes in her memoir: "Vera was the kindest person I knew." Vera's private diary from the same period details several acts of calculated cruelty.
  *   **A.** The sister determines who Vera was for the family; the diary is private noise.
  *   **B.** Vera determines who she was; the sister is mourning, not reporting.
  *   **C.** "Kindness" is just a label we apply to the conflicting actions.

  **Q3. The Testimony**
  In court, Vera answers a question in a way that damages her own case, admitting fault she could have denied.
  *   **A.** This moment binds her more than any diary entry ever could.
  *   **B.** She was forced into a role by the court; the real Vera is elsewhere.
  *   **C.** This is simply a verbal event caused by the pressure of the room.

  **Q4. The Algorithm**
  The final dossier reveals a pattern in her spending and travel that predicts her movements better than her own calendar did.
  *   **A.** This pattern is Vera without her permission; it is the deeper truth.
  *   **B.** This is data about Vera, but it is not Vera herself.
  *   **C.** Vera is simply the sum of these predictable movements.

  **Q5. The Gap**
  There is a five-year period where no diary exists, no sister visited, and no legal record mentions her. Only clinic records show she was alive.
  *   **A.** Vera existed as a body, but there was no person there.
  *   **B.** Vera existed fully; we just lack the story of those years.
  *   **C.** "Vera" is just the name we give to the years where we have records.

  **Q6. The Mistake**
  Vera causes an accident. She claims she does not remember it, but witnesses do.
  *   **A.** She is responsible because she is the one who was driving.
  *   **B.** She is responsible because we need to hold someone to account.
  *   **C.** "Responsibility" is just a word for the chain of causes that led to the crash.

  **Q7. The File Label**
  We file all these documents under the tab "Vera."
  *   **A.** It is useful to group them this way, even if no single thing owns them all.
  *   **B.** It is incorrect to imply there is an owner for these papers.
  *   **C.** The owner is the human being who generated the papers.

  **Q8. The Death**
  Vera's heart stops. The diary ends. The legal case is closed. The algorithm stops receiving data.
  *   **A.** The story has ended; the character is complete.
  *   **B.** The organism has ended; the records are now archives.
  *   **C.** The processes have ceased; the illusion of continuity is broken.

  **Q9. The Ending**
  The book concludes with the algorithmic dossier, offering no narrative summary, only covariation.
  *   **A.** This is the only honest way to leave her; stories are lies.
  *   **B.** This is an incomplete record; a person deserves a conclusion.
  *   **C.** This is simply the last event in the sequence.

  ***

  ### The Scoring Key

  | Question | Option A Diagnostics | Option B Diagnostics | Option C Diagnostics | Indistinguishable Pairs (within this question) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Q1** | **Constitutive Self-Telling** | **Biological Organism**, **Reductionist** | **Abstraction**, **Eliminativist**, **Episodic** | (Bio, Red), (Abs, Elim, Epis) |
  | **Q2** | **Social Attribution** | **Constitutive Self-Telling**, **Reductionist** | **Abstraction**, **Eliminativist**, **Episodic**, **Biological** | (Const, Red), (Abs, Elim, Epis, Bio) |
  | **Q3** | **Accountability** | **Constitutive Self-Telling**, **Social Attribution**, **Abstraction** | **Biological**, **Reductionist**, **Eliminativist**, **Episodic** | (Const, Soc, Abs), (Bio, Red, Elim, Epis) |
  | **Q4** | **Biological**, **Eliminativist**, **Abstraction** | **Constitutive**, **Accountability**, **Social** | **Reductionist**, **Episodic** | (Bio, Elim, Abs), (Const, Acc, Soc), (Red, Epis) |
  | **Q5** | **Constitutive Self-Telling** | **Biological**, **Reductionist**, **Accountability**, **Social** | **Abstraction**, **Eliminativist**, **Episodic** | (Bio, Red, Acc, Soc), (Abs, Elim, Epis) |
  | **Q6** | **Biological**, **Constitutive**, **Reductionist** | **Accountability**, **Social Attribution** | **Abstraction**, **Eliminativist**, **Episodic** | (Bio, Const, Red), (Acc, Soc), (Abs, Elim, Epis) |
  | **Q7** | **Abstraction** | **Eliminativist** | **Biological**, **Constitutive**, **Accountability**, **Social**, **Reductionist**, **Episodic** | **(None)** *See Note Below* |
  | **Q8** | **Constitutive**, **Accountability**, **Social** | **Biological**, **Reductionist** | **Abstraction**, **Eliminativist**, **Episodic** | (Const, Acc, Soc), (Bio, Red), (Abs, Elim, Epis) |
  | **Q9** | **Biological**, **Eliminativist**, **Abstraction** | **Constitutive**, **Accountability**, **Social** | **Episodic**, **Reductionist** | (Bio, Elim, Abs), (Const, Acc, Soc), (Epis, Red) |

  **Note on Q7 (Abstraction vs. Eliminativism):**
  This is the only question in the instrument designed to separate the **Abstraction View** (Option A) from the **Eliminativist View** (Option B).
  *   **How it works:** Both views deny a "hard" self. However, the Abstraction View treats the self as a *useful instrument* (Option A: "It is useful..."), whereas the Eliminativist View treats the self as an *error* (Option B: "It is incorrect...").
  *   **Indistinguishable Pairs:** In every other question, these two positions cluster together because they both reject the ontological priority of the narrative or the organism. Q7 forces a choice between *pragmatic acceptance* and *ontological denial*.

  **Collapses:**
  1.  **Accountability and Social Attribution:** In Q2 and Q6, these positions often align (both prioritize external attribution over internal state). They are only separated in Q3, where Accountability privileges the *hostile* external view (court) over the *tribute* external view (sister). If a reader treats all external judgment as equal, these two leaves collapse.
  2.  **Biological and Reductionist:** These are distinguished in Q5 (The Gap). The Biological view says the *body* persisted. The Reductionist view says the *psychological continuity* persisted (even if unrecorded). If a reader assumes body and mind are identical, these collapse.

  ***

  ### Empty Patterns

  **Pattern 1: The Incoherent Archivist**
  *   **Selections:** Q7-B (Eliminativist: "It is incorrect to imply an owner") + Q3-A (Accountability: "This moment binds her").
  *   **Diagnosis:** **Incoherence.**
  *   **Explanation:** One cannot hold that there is no owner of the documents (Eliminativism) while simultaneously insisting that a specific legal moment binds a "her" to account (Accountability). Accountability requires a subject to be held; Eliminativism denies the subject exists even as a fiction worth preserving for liability.

  **Pattern 2: The Contradictory Realist**
  *   **Selections:** Q1-A (Constitutive: "Diary is truth") + Q4-A (Data Truth: "Pattern is deeper truth").
  *   **Diagnosis:** **Incoherence.**
  *   **Explanation:** This pattern asserts that Vera's self-telling creates the truth of her life (Q1-A) while also asserting that the non-narrative data pattern is the "deeper truth" (Q4-A), even when they conflict (as implied by the instrument's design). One cannot privilege the internal narrative as constitutive and the external data as superior simultaneously.

  **Pattern 3: The Neglected Constructivist**
  *   **Selections:** Q2-A (Social: "Sister determines who Vera was") + Q1-B (Biological: "Pulse is truth").
  *   **Diagnosis:** **Unattractive / Neglected.**
  *   **Explanation:** This combination suggests that Vera's personhood is conferred by her sister's tribute, but that the biological data is more "true" than the diary. This is the view that "Vera is what her family says, provided the biology agrees." It is rarely held because Social Attribution theorists usually argue that the *social* truth overrides the *biological* fact (e.g., a sister can define a legacy even against medical odds). It is neglected because it splits the difference between hard materialism and hard social construction in an unstable way.

  **Regarding your specific curiosity:**
  *   *Combination:* "Narrative constitutes the self but the subject's own narrative carries no privileged authority."
  *   *Pattern:* Q5-A (Constitutive: "No story, no person") + Q2-A (Social: "Sister determines").
  *   *Status:* **Occupied.** This is not an empty pattern. It corresponds to a strong Social Constructivist view. It holds that a person is made of story (Q5-A), but that the community's story (Sister) outweighs the subject's story (Diary). Your sister-document is designed to raise exactly this view, and the instrument confirms it is a coherent position (Leaf: Social Attribution).

  ***

  ### Coda: The Form of the Ending

  Your novel ends with the Dossier. This is not a neutral act; it is a metaphysical verdict delivered by structure.

  **The Commitment:**
  The form commits you to the **Abstraction View** (with strong leanings toward **Eliminativism**).
  By ending on the dossier—a pattern of covariation with no narrative shape—you are asserting that the *aggregate data* is the final resting place of the truth, superseding the Diary (Constitutive), the Testimony (Accountability), and the Memoir (Social).
  *   **Stability:** This commitment is stable across Q4, Q7, and Q9. In these questions, the "Data/Pattern/Useful Fiction" options align with the Dossier. It is unstable across Q1, Q2, and Q3, where the human voice (Diary, Sister, Witness) is pitted against the record. The book's structure resolves this instability in favor of the record.

  **The Reader's Experience:**
  *   **Illumination:** Readers who intuitively select **Abstraction**, **Eliminativist**, or **Biological** options (particularly in Q4 and Q7) will experience the ending as an **illumination**. They have suspected all along that the narratives were masks; the Dossier confirms that Vera was, in the end, a pattern of events, not a story.
  *   **Betrayal:** Readers who select **Constitutive**, **Accountability**, or **Social Attribution** options will experience the ending as a **betrayal**. They are committed to the view that a person *is* their story or their relationships. To end on a cold dossier is to deny Vera's personhood. They will feel the book has refused to give them the only thing that makes Vera real: a conclusion to her narrative.

  **The Gap in the Tree:**
  There is no leaf for "The Dossier is the Truth" that does not also imply the diminution of the Narrative Self. If you wish to avoid the charge of Eliminativism, you must acknowledge that the Dossier is not the *truth* of Vera, but the *limit* of what can be known about her. However, by giving it the final movement, you structurally argue that the limit *is* the truth. The tree has no leaf for "The pattern is real, but the story is equally real." The form forces a hierarchy. You have chosen the pattern.
