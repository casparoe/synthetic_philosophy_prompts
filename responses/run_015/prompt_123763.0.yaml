      *   *The "Floating Man" Location:* Primarily in *al-Ishārāt wa-l-Tanbīhāt* (Remarks and Admonitions), Namat 5 (On the Soul). Also in *al-Shifāʾ* (The Healing).
      *   *Scholarly Debate:*
          *   Traditional/Thomistic reading: Substance dualism (soul can exist without body).
          *   Modern/Phenomenological reading (e.g., Hasse, Black, Gutas): Epistemic immediacy, not necessarily ontological independence *in this life*. Avicenna is an Aristotelian hylomorphist generally; the soul is the perfection of the body. Separation happens *after* death, but the argument establishes *identity*, not necessarily independent *subsistence* in the current state.
