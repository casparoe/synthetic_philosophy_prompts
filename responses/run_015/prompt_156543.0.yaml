answer: |-
  ### Brainstorming Candidate Commitments

  To reconstruct the rationality of this practice, we must isolate its normative spine. I consider ten candidate commitments implicit in the behaviour described.

  1.  **Straightforward Expected Value Maximisation:** Agents believe the point estimate equals the true expected utility. (Reject: They admit huge uncertainty; believing the point estimate is true would be epistemically vicious.)
  2.  **Epistemic Humility as Heuristic:** The point estimate is a coordination tool, not a truth claim. (Accept: Explains publishing precision despite admitted uncertainty.)
  3.  **Ambiguity Aversion:** Agents prefer known risks to unknown uncertainties. (Accept: Explains the cluelessness haircut.)
  4.  **Value Commensurability:** All outcomes can be summed into a single metric. (Accept: Required for the headline figure.)
  5.  **Epistemic Discounting:** Future effects are discounted due to uncertainty, not time preference. (Accept: Explains why distant causal chains are trimmed.)
  6.  **Satisficing:** Agents seek "good enough" outcomes, not the best. (Reject: They rank and recommend the top, implying maximisation.)
  7.  **Moral Realism about Magnitudes:** Magnitudes exist objectively even if unknown. (Reject: Compatible, but does not explain the haircut versus ranking tension.)
  8.  **Institutional Liability Protection:** The haircut protects against blame for unforeseen harms. (Reject: Explains psychology, not normative rationality.)
  9.  **Separation of Criterion and Procedure:** Rightness is consequentialist; action follows heuristics. (Accept: Resolves the cluelessness objection.)
  10. **Imprecise Credences are Action-Guiding:** The interval matters more than the mean. (Reject: They mostly act on the mean, though some propose the lower bound.)

  I reject candidates 1, 6, and 8. Candidate 1 is incompatible with the admitted uncertainty; candidate 6 contradicts the ranking practice; candidate 8 explains motivation but not rational structure. I commit to candidates 2, 3, 4, and 9 as the core explanatory framework.

  ### Reconstruction of Practical Rationality

  The practice presupposes a hybrid theory of rational choice. It looks like **expected utility maximisation**—choosing the option with the highest weighted sum of outcomes—but modifies it to handle **ambiguity**, where probabilities themselves are uncertain. The "cluelessness haircut" is not a departure from expected value reasoning but a correction for model uncertainty. By discounting distant causal chains, evaluators treat the probability of their model being correct as decaying over causal distance. Thus, the point estimate is not a claim about the world's precise structure but a **sufficient statistic** for coordination under uncertainty.

  This resolves the epistemic objection to consequentialism—the claim that we cannot know consequences well enough to act. The practice adopts a **consequentialist criterion of rightness** (an act is right if it produces the best outcomes) but employs a **non-consequentialist decision procedure** (follow rules or heuristics rather than calculating every consequence). This combination is coherent: the procedure is justified *because* it reliably tracks the criterion under conditions of **outcome-cluelessness**. The practice needs this separation; without it, the admission of massive uncertainty would paralyse action.

  Regarding **weighting-cluelessness**, the practice presupposes that values are **commensurable**—that health, life, and existence can be aggregated into a single number (e.g., health-adjusted life years). This is a heavier load-bearing assumption than outcome uncertainty. The headline figure assumes we know *how* to weigh a life saved against a dollar spent, even if we are unsure *how many* lives are saved. Cluelessness lives primarily in our evidence about the world, not in the values themselves, though the single number masks the ethical contestation inherent in aggregation.

  ### Competing Theories and Discriminating Observations

  Three distinct theories license this behaviour. First, a **Permissivist-Bayesian** view holds that any precise credence within a wide range is rational; the point estimate is simply one permissible precisification. Second, an **Imprecise-Credence** view holds that rational agents hold sets of probabilities; the point estimate is a pragmatic collapse of this set for decision-making. Third, a **Rule-Consequentialist** view holds that following the rule "maximise the headline figure" produces better outcomes than attempting complex calculations.

  We can discriminate these by observing how the community handles conflicting models. If they average conflicting models into a wider interval without changing the mean, they lean Imprecise. If they treat the point estimate as fixed despite model conflict, they lean Permissivist. If they abandon the estimate when the rule causes systemic failure, they lean Rule-Consequentialist. Currently, the practice is philosophically underdetermined between these views.

  ### The Inconsistency of Long-Term Claims

  The tension between discounting distant aid effects (move 2) and confident long-term claims elsewhere (move 5) is resolvable if the distinction is based on **feedback tractability**, not time. Aid interventions operate in complex social systems where feedback loops are opaque and effects decay. Existential risk interventions often involve binary outcomes (extinction or not) with more stable physical models. The principled line is not temporal distance but **model stability**. The Lower-Bound Rule (move 4) helps here by formalising ambiguity aversion, but it smuggles in a **Maxmin** decision rule (maximise the minimum gain) that conflicts with the expected value maximisation of move 3. The practice is inconsistent unless it specifies that the Lower-Bound Rule applies only when model stability is low.

  ### Implications of Deep Cluelessness

  If we took the strongest cluelessness worry seriously—where imprecise credences and incommensurability negate expected value—the practice must change. Evaluators would stop publishing point estimates. Instead, they would publish **confidence intervals** and **model sensitivity analyses**. Money would move towards **diversification** across cause areas rather than concentration on the top rank, **buying information** to reduce uncertainty, and funding **meta-level research** to improve evaluation methods. They would prioritise **option value**—keeping future choices open—over immediate impact. This would still count as doing good, but it would look less like optimisation and more like robust portfolio management.

  ### Weakest Link

  The weakest link in this reconstruction is the assumption that **sign confidence** (move 1) is possible without magnitude confidence. It is plausible that if uncertainty is large enough to obscure magnitude, it also obscures direction (whether the intervention helps or harms). If an observation showed that interventions with high magnitude uncertainty systematically reversed sign in follow-up studies, the claim that we can know the sign without the magnitude would collapse, undermining the entire justification for acting on the point estimate.

