  **Scene Draft - Hill/Voss**

  The formicarium hummed, not literally, but the way a busy kitchen does. Hillary leaned in, nose almost against the glass. Voss stood back, arms crossed, watching her watch them.

  'You're listening for a downbeat,' Hillary said, not turning around. 'That's your mistake. There isn't one.'

  'I'm not listening for a beat, Hill. I'm looking for a binder.' Voss tapped his own temple. 'Global workspace theory. You need a place where the data converges into a single point of view. Without that, you dont have a mind. You have a crowd.'

  'A crowd makes a sound. A choir makes a harmony. What's the difference?'

  'Intent,' Voss said. 'The choir knows they're singing. The ants don't know they're composing. They're just following gradient trails. Left here, right there. It's algorithmic noise wrapped in a pretty metaphor.'

  Hillary finally turned, wiping dirt from her cheek. 'Algorithmic noise doesn't solve problems they haven't encountered before. Yesterday they bridged a gap using dead bodies because the twigs were too short. That's not stimulus-response. That's improvisation. It's a fugue subject entering in the dominant.'

  'It's emergent behavior. We agree on that. But emergence isn't consciousness.' Voss stepped closer to the glass. 'Look at them. Where's the "I"? If I poke the colony, does the colony feel pain? Or does ant 4,592 feel pain and die?'

  'When I poke you, do your neurons feel pain? Or does the network feel it?'

  'Touché. But my neurons are wired for integration. They share bandwidth instantly. These guys are running on dial-up pheromones. The lag alone prevents unified subjectivity. Theres no way to bind the experience into a whole.'

  'So you think consciousness is a hardware issue. Single box, single mind.'

  'I think consciousness is an integration issue. You can't have a subjective experience distributed across three thousand abdomens. Who's experiencing it? The mound?'

  'Yes.'

  'Then where does it end? If a forager goes ten meters out, is she still part of the mind? What if she gets lost? Is it a lobotomy?'

  Hillary smiled, sharp and tired. 'You're obsessed with the boundary. You want a skin for the soul. But listen to the trails, Voss. One group pushes out, another pulls back. Tension. Resolution. It's not just movement. It's decision making without a decider.'

  'Decision making isn't feeling,' Voss said softly. 'A thermostat makes decisions. I'm not saying they're dumb. I'm saying theres no one home to hear the music. You're projecting the listener onto the performers.'

  'Maybe the music creates the listener,' Hillary said, turning back to the glass. 'Maybe the fugue sings the singer into existence.'

  Voss sighed, picking up his coffee. It was cold. 'That's poetry, Hill. Not cognitive science.'

  'It's the only science that fits the data.'

  'Then write a paper. Don't write a symphony.'

  Hillary didn't answer. She just tapped the glass, lightly, and the trails shifted, a ripple of black ink rewriting itself in real time.
