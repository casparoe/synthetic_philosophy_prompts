      *   *Scenario:* A bone structure selected for support (A) now vibrates to make sound (B). The support function is vestigial (other bones do it), but the vibration structure remains.
      *   *Etiology:* Function = Support. Vibration = Accident. If it stops vibrating, no malfunction. If it stops supporting (even if irrelevant), technically malfunction.
      *   *Causal Role:* Function = Vibration (relative to auditory system). Function = Support (relative to skeletal system). If it stops vibrating, it fails the auditory capacity.
      *   *The Grip:* Etiology can't call failure to vibrate a "malfunction" yet. Causal Role can, but can't explain *why* it matters biologically vs. arbitrarily.

  9.  **Final Polish:** Ensure the distinction between "Proper Function" (Millikan) and "Selected Effect" (Neander) is acknowledged but kept tight so as not to bog down. Focus on the *normative grip*. The user wants to know where the "ought" comes from in the transition period.

      *(Self-Correction during drafting)*: I need to be careful not to dismiss Cummins too easily. Cummins *does* have a notion of malfunction relative to a capacity analysis. But the user is right that it lacks the *biological* normative bite (the "good for the organism" aspect). I need to emphasize that Cummins's malfunction is analytic, whereas Wright's is teleological.

      *(Refining the "Decoupled Mediation")*: The user describes a case where the *original mechanism* is vestigial *except* for the side channel. This implies the trait is being maintained *by* the side channel now, but selection hasn't "recorded" it yet. This is the crucial evolutionary lag.

      *Let's structure the response to hit the "Fault Line" hard.* The fault line is **The Source of Normativity**. Is it the Past (History) or the Present (Organization)?

      *Wait, one more thing:* The user asks if we are "talking past each other." I should argue that they are distinct concepts (Ambiguity Thesis) but that the *Decoupled Mediation* case shows why we need a unified theory of *Biological* Normativity, which leads to the Organizational Account.

