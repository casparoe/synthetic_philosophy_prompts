answer: |-
  This is a classic objection to Russell, often associated with P.F. Strawson (though Strawson's own solution was different). It feels compelling because it appeals to a fundamental law of logic: the Law of Excluded Middle (a statement and its negation cannot both be false).

  You are right to feel the slip is between (5) and (6). However, to save Russell's theory (and keep premise 1, as you prefer), you actually need to reject **Step (3)**.

  Here is the breakdown of why Step (3) is the failure point, how Russell escapes the trap, and what it costs you to accept his solution.

  ### The Flaw: Ambiguity of Negation (Scope)

  Russell's theory relies on a distinction that natural language often hides: the **scope of the negation**.

  When you say, "The present King of France is not bald," Russell argues this sentence is ambiguous. It can be parsed in two logically distinct ways:

  **Reading A: Primary Occurrence (Wide Scope)**
  > "There is exactly one present King of France, and he is **not bald**."
  > *Logical Form:* $\exists x (Kx \land \forall y(Ky \rightarrow y=x) \land \neg Bx)$
  > *Truth Value:* **False** (because there is no King).
  > *This is the reading your argument uses in Step (3).*

  **Reading B: Secondary Occurrence (Narrow Scope)**
  > "It is **not the case that** [there is exactly one present King of France and he is bald]."
  > *Logical Form:* $\neg \exists x (Kx \land \forall y(Ky \rightarrow y=x) \land Bx)$
  > *Truth Value:* **True** (because it is indeed not the case that there is a bald King).

  ### Where the Argument Fails

  The argument you presented commits an equivocation fallacy. It switches between these two readings without noticing.

  1.  **To get Step (5)** ("Both are false"), you must assume **Reading A** for the negative sentence. If "The King is not bald" means "There is a King and he is non-bald," then yes, it is false.
  2.  **To get Step (6)** ("They are contradictories"), you must assume **Reading B**. Two sentences are contradictories only if one is $P$ and the other is $\neg P$.
      *   Sentence 1: $P$ ("There is a King and he is bald")
      *   Sentence 2 (Reading A): $Q$ ("There is a King and he is non-bald")
      *   Sentence 2 (Reading B): $\neg P$ ("It is not the case that there is a King and he is bald")

  $P$ and $Q$ are **contraries**. Contraries cannot both be *true*, but they **can both be false**. (Example: "The ball is all red" and "The ball is all blue." If the ball is green, both are false).

  $P$ and $\neg P$ are **contradictories**. They cannot both be false.

  **The Verdict:**
  *   If you interpret the negative sentence as Reading A, Step (5) is correct, but Step (6) is wrong (they are contraries, not contradictories).
  *   If you interpret the negative sentence as Reading B, Step (6) is correct, but Step (5) is wrong (the negative sentence is true).

  Therefore, **Step (3)** is rejected because it presents Reading A as the *only* analysis, ignoring Reading B which is required for the logical relation in Step (6) to hold.

  ### What Does It Cost to Reject (3)?

  You mentioned you'd rather keep (1) than (6). Keeping (1) means sticking with Russell. Here is the price you pay for that:

  **1. Linguistic Counter-Intuitiveness**
  You have to accept that in ordinary conversation, if someone says "The King of France is not bald," they are usually speaking falsely (or strangely), but logically, the sentence *can* be true.
  Russell forces you to admit that "The King of France is not bald" is technically **true** (on Reading B), even though no King exists. This feels weird. Most people feel that saying "The King is not bald" implies there *is* a King. Russell says that implication is a pragmatic confusion, not a logical necessity.

  **2. Loss of Surface Grammar**
  You have to accept that the surface structure of English sentences does not match their logical form.
  *   Surface: "The King [is not bald]." (Subject-Predicate)
  *   Logical: "It is not the case that [The King is bald]." (Negation of a Proposition)
  You pay the cost of saying natural language is misleading and requires logical translation to reveal its true truth conditions.

  **3. The Strawson Alternative (The Cost of Rejecting Russell)**
  If you find this cost too high—if you feel that "The King of France is not bald" *should* be false (or truth-valueless) because there is no King—you have to reject Russell's (1).
  This leads you to **Strawson's Theory of Presupposition**.
  *   Strawson says: "The King of France is bald" presupposes existence. If the presupposition fails, the sentence is neither true nor false.
  *   Strawson says: "The King of France is not bald" carries the same presupposition. It is also neither true nor false.
  *   **Cost:** You lose the Law of Bivalence (every sentence is true or false). You introduce "truth-value gaps."

  ### Summary

  Since you want to keep (1), you must defend Russell.
  *   **Reject Step (3).** It ignores the scope distinction.
  *   **Accept that "The King is not bald" is ambiguous.**
  *   **Accept that on the reading where they are contradictories (Narrow Scope), the negative sentence is True.**
  *   **Accept that on the reading where the negative sentence is False (Wide Scope), they are merely contraries.**

  The argument fails because it tries to treat the negative sentence as having the truth conditions of the Wide Scope reading but the logical relationship of the Narrow Scope reading. You can't have it both ways.
