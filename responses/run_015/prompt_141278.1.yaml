  7.  **Final Polish:** Check tone. Avoid condescension. Acknowledge the sophistication of the question while dismantling the proposed solution. (Self-Correction: Make sure I don't sound like the supervisor. Be constructive.)

      *Key insight to emphasize:* The bias isn't an obstacle to the history; it *is* the history of the event's aftermath, which constrains the reconstruction of the event itself. The "pacification commission's findings" are not just lies; they are *actions* that shaped the reality.

  8.  **Final Review against constraints:** No reading lists. Want the argument. Address both problems.

      *(Self-Correction during drafting)*: I need to be careful not to just say "qualitative is better." I need to explain *why* the quantitative approach fails epistemologically. It treats bias as random error; bias is systematic.

      *(Refining the Confederate point)*: The Confederate example shows that political power $\neq$ narrative power long-term. But in the immediate aftermath (1849-1850s), the Habsburg state had absolute narrative control. The memoirs come later. The time lag matters.

      *(Final Plan)*:
      1.  Kill $\lambda$. Explain why (bias is systematic, not random; truth isn't a weighted average).
      2.  Propose "Triangulation via Incentive."
