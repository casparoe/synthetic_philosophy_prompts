  Hi there,

  This is a fascinating puzzle because Sanne clearly operates with a high-resolution ethical map that most people don't bother to draw, and you are right to sense that the standard cultural stereotypes about Dutch bluntness or Japanese tatemae are too low-resolution to capture her specific logic. Having looked closely at the track record you provided, I am confident that neither of your proposed rules is the exact engine driving her verdicts, though one is significantly closer than the other. The Refusal Test fails on the hard cases. If Sanne believed she could lie wherever she had a right to remain silent, she would be comfortable lying to the stranger on the train, since she owes that person nothing, yet she finds that unacceptable. She would also be comfortable lying to her husband about the lunch tension, since she could theoretically refuse to discuss her day, yet she finds that unacceptable and even heated. The Refusal Test is too permissive for her; she imposes truth duties even where she has a right to silence. The Gesture Rule is much closer, as it correctly identifies that she permits lies where the exchange is ritualistic, like the dinner compliment or the baby comment, and forbids them where the exchange is functional, like the boss deadline or the train seat. However, the Gesture Rule stumbles on the case of her own mother. Asking whether she is eating properly is an information transfer, not a friendly noise, yet Sanne permits the lie there. If she were strictly following the Gesture Rule, she would owe her mother the truth just as she owes her boss the truth, but she does not.

  The rule she is actually running, which explains the Mother exception and the Train restriction better than either of your options, is what I would call the Stewardship of Agency. Her principle is that you owe the truth whenever the listener needs that information to exercise agency over their own life or shared reality, but you are permitted to lie when the truth serves only to wound without empowering, or when the lie protects a boundary that preserves your own agency. This is why lying to the boss is forbidden, because he needs the truth to manage workflow, and lying to the husband is forbidden, because they need a shared reality to function as a team. It is why lying to the stranger is forbidden, because it unfairly restricts their access to a public resource. But it is why lying to the mother is permitted, because the mother cannot act on the information to force her to eat, so the lie protects Sanne's autonomy without harming her mother's agency. It is also why the dinner compliment and baby compliment are fine, because acting on those lies changes nothing of consequence. This rule fits every verdict you listed, including the outlier of her mother, and it aligns with her refusal to critique the haircut, which is an assertion of agency where none was requested.

  Applying this to the dinner scenario with Aya, Sanne would reject the first option immediately because telling Aya the resumé is great deprives Aya of the agency to fix the format error, directly harming her job prospects. She would also likely reject the third option, not because it is untrue, but because delivering it in front of the whole family would shame Aya, which is a harm that outweighs the immediate truth delivery. Sanne would choose the middle option, saying that Aya's experience is strong and proposing they sit down to go through it together. This is not a lie with extra steps, provided she intends to have that conversation, because it is a truthful statement of Aya's value paired with a deferred delivery of the technical critique. The audience does not change what Sanne owes Aya, which is the truth about the resumé, but it does change when she pays that debt. She owes Aya the truth because Aya asked for expertise, but she owes Aya dignity because they are family, so she times the payment to avoid public humiliation. This fits the Stewardship rule perfectly because it preserves Aya's agency to fix the CV while protecting her social standing.

  To settle definitively between the Gesture Rule and this Stewardship of Agency rule, you should present her with a case where social ritual and consequential agency diverge. Ask her what she would do if a close friend showed her a poem and asked if she liked it, intending to submit it to a contest with a non-refundable entry fee. The Gesture Rule suggests this is a request for support, where a white lie is permissible to encourage the friend. The Stewardship Rule suggests this is a request for information that will determine a financial and professional outcome, where the truth is required to prevent harm. If Sanne says she must tell the truth about the poem's quality, she is running the Stewardship rule. If she says she should offer encouragement regardless of quality, she is running the Gesture rule. Given her history with the boss and the train, I suspect she will say the friend deserves the truth, confirming that for Sanne, honesty is ultimately about respecting the other person's capacity to navigate reality, not just about managing social friction.

