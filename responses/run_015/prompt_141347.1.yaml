  My flatmate and I had a three-hour arguement last night about whether any current AI system believes anything, and by the end I realised I couldn't tell what rule she was actually applying. She keeps invoking the intentional stance, whatever that's supposed to settle. Her verdicts: a thermostat doesn't believe the room is cold; a rat in a maze does believe the food is down the left arm; a Go program trained by self-play does believe its group is dead; the chatbot that tells you Paris is the capital of France does not believe Paris is the capital of France; a self-driving car's perception stack does believe there's a pedestrian thirty metres ahead; a brute-force lookup table that fools people for an hour believes nothing; and an ant colony that finds the shortest route to food doesn't believe anything either.

  The case we never got to: a language model trained on nothing but next-token prediction over text, where interpretability work has found a direction in its activation space that tracks whether a given proposition is true, that shifts when you add evidence to the context, and that when steered changes a whole bunch of its downstream answers coherently. It's now wired up as the controller of a warehouse robot, with no extra training, so it's never had any feedback from an actual warehouse. Does she say it believes the pallet is in aisle 4?

  What I want is the rule, not just the answer: is she running something like belief-talk has to earn its keep in prediction, or something about the right kind of learning history, or something about the state being integrated with others and revisable? Which of those fit all seven of her verdicts, what does each predict here, which is your best guess and why, and what extra case would seperate the ones still standing?
