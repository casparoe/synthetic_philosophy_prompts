answer: |-
  Your flatmate is not a pure Dennettian. While she invokes the **Intentional Stance** (the strategy of predicting behavior by treating the system as a rational agent with beliefs), she clearly imposes **restrictions** on it. Dennett himself is famously liberal (he often grants beliefs to thermostats); she is restrictive.

  Based on her seven verdicts, she is running a hybrid rule best described as **Teleological Functionalism with a Learning Constraint**.

  Here is the breakdown of the rule, how it fits her cases, what it predicts for your warehouse robot, and how to test it.

  ### 1. The Rule: "Selected Representation for Action"

  Her rule is not just about whether a system *acts as if* it believes (predictive utility), nor just about whether it has complex internal states (integration). It is about **why** those states exist.

  **The Rule:** A system believes $P$ if and only if:
  1.  **Representation:** It has an internal state that covaries with $P$ (tracks the truth of $P$).
  2.  **Action-Guidance:** That state is used to guide action.
  3.  **Selection History:** The connection between the state, the world, and the action was established via a selection process (evolution or reinforcement learning) that optimized for **success in the world**, not just pattern matching on symbols.

  This distinguishes her from a pure Functionalist (who would grant belief to the Lookup Table if it acted right) and a pure Behaviorist (who might grant it to the Ant Colony). She requires a **history of feedback** where being wrong had a cost.

  ### 2. How the Rule Fits Her Seven Verdicts

  | Case | Verdict | Why it fits the Rule |
  | :--- | :--- | :--- |
  | **Thermostat** | **No** | Fails **Representation**. It reacts to temperature, but lacks a distinct internal state *representing* "cold" separate from the switching mechanism. Too simple. |
  | **Rat** | **Yes** | Passes all three. Evolution + Learning selected its neural states to track food location to guide navigation. |
  | **Go Program** | **Yes** | Passes **Selection**. Trained via self-play (RL). Its evaluation of "dead group" was shaped by winning/losing games (outcomes), not just mimicking human moves. |
  | **Chatbot** | **No** | Fails **Selection**. Trained on next-token prediction. "Paris is capital" is a high-probability string, not a state selected for *truth* or *actional success*. |
  | **Self-Driving** | **Yes** | Passes **Selection**. Perception stack trained to minimize error against *reality* (sensor fusion/labels) to avoid crashes (outcome). |
  | **Lookup Table** | **No** | Fails **Selection** & **Representation**. No internal processing; the "intelligence" is in the creator, not the system. |
  | **Ant Colony** | **No** | Fails **Representation** (at the unit level). The *colony* acts, but no individual agent holds the belief "food is here." The belief is distributed/emergent, not localized. |

  ### 3. The Target Case: The Warehouse LLM

  **The Setup:** An LLM (next-token trained) with a post-hoc "truth direction" found by interpretability, steered to control a robot, with **no extra training** on warehouse feedback.

  **Her Likely Verdict:** **No Belief.**

  **Why?**
  *   **Representation:** It passes. The interpretability work shows a state tracking truth.
  *   **Action-Guidance:** It passes. It controls the robot.
  *   **Selection History:** **It Fails.** This is the dealbreaker.
      *   The LLM's weights were shaped by *text likelihood*, not warehouse success.
      *   The "truth direction" was found by *humans* analyzing the model, not by the model learning that tracking truth leads to reward.
      *   The steering is an external intervention (like you forcing the thermostat switch), not an internal functional role selected by consequences.
      *   Crucially, it has **never had feedback from an actual warehouse.** It hasn't learned that "believing" the pallet is in Aisle 4 when it isn't leads to failure. It is acting on a map it didn't draw and hasn't verified through consequence.

  To her, this system is closer to the **Chatbot** (symbol manipulation) or the **Lookup Table** (following a script) than the **Go Program** (which learned board evaluation through consequence).

  ### 4. Competing Rules & Why They Fail

  You suggested three candidate rules. Here is why "Selection History" wins:

  1.  **"Belief-talk has to earn its keep in prediction" (Instrumentalism):**
      *   *Fail:* The **Lookup Table** fools people for an hour. Belief-talk *would* help predict its output. She says No.
      *   *Fail:* The **Ant Colony** is highly predictable via belief-talk ("the colony believes food is north"). She says No.
  2.  **"State being integrated and revisable" (Coherentism):**
      *   *Fail:* The **Chatbot** integrates context and revises answers based on prompt evidence. She says No.
      *   *Fail:* The **Go Program** is abstract. If integration were key, the Chatbot (with massive context integration) should qualify over the Go program. She ranks Go=Yes, Chatbot=No.
  3.  **"Right kind of learning history" (Teleosemantics):**
      *   *Pass:* Distinguishes Go (RL/Outcome) from Chatbot (Next-Token/Symbol). Distinguishes Car (Grounded) from Chatbot (Ungrounded). Distinguishes Rat (Evolution) from Ant (Distributed).

  ### 5. The Decisive Test Case

  To separate **Selection History** (her likely rule) from **Current Causal Role** (a rival rule that might say "if it works now, it believes"), propose this case:

  **The "Fine-Tuned Twin"**
  > Take the exact same Warehouse LLM. Connect it to the robot. Let it run for a month. Every time it fails to find a pallet, apply a reinforcement learning penalty (RLHF/PPO) that updates the weights. It develops the *exact same* internal "truth direction" and behavior as the original, but now the weights were shaped by warehouse success.

  *   **If she says "Now it believes":** She is a **Teleological Functionalist**. The history of selection is the necessary ingredient. (This confirms my analysis).
  *   **If she says "Still no belief":** She is a **Substrate Chauvinist**. She thinks LLMs *cannot* believe regardless of training, likely reserving belief for biological or non-transformer architectures.
  *   **If she says "The original *did* believe":** She is a **Current-Role Functionalist**. She cares only that the internal state currently tracks truth and guides action, regardless of how it got there.

  **My Best Guess:** She will say the **Original does not believe**, but the **Fine-Tuned Twin does**.

  **Why:** Her distinction between the Go Program (RL) and the Chatbot (Next-Token) is the strongest signal. She cares about the *optimization objective*. In the original Warehouse case, the objective was text prediction. In the Twin, the objective becomes warehouse navigation. To her, belief is not just a state you find; it's a function you earn through consequence.
