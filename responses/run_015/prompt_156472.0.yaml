  6.  **Identifying the "Must Land" Reply:**
      *   It has to be the Structural vs. Felt distinction. If that goes, the Co-op case collapses, and the separation from Exploitation collapses.

  7.  **Identifying the "Hope Nobody Asks" Question:**
      *   Usually the one that exposes the normative foundation. "Why is control the *ultimate* value?" or "What replaces Species-Being?"

  8.  **Identifying the Weak Spot:**
      *   The user says they drop essentialism but keep a normative claim about control. Where does the normativity come from? This is the "Freestanding" problem.

  9.  **Review against Constraints:**
