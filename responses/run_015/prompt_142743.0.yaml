answer: |-
  ### Part 1: The Case Questions

  **1. The Botched Talk**
  You spend weeks preparing a presentation. On the day, the projector fails, the audience is hostile, and you stumble over your words. Afterwards, a colleague asks what went wrong. What do you say?
  *   A) "I didn't manage the room or the tech well enough."
  *   B) "The delivery was bad, but I prepared with integrity."
  *   C) "It doesn't matter; their reaction isn't my business."

  **2. The Drinking Friend**
  You confront a close friend about their drinking. They promise to stop but relapse a week later. Do you feel you failed them?
  *   A) "Yes, if I'd been more persuasive or supportive, they'd be sober."
  *   B) "No, I spoke the truth; what they do with it is theirs."
  *   C) "Partially. We share the burden of their recovery."

  **3. The Losing Campaign**
  You are organizing for a policy change that polls suggest has less than a 5% chance of passing. Why show up to the rally?
  *   A) "Because if we don't, the 5% becomes 0%."
  *   B) "To bear witness to what is right, regardless of the vote."
  *   C) "It's probably a waste of time unless we can guarantee a win."

  **4. The Medical Wait**
  You are waiting for a scan result that could be serious. You feel a tightness in your chest. What is that feeling telling you?
  *   A) "It's a signal to prepare for the worst so I'm not shocked."
  *   B) "It's a mistake; the result is already decided, worry changes nothing."
  *   C) "It's natural; I care about my health, so of course I'm anxious."

  **5. The Angry Outburst**
  You lose your temper in a meeting. Later,冷静 (calm), you think the anger was unhelpful. How did the anger happen?
  *   A) "They pushed me too far; anyone would have snapped."
  *   B) "I judged that shouting was the right response in that moment."
  *   C) "I let my attention slip and reacted before thinking."

  **6. The Preventable Accident**
  You were distracted by your phone and didn't notice a glass slip off the table; it shatters. Is this a moral failure?
  *   A) "Yes, I chose to look at the phone instead of the table."
  *   B) "No, it was an accident; I didn't intend to break it."
  *   C) "It's a practical error, but calling it 'moral' is too harsh."

  **7. The Job Loss**
  Your company downsizes and you are let go. You feel a loss of status. What have you actually lost?
  *   A) "My livelihood and my place in the community."
  *   B) "A role I performed; my ability to act well remains."
  *   C) "Security. I need to find a new one to be whole again."

  **8. The Unfair Criticism**
  Someone spreads a rumor that you were dishonest. You know it's false. Do you need to correct them?
  *   A) "Yes, my reputation is part of my ability to do good."
  *   B) "No, their opinion doesn't change my actual honesty."
  *   C) "Only if correcting them helps them avoid error."

  **9. The Missed Train**
  You run for a train but miss it by ten seconds. You have to wait an hour. What is the source of your frustration?
  *   A) "The universe is obstructing my plans."
  *   B) "I expected to catch it, and that expectation was the problem."
  *   C) "I didn't leave the house early enough."

  **10. The Dying Relative**
  A parent is terminally ill. You cannot stop the death. What is your job now?
  *   A) "To find a cure or extend their life by any means."
  *   B) "To be present and act with love until the end."
  *   C) "To prepare myself for the grief of losing them."

  ***

  ### Part 2: The Decision Tree (Logical Space to Leaves)

  This tree does not sort by "which book they read." It sorts by the **logical commitments** revealed in their answers. Follow the dominant pattern of their choices.

  **Branch 1: The Locus of Success (Questions 1, 7, 9)**
  *Does success depend on the external outcome or the internal conduct?*
  *   **Path A (Outcome-Dependent):** Success requires the talk to land, the job to stay, the train to be caught. (Mostly A/C answers)
      *   *Leads to:* **The Flat Rejection / Conventional View.** (They reject the core Stoic premise that virtue is sufficient).
  *   **Path B (Conduct-Dependent):** Success is found in preparation, integrity, or expectation management, regardless of the result. (Mostly B answers)
      *   *Proceed to Branch 2.*

  **Branch 2: The Boundary of Agency (Questions 2, 6, 8)**
  *Where does your responsibility end regarding others and accidents?*
  *   **Path A (Shared/Extended Agency):** You bear some responsibility for the friend's drinking, the rumor's spread, or the broken glass. (Mostly A/C answers)
      *   *Leads to:* **The Indirect-Influence Reading.** (You can partly steer outcomes; responsibility is porous).
  *   **Path B (Strict Agency):** You are only responsible for your own choices/judgments. The friend's choice, the rumor, the gravity are separate. (Mostly B answers)
      *   *Proceed to Branch 3.*

  **Branch 3: The Nature of Emotion (Questions 4, 5, 10)**
  *Is emotion a passive reaction to events or an active assessment?*
  *   **Path A (Passive/Signal):** Anxiety is a natural signal; anger is a reaction to being pushed; grief is a cost of love. (Mostly A/C answers)
      *   *Leads to:* **The Therapeutic Reading.** (Use Stoic tools to manage anxiety, but don't claim emotions are fully chosen).
  *   **Path B (Active/Assent):** Anxiety is a mistake in judgment; anger is a choice; grief is a valuation you can adjust. (Mostly B answers)
      *   *Proceed to Branch 4.*

  **Branch 4: The Utility of Action (Questions 3, 10)**
  *If the outcome is unlikely or impossible, is action still required?*
  *   **Path A (Consequentialist/ Quietist-Leaning):** If the campaign won't pass, it's suspect. If the relative will die, curing them is the only real job. (Mostly A/C answers)
      *   *Leads to:* **The Quietist-Leaning Position.** (Action is pointless without probable success).
  *   **Path B (Deontological/ Duty):** You campaign because it is right. You care for the parent because it is your role, death notwithstanding. (Mostly B answers)
      *   *Leads to:* **Strict Epictetan.** (Only assent is yours; act according to nature regardless of outcome).

  **Branch 5: The Motivation for Restraint (Questions 4, 9)**
  *Why limit your worry or frustration?*
  *   **Path A (Efficiency/Peace):** Worry changes nothing, so drop it to feel better or function better.
      *   *Leads to:* **The Modern Influence-Sphere.** (Control what you can, influence the rest, mostly for efficacy).
  *   **Path B (Truth/Alignment):** Worry is a lie about how the world works; drop it to align with reality.
      *   *Leads to:* **Strict Epictetan.** (Reconfirmed).

  ***

  ### Part 3: Mapping Leaves & Analyzing Gaps

  **The Leaves (Position Assignments)**

  1.  **Strict Epictetan:** Path 1B → 2B → 3B → 4B.
      *   *Signature:* Conduct matters, others' actions are theirs, emotions are judgments, duty is unconditional.
  2.  **Modern Influence-Sphere:** Path 1B → 2A → 3A → 5A.
      *   *Signature:* Conduct matters, but we share influence over outcomes; emotions are managed for efficiency.
  3.  **Indirect-Influence Reading:** Path 1B → 2A.
      *   *Signature:* Rejects the hard line between "me" and "not me." Responsibility is gradient.
  4.  **Therapeutic Reading:** Path 1B → 2B → 3A.
      *   *Signature:* Accepts the boundary of agency but treats emotions as natural signals to be soothed, not errors to be corrected.
  5.  **Quietist-Leaning:** Path 1B → 2B → 3B → 4A.
      *   *Signature:* Accepts strict agency but struggles to justify action without probable external success.
  6.  **Flat Rejection:** Path 1A.
      *   *Signature:* Rejects the premise. Outcomes *do* define success. (Often the "Common Sense" view).

  **Collapses & Indistinguishable Leaves**

  *   **Therapeutic vs. Modern Self-Help:** These often collapse into the same leaf (Path 1B → 2A/2B → 3A → 5A).
      *   *Reason:* Both treat the philosophy as a tool for anxiety reduction rather than a metaphysical claim about assent. In a reading group, the person who says "Worry changes nothing" (Self-Help) and the person who says "Worry is a natural signal I should manage" (Therapeutic) will behave identically in 9 out of 10 cases. The tree only separates them if you press hard on *why* they manage the worry (Efficiency vs. Health).
  *   **Quietist vs. Strict Epictetan:** These are dangerously close on Questions 1-3. They only separate on Question 3 (The Campaign).
      *   *Reason:* A Strict Epictetan acts from duty; a Quietist acts from expected utility. If the participant hasn't faced a low-probability political struggle, these two will look identical.

  **Empty Regions of the Logical Space**

  *   **Region: Outcome-Dependent Success + Emotions are Choices (Path 1A + 3B).**
      *   *Status:* **Incoherent.**
      *   *Why:* If you believe success depends on external outcomes (winning the talk, keeping the job), you cannot logically maintain that emotions are fully within your power. If the external world determines success, the external world determines your emotional state. Holding both creates cognitive dissonance usually resolved by abandoning one.
  *   **Region: Strict Agency + Consequentialist Action (Path 2B + 4A).**
      *   *Status:* **Unattractive / Unstable.**
      *   *Why:* This is the "Lucky Stoic." They believe they are only responsible for their own mind, but they only act if they think it will work. This leads to paralysis. If you truly believe only your mind is yours, the probability of external success shouldn't dictate action. People rarely stay here; they drift toward Quietism or Modern Influence.
  *   **Region: Shared Agency + Emotions are Involuntary Reactions (Path 2A + 3A).**
      *   *Status:* **Unexplored / Conventional.**
      *   *Why:* This is basically non-philosophical common sense ("We're all in this together, and stress is just stress"). It's not a Stoic variant; it's the baseline the reading group is trying to move away from. It occupies space, but it's not a "Stoic" leaf.

  **Facilitator's Note:**
  Use the **Campaign Question (3)** and the **Anger Question (5)** as your primary discriminators. The Campaign question separates the Duty-bound (Strict) from the Utility-bound (Modern/Quietist). The Anger question separates the Metaphysical (Strict/Epictetan) from the Psychological (Therapeutic/Self-Help). If everyone clusters on the "Modern Influence" leaf, your group has likely optimized for comfort over rigor.
