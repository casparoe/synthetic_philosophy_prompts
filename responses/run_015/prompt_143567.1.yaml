          3.  Be honest about limitations: Can it explain low uptake among lower-income couples? Does it need supplementation?
          4.  Reverse the direction: What does the UK episode show about the concept itself? (Does formal equality fail due to invisible asymmetries, or is interstitial burden only decisive after economic/cultural barriers are lowered?)
      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables. Tone like a careful letter or email.
      *   **Constraint:** No formal training in economics/philosophy assumed (keep accessible but rigorous).

  2.  **Deconstruct the "Interstitial Burden" Concept:**
