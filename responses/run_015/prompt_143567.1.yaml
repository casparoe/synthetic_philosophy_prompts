      *   Formal leave = measurable, transferable, protected time off.
      *   Interstitial burden = unmeasured, non-transferable, often invisible labor (logistics, emotional load, emergencies).
      *   Hypothesis: Even if formal leave is equal, if the interstitial burden defaults to one partner (usually the mother), the formal equality won't translate to actual equality in career outcomes or care division.

