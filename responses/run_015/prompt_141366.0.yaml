answer: |-
  # Q&A Prep Sheet: Representation in Brains and Machines

  **Strategy Note:** Your audience is split between those who think the metaphysics is settled (Philosophers) and those who think it's empty (Practitioners). Your goal is not to convert the hardline pragmatists to realism, but to convince them that realism is a *useful stance* for their work, while convincing the philosophers that causal structure matters more than selection history in this context.

  ### The Strategic Concession (First 5 Minutes)
  **Concede this early:** Acknowledge that **not every direction identified by an SAE is a genuine representation.**
  *   **Why:** The interpretability practitioners are terrified you will reify every sparse feature as a 'natural kind'. If you claim *every* feature found is real, you lose the room immediately.
  *   **How to phrase it:** "I am not claiming that every basis vector discovered by a sparse autoencoder is a Platonic entity. Many are undoubtedly mathematical artifacts or overfitting. My claim is narrower: that there exists a subset of features whose causal role and stability warrant a realist interpretation, distinct from mere descriptive convenience."
  *   **Effect:** This disarms the pragmatists (you aren't ignoring noise) and sharpens the philosophical claim (you are arguing for a criterion of reality, not universal validity).

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Pragmatic Challenge ('What changes on Monday?')
  *   **Who:** Interpretability Practitioner (Pragmatist)
  *   **Phrasing:** "Suppose I grant you realism. I still train models, run SAEs, and intervene on features exactly as I did yesterday. If anti-realism leads to the same engineering practices and the same safety audits, isn't this metaphysics empty? What work is the 'realism' doing?"
  *   **The Damage:** High. If you can't answer this, you look like you're doing armchair philosophy on empirical objects.
  *   **2-Minute Reply:** "It changes how we prioritise recovery. If features are merely summaries, we only care about them insofar as they help us predict input-output behaviour. If they are real causal structures, we must care about them even when behaviour is stable. Consider a model that behaves safely but contains a dormant 'deceptive' feature structure. An anti-realist says 'no problem, behaviour is fine'. A realist says 'the structure is present, waiting for a trigger'. Realism mandates auditing the *weights*, not just the *outputs*."
  *   **Weakness:** This relies on the assumption that dormant structures *are* dangerous. If the pragmatist argues that dormant structures without behavioural output are irrelevant to safety, you're back to square one.
  *   **Status:** **🚩 The One You Hope Nobody Asks.** (But if they do, use the reply above).

  #### 2. The Teleosemantic Challenge ('No Function, No Content')
  *   **Who:** Philosopher of Mind (90s Training)
  *   **Phrasing:** "Your 'dormant feature' case fails on teleosemantic grounds. Content requires a proper function derived from selection history. If the classifier head is removed, those directions no longer contribute to fitness or loss minimisation. They are structural vestiges, like the appendix. Why call them representations rather than just noise with a history?"
  *   **The Damage:** High. This directly undermines your 'Dormant Feature' case study.
  *   **2-Minute Reply:** "I am defending a causal-role theory of representation, not a teleosemantic one. In artificial networks, 'selection history' is opaque and mixed (pretraining, fine-tuning, regularisation). A causal theory asks: 'Does this state carry information that *could* be read out by a suitable consumer?' The consumer (the classifier head) existed during training and shaped the weights. The capacity remains even if the head is detached. It is like a book in a language nobody currently speaks: the semantic content is in the ink patterns, not in the current act of reading."
  *   **Weakness:** Teleosemanticists will not accept causal role without current function. You are talking past each other slightly.
  *   **Fold Point:** If they press hard on 'proper function', concede that 'representation' might be the wrong word for the dormant case, and pivot to 'latent structural capacity'.

  #### 3. The Basis Artifact Challenge ('It's Just a Basis Choice')
  *   **Who:** Interpretability Practitioner (SAE Builder)
  *   **Phrasing:** "Sparse autoencoders impose a sparsity constraint to find features. But the activation space is high-dimensional and rotating the basis doesn't change the subspace. Why think the specific directions you found are 'in' the network rather than just a legible coordinate system we imposed to make sense of the soup?"
  *   **The Damage:** High. Undermines the ontology of your features.
  *   **2-Minute Reply:** "Rotational invariance holds for the subspace, but not for the causal mechanisms. We find that specific directions are causally efficacious under intervention. If I intervene on direction A, behaviour changes; if I rotate to direction B, the intervention fails. The network is not invariant to our basis choices; it is tuned to specific geometrical configurations established during gradient descent. The SAE discovers these; it does not invent them."
  *   **Weakness:** Some recent work suggests polysemanticity implies features aren't perfectly orthogonal or stable.
  *   **Fold Point:** Concede that *some* features are likely basis artifacts (see Strategic Concession above), but insist robust ones are not.

  #### 4. The Thermometer Challenge ('Correlation vs. Content')
  *   **Who:** Philosopher of Mind
  *   **Phrasing:** "A mercury column correlates reliably with temperature and causes the glass to break if it gets too hot. We don't say the mercury 'represents' temperature in a semantic sense; it's just a causal correlate. What makes your activation direction different from the mercury column?"
  *   **The Damage:** Medium-High. Classic philosophy of mind objection.
  *   **2-Minute Reply:** "The difference is systematicity and compositional role. The mercury column is a isolated correlate. The activation direction sits within a network of other directions that support inference, generalisation, and downstream computation. It plays a role in a computational syntax. The mercury doesn't compute; the activation direction is part of a calculation. Representation requires integration into a processing system, not just causal covariance."
  *   **Weakness:** Requires you to defend that the network is actually 'computing' in a syntactic sense, which some connectionists deny.

  #### 5. The Intervention Challenge ('Causal Leverage ≠ Representation')
  *   **Who:** Hybrid (Pragmatist/Philosopher)
  *   **Phrasing:** "You argue that because intervening on the direction changes behaviour, it's real. But I can intervene on the voltage supply to the GPU and change the behaviour. Is the voltage supply a representation? Causal leverage is necessary for representation, but it isn't sufficient."
  *   **The Damage:** Medium. Attacks your causal grounds.
  *   **2-Minute Reply:** "Correct, causal leverage alone isn't sufficient. It must be *specific* leverage. Changing the voltage changes everything non-specifically. Intervening on a feature direction changes specific semantic outcomes (e.g., changing 'gender' without changing 'topic'). The specificity of the causal channel indicates information-bearing structure, not just power supply."
  *   **Weakness:** You need to be sure your interventions are actually that specific. If they are noisy, this reply fails.

  #### 6. The Derivative Content Challenge ('We Put the Meaning There')
  *   **Who:** Philosopher of Mind
  *   **Phrasing:** "The network doesn't know what 'cat' is. *We* know. When you say a feature represents 'cat', you are projecting our content onto the weights. The content is derivative of us, not intrinsic to the machine."
  *   **The Damage:** Medium. Attacks the 'Realism' core.
  *   **2-Minute Reply:** "That holds for the *label* 'cat', which is indeed human. But the *discriminative capacity* is intrinsic. The network clusters inputs in a way that aligns with our category. Even if we vanished, the network would still distinguish those inputs from others in the same way. The boundary is in the weights; the name is in the language."
  *   **Weakness:** Hard to shake the 'intentionality is derived' argument completely.

  #### 7. The Gradedness Challenge ('Categories Aren't Crisp')
  *   **Who:** Cognitive Scientist
  *   **Phrasing:** "Human concepts are graded and prototype-based, not crisp binary switches. Your features look like discrete directions. If these are real representations, why do they look so much crisper than the cognition they're supposed to model or mirror?"
  *   **The Damage:** Medium-Low. Attacks the psychological plausibility.
  *   **2-Minute Reply:** "Crispness in the model might be an artifact of the ReLU activation or the sparsity constraint, yes. But human cognition also shows categorical perception effects where graded inputs are treated discretely. The model might be capturing the 'decision boundary' phase of cognition rather than the fuzzy encoding phase. Or, it may be that superposition allows for gradedness across multiple features even if single features look crisp."
  *   **Weakness:** You might be overstating the crispness of your features.

  #### 8. The Neuroscientist's Trap ('Place Cells & Linearity')
  *   **Who:** Theoretical Neuroscientist
  *   **Phrasing:** "In hippocampus, place cells are locally encoded and robust. In your transformer, you're claiming representations are linear directions in a high-dimensional residual stream. But biological neurons are non-linear integrators. Why should I believe a linear projection in a silicon model tells me anything about representation in a brain, when the encoding schemes are fundamentally different?"
  *   **The Damage:** N/A (Unanswerable in this context).
  *   **The Damage:** This is the one you probably won't have an answer for.
  *   **2-Minute Reply:** "I am not claiming the *mechanism* is identical to biology. I am claiming the *abstract functional role* is comparable. Whether implemented via linear projections or spiking non-linearities, the question is whether there is a state that carries information for downstream consumers. I am arguing for realism about machine representations specifically; any analogy to brains is illustrative, not foundational."
  *   **Weakness:** **🚩 The Trap.** If they push on whether linear probes are valid evidence for neural coding, you will lose. They know more about biology than you.
  *   **Fold Point:** **Fold here.** Say: "That's a fair constraint. My claims are limited to artificial networks. I use the brain analogy only to motivate the philosophical question, not to assert biological equivalence."

  ---

  ### Final Advice for the Room
  *   **Tone:** Keep it empirical. When the philosophers get stuck on 'content', pivot to 'causal structure'. When the pragmatists get stuck on 'utility', pivot to 'safety risk'.
  *   **The 'Realism' Label:** If pressed, admit that 'Realism' might be a heavy word. You are arguing for 'Causal Structuralism'.
  *   **British English Check:** Ensure you say "behaviour", "analyse", "colour", "modelled", "defence", "centre", "labelling" when reading aloud.

  Good luck. It sounds like a fascinating talk.
