answer: |-
  **Setting:** *A quiet corner of a university library lounge. Rain taps against the window. ELIAS (30s, wears a worn-out blazer, leans forward when he speaks) and SARAH (30s, precise, sits back with a notebook open) are finishing coffee.*

  **Elias:** You're dismissing the quote too quickly. I know it sounds sensational, but when Aquinas says a usurper forfeits his right to rule, he's stripping away the moral protection of the office. If a man seizes power by violence and rules only for himself, he isn't a ruler. He's an aggressor.

  **Sarah:** He's an aggressor *within* a political structure, Elias. That's the distinction you're missing. Aquinas is terrified of sedition. In *De Regno*, he explicitly warns that killing a tyrant often leads to worse tyranny. If you tell every private citizen they have the right to execute the head of state, you aren't establishing justice; you're inviting a bloodbath.

  **Elias:** But that assumes the "head of state" is actually a head. If I break into your house and hold your family hostage, I'm not a homeowner. I'm a criminal. Why does putting on a crown change the moral math? If the tyrant is ruling by force, against the law, and for private gain, Aquinas says the bond of obedience is broken. Why shouldn't I treat him like a wild animal threatening the herd?

  **Sarah:** Because you are not the herd's designated guardian. That's the crux of it. You're focusing on the *nature* of the ruler, but Aquinas focuses on the *nature of the act*. Killing a ruler is a public act. It affects the whole body politic. If a private individual takes that sword, they are claiming an authority they don't possess. It's not about protecting the tyrant; it's about protecting the rule of law itself.

  **Elias:** But what if the law is the weapon? That's the scenario the podcast raised. If the tyrant controls the courts, controls the army, and controls the succession, who is this "public authority" that's supposed to depose him? If Aquinas says "wait for a superior," and the tyrant *is* the superior, you've just argued for infinite submission.

  **Sarah:** I'm not arguing for submission to evil. I'm arguing for procedure. Aquinas distinguishes between a tyrant by *exercise*—a legitimate king who acts badly—and a tyrant by *defect*, a usurper who has no title. Even with a usurper, he worries about the scandal. If you kill him, his supporters might rally. The state fractures. The common good—which is Aquinas's entire metric—is damaged more by the chaos of assassination than by the endurance of a bad ruler.

  **Elias:** That sounds utilitarian. "Suffer the tyrant so the streets stay quiet."

  **Sarah:** It sounds prudential. Prudence is a cardinal virtue, Elias. Look, imagine two people. One says, "This man is evil, I will kill him." The other says, "This man is evil, we must convene the nobles, or appeal to the Emperor, or excommunicate him." The second path preserves the idea that power comes from a structure, not from a gun. If you validate private tyrannicide, you teach the next generation that power belongs to whoever is willing to be the most violent.

  **Elias:** I think you're conflating two different things. Aquinas isn't saying "anyone can kill a king they dislike." He's talking about a specific edge case: the usurper. The guy who grabbed the throne by violence. In his *Commentary on the Sentences*, he suggests that in that specific case, the usurper is in a state of war with the community. If I'm in a state of war, I don't need a judge's warrant to defend myself. The "public authority" is the community itself, acting in self-defense.

  **Sarah:** But who speaks for the community? You? Me? Some faction? That's where the "wild animal" analogy falls apart. A wild animal doesn't claim legal authority. A tyrant does. He has seals, decrees, soldiers who think they're serving the law. If you kill him, you aren't just killing a man; you're attacking the office. Even a usurper quickly becomes the *de facto* authority. Aquinas knows history. He knows that removing a tyrant often just clears the way for a worse one.

  **Elias:** So we just hope for the best?

  **Sarah:** We work for the best through legitimate channels. Aquinas says if there is a superior authority—like an Emperor over a King—you appeal to them. If there isn't, you appeal to God. It sounds passive, but it's a check on human pride. It says, "I am not the savior of the state."

  **Elias:** That's the tension, though. You say "appeal to God," but Aquinas also says tyranny is contrary to the Divine Order. A tyrant disrupts the peace which is God's will. If the tyrant is destroying the very thing authority is supposed to protect, doesn't the authority dissolve? If a shepherd starts eating the sheep, he's not a shepherd anymore.

  **Sarah:** He's a *bad* shepherd. But if the sheep decide to hunt him without a master's command, the flock scatters. Wolves come in.

  **Elias:** What if the shepherd is actively slaughtering them right now?

  **Sarah:** Then it's self-defense in the immediate moment. But tyrannicide is rarely immediate self-defense. It's usually a plot. A conspiracy. That requires judgment. It requires sentencing. Private individuals cannot sentence a ruler. That's the line. You can resist an immediate attack, but you cannot execute a political judgment.

  **Elias:** But isn't that line blurry? If the tyrant is purging his enemies systematically, isn't that an ongoing attack?

  **Sarah:** It's a tragedy. I'm not saying it's not a tragedy. I'm saying Aquinas believes the remedy of private violence is worse than the disease. He'd rather you suffer a tyrant than risk civil war. Because civil war destroys the *common good* entirely. At least under a tyrant, there's some order. Under civil war, there's nothing.

  **Elias:** I think you're reading Aquinas through a modern lens of state stability. I think Aquinas is reading through a lens of Natural Law. If the law commands the good, and the ruler commands the evil, the ruler has no force of law. He's void. And if he's void, he's just a private citizen committing murder on a mass scale. Why does he get immunity?

  **Sarah:** Because immunity isn't for him. It's for *us*. It's to stop us from becoming judges in our own case. That's the Fall, Elias. Thinking we can perfectly discern justice and act on it without consequence. Aquinas is a theologian. He knows that even when we kill a tyrant for "justice," we often do it for pride, or revenge, or ambition. By restricting the right to depose to a public authority, he forces us to slow down. He forces consensus.

  **Elias:** Consensus is impossible under terror.

  **Sarah:** Then you wait. Or you suffer.

  **Elias:** That's hard to preach to the victims.

  **Sarah:** It is. And that's why the other interpretation exists. The one you like. The one that says, "If he seized power by force, he forfeits protection." It's appealing. It feels righteous. But does it build a society? Or does it build a cycle of vengeance?

  **Elias:** Maybe Aquinas didn't resolve it. Maybe he saw both truths. That the tyrant is a monster who should be stopped, but that stopping him privately is dangerous.

  **Sarah:** Exactly. He holds the tension. He condemns the tyrant severely—says he deserves to be deposed—but he condemns the assassin, too, if he acts without public mandate.

  **Elias:** So the tyrant is guilty, but the killer is also guilty?

  **Sarah:** Unless the killer *is* the public authority.

  **Elias:** Which brings us back to the start. Who is the public authority when the state is captured?

  **Sarah:** *(Closes her notebook)* That, Elias, is the question that has started more wars than any tyrant ever did. Aquinas gives you the principles: The Common Good is supreme. Usurpation is illegitimate. Private violence is destructive. He doesn't give you a flowchart for revolution.

  **Elias:** *(Leans back, sighing)* So the internet guy wasn't entirely wrong, but he wasn't entirely right either.

  **Sarah:** The internet is never entirely right. Aquinas says the tyrant acts like a beast, yes. But he warns us not to become beasts to kill him.

  **Elias:** So we're stuck between a wolf and a chaos.

  **Sarah:** We're stuck in the human condition. Where sometimes the right thing to do is unclear, and the wrong thing is very tempting.

  **Elias:** *(Picks up his cup)* Well. At least we agree the tyrant is the problem.

  **Sarah:** *(Smiles faintly)* On that, we have consensus. Now, who has the authority to pay for the next round?

  **Elias:** I'll claim public authority on that one. My treat.
