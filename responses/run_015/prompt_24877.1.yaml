  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You're not crazy, the efficiency argument is strong. But you are likely oversimplifying the counter-argument.
      *   *Roth:* Mention Alvin Roth. He coined "repugnant markets." He distinguishes between *constraints* (can't do it) and *repugnance* (society says don't do it). He argues repugnance is a constraint to be managed, not just ignored.
      *   *Sandel:* This is crucial. "What Money Can't Buy." The argument is about *corruption*, not just distribution. Putting a price on a kidney changes the *meaning* of the kidney and the person. It shifts from a gift of life to a transaction.
