answer: |-
  You are not strawmanning the *intuition* behind your friend's position, but you are likely oversimplifying the *philosophical and economic literature* that supports it.

  Your argument rests on a standard utilitarian framework: if $A$ benefits and $B$ benefits, and no third party is harmed, the transaction should be permitted. This is the bedrock of free-market economics.

  However, the counter-argument isn't usually just "ew, that's gross." In academic circles (specifically in law, philosophy, and market design), the objection to markets in kidneys, blood, surrogacy, or sex work is categorized under **commodification** and **repugnant markets**. The scholars here aren't just appealing to aesthetics; they are arguing that markets change the *meaning* of the goods being traded and can lead to specific, tangible social harms that a simple supply-and-demand model misses.

  Here is the deeper landscape of that debate, along with an assessment of your "gay marriage" analogy.

  ### 1. Alvin Roth and "Repugnant Markets"
  Alvin Roth, a Nobel Prize-winning economist, literally wrote the book on this (*Who Gets What — and Why*). He uses the term "repugnance" technically, not just emotionally.

  Roth argues that repugnance is a **constraint** on market design, similar to physics or budget constraints. If a market is too repugnant to the public, it will be banned, black-marketed, or stigmatized to the point of failure.
  *   **The Argument:** It's not that the economist *agrees* with the repugnance, but that ignoring it makes policy fail.
  *   **The Nuance:** Roth distinguishes between *transactions* that are repugnant (e.g., eating human flesh) and *markets* that are repugnant (e.g., paying for organs). The debate is about where the line is drawn. He suggests that sometimes, to make a market work, you have to disguise the money (e.g., calling it "compensation for time and pain" rather than "price of a kidney") to lower the repugnance cost.

  ### 2. Michael Sandel and the "Corruption" Argument
  The philosopher Michael Sandel (*What Money Can't Buy*) offers the strongest argument against your "squeamishness" claim. He argues that the objection to commodification is not about **fairness** (who gets the kidney) but about **corruption** (what the kidney *is*).

  *   **The Argument:** Putting a price on certain goods changes their moral meaning. If you pay someone to be your friend, they are no longer a friend; they are a hireling. If you buy a kidney, it shifts the framework from a "gift of life" (altruism) to a "spare parts supply chain" (extraction).
  *   **Why it matters:** Sandel argues that this erodes social norms. If we accept that bodies are warehouses of sellable assets, it changes how we value human dignity, particularly for the poor. It's not just "icky"; it's a shift in how society conceives of human worth.

  ### 3. The Coercion and Inequality Problem
  This is the most practical counter to your "mutual benefit" premise. In economics, a voluntary transaction requires **reasonable alternatives**.

  *   **The Scenario:** If a wealthy person sells a kidney to buy a boat, that's one thing. If a destitute person sells a kidney to feed their children, is that truly voluntary?
  *   **The Objection:** Critics argue that in a market for organs, the sellers will almost exclusively be the desperate poor, and the buyers will be the wealthy. This turns the bodies of the poor into a resource for the rich.
  *   **The Harm:** The argument is that this creates a form of **exploitation**. Even if the seller is "better off" with the money than without it, the *system* incentivizes desperation. It's similar to child labor: a child working in a factory might be "better off" than starving, but we ban it because we don't want a society where that is the option set for children.

  ### 4. Crowding Out Altruism
  There is empirical literature (most famously by Richard Titmuss regarding blood donation) suggesting that introducing money can **crowd out** intrinsic motivation.

  *   **The Theory:** If people can sell blood/kidneys, fewer people will donate them for free. Why give a gift when you can get paid?
  *   **The Result:** You might end up with a smaller overall supply, or a lower quality supply (because paid donors have an incentive to hide health issues to get the money), compared to a purely altruistic system.
  *   **Relevance:** This moves the argument from "moralizing" to "efficiency." If markets reduce the total supply of organs, your utilitarian argument fails on its own terms.

  ### 5. Is Your "Gay Marriage" Analogy Flawed?
  You asked: *"Some people find gay marriage repugnant too, but we don't let that stop us... Why should 'this feels icky to me' carry any weight?"*

  This is the weakest part of your framing. Here is why philosophers and legal scholars generally reject that analogy:

  *   **Prejudice vs. Protection:** Laws against gay marriage were based on **status-based prejudice** (who you *are*). They restricted liberty without preventing tangible harm to others.
  *   **Market Regulation:** Laws against organ sales are based on **conduct-based protectionism** (what you *do*). They restrict liberty to prevent perceived harm (exploitation, degradation, inequality).
  *   **A Better Analogy:** The ban on kidney sales is legally and philosophically more similar to **child labor laws** or **laws against selling yourself into slavery**.
      *   In both cases, you could argue: "If the kid wants to work and the factory wants to hire him, both benefit. Why stop it?"
      *   We stop it because we believe some things (childhood, bodily integrity, liberty) are **inalienable rights**. You cannot consent to give them away, even for money, because doing so undermines your status as a free citizen.

  ### 6. The Case of Iran
  It is worth noting that this isn't just theoretical. **Iran is the only country with a legal, regulated market for kidneys.**
  *   **Pro-Market View:** They claim to have eliminated the waiting list for kidneys.
  *   **Anti-Market View:** Studies show donors are overwhelmingly poor, often report a decrease in quality of life after the surgery, and frequently feel social stigma.
  *   **The Takeaway:** The data is mixed. It suggests that markets *do* increase supply, but they also create the exact inequality and regret that critics warn about.

  ### Summary: Are You Missing Something?
  You aren't missing the *logic* of your position; the efficiency argument is robust. But you are missing the **sociological and normative weight** of the counter-argument.

  Your friend's position isn't just "squeamishness." It is the argument that **markets are not neutral tools.** They carry values. When you put a price on a body part, you aren't just allocating a resource; you are endorsing a view of the human body as property.

  The debate isn't **Efficiency vs. Squeamishness.**
  The debate is **Efficiency vs. Dignity/Equality.**

  If you want to steelman your friend's position, don't let them say "it's repugnant." Ask them: *"Does allowing this market exploit the poor, degrade human dignity, or crowd out altruistic donation?"* Those are the substantive arguments that carry weight in policy debates, far beyond mere aesthetics.
