      *   *Check:* Is CoNG exactly Hume? *Correction:* Dennett credits Hume but adds the "narrative" aspect which is more modern (Bruner, etc.).
      *   *Check:* Uploading. *Correction:* Dennett's "Where Am I?" suggests he thinks psychological continuity is key, but the destruction of the body is a loss. The summary is too optimistic.

