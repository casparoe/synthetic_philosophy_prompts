      *(Self-Correction)*: Wait, I need to be careful with the "Both-Now" explanation. In QHD, if both are immediate, utility is just $u_t$. If I choose scroll, $u_{scroll} > u_{sleep}$. Why is that a failure? Because the *future* self (8 AM) suffers. But the choice is made at 11 PM. So 11 PM self is discounting the 8 AM self. Ah, but the prompt says "deciding on Monday whether to start a chapter Friday or Saturday." That's Future vs. Future. $\beta$ applies to both equally. So QHD is indifferent. That's the key. I need to make sure I explain that specific scenario clearly.

