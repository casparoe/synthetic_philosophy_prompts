answer: |-
  Your maxim fails the test of the categorical imperative because it generates a contradiction in the will when universalized.

  You confuse consistency in conception with consistency in volition, and you treat the maxim as a mere phrase rather than a principle of action. While it is logically conceivable that all men adopt your conditional stance, it is impossible to *will* this as a universal law of nature without contradicting the very end you presuppose in undertaking common action. If everyone waits for the other, the undertaking collapses, and your condition renders the action impossible, thus defeating your own rational agency in this sphere. Regarding description, the maxim must express the subjective principle of volition, not a linguistic trick; if you intend the undertaking, you cannot universally will the condition that destroys it. The contradiction arises not from the existence of two worlds, but from the impossibility of willing the world where your maxim is law while maintaining the rational end of cooperation. Your objection mistakes the formal test for an empirical prediction.

  I concede that the formula itself does not mechanically dictate the correct level of description for a maxim, leaving room for subjective error in application. This ambiguity may make the verdict appear hostage to wording, though the fault lies in the agent's formulation, not the law. Clarification here is necessary, but it does not overthrow the principle.
