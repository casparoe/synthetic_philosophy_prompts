answer: |-
  The view your practice presupposes is a hybrid of **Derived Teleosemantics** (for the hardware/signal level) and **Normative Pragmatics** (for the system/integration level).

  In philosophy of mind and language, **Teleosemantics** (championed by Ruth Millikan, David Papineau, and Karen Neander) argues that the content of a state (what it is *about*) is determined by its **proper function**—what it was selected or designed to do. A heart is *for* pumping blood; a temperature probe is *for* reporting temperature. When it fails to do so systematically, it misrepresents (Case 1). When it ceases to function entirely, it produces noise (Case 2).

  However, Case 4 (the "correct bug") shows that in engineering systems, proper function can be overridden by **Convention** (David Lewis) or **Institutional Fact** (John Searle). The meaning of a signal is stabilized not just by its origin, but by the "rules of the game" established by downstream consumers.

  Here is the reconstruction of the view that makes your triage rational, followed by the specific answers to your questions.

  ### The Reconstruction: Normative Functionalism

  For your team's vocabulary to make sense, the following must be true:
  1.  **Artifacts have Derived Intentionality:** Machines do not have original minds, but they inherit "aboutness" from the intentions of their designers and users. A voltage is not *intrinsically* about temperature; it is *about* temperature because we built a system where that voltage plays the role of temperature.
  2.  **States are Normative, not just Causal:** A signal is not just a physical cause of a downstream effect; it is a **move in a game** that can be played correctly or incorrectly. To call an output "wrong" is to say it violated a rule of the system, not just that it caused a crash.
  3.  **Function is Historical but Stability is Social:** What a signal *means* is fixed by history (design), but what counts as *correct* is fixed by the current normative community (the downstream services).

  ---

  ### (a) What has to be true for a physical state to be *about* anything? (Case 1 vs. 2)

  **The View:** **Etiological Proper Function.**
  For a voltage to be *about* temperature (Case 1) rather than just *noise* (Case 2), there must be a **historical chain of design intent** that established a mapping rule.

  *   **Case 1 (Wrong Output):** The mechanism is functioning according to its design schema (voltage $\to$ conversion $\to$ number), but the mapping parameters are misaligned with the world. The system is *trying* to represent temperature and failing. This is **misrepresentation**.
  *   **Case 2 (Noise):** The mechanism has fallen outside the conditions of its design schema (loose connector). The causal chain is broken. The system is not *trying* to represent anything; it is just vibrating. This is **non-representation**.

  **Why this is required:** If you rejected this and adopted a pure **Causal/Informational Semantics** (where meaning = reliable correlation), you could not distinguish Case 1 from Case 2. In both cases, the output fails to correlate with the room temperature. To call one "false" and the other "noise," you must appeal to the *mechanism's intended operation*, not just the output's relation to the world. You are implicitly saying: *"This state belongs to a class of states selected for representing temperature."*

  ### (b) What fixes what a signal says? (Case 4)

  **The View:** **Hybrid Etiology and Convention.**
  Strict Teleosemantics says content is fixed by original design history. Your practice shows this is insufficient. You need **Systemic Convention**.

  *   **Original Design:** Fixes the *type* of content (this is a temperature reading, not a pressure reading).
  *   **Downstream Dependency:** Fixes the *value* of correctness (23 is the "true" reading for the system, even if 25 is the truth for the room).

  **Is the appeal to history strictly required?**
  Yes, but only to establish the *domain*. Without the history (it was built as a temperature probe), you couldn't even say it's "wrong" in Case 1; it would just be a voltage. However, once the domain is established, **current causal role** (what the downstream services *do* with the data) can override the original truth-conditions.

  In Case 4, the "meaning" of the probe shifted. Initially, `output = f(temp)`. After six years, the system evolved so that `system_state = g(output)`. When `output` changed to match `temp`, `system_state` broke. The practice treats the **system's equilibrium** as a higher-order norm than the **probe's veridicality**. The signal says "23" because the *community of consumers* interprets it as "23," regardless of the sender's intent. This is a **Lewisian Convention**: we agree to treat this signal as having this value because deviating is costly.

  ### (c) Is the "should" the same in "should be 25" and "output should be 23"?

  **The View:** **Two Distinct Norms.**
  You are running together two different normative standards, and your triage process is the arbitration between them.

  1.  **Veridical Should (Epistemic Norm):** "The output should be 25." This appeals to correspondence with the external world. This is the norm of **Science/Measurement**.
  2.  **Conformance Should (Functional Norm):** "The output should be 23." This appeals to coherence within the system. This is the norm of **Engineering/Integration**.

  **Which one does the bug tracker track?**
  The bug tracker tracks **Conformance**.
  *   In Case 1, the bug is filed because the system *expects* veridicality (the alert thresholds assume truth). The violation of the Veridical Should causes a violation of the Conformance Should.
  *   In Case 4, the fix is reverted because satisfying the Veridical Should violates the Conformance Should. The bug is filed against the *fix* because it broke the system's equilibrium.

  Your practice presupposes that **Functional Normativity dominates Epistemic Normativity** in a production environment. A true fact that breaks the pipeline is a "bug"; a false fact that keeps the pipeline running is "working as designed."

  ### (d) Where is the practice underdetermined? (Rival Accounts)

  If you swapped in rival philosophical accounts, your triage language would break in specific ways:

  **Rival 1: Pure Informational Semantics (Dretske)**
  *   *Theory:* A signal means whatever it reliably correlates with.
  *   *Breakage:* You lose **Case 1**. If the probe consistently reads 23 when it's 25, it reliably correlates with "23-degree-room-states" (or rather, fails to correlate with 25). You couldn't call it "false"; you'd have to say it measures "probe-voltage-units." You would lose the ability to say the *pipeline* is wrong, because the signal is perfectly honest about its own causal history. The "garbage in, garbage out" excuse (Case 3) vanishes, because the service is just reporting the correlation it received.

  **Rival 2: Radical Interpretationism (Dennett's Intentional Stance, pushed too far)**
  *   *Theory:* A state means whatever interpretation makes the system's behavior most predictable.
  *   *Breakage:* You lose **Case 2**. If the loose connector consistently outputs MAX_INT, an interpretationist might say, "Well, it's consistently telling us the connector is loose." You would lose the distinction between **noise** and **signal**. Your practice relies on a hard line between "broken mechanism" (noise) and "functioning mechanism with wrong params" (error). Pure interpretationism dissolves that line into "useful model vs. less useful model."

  **Rival 3: Behaviorism**
  *   *Theory:* Meaning is just the disposition to cause downstream effects.
  *   *Breakage:* You lose **Case 4's reversal**. If meaning *is* downstream effect, then the corrected probe (causing alerts) *means* "Danger." You couldn't say the fix was a bug. You could only say "We don't like Danger." Your practice insists the fix was *wrong* (a bug), implying there is a standard *outside* the immediate behavior (the original design spec or the physical reality) that was violated.

  ### (e) Predictions for Edge Cases

  Based on **Derived Teleosemantics + Normative Pragmatics**, here is what your view predicts for the unlisted cases:

  **1. Internal activation vector inside a trained classifier**
  *   **Verdict:** **No Content / No Truth Value.**
  *   **Reasoning:** There is no design history that assigned a specific semantic value to *that specific vector dimension*, nor is there a downstream consumer that interprets it directly as a proposition. It is a causal intermediary.
  *   **Practice Prediction:** You cannot file a bug saying "Activation 4.2 is false." You can only say "The output classification is wrong." If you try to triage the vector itself as "noise" vs "error," you are category-mistaking. It is neither; it is sub-semantic.

  **2. A metric emitted for years that nobody has ever read**
  *   **Verdict:** **No Content / Dormant Function.**
  *   **Reasoning:** While it has a design history (etiology), it lacks **Normative Uptake**. There is no community of consumers establishing a convention around it. It is like a tree falling in a forest with no one to hear it.
  *   **Practice Prediction:** If the metric drifts, you cannot call it "wrong." You can only call it "divergent from spec." If no one depends on it, fixing it is not "correctness," it is "hygiene." Your triage should deprioritize this as "non-functional," because without uptake, there is no functional norm to violate.

  **3. A legacy wire format whose authors are gone and whose consumers are gone**
  *   **Verdict:** **Dead Meaning / Fossil.**
  *   **Reasoning:** Both Etiology (designers) and Convention (users) are absent. The bits are no longer *about* anything. They are just patterns.
  *   **Practice Prediction:** You cannot call the data "corrupt" or "false." You can only call it "unreadable." If you write a parser for it, *you* become the new consumer, and you assign new meaning (Case 4 restart). Until then, triaging it as "wrong" is nonsense. It is merely **opaque**.

  ### Weaknesses and Tensions

  The view I have reconstructed handles your practice well, but it strains at **Case 4**.

  **The Tension:** **Teleosemantics** (Design History) and **Pragmatics** (Current Use) are theoretically in conflict.
  *   Teleosemantics says the probe *means* Temperature (because it was designed to).
  *   Pragmatics says the probe *means* System-Stability-Token (because that's how it's used).

  In Case 4, your team implicitly admits that **Use overrides Design**. This is philosophically uncomfortable because it suggests that **truth is subordinate to stability**. If you follow this view to its limit, you must admit that *any* bug, if left unfixed long enough, becomes a feature. This is the **Fallacy of Misplaced Concreteness** turned into policy.

  **What the view handles badly:**
  It struggles to explain **why you still feel uneasy about Case 4.** You reverted the fix, but you still filed a bug against it. You called the old behavior "correct" in the runbook, but you know the room was actually warmer. The reconstruction explains *why you acted that way* (Functional Norm > Veridical Norm), but it cannot justify *why that feels like a compromise*.

  That unease is the philosophical remainder: it is the conflict between the **World** (which demands 25) and the **System** (which demands 23). Your practice resolves the conflict by siding with the System, but the vocabulary ("bug," "false," "correct") betrays that you know the World is still waiting for its due.

  ### Summary Name
  If you need to look this up, search for:
  1.  **Derived Teleosemantics** (Millikan/Papineau) for the hardware/error distinction.
  2.  **Inferential Role Semantics** (Brandom) or **Use Theory of Meaning** (Wittgenstein) for the system/dependency distinction.
  3.  **Institutional Facts** (Searle) for the "runbook as law" aspect.

  But in your daily work, you are practicing **Normative Functionalism**: The truth is what keeps the function alive.
