prompt: |-
  I direct the editorial team for a high-school world history program, and we are in the middle of a full revision. My team runs into one problem several hundred times per volume: passages in which something non-human does the acting — an epidemic, a drought, a volcanic winter, a shift in the monsoon, a glacier, a shallow harbor, a vein of ore. Our house style currently has one blunt rule for these, which is to put the people back in: no sentence should make a pathogen or a weather system the grammatical subject of a historical claim. My copy editors and my subject-matter reviewers have told me, independently, that the rule now does as much harm as good. It produces flat, evasive prose, and it sometimes deletes a causal claim that is true, load-bearing, and the entire point of the paragraph. I agree, and I want to replace the rule with something my editors can actually run.

  Please write me that procedure. It has to work on a single sentence or short passage, in about ten minutes, run by a copy editor with no training in philosophy or historiography, and its output has to be a specific edited sentence plus a verdict from a small fixed set — leave as is; leave with a required mediating clause added; rewrite with the human decision-makers restored; delete the causal claim; escalate to a subject-matter editor. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, and what does not; tell me where the procedure stops with a no; and mark the points where it has to hand the decision to a person because the question is one of values, pedagogy, or politics rather than fact.

  Three things the procedure has to get right. First, it must catch the drift from "X was among the causes" to "X made the outcome inevitable" — geography as destiny — including the cases where that drift carries a political charge, because attributing a region's poverty to its rainfall or its disease ecology rather than to a century of extraction is not a stylistic slip. Second, it must catch the mirror-image failure: rewriting to restore human agents in a way that credits officials with a decision nobody made, a foresight nobody had, or an option nobody had available. Third, it has to distinguish a trigger from a background vulnerability, and say what to do when a sentence collapses the two.

  We already use two informal heuristics, and I want you to keep them if they survive scrutiny, replace them if they do not, and tell me which you did and why. One we call the restore-the-decision-makers test: if you cannot rewrite the sentence with human agents as the subject without losing something, then the non-human factor is doing causal work and must not simply be deleted. The other we call the matched-case test: find a case that shares the non-human factor but has a different outcome; if you can, the factor was not sufficient, and the sentence may not imply that it was.

  Then apply the procedure to three passages from our current draft. Treat the empirical claims in each as checked and accurate; the only question is the causal framing.

  One. "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."

  Two. "The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."

  Three. This one is our sample unit opener, it appears in the materials we show adoption committees, and it tests very well with teachers. I would rather not lose it, so if your procedure says it cannot stand, say so plainly and give me the replacement sentence. "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."

  Finally, include a bank of five short test sentences my copy editors can use to check that they are applying the procedure the same way I am, and close with an honest statement of what the procedure cannot do — where it will misfire, which disputes it cannot settle, and which tradeoffs, in particular the tradeoff between vividness and precision at a ninth-grade reading level, remain judgment calls that no checklist will eliminate.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Director of an editorial team for a high-school world history program.
      *   **Problem:** Current house style rule ("No non-human subjects for historical claims") is too rigid, causing flat prose and deleting valid causal claims (environmental determinism vs. valid environmental causation).
      *   **Goal:** Create a new, actionable procedure for copy editors (no philosophy training) to evaluate sentences where non-human factors (epidemics, weather, geography) are the grammatical subject.
      *   **Constraints:**
          *   Must work on a single sentence/short passage.
          *   Time limit: ~10 minutes per instance.
          *   Output: Edited sentence + Verdict (Fixed set: Leave as is; Leave with mediating clause; Rewrite with human agents; Delete causal claim; Escalate).
          *   Must address three specific risks: Geography as destiny (political charge), False human agency (crediting foresight/choices that didn't exist), Trigger vs. Background vulnerability.
          *   Must evaluate two existing heuristics ("Restore-the-decision-makers test" and "Matched-case test").
          *   Must apply the procedure to three specific passages.
          *   Must include a 5-sentence test bank for calibration.
          *   Must include an honest limitation statement.
      *   **Tone:** Professional, precise, instructional, empathetic to the editorial workflow.

  2.  **Deconstruct the Existing Heuristics:**

      *   *Restore-the-decision-makers test:* "If you cannot rewrite... without losing something, then the non-human factor is doing causal work."
          *   *Critique:* Good for identifying *if* the non-human factor matters. Bad for determining *how* it matters (determinism vs. condition). It risks forcing human agency where none existed (e.g., no one "decided" the volcano would erupt).
          *   *Verdict:* Keep the core insight (don't delete valid causation) but refine the application to avoid inventing agents.
      *   *Matched-case test:* "Find a case that shares the non-human factor but has a different outcome."
          *   *Critique:* Excellent for checking sufficiency/necessity. If drought happens elsewhere without collapse, drought alone isn't the sole cause.
          *   *Verdict:* Keep, but simplify for a 10-minute workflow (editors can't do deep research). Make it a "plausibility check" rather than a research task.

  3.  **Drafting the Procedure (The "Non-Human Agency Protocol"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Step 1: Identification.* Is this actually a causal claim or just description?
      *   *Step 2: The Determinism Check (Risk 1).* Does this imply inevitability? (Geography as destiny).
      *   *Step 3: The Agency Check (Risk 2).* Does rewriting it with humans invent choices they didn't have?
      *   *Step 4: The Trigger/Background Check (Risk 3).* Is the sentence collapsing a long-term vulnerability with a short-term trigger?
      *   *Decision Matrix:* Map the findings to the 5 required verdicts.

      *   *Refining the Steps for Copy Editors:*
          *   Avoid jargon like "ontological." Use "Did people have a choice?"
          *   Time-box the research (use general knowledge or quick lookup).
          *   Define the "Mediating Clause" clearly (e.g., "combined with...", "exposed by...").

  4.  **Evaluating the Three Passages:**

      *   *Passage 1 (Smallpox):* "Smallpox reached the valley... killed the ruler... confederation... no longer existed."
          *   *Analysis:* Non-human subject (Smallpox). Causal chain is clear. Did humans have a choice? No (immunological naivety). Is it deterministic? No, it's a specific shock.
          *   *Verdict:* Likely "Leave as is" or minor tweak to acknowledge lack of resistance without blaming victims.
      *   *Passage 2 (Eruption/Government):* "The eruption took the harvest... city had a new government."
          *   *Analysis:* Implies eruption *caused* government change. Risk: Did the eruption force it, or did elites use the crisis? Collapses trigger (eruption) with political outcome.
          *   *Verdict:* Needs a mediating clause. "The eruption... *creating a crisis that opponents exploited to*... new government."
      *   *Passage 3 (The Cold/Dynasty):* "The cold came... harvests failed... dynasty... simply stopped."
          *   *Analysis:* High risk of "Geography as Destiny." A dynasty doesn't stop *just* because of cold. Usually, cold creates stress that humans mishandle. "Simply stopped" implies inevitability.
          *   *Verdict:* This is the tricky one. The user wants to keep it. But strictly speaking, it erases human failure. The procedure must flag this. If the procedure says "Rewrite," I must say so.
          *   *Decision:* The procedure should flag this as "Escalate" or "Rewrite with mediating clause." "Simply stopped" is the problem. It implies no human agency in the collapse. I will recommend a rewrite that acknowledges the stress without erasing the political failure.

  5.  **Developing the Test Bank:**

      *   Need 5 sentences covering the spectrum:
          1.  Clear environmental determinism (Bad).
          2.  Valid environmental cause (Good).
          3.  Invented human agency (Bad).
          4.  Trigger/Background collapse (Bad).
          5.  Ambiguous/Needs Escalation.

  6.  **Addressing the Limitations:**

      *   What can't a checklist do? Nuance, historiographical debates, reading level vs. accuracy trade-offs.
      *   Acknowledge that history is interpretive.

  7.  **Review and Refine (Self-Correction during drafting):**

      *   *Check:* Did I include the specific verdicts? Yes.
      *   *Check:* Is the time limit realistic? Yes, if I limit the "Matched-case" research to "common knowledge/quick search."
      *   *Check:* Did I address the existing heuristics? Yes, in the preamble.
      *   *Check:* Is the tone appropriate? Needs to be authoritative but collaborative.
      *   *Correction on Passage 3:* The user says "I would rather not lose it." If my procedure kills it, I must be firm. The sentence "a dynasty... simply stopped" is historically dubious (dynasties are overthrown or replaced, they don't just stop due to weather). I will recommend a specific edit that keeps the *vibe* but fixes the *causality*.
      *   *Correction on Heuristics:* The "Restore-the-decision-makers" test is dangerous if interpreted as "Always make humans the subject." I need to clarify that it means "Check if humans *could* have been the subject," not "Force humans to be the subject."

  8.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" options are distinct. Make sure the "Escalate" criteria are clear (values/politics).

      *(Self-Correction on the Procedure Logic)*:
      Let's structure the decision tree logically.
      1. Is the causal claim true? (Fact check - assumed done per prompt, but worth a quick sanity check).
      2. Does it imply inevitability? (Determinism check).
      3. Does it erase necessary human mediation? (Agency check).
      4. Does it confuse trigger/background? (Vulnerability check).

      *Verdict Mapping:*
      *   Passes all -> Leave as is.
      *   Fails Agency (invents choice) -> Rewrite with human agents.
      *   Fails Determinism (implies inevitability) -> Leave with mediating clause.
      *   Fails Trigger/Background -> Leave with mediating clause OR Escalate.
      *   Fails Values/Politics -> Escalate.
      *   Claim is false/misleading -> Delete causal claim.

      *Wait, one constraint:* "Rewrite with the human decision-makers restored." This is the old rule's output. I need to make sure this is only used when humans *actually* made a decision.
      *Another constraint:* "Leave with a required mediating clause added." This is for when the non-human factor is real but needs context (e.g., "Drought, *exacerbated by poor storage*, caused...").

      *Let's refine the "Matched-Case Test".* For a copy editor, finding a matched case in 10 minutes is hard. I should modify this to "The Counterfactual Check": Ask "Could the same thing happen elsewhere without this result?" If yes, the sentence needs qualification.

      *Let's refine the "Restore-the-decision-makers".* Change to "The Agency Availability Check": "Was there a human decision that could have changed this?" If No -> Non-human subject is okay. If Yes -> Human subject is better.

      *Okay, ready to write.*
answer: |-
  # Procedure: Non-Human Agency in Historical Causation (NHA-1)

  **To:** Copy Editing Team
  **From:** Editorial Director
  **Subject:** New Protocol for Environmental and Non-Human Subjects
  **Time Allowance:** 10 minutes per instance
  **Goal:** Preserve valid causal claims about environment/geography without slipping into determinism or erasing human agency.

  ## Preamble: Status of Existing Heuristics

  We are retiring the blunt rule ("No non-human subjects"). We are modifying your existing heuristics as follows:

  1.  **Restore-the-Decision-Makers Test:** **Modified.**
      *   *Old Version:* If you can't rewrite with humans, the non-human factor is essential.
      *   *New Version (The Agency Availability Check):* Ask, "Was there a human decision available that could have prevented this outcome?"
      *   *Why:* The old version tempted editors to invent decisions where none existed (e.g., "The king decided the volcano would erupt"). The new version checks if agency was *possible*. If no human action could have stopped the pathogen or the drought, the non-human subject is permissible.
  2.  **Matched-Case Test:** **Retained but Simplified.**
      *   *New Version (The Counterfactual Check):* Ask, "Did this same non-human factor occur elsewhere without this specific outcome?"
      *   *Why:* If drought caused collapse here but not there, drought alone is not the full cause. The sentence must reflect that distinction. You do not need to find a specific historical case; use general knowledge or a quick search.

  ---

  ## The Procedure (NHA-1)

  **Instructions:** Apply these four questions in order. Stop at the first "Yes" that triggers a verdict. If you reach the end with no triggers, the sentence stands.

  ### Step 1: The Inevitability Check (Determinism Risk)
  **Question:** Does the sentence imply the outcome was unavoidable *solely* because of the non-human factor (e.g., "The soil made them poor," "The rain made them warlike")?
  *   **Sufficient Answer for "Yes":** The sentence links a geographic/biological fact directly to a complex social/political outcome without mentioning human response, policy, or vulnerability.
  *   **Insufficient Answer:** The sentence describes a physical constraint (e.g., "The mountain blocked the road").
  *   **Action:** If **Yes**, proceed to **Verdict B** (Mediating Clause) or **Verdict E** (Escalate) if the implication is politically charged (e.g., explaining poverty or conflict).

  ### Step 2: The Agency Availability Check (False Human Agency Risk)
  **Question:** If you rewrite this to make humans the subject, would you have to invent a choice, foresight, or option that did not exist?
  *   **Sufficient Answer for "Yes":** To make humans the subject, you would need to write something like "The farmers chose to let the drought happen" or "The king decided the smallpox would kill the heirs."
  *   **Insufficient Answer:** You can easily name a group who failed to prepare (e.g., "The city council failed to store grain").
  *   **Action:** If **Yes** (you cannot restore humans without lying), **Verdict A** (Leave as is) is preferred. Do not force human subjects where there were no human choices.

  ### Step 3: The Trigger vs. Vulnerability Check (Collapsing Causes)
  **Question:** Does the sentence treat a background vulnerability (long-term) and a trigger (short-term) as the same thing?
  *   **Sufficient Answer for "Yes":** The sentence says "The drought caused the collapse" when the drought was the trigger, but the collapse was caused by *lack of storage* or *political instability* (the vulnerability).
  *   **Insufficient Answer:** The sentence acknowledges both (e.g., "The drought broke the weakened system").
  *   **Action:** If **Yes**, proceed to **Verdict B** (Mediating Clause).

  ### Step 4: The Political Charge Check (Values & Pedagogy)
  **Question:** Does attributing this cause to a non-human factor obscure a history of extraction, oppression, or policy failure that we are required to teach?
  *   **Sufficient Answer for "Yes":** The passage explains regional inequality, conflict, or poverty by citing climate or disease, where historical consensus points to colonialism, war, or economic policy.
  *   **Action:** If **Yes**, you must **Verdict E** (Escalate). This is a values/pedagogy call, not a copyediting one.

  ---

  ## Verdict Menu

  Select one of the following based on the Procedure above:

  *   **A. Leave as is.** (Non-human factor is a valid, direct cause; no human agency was available; no determinism implied.)
  *   **B. Leave with a required mediating clause added.** (Non-human factor is real, but the sentence implies inevitability or collapses trigger/vulnerability. Add phrases like *"exacerbated by," "in the absence of," "interacting with."*)
  *   **C. Rewrite with the human decision-makers restored.** (Humans *did* have a choice or policy option that drove the outcome. The current sentence hides this.)
  *   **D. Delete the causal claim.** (The causal link is factually incorrect or too speculative for this level.)
  *   **E. Escalate to a subject-matter editor.** (The sentence involves political charge, historiographical debate, or values judgments beyond copyediting scope.)

  ---

  ## Application to Draft Passages

  Here is the application of NHA-1 to your three sample passages.

  ### Passage One
  > "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."

  *   **Step 1 (Inevitability):** No. It describes a specific shock, not a permanent geographic destiny.
  *   **Step 2 (Agency Availability):** Yes. Humans could not "choose" to stop smallpox in an immunologically naive population. Rewriting this to "The people failed to stop smallpox" implies they had the capacity to do so.
  *   **Step 3 (Trigger/Vulnerability):** No. The death of the specific leadership line is a direct biological consequence.
  *   **Step 4 (Political Charge):** No. This is a standard epidemiological claim regarding the Columbian Exchange.
  *   **Verdict:** **A. Leave as is.**
  *   **Editor's Note:** The non-human subject is accurate here. Immunology is not a human decision.

  ### Passage Two
  > "The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."

  *   **Step 1 (Inevitability):** Yes. It implies the eruption *caused* the government change directly.
  *   **Step 2 (Agency Availability):** No. Governments do not fall automatically due to hunger; opponents seize power. Humans *did* make decisions to overthrow the government using the crisis.
  *   **Step 3 (Trigger/Vulnerability):** Yes. It collapses the trigger (eruption) with the political mechanism (regime change).
  *   **Step 4 (Political Charge):** Low, but risks erasing political agency.
  *   **Verdict:** **B. Leave with a required mediating clause added.**
  *   **Edited Sentence:** "The eruption took the harvest. By spring the price of rye had tripled; by midsummer, **amid the unrest,** the city had a new government."
      *   *Alternative:* "...by midsummer the city had a new government, **installed by rivals exploiting the famine.**" (Use this if space allows).

  ### Passage Three (Unit Opener)
  > "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."

  *   **Step 1 (Inevitability):** **Yes.** "Simply stopped" implies the dynasty had no agency, no allies, no army, and no options. It suggests climate destiny.
  *   **Step 2 (Agency Availability):** **Yes.** Dynasties survive famines through trade, war, relief, or abdication. "Simply stopped" erases the human end of the dynasty (overthrow, suicide, treaty).
  *   **Step 3 (Trigger/Vulnerability):** **Yes.** It treats the cold as the sole cause of the political end.
  *   **Step 4 (Political Charge):** **Yes.** This is your Unit Opener. It sets a tone of environmental determinism for the whole volume.
  *   **Verdict:** **E. Escalate to a subject-matter editor.** (However, per your request for a replacement sentence if it cannot stand:)
  *   **Director's Decision:** This sentence cannot stand as written. It violates Step 1 and Step 2. It teaches students that politics dissolves into weather.
  *   **Replacement Sentence:** "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, **and the state lost the power to hold the throne.**"
      *   *Why:* This keeps the rhythm and the environmental cause but shifts the final clause to a political condition ("lost the power") rather than a biological cessation ("stopped").

  ---

  ## Calibration Test Bank

  Use these five sentences to check that your team is applying NHA-1 consistently. Compare your verdicts with the Key.

  1.  **"The desert made the tribe nomadic."**
      *   *Key:* **C (Rewrite)**. Implies determinism. Humans *chose* nomadism as an adaptation. Better: "The tribe adopted a nomadic life to survive the desert."
  2.  **"The earthquake destroyed the port."**
      *   *Key:* **A (Leave as is)**. Physical causation. No human decision could stop the earthquake's physical impact.
  3.  **"The blight caused the famine."**
      *   *Key:* **B (Mediating Clause)**. Blight causes crop failure; policy/storage determines famine. Better: "The blight destroyed the crops, leading to famine **in the absence of imports.**"
  4.  **"The river's location determined the city's wealth."**
      *   *Key:* **E (Escalate)**. High political charge. "Determined" is a strong deterministic claim that may obscure trade policy, labor, or exploitation.
  5.  **"The general surrendered because the mud stopped his cannons."**
      *   *Key:* **A (Leave as is)**. Valid constraint. The mud physically prevented action; the general's choice was constrained by physics, not invented by the sentence.

  ---

  ## Limitations Statement

  **What This Procedure Cannot Do**

  1.  **Resolve Historiographical Disputes:** If historians disagree on whether a factor was primary (e.g., "Did climate change cause the Bronze Age Collapse?"), this checklist cannot settle it. It will flag these for Escalation (Verdict E), but it cannot generate truth.
  2.  **Eliminate the Vividness/Precision Tradeoff:** At a ninth-grade reading level, "The drought caused the war" is clearer than "The drought created resource scarcity which exacerbated existing tensions leading to war." This procedure prioritizes accuracy, but it cannot make complex causality sound simple without some loss of nuance. You will still have to judge when simplicity becomes misleading.
  3.  **Detect Implicit Bias in Word Choice:** The procedure checks grammatical subjects. It does not catch coded language (e.g., describing one group's adaptation as " ingenuity" and another's as "migration") unless it violates the specific causal rules above.
  4.  **Replace Subject Knowledge:** A copy editor applying this to a region they know nothing about may fail the "Counterfactual Check." If the editor does not know if drought *usually* causes collapse, they must Escalate. The procedure relies on the editor knowing when they *don't* know.

  **Final Note:** This protocol is a filter, not a generator. It stops bad history; it does not write good history. When in doubt, Verdict E (Escalate) is always the safer choice for a copy editor.
