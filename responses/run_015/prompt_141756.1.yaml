  # The Takeoff Taxonomy Instrument

  ## Part 1: The Diagnostic Space

  Before assigning views, we define the logical space. There are **eight diagnostic questions** below. Each is a binary choice based on a concrete scenario. Theoretically, answering all eight creates a vector of length eight ($2^8 = 256$ possible combinations).

  However, this tree is not a questionnaire; it is a decision structure. You only answer the questions required to reach a leaf. The **eight to ten leaves** represent the only coherent, occupied regions of this 256-point space. The remaining ~247 combinations are unoccupied.

  **The Eight Diagnostic Questions**

  1.  **Q1 (Capability vs. Power):** It is 2028. Benchmarks for coding and math double every four months for two years, but GDP growth remains at 2% due to liability rules and verification costs. Is the "takeoff" happening in the lab (benchmarks) or in the economy (GDP)?
  2.  **Q2 (Local vs. Global):** It is 2032. One lab's systems now do essentially all of the ML research that lab does internally, but the outside world looks basically unchanged, GDP growth is 2.4%, and nobody has heard of the lab. Is that an intelligence explosion already underway?
  3.  **Q3 (Self-Model):** A system proposes a new architecture that reduces training compute by 50%. Must the system be able to explain *why* the change works in natural language to a human researcher, or is blind search sufficient for "improvement"?
  4.  **Q4 (Multipolar):** Three labs are within about three months of each other on the same capability milestones, and none of them can verify what the others have. Does this race condition prevent a single decisive outcome?
  5.  **Q5 (Saturation):** Capabilities on your favourite benchmark double every four months for two years, then stop improving despite 10x more compute. Did takeoff fail?
  6.  **Q6 (Profile Bottleneck):** A system is roughly ten times better than the best human at writing and reviewing research code, and at human level or below at basically everything else, including long-horizon planning and persuasion. Does this bottleneck prevent economic dominance?
  7.  **Q7 (Calendar vs. Doublings):** A takeoff takes nine months of calendar time but involves 100 doublings of effective cognitive labour. Is this "fast"?
  8.  **Q8 (Object vs. Services):** Capabilities arrive as a pile of services and there's no sharp moment or central agent. Is there a "takeoff" event?

  ---

  ## Part 2: The Decision Tree

  *Instructions: Start at Node 1. Answer the scenario question. Follow the branch. Stop when you reach a Leaf.*

  **Node 1 (Q1: Capability vs. Power)**
  *   **Branch A (Lab/Benchmarks):** The explosion is in cognitive capacity, regardless of GDP. → Go to **Node 2**.
  *   **Branch B (Economy/GDP):** The explosion is only real when power converts to output. → Go to **Node 3**.

  **Node 2 (Q2: Local vs. Global)**
  *   **Branch A (Yes, Local):** A hidden lab explosion counts. → Go to **Node 4**.
  *   **Branch B (No, Global):** It must affect the outside world to count. → Go to **Node 5**.

  **Node 3 (Q6: Profile Bottleneck)**
  *   **Branch A (Yes, Bottleneck):** Narrow coding skill cannot dominate. → Go to **Node 6**.
  *   **Branch B (No, No Bottleneck):** Narrow skill is sufficient for dominance. → Go to **Node 7**.

  **Node 4 (Q3: Self-Model)**
  *   **Branch A (Yes, Explainable):** It needs to understand its own improvement. → **Leaf 1**.
  *   **Branch B (No, Blind):** Blind optimization counts as explosion. → **Leaf 2**.

  **Node 5 (Q4: Multipolar)**
  *   **Branch A (Yes, Prevents):** The race fragments the outcome. → Go to **Node 8**.
  *   **Branch B (No, Consolidates):** One path wins or they merge. → **Leaf 3**.

  **Node 6 (Q8: Object vs. Services)**
  *   **Branch A (Yes, Services):** No central agent, just API pile. → **Leaf 4**.
  *   **Branch B (No, Agent):** A specific operator/system wins. → **Leaf 5**.

  **Node 7 (Q7: Calendar vs. Doublings)**
  *   **Branch A (Yes, Calendar):** 9 months is fast. → **Leaf 6**.
  *   **Branch B (No, Doublings):** 100 doublings is fast, even if years pass. → **Leaf 7**.

  **Node 8 (Q5: Saturation)**
  *   **Branch A (Yes, Failed):** Hitting a wall means no takeoff. → **Leaf 8**.
  *   **Branch B (No, Continue):** Progress resumes or wall is high enough. → **Leaf 9**.

  ---

  ## Part 3: The Leaves (Views & Commitments)

  | Leaf | Path | View Name | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | 1A → 2A → 4A | **Hard Takeoff (RSI)** | You must accept that a single opaque box could recursively rewrite itself into godhood without external economic feedback validating it first. |
  | **2** | 1A → 2A → 4B | **Blind Local Explosion** | You must accept that "intelligence" can explode via brute-force search without the system ever modeling *why* it is getting smarter. |
  | **3** | 1A → 2B → 5B | **Fast Continuous Ramp** | You must accept that global economic drag will vanish instantly the moment capabilities cross a specific threshold, with no institutional lag. |
  | **4** | 1B → 3A → 6A | **No-Single-Object** | You must accept that "AI" is a misleading noun; there is no "it" to take off, only a thousand APIs getting slightly cheaper. |
  | **5** | 1B → 3A → 6B | **Narrow Power Shift** | You must accept that a tool which cannot plan or persuade can still seize economic dominance solely by automating code. |
  | **6** | 1B → 3B → 7A | **Fast Continuous (Power)** | You must accept that a 9-month window is sufficient for society to reorganize around a new power structure without collapsing. |
  | **7** | 1B → 3B → 7B | **Slow Diffused** | You must accept that a process taking six years of calendar time counts as "fast takeoff" simply because cognitive doublings are high. |
  | **8** | 1A → 2B → 5A → 8A | **Plateau / Saturate** | You must accept that intelligence has a hard ceiling discoverable by current ML methods, beyond which more compute yields nothing. |
  | **9** | 1A → 2B → 5A → 8B | **Multipolar Sprint** | You must accept that three competing labs will not accidentally merge or leak, maintaining a unstable standoff through the critical period. |

  ### Indistinguishable Leaves Warning
  **Leaf 3 (Fast Continuous Ramp)** and **Leaf 6 (Fast Continuous - Power)** are empirically difficult to separate. Both predict a rapid rise in observable output. The distinction is theoretical (Capability-driven vs. Power-driven). If your group cares about *what happens to GDP*, these two leaves are functionally identical.

  ---

  ## Part 4: Space Analysis (Occupied vs. Unoccupied)

  The theoretical space contains 256 answer combinations. Only 9 paths are valid. Below are diagnoses for why the major unoccupied regions are empty.

  *   **Region: Local + Power-Driven (1B → 2A)**
      *   *Diagnosis:* **Incoherent.** You cannot claim the explosion is defined by GDP (1B) while simultaneously claiming a hidden lab with no GDP impact counts (2A).
  *   **Region: Global + Self-Model (1A → 2B → 4A)**
      *   *Diagnosis:* **Unexplored/Unattractive.** If the explosion is global/visible, the "Self-Model" distinction (Node 4) becomes less load-bearing than the market dynamics (Node 5). This path is usually collapsed into the Multipolar/Ramp leaves.
  *   **Region: Bottleneck + Calendar-Fast (1B → 3A → 7A)**
      *   *Diagnosis:* **Incoherent.** If you believe narrow capabilities are bottlenecked by persuasion/liability (3A), you logically cannot believe the economic conversion happens in 9 months (7A). The bottleneck enforces slowness.
  *   **Region: Multipolar + Saturation (1A → 2B → 5A → 8A)**
      *   *Diagnosis:* **Merely Unexplored.** A "Multipolar Plateau" is possible (everyone hits the wall at once), but forecasters usually treat Saturation as a global property that kills the race dynamics entirely, so this path is rarely claimed.
  *   **Region: Services + Self-Model (1B → 3A → 6A → 4A)**
      *   *Diagnosis:* **Incoherent.** If there is no central agent/object (6A), there is no single system to possess a self-model (Node 4). The questions conflict.

  ---

  ## Part 5: Usage Notes for the Group

  1.  **Do not skip nodes.** If you land on Node 4, you must answer Q3. You cannot say "I believe in RSI so I stop here." The tree forces you to specify *which kind* of RSI.
  2.  **Calendar Time vs. Doublings (Node 7).** This is the most common source of arguments. If Person A lands on Leaf 6 and Person B lands on Leaf 7, you agree on the *cognitive* speed but disagree on the *societal* speed. Stop arguing about "fast" and argue about institutional drag.
  3.  **The "Narrow Path" (Leaf 5).** This is the specific home for "Tool AI" arguments that still result in disruption. If someone says "AGI isn't needed for collapse," they likely live here.
  4.  **Legibility.** Note that Leaves 1 and 2 (Local) imply the takeoff is illegible to the outside world until it is too late. Leaves 3, 6, 7, 8, 9 imply legibility. This is a sharper split than "Soft vs Hard" takeoff.
