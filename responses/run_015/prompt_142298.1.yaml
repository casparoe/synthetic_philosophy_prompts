      *   **Pricing the Alternatives:**
          *   *Keep Purity & Basing:* Essential for the theory.
          *   *Reject Transmission:* The cheapest cost. Explain why (distinction between etiology and justification).
          *   *Reject Reasons-First:* Too drastic.
      *   **Evidentialism Comparison:**
          *   Yes, a similar argument threatens Evidentialism (Pragmatic Encroachment debates).
          *   Asymmetry: In epistemology, the *status* of the belief (justified/unjustified) depends on etiology. In value theory, the *fittingness* of the attitude depends on the object's properties.
