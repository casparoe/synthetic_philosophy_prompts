      *   **Introduction:** Validate the user's suspicion. The argument is seductive but flawed. The break is at **(5) Transmission** combined with a category mistake in **(7)**.
      *   **Diagnosing the Joint:**
          *   Distinguish *Reasons for Attitudes* from *Causes of Beliefs*.
          *   The "Basing" relation in (4) refers to the *normative ground* (the consideration), not the *psychological etiology*.
          *   In (7), the pragmatic consideration explains the *causal origin* of the belief, but it does not become the *normative basis* for the admiration. The normative basis for admiration is the *trustworthiness* (the content), which is an RKR.
