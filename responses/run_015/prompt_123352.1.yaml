          *   *Rebuttal to Maya:* She is smuggling logical omniscience back in via the "stutter-step."

      *   **Technical Background (Mental Check):**
          *   *Löb's Theorem:* In Peano Arithmetic (PA), if $PA \vdash \text{Prov}(\ulcorner p \urcorner) \to p$, then $PA \vdash p$.
