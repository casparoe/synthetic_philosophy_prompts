answer: |-
  1. Applying *śabda* to statistical prediction breaks the framework because an LLM cannot qualify as an *āpta*, lacking both direct acquaintance with reality and the intention to convey truth.
  2. This failure forces the user to shift the epistemic burden entirely onto *pratyakṣa*, requiring direct perception or empirical verification for every claim rather than accepting testimony.
  3. Consequently, *anumāna* becomes the primary tool to judge internal coherence, yet inference alone cannot establish truth without valid major premises grounded in reality outside the model.
  4. *Upamāna* is critically stressed as users attempt to map outputs to known standards, but analogy fails when the model generates novel hallucinations without real-world referents.
  5. Ultimately, treating LLM outputs as knowledge reduces Nyāya epistemology to a rigorous skepticism where the machine is merely an object of inference, never a valid subject of testimony.
