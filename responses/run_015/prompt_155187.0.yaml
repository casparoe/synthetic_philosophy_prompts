  **Joint Statement on Linguistic Reform and Semantic Stability**

  **I. Agreed Claims**
  1.  **Limits of Satire:** Hofstadter's method—exposing the "son" morpheme to rebuild compounds—shows that morphological scrutiny can destabilize any term. However, this *reductio* proves only that etymology is not destiny; it establishes no empirical facts about current cognitive processing or social harm without data.
  2.  **Three-Layer Distinction:** We distinguish *conventional meaning* (public truth conditions), *default imagery* (private cognitive associations evoked by the term), and *policy obligation* (institutional mandates). Disagreements often arise from conflating these layers.
  3.  **Need for Data:** Anecdotal intuitions of absurdity or bias must be validated against controlled paraphrase tasks or mental-imagery datasets. Neither side accepts policy changes based solely on philosophical intuition or satirical plausibility.

  **II. Disagreements**

  | Issue | Reformer Wording | Conservative Wording |
  | :--- | :--- | :--- |
  | **Status of the Term** | The traditional term is *default-loaded*: its official neutrality is undermined by male imagery that actively functions in semantic processing. | The traditional term is *semantically neutral*: male imagery is an extralinguistic psychological association, irrelevant to conventional meaning. |
  | **Justification for Change** | Verified default-loadedness warrants institutional mandates to shift cognitive defaults via new roots. | Verified associations warrant targeted education; mandated roots are symbolic politics that fail to touch underlying stereotypes. |

  **III. Verbal vs. Genuine Dispute**
  A verbal dispute exists regarding the definition of "semantic property." If semantics includes psychological priming, the Reformer wins; if restricted to truth conditions, the Conservative wins. We agree to avoid forcing either side to adopt the other's loaded labels regarding "neutrality" or "loading." However, a genuine dispute remains regarding *causal efficacy*: does changing vocabulary actually alter stereotypes and behavior, or does it merely signal virtue while leaving biases intact? We agree this empirical question is decidable.

  **IV. Cruxes and Tests**

  **Crux 1: Semantic Property vs. Psychological Association**
  *   **Question:** Is default-loadedness a feature of language structure or mere mental habit?
  *   **Test:** A psycholinguistic priming study where subjects verify sentences like "Nurses are compassionate" after exposure to "mankind" vs. "humanity."
  *   **Reformer Prediction:** "Mankind" significantly slows verification of female-associated roles compared to "humanity," indicating semantic interference affecting judgment.
  *   **Conservative Prediction:** Reaction times may vary slightly, but truth-value judgments on generic claims (e.g., "Humans are mortal") remain identical across terms, proving semantic neutrality.

  **Crux 2: Mandates vs. Targeted Intervention**
  *   **Question:** Does institutional language change drive social change?
  *   **Test:** A natural experiment where a major legal jurisdiction switches style guides from "mankind" to "humanity" while keeping anti-discrimination enforcement constant.
  *   **Reformer Prediction:** Downstream hiring data will show increased female applicant pools within three years, citing reduced cognitive exclusion in professional self-conception.
  *   **Conservative Prediction:** Hiring outcomes will remain statistically unchanged; the shift will only produce compliance costs and textual friction without touching underlying stereotypes.

  We commit to updating this statement based on the results of such data, acknowledging that good-faith collaboration requires submitting our convictions to empirical falsification.
