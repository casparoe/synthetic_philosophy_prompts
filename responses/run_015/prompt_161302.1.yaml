answer: |-
  You have put your finger on the central nerve of the modern philosophy of time. You are not confused; you are noticing a structural tension that keeps professional philosophers of physics awake at night. The move you are describing does not have a single, universally agreed-upon label like *ad hominem* or *modus ponens*, but it is a recognised beast.

  Here are the three nearest existing concepts, how your observation differs from them, and then a proposed name for the specific move you have isolated.

  ### The Three Nearest Concepts

  **1. Begging the Question (*Petitio Principii*)**
  *   **What it is:** An argument where the conclusion is assumed in the premise. (e.g., "We know the past had low entropy because the past had low entropy.")
  *   **How yours differs:** As you rightly noted, your case is not a simple circle within one argument. It is a triangle. Claim A (Entropy rises) explains Claim B (Records exist). Claim B (Records exist) evidences Claim C (Past was low entropy). Claim C (Past was low entropy) explains Claim A (Entropy rises). Nothing is strictly assumed *inside* its own proof; rather, two separate explanatory projects lean on one another. Begging the question is a logical fault in a single deduction; your problem is a structural dependency between two fields (thermodynamics and epistemology).

  **2. Epistemic Bootstrapping**
  *   **What it is:** A term from epistemology (notably Stewart Cohen) describing when a source of belief is used to verify its own reliability. (e.g., "I trust my gas gauge because it says the tank is full, and the tank is indeed full according to the gauge.")
  *   **How yours differs:** This is the closest fit. Your "records" are the gauge, and the "entropy law" is the fuel system. However, standard bootstrapping is usually discussed regarding human faculties (vision, memory). Your case is distinct because it bridges the physical (entropy) and the epistemic (knowledge of the past). It is not just that our *belief* is bootstrapped, but that the *physical asymmetry* itself seems to be.

  **3. Coherentism**
  *   **What it is:** The view that beliefs are justified not by a foundation, but by how well they hang together with other beliefs. This is the "patching one claim with another" defence you mentioned.
  *   **How yours differs:** Coherentism is a general theory of justification. It says *all* knowledge is like this. Your intuition is that *this specific instance* feels different from, say, using a map to find a town and the town to verify the map. You suspect there is a specific fault in *this* loop that doesn't apply to *all* loops. Coherentism swallows the problem; it doesn't name the specific shape of it.

  ### The Coinage: **The Record-Boundary Loop**

  Since no existing term captures the specific friction between the *physical boundary condition* and the *evidential record*, I propose we call this **The Record-Boundary Loop**.

  **Definition:** A Record-Boundary Loop occurs when the existence of a physical record is used to infer a boundary condition (the past state), while the physical validity of that record relies on the very asymmetry generated by that boundary condition.

  **The Edges:**
  *   **What counts:** Any argument where the *direction* of a physical law is justified by a boundary condition, but the *knowledge* of that boundary condition relies on traces produced by that law.
  *   **What doesn't:** Using a tree ring to date a fire. Here, the biology of trees (the record mechanism) is established independently of the specific fire (the boundary event). We know how trees grow from observing many trees, not just this one.
  *   **Physics vs. Psychology:** Your two cases are indeed one phenomenon. A memory is a neural record; a tape magnetisation is a physical record. Both are "bunched-up" structures (low entropy locally) paid for by spreading entropy elsewhere. The loop is identical because the brain is a physical system subject to the same thermodynamics as the tape.

  ### The Test: **Independent Ensemble Access**

  You asked for a test to separate a "bad version" (vicious) from an "honest one" (virtuous). This is the crucial carving.

  The difference between your coffee cup and the Universe is not the logic; it is the **sample size**.

  **The Test:** Can we observe the record-making process *independently* of the specific event being recorded?

  1.  **The Coffee Cup (Honest):**
      *   *The Loop:* We infer the cream was unmixed in the past because it is mixed now. We know mixing happens because of entropy.
      *   *The Escape:* We have **Independent Ensemble Access**. We have seen thousands of cups of coffee being poured. We have observed the causal process (pouring) directly, not just inferred it from the mixture. We can calibrate the "record" (the swirl) against the "cause" (the spoon) in other instances. The law is tested elsewhere; the record is just an application.

  2.  **The Universe (Vicious):**
      *   *The Loop:* We infer the Big Bang was low entropy because we have records (light, rocks). We know these are reliable records because entropy rises.
      *   *The Trap:* We have **No Independent Ensemble Access**. We have only one Universe. We cannot step outside of time to watch a Big Bang happen and verify that it produces records. We cannot calibrate the "record" (fossil) against the "cause" (ancient life) in a separate instance. We are using the records to prove the law, and the law to prove the records, with no third party to adjudicate.

  **Why this matters for your work:**
  When you restore a tape, you are not in the "Universe" trap. You know magnetic tape exists because you have seen the factory, the machine, and the engineer. You have Independent Ensemble Access to the recording process. If you found a magnetised strip of plastic on a distant planet with no context, you would be in the Record-Boundary Loop: you couldn't be sure it was a "recording" (low entropy order) rather than a random fluctuation (high entropy noise) without assuming the thermodynamic history of that planet.

  ### Summary

  The move is **The Record-Boundary Loop**. It is a specific species of **Epistemic Bootstrapping** that becomes vicious when **Independent Ensemble Access** is missing.

  Your intuition is correct: the "patching" defence is too quick. It is fine to patch claims when you can test the patches against the world. It is dangerous when the only world you have is made of the patches themselves. In the case of the Universe's arrow of time, we are, as it were, trying to verify the tape by listening to the tape, without ever having seen the recorder.
