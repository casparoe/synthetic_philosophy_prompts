answer: |-
  This is a classic meta-ontological standoff. Your group has stumbled into the debate between **metaphysical realism** (Maya) and **quantifier variance / deflationism** (Ross). The slogan "it's merely verbal" is doing too much heavy lifting; it conflates several distinct philosophical theses.

  Here is the menu of claims underlying that slogan, evaluated for their logical strength and their ability to support Ross's "stop arguing" conclusion.

  ### The Menu: Five Readings of "Merely Verbal"

  **(a) The Disambiguation Claim**
  *   **The Claim:** The word "same" (or "band," "university") is ambiguous. Maya means *same-as-x* (e.g., same legal charter), Ross means *same-as-y* (e.g., same causal continuity of members). Once we stipulate definitions, the disagreement vanishes.
  *   **Verdict:** **Trivial (and often false as a full explanation).**
  *   **Analysis:** In simple cases, this is true. But in metaphysics, the dispute is usually about *which* criterion is the *correct* one for the kind of thing in question. If Maya argues that the *correct* criterion for universities is legal continuity, and Ross argues it's causal continuity, they aren't just using words differently; they are disagreeing about the nature of universities. Disambiguation doesn't solve normative/conceptual disputes.
  *   **Does it license Ross?** No. It just moves the argument to "Which definition is best?"
  *   **Confidence:** **High.** (This is standard diagnostic procedure, but rarely resolves deep metaphysical disputes.)

  **(b) The Framework Relativity Claim**
  *   **The Claim:** The truth of the sentence "This is the same university" varies depending on the conceptual or linguistic framework adopted. There is no "framework-neutral" fact of the matter that selects one framework as the One True Ontology.
  *   **Verdict:** **Substantive and Defensible (but controversial).**
  *   **Analysis:** This is the Carnapian/Quinean line. It asserts anti-realism about ontology. It claims reality doesn't come pre-sliced into "objects"; we slice it.
  *   **Does it license Ross?** **Yes.** If there is no framework-neutral fact, then arguing for one "true" answer is a category error. You can only argue pragmatically ("Is this framework useful?").
  *   **Confidence:** **Medium.** (Defensible, but relies on a heavy anti-realist metaphysics which many reject.)

  **(c) The Non-Truth-Apt Claim (Expressivism/Error Theory)**
  *   **The Claim:** Sentences about persistence/identity over time in these borderline cases do not express propositions. They are like commands or expressions of attitude. Asking if it's "true" is like asking if "Ouch!" is true.
  *   **Verdict:** **Substantive and Radical (likely false for this case).**
  *   **Analysis:** This is usually reserved for ethics or modality. Applying it to ordinary objects (universities, bands) is extremely costly. It implies our ordinary discourse about history is systematically flawed.
  *   **Does it license Ross?** **Yes.** If there's no truth value, there's nothing to be right about.
  *   **Confidence:** **Medium-Low.** (Hard to defend for empirical/historical claims without undermining too much else.)

  **(d) The Ontic Vagueness Claim**
  *   **The Claim:** The world itself is indeterminate here. It is not that our words are vague, but that reality hasn't "decided" whether the 1841 seminary is the 2025 university.
  *   **Verdict:** **Substantive (but undermines Ross).**
  *   **Analysis:** This posits a *fact* of indeterminacy. It is a metaphysical claim about the world, not a linguistic claim about our words.
  *   **Does it license Ross?** **No.** Ross says "it's just words." This claim says "it's the world." It validates Maya's intuition that there is a metaphysical issue, even if the answer is "indeterminate."
  *   **Confidence:** **High.** (This is a coherent metaphysical position, but it contradicts Ross's "merely verbal" slogan.)

  **(e) The Analytic Triviality Claim**
  *   **The Claim:** There is a determinate answer, but it is analytic (true by definition). E.g., "If 'university' means legal charter, then yes." It's a fact, but a boring one.
  *   **Verdict:** **Trivial.**
  *   **Analysis:** This concedes there is a fact of the matter, just a shallow one.
  *   **Does it license Ross?** **No.** Maya can say, "Exactly, and the fact is X, so I'm right." Ross can't tell her to stop arguing if one side is objectively correct by definition.
  *   **Confidence:** **High.**

  ---

  ### The "Agree on All Non-Linguistic Facts" Test

  Ross's move here is to invoke a criterion often associated with David Chalmers: *A dispute is merely verbal if the parties agree on all non-linguistic facts but disagree on the sentence.*

  **Does this test get off the ground in the university case?**
  **Verdict:** **No (or it begs the question).**
  **Confidence:** **High.**

  **Why:** To list the "shared non-linguistic facts," you must choose a vocabulary.
  *   If Ross lists only physical facts ("There was a building in 1841," "There are people teaching now"), Maya will object: "You've left out the *institutional* facts. The university is an abstract social object, not a building."
  *   If Ross includes institutional facts ("There is a legal continuity of charter"), Maya says "Then we agree it's the same!" and Ross says "No we don't."
  *   If Ross excludes institutional facts to keep them "non-linguistic," he is presupposing a physicalist ontology. He is effectively defining "fact" as "non-institutional fact."

  **The Precise Failure:** You cannot state the "non-linguistic facts" without already settling the ontological question of *what exists*. If universities exist, facts about universities are non-linguistic facts. By excluding them from the "shared facts" list, Ross has already assumed universities *don't* exist (or don't count as real). He is using the test to prove the conclusion he presupposed. Maya is correct: knowing what the words mean *is* knowing which facts matter.

  ---

  ### Internal vs. External Questions

  **The Distinction:**
  This comes from **Rudolf Carnap** (*Empiricism, Semantics, and Ontology*, 1950).
  *   **Internal Questions:** Asked *within* a linguistic framework (e.g., "Is there a prime number greater than 100?"). These have truth values.
  *   **External Questions:** Asked *about* the framework itself (e.g., "Do numbers exist?"). Carnap argues these are not theoretical questions with true/false answers, but **pragmatic** questions ("Should we adopt a framework that includes numbers?").

  **Mapping:**
  This aligns with **Option (b) (Framework Relativity)**.

  **What it adds:**
  It explains *why* the argument feels stuck. Maya is treating the question as **Internal** (asking for a truth within the framework of historical institutions). Ross is treating it as **External** (asking whether we should *use* that framework).
  *   **Value:** It dissolves the conflict by changing the subject from "Truth" to "Utility."
  *   **Limitation:** Most contemporary metaphysicians (including Maya, likely) reject Carnap's sharp distinction. They argue that "Should we adopt this framework?" *depends* on whether the framework corresponds to reality. If universities really persist, we *should* adopt the framework that captures that. So the External question collapses back into an Internal one.

  ---

  ### Which Reading Licenses Ross's Conclusion?

  Ross wants to say: *"Stop arguing, there's nothing here to be right about."*

  *   **Options (a) and (e)** fail him. They admit there is a right answer (either by stipulation or definition). Maya wins here.
  *   **Option (d)** fails him. It admits there is a metaphysical fact (indeterminacy). Maya wins here (she was right that it's about the world, not words).
  *   **Option (c)** helps him, but is too radical. It makes all history talk nonsense.
  *   **Option (b) (Framework Relativity)** is the **only viable path for Ross.**

  **However,** Option (b) is not a "get out of jail free" card. It is itself a **substantive metaphysical claim**. To say "There is no framework-neutral fact" is to make a claim about the nature of reality (that it is ontologically pluralistic or deflated).
  *   **Maya's Counter:** She can argue that *her* realism is the better framework because it explains the data better (e.g., why we owe debts to the 1841 founders).
  *   **Result:** Ross hasn't escaped metaphysics; he's just done a different kind. He can't tell Maya to "stop arguing" unless he can prove Anti-Realism is true. If Anti-Realism is just one framework among others, Maya is entitled to stay in her Realist framework.

  **Confidence in this verdict:** **High.** (This is the standard "Meta-ontology" critique of deflationism, e.g., by Sider or Thomasson.)

  ---

  ### The "Least Sure" Claim (Flagged for Uncertainty)

  I am flagging my verdict on **Option (b): The Framework Relativity Claim.**

  *   **My Verdict:** Substantive and Defensible.
  *   **Confidence:** **Medium.**
  *   **Why the Uncertainty:** The status of "framework-relative truth" is the most volatile area in contemporary meta-ontology.
      1.  **The Self-Refutation Risk:** If "There are no framework-neutral facts" is itself a framework-neutral fact, the view refutes itself. If it is only true *within* an anti-realist framework, then Realists (Maya) can ignore it. Navigating this without paradox is notoriously difficult.
      2.  **The "Carving" Problem:** Recent work (e.g., by Ted Sider) argues that even if quantifiers vary, some frameworks "carve nature at its joints" better than others. If one framework is *more objective* (even if not uniquely true), Ross's "stop arguing" loses force. We should argue about which framework is *better*, not just which is *useful*.
      3.  **Why I'm not Low Confidence:** It is definitely a coherent position (Carnap, Putnam, Hirsch defend variants). But whether it successfully *dissolves* the dispute (as Ross wants) or just *relocates* it (to pragmatic choice) is a matter of ongoing, unresolved debate.

  **Recommendation for your group:**
  Tell Ross that if he wants to win, he can't just say "it's verbal." He has to argue for **Carnapian Anti-Realism (Option b)**. But tell Maya she is allowed to say, "Okay, even if it's a choice of framework, my framework is *better* because it captures the normative reality of institutional debt/identity." That moves the argument from "Is it true?" to "Is it useful/accurate?" which is often where the real philosophical work happens.
