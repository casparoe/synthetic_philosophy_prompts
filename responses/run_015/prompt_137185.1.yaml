  I'm in a small reading group that's slowly working through some metaphysics, and last night we got completely stuck on two cases and I realised I don't even know what we were arguing about anymore. Case one: a 90s band called The Potholers split up in 1998, and last year three fifths of the original line-up reunited with two new people, kept the name, and put out an album; Maya says it's the same band, Ross says it's a tribute act trading on a name. Case two: my university was founded in 1841 as a tiny seminary and has since changed its name four times, moved campus twice, been re-chartered under a totally different legal structure, and dropped all religious affiliation; Maya says the thing that exists now is literally the same institution founded in 1841, so the 184-years-old claim on the website is fine, Ross says no single entity survived all that, 'the university' is a convenient fiction, and there's nothing further to be true or false. Neither would budge, and eventually Ross threw up his hands and said: this is a merely verbal dispute — we agree on all the facts, so there's no fact of the matter, it's just a matter of what 'same band' and 'same institution' mean. Then someone else chimed in with the line I've definitely heard a hundred times: if you agree on every non-linguistic fact and still disagree, you're just arguing about words. Maya shot back that this is backwards, that knowing what the words mean just is knowing which facts matter, so that test can't get any grip.

  So I don't want a verdict on the band or the university, I want the slogan taken apart. What are the distinct precise claims 'there's no fact of the matter / it's merely verbal' could be making here? Give me a menu from the boring to the wild, and for each one say whether it's trivial, substantive and defensible, or actually false or incoherent. Please cover at least these: (a) both sides would stop disagreeing once 'same' is disambiguated into 'same-as-x' and 'same-as-y'; (b) the disputed sentence's truth varies with a choice of conceptual or linguistic framework, and no framework-neutral fact selects between the frameworks; (c) the sentence isn't really truth-apt at all, so the question is a pseudo-question rather than a hard one; (d) the world itself is indeterminate here and the dispute tracks real vagueness or indeterminacy in things rather than in our words; (e) there is a perfectly determinate answer, but it's the kind of answer you could get just from competence with your own words, so it's a fact of the matter that nobody should find interesting. Also: does the 'we agree on all the facts' test even get off the ground in the university case? Try stating what the shared non-linguistic facts would have to be without helping yourself to the very notion in dispute — my notes say this is where Ross's move falls apart but I can't make it precise. Someone mentioned 'internal versus external questions', which I half remember from a lecture; if that's a real distinction that lines up with one of the readings above, say which and say what it adds that the others don't. And most importantly: tell me which of these readings would actually do the work Ross needs — which ones genuinely license 'so stop arguing, there's nothing here to be right about' — and which ones leave Maya's position completely intact, because I suspect the slogan only sounds decisive on a reading nobody would defend.

  Since I'm bringing this list back to the group, please say how confident you are in each verdict (rough numbers or just high/medium/low is fine) and single out the one claim you're least sure about and why — I'd way rather have the shaky bit flagged than have it presented as settled.
