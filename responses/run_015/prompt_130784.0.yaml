  **HILBERT GRAND HOTEL | OPERATIONS DIRECTORATE**
  **CONFIDENTIAL // INTERNAL USE ONLY**
  **SOP-8492: OCCUPANCY EVENT PLAYBOOK (REV. 4.1)**

  **1.0 GUEST INTAKE AND ROOM REINDEXING**
  Upon confirmation of a single late arrival, Front Desk must initiate Procedure Shift-1. All current guests in room $n$ are to be relocated to room $n+1$. This frees Room 1 for the new arrival. For larger groups (e.g., Infinite Coach Parties), initiate Procedure Shift-2. All current guests in room $n$ are to be relocated to room $2n$. This frees all odd-numbered rooms for the incoming cohort.

  **1.1 Sidebar: The Integer Wing (Block B)**
  Staff are reminded that Block B rooms are indexed by $\mathbb{Z}$ rather than $\mathbb{N}$. There is no Room 1 and no "next room up." Standard Shift-1 procedures will fail due to lack of origin point. To absorb arrivals into Block B, staff must apply the zigzag mapping: map Room 0 to 1, Room 1 to 2, Room -1 to 3, Room 2 to 4, etc.
  *Operational Note:* This requires reissuing keycards and reprinting signage for all existing tenants. Budget approval required for signage costs exceeding $5,000 per event. Tenants frequently dispute the logical necessity of moving from Room -5 to Room 11; refer to Lease Agreement Clause $\aleph_0$.

  **2.0 REVENUE MANAGEMENT AND BILLING**
  Per the CFO's legacy pricing model, Room $n$ is billed at $\$1/n^2$ per night. At full occupancy, total nightly revenue converges to $\pi^2/6$ (approx. $1.64). This yield is insufficient to cover night porter wages.

  **2.1 Pricing Adjustment**
  Effective immediately, all rooms will be billed at $\$1/n$ per night. This series diverges, theoretically securing infinite revenue.
  *Collections Policy:* Guests in high-index rooms (e.g., $n > 10,000$) will incur charges less than one cent. Accounts receivable cannot process fractions of a cent. Staff must enforce a Minimum Billable Amount of $0.01. Guests objecting to being charged more than their accrued rate should be informed that the difference is allocated to "Existential Overhead." Do not engage in debates regarding the harmonic series.

  **3.0 COMPETITOR DEFECTORS (CONTINUUM HOTEL)**
  Occasionally, guests from the rival Continuum Hotel (rooms indexed by $\mathbb{R}$) will seek accommodation due to zoning violations.
  *Intake Restriction:* Hilbert Grand Hotel capacity is countably infinite. There exists no bijection between our rooms and the Continuum's guest list. Do not attempt to house these guests via reindexing; physical occupancy will fail.
  *Compliance Note:* Investigations indicate the Continuum Hotel's registration database relies on finite strings over a finite alphabet. Their registry can only ever record countably many names. While their architecture claims uncountable occupancy, their actual paid occupancy is strictly $\aleph_0$. Marketing has been advised to leverage this discrepancy in Q3 advertising campaigns.

  **4.0 SHIFT LOGISTICS AND LABOUR RELATIONS**
  All reindexing events must be completed between 23:00 and 00:00. This requires a supertask schedule: the first move occurs at 23:30, the second at 23:45, the third at 23:52.5, etc.

  **4.1 Union Grievance Resolution (Ticket #992)**
  The Porter's Union has filed a grievance stating that performing infinitely many acts in one hour violates labor standards.
  *Management Response:* The grievance is denied. No individual porter is assigned infinite tasks. Each porter is assigned a finite subset of rooms (e.g., Porter A handles rooms 1–100, Porter B handles 101–200). The infinitude of the task is distributed across the workforce, not borne by any single employee. While the global state change is infinite, the local workload remains compliant with Fair Labor Standards.

  **5.0 FACILITIES AND MAINTENANCE**
  **Ticket #8841: Lobby Light Status**
  Maintenance reports the lobby light is toggled (On/Off) at every step of the supertask schedule during reindexing events.
  *Issue:* At midnight (completion of infinite toggles), the state of the light is undefined. Physics suggests a burnout; Logic suggests no final state.
  *Action:* Do not attempt to reset the switch. Do not observe the bulb directly at $t=0$. Route ticket to Legal Department for liability assessment regarding photon indeterminacy. Leave light as-is.

  **APPROVED BY:**
  *Dr. Aris Thorne*
  Director of Occupancy Solutions
  Hilbert Grand Hotel Holdings
