answer: |-
  Governor Elena of the Northern Province faces a sudden collapse of the national grid caused by foreign cyberwarfare, leaving her region with only 40% power capacity and exhausted emergency funds. Her rival, Governor Marcus of the adjacent Eastern Province, suffers identical infrastructure failure but holds legal claim to the region's only remaining functional fuel depot, though his enforcement capacity is paralyzed by local riots sparked by the blackout. Elena's administrative staff is intact but her security budget is frozen due to the crisis, while Marcus's authority is crumbling amidst the chaos. She must decide whether to negotiate a shared-resource treaty that stabilizes both regions through pooled scarcity or immediately deploy her remaining loyal police units to seize the depot and assert jurisdictional override before Marcus regains order, knowing that failure to secure the fuel means her own hospitals fail, but overextension risks total administrative collapse if the seizure triggers wider insurrection.

  **Analysis:**
  Under the adaptive interpretation, *virtù* dictates negotiating the treaty, reasoning that when *fortuna* depletes strategic reserves, the prudent leader conserves remaining strength by aligning with necessity rather than fighting the current; under the domineering interpretation, *virtù* dictates seizing the depot, reasoning that *fortuna* offers a fleeting *occasione* where the adversary is weak, and true mastery requires imposing order through bold action despite the risk. The precise feature forcing this divergence is the simultaneous crippling of the adversary and depletion of the leader's reserves; if the adversary were not crippled (strong rival), both interpretations would collapse into agreement on caution because aggression would be suicidal, whereas if the leader were not depleted (full reserves), both might agree on seizure as the risk would be negligible, eliminating the tension between conservation and imposition. A defender of the domineering reading would attack the case by claiming it unfairly rigs the stakes to make aggression appear self-destructive rather than genuinely virtuous, arguing that Machiavellian *virtù* implies the capacity to succeed where others see only ruin, so a scenario where aggression "risks total collapse" presupposes a lack of ability rather than a test of will. This charge ultimately fails because the scenario presents a calculable risk rather than certainty; Machiavelli acknowledges that *virtù* involves gambling on boldness when the times demand it, and if the adaptive view prioritizes survival above all while the domineering view prioritizes sovereignty, the conflict remains genuine regardless of the risk level.
