answer: |-
  ### The Specification: Requirements for a Darwinian Theory of Cultural Change

  **1. Demographic Sensitivity (The Tasmanian Anchor)**
  *   **Requirement:** The theory must quantify the relationship between population size/practitioner density and the retention rate of complex skills. It must predict that below a specific threshold of experts, high-complexity techniques degrade or vanish even without environmental pressure.
  *   **Why:** To explain the divergence between Population A (stable) and Population B (loss of bone needles/hooks) solely via the stochastic death of experts. A theory that relies only on adaptive value cannot explain the loss of useful techniques due to demographic accident.

  **2. Domain-Specific Fidelity Thresholds (The Fidelity Budget)**
  *   **Requirement:** The theory must specify why some cultural items (knots) sustain high copying fidelity while others (melodies) tolerate high variation, and define the minimum fidelity required for cumulative complexity (the ratchet).
  *   **Why:** To explain the "Fidelity Budget." If transmission is uniformly sloppy, complex technology cannot accumulate. If it is uniformly perfect, variation for selection is impossible. The theory must explain the mechanism that stabilizes knots but allows melodies to drift.

  **3. Storage Locality and Scaffolding (The Overnight-Extinction Test)**
  *   **Requirement:** The theory must identify where the information necessary for recovery resides: in individual minds, in artifacts, or in the social environment. It must predict recovery outcomes based on whether artifacts survive without people, or people survive without artifacts.
  *   **Why:** To pass the "Overnight-Extinction Test." If a tradition recovers from artifacts alone, the theory cannot treat the mind as the sole vehicle. If it requires a competent adult, the theory cannot treat artifacts as self-explanatory. This defines the unit of preservation.

  **4. Fitness Decoupling (The Maladaptive Spread)**
  *   **Requirement:** The theory must allow a cultural variant to increase in frequency even if it reduces the biological or material fitness of its bearer, without resorting to teleological "for-the-good-of-the-group" shortcuts.
  *   **Why:** To explain "items that spread while harming their bearers." If the theory cannot model parasitic cultural dynamics, it cannot distinguish between selection *on* culture and selection *for* the group. It forces a mechanism where the item's replicative success is distinct from the host's welfare.

  **5. Homoplasy Discrimination (The Independent Invention)**
  *   **Requirement:** The theory must provide identity conditions for cultural units that distinguish between descent with modification and independent convergence. It must specify when similarity implies common ancestry and when it implies common cognitive constraints.
  *   **Why:** To handle "multiple independent inventions." If similarity is automatically read as descent, the theory creates false lineages. The theory must count units in a corpus based on history, not just morphology.

  **6. Level Neutrality (Structural Requirement)**
  *   **Requirement:** The mechanism of selection must not presuppose that the unit of selection is the group. It must allow for selection acting on individuals, artifacts, or groups without defining the cultural item by its group benefit.
  *   **Why:** To satisfy the structural requirement that "selection can act within groups, between groups, and on individuals." Building group advantage into the definition of the trait makes the theory tautological when explaining group-level patterns.

  **7. Psychological Realism (Structural Requirement)**
  *   **Requirement:** The transmission mechanism must be compatible with reconstructive learning, prestige biases, and content biases, rather than assuming high-fidelity imitation or passive copying.
  *   **Why:** To satisfy the structural requirement of compatibility with "how people actually learn." A theory requiring robotic imitation is empirically false regarding human cognition.

  **8. Falsifiability (Structural Requirement)**
  *   **Requirement:** The theory must specify a pattern of data (e.g., a specific distribution of trait frequencies or a recovery failure) that would disconfirm it.
  *   **Why:** To satisfy the structural requirement regarding the "adaptationist-programme worry." Without this, the theory is a post-hoc story-telling device rather than a predictive model.

  **9. Scope Declaration (Structural Requirement)**
  *   **Requirement:** The theory must explicitly state which domains (technology, language, religion, etc.) it claims to cover and which it excludes.
  *   **Why:** To satisfy the structural requirement on scope. Mechanisms driving fashion may not drive law; a universal theory must explain why, or limit its claims.

  ***

  ### Classification: Non-Negotiable vs. Camp Preferences

  **Non-Negotiable (Functional Necessities)**
  *   **Demographic Sensitivity:** Without this, you cannot explain the Tasmanian loss case, which is the core puzzle of cultural accumulation vs. decay.
  *   **Fitness Decoupling:** Without this, you cannot explain maladaptive spread without resorting to mysticism or group teleology.
  *   **Falsifiability:** Without this, it is not a scientific theory.
  *   **Storage Locality:** Without this, you cannot predict recovery after the Extinction Test.

  **Camp Preferences (Methodological Commitments)**
  *   **Particulate, Countable Units:** This is a preference of the gene-analogy camp. Culture is often continuous, blended, and fuzzy. Requiring strict particulate inheritance makes the math tractable but falsifies the psychology. The requirement should be *Identifiable Lineages*, not *Digital Genes*.
  *   **Quantitative Population-Genetic Tractability:** This is a preference for formal modeling over mechanistic explanation. While desirable, insisting on closed-form equations often forces unrealistic simplifications of cognitive bias.
  *   **Strict Replicator/Vehicle Distinction:** This is a preference of Memetics. In culture, the "genotype" (instruction) and "phenotype" (artifact/behavior) are often the same thing or deeply entangled.

  ***

  ### Incompatibilities and Tensions

  **Tension 1: Stable Units/Fidelity vs. Reconstructive Transmission**
  *   **Verdict:** This is an **artefact of asking for the wrong kind of theory** (specifically, a strict gene-analogy). It is not a genuine impossibility.
  *   **Resolution:** The tension dissolves if you shift the "unit" from the mental representation to the *outcome stabilized by cognitive attractors*. Reconstruction is noisy, but if cognitive attractors funnel varied reconstructions toward the same stable output (like the knot), you get high fidelity without high-fidelity copying. The stability comes from the landscape, not the copying mechanism.

  **Tension 2: Quantitative Prediction vs. Content-Dependent Biases**
  *   **Verdict:** This is a **genuine impossibility** if you demand universal quantitative laws.
  *   **Resolution:** You must sacrifice universality for specificity. A theory that predicts exact frequencies across all domains will fail because content biases are domain-specific. The solution is to accept "mid-range theories" that are quantitative within a domain (e.g., tool tech) but qualitative across domains. You cannot have a single equation for religion and fish-hooks.

  **The Single Most Exclusionary Requirement**
  *   **Demographic Sensitivity (linked to Fidelity Thresholds).**
  *   **Why:** This requirement excludes the largest number of contenders. Purely cognitive/epidemiological models often ignore population size, focusing only on individual transmission. Purely sociological models ignore fidelity thresholds. Only a theory that links population size to information loss can pass the Tasmanian test. It forces the theory to be both population-based and information-theoretic.

  ***

  ### Theory Scores

  **Meme-as-Replicator**
  Fails Psychological Realism and Storage Locality; it assumes high-fidelity imitation and locates information solely in the mind, unable to explain the Tasmanian loss or artifact scaffolding without ad-hoc adjustments.

  **Population-Genetic Dual-Inheritance**
  Passes Demographic Sensitivity and Falsifiability but struggles with Psychological Realism and Domain-Specific Fidelity; it often treats cultural transmission as too generic to explain why knots survive better than melodies.

  **Cultural-Attractor (Epidemiological)**
  Passes Psychological Realism and Fidelity Thresholds (via attractors) but fails Demographic Sensitivity and Particulate Units; it explains stability well but struggles to model lineage loss due to small population size mathematically.

  **Cultural Group Selection**
  Passes Fitness Decoupling (at the group level) but fails Level Neutrality and Falsifiability; it often defines cultural traits by their group benefit, making it tautological when explaining group survival, and ignores within-group dynamics.
