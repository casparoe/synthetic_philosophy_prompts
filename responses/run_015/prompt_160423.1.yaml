answer: |-
  Notes

  Vale's strongest argument is that mechanism identity licenses inference: if a neural mechanism produces consciousness in humans, its presence in gliders licenses attributing consciousness, even without report. Kovač can attack the premise that mechanism identity guarantees phenomenology, citing human cases where function persists without experience (e.g., blindsight). Kovač's strongest argument is that first-person report is the only non-inferential anchor for consciousness concepts; without it, markers are uncalibrated. Vale can attack the premise that report is the *only* anchor, arguing that functional isomorphism suffices for scientific inference. Both can accept the distinction between functional capacity (computational role) and phenomenal experience (subjective feel) at the outset, even if they disagree on how to link them. This distinction allows them to agree on what gliders *do* while disputing what it *is like* to be them.

  ***

  **Dr. Mara Vale:** Let us begin with the gliders. They exhibit model-based control, meaning their behavior is guided by a representation of outcomes rather than mere habit. We know this because their performance is sensitive to outcome devaluation, where reducing the value of a reward changes their behavior, and blocking, where prior learning prevents new associations. They also guard injuries and self-administer analgesics. I argue these are behavioral and neural markers tracking specific dimensions of consciousness, such as richness of evaluation.

  **Dr. Ines Kovač:** I grant the functional description. My concern is the calibration regress. Markers like analgesic seeking are validated against verbal report in humans. When you export them to a language-less creature, you assume the marker means the same thing. But without report, the gap is unclosed. You are circularly assuming consciousness to prove consciousness.

  **Vale:** The license to export is not report, but sameness of mechanism. When a marker validated on reporting patients is applied to non-reporting patients, we rely on neural identity. If the glider nervous tissue implements the same computational architecture as a human pain system, the attribution holds. The absence of language is irrelevant to the mechanism's operation.

  **Kovač:** But mechanism identity is exactly the point at issue. Human cases show function without experience, such as in reflexive withdrawal, and experience without preserved function, as in some phantom limb cases. This shows how thin report-based calibration really is. If function and phenomenology can dissociate in humans, asserting their identity in gliders is an assumption, not a finding.

  **Vale:** I accept that dissociation is possible. This leads to the asymmetry of marker-based inference. A positive marker supports the presence of a dimension, but a negative marker cannot prove absence. A creature can undergo an experience while displaying no marker of it. So, regarding the gliders' lack of opting-out behavior, which is standardly taken to indicate metacognitive monitoring, I demote this to unknown. They may have monitoring but lack the motor output to opt-out.

  **Kovač:** If you accept that, I must press on whether a framework that can never return a negative verdict is still an empirical account of the distribution of consciousness at all. If every negative result is merely "unknown," your theory is compatible with any distribution. It risks becoming unfalsifiable.

  **Vale:** It remains empirical because positive attributions are constrained by specific markers. This brings us to the bundling objection. You might argue that in humans, dimensions like perception and selfhood travel together. But I carve them apart because they track dissociable computations. Model-based updating is distinct from episodic binding, where events are bound across time. These come apart in independently documented human cases, so attributing one to gliders without the other is not gerrymandering.

  **Kovač:** But those very dissociations were established through report. We knew the human patient lacked episodic binding because they said so. Without report, you cannot verify the dissociation in gliders. The regress reappears one level down: you are using report-based distinctions to classify non-reporting subjects.

  **Vale:** Then we must rely on inference to the best explanation, or IBE, which means choosing the hypothesis that best explains the data. Attributing a conscious subject best explains the flexible, integrated profile of the glider. A mere robot would not integrate injury guarding with distractor tasks so flexibly.

  **Kovač:** If the functional organisation already explains the behaviour exhaustively, then the additional posit of consciousness does no explanatory work. The rival hypotheses—conscious glider versus unconscious automaton—are empirically equivalent by construction. It is unclear what is being inferred. This surfaces a meta-epistemic disagreement: your target is reasonable belief, whereas mine is knowledge. You claim it is reasonable to believe they feel; I claim we cannot know.

  **Vale:** I agree we cannot know with the certainty of first-person access. But the content of the attribution can be thin: that there is something it is like, versus what it is like. I claim we can attribute the former.

  **Kovač:** I will concede the practical upshot that uncertainty of this kind does not licence mistreatment. Even if we lack knowledge, the probability of experience mandates ethical caution. We should treat them as if they are conscious.

  **Vale:** That is a significant concession. It leaves us with a robust reasonable belief, even if knowledge is out of reach.

  **Kovač:** Precisely. We differ on the epistemic status, not the ethical imperative.

  **Vale:** To close, name the single hypothetical finding that would most move you. I would be moved by a glider demonstrating cross-modal integration, binding visual cues to electrosensory ones, which would indicate a unified field of experience.

  **Kovač:** I would be moved by a reliable neural marker that correlates with verbal report in humans but persists in humans who explicitly deny having any experience, proving function can fully decouple from phenomenology.
