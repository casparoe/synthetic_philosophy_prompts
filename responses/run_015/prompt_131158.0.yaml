answer: |-
  **Note to self: Distributed-Self Mediation Protocol (Hofstadter-ish)**

  Look, the metaphysics is cool but families don't care about strange loops when they're fighting over a ventilator. They care about who *knows* the paitent. This checklist is designed to test the fidelity of the "simulation" of the patient running in a relative's brain. It's not about legal next-of-kin status. It's about whose internal model of the patient is actually running the patient's code, vs. who is just running their own grief.

  Use this when someone says "I know what he would want" or "I still feel him here."

  ### The Procedure

  **Step 1: The Access Window**
  *   **Ask:** "When was the last time you had a meaningful interaction with them where they were fully themselves?"
  *   **Sufficient Answer:** A specific timeframe + context (e.g., "Every Sunday until the stroke," or "We hadn't spoken in 5 years").
  *   **Stop Condition:** If the last contact was >5 years ago *and* there was significant life change (marriage, illness, career shift) for the patient since then, flag the claim as **Low Fidelity**. You can't run updated software on old hardware.
  *   **Note:** This doesn't disqualify them, but it weights their testimony lower.

  **Step 2: Predictive Calibration (The Hard Test)**
  *   **Ask:** "Give me three specific choices they made in life that were hard or controversial. What would they choose in those scenarios today?"
  *   **Sufficient Answer:** Specifics that align with documented history or witness corroboration. Not "they were kind," but "they refused the surgery in '09 because they hated dependence."
  *   **Stop Condition:** If their predictions contradict known past behavior or written directives without a logical bridge, mark as **Projection**.
  *   **Rule:** If they get <2/3 right based on available evidence, their "simulation" is corrupted.

  **Step 3: Symbolic Resonance (The Feeling)**
  *   **Ask:** "When you sit here, do you hear their voice? Is it distinct from your own wanting?"
  *   **Sufficient Answer:** Ability to distinguish between "I want them to stay" and "They would want to stay."
  *   **Stop Condition:** If they cannot separate their grief from the patient's hypothetical voice, flag as **Emotional Contamination**.
  *   **Note:** High resonance + Low Calibration = Grief Projection. This is the danger zone.

  **Step 4: The Contamination Check**
  *   **Ask:** "If they woke up and disagreed with you, would you be surprised?"
  *   **Sufficient Answer:** "Yes, because they always hated X," or "No, because I know I'm asking for me."
  *   **Decision Point:** If they say "No, they'd agree with me" but failed Step 2, their claim to hold a fragment of the self **Does Not Hold Up**. They are holding a fragment of *themselves* wearing the patient's face.

  **Step 5: The Values Off-Ramp**
  *   **Trigger:** If Step 2 and Step 3 conflict (e.g., High Calibration/Low Resonance vs. Low Calibration/High Resonance).
  *   **Action:** Stop applying rules. State clearly: "We have moved from facts about who they were to values about how we honor them."
  *   **Mediator Note:** This is where you stop being a technician and start being a referee. Do not use the checklist to solve this. Use it to show *why* they are stuck.

  ---

  ### Application to Hard Cases

  Here's how this plays out in the room. I'm telling you now, families usually hate the output of Step 2 overriding Step 3.

  **Case A: The Spouse (High Resonance, Low Calibration)**
  *   **Claim:** "I feel him everywhere. I know he wants to fight. He's still here."
  *   **Step 2 Result:** Spouse predicts patient would want aggressive care. Record shows patient signed a DNR 3 years ago and told friends they feared being a burden. Spouse says "That was before he knew my love."
  *   **Step 3 Result:** Spouse cries, says they hear his voice daily.
  *   **Verdict:** The procedure flags this as **Emotional Contamination**. The "pattern" running in the spouse's brain is mostly the spouse's own need for connection, overwriting the patient's actual data.
  *   **Outcome:** You have to tell the spouse that while their pain is real, their claim to be speaking *for* the patient is weak. They are speaking *to* the patient, not *as* them.
  *   **Reaction:** They will hate this. It feels like you're saying their love isn't enough to know him.

  **Case B: The Adult Child (Low Resonance, High Calibration)**
  *   **Claim:** "I don't feel anything. He's gone. But he hated machines. Pull it."
  *   **Step 2 Result:** Child cites specific conversations, matches prior directives, aligns with friends' accounts. Prediction fidelity is high.
  *   **Step 3 Result:** Child says, "I feel nothing. I just know what he said."
  *   **Verdict:** The procedure validates this as a **High Fidelity Fragment**. Even without the emotional "ghost," the structural pattern of the patient's self is running accurately in the child's brain.
  *   **Outcome:** You validate the child's authority on *preference*, even if the spouse hates their coldness.
  *   **Reaction:** The family will hate this too. It looks like you're rewarding the unfeeling child over the grieving wife.

  ### What This Procdure Can't Do

  1.  **Decide Care:** This doesn't tell you whether to withdraw life support. It only tells you whose voice counts as the *patient's* voice. Sometimes the patient's voice (via the child) says one thing, and the family's values (via the spouse) say another. You still have to mediate that conflict.
  2.  **Measure Love:** Hofstadter's model is about information patterns, not affection. A stalker could theoretically have high calibration. You need to combine this with ethical boundaries regarding who has legal standing.
  3.  **Fix Grief:** Telling a spouse they are projecting isn't therapeutic in the moment. It's factual. Use it to clarify authority, not to heal the bond.

  **Final Note:** If you use this, make sure you explain the "Pattern vs. Feeling" distinction upfront. If you just drop the verdict without the framework, they'll think you're taking sides. Also, watch out for typos in your notes, I definately wrote "paitent" three times in this draft.
