  4.  **Formulate the Principle:**
      *   Need to integrate:
          1.  **Severity/Capability of Error:** Could this design have easily produced this result if the hypothesis were false? (Cases 2, 4, 7).
          2.  **Robustness to Analytical Freedom:** Would the result hold if alternative reasonable analyses were chosen? (Cases 5, 6).
          3.  **Systemic Selection Correction:** Does the result survive correction for the fact that *only* this result was published? (Cases 1, 5).
      *   *Proposed Principle:* **The Principle of Robust Severe Testing under Selection.**
      *   *Clauses:*
          1.  *Local Severity:* The procedure must have a high probability of detecting the absence of the effect if it were absent (Power/Pre-registration).
          2.  *Analytical Robustness:* The result must not depend on unreported discretionary choices (The user's original idea).
          3.  *Systemic Independence:* The result must be improbable given the background rate of false positives in the specific research ecosystem (addressing Case 1 & 5).
      *   *Refinement:* Actually, looking at Case 3 (Moderators), we need a clause about *Heterogeneity*. If results vary wildly, evidence for a *universal* claim is weak, but evidence for a *contextual* claim is possible.
      *   *Let's try to unify:* Evidence is a function of the **Signal-to-Noise ratio of the Inquiry Process**, where Noise includes both Sampling Error and *Investigator Degrees of Freedom* and *Publication Bias*.
      *   *Better:* **The Principle of Audited Inference.** A result $R$ supports Hypothesis $H$ iff:
          1.  (Severity) The method $M$ used to generate $R$ would rarely yield $R$ if $H$ were false.
          2.  (Audit) The path from data to $R$ is fully disclosed and robust to reasonable alternative paths.
          3.  (Base-Rate Correction) The probability of observing $R$ in the published literature, given $H$ is false and accounting for selection filters, is low.

      *   *Wait, Case 1 is the hard one.* Parapsychology. Even with (1) and (2), the user rejects it. This implies (3) is doing heavy lifting based on *field priors*.
      *   *Case 3 vs 2:* In Case 2, the replication was a *direct* replication. In Case 3, it was a *conceptual* or multi-lab variation. The principle needs to distinguish between *falsification* (direct rep null) and *boundary searching* (multi-lab scatter).

      *   *Revised Principle:* **The Principle of Constrained Severe Testing.**
      *   Evidence requires that the claim survives a test that was *constrained* against generating the claim by chance, *bias*, or *selection*.
      *   Clause A (Design Severity): High power to detect the specific effect size claimed.
      *   Clause B (Analytical Integrity): No unreported flexibility (the user's original thought).
      *   Clause C (Ecological Validity of the Null): A null result counts as evidence against only if the design matches the original conditions sufficiently to rule out "moderator" excuses (addresses Case 2 vs 3).
      *   Clause D (Selection Adjustment): Extraordinary claims require evidence that corrects for the high false-positive rate of the sub-field (addresses Case 1).

  5.  **Address the "Second Dimension":**
      *   The user asked: "Does my tentative principle need a second dimension... about whether the design was capable of failing... or prior implausibility?"
      *   *Answer:* Yes. The "what else could they have done" (Analytical Integrity) is necessary but not sufficient. You need **Severity** (Capability of failing) AND **Systemic Base-Rates** (Prior/Selection).
      *   Case 1 fails on Systemic Base-Rates (Parapsychology has high false positive rate historically).
      *   Case 4 passes on Severity (Huge N) despite low practical value.
      *   Case 6 fails on Severity (Low power per study) despite passing Analytical Integrity (all reported).

  6.  **Identify Conflicts/Verdicts to Give Up:**
      *   *Case 3:* The user says scatter "doesn't count much against the original." This is dangerous. If 20 labs run the *identical* protocol and 15 find null, that *is* evidence against the original claim of a robust effect. The user is protecting the "moderator" hypothesis too easily. I should challenge this.
      *   *Case 8:* When do we conclude absence? The principle should say: When the *cumulative severity* of null replications exceeds the severity of the original positive, adjusted for selection. We *can* conclude absence provisionally. The "unidentified moderator" is a get-out-of-jail-free card that stops science.
      *   *Case 1:* If the parapsychology study is truly preregistered, huge N, and p < .001, the user's rejection relies *entirely* on field priors. The principle must explicitly encode field-specific error rates.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Stage 1: Diagnosis.* Be blunt. You are mixing three different epistemic currencies: Internal Validity (did they cheat?), Statistical Severity (could this be noise?), and External/Systemic Validity (is this field trustworthy?). Your tentative principle only covers the first.
      *   *Stage 2: The Principle.* Call it **The Principle of Constrained Severe Testing**. Break it into three clauses: Severity, Integrity, and Selection.
      *   *Stage 3: Conflicts.* Point out Case 3 (Moderator excuse) and Case 8 (When to stop).
