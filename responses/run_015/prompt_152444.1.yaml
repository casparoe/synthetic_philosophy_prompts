          *   New Case A: Registered Report with null result (tests Severity vs. Publication Bias).
          *   New Case B: Big Data correlation (tests Integrity vs. Severity).
          *   New Case C: Replication in a different culture (tests Moderator vs. Falsification).

  8.  **Refining the Philosophy:**
      *   Is this Bayesian? It uses priors (Case 1), but it's not subjective Bayesianism; it's *frequentist performance adjusted for selection*.
      *   Is this Error-Statistical (Mayo)? Yes, heavily relies on Severity. But adds the "Selection" clause which Mayo often treats as a separate issue of "well-testedness" of the *method*, not just the *hypothesis*.
      *   Is it Distinct? It's a hybrid norm for *published literature* specifically. It treats the paper not as a report of data, but as a report of a *filtering process*.

  9.  **Final Polish:** Check tone. Ensure I sound like a colleague/philosopher, not a textbook. Ensure I answer the specific prompt requirements (clauses, conflicts, new cases).

