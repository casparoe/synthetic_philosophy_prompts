      *   *Case 4 (Huge N, Tiny Effect):* N=100k, p < .05, tiny effect. *Verdict:* Real evidence (non-zero). *Reason:* High power/capability of detecting zero. *Tension:* Practical significance vs. statistical evidence.
      *   *Case 5 (Meta-analysis + p-curve):* Pooled effect > 0, but p-curve right-skewed (bunching at .05). *Verdict:* Not evidence. *Reason:* Selection bias/p-hacking signature trumps pooled estimate.
      *   *Case 6 (3 Small Studies):* 3 studies, p ~ .04. *Verdict:* Weaker than 1 big prereg p=.001. *Reason:* "Lucky string" vs. "Severe test." Independent replication weight vs. single study weight.
      *   *Case 7 (Prereg Hormone):* N=200, p=.004. *Verdict:* Tentative but real evidence. *Reason:* Prereg + decent power + strong signal.
      *   *Case 8 (Disagreement/Null Reps):* Orig vs. Rep (null). Then 2nd Rep (null). *Verdict:* Undecided. *Question:* When do we conclude absence? *Tension:* Duhem-Quine problem (unidentified moderators).

