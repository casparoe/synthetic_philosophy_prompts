answer: |-
  ### Stage 1: Rough, Candid Diagnosis

  You are not operating with a single principle; you are juggling three distinct epistemic currencies, and your frustration stems from trying to spend them interchangeably without an exchange rate.

  1.  **Internal Integrity (Your tentative principle):** "Did they cheat?" This covers Case 5 (p-curve) and Case 6 (three small studies). It asks about the *process* of data analysis.
  2.  **Statistical Severity (Mayo/Error-Statistics):** "Could this easily be noise?" This covers Case 2 (underpowered original vs. powered replication), Case 4 (huge N), and Case 7 (preregistered strong signal). It asks about the *capacity of the design* to detect error.
  3.  **Systemic Base-Rates (Bayesian/Meta-Scientific):** "Is this field trustworthy?" This is the only thing driving your verdict in Case 1 (Parapsychology). No amount of internal integrity or severity overrides your prior belief that the field produces false positives.

  **The Diagnosis:** Your tentative principle ("would it survive being asked what else they could have done") covers Currency 1 perfectly but fails on 2 and 3.
  *   It fails on **Case 4** because a study can be perfectly transparent (Currency 1) but still be a "significant" fluctuation around zero if the design wasn't severe enough—though in Case 4, the N is huge, so you correctly identify it as *statistically* real, just practically useless. Your principle doesn't distinguish statistical reality from practical relevance.
  *   It fails on **Case 1** because parapsychology can (in theory) produce transparent, severe tests that you still reject. Your rejection is based on the *history of the field*, not the *process of the paper*.
  *   It fails on **Case 3 vs. Case 2** because you are inconsistently applying the "Moderator Defense." In Case 2, you accept the null as falsification. In Case 3, you accept the scatter as evidence of hidden moderators. This is a conflict between **Falsificationism** (one robust null kills the claim) and **Contextualism** (effects are unstable). You are letting the "unidentified moderator" excuse do too much work in Case 3 to protect the literature, while using it too little in Case 8 to settle disputes.

  ### Stage 2: The Cleaned-Up Principle

  Your principle needs to expand from a test of *honesty* to a test of *inquiry robustness*. I propose **The Principle of Audit-Adjusted Severity**.

  A result $R$ counts as evidence for Hypothesis $H$ in a published literature $L$ if and only if it satisfies three clauses:

  **Clause 1: Probative Capacity (Severity)**
  The design must have had a high probability of yielding a result inconsistent with $H$ if $H$ were false (or if the effect were substantially smaller than reported).
  *   *Settles:* Case 2 (Original fails, Rep passes), Case 4 (Passes), Case 6 (Fails—small studies lack capacity to distinguish signal from noise reliably).

  **Clause 2: Analytical Integrity (Audit)**
  The path from raw data to $R$ must be robust to reasonable alternative analytical choices, or those choices must be pre-specified and disclosed.
  *   *Settles:* Case 5 (Fails p-curve/selection), Case 6 (Fails—three small studies imply optional stopping or selection unless preregistered), Case 7 (Passes).

  **Clause 3: Selection Correction (Base-Rate)**
  The strength of evidence required to accept $H$ must scale inversely with the estimated false-positive rate of the research ecosystem $L$ producing the data.
  *   *Settles:* Case 1 (Parapsychology has high ecosystem error rate; requires extreme severity/priors), Case 5 (Meta-analysis fails because the ecosystem selection bias is detected).

  **The "Moderator" Constraint (Addressing Case 3 & 8)**
  A null result in a direct replication counts as evidence against $H$ unless there is a *theoretically specified* moderator that explains the discrepancy. "Unidentified moderators" cannot be used to indefinitely suspend falsification.
  *   *Settles:* Case 2 (Null counts), Case 3 (Scatter counts against a *general* claim, supports a *contextual* claim only if moderators are found), Case 8 (After multiple nulls, absence is the provisional conclusion).

  ### Stage 3: Conflicts and Verdicts to Surrender

  Here is where my principle forces you to change your mind. I have identified two places where your intuition is protecting the literature more than the truth.

  **1. You must surrender your verdict on Case 3 (The Scatter).**
  *   *Your View:* The scatter (some pos, some neg, most null) counts as evidence that the effect depends on setting, not evidence against the effect.
  *   *The Principle's Verdict:* If the protocol is *identical* (as you stated), scatter is evidence of **instability**, which counts strongly against the original claim of a robust effect. You cannot have it both ways: if you accepted the null in Case 2 as falsification, you must accept the preponderance of nulls in Case 3 as falsification of the *general* claim.
  *   *Why:* Allowing "unidentified moderators" to explain away scatter without specifying them violates the **Moderator Constraint**. It turns the hypothesis into an unfalsifiable "effect exists somewhere" claim. You should treat Case 3 as evidence that the original effect was likely a false positive or highly fragile, not as evidence of a hidden moderator.

  **2. You must resolve Case 8 (The Disagreement) in favor of the Nulls.**
  *   *Your View:* You are unsure if we can ever conclude absence.
  *   *The Principle's Verdict:* Yes, you can conclude absence. When the cumulative **Probative Capacity** (Clause 1) of the null replications exceeds the capacity of the original positive study, the rational verdict is "no evidence for effect."
  *   *Why:* Science requires a stopping rule. If the "unidentified moderator" defense is permitted after two high-powered preregistered nulls, the hypothesis is no longer scientific. The burden of proof shifts: the proponent must specify the moderator *before* the next test.

  **3. Clarification on Case 4 (The Tiny Effect).**
  *   *Your View:* It is real evidence the effect is not zero.
  *   *The Principle's Verdict:* Agreed, but with a caveat. It satisfies Clause 1 (Severity) and Clause 2 (Integrity). However, under Clause 3, if the literature is prone to "significance chasing," even tiny p-values in huge N studies can be artifacts of subtle bias. But assuming clean data, you are right: it is evidence of *existence*, just not *importance*. Your colleague who called it "noise" is confusing *statistical significance* with *practical significance*.

  ### Stage 4: Is this Bayesian, Error-Statistical, or Distinct?

  This is a **Distinct Norm for Published Science**.
  *   It is not pure **Bayesianism** because it does not require you to quantify subjective priors (e.g., for Case 1). Instead, it uses the *ecosystem's false-positive rate* as a proxy for the prior.
  *   It is not pure **Error-Statistics** (Mayo) because standard error statistics focuses on the *test*, whereas this principle explicitly incorporates the *selection filter* of the journal/literature (Clause 3) as part of the evidence evaluation.
  *   It is a **Meta-Scientific Hybrid**. It treats a published paper not as a report of data, but as a report of a *filtering process*. It demands that the evidence survive the filter, the analysis, and the design.

  ### Stage 5: Three New Applications

  Here is how you apply **The Principle of Audit-Adjusted Severity** to cases you haven't seen yet.

  **New Case A: The "Registered Report" Null**
  *   *Scenario:* A journal accepts a study protocol (Stage 1) before data collection. The study is run with high power. The result is null. The journal publishes it (Stage 2).
  *   *Application:*
      *   Clause 1 (Severity): High (high power).
      *   Clause 2 (Integrity): High (Registered Report removes analytical flexibility).
      *   Clause 3 (Selection): High (Publication bias removed by design).
      *   *Verdict:* This is **stronger evidence against the hypothesis** than a standard significant finding is for it. It satisfies all three clauses perfectly. You should treat this as a definitive strike against the theory, more so than Case 2.

  **New Case B: The "Big Data" Fishing Expedition**
  *   *Scenario:* Researchers access a dataset of 1 million social media users. They run 5,000 correlations without pre-registration. They report one correlation: "Extroversion predicts buying shoes," $p < .001$.
  *   *Application:*
      *   Clause 1 (Severity): High (Huge N).
      *   Clause 2 (Integrity): **Failed**. 5,000 tests imply massive analytical flexibility (the "garden of forking paths").
      *   Clause 3 (Selection): **Failed**. Only the significant result was reported.
      *   *Verdict:* **Not evidence.** Despite the huge N and tiny p-value, it fails Clauses 2 and 3. The "what else could they have done" test reveals they could have tested 4,999 other things. This corrects your colleague who thinks "Big Data solves everything."

  **New Case C: The "Cultural Replication"**
  *   *Scenario:* Original study (US undergrads) shows Effect X. Replication (Japanese adults) shows Null. Both are high power, preregistered.
  *   *Application:*
      *   Clause 1 (Severity): High for both.
      *   Clause 2 (Integrity): High for both.
      *   *Moderator Constraint:* Here, the moderator (Culture) is *identified* and *theoretically plausible*.
      *   *Verdict:* This does **not** count as evidence that the original was false. It counts as evidence that the effect is **boundary-conditioned**. Unlike Case 3 (identical protocol scatter), this satisfies the Moderator Constraint. The literature should update from "Effect X exists" to "Effect X exists in WEIRD populations."

  ### Summary Advice for Your Department

  When you return to that meeting, stop arguing about "preregistration vs. power." They are both necessary but insufficient.

  1.  Tell the "Preregistration" colleague: "Preregistration fixes Integrity (Clause 2), but not Severity (Clause 1). A preregistered underpowered study is still a waste of time."
  2.  Tell the "Power" colleague: "Power fixes Severity (Clause 1), but not Integrity (Clause 2). A powerful study with flexible analysis is still storytelling."
  3.  Tell both: "Neither fixes the Base-Rate (Clause 3). We must weigh findings by the trustworthiness of the sub-field's selection process."

  And on Case 8: Propose a departmental norm. **Two high-powered, preregistered direct replications yielding null results constitute a provisional falsification.** The burden of proof shifts to the original author to specify the moderator *before* a third attempt is funded. This stops the "unidentified moderator" from becoming a zombie that never dies.
