      *   The user is oscillating between *Error Statistics* (Can the design detect error? - Cases 2, 4, 7) and *Bayesian/Prior Plausibility* (Is the claim credible beforehand? - Case 1) and *Meta-Scientific/Systemic* (What does the publication process do to this number? - Cases 1, 5, 6).
      *   The tentative principle ("would it survive asking what else they could have done") covers Cases 5 & 6 well (p-hacking, selective reporting).
      *   It fails on Case 1 (Parapsychology). Even if they did *everything* right procedurally, the user rejects it. Why? Because the *system* of parapsychology is suspected of generating false positives via file drawers, or the prior is too low.
      *   It fails on Case 3 vs. Case 2. Why does one null kill the effect in Case 2, but many nulls + some positives in Case 3 suggest "moderators"? This suggests the user values *consistency of protocol* (Case 2) vs. *exploration of boundary conditions* (Case 3).
      *   It fails on Case 4. The "what else could they have done" test is passed (huge N), but the user defends it against the "noise" claim. This is purely about *Severity* (Mayo).
