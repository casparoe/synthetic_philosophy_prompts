answer: |-
  # Activity Design: The Sovereign Seal

  ## Overview
  This activity simulates a constitutional crisis in a fictional democracy called "Res Publica." The group must solve a high-stakes problem using majority voting, but the rules of the simulation are rigged to demonstrate that majority vote alone feels fragile and contestable. A single participant holds a dormant "Sovereign" role with the power to apply a "Seal" to the decision. The Seal does not change the decision's content, but it immunizes the group against random penalties that represent political instability. Participants will experience the irritation of democratic uncertainty and the relief of pre-established authority, revealing the function of "authorization redundancy" without initially naming it.

  ## Logistics
  *   **Group Size:** 15 adults (14 Assembly Members, 1 Sovereign).
  *   **Duration:** 90 minutes (20 min setup/brief, 40 min simulation, 30 min debrief).
  *   **Materials:**
      *   15 Name badges (1 marked "Sovereign," 14 marked "Assembly").
      *   1 "Crown Box" (a sealed envelope or small box given to the Sovereign at the start, unopened until Phase 3).
      *   20 "Stability Tokens" (poker chips, coins, or printed cards) placed in a central pool.
      *   3 "Crisis Scenario" cards (e.g., "Resource Shortage," "External Threat," "Infrastructure Collapse").
      *   5 "Legitimacy Challenge" cards (face down).
      *   1 Physical "Seal" (a stamp, a specific colored sticker, or a heavy object).
      *   Whiteboard for tracking tokens.

  ## Incentive Structure
  The group shares a collective pool of 20 Stability Tokens.
  *   **Success Condition:** If the pool has 15+ tokens at the end, the group earns a **Privilege** (e.g., they collectively decide the topic of the next workshop session or end 10 minutes early).
  *   **Failure Condition:** If the pool drops below 15 tokens, the group incurs a **Penalty** (e.g., the facilitator assigns a mandatory 5-minute clean-up task or a written reflection summary).
  *   **Individual Stakes:** There are no individual winners. This forces cooperation but highlights the tension between procedural correctness and outcome security.

  ## Procedure

  ### Phase 1: The Democratic Assembly (20 Minutes)
  1.  **Distribution:** Hand out badges randomly. The person receiving "Sovereign" is told to sit apart from the main table. They are instructed to remain completely silent and not make eye contact until Phase 3. They are given the **Crown Box** but told *not* to open it yet.
  2.  **The Crisis:** Draw one Crisis Scenario card. Read it aloud. The problem requires a binary choice (Option A or Option B) or a specific resource allocation.
  3.  **The Rule:** The Assembly is told: "You must decide on a solution by majority vote. Every minute you debate costs the group 1 Stability Token (removed from the pool). You have 15 minutes to decide."
  4.  **The Experience:** The Assembly will debate. They will likely argue about the merits of A vs. B. They will feel the pressure of the ticking clock (token loss). They will vote. Let's say they choose Option A.
  5.  **The Hollow Victory:** Once they vote, the Facilitator announces: "The Assembly has decided. However, under the Constitution of Res Publica, this decision is **Provisional**."
  6.  **The Threat:** The Facilitator draws one "Legitimacy Challenge" card face down. "If this decision remains Provisional, I will reveal this card. It may cost the group up to 5 tokens." The Assembly feels anxiety. They generated the decision, but it feels insecure.

  ### Phase 2: The Reserve Authority (10 Minutes)
  1.  **Activation:** The Facilitator turns to the Sovereign. "The Assembly has voted. You may now open the Crown Box."
  2.  **The Mandate:** Inside the box is a card reading: *"You do not choose the policy. You choose the stability. If the Assembly followed the speaking rules (no shouting, everyone had a chance), you MUST apply the Seal. If you apply the Seal, the Decision becomes **Sovereign** and Legitimacy Challenges are cancelled."*
  3.  **The Action:** The Sovereign stands. They cannot speak. They simply choose to place the Physical Seal on the table next to the Assembly's written decision, or leave it off.
      *   *Note:* Because the rules usually require the Seal if procedure was followed, the Sovereign will almost always Seal.
  4.  **The Shift:** If the Seal is applied, the Facilitator tears up the Challenge card. "The Decision is now Sovereign. No penalties applied." The group visibly relaxes. The decision (Option A) hasn't changed, but its weight has.

  ### Phase 3: The Second Crisis (10 Minutes)
  1.  **Repeat:** Run a second, quicker crisis.
  2.  **The Twist:** This time, allow the Assembly to *ask* the Sovereign for the Seal *before* the vote is finalized.
  3.  **Observation:** Watch if the Assembly starts performing "dignity" rather than just debating policy. They may try to signal to the Sovereign that they are being orderly, hoping to trigger the Seal. This mirrors how democracies shape behavior to fit monarchical expectations.

  ## Debrief Guide (30 Minutes)
  Do not start with theory. Start with feelings.

  1.  **The Feeling of the Vote:** Ask the Assembly: "When you voted in Phase 1, did you feel the decision was final?" (Expected answer: No, we were waiting for the Challenge card).
  2.  **The Feeling of the Seal:** Ask: "When the Sovereign placed the Seal, did the decision change?" (No). "Did the *risk* change?" (Yes).
  3.  **Mapping to Theory:** Introduce the term **"Authorization Redundancy."** Explain that the Assembly represents elected bodies (generating legitimacy from scratch every time, which is exhausting and risky). The Sovereign represents the monarchy (holding a pre-existing legitimacy that acts as insurance).
  4.  **The "Why":** Ask: "Why not just let the Assembly decide?" Guide them to see that in the game, the Assembly was tired, anxious, and prone to penalty. The Sovereign was calm and dormant. In real history, the "Crown" represents centuries of continuity that a 4-year elected term cannot match.
  5.  **Closing:** Ask if anyone felt the Sovereign's role was unfair. Acknowledge that redundancy looks inefficient until a crisis hits, at which point it looks like stability.

  ## Predictable First-Run Failures & Recovery
  1.  **Failure:** The Sovereign tries to negotiate or suggest policy during Phase 1.
      *   **Recovery:** The Facilitator must gently interrupt: "The Crown is dormant until the vote is concluded. Please return to silence." This reinforces the "reserve" nature of the power.
  2.  **Failure:** The Assembly ignores the Sovereign and treats the Seal as irrelevant.
      *   **Recovery:** Ensure the "Legitimacy Challenge" penalty is steep enough (e.g., 5 tokens) that ignoring the Seal guarantees failure. The stakes must be real.
  3.  **Failure:** The group becomes angry at the "arbitrary" power of the Sovereign.
      *   **Recovery:** Validate this anger in the debrief. This anger is part of the democratic experience. The point of the activity is not to prove monarchy is "good," but to show why it persists despite the anger—because it solves the "finality" problem.

  ## Unreproducible Feature
  The simulation cannot reproduce **historical sedimentation**. In the game, the Sovereign is a random peer chosen 20 minutes ago. Their authority is purely mechanical (rules on a card). In reality, the authority of a monarch like those in the UK or Japan relies on centuries of blood, tradition, and cultural mythos that make the "Seal" feel sacred rather than procedural.
  *   **Facilitator Supply:** You must verbally supply this context in the debrief. Explain: "In this room, the Sovereign is just [Name]. In the UK, the Crown is 1,000 years of history. That history is the invisible weight that makes the Seal work in reality, which our tokens could not fully mimic."

  ***

