    "debrief_mapping": "Map the anxiety of the provisional vote to the exhaustion of generating legitimacy from scratch. Map the relief of the Seal to the function of reserve authority. Connect the Sovereign's silence to the political neutrality of modern monarchs. Discuss how the Seal changed the risk profile, not the policy.",
    "predictable_first_run_failure": "The Sovereign may attempt to influence the debate prematurely, or the Assembly may ignore the Seal mechanism if token penalties are too low. Recovery: Enforce silence rules strictly for the Sovereign; ensure Challenge penalties are high enough (25% of pool) to make the Seal indispensable.",
