answer: |-
  Based on the takes you've described, I can diagnose her position, predict her answer, and give you the stress-test that settles the debate.

  ### 1. The Diagnosis: She's a "Thirder"
  Your friend is almost certainly a **Thirder** (someone who counts "observer moments" or copies).

  Here's the tell: **The Monday Answer.**
  *   **The Setup:** There are three possible waking scenarios that look identical to her: Heads-Monday, Tails-Monday, Tails-Tuesday.
  *   **The Halfer Math:** A Halfer believes the coin is still 50/50. But if you tell her "It's Monday," you eliminate the Tails-Tuesday scenario. That leaves Heads-Monday and Tails-Monday. However, because Halfers weight the Heads world heavier (50% chance of the whole world) than the Tails-Monday slice (25% chance), a consistent Halfer must say there is a **2/3 chance it's Heads** given it's Monday.
  *   **The Thirder Math:** A Thirder treats all three waking scenarios as equally likely (1/3 each). If you tell her "It's Monday," you eliminate Tails-Tuesday. That leaves Heads-Monday (1/3) and Tails-Monday (1/3). Since they are equal weight, the chance of Heads is **1/2 (50/50)**.

  Since she says **50/50 on Monday**, she is intuitively weighting the waking moments equally. She is counting copies.

  ### 2. The Prediction: "Will we ask you again tomorrow?"
  Since she is a Thirder, here is how she will calculate the answer to the new question:

  *   **Scenario A (Heads-Monday):** She is woken. Tomorrow? No. (Probability: 1/3)
  *   **Scenario B (Tails-Monday):** She is woken. Tomorrow? **Yes.** (Probability: 1/3)
  *   **Scenario C (Tails-Tuesday):** She is woken. Tomorrow? No. (Probability: 1/3)

  Only in **Scenario B** is the answer "Yes."
  **She will say 1/3 (33.3%).**

  *(Note: If she were a Halfer, she would calculate the probability as 1/4, because she weights the Heads world at 50% and splits the Tails world into two 25% slices.)*

  ### 3. The Tweaked Version That Settles It
  Verbal probability is slippery. People can argue about "belief" vs. "frequency" forever. To force her to show her true rule, you need to attach **money** to the **extreme version** you hinted at.

  **The "100-Wakeup Money Pump"**

  **The Setup:**
  Same experiment, but tweak the numbers:
  *   **Heads:** She is woken **1 time** (Monday).
  *   **Tails:** She is woken **100 times** (Monday through Day 100).
  *   **The Bet:** Every time she wakes up, she must guess Heads or Tails. For every **correct** guess, she gets $1. For every wrong guess, she gets $0.

  **The Question:**
  "What is your strategy to maximize your winnings?"

  **Why this breaks the deadlock:**
  *   **If she acts like a Halfer (50/50):** She might guess Heads half the time and Tails half the time, or stick with Heads because "the coin is fair."
      *   *Result:* In the Heads world (50% chance), she makes ~$0.50. In the Tails world (50% chance), she makes ~$50. **Average winnings: ~$25.**
      *   *Wait, actually:* If she *always* guesses Tails (acknowledging the betting odds even if she claims 50/50 belief), she makes $0 in Heads world and $100 in Tails world. Average: $50.
      *   If she *always* guesses Heads: She makes $1 in Heads world and $0 in Tails world. Average: $0.50.
  *   **If she acts like a Thirder (1/101):** She recognizes that 100 out of 101 wakings are Tails-wakings. She guesses **Tails every time**.

  **The Kicker:**
  Ask her: *"If you believe the coin is 50/50, why would you bet on Tails 100% of the time? If you bet on Tails 100% of the time, aren't you admitting the probability of being in a Tails-waking is 100/101?"*

  This forces her to admit that while the *coin* is fair, her *experience* is not. It proves that for decision-making, she **must** count her copies. If she refuses to bet Tails every time, she is leaving free money on the table, proving her "50/50" rule is practically broken. If she bets Tails, she admits the "Thirder" rule governs her reality.
