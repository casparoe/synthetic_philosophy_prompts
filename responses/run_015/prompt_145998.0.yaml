prompt: |-
  I write fiction, and I am midway through a revision in which two things have collided: my publisher's house style, and a language reform that takes place inside the world of my novel. I would like help reconstructing what the first of these is committed to, because I cannot tell any more whether I am obeying a semantic thesis, a psychological bet, or a moral norm.

  The practice in question is the one my copyeditor applies without argument. Generic masculine forms are struck: compounds built on the old generic noun are replaced, and the generic pronoun becomes *they*. Role nouns are marked asymmetrically — a character who departs from the default is introduced as a woman novelist, a Black magistrate, a disabled veteran, while the default occupant is introduced as a novelist, a magistrate, a veteran, and the asymmetry is itself the point. And where a character defends the older usage, the standard move — in the essays I have read on the subject, and in the argument my protagonist makes — is transposition: rewrite the offending sentence along a different axis of social hierarchy and see whether the defender flinches. The best-known instance is the satirical centrepiece of Hofstadter's 1982 column on default assumptions, reprinted in *Metamagical Themas* as the chapter on changes in default words and images: a mock-earnest plea for a single neutral replacement term, driven past the point where it still sounds natural, into compounds where it begins to sound faintly ridiculous, so as to reveal that the putatively inclusive element was never being read as neutral.

  My complication is this. The novel is set in a society whose vocabulary marks a caste distinction: most office nouns come in a bare form and a specified form, and the bare form's historical occupants belong to the dominant caste. The reformers in the book abolish the bare form — call it the ordinance of symmetric specification — on the explicit ground that any unmarked noun quietly nominates its historical occupants as the human default. Two things then happen, and I have written both. First, marking rebounds: characters who now hear both forms specified report that they think about caste *more*, not less, and the reform's opponents use this as evidence that symmetric marking entrenches the very category it meant to defuse. Second, my copyeditor has asked for the opposite in the surrounding English: the ruling council is to be rendered with the bare noun, for the sake of what she calls texture and I would call the reader's sense of a lived-in world, while subordinate offices keep their markers. So the practice de-defaults in one place and reinstates a default in another, and I cannot articulate what distinguishes the two cases.

  I would like the implicit theory reconstructed. About meaning: in which layer of content is the offending default supposed to live — truth-conditions, something implicature-like, a presupposition, or only a matter of what the word makes salient — and does the practice strictly require the strong claim, or would a weaker one do? About language's power: does de-defaulting presuppose that usage shapes thought and social structure, or only that it expresses and ratifies them, and would the practice survive being reinterpreted as the latter? About fiction in particular: the default changes nothing that is true in my story — it changes what a reader pictures while reading, and often involuntarily. What view of a fiction's content, and of an author's answerability for imaginative uptake rather than for asserted content, is needed to make house-style de-defaulting anything other than an aesthetic preference?

  And about the satire: what must be true of an attitude for transposition to count as evidence against it? That such attitudes answer to a consistency norm, that formal or structural similarity is the right kind of similarity to appeal to, and — awkwardly — that the reader already condemns the analogue, so that the device can surface a commitment but cannot manufacture one? If that last condition holds, my invented reformers, who have no such consensus to borrow, are left with no lever at all.

  Please distinguish what the practice strictly presupposes from what it merely fits well with, and mark the places where it is underdetermined and several rival theories would license exactly these edits. Then tell me what would have to change in the practice — in the copyeditor's rules, in my rendering of the council, and in my protagonist's argument — if each of the presupposed views were replaced by its nearest rival.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user is a fiction writer revising a novel.
      *   **Conflict:** There's a collision between the publisher's house style (progressive language reform regarding gender/caste defaults) and the novel's *internal* language reform (a fictional society abolishing "bare" caste-marked nouns).
      *   **The Problem:** The copyeditor applies house style (de-defaulting gender) while the novel's plot involves a debate about de-defaulting caste. Furthermore, the copyeditor wants the fictional "ruling council" to remain bare (default) for "texture," while subordinate offices get marked. This creates a contradiction: de-defaulting in the meta-language (English) vs. re-defaulting in the object-language (fictional world).
      *   **The Goal:** Reconstruct the *implicit theory* behind the copyeditor's house style practice.
      *   **Specific Questions to Answer:**
          1.  **Semantics:** Where does the "offending default" live? (Truth-conditions, implicature, presupposition, salience?) Strong vs. weak claim?
          2.  **Language Power:** Does usage shape thought/structure (Sapir-Whorf-ish) or just express/ratify them?
          3.  **Fiction Theory:** What view of fiction's content and authorial responsibility justifies this as more than aesthetic preference?
          4.  **Satire/Transposition:** What must be true for the "transposition test" (Hofstadter style) to work as evidence? (Consistency norms, structural similarity, prior condemnation?)
          5.  **Differentiation:** Distinguish strict presuppositions from compatible fits. Identify underdetermined areas.
          6.  **Counterfactuals:** How would the practice change if the underlying theories were swapped for rivals?

  2.  **Analyze the Copyeditor's Practice (The "House Style"):**

      *   *Action:* Strike generic masculine. Use *they*. Mark asymmetric roles (woman novelist vs. novelist).
      *   *Rationale (implied):* Unmarked forms nominate historical occupants as the human default.
      *   *Exception (in the novel):* Ruling council = bare noun (for texture/lived-in feel). Subordinate offices = marked.
      *   *Tension:* The house style fights defaults in reality, but the novel's text reinstates a default for the ruling class to feel "natural."

  3.  **Drafting the Reconstruction - Section by Section:**

      *   **1. Semantics (The Location of the Default):**
          *   *Observation:* Changing "he" to "they" doesn't change the truth conditions of "A doctor loves *his* patients" vs "A doctor loves *their* patients" (in a generic sense).
          *   *Theory:* It's not truth-conditional. It's not purely presuppositional (which can be cancelled). It's closest to *conventional implicature* or *salience/frames*.
          *   *Strict Presupposition:* The practice *strictly* requires that the default generates a cognitive bias (salience), not that it makes the sentence false.
          *   *Underdetermined:* Is it a moral harm or a cognitive error? The edit happens either way.

      *   **2. Language's Power (Constitution vs. Reflection):**
          *   *Observation:* Reformers believe changing words changes minds.
          *   *Theory:* Weak Sapir-Whorf (linguistic relativity) or Constitutive Rule theory.
          *   *Strict Presupposition:* Language *ratifies* structure. If it were *only* reflection, changing the word would be pointless window dressing. The practice assumes changing the word has *some* feedback loop effect.
          *   *Rival:* If language is *only* expressive, the edit is purely performative signaling.

      *   **3. Fiction Theory (Uptake vs. Assertion):**
          *   *Observation:* Fiction isn't asserting facts about the real world.
          *   *Theory:* The "Pretence Theory" or "Imaginative Resistance." The author is responsible for the *props* of the imagination.
          *   *Strict Presupposition:* The reader's involuntary visualization matters ethically. It's not just about what is *said* in the story, but what is *imagined* by the reader.
          *   *Conflict:* The copyeditor wants "texture" (bare nouns for council) which relies on the *old* default to feel "lived-in." This contradicts the ethical goal of the house style.

      *   **4. Satire/Transposition (The Hofstadter Move):**
          *   *Observation:* Swap the hierarchy (e.g., race instead of gender) to test consistency.
          *   *Theory:* Reflective Equilibrium / Consistency Norms.
          *   *Strict Presupposition:* The target holds a consistency norm they are violating.
          *   *Crucial Point:* The user notes the fictional reformers lack a consensus. Transposition requires the *reader* to feel the flinch. If the reader doesn't condemn the analogue, the test fails.
          *   *Implication:* The device relies on *actual* social progress in the real world to critique the fictional world.

      *   **5. Synthesis & Counterfactuals:**
          *   Need to map out what changes if we swap the theories.
          *   *Scenario A (Semantics):* If it were truth-conditional, the old sentences would be *false*. (They aren't treated as such).
          *   *Scenario B (Power):* If language is only reflective, the edits are cosmetic.
          *   *Scenario C (Fiction):* If fiction is purely autonomous, the house style is censorship/imposition.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *The Copyeditor's Contradiction:* The prompt highlights a specific contradiction: House style de-defaults gender, but allows the fictional text to re-default caste for the ruling council (for "texture").
      *   *Analysis:* This suggests the House Style operates on a *Pragmatic* level (reader comfort/modern norms) rather than a *Diegetic* level (internal consistency of the world). The "texture" argument admits that bare forms feel more "natural" (i.e., defaulty). This undermines the reformist goal that bare forms are harmful.
      *   *Key Insight:* The practice is underdetermined between "Ethical Correction" and "Market Expectation."
      *   *Structure:* I need to be precise about "Strict Presuppositions" vs. "Compatible Fits."
      *   *Strict:* The default causes harm/bias.
      *   *Compatible:* Changing the word fixes the bias (might just signal virtue).
      *   *The "Texture" Exception:* This reveals the practice treats language as *aesthetic* in the fictional world but *ethical* in the paratext.

  5.  **Drafting the Response (incorporating the specific constraints):**

      *   *Tone:* Philosophical, analytical, respectful of the writer's intelligence.
      *   *Structure:*
          1.  Introduction (acknowledging the complexity).
          2.  Semantics (Location of the Default).
          3.  Language Power (Constitution vs. Expression).
          4.  Fiction (Uptake & Responsibility).
          5.  Satire (Transposition Logic).
          6.  The "Texture" Contradiction (The Copyeditor's Exception).
          7.  Counterfactuals (What if theories changed?).

  6.  **Final Polish:**
      *   Ensure I answer the specific question: "Distinguish what the practice strictly presupposes from what it merely fits well with."
      *   Ensure I address the "texture" exception specifically as a point of theoretical failure or hybridization.
      *   Check the Hofstadter/Transposition logic carefully. The user is right: it requires the reader to already condemn the analogue.

      *(Self-Correction during drafting)*: I need to make sure I don't just validate the house style, but analyze it as a philosophical object, as requested. The user is asking for the *theory behind the practice*, not advice on whether to follow it. The tension between the "Ordinance of Symmetric Specification" (in-book) and the Copyeditor's rules (out-of-book) is the crux.

      *Key distinction:* The Copyeditor treats English as a *normative* space (must follow ethics) but the Fictional Language as a *descriptive/aesthetic* space (must follow "texture"). This implies a theory of fiction where the *medium* (English) is ethically loaded, but the *content* (the fictional world) is allowed to be unethical for realism. But wait, the content *is* English. So the Copyeditor is marking *some* fictional nouns as bare (Council) and others as marked (Subordinates). This creates a *new* default within the fiction that aligns with power. This is ironic. I need to highlight this irony.

      *Plan:*
      1.  **Semantics:** Salience/Frame, not Truth.
      2.  **Power:** Constitutive (weak), not just Reflective.
      3.  **Fiction:** Ethical responsibility for imaginative props.
      4.  **Satire:** Relies on external moral consensus.
