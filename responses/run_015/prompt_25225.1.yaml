answer: |-
  This is a brilliant request. You have identified the core failure mode of the philosophy of medicine: everyone is fighting over the extension (what gets labeled) without agreeing on the intension (what the label *does*).

  If we treat "disease" as a technology—a conceptual tool we use to organize society, allocate resources, and assign moral responsibility—we can write a Requirements Document (Spec).

  Here is the Spec for a Theory of Health and Disease, followed by the analysis of trade-offs you asked for.

  ***

  # REQUIREMENTS DOCUMENT: THEORY OF DISEASE (v1.0)

  ## 1. Functional Requirements (What work must the concept do?)

  **1.1. Triage and Resource Allocation**
  The theory must provide a principled basis for distinguishing conditions that warrant *medical* resource allocation from conditions that warrant *social*, *personal*, or *no* resource allocation.
  *   *Test:* It must explain why we fund insulin for diabetes but not gym memberships for shortness, even if both reduce well-being.

  **1.2. Moral Exemption (The "Sick Role")**
  The theory must ground the intuition that disease mitigates moral responsibility. If X is a disease, the agent is less blameworthy for symptoms/behaviors associated with X.
  *   *Test:* It must explain why an alcoholic with "Addiction Disease" is treated differently than a drunk who "chooses" to drink, without resorting to circular "they have a disease so they can't choose" reasoning.

  **1.3. Professional Jurisdiction**
  The theory must define the boundary of medical authority. It must distinguish problems solvable by *medical intervention* (drugs, surgery, therapy) from problems solvable by *political/social intervention* (poverty, oppression) or *moral/religious intervention* (sin).
  *   *Test:* It must explain why racism is not a disease, even if it causes physiological stress and harm.

  ## 2. Metaphysical Requirements (What kind of thing is it?)

  **2.1. The Naturalist Constraint (Empirical Consistency)**
  The theory must be consistent with established biological facts, specifically evolutionary theory and physiology. It cannot posit "functions" that contradict natural selection or "dysfunctions" that are actually adaptive responses.
  *   *Test:* It must handle fever (dysfunction of temperature regulation or adaptive defense?) and pregnancy (physiologically taxing but not a disease).

  **2.2. The Normative Constraint (Value-Link)**
  The theory must explain why "disease" is inherently *undesirable*. A value-neutral definition of disease is useless. If the theory identifies a state as a disease, it must entail that the state is *to be avoided/treated*.
  *   *Test:* It cannot classify a beneficial mutation as a disease, even if it deviates from the species norm.

  **2.3. The Objectivity Constraint (Inter-subjective Stability)**
  The classification cannot depend solely on the whim of the classifier or current cultural mores. It must track facts about the organism that are true regardless of whether society currently likes them.
  *   *Test:* It must explain why homosexuality was *wrongly* classified as a disease in 1950, not just that we "changed our minds."

  ## 3. Boundary Conditions (Edge Cases the Theory Must Resolve)

  **3.1. The "Typical but Dysfunctional" Problem**
  The theory must handle conditions that are statistically normal in a specific environment but biologically destructive.
  *   *Case:* Dental caries in pre-industrial populations (common, but teeth rotting is a failure of function).
  *   *Case:* Presbyopia (age-related vision loss). It is statistically universal for humans, but clearly a loss of function. Is it a disease or just aging? The theory must draw this line non-arbitrarily.

  **3.2. The "Rare but Fine" Problem**
  The theory must exclude statistical anomalies that do not impair function.
  *   *Case:* Having an extra spleen, or being 7 feet tall.
  *   *Requirement:* Statistical rarity cannot be sufficient for disease status.

  **3.3. The Mind-Body Unification**
  The theory should ideally apply to both psychiatric and somatic conditions using the same criteria. If it treats them differently, it must provide a principled reason why mental "functions" are categorically different from physiological "functions."
  *   *Case:* Schizophrenia vs. Diabetes. Both involve dysfunction and harm. A dual-track theory risks stigmatizing one as "real" and the other as "fake."

  ***

  # ANALYSIS OF TRADE-OFFS

  Now, let's look at the spec critically. Here is where the philosophical camps diverge, where the contradictions lie, and what actually kills a theory.

  ## 1. Non-Negotiable vs. Camp Preferences

  **Non-Negotiable (Must Haves):**
  *   **Objectivity Constraint (2.3):** If a theory cannot explain why the classification of homosexuality was an *error* rather than just an *update*, it fails. A theory that says "Disease is whatever society dislikes" collapses medicine into sociology.
  *   **Triage Requirement (1.1):** If the theory cannot distinguish between "needs a doctor" and "needs a politician," it is useless for policy.
  *   **Empirical Consistency (2.1):** It cannot contradict basic biology. (e.g., A theory that claims "function" is whatever the individual wants it to be contradicts evolutionary biology).

  **Camp Preferences (Negotiable):**
  *   **Naturalist Preference:** "Function" must be defined strictly by evolutionary selection history (Boorse). *Critique:* This makes presbyopia a disease (it's a loss of function) or makes it impossible to define function in a rapidly changing environment.
  *   **Normativist Preference:** "Harm" must be a necessary condition for disease (Wakefield). *Critique:* This risks making disease subjective. If I have a fatal tumor but feel fine and don't value long life, is it not a disease?
  *   **Unification Preference:** Mental and Physical must be identical in definition. *Critique:* It might be pragmatically useful to treat them differently even if metaphysically they are the same.

  ## 2. The Impossible Triangle (Jointly Unsatisfiable Requirements)

  You cannot satisfy these three requirements simultaneously. You must drop one.

  1.  **Pure Value-Neutrality:** Disease is a purely biological fact, independent of human values.
  2.  **Normative Force:** Calling something a disease implies it *ought* to be treated/prevented.
  3.  **Extensional Adequacy:** The theory matches our intuitions on hard cases (e.g., aging, mild disorders).

  *   **If you keep 1 & 2:** You end up with a theory where any biological dysfunction is a disease, even if it doesn't harm the person (e.g., a asymptomatic genetic quirk). This medicalizes everything.
  *   **If you keep 1 & 3:** You end up with a theory that says disease is just "statistical deviation." This fails the Homosexuality Test (2.3) because homosexuality was statistically rare and deemed a dysfunction by the biology of the time.
  *   **If you keep 2 & 3:** You end up with a Normativist theory where Disease = Bad Thing. This fails the Objectivity Constraint because "Bad" changes with culture (e.g., drapetomania).

  **Most theories sacrifice Pure Value-Neutrality.** They admit that "function" is always selected relative to a goal, and goals are value-laden.

  ## 3. The "Killer" Requirement

  If you want to eliminate the maximum number of popular but sloppy theories in one stroke, use this requirement:

  ### **The Anti-Discrimination Constraint (Refined Objectivity)**
  > *The theory must provide a principled, biological reason why a socially stigmatized but functionally intact trait (e.g., homosexuality, left-handedness) is NOT a disease, independent of current social approval.*

  **Why this eliminates candidates:**

  1.  **Eliminates Pure Statistical Theories:** "Disease is statistical rarity."
      *   *Fail:* Left-handedness and homosexuality are/were rare. Theory falsely classifies them as diseases.
  2.  **Eliminates Pure Social Constructivist Theories:** "Disease is whatever medicine labels as deviant."
      *   *Fail:* Cannot explain why the 1950s classification of homosexuality was *wrong*. It can only say it was "different." If disease is just a label, no label is an error, only a shift in power.
  3.  **Eliminates Pure Welfarist Theories:** "Disease is whatever reduces well-being."
      *   *Fail:* In a homophobic society, being gay reduces well-being (due to stigma/violence). A pure welfarist account might classify it as a pathology of the individual rather than the environment.
  4.  **Eliminates Strict Evolutionary Naturalism (Boorse):** "Disease is reduction in contribution to survival/reproduction."
      *   *Fail:* This is the tricky one. Strict evolutionary accounts *do* classify homosexuality as a dysfunction (reproductive failure). To save this, Naturalists have to do gymnastics about "group selection" or "kin selection." If the theory can't cleanly rule out homosexuality as a disease without complex ad-hoc evolutionary justifications, it fails the spec.

  ## 4. What We Are Actually Arguing About

  When people argue "Is Addiction a Disease?", they are usually skipping the spec and fighting over two hidden variables:

  1.  **The Locus of Dysfunction:** Is the mechanism inside the skin (brain chemistry) or outside the skin (environmental mismatch)?
      *   *If inside:* It's a disease.
      *   *If outside:* It's a social problem.
      *   *Reality:* It's both. The theory needs to handle **interactional dysfunction**.
  2.  **The Goal of the Concept:** Are we trying to **excuse behavior** (legal/moral goal) or **allocate treatment** (medical goal)?
      *   Sometimes we want to call something a disease to get people treatment (Overdose risk).
      *   Sometimes we *don't* want to call it a disease to preserve agency (Responsibility for recovery).

  ## Summary Recommendation

  Stop asking "Is X a disease?"

  Start asking: **"Does classifying X as a disease satisfy the Anti-Discrimination Constraint while successfully triggering the Triage and Moral Exemption functions we need?"**

  If a theory of disease cannot explain why homosexuality isn't one without appealing to "because we say so now," throw the theory out. If a theory cannot explain why we treat cancer differently than poverty, throw it out.

  The "Spec" reveals that **Disease** is not a natural kind like "Gold" or "Water." It is a **hybrid kind**: a biological substrate selected for normative intervention. Any theory that tries to be 100% biological or 100% normative is guaranteed to fail the requirements doc.
