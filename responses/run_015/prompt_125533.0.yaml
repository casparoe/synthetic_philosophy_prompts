prompt: |-
  You are a senior clinical ethicist with training in philosophy of action and medical decision-making. Before drafting the protocol, take a moment to brainstorm the conceptual distinctions that standard assisted-dying review boards usually collapse into a single “autonomy” check. I need you to design a reusable, step-by-step evaluation procedure for a hospital clinical-ethics committee that reviews petitions for physician-assisted dying in a jurisdiction where the practice is legal but requires documented, multi-disciplinary sign-off.

  The committee meets weekly, spends no more than ninety minutes per petition, includes an attending physician, a nurse, a social worker, and a legal advisor but no trained philosophers, and must produce reasoning that can survive judicial or institutional audit. The physician submits a petition packet with clinical records.

  Your procedure must be grounded in a philosophical distinction that conventional protocols ignore: the separation between an authority-based gate (does the patient have the standing to direct the ending of their biological life?) and an axiological-coherence gate (is the requested death continuous with—rather than a repudiation of—the values and commitments that have structured the patient’s biographical narrative?). Treat these as two independent gates that must both open; do not collapse them into one autonomy assessment.

  Design the procedure as a flowchart in words: numbered stages in strict order. For each stage, specify (a) the precise question to ask, (b) what counts as a sufficient answer, (c) the required evidence, (d) the stop-point if the answer fails, and (e) an explicit flag wherever the question is irreducibly a value judgment that requires a documented committee vote rather than further fact-gathering.

  Then apply the full procedure to three petitions:
  1. A sixty-seven-year-old with advanced ALS who executed a detailed advance directive five years ago requesting aid in dying upon loss of independent respiratory function; the clinical threshold is now met, but the patient recently adopted a religious tradition that prohibits self-killing and now expresses ambivalence, asking the committee to decide.
  2. A forty-two-year-old with severe, treatment-resistant major depression, no physical illness, who has refused all psychiatric interventions for eighteen months; psychiatric evaluation finds intact cognition but notes that the desire for death tracks the depressive symptom profile with near-perfect correlation, and the patient’s family strongly supports the petition.
  3. One additional case you construct yourself, in which the procedure yields a recommendation that conflicts with common moral intuition—make the conflict explicit, show exactly which stage produces it, and state what the committee is forced to do despite that intuition.

  Finally, state clearly what the procedure cannot do: which disagreements it will fail to resolve, which cases it should refer back to the legislature or court rather than deciding internally, and where its structural commitment to the two-gate framework is likely to misfire or produce counter-intuitive results.

  Be precise, avoid generic lists like “respect autonomy, do no harm,” do not include bibliographies, reading lists, or citations, and check at each stage that the philosophical distinction actually survives translation into an operational test. Mark every point where judgment cannot be eliminated.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **Role:** Senior Clinical Ethicist with training in philosophy of action and medical decision-making.
      *   **Task:** Design a reusable, step-by-step evaluation procedure (flowchart in words) for a hospital clinical-ethics committee reviewing physician-assisted dying (PAD) petitions.
      *   **Constraints:**
          *   Committee composition: Attending physician, nurse, social worker, legal advisor (no philosophers).
          *   Time limit: 90 minutes per petition.
          *   Jurisdiction: Legal but requires multi-disciplinary sign-off.
          *   Core Philosophical Requirement: Distinguish between *Authority-Based Gate* (standing to direct biological end) and *Axiological-Coherence Gate* (continuity with biographical narrative/values). Do not collapse into generic "autonomy."
          *   Output Format: Numbered stages with (a) Question, (b) Sufficient Answer, (c) Evidence, (d) Stop-point, (e) Value Judgment Flag.
          *   Application: Apply to three specific cases (ALS/Ambivalence, Depression/Resistant, Constructed Counter-Intuitive).
          *   Limitations: State what the procedure cannot do.
          *   Tone: Precise, operational, no generic platitudes, no citations.

  2.  **Deconstruct the Philosophical Distinction:**
      *   *Authority-Based Gate (Competence/Standing):* This isn't just "capacity" in the legal sense (understanding risks/benefits). It's about *authorization*. Does the agent have the right to issue this specific command? Usually, this is age, citizenship, residency, and legal capacity. But philosophically, it's about the *source* of the will. Is it *their* will?
      *   *Axiological-Coherence Gate (Narrative Integrity):* This is the tricky one. Standard protocols ask "Is this voluntary?" This protocol asks "Is this *consistent*?" It looks at the diachronic self. Does this decision fit the story the person has been living? Or is it an alien intrusion (e.g., acute despair vs. settled conviction)?
      *   *The Tension:* A patient can have authority (competent) but lack coherence (acting against their own deep values). Or they can have coherence (fits their story) but lack authority (coerced or legally barred). Both gates must open.

  3.  **Drafting the Procedure (The "Flowchart in Words"):**
      *   Need to keep it under 90 minutes. So, stages must be efficient.
      *   *Stage 1: Legal/Statutory Thresholds (The Pre-Filter).* Before philosophy, check the law.
      *   *Stage 2: Authority Gate (Synchronic Capacity).* Can they speak *now*? (Or did they speak validly *then*?)
      *   *Stage 3: Axiological Gate (Diachronic Coherence).* Does this fit the narrative?
      *   *Stage 4: Integration & Vote.*

      *Refining the Distinction for Non-Philosophers:*
      *   Authority = "Is this voice legally and cognitively empowered to command death?"
      *   Coherence = "Is this command an expression of the life lived, or a rupture caused by pathology/external pressure?"

      *Drafting the Stages (Iterative refinement for operationalization):*
      *   *Stage 1 (Jurisdictional):* Simple checklist.
      *   *Stage 2 (Authority):* Focus on decision-making capacity *regarding this specific act*. Not just general competence.
      *   *Stage 3 (Coherence):* This needs to be the heavy lifter. How to measure "narrative continuity" without a philosopher? Use "Value History" vs. "Current Request." Look for stability over time.
      *   *Stage 4 (Resolution):* The vote.

      *Adding the Required Elements:* (a) Question, (b) Answer, (c) Evidence, (d) Stop-point, (e) Flag.

  4.  **Developing the Case Studies:**
      *   *Case 1 (ALS/Ambivalence):*
          *   Authority: High (previously competent, now incapacitated but AD exists). *Wait*, current ambivalence complicates authority. If they can't speak, does the AD hold? If they can speak but are ambivalent, is authority compromised? Let's assume they have fluctuating capacity or the AD is the primary authority source. The prompt says "now expresses ambivalence." This challenges the *Authority* gate (current will vs. past will).
          *   Coherence: The religious shift is a *change* in values. Is the AD (old values) coherent, or is the new faith (current values) coherent? This is the crux. The protocol must prioritize the *current* expression of values if capacity exists, or the *most settled* expression if capacity is gone.
          *   *Decision:* Likely Fail on Authority (current will is unclear/ambivalent) or Coherence (rupture in narrative). Let's aim for a "No Recommendation" due to Authority failure (ambivalence undermines the command).
      *   *Case 2 (Depression):*
          *   Authority: Intact cognition (legal capacity).
          *   Coherence: The desire tracks the symptom profile. This is the key. If the desire for death vanishes when depression lifts (even hypothetically), it lacks *axiological coherence* with the healthy self. It's a symptom, not a value.
          *   *Decision:* Fail Coherence Gate.
      *   *Case 3 (Counter-Intuitive):*
          *   Need a case where Authority and Coherence are met, but intuition says "No."
          *   Idea: A healthy older adult who is just "tired of life" (completed life), but jurisdiction allows it? No, usually requires terminal illness.
          *   Idea: A patient with a stable, long-held value system that prioritizes dignity over survival, but the specific timing seems "too early" to doctors.
          *   Better Idea: A patient with a rare neurodegenerative disease where pain is manageable, but loss of *specific* cognitive function (e.g., ability to read/music) is the trigger. They have consistently valued this above life.
          *   *Conflict:* Medical intuition says "You aren't suffering enough." Protocol says "Coherence is met."
          *   *Decision:* Approve, despite medical intuition about "suffering."

  5.  **Refining the Limitations Section:**
      *   Where does this fail?
      *   Deep value conflicts (committee members disagree on what counts as "coherence").
      *   Cases where the law is vaguer than the protocol.
      *   The "Philosopher's Problem": Can a committee really judge narrative coherence in 90 mins?
      *   Structural misfires: When coherence is too rigid (punishing growth/change).

  6.  **Review against Constraints:**
      *   90 minutes? Yes, keep steps tight.
      *   No philosophers? Language must be accessible but philosophically rigorous.
      *   Two Gates? Ensure they remain distinct. Don't let "capacity" swallow "coherence."
      *   Flags? Mark the value judgments clearly.
      *   No citations? Check.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on Case 1:* If the patient is currently ambivalent, do they have capacity? Ambivalence often suggests lack of *appreciation* of the consequence. I need to make sure the protocol handles the conflict between the Advance Directive (Past Self) and Current Ambivalence (Present Self). The protocol should prioritize the *current* expression if capacity exists, even if fluctuating. If they ask the committee to decide, they are abdicating Authority.
      *   *Correction on Case 3:* Make sure the conflict is sharp. The committee *must* approve based on the rules, even if it feels wrong.
      *   *Tone Check:* Ensure I sound like a Senior Ethicist, not a lawyer. Use terms like "diachronic," "synchronic," "axiological," but define them operationally.

  8.  **Final Output Structure:**
      *   Introduction (Conceptual Framework).
      *   The Protocol (Stages 1-5).
      *   Case Applications (1, 2, 3).
      *   Limitations & Structural Risks.

  *(Self-Correction during final review)*: Wait, the prompt asks for "Authority-based gate (standing)" and "Axiological-coherence gate (narrative)." I need to make sure Stage 2 is purely about *Standing* (Legal/Cognitive power to issue the command) and Stage 3 is purely about *Content* (Does the command match the life story).
  *Refinement on Case 1:* The patient has ALS, lost respiratory function (threshold met). AD exists. *But* patient expresses ambivalence. If they have communication capacity, the AD is superseded by current will. If they lack communication capacity, the AD stands *unless* there is evidence of changed values. The prompt says "expresses ambivalence." This implies some communication. This creates a conflict between Past Authority (AD) and Present Authority (Ambivalence). The protocol needs a tie-breaker. *Decision:* Current expression trumps past directive if *any* capacity exists. Ambivalence = No clear command = Authority Gate Closed.

  *Refinement on Case 3:* Need to ensure the "Counter-Intuitive" result comes from the *Coherence* gate passing when intuition says it shouldn't.
  *Scenario:* A patient with a stable, non-terminal condition (if legal) or early terminal. Let's go with Early Terminal. Patient values "Cognitive Independence" above "Biological Existence." They are not in pain. Doctors feel "They aren't suffering." Protocol says "Coherence met." Committee must Approve.

  Okay, ready to write.
answer: |-
  ### Conceptual Preamble: The Two-Gate Framework

  Standard assisted-dying protocols typically collapse all ethical scrutiny into a single "Autonomy/Capacity" assessment. They ask: *Is the patient competent and voluntary?* This conflates the **power to choose** (Authority) with the **substance of the choice** (Axiological Coherence).

  This protocol separates them:
  1.  **The Authority Gate (Synchronic):** Does the patient possess the standing *right now* to issue a command that ends biological life? This is not merely legal capacity; it is the absence of coercion and the presence of executive will.
  2.  **The Axiological-Coherence Gate (Diachronic):** Is this command an expression of the person's enduring narrative, or is it a rupture caused by acute pathology or external distortion? This asks if the death requested is continuous with the life lived.

  Both gates must open. A patient may have Authority but fail Coherence (e.g., acute depressive break). A patient may have Coherence but lack Authority (e.g., settled wish but currently delirious).

  ---

  ### The Protocol: Two-Gate Evaluation Procedure

  **Time Allocation:** 90 Minutes Maximum
  **Committee:** Attending Physician, Nurse, Social Worker, Legal Advisor
  **Input:** Petition Packet, Clinical Records, Interview Transcript (if available)

  #### Stage 1: Jurisdictional & Statutory Pre-Filter
  *Goal: Ensure the petition is legally cognizable before ethical review.*
  *   **(a) Question:** Does the petition meet all statutory eligibility criteria (residency, age, diagnosis, prognosis, waiting periods)?
  *   **(b) Sufficient Answer:** Yes/No verification against a statutory checklist.
  *   **(c) Evidence:** Legal intake form, medical certification of diagnosis/prognosis.
  *   **(d) Stop-point:** If **No**, petition is returned to the attending physician. Committee adjourns.
  *   **(e) Value Judgment Flag:** None. This is administrative compliance.

  #### Stage 2: The Authority Gate (Synchronic Standing)
  *Goal: Determine if the agent currently holds the power to command this act.*
  *   **(a) Question:** Is the request currently issued by a will that is uncoerced, executive, and stable enough to constitute a valid order?
  *   **(b) Sufficient Answer:** The patient demonstrates understanding of the act, absence of external pressure, and the ability to execute the decision without vacillation *at the time of review*.
      *   *Note on Advance Directives (AD):* If the patient lacks current capacity, the AD serves as a proxy for Authority *only if* there is no evidence of revocation or changed standing.
  *   **(c) Evidence:** Capacity assessment (Physician), Social Work interview regarding coercion/family dynamics, Patient statement (video or written).
  *   **(d) Stop-point:** If **No** (e.g., patient is delirious, coerced, or explicitly ambivalent/revoking), the petition fails. Committee recommends denial.
  *   **(e) Value Judgment Flag:** **[FLAG 1]** Determining "vacillation" vs. "normal human ambivalence." If the committee disagrees on whether the patient's hesitation constitutes a revocation of authority, a formal vote is required.

  #### Stage 3: The Axiological-Coherence Gate (Diachronic Narrative)
  *Goal: Determine if the request fits the biography of the patient.*
  *   **(a) Question:** Is the desire for death a continuation of the patient's long-held values, or is it an alien intrusion inconsistent with their biographical narrative?
  *   **(b) Sufficient Answer:** Evidence that the valuation of "death over life" in these specific circumstances predates the acute crisis or pathology, and aligns with past expressions of identity.
  *   **(c) Evidence:** Value history (Social Worker), prior statements/writings, testimony from long-term contacts, psychiatric history (to rule out symptom-driven desire).
  *   **(d) Stop-point:** If **No** (e.g., the desire emerged solely after a diagnosis without prior valuation of such loss, or tracks perfectly with a treatable mental health symptom profile), the petition fails. Committee recommends denial.
  *   **(e) Value Judgment Flag:** **[FLAG 2]** Determining "alien intrusion." Committee members must vote on whether the desire is *expressive* of the self or *destructive* of the self. This is not a fact; it is an interpretation of narrative integrity.

  #### Stage 4: The Integration & Conflict Check
  *Goal: Resolve tensions between Gate 2 and Gate 3.*
  *   **(a) Question:** If Authority and Coherence yield conflicting signals (e.g., High Authority/Low Coherence or Low Authority/High Coherence), does the jurisdiction prioritize current will or settled narrative?
  *   **(b) Sufficient Answer:** Adherence to jurisdictional precedence (typically Current Will > Advance Directive; Coherence > Pathology).
  *   **(c) Evidence:** Legal Advisor opinion on precedence.
  *   **(d) Stop-point:** If the conflict is unresolvable under current law (e.g., AD says yes, current ambivalent murmur says maybe), the petition fails on Authority (Stage 2).
  *   **(e) Value Judgment Flag:** **[FLAG 3]** If the law is silent on the hierarchy of Past vs. Present will in cases of fluctuating capacity, the committee must vote on the ethical priority.

  #### Stage 5: Final Recommendation & Audit Trail
  *Goal: Produce the sign-off document.*
  *   **(a) Question:** Do both gates stand open?
  *   **(b) Sufficient Answer:** Unanimous or Majority vote (per institutional bylaws) confirming Stage 2 and Stage 3 are passed.
  *   **(c) Evidence:** Signed minutes documenting the reasoning for each Gate separately.
  *   **(d) Stop-point:** If vote fails, petition denied.
  *   **(e) Value Judgment Flag:** **[FLAG 4]** The final vote itself. Dissenting opinions must be recorded specifically citing which Gate failed.

  ---

  ### Application to Case Petitions

  #### Case 1: The Ambivalent ALS Patient
  *   **Profile:** 67M, Advanced ALS. Respiratory threshold met. AD (5 years old) requests death. Recently adopted religion prohibiting self-killing. Currently expresses ambivalence, asks committee to decide.
  *   **Stage 1 (Statutory):** Pass. Diagnosis and threshold met.
  *   **Stage 2 (Authority):** **FAIL.**
      *   *Reasoning:* The patient currently possesses communication capacity (expresses ambivalence). Current will supersedes Advance Directive. Ambivalence ("you decide") is an abdication of Authority, not an exercise of it. An order to die cannot be issued by a delegate when the law requires personal command.
      *   *Evidence:* Patient statement asking committee to decide.
      *   *Flag 1 Applied:* Committee votes that "asking others to decide" constitutes a lack of executive will.
  *   **Stage 3 (Coherence):** **CONFLICTED.**
      *   *Reasoning:* The AD represents a 5-year coherent narrative. The new religion represents a *new* narrative. Is the new faith an "alien intrusion" or a genuine conversion?
      *   *Evidence:* Religious conversion timeline.
  *   **Stage 4 (Integration):** Since Authority failed, Coherence is moot.
  *   **Recommendation:** **DENY.**
  *   **Audit Note:** Denial is based on Stage 2 (Authority). The patient cannot delegate the act of dying to the committee. The AD is voided by current capacity to express doubt.

  #### Case 2: The Treatment-Resistant Depression Patient
  *   **Profile:** 42F, Major Depression (18 months), no physical illness. Refused interventions. Cognition intact. Desire for death correlates 100% with symptom severity. Family supports petition.
  *   **Stage 1 (Statutory):** **FAIL (Presumed).**
      *   *Note:* Most jurisdictions require terminal physical illness. Assuming a jurisdiction where psychiatric suffering is eligible (e.g., Benelux model) for the sake of the ethical test.
  *   **Stage 2 (Authority):** **PASS.**
      *   *Reasoning:* Cognition intact. No evidence of coercion (family support is noted, but Social Worker confirms no pressure). She can issue the command.
  *   **Stage 3 (Coherence):** **FAIL.**
      *   *Reasoning:* The desire for death tracks the symptom profile. This indicates the desire is an *alien intrusion* of pathology, not a continuation of biographical values. When depression lifts (even hypothetically), the value disappears. It lacks diachronic stability independent of the disease state.
      *   *Evidence:* Psychiatric evaluation noting correlation.
      *   *Flag 2 Applied:* Committee votes that a desire contingent entirely on a treatable (even if refused) mental state is axiologically incoherent with the "healthy self."
  *   **Recommendation:** **DENY.**
  *   **Audit Note:** Denial is based on Stage 3 (Coherence). Authority is present, but the request is deemed a symptom, not a value.

  #### Case 3: The "Satisfied Sufferer" (Constructed Counter-Intuitive Case)
  *   **Profile:** 55M, Early-onset Alzheimer's (diagnosed 2 years ago). Jurisdiction allows PAD for neurodegenerative conditions upon diagnosis of irreversible decline. He is currently pain-free, well-cared for, and not physically suffering. However, he has a 30-year history (documented in journals, interviews with siblings) of stating that "loss of memory is loss of self" and "I will not live as a shell." He meets clinical criteria. He is currently competent but will lose capacity soon.
  *   **Stage 1 (Statutory):** Pass.
  *   **Stage 2 (Authority):** **PASS.**
      *   *Reasoning:* Currently competent. Request is executive and uncoerced.
  *   **Stage 3 (Coherence):** **PASS.**
      *   *Reasoning:* The value ("memory = self") is deeply entrenched (30 years). The request is perfectly continuous with his biographical narrative. The fact that he is not *currently* suffering physically is irrelevant to his specific value hierarchy.
  *   **Stage 4 (Integration):** Both gates open.
  *   **Recommendation:** **APPROVE.**
  *   **The Conflict:** Medical intuition screams "Do No Harm." He is not suffering *now*. He is happy today. Killing him feels like a violation of beneficence.
  *   **Committee Obligation:** Despite the intuition that he "doesn't need to die yet," the protocol forces approval. His Authority is clear, and his Coherence is robust. To deny him is to impose the committee's valuation of "biological life" over his valuation of "biographical life."
  *   **Audit Note:** Approval granted. Dissent allowed on grounds of beneficence, but recorded as outside the Two-Gate scope.

  ---

  ### Limitations & Structural Risks

  This procedure is a tool for reasoning, not a moral algorithm. It has specific failure modes that must be acknowledged in the committee's charter.

  **1. The "Growth" Problem (Stage 3 Rigidity)**
  The Coherence Gate risks punishing genuine moral growth. If a patient radically changes values (like Case 1's religious conversion), the protocol struggles to distinguish between "authentic conversion" and "pathological rupture."
  *   *Risk:* The committee may privilege the *past* self (AD) over the *present* self (new values) by labeling the change as "incoherent."
  *   *Mitigation:* Stage 2 (Authority) must always trump Stage 3. If the patient has capacity, their current values define coherence, even if they contradict the past.

  **2. The "Philosopher's Gap" (Operationalizing Coherence)**
  The committee contains no philosophers. Stage 3 requires judging "narrative integrity," which is inherently interpretive.
  *   *Risk:* Committee members may substitute their own moral beliefs for "coherence." (e.g., "I don't think dying for this reason is coherent," vs "The evidence shows this is inconsistent with their life.")
  *   *Mitigation:* **[FLAG 2]** requires documented evidence of *prior* statements. Coherence cannot be guessed; it must be evidenced by historical data.

  **3. Jurisdictional Mismatch**
  This protocol assumes the law allows the committee to judge Coherence. In some jurisdictions, if Capacity (Authority) is met, the committee *cannot* deny based on the *reason* for the request.
  *   *Risk:* The committee may deny a petition based on Stage 3 that the law requires them to approve.
  *   *Mitigation:* Stage 1 must explicitly confirm that "reason-based review" is legally permissible. If the law is purely capacity-based, Stage 3 is advisory only.

  **4. The Counter-Intuitive Result (Case 3 Scenario)**
  As shown in Case 3, this protocol may mandate approval for patients who are not "suffering" in the medical sense.
  *   *Risk:* Institutional reputational damage or moral distress among clinical staff.
  *   *Mitigation:* The committee must explicitly educate the clinical team that "Axiological Coherence" is not "Medical Necessity." The protocol protects the patient's right to define suffering, not the doctor's.

  **5. Unresolvable Disagreement**
  If the committee splits 2-2 on **[FLAG 2]** (Coherence), the protocol dictates a Denial (conservative default).
  *   *Risk:* This effectively gives a minority veto on life-ending requests.
  *   *Mitigation:* Escalation path to an external ethics review board or court if the deadlock persists, rather than defaulting to denial indefinitely.

  **Final Note on Judgment:**
  This procedure does not eliminate moral judgment; it locates it. By flagging **[FLAG 1-4]**, we admit that at specific junctures, facts run out and values begin. The audit trail must capture *where* the value judgment occurred, ensuring that if the decision is challenged, the reviewers can show they did not hide value judgments behind claims of clinical fact.
