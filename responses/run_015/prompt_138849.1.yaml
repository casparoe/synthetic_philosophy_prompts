  7. You say vote on values, bet on beliefs. But policies change who exists or who counts—migration, fertility. The market ends up deciding whose welfare counts.
     **Likely answer:** The welfare measure specifies the population. The market just maximizes it.
     **Follow-up:** To specify that fully in advance, you'd need a constitution written as an index. Are you really proposing we solve all constitutional theory questions before we start trading?

  8. If the panel's estimate is what actually settles the bet, why do we need the market at all? Why not just let the panel recommend policy directly?
     **Likely answer:** The market aggregates dispersed information better than a panel.
     **Follow-up:** But if the panel's model overrides the market's intuition on settlement, won't traders just mirror the panel's model anyway? Doesn't the market become a redundant layer of bureaucracy?

  9. Who appoints the economists on the standing panel? If it's elected officials, they might pick compliant ones. If it's the market, that's circular.
     **Likely answer:** We use an independent process, like tenure or central bank appointments.
     **Follow-up:** But those processes are still political compromises. If the panel's independence relies on norms rather than structure, doesn't that reintroduce the governance risk you tried to solve with markets?

  10. You suggest piloting this on city councils. But if the counterfactual is unobservable by definition, how does the pilot prove anything?
      **Likely answer:** We look at proxy metrics like growth or stability.
      **Follow-up:** Name one specific observable proxy and one result that would make you say "okay, this doesn't work, we should stop." If everything counts as success, nothing does.
