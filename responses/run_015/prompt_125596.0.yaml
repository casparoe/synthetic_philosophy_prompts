  Socrates, you carve the matter finely, and I grant you that the ring of Nemesis isolates the sting of shame from the bite of punishment. It is a clever device, and I concede that if the compact holds under this ring, it must be because men fear the knowledge of their peers as much as their wrath. Yet this does not save my genealogy from your fork, nor does it answer my challenge; for if a man remains just under the gaze of Nemesis merely to avoid the pain of shame, he is still acting for a consequence, not for the sake of justice itself. Whether he fears the prison or the cold shoulder, he places justice in the second class of goods, practised for what it brings rather than for what it is.

  The true demand is not about the stability of the compact, but the state of the soul. You ask what my question was about all along, and I tell you: it was about whether justice is a health of the soul or merely a medicine taken to avoid pain. If the man under Nemesis is just only because he is watched, you have not shown me that justice is good in itself, but only that publicity is a constraint upon vice. Strip away the gaze entirely, as Gyges does, and show me why the soul of the just man is in a better condition than the soul of the unjust man, even if no god nor man ever knows the difference. Until you demonstrate this internal harmony, distinct from all external opinion, you have not given me a reason to wear the ring of Gyges and remain just.
