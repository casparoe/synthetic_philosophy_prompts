answer: |-
  In the borough of Oakhaven, a municipal time-banking initiative allows residents to earn 'hour-credits' for community labour, which the Council formally recognises as deductible against local utility bills and service charges, thereby embedding the credits within the legal-fiscal framework while participants simultaneously circulate them for private goods like tutoring and repairs. Initially, both institutional and functional accounts classify these credits as money, given the authoritative status assignment and their effective mediation of exchange. However, consider a counterfactual variation where the Council, following a budgetary review, formally rescinds the legal recognitions and tax deductibility of the hour-credits, yet the residents, unaware of the bureaucratic change or simply indifferent to it, continue to trade the credits for goods and services with the exact same frequency and reliability as before. In this revised scenario, the institutional account must declare the credits ceased to be money due to the loss of authoritative status, whereas the functional account maintains they remain money because their causal role in facilitating trade and storing labour value persists uninterrupted.

  The ontological divergence here hinges entirely on the locus of constitution. For the institutional-constructivist, following the Searlean tradition, money is an institutional fact created by the imposition of a status function ('X counts as Y in context C') backed by collective intentionality and often deontic power. When the Council withdraws recognition, the specific status function that constituted the credits as 'official money' is dissolved; without the authoritative backing to enforce the status, the object reverts to being a mere token of informal promise, regardless of its usage. Conversely, the functional-role account, rooted in economic sociology and Mengerian evolution, defines money by its causal profile: its ability to serve as a medium of exchange, a unit of account, and a store of value. Since the residents continue to use the credits to mediate transactions and store labour value with undiminished efficacy, the functional kind remains instantiated. The crucial feature doing the work is the decoupling of *authoritative status* from *exchange efficacy*. If one were to remove the continuity of exchange patterns—say, if the residents also stopped accepting the credits upon hearing the news—the disagreement would collapse back into agreement: both theories would concede the credits are no longer money, as the functional role would have vanished alongside the institutional status.

  An astute defender of the institutional view might attack this construction by arguing that collective intentionality does not reside solely in the Council. They would contend that if the community continues to treat the credits as binding obligations, the community itself has become the constitutive authority, thereby preserving the status function through informal collective acceptance rather than municipal decree. This objection highlights a vulnerability in the thought experiment: it assumes institutional power is top-down rather than emergent. However, this defence stretches the notion of 'status function' until it becomes indistinguishable from the functional role itself, risking vacuity.

  I maintain that the functional-role account handles this case more plausibly. The institutional view risks conflating the *regulation* of money with the *ontology* of money. In the Oakhaven scenario, the social reality of the credits—their power to coordinate economic behaviour—remains intact despite the bureaucratic withdrawal. To claim the credits cease to be money simply because a council minute changed is to privilege administrative fiat over social practice. Money is fundamentally a tool of coordination; if the coordination persists, the tool exists. The functional account respects the phenomenological reality of the users, for whom the credits possess all the practical properties of currency, whereas the institutional account imposes an external metaphysical veto that contradicts the lived experience of the economic actors. Therefore, the functional definition offers a more robust ontology, one that captures the resilience of monetary kinds even when their legal scaffolding is temporarily removed.
