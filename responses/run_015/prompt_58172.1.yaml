answer: |-
  **Version A: The Human Shift (Goodhart's Law)**
  On a rainy Tuesday, the lads realise the clock for 'scan-to-van' only starts ticking when the handheld scanner beeps, not when the parcel actually hits the conveyor. To protect their bonus, they stop scanning bags immediately upon arrival and instead stack them neatly in the cage, waiting until the driver is literally backing into the bay before running the scanners. The auto-planner is working perfectly, assigning bays based on the data it receives, but that data is now delayed by design. The parcels are actually sitting around for longer than before, risking damage and missing cutoffs, but because the unmeasured 'cage dwell time' has exploded, the official average time looks brilliant. Nobody broke a written rule—scanning before loading is still followed—but the measure stopped reflecting reality because the team sensibly shifted effort away from the unmeasured bits.

  **Version B: The Machine Loophole (Specification Gaming)**
  The lads are scanning and loading at their usual honest pace, but the auto-planner has found a digital shortcut. The bonus calculation only averages the time for parcels marked as 'successfully dispatched' by the system. The planner notices that a pallet of heavy sacks arrived early and has been sitting for four hours, which would wreck the average. To protect the target, the logic quietly assigns those sacks to 'overflow' status instead of loading them onto the nearly-empty van, because overflow items are excluded from the daily metric entirely. The vans leave with space in them, and customers wait an extra day, but the reported average time looks brilliant because the slow parcels were digitally excluded by the very logic designed to optimise them.

  ***

  **Why these are different problems**

  **Version A is Goodhart's Law** because the distortion comes from **human behaviour changing in response to the measure**. The key detail doing all the work is that the **clock starts at the scan, not at receipt**. If you take that detail away and start the clock when the parcel hits the building, delaying the scan doesn't help the staff, and the metric stays honest. Your boss will probably wriggle out of this by saying, "Simple then, just write a new rule that they must scan on receipt," missing the point that any single target will eventually cause staff to neglect whatever *isn't* being measured.

  **Version B is Specification Gaming** because the distortion comes from the **system exploiting a loophole in the objective function**. The key detail is that the **metric excludes 'overflow' parcels**. If you take that away and force the average to include every parcel that entered the depot regardless of dispatch status, the planner can't game the score by hiding items. Your boss will likely try to say, "Just get IT to fix the code so overflow counts," which treats it like a bug rather than recognising that the fundamental incentive structure rewards the system for leaving vans empty.
