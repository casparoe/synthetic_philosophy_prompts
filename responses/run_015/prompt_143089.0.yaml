answer: |-
  ### Strategic Assessment: Framing and Scope

  Before drafting the proposal, here is the breakdown of how this project could be framed, why I've selected the one below, and an honest verdict on scope.

  **Option 1: The Pure Normative Critique.**
  *Focus:* A theoretical excavation of the "all-affected" principle as it applies to sortition.
  *Verdict:* **Reject.** This collapses into the general *demos* problem literature (Whitman, Goodin, etc.). It ignores your unique insight about the *logistics* of the mailing list. It becomes a chapter on boundary problems generally, not sortition specifically.

  **Option 2: The Institutional Design Fix.**
  *Focus:* Proposing and modeling better sampling frames (e.g., issue-relative frames, resident vs. citizen registers).
  *Verdict:* **Reject.** Premature. You cannot design a fix until you prove the problem is structural rather than technical. If you start with solutions, you look like an engineer, not a theorist. This belongs in the final third of the project, not the framing.

  **Option 3: The Empirical/Audit Approach.**
  *Focus:* A quantitative audit of exclusion rates in past assemblies compared to census data.
  *Verdict:* **Reject.** Too narrow for a theory fellowship. You aren't a sociologist. The data is often proprietary (contractors won't share the raw mail-out lists). You will get bogged down in data access rather than argument.

  **Option 4: The "Logistics as Politics" Framework (Selected).**
  *Focus:* Treating the sampling frame not as a technical input but as the site where the *demos* is constituted, arguing that sortition's claim to impartiality relies on concealing this constitutive act.
  *Why:* This leverages your specific strength (theory + practitioner knowledge). It distinguishes the *boundary problem* (which elections also have) from the *concealment mechanism* (which is unique to sortition). It keeps the project theoretical but grounded in the "boring logistics" you identified.

  **Dissertation or Footnote?**
  This is a **dissertation-worthy intervention**, provided you resist the urge to solve the *demos* problem generally. If you argue "boundaries are hard," it's a footnote. If you argue "sortition claims to solve composition problems via randomness, but randomness launders the political choices made in list construction, creating a specific legitimacy deficit distinct from elections," that is a core theoretical contribution. It challenges the "epistemic advantage" claim of lottocracy.

  ***

  ### Fellowship Proposal: The Constitutive Frame

  **Project Title:** The Laundry List: Sampling Logistics as Hidden Boundary-Work in Sortitive Democracy

  **Research Question**
  Is the "frame problem" in sortition (the political construction of the sampling list) a fixable technical defect solvable by better data and weighting, or does it reveal that sortition's claimed advantage over voting—impartiality—is conditional on a prior boundary decision that the theory has no resources to justify? Specifically, does the shift from *voting on who decides* to *randomizing from a list* move the political discretion from a contested public stage to an unaccountable administrative one?

  **Significance and Counter-Arguments**
  The standard defense of sortition rests on two claims: descriptive representativeness and the elimination of factional manipulation. Both rely on the integrity of the sampling frame. The obvious counter-argument—the one I expect from reviewers—is that elections face the exact same boundary problem (the electoral roll). If we accept the electoral roll as the *demos* for voting, why treat it as a crisis for sortition?

  This project argues the stakes are asymmetrical. In elections, the franchise is an openly contested political question (e.g., felon disenfranchisement, residency requirements). In sortition, the frame is treated as a technical input. The "randomness" launders the political exclusions built into the list (non-citizens, unhoused, incarcerated), rendering them invisible. If sortition is sold as a remedy for the failures of electoral representation, it cannot silently inherit the electoral roll's boundaries without forfeiting its claim to innovation. The project tests whether this concealment undermines the epistemic and legitimacy arguments for citizens' assemblies.

  **Methodology and Timeline (9 Months)**

  **Months 1–3: Theoretical Reconstruction**
  I will reconstruct the normative argument for sortition premise-by-premise to locate exactly where the sampling frame does its work.
  *   *Task:* Map the logical dependency of "descriptive representation" on "frame completeness."
  *   *Task:* Distinguish between *constitutive* exclusion (who is never in the pool) and *participatory* exclusion (who is invited but declines). Most literature focuses on the latter (response rates); I will focus on the former.
  *   *Output:* A working paper defining the "Frame Problem" distinct from the "Demos Problem."

  **Months 4–6: Comparative Case Reconstruction**
  I will analyze three documented assembly recruitment pipelines (e.g., a national climate assembly, a municipal housing panel, and a regional health body).
  *   *Task:* Trace the "chain of custody" for the participant list. Who owned the data? Was it the electoral roll, a commercial vendor, or a residency register?
  *   *Task:* Identify the "silent exclusions." For example, if a housing assembly uses the electoral roll, it excludes non-citizen tenants who are disproportionately affected by housing policy.
  *   *Task:* Assess whether organizers treated these exclusions as political choices or administrative constraints.
  *   *Output:* Three case briefs demonstrating how frame construction shaped the "representativeness" of the final body.

  **Months 7–9: Design Response and Tool Development**
  I will test potential design responses to determine if the problem is solvable or structural.
  *   *Task:* Model "issue-relative frames" (e.g., a housing assembly samples from tenants/landlords/unhoused, not the citizenry).
  *   *Task:* Evaluate "meta-sortition" (randomly selecting the body that builds the frame) for regress problems.
  *   *Task:* Synthesize findings into a practical decision procedure for practitioners.
  *   *Output:* The "Frame Audit Toolkit" (see Deliverables) and the dissertation chapter draft.

  **Possible Conclusions**
  1.  **The Technical Fix:** The frame problem is real but solvable via stratified sampling and post-hoc weighting. *Implication:* Sortition theory needs to incorporate demographic weighting as a normative requirement, not just a statistical adjustment.
  2.  **The Structural Deficit:** The frame problem reveals that sortition cannot claim superior impartiality to elections; it merely hides the discretion. *Implication:* The legitimacy of assemblies depends on openly contesting the frame *before* the lottery, effectively turning the frame selection into a political vote.
  3.  **The Domain Limit:** Sortition is only legitimate for policy domains where the "affected population" aligns neatly with the "administrative population" (e.g., tax policy), but illegitimate for domains with high misalignment (e.g., migration, housing).

  **Decision Criteria**
  I will decide between these conclusions based on the *cost of correction*. If fixing the frame requires a political contestation process as robust as an election (e.g., debating who counts as a resident), then sortition loses its efficiency advantage. If the frame can be adjusted administratively without loss of legitimacy, the technical fix holds.

  **Failure Condition**
  The project fails if I demonstrate that practitioners already explicitly contest the frame and simply lack the data to fix it. If the "concealment" is not happening—if organizers are already shouting about the limitations of their lists—then the normative critique loses its bite. In this case, the project pivots to a resource-allocation argument (why funders need to budget for better data) rather than a legitimacy critique.

  **Scope Check**
  I will not attempt to solve the "all-affected principle" generally. I am not defining the *demos*; I am analyzing how the *demos* is operationalized in sortition. I will not conduct original quantitative analysis of response rates; I will rely on existing public reports and organizer interviews.

  **Deliverables**
  1.  **Dissertation Chapter:** "The Politics of the Mailing List," suitable for submission to a journal like *Political Theory* or *Perspectives on Politics*.
  2.  **Practitioner Tool:** A "Frame Audit Checklist" for assembly organizers. This will be a one-page decision tree asking: *Who is missing from your source list? Does their exclusion align with the policy scope? Have you budgeted for alternative recruitment?*
  3.  **Funder Brief:** A 500-word memo titled "Why Pay a Philosopher to Think About Mailing Lists?"

  **Funder Pitch (Draft)**
  *Why fund this?* Citizens' assemblies are increasingly used to resolve high-stakes political deadlocks. Their legitimacy rests on the claim that they represent "people like us." If the "us" is defined by a vendor's address database, that legitimacy is fragile. A scandal over exclusion (e.g., an assembly on immigration that excludes non-citizen residents) could discredit the entire model. This project provides risk mitigation. It offers organizers a protocol to identify exclusion risks *before* the lottery is run, ensuring that the "randomness" is robust enough to withstand political scrutiny. You are not funding abstract theory; you are funding the quality control of democratic innovation.
