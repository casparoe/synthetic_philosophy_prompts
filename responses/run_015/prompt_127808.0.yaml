answer: |-
  **Workshop Proposal: Stacked Performatives & Digital Felicity**
  **Duration:** 3 Days
  **Format:** Intensive Seminar + Working Group

  **The Exact Question**
  When a single automated message (like a TOS update or ban notice) simultaneously notifies, binds, and disclaims, does this layered structure break Austin's felicity conditions, or do we just need to tweak the framework?

  **Why the Standard Accounts Miss the Mark**
  Austin and Searle mostly looked at singular, human-to-human acts. A misfire was a one-off glitch—like saying "I do" when you're already married. But digital institutional messages are dense. One click on "I Agree" isn't just consent; it's often a waiver, a contract signature, and a privacy acknowledgement all stacked together. 

  The standard model treats infelicities as exceptions, but in digital spaces, the "misfire" might be the default mode because the utterance is trying to do too much work at once. The authority is unclear (who is the bot?), uptake is assumed (scrolling = agreeing), and the procedure is opaque. Austin imagined a wedding, not a cookie banner.

  **Method**
  We aren't trying to rewrite *How to Do Things with Words*. We're stress-testing it.
  1.  **Corpus:** Collect 10-15 real-world examples (app update pop-ups, content moderation emails, automated contract changes).
  2.  **Analysis:** Close-read each message against Austin's six felicity conditions. Map every performative verb or function hidden in the text.
  3.  **Comparison:** See where the conditions hold and where they snap.

  **Success vs. Failure**
  *   **Success:** We identify a specific "stacking" condition that needs adding to the framework. We show that digital performatives aren't just infelicitous, they're a new category.
  *   **Failure:** We prove Austin was right all along—these messages are just massive piles of abuses and misfires with no binding power (which is a scary thought for legal theory). Or, we run out of time and just end up complaining about Terms of Service.

  **Scope Check (3 Days)**
  This is tight. We can't cover all digital speech.
  *   **Day 1:** Refresh on Austin/Searle + finalize the corpus of messages.
  *   **Day 2:** Group close-reading and mapping against felicity conditions.
  *   **Day 3:** Drafting findings + deciding if the framework needs a tweak or a overhaul.

  No grand theories, just a focused pilot study. If it works, we expand later.
