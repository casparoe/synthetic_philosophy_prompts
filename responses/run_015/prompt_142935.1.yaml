  ***

  **JOINT STATEMENT: DIACHRONIC RATIONALITY & THE MONEY PUMP**
  **Submitted by:** The Coherence Coalition (Camp 1) & The Temporal Pluralists (Camp 2)

  **1. AGREED CLAIMS**
  *Both camps sign off on the following formal and definitional groundwork.*

  1.  **Formal Structure:** We agree that a "money pump" relies on cyclic preferences (A > B, B > C, C > A) allowing a sequence of trades that returns the agent to their starting state but with less resources. In the diachronic version, these trades occur across time slices (t1, t2, t3) rather than instantly.
  2.  **Definition of Exploitation:** We agree that exploitation occurs when an external actor extracts net value from an agent system without providing compensating benefit, relative to a baseline where the agent held steady. Both sides agree this requires a definable "agent system" to be the locus of the loss.
  3.  **Role of Continuity:** We agree that the strength of any rational obligation binding a future self to a past self is a function of psychological continuity. We disagree on the function (linear vs. threshold vs. null), but agree that if continuity drops to zero, the normative force of past preferences vanishes.
  4.  **The Escrow Scenario:** We agree that the "Recursive Escrow Pump" (described below) is a valid test case. It isolates the variable of *time* from the variable of *preference stability* by introducing compound interest as an amplifying factor for small preference shifts.

  **2. DISAGREEMENTS TABLE**

  | Issue | Camp 1: Diachronic Coherence | Camp 2: Temporal Pluralists |
  | :--- | :--- | :--- |
  | **Metaphysics of the Agent** | The person is a single extended entity. Time-slices are just phases of one thing, like a road is one object despite having miles. | The person is a sequence of overlapping selves. "Identity" is a loose metaphor for causal connection, not a hard boundary. |
  | **Normative Force** | Past commitments bind future selves. To ignore a prior plan is to violate rational integrity. You owe it to *yourself* (temporally extended) to stick the landing. | Obligations are local. A self at t1 can advise t2, but cannot bind them. Growth often *requires* violating past plans. |
  | **Verdict on Pumps** | Vulnerability to a pump proves irrationality. If you can be drained, your preference structure is broken. | Vulnerability proves nothing. If the self at t3 is different than t1, the "loss" is just a transfer between different people. |
  | **View on Regret** | Regret is a signal of error. If t3 regrets t1's choice, one of them is wrong about the good. | Regret is just data. It signals a shift in values, not necessarily a mistake in reasoning. |

  **3. THE RECURSIVE ESCROW PUMP (NICHE CASE)**

  **The Scenario:**
  An agent deposits $100k into a long-term escrow fund at age 20. The fund offers a rebalancing option every 10 years. At each interval (30, 40, 50, 60), the agent's preferences shift slightly due to normal aging (e.g., becoming more risk-averse). Each shift triggers a voluntary switch to a new portfolio option that feels preferable *at that moment*, but each switch carries a 1% fee and resets the compound interest clock slightly. By age 70, the agent has made 5 rational, local choices, but the cumulative fees + lost compound growth mean they end up with 40% less wealth than if they had stuck to the age-20 plan.

  **Camp 1 Prediction (Coherence):**
  This reveals deep irrationality. The agent failed to recognize themselves as a temporally extended entity. They should have used a "pre-commitment strategy" at t0 to lock out future choices. The fact that the choices felt rational *locally* is irrelevant; the global outcome is dominated by a strategy they could have chosen earlier. The loss is real becuase the person at 70 is the same entity who lost the money at 20.

  **Camp 2 Prediction (Pluralists):**
  This reveals normal aging. The 70-year-old is not the 20-year-old. The 20-year-old wanted risk; the 70-year-old wants security. Paying the fee to switch is the rational price for the later self to live according to *their* values, not the dead values of the earlier self. There is no "drain," only a cost of living for a changing identity.

  **The Settling Feature:**
  Both sides agree the debate turns on the **Ratio of Drift to Interest**.
  *   **Camp 1 says:** If the preference drift is small (low velocity) but the interest loss is high, irrationality is *higher*. You shouldn't burn down the house over a minor preference tweak.
  *   **Camp 2 says:** If the preference drift is small, the cost matters less. But if the interest loss is high, it just means the earlier self was too aggressive. The concrete feature that settles it is whether the agent at t(n) would have paid the fee *knowing* the future drift. Camp 1 says yes (they should have); Camp 2 says no (that info doesn't belong to them).

  **4. CRUXES**

  1.  **The Metaphysical Crux:** Is personal identity a further fact (Camp 1) or a convenient fiction (Camp 2)? If it's a fiction, the money pump is just a transfer between strangers who happen to share a body.
  2.  **The Normative Crux:** Does rationality require maximizing across a lifetime, or only maximizing at the moment of choice? Camp 1 says lifetime utility is the only metric that matters. Camp 2 says "lifetime utility" is a view from nowhere that no actual self ever experiences.
  3.  **The Exploitation Crux:** Who is the victim? Camp 1 says the "Person" is the victim. Camp 2 says if every individual time-slice consented to the trade at the moment it happened, no victim exists. You can't exploit a series if every link in the chain自愿 (voluntarily) agreed.

