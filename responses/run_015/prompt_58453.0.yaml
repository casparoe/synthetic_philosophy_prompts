      *   Conclude with the implication for political strategy (socialize the code).

  7.  **Final Review against User Prompt:**
      *   Did I address "free appropriation of fixed capital"? Yes (via *Grundrisse*).
      *   Did I address "continuation of exploitation"? Yes (via *Capital* Vol 1 & Subsumption).
      *   Is it suitable for a PhD student? Yes, assumes familiarity with texts.

  **(Self-Correction during drafting):** I need to make sure I don't conflate Marx with later Marxists (like Adorno or Post-Operaists), though referencing the *Grundrisse* is essential for the "automation" angle. I must keep the core analysis grounded in Marx's own categories (value, labor, capital) while applying them to AI. The "licensing" fee is essentially rent, which Marx discusses in Vol 3 regarding landed property, but applicable here to IP.

