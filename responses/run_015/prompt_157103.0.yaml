  | **The arbitrariness motivation** (Levi-style) | **Model selection bias / Equifinality.** Multiple models pass validation; one is picked for deployment. | Distorted | You view picking one as engineering necessity; IPC views it as rational violation. The "cost" of picking is ignored in your loss. | my_vocab_is_missing_something |
