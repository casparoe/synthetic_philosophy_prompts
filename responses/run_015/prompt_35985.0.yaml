answer: |-
  The phenomenon you are describing is robustly documented, though it wears different hats depending on whether you ask a philosopher, a cognitive psychologist, or a neuroscientist.

  The most precise established concept for what you are experiencing is **Tacit Knowledge**.

  However, because you are asking for the edges and nuances (specifically distinguishing it from motor habits and establishing its status as "knowledge"), you need to look at the intersection of three frameworks: **Polanyi's Tacit Knowledge**, **Naturalistic Decision Making (Recognition-Primed Decision)**, and **Implicit Learning**.

  Here is the breakdown of the concept, why it fits your description, and where the boundaries lie.

  ### 1. The Epistemic Name: Tacit Knowledge
  The term was coined by the polymath Michael Polanyi in his 1966 book *The Tacit Dimension*. His famous maxim is: **"We can know more than we can tell."**

  Polanyi argued that explicit rules (textbooks, algorithms) are always subordinate to a deeper, unarticulated understanding. In your context, the "rules" the resident wants are *explicit propositions* (e.g., "If density > X, then pathology"). Your brain is operating on *tacit integration*.

  *   **The Structure:** Polanyi describes this as a relationship between **Subsidiary Awareness** and **Focal Awareness**.
      *   **Focal:** The diagnosis ("This is fine").
      *   **Subsidiary:** The thousands of micro-features (texture, gradient, symmetry, noise pattern) you are relying on to reach the focal point.
  *   **The Constraint:** You cannot focus on the subsidiaries without destroying the performance. If you try to consciously inspect the specific pixels or features that triggered the "fine" signal, you shift them from subsidiary to focal awareness, and the gestalt collapses. This explains why you cannot construct the rule afterwards; the rule requires the features to remain in the background.
  *   **Why it is Knowledge, not Habit:** Polanyi insists this is a form of *intellectual* passion and judgment, not just reflex. It is truth-apt (it can be wrong) and world-responsive (it updates with new data). This matches your intuition that it behaves like knowledge.

  ### 2. The Cognitive Name: Recognition-Primed Decision (RPD)
  In cognitive psychology and expertise studies (specifically the work of Gary Klein and Daniel Kahneman), this is often modeled as **System 1 Expertise** or **Recognition-Primed Decision Making**.

  *   **The Mechanism:** Unlike a novice who uses analytic reasoning (System 2: "Check A, then B, then C"), an expert matches the current situation to a library of stored prototypes.
  *   **The "Wordless Certainty":** When you see the scan, you aren't solving a problem; you are recognizing a situation. The "feeling" of normalcy is the match signal.
  *   **Differentiation from Bias:** In novices, System 1 is where biases live (heuristics). In experts, System 1 is where *calibrated intuition* lives. Kahneman notes that expert intuition is valid only when the environment is sufficiently regular to be learned and the expert has had adequate opportunity to learn it. Radiology fits this criteria (high regularity, high feedback loop).
  *   **The Edge:** This model explains the *generalization* you mentioned. You aren't matching exact images; you are matching structural relationships. That allows you to correctly classify scans you've never seen before, provided they share the underlying structural "grammar" of the pathology (or lack thereof).

  ### 3. The Mechanistic Name: Implicit Learning
  Neuroscience and psychology refer to the acquisition process as **Implicit Learning**.

  *   **Definition:** Learning complex information without conscious awareness of what was learned.
  *   **The Evidence:** The classic example is the "Artificial Grammar" task. Subjects are shown strings of letters generated by a complex rule set. They learn to identify "correct" strings with high accuracy but cannot state the rules. When asked to guess the rules, their stated rules often differ from the actual grammar, yet their performance remains high.
  *   **Relevance to You:** This confirms your suspicion that "there was never a rule in my head to begin with." The neural weights were adjusted by feedback (training cases) without encoding a propositional statement.
  *   **Why Post-Hoc Rationalization Fails:** When you try to explain it to the resident, your explicit system (left hemisphere, linguistic) tries to reverse-engineer the output of the implicit system (pattern-matching networks). It creates a "confabulation" that sounds logical but doesn't actually drive the decision. This is why your constructed rules misclassify cases your intuition gets right.

  ### Distinguishing from the Pianist (The "Edges")
  You asked if this is the same as a pianist's fingerings. The answer is **no**, though they share a root mechanism.

  *   **Pianist (Procedural Memory):** This is primarily **motor procedural knowledge**. It is stored in the basal ganglia and cerebellum. The output is *action*. If you ask a pianist to explain their fingering, they can't tell you, but the knowledge is embodied in the movement itself.
  *   **Radiologist (Perceptual-Cognitive Expertise):** Your output is a *propositional attitude* ("This is fine"). It is **perceptual learning** (neural tuning in the visual cortex) coupled with **cognitive categorization**.
  *   **The Language Analogy:** Your second-language example is actually a closer fit than the pianist. Linguistic intuition (knowing a sentence "sounds wrong") is **non-propositional knowledge that yields a propositional judgment**.
      *   *Pianist:* Input (Sheet music) -> Implicit Processing -> Output (Motor action).
      *   *Radiologist:* Input (Scan) -> Implicit Processing -> Output (Judgment/Label).
      *   *Linguist:* Input (Sentence) -> Implicit Processing -> Output (Judgment of grammaticality).

  You are describing **Cognitive Intuition**, not Motor Procedural memory. The distinction is vital because cognitive intuition is subject to logical verification (you can be proven wrong by a biopsy), whereas motor memory is only subject to functional verification (did the note sound right?).

  ### The Danger Zone: The Rationalization Trap
  There is a specific term for the error you described regarding the resident: **Confabulation of Expertise**.

  Because you possess *Tacit Knowledge*, you feel pressure to provide *Explicit Knowledge* for teaching purposes. When you construct a rule post-hoc, you are generating a hypothesis that fits the data you *remember*, not the data your brain *used*.
  *   **The Risk:** If you teach the resident the post-hoc rule, you are teaching them a simplified, explicit heuristic that lacks the sensitivity of your implicit model. They will fail on the edge cases that your intuition handles correctly.
  *   **The Solution:** Expertise literature suggests that to teach tacit knowledge, you cannot state rules. You must use **guided perception**. You have to force the resident to look at the specific subsidiary features until *their* implicit system calibrates to the pattern. You cannot transfer the file; you have to train their neural net.

  ### Summary
  *   **The Philosophical Term:** **Tacit Knowledge** (Polanyi). This captures the "we know more than we can tell" aspect.
  *   **The Cognitive Term:** **Recognition-Primed Decision Making** (Klein). This captures the speed and pattern-matching aspect.
  *   **The Learning Term:** **Implicit Learning**. This captures the acquisition without conscious rules.
  *   **The Classification:** It is **Perceptual-Cognitive Expertise**, distinct from Motor Procedural Memory.

  It deserves a name because it is the primary engine of high-stakes expertise. Relying on it is efficient; trying to translate it into explicit rules for yourself is often destructive (paralysis by analysis), though translating it for others is necessary for teaching, provided you acknowledge the translation is lossy.

  You are not "just experienced." You are running a high-dimensional classifier that operates outside your linguistic interface.
