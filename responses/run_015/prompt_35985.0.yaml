      *   *Addressing the Pianist:* Differentiate **Procedural Memory** (motor) from **Perceptual/Cognitive Expertise**. The pianist's fingers are motor; the radiologist's "eye" is perceptual-cognitive. They share implicit learning but differ in output modality.
