      *   *Unconscious inference:* Helmholtz? Close, but often perceptual.
      *   *Tacit Knowledge:* Polanyi. "We know more than we can tell." Very strong candidate.
      *   *System 1 Thinking:* Kahneman. Fast, automatic. But often associated with bias, whereas the user describes *expertise*.
      *   *Pattern Recognition:* Common in radiology literature. But is it a "name" for the epistemic state?
      *   *Non-propositional Knowledge:* Philosophical term.
      *   *Procedural Knowledge:* Usually motor skills (riding a bike). User explicitly excludes this.
      *   *Expert Intuition / Clinical Intuition:* Common in medical literature.
      *   *Gestalt:* Seeing the whole rather than parts.
      *   *Implicit Learning:* Psychology term.

  3.  **Evaluating the Candidates:**

      *   **Tacit Knowledge (Michael Polanyi):**
          *   *Fit:* High. "We know more than we can tell." Specifically addresses the inability to articulate the rules.
          *   *Nuance:* Distinguishes between *focal* awareness (the diagnosis) and *subsidiary* awareness (the features).
          *   *Boundary:* Covers intellectual skills, not just motor. Fits the "knowledge" aspect better than "habit."

      *   **System 1 vs. System 2 (Daniel Kahneman):**
          *   *Fit:* Moderate. Describes the *process* (fast, automatic) but doesn't necessarily capture the *epistemic status* (knowledge vs. habit).
          *   *Nuance:* In expertise, System 1 is trained System 2.
          *   *Boundary:* Often framed around bias/heuristics, but expert intuition is the "good" side of System 1.

      *   **Implicit Learning / Implicit Cognition:**
          *   *Fit:* High (Psychology/Neuroscience). Learning without conscious awareness of what was learned.
          *   *Nuance:* Explains *how* it got there.
          *   *Boundary:* Often experimental (artificial grammar). Does it scale to complex radiology? Yes, but "Tacit Knowledge" is more philosophical/epistemic.

      *   **Pattern Recognition (Gestalt):**
          *   *Fit:* High (Radiology specific).
          *   *Nuance:* "The whole is greater than the sum of parts."
          *   *Boundary:* Describes the *mechanism* of perception, less the *state of knowledge*.

      *   **Non-Propositional Knowledge:**
          *   *Fit:* High (Philosophy). Knowledge that isn't stored as "facts/rules."
          *   *Nuance:* Contrasts with "Know-that" vs. "Know-how." But user says it feels like "Know-that" (truth-apt). This is a specific philosophical puzzle (Knowledge-How vs. Knowledge-That).

  4.  **Selecting the Best Fit:**
      *   **Tacit Knowledge** is the strongest historical and philosophical match. It was literally invented to describe this gap in scientific/expert reasoning.
      *   **Expert Intuition** (specifically the Klein/Kahneman view) is the practical cognitive science match.
      *   **Implicit Learning** is the mechanistic neuroscience match.
      *   **Gestalt Perception** explains the visual component.

      *Decision:* The core answer should be **Tacit Knowledge** (Polanyi), supported by **Expert Intuition** (Kahneman/Klein) and **Implicit Learning**. I need to explain *why* these fit and where they differ from the "pianist" example (Procedural Memory).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the expertise:* Validate the experience. It's real and documented.
      *   *Primary Term:* **Tacit Knowledge**. Explain Polanyi. "We know more than we can tell." Explain the Focal/Subsidiary distinction. This addresses the "nothing to tell them" aspect.
      *   *Cognitive Science Term:* **System 1 Expertise / Expert Intuition**. Differentiate from novice heuristics. Mention Gary Klein (Naturalistic Decision Making). This addresses the "reliably right" and "generalization" aspect.
