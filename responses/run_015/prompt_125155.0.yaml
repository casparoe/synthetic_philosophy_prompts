answer: |-
  This is the right question to ask. The field has saturated on "why moral uncertainty matters" (MacAskill 2014) and "introductory surveys" (Sepielli, Tarsney). If you want to build decision procedures (e.g., for AI alignment, institutional policy, or automated governance), the philosophical "why" is less valuable than the mathematical "how."

  Here is the ranking of the three most upstream bottlenecks for **decision procedure construction**, defended by dependency, followed by an assessment of the credence debate and a 6-month strategy.

  ### The Top 3 Upstream Problems

  **1. Structural Representation & The "Common Currency" Problem**
  *(Often lumped with "Updating," but fundamentally about representation)*
  Before you can compare values or weight credences, you must be able to represent diverse moral theories in a single formal language that a decision procedure can ingest.
  *   **The Bottleneck:** Consequentialism maps easily to choice-worthiness functions ($CW: Actions \to \mathbb{R}$). Deontology, virtue ethics, and lexical prioritarianism often do not. They operate on constraints, options, or qualitative states that resist cardinalization. If Theory A outputs a real number and Theory B outputs a binary "forbidden/permissible" tag, you cannot run an expected value calculation.
  *   **Why it's #1:** You cannot solve Intertheoretic Value Comparison (IVC) if the objects being compared are structurally incompatible. You cannot update credences if the theories do not share a hypothesis space regarding what counts as "evidence."

  **2. Intertheoretic Value Comparison (IVC) / Normalization**
  *(The Scaling Problem)*
  Assuming you solve #1 and can represent all theories as choice-worthiness functions, you face the scaling problem. Utilitarianism might range from 0 to $10^{100}$; a common-sense deontology might range from -1 to 1.
  *   **The Bottleneck:** Without a normalization scheme (variance scaling, range scaling, etc.), credence weighting is arbitrary. If you assign 50% credence to Utilitarianism and 50% to Deontology, but don't normalize the scales, the Utilitarian view will dominate simply due to numerical magnitude, not moral weight.
  *   **Why it's #2:** It is downstream of Representation (you need numbers to scale) but upstream of Aggregation (you can't aggregate unscaled numbers).

  **3. Decision Rules Under Deep Uncertainty**
  *(MEV vs. Stochastic Dominance vs. Veto)*
  This is the "Abandon Credences" debate. Once you have scaled numbers, how do you combine them? Maximize Expected Choice-worthiness (MEV) is the standard, but it breaks under infinite utilities or when IVC is deemed impossible.
  *   **The Bottleneck:** If IVC is unsolvable, MEV is dead. You need fallback procedures like *Stochastic Dominance* (MacAskill 2016) or *Veto Power* models.
  *   **Why it's #3:** This is the aggregation layer. It is only relevant if you have successfully represented and normalized the inputs. However, it is the most "actionable" for engineers if #1 and #2 are assumed to be intractable.

  ---

  ### Defense of the Ordering: The Dependency Chain

  The ordering is strictly hierarchical.
  1.  **Representation blocks IVC:** You cannot compare the "value" of a deontological constraint against a utilitarian utility function if you haven't formalized the constraint as a value-bearing object. Most current research assumes this translation is possible without proving *how* to do it without losing the theory's essence.
  2.  **IVC blocks Aggregation:** If you aggregate unscaled credences, you get garbage outputs. Research into better decision rules (like stochastic dominance) is valuable, but stochastic dominance still requires *ordinal* intertheoretic comparison. If you can't say Theory A prefers $x$ over $y$ "more strongly" than Theory B does (even ordinally), stochastic dominance also fails.
  3.  **Aggregation is the Contingency:** The debate about abandoning credences is essentially a debate about how to proceed if #1 and #2 fail.

  **Why "Moral vs. Normative" is not Top 3:**
  Shifting from Moral to Normative Uncertainty (including epistemic/prudential uncertainty) is a scope expansion, not a bottleneck solver. The mathematical friction exists within moral uncertainty alone. Broadening the scope adds complexity without solving the structural incommensurability of the moral subset. It is a distraction for a 6-month technical deep dive.

  ---

  ### The "Abandon Credences" Debate: Productive or Distraction?

  **Verdict: Highly Productive, but Secondary.**

  It is **not** a distraction. It is the necessary "Plan B" research line.
  *   **The Risk:** There is a non-trivial chance that IVC (#2) is metaphysically impossible (the "No Common Currency" objection). If true, the entire MEV (Maximize Expected Value) framework collapses.
  *   **The Value:** Research into **Stochastic Dominance** and **Social Choice Theory** applications (treating moral theories like voters) provides decision procedures that require *less* information than MEV. They require only ordinal rankings, not cardinal scaling.
  *   **The Trap:** It becomes a distraction if researchers argue about the *philosophical coherence* of credences without building the alternative algorithms. For a decision-procedure builder, the question isn't "Are credences real?" it's "Does the Stochastic Dominance algorithm outperform MEV in simulation when normalization is noisy?"

  **If I were you:** Treat MEV as the baseline engine, but build modular "fallback" handlers based on Stochastic Dominance for cases where normalization confidence is low.

  ---

  ### What Would Flip the Ranking?

  1.  **Proof of IVC Impossibility:** If a rigorous proof emerges showing that intertheoretic comparison is logically incoherent (not just difficult), #3 (Decision Rules/Abandon Credences) immediately jumps to **#1**. All energy must shift to non-comparative frameworks (e.g., moral veto models).
  2.  **AI Alignment Forcing Functions:** If AI labs standardize on a specific reward modeling language (e.g., specific RLHF structures), #1 (Representation) becomes an engineering constraint rather than a philosophical problem. The ranking flips to **IVC (#1)** because the representation format is fixed by the hardware, leaving scaling as the only variable.
  3.  **Breakthrough in Formalizing Non-Consequentialism:** If someone successfully maps deontological constraints into a cardinal choice-worthiness function without losing the "constraint" nature (e.g., via infinite penalties that are computationally tractable), #1 is solved, and **IVC (#2)** becomes the sole bottleneck.

  ---

  ### 6-Month Action Plan: Where to Put Energy

  Do not read general surveys. Do not read meta-ethics. Read formal decision theory and recent technical papers.

  **Months 1-2: The Representation Bottleneck**
  *   **Focus:** How to formalize non-consequentialist theories for computation.
  *   **Read:**
      *   MacAskill, *Normative Uncertainty* (2014) — Chapters on representation only.
      *   Sepielli, "What To Do When You Don't Know What To Do" (2009) — Critique of representation.
      *   **Key Search:** Look for papers on "formalizing deontology for AI" or "constraint satisfaction in moral modeling."
      *   **Task:** Attempt to write a pseudo-code class structure that can ingest both a Utilitarian and a Kantian theory and output a comparable object. Identify exactly where the code breaks.

  **Months 3-4: The Scaling (IVC) Bottleneck**
  *   **Focus:** Normalization techniques and their failure modes.
  *   **Read:**
      *   Hajek, "The Problem of Intertheoretic Comparison."
      *   Tarsney, "Exceeding Expectations: Stochastic Dominance as a General Decision Theory" (2018).
      *   MacAskill, "The Stochastic Dominance Argument for Normative Uncertainty" (2016).
      *   **Task:** Implement a simulation where two theories have different variance ranges. Test Variance Normalization vs. Range Normalization. Measure how often the "louder" theory drowns out the "truer" theory.

  **Months 5-6: Aggregation & Fallbacks**
  *   **Focus:** Decision rules that don't require perfect IVC.
  *   **Read:**
      *   Literature on **Social Choice Theory** applied to moral uncertainty (theories as voters).
      *   Work on **Veto Models** (e.g., Hedden, "Deliberation Without Credences").
      *   **Task:** Build a "hybrid" decision procedure. Default to MEV with variance normalization, but switch to Stochastic Dominance if the normalization ratio exceeds a certain threshold of uncertainty.

  **The Goal:**
  By month 6, you should not have a philosophical position. You should have a **software architecture** for moral uncertainty that explicitly isolates where the system fails (Representation vs. Scaling vs. Aggregation). That is what moves the field forward.
