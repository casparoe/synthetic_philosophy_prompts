      *   Body: The engineering. The belief in permanence. The elders' warnings (representing oral history of the cycle).
      *   Climax: The water arrival. It follows the old paths despite the new cuts.
      *   Conclusion: Mira's shift in perspective.

      *Refining the ending:* It shouldn't be despair. It should be understanding. Her work is a "conjuncture" within the "structure."

      *Check word count:* If too short, expand on the sensory details of the water and the stone. If too long, trim the exposition about the history.

      *Okay, let's assemble.*

      *(Post-Draft Review)*:
