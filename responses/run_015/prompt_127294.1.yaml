answer: |-
  1. **The Order of Components**

  The session must follow a strict logical dependency chain. If you deviate, the disjunctivist move will appear either trivial or insane.

  *   **Step 1: The Phenomenological Fact (Minutes 0–15).** Establish that veridical perception and hallucination can be *subjectively indistinguishable*. Do not start with "What if we are *always* hallucinating?" (The BIV trap). That triggers a global skepticism response ("You can't prove we aren't") which students treat as a game they can't win and therefore ignore. Instead, start locally: "Grant that *sometimes*, a person can have an experience exactly like seeing a cup, without a cup being there." Secure agreement that from the inside, the two states feel the same.
  *   **Step 2: The Explanation of the Hallucination (Minutes 15–30).** Ask: "In the hallucination case, what are you aware of?" Since there is no cup, the object of awareness must be mind-dependent. Secure the intuition that in the hallucination, the immediate object of experience is internal/private.
  *   **Step 3: The Common Kind Inference (Minutes 30–45).** This is the pivot. Argue: "If the hallucination and the perception are subjectively indistinguishable, they must be the *same kind of mental state*." If they are the same kind of state, and the hallucination involves awareness of a mind-dependent item, then *perception* must also involve awareness of a mind-dependent item. This is where the "veil of perception" is established. You must make this inference feel compelling before you attack it. If students don't feel the pull of the Common Kind Assumption, Disjunctivism will look like a solution to a problem that doesn't exist.
  *   **Step 4: The Disjunctivist Denial (Minutes 45–60).** Only now introduce the reply. The Disjunctivist accepts Step 1 (indistinguishability) and Step 2 (hallucination is mind-dependent) but rejects Step 3 (Common Kind). They claim the fundamental *nature* of the two states is different, even if they feel the same. This must be framed as an ontological claim (about what the states *are*), not an epistemic one (about what we can *know*).
  *   **Step 5: The Consequence (Minutes 60–75).** Show what is saved. By blocking Step 3, the Disjunctivist allows that in the veridical case, the immediate object of awareness can be the actual cup.

  **Why this order?**
  If you introduce the possibility of universal hallucination first, you trigger the "silly pop-culture skepticism" defense immediately. If you introduce Disjunctivism before securing the Common Kind Inference, students will ask, "Why are we splitting hairs?" The pull of the Argument from Illusion relies on the intuition that "feelings determine mental kinds." You must let that intuition build up pressure so that the Disjunctivist release feels like a substantive philosophical intervention, not a verbal trick.

  2. **The One Case**

  **The Case:** A vivid, non-clinical hallucination of a common object (e.g., a red apple on a table) induced by a temporary, non-permanent cause (e.g., high fever or specific chemical intake), which is subjectively perfect.

  **What it must have:**
  *   **Total Subjective Indistinguishability:** The subject cannot tell, from the inside, that it is a hallucination.
  *   **Absence of Object:** There is definitively no apple there.
  *   **Local Scope:** It happens to one person, at one time, not to everyone always.

  **What it must lack:**
  *   **Obvious Physical Explanations:** It must not be like the bent stick in water.
  *   **Global Skeptical Implications:** It must not imply the *whole* world is fake.
  *   **Clinical Stigma:** It must not be presented as "madness," but as a perceptual glitch.

  **Evaluation of Stock Candidates:**
  *   **Straight stick looks bent in water:** **Fails.** Students will immediately solve this with physics (refraction). They will say, "The stick is straight, the light bends, we see the stick." It does not force the conclusion that we are aware of a mind-dependent *image*; it allows them to remain direct realists about the stick.
  *   **Geometric illusion figure:** **Fails.** Too abstract. Students treat this as "tricks of the eye" regarding properties (length/angle), not the existence of objects. It doesn't generate the "mind-dependent object" intuition strongly enough.
  *   **Mirrored or lensed room:** **Fails.** This is treated as trickery involving physical props. Students focus on the mirrors, not the nature of experience.
  *   **Artificially generated environment (Matrix/VR):** **Fails.** This triggers the "Brain-in-a-Vat" response you want to avoid. It invites global skepticism ("Nothing is real") rather than local metaphysics ("What is the structure of this experience?"). It makes the discussion about knowledge of the external world, not the nature of perception.
  *   **Vivid Hallucination:** **Succeeds.** Because there is *no object* and *no physical trick* (like water), the only thing present to the mind is the experience itself. This forces the "mind-dependent object" conclusion in the hallucination case, which is required to launch the Common Kind Inference. It isolates the metaphysical problem from physical optics and global skepticism.

  3. **Misconceptions to Expect and Head Off**

  *   **Misconception 1: "This is just an argument for skepticism."**
      *   *When it forms:* Minute 5 (Introduction).
      *   *Head off:* Explicitly state: "We are not asking if we can know the world exists. We are asking: *When* we see the world, what is the structure of that seeing?" Distinguish the *Argument from Illusion* (metaphysics of perception) from the *Skeptical Argument* (epistemology of the external world).
  *   **Misconception 2: "The mind-dependent item is a private mental picture inspected by an inner eye."**
      *   *When it forms:* Minute 30 (After establishing the hallucination involves a mind-dependent item).
      *   *Head off:* Warn against the "Homunculus" error. Say: "Do not imagine a little person inside your head looking at a screen. The 'awareness' is not a second look. It is just the having of the experience."
  *   **Misconception 3: "Disjunctivism means hallucinations don't occur."**
      *   *When it forms:* Minute 50 (Introduction of Disjunctivism).
      *   *Head off:* Be explicit: "The Disjunctivist admits you had an experience. They admit it was a hallucination. They deny that the *type* of experience is the same as seeing a real apple."
  *   **Misconception 4: "The Disjunctivist denies subjective indistinguishability."**
      *   *When it forms:* Minute 55 (When explaining the difference between the states).
      *   *Head off:* Use the analogy of a real banknote and a perfect counterfeit. They are indistinguishable to the eye, but one is money and the other is paper. The Disjunctivist says perception and hallucination are like the real note and the fake: indistinguishable to the subject, but fundamentally different in nature.
  *   **Misconception 5: "Disjunctivism is just Direct Realism under a new name."**
      *   *When it forms:* Minute 70 (Conclusion).
      *   *Head off:* Acknowledge the similarity but clarify the burden. "Direct Realism is a destination. Disjunctivism is the specific bridge built to get there past the Argument from Illusion. It is a claim about the *failure* of the Common Kind inference, not just a claim that we see the world."

  4. **Closing Question(s)**

  Put this on the screen for the final five minutes. Ask for a show of hands or a quick written response.

  > "Imagine a perfect hallucination of a candle and a veridical perception of a candle. They feel exactly the same to the person having them.
  >
  > **Question A:** Does the Disjunctivist say these two experiences are the *same kind of mental state*?
  > **Question B:** Does the Disjunctivist say the person can *tell the difference* between them from the inside?
  >
  > Choose the correct pair of answers:
  > 1. (A) Yes, they are the same kind. (B) No, the person cannot tell.
  > 2. (A) No, they are different kinds. (B) Yes, the person can tell.
  > 3. (A) No, they are different kinds. (B) No, the person cannot tell.
  > 4. (A) Yes, they are the same kind. (B) Yes, the person can tell."

  **Diagnostic:**
  *   **Correct Answer:** 3. (Different kinds, but indistinguishable).
  *   **If they choose 1:** They have missed the Disjunctivist move entirely and accept the Common Kind Assumption (The Argument from Illusion wins).
  *   **If they choose 2:** They hold Misconception 4 (Thinking Disjunctivism denies indistinguishability).
  *   **If they choose 4:** They are confused about the basic phenomenology (Thinking we can always tell we are hallucinating).

  5. **What to Explicitly Decline to Settle**

  In the final three minutes, you must verbally bracket the following to prevent the session from spilling into unanswerable metaphysics:

  *   **Whether Disjunctivism is True:** Say aloud: "I am not asking you to decide today if Disjunctivism is correct. I am asking you to understand what work it is *doing*. Whether it succeeds is a debate for a later course."
  *   **Whether the Argument from Illusion is Sound:** Say aloud: "We have mapped the argument. We have not judged its final truth. You may leave this room believing the Common Kind Assumption is obvious, or you may leave believing it is a mistake. Both positions are philosophically live."
  *   **The Nature of the 'Mind-Dependent Item':** Say aloud: "We used the phrase 'mind-dependent item' to track the argument. I am not committing us to the existence of 'sense-data' or 'ideas.' We are tracking the logical commitments of the argument, not building a ontology."
  *   **Global Skepticism:** Say aloud: "We have not solved the Brain-in-a-Vat problem. We have only looked at the structure of a single perceptual experience. Whether this helps us prove the external world exists is a separate question we are declining to answer."
