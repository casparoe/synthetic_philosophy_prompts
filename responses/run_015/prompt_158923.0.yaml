  Your leader is running a non-aggregative impartiality rule that requires equalizing individual chances when harms are equal, which predicts you should save the single stranger with certainty.

  Her verdicts follow a **Taurekian** or **Scanlonian** framework: you cannot sum the claims of multiple people to outweigh the claim of one person when the harm per person is identical (Cases 1 & 3), but you do compare the severity of harm to the individual (Case 2 & 5), and agent-relative permissions override impartiality (Case 4). The "toss a coin" instruction resolves your "indifference vs. equal chance" dilemma: it is not that "anything goes," but that impartiality *requires* giving each individual an equal probability of survival. In the 1 vs 5 death case, a coin flip between the groups gives every individual a 50% chance, whereas saving the five gives the five 100% and the one 0%, violating equal concern.

  For tomorrow's gamble, this rule predicts you **save the one stranger**. Since numbers do not count, the group of five does not possess five times the moral weight of the single stranger; they possess equivalent weight as a unit of claim. You are therefore choosing between a 100% chance to satisfy the single stranger's claim versus a 30% chance to satisfy the five strangers' (equivalent) claim. Rationality and equal concern dictate taking the certainty. A potential third rule you might have missed is **Lexical Maximin**: prioritize the worst-off individual's chance of survival. This fits Cases 1–5 (a coin gives the worst-off 50%, saving the five gives them 0%; life trumps fingers), but it fails to resolve the gamble case where both options leave someone with a 0% chance, whereas the non-aggregative rule resolves it by comparing the probabilities attached to the equal claims.

