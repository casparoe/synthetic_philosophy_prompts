      *   *The Problem:* It's ethically and practically hard to prove a negative (that someone *cannot* think something). Usually, if you give them enough time or a workaround, they figure it out.
      *   *The "Smoking Gun" for A:* A cognitive task that is impossible without the specific linguistic structure, even when non-linguistic strategies are allowed. (Spoiler: This basically doesn't exist in the literature).
      *   *The "Smoking Gun" for B:* Performance drops when verbal working memory is loaded (shadowing task). If I can do the task when quiet, but fail when repeating numbers, language is a tool (B), not a limit (A).

