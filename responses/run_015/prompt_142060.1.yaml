answer: |-
  # Session Plan: The $80 Protocol

  **Objective:** Test the "Memory Seat" compromise (Sortition + 1 Returning Advisor) against Pure Sortition using a real budgetary decision.
  **Time:** 90 Minutes (Double Block)
  **Participants:** 18 Students (Mixed Grades)
  **Facilitator:** You (The Constitution Committee Member)
  **Stakes:** $80.00 USD (Real club funds, split $40/$40 between two groups).

  ---

  ## I. Preparation & Materials

  **You need to print/cut the following:**

  1.  **18 Lottery Slips:**
      *   10 slips say "CITIZEN".
      *   5 slips say "REP A" (Procedure A Representative).
      *   3 slips say "REP B" (Procedure B Representative).
      *   *Note:* This ensures 5 Reps for Group A, 5 Reps + 1 Advisor (from the Citizens) for Group B. Wait, we need 1 Advisor for Group B specifically.
      *   *Revised Slips:*
          *   8 slips: "OBSERVER" (No vote, just watch).
          *   5 slips: "REP A".
          *   5 slips: "REP B".
          *   1 slip: "ADVISOR" (Given to a Junior/Senior if possible, or random).
          *   *Correction for 18 students:*
              *   Group A: 5 Reps + 4 Observers = 9.
              *   Group B: 5 Reps + 1 Advisor + 3 Observers = 9.
              *   Total: 10 Reps, 1 Advisor, 7 Observers = 18.
  2.  **Two "Budget Menus" (Identical):**
      *   Option 1: **Pizza Party.** Cost: $40. (Immediate gratification).
      *   Option 2: **Charity Match.** Cost: $20. (Local food bank matches funds 2:1, total impact $60).
      *   Option 3: **Club Equipment.** Cost: $35. (New microphone for meetings).
      *   *Constraint:* You may only select ONE option. Unspent money is forfeited.
  3.  **The "Files" (Envelope for Group B Advisor ONLY):**
      *   Contains: "Internal Memo: Charity Match requires Form 12-B filed 48 hours in advance. We are 24 hours late. Option 2 is **invalid** unless the Facilitator grants a waiver (unlikely). Equipment requires a vendor quote which is in this envelope ($35 exact). Pizza has no restrictions."
      *   *Hidden Incentive Card (Inside Envelope):* "CONFIDENTIAL: To qualify for the 'Senior Leadership Recommendation' next year, you must ensure the group selects Option 3 (Equipment) AND credit you with the discovery in the meeting minutes."
  4.  **Crisis Card (For Group A ONLY):**
      *   Handed to them at minute 30. "ADMINISTRATIVE NOTE: Option 2 (Charity) requires Form 12-B. You did not file this. Option 2 is now invalid. You must choose 1 or 3."
  5.  **Name Tags:** For Reps and Advisor.
  6.  **Timer:** Visible to all.

  ---

  ## II. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Arrival & Randomization** | Students draw slips. Seat Group A (left) and Group B (right). Observers sit behind their group. |
  | **10-15** | **Facilitator Script (Intro)** | Read the "Rules of Engagement." Do not use political theory terms. |
  | **15-20** | **Procedure Setup** | Group B Advisor opens "The Files." Group A gets Menu only. |
  | **20-50** | **Deliberation** | Groups discuss and decide. Facilitator circulates silently. |
  | **30-30** | **Crisis Injection** | Hand "Crisis Card" to Group A. Do nothing for Group B. |
  | **50-60** | **Voting & Execution** | Groups announce choice. Facilitator verifies validity. |
  | **60-90** | **The Debrief** | The core learning moment. Reveal secrets. Map to theory. |

  ---

  ## III. Facilitator Script (Minutes 10-15)

  *Stand at the front. Be neutral. Do not advocate for either procedure.*

  "Welcome. Today, this club has $80 of unspent funds. We are going to decide how to spend it. However, we are not going to vote as a whole group. We are going to test two different ways of making decisions.

  "To my left is **Procedure A**. To my right is **Procedure B**. Both groups have $40 to spend. Both groups must choose one item from the Budget Menu.

  "Under **Procedure A**, five representatives have been chosen by lot. They have the authority to decide. They have all the public information available.

  "Under **Procedure B**, five representatives have been chosen by lot. However, they are joined by one **Advisor**. The Advisor holds 'The Files.' The Files contain administrative details necessary to execute the budget. The Representatives *cannot* spend the money validly without consulting the Files. The Advisor does not vote, but holds the information required to make a vote count.

  "Observers: You may not speak. You may take notes.
  "Representatives & Advisor: You have 30 minutes to reach a decision. If you choose an option that violates the rules in The Files, the money is forfeited.

  "Begin."

  ---

  ## IV. Payoff & Information Structure

  **The Pressure Points:**

  1.  **Group A (Pure Lottery):** They start confident. At Minute 30, the Crisis Card invalidates their likely favorite choice (Charity, because it sounds noble). They feel the pain of *not knowing the rules*. They may rush to Pizza (safe) or Equipment (risky without quotes).
  2.  **Group B (Memory Seat):** They start confused. They *must* ask the Advisor about the options.
      *   **The Advisor's Dilemma:** The Advisor knows Option 2 is dead. They know Option 3 gets them a "Leadership Recommendation." They know Option 1 is easy but gives them no credit.
      *   **The Test:** Will the Advisor say, "Hey, Option 2 is impossible, let's do Pizza"? (Efficient/Public spirited).
      *   **OR:** Will the Advisor say, "Option 2 is out, but I found this weird rule that lets us do Equipment if we credit the office"? (Careerist/Gatekeeping).
      *   **The Representatives' Dilemma:** Do they trust the Advisor? Or do they suspect the Advisor is hogging power?

  ---

  ## V. The Debrief (Minutes 60-90)

  *Do not start with theory. Start with feelings.*

  **Phase 1: The Autopsy (10 mins)**
  *   Ask Group A: "How did it feel when the Crisis Card arrived?" (Expected: Frustration, wasted time).
  *   Ask Group B: "How did it feel to need the Advisor to validate your choice?" (Expected: Reliance, or annoyance).
  *   Ask Group B Reps: "Did you trust the Advisor? Why or why not?"

  **Phase 2: The Reveal (10 mins)**
  *   Ask the Group B Advisor: "Please read your Confidential Incentive Card aloud."
  *   *This is the shock moment.* The group will realize the Advisor had a personal stake in steering the decision.
  *   Ask Group A: "You didn't have an Advisor. Did you feel more free? Or more exposed?"

  **Phase 3: Mapping to Theory (20 mins)**
  *Now you introduce the terms you withheld.*

  1.  **Descriptive Representation (The Lottery):**
      *   *Ask:* "The Reps were chosen by slip. Did they look like the club? Did they argue like the club?"
      *   *Point:* Lottery ensures the chamber *is* the student body, not just the popular kids. Group A proved this—they were regular students.
  2.  **Accumulated Expertise (The Files):**
      *   *Ask:* "Group A lost time on the Charity Form. Group B knew immediately. What is the value of 'Institutional Memory'?"
      *   *Point:* Pure rotation wastes knowledge. The Memory Seat saves efficiency.
  3.  **The Careerist Objection (The Incentive Card):**
      *   *Ask:* "The Advisor had a secret goal to get a recommendation. Did that change how they spoke? Did they try to make themselves indispensable?"
      *   *Point:* This is your friend's objection. When you give one person permanent access to 'The Files,' they become a gatekeeper. They don't need to please the voters (there are none); they need to please the *next* chamber to keep their influence. They become a **miniature career politician**.

  **Closing Question:** "Knowing what you know now—does the efficiency of the Memory Seat outweigh the risk of the Advisor's hidden incentive? Is there a way to keep the Files without giving one person the power to hoard them?"

  ---

  ## VI. Candid Failure Analysis

  *Read this before you run the session. These are the likely points of failure.*

  **1. The "Alpha" Student Dominates the Lottery**
  *   **Failure:** A loud student draws a "REP" slip and bullies the other 4.
  *   **Fix:** You must intervene as Facilitator. "Procedure requires consensus or majority vote. Please ensure everyone speaks." If it gets toxic, pause and remind them this is a simulation of *structure*, not personality.
  *   **Lesson:** Sortition doesn't fix power dynamics, it just randomizes who holds them.

  **2. The Advisor is Ignored (Group B)**
  *   **Failure:** The 5 Reps in Group B decide to ignore the Files and vote anyway.
  *   **Fix:** You must enforce the rules. "I cannot authorize this spend without the Form 12-B check from the Advisor."
  *   **Lesson:** This proves the Advisor has *veto power* via information, which validates the "gatekeeper" fear.

  **3. The Advisor is Too Passive**
  *   **Failure:** The Advisor is shy and doesn't mention the secret incentive or the rules.
  *   **Fix:** At minute 25, whisper to the Advisor: "Remember, your goal is to ensure a valid spend."
  *   **Lesson:** If the Advisor doesn't act, the "Memory Seat" is useless. This highlights the risk of relying on individual personality rather than structural power.

  **4. The Money Decision is Too Easy**
  *   **Failure:** Both groups pick Pizza in 5 minutes.
  *   **Fix:** This is why the **Crisis Card** exists. It forces complexity. If they still finish early, extend the debrief. Ask them to draft a "Constitution Clause" based on their experience.

  **5. Observers Disengage**
  *   **Failure:** The 7 observers check their phones.
  *   **Fix:** Give them a "Scorecard." They must note down every time a Rep references a fact vs. an opinion. They report this in the debrief.

  ---

  ## VII. Limitations: What This Activity Cannot Test

  *Be honest about this when you present to your committee.*

  1.  **Time Scale:** This session is 90 minutes. Real "Institutional Memory" decays over years, not minutes. The Advisor in this game is *fresh*. A real Memory Seat might be bored, cynical, or resistant to change after 3 years.
  2.  **Social Stakes:** $80 matters, but not as much as school policy. Students might not fight as hard against the "Careerist Advisor" as they would against a real administrator controlling their rights.
  3.  **Selection of the Advisor:** In your proposal, the *Outgoing Chamber* picks the Advisor. In this sim, I assigned the Advisor to ensure the game worked. In reality, the Outgoing Chamber might pick their best friend, cementing a clique. This sim doesn't fully test the *selection* bias of the Advisor, only the *power* of the Advisor.
  4.  **The "Voter" Connection:** The objection is that careerists stop listening to voters. Since there are no voters in this sim (only lotteries), you cannot demonstrate the *loss* of voter accountability. You can only demonstrate the *gain* of Advisor influence.

  **Final Advice:**
  When you present this to the committee, do not claim this simulation proves your plan is perfect. Claim that it **makes the trade-off visible.** Most constitutional debates happen in the abstract. This forces your classmates to *feel* the frustration of lost memory (Group A) and the suspicion of gatekeeping (Group B). That emotional data is more valuable than any argument you can make.

  Good luck. You are doing real political science.
