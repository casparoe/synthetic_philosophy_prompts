answer: |-
  **Project Title:** Internal Fragmentation in Recursive Oversight: Modeling Factored Agency within HCH

  **Executive Summary**
  This project investigates a structural vulnerability in Hierarchical Consulting Humans (HCH) architectures. Standard HCH idealizations assume a unitary human node that maintains coherent beliefs and preferences across recursive consultations. This proposal challenges that assumption by modeling the human node as a factored system comprising distinct epistemic and preferential sub-agents that do not share internal state. Using formal modeling and multi-agent simulation, the project will determine whether internal fragmentation leads to convergence or amplifies disagreement across recursive iterations.

  **1. Exact Research Question**
  Under what conditions does a recursive oversight loop (HCH) converge when the base agent is modeled as a coalition of non-communicating sub-agents (specifically separating epistemic evaluation from preference aggregation), and does internal disagreement amplify or dampen across depth iterations?

  **2. Background and Gap Analysis**
  *Settled Context:*
  It is established in alignment literature that HCH is a theoretical idealization used to define scalable oversight (e.g., within Iterated Distillation and Amplification). It is also settled that "factored cognition" typically refers to decomposing *tasks* into smaller sub-tasks to fit within human cognitive limits.

  *Contested Context:*
  Whether HCH is practically realizable with actual humans is contested. Furthermore, the assumption that a human node can be treated as a unitary oracle with consistent preferences across time and context is a simplifying assumption, not an empirical fact. There is no consensus on how internal cognitive conflict affects recursive stability.

  *The Gap:*
  Current formalizations of HCH treat the human node as a black box with a single utility function and belief state. Factored cognition research focuses on task decomposition, not *agent* decomposition. There is no existing model that accounts for what happens when the *node itself* is a multi-agent system. If the "epistemic evaluator" sub-agent consults the AI differently than the "preference aggregator" sub-agent, the recursion may not approximate a coherent reflective equilibrium. This project fills the gap between multi-agent system instability and recursive oversight theory.

  **3. Methodology and Month-by-Month Plan**
  The project will use computational modeling rather than human subjects research to ensure controllability and scope feasibility.

  *Months 1–3: Formalization*
  *   Define the "Factored Node" mathematically. Model the human node not as a function $H(x)$, but as a game between sub-agents $E$ (Epistemic) and $P$ (Preference).
  *   Define the recursion operator. Establish the baseline unitary HCH model for comparison.
  *   Select metrics for "convergence" (e.g., variance in output across depth) and "disagreement" (divergence between E and P outputs).

  *Months 4–6: Baseline Simulation (Unitary)*
  *   Implement the standard unitary HCH model in a simulation environment.
  *   Run recursive chains on logical reasoning tasks (verifiable truth) and value judgment tasks (defined utility functions).
  *   Establish stability baselines: How much noise does a unitary agent introduce over 10, 50, 100 layers of recursion?

  *Months 7–9: Intervention Simulation (Factored)*
  *   Implement the Factored Node model. Enforce information barriers between $E$ and $P$ sub-agents within the node.
  *   Run the same recursive chains. Introduce varying degrees of initial conflict between $E$ and $P$.
  *   Measure error propagation. Does the disagreement grow linearly, exponentially, or stabilize?

  *Months 10–12: Analysis and Synthesis*
  *   Compare factored vs. unitary stability profiles.
  *   Identify "tipping points" where internal fragmentation causes recursive collapse.
  *   Draft final paper and technical report.

  **4. Success and Failure Conditions**
  *Successful Result:*
  The project produces a formal bound or phase transition map. For example: "If internal disagreement exceeds threshold $T$, recursive error grows exponentially; otherwise, it converges to a stable oscillation." This provides alignment researchers with a specific constraint on how coherent human nodes must be for HCH to function.

  *Clear Failure:*
  The model proves too sensitive to arbitrary hyperparameters (e.g., learning rates of sub-agents) to yield generalizable insights, or the simulation environment fails to capture the necessary dynamics of belief/preference separation, rendering the results irrelevant to the theoretical HCH construct.

  **5. Scope and Feasibility**
  This scope is strictly theoretical and computational. It avoids the logistical and ethical complexities of running recursive human consultation experiments, which often stall due to human fatigue and inconsistency. By focusing on the *structural properties* of the architecture rather than empirical human performance, the project fits within a 12-month fellowship. The deliverable is a formal model and simulation codebase, not a deployed system.
