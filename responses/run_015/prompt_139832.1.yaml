answer: |-
  **Project Title:** Absolute vs. Comparative Weighting: A Re-evaluation of the Prioritarian Escape

  **The Research Question**
  Does the prioritarian escape from the levelling-down objection depend constitutively on priority weights being functions solely of absolute welfare levels, rather than comparative standing? Specifically: Is there a coherent formulation of prioritarianism wherein priority weights track relative rank or distance from the mean that succumbs to the levelling-down objection, and if so, does this vulnerability extend to ex-ante prioritarianism regarding realized outcomes?

  **Background and The Gap**
  The standard narrative in distributive justice holds that telic egalitarianism is vulnerable to the levelling-down objection (LDO) because it values equality for its own sake, implying that a world where everyone is equally miserable can be better in one respect than a world where some are well off and others are better off. Prioritarianism is standardly presented as the solution: it assigns greater weight to benefits affecting the worse off, but because the weight is a positive, concave function of *absolute* welfare, lowering the better off never increases the overall value. Consequently, prioritarianism never recommends pure levelling down.

  However, this escape relies on a specific, often unstated assumption about the input to the priority weighting function. The standard model assumes weights are determined by absolute levels (e.g., $w(u_i)$). But if weights are determined by comparative status (e.g., $w(u_i, \text{rank}_i)$ or $w(u_i, \text{mean} - u_i)$), the mathematical guarantee vanishes. In a comparative model, lowering the better off improves the relative standing of the worse off. This could raise the priority weight assigned to the worse off's welfare without raising their welfare itself. If the weight increase is sufficiently sensitive to relative gaps, the weighted total could rise despite the loss of welfare for the better off.

  Furthermore, this issue may map onto the distinction between ex-post and ex-ante prioritarianism. If weights apply to prospects, a policy might maximize weighted expected utility while guaranteeing an ex-post outcome where everyone is worse off than under the alternative. The standard literature treats the LDO and the "ex-post loss" objection as distinct problems. I propose they are manifestations of a single structural fault: the reliance on absolute rather than comparative inputs for priority weights. Current positions leave this open because defenses of prioritarianism typically assume the absolute view without arguing why the comparative view is incoherent or distinct from egalitarianism.

  **Methodology (Nine-Month Plan)**
  *Months 1–2: Formalization.* I will define two distinct prioritarian value functions: $V_{abs}$ (weights depend only on absolute utility) and $V_{comp}$ (weights depend on utility and rank/gap). I will establish the conditions under which $\frac{\partial V_{comp}}{\partial u_{rich}} < 0$ implies an increase in total value when $u_{rich}$ decreases, holding $u_{poor}$ fixed.
  *Months 3–4: Case Construction.* I will construct numerical models with fixed populations. I will identify the specific elasticity of the weight function required to generate a levelling-down recommendation in $V_{comp}$. I will test these cases against intuitive constraints to ensure they qualify as genuine levelling-down scenarios (i.e., no one gains welfare, someone loses, yet the outcome is deemed better).
  *Months 5–6: Ex-Ante Extension.* I will apply the comparative/absolute distinction to ex-ante prioritarianism. I will construct cases where a policy maximizes ex-ante weighted value but results in an ex-post outcome that is Pareto-inferior to the alternative. I will determine if this vulnerability correlates with the comparative input structure identified in Months 3–4.
  *Months 7–8: Drafting.* I will write the 9,000-word paper, arguing that the robustness of the prioritarian escape is overstated and hinges on the absolute/comparative distinction rather than the priority/equality distinction.
  *Month 9: Revision.* I will stress-test the argument against the objection that "Comparative Prioritarianism" is simply Egalitarianism in disguise, refining the boundary conditions between the two views.

  **Range of Possible Conclusions**
  1.  **Strong Thesis:** Prioritarianism escapes LDO if and only if weights are absolute. Any comparative element reintroduces the objection, suggesting the "escape" is an artifact of modeling choices rather than a deep moral insight.
  2.  **Moderate Thesis:** Comparative weighting allows for LDO in theory, but plausible weight functions (those that do not collapse into leximin or strict equality) remain immune. The escape is robust for moderate prioritarianism but fragile for strong prioritarianism.
  3.  **Unification Thesis:** The vulnerability of ex-ante prioritarianism to ex-post loss is mathematically isomorphic to the vulnerability of comparative prioritarianism to LDO. Both arise because the weight function responds to variables other than the welfare being weighted.

  **Conditions of Failure**
  The project fails if:
  1.  **Conceptual Collapse:** The "Comparative Prioritarianism" I construct is shown to be extensionally equivalent to Telic Egalitarianism. If the view simply *is* egalitarianism, I have not found a flaw in prioritarianism, but merely redrawn a boundary.
  2.  **Misidentified Objection:** The cases I construct are not genuine levelling-down cases. For example, if lowering the rich raises the poor's weight, but the mathematical result relies on a change in *total* welfare that I have missed, the objection dissolves.
  3.  **Incoherence:** It turns out that priority weights *cannot* coherently track relative standing without violating the definition of prioritarianism (i.e., if weights track relative standing, the view is definitionally egalitarian).

  ***

  **Epistemic Key**

  | Substantive Claim | Status | Justification |
  | :--- | :--- | :--- |
  | Standard prioritarianism escapes the LDO. | **Settled** | Consensus in the literature (e.g., Parfit, Holtug). |
  | Standard models assume weights track absolute welfare. | **Settled** | Standard formalizations define $w$ as $f(u_i)$. |
  | Comparative weights can mathematically permit LDO. | **Conjecture** | This is the core hypothesis to be proven via modeling. |
  | Ex-ante prioritarianism can recommend ex-post Pareto losses. | **Contested** | Some argue this is a feature, others a bug; link to LDO is my hypothesis. |
  | The fault line is Absolute vs. Comparative, not Priority vs. Equality. | **Conjecture** | This is the main theoretical contribution of the paper. |
  | Comparative Prioritarianism is distinct from Egalitarianism. | **Contested** | Critics may argue any relative weighting entails egalitarianism. |

  **Step Most Likely to Be Wrong:**
  The claim that **Comparative Prioritarianism is distinct from Egalitarianism**. It is highly probable that once priority weights are made sensitive to relative rank or gaps, the view loses its distinctive "prioritarian" character and becomes a form of weighted egalitarianism. If this is true, the project's conclusion shifts from "Prioritarianism is vulnerable" to "The boundary between Prioritarianism and Egalitarianism is narrower than assumed," which is a significant but different result. I will mitigate this by defining prioritarianism structurally (weighted sum) rather than extensionally, but the risk remains that the structural definition cannot sustain the comparative input without collapsing.
