answer: |-
  You have put your finger on one of the most persistent and uncomfortable nerves in the philosophy of science. You are correct that logically, the structure is identical:

  *   **Grue:** $X$ is green if $t < 2050$, blue if $t \ge 2050$.
  *   **Newtonian Physics:** $F=ma$ holds if $v \ll c$, else use Relativity.
  *   **Pediatric Drug:** Drug works if Age $> 12$, else adjust dosage.

  In all three cases, a universal generalization ($P$) is replaced by a disjunctive one ($P \text{ if } C, \text{ else } Q$). If logic alone were the judge, there would be no difference. The fact that we treat them differently suggests the criterion for "good science" isn't purely logical—it's pragmatic, causal, or metaphysical.

  To answer your specific questions: **No, there is no single widely accepted name for this specific "double standard,"** because the philosophical consensus is that it *isn't* a double standard. However, there are specific terms for the criteria used to distinguish them.

  Here is the breakdown of how philosophy handles the distinction between a "legit domain carve" and a "sneaky grue-ification."

  ### 1. The Terminology: *Ad Hoc* vs. *Theoretically Motivated*
  The closest technical term for what you are describing is the distinction between **Ad Hoc Hypotheses** and **Progressive Problem Shifts** (Imre Lakatos) or **Independent Testability** (Karl Popper).

  *   **Grue is *Ad Hoc*:** The predicate is constructed *solely* to fit the existing data. It has no independent basis. The time $t$ is chosen *because* that is where the data stops.
  *   **Scientific Exceptions are *Theoretically Motivated*:** The boundary (e.g., "quantum scale" or "pediatric metabolism") is defined by variables that exist independently of the specific failure being explained.

  If you add a clause to a theory *only* to save it from falsification, that is **Ad Hoc-ness**. If you add a clause that arises from a deeper mechanism that also predicts *other* things, it is **Refinement**.

  ### 2. The Logical Distinction: Indexical vs. Structural
  Goodman's "Grue" relies on an **indexical** boundary (time/date). Scientific restrictions usually rely on **structural** boundaries (mass, velocity, age, concentration).

  *   **Grue:** The boundary is *temporal*. It implies the laws of nature change simply because the calendar flipped. This violates the principle of the **Uniformity of Nature**.
  *   **Physics/Medicine:** The boundary is *parametric*. It implies the laws depend on physical conditions (scale, biology).

  When a physicist says "Newton's laws break down at the quantum scale," they are not saying "Newton's laws work until Tuesday." They are saying "Newton's laws are an approximation of a deeper law that depends on Planck's constant." The boundary is part of the *mechanism*, not just the *observation log*.

  ### 3. The "Get Out of Jail" Card: Novel Predictive Success
  This is the pragmatic test scientists actually use. It is the strongest argument against the idea that this is a double standard.

  *   **Grue:** If you accept "Grue," does it predict anything new? No. It only accommodates past data. It is retroactively fitted.
  *   **Relativity:** When Einstein restricted Newton's domain, the new theory didn't just explain why Mercury's orbit was weird (the old data); it predicted light bending during an eclipse (new data).
  *   **Pediatrics:** When researchers say "this drug fails in kids," they usually propose a mechanism (e.g., liver enzyme immaturity). This leads to new predictions (e.g., "it will also fail in adults with liver failure").

  If your "exception" only explains the anomaly it was created to fix, it is **Grue-ification**. If your "exception" predicts *fresh* anomalies elsewhere, it is **Scientific Progress**.

  ### 4. "Carving Nature at its Joints" (Natural Kinds)
  Plato's metaphor is often invoked here.
  *   **Grue** gerrymanders reality. It groups objects together (emeralds examined before 2050 and emeralds examined after) based on a human convention (our observation schedule).
  *   **Scientific Domains** attempt to identify **Natural Kinds**. "Pediatrics" isn't an arbitrary date; it's a cluster of biological properties (developmental stage, hormone levels, organ function).

  The accusation against Grue is that it is **extensional** (defined by the list of things it applies to). Scientific predicates strive to be **intensional** (defined by the properties the things have).

  ### 5. Why it *Feels* Like a Double Standard
  You feel there is a double standard because, historically, **science often starts with Grue-like predicates.**

  Before we understood *why* Newtonian physics failed at high speeds, it might have looked like this: "Physics works, except for Mercury's orbit and fast electrons." That *was* a Grue-like patch. It was only accepted temporarily until General Relativity provided the *mechanism* that unified the exception.

  So, the distinction is often **temporal**:
  1.  **Phenomenological Stage:** We notice a boundary (Grue-like). "It works here, not there."
  2.  **Theoretical Stage:** We find the mechanism that explains the boundary.

  If a field stays in Stage 1 forever, it is often dismissed as "soft science" or "mere cataloging." If it moves to Stage 2, it is "hard science." The "double standard" is actually a demand for **explanatory depth**.

  ### Summary: How to tell the difference
  To answer your final question on how to tell a legit restriction from a sneaky Grue-ification, look for these three markers:

  1.  **Independence:** Is the boundary condition defined independently of the failure? (e.g., "Quantum scale" is defined by constants, not by "where Newton failed.")
  2.  **Mechanism:** Is there a causal story for *why* the boundary exists? (Grue has no "why".)
  3.  **Novelty:** Does the restricted theory predict something we didn't already know?

  There isn't a single name for the "double standard" because the philosophical consensus is that **Grue is a logical trap, while scientific restriction is an epistemic tool.** However, if you want to sound like you know the literature, you can say that Grue predicates lack **projectibility** (Goodman) and constitute **degenerating problem shifts** (Lakatos), whereas legitimate scientific restrictions maintain **entrenchment** and lead to **progressive problem shifts**.

  You haven't found a flaw in science; you've found the firewall that separates curve-fitting from understanding.
