answer: |-
  Your three-way distinction is the correct map, but the stalemate persists because your group treats outcome-licensing as a unified methodological sin rather than separating valid functional explanation in cumulative domains from invalid teleological causation in contingent ones.

  The strongest case for the "unavoidable" side is not just pragmatic but epistemic: history is not the past, it is a relation between the past and the present, so removing the present removes the object of study itself. Archives are not neutral repositories; they are graveyards of losers curated by winners, meaning that even source selection is outcome-licensed before you write a single word. If you refuse to let the outcome guide selection, you are not writing history; you are writing chronicles or sociology, and your supervisor is right that no one reads them because significance is always conferred retrospectively. The strongest case for the "mistake" side is ontological: the past was a field of open possibilities, and explaining a cause by its effect collapses the branching tree of time into a single trunk, misdescribing the causal structure by implying inevitability where there was only contingency. This error is fatal because it suppresses the counterfactuals necessary to test causal claims; if the winner won because of feature X, you must be able to show that a loser with feature X would have won, or a winner without it would have lost, which Whig narratives rarely attempt.

  Your hunch about cumulativity is the lever that breaks the deadlock, but you are underestimating how much political resistance there is to using it. In the history of science or technology, outcome-licensing is often valid because there is a selective-retention mechanism akin to natural selection: theories or tools that work survive, so looking back from the working theory tells you something true about the fitness of earlier steps. In political or religious history, there is no such mechanism; survival is often a matter of power, luck, or violence, not fitness, so explaining a surviving institution by its "useful" features is a just-so story. The stall in your group exists because historians of politics refuse to admit their domain lacks cumulativity (it strips their narrative of progress) and philosophers refuse to admit functional explanation is valid even in cumulative domains without strict laws (it violates their standards of causation). You are stuck because everyone wants the relevance of Whig history without the ontological cost, so they practice it covertly while denouncing it publicly.

  To move this forward, stop asking whether a narrative is Whig and start asking whether the mechanism of transmission is specified. I propose a "Mechanism Test" for outcome-licensing: can you explain the survival of the institution or idea without referencing the outcome as the proof of its value? If you can point to a concrete causal chain—resources, coercion, network effects—that links the early feature to the later success independent of the success itself, the licensing is valid functional explanation. If the only evidence that the feature was "important" is that it survived, you are committing the Whig error. Your blind exercise idea is good but impractical; a better test is the "Contemporaneous Significance" constraint: force the writers to justify the selection of every actor and event based on sources available *at that time*, not after. If the narrative collapses, it was Whig; if it holds but looks different, it was merely retrospective. Honestly, though, nothing may move this if the group is divided by temperament: some historians are fundamentally storytellers who need endpoints to create meaning, and others are analysts who need openness to create truth. If that is the split, no methodological distinction will bridge it, because you are arguing about whether history is a branch of literature or a branch of social science.
