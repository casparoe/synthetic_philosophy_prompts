answer: |-
  Here is the plan. I'm taking definite positions on all four points because you need a spine for this talk, not a menu. Your audience is technical; they respect a model that holds together over one that hedges.

  ### 1. Order: Counterfactual Mugging First, Policy Last

  Do **Counterfactual Mugging (CFM)** first, then **XOR Blackmail**.

  Here is why: XOR Blackmail triggers an immediate, visceral "fight" response in engineers. Their instinct will be "never negotiate with terrorists" or "destroy the blackmailer." That emotional reaction will drown out the decision-theoretic logic you need them to grasp. CFM is sterile. It's just a coin, a simulator, and money. It isolates the logic from the adrenaline.

  Regarding the "policy" move (precommitting/Updateless Decision Theory): **Do not hand it to them early.**

  If you tell them at the start, "The trick is to pick a policy and ignore evidence," they will treat it as a dogma to attack. Instead, let them burn. Walk them through CFM using standard Causal Decision Theory (CDT). Let them conclude that paying is irrational. Let them feel the satisfaction of that conclusion. Then, hit them with the "Expectation over Policies" calculation that shows they just lost money. Make the *pain* of the loss drive the need for the tool. Introduce the policy concept at the 45-minute mark as the only way to fix the leak they just found.

  **The Schedule:**
  *   **0–30 mins:** Counterfactual Mugging. Let them argue for not paying. Reveal the EV loss.
  *   **30–45 mins:** Introduce the "Policy/Precommitment" solution.
  *   **45–75 mins:** XOR Blackmail. Show it's the same logic with different skin.
  *   **75–90 mins:** Discussion and Closing Question.

  ### 2. The Carrying Example: Keep the Loaded Coin and the Copy

  Your variant is excellent. **Keep the loaded coin (9:1) and the "simulation of a copy" mechanic.**

  Here is why this works for engineers:
  1.  **The Loaded Coin:** A 50/50 coin invites lazy heuristics ("it's a wash"). A 9:1 coin forces them to actually run the numbers. It makes the Expected Value argument undeniable *if* they accept the premises.
  2.  **The Copy/Simulation:** This is the most important part. It removes the "spooky action at a distance." Seismologists and engineers hate magic. If Omega is a prophet looking into the future, they will reject the premise as physically impossible. If Omega is running a high-fidelity simulation of their brain state, that's just computation. It turns a metaphysical problem into an information-flow problem.

  **What the example must have:**
  *   **Transparency:** They must know Omega's source code (or equivalent). They must know Omega is truthful.
  *   **Logical Correlation, Not Causation:** Make it clear that their current decision does not *cause* the simulation's past output. The correlation exists because both are instantiations of the same algorithm (their brain).

  **What it must not have:**
  *   **Ambiguity about "You":** Be precise. "You" are the algorithm. The copy is an instance of the algorithm. If the algorithm outputs "Pay," both instances pay (in their respective counterfactual branches).
  *   **Emotional Stakes:** Keep the money abstract. Don't make it "rent money" or "charity." It's utility points.

  **One Warning:** Be careful with the phrasing "Omega tells the copy the coin came up the other way." In standard CFM, Omega asks *you* for money if Heads, and rewards *you* if Tails (based on prediction). In your XOR-style variant, ensure you don't conflate the two.
  *   *Recommendation:* Use the "Copy" mechanic to explain **why** the prediction is accurate in CFM. Then, for XOR, use the exact same "Copy" mechanic to show how the blackmailer decides whether to send the letter. The engine (Simulation) stays the same; the payout structure changes.

  ### 3. Misconceptions: Where to Let Them Bleed

  You have four specific objections to manage. Here is exactly how to handle each:

  **A. "Just compute the Expected Value."**
  *   **The Trap:** They will calculate: $0.9 \times (-\$100) + 0.1 \times (\$0) = -\$90$. Therefore, don't pay.
  *   **The Move:** **Let them make this calculation.** Do not stop it. Write it on the board. Let the chemist champion it.
  *   **The Kill:** Then show the calculation from the *ex-ante* perspective (before the coin flip). $0.9 \times (-\$100) + 0.1 \times (\$10,000) = +\$910$.
  *   **The Point:** Show them that Causal Decision Theory (updating on the coin flip) yields a lower total return than Updateless Decision Theory (committing before the flip). The mistake isn't math; it's *when* they maximized the expectation.

  **B. "It's just Newcomb's Problem."**
  *   **The Trap:** Dismissing it as "old news."
  *   **The Move:** Acknowledge the kinship, but draw a hard line. In Newcomb's, you see the boxes (or the setup) before you choose. In CFM, you know the coin has *already* landed. You have new information (the request was made).
  *   **The Point:** CFM is harder because it forces you to ignore evidence you actually possess. Newcomb is about prediction; CFM is about *counterfactual dependence*.

  **C. "Simply be the sort of person who pays."**
  *   **The Trap:** Treating this as virtue ethics ("I'm a honest person").
  *   **The Move:** Sharpen this. It's not about virtue; it's about **source code**.
  *   **The Point:** Reframe it: "You aren't choosing an action; you're choosing an output for your algorithm." If their algorithm outputs "Don't Pay," they lose the big prize in the counterfactual branch. This bridges the gap to the "Policy" concept.

  **D. "Never negotiate with blackmailers."**
  *   **The Trap:** This will come up during XOR Blackmail. It's a heuristic, not a proof.
  *   **The Move:** Agree with the heuristic for the *real world*, but reject it for *Omega*.
  *   **The Point:** In the real world, paying incentivizes blackmailers. In the XOR/Omega case, the blackmailer is a deterministic algorithm. Paying doesn't incentivize them; it satisfies the logical condition for them *not* to have sent the letter (in the counterfactual where the bad news was false). You must distinguish between *causing* behavior and *correlating* with a logical output.

  **The Mistake to Leave In:**
  Let them argue for **Causal Decision Theory** for the first 20 minutes. Let them build the case that "my decision cannot change the past." It is the intuitive baseline. If you knock it down too fast, they won't feel the weight of the problem. Let them build the house of cards, then show them the wind that blows it over.

  ### 4. Closing Question and Scope

  **The Closing Question:**
  Do not ask, "Would you pay?" That invites posturing.
  Ask this: **"If you were programming an autonomous rover to operate in this environment, and you could upload its decision code *before* it left Earth, what code do you write?"**

  *   **Why:** This bypasses the "in the moment" emotion. It forces them into the *ex-ante* perspective (UDT). If they say "Program it to pay," they understand the solution. If they say "Program it to calculate EV based on current sensors," they missed the point. It tests whether they grasp the *structure* of the decision, not just their gut reaction.

  **What to Refuse (The Scope Limit):**
  You must flatly refuse to discuss **the metaphysics of consciousness or free will.**

  *   **Why:** Your audience is engineers. They will drift into "Is the copy really me?" or "Do we actually have free will to precommit?" That is a black hole. It consumes time and yields no heat.
  *   **The Line:** "We are treating the brain as a deterministic algorithm for the sake of this model. Whether that's metaphysically true doesn't change the payout structure. We are debugging the code, not debating the soul."

  **Summary of your stance:**
  You are arguing for **Updateless Decision Theory** framed as **Policy Selection**. You are treating the human mind as a deterministic algorithm that needs to be optimized for total output, not just local conditional output. You are not asking them to be "good"; you are asking them to be "consistent."

  Good luck. Give the chemist enough rope to hang himself, but keep the timer.
