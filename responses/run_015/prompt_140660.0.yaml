          5.  Address the sentience uncertainty.
      *   **Constraints:** Argue from considerations, not authorities. Keep disagreement alive until the end. Provide a verdict + condition for changing mind. ~1000 words. Prose suitable for setting a scene against (clear, evocative, not overly academic).

  2.  **Deconstruct and Strengthen Positions (Task 1):**
      *   *Nadia:* "Exclusionary" is okay, but maybe "Stewardship of Space" or "Relational Ethics." Let's stick closer to her prompt but refine it. Call it the *Custodial View*. It's about the human dwelling. Killing is a failure of design.
      *   *Marcus:* "Welfare View" is accurate. Let's sharpen it to *Sentient Consequentialism*. It's about the sum of suffering/experience.
      *   *Refinement:* Nadia isn't just ignoring death; she's prioritizing the *relationship* between human and non-human. Marcus isn't just counting bodies; he's counting *qualia*.
      *   *Objections:* Nadia ignores the suffering of the excluded. Marcus ignores the moral weight of intentional killing vs. passive prevention.

  3.  **Epistemic Asymmetry (Task 2):**
      *   Nadia sees bodies = bad. Marcus says hidden death is still death.
      *   *Analysis:* Is "out of sight, out of mind" a moral principle or a psychological coping mechanism? For Nadia, the *technician's* relationship to the death matters. If she doesn't see it, she isn't the executioner. Marcus argues the insect doesn't care if it's watched.
      *   *Verdict on this point:* The asymmetry matters for the *human* agent (Nadia), not the *patient* (roach).

  4.  **Ecology/Replacement (Task 3):**
      *   If the ducts stay inviting, new roaches come.
      *   *Nadia:* Proofing changes the terms of sharing. It solves the *infestation*, not just the *individuals*.
      *   *Marcus:* If you kill 1000 now, and 1000 come later, did you reduce suffering? Only if the *method* of death for the first 1000 was better than the method for the next 1000. Or if the total lifespan is reduced.
