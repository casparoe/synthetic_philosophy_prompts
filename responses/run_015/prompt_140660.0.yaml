answer: |-
  Let us rename Nadia's position the *Relational View* and Marcus's the *Experiential View*. This clarifies the stakes. For Nadia, ethics is about the boundary between the human home and the wild duct. The moral injury lies in the violation of that boundary by violent intrusion. For Marcus, ethics is about the interior life of the creature. The moral injury lies in the sensation of pain or the deprivation of welfare.

  Nadia's Relational View is strongest when it frames pest control as architecture rather than war. She argues that a technician is a steward of the dwelling, not an executioner of the intruder. If the duct is sealed, the cockroach is not killed; it is simply elsewhere. The moral distinction between *doing* (spraying) and *allowing* (excluding) is not a trick of the light; it is a discipline of the hand. To spray is to take responsibility for a death; to proof is to take responsibility for a boundary. Her objection to Marcus is that he asks her to carry the weight of every invisible death in the concrete, which paralyses the work. Marcus's strongest counter is that the cockroach does not care about the technician's conscience. A death in a void is still a death. If the Relational View prioritises the human agent's cleanliness over the animal's fate, it is merely aesthetic morality—washing the hands while the blood dries on the sleeves.

  This brings us to the epistemic asymmetry. Nadia prefers methods that yield no corpses because visible death signals a failure of containment. Marcus calls this a moral illusion. He is largely right, but not entirely. The visibility of death matters for the *human* community, if not the insect. A tower block littered with carcasses degrades the residents' environment, creating a secondary harm. However, hiding the death in the ducts does not negate the suffering. The Relational View relies on the idea that what is unseen is less real. In a novel set in a tower block, this is a potent metaphor: the residents ignore the rot in the walls until it breaks through the plaster. The asymmetry should not do the heavy lifting in the argument. It explains Nadia's preference, but it does not justify it ethically. The distinction between doing and allowing collapses when the outcome is identical: the insect is dead, and the human intended it.

  The ecological reality—that the ducts' carrying capacity remains unchanged—complicates both views, but it wrecks the Relational View more thoroughly than you suspect. Nadia believes proofing solves the problem by changing the terms of sharing. But if the duct remains a viable harbourage, new recruits arrive. If she excludes ten thousand roaches today, and ten thousand enter from the sewer tomorrow, she has not reduced the killing; she has merely deferred it. Unless the proofing is perfect and permanent, the Relational View is a temporary stay of execution. Marcus's Experiential View handles this better. He can argue that if the environment is hostile enough (via IGRs or bait), the *quality* of the remaining lives drops, or the total population flux decreases. The revolving door of the duct means that the only way to reduce total suffering is to make the duct uninhabitable, not just to kill the current tenants.

  This leads to the growth regulator (IGR). Here, Marcus has the sharper knife. Nadia loves IGRs because they produce no bodies; the population simply fades. But Marcus asks the terrifying question: was the prevented life worth living? If a cockroach's life is net suffering—dominated by hunger, predation, and chemical terror—then preventing it is a mercy. If it contains net joy—feeding, mating, warmth—then preventing it is a loss of value. Nadia sidesteps this by focusing on the absence of the corpse. Marcus forces the calculation of the ghost. The Relational View cannot answer this because it does not value the life, only the absence of the conflict. The Experiential View must take a stance on the welfare of the non-existent. Given the brutal reality of a German cockroach's life in a service duct, the wager is likely that non-existence is preferable. Thus, the IGR is the most humane option, but for Marcus's reasons (prevention of suffering), not Nadia's (absence of evidence).

  Finally, the question of sentience. Nadia's view is robust because it is indifferent to the insect's mind; it concerns the human's duty to their own space. Marcus's view scales with the probability of sentience. If the credence goes to zero, his argument evaporates. This looks like a weakness, but it is actually intellectual honesty. The Relational View's indifference is not a virtue; it is a refusal to engage with the possibility of the other. If there is even a chance the cockroach suffers, the Experiential View demands we act on it. The Relational View allows us to ignore it. In ethics, the precautionary principle usually favours the view that acknowledges the risk of harm over the one that ignores it.

  **Verdict**

  Marcus's Experiential View is the stronger ethical position. It forces the gaze onto the victim rather than the agent. Nadia's Relational View is a practical heuristic for a technician who must sleep at night, but it is ultimately a rationalisation of distance. It confuses the cleanliness of the floor with the cleanliness of the conscience. However, for the scene to breathe, Nadia must be right about the *work*. Marcus can be right about the *ethics* while being useless in the duct. He can diagnose the suffering but offer no way to live with it. Nadia offers a way to live, even if it relies on a necessary blindness.

  **Condition for Change**

  I would change my mind only if it were demonstrated that the exclusion methods (proofing) merely displaced the population into an environment of significantly higher suffering (e.g., freezing outdoors) than a quick chemical death inside, thereby making the "humane exclusion" a engine of greater net pain.
