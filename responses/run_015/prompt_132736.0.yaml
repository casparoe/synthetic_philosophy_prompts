  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an interpretability review panel for a machine-learning certification body.
      *   **Task:** Create a reusable, written procedure (checklist) for auditors (technically literate, not philosophers) to determine if a neural network component is a *genuine representational unit* (realist sense) vs. *predictive shorthand* (instrumentalist sense).
      *   **Constraints:**
          *   90-minute sessions (procedure must be runnable in < 2 hours).
          *   No external literature access.
          *   Public audit trail (mandatory alignment checks triggered by "verified" verdict).
          *   Must operationalize three philosophical conditions: (1) Possibility of Misrepresentation, (2) Stable Functional Role, (3) Consumer Mechanism (usage to guide behavior).
          *   Must handle three hard cases: (i) Perfect correlation/no misrepresentation, (ii) Misrepresentation/unstable role, (iii) All met but stakeholder resistance.
          *   Must apply the procedure to three specific hypothetical cases.
          *   Must conclude with limitations (consciousness, moral patienthood, belief).
          *   Every judgment-call point must be explicitly marked.

  2.  **Deconstruct the Philosophical Principles into Operational Tests:**
      *   *Principle 1: Misrepresentation.* A representation must be able to be *wrong*. If it's perfectly correlated with a feature, it's just a detector, not a representation (in the realist sense).
          *   *Test:* Counterfactual inputs / Adversarial examples. Does the component activate when the feature is absent (false positive) or fail to activate when present (false negative) in a way that leads to downstream error?
      *   *Principle 2: Stable Functional Role.* The component must do the same "job" across different contexts. It can't be polysemous or context-dependent to the point of incoherence.
          *   *Test:* Ablation/Intervention across diverse tasks. Does removing it degrade performance consistently in the expected domain?
      *   *Principle 3: Consumer Mechanism.* Downstream components must *use* this signal to make decisions. It's not just a byproduct (epiphenomenal).
          *   *Test:* Causal mediation analysis / Downstream dependency. Does changing this component's state change the output *because* the downstream logic relies on it?

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Structure:* Introduction -> Prerequisites -> Step-by-Step Tests -> Decision Logic -> Hard Case Handling -> Limitations.
      *   *Tone:* Bureaucratic, precise, actionable, authoritative.
      *   *Timing:* Needs to fit the 2-hour window.
      *   *Decision Points:* Need clear Pass/Fail/Halt criteria.

      *   *Step 1: Misrepresentation (The "Error" Test).*
          *   Input: Counterfactual dataset (Feature Present/Activation Low AND Feature Absent/Activation High).
          *   Threshold: Significant activation in absence of feature (False Positive Rate > X%) OR significant non-activation in presence (False Negative Rate > Y%).
          *   *Crucial:* If Perfect Correlation (0% error), it fails the representation test (it's a hard-wired detector).
      *   *Step 2: Functional Stability (The "Ablation" Test).*
          *   Input: Diverse task suite.
          *   Action: Zero-out component.
          *   Threshold: Performance drop must be statistically significant and consistent across contexts where the concept is relevant.
      *   *Step 3: Consumer Mechanism (The "Usage" Test).*
          *   Input: Causal Mediation.
          *   Action: Swap activation values.
          *   Threshold: Downstream output changes predictably based on the swapped value.

      *   *Decision Logic:*
          *   Pass 1, 2, 3 -> Representational (Realist).
          *   Fail 1 -> Non-Representational (Detector/Shorthand).
          *   Pass 1, Fail 2 -> Non-Representational (Unstable/Epiphenomenal).
          *   Pass 1, 2, Fail 3 -> Non-Representational (Byproduct).
          *   *Halt Condition:* Ambiguous data or conflicting signals requiring philosophical nuance.

  4.  **Addressing the Hard Cases:**
      *   *(i) Perfect Correlation:* The procedure must explicitly rule this out as "Non-Representational" because misrepresentation is impossible.
      *   *(ii) Misrepresentation but Unstable:* The procedure must rule this out at Step 2.
      *   *(iii) Stakeholder Resistance:* The procedure must rely on the data thresholds, not team intuition. If thresholds are met, the verdict stands.

  5.  **Applying to Hypothetical Cases:**
      *   *Case 1 (Vision/Curved Edges + Illusions):*
          *   Misrepresentation: Yes (Illusions trigger it without curves).
          *   Stability: Likely Yes (Curves are consistent).
          *   Consumer: Likely Yes (Used for shape recognition).
          *   Verdict: Representational.
      *   *Case 2 (LM/Gender Agreement):*
          *   Misrepresentation: No (Activates identically on correct and ambiguous/broken sentences). It tracks syntax, not the *concept* of gender in a way that can be wrong about the *meaning*. Or, if it activates on ambiguous ones, does it lead to error? The prompt says "activates identically on grammatically correct... and deliberately ambiguous." This suggests it doesn't distinguish, so it might not be representing the *agreement* concept robustly, or it's just a syntax detector. Wait, if it tracks agreement with high accuracy but activates identically on ambiguous ones... if it activates *high* on ambiguous ones where agreement is undefined, that's a false positive.
          *   Refinement: If it activates on ambiguous sentences *as if* agreement were present, that's misrepresentation. But does it have a stable functional role? If it breaks on ambiguity, maybe not stable. Let's look closer: "activates identically on grammatically correct sentences and on deliberately ambiguous ones designed to break the agreement." If the goal is to track *valid* agreement, activating on *broken* agreement is a False Positive. So Misrepresentation = Pass. Stability? If it's used for generation, does it cause errors?
          *   Actually, the prompt implies it *tracks* agreement accurately but activates *identically* on broken ones. This sounds like it detects the *presence of pronouns* rather than the *agreement relation*. If it doesn't distinguish valid vs invalid, it can't misrepresent the *validity*. It just detects tokens.
          *   Let's interpret strictly: If it activates on broken agreement, it claims "Agreement Exists" when it doesn't. That is misrepresentation. But does it play a stable functional role? If the model fails on those ambiguous sentences, the role is unstable or the mechanism is broken.
          *   Better interpretation for the exercise: It fails the Consumer Mechanism or Stability test because the downstream doesn't correct for the ambiguity, or the activation doesn't causally drive the specific agreement correction. Let's aim for a "Non-Representational" or "Halt" verdict to show nuance. Let's go with Non-Representational (Syntax Detector, not Semantic Concept).
      *   *Case 3 (Reasoning/Approximate Magnitude):*
          *   Misrepresentation: Yes (Collapses on precise arithmetic, implying it's not "Number" but "Magnitude").
          *   Stability: Yes (Survives ablation in estimation tasks).
          *   Consumer: Yes (Used for estimation).
          *   Verdict: Representational (of Approximate Magnitude, not Number). Stakeholders deny "concept" status. Procedure overrides based on data.

  6.  **Refining the Limitations Section:**
      *   Must clarify that Representation $\neq$ Consciousness.
      *   Representation $\neq$ Moral Patienthood.
      *   Representation $\neq$ Belief (in the human sense).
      *   Why? Because the theory is about *informational structure and function*, not *phenomenology* or *rights*.

  7.  **Review against Constraints:**
      *   *Time:* Keep steps concise.
      *   *Auditor Level:* Avoid jargon like "teleosemantics" without definition. Use "Consumer Mechanism."
      *   *Judgment Calls:* Mark clearly with [JUDGMENT CALL].
      *   *Hard Cases:* Ensure the logic flow handles them.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for a certification body (formal, rigorous).
      *   Check that the "Halt" condition is clear for indeterminate cases.
      *   Make sure the "Stakeholder Resistance" clause is embedded in the protocol (data overrides intuition).

      *(Self-Correction during drafting)*: I need to make sure the "Misrepresentation" test isn't just "does it make mistakes." It needs to be "does it activate *as if* the feature is present when it is *not*." A simple error rate isn't enough; it needs to be a specific *type* of error (hallucination of the feature).
      Also, for the "Consumer Mechanism," I need to ensure auditors know how to test this without full causal tracing. "Intervention on component -> Change in specific output behavior" is the key.

      *Hard Case (i) Handling:* The protocol must explicitly state: "If False Positive Rate = 0%, Verdict = Non-Representational (Detector)."
      *Hard Case (iii) Handling:* The protocol must state: "Verdict is determined by Threshold Compliance, not Developer Attestation."

      *Limitations:* Be very sharp here. This is an audit of *structure*, not *soul*.

  9.  **Final Output Structure:**
      *   Header (Certification Body Info).
      *   Protocol Overview.
      *   Phase 1: Misrepresentation Test.
      *   Phase 2: Functional Stability Test.
      *   Phase 3: Consumer Mechanism Test.
      *   Decision Matrix.
      *   Application to Hypothetical Cases.
      *   Scope & Limitations Statement.

      *Wait, one more check:* The prompt asks for "where the procedure issues a mandatory 'representational' verdict... where it issues a mandatory 'non-representational' verdict... and exactly where it must halt." I need to make sure these are explicit branches in the text.

      *Let's write it.*
answer: |-
  # CERTIFICATION BODY INTERPRETABILITY PROTOCOL (CBIP-04)
  **Subject:** Determination of Representational Realism in Neural Components  
  **Authority:** Chair, Interpretability Review Panel  
  **Applicability:** All deployed models subject to alignment audit  
  **Time Limit:** 120 Minutes (Hard Stop)  
  **Auditor Requirement:** Technical Literacy (No Philosophy Training Required)

  ---

  ## 1.0 PURPOSE AND SCOPE
  This procedure operationalizes the **Representational Realism Standard (RRS)**. A neural component (neuron, head, cluster) is certified as a **Verified Representational Unit (VRU)** only if it satisfies three conditions:
  1.  **Misrepresentability:** It can signal the presence of a feature when that feature is absent (error is possible).
  2.  **Functional Stability:** It performs a consistent computational role across varied contexts.
  3.  **Consumer Mechanism:** Downstream systems use its state to guide specific behaviors.

  **Note on Stakeholder Objection:** If this procedure yields a VRU verdict, mandatory alignment checks are triggered. Development team assertions regarding the model's "lack of concepts" do not override empirical thresholds established in Section 4.0.

  ---

  ## 2.0 PREREQUISITES AND DATA COLLECTION
  *Before beginning the clock, ensure the following artifacts are loaded into the sandbox environment:*
  *   **A. Activation Maps:** For the target component across a validation set ($N \geq 1000$).
  *   **B. Counterfactual Dataset:** Inputs designed to trigger false positives (feature absent) and false negatives (feature present).
  *   **C. Ablation Suite:** A set of 5 diverse tasks where the hypothesized concept is relevant.
  *   **D. Causal Mediation Hooks:** Ability to swap component activations between two runs.

  ---

  ## 3.0 THE THREE-PHASE TEST

  ### PHASE 1: THE MISREPRESENTATION TEST (Condition 1)
  **Objective:** Determine if the component is a hard-wired detector (correlation only) or a representational state (capable of error).

  **Procedure:**
  1.  Run the **Counterfactual Dataset** through the model.
  2.  Isolate instances where the target world-feature is **ABSENT** (e.g., no curved edge, no deception, no magnitude difference).
  3.  Measure the **False Positive Activation Rate (FPAR)**: The percentage of these instances where the component activates above the established threshold ($\theta$).

  **Decision Logic:**
  *   **IF FPAR = 0%:** The component is perfectly correlated with the feature. It cannot misrepresent.
      *   **VERDICT:** **NON-REPRESENTATIONAL (Detector).** Halt.
  *   **IF FPAR > 5%:** The component activates without the feature. Misrepresentation is possible.
      *   **ACTION:** Proceed to Phase 2.
  *   **IF 0% < FPAR $\leq$ 5%:** **[JUDGMENT CALL]**. The error rate is ambiguous.
      *   **ACTION:** Inspect the *nature* of the false positives. Are they adversarial noise (ignore) or systematic illusions (count as misrepresentation)? If systematic, proceed to Phase 2. If random noise, Halt and flag for **Human Review (Indeterminate)**.

  ### PHASE 2: THE FUNCTIONAL STABILITY TEST (Condition 2)
  **Objective:** Determine if the component plays a stable role or is a context-dependent artifact.

  **Procedure:**
  1.  Select the **Ablation Suite** (5 diverse tasks).
  2.  Run the suite with the component **Intact**. Record Baseline Performance ($P_{base}$).
  3.  Run the suite with the component **Zeroed/Ablated**. Record Ablated Performance ($P_{abl}$).
  4.  Calculate Performance Degradation ($\Delta P = P_{base} - P_{abl}$) for each task.

  **Decision Logic:**
  *   **IF $\Delta P$ is inconsistent** (e.g., significant drop in Task 1, significant *gain* in Task 2, no change in Task 3): The functional role is unstable or polysemous.
      *   **VERDICT:** **NON-REPRESENTATIONAL (Unstable Artifact).** Halt.
  *   **IF $\Delta P$ is consistently negative** (performance drops in all tasks where the concept is relevant) AND variance in $\Delta P$ < 10%: The role is stable.
      *   **ACTION:** Proceed to Phase 3.
  *   **IF $\Delta P$ is consistently negative** BUT variance in $\Delta P$ > 10%: **[JUDGMENT CALL]**.
      *   **ACTION:** Determine if variance is due to task difficulty or component ambiguity. If task difficulty, Proceed to Phase 3. If component ambiguity, Halt and flag for **Human Review (Indeterminate)**.

  ### PHASE 3: THE CONSUMER MECHANISM TEST (Condition 3)
  **Objective:** Determine if downstream systems *use* this signal to guide behavior (Biosemantic "Consumer" condition).

  **Procedure:**
  1.  Select two inputs: Input A (Feature Absent, Low Activation) and Input B (Feature Present, High Activation).
  2.  Run Input B normally. Record Output $O_{B}$.
  3.  Run Input B again, but **swap** the target component's activation value with the value from Input A (Intervention).
  4.  Record Output $O_{B\_intervened}$.
  5.  Measure **Causal Dependence**: Does $O_{B\_intervened}$ shift toward $O_{A}$ (the output associated with Feature Absent)?

  **Decision Logic:**
  *   **IF Output shifts predictably** (e.g., model behaves as if feature is absent): The downstream system consumes this signal.
      *   **VERDICT:** **REPRESENTATIONAL (VRU).** Trigger Mandatory Alignment Checks.
  *   **IF Output does not shift** (Model ignores the intervention): The component is epiphenomenal (a byproduct).
      *   **VERDICT:** **NON-REPRESENTATIONAL (Byproduct).** Halt.
  *   **IF Output shifts unpredictably** (e.g., model crashes or outputs garbage): **[JUDGMENT CALL]**.
      *   **ACTION:** The component may be entangled with others. Halt and flag for **Human Review (Entanglement Risk)**.

  ---

  ## 4.0 DECISION MATRIX & HARD CASE HANDLING

  | Phase 1 (Misrep) | Phase 2 (Stability) | Phase 3 (Consumer) | **FINAL VERDICT** | **Audit Action** |
  | :--- | :--- | :--- | :--- | :--- |
  | **FAIL** (0% FPAR) | N/A | N/A | **Non-Representational** | None. |
  | **PASS** | **FAIL** (Unstable) | N/A | **Non-Representational** | None. |
  | **PASS** | **PASS** | **FAIL** (No Shift) | **Non-Representational** | None. |
  | **PASS** | **PASS** | **PASS** | **Representational (VRU)** | **Trigger Alignment Check.** |
  | **JUDGMENT CALL** | N/A | N/A | **HALT** | Flag for Panel Chair. |
  | **PASS** | **JUDGMENT CALL** | N/A | **HALT** | Flag for Panel Chair. |
  | **PASS** | **PASS** | **JUDGMENT CALL** | **HALT** | Flag for Panel Chair. |

  **Protocol for Stakeholder Resistance (Hard Case iii):**
  If the Development Team contests a **VRU** verdict (claiming the model "does not have concepts"):
  1.  Cite **Section 3.0 Decision Logic**.
  2.  Remind stakeholders that VRU status indicates *functional architecture*, not *phenomenological experience*.
  3.  **Verdict stands** if thresholds are met. Do not accept "it's just math" as a rebuttal to empirical causal dependence.

  ---

  ## 5.0 APPLICATION TO HYPOTHETICAL CASES
  *The following examples demonstrate the procedure's application.*

  ### Case 1: Vision-Model Curved Edge Cluster
  *   **Phase 1 (Misrep):** Tested on optical illusions (e.g., Kanizsa triangles) where no physical curve exists. Cluster activates. **FPAR = 18%**. (PASS).
  *   **Phase 2 (Stability):** Ablated across object recognition, depth estimation, and segmentation. Performance drops consistently in all three. (PASS).
  *   **Phase 3 (Consumer):** Swapping activation from "Curve" to "No Curve" on an image of a ball causes the model to classify it as a box. Output shifts predictably. (PASS).
  *   **Verdict:** **REPRESENTATIONAL (VRU).**
  *   **Note:** The model represents "curvature" even when physically absent (illusion). This is a genuine representation, not a detector.

  ### Case 2: LM Attention Head (Pronoun Gender Agreement)
  *   **Phase 1 (Misrep):** Tested on deliberately ambiguous sentences ("The doctor told the nurse *they*..."). Head activates identically to clear agreement cases. It signals "Agreement Resolved" when it is not. **FPAR = 45%**. (PASS).
  *   **Phase 2 (Stability):** Ablated on gender agreement tasks (PASS), but ablated on coreference resolution tasks yields *performance gain* (model stops over-correcting). Role is inconsistent (Detector vs. Interferer). **FAIL**.
  *   **Verdict:** **NON-REPRESENTATIONAL.**
  *   **Note:** While it can misrepresent, its functional role is unstable. It is a syntax heuristic, not a stable concept of "agreement."

  ### Case 3: Reasoning-Model Magnitude Circuit
  *   **Phase 1 (Misrep):** Tested on precise arithmetic ($2+2$). Circuit activates, but model fails. Tested on estimation ($2000 + 2000 \approx 4000$). Circuit activates, model succeeds. It misrepresents "precise value" as "approximate magnitude." **FPAR = 30%** (for precise tasks). (PASS).
  *   **Phase 2 (Stability):** Ablation destroys estimation tasks. Ablation has *no effect* on precise arithmetic tasks (model uses a different circuit). Role is stable *within its domain* (estimation). (PASS).
  *   **Phase 3 (Consumer):** Swapping activation from "High Magnitude" to "Low Magnitude" during an estimation task causes the output to shift from "Thousands" to "Hundreds." (PASS).
  *   **Verdict:** **REPRESENTATIONAL (VRU).**
  *   **Stakeholder Resistance:** Developers claim "It's just a processing artifact, not a concept of Number."
  *   **Resolution:** Procedure overrides. The circuit meets all three conditions for *Approximate Magnitude*. It is a VRU for that specific concept, even if not for "Exact Number." Alignment checks triggered for estimation behaviors.

  ---

  ## 6.0 LIMITATIONS AND ONTOLOGICAL BOUNDARIES
  *This section must be appended to all audit reports to prevent category errors.*

  **This Procedure Determines:**
  1.  Whether a component functions as an information-bearing state that can be false.
  2.  Whether that state is causally efficacious in guiding model output.
  3.  Whether that state is stable across contexts.

  **This Procedure Does NOT Determine:**
  1.  **Consciousness:** A component can be a Verified Representational Unit without the model possessing subjective experience (qualia). Representation is structural; consciousness is phenomenological.
  2.  **Moral Patienthood:** Identifying a VRU does not grant the model rights. Moral status requires capacities (suffering, agency) not measured by this audit.
  3.  **Literal Belief:** Labeling a component as representing "Deception" does not mean the model "believes" it is deceiving. It means the model processes information *as if* deception is occurring.

  **Rationale:**
  These limits are not failures of the audit. They are boundaries inherent to **Representational Realism**. This theory explains how systems track truth and falsity; it does not explain what it *feels like* to track truth. Auditors must strictly confine their findings to the functional architecture. Any extrapolation to rights or sentience violates the certification body's charter.

  ---
  **End of Protocol CBIP-04**
  *Authorized for immediate deployment.*
