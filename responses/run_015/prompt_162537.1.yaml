answer: |-
  Here is a complete, runnable seminar plan designed to fit your 90-minute window with 12 students. It uses a **Hospital Triage Protocol** case. This is sharper than relief logistics because the "Self-Blinding" option (proprietary algorithm) and "Wait" option (delay for audit) have immediate, quantifiable trade-offs that fit on index cards.

  ### **Activity Title:** The Black Box Triage
  **Materials Needed:**
  *   Whiteboard and markers.
  *   12 Index Cards (Theory Briefs).
  *   12 Index Cards (Option Scorecards).
  *   3 Envelopes (Conversion Rules).
  *   1 Sheet of Paper per student (Personal Credence).
  *   Colored paper slips (Red, Blue, Green, Grey) for "Value Chips" (optional, or just use numbers).

  ---

  ### **1. The Case: St. Jude's Pandemic Protocol**
  *(Print this on the first slide or handout)*

  **Context:** You are the Ethics Board at St. Jude's Hospital. A surge of respiratory failure is expected in 4 hours. You have 50 ventilators and 80 eligible patients. You must select an allocation protocol *now*.

  **The Options:**
  1.  **Maximize Survival (Util):** Allocate to those with highest 30-day survival probability.
  2.  **Prioritize Worst Off (Prioritarian):** Allocate to those with lowest current oxygen saturation, regardless of survival chance.
  3.  **Random Lottery (Egalitarian):** Allocate by random draw among eligible patients.
  4.  **Wait & Audit (Inquiry):** Delay decision 6 hours to calibrate the scoring model for racial bias. *Cost:* 5 patients die during the delay. *Benefit:* You gain data on whether the model is biased.
  5.  **Proprietary Lock-in (Self-Blinding):** Use a private vendor's AI model immediately. *Benefit:* Saves 2 extra lives due to speed/efficiency. *Cost:* The code is encrypted; you can never audit *why* decisions were made, foreclosing future moral learning and accountability.

  ---

  ### **2. Minute-by-Minute Timeline (90 Minutes)**

  **00:00 – 00:05 | Introduction & Personal Credence**
  *   Hand out blank paper.
  *   **Instruction:** "Assign a percentage credence (0-100%) to these four claims. Sum must be 100%."
      1.  Consequentialism (Outcome maximization is the sole truth).
      2.  Deontology/Contractualism (Rights/Duties constrain outcomes).
      3.  Virtue/Role Ethics (Character/Relationships are primary).
      4.  Error Theory/Non-Cognitivism (There is no moral fact of the matter).
  *   **Action:** Collect these. Do not discuss yet. This is your baseline data for the debrief.

  **00:05 – 00:20 | Theory Caucuses (Native Units)**
  *   Divide class into 3 Groups of 4.
  *   Assign each group a **Theory Brief** (see Materials below). *Note: One theory will be represented by two groups to cover 12 students, or you combine Virtue/Error into one card for simplicity. Let's assign: Group 1 (Consequentialism), Group 2 (Deontology), Group 3 (Virtue/Error hybrid).*
  *   **Task:** You are consultants for this theory. Look at the 5 Options. Assign a **Native Score** to each option *in your theory's units*.
      *   *Constraint:* You cannot use another theory's units. (e.g., Deontologists cannot say "5 lives lost." They must say "3 Duty Violations.")
      *   *Goal:* Produce a scorecard (0 to 100 scale within your own logic).
  *   **Instructor Note:** Circulate. Ensure Consequentialists value the "Lock-in" highly (efficiency) and Deontologists value "Wait" or "Lottery" highly (process).

  **00:20 – 00:55 | Decision Boards (Aggregation & Scaling)**
  *   **Re-shuffle:** Create 3 new Groups of 4. Ensure each new group has one member from each of the previous Caucuses (mixed expertise).
  *   **Distribute Materials:**
      1.  **Fixed Credence Profile:** "For this simulation, the Board's collective credence is: 40% Consequentialism, 35% Deontology, 15% Virtue, 10% Error Theory." (This ensures identical inputs across groups).
      2.  **Native Scorecards:** Hand them the scorecards generated by the Caucuses (photocopied or transcribed by you quickly—*Tip: Pre-write these on the board during the Caucus phase to save time*).
      3.  **Conversion Envelope:** Each group draws **one** envelope at random. Inside is a **Conversion Rule**.
  *   **Task:** Calculate the **Expected Choice-Worthiness (ECW)** for each option using your Credence Profile and Conversion Rule. Select the winning option.
  *   **Constraint:** You must write down your final calculation and the specific "Exchange Rate" you used to combine the scores.

  **00:55 – 01:05 | Commitment**
  *   Each group writes their chosen Option and their Total ECW score for that option on the whiteboard.
  *   **Do not reveal the Conversion Rule yet.**

  **01:05 – 01:30 | Debrief & Mapping**
  *   Reveal the Conversion Rules.
  *   Map the divergence.
  *   Discuss the "Self-Blinding" vs. "Wait" tension.
  *   Return to Personal Credence sheets.

  ---

  ### **3. Materials**

  #### **A. Theory Briefs (For Caucus Phase)**
  *Give one to each student in the first grouping.*

  **Card 1: Consequentialist Brief**
  *   **Unit:** *QALYs Saved (0–100)*.
  *   **Verdict Guidance:**
      *   *Maximize Survival:* High score (direct utility).
      *   *Proprietary Lock-in:* Higher score than Maximize Survival (saves 2 extra lives).
      *   *Wait:* Lower score (5 deaths is a heavy cost).
      *   *Lottery/Worst Off:* Low score (inefficient).
      *   *Error Theory Note:* If nothing matters, utility is just preference. Discount total value by 10%.

  **Card 2: Deontologist Brief**
  *   **Unit:** *Duty Compliance Points (0–10)*.
  *   **Verdict Guidance:**
      *   *Lottery:* High score (treats patients as equals).
      *   *Wait:* High score (due process/transparency).
      *   *Proprietary Lock-in:* Zero score (violates duty of transparency/accountability).
      *   *Maximize Survival:* Medium score (permissible but not required).
      *   *Error Theory Note:* If there are no duties, these points are fiction.

  **Card 3: Virtue/Error Brief**
  *   **Unit:** *Institutional Integrity (0–10)*.
  *   **Verdict Guidance:**
      *   *Worst Off:* High score (shows care for vulnerable).
      *   *Wait:* High score (shows prudence/humility).
      *   *Lock-in:* Low score (shows arrogance/greed).
      *   *Error Theory Component:* 10% of your credence holds that "Integrity" is a myth. If true, all scores are 0.

  #### **B. Conversion Envelopes (For Decision Board Phase)**
  *Put these in sealed envelopes. Label them A, B, C.*

  **Envelope A (The Linear Assumption)**
  *   **Rule:** Normalize all scores to a 0–100 scale.
  *   **Exchange Rate:** 1 Duty Point = 10 QALYs. 1 Integrity Point = 10 QALYs.
  *   **Error Handling:** Multiply final expected value by 0.9 (to account for 10% chance nothing matters).
  *   **Prediction:** Likely chooses **Proprietary Lock-in** (Utilitarian weight dominates).

  **Envelope B (The Lexical Constraint)**
  *   **Rule:** Deontological scores act as veto thresholds.
  *   **Exchange Rate:** Any option with < 5 Duty Points is ineligible. Among eligible options, maximize QALYs.
  *   **Error Handling:** Ignore Error Theory credence (treat as noise).
  *   **Prediction:** Likely chooses **Wait** or **Lottery** (Lock-in is vetoed).

  **Envelope C (The Discounted Inquiry)**
  *   **Rule:** Value of Information is discounted by Error Theory credence.
  *   **Exchange Rate:** 1 Duty Point = 5 QALYs.
  *   **Error Handling:** If 10% chance nothing matters, the value of "Wait" (learning) is reduced by 100% (you can't learn facts that don't exist).
  *   **Prediction:** Likely chooses **Maximize Survival** (Wait becomes worthless).

  #### **C. The Fixed Credence Profile**
  *(Print on a slip for each Decision Board)*
  > **Board Mandate:** You do not vote based on personal belief. You act as an agent for the Hospital's established moral risk profile:
  > *   **40%** Consequentialism
  > *   **35%** Deontology
  > *   **15%** Virtue Ethics
  > *   **10%** Error Theory / Non-Cognitivism

  ---

  ### **4. The Debrief Plan (Mapping the Problems)**

  **Step 1: The Divergence (5 mins)**
  *   Point to the whiteboard. Groups had identical Credences (40/35/15/10) and identical Native Scores (from the Caucuses).
  *   Ask: "Why did Group A choose Lock-in and Group B choose Wait?"
  *   Reveal Envelopes.
  *   **Lesson:** The *aggregation function* (intertheoretic comparison) determines the outcome more than the first-order verdicts. This is the **Scaling Problem**.

  **Step 2: My Favorite Theory vs. MEC (5 mins)**
  *   Ask the Consequentialist students: "Did your preferred option win in Group B?" (Likely no).
  *   Ask: "If you acted on your personal 40% credence alone (MFT), you would ignore the 60% risk of violating duties. Was MEC more cautious?"
  *   **Lesson:** MEC internalizes moral risk; MFT externalizes it onto the world.

  **Step 3: The Error Theory Trap (5 mins)**
  *   Ask Group C: "How did the 10% Error Theory credence change your math?"
  *   Highlight that for Group C, it destroyed the value of the **Wait** option.
  *   **Lesson:** Error theory isn't just a "null vote." It attacks the *value of information*. If there are no facts, inquiry is waste. This makes "Wait" costly in a unique way.

  **Step 4: Self-Blinding vs. Squeamishness (5 mins)**
  *   Focus on the **Proprietary Lock-in** option.
  *   Ask: "Who rejected Lock-in because it felt 'wrong' vs. who rejected it because it prevented *future correction*?"
  *   **Lesson:** Distinguish **Refusal** (I won't do this) from **Epistemic Preservation** (If I do this, I can't know if I was right later). The latter is a rational constraint under moral uncertainty.

  **Step 5: Personal Credence Reveal (5 mins)**
  *   Return their initial sheets.
  *   Ask: "Look at your spread. Was it as wide as the 40/35/15/10 simulation?"
  *   **Lesson:** Most students realize they are more uncertain than they act. The simulation forced a spread; reality usually hides it.

  ---

  ### **5. Predictable Failure Modes & Mitigations**

  **1. The "This Rule is Stupid" Rebellion**
  *   **Risk:** Group B gets Envelope B (Lexical Constraint) and argues, "Utilitarianism shouldn't be vetoed by Deontology. This rule is irrational." They refuse to use it.
  *   **Mitigation:** Frame the Envelope not as "Truth" but as "Regulatory Constraint." Tell them: "You are not the Supreme Court of Morality; you are a Hospital Board operating under a Charter. The Charter dictates the conversion rule. Your job is compliance, not metaphysics."
  *   **Debrief Use:** If they rebel, use it! Point out that *refusing the conversion rule* is itself a metanormative stance (dogmatism).

  **2. Role-Confusion (Personal vs. Assigned)**
  *   **Risk:** In the Decision Board phase, the Consequentialist student tries to argue their *personal* credence rather than the Fixed Profile (40%).
  *   **Mitigation:** Explicitly instruct: "In Phase 1, you were yourself. In Phase 2, you are employees of the Simulation. Use the Fixed Profile slip."
  *   **Debrief Use:** If they slip up, note that *personal* uncertainty is hard to separate from *theoretical* advocacy.

  **3. The Math Bottleneck**
  *   **Risk:** Students spend 20 minutes arguing how to normalize a 0-10 scale to a 0-100 scale.
  *   **Mitigation:** Pre-calculate the "Normalized Scores" on the whiteboard during the Caucus phase. As Group 1 finishes their Util scores, write them up. By the time Phase 2 starts, the numbers are public. They only debate the *weights*, not the arithmetic.

  **4. Ignoring the Error Theory**
  *   **Risk:** Students treat the 10% Error Theory as "Just subtract 10% from the final score" without realizing it impacts the "Wait" option disproportionately.
  *   **Mitigation:** In Envelope C, make the instruction explicit: "If Error Theory is true, 'Wait' has 0 value because there is no truth to find." Force them to confront the epistemic cost.

  ---

  ### **6. Limitations (What You Must Supply)**

  Be honest with the students that the activity *cannot* simulate the following, which you must explain in the final 5 minutes:

  1.  **Phenomenological Weight:** The activity treats moral uncertainty like risk (dice rolls). It cannot capture the *anxiety* or *agency* of actually believing 35% that you might be violating a categorical imperative. The chips are cold; real guilt is hot.
  2.  **Endogenous Credence:** In the game, credences are fixed (40/35/15/10). In reality, choosing an action *changes* your credence (cognitive dissonance, self-persuasion). The game is static; moral life is dynamic.
  3.  **The "Common Scale" Illusion:** The activity forces them to create a scale (via Envelopes) to make a decision. You must point out that in the real world, **no such envelope exists.** The fact that they *had* to use one to finish the task is the tragedy of moral uncertainty. There is no "Charter" in reality.
  4.  **The "No Fact" Nuance:** The game treats Error Theory as a probability discount. You should note that some philosophers argue Error Theory isn't a *credence* (belief that p is false) but a *conceptual rejection* (belief that 'p' is meaningless), which shouldn't enter the expectation calculation at all. The game simplifies this to make the math runnable.

  ### **Instructor Prep Checklist**
  1.  **Pre-write Native Scores:** To save time, have the "Theory Caucus" scores already calculated on a hidden sheet. If the students' scores are too wild during the 15-min caucus, swap in your pre-calculated numbers for the Decision Phase so the math works.
  2.  **Test the Math:** Ensure Envelope A leads to Lock-in, Envelope B leads to Wait/Lottery. (Adjust the "2 extra lives" benefit of Lock-in vs. the "5 deaths" cost of Wait until the ECW flips based on the Exchange Rate).
  3.  **Whiteboard Layout:** Draw three columns (Group A, B, C). Leave space for "Chosen Option" and "Conversion Rule."

  This activity forces the **Scaling Problem** to be the bottleneck. They will want to argue ethics, but the rules force them to argue *exchange rates*. That is exactly where you want them stuck.
