answer: |-
  It is completely understandable that you are feeling worn down. Three years of midnight calls about the same unresolved problem is a heavy load for a friendship to bear. You are stuck between empathy for your mate's unhappiness and frustration at his inertia, and that is a very common place to find oneself.

  Here is a breakdown of the two questions you asked, keeping in mind the nuance you rightly feel the "harsh friend" is missing.

  ### 1. Is the "behaviour is the only real evidence" line right?

  The harsh friend is partially right, but for the wrong reasons. His view is behaviourist: if you do not act, you do not truly want. That is too blunt an instrument for human psychology. It misses the internal reality of conflict.

  Your mate is not necessarily lying when he says he wants to leave. He is likely telling the truth about his *dissatisfaction*, but he is mistaken about his *priorities*.

  To understand this, you have to separate "wanting" from "willingness".
  *   **Wanting** is the fantasy of the outcome (living elsewhere, a new job, less stress).
  *   **Willingness** is the acceptance of the cost required to get there (risk, uprooting the child, distance from his mum, potential failure).

  Your mate wants the outcome, but he is not willing to pay the price. Therefore, his behaviour reveals that he values security and the status quo *more* than he values escaping his current unhappiness. That does not mean the unhappiness isn't real. It just means the pain of leaving is currently greater than the pain of staying.

  Regarding the constraints you mentioned (the sick mum, the school, the pay cut): these are real, but they are also part of the calculation. Every time he chooses not to apply for a job because of them, he is making a active choice to prioritise those constraints over his own desire to leave. It is not a "clean choice," as you say, but it is still a choice. He is choosing the devil he knows.

  So, the behaviourist argument is missing the fact that he is suffering. He is in genuine pain. But it is correct in identifying that he is not currently motivated enough to resolve it. The "fact inside him" is not a clear desire to leave; it is a state of ambivalence. He wants two incompatible things: safety and change. His behaviour tells you which one wins when they fight.

  ### 2. What should you concretely do?

  You cannot fix this for him, and continuing to listen in the same way is damaging your own well-being and potentially hindering him. By absorbing his anxiety at midnight, you are acting as a pressure valve. You are allowing him to release enough steam to survive another day in the job he hates, which removes the urgency for him to actually change.

  Here is a practical approach:

  **Set boundaries on the contact**
  You need to stop the midnight calls. They are the symptom of the problem. You can say something like: *"Mate, I care about you, but I can't be the person you call at midnight to talk about this anymore. It's affecting my sleep and I'm not able to help you when I'm exhausted. If you need to talk, let's have a proper chat at the weekend."*
  This forces the conversation into daylight hours, where it is more likely to be rational and less purely emotional.

  **Change the script**
  When you do speak, stop validating the venting. Currently, you listen, he feels heard, and nothing changes. You need to shift from "therapist" to "mirror".
  *   **Old response:** "That sounds awful, I can see why you're stressed."
  *   **New response:** "You've been saying this for three years. You're clearly in pain, but you aren't leaving. What do you think is actually stopping you?"
  *   **Or:** "I'm not going to discuss the complaints anymore unless we are discussing a concrete plan. Are we planning, or are we just venting? Because I can't do the venting anymore."

  **Regarding the "Trial Run"**
  The third friend's suggestion is actually quite sharp, and here is why turning down a small version tells you the same thing as turning down the real one: it tests *friction tolerance*, not logistics.
  If he won't take a month's leave or a weekend trial somewhere, it proves that the barrier isn't the "school term" or the "mum's health" specifically; the barrier is *action itself*. Any action, no matter how small, requires energy and risk. If he is unwilling to spend a small amount of energy to test the waters, he will never spend the large amount required to move.
  You can suggest this, but do not organise it for him. Say: *"Why don't you book a week's holiday and go stay in the place you keep talking about? Just to see. If you won't even do that, you need to admit to yourself that you aren't actually going to move."*

  **The Hard Truth**
  If he refuses the trial, refuses to apply for jobs, and continues to call you at midnight, you have your answer. At that point, you are entitled to say: *"I love you as a friend, but I cannot watch you make yourself miserable for another year. I'm stepping back from these conversations until you make a move."*

  It sounds harsh, but sometimes a friend needs to feel the silence of their support network to realise that the status quo is no longer sustainable. Right now, he has the worst of both worlds: the misery of the job and the comfort of your sympathy. He needs to lose one of them to find the motivation to change.

  **Summary**
  1.  **Believe the behaviour, not the words.** He wants change less than he wants safety.
  2.  **Stop the midnight calls.** Protect your own peace.
  3.  **Stop soothing the pain.** Let the discomfort of his situation sit with him; it is the only thing that might push him to move.
  4.  **Suggest the trial, but don't carry it.** If he won't take a small step, he won't take a big one.

  You are a good mate for worrying about this, but you cannot want it more than he does.
