answer: |-
  **Setting:** *A quiet corner of a coffee shop on a rainy Tuesday afternoon. Two friends, LEO and SAM, are sitting with half-empty mugs. Leo is stirring a latte; Sam is leaning back in the chair, looking thoughtful.*

  **Leo:** So, did you ever figure out who won the argument last night? After we all left the bar?

  **Sam:** *(Laughs)* I don't think anyone won. I just went home and felt like maybe I'm not a good person, I'm just a person who hasn't been tested yet. It was those psychology studies you mentioned. The ones that say character is basically a myth.

  **Leo:** The situationist stuff?

  **Sam:** Yeah, that. It's hard to shake. Like, if a seminary student stops to help a guy slumped in an alley only when he's not in a hurry, but walks right past when he's late... where's the virtue? Where's the "honesty" or "compassion" if it switches off like a lightbulb based on the clock?

  **Leo:** Okay, I get why that's unsettling. It makes virtue ethics sound naive. Like we're walking around pretending we have these solid personalities, but really we're just leaves blowing in the wind. But I don't think it kills the whole idea of being good. I just think it means we've been defining "character" wrong.

  **Sam:** How so?

  **Leo:** We treat virtues like these big, global things. Like, "I am an honest person." Period. End of story. But what if that's not how it works? What if virtues aren't these massive, cross-the-board traits? What if they're smaller? Local?

  **Sam:** You mean like, I'm honest at work but not honest with my parents?

  **Leo:** Exactly. Or even more specific. Maybe I'm honest when I'm being watched, but not when I'm anonymous. Or I'm generous when I'm relaxed, but stingy when I'm stressed. I was thinking about this last night. What if we don't have a "character," we have a bunch of... I don't know, "micro-characters"?

  **Sam:** *(Smiles)* "Micro-character." That's a new one. I don't think Aristotle wrote about that.

  **Leo:** *(Grins)* Pretty sure he didn't. But think about it. If virtue is just a habit, habits are specific. I might have a habit of checking my blind spot when I drive, but I don't have a habit of flossing. Does that mean I'm not a "careful person"? No, it means I'm careful in specific contexts. Why can't morality work the same way?

  **Sam:** I see where you're going. And honestly, that actually fits the psychology data better. The studies don't show that people are random. They show that people are *predictably* inconsistent.

  **Leo:** Predictably inconsistent?

  **Sam:** Yeah. If I know you, I know that if you're tired, you get snappy. If you're in a crowd, you're more likely to help someone than if you're alone. That's still a pattern. It's just not the "global trait" pattern the philosophers wanted. It's an "if-then" pattern. *If* situation X, *then* behavior Y.

  **Leo:** Right. So, virtue ethics survives, but it looks different. It's not about becoming a saint who is brave in every single moment of their life. It's about knowing your micro-characters. Knowing that "Stressed Leo" is a jerk, and trying to fix that specific setting.

  **Sam:** Okay, I can buy that. It makes virtue more about management than magic. But here's my pushback. Even if we break it down into these micro-habits, the situation is still the boss. You said "Stressed Leo" is a jerk. Well, why is he stressed? Because of the situation. If your boss yells at you, you snap at your partner. The situation pulled the trigger.

  **Leo:** But I'm the one who put myself in the job, right? Or I'm the one who didn't take five minutes to breathe before I walked in the door. Look, I'm not saying situations don't matter. Of course they do. But if I admit that "Crowded Room Leo" ignores people in need, I can change that. I can train "Crowded Room Leo" to look up from his phone.

  **Sam:** So you're saying virtue is just building better micro-habits?

  **Leo:** Basically. It's not about having a soul made of steel. It's about stacking the deck. If I know I'm more likely to cheat on my diet when cookies are on the counter, I don't buy cookies. That's a virtuous act, isn't it? Self-knowledge plus preparation.

  **Sam:** I'll give you that. Actually, the psychology does support the idea that consistency shows up over time, just not across different situations.

  **Leo:** What do you mean?

  **Sam:** Well, if we look at you over six months, you're pretty stable. You're not kind on Monday and cruel on Tuesday for no reason. There's a baseline. It's just that your baseline shifts depending on the environment. So, you're right that we can work on ourselves. But we have to be humble about it. We can't say, "I'm a good person, so I'll definitely do the right thing in a war zone."

  **Leo:** *(Nods)* That's the trap. Thinking virtue is a shield. Maybe it's more like a muscle that only works in certain ranges of motion.

  **Sam:** Exactly. And that actually makes me feel less doomed. If character isn't this huge, unchangeable rock I was born with, then I can actually build it. Brick by brick. Context by context.

  **Leo:** So, "micro-character" isn't a real philosophical term, but it might be the only way to make sense of it.

  **Sam:** Don't let it go to your head. But yeah. Maybe being a "good person" isn't a status you achieve. Maybe it's just the practice of noticing which situations make you bad, and trying to fix them.

  **Leo:** *(Raises coffee mug)* To fixing "Tired Leo," then.

  **Sam:** *(Clinks mug)* And "Hungry Sam." Never trust me when I haven't eaten.

  **Leo:** Noted. So, are you going to finish that muffin, or is "Hungry Sam" going to get possessive?

  **Sam:** *(Laughs)* Situations control everything, my friend. Get your own.
