prompt: |-
  I was talking with my friends last night after watching some random philosophy videos on youtube and we got into a huge argument about virtue ethics and that psychology study stuff that says people don't really have stable characters. I'm not a student or anything, just someone who likes thinking about this on my own, but I got really confused about whether being a "good person" even makes sense if situations control everything. I started wondering if maybe the answer isn't all-or-nothing - like, what if virtues aren't these big global traits but instead are super local and tied to specific contexts? I even made up a term for it, "micro-character," though I'm pretty sure that's not a real thing in philosophy. Definately could be wrong though.

  Can you write a dialogue for me? Have two people sitting in a coffee shop debating whether virtue ethics can survive the situationist critique if we think of virtues as these small, context-bound habits instead of one big personality. The first person should defend virtue ethics but be willing to accept that virtues might be fragmented and local rather than universal. The second should argue from the situationist side that situations still dominate behavior, but they should also admit that people do show some consistency over long time periods, not just in single experiments. They need to actually respond to each other's points - real back-and-forth, no strawmen. And please write it in American English since I'm more comfortable with that. I want the dialogue to feel smart but not like it's using a bunch of jargon I wouldn't understand.
