answer: |-
  1. The Question

  **Final Examination: Metaphysics of Persistence**
  **Time Allowed: 90 Minutes**
  **Total Marks: 30**

  **Essay Question**

  Consider the following case: Ada runs a marathon. It is metaphysically possible that the order in which the instantaneous stages of her run are located in time diverges from the order those stages bear to one another along every other dimension that seems relevant, including fatigue, memory, causal influence and similarity of intrinsic character. Stipulate that the stage at which she crosses the finish line occupies the earliest time, that the stage at which she leaves the start line occupies the latest, and that the intermediate stages are scattered in between with no pattern, while remaining pairwise causally linked and internally exactly as they would be in an ordinary run. Call the fatigue-and-memory ordering the *gradient ordering*.

  Write an essay addressing the following interconnected issues:

  1.  Analyze what each view (endurantism and the temporal-parts view) says about whether Ada changes in this scenario and in which direction. Can the temporal-parts theorist identify change with variation across temporal parts without adding temporal order as a separate ingredient to the mereology?
  2.  Evaluate whether the time-indexing reply to the problem of temporary intrinsics undermines the argument for temporal parts, considering that the worm itself seems to have temporary properties.
  3.  Conclude by arguing whether these two views are, in the end, saying anything different about the nature of change and persistence.

  *Note: Do not dismiss the case as physically impossible. Answer based on the metaphysical dialectic alone.*

  ***

  2. Model Answer

  The Ada case demonstrates that the endurantist and the temporal-parts theorist are not offering competing explanations of change, but rather competing ontologies that rely on the same primitive temporal ordering to make sense of change. Consequently, regarding the *analysis* of change, the views collapse into one another, even if they disagree on what entities exist.

  First, consider the Ada case. For the endurantist, Ada is wholly present at each time. At the earliest time, she is tired (finish line); at the latest, she is fresh (start line). She changes from tired to fresh. This is a backward run. The endurantist accepts this because she privileges temporal location as the index for property instantiation. The temporal-parts theorist faces a dilemma. If change is merely variation across parts, the parts must be ordered. Mereology alone does not supply an order; a set of parts is unordered. The theorist must specify whether the parts are ordered by their temporal location or by the gradient ordering. If ordered by temporal location, the worm changes from tired to fresh (backward run). If ordered by gradient, the worm changes from fresh to tired (normal run), but this ordering is not temporal. To say the worm persists normally despite running backwards in time requires adding a non-temporal ordering principle to the theory. Thus, the temporal-parts theorist cannot identify change with variation across parts without adding temporal order (or gradient order) as a separate ingredient. Both views must appeal to a primitive ordering relation external to the mereology or the substance itself.

  This leads to the problem of temporary intrinsics. The standard argument for temporal parts is that endurantism cannot explain how one object has incompatible properties without contradiction, unless properties are relations to times. However, the time-indexing reply is available to the endurantist: having a property is always having-it-at-a-time. The temporal-parts theorist often claims this is ad hoc for endurantists but natural for worms. Yet, the worm itself has temporary properties. The worm is straight at one interval and curved at another. If the worm is the persisting object, it faces the same problem of temporary intrinsics unless the worm's properties are also indexed to times. If the worm's properties are indexed to times, we have not solved the problem; we have pushed it up one level. To avoid a regress, the temporal-parts theorist must stop at the instantaneous stages, claiming they have properties simpliciter. But this concedes that the fundamental bearers of properties are momentary, which the endurantist can accept by saying the *object-at-a-time* is the fundamental bearer. The distinction blurs: both agree that property instantiation is fundamentally time-relative.

  The crucial divergence lies only in whether the temporally-indexed bearers are parts of a larger whole or modes of a substance. In the Ada case, both theories require a primitive temporal ordering to determine the direction of change. The mereological sum of stages does not dictate that the finish-stage comes before the start-stage; only the temporal location does. If the temporal-parts theorist relies on temporal location to order the parts, they are relying on the same primitive temporal framework the endurantist uses to index properties. Therefore, the explanatory work is being done by the temporal ordering, not by the mereology. The mereology is idle regarding the *direction* of change.

  I conclude that the views do not say anything different about the nature of change. Both require a primitive temporal ordering to distinguish a backward run from a forward one. Both require property instantiation to be time-relative to avoid contradiction. The only difference is ontological: whether the temporally-indexed entities are parts of a four-dimensional whole or modifications of a three-dimensional substance. This is a difference in counting, not in explaining. The Ada case exposes that without a primitive temporal order, neither view can account for the directionality of change, rendering the mereological dispute metaphysically superficial regarding the problem of persistence.

  **Contestable Assumption:** I have assumed that two views are not "saying anything different" if they rely on the same primitive resources to explain the same phenomena, even if their ontological commitments differ. One might argue that ontological difference alone is sufficient for distinctness, regardless of explanatory collapse.

  ***

  3. Marking Scheme

  **Total Marks: 30**

  **A. Analysis of the Ada Case (10 Marks)**
  *   **Correct identification of the Endurantist verdict (3 marks):** Must state Ada changes from tired (finish) to fresh (start) relative to temporal location (backward run).
      *   *Miss:* Claiming endurantism cannot handle the case or that Ada runs normally despite temporal order.
  *   **Correct identification of the Temporal-Parts dilemma (4 marks):** Must explain that mereology does not supply order; the theorist must choose between temporal location (backward) or gradient (normal) ordering.
      *   *Miss:* Assuming the worm automatically inherits the gradient order without justification.
  *   **Conclusion on "Separate Ingredient" (3 marks):** Must argue that temporal order (or gradient order) is an added ingredient not supplied by mereology alone.
      *   *Miss:* Claiming mereology inherently supplies temporal order.

  **B. Temporary Intrinsics and Worm Properties (10 Marks)**
  *   **Availability of Time-Indexing (3 marks):** Must acknowledge time-indexing is available to both views, weakening the argument from intrinsics.
      *   *Miss:* Treating time-indexing as exclusive to one view.
  *   **The Worm's Properties/Regress (4 marks):** Must note that the worm itself has temporary properties, risking regress unless stages are fundamental.
      *   *Miss:* Ignoring the worm's own properties or dismissing the regress worry trivially.
  *   **Implication for Distinctness (3 marks):** Must argue this levels the playing field regarding property instantiation.
      *   *Miss:* Insisting the worm view solves intrinsics without qualification.

  **C. Synthesis and Collapse Question (10 Marks)**
  *   **Role of Ordering Relation (4 marks):** Must argue that temporal ordering does the explanatory work, not the mereology vs. substance distinction.
      *   *Miss:* Focusing only on the number of entities posited.
  *   **Definite Position on Collapse (3 marks):** Must take a stand (collapse or no collapse) supported by the previous analysis.
      *   *Miss:* Sitting on the fence without justification.
  *   **Resistance to Bad Moves (3 marks):** **Reserved.** Must not dismiss the case as physically impossible, nor treat intuitive plausibility or ontological parsimony as decisive without argument.
      *   *Miss:* Dismissing the case based on physics or causality constraints.

  **Grade Distinctions**
  *   **A (24-30):** Integrates all three pressure points seamlessly. Explicitly identifies that mereology lacks ordering. Takes a definite stance on the collapse question. Successfully resists the temptation to dismiss the case.
  *   **B (15-23):** Correctly analyzes the case and the intrinsics argument but fails to connect them to the "collapse" conclusion. May treat the views as distinct solely based on ontology without addressing the explanatory overlap.
  *   **C (0-14):** Recites standard arguments (fission, vagueness) without applying them to the Ada case. Fails to recognize the ordering problem for temporal parts. Dismisses the case as impossible.

  **Common Errors per Move**
  *   *Ada Case:* Students often assume the worm inherits the causal order automatically, missing the need for a temporal ordering principle.
  *   *Intrinsics:* Students often claim only endurantists need time-indexing, ignoring that worms have temporary shapes too.
  *   *Collapse:* Students often confuse ontological difference (parts vs. whole) with explanatory difference (how change is analyzed).
  *   *Bad Move:* Students frequently lose marks by arguing the case is impossible because causes cannot precede effects, violating the "metaphysically possible" stipulation.
