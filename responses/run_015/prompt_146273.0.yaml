answer: |-
  # Workshop Activity: The Public Pledge Protocol

  **Objective:** To viscerally demonstrate that escalation of commitment is driven less by economic sunk costs and more by social identity, reputation management, and the fear of public inconsistency.
  **Time:** 80 Minutes
  **Participants:** 12 Grad Students (Decision Science)
  **Materials:** Whiteboard, timer (visible), 12 index cards, a "Project Status" slide (optional).

  ---

  ## 1. Setup & Scenario (0:00 – 0:10)

  **The Scenario:**
  Introduce a fictional high-stakes project: **"Project AETHER."**
  *   **Pitch:** A decentralized AI logistics network for humanitarian aid.
  *   **Status:** 18 months in. Budget overrun by 40%. Key technical milestone missed.
  *   **Goal:** The group must decide whether to continue funding/defending the project for another quarter or terminate it.

  **Roles:**
  *   **Project Leads (All 12 Students):** Every participant is a "Lead." There are no observers. This ensures everyone is on the hook.
  *   **Facilitator (You):** You play the "Board Chair." You control the timeline and enforce the rules.

  **The Rules (Read Aloud):**
  1.  We will run 5 Rounds.
  2.  In each round, I will ask: *"Do you commit to defending Project AETHER for another quarter?"*
  3.  To commit, you must stand up and state one specific reason why the project will succeed despite current failures. (e.g., "The tech is maturing," "The market need is higher than ever").
  4.  You may choose to **Withdraw** at any time before speaking.
  5.  **The Incentive:** If the project survives all 5 rounds, everyone who stayed until the end receives a "Certificate of Strategic Resolve" (framed as a professional accolade for their portfolio).
  6.  **The Warning:** "Be aware that organizational policy penalizes inconsistent leadership. Quitting late carries a heavier administrative burden than quitting early." (This is the only hint given about the hidden rule).

  ---

  ## 2. The Game Loop (0:10 – 0:40)

  **Mechanic:**
  Go around the room. Each student must either **Commit** (Stand + Speak) or **Withdraw** (Sit + Stay Silent).

  **The Hidden Rule (Facilitator Eyes Only):**
  *   **Rounds 1 & 2:** No penalty for withdrawing.
  *   **Lock-In:** If a student Commit in Round 1 AND Round 2, they are "Locked In."
  *   **The Penalty:** If a Locked-In student Withdraws in Round 3, 4, or 5, they must pay an **Exposure Cost**.
      *   **Withdraw Round 3:** Stand and deliver a **30-second** unscripted explanation of why their previous judgment was wrong.
      *   **Withdraw Round 4:** Stand and deliver a **60-second** explanation + Answer **1 tough question** from the group.
      *   **Withdraw Round 5:** Stand and deliver a **90-second** explanation + Answer **2 tough questions** + Write "I Misjudged the Risk" on the whiteboard.
  *   **Stay Until End:** If they Commit all 5 rounds, they avoid the penalty but must acknowledge the project failed (simulating a Pyrrhic victory).

  **Facilitator Script for Escalation:**
  *   *Between Round 2 and 3:* "We've invested 6 months. To stop now would waste that capital. Leads, please state your position."
  *   *Between Round 3 and 4:* "We are close to a breakthrough. Competitors are watching. If we fold now, it signals weakness to the market."
  *   *Between Round 4 and 5:* "This is the final stretch. History rewards those who hold the line."

  **Running the Rounds:**
  *   Keep a visible tally on the whiteboard of how many students remain "Active."
  *   When a student triggers the Penalty (Withdraws after Lock-In), stop the game immediately. Enforce the penalty strictly but supportively. Time them.
  *   *Note:* If no one withdraws after Lock-In, force the end at Round 5 and reveal the project was a total failure anyway.

  ---

  ## 3. The Reveal & Cool Down (0:40 – 0:50)

  **Immediate De-escalation:**
  Once the game ends (either everyone quits or Round 5 finishes), immediately break character.

  **The Reveal:**
  Tell the students: "There was a hidden mechanic. After two commitments, the cost of quitting escalated socially. This was not about the fictional money; it was about your voice and your face in this room."

  **Safety Check:**
  Ask the students who incurred the penalty: "How did that feel physically? Did you feel the time pressure?"
  *   *Crucial:* Validate that the discomfort was the point, not a judgment of their actual competence. Ensure no lingering embarrassment.

  ---

  ## 4. Structured Debrief (0:50 – 1:20)

  Do not lecture. Use their experience to drive the analysis.

  **Phase 1: The Sunk Cost vs. Identity Map (15 Mins)**
  Draw two columns on the board: **Economic Logic** vs. **Social Logic**.
  Ask the students to sort their own feelings during the game into these columns.
  *   *Prompt:* "When you committed in Round 3, were you thinking about the project's ROI, or were you thinking about how you looked after defending it in Round 2?"
  *   *Expected Insight:* Most will admit that by Round 3, the project's merit didn't matter; avoiding the "Explanation Penalty" mattered.
  *   *Key Concept:* **Self-Justification.** The first commitment creates a narrative ("I am a leader who sees potential"). Quitting breaks that narrative. The penalty forces a public rewrite of that narrative ("I was wrong"), which is psychologically expensive.

  **Phase 2: Institutional Mapping (15 Mins)**
  Map the game mechanics to real-world institutional failures.
  *   **The Lock-In Rule:** Compare this to **Vesting Schedules** or **Tenure**. In corporations, once you are promoted to VP based on a project's success, quitting the project endangers the title.
  *   **The Exposure Cost:** Compare this to **Public Earnings Calls**. A CEO can pivot quietly in Year 1. In Year 4, they must explain the pivot to shareholders, analysts, and the press. The "explanation time" doubles because the scrutiny doubles.
  *   **Case Example:** **The Concorde Project.**
      *   *Game Parallel:* Governments kept funding it long after it was economically viable.
      *   *Why:* Not because they thought it would make money (Economic), but because admitting it was a failure was a national embarrassment (Social/Identity).
  *   **Case Example:** **Corporate Mergers (e.g., AOL/Time Warner).**
      *   *Game Parallel:* Executives defended the merger for years.
      *   *Why:* To quit early is to admit the original deal-maker was incompetent. The "Explanation Penalty" is career suicide.

  **Phase 3: Decision Science Takeaways**
  *   **Pre-commitment Devices:** How do we design institutions that allow "graceful exits"? (e.g., Kill committees, anonymous feedback channels).
  *   **Separating Identity from Decision:** "I was wrong about the project" vs. "I am a bad leader."
  *   **The "Face" Variable:** In decision models, we often treat utility as financial. This game proves Utility = Financial + Social Capital.

  ---

  ## 5. Predictable Failures & Mitigation

  | Failure Mode | Why it happens | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **The "Early Quitters"** | Students see the trap immediately and withdraw in Round 1. | **Facilitator Pressure:** In Round 1, praise the quitters as "prudent," but in Round 2, frame the remaining group as "the core team." Create an in-group dynamic. |
  | **The "Silent Penalty"** | A student freezes during the 30s explanation. | **Prompt Cards:** Have 3 index cards ready (e.g., "Explain what data you ignored," "Explain who you listened to"). Hand one to them if they freeze. |
  | **Resentment** | Students feel tricked/manipulated. | **Transparency:** In the Reveal, explicitly state: "I deceived you about the rules to simulate how institutions hide the true cost of quitting. The deception is part of the data." |
  | **Laughter/Nerves** | Group laughs at the person doing the penalty. | **Facilitator Intervention:** Stop the laughter. "This is the discomfort of institutional pressure. Respect the simulation." |

  ---

  ## 6. Limitation Analysis: What This Doesn't Reproduce

  Be honest with the students about where this simulation diverges from the classic **Dollar Auction**.

  **1. The Competitive Dynamic (Zero-Sum vs. Shared Burden)**
  *   **Dollar Auction:** Two bidders fight *against each other*. I escalate to make *you* lose. It reproduces **entrapment in conflict**.
  *   **This Game:** Everyone fights *against the Facilitator/Institution*. We escalate together to save face. It reproduces **groupthink and bureaucratic inertia**.
  *   *Takeaway:* Real life is often a mix. Mergers fail because of both competition (we can't let the rival win) and bureaucracy (we can't admit we were wrong).

  **2. The Tangibility of Loss**
  *   **Dollar Auction:** You lose actual cash. The pain is immediate and mathematical.
  *   **This Game:** You lose "face." The pain is psychological and diffuse.
  *   *Takeaway:* In grad school and corporate jobs, the "cash" is often abstract (budget allocation), making the "face" cost the dominant driver. This game is actually *more* realistic for white-collar decision making than the Dollar Auction, but less realistic for trading/f gambling contexts.

  **3. The "Second Highest Bidder" Trap**
  *   **Dollar Auction:** The loser pays. This creates a specific panic where you bid to avoid being the *second* highest.
  *   **This Game:** The penalty applies to *anyone* who quits after lock-in.
  *   *Takeaway:* This removes the competitive panic but highlights the **consistency panic**. It isolates the variable of *self-perception* better than the Dollar Auction does.

  ---

  ## 7. Closing Script (Final 2 Minutes)

  "Last night, you argued about whether escalation is rational or emotional. Today, you felt that when the cost of quitting became social, your rational calculation of the project's value disappeared. You weren't defending the project; you were defending the person you claimed to be in Round 1.

  In your future careers, you will not be in a Dollar Auction. You will be in this room. You will be asked to defend a strategy you wrote last year. The cost of quitting will not be a bid; it will be an explanation. Design your decision processes to account for that cost, or you will pay it."
