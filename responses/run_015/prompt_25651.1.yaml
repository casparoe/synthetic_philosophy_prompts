prompt: |-
  I'm teaching a philosophy of mind seminar and next week we're doing the extended mind debate. I want to make a decision tree handout that takes students from their gut reactions to a couple of concrete cases to whichever position in the debate they actually hold, without them needing to know the jargon first.

  The tree should start with this question: "Otto has Alzheimer's and uses a notebook as his memory. Inga has normal biological memory. When they both 'remember' that the MoMA is on 53rd Street, is Otto's notebook-consulting the same kind of cognitive process as Inga's brain-recall, or just a useful tool that replaces a cognitive process?" From there, branch based on how they answer and on further cases/questions you design.

  Leaves I need: extended mind (Clark & Chalmers), embedded cognition (Rupert), organism-centered internalism (Adams & Aizawa), and at least one enactive or sensorimotor view. If there are logically possible combinations of answers that no one defends, mark them as unoccupied and say briefly why — is the position incoherent, just unpopular, or unexplored?

  The tree should have maybe 6-8 leaves total. Flag any pair of positions your tree genuinly can't pull apart with case-based questions.
