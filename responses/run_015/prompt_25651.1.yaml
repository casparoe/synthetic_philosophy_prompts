answer: |-
  # Seminar Handout: Where Does Your Mind End?
  ### A Decision Tree for the Extended Mind Debate

  **Instructions:** Follow the path that best matches your intuition about the cases below. You do not need to know the philosophical jargon yet; the terms will be explained at the end.

  ---

  ### START HERE: The Otto & Inga Case
  **Otto has Alzheimer's and uses a notebook as his memory. Inga has normal biological memory. When they both 'remember' that the MoMA is on 53rd Street, is Otto's notebook-consulting the same kind of cognitive process as Inga's brain-recall, or just a useful tool that replaces a cognitive process?**

  *   **A.** They are the **same kind of process**. The notebook is doing the job of memory. *(Go to Question 1)*
  *   **B.** They are **different**. The notebook is a tool that helps Otto, but the real memory is only in the brain. *(Go to Question 2)*

  ---

  ### QUESTION 1 (For Path A: "Same Process")
  **Imagine we could move Inga's biological memory into a notebook, or move Otto's notebook memory into a brain implant. If the function remains exactly the same, does the physical location (inside the skin vs. outside the skin) matter for whether it counts as part of the "mind"?**

  *   **A.** No. Location doesn't matter. If it walks like memory and talks like memory, it *is* memory, wherever it is. → **LEAF 1: Extended Mind**
  *   **B.** Yes. It only counts as part of the mind if it is inside the biological boundary (skin/skull), even if the outside tool does the exact same job. → **LEAF 2: Unoccupied (The "Magic Skin" View)**

  ---

  ### QUESTION 2 (For Path B: "Different/Tool")
  **If Otto loses his notebook, has he lost a part of his cognitive system (like losing a lobe of the brain), or has he just lost a helpful accessory (like losing a pair of glasses)?**

  *   **A.** Just an accessory. Otto's cognitive system remains intact inside his head; he just can't access information as easily. *(Go to Question 3)*
  *   **B.** A part of his system. You cannot understand Otto's mind without including the notebook; they are a coupled system. *(Go to Question 4)*

  ---

  ### QUESTION 3 (For Path 2A: "Accessory")
  **Why does the brain mark the boundary of the mind? Is it because of what the brain *does* (processes information intrinsically), or because of what the brain is *made of* (biological neurons)?**

  *   **A.** What it *does*. Cognition requires intrinsic, non-derived processes. Silicon could work if it did the same thing. → **LEAF 3: Organism-Centered Internalism**
  *   **B.** What it is *made of*. Cognition requires specific biological tissue. A silicon brain wouldn't truly "think." → **LEAF 4: Unoccupied (Bio-Chauvinism)**

  ---

  ### QUESTION 4 (For Path 2B: "Coupled System")
  **When Otto successfully navigates to MoMA using the notebook, is he retrieving an internal belief that is merely supported by the notebook, or is the "believing" happening in the active engagement with the notebook itself (with no internal map needed)?**

  *   **A.** He has an internal belief/map, but the notebook is essential scaffolding to access/use it. → **LEAF 5: Embedded Cognition**
  *   **B.** There is no internal map. The "memory" is the skill of navigating the environment. Cognition is action, not representation. → **LEAF 6: Enactivism / Sensorimotor View**

  ---

  ### QUESTION 5 (The "Twin Earth" Check)
  *(Ask this if you landed on Leaf 3 or Leaf 5)*
  **Separate from the notebook case: Do you believe the *content* of our thoughts (what they mean) is determined by our environment (e.g., Putnam's Twin Earth), even if the *processing* happens in the head?**

  *   **A.** Yes. Meaning is external, but processing is internal. → **LEAF 7: Content Externalism / Vehicle Internalism**
  *   **B.** No. Both meaning and processing are internal. → **Stay at Leaf 3 (Strict Internalism)**

  ---

  ### QUESTION 6 (The Parity Check)
  *(Ask this if you feel uncertain)*
  **Could you consistently hold that Otto's notebook is part of his mind, but Inga's brain is *not* part of her mind (perhaps her mind is her soul, or the environment)?**

  *   **A.** No, that makes no sense. They must be treated symmetrically. → **Return to previous answers.**
  *   **B.** Yes, I think Otto has an extended mind, but Inga's biology is just a tool for her non-physical mind (or vice versa). → **LEAF 8: Unoccupied (Asymmetric Ontology)**

  ---

  ## INSTRUCTOR KEY & POSITION MAP

  ### The Substantive Positions (Defended Views)

  1.  **Extended Mind (Clark & Chalmers):**
      *   *Core Claim:* Vehicles of cognition can extend beyond the skull. The notebook is constitutive of belief, not just causal.
      *   *Path:* 1A → 1A.
  2.  **Embedded Cognition (Rupert):**
      *   *Core Claim:* Cognition is deeply dependent on environmental scaffolding (coupling), but the cognitive system itself remains organism-centered. Avoids the "coupling-constitution fallacy."
      *   *Path:* 1B → 2B → 4A.
  3.  **Organism-Centered Internalism (Adams & Aizawa):**
      *   *Core Claim:* Cognition requires intrinsic, non-derived content. Tools are causal inputs, not constituents. The "Mark of the Cognitive" is internal.
      *   *Path:* 1B → 2A → 3A (→ 5B).
  4.  **Enactivism / Sensorimotor View (Noë, Hutto, etc.):**
      *   *Core Claim:* Cognition is not about manipulating internal representations. It is a skillful interaction with the world. The Otto/Inga framing (about "belief storage") is misleading.
      *   *Path:* 1B → 2B → 4B.
  5.  **Content Externalism / Vehicle Internalism (Putnam, Burge):**
      *   *Core Claim:* *What* we think depends on the world (Twin Earth), but *where* we think is in the head. Distinct from Clark's Vehicle Externalism.
      *   *Path:* 1B → 2A → 3A (→ 5A).

  ### The Unoccupied Leaves (Logically Possible but Undefended)

  6.  **Unoccupied: The "Magic Skin" View (Path 1B):**
      *   *Position:* Functionally identical processes count as "mind" if inside the skin, but "tool" if outside.
      *   *Why Unoccupied:* **Arbitrary/Incoherent.** Once you accept the Parity Principle (function determines status), drawing the line at the skin is biological prejudice. No serious philosopher defends this *after* accepting functional equivalence.
  7.  **Unoccupied: Bio-Chauvinism (Path 3B):**
      *   *Position:* Cognition requires carbon-based neurons specifically, not just functional organization.
      *   *Why Unoccupied:* **Unpopular.** Most internalists are functionalists (Adams & Aizawa argue for *intrinsicness*, not biology). If a silicon brain functioned identically, almost all internalists would grant it cognition.
  8.  **Unoccupied: Asymmetric Ontology (Path 6B):**
      *   *Position:* Otto's notebook is mind, but Inga's brain is tool (or vice versa).
      *   *Why Unoccupied:* **Incoherent.** Violates the principle of parity without justification. If the functional role is the same, the ontological status should be the same.

  ### ⚠️ Warning: Indistinguishable Positions

  **Embedded Cognition (Rupert) vs. Extended Mind (Clark & Chalmers)**
  *   **The Problem:** This tree may not reliably separate Leaf 1 (Extended) and Leaf 4 (Embedded) for all students.
  *   **Why:** Both positions agree on the *science*: Otto and the notebook are a tightly coupled system. They disagree on the *metaphysics*: Is the coupling *constitutive* (Extended) or merely *causal* (Embedded)?
  *   **Instructor Note:** Case-based intuitions often fail here because both sides agree Otto *needs* the notebook. The distinction relies on theoretical commitments (the Coupling-Constitution Fallacy) rather than gut reactions to cases. If a student lands on Embedded but argues like an Externalist (or vice versa), use this as a teaching moment about the difference between causal dependence and ontological constitution.

  **Content Externalism vs. Extended Mind**
  *   **The Problem:** Students often confuse Putnam/Burge (Meaning is external) with Clark/Chalmers (Processing is external).
  *   **Instructor Note:** Ensure Leaf 7 (Content Externalism) is distinguished from Leaf 1 (Extended Mind). A student can believe "MoMA" means what it does because of the environment (Putnam) while still believing the *memory retrieval* happens in the head (Internalism).
