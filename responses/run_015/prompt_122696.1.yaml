answer: |-
  **Stage 1: Candidate Principles**

  Five principles generate your package, two of which are rivals.

  1.  **All-Affected Interests (AAI):** Grounds #1 and #2. If significant interests create a claim, longitudinal stake justifies lowering the age, and residence should justify national voting.
  2.  **Constitutive Membership:** Grounds #3 (national) and #6. The demos defines itself via citizenship; inclusion is a trust granted by the collective, not a right derived from impact. This is a **rival** to AAI.
  3.  **Epistemic Democracy:** Grounds #4(b). Collective judgment improves with diverse participation.
  4.  **Anti-Domination:** Grounds #4(a) and #5. Franchise rules must not empower administrators to exclude based on class or race.
  5.  **Civic Duty:** Grounds #4 (compulsion) and #6 (office). Voting is a function of the state, not a personal asset.

  **Stage 2: Consistency Audit**

  **Ranked Tensions**

  1.  **Severe: #1/#2 vs. #3/#6 (AAI vs. Membership).**
      *   *Mechanics:* #1 states exclusions must be justified *to the excluded* based on their interests. #2 grants votes to 16-year-olds based on longitudinal stake (an interest). #3 denies votes to long-term residents despite similar stakes (taxes, laws, climate), citing citizenship. #6 reinforces this by denying excluded persons a rights-based complaint.
      *   *Conflict:* You cannot hold that stake generates a claim (#2) while denying that resident stake generates a claim (#3), unless you assert citizenship trumps interest. But #6 says the excluded have no complaint, whereas #1 demands justification *to them*. This renders #1 sloganistic rather than operative for residents.
      *   *Revision Cost:* To fix this, you must admit #3 is a pragmatic administrative boundary, not a principled denial of the resident's interest. This weakens #6's claim that the demos simply constitutes itself without external moral constraint.

  2.  **Moderate: #4(b) vs. #7 (Epistemic Quality vs. Universal Inclusion).**
      *   *Mechanics:* #4(b) justifies compulsion via better collective judgment (jury theorem). #7 includes those with advanced dementia. If epistemic quality is a primary ground for #4, #7 undermines it by introducing noise into the signal.
      *   *Revision Cost:* You must subordinate the epistemic justification (#4b) to the anti-domination justification (#4a). If compulsion is only about skew correction, #7 creates no tension. If it is about truth-tracking, #7 is a liability.

  3.  **Dissolving Tensions:**
      *   **#4 vs. #5:** Apparent tension (competence vs. no tests) dissolves if epistemic value comes from *diversity* (#4b) rather than *individual competence*. #5 protects diversity by preventing elite gatekeeping. These are mutually reinforcing.
      *   **#2 vs. Legal Consistency:** You explicitly reject uniform age of majority. This is orthogonal; you have stipulated that voting capacity is distinct from contractual capacity. No logical friction exists, only legal convention.

  **Single Revision and Defensibility**

  **Revision:** Abandon the strong claim in #6 that "someone excluded has no rights-based complaint." Replace it with: "Exclusions are presumptive violations of #1, permissible only where boundary enforcement is administratively unavoidable."

  **Why:** Currently, #6 acts as a shield that nullifies #1's moral requirement for justification. By softening #6, you acknowledge the resident's claim under #1 while maintaining #3 as a necessary compromise. This aligns #2 (stake matters) with #3 (stake matters, but citizenship is the proxy).

  **Cost:** You lose the clean theoretical closure of #6. You must defend #3 not as right, but as the "least bad" boundary, which is harder to argue but more honest.

  **Defensibility:** As written, the package sounds coherent in a hearing because #6 authoritatively shuts down the contradiction between #1 and #3. However, in print, a theorist will expose that #1 is violated by #3 unless #6 is treated as a trump card, which makes #1 contingent. With the revision, the package becomes defensible in print as a "pluralist compromise" rather than a "unitary theory." It survives as a coherent practical philosophy, acknowledging that boundary drawing inevitably violates strict AAI, rather than pretending it does not.
