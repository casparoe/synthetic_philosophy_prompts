answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Riverbend Metro Transit
  **FROM:** [Your Name], Board Member
  **DATE:** 24 May 2024
  **SUBJECT:** Procurement Recommendation: Automated Fare Collection Gates

  **Recommendation**

  I recommend that the Board approve the configurable hardware bid (Bid 3) only upon acceptance of strict contractual conditions regarding software governance, audit transparency, and fee structures. Specifically, we must hold the credentials to change enforcement modes, possess full visibility of the audit log, and eliminate per-change licensing fees. Should the vendor refuse these terms, I recommend we reject Bid 3 and proceed with the fixed half-height gates (Bid 1), accepting the revenue risk to prioritise accessibility and public trust.

  **The Politics of the Switch**

  We are accustomed to thinking of infrastructure politics in terms of concrete and steel. Langdon Winner's famous analysis of Long Island parkways suggested that physical design can settle distributive questions—low overpasses keeping public buses out—without a single vote. In that framing, the artifact itself possesses the politics. Our second bid, the full-height revolving gate, fits this model: it physically excludes bulky items and wheelchairs regardless of our intent. The hardware settles the question.

  Bid 3 claims to avoid this by offering "policy-neutral hardware." The gates are physically capable of leniency or strictness, determined by a software switch. A social-constructivist might argue this proves artifacts are indeterminate until embedded in practice; the metal is innocent until the mode is selected. However, this view ignores where the politics has migrated. By moving the decision from the physical installation to a remote software switch, the vendor has not removed the politics; they have moved it up a level into the licensing agreement.

  The politics now reside in the factory default, the cost of changing modes, and the secrecy of the audit log. Currently, the unit ships with "High" enforcement as the default. Our Operations Director notes that maintenance budgets rarely absorb extra licensing fees, meaning the default effectively becomes permanent. Thus, a distributive decision—who finds the transit system accessible versus who finds it fortified—is made not by this Board, but by a budget line item managed by operations staff trying to avoid surprise costs. This is not neutrality; it is governance by inertia.

  **Reversibility as Democratic Gain or Avoidance?**

  The pragmatist argument for Bid 3 is compelling: why pour concrete when we might change our minds? A reversible decision is ostensibly more democratic than a fixed one. If public sentiment shifts towards security, we tighten the gates; if it shifts towards access, we loosen them. This flexibility suggests a mature system adaptable to social needs.

  However, reversibility is only democratic if the mechanism of reversal is accessible. If changing the mode requires five days' notice, a fee drawn from a constrained budget, and vendor-mediated credentials, the option is illusory. It becomes a way of making a contested choice without voting on it. We can tell the public, "The gates aren't strict; you just haven't paid to loosen them." This outsources political authority to a private vendor. A design that makes its own politics chargeable is arguably more political than one that bakes it in, because it disguises the political choice as a technical maintenance issue. It confirms Winner's framing but extends it: artifacts have politics, but so do the contracts that govern their reconfiguration.

  **The Default Setting**

  A colleague asked if my position would change if the factory default were "Low" instead of "High". Honestly, no. While a "Low" default would favour accessibility initially, the structural issue remains the vendor's control over the switch. If the default were lenient, budget pressures might eventually force a tightening of security to prevent revenue leakage, mediated again by the vendor's fee structure. The core problem is not the position of the switch, but who holds the hand that flips it. Whether the inertia favours access or security, the Board surrenders sovereignty if we cannot view the audit log or change modes without penalty. We cannot accept a system where the record of our policy decisions is held by a third party.

  **Conditions and Fallback**

  To proceed with Bid 3, the vendor must agree to the following conditions:

  1.  **Credential Ownership:** Administrative credentials for mode changes must be held by Riverbend Metro Transit, not the vendor.
  2.  **Audit Transparency:** The audit log of mode changes must be visible to Board auditors in real-time, not restricted to vendor account holders.
  3.  **Fee Structure:** All licensing fees for mode changes must be waived. Policy adjustments are a governance right, not a billable service.
  4.  **Default Setting:** Units must be shipped and installed with "Medium" or "Low" enforcement as the factory default.

  Our counsel advises that the vendor is likely to dig in on the audit log and fee structure. Therefore, this memo includes a fallback instruction: if the vendor refuses to grant full audit visibility and waive change fees, we must walk away. In that scenario, we should procure the fixed half-height gates. While this carries revenue risk, it preserves our accessibility obligations and keeps policy decisions within the public sphere, rather than hiding them behind a software license.

  **Conclusion**

  We are not merely buying gates; we are buying a governance structure. A switch that costs money to flip is not a feature; it is a barrier to democratic oversight. We should accept flexibility only when it is truly ours to exercise.

  **[End of Memo]**
