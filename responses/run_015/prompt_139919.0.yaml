  ### 1. Candidate Rules and Principles

  Based on verdicts 1–7, two principles fit the data jointly but diverge on the prosthesis case. Both account for the insufficiency of behavioral coordination (Case 3) and the sufficiency of biological commissures (Cases 5, 6), but they disagree on *why* the biological commissures work and whether the prosthesis replicates that function.

  **Rule A: The Phenomenal Integration Principle**
  *   **Statement:** A single subject of experience exists if and only if there is a bidirectional, subpersonal channel that integrates *phenomenal content* (qualia, affective tone, or perceptual detail) between neural masses. Behavioral unity or the synchronization of abstract goal-states is insufficient (per Case 4). Artificial links can substitute for biological ones only if they transmit *experience* (per Case 7's requirement for "perceptual detail"), not merely data about states.
  *   **Application to Case 6:** Verdict is "One" because the anterior commissure and subcortical routes, though "coarse," transmit *affective information* that is inherently phenomenal (arousal/valence is felt). The biological substrate guarantees that the signal carries phenomenology.
  *   **Application to Prosthesis:** The device transmits compressed *vectors* (data) regarding goals and valence, but explicitly "no transfer of the experience itself." Under Rule A, this is a sophisticated form of Case 3 (environmental cuing) rather than Case 7 (fusion).
  *   **Prediction:** **Two Subjects.** (One agent, two experiencers).

  **Rule B: The Subpersonal Causal Unification Principle**
  *   **Statement:** A single subject of experience exists if and only if the relevant neural masses are causally coupled such that they cannot sustain independent *teleological trajectories* (wills/intentions) via a subpersonal, non-gateable mechanism. The *content* of the transfer (perceptual vs. conative) is secondary to the *causal structure* (bidirectional, involuntary, non-switchable).
