  *   **Application to Case 4:** Verdict is "Two" because, despite the lack of behavioral conflict, the right hemisphere retains the *capacity* for independent trajectory (it is not causally locked to the left), evidenced by its potential for affective divergence.
  *   **Application to Prosthesis:** The device locks the hemispheres into a single goal-state and arousal level every 100–200ms involuntarily. It eliminates the possibility of divergent wills.
  *   **Prediction:** **One Subject.** (The synchronization of agency constitutes the subject).

