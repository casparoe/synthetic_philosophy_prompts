  **Diachronic Identity (The Switch Problem):**
  If V. verdicts "Two" (Device Off) and "One" (Device On), she is committed to **subjects coming into and going out of existence** (or fission/fusion) on a timescale of seconds.
  *   **Does she owe an account?** Yes. Case 2 (callosotomy) already commits her to **Fission** (one subject becomes two). Case 7 commits her to **Fusion** (two subjects become one).
  *   **Constraint:** She cannot say the subjects *die* when the device turns off, because Case 2 implies the original subject *divides* rather than ceases. She must view the "One Subject" state as a *fusion* of two underlying subjects that persist latently.
  *   **Chapter Concession:** You must concede that on V.'s view, **numerical identity of subjects is not transitive over time** in the standard way. Subject A (Device On) is identical to Subject B (Left, Device Off) + Subject C (Right, Device Off).
  *   **Strategic Advice:** If your argument requires stable subject identity over time, V.'s view is hostile to it. She treats subjects as **phase-sortals** dependent on the integration state of the brain. If you need a stable subject, you cannot use V.'s framework for this case. You would need to reorganize around a case where the integration is permanent (like Case 6) or argue that the *potential* for fission doesn't negate identity (which she denies in Case 2).

