      *   **Dr. Okonkwo (Phenomenal Realist/Blockian):** Likely argues that P-consciousness is distinct from A-consciousness. A state can feel like something (P) without being available for report/reasoning (A). The fragmented workspace scenario is perfect for this: visual modules have phenomenology (what it's like to see red) even if that info doesn't reach the language/executive module for report. Okonkwo needs to press Chen on whether local broadcasting *constitutes* consciousness or just enables access to it.

  3.  **Drafting - Section by Section:**

