      *   *Move 1 (Chen):* Argues that local broadcasting *is* a form of access consciousness, just limited. If it's available to motor guidance within the visual module, it's access-conscious relative to that module.
      *   *Move 2 (Okonkwo):* Challenges this. If it's access-conscious within the module, does it have phenomenology? If Chen says yes, then P and A are co-extensive locally. If Chen says no, then what is the broadcasting doing? Okonkwo wants to maintain that P can exist without even local access (or that local access isn't sufficient for the *kind* of consciousness we care about). Actually, the prompt says Okonkwo defends phenomenal realism. So Okonkwo should argue that the visual module *has* phenomenology even if it lacks system-wide access.
