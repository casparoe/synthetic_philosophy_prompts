prompt: |-
  I write novels, and I've agreed to run a nintey-minute evening session at the writers' centre next month. About a dozen people, mostly novelists plus two poets, nobody with any philosophy, and at least two of them will arrive believing that theory is a machine for spoiling stories. The session is nominally about writing from the inside of an experience you haven't had, and I want the Mary case to be its spine: the neuroscientist who has spent her whole life in a black-and-white room, knows every physical fact about colour vision there is to know, and then walks out and sees a red tomato for the first time. My group already half-knows this one and half-misuses it, which is why I'd rather build on it than on something new.

  So please don't explain the argument to me. Plan how I should explain it to them.

  What I need:

  The order the pieces have to go in, and what depends on what. I don't want a list of points that could be shuffled; I want to know which thing has to be in place before the next thing is even intelligible, and which bit will collapse the session if I put it too early.

  The one carrying example, and what it has to have and what it has to lack. My instinct is that it should not be a character from my own work in progress, but tell me if I'm being precious about that.

  My worry about completeness. If Mary doesn't know which physical state she's in when the tomato shows up, her surprise looks like she merely learned a boring fact, and then nothing is threatened. Where does that have to go in the sequence, and can it be done in fifteen minutes for people who have never met the word indexical? If it can't, tell me what to sacrifice.

  The emotion swap. Someone will say within the first ten minutes that it's just like writing grief before you've lost anyone. My instinct is that grief is not like red, because having grief seems to require a pile of beliefs and a history, and that this difference quietly makes the case weaker rather than stronger, so I should hold the swap back rather than lean on it. Tell me whether that instinct is wrong, and if it is, what the right thing to do with the swap is.

  Misconceptions, in the order they'll actually form. The ones I expect: that the case simply refutes physicalism; that it shows a machine could never be conscious; that its moral is that we can't imagine other people's experience; that Mary's surprise is just a broken expectation and therefore proves nothing. Correct any of those I've got wrong, tell me the order they'll arrive in, and say where in the session to head each off — I'd much rather defuse them at the moment they form than deal with them in a summary at the end.

  Where I say out loud that the philosophers don't agree, without it feeling like a cop-out. This group will want a verdict and I don't have one.

  One question to put to the room at the end that would show they'd got the argument rather than just absorbed its atmosphere, and a different one that would show they'd got something usable for their own manuscripts.

  And tell me plainly what to refuse to get into at this level. I'm guessing the zombie thing, representationalism, and the phenomenal-concept business, but I want to know which one I'll be most tempted by, why it will eat the hour and a half, and what I should say instead when someone asks me about it.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist running a 90-minute evening session at a writers' centre.
      *   **Audience:** ~12 people (mostly novelists, 2 poets), no philosophers. At least 2 are hostile to "theory" (see it as story-spoiling). They half-know/half-misuse the Mary's Room thought experiment.
      *   **Topic:** Writing from the inside of an experience you haven't had (using Mary's Room as the spine).
      *   **Constraints:** Do *not* explain the argument to the user (they know it). Plan *how* to explain it to the group.
      *   **Specific Needs:**
          1.  Sequential order of pieces (dependencies).
          2.  The carrying example (criteria, own work vs. other).
          3.  Completeness worry (physical state/indexicals) - timing and feasibility.
          4.  Emotion swap (grief vs. red) - validate/correct instinct.
          5.  Misconceptions (order of arrival, where to defuse).
          6.  Philosophical disagreement (how to admit it without cop-out).
          7.  Two ending questions (understanding vs. utility).
          8.  What to refuse (zombies, representationalism, phenomenal concepts).

  2.  **Deconstruct the Challenge:**
      *   **Goal:** Bridge the gap between a dense philosophical thought experiment (Qualia/Physicalism) and practical fiction writing (Empathy/Imagination).
      *   **Tone:** Respectful of the craft, pragmatic, avoiding academic jargon ("indexical," "physicalism" need care), acknowledging the skeptics.
      *   **Time:** 90 minutes is tight for this depth. Pacing is crucial.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Sequence & Dependencies:**
          *   *Problem:* If I start with "Mary knows all physical facts," they glaze over. If I start with "Writing is hard," it's too generic.
          *   *Solution:* Start with the *writing problem*, introduce Mary as the *analogy*, then reveal the *implication*.
          *   *Critical Path:* Must establish what Mary *knows* before establishing what she *learns*. Must establish the *gap* before discussing *how to bridge it*.
          *   *Collapse Point:* Defining "physical fact" too early kills the mood. Defining it too late makes the surprise unintelligible.

      *   **2. The Carrying Example:**
          *   *User's Instinct:* Not their own WIP.
          *   *My Advice:* Agree. WIP is too vulnerable/defensive. Needs to be universal enough for 12 people to grasp instantly.
          *   *Criteria:* Sensory, immediate, specific. Not "war" (too broad), but "the smell of a specific trench."
          *   *Lack:* It must lack *interpretation*. Just the raw data vs. the felt experience.

      *   **3. Completeness Worry (Physical State/Indexicals):**
          *   *The Issue:* If Mary doesn't know *which* state she's in, is it just new propositional knowledge?
          *   *Feasibility:* 15 mins for "indexicals" with non-philosophers? No. Too much friction.
          *   *Sacrifice:* Sacrifice the technical defense of *why* it's not physical knowledge. Focus on the *phenomenological gap* (the "what it's like").
          *   *Placement:* Middle, but keep it intuitive. "She knows the wavelength, but not the *seeing*."

      *   **4. Emotion Swap (Grief vs. Red):**
          *   *User's Instinct:* Grief requires beliefs/history, Red doesn't. Hold back.
          *   *My Advice:* Instinct is *right*, but the swap is too useful to discard. The risk is conflating *qualia* with *context*.
          *   *Strategy:* Use it, but *qualify* it immediately. Distinguish "sensation" (Red) from "complex state" (Grief). Use it to show the *limit* of the analogy, which is actually helpful for writers (you can't write grief from scratch, but you can write the sensory anchor).
          *   *Timing:* After Mary is established, before the writing exercise.

      *   **5. Misconceptions (Order & Defusal):**
          *   *Order:*
              1.  "It refutes physicalism/science." (The Philosophers' Take)
              2.  "It's just broken expectations." (The Skeptic's Take)
              3.  "We can't imagine others." (The Fatalist's Take)
              4.  "Machines can't be conscious." (The Sci-Fi Take)
          *   *Defusal:*
              1.  Reframe: It's not about physics, it's about *description*.
              2.  Reframe: It's not expectation, it's *mode of access*.
              3.  Reframe: It's not impossibility, it's *work*.
              4.  Ignore/Defer unless relevant to AI characters.

      *   **6. Philosophical Disagreement:**
          *   *Strategy:* Don't say "Philosophers argue." Say "Writers argue." Frame it as a tool, not a truth. "Is this a bug or a feature?"
          *   *Placement:* Near the end, before the questions.

      *   **7. Ending Questions:**
          *   *Understanding:* Needs to test the Mary distinction. "What did Mary gain that wasn't in her library?"
          *   *Utility:* Needs to apply to the desk. "What is the 'red' in your current chapter that you are describing from the outside?"

      *   **8. What to Refuse:**
          *   *Temptation:* Phenomenal Concepts. It sounds like "writing techniques."
          *   *Reason:* It turns into semantics.
          *   *Substitute:* "The difference between the map and the territory."
          *   *Zombies:* Too sci-fi.
          *   *Representationalism:* Too technical.

  4.  **Refining and Polishing:**
      *   *Voice:* Needs to be peer-to-peer, authoritative but not academic.
      *   *Structure:* Follow the user's requested headers exactly.
      *   *Check:* Did I answer the "completeness" worry honestly? Yes, admit 15 mins isn't enough for indexicals, pivot to "what it's like."
      *   *Check:* Did I address the "theory spoils stories" hostility? Yes, by framing Mary as a *writer's problem* first.

  5.  **Final Review against Constraints:**
      *   90 minutes? Yes, the pacing reflects this.
      *   No explaining the argument to the user? Yes.
      *   Specific order dependencies? Yes.
      *   Specific advice on the "Grief" swap? Yes.

  6.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't accidentally explain Mary's Room to the user in the intro. Keep it focused on *pedagogy*.
      *   *Emphasis:* Highlight the "Collapse Point" clearly.
      *   *Tone Check:* Ensure I validate their hostility to theory. Theory *does* spoil stories if handled badly. Acknowledge that.

  7.  **Final Polish:** (Reviewing the "Completeness" section again). The user is worried that if Mary doesn't know her physical state, the argument fails. I need to tell them that for *writers*, the argument doesn't need to hold up to Daniel Dennett, it needs to hold up to a novelist's intuition. So, sacrifice the technical completeness for the artistic truth. This is the crucial pivot.

  8.  (Final check of the "Grief" section). The user thinks grief requires beliefs. They are right. But writers *use* grief analogies. I need to tell them how to use that without breaking the Mary logic. Use grief as the *target*, Red as the *mechanism*.

  9.  (Final check of "What to Refuse"). Phenomenal Concepts is the biggest trap because it sounds like "Narrative Voice." I must warn against this specifically.

  10. **Ready to write.**
answer: |-
  Here is the plan for your ninety minutes. It is designed to protect the argument from the skeptics while keeping the utility high for the practitioners.

  ### 1. The Sequence (Dependencies and Collapse Points)

  You cannot teach this linearly like a lecture. You must teach it like a reveal. If you define the terms too early, the theorists in the room (the hostile ones) will dissect the definitions before the point lands. If you define them too late, the pragmatists will dismiss it as vagueness.

  **The Order:**
  1.  **The Writer's Problem (0–10 mins):** Start with the craft issue, not the philosophy. "How do we write pain we haven't felt?" Establish that "research" (facts) feels different from "rendering" (experience).
  2.  **The Setup of Mary (10–25 mins):** Introduce Mary *only* as a metaphor for the Writer. She is the Researcher. She has all the books. She has never left the room.
      *   *Dependency:* You must establish the **completeness of her knowledge** before you establish her **surprise**. If they doubt she knows *everything* physical, the rest collapses.
  3.  **The Release (25–35 mins):** She sees the tomato. She says, "Now I know."
      *   *Collapse Point:* Do not let anyone interrupt here to ask *what* she knows. You must hold the tension of the gap. If you let them define the knowledge too early, it becomes trivial ("She learned the word 'red'").
  4.  **The Gap Analysis (35–50 mins):** Now you ask: "If she had all the data, what was missing?" This is where you introduce the distinction between *knowing that* (propositional) and *knowing how/what it is like* (experiential).
  5.  **The Application (50–75 mins):** Move to the writing. How do we bridge this gap for a reader?
  6.  **The Limits & Verdict (75–90 mins):** Address the misconceptions and the philosophical disagreement.

  **What depends on what:**
  *   You cannot discuss the "physical state" worry (your completeness worry) until *after* they feel the weight of her surprise. If you bring up physical states too early, you trigger the "theory spoils stories" defense mechanism.
  *   You cannot introduce the "Grief Swap" until the "Red Tomato" is fully secured. Red is the control; Grief is the variable.

  ### 2. The Carrying Example

  **Your instinct is correct:** Do not use a character from your work in progress.
  *   **Why:** If you use your WIP, the feedback becomes about *your book* ("I wouldn't read that," "That character feels flat"), which derails the session into a workshop critique. You need a neutral ground where the only variable is the *method of access*.
  *   **What it must have:** It must be **sensory and immediate**. A specific smell, a specific pain, a specific light. It needs to be something that can be described physically (wavelengths, chemical compounds) but felt only subjectively.
  *   **What it must lack:** It must lack **narrative consequence**. Do not use "seeing the murderer's face." Use "seeing the colour of the murderer's coat." If there is plot stakes, they will focus on the plot, not the qualia.
  *   **Recommendation:** Stick with the Tomato, or swap for **The Sound of a Cello**. Everyone knows what a cello sounds like, but describing the *vibration in the chest* versus the *frequency in Hertz* is the Mary gap. Actually, keep the Tomato. It's the standard for a reason; it reduces cognitive load so they can focus on the argument.

  ### 3. The Completeness Worry (Physical States & Indexicals)

  **The Hard Truth:** You cannot do the technical defense of the "physical state/indexical" problem in fifteen minutes for this group. If you try to explain that Mary might not know *which* physical state she is in, you will lose the novelists. They will hear "semantics" and tune out.

  **Where it goes:**
  It goes in the **Gap Analysis (35–50 mins)**, but you must simplify it ruthlessly.
  *   **The Sacrifice:** Sacrifice the *metaphysical* truth for the *phenomenological* truth. You don't need to prove physicalism is false. You only need to prove that **information transfer is not experience transfer.**
  *   **The Fix:** Don't use the word "indexical." Use the phrase **"Position."**
      *   *Script:* "Mary knows everything about the brain state of seeing red. But she doesn't know what it's like to *occupy* that brain state. She has the map, but she isn't standing on the territory."
  *   **Why this works:** It bypasses the philosophical objection (that she just learned a self-locating fact) and hits the writer's nerve (the difference between describing a thing and inhabiting it). If a philosopher in the room objects, concede the point: "Even if it's just a new perspective on old facts, for the writer, that perspective is the whole job."

  ### 4. The Emotion Swap (Grief vs. Red)

  **Your instinct is right, but your conclusion is wrong.**
  *   **The Instinct:** You are correct that Grief is not like Red. Grief is cognitive, historical, and belief-laden. Red is raw qualia.
  *   **The Correction:** Do not hold it back. **Use the difference.**
  *   **Why:** If you tell them "Writing Grief is exactly like Mary seeing Red," the skeptics will eat you alive. They know grief is complex.
  *   **The Move:** Use the swap to show the **limit of the analogy**, which validates their intuition while keeping the tool.
      *   *Timing:* Introduce this at **50 mins (The Application)**.
      *   *The Pitch:* "Mary is the easy version. She just needs a retina. You are the hard version. You need to write grief without the history. Mary teaches us that facts aren't feelings. But grief teaches us that feelings aren't just facts either. Mary gives you the permission to admit you can't know it fully. Grief gives you the job of faking the history."
      *   **Result:** This disarms the skeptics. You are agreeing that theory doesn't solve everything. It makes you an ally, not a lecturer.

  ### 5. Misconceptions (Order of Arrival and Defusal)

  They will arrive in this order. You must head them off *as they form*, not at the end.

  1.  **"This proves science can't explain consciousness." (15 mins)**
      *   *Who:* The hostile theorist.
      *   *Defusal:* "We aren't doing neuroscience tonight. We are doing narrative transport. Whether Mary proves physicalism false doesn't change the fact that she still had to walk out of the room to write the poem."
  2.  **"She just learned a boring fact / It's just broken expectations." (35 mins)**
      *   *Who:* The pragmatist.
      *   *Defusal:* This is the biggest threat. Defuse it immediately during the Gap Analysis. "If it were just a fact, she could have read it in the book. The fact that she couldn't means it's not a fact in the way we usually mean. It's a capacity."
  3.  **"So we can never truly imagine others." (60 mins)**
      *   *Who:* The fatalist / anxious writer.
      *   *Defusal:* "Mary doesn't say we *can't*. It says we can't do it by *researching*. We do it by *simulating*. The argument isn't a stop sign; it's a warning against relying on library cards."
  4.  **"Machines could never be Mary." (75 mins)**
      *   *Who:* The sci-fi writer.
      *   *Defusal:* Defer. "That's a different room. Tonight we are writing for humans who have bodies."

  ### 6. The Philosophical Disagreement (Without Cop-Out)

  Do not say "Philosophers disagree." That sounds like "Nobody knows, so why listen to me?"
  **Say this instead:** "Writers disagree."

  *   **Placement:** 75 mins.
  *   **The Script:** "Some writers think Mary's problem is solved by better metaphors. Some think it's solved by deeper research. Some think it's unsolvable. I'm not asking you to solve the philosophy. I'm asking you: When you write, are you handing the reader a textbook description of the tomato, or are you trying to make their retina fire? Mary says those are different jobs."
  *   **Why:** This moves the verdict from "Is this true about the universe?" (which you can't answer) to "Is this useful for the draft?" (which they can answer).

  ### 7. The Two Ending Questions

  **Question 1 (To show they got the argument):**
  "Mary walks out of the room and sees the tomato. She writes a letter to her colleagues inside the room describing it. Can she convey what she saw in that letter?"
  *   *Correct Answer:* No (or "Not fully"). If they say "Yes, if she's good enough," they missed the point. The point is the *medium* of the letter (facts) cannot carry the *medium* of the experience (qualia).

  **Question 2 (To show they got the utility):**
  "Look at your current manuscript. Where are you describing a 'red tomato' (something you know the facts of) when the character needs to be eating it (something they know the taste of)?"
  *   *Correct Answer:* They should identify a passage where they are explaining an emotion or sensation from the outside rather than rendering the sensory impact from the inside.

  ### 8. What to Refuse (The Time Eaters)

  You are right to guess Zombies, Representationalism, and Phenomenal Concepts.
  **The one you will be most tempted by:** **Phenomenal Concepts.**
  *   **Why:** It sounds like "Writing Techniques." It sounds like you can teach them how to build the concept.
  *   **Why it will eat the hour:** It turns into a semantic debate about whether the *concept* of red is different from the *experience* of red. You will spend 40 minutes defining "concept."
  *   **What to say instead:** "The Map vs. The Territory."
      *   When someone asks about the conceptual framework, say: "We aren't analyzing the map. We are trying to get the reader to walk the land. Whether the map is accurate doesn't help them feel the mud."

  **The Zombie Thing:**
  *   **Refusal:** "If we start talking about philosophical zombies, we are writing science fiction, not novels about human experience. Let's keep the stakes human."

  **Representationalism:**
  *   **Refusal:** "That asks whether the red is in the tomato or the eye. For the writer, the red is on the page. Let's stay on the page."

  **Summary of the Strategy:**
  You are not teaching them Philosophy of Mind. You are using Philosophy of Mind as a **lever** to pry open their drafting habits. If the lever bends (philosophical objections), do not try to straighten the lever. Just push harder on the habit. The validity of the session rests on whether they leave with a pen in their hand, not a thesis in their head.
