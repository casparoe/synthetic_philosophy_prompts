      *Wait, one nuance on (1):* Some deprivationists accept the Existence Requirement but argue death is bad *atemporally* or that the harm is located at times when the person *does* exist (as a property of their life). But (6) explicitly talks about events *after* death being bad. That breaks the "harm located when subject exists" workaround. I will press this hard.

      *Wait, nuance on (5):* The user stipulates the 22yo would die at 24. So the loss is 2 years. The 92yo would die at 110. Loss is 18 years. If welfare is hedonic (3), 18 years of pleasure > 2 years of pleasure. So (4) + (3) + (5) is inconsistent. (5) violates the math of (3) + (4).

