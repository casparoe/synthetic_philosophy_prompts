prompt: |-
  I'm trying to get a handle on pure time preference, and a blog post i read summarized the debate like this: 'Pure time preference is the idea that, all else equal, an outcome is less valuable just because it is later. The standard formalization is exponential discounting, and it is the only discounting scheme that is time-consistent. Hyperbolic discounting, where the effective discount rate is higher for short delays, is therefore not a different rational attitude toward time but a self-control problem: if you prefer $110 in two months to $100 in one month, but later prefer $100 now to $110 in a month, your preferences are incoherent. Once you commit to a constant discount factor, the only remaining question is what the right discount rate is, since any other choice just smuggles in a self-control bias.' I keep feeling like the 'only' and 'incoherent' parts are doing too much work, and I don't know if the uniqueness claim is supposed to hold for any discounting function or only under extra assumptions like stationarity. Go sentence by sentence and tell me what an economist or decision theorist would accept, what is a common simplification, and what is actually wrong -- and whether the later claim that commitment to a constant factor solves the problem follows from the accurate parts. Also separate what is settled from what is genuinely contested among people who work on this, and don't present a contested view as the consensus.
