answer: |-
  I wait to name the angle of the **cube**,
  Or trace the promise of the rounded **sphere**.
  I know the weight of both within my **hand**,
  Yet nothing presses on the waking **eye**.
  There is no resistance here, no ghost of **touch**,
  Only the sudden violence of **light**.

  The world is not a warmth but pure **light**,
  A flat assault upon the outline of the **cube**.
  I reach to verify the old **touch**,
  But air stands between me and the **sphere**.
  My fingers twitch, betrayed by the **eye**,
  Nothing arrives to fill the waiting **hand**.

  I clench the empty air inside my **hand**,
  Trying to catch the texture of the **light**.
  The organ opens but the **eye** is dull,
  Where is the edge that defines the **cube**?
  The roundness promised by the name **sphere**
  Is not the curve I know by bone and **touch**.

  There is no friction here, no rough **touch**,
  Just colors bleeding on the passive **hand**.
  Is that the round one? Is that the **sphere**?
  Or just a patch of yellow in the **light**?
  I cannot map the volume of the **cube**
  Onto this surface painted for the **eye**.

  The surgeon points to something for the **eye**,
  A third thing cast without a name or **touch**.
  It has no history like the **cube**,
  No memory stored within the nervous **hand**.
  It sits alone within the flooding **light**,
  More strange to me than that first **sphere**.

  I cannot name this yellow patch a **sphere**,
  Nor grant the sharp one to the waiting **eye**.
  The third thing drinks the shadow and the **light**,
  Defying every habit of the **touch**.
  It slips the grip of memory and **hand**,
  Unknowable, unlike the trusted **cube**.

  My **hand** remembers what denies my **touch**,
  My **eye** drowns in the surplus of the **light**,
  And silence holds the **cube** and **sphere**.
