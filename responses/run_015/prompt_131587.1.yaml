      *   **Constraints:** No citations/page numbers/reading lists in the output.

  2.  **Deconstruct the Theoretical Core (GEB Style):**
      *   *Frame Message:* Tells you *how* to read (e.g., "This is a letter," "Read left to right," "Ignore the red text").
      *   *Outer Message:* The content revealed by applying the frame (e.g., the actual text of the letter).
      *   *Inner Message:* The meaning revealed only after analyzing the outer message (e.g., an acrostic, a hidden code within the text).
      *   *The "Leak":* A signifier that could be part of the Frame (instruction) or the Outer/Inner (content). This creates the "instability of meaning."

  3.  **Drafting the Activity Concept:**
      *   *Name:* "The Protocol of Sealed Chambers" (sounds suitably bureaucratic and mysterious).
      *   *Setup:* 2 Groups of 5 students (or 3 groups of 3-4, but 10 students fits 2 groups of 5 well for competition/observation). Let's go with 2 Groups of 5 to maximize the "watching others" dynamic.
      *   *Materials:* Envelopes, cards, specific pens, maybe a box.
      *   *The "Leak":* A specific visual cue. Let's use *border thickness* or *ink color* on the instruction card. Let's choose **Ink Color (Red vs. Black)** on the initial instruction card.
