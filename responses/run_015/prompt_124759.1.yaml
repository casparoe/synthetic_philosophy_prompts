      *(Refining the Prior-Sign)*: In a Frankfurt case, the controller intervenes *only if* the agent chooses wrongly. In Ludovico, the intervention is *constant* relative to the stimulus. It's a disposition change, not a situational intervention. This is a crucial distinction. It makes it a case of *manipulation*, which is the standard counter-response to Frankfurt (the "Flicker of Freedom" or "Sourcehood" objection).

