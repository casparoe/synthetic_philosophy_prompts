      *   **The Nature of Understanding (Extended, Eroded, or Transformed?):**
          *   *Not just Extended:* Because you don't own the logic.
          *   *Not just Eroded:* Because you ship more.
          *   *Proposed Term:* **Distributed Agency** or **Orchestrated Understanding**. You understand the *interface* and the *intent*, but not necessarily the *implementation details*.
          *   *Risk:* The "Illusion of Competence."
      *   **The Deprecation/Swap Problem (Cognitive Amputation):**
          *   If the model changes, your "cognitive style" changes.
