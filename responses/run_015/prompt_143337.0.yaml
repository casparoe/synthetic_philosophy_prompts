answer: |-
  To analyze these episodes, we must define our terms. The **inside view** focuses on the specific details of the case at hand: the apparatus, the data, the mechanism proposed. The **outside view** ignores specifics in favor of statistics from a reference class, adjacent theories, or procedural signals. Epistemic modesty recommends deferring to the outside view when the two conflict.

  **Deconstructing the Outside View**

  Your suspicion holds: base-rate reasoning did little work in distinguishing these cases ex-ante. As of March 1989, the reference class for Episode A was "extraordinary claims of novel energy sources." As of 1984, the reference class for Episode B was "reports of gastric bacteria dismissed as contamination." In both periods, the base rate of such claims turning out to be true was vanishingly small. If an agent in 1984 had relied solely on the base rate of "overturned medical orthodoxies," they would have rejected *H. pylori* just as firmly as the 1989 agent rejected cold fusion. Base rates alone cannot explain the divergence in reception.

  Deference to adjacent theory carries more weight, but requires date-stamping. In March 1989, the information set for a physical chemist included well-confirmed nuclear physics: the Coulomb barrier and the branching ratios of deuterium fusion. The claim violated conservation laws and cross-section data established decades prior. The outside view here was a hard constraint from a high-certainty adjacent field. In 1984, the information set for a gastroenterologist included the doctrine that the stomach is sterile due to acidity. However, this was a biological generalization, not a physical law. Microbiologists knew staining techniques varied. The theoretical barrier in Episode B was lower than in Episode A, but not negligible. Theory explains some of the skepticism in B, but not the eventual acceptance.

  The decisive ingredient was signal-reading. In Episode A (March 1989), the procedure was a press conference prior to peer review, with withheld details. In the register of scientific communication, this signals low confidence in the data's ability to withstand scrutiny and high priority on patenting or fame. In Episode B (1982–1985), the procedure was standard publication followed by Marshall's self-experimentation (1985). While the self-experiment was n=1, it signaled high personal commitment and transparency. The community in 1989 read the press conference as a signal of fraud or error; the community in 1985 read the self-experiment as a signal of conviction. This component of the outside view explains the reception better than base rates or theory.

  **Agents and Registers**

  The inside/outside distinction fractures when we name the agent. For the **individual researcher**, the decision is whether to investigate. In 1989, an electrochemist taking the outside view (base rate + theory) should not have believed the claim, but might still have investigated to rule it out, given the low cost of a failed replication. In 1984, a gastroenterologist taking the outside view should have been skeptical but investigated given the clinical stakes.

  For the **funder**, the decision is resource allocation. Here the registers diverged wildly. In 1989, the Utah State Legislature (a political agent) ignored the scientific outside view and funded the National Cold Fusion Institute based on the inside view of economic promise. The scientific community (a collective agent) largely defunded the field by late 1989. For *H. pylori*, the NIH was slow to fund, adhering to the outside view of the "sterile stomach," while individual clinicians began testing antibiotics off-label.

  Epistemic modesty does not prescribe the same action across registers. For the community of believers, modesty demands skepticism (outside view). For the community of investigators, modesty demands acknowledging that base rates are updated only by investigation. The Utah Legislature failed epistemic modesty by ignoring the scientific outside view; the DOE panel succeeded by applying it.

  **Three Difficulties**

  (a) **The Retrospective Reference Class:** You note that the class of "failed revolutionary claims" is contaminated by outcome. If we repair this by using an outcome-independent class, such as "claims announced by press conference without peer review," the base rate of truth is indeed near zero. This repair condemns Episode A but spares Episode B, which followed standard publication protocols. Had Pons and Fleischmann published first, the reference class would have been "peer-reviewed anomalies," which has a higher survival rate. The repair changes the verdict: the procedural signal, not the claim content, was the primary predictor of failure.

  (b) **The Ratchet:** If the outside view governs pursuit, no one investigates low-probability claims, and base rates never update. This is a reductio if the outside view is applied to *exploration*. It is not a reductio if applied to *belief*. One can hold a low prior (outside view) while assigning a high value to information (inside view). The norm should be: take the outside view for confidence levels, but take the inside view for deciding whether the cost of evidence-gathering is justified. In 1989, the cost of replication was low; the outside view justified skepticism, but not necessarily a total ban on inquiry, though the DOE correctly stopped *major* funding.

  (c) **The Distributed Agent:** In a community, it is optimal for most to take the outside view (maintaining stability) while a few take the inside view (exploring outliers). Epistemic modesty for the solitary agent requires deference. For the distributed agent, modesty requires knowing one's role. If you are a tenured professor with resources, modesty might mean investigating the outlier to update the community's base rate. If you are a graduate student, modesty means not betting your career on it. The theory of rational choice handles this via expected value: the community maximizes utility by diversifying risk. The standard inside/outside framework, focused on a single mind, lacks the vocabulary for this division of cognitive labor.

  **Silence**

  The framework is silent on incentive structures. It cannot explain why Pons and Fleischmann chose the press conference; that requires a model of patent law and priority pressure, not epistemology. It is also silent on cost asymmetry. The cost of a false positive in cold fusion was wasted grant money. The cost of a false negative in ulcers was continued patient suffering. The inside/outside view treats errors symmetrically regarding truth, but not regarding value. Finally, it does not explain the speed of reversal. *H. pylori* took a decade; cold fusion took months. This difference lies in the availability of a cheap test (antibiotics vs. calorimetry/nuclear detection), a practical constraint the epistemic framework ignores.

  **Verdict**

  This pair shows that the outside view and its associated modesty are valid only for **belief formation**, not for **resource allocation** or **exploration policy**. Base rates are too blunt to distinguish true from false revolutions; procedural signals are the operative mechanism.

  Regarding error preference: For the community as a whole, the preferred error depends on the scoring metric. If scoring on **accuracy of beliefs**, the community should prefer False Negatives (rejecting cold fusion). It is better to be skeptical and occasionally miss a truth than to be gullible and pollute the literature. However, if scoring on **allocation of effort and human welfare**, the community should prefer False Positives (pursuing ulcers). The cost of ignoring a true medical breakthrough vastly exceeds the cost of investigating a false energy claim. The outside view protects the integrity of the belief stock; the inside view, cautiously applied by a distributed minority, protects the vitality of discovery. Epistemic modesty should not prevent the few from checking what the many dismiss, provided the cost of the check is borne by the willing, not the public.
