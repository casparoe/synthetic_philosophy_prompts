  ### The Coherent Principle

  Yes, there is a coherent principle that preserves all six of your judgments. It is the **Intrinsic Affective-Motivational Principle**:

  > **Principle:** An experience is bad in virtue of pain if and only if it possesses **intrinsic aversive phenomenology** (suffering) that generates a **motivation to cease or avoid** the experience, independent of sensory-discriminative content or higher-order evaluative judgment.

  This principle relies on a **Dual-Component Theory of Pain**, distinguishing the *sensory-discriminative* dimension (location, intensity, quality) from the *affective-motivational* dimension (unpleasantness, desire to stop). On this view, "badness" attaches exclusively to the affective component.

  ### Mapping Cases to Clauses

  1.  **Typical Migraine (Case 1):** Confirms the baseline link. High aversive affect + avoidance motivation $\rightarrow$ **Bad.**
  2.  **Pain Asymbolia (Case 2):** Motivated by the **Independence Clause**. Sensory content is present, but aversive affect is absent. Verdict: **Not Bad.** (Preserves your judgment that pain is present but not bad).
  3.  **Masochist (Case 3):** Motivated by the **Valence Clause**. Sensory content is present, but affect is positively valenced. Verdict: **Not Bad.** (Preserves your judgment that pain is present but badness is doubtful).
  4.  **Deep Analgesia (Case 4):** Motivated by the **Threshold Clause**. Faint sensory awareness without significant aversive affect fails the condition for badness. Verdict: **Not Bad.**
  5.  **Inverse Asymbolia (Case 5):** Motivated by the **Sufficiency Clause**. Aversive affect + motivation are present even without sensory content. Verdict: **Bad.** (Preserves your judgment that it is severely bad despite no "pain" sensation).
  6.  **Leucotomy (Case 6):** Motivated by the **Judgment Exclusion Clause**. Evaluative assent ("this ought to hurt") without aversive affect does not constitute badness. Verdict: **Not Bad.** (Aligns with Case 2).

  ### Prediction: The Spiritual Burning Case

  **Case:** A subject experiences vivid localized burning (Sensory: High), finds it mildly unpleasant (Affective: Low/Negative), but actively resists analgesia because she judges the sensation spiritually valuable (Evaluative: Positive).

  **Verdict:** **Intrinsically Bad.**

  **Reasoning:** The Intrinsic Affective-Motivational Principle distinguishes between *intrinsic badness* (constituted by unpleasantness) and *instrumental value* (constituted by evaluative judgment). Because the subject reports the sensation as "mildly unpleasant," the necessary condition for badness (aversive phenomenology) is met. Her spiritual valuation is an instrumental override; it makes the experience *worth enduring*, but it does not negate the intrinsic badness of the unpleasantness itself. This prediction aligns with your judgment in Case 6, where evaluative assent ("ought to hurt") failed to generate badness in the absence of affect; here, affect is present, so badness remains despite the positive evaluation.

  ### The Sacrifice for Simplicity

  While the Dual-Component Affective Principle preserves all six judgments, it requires a complex ontology that decouples "pain" from "hurt." For the sake of **ontological simplicity**—specifically, to adopt a Monistic Theory where pain is *essentially* unpleasant—one judgment must be sacrificed.

  **Judgment to Sacrifice:** **Case (2) Pain Asymbolia** (specifically the claim that *"pain is present"*).

  **Justification:**
  To simplify the principle to **"Pain is intrinsically bad"** (Monism), we must define pain by its unpleasantness. If we adopt this simpler view, the asymbolic patient in Case (2) is not feeling "pain that isn't bad"; rather, she is feeling **nociceptive sensation without pain**. By sacrificing the intuition that "pain is present" in asymbolia, we eliminate the need for a Dual-Component theory. We can then state a simpler principle: *"An experience is bad in virtue of pain if and only if it is a pain experience (which, by definition, involves unpleasantness)."* This simplifies the metaphysics of pain at the cost of reclassifying the asymbolic patient's sensation as non-painful.
