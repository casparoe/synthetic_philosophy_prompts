      *   **Opposing View:** Speed and stability.

  9.  **Drafting the text.** (Mental check: Keep it tight. No fluff.)

  *(Self-Correction during drafting)*: Make sure I don't sound like I'm taking the Faculty Rep's side *blindly*, but that her technical critique is sound. CEV *is* supposed to resolve contradictions, not delete them. That's a theoretical fact, not just an opinion.

