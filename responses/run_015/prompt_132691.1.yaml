      *   *Potential Principle:* It's not just about current behavior, but about the *structure of the system's history and potential*. Humans have a history of learning, rationality, and a cognitive architecture capable of supporting propositional attitudes. Bacteria have evolutionary history (Design Stance) but lack the architectural complexity for *representation* in the sense required for belief.
      *   *Dennett's View:* Dennett actually argues that beliefs *are* real patterns, but they are observer-relative. However, he distinguishes between "true believers" (humans/animals) and systems where the IS is merely instrumental.
      *   *Resolution:* The distinction likely lies in **Rationality and Integrability**. A sleeping human is part of a life-narrative that is broadly rational. A bacterium's "behavior" is a fixed tropism, not a rational adjustment to a web of beliefs. The "dormancy" in humans is a pause in a continuous rational process; in bacteria, there is no such process to pause.

