          2.  *Belief vs. Acceptance:* One can accept $P$ for the sake of argument without believing it. The paradox arises from conflating assertion with belief.
          3.  *Expressivism:* Asserting $P$ expresses the state $B(P)$. So the sentence expresses $B(P)$ and $\neg B(P)$ simultaneously.

