      *   *Purposivism (Stevens/Breyer):* Focus on the underlying goal. Who is the reader? Often looks at the collective goal of the polity over time. Evidence: Historical context of the militia, legislative intent (though harder in Const.), consequences. Role of Prefatory Clause: It defines the scope. The right exists *to serve* the militia purpose.
      *   *The "Written-Purpose Problem":* Textualists usually hate legislative history/purpose *outside* the text. Here, the purpose is *inside* the text. A strict textualist can't ignore it. Scalia's move: Grammar. The prefatory clause is a "prefatory" justification, not a "limiting" condition.

  3.  **Deconstruct Task 2: What the Opinions Did (Pushing Back):**
