      *   *Honesty:* It's likely result-oriented to some degree. Pure textualism might lead to a more absolute right or a more limited one, but the "exceptions" list is definitely pragmatic safety-valving.

  5.  **Deconstruct Task 4: Generalizing the Problem:**
