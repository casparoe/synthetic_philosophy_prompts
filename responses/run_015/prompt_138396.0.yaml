answer: |-
  Here is the breakdown you need for your session. I'm going to be direct: your "written-purpose problem" is sharp, but I think you're letting Scalia off too easy on the grammar, and you're mislabeling Breyer. Let's walk through it.

  ### 1. Mapping the Theories

  To map this properly, you have to distinguish between *where* each theory looks for meaning and *who* is doing the reading.

  **Textualism / Original Public Meaning (Scalia)**
  *   **Authoritative Reader:** The ordinary, reasonable citizen at the time of ratification (1791). Not the drafters' secret intent, but how the words were publicly understood.
  *   **Evidence:** Founding-era dictionaries, parallel state constitutional provisions (nine of thirteen states had right-to-bear-arms provisions), and grammatical canons. Scalia leans heavily on the idea that the Second Amendment codified a pre-existing individual right, similar to the First and Fourth.
  *   **Role of the Prefatory Clause:** This is the crux of your problem. Scalia treats the prefatory clause ("A well regulated Militia...") as a *justification*, not a *limitation*. He uses a grammatical canon: a prefatory clause announces a purpose but does not limit the scope of the operative clause unless the text explicitly says so. For a textualist, the purpose explains *why* the right was secured, not *who* holds it or *when* it applies. The text says "the right of the people," not "the right of the militia."
  *   **Prediction:** The prefatory clause informs ambiguity but cannot contradict the operative clause. If the operative clause grants an individual right, the militia purpose doesn't turn it into a collective right.

  **Purposivism (Stevens)**
  *   **Authoritative Reader:** The polity acting through history. Stevens looks less at the dictionary definition of "people" and more at the historical problem the Amendment was solving (fear of standing armies, need for state militias).
  *   **Evidence:** Legislative history (records of the First Congress), the structure of the Constitution (Article I gives Congress power over militias), and post-enactment practice (how militias were actually regulated).
  *   **Role of the Prefatory Clause:** For Stevens, the prefatory clause is the *key* to the lock. It defines the substantive scope of the right. The right exists *for the sake of* the militia. Therefore, if you aren't in the militia, the purpose doesn't apply, and the right doesn't trigger.
  *   **Prediction:** The prefatory clause limits the operative clause. The right is conditional on the purpose.

  **The "Written-Purpose Problem" Resolution:**
  Textualism doesn't have to treat the purpose clause as inert. It just treats it as non-limiting. The textualist argument is that English grammar allows for purpose clauses that do not restrict the main verb. Think of it like: "To stay healthy, John eats apples." John can still eat apples even if he's already healthy, or if eating apples doesn't make him healthy. The purpose explains the motivation, not the permission. Stevens argues the grammar implies conditionality: "In order to stay healthy, John may eat apples" (implying he shouldn't eat them otherwise). Scalia wins the grammatical argument; Stevens wins the historical-context argument.

  ### 2. What the Opinions Actually Did (And Where You're Wrong)

  You need to correct your read on Stevens and Breyer. They are not doing the same thing, and Stevens isn't a pure purposivist in the way you describe.

  **Stevens is a Closet Textualist**
  You say Stevens uses purpose as a restraint. That's true, but he frames it as a *textual* constraint. He argues that the phrase "keep and bear Arms" was a term of art in 1791 that referred specifically to military service. He isn't just saying "the purpose limits the right"; he's saying "the words themselves mean military service." He tries to beat Scalia on originalist ground. He cites the same founding-era sources to argue that "the people" in this context refers to the body politic acting collectively, not individuals. So, don't categorize Stevens as purely purposivist. He is an originalist who disagrees on the semantic evidence. He treats the prefatory clause as an *organizing principle* that defines the operative words.

  **Breyer is Not a Purposivist; He's a Balancer**
  You asked what to call Breyer's approach. It isn't traditional purposivism. Purposivism seeks to effectuate the specific goal of the legislature (or framers). Breyer explicitly rejects being bound by the original understanding if it leads to dangerous outcomes. He proposes an **interest-balancing test**. He asks: Does the statute burden the interest protected by the Amendment more than is necessary to achieve a compelling government interest?
  *   **Why this matters:** This removes the text from the driver's seat entirely. It turns the Second Amendment into a proportionality review, similar to European human rights law.
  *   **The Debate:** This doesn't belong in the same debate as Scalia and Stevens. Scalia and Stevens are arguing about *what the text means*. Breyer is arguing about *what the rule should be*. If you put Breyer in your reading group discussion, label him a "Pragmatist" or "Consequentialist," not a purposivist. Purposivism still respects the enacted purpose; Breyer is willing to weigh the purpose against public safety concerns in the present day.

  ### 3. Where It Breaks (The "Longstanding Regulations" List)

  You are right to be bugged by Scalia's list of presumptively lawful regulations (felons, mentally ill, sensitive places, commercial conditions). This is the weakest link in the majority opinion, and here is the honest truth: **It is not textualism.**

  There is no text in the Second Amendment that says "except for felons." There is no founding-era consensus that felons forfeited this specific right in a way that binds us today. Scalia admits this list is not exhaustive.

  **Is it Policy?**
  Yes. It is a safety valve. Scalia knew that a pure textualist/originalist reading could be read as creating an absolute individual right to own any weapon for any purpose. To avoid striking down every gun control law in America (and causing political chaos), he imported a common-law tradition of regulation.

  **Is Method Predicting Outcome?**
  No. The method was selected to justify the outcome, but the outcome (striking down the DC ban while preserving most regulations) required abandoning the method at the margins.
  *   **Textualist Critique:** A true textualist should struggle here. If the right is individual and pre-political, why does the government get to strip it based on status (felony) without textual authorization?
  *   **Purposivist Critique:** If the purpose is militia readiness, why does a felon's handgun in his home matter?
  *   **The Reality:** This passage is *stare decisis* and *tradition* masquerading as textualism. It's an appeal to "longstanding prohibition," which is a common-law methodology, not an originalist one. Scalia essentially said, "We aren't overturning everything, just this." That is a pragmatic judgment, not a textual deduction. It shows that even the hardest-line textualists revert to tradition when the text leads to a place they find politically untenable.

  ### 4. Does the "Written-Purpose Problem" Generalize?

  Yes, and this is where your discussion group can get really lively. You see this in federal statutes all the time. Think of the Americans with Disabilities Act (ADA) or the Civil Rights Act. They often begin with "Findings and Purposes."

  **The Statutory Analogy**
  *   **Textualist View:** Textualists (like Scalia and now Gorsuch) generally argue that purpose sections are part of the text but cannot *override* clear operative language. If the operative section says "X is prohibited," you can't use the purpose section to say "Well, the purpose was Y, so X is only prohibited when it hurts Y." The purpose section resolves ambiguity; it doesn't create it.
  *   **The Difference:** In statutes, the purpose section is usually detailed and specific. In the Second Amendment, the prefatory clause is vague ("security of a free State").
  *   **Defensibility:** It is *more* defensible for a textualist to ignore a statutory purpose section than the Second Amendment prefatory clause. Why? Because statutory purpose sections are often compromise language added at the end of the legislative process to secure votes, whereas the Second Amendment's prefatory clause was debated and ratified as part of the core provision.
  *   **The Trap:** However, the logical problem is identical. If a statute says, "To improve public health, no person shall sell tobacco to minors," a textualist says the ban applies even if selling to minors doesn't hurt public health in a specific case. A purposivist says the ban only applies if it serves the health goal.

  **Conclusion for Your Group**
  The "Written-Purpose Problem" exposes that Textualism and Purposivism aren't just different tools; they disagree on the hierarchy of text.
  *   For Scalia, the **Operative Clause** is the law; the **Prefatory Clause** is the explanation.
  *   For Stevens, the **Prefatory Clause** is the lens; the **Operative Clause** is the object.

  The break happens when Scalia admits exceptions that aren't in the text. That's where you tell your group: *Heller* proves that no Justice is a pure methodological absolutist. Scalia used textualism to get the right he wanted, then used tradition to keep the regulations he accepted. Stevens used history to get the collective right he wanted. Breyer abandoned text for balancing.

  The method didn't predict the outcome; the Justices' views on guns predicted the method, and the "Written-Purpose Problem" was the battlefield they chose to fight on. Use that tension to drive your session.
