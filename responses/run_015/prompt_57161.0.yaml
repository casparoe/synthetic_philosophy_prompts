      *   *Tension B: (1) vs. (5).* NoO usually hinges on the *entire* zygote or the specific sperm/egg. (5) claims the *nuclear* genome does the identity work, excluding mitochondria. This is a specification of (1). Is it compatible? Yes, provided "origin" is defined as "nuclear genetic origin."
      *   *Tension C: (1) & (5) vs. (6).* Anti-haecceitism (6) says worlds can't differ *only* by which individual is which. NoO (1) says *I* couldn't have come from different gametes. If I came from different gametes, would the world be qualitatively identical? If the new person is qualitatively identical to me, (6) says it's the same world/individual. But (1) says it would be a *different* individual (or I wouldn't exist). This is a classic clash. Kripke (NoO) is often seen as compatible with anti-haecceitism *if* the origin is a qualitative property. But if the origin *constitutes* the individual, does that violate anti-haecceitism?
      *   *Tension D: (2) vs. (1).* (1) says Origin is metaphysically necessary for *being me*. (2) says Origin is prudentially irrelevant for *survival*. This is the "Identity vs. What Matters" distinction (Parfit). It's a standard move, but is it coherent *here*? If (1) is true, I *am* my origin. If (2) is true, I *care* about psychology. This isn't a contradiction, but it creates a disconnect between metaphysics and ethics.
