      *   *Best Fix:* Refine (1) to be about the *causal history of the nuclear genome* rather than the gametes *simpliciter*. This aligns (1), (3), and (5). It creates tension with (6) but resolves the (1)/(5) split.
      *   *Wait, looking closer at (2) and (4):* This is the ethical pivot. If (2) is true (origin doesn't matter for survival), then (4) (NIP grip) is ethically weird. NIP says "Action A creates Person X, Action B creates Person Y. X cannot complain about A." If (2) says "X and Y are prudentially equivalent if psychology is continuous," then the NIP loses its normative sting.
      *   *Actually, the biggest tension is (1)/(4) vs (2).* (1) and (4) rely on strict identity conditions to make policy points. (2) says those conditions don't matter for what we care about. You can't have it both ways in a *policy* argument. If origin is prudentially irrelevant, policy shouldn't hinge on it.

