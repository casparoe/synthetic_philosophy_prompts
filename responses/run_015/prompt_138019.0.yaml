      *   *Override:* We are overriding the Right Hemisphere's expressed refusal.
      *   *Directive Weight:* High, because it anticipates this exact conflict.

      *Self-Correction on "Voice":* In most split-brain patients, speech is localized to the Left Hemisphere (LH). The prompt says "Right field... voice say operate." Right Field projects to LH. So the LH is speaking and consenting. Left Field projects to Right Hemisphere (RH). RH uses Left Hand to refuse.
      *So the conflict is:* LH (Speech/AD/Verbal Consent) vs. RH (Left Hand/Wife's anecdote).
      *The AD says:* Disregard the hand.
      *The Wife says:* Hand was smart before.
      *The Neuropsych says:* Hand might be noise.
      *The Surgeon says:* Delay = harm.

      *Conclusion:* The LH is the legal person. The RH is a "subject of experience" but likely not a legal agent. The AD binds the legal person to ignore the RH in this context.
      *Memo Tone:* Professional, direct, ethically nuanced but actionable.

  4.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Recommendation:** Bottom line up front. Operate on schedule.
      *   **Rationale:**
          1.  **Legal vs. Phenomenological Personhood:** Acknowledge the philosophical split but affirm the legal unity. The LH controls speech and the AD.
          2.  **The Advance Directive:** It was specifically designed for this conflict. It carries significant weight despite the unforeseen tumor context because the *type* of conflict was foreseen.
