      *   **Patient Case:** 44M, corpus callosotomy 11 years ago (split-brain). Now has a slow-growing left frontal tumor. Surgeon wants resection in ~3 weeks. Delay = increased risk of expressive-language deficit.
      *   **Consent Status:**
          *   Verbal/Standard Capacity Interview: Consents clearly.
          *   Lateralized Testing (Wada-style/visual field): Right hemisphere (speech/right hand) = Operate. Left hemisphere (left hand) = Do Not Operate.
          *   Reaction to Conflict: Patient verbally dismisses left hand ("just does that sometimes"). Left hand writes "do not let them cut."
          *   Neuropsychologist Warning: Left-hand responses can be noisy/alien hand phenomenon (no preference).
      *   **Additional Facts:**
          *   Advance Directive (3 years ago): "If left hand contradicts, disregard hand."
          *   Wife's Testimony: Cites episode 2 years ago where left hand refused meds, patient later thanked her (via left hand) for stopping them.
      *   **Requirements:**
          *   Recommend a concrete course (Operate now, Wait/Protocol, or Surrogate).
          *   Include time frame and conditions.
          *   State plainly what is being overridden if proceeding on verbal consent.
          *   Define evidence needed to treat left-hand responses as valid refusal vs. motor noise.
          *   Address the weight of the earlier directive given the unforeseen context.

  2.  **Determine the Ethical Core:**
      *   **The Conflict:** Unity of agency vs. disunity of agency. In split-brain patients, do we have one person with conflicting impulses or two agents with conflicting wills?
      *   **The Risk:** Harm from surgery (language deficit) vs. Harm from tumor growth (seizures, malignancy, death?). The prompt implies the tumor is "slow-growing" but delay increases risk of *permanent expressive-language deficit*.
      *   **The Precedent:** The Advance Directive (AD) vs. Current Dissent (Left Hand).
      *   **The Standard:** Best Interest vs. Substituted Judgment vs. Precedent Autonomy.

  3.  **Formulate the Recommendation:**
      *   *Option A: Operate on verbal consent.* Risks ignoring a potentially valid refusal from a distinct center of consciousness. Ignores the wife's evidence of left-hand competence.
