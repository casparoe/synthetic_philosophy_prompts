      *Does this invalidate the AD?* The AD says "disregard." But if the RH is a person, can the LH bind the RH? This is the core philosophical tension.
      *Pragmatic Ethics:* We must act. The LH is the legal interface. The AD is the legal document. The RH is the ethical uncertainty.
      *Best approach:* Acknowledge the RH's moral standing but prioritize the LH's legal authority and the medical necessity, *unless* the RH can prove capacity that rivals the LH.
