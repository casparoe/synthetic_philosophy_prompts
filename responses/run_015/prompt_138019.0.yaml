      *   **What is being overridden:** The RH's expressed preference. Acknowledge this is a moral cost, even if legally permissible.
      *   **Protocol:** One final validation session.

  5.  **Refining the Argument (The "Philosophically Interesting" Constraint):**
      *   Don't explain split-brain theory.
      *   Do use the terms "center of agency" or "subject of experience" if needed, but focus on *decisional authority*.
      *   Address the Wife's testimony directly. It suggests RH competence, but is anecdotal vs. formal AD.
