  'But I'm not judging it. I'm drinking it.'
  'The disposition is enough.'
  'So the light is on,' I said, 'but only in the world where I stop drinking?'
  'Roughly.'
  'Then in this world,' I said, gesturing to my glass, 'my experience is an orphan.'

  ***

  This joke exploits the tension between the dispositional fix (which saves orphan states via counterfactual dispositions) and your objection that this vacates actual consciousness. It lands by using the technical term 'orphan' to concede that, on the dispositional view, non-ideal actual experiences fail to be conscious, thereby reinstating the very problem the theory claimed to solve.
