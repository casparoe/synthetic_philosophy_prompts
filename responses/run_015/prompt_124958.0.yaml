answer: |-
  When Duane's house burned last February, nobody checked his pay stub before sending water on the flames. You got the dollars right. I ain't fighting that. But on the fire roster, if you miss three calls you're off, and nobody gets paid a cent to answer them. Those guys driving to the gas wells don't do it for the money. They do it because if they don't, the house burns. You call that preferring poverty. I call it being the only ones left with the keys.

  Maybe nobody stayed because they didn't have somewhere else to go. But when Mrs. Gable died last week, we held the dinner in the high school gym. It's the only building in Brackett big enough to hold the people who knew her. If the state consolidates that school with Kittanning's, we lose the place where we bury our people. You can take your data back to Pittsburgh. Just don't tell me the people holding the shovel are the ones who got it wrong.
