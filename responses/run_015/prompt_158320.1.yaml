answer: |-
  The mistake begins with the snapshot. Every standard answer to the Special Composition Question treats existence as if it were a photograph. The contact theorist looks at a single frame and asks, "Are these pixels touching?" The functionalist asks, "Do these pixels look like they work together?" Even the organic theorist, who grants us life, treats the organism as a static structure rather than a dynamic event. But objects are not stains on a slide; they are events in time. To ask when parts compose a whole is to ask when distinct histories merge into a single fate.

  The principle is this: **Trajectory Coherence.** xs compose a y if and only if the spatiotemporal paths of the xs are bound into a single, non-diverging causal-historical line that supports unified counterfactual dependence.

  Consider what this demands. It is not enough that the parts are near each other now. It is not enough that they were near each other once. They must be locked into a shared future of causal interaction. If I strike the whole, the parts must vibrate in concert not merely because they are glued, but because the causal wavefront travels through them as a unified medium. If I remove one part, the integrity of the whole's trajectory must alter. This is the normative force that contact and function miss. Contact is accidental; two bricks may touch for a century without ever influencing each other's causal fate beyond the point of friction. Function is imposed; a broken watch still exists as a watch even when it tells no time, because its gears remain bound in a mechanical trajectory designed to move together. But where that causal binding snaps, the object dies, even if the pieces remain.

  This is why the scattered museum collection fails the test. Take the Baroque altarpiece, demolished in a war, its gilded fragments now resting in vaults in Berlin, New York, and Tokyo. The universalist says they compose a scattered object because existence is cheap. The nihilist says they compose nothing because there is no unity here. Both are wrong because both ignore the timeline. The Trajectory Coherence view says: they *were* one object. But composition is a present-tense verb.

  At the moment of demolition, the causal-historical line fractured. The fragment in Berlin is now subject to humidity changes, handling, and potential destruction that have zero causal bearing on the fragment in Tokyo. There is no unified counterfactual dependence. If the Berlin fragment is crushed, the Tokyo fragment does not tremble. Their paths have irreversibly diverged. The curatorial label that binds them is a psychological fiction, a narrative bridge built over a causal chasm. To claim they are still one object is to claim that a ghost survives the body simply because we remember its name. The altarpiece does not exist as a whole; it exists as three distinct artifacts with a shared ancestry. Composition requires a shared destiny.

  Now, the obvious objection arises: Is this not smuggling in temporal bias or psychological narrative? You speak of "paths" and "fates." Are these not human constructs imposed on indifferent matter? Does the universe care about divergence?

  The defense is rigorous: Causal pathways are mind-independent physical facts. When a bomb explodes, the shrapnel flies apart according to vector physics, not human interest. The divergence of trajectories is measurable in joules and meters per second. If the causal influence between part A and part B drops below the threshold required to maintain structural integrity against external forces, the unity is physically broken, regardless of whether a curator wishes it otherwise. We are not privileging human narrative; we are privileging physical continuity. An object is a region of spacetime where internal causal forces dominate external ones. When external forces (like war, shipping, dispersion) dominate the relationship between the parts, the internal causal unity is severed.

  Furthermore, this avoids the trap of temporal bias by acknowledging that objects persist *through* time, not *in* time. To deny trajectory is to deny persistence. If you accept that an object exists for more than an instant, you must accept that its temporal parts are bound by some coherence. Trajectory Coherence simply makes explicit what is implicit in persistence: that to be one thing is to go somewhere together.

  Therefore, we reject the universalism that clutters the universe with arbitrary scattered sums, and we reject the nihilism that denies the reality of integrated beings. We accept only those wholes that hold together under the pressure of causality. The altarpiece is gone. The fragments remain. To say otherwise is to confuse memory with metaphysics.

  \answer{Trajectory Coherence}
