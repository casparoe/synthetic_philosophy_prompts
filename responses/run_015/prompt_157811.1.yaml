          *   Type specimens anchor names, but populations are what matter.
      *   **Philosophical Questions:**
          *   What does species-based practice presuppose about the ontology of species? (Realism vs. Instrumentalism).
          *   Does the type-specimen requirement fit the lineage view?
          *   How to reconcile protecting within-species structure (DPS/subspecies) vs. preventing between-species admixture (hybrids)?
          *   What rival accounts are ruled out (ecological/functional vs. individualist)?
          *   Where is the practice underdetermined (multiple theories support it)?
      *   **Counterfactual:** If we dropped species for function/assemblages/individuals, what changes? What is lost (accountability, stability)?
      *   **Constraint:** No names of theories/philosophers. Just reconstruct the implicit story, needs vs. fits, and underdetermination.

  2.  **Analyze the Ontological Commitments (The "Implicit Story"):**

      *   *Realism vs. Instrumentalism:* The practice *acts* like species are real (lineages), but *operates* like they are administrative units (names). The outrage at the genomic clustering funder suggests stakeholders *need* the stability of realism even if the science is instrumental.
      *   *The Type Specimen:* This is a historical anchor. It fits a "historical individual" view (a species is a specific branch starting at a point), but it clashes with the "cluster" view (species are fuzzy clouds). The practice treats the name as the hook for the law, implying the *concept* must be fixed, even if the *biology* is fluid.
      *   *The Hybrid/Structure Asymmetry:* This is the crux.
          *   Protecting DPS/subspecies = Valuing *history* and *distinctness* (evolutionary potential).
          *   Hating hybrids = Valuing *purity* of that history/lineage.
          *   Together, they imply species are *historical narratives* that must remain unintrupted. It's not about function (a hybrid might function fine); it's about pedigree.
      *   *Underdetermination:* Both a "Species are Real Lineages" view and a "Species are Useful Boxes for Law" view support the current system. The system works for both, but for different reasons.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's a mix of inertia and a specific, often unexamined, metaphysical bet.
      *   **The Ontological Bet (Realism vs. Instrumentalism):**
          *   The practice *requires* stability (for law/money) but biology offers fluidity.
          *   The "Type Specimen" acts as a stabilizer. It's not about the animal; it's about fixing the reference point.
          *   *Verdict:* The practice *looks* instrumental (bookkeeping) but *feels* realist to the participants (hence the outrage when clusters vanish). It presupposes species are *historical individuals* (spatiotemporally bounded), not just classes of similar things.
      *   **The Asymmetry (Structure vs. Hybrids):**
          *   Why protect subspecies but kill hybrids?
          *   If it were functional/ecological, hybrids would be fine (same niche).
          *   If it were individualist, hybrids would be fine (they are alive).
          *   *The Implicit Story:* Conservation is about preserving *Evolutionary History/Process*. Subspecies represent unique history. Hybrids represent the erasure of that unique history (blending). It's a "library of books" model, not a "factory of products" model. You want distinct books, not mixed pages, even if the mixed pages tell a good story.
      *   **What is Ruled Out:**
          *   *Pure Functionalism:* If function mattered most, hybrids replacing parents would be a success, not a crisis.
          *   *Pure Individualism:* If only individual welfare mattered, culling hybrids would be immoral.
          *   *Strict Essentialism:* If species had fixed essences, taxonomy wouldn't change so much. The practice accepts taxonomic revision, so it's not essentialist.
      *   **What is Underdetermined:**
          *   Lineage Realism (Species are real branches) AND Administrative Conventionalism (Species are just the only stable hooks we have for law) both lead to the same paperwork.
          *   The system works for both, masking the disagreement.
      *   **The Counterfactual (Dropping Species):**
          *   *Function/Assemblages:* Hard to measure, hard to litigate. "Protect this ecosystem service" is vaguer than "Protect this Wolf." Accountability slips.
          *   *Individuals:* Impossible to scale. Budgeting becomes chaotic.
          *   *What is Lost:* The "Hook." The ability to say "This specific thing exists and is threatened." The stability for budgeting (species counts are stable enough, unlike genomic clusters). The moral clarity (saving a "kind" feels different than saving "some animals").

  4.  **Refining the Tone:**

      *   Keep it analytical, precise, and philosophical without being academic/jargon-heavy (per user request: "I don't need names of theories").
      *   Focus on the *logic* of the practice.
      *   Address the specific example of the genomic funder (the "vanishing unit" problem).

  5.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I explain the type specimen issue? *Adjustment:* Make sure to link the type specimen to the need for a fixed reference point in a fluid system. It's an anchor for the name, not necessarily the biology.
      *   *Check:* Did I address the hybrid asymmetry clearly? *Adjustment:* Emphasize the "Historical Narrative" aspect. That explains why unique history (subspecies) is good, but blended history (hybrids) is bad.
      *   *Check:* Did I answer the "Underdetermined" part? *Adjustment:* Explicitly state where different philosophies converge on the same practice.
      *   *Check:* Did I avoid naming philosophers (e.g., Hull, Ghiselin, Mayr)? *Yes.*

  6.  **Final Polish:** Organize with clear headings matching the user's flow. Ensure the distinction between "what the practice needs" and "what goes well with it" is sharp. (Proceed to generate output based on these thoughts.)

      *   *Key Insight to highlight:* The conservation machinery treats species as *property titles*. You need a stable title to transfer resources, even if the land shifts. The genomic funder broke the "title stability" rule, hence the fury.

  7.  **Final Output Structure:**
      1.  The Ontological Wager (Realism vs. Stability).
      2.  The Asymmetry (History vs. Function).
      3.  What is Ruled Out.
      4.  What is Underdetermined.
      5.  The Counterfactual (Dropping the Unit).

      *(Self-Correction on the "Type Specimen" point)*: The user asks if it fits the lineage picture. Actually, a type specimen is a static point, a lineage is a dynamic process. The practice uses the static point to *name* the dynamic process. This is a tension. I need to highlight that.

      *(Refining the Hybrid point)*: Why is hybridization bad? Because it dissolves the distinct unit. If the unit is the currency, inflation (merging) is bad.

      *(Refining the Genomic Funder point)*: The outrage reveals that stakeholders treat the *unit* as the valuable thing, not the animals. If the unit vanishes, the value vanishes, even if animals live. This proves the "Realism" is actually "Institutional Realism."

