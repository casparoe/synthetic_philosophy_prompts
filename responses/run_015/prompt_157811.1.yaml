answer: |-
  This is a sharp dissection of the conservation machinery. You have identified that the practice operates on a specific metaphysical wager, but one that is often disguised as administrative necessity. Here is a reconstruction of the implicit story, what it requires, what it excludes, and where it is underdetermined.

  ### 1. The Ontological Wager: Historical Individuals vs. Administrative Anchors

  The practice presupposes that species are **historical individuals**. It does not treat them as "kinds" or classes defined by a checklist of traits (essentialism), because if it did, taxonomic splitting and lumping wouldn't change the moral status of the animals. If a species were just a class of "things with trait X," discovering that some have trait Y wouldn't make the original class disappear.

  Instead, the practice treats a species as a specific branch on a tree with a unique origin and trajectory. This is why the **type specimen** is crucial. In a lineage view, a species is a continuous process. But the law and budgeting require a fixed reference point. The type specimen is not there to define the biology; it is there to **anchor the name to the branch**. It stops the branch from sliding away linguistically.

  **Realism vs. Instrumentalism:**
  Does this require realism (species are objectively real out there)? Not strictly. It requires **institutional realism**.
  *   **What it needs:** The unit must be stable enough to hold a property title. Conservation funding is essentially a trust fund managed on behalf of a beneficiary (the species). You cannot manage a trust for a beneficiary that merges with another beneficiary or vanishes because you took more measurements.
  *   **The Genomic Funder Conflict:** The outrage at the funder who uses dynamic genomic clusters reveals that stakeholders are not actually instrumentalists. If they were, they would accept that the "grid" changed. The fury shows they believe the *unit itself* has moral standing. When the cluster vanishes, they feel a moral loss occurred, even if the animals are alive. This implies the practice relies on a **reified concept**: the "Species" is treated as a real entity that can be killed by a spreadsheet change, not just a label.

  **Verdict:** The practice acts *as if* species are real lineages (to justify the moral urgency) but operates *as if* they are fixed legal persons (to justify the budgeting). The type specimen is the bridge: it turns a fluid biological process into a fixed legal defendant.

  ### 2. The Asymmetry: Why Subspecies are Good but Hybrids are Bad

  This is the strongest evidence for what the system values.
  *   **Protecting Subspecies/DPS:** This values **distinct history**. A distinct population segment represents a unique evolutionary narrative that has diverged from the main plot.
  *   **Preventing Hybrids:** This values **narrative purity**.

  If the goal were **ecological function**, hybrids would often be neutral or positive (they fill the niche, they survive). If the goal were **individual welfare**, culling hybrids would be immoral.

  **The Implicit Story:** Conservation is not about saving "life" or "function"; it is about **saving the Library of Evolutionary History**.
  *   A subspecies is a unique book.
  *   A hybrid is two books glued together.
  *   Even if the glued book reads well (functions ecologically), you have lost two distinct titles.

  For the asymmetry to make sense, species must be viewed as **informational containers** that must remain sealed. Admixture is treated as "data loss" or "corruption" of the specific historical signal. The system prioritizes the *separateness* of lineages over the *viability* of the organisms. It assumes that the value lies in the *difference* between lineages, not just the existence of the lineages.

  ### 3. What is Ruled Out?

  The current practice quietly rules out three rival accounts, even if practitioners might verbally endorse them:

  1.  **Pure Functionalism:** If conservation were about maintaining ecosystem services or niche occupancy, hybridization would not be a crisis. A hybrid wolf-dog that hunts ungulates and controls population performs the "wolf function." The fact that managers remove them proves the goal is *identity*, not *job performance*.
  2.  **Strict Individualism:** If the moral unit were the individual organism, spending millions to prevent two individuals from mating (hybridization) would be hard to justify. The practice assumes the *collective lineage* has rights that supersede the reproductive rights of the individuals composing it.
  3.  **Dynamic/Process Ontology:** The genomic funder's approach treats species as fluid patterns in data. The conservation machinery rejects this. It rules out the idea that "species" are temporary conveniences. It demands they be treated as permanent(ish) fixtures, even if biology says they are fleeting.

  ### 4. Where is the Practice Underdetermined?

  There are areas where different philosophical stories lead to the exact same paperwork, masking the disagreement:

  *   **Lineage Realism vs. Legal Convenience:** A biologist who believes species are real, mind-independent branches and a lawyer who believes species are just the only stable hooks available for legislation will both sign off on the Endangered Species Act. The practice works for the Realist (because it saves the branches) and the Instrumentalist (because it saves the budget categories). The conflict only appears when the science (genomics) destabilizes the categories.
  *   **Evolutionary Potential vs. Intrinsic Value:** You can justify saving a distinct population segment because it holds unique genetic tools for the future (utilitarian/evolutionary potential) OR because it has a right to exist regardless of utility (intrinsic value). The paperwork is identical. The practice doesn't care *why* you value the branch, only that you agree it counts as a branch.
  *   **The Type Specimen:** A morphological essentialist (species are defined by looks) and a lineage realist (species are defined by ancestry) both use type specimens. For the essentialist, it's the definition. For the lineage realist, it's just a label holder. The practice doesn't force you to choose, which allows the system to persist even as the science moves from morphology to genetics.

  ### 5. The Counterfactual: Dropping the Species Unit

  If you switched to funding by **Ecological Function**, **Assemblages**, or **Individuals**, here is what would concretely break:

  **A. Accountability and Litigation**
  *   **Current:** You can sue the government for failing to protect the "Northern Spotted Owl." The owl is a named plaintiff.
  *   **Function:** You sue for failing to protect "canopy predation." Who represents canopy predation? If the owl dies but a hawk takes over the job, did the function fail? It becomes legally unenforceable. The "named species" provides a **standing** for the lawsuit. Without it, the "client" vanishes.

  **B. Budget Stability**
  *   **Current:** You budget for 50 recovery plans.
  *   **Assemblage/Function:** Ecosystems bleed into each other. Where does the "wetland function" budget end and the "river function" budget begin? The boundaries are porous. Species provide **hard edges** for accounting. You lose the ability to ring-fence money.

  **C. The "Hook" for Public Engagement**
  *   **Current:** "Save the Tiger."
  *   **Alternative:** "Save the trophic cascade dynamics."
  *   **Loss:** You lose the moral totem. People donate to save *kinds*, not *processes*. The species acts as a **synecdoche**—a single name that stands in for a whole web of relations. Dropping it dissolves the focal point for attention.

  **D. Stability of the Unit**
  *   **Current:** A species name lasts centuries.
  *   **Genomic/Cluster:** As you noted, units merge or vanish with new data.
  *   **Loss:** You cannot write a 10-year recovery plan for a unit that might be redefined next year. The practice requires **temporal durability**. The species concept, flawed as it is biologically, is the only unit stable enough to support long-term bureaucratic planning.

  ### Summary of the Implicit Story

  The conservation machinery is not built on a biological truth, but on a **legal fiction that mimics biological realism**.

  1.  **It presupposes:** Species are historical individuals (lineages) that can be owned/represented in court.
  2.  **It requires:** Fixed anchors (type specimens/names) to stabilize those individuals for budgeting and law.
  3.  **It values:** Distinctness of history over functional continuity (hating hybrids, loving subspecies).
  4.  **It excludes:** Views where function trumps identity, or where individuals trump lineages.
  5.  **It is underdetermined:** It allows both true believers (realists) and pragmatists (instrumentalists) to work together, until the science becomes too fluid for the law to track.

  The outrage at the genomic funder proves that the "Species" is not just a bucket for animals; it is the **currency** of conservation. Devaluing the currency (by merging units) feels like stealing the funds, even if the "wealth" (the animals) is still there. The system cannot function without a stable currency, which is why it clings to the species concept even when biology outgrows it.
