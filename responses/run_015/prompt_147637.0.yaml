answer: |-
  This is a fascinating reverse-engineering problem. Your friend's verdicts are actually quite consistent, but they rely on a specific hierarchy of ethical priorities that isn't immediately obvious because she's mixing **veterinary ethics** (individual patient welfare) with **wildlife management ethics** (population dynamics) and a dash of **philosophical pessimism** (the strip mine comment).

  Here is the breakdown of the rule she is running, how it applies to the mice, and how to test it.

  ### 1. The Inferred Rule: "The Precautionary Welfare Hybrid"

  Based on her track record, she is operating on three nested principles, in this order of priority:

  1.  **Epistemic Humility (The "Research First" Override):** She defaults to *inaction* until the outcomes are certain. This explains why she wants to fund research on *every* case. It's a safety valve.
  2.  **Individual Non-Maleficence (The "Vet Tech" Core):** Do not harm currently existing, healthy individuals. This explains the **Wildlife Hospital** (save the injured) and the **Fat Deer** verdict (don't kill or sterilize deer that are currently living good lives, even if overpopulation is a risk).
  3.  **Human Responsibility (The "Intervention Trigger"):** Intervention is justified primarily to fix *human-caused* problems. This explains **Rabies** (dogs caused it), **Highways** (cars caused it), and **Strip Mine** (humans made the hole, but don't fill it with suffering lives).

  **The Tension:** The **Strip Mine** verdict introduces a fourth, quieter principle: **Negative Utilitarianism.** She believes wild lives often contain more suffering than pleasure ("lives that will mostly go badly"). This conflicts slightly with the **Fat Deer** verdict. If wild lives are net negative, why not contracept the deer to prevent future suffering?
  *Resolution:* She likely distinguishes between **Current Happiness** (Fat Deer = Good, don't touch) and **Potential Suffering** (Strip Mine = Bad, don't create). She prioritizes the welfare of the *existing* individual over the *potential* suffering of future generations, unless those future generations are being *created by humans*.

  ### 2. Alternative Rules That Fit

  *   **Rule B: "The Conservation Vet."**
      *   *Logic:* Protect native ecosystems from human interference.
      *   *Fit:* Explains opposition to Strip Mine (artificial ecosystem) and Fat Deer (suburban interference). Explains Rabies/Highway (mitigating human damage).
      *   *Mismatch:* Doesn't fully explain the Wildlife Hospital (which is individual-focused, not ecosystem-focused) or the strong "suffering" language on the Strip Mine.
  *   **Rule C: "The Negative Utilitarian."**
      *   *Logic:* Minimize total suffering, even if it means fewer lives.
      *   *Fit:* Explains Strip Mine perfectly. Explains Rabies/Highway (suffering reduction).
      *   *Mismatch:* Struggles with Fat Deer. If the goal is minimizing suffering, contracepting the deer prevents future starvation. Her rejection suggests she draws a line at harming *happy* existing beings.

  ### 3. Applying the Rules to the Island Mice

  Here is how her framework likely processes the two options:

  *   **Option A (Fertility Control/Gene Drive):**
      *   *Pros:* Prevents future starvation (aligns with Strip Mine logic: fewer suffering lives). No harm to current mice (aligns with Individual Non-Maleficence).
      *   *Cons:* It is a **natural** boom-bust cycle, not human-caused (violates Human Responsibility). It manipulates population dynamics (violates the lesson from Fat Deer: don't contracept healthy populations). It risks extinction (unknown long-term consequences -> violates Epistemic Humility).
      *   *Verdict:* **Against (or "Research First").** The "Natural Cycle" aspect is the dealbreaker. She fixes human messes; she doesn't fix nature.

  *   **Option B (Poison Eradication):**
      *   *Pros:* Prevents future starvation.
      *   *Cons:* Kills all currently living individuals (violates Individual Non-Maleficence/Wildlife Hospital ethos). Kills healthy mice (violates Fat Deer precedent).
      *   *Verdict:* **Strongly Against.** This is the easiest call for her. She volunteers to save individual hawks; she won't poison them all.

  *   **Option C (Fund Research / Do Nothing):**
      *   *Verdict:* **For.** This is her default state for any complex population issue, especially one without a clear human culprit.

  ### 4. The Closest Analog

  **The Fat Suburban Deer.**

  *   **Similarities:** Both involve a population that is currently viable but faces a crash/overpopulation issue. Both offer a lethal (culling/poison) and non-lethal (contraception/fertility) option.
  *   **Why it fits:** In the Deer case, she rejected contraception even though it was non-lethal. This suggests she opposes *managing wild reproduction* unless there is an immediate human-caused threat (like Rabies). The mice are currently in the "boom" phase (like the fat deer), so intervening now violates her "don't touch healthy individuals/populations" rule.
  *   **Secondary Analog:** **The Strip Mine.** This is the only case where she explicitly weighed the *value of existence* itself. If she views the mouse bust as "lives going badly," the Strip Mine logic suggests preventing those lives is good. However, the Deer case overrides this when current individuals are healthy.

  ### 5. The Follow-Up Case to Split the Options

  Her track record suggests she will say "Fund Research" for the mice, which is a non-answer. To force her to reveal whether she prioritizes **Preventing Natural Suffering** or **Non-Interference in Nature**, you need a case that isolates *suffering* from *population control*.

  **Put this case to her:**

  > "There's a native species of wild fox on a remote island. They suffer from a natural, painful parasitic mange that kills them slowly over months. It's not human-caused; it's just nature. We have a treatment we can drop in bait that cures the mange and stops the pain, but it doesn't stop the population cycle—they'll still boom and bust, they just won't have the mange. Do we distribute the treatment?"

  **How this splits the options:**

  *   **If she says YES:** She prioritizes **Suffering Reduction** over **Non-Interference**.
      *   *Implication for Mice:* She might actually support **Option A (Fertility Control)**. If she's willing to intervene in a natural cycle to stop pain (mange), she might be willing to intervene to prevent the pain of starvation (bust), provided no current mice are harmed.
  *   **If she says NO:** She prioritizes **Non-Interference** (Let Nature Be) unless humans caused the problem.
      *   *Implication for Mice:* She will definitely oppose **both** mouse options. The boom-bust is "just nature," like the mange. Intervening is playing god.
  *   **If she says "RESEARCH":** She is consistent with her track record, but it confirms her **Epistemic Humility** is the dominant rule, overriding both suffering and non-interference.

  **Why this works:** It removes the "population control" variable (which confuses the Deer vs. Strip Mine logic) and removes the "killing individuals" variable (which makes Poison a slam-dunk no). It tests the core philosophical question: **Is natural suffering something we are obligated to fix, or is it something we are obligated to leave alone?**
