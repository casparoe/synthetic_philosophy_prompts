  The separateness objection dissolves when boundaries are permeable, transforming utilitarianism into a temporal calculus. Utility aggregates across fused consciousness as one, but splitting creates a duplication problem: does post-merge suffering count twice? The "self" becomes a pattern, destabilizing instrumental convergence. Self-preservation shifts from bodily continuity to memory integrity; sacrificing a body matters less if the mind-pattern persists elsewhere. This risks a tyranny of the merged state, where individual rights dissolve during fusion. Ultimately, ethics hinges not on who suffers, but when the consciousness stream fractures, making identity a matter of degree rather than kind.
