answer: |-
  **STANDARD OPERATING PROCEDURE 74-B**
  **COMMITTEE FOR COORDINATED ACTION (CCA)**
  **SUBJECT: MITIGATION OF UNILATERAL EXECUTION HAZARD**
  **VERSION: 4.2**

  **1.0 DEFINITION OF HAZARD**
  The Unilateralist Hazard arises when $N$ agents possess independent capacity to execute Action $A$. Each agent $i$ observes a noisy private signal $s_i$ regarding the common value $V$ of $A$. Execution occurs if $\exists i : s_i > \theta$. As $N$ increases, the probability that $\max(s_i) > \theta$ approaches 1, even if $E[V] < \theta$. Conditional on execution, the expected value $E[V | \text{action}]$ decreases monotonically with $N$. Benefits accrue to the actor; costs are socialized.

  **2.0 UNANIMITY CONSENT PROTOCOL (BLOCKER MECHANISM)**
  To counteract Section 1.0, Action $A$ shall require unanimous written consent from all $N$ members. Execution occurs only if $\min(s_i) > \theta$. This inverts the selection bias: conditional on execution, $E[V | \text{action}]$ is higher than any individual signal suggests. However, this grants veto power to the member with the lowest signal calibration. Members are incentivized to report artificially low signals to gain leverage over the committee agenda, creating a secondary market in manufactured pessimism. This is designated the *Consensus Drag*.

  **3.0 SOLE ACTOR ROTATION**
  Alternatively, the Committee may designate a Single Authorized Actor (SAA) via weekly lottery. For the duration of the term, $N_{eff} = 1$. This eliminates coordination costs and externalities between members. It does not eliminate externalities between the SAA and the public. The probability of erroneous execution reverts to the base rate of individual calibration error.

  **4.0 TRADEABLE ACTION CREDITS**
  The Committee shall issue $K$ action credits per quarter, auctioned to members. Credits confer the right to execute $A$ without further review. Members bid based on expected utility $E[U_i]$. Since $E[U_i]$ correlates positively with signal optimism $s_i$, credits concentrate in the hands of the members with the highest $s_i$. The market efficiently allocates execution rights to the agents most likely to overestimate $V$, replicating the Section 1.0 hazard via price mechanism.

  **5.0 UNIVERSALIZABILITY CERTIFICATION**
  Members seeking to execute $A$ must certify that they would accept the outcome if all $N$ members executed $A$ simultaneously based on the same judgement. Only agents who believe $V \gg \theta$ universally will sign. Agents with moderate calibration will refuse certification due to aggregate risk. Execution rights therefore vest exclusively in agents with the highest risk tolerance and highest signal noise.

  **6.0 NUMERICAL ILLUSTRATION**
  Consider $N=3$ agents. True Value $V=5$. Execution Threshold $\theta=6$. Net Value is negative; action is prohibited.
  Signals observed: $s_1=8, s_2=5, s_3=4$. Noise $\sim \mathcal{N}(0, 3)$.
  *   **Unilateral:** Agent 1 executes ($8 > 6$). Loss incurred.
  *   **Unanimity:** Agent 3 vetoes ($4 < 6$). No action. (Correct outcome, but fails if $V=7, s_3=4$).
  *   **Credits:** Agent 1 values credit highest ($s_1=8$). Wins auction. Executes. Loss incurred.
  *   **Universalizability:** Agent 1 certifies ("If everyone saw 8, we should all act"). Agents 2 and 3 decline. Agent 1 executes under exemption clause 5.4. Loss incurred.

  **7.0 OVERSIGHT**
  A Subcommittee on Procedural Integrity shall be constituted to review the efficacy of these measures. The Subcommittee shall meet quarterly to discuss whether meetings should be held. Administrative liability attaches exclusively to positive authorizations recorded in the minutes.

  **APPROVED BY:** _The Committee_
  **DATE:** _2023-10-27_
  **CLASSIFICATION:** _INTERNAL // EYES ONLY_

  ***

  **Notes on the Satire**

  The "Blocker's Curse" symmetry is clean regarding selection bias (max vs. min of signals) but asymmetric regarding consequences. The original curse produces *bad action*; the unanimity remedy produces *missed good action*. I treated them as symmetrical failures of coordination to highlight that both stem from the same information structure. I'm confident the underlying mechanism (selection on noisy signals) is accurate to the formalism Bostrom et al. describe. The single point I'm least sure of is the market mechanism (Section 4.0): in reality, risk aversion might dampen bidding, but assuming risk-neutral expected utility maximizers, the adverse selection holds. The closing line relies on the reader noticing that "liability" only tracks acts, not omissions, which is the root cause no procedure here addresses.
