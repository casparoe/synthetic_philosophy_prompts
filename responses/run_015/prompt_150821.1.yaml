      *   *Unanimity:* Action if $\forall i: s_i > \theta$. Action occurs if $\min(V + \epsilon_i) > \theta$. Conditional on action, $V$ is likely higher than the signal suggests (because even the noisy pessimist saw value). But the risk is *inaction* when $V > \theta$.
      *   *Market:* Credits go to highest bidder. Highest bidder = highest expected value = highest signal. Back to original curse.

  5.  **Drafting the Content (Mental or Scratchpad):**
