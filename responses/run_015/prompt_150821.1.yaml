      *   *Sec 1:* Define Hazard. $N$ agents. Independent signals. Action threshold $T$. Probability of action $1 - (1-p)^N$. Expected value conditional on action decreases with $N$.
      *   *Sec 2:* Unanimity Requirement. All must sign. Creates "Calibration Veto." Members incentivized to lower signal to gain leverage.
      *   *Sec 3:* Rotation. One decider per cycle. $N_{eff} = 1$.
      *   *Sec 4:* Credits. Auction. Highest valuation wins. Valuation correlates with optimism.
