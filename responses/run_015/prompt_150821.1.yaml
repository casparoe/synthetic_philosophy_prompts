      *   *Section 4 (Action Credit Market):* Tradeable permits. Adverse selection. Optimists buy credits.
      *   *Section 5 (Universalizability Certification):* Kantian check. Only those willing to universalize the risk will pass.
      *   *Section 6 (Illustrative Case):* Agents A, B, C. Signals 0.4, 0.5, 0.9. Threshold 0.6. True value 0.5. Show how Unanimity blocks (0.4 < 0.6), Market lets C buy, etc.
      *   *Section 7 (Governance):* Form subcommittee to review these measures.
      *   *Footer:* Version history, classification.

