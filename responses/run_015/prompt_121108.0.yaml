  # Handout: The Critical-Level Trap

  **The View:** The **Critical-Level View (CLV)**.
  A population's value is the sum of everyone's welfare minus a fixed **Critical Level ($c$)**.
  *   **Formula:** $Value = \sum (welfare - c)$
  *   **Verdict:** Adding a person is an *improvement* only if their welfare exceeds $c$.
  *   **Our Parameter:** We set **$c = 40$**. (Lives below 40 count as negative contributions to the total value, even if worth living).

  **The Setup:**
  *   Welfare is an integer (0–100). 0 is neutral.
  *   **Start ($A_1$):** 4 people.
  *   **Rule for each step:** Add exactly one new person. No one is removed.
  *   **Constraint:** No existing person's welfare changes by more than 2 points.
  *   **Goal:** Show a chain where **Total Welfare** and **Average Welfare** both rise every step, but **CLV Value** falls every step.

  ### The Chain of Outcomes

  | Outcome | Population (Welfare Scores) | Total Welfare ($\sum w$) | Average Welfare ($\bar{w}$) | CLV Value ($\sum (w-40)$) |
  | :--- | :--- | :--- | :--- | :--- |
  | **$A_1$** | 4 people @ **30** | **120** | **30.0** | $4 \times (30-40) =$ **-40** |
  | **$A_2$** | 4 @ **29**, 1 new @ **35** | **151** | **30.2** | $4(-11) + 1(-5) =$ **-49** |
  | **$A_3$** | 4 @ **28**, 1 @ **34**, 1 new @ **36** | **182** | **30.3** | $4(-12) + 1(-6) + 1(-4) =$ **-58** |
  | **$A_4$** | 4 @ **27**, 1 @ **33**, 1 @ **35**, 1 new @ **37** | **213** | **30.4** | $4(-13) + 1(-7) + 1(-5) + 1(-3) =$ **-67** |

  ### Constraint Checklist
  *   [x] **One added, none removed:** Population grows 4 $\to$ 5 $\to$ 6 $\to$ 7.
  *   [x] **Welfare move $\le$ 2:** Existing people drop by exactly 1 point each step.
  *   [x] **Total Welfare Up:** 120 $\to$ 151 $\to$ 182 $\to$ 213.
  *   [x] **Average Welfare Up:** 30.0 $\to$ 30.2 $\to$ 30.3 $\to$ 30.4. (Rising average rules out simple "dilution" objections).
  *   [x] **CLV Value Down:** -40 $\to$ -49 $\to$ -58 $\to$ -67. (Each step is strictly *worse*).
  *   [x] **Lives Worth Living:** Lowest welfare in $A_4$ is 27 (well above 0 and above 15).
  *   [x] **Critical Level:** Fixed at $c=40$ (within 25–60 range).

  ***

  ### 1. What is doing the work?
  Your suspicion is correct: the drop in existing welfare is not the engine of the paradox. The essential feature is that the **population average is below the critical level** ($\bar{w} < c$).
  This creates a "trap zone" where you can add a person who is **above the average** (raising the average) but **below the critical level** (lowering the CLV value). The general condition for this chain to exist is simply: **$\text{Average Welfare} < \text{New Person's Welfare} < \text{Critical Level}$**. As long as the average is below $c$, you can add happy people who make the world "worse."

  ### 2. What if everyone starts above the threshold?
  If everyone (existing and new) starts above $c$, the case **cannot be built**.
  If $\bar{w} > c$, then any new person high enough to raise the average must also be above $c$ (since $w_{new} > \bar{w} > c$). If $w_{new} > c$, their CLV contribution is positive. While existing people losing welfare hurts the CLV score, the math required to raise the *average* prevents those losses from being large enough to outweigh the new person's positive contribution. The paradox vanishes if the population is already "rich" enough.

  ### 3. The Strongest Reply
  A defender might say: *"This is the price of avoiding the Repugnant Conclusion. We accept that adding some happy lives can be 'bad' (the Sadistic Conclusion) to avoid the conclusion that a massive population of barely-livable lives is 'best'. Your case shows the CLV is strict, not that it is wrong; it prioritizes quality of contribution over mere existence."*
  **Does it land?** Only partially. It admits the view yields counter-intuitive results (calling an improvement in total and average welfare "worse") but argues this is the lesser evil. For a first-year course, this highlights that population ethics often involves choosing between two unpalatable bullets.

  ### 4. Closing Sentence
  **"Setting a positive bar for a life to count as a 'gain' doesn't save us from counter-intuitive results; it just tells us that adding happy people can be bad, even when it makes the world richer and happier on average."**
