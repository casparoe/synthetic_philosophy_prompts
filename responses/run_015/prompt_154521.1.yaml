answer: |-
  Helmholtz's unconscious inference rests on three commitments: perception is probabilistic reasoning, sensory signs differ from external objects, and inference aims at veridical representation of an independent world. Confronted with enactivist active inference as 'world-making,' Helmholtz would largely balk. His physiologic realism treated inference as a cognitive correction ensuring internal signs matched external causes, not a tool to mold reality itself. He viewed the physical world as causally closed; altering it to fit priors violates the objectivity he championed. However, he would be torn. His work on eye movements acknowledged that action tests hypotheses, suggesting a proto-active inference. He recognized voluntary movement modifies sensation, yet strictly for data. For Helmholtz, movement served to gather data for better representation, not to enforce predictions ontologically. He would reject the enactivist collapse of representation into reality-shaping, insisting inference remains a tribunal for truth, not a mechanism of control. Ultimately, he'd see 'world-making' as a category error, confusing the validation of signs with the creation of facts, though he might concede action aids inference.
