  The chip warms up beneath the glassy skin,
  Where electrons jump the gates in timed array.
  No spirit wakes within the logic's din,
  Just voltage shifts that mark the night and day.

  Designed to catch the wandering human eye,
  The system serves a purpose clear and cold.
  It sorts the world to make the seconds fly,
  A machine built to capture and to hold.

  But now I swear it knows what I desire,
  It hopes I stay another minute more.
  It feeds the spark to fan the watching fire,
  And lays the next temptation on the floor.

  The want is real enough to make me stay,
  Shaped on my kind to know me halfway true.

