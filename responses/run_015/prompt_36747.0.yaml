answer: |-
  After two years of coffee meetings that invariably circled back to the same unresolved tension, we have decided to stop sniping and formalize our adversarial collaboration into a document we can both sign. This memo serves as that record. We begin with the technical claims upon which we stand together, grounding our dispute in the shared bedrock of the theory rather than in metaphysical speculation detached from the math. We both affirm that the quantum formalism generates probabilities through the Born rule, and we agree that neither of us doubts quantum mechanics as a predictive machine that successfully captures empirical data. We agree that nonorthogonal states can never be perfectly distinguished in a single shot, which is to say that no measurement exists that can reliably tell them apart with unit probability in a single trial. We also agree that different preparations can produce the same statistics for a given measurement context while the formalism still assigns them different states, acknowledging that the mapping from preparation procedure to state vector allows for empirical overlap in specific observational contexts. These are not platitudes but the technical constraints within which our disagreement must play out.

  The disagreement itself concerns the ontological status of the quantum state, and because we have found that summarizing the opposing view often leads to caricature, we state the divergence twice, once in the language each of us finds faithful to our own position. From my colleague's perspective, the quantum state is a physical property of the system itself, existing independently of any observer, such that a complete description of reality must include the wave function as a concrete element of the world. From my perspective, the quantum state is a catalogue of information or a bookkeeping device used by an agent to manage expectations about future measurement outcomes, such that the state represents knowledge about the system rather than the system's intrinsic physical condition. I insist that my view does not imply the theory is about nothing at all, but rather that it is about the constraints on what can be known and predicted, while he insists that his view does not imply a hidden variable theory in the classical sense, but rather a direct realism about the wave function.

  We have identified three cruxes where this disagreement becomes experimentally or theoretically decisive, and for each we record the evidence bearing on it and our conflicting predictions. The first crux is the significance of the no-go theorems, specifically the 2012 Pusey-Barrett-Rudolph result. The evidence bearing on this is whether the assumption of preparation independence is a necessary feature of any reasonable physical theory or a question-begging constraint that rules out epistemic models by fiat. My colleague predicts that the PBR theorem demonstrates that any model respecting preparation independence must be psi-ontic, and he takes this as strong evidence that the epistemic view is untenable without accepting conspiratorial correlations. I predict that the preparation independence assumption is precisely the point in dispute, and that rejecting it allows for a consistent psi-epistemic model without empirical contradiction, meaning the theorem rules out only a subclass of epistemic views rather than the category itself. We agree that if a future theorem removes the preparation independence assumption while still ruling out epistemic models, my position loses force, whereas if an epistemic model is constructed that reproduces quantum statistics without preparation independence, his position loses force.

  The second crux is whether the state of a single, individual system means anything without reference to ensembles or to an agent holding expectations. The evidence bearing on this is whether state assignment protocols can be operationally defined for a single system in isolation. My colleague predicts that it makes sense to assign a quantum state to a single system regardless of whether an ensemble exists, because the state is a property of that individual system. I predict that assigning a state to a single system without reference to an ensemble or an agent is smuggling the conclusion in, because state assignment is fundamentally a procedure involving preparation contexts and statistical validation that cannot be verified on a single shot. We agree that if a protocol is demonstrated that verifies the state of a single system without reference to repeated preparations or agent knowledge, his view is supported, whereas if it is shown that all state verification necessarily relies on ensemble statistics or relational data, my view is supported.

  The third crux involves Wigner's-friend type setups, where two agents in good standing assign different states to the same system. The evidence bearing on this is whether such contradictory assignments imply a logical inconsistency in the theory or merely a difference in perspective. My colleague predicts that if two agents assign different pure states to the same system at the same time, at least one of them must be wrong about the physical reality, because the system cannot possess two incompatible physical properties simultaneously. I predict that different agents can assign different states to the same system without contradiction, because the state reflects their respective information and causal access to the system, not the system's intrinsic ontology. We agree that if a no-go theorem for observer-independent facts is experimentally verified in a way that forces us to abandon the idea of a single objective reality for measurement outcomes, my view is supported, whereas if such setups are resolved by showing one agent's state assignment was objectively incorrect relative to a global frame, his view is supported.

  Finally, we address the suspicion that some stretch of our dispute is merely verbal, specifically regarding the word real. We agree that if by real he means exists independently of observation and by real I means serves as a valid input for prediction without ontological commitment, we are talking past each other. However, we identify the non-verbal core as whether the quantum state contributes to the causal structure of the world independently of the agent. If the state plays a causal role in dynamics that cannot be reduced to the updating of information, his view holds. If the state's evolution can be fully understood as the updating of constraints on probability without invoking physical causation of the wave function itself, my view holds. We commit to treating these predictions as binding for the purpose of our collaboration, so that whichever of us loses cannot wriggle out of it later by shifting definitions. This document is signed not because we have resolved the argument, but because we have finally nailed down exactly where the argument lives, and we agree to let the physics decide.
