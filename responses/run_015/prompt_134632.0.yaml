answer: |-
  Here is the defended agenda, ranked by strategic value for an 18-month theoretical team.

  ### The Ranking

  1.  **Institutional Graft Failure** (Transmission mechanisms vs. content)
  2.  **Rhetorical Mechanics** (Usage in immigration/rights arguments)
  3.  **Reverse-Essentialism Trap** (The cost of defense)
  4.  **Family-Resemblance Cluster** (Ontological status)

  ### Defense of the Top Choice: Institutional Graft Failure

  This is the only angle that transforms the problem from a semantic stalemate into a structural diagnosis. The other three angles accept "Western values" as a fixed set of ideas and argue about their definition, usage, or defensibility. Angle 3 shifts the ontology: it treats values not as free-floating propositions but as dependencies of specific institutional architectures.

  For a theory-only team, this is the highest leverage point. You are not asking "What are the values?" (which invites culture-war content battles) but "Under what structural conditions do normative claims remain coherent when transplanted?" This allows you to model transmission failure conceptually—focusing on legitimacy, enforcement, and interpretive communities—without needing empirical lab work or deep comparative history. It explains *why* the rhetoric fails (Angle 2) and *why* the cluster looks fragmented (Angle 1) without dissolving the subject matter entirely. It is generative rather than deflationary.

  ### Upstream/Downstream Logic

  **Angle 3 is upstream of Angle 1 and 2.**
  If values are functionally dependent on institutional graft, then the "family resemblance" (Angle 1) is not a metaphysical truth about the values themselves, but a symptom of fragmented transmission mechanisms. Similarly, the rhetorical contradictions (Angle 2) are downstream effects of trying to invoke values detached from their native institutional supports. You cannot fully resolve the rhetoric or the ontology without first modeling the transmission mechanism.

  **Angle 4 is a meta-constraint on all three.**
  The reverse-essentialism trap is not a research track but a boundary condition. Any work on Angles 1, 2, or 3 must be conducted in a way that avoids solidifying the category you are analyzing. It sits outside the ranking because it is a methodological warning label rather than a constructive inquiry.

  **Angle 1 is downstream (and terminal).**
  Determining whether the concept is a cluster is often the *conclusion* of a project, not the start. Prioritizing it risks a "deflationary dead end": you spend 18 months arguing that the concept is messy, conclude "it's a family resemblance," and publish nothing actionable. It is the least strategic use of limited funding.

  ### Tractability Check (18 Months, 2 Postdocs)

  *   **Angle 3 (Graft):** Tractable if kept strictly conceptual. You are building a model of normative transmission, not auditing specific legal codes. The risk is scope creep into political science. You must discipline the team to analyze the *logic* of graft, not the *history* of it.
  *   **Angle 2 (Rhetoric):** Highly tractable. This is standard conceptual analysis of public reason. You can catalogue argument structures and identify performative contradictions without leaving the library. It is the safest fallback.
  *   **Angle 4 (Trap):** Tractable but narrow. It yields a methodological paper, not a substantive theory.
  *   **Angle 1 (Resemblance):** Low tractability for high effort. Definitional debates rarely converge within 18 months.

  ### The Flip Condition

  My top choice (Angle 3) flips to **Angle 2 (Rhetorical Mechanics)** if preliminary modeling shows that "institutional graft" cannot be theorized without relying on contested empirical claims about specific legal histories.

  If you find that to explain *why* a value fails to graft, you must prove specific historical causalities (e.g., "This right failed in Country X because of Colonial Legacy Y"), you violate the "no comparative history" constraint. In that scenario, Angle 2 becomes the top choice because it remains purely internal to the logic of argumentation. It allows you to map the incoherence of the discourse without needing to prove the material causes of that incoherence.

  ### Summary Strategy

  Start with **Angle 3**. Frame the project as a theory of normative transmission. Use **Angle 4** as your internal review mechanism to ensure you aren't essentializing while you work. Keep **Angle 2** as your output pipeline (papers on specific rhetorical failures) if the structural model gets too abstract. Ignore **Angle 1** unless it emerges as a necessary conclusion; do not make it a starting premise.
