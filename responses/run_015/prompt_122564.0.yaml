answer: |-
  The Office of the Nomisma exists to align monetary convention with ethical reality, ensuring exchange serves virtue rather than greed. Our currency is not a natural commodity but a legal measure of demand, established solely to facilitate fair exchange within the household of the city. We remind citizens that tokens possess value only because the Assembly wills it, and that will is subject to change based on communal need. This page clarifies operational procedures regarding valuation, exchange ratios, and the strict prohibition of unnatural wealth accumulation. Compliance ensures the community remains virtuous and stable. Deviation suggests a fundamental misunderstanding of nature. Please review the following protocols before attempting any transaction within our borders.

  1. **How is the daily value of the clay token determined?**
  Value is not intrinsic to the material. It reflects the Weekly Demand Index, calculated by surveying actual community needs rather than market speculation. If the Assembly determines citizens require more shoes than houses, the shoe-claim token appreciates relative to the house-claim. This ensures money measures demand rather than distorting it. We adjust the nominal value every Monday at dawn to reflect the true standard of need. Hoarding tokens while demand shifts is actively discouraged. The token is merely a placeholder for real goods. Trust the Index, not the clay. Law dictates the measure, but demand dictates the standard.

  2. **What is the Diagonal Conjunction Compliance Form?**
  Before exchange, products and producers must be equalized to ensure justice. A builder cannot simply swap a house for shoes; the ratio of builder to shoemaker must match the ratio of house to shoes. You must file Form DCC-44 to establish this proportion before trade. The Office verifies that the traders are placed in the same ratio as the goods exchanged. Only then does the swap occur legally. This prevents unequal gain. Failure to file results in immediate transaction nullification and potential fines. Virtue requires mathematical proportionality in all trade. Do not attempt to bypass the diagonal conjunction process.

  3. **Why are savings accounts and interest prohibited?**
  Money was invented for exchange, not reproduction. Interest represents money breeding money, which is contrary to nature and the most unnatural form of wealth-getting. The Office of Usury Prevention monitors all deposits closely. If tokens appear to generate additional tokens without labor or direct exchange, the account is frozen and investigated. We distinguish between natural household management, which seeks enough for life, and unlimited wealth-getting, which seeks endless accumulation. The latter corrupts the soul. Save goods, not claims. Tokens must remain sterile. Any attempt to make them fertile is usury and will be punished by law.

  4. **Can I accumulate wealth for my heirs or future security?**
  Wealth-getting has a strict limit defined by the needs of the household. Accumulating beyond necessity is unhealthy and unnatural. The Office treats separate, unlimited piling-up of tokens as a distinct, pathological activity that harms the polity. You may store enough grain for winter, but infinite clay tokens serve no natural purpose. Virtue lies in sufficiency. Excess tokens will be reclaimed during Clay Token Reissue Day. Focus on living well, not counting high. The Assembly reserves the right to render hoarded tokens worthless to remind citizens that money is custom, not nature. Prepare accordingly for the annual reset.

  5. **What happens to my currency when I leave the city-state?**
  Convention does not travel across borders. Our tokens stop being money once you cross the gate because the law sustaining them ends at the boundary. Visitors are told to exchange claims for goods before departure. Foreign merchants often complain, but they mistake custom for nature. Money here is a local agreement, not a universal commodity. Do not attempt to spend Nomisma abroad. It becomes mere baked earth outside our jurisdiction. Plan your consumption accordingly. We do not recognize foreign claims on our internal measures. The value stays here. Take goods, not tokens, when you travel.

  6. **Critics say this system destroys investment. How do you respond?**
  Professor Ivor Bullion recently claimed banning interest will wreck everything, insisting money is a natural store of value. The Office finds this view confused. Money is not natural; it is legal. If investment requires unnatural breeding of tokens, it is not virtuous investment. We prioritize ethical exchange over financial growth. The Professor worries about wealth; we worry about the good life. Her economic models assume nature favors accumulation. We know better. The system works as intended to prevent corruption. Growth is not the goal. Sufficiency is. We remain calm in the face of such external confusion regarding natural limits.

  7. **What is Clay Token Reissue Day?**
  Once a year, the Assembly declares the old coins worthless to remind everyone that money is custom, not nature. On this day, all circulating tokens must be returned for revaluation. This prevents citizens from forgetting that the value exists only by law. It disrupts hoarding and resets the Demand Index. This is not a default; it is a philosophical correction. Do not panic when your savings vanish. They were never real wealth. Only goods are real. The ritual reinforces the distinction between conventional tokens and natural needs. Bring your clay. Leave with virtue. The Office will issue new measures based on current necessity.
