      *   **Claim:** SI doesn't vindicate OR for agents like us (finite data, specific UTMs). Time-bounded variants make OR empirical (the "modest-computation hypothesis").
      *   **Audience:** Mixed bag (Mainstream Epistemologists, 1 Bayesian Statistician, 1 Formal Epistemologist, 1 Philosopher of Science).
      *   **Task:** Draft a Q&A prep sheet (7-8 objections, attributed, ordered by damage, 2-min replies, confidence levels, bluff flags, concession advice, critique of the framing itself).
