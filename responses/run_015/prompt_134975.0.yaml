          *   *Reply:* Then SI fails. That's the point. It's not a priori.
          *   *Confidence:* High.

      *   *Objection 8 (The Hope-No-One-Asks):* "Is the 'Modest-Computation Hypothesis' just a restatement of the Uniformity of Nature?"
