  The espresso was cold, but neither moved to order fresh cups. The panel had run long, and the lobby was quieting down.

  "The graft case breaks your position," Dev said, stirring sugar into the cup he wasn't going to drink. "Finding three is the killer. When the subject says the seeming just *is* what the monitor delivers, you claim that explains away the hard problem. But is that subject a partial zombie?"

  Mara leaned forward. "The question presupposes a gap the subject themselves denies. If the introspective system is grafted, and it produces confident reports tracked by downstream behavior, the 'seeming' is constituted by that functional role. There's no leftover residue for a zombie to lack."

  "That's exactly the dodge," Dev replied. "You're explaining the occurrence of the judgment. You've told a causal story about why the system outputs 'it looks red.' But the hard problem isn't about the output; it's about the rational credentials from the subject's point of view. Why does that output strike them as authoritative? In the graft case, if the monitor is miscalibrated—finding two—the subject trusts the error over the sensory input. You've explained the malfunction, but you haven't explained why the subject feels *justified* in trusting it. A zombie outputs judgments; it doesn't feel entitled to them."

  Mara shook her head. "You're reifying the 'feeling of entitlement.' That feeling is just another introspective judgment, a higher-order report about the reliability of the first-order report. The meta-problem solves this by showing how the introspective system is architected to treat its own outputs as basic. In the graft case, the device is built to bypass error-correction channels. Once we explain that structural feature, we've explained why the hard problem seems compelling. We've explained why we deploy phenomenal concepts."

  "But what do those concepts represent?" Dev pressed. "This is the specification problem. When the grafted monitor issues a report, what does it represent the state as having? If you say it represents a functional role, you've changed the subject. The subject thinks they are representing a qualitative character. If you specify the content in purely structural terms without covertly drawing on phenomenal notions, you lose the subject's perspective. If you include phenomenal notions, you haven't solved the meta-problem; you've just assumed the hard problem."

  Mara didn't flinch. "I can specify it structurally. The introspective system represents first-order states as having specific discrimination profiles and attentional weights. It models the state as 'ineffable' because the system lacks access to the sub-personal processing that generated the state. It models it as 'intrinsic' because the representation is non-relational within the cognitive architecture. We can map the 'qualitative' content to isomorphisms in the monitoring space. The subject isn't wrong about the structure of their experience; they're only wrong about the metaphysical implication that structure requires non-physical properties."

  "That map leaves out the territory," Dev said. "You've explained why the judgment occurs, and even why it has the structural properties it does. But you haven't explained why those structural properties are accompanied by experience rather than darkness. In the graft case, finding three says the subject reports no gap. But is there a gap? Is the question answerable even in principle?"

  "If it's not answerable, it's not a genuine question," Mara said. "If the graft is behaviorally indistinguishable and introspectively opaque to the subject, positing a gap is idle. The meta-problem dissolves the hard problem by showing that the 'explanatory gap' is a cognitive artifact of the introspective system's design. Once we explain the design, the demand for further explanation vanishes."

  "But the demand doesn't vanish for the subject," Dev countered. "And philosophy starts from the subject's point of view. You're offering a third-person explanation of a first-person phenomenon. You've isolated the distinction I'm making: you can explain the occurrence of the judgment causally, but you cannot explain its apparent rational credentials without assuming the very phenomenality you're trying to explain. The subject feels the judgment is justified by the experience, not by the circuitry. If the graft creates a subject who judges without experience, they are a partial zombie. If you say that question is unanswerable, you're admitting the meta-problem leaves the core mystery intact."

  "It's not unanswerable; it's dissolved," Mara insisted. "The 'partial zombie' label only makes sense if you assume experience is an add-on. If experience is the operation of the monitor, there are no zombies. The meta-problem succeeds if it explains why we think there are zombies."

  Dev sighed, checking his watch. "We're stalemated on the principle. Let's try the protocol. What would count as evidence against your view? What development would force you to admit the hard problem remains?"

  Mara thought for a moment. "Empirical evidence of a dissociation between introspective reporting and the structural features I described. If we found a system that possessed the specific architectural features I claimed generate the 'phenomenal concept'—the opacity, the immediacy, the lack of error correction—but subjects using it did not report phenomenal qualities, or reported them differently than predicted, my functional specification would fail. I need the structural features to necessitate the judgments. If they come apart, the dissolution fails."

  "Fair," Dev said. "Mine is conceptual. If you could demonstrate that a complete functional specification of the introspective system logically entails the existence of phenomenal experience—that you cannot coherently conceive of the function without the feeling—I would have to concede. But you can't. So, I'll wait for your dissociation. I suspect you'll find the architecture always correlates with the feeling, but never explains it."

  "And I suspect," Mara said, picking up her coat, "that once you accept the structural explanation, the 'feeling' you're protecting will look like just another piece of the architecture."

  "Then we'll see which view the graft supports," Dev said. "Whether it builds a mind, or just a mimic."
