answer: |-
  This is a precise and demanding reading of the text. You have identified the exact pressure point where Aquinas's moral definitions meet political reality. To understand how the argument hangs together, we must see that Aquinas is not merely evaluating an action (resistance) but redefining the terms of the debate (what "sedition" and "people" mean).

  Here is the reconstruction of the logic, followed by an application to your scenario and an identification of the textual gap.

  ### I. Reconstruction of the Argument

  The argument proceeds by correcting a definition. Objection 3 assumes a colloquial definition of sedition; the *Respondeo* substitutes a technical, moral definition; the Reply applies this to tyranny.

  **1. Objection 3: The Equivocation**
  *   **Premise:** Removing a tyrant is praiseworthy.
  *   **Observation:** Removing a tyrant causes internal conflict (dissension).
  *   **Assumption:** Sedition = Internal conflict/dissension within a state.
  *   **Conclusion:** Therefore, some sedition is praiseworthy (not a mortal sin).
  *   **The Error:** The objection treats "sedition" as a neutral description of *fact* (fighting within the city) rather than a moral description of *injustice*.

  **2. The *Respondeo*: Redefining Sedition and People**
  Aquinas rejects the assumption that sedition is merely conflict. He argues from the nature of the "people."
  *   **Step A (Definition of Sedition):** Sedition is contrary to the **unity of the multitude**.
  *   **Step B (Definition of People):** Citing Augustine, Aquinas argues a "people" is not a mob. It is a fellowship united by **law** and **common good**.
  *   **Step C (The Link):** Therefore, the "unity" that sedition attacks is not mere absence of fighting, but the **unity of justice and common good**.
  *   **Step D (Moral Classification):** Because it attacks justice and the common good, sedition is a **mortal sin by its genus** (by its very nature).
  *   **Step E (Allocation of Guilt):**
      *   Those who disturb the common good = Seditious (Sinners).
      *   Those who **defend** the common good against disturbers = **Not Seditious** (Analogous to self-defense).
  *   **The Shift:** Sedition is not "conflict against the ruler"; it is "conflict against the *just* order." If the ruler is attacking the just order, conflict *against the ruler* may be defense *of the order*.

  **3. Reply to Objection 3: The Status of Tyranny**
  *   **Premise:** A tyrannical regime is **not just** (directed to private good, not common good).
  *   **Implication:** Because it is not just, it does not fully constitute the "unity of law and common good" described in the *Respondeo*.
  *   **Dissolution:** If the tyrant rules for private good, *he* is attacking the common good. Therefore, those who resist him are not attacking the "unity of the people" (which requires the common good); they are defending it. Consequently, their action does not fit the definition of sedition established in the *Respondeo*.

  ### II. Application to Your Scenario

  You ask about a ruler with lawful title who acts tyrannically (corruption, impunity, suppressing opposition) but maintains prosperity and efficiency.

  **1. Does prosperity defeat the claim of "Private Good"?**
  On Aquinas's terms, **no.**
  Aquinas inherits the Aristotelian view that the *common good* is not merely material welfare (prosperity/efficiency) but includes **justice** and the moral conditions of the community.
  *   In the *Respondeo*, the "unity of the multitude" is defined by "fellowship recognized by law and for the common good."
  *   If the ruler shields loyalists from accountability and disables opposition, he violates the "law" in the Augustinian sense (which implies justice, not just statute).
  *   Even if the economy booms, if the *ordo iustitiae* (order of justice) is subordinated to the ruler's enrichment and security, the regime is directed to the **private good of the ruler**. The prosperity is incidental or instrumental to maintaining power, not the final end of the regime. Thus, the Reply's claim stands: the government is not just.

  **2. Who is the "Seditious Party"? (The Legal Apparatus Problem)**
  This is the crux of your question. The ruler controls the formal legal apparatus. The resistors appeal to a "higher" common good.
  *   **Aquinas's Distinction:** Aquinas distinguishes between *positive law* (the ruler's statutes) and *law* in the Augustinian sense (ordinance of reason for the common good).
  *   **The Ruler's Enforcers:** If the ruler uses the state machinery to enforce private gain and suppress justice, they are disturbing the "unity of law and common good." According to the *Respondeo*, those who "disturb the common good" are the seditious party. Therefore, the ruler's enforcers are technically the authors of sedition, because they are fracturing the true unity of the people (justice) to maintain a false unity (order).
  *   **The Resistors:** If the resistors act specifically to "defend the common good" (restore justice/accountability) rather than for private factional gain, the *Respondeo* explicitly states they "are not themselves seditious, even as neither is a man to be called quarrelsome because he defends himself."
  *   **Conclusion:** On the internal logic of this passage, the label "seditious" attaches to the *moral quality of the action* (attacking the common good), not the *formal status of the actor* (state official vs. private citizen). The ruler's faction is seditious; the resistors are defenders.

  **3. Title vs. Exercise**
  You asked about the distinction between a ruler without title (usurper) and one with title who abuses it.
  *   **The Text's Silence:** This specific article does not explicitly distinguish between *defectus tituli* (defect of title) and *defectus exercitii* (defect of exercise).
  *   **The Text's Implication:** However, the definition of "People" (Augustine) makes the *exercise* of power determinative. A "people" exists only where there is fellowship in law and common good. If a ruler with lawful title destroys the common good, he dissolves the moral bond that makes the multitude a "people."
  *   **Result:** For the purpose of defining *sedition*, the distinction matters less than the effect on the common good. Whether the tyrant is a usurper or an abuser, if he directs the state to private good, he opposes the unity of the people. Therefore, resisting him is not sedition.

  ### III. The Gap in the Argument

  While the moral logic is consistent, the passage underdetermines the **procedural application**. There is a significant gap between the *definition* of justified resistance and the *authorization* of it.

  **1. The Epistemic Gap (Who Decides?)**
  The *Respondeo* says those who "defend the common good" are not seditious. The Reply says tyranny is not just.
  *   **The Problem:** The text does not specify *who* has the authority to judge that the common good is being violated.
  *   **In your scenario:** The ruler claims he is serving the common good (citing prosperity/efficiency). The resistors claim he is serving private good (citing corruption/impunity).
  *   **The Gap:** Aquinas provides a criterion for *what* makes resistance licit (defense of common good), but no criterion for *how* to verify this without causing the very dissension Objection 3 worries about. If every faction claims to defend the common good, the definition of sedition becomes useless for maintaining order.
  *   **Missing Distinction:** To close this gap, one would need a distinction between **private judgment** and **public authority**. (Later Scholastics like Suarez would argue that only the "whole community" or its representatives can judge tyranny, not private individuals. Aquinas hints at this in *De Regno*, but *ST* II-II q.42 a.2 does not explicitly restrict the "defenders" to public authorities).

  **2. The "Law" Ambiguity**
  The *Respondeo* defines the people by "fellowship recognized by law."
  *   **The Problem:** In your scenario, the tyrant controls the formal legal apparatus. He passes laws that legalize his corruption.
  *   **The Gap:** Aquinas relies on the Augustinian definition where "law" implies justice. But he does not explicitly address the conflict between **positive law** (the tyrant's statutes) and **natural law** (the common good).
  *   **Missing Distinction:** The argument requires the reader to accept that "law" in the definition of "people" refers to *just* law, not merely *enacted* law. If "law" means enacted statute, the resistors are breaking the law and thus breaking the "fellowship recognized by law." If "law" means just ordinance, the tyrant has already broken the fellowship. The text assumes the latter but does not argue for it here (though it is argued in *ST* I-II q.90).

  ### Summary

  On the terms of this passage:
  1.  **Sedition** is not conflict per se, but conflict against the **common good**.
  2.  **Tyranny** (rule for private good) is an attack on the common good.
  3.  **Therefore,** resisting a tyrant is **defense**, not sedition, regardless of the tyrant's formal title or the state's material prosperity.
  4.  **The Seditious Party** is the one disturbing the common good (the tyrant's enforcers), not the one resisting them.

  **The Limit:** The passage defines the *moral nature* of the act but lacks a *procedural mechanism*. It does not explain how to distinguish a true defender of the common good from a factional rebel without inviting the chaos Objection 3 fears. It assumes the injustice of the tyrant is manifest, leaving unresolved the question of who adjudicates that manifestness when the tyrant controls the courts and the economy.
