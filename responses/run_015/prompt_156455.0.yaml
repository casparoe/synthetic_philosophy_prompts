  ### Candidate Structures

  1.  **The "Insurance" Case:** An agent chooses to buy insurance (1-box) or not (2-box). A common cause (riskiness) makes risky agents less likely to buy insurance and more likely to suffer losses. *Discarded:* Mapping losses to "Box A" payoffs is counter-intuitive and risks conflating the "prize" with "avoided cost," muddying the Newcomb analogy.
  2.  **The "Charity Match" Case:** A donor matches donations from "altruists." Donating (1-box) costs money but signals altruism. *Discarded:* The payoff beneficiary (charity vs. agent) complicates the expected utility calculation, inviting objections about preference structure rather than decision theory.
  3.  **The "Grant Clawback" Case:** An agent chooses to claim a small stipend (2-box) or decline it (1-box). A committee has already decided on a large grant based on a profile correlated with stipend-claiming, but claiming the stipend triggers a means-tested benefit clawback. *Selected:* It fits the institutional constraint, maintains clear agent-centric payoffs, and cleanly separates causal cost from evidential gain.

  ### The Scenario: The Grant Clawback

  You are a researcher finalizing a funding application. A committee has already reviewed your file and decided whether to award a \$1,000,000 Principal Grant (Box A); their decision is fixed and sealed in an envelope, but they favor "Aggressive" candidates who tend to claim all available funds. You must now choose whether to claim a \$10,000 Travel Stipend (Box B). However, institutional rules state that claiming the Travel Stipend classifies you as "High Income," triggering an automatic clawback of \$20,000 from your existing baseline departmental support. You do not know if you are classified as "Aggressive" (correlated with receiving the Principal Grant and claiming the Stipend) or "Conservative" (correlated with receiving nothing and declining the Stipend), but you know the statistics: 90% of Stipend-claimers receive the Principal Grant, while only 10% of non-claimers do. You are a fully informed expected-utility maximizer.

  ### Verification of Specifications

  **Payoffs:**
  *   **Principal Grant ($V_A$):** \$1,000,000.
  *   **Travel Stipend ($V_B$):** \$10,000.
  *   **Clawback Cost ($C$):** \$20,000.
  *   **Net Value of 2-Boxing (Box B only):** $V_B - C = \$10,000 - \$20,000 = -\$10,000$.
  *   **Net Value of 1-Boxing:** \$0 (relative to baseline).

  **Probabilities:**
  *   **Causal Probability ($P_{CDT}$):** The Grant decision is fixed in the past. The act of claiming the Stipend cannot causally influence it. Thus, the probability the Grant is present on the causal counterfactual supposition that you take both boxes is the base rate, $P(A)$. Assuming an equal distribution of Aggressive/Conservative types in the population, $P(A) = 0.5(0.9) + 0.5(0.1) = 0.5$.
  *   **Evidential Probability ($P_{EDT}$):** The probability the Grant is present conditional on taking both boxes is given by the screening statistic: $P(A | 2\text{-box}) = 0.9$. Conversely, $P(A | 1\text{-box}) = 0.1$.

  **Arithmetic Check:**
  *   **CDT Expected Utility:**
      *   $EU_{CDT}(1\text{-box}) = 0.5 \times \$1,000,000 + 0.5 \times \$0 = \$500,000$.
      *   $EU_{CDT}(2\text{-box}) = 0.5 \times (\$1,000,000 - \$10,000) + 0.5 \times (-\$10,000) = \$495,000 - \$5,000 = \$490,000$.
      *   **Verdict:** \$500,000 > \$490,000. **CDT prescribes 1-boxing.**
  *   **EDT Expected Utility:**
      *   $EU_{EDT}(1\text{-box}) = 0.1 \times \$1,000,000 + 0.9 \times \$0 = \$100,000$.
      *   $EU_{EDT}(2\text{-box}) = 0.9 \times (\$1,000,000 - \$10,000) + 0.1 \times (-\$10,000) = \$891,000 - \$1,000 = \$890,000$.
      *   **Verdict:** \$890,000 > \$100,000. **EDT prescribes 2-boxing.**

  The specifications are met: CDT one-boxes, EDT two-boxes, driven by the structure rather than stipulation.

  ### Theoretical Reasoning and the Divergent Cell

  **Causal Decision Theory:** CDT treats the Grant's presence as causally independent of the current choice. It recognizes that claiming the Stipend (2-boxing) causally triggers a net loss of \$10,000 (\$10k stipend minus \$20k clawback). Since the Grant money is already fixed, 2-boxing strictly dominates 1-boxing *only if* the Stipend is net positive. Here, the Stipend is net negative. Therefore, CDT avoids the causal loss, prescribing 1-boxing.

  **Evidential Decision Theory:** EDT treats the choice as evidence. Claiming the Stipend is strong evidence ($90\%$) that the agent is "Aggressive" and thus holds the \$1,000,000 Grant. Declining is strong evidence ($90\%$) that the Grant is absent. EDT calculates that the expected gain from the Grant (correlated with 2-boxing) vastly outweighs the certain net loss of the Stipend. Therefore, EDT prescribes 2-boxing.

  **The Single Feature:** The disagreement lives entirely in the **probability weight assigned to the 'Grant Present' state when evaluating the '2-Box' act**. In the decision matrix, this is the cell corresponding to **(Action: 2-Box, State: Grant Present)**. CDT weights this cell by the unconditional probability $P(A) = 0.5$. EDT weights this cell by the conditional probability $P(A | 2\text{-box}) = 0.9$. Because the payoff in this cell (\$990,000) is so large, this divergence in probability assignment flips the preferred action.

  ### Ablation Analysis

  1.  **Remove the Clawback (Make Box B Net Positive):** If the Stipend has no cost ($C=0$), the net value of 2-boxing is $+\$10,000$. CDT now calculates $EU(2\text{-box}) = 0.5 \times \$1,010,000 + 0.5 \times \$10,000 = \$510,000$. Since \$510,000 > \$500,000, CDT switches to 2-boxing. The case collapses into a standard dominance scenario where both theories agree (or a standard Newcomb case if the correlation were reversed).
  2.  **Remove the Correlation (Make $P(A|2b) = P(A|1b) = 0.5$):** If claiming the Stipend provides no evidence about the Grant, EDT calculates $EU(2\text{-box}) = 0.5 \times \$990,000 + 0.5 \times (-\$10,000) = \$490,000$. Since \$490,000 < \$500,000, EDT switches to 1-boxing. The case collapses into a plain incentive problem where the net cost of Box B dictates the choice for both theories.

  ### Objection and the "Money" Taunt

  **Strongest Objection (from a CDT Defender):** "This case rewards irrationality. The correlation between claiming the stipend and receiving the grant is spurious from the perspective of agency; the agent cannot *cause* the grant by claiming the stipend. By 2-boxing, the EDT agent is merely 'news-managing,' betting on a fixed past state they cannot influence. That they win money on average is due to the environment rewarding a specific trait (aggressiveness), not because their decision theory is superior. A rational agent should not pay a causal cost (\$10k loss) to signal a trait they cannot currently change."

  **The Money Taunt:** The familiar taunt is that "Two-boxers (CDT) leave money on the table." In standard Newcomb problems, CDT agents end up with less money than EDT agents. In *this* Reverse Newcomb scenario, the EDT agent (the Two-boxer) ends up with \$890,000 (expected), while the CDT agent (the One-boxer) ends up with \$500,000 (expected). Therefore, the taunt **bounces off** Evidential Decision Theory here; in fact, it cuts the other way, suggesting CDT is the theory leaving money on the table. This demonstrates that the "money" argument is symmetric and depends entirely on the payoff structure, not the intrinsic superiority of one theory.

  ### Reflective Conclusion

  The existence of this case demonstrates that the standard slogan ("EDT one-boxes, CDT two-boxes") is largely an artefact of the standard payoff structure (where Box B is a free bonus and Box A correlates with 1-boxing). When Box B is a net liability and Box A correlates with 2-boxing, the verdicts reverse. However, this reveals something deeper than mere artefact: it highlights that the fundamental divergence between CDT and EDT is not about one-boxing versus two-boxing per se, but about **whether rational choice should respect causal dominance or evidential correlation**. CDT insists on causal dominance (avoiding the net loss of Box B), while EDT insists on evidential optimization (leveraging the correlation with Box A). The "Reverse Newcomb" case proves that neither theory has a monopoly on "winning" money; their performance is contingent on whether the environment rewards causal influence or evidential signaling.
