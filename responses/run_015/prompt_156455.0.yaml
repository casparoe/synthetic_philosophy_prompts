andidate structures first, say in a sentence each why you are discarding the others, and then develop the one that survives.

  Once you have the scenario, show that it meets the specification rather than asserting that it does. Give explicit numbers — the payoffs and the two probabilities that matter, namely the probability that the large prize is present on the causal counterfactual supposition that the agent takes both boxes and the probability that it is present conditional on the agent taking both boxes — and check the arithmetic so that each theory's preferred option really does come out ahead on its own formula, including the case where the agent takes the single box. Then walk through each theory's reasoning briefly, and tell me which single feature of the case is doing the work: I expect the whole disagreement to live in one cell of the decision matrix, and I want you to say plainly which cell that is. Follow this with an ablation: remove or weaken that feature and show what verdicts you get instead, so I can see whether the case collapses back into a plain incentive problem, into a smoking-lesion problem, or into something else. Then give me the strongest objection available to a defender of whichever theory comes out worse here — how exactly would they attack the case rather than accept the verdict? — and say whether the familiar taunt that one-boxers aim at two-boxers, that people who reason their way to the two-box verdict do not in fact end up with the money, cuts against evidential decision theory in your scenario or bounces off it. Finish with a short reflective paragraph on whether the existence of your case shows that the standard slogan about which theory one-boxes is merely an artefact of the usual payoff structure, or whether it reveals something deeper about the difference between causal and evidential expected utility. If you conclude that the specification cannot be met without cheating, say so and explain precisely which constraint forces the failure; an honest negative result is more useful to me than a case that smuggles the verdicts in. Please think carefully an