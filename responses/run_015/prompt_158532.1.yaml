answer: |-
  **Brainstorming Moving Parts:**
  *   **Core Conflict:** Institutional impartiality (rotation protocol) vs. Personal Integrity (ground project/mentorship).
  *   **The Williams Hook:** The surgeon must refuse *because* of the project, not because the math works out.
  *   **The Niche Feature:** An impartial justification (patient outcomes) exists but must remain unused motivically. Using it makes the action moral calculation; ignoring it makes it integrity.
  *   **The Consequentialist Counter:** The protocol serves the greater good (systemic efficiency); personal attachment is bias.
  *   **The Collapse Condition:** If the ground project is removed, the refusal looks like mere favoritism.
  *   **The Critic:** Integrity is a fetish; if impartial reasons exist, they *must* be the motive.

  ***

  **The Scenario**

  Dr. Silas Vance faces a mandatory rotation order under the hospital's new "Fluid Staffing Initiative," demanding he release resident Mara Chen after six years of specialized neurosurgical training to ensure equitable exposure across the department. The administration cites systemic fairness, yet Vance's file contains verified data showing their specific pairing reduces complication rates in complex glioma cases by 18%, an impartial, institutionally-valid metric that could technically exempt him from the protocol. However, Vance ignores this data in his appeal, arguing instead that finishing Chen's training is constitutive of his life's work as a teacher and that abandoning the apprenticeship now would render his own professional narrative incoherent. He refuses the order not because the numbers favor him, but because complying would require him to treat the relationship as a disposable resource rather than the vocation itself, prioritizing the completion of the mentorship over the administrative logic even when the administrative logic could be beaten on its own terms.

  **The Analysis**

  (1) **Williams's Verdict:** Williams would vindicate Vance. The demand that Vance justify his refusal solely through the impartial data (the 18% reduction) alienates him from his own action. For Williams, integrity is preserved when an agent acts from their "ground projects"—the commitments that give their life substance—rather than stepping outside themselves to view their relationships as mere vessels for utility. Vance is justified because requiring him to cite the complication rates would be "one thought too many"; it would force him to mediate his commitment to Chen through an impersonal calculus, thereby destroying the very quality of the commitment that makes the refusal meaningful.

  (2) **The Rule-Consequentialist Contrast:** A rule-consequentialist administering the protocol would argue that Vance's refusal is impermissible bias. Even if this specific pairing yields better outcomes, the *rule* of rotation maximizes overall competence and prevents bottlenecks in the long run. They would insist Vance *must* use the 18% data to justify an exception, or else submit. To them, Vance's appeal to "professional narrative" is morally inert sentimentality; if the action is right, it must be justifiable by generalizable outcomes, not personal coherence.

  (3) **The Philosophical Workhorse:** The critical feature is the *availability but motivic rejection* of the impartial justification. This distinction does the heavy lifting: it proves Vance isn't merely ignoring the greater good (which would make him selfish), but rather rejecting the *authority* of the impartial standpoint over his identity. If you strip away the ground-project element—making the mentorship just a task rather than a constitutive part of his self-conception—the case collapses into simple favoritism. Without the ground project, there is no integrity to violate, only efficiency to be lost.

  (4) **The Critic's Attack:** A critic, perhaps a hard-line Kantian or Utilitarian, would argue that Williams confuses psychological necessity with moral justification. They would claim that in a public institution, private integrity cannot override public duty unless backed by impartial reasons. By refusing to use the 18% data, Vance is actually being less honest; he is masking a potentially valid public reason (patient safety) with a private one (his identity) to protect his ego. The critic asserts that if the ground project conflicts with the impartial good, the project must yield, and Williams's defense merely sanctifies irrational attachment under the label of "integrity."
