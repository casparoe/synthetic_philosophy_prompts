answer: |-
  The flaw in your argument lies precisely in **Step (12)**.

  ### The Diagnosis: A Category Mistake

  **Step (12)** claims that plagiarism is conceptually incoherent because there is no "another's idea" to misattribute. This step fails because it conflates **property norms** (who owns this?) with **truth-telling norms** (who made this?).

  *   **Why it fails:** Plagiarism is not a property violation; it is a fraud violation. Even if no one owns the *idea* (the type), and even if copying the *token* is not theft (as Step 11 correctly concludes under your premises), claiming you generated a token you did not generate is a lie about causal history. It misrepresents your own labor and reputation. The incoherence you sense arises because you are trying to ground attribution in *ownership*, when attribution is actually grounded in *honesty*.
  *   **Why it seemed plausible:** In modern software engineering, copyright licenses (like MIT or GPL) bundle the right to copy with the requirement of attribution. Because these norms are legally and culturally packaged together, it feels intuitive that if the property right (copyright) falls, the attribution right must fall with it. Furthermore, colloquial language speaks of "stealing ideas," which reinforces the confusion between theft (taking) and plagiarism (lying).

  You can consistently hold (1) and (3) (ideas are non-rivalrous and unownable) while rejecting (12) (plagiarism is incoherent). You simply shift the moral basis of plagiarism from **property** to **veracity**.

  ---

  ### The Costs for Alternative Frameworks

  If the three major philosophical frameworks accept your premises (1) and (3) but reject Step (12) to save the intuition that plagiarism is wrong, they each incur specific theoretical costs. They must explain why attribution matters without relying on the exclusivity of ideas.

  #### 1. Lockean Labour-Mixing Account
  *   **The View:** Individuals own the fruits of their labor.
  *   **The Cost:** **Decoupling Labor from Exclusivity.**
      Traditionally, Lockean IP arguments claim that mixing labor with an idea creates a property right *over the idea*. If they reject Step (12) while accepting your Premise (3) (no natural right to exclude others from the idea), they must argue that labor mixing creates a right to **attribution** (a personal right) but not **exclusion** (a property right).
      *   *The Price:* This fractures the Lockean theory. It must distinguish between labor that creates rivalrous property (a chair) and labor that creates non-rivalrous reputation (code). It complicates the "mixing" metaphor: you mix labor with the code to own the *credit*, but not the *logic*. This weakens the Lockean defense of copyright, as it concedes that the "fruit" of the labor is not the exclusive control of the output, but merely the social acknowledgment of the input.

  #### 2. Pure Consequentialist Incentive Theory
  *   **The View:** IP rights are justified only because they incentivize creation that wouldn't otherwise happen.
  *   **The Cost:** **The Burden of Distinguishing Incentives.**
      If they reject Step (12), they admit that attribution norms (reputation, peer recognition) function as incentives independent of property rights.
      *   *The Price:* They lose the argument that *exclusivity* is the necessary condition for production. They must now empirically demonstrate that while attribution incentivizes *some* creation (as seen in open source), monopoly rights are still required for *specific kinds* of high-cost creation (e.g., pharmaceuticals or enterprise OS development). They can no longer claim "no IP = no creation"; they must argue "no IP = less *commercial* creation." This forces the theory into a nuanced, empirical debate rather than a principled stand, requiring them to justify why property incentives are superior to reputation incentives in specific contexts.

  #### 3. Social-Contract View of Information Goods
  *   **The View:** IP is a bargain between society and creators (e.g., disclosure in exchange for temporary monopoly).
  *   **The Cost:** **Enforcing Non-Property Norms.**
      If they reject Step (12), the social contract must include norms of honesty regarding authorship, even without property transfer.
      *   *The Price:* The contract becomes harder to administer. Property violations (copying) are binary and easier to adjudicate legally. Truth violations (plagiarism) are often contextual and social. A contract that enforces "don't lie about authorship" without granting "don't copy" requires robust community governance or reputation systems rather than simple state coercion. The state is generally good at enforcing property boundaries but poor at enforcing professional honesty. This shifts the burden of enforcement from the legal system to professional communities, increasing the transaction costs of maintaining the norm.

  ### Summary
  By rejecting **Step (12)**, you preserve the moral intuition that plagiarism is wrong without surrendering your core insight that ideas are non-rivalrous and unownable. You simply reclassify plagiarism from a crime against **property** to a crime against **trust**. This allows you to maintain an open-source ethos (free sharing of code) while condemning the misrepresentation of labor (claiming credit for others' work).
