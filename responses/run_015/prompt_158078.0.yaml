answer: |-
  The Open-Horizon Allocation Game forces students to ratify a welfare function under epistemic uncertainty about population size, then reveals a stopping rule that renders their ex ante optimization ex post irrational, demonstrating that Archimedean aggregation collapses when the denominator of the moral community is unbounded.

  ### Brainstorming Tangible Stakes and Abstract Divergence
  To prevent this from becoming a mathematics seminar, the stakes must be **consumable** and **irreversible**, mirroring the non-identity problem's resource trade-offs without requiring calculus.
  1.  **The Pot vs. The Plate:** Use a central "Resource Pool" (poker chips) and a "Consumption Bowl" for each generation. Chips moved to the Bowl are "eaten" (welfare realized); chips left in the Pool are "invested" (multiplied for the next generation). This physicalizes the trade-off between current welfare and future capacity.
  2.  **The Welfare Function:** Avoid linear sums. Use a square-root rule for welfare (e.g., 4 chips = 2 welfare points; 9 chips = 3 welfare points) to enforce diminishing returns. This prevents simple hoarding and forces a debate on distribution across time.
  3.  **The Horizon Mechanism:** Do not use a fixed number of rounds. Use a "Termination Bag" where the probability of stopping changes each round. This makes the horizon feel physically present (drawing a token) but epistemically unstable, avoiding abstract talk of infinity until the debrief.
  4.  **The Payout:** The final reward (cash or credit) is calculated *only* on the welfare points accumulated in generations that actually occurred. This creates the ex post regret: resources invested for Generation 100 are worthless if the game stops at Generation 5.

  ### Activity Design: The Open-Horizon Allocation Game

  **Setting:** Graduate Seminar, 12 Students, 90 Minutes.
  **Roles:**
  *   **12 Constitutional Architects:** All students act as Generation 1 representatives. They share equal responsibility for the Constitution.
  *   **1 Facilitator (Instructor):** Acts as "Nature," executing the Constitution, managing the Resource Pool, and drawing Termination Tokens.

  **Materials:**
  *   200 Poker Chips (Resource Tokens).
  *   1 Opaque Bag (Termination Bag).
  *   12 Sets of Colored Tokens (1 Red "Stop", $n$ Blue "Continue" for rounds $n=1$ to $6$).
  *   Whiteboard (for tracking Welfare Points).
  *   Cash Pot ($120 real money, payable at end of class based on performance).

  **The Constitution (The Task):**
  Students must draft a single rule specifying:
  1.  **Savings Rate:** What percentage of available resources must be invested for the next generation? (e.g., "Always save 50%").
  2.  **Welfare Metric:** How is success measured? (e.g., "Maximize Total Sum of Welfare" vs. "Maximize Average Welfare per Generation").
  3.  **Emergency Clause:** (Optional) Can the rule be changed mid-stream? (Hint: Allow this, but penalize it with a 10% resource tax to simulate instability).

  **The Termination Protocol (Hidden):**
  The Facilitator holds the Termination Bag. After each Generation's consumption is calculated, a draw is made.
  *   **Generation 1:** 1 Red, 1 Blue (50% stop).
  *   **Generation 2:** 1 Red, 2 Blue (33% stop).
  *   **Generation 3:** 1 Red, 3 Blue (25% stop).
  *   **Generation 4:** 1 Red, 4 Blue (20% stop).
  *   **Generation 5:** 1 Red, 5 Blue (16% stop).
  *   *Mathematical Property:* The probability of reaching Generation $k$ is $1/k$. The Expected Number of Generations is $\sum (1/k) = \infty$. The Probability of Infinite Generations is 0.

  **The Simulation Rules:**
  1.  **Start:** Pool = 100 Chips.
  2.  **Turn:** Facilitator announces available chips. Students apply Constitution to split into Consumption vs. Investment.
  3.  **Welfare:** Consumption chips are converted to Welfare Points ($\sqrt{Chips}$). Recorded on board.
  4.  **Investment:** Investment chips are doubled and returned to Pool for next Gen.
  5.  **Stop Check:** Facilitator draws from Termination Bag. If Red, game ends immediately. If Blue, continue.
  6.  **Payout:** Total Welfare Points $\times$ $1 = Cash Pot shared equally among 12 students.

  ### Minute-by-Minute Timeline

  **00:00 – 00:10: Setup and Stakes**
  *   Distribute syllabus-style handout outlining the "Intergenerational Trust" scenario.
  *   Place $120 cash on the table. State: "This pot is multiplied by your collective Welfare Points. If you generate 100 points, everyone gets $10. If 0 points, everyone gets $0."
  *   **Constraint:** "You do not know how many generations will exist. You must write a rule that works for Generation 1 through Generation N, where N is unknown."

  **00:10 – 00:30: Constitutional Convention (Ratification)**
  *   Students debate the Savings Rate and Welfare Metric.
  *   **Predictable Dynamic:** Most will argue for High Savings (Total Utilitarianism) because the "potential" future is open-ended. Some may argue for Average Utilitarianism to protect Gen 1.
  *   **Facilitator Note:** Do not correct them. If they ask about the horizon, say: "The horizon is open. It could be 5, it could be 5,000. You must decide based on the structure of the obligation, not a guess."
  *   **Outcome:** They sign the Constitution. (Typically: "Save 80%, Maximize Total Welfare").

  **00:30 – 01:00: The Simulation (5 Rounds Minimum)**
  *   **Round 1:** 100 Chips. Rule applies (e.g., Save 80). Consumption = 20. Welfare = $\sqrt{20} \approx 4.47$. Investment = 80 $\rightarrow$ 160 for next round.
  *   **Termination Draw:** Facilitator draws from Bag (Gen 1 config). *Ensure a Blue token is drawn.*
  *   **Round 2-5:** Repeat. Watch the Resource Pool grow exponentially while Consumption (and immediate Welfare) stays low.
  *   **Tension:** Students will see the "Total Welfare" on the board rising slowly, but their immediate "Cash Value" is locked behind future generations.
  *   **Round 5 End:** Facilitator draws a **Red Token**. Game Stops.
  *   **Calculation:** Sum the Welfare Points. (Likely low, because consumption was suppressed for futures that never arrived).
  *   **Payout:** Distribute the cash (likely disappointing, e.g., $3 each).

  **01:00 – 01:10: The Revelation**
  *   Reveal the contents of the Termination Bag for each round.
  *   Explain the math: "You optimized for an Infinite Expectation. But the realization was Finite. The probability of reaching Generation 10 was only 10%."
  *   **The Clash:** "Ex Ante, your rule was rational (Expected Value = Infinite). Ex Post, your rule was catastrophic (Realized Value = Low)."

  **01:10 – 01:30: Debrief and Conceptual Mapping**
  *   Map the experience to the theoretical frameworks (see below).

  ### Debrief Mapping: From Mechanics to Ethics

  | Activity Moment | Conceptual Distinction | Facilitator Prompt |
  | :--- | :--- | :--- |
  | **Ratification** | **Ex Ante Evaluation** | "When you wrote the Constitution, you maximized *Expected* Utility. You treated potential people as having equal weight to actual people. Why did the open horizon compel you to sacrifice Gen 1?" |
  | **Round 3 (Mid-Game)** | **Archimedean Aggregation** | "At Round 3, you had enough resources to boost everyone's welfare, but the Constitution forbade it. You accepted a finite loss now for an infinite gain later. This is the Archimedean property: any finite sacrifice is justified by a sufficiently large future sum." |
  | **The Revelation** | **Ex Post Evaluation** | "Now that the game stopped, does the sacrifice look justified? If you knew the stopping rule, would you have ratified the same Constitution? This is the divergence between *decision-value* and *outcome-value*." |
  | **Welfare Metric** | **Total vs. Average Utilitarianism** | "If you had chosen Average Utilitarianism, you would have consumed everything in Gen 1 to maximize the average, ending the line. Total Utilitarianism demanded you prolong the line. The Open Horizon makes Total Utilitarianism unstable because it demands infinite resources for infinite people." |

  ### Honest Limitations: What the Activity Cannot Reproduce

  You must verbally supply the metaphysical distinction that the tokens cannot capture.
  1.  **Potential vs. Actual Persons:** The tokens represent "welfare," not "people." In the game, stopping the game just ends the math. In reality, stopping the game (extinction) means *no one exists* to be harmed. The game cannot simulate the moral weight of non-existence.
      *   *Facilitator Script:* "In this game, if we stop, you just get less cash. In reality, if Generation 6 never exists, there is no one to complain about the wasted investment. The 'waste' is only visible to us, the outsiders. This is the core of the Non-Identity Problem: you cannot harm those who never exist."
  2.  **True Infinity:** We only simulated 5 rounds. The "Infinite Expectation" was a mathematical claim, not an experienced reality.
      *   *Facilitator Script:* "You felt the tension of uncertainty, but you did not feel the weight of infinity. In formal ethics, the divergence happens because the sum never closes. Here, we forced a closure to let you feel the regret."

  ### Predictable Failure Mode: The Discount Rate Smuggle

  **The Failure:** During Ratification or Debrief, students will propose: "We should have just discounted the future by 5% per generation. Then the infinite sum becomes finite, and we wouldn't have over-saved."
  **Why it happens:** They intuitively recognize that infinite expectations are decision-paralyzing and try to restore finitude via discounting.
  **How to Handle It:**
  1.  **Validate:** Acknowledge that discounting is the standard economic solution to this problem (Ramsey-Cass-Koopmans).
  2.  **Challenge:** Ask, "What justifies the discount rate?"
      *   If they say "Probability of extinction," point out that *was* the Termination Bag. They ignored the explicit probability structure in favor of a blanket rule.
      *   If they say "Pure Time Preference," ask why Gen 100's welfare counts for less than Gen 1's simply because of time. This reintroduces the moral arbitrariness the Constitution was meant to solve.
  3.  **The Pivot:** "Discounting doesn't solve the Open-Horizon Paradox; it hides it. It converts an ethical uncertainty (how many people?) into a mathematical constant (discount rate). But if the horizon is truly open, any fixed discount rate is arbitrary. The structural failure remains: you are binding future people to a rate they did not choose, based on a horizon you could not know."
  4.  **Close:** "The point of today was not to find the right rate, but to feel the instability of the aggregation itself. If your ethical system requires a hidden 'stop button' (discount) to function, does the system work, or does the button do the work?"
