      *   *Key Tension:* Pascal is a Jansenist. He believes in the radical corruption of nature. Justice in the "order of bodies/minds" is distinct from Charity in the "order of charity." Merging them too closely risks collapsing the orders.

  3.  **Deconstruct the Argument & Identify Potential Pitfalls:**

