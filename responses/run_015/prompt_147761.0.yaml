          *   *Risk:* Does Pascal mean "justice" here as *true* justice (divine) or *conventional* justice (human)? Usually, he means human justice is *defined* by force/custom. True justice is God's. If the user argues force is internal to *justice* simpliciter, they might conflate the orders.
          *   *Refinement:* The argument holds if restricted to the *order of politics/body* (the first order). In the postlapsarian state, "justice" available to humans *is* conventional justice.

      *   *Point 2: Social Epistemology Analogy.*
