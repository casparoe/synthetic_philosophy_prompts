  **Nomisma Protocol: White Paper v1.0**
  **Epigraph:** "Liquidity is virtuous only when it serves the completion of the household." — *Scholia on Distributed Ledgers*, Anonymous Lyceum Fellow.

  **Abstract**
  The Nomisma Protocol restores natural limits to decentralized finance. Contemporary markets suffer from *chrematistike*, the art of wealth-getting without limit, which severs the bond of community. Nomisma reimplements currency as a conventional pledge of future exchange, ensuring liquidity serves *oikonomia* (household management) rather than infinite accumulation. By encoding proportional requital into smart contracts, we guarantee that exchange holds the polis together rather than tearing it apart through usurious growth.

  **Problem Statement**
  Current tokens treat money as a good in itself, inviting unnatural breeding. When a coin fathers a coin, value detaches from human need. This violates the natural limit of household management, which aims at sufficiency. Unlimited accumulation is contrary to nature because no household requires infinite tools. Nomisma corrects this by restricting token utility to the facilitation of reciprocal exchange. The token is not a store of value but a surety that goods will be available when needed.

  **Tokenomics and Yield**
  Nomisma does not offer interest, as money is barren. Instead, holders participate in the Reciprocity Distribution. This yield is not generated by time-value but by community surplus redistribution. When a holder stakes tokens, they signal a delay in consumption. The protocol rewards this delay not because money grew, but because the community acknowledges the staker's temporary lack of liquidity relative to their need.

  The yield schedule is dynamic, calibrated to proportional requital. If Agent A provides shoes to Agent B, but B has no immediate goods, B issues Nomisma. The protocol ensures A receives a surplus later, commensurate with the initial need fulfilled. This is not profit; it is the restoration of equality. The smart contract calculates need via declared utility functions, ensuring no party accumulates beyond natural sufficiency. Excess tokens are automatically burned or redistributed to deficit holders, preventing the unnatural infinity of wealth.

  **Governance: The Shrine of the Graces**
  Transactions are not private. Following the model of the public shrine of the Graces, all ledger entries are visible to remind citizens of benefits received. Governance tokens are distributed based on virtuous exchange history, not capital contribution. This ensures the community remains bound by gratitude rather than debt. Validators are chosen based on their history of facilitating natural exchange, ensuring the network remains a bond of friendship rather than a marketplace for exploitation.

  **Risk Disclosures and FAQ**
  *Is Nomisma sound money?*
  Yes. Money exists by convention rather than nature, which allows us to legislate its stability. While convention can render currency worthless if changed, our convention is fixed by natural law, ensuring soundness despite the conventional basis.

  *What prevents hoarding?*
  The Midas Clause. If tokens remain stationary in a wallet beyond a natural consumption cycle, they undergo oxidative decay. This prevents users from turning all assets into liquid gold, which would starve the household. It enforces the truth that money is a means, not an end.

  *Can I lose my principal?*
  Only if you seek wealth beyond need. Since the token measures exchange rather than value, holding it without exchanging is contrary to its function. The protocol protects you from unnatural gains.

  **Conclusion**
  Nomisma is the first currency to admit it is barren. By accepting this limitation, we unlock true prosperity.

