  **Governance: The Shrine of the Graces**
  Transactions are not private. Following the model of the public shrine of the Graces, all ledger entries are visible to remind citizens of benefits received. Governance tokens are distributed based on virtuous exchange history, not capital contribution. This ensures the community remains bound by gratitude rather than debt. Validators are chosen based on their history of facilitating natural exchange, ensuring the network remains a bond of friendship rather than a marketplace for exploitation. The public nature of the ledger ensures that no benefit goes unremembered, securing the reciprocity that holds the city together. We reject anonymous wallets because anonymity breaks the chain of gratitude required for political friendship.

  **Risk Disclosures and FAQ**
  *Is Nomisma sound money?*
  Yes. Money exists by convention rather than nature, which allows us to legislate its stability. While convention can render currency worthless if changed, our convention is fixed by natural law, ensuring soundness despite the conventional basis. We rely on the user's agreement that the convention will not change, even though the defining feature of conventional money is that it can change.

  *What prevents hoarding?*
  The Midas Clause. If tokens remain stationary in a wallet beyond a natural consumption cycle, they undergo oxidative decay. This prevents users from turning all assets into liquid gold, which would starve the household. It enforces the truth that money is a means, not an end. Users wishing to store value must convert to real assets; Nomisma is only for exchange. Attempting to treat Nomisma as a store of value triggers the decay function, mimicking the fate of those who wish all they touch to become gold.

  *Can I lose my principal?*
  Only if you seek wealth beyond need. Since the token measures exchange rather than value, holding it without exchanging is contrary to its function. The protocol protects you from unnatural gains. Losses are only realized when one attempts to extract value from the medium itself rather than the goods it commands.

  **Conclusion**
  Nomisma is the first currency to admit it is barren. By accepting this limitation, we unlock true prosperity. Join us in building a finance that ends where nature intends.

