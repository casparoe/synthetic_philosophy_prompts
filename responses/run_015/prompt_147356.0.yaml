answer: |-
  Hi there, here is the revised plan for the eighty-minute slot that builds on what worked last time but tightens up the logistics so it feels less like a trick and more like a shared experiment. We want to avoid the feeling of being messed with, so the key change is transparency about the variable conditions without revealing who has which condition until the end. We will tell them upfront that we are testing how small changes in instruction affect behaviour, and ask them not to compare notes until the debrief, which respects their intelligence while preserving the data. We need two facilitators besides yourself to run this smoothly, one to stay in the room and one to stage the incident in the corridor, plus you to lead the discussion.

  You will need eighteen identical envelopes, each containing a standard request form and a slip of paper with specific instructions. Before the session, mark the bottom corner of nine envelopes with a tiny dot in pencil so you know which are which, but make sure this is invisible to the participants. The instruction inside all envelopes says to take the form to the kitchen and ask for a spoon, but the additional note differs. Half the envelopes say you are running five minutes behind schedule so please hurry, and the other half say you have ten minutes to spare so feel free to take your time. We are not telling them different things verbally to avoid room noise giving it away, so the envelope is the only source of the variable. You also need a stack of paper for the prediction exercise and pens for everyone.

  Start the session by welcoming them and acknowledging the post-lunch slump, then move straight into the private writing exercise for ten minutes. Ask them to write down answers to two questions on a sheet of paper they keep face down on their table. First, ask them to write yes or no to whether they would stop to help a stranger who dropped a pile of papers in a corridor. Second, ask them to write down one adjective that describes the sort of person who would walk past without helping. Emphasise that this is private and they do not need to share this with anyone yet. This sets the baseline for their belief in stable character without you having to explain the theory yet.

  Next, spend five minutes explaining the task. Tell them clearly that you are going to send them on a short errand one by one or in small groups and that you are testing how different instructions affect how people complete tasks. Ask them explicitly not to compare their specific envelope instructions with anyone else until everyone is back in the room, framing it as necessary for the data rather than a secret. This removes the sting of deception. Then hand out the envelopes randomly so friends do not necessarily get the same condition. Send them out in a staggered flow over twenty minutes so the corridor does not get crowded, which would ruin the staged incident.

  While they are gone, your co-facilitator who is not in the room should stand in the corridor near the turn towards the kitchen, holding a folder full of loose papers. They should not look like they are waiting for anyone, perhaps looking at their phone, and when a participant approaches, they should clumsily drop the folder so papers scatter. The key is to look mildly embarrassed and busy, not like they are begging for help. The observer, who should be you or the third facilitator, needs to watch from the doorway of the training room or a vantage point where you can see the corridor without being obvious. You are looking for two things: whether they stop to help, and whether they seem rushed or relaxed. If anyone asks what is happening, the corridor facilitator should just say they are a bit scattered today and thank them if they help, or just gather the papers themselves if the participant walks on. It is crucial that the corridor facilitator does not pressure them.

  Bring everyone back into the room with ten minutes to spare for the transition, then spend the remaining twenty-five minutes on the debrief. Start by asking them to look at the adjective they wrote down for the person who would not help. Ask for a show of hands for who wrote yes they would help, and then ask for a show of hands for who actually did help. There will almost certainly be a gap where some people who wrote yes walked past, or wrote a harsh adjective and then realised they nearly did the same thing. Let that silence sit for a moment. Then reveal the manipulation. Ask the group who had the instruction saying they were late, and who had the instruction saying they had spare time. Map this against who helped. You will likely find that the time pressure group helped less, regardless of what they predicted they would do.

  This is where you need to handle the sceptics carefully, including the grumpy experienced mentors who might feel manipulated. Invite the objection directly by saying that one might argue the people who stopped are simply the helpful kind of people and the others are not, and that a single corridor incident does not erase a lifetime of character. Ask the group if anyone feels that their action in the corridor truly reflects who they are or if it felt like a reaction to the note in the envelope. Validate the brother's point by admitting that this activity does not prove character is fake, only that it is fragile. Acknowledge that if you ran this again next week, some people might act differently, and that consistency over a lifetime is not something this room can measure. The goal is not to convince them that character does not exist, but that it is easily overwhelmed by small contextual pressures they did not notice in the moment.

  There are predictable things that might go wrong and you should be ready for them. If everyone helps regardless of the instruction, the data looks flat. In that case, pivot the debrief to focus on the stress they felt while hurrying, asking if that stress made them less open to noticing the world around them, which is still a situational effect. If everyone compares notes in the corridor and realises the instructions differ, acknowledge it openly and ask them how knowing that changed their feeling about the task, perhaps making them more compliant or more rebellious, which is still data about how context shapes action. If the corridor facilitator is recognised as a trainer, have them wear a coat or carry a badge they do not usually wear to look like centre staff, and if challenged later, admit that we used staff to stage the scenario but emphasise that the choice to stop was still theirs.

  Be honest about what this cannot show. It cannot show whether someone is consistent across their whole life, or whether the kind of character worth having is a rare thing or a local, situation-by-situation thing. It cannot prove that a saint would fail under enough pressure, nor that a selfish person would help under the right conditions. It only shows that in this room, on this afternoon, a sentence on a piece of paper shifted behaviour enough to create a gap between prediction and action. In the final five minutes, you can introduce the terms you have been avoiding. Explain that philosophers call the stable character view virtue ethics, and the view that context drives behaviour is often called situationism. Tell them you are not asking them to become situationists, but to remember this gap when they are mentoring. If a young person lets them down, it might not be a character flaw but a corridor effect, and if they themselves feel impatient, it might be the envelope not the person.

  End by thanking them for participating in the messiness of it, and remind them that the point of mentoring is often to help change the situation for a young person because we cannot always change their character directly. This lands the practical application without needing to win the philosophical argument. Make sure you collect the prediction sheets so they do not leave with evidence of their hypocrisy lying around, and destroy the envelopes afterwards so no one feels permanently labelled by which instruction they got. This keeps the trust intact for future sessions.
