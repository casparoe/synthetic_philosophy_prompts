  Here's a thinking process that leads to the suggested assignment materials:

  1.  **Analyze the Request:**
      *   **Role:** TA for a 3rd-year Social Norms class.
      *   **Task:** Create a 45-minute in-class essay prompt + model answer + marking guide.
      *   **Topic:** Lewis-style conventions vs. other norms (specifically evolution without agreement).
      *   **Specific Content:** Two campus cases provided by the user:
          1.  *Seminar Door:* Half-open vs. Closed signal for availability. Arbitrary, based on mutual expectations/conditional preference.
          2.  *Party Fund:* $5 contribution. Driven by fear of gossip/sanction (free-riding issue), not necessarily arbitrary coordination.
      *   **Requirements:**
          *   Force application of ideas (not just definitions).
          *   Key concepts to address: Conditional preference, mutual expectations, arbitrariness/alternative equilibria, precedent/no explicit deal.
          *   Evolution story: Trial-and-error/copying for Case 1, why it doesn't fit Case 2.
          *   Model Answer: ~600 words.
          *   Marking Guide: Out of 25, distinguish A vs. B, flag common blunders.

  2.  **Deconstruct the Theoretical Framework (David Lewis):**
      *   *Convention:* A regularity $R$ in a population $P$ in a recurrent situation $S$.
      *   *Key Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition* that others do (coordination problem).
          4.  There is at least one other possible regularity $R'$ that could have solved the problem (Arbitrariness).
          5.  General knowledge/common knowledge (often implied).
      *   *Evolution:* Conventions can emerge via salience, precedent, or evolutionary dynamics (replicator dynamics) without explicit agreement.
      *   *Contrast:* Social norms driven by sanctions (like the party fund) often lack the "arbitrariness" or the "conditional preference based on coordination" aspect. They are often Prisoner's Dilemmas solved by punishment, not Coordination Games.

  3.  **Drafting the Prompt:**
      *   Need to present the two cases clearly.
      *   Need to ask specific questions that map to the requirements.
      *   *Case 1 (Door):* Coordination problem. Half-open = Free, Closed = Busy. Could have been the reverse.
      *   *Case 2 (Party):* Cooperation problem. Pay $5 or face gossip. Preference is to not pay unless forced.
      *   *Task:* Identify which is Lewisian, explain why using specific criteria, and explain the evolutionary path for the Lewisian one vs. the other.

  4.  **Drafting the Model Answer:**
      *   *Word Count:* Target ~600 words.
      *   *Structure:*
          1.  Thesis: Case 1 is Lewisian, Case 2 is a sanction-backed norm.
          2.  Analysis of Case 1 (Lewis): Conditional preference (I want to match you), Arbitrariness (could be reverse), Expectations.
          3.  Analysis of Case 2 (Non-Lewis): Preference to free-ride, sanction-driven, not arbitrary in the same way (paying is strictly better if sanctioned).
          4.  Evolution: Case 1 evolves via trial-and-error/salience (focal point). Case 2 requires enforcement mechanism evolution.
      *   *Tone:* Academic but accessible (3rd year level).

  5.  **Drafting the Marking Guide:**
      *   *Total:* 25 points.
      *   *Breakdown:*
          *   Identification & Thesis (5 pts).
          *   Lewis Criteria Application (Case 1) (10 pts).
          *   Contrast with Case 2 (5 pts).
          *   Evolutionary Story (5 pts).
      *   *Differentiation:* A vs. B (Application vs. Definition dumping).
      *   *Blunders:* Confusing coordination with cooperation, missing "arbitrariness," ignoring "conditional preference."

  6.  **Refining and Polishing:**
      *   *Check:* Did I include the "evolution without agreement" part? Yes, need to ensure the model answer explains how the door signal started without a meeting.
      *   *Check:* Is the distinction clear? Case 1 = Coordination Game (Lewis). Case 2 = Prisoner's Dilemma/Norm with Sanctions (Not Lewisian in the strict sense, though often colloquially called a norm).
      *   *Check:* Word count on model answer. (Need to keep an eye on this during drafting).
      *   *Check:* Marking guide clarity. Make sure it helps the TA grade quickly.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* The prompt asks for "how norms can evolve without anyone agreeing to them." I need to make sure the evolutionary explanation is distinct for the Lewisian case.
      *   *Adjustment:* In the model answer, emphasize *salience* and *replication of success* for the door. For the party, emphasize that without sanctions, it collapses, so it's not a pure convention evolution.
      *   *Critique:* Make sure the marking guide explicitly penalizes "definition dumping."
      *   *Adjustment:* Add a specific criterion for "Application over Definition."

  8.  **Final Output Generation:** (Proceeding to generate the response based on these steps).
      *   *Prompt:* Clear, scenario-based.
      *   *Model Answer:* Tight, focused on Lewis's specific conditions.
      *   *Rubric:* Detailed, actionable.

  *(Self-Correction on Case 2)*: Wait, is Case 2 *never* a Lewis convention? Lewis conventions solve coordination problems. Case 2 is a cooperation problem (free riding). If everyone pays, everyone is better off, but individually I want to not pay. In Lewis conventions, I want to do what *you* do. In Case 2, I want to do the opposite of what *you* do (I want to free ride on your contribution). This is a crucial distinction. I must ensure the model answer highlights this "Conditional Preference" difference clearly. In Case 1, my preference *changes* based on yours (I want to match). In Case 2, my preference is fixed (I want to keep money), but my *action* changes due to threat. Actually, strictly speaking, if the norm is established, I prefer to pay *if* others pay and sanction me. But the underlying game structure is different. I will frame Case 2 as a norm sustained by sanctions rather than a pure coordination convention.

