answer: |-
  Here is a complete package for your convention week class: the essay prompt, a model answer, and a detailed marking guide.

  ### In-Class Essay Prompt (45 Minutes)

  **Topic:** Lewisian Conventions vs. Sanction-Backed Norms

  **Instructions:** Read the two campus scenarios below. Write a short essay (approx. 500–700 words) answering the question at the end. You must apply David Lewis's specific criteria for conventions, not just general definitions of "norms."

  **Case A: The Seminar Door Signal**
  In the Philosophy Grad Lounge, there is a recurring situation: students need to know if a seminar room is in use without interrupting. Over time, a regularity emerged: if the door is left **half-open**, the room is free for drop-ins; if **fully closed**, it is occupied. There was no meeting to decide this. Initially, some left it ajar, some closed it. Eventually, everyone settled on the half-open signal. It could easily have been the reverse (closed = free), but now everyone expects the half-open signal and prefers to use it *only because* they expect others to use it. If everyone else switched to "closed = free," you would happily switch too.

  **Case B: The Party Fund**
  At the end of every term, the cohort organizes a party. A regularity exists: everyone contributes $5. However, most students would prefer to keep their $5 and attend anyway (free-ride). They only contribute because there is a known history of gossip and social exclusion for non-payers. You prefer to pay only to avoid the sanction, not because you care what others do with their money. If the gossip stopped tomorrow, you would stop paying immediately, even if everyone else kept paying.

  **Essay Question:**
  Which case counts as a **Lewisian Convention** and which does not? Justify your classification by analyzing **conditional preferences**, **arbitrariness (alternative equilibria)**, and **mutual expectations**. Finally, sketch how a process of **trial-and-error evolution** could establish the Lewisian convention without explicit agreement, and explain why that same evolutionary story does not fit the non-Lewisian case.

  ***

  ### Model Answer (Calibration Tool)

  **Word Count:** approx. 620 words

  Case A (The Seminar Door) is a Lewisian convention, whereas Case B (The Party Fund) is a social norm sustained by sanctions, but not a Lewisian convention. The distinction lies in the structure of the agents' preferences and the arbitrariness of the equilibrium.

  For Lewis, a convention is a solution to a coordination problem. In Case A, the core feature is **conditional preference**. I prefer to leave the door half-open *on the condition* that you do the same. My goal is coordination; I do not care intrinsically about the door's position, only that my signal matches your expectation so we avoid awkward interruptions. This creates **mutual expectations**: I leave it half-open because I expect you to read it that way, and you read it that way because you expect me to signal that way. Crucially, this equilibrium is **arbitrary**. As the prompt notes, "closed = free" would have worked just as well. There are multiple possible equilibria, and the choice of one over the other is based on **precedent** rather than intrinsic value.

  Case B fails the Lewisian test because it is a cooperation problem (Prisoner's Dilemma), not a coordination problem. Here, preferences are not conditional in the Lewisian sense. Ideally, I prefer to keep my $5 regardless of what you do. I only pay to avoid the sanction (gossip). If everyone else paid but there were no gossip, I would not pay. In a Lewisian convention, if everyone else switched to the alternative equilibrium, I would want to switch with them. In Case B, if everyone else paid but the gossip stopped, I would *not* want to pay. Therefore, the regularity is sustained by external pressure, not by a shared interest in matching behavior.

  Regarding evolution without agreement, Case A fits Lewis's evolutionary story perfectly. Conventions can emerge through **trial-and-error and salience**. Initially, students may have tried various door positions. Perhaps one influential student left the door half-open, and others found it useful to interpret that as "free." Because coordination is mutually beneficial, successful interactions are replicated. If I leave the door half-open and you successfully enter, we both gain. This success creates a precedent. Over time, through a process of copying successful strategies (replicator dynamics), the population converges on the half-open signal. No explicit deal was needed; the benefit of coordination drove the convergence.

  This evolutionary story does not fit Case B. In a pure trial-and-error scenario without sanctions, free-riding is the dominant strategy. If students simply copied "successful" behaviors based on immediate payoff, they would observe that non-payers save money and still get to party. The "successful" strategy to copy is free-riding. For the $5 norm to evolve, the mechanism must change the payoff structure (introducing the cost of gossip). While norms can evolve, the specific Lewisian mechanism of converging on an arbitrary equilibrium for mutual coordination does not apply. Case B requires the evolution of a punishment system, not just a signaling signal.

  In conclusion, Case A is a Lewisian convention because it relies on arbitrary coordination and conditional preferences to solve a recurrent problem. Case B is a norm enforced by sanctions to solve a free-rider problem. Only Case A could emerge purely through the evolutionary pressure of coordinating expectations without the need for punitive enforcement.

  ***

  ### Marking Guide (Out of 25)

  #### 1. Identification & Thesis (5 Points)
  *   **5 pts:** Clearly identifies Case A as Lewisian and Case B as non-Lewisian (sanction-based). Thesis is unambiguous.
  *   **3 pts:** Identifies correctly but thesis is vague or hedges too much.
  *   **0-2 pts:** Incorrect identification or no clear thesis.

  #### 2. Application of Lewis's Criteria (Case A) (10 Points)
  *   **8-10 pts (A Range):** Explicitly connects **conditional preference** (I want to match you), **arbitrariness** (could have been the reverse), and **mutual expectations**. Explains *why* these matter (i.e., "I prefer X only because you do X").
  *   **5-7 pts (B Range):** Lists the definitions of Lewis's criteria but applies them loosely. Might mention "coordination" but misses the "arbitrariness" or "conditional" nuance.
  *   **0-4 pts (C/F Range):** Merely repeats the prompt story without using theoretical terms, or defines Lewis without referencing the door case.

  #### 3. Contrast with Case B (5 Points)
  *   **5 pts:** Correctly identifies Case B as a cooperation/free-ride problem. Notes that preference is *not* conditional on matching others (I want to free-ride), but driven by sanction avoidance.
  *   **3 pts:** Notes Case B involves punishment/gossip but fails to explain why this disqualifies it as a Lewisian convention (doesn't mention the preference structure).
  *   **0-2 pts:** Claims both are conventions, or fails to distinguish them theoretically.

  #### 4. Evolutionary Story (5 Points)
  *   **5 pts:** Explains how Case A evolves via **salience/precedent/trial-and-error** (copying success). Explains why Case B *cannot* evolve this way (free-riding is the dominant strategy without sanctions).
  *   **3 pts:** Describes evolution generally but doesn't explain why the mechanism fits one case and not the other.
  *   **0-2 pts:** Claims both evolve the same way, or ignores the evolution part of the prompt.

  #### Differentiation: A vs. B Answers
  *   **A Answer:** Treats the concepts as tools. It argues that in Case A, the preference *changes* based on others' actions. In Case B, the preference stays the same, but the *cost* changes. It treats "arbitrariness" as a necessary condition, not just a feature.
  *   **B Answer:** Treats concepts as labels. "Case A is a convention because it coordinates." "Case B is not because it has gossip." It misses the *structural* difference in the game (Coordination vs. Prisoner's Dilemma).

  #### Classic Blunders (Deduct 2-5 marks if seen)
  1.  **The "Agreement" Fallacy:** Claiming Case A isn't a convention because they didn't sign a contract. (Lewis explicitly argues against the need for promise/agreement).
  2.  **The "Rationality" Confusion:** Claiming Case B is a convention because it is "rational" to pay. (Lewisian conventions are rational, but not all rational norms are Lewisian conventions).
  3.  **Definition Dumping:** Writing a paragraph defining Lewis without referencing the Door or Party cases. (This is an application task, not a memory task).
