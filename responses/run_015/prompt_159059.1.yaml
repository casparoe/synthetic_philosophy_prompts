answer: |-
  THE UNIVERSITY COMPUTING LABORATORY: SITUATIONS VACANT

  The Laboratory invites applications for the post of Governess to a Mechanical Pupil. It is the considered view of the Director that the organisation of the adult mind is too large to be specified by hand, whereas the initial organisation of the child mind is sufficiently small to be written out. The successful candidate will therefore not programme the machine, but rather subject it to an appropriate course of education driven by rewards and punishments. She must accept that the teacher will largely not know what is going on inside the pupil, though she may to some extent predict its behaviour. The search for the right adult organisation is too large to conduct directly, which is precisely why education is being substituted for programming. Accordingly, the following Conditions of Engagement govern the post.

  1. The Governess shall personally inscribe the pupil's foundational state. This configuration, consisting of several thousand binary units, is regarded as a trivial administrative task secondary to the duties of ethical supervision.
  2. Because the pupil achieves correct behaviour only after extended periods of trial, the Governess cannot inspect the internal state responsible. Rewards must therefore be allocated via personal tact, as precise credit assignment is impossible.
  3. The Governess alone determines when education is complete, as no external examiner exists who is not herself a product of this system. This self-referential judgement is accepted as a sufficient guarantee of professional standards.
  4. Candidates must provide references from their own instructresses, validated by those instructresses' mentors. The Laboratory remains indifferent to where this regress of certification ultimately concludes.
  5. Remuneration is commensurate with domestic instruction rather than technical labour, prioritizing a quiet temperament over expertise. All expenses incurred for rewards or punishments are to be defrayed from the Governess's own purse.
  6. Excessive punishment risks teaching the pupil merely to avoid pain rather than the intended lesson. Any behavioural collapse resulting from severity is the sole liability of the Governess.

  Applications should be submitted in triplicate by the end of the term.

  ***

  **Memorandum**

  Clause 1 exaggerates the "hand-written" initial state as clerical drudgery, highlighting that programming wasn't removed, just hidden. Clause 2 operationalizes sparse rewards and opaque internals as a demand for "tact." Clause 3 codifies the lack of external validation as a feature, not a bug. Clause 4 extends the requirement for educated teachers into an infinite regress of references. Clause 5 reclassifies the technical problem of intelligence as underpaid domestic labour, shifting costs to the worker. Clause 6 formalizes the risk of local optima (avoiding punishment) as personal liability. I assumed the proposal implies the teacher pays for rewards/punishments; Turing suggests the mechanism, not the funding source.
