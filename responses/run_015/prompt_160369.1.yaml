answer: |-
  Here is the analysis of the COP26 episode based on your stipulated facts and theoretical constraints.

  ### 1. Mapping the Blaming Relations

  We can identify four distinct blaming relations within the stipulated facts. Note that in international climate negotiations, the speech act is rarely pure *sanction* (punishment) but rather *moral address* (a demand for justification or action) backed by the threat of reputational censure.

  | Blamer | Target | Norm Invoked | Speech Act Type | Blamer's Implication |
  | :--- | :--- | :--- | :--- | :--- |
  | **Rich-Country Negotiator** | Coal-Dependent Developing Country | **Mitigation:** Parties must phase out high-carbon infrastructure (coal) to meet global targets. | **Moral Address:** A demand for policy change within a negotiated framework. | **Violates Same Norm:** Has missed previously accepted targets; participates in high-emission economy. |
  | **Private-Jet Delegate** | Coal-Dependent Developing Country | **Consistency/Efficiency:** Parties must minimize carbon footprint to secure legitimacy for cuts. | **Moral Address:** Implicit demand via presence; explicit if they lecture on austerity. | **Violates Same Norm (Scale):** Commits the very type of act (high emission) condemned, at higher intensity. |
  | **Island-State Delegate** | High Emitters (Rich Countries) | **Safety/Survival:** Parties must not emit at levels that threaten territorial integrity of others. | **Censure/Moral Address:** Public shaming coupled with a demand for restitution/protection. | **Victim/Non-Implicated:** Negligible emissions; suffers the harm the norm seeks to prevent. |
  | **Commercial-Flight Activist** | Private-Jet Delegate | **Integrity:** Agents advocating carbon reduction must minimize personal carbon footprint. | **Social Sanction:** Public reputation damage (naming-and-shaming in media). | **Participates in Practice:** Uses carbon-intensive transport, but at significantly lower scale. |

  ### 2. Running the Standing Tests

  Here we apply your five candidate conditions to the four figures. "Pass" means the condition grants standing; "Fail" means it forfeits standing.

  | Condition | Definition | Private-Jet Delegate | Commercial-Flight Activist | Island-State Delegate | Rich-Country Negotiator |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict-Identity** | Must not have done the *very same act*. | **FAIL** (Flew jet vs. demands coal cuts? No. But if norm is "emit less," they emit more). *Verdict: Fail on emissions.* | **PASS** (Flew commercial, not private). | **PASS** (Did not fly jet; negligible emissions). | **PASS/FAIL** (Did not burn coal personally, but state did). *Verdict: Ambiguous.* |
  | **Same-Norm** | Must not have violated the *norm invoked*. | **FAIL** (Violated emission reduction norms). | **FAIL** (Violated emission reduction norms by flying). | **PASS** (Did not violate safety/emission norms). | **FAIL** (Missed past targets). |
  | **Domain** | Must not be implicated *anywhere in the domain*. | **FAIL** (Fossil economy). | **FAIL** (Fossil economy). | **FAIL** (Global economy relies on fossil fuels, even if state doesn't). | **FAIL** (Fossil economy). |
  | **Complicity/Benefit** | Must not *profit* from the practice condemned. | **FAIL** (Benefits from fossil infrastructure). | **PASS/FAIL** (Benefits from travel, but not profit from industry). *Verdict: Pass.* | **PASS** (Suffers loss, not profit). | **FAIL** (Economy benefits from historical emissions). |
  | **Selectivity** | Must not blame some while ignoring *equally culpable* others. | **FAIL** (Targets coal, ignores own jet). | **PASS** (Targets jet; own flight is not *equally* culpable). | **PASS** (Targets high emitters; no equally culpable others). | **FAIL** (Targets developing nations, ignores own missed targets). |

  **Discriminatory Power of the Conditions:**

  *   **The Island-State Divergence (Domain vs. Same-Norm):** This is the most critical theoretical friction point. The **Domain Condition** strips the Island-State Delegate of standing (they are part of the global economic domain that causes emissions). The **Same-Norm Condition** grants them standing (they have not violated the norm of safety/excessive emission). If your theory adopts the Domain Condition, the most morally urgent voice at COP26 is silenced. If it adopts Same-Norm, they are the only legitimate blamers.
  *   **The Activist Divergence (Strict-Identity vs. Same-Norm):** The **Strict-Identity Condition** grants the Activist standing to blame the Private-Jet Delegate (commercial flight $\neq$ private jet). The **Same-Norm Condition** strips them both (both emitted carbon). This tests whether your theory allows for *scalar* hypocrisy or demands *binary* purity.
  *   **The Negotiator Divergence (Selectivity vs. Strict-Identity):** The **Strict-Identity Condition** might let the Rich-Country Negotiator off the hook (they personally didn't burn the coal). The **Selectivity Condition** catches them (they blamed others for coal while ignoring their own state's historical coal/oil use). Selectivity captures the *political* hypocrisy that Strict-Identity misses.

  ### 3. Pushing the Episode Back Against the Theory

  **Problem One: Triviality and Scalar Standing**
  If the **Domain Condition** is enforced, standing collapses entirely. Every participant at COP26 relies on a fossil-fueled global supply chain (food, heating, technology). If being implicated in the domain forfeits standing, no one can blame anyone. The theory faces a dilemma:
  *   **Retreat to Strict-Identity:** This saves standing but renders it toothless (the Private-Jet Delegate can blame coal use because they didn't personally burn coal).
  *   **Adopt Scalar Standing:** The theory must admit degrees of standing. The Island-State Delegate has *more* standing than the Rich-Country Negotiator, who has *more* than the Private-Jet Delegate.
  *   **Theoretical Cost:** This requires abandoning the binary logic of "standing/no-standing" for a probabilistic or weighted model, which complicates the moral address. Does a blamer with 40% standing have their blame heard at 40% volume?

  **Problem Two: Official Capacity and Proxy**
  The Rich-Country Negotiator and Island-State Delegate speak as *offices*, not merely individuals.
  *   **Office-Holding:** If standing attaches to the *office* (the State), the personal hypocrisy of the negotiator (flying private) might be irrelevant. The State is the blamer. However, if the State itself is the hypocrite (missed targets), does the office cure the defect? Usually, no. An office cannot claim moral authority it does not possess.
  *   **Proxy Standing:** The Island-State Delegate purports to speak for the threatened (including future generations). Does this "borrowed standing" immunize them against the Domain Condition? If standing is transferable from victim to advocate, the Activist could theoretically borrow standing from the Island State to blame the Private-Jet Delegate. Your current apparatus treats standing as irreducibly personal; this case suggests it may be representational.

  **Problem Three: Remediation and Restoration**
  Suppose the Private-Jet Delegate lands, issues a confession ("I know this flight undermines my message"), and *then* blames the coal users.
  *   **Confession-then-Blame:** Does this restore standing? Under a **Same-Norm** condition, no—the violation remains. Under a **Complicity** condition, maybe, if the confession signals a break from the benefit.
  *   **Delegation:** Should the implicated blamer simply hand the microphone to the Island-State Delegate? This suggests standing is a *resource* that can be transferred.
  *   **Retroactivity:** If they confess *after* blaming, does it invalidate the prior speech act? If standing is a precondition for the act to "land," then the blame was null *ab initio*. If standing is a matter of reception, the confession might repair the uptake. The theory is currently silent on whether standing is a *felicity condition* (like a judge's gavel) or a *persuasive condition* (like a creditor's reputation).

  ### 4. Where the Apparatus is Silent

  1.  **Collective Agency:** The theory maps individual blamers. But at COP26, the primary blamers and targets are *States*. Can a State be hypocritical? If State A missed targets but demands State B cut coal, is that hypocrisy or realpolitik? Individual-level standing conditions do not scale cleanly to collective agents without a theory of collective intention.
  2.  **Generational Scale:** The Island-State Delegate blames on behalf of future citizens who do not exist. The Private-Jet Delegate benefits from past emissions they didn't personally create. The theory lacks a temporal dimension for standing. Can one lose standing for the sins of predecessors? Can one gain standing for the rights of successors?
  3.  **The Nature of the Act:** Is a negotiated text ("The Glasgow Climate Pact") an act of blame? Or is it policy? If it is policy, standing conditions might not apply (administrative authority suffices). If it is blame (naming and shaming laggards), then the hypocrisy of the drafters matters. The apparatus assumes blame is interpersonal address, not institutional output.

  ### 5. Bottom Line for the Piece

  **Is hypocrisy the right lens?**
  No. If you hang the piece on hypocrisy, you risk validating the **Strict-Identity Condition**, which lets the worst actors off the hook (the Rich-Country Negotiator who didn't personally burn coal) while silencing the most urgent voices (via the Domain Condition).

  **The Structural Scarcacy Thesis:**
  The COP26 episode demonstrates that in systemic crises, **standing is structurally scarce.** Because the "domain" (the fossil economy) is totalizing, *everyone* is implicated to some degree.
  *   If you insist on clean hands (Domain/Strict-Identity), you paralyze moral address.
  *   If you allow implicated blame (Same-Norm/Scalar), you must explain why the Island-State Delegate's blame lands harder than the Private-Jet Delegate's, even if both technically violate the "no carbon" norm.

  **Recommendation:**
  Use COP26 not to solve the hypocrisy puzzle, but to **dissolve** it. Argue that the traditional standing conditions are designed for discrete, interpersonal wrongs (e.g., a thief blaming a thief), not structural, collective harms. In a structural crisis, the relevant question is not "Do you have standing?" (because no one does), but "Who is best positioned to speak truth to power?"

  The piece works best if it concludes that **hypocrisy is a weaponized distraction** in climate politics. The Private-Jet Delegate uses accusations of activist hypocrisy (flying commercially) to deflect from the substantive blame (emissions). The theory should pivot from *forfeiture of standing* to *epistemic credibility*. The Island-State Delegate has standing not because their hands are clean (they are part of the global economy), but because their *interest* aligns with the norm.

  **Verdict:** The case works, but only if you use it to show the *failure* of individual-level standing conditions, rather than trying to make them fit. The "interesting failure" is indeed the structural scarcity of standing.
