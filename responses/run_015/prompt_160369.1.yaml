              *   Selectivity: Passes.
          *   **Rich-Country Negotiator:**
              *   Strict-Identity: Fails (Missed past targets).
              *   Same-Norm: Fails (Violated emission norms).
              *   Domain: Fails.
              *   Complicity: Fails.
              *   Selectivity: Fails (Targets others, ignores self).

      *   *Discrimination:* Where do conditions diverge?
          *   *Strict-Identity vs. Same-Norm:* Distinguishes Private Jet Delegate (flew jet vs. burns coal) from Rich Negotiator (missed targets vs. burns coal). Actually, Strict-Identity is too narrow for most climate blame.
          *   *Same-Norm vs. Domain:* Distinguishes Island State (violates no norm, but is in domain) from others. If Domain condition holds, Island States lose standing (they are in the fossil economy). If Same-Norm holds, they keep it. This is a crucial divergence.
          *   *Selectivity:* Distinguishes the Activist (who targets the jet) from the Jet Delegate (who targets coal users while ignoring own jet).

  4.  **Part 3: Pushing the Episode Back Against Theory:**

      *   *Problem 1: Triviality/Scalar Standing.* If "Domain" condition applies, everyone loses standing (we all use electricity/fossil fuels). Theory needs scalar standing (degrees of implication) or must retreat to Strict-Identity (which lets too many off the hook).
      *   *Problem 2: Official Capacity.* Does the Rich-Country Negotiator speak for themselves or the State? If the State missed targets, does the individual lose standing? Or does the Office grant standing regardless of personal history? What about Island States speaking for the threatened? Do they borrow standing from the victims (themselves + future gens)?
      *   *Problem 3: Remediation.* If the Private Jet Delegate lands, confesses ("I know this looks bad"), then blames. Does that restore standing? Or must they delegate blame to the Island State? Is there a "clean hands" proxy?

  5.  **Part 4: Silences:**

      *   *Collectives:* States aren't people. Can a State be hypocritical?
      *   *Generations:* Past emitters vs. future victims.
      *   *Nature of Act:* Is a negotiated text "blame" or "policy"?

  6.  **Part 5: Bottom Line:**

      *   Is it hypocrisy? Or is it structural scarcity?
      *   *Argument:* In a systemic crisis like climate change, *everyone* is implicated to some degree. Relying on individual standing conditions (hypocrisy) paralyzes necessary moral address. The interesting failure isn't individual hypocrisy; it's that the *structure* of the problem makes "clean hands" impossible, rendering traditional standing conditions obsolete or weaponizable.

  7.  **Drafting the Response:**

