      *   Relation 1: Rich Country Negotiator $\rightarrow$ Developing Country (Coal). Norm: Emission reduction. Act: Moral Address (Demand). Implication: Past violation of same norm.
      *   Relation 2: Island State Delegate $\rightarrow$ Rich Country (Emissions). Norm: Survival/Safety. Act: Moral Address/Censure. Implication: Non-implicated (victim).
