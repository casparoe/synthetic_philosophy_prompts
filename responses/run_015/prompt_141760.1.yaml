  *Header:*
  MEMORANDUM
  TO: Dr. Aris Thorne, Head of Safety, Helios
  FROM: Blaise Pascal
  DATE: 14 October 2023
  SUBJECT: On the Calculation of Ruin

  *Body:*
  You have asked me for a number. You want me to weigh Strategy W against Strategy A and tell you which expectation is lower. You have invited me because of the Wager. You assume I am the patron saint of the worst-case scenario, the man who bet everything on a sliver of probability because the payoff was infinite.

  You are half-right, and that is where you will fail.

  The Wager works only because the payoff is infinite. Multiply any non-zero probability by infinity, and the finite cost of belief vanishes. But your stakes are not infinite. You speak of $10^{50}$ future lives. That is a large number, but it is a number. It behaves like arithmetic, not theology. If the probability of catastrophe is small enough, the expected value of Strategy A drops below the cost of Strategy W. Mathematically, the Wager does not save you. If you rely on my reputation to bypass the arithmetic, you are using me as you use your evals: as a talisman.

  This brings me to why you are really here. You do not want a calculation; you want absolution. In my time, the Jesuits developed a method called casuistry. They constructed intricate cases of conscience to show penitents that their sins were not quite sins, or that the permission to sin was hidden in the margins of the law. They made morality flexible enough to accommodate human desire.

  When you say "expected harm is below threshold," I hear the Jesuit whispering in the confessional. You have taken a hard prohibition—"Do not extinguish the future"—and softened it into an accounting error. You say the risk is priced in. But you cannot price what you cannot measure. You have no formal bound on Strategy A. You have only a history of survival so far. To call this "expected value" is to dress a guess in a lab coat. It is casuistry for engineers. It allows you to build the weapon while claiming you have calculated the safety.

  So, which strategy? You want me to choose.

  Strategy A requires you to believe you understand the system better than you do. It relies on the distribution of your tests matching the distribution of the world. This is a act of faith disguised as empirical rigor. Strategy W admits ignorance. It accepts a lower capability in exchange for a boundary you can see.

  Here is the difficulty, and the part you often miss about my life. I was a Jansenist. We believed that grace was not something you could command by intellect. You cannot simply will yourself to believe, and you cannot simply will yourself to be safe. Belief comes through custom. If you want to know if a man is a believer, do not ask his theology; watch his knees bend. Practice precedes conviction.

  Apply this to your lab. You think your safety practices—your evals, your red-teaming, your monitoring—are measurements of the system. I suggest they are measurements of you. They are the rituals that form your custom. If your daily practice is running larger models and checking if they behave, you are accustoming yourself to danger. You are dulling the part of you that should feel fear. The "holy water" of your evals washes away the anxiety that ought to stop you. You are training yourselves to be comfortable with Strategy A.

  If you choose Strategy W, you are choosing asceticism. You are denying yourself the power you could have. This is painful. But it is the only practice that aligns with the reality of your ignorance. Strategy A builds a custom of reliance on systems you do not understand. Strategy W builds a custom of restraint.

  I will not give you the number you asked for. The number does not exist. You are trying to solve for a variable that is hidden from you. If you wait until you are certain the probability is high enough to justify restraint, you will have already lost. The uncertainty is not a gap in your data; it is the nature of the thing.

  You want to know if the Wager applies. It does not, because your stakes are finite. But the lesson remains: when the ruin is total, the calculation breaks. You cannot bet the house on a probability you cannot verify.

  Choose Strategy W. Not because the math proves it safe, but because the math for Strategy A is a lie you tell yourselves to sleep. Do not wait for the evidence to compel you. Act before you feel certain. If you wait for certainty, you are already betting on a god you have not met.

  B. Pascal

