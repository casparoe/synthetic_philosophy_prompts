  **FROM:** Blaise Pascal
  **DATE:** 14 October 2023
  **SUBJECT:** On the Calculation of Ruin

  You have asked me for a number. You want me to weigh Strategy W against Strategy A and tell you which expectation is lower. You have invited me because of the Wager. You assume I am the patron saint of the worst-case scenario, the man who bet everything on a sliver of probability because the payoff was infinite.

  You are half-right, and that is where you will fail.

  The Wager works only because the payoff is infinite. Multiply any non-zero probability by infinity, and the finite cost of belief vanishes. It is a mathematical trick that bypasses the need for evidence. But your stakes are not infinite. You speak of $10^{50}$ future lives. That is a large number, but it is a number. It behaves like arithmetic, not theology. If the probability of catastrophe is small enough, the expected value of Strategy A drops below the cost of Strategy W. Mathematically, the Wager does not save you. If you rely on my reputation to bypass the arithmetic, you are using me as you use your evals: as a talisman.

  This brings me to why you are really here. You do not want a calculation; you want absolution. In my time, the Jesuits developed a method called casuistry. They constructed intricate cases of conscience to show penitents that their sins were not quite sins, or that the permission to sin was hidden in the margins of the law. They made morality flexible enough to accommodate human desire. They called it "probabilism"—if a reputable theologian says an action is permissible, you may follow that opinion even if the opposite is more probable.

  When you say "expected harm is below threshold," I hear the Jesuit whispering in the confessional. You have taken a hard prohibition—"Do not extinguish the future"—and softened it into an accounting error. You say the risk is priced in. But you cannot price what you cannot measure. You have no formal bound on Strategy A. You have only a history of survival so far. To call this "expected value" is to dress a guess in a lab coat. It is casuistry for engineers. It allows you to build the weapon while claiming you have calculated the safety. You are looking for a reputable opinion that lets you ship.

  So, which strategy? You want me to choose.

  Strategy A requires you to believe you understand the system better than you do. It relies on the distribution of your tests matching the distribution of the world. This is an act of faith disguised as empirical rigor. Strategy W admits ignorance. It accepts a lower capability in exchange for a boundary you can see.

  Here is the difficulty, and the part you often miss about my life. I was a Jansenist. We believed that grace was not something you could command by intellect. You cannot simply will yourself to believe, and you cannot simply will yourself to be safe. Belief comes through custom. Custom is our nature. If you want to know if a man is a believer, do not ask his theology; watch his knees bend. Practice precedes conviction.

