  i'm trying to figure out what a solution to goodman's new riddle of induction actually has to deliver before i read any more proposed solutions. like, what are the desiderata for a theory of projectible predicates? obviously it has to rule out grue while letting green through, but it also has to handle the symmetry point — from a grue/bleen speaker's perspective, green is the gerrymandered one — and it can't just stipulate its way out. plus it should make sense of why some genuinely novel scientific predicates are projectible even when they haven't been entrenched yet. what i really want to know is whether the full set of desiderata is jointly satisfiable or whether there's a built-in tension, like maybe you can't have both non-question-begging and non-ad-hoc at the same time. and if there is a tension, which desideratum should give way?
