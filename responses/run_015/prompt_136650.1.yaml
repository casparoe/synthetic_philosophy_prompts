answer: |-
  The impasse you describe is not merely a fatigue of argument but a structural collision between two incommensurate frameworks. To diagnose this properly, we must look past the surface rhetoric of 'caution' versus 'justice' and examine the underlying ontology of the institution itself.

  The disagreement is not verbal, nor is the question ill-posed. Rather, it is a substantive clash regarding the *nature of the encoded information* within the fence. The stalemate persists because the defenders of Chesterton's Fence operate within a **systems epistemology**, whilst the critics operate within a **moral genealogy**.

  When the conservative invokes Chesterton, they are making a claim about complexity: society is a fragile, adaptive organism, and institutions are heuristics evolved to manage risks we cannot fully model. To them, the fence encodes *tacit wisdom*—solutions to coordination problems that rationalist planning cannot replicate. The burden of proof lies on the reformer because the risk of systemic collapse is non-linear and potentially catastrophic.

  When the critic attacks the fence, they are making a claim about power: institutions are not neutral problem-solvers but crystallised settlements of past conflicts. To them, the fence encodes *tacit power*—mechanisms of exclusion that have become invisible through habit. The burden of proof lies on the preserver because the cost of inertia is measured in continued suffering or injustice.

  Therefore, the sides are indeed answering different questions. The former asks, 'Will removing this destabilise the whole?' (a question of risk management). The latter asks, 'Who was harmed to build this, and who is harmed by its presence?' (a question of moral accounting). The metaphor of the 'fence' conceals this divergence. A fence can be a load-bearing wall holding up a roof, or it can be a barrier keeping people out of a garden. Both are fences. The Burkean assumes the former; the critic assumes the latter. Until this distinction is made explicit, the dialogue will remain a loop of mutual accusation: one side calling the other reckless, the other calling the first complicit.

  **The Diagnosis**

  The core of the stalemate is a **category error regarding the source of institutional legitimacy**.
  1.  **The Functionalist Fallacy:** Defenders assume longevity implies utility. But a lock can function perfectly for centuries in keeping a room secure, even if the room contains nothing but stolen goods. Efficiency is not legitimacy.
  2.  **The Rationalist Hubris:** Critics assume that because a reason is not immediately articulable, none exists, or that any existing reason is morally void. They often underestimate the chaotic cost of dismantling complex social technologies, treating society as a machine rather than an ecosystem.

  The hidden substantive claim is indeed about tacit knowledge, but it is split. Conservatives believe institutions store *practical reason* (how to live); critics believe they store *political will* (who rules). Both are correct, yet they speak past one another because they value the discovery differently. One fears the loss of order; the other fears the perpetuation of tyranny.

  **What Counts as Progress**

  Of the options you propose, a mere empirical study of transmission is insufficient, for data cannot bridge the is-ought gap. Similarly, arguing that no resolution should be expected is a counsel of despair that serves only the status quo.

  Genuine progress would require a **formal distinction between epistemic and moral reasons for preservation**, but with a crucial refinement: we must develop a **procedural epistemology of institutions**.

  We need a framework that separates the *functional audit* from the *moral audit*.
  1.  **Functional Audit (The Burkean Test):** We must ask, 'What work does this fence do?' This requires humility. We assume there is a function, even if hidden. We do not tear it down until we understand the load it bears.
  2.  **Moral Audit (The Critical Test):** We must ask, 'At whose expense does this function operate?' This requires vigilance. We assume that functions often rely on externalities borne by the vulnerable.

  Progress is not achieved when one side wins. It is achieved when the debate shifts from 'Keep or Destroy?' to 'How do we dismantle the fence whilst shoring up the load it bore?'

  For a novelist, this is the fertile ground. The tragedy of society is not that we cannot see the fence, but that we cannot agree on whether it is protecting us from wolves or imprisoning us in a pen. The path forward lies in recognising that Chesterton's Fence is not a commandment to preserve, but a mandate to investigate. The moral obligation is not to leave the fence standing, nor to knock it down, but to understand *why* it was built before deciding whether to rebuild it elsewhere.

  In short, the impasse breaks only when we acknowledge that an institution can be simultaneously *functionally necessary* and *morally repugnant*. The task of statesmanship—and of the novelist—is to navigate the tension of replacing the function without perpetuating the injustice. Until we possess the vocabulary to hold those two truths in tension, the argument will remain precisely where it is: a fence around a field where no one grows anything any more.
