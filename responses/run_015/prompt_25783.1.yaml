      *   Concession flag? Included.

  8.  **Final Polish:** Check tone. Needs to be respectful but firm. Ensure the distinction between *metaphysical possibility* and *epistemic probability* is clear in the answers. (Self-Correction: Make sure the "Detachability" objection is high on the list because if the argument *depends* on Hume's skepticism, the thesis that it stands alone is false.)

