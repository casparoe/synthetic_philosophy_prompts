      *Let's refine the Concession.* Definitely the Anachronism one. It shows intellectual honesty without sacrificing the philosophical argument.

      *Let's refine the Weakness notes.* Be specific about where the interlocutor could push back.

      *(Self-Correction during drafting)*: Make sure the Hume Specialist (Defender) gets a specific question. They might argue that removing the naturalistic context neuters the argument. That fits under "Detachability."

      *(Final check on constraints)*: "Eight or so objections." I will aim for exactly 8.

