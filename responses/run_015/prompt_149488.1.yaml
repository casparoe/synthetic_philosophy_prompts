      *Wait, is that defensible?* If something feels pain, doesn't it have status regardless of servers? The prompt says "Don't just say 'if it feels pain then yes'". It implies I should look for *other* criteria. I can argue that even *with* functional equivalents of pain, the lack of a singular locus changes the moral calculus. I will frame it as: "Moral status is not just about internal states, but about the metaphysical relationship between the self and its cessation."

