      *Decision:* Stick with the **Ontological Fragility/Vulnerability** argument. It's more distinct from the usual "can it suffer?" debate and directly addresses the "rerouting" aspect of the prompt. It challenges the idea that "survival of the pattern" equals "survival of the moral patient."

  9.  **Finalizing the Structure:**
      1.  Introduction (Definitions, Thesis).
      2.  The Distinction (Status vs. Agency).
      3.  The Core Argument: Moral Status Requires Irreversible Vulnerability.
      4.  Applying to the Distributed Mind (The Rerouting Problem).
