answer: |-
  **Project Title:** The Temporal Texture of Consciousness: Retrospective Determination and the Colour-Phi Phenomenon

  **Project Summary**
  This three-month project aims to produce an 8,000-word standalone paper resolving a stalemate in the philosophy of temporal experience. Focusing on the Colour-Phi phenomenon, I will challenge the orthodox Orwellian versus Stalinesque dichotomy. Both positions presuppose that conscious experiences are punctate events with a fixed time of occurrence. I argue instead that experience is temporally extended, such that its content is not fixed at the onset. The project will determine whether the content of such an experience is *retrospectively determined* (fixed only after the event concludes) or *prospectively vague* (indeterminate while it lasts), and crucially, whether this distinction is metaphysically substantive or merely verificationist.

  **The Problem and the Gap**
  In the Colour-Phi setup, subjects report a single moving object changing colour mid-trajectory, despite two static flashes. The standard debate asks whether the brain edits the record before consciousness (Stalinesque) or rewrites the memory after consciousness (Orwellian). Dennett and others argue this question is empty, as no behavioural report distinguishes them. Realists argue there is a fact of the matter we cannot access.

  Both sides err by assuming experiences are discrete items that can be timestamped. This project rejects that assumption. If experience is a process rather than a product, the question shifts from *when* the edit occurs to *how* the content stabilises. The gap in the literature is a failure to analyse the metaphysical status of content fixation in extended experiences. We lack an account of whether an experience can be real yet indeterminate during its occurrence.

  **The Core Question**
  My initial formulation conflated three issues: the ontology of extended experience, the mechanism of content fixation, and the verifiability of that mechanism. For this fellowship, I isolate the decisive philosophical question: **Is the distinction between Retrospective Determination (RD) and Prospective Vagueness (PV) substantive, or does it collapse into a verificationist dispute about reportability?**

  I am not asking whether RD or PV is true (which risks becoming an empirical claim about neural latency), nor am I asking if experience is extended (which I take as the working hypothesis). I am asking whether RD and PV describe genuinely different metaphysical relations between time and content. If RD is true, the content exists but is inaccessible until the process ends. If PV is true, the content literally does not exist until the process ends. Distinguishing these requires more than conceptual analysis; it requires a constraint on what counts as a 'record'.

  **Methodology**
  This is a philosophical project, not an empirical one. Measuring neural timing cannot settle the metaphysical status of content fixation, and pure conceptual analysis ignores the phenomenological constraints. I will employ a method of *constrained phenomenological modelling*.

  I will utilise oculomotor tracking as a philosophical lever rather than a data source. In Colour-Phi, subjects often track the apparent motion with their eyes. This is critical because eye movements alter retinal input in real-time. If the eyes track the illusory path, the motor system has committed to the illusion *before* the second flash is presented. This creates an embodied constraint: a purely intracranial, post-experience 'Orwellian' revision would require not just rewriting a visual memory, but rewriting the motor command history or explaining how the motor system accessed an illusion that did not yet exist. This rules out the 'cheap' version of the Orwellian view where revision is a passive, post-hoc narrative. It forces the revision to be partly constitutive of the experience itself. I will analyse whether this embodied commitment supports RD (the motor system acted on a determinate but unconscious content) or PV (the motor system acted on a vague content that crystallised through action).

  **Expected Outcomes**
  The paper will argue for one of four conclusions:
  1.  **Substantive RD:** Content is determinate but inaccessible during the experience. This preserves realism but requires a robust account of unconscious determinacy.
  2.  **Substantive PV:** Content is genuinely indeterminate during the experience. This supports a process ontology of mind.
  3.  **Verificationist Collapse:** The distinction relies entirely on reportability. This vindicates Dennett's dismissal but via a new route (embodied constraints rather than behavioural equivalence).
  4.  **Hybrid View:** Content is determinate for the motor system but vague for the phenomenological report, suggesting a fragmentation of consciousness.

  The deciding consideration will be whether the oculomotor constraint imposes a truth-condition on the experience that exists independently of the subject's subsequent report.

  **Risk and Failure Condition**
  The primary risk is that Retrospective Determination collapses into the familiar 'no-fact-of-the-matter' view. If I cannot specify a truth-condition for RD that differs from 'what the subject eventually says', the project produces merely an elaborate footnote to Dennett. The secondary risk is that the argument devolves into a bare empirical claim about visual processing latency, which I am not positioned to establish.

  **Honest Failure Condition:** The project fails if, by the end of Month Two, I cannot articulate a criterion that distinguishes RD from Verificationism without relying on empirical latency data.

  **Mitigation:** To rule this out, the Month Two deliverable will be a formalised 'Criterion of Differentiation'. This document will set out the necessary and sufficient conditions for RD to be metaphysically distinct from PV. If I cannot define a scenario where RD and PV yield different truth values for the content of the experience (even if not different behavioural outputs), I will pivot the paper to argue for the Verificationist Collapse (Outcome 3) as a positive result, demonstrating why the metaphysical distinction is untenable. This ensures the fellowship yields a defensible philosophical conclusion even if the primary hypothesis is refuted.

  **Timeline**
  *   **Month 1:** Refine the RD/PV distinction and map the logical space of the collapse argument.
  *   **Month 2:** Develop the oculomotor constraint argument and draft the Criterion of Differentiation. (Milestone: Risk assessment).
  *   **Month 3:** Finalise the argument, address counter-positions, and complete the 8,000-word paper.
