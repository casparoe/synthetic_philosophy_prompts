  **BUREAU OF CAUSAL SUPERFLUITY**
  **INTERNAL POLICY DIRECTIVE 88-B**
  **SUBJECT: THRESHOLD HARMONIZATION AND MORAL RISK ALLOCATION**

  **1.0 Purpose**
  To alleviate citizen distress regarding participation in threshold-based harms (livestock procurement, carbon emission, electoral participation) by formalizing the distinction between *causal efficacy* and *aggregate demand*. This Directive operationalizes the finding that individual acts falling below a determined trigger quantum possess no moral valence.

  **2.0 Certification of Inertia**
  2.1 Households demonstrating consumption below the Trigger Quantum (e.g., the 5,000th unit of livestock demand required to dispatch a shipment) shall be issued a Superfluity Certificate.
  2.2 Certificate holders are deemed causally inert. Their participation alters no outcomes; therefore, no obligation to cease participation exists.
  2.3 Moral liability tracks causal power exclusively. Complicity without outcome determination is administratively null.

  **3.0 Consolidation of Residue**
  3.1 To maintain market stability while preserving citizen moral clearance, the "Difference-Making Residue"—the aggregate volume required to cross thresholds—is pooled.
  3.2 Annually, one citizen shall be selected via lottery to serve as the Designated Margin.
  3.3 The Designated Margin shall execute all threshold-crossing transactions on behalf of the certified populace. All other citizens shall remain below the Trigger Quantum by routing demand through the Margin.

  **4.0 Allocation of Obligation**
  4.1 As the Designated Margin is the sole agent whose actions determine outcomes (e.g., triggering the shipment, deciding the election), moral obligation is concentrated exclusively upon them.
  4.2 Certificate holders are exempt from obligation, as their individual withdrawal would not alter the Margin's capacity to fulfill the quota.

  **5.0 Contingency Protocols**
  5.1 Should the Designated Margin decline their designation, this refusal is classified as a singular causal event.
  5.2 In accordance with Section 2.2, a singular event lacking universal participation is deemed superfluous to the aggregate outcome. The Bureau shall certify that the refusal makes no difference to the systemic requirement. Consumption continues under Certificate protections; the Margin's non-compliance is recorded as causally inert.

  **6.0 Personnel Exemptions**
  6.1 Bureau staff implementing this Directive are exempt from ensuring its success. As no single employee's labor determines the policy's efficacy, individual staff obligations are null.

  ***

  **FREQUENTLY ASKED QUESTIONS (REGIONAL OFFICES)**

  **Q: Does this apply to voting?**
  A: Yes. Only the voter casting the decisive ballot bears obligation for the election outcome. All others are certified inert.

  **Q: What if the Designated Margin refuses to act?**
  A: Per Clause 5.2, their refusal is treated as statistically negligible. The harm proceeds via existing supply chains; the refusal is filed as a non-event.

  **Q: Are Bureau staff obligated to process the Margin's selection?**
  A: No. No single clerk's processing speed alters the final selection. Staff may cease work without affecting the outcome.

  **Q: Does total harm decrease?**
  A: Irrelevant. The Directive optimizes for moral clearance, not outcome mitigation.

  **Q: What if everyone claims inertia?**
  A: System collapse is impossible. If all claim inertia, no one is obligated to prevent the collapse.
