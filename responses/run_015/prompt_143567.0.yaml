          3.  Address limitations/silences (e.g., low-income uptake, financial constraints).
          4.  Reverse the direction: What does the UK episode show about the concept itself (structural undermining vs. secondary factor)?
      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables. Tone like a careful letter or email.
      *   **Constraint:** No formal training in economics/philosophy assumed (keep accessible but rigorous).

  2.  **Deconstruct the "Interstitial Burden" Concept:**
      *   It's about the gaps *between* formal leave blocks.
      *   It's about the mental load and logistical friction.
      *   It's often gendered (women usually absorb this).
      *   Formal leave (SPL) allows swapping weeks, but doesn't account for the daily grind outside those weeks.

  3.  **Step 1: Predictions of the Framing:**
      *   If leave is formally neutral but interstitial burden remains gendered, couples might opt for formal neutrality (SPL) but revert to traditional roles for the hidden work.
      *   Or, the presence of the interstitial burden makes the formal neutrality too costly/risky for the higher earner (often male) to take up, because the "default" caregiver (female) is already managing the invisible logistics.
      *   Prediction: Low uptake of SPL by fathers because the *system* of care relies on the mother managing the interstices. Even if dad takes 6 months, mum still manages the nursery calls.
      *   Prediction: Career penalties remain gendered because the interstitial burden disrupts continuity and cognitive bandwidth even when formal leave is shared.

  4.  **Step 2: Application to Evidence (Uptime & Penalties):**
      *   *Evidence:* SPL uptake was notoriously low (around 1-2% of eligible couples). Mothers still take most leave (Maternity vs. SPL). Gender pay gap persists.
      *   *Analysis:* Does this confirm the framing? Yes. If the interstitial burden isn't redistributed, fathers don't take the leave because the mother is still the "manager" of care. The formal right exists, but the practical capacity to exercise it is blocked by the invisible workload.
      *   *Alternative:* Money and culture. SPL pay is often low (capped at statutory rate). Workplace culture stigmatizes men taking leave.
      *   *Synthesis:* The interstitial burden explains *why* culture persists. The culture exists because the burden is assumed to be female.

  5.  **Step 3: Limitations/Silences:**
      *   *Low-income couples:* The theory might struggle here. If money is the primary constraint (statutory pay is low), the interstitial burden is secondary. You can't take leave you can't afford, regardless of who manages the nursery calls.
      *   *Need for supplementation:* Economic rationality (comparative advantage) often overrides care dynamics. If dad earns more, he works. The interstitial burden theory needs to acknowledge that financial precarity amplifies the burden (less money to outsource tasks).

  6.  **Step 4: Reverse Direction (What the episode shows about the concept):**
      *   Does it show formal equality is undermined by invisible asymmetries? Yes.
      *   Or is interstitial burden only decisive once economic/cultural barriers are lowered? Probably the latter. If the pay was full salary and culture was supportive, would the interstitial burden still stop men? Maybe less so.
      *   Conclusion: The concept is powerful but not sufficient. It explains the *stickiness* of gender roles after legal change, but not the initial barrier of cost.

  7.  **Drafting - Tone and Structure:**
