  **MEMORANDUM**

  **TO:** Provost [Name]
  **FROM:** Pest Management Advisory Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Urgent Recommendation Regarding Emerald Ash Borer Infestation in Memorial Allée

  **RECOMMENDATION**
  The Committee recommends **immediate trunk injection of the Memorial Ash Allée** using emamectin benzoate, to be completed within the current three-week treatment window. We recommend **against** the release of parasitic wasps within the Arboretum boundaries. Non-memorial ash trees outside the Allée will be monitored and removed on a hazard-priority basis over the next five years, with replanting to commence immediately upon removal.

  This is a sequenced decision: Treatment now secures the memorial; removal later manages the risk. We request authorization to proceed by October 31 to meet the physiological window for uptake.

  **RATIONALE AND ETHICAL CONSIDERATIONS**
  This decision balances three competing obligations: the preservation of a documented historical collection, the safety of vulnerable populations (preschool students), and our institutional commitment to ecological stewardship (Pollinator Pledge).

  **1. The Insect Sentience Question**
  We cannot settle whether EAB larvae are sentient. However, the decision does not hinge on resolving this.
  *   **If they are not sentient:** The moral weight rests on ecological impact and tree preservation. Injection is the most effective tool for the latter.
  *   **If they are sentient:** Trunk injection is ethically preferable to the alternative of biological control. Injection induces rapid mortality; parasitic wasps result in larvae being consumed alive over an extended period.
  *   **The "Inconsistency" Objection:** We acknowledge the Grounds Department kills insects daily via mowing and dorm pest control. Our scrupulousness here is not a claim of universal non-violence, which is impossible in managed landscapes. It is a claim of *proportionality*. We are justified in expending resources to spare these specific insects because doing so preserves a War Memorial and avoids the ecological disruption of removing 40+ mature trees. We are not saving the insects for their own sake; we are saving the trees, and sparing the insects is the cost of that method. We accept the inconsistency as the cost of stewardship in a built environment.

  **2. Rejection of Biological Control (Wasps)**
  The Committee considered releasing state-approved parasitic wasps (*Tetrastichus planipennisi*, etc.). We reject this option for the Arboretum.
  *   **Irreversibility:** Unlike chemical treatment, which ceases when we stop paying for it, a released wasp population establishes permanently. We cannot recall them.
  *   **Non-Target Risk:** While host-specific, there is documented risk of spillover onto native wood-borers. As a documented collection, our primary mandate is to avoid uncontrolled ecological experiments on the land we manage.
  *   **Efficacy:** Wasps suppress populations over decades; they do not save individual high-value trees in the immediate 5-year mortality window.
  *   *Note:* We acknowledge the argument that chemical treatment is a recurring intervention while wasps are a "one-and-done." However, the permanence of the wasp release outweighs the recurrence of the injection. We prefer a reversible harm to a permanent ecological alteration.

  **STAKEHOLDER OBLIGATIONS**

  **1. Pollinator Pledge & Student Hives**
  The Campus Pollinator Pledge prohibits neonicotinoids. The recommended treatment, emamectin benzoate, is not a neonicotinoid. However, given the hives are 300 yards away:
  *   **Mitigation:** Injections will be scheduled for late afternoon to minimize immediate foraging exposure during application.
  *   **Transparency:** We will notify the Faculty Beekeeping Club 48 hours prior to application.
  *   **Monitoring:** We will coordinate with the Ag School to sample hive health in the spring. If we detect elevated mortality linked to our application, we will cease treatment and move to removal.

  **2. Nature Preschool**
  Dead ash trees become brittle and drop limbs without warning. The Allée borders the preschool's primary play zone.
  *   **Safety:** Treatment maintains the structural integrity of the trees, reducing immediate hazard.
  *   **Education:** We will frame the treatment as part of the curriculum—explaining to older students that we are "medicine for the trees" to keep them safe, rather than hiding the intervention.

  **3. The Public & Memorial Status**
  The Allée is a War Memorial. Allowing it to die (Option: Do Nothing) or removing it (Option: Pre-emptive Removal) constitutes a desecration of that memorial status. We owe the public the preservation of this landscape feature as long as it is biologically viable. We will install interpretive signage explaining the EAB threat and our management strategy to maintain public trust.

  **REVERSAL CRITERIA (SPRING REVIEW)**
  We will revisit this decision at the Spring Committee Review. We will recommend terminating the treatment program and moving to removal if:
  1.  **Efficacy Failure:** >10% canopy dieback is observed in the Allée despite treatment.
  2.  **Pollinator Impact:** The Ag School reports statistically significant colony loss in the student hives correlated with our treatment window.
  3.  **Budgetary Constraint:** The cost of treatment exceeds the allocated landscape preservation budget by >15%.

  **CONCLUSION**
  We recognize that treating the trees commits the University to a recurring expense and an ongoing intervention in the local ecosystem. However, the alternative—permanent ecological alteration via wasp release or the loss of the Memorial via removal—carries higher ethical and cultural risk. This path allows us to honor the memorial, ensure public safety, and maintain the ability to change course if the evidence demands it.

  **Signatures:**

  __________________________
  Grounds Superintendent

  __________________________
  Entomologist, Ag School

  __________________________
  Bioethicist, Community Rep

  __________________________
  Landscape Architect, Collections
