      *   *Option A: Systemic Insecticide (Trunk Injection).*
          *   Pros: Saves the memorial trees immediately. Targeted (trunk injection is safer than spray). Reversible (stop injecting, chemical leaves system).
          *   Cons: Violates Pollinator Pledge? (Need to check specific chemicals. Emamectin benzoate is often the standard for EAB and is generally considered safer for pollinators than neonicotinoids, but the pledge bars *neonics*. Need to be precise here). Costly ongoing maintenance.
          *   Ethical: Kills larvae inside tree.
      *   *Option B: Parasitic Wasps (Biological Control).*
          *   Pros: Self-sustaining. No chemical residue.
          *   Cons: Irreversible (can't recall them). Non-target risk (native borers). Slow acting (might not save the specific memorial trees in time). Friend's argument: Prolongs suffering/death, creates permanent ecological change.
