answer: |-
  **Project Title:** The Asymmetric Attribution Problem: Decoupling Victimhood and Beneficiary Conditions in Procreative Ethics

  **Project Summary**
  This independent study investigates the structural stability of the moral asymmetry between suffering and happiness in procreative choices. Standard debates (e.g., Benatar, Parfit) typically frame this asymmetry through symmetric lenses: either both harm and benefit require existing subjects (person-affecting views) or neither do (impersonal views). This project proposes a hybrid model: grounding obligations not to harm in strict conditions for attributing harm to a specific moral patient (requiring an actual or determinately identifiable victim), while grounding obligations to create happiness without requiring a corresponding beneficiary-subject. The core inquiry is whether this decoupling remains consistent when applied to collective and identity-affecting procreative scenarios, or if it collapses under the pressure of the non-identity problem.

  **The Precise Question**
  If we accept that harm requires an actual or determinately identifiable victim, but reject that benefit requires any corresponding beneficiary-subject, can we consistently maintain that collective or identity-affecting procreative choices generate obligations not to harm without generating parallel obligations to benefit?

  This question isolates the *conditions of attribution* rather than the *value of outcomes*. It asks whether the logic of victimhood necessarily binds the logic of benefit. If harm is relational but benefit is impersonal, does the asymmetry survive the transition from individual to collective agency where specific victims become indeterminate?

  **Critique of Standard Framing**
  Current literature obscures this question by forcing harm and benefit into the same ontological category regarding subject-dependence. Person-affecting views argue that because the non-existent cannot be harmed, they cannot be benefited; impersonal views argue that because value exists independently, both harm and benefit apply independently. Both assume symmetry in subject-requirements.

  This symmetry assumption bypasses the intuitive asymmetry many hold: that we owe it *to someone* not to torture, but we do not owe it *to someone* to create them happy. By treating subject-dependence as a variable that can be set differently for harm and benefit, this project avoids the stalemate of the non-identity problem. The standard framing treats the non-identity problem as a bug for person-affecting views; this project treats it as a stress test for a hybrid attribution model. If the model fails, it reveals that victimhood and beneficiary conditions are more tightly coupled than intuition suggests. If it succeeds, it offers a novel grounding for asymmetry that does not rely on controversial axiological claims about the value of non-existence.

  **Methodology**
  The semester will be divided into three phased modules, avoiding a general survey of population ethics in favor of targeted conceptual analysis.

  1.  **Clarifying Patienthood Conditions (Weeks 1-5):**
      I will define the necessary and sufficient conditions for "attributing harm." This involves distinguishing between *comparative harm* (worse off than otherwise) and *non-comparative harm* (being in a bad state). The focus will be on the "identifiable victim" requirement. Does "identifiable" require numerical identity across possible worlds, or merely qualitative specificity? I will establish a working definition of "determinately identifiable victim" that excludes potential persons but includes future actual persons whose identities are fixed by current choices.

  2.  **Mapping onto Procreative Scenarios (Weeks 6-10):**
      I will apply these conditions to two distinct classes of cases:
      *   *Individual Procreative Choices:* Where identity is fixed (e.g., delaying conception).
      *   *Collective/Identity-Affecting Choices:* Where policy or aggregate behavior shifts which specific individuals come to exist (e.g., climate policy affecting future generations).
      In this phase, I will test the hybrid model: Does the obligation not to harm persist in collective cases where victims are indeterminate? Does the obligation to benefit arise in individual cases where no beneficiary-subject is granted standing?

  3.  **Consistency Testing (Weeks 11-15):**
      The final phase involves stress-testing the hybrid model for internal contradiction. If harm requires a victim, but collective action makes victims indeterminate, does the obligation vanish? If benefit does not require a subject, does it generate an infinite obligation to populate? I will look for "leakage" where the conditions for benefit inadvertently impose conditions on harm, or vice versa.

  **Outcomes: Success and Failure**
  *   **Successful Result:** A coherent framework demonstrating that harm-attribution is strictly counterfactual-dependent (requiring a specific victim who is worse off), while benefit-attribution is state-dependent (requiring only the existence of a positive state). Success means showing that collective choices can violate harm obligations only when specific victims are identifiable, while benefit obligations remain impersonal but limited by agency constraints, preserving the asymmetry without contradiction.
  *   **Honest Failure:** A demonstration that the hybrid model is unstable. For example, if rejecting beneficiary-subjects for benefit inevitably forces us to reject victim-subjects for harm (collapsing into impersonalism), or if maintaining strict victim conditions for harm forces us to accept beneficiary conditions for benefit (collapsing into symmetric person-affecting views). An honest failure would precisely locate the coupling point where the decoupling attempt breaks down, contributing to the literature by ruling out this specific hybrid pathway.

  **Tractability Assessment**
  This project is tractable within one semester because it deliberately narrows the scope. It does not attempt to solve the non-identity problem or propose a full theory of population value. It focuses exclusively on the *conditions of attribution* for harm and benefit. By excluding axiological debates about the value of existence itself and focusing on the logical requirements for moral patients, the research remains bounded. The risk of scope creep into general population ethics is mitigated by the strict constraint: no analysis of total utility or average utility, only the structural requirements for assigning obligations in procreative contexts. The deliverable will be a 20-25 page paper articulating the hybrid model and the results of the consistency test.
