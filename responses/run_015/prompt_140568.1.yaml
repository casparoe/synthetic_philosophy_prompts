answer: |-
  ### 1. The Apparatus: Repair and Verdict

  Your apparatus is analytically sound but pedagogically too heavy for a fifty-minute session with non-majors. The distinctions (sorting/explanatory/discontinuity) are precise, but the jargon will consume the cognitive bandwidth you need for the *application* of the ideas. First-years do not need to memorize your taxonomy; they need to internalize the *habit of mind* that generates it.

  **The Repair:**
  Keep the logic, strip the labels.
  *   **Sorting-work** $\rightarrow$ **"The Container."** (We need a bucket to hold the stuff.)
  *   **Explanatory-work** $\rightarrow$ **"The Engine."** (Does naming this period explain *why* things changed?)
  *   **Discontinuity-work** $\rightarrow$ **"The Break."** (Did the rules of the game actually change, or just the players?)
  *   **The Shove Test** $\rightarrow$ Keep this name; it is vivid and intuitive.
  *   **The Ancestor Problem** $\rightarrow$ Rename **"The Winner's Bias."** (We draw the lines based on who won, not what was happening.)

  **Verdict:** Do not present the apparatus abstractly. Do not put the definitions on the board. Introduce the *problems* first, then offer the *tools* as solutions. The apparatus should emerge from the case, not precede it. If you lecture on "sorting-work" for ten minutes, you have lost them.

  ### 2. The Order: Sequencing the Question

  You are correct that "Was the Scientific Revolution real?" is a trap if asked first. It invites a binary "yes/no" based on facts they do not possess. The sequence must move from **Intuition** to **Mechanism** to **Evaluation**.

  **The Sequence:**
  1.  **The Intuition of Arbitrariness (5 mins):** Start by asserting the standard date (1543: Copernicus/Vesalius). Ask: "Why this year?" Let them guess. Reveal that these books were not bestsellers then. *Goal:* Create doubt that the date is "natural."
  2.  **The Mechanism of Continuity (15 mins):** Introduce the Carrying Case (see below). Show that the "new" science looks like the "old" science in practice. *Goal:* Establish that the boundary is porous.
  3.  **The Tool Kit (15 mins):** Now introduce the Shove Test and Winner's Bias. "If the practice didn't stop, why do we draw the line here?" *Goal:* Give them vocabulary to describe *why* the line exists.
  4.  **The Evaluation (15 mins):** Apply the tools. "If the line is porous, is it useless?" *Goal:* Distinguish "fake" from "constructed for a purpose."

  **What Breaks if Inverted:**
  If you start with the Apparatus (defining "discontinuity-work"), students will treat it as a vocabulary quiz. If you start with "Is it real?", they will treat it as a trivia contest. You must destabilize their confidence in the timeline *before* you give them the tools to rebuild it.

  ### 3. The Carrying Case: Newton's Alchemy

  You asked to choose between "named eyewitness" and "occult activity." Choose **the occult activity**, specifically **Isaac Newton's Alchemy.**

  **Why this case:**
  *   **It shocks:** Non-majors arrive with the "Science vs. Superstition" myth. Newton is the archetype of the Scientist. Learning he was a practicing alchemist creates immediate cognitive dissonance.
  *   **It crosses the boundary:** Alchemy was practiced before 1543 and after 1687. If the "Scientific Revolution" is the death of alchemy, Newton shouldn't exist. If Newton *is* the Scientific Revolution, then alchemy must be part of it.
  *   **It isolates the Ancestor Problem:** We value Newton's physics, so we call him a scientist. We dislike alchemy, so we call it a hobby. The periodization depends on which Newton we choose to honor.

  **What it must have:**
  *   **Specifics:** Do not say "Newton liked magic." Say: "Newton wrote more about the transmutation of metals than about gravity. He believed in a spiritual spirit hidden in matter."
  *   **Continuity:** Show that his alchemical methods were not distinct from his optical methods (experimentation, recording, testing).

  **What it must lack:**
  *   **Complexity:** Do not explain *prima materia* or the *green lion*. Keep it to "trying to change metals" and "finding God in nature."
  *   **Judgment:** Do not say he was "wrong." Say he was "asking questions we no longer ask."

  **Defense against candidates:**
  *   *Vs. Eyewitness Testimony:* The epistemology of testimony (Shapin/Schaffer) is too subtle for 50 minutes. It requires understanding social hierarchy in the 17th century. Alchemy requires only understanding "what counts as science."
  *   *Vs. Astronomy/Astrology split:* This is the runner-up. However, students often assume astrology was *always* fake. Alchemy feels more like "chemistry," making the continuity harder to dismiss.

  ### 4. The Misconceptions: Order and Management

  Here are the misconceptions in the order they will arise, with intervention points.

  1.  **"If it was made up later, it's a lie."**
      *   *When:* Immediately after you reveal "Scientific Revolution" was coined in the 20th century (actually 1930s, Butterfield).
      *   *Intervention:* Pre-empt this. "Maps are drawn long after the land exists. Does that make the map a lie, or a tool?"
  2.  **"Finding medieval antecedents refutes the Revolution."**
      *   *When:* During the Newton/Alchemy case. "If medievals did experiments, nothing changed."
      *   *Intervention:* **Invite this.** This is the productive friction. Acknowledge the continuity. Then ask: "If the *practice* is continuous, what changed?" (Answer: The *status* and the *system*). This leads directly to "Discontinuity-work."
  3.  **"Saying 'it's a construct' settles something."**
      *   *When:* When a student feels smart for realizing the period is invented.
      *   *Intervention:* "Constructing a bridge doesn't mean the river isn't there. Calling it a construct is the start of the question, not the answer."
  4.  **"Because the dispute looks verbal, it is verbal all the way down."**
      *   *When:* Discussing boundaries. "It's just about where we draw the line."
      *   *Intervention:* "If I draw the line at 1543, I include Copernicus. If I draw it at 1600, I exclude him. The *history* changes based on the *label*. That has consequences."
  5.  **"Periods must tile the timeline exhaustively."**
      *   *When:* Closing questions. "So what came before? The Dark Ages?"
      *   *Intervention:* Refuse the tile. "Periods are spotlights, not floor tiles. They illuminate some things and leave others in the dark."

  **Which to Invite:** Invite **#2 (Medieval Antecedents)**. It forces them to confront the difference between *change* and *difference*. It prevents the session from becoming a "gotcha" about dates and turns it into an analysis of historical change.

  ### 5. Three Short Things

  **A. The One-Minute Paper**
  *   **Question:** "Take the label 'The Information Age.' Apply the **Shove Test** to it. If we move the start date from 1980 to 2000, what historical claim breaks?"
  *   **Good Answer:** Identifies a specific change that would be excluded or included (e.g., "If we start in 2000, we exclude the personal computer revolution, so we can't say the Age was caused by PCs; we'd have to say it was caused by the Web.").
  *   **Bad Answer:** "It would be wrong because 1980 is the real date." (Fails the test). OR "It's all just a story." (Cynicism).

  **B. Avoiding Cynicism (The Last Two Minutes)**
  You must pivot from *deconstruction* to *utility*. If they leave thinking "History is fake," you have failed.
  *   **Say this:** "We spent today showing that the 'Scientific Revolution' is a construct. That does not mean nothing happened in the 17th century. It means the label is a **tool**, not a **container**. A hammer is a construct; that doesn't mean the nail isn't real. Your job is not to ask 'Is this period real?' but 'What work does this period do for me?'"
  *   **Goal:** Move them from "It's fake" to "It's functional."

  **C. What to Refuse to Settle**
  *   **The Trap:** A student will ask: "Okay, but when did science *actually* start?"
  *   **The Refusal:** Do not answer. You cannot settle the ontology of science in 50 minutes.
  *   **The Pivot:** "I can't tell you when science started, because 'science' is also a label that changes its meaning. I can tell you that if you define science as 'mathematical prediction,' it starts earlier. If you define it as 'institutional peer review,' it starts later. The question isn't 'When?' it's 'Which definition helps you understand the change you care about?'"
  *   **Why:** This reinforces the transferable skill (defining terms) rather than the factual content (dates).
