      *   *Re-evaluating based on "50 mins, no slides, non-majors":* They need something tangible.
      *   *Winner:* **The Year 1543.** (Copernicus *De Revolutionibus* & Vesalius *De Humani*).
      *   *Reasoning:* It is the canonical anchor. It is easily movable (Shove Test). It is clearly selected by ancestors (Ancestor Problem). It avoids getting bogged down in "what is alchemy." It focuses purely on the *periodization mechanism*.
