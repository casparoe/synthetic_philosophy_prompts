      *   *Repair:* Simplify the language. Instead of "jobs," think "tools." Instead of "anchors," think "boundaries." The core insight should be: *Periods are tools, not containers.*
      *   *Decision:* Keep the *logic* but strip the *jargon*. Focus on the distinction between "Is it real?" (ontology) and "Is it useful?" (function). The "Shove Test" is excellent; keep that. The "Ancestor Problem" is crucial; keep that. Merge the three jobs into two main questions: "Does this label help us explain change?" and "Are we picking winners?"

  3.  **Determine the Order:**
      *   *Problem:* Students want to argue "Real vs. Fake" immediately.
      *   *Solution:* You cannot ask "Is it real?" until you ask "What does 'real' mean in this context?"
      *   *Sequence:*
          1.  Establish the *utility* of periods (we need them to talk).
          2.  Introduce the *problem* (where do we draw the line?).
          3.  Apply the *tests* (Shove/Ancestor).
          4.  Conclude on *function* (what work is it doing?).
      *   *Inversion Risk:* If you start with "Is it real?", they dig into facts they don't have. If you start with the apparatus abstractly, they tune out. Start with the *intuition* that the label feels weird, then give them the tools to analyze *why*.

