  # Seminar Handout: Modal Metaphysics Decision Tree
  ## Diagnostic Case: The Ceramic Vase

  **Instructions:**
  Below is a decision tree designed to classify your intuitive judgments regarding modal claims about concrete objects. Begin with the following case:

  > **The Case:** Consider a specific ceramic vase, **$V$**, sitting on the table in the actual world.
  > 1.  **Scenario A:** In another possible scenario, a vase is fired at a significantly different temperature but looks the same.
  > 2.  **Scenario B:** In another scenario, $V$ is shattered and later rebuilt from the exact same fragments.
  > 3.  **Scenario C:** In another scenario, there exists a vase that is qualitatively identical to $V$ (same shape, color, atomic structure) but shares no causal history with $V$.

  **Task:** Answer the following questions sequentially based on your metaphysical intuitions about these scenarios. Do not worry about standard philosophical labels; answer based on what you take to be true about the vase.

  ---

  ### Decision Tree

  #### **Node 1: The Status of Cross-World Claims**
  When we say "The vase in Scenario C is $V$," is there a **mind-independent, objective fact** about whether this claim is true or false?
  *   **NO:** (Truth depends on language, convention, or there is no fact of the matter.)
      *   $\rightarrow$ **Go to Leaf A**
  *   **YES:** (There is a metaphysical reality to the connection, regardless of description.)
      *   $\rightarrow$ **Go to Node 2**

  #### **Node 2: The Nature of the Link**
  In Scenario C (the qualitatively identical duplicate), is the vase in that scenario **numerically identical** to the actual vase $V$ (literally one and the same entity existing in two places), or is it a **distinct entity** that merely resembles $V$?
  *   **DISTINCT ENTITY:** (They are two different things that look alike.)
      *   $\rightarrow$ **Go to Node 3**
  *   **NUMERICALLY IDENTICAL:** (It is the very same object.)
      *   $\rightarrow$ **Go to Node 4**

  #### **Node 3: Multiplicity and Perspective (Distinct Entity Branch)**
  Can the actual vase $V$ correspond to **two or more different objects** in that other scenario simultaneously, depending on which features we prioritize from our perspective in the actual world?
  *   **YES:** (Identity is vague/contextual; $V$ can have multiple "surrogates".)
      *   $\rightarrow$ **Go to Leaf B**
  *   **NO:** (There is exactly one best candidate in the other scenario.)
      *   $\rightarrow$ **Go to Leaf C (Gap)**

  #### **Node 4: Grounds of Identity (Identical Entity Branch)**
  Is the identity of the vase in the other scenario fixed entirely by its **causal history and origin** (e.g., the specific clay and potter that made $V$)?
  *   **YES:** (If the origin changes, it is not $V$.)
      *   $\rightarrow$ **Go to Leaf D**
  *   **NO:** (Identity can persist even if origin/qualities are swapped or indeterminate.)
      *   $\rightarrow$ **Go to Node 5**

  #### **Node 5: Primitive "Thisness" (Identical Entity Branch)**
  Could there be two possible worlds that are **qualitatively identical in every way** (same properties, same histories), but differ solely in *which* specific individual is which (e.g., $V$ swaps "identities" with a duplicate)?
  *   **YES:** (There is a primitive fact of "thisness" independent of qualities.)
      *   $\rightarrow$ **Go to Leaf E**
  *   **NO:** (If qualities and history are the same, the worlds are the same.)
      *   $\rightarrow$ **Go to Leaf C (Gap)**

  ---

  ### Classification Leaves

  **Leaf A: Deflationary / Anti-Realist Position**
  *   **Diagnosis:** You deny that there is a metaphysical fact about cross-world identity. Talk of "the same vase" in another world is merely a linguistic convenience or a way of describing properties, not a claim about existing entities.
  *   **Key Feature:** Denial of Node 1.

  **Leaf B: Lewisian Counterpart-Theoretic Position**
  *   **Diagnosis:** You hold that objects are world-bound (Node 2: Distinct) but allow that similarity is context-dependent and centered on the actual world (Node 3: Yes). One object here can have multiple counterparts there.
  *   **Key Feature:** Distinct entities + One-to-Many mapping.

  **Leaf C: [GAP] Single-Counterpart or Ungrounded Identity**
  *   **Diagnosis:**
      *   *If reached from Node 3 (No):* You believe objects are world-bound (Distinct) but insist on a strict one-to-one mapping. **Diagnosis:** Logically possible but theoretically unstable; it retains the costs of counterpart theory without gaining the flexibility to handle vagueness.
      *   *If reached from Node 5 (No):* You believe in transworld identity but deny both origin essentialism and primitive thisness. **Diagnosis:** Incoherent; if identity is not grounded in qualities, history, or primitive thisness, it lacks a truth-maker.

  **Leaf D: Kripkean Transworld Identity Position**
  *   **Diagnosis:** You hold that the same object exists across worlds (Node 2: Identical) and that identity is constrained by causal origin or essential properties (Node 4: Yes). You deny that qualitatively identical worlds can differ merely by swapping individuals.
  *   **Key Feature:** Strict Identity + Origin Essentialism.

  **Leaf E: Haecceitist Position**
  *   **Diagnosis:** You hold that the same object exists across worlds (Node 2: Identical), but identity is not fixed by qualities or origin alone (Node 4: No). You accept that "thisness" (haecceity) is a primitive metaphysical fact that can vary independently of qualitative description (Node 5: Yes).
  *   **Key Feature:** Strict Identity + Primitive Thisness.

  ---

  ### Instrument Diagnostics & Flags

  **1. Indistinguishable Leaves:**
  *   **Flag:** None. The branching questions successfully distinguish all named positions (Leaves A, B, D, E) based on their metaphysical commitments.
  *   **Note:** While Leaf D (Kripkean) and Leaf E (Haecceitist) may agree on most practical cases (e.g., Scenario A or B), Node 5 isolates them using the "Qualitatively Indiscernible Worlds" test, which is the standard philosophical differentiator.

  **2. Gap Analysis (Leaf C):**
  *   **Status:** The "Single-Counterpart" gap (from Node 3) is **logically possible but unattractive**. It is rarely defended because it sacrifices the main advantage of Counterpart Theory (solving problems of vagueness and modal predication) while keeping the ontological cost of world-bound objects.
  *   **Status:** The "Ungrounded Identity" gap (from Node 5) is **incoherent**. It posits transworld identity without providing any criterion (qualitative, causal, or primitive) to verify it.

  **3. Coverage of Essential Splits:**
  *   *Qualitative Similarity:* Addressed in Node 2 (Distinct vs. Identical) and Node 3 (Similarity weighting).
  *   *Causal/Spatiotemporal Continuity:* Addressed in Node 4 (Origin/History).
  *   *Multiplicity:* Addressed in Node 3 (One-to-Many).
  *   *Privileged Actual World:* Addressed in Node 3 (Perspective from *this* world determining counterparts).
