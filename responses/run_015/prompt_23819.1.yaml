      *   *The "Lesser Evil" Trap:* Augustine explicitly rejects utilitarianism. You cannot do evil (lie) that good (save a life) may come. The end does not justify the means.
      *   *The Midwives:* Augustine struggles here. He admits God rewarded them but insists the reward was for their *benevolence/piety*, not the *mendacity*. The lie was still sinful, just venial compared to doctrinal heresy.
