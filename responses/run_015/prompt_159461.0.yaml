  ### Phase 6: Empirical vs. Conceptual Markers

  Per your constraints, I must mark where this audit depends on empirical claims versus conceptual reasoning.

  1.  **Empirical Claim (The Swap Case):** My resolution assumes the Swap Case is *conceptually possible* but *empirically rare*.
      *   *What to check:* You would need to verify if party systems ever actually undergo a wholesale policy swap without a label swap (realignment). If empirical literature suggests labels *always* fracture when policies swap (e.g., the party splits), then (7) is empirically false, and (3) might be more stable than you think.
      *   *Constraint:* I have treated (7) as a conceptual intuition test. If it is empirically impossible, (3) gains strength.

  2.  **Empirical Claim (The One Dimension):** Commitment (4) relies on the stability of the first dimension in roll-call data.
      *   *What to check:* You need to check if the *content* of that dimension remains stable across the periods measured. If the dimension is stable but the *policies* loading on it flip (e.g., "spending" loads positive in decade 1, negative in decade 2), then (4) supports (7) (structure is the conflict, not the content). If the content stays stable, (4) supports (3).
      *   *Constraint:* I have assumed the dimension is structural *conflict*, not structural *content*.

  3.  **Conceptual Claim (The Bloc):** Commitment (2) is a conceptual claim about what constitutes a political side.
      *   *What to check:* This is not empirically falsifiable in the same way; it is a choice of ontology. However, if you find that voters consistently defect based on *policy* rather than *tribe* during a Swap, then the "Bloc View" (2) loses explanatory power compared to a "Policy View."

  **Final Recommendation:**
  Adopt the revision to (3). It transforms your set from a potentially contradictory mix of essentialism and historicism into a coherent **Historical-Bloc Theory**. The distinction is real (1), structural (4), and predictive of coalitions (1, 7), but its *ideological content* (3, 5, 6) is contingent on the current historical alignment of those blocs. This preserves your realism without trapping you in essentialist definitions that fail your own thought experiments.
