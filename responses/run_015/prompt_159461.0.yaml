  ### Phase 5: The Single Revision That Does the Most Work

  If you make only one change to your set, this is the one that maximizes the survival of your core intuitions (specifically the stability of labels in the Swap Case and the classification of Libertarians).

  **The Revision:**
  **Reinterpret Commitment (3) from a "Substantive Center of Gravity" to a "Contingent Historical Correlation."**

  **Why this works:**
  1.  **Saves (7) (Swap Case):** If (3) is only a correlation of the *current* era, then in the Swap Case, the correlation breaks, but the labels (defined by blocs) remain. You don't have to say the Swap Case is impossible; you just say the *substance* has decoupled from the *label*.
  2.  **Saves (5) (Libertarians):** Libertarians are Right not because they perfectly fit a timeless definition of inequality, but because they align with the *current* Right bloc. If the bloc changes, their classification might change, but for now, they fit the coalition.
  3.  **Saves (2) (Anti-essentialism):** This reinforces (2). It confirms there is no eternal essence of Left/Right, only historical blocs that *happen* to carry certain ideas (like inequality) for a time.
  4.  **Saves (1) (Prediction):** The distinction still predicts governing and coalition (the core of realism), even if it stops predicting specific policy content in a Swap scenario.

  **What you lose:**
  You lose the comfort that "Left" always means "challenging inequality." You must accept that "Left" fundamentally means "Member of Bloc A," and Bloc A *currently* challenges inequality, but could theoretically stop.

  **What you keep:**
  You keep the predictive power of the distinction regarding *who governs with whom* (which is usually more politically decisive than specific policy content). You keep the ability to classify outliers (Libertarians) based on alliance rather than purity tests. You keep the intuition that labels stick to organizations, not manifestos.

