answer: |-
  ### Phase 1: Brainstorming Candidate Tensions

  Before filtering, I am listing every friction point I can locate among your eight commitments. I will not judge their validity yet, only their existence.

  *   **T1 (Essence vs. Gravity):** (2) denies any shared principle defines the sides; (3) asserts a substantive "center of gravity" regarding inequality. Does a "center of gravity" function as a soft essence that contradicts "anti-essentialism"?
  *   **T2 (Prediction vs. Persistence):** (1) claims the distinction predicts policy bundling; (7) claims the distinction persists even when policy bundling swaps (Swap Case). If the policies swap, does the distinction lose its predictive power regarding policy, undermining (1)?
  *   **T3 (Libertarian Substance):** (3) defines Left/Right via attitudes toward inequality; (5) classifies Libertarians as Right. If Libertarians view market outcomes as natural (justified inequality), they fit (3). But if they view state authority as the primary hierarchy (unjustified inequality), do they fit (3)? This creates ambiguity in applying (3) to (5).
  *   **T4 (Politics vs. Culture):** (1) and (2) anchor the distinction in governing coalitions, funding, and enemies (political mechanics); (6) applies the distinction literally to non-political domains (theology, art) where no governing coalition exists. How can a distinction defined by coalition mechanics apply literally where no coalitions exist?
  *   **T5 (Structure vs. Contingency):** (4) claims the one-dimensional variance is "structural"; (2) claims the bonding is "historically transmitted" and contingent (enemies, org). Is the dimension structural *because* of the history, or does the history ride on a pre-existing structural dimension?
  *   **T6 (The Refused vs. The Anchored):** (7) says location is determined by existing blocs; (8) says a movement refused by blocs has *no* location. This seems consistent, but if the Refused Movement has clear substantive alignment with (3) (e.g., anti-inequality), does it remain location-less?
  *   **T7 (The Swap Case vs. The CoG):** In the Swap Case (7), the "Left" party defends inequality. This directly contradicts the definition of Left in (3). Either the label is wrong in the Swap Case, or (3) is not a definition.
  *   **T8 (Roll-Call vs. Manifesto):** (4) relies on roll-call votes (behavior); (7) advises ignoring manifestos (text). This is consistent, but (4) implies the behavior reveals a structure, while (7) implies the behavior reveals a coalition history. Are these the same thing?
  *   **T9 (Libertarian Allies):** (5) says Libertarians are Right even if culturally liberal. (1) says the distinction predicts "whom each side treats as its principal enemy." If Libertarians are Right, their enemy must be the Left. But on speech/drugs, their enemy is often the cultural Right. Who is the principal enemy?
  *   **T10 (Literal vs. Metaphorical Extension):** (6) insists the extension to theology is not metaphorical. If the core definition is political (1, 2), extending it non-politically without metaphor requires the political definition to be an instance of a broader category. But (2) says the category is *only* a historical bloc.

  ---

  ### Phase 2: Filtering and Dissolving

  Several tensions dissolve upon distinguishing between *logical necessity* and *sociological tendency*, or between *definition* and *correlation*.

  *   **T1 (Essence vs. Gravity) Dissolves:** (2) denies a *necessary condition* (no proposition such that accepting it puts you on the left). (3) asserts a *probabilistic tendency* (typical content). A cluster concept can have a center of gravity without having essential boundaries. *Distinction: Essence vs. Stereotype.*
  *   **T6 (The Refused vs. The Anchored) Dissolves:** (7) and (8) are two sides of the same coin. (7) explains how location is acquired (absorption); (8) explains the state prior to absorption. They form a consistent theory of political socialization. *Distinction: Process vs. State.*
  *   **T8 (Roll-Call vs. Manifesto) Dissolves:** Both prioritize behavior over text. (4) observes the behavior; (7) explains the behavior via coalition constraints rather than ideological sincerity. They reinforce each other. *Distinction: Observation vs. Explanation.*
  *   **T3 (Libertarian Substance) Dissolves (mostly):** If "inequality" in (3) refers primarily to *economic* distribution (as implied by the contrast with "state-led" in 8), Libertarians fit (3) as Right (market outcomes are justified). The tension only arises if "inequality" includes *authority* hierarchies. I will treat this as a definitional ambiguity rather than a structural contradiction. *Distinction: Economic vs. Social Hierarchy.*

  ---

  ### Phase 3: Ranking the Real Tensions

  The following tensions survive inspection. I rank them by severity, where severity is a function of how much of your set must be abandoned to resolve the conflict.

  #### **Severity 1: The Swap Case vs. The Substantive CoG (T7)**
  *   **Conflict:** Commitment (7) asserts that in the Swap Case, the "Left" label stays with the bloc even if it adopts Right policies (privatization). Commitment (3) asserts Left is the side that treats inequalities as needing justification. In the Swap Case, the "Left" bloc treats inequalities as justified (privatization).
  *   **Damage:** If you keep (7) (which seems central to your intuition about labels), (3) cannot be a timeless description of the Left. If you keep (3) as a universal claim, (7) is false (the party in the Swap Case becomes Right).
  *   **Cost:** Resolving this requires surrendering the universality of (3).

  #### **Severity 2: Political Mechanics vs. Cultural Extension (T4 & T10)**
  *   **Conflict:** Commitments (1), (2), (7), and (8) define Left/Right entirely through political mechanics (coalitions, voters, governing capacity). Commitment (6) applies the terms literally to non-political domains (theology, art) where these mechanics do not exist.
  *   **Damage:** If the distinction is *constituted* by coalition mechanics (2), it cannot apply literally to a poem. It would have to be a metaphor (contradicting 6) or the poem must be part of a political bloc (empirically dubious).
  *   **Cost:** Resolving this requires surrendering the "literal" claim in (6) or finding a trans-historical essence that contradicts (2).

  #### **Severity 3: Structural Dimension vs. Historical Contingency (T5)**
  *   **Conflict:** Commitment (4) treats the one-dimensional variance as "structural" (implying stability across systems). Commitment (2) treats the bonding as "historically transmitted" and contingent (enemies, funding).
  *   **Damage:** If the dimension is truly structural (e.g., human psychology), why does it rely on contingent party orgs (2)? If it relies on contingent orgs, is it really "structural" or just a stable artifact?
  *   **Cost:** Resolving this requires clarifying whether the "structure" is in human nature or in the *logic of competition* itself.

  #### **Severity 4: Libertarian Enemies (T9)**
  *   **Conflict:** Commitment (1) says the distinction predicts the "principal enemy." Commitment (5) places Libertarians on the Right. But Libertarians often view the cultural Right as an enemy (on drugs/speech).
  *   **Damage:** This weakens the predictive power claimed in (1).
  *   **Cost:** Requires nuancing what counts as the "principal enemy" (e.g., economic enemy vs. cultural enemy).

  ---

  ### Phase 4: The Audit Verdicts

  Here is what must go, or be modified, to resolve the ranked tensions.

  **1. On T7 (Swap Case vs. CoG):**
  *   **Verdict:** You must surrender the **universality of (3)**.
  *   **Reasoning:** Your intuition in (7) is that the *label* tracks the *bloc*, not the *policy*. If the bloc swaps policy, the label stays. Therefore, the substantive content (3) cannot be a defining feature of the label across time. (3) describes the *current* historical alignment, not the *logic* of the distinction.
  *   **Revision:** (3) becomes time-indexed: "In the current historical period, the Left is the side that..."

  **2. On T4/T10 (Politics vs. Culture):**
  *   **Verdict:** You must surrender the **literal claim of (6)**.
  *   **Reasoning:** If (2) is true (the distinction is a historical bloc defined by governability), there is no "Right theology" independent of a political movement that claims it. A "Right theology" is only "Right" insofar as it is allied with the Right political bloc. To call it literally Left/Right without that alliance contradicts the "bloc view."
  *   **Revision:** (6) becomes derivative: "Non-political things are called Left/Right insofar as they are functionally allied with or analogous to the political blocs."

  **3. On T5 (Structure vs. Contingency):**
  *   **Verdict:** You must clarify the **meaning of "structural" in (4)**.
  *   **Reasoning:** You do not need to drop (4), but you must specify that the structure is *competitive*, not *ideological*. The one-dimensional variance exists because competition forces binary coalitions, not because there is one true ideological axis.
  *   **Revision:** (4) is preserved, but interpreted as "The logic of binary competition creates a structural dimension," not "Human ideology is one-dimensional."

  **4. On T9 (Libertarian Enemies):**
  *   **Verdict:** You must refine the **definition of "enemy" in (1)**.
  *   **Reasoning:** The "principal enemy" is the rival *governing bloc*, not necessarily every subgroup within it. Libertarians are Right because their *governing* enemy is the Left bloc (on economic power), even if they skirmish with the cultural Right.
  *   **Revision:** (1) holds, provided "enemy" means "ruling rival," not "ideological opposite."

