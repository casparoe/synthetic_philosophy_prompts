      *   **Margin-for-Error (MFE) Principle:** An epistemic principle. Roughly: To know $P$ in a case $x$, $P$ must be true in cases sufficiently similar to $x$. Often formulated as: $K(Px) \to P(x')$ where $x'$ is close to $x$.
