prompt: |-
  I was chatting with my mate who works in local council planning and he said they're now using World Happiness Report scores to justify zoning and spending — like, they'll green-light a park if the predicted life-satisfaction bump is big enough, but they still run suicide-prevention hotlines funded by acute-distress metrics that never feed back into the ranking. It struck me as philosophically weird. If a country is actively trying to top these rankings, what does that presuppose about the nature of happiness — is it treating it as a measurable public utility, and does that need hedonism, or can it sit with a eudaimonic view where flourishing isn't just self-reported?

  Then you've got governments appointing wellbeing ministers and building happiness budgets, yet the same states treat mental-health crises and long-term population satisfaction as totally seperate policy tracks, almost like they're incommensurable goods. Does that split presuppose that suffering and happiness aren't on the same scale, or is it just bureaucratic incoherence? I want you to reconstruct the implicit philosophical theory behind this institutional pattern — what view of value and measurement it requires, whether its parts are consistent, and whether a country actually should try to maximise its ranking position given those commitments. Also, tell me what a policy genuinely built around Aristotelian flourishing, or even something like wild-animal welfare reduction, would have to change in practice. No need for citations, just work out the commitments.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

