      *   *Section 1: The Implicit Theory.* Call it "Aggregative Subjectivism with a Deontological Floor." It treats happiness as a fungible resource (hedonic) but treats death as a hard boundary (rights-based).
      *   *Section 2: The Incommensurability Question.* It's not that they are philosophically incommensurable; it's that they belong to different moral categories in the bureaucracy (Prevention of Harm vs. Promotion of Good). But mathematically, they *should* be on the same scale if the goal is utility.
      *   *Section 3: Consistency Check.* It's inconsistent. Optimizing the mean while ignoring the variance/tail is a failure of the underlying utilitarian logic. It invites Goodhart's Law.
      *   *Section 4: Should they maximize ranking?* No. Rankings are relative. Absolute scores matter. Also, adaptive preferences make self-reports unreliable for justice.
      *   *Section 5: Aristotelian Shift.* Move from "How do you feel?" to "What can you do/be?" Policy becomes about capabilities, not just mood.
      *   *Section 6: Suffering-Focused/Wild Animal Shift.* Move from "Average Happiness" to "Minimize Extreme Suffering." Radical prioritization of the bottom tail. Conservation becomes "suffering reduction" not "biodiversity preservation."

  7.  **Refining the Tone:**

