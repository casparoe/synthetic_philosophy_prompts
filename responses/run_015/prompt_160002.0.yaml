  This pattern presupposes that a record is fundamentally an artifact of institutional transaction, not merely information about a subject. The archive exists primarily to preserve evidence of state action, prioritizing legal-administrative integrity over narrative coherence.

  The neutrality claim rests on the weaker view: the custodian must not be the arbiter of truth. It does not assume a documentary trace carries meaning independently of who filed it; provenance rules explicitly tie meaning to the creator. However, it treats the creator's context (the administration) as the definitive structural framework. To rearrange files based on the governed's perspective would be to adjudicate against the administration's logic, violating neutrality defined as non-interference with the evidence of agency.

  Categorizing descendants' contributions as "associated material" presupposes a hierarchy of evidence. Records are primary traces of power; testimony is secondary commentary. A flat view of sources would treat oral testimony as equally constitutive of the historical record. By maintaining original titles despite dispute, the archive privileges the bureaucrat's categorization as the ontological ground of the file, reducing the descendant's correction to metadata.

  The practice is underdetermined between a *legal-evidential theory* (archive as proof of procedure) and a *pluralistic memory model* (archive as site of contested narratives). Both allow supplementary input without altering the core collection. A *functionalist theory* (serving the state) and a *heritage theory* (serving the public) both permit this hybrid model, though for different reasons.

  Concrete changes would depend on shifting these theories. If the archive accepted arrangement as interpretive, it would re-order files thematically or by community, acknowledging original order imposes a colonial narrative. "Tax defaulters" might be re-titled "Resistance." If testimony were accepted as record, oral histories would be accessioned as core collections. A descendant's naming would replace administrative labels, and disputed titles would be officially amended rather than noted beside them. The archive would shift from preserving the state's memory to co-creating community memory, transforming from a vault of evidence into a living forum where the structure itself is open to revision.
