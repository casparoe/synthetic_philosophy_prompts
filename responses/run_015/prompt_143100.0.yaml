      *   Global Meaning = Context-independent (Impossible).
      *   Local Meaning = Context-dependent (Possible).
      *   Step (2) assumes Local Meaning requires Context-independence. That is the error.

      *Does saving practical reasoning require smuggling back substantive meaning?* No. It requires recognizing "meaning" as an internal relation, not an external property. This is the deflationary save.

