answer: |-
  ### Desiderata for a Differentiated Theory of Artistic Value

  To construct a theory that distinguishes biographical, representational, and production-based moral failures without collapsing them, the following specifications must be met.

  #### 1. The Loci Distinction Requirement
  **Specification:** The theory must categorize moral flaws into three ontologically distinct buckets: (A) the creator's external biography, (B) the work's internal representational content, and (C) the material/economic conditions of the work's production and circulation. A verdict on one bucket cannot logically necessitate a verdict on another.
  **Motivating Case:** *A film whose production relied on exploitative labor practices yet whose narrative condemns exploitation.* Here, Bucket C is morally negative, while Bucket B is morally positive. A theory that conflates these cannot explain why the film might be ethically compromised yet aesthetically or rhetorically successful.
  **Status:** **Non-negotiable.** (This is the foundational architectural constraint of your inquiry; without it, the collapse you identified recurs.)

  #### 2. The Agency Diffusion Requirement
  **Specification:** The theory must provide a mechanism for assigning moral weight when authorship is collective, fragmented, or non-human. It cannot rely on a singular, identifiable "genius" locus of moral responsibility.
  **Motivating Case:** *A digitally generated image trained on stolen visual archives where no single human author can be identified.* Traditional theories rely on punishing or excusing a specific human agent. If there is no single agent, but the production (Bucket C) involves theft, the theory must evaluate the work without a clear biographical target (Bucket A).
  **Status:** **Non-negotiable.** (Contemporary art practices render the singular author model obsolete; a theory failing this is historically limited.)

  #### 3. The Empirical Consistency Requirement
  **Specification:** The theory's normative claims about how we *ought* to judge art cannot contradict robust findings in moral psychology regarding how we *do* judge art. Specifically, it must account for the "moral contagion" effect where disgust toward the creator bleeds into the perception of the object.
  **Motivating Case:** *A technically masterful portrait by a perpetrator of violence.* Empirical studies suggest viewers often report lower aesthetic quality when informed of the artist's crimes. A theory that claims aesthetic value is *objectively* unchanged by this knowledge risks describing an ideal viewer that does not exist.
  **Status:** **Preference of Naturalist Camp.** (Philosophers who prioritize normative ideals over descriptive psychology may reject this, arguing theory should correct intuition rather than follow it.)

  #### 4. The Evaluative Coherence Requirement
  **Specification:** Despite maintaining distinct loci, the theory must yield a unified evaluative output (or a structured hierarchy) rather than a fragmented list of unrelated verdicts. It must explain how to weigh a flaw in production against a virtue in form.
  **Motivating Case:** *A collaborative installation in which only one contributor committed fraud.* If the work is aesthetically brilliant but one co-creator defrauded investors, is the work "good"? A theory that simply says "Aesthetically Yes, Ethically No" fails to guide curation, acquisition, or consumption.
  **Status:** **Preference of Pragmatist Camp.** (Some post-structuralists might argue fragmentation is the correct outcome, but for a publication tracking value, a coherent verdict is usually required.)

  #### 5. The Non-Automatic Determination Requirement
  **Specification:** Knowledge of a moral failure in one locus must not function as a "trump card" that automatically nullifies value in another locus.
  **Motivating Case:** *A technically masterful portrait by a perpetrator of violence.* If biographical evil (Bucket A) automatically renders the painting aesthetically worthless, the theory collapses into radical moralism. If it automatically renders the biography irrelevant, it collapses into radical formalism.
  **Status:** **Non-negotiable.** (This is the specific problem you are trying to solve; automatic determination is the definition of the collapse you wish to avoid.)

  ***

  ### The Single Most Damaging Desideratum

  **The Agency Diffusion Requirement (Desideratum 2)** does the most damage to the three common positions.

  *   **Against Pure Formalism:** Formalism relies on the object's internal properties. However, the AI/Stolen Archive case forces the evaluation to consider the *process* (training data) which is external to the final image's pixels. If the "theft" is in the history of the image's generation, Formalism has no vocabulary to register the flaw without admitting context matters.
  *   **Against Pure Moralism:** Moralism typically seeks a moral agent to hold accountable (the artist). In the AI case, there is no single human perpetrator to condemn. Moralism struggles to condemn the *work* if it cannot condemn a *soul*. It risks either letting the work off the hook (no villain) or condemning the technology itself (which shifts the debate away from art).
  *   **Against Moderate Separatism:** This view looks to the work's internal properties while allowing some biographical context. However, "diffused agency" is neither internal property nor standard biography. It is a structural condition of the medium. Moderate Separatism lacks the architecture to handle ethical flaws that are systemic to the medium rather than personal to the author or visible in the content.

  ***

  ### The Jointly Unsatisfiable Pair

  **The Loci Distinction Requirement (1)** and **The Empirical Consistency Requirement (3)** are likely jointly unsatisfiable given current cognitive science.

  *   **The Conflict:** Requirement 1 demands that the theory treat biography, content, and production as conceptually separable variables. Requirement 3 demands the theory align with how human psychology actually processes aesthetic experience.
  *   **The Friction:** Empirical aesthetics suggests that moral disgust operates holistically; viewers do not naturally compartmentalize the "sin of the maker" from the "beauty of the made." The cognitive mechanism for aesthetic appreciation is often entangled with the cognitive mechanism for social trust. To demand strict conceptual separation (Req 1) is to demand a cognitive operation that empirical evidence suggests is unnatural or impossible for most viewers (violating Req 3).
  *   **Implication:** A theory that satisfies Req 1 will likely feel artificial and unusable to actual audiences. A theory that satisfies Req 3 will likely fail to keep the loci distinct, reverting to the "collapse" you identified.

  ***

  ### Scorecard: How the Three Positions Fare

  | Position | Performance Against Desiderata | Primary Failure Point |
  | :--- | :--- | :--- |
  | **Pure Formalism** | **Fails.** Satisfies Loci Distinction only by ignoring two of the three loci (Biography, Production). | Cannot account for the *Production/Circulation* flaws (e.g., exploitative labor, stolen data) because these are external to the object's form. |
  | **Pure Moralism** | **Fails.** Satisfies Empirical Consistency (matches our instinct to conflate) but violates Loci Distinction and Non-Automatic Determination. | Collapses all three loci into one; a biographical flaw automatically destroys aesthetic value, rendering the "masterful portrait by a violent perpetrator" unintelligible as art. |
  | **Moderate Separatism** | **Fails.** Satisfies Non-Automatic Determination but struggles with Agency Diffusion and Evaluative Coherence. | Lacks the tools to handle *collective* or *systemic* moral failures (e.g., AI training, collaborative fraud) because it relies on a dyadic relationship between a single author and a single object. |

  **Structural Conclusion:** The fault line lies not in whether morality matters, but in *where* morality is located. Current theories map morality to the **Author** (Biographical) or the **Object** (Representational). Your architectural challenge requires mapping morality to the **Process** (Production/Circulation) without letting it bleed into the other two. No existing dominant position successfully isolates the Process as an independent variable of value.
