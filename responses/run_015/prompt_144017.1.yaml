      *   **Goal:** Create a set of *desiderata* (requirements) for a theory of artistic value that distinguishes between three types of moral failure (biographical, representational, production/circulation) while maintaining coherence.
      *   **Context:** A long-form feature for a publication on philosophy and aesthetics. The user has realized the "separate the art from the artist" debate collapses distinct issues.
