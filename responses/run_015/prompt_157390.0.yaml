      *   **User Persona:** Mid-sized nonprofit manager (after-school tutoring). Practical, experienced with funding cycles, aware of Goodhart's Law but frustrated by its vagueness. Also part of a reading group on specification gaming in ML.
      *   **Task:** Draft a "desiderata list" for a theory of which measures survive being targeted.
      *   **Key Constraints/Questions to Address:**
          *   Must cover "selection without a target" (no optimizer) vs. agent-driven targeting?
          *   Must distinguish between *evidentiary* metrics (test scores) vs. *constitutive* metrics (completion rates)?
          *   Must predict the *shape* of failure (cliffs vs. smooth) or just existence?
          *   Must handle chains (metrics + audits becoming new targets)?
          *   Is the 4-way taxonomy (causal, adversarial, extremal, regress-to-the-mean) valid?
          *   **Ex Ante Requirement:** Must work *before* deployment (is this fair?).
          *   **Observational Equivalence:** Must distinguish "gaming" from "actual improvement" even if data looks identical.
          *   **Trade-offs:** Flag incompatible desiderata.
          *   **Eliminator:** Identify which single requirement knocks out popular framings (Slogan, Economics, ML).
      *   **Tone:** Intellectual, precise, pragmatic, slightly skeptical of academic abstractions, willing to take a stand.

  2.  **Deconstruct the Core Problem:**
      *   Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") is often treated as a warning, not a predictive theory.
      *   The user wants a *predictive* theory for *selection* of metrics *ex ante*.
      *   There's a tension between *mechanism* (how agents game) and *structure* (statistical properties of the metric).
      *   There's a tension between *agency* (someone optimizing) and *selection* (survivorship bias without intent).

  3.  **Address the Specific "Take a Stand" Questions:**
      *   *Selection without a target:* A robust theory *must* cover this. Campbell's Law often applies here. If the theory requires an agent, it misses publication bias or funding survival bias. *Stand: Include it.*
      *   *Evidentiary vs. Constitutive:* This is crucial. Pushing on constitutive metrics (completion) is often the *point* of the intervention. Pushing on evidentiary (test scores) is risky. *Stand: Theory must distinguish these.*
      *   *Shape of Failure:* "It breaks somewhere" is too weak for a nonprofit manager needing to set safe targets. *Stand: Must predict sensitivity/thresholds.*
      *   *Chains (Audits):* Yes, recursive gaming is real. *Stand: Must handle second-order effects.*
      *   *4-Way Taxonomy:* It's useful but often conflates mechanism with statistical artifact. *Stand: It's a heuristic, not a fundamental ontology.*
      *   *Ex Ante:* This is the hardest constraint. Most theories are post-hoc explanations. *Stand: It's a fair demand for *your* use case, but unfair for a *universal* theory. I need to flag this tension.*
      *   *Observational Equivalence:* If gaming and improvement look the same in the data, the theory must rely on *structural* knowledge, not just outcome data. *Stand: Theory must incorporate causal structure, not just correlations.*

  4.  **Drafting the Desiderata List:**
      *   I need to categorize these into "Non-Negotiable" (Core) and "Aspirational/Contested" (Camp-specific).
      *   *Non-Negotiable:* Causal Transparency, Agency/Selection Agnosticism, Constitutive vs. Proxy Distinction.
      *   *Aspirational:* Ex Ante Predictivity, Failure Topology, Recursive Stability.

  5.  **Addressing the Trade-offs (The "Impossible Triangle"):**
      *   *Ex Ante Specificity vs. Generalizability:* You can't have a universal law that tells you exactly *which* metric will break in *your* specific context without knowing the context.
      *   *Agency vs. Selection:* Mechanistic stories need agents; statistical stories don't. Merging them is hard.
      *   *Observational Equivalence:* You can't distinguish gaming from success *in the data alone*. You need external validation.

  6.  **Identifying the "Eliminator":**
      *   Which requirement kills the popular framings?
      *   *The Ex Ante Requirement.*
      *   *Slogan Version:* "Don't target measures." (Useless for someone who *must* target measures).
      *   *Economics Version:* Principal-Agent models assume known utility functions. They fail *ex ante* when the agent's action space is unknown.
