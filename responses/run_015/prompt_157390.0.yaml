      *   *Check:* Did I address the "constitutive vs. evidentiary" distinction? Yes, this is key for nonprofits (completion *is* the goal vs. test scores *indicate* the goal).
      *   *Check:* Is the tone right? Needs to be professional but sharp. Avoid fluff.
