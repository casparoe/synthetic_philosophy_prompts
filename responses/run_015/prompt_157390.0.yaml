      *   *Refinement on the "Eliminator":* I initially thought about "Causal Transparency," but "Ex Ante" is more devastating to current frameworks. Most frameworks explain *why* it broke, not *if* it will break.

  9.  **Final Polish:** Ensure the distinction between "Non-Negotiable" (what makes the theory useful for *you*) and "Camp Wants" (what theorists argue about) is clear. Make sure the "Ex Ante" tension is highlighted as the central philosophical problem.

  *(Self-Correction on the "Selection without Target" point)*: I need to be careful. Goodhart's Law is specifically about *targets*. Campbell's Law is broader. The user asks if the theory *must* cover selection without a target. I should argue that for *their* purpose (funding survival), it effectively acts like a target, so the theory should encompass it, even if purists disagree. I will take the stand that a *practical* theory must include it.

  *(Self-Correction on "Ex Ante")*: I need to be honest. A theory that perfectly predicts *ex ante* is likely impossible. I should frame this as a "Desideratum that reveals the limitation" rather than a box that can be fully ticked. I will mark it as "Aspirational/Contested" but note it's "Non-Negotiable for *your* utility." Wait, the prompt asks me to mark which are non-negotiable. For the *user*, Ex Ante is non-negotiable. For a *universal theory*, it's impossible. I will frame it as a tension.

  Let's organize the Desiderata into:
  1.  **Structural Validity** (Causal/Constitutive)
  2.  **Scope** (Agent vs. Selection)
  3.  **Predictive Power** (Ex Ante/Topology)
  4.  **Robustness** (Recursion)

