answer: |-
  This is a sharp diagnosis of a practical problem that theory often obscures. You are asking for a *design theory* for metrics, not just a *diagnostic theory* of failure. Most literature on Goodhart's Law is post-hoc explanation; you need pre-hoc selection criteria.

  Here are the stances I am taking to build your spec, followed by the desiderata list, the tensions, and the eliminator.

  ### The Stances (Boundary Conditions)

  1.  **Selection without a Target:** **Include it.** A practical theory for a nonprofit must treat "survival bias" (funding cuts, publication) as functionally equivalent to "optimization." If the system selects for high numbers regardless of intent, the metric degrades. A theory requiring a conscious agent is too narrow for your funding environment.
  2.  **Evidentiary vs. Constitutive:** **Distinguish them.** This is the single most important filter for your context. Pushing on a constitutive metric (completion rates) is often *management*; pushing on an evidentiary metric (test scores) is *gaming risk*. The theory must explain why the former allows pressure while the latter invites corruption.
  3.  **Shape of Failure:** **Predict topology.** "It breaks somewhere" is useless for budgeting. You need to know if the metric degrades linearly (safe to manage) or non-linearly at a threshold (dangerous to target). If the theory cannot distinguish a cliff from a slope, it cannot guide target-setting.
  4.  **Chains (Audits):** **Handle recursion.** If the theory doesn't account for the metric-audit dyad becoming a new single target, it fails in complex bureaucracies.
  5.  **The 4-Way Taxonomy:** **It is a heuristic, not an ontology.** The causal/adversarial/extremal/regress split conflates *mechanism* (how people cheat) with *statistical artifact* (why the correlation breaks). A robust theory should separate these.
  6.  **Ex Ante Requirement:** **Fair for you, impossible for universal theory.** It is a fair demand for *your* tool, but it reveals that no general "Law of Goodhart" can satisfy it without context-specific causal modeling.
  7.  **Observational Equivalence:** **Require Causal Structure.** Since gaming and success look identical in the outcome data, the theory cannot be purely empirical. It must rely on a model of the *process* generating the number, not the number itself.

  ---

  ### The Desiderata List

  I have divided these into **Non-Negotiable** (if the theory lacks these, it is useless for your specific task) and **Aspirational/Camp-Specific** (these are where theorists fight, and you may have to compromise).

  #### Non-Negotiable (The "Must-Haves" for Utility)

  | Desideratum | The Case / Consideration |
  | :--- | :--- |
  | **1. Causal Transparency** | **Consideration:** Observational Equivalence. <br>Since you cannot distinguish gaming from improvement in the output data, the theory must require a map of the causal pathway from *intervention* to *metric*. If the pathway is opaque, the metric is inadmissible regardless of historical stability. |
  | **2. Constitutive vs. Proxy Classification** | **Consideration:** Evidentiary vs. Constitutive. <br>The theory must formally distinguish metrics that *are* the value (e.g., meals served) from metrics that *correlate* with the value (e.g., long-term employment). Pressure on the former is alignment; pressure on the latter is risk. |
  | **3. Selection Agnosticism** | **Consideration:** Selection without a Target. <br>The theory must apply to metrics degraded by survival bias (funding cuts) even without a specific agent optimizing them. If it requires a "rational actor," it misses the systemic decay you see in funding cycles. |
  | **4. Threshold Sensitivity** | **Consideration:** Shape of Failure. <br>The theory must indicate *where* the metric breaks. Is degradation smooth (allowing for safe targets) or discontinuous (cliffs)? A theory that only predicts "eventual failure" cannot help you set a specific annual target. |

  #### Aspirational / Camp-Specific (The "Nice-to-Haves" that Conflict)

  | Desideratum | The Case / Consideration | Camp / Tension |
  | :--- | :--- | :--- |
  | **5. Ex Ante Predictivity** | **Consideration:** You need to pick metrics before deployment. <br>**Tension:** This fights with *Generality*. A theory general enough to cover all nonprofits cannot predict specific failures *ex ante* without deep local knowledge. | **Practitioner Want** vs. **Theorist Limit** |
  | **6. Mechanistic Specificity** | **Consideration:** Knowing *how* it will break (e.g., cream-skimming vs. teaching to the test). <br>**Tension:** This fights with *Selection Agnosticism*. Mechanistic stories require agents; selection stories do not. | **Economics/ML Camp** vs. **Sociological Camp** |
  | **7. Recursive Stability** | **Consideration:** Handling audit chains. <br>**Tension:** This fights with *Simplicity*. Modeling second-order gaming (gaming the audit) requires exponential complexity in the causal model. | **Systems Theory Camp** vs. **Parsimony** |
  | **8. Agent-Neutral Formulation** | **Consideration:** Covering publication bias/survival. <br>**Tension:** This fights with *Mechanistic Specificity*. If you remove the agent, you lose the ability to predict *intentional* distortion types. | **Campbell's Law Camp** vs. **Principal-Agent Camp** |

  ---

  ### The Incompatible Pairs (Trade-offs)

  You suspected tension; here is where it lives. You cannot maximize all of these simultaneously.

  **1. Ex Ante Specificity vs. Generalizability**
  *   **The Conflict:** To predict *ex ante* whether a specific metric (e.g., "tutoring hours") will degrade in your specific cities, the theory needs granular local data (agent incentives, local labor market, etc.). To be a general theory applicable to any nonprofit, it must abstract away those details.
  *   **The Cost:** If you demand *Ex Ante Specificity*, you lose the ability to use a simple checklist. You are forced into building a causal model for every metric. If you demand *Generalizability*, the theory becomes a vague warning ("be careful") rather than a selection tool.

  **2. Selection Agnosticism vs. Mechanistic Specificity**
  *   **The Conflict:** You want to cover "selection without a target" (funding survival bias). This treats the degradation as a statistical filtering problem. However, you also want to distinguish "gaming" (bypassing the target) from "improvement." Gaming implies an *agent* making a choice.
  *   **The Cost:** A theory robust enough to cover silent selection bias (no agent) struggles to explain *how* an agent will cheat. A theory detailed enough to predict *how* agents cheat (economics/ML) often fails to explain why metrics degrade in the absence of optimization (publication bias).

  **3. Observational Equivalence vs. Empirical Validation**
  *   **The Conflict:** You stated that gaming and success look identical in the data. Therefore, you cannot validate the theory using historical outcome data alone.
  *   **The Cost:** The theory must rely on *structural* assumptions (causal graphs) rather than *empirical* performance. This makes the theory unfalsifiable by data alone. You have to trust the model of the process, not the history of the numbers.

  ---

  ### The Eliminator: Which Requirement Kills the Popular Framings?

  The single requirement that knocks out the most popular framings is **Ex Ante Predictivity combined with Observational Equivalence.**

  Here is why this specific combination destroys the three common versions of Goodhart's Law you encounter:

  **1. The Slogan Version ("When a measure becomes a target...")**
  *   **Why it fails:** It is purely post-hoc. It tells you that a measure *has ceased* to be good. It offers no criteria for determining *which* measures will cease to be good before you start. It treats all metrics as equally vulnerable, which paralyzes decision-making.
  *   **The Kill:** It cannot satisfy **Threshold Sensitivity**. It gives no guidance on *how much* targeting is too much.

  **2. The Economics-of-Incentives Version (Principal-Agent Models)**
  *   **Why it fails:** These models assume the Principal knows the Agent's cost function and action space. In your nonprofit context, you do not know the "action space" of the program directors (e.g., can they quietly drop low-performing students?).
  *   **The Kill:** It cannot satisfy **Ex Ante Predictivity** without knowing the agent's private constraints. It also struggles with **Selection Agnosticism**, as it requires a rational optimizer to function.

  **3. The ML Reward-Hacking Version (Specification Gaming)**
  *   **Why it fails:** ML discovers hacking through massive simulation or trial-and-error training runs. It identifies failure by observing the reward spike while true performance drops.
  *   **The Kill:** It violates **Observational Equivalence**. In ML, you have a "ground truth" validation environment to detect the hack. In your nonprofit work, you *lack* the ground truth (you don't know the *real* learning, only the test score). You cannot run the "training run" to see if it hacks before you deploy the funding.

  ### Summary Recommendation for Your Guidance Document

  Since **Ex Ante Predictivity** is your non-negotiable need but the hardest theoretical lift, your guidance cannot rely on a single "Law." It must rely on a **Causal Audit**.

  Do not ask directors "What number can we promise?" Ask them: "Draw the causal chain from your activity to this number."
  1.  If the chain is **Constitutive** (Activity = Number), target it aggressively.
  2.  If the chain is **Evidentiary** (Activity -> Learning -> Test Score), do not target the number; target the activity.
  3.  If the chain has **Unobserved Nodes** (Activity -> ??? -> Number), the metric is inadmissible for targets, regardless of past stability.

  This sidesteps the impossibility of predicting *how* it will break by filtering out metrics where the break *cannot be detected*.
