  Your colleague's track record establishes a robust pattern of **anti-Whig historiography**. She consistently rejects narratives that impose present-day knowledge as the telos (end goal) of history, judge past actors by standards they could not possess, or dismiss contemporaneous alternatives as mere errors rather than structurally significant paths.

  ### Candidate Rules

  To understand how she might rule on the information-theory narrative, we must distinguish between two interpretive rules that both fit her first four cases but diverge on the fifth.

  **Rule 1: Strict Contextual Symmetry (The Anti-Teleological Rule)**
  *   **Definition:** Historical accounts must evaluate actors and theories solely by the standards, knowledge, and viable alternatives available *at the time*. No outcome is inevitable; no superseded theory is "primitive" if it was coherent within its context.
  *   **Application to Shannon:** This rule demands **Rejection**. The narrative calls Shannon's result "inevitable" (violating contingency), labels repetition codes "primitive" (violating symmetry), and judges engineers by "channel-capacity reasoning" (violating anachronism).
  *   **Support:** Fits all four previous cases, including the Calculus rejection (mathematical formalism is treated as contingent, not predetermined).

  **Rule 2: Epistemic Privilege (The Hard-Science Exception)**
  *   **Definition:** Strict contextualism applies to social, technical, or conventional domains (sanitation, aqueducts, printing, notation), but narratives in "hard" sciences may acknowledge objective supersession if the later theory describes a mathematical or physical truth that renders earlier attempts objectively inefficient or incorrect.
  *   **Application to Shannon:** This rule could permit **Acceptance**. Unlike miasma theory (empirically flawed) or Roman rituals (culturally specific), Shannon's channel capacity is a mathematical limit. Repetition codes *are* objectively less efficient. A colleague might view acknowledging this not as Whiggism, but as acknowledging mathematical reality.
  *   **Divergence:** Rule 1 rejects the Shannon narrative for its *form* (teleological). Rule 2 might accept it for its *content* (mathematical truth).

  ### Reasoning and Best Guess

  The Shannon narrative is a textbook example of Whiggish history: it posits a "problem waiting for theory" (teleology), dismisses prior work as "primitive" (erasure), and uses the solution to judge the predecessors (anachronism).

  However, the **Calculus case** is the critical constraint. Your colleague rejected an account of Newton and Leibniz for treating their formalism as "predetermined." This indicates she views even mathematical structures as historical contingencies rather than pre-existing truths waiting to be discovered. If she denies inevitability to calculus notation, she is unlikely to grant it to information theory, even if the latter involves physical limits. She appears to prioritize the *structure of the historical argument* over the *objective truth value of the science*.

  Therefore, the rule she is really running is **Rule 1 (Strict Contextual Symmetry)**. She is likely a methodological anti-Whig who believes that *how* we tell the story of science matters more than the current validity of the science itself. To call Shannon's work "inevitable" is to erase the human labor, false starts, and alternative coding schemes that actually constituted the history of the 1940s.

  ### The Adjudicating Test Case

  To distinguish whether she holds to **Rule 1** (No inevitability, ever) or a modified **Rule 2** (No inevitability, except in confirmed physical law), you need a case involving a discovered physical truth that was historically contingent.

  **Test Case:** A narrative about the **discovery of the Cosmic Microwave Background (CMB)**.
