  *   **Why it distinguishes:** Like Shannon, the Big Bang is currently accepted as 'true.' Like Sanitation, it involves competing theories that were once viable.
      *   If she **Rejects**: She adheres to **Rule 1**. She believes even confirmed scientific truths must be narrated as contingent discoveries, not inevitable destinations.
      *   If she **Accepts**: She adheres to **Rule 2**. She allows teleology when the scientific outcome is objectively verified as correct.

