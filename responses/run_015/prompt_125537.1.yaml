      *Self-Correction on Grade:* If this is an undergrad exam, 72 is fair. If it's grad level, it's lower. I'll assume upper-level undergrad. I'll stick with **74/100**.

      *Wait, one more check:* Did Strawson talk about "institutional exemption"? He talks about "exemptions" (the person is not a normal agent) vs "excuses" (the action was not intended). He does not explicitly endorse an "institutional exemption" where the *role* allows the *observer* to permanently drop attitudes. The student invents/imports this term and attributes it to Strawson. That is a clear misattribution.

