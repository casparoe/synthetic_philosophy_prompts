      *   **The User's Intuition:** They want to keep Step 10 ("I clearly know basic things") rather than Step 9 ("justification is never achieved").
      *   **The Task:** Identify the flaw/sleight of hand in the roommate's argument, specify which step to reject, explain the cost of rejecting it, and distinguish between settled vs. contested views in epistemology.
      *   **Constraint:** Do not present contested views as consensus. Be precise about philosophical status.

  2.  **Deconstruct the Roommate's Argument:**
      *   (1) Trilemma setup (Basic or Supported). *Standard.*
      *   (2) Foundationalism definition (Basic = self-justifying). *Standard but simplified.*
      *   (3) Critique of Foundationalism (Self-justifying = circular). *Contested/Objection.*
      *   (4) Conclusion on Foundationalism (Collapses into Coherentism). *Contested/Objection.*
