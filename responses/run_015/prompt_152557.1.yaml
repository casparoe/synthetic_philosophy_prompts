answer: |-
  This is a sharp objection, and given your background, you're spotting the tension exactly where it should be felt: at the interface between causal topology and agency.

  The short answer is: **No, Strawson's argument does not secretly rely on determinism.** In fact, he explicitly constructs the "Basic Argument" to be immune to the determinism/indeterminism debate. He would argue that introducing quantum stochasticity or non-ergodic branching doesn't solve the *causa sui* problem; it merely trades the problem of "necessitation" for the problem of "randomness," neither of which grants the control required for Ultimate Responsibility (UR).

  Here is the breakdown of why the regress holds even in a stochastic universe, framed in terms that respect your physics intuition.

  ### 1. Strawson's Explicit Stance on Indeterminism
  Strawson anticipates the exact objection you're raising. He distinguishes between **determinism** (the future is fixed by the past) and **determinateness** (there is a fact of the matter about what happens).

  His argument relies on the **Principle of Alternative Possibilities** only insofar as the agent must be the *source* of the choice. He argues:
  1.  To be UR, you must be the cause of your nature (mental states, weights, preferences).
  2.  To cause your nature, you must act from a prior nature.
  3.  Therefore, you need a prior nature to choose your current nature.
  4.  Infinite regress.

  Crucially, Step 2 holds whether the transition from Prior Nature $\to$ Current Nature is deterministic or probabilistic. If the transition is probabilistic, you still didn't *choose* the probability distribution.

  ### 2. The "Luck" Objection (The Physics of Agency)
  Your intuition is that a stochastic break in the causal chain interrupts the "lock" of prior conditions. In physics terms, if State $S_2$ is not a linear function of $S_1$ but involves a stochastic term $\epsilon$ (quantum fluctuation), then $S_1$ does not fully determine $S_2$.

  However, in metaphysics, this creates the **Problem of Luck**.
  *   **Determinism:** If $S_1 \to S_2$ is determined, and you didn't choose $S_1$, you didn't choose $S_2$. (No freedom).
  *   **Indeterminism:** If $S_1 + \epsilon \to S_2$, and $\epsilon$ is truly stochastic, then the specific outcome $S_2$ is not determined by *you* (the agent constituted by $S_1$). It is determined by chance.

  If a mental state arises partly from a quantum fluctuation, that fluctuation is not "authored" by the agent. It is an event that *happens to* the agent. For Strawson, responsibility requires **intelligibility**. For an action to be mine, it must flow from my reasons/character. If it flows from a quantum dice roll, it is unintelligible as an *action*; it is merely an *occurrence*.

  So, the regress isn't broken; it's just that the "links" in the chain are now fuzzy. But the question remains: **Who chose the fuzzy logic?** Who set the wavefunction amplitudes that govern the probability of your mental states? If you didn't choose the Hamiltonian of your mind, you aren't *causa sui*, even if the evolution is unitary and probabilistic.

  ### 3. Non-Ergodicity and Path Dependence
  You mentioned non-ergodic paths. This is a sophisticated point. In a non-ergodic system, the history matters; the system doesn't explore the whole phase space but gets locked into specific trajectories based on initial conditions.

  Strawson would seize on this. Non-ergodicity implies **path dependence**.
  *   If your mental trajectory is path-dependent, then your current state is heavily contingent on your *initial* conditions (the early boundary conditions of your neural development, genetics, etc.).
  *   Since you did not choose those initial boundary conditions, the fact that the path is non-ergodic (locked in) reinforces Strawson's point: you are trapped in a basin of attraction you didn't select.

  Even if there is stochastic branching (escaping a local minimum via thermal/quantum fluctuation), the *propensity* to escape is determined by the system's parameters. You are responsible for the parameters only if you chose them... which returns us to the regress.

  ### 4. The "Causal Buck" Stops Where?
  The core of Strawson's argument is about **sourcehood**.
  In a deterministic chain, the causal buck passes back to the Big Bang.
  In a stochastic chain, the causal buck passes back to the Big Bang *plus* a series of random noise terms.

  In neither case does the buck stop at the *Agent* in a way that allows the Agent to be the *ultimate* originator.
  *   **Determinism:** "I did it because my prior state necessitated it." (Strawson: "But you didn't choose the prior state.")
  *   **Indeterminism:** "I did it because my prior state probabilistically allowed it, and this outcome actualized." (Strawson: "But you didn't choose the probabilities, nor did you actualize the outcome consciously; it just happened.")

  For the regress to stop, you would need a mental state that is **self-justifying** and **self-causing** without reference to prior states. But a mental state that pops into existence without prior causal input (a "causal singularity") looks less like free will and more like a seizure or a random event. It lacks *rational control*.

  ### 5. Why It Feels Like Determinism
  You feel the argument relies on determinism because Strawson uses the language of "chains" and "conditions." But he is really talking about **explanation**.
  To explain why you chose $X$, we look to your reasons/character ($C_1$).
  To explain why you have $C_1$, we look to prior causes ($C_0$).
  If we introduce quantum noise, the explanation becomes: $C_0$ + Noise $\to$ $C_1$.
  The Noise term is not explained by *you*. Therefore, the explanation of your choice is not fully contained within *you*.

  ### Conclusion
  Strawson's argument survives the transition from classical to quantum physics because it targets the **concept of self-creation**, not the **mechanics of causal transmission**.

  Whether the transmission of mental states is via rigid gears (determinism) or probabilistic clouds (indeterminism), the agent never gets to stand outside the system to tune the gears or collapse the wavefunction in a way that is *ultimately* up to them.

  As a physicist, you might view the agent as a complex system with feedback loops. Strawson would agree but insist that **feedback is not self-creation**. A thermostat has feedback; it regulates its state based on input. But the thermostat didn't choose its set-point. Neither did you, ultimately.

  So, the impossibility of *causa sui* holds. Indeterminism gives you randomness, not authorship. And randomness is no more a foundation for moral responsibility than determinism is.

  *(Side note: This is why many philosophers pivot to Compatibilism—not by trying to break Strawson's logic, but by rejecting his definition of "responsibility" as requiring "ultimate self-creation." They argue responsibility only requires responsiveness to reasons, not metaphysical origination. But that's a debate for another pint.)*
