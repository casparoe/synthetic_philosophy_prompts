      *   Discuss the concept of *Causa Sui*. Even with stochastic branching, the *source* of the branching isn't chosen by the agent.
      *   Mention the "Intelligibility" condition. For an action to be responsible, it must stem from the agent's character/reasons. If it stems from quantum noise, it's unintelligible as an *action* (it's an event that happens *to* the agent).

