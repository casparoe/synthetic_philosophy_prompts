          *   However, full Kelly on the buffer is aggressive for a single bet with parameter uncertainty.
          *   Recommendation: Commit $10 Million.
          *   Why? It respects the Kelly fraction on the *buffer* (approx 1/3 of $30M), acknowledges the positive EV, but protects against the "soft ruin" of the stability clause. It bridges the EV maximizers (we are betting) and the Kelly folks (we are sizing based on risk capital).
          *   Wait, I need to address the "Half Kelly" fudge vs principle. Half Kelly is principle under uncertainty.
