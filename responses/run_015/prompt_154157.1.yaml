      *   **Key Issues to Address:**
          *   Specific number to commit OR decision rule with inputs.
          *   Define the "stake" (Bankroll): $180M vs. $30M buffer above threshold.
          *   One-off vs. Sequence: Does geometric mean reasoning apply to a single bet given perpetual investing afterwards?
          *   Probability disagreement (0.62 vs 0.55): Don't just split the difference.
          *   "Half Kelly": Principled or fudge?
          *   Payout/Gifts: Undermine or support geometric framing?
          *   Stability Clause: Is a 3-year freeze "ruin"? Does it strengthen/weaken geometric argument?
      *   **Format:** Board memo, 1,000-1,300 words. Prose accessible to trustees unfamiliar with Kelly.
      *   **Attachment:** Confidence statement for each substantive claim + one point least sure of + what would change mind.

  2.  **Deconstruct the Math & Logic:**
      *   **Expected Value (EV):**
          *   Payoff: +160% (get 2.6 back for 1 invested, net profit 1.6).
          *   Loss: -100%.
          *   EV = $p(1.6) - (1-p)(1)$.
          *   At $p=0.55$: $0.55(1.6) - 0.45(1) = 0.88 - 0.45 = 0.43$ (Positive).
          *   At $p=0.62$: $0.62(1.6) - 0.38(1) = 0.992 - 0.38 = 0.612$ (Positive).
          *   EV maximization says bet everything (up to constraint).
      *   **Kelly Criterion:**
          *   Formula: $f^* = \frac{bp - q}{b}$ where $b$ is odds received on wager (net profit per unit wagered), $p$ is prob win, $q$ is prob loss.
          *   Here $b = 1.6$.
          *   At $p=0.55$: $f^* = \frac{1.6(0.55) - 0.45}{1.6} = \frac{0.88 - 0.45}{1.6} = \frac{0.43}{1.6} \approx 0.268$ (26.8% of bankroll).
          *   At $p=0.62$: $f^* = \frac{1.6(0.62) - 0.38}{1.6} = \frac{0.992 - 0.38}{1.6} = \frac{0.612}{1.6} \approx 0.3825$ (38.25% of bankroll).
      *   **Defining the Bankroll:**
          *   Option 1: Total Assets ($180M).
              *   Kelly (0.55): 26.8% of $180M = $48M. Cap is $30M. So Full $30M.
              *   Kelly (0.62): 38% of $180M = $68M. Cap is $30M. So Full $30M.
          *   Option 2: Buffer above threshold ($180M - $150M = $30M).
              *   Kelly (0.55): 26.8% of $30M = $8.04M.
              *   Kelly (0.62): 38.25% of $30M = $11.47M.
          *   *Crucial Insight:* The committee split is driven by whether the "ruin" boundary is $0 or $150M. The prompt explicitly states: "a total loss on the maximum commitment would take us to almost exactly the $150 million clause threshold." This implies the $30M *is* the buffer.
          *   If we treat $150M as the effective ruin point (due to the stability clause penalty), the bankroll is effectively $30M.
          *   If we treat $0 as the ruin point (because we are perpetual and gifts exist), the bankroll is $180M.
      *   **One-off vs. Sequence:**
          *   Kelly maximizes long-term geometric growth.
          *   This is a one-off bet *within* a long-term portfolio.
          *   However, the consequence of loss (hitting the stability clause) impacts the *ability* to execute the long-term strategy (grantmaking suspension).
          *   Therefore, the "sequence" argument holds because the *consequences* play out over the subsequent decades (the 3-year freeze + reduced capital base).
      *   **Probability:**
          *   Internal (0.62) vs Consultant (0.55). Sponsor (0.70) is biased.
          *   Conservative approach: Use the lower bound (0.55) for risk calculations, or weight towards internal but discount for uncertainty. Let's use 0.55 for the "risk case" and 0.62 for the "base case".
      *   **Half Kelly:**
          *   Often used to reduce volatility/drawdown.
          *   Is it a fudge? It's principled if you acknowledge uncertainty in probability estimates. If $p$ is uncertain, full Kelly risks overbetting (which leads to negative growth).
      *   **Payout/Gifts:**
          *   5% payout drains capital. Gifts add capital.
          *   If payout > return, capital shrinks. If gifts > payout gap, capital grows.
          *   This affects the "perpetual" claim. If the fund shrinks due to payout, the buffer ($30M) erodes naturally over time anyway.
      *   **Stability Clause:**
          *   Is it ruin? It's not liquidation, but it's a severe reputational and mission penalty.
          *   It effectively creates a "soft ruin" boundary at $150M.
          *   This strengthens the geometric argument because hitting $150M changes the utility function drastically (utility drops sharply).

