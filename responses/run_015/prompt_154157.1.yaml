answer: |-
  **MEMORANDUM**

  **TO:** Finance and Risk Committee, Meridian Trust
  **FROM:** [Your Name]
  **DATE:** 12 March
  **SUBJECT:** Recommendation on Special Commitment Vehicle

  **Recommendation**

  I recommend the Committee authorize a commitment of **$10 million** to the sponsor's vehicle. This figure represents a specific compromise between expected-value maximization and risk-constrained growth, grounded in the reality of our Stability Clause. It is neither the full $30 million nor zero. It acknowledges the positive expected value of the opportunity while respecting the severe mission penalty associated with hitting our asset floor.

  **Defining the Stake: Total Assets vs. The Buffer**

  The primary disagreement among us concerns what constitutes our "bankroll." Two members treat the full $180 million as capital available for risk, implying that only total insolvency counts as ruin. Two members treat the roughly $30 million buffer above our $150 million Stability Clause threshold as the relevant capital. This distinction drives the gap between the factions more than any probability estimate.

  We must recognize that the Stability Clause creates a functional ruin point at $150 million. While legal insolvency occurs at zero, a three-year grantmaking suspension constitutes a failure of our perpetual mandate. It damages donor confidence, halts our mission, and freezes our operational purpose. Therefore, for the purpose of this specific binary bet, the $30 million buffer is the true stake. If we treat the full $180 million as the bankroll, we ignore the non-linear drop in utility that occurs if assets touch $150 million. By defining the stake as the buffer, we acknowledge that losing this capital changes the nature of the Trust, even if it does not liquidate it.

  **The One-Off Bet vs. Perpetual Horizon**

  Critics of geometric-mean reasoning (Kelly criterion) argue it applies only to repeated sequences of bets. This is a single vehicle with no secondary market. However, the argument for geometric reasoning does not collapse here because the *consequences* of the bet play out over a perpetual sequence.

  We are not gamblers leaving the casino after this hand. We are perpetual investors. If we lose the commitment, we hit the Stability Clause. The resulting three-year freeze and reduced capital base impair our ability to generate returns and fulfill payouts for decades. Conversely, if we win, the added capital compounds over our infinite horizon. Therefore, maximizing the long-term growth rate of the endowment remains the correct objective, even for a one-off bet, because the outcome feeds into a long sequence of future investment periods. The "sequence" is not the bet itself, but the life of the Foundation following the bet.

  **Probability and Sizing: Principles Over Compromise**

  We face conflicting probability estimates: 0.62 (Internal), 0.55 (Consultant), and 0.70 (Sponsor). We should disregard the Sponsor's figure as biased. Between Internal and Consultant, we should size the bet using the conservative 0.55 estimate. In risk management, errors of overconfidence are costlier than errors of caution.

  Regarding the Kelly criterion: The formula suggests committing approximately 27% of the bankroll at a 0.55 probability. If the bankroll is the $30 million buffer, this yields roughly $8 million. If the bankroll is $180 million, it suggests the full $30 million cap. Given my argument above that the buffer is the effective stake, the mathematical ceiling is near $8 million.

  This brings us to the "Half Kelly" proposal. Is it a fudge? In academic theory, full Kelly maximizes growth but incurs high volatility. In practice, where probabilities are estimated rather than known, full Kelly risks "overbetting," which can turn positive expectation into negative growth. Therefore, reducing the fraction is principled when parameter uncertainty exists. However, rather than arbitrarily halving the Kelly fraction, I propose we split the difference between the probability estimates while maintaining the buffer as the bankroll. Using the conservative probability (0.55) on the buffer ($30M) suggests $8 million. Acknowledging the Internal analysts' higher confidence (0.62) suggests up to $11.5 million. A $10 million commitment sits squarely between these figures. It respects the geometric logic without requiring us to adopt "Half Kelly" as a vague compromise.

  **Payouts, Gifts, and the Stability Clause**

  Does our 5% payout and unsolicited gift stream undermine this caution? Some argue gifts buffer us against ruin. Historically, gifts range from $2 million to $9 million. We cannot rely on them for risk sizing; they are variable income, not capital. Furthermore, the 5% real payout continuously erodes the $30 million buffer if investment returns do not exceed 5%. This erosion makes the buffer smaller over time, strengthening the argument for conservation rather than aggression.

  The Stability Clause deserves specific treatment. A three-year freeze is not liquidation, but it is a severe discontinuity. It validates the geometric argument because it introduces a "cliff" in our utility function. Standard variance modeling assumes smooth declines; the Clause creates a step-function penalty. This makes protecting the buffer more important than maximizing expected value. We cannot afford to treat the $150 million threshold as a soft line; we must treat it as a hard constraint for the purpose of this decision.

  **Conclusion**

  We are not refusing a positive bet, nor are we gambling the Foundation's operational viability. By committing $10 million, we capture significant expected value while retaining two-thirds of our safety buffer. This respects the perpetual mandate, acknowledges the uncertainty in our probability estimates, and treats the Stability Clause with the seriousness it demands.

  ***

  **Attachment: Confidence Statement**

  *   **Claim:** The $30 million buffer is the effective bankroll due to the Stability Clause.
      *   **Confidence:** High.
  *   **Claim:** Geometric reasoning applies because the Foundation's horizon is perpetual, even if the bet is not repeated.
      *   **Confidence:** High.
  *   **Claim:** The conservative probability (0.55) should be used for sizing rather than the internal estimate (0.62).
      *   **Confidence:** Medium-High.
  *   **Claim:** "Half Kelly" is principled here only as a proxy for parameter uncertainty, not as a general risk rule.
      *   **Confidence:** Medium.
  *   **Claim:** Unsolicited gifts should not be counted as capital protection for this decision.
      *   **Confidence:** High.

  **Point of Least Certainty:**
  I am least sure about the characterization of the Stability Clause as a "hard constraint." If the Board believes it could waive the clause or raise emergency capital to bypass the freeze, the effective bankroll returns to $180 million, which would justify the full $30 million commitment. I would change my recommendation to $30 million if the Committee formally confirmed that the Stability Clause is waivable under these specific circumstances.
