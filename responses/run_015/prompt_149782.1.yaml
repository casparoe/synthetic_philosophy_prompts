      *   *The Paradox Engine:* We need a situation where exercising my right to block something hurts me more than letting it happen, but I can't coordinate because of the rights structure.
      *   *Adaptation:* Sen's paradox is usually about *decisiveness* (my choice determines the outcome), not just *veto*. The prompt specifies "nobody can be forced to experience something they hate." This sounds like a veto. To make it Sen's Paradox, the veto must function as a decisive preference over a specific pair of social states.
