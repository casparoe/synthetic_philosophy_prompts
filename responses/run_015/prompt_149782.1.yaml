      *   *Bob:* Fish (10 pts) > Durian (5 pts) > Nothing (0 pts).
      *   *Residents:* Fish (10 pts) > Nothing (5 pts) > Durian (0 pts).
      *   *Rights:* Alice decides Nothing vs Fish. Bob decides Durian vs Nothing.
