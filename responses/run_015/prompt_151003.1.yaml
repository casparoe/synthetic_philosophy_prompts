answer: |-
  In the Metropolitan Conservation Lab, Researchers A and B monitor "Null-Pedestal 7," a digital-twin entry cataloging the volumetric absence left by the *Doryphoros* during restoration. Both agree that laser interferometry detects identical photon scattering patterns and that dust accumulation rates are normal, satisfying empirical equivalence; yet, both sincerely report a robust phenomenological "presence" when inspecting the empty plinth, describing it as a "structured gap" rather than mere empty space. Researcher A (the variantist) asserts, "The absence-object exists," meaning it is a valid referent within the optimal conservation framework, while Researcher B (the realist) asserts the same sentence, meaning the absence is a mind-independent structural constituent of the gallery. Crucially, the database attributes "modal inertia" to Null-Pedestal 7: the entry retains its identity and spatial coordinates in the simulation even across counterfactual scenarios where the physical walls are rearranged, provided the topological relations to the original sculpture's origin point hold. If this modal inertia were removed—reducing the absence to a mere snapshot of current air volume—their disagreement would collapse into a standard empirical dispute about sensor calibration; but with it, A claims the inertia is a useful fiction for tracking provenance, while B claims the inertia proves the absence is an ontological anchor.

  **Deflationist Verdict:** The deflationist (following Chalmers) classifies this as a verbal dispute rooted in quantifier variance. The linguistic divergence lies in the domain of the existential quantifier: for A, "exists" ranges over entities posited by the most pragmatically useful conceptual framework (the conservation database), whereas for B, "exists" ranges over mind-independent, joint-carving constituents of reality. When A asserts "The absence-object exists," they are making a true claim about framework utility; however, if this claim is directly translated into B's ontological idiom (asserting mind-independent status), it yields a falsehood by A's own lights. Because both parties agree on all non-ontological facts (the physics, the phenomenology, and the modal inertia), the deflationist argues the disagreement dissolves once they clarify that they are using "exists" to express different conceptual commitments rather than conflicting descriptions of the world.

  **Realist Verdict:** The realist (following Sider) classifies this as a substantive disagreement because both parties are employing the same unrestricted, joint-carving quantifier but diverge on its ontological commitment. The shared intuition—that there is "something present"—indicates they are latching onto the same phenomenon (the structured gap), but they disagree on whether that phenomenon satisfies the necessary conditions for objecthood. For B, the structural causal efficacy of the absence (its ability to constrain restoration choices) grants it ontological weight; for A, it does not. The disagreement is not about language, but about whether the structure of reality includes negative entities. The realist argues that A is not merely speaking a different "language" but is actively denying a truth about the world's structure that B perceives.

  **Role of Modal Inertia:** The modal-inertia feature prevents the dispute from collapsing into a standard empirical disagreement about measurement error. If the absence were defined solely by current physical boundaries (e.g., air volume), B's claim that it is an "object" could be falsified by better sensors showing mere emptiness. However, because the absence is defined by its *counterfactual resilience* (persisting across physical rearrangements), the dispute shifts from "Is there matter here?" (empirical) to "Do persistent modal profiles constitute objects?" (metaontological). This feature ensures that the disagreement rests on the *criteria for existence* rather than the *detection of properties*, keeping the debate firmly in metaontological territory.

  **Realist Counter-Move:** The realist argues the deflationist misapplies the merely-verbal diagnosis by ignoring a shared modal commitment that both parties accept but only B treats as ontologically binding. The realist contends: "We both agree on the modal inertia—we both agree the absence *would* persist across these counterfactuals. You admit this modal fact is real and robust; you simply refuse to label it 'existence.' But if the modal structure is mind-independent and causally efficacious (as we both admit), then denying it ontological status is not a linguistic choice; it is a metaphysical error. You are not speaking a different language; you are failing to quantify over the very structural features we both acknowledge govern the lab's reality."
