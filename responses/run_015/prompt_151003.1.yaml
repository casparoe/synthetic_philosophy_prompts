      *   *Condition 4 (Modal Inertia):* Need a feature where the absence *resists* change in a way that suggests objecthood, but isn't just physical law. Let's call it "counterfactual stability." If the pedestal were moved, the absence *would* stay anchored to the room's coordinate system, not the pedestal. Wait, that sounds physical. Let's try this: The absence persists in the database even if the physical pedestal is destroyed, *provided* the room's lighting and spatial relations remain identical. No, that's empirical.
