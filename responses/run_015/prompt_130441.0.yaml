      *   *Order:*
          1.  Phenomenology of Disagreement (The "Bad" Scene).
          2.  The Mechanism of Updating (Information as action).
          3.  Common Prior vs. Common Knowledge (The distinction).
          4.  Iteration (The process of convergence).
          5.  Beliefs vs. Values (The escape hatch).
          6.  The Leak Test (Application).
      *   *Dependencies:* You can't explain Common Knowledge without explaining Updating. You can't explain the Leak Test without explaining the Conditions (Prior, Knowledge, Values).

  4.  **Developing the Carrying Example:**
      *   *Requirement:* Two competent people, no hidden evidence, no stubbornness, no bad faith.
      *   *Idea:* A couple deciding on a house? A doctor and a patient? Two detectives?
