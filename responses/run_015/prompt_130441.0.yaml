      *   *Best for Writers:* Two editors deciding whether to acquire a risky manuscript.
      *   *Wait, User Constraint:* "Scene between two people... what it must contain... what it must lack."
      *   *Decision:* Two senior editors (Alice and Bob) deciding if a manuscript will win a prize.
