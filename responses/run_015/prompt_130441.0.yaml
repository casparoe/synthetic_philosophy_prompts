      *   *Must Lack:* Hidden emails, secret affairs, one lying, one being stupid.

  5.  **Addressing Misconceptions:**
      *   *M1: Splitting the difference.* (Arises when introducing convergence).
      *   *M2: Same Evidence vs. Same Prior.* (Arises when defining the starting state).
      *   *M3: Instant Convergence.* (Arises when discussing the mechanism).
      *   *M4: Descriptive vs. Normative.* (Arises immediately/throughout).
      *   *Missing M5:* Confusing Belief (is it true?) with Preference (do I want it?). This is crucial for fiction.

  6.  **The Leak Test:**
      *   *Placement:* End, but framed as a diagnostic tool, not a rule.
      *   *Critique:* The user's framing of the Leak Test is slightly risky if it becomes a checklist. It needs to be a "stress test."
      *   *Check for Understanding:* Give them a broken scene and ask them to fix the *structure*, not the dialogue.

  7.  **What to Refuse:**
      *   The math (Bayesian updating formulas).
      *   The proof of the theorem.
