      *   **Tone:** Professional, precise, literary-focused, pedagogical.

  2.  **Deconstruct Aumann's Agreement Theorem for Novelists:**
      *   *Mathematical Core:* If $P_1 = P_2$ (common prior) and $P_1(E)$ and $P_2(E)$ are common knowledge, then $P_1(E) = P_2(E)$.
      *   *Literary Translation:* If two characters share a worldview (prior) and fully understand *why* the other believes what they believe (common knowledge of posteriors), they cannot logically maintain different beliefs about the truth.
      *   *Nuance:* It applies to *beliefs* (facts/truth), not *values* (preferences/goals). It requires *iteration* (updating on the fact of disagreement).

  3.  **Drafting the Plan - Sequence & Dependencies:**
