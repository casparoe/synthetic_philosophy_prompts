answer: |-
  I'll take the second horn, without hesitation, because your first horn assumes the Best System would prioritise simplicity over fit to a degree no Humean would accept. If the frequencies are starkly different across epochs, the system that tracks them wins on fit, and that fit outweighs the simplicity cost of adding a time-index; so the chance really is 0.9 in the first epoch. Now, you say this makes the chance unknowable because its truth-maker lies in the future, but you're conflating the metaphysical ground of the chance with the epistemic evidence for it. Yes, the chance supervenes on the total history, but the total history includes the local frequencies you *can* see. An agent seeing ninety percent heads has excellent evidence that the best system assigns a chance of 0.9, because any system that didn't would struggle to be the best system overall. The future facts fix the chance, but the past facts reveal it, so the agent is neither blind nor misled.

  As for the Principal Principle, it doesn't demand you have the chance proposition as evidence; it demands your credence aligns with the chance *conditional on* the chance hypothesis. You distribute your credence over possible best systems based on your local evidence, and since the local evidence strongly favours the system that says 0.9, your credence ends up at 0.9. The norm works perfectly well. So let me press you on this: are you assuming that for a normative principle to guide action, the truth-makers for the terms in that principle must be fully present to the agent at the time of acting? If so, aren't you ruling out Humeanism by fiat rather than showing it fails to guide, since any supervenience base extending beyond the immediate present would trigger the same objection?
