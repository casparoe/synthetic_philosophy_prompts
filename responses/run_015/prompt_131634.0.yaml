      You are quite right to suspect that the blog post you encountered overreaches in its interpretation of Hilary Putnam. While the core setup of the Twin Earth thought experiment is described accurately, the philosophical conclusions drawn from it in the post stretch Putnam's original arguments well beyond their intended scope and ignore crucial nuances regarding the division of linguistic labor and the nature of psychological content. To begin with the basics, the blog post correctly outlines the scenario where Oscar and Twin Oscar are physical duplicates inhabiting worlds that are identical except for the chemical composition of the substance they call water. It is also accurate that Putnam uses this to argue that the extension of the term water differs between the two speakers despite their identical internal states. However, the leap from this specific case to the claim that meaning is never in the head in any respect and that internal states play literally zero role in fixing reference is where the summary begins to distort Putnam's position. Putnam's famous slogan that meanings just ain't in the head was specifically targeted at the traditional Fregean view that sense determines reference purely through internal psychological states, but he did not intend to suggest that internal states are causally inert or irrelevant to all aspects of language use and cognition.

      The most significant overreach in the blog post concerns the scope of the argument. Putnam originally restricted his claims primarily to natural kind terms and certain artifact terms, leaving open the possibility that other forms of content might remain internal. The post's assertion that Putnam thereby refutes any form of internalism about mental content including mathematics or self-knowledge is not supported by the Twin Earth paper. Putnam was careful to distinguish between terms that rely on empirical discovery of underlying structure, like water or gold, and logical or mathematical truths where the extension is not contingent on external physical composition. Similarly, statements about immediate self-knowledge such as I am in pain were generally treated as immune to this kind of externalist critique in his earlier work. By generalizing the Twin Earth conclusion to all mental content, the blog author attributes a global externalism to Putnam that he did not explicitly argue for in this context and which requires separate premises regarding the nature of propositional attitudes that Putnam did not supply in The Meaning of Meaning.

