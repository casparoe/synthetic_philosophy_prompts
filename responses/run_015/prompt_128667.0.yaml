      *(Least Certain Mapping)*: "Exaptation." Why? Because Maimonides implies the sacrifice is *tolerated*, not necessarily *repurposed* for a new adaptive function in the biological sense, but rather held as a placeholder until it can be abolished. Exaptation usually implies the trait becomes useful for something else permanently or long-term. Maimonides sees it as temporary (historically). I'll flag this.

