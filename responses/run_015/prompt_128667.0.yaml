          *   *The "Trace" of Idolatry:* In evolution, a trait is either functional, neutral, or deleterious. The idea that it's *ontologically contaminated* but *strategically useful* is theological, not biological.
      *   *Analysis of Missing Residue:* Does this show a limit in bio vocab or Maimonides' dependency on theology? It shows Maimonides relies on *providence* and *moral teleology*. Without a Lawgiver who knows the end state, the "concession" is just a local optimum, not a pedagogical step.
