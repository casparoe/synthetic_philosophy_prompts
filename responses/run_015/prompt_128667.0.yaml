      *   *Key Nuance:* Sacrifice retains a "trace" of idolatry (the form remains) but the *intent* is shifted. It's a transitional technology.

  3.  **Translate into Evolutionary Vocabulary (Task 1):**
      *   *Divine Intent/Teleology:* Must be removed or reframed as "selection pressure" or "systemic constraint." Since the prompt asks to avoid smuggling Maimonidean teleology, I need to treat the "Law" as a cultural system undergoing selection or a niche construction project.
      *   *Sacrifice as Universal Practice:* This is a *phylogenetic inertia* or a deeply conserved behavioral phenotype in the ancestral cultural environment.
      *   *Abrupt Prohibition:* Would cause high fitness costs (rebellion, group fragmentation).
      *   *Gradual Transition:* A strategy to minimize resistance.
      *   *Sacrifice retaining trace of idolatry:* The phenotype remains, but the function shifts. This sounds like *exaptation* (old structure, new function) or *ritualized aggression* (channeling violence).
      *   *Physician Analogy:* Managing an *evolutionary mismatch*. The old behavior is maladaptive in the new niche, but immediate extinction of the behavior is impossible.
