answer: |-
  Your instincts aren't broken; they are actually tracking a very specific, well-studied distinction in logic and computer science that standard introductory courses often gloss over. You are intuitively distinguishing between **Logical Constructivity** (Intuitionistic validity) and **Computational Content** (Realizability/Extractability).

  Your term "Proof Residue" is essentially a measure of **Witness Extractability** combined with **Uniformity**.

  There *is* a principle that sorts these, though it goes by different names depending on the school of thought: **Proof Mining** (Kohlenbach), **Realizability** (Kreisel), or **Curry-Howard Complexity**.

  Here is how to formalize your "Residue" intuition, sort your cases, and resolve the flip-flops.

  ### The Principle: The Extraction Hierarchy

  Your "Residue" is inversely proportional to the **work required to turn the proof into a program.** We can rank your examples on a spectrum from **High Residue (Direct)** to **Zero Residue (Erased/Impossible)**.

  1.  **Direct Construction (High Residue):** The proof term *is* the witness.
  2.  **Finite Decision (High Residue):** The proof is a finite decision tree (your 50-branch case).
  3.  **Unbounded Search (Medium Residue):** The proof guarantees a witness exists within a space, but you must search for it (Bertrand's Postulate).
  4.  **Probabilistic/Almost-Sure (Soft Residue):** The witness is found with probability 1, but no halting bound is guaranteed (Las Vegas).
  5.  **Squashed/Negative (Low Residue):** The proof eliminates impossibility but erases the rate/method (Continuity without modulus).
  6.  **Oracle-Dependent (Zero Residue):** The proof relies on non-computable assumptions (Halting Oracle).

  ### Analyzing Your Test Cases

  Here is how the principle applies to your specific gut verdicts.

  #### 1. The Explicit $\sqrt{2}^{\sqrt{2}}$ Construction
  *   **Verdict:** High Residue.
  *   **Why:** You have a concrete term. In Type Theory, this is a canonical normal form. You can hand this to a compiler.
  *   **Note:** The *classic* proof of this is actually non-constructive (uses Law of Excluded Middle: "either it's rational or it isn't"). If you have a version that explicitly constructs the irrational without case-splitting on truth values, you have successfully removed the logical debt.

  #### 2. Bertrand's Postulate (Counting Argument)
  *   **Verdict:** Low Residue (Search Required).
  *   **Why:** You proved $\exists p \in (n, 2n)$. In intuitionistic logic, this *should* give a witness. However, counting arguments often rely on "squashed" types. They prove the *cardinality* of the set of primes is $>0$, but they don't provide a function $f(n) \to p$. To get the witness, you have to iterate from $n$ to $2n$ and test primality. The proof gives you the *bound* for the search, but not the *result* of the search. The residue is the search algorithm you have to write yourself.

  #### 3. The 50-Branch Case Analysis
  *   **Verdict:** High Residue.
  *   **Why:** This compiles directly to a `switch` statement. Even if it's ugly, it is fully executable. The "residue" is preserved because every path terminates with a value. It is **uniformly computable**.

  #### 4. Continuity via Weak Negation (No Modulus)
  *   **Verdict:** Zero/Low Residue (Information Erasure).
  *   **Why:** This is the crux of your flip-flop. In Constructive Analysis (Bishop style), you *cannot* prove a function is continuous without producing a modulus of continuity.
      *   If your proof uses weak negation ($\neg\neg$) to assert continuity, it is logically intuitionistic but **computationally empty**.
      *   **The Distinction:** A modulus of continuity tells you *how much* input precision you need for a desired output precision. Without it, you cannot run the function on a computer (which deals with finite approximations).
      *   **Resolution:** The residue isn't "hidden"; it was **discarded**. Proving $\neg\neg \text{Continuous}$ is not the same as proving $\text{Continuous}$. Your instinct that it feels "missing" is correct.

  #### 5. The Halting Oracle Proof
  *   **Verdict:** Zero Residue (Hypercomputation).
  *   **Why:** You asked why this is different from the Continuity case.
      *   **Continuity Case:** The information *could* exist, but the proof structure threw it away (erasure).
      *   **Oracle Case:** The information *cannot* exist on a Turing Machine (impossibility).
      *   Even if the final statement is constructively valid, if the derivation depends on an oracle, the extracted program requires an oracle. For a standard computer, the residue is zero because the program cannot run. It is "constructive" only in a universe where halting is decidable.

  #### 6. The Las Vegas Algorithm (Probabilistic)
  *   **Verdict:** Soft Residue (Operational but not Logical).
  *   **Why:** This is the hardest case.
      *   **Logically:** In strict constructive type theory (like Agda/Coq), functions must be total (guaranteed to halt). A Las Vegas algorithm is *partial* (it halts with probability 1, but not necessarily in a bounded number of steps). Strictly speaking, this has **Zero Logical Residue** because it doesn't satisfy the termination checker.
      *   **Practically:** It has **High Operational Residue**. You can run it. It works.
      *   **The Sorting Principle:** This depends on whether you care about **Guarantees** or **Execution**.
          *   If "Residue" means "Can I run it today?" → High Residue.
          *   If "Residue" means "Do I have a constructive bound on runtime?" → Zero Residue.
      *   *My advice:* Classify this as **"Stochastic Residue."** It's runnable, but it leaks uncertainty. You don't know *when* it will finish, only *that* it will.

  ### The Formal Vocabulary for Your Intuition

  If you want to read more about this, your "Proof Residue" maps to three existing concepts:

  1.  **Realizability:** A semantic framework that asks, "What program does this proof correspond to?" If a proof is realizable by a Turing machine, it has high residue. If it requires an oracle, it has low residue.
  2.  **Proof Mining (Ulrich Kohlenbach):** This field explicitly tries to extract "residue" from proofs that look non-constructive. They take a classical proof, unwind it, and find the hidden bounds (moduli) you felt were missing in the Continuity case.
  3.  **Uniformity:** Your 50-branch case is uniform (one program handles all inputs). The Bertrand counting argument is often non-uniform (it tells you a prime exists, but the method to find it might change depending on $n$ in ways the proof doesn't specify).

  ### Summary Verdict

  Your instincts are **correct**. You are sensing the gap between **Intuitionistic Logic** (which forbids LEM but allows vague existence) and **Computational Type Theory** (which demands explicit witnesses and termination bounds).

  *   **High Residue:** Explicit terms, finite case trees.
  *   **Medium Residue:** Existence with bounds (requires search), Las Vegas (requires probability).
  *   **Zero Residue:** Weak negation (erasure), Oracles (impossibility).

  **On the Las Vegas flip-flop:** Call it **"Probabilistic Residue."** It counts as residue for an engineer, but not for a logician. The proof gives you a program, but it fails to give you a *proof that the program halts*. That missing halting proof is the "negative residue."

  You've essentially reinvented the motivation for **Martin-Löf Type Theory**: the desire to ensure that every proof leaves behind a high-residue, runnable artifact.
