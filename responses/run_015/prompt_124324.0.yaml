      *   *The "Single Revision":* However, the prompt asks for a revision to *clean up* the profile. The Lakatosian move is a patch. The deeper fix is modifying (a) to acknowledge *independent fitness measures*. But since the user is committed to Popper, the Lakatosian patch is more consistent with their ID.
