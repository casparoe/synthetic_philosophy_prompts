  hey, i need this for a philosphy of mind module i'm building. Before I read more reconstructions of Berkeley, I want the full spec. You're a professional philosopher who specializes in early modern metaphysics -- please think carefully, start with a quick brainstorm about what's actually at stake, then lay it out.

