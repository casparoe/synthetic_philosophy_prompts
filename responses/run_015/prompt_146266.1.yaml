answer: |-
  ### Instructor Note: Arithmetic Verification
  Before you distribute this, here is the verification you requested so you can speak confidently in section:
  1.  **Committee ($n=3, p=0.7$):** $P(\text{Majority Correct}) = 3(0.7^2)(0.3) + 0.7^3 = 0.441 + 0.343 = \mathbf{0.784}$. (Your number is exact).
  2.  **Assembly Independent ($n=41, p=0.55$):** Using exact binomial cumulative distribution, $P(X \ge 21) \approx \mathbf{0.738}$. (Your normal approx of 0.74 is safe for student use).
  3.  **Assembly Correlated:** If 31 votes move as a block determined by one person ($p=0.7$), that block exceeds the majority threshold (21). The 10 remaining independents cannot overturn the block. Group accuracy equals the leader's accuracy: $\mathbf{0.70}$.
  4.  **Conclusion:** The reform reduces accuracy from 0.784 to 0.70 (correlated) or 0.74 (independent). Your intuition is mathematically sound.

  ***

  ### Problem Set Question

  **Question 4: The Limits of the Jury Theorem (30 Marks)**

  The Oakwood Co-op (41 members) recently voted to move capital decision-making from a 3-person Maintenance Committee to the full membership. The Chair argued this would increase decision accuracy via the Condorcet Jury Theorem (CJT). You are tasked with evaluating this claim.

  **The Parameters:**
  *   **The Committee:** 3 members, competence $p=0.70$, voting independently.
  *   **The Assembly:** 41 members. On technical housing questions, the average member competence is $p=0.55$.
  *   **The "Dale" Factor:** In the Assembly, 10 members vote independently ($p=0.55$). However, 1 influential member ("Dale", $p=0.70$) effectively dictates the votes of 30 others. When Dale votes Yes, all 30 vote Yes. When Dale votes No, all 30 vote No.

  **(a) Calculate the probability of a correct majority decision for the original 3-person Committee.** (4 marks)

  **(b) Calculate the probability of a correct majority decision for the 41-person Assembly under two scenarios:**
  > (i) Assuming all 41 members vote independently with $p=0.55$. (Use normal approximation if preferred). (6 marks)
  > (ii) Assuming the "Dale Factor" structure described above. (6 marks)

  **(c) Based on your calculations, did the reform increase epistemic accuracy? Explain why the CJT failed to deliver the expected result in Scenario (ii), specifically addressing the role of independence versus headcount.** (8 marks)

  **(d) The Chair justified the reform by calling the roof decision a "question of fact" (will the roof leak?). Critically evaluate this justification. Does the CJT apply if the decision involves value judgments (e.g., risk tolerance vs. cost)? How should the Co-op structurally separate these elements?** (6 marks)

  ***

  ### Model Answer

  **(a) Committee Accuracy**
  For a 3-person committee with $p=0.7$, a majority requires 2 or 3 correct votes.
  $P(\text{Correct}) = \binom{3}{2}(0.7)^2(0.3)^1 + \binom{3}{3}(0.7)^3(0.3)^0$
  $= 3(0.49)(0.3) + 1(0.343) = 0.441 + 0.343 = \mathbf{0.784}$.

  **(b) Assembly Accuracy**
  **(i) Independent Case:** With $n=41, p=0.55$, majority requires $\ge 21$ votes.
  Using normal approximation: $\mu = 22.55$, $\sigma = \sqrt{41(0.55)(0.45)} \approx 3.19$.
  $P(X \ge 20.5) = P(Z \ge \frac{20.5 - 22.55}{3.19}) = P(Z \ge -0.64) \approx \mathbf{0.739}$.
  **(ii) Dale Case:** The "Dale Block" consists of 31 votes (Dale + 30 followers). Since the majority threshold is 21, this block determines the outcome regardless of the 10 independent voters. If Dale is correct (70% chance), the block votes correctly. If Dale is incorrect, the block votes incorrectly. The group accuracy is capped at Dale's competence: $\mathbf{0.70}$.

  **(c) Evaluation of Reform**
  The reform decreased accuracy. The Committee (0.784) outperforms the Assembly in both the independent (0.739) and correlated (0.70) scenarios. The CJT failed in Scenario (ii) because the theorem's engine is **independent signals**, not headcount. The theorem relies on errors cancelling out as $n \to \infty$. However, the 30 followers do not generate new information; they amplify Dale's signal. This correlation creates a "ceiling effect." No matter how many followers Dale acquires, the group cannot be more accurate than Dale himself. By deferring to Dale, 30 voters effectively reduce the epistemic size of the group from 41 to 1 (regarding that block), negating the statistical benefit of expansion.

  **(d) Fact vs. Value**
  The Chair's justification is flawed. CJT applies only to binary states of the world (facts) where a "correct" answer exists independent of the vote (e.g., "Is the roof structurally sound?"). It does not apply to preference aggregation (values), such as "How much risk are we willing to tolerate?" or "Is disruption worth the cost?" There is no fact of the matter on values; there are only conflicting interests. Applying CJT to values is a category error. To fix this, the Co-op should split the decision: use expert fact-finding (or CJT-structured voting) to determine the *condition* of the roof, but use standard preference aggregation (e.g., Borda count or bargaining) to decide the *risk/cost trade-off*. Conflating the two invalidates the theorem's license.

  ***

  ### Marking Scheme (30 Marks Total)

  **Part (a): Committee Calculation (4 Marks)**
  *   **2 marks:** Correct binomial setup (identifying need for 2 or 3 votes).
  *   **2 marks:** Correct arithmetic (0.784).
  *   *Common Error:* Calculating only exactly 2 votes (missing the 3-vote case), resulting in 0.441.

  **Part (b): Assembly Calculation (12 Marks)**
  *   **(i) Independent (6 marks):** 3 for correct parameters ($\mu, \sigma$, threshold 21), 3 for correct final probability (0.73–0.74 range accepted).
  *   **(ii) Dale (6 marks):** 4 for identifying the 31-vote block guarantees majority, 2 for concluding group accuracy = Dale's accuracy (0.70).
  *   *Common Error:* Trying to calculate a weighted average of competencies rather than recognizing the voting block dictates the outcome.

  **Part (c): Independence & Correlation (8 Marks)**
  *   **B-Level (4-5 marks):** Correctly states accuracy dropped. Notes that independence is required for CJT. Mentions that followers copy Dale.
  *   **A-Level (6-8 marks):** Explicitly identifies **independence** as the mechanism for error-cancellation. Explains that correlation creates an **accuracy ceiling** (group cannot exceed the leader). Articulates that adding correlated voters adds headcount but zero *information*.
  *   *Common Error:* Saying "people are irrational" rather than identifying the structural violation of the independence assumption.

  **Part (d): Fact vs. Value (6 Marks)**
  *   **B-Level (3 marks):** Notes that CJT needs a "right answer." Says values are different from facts.
  *   **A-Level (4-6 marks):** Distinguishes **epistemic** (truth-tracking) from **preferential** (utility-aggregating) decisions. Proposes a structural fix (splitting the factual determination from the value judgment). Acknowledges that applying CJT to values is a category error, not just a math error.
  *   *Common Error:* Arguing that values can be "correct" if voted on enough times (misapplying CJT to preferences).

  **A vs. B Distinction:**
  *   **B Answer:** Treats this as a probability drill. Gets the numbers right, notes independence is important, but fails to explain *why* correlation breaks the theorem (the information ceiling) or misses the normative implication of the Fact/Value distinction.
  *   **A Answer:** Uses the math to drive a theoretical argument. Explains that $N$ is irrelevant without independence. Recognizes that the "Dale" scenario turns a voting problem into a delegation problem. Correctly identifies that CJT cannot license decisions on risk/preferences.

  ***

  ### Instructor Note on Part (d) (Fact vs. Value)
  You asked if this is the "wrong lesson." It is not the wrong lesson, but it is the **advanced** lesson. In a second-year course, students often conflate "majority rule" with "truth tracking."
  *   **The Trap:** If you don't include Part (d), students may walk away thinking CJT is a general argument for democracy.
  *   **The Fix:** Part (d) forces them to see CJT as a specific tool for *epistemic* problems, not a blanket justification for all voting.
  *   **Pedagogical Warning:** Students will struggle to define "fact" vs. "value." In section, be prepared to clarify: "Will it rain?" is a fact (CJT applies). "Should we cancel the picnic?" is a value/preference (CJT does not apply, even if rain is involved, because the cost of getting wet varies by person). Your roof example is perfect for this distinction.
