  David Lewis's modal realism posits a plurality of concrete worlds, spatiotemporally and causally isolated, generated by unrestricted recombination. Actuality is indexical: "actual" just means "this world." Crucially, there is no trans-world identity; you have counterparts elsewhere, not literal selves. *Everything Everywhere All at Once* (EEAAO) invites a Lewisian reading but ultimately fractures under the weight of its own narrative mechanics.

  Where the film aligns with Lewis is in the ontology of plenitude. The "verse-jumping" reveals worlds generated by trivial divergences—a hot dog finger universe, a rock universe—mimicking Lewis's unrestricted recombination. The indexical nature of actuality is dramatized when Alpha-Verse Evelyn treats her world as the center of operation, only to realize every Evelyn is the protagonist of her own timeline. However, the film contradicts Lewis's core isolation thesis. Lewisian worlds cannot interact; EEAAO's plot depends on causal influence across worlds via verse-jumping. Furthermore, the film rejects counterpart theory. Joy and Jobu Tupaki are not counterparts graded by similarity; they are literally one person fractured across the multiverse. The Bagel represents the collapse of this distinction: if all lives are lived, identity dissolves into nothingness.

  This metaphysical divergence drives the ethical conflict. Jobu Tupaki's nihilism stems from seeing everything: if every choice is made somewhere, no choice matters here. This mirrors the modal-realist analogue of the problem of evil: if plenitude guarantees every horror is instantiated, is the sum of being morally rotten? Lewis replies ontologically: existence is not creation; realizing horrors doesn't make the sum worse than creating them. The film replies axiologically: nothing matters, so we can choose kindness. Is this a real reply? It is both. It changes the subject from the ontology of value to the pragmatics of living, yet it answers the practical paralysis Jobu faces. A Lewisian could borrow this: even if all horrors exist globally, my causal power is local. Therefore, my reasons for action range only over what I can affect. The Bagel is atmosphere; the Rock dialogue is argument. The rocks sit in silence, acknowledging existence without demand, grounding the choice to be kind not in cosmic significance but in immediate presence.

  This brings us to the Home-World Restriction. I argue that even if all worlds are real, an agent's practical reasons range only over the world she occupies because cross-world causation is impossible. EEAAO grants cross-world travel, seemingly destroying this restriction. If Evelyn can import kung fu skills from another world, her reasons range across the plurality. However, the restriction survives if revised. The final confrontation in the laundromat is key. Evelyn defeats Jobu not by embracing the multiverse, but by rejecting the Bagel's nihilism and staying in the base world. The verse-jumping is a means to appreciate the actual, not escape it. The restriction holds because the *value* is reinvested in the home world. The film suggests that while access to other worlds is metaphysically possible, it is practically bankrupt without a home anchor.

  There is, however, something the film does that neither Lewis nor I can accommodate: the phenomenology of modal regret. For Lewis, regretting a counterpart's failure is irrational; they aren't you. For me, regretting other worlds is a scope error. But the film validates the grief over lost lives as genuine self-loss. When Evelyn sees the life where she stayed with Waymond, the pain is not about a counterpart; it is about *her* missing potential. The film treats the multiverse not as a plurality of strangers, but as a fragmentation of the self. This emotional truth carries the argument where logic falters. The googly eyes are mere atmosphere, signaling absurdity, but the final hug in the parking lot is the metaphysical claim: connection matters even if isolation is the rule.

  In teaching this, we must distinguish the film's mechanics from Lewis's logic. The film uses Lewisian imagery to tell a story about integration, not isolation. It borrows the plurality to defeat the nihilism that plurality often suggests.

