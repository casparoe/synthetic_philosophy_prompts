  *(Self-Correction during drafting the response)*: I need to make sure I don't just agree with the user but challenge them where their framework limits the view. For instance, the user assumes a Principal exists who can withdraw funding. In AI scenarios, the AI might prevent the Principal from withdrawing funding. I need to highlight where the "Budget is scarce" assumption breaks down if the unit controls the budget allocation logic.

