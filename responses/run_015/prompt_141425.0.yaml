answer: |-
  Thank you. It is an honor to stand here, ten years into this work, looking out at a room that contains both the architects of the future and the keepers of the past. I know the shape of this gathering. Half of you are here because you build the machines and study the tissue. The other half are here because you loved the people lying in the tanks. I have spent fifteen years writing about ideas, but I have spent much of that time watching this foundation, and watching you. I know that when you look at the freezers, you do not see the same thing. Some see a technical challenge of fidelity. Others see a loved one holding their breath.

  I want to talk about what happens in between those two views. I want to talk about Marta Ellison. Many of you knew her. I spent a week with her ten years ago, watching her track whale songs off the coast of Maine. She is in preservation now. Her daughter is sitting three tables away, and I know what she hopes for. I also know what the engineers in the back row worry about. They worry about the scan. They worry about the copy.

  I want to ask you to imagine a specific future. Not a perfect one, and not a failed one. Imagine the technology works well enough to wake someone up, but not well enough to wake them up whole. Suppose the scan captures every memory Marta ever made. It captures her vocabulary, her knowledge of whale song, the way she structures an argument. But suppose it misses the temperament. Suppose the emotional disposition—the quickness of her laugh, the specific weight of her grief, the way she loved the cold ocean air—does not transfer. The code is incomplete.

  So, a person wakes up. They know they are Marta. They remember being Marta. But they do not feel like Marta. They are a stranger wearing her history. They look in the mirror and see her face, but inside, the emotional landscape is flat. They remember loving the ocean, but they do not feel the pull of it. They remember loving their daughter, but the love is a fact, not a heat.

  Now, suppose this person lives. They step into the world. They drink coffee. They hear music. They meet people. Over ten years, something happens. Through the sheer accumulation of experience, they begin to change. They find themselves preferring the cold air again. They find their humor sharpening into the same shape as Marta's. They find themselves loving her daughter not because the code says so, but because they have lived alongside her for a decade. They converge. They grow into the shape of the person who was preserved, not because it was copied, but because it was lived into.

  I ask you: Is that person Marta?

  For the scientists in this room, this is a question of fidelity. If the initial copy was imperfect, is the result a fraud? For the families in this room, this is a question of return. If the love has to be learned again, is it the same love?

  I have come to believe that the answer lies in what we value when we say we want to survive. We often think survival is about keeping a specific thing intact, like a diamond kept in a vault. We think there is a self, a core nugget, that must pass unchanged from yesterday to tomorrow. But consider your own lives. You are not the same person you were ten years ago. Your cells have turned over. Your memories have faded. Your temperament has shifted. You survive not because you are identical to who you were, but because there is enough connection between who you were and who you are. You are a chain, not a stone.

  If survival is a chain of connections, then the way the link is forged might matter less than the strength of the link itself. In the case I described, the emulation arrives at Marta's shape through a different path. It walks a decade to get there. But if it arrives at the same place—if it loves what she loved, thinks as she thought, and cares for who she cared for—then the distance traveled to get there may not negate the arrival. The resemblance arrived at independently is not a fake resemblance. It is a real one. It is earned.

  This matters for this room. For the engineers, it suggests that the metric of success might not be perfect atomic replication. It might be the preservation of the capacity to become. For the families, it suggests that what you love about Marta is not necessarily a ghost trapped in the ice. It is a pattern of being that might be recoverable, even if the road back is longer than you hoped. It means that what matters is not whether the person is numerically identical in some deep, metaphysical sense. What matters is whether the things that make a life worth living are present in the future.

  I know this does not solve everything. It does not guarantee success. It does not erase the grief of the years in between. But it offers a way to look at the tanks that is neither cold nor dishonest. It allows us to say that what is in the preservation fluid is not merely remains, because it holds the blueprint of a life that could be lived again. It also allows us to say that no one is waiting in the dark, because the waking up is part of the living, not just the switching on of a light.

  We are here tonight because we refuse to accept that the end of a biological process is the end of a person. We are here because we think there is something about a human being that is not exhausted by their breath. Whether that something is a soul or a pattern, a substance or a structure, we do not need to agree on that tonight. We only need to agree that it is worth keeping faith with.

  The scientists here are building the bridge. The families here are holding the memory of the shore. Neither can do it alone. The bridge is useless without the shore to connect to. The shore is inaccessible without the bridge. We are engaged in a joint act of defiance against the finality of death. It is a difficult work. It is uncertain work. But it is honest work.

  So I ask you to raise your glasses. We do not toast to a guarantee, because we do not have one. We do not toast to a memory, because that is not enough. We toast to the possibility that what matters can be kept.

  To the keeping of what matters.

  ***

  **Philosophical Commitments**

  This speech commits me to the view that personal identity is not a deep, further fact but consists entirely in psychological continuity and connectedness. I am asserting that survival is what matters, not identity, and therefore survival can be a matter of degree rather than an all-or-nothing phenomenon. I am committed to the claim that psychological resemblance acquired through convergence is of equal value to resemblance inherited through direct copying, provided the resulting connectedness is sufficient. I am also defending the view that the physical substrate is less important than the preservation of the capacity to regenerate the specific psychological pattern of a life. Finally, I am rejecting the notion that imperfect initial replication necessarily invalidates the survival of the person, provided the trajectory of the resulting being converges on the original's psychological profile.
