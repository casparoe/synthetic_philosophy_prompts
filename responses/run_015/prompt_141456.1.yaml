  | **A** | Is the district's target estimand the effect of *assignment* (ITT) rather than *completion*? | 0.95 | The policy decision is explicitly about running the same lottery again, not forcing attendance. |
  | **B** | Is the subgroup comparison unbiased by selection effects? | 0.10 | Completion is a post-treatment variable affected by the program, so conditioning on it breaks randomization. |
  | **C** | Is the subgroup advantage robust to multiple testing (p-hacking)? | 0.30 | You tested five cutoffs and selected the one favoring Y, inflating the false positive rate. |
  | **D** | Is the observed +1.0 ITT advantage for X statistical noise? | 0.30 | With N=200 per group and typical test SD, a 1-point difference is well within one standard error. |

  ### How the terms combine
  I model the probability that Y is better as the sum of two scenarios: one where the ITT metric holds (the likely case), and one where the Per-Protocol metric holds (the unlikely case).

  $$ \text{Credence} = (A \times D) + ((1 - A) \times B \times C \times 0.70) $$

  *   **Scenario 1 (ITT is king):** $0.95 \times 0.30 = 0.285$
      *   If we care about assignment (Term A), we ignore the subgroups. We only believe Y is better if the observed X advantage is noise (Term D).
  *   **Scenario 2 (Subgroups are king):** $0.05 \times 0.10 \times 0.30 \times 0.70 \approx 0.001$
      *   If we care about completion (1-A), the subgroups must be unbiased (Term B) and real (Term C). Even then, we only assign 0.70 credence based on your classmate's confidence.
  *   **Total:** $0.285 + 0.001 \approx 0.29$

  *Adjustment:* I am downgrading the final figure to **0.25** to account for the fact that Term D (0.30) assumes a symmetric distribution of error, but the p-hacking on the cutoffs suggests a broader tendency to overfit the data which might subtly contaminate the overall analysis plan.

  ***

  ### Three Things

  **1. Which single term is your final number most sensitive to?**
  My number is most sensitive to **Term D (Is the observed +1.0 ITT advantage for X statistical noise?)**.
  Because Term A is so high (0.95), the final credence is almost entirely a function of Term D. If you convinced me that a 1-point difference with this sample size is practically significant (lowering Term D to 0.10), my credence would drop to 0.10. If you convinced me the sample size is too small to trust the direction at all (raising Term D to 0.50), my credence would rise to 0.48. The validity of the subgroups (Terms B and C) has almost no leverage on my number because I have already weighted their scenario so low.

  **2. What one piece of evidence could the district collect next year to move that term the most?**
  To move Term D, the district should **increase the sample size of the lottery**.
  Term D is driven by the Standard Error of the difference between means. By increasing the number of students from 400 to, say, 1,000, the district would shrink the confidence interval around the ITT estimate. If X still wins by 1 point with 1,000 students, Term D would plummet (it's no longer likely noise), and my credence that Y is better would collapse.

  **3. Which sub-question are you and your classmate most likely disagreeing about?**
  You and your classmate are disagreeing about **Term B (Is the subgroup comparison unbiased by selection effects?)**.
  Your classmate's claim that "finer-grained is always more informative" implies he believes Term B is close to 1.0 (that comparing completers to completers is fair). You correctly suspect Term B is close to 0 (that completion is a mediator/collider induced by the treatment). This is the fundamental statistical disagreement: he sees stratification as controlling for variables, while you recognize it as conditioning on a post-treatment outcome, which reintroduces the selection bias the lottery was designed to remove.
