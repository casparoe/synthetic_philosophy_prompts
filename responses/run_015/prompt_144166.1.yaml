answer: |-
  There is no single, universally agreed-upon noun for this specific phenomenon, but political theorists, philosophers, and social scientists have converged on a cluster of concepts to describe it. The dynamic you are describing sits at the intersection of **post-truth politics**, **performative signaling**, and **organized lying**.

  Here is a breakdown of the established concepts, how they differ from traditional propaganda, and a nuanced analysis of Hannah Arendt's contribution, separating her settled arguments from contested interpretations.

  ### 1. Established Concepts for the Phenomenon

  While there is no single word, three frameworks are commonly used to analyze this specific behavior:

  **A. Costly Signaling (Political Science/Game Theory)**
  This is perhaps the most precise explanation for the "loyalty test" aspect. In evolutionary biology and economics, a "costly signal" is an action that is expensive or risky to perform, proving the actor's commitment to a group.
  *   **The Mechanism:** Repeating a claim that is obviously false to the outside world is "costly" because it invites ridicule or reputational damage from non-members.
  *   **The Function:** By accepting that cost, the supporter signals: "I value my allegiance to this group more than I value external validation or objective consistency." It is not about convincing the opponent; it is about sorting the tribe.

  **B. Harry Frankfurt's "Bullshit" (Philosophy)**
  In his seminal essay *On Bullshit* (1986), Frankfurt distinguishes "bullshit" from "lying."
  *   **The Liar:** Knows the truth and intentionally conceals it. They respect the truth enough to hide it.
  *   **The Bullshitter:** Is indifferent to the truth entirely. The statement is not made to describe reality, but to achieve a different effect (impressing, mobilizing, or signaling).
  *   **Relevance:** Your observation that "the falsehood isn't hidden; its transparency is almost definitely the point" aligns with Frankfurt's view. The speaker is not trying to get you to believe the fact; they are trying to change the atmosphere of the discourse.

  **C. Post-Truth Politics (Contemporary Political Theory)**
  Scholars like Lee McIntyre (*Post-Truth*, 2018) define this not as a claim that is false, but as a claim where **ideology overrides evidence**.
  *   **The Shift:** In ordinary politics, facts are the battlefield (e.g., "The unemployment rate is 5% vs. 6%"). In post-truth politics, the *authority* to define facts is the battlefield.
  *   **The Goal:** The goal is not to win a factual debate but to delegitimize the institutions (courts, audits, press) that adjudicate facts.

  ### 2. How This Differs from Propaganda and Cynicism

  It is crucial to distinguish this from traditional propaganda and pure cynicism, as the mechanics differ.

  **Vs. Ordinary Propaganda**
  *   **Traditional Propaganda:** Aims for **belief**. The state wants you to actually believe the enemy is weak or the economy is booming. If you catch them in a lie, their power diminishes because their authority rests on credibility.
  *   **This Phenomenon:** Aims for **alignment**. As political scientist Jennifer Mercieca argues, this is often "demagogic discourse." The claim functions as a shibboleth. If the supporter actually believed the lie were easily disprovable, they might stop saying it. The fact that they continue *despite* the disproval proves the point is not factual belief, but group cohesion.

  **Vs. Cynicism**
  *   **Cynicism:** Implies disengagement. A cynic says, "They are all lying, so nothing matters." It leads to apathy.
  *   **This Phenomenon:** Implies **hyper-engagement**. It demands active repetition and defense of the narrative. It is not a withdrawal from reality, but an attempt to *overwrite* reality with a competing social ontology. It reorganizes political life by creating two distinct epistemic communities that cannot agree on basic premises.

  ### 3. Hannah Arendt: Settled Views vs. Contested Interpretations

  You are correct that Arendt is the touchstone for this discussion, particularly her essay *"Lying in Politics"* (1971) and *The Origins of Totalitarianism* (1951). However, scholars debate how to apply her work to contemporary democracy.

  **What is Generally Settled (The Core of Her Argument)**
  *   **Factual vs. Rational Truth:** Arendt distinguished between "rational truths" (math, philosophy) and "factual truths" (events that happened). She argued that factual truth is surprisingly fragile because it relies on testimony and institutions.
  *   **The Goal of Modern Lying:** Arendt argued that modern political lying is not just about hiding secrets (traditional diplomacy) but about **destroying the capacity for truth-telling itself**. By flooding the zone with falsehoods, the liar makes it impossible for citizens to distinguish truth from falsehood, leading to apathy or reliance on the leader for "guidance."
  *   **The Destruction of the "Common World":** Arendt believed politics requires a shared reality (a "common world"). When lies become systemic, they dissolve the ground upon which debate stands. This matches your observation that the lie "reorganizes political life."

  **What is Genuinely Contested (Scholarly Debate)**
  *   **Does the Liar Believe the Lie?**
      *   *Reading A:* Some scholars argue Arendt believed totalitarians eventually fall victim to their own lies (self-deception), living in a fabricated reality.
      *   *Reading B:* Others argue Arendt viewed the liars as cold calculators who use the lie as a weapon, knowing it is false, but relying on the *audience's* inability to verify it.
      *   *Relevance to you:* In your scenario, if the supporters *know* it's false but say it anyway, Reading B is more applicable. However, Arendt warned that if the lying is successful enough, eventually *no one* (including the liar) can tell the difference.
  *   **Totalitarianism vs. Democracy:**
      *   *Reading A:* Arendt's framework was specific to totalitarian regimes (Nazism, Stalinism) where the state controls all information.
      *   *Reading B:* Contemporary scholars (like Timothy Snyder in *The Road to Unfreedom*) argue Arendt's insights apply to democracies when institutions are weakened.
      *   *The Contest:* There is no consensus on whether democratic institutions are robust enough to resist the "destruction of factual truth" Arendt described, or if her theory requires a fully controlled press to function as she predicted.
  *   **The Role of "Image" vs. "Lie":**
      *   In *"Lying in Politics,"* Arendt focused heavily on the "image-makers" (policy advisors who treat reality as malleable). Some critics argue she underestimated the role of *popular* participation in lying. In your example, it is the *supporters* repeating the lie, not just the state. Scholars debate whether Arendt anticipated a bottom-up participation in the destruction of factual truth, or if she viewed the populace primarily as victims.

  ### 4. Summary of the Dynamic

  The pattern you noticed is best described as **Performative Loyalty within a Post-Truth Regime**.

  1.  **The Claim:** Functions as a signal, not a fact.
  2.  **The Transparency:** The obvious falsity is a feature, not a bug; it filters out those unwilling to subordinate reality to group identity.
  3.  **The Fact-Check Trap:** Opponents engage in "epistemic bargaining" (trying to agree on facts), while proponents are engaged in "ontological warfare" (fighting over whose reality counts).

  Arendt provides the warning system: when factual truth is treated as optional, the "common world" dissolves, and politics becomes a struggle not over *what to do*, but over *what is*. Whether this leads to totalitarianism (as Arendt feared) or a stable but polarized dual-reality democracy is the open question currently contested by political theorists.
