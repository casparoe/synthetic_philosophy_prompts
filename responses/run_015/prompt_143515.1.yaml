      *   *Key Distinction:* The user's intuition is right. The teacher's solution works for (a) but fails for (b) and (c) without modification.

  3.  **Deconstruct Question 2: The Requirement for a Tie-Breaker:**

      *   *The "Why Act?" Problem:* If $Utility(A) = Utility(B)$, then $Utility(A) - Utility(Standing) = 0$ (assuming standing costs nothing). But standing *does* cost something (time, energy, opportunity).
      *   *The "Second-Order" Problem:* The user asks: Why choose "randomize" over "stand"?
