      *   *(b) Suspended Judgment (Ignorance):* I don't know if $A > B$, $B > A$, or $A = B$. This is risk/uncertainty. Standard decision theory says maximize expected utility, but you need probabilities. If you have *no* probabilities, it's a different problem (Knightian uncertainty).
      *   *(c) Incomparability:* $A$ and $B$ are on different scales (e.g., Career vs. Family). You can't say $A=B$, just that they don't compare. This is often harder than equality.
