answer: |-
  The air in the auditorium was stale, recycled through vents that rattled every time someone shifted in the plastic seats. On stage, the Student Council sat behind a long table draped in navy blue cloth, looking less like leaders and more like defendants. The issue was the Phone Ban. Four years. A total blackout of personal devices on campus.

  But we hadn't voted on the ban yet. We were still voting on who got to vote.

  "Point of order," Marcus said. He was a sophomore, sharp-eyed and standing near the microphone on the aisle. He represented the 'Safety First' coalition, which mostly meant he wanted the ban. "The eighth graders are present. They are entitled to their full votes under the Stakeholder Rule."

  From the back of the room, a cluster of seventh graders—visiting for orientation—cheered. They were the ghosts in the machine. Under the new bylaws, voting weight was calculated by exposure. A senior like me, Elara, would live under this ban for only one year. I got a quarter of a vote. An incoming eighth grader would live under it for all four. They got a full vote.

  "They aren't enrolled," I said into my mic. I was the Vice President, which today meant I was the tie-breaker for procedural motions. "You can't vote on a school policy if you don't go to the school."

  "They will be," Marcus countered. "The rule says 'anyone who will live under the decision.' That's a future tense condition. We have to project membership."

  "Who projects it?" I asked. "The Council?"

  "Yes."

  "Elected by whom?"

  "Last year's student body."

  "Which excluded eighth graders," I said. "So a group defined by the old boundary is defining the new boundary. That's circular."

  "Then who defines it?" Marcus threw his hands up. "If we wait for the eighth graders to define it, they aren't here yet. If we define it, we're biased. We're stuck."

  This was the boundary problem, plain and ugly. Before we could decide on phones, we had to decide on *us*. And every time we tried to draw the line, the pen slipped.

  "I move to invoke the Opt-Out clause," said David, the Senior Class President. He stood up in the senior section, a block of apathy dressed in hoodies. "The senior class expects to lose this vote. The math is against us. We declare ourselves outside the student body for the purposes of this legislation."

  A murmur rippled through the room. The Opt-Out was the second poison pill in our constitution. It was designed to protect minorities from tyranny. If you knew you'd lose, you could leave. You kept your bus pass and your library card, but the law didn't touch you.

  "If you opt out," Marcus said, his voice tightening, "you forfeit your vote. You can't choose to leave the room and then tell us how to paint the walls."

  "We're not telling you how to paint," David said. "We're telling you we're not in the room. So our quarter-votes shouldn't count toward the quorum."

  "But if you aren't in the room," I interjected, "who decides if your Opt-Out is valid? The Council?"

  "Yes," Marcus said.

  "Which includes me," I said. "A senior."

  "Recuse yourself," Marcus snapped.

  "Then who breaks the tie?"

  The regress was spiraling. We spent an hour debating whether the eighth graders were 'students' or 'pre-students.' Then we spent an hour debating whether the Seniors were 'opted-out' or 'observers.' Every repair to the voter roll was immediately challenged. If we counted the eighth graders, the Seniors cried foul. If we let the Seniors opt-out, the eighth graders cried that the quorum was broken. If we formed a committee to decide the boundary, someone asked who appointed the committee.

  I had spent the whole afternoon arguing for the 'Least Stake Principle.' I'd taken the floor three times.

  "The boundary cannot be drawn by those who benefit from the drawing," I had said, my voice echoing in the quiet room. "The group with the most to lose will draw the lines to save themselves. The group with the least to lose is the only neutral party. Seniors have the least stake. One year. We're leaving. We should be the ones to decide who counts."

  It was a clean argument. It felt like philosophy. Now, it felt like a trap.

  It was 4:45 PM. The janitor was sweeping the back aisle. Principal Henderson looked like he was aging in real-time.

  "We need closure," Henderson said. "I'm authorizing a final procedural motion to settle the voter roll. Once this passes, we vote on the ban. No more amendments."

  Marcus stood up. "I move to ratify the Voter Roll as currently constituted by the Elections Committee."

  I looked at the paper in front of me. The 'Current Roll' recognized the eighth graders as full voters. But it also contained a footnote: *Groups declaring Opt-Out status are classified as Non-Members and are ineligible to vote on the ratification of the Roll.*

  The motion was a snake eating its tail. To ratify the roll was to confirm that the Seniors—who had filed for Opt-Out—were not members. If they were not members, they had no right to vote on the ratification. But if they didn't vote on the ratification, the roll couldn't be ratified, because the Senior quarter-votes were needed for quorum.

  "Second," someone said.

  The vote was called. The room was split. The eighth graders and sophomores raised their hands. The seniors kept theirs down, claiming they had already opted out. The juniors were divided.

  The count came to me. The tally was tied.

  "Vice President," Henderson said. "You hold the tie-breaker on procedural motions."

  I looked at my hand. I looked at the seniors behind me. David was watching me. He knew what I'd argued all day. *The group with the least stake should decide.* We were the least stake. We were the deciders.

  But the motion on the table was a specific application of that logic that excised us. If I voted 'Yes,' I ratified a roll that said I wasn't a voter. I would be using a vote to destroy my own right to vote. I would be validating the boundary that excluded me.

  If I voted 'No,' the motion failed. The roll remained unsettled. The boundary remained undefined. We could not vote on the ban. We would be here tomorrow. And the next day. The regress would continue indefinitely, paralyzed by the inability to define the 'We.'

  "Elara?" Henderson prompted.

  I stood up. The microphone stand squeaked.

  I had argued that membership should be settled by those with the least stake. I was a senior. I had the least stake. Therefore, I had the authority to settle the membership. But to exercise that authority, I had to accept the motion that stripped me of the authority.

  The logic wasn't a circle anymore. It was a knot.

  I looked at the eighth graders, waiting with their full votes. I looked at the seniors, waiting with their quarter-voices. I realized that no matter how I cast this ballot, I was proving that the boundary was arbitrary. If I voted Yes, I showed that a voter can vote themselves out of existence. If I voted No, I showed that a voter can vote themselves into permanence.

  The boundary wasn't found. It was made. And I was the one making it.

  "Vice President, please cast your vote," Henderson said.

  I gripped the gavel. It felt heavy, made of wood that had come from a tree that didn't care about our bylaws. I looked at David. He gave a tiny, imperceptible nod. He knew I understood. To follow my own principle—to let the least stake decide—I had to make the decision. Even if the decision was that I didn't exist.

  I raised my hand.

  "All in favor," I said, my voice shaking just enough to be heard.

  I did not lower it.

  "Aye," I said.

  The gavel came down. The roll was ratified. The Seniors were officially non-members. I sat down, no longer a voter, waiting to see if the school I no longer belonged to would ban the phones I was no longer bound to surrender.
