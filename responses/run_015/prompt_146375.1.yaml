      *   **Key Mechanic:** Participants assigned "virtuous" roles must flip behavior based on social frame shifts (Anonymous/Low-stakes $\rightarrow$ Named/Competitive $\rightarrow$ Group/Loyalty).
      *   **Conceptual Angle:** "Virtue Scaffolding" (traits depend on environmental supports, not just internal character).
      *   **Format:** Casual email to a colleague.
      *   **Requirements:** Setting, group size, time, materials, step-by-step rules, point payoff, debrief mapping, predicted failures + fixes, limitations of the activity.
      *   **Tone:** Casual, colleague-to-colleague, slightly imperfect (typos allowed).

  2.  **Deconstruct the Philosophical Core:**
      *   *Virtue Ethics:* Character traits (honesty, courage, loyalty) are stable dispositions. A virtuous person acts virtuously across varying situations.
      *   *Situationism:* Behavior is determined more by situational factors than internal traits. (Doris, Harman).
      *   *The Twist (Virtue Scaffolding):* Instead of saying "virtue doesn't exist," say "virtue is relational/ecological." It needs the right scaffolding to hold.
      *   *The Game:* Needs to force a conflict between the assigned role and the incentive structure.

  3.  **Drafting the Activity - "The Trust Exchange":**
      *   *Setting:* Needs to be abstract enough to be quick, but concrete enough to feel real. A "Resource Allocation Committee" works well.
      *   *Groups:* 18 students. Let's do 3 groups of 6.
      *   *Rounds:*
          1.  *Round 1 (The Baseline):* Anonymous, low stakes. Just write down what you *think* is right.
          2.  *Round 2 (The Pressure):* Named, competitive, individual points. "Honesty" conflicts with "Winning."
          3.  *Round 3 (The Tribe):* Group points, loyalty rewarded. "Honesty" conflicts with "Team Loyalty."
      *   *Roles:* Give them virtue labels *before* Round 2. "The Honest Broker," "The Loyalist," "The Dissenter."
      *   *Payoff:* Needs to be meaningful but fake. "Seminar Credit Points" or just bragging rights + candy. Let's use "Philosophy Credits" (PCs) redeemable for a minor grade bump or candy.

  4.  **Refining the Mechanics (The "Flip"):**
      *   To ensure they flip, the incentives must *punish* the virtue in later rounds.
      *   *Round 1:* No incentives. Just pure expression.
      *   *Round 2:* Individual leaderboard. If you reveal too much truth, you lose resources. If you hoard, you win. The "Honest Broker" is forced to lie to survive.
      *   *Round 3:* Group score. If you dissent against the group, the group loses. The "Courageous Dissenter" is forced to conform.

  5.  **Addressing "Virtue Scaffolding":**
      *   This needs to come out in the debrief. The game shows the scaffold collapsing.
      *   *Analogy:* Ivy on a wall. Remove the wall (structure), the ivy falls. It's still ivy, but it can't climb.

  6.  **Writing the Email (Tone & Structure):**
      *   *Subject Line:* Needs to be catchy. "Seminar game draft."
      *   *Opening:* Friendly, acknowledging the difficulty of teaching situationism.
      *   *The Pitch:* "The Scaffold Collapse."
      *   *Logistics:* 18 kids, 75 mins.
      *   *Materials:* Index cards, slips of paper.
      *   *Steps:* Clear, numbered.
      *   *Debrief:* Crucial part. Connect game moments to Doris/Harman.
      *   *Troubleshooting:* What if they rebel? What if they don't flip?
      *   *Limitations:* What can't a game do? (Long-term character development).
      *   *Sign-off:* Casual.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 75 mins enough?
      *   *Fix:* Keep rules simple. Don't over-explain the philosophy before playing. Play first, talk later.
      *   *Critique:* Will they actually flip?
      *   *Fix:* Make the penalty for virtue severe. In Round 2, honesty must cost points. In Round 3, dissent must cost the team.
      *   *Critique:* Is "Virtue Scaffolding" clear?
      *   *Fix:* Explicitly mention it in the debrief section as the "takeaway."
      *   *Tone Check:* Ensure it sounds like an email, not a formal paper. Use "hey," "look," "tbh." Allow a typo or two (e.g., "thier" in prompt, maybe I'll leave one or two natural slips).

  8.  **Final Polish:**
      *   Check the role cards. Make sure they sound virtuous but become liabilities.
      *   Ensure the payoff scheme is clear.
      *   Make sure the "Predictable Failures" section is honest.

  *(Self-Correction on "Typos"):* The prompt asks me *not* to worry if there's a typo or two, implying I should write naturally. I won't intentionally insert errors, but I won't obsess over perfect polish either. I will focus on the casual voice.

