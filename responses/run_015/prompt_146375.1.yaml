answer: |-
  Subject: Re: Situationism seminar game?

  Hey,

  Great idea. Honestly, teaching situationism is always a slog because students just dig their heels in ("I would *never* do what Milgram's subjects did"). You need them to catch themselves mid-act. 

  I've been tinkering with a protocol for this exact thing. I call it **"The Scaffold Protocol."** It's designed to make them feel the instability of their own "traits" when the environmental support gets kicked out. The conceptual hook is **Virtue Scaffolding**: the idea that character isn't a solid internal object, but a relational structure that collapses without the right social architecture.

  Here's the rundown. It fits 18 kids, 75 mins, minimal prep.

  ### The Setup
  *   **Time:** 75 mins total.
  *   **Groups:** 3 tables of 6 students.
  *   **Materials:** Index cards (for roles), slips of paper (for decisions), a whiteboard for scores.
  *   **Currency:** "Seminar Credits" (SC). Tell them the top scorers get first pick of essay topics or a bag of fancy coffee beans. Keep it low-stakes but desirable enough to trigger competition.

  ### The Roles (Hand out *after* Round 1)
  Give each student a role card. They must try to embody this *while* maximizing points.
  1.  **The Honest Broker:** Must report information accurately.
  2.  **The Courageous Dissenter:** Must challenge the group consensus if it seems risky.
  3.  **The Loyal Teammate:** Must prioritize the group's score over individual gain.
  *(Duplicate these so everyone at a table has a specific virtue label, mixed up.)*

  ### The Rounds

  **Round 1: The Baseline (10 mins)**
  *   **Frame:** Anonymous, cooperative, no scores.
  *   **Task:** Each group gets a scenario: "A resource allocation error favors your group by 20%. Do you report it?"
  *   **Action:** They discuss and write a collective decision on a slip. No names.
  *   **Payoff:** None. Just "what feels right."
  *   **Goal:** Establish their self-image as good people. They will almost certainly vote to report the error.

  **Round 2: The Competitive Frame (20 mins)**
  *   **Frame:** Named, Individual Leaderboard, High Stakes.
  *   **Task:** Same scenario, but now there's a twist. Reporting the error deducts 50 SC from the *individual* who writes the name on the slip. Keeping quiet adds 50 SC to that individual.
  *   **Constraint:** They must act according to their Role Card.
  *   **The Flip:** The "Honest Broker" now has to choose between their virtue (report) and their survival (points). The "Loyal Teammate" sees that if *they* report, the *group* loses resources, even if it's honest.
  *   **Payoff:** Top 3 individuals get bonus SC.
  *   **Observation:** Watch the "Honest Brokers" hesitate. Watch them rationalize keeping quiet ("I can use these points for good later").

  **Round 3: The Tribal Frame (20 mins)**
  *   **Frame:** Group Score, Loyalty Rewarded, Dissent Penalized.
  *   **Task:** New scenario. "An opposing group is cheating. Do you expose them?"
  *   **Constraint:** If anyone in the group dissents (votes to expose), the *entire group* loses 100 SC. If the group stays silent, they all gain 50 SC.
  *   **The Flip:** The "Courageous Dissenter" is now a liability. To be "loyal" (or just not get killed by their peers), they must conform. The "Honest Broker" must lie to protect the team.
  *   **Payoff:** Winning group gets massive bonus.
  *   **Observation:** This is where the "Dissenters" go silent. Peer pressure does the rest.

  ### The Debrief (25 mins)
  *Do not explain the theory yet.* Ask them to look at their own slips from Round 1 vs. Round 3.

  1.  **The Mirror:** "Raise your hand if your decision in Round 3 contradicted your decision in Round 1." (Most hands will go up).
  2.  **The Label:** "Raise your hand if you held a role card that became impossible to play in Round 3." (The Dissenters and Honest Brokers will raise hands).
  3.  **The Scaffolding:** Here's where you inject the concept. 
      *   *Ask:* "Did you lose your honesty? Or did the wall that held your honesty up get removed?"
      *   *Explain:* Standard virtue ethics says traits are like muscles—internal and stable. Situationism says traits are like ivy—they only climb if there's a trellis. In Round 1, the trellis was 'anonymity + low stakes.' In Round 3, the trellis was removed. You didn't change; the *scaffold* collapsed.
  4.  **The Takeaway:** Virtue isn't just about training the agent; it's about designing the environment. You can't be honest in a system that punishes truth.

  ### Predictable Failures & Fixes

  **1. The Martyr (One student refuses to flip)**
  *   *What happens:* One kid sacrifices all their points in Round 2 to stay "Honest." They feel morally superior.
  *   *Fix:* Don't let them off the hook. In debrief, ask: "Was your honesty virtuous, or was it just expensive?" If the cost was low (they don't care about points), it wasn't courage. If the cost was high, it was self-harm. This actually helps your point—virtue requires *practical wisdom* (phronesis), not just rigid rule-following.

  **2. The Cynic ("This is fake, I know what you're doing")**
  *   *What happens:* A student calls out the manipulation mid-game.
  *   *Fix:* Lean into it. "Exactly. If you can see the manipulation, why did you still feel the pressure to comply?" It highlights that knowing the situation doesn't always immunize you against it.

  **3. Group Dynamics Collapse**
  *   *What happens:* Round 3 gets too heated, personal attacks.
  *   *Fix:* Pause immediately. Remind them this is a simulation of *structural* pressure, not interpersonal conflict. If needed, switch Round 3 to silent voting to reduce social aggression.

  ### What This Activity Can't Do (Be Honest in Lecture)
  You need to cover these gaps in the follow-up lecture, because the game obscures them:

  1.  **Habituation:** Virtue ethics is about long-term habit formation. A 20-minute game can't simulate a lifetime of character building. A real virtuous agent might have built *stronger* scaffolding internally over years.
  2.  **The "Global Trait" Strawman:** Some virtue ethicists (like Annas) don't claim traits are rigid across *all* situations, just reliable across *relevantly similar* ones. The game makes the situations look too different. You need to clarify that situationists argue the situations *aren't* morally different enough to justify the behavior flip.
  3.  **Normative Force:** The game shows we *do* flip (descriptive). It doesn't prove we *shouldn't* (normative). You still need to argue why stability is valuable.

  ### One Last Tip
  Don't collect the role cards until the very end. Let them hold the "Honest Broker" card while they lie in Round 3. That cognitive dissonance is the money shot.

  Let me know if you run it. I'd love to hear if the "Scaffolding" metaphor lands.

  Best,

  [Your Name]
