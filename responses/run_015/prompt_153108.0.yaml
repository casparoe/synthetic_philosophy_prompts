answer: |-
  There is no single established technical term for this phenomenon in standard decision theory, though it is precisely characterized as a violation of description invariance driven by domain-specific framing effects.

  This inconsistency occurs when an agent's preference ordering reverses based on the narrative context of the gamble rather than its formal structure, directly contradicting the axiom of description invariance required by expected utility theory (EUT). While standard **expected-value fanaticism** refers to the consistent prioritization of low-probability, high-impact outcomes across all domains (often criticized via Pascal's Mugging arguments), your described phenomenon is **selective fanaticism**, where the unbounded utility function is activated only for "sacred" or civilization-scale values while remaining bounded for mundane interventions. This differs fundamentally from **scope neglect**, where agents fail to scale their valuation with the magnitude of the outcome regardless of context; here, the agent *does* scale the valuation in the existential context but suppresses that scaling in the medical context, indicating an inconsistency in risk attitude rather than a blindness to magnitude.

  The phenomenon does not require explicit endorsement of formal decision theory to occur; it arises frequently in intuitive moral reasoning where distinct psychological registers govern "tragic" versus "routine" trade-offs, often analyzed under **protected values** or **sacred values** theory (e.g., Tetlock et al.). In formal terms, the edge of the phenomenon lies in whether the agent claims normative consistency: if they admit their utility function is context-dependent, they are rejecting standard EUT in favor of a contextual utility model, but if they claim a uniform calculus while behaving otherwise, they are exhibiting a rationality failure akin to preference reversal. Consequently, while behavioral economics categorizes this under broad **framing effects**, the specific normative error is a failure of **diachronic consistency** in the application of risk weights, often fueled by motivated reasoning to align high-stakes abstract goals with intuitive resistance to everyday sacrifice.
