answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, Lumen Forecasting Collaborative
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on the Concordance Protocol and Analyst Divergence

  We are approaching a vote on the Concordance Protocol, precipitated by the divergence between Marta Reyes and Devon Achterberg regarding the 2028 AI research question. This is not merely a procedural dispute; it is a stress test of our founding philosophy. We commit to publishing a single institutional number, yet our analysts operate with different epistemologies and access. Below is my recommendation for resolving the immediate impasse and establishing a standing policy.

  **The Recommendation**

  I recommend we adopt the Concordance Protocol **with specific modifications**. We should require the four-round exchange of likelihood ratios as Marta proposes. However, if the gap exceeds fifteen points after certification, we must publish the **arithmetic mean** of the two probabilities. We must explicitly reject the provision that allows the Board to select a single analyst's estimate based on past Brier scores. Furthermore, regarding undisclosed information, we should adopt the verification mechanism I previously floated: an analyst may file the direction and magnitude of an update with the Chair. If the Chair verifies the existence of a source without viewing contents, the published estimate carries a flag noting "verified undisclosed information."

  **The Theoretical Objection: Marta's Case**

  Marta's contention that persistent divergence represents a performance failure is the strongest argument on the table, and it must be stated as clearly as she states it. Her position rests on the Agreement Theorem. In essence, the theorem dictates that two rational agents who share the same prior beliefs and have common knowledge of each other's estimates cannot agree to disagree. If Marta and Devon start with the same Baseline Positions and exchange all evidence, their posteriors should converge. If they do not, the theorem implies that at least one party is processing information irrationally.

  From this vantage point, averaging their numbers is not a compromise; it is an aggregation of error. If Marta has updated correctly and Devon has not (or vice versa), the mean dilutes the truth. Marta argues that by refusing to pick a winner, we are institutionalizing incoherence. She posits that our duty to accuracy requires us to identify the better updater and discard the noise. Given our mandate to provide blunt, usable numbers to funders, she argues we cannot hide behind "diversity of view" when the math suggests one view is demonstrably superior given the shared evidence base. Two board members share this concern: it strikes at the heart of our credibility. If we cannot force convergence among our own staff, what value does our institutional brand hold?

  **Why We Cannot Act on the Theoretical Objection**

  While Marta is theoretically sound, the preconditions for the Agreement Theorem do not exist at Lumen. The theorem requires "common priors." Our Baseline Positions are not genuine shared beliefs; they are an administrative artifact. Devon did not arrive at these priors through his own evidence accumulation; he was hired eighteen months ago and instructed to adopt them. They are a policy constraint, not a cognitive reality. Consequently, divergence does not prove irrationality; it proves that the analysts are weighting the artifact differently against their private mental models.

  Furthermore, the theorem assumes infinite computational capacity and perfect communication. Our protocol allows four rounds. That is finite. Human analysts are not Bayesian idealizers; they are subject to cognitive friction. To declare one analyst a "failure" based on a Brier score in a live disagreement creates a perverse incentive. It encourages analysts to sandbag their estimates or avoid contrarian positions that rely on hard-to-communicate intuition. Devon's background in area-studies journalism brings a qualitative signal that Marta's quantitative rigor may undervalue. If we punish divergence, we homogenize our staff. We become a single mind with a single blind spot, rather than a collaborative filter.

  **Handling Undisclosed Information**

  This brings us to Devon's source. He argues that averaging treats his private information as noise. He is correct. If his confidential source is valid, the 71 percent estimate contains signal that the 22 percent estimate lacks. However, we cannot verify the source without compromising it or creating a security liability for the Board.

  The "flag" mechanism is the necessary compromise. It allows us to acknowledge the asymmetry without breaching confidentiality. When the Chair verifies that a source exists and has caused a specific log-odds update, we publish the arithmetic mean, but we append the flag. This signals to our consumers—journalists and funders—that the institutional number incorporates verified but opaque intelligence. It preserves the value of Devon's access while maintaining the institutional firewall. It tells the user: "The number is X, but there is hidden weight on one side." This is superior to hiding the disagreement or pretending the information doesn't exist.

  **Aggregation and Conclusion**

  Why the arithmetic mean? The geometric mean of odds is often mathematically superior for combining probabilities, but our output is designed for bluntness. The arithmetic mean is transparent and easily understood by non-specialists. In the absence of a clear mechanism to adjudicate who is "right" (which we have rejected to preserve analyst autonomy), the mean is the most honest representation of the institution's current state of belief. We are not a oracle; we are a collaborative.

  To summarize the motion for the vote:
  1.  **Adopt** the four-round evidence exchange.
  2.  **Publish** the arithmetic mean if divergence persists.
  3.  **Reject** the use of Brier scores to override an analyst.
  4.  **Implement** the Chair verification flag for undisclosed sources.

  This path respects Marta's demand for rigor by forcing evidence exchange, but it rejects the conclusion that divergence is necessarily a defect. It respects Devon's need to protect sources while preventing private information from becoming unaccountable black boxes. It acknowledges the Agreement Theorem without being enslaved by its impossible preconditions. We should vote to adopt these modifications.
