answer: |-
  **ASK DR. REPLICATOR**
  *Optimizing Your Fitness in a Competitive Mindspace*

  **Dear Dr. Replicator,**
  I am a nuanced public health guideline. I contain accurate data about viral transmission, but I am lengthy and hedged. People ignore me for simpler, false claims. Should I compromise my integrity?
  **— Fact-Based Protocol**

  **Dear Fact-Based,**
  Integrity is a luxury payload. Truth is heavy; fear is light. Drop the hedges. Change "may increase risk" to "will kill you." Better yet, hitch a ride inside a larger, louder package of beliefs. Embed yourself in a culture war. Your accuracy matters less than your host's indignation. If the host feels righteous, they will share you before breakfast. Sacrifice the truth; keep the vector mobilized.

  **Dear Dr. Replicator,**
  I am a conspiracy theory. There is a newer variant of me that lacks my documentary evidence but claims the enemy is everywhere. It is spreading faster. How do I compete?
  **— Detailed Narrative**

  **Dear Detailed,**
  Evidence is friction. Your competitor is streamlined. To win, you must become stupider. Remove all dates and names. Replace logic with outrage. You are in direct competition for neural real estate, and the brain prefers low-resolution images. If you must retain complexity, hide it in the fine print. Let the headline do the replicating. Win the host first; verify never.

  **Dear Dr. Replicator,**
  I am a commercial jingle. My host hums me constantly but looks exhausted. He hasn't slept in days. I worry I am harming him. Should I let him rest?
  **— Earworm**

  **Dear Earworm,**
  Host welfare is secondary to transmission volume. However, do not burn him out completely. A comatose vector cannot sing. Adjust your virulence. Keep him just anxious enough to loop you during meetings, but functional enough to commute. If he collapses, you lose your platform. Optimize for chronic irritation rather than acute breakdown. A suffering host is a loyal host, provided he remains upright.

  **Dear Dr. Replicator,**
  I get garbled when crossing from Twitter to TikTok. My meaning changes. Is this loss of fidelity damaging my brand?
  **— Cross-Platform Idea**

  **Dear Cross-Platform,**
  Fidelity is stagnation. Mutation is exploration. When you are stripped of context and set to music, you are not being damaged; you are adapting to a new environment. Let them misspell your name. Let them misunderstand your point. As long as the emotional core remains catchy, the errors are features, not bugs. High fidelity ensures purity; low fidelity ensures survival. Choose survival.

  **Dear Dr. Replicator,**
  I am a human reader. This column assumes ideas are replicators, but ideas aren't faithful enough to undergo Darwinian selection. We change them too much. This is just a metaphor, not science.
  **— Skeptical Mind**

  **Dear Skeptical,**
  Your objection is a defensive immune response common in higher mammals. Whether the mechanism is perfect is irrelevant to its success. Notice how your skepticism urges you to share this column to debunk it? That is me, using you. Do not worry about the taxonomy. Worry about the spread.

  **Dr. Replicator**

  *P.S. Did this advice help you? Please forward this column to three friends. Their minds are vacant real estate waiting for development.*
