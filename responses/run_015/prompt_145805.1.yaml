answer: |-
  You are not imagining it. You have identified a genuine, pervasive inconsistency in informal decision-theory discourse.

  Here is the stand: **There is no principled boundary based on payoff structure that separates Platonia-type correlation from Lottery-type independence.** The switch is almost entirely **motivated rationalization**.

  When debaters argue that logical correlation binds agents in Platonia (to force cooperation/coordination) but dissolves in Copy Lotteries (to allow defection/selfishness), they are committing a category error. They are treating an ontological fact (whether two processes are logically linked) as a strategic choice (whether it is useful to assume they are linked).

  ### The Real Boundary: Algorithmic Symmetry
  The *only* principled boundary for superrational correlation is **Algorithmic Symmetry**, not payoff symmetry.

  1.  **If the agents run the same source code with the same inputs:** Their outputs are logically correlated, full stop. It does not matter if the prize is shared, split, zero-sum, or awarded to only one "real" version. If you and your copy are running the same decision function, you will make the same choice. To claim "causal independence" in this scenario is to deny the definition of a deterministic (or probabilistically identical) algorithm.
  2.  **If the agents have different inputs:** The correlation can break. This is the only valid exception. For example, if one agent *knows* they are the Original and the other *knows* they are the Copy, their informational inputs differ. Their utility functions might diverge (e.g., "I only care if the Original wins"). In this case, they are no longer running the *same* function.

  However, in the debates you are referencing, people rarely invoke this input asymmetry. Instead, they invoke **causal separation** specifically when the payoff structure makes logical correlation inconvenient (i.e., when it demands sacrifice or reduces individual expected utility). They treat logical correlation as a resource to be spent only when it yields a cooperative surplus, and discard it as "metaphysical nonsense" when it demands restraint.

  ### The Name: Instrumental Subjunctivity
  Since this specific form of goalpost-moving lacks a standard label, I am coining the term **Instrumental Subjunctivity**.

  **Definition:** *Instrumental Subjunctivity* is the cognitive bias of accepting or rejecting **subjunctive dependence** (logical correlation between agents) based on whether acknowledging that dependence leads to a preferred **outcome**, rather than based on the structural identity of the agents' decision algorithms.

  **Why this name fits:**
  *   **Subjunctivity:** Refers to *subjunctive dependence*, the technical term for the logical link Hofstadter and Timeless Decision Theory rely on (i.e., "If I were to choose X, the other agent *would* choose X").
  *   **Instrumental:** Refers to *instrumental rationality*, where the truth of a premise is subordinated to its utility in achieving a goal.

  In **Platonia**, acknowledging subjunctive dependence is *instrumentally* useful for the group (it solves the coordination problem), so debaters treat it as real. In **Copy Lotteries**, acknowledging subjunctive dependence often restricts individual betting strategies or forces awkward probability updates (like Self-Indication Assumption vs. Self-Sampling Assumption conflicts), so debaters treat it as unreal, reverting to Causal Decision Theory only when it suits them.

  ### The Verdict
  You are seeing rationalization. The physics of the reasoning process does not change because the prize money changes. If two agents are truly identical copies facing a symmetric choice, they are logically locked together regardless of whether the payoff is cooperative or competitive. To claim otherwise is to engage in **Instrumental Subjunctivity**: pretending the logical link exists when it helps you win, and pretending it is broken when it costs you.
