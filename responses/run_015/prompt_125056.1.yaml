answer: |-
  Your lead is being logically incoherent because his luck-based argument destroys the justification for blame just as thoroughly as it destroys bonuses, and you should counter him by reframing compensation as a tool for future incentives rather than a reward for past virtue.

  Your lead is attempting to apply a philosophical position called luck egalitarianism, which argues that no one deserves compensation for advantages they didn't choose (genetics, upbringing, circumstance). The standard hole in this argument, which your lead has fallen into, is that it proves too much: if no one is responsible for their successes because of luck, no one is responsible for their failures either. You cannot consistently hold that the engineer who saved the release was merely a vessel for genetic luck while simultaneously holding that the engineer who broke production was morally culpable enough to be written up. If the premise is true, the write-up is equally unjust because the error was also the product of genetics, upbringing, and circumstance. You are correct to feel this asymmetry is wrong; it is philosophically indefensible to accept determinism when cutting costs but reject it when assigning punishment.

  However, you are wrong to think this means "nothing is ever anyone's fault" or that merit is entirely an illusion. The concept of "deserving" survives if you stop treating it as a metaphysical judgment and start treating it as a functional mechanism. Bonuses are not moral medals; they are price signals. They exist to purchase retention and encourage specific behaviors in the future, not to settle karmic debts from the past. Even if talent is luck, the decision to apply that talent tirelessly is an action the company needs to buy. If you remove differential rewards, you remove the signal that tells high performers their specific output is valued, which directly increases the risk of them leaving. Your lead is confusing *moral desert* (which luck undermines) with *contractual incentive* (which luck does not).

  At the retro, do not argue metaphysics. Argue system design and risk. Say this: "I've been thinking about the bonus structure. If we adopt the principle that output is mostly luck and shouldn't be differentially rewarded, we have to apply that same principle to incidents and write-ups, because errors are also influenced by circumstance and luck. We can't have a system where luck explains away the bonuses but free will explains the blame. If we need to keep write-ups to maintain accountability, we need to keep differential bonuses to maintain incentive. Otherwise, we are signaling that effort doesn't change outcomes, which will drive our highest performers to leave." This forces him to choose: either he abolishes blame (which he won't do) or he admits bonuses are about future utility, not past justice.
