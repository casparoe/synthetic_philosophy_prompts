          *   Conflict-of-interest/Clean Hands -> Hypocrisy (committing the same wrong).
          *   Verdict -> Acceptance of blame, guilt, sanction.

  3.  **Identify Disanalogies (Where it breaks):**
      *   *Institutional Gatekeeper:* Courts have clerks/judges to dismiss cases lacking standing. Morality has no central authority. Anyone *can* blame, but should they?
      *   *Hypocrisy:* In law, unclean hands bars equitable relief. In morality, does hypocrisy make blame *invalid* or just *less effective/persuasive*? Is it a procedural bar or an epistemic deficit?
      *   *Authority/Enforcement:* Courts enforce verdicts with state power. Moral blame relies on recognition, guilt, social pressure.
      *   *Binary vs. Gradual:* Legal standing is often binary (you have it or you don't). Moral standing might be scalar (more or less authority).

  4.  **Address the "Defeasible Social Token" Framing:**
      *   This suggests standing isn't a license (permission) but a token (currency/social credit) that can be spent or lose value.
      *   If it's a token, hypocrisy devalues it rather than revoking it entirely. It makes the blame less weighty, not illegitimate.

