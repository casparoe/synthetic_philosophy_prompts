      The analogy between moral standing and legal standing is indeed seductive because it offers a crisp procedural mechanism for what is otherwise a messy interpersonal negotiation, but your intuition that it is doing too much work is well-founded once we scrutinize the mapping. If we lay out the correspondence as your circle suggests, the blamer occupies the role of the plaintiff initiating a case, while the wrongdoer is the defendant, and the adjudicating body is not a single person but rather the court of public opinion or the shared normative community that validates whether the blame is appropriate. The rules of procedure correspond to the norms of moral communication, such as timing and sincerity, while the conflict-of-interest check maps directly onto the equitable doctrine of clean hands, implying that if the blamer is guilty of the same transgression, they are procedurally barred from proceeding. Finally, the verdict represents the target's acceptance of guilt or the community's imposition of sanctions, yet this is where the architecture begins to show stress fractures because the legal system relies on an institutional gatekeeper to dismiss cases lacking standing before they are ever heard, whereas moral life has no clerk of court to stop a hypocrite from speaking.

      In the legal realm, standing is a jurisdictional threshold that prevents the court from even hearing the claim, but in interpersonal morality, there is no central authority to silence the blamer, meaning the hypocrite can still utter the blame even if it lacks weight. This suggests that hypocrisy functions less like a procedural bar that invalidates the charge and more like an epistemic deficit that undermines the credibility of the speaker, because a hypocrite might still be correct about the wrongness of the act even if their own hands are dirty. Furthermore, the legal picture quietly imports a notion of state-backed enforcement and binary authority that interpersonal blame simply does not possess, since a court verdict is binding and enforceable regardless of the defendant's respect for the plaintiff, whereas moral blame relies entirely on recognition and uptake from the blamee to succeed. If the blamee rejects the blame from a hypocrite, the blame does not become legally void but rather socially ineffective, which points to a fundamental category error in treating moral authority as a formal license rather than a relational dynamic.

      This is where the niche framing of standing as a defeasible social token rather than a binary license becomes crucial, because it shifts the evaluation from a question of validity to a question of value. If standing is a token, it is something that can be spent, devalued, or lost over time, meaning hypocrisy acts as inflation that reduces the purchasing power of your blame rather than counterfeiting the currency entirely. Under this token model, a hypocrite does not automatically lose the license to blame full stop but instead finds that their blame costs more to issue and yields less in terms of moral repair, allowing for nuances like repentance or context to restore value. Consequently, the conclusion that hypocrisy always kills standing does not survive once the disanalogies are on the table, and it becomes clear that the legal framing was carrying the whole argument all along by imposing a rigid procedural structure onto a fluid social practice. The legal analogy provides a useful heuristic for understanding why hypocrisy feels objectionable, but it fails to justify the strong claim that hypocritical blame is illegitimate rather than just less persuasive, so your skepticism is warranted because the automatic disqualification relies entirely on the institutional constraints of law that do not exist in morality.

