  **Tier 1: Approaches Comfortable for a General Theory**

  **Gupta–Belnap Revision Theory**
  I place this in Tier 1 because it maintains both a single truth predicate and full classical logic by treating truth as a circular concept rather than a static property. The specific principle it sacrifices is the **stable assignment of truth values** for paradoxical sentences, accepting that the Liar oscillates rather than breaking the system.

  **Supervaluationism**
  This approach earns Tier 1 status because it preserves classical logical validities and a single predicate by evaluating truth across all permissible "sharpenings" of the language. The cost is the sacrifice of **truth-functionality and bivalence**, as a disjunction can be true even if neither disjunct has a determinate truth value.

  **Tier 2: Workable Approaches with Defensible Costs**

  **Kripke's Minimal Fixed-Point Account**
  I relegate this to Tier 2 because, while it successfully retains a single unstratified predicate, it requires a non-classical semantics to handle the Liar. The specific principle sacrificed is **bivalence (and the Law of Excluded Middle)**, forcing us to accept that some sentences are neither true nor false.

  **Dialetheist Paraconsistent Approach**
  This lands in Tier 2 because it preserves the single predicate and the T-schema fully but demands a radical adjustment to our logical consequence relation. The specific principle sacrificed is the **Principle of Explosion**, requiring us to tolerate true contradictions without logical collapse.

  **Tier 3: Approaches to Avoid for a General Theory**

  **Tarski's Stratified Hierarchy**
  I place this in Tier 3 because it saves classical logic only by fragmenting the language into an infinite hierarchy of metalanguages, which is linguistically implausible for natural language. The specific principle sacrificed is the **single, unstratified truth predicate**, rendering the theory incapable of modeling our actual use of "true."

  **Deflationism**
  This belongs in Tier 3 for the purpose of building a general theory because it dissolves the paradox by denying the coherence of the project rather than solving the logical tension within a system. The specific principle sacrificed is the **substantive nature of truth theory**, leaving no apparatus to explain the normative role of truth beyond disquotation.

  **Comparative Judgment on Preservation Costs**

  Preserving **(ii) full classical logic** is the more expensive constraint, as it forces you to give up more of the rest of the apparatus. To maintain classical logic alongside a truth predicate, you must either accept Tarski's linguistically artificial hierarchy (sacrificing the single predicate) or adopt the highly technical revision semantics of Gupta–Belnap (sacrificing stable truth). By contrast, preserving **(i) a single truth predicate** is comparatively cheaper; it allows for more linguistically natural models like Kripke's or Dialetheism, where the cost is merely a localized modification to logic (bivalence or explosion) rather than a fracture in the language itself or the abandonment of theoretical substance.
