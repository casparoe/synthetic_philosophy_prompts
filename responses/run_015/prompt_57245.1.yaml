answer: |-
  ### Pedagogical Preamble: The Personal Disclosure

  You suspect opening with your own case is a mistake. Your suspicion is correct, but not for the reason you might think. It is not merely a matter of professional boundary-setting; it is a philosophical category error that will sabotage the tutorial's logic.

  Your case is: "I *know* P (dead end), but I *act* as if ~P (writing/applying)."
  Moore's Paradox is: "P, but I *do not believe* P."

  By leading with your situation, you invite students to diagnose **akrasia** (weakness of will) or **self-deception**, not Moorean absurdity. You conflate *practical irrationality* (acting against knowledge) with *doxastic/assertoric irrationality* (asserting/believing a contradiction-like state). If you open with this, you validate the misconception that Moore's Paradox is about lying or psychological weakness. You will spend the rest of the hour untangling the knot you tied in the first five minutes.

  **Recommendation:** Do not open with it. If you must use it, deploy it at minute 35, during the "Misconceptions" section, specifically to illustrate the difference between *acting* on a belief and *avowing* a belief. Frame it as: "Notice how my case feels different from the paradox we just analysed. Why?" This turns your vulnerability into a diagnostic tool rather than the primary example.

  ---

  ### The 50-Minute Plan

  #### 1. Order of Components (Minutes 0–15)

  **Sequence:**
  1.  **Satisfiability (The Conjunction):** Establish that $P \land \neg B(P)$ is logically possible.
  2.  **Asymmetry (1st vs. 3rd Person):** Establish that the absurdity is indexical.
  3.  **Absurdity (Assertion vs. Belief):** Locate the source of the paradox.
  4.  **Tense (Present vs. Past):** Show the temporal dependency.

  **Load-Bearing vs. Movable:**
  *   **Load-Bearing:** Satisfiability, Asymmetry, Assertion/Belief distinction. You cannot teach Moore's Paradox without these. If students think it is a contradiction, there is no paradox. If they think the 3rd person version is equally absurd, they haven't grasped the indexical nature. If they cannot distinguish why it is odd to *say* versus odd to *believe*, they cannot evaluate the solutions.
  *   **Movable/Droppable:** The Tense Shift. This is illustrative, not foundational. If time runs short (likely, with 14 students), cut the discussion of "It *was* raining, but I didn't believe it." It confirms the rule but does not establish it.

  **Why this order?**
  You must secure the **logical coherence** (1) before discussing the **pragmatic failure** (3). If students think the sentence is a contradiction ($P \land \neg P$), they will dismiss the puzzle as trivial. You must clear that ground first. You must establish the **Asymmetry** (2) immediately after, because that isolates the phenomenon as essentially first-personal. Only then can you debate whether the fault lies in the *mouth* (Assertion) or the *mind* (Belief).

  #### 2. The Carrying Example (Minutes 5–10)

  **The Problem with Rain:** It invites empirical verification ("Look out the window"). It makes the first conjunct too easy to verify, turning the second conjunct into stubbornness rather than a doxastic puzzle.

  **The Design Criteria:**
  *   **Must Have:** Public, objective evidence for $P$ that grants the speaker *standing* to assert $P$. (Otherwise, it's just ignorance).
  *   **Must Lack:** Immediate behavioural consequences that invite accusations of hypocrisy or weakness of will. (Otherwise, it becomes akrasia).

  **The Recommended Example:** A Marked Script.
  *   *Sentence:* "This essay is a First, but I don't believe it."
  *   *Why:* The evidence is on the page (the marker's comments/grade), giving standing to assert "This is a First." The lack of belief is internal (imposter syndrome), not a refusal to look at the paper. It avoids the "just look outside" triviality and the "why are you writing?" akrasia trap.

  **Resolution of Tension:** You cannot fully resolve the tension between "standing to assert" and "weakness of will" at this level. Any real-world example risks psychological interpretation. Your job is to stipulate: "Assume the speaker is sincere and has the evidence. We are analysing the structure, not the psychology."

  #### 3. Misconceptions (Minutes 30–40)

  **A. "It's a Contradiction"**
  *   **When:** Head off immediately (Minute 10).
  *   **Strategy:** Ask for truth conditions. "Can the world be such that P is true and I lack the belief?" Yes. "Then it's not a contradiction."

  **B. "The Speaker is Lying/Self-Deceived"**
  *   **When:** Let them walk into this (Minute 30).
  *   **Strategy:** This is the natural reaction. Allow it. Then pivot: "If they are lying, there is no paradox, just falsehood. Moore's Paradox survives even if the speaker is perfectly sincere. Why?" This forces the move from ethics to logic/philosophy of mind.

  **C. "Belief is a Feeling"**
  *   **When:** During the Assertion vs. Belief discussion (Minute 35).
  *   **Strategy:** If a student says, "I just don't *feel* like I believe it," correct the category. Belief is a dispositional state, not a qualia. "If belief were a feeling, 'I believe it is raining' would be a report of an inner sensation, which it is not."

  **D. The Insistent Student ("I said it and it was fine")**
  *   **Strategy:** Challenge the context. Moorean absurdity is often context-sensitive. Ask: "Did you assert it as a description of the world, or as a confession?" If they treat it as a confession ("I'm in a state of confusion"), the absurdity dissolves. This actually proves the rule: the paradox arises when asserting *facts*, not when reporting *states of mind*.

  **E. The Free Will/Module Case**
  *   **Handling:** This is a scope error (see Sorting Step below). Do not let it derail the main thread. Park it for the sorting exercise.

  #### 4. The Sorting Step (Minutes 20–30)

  **Placement:** Middle of the session. Do not leave it for the end. You need the students to agree on *what counts as an instance* before you try to explain *why* it is paradoxical. If you do this at the end, they will sort based on the explanation you just gave (circular). Do it before the deep dive to test their grasp of the form.

  **The Principle:** A Moorean sentence must be:
  1.  First-person present tense.
  2.  Indicative mood (asserting a fact).
  3.  Conjunction of $P$ and $\neg B(P)$ (order irrelevant).
  4.  Sincere assertion (not a joke/confession).

  **The Sort (Board Activity):**
  Draw two columns: **Moorean** | **Not Moorean**. Ask students to place the numbers.

  1.  *It isn't raining, but I believe it is.* -> **Not.** (False belief, not Moorean structure).
  2.  *The bridge is safe, but she doesn't believe it is.* -> **Not.** (3rd person).
  3.  *It was raining, but I didn't believe it was.* -> **Not.** (Past tense).
  4.  *The bridge is safe, but I don't believe it is.* -> **Yes.** (Classic).
  5.  *I don't believe the bridge is safe, but it is.* -> **Yes.** (Order swap is irrelevant).
  6.  *I know the funding isn't coming, but I don't believe it.* -> **Debatable/No.** (Claims Knowledge, which entails Belief. This is a contradiction in terms, not Moorean). *Use this to discuss your own case.*
  7.  *I don't believe in free will, but I believe I chose to take this module.* -> **Not.** (Different senses of 'believe'/scope error).

  **Pedagogical Payoff:** Sentence 6 is the trap. It looks like your personal case. If "Know" entails "Believe," this sentence is a contradiction, not a paradox. This clarifies why your personal case (claiming *knowledge* of the dead end) is philosophically distinct from the Moorean form (claiming *truth* of the dead end).

  #### 5. The Final Question (Minutes 45–50)

  **The Question:** "If I write 'It is raining, but I don't believe it' in a private diary that no one will ever read, is the sentence absurd?"

  **Why this works:** It forces a choice between the **Assertion View** (absurdity lies in violating a norm of communication) and the **Belief View** (absurdity lies in the mental state itself).

  **Good Answer:** "It depends. If the paradox is about asserting, the diary is fine (no assertion). If the paradox is about believing, the diary is still absurd (I cannot coherently hold this belief)."
  **Bad Answer:** "No, because no one hears it." (Fails to consider the Belief View).
  **Bad Answer:** "Yes, because it's a contradiction." (Failed the first 10 minutes).

  #### 6. Omissions and Contested Ground

  **What to Leave Out:**
  1.  **Wittgenstein Exegesis:** Do not discuss *why* Wittgenstein cared. It requires too much background on language games and avowals.
  2.  **Competing Diagnoses:** Do not detail the Intentionalist vs. Normative vs. Constitutive accounts. Pick one (usually the Normative/Assertion view is most accessible for 2nd years) as a working model, but flag it as a model.
  3.  **Doxastic Logic:** Do not formalise $B(P) \to \neg B(\neg P)$. Keep it natural language.

  **Argument for Omission:** You have 50 minutes. The goal is to recognise the *phenomenon*, not solve it. Solving it requires a full module on norms of assertion or philosophy of self-knowledge. Introducing competing solutions now will blur the distinction between the *data* (the paradox) and the *theory* (the explanation).

  **Settled vs. Contested (Crucial for your framing):**

  *   **Settled:** The sentence is not a logical contradiction. The 3rd person version is not paradoxical. The past tense version is not paradoxical.
  *   **Contested (You must flag these):**
      1.  **Assertion vs. Belief:** You framed these as "pulling apart." This is the central live dispute. Some philosophers (e.g., Sorensen) argue the belief itself is irrational. Others (e.g., Williams) argue it is impossible to *have* the belief. Others argue it is only wrong to *say* it. **Tell your students:** "We do not know yet if the fault is in the thinking or the speaking. That is the debate."
      2.  **Akrasia vs. Confusion:** You assume the akrasia objection is a confusion. **This is contested.** Some argue Moorean phenomena *are* a species of practical irrationality. **Stance to take:** For the purpose of *this* tutorial, treat it as a confusion. Why? Because akrasia involves *action* against *judgment*. Moore's involves *judgment* against *judgment* (or assertion against belief). Conflating them obscures the logical form. However, acknowledge that in deep water, the boundaries blur.
      3.  **Knowledge Claims:** Sentence 6 in the sorting ("I know... but I don't believe") touches on the factivity of knowledge. Whether "I know P, but P is false" is Moorean or contradictory is live terrain. Stick to the standard "P is true" formulation for the core lesson.

  **Final Instruction:**
  When you hand this plan to the students (or use it to structure the talk), be explicit about the contested nature of the *explanation*. Say: "We agree on what the paradox *is*. We do not agree on *why* it happens. Today is about securing the 'what'." This protects you from presenting a contested diagnosis as consensus.
