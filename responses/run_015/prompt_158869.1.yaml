answer: |-
  Where I've actually committed myself
  Your core commitment is concrete plurality: worlds are spatiotemporally isolated concrete entities, actuality is indexical, and de re modality uses counterparts. This engine reduces modality to quantification. Your riders are optional restrictions: recombination runs only over actual fundamentals (no aliens), modal truth is perfectly determinate (no vagueness), and existence is necessary (no empty world). Your extension into causal modeling is heuristic. Dropping riders saves the view from specific counterexamples; dropping the core collapses it into ersatzism. The core buys you reduction of modality; the riders buy you specific modal truths.

  Ranked defeaters
  1. **Explanatory Idleness (Fatal):** You value cheapness per modal fact, but if ersatz worlds (maximal consistent sets of propositions) deliver identical truth conditions for modals, counterfactuals, and chance without positing concrete duplicates, your ontology is idle. This targets the view's raison d'être. If the ersatzer pays no ontological cost and gets the same semantics, your concrete plurality is gratuitous decoration.
  2. **Alien Properties (Fatal to Rider 1):** If coherent physical theories posit fundamental properties not instantiated here, your recombination principle fails. You cannot represent these possibilities. If you admit them, you must explain how non-actual fundamentals fix world existence, undermining the actualist base of your recombination.
  3. **Modal Vagueness (Fatal to Rider 2):** If de re identity is inherently vague, forcing sharp truth values misdescribes reality. You locate vagueness in concepts, but if the world itself lacks facts about borderline survival, your determinacy is false.
  4. **The Empty World (Fatal to Rider 3):** If "nothing exists" is metaphysically possible, your necessary existence claim is false. This contradicts standard modal intuition.
  5. **Plenitude Size (Technical/Fatal):** If the collection of all worlds exceeds set-theoretic bounds, quantification over "all worlds" is ill-defined. You need a set-sized domain for your semantics to function standardly.
  6. **Causal Model Idleness (Awkward):** If interventionist semantics works without worlds, your extension is decorative. It doesn't break the view, but it removes a claimed benefit.
  7. **Isolation Status (Awkward):** If isolation is definitional, you are insulated from empirical refutation but risk emptiness. If empirical, cosmology could refute you.

  What defenders concede vs. what they dismiss
  Defenders concede the ontology is extravagant and isolation is unobservable. They concede counterpart theory yields counterintuitive results: you don't survive in other worlds, a counterpart does. They dismiss the demand for epistemic access, arguing we quantify over sets, we don't visit. They dismiss the "incredulous stare" as bias toward the familiar. They concede quantitative parsimony is lost but claim qualitative parsimony is gained by eliminating primitive modality. They accept that "concrete" is a theoretical posit, not an empirical discovery. They argue the cost is worth paying to reduce modality to extensional quantification.

  What hard plenitude predicts that its rivals don't
  Your view predicts there are no alien natural properties, that there is no possible world containing nothing, and that every modal claim has a sharp truth value. Rivals often allow aliens, permit nothingness, and accept modal vagueness. These predictions are vulnerabilities because they contradict common modal intuitions and scientific openness to new fundamentals. Your view also predicts counterfactuals are made true by concrete similarities, not primitive nomic connections. This makes your view empirically sensitive to physics but vulnerable to changes in fundamental ontology.

  Has this been qualified into unfalsifiability
  Defining isolation makes the view unfalsifiable by empirical means, but this is standard for metaphysics. The real risk is theoretical emptiness: if "concrete" adds nothing to the formal structure of ersatzism, the label is decorative. You avoid unfalsifiability by tying world existence to recombination of actual fundamentals; if actual fundamentals change, the plenitude changes. However, if isolation is purely logical, you risk collapsing into a structured ersatzism where "concrete" is merely a label on maximal consistent sets. Your worry about dodging cosmology is valid: if other universes are just disconnected parts of our world, you are stipulating terminology to save the view.

  Bottom line
  The view is highly exposed on the riders; they conflict with standard modal intuitions and scientific practice. The core is vulnerable only if ersatzism can match its explanatory power without the ontology. Your best defense is showing ersatzism secretly relies on primitive modality. If it does, your concrete plenitude earns its keep. If not, drop the concrete claim and keep the logic. The idle ontology argument is your greatest threat.
