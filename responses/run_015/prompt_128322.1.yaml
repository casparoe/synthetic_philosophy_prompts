answer: |-
  You have hit on a tension that sits right at the intersection of set theory, measure theory, and the philosophy of probability. Your intuition is sharp: Solovay's model *does* resolve the measure-theoretic pathologies that AC introduces. However, the conclusion that AC undermines rational epistemics relies on a specific assumption about how probability theory is formalized.

  Here is the breakdown of why mathematicians stick with AC, why Bayesianism doesn't actually require Solovay's model, and where the conflation lies.

  ### 1. The Kolmogorov Firewall
  Your core worry is that AC allows for non-measurable sets (like Vitali sets), which seems to break the ability to assign coherent probabilities to all subsets of a continuous space.

  However, standard probability theory (Kolmogorov's axioms) **never requires probabilities to be defined on the power set** $\mathcal{P}(\Omega)$. It requires them to be defined on a $\sigma$-algebra $\mathcal{F} \subseteq \mathcal{P}(\Omega)$.

  *   **With AC:** We acknowledge that $\mathcal{P}(\mathbb{R})$ contains monsters (Vitali sets). We simply restrict our $\sigma$-algebra to the Borel or Lebesgue measurable sets. The monsters exist in the ontology, but they are outside the domain of the probability measure. They are "invisible" to the epistemic agent.
  *   **Without AC (Solovay):** Every subset is measurable. You *can* define a probability measure on $\mathcal{P}(\mathbb{R})$.

  **The Conflation:** You are conflating the *existence* of subsets with the *domain of definition* for the prior. Bayesian updating does not require a prior over $\mathcal{P}(\Theta)$ (the parameter space's power set); it requires a prior over a measurable space $(\Theta, \mathcal{B})$. AC does not prevent you from constructing $\mathcal{B}$. Therefore, AC does not break Bayesian coherence; it just forces you to admit that some subsets are "probabilistically meaningless."

  ### 2. The Price of Solovay's Hygiene
  Solovay's model (ZF + DC + "All sets of reals are Lebesgue measurable") is indeed "cleaner" for measure theory. But it comes with heavy trade-offs that make it impractical as a default foundation for working mathematics.

  1.  **Consistency Strength:** Solovay's model requires the existence of an **inaccessible cardinal**. In terms of "ontological commitment," assuming an inaccessible cardinal is a *stronger* assumption than assuming AC. You are trading the "pathology" of non-measurable sets for the "richness" of large cardinals.
  2.  **Loss of Standard Tools:** Without full AC (keeping only Dependent Choice, DC), many standard theorems fail or become much harder to prove:
      *   **Hahn-Banach Theorem:** Crucial for functional analysis and optimization. It fails in full generality without AC.
      *   **Tychonoff's Theorem:** The product of compact spaces is compact. Without AC, this fails for infinite products.
      *   **Vector Space Bases:** Not every vector space has a basis.
      *   **Countable Union of Countable Sets:** Without AC, a countable union of countable sets might not be countable. This wreaks havoc on basic combinatorics and analysis.

  For a working analyst or algebraist, the inconvenience of losing these tools outweighs the philosophical discomfort of Vitali sets.

  ### 3. Bayesian Priors and "Improper" Priors
  In practical Bayesian epistemics, we rarely deal with the pathological sets AC creates.
  *   **Parametric Statistics:** We usually work with Borel sets on $\mathbb{R}^n$. AC does not disturb the Borel $\sigma$-algebra.
  *   **Non-parametric/Dirichlet Processes:** Even here, we construct measures on specific function spaces. The existence of a non-measurable subset of that function space doesn't impede the construction of the measure itself.

  The only time AC truly bites is if you insist on the **Principle of Indifference** over a continuous space in a way that demands translation invariance over *all* subsets. But that principle is already known to be untenable (Borel's paradox, etc.). Dropping AC fixes the Vitali issue, but it doesn't fix the deeper issues of defining uninformative priors on continuous spaces.

  ### 4. Ontological Richness vs. Structural Convenience
  You asked if mathematicians are trading "epistemic hygiene for ontological richness."

  It is more accurate to say they are trading **measure-theoretic purity for structural convenience.**
  *   **AC is a tool:** It allows you to pick elements from infinitely many sets simultaneously. This makes proofs in algebra, topology, and analysis vastly shorter and more uniform.
  *   **Pathologies are contained:** Mathematicians view non-measurable sets like Vitali sets similarly to how they view singularities in physics. They are edge cases that indicate the boundary of a theory's applicability. We don't ban singularities; we define the domain where the equations hold.

  ### Summary
  You are right that Solovay's model feels "cleaner" for probability theory specifically. If your *only* concern were the foundations of probability, ZF + DC + "All sets are measurable" would be a superior axiom system.

  However, AC remains the default because:
  1.  **Probability doesn't need it fixed:** Kolmogorov's $\sigma$-algebra restriction already neutralizes the threat of non-measurable sets to Bayesian coherence.
  2.  **The cost is too high:** Solovay's model requires large cardinal assumptions and breaks essential tools in analysis and algebra (Hahn-Banach, Tychonoff).
  3.  **The "Paradox" is physical, not epistemic:** Banach-Tarski relies on non-measurable sets. Since physical mass is modeled by measurable sets, Banach-Tarski has no purchase on physical reality. It is a curiosity of the map, not the territory.

  **Verdict:** You aren't wrong about the aesthetic superiority of Solovay's model for measure theory, but AC doesn't undermine rational epistemics because rational epistemics (via Kolmogorov) already agrees to ignore the sets AC makes weird. Mathematicians keep AC because it makes the rest of the math work, and the "weird sets" stay safely quarantined outside the $\sigma$-algebra.
