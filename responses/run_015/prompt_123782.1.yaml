answer: |-
  ### I. Reconstruction of the Implicit Theory

  The following claims reconstruct the implicit theory of meaning and communication governing contemporary public-information design.

  **Claim 1: The Thesis of Pictorial Autonomy**
  *Content:* Pictograms are capable of conveying actionable semantic content (commands, warnings, identifications) without linguistic mediation.
  *Status:* **Presupposed by a particular part of the practice only.**
  *Analysis:* This is strictly required by the *icon-only deployment* (software toolbars, transit signage) which operates on the assumption that the image suffices. However, it is explicitly contradicted by the *labeling regimes* (hazard communication, voting instructions) which mandate text. The practice treats autonomy as a regulative ideal (the goal) rather than a guaranteed capacity.

  **Claim 2: The Thesis of Semantic Conventionality**
  *Content:* The meaning of a pictogram is not intrinsic to its resemblance to the world but is an empirical, culture-dependent achievement that must be learned and verified.
  *Status:* **Strictly presupposed.**
  *Analysis:* This is the operational backbone of the industry. If meaning were natural or transparent, *comprehension testing* and *redesign protocols* would be unnecessary. The fact that symbols are withdrawn when they miss a comprehension threshold proves the practice assumes meaning is conferred by convention, not nature.

  **Claim 3: The Thesis of Verbal Anchoring**
  *Content:* Pictorial communication is semantically unstable and requires verbal supplementation (captions, signal words, hover-text) to ensure fidelity and accountability.
  *Status:* **Strictly presupposed.**
  *Analysis:* This is mandated by safety law and interface design standards. It commits the practice to the view that pictures are semantically dependent on language for critical precision. It treats the image as the hook and the word as the anchor.

  **Claim 4: The Thesis of Logical Atomicity**
  *Content:* Pictorial content is restricted to concrete particulars (objects, agents), simple actions, and basic relations (direction, quantity via repetition). It lacks the syntax to express logical operators (conditionals, modality, scope, complex negation).
  *Status:* **Strictly presupposed.**
  *Analysis:* The *narrowness of content* is not an accident but a structural limit. The practice never attempts to depict a conditional hazard or a probabilistic risk via icon alone. This presupposes that pictures cannot bear logical structure, only ostensive reference.

  **Claim 5: The Thesis of Perceptual Efficiency**
  *Content:* Visual representation allows for faster or more robust cognitive access to specific types of information (quantity, location, identity) than propositional text.
  *Status:* **Merely compatible.**
  *Analysis:* This is the functional justification for the practice, but it is philosophically underdetermined. It could be true because pictures convey *different content* (gestalts) or simply because they trigger *different psychological mechanisms* (pattern recognition vs. decoding). The practice accommodates both a substantive theory of pictorial content and a deflationary psychological story.

  ---

  ### II. Analysis of Commitments (Questions 1, 2, 3, 5)

  **1. Substantive vs. Deflationary Content (Question 1)**
  The practice does not commit to a single ontological view of pictorial content; it hedges. It *acts* on the **Substantive Thesis** (that pictures convey unique, non-linguistic content) when deploying icon-only interfaces to save space and time. However, it *protects* itself with the **Deflationary View** (that a chart is a set of claims in compact notation) by mandating text backups. The practice presupposes that while pictures *might* be translatable without remainder (Deflationary), they are *treated* as if they offer immediate access (Substantive) for the sake of efficiency, provided the risk is managed by Claim 3 (Verbal Anchoring).

  **2. Coherence of the Practice (Question 2)**
  Is the practice incoherent? Semantically, yes. It simultaneously asserts that pictures are understood naturally (Claim 1) and that they must be tested like a foreign language (Claim 2). However, functionally, it is coherent under a **Theory of Risk Management**.
  *   *Icon-only deployment* maximizes efficiency (low friction).
  *   *Testing/Redesign* minimizes error (risk mitigation).
  *   *Mandatory Text* ensures liability coverage (fail-safe).
  The underlying theory is not "Pictures are a universal language," but rather "Pictures are high-bandwidth, low-fidelity channels that must be error-corrected by language."

  **3. Syntax and Semantic Dependence (Question 3)**
  The **Thesis of Logical Atomicity** (Claim 4) demonstrates that a syntax-free notation cannot be a full language. A language requires recursion and logical operators; pictograms have neither. The diagonal stroke for negation is the limit of their logical capacity. Furthermore, the **Thesis of Verbal Anchoring** (Claim 3) confirms Neurath's austere view: pictures are semantically dependent on language. The caption does not merely add information; it fixes the reference that the image leaves indeterminate. Without the caption, the image is a set of ambiguous cues; with it, it becomes a statement.

  **5. Philosophical Underdetermination (Question 5)**
  The practice is underdetermined regarding the *mechanism* of understanding.
  *   *Strict Requirement:* The design must be recognizable and distinguishable (Claim 2).
  *   *Accommodated Theory A (Semantics):* Users understand the *meaning* of the icon (it signifies "Exit").
  *   *Accommodated Theory B (Psychology):* Users associate the *shape* with an *action* via conditioning, without semantic processing (it triggers "Push").
  The design rules (high contrast, simple shapes, repetition) work equally well whether the user is "reading" a symbol or reacting to a stimulus. The practice requires successful behavioral response, not necessarily semantic comprehension.

  ---

  ### III. The Neurathian Tension (Question 4)

  **The Tension:**
  Neurath's epistemology is anti-foundationalist: there is no "given," no privileged observation language, and all statements are revisable (the "ship at sea"). Yet, the pedagogical aim of ISOTYPE and modern infographics is to make social facts "evident to the eye," allowing the reader to *see* a comparison rather than infer it. Does this visual immediacy reintroduce a "given"—a non-inferential contact with truth that bypasses the revisability of language?

  **Resolution:**
  The tension is apparent, not real, provided we distinguish between *stimulus* and *statement*.
  1.  **The Visual as Stimulus:** The chart delivers a sensory pattern (a longer bar, more icons). This is "given" in the phenomenological sense, but it carries no truth value on its own. It is not a fact; it is a configuration of ink.
  2.  **The Interpretation as Statement:** To see the pattern *as* "Unemployment rose by 5%" requires the learned convention (Claim 2) and the verbal caption (Claim 3).
  Neurath's view holds because the *fact* is not in the picture; the fact is in the *captioned interpretation* of the picture. The eye delivers the pattern, but the convention delivers the proposition. Therefore, the practice does not claim the picture is infallible evidence (foundationalism); it claims the picture is an efficient *prompt* for a conventionalized statement (coherentism). The "evidence-base" remains the underlying data and the verbal claim, not the visual experience itself.

  ---

  ### IV. Replacement Scenarios (Question 6)

  **Scenario A: The Deflationary Replacement**
  *Theory:* A unit chart is strictly a bundle of assertions in compact notation; it has no unique pictorial content.
  *Required Changes:*
  1.  **Abolition of Icon-Only Interfaces:** If pictures are just compressed text, they must meet the same standards of precision. Since they cannot express modality or uncertainty (Claim 4), they cannot be used alone for critical information. All toolbars and signs would require permanent text labels.
  2.  **Exactitude over Gestalt:** Designers would stop using rounded numbers and repeated units to suggest magnitude. Charts would display exact figures and error bars, acknowledging that the image is making a truth-claim that can be "wrong."
  3.  **End of "Universal" Pretense:** Testing would cease to be about "comprehension" of a symbol and become about "decoding" a code. The marketing of symbols as "international" would be abandoned in favor of "localized encoding."

  **Scenario B: The Non-Propositional Replacement**
  *Theory:* Pictures carry irreducibly non-propositional content (affective, gestalt, or qualitative) that cannot be translated into sentences.
  *Required Changes:*
  1.  **Decoupling from Tables:** Designers would stop pretending a chart is interchangeable with a data table. If the content is non-propositional, the chart cannot be used to extract specific values (e.g., "What was the rate in 1994?").
  2.  **Acceptance of Ambiguity:** The drive for "comprehension thresholds" would be abandoned. If the content is non-propositional, it cannot be "misunderstood" in a truth-conditional sense, only "felt" differently. Testing would measure affective response, not semantic accuracy.
  3.  **Removal of Captions as Definitions:** Captions would no longer be treated as anchoring the *meaning* (which would be impossible if the content is non-translatable). Instead, captions would be treated as adjacent commentary. The image would be allowed to remain ambiguous, serving as mood or orientation rather than instruction.

  **Conclusion:**
  Current practice occupies a unstable middle ground: it demands the precision of the Deflationary view (via testing and text) while exploiting the efficiency of the Non-Propositional view (via icon-only deployment). A consistent theory would force a choice between safety (Deflationary) and expression (Non-Propositional), whereas the current implicit theory attempts to harvest the benefits of both.
