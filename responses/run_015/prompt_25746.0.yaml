      *   *Syādvāda* isn't "maybe" in the sense of uncertainty/probability. It's "in some specific predication relation." It's about *predication logic*, not skepticism.
      *   *Nayavāda* classifies *ways of speaking*, not just random opinions.
      *   Key distinction: *Pramāṇa* (valid knowledge) vs. *Naya* (partial standpoint).
      *   The Jains claim omniscience (*kevala jnana*) is possible for liberated souls. This is crucial. *Anekāntavāda* applies to *conditioned* knowledge (*mati*, *shruta*, etc.), not necessarily to the omniscient perspective (though even that is hard to articulate in language).
      *   The "Self-Refutation" counter-argument in Jain texts (e.g., *Tattvartha Sutra*, commentaries by Akalanka, Vidyanandi).
