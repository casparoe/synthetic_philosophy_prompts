answer: |-
  Here is a conceptual breakdown of the problem you are facing, structured for your chapter. I have focused on the tension between functionalism and physical volume, utilising a thought experiment involving substrate independence to highlight the scaling invariance issue.

  ***

  ### The Problem of Substrate-Independent Scaling

  The core conceptual snag you have encountered arises from a category error between **physical extension** (volume) and **functional capacity** (computational or phenomenological space). When we propose brain size as a proxy for moral status, we are implicitly assuming a biological chauvinism: that the specific physical density of organic matter is what grounds moral weight. However, if one accepts a functionalist account of mind—where moral status supervenes on capacities like sentience, agency, or rationality rather than the meat that instantiates them—the metric of 'volume' collapses due to a failure of scaling invariance.

  To illustrate this, let us construct a specific case: **The Variable-Volume Mind.**

  #### 1. The Thought Experiment
  Imagine three distinct entities, each possessing identical functional capacities. They can feel pain, formulate long-term plans, recognise themselves in a mirror, and engage in moral reasoning.

  *   **Entity A (The Biological Standard):** A typical human being. The functional capacities are instantiated in a biological cortex with a volume of approximately 1,200 cubic centimetres.
  *   **Entity B (The Distributed Network):** A mind uploaded to a silicon substrate. To achieve the same functional output as Entity A, the processing is distributed across a server farm occupying a warehouse of 5,000 cubic metres. The 'brain' here is physically vast compared to the biological standard.
  *   **Entity C (The Compressed Chip):** A future iteration of the same technology using advanced nanotechnology. The exact same functional architecture is compressed into a neural chip the size of a sugar cube (5 cubic centimetres).

  #### 2. The Scaling Invariance Principle
  In physics, a system exhibits scaling invariance if its properties remain unchanged despite changes in scale. In moral philosophy, if we claim that moral status is derived from *capacity* (what the mind can do), then moral status ought to be scale-invariant with respect to physical volume.

  If Entity A, B, and C suffer equally when harmed, and possess equal agency, our moral intuition (grounded in functionalism) suggests they possess equal moral status. The 'work' being done is identical; only the physical realisation differs. Therefore, the physical volume of the substrate should be morally redundant. It is merely the container, not the content.

  #### 3. The Conceptual Collapse
  Here is where the brain size metric fails. If you attempt to use brain volume as a proxy for moral status across these three cases, the metric yields contradictory results for what is ostensibly the same moral patient.

  *   If you argue **larger volume = higher status**, Entity B (the warehouse) becomes a moral giant, vastly outweighing the human, simply because its code is spread out over more racks. This is absurd; spreading a song over more speakers does not make the music more profound.
  *   If you argue **smaller volume = higher status** (efficiency), Entity C (the sugar cube) becomes morally superior to the human. This is equally counter-intuitive; compressing a person does not enhance their rights.
  *   If you argue **biological volume is the only valid metric**, you must deny Entity B and C moral status entirely, despite them exhibiting identical behaviour and capacities. This reveals that you are not measuring 'mind' at all, but rather 'biology'.

  The metric collapses because 'volume' is not invariant across substrates. It is a property of the *hardware*, not the *software*. By tying moral status to volume, you are conflating the physical footprint of the computation with the computation itself. In a world where minds can be non-neural, 'brain size' becomes a conceptually redundant variable, like judging the length of a novel by the weight of the paper it is printed on.

  #### 4. The Lingering Intuition (The Framing Problem)
  Despite this logical collapse, the intuition that 'bigger brains carry more weight' lingers. This is the framing problem you need to address in your chapter. Why do we still feel uneasy about Entity C (the sugar cube mind)?

  The issue is that we frame moral status through **spatial bias**. We are evolved to associate complexity with physical bulk. In the natural world, a larger nervous system generally correlates with richer phenomenology. A mouse has a smaller brain than a human and arguably fewer capacities. We mistakenly project this biological correlation onto metaphysical necessity.

  When faced with Entity C, the intuition whispers that something so small cannot possibly hold the 'depth' of a human experience. We feel that moral weight requires physical heft. This is a failure to grasp scaling invariance. We struggle to decouple the *magnitude of the experience* from the *magnitude of the object*.

  #### 5. Structural Summary for Your Chapter
  To spell this out properly for your readers, you might structure the argument as follows:

  1.  **Define the Proxy:** Establish that 'brain size' is often used as a heuristic for cognitive complexity and thus moral worth.
  2.  **Introduce Substrate Independence:** Demonstrate that functional capacities can be decoupled from biological volume (the Entity A/B/C scenario).
  3.  **Demonstrate Redundancy:** Show that because function is scale-invariant but volume is not, volume cannot be the tracker of moral status. It yields false positives (the warehouse) and false negatives (the chip).
  4.  **Diagnose the Bias:** Explain that the lingering intuition is a result of 'spatial bias'—an evolutionary heuristic that conflates physical size with functional depth, which fails when applied to non-neural substrates.
  5.  **Conclusion:** Argue that moral status must track *informational complexity* or *phenomenal capacity*, neither of which are strictly bound by cubic centimetres once we leave the realm of organic biology.

  This approach allows you to bypass empirical debates about neuron density (which can get bogged down in neuroscience) and focus purely on the philosophical inconsistency of using a physical dimension to measure a functional property.
