answer: |-
  **Setting:** *The Grad Student Lounge, 4:30 PM. Empty coffee cups, a whiteboard covered in half-erased logic symbols from the earlier seminar. Len is stirring sugar into a mug; Priya is leaning back, scrolling through notes on her phone.*

  **Len:** Look, I get the intuition. It feels virtuous to skip the flight. But if we're doing consequentialist accounting, the math just doesn't hold. It's the classic threshold problem. My single ton of CO2 doesn't cross any tipping point. It's redundant causation in a linear harm chain. If the disaster happens anyway, and it would have happened without *my* specific molecule, then I haven't caused harm. I'm just a droplet in the ocean.

  **Priya:** But that model assumes the harm chain is linear. It's not. Climate damage isn't a bucket filling up drop by drop until it overflows; it's a system of feedback loops. When you talk about redundant causation, you're looking at the *output* (temperature rise). I'm looking at the *input parameters* (market demand, subsidy structures, forecasting).

  **Len:** Okay, but who shifts the parameters? The collective. Not me. If I skip the flight, the airline doesn't cancel the route. They just fill the seat with someone else, or fly the plane with slightly less fuel burn, which negligible. You're smuggling collective-level causation past methodological individualism. You want to hold *me* responsible for a structural shift that only occurs if *thousands* of people act.

  **Priya:** I'm not smuggling anything. I'm saying the structure *is* constituted by individual choices. It's not a magic collective agent hovering above us. Take aviation demand forecasting. Airlines don't just guess; they model based on marginal booking data. If I opt out, I'm not cancelling the flight, but I am shifting the probability curve for future capacity planning. It's structural participation.

  **Len:** But that's expected utility, not actual causation. You're saying I might make a difference. But the inefficacy objection is about *actual* harm. If I buy the burger, no cow is killed *because* of me. The slaughterhouse operates on bulk orders. My purchase is absorbed.

  **Priya:** I'll concede direct causal impotence on the slaughterhouse example. One burger doesn't trigger a kill order. But you're ignoring the subsidy loop. Agricultural subsidies are political responses to consumption patterns. If individual choices shift even slightly over time, it changes the political viability of those subsidies. My choice isn't causing the cow's death; it's sustaining the subsidy structure that makes the death profitable.

  **Len:** That feels like a stretch. You're tracing causation through a political black box. "Sustaining the structure" sounds like a metaphor for "being part of the group that does the harm." If I'm methodologically individualist, I need to know what *my* action does. If my action is functionally identical to inaction regarding the outcome, then calling it "structural participation" is just guilt by association.

  **Priya:** It's not guilt by association. It's about agency within a system. Think of it like this: In a linear chain, I'm a link. If the chain holds without me, I'm redundant. In a feedback loop, I'm a sensor. If I stop sending the signal—even if the machine keeps running for now—the calibration changes. You're asking for a threshold effect in a system that operates on continuous adjustment.

  **Len:** But does the calibration change *because of me*? Or because of the aggregate? If I'm the only one skipping the flight, does the forecasting model update? Probably not. It filters out noise. So again, unless I'm coordinating with others, I'm just noise. You're attributing the power of the chorus to the soloist.

  **Priya:** I'm not attributing the power of the chorus. I'm saying the chorus *is* soloists singing in time. If you treat the structure as external to individual choice, you reify it. The structure has no causal power except through us. So when I choose, I'm not just adding volume; I'm either reinforcing or dampening the feedback mechanism. Yes, if I'm the *only* one, the effect is tiny. But it's not zero, and it's not the same kind of zero as the linear threshold case.

  **Len:** Tiny isn't enough for moral obligation if the cost to me is high. That's the other half of the inefficacy objection. Even if you're right about the loop, if my individual impact on the loop is microscopic, why is the obligation binding?

  **Priya:** Because the obligation isn't to fix the climate alone. It's to not be complicit in the loop. You admitted earlier that collective action is different.

  **Len:** I did. Collective action can cross thresholds.

  **Priya:** Right. So if we agree the harm is structural, then the moral unit isn't the isolated act, it's the act-as-participation. You're worried I'm collapsing the individual into the collective. I'm arguing the individual is the *node* where the collective becomes real. If I say "my choice doesn't matter because the structure is too big," I'm treating the structure like a force of nature. It's not. It's us.

  **Len:** I see the move. You're trying to bypass the causal impotence by changing the description of the harm from "outcome-based" to "process-based." But I still worry you're letting the collective off the hook. If my skipping the flight is "structural participation," then isn't the failure primarily mine? Whereas the real failure is the lack of regulation.

  **Priya:** Not necessarily. It's both. But if I wait for regulation while participating in the loop, I'm betting on a solution that requires me to stop participating anyway. Look, I'll give you this: if the system is truly rigid, my individual choice is causally inert regarding the immediate outcome. I concede direct causal impotence.

  **Len:** Okay, that's something.

  **Priya:** But I still think you're stuck on the linear harm chain. You want to find the specific victim my burger killed. There isn't one. But there is a specific policy my burger supports.

  **Len:** *sighs* You're making the metaphysics messy, Priya.

  **Priya:** The climate is messy. Maybe the ethics should match.

  **Len:** Maybe. Pass the sugar?

  **Priya:** *slides the bowl over* Just don't put too much in. It's a feedback loop. You tweak the input, the taste changes.

  **Len:** *laughs* Fine. But if this coffee doesn't cross my caffeine threshold, I'm blaming the structural participation model.

  **Priya:** Deal.
