      *   *Constraint:* 50 minutes is tight. Need a logical flow.
      *   *Distinction (Condition/Illness/Sickness):* This is classic (Canguilhem/Fulford). Condition = pathology, Illness = experience, Sickness = social role.
      *   *Placement:* Must come *first*. If you introduce the theories before this, students will conflate "feeling sick" with "having a disease."
      *   *Value Consensus:* Both sides agree medicine is value-laden. Disagree on *where* the value sits (in the concept vs. in the response).
      *   *Placement:* After the distinction, before the deep dive into the theories. This prevents the "Why are we talking about values? We are scientists" objection.
      *   *Risk/Threshold Cases (Prediabetes, etc.):* This is the wedge.
