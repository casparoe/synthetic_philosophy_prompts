answer: |-
  Here is a teaching plan designed for a fifty-minute small-group session with first-year medical students.

  ### 1. Sequence and Structural Dependencies

  You have fifty minutes. If you deviate from this order, the session will collapse into a debate about guidelines rather than concepts.

  **The Order:**
  1.  **The Tripartite Distinction (Minutes 0–10):** Condition (Pathology) vs. Illness (Experience) vs. Sickness (Social Role).
  2.  **The Consensus on Value (Minutes 10–15):** Establish that *both* sides agree medicine is value-laden; the dispute is about *location* (in the concept vs. in the response).
  3.  **The Two Views (Minutes 15–25):** Naturalism (Function) vs. Normativism (Evaluation).
  4.  **The One Case (Minutes 25–35):** Apply the views to the anchor case.
  5.  **The Risk/Threshold Stress Test (Minutes 35–45):** Prediabetes/Osteopenia.
  6.  **The Check and The Cut (Minutes 45–50).**

  **Why this order (and what collapses if you reorder):**
  *   **The Distinction must come first.** If you introduce the two views before distinguishing *condition* from *illness*, students will conflate "feeling unwell" with "having a disease." They will defend the function-based account by saying, "If you have cancer but feel fine, you still have a disease," without realizing the Normativist agrees. You need the vocabulary to isolate the variable.
  *   **The Consensus on Value must come before the Two Views.** Medical students are trained to view "value-laden" as synonymous with "unscientific." If you do not explicitly state that the Naturalist (function-based) *also* believes values drive treatment decisions, they will dismiss the Normativist view as "soft science" immediately. You must frame the dispute as: *Does the value judgment happen at the diagnosis (Normativism) or at the treatment plan (Naturalism)?*
  *   **The Risk/Threshold Cases must come last.** If you introduce prediabetes or osteopenia before they grasp the two views, the session becomes a debate about endocrine guidelines. Once they grasp the views, these cases become a stress test.
      *   *Placement:* Introduce these *after* the One Case. The One Case establishes the theoretical conflict; the Risk Cases show how that conflict moves the goalposts in real time.
      *   *What the Risk Observation Shows:* The fact that cut-points shift when a cheap drug arrives is **not** definitive evidence for the Evaluative side.
          *   *The Naturalist Explanation:* The underlying *dysfunction* (e.g., bone density deviation) is constant and descriptive. The *label* "disease" is a pragmatic tool we apply when intervention is cost-effective. The concept is descriptive; the *application* is evaluative.
          *   *The Evaluative Explanation:* The *harm* profile changes when a safe intervention exists. Therefore, the *disease status* itself changes.
          *   *Teaching Point:* Do not let them conclude this proves Evaluativism. Let them see that **even a strict Naturalist must admit the *boundary* of the category is value-laden.** This is the clinical stake: if the boundary moves with drug prices, diagnosis is not purely biological.

  ### 2. The One Case

  **The Case:** **Asymptomatic Bacteriuria (ABU) in an 85-year-old nursing home resident.**

  **Why this case:**
  *   **Biology is uncontested:** There are bacteria in the bladder. Both sides agree on the pathophysiology.
  *   **Separates Treatment from Disease:** Guidelines explicitly recommend *against* treatment (unless pregnant or undergoing urologic surgery). This forces the question: "If we are not treating it, is it a disease?"
  *   **Clinically Real:** They will encounter this on internal medicine rotations. It triggers the "urine culture reflex" they must learn to curb.
  *   **Avoids Identity Traps:** Unlike Sickle Cell Trait, this does not engage race, genetics, or identity politics, which will consume the hour in defensiveness.

  **Why not Sickle Cell Trait:**
  *   While philosophically classic (Boorse used it), it is pedagogically dangerous in a 50-minute session. It inevitably triggers discussions about race, historical mistreatment, and genetic discrimination. Students will focus on the ethics of screening rather than the metaphysics of disease. It eats the hour.

  **Why not the Shifting-Threshold Case (e.g., Hypertension) as the *Anchor*:**
  *   Hypertension conflates "disease" with "risk factor." Students struggle to separate "high blood pressure" from "cardiovascular disease." ABU is binary (bacteria present/absent) and harm is binary (symptoms present/absent), making the conceptual wedge cleaner. Use Hypertension/Prediabetes later as the *Stress Test* (Section 1, Step 5).

  **What the case must lack:**
  *   It must lack symptoms (Illness = 0).
  *   It must lack a clear indication for treatment (Management = 0).
  *   It must lack social stigma (Sickness = 0).
  *   *Result:* You are left with pure Pathology. Is Pathology alone sufficient for Disease?

  ### 3. Misconceptions and Timing

  You predicted four. Here is how to handle them, plus one you missed.

  1.  **"Function-based means Statistical Rarity" (The Red Hair Objection)**
      *   *When to head off:* **Minute 15** (during The Two Views).
      *   *How:* Pre-empt it. When defining Naturalism, explicitly state: "Statistical normality is not functional normality. Red hair is rare but functional. A heart that beats 200bpm is common in tachycardia but dysfunctional." If you wait for them to raise it, you lose 10 minutes on statistics.

  2.  **"Evaluative means Whatever We Say Goes" (The Subjectivity Objection)**
      *   *When to head off:* **Minute 15** (during The Two Views).
      *   *How:* Clarify that Normativism relies on *shared* judgments of harm, not individual whim. "Blindness is a disease not because I dislike it, but because it restricts human flourishing in our environment."

  3.  **"The Dispute is Verbal" (The "Same Practice" Objection)**
      *   *When to let surface:* **Minute 40** (during Risk/Threshold Stress Test).
      *   *Why:* This is the most dangerous misconception for engagement. If they think it's just words, they tune out.
      *   *Strategy:* Let them argue, "We treat the patient, not the label." Then counter with: "Insurance reimbursement depends on the label. Disability status depends on the label. Self-concept depends on the label." Force them to see that the *label* has consequences independent of the *pill*.

  4.  **"Definition Settles Management" (The Algorithm Objection)**
      *   *When to head off:* **Minute 50** (This is "The Cut").
      *   *How:* Explicitly deny this. (See Section 4).

  5.  **The Missed Misconception: "Normal = Ideal"**
      *   *When to head off:* **Minute 10** (during The Distinction).
      *   *Why:* Students conflate "species-typical function" with "optimal health."
      *   *Correction:* "Normal function includes aging. Is menopause a disease? It is a functional change. Is it a disease?" This primes the pump for the Risk/Threshold discussion later.

  ### 4. The Check and The Cut

  **The Check (Minute 45):**
  Do not ask them to define the views. Ask them to apply the *disagreement*.

  *   **Question:** *"Imagine a new genetic marker is found. It predicts a 5% increase in mortality at age 90. There is no intervention. A Naturalist and a Normativist look at a patient with this marker. Do they write the same problem list?"*
  *   **Correct Structural Answer:**
      *   **Naturalist:** Likely "Yes" (or "It's a dysfunction, so it's a disease, even if we do nothing").
      *   **Normativist:** Likely "No" (If there is no harm/experience of badness, it is not a disease).
      *   **Why this works:** It shows they understand that the disagreement is about the *criteria for the label*, not just the treatment. If they answer "They both ignore it because there's no treatment," they have failed to grasp the conceptual dispute.

  **The Cut (Minute 48):**
  You must openly decline to settle the metaphysics. If you try to tell them which theory is true, you become the philosopher-king and they become skeptics.

  *   **What to say:** *"I am not going to tell you today whether disease is 'really' descriptive or evaluative. Philosophers have fought that for 50 years. What I am asking you to take away is this: When you write a diagnosis, you are not just describing biology. You are triggering a social and economic machinery. Whether you believe the definition is biological or evaluative, the **consequences** of the label are real. Your job is not to solve the philosophy; your job is to recognize when the label is doing work beyond the biology."*
  *   **Why:** This validates their impatience with theory ("I don't need to solve metaphysics") while securing the clinical stake ("I do need to know what this label does").
