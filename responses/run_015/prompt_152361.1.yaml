      *   *Naturalism (Descriptive):* Disease is a deviation from species-typical functional design (Boorse). Values enter in *response* to disease, not in *defining* it.
      *   *Normativism (Evaluative):* Disease implies harm/badness. You can't separate the fact from the value judgment.
      *   *Hybrid:* Some mix.
      *   *The Trap:* Students think "Function = Good, Dysfunction = Bad" solves everything. They miss that "function" itself relies on value judgments about what counts as a reference class or normal environment.
