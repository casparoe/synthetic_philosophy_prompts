  Please answer as a formal epistemologist — someone who works on probability, induction and the foundations of statistics, and who has spent real time on Bertrand-style paradoxes and the principle of indifference — and please think it through properly: brainstorm a bit before you commit to an answer, and don't just name-drop papers or point me at readings, I want your own reasoning worked out. I'm in a small reading group on probability and induction and we did Bertrand's paradox a couple weeks back, and then I got into an argument about it at board game night that I've been chewing on since, and I've realised I don't actually have a principle at all — just a pile of gut verdicts on cases that I now suspect don't fit together. So here they are, me and my verdicts:

  - **Three machines, three chords.** Machine A spins two pointers independently on a circle and connects the two points it lands on: probability the chord beats a side of the inscribed equilateral triangle is 1/3, fine, no mystery. Machine B picks a random radius and then a uniformly random point along it and draws the perpendicular chord: 1/2, also fine. Machine C throws a dart at the disk and draws the chord whose midpoint is the hole: 1/4, also fine. I'm completely untroubled by all three — different experiments, different answers, end of story.
  - **No machine at all.** Someone just says "a chord is drawn at random in a circle" and asks the same question. My gut says 1/2, and not arbitrarily — I feel like 1/2 is *the* answer and the other two are somehow cheating. But I can't say why, and a friend muttered something about the answer not depending on where the circle is drawn or how big it is, which I half understood.
  - **Three random points on a circle, is the triangle acute?** 1/4, and here I'm not even tempted to call the question ill-posed, even though no process was specified — which is strange, because it looks exactly like the previous case.
  - **A coin, or a die.** No physical process specified at all, and yet I trust 1/2 and 1/6 completely. This also seems to be "randomness with no mechanism given," and it goes fine. So why does it go fine here and wobble for chords?
  - **The next big earthquake here, or "pick a random positive integer."** Here indifference doesn't seem to *underdetermine* the answer, it seems to not get going at all — there's no distribution to be had. I feel like that's a different failure from the chord case, not just a worse version of it.
  - **The punch bowl.** Wine and water mixed somewhere between 1:3 and 3:1, nothing else known, what's the chance the wine:water ratio is at most 2? I feel 5/8 quite strongly, and the 15/16 you get by restating it as water:wine feels like a trick.
  - **The punch bowl again, but with a total.** Four litres in total, the wine part somewhere between 1 and 3 litres, same question. Now I keep flip-flopping between 5/8 and something like 5/6, and I can't settle it — this is the case I keep going back to.
  - **My friend's startup.** She says the exit valuation will land somewhere between $1M and $9M, and I want the chance it's under $4M. I say 3/8, plain uniform on dollars. But I know the "spread it evenly over orders of magnitude" answer is about 0.63 and it makes me uneasy.
  - **The urn.** Unknown mix of black and white balls, ten whites in a row so far, chance the next is white? Eleven-twelfths feels way too smug, a flat 1/2 feels like I learned nothing, my honest gut is somewhere near 0.75, and I notice I care a lot whether I'm guessing about the draws or about the composition.

  My own tentative principle, which I don't trust: indifference is only legitimate when the space you're spreading probability over has enough symmetry to pin down exactly one distribution, and when rival parameterisations are on offer you should take the one that's invariant under the symmetries the problem actually has; if none is picked out uniquely, there's no answer and the question is ill-posed. My friend says that principle already convicts me of inconsistency somewhere in my list, and I think he's probably right — I have a sinking feeling that the bare chord, the punch bowl and the startup valuation are all the same case in disguise and that I can't keep all three verdicts.

