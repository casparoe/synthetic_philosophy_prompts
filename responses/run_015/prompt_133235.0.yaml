      *   *Key Theoretical Hooks:* Oakeshott's "Practical Knowledge," Hayek's "Spontaneous Order," Burke's "Prejudice."

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Case 7:* The user says Chesterton says "go away and work out what the thing is for." But Oakeshott says some things *can't* be worked out technically. I need to make sure I don't contradict Chesterton too hard, but rather interpret him through Oakeshott. Chesterton implies the reason *exists*, not necessarily that it's easily articulable.
      *   *Correction on Case 3:* If the origin is known and bad, Chesterton's Fence doesn't apply. The fence is illegitimate.
      *   *Correction on Principle:* The user's principle says "remove only if you can say what it was for." This is too high a bar. It should be "Remove if you are sure the *function* is obsolete OR if the *cost* outweighs the unknown benefit."
      *   *The "New Fence" question:* This is crucial. Conservatism is skeptical of *innovation* without precedent. So yes, the burden of proof is higher for new rules.

