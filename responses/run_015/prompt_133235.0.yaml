      *   *Key Differentiators:*
          *   1 vs 2: 1 is bureaucratic friction (negative utility), 2 is symbolic/aesthetic (positive utility for some, neutral for others?). 1 feels like *incompetence*, 2 feels like *culture*.
          *   4 vs 6: 4 is external regulation (zoning), 6 is internal culture (library). 4 imposes cost on new builds, 6 protects staff wellbeing (even if the original reason is dead, the *effect* is now wellbeing).
          *   3 (Bad Origin): Knowing the origin was *self-serving* makes it easier to scrap. Chesterton applies to *wisdom*, not *rent-seeking*.
