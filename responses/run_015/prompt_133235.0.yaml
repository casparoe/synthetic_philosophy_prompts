      *   **Chesterton's Fence isn't just about utility.** It's about *presumed wisdom*.
      *   **Distinction 1: Rent-seeking vs. Social Order.** Case 3 is rent-seeking (professors protecting hours). Conservatism isn't about protecting corruption. Case 1 is bureaucratic inertia (stupidity), not wisdom.
      *   **Distinction 2: Instrumental vs. Constitutive.**
          *   Instrumental: Means to an end (Paper submission, Parking). If the end is obsolete, scrap it.
          *   Constitutive: Part of the identity/practice itself (Gowns, Rituals, Library hours as rest). These create the "university" as a social organism.
      *   **Distinction 3: Spontaneous Order vs. Constructivist Rationalism.** Hayek would say some things evolve (gowns, rituals) and shouldn't be engineered away. Others are top-down impositions (zoning, paper submission) that can be corrected.
      *   **The "Fragility" Point (Case 7):** Oakeshott would argue that some practices rely on "traditional knowledge" which cannot be fully articulated. If you demand articulation, you destroy the practice. So, the rule isn't "find out why," it's "assume there is a reason until you are sure removing it won't break the social fabric."

  5.  **Address the Specific Conflicts:**
