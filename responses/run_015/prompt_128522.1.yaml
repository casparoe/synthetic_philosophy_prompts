answer: |-
  **Exam Question**

  **Contemporary Moral Philosophy: Take-Home Final**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. You are not permitted to consult any texts or notes.

  **Question 1**

  Consider a research station inhabited by one hundred people. They must survive one hundred cold nights. On any given night, they face a choice:
  1.  **Run the Generator:** One person stands duty. They lose sleep and endure pain (a welfare loss of 10 units). The other ninety-nine people remain warm and comfortable (a welfare gain of 1 unit each).
  2.  **Do Not Run:** Everyone endures the cold equally (a welfare change of 0 units for everyone).

  Consider two scenarios:
  *   **The One-Shot Case:** The choice is made for tonight only. Identities are fixed: Person A is on duty.
  *   **The Sequence Case:** The choice is made for all hundred nights in advance. A rota is established where each person stands duty exactly once and benefits ninety-nine times.

  Contractualism typically argues that in the One-Shot Case, the generator should not be run, because the duty person's complaint outweighs any single beneficiary's complaint, and complaints cannot be aggregated across persons. However, in the Sequence Case, the rota seems permissible, as everyone is net better off.

  Critically evaluate whether these two verdicts are consistent. In your answer, you must:
  1.  Explain the contractualist restriction on summing complaints and apply it to both scenarios.
  2.  Determine whether aggregation within a single life over time is legitimate, and justify why this differs from aggregation across lives.
  3.  Address whether the moral verdict is allowed to depend on how the decision is framed (night-by-night versus a hundred-night plan).
  4.  Discuss whether the distinction between episodes and whole lives survives if personal identity is not a "deep further fact," and what this implies for the theory.

  ***

  **Model Answer**

  Contractualism holds that an act is wrong if it violates principles that no one could reasonably reject. Central to this framework is the restriction on aggregation: the strength of one person's reason for rejecting a principle cannot simply be added to another's. Complaints are compared individually. In the One-Shot Case, the duty person suffers a loss of ten units, while each beneficiary gains one. Since ten outweighs one, the duty person's complaint is stronger than any individual beneficiary's. Because cross-person aggregation is forbidden, the ninety-nine weak complaints cannot collectively outweigh the one strong complaint. Thus, the generator must not run.

  In the Sequence Case, a rota ensures everyone bears the burden once and benefits ninety-nine times. Each person nets a gain of eighty-nine units. Here, every individual prefers the rota to inaction. To reach this verdict, contractualism must permit aggregation of benefits and burdens *within* a single life over time. This distinguishes the sequence from the one-shot case: structurally, the sequence is merely the one-shot repeated with permuted identities. The total welfare and individual nightly burdens are identical in both scenarios. The difference in verdict relies entirely on the moral significance of personal identity.

  The justification for allowing within-life aggregation but forbidding across-life aggregation rests on the unity of the subject. One person experiences the whole sequence; the burdens and benefits belong to a single consciousness. Distinct persons do not share this unity. Therefore, compensating a person over time is legitimate, whereas compensating one person by burdening another is not. If contractualism refused within-life aggregation, it would forbid the rota, leaving everyone worse off at zero despite unanimous consent. This implies an implausible rigidity where individuals cannot trade off their own interests over time.

  Regarding framing, the verdict cannot depend on whether the choice is carved up night-by-night or as a plan. Contractualism evaluates principles for general agreement, not isolated acts. A principle permitting a rota is justifiable to everyone ex ante; a principle requiring night-by-night vetoes is rejectable because it leaves everyone worse off. However, this sensitivity to description risks instability. If the moral status changes based on how occasions are individuated, the theory lacks objective grounding.

  A common error is invoking a veil of ignorance. Since identities are fixed in the sequence, uncertainty adds nothing. Even with uncertainty, contractualism compares expected complaints individually, not collectively. Adding uncertainty about who will be on duty would just reapply the same restriction to expected complaints.

  The deepest challenge concerns personal identity. If persons are not deep further facts but series of experiences, the distinction between within-life and across-life aggregation collapses. Aggregating across time for one person becomes metaphysically identical to aggregating across persons. If so, contractualism loses its non-utilitarian stopping place. To avoid utilitarianism, the contractualist must argue that practical identity, not metaphysical depth, grounds the restriction. Without this, the prohibition on aggregation appears arbitrary. The contractualist must either accept that the distinction is pragmatic rather than metaphysical or concede that without a robust view of the self, the theory converges on utilitarianism.

  ***

  **Marking Scheme**

  **Total Marks:** 25

  **Criteria Breakdown:**

  1.  **Contractualist Mechanism (5 Marks)**
      *   *Requirement:* Correctly states that complaints are assessed individually and cannot be summed across persons. Applies this to the One-Shot Case (10 > 1).
      *   *Common Error:* Treating the view as utilitarian (summing the 99 benefits to outweigh the 1 burden) or failing to explain *why* the one-shot verdict is "don't run."
      *   *Zero:* Fails to mention the restriction on aggregation.

  2.  **Structural Identity & Sequence Verdict (5 Marks)**
      *   *Requirement:* Identifies that the Sequence is structurally identical to repeated One-Shots (permuted identities). States the Sequence verdict requires within-life aggregation.
      *   *Common Error:* Treating the Sequence as fundamentally different in kind rather than repetition, or failing to note the net gain (+89).
      *   *Zero:* Ignores the Sequence case.

  3.  **Justification for Within-Life Aggregation (5 Marks)**
      *   *Requirement:* Argues that unity of consciousness/subject makes within-life aggregation legitimate unlike across-life. Notes the cost of refusing this (everyone worse off).
      *   *Common Error:* Asserting within-life aggregation is fine without explaining *why* it differs from across-life aggregation.
      *   *Zero:* Claims within-life aggregation is forbidden.

  4.  **Framing and Description Sensitivity (5 Marks)**
      *   *Requirement:* Addresses whether night-by-night vs. plan matters. Argues contractualism focuses on principles/policy. Notes the risk of instability if framing changes verdicts.
      *   *Common Error:* Claiming the verdict *should* change based on framing, or ignoring the problem entirely.
      *   *Zero:* No discussion of framing.

  5.  **A-Grade Distinction: Personal Identity (5 Marks)**
      *   *Requirement:* Questions whether the distinction survives if personal identity is not a deep further fact. Discusses the threat of converging on utilitarianism or the need for a pragmatic third option.
      *   *Common Error:* Ignoring the metaphysical challenge or asserting the distinction holds without qualification.
      *   *Zero:* No mention of personal identity metaphysics.

  **Grading Notes:**

  *   **A vs. B:** A B-grade answer will correctly apply the contractualist framework to both cases and justify within-life aggregation via subject unity. An A-grade answer will critically interrogate the metaphysical grounding of that unity (Criterion 5), recognizing that if persons are merely series of experiences, the barrier to utilitarianism dissolves.
  *   **The Trap:** Candidates who rely on "veil of ignorance" or "uncertainty" to solve the sequence case should not gain marks for Criterion 1 or 2, as the case stipulates fixed identities/rota. This is a conceptual error regarding ex ante vs. ex post complaints.
  *   **Zero Marks:** Awarded for plagiarism, irrelevant content, or answers that address neither the case nor the contractualist framework.
