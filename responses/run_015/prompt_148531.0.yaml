  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Institutional practice of constitutional rights-review in certain democracies.
      *   **Three Design Features:**
          1.  *Structured Proportionality:* Suitability, Necessity, Balancing (rights as scalar interests).
          2.  *Rights Rhetoric:* Rights as "objective values" / "inviolable limits" / counter-majoritarian side-constraints.
          3.  *Remedial Practice:* Declaration of Incompatibility (DOI) + Transitional Period (deferred nullification, legislature crafts remedy).
