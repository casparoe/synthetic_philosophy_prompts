answer: |-
  The institutional configuration you describe—combining structured proportionality, rights-as-objective-values rhetoric, and deferred declarations of incompatibility—is characteristic of what scholars often term **"Commonwealth Constitutionalism"** (e.g., Canada, the UK under the HRA, South Africa, Germany). While superficially contradictory, this practice coheres under a specific philosophical framework: **Institutional Optimization Constitutionalism**.

  This theory resolves the tension by redefining rights not as absolute trumps or mere interests, but as **principles requiring optimization**, and by reconceiving the separation of powers not as a division of spheres but as a **collaborative dialogue of epistemic competencies**.

  ### 1. Reconstructing the Implicit Philosophical Theory

  To make this practice coherent, we must attribute three specific theoretical commitments to the system:

  **A. Ontology of Rights: Principles as Optimization Requirements**
  The system rejects the Dworkinian view of rights as "trumps" that automatically override collective goals. Instead, it adopts Robert Alexy's theory of rights as **principles**.
  *   **Coherence:** Principles are norms that require something to be realized to the greatest extent possible, given the legal and factual possibilities. This justifies **proportionality**: since rights are optimization requirements, they inevitably collide with other principles (public safety, fiscal stability). Balancing is not a violation of the right's value but the *method* of realizing it in a complex world.
  *   **The "Objective Value" Rhetoric:** When courts call rights "objective values," they do not mean the *outcome* is fixed, but that the *commitment to optimization* is inviolable. The "inviolable limit" is not a specific policy boundary but the **essential core** of the right. As long as the legislature does not violate the essential core, it may balance the right against public interests, provided it follows the structured justificatory burden (proportionality).

  **B. Democratic Authority: Epistemic Division of Labor**
  The system rejects the idea that democracy is merely majoritarian will-formation. It posits a **dualist democracy**:
  *   **The Court's Role:** Guardian of *principled consistency*. Judges possess the institutional competence to analyze whether the government has provided sufficient justification for limiting a right (the "why").
  *   **The Legislature's Role:** Guardian of *social facts and resource allocation*. Legislators possess the democratic mandate and investigative capacity to determine the best means to achieve social ends (the "how").
  *   **Coherence:** The **Declaration of Incompatibility (DOI) with a transitional period** is the institutional manifestation of this division. The court identifies the principled defect (failure of proportionality) but acknowledges it lacks the democratic mandate and policy tools to craft the optimal solution. By deferring nullification, the court respects the legislature's epistemic advantage in repairing the violation while maintaining the judicial monopoly on defining the constitutional standard.

  **C. Separation of Powers: Dialogical Legitimacy**
  Legitimacy is not derived solely from the initial enactment (procedural) nor solely from the judicial veto (substantive), but from the **inter-branch dialogue**.
  *   **Coherence:** The transitional period forces a conversation. The legislature must actively reconsider the law in light of the court's reasoning. This transforms the "counter-majoritarian difficulty" into a "majoritarian enhancement": the majority gets to rule, but only after being compelled to justify its rule against constitutional principles.

  ### 2. Ontological Compatibility and Rival Accounts

  **Does it presuppose a particular ontology?**
  Strictly speaking, it presuprights as **institutionally embedded normative claims** rather than pre-political natural rights or pure economic interests.
  *   **Compatible Accounts:**
      *   **Alexy's Principle Theory:** Fully compatible (as detailed above).
      *   **Constitutional Constructivism:** Rights are constructed through the interplay of text, history, and institutional practice.
  *   **Incompatible Accounts:**
      *   **Rights as Absolute Trumps (Strong Deontology):** If rights are side-constraints that cannot be weighed, proportionality balancing is illegitimate.
      *   **Interest Theory (Pure Utilitarianism):** If rights are merely protected interests, the "objective value" rhetoric is mystification. A utilitarian would ask only if the law maximizes welfare, not if it passes a structured rights-test.
      *   **Political Constitutionalism (e.g., Richard Bellamy):** This theory argues that rights are best protected by political competition, not judicial review. The very existence of judicial proportionality review rules this out.

  **What theories of value and legitimacy does it quietly rule out?**
  1.  **Pure Consequentialism:** It rules out the idea that the *outcome* (social welfare) justifies the *process* regardless of rights. The structured test requires specific justificatory steps, not just a net-benefit analysis.
  2.  **Originalist Fixed-Meaning:** The "objective value" doctrine usually implies a living constitution where values evolve. Strict originalism would conflict with the flexible balancing required by proportionality.
  3.  **Parliamentary Sovereignty (Unqualified):** The power to invalidate (even deferred) rules out the British traditional view that courts cannot question statute validity.

  ### 3. Strict Requirements vs. Accompanying Features

  To maintain this specific coherence, certain elements are essential, while others are contingent.

  **Strict Requirements (Constitutive):**
  1.  **Substantive Review Power:** Courts must be able to assess the *content* of legislation against rights (proportionality), not just the procedure.
  2.  **Remand Authority:** Courts must be able to signal a defect without immediately destroying the legal vacuum (DOI/Deferred Nullification).
  3.  **Justificatory Burden:** The state must bear the burden of proof to justify limitations (shifting the presumption of liberty).

  **Accompanying Features (Contingent):**
  1.  **Appointment Mechanisms:** Whether judges are appointed by executives, legislatures, or commissions is secondary, *provided* the mechanism ensures sufficient independence to perform the balancing test without fear of reprisal.
  2.  **Length of Transitional Period:** The specific duration (6 months vs. 2 years) is pragmatic, not theoretical.
  3.  **Rhetoric of "Objective Values":** While common, the system could function with a rhetoric of "fundamental guarantees" instead, provided the operational logic (optimization) remains.

  ### 4. Institutional Shifts Under Rival Theories

  If the underlying theory were replaced, the institutional design would require radical alteration.

  **Scenario A: Pure Consequentialist Account**
  *   **Theory:** Constitutional justice aims to maximize aggregate social welfare. Rights are heuristic shortcuts for long-term utility.
  *   **Required Institutional Changes:**
      1.  **Abolition of Structured Proportionality:** Replace the three-step test with a direct **Cost-Benefit Analysis**. The "necessity" test becomes irrelevant if a rights violation produces a massive net social gain.
      2.  **Immediate Nullification or Upholding:** The "deferred remedy" makes no sense. If the law reduces utility, strike it down immediately to stop the harm. If it increases utility, uphold it regardless of rights infringement. There is no "dialogue," only calculation.
      3.  **Appointment Mechanism:** Judges would need to be selected for expertise in economics and social science rather than legal principle.

  **Scenario B: Pure Proceduralist Account**
  *   **Theory:** Legitimacy derives solely from the democratic process. Courts cannot judge the *substance* of rights, only the *fairness of the process* that produced the law.
  *   **Required Institutional Changes:**
      1.  **End of Proportionality Review:** Courts cannot weigh the "weight of the right" against "public interest." They can only ask: Was the hearing fair? Was the legislature properly constituted? Were minorities consulted?
      2.  **Remedy Change:** The remedy for a violation is **voiding the enactment process**, not declaring incompatibility of content. The legislature can re-pass the *exact same law* if it fixes the procedural defect (e.g., holds a committee hearing).
      3.  **Temporal Effect:** Judgments would likely be retroactive (the law was never validly passed) rather than prospective/deferred, because the defect is in the genesis, not the application.

  ### Conclusion

  The practice you describe is not a muddle of contradictory ideas, but a sophisticated **theory of institutional collaboration**. It treats rights as **optimization principles** rather than absolute barriers, and democracy as a **reasoned enterprise** rather than a headcount. It rules out both the rigidity of absolutism and the fluidity of pure utilitarianism. Its coherence depends entirely on the **deferred nullification**: without it, the court becomes a super-legislature (violating the separation of powers); with it, the court acts as a constitutional partner, enforcing the *duty to justify* while leaving the *choice of means* to the democratic branch. If this theory were abandoned for pure consequentialism or proceduralism, the distinctive architecture of proportionality and delayed remedy would collapse, replaced by either economic calculation or process-checking.
