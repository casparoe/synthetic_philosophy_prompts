answer: |-
  You have identified a genuine and structurally coherent pattern. Your distrust of your own formulation is unwarranted; it is precise. The three cases you describe are not merely analogous; they are instantiations of the same underlying epistemic manoeuvre.

  Below is an analysis of the structure, a survey of the nearest established concepts, a coinage for the pattern, and an assessment of its status as an artifact or a feature of reality.

  ### 1. Structural Unity of the Three Cases

  The three cases do share a structure. There is no odd one out, though Case 3 contains two distinct justifications that converge on the same structural role.

  *   **Case 1 (NFL):** The theorem shows no method is universally superior. The defence restricts the domain to 'natural' functions. The restriction is justified by past success.
  *   **Case 2 (Expert Advice):** The theorem shows no method is absolutely reliable. The defence restricts reliance to a pool of experts. The guarantee is relative to the pool. The reliability of the pool is assumed.
  *   **Case 3 (Projectibility):** The sceptic asks why we project 'green' rather than 'grue'. The defence restricts predicates to 'projectible' ones. The justification is either past success (empirical) or pragmatic necessity (transcendental).

  In all three, a **global sceptical challenge** (which demonstrates that without assumptions, success is impossible) is met by a **local methodological constraint** (bias, pool, or predicate restriction). Crucially, the *validity* of this constraint depends on an empirical claim about the world (that the world is smooth, that the pool contains truth, that nature is uniform). However, this empirical claim is not presented as a hypothesis to be tested, but as a **condition of the method's application**.

  The structure is:
  1.  **Sceptical Tie:** Proof that without assumptions, all methods are equal (or equally futile).
  2.  **Shelter Construction:** Introduction of a constraint (bias, pool, restriction) that breaks the tie.
  3.  **Wager Concealment:** The assumption that the world conforms to the constraint is treated as a methodological starting point rather than a contingent empirical claim subject to the original scepticism.

  ### 2. Nearest Established Concepts

  There is no single canonical term for this specific manoeuvre, though it sits at the intersection of several well-known philosophical problems. Here is how the nearest concepts fit, and where they fail to capture your observation.

  **A. Reichenbach's Pragmatic Vindication**
  *   **The Concept:** Hans Reichenbach argued that while we cannot prove induction will succeed, we can show that *if* any method succeeds, induction will. Thus, it is rational to use induction.
  *   **The Mismatch:** Reichenbach is explicit about the conditionality ("*if* the world is predictable"). Your observation concerns cases where this conditionality is obscured. In Case 1 (NFL), the claim that the world is 'smooth' is often presented as a technical fact about data distributions rather than a precarious wager. Your pattern identifies the *rhetorical shift* from vindication to assumption.

  **B. The Problem of the Criterion (The Agrippan Trilemma)**
  *   **The Concept:** To justify a method, we need a criterion; to justify the criterion, we need a method. This leads to circularity, regress, or dogmatism.
  *   **The Mismatch:** This describes the *dilemma* you are observing, but not the *specific move* used to escape it. Your pattern is a specific form of dogmatism (or perhaps coherentism) that disguises itself as technical necessity. The Problem of the Criterion is the disease; your pattern is a specific symptom.

  **C. Inductive Bias (Machine Learning)**
  *   **The Concept:** The set of assumptions a learning algorithm uses to predict outputs for inputs it has not encountered.
  *   **The Mismatch:** This is a descriptive technical term. It carries no epistemic critique. It does not capture the philosophical sleight-of-hand where the *justification* for the bias is smuggled in as a measure-theoretic default.

  **D. Transcendental Arguments**
  *   **The Concept:** Arguments that claim $X$ is a necessary condition for the possibility of experience $Y$. (Case 3's "need to start" answer).
  *   **The Mismatch:** A genuine transcendental argument claims logical necessity. Your observation is that these arguments often rely on *contingent* success ("it has worked before") while borrowing the rhetorical force of necessity ("we must assume this to begin").

  ### 3. Coinage and Definition

  Since no existing term captures the specific combination of domain-restriction and concealed contingency, I propose the following coinage:

  **Term:** **The Sheltered Wager**

  **Definition:**
  An argumentative manoeuvre in response to global scepticism (regarding induction, prediction, or inference) wherein the defender:
  1.  Acknowledges that no method is universally valid (the Sceptical Tie).
  2.  Constructs a **Shelter**: a restricted domain, hypothesis class, or pool of methods within which success is guaranteed *conditional* on the world possessing specific structural properties.
  3.  Treats the assumption that the world possesses these properties not as a falsifiable empirical hypothesis, but as a **Methodological Necessity** or a technical default.

  The 'Wager' is the hidden empirical claim that the world is, in fact, compatible with the Shelter. The 'Shelter' is the logical structure that protects the method from the Sceptical Tie, provided the Wager holds.

  #### Three Cases for the Definition

  **1. Clear Fit: The 'Occam's Razor as Efficiency' Argument (Kelly et al.)**
  *   **Description:** Some formal learning theorists argue that preferring simpler hypotheses is not about truth, but about 'efficiency': you will retract your beliefs fewer times on the way to the truth *if* the truth is simple.
  *   **Why it fits:** It offers a comparative guarantee (fewer retractions) rather than an absolute one (truth). It protects the method from scepticism by changing the currency of success. However, it only yields truth if the world is indeed simple. This empirical claim is often treated as a baseline for 'learning' rather than a contingent wager.

  **2. Clear Non-Fit: Bayesian Updating with a Proven Prior**
  *   **Description:** Suppose we have a physical coin known to be fair. We use a Bayesian prior of 0.5 for heads.
  *   **Why it does not fit:** Here, the 'Shelter' (the prior) is justified by independent physical evidence (the manufacturing of the coin), not by past predictive success or methodological necessity. The empirical claim is tested and verified *outside* the inductive loop. There is no concealed wager; the assumption is explicit and empirically grounded.

  **3. Near Miss: Critical Rationalism (Popper)**
  *   **Description:** Karl Popper rejects induction entirely. He argues we should not seek to justify theories, but to falsify them. We tentatively accept the theory that has survived the toughest tests.
  *   **Why it is a near miss:** Popper attempts to avoid the Sheltered Wager by refusing to claim that surviving tests makes a theory *probable* or *true*. He offers no guarantee of success. However, critics argue that preferring a falsified theory over an unfalsified one implicitly wagers that the future will resemble the past (that nature is uniform). If Popper admits this, it becomes a Sheltered Wager. If he maintains it is purely logical, it fails to offer a reason for *action*, distinguishing it from your pattern which aims to justify practice.

  ### 4. Artifact, Reading, or Reality?

  You asked whether this pattern is an artifact of how theorems are stated, an artifact of your reading, or a real feature of the epistemic situation.

  It is a **real feature of the epistemic situation**.

  It is not an artifact of the theorems (NFL is mathematically sound). It is not an artifact of your reading (you have correctly identified the gap between the theorem's conditions and the practitioner's assumptions).

  It arises because of the **Problem of the Criterion**. To evaluate a method, we need a standard. To evaluate the standard, we need a method. We cannot step outside our cognitive apparatus to check if it matches the world without using that very apparatus. Therefore, any defence of a method must eventually bottom out in an assumption that cannot be justified by the method itself.

  The Sheltered Wager is the standard way human reasoning manages this impasse: we build a shelter (a bias, a paradigm, a language) and treat it as 'given' so that work can proceed. The pattern you see is the seam where the contingent meets the necessary.

  ### 5. Conversion: When does Comparative Guarantee become Reason for Success?

  You asked under what conditions a comparative guarantee converts into a reason to expect success, and whether that conversion is another instance of the pattern.

  **The Condition for Conversion:**
  A comparative guarantee (e.g., "I will do as well as the best expert") converts into a reason to expect absolute success only if there is **independent evidence** that the Shelter is non-empty.
  *   In Case 2 (Experts), you need reason to believe *at least one expert is right*.
  *   In Case 1 (NFL), you need reason to believe *the target function is smooth*.

  **Is the Conversion another Sheltered Wager?**
  *   **If the evidence is empirical (e.g., "Experts have been right before"):** Yes, it is another instance of the pattern. You are relying on past success to justify the assumption that the pool contains truth. You have simply moved the Shelter up one meta-level.
  *   **If the evidence is causal/mechanistic (e.g., "The experts have access to the data source"):** No, this is a genuine escape. Here, you are not relying on induction to justify the method, but on a causal account of why the method *must* work.

  However, in most philosophical and machine learning contexts, the justification is empirical ("it works in practice"). Therefore, the conversion is typically **another instance of the pattern**. We justify the bias by pointing to success, and justify the expectation of success by pointing to the bias. This is the circularity you sensed in your first formulation.

  ### Summary

  You have identified **The Sheltered Wager**. It is the structural move of defending induction by restricting the domain of applicability while treating the empirical assumption required to make that restriction effective as a methodological necessity. It is a real feature of our epistemic condition, arising from the impossibility of validating our cognitive tools without using them. It is not a logical fallacy in the strict sense, but it is an epistemic vulnerability: it protects the method from scepticism only by betting on the world, a bet that the method itself cannot validate.
