answer: |-
  Look, I get it. You're seeing the same pitch deck with different logos. It's the "Pascal's Mugging" playbook: take a number so small it's meaningless, multiply it by a number so big it's incomprehensible, and demand you ignore the real world in between. It's mathematically slick but often philosophically bankrupt.

  You need a filter that doesn't just check the arithmetic but checks the *grounding* of the arithmetic. Below is a four-step procedure I call "The Mugging Filter." It's designed to run in about 15 minutes. It's not perfect, but it separates "robust existential risk" from "numerology with a moral hazard."

  ### The Mugging Filter: A 4-Step Procedure

  **Step 1: The Origin Story (Epistemic Grounding)**
  Ask: *Where did the probability number come from?*
  *   **Pass:** The number is derived from empirical data, historical frequencies, or physical models with error bars (e.g., asteroid orbits, pandemic frequency).
  *   **Fail:** The number is derived from a theoretical model that assumes its own conclusion, or it's a "guestimate" adjusted to make the expected value look big.
  *   **Stop Point:** If the probability is conjured to balance the utility equation, stop.
      *   **Verdict:** "Broken — don't publish this framing." The math is pretending to be precise where reality is fuzzy.

  **Step 2: The Leverage Check (Tractability)**
  Ask: *Does spending this money actually change the probability?*
  *   **Pass:** There is a clear causal mechanism showing how the intervention reduces the risk (e.g., deflecting the rock, filtering the pathogen).
  *   **Fail:** The intervention is symbolic, or the risk is driven by factors outside human control (e.g., "funding awareness" to stop a random asteroid).
  *   **Stop Point:** If the money doesn't move the needle, the expected value is irrelevant.
      *   **Verdict:** "Broken — don't publish this framing." You're paying for hope, not safety.

  **Step 3: The Robustness Stress Test**
  Ask: *If I change the probability by one order of magnitude (10x higher or lower), does the conclusion flip?*
  *   **Pass:** The argument holds even if the risk is significantly over- or underestimated. The margin of safety is wide.
  *   **Fail:** The argument only works if the probability is exactly as stated. If the risk is 10x smaller, the project becomes absurdly expensive per life saved.
  *   **Stop Point:** If the decision hinges on a decimal point we can't verify, the argument is too fragile to justify radical reordering.
      *   **Verdict:** "No right answer without judgment." This is where math ends and gut instinct begins. Proceed with extreme skepticism.

  **Step 4: The Commensurability Check**
  Ask: *Are we trading certain, immediate suffering for uncertain, future existence?*
  *   **Pass:** The trade-off is within the same moral category (e.g., lives now vs. lives later).
  *   **Fail:** The trade-off requires accepting definite harm to specific beings now to save abstract potential beings later.
  *   **Stop Point:** If the argument requires you to accept a moral premise that isn't shared by the people affected, math can't solve it.
      *   **Verdict:** "This isn't a math error, it's a values call, hand it to a human."

  ---

  ### Applying the Filter

  Here's how this plays out with the three pitches you mentioned.

  #### Case 1: The Asteroid Deflection System
  *Proposal: Spend $40 billion on a deflection system. Risk is 1-in-90,000 of impact in the next century.*

  *   **Step 1 (Origin):** The probability comes from astronomical surveys. It's not made up, but it's specific to a century-long window where detection capabilities change. It's shaky but not fake. **Pass.**
  *   **Step 2 (Leverage):** We know how to deflect asteroids. Money buys telescopes and kinetic impactors. **Pass.**
  *   **Step 3 (Robustness):** Here's the snag. If the risk is actually 1-in-900,000 (which is within the error margin of century-long predictions), the cost per expected life saved skyrockets. At 1-in-90,000, you're spending roughly $500,000 per expected life saved (assuming 7 billion lives). If the risk is 10x lower, you're at $5 million per life. Compared to malaria nets or pandemic prep, this is fragile.
  *   **Verdict:** **Broken — don't publish this framing.**
  *   **Why:** While the science is real, the *priority argument* collapses under slight uncertainty. Framing this as "we must reorder society to fund this" ignores that the money could save more expected lives elsewhere. The probability is too noisy to justify the "reorder society" claim.

  #### Case 2: Farmed-Animal Welfare vs. Human Health
  *Proposal: Redirect human health budgets to farmed-animal welfare because the expected number of future suffering animals dwarfs current human populations.*

  *   **Step 1 (Origin):** The probability relies on assumptions about future factory farming scaling up across the galaxy or centuries. This is theoretical, not empirical. **Weak Pass/Fail.** Let's be generous and say it's a plausible model.
  *   **Step 2 (Leverage):** Funding welfare now might set norms for the future. **Pass.**
  *   **Step 3 (Robustness):** If the future population is 10x smaller than predicted, does the argument hold? Maybe not. But let's assume it passes robustness because the numbers are so huge.
  *   **Step 4 (Commensurability):** This is the blocker. You are asking to take resources from *currently suffering humans* to help *potential future animals*. This trades certain, identifiable human harm for probabilistic, abstract animal benefit.
  *   **Verdict:** **"This isn't a math error, it's a values call, hand it to a human."**
  *   **Why:** The expected value math might "work" if you accept the premise that future animal lives outweigh current human lives. But that premise is ethical, not mathematical. No checklist can solve that; it requires a moral debate, not a cost-benefit analysis.

  #### Case 3: The Uncomfortable Truth (Global Biosecurity Surveillance)
  *Proposal: Divert 5% of global GDP to install real-time genetic sequencing in every wastewater system and airport globally to catch engineered pathogens. Chance of an engineered plague ending civilization is 1% per decade.*

  *   **Step 1 (Origin):** The 1% figure is based on expert elicitation from biosecurity researchers, not made up. It's debatable but grounded. **Pass.**
  *   **Step 2 (Leverage):** Surveillance directly reduces the time-to-detection, which lowers extinction risk. **Pass.**
  *   **Step 3 (Robustness):** If the risk is 0.1% per decade, is it still worth 5% of global GDP? Yes, because the payoff (avoiding extinction) is effectively infinite in this framework. The margin is wide. **Pass.**
  *   **Step 4 (Commensurability):** It trades economic growth and privacy now for existence later. Same category (human welfare/existence). **Pass.**
  *   **Verdict:** **Valid but I still hate it.**
  *   **Why:** The checklist validates the priority shift. The math holds, the tractability is real, and the risk is robust enough. But implementing this means creating a surveillance state that could be abused. The checklist says "do it," but your journalistic instinct should say "wait, what about the unintended consequences?" This is where the procedure admits defeat: it validates the EV argument, but it can't account for the political toxicity or the risk of the solution becoming the problem.

  ---

  ### Where the Checklist Misfires

  I need to be honest with you—this tool isn't a magic wand. Here's where it breaks:

  1.  **It Can't Spot Black Swans:** The filter relies on probabilities we can estimate. It fails on risks we haven't imagined yet. If the real threat isn't asteroids or plagues but something else entirely, this checklist just helps you prioritize the wrong doom.
  2.  **It Hides Moral Judgments in Step 3:** The "Robustness Test" sounds mathematical, but deciding what counts as a "wide enough margin" is a judgment call. I told you to stop if the decision flips with a 10x change, but why 10x? Why not 2x? That's me smuggling in my own risk tolerance.
  3.  **It Assumes Linear Tractability:** Step 2 assumes money buys safety in a straight line. Sometimes it does, sometimes it hits diminishing returns, and sometimes it hits a hard wall. The checklist might tell you "money helps" when actually "we have no idea how to solve this yet."
  4.  **The "Valid but Uncomfortable" Trap:** As you saw in Case 3, the checklist can validate something dangerous. Just because the expected value is high doesn't mean the side effects (like authoritarianism) don't outweigh it. The checklist ignores second-order effects to keep it to 15 minutes.

  ### Bottom Line

  Use this to kill the lazy pitches. If the probability is made up (Step 1) or the money doesn't help (Step 2), kill it immediately. If it passes those but fails the values check (Step 4), frame it as an ethical debate, not a math proof.

  But when it passes everything (Case 3), don't let the checklist write the headline for you. That's when you need to lean hardest on your reporting, because the math might be right, but the world is complicated.
