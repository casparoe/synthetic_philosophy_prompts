answer: |-
  ### Brainstorming Pass: Candidate Diagnoses

  Here are eight candidate diagnoses for the pattern you describe, drawn from distinct philosophical subfields. I will evaluate them for fit, rejecting those that fail to capture the specific *asymmetry* and *immunity to dissolution* you note.

  1.  **Chalmersian Verbal Dispute:** The parties are using different meanings for "part of the system" or "agent" but failing to recognize it.
      *   *Verdict:* **Rejected.** As you noted, pointing this out does not dissolve the dispute. In a standard verbal dispute, once the ambiguity is flagged, parties typically agree on the underlying facts and acknowledge they were talking past each other. Here, both sides insist they win on *both* the descriptive and normative registers. The shift is not an accident; it is strategic and persistent.

  2.  **Conceptual Engineering (Carnap/Haslanger):** The participants are implicitly engaged in proposing new concepts for specific purposes (e.g., "agent-for-responsibility" vs. "agent-for-prediction").
      *   *Verdict:* **Partial Fit.** This captures the "what we want the notion to do" aspect. However, standard conceptual engineering is usually explicit ("We *should* define X this way"). Your observation is that the shift happens *implicitly* within the same argument to secure a desired outcome. It diagnoses the *tool* but not the *structural inconsistency* of swapping tools mid-argument based on the direction of the boundary shift.

  3.  **Pragmatic Encroachment on Metaphysics:** Drawing from epistemology (Fantl & McGrath), this suggests that the stakes of the situation change the truth conditions of the attribution.
      *   *Verdict:* **Rejected.** Pragmatic encroachment usually argues that high stakes make it *harder* to know/claim something. It does not typically explain why high stakes switch the *criteria* from empirical to normative depending on whether the boundary is expanding or contracting. It explains sensitivity to context, not the directional asymmetry.

  4.  **Motivated Metaphysics (Psychological Explanation):** The participants are engaging in motivated reasoning, selecting metaphysical criteria that yield their preferred ethical or theoretical conclusion.
      *   *Verdict:* **Rejected as Primary Diagnosis.** This explains *why* the shift occurs (bias) but not *what* the shift is philosophically. It is a genealogical critique, not a metaphilosophical diagnosis. It treats the phenomenon as an error to be corrected by better psychology, rather than a structural feature of the discourse that needs philosophical carving.

  5.  **Ontological Pluralism (Hirsch/Kriegel):** There are multiple equally valid ways to carve up the world, and the dispute is about which "carving" is authoritative.
      *   *Verdict:* **Rejected.** Pluralism suggests both sides could be right in different frameworks. Your description indicates both sides claim their framework is the *correct* one for the case at hand, and they swap frameworks to maintain that claim of correctness. Pluralism would dissolve the tension; your phenomenon thrives on it.

  6.  **The Naturalistic Fallacy (Moore):** The participants are deriving an "ought" (responsibility/agency) from an "is" (causal structure), or vice versa, illicitly.
      *   *Verdict:* **Rejected.** This is too blunt. The participants are sophisticated enough to know the distinction. The problem is not that they confuse the two, but that they treat the boundary between them as movable depending on which side of the boundary they wish to defend.

  7.  **Teleological Metaphysics (My Proposal):** The metaphysical status of a boundary is treated as dependent on the *telos* (purpose) of the inquiry, but the *telos* is shifted silently to match the desired boundary.
      *   *Verdict:* **Strong Contender.** This captures the "what we want the notion to do" element. However, it needs to be sharpened to account for the *asymmetry* (Expand=Empirical, Contract=Normative).

  8.  **Constitutive Register Asymmetry (My Proposal):** A specific form of equivocation where "constitution" oscillates between *mechanistic composition* (empirical) and *normative integration* (pragmatic) depending on whether the move expands or contracts the system.
      *   *Verdict:* **Best Fit.** This names the specific structural feature you identified: the correlation between the *direction* of the boundary shift and the *register* of justification employed.

  ---

  ### Established Terminology vs. Proposed Carving

  **Does this have an established name?**
  No. There is no single established term in the literature on the Extended Mind Thesis (EMT) or philosophy of agency that captures this specific *bidirectional asymmetry* in metaphilosophical register.

  The literature discusses **Verbal Disputes** (Chalmers 2009), **Conceptual Engineering** (Cappelen 2018), and **Metaphysical Anti-Realism** (Hirsch 2002). In the specific context of EMT, there is discussion of the **"Mark of the Cognitive"** (Rowlands 2010) and the distinction between **"Coupling-Constitution Fallacy"** (Adams & Aizawa 2008) vs. **"Parity Principle"** (Clark & Chalmers 1998). However, these focus on the criteria for cognition, not the *shifting metaphilosophical status* of those criteria when applied to internal vs. external cases.

  The closest existing discussion is found in **Neil Levy's** work on neuroethics (e.g., *Neuroethics: Challenges for the 21st Century*), where he distinguishes between *ontic* claims about cognitive systems and *normative* claims about agency. However, Levy typically argues for keeping these distinct, whereas your observation is that disputants *conflate* them strategically.

  **My Proposal: Constitutive Register Asymmetry**

  I propose we call this phenomenon **Constitutive Register Asymmetry (CRA)**.

  **Definition:** CRA occurs in metaphysical disputes about system boundaries (mind, agent, group) when participants systematically vary the *modal status* of the boundary criteria (treating them as empirical/descriptive vs. normative/pragmatic) correlated with the *direction* of the proposed boundary shift (expansion vs. contraction), in order to preserve a pre-theoretical intuition about responsibility or identity.

  **Boundary Conditions:**
  *   **Included:** Disputes where the same participant argues "X is part of the system because of functional isomorphism" (Empirical) in Case A, but "Y is not part of the agent because it violates normative integration" (Normative) in Case B, where X and Y are structurally analogous (e.g., Notebook vs. DBS).
  *   **Excluded:** Explicit pluralism (where a philosopher states, "For purpose 1, we use empirical criteria; for purpose 2, we use normative criteria"). CRA requires the shift to be implicit or presented as a unified truth.
  *   **Excluded:** Simple burden-of-proof shifts (where both sides agree on the *type* of evidence needed but disagree on the *amount*).

  **Why this carving?**
  It distinguishes the phenomenon from simple verbal disputes (which are resolvable by disambiguation) and from motivated reasoning (which is psychological). CRA is a *structural feature of the discourse* arising from the hybrid nature of "agency" and "cognition," which are both natural kinds (causal systems) and social kinds (nodes in responsibility practices).

  ---

  ### Addressing Your Colleague's Deflationary Explanation

  Your colleague suggests this is a **Burden-of-Proof Artifact**: Boundary-expanding claims are surprising (demand empirical evidence); boundary-contracting claims have high stakes (demand normative justification).

  **Is this right?**
  No. While burden of proof plays a role, it does not explain the **Register Switch**.

  If it were merely a burden-of-proof artifact, we would expect the following consistency:
  *   **Claim:** "Notebook is part of the mind." (Surprising) -> **Demand:** "Show empirical evidence."
  *   **Claim:** "DBS is NOT part of the agent." (High Stakes) -> **Demand:** "Show normative justification."

  *However*, your observation is that the *proponents* of the claim switch the register to meet the demand in a way that favors their conclusion.
  *   **EMT Proponent:** Wants Notebook IN. Treats "IN" as Empirical (easy to show functional parity).
  *   **EMT Proponent:** Wants DBS OUT (to save responsibility). Treats "OUT" as Normative (easy to show lack of endorsement).
  *   **Internalist:** Wants Notebook OUT. Treats "OUT" as Normative/Conceptual (intuitions about skull).
  *   **Internalist:** Wants DBS OUT. Treats "OUT" as Empirical (it's a tumor, not a system).

  **How to Distinguish Empirically:**
  To test CRA against the Burden-of-Proof Artifact, you would conduct a textual analysis or experimental philosophy study coding arguments for **Justification Type** (Empirical vs. Normative) against **Desired Outcome** (Expand vs. Contract), controlling for **Surprise** and **Stakes**.

  *   *Prediction (Colleague):* Justification type correlates with Stakes/Surprise.
  *   *Prediction (CRA):* Justification type correlates with Desired Outcome, *independent* of Stakes/Surprise.

  If you find cases where a boundary *expansion* is high-stakes (e.g., "The Corporation is a Moral Agent") and proponents argue for it on *empirical* grounds (system organization) while critics argue on *normative* grounds (lack of soul/conscience), the Colleague's theory fails (high stakes should demand normative justification for the expansion), but CRA holds (proponents use empirical criteria to expand). This pattern is indeed visible in the literature on corporate moral agency, supporting CRA.

  ---

  ### What Could a Dispute with This Structure Come To?

  If CRA is the correct diagnosis, settling the dispute cannot be a simple **Discovery** (finding the "real" boundary) because the boundary is not a natural joint waiting to be found. Nor can it be a simple **Decision** (stipulating a definition), because the participants believe they are describing reality.

  **Settling as Framework Pluralism:**
  Progress consists in moving from **Monist Realism** (There is One True Boundary) to **Explicit Functional Pluralism**.
  1.  **Acknowledge the Hybrid Kind:** Admit that "Agent" and "Cognitive System" are *cluster concepts* containing both causal-functional properties and normative-pragmatic properties.
  2.  **Disambiguate the Query:** Stop asking "Is the notebook part of the mind?" and start asking:
      *   "Is the notebook part of the *causal vehicle* of belief?" (Empirical/Functional)
      *   "Is the notebook content attributable to the agent for *responsibility*?" (Normative/Legal)
  3.  **Progress Metric:** Progress is not a resolved "Yes/No" on the boundary. Progress is measured by the **decoupling of the registers**. A paper makes progress if it explicitly states: "For the purpose of cognitive modeling, we include the notebook (Empirical). For the purpose of legal liability, we may exclude it (Normative)," *without* claiming one undermines the other.

  **Why the Dispute Persists:**
  The dispute is immune to dissolution because the participants are fighting for **Theoretical Authority**. To admit the boundary is partly normative feels like conceding that the science is "soft." To admit it is partly empirical feels like conceding that ethics is "reducible." The oscillation allows them to maintain the prestige of science (when it helps) and the autonomy of ethics (when it helps).

  ---

  ### Flags on Your Description

  I must flag two potential areas of confusion or misdescription in your prompt, which a rigorous analysis requires:

  1.  **The "Same Participants" Claim:** You write: *"The theorists who, twenty pages earlier, insisted that the skull has no privileged status... often say something different in spirit."*
      *   *Critique:* Be careful here. In the literature, the **Extended Mind** proponents (Clark, Chalmers) often *do* argue that DBS or tumors *are* part of the cognitive system (Expansion), even if they are alien. They argue for *integration*, not exclusion. The argument that DBS actions are "not the agent's" is often made by **Neo-Aristotelians** or **Constitutivists** (e.g., Frankfurtian hierarchies), who are typically *Internalists* about the mind.
      *   *Correction:* The asymmetry might not be within a *single* theorist's work, but within the *dialectical ecosystem*. The EMT proponent uses Empirical criteria to Expand (Notebook) and Normative criteria to Defend against "Absorption" (I am not my tumor). The Internalist uses Normative criteria to Resist Expansion (Notebook isn't belief) and Empirical criteria to Support Exclusion (Tumor isn't me). The *structural* asymmetry holds, even if the *individual* consistency is messier than your description suggests.

  2.  **Conflation of "Mind" and "Agent":**
      *   *Critique:* You move between "part of the mind" (cognitive boundary) and "part of her/agent" (moral boundary).
      *   *Correction:* This conflation is likely the *engine* of the CRA. If "Mind" were strictly cognitive and "Agent" strictly moral, the switch would be less problematic. The phenomenon exists precisely because cognitive science claims authority over the "Agent" while ethics claims authority over the "Mind." Your diagnosis is strongest if you highlight that the dispute is actually about **Jurisdiction**, not just boundaries.

  ### Summary Recommendation

  You have identified a genuine, unnamed structural feature of contemporary metaphilosophy of mind. Do not accept the deflationary "burden of proof" explanation; it misses the directional correlation.

  1.  **Name it:** Constitutive Register Asymmetry.
  2.  **Define it:** The correlation between boundary direction (expand/contract) and justification type (empirical/normative).
  3.  **Resolve it:** Do not seek a "true" boundary. Seek **Explicit Jurisdictional Pluralism**. Progress is when a paper specifies which register it is operating in and acknowledges the legitimacy of the other register for other purposes.

  This is not noise. It is the sound of a discipline struggling to reconcile its naturalistic ambitions with its normative commitments.
