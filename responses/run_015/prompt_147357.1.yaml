  ### Ethical Implication: The Duplicate in Case 3

  **Question:** *Does the principle give me any special reason to care about what happens to the duplicate in 3?*
  *(Case 3: Non-destructive scan at 50, original dies at 80, duplicate activated.)*

  *   **Under ASC:** The duplicate is a **Structural Isomorph** caused by you, but it failed the **Non-Competition** clause because *you* were still alive when it was activated. It is a distinct person.
  *   **Under NBC:** The duplicate has **Relation R** with you, but identity fails due to branching.

  **The Verdict on Care:**
  Neither principle grants you *self-interested* reason to care about the duplicate *as yourself*, because in both principles, **you die at 80**. The duplicate is not the bearer of your future self-interest.

  **However,** both principles acknowledge the duplicate is **not a stranger**.
  *   They carry your memories.
  *   They love your loved ones.
  *   They feel your pain.

  Therefore, you should care about the duplicate **altruistically**, with the same intensity you would care for an identical twin or a very close child. You should not fear their death as *your* death, but you should wish for their flourishing as you would for someone who contains everything you value. If the principle forces you to say "That is someone else" (Case 3), the ethical obligation shifts from *Prudence* (self-care) to *Benevolence* (other-care).

  ### Summary Recommendation

  1.  **Adopt the Non-Branching Psychological Continuity (NBC) Principle.** It handles the branching cases (3, 4, 5) which are the most logically treacherous, with the most consistency.
  2.  **Revise your verdict on Case 2.** Accept that the 900-year gap does not kill you if the information is preserved. The "balk" is an emotional response to the *context* (archaeologists vs. travel), not the *metaphysics*.
  3.  **Maintain your verdict on Case 6.** Insist on Structural Isomorphism over mere Functionalism. This preserves the intuition that *how* the mind works matters, not just *what* it outputs.
  4.  **Accept the Ethical Shift.** In Case 3, you die. Care for the duplicate as a beloved successor, not as your future self.
