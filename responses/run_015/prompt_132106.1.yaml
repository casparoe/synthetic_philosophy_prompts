  Good morning, everyone. Welcome. It's rare enough to see a room split half-and-half like this. On one side, the people who worry about what action *is*; on the other, the people who actually build the programmes that constrain it. Usually, these conversations end with the engineers confused and the philosophers frustrated. I want to try and avoid that.

  I thought we'd start with the oldest bug in the book. Buridan's ass. You know the one. A donkey placed precisely between two identical bales of hay. The standard textbook telling says the beast starves because it lacks a sufficient reason to pick one over the other. Indifference leads to paralysis. Full stop.

  But I want to propose a slightly different reading for today. Call it the 'stalled equilibrium' view.

  Think about the physics of it. To remain perfectly equidistant isn't passive. It's active. The ass has to adjust its stance, resist the pull of hunger, ignore the smell of the hay on the left to focus on the right. Maintaining that centre point is itself a kind of work. It requires energy to stay still when there is pressure to move. So, perhaps the ass doesn't die because it *can't* choose. It dies because maintaining perfect equidistance is itself a hidden preference for the status quo of not-choosing. It prefers the safety of the dilemma to the risk of the bite.

  Now, why does this matter for us, specifically here?

  For the engineers in the room: I know the instinct. When you see a user stuck in a loop, or a system returning null because two options weigh the same, the urge is to treat indifference as a bug. You want to inject a tie-breaker. A randomiser. A nudge. You think, 'let's just push them off the fence'. But if indifference is actually a stable preference—a 'stalled equilibrium'—then forcing a choice might be breaking something that isn't broken. You might be solving for paralysis when you should be designing for suspension. Because sometimes, not choosing is the most rational thing to do. It's a wait-and-see strategy. If you code a forced choice, you're essentially deleting the option to wait.

  And for the philosophers: I'm not standing here to tell you that theory needs to bend to code. I know better than to try and lecture this half of the room on normativity. But I am suggesting that if we treat the ass's stagnation as a positive action rather than a failure of will, it changes what we're looking for. It's not about how to escape the trap, but why the trap is comfortable. What is the utility of staying still?

  So, as we go through the sessions, let's hold that tension. If we treat indifference as noise, we'll build noisy systems. If we treat it as signal, we might actually understand why people—and machines—sometimes prefer to stand still. We need to decide whether we're building architecture for decision, or architecture for deliberation. They aren't the same thing.

  Anyway, that's enough from me. Coffee's outside. Let's see if we can get the donkey moving without starving it.
