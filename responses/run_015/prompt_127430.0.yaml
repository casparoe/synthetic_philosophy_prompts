answer: |-
  **Project Title:** Unit Capture and the Stability of Moral Trade

  **Research Question**
  Standard models of moral trade evaluate arrangements at a single time-slice: holding terminal values fixed, agents swap actions to exploit comparative advantage, yielding positive expected gain under each party's own valuation. This project challenges the fixed-value assumption. It posits a mechanism called "unit capture": to trade, agents must represent values in exchange units (money, hours, votes). Repeated trading causes the agent to represent the good in the units of the exchange rate rather than the units native to the value. The numeraire systematically omits the qualitative features that made the good worth trading for initially.

  The central question is not whether moral trade is generally good, but: **When a proposed trade predictably alters what one or both parties value, which temporal and counterfactual standpoint is authoritative for judging whether the trade was mutually beneficial?** Specifically, does the justification for trade rely on the values held *ex ante* (before the mechanism alters them) or *ex post* (after the mechanism has run)? A determinate answer requires specifying whether a trade that is positive-sum *ex ante* but negative-sum *ex post* (due to value erosion) should be classified as a successful trade or a failure of agency.

  **Critique of Existing Positions**
  Three standard replies fail to resolve this. First, that value change is merely preference change and thus evaluatively neutral. This fails because unit capture is endogenous to the trade mechanism itself, not an external shock; treating it as neutral ignores that the trade undermines the very values justifying the trade.

  Second, that agents can fold future value changes into the *ex ante* calculation at a discount rate. This is the critical failure point. To discount future values, one must weight them against current values. But if the trade alters the current values into the future values, using current values to authorize the change is circular. The standpoint from which the later values get weighted is itself the thing under dispute. If current values endorse the trade that corrupts them, the endorsement is suspect; if future values reject the trade, they are already corrupted. There is no neutral arbiter within the standard framework.

  Third, that this is purely an empirical psychological question about frequency. This fails because even a rare mechanism undermines the normative force of the trade model. If the model permits trades that systematically erode the agent's capacity to value the traded goods, the model is unstable regardless of empirical frequency.

  **Methodology**
  This is a conceptual project requiring no new empirical data collection. It proceeds in three phases over six months.

  *Months 1–2: Taxonomy.* I will construct a taxonomy of value-change mechanisms in trade contexts. The goal is to distinguish "unit capture" from ordinary learning (where value representation improves) and ordinary exploitation (where one party deceives the other). The distinguishing feature will be the substitution of exchange units for intrinsic value units in the agent's deliberative process.

  *Months 3–4: Modeling and Stress Tests.* I will determine whether a minimal formal model is required or if stylized cases suffice. Given the qualitative nature of "value erosion," stylized cases are likely superior. I will construct cases involving small, repeated, community-internal trades (where unit capture is most likely) versus large, one-off trades. I will specifically test for a "money-pump" analogue: whether there exists a cycle of individually acceptable trades that leaves every participant worse off by their own lights once the cumulative effects on valuing are taken into account.

  *Months 5–6: Normative Output.* I will draft a set of constraints on moral trade. The output will not be a general theory of value change or personal identity. I will borrow a fixed assumption of continuity of agency from those debates without adjudicating them. The focus remains on the stability of the trade mechanism, not the metaphysics of the self.

  **Possible Conclusions**
  The project will argue for one of four conclusions, decided by the robustness of the unit capture mechanism in the stress tests:
  1.  **Negligibility:** Unit capture is rare or self-limiting; the case for moral trade survives untouched.
  2.  **Restricted Scope:** Unit capture bites only on values bound up with practical identity; the upshot is a restriction on *what* may be traded (e.g., voting rights, core commitments) rather than *how much*.
  3.  **Institutional Redesign:** The effect is pervasive but manageable via structural changes (e.g., limiting trade frequency, changing numeraires).
  4.  **Refusal:** The effect is unavoidable; some trades must be refused even though they are positive-sum *ex ante*.

  A key intermediate finding will be whether the "money-pump" analogue holds. If cycles of acceptable trades lead to universal loss via value erosion, this would demonstrate a structural instability in the practice analogous to preference cycling in decision theory.

  **Failure Conditions**
  This project fails if:
  1.  Every case of unit capture collapses into either ordinary learning (where the change is an improvement) or ordinary exploitation (identifiable beforehand via standard consent checks), meaning nothing new is being described.
  2.  The effects are so case-specific that no usable rule survives to guide practitioners.
  3.  The argument quietly requires cardinality or intertheoretic comparisons that the moral trade framework explicitly forbids, rendering the conclusion incompatible with the premises.

  **Deliverable and Justification**
  A survey or interview study could measure how often agents *feel* their values have changed, but it cannot answer the normative question of which standpoint is authoritative. Only philosophical analysis can resolve the circularity of weighting current vs. future values. The deliverable will be a decision procedure for practitioners: a set of criteria to determine, this month, whether a specific offered trade is safe to accept given the risk of unit capture. This moves the field from asking whether trade works in principle to specifying which denominations of it are safe to repeat.

  ***

  **Note on Weakest Link**
  The weakest part of this proposal is the critique of the "ex ante discounting" reply. You argue that weighting future values against current values is circular because the current values are the ones being corrupted. However, a sophisticated defender of standard moral trade could argue that *all* decision-making involves risking future preference change, and we necessarily use current values to authorize those risks. To succeed, you must show that unit capture is distinctively *self-undermining* in a way that ordinary risk is not—i.e., that it destroys the capacity to value the trade good itself, rather than just changing the preference ordering. If you cannot sharply distinguish "corruption" from "updating," the circularity charge loses its bite.
