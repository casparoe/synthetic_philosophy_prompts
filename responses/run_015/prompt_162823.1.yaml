answer: |-
  Your diagnosis is correct: the argument is not singular. It is a composite of distinct philosophical conflicts that have been conflated under the technical language of zoning and housing supply. Your experiment with transferable consent rights is the critical piece of evidence here. The fact that it failed to persuade the "block" side—even when it theoretically compensated them for their losses—reveals that the core friction is not about the *distribution* of benefits and burdens, but about the *commensurability* of the values at stake.

  Here is the diagnosis of the disagreement, structured by your questions.

  ### 1. Is the stacking hypothesis right?
  Yes. You have correctly identified the stratification: Standing, Counterfactuals, Moral Claims, and Procedure. However, these are not merely stacked; they are nested. The disagreements about standing and counterfactuals are derivative of the deeper disagreement about the moral claim (your third point).

  The "build" side operates on a **cosmopolitan utilitarian** framework: the metropolitan area is the unit of analysis, welfare is aggregated across individuals, and housing is a fungible commodity whose allocation should be optimized for access and efficiency.

  The "block" side operates on a **local communitarian** framework: the neighborhood is the unit of analysis, welfare is embedded in relationships and stability, and housing is a constitutive part of a life plan that cannot be swapped without loss.

  Your transferable rights proposal failed because it attempted to solve a communitarian objection with a cosmopolitan tool. By putting a price on consent, you asked the "block" side to accept the premise that their neighborhood is a portfolio of assets rather than a web of relations. To accept the money is to admit that the relationship was for sale. Their objection ("the market itself is the insult") is a claim about **corruption**, not compensation. They are arguing that introducing market norms into a social sphere degrades the value of that sphere, regardless of the price paid.

  ### 2. Which disagreement is load-bearing?
  The load-bearing disagreement is **ontological**. It is a disagreement about what a neighborhood *is*.

  *   **For the "build" side:** A neighborhood is a geographic subset of a regional labor and housing market. Its "character" is an ephemeral byproduct of current prices and demographics. It has no moral weight independent of the individuals currently occupying it. Therefore, outsiders (who are currently excluded) have equal standing to insiders.
  *   **For the "block" side:** A neighborhood is a collective project, a form of social capital that accrues over time. It has a reality distinct from the sum of its current residents. It generates obligations between neighbors that are not contractual. Therefore, outsiders do not have standing to demand entry if entry disrupts the collective project, because the project itself is a good that deserves protection.

  This ontological split drives the other disagreements.
  *   **Standing:** If a neighborhood is a market subset, anyone who might live there has standing. If it is a collective project, only those contributing to the project (existing residents) have standing.
  *   **Counterfactuals:** If it is a market, "build elsewhere" is inefficient friction. If it is a project, "build elsewhere" preserves the integrity of *this* project.
  *   **Procedure:** If it is a market, veto points are distortions. If it is a project, veto points are necessary governance tools for the collective.

  Because the ontological disagreement is fundamental, empirical data cannot resolve it. You cannot measure "social fabric" in the same units you measure "housing units." When the "build" side cites studies on filtering, they are speaking the language of flows and stocks. When the "block" side cites studies on displacement, they are speaking the language of rupture and loss. They are not looking at the same object.

  ### 3. Is the dispute merely verbal?
  It is not *merely* verbal, but it is **conceptually incommensurable**.

  Terms like "community," "displacement," and "affordable" are not just being defined differently; they are being used to track different phenomena.
  *   **Displacement:** For the "build" side, this is primarily physical eviction or economic exclusion from a region. For the "block" side, this includes cultural displacement, the loss of social networks, and the psychological stress of rapid environmental change, even if one is not physically evicted.
  *   **Community:** For the "build" side, this is often a rhetorical cover for exclusion (a "coded" term). For the "block" side, this is a genuine phenomenological reality (the experience of shared history).

  The verbal confusion is a symptom of the ontological split. Progress cannot be made by agreeing on definitions, because the definitions are tied to the underlying worldview. However, progress *can* be made by acknowledging that the terms are doing different work.

  ### 4. Is there a hidden empirical question?
  No. There is no "elasticity of supply" or "rate of filtering" that, if settled, would dissolve the conflict.

  The "block" side's residual objection to your market mechanism proves this. Even if you proved conclusively that upzoning would lower regional rents by 20% without displacing a single existing tenant, the "market is the insult" crowd would still object. They object to the *principle* of subjecting the neighborhood to the volatility of capital, not just the *outcome* of that subjection.

  Conversely, even if you proved that filtering never works and upzoning only enriches landlords, the "build" side would likely shift to arguments about civil rights, segregation, and the immorality of exclusionary zoning, rather than conceding the point.

  The empirical claims are **fortifications**, not foundations. Each side uses data to defend their ontological position, but the data does not generate the position.

  ### 5. What would count as progress?
  Since the disagreement is ontological and normative, technocratic progress (better models, better data) is insufficient. Progress requires **institutional differentiation**.

  You need a design that acknowledges the validity of both ontologies without forcing one to collapse into the other. Your transferable rights idea failed because it tried to monetize the social. A successful design would separate the **right to stay** from the **right to speculate**.

  *   **Distinguish Tenure from Property:** Much of the "block" energy comes from homeowners protecting asset values disguised as neighborhood character. Much of the "build" energy comes from renters needing security. If policy could guarantee *tenure security* (right to stay, rent stabilization, just-cause eviction) without guaranteeing *land value appreciation*, it might peel the "market insult" away from the "stability claim."
  *   **Separate the Scales:** Acknowledge that the "build" side is right about the *region* (we need regional housing targets) and the "block" side is right about the *block* (people need stability where they live). The conflict arises when regional needs are enforced via local disruption. Progress looks like institutions that meet regional quotas through means that minimize local rupture (e.g., public development on non-residential land, social housing that removes units from the speculative market entirely).
  *   **Change the Question:** Stop asking "Who has the right to decide?" (which implies a zero-sum veto) and ask "How do we share the burden of change?" Currently, the burden of regional growth falls entirely on specific neighborhoods. Progress implies spreading the burden (e.g., density is required everywhere, not just in 'sacrifice zones') or socializing the gain (e.g., land value taxes fund the community infrastructure that growth strains).

  ### 6. If no progress is expected, what does that imply?
  If you accept that the ontological split is irreconcilable—that one cannot simultaneously treat a neighborhood as a fungible market asset and a non-fungible social home—then the implication is that **housing policy is inherently tragic.**

  It implies that there is no equilibrium where both the "Right to Access" (the build side's core claim) and the "Right to Stay" (the block side's core claim) are fully satisfied. Satisfying one necessarily infringes on the other.

  This redefines the "Right to the City." It is not a single right that can be codified. It is a **political contest** between two legitimate but incompatible claims:
  1.  **The Claim of the Outsider:** The city is a common resource that should not be gated by those who arrived first.
  2.  **The Claim of the Insider:** The city is a home that should not be liquidated by those who do not live here.

  If this is true, the expectation of "solving" the housing crisis through policy optimization is a category error. The dispute is not a puzzle to be solved but a tension to be managed. It implies that democratic decision-making must remain messy and contentious, because the conflict is about the *kind of society* we live in, not just the *number of units* we build.

  The "market is the insult" objection is the clearest signal of this. It tells you that for a significant portion of the population, the city is not a marketplace. Until the "build" side acknowledges that efficiency is not the only good, and the "block" side acknowledges that stability cannot be built on exclusion, the argument will continue to look like one thing while actually being many. The progress lies not in winning the argument, but in disentangling the wires so we know exactly what we are fighting about.
