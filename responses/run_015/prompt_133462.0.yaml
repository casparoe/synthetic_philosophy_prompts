prompt: |-
  You are a professional philosopher specializing in collective memory, moral psychology, and the ethics of remembrance. Before you begin, spend a brief moment brainstorming the core conceptual distinction between treating remembrance as a civic moral bond and treating forgetting as a therapeutic social good. Then provide your explanation with its bottom line in the very first sentence, followed immediately by reasoning, with no preamble and without restating the question.

  Explain the conceptual tension between the view—associated with thinkers like Avishai Margalit—that shared remembering of historical atrocity creates a moral bond among citizens, and the view—associated with thinkers like Philip Rieff—that modern culture tends to dissolve the moral weight of the past through therapeutic forgetting. Apply this tension to the following specific scenario: a state memorial institution archives the identities of local civilian collaborators in a past atrocity but deliberately excludes those names from all public exhibitions, justifying the omission as necessary to prevent the transmission of intergenerational guilt to descendants who bear no direct responsibility. Analyze whether this practice of selective institutional concealment is best understood as a failure of the duty to remember, as a legitimate exercise of a right to forget, or as revealing a hidden conceptual asymmetry: that duties to remember may apply differently when the subjects being remembered are perpetrators rather than victims. Be precise about the conceptual mechanics; do not provide bibliographies, reading lists, or citations, and do not invoke highly specialized theories that require outside lookup.
