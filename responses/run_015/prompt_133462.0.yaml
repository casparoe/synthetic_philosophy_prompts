answer: |-
  The selective concealment of collaborator identities reveals a fundamental asymmetry in the ethics of remembrance, wherein the duty to remember victims sustains moral community while the suppression of perpetrator names serves a therapeutic function to protect social cohesion from the burden of inherited shame. This tension arises because the civic view treats memory as a constitutive obligation where sharing the past binds citizens to a common moral truth, whereas the therapeutic view treats memory as a psychological burden where forgetting facilitates social health by releasing the living from the pathologies of history. In the scenario provided, the state maintains the archive to preserve factual truth but suppresses public exhibition to manage the psychological welfare of the descendants, effectively prioritizing the therapeutic good of the living community over the civic bond of full disclosure. This cannot be straightforwardly categorized as a failure of the duty to remember, because the duty is not monolithic; it is conditioned by the moral status of the remembered subject. Remembering victims is an act of restitution that restores their standing within the moral community, making public remembrance essential to the civic bond. Conversely, remembering perpetrators is an act of accusation that risks fracturing the current community by implicating descendants in a shame they did not enact. The justification of preventing intergenerational guilt relies on a therapeutic logic that views knowledge of ancestral sin as a contaminant to psychological well-being, rather than a civic tool for accountability. Therefore, the practice is best understood as revealing a hidden conceptual asymmetry: the duty to remember is robust when directed toward victims to affirm their humanity, but becomes contingent and suppressible when directed toward collaborators to preserve the functional unity of the present society. This suggests that collective memory is not merely about preserving the past, but about negotiating which burdens of the past the present community is willing to carry, distinguishing between the moral necessity of honoring the dead and the social utility of shielding the living.
