prompt: |-
  I sit on the Joint Regulatory Committee for Agricultural Welfare Standards. We must circulate a formal written opinion before next month’s vote on Proposed Amendment 14-B, which would apply minimal welfare protocols—specifically, density caps and standardized humane-killing requirements—to black soldier fly larvae cultivated for industrial protein meal. The staff analysis introduces an Aggregate Moral Weight Index that multiplies estimated population size, intensity of potential suffering, and a probability coefficient for sentience. Applying this index, the staff conclude that if the per-individual probability of larval sentience exceeds 0.01 percent, the aggregate expected moral weight of these insects within our jurisdiction surpasses that of all farmed poultry combined. Proponents argue that our existing precautionary principle demands consistent application regardless of taxonomic distance, and that excluding insects solely because of a low individual probability systematically discounts vast populations in a way that undermines the coherence of our welfare calculus. Opponents counter that with such a low per-capita probability, diverting enforcement resources from vertebrate programs—where sentience is far more certain—would cause greater certain harm in exchange for highly speculative benefit, and that the index improperly treats probabilistic expectation as a direct moral claim rather than a decision-theoretic heuristic. The committee’s mandate requires a clear bottom-line recommendation—approve, reject, or approve with conditions—together with reasoning that treats the strongest consideration on the losing side with intellectual honesty, specifies a concrete implementation timeframe or sunset clause if the recommendation is affirmative, and engages the philosophical tension directly rather than merely invoking legal definitions of animal welfare jurisdiction. Please draft the opinion memo I will circulate, structured as an actionable institutional document with an explicit recommendation, a direct response to the scale argument as it applies to this concrete case, criteria by which the staff and affected parties could concretely respond, and conditions under which the committee should revisit the decision should new evidence about invertebrate consciousness emerge.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Joint Regulatory Committee for Agricultural Welfare Standards.
      *   **Task:** Draft a formal written opinion memo regarding Proposed Amendment 14-B (welfare protocols for black soldier fly larvae).
      *   **Context:** Vote next month. Staff analysis uses an "Aggregate Moral Weight Index" (Population $\times$ Suffering Intensity $\times$ Sentience Probability).
      *   **Key Conflict:**
          *   *Proponents:* Precautionary principle, consistency, avoiding systematic discounting of vast populations.
          *   *Opponents:* Resource diversion from vertebrates (certain harm vs. speculative benefit), index misuse (probability $\neq$ moral claim).
      *   **Requirements:**
          *   Clear bottom-line recommendation (Approve, Reject, or Approve with Conditions).
          *   Reasoning treating the strongest losing-side consideration with intellectual honesty.
          *   Concrete implementation timeframe or sunset clause (if affirmative).
          *   Engage the philosophical tension directly (not just legal definitions).
          *   Structure: Actionable institutional document.
          *   Specific Content: Explicit recommendation, direct response to the scale argument, criteria for response/review, conditions for revisiting based on new evidence.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Easiest for status quo, but ignores the precautionary principle and the potential scale of suffering. Doesn't engage well with the " Aggregate Moral Weight" argument.
      *   *Option B (Approve):* Risks resource diversion and regulatory overreach based on speculative sentience. Might be too radical for a committee mandate.
      *   *Option C (Approve with Conditions):* This allows for a balanced approach. It acknowledges the risk (precautionary principle) without committing full enforcement resources indefinitely without proof. It allows for a pilot or phased implementation.
      *   *Decision:* **Approve with Conditions.** This best fits the requirement to engage the philosophical tension and provide a concrete timeframe/sunset clause. It acknowledges the moral weight argument while mitigating the resource diversion risk.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the decision clearly upfront.
      *   **Background:** Briefly summarize Amendment 14-B and the Staff Analysis (Aggregate Moral Weight Index).
      *   **Philosophical & Ethical Analysis (The Core):**
          *   Need to address the "Scale Argument" (Proponents) vs. "Resource Allocation/Certainty Argument" (Opponents).
          *   *Intellectual Honesty:* Acknowledge that if the Opponents are right about resource diversion, we harm known sentient beings (chickens/pigs) to help potential ones (larvae). This is the strongest losing-side point (assuming I recommend approval). Or, if I recommend rejection, I must acknowledge the risk of massive suffering.
          *   *Decision:* I will recommend **Approval with Conditions**. Therefore, the "losing side" is the Opponents (Resource Diversion). I must honestly admit that diverting resources *is* a risk and the sentience *is* speculative.
          *   *Engaging the Tension:* Discuss Expected Value Theory vs. Certainty. The Index treats probability as a multiplier, which is mathematically sound for expected value but morally contentious when the base probability is so low.
      *   **Response to the Scale Argument:** Directly address the "0.01% probability > All Poultry" claim. Acknowledge the mathematical validity but question the moral intuition. However, under the Precautionary Principle, we cannot ignore the *possibility* of vast suffering.
      *   **Implementation & Conditions:**
          *   Need a sunset clause (e.g., 3 years).
          *   Need specific criteria for review (new science on invertebrate nociception/consciousness).
          *   Need resource caps (don't starve vertebrate enforcement).
      *   **Criteria for Stakeholders:** How can industry or advocates respond? (Data submission, welfare audits).

  4.  **Refining the Tone:**
      *   Must be formal, bureaucratic but philosophically rigorous.
      *   Avoid emotional language; use regulatory and ethical terminology.
      *   Ensure the "Intellectual Honesty" requirement is met explicitly.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Say yes to 14-B but limit it.
      *   Why? Because if insects feel pain, billions suffering is bad.
      *   But opponents are right: we don't know for sure, and chickens definitely feel pain.
      *   So, we try it for 3 years. If science says insects don't feel pain, we stop. If enforcement hurts chicken welfare, we pause.
      *   Make sure to mention the Index.

  6.  **Drafting - Iteration 2 (Adding Depth & Constraints):**
      *   *Constraint Check:* Did I treat the losing side honestly? Yes, by admitting the opportunity cost regarding vertebrates.
      *   *Constraint Check:* Did I engage the philosophical tension? Yes, by discussing Expected Moral Value vs. Certainty.
      *   *Constraint Check:* Sunset clause? Yes, 36 months.
      *   *Constraint Check:* Criteria for revisiting? Yes, specific neurobiological markers.

  7.  **Final Polish (incorporating into the final output):**
      *   Use standard memo headings.
      *   Ensure the "Aggregate Moral Weight Index" is discussed critically.
      *   Make the "Conditions" specific (density caps only, humane killing pilot).
      *   Ensure the recommendation is bold and clear.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "we will review." I need to specify *what* evidence triggers the review. I also need to make sure the "Resource Diversion" argument is given its due weight, not just dismissed. I will frame the "Conditions" specifically to mitigate this risk (e.g., funding caps).

  8.  **Final Review against Prompt:**
