  **TO:** All Faculty, Staff, and Stakeholders
  **RE:** Dissolution of Center for Truth and Verification; Establishment of Disquotation Desk
  **DATE:** October 24, 2023

  Following the periodic efficiency review, the University working group set up to review the review has voted unanimously to conclude that the Center for Truth and Verification (CTV) operates on a foundational category error. The review determined that truth is not a substantive property. Consequently, there is no nature of truth for the CTV to investigate, audit, or verify. Maintaining a unit to study a non-property constitutes a misallocation of resources. As Assistant Dean of Curriculum V. Orum stated, "We cannot audit a shadow." Effective immediately, the CTV is dissolved. Its functions are transferred to the newly formed Disquotation Desk (DD).

  **1. What is the remit of the Disquotation Desk?**
  The DD will review all university communications. Wherever a statement is labeled "true," the DD will delete the label and assert the statement directly. Calling a claim true adds nothing to just making the claim. Therefore, the evidence-audit unit is redundant. Resources previously allocated to fact-checking will be reallocated to groundskeeping, as verifying reality requires no specific ontological budget. The inference is straightforward: if there is no property to track, there is no need for trackers.

  **2. How will the DD handle generalizations, such as Handbook Clause 4.1 ("All policies in Section 4 are true")?**
  This presents a logistical adjustment. To eliminate "true," the DD must assert each policy in Section 4 individually. If Section 4 is amended, the DD must re-assert the list. Stakeholders should anticipate delays during catalog updates. We are exploring infinite conjunctions, but current printing contracts limit us to finite pages. Until resolved, Clause 4.1 will be suspended.

  **3. How do we endorse official statements without repeating them (e.g., "The President's statement is true")?**
  Blind endorsement is deprecated. To endorse the President, staff must repeat the President's statement. If the content is unknown, endorsement is impossible. The phrase "is true" functioned merely as a device of endorsement without content; going forward, content is required. If you do not know what was said, you cannot assert it. This ensures semantic hygiene, even if it impedes rapid administrative agreement.

  **4. Faculty objection: Isn't inquiry supposed to aim at truth? Does this not remove the norm of assertion?**
  Inquiry remains worth doing. However, aiming at truth is no more than aiming to assert only what is the case. There is no additional property called "truth" that serves as a target. The correctness standard is unchanged: assert p only if p. The removal of the property does not remove the practice. The CTV budget reduction reflects this redundancy. We are not saying inquiry is worthless; we are saying the target is not a thing you can aim at independently of the assertion itself. The normative force is preserved without the ontological commitment.

  **5. The Office of Existence and Office of Reference have noted that existence is just the quantifier and reference is just disquotation. Will they be dissolved?**
  The comparison is dismissed. Those offices handle substantive operational matters. The analogy is unhelpful. Proceed with current referencing protocols. Do not forward further queries on this matter.

  **6. Compliance Audit Note:**
  During self-review, the DD identified Clause 6 itself contains the sentence: "This compliance audit is true." Under current guidelines, "is true" must be deleted. This yields: "This compliance audit." This is not a sentence. Normally, we would analyze the property of truth here to resolve the status. However, since truth is not a property with a nature to be investigated, the DD has no tools to analyze this anomaly. The sentence will stand unanalyzed. The Center regrets any inconvenience.
