      *   **Audience:** Advanced undergraduate in a consciousness-and-suffering seminar.
      *   **Task:** Create a rigorous specification for a unit on pain asymbolia.
      *   **Structure:**
          1.  Brief conceptual brainstorming.
          2.  List of desiderata for any adequate theory of why pain is bad (given asymbolia).
          3.  For each desideratum: Motivating case/distinction, Status (Non-negotiable vs. Camp-specific), Internal Tension.
          4.  Coverage areas: Normal case, Asymbolic case, Sensory/Affective boundary, Neuroscientific consistency, 1st vs. 2nd order badness, Valued/sought pain, Phenomenal Transparency (niche framing).
          5.  Identify a pair of jointly unsatisfiable desiderata (the "hard problem" of this specific unit).
          6.  Score three approaches (Representationalist, Affective-Evaluative, Integrationist) against the list.
      *   **Constraints:** No citations, bibliographies, or literature reviews. Keep conceptual weight on criteria/conflicts.

  2.  **Conceptual Brainstorming (Step 1):**
      *   *Core Puzzle:* Pain usually hurts. Asymbolics feel pain (location, intensity) but don't mind it. Why is normal pain bad? Is "badness" a feeling (qualia) or a judgment (evaluation)?
      *   *Asymbolia:* Lesions often in insula/cingulate. Dissociates "ouch" from "get away."
      *   *Badness:* Is it intrinsic (phenomenal) or extrinsic (representational/functional)?
      *   *Transparency:* Usually, we look *through* the body to the world. Pain makes the body opaque. Asymbolics might not have this opacity.
      *   *Tension:* If we separate sensation and affect to explain asymbolia, how do we explain the unity of normal pain? If we unify them, how do we explain asymbolia?
      *   *Goal:* Create a checklist (desiderata) that forces students to grapple with these tensions.

  3.  **Drafting the Desiderata (Step 2):**
      *   *Requirement 1: The Normal Case (Intrinsic Badness).* Needs to explain why I avoid pain *because* it hurts, not just because it signals damage.
      *   *Requirement 2: The Asymbolic Case (Dissociation).* Needs to explain how sensation remains without the "bad" part. Is the "bad" part missing or disconnected?
      *   *Requirement 3: Sensory/Affective Boundary.* Must distinguish Q (quality) from V (valence) but explain their fusion.
      *   *Requirement 4: Neuroscientific Consistency.* Lateral (what/where) vs. Medial (ouch/motivation). Don't reify anatomy into philosophy too quickly.
      *   *Requirement 5: 1st vs. 2nd Order.* Is the suffering the pain itself or the thought about the pain? Asymbolics might lack the "suffering" but have the "sensation."
      *   *Requirement 6: Valued Pain.* Masochism/ritual. If pain is intrinsically bad, why seek it? Must distinguish context from phenomenology.
      *   *Requirement 7: Phenomenal Transparency.* The niche request. Pain usually breaks transparency. Asymbolia might preserve it. Theory must account for this shift in bodily awareness.

      *Refining the details for each:*
      *   *Status:* Which are must-haves vs. theory-dependent?
      *   *Tension:* Where does it pinch?

  4.  **Identifying the Jointly Unsatisfiable Pair (Step 3):**
      *   *Candidate:* The demand for *Phenomenal Unity* (Normal Case) vs. the demand for *Modular Dissociability* (Asymbolic Case).
      *   *Reasoning:* If pain is essentially a unified "hurtful sensation," asymbolia shouldn't exist (or should be blindness). If pain is essentially two separate tracks glued together, normal pain's unity becomes accidental/mysterious.
      *   *Selection:* Let's frame it as "The Inseparability Thesis" (Normal Phenomenology) vs. "The Dissociation Thesis" (Asymbolic Data).

  5.  **Scoring the Approaches (Step 4):**
      *   *Representationalism:* Pain represents damage. Badness is the imperative content. Good on neuroscience, struggles with asymbolia (do they represent damage but ignore it?) and transparency.
      *   *Affective-Evaluative:* Badness is a distinct affective layer. Good on asymbolia, struggles with unity (why do they feel like one thing?).
