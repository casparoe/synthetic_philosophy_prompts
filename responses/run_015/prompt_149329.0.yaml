prompt: |-
  You are a professional philosopher of language with expertise in metaphysics and vagueness. Before answering, please spend a moment outlining the central differences between Timothy Williamson's epistemicist view — that vague predicates have sharp boundaries that are merely unknown to us — and supervaluationist accounts, which treat vagueness as a failure of determinacy across admissible precisifications, and then consider how a cinematic narrative might dramatize that distinction rather than merely illustrating it.

  I am preparing material for an advanced seminar, and I want to read Ridley Scott's Blade Runner through precisely this debate. The film turns on the Voight-Kampff test, designed to detect replicants by measuring empathic-response latency, yet it deliberately leaves Deckard's own status ambiguous and gives Roy Batty — a replicant with an engineered four-year lifespan — a final monologue about memories that will be lost like tears in rain. Treat the film as a philosophical argument in images: does the test function as an epistemicist instrument that assumes a hidden sharp boundary between human and replicant, or do the narrative's gradations of memory, mortality, and emotional depth support a supervaluationist picture in which there is simply no fact of the matter about whether Deckard counts as human? Examine specific scenes — the administration of the test to Rachael, Batty's death, and the implanted-memory revelation — and say where the philosophical lens genuinely illuminates a character's choice or the film's moral urgency, and where the reading strains because the plot needs dramatic ambiguity rather than metaphysical indeterminacy. Be careful not to reduce the film to a sorites paradox made visible; instead, ask whether Blade Runner adds something that formal arguments about tolerance principles and borderline cases miss, perhaps about how the stakes of categorization feel when a being's right to exist depends on it. Do not provide citations or a bibliography; just give me the reading itself.
