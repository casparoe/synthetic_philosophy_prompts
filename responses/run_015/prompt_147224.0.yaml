answer: |-
  **Project Title:** Value-Neutral Impact via Counterfactual Dynamical Stability

  **Research Question**
  Can a side-effect avoidance penalty be formalized and implemented purely through counterfactual dynamical stability and causal boundary conditions, without explicit value specification or feature weighting?

  **Motivation: The Value Leakage Problem**
  Current low-impact AI methods (such as relative reachability or attainable utility preservation) attempt to penalize an agent for changing the state of the world too much. However, these approaches implicitly smuggle in human values at the boundary definition stage. To calculate a penalty, you must define:
  1.  **The State Space:** Which variables count? (e.g., Does the position of a dust mote count the same as the position of a vase?)
  2.  **The Baseline:** What is the "inaction" policy? (e.g., Does the agent stand still, or does it continue its previous trajectory?)

  Choosing which variables to track or how to define "inaction" requires a prior judgment about what matters. If you track everything equally, the agent is paralyzed by the butterfly effect. If you track only "important" things, you have already hardcoded values. This project tests your hypothesis: that we can bypass this by treating the world as a dynamical system and measuring whether the agent pushes the system out of its natural attractor basin, using counterfactuals to define the baseline.

  **Methodology**
  This is an empirical implementation project, not a literature review. We will build two distinct penalty models and test them in controlled toy environments to see if they function without manual value tuning.

  *   **Environment:** A modified GridWorld or simple 2D physics sandbox (e.g., PyGame) containing:
      *   A goal object (to motivate task completion).
      *   Disturbable objects (e.g., vases, doors, movable blocks).
      *   Background noise (e.g., moving dust particles or stochastic wind) to test if the agent ignores irrelevant dynamics.
  *   **Model A (Causal Closure):** The penalty is based on the divergence between the actual world trajectory and a counterfactual trajectory where the agent is removed (set to null action) at time *t*. We measure the distance in state space over a finite horizon.
  *   **Model B (Information-Flow Boundary):** The penalty is based on the information transfer across a causal boundary surrounding the agent. If the agent's actions increase the mutual information between the agent and distant state variables beyond the background noise level, a penalty is applied.
  *   **The "Zero Value" Test:** Crucially, neither model will be allowed to use feature weights. All state variables must be treated mathematically identically. We will observe if the mathematical structure alone distinguishes between "breaking a vase" and "moving air."

  **Why This Comparison?**
  Surveying the literature only tells us how others have failed to solve the value-loading problem. By implementing these two specific approaches, we isolate the variable of *boundary definition*. If Model A fails because the butterfly effect causes massive divergence even for trivial actions, we know dynamical stability alone is insufficient. If Model B fails because it requires defining which "flows" matter, we know information theory also hides values in the boundary cut. This provides a concrete negative or positive result rather than a theoretical opinion.

  **Success and Failure Criteria**
  *   **Success:** An agent trained with the penalty completes the primary task (e.g., reaches the goal) while avoiding obvious side effects (e.g., does not break the vase), *and* the penalty function requires no manual tuning of variable importance. The "boundary" is defined purely by physical or causal proximity, not semantic importance.
  *   **Failure:** The agent either becomes paralyzed (penalizes its own existence due to background noise) or causes side effects. More importantly, failure is defined as discovering that to make the system work, you must manually exclude certain variables (like dust) from the state space. This would prove that "causal boundaries" secretly encode value judgments about what counts as part of the system.

  **Scope and Timeline (8-10 Weeks, Part-Time)**
  *   **Weeks 1-2:** Setup. Build the toy environment. Ensure you can run a standard RL agent (like PPO or DQN) that solves the task without penalties.
  *   **Weeks 3-5:** Implementation of Model A. Code the counterfactual rollouts (simulating "agent removal"). Debug the divergence metric.
  *   **Weeks 6-7:** Implementation of Model B. Code the information-flow metric. Run initial tests.
  *   **Weeks 8-9:** Evaluation. Run ablation studies. Try to "break" the penalty by adding noise or changing object physics. Document where manual tuning becomes necessary.
  *   **Week 10:** Write-up. Summarize whether the "zero value" claim held up under implementation pressure.

  **Feasibility Note**
  Calculating true "attractor basins" is computationally expensive. For this scope, we will approximate this using finite-horizon trajectory divergence. This is sufficient to test the core hypothesis: does the math distinguish high-impact from low-impact actions without human help? If the approximation fails, the full theory is likely impractical for near-term safety anyway.
