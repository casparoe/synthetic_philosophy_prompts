answer: |-
  This is not two phenomena. It is one.

  The thing you are chasing is **Relational Equilibrium**.

  It is not a property of the glyphs themselves, but a property of the *system* they form. You are experiencing the failure of absolute measurement and the necessity of comparative perception. Here is the breakdown of what it is, why it behaves the way you describe, and where the edges lie.

  ### 1. The Mechanism: Comparative Perception
  Human vision does not read shapes in isolation; it reads them by measuring *difference*. When you look at a typeface, your brain does not measure the stem weight of the *n* in microns. It measures the stem weight of the *n* **against** the stem weight of the *h*, the *l*, and the *o*.

  *   **Belonging (Style):** This is the brain recognizing that the *relationships* between the glyphs are consistent. If the *a* and the *g* share a specific ratio of bowl-to-stem tension, they belong. When you redraw the *a*, you aren't changing the *a*; you are changing the **reference frame**. The *g* suddenly fits because the ruler you are measuring it against has shifted to match the *g*'s existing geometry.
  *   **Reading-as (Identity):** This is the brain recognizing that the *distinctions* between glyphs are preserved. An *a* is an *a* because it is sufficiently different from the *o* and the *e* within that specific system.

  These feel like different things because one is about **similarity** (belonging) and one is about **difference** (reading), but they are governed by the same mechanism: the stability of the network. If the network shifts, both similarity and difference shift with it.

  ### 2. Why Isolation Fails
  When you draw an *a* on a blank page, it stops reading as an *a* because you have removed the **Control Group**.

  In a finished alphabet, the *o* defines "curvature," the *n* defines "verticality," and the *e* defines "aperture." The *a* is interpreted *relative* to those definitions. In isolation, the brain has no priors. It doesn't know if the thick stem is a stylistic choice (high contrast) or a weight choice (bold), or if the weird terminal is a quirk of the letter or a quirk of the font. Without the neighbors to establish the rules of the universe, the *a* loses its semantic anchor. It becomes a shape, not a letter.

  ### 3. Defining the Edge: The Threshold of Distinction
  You asked about clearance: *How much weirdness is allowed before it clashes?*

  The edge is not a distance; it is a **threshold of distinction**.
  A letter can be pushed toward weirdness as long as the **signal-to-noise ratio** of its distinctive features remains higher than the **systemic variance** of the font.

  *   **Systemic Variance:** How much do the other letters wiggle? (e.g., in a quirky display font, the variance is high, so the *a* can be very weird).
  *   **Distinctive Features:** What makes an *a* an *a*? (Usually the top counter and the tail).

  If you push the *a* so far that its distinctive features overlap with the distinctive features of the *o* or *e* **within the context of this specific font's variance**, legibility breaks.
  *   **The Test:** If the eye has to pause to decide "is this an *a* or a weird *o*?", you have crossed the edge. The pause indicates the Relational Equilibrium has tipped into Ambiguity.

  ### 4. The "Different Project" Test
  You asked: *Is a letter clearly by the same designer but from a different project in the style?*

  This is the ultimate litmus test for Relational Equilibrium.
  *   **Same Style:** The letter shares the **constraints** of the original system (same x-height ratio, same contrast axis, same terminal logic), even if the shapes differ. It can be swapped into the alphabet, and the *other* letters wouldn't need to change to accommodate it.
  *   **Different Project:** The letter shares the **shapes** but not the **constraints**. It might have the same terminal angle, but if its internal white space (counterform) breathes at a different rate than the *o* and *n* of your current font, it will feel alien.

  If you drop a glyph from a different project into your alphabet and you feel the need to tweak the *neighbors* to make it fit, it is **not** in the style. Style is not a library of parts; it is a set of rules for how parts interact.

  ### 5. Why "Family Resemblance" and "Ductus" Fail
  *   **Family Resemblance** implies a loose collection of overlapping traits. It suggests there is no core logic. You are correctly sensing that there *is* a core logic. It's not that the letters look alike; it's that they obey the same physics.
  *   **Ductus** is about the history of the mark (how the pen moved). You can have perfect ductus and a broken font. Ductus generates the shapes, but Relational Equilibrium validates them.

  ### Summary Definition
  **Relational Equilibrium** is the state in which every glyph in a set defines the visual rules for every other glyph, such that identity is maintained through distinction, and style is maintained through consistency of constraint.

  **How to use this:**
  Stop drawing letters. Start drawing **relationships**.
  When the *g* looks wrong, do not look at the *g*. Look at the *a*, the *o*, and the *e*. Ask: "What rule have these three established that the *g* is violating?" Then either change the *g* to match the rule, or change the *a* and *e* to change the rule.

  The "fix" you experienced when redrawing the *a* was not magic. It was **re-calibrating the instrument**. You tuned the ruler so that the *g* finally measured correctly.
