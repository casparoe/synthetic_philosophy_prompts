  **MEMORANDUM**

  **TO:** University Student Conduct Appeals Board
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Appeal of Jordan (Graduate Research Misconduct)

  **Executive Summary**

  This memo addresses the appeal filed by Jordan, a graduate student expelled for data fabrication. Jordan's appeal challenges the legitimacy of expulsion on metaphysical grounds, arguing that because actions are causally determined, "just deserts" are illegitimate. They propose a sanction focused solely on forward-looking risk management (ethics training and monitoring). While Jordan's philosophical position warrants serious consideration, I recommend we **uphold the expulsion** under our current code. However, I simultaneously recommend that the Board **approve the pilot of the restorative integrity protocol** for future cases where the breach of trust is not fundamental. This approach maintains the necessary social practices of responsibility while integrating valid concerns about the punitive nature of our current framework.

  **The Philosophical Conflict**

  Jordan's appeal rests on a hard incompatibilist position (often associated with skeptics like Caruso). The core argument is that neuroscience and physics suggest our actions are the result of prior causes outside our ultimate control. If Jordan could not have done otherwise in a metaphysical sense, punishing them for "moral failure" is unjust. On this view, sanctions are only permissible if they function like quarantine: preventing future harm without assuming moral blame.

  The counter-argument (aligned with compatibilists like Dennett) is that moral responsibility is not a metaphysical mystery but a functional social technology. We hold agents responsible not because they are unmoved movers, but because doing so creates a system of expectations and reasons that allows complex cooperation—like scientific research—to function. To remove "desert" from the equation is to remove the feedback loop that allows agents to learn, adapt, and maintain trust.

  **Analysis of Jordan's Case**

  We must take Jordan's skepticism seriously. It is plausible that Jordan's decision to fabricate data was the product of immense pressure, cognitive biases, and environmental causation. If we treat expulsion purely as retribution—inflicting suffering because Jordan is "evil"—Jordan's objection holds weight. Retribution based on metaphysical free will is difficult to justify.

  However, rejecting expulsion based on this logic creates two critical problems:

  1.  **Epistemic Safety:** Even under a forward-looking "public health" model, expulsion may be the necessary quarantine. Science relies on epistemic trust. When a researcher fabricates data, they compromise the integrity of the record and the safety of any future work relying on their judgment. Monitoring and training assume the underlying capacity for integrity remains intact. In cases of deliberate fabrication, that capacity is arguably compromised to a degree where the risk to the scientific community remains too high for continued access, regardless of whether the act was "determined."
  2.  **The Integrity of the Practice:** Treating research misconduct solely as a public-health risk reduces the researcher to a vector of disease rather than an agent capable of norm-following. Paradoxically, this is more demeaning than holding them responsible. The Dennettian view suggests that treating Jordan as responsible respects their agency. It acknowledges that they are part of a community governed by norms that they had the capacity to understand and follow. Waiving these consequences undermines the normative structure that makes the degree meaningful.

  Therefore, while Jordan is correct that metaphysical desert is shaky, the practical necessity of maintaining the institution's integrity requires sanctions that reflect culpability. To do otherwise would degrade the value of the research produced here, harming the public we aim to serve.

  **Recommendation on Framework**

  While we must uphold the expulsion to maintain consistency and trust, Jordan's appeal highlights a genuine flaw in our current code. A system based exclusively on "moral culpability and proportionate desert" risks becoming rigid and overly punitive, ignoring the potential for rehabilitation where safety is not compromised.

  The proposed restorative integrity protocol offers a viable middle ground. It shifts the focus from *backward-looking blame* to *forward-looking repair*, without abandoning the concept of responsibility. It treats misconduct as a failure of systems and skills, not just character. This aligns with the strongest insights of the skepticism argument (we are products of our environment) without collapsing into the conclusion that no consequences are permissible.

  **Decision and Action Items**

  1.  **Deny Jordan's Appeal:** Uphold the expulsion. The breach of trust in this specific instance is fundamental. Restoring Jordan to the lab, even with monitoring, poses an unacceptable risk to the validity of future research and undermines the deterrent necessary to maintain community standards. The sanction is not justified by retribution, but by the necessity of protecting the scientific enterprise.
  2.  **Approve Framework Revision:** Recommend the administration pilot the restorative integrity protocol for future cases, specifically those involving negligence or minor procedural violations rather than deliberate fabrication. This allows us to incorporate forward-looking risk management where appropriate, satisfying the concern that our sanctions should be about safety and improvement, not just suffering.
  3.  **Update Language:** Begin drafting revisions to the student code to reflect that sanctions serve both to uphold community norms (responsibility) and to mitigate future risk (restoration), removing the exclusive reliance on "desert" language which invites the metaphysical challenges Jordan has raised.

  **Conclusion**

  We cannot operate the university on the premise that no one is responsible for their actions. To do so would collapse the social technology required for education and research. However, we can acknowledge that our reasons for holding people responsible are pragmatic, not metaphysical. We uphold Jordan's expulsion to protect the integrity of science, but we revise our framework to ensure future sanctions are constructive rather than purely punitive. This honors the truth in Jordan's skepticism without surrendering the tools we need to maintain a functional community.
