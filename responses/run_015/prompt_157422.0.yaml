prompt: |-
  me and a friend were argueing for hours last night about Dennett versus Caruso on just deserts and punishment—he's convinced nobody really deserves anything, it's all just forward-looking quarantine, and I kept pushing the Dennett line that moral responsibility is a kind of social technology we actually need. Anyway I'm on the university's student conduct appeals board and we have a meeting thursday about Jordan, a grad student expelled for fabricating data in a lab study. Jordan's appeal basically runs the Caruso play: neuroscience shows thier actions were causally determined, so expulsion as "just desert" is illegitimate, and they want it replaced with mandatory ethics training and monitored lab access. Our code currently requires sanctions reflecting "moral culpability and proportionate desert," but there's also a proposal floating around to pilot a restorative integrity protocol that treats research misconduct like a public-health risk instead of a moral failure. I need a memo recommending what we should actually do—uphold the expulsion, reduce it, or revise our framework—with clear reasoning, and I want you to take Jordan's skepticism seriously rather than dismissing it, but also give the strongest reply from the compatabilist/desert side. Don't cite books or ask for a bibliography, just reason it out. Write it in American English. I misspelled recieve earlier but you get the idea.
