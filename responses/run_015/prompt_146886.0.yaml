answer: |-
  That analogy about the writers' residencies is spot on. It cuts right to the heart of the tension: is support a reward for *output*, or an infrastructure for *existence*?

  You're asking about the philosophical "source code" running underneath an unconditional check. Since you want to separate what's settled from what's contested, let's break this down by the specific philosophical commitments you identified.

  ### 1. Moral Desert and the Labor-Income Link
  **The Settled View:**
  There is broad agreement among political philosophers that UBI explicitly rejects the principle of **strict contributive justice**. Contributive justice holds that distribution should be proportional to contribution (i.e., "you eat only if you work"). By decoupling income from labor, UBI presupposes that citizenship or personhood itself generates an entitlement to a share of social wealth, independent of market valuation.

  **The Contested View:**
  *Why* that entitlement exists is heavily debated.
  *   **The "Common Ownership" Argument:** Some argue UBI is a dividend on collectively owned assets (land, natural resources, inherited knowledge). This is a Left-Libertarian view. The logic is: we all own the earth equally; since private property excludes some from that ownership, rent/taxes are paid into a pool and distributed as UBI.
  *   **The "Real Freedom" Argument:** Others (like Philippe Van Parijs) argue justice isn't about ownership, but about **real liberty**. Formal rights (like free speech) are useless without the material means to exercise them. UBI maximizes the freedom of the least advantaged to say "no" to exploitative work.
  *   **The Counter-View:** Critics from the "Reciprocity" camp argue that UBI violates a duty of fairness. If everyone must work to sustain the system, taking from it without contributing is "free-riding." UBI defenders counter that care work, art, and community building *are* contributions, even if unpaid.

  **Verdict:** UBI presupposes that **access to survival is not conditional on market labor.** It does *not* necessarily presuppose that "need alone" creates entitlement (since the rich get it too); rather, it presupposes that **status** (citizenship) creates entitlement.

  ### 2. Luck Egalitarianism and Equality of Outcome
  **The Settled View:**
  Luck Egalitarianism holds that inequalities resulting from "brute luck" (being born poor, disabled, or in a bad region) are unjust, but inequalities resulting from "option luck" (choices, risks, effort) are acceptable.
  Strictly speaking, **UBI is a blunt instrument for Luck Egalitarians.** Because it gives money to the lucky (wealthy) and unlucky (poor) alike, it wastes resources on those who don't "need" it based on luck. A pure Luck Egalitarian would prefer targeted compensation for specific disadvantages.

  **The Contested View:**
  However, many Luck Egalitarians *do* defend UBI, but with a specific tweak to the logic. They argue that we cannot easily distinguish between brute luck and option luck in practice. (Is someone poor because they chose to study art, or because they lacked the safety net to take the risk?)
  *   **The Defense:** UBI can be defended as a proxy for equalizing access to **capital**. If everyone starts with a baseline of capital (the UBI), then subsequent inequalities are more likely to be the result of genuine choice rather than desperate necessity.
  *   **The Tension:** This does not require a commitment to full equality of *outcome*, only equality of *starting position*. So, yes, a Luck Egalitarian can defend UBI without demanding everyone ends up with the same bank balance, provided the UBI is viewed as a "starting grant" rather than an "equalizer."

  **Verdict:** UBI is not inherently a Luck Egalitarian policy, but it can be compatible with it if viewed as compensating for unequal access to capital rather than equalizing income outcomes.

  ### 3. Inheritance Tax vs. UBI (Property Rights)
  **The Settled View:**
  You noted a tension: taxing inheritance seems to respect labor-derived property (you earned it, but your kid didn't), while UBI seems to ignore labor (you get it regardless).
  Actually, these two are **philosophically compatible**, and often mutually reinforcing. Both policies rest on the idea that **birth circumstances should not dictate life chances.**
  *   **Inheritance Tax:** Limits the ability of parents to transmit unearned advantage (brute luck) to children.
  *   **UBI:** Mitigates the disadvantage of those born without such inheritance.

  **The Contested View:**
  The incompatibility only arises if you hold a **Lockean Libertarian** view of property rights. In that view, if I earned the money, I have an absolute right to dispose of it (including giving it to my kids), and the state taxing it is a violation of my self-ownership.
  *   **Compatibility:** If you view property rights as social conventions designed to maximize welfare (a Utilitarian or Rawlsian view), then both inheritance taxes and UBI are tools to ensure the system remains fair over generations. They both acknowledge that "earned income" is always partially a product of social infrastructure (laws, markets, stability), so society has a claim on a portion of it to fund the baseline for the next generation.

  **Verdict:** They are compatible under any theory that views property rights as socially constructed rather than natural/absolute. They are incompatible only with strict Libertarianism.

  ### 4. Human Nature and Coercion
  **The Settled View:**
  Does UBI presuppose people won't work without coercion? **No.** In fact, it presupposes the opposite: that people *will* contribute, but that coercion is unnecessary for basic social participation.
  Empirical data from trials (Finland, Stockton, Canada) is relatively settled here: **Labor supply drops are marginal.** The primary reductions are among new parents (care work) and students (education). People generally don't stop working; they stop working *bad jobs*.

  **The Contested View:**
  The philosophical disagreement is about the **value of work**.
  *   **The Protestant Work Ethic View:** Work is inherently dignifying; idleness is corrosive. From this angle, UBI is risky because it might sever the moral tie between the individual and the community.
  *   **The Post-Work/Automation View:** Work is often alienating. UBI allows humans to pursue "higher" activities (like your writing workshop friends) or care work.
  *   **The Bargaining Power View:** This is the middle ground. UBI isn't about stopping work; it's about changing the *terms* of work. It presupposes that without a fallback option, workers are coerced into accepting exploitative conditions.

  **Verdict:** UBI does not assume humans are lazy. It assumes humans are **rationally responsive to incentives** and that without a safety net, the incentive is survival, not contribution.

  ### Summary of the Implicit Logic
  To answer your core question: An unconditional UBI does not primarily rest on "need." If it were about need, it would be means-tested.

  Instead, it rests on one of two philosophical premises:
  1.  **Shareholder Theory:** You are a shareholder in society's inherited wealth (technology, infrastructure, natural resources), and the UBI is your dividend. (This aligns with the inheritance tax logic).
  2.  **Status Theory:** You are a member of the political community, and membership entails a right to exist within it without begging. (This aligns with the writers' residency logic).

  **The Consensus:** It rejects the idea that survival must be earned through market labor.
  **The Contest:** Whether that rejection is justified by shared ownership of the earth, the requirements of true liberty, or the mitigation of the birth lottery.

  Your intuition about the residencies is the strongest philosophical argument for it: if we accept that artists need "room to think" to produce value that the market can't immediately price, UBI argues that *everyone* is potentially producing value that the market can't immediately price (care, community, innovation), and thus everyone deserves the residency.
