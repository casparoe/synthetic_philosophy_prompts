answer: |-
  Bottom line
  My credence is 0.22. The Kelly criterion relies on compounding a reusable resource (capital) over infinite horizons, whereas epistemic updating aims at accurate representation using evidence, lacking both a wagerable stake that compounds and a utility function defined by growth rates.

  Decomposition
  (a) I assign a 0.35 probability that geometric growth is the right target for epistemic goals. Epistemic utility functions (like log scores) are typically bounded between 0 and 1 or negative infinity and 0; they measure closeness to truth, not accumulative wealth. Maximizing the *rate* of score increase implies an infinite horizon of compounding "truth capital," which doesn't exist in standard epistemology where the goal is simply to maximize expected accuracy at any given time, not the growth rate of accuracy over time.

  (b) I assign a 0.40 probability that there is a coherent 'stake' in this context. In Kelly betting, you wager money that you can lose (ruin) or win (compound). In belief updating, credence is a state variable, not a resource you spend to buy more credence. You cannot go "bankrupt" on beliefs in the same way you can with money, and updating based on evidence is not structurally identical to reinvesting winnings. Without a mechanism for ruin and compounding, the Kelly derivation loses its mathematical footing.

  (c) I assign a 0.30 probability that nested uncertainty about the payoff function allows for a Kelly derivation. Kelly requires a known edge and known odds to calculate the optimal fraction. If the agent is uncertain about the utility function itself (e.g., whether to maximize log score or geometric mean), the optimization problem becomes ill-defined because the "payoff" is variable. This introduces a second-order uncertainty that typically collapses back into standard expected utility maximization rather than growth-optimal betting, destroying the specific Kelly advantage.

  (d) I assign a 0.60 probability that bounded agents can approximate the allocation. Even if the theory were sound, humans and LLMs lack the computational power to know the true state space or edge required for precise Kelly betting. However, fractional Kelly is robust to estimation errors, so agents could theoretically approximate a safe allocation. This is the most plausible component, but it matters little if the foundational premises (a and b) are false.

  I combine these by treating (a) and (b) as gatekeeping conditions; if either is false, the application fails fundamentally. Since I judge both to be unlikely (0.35 and 0.40), the joint probability is heavily suppressed regardless of the plausibility of (d). The final 0.22 reflects the slight possibility that an isomorphic mapping exists in information theory that I am overlooking, but the category error between capital and credence dominates the calculation.

  Sensitivity check
  Sub-question (a) is doing the most work in this evaluation. If geometric growth of an epistemic score were demonstrably the correct normative goal for rational agents—perhaps because it minimizes regret or maximizes truth-convergence speed in a specific environment—then the lack of a monetary stake (b) could be hand-waved as a metaphorical mapping. However, since standard epistemology prioritizes calibration and resolution over growth rates, the entire Kelly framework becomes a solution to a problem that doesn't exist in this domain. Changing my mind on whether "growth" is a valid epistemic virtue would shift my overall credence more than any other factor.

  What would change my mind
  A formal proof or empirical demonstration showing that agents who update their credences across competing normative frameworks using a Kelly-style growth rule converge to the truth significantly faster or more robustly than agents using standard Bayesian model averaging, specifically in environments with structural uncertainty about the payoff function. If you could show that Kelly-updating minimizes epistemic regret in a way that expected utility maximization does not, specifically when the utility function itself is unknown, I would substantially increase my credence.
