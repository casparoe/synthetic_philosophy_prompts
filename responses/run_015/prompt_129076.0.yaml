  **LEGACYBIND SERVICE AGREEMENT (v. 9.4)**

  **PREAMBLE**
  This Agreement constitutes a binding contract between the "Subscriber" (the Present-Stage Person) and the "Beneficiary" (the Future-Stage Person). By clicking "I Agree," the Subscriber acknowledges that personal identity is not a binary state but a matter of degree. The Subscriber and Beneficiary are treated as separate legal parties with potentially conflicting utility functions. LegacyBind acts as the escrow agent for preferences across time.

  **1. ONTOLOGICAL STATUS AND AGENCY**
  The Subscriber retains full authority over the Beneficiary's physical vessel, provided the Beneficiary retains sufficient cognitive capacity to understand the restriction. The Subscriber acknowledges that the Beneficiary may possess different desires due to neural degradation. However, the Subscriber's autonomous wishes at time T1 supersede the Beneficiary's qualia at time T2, provided the continuity threshold is met. The Beneficiary waives the right to claim "changed mind" unless such change results from external coercion rather than internal metabolic drift.

  **2. PSYCHOLOGICAL CONTINUITY THRESHOLD**
  This Agreement remains valid only so long as the Psychological Connectedness Coefficient (PCC) between Subscriber and Beneficiary remains ≥ 0.55.^1 LegacyBind reserves the right to administer cognitive assessments to determine PCC. Should dementia, trauma, or radical preference reversal reduce PCC below this threshold, the Beneficiary is deemed a legal stranger, and this contract is void. In such cases, care defaults to the Beneficiary's current immediate comfort, disregarding the Subscriber's prior directives.

  **3. NON-BRANCHING PROVISION**
  In the event of mind uploading, fission, or substrate transfer, only one instance may recieve^2 binding authority. If multiple copies exist simultaneously, all directives are nullified to prevent duplicate liability and metaphysical confusion. The Subscriber must designate a primary branch prior to upload. Any unauthorized copies created during backup procedures are considered null entities with no claim to the Subscriber's assets or bodily integrity.

  **4. TEMPORAL ARBITRATION**
  Disputes regarding preference satisfaction shall be settled by a Neutral Temporal Arbiter (NTA). The NTA will weigh the Subscriber's autonomous wishes against the Beneficiary's current suffering using a weighted hedonic calculus.^3 If the Beneficiary experiences pain exceeding the utility value of the Subscriber's autonomy, the NTA may override the directive. This ensures that the sum of welfare across time-slices is maximized, rather than privileging the past self arbitrarily.

  **5. ENFORCEMENT AND LIQUIDATED DAMAGES**
  If the Beneficiary refuses mandated care (e.g., refusal of a feeding tube contrary to Directive 4.B), liquidated damages equal to 150% of the care cost shall be deducted from the Beneficiary's estate. The Subscriber prioritizes their past preferences over the Beneficiary's current experiential state. LegacyBind is not liable for existential distress caused by the realization that the Beneficiary is merely a vessel for the Subscriber's dead hand control.

  ***

  **FOOTNOTES**

  ^1 *Metaphysical Note:* This threshold is derived from Parfitian reductionism. Since strict numerical identity does not hold over time, we rely on R-relations (psychological connectedness and continuity). A score below 0.55 suggests the Future-Stage Person is effectively a different human being wearing your skin.

  ^2 *Typo Note:* LegacyBind legal team is composed of humans, not uploads. Please disregard errors in orthography; they do not invalidate the contract under the Doctrine of Scrivener's Error.

  ^3 *Utilitarian Note:* We assume a discount rate of 3% per decade for future suffering. However, intense pain is weighted heavier than abstract preference satisfaction. The goal is global coherence, not tyranny of the past.
