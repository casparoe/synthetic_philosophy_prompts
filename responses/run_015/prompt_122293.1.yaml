  2. **Credence & Combination:** Credence in T: 0.75.
  *   P(Health/Work worsened) = 0.85. Justification: Skeletal record shows stature loss, dental caries, and zoonoses by the Bronze Age.
  *   P(Coercion increased) = 0.9. Justification: 3000 BCE Levant entails Early Bronze Age states, walls, and tribute, unlike egalitarian foraging.
  *   P(Buffering insufficient) = 0.7. Justification: Storage helps, but 3000 BCE evidence shows high inequality in access.
  *   Combination: Weighted average, not product. Terms are correlated (states cause coercion and health decline). Health and Coercion dominate because T explicitly lists them as criteria, whereas famine buffering is a mitigating factor.

  3. **Sensitivity:** Most sensitive to (c) Normative Weighting of Coercion. If coercion is valued lightly compared to calorie stability, T fails. A finding that 3000 BCE labor was voluntary or communal would move credence most, undermining the coercion term which is pivotal at this date.

  4. **Disagreement:** Lives in (c). You (0.6) weigh autonomy/health heavily; colleague (0.2) weighs survival/security heavily. Convergence: You must concede storage reduces mortality variance significantly; colleague must concede rigid hierarchy constitutes a profound harm comparable to physical decline. You likely view state formation as inherently coercive; they likely view it as protective.

  5. **New Data:** Credence rises to 0.85. Moves via (a). Infection load and stature variance confirm biological cost and hierarchy, overriding the null stress marker result. It sharpens the empirical case for "worse" health and inequality, strengthening the health/weighting terms.

  6. **Truth Value:** T lacks a determinate truth value. It conflates empirical deltas (health) with normative weights (is coercion worse than hunger?). Resolving T requires fixing a moral metric, not just archaeological data. Data can settle (a), but never (c). The constraint to ignore post-transition history forces focus on immediate welfare, but cannot resolve the value judgment inherent in "worse."
