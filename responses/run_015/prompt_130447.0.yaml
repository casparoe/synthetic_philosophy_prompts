answer: |-
  Here is the operational procedure you asked for. It is designed to be run in under 20 minutes, using the products you have, without needing to derive equations. It sidesteps the philosophy debate by focusing on *operational consequences*.

  Your friend is theoretically right that quantum noise is negligible at weather scales, but he is operationally wrong about the "uncertainty collapses" claim. In a chaotic system, running more ensemble members does not make the spread vanish; it makes the *probability distribution* stable, but the variance remains. You cannot forecast a specific trajectory indefinitely, no matter the compute. You are right: determinism $\neq$ predictability.

  Here is how you codify that distinction at the desk.

  ### The Duty Desk Decision Procedure

  Run these checks in order. Stop at the first "Action" box.

  **Input Data:**
  1.  **Primary Ensemble:** Your centre's spread (e.g., 50 members).
  2.  **Secondary Model:** Deterministic or small ensemble from a different centre.
  3.  **Verification:** Yesterday's forecast error vs. yesterday's ensemble spread.
  4.  **Nudge Test:** One extra run where you perturb initial soil moisture/rainfall by $\pm$ observation error.

  ---

  #### Step 1: The Decision Robustness Check (Bucket D)
  *Question:* Do **all** ensemble members (and the secondary model) exceed the action threshold (e.g., road flood depth, levee crest)?
  *   **Yes:** Uncertainty is decision-irrelevant.
      *   **Action:** Issue warning/closure. State confidence as "High" regardless of spread width.
      *   **Bulletin:** "Flooding is expected. Exact depth varies, but threshold exceedance is certain across all scenarios."
  *   **No:** Proceed to Step 2.

  #### Step 2: The Structural Consistency Check (Bucket C)
  *Question:* Does the Secondary Model cluster lie *outside* the Primary Ensemble spread? OR Is Yesterday's Error > Yesterday's Spread?
  *   **Yes:** This is Model/Structural Uncertainty. The physics or parameterization is likely wrong, not just the starting state.
      *   **Action:** Do not issue a definitive warning based on magnitude. Escalate to Duty Manager.
      *   **Bulletin:** "Models disagree on magnitude. Risk is elevated, but timing/depth is uncertain due to model limitations."
  *   **No:** Proceed to Step 3.

  #### Step 3: The Chaos/Growth Check (Bucket B)
  *Question:* Did the **Nudge Test** diverge from the control run by more than 20% of the action threshold? OR Does the ensemble spread grow exponentially with lead time (double every 2-3 days)?
  *   **Yes:** This is Irreducible (Chaotic) Uncertainty. Better observations will not fix this.
      *   **Action:** Issue Probabilistic Warning. Do not average the members.
      *   **Bulletin:** "There is a [X]% chance of exceeding thresholds. Small changes in current conditions lead to large differences in outcome."
  *   **No:** Proceed to Step 4.

  #### Step 4: The Observation Check (Bucket A)
  *Question:* Is the Ensemble Spread narrow, but centered away from current observations? (i.e., The model is confident but wrong about the current state).
  *   **Yes:** This is Reducible (Initial Condition) Uncertainty.
      *   **Action:** Hold warning. Request updated telemetry/sensor check. Re-run analysis if time permits.
      *   **Bulletin:** "Monitoring closely. Current data suggests lower risk, but model indicates potential rapid change."
  *   **No:** (Rare case: Low spread, matches obs, below threshold).
      *   **Action:** No action.

  ---

  ### Escalation Rules (When to hand to Human)
  The procedure stops at "Escalate" in Step 2, but you must also escalate for **Value Judgments**. The math cannot tell you the cost of a false alarm vs. a missed event.
  *   **Escalate if:** Probability is 30-60% *and* the cost of evacuation is high (e.g., closing a major highway vs. a minor road).
  *   **Escalate if:** The consequence is catastrophic (levee failure) even if probability is low (<10%).
  *   **Do not escalate if:** The action is low-cost (e.g., pre-positioning sandbags) and probability is >50%.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: The 48-Hour Levee Split
  *   **Situation:** 48h out. Rainfall agrees. Ensemble splits 50/50 on overtopping.
  *   **Step 1 (Robustness):** Fail. Not all members exceed threshold.
  *   **Step 2 (Structure):** Check Secondary Model. If Secondary Model agrees with the "Safe" cluster, you have Structural Uncertainty. If Secondary Model also splits, it's likely chaotic bifurcation (Bucket B).
  *   **Step 3 (Chaos):** Run Nudge Test. If perturbing soil moisture by 5% flips the outcome from "Safe" to "Breach," you are in the chaotic regime.
  *   **Verdict:** This is **Bucket B (Irreducible)**. You cannot "wait for better data" to fix this; the system is sensitive.
  *   **Action:** Escalate to Duty Manager. Do not average the 50% to "maybe."
  *   **Bulletin Wording:** "There is a significant risk of overtopping. Approximately half of our plausible scenarios result in failure. Preparations should proceed as if the event will occur." (Shift the burden of preparedness without guaranteeing the breach).

  #### Case 2: The Three-Month Seasonal Outlook
  *   **Situation:** "Wetter than average" quarterly bulletin. Farmers/Insurers acting on it.
  *   **Step 1 (Robustness):** Fail. It's a probability tilt, not a deterministic event.
  *   **Step 2 (Structure):** **Critical Fail.** Seasonal models are not weather models. They are coupled ocean-atmosphere systems with massive structural uncertainty. Yesterday's error stats are meaningless (you can't verify a 3-month forecast daily).
  *   **Step 3 (Chaos):** Irrelevant. Predictability horizon for weather is ~14 days. Anything beyond is climate statistics, not trajectory forecasting.
  *   **Verdict:** **Procedure Stop.** This is not a forecast in the same sense as Case 1 or 3. Your friend's "determinism" argument is completely irrelevant here; this is statistical climatology.
  *   **Action:** You need to change the template. You are currently overclaiming.
  *   **Bulletin Wording:** Change "Forecast" to "Outlook." Change "Wetter" to "Increased odds of wetter conditions." Add disclaimer: "This indicates a statistical tendency, not a specific weather event. Do not use for immediate operational decisions."
  *   **Defensibility:** If a farmer sues because it was dry, you defend by showing this was sold as a *probability tilt*, not a *prediction*. If you call it a forecast, you will lose.

  #### Case 3: The Six-Hour Road Closure
  *   **Situation:** 6h out. Spread is wide (10cm to 50cm depth). Threshold is 5cm.
  *   **Step 1 (Robustness):** **Pass.** All members > 5cm.
  *   **Verdict:** **Bucket D (Decision-Robust).** The uncertainty is real, but it does not change the decision.
  *   **Action:** Close the road. Sign off confidently.
  *   **Bulletin Wording:** "Road closure required. Water depths vary between 10cm and 50cm in model scenarios, but all scenarios indicate impassable conditions."
  *   **Defensibility:** If an inquiry asks why you closed it when it only flooded to 10cm, you show the ensemble. "The minimum predicted depth was double the safety threshold. We acted on the worst-case of a high-confidence set."

  ---

  ### Limitations and Failure Modes

  The procedure assumes the system is **stationary** (the past behaves like the future). It will misfire in these specific cases:

  1.  **Non-Stationarity (New Development):** If a new housing estate paved over a floodplain last month, your "Yesterday's Error" stats are wrong. The catchment responds faster now.
      *   *Fix:* If you know of land-use changes, manually override Step 2. Assume Model Error is high.
  2.  **Infrastructure Failure:** A levee breach is not a hydrological event; it's a structural one. Your model assumes the levee holds.
      *   *Fix:* Never use this procedure for "Will the levee break?" Use it for "Will water reach the levee?" The breach decision is engineering, not meteorology. Escalate immediately.
  3.  **Black Swan Inputs:** If the rain is caused by a phenomenon the model doesn't resolve (e.g., localized convection smaller than grid size), the Ensemble will be narrow and wrong (Bucket A behavior, but actually Bucket C).
      *   *Fix:* If radar shows storms forming that the model doesn't see, ignore the model. Trust the obs.

  ### Summary for the Inquiry
  If you are ever in an inquiry a year later, your defense rests on three phrases derived from this procedure:
  1.  **"Decision Robustness":** We acted because all plausible scenarios demanded it (Case 3).
  2.  **"Irreducible Uncertainty":** We warned of risk rather than certainty because the system was sensitive to initial conditions (Case 1).
  3.  **"Probabilistic Guidance":** We did not promise a specific outcome for long-range outlooks (Case 2).

  Your friend's argument about quantum noise is a distraction. At your scale, the "noise" is turbulence and unresolved convection. The practical limit isn't Heisenberg; it's Lyapunov. You don't need to prove him wrong on physics to be right on the desk. You just need to show that **spread does not collapse with compute**, and that **action depends on the distribution, not the mean.**

  Keep the "Nudge Test." It is the operational proxy for "Are we in the predictable window?" If a small nudge changes the decision, you are not in the predictable window. Treat it as chaotic.
