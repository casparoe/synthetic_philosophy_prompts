  9.  **Final Polish:** Check against all constraints (no links, defensible wording, specific cases). Ensure the distinction between "uncertainty in the weather" and "uncertainty in the decision" is clear. (Proceed to generate output).

  *(Self-Correction on the "Friend's Physics"):* I need to be careful not to validate the friend too much. He said "run a big enough ensemble and uncertainty collapses." That is *false* for chaotic systems. The uncertainty doesn't collapse; the *probability distribution* converges, but the variance remains (climate vs weather). I need to make sure the user has the ammo to know *why* he's right operationally, even if he felt he lost the physics argument. The key is: Converging on the *PDF* is not the same as converging on a *single trajectory*.

  *(Refining the Nudge Test):* The user calls it "perturb today's input by about observation error." This is effectively checking the local Lyapunov exponent. If small changes = big outcome changes, you're in the chaotic regime. I will endorse this but define the threshold simply.

  *(Refining the Seasonal Case):* This is the most dangerous one legally. If a farmer plants based on "wetter than average" and it's dry, can they sue? The bulletin wording is critical here. It must be "probabilistic tendency," not "forecast."

  *(Refining the Road Case):* This is the "win." If the decision is robust, issue the warning confidently despite the spread. This validates the user's intuition that "models don't agree" isn't always a reason to inaction.

  *(Final check on limitations):* Non-stationarity is the big one. Levees fail, land use changes. The procedure assumes the system is stationary. I must highlight this.

