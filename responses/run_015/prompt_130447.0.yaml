      *   **Task:** Needs a practical, actionable decision procedure to handle forecast uncertainty during morning briefings.
      *   **Constraints:** 20-minute window, 3-4 staff (undergrad level physics/geog), must be defensible in an inquiry, no complex math/derivations, no external references.
      *   **Conflict:** Had an argument with a physicist friend about determinism vs. predictability vs. quantum noise. User knows the friend is theoretically right but practically wrong for *operational forecasting*.
      *   **Goal:** Distinguish between different types of uncertainty (initial condition vs. model structure vs. decision-irrelevant spread) and map them to specific actions (warn, don't warn, escalate, reword).
      *   **Specific Requests:**
          1.  A step-by-step decision procedure (question order).
          2.  Observable signatures for each uncertainty bucket (using existing ensemble/model products).
          3.  Validation of the "nudge test."
          4.  Criteria for stopping vs. escalating to human judgment (values).
