  **The Paragraph**

  The committee sat around the polished table, the files for Dr. Aris and Dr. Bas open before them. Everyone agreed on the facts: Aris had conceived the core algorithm and written the critical code, contributing an estimated forty percent of the intellectual labor, but due to a consortium agreement limiting author slots, she was listed only in the acknowledgments. Bas had contributed thirty-five percent, managing the data integration, and was listed as the ninth author. Everyone agreed Aris's work was the more difficult intellectual feat relative to her training. Yet the prize guidelines, printed on the first page of every application, stated unequivocally: "Eligibility is restricted to named authors on the published manuscript." The chair tapped the rule. To waive it for Aris would be to admit that the public record is negotiable, forcing future candidates to guess whether behind-the-scenes evidence might override the byline. They voted for Bas. The rule held. The desert did not.

  ***

  **The Two Principles**

  1.  **The Desert Principle:** Credit is due in proportion to the actual causal contribution an agent makes to a valuable outcome, adjusted for the difficulty of the opportunities and constraints they faced.
  2.  **The Allocative Principle:** Credit is assigned according to standardized, publicly verifiable markers of contribution that candidates can identify in advance and audit afterwards, even when these markers diverge from actual contribution in specific cases.

  ***

  **Step-by-Step Walkthrough**

  *   **Why the Desert Principle awards A:** The principle looks backward at the actual labor and insight provided. Aris contributed 40% of the value versus Bas's 35%, and she did so under the constraint of limited authorship slots, requiring her to work without the promise of formal credit. Her baseline effort was higher. Therefore, she deserves the credit.
  *   **Why the Allocative Principle awards B:** The allocator aims to track desert but is bound by the need for legibility. The rule ("Must be a named author") is a proxy for contribution that is publicly verifiable. The committee knows Aris contributed more, but they cannot use that private knowledge without violating the Publicity Condition. If they make an exception, the rule effectively becomes "Must be a named author OR deemed worthy by the committee." Future candidates cannot know in advance what counts as "deemed worthy," nor can they check afterwards if the rule was applied consistently. To preserve the system's legibility, the allocator must follow the public marker (authorship) even when it mismatches the private fact (contribution). Bas satisfies the public marker; Aris does not.

  ***

  **The Single Feature and The Variant**

  The feature doing the work is the **reliance on a constitutive public record** (the author list) rather than a private assessment of fact. The divergence exists because the institution treats the public record as the *source* of credit, not just evidence of it.

  **The Variant:** Change the rule to: "Eligibility requires named authorship OR submitted evidence of equivalent contribution verified by the committee."
  **Result:** The divergence collapses. The committee verifies Aris's code logs and awards her the prize.
  **What this shows:** This collapses into the familiar problem where institutions merely see proxies for what they value. In the original case, the institution is *not* using authorship as a proxy it hopes matches reality; it is using authorship as a constitutive rule to maintain the legibility of the credit system itself. The variant proves that the divergence in the original case is not due to ignorance (measurement failure) but is a structural cost of maintaining a public system.

  ***

  **The Strongest Attack and The Answer**

  **Attack:** A desert theorist would argue that an institution distributing credit while knowingly ignoring the most deserving candidate is morally corrupt, regardless of its procedural rules. By prioritizing administrative legibility over actual merit, the committee becomes a bureaucracy that simulates justice rather than serving it, rendering the prize meaningless to those who understand the truth.

  **Answer:** The answer is that science is a cooperative coordination problem, not just a moral ledger. If credit assignments are not legible and stable, collaboration fractures because partners cannot predict how labor will be recognized. The "tax" on Aris's desert is the premium paid for a system where everyone else can trust the rules without needing insider knowledge. The prize remains meaningful because it reinforces the norm that public records matter, which protects future scientists from opaque disputes over who did what.

  ***

  **Generalization**

  This is a structural feature of allocating credit as such, not an artefact of this specific prize. Any system that distributes social goods (credit, funding, status) must rely on signals that are cheaper to verify than the underlying reality they represent. As long as the verification cost of "true desert" is higher than the verification cost of "public markers," and legibility is required for fairness, there will always be a gap between what is deserved and what is allocated. You can lean on this in your closing section: the machinery of merit cannot track merit perfectly without ceasing to be a public machinery.

  ***

  **Subheading**

  The rule was public, the facts were known, and the most deserving scientist lost.
