answer: |-
  The lab lights were dimmed, save for the glow of the preregistration portal on Mara Vos's screen. The clock read 2:17 AM.

  "If we submit this without a training phase," Mara said, her fingers hovering over the keyboard, "we are guaranteeing noise. You want to teach them micro-phenomenological bracketing before the first trial? That changes the cognitive architecture we're trying to measure."

  Idris Kale leaned against the doorframe, arms crossed. "It changes the *narrative* architecture, Mara. Not the perception. If we don't train them to withhold interpretation, their verbal report isn't a description of experience; it's a story they tell themselves about what they *think* they should have seen. The 'grey flicker' isn't the experience; it's the default label for 'nothing I can name.'"

  Mara sighed, rubbing her temples. "Heterophenomenology treats the utterance as a text regardless of its truth value. Whether it's a story or a description, it's data about the subject's stance."

  "But you're using the verbal report to define conscious access in the control condition," Idris countered. "If the verbal report is contaminated by folk psychology, then your baseline for 'unconscious' is flawed. You're measuring their vocabulary, not their consciousness."

  Mara paused. She looked at the draft protocol where the open-ended microphone report was listed as the primary verification for null perception. "You're arguing that the debriefing utterance is less reliable than the button press."

  "I'm arguing it's the most contaminated measurement in the study," Idris said. "The tracing bypasses concepts. The hand knows the shape even if the voice doesn't have the word."

  Mara turned back to the screen. "If I include the training phase, the reviewers will say we're inducing demand characteristics. But..." She hesitated. "If we treat all reports as equally authoritative texts, we ignore the mechanism of report generation. You're right that the untrained verbal report is heavily laden with expectation. I'll concede that. For the purposes of this preregistration, we will acknowledge that the initial verbal report is likely a post-hoc rationalization rather than a direct readout."

  Idris nodded slowly. "That costs you, doesn't it? Treating one text as more contaminated than another undermines the neutral stance."

  "It costs me precision," Mara corrected. "But it gains us validity. So, the tracing. You want to preregister the tracing correlation (r = 0.6) as evidence of conscious perception."

  "As evidence of information access," Idris said. "Whether that access is 'conscious' is what we're testing. The tracing is a behavioral output, yes, but it's coupled to the visual processing in a way the 4AFC button press isn't. The button press forces a concept; the tracing allows a gesture."

  "But if we call the tracing a 'report of experience,' we're begging the question," Mara said. "It's motor behavior. If we define consciousness by successful motor output, we're behaviorists."

  "Then don't call it a report," Idris said. "Call it a non-conceptual channel. The dissociation is the finding. High tracing correlation coupled with low verbal confidence."

  "Fine. But then we have the three-week follow-up." Mara pulled up the second session protocol. "Participants see their own tracing and say, 'I saw that shape, I just had no word for it.' You want to include this as valid phenomenological data."

  Idris straightened up. "It's retrospective elicitation. The tracing acts as a cue to unlock the pre-reflective memory. It validates that the experience was there, just unnamable."

  "It validates that they believe the tracing is accurate," Mara said sharply. "Three weeks later, the memory of the qualia is gone. What remains is the artifact. When they say 'I saw that,' they are judging the drawing, not recalling the flicker. They are inferring experience from behavior."

  Idris opened his mouth, then closed it. He walked over to the desk, looking at the protocol draft. "You're saying the utterance is about the object on the tablet, not the object in the mind."

  "Exactly. It's a judgment about the tracing's plausibility," Mara said. "If you include this as evidence of prior consciousness, you're allowing memory reconstruction to count as phenomenological data. That violates your own discipline. You require rigorous epoché. This is confabulation."

  Idris was silent for a long moment. "If I concede that the three-week utterance is a judgment about the artifact rather than a memory of the experience, I lose the longitudinal claim."

  "You lose the claim that the experience was *verbally recoverable*," Mara said. "You keep the claim that the information was processed. But you can't use their later words to prove their earlier consciousness."

  Idris exhaled. "Okay. I concede. The three-week statement is a judgment on the tracing's validity, not a direct report of the original qualia. We code it as 'retrospective attribution,' not 'phenomenological verification.'"

  "That costs you," Mara noted softly.

  "It costs me the narrative arc," Idris admitted. "But it keeps the method honest."

  "Then we're down to the primary outcome measure," Mara said, turning back to the keyboard. "The funder permits only one. We can't say 'Consciousness.' We can't say 'Report Accuracy.' We need an operational criterion that doesn't presuppose whether the tracing or the voice is the truth-teller."

  "If we choose verbal confidence," Idris said, "we assume consciousness is conceptual."

  "If we choose tracing correlation," Mara said, "we assume consciousness is motoric."

  "We need a dissociation metric," Idris proposed. "The primary outcome is the magnitude of the gap between tracing accuracy and verbal certainty. If consciousness requires global availability, the two should align. If it's fragmented, they won't."

  Mara typed slowly. "Operational criterion: 'Perceptual Dissociation Index.' Calculated as the standardized difference between tracing correlation coefficients and verbal confidence ratings across trials."

  "That works," Idris said. "It doesn't define consciousness. It defines the structural relationship between the channels."

  "But we have to state what a high index implies," Mara said. "If the index is high, what does that mean for the subject's state?"

  "It means the subject possesses visual information that is not available to their linguistic reporting mechanisms," Idris said. "Whether that information is 'conscious' depends on whether you think consciousness requires language."

  "And if I think it doesn't?" Mara asked.

  "Then the high index proves consciousness exists without verbal access," Idris said. "If you think it does, the high index proves the tracing is unconscious motor guidance."

  "So the data stays neutral," Mara said. "The interpretation remains theoretical."

  "That's all preregistration can do," Idris said. "Lock the data, leave the philosophy for the discussion section."

  Mara hit enter. The screen flashed green: *Draft Saved.* "We're assuming the training phase won't inflate the tracing correlation simply by making them attend harder."

  "Attention is part of the phenomenon," Idris said. "We aren't measuring passive reception. We're measuring accessible experience."

  "Accessible to whom?" Mara asked, standing up and stretching. "The hand or the voice?"

  "Exactly," Idris said, pushing off the doorframe. "That's why we need the Dissociation Index. Let the data tell us which one was in the room."

  Mara smiled tiredly. "Just make sure your training manual doesn't sound like hypnosis. The ethics board is already nervous."

  "And make sure your analysis doesn't treat the tracing as noise," Idris replied. "It's the only thing they couldn't lie about, even if they wanted to."

  "Goodnight, Idris."

  "Goodnight, Mara."
