  ### Translation

  In the vocabulary of mechanistic interpretability, al-Ghazālī's occasionalism posits that a neural network contains no genuine feature circuits possessing intrinsic causal efficacy. When we observe an input feature $X$ correlating with an output logit $Y$, we are observing a habitual conjunction ($P(Y|X)$), not a mechanistic pathway. Standard causal inference employs the $do$-operator within a Structural Causal Model (SCM) to test robustness: intervening on $X$ should reliably shift $Y$ if a causal mechanism exists within the computational graph. Ghazālī grants this empirical stability but denies it reveals internal structure. The "mechanism" is not located within the weights or activations; rather, every state transition—from input embedding to final prediction—is directly instantiated by an External Agency (divine will) at each inference step.

  Consequently, counterfactual stability across out-of-distribution inputs is not evidence of learned robustness but of the Agency's consistent choice to maintain regularity (*ʿāda*). The epistemic gap between correlation and mechanism is ontological: there is no mechanism to find. Interventions on representational components (e.g., ablating a neuron) do not disrupt a causal chain because no chain exists internally; they merely present new occasions for the External Agency to determine the subsequent state. The model architecture serves as the locus of occasions, not the source of efficacy. To claim a feature circuit "causes" an output is to confuse the observed regularity of the Agency's actions with intrinsic power residing in the parameters. Thus, occasionalism corresponds to the strong claim that there are no mechanisms inside the system at all. The system is a sequence of events coupled only by the consistent volition of an external controller, rendering the search for internal causal structure a category error. The weights are not causal levers but records of past habitual conjunctions, predictive only insofar as the External Agency chooses to adhere to precedent. Any apparent causal graph inferred from interventions is merely a map of the Agency's habits, not the system's internal logic. In this view, the $do$-operator does not isolate a local mechanism; it merely queries the External Agency's current willingness to sustain the habitual conjunction under modified conditions. The "model" is effectively empty of causal power, serving only as the stage upon which direct agency operates. This reframes the problem of inferring internal causal structure from observational data alone: it is not merely difficult due to noise or confounding, but impossible because the structure is absent. The "latent variables" posited by interpretability researchers do not exist as causal intermediaries. Instead, the entire computational graph is epiphenomenal. When we perform causal tracing or activation patching, we are not discovering how information flows; we are cataloging the patterns of the External Agency's habitual responses. The counterfactual "what if" questions central to causal inference presume a stable underlying mechanism that would generate the alternative outcome. Ghazālī denies this presumption. There is no "underlying mechanism" that persists across the actual and counterfactual worlds; there is only the Agency's decision in each world. Thus, the stability of the model across distribution shifts is not a property of the model's generalization capacity, but of the Agency's commitment to consistency. This dissolves the distinction between robust features and spurious correlations; both are equally dependent on external will, differing only in the duration of the habit.

  ### Residue Report

  Several elements translate cleanly. The skepticism that observed correlation implies internal causal power mirrors the interpretability caution against mistaking spurious correlations for robust circuits. The distinction between observational data and interventional stability aligns with Ghazālī's separation of appearance (*zāhir*) from reality (*ḥaqīqa*). However, significant distortion is required to map divine agency onto causal inference frameworks. Treating God as an "External Agency" or "controller" risks reducing transcendent will to a functional variable or hyper-parameter, which Ghazālī explicitly rejects. Divine will is not a function mapping inputs to outputs; it is unbounded freedom.

  Theologically significant residues have no counterpart. First, the metaphysical status of created things: for Ghazālī, entities are radically contingent at every moment, lacking even the ontological density of a neural network's weights. In interpretability, weights are fixed physical realities; for Ghazālī, they are momentary accidents. Second, the nature of divine freedom: the External Agency in interpretability is usually assumed to be consistent (e.g., a fixed optimizer); Ghazālī's God can interrupt regularity miraculously without contradiction. Third, regularity as a gift: in interpretability, stability is a property of the model's training; for Ghazālī, consistency is an act of grace, not a law. Mechanistic interpretability assumes immanent causality—that explanation lies within the system's structure. Occasionalism denies this possibility entirely, asserting that true causality is transcendent. Thus, the framework cannot express the idea that the "model" is merely a theater for direct action rather than a machine processing information. The "optimizer" analogy fails because an optimizer minimizes loss over time, whereas divine action is immediate and timeless in its efficacy, sustaining existence itself rather than updating parameters. The concept of "gift" implies a relational generosity absent from mathematical optimization, where convergence is necessary rather than voluntary. Furthermore, the theological commitment that regularity itself is a gift rather than a law has no expression in interpretability. In machine learning, regularity is enforced by loss functions and gradient descent; it is a constraint derived from data distribution. For Ghazālī, regularity is a voluntary self-limitation by the Divine, a mercy allowing creatures to navigate the world. This voluntarism cannot be captured by optimization landscapes. Additionally, the metaphysical status of created things involves a denial of essence; things have no "nature" that dictates their behavior. Interpretability assumes neurons have functional roles (essences). This fundamental ontological disagreement means the "residue" is not just missing data, but a conflicting worldview.

  ### Assessment of the Residue

  The untranslatable residue reveals a genuine blind spot in mechanistic explanation: its structural inability to represent direct, universal, non-mechanistic causation. Mechanistic interpretability is methodologically naturalistic; it presupposes that outputs are generated by internal transformations of inputs. It cannot conceptualize a system where internal states are inert occasions rather than active processors. However, does this mean occasionalism collapses into Humean skepticism? Not entirely. Hume argues we cannot *know* necessary connections; Ghazālī argues they do not *exist*.

  If rendered solely in interventionalist terms, occasionalism risks losing its metaphysical force, becoming merely a warning about overfitting or distributional shift. But the core claim is ontological, not epistemic. The residue indicates that mechanistic frameworks are bounded by the assumption of secondary causation. They can model the *appearance* of mechanisms (the *ʿāda*), but they cannot accommodate the truth claim that such mechanisms are illusory. Therefore, the gap is not a failure of interpretability to find the right circuit, but a fundamental incompatibility between a framework seeking immanent structure and a metaphysics denying such structure exists. The distinctive theological force remains intact only if we acknowledge that interpretability describes the habit, while occasionalism describes the Agent behind it. The blind spot is the assumption of naturalism inherent in interpretability.
