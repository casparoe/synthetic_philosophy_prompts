      *   **Burkean Conservatism:** Society is a partnership between past, present, and future. Institutions contain accumulated wisdom ("prejudice") that rationalism alone cannot replicate. Change should be gradual to avoid catastrophic failure.

  3.  **Translate to Network Engineering Vocabulary:**
