      *   **User:** Network Engineer.
      *   **Context:** Stuck on a committee deciding whether to remove a legacy routing layer.
      *   **Obsession:** Chesterton's Fence and Burkean Conservatism.
      *   **Task:**
          1.  Restate Burkean Conservatism and Chesterton's Fence using network engineering vocabulary (legacy protocols, dependency graphs, fault tolerance, technical debt, routing loops, backward compatibility, etc.).
