      *   *Voice:* Neutral, precise, technical.

      *(Self-Correction on Crux 1)*: Let's make sure the prediction is falsifiable. Realists say factor structure holds. Skeptics say it rotates.
      *(Self-Correction on Crux 2)*: Let's focus on "Issue Decoupling." Can you have high tax + social conservatism consistently? Realists say it's unstable tension. Skeptics say it's a valid stable state.

