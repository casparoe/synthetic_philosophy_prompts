              *   Dataset: Longitudinal data during a political realignment (e.g., US New Deal Coalition breakdown, or a specific European party system fragmentation).
              *   Realist Prediction: Even during realignment, underlying value dimensions remain stable; only party labels shift to accommodate them. The "embedding" stays rigid.
              *   Skeptic Prediction: The correlations themselves dissolve. Issues decouple (e.g., economic populism mixes with social conservatism), proving the "bundle" was maintained by elite signaling, not voter psychology.
          *   *Crux 3: The "Monolithic API" Test (Constraint/Coherence).*
              *   Case: A hypothetical or real attempt to form a coalition across the usual divide (e.g., Libertarian/Left alliance on civil liberties, or Populist/Right alliance on economics).
              *   Realist Prediction: These alliances are unstable and revert to the mean because they violate the underlying psychological manifold.
              *   Skeptic Prediction: These alliances are stable if institutional incentives align, proving the "incoherence" of the traditional bundle.

  3.  **Drafting - Section by Section:**

      *   *Header:* Needs to look like a formal collaboration doc. Title, Date, Signatories (Camp A/B).
      *   *Intro:* Brief context.
