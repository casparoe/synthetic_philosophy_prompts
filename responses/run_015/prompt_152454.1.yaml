prompt: |-
  hey im a backend engineer with basically zero formal philosophy background, but ive been arguing with coworkers about whether "left" and "right" are real categories or just a legacy taxonomy we inherited. i want you to draft the adversarial collaboration document that two opposing camps could both sign after arguing in good faith for a year.

  camp one: the dimensional realists. they think left-right maps onto a real low-dimensional manifold in human values — maybe equality vs hierarchy, or openness vs tradition — and that cross-cultural correlations prove its not just western noise.

  camp two: the bundle skeptics. they think left and right are incoherent legacy bundles, like a monolithic api that groups unrelated endpoints (tax policy, gender norms, immigration, foreign policy) that happen to covary in specific countries but have no deep coherence.

  write the joint statement. format it as:
  - a numbered agreed-claims section about political attitudes, survey measurement, and what actually needs explaining
  - a disagreements table with the exact divergence points, each phrased so its own side accepts the wording for thier position
  - the cruxes: sub-questions where settling them would move at least one side. i suspect one is whether stable cross-national correlation proves a real axis or just institutional path dependence. another is whether dimensionality reduction on value surveys produces something ontologically real or just a statistical artifact.
  - for each crux, name a concrete case or dataset both agree is relevent — like a specific country's political realignment, or value surveys from non-western populations where the usual bundle breaks — and record each camp's prediction in advance.

  make it in the weeds: separate verbal disputes from real ones, dont just say "they disagree about politics." dont ask for bibliographies, reading lists, or citations — a model without web access shouldnt have to guess at those. also dont invoke super obscure theorists nobody memorized; if you reference an actual argument, paraphrase it without quotation marks. inject some niche framing if it helps — the api/legacy-bundle metaphor is intentional, and feel free to treat political orientation like an embedding space if that sharpens the disagreement.
