prompt: |-
  I'm running the week-4 tutorials for a first-year metaphysics module — eight students, 50 minutes, whiteboard only, no handouts — and my topic is material constitution, the statue and the clay. Please don't explain the problem to me, I've taught it badly once already; what I need is a plan for how to get it into their heads in one session, and I need the plan to be about the order things come in rather than a list of views.

  Context on why last year went wrong: I opened with can two things be in the same place at the same time, half the group just flatly said no, and nothing moved for the rest of the hour. So I think I need to know what has to be built first so that the coincidence answer feels forced on them instead of sounding like a magic word I pulled out of a hat. Complicating it: about a third of the tutees are joint honours with computer science, and last time that contingent immediately reached for objects and instances and classes — the statue is just an instance of a type and the clay is the data, identity is pointer equality, you mutated it in place so obviously its the same object — and I never worked out whether to fight that or use it, so I'd definately like to know where each of those gets headed off or converted into something that helps.

  The other thing I can't settle is the carrying example. I'm happy for it to be the standard one where the statue and the lump each get their own proper name (Goliath and Lumpl? I think that's from a 70s paper, but I don't want to lean on it) except I keep wanting to spice it, and I've invented two candidates: (a) the clay gets fired in a kiln, so the matter isn't chemically the same stuff afterwards, which I hoped would stop them leaning on same matter as if it were obvious; (b) a 3D-printed figurine that gets melted down and reprinted from the same filament in the same shape every night, so the matter persists and the form recurs with a gap in between. I suspect (b) is a second puzzle smuggled in about persistence through gaps and I should drop it, but you tell me: what does the one carrier have to have, and what does it have to lack? I don't want anything in the example doing philosophical work I haven't earned yet, and I don't want the squash it into a ball move to look like a trick.

  So the deliverable: the sequence of pieces and the dependency structure (where Leibniz's law goes, where constitution vs identity vs it's one thing under two descriptions gets introduced, whether four-dimensionalism and mereological sums get a mention at this level or get openly refused); the one example and the case for it; the misconceptions in the order they'll actually form — the CS ones, the there must be a fact of the matter and we just don't know it one, the the statue is nothing but the clay arranged statuewise one — and the exact point in the sequence to defuse each; one question I can put to them at the end that separates someone who sees why the cheap answers fail from someone who's just memorised the slogan different persistence conditions; and what I should say out loud that I'm not going to get into today.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 50-minute tutorial plan for a first-year metaphysics module (Week 4).
      *   **Topic:** Material Constitution (Statue and Clay).
      *   **Constraints:** 8 students, whiteboard only, no handouts.
      *   **Goal:** Get the problem *into their heads* via a specific *order of operations*, not just a list of views.
      *   **Past Failure:** Opening with "Can two things be in the same place?" led to a flat "No" and stagnation. Need to make coincidence feel *forced*.
      *   **Student Demographic:** 1/3 are Joint Honours Computer Science (CS). They tend to jump to type/token, pointer equality, mutation. Need to know when to head this off or use it.
      *   **Example Dilemma:** Standard (Goliath/Lumpl) vs. Variant A (Kiln/Chemical change) vs. Variant B (3D Print/Melting/Reprint). Need to select the right carrier example based on what it must have/lack.
      *   **Deliverables:** Sequence/Dependency structure, Example selection & justification, Misconception mapping (when they arise & how to defuse), Final diagnostic question, "Out of Bounds" statement.

  2.  **Deconstruct the Pedagogical Problem:**
      *   *Why did it fail last time?* Starting with the conclusion (coincidence) invites intuitive rejection. Students rely on common sense ("Of course it's just one thing").
      *   *What needs to happen?* Students need to generate the *conflict* themselves. They need to commit to premises that logically entail a conclusion they find uncomfortable (coincidence or elimination).
      *   *The CS Angle:* CS students think in terms of implementation. `Statue s = new Statue(clay);`. If `clay` changes, does `s` change? They need to see that metaphysical identity isn't just memory address or mutable state.
      *   *The Example:* Needs to be simple enough not to distract, but robust enough to survive initial scrutiny.
          *   *Variant A (Kiln):* Introduces chemical change. This complicates "same matter." Might be too much for Week 4.
          *   *Variant B (3D Print):* Introduces temporal gaps and recreation. This is persistence over time, not just constitution at a time. Too complex.
          *   *Standard (Goliath/Lumpl):* Cleanest. Focuses purely on modal properties (what *could* happen to it).
      *   *Decision:* Stick to the Standard (Statue/Lump) but be precise about *when* they exist. Avoid the Kiln (chemical change distracts from modal profiles) and the 3D Print (temporal gaps distract from constitution at a time).

  3.  **Develop the Sequence (The "Dependency Structure"):**
      *   *Phase 1: Commitment.* Get them to agree on what exists and what properties things have. Don't ask about identity yet. Ask about survival conditions.
      *   *Phase 2: The Conflict.* Show that the Statue and the Lump have different survival conditions.
      *   *Phase 3: The Law.* Introduce Leibniz's Law (Indiscernibility of Identicals).
      *   *Phase 4: The Forced Choice.* Apply the Law to the Conflict. They must deny identity OR deny the Law OR deny the properties.
      *   *Phase 5: The CS Intervention.* Address the "pointer/type" intuition specifically here as a version of "One thing, two descriptions."
      *   *Phase 6: Resolution/Implication.* Briefly sketch the costs of the options (Coincidence vs. Elimination).

  4.  **Drafting the Plan - Step-by-Step:**

      *   **0-5 mins: Setup (The Object).** Draw the statue. Don't call it a statue yet. Call it "This." Ask: "If I squash this, does *This* survive?" (Gets them thinking about persistence conditions without using the word).
      *   **5-15 mins: Generating the Two Candidates.** Distinguish the *artefact* from the *matter*.
          *   Ask: "What is this made of?" (Clay).
          *   Ask: "If I squash it, is the clay gone?" (No).
          *   Ask: "If I squash it, is the statue gone?" (Yes).
          *   *Whiteboard:* List properties. Statue: Cannot survive squashing. Clay: Can survive squashing.
      *   **15-25 mins: The Logical Trap (Leibniz's Law).**
          *   Introduce LL: If $x = y$, $x$ and $y$ share all properties.
          *   Apply: Statue $\neq$ Clay.
          *   *The Intuitive Pushback:* "But they are in the same place!"
          *   *The Pivot:* "Okay, so either they are two things in one place, OR one of our premises is wrong."
      *   **25-35 mins: Handling the CS Intuition (The "Type/Instance" Move).**
          *   CS students will say: "It's the same memory, different variable." or "Statue is a class, Clay is the object."
          *   *Defuse:* Metaphysical identity isn't reference equality. It's about *what the thing is*. If the clay survives the squash and the statue doesn't, they track differently through modal space.
          *   *Concept:* "Constitution is not Identity."
      *   **35-45 mins: Evaluating the Costs.**
          *   Option 1: Coincidence (Two things, one place). Weird but saves LL.
          *   Option 2: Elimination (No statues, just clay). Saves space, kills common sense.
          *   Option 3: Deny LL (Very costly).
      *   **45-50 mins: The Diagnostic Question.**

  5.  **Refining the Example Choice:**
      *   *Why not Kiln?* Chemical change introduces "same matter" debates (Ship of Theseus vibes). We want *modal* difference, not *material* difference.
      *   *Why not 3D Print?* Temporal gaps introduce "intermittent existence." We want *synchronic* constitution primarily.
      *   *Verdict:* Use the Standard (Statue/Lump). It isolates the modal difference best. *Crucial:* Define the Lump's origin carefully (created at the same time as the statue) to avoid the "Lump existed before" objection which solves the problem too easily.

  6.  **Addressing Misconceptions & Timing:**
      *   *Misconception 1: "It's just one thing."* -> Addressed in Phase 2 by forcing different survival conditions.
      *   *Misconception 2: "CS Pointer/Type."* -> Addressed in Phase 4. Distinguish conceptual distinction from ontological distinction.
      *   *Misconception 3: "Epistemic humility (we just don't know)."* -> Addressed by emphasizing modal properties are determinate.
      *   *Misconception 4: "Squashing is a trick."* -> Addressed by defining the objects by their conditions, not the physical act.

  7.  **Final Diagnostic Question:**
      *   Needs to separate rote memorization from understanding the *pressure*.
      *   Good candidate: "If you say they are identical, which premise do you reject, and what do you lose?" OR "If you say they are distinct, what weird thing must you accept about this whiteboard space?"
      *   Better: "Imagine a world where the clay exists but the statue doesn't. Is that *this* world or a *different* world? If it's this world, what are you looking at?"

  8.  **What to Exclude (Out of Bounds):**
      *   Temporal parts (4Dism) - too technical for Week 4 intro.
      *   Mereological Universalism - distracts from constitution.
      *   Vague Identity - keeps it clean.

  9.  **Review against Constraints:**
      *   Whiteboard only? Yes, rely on drawing and lists.
      *   Order focused? Yes, the plan is a sequence of commitments.
      *   CS students handled? Yes, specific intervention point.
      *   Example chosen? Standard, with justification.

  10. **Final Polish:** Ensure the tone is practical for a tutor. Emphasize *silence* and *waiting* for them to feel the tension. (Self-Correction: Make sure the CS intervention doesn't dominate. It should be a specific deflection, not a new topic.)

  *(Self-Correction during drafting)*: I need to be careful about the "Lump" definition. If the lump existed *before* the statue, coincidence is less weird (the lump was there, then the statue joined it). To make coincidence *forced*, the Lump must be defined as "The lump of clay *constituted by this matter starting exactly when the statue was formed*." This is the "Lumpl" strategy. I need to make sure the tutor enforces this definition on the whiteboard.

  *(Refining the CS intervention)*: Don't fight the analogy. Use it. "In code, `a == b` checks value, `a is b` checks reference. Metaphysics asks if the *referent* is one or two. If the referent has different properties, it can't be one referent, regardless of how many variables point to it."

  *(Refining the Diagnostic)*: The question needs to test if they understand *why* the cheap answers fail. "Why can't we just say 'It depends on how we describe it'?"

  Let's assemble the plan.cw
answer: |-
  Here is a 50-minute battle plan designed to force the problem out of the students rather than presenting it to them.

  ### 1. The Carrier Example
  **Verdict:** Use the **Standard Case** (Statue and Lump created simultaneously).
  **Discard:** The Kiln (Variant A) and the 3D Print (Variant B).

  **Why:**
  *   **Variant A (Kiln):** Introduces *diachronic* change (chemical composition over time). This distracts from the core *synchronic* puzzle (constitution at a time). You want them fighting about whether two things can be in one place *now*, not whether matter persists through fire.
  *   **Variant B (3D Print):** Introduces *intermittent existence* and recreation. This smuggles in the Ship of Theseus / persistence through time problems. You will spend 40 minutes debating when the object stops existing, and 10 minutes on constitution.
  *   **The Standard Case:** It isolates **modal properties** (what *could* happen to the object). It forces the question: "Do these two descriptions track the same thing through possible worlds?"

  **Crucial Constraint for the Whiteboard:**
  You must define the Lump carefully. Do not let them say "The lump existed before the sculptor touched it."
  *   **Definition:** "Lumpl" is *the specific portion of clay that begins to exist exactly when the statue is assembled.*
  *   **Reason:** If the lump existed beforehand, they are distinct simply because they have different *past* properties. You want them distinct because they have different *future* (modal) properties. This makes coincidence harder to swallow, which is where the philosophy lives.

  ---

  ### 2. The Sequence & Dependency Structure
  *Total Time: 50 Minutes*

  #### Phase 1: The Commitment (0–10 mins)
  **Goal:** Get them to commit to different survival conditions without using the word "identity."
  **Whiteboard:** Draw a simple blob. Label it "Object X."

  1.  **Ask:** "I made this out of clay five minutes ago. If I squash it into a ball right now, is Object X still here?"
      *   *Likely split:* Some say yes (it's still clay), some say no (it's broken).
  2.  **Force the Distinction:** "Okay, let's agree there are two ways to talk about this.
      *   **Term A:** 'The Statue.' (Defined by shape/artefact function).
      *   **Term B:** 'The Lump.' (Defined by the matter itself).
      *   **Question:** If I squash it, does *The Statue* survive?" (Class agrees: No).
      *   **Question:** If I squash it, does *The Lump* survive?" (Class agrees: Yes).
  3.  **Write on Board:**
      *   Statue: Cannot survive squashing.
      *   Lump: Can survive squashing.

  *Pedagogical Note:* Do not let them move past this until they agree these are *properties of the things*, not just our opinions. The statue *would cease to exist*. The lump *would not*.

  #### Phase 2: The Logical Trap (10–20 mins)
  **Goal:** Introduce Leibniz's Law as the engine that breaks the "One Thing" intuition.
  **Whiteboard:** Write **LL: If $x = y$, then $x$ and $y$ share all properties.**

  1.  **Ask:** "Are The Statue and The Lump the same object?"
      *   *Most will say:* "Yes, obviously. It's one thing."
  2.  **Apply LL:** "If they are the same object ($S = L$), they must share all properties."
  3.  **Point to Phase 1:** "But $S$ has the property 'cannot survive squashing'. $L$ has the property 'can survive squashing'. These are different properties."
  4.  **The Squeeze:** "So, logically, one of three things must be true. Write these down:"
      1.  $S \neq L$ (They are two different things).
      2.  LL is false (Identity doesn't require shared properties).
      3.  We are wrong about the properties (Statues *can* survive squashing, or Lumps *can't*).

  *Why this order works:* You haven't asked about "two things in one place" yet. You've made them commit to premises that *entail* two things. Coincidence is now the conclusion of an argument, not an opening assertion.

  #### Phase 3: The CS Intervention (20–30 mins)
  **Goal:** Defuse the "Type/Instance/Pointer" objection before it derails the metaphysics.
  **Context:** This is where your CS students will try to save the "One Thing" view by appealing to reference.

  1.  **Anticipate the Move:** A CS student will say: "It's the same memory address. 'Statue' and 'Lump' are just two variables pointing to the same data. Identity is pointer equality."
  2.  **The Defuse (Do not fight the analogy, extend it):**
      *   "Okay. In your code, if I have `objA` and `objB` pointing to the same address."
      *   "If I call `objA.destroy()`, does `objB` still exist?"
      *   *If they say No:* "Then they have the same persistence conditions. But we agreed the Statue dies and the Lump lives. So they aren't pointing to the same object with the same methods."
      *   *If they say Yes:* "Then `objA` and `objB` are tracking different *logical objects* despite sharing memory. Metaphysics cares about the logical object, not the memory address."
  3.  **The Takeaway:** "Metaphysical identity isn't about how many names we have (descriptions). It's about *what the thing is*. If one thing can survive a crush and the other can't, they are tracking different realities, even if they overlap perfectly in space-time."
  4.  **Board Update:** Add "Option 4: They are one thing under two descriptions." Cross it out. Write: **"Constitution $\neq$ Identity."**

  #### Phase 4: The Cost Calculation (30–40 mins)
  **Goal:** Make them feel the weight of the remaining options.
  **Whiteboard:** Return to the Three Options from Phase 2.

  1.  **Eliminate Option 2 (Deny LL):** "If we deny Leibniz's Law, logic breaks. We can't reason about anything. Too expensive."
  2.  **Eliminate Option 3 (Deny Properties):** "Do statues survive squashing? No. Do lumps? Yes. We can't lie about this."
  3.  **Face Option 1 (Coincidence):** "So $S \neq L$. They are distinct."
      *   **The Hard Question:** "If they are distinct, where are they?"
      *   *Students:* "In the same place."
      *   *You:* "Two distinct physical objects, occupying the exact same volume, made of the exact same atoms, at the exact same time."
      *   *Let them feel the weirdness.* This is the "Magic Word" moment, but now they earned it. They chose it to save Logic and Common Sense about survival.
  4.  **Briefly mention Elimination:** "The only other way out is to say Statues don't exist. Only Lumps exist. (Eliminativism). Who wants to defend that?" (Usually no one does).

  #### Phase 5: The Diagnostic (40–50 mins)
  **Goal:** Separate understanding from memorization.

  ---

  ### 3. Misconception Mapping
  *Where they arise and how to kill them.*

  | Misconception | When it arises | How to defuse (Script) |
  | :--- | :--- | :--- |
  | **"It's just one thing."** | Phase 1/2 | "I agree it *looks* like one thing. But if it's one thing, it can't have contradictory properties. Which property is wrong? Can the statue survive squashing?" |
  | **"CS Pointer/Type"** | Phase 3 | "Variables can alias, but the *referent* determines the behaviour. If the referent has different modal profiles, it's not one referent. You're describing a conceptual distinction, but the *world* is behaving as if there are two objects." |
  | **"Epistemic Humility"**<br>("There's a fact, we just don't know it.") | Phase 4 | "It's not that we don't *know*. It's that the conditions for existence are different. One object *would* cease to exist. The other *would not*. That is a determinate difference, not a lack of knowledge." |
  | **"Squashing is a trick"**<br>("You're changing the subject.") | Phase 1 | "We aren't talking about the physical act. We are talking about *essential properties*. What is it to *be* a statue vs. *be* a lump? The squash just reveals the difference." |

  ---

  ### 4. The Final Diagnostic Question
  *Do not ask them to list the views. Ask them to justify the cost.*

  **The Question:**
  > "If you insist that the Statue and the Lump are **identical** (just one object), you must reject one of the premises we wrote on the board in the first 10 minutes. Which one do you reject, and what does that force you to say about the world?"

  **What you are looking for:**
  *   **Memorized Answer:** "They have different persistence conditions." (This is just a slogan).
  *   **Understanding:** "If I say they are identical, I have to say that either the Statue *would* survive the squashing (which is absurd) or the Lump *would not* (which denies the nature of matter). So I'm forced to change my definition of matter or art."
  *   **Better Understanding:** "If I say they are identical, I have to deny Leibniz's Law. If I deny that, I can't do logic. So I'm forced to accept Coincidence (two things in one place) even though it feels weird."

  ---

  ### 5. What to Say Out Loud (The "Out of Bounds")
  *You need to explicitly close the door on advanced solutions so they don't get distracted.*

  **Say this at the 40-minute mark:**
  > "I know some of you are thinking about 4-dimensionalism (time slices) or mereological sums (parts making wholes). Those are valid solutions, but they require machinery we haven't built yet. Today, we are working in **3D presentism**. We are assuming objects are wholly present now. Within *this* system, Coincidence is the only price you don't have to pay in logic or common sense. Next month we might pay it with temporal parts. Today, we pay it with space."

  ### Summary of the Whiteboard Flow
  1.  **Drawing:** Statue.
  2.  **List:** Statue Properties (No squash) vs. Lump Properties (Yes squash).
  3.  **Law:** Leibniz's Law ($x=y \rightarrow$ same props).
  4.  **Logic:** $S \neq L$ (Because props differ).
  5.  **CS Check:** Variables $\neq$ Referents.
  6.  **Consequence:** Two things, one place (Coincidence) OR No Statues (Eliminativism).
  7.  **Close:** 3Dism only (No time-slices yet).
