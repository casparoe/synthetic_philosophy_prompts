answer: |-
  Your tripartite hypothesis (Specifiability, Solvability, Maintainability/Incentives) is a robust diagnostic tool, but it risks treating the three problems as sequential engineering constraints when the original debate treated them as ontological categories. The deadlock persists not because the sides are talking past each other on definitions alone, but because they are modeling the *generation* of economic data differently.

  Here is the diagnosis of the impasse, structured by the layers you identified.

  ### 1. The Verbal Layer: Optimization vs. Valuation
  Much of the verbal impasse rests on an equivocation regarding what "calculation" denotes. For the Lange/Modern side, calculation is an **optimization problem**: maximize an objective function subject to constraints, where the parameters are discoverable or estimable. For the Mises/Hayek side, calculation is a **valuation process**: the creation of a common denominator for heterogeneous goods where no objective function exists prior to the exchange.

  When modern proponents claim Big Data solves "Specifiability," they mean we can now observe the constraints and state variables (inventory, logistics, preferences) with high fidelity. When Misesians say Specifiability is impossible, they mean there are no state variables for *future* capital goods until a property regime forces entrepreneurs to bid on them. The modern claim assumes the economy is a system of **allocation under scarcity**, while the Austrian claim assumes it is a system of **discovery under uncertainty**.

  **Application Sentence:** "Distinguish whether the algorithm is optimizing a known objective function over fixed resources, or whether it is attempting to generate the shadow prices required to define the objective function itself."

  ### 2. The Evidence Layer: Existence Proofs vs. Epistemic Limits
  The clash of standards is between **formal convergence** and **epistemic accessibility**. The Lange/Modern side offers existence proofs: given enough iterations and data, the system converges to the equilibrium vector. They treat the economy as a convex optimization landscape where the global minimum is stable and reachable.

  The Hayekian side rejects the premise that the landscape is stable or that the gradient is observable. Their evidence is not a counter-proof but an argument about the *nature of the input data*. If the data (local knowledge) changes faster than the reporting cycle, or if the data is destroyed by the act of abstraction (tacit knowledge), then the convergence proof is mathematically valid but economically vacuous. The modern ML claim relies on the assumption that latent representations in a neural net can capture tacit knowledge without articulation. The Hayekian counter is that tacit knowledge is only valid in the context of the specific decision it informs.

  **Application Sentence:** "Ask whether the model treats local knowledge as data that can be compressed without loss, or as judgment that ceases to be useful once removed from the context of its application."

  ### 3. The Substantive Layer: The Hidden Empirical Question
  You asked if there is a hidden empirical or formal question doing the work. There is. It is the question of **Information Loss in Aggregation**.

  The substantive disagreement is about the elasticity of substitution between centralized computation and decentralized judgment. The modern claim is that the marginal cost of transmitting information to a central planner (or cloud) has fallen to near zero, making centralization efficient. The Austrian claim is that the *cost* is not transmission bandwidth, but **semantic loss**.

  The hidden empirical question is: *What is the function relating the scale of centralization to the fidelity of the economic signal?* Is it linear, or is there a threshold where the complexity of the interactions outstrips the compression capability of the pricing/algorithmic mechanism? Large firms (Amazon, Walmart) are cited by the Modern side as proof of planning at scale. The Austrian side retorts that these firms operate within a broader market price system for capital and labor that anchors their internal transfer prices; they are islands of planning in a sea of markets, not a closed system.

  **Application Sentence:** "Test whether the internal transfer prices of a planned entity converge to external market prices when the entity is isolated from the broader market for capital goods."

  ### 4. Incentives and the Third Category
  Your third category (Maintainability/Incentives) is where the Mechanism Design critique lands, but the modern ML argument often bypasses this by assuming **behavioral prediction** replaces **truthful reporting**. The claim is that algorithms don't need managers to report costs truthfully; they can infer costs from observed behavior and sensor data.

  This returns us to the Specifiability problem. Inference works for *revealed* preferences in consumption, but it struggles with *productive capability* and *risk tolerance* in production. A manager can hide capacity or sandbag targets in ways that look like noise to an algorithm. The modern argument assumes the observation layer is comprehensive; the older argument assumes the observation layer is always gameable if the observer does not bear the residual claim.

  **Application Sentence:** "Distinguish between the computational cost of processing information and the economic cost of eliciting it truthfully from agents who bear no residual risk."

  ### 5. What Counts as Progress?
  The episode was not decided by 1989, because 1989 was a political collapse involving many variables, not a controlled test of calculation. Nor is it decided by existence proofs, because those assume away the knowledge problem.

  Progress would look like a **metric of decentralization efficiency**. Instead of asking "Is planning possible?", the field should ask "At what scale does the marginal cost of information aggregation exceed the marginal benefit of coordination?" This requires a formal model of information loss during aggregation, not just a model of optimization speed.

  If you want to move the workshop argument forward, do not ask if socialism is possible. Ask for the **compression ratio**.

  **Application Sentence:** "Progress requires a measurable proxy for the information loss incurred when local knowledge is aggregated into a central representation, rather than a proof that the central representation can be optimized."

  ### Summary Diagnosis
  The deadlock is 20% verbal (optimization vs. valuation), 30% evidentiary (convergence vs. epistemic access), and 50% substantive (the non-linearity of information loss). The modern "Big Data" argument successfully addresses the *Solvability* constraint (we can solve huge systems) and claims to address *Specifiability* (sensors see everything), but it largely ignores the *Maintainability* constraint regarding incentive compatibility and assumes away the ontological claim that prices are discovered, not measured.

  The debate remains open because the critical variable—the rate at which economic knowledge degrades when abstracted from its holder—has never been formally measured, only asserted.
