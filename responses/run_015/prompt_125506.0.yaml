  # Diagnostic Flowchart: Decision-Making Under Moral Uncertainty

  **Instructions:** Begin at **Node 1**. Answer the question based on your intuitions about the specific case provided or your general meta-ethical commitments. Follow the branch corresponding to your answer until you reach a **Leaf**.

  ### The Tree

  **Node 1 (Metaphysics):** Do your moral credences represent beliefs about truth-apt propositions that can be false, or are they expressions of conative attitudes (like plans or desires) that lack truth values?
  *   **Conative/Non-Truth-Apt** → **Leaf 1**
  *   **Truth-Apt Beliefs** → **Node 2**

  **Node 2 (Aggregation Target):** When theories disagree, should you aggregate their numerical assessments of how *good* an option is, or only their binary judgments of whether an option is *allowed*?
  *   **Permissibility Only** → **Node 3**
  *   **Choiceworthiness Values** → **Node 4**

  **Node 3 (Permissibility Scope):** *Case: A choice now forecloses a mandatory option later.* Should you evaluate permissibility act-by-act, or only for policies that include your future choices?
  *   **Act-by-Act (Myopic)** → **Leaf 2**
  *   **Policy-Based (Non-Myopic)** → **Leaf 3**

  **Node 4 (Intertheoretic Scale):** *Case: One theory compresses values near the top while another spreads them out.* Should theories be compared directly, or must their utility scales be normalized first?
  *   **Normalize Scales** → **Node 5**
  *   **Compare Directly** → **Node 6**

  **Node 5 (Normalization Method):** If normalizing, should you equalize the statistical variance of each theory's values, or rank options ordinally within each theory?
  *   **Variance-Normalized** → **Leaf 4**
  *   **Rank-Based (Borda)** → **Leaf 5**

  **Node 6 (Temporal Scope):** *Case: A compromise option preserves future access.* Should you maximize expected choiceworthiness for this act alone, or for a policy including future choices?
  *   **Policy-Based** → **Leaf 6**
  *   **Act-by-Act (Myopic)** → **Node 7**

  **Node 7 (Risk & Implementation):** *Case: Astronomical value at vanishing probability.* Do you maximize expectation strictly, temper extreme values, or defer to expert aggregates?
  *   **Temper/Anti-Fanatical** → **Leaf 7**
  *   **Strict Subjective Max** → **Leaf 8**
  *   **Tolerance + Secondary Criteria** → **Leaf 9**
  *   **Expert/Aggregate Max** → **Leaf 10**

  *(Note: Node 7 is a quadrichotomy to ensure all required leaves are reached within the 7-node constraint.)*

  ---

  ### The Leaves

  **Leaf 1: Non-Cognitivist Hedging**
  *   **Awkward Commitment:** You must weight your moral uncertainty using non-moral attitudes, implying you cannot be rationally criticized for holding inconsistent moral "beliefs."

  **Leaf 2: Myopic Permissibility Maximization**
  *   **Awkward Commitment:** You may knowingly adopt a policy that guarantees you will violate a mandatory constraint later, provided each individual step was permissible when taken.

  **Leaf 3: Policy Permissibility Maximization**
  *   **Awkward Commitment:** You are forbidden from taking a locally permissible act if it prevents you from satisfying a different theory's mandatory requirement in a counterfactual future.

  **Leaf 4: Variance-Normalized MEC**
  *   **Awkward Commitment:** A theory's influence on your choice depends on how passionately it feels about the options rather than how likely it is to be true.

  **Leaf 5: Rank-Based (Borda) MEC**
  *   **Awkward Commitment:** You ignore the magnitude of value differences between options, treating a slight preference and a overwhelming conviction as equally weighty ordinal ranks.

  **Leaf 6: Policy-Based Expected Choiceworthiness**
  *   **Awkward Commitment:** You are required to calculate the expected value of entire life-policies, demanding cognitive access to your own future decision-making algorithms.

  **Leaf 7: Anti-Fanatical/Tempered MEC**
  *   **Awkward Commitment:** You must ignore outcomes with sufficiently high value, implying you would reject a guaranteed saving of the world for a 0.0001% chance of saving infinite worlds.

  **Leaf 8: Standard Myopic Expected Choiceworthiness**
  *   **Awkward Commitment:** You are required to choose an option that every credible moral theory agrees is catastrophic, provided the probability-weighted sum is mathematically highest.

  **Leaf 9: User Hybrid (Tolerance + Permissibility + Preservation)**
  *   **Awkward Commitment:** You must perform complex secondary calculations to break ties, potentially choosing an option with lower expected choiceworthiness because it preserves more "future best choices."

  **Leaf 10: Externalist/Expert MEC**
  *   **Awkward Commitment:** You may be obligated to act against your own sincere moral conviction if a panel of informed judges would assign it higher expected choiceworthiness.

  ---

  ### Analysis of the Diagnostic Space

  #### 1. Location and Status of the User Hybrid
  **Location:** The Hybrid is located at **Leaf 9**, branching from **Node 7**. It sits logically between **Leaf 8 (Standard Myopic MEC)** and **Leaf 6 (Policy MEC)**.
  **Neighbors:** It collapses into **Leaf 8** if the "fixed tolerance" is set to zero (making it a strict maximizer) or if the "permissibility credence" is uniform across tied options. It shares DNA with **Leaf 6** because its third tie-breaker ("preserves more of what each theory regards as the best available future choice") is a policy-based consideration injected into a myopic framework.
  **Cell Status:** This cell is **genuinely unoccupied** in the literature. While "satisficing" (tolerance) and "hedging" (permissibility) are discussed separately, combining them with a dynamic preservation criterion is unexplored. It is not necessarily incoherent, but it is **unattractive** to computational theorists due to the heavy information burden required to assess "future choice preservation" for every near-tied option.

  #### 2. Indistinguishable Leaves
  **Leaves 6 (Policy MEC) and 9 (User Hybrid):**
  *   **Why they blur:** In environments where "future choice preservation" correlates strongly with expected choiceworthiness, the Hybrid will select the same option as the Policy MEC.
  *   **Separating Case:** A **"Self-Binding" Case**. Suppose Option A has the highest immediate expected choiceworthiness but requires you to pre-commit to a future act that is sub-optimal later. Option B has slightly lower immediate value but keeps your future options open.
      *   **Policy MEC** might choose A if the total policy value is highest.
      *   **User Hybrid** (acting myopically with a preservation tie-break) might choose B if A and B are within the "tolerance" zone, prioritizing the preservation of future optimality over the slight immediate gain.

  #### 3. Empty Cells in Logical Space
  The tree prunes several logically possible combinations of answers. Two notable empty cells include:

  *   **Empty Cell 1: Non-Cognitivist + Intertheoretic Comparison.**
      *   **Path:** Node 1 (Conative) → Node 4 (Scale).
      *   **Reason:** **Incoherent.** If moral states are not truth-apt beliefs (Leaf 1), there is no "value" to normalize or compare across theories in the sense required by Node 4. You cannot variance-normalize desires in the same way you normalize utility functions.
  *   **Empty Cell 2: Policy-Based Anti-Fanaticism.**
      *   **Path:** Node 6 (Policy) → Node 7 (Temper).
      *   **Reason:** **Unexplored/Unattractive.** The literature on anti-fanaticism (e.g., truncating expectations) is almost exclusively applied to act-based evaluation. Applying risk-tempering to *policies* creates a recursive problem: does the agent temper the risk of the policy selection itself, or the risks within the policy? This double-layer risk assessment is theoretically messy and currently unoccupied.
