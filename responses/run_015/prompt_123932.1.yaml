answer: |-
  Your tentative 'leverage discount' is a strong start, but it is too blunt an instrument. It successfully handles the muggers (Cases 2 and 3) and the established power (Case 4), but it threatens to collapse your support for existential risk mitigation (Cases 6 and 8). If you discount stakes by 1/N simply because N is large, you must also discount the value of saving future generations, since their numbers are astronomical. To save your verdict on existential risk, the discount cannot apply to *numbers* alone; it must apply to the *mechanism* linking your money to those numbers.

  Here is the principle that best fits your verdicts, followed by an analysis of its costs and rivals.

  ### The Principle of Proportional Causal Capacity

  **Statement:**
  You should act on expected-value calculations only when the causal chain linking your act to the outcome operates within a domain of established physical or social capacity.

  **Clauses:**
  1.  **Established Mechanisms:** Where the agent's capacity to effect change is proportional to their observable resources or an audited track record, calculate expected value linearly.
      *   *Motivation:* This secures **Case 1** (audited charity) and **Case 4** (publicly observed power). It allows you to mortgage the house when the power is real, and to fund standard charities.
  2.  **Unverified Agency:** Where the agent claims a capacity to effect change vastly disproportionate to their observable resources without independent verification, discount the probability of their claim inversely to the ratio of claimed impact to observable capacity.
      *   *Motivation:* This secures **Case 2** and **Case 3**. It explains why you are less inclined to pay the 10^30 claimant than the 10^6 claimant: the disproportion is greater, so the probability discount is heavier. It also handles **Case 5** (the benefactor), treating the unverified promise the same as the unverified threat.
  3.  **Mutual Exclusivity:** Where multiple agents make claims of unverified capacity that are mutually inconsistent, reject all claims.
      *   *Motivation:* This secures **Case 6 (Crowd)**. You cannot logically satisfy all claimants, and without a way to distinguish them, the rational choice is to reject the class of claims entirely.
  4.  **Grounded Speculation:** Where the causal mechanism is grounded in physical or biological models with indirect empirical traction, aggregate low-probability scenarios even if the specific event is rare.
      *   *Motivation:* This secures **Case 6 (Existential Risk)** and **Case 8**. Unlike the mugger, a pandemic or asteroid relies on physics and biology, not personal magical agency. The 'source' of the probability matters because scientific models belong to a reference class with a track record of predictive success, whereas muggers do not.

  ### Evaluation Against Rivals

  *   **Probability Cutoff:** This suggests treating any probability below a certain threshold (e.g., 1 in a billion) as zero.
      *   *Failure:* It is arbitrary. It fails **Case 8**, where you happily pay to reduce a one-in-a-million extinction risk. A hard cutoff would forbid this. It also fails to explain why you treat the 10^30 mugger differently from the 10^6 mugger (**Case 3**); a cutoff treats both as zero once they cross the line, whereas you feel a gradient of disbelief.
  *   **Value Ceiling:** This suggests capping the value of any outcome (e.g., no outcome is worth more than a billion lives).
      *   *Failure:* It contradicts **Case 4**. You stated you would mortgage your house if the power was established, implying no ceiling on value when the causal link is secure. A value ceiling would force you to refuse the mortgage.
  *   **Knowability Restriction:** This suggests ignoring outcomes you cannot in principle verify.
      *   *Failure:* It is too restrictive for **Case 6 (Existential Risk)**. We cannot verify the survival of future generations in advance, yet you support mitigating risks to them. The issue is not verifiability of the *outcome*, but reliability of the *cause*.

  ### Sacrifices Required

  No principle can save every intuition without tension. To adopt the **Principle of Proportional Causal Capacity**, you must surrender two specific intuitions:

  1.  **The Structural Identity of Case 6:** You wrote that the Crowd and Existential Risk attitudes are "structurally the same". This principle forces you to admit they are *not*. The Crowd relies on unverified personal agency; Existential Risk relies on grounded scientific models. You must accept that the distinction is not ad hoc, but fundamental to the causal claim.
  2.  **The Asymmetry of Comfort (Case 5):** You noted you feel *more comfortable* refusing the benefactor than the mugger. This principle gives the same verdict for both (Refuse), but it does not explain the emotional difference. That difference is likely a heuristic response to threats (loss aversion) rather than a rational distinction in expected value. You must accept that your comfort level is not a guide to truth.

  ### My Preferred Principle

  I would adopt the **Principle of Proportional Causal Capacity**. It is superior because it isolates the actual source of the error in Pascal's Mugging: not the size of the numbers, but the absence of a causal bridge. It permits high-stakes reasoning where the bridge is built (science, audited charity) and forbids it where the bridge is asserted by fiat (magic, muggers). It protects you from exploitation without blinding you to genuine existential threats.

  ### Application to Three New Cases

  Here is how this principle applies to the cases you omitted.

  **1. The Claimant Who Promises Proof Tomorrow**
  *Verdict:* Do not pay today.
  *Reasoning:* Under Clause 2 (Unverified Agency), the claimant's capacity *today* is disproportionate to their observable resources. The promise of future proof does not establish a causal link between today's £5 and today's threat. Furthermore, paying today rewards the strategy of demanding ransom before proof, which violates the policy against exploitation (**Case 7**). If they prove their power tomorrow, you may pay tomorrow, but the leverage today is ungrounded.

  **2. The Claimant in a World of 10^30 Copies**
  *Verdict:* Do not pay.
  *Reasoning:* This depends on what is evidenced. If you have strong evidence that you are one of 10^30 copies, that satisfies the 'grounded' requirement for the *setting*. However, the claimant's *power* to save those lives for £5 remains the bottleneck. Unless the claimant is the verified operator of the copies (Case 4), their capacity to affect 10^30 lives via your £5 is still disproportionate to their observable resources. The leverage is indexical, but the agency is still magical. Therefore, Clause 2 applies: discount the probability.

  **3. The Claimant Who Asks Only for Belief**
  *Verdict:* Do not talk yourself into belief.
  *Reasoning:* Belief is an act with a cost (the cost of holding a false belief, or the effort of self-deception). Clause 2 applies: the claim relies on unverified agency. The expected value of believing is negative because the probability of the claim being true is discounted to near zero by the lack of causal grounding. To force belief would be to violate your own epistemic standards without a grounded reason. You treat your own mind as a resource that should not be spent on unverified causal chains.
