  9.  **Final Polish:** Ensure the distinction between "believing truly" and "believing morally" is clear. (Proceed to generate output).

  *(Self-Correction Note: Make sure to explicitly address the "metanormative" point. Many pessimists are implicitly expressivists or non-cognitivists, which makes testimony impossible by definition, while optimists are often realists. This is a huge source of talking past each other.)*

  *(Another Note: The "Agency" point is crucial. Pessimists care about moral *worth* of the action, not just the truth of the belief. Optimists care about the *truth* of the belief. They are optimizing for different things.)*

  10. **Finalizing the Response Structure:**
