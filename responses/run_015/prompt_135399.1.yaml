      *   *Medium Likelihood/High Damage:* The Normative Theorist (philosophical foundation).
      *   *Low Likelihood/Catastrophic Damage:* The Warlord Question (needs specific prep).

      *Decision:* I will order them by *strategic priority* (what will actually derail the defense) rather than just probability, but I'll flag the likelihood. The Anthropologist and Professor are the immediate threats in the room. The Warlord question is the "nuclear option."

  5.  **Developing Reply Strategies (2-minute limit):**
      *   Need to be concise.
      *   Need to acknowledge validity (concession) without surrendering the core thesis.
      *   Need to pivot back to the "Accountability-Loop" definition.

  6.  **Hold vs. Let Go:**
      *   *Hold:* The definition of corruption as a *structural breach* rather than a *transactional event*. The critique of Weberian universalism.
      *   *Let Go:* The idea that all clientelism is *good*. Admit it can be unjust even if not "corrupt" by this definition. Distinguish "corruption" from "injustice."

  7.  **The Dreaded Question (Warlords/Mafia):**
