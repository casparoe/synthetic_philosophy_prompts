      *   *Professor (Democratic Accountability):* She cares about *democratic* equality, not just functional loops. She'll hit the relativism angle.
          *   *Question:* "Doesn't this redefine democracy down to fit the patronage?"
      *   *Economists (Principal-Agent):* They care about information asymmetry and incentives. They'll see the "loop" as a monitoring cost issue.
          *   *Question:* "Isn't the 'loop' just high-cost monitoring? And doesn't cash bribery just lower transaction costs?"
      *   *Normative Theorist (Universalizability):* Cares about rules applying to everyone equally.
          *   *Question:* "Can you universalize a system where rights depend on personal loyalty?"
      *   *Anthropologist (Fieldwork/Gender/Coercion):* Cares about the lived experience, power dynamics, hidden labor.
