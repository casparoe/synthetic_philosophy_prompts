      Dear friend, I appreciate you raising this because it cuts right to the heart of why I care about coherence in the first place, and I think there is a crucial distinction we need to draw between psychological rigidity and the structural integrity of agency. You describe a case where an agent prefers A to B now, anticipates preferring B to A later, and endorses that shift, and you ask if demanding coherence here is just forcing them to stick to a view they want to discard. My response is that if the shift in preference is driven by new information or a genuine re-evaluation of values that the agent currently endorses as an improvement, then there is no incoherence to begin it, but if the shift is merely a function of time passing without any informational update, then we are looking at a fragmentation of the self that leaves the agent vulnerable to domination by their own impulses. When I say incoherent preferences are rationally defective, I am not saying you cannot change your mind, but I am saying that if you know you will change your mind in a way that contradicts your current best judgment without a reason that validates that change, you are effectively planning to act against your own interests, and that is where the embarrassment of the Dutch book comes in.

      Consider the money pump argument in this temporal context. If you prefer A to B today, but you know that tomorrow you will trade A for B at some cost, and you would pay today to prevent that trade or enable it depending on the setup, you can be constructed into a cycle where you end up with less than you started simply because your preferences across time do not mesh. You might say you genuinely want the reversal, but I would ask you whose desire this is. If your current self wants the reversal only because it anticipates a failure of will or a corruption of judgment in the future self, then honoring that desire is not respecting your future self, it is managing a pathology. To respect your future self is to treat them as a partner in a unified project of living, not as a stranger whose irrationality you must accommodate. If coherence forces you to align today's choice with tomorrow's preference, it is only because tomorrow's preference is supposed to be the execution of today's plan, updated for new facts, not a betrayal of it.

      There is a deep sense in which rationality is about being a single agent over time rather than a sequence of temporal slices. If you allow yourself to be incoherent, you are conceding that there is no true you that persists, only a series of moments with conflicting demands, and while that might feel like freedom from rigidity, it is actually a surrender of agency. You asked if this confuses consistency with psychological rigidity, but I see it as the opposite, where rigidity is often the result of failing to integrate your temporal selves into a coherent whole. When you are coherent, you are not rigid, you are resilient, because your decisions support each other rather than undermining each other. If you prefer A to B now, and you act on that, and tomorrow you prefer B to A without new information, you are effectively saying that your previous reasoning was wrong without having found a specific error in it, which is an epistemic vice.

      I am willing to concede that human psychology is messy and that we often feel torn between who we are and who we will be, and coherence arguments do not deny this phenomenology. However, normatively, if we aim to be effective agents who achieve our goals rather than frustrate them, we must aspire to a structure where our preferences do not loop back on themselves to consume our resources. The embarrassment of being Dutch-booked is not just about losing money, it is about displaying a lack of logical hygiene that allows external forces or internal whims to dictate outcomes that you yourself rank as worse. So when you suggest that coherence coerces the agent into endorsing a view they want to discard, I would say that if the view is discarded without reason, it should not have been held in a way that commits resources in the first place. Rationality demands that we stand by our judgments unless there is a cause to revise them, and treating time itself as a cause for revision is the very defect coherence seeks to cure.

      I hope this clarifies why I see the defect as deep rather than technical, because it strikes at the possibility of sustained agency itself. We can talk more about the specific mechanics of the preference reversal if you like, but I want to hold the line that respecting your future self means trusting them to carry out your current rational plans, not planning for their betrayal. Let me know what you think about the distinction between information-driven change and time-driven change, because I think that is where the real work is being done here.

