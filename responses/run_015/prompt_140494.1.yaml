      *   *Decision:* It's both, but mostly the philosophical categories are too blunt for asymptotic reasoning. Engineers have a blind spot regarding the *ontology* of their variables, but philosophers have a blind spot regarding *approximation*.

  8.  (Final thought before generating): Make sure to explicitly mention the Cauchy-Born rule as the specific "bridge law" analogue, and localization as the specific "breakdown of emergence" analogue.

