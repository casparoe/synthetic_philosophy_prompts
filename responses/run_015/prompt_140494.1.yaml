          *   Engineering "emergence" is often just "computational intractability + scale separation failure."
          *   Conclusion: The philosophical debate is looking for ontological joints; the engineering practice is looking for computational leverage points. The residue suggests the philosophical framework is under-specified for *approximate* sciences.

