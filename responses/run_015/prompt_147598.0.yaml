      *   *Trigger:* Parent indigence + inability to pay for basic needs (medical/nursing).
      *   *Liability:* Adult children (financial).
      *   *Defenses:* Often ability to pay, abandonment by parent, prior support provided.
      *   *Nature:* Civil liability, not criminal. No requirement for emotional labor.

  3.  **Deconstruct the Ethical Frameworks:**
      *   **Liberal Individualism/Contractualism:** Obligations arise from consent or specific harm. Family ties are voluntary associations in adulthood. State safety nets should cover indigence.
      *   **Liberal Anti-Free-Riding/Reciprocity:** Parents invested in children; children shouldn't let the public pay for what is essentially a private debt of gratitude or return on investment.
      *   **Confucian Role Ethics:** Relationships constitute the self. *Xiao* (filial piety) is a root virtue. Duty is intrinsic to the role, not contingent on performance or consent. It's holistic (material + emotional + ritual).

  4.  **Evaluate the "Thin vs. Thick" Distinction:**
      *   *Thin:* You are a child -> You pay. (Fits the statute).
      *   *Thick:* You are a child -> You care/love/visit. (Does *not* fit the statute).
      *   *Conclusion:* The statutes are legally "thin" but might be culturally justified by "thick" intuitions.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the "thin vs. thick" distinction as a useful analytical tool.
      *   **Reconstructing the Implicit Theory (The Statutes):**
          *   What do they actually say? Financial liability based on status.
          *   Do they require "thick" performance? No.
          *   Do they require consent? No.
          *   *Implicit Theory:* A hybrid. It treats the family as a private insurance policy (Liberal/Economic) but selects the insured based on biological status (Pre-Modern/Confucian).
      *   **Philosophical Underdetermination (Where multiple theories fit):**
          *   *Anti-Free-Riding:* Public shouldn't pay if private assets (kids) exist.
          *   *Reciprocity/Gratitude:* Return the care you received.
          *   *Confucian:* It is your nature/duty.
          *   *Point:* The *law* doesn't distinguish between these justifications. It works for all of them.
      *   **Testing the Confucian Analogy (Hold vs. Break):**
          *   *Holds:* Status-based obligation. Non-voluntary. Priority of family over state (in terms of payment).
          *   *Breaks:* Confucianism is holistic (*Xiao* includes respect, spirit, ritual). The law is reductionist (money only). Confucianism is reciprocal (parents must be worthy/loving); some laws have abandonment defenses, but many are strict liability. Confucianism is about moral cultivation; law is about debt collection.
      *   **Testing the Liberal/Cost-Shifting Analogy:**
          *   *Holds:* Focus on fiscal burden. Limited scope (indigence only).
