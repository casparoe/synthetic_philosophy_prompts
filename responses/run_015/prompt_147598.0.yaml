      *   **Key Distinction:** The user proposes "thin role-occupancy duty" (status-based liability) vs. "thick role-performance duty" (normative behavioral expectations like care/respect).
      *   **Specific Tasks:**
          1.  Reconstruct the implicit theory of the statutes (what do they presuppose about persons, roles, obligation?).
          2.  Determine which rival views are ruled out or compatible (Confucianism, reciprocity, gratitude, liberal anti-free-riding).
          3.  Identify where the practice is philosophically underdetermined (multiple theories fit).
          4.  Analyze what would change if the presupposed view swapped (e.g., if it's cost-shifting, why children specifically? If it's Confucian, what's missing?).
          5.  Critically evaluate the analogy to Confucian role ethics (where it holds, where it breaks).
          6.  Maintain neutrality (don't just validate the user's side).

  2.  **Deconstruct the Legal Reality (Filial Responsibility Laws):**
