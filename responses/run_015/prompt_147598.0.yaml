answer: |-
  This is a fantastic philosophical puzzle, and your "thin vs. thick" distinction is actually a very precise tool for dissecting it. You and your friend are both touching on different layers of the same legal artifact. The law is a fossil: it often preserves the moral language of one era to serve the economic functions of another.

  Here is a reconstruction of the implicit theory of US filial responsibility statutes, analyzed through your distinction, the Confucian analogy, and the liberal counter-argument.

  ### 1. Reconstructing the Implicit Theory: What the Statutes Presuppose

  If we look strictly at the text and enforcement of these laws (e.g., Pennsylvania's *In re Estate of Soriano* or similar statutes in Alaska and South Dakota), the implicit theory of obligation is **Status-Based Liability without Role-Performance Requirements.**

  *   **Persons:** The law treats adult children as distinct legal agents from their parents (liberal individualism), *except* when the parent becomes indigent. At that moment, the child's financial boundary becomes permeable.
  *   **Roles:** The role of "child" is treated as a **status trigger**. It is not a vocation or a moral practice; it is a classification. Once classified, a liability attaches.
  *   **Obligation:** The obligation is **negative and financial**. It is not a duty to *do* something active (like visit), but a duty to *prevent* a specific state of affairs (the parent becoming a public charge).

  **Where your "Thin vs. Thick" distinction lands:**
  The statutes presuppose a **Thin Role-Occupancy Duty**. The law does not care if you perform the role of a "good son" (thick performance). It only cares that you occupy the slot of "son" (thin occupancy). If you hate your parent, never speak to them, and think they were terrible, you are still liable in many jurisdictions (unless specific abandonment defenses apply). This rules out a purely contractual view (where obligation requires consent) but also rules out a fully Confucian view (where obligation requires moral cultivation).

  ### 2. Philosophical Underdetermination: Where Theories Overlap

  You asked where the practice is underdetermined. This is the crux of your argument with your friend. The *same* statute can be justified by three completely different moral theories, which is why you can't settle the argument by looking at the law alone.

  1.  **Liberal Anti-Free-Riding (Your Friend's View):** The state provides a safety net, but it shouldn't subsidize private families if they have resources. The child is the "nearest deep pocket." The justification is fiscal efficiency, not moral duty.
  2.  **Reciprocity/Gratitude (The Lockean View):** Parents invested resources in the child; the child owes a debt of gratitude. When the parent is destitute, the debt comes due.
  3.  **Confucian Role Ethics (Your View):** The child is an extension of the parental line. To let the parent starve is to violate the self-constitution of the child.

  **The Underdetermination:** The law is compatible with all three. It does not ask *why* you must pay, only *that* you pay. This is why your friend says it's cost-shifting (functional description) and you say it's Confucian (structural description). You are describing the *engine*, they are describing the *fuel*.

  ### 3. Testing the Confucian Analogy: Holds and Breaks

  To avoid forcing the fit, we need to see exactly where the analogy works and where it snaps.

  **Where the Analogy Holds (The Structural Resonance):**
  *   **Non-Voluntarism:** In liberal contract theory, I choose my obligations. In Confucianism, I inherit them. Filial laws mirror the Confucian view that you do not choose your parents, and therefore you do not choose the duty. The obligation attaches to the *fact* of birth, not the *quality* of the relationship.
  *   **Priority of Family over State:** Confucianism posits that the family is the primary unit of welfare; the state is secondary. These laws operationalize that by making the family the primary payer and the state the payer of last resort.
  *   **Role Specificity:** As you noted, the law doesn't target neighbors or friends. It targets the specific *Five Relationship* node of Parent-Child. This suggests the law recognizes a special normative weight to that specific biological/legal tie, which aligns with *Xiao* (filial piety).

  **Where the Analogy Breaks (The Moral Reductionism):**
  *   **Monetization of *Xiao*:** In Confucian ethics, *Xiao* is holistic. It involves *jing* (reverence), emotional warmth, and ritual propriety. Confucius explicitly said that feeding your parents is not enough; even dogs and horses are fed. If you don't have reverence, it's not *Xiao*. The US statutes reduce *Xiao* to a cash transfer. A child can write a check while verbally abusing the parent and satisfy the statute. A Confucian would say the statute is being met, but the *ethics* are being violated.
  *   **Lack of Reciprocal Parental Duty:** Confucian role ethics is reciprocal, though asymmetrical. Parents have a duty to be benevolent (*Ci*). If a parent is abusive or neglectful, the Confucian framework gets complicated (some texts say you remonstrate, others say you still serve). However, US laws often enforce child liability even if the parent was absent, unless there is a specific statutory defense for abandonment. This leans more toward strict debt collection than relational ethics.
  *   **External vs. Internal:** Confucian ethics is about self-cultivation. The law is about external compliance. The law doesn't want you to be a better person; it wants the nursing home bill paid.

  ### 4. Counterfactuals: Swapping the Presuppositions

  This is the best way to test which theory is actually driving the bus.

  **Scenario A: If the justification were purely Liberal Cost-Shifting (Your Friend's View)**
  If the only goal is protecting the public fisc and finding a deep pocket, the current law is inefficiently designed.
  *   **What would change:** The law would likely be a **General Tax** or a **Estate Recovery** expansion.
  *   **Why:** Targeting children specifically requires expensive litigation to establish lineage and ability to pay. A small surcharge on income taxes or a more aggressive lien on the parent's own assets (including clawing back gifts given to *anyone*, not just kids) would be more efficient.
  *   **The "Deep Pocket" Test:** If it were truly just about assets, the law would allow the state to pursue a wealthy sibling, a wealthy ex-spouse, or a wealthy business partner of the indigent parent. The fact that it *only* pursues children suggests the "family role" is a necessary condition, not just an economic heuristic. This weakens your friend's "pure cost-shifting" argument.

  **Scenario B: If the justification were purely Confucian Role Ethics (Your View)**
  If the state truly believed the Parent-Child relationship was constitutive of moral personhood, the current law is morally anemic.
  *   **What would change:** The law would enforce **Thick Role-Performance**.
  *   **Specifics:**
      *   **Visitation Mandates:** Laws could require minimum contact hours (some Asian jurisdictions have experimented with this).
      *   **Criminalization of Disrespect:** "Insulting parents" is a crime in some traditional codes; here it's protected speech.
      *   **Co-residence:** Zoning laws might mandate multi-generational housing options or tax penalties for placing parents in facilities rather than homes.
      *   **Parental Accountability:** The state might intervene earlier to ensure parents are raising children virtuously, viewing bad parenting as a future threat to social harmony, not just a private choice.
  *   **The Verdict:** Since the US law refuses to mandate emotional labor or co-residence (citing liberty interests), it rejects the "Thick" Confucian view.

  ### 5. Synthesis: The "Liberal-Confucian Hybrid"

  The most precise reconstruction of the implicit theory is that these statutes are **Liberal ends achieved through Pre-Modern means.**

  The US legal culture is fundamentally liberal (it refuses to mandate thick role performance like visitation or respect). However, it retains a "Confucian residue" in its assignment of liability. It assumes that because you are a child, you are the *rightful* bearer of this burden, distinct from any other citizen.

  *   **It rules out:** Pure Libertarianism (which would say the state has no right to compel this even for cost-shifting) and Pure Contractualism (which would require an explicit agreement to support).
  *   **It accommodates:** A "Soft Confucianism." It acknowledges the special status of the family bond without demanding the moral transformation of the individuals.

  **Conclusion for your argument:**
  You can tell your friend they are right about the *function* (it is cost-shifting), but wrong about the *logic*. If it were *only* cost-shifting, the state would tax everyone or lien anyone. By specifically selecting *children*, the law smuggles in a normative claim: that the parent-child relationship creates a unique financial entanglement that survives adulthood.

  However, you must concede to them that the law is **not** Confucian in spirit. It is Confucian in *structure* (status-based duty) but Liberal in *substance* (monetized, limited, non-moralized). It treats the family like an insurance company that you were automatically enrolled in at birth, rather than a moral community you cultivate.

  So, the statutes presuppose a **Thin Role-Occupancy Duty**. They need the Confucian story to explain *why children* are targeted, but they rely on the Liberal story to explain *why only money* is demanded.
