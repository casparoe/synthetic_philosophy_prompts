prompt: |-
  me and my friend got into it last night about whether Pascal actually thinks justice is just whatever the powerful make up, or if there's some hidden natural equity he's protecting. I wanna write a short research proposal — like for a one-semester fellowship — that asks whether the justice-and-force fragments in the Pensées only hold together if you read them through Pascal's three orders (body, mind, charity) instead of treating them as straight political philosophy. The standard take is that he's a conventionalist and force is just the enforcer, but I think the orders complicate that: justice might sit between body (force) and mind (reason/custom), while true equity belongs to charity. So the precise question is whether that framework dissolves the conventionalist reading or just shows justice is permanently unstable between orders.

  I need the proposal to have: the exact question framed so it has a determinable answer, why existing answers leave it open (they usually isolate the fragments from the order passages), my method — close reading of the justice/force fragments mapped onto the order fragments, maybe comparing with how custom works in the Provincial Letters — what a result looks like (either a reconstructed account or proof the orders dont apply here), and an honest failure condition. Also scope: its a short project, not a dissertation, so say what could make it too big. Keep it casual, dont ask for a bibliography — I'll fill in citations myself. Can you turn this into the actual proposal text?
