prompt: |-
  I am a patent lawyer who thinks in terms of claims, prior art, enablement, written description, infringement, and the doctrine of equivalents, but I have no background in philosophy of biology. Restate the debate over whether DNA is literally an informational code—carrying semantic content that specifies phenotypic traits—or only metaphorically code-like, using exclusively my vocabulary. In particular, translate the competing positions into questions about whether a genetic sequence operates like an enabling disclosure that teaches how to build a trait, whether point mutations are closer to claim amendments or to infringement by equivalents, and whether "reading" DNA requires an interpreting agent analogous to a person skilled in the art. Then give me the residue report: which distinctions map cleanly, which require distortion to fit patent categories, and which have no legal counterpart whatsoever. For each residue item, indicate whether the gap stems from a limitation in patent vocabulary or from imprecision in the philosophical claim. State your confidence in each part of the translation and identify the single point about which you are least sure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** Patent Lawyer (thinks in claims, prior art, enablement, written description, infringement, doctrine of equivalents).
      *   **Topic:** The philosophical debate over whether DNA is *literally* an informational code (semantic content) or *metaphorically* code-like.
      *   **Constraint:** Use *exclusively* patent law vocabulary to restate the debate.
      *   **Specific Analogies Required:**
          *   Genetic sequence vs. enabling disclosure.
          *   Point mutations vs. claim amendments or infringement by equivalents.
          *   "Reading" DNA vs. interpreting agent (Person Skilled in the Art - PHOSITA).
      *   **Deliverable:** A "Residue Report" analyzing the mapping (clean fits, distorted fits, no legal counterpart).
      *   **Analysis of Residue:** Distinguish whether gaps stem from patent vocabulary limitations or philosophical imprecision.
      *   **Confidence Assessment:** State confidence levels and identify the point of least certainty.

  2.  **Deconstruct the Philosophical Debate:**
      *   *Literalist View (e.g., Maynard Smith, Dawkins):* DNA contains semantic information. It has syntax and semantics. It specifies traits. It's a code in the same sense computer code or language is code.
      *   *Metaphorist/Causal View (e.g., Keller, Oyama, Griffiths):* DNA is just a chemical template. "Information" is a loose metaphor for causal correlation. The cell machinery does the "work," not the DNA alone. There is no "meaning" without the context of the developmental system.

  3.  **Translate to Patent Law Vocabulary (The "Claim Construction"):**

      *   *The "Literal Code" Position:* DNA is like a patent specification. It contains an *enabling disclosure*. It teaches the PHOSITA (the cellular machinery) how to make the invention (the phenotype). The sequence is the *claim language* that defines the scope.
      *   *The "Metaphor" Position:* DNA is more like a physical model or a raw material. It doesn't "teach" anything. The phenotype arises from the interaction of the material with the environment. There is no *written description* separate from the physical embodiment.

      *   *Specific Analogy 1: Enabling Disclosure.*
          *   Literalist: The sequence *is* the enabling disclosure. It satisfies 35 U.S.C. § 112.
          *   Metaphorist: The sequence is not enabling without the specific "lab conditions" (cellular context). It's more like a deposit of a biological sample than a written spec.

      *   *Specific Analogy 2: Mutations vs. Amendments/Equivalents.*
          *   Literalist: A point mutation is like a *claim amendment*. It changes the scope/definition of the invention. If it still works, it's under the *doctrine of equivalents*.
          *   Metaphorist: A mutation is just a physical change, like a manufacturing defect. It's not a change in "instructions," just a change in the substrate.

      *   *Specific Analogy 3: Reading/PHOSITA.*
          *   Literalist: The ribosome/transcription machinery is the PHOSITA. It "reads" the specification.
          *   Metaphorist: There is no PHOSITA. There is only causal chemistry. "Reading" implies intent/semantics which don't exist.

  4.  **Drafting the Restatement (The "Brief"):**
      *   Need to sound like a patent lawyer arguing a claim construction dispute.
      *   *Issue:* Is the genetic sequence a "specification" or a "device"?
      *   *Party A (Literalists):* Argue the sequence constitutes a written description and enablement.
      *   *Party B (Metaphorists):* Argue the sequence is merely a structural limitation without instructional content.

  5.  **Drafting the Residue Report:**
      *   *Clean Maps:* Enablement/Functionality, Doctrine of Equivalents/Tolerance.
      *   *Distorted Fits:* PHOSITA (Ribosome isn't "skilled," it's deterministic), Infringement (Nature doesn't infringe).
      *   *No Counterpart:* Semantic "Meaning" (Patent law cares about scope, not truth/meaning), Intent/Teleology.
      *   *Source of Gap:* Is it the law's fault or the philosophy's fault?
      *   *Confidence:* High on structural analogies, lower on semantic analogies.

  6.  **Refining the Vocabulary (Self-Correction/Constraint Check):**
      *   *Check:* Did I use biological terms? *Correction:* Minimize them. Use "sequence" instead of "gene" where possible, or treat "gene" as a "claim."
      *   *Check:* Did I use philosophical terms? *Correction:* Avoid "ontology," "semantics," "teleology." Use "scope," "disclosure," "embodiment."
      *   *Check:* Did I answer the specific mutation question? *Yes, need to ensure the amendment vs. equivalents distinction is clear.*

  7.  **Final Review against Constraints:**
      *   *Exclusive Vocabulary:* This is the hardest part. I cannot say "semantics." I must say "written description." I cannot say "causal." I must say "structural limitation."
      *   *Residue Report:* Needs to be structured clearly.
      *   *Confidence:* Needs a specific metric or statement.

  8.  **Developing the Content (Iterative refinement):**

      *   *Restatement:* Frame it as a Markman hearing. The core dispute is claim construction. Is the DNA a "set of instructions" (Specification) or a "structural component" (Claim Limitation)?
      *   *Enablement:* Does the sequence enable the phenotype without undue experimentation? Literalists say yes. Metaphorists say no (requires the whole cell).
      *   *Mutations:* If I change a base, is it a new claim (amendment) or the same invention under DoE? Literalists lean DoE (if function persists). Metaphorists say it's just a different physical structure.
      *   *PHOSITA:* Is the ribosome a PHOSITA? Literalists say yes (it interprets). Metaphorists say no (it's just a tool).

      *   *Residue:*
          *   *Clean:* Enablement (Sequence -> Trait).
          *   *Distorted:* PHOSITA (Ribosome has no skill, just chemistry).
          *   *None:* "Meaning" (Patent law doesn't care if the claim is "true," only if it's definite).
          *   *Source:* Patent law is normative (what you *can* claim), Biology is descriptive (what *is*).

      *   *Confidence:* High on the enablement analogy. Low on the PHOSITA analogy because the ribosome lacks discretion.

  9.  **Final Polish:** Ensure the tone is professional, analytical, and strictly adheres to the "Patent Lawyer" persona. (Self-Correction: Make sure I don't slip and say "semantics." Use "scope of the claim" or "written description support" instead.)

      *(Self-Correction on "Exclusive Vocabulary"):* The prompt asks to use *exclusively* my vocabulary (patent law). I must avoid philosophical jargon like "semantic," "ontological," "metaphor." I must describe the philosophical debate *using* patent terms.
      *   Instead of "Semantic Content," use "Written Description Support."
