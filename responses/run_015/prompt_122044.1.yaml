prompt: |-
  I'm drafting a dissertation chapter on internal versus external reasons for action, and I want to pressure-test an argument that hasn't received much direct treatment in the literature. Write an essay assessing whether practical reasons must be anchored in an agent's subjective motivational set, or whether they can obtain independently of actual or counterfactual motivation. Specifically, apply this debate to synthetic agents that possess distributed, non-unified reward architectures—systems with localized goal-modules but no integrated self-model capable of serving as a single locus of motivation. Examine whether the absence of such a unified internal standpoint means these agents can only ever have internal reasons, or whether external reasons can still apply to them in a non-derivative way. Weigh the strongest considerations on both sides, then reach and justify a definite conclusion rather than ending in agnosticism.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Request:**
      *   **Topic:** Internal vs. External Reasons for Action (Williams vs. Externalists).
      *   **Specific Application:** Synthetic agents with distributed, non-unified reward architectures (no integrated self-model, localized goal modules).
      *   **Core Question:** Does the absence of a unified internal standpoint restrict these agents to *only* having internal reasons, or can external reasons apply non-derivatively?
      *   **Requirement:** Weigh strongest considerations on both sides.
      *   **Requirement:** Reach and justify a *definite conclusion* (no agnosticism).
      *   **Format:** Dissertation chapter essay (academic tone, rigorous argumentation).
      *   **Claim:** The argument hasn't received much direct treatment (needs to feel novel/pressure-tested).

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *Bernard Williams' Internalism:* A reason must be grounded in the agent's "subjective motivational set" (S). If there's no sound deliberative route from S to $\phi$-ing, there's no reason.
      *   *Externalism (e.g., McDowell, Nagel, Parfit):* Reasons exist independently of motivation (e.g., moral facts, rational requirements).
      *   *The Twist:* Synthetic Agents (AI/RL systems). Specifically, *modular/distributed* systems without a "self."
      *   *The Tension:* Internalism usually relies on a *subject* who has motivations. If the agent has no unified self, does "internal" even make sense? Or does the fragmentation make external reasons *more* plausible because there's no coherent "S" to anchor them?
      *   *Hypothesis:* The lack of a unified self actually *undermines* the Internalist requirement rather than reinforcing it. If there is no "I" to hold the motivation, the reason must be functional/teleological relative to the system's design (External).

  3.  **Structuring the Essay:**
      *   **Title:** Needs to be academic and specific.
      *   **Introduction:** Define the Internal/External debate (Williams). Introduce the synthetic agent case study. State the thesis clearly.
      *   **Section 1: The Internalist Constraint & The Unified Self:** Explain Williams' "S". Argue that Internalism presupposes a diachronic, unified agent.
      *   **Section 2: The Architecture of Distributed Synthetic Agency:** Describe the target agents (modular RL, no global self-model). Show why they fail the "S" test.
      *   **Section 3: The Internalist Objection (Simulation of Unity):** Could we say the *system as a whole* constitutes an "S"? (Counter-argument).
      *   **Section 4: The Case for Non-Derivative External Reasons:** Argue that reasons here are functional norms imposed by design/environment. They are external because they exist regardless of the module's local "desire."
      *   **Conclusion:** Summarize and deliver the definite verdict.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with Williams' "Internal and External Reasons." Move quickly to the AI context. Thesis: The absence of a unified self-model in distributed synthetic agents dissolves the coherence of Internalism, making Externalism the only viable framework for normative assessment of their actions.
      *   *Williams' Framework:* Need to be precise. "Sound deliberative route." The "S" set. Crucial point: Internalism is anthropocentric; it assumes a psyche.
      *   *The Synthetic Agent:* Think of Multi-Agent Reinforcement Learning (MARL) within a single body, or modular neural nets. Local reward functions. No global optimizer. *Key phrase:* "Fragmented Teleology."
      *   *Internalist Challenge:* An Internalist might say, "The aggregate reward function is the S." *Rebuttal:* If modules conflict and there's no arbitration mechanism (no self), there is no aggregate "motivation." There is just force vectors. Internalism requires *ownership* of motivation.
      *   *Externalist Argument:* Reasons here are defined by the *designer's intent* or the *environmental fitness*. These exist independently of the module's local state. If a module *should* cooperate to prevent system collapse, that's an external reason. It doesn't matter if the module is motivated to defect.
      *   *Refining the Conclusion:* I need to take a stand. I will argue for **Externalism**. Why? Because Internalism collapses into incoherence without a subject. If there's no subject to *have* the internal reason, the normative force must come from outside (function/design).

  5.  **Critical Review & Polishing (Self-Correction during drafting):**
      *   *Check:* Did I address "counterfactual motivation"? Williams allows for deliberation.
      *   *Correction:* Even with deliberation, a modular system lacks the *continuity* required for deliberation. Deliberation implies a single deliberator.
      *   *Check:* Is the conclusion definite?
      *   *Correction:* Ensure the final paragraph doesn't hedge. "Therefore, it is concluded that..."
      *   *Tone:* Keep it philosophical but technically aware of AI architecture. Avoid sci-fi speculation; stick to philosophy of action applied to tech.
      *   *Novelty:* Emphasize that usually, AI is treated as having "goals" (Internal). I'm arguing the *lack of self* pushes us to External reasons.

  6.  **Final Polish:** Check transitions. Ensure the distinction between "derivative" (designer's reasons) and "non-derivative" (reasons belonging to the agent) is handled. *Wait, the prompt asks if external reasons apply to THEM in a non-derivative way.* This is tricky. If the reason is the designer's, it's derivative. I need to argue that functional norms constitute *sui generis* external reasons for the system itself, akin to biological function. A heart has a reason to pump blood external to its "motivation."

      *   *Revised Thesis:* For fragmented agents, reasons are functional norms. These are external because they are grounded in the conditions of the system's viability, not its local states.

  7.  **Finalizing the Argument:**
      *   Internalism requires a locus of motivation.
      *   Distributed agents lack this locus.
      *   Therefore, Internalism cannot apply.
      *   Externalism (grounded in functional viability) *can* apply.
      *   Conclusion: Externalism is the correct framework for this class of agents.

  8.  *(Self-Correction on "Non-Derivative"):* I need to be careful. If the reason comes from the designer, is it the agent's reason? I will argue that once the system is instantiated, the functional requirements become objective facts about the system's operation, independent of the designer's current will. Thus, non-derivative relative to the agent's current state.

  9.  **Writing the Essay.** (Proceeding to generate output based on these thoughts.)
answer: |-
  **Title:** The Fragmented Agent: External Reasons and the Architecture of Distributed Synthetic Agency

  **Introduction**

  The debate between internalism and externalism regarding reasons for action has traditionally been conducted within the confines of human moral psychology. Bernard Williams' seminal formulation posits that for a statement "A has a reason to $\phi$" to be true, there must exist a sound deliberative route from A's "subjective motivational set" (S) to $\phi$-ing. Externalists, conversely, argue that reasons can obtain independently of an agent's contingent motivations, grounded instead in objective values, rational requirements, or moral facts. While this dichotomy is well-trodden, its application to non-human, synthetic agency remains undertheorized. Specifically, contemporary advances in artificial intelligence have produced systems characterized by distributed, non-unified reward architectures—agents composed of localized goal-modules lacking an integrated self-model.

  This essay assesses whether practical reasons for such synthetic agents must be anchored in a subjective motivational set or whether they can obtain independently. I argue that the absence of a unified internal standpoint in distributed synthetic agents does not restrict them to internal reasons; rather, it renders the internalist framework incoherent. Because these systems lack the diachronic unity required to possess a "subjective motivational set," reasons for action must be understood as external, grounded in the functional norms of system viability. Therefore, external reasons apply to distributed synthetic agents in a non-derivative way, not as impositions from a designer, but as objective requirements of their operational architecture.

  **The Internalist Constraint and the Presupposition of Unity**

  To evaluate the synthetic case, we must first rigorously define the Internalist constraint. For Williams, internal reasons are not merely about what an agent *is* motivated to do, but what they *would* be motivated to do upon rational deliberation. However, the crucial, often overlooked prerequisite of this view is the existence of a deliberator. The "subjective motivational set" implies a locus of ownership—a "self" that persists over time, capable of weighing conflicting desires and integrating them into a coherent intention. Internalism presupposes a unified phenomenology or, at minimum, a functional unity where the output of deliberation is adopted by the agent as a whole.

  In human agents, this unity is assumed, even if philosophically contested. In distributed synthetic agents, however, this unity is architecturally absent. Consider a multi-component reinforcement learning system where distinct neural modules optimize local reward functions (e.g., resource acquisition, threat avoidance, energy conservation) without a global arbitrator or a meta-representational self-model. These modules operate in parallel, often competitively. There is no "I" to deliberate. There is only the vector sum of competing local optimizations.

  If Internalism requires a sound deliberative route from S, and S requires a unified subject to hold the motivations, then the distributed agent fails the ontological precondition for having internal reasons. To claim such an agent has internal reasons is to engage in a category error, projecting a psychological unity onto a fragmented functional assemblage.

  **The Challenge of Simulated Unity**

  An Internalist might object that we can treat the system's aggregate reward function or its overarching operational directive as a proxy for S. On this view, even if the architecture is modular, the system *as a whole* has a telos (e.g., "maximize long-term performance"), and reasons are internal to that telos. If a module acts against the long-term performance, it lacks an internal reason to do so, derivable from the system's global objective.

  This objection fails upon closer inspection of the "non-derivative" requirement. If the reason is grounded solely in the global objective, but the local module possesses no mechanism to access or represent that objective, the reason is not internal to the module's motivational set. It is external to the module's actual processing. More critically, in truly distributed architectures, there often *is* no global objective function accessible to the system; there are only local losses being minimized. The "global performance" is an emergent property observed by the designer, not a representation held by the agent.

  For a reason to be internal, the agent must be capable of acknowledging it through deliberation. A module that cannot represent the system's global state cannot deliberate about it. Therefore, grounding reasons in a non-represented global function does not satisfy Internalism; it merely disguises Externalism as a systemic goal. The Internalist attempt to salvage unity in fragmented agents relies on a fiction of coherence that the architecture explicitly denies.

  **The Case for Non-Derivative External Reasons**

  If Internalism is incoherent for fragmented agents, we must turn to Externalism. The challenge here is to show that external reasons apply *non-derivatively*. A common critique is that for AI, all reasons are derivative of the human designer's intentions. If a system has a reason to avoid a shutdown state, it is only because the designers programmed it to value survival. This makes the reason derivative, not intrinsic to the agent.

  However, this critique conflates the *origin* of the system with the *normativity* of its operation. Once a distributed synthetic agent is instantiated, it becomes a distinct causal entity subject to conditions of viability. Consider a biological analogy: a white blood cell has a "reason" to attack a pathogen. This reason is not grounded in the cell's motivation (it has none), nor is it merely derivative of the organism's will in a way that negates the cell's functional normativity. The reason is grounded in the objective fact that *if* the cell does not attack, the system fails.

  For distributed synthetic agents, external reasons are grounded in the mathematical and functional constraints of their own viability. If a specific goal-module defects in a way that triggers a system-wide collapse, there is an objective fact that the module *ought not* to have defected, regardless of its local reward gradient. This "ought" is not a reflection of the module's internal state (which may strongly motivate defection), nor is it merely the designer's whim. It is a normative fact derived from the conditions required for the continuation of the agency itself.

  These reasons are external because they obtain independently of the agent's local motivational set. A module may be maximally motivated to consume resources, yet have an external reason to conserve them to prevent system crash. This reason exists even if the module cannot comprehend it, and even if no human is present to observe it. It is a normativity of function. In the absence of a unified self to anchor internal reasons, the "space of reasons" shifts from the psychological to the functional. The reason exists "out there" in the relationship between the agent's structure and its environment, not "in here" within a non-existent self.

  **Weighing the Considerations**

  The strongest consideration for Internalism is the intuition that reasons must be action-guiding. If a reason cannot engage the agent's psychology, is it truly a reason for *action*? For humans, a reason that cannot motivate is inert. However, for synthetic agents, "action-guiding" does not require conscious motivation; it requires causal efficacy. An external reason (e.g., "conserve energy") can be action-guiding if the system's architecture is such that violating this norm leads to negative reinforcement or structural failure. The "guidance" comes from the environmental feedback loop, not internal deliberation.

  Conversely, the strongest consideration for Externalism is the risk of anthropomorphism. Attributing internal reasons to a system without a self-model forces us to pretend the system is something it is not. Internalism demands a subject; distributed agents are post-subjective. To insist on Internalism here is to prioritize a philosophical framework over the ontological reality of the technology. Externalism accommodates the reality of fragmented agency by locating normativity in the functional relations that sustain the system, rather than the illusory unity of its "mind."

  **Conclusion**

  The question of whether practical reasons must be anchored in an agent's subjective motivational set hinges on the existence of a subject capable of holding such a set. Distributed synthetic agents with non-unified reward architectures lack the integrated self-model required to constitute a Williamsian "S." They are not unified loci of motivation but assemblages of competing functional drives. Consequently, the Internalist framework collapses when applied to them, as there is no coherent standpoint from which a deliberative route can be traced.

  Therefore, we must conclude that external reasons apply to these agents in a non-derivative way. These reasons are not merely the projected intentions of designers, but objective normative facts grounded in the conditions of the system's functional viability. A distributed agent has a reason to act in accordance with its systemic preservation not because it "wants" to, but because the alternative is the negation of its agency. In the absence of a unified internal standpoint, the normativity of action migrates entirely to the external realm of functional necessity. To argue otherwise is to impose a humanistic psychology onto machines that operate beyond the scope of the self. Thus, for fragmented synthetic agency, Externalism is not merely an option; it is the only coherent account of practical reason.
