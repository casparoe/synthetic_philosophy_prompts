          *   Darwinian: Fixed response. If the code doesn't match, they die. No individual adaptation.
          *   Skinnerian: Random variation in action. Success is reinforced. No understanding of the fungus, just "touching it = bad."
          *   Popperian: Internal testing. "If I touch it, I die." Can choose *not* to touch based on simulation.
          *   Gregorian: Using a tool or sign left by another. "The red mark means death."
      *   *Forbidden Traits:* No "fear," no "seeing" (use chemical/tactile sensing), no "I thought."

  5.  **Drafting Section 3: Misconception Terrain:**
      *   *Darwinian:* "Primitive Instinct." *Correction:* It's not primitive; it's optimized code. *Intercept:* Intro. *Question:* "Does the creature learn, or did its ancestors learn for it?"
