      *   *Popperian:* "Being Clever." *Correction:* It's about *risk mitigation*, not intelligence per se. *Intercept:* Section 3. *Question:* "Where did the error occur? In the world or in the head?"
      *   *Gregorian:* "Vocabulary." *Correction:* It's about *scaffolding*. *Intercept:* Section 4. *Counter-example:* A knot in a string (memory aid) vs. remembering the number.

