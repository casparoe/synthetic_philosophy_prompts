      *   *Task:* Write 3 paragraphs. Popperian POV. No Gregorian tools (no language, no marks).
      *   *Success Criteria:* Internal simulation described as physical/structural, not linguistic. Avoiding the threat via prediction, not just reflex.
      *   *Failure Mode:* Using words like "realized," "knew," or using symbols.

  7.  **Drafting Section 5: Exclusions:**
      *   Explicitly list what is *not* in the room. Neurobiology, Evolution history, LLMs, Citations. Keep it focused on *narrative mechanics*.

