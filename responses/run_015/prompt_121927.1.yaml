answer: |-
  # Teaching Plan: Tranquilism as Coherent Axiology (50 Minutes)

  ### 1. Introduction and Framing (0:00–0:05)
  *   **Goal:** Establish the session as conceptual analysis, not clinical diagnosis.
  *   **Action:** State clearly that tranquilism is an axiological thesis (about value), not a psychological profile. Explicitly anticipate the **Pessimism Misconception** here. Tell the group: "You may hear this and think it is merely a gloomy view of life. That is a category error. We are analyzing the structure of value, not the mood of the valuer."
  *   **Rule:** No clinical terms (depression, anhedonia) allowed in the discussion.

  ### 2. The First Distinction: Dependency Order (0:05–0:15)
  *   **Goal:** Secure the conceptual separation between *Relief* and *Tranquility*.
  *   **Action:** Draw a timeline on the board.
      *   **Relief:** Define as *parasitic*. It requires a prior negative state (pain, craving, anxiety) to exist. It is the removal of a deficit. Its value is derivative.
      *   **Tranquility:** Define as *non-parasitic*. It is the neutral absence of craving that never arose. It does not depend on a prior negative state. Its value is intrinsic (according to the view).
  *   **Key Point:** Emphasize that Relief is a return to zero; Tranquility is staying at zero. If value lies only in the absence of suffering, Tranquility is the fundamental good, while Relief is merely instrumental (valuable only insofar as it restores Tranquility).

  ### 3. The Carrying Case: Two Lives (0:15–0:30)
  *   **Goal:** Ground the distinction in a concrete comparison without triggering moral or clinical biases.
  *   **The Pair:**
      1.  **The Crisis Manager (Relief):** A high-functioning emergency coordinator. Their life is a series of spikes: high stress/craving followed by successful resolution (relief). They experience frequent "highs" of relief but never a sustained period without craving. They are never depressed, just constantly engaged in solving urgent problems.
      2.  **The Archivist (Tranquility):** A meticulous records keeper in a stable environment. Their work is steady, predictable, and generates no urgent cravings or anxieties. They do not experience euphoric achievements, nor do they experience significant suffering. They maintain a stable baseline where craving never arises.
  *   **Constraints:**
      *   **Avoid:** Do not make the Archivist a monk/saint (too ascetic) or the Manager a victim (too pathological). Both are socially functional and healthy.
      *   **Demonstrate:** The Manager's "good moments" are strictly relief from prior stress. The Archivist's life is composed entirely of the neutral absence of craving.
      *   **Avoid:** Do not imply the Archivist is bored. Frame their state as "satiated neutrality."
  *   **Activity:** Ask the group to identify where the "value" lies in each life according to tranquilism. (Answer: The Archivist's baseline is intrinsically valuable; the Manager's peaks are only instrumentally valuable for restoring baseline).
  *   **Correction Point:** If someone argues the Manager's relief feels better, intervene with **Direct Correction** on the **Denies Pleasure Misconception**. Clarify: "Tranquilism does not deny the feeling exists; it denies it has *intrinsic* value. It is a claim about accounting, not sensation."

  ### 4. Misconception Management Sequence (0:30–0:45)
  *   **Goal:** Navigate objections without losing the thread.
  *   **Sequence & Handling:**
      1.  **Pessimism:** (Handled in Intro via Anticipation).
      2.  **Denies Pleasure:** (Handled during Case via Direct Correction).
      3.  **Implies Suicide is Rational:** (0:35–0:40). **Let them voice this aloud.** It is the most visceral objection. Allow the group to raise the "non-existence is best" argument. Then correct it by distinguishing between *absence of suffering* (good) and *absence of subject* (neutral/no value). Tranquilism values the experience of tranquility, not the void.
      4.  **Collapses into Standard Hedonism:** (0:40–0:45). **Save for the end.** This is the **Deepest Misconception**.
  *   **Deep Dive (Hedonism Collapse):** Address the neuroscientist's likely objection: "Relief activates reward pathways; therefore it is pleasure; therefore this is just hedonism."
      *   **Counter:** Explain that hedonism counts the *positive sensation* as the good. Tranquilism counts the *absence of the negative drive* as the good. Even if relief feels pleasant, its value is contingent on the prior pain. Tranquility's value is not contingent. Conflating them erases the asymmetry that defines the view.

  ### 5. Check Question and Close (0:45–0:50)
  *   **Goal:** Test conceptual grasp, not agreement.
  *   **Check Question:** "If a life contains 10 units of tranquility (no craving) and 0 units of pleasure, versus a life with 0 units of tranquility (constant mild craving) and 10 units of relief-based pleasure, does tranquilism value them equally?"
      *   **Correct Answer:** No. The first life is intrinsically better; the second life's value is only instrumental and dependent on the craving.
  *   **Explicit Omissions:** State clearly: "We are refusing to discuss the clinical neuroscience of anhedonia or therapeutic applications."
      *   **Why:** Introducing pathology protects the conceptual point. If we discuss anhedonia, the view becomes a symptom to be cured rather than a theory of value to be evaluated. We must keep the axiology separate from the physiology.

  ***

