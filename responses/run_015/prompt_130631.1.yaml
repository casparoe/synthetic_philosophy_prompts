answer: |-
  Based on the pattern of verdicts you've described, here is the breakdown of your friend's position, her likely ruling on your facility case, and the specific philosophical lever you can use to test it.

  ### 1. The Verdict on the Sealed Facility
  **She will say it is wrong.**

  Even though no human sees it, no worker is brutalized, and the owners claim their characters are unaffected, a consistent Kantian (especially one influenced by the chatbot verdict) cannot approve of this.

  **The Rule She Is Running:**
  She is operating on a **Duty to Self (Moral Perfection)** interpretation of Indirect Duty, rather than a **Consequentialist Character** interpretation.
  *   **Consequentialist Character View:** Cruelty is wrong *because* it statistically increases the likelihood you will hurt humans later. (If you can prove you won't hurt humans later, the act is permissible).
  *   **Duty to Self View:** Cruelty is wrong because the *maxim* (the principle behind the action) involves disregarding the analogue of suffering. This violates your duty to cultivate your own moral sensibilities, regardless of whether that degradation is empirically visible to others or even to yourself.

  **Why the Facility Fails:**
  The owners "never thinking about it" is not a defense; it is an accusation. In Kantian ethics, willful ignorance or structural distancing does not absolve the rational agent of the maxim they have willed into existence. By authorizing a system that produces suffering for convenience (even for feeding the poor), they are adopting a maxim that treats the *appearance* of moral concern as optional. They are willing a world where they are the hidden authors of pain.

  ### 2. The Closest Analog: The Chatbot Case
  You are right to suspect the chatbot case does the heavy lifting here. It is the closest analog, and **it cuts decisively toward "Wrong."**

  *   **The Logic:** In the chatbot case, there is **zero suffering**. There is **no victim**. Yet, she says it is wrong. This proves that for her, the wrongness is not located in the *consequences for the object* (since the object feels nothing), nor in the *social consequences* (assuming you poke it privately).
  *   **The Implication:** The wrongness is located entirely in the **agent's disposition**. If *simulating* cruelty is wrong because it corrupts the will, then *actual* cruelty (the facility) must also be wrong, even if hidden. The "sealed" nature of the facility is morally irrelevant if the chatbot (which is "sealed" from reality) already triggers the prohibition.
  *   **Why not the Old Dog?** The old dog case is a close second, but it allows for the possibility that killing the dog *is* permissible if done without "bad character" (e.g., painlessly, with gratitude). The facility case is more like the chatbot: it involves the *production of suffering* (or the simulation of it) as a byproduct of utility.

  ### 3. The One Extra Case to Tell the Rules Apart
  To definitively prove whether she is holding the **Consequentialist Character View** (Act is wrong if it damages your psychology) or the **Duty to Self View** (Act is wrong if the maxim is corrupt), propose this case:

  **The "Psychologically Immune Agent" Case**
  > "Imagine a person who, due to a unique neurological condition, is biologically incapable of desensitization. They can torture animals all day, and their empathy for humans resets instantly every night. They never become violent toward people, never lose sympathy, and never suffer any psychological degradation. No one else knows what they do."

  *   **If she says Permissible:** She is committed to the **Consequentialist Character View**. This implies the Sealed Facility *might* be permissible if the owners are truly unaffected. This contradicts the Chatbot verdict (which suggests the act itself is the problem), so she would be inconsistent.
  *   **If she says Wrong:** She is committed to the **Duty to Self View**. The act is wrong because the *maxim* is corrupt, regardless of the empirical effect on their psyche. This confirms the Sealed Facility is wrong, because the owners' "unaffected character" is irrelevant; they have still willed a maxim of disregarding suffering.

  ### Summary for Your Argument
  When you talk to her, focus on the **Chatbot**. Remind her that she condemned an act that caused *no suffering* because of what it said about the *actor*. Ask her why the *actor's* hidden authorization of *real suffering* in the facility is any different. If the simulation of pain corrupts the will, the actualization of pain must corrupt it more, regardless of whether the curtains are drawn.
