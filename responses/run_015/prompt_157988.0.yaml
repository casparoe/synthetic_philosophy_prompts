      *   *Did I include a result the philosopher will dislike?* Yes, Case 1 prioritizes implantation success over disease risk reduction. This undermines strict PB.
      *   *Two-embryo transfer?* Included in Step 5.
      *   *Stopping points?* Included in Step 3 and 5.

  9.  **Final Polish:** Ensure tone is professional, ethical, and direct. Make sure the "dislike" case is clearly identified as such. (Self-correction: Ensure the distinction between "harm" and "benefit" is crisp in the script).

      *Wait, one nuance:* The prompt asks for "what counts as a sufficient answer to each." I need to make sure the criteria for passing each step are clear.
      *Also:* "Guidance on the two-embryo transfer case, whether to take the two highest-ranked or to hedge." I need to be specific here. Hedging (diversifying risk) is usually ethically safer than maximizing one profile if twins are possible, but medically, double transfer is often discouraged now. I will assume the clinic allows it but advise on risk distribution.
      *Also:* "Closing by telling me how confident you are... and singling out the one step you are least confident about."

      *Let's refine the "Dislike" case.* If I make the procedure prioritize implantation success over disease risk, a PB philosopher will hate it because PB says "select the child with the best life," not "select the child most likely to exist." However, a *pragmatic* ethicist knows that a failed cycle is a net negative (cost, emotional toll, delay). I will frame the procedure to require a "Minimum Viability Threshold." If the healthier embryo is below that threshold, you pick the less healthy one. This is the compromise a philosopher might dislike as impure.

      *Let's refine the Social Trait distinction.* Counselors can't judge "discrimination." They can judge "Medical Diagnosis." Rule: If it's not on the WHO ICD list or equivalent medical guideline, it's Tier 2. That's operationalizable.

      *Let's refine the Ancestry constraint.* If ancestry is mixed or non-European, PRS for EA/Height is scientifically invalid. The procedure must mandate discarding that data for decision making.

      *Let's refine the Non-Identity script.* "Choosing Embryo A does not spare Embryo B from suffering. Embryo B will not exist. You are choosing between Person A and Person B."

      *Okay, ready to write.*

