      *   *Step 2 (Framing):* The "No Harm" script.
      *   *Step 3 (Categorization):* Health (Tier 1) vs. Social (Tier 2).
      *   *Step 4 (Probability):* Implantation chance vs. Trait benefit.
      *   *Step 5 (Multi-transfer):* Risk diversification.
      *   *Case Studies:*
          1.  Diabetes vs. Implantation (The "Dislike" case).
          2.  Educational Attainment (The Social Trait).
          3.  Late-Onset Exclusion (The Value Veto).
      *   *Confidence/Weakness:* Confidence moderate. Weakest step is the Health/Social distinction (it's porous).

  8.  **Self-Correction/Review against constraints:**

      *   *Did I address the Non-Identity Problem plainly?* Yes, in Step 2 script.
      *   *Did I address the Discrimination/Social Trait distinction?* Yes, Tier 1 vs Tier 2.
      *   *Did I include the Ancestry constraint?* Yes, Step 1.
