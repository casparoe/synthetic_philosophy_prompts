  5.  **Refining the Procedure for Counselor Usability:**

      *   Avoid terms like "Non-Identity Problem." Use "Selection vs. Treatment."
      *   Avoid "Universalizability." Use "Medical vs. Social."
      *   Make the Ancestry Check Step 0. If non-European, PRS for EA/Height is noise.

  6.  **Addressing Specific Constraints:**

      *   *Harm-based objections:* Explicit script required. "We are not treating a patient; we are selecting a candidate."
      *   *Social Traits:* Create a "Category B" trait list (Height, EA). Rule: Cannot trump Category A (Disease).
      *   *Two-Embryo Transfer:* Rule: Do not double up on risk. If transferring two, they should not both carry high risk for the same condition (diversification).
      *   *Stopping Points:* When parents demand Category B over Category A, or when PRS validity is low.

