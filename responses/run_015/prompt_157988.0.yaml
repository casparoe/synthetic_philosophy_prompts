      *Let's finalize the "Dislike" case.* I will make sure Case 1 results in selecting the embryo with *higher* disease risk because the implantation chance is significantly higher. A strict PB proponent argues you should select the "best" child even if the chance is lower (provided it's non-zero). My procedure will prioritize *having a child* over *optimizing the child* when the gap in viability is large. This is the "Existence Precedes Essence" pragmatic override.

