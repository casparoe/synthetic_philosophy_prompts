      *   *Case 2: Social Trait (Height/EA).*
          *   Embryo A: Average Health, High EA/Height.
          *   Embryo B: Average Health, Average EA/Height.
          *   *Conflict:* Is EA a valid target?
          *   *Procedure Outcome:* Should flag this as "Social Competitive" and recommend against prioritizing it over health, or require explicit parental justification that doesn't rely on bias.
      *   *Case 3: Late-Onset Untreatable (Huntington's style but late).*
          *   Parents want to exclude *all* embryos with the variant.
          *   *Conflict:* All embryos have it? Or just some? Prompt says "every embryo excluded that carries a variant...". If *all* carry it, do they cycle again? If *some*, they discard carriers.
          *   *Constraint:* Condition affects life after 50.
          *   *Procedure Outcome:* If discarding carriers leaves no embryos, the procedure must stop the cycle or force a value decision. If it leaves embryos, is it permissible to discard a viable embryo for a post-50 condition? PB says yes (better life), but is it *required*?
