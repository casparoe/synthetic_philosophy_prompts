      *   **Specific Requirements:**
          1.  Ordered questions with sufficient answer criteria.
          2.  Address the "Non-Identity Problem" aspect (choice is conditional on fixed embryos; no harm to specific person).
          3.  Rule for traits beneficial only due to discrimination/social bias (vs. health).
          4.  Guidance on two-embryo transfer (maximize vs. hedge).
          5.  Stopping points (when to hand off to couple/medical director due to value conflicts).
          6.  Run the procedure on three specific cases (Diabetes vs. Implantation; Social Trait; Late-onset Untreatable Condition).
          7.  Include at least one case where the procedure returns an answer the user (philosopher) will dislike.
          8.  Constraint: PRS trained on European ancestry (limited validity for others).
          9.  Constraint: Counselors have biology training, no philosophy (distinctions must be operationalizable, not theoretically deep).
          10. Closing: Confidence level and least confident step.

  2.  **Deconstruct the Ethical Landscape:**

      *   *Procreative Beneficence (PB):* Parents have a moral obligation to select the child expected to have the best life.
      *   *The Problem:* PB is vague. Does "best life" mean health? Happiness? Social success? Aggregate scores collapse these.
      *   *Non-Identity Problem:* Selecting Embryo A over Embryo B doesn't harm B (B never exists). So, "harm reduction" isn't the right frame. It's about "benefit maximization" within limits.
      *   *Social Traits (Height/EA):* These are often zero-sum or dependent on unfair social structures. Selecting for them might reinforce inequality or be ethically distinct from selecting against disease.
      *   *PRS Limitations:* Ancestry bias is huge. Counselors need to know when the data is noise.
      *   *Counselor Capacity:* They need a flowchart/checklist, not a seminar on Parfit.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* A step-by-step filter.
      *   *Step 1: Data Validity Check.* (Addressing the ancestry constraint). If the data is bad, stop using it for selection.
      *   *Step 2: The Non-Identity Clarification.* (Addressing the harm constraint). Explicitly state: "We are not preventing harm to *this* child, we are choosing which possible child to bring into existence."
