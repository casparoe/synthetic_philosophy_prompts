answer: |-
  **RFC-0187: The Self as a Derived View**

  **Summary**
  We are deprecating the legacy `self` service, which treats user identity as a stored entity, in favor of `narrative_vector`, a computed abstraction. The legacy model assumes the self is a concrete object resident in the `users` table. The new model treats the self as a center of narrative gravity: a useful fiction derived from the distribution of stories told about and by the account. This view is unstorable, supports counterfactual prediction, and may resolve to coordinates outside the user's physical body.

  **Background**
  The current `self` service incurs high latency and consistency costs because it attempts to persist a thing that does not exist. Engineering has operated under the assumption that a user's identity is a static row updated via `PUT` requests. However, analysis suggests identity is better modeled as an abstraction over event streams (logins, posts, third-party mentions, support tickets). Much like a physical object's center of gravity is a real, locatable point that supports mechanical predictions despite containing no matter, the `narrative_vector` supports behavioral predictions without requiring storage.

  **Non-goals**
  *   Solving the hard problem of consciousness.
  *   Preserving access for accounts with insufficient narrative mass.
  *   Adjudicating which narrative cluster represents the "true" user in bifurcation events.

  **Design**
  The `narrative_vector` is computed on-read by aggregating weighted events over a rolling 90-day window.
  *   **Inputs:** `user_generated_content`, `admin_notes`, `third_party_mentions`, `login_patterns`.
  *   **Weighting:** First-person reports (e.g., profile updates, support claims) are treated as noisy signals with a reliability coefficient of 0.6. They are not ground truth. Third-party assertions (e.g., tags, mentions) carry equal weight.
  *   **Location:** Each event carries a latency-derived geographic coordinate. The `self` location is the centroid of these coordinates weighted by narrative mass.
  *   **Validation:** An eval comparing a churn prediction model consuming raw events vs. one consuming the `narrative_vector` shows a 4.2% lift in AUC when using the vector. The abstraction earns its keep.

  > **[Comment: Dave (Staff Eng)]** I'm concerned we're losing fidelity here. If the vector is just a computation, where is the actual user stored? When I call `get_self()`, I need to know I'm hitting the real person, not just an aggregate of their logs. Otherwise, how do we know who to bill?
  >
  > **[Response: Author]** There is no "actual user" stored separately from the logs. Billing targets the account ID associated with the highest mass cluster. If the computation returns null, there is no one to bill.

  **Edge Cases**
  1.  **External Center of Gravity:** For high-profile accounts (e.g., verified influencers), narrative mass often resides primarily in third-party discussions rather than first-person posts. In these cases, the computed `self` location may resolve outside the user's physical body. We have observed cases where the `self` coordinates land in the us-east-1 data center hosting a fan wiki rather than the user's device. This is acceptable; the gravity is where the stories are.
  2.  **Narrative Bifurcation:** In cases of severe context switching (e.g., account sharing, compromised credentials, or radical identity shifts), events may cluster into two distinct groups with no narrative bridge. The system will return two `narrative_vector` IDs. We will not attempt to merge them or select a "primary" self. Both vectors will be served to downstream consumers. Billing logic will split charges proportionally to mass.
  3.  **Low Narrative Mass:** Accounts with insufficient event density (infants, comatose users, advanced dementia cases where digital engagement ceases) will fail to generate a `narrative_vector`. We are implementing a mass threshold of 0.05. Accounts below this threshold will return `404 Self Not Found`. This is a feature, not a bug; without a story, there is no center of gravity.

  > **[Comment: Sarah (Legal)]** Regarding Edge Case 1: If the "self" is legally located in a fan wiki's data center, does that change GDPR jurisdiction? We might be subject to data laws in a region where the user has never physically traveled.
  >
  > **[Response: Author]** We will consult counsel. For now, we treat the jurisdiction as the location of the computed centroid.
  >
  > **[Comment: Dr. Aris Thorne (Ontology Consultant)]** The bifurcation handling is robust. I advise against introducing a "tie-breaker" logic later. If the narratives do not intersect, there is no fact of the matter to discover. Serving both is the only consistent option.

  **Migration Plan**
  1.  Freeze writes to `legacy_self` table.
  2.  Enable `narrative_vector` computation for 10% of traffic.
  3.  Cut over all traffic.
  4.  Accounts failing the mass threshold check will immediately lose access to features requiring `self` authentication (personalization, saved preferences, billing history).
  5.  Legacy data will be archived as "historical fiction."

  **Open Questions**
  *   **Liability:** If an external CoG is compromised (e.g., the fan wiki is hacked), does the user's `self` count as compromised?
  *   **Threshold Tuning:** The 0.05 mass threshold is arbitrary. Lowering it reinstates service to infants but increases noise. Raising it reduces compute costs but increases the number of users who effectively cease to exist on the platform.
  *   **Reconciliation:** If a bifurcated account merges later (e.g., one cluster stops posting), do we retroactively bill the surviving cluster for the dead one's usage?

  > **[Comment: Dave (Staff Eng)]** On Open Question 2: Can we add a fallback? If the mass is too low, maybe we default to the device ID?
  >
  > **[Response: Author]** No. That reintroduces the substance model we are removing. If the mass is too low, the self does not exist. We must accept the dropout rate.

  **Conclusion**
  The `narrative_vector` model aligns our architecture with the reality of identity as an abstraction. It reduces storage costs, improves predictive validity, and eliminates the impossibility of storing a non-existent object. We request approval to proceed with deprecation.
