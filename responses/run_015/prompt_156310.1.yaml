      *   *The "Killer":* I initially thought about the Continuity requirement. But actually, the **Non-Identity/turnover problem combined with the Moral Agency requirement** is the real killer. If guilt requires moral agency, and moral agency requires consciousness, groups don't have it. If groups *do* have it (functionalism), does it survive total turnover? Yes, if the *structure* remains. But is the structure *guilty*? Or just the people maintaining it?
      *   *Decision:* The "Blame vs. Liability" distinction is the most damaging because it forces the theorist to admit that "Collective Guilt" is likely a category error, and we should speak of "Collective Responsibility" or "Obligation" instead.

