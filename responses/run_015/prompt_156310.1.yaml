answer: |-
  This is a rigorous request that cuts to the bone of political philosophy and moral ontology. You are asking for the architectural blueprints of a theory that many invoke but few successfully build. The constraint you place at the end—avoiding mystical group souls while avoiding atomistic reductionism—is the central tension of the field.

  Below are the desiderata for an adequate theory of transgenerational collective culpability, followed by an analysis of the tensions, the "killer" requirement, and a scoring of the main contenders.

  ### Part I: The Desiderata of Transgenerational Culpability

  A coherent theory must satisfy the following six requirements. Each is justified not by ideological preference, but by the logical necessity of making sense of our actual practices (reparations, apologies, sanctions) without violating basic moral principles.

  #### 1. The Ontological Naturalism Requirement
  **Specification:** The theory must account for the persistence of the collective without positing a metaphysical entity (a "group mind" or "national soul") that exists independently of its members and structures.
  **Why Necessary:** If the theory relies on a mystical continuity, it becomes immune to empirical falsification and morally arbitrary. Why should *this* generation pay for *that* generation if the connection is merely spiritual? Conversely, if the theory reduces the group to a snapshot of current individuals, it cannot explain obligations that outlast biological life. The theory must locate the "group" in observable, persistent structures (institutions, laws, economic patterns, narratives) rather than in a metaphysical substance.

  #### 2. The Normative Differentiation Requirement
  **Specification:** The theory must rigorously distinguish between **culpability** (backward-looking blame, deserving of sanction) and **liability** (forward-looking obligation, deserving of repair).
  **Why Necessary:** This is the most common point of failure. If a current citizen is *blamed* for a genocide they did not commit, it violates the principle that moral agency requires control ("ought implies can"). However, if they inherit *liability* (e.g., taxation for reparations) based on benefits received or institutional membership, this is a political obligation, not a moral stain. A theory that conflates these two will either condemn innocents (violating justice) or dissolve all obligation (violating rectification).

  #### 3. The Continuity Mechanism Requirement
  **Specification:** The theory must specify *what* exactly persists across generations to carry the burden. Is it the constitutional order? The economic assets? The cultural narrative? The theory must explain why guilt attaches to a nation that keeps its constitution but changes its people, versus a nation that keeps its people but changes its constitution.
  **Why Necessary:** Without this, the theory is arbitrary. If the U.S. of 1860 is "guilty" of slavery, is the U.S. of 2024 guilty because it is the same legal entity, or because it holds the same land, or because it holds wealth generated by slavery? If the mechanism is legal continuity, then a revolution that rewrites the constitution might wipe the slate clean. If the mechanism is wealth, then private corporations might be more guilty than the state. The theory must identify the "carrier" of the guilt.

  #### 4. The Turnover Test (Total Replacement)
  **Specification:** The theory must explain the status of a collective where 100% of the original members are dead and 100% of the current members are unrelated descendants or immigrants, yet the collective name and structure remain.
  **Why Necessary:** This is the hard limit of reductionism. If guilt is just the sum of individual guilts, it must vanish here. If the theory claims guilt remains, it must explain how a structure can bear moral weight without the original agents. If it cannot pass this test, it cannot account for state debt, treaty obligations, or reparations for historical injustices, all of which rely on the state outliving its citizens.

  #### 5. The Repudiation Test (Dissent and Disavowal)
  **Specification:** The theory must account for current members who actively and publicly repudiate the past wrong (e.g., a modern German citizen vehemently opposing Nazism). Does their dissent exempt them from culpability, liability, or neither?
  **Why Necessary:** If membership alone confers guilt, then dissent is irrelevant, which treats individuals as mere cells in a organism (violating individual moral agency). If dissent exempts them completely, then collective guilt dissolves into individual guilt, and the "collective" aspect vanishes. The theory must explain the relationship between individual volition and collective attribution.

  #### 6. The Dissolution and Reconstitution Test
  **Specification:** The theory must determine what happens when a collective dissolves (state collapse, revolution) and is later reconstituted under the same name (e.g., France from Republic to Empire to Republic; or a hypothetical reconstituted Poland).
  **Why Necessary:** This tests the limits of the Continuity Mechanism. If a state ceases to exist legally and institutionally, does the guilt die? If it is resurrected, does the guilt revive? A theory that says "yes" treats the state as a biological organism; a theory that says "no" treats it as a legal contract. The theory must justify why the break (or lack thereof) matters morally.

  ---

  ### Part II: The Impossible Constraint

  You asked specifically about the pair of demands:
  1.  **No metaphysically mysterious continuity** (National identity is not a literal, immortal soul).
  2.  **No statistical reductionism** (Guilt does not evaporate when membership turns over completely).

  **Can these be satisfied together?**
  **Yes, but only if you abandon "Moral Guilt" in favor of "Political Liability."**

  **The Contradiction:**
  The contradiction lies in the definition of **Guilt**.
  *   **Moral Guilt** traditionally requires *mens rea* (a guilty mind) and agency. Only sentient beings have minds. If you avoid mystical continuity, the "Nation" has no mind. Therefore, the Nation cannot be *morally guilty*.
  *   **Statistical Reductionism** says the Nation's guilt is the sum of its members' guilt. If the members are dead, the sum is zero.
  *   **The Conflict:** To satisfy your constraint, you must posit a **Functional Group Agency**. This argues that institutions can act, intend, and decide in ways irreducible to individuals (satisfying Demand 2) without requiring a mystical soul (satisfying Demand 1).
  *   **The Catch:** Functional Agency supports *responsibility* and *liability*, but it struggles to support *retributive blame* across generations. You can hold the *institution* liable for repair (because the institution persists and holds assets), but you cannot hold the institution *morally blameworthy* in the same way you blame a murderer, because the institution lacks consciousness.

  **Conclusion on the Constraint:**
  If you insist that transgenerational collective **culpability** (blame) exists, you **cannot** satisfy both demands. You must either accept a mystical continuity (to carry the moral stain) or accept reductionism (which eliminates the guilt).
  If you are willing to shift the terminology to **Collective Responsibility** or **Institutional Liability**, you **can** satisfy both demands. The "Nation" is a persistent structure (not mystical) that holds assets and power (not reducible to current individuals), and therefore inherits the *debts* of its predecessor, even if it does not inherit the *sin*.

  ---

  ### Part III: The Killer Requirement

  Which single requirement does the most damage to usual candidates?

  **The Normative Differentiation Requirement (Blame vs. Liability).**

  This requirement devastates the colloquial understanding of "Collective Guilt."
  *   **Damage to Individualist Analogies:** It shows that treating nations like people is a category error. People feel shame; nations do not. People die; institutions persist. If you treat a nation like a person, you imply it can feel remorse, which is mystical.
  *   **Damage to Distributed-Blame Models:** It exposes that distributing "blame" across current citizens is unjust (punishing the innocent), while distributing "costs" is politically necessary but not morally equivalent to guilt.
  *   **Damage to Rhetoric:** Most political rhetoric relies on blurring this line. Leaders say "We must atone" (implying moral guilt) to motivate "We must pay" (liability). This requirement forces the theory to admit that "atonement" is metaphorical for a political settlement.

  If a theory cannot separate the *obligation to repair* from the *stain of moral fault*, it fails to respect the moral agency of current citizens who did not commit the act.

  ---

  ### Part IV: Scoring the Contenders

  Here is how the main theoretical models score against the desiderata.
  *(Scale: Pass, Fail, Partial)*

  | Desideratum | **Individualist / Reductionist** | **Mystical / Holistic** | **Institutional / Functional** |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Naturalism** | **Pass** (Only individuals exist) | **Fail** (Posits group soul/essence) | **Pass** (Groups are functional structures) |
  | **2. Normative Differentiation** | **Pass** (Guilt dies with individuals) | **Fail** (Conflates identity with guilt) | **Partial** (Distinguishes liability, struggles with blame) |
  | **3. Continuity Mechanism** | **Fail** (Cannot explain persistence) | **Pass** (Identity is eternal) | **Pass** (Institutions persist) |
  | **4. Turnover Test** | **Fail** (Guilt evaporates) | **Pass** (Guilt remains) | **Pass** (Liability remains) |
  | **5. Repudiation Test** | **Pass** (Dissenters are innocent) | **Fail** (Dissent irrelevant to essence) | **Partial** (Dissent limits blame, not liability) |
  | **6. Dissolution Test** | **Pass** (No state, no guilt) | **Fail** (Guilt haunts the "spirit") | **Pass** (Depends on legal continuity) |

  **Analysis of Scores:**

  1.  **Individualist/Reductionist:** Fails the core task. It is logically clean but practically useless for transgenerational issues. It cannot explain why the U.S. owes reparations for slavery if no living U.S. citizen owned slaves. It satisfies your "No Mystery" constraint but fails your "No Evaporation" constraint.
  2.  **Mystical/Holistic:** Fails the "No Mystery" constraint. It explains persistence well but at the cost of rationality. It treats national guilt like original sin, which is theological, not philosophical.
  3.  **Institutional/Functional:** The strongest contender, but it forces the concession identified in Part II. It satisfies the "No Mystery" and "No Evaporation" constraints **only** by redefining guilt as *liability*. It passes the Turnover and Dissolution tests by tracking legal and economic continuity. However, it struggles with the Repudiation Test: if the institution is liable, does the dissenting citizen still pay? (Usually yes, via taxes, which feels like inherited blame).

  ### Summary Conclusion

  To build a theory that satisfies your constraints, you must accept a difficult conclusion: **Transgenerational Collective *Guilt* (as moral blame) is impossible.**

  However, **Transgenerational Collective *Liability* (as political obligation) is coherent.**

  The theory must argue that nations are **persistent institutional agents** that hold property, power, and legal identity across generations. When an institutional agent commits a wrong, it incurs a debt. That debt attaches to the *office*, not the *officeholder*. Therefore, current citizens inherit the *debt* (liability to repair) because they inherit the *office* (benefits of the state), but they do not inherit the *stain* (moral culpability).

  If you demand a theory that preserves moral *blame* across generations without mystical continuity, you are asking for a logical contradiction. You are asking for a moral predicate (blame) to apply to a non-sentient subject (the persisting structure) without reducing it to the sentient subjects (the dead perpetrators). The tension you sensed is real: it is the friction between **Moral Individualism** and **Political Realism**. A coherent theory resolves this not by bridging the gap, but by admitting that "Guilt" is the wrong word for the second generation. They are not guilty; they are responsible.
