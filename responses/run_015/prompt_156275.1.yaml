  Here is a preparation brief tailored to your seminar context. I have adopted the requested British English spelling and academic tone.

  ### Strategic Concessions
  Before you begin the defence, you should concede two points to disarm the substantivalists' initial aggression:
  1.  **Scope Limitation:** Concede that your model is currently formulated for contained fluids and may require extension for free-floating bodies (e.g., stars). This prevents them from immediately dismissing you based on cosmological edge cases.
  2.  **Effective vs. Fundamental:** Concede that the "inertial potential" you propose is an *effective* field arising from thermodynamic constraints, not necessarily a fundamental ontological category. This mitigates the charge that you are reifying absolute space.

  ---

  ### Objections Ordered by Damage

  #### 1. The "Inviscid Limit" Objection (High Damage)
  **The Objection:** In standard fluid dynamics, once the water achieves co-rotation with the bucket (steady state), the relative velocity at the boundary is zero; hence, the shear stress vanishes. Yet, the concavity persists. If your model relies on thermodynamic shear gradients, it predicts a flat surface in steady-state equilibrium, contradicting observation.
  **Your Reply:** You must argue that the *history* of the shear interaction imprints a structural constraint on the fluid's phase space that persists as a topological memory, effectively maintaining the potential even when instantaneous shear is zero.
  **Weakest Point:** This risks sounding ad hoc. You need a rigorous mathematical account of how a transient dissipative force generates a conservative steady-state potential without violating the second law of thermodynamics.

  #### 2. The "Cryptonormativity" Charge (High Damage)
  **The Objection:** (Using Substantivalist vocabulary) You claim to be a relationist, but by positing a local field (the effective inertial potential) that dictates inertial behaviour independent of distant matter, you have simply renamed the metric tensor. You are smuggling absolute acceleration back in under the guise of thermodynamics, violating the spirit of Leibniz equivalence.
  **Your Reply:** Distinguish between a *background* structure (which exists independently of matter) and an *emergent* structure (which is ontologically dependent on the matter-boundary interaction). Your potential vanishes if the matter vanishes; absolute space does not.
  **Weakest Point:** If the potential behaves exactly like the metric field mathematically, structural realists will argue the ontological distinction is merely verbal.

  #### 3. Diffeomorphism Invariance (Medium Damage)
  **The Objection:** Is your boundary-layer model diffeomorphism invariant? If you perform an active diffeomorphism on the fluid elements within the bucket while holding the boundary fixed, does the shear gradient transform covariantly? If not, your model privileges a specific coordinate chart, effectively reintroducing a preferred frame.
  **Your Reply:** Argue that the boundary conditions break the symmetry explicitly, much like a Higgs mechanism breaks gauge symmetry. The relationism is preserved because the symmetry breaking is caused by material relations, not spacetime substance.
  **Weakest Point:** Hard-line substantivalists will argue that if the physics depends on a specific fixing of the boundary relative to the manifold, you have conceded that the manifold has independent physical significance.

  #### 4. The Machian Consistency Check (Medium Damage)
  **The Objection:** (From the faculty member interested in Mach) If the universe were empty except for the bucket and water, Mach's principle suggests there should be no inertia. Does your model predict concavity in a Machian vacuum? If yes, you are not a true relationist. If no, how do you square this with Newton's intuition that the bucket would still rotate?
  **Your Reply:** Your model predicts no concavity in a true vacuum because there is no thermodynamic boundary to generate the gradient. You reject Newton's intuition as a pre-theoretic bias.
  **Weakest Point:** This is a bold metaphysical claim. If they press you on the angular momentum conservation in an empty universe, you may lack the resources to explain where the rotational energy is stored.

  ---

  ### The One Reply That Must Land
  You must successfully defend the **ontological dependence** of your effective potential.
  **The Argument:** "Absolute space exists *without* matter. My inertial potential exists *only because of* matter-boundary interactions. Therefore, despite mathematical similarities, the ontology is fundamentally relationist."
  **Why:** If you fail to convince them that your potential is ontologically parasitic on matter, you will be categorised as a "substantivalist in disguise," which undermines the core contribution of your paper.

  ---

  ### The Killer Objection (Pray Nobody Asks)
  **"The Superfluid Counter-Example."**
  If you place a superfluid (which has zero viscosity and thus zero shear stress at the boundary) in a rotating bucket, it still exhibits inertial effects (quantised vortices and surface deformation) consistent with rotation. Since there is *no* thermodynamic shear gradient in a superfluid at the boundary, your mechanism for generating the inertial potential is physically impossible.
  **Why this is fatal:** It strikes at the physical mechanism itself, not just the philosophy. If the physics is wrong, the philosophical interpretation collapses.

  ---

  ### Confidence Assessment
  **Confidence Level:** **Moderate-High** regarding the philosophical landscape and likely objections; **Low** regarding the physical viability of your thesis.

  **Least Sure Point / Critical Flag:**
  I must flag that the **physical premise of your thesis contradicts standard fluid dynamics**. In steady-state rotation, there is no shear between the water and the bucket (they move at the same velocity). Shear only exists during spin-up. Attributing the steady-state concavity to shear gradients is physically contentious and likely the primary target for the faculty. I am least sure that a philosophical defence can overcome this physical objection without a significant revision of the underlying physics model. I strongly advise you to prepare a robust response to the "Steady-State/Zero-Shear" problem, as it is the most probable point of failure in a physics-heavy seminar.
