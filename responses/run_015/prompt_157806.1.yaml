answer: |-
  The asymmetry you are pointing out rests on a fractured view of human agency and moral desert. It does not apply a single theory of responsibility across the board; instead, it switches frameworks depending on the class of the actor. Here is the breakdown of the implicit philosophical commitments driving this dynamic.

  ### The Implicit Commitments

  **1. Divergent Theories of Desert**
  For the benefit claimant, the system operates on a **procedural deontology**. Desert is determined by adherence to rules, regardless of intent or outcome. If you miss an appointment, you have violated the duty of compliance. The fact that you spent an overpayment in good faith is irrelevant because the *state's* right to the money is absolute. You deserve punishment (sanction) or restitution because you broke the procedure.

  For the corporation, the system operates on **legal positivism mixed with consequentialism**. Desert is determined by what is explicitly permitted and the outcome of value preservation. If the code allows the loophole, the corporation deserves to keep the money. The "spirit" of the tax law is irrelevant; only the letter matters. Furthermore, there is a consequentialist undertone: corporations *should* minimize costs to survive competition. Therefore, they deserve the savings because it is rational behavior within a market.

  **2. The Agency Flip (Hyper-Voluntarism vs. Structural Determinism)**
  This is where your hypothesis about modal control hits the mark. The system presupposes **hyper-voluntarism** for the poor. It assumes that in any nearby possible world, the claimant could have chosen to attend the appointment or secure employment. Unemployment is treated as a modal choice—a selection among available options—rather than a structural matching failure. The individual is viewed as an atomized agent with total control over their time, health, and administrative capacity.

  Conversely, for the wealthy or corporations, the system assumes **structural determinism**. Corporations are viewed as entities bound by fiduciary duties and market forces. In nearby possible worlds, a corporation that *didn't* use the loophole would be outcompeted or sued by shareholders for negligence. They are framed as having no real choice but to optimize. They are not moral agents; they are functions of capital.

  **3. The Epistemic Burden**
  The system places the burden of knowledge entirely on the claimant. You are expected to know the rules of the welfare state perfectly, despite complexity and chaos. Ignorance is not an excuse. For the corporation, the complexity of the tax code is a feature, not a bug. If the law is ambiguous, the benefit of the doubt goes to the taxpayer. The state is expected to write clearer laws if it wants more money; the claimant is expected to navigate existing laws perfectly or suffer.

  ### What Actually Does the Work

  The engine driving this asymmetry is the **modal control claim**. It is the assumption that poverty is a failure of individual will (something you could have avoided in a nearby possible world) while wealth retention is a failure of state drafting (something the state could have avoided if it wrote better laws).

  This claim does the heavy lifting because it justifies the punitive nature of workfare. If unemployment were acknowledged as a structural matching failure (i.e., in most nearby possible worlds, the job still doesn't exist), sanctions would be morally incoherent. Similarly, if tax avoidance were acknowledged as a voluntary moral choice (i.e., in nearby possible worlds, the CEO could choose to pay more), loopholes would be treated as fraud. The system must maintain the fiction that the poor have high control and the rich have low control to justify the flow of resources upward.

  ### The Contradiction

  If you apply the **claimant standard** to corporations: Any tax avoidance that violates the "spirit" of public contribution is treated as fraud. Overpayments (avoided taxes) must be repaid with interest regardless of intent. Fiduciary duty is not a valid excuse for missing a "payment appointment" with the treasury. This would collapse corporate liquidity and treat legal planning as moral failure.

  If you apply the **corporate standard** to claimants: Missed appointments due to structural chaos (lack of childcare, transport strikes) are excused as "market conditions." Overpayments spent in good faith are not reclaimed because the claimant followed the "letter" of their budget constraints at the time. Unemployment is accepted as a structural matching failure, not a choice. This would dissolve the disciplinary power of workfare.

  The practice contradicts itself because it demands moral agency from the powerless while granting structural immunity to the powerful. It treats the poor as authors of their own misery and the rich as victims of legislative ambiguity.

