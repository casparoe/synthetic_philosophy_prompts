answer: |-
  This is a fantastic EPQ topic. It sits right on the boundary between combinatorial game theory and practical intuition, which is exactly where the best projects live. Since you're a club player, I'm going to skip the generic "Player 1/Player 2" abstraction and talk in terms of White, Black, tempo, and board state.

  Here is the breakdown you asked for, including the "residue report" on where the logic cracks when you apply it to actual chess.

  ### 1. The Strategy-Stealing Argument (SSA) in Chess Vocabulary

  You have the rough shape right. Let's translate it into the language of the 64 squares.

  **The Premise:** Assume Chess is a determined game (Zermelo's Theorem). This means one of three things is true: White forces a win, Black forces a win, or both force a draw. We want to know if "Black forces a win" is possible.

  **The Steal:**
  1.  Suppose, for contradiction, that **Black has a forced win**. This means there is a specific algorithm (a strategy) Black can follow that guarantees a win regardless of what White plays.
  2.  White plays an arbitrary first move. Let's say **1. Nf3**. It's a "spare tempo" move. It develops a piece, but for the sake of the argument, treat it as a placeholder.
  3.  Now, White pretends to be Black. White looks at the board and asks: "If I were Black in this position, what does the 'Black Winning Strategy' say to play?"
  4.  White follows that strategy.
  5.  **The Collision:** Eventually, the "Black Winning Strategy" might demand playing a move on a square that White's spare knight is already sitting on (e.g., the strategy says "play Nf3", but the knight is already there).
  6.  **The Fix:** White simply plays another "spare tempo" move (like h3) and continues following the strategy.

  **The Assumption:** This is the critical leap. The argument assumes that **having an extra knight on f3 is never worse than not having it.** It assumes the extra move is strictly $\ge 0$ in value. It assumes you can never be in *zugzwang* because of that extra piece.

  **The Contradiction:** If White can follow Black's winning strategy *plus* have an extra knight on the board, White should win (or at least do as well as Black would have). But we assumed Black has a forced win. Two players cannot both force a win. Therefore, the assumption that "Black has a forced win" must be false.

  **The Conclusion:** White cannot lose. (White either wins or draws).

  ---

  ### 2. The Residue Report: Where the Argument Breaks in Chess

  This is the core of your EPQ. The SSA is mathematically valid *if* the assumptions hold. In Chess, the assumptions do not hold. Here is where the failure lives.

  **A. Zugzwang (The Fatal Flaw)**
  The SSA relies on the axiom of **monotonicity**: having more options/pieces on the board is never a disadvantage.
  In Chess, this is false. We know that having to move can lose you the game (zugzwang).
  *   **Chess Translation:** If White plays 1. Nf3 as the "spare move," that knight might block the f-pawn, obstruct the bishop, or simply occupy a square the king needs for opposition later in an endgame.
  *   **The Failure:** When the "Black Winning Strategy" tells White to play a move, but the square is occupied, White plays a "spare tempo" (like h3). In a symmetric game like Tic-Tac-Toe, an extra X is never bad. In Chess, an extra pawn on h3 might create a weakness, open a diagonal for the opponent's bishop, or simply waste a critical tempo in a race.
  *   **Verdict:** Because an extra move can have negative value (negative tempo), White cannot guarantee they can execute Black's strategy successfully. The "steal" fails because the "stolen" strategy might require the *absence* of that extra piece.

  **B. Asymmetry of Pieces**
  SSA works best in perfectly symmetric games (like Hex or Tic-Tac-Toe).
  *   **Chess Translation:** Chess is symmetric in setup, but not in piece geometry. Bishops are locked to colours. If White plays 1. Nf3, they have altered the pawn structure potential differently than if Black had played it.
  *   **The Failure:** While less critical than zugzwang, the fact that White's "spare move" changes the pawn structure (even slightly) means the board state isn't a perfect mirror of the hypothetical "Black is moving first" state.

  **C. Non-Constructive Nature**
  You noted this: "It doesn't tell you what the first move should be."
  *   **Chess Translation:** Even if the proof worked, it's non-constructive. It proves a winning move *exists*, but doesn't tell you if it's 1. e4, 1. d4, or 1. h4.
  *   **EPQ Point:** This is a limitation of the *proof*, not necessarily the game. But combined with the draw problem (see below), it renders the proof practically useless for players.

  **D. The Draw Problem**
  SSA proves "Second Player cannot force a win." It leaves two options: First Player Win OR Draw.
  *   **Chess Translation:** Engine evals at depth 50+ often sit at 0.00. Tablebases show many endgames are theoretical draws.
  *   **Verdict:** SSA does not prove "First Player Advantage" in the sense of a Win. It only proves "First Player Non-Disadvantage." Since high-level chess is widely believed to be a draw with perfect play, SSA is consistent with reality, but it doesn't prove the "advantage" you're investigating.

  ---

  ### 3. The "Passing" Variant

  Your teacher is referring to a variant often called **"Chess with Pass."**

  **The Argument:**
  If White is allowed to pass, White can play **1. Pass**.
  Now it is Black's turn, but the board is in the starting position. White has effectively become the "Second Player."
  By the Strategy-Stealing Argument (which works better here because passing removes the "extra move is bad" problem), the Second Player cannot force a win.
  Therefore, White (who passed) cannot lose. White can force at least a draw.

  **Your Question:** "If passing is allowed, why doesn't everyone just pass forever?"
  **The Answer:** Because the goal is to win, not to avoid losing.
  *   If both players pass forever, the game is a draw (by threefold repetition or the 75-move rule).
  *   SSA proves White can force *at least* a draw. It does not force a win.
  *   If White thinks they can win, they will move. If White thinks they will lose if they move, they will pass.
  *   If Black *also* has a passing option, Black can also pass. If both pass, it's a draw.
  *   **Resolution:** The "Pass" variant strengthens the SSA conclusion to "White can force a draw." It doesn't create an infinite loop because players will stop passing if they see a winning line. The infinite loop is just the Draw outcome.

  ---

  ### 4. The Go Debate (You vs. Your Mate)

  This is nuanced. You are both partially right, but for different reasons.

  **Your Mate's Claim:** "SSA applies because stones are identical and you can pass."
  **Your Claim:** "SSA fails because extra stones can be bad (self-atari) and Komi exists."

  **The Verdict:** **Your Mate is mathematically closer, but you have the better practical intuition.**

  1.  **Does SSA apply to Go?** Yes, technically. In Go (without Komi), SSA proves that **Black cannot lose.** (Black either wins or draws).
      *   *Why?* If the "Winning Strategy" calls for playing on a spot where you already have a stone, you play elsewhere (effectively passing locally).
      *   *The "Bad Stone" Objection:* You argued an extra stone can be bad (filling liberties). The mathematical counter-argument is that if the stone is truly bad, the "Winning Strategy" wouldn't have called for a move there in the first place *unless* it was necessary. If the spot is occupied, you play a "pass" move elsewhere. Since passing is allowed in Go, you can always discard the "bad move."
      *   *Caveat:* This assumes **Area Scoring** (Chinese rules) where a pass doesn't lose points. Under Territory Scoring (Japanese), passing can lose points, which complicates SSA.

  2.  **What about Komi?**
      *   Komi exists *precisely because* SSA implies Black has the advantage (or at least, White cannot force a win).
      *   If SSA didn't apply, there would be no mathematical reason to suspect Black has an inherent edge. The existence of Komi is empirical admission that the First Player *does* have an advantage in the raw game.
      *   So, your point ("Komi looks like an admission") actually supports the SSA conclusion that the raw game is biased toward Black.

  3.  **Who is less wrong?**
      *   **Mate:** Correct that SSA applies to the abstract game tree of Go.
      *   **You:** Correct that "extra stones can be bad" is a serious intuitive hurdle, but incorrect that it invalidates the proof (because of the passing rule).
      *   **EPQ Take:** Use this. It shows you understand the difference between the *combinatorial proof* (Mate) and the *positional reality* (You).

  ---

  ### 5. AI Safety "Strategy Stealing"

  This is a different thing with a borrowed name.

  *   **Game Theory SSA:** A proof about existence of strategies in symmetric games.
  *   **AI Safety SSA:** This usually refers to an argument about **oversight and capability**. The rough idea is: "If an AI can find a strategy to achieve a goal (e.g., make money), could a human supervisor steal that strategy to achieve the same goal using the AI as a tool?"
  *   **The Connection:** It's an analogy. It borrows the intuition that "if a strategy exists for the opponent, it should be available to me." But it is not the same formal combinatorial proof. It's about **instrumental convergence** and **interpretability**.
  *   **Verdict:** Tell your teacher you checked. It's a metaphorical borrowing, not a direct application of the Zermelo/SSA proof. Don't conflate them in your report.

  ---

  ### 6. The "Shaky Bits" (For your Defense)

  You asked for honesty about where the account is shakiest. If I were examining your EPQ, these are the holes I'd probe. Put these in your "Limitations" section.

  1.  **The "No Zugzwang" Assumption:** This is the biggest smoothing-over. I have treated "having an extra piece" as strictly non-negative. In Chess, it is demonstrably negative in specific endgames. The SSA *cannot* be rigorously applied to Chess without modifying the rules (e.g., allowing passes).
  2.  **Determinacy:** SSA assumes the game is determined (one player has a winning strategy). We know Chess is finite, so Zermelo's Theorem says it *is* determined. But we don't know *which* determination it is (Win/Draw/Loss). SSA only eliminates one of the three options.
  3.  **Go Scoring Rules:** I glossed over Territory vs. Area scoring in Go. Under Japanese rules, passing costs a point (potentially). This makes the "play elsewhere" clause of SSA costly. SSA is cleaner under Chinese rules.
  4.  **Constructivism:** The proof tells us nothing about *how* to win. It is existentially satisfying but practically empty. For a chess player, a proof that doesn't suggest a move is almost useless.

  ### Summary for your Report

  *   **Is "First Player Advantage" a mathematical fact?**
      *   **In Chess:** No. SSA proves "First Player Non-Disadvantage" (Win or Draw), but fails to prove a Win due to **Zugzwang**. The "advantage" is empirical (stats), not proven mathematically.
      *   **In Go:** Yes, in the sense that SSA proves Black cannot lose (without Komi). Komi is the mathematical correction for this proven advantage.
  *   **Where the failure lives:** In Chess, the failure is **Zugzwang** (moves can have negative value). In Go, the failure is mitigated by **Passing**.
  *   **The Passing Paradox:** Passing allows White to opt-out of the "extra move is bad" problem, securing a Draw, but infinite passing is just a Draw by repetition, not a logical contradiction.

  This should give you plenty to defend. You understand the math, but you respect the chess. Good luck with the viva.
