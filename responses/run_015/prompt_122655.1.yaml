answer: |-
  **Case Name:** The Dead Cask

  **The Case**
  Mara is a Master Blender at a prestigious distillery, tasked with approving single-cask releases. Standing in the warehouse, she samples a 25-year-old sherry butt. Her palate, calibrated over thirty years, detects a specific flatness in the tannin structure that indicates the wood is exhausted; she knows with high reliability that bottling this now will result in a product that turns vinegary within six months. Chemical analysis, however, currently reads the spirit as stable, and the data won't update for 48 hours. The production manager needs a binary decision now to schedule the bottling line. If Mara hedges ("I'm worried it might be off" or "My intuition says no"), the manager will defer to the chemical data and proceed, ruining the batch and the brand's reputation. Mara cannot articulate *why* the tannins feel flat to someone who doesn't taste it, nor can she produce the evidence (the taste) for the manager. She states flatly: "This cask is dead. Do not bottle it."

  ***

  **1. Normative Verdicts**

  *   **Knowledge Norm (K):** **Permissible.** Mara possesses a true belief formed by a reliable, high-caliber cognitive process (her trained palate). On a reliabilist/virtue account, this unreflective expertise constitutes knowledge. Since she knows $p$ (the cask is dead), K licenses the flat-out assertion.
  *   **Truth Norm (T):** **Permissible.** It is a fact that the cask is compromised and will spoil. Since $p$ is true, T licenses the assertion regardless of Mara's access to that truth.
  *   **Belief Norm (B):** **Permissible.** Mara genuinely believes the cask is dead; she is not lying or guessing. Since she believes $p$, B licenses the assertion.
  *   **Reasons Norm (R):** **Impermissible.** R requires adequate evidence that the speaker *could actually give if asked*. Mara's evidence is a private, inarticulable sensory experience. She cannot transfer the taste to the manager, and her report ("it tastes flat") is not *adequate* evidence for the manager given the conflicting chemical data. Because she cannot discharge the obligation to provide shareable justification, R forbids the flat-out assertion.

  **2. The Load-Bearing Feature**
  The load-bearing feature is the **gap between reliable detection and articulable justification**.
  *   **Remove Reliability:** If Mara's palate were untrained or guessing, she would not *know* (violating K). The case would collapse into a lucky guess, and her assertion would be intuitively improper regardless of the norm.
  *   **Remove Inarticulacy:** If Mara could point to a specific chemical marker or show a spectrograph reading, she would possess give-able evidence. R would then permit the assertion, and the conflict between K and R would vanish. The case relies entirely on the evidence being *real but private*.

  **3. The Strongest R-Reply & Counter-Reply**
  *   **R-Reply:** "Mara is entitled to act, but not to *assert* flat-out. She should assert a weaker claim: 'The risk profile is too high' or 'I recommend against bottling.' This conveys her warning without claiming knowledge she cannot justify to the audience. R protects the interlocutor's right to evaluate the claim, which flat assertion bypasses."
  *   **Counter-Reply:** In high-stakes expertise contexts, hedged assertions function as *recommendations*, which managers are permitted to override. A flat assertion ("This is dead") functions as a *veto*, which is the only speech act that actually prevents the ruin. By forcing her to hedge, R strips her expertise of the necessary authority to do its job. If the norm forbids the only speech act that secures the truth, the norm is unfit for this domain.

  **4. Honesty Flag**
  I have stipulated that **hedging is functionally useless** in this specific managerial context. A tutor could argue that a strong hedge ("I strongly advise against this") *would* carry enough weight to stop the manager. I am assuming the manager is data-driven and will ignore anything short of a factual claim ("This is dead") when it conflicts with the chemical readout. This stipulation is necessary to ensure the "cost of following R" is real and not just a matter of social friction.

  ***

  **Presentation Tip:**
  When presenting, emphasize that **R treats assertion like a courtroom testimony** (requires exhibit A, B, and C), while **K treats assertion like a tool** (does it do the job?). Your argument is that expertise often works like a tool, not a testimony.
