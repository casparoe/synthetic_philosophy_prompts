answer: |-
  **NATIONAL ENDOWMENT FOR ETHNOLINGUISTIC FIELDWORK (NEEF)**
  **Policy Directive 89-Q: Compliance Protocols for Radical Translation Manuals**

  **Effective Date:** Immediate
  **Applicability:** All Grant Recipients in Contexts of Radical Translation

  **1. Purpose and Scope**
  This directive establishes compliance standards for fieldworkers constructing translation manuals in contexts where behavioral evidence underdetermines linguistic interpretation. Acknowledging the thesis that translation manuals are not uniquely determined by the totality of possible stimulus conditions, the Endowment mandates strict adherence to protocols regarding empirical equivalence, ontological commitment, and informant arbitration.

  **2. Empirical Equivalence Certification**
  Fieldworkers encountering stimulus conditions analogous to the "gavagai" scenario must recognize that divergent manuals may account for all native assent and dissent behaviors equally well. Specifically, manuals translating the native term as "rabbit," "undetached rabbit part," or "temporal stage of a rabbit" are deemed empirically equivalent. Applicants must submit three (3) distinct manuals representing divergent ontological schemes. No preference may be indicated for one scheme over another based on evidentiary grounds, as no such grounds exist. Selection among manuals must be justified solely by pragmatic criteria, such as simplicity or fluency, rather than alleged correspondence to reality.

  **3. Mandatory Disclaimers and Ontological Review**
  Every published manual must carry the following disclaimer on its cover: *"This manual represents one of infinitely many empirically adequate schemes. There is no fact of the matter regarding its unique correctness. Deviations from this manual constitute alternative analytical hypotheses, not errors."* Failure to include this disclaimer will result in immediate funding revocation.

  Peer reviewers are required to certify that applicants have not smuggled unstated ontological commitments into their analytical hypotheses. Reviewers must verify that the mapping of native terms to English sortals does not presuppose a privileged ontology. Note: Indeterminacy of translation must not be conflated with indeterminacy of reference. While reference is inscrutable, this policy concerns the holistic manual. Reviewers must ensure the manual does not claim to fix reference absolutely, nor may it assert that the native "really" means rabbit rather than rabbit-part.

  **4. Informant Arbitration and Refund Protocol**
  In the event an indigenous informant disputes a translation (e.g., asserting "gavagai" signifies "momentary rabbit-flash" rather than "rabbit"), the Fieldworker must initiate Protocol 89-Q-4. Since there is no fact of the matter to adjudicate the dispute, the Fieldworker cannot claim the informant is incorrect without violating the principle of indeterminacy. However, to maintain community relations, the Endowment provides a stipend for "Ontological Reconciliation."

  If the informant insists on a manual incompatible with the Fieldworker's analytical hypotheses, the Fieldworker must offer a full refund of any gifts exchanged during elicitation sessions, citing "Irreconcilable Analytical Divergence." The Fieldworker must file Form 12-B, attesting that the dispute arises from underdetermination rather than fieldwork error.

  **5. Distinction from Physical Theory**
  Applicants are reminded that unlike physical theories, where underdetermination suggests merely pending evidence, translation manuals admit no further evidence that could settle the matter. Do not characterize manual selection as a provisional hypothesis awaiting falsification. It is a pragmatic choice without truth conditions. Manuals claiming unique correctness will be classified as fiction.

  **6. Auditor Statement**
  Senior Ontological Auditor H. V. Quine-Smith noted in the last fiscal review: "It is administratively exhausting to police analytical hypotheses across multiple manual drafts. We spend more time verifying that no fact of the matter exists than we do verifying the behavioral data. Yet, without this oversight, linguists inevitably slide into the myth of the museum."

  **7. Compliance Deadline**
  All current grantees must submit a "No-Fact-of-the-Matter" affidavit by the end of the quarter. Non-compliant manuals will be withdrawn from the National Linguistic Archive.

  **Authorized by:** The Committee on Analytical Hypotheses
  **National Endowment for Ethnolinguistic Fieldwork**
