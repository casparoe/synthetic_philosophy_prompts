  Policy Directive 89-Q: Compliance Protocols for Radical Translation Manuals

  *Body:*
  Effective immediately, all grant recipients conducting fieldwork in contexts of radical translation must adhere to the following guidelines regarding the construction, submission, and arbitration of translation manuals. These protocols acknowledge the thesis that translation manuals are underdetermined by the totality of possible behavioral evidence.

  1. **Empirical Equivalence Certification:**
  Fieldworkers encountering stimulus conditions analogous to the "gavagai" scenario must recognize that multiple manuals may account for all native assent/dissent behaviors equally well. Specifically, manuals translating the native term as "rabbit," "undetached rabbit part," or "temporal stage of a rabbit" are deemed empirically equivalent. Applicants must submit three (3) distinct manuals representing divergent ontological schemes. No preference may be indicated for one scheme over another based on evidence, as no such evidence exists.

