answer: |-
  **Elena (Naturalist):** Let's start with the heart. On the Biostatistical Theory, the heart's function is pumping blood. This isn't a metaphorical goal; it's a causal role. The heart contributes causally to the organism's survival and reproduction. If it fails to pump efficiently relative to the statistical norm, the organism is unhealthy. There's no hidden value judgment here, just physiology and statistics.

  **Marcus (Normativist):** But why privilege pumping? The heart also makes a thumping sound. That's a causal role too. Why is pumping the *function* and thumping merely a side effect? To distinguish function from mere effect, you need a goal. You're implicitly saying the heart *ought* to pump to sustain life. But why is sustaining life the standard? That sounds like a value judgment masquerading as biology.

  **Elena:** It's not a moral value; it's a biological constant. All living systems are designed by evolution to survive and reproduce. When we say "function," we mean the causal contribution a part makes to those inclusive fitness ends. We don't need to invoke conscious goals. We just observe that organisms with pumping hearts survive longer than those without. The "normativity" you see is just the statistical fact that deviation from this causal role reduces survival probability.

  **Marcus:** You're smuggling teleology in through the back door. "Designed by evolution" is a metaphor. If you strip away the metaphor, you have mere causal sequences. To select survival and reproduction as the *relevant* causal sequence is to make a choice. A normativist says health is about what we *value* in a life. If a person values contemplation over physical longevity, a heart condition might not count as "unhealthy" in the sense that matters to them. By fixing the standard at biological survival, you're prioritizing one set of values over another.

  **Elena:** I'm not prioritizing values; I'm defining the terms of the medical enterprise. Medicine aims to restore functional capacity. If we make health dependent on individual values, a marathon runner and a sedentary poet have different health statuses despite identical physiology. That makes medicine impossible. We need an objective baseline. The baseline is species-typical functional organization.

  **Marcus:** That brings us to your baseline's instability. Consider a person with a hereditary condition causing significantly below-average adult height. Biologically, they function fine. But on your view, are they unhealthy? It depends entirely on your reference class. If the class is "all adult humans," they are statistically abnormal. If the class is "people with this specific genotype," they are perfectly normal. How do you choose the class without arbitrariness?

  **Elena:** It's not arbitrary. We choose reference classes based on homogeneous functional organization. Age and sex are the primary partitions because physiological function varies naturally across them. A child's heart rate isn't compared to an adult's. We don't use genotype for height because height itself isn't a direct function contributing to survival in the way cardiac output does. We look at classes where the functional expectations are biologically uniform.

  **Marcus:** But why is genotype excluded? If the condition is hereditary, isn't the "natural" state for this person to be short? By excluding genotype, you're deciding that this variation is a defect rather than a difference. That decision isn't found in the blood; it's a social judgment about what counts as a normal body. You're saying, "We expect humans to be this tall," and anyone who isn't is statistically malfunctioning. That's normativity.

  **Elena:** It's not about expectation; it's about functional efficiency. If short stature reduces the ability to perform typical physical tasks relative to the sex and age class, it's a functional limitation. The reference class isn't chosen to make people feel normal; it's chosen to isolate biological variables. If we partition by every specific genotype, every individual becomes their own reference class, and the concept of disease collapses. We need broad classes to identify pathology.

  **Marcus:** And there's the tension. You need broad classes for objectivity, but narrowing them protects individuals from being labeled diseased based on mere difference. The choice of where to draw the line—sex versus genotype—isn't dictated by nature. It's dictated by what we consider relevant variation. If society values certain physical capacities associated with height, your reference class will label shortness as unhealthy. If society changes, your "objective" health status changes.

  **Elena:** Society doesn't change the statistical distribution of cardiac output or height. The biostatistical facts remain constant. What changes is whether we *care* about treating the condition. That's the distinction between disease and illness. Disease is objective functional failure; illness is the normative experience of suffering. I can admit that being short isn't an illness if the person is happy, but it remains a biological deviation if it reduces functional efficiency relative to the reference class.

  **Marcus:** But you've conceded the point. If "functional efficiency" is selected based on what capacities we deem worthy of measurement, then the naturalist foundation is shaky. You say the heart's function is pumping because we value survival. You say the reference class is sex/age because we value those partitions over genotype. The naturalist wants health to be a value-free scientific concept, but every time you press for precision, a value judgment appears to justify the biological categories.

  **Elena:** I'd argue the values are external to the definition. We value survival because we are living organisms. We use sex/age classes because they correlate with physiological mechanisms, not social preferences. The objectivity lies in the measurement, not the treatment. I can tell you objectively that this heart pumps at 40% efficiency relative to the class. Whether that counts as a tragedy is up to you. But calling it dysfunction isn't.

  **Marcus:** And I maintain that calling it dysfunction requires a prior agreement on what the system is *for*. Without that teleological agreement, you just have statistics. And statistics alone cannot distinguish a disease from a mere difference.

  **Elena:** Then we agree on the stakes. If health is purely normative, medicine becomes a branch of ethics. If it's biostatistical, medicine is a branch of engineering. I'm trying to keep the engine running. You're asking who gets to drive.

  **Marcus:** Precisely. And the driver always decides what counts as a breakdown.
