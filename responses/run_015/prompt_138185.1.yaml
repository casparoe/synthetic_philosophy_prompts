  8.  **Final Polish:** Check British spelling. Ensure tone is appropriate for a PhD peer. Ensure "Consensus/Contested" markers are clear.

      *(Self-Correction on "Consensus"):* Be careful not to claim false consensus. Philosophy of science is fraught. Use phrases like "Broadly agreed among realists" or "Contested by anti-realists."

