answer: |-
  Here is a diagnosis of the argument, structured to help you locate the precise point of failure and assess the cost of repairing it.

  ### 1. The Diagnosis: Valid but Unsound

  Your friend's argument is valid. If you accept premises (1) through (4), conclusion (5) follows; if you accept (1), (2), (3), and (6), conclusion (7) follows. The problem is not the logic, but the soundness of the empirical claims and the uniformity of the definition of 'knowledge' across disparate disciplines.

  The argument relies on a hidden equivocation in **Premise (1)** regarding the nature of 'knowledge', which is then exploited by **Premise (6)** to force a false analogy between physics and philosophy.

  **The Consensus View:** Among philosophers of science, there is broad agreement that 'progress' cannot be defined solely by consensus on foundational ontology. If it were, Newtonian physics ceased to progress the moment questions arose about the nature of absolute space, and quantum physics is stagnant. Most working philosophers of science distinguish between *empirical progress* (increasing predictive accuracy and scope) and *theoretical progress* (understanding the underlying reality). Your friend's argument collapses this distinction.

  **The Contested View:** It is heavily contested whether empirical progress without theoretical settlement counts as *cognitive* progress (as opposed to merely instrumental success). Realists say yes; instrumentalists say that is all we ever get; pessimistic inducers say we get neither.

  ### 2. Which Step to Reject?

  You should reject the inference from **(3) to (5) and (7)**, grounded in a modification of **(1)**.

  The argument assumes that 'knowledge' in Premise (1) must be *final, foundational truth*. If you define knowledge that way, your friend is right: neither field has it. However, this definition is too strong for science and perhaps too weak for philosophy.

  **The Repair:** Modify Premise (1) to distinguish between **constraint-based knowledge** and **speculative knowledge**.
  *   **Physics:** Possesses knowledge because its central questions are *empirically constrained*. Even if interpretations (Copenhagen, Many-Worlds) differ, they are constrained by a formalism that yields convergent predictions. The 'unsettledness' is about the *map*, not the *territory* of observation.
  *   **Philosophy:** Lacks this constraint. The 'unsettledness' is about the *territory* itself (e.g., do we have free will?).

  **The Price of This Rejection:**
  By rejecting the strict condition in (1), you admit that a field can make progress without settling its 'central' metaphysical questions, *provided* it has a mechanism for ruling out error.
  *   **Cost:** You must concede that 'progress' is not a monolithic property. It is relative to the feedback mechanisms available to the discipline.
  *   **Benefit:** It saves the intuition that physics progresses (it rules out false models) while philosophy stagnates (it accumulates models without ruling them out).

  ### 3. Testing Against Your Cases

  You asked to test this against specific cases if we relax the requirement that the 'centre' must be settled to have genuine results. Here is how the modified account handles them:

  **Russell's Refutation of Naive Comprehension**
  *   **Status:** Genuine Progress.
  *   **Why:** This functions like a proof in mathematics. It rules out a specific logical space. Even if the 'central question' of what sets *are* remains debated (Platonism vs. Nominalism), we *know* naive comprehension is false. This fits the 'constraint-based' model. We have pruned the tree, even if we haven't found the root.
  *   **Consensus:** High. Almost everyone accepts this as progress in logic/set theory.

  **Gettier-style Counterexamples**
  *   **Status:** Local Progress, Global Stagnation.
  *   **Why:** We know 'Justified True Belief' is insufficient. That is a piece of negative knowledge (constraint). However, because no replacement analysis has gained consensus, the 'central question' (What is knowledge?) remains unsettled.
  *   **Consensus:** Contested. Some say refining the question is progress; others say without a solution, it is merely activity. Your friend would class this as 'apparatus growth', not knowledge.

  **The 13 'Abandoned as Confused' Questions**
  *   **Status:** Progress by Elimination.
  *   **Why:** If a question is abandoned because it is shown to be ill-formed (e.g., certain vitalist questions in biology, or perhaps 'How much does the soul weigh?'), that is cognitive progress. It narrows the search space.
  *   **Consensus:** Broadly agreed. Knowing what *not* to ask is knowledge.
  *   **Challenge:** In your audit, were these abandoned because of *external* pressure (e.g., science answered it) or *internal* realisation? If internal, philosophy progresses. If external, science progressed, and philosophy merely retreated.

  **Physics Case: The Prediction of Neptune**
  *   **Status:** Clear Progress.
  *   **Why:** Newtonian mechanics allowed the calculation of a planet's existence before observation. This happened *despite* unresolved foundational questions about gravity's mechanism (action at a distance).
  *   **Implication:** This proves Premise (3) false for physics. Practitioners could 'do something' (predict planets) grounded in knowledge (the formalism) even while the central ontological question (what gravity *is*) was unsettled.

  ### 4. Can Your Friend Salvage a Restricted Version?

  Your friend wants to convict philosophy and exonerate physics without begging the question. They can attempt this by tightening **Premise (2)** regarding 'Centrality'.

  **The Restricted Argument:**
  1.  In Physics, 'central questions' (ontology) are *decoupled* from 'operational questions' (prediction). You can solve the operational questions without solving the central ones.
  2.  In Philosophy, 'central questions' (e.g., free will) are *coupled* to 'operational questions' (e.g., moral responsibility). You cannot settle moral responsibility without settling free will.
  3.  Therefore, unsettledness in the centre blocks progress in philosophy, but not in physics.

  **Is this Question-Begging?**
  It borders on it. It assumes that philosophy *requires* foundational settlement to function, whereas physics does not. A pragmatist philosopher would deny this: we can do ethics (operational) without settling metaphysics (central), just as physicists do.
  However, there is a non-begging version: **The Error-Correction Mechanism.**
  *   Physics has an external arbiter (experiment) that kills off false central candidates over time (e.g., ether theory).
  *   Philosophy lacks an external arbiter. False central candidates (e.g., utilitarianism vs. deontology) persist indefinitely.
  *   **Verdict:** This is the strongest version of your friend's argument. It concedes that 'progress' is possible without final truth, but insists it requires a mechanism for *discarding* false starts. Philosophy lacks this; Physics has it.

  ### 5. Which Premise is the Weakest Link?

  If you must choose one premise to reject to save the intuition that physics progresses: **Reject Premise (3).**

  Premise (3) states: *If central questions are unsettled... D has made no cognitive progress.*
  This is simply false for any empirical science. Science progresses by building robust *phenomenological models* that work regardless of the underlying ontology. We can build nuclear reactors without agreeing on the interpretation of quantum mechanics. Therefore, cognitive progress (understood as increased capacity to manipulate and predict) is possible despite foundational unsettledness.

  **Why keep (2)?**
  You mentioned you wish to keep (2). This is wise. (2) captures the holistic nature of theory. If you reject (2), you risk fragmenting the discipline into isolated facts with no coherence. Keeping (2) but rejecting (3) allows you to say: "Yes, the results hang together, but they can hang together around a core that is *useful* without being *final*."

  ### 6. The Worst Case for This Account

  You asked me to name the case my own account handles worst. If I advocate for the 'Error-Correction/Constraint' view (that physics progresses because it kills false theories, while philosophy does not):

  **The Worst Case: String Theory (Physics) vs. Phenomenology (Philosophy)**

  *   **String Theory:** It is arguably the current 'central' project in fundamental physics. Yet, it has produced no novel empirical predictions in forty years. It has multiplied interpretations and mathematical apparatus, but lacks the 'error-correction' of experiment. By my account, String Theory is currently stagnant, indistinguishable from philosophy.
  *   **Phenomenology:** Conversely, some branches of philosophy (e.g., phenomenology of perception) have been deeply informed by cognitive science. They have 'abandoned as confused' certain questions about qualia that neuroscience dissolved. Here, philosophy *has* used an external arbiter to make progress.

  **The Implication:** My account implies that 'Physics' and 'Philosophy' are not natural kinds. There is 'progressive inquiry' (constrained, error-correcting) and 'speculative inquiry' (unconstrained, persistent disagreement). Some physics is speculative; some philosophy is constrained.
  **Consensus Level:** Highly Contested. Most physicists resist the idea that String Theory is 'philosophy', and most philosophers resist the idea that their progress depends on science.

  ### 7. Summary of Advice

  1.  **Do not reject (2).** It correctly identifies that disciplines are structured systems.
  2.  **Reject (3).** Unsettled foundations do not preclude cognitive progress if the field generates reliable, constraint-based knowledge elsewhere (e.g., predictions, logical eliminations).
  3.  **Modify (1).** Define progress not as 'possessing the final truth' but as 'increasing the density of reliable constraints'.
  4.  **Accept the Restricted Argument's Core:** Philosophy's stagnation is not due to the *difficulty* of its questions, but the lack of a mechanism to *discard* false answers. Physics progresses because it has a 'kill mechanism' (experiment); philosophy does not.
  5.  **Live with the Cost:** You must admit that if physics ever loses its empirical edge (as in String Theory), it ceases to progress in the same way. And if philosophy finds a way to empirically constrain its questions (e.g., experimental philosophy), it begins to progress.

  This diagnosis preserves your intuition (physics moves, philosophy stalls) without accepting the nihilistic conclusion that 'progress' is a myth. It locates the difference not in the *questions*, but in the *tools for answering them*.
