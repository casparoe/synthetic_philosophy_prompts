  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe reject (1) and say progress is just better arguments.
      *   *Correction:* No, the user wants to save Physics. Physics progresses because of *instrumental* success. So the definition of progress needs to accommodate instrumental success without truth consensus.
      *   *Better move:* Attack the interpretation of Premise (6). Physics *has* narrowed the spread of opinion on *observable* consequences, even if ontology is open. Philosophy hasn't narrowed opinion on *intuitions* or *consequences*.
