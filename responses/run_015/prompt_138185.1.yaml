      *Decision:* The most robust philosophical move is to challenge the *empirical claim* about physics (6) and the *uniformity* of the definition (1). Physics possesses a mechanism for *weeding out* false central answers (experiment) even if the final ontology is debated. Philosophy lacks this. Thus, Physics has "knowledge" in the sense of "reliably mapped phenomena," Philosophy does not.

