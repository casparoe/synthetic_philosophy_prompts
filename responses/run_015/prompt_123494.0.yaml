answer: |-
  Here are the desiderata for a theory of cognition grounded in the *Surfaces and Essences* thesis, calibrated to the specific purpose of a child-like, unsupervised learning machine.

  ### The Desiderata

  **1. Few-Shot Plasticity (Non-Negotiable)**
  *   **Case:** Getting from a single exposure to a usable concept (e.g., a child seeing one "dog" and categorizing the next).
  *   **Consideration:** The system must generalize from $n=1$ without gradient descent over epochs.
  *   **Status:** **Non-Negotiable.** Without this, it is not a model of human concept acquisition, but of statistical fitting.

  **2. Unsupervised Feature Discovery (Non-Negotiable)**
  *   **Case:** The two-panel visual puzzle where the distinguishing property is relational and unmarked.
  *   **Consideration:** The system cannot rely on pre-segmented objects or labeled feature vectors; it must parse the scene and the relation simultaneously.
  *   **Status:** **Non-Negotiable.** Hand-coded features presuppose the concept you claim to be acquiring.

  **3. Generative Structural Alignment (Non-Negotiable)**
  *   **Case:** Explaining one domain by mapping it onto another where shared structure is *created* by the comparison rather than discovered.
  *   **Consideration:** The mapping process must be constructive, altering the representation of the source or target to make them fit.
  *   **Status:** **Non-Negotiable.** This is the core Hofstadter claim; if structure is only discovered, analogy is mere retrieval.

  **4. Dynamic Concept Revision (Non-Negotiable)**
  *   **Case:** Rejecting the atom/solar system analogy after initially accepting it.
  *   **Consideration:** Concepts must be mutable residues of episodes, not fixed definitions; the system must allow later evidence to degrade earlier mappings.
  *   **Status:** **Non-Negotiable.** A static ontology cannot model scientific or developmental conceptual change.

  **5. Internal Consistency Checking (Non-Negotiable)**
  *   **Case:** Retracting an overextension without external feedback (no one telling you "that's not a dog").
  *   **Consideration:** The system requires an internal metric of coherence or prediction error to self-correct in the absence of labels.
  *   **Status:** **Non-Negotiable.** Essential for the "no curriculum/labels" constraint.

  **6. Combinatorial Restraint without Oracle (Non-Negotiable)**
  *   **Case:** Taming the explosion of candidate mappings without presupposing the answer.
  *   **Consideration:** Search must be bounded by salience or activation dynamics inherent to the data, not by a homunculus or goal-state knowledge.
  *   **Status:** **Non-Negotiable.** Otherwise, the theory is computationally vacuous.

  **7. Error Specificity (Non-Negotiable)**
  *   **Case:** Predicting characteristic human failures (confabulated likeness) rather than random noise.
  *   **Consideration:** The mechanism that produces success must be the same mechanism that produces specific, recognizable failures.
  *   **Status:** **Non-Negotiable.** This is the primary falsification condition for cognitive modeling.

  **8. Unified Mechanism (Preference)**
  *   **Case:** Understanding "new job/new kid" and solving visual puzzles using the same cognitive engine.
  *   **Consideration:** Hofstadter argues for a single "fluid analogy" engine rather than modular specialized processors.
  *   **Status:** **Preference.** A modular system could satisfy the functional goals, but would violate the theoretical unity of the *Surfaces and Essences* thesis.

  **9. Single Representational Format (Preference)**
  *   **Case:** Storing episodes, concepts, and relations in one substrate.
  *   **Consideration:** The demand that everything be stateable in one format (e.g., purely symbolic or purely connectionist).
  *   **Status:** **Preference.** Hybrid architectures might satisfy the functional desiderata better, though they complicate the "blurred residue" claim.

  ***

  ### The Impossible Subset

  The subset that cannot be jointly satisfied is **Generative Structural Alignment (3)**, **Combinatorial Restraint without Oracle (6)**, and **Error Specificity (7)**.

  If a mechanism is plastic enough to *invent* structure during comparison (3), the search space for possible mappings becomes effectively infinite, violating the constraint on combinatorial explosion (6) unless you introduce strong priors. However, if you introduce strong priors to tame the search, the system's errors become artifacts of those priors rather than characteristic human failures arising from the analogy process itself (7). The plasticity that allows one example to suffice is the same plasticity that allows for confabulation; a system constrained enough to avoid confabulation will inevitably require more than one example to learn. You cannot have a system that is both open enough to create structure and closed enough to be predictably human in its errors without smuggling in the "essence" you claim it is discovering.

  ***

  ### Exclusionary Power

  **Few-Shot Plasticity:** This excludes standard Supervised Deep Learning, because backpropagation requires large labeled datasets to converge and cannot generalize reliably from single instances without meta-learning architectures that effectively hard-code the learning strategy.

  **Generative Structural Alignment:** This excludes Classical Symbolic AI (e.g., standard Structural Mapping Theory), because in those accounts, relations are pre-defined predicates in the representation; the system aligns existing structure but cannot create the shared vocabulary through the act of comparison.

  **Error Specificity:** This excludes Ideal Rational Agent models (e.g., pure Bayesian inference), because these models treat deviation from optimality as noise or resource limitation, whereas this requirement demands that the errors be structural products of the reasoning mechanism itself.

  **Combinatorial Restraint without Oracle:** This excludes Brute-Force Search models, because they rely on computational abundance rather than cognitive salience to find mappings, failing to explain how humans find deep analogies instantly despite limited working memory.
