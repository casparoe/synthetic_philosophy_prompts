  2.  **Deconstruct Popper's Verisimilitude:**
      *   *Core Idea:* Two false theories can be ranked. Theory A is closer to the truth than Theory B if A has more truth-content and less falsity-content (or at least not less truth and less falsity).
      *   *Falsificationism:* You can't prove a theory true (verification), but you can prove it false (falsification). Falsification drives progress.
      *   *Empirical Content:* Bold theories (high content) are riskier (easier to falsify) but offer more progress if they survive.
      *   *Progress:* Science moves toward the truth by keeping theories with higher verisimilitude, even if they are ultimately false.

