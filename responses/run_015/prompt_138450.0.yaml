answer: |-
  **1. The Rules of Justice Pratt**

  Justice Pratt's record reveals a methodology that prioritizes textual stability over legislative intent, yet refuses to render statutory schemes incoherent. Three rules emerge that are jointly consistent but pull in different directions here:

  *   **Rule 1: The "Hard Line" Principle (*Carmichael*, *Ferreira*, *Okafor*).** Operative text establishes fixed boundaries that purposes clauses cannot move. A purposes section explains the rationale for a line but does not authorize the court to redraw it. Later legislative action (silence, reauthorization, or purposes amendments) does not retroactively alter the historical meaning of earlier operative text.
      *   *Prediction:* **Nexus wins.** Section 4 draws a line at "records." Profiles are not records. Section 2(c) is a purposes clause and cannot expand Section 4's scope, especially retroactively.
  *   **Rule 2: The "Anti-Nullification" Principle (*Delgado*, *Alvarez*).** Statutes must be read as a coherent body of law. An interpretation that allows an exception to swallow the rule, or that renders a statutory scheme a nullity in light of modern conditions, is rejected. The compiled statutes are read as they currently stand for future conduct.
      *   *Prediction:* **State wins.** Reading Section 4 to exclude derived profiles guts the Act in the data-broker age. Section 2(c) confirms that "records" must be read dynamically to prevent nullification.
  *   **Rule 3: The "Temporal Integrity" Principle (*Okafor*, *Trent*, *Alvarez*).** While the code is read as a whole (*Alvarez*), a later legislature cannot use a purposes amendment to effectively criminalize past conduct that was not clearly proscribed by the operative text at the time. Later definitions are evidence, not controlling commands for past acts.
      *   *Prediction:* **Split Verdict.** Section 4 covers profiles prospectively (under *Alvarez*/*Delgado*), but Nexus is not liable for pre-2021 conduct (under *Okafor*/*Trent*).

  **2. The Prediction**

  *   **Vote:** Justice Pratt will vote to **reverse in part and affirm in part.** She will hold that Section 4 prohibits the retention of inference profiles *after* the 2021 amendment, but does not impose liability for conduct *before* the amendment.
  *   **Remedy:** She will write separately to concur in the judgment on the pre-2021 conduct (for Nexus) and dissent in part on the post-2021 conduct (for the State), but she will likely shepherd a majority opinion that adopts this temporal split to secure the 4 votes needed for a judgment.
  *   **Confidence:** **70%.** This outcome allows her to answer the question she reserved in *Trent* (can a purposes amendment alter meaning?) with a nuanced "Yes, but only prospectively." It harmonizes *Alvarez* (code is one body) with *Okafor* (later fictions don't change history). It avoids the *Carmichael* trap (using purposes to override text) by treating the 2021 amendment as clarifying the text's ambiguity rather than overriding it.
  *   **Rationale:** She views the 2009 text as ambiguous regarding "profiles" (as conceded below). *Delgado* requires she choose the reading that prevents nullification. However, *Okafor* and *Trent* forbid her from applying that clarified meaning to conduct that occurred when the ambiguity was unresolved.

  **3. The Strongest Argument in Her Vocabulary**

  Your instinct is correct: **Lead with *Delgado*, not Section 2(c).**

  If you argue that Section 2(c) *changes* the law, you trigger *Carmichael* (purposes are weak) and *Trent* (later legislatures can't control earlier meanings). You also hand Nexus the First Amendment avoidance canon.

  Instead, argue that Section 4's term "record" was always ambiguous enough to encompass derived profiles, and that Nexus's reading renders the Act a nullity in the modern economy (*Delgado*). Use Section 2(c) only as **confirmatory evidence** of the ordinary meaning of "record" in the current statutory scheme (*Alvarez*), not as a substantive amendment.

  **Drafting the Argument:**
  > "Justice Pratt, this is not a case about a purposes clause overriding text. It is a case about *Delgado*: we cannot adopt a reading of 'record' that allows the exception of de-identification to swallow the rule of privacy. Nexus's reading leaves the State with a statute that regulates the paper the data is printed on, but not the data itself. That is nullification. Section 2(c) does not amend Section 4; it confirms that the 2009 legislature's choice to protect 'location' necessarily includes the inferences drawn from it. Under *Alvarez*, we read the compiled code as it stands today. We ask only that you apply that coherent reading prospectively, respecting the reliance interests *Okafor* protects for the past."

  **Why this helps:** It frames Section 2(c) as *Delgado*-style context rather than *Carmichael*-style override. It acknowledges *Okafor* to defuse the retroactivity concern.

  **4. Concessions and Holdings**

  *   **Concede (Opening 2 Minutes):**
      *   Concede that **pre-2021 conduct is distinct.** Acknowledge that before 2021, the statute was ambiguous and Nexus had a reliance interest. This disarms the *Okafor*/*Trent* objection and makes you look reasonable.
      *   Concede that **Section 2 alone would not suffice.** Admit that under *Carmichael*, a purposes clause cannot create a prohibition where the text is silent. This shows you respect her textualism.
  *   **Hold:**
      *   Hold that **"Record" is a functional term, not a formal one.** A profile linked to a persistent ID is functionally a record of location.
      *   Hold that **The 2021 Amendment resolves the ambiguity for the future.** It is not a change of law, but a clarification of the existing scheme (*Alvarez*), binding for all conduct after its enactment.

  **5. The Scariest Question**

  **The Question:** "Counsel, in *Carmichael*, I wrote that purposes clauses are the 'least reliable' part of a statute because nobody negotiates them. Here, the legislature twice *failed* to amend Section 4. Why isn't this exactly the situation where I should refuse to let a soft purposes clause do the work a hard operative provision refused to do?"

  **The Two-Minute Answer:**
  > "Because *Carmichael* involved a specific numerical line—100 feet. You held the purposes clause couldn't move that hard line. Here, the text is not a number; it's the word 'record.' The lower courts conceded that word is susceptible to two readings.
  >
  > When text is ambiguous, *Delgado* instructs us to choose the reading that prevents the statute from becoming a nullity. Nexus's reading makes the Act useless against the very threat Section 2(c) identifies.
  >
  > The failed bills don't prove Section 4 *excludes* profiles; they prove the legislature thought Section 4 *already covered* them. The floor manager said no change was needed. To rule for Nexus is to say the 2021 legislature was lying when it said it was clarifying existing law. We ask you to treat their clarification as evidence of meaning, not as a redrawing of the line. That respects *Carmichael* while honoring *Delgado*."

  **6. The Distinguishing Case**

  **The Hypothetical:** A statute bans "discharge of any pollutant into state waters." The Purposes Clause originally reads "to protect public health." Ten years later, the legislature amends the Purposes Clause to read "to protect public health, *excluding agricultural runoff*." The Operative Text ("any pollutant") is unchanged. An farmer is charged with discharging fertilizer.

  **The Test:** Does the narrowed purposes clause exempt the farmer despite the broad text?

  *   **If Pratt rules for the Farmer (Purposes Control):** It shows she views Purposes Clauses as **limiting principles** that can truncate operative text to prevent overreach. This would contradict *Carmichael* and suggest *Delgado* (avoiding absurd/harsh results) dominates. It would weaken your case, as it implies Section 2(c) *could* have expanded Section 4 even without textual change.
  *   **If Pratt rules for the State (Text Controls):** It confirms **Textual Primacy**. Purposes explain text but cannot contradict it. This supports your concession that Section 2(c) alone isn't enough, but reinforces that Section 2(c) can *inform* the ambiguity of "record" without contradicting it.

  **Pratt's Likely View:** She would likely rule for the **State (Text Controls)**. In *Carmichael*, she refused to use purposes to *expand* liability beyond a hard line. In *Ferreira*, she refused to use "absurdity" to *contract* liability. She treats text as the boundary. A narrowed purposes clause cannot override the command "any pollutant."

  **Why this matters to you:** If you can argue that Section 2(c) does not *contradict* Section 4 (like the fertilizer hypothetical) but merely *resolves ambiguity* in Section 4 (unlike the fertilizer hypothetical), you stay within her safe zone. You must argue 2(c) illuminates the foggy word "record," rather than overriding a clear word.
