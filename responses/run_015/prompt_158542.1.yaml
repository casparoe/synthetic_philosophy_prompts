answer: |-
  **Project Title: The Transmission of Fanaticism Across Levels of Normative Assessment**

  **Research Question**
  The contemporary debate over expected-value fanaticism concerns whether one ought to favour an arbitrarily small chance of an astronomical payoff over a certain modest good. Standard responses modify the value function or the decision rule to block this conclusion in single cases. However, these positions leave open a prior structural question: what is the proper object of normative assessment? Is it a single act, a package of independent acts, or a policy mapping evidence to acts? This project asks: does avoiding fanaticism at the level of individual acts necessitate embracing it at the level of policies? The aim is not to verdict on fanaticism itself, but to determine whether fanaticism is transmitted across levels of description, such that avoiding it locally forces its acceptance globally.

  **Background and Motivation**
  The dispute has been conducted almost entirely as a disagreement about the shape of the value function or the validity of expected value maximisation in isolated decisions. Arguments making fanaticism vivid, however, rely on aggregation: a mugger's offer, a long run of such offers, or an indefinitely extended future. Consequently, standard positions have not had to take a stand on individuation. A view can avoid fanaticism in the single case only by becoming package-sensitive: letting the verdict on each of a long run of independent, tiny-probability bets depend on how many such bets will be available.

  This creates a theoretical gap. Package-sensitivity is either a holism that is diachronically unstable—where the agent's verdict at a time depends on facts about her entire future in a way she cannot use when deciding—or else it is best reconstrued as a claim about policies. If the latter, fanaticism reappears one level up, as a feature of the choice among policies rather than among acts. The literature currently lacks a map of this transmission. By shifting focus from the truth of fanaticism to its location within the hierarchy of normative assessment, this project sharpens the debate into a determinate question about structural consistency rather than substantive value.

  **Methodology**
  The project proceeds over twelve months using a formal toy model rather than abstract axiomatics, empirical study, or literature survey. Abstract axiomatics often obscures the dynamic tension between acts and policies; empirical study addresses descriptive psychology rather than normative structure; and a survey would merely catalogue existing positions without testing their coherence across time. Instead, I will construct a finite model of independent offers to trace how decision procedures behave under aggregation.

  *Months 1–3: Formalisation.* I will define a toy model comprising a finite sequence of independent offers, each involving a tiny probability of a finite but arbitrarily large payoff. I will formalise three classes of decision procedures: act-utilitarian (standard expected value), bounded-value, and risk-weighted. The apparatus will be kept minimal to ensure transparency, avoiding infinite ethics or probability uncertainty as per the project scope.

  *Months 4–6: Act-Level Analysis.* I will test whether standard anti-fanatic views remain stable when acts are individuated singly versus when they are viewed as parts of a package. I will demonstrate that avoiding fanaticism in the single case requires package-sensitivity. I will then analyse whether this sensitivity is diachronically stable or whether it forces the agent to rely on information unavailable at the time of decision.

  *Months 7–9: Policy-Level Analysis.* I will reconstrue the decision problem as a choice among policies (functions from evidence to acts). I will evaluate whether the anti-fanatic verdicts secured at the act-level dissolve when evaluated at the policy level. The key metric will be whether the expected value of the anti-fanatic policy converges with the fanatic policy over the long run.

  *Months 10–12: Synthesis and Writing.* I will integrate the findings to determine whether fanaticism is merely relocated or genuinely avoided. The final output will be a monograph-length article arguing that fanaticism is transmitted across levels of description.

  **Expected Results**
  There are three possible conclusions. First, the problem may dissolve if the distinction between acts and policies collapses under formal scrutiny. Second, the problem may relocate: act-level anti-fanaticism is preserved, but only by accepting policy-level fanaticism. Third, the problem may be amplified: policy-level evaluation reveals stronger pressures toward fanaticism than act-level evaluation due to compounding probabilities.

  The deciding consideration will be the stability of the package-sensitive verdicts. If an agent cannot rationally maintain an anti-fanatic stance without knowing the total number of future offers, the act-level view is diachronically unstable. If, however, the policy-level evaluation yields a definite verdict that diverges from the act-level verdict, the project establishes that the real question is which level is normatively basic. I anticipate the second result: fanaticism reappears at the policy level, suggesting that avoiding it requires rejecting the normative basicness of policies themselves.

  **Failure Conditions and Manageability**
  The project stands or falls on the tractability of the policy space. If the set of possible policies cannot be bounded sufficiently to allow for comparative evaluation within the formal model, the second phase of the project will stall. This is the most likely way the project becomes unmanageable: the combinatorial explosion of policy options may render the policy-level analysis computationally or conceptually intractable within a year. In this event, I will restrict the model to a specific class of threshold policies to ensure completion. A secondary failure condition is if the distinction between act and policy evaluation proves illusory in the finite case; however, preliminary modelling suggests this distinction remains robust enough to sustain the inquiry.

  \answer{Fanaticism persists regardless of the level of decision individuation.}
