  Your understanding of the standard position is accurate. You correctly identify that without consistency axioms like WARP, revealed preference is indeed a tautological ledger. You are not attacking a straw man; you have grasped the central tension between empirical content and logical consistency. Most critiques miss the role of consistency conditions across budgets; you have hit the nail on the head. The standard view relies on the assumption that the same ordering governs many budgets, and you are right to question what happens when budgets are unique.

  Regarding your answer to the first objection (language/arbitrariness): it is too optimistic. In information theory, encoding adds a constant, but in economics, the "language" is the functional form. If you choose the wrong form, the error isn't a fixed overhead; it grows with the data. The choice of language dictates which patterns are visible. If your language cannot express lexicographic preferences, no amount of data will compress. You need to acknowledge that the "language" is a theoretical commitment that constrains discovery. It is not merely a coding issue; it is a structural bias.

  Does the compression framing add something? Yes. Standard rationalisability is binary: choices are either consistent with a utility function or not. Your proposal makes it graded. It asks not "is this rational?" but "how efficiently is this predictable?" This shifts the goal from logical purity to predictive power. It aligns utility with scientific modeling rather than logical deduction. It allows you to say a model is "useful" even if it isn't perfectly "true." This prevents the theory from collapsing when minor inconsistencies appear, treating them as noise rather than falsification.

  On frame-dependence: indexing utility to situations saves the theory formally but threatens its usefulness. If every unique context requires a new utility function, you return to the ledger problem. Your reply works only if situations can be clustered. If "person-in-a-wine-shop" and "person-in-a-bar" share a compressed description, you have utility. If every shelf arrangement requires a new function, you have nothing. You acknowledge this risk, but emphasize the clustering requirement more strongly. The theory lives or dies on whether contexts can be grouped efficiently.

  Whose record is being compressed? On your view, utility becomes a property of the dataset, not the person. This is a crucial distinction. It makes utility instrumentalist: a tool for predicting behavior, not a description of internal welfare. This limits the normative use of utility. You cannot easily say a person is "better off" if utility is just a compression of past choices. It severs the link between choice and welfare. This is a significant philosophical cost you should highlight.

  The strongest objection you have not considered is stability over time. Compression assumes the past predicts the future. But preferences evolve, often endogenously. If the data generating process changes, the compression fails. A utility function derived from last year's data may not compress this year's choices. This temporal instability is a greater threat than framing.

  Is it worth writing up? Absolutely. The computational analogy clarifies the trade-off between model complexity and predictive accuracy. It moves the debate from metaphysics to information theory. This perspective bridges economics and cognitive science, suggesting utility is a cognitive heuristic. The essay contributes to methodological clarity by reframing utility as a modeling tool. Just be careful not to overclaim: compression explains prediction, not welfare. Your insight that utility is a graded claim is valuable. It rescues the theory from being falsified by minor inconsistencies. Write it, but tighten the argument on language and time. Ensure you distinguish between positive prediction and normative welfare, as your view undermines the latter. This distinction is where the essay will have the most impact.
