      *(Self-Correction)*: I need to be careful not to just say "Read Yudkowsky." I need to explain *why* the tension exists within *their* framework. The tension is between *Determinism* (all events fixed by past) and *Updatelessness* (my choice fixes the past prediction). In a deterministic world, my choice is fixed by the past. So how can my choice "fix" the prediction? Only if we treat the *algorithm* as the primary ontological unit, not the physical event. Point 6 resists this.

