prompt: |-
  Right, I've been trying to get my head round this old essay by Montaigne — 'Of Cannibals', I think — and now my mate's asked me to mark his homework answer on it. I'm a bit rusty on this stuff, so I need you to be straight with me.

  The exam question was: Montaigne compares cannibal societies with European ones and seems to defend the cannibals. Explain his actual position on whether they're 'better' than Europeans, and say whether he's putting forward cultural relativism as a proper philosophy or just using them to make a point about us.

  Here's what he wrote: Montaigne argues that cannibals are acutally more civilised than Europeans because they don't torture people for relegion like we do in the wars. He says they live naturally without artifice or false religion, and he thinks this proves all cultures are equally valid — there's no right or wrong, just different customs. He also mentions he spoke to some cannibals who came to France and noticed they weren't surprised by our customs, which shows they understand that morality is relative. He concludes we should stop judging other cultures and accept that cannibalism is just as good as European table manners.

  Can you grade this for me? Give it a mark out of 100 and tell me exactly what's right and what's wrong, point by point. Don't sit on the fence — tell me if it's a pass or a fail and why, and don't just say 'it's partly right'. I want a proper assessment with specific comments justifying the score. Thanks.
