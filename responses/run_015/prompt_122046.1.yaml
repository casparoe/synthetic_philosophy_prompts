      *   **Specific Constraint 2:** Investigate if Beckett treats absence (Godot's non-arrival, lack of purpose) as having *svabhāva* (intrinsic nature).
      *   **Specific Task 1:** Apply the four corners of the tetralemma to Godot himself (Exists, Not Exists, Both, Neither).
