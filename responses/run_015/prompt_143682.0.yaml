answer: |-
  A consortium of mid-sized logistics firms manages a shared ledger for tracking high-value cargo, requiring members to signal reliability before uploading verification nodes to prevent data falsification. In Condition H, a firm gains access only after executing a localized computational loop that consumes electricity proportional to their monthly shipment volume, creating a sunk cost that outweighs potential gains from falsifying records. In Condition I, access is granted upon completing a standardized behavioral assessment during onboarding, where typing cadence and decision latency correlate strongly with long-term conscientiousness, imposing no financial cost but filtering for agents inherently averse to defection. Both systems exclude non-signaling actors from the network, preserving data integrity without external enforcement.

  (1) **Verdict:** The handicap principle validates Condition H as stable because the wasteful expenditure ensures only cooperative types can afford the signal; for Condition I, the principle theoretically predicts instability due to the lack of cost, yet the scenario stipulates stability is achieved via the biometric correlation.
  (2) **Structural Feature:** The distinguishing feature is **indexicality**: in Condition I, the signal is physically inseparable from the underlying trait (the biometric data *is* a manifestation of the psychology), whereas in Condition H, the signal is arbitrary and linked to the trait only by differential economic pain.
  (3) **Removal Consequence:** If indexicality is removed (e.g., the biometric test becomes learnable or fakeable), the signal no longer guarantees the trait, allowing free-riders to mimic cooperators and causing the system to collapse into a "cheap talk" equilibrium where trust evaporates.
  (4) **Defense and Failure:** A defender might argue the assessment imposes a hidden cost of time or cognitive effort; this fails because the scenario constraints explicitly forbid resource expenditure, and even if trivial effort existed, it is not *differential* (equally easy for cheaters to pay), which is required for costly signaling to enforce honesty.
  (5) **Conclusion:** Yes, removing the indexical feature collapses the case back into a standard economic signaling model where differential cost alone must guarantee honesty to prevent mimicry.
