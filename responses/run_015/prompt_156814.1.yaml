answer: |-
  **Private Analysis: Candidate Counterparts and Rejections**

  *   **Claim 1 (Overdetermination):**
      *   *Considered:* **Structural Stability.** *Rejected:* This concerns robustness to parameter changes, but the claim focuses on a decision-maker's choice (initial condition) within a context of "pressures."
      *   *Considered:* **Shadowing Lemma.** *Rejected:* This validates numerical trajectories against true orbits; it does not address the probability of macro-outcomes.
      *   *Selected:* **Basin of Attraction Measure.** The outcome is robust because the ensemble of plausible initial conditions falls overwhelmingly into one basin.

  *   **Claim 2 (Knife-edge):**
      *   *Considered:* **Positive Lyapunov Exponent.** *Rejected:* This describes divergence within a regime, but "everything turned... differently" often implies a qualitative shift, not just trajectory separation.
      *   *Considered:* **Homoclinic Tangle.** *Rejected:* Too geometrically specific; unnecessary for general historical contingency.
      *   *Selected:* **Separatrix Crossing / Bifurcation.** The system is near a basin boundary; a small perturbation crosses the separatrix, landing in a different attractor.

  *   **Claim 3 (Path):**
      *   *Considered:* **Ergodicity.** *Rejected:* This equates time averages with space averages; historians care about the specific sequence, not the average state.
      *   *Considered:* **Attractor Geometry.** *Rejected:* This defines the endpoint, but the claim explicitly distinguishes the route from the endpoint.
      *   *Selected:* **Transient Dynamics.** The asymptotic state is fixed, but the trajectory through phase space before settling is sensitive and variable.

  ***

  **Part A — The Translation**

  (1) **Overdetermination:** This is a claim about the **measure of the basin of attraction**. Relative to the ensemble of plausible initial conditions (the "pressures"), the subset leading to the alternative outcome has measure near zero. The decision-maker's choice is a perturbation within a single basin; the coarse-grained outcome is invariant under that perturbation. It is not structural stability, but robustness of the macro-state to IC variation.

  (2) **Knife-edge:** You are correct; this is equivocal. Dynamically, it oscillates between **sensitive dependence on initial conditions** (positive Lyapunov exponent within a fixed attractor) and **basin boundary crossing** (a perturbation pushing the state across a separatrix into a different basin). The former yields divergence in trajectories but potentially similar macro-statistics; the latter yields a regime change. Historians often describe the latter (a different kingdom) using the vocabulary of the former (a lost nail).

  (3) **Path:** This distinguishes **transient dynamics** from **asymptotic behaviour**. The attractor (endpoint) is robust, but the trajectory taken to reach it is not. Contingency lives in the transient phase. The claim asserts that while the invariant measure might be stable, the specific realization of the trajectory carries historical significance. The coarse-graining here ignores the final state in favor of the path integral.

  **Part B — Policing Distinctions**

  **Fragility versus Leverage.**
  Claim (2) is about **Fragility**: a tiny perturbation at $t_0$ alters the state at $T$. Claim (1) is about **Lverage**: the variance in the outcome is attributable to the "pressures" (background parameters), not the agent's choice. Historians conflate these. They assume high fragility implies high leverage (that the small cause *mattered* in the aggregate), but in a chaotic system, high fragility often yields low leverage on macro-outcomes (the distribution remains unchanged despite trajectory divergence). Claim (1) asserts low leverage for the agent; Claim (2) asserts high fragility.

  **Perturbation versus Regime Change.**
  Claim (1) is a **Perturbation** claim: the vector field is fixed; the agent moves the state within a basin. Claim (2) often smuggles in a **Regime Change**: the "lost kingdom" implies a topological change in the attractor landscape, yet it is described as a small event. If the nail causes the kingdom's loss, the system must have been near a bifurcation point. Claim (2) requires the second interpretation to make sense of the magnitude of the effect, yet historians describe it as the first.

  **The Lost Nail.**
  I agree. The proverb describes a **chain of logical necessity** (if A then B), not dynamic amplification ($\delta_t \approx \delta_0 e^{\lambda t}$). It is a cascade of fixed couplings, not sensitive dependence. This matters because historians treat it as evidence of chaos (unpredictability) when it is actually evidence of tight coupling (determinism). It matters for contingency because it conflates "could have been otherwise" (logical possibility) with "would have been otherwise given small noise" (dynamic instability).

  **Part C — The Residue Report**

  (i) **Ensembles vs. n=1.** Confirmed. Your vocabulary requires a measure space; history offers a single trajectory. Any ensemble is counterfactual and epistemic, stipulated by the modeller. Claims about "probability" in history are not empirical frequencies but expressions of model uncertainty. This is not merely hard; it is ontologically distinct.

  (ii) **Time Asymmetry.** Confirmed. Dynamical laws are largely time-reversible; historical explanation is not. Retrodiction in history relies on narrative closure, not integrating backward. Your formalism cannot register the asymmetry of *explanation* versus *prediction*, only the asymmetry of Lyapunov growth.

  (iii) **Normativity.** Confirmed. Contingency underwrites responsibility ("they could have done otherwise"). In a deterministic state-space, "could have" requires an ensemble of counterfactuals that exists only in the modeller's mind. The framework is blind to agency. It is not that the claim is two claims bolted together; it is that your framework describes the *world*, while the historian describes the *agent-in-the-world*.

  (iv) **Coarse-graining.** Confirmed. There is no canonical observable. Claim (1) and (3) may not be rival empirical claims but rival **choices of observables**. If the outcome is "regime survival," (1) holds. If the outcome is "specific policy sequence," (3) holds. The disagreement is often about the partition of phase space, not the dynamics themselves.

  **Part D — The Verdict**

  None of the claims are simply false, but Claim (2) is imprecise to the point of distortion unless resolved into separatrix crossing. Claim (1) is a genuine empirical claim a model could adjudicate (by measuring basin volumes). Claim (3) is a claim about what we ought to attend to (transients vs. attractors).

  The core issue is contingency. If your vocabulary cannot express what historians want, it is not a defect in your framework, but evidence that "contingency" is a cluster concept doing three jobs: dynamic instability (Lyapunov), logical possibility (counterfactuals), and normative openness (agency). Your framework captures the first perfectly. It simulates the second only by stipulation. It cannot capture the third. Historians want all three when they say "contingent." You offer only the mechanics of the first. The translation fails not because the math is wrong, but because the historians are asking for moral luck using the vocabulary of fluid dynamics.
