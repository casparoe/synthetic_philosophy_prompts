      *   **Specific Questions Raised:**
          1.  Is the formation/expression distinction philosophically robust?
          2.  If robust, does algorithmic collapse undermine populist normative authority, or can data-derived will carry democratic weight?
          3.  How does this affect the boundary problem (constitutional limits vs. unlimited algorithmic voice)?
      *   **Constraints:**
          *   British English.
          *   Committed, dependency-aware agenda (prioritise and order the questions).
          *   Defend prioritisation (upstream/downstream, tractability via conceptual analysis, impact on legitimacy).
          *   Flag contested premises (avoid treating conclusions as self-evident).
          *   No survey of options; take a definite position.
          *   Avoid "decorative" lines of inquiry.

  2.  **Deconstruct the Core Problem:**
      *   The user identifies a shift from *deliberative will-formation* (traditional democratic theory) to *extractive will-expression* (algorithmic populism).
      *   Populists claim to speak for the "real people." Algorithms claim to *measure* the "real people" directly.
      *   If the "will" is just data points, do we need deliberation? If we don't need deliberation, does the "will" retain normative force?
      *   This challenges the very ontology of "the people" in populist theory.

  3.  **Determine the Order of Inquiry (Upstream to Downstream):**
      *   *Question 1 (Ontological/Conceptual):* Is the distinction between formation and expression robust? (You can't assess the value of algorithmic will if you don't know what a "will" *is* in this context.)
      *   *Question 2 (Normative/Epistemic):* Can data-derived will carry democratic weight? (Depends on Q1. If formation is essential, the answer is no. If expression suffices, maybe yes.)
      *   *Question 3 (Institutional/Constitutional):* How does this affect constitutional limits? (Depends on Q2. If the data-will is authoritative, limits are illegitimate. If not, limits stand.)

      *Decision:* The user asks for a *committed* agenda. I need to argue that Q1 is the absolute priority. Without settling the ontology of collective intentionality, the rest is moot. However, I also need to be critical. Is Q1 actually tractable? Yes, through conceptual analysis. Is Q3 decorative? Potentially, if Q2 resolves negatively.

      *Refining the Priority:*
      1.  **Priority 1:** The Ontology of the Will (Formation vs. Expression). This is the bedrock.
      2.  **Priority 2:** The Normative Authority of Extracted Will. This follows from 1.
      3.  **Priority 3:** The Boundary Problem (Constitutionalism). This is downstream of 2.

      *Critique of the User's Premise:* The user assumes the collapse is "accelerated by algorithmic governance." I should flag that this might be a category error. Algorithms don't extract *will*; they extract *preference signals*. Conflating the two is the philosophical error to be exposed.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the insight. The shift from deliberation to data is the critical juncture.
      *   *Priority 1 (The Ontological Priority):* Argue that we must first dismantle the claim that behaviour equals will. This is conceptual analysis. It challenges the "pre-political" vs. "discursive" debate by introducing a third category: "behavioural residue."
      *   *Priority 2 (The Normative Consequence):* Once we establish that behaviour $\neq$ will, we can argue that algorithmic mandates lack normative authority. This undermines the populist claim *without* needing to solve the "boundary problem" first.
      *   *Priority 3 (The Constitutional Question):* Argue this is currently decorative *unless* Q1 and Q2 are settled. If the data-will is fake, the threat to constitutionalism is illusory.
      *   *Contested Premises:* I need to explicitly state where I am making assumptions (e.g., that deliberation is necessary for legitimacy, that behaviour is not intention).

  5.  **Refining the Tone and Language:**
      *   British English (prioritise, programme, centre, analyse, etc.).
      *   Authoritative but humble about philosophical limits (flagging contested premises).
      *   Avoid "on the one hand, on the other." Take a stance.

  6.  **Developing the Content - Section by Section:**

      *   **Thesis:** The primary task is not to save democracy from algorithms, but to clarify that algorithms *cannot* produce a "will" in the political sense. The formation/expression distinction is robust, but not for the reasons usually given (it's about intentionality, not just procedure).
      *   **Phase 1: The Metaphysics of Collective Intentionality.** Focus on whether passive data traces can constitute an intention. Argue they cannot. This undermines the algorithmic claim at the root.
      *   **Phase 2: The Normative Gap.** If Phase 1 holds, algorithmic "will" has no authority. Populists using this data are making a category mistake, not a normative claim.
      *   **Phase 3: Constitutionalism.** Only relevant if Phase 2 fails (i.e., if we grant data-will authority). Since we likely won't, this is lower priority.
      *   **Critique of "Decorative" Questions:** The "boundary problem" is decorative if the "will" threatening the boundary is conceptually incoherent.

  7.  **Self-Correction/Review against Constraints:**
      *   *Did I prioritise?* Yes, Ontology -> Normativity -> Constitutionalism.
      *   *Did I flag contested premises?* Need to ensure I explicitly mark where I assume deliberative democracy is superior or where I assume behaviour isn't intention.
      *   *British English?* Check spelling and idiom.
      *   *Definite position?* Yes, arguing that the formation/expression distinction *is* robust and the algorithmic collapse is a category error.

  8.  **Final Polish:** Ensure the distinction between "upstream" (conceptual) and "downstream" (institutional) is clear. Emphasise that empirical social science cannot solve the ontological question.

