answer: |-
  **Research Agenda: The Ontology of Algorithmic Will-Formation**

  Your intuition is correct: the current literature on populism is often trapped in a loop of debating the *source* of the people's will (pre-political vs. discursive) while ignoring the *mechanism* of its identification. The rise of algorithmic governance does not merely accelerate existing trends; it introduces a category error that threatens to render the concept of "the will of the people" incoherent. If we treat behavioural data as political will, we are not simply changing how we measure democracy; we are changing what we mean by agency.

  To avoid decorative inquiry, your research programme must prioritise the metaphysical and conceptual questions over the institutional ones. You cannot determine whether algorithmic mandates undermine constitutional limits (the boundary problem) until you have established whether those mandates constitute a "will" capable of bearing authority in the first place.

  Below is a committed, dependency-aware agenda ordered by conceptual priority.

  ### Priority 1: The Ontology of Collective Intentionality
  **Question:** *Is the distinction between will-formation and will-expression philosophically robust, or is it a procedural artefact?*

  This is the absolute upstream priority. Much of the existing literature assumes that "will-formation" is a normative ideal (deliberation is good) and "will-expression" is a mechanical output (voting is necessary). You must argue that the distinction is **ontological**, not merely procedural. A "will" implies intentionality, and intentionality requires a subject capable of holding a propositional attitude towards a future state of affairs. Behavioural data (clicks, purchases, dwell time) are traces of causality, not necessarily expressions of intention.

  **The Argument:** You should posit that algorithmic extraction conflates *preference satisfaction* with *will-formation*. A consumer choosing a product satisfies a preference; a citizen deliberating on a law forms a collective will. The former can be mined; the latter must be made. If you can demonstrate conceptually that passive data generation lacks the intentional structure required for political agency, the claim that algorithms "extract" the popular will collapses.

  **Why this comes first:** If the distinction is not robust—if behaviour *is* a form of intention—then the algorithmic claim holds water, and democratic theory requires a total overhaul. If the distinction *is* robust (as I argue it is), then the algorithmic claim is a category mistake. You cannot assess the normative weight of a mandate (Priority 2) if the entity issuing the mandate does not exist.

  **Tractability:** This is purely conceptual. Empirical social science cannot tell you whether a click counts as an intention; only philosophical analysis of collective intentionality can.

  ### Priority 2: The Normative Authority of Synthetic Wills
  **Question:** *If a data-derived will is conceptually coherent, does it carry democratic weight?*

  This inquiry is downstream of Priority 1. You should only pursue this fully if your ontological analysis leaves open the possibility that behavioural aggregates could constitute a form of intentionality (perhaps a "thin" version). However, I recommend you argue that even if we grant a minimal intentionality to data, it lacks the **normative authority** required for populist mandates.

  **The Argument:** Populism relies on a claim to moral sovereignty, not just accurate prediction. A synthetic will derived from data may be *epistemically* accurate regarding current sentiments, but it lacks *normative* authority because it bypasses the transformation of private interest into public reason. The authority of the "people" in democratic theory stems from their capacity to bind themselves through law, not merely to be measured. A will that is registered but not formed cannot bind a populace because it has not undergone the test of public commitment.

  **Why this comes second:** You must establish the nature of the will (Priority 1) before you can judge its authority. However, this step is crucial because it addresses the populist claim directly. Populists argue they represent the "real" will against the "corrupt" elite. If you show that the "data-will" is normatively inert, you undermine the populist mandate without needing to defend specific institutions.

  **Tractability:** This requires conceptual analysis of legitimacy and authority, distinct from empirical studies of voter behaviour. It focuses on the *conditions* of legitimacy rather than the *sources* of data.

  ### Priority 3: The Boundary Problem and Constitutional Limits
  **Question:** *Does algorithmic extraction present an unlimited voice that betrays constitutional essentials?*

  This is the lowest priority of the three, despite its current fashionability. It is downstream of both ontology and normativity. The fear that algorithmic populism threatens constitutional limits presupposes that the algorithmic voice has a legitimate claim to sovereignty that needs limiting.

  **The Argument:** If Priority 1 establishes that data is not will, and Priority 2 establishes that extracted sentiment lacks normative authority, then the "unlimited voice" of the algorithm is a phantom threat. It does not represent popular sovereignty; it represents market research or surveillance. Therefore, the traditional boundary problem (how to limit the people's will without betraying democracy) does not apply, because there is no "people's will" present in the data to limit.

  **Why this comes last:** Focusing on constitutional limits now is decorative because it treats the algorithmic claim as legitimate enough to warrant a defensive strategy. It accepts the populist framing that there is a conflict between "the will" and "the constitution." Your upstream work should aim to dissolve this conflict by showing the "will" in question is conceptually spurious.

  **Tractability:** This is largely theoretical but risks becoming a policy debate. Keep it conceptual: focus on the *logic* of sovereignty rather than specific constitutional designs.

  ### Defence of Prioritisation

  This order is dictated by logical dependency. You cannot determine if a mandate undermines the constitution (Priority 3) if you do not know if the mandate is authoritative (Priority 2). You cannot know if the mandate is authoritative if you do not know if the entity issuing it is a "will" or merely a statistical aggregate (Priority 1).

  Much of the current literature inverts this, starting with the institutional threat (Priority 3) and working backwards. This leads to "decorative" solutions, such as proposing new oversight bodies for algorithms, which fail to address the conceptual collapse. By starting with the ontology of intentionality, you address the root error: the reification of data as agency.

  Furthermore, this prioritisation maximises the contribution of political philosophy. Empirical social science can tell us *how* algorithms predict behaviour, and legal theory can tell us *how* constitutions limit power. Only philosophy can analyse whether behavioural prediction constitutes political agency. Focusing here ensures your work is not rendered obsolete by technological shifts.

  ### Contested Premises

  In pursuing this agenda, you must explicitly flag that your reasoning rests on the following contested premises. Treating these as self-evident would weaken your defence:

  1.  **The Intentionality Premise:** You are assuming a cognitivist view of intentionality, where will requires a propositional attitude. Behaviourists or naturalists might argue that consistent behavioural patterns *are* sufficient for intention, regardless of internal deliberation. You must defend why political will requires more than behavioural regularity.
  2.  **The Deliberative Premise:** Your argument relies on the claim that normative authority requires a transformation of preference (deliberation/formation). Aggregative democrats might argue that the sum of raw preferences *is* the legitimate will. You need to justify why the "synthetic" will is inferior to the "formed" will without simply asserting the superiority of deliberative democracy.
  3.  **The Public/Private Distinction:** The agenda assumes a robust distinction between private behaviour (data) and public action (will). Feminist and critical theorists might argue this distinction is itself ideological. You should acknowledge that collapsing this boundary might be a feature, not a bug, of certain democratic theories, and explain why it is dangerous in this specific context.

  ### Conclusion

  Your research should not aim to save democracy from algorithms, but to save the concept of "the people" from being reduced to data. By prioritising the ontological question of will-formation, you expose the algorithmic collapse as a category error rather than a political innovation. This renders the subsequent questions about normative authority and constitutional limits easier to resolve, as they rest on a false premise. This approach ensures your work remains upstream, foundational, and resistant to the rapid obsolescence of empirical tech studies.
