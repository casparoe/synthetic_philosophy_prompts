      *Key Philosophical Move:* Distinguish between *aggregative preference* (data) and *collective intention* (will). This is the upstream conceptual work.

  9.  **Final Structure:**
      *   Introduction: Validate the research angle.
      *   Priority 1: The Ontology of Will (Formation vs. Expression).
      *   Priority 2: The Normative Authority of Data.
      *   Priority 3: The Boundary Problem (and why it's currently secondary).
      *   Flagging Contested Premises.
      *   Conclusion.

  10. (Final check on British English): "Prioritisation", "programme", "centre", "analyse", "defence".

  11. (Final check on "Contested Premises"): Ensure I explicitly state that my argument relies on a specific view of intentionality that not all philosophers share (e.g., behaviourists or certain naturalists might disagree).

  12. (Final check on "Upstream"): Make sure the logic flows: You can't judge the legitimacy (Q2) without defining the entity (Q1). You can't judge the limits (Q3) without establishing the legitimacy (Q2).

