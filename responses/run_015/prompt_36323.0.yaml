answer: |-
  Your explicit rejection of interpersonal summing (1) contradicts your endorsement of prioritarianism (2) and regulatory cost-benefit analysis (3), both of which necessitate aggregating interests across persons, and your rescue rule (4) fails to incorporate the weighting required by (2).

  Prioritarianism is fundamentally an aggregative view; it maximizes a moral value function that sums weighted welfare across persons, which violates a strict reading of (1) that forbids "interpersonal summing... into one total." Similarly, cost-benefit analysis (3) permits imposing losses on some for gains to others, which (1) declares illegitimate unless you rely on an ex ante fairness justification rather than ex post compensation. Finally, if benefits to the worse off count for more (2), then an unqualified duty to save the five over the one (4) is incorrect when the one is significantly worse off than the five, as their stronger claims should outweigh the headcount.

  The cheapest repair is to reinterpret (1) as a constraint against *sacrificing* individuals for the greater good (protecting rights/constraints) rather than a ban on all interpersonal comparison, qualify (4) with "all else equal" to accommodate prioritarian weighting, and ground (3) strictly in ex ante fair risk distribution rather than ex post welfare trade-offs. This preserves the core intuition of separateness (no one is used as a means) while allowing the comparative judgments required for policy and priority.
