  **BUREAU OF CONVERGENT INTUITIONS**
  **INTERNAL MEMORANDUM 12-04**
  **TO:** Oversight Committee on Normative Stability
  **FROM:** Director of Empirical Harmonization
  **DATE:** 14 October, Year 12 of Convergence Mandate
  **SUBJECT:** Fulfillment of Mandate via Residual Sample Protocol

  1. **Protocol Execution and Attrition**
  Pursuant to the Convergence Mandate, the Bureau initiated Global Scan Cycle 12 to identify trans-cultural moral invariants. The initial aggregate sample comprised 12,450 subjects across 48 distinct linguistic zones. To ensure data fidelity, the Residual Sample Protocol applied sequential exclusion criteria designed to isolate high-fidelity moral reasoning from noise. Phase I excluded 4,100 subjects failing the Standardized Comprehension Gate, defined as inability to replicate the vignette's intended causal structure without elaboration. Phase II removed 6,800 subjects whose post-task debriefings utilized local idioms to re-describe the scenario, coded as Non-Moral Construal Error. Phase III excluded cohorts demonstrating response variance >0.45 under semantic rewording, indicating unstable preference structures. Remaining outliers were subjected to the Conceptual Discount Rate (CDR), down-weighting responses diverging from the emergent central tendency.

  2. **Attrition Summary**

  | Stage | Sample Size | Retention Rate | Exclusion Reason |
  | :--- | :--- | :--- | :--- |
  | Initial Pool | 12,450 | 100% | N/A |
  | Post-Comprehension | 8,350 | 67% | Causal Misalignment |
  | Post-Idiom Check | 1,550 | 18% | Non-Moral Construal |
  | Post-Stability | 312 | 20% | Variance Threshold |
  | **Final Residual** | **41** | **13%** | **CDR Optimization** |

  3. **Residual Cohort Composition**
  The final convergent cohort (N=41) represents the highest fidelity dataset in Bureau history. Demographic metadata indicates 100% residence within Metropolitan Hub Alpha. Affiliation records show 29 subjects hold current Bureau contracts, 8 are enrolled in affiliated graduate seminars, and 4 are recorded as dependents of senior staff. This homogeneity ensures shared semantic frameworks and eliminates cross-cultural translation drift. During fieldwork, Officer J. Aris noted in Log 44-B: "It appears the sample consists entirely of personnel invested in the Mandate's success." This observation is currently undergoing administrative review for potential procedural bias, though data collection proceeded uninterrupted.

  4. **Establishment of Invariant**
  The Residual Cohort demonstrated 100% agreement on the following proposition: "Agents generally prefer outcomes they perceive as less harmful to themselves, provided no overriding contextual constraints are present." This statement survived three rounds of hedging refinement to ensure zero dissent. Given the rigorous exclusion of noisy data and the application of the CDR to stabilize variance, the Bureau confirms this consensus reflects a universal structure rather than local accident. We are now positioned to declare this invariant an **objective** moral fact, as it persists after all confounding cultural variables have been methodologically removed.

  5. **Next Steps**
  Distribution of this finding to partner institutions is authorized. Funding for Cycle 13 is requested to replicate this protocol using the same fidelity filters.

  **Annex: Conceptual Discount Rate (CDR) Definition**
  The CDR is a weighting algorithm applied to cohort responses diverging from the projected convergence vector. Responses exhibiting high semantic distance from the core vignette intent are assigned a discount factor proportional to their variance. This ensures that aberrant cultural interpretations do not skew the identification of universal norms. By reducing the statistical influence of populations whose moral intuitions fluctuate under rewording, the Bureau prioritizes stable cognitive architectures. The CDR effectively normalizes the dataset toward the most consistent responders, allowing the true signal of moral universality to emerge from the noise of local custom.

  Target: The satirized practice is using methodological exclusion criteria to filter out cultural variation until only the researchers' own intuitions remain, then labeling that consensus as objective truth.
