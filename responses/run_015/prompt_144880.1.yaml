      *   *Step 5 (Single Decision):* If an agent faces one choice and dies, money pumps (diachronic) are irrelevant. Dutch books (synchronic) rely on betting behavior which implies future settlement. If there's no future, the "loss" is just the outcome of the single choice. Coherence arguments largely evaporate, leaving only static consistency which is weaker than EU maximization.
