      Two strategies attempt to close this gap. First, the epistemic reconstruction posits that credences are governed by accuracy scoring rules. While this may constrain credences, it does not constrain action. To move from accurate credences to specific choices, one needs a bridge principle linking accuracy to choice, typically that one ought to maximize expected accuracy. This bridge principle is itself a decision-theoretic norm of the kind at issue, reintroducing the assumption rather than grounding it. Second, the constitutive reading suggests incoherence renders an agent unintelligible, so interpretation imposes expected-utility structure. This grants that we model agents as coherent. However, it converts a normative claim into a conceptual one. It explains why we attribute preferences, not why an agent ought to satisfy them. The challenge of why *be* coherent remains untouched for the agent herself.

      Finally, consider an agent facing exactly one decision. The diachronic machinery of money pumps is idle; there is no sequence to exploit. Synchronic Dutch books rely on betting dispositions that imply a market context often absent in single choices. For this agent, coherence arguments lose their grip, leaving only static consistency which is weaker than maximization.

      The argument is strongest where it exposes the dependence on a state-independent settlement currency and the asymmetry between avoiding loss and securing gain; without these, the normative force dissolves into prudence regarding a specific good. I concede that the constitutive reading successfully explains the ubiquity of expected-utility models in social science, but I maintain this is a victory for prediction, not normativity.

