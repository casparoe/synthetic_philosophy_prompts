      Now the currency. These constructions denominate loss in a settlement currency, typically money. For a sure loss to be normative, the agent must value this currency in every state, independently of other holdings. If the currency's value is state-dependent—for instance, money matters less in a catastrophe—the bookie cannot guarantee a loss in all states. Furthermore, the arguments assume linearity: the agent must be willing to transact at arbitrary stake sizes to reveal precise probabilities. If she has thresholds or diminishing marginal utility, the mapping collapses. One might propose denominating payoffs in utility units. This fails. Utility units are not a tangible currency a bookie can hand over. To define them antecedently is to presuppose the expected-utility representation the argument was meant to establish, rendering the reasoning circular.

