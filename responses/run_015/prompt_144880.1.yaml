      *   *Step 1 (The Immune Non-EU Agent):* Need an example. An agent with incomplete preferences (gappy). She refuses to trade A for B and B for A because they are incomparable, not because she prefers one. She holds her current endowment. A money pump requires willingness to trade along a cycle. If she refuses trades due to incomparability, the pump stops. She is sequence-immune. She is package-immune because she won't accept a bundle that leaves her worse off (she can detect dominance if the currency is involved). But she lacks a complete ordering, so no EU representation.
      *   *Step 2 (Currency & Stakes):* Why does the Dutch Book work? It assumes the agent values the settlement currency (money) linearly and state-independently. If money value depends on the state (e.g., money is useless in state S1), the bookie can't guarantee loss in *every* state. Also, standard arguments assume arbitrary stake sizes to map probabilities to prices. If the agent has thresholds (satisficing) or diminishing marginal utility not accounted for, the mapping breaks. Using "utils" as currency is circular: we need EU to define utils, but we are trying to prove EU.
      *   *Step 3 (Asymmetry & Reverse-Exposure):* Avoiding sure loss is defensive. Maximizing requires securing sure gain (or optimal gain). An agent can be immune to loss but leave money on the table (reverse-exposed). Is this irrational? Not necessarily. Caution vs. Aggression. Coherence arguments punish deviation via loss; they don't reward adherence via gain. To make reverse-exposure irrational, you need a premise that one *must* maximize gain, which is the conclusion we are trying to prove.
