  # Home Support Grant Eligibility Procedure

  **Purpose:** To determine eligibility for attendant care and equipment budget based on statutory criterion: "substantially unable to manage personal care without assistance."
  **Who uses this:** Community Nurse Assessors.
  **Time limit:** 15 minutes per file after visit.

  ### Part 1: The Procedure

  1.  **Check Hard Gates.**
      *   Verify County Residency.
      *   Verify Income is below cap.
      *   Verify no immediate safety risk (e.g., violence) that blocks service.
      *   *If any fail:* **STOP. Issue Denial.** [Hard No Gate]
      *   *If all pass:* Go to Step 2.

  2.  **Calculate Function Score.**
      *   Complete the 20-item form (0–3 per item).
      *   Sum the total score.
      *   *Note:* Score reflects ability **without** human help. Do not subtract points because family helps now. Do not add points because equipment exists. Score the person's body and mind alone.

  3.  **Check the Book (The Acceptable Range).**
      *   Compare the Total Score to the current **Eligibility Book**.
      *   **Current Book:** Scores **7 through 12** are the Borderline Zone.
      *   **Score 13 or higher:** Clear Eligibility.
      *   **Score 6 or lower:** Clear Ineligibility.
      *   **Score 7 through 12:** Borderline. Go to Step 4.

  4.  **Resolve Borderline Cases.**
      *   If the score is inside the Book (7–12), do **not** make a decision yourself.
      *   Mark the file as **ESCALATE**.
      *   Write a one-sentence note on the specific value conflict (e.g., "Score 8, but daughter unavailable" or "Score 10, but high fall risk").
      *   *Why:* This range is where reasonable people disagree. Your job is to report facts, not weigh budget against risk. [Value Call Hand-off]

  5.  **Check for Equipment Substitution.**
      *   If the score is 13+ (Clear Eligibility), check if a one-time equipment purchase (e.g., grab rails) removes the need for ongoing care.
      *   *If yes:* Recommend **Grant (Equipment Only)**.
      *   *If no:* Recommend **Grant (Full Care)**.
      *   *Note:* "Without assistance" means without human help. Equipment counts as ability, not assistance. If equipment makes them able, they do not need attendant care, but they qualify for the equipment budget.

  6.  **Check for Cited Precedent.**
      *   If the applicant or advocate cites a specific past file where someone with a lower score was granted:
      *   Mark the file as **ESCALATE**.
      *   Do not deny based on the Book if a precedent is formally cited.
      *   *Why:* Consistency requires admin review when past decisions conflict with the current Book. [Value Call Hand-off]

  7.  **Final Recommendation.**
      *   **Score 13+:** Grant.
      *   **Score 6 or lower:** Deny. (Unless Step 6 triggers).
      *   **Score 7–12:** Escalate.
      *   **Precedent Cited:** Escalate.

  ---

  ### Part 2: The Borderline Step (Robustness vs. Expected Value)

  You asked which version to put in the manual and defend to counsel.

  **Version A: Robustness (The Sharpening Book)**
  *   **Rule:** If the score falls inside the Book (7–12), the system treats the eligibility as undefined. We do not act until every acceptable way of drawing the line agrees. Since 7–12 is the range where past officers have disagreed, no single score here is definitive.
  *   **Action:** Escalate all 7–12 scores to Administration.
  *   **Defense to Counsel:** "This procedure guarantees consistency. We never deny a case that a previous officer might have granted, and never grant a case a previous officer might have denied, without senior review. It prevents arbitrary lines."

  **Version B: Expected Value (Cost/Benefit)**
  *   **Rule:** Treat the Book as uncertainty. Weigh the cost of a False Denial (hospitalization, liability) against the cost of a False Grant (budget drain). If the risk cost is higher, Grant.
  *   **Action:** Nurse calculates risk factors (dementia, fall history) and grants if risk > threshold.
  *   **Defense to Counsel:** "This procedure optimizes public safety and budget efficiency."

  **Recommendation:**
  Put **Version A (Robustness)** in the manual for nurses.
  *   **Why:** Nurses cannot calculate county liability costs or budget weights. Asking them to do so invites inconsistency (the exact problem you have). Version A makes the nurse's job factual (score the body) and pushes the value judgment (budget vs. risk) to you.
  *   **Defense:** Tell counsel you use Robustness to ensure *procedural fairness*. You use Expected Value internally (at the Admin level) to resolve the escalations. This keeps the manual clean and the decision-making defensible.

  **Where they differ:**
  *   **File:** Score 8, high fall risk.
  *   **Robustness:** Escalate (Score is in the Book).
  *   **Expected Value:** Grant (Risk cost > Grant cost).
  *   **Result:** Robustness slows the decision but protects you from appeals claiming the nurse made a policy call. Expected Value speeds it up but risks inconsistent grants between nurses.

  ---

  ### Part 3: Fuzzy Bits and Book Maintenance

  **1. Sharpening the Statute (Equipment vs. Assistance)**
  *   **Problem:** "Unable without assistance." Does equipment count as assistance?
  *   **Rule:** Sharpen **Jointly**. Do not score "ability with equipment" vs "ability without."
  *   **Procedure:** Score the person *without* equipment. If the score is high (eligible), check if equipment solves the risk.
  *   **Reasoning:** If grab rails make them safe, they are not "unable to manage personal care" *if provided the grant* (which includes equipment). They are unable without *anything*, but the grant provides the thing.
  *   **Outcome:** If equipment solves it, grant the equipment budget, deny attendant care hours. This respects the statute while managing budget.

  **2. Maintaining the Book**
  *   **Who Decides:** You (Admin) + County Counsel. Quarterly review.
  *   **Past Grants:** A past grant is an **act of drawing the line**, not evidence of where the line truly sits. It sets a precedent, but it does not prove the score was "correct."
  *   **Updating the Book:** Do not add 6 to the Book just because one person got it.
      *   **Rule:** To move the Book (e.g., add 6), you need **three** escalated cases with similar facts granted within 6 months.
      *   **Why:** This prevents "slippery slope" drift from single anomalies.
  *   **Sentence for Hearing Officer:** "Prior decisions reflect the boundary at that time; current eligibility is determined by the current boundary. Consistency is maintained by reviewing outliers, not by automating them."

  ---

  ### Part 4: Case Runs

  **File 1: Score 14, Equipment Issue**
  *   **Step 3:** Score 14 is outside the Book (High). Clear Eligibility.
  *   **Step 5:** Equipment (chair/rails) resolves the risk.
  *   **Procedure Output:** **Grant** (Equipment Budget only).
  *   **Reasoning:** "Without assistance" refers to human help. She is unable without help (Score 14). The grant covers equipment. Since equipment solves the need, care hours are not authorized, but the grant itself is issued. The term "without assistance" has no Book, so we apply the standard rule: Equipment = Ability.

  **File 2: Marta, Score 8, Dementia, Daughter Away**
  *   **Step 3:** Score 8 is inside the Book (7–12).
  *   **Step 4:** Borderline Zone.
  *   **Procedure Output:** **Escalate**.
  *   **Reasoning:** The score alone does not decide this. The value call (risk of dementia vs. budget) belongs to Admin. Under Robustness, you cannot deny her based on score alone because 8 is an admissible cut-off for eligibility. You must escalate. (Admin will likely Grant using Expected Value, but the procedure requires Escalation).

  **File 3: Score 6, Precedent Cited**
  *   **Step 3:** Score 6 is outside the Book (Low). Clear Ineligibility.
  *   **Step 6:** Precedent cited (Score 6 granted last March).
  *   **Procedure Output:** **Escalate**.
  *   **Reasoning:** Hard gate says Deny, but cited precedent triggers the consistency check. You cannot deny automatically without distinguishing the prior case.
  *   **Decision Letter Sentence:** "While a prior decision granted eligibility at this score, that decision was an act of setting the boundary at that time. Current policy maintains the boundary at 7 to ensure equitable distribution across all applicants. Your case has been reviewed for exceptional circumstances."

  ---

  ### Limitations and Judgment Calls

  This procedure cannot eliminate judgment; it relocates it. Steps 1 and 3 look like facts but rely on accurate nursing assessment (judgment). Step 4 (Escalate) admits that the score is not the truth, but a proxy. The "Hard No" gates are legal facts, but safety risks (Step 1) are clinical judgments. The procedure protects you by ensuring nurses don't make policy (value) calls, and protects applicants by ensuring borderline cases aren't auto-denied. The "Book" is a political tool, not a scientific one; maintaining it requires you to occasionally deny people like Marta (if budget forces it) or grant them (if risk forces it), but always via the Escalation path, not the scoring path.

  ### Theory Appendix (For Admin Only)

  Your partner was right about the philosophy, but wrong about the application.
  *   **Epistemicism:** Believes there is a real cut-off (e.g., 9.0), we just don't know it. If you follow this, you try to find the "true" 9. This fails because there is no true 9.
  *   **Supervaluationism:** Believes "eligible" is only true if it's eligible under *all* reasonable cut-offs. Since 8 is eligible under cut-off 7 but not 9, it is neither true nor false. It is indeterminate.
  *   **Your Procedure:** Adopts Supervaluationism for the nurses (The Book). If the score is in the Book, the truth value is indeterminate, so we Escalate. It adopts Decision Theory for you (Admin). Once escalated, you treat the Book as a probability distribution and maximize expected utility (Cost of Fall vs. Cost of Grant).
  *   **Why this works:** It separates *consistency* (Nurse/Book) from *welfare* (Admin/Utility). Counsel cares about consistency. The Board cares about welfare. This gives you both.

