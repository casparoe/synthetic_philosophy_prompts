answer: |-
  You have put your finger on one of the most significant and debated issues in contemporary philosophy of physics. You are not annoyed; you are doing philosophy of science.

  The specific shape you are describing has a name. It is called a **Singular Limit** (often discussed under the header of **Asymptotic Reasoning** or **Asymptotic Emergence**).

  The primary philosopher associated with mapping this terrain is **Robert Batterman** (specifically in his books *The Devil in the Details* and *Asymptotic Reasoning*).

  Here are the edges, the distinctions, and the verdict on the frictionless plane.

  ### 1. The Name and The Mechanism
  **Term:** **Singular Limit Reduction** (or simply **Singular Limits**).

  **The Mechanism:**
  In a standard ("regular") reduction, as you tweak a parameter in the lower-level theory to match the higher-level conditions, the behavior of the lower-level system smoothly converges to the behavior of the higher-level system.
  In a **Singular Limit**, the mathematics breaks down at the very point where the reduction is supposed to happen. The limit of the behavior is *not* the behavior of the limit.

  Mathematically, this is often a issue of **analyticity**.
  *   **Finite System (Real Water):** The partition function (which describes the statistical state) is an analytic function (smooth, differentiable). It cannot have a sharp "kink." Therefore, strictly speaking, finite water *cannot* undergo a phase transition; it can only undergo a rapid crossover.
  *   **Infinite System (Thermodynamic Limit):** When you take $N \to \infty$, the function becomes non-analytic. A "kink" appears. This kink *is* the phase transition.

  The "object" you are describing (the sharp boiling point) is a **singularity**. It exists only in the mathematical idealization of infinity. It does not exist in the finite physical world, yet it is required to explain the *type* of behavior we see (the distinct phase change).

  ### 2. The Edges: What's In and What's Out

  **What's IN (Singular Limits):**
  *   **Phase Transitions:** As you noted. Requires the Thermodynamic Limit ($N \to \infty$, $V \to \infty$, $N/V$ constant).
  *   **Classical Mechanics from QM:** The limit $\hbar \to 0$ is singular. Quantum wavefunctions do not smoothly turn into classical trajectories everywhere; they develop caustics and catastrophes (ray optics vs. wave optics is the same mathematical structure).
  *   **Irreversibility:** Deriving the Second Law from reversible Newtonian mechanics requires the Boltzmann-Grad limit (infinite particles, zero diameter, constant mean free path).
  *   **Fluid Dynamics:** Deriving the continuum equations (Navier-Stokes) from discrete molecular dynamics requires a limit where the Knudsen number goes to zero.

  **What's OUT (Regular Limits / Standard Idealizations):**
  *   **Smooth Approximations:** If a theory predicts $X$ and reality is $X + \epsilon$, and as $\epsilon \to 0$ the behavior remains qualitatively the same, that is a regular limit.
  *   **Negligible Forces:** Ignoring air resistance on a heavy ball. As air density $\to 0$, the trajectory smoothly approaches the vacuum trajectory. No new *kind* of behavior emerges at the limit; the old behavior just gets cleaner.

  ### 3. The Nearby Confusion: Idealization vs. Singularity

  You asked whether this is "just idealization" (like the frictionless plane). Your gut says no. **Your gut is correct.**

  **Standard Idealization (The Frictionless Plane):**
  *   **Status:** Contingently false. We could, in principle, make a surface smoother.
  *   **Mathematics:** **Regular Perturbation.** As the coefficient of friction $\mu \to 0$, the equations of motion remain well-behaved. The solution for $\mu = 0.0001$ looks qualitatively identical to the solution for $\mu = 0$.
  *   **Ontology:** The frictionless object is a *simplification* of a possible physical object.

  **Singular Limit (The Infinite Pot of Water):**
  *   **Status:** Necessarily false. You cannot have infinite particles in a finite universe.
  *   **Mathematics:** **Singular Perturbation.** The solution for $N = 10^{23}$ is *qualitatively different* from the solution for $N = \infty$. One is analytic (smooth); the other is non-analytic (sharp).
  *   **Ontology:** The infinite object is not a simplification; it is a **mathematical necessity** to account for a qualitative feature (the sharpness) that the finite theory literally cannot produce.

  **The Distinction:**
  In standard idealization, the ideal object is a *better version* of the real object (smoother, faster, cleaner).
  In singular limits, the ideal object is a *different category* of object. Real water doesn't "fail" to boil sharply; it is mathematically impossible for it to do so. The "sharp boiling point" is a **phantom object** that organizes the behavior of the real system without ever existing itself.

  ### 4. Why This Matters (The "So What?")

  This structure challenges the classic Nagelian view of reduction (where higher laws are logically derivable from lower laws).

  If the derivation only works in a limit that is physically impossible, then the higher-level theory (Thermodynamics) is **autonomous**. You cannot get Thermodynamics *strictly* from Statistical Mechanics without adding the mathematical postulate of infinity. This means Thermodynamics is not just "applied Stat Mech"; it relies on mathematical structures (singularities) that are invisible to the finite, lower-level theory.

  Batterman argues that this explains **Universality**. Why do vastly different systems (magnets, fluids, alloys) behave identically near critical points? Because the details of the lower-level theory (the specific molecular forces) get "washed out" by the singularity. The explanation for the behavior lies in the *mathematical structure of the limit*, not in the *physical details of the constituents*.

  ### 5. Summary Definition

  If you need a label to use in your own thinking or with colleagues:

  **Term:** **Asymptotic Ontology** (or **Singular Reduction**)
  **Definition:** A relationship between theories where the reducing theory explains the reduced phenomenon only via a mathematical limit that is physically unattainable, resulting in a qualitative discontinuity between the real system and the explanatory model.
  **Boundary Case:** The frictionless plane is **not** on the same side of the line. It is a *regular idealization*. The infinite pot of water is a *singular limit*.

  **The "Gut Check" Defense:**
  You can defend your intuition this way: On a frictionless plane, if you add a tiny bit of friction, the physics stays the same (the ball still rolls, just stops eventually). In the boiling pot, if you remove the infinity (go back to finite molecules), the physics *changes category* (the phase transition disappears entirely, replaced by a smooth crossover). The singular limit creates a **qualitative novelty** that the finite system does not possess.

  You have identified the precise reason why "more fundamental" does not always mean "more explanatory." Sometimes, you need the infinity to see the truth of the finite.
