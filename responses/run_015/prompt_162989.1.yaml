answer: |-
  ### Stage 1: Brainstorming Candidate Principles

  To account for your seven data points, we must consider the standard metaphysical candidates:

  1.  **Biological Animalism:** You are the human organism.
      *   *Fit:* Fails Case 1 (you locate yourself in the brain, not the organism) and Case 2 (a reconstruction is not the same organism).
  2.  **Simple Psychological Continuity:** You survive wherever your memories/character continue causally.
      *   *Fit:* Fails Case 3 and Case 6. If psychological continuity is all that matters, the copy in Case 3 *is* you, and both hemisphere recipients in Case 6 *are* you. Your intuitions reject fission.
  3.  **Four-Dimensionalism (Stage Theory):** You are a momentary time-slice; "survival" is just a convention of naming later slices.
      *   *Fit:* Technically compatible, but it dissolves the "I am/I am not" realism you are seeking. It treats your intuitions as linguistic preferences rather than metaphysical facts.
  4.  **Closest Continuer Theory:** You go with the *best* candidate among continuers.
      *   *Fit:* Handles Case 2 well. Struggles with Case 6 (if both hemispheres are equal, neither is "closest," so neither is you—which fits). However, it often implies that if one hemisphere were slightly better, you *would* be that one, which might conflict with your "Neither" intuition in symmetric fission.
  5.  **Non-Branching Psychological Continuity:** You survive iff there is psychological continuity *and* no branching (no rival continuer).
      *   *Fit:* Matches Cases 1–7 almost perfectly, provided we accept that identity depends on the non-existence of rivals.

  ### Stage 2: Elimination

  *   **Animalism** is eliminated by your acceptance of Case 2 (reconstruction) and Case 1 (brain location).
  *   **Simple Psychological Continuity** is eliminated by your rejection of fission (Cases 3 & 6).
  *   **Four-Dimensionalism** is set aside as it changes the subject from "identity" to "convention," whereas you are asking for the principle that validates your realist intuitions.
  *   **Closest Continuer** is a strong contender, but **Non-Branching Continuity** is more precise for your specific constraint: "no fork that outlives the fork point." Closest Continuer allows survival if one branch is *better*; Non-Branching requires *uniqueness*. Your Case 6 verdict ("Neither") suggests you require uniqueness, not just superiority.

  ### Stage 3: The Committed Principle

  I commit to the **Unique Causal Stream Principle**.

  **Definition:**
  Person *A* at time *t1* is identical to Person *B* at time *t2* if and only if:
  1.  **Continuity:** *B* is psychologically continuous with *A* via a reliable causal chain (preserving memory, character, and cognitive function); **AND**
  2.  **Uniqueness:** There is no other distinct person *C* at *t2* who is also psychologically continuous with *A* via a competing causal chain.

  **Live Dispute Flag:** This principle entails that personal identity is **extrinsic**. Whether *A* survives to *t2* depends not just on what happens to *A*'s brain, but on what happens elsewhere (i.e., whether a duplicate exists). Many philosophers (e.g., Bernard Williams, Derek Parfit) argue this is a fatal flaw; others (e.g., Robert Nozick, David Wiggins) accept it as the cost of preserving the logic of identity (which must be one-to-one).

  ### Stage 4: Mapping the Principle to Your Verdicts

  *   **Case 1 (Brain/Vat):** Satisfies Continuity (brain carries the process) and Uniqueness (no rival). *Verdict: You are where the brain is.*
  *   **Case 2 (Scan + Destroy):** Satisfies Continuity (information preserved) and Uniqueness (original destroyed, so no rival). *Verdict: Survival.*
  *   **Case 3 (Scan + Keep Original):** Satisfies Continuity, **fails Uniqueness**. Two candidates exist. *Verdict: Copy is not you.*
  *   **Case 4 (Gradual Replacement):** Satisfies Continuity (causal chain unbroken) and Uniqueness. *Verdict: Survival.*
  *   **Case 5 (One Hemisphere):** Satisfies Continuity (enough brain remains) and Uniqueness. *Verdict: Survival.*
  *   **Case 6 (Hemisphere Fission):** Satisfies Continuity (both halves work), **fails Uniqueness**. Two viable candidates exist. Identity cannot be one-to-two. *Verdict: Neither is you.*
  *   **Case 7 (Coma):** Satisfies Continuity (structure persists despite functional gap) and Uniqueness. *Verdict: Survival.*

  **The Cost (Your Worry on Case 2):** You suspected Case 2 depends on the "arbitrary" destruction of the original. The Unique Causal Stream Principle confirms this. It is not arbitrary; it is **structural**. Identity is a numerical relation (1=1). If the original persists, the relation becomes 1=2, which is logically impossible. Therefore, for the copy to be you, the original *must* cease to be a candidate. You must accept that **survival is not intrinsic**; it depends on the absence of rivals.

  **The Weakest Link:** Your intuition in **Case 6** ("Neither is me") is the most philosophically costly. While logically consistent with Uniqueness, it forces the conclusion that *survival* is less important than *identity*. Parfit famously argued that in Case 6, you should say "I am both" (revising the concept of identity) or "It doesn't matter" (focusing on survival rather than identity). If you find it unbearable that two perfectly healthy versions of you result in *your* death, Case 6 is the link to drop. However, to maintain the logic of your other cases (especially 3), Case 6 must stand.

  ### Stage 5: Verdicts on New Cases

  **(a) Rollback with Divergence**
  *Setup:* Backup (t-1 month) restored. Original runs for 1 week. Original destroyed.
  *Analysis:* At the moment of restoration, a fork exists. For that week, there are two causally continuous candidates.
  *Verdict:* **No, that is not you.**
  *Reasoning:* Under the Unique Causal Stream Principle, identity is determined at the point of divergence. Once a rival continuer exists (the original brain running for that week), the Unique Causal Stream is broken. The fact that the rival is later destroyed does not "heal" the break. Identity is not a baton that can be passed after a period of duplication. The rolled-back person is a new individual with your past memories.
  *Note:* This differs from Case 2 because in Case 2, the original is destroyed *at the moment of transfer*, preventing the fork from ever becoming a "rival continuer" in the same timeframe.

  **(b) Staggered Cutover**
  *Setup:* Migration region by region. Overlapping vs. 1-second gap.
  *Verdict:* **Yes, that is you in both scenarios.**
  *Reasoning:*
  *   *Overlapping:* This is a distributed version of Case 4 (Gradual Replacement). As long as there is a single, unified causal process (the two halves talking to each other), Uniqueness is preserved. You are temporarily spatially distributed, but numerically one.
  *   *1-Second Gap:* This falls under Case 7 (Coma). As long as the physical structure preserves the capacity to resume the process, a temporary functional gap does not break Continuity.
  *   *Location:* During the overlap, you are where the *process* is (distributed). Once complete, you are where the final substrate is.

  ### Summary of Philosophical Commitments

  1.  **Identity is One-to-One:** You cannot be two people. This drives the rejection of fission (Cases 3 & 6).
  2.  **Identity is Extrinsic:** Whether you survive depends on whether a rival exists (Case 2 vs 3). This is the price of (1).
  3.  **Continuity is Causal, Not Material:** Substrate changes (Case 4) and gaps (Case 7) are permissible if the causal chain of information processing is preserved.

  If you find the Extrinsicness (Case 2 dependency) or the Fission Death (Case 6) intolerable, you must abandon the Unique Causal Stream Principle. The only alternative that saves "Intrinsicness" is to accept that in Case 3 and 6, **both** are you (rejecting the logical constraint of identity), or that **neither** is you even in Case 2 (rejecting reconstruction). Given your stated intuitions, the Unique Causal Stream Principle is the only coherent framework that holds your system together.
