answer: |-
  **Welcome to the Family**

  Good morning. For those who don't know me, I'm not from round here. I'm from Coventry, originally. I've been in this town for twenty-odd years now, which is long enough to know that you don't just wake up one day and feel American. It's something you do, day after day. I help run a small volunteer group that supports new arrivals, so I know a bit about the paperwork, the waiting, and the relief of finally getting the 'yes'.

  It's a proper privilege to stand here. I see the Judge, and I see Mr Henderson from the Historical Society, who knows more about the abolitionists in this county than I ever will. And I see you—forty people who have chosen this place.

  Now, usually, this is the part where someone tells you that the Constitution is a perfect document written by perfect men, and you're lucky to have it. Or, they tell you the founders got a great deal wrong, and we've been slowly fixing it ever since.

  I want to suggest a third way. One that comes from a man who knew what it was to be owned by this country before he was a citizen of it.

  Frederick Douglass spent years arguing that the Constitution was a "glorious liberty document." This was controversial then, and it still raises eyebrows now. How could a man born into bondage say the supreme law of the land was on his side?

  His argument wasn't that the men who wrote it were saints. He knew they weren't. His argument was about the text itself. He pointed out that the word 'slavery' does not appear in the Constitution. Not once. It speaks of 'persons held to service', of 'other persons'. It uses euphemisms. Douglass argued this wasn't an accident. He believed the framers refused to put the word in because they knew they couldn't square the idea of human property with the principles of liberty they were pretending to uphold.

  So, the proslavery reading of the Constitution wasn't the only reading. It was a corruption. It was a choice made by slaveholders to twist the text to their will.

  I know what some of you might be thinking. I've met people who fled countries where the constitution was pure decoration. Where the words on the page meant nothing against the power of the state. It is tempting to look at this document and say, "The text didn't matter; the power did."

  But if Douglass is right, then the text *did* matter. Because if the Constitution had explicitly sanctioned slavery, if it had written the word into the law, there would have been no legal ground to stand on to abolish it. The silence of the text left the door open. It gave the abolitionists, and eventually the Union, the legal tool to dismantle the system without burning the house down.

  The document wasn't 'fine' while people were in chains. But the *promise* was there, waiting for people brave enough to enforce it.

  That is why I mention the abolitionists in this county. They didn't wait for permission. They read the document and decided to hold the country to its own words. They understood that a constitution is not a magic spell. It is a tool. And a tool is only as good as the hands that wield it.

  Today, you become the new hands.

  You are taking an oath to support and defend the Constitution. You are not swearing allegiance to the history of how it was ignored. You are swearing allegiance to the text as it *could* be, as Douglass insisted it was. You are joining the chain of people who decide that the plain meaning of liberty is stronger than the convenient reading of power.

  Welcome to the work. Welcome to the country.

  ***

  **Note on the Reading of Douglass**

  This speech leans heavily on Douglass's later constitutional theory (circa 1860's *The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?*), specifically the argument that the absence of the word 'slave' denies the federal government the authority to recognise property in man.

  **Where the speech takes a stance:**
  I have sided against your skepticism regarding the "word-not-being-there" point. While modern legal historians (such as Paul Finkelman) argue that the Constitution was functionally proslavery regardless of the specific vocabulary (citing the 3/5ths Clause and Fugitive Slave Clause), the speech adopts Douglass's view that the *omission* created a crucial legal vulnerability for the institution of slavery. The speech treats Douglass's "plain meaning" argument not as naive textualism, but as a strategic claim to legal standing: if the text does not explicitly grant power over slavery, that power remains with the states or natural law, allowing for federal intervention to protect liberty.

  **What would change the writing:**
  If the prevailing historical consensus shifted to view the omission of 'slavery' as merely a diplomatic euphemism with no legal consequence for federal power—meaning the 3/5ths and Fugitive Slave clauses *did* constitutionally entrench property rights in humans regardless of the missing noun—I would have to adjust the speech. In that case, I would have to frame Douglass's argument not as a correct reading of the *text*, but as a radical *reclaiming* of it. The speech would then need to emphasise that new citizens are inheriting a document that *requires* amendment and reinterpretation to function as liberty's shield, rather than one that was "always" capable of bearing that weight. However, for the purpose of a naturalisation ceremony, affirming the text's latent capacity for justice (Douglass's view) is more empowering than affirming its inherent structural flaws (the Garrisonian view), provided the gap between text and reality is acknowledged.
