  The principle is "Deliberative Transparency," which validates your verdicts by requiring access to the subject's moral calculus without exculpatory determinism or cynical erasure, meaning you must accept the reformer's ambiguity as the site of learning, drop the conflict between growth and static narratives, and classify the action-only biography as morally inert.

  Your intuition about Plutarch and the civil-rights organizer holds because both expose the *cost* of virtue, making it replicable rather than miraculous; this is the core of Deliberative Transparency. The hagiography fails because it removes the struggle (no cost), and the dictator biography fails because it removes the responsibility (no agency), while the enemy-written biography fails because it removes the value (no virtue to emulate), resolving your doubt about whether "evaluative distance" survives cynical framing. Your conflict between growth and static narratives dissolves under this principle because both teach equally well provided they reveal the internal maintenance of virtue, whether established or earned, so neither verdict must go but the tension between them is unnecessary. The 19th-century reformer case is not a failure of the biography but the intended exercise: the ambiguity forces you to adjudicate the value of the cause against the cost of the sacrifice, which is the actual work of moral learning rather than a sign of confusion. Finally, the action-only biography must be rejected as morally inert because without access to the inner life, there is no deliberation to transparently evaluate, leaving you with a ledger of events rather than a map of choices.
