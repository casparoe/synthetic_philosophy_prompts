  - **The weak link:** Step (6). This step assumes that "in-distribution" status is a transitive equivalence relation, but mechanistic anomaly detection (MAD) is fundamentally metric-based rather than logical. It measures the statistical distance of internal activations or causal traces from a training baseline, and distance metrics do not support transitivity over cumulative steps (i.e., $A \approx B$ and $B \approx C$ does not imply $A \approx C$).

  - **Why it looked okay:** We intuitively treat mechanism identity as a binary property (same vs. different), which invites the assumption that local preservation guarantees global preservation. This ignores that MAD operates on continuous similarity thresholds where small deviations can accumulate into a significant distributional shift.

  - **The price of rejection:** You must abandon the view of mechanisms as discrete natural kinds in favor of treating them as points in a high-dimensional metric space where identity is degree-based. This means safety cases cannot rely solely on proving stepwise preservation; you must explicitly bound the *cumulative drift* across all substitutions to ensure the final system remains within the anomaly threshold of the original. Practically, this requires defining a rigorous "mechanism distance" metric rather than relying on qualitative isomorphism.

      In the mechanistic explanation literature (e.g., Craver, Kaplan), this aligns with the view that mechanisms are hierarchically organized and level-relative. While computational isomorphism might hold at a high level, MAD tools often operate at lower levels (activations, noise profiles) where substrate differences manifest. Rejecting (6) acknowledges that "same mechanism" is context-dependent: valid for local functional checks, but invalid for global statistical detection when drift accumulates across the substrate.

  - **Bottom line:** MAD measures statistical distance, not logical identity. Substrate replacement accumulates micro-deviations until they cross the detection threshold, breaking transitivity.
