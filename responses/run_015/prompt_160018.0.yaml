      *   *Sentence 3:* "So when you decide to raise your arm, your decision isn't what makes your arm go up; the firings in your motor cortex already did that."
          *   *Philosophical Concept:* The Exclusion Principle / Competition.
          *   *Assessment:* Slightly misleading. It presents the conclusion as fact rather than a conditional result of the premises. It implies the neural firing *excludes* the decision.
      *   *Sentence 4:* "If your decision caused the movement as well, the movement would have two independent sufficient causes, and coincidences like that just don't happen."
          *   *Philosophical Concept:* Causal Overdetermination.
          *   *Assessment:* Crucial premise. "Independent" is the key word. Non-reductive physicalists deny independence. "Coincidences... don't happen" is the principle of exclusion.
      *   *Sentence 5:* "So the mind is causally inert: consciousness is real, but it doesn't do anything, and free will is an illusion."
