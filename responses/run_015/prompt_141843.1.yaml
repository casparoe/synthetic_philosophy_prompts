answer: |-
  # PART I: THE IDENTIFICATION KEY (LOGICAL STRUCTURE)

  **Instructions:** Begin at Couple 1. For each pair, select the statement (a or b) that best describes the candidate entity. Follow the instruction to proceed to the next couplet or to a Leaf.

  **1a.** The category "life" picks out a single, unified kind of thing in nature with sharp boundaries. → **Go to 2**
  **1b.** The category "life" is either a loose cluster of overlapping traits or a useless folk concept. → **Go to 9**

  **2a.** Membership in the category requires specific terrestrial chemistry (carbon backbones, liquid water solvent). → **Go to 3**
  **2b.** Membership is possible in non-terrestrial substrates (e.g., silicon, plasma, software). → **Go to 4**

  **3a.** Liquid water is strictly required for the category. → **LEAF A**
  **3b.** Water is not required, but carbon chemistry is. → **[UNOCCUPIED PATH 1]** *Diagnosis: Merely unattractive; those fixated on Earth-chemistry almost invariably fixate on water as the essential solvent.*

  **4a.** The entity must maintain a physical boundary (membrane, skin, wall) separating internal processes from the environment. → **Go to 5**
  **4b.** Information replication is sufficient; physical boundedness is not required. → **Go to 7**

  **5a.** The continuous self-repair of the boundary and internal metabolism is more fundamental than the production of copies. → **LEAF B**
  **5b.** The capacity to produce copies with variation is more fundamental than boundary maintenance. → **Go to 6**

  **6a.** The entity must be capable of open-ended Darwinian evolution (differential persistence of heritable traits). → **LEAF C**
  **6b.** The entity must have an actual historical lineage of descent, regardless of current evolutionary capacity. → **LEAF D**
  *[NOTE: Leaves C and D are flagged as **INSEPARABLE** by this key without a smuggled question. Both require evolution/descent. To split them, insert: "Does a single entity with no ancestors but full evolutionary capacity count?" If Yes → C, If No → D.]*

  **7a.** The substrate carrying the information must be chemical. → **LEAF C** *(Converges with Leaf C)*
  **7b.** The substrate can be non-chemical (e.g., digital code). → **LEAF E**

  **8a.** The entity must supply the energy and machinery for its own replication without external aid. → **[UNOCCUPIED PATH 2]** *Diagnosis: Incoherent in this branch; if physical boundaries are not required (4b), "own machinery" becomes ill-defined.*
  **8b.** External machinery for replication is permitted. → **Go to 7**

  **9a.** The category is a "cluster concept" where candidates share family resemblances but no single necessary trait. → **LEAF F**
  **9b.** The category is scientifically useless and should be discarded. → **Go to 10**

  **10a.** The word should be retained for rhetorical convenience despite lacking scientific extension. → **[UNOCCUPIED PATH 3]** *Diagnosis: Unexplored; eliminativists typically argue for total discard, not rhetorical retention.*
  **10b.** The word should be excised from scientific vocabulary entirely. → **LEAF G**

  **11a.** (Reserved for splitting Leaves C & D) Does the entity require ancestors? → **LEAF D**
  **11b.** (Reserved for splitting Leaves C & D) Is capacity sufficient? → **LEAF C**

  **12a.** (Spare couplet for granularity) Is the entity currently active, or can it be dormant? → **LEAF H**
  **12b.** (Spare couplet for granularity) Must activity be continuous? → **LEAF B**

  ***

  # PART II: THE LEAVES (POSITIONS & EMBARRASSMENTS)

  **LEAF A: Terrestrial Chauvinism**
  *Position:* Life is strictly defined by Earth-like carbon-and-water chemistry.
  *Embarrassing Case:* A self-replicating, evolving silicon-based entity found on Titan would have to be classified as non-living matter.

  **LEAF B: Autopoietic / Metabolism-First**
  *Position:* Life is a self-maintaining organizational closure that prioritizes boundary repair over reproduction.
  *Embarrassing Case:* A sterile worker ant or a mule is technically "not alive" because it cannot maintain the lineage long-term, only the individual.

  **LEAF C: Astrobiology Working Definition (NASA-style)**
  *Position:* Life is a self-sustaining chemical system capable of Darwinian evolution.
  *Embarrassing Case:* Viruses are excluded because they cannot evolve without hijacking a host's self-sustaining machinery.

  **LEAF D: Genealogical / Lineage**
  *Position:* Life is defined by actual historical descent; to be alive is to be part of an unbroken chain of ancestry.
  *Embarrassing Case:* The very first cell that ever emerged from non-living chemistry was not "alive" because it had no ancestors.

  **LEAF E: Substrate-Neutral Replicator**
  *Position:* Life is information that copies itself with variation, regardless of the physical stuff holding it.
  *Embarrassing Case:* A self-copying computer virus paying its own electricity bill qualifies as a living organism.

  **LEAF F: Pluralist / Cluster Concept**
  *Position:* There is no single definition; things are "alive" if they possess enough traits from a list (metabolism, reproduction, evolution, etc.).
  *Embarrassing Case:* We can agree on all the traits a candle flame possesses and still disagree on whether it is alive, rendering the list useless.

  **LEAF G: Eliminativist**
  *Position:* "Life" has no sharp extension and acts as a barrier to precise scientific description; the term should be abandoned.
  *Embarrassing Case:* It requires telling a general audience that a dog and a bacterium do not belong to any unified scientific category distinct from a rock.

  **LEAF H: Dormancy-Tolerant Evolutionary**
  *Position:* Life requires evolutionary capacity but allows for indefinite suspension of metabolism.
  *Embarrassing Case:* A bacterial spore sealed in salt for 100 million years is "alive" during the interval despite zero chemical activity occurring.

  ***

  # PART III: CASE TESTING TABLE

  | Candidate Entity | Key Path (Couplet Choices) | Final Leaf | Verdict | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Synthetic Cell** (Booted from file) | 1a, 2b, 4a, 5b, 6b | **D (Genealogical)** | **Not Alive** | Fails ancestry check; "booted" implies no biological parents. |
  | **ATP-Machine Lineage** (External machine does work) | 1a, 2b, 4a, 5b, 6a | **C (NASA)** | **Not Alive** | Fails "self-sustaining" requirement; relies on external machine. |
  | **Bacterial Spore** (Salt crystal, dormant) | 1a, 2a, 3a, 4a, 5b, 6a, 12a | **H (Dormancy)** | **Alive** | **Anchor Case.** Matches intuition (dormant but alive). |
  | **Fungal Network** (No bounded body) | 1a, 2b, 4a | **B (Autopoietic)** | **Debatable** | Fails strict "bounded individual" test depending on interpretation of network edge. |
  | **Mule** (Sterile hybrid) | 1a, 2b, 4a, 5b, 6a | **C (NASA)** | **Not Alive** | **Counter-Intuitive.** Fails evolutionary capacity (sterile). |
  | **Worker Ant** (Sterile) | 1a, 2b, 4a, 5b, 6a | **C (NASA)** | **Not Alive** | **Counter-Intuitive.** Same as Mule; individual cannot evolve. |
  | **Self-Replicating Code** (Pays own power) | 1a, 2b, 4b, 7b | **E (Replicator)** | **Alive** | **Counter-Intuitive.** Biologists reject software as life. |
  | **Virus** (Standard) | 1a, 2b, 4a, 5b, 6a | **C (NASA)** | **Not Alive** | **Anchor Case.** Matches standard "cheat" intuition (not self-sustaining). |
  | **Defective Virus** (Needs helper) | 1a, 2b, 4a, 5b, 6a | **C (NASA)** | **Not Alive** | Fails self-sustaining even more clearly than standard virus. |
  | **Candle Flame** | 1a, 2b, 4b, 7a | **C (NASA)** | **Not Alive** | **Anchor Case.** Fails "chemical system" (plasma/gas) or "heritable traits." |
  | **Crystal** (Growing) | 1a, 2b, 4b, 7a | **C (NASA)** | **Not Alive** | Fails "Darwinian evolution" (copies structure, not information with variation). |
  | **Self-Copying RNA** (Cell-free) | 1a, 2b, 4b, 7a, 6a | **C (NASA)** | **Alive** | Borderline; fits chemical + evolution, lacks boundary. |
  | **Heart Cell** (Dish, non-dividing) | 1a, 2b, 4a, 5a | **B (Autopoietic)** | **Alive** | Fits metabolism/boundary, fails replication. |
  | **Insect + Bacterium** (Symbiosis) | 1a, 2b, 4a | **B (Autopoietic)** | **Alive (Holobiont)** | Treated as single bounded metabolic unit. |

  **Anchor Cases:** Bacterial Spore (Must be Alive), Virus (Must be Not Alive/Debatable), Candle Flame (Must be Not Alive).
  **Counter-Intuitive Verdicts:** Mule/Worker Ant (Key says Not Alive), Self-Replicating Code (Key says Alive).

