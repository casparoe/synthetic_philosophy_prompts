  # PART IV: CLOSING NOTES

  **Running the Key Backwards (Sorting People)**
  To determine which definition a respondent holds, do not ask them to define life. Instead, present them with the **Counter-Intuitive Verdicts** from the table above and ask for their agreement.
  1.  **If they insist the Mule is alive:** They must reject Couple 5b/6a (Evolution/Replication priority). They are likely **Autopoietic (Leaf B)** or **Pluralist (Leaf F)**.
  2.  **If they insist the Code is not alive:** They must accept Couple 2a or 7a (Chemical Substrate). They are likely **Terrestrial (Leaf A)** or **NASA (Leaf C)**.
  3.  **If they insist the Synthetic Cell is alive despite no ancestors:** They reject Couple 6b (History). They are **NASA (Leaf C)** or **Replicator (Leaf E)**.
  4.  **If they reject the sharp boundaries of the key entirely:** They land immediately at **1b**, marking them as **Pluralist (Leaf F)** or **Eliminativist (Leaf G)**.

  **Handling the Strategic Respondent**
  A sophisticated student may recognize the logical structure and answer strategically to arrive at a preferred leaf (e.g., answering "No" to sharp boundaries to avoid the Mule problem). To detect this:
  *   **Demand Case Justification:** After they reach a Leaf, ask them to apply it to a case *not* in the table (e.g., "Is a fire alive under your definition?"). Strategic responders often break when applying their chosen definition to new data.
  *   **Check for Consistency:** If they claim to be a Pluralist (1b) but argue for sharp exclusion of viruses later, they are answering strategically. Point out that Pluralism allows viruses to be "alive" in some contexts.
  *   **The "First Cell" Trap:** Ask about the origin of life. If they claim to be Genealogical (Leaf D) but insist the first cell was alive, they have contradicted their own path. This reveals whether they truly hold the position or just navigated the key to it.
