prompt: |-
  Hey, I'm writing a short thing on social-choice aggregation and I keep running into this tension. Harsanyi's aggregation theorem says that if individual preferences and the social preference both satisfy vNM rationality, plus Pareto and some independece condition, then social welfare is just a weighted sum of individual cardnal utilities. But I was wondering: what if we drop pure vNM and instead use reference-dependent preferences — like Kahneman-Tversky prospect theory — at the individual level? So each person's utility is defined relative to some reference point, with loss aversion, and the reference point might even depend on what others get. Compare the standard Harsanyi setup with this reference-dependent varient. Specifically, which of Harsanyi's axioms break first? Can you still get any kind of linear aggregation, or does the social welfare function become nonlinear and context-sensitive? And if the reference point is socially determined, does that create a circularity problem for the aggregation? I don't need a formal derivation, just want to see where the analogy holds and where it collapses.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Topic:** Social choice aggregation, specifically comparing Harsanyi's Aggregation Theorem with a variant using reference-dependent preferences (Prospect Theory).
      *   **Core Question:** What happens to Harsanyi's axioms if individuals have reference-dependent utilities (loss aversion, endogenous reference points)?
      *   **Specific Sub-questions:**
          *   Which axioms break first?
          *   Can linear aggregation still hold, or does it become nonlinear/context-sensitive?
          *   Does a socially determined reference point create circularity?
      *   **Constraint:** No formal derivation needed; conceptual analysis of where the analogy holds/collapses.

  2.  **Recall/Analyze Harsanyi's Aggregation Theorem:**
      *   **Premise:** Individual preferences ($\succeq_i$) and Social preferences ($\succeq_S$) satisfy von Neumann-Morgenstern (vNM) rationality (completeness, transitivity, continuity, independence).
      *   **Conditions:** Pareto Indifference (if everyone is indifferent, society is indifferent) + Pareto Efficiency (if everyone prefers $A$ to $B$, society prefers $A$ to $B$).
      *   **Result:** Social Welfare Function ($W$) is a linear weighted sum of individual vNM utilities: $W = \sum a_i U_i + b$.
      *   **Key Axiom:** The Independence Axiom (linearity in probabilities) is crucial for the *cardinality* and *linearity* of the aggregation.

  3.  **Analyze Reference-Dependent Preferences (Prospect Theory):**
      *   **Features:**
          *   Reference Point ($R$): Utility is $V(x - R)$, not $U(x)$.
          *   Loss Aversion: Losses loom larger than gains ($V$ is steeper for losses).
          *   S-shape: Concave for gains, convex for losses.
          *   Probability Weighting: People overweight small probabilities (violates vNM independence).
      *   **Implication for Aggregation:** Utilities are no longer fixed functions of outcomes; they depend on $R$. If $R$ is exogenous, it's manageable. If $R$ is endogenous (depends on others/outcomes), it gets messy.

  4.  **Evaluate Axiom Breakdown (The "Which breaks first?" question):**
      *   *vNM Independence:* Prospect Theory explicitly violates this (Allais Paradox, probability weighting). So, the foundational assumption that individuals are vNM rationalizers is gone.
      *   *Pareto:* Pareto is usually defined over preferences. If preferences are reference-dependent, "preferred" depends on the reference. If the reference shifts between scenario A and scenario B, Pareto comparisons become unstable.
      *   *Social vNM Rationality:* If individuals aren't vNM, can society be? If society aggregates non-vNM preferences, the social preference will likely violate independence too.
      *   *Conclusion:* The **Independence Axiom** is the first major casualty. Without linearity in probabilities, the mathematical machinery for the weighted sum theorem collapses.

  5.  **Evaluate Linearity of Aggregation:**
      *   Harsanyi relies on the uniqueness of vNM utilities up to positive affine transformations.
      *   Prospect Theory utilities are not unique in the same way because the reference point scales the value function.
      *   Loss aversion implies the "weight" of a utility change depends on whether it's a gain or a loss relative to $R$.
      *   *Result:* Aggregation becomes **nonlinear**. You can't just sum $U_i$. You might need $\sum w_i(x, R) V_i(x_i - R_i)$. The weights or the value functions become state-dependent.

  6.  **Evaluate Endogenous Reference Points (Circularity):**
      *   Scenario: $R_i$ depends on what others get (e.g., average income, status).
      *   Social Welfare $W$ depends on $V_i(x_i - R_i)$.
      *   But $R_i$ depends on the allocation $x$ (which $W$ is trying to optimize).
      *   *Circularity:* To calculate social welfare, you need the reference point. To determine the reference point, you need the social allocation (or the distribution).
      *   *Fixed Point Problem:* You need a equilibrium reference point. This makes the social welfare function implicit rather than explicit. It creates path dependence and potential instability (multiple equilibria).

  7.  **Synthesize the Argument Structure:**
      *   **Introduction:** Acknowledge the tension. Harsanyi is clean (linear); Prospect Theory is messy (contextual).
      *   **Axiom Breakdown:** Focus on Independence and Transitivity (due to reference shifts).
      *   **Linearity vs. Nonlinearity:** Explain why the weighted sum fails (loss aversion creates kinks, reference points create shifts).
      *   **The Circularity/Endogeneity Issue:** Discuss the fixed-point problem when references are social.
      *   **Normative Implications:** Briefly touch on why this matters (paternalism, status quo bias in social choice).
      *   **Conclusion:** Summary of the collapse.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Independence":* Make sure to distinguish between vNM Independence (probabilities) and IIA (social choice). Harsanyi uses vNM Independence. Prospect Theory violates vNM Independence via probability weighting. It also violates it via reference dependence if the reference changes with the lottery.
      *   *Refining the "Circularity":* It's not just circular; it's a fixed-point problem. The social evaluator needs to know the reference point to judge the outcome, but the outcome determines the reference point.
      *   *Tone:* Keep it analytical but accessible (as requested, "short thing," "no formal derivation").

  9.  **Final Review against constraints:**
      *   Did I answer which axioms break? Yes (Independence/Transitivity).
      *   Did I address linear aggregation? Yes (becomes nonlinear).
      *   Did I address circularity? Yes (fixed point/endogeneity).
      *   No formal math? Kept it conceptual.

  10. **Final Polish:** Ensure clear headings and a strong concluding summary. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sharp question that cuts to the heart of why normative economics often struggles to incorporate behavioral insights. Harsanyi's theorem is elegant precisely because it relies on the structural rigidity of vNM utility. Once you introduce reference dependence (Prospect Theory), that rigidity dissolves.

  Here is a breakdown of where the analogy holds, where it collapses, and the specific mechanical failures that occur.

  ### 1. Which Axioms Break First?

  The first casualty is the **vNM Independence Axiom** (linearity in probabilities).

  *   **In Harsanyi:** Individuals maximize expected utility. This requires that if an individual prefers Lottery $A$ to $B$, they must prefer a mixture $pA + (1-p)C$ to $pB + (1-p)C$. This linearity is what allows individual utilities to be cardinally measured and summed linearly.
  *   **In Prospect Theory:** Individuals violate independence via **probability weighting** (overweighting small probabilities) and **reference dependence**. If the reference point shifts depending on the lottery being evaluated (which happens if the reference is endogenous), preferences can become intransitive.
  *   **The Break:** If individuals are not vNM rationalizers, the premise that there exists a unique utility function $U_i$ (up to affine transformation) representing their preferences is false. Without that unique cardinal scale, you cannot mathematically justify a linear weighted sum.

  Second to break is **Transitivity** (if the reference point is context-sensitive).
  If the reference point depends on the choice set or the status quo, you can construct cycles where $A \succ B$, $B \succ C$, but $C \succ A$ because the act of comparing $A$ to $C$ shifts the reference point differently than comparing $A$ to $B$. If individual preferences are intransitive, the Pareto condition becomes ill-defined (you can't say "everyone prefers A to B" if "prefers" isn't transitive).

  ### 2. Linear Aggregation vs. Context-Sensitive Nonlinearity

  In the standard Harsanyi setup, Social Welfare ($W$) looks like this:
  $$W = \sum a_i U_i(x)$$
  The weights ($a_i$) are constant, and the utility functions ($U_i$) are stable.

  In a reference-dependent variant, aggregation becomes **nonlinear and state-dependent**.

  *   **Loss Aversion Kinks:** Because the value function is steeper for losses than gains, the "social weight" of a utility change depends on whether the individual is currently above or below their reference point. A transfer of \$100 from a rich person to a poor person might increase social welfare in a standard model. In a reference-dependent model, if the rich person perceives the loss as a "loss" (high pain) and the poor person perceives the gain as a "gain" (lower marginal joy due to the S-curve), the net social effect could be negative.
  *   **Variable Weights:** You can no longer treat $a_i$ as a fixed ethical weight. The effective weight of an individual's welfare in the social calculus becomes a function of their position relative to their reference point. The aggregation function looks more like:
      $$W = \sum a_i(x, R) \cdot V_i(x_i - R_i)$$
      This destroys the clean separation between *ethical weights* (how much we care about person $i$) and *empirical states* (how person $i$ is doing).

  ### 3. The Circularity of Endogenous Reference Points

  This is the most critical collapse. In standard theory, preferences are over final states. In your variant, preferences are over deviations from a reference point ($R$).

  If $R$ is exogenous (e.g., fixed subsistence level), you can still run a modified aggregation. But if $R$ is **socially determined** (e.g., $R_i$ depends on the average consumption of others, or the status quo distribution), you create a **fixed-point problem**.

  *   **The Loop:** To evaluate the social welfare of allocation $X$, the social planner needs to know the reference points $R$. But $R$ is determined by $X$ (or by the expectations of $X$).
  *   **Multiple Equilibria:** There may be multiple reference points consistent with the same allocation. For example, if everyone expects to be rich, a middle-income outcome feels like a loss. If everyone expects to be poor, that same outcome feels like a gain. The social welfare function cannot rank the outcomes without first solving for the equilibrium reference point.
  *   **Normative Instability:** This creates a form of **path dependence**. The "optimal" social choice depends on the history of how the reference points were formed. Harsanyi's theorem promises a timeless ethical ranking; reference dependence ties social welfare to historical accident or framing.

  ### Summary of the Collapse

  | Feature | Harsanyi (vNM) | Reference-Dependent Variant |
  | :--- | :--- | :--- |
  | **Individual Rationality** | Satisfies Independence & Transitivity | Violates Independence; Transitivity at risk |
  | **Utility Measurement** | Cardinal, unique up to affine transform | Contextual, depends on $R$ |
  | **Aggregation Form** | Linear Weighted Sum ($\sum a_i U_i$) | Nonlinear, state-dependent ($\sum w(x,R)V_i$) |
  | **Reference Point** | Irrelevant (utility over final wealth) | Crucial (utility over gains/losses) |
  | **Determination** | Explicit solution | Implicit fixed-point problem (if $R$ is endogenous) |

  **The Bottom Line:**
  The analogy collapses at the **Independence Axiom**. Once you drop that, you lose the mathematical justification for linear aggregation. If you push through anyway and try to aggregate reference-dependent utilities, the Social Welfare Function ceases to be a stable ethical metric. It becomes a dynamic system that requires solving for an equilibrium reference point before it can even rank social states. This introduces a circularity where the *evaluation* of a society depends on the *expectations* formed within that society, making normative guidance highly fragile.
