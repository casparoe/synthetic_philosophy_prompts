answer: |-
  **Title:** The Grounding Gap: Tracking, Computation, and the Limits of the Darwin-Turing Analogy

  **Introduction**

  In the landscape of naturalistic philosophy of mind, few analogies are as seductive as the parallel between Charles Darwin and Alan Turing. Both figures are credited with inverting a traditional hierarchy of explanation: Darwin demonstrated that complex biological design could emerge without a Designer, and Turing proposed that intelligent behavior could emerge without a Mind. The standard interpretation, championed by philosophers like Daniel Dennett, suggests these are twin dissolutions of the "comprehension requirement." Just as an earthworm tills soil with engineering competence but without understanding structural mechanics, a machine might pass the Imitation Game with linguistic competence but without semantic understanding. In both cases, competence is decoupled from comprehension.

  However, this parallel relies on a specific assumption: that the mechanism producing competence is functionally identical in both domains. This essay challenges that assumption by articulating a "tracking-versus-computation asymmetry." Darwinian competence is historically anchored; it tracks environmental realities through generations of selective retention. Turing-machine competence, by contrast, is anchored in formal symbol-manipulation rules that carry no necessary causal relation to the world they describe. While a strong reductionist reply argues that evolutionary tracking itself reduces to genetic computation, collapsing the asymmetry, this view conflates the *mechanism* of selection with the *grounding* of function. I will argue that the asymmetry holds: Darwin's inversion succeeds in explaining adaptive competence without comprehension because natural selection provides semantic grounding through causal history. Turing's inversion, standing alone, substitutes syntactic adequacy for world-tracking adequacy. Consequently, comprehension is eliminated in Darwin's case by *history*, whereas in Turing's case it is merely bypassed by *syntax*.

  **The Parallel Inversions**

  To understand the weight of the asymmetry, we must first clarify the parallel. Pre-Darwinian biology relied on the Argument from Design: complex functionality (like the eye or the earthworm's soil-tilling) implied a prior intelligent agent. Darwin inverted this. He showed that "competence" (the ability to perform a function successfully) could accumulate through a blind, algorithmic process of variation and retention. The earthworm does not need a mental model of soil chemistry; it needs only behavioral dispositions that, historically, correlated with survival in soil.

  Turing performed a similar inversion for intelligence. Pre-Turingian conceptions of computation often assumed a "ghost in the machine"—a homunculus understanding the symbols. Turing's operationalism, crystallized in the Imitation Game, suggested that if a system behaves indistinguishably from a thinker, it should be granted the status of a thinker. The internal state of "understanding" is rendered epiphenomenal; behavioral output is the sole metric.

  Together, these inversions form the backbone of contemporary cognitive naturalism. They suggest that "comprehension" is not a magical spark but a functional capacity that can be engineered from the bottom up. If a worm can be a competent engineer without knowing engineering, and a computer can be a competent conversationalist without knowing language, then human comprehension itself may be nothing more than layers of such competence.

  **The Tracking-versus-Computation Asymmetry**

  The vulnerability in this analogy lies in the relationship between the competent agent and the world. This is the tracking-versus-computation asymmetry.

  Darwinian competence is inherently relational. An earthworm's behavior is "competent" only because it stands in a specific causal history with its environment. The worm's instincts "track" the soil because ancestors who failed to track the soil died. The competence is *about* the soil in a way that is secured by evolutionary pressure. There is a semantic link, established by natural selection, between the organism's internal states and the external environment. This is what Ruth Millikan calls "teleosemantics": the content of a biological state is determined by the function it was selected to perform. The worm's competence is *grounded* because it is the product of a feedback loop with reality.

  Turingan competence, defined strictly by the Imitation Game, is syntactic. A machine manipulates symbols based on formal rules. As John Searle's Chinese Room argument famously highlights, a system can manipulate symbols perfectly without any reference to what those symbols mean. A Turing machine could pass the Imitation Game by accessing a vast lookup table of responses, entirely devoid of any causal connection to the objects discussed. Its competence is anchored in internal consistency, not external covariance. It achieves behavioral success, but it lacks the "world-tracking adequacy" that characterizes biological adaptation.

  If this asymmetry holds, the two inversions are not parallel. Darwin eliminates comprehension by replacing the *thinker* with a *history of selection*. Turing eliminates comprehension by replacing the *thinker* with a *formal system*. The former preserves the link to reality (semantics); the latter risks severing it (syntax).

  **The Reductionist Reply: Evolution as Computation**

  The strongest reply to this asymmetry comes from the computational theory of life. Proponents like Dennett argue that the asymmetry is illusory because evolutionary tracking *is* a form of computation. DNA is a digital code; natural selection is an algorithm that processes this code based on fitness inputs. On this view, the earthworm is simply a "slow Turing machine" running a survival program. The "tracking" is just a high-level description of a computational process where the input variables happen to be environmental pressures.

  If evolution is computation, then the worm's grounding is no different in kind from the machine's. Both are syntax-driven engines. The worm's genes "manipulate symbols" (nucleotides) according to rules (biochemistry), and the "meaning" (survival) is an emergent property of the system's success. If we accept this reduction, the asymmetry collapses. Both Darwin and Turing show that semantic appearances can be generated by syntactic processes. The worm doesn't truly "track" the world in a mystical sense; it merely computes survival responses that happen to align with the world.

  **Critiquing the Reduction: Causal History vs. Formal Structure**

  While the reductionist reply is powerful, it conflates the *mechanism of change* with the *source of grounding*. It is true that evolution can be modeled computationally. However, a computational model of evolution is not the same thing as an isolated Turing machine.

  The crucial distinction lies in causal history. A Turing machine, as defined in the abstract, is ahistorical. Its symbols have no intrinsic meaning, and its operations do not require a connection to a specific environment. You can run a chess program on a computer that has never seen a chessboard; the syntax remains valid. The machine's competence is portable and detached.

  In contrast, the earthworm's competence is not portable. If you transplant the worm to a planet with different physics and chemistry, its "competence" vanishes instantly. Its internal states are only "competent" relative to the specific environment that shaped them. The "computation" of the genome is inextricably bound to the causal history of its selection. The syntax of DNA derives its semantic value (its "aboutness") from the historical fact that it was selected *for* coping with *that* world.

  Therefore, the reductionist reply fails to fully collapse the asymmetry. It explains how the worm *works* (computationally), but it does not explain how the worm *means* (semantically). To explain meaning, one must appeal to the selection history, not just the algorithmic structure. Turing's inversion provides the algorithmic structure but lacks the selection history. A standalone AI, without an evolutionary lineage or a causal embedding in the world, possesses the syntax of intelligence but lacks the semantic grounding of the worm.

  **Conclusion: Divergent Dissolutions**

  Does this asymmetry undermine the standard analogy? It refines it significantly. The analogy holds heuristically: both Darwin and Turing demonstrate that high-level order does not require a high-level originator. Competence can indeed exist without a conscious comprehender. However, the analogy fails ontologically regarding the nature of that competence.

  Darwin's inversion succeeds in eliminating comprehension because it replaces the need for an internal understanding with an external history of selection. The worm doesn't need to understand soil because the *process of evolution* understood the soil on its behalf, over millennia. The comprehension is distributed across time and population, grounding the individual's behavior in reality.

  Turing's inversion, conversely, eliminates comprehension by declaring it irrelevant to the definition of intelligence. It substitutes syntactic adequacy for world-tracking adequacy. Without an evolutionary history or a causal embedding (a la robotics or embodied cognition), the Turing machine remains a Chinese Room: behaviorally successful but semantically empty.

  Therefore, comprehension is not eliminated in both cases by the same move. In biology, comprehension is naturalized into *causal tracking*. In classical AI, comprehension is operationalized into *symbol manipulation*. Darwin shows us how to build a mind that knows the world; Turing shows us how to build a machine that mimics knowing. For the philosophy of mind, this distinction is vital. If we seek to explain human understanding, we cannot rely on Turing's inversion alone. We must integrate it with Darwin's. True competence without comprehension is possible, but only if the system doing the computing is also a system that has tracked the world. Darwin provides the anchor; Turing provides the engine. Without the anchor, the engine spins free, simulating intelligence without the substance of understanding. Thus, Darwin's inversion succeeds precisely where Turing's fails: in bridging the gap between syntax and the world.
