      *   **Category Mistake:** Treating a concept as if it belongs to one logical type when it belongs to another (e.g., looking for the "University" after seeing all the buildings).
      *   **The Ghost in the Machine:** Rejecting Cartesian dualism. The mind isn't a separate inner theater; it's dispositions to behave.
      *   **Mental Concepts:** Terms like "intelligent," "willing," "knowing" describe how someone acts or is disposed to act in situations, not hidden internal states.
