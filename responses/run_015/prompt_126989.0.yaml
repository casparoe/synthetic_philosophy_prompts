answer: |-
  You have stumbled onto one of the most famous deadlocks in 20th-century epistemology. Your friend Sam is channeling **G.E. Moore** (specifically his 1939 paper "Proof of an External World"), and your frustration is channeling **Barry Stroud**, **Ludwig Wittgenstein**, and contemporary skeptics.

  The reason you couldn't pin down *why* it felt like begging the question is that Moore's gesture is philosophically ambiguous. It can be interpreted in at least four distinct ways, ranging from "banal" to "revolutionary."

  Here is the breakdown of the distinct claims hidden in that gesture, their evaluation, and how your objections apply.

  ### 1. The Four Readings of the Gesture

  #### Reading A: The Moorean Common Sense Claim
  *   **The Claim:** "I know I have hands because I can see them. Since having hands entails an external world, I know there is an external world. Any philosophical theory that says I don't know this is absurd."
  *   **Status:** **Substantive but Dialectically Ineffective.**
      *   It is not *false* (Moore might be right), and it is not *trivial* (it makes a strong claim about the world). However, against a skeptic, it is **question-begging**.
      *   **Does it end the argument?** No. It satisfies only the person who already agrees. The skeptic grants the logic (validity) but denies the *knowledge of the premises*. To know "Here is a hand," you must rule out the possibility that you are a brain in a vat. Moore asserts he knows the premise without ruling that out.
      *   **Verdict:** This is what Sam *said*, but it fails to do the work he wanted.

  #### Reading B: The Wittgensteinian "Hinge" Proposition
  *   **The Claim:** "Here is one hand" is not a piece of knowledge that requires justification. It is a **hinge proposition**—a rule of the language game that allows justification to happen. You don't prove hinges; you rely on them to prove other things. Doubting it isn't a mistake; it's a category error.
  *   **Status:** **Substantive and Defensible.**
      *   This changes the definition of "knowledge." It says skepticism tries to apply epistemic standards where they don't fit.
      *   **Does it end the argument?** Yes, but by **dissolving** it rather than solving it. It tells the skeptic, "You aren't wrong that you can't prove it; you're wrong that it *needs* proof."
      *   **Verdict:** This saves the gesture from being a bad proof, but admits it isn't a proof at all.

  #### Reading C: Perceptual Dogmatism (Liberal Foundationalism)
  *   **The Claim:** Perceptual experience provides **immediate justification**. When it seems to you that you see a hand, you are justified in believing there is a hand *without* needing prior justification that you aren't a brain in a vat. The justification flows from the experience to the belief, not from the anti-skeptical hypothesis to the belief.
  *   **Status:** **Substantive and Defensible.** (This is the view of contemporary philosophers like Jim Pryor).
      *   It accepts the skeptic's logic (that if you were a vat-brain, you'd have the same experience) but denies the *epistemic priority*. You don't need to know you aren't a vat-brain *before* you can know you have hands.
      *   **Does it end the argument?** Yes, this is the only reading that attempts to **answer** the skeptic on their own turf without changing the subject.
      *   **Verdict:** This is the strongest philosophical candidate for making the gesture work.

  #### Reading D: Inference to the Best Explanation (Abduction)
  *   **The Claim:** "The hypothesis that there is a real hand explains my visual experience better than the hypothesis that a demon is tricking me. Therefore, I am justified in believing in the hand."
  *   **Status:** **Substantive but Vulnerable.**
      *   **Does it end the argument?** No. The skeptic argues that the "Demon Hypothesis" is empirically equivalent to the "Real Hand Hypothesis." If the evidence is identical, you can't use the evidence to choose between them.
      *   **Verdict:** This turns the gesture into a scientific hypothesis, which is weaker than the immediate certainty Sam implied.

  ---

  ### 2. Which Reading Was Sam Reaching For?

  Sam was almost certainly aiming for **Reading A (Moorean Common Sense)** but he *needed* **Reading C (Perceptual Dogmatism)** for it to work.

  Sam thought the gesture closed the question because he treats perceptual certainty as self-evident (Reading A). He thinks the premises are "obviously known." But when you pressed him on *why* they are known, he had no answer other than "look at them."
  *   If he were arguing for **Reading B (Hinges)**, he would have said, "We can't argue about this because this is the framework we argue within."
  *   If he were arguing for **Reading C (Dogmatism)**, he would have said, "My experience justifies me directly, without needing to rule out the vat first."

  Since he insisted it was a **proof** with **known premises**, he was stuck in Reading A. This is why your "begging the question" charge stuck: Reading A assumes the reliability of perception to prove the reliability of perception.

  ---

  ### 3. Analysis of Your Objections

  Your two objections are excellent. Here is exactly where they bite.

  #### Objection 1: The Vat Ambiguity ("Something external exists")
  *   **The Point:** If "external world" just means "something outside my mind," the skeptic agrees (the vat is outside your mind). If it means "material objects," the proof assumes what it proves.
  *   **Where it Bites:**
      *   **Bites Hard Against Reading A (Moore):** Moore's proof concludes "External objects exist." But if the premise "Here is a hand" is true even in a vat (as a virtual object), the conclusion doesn't rule out the vat. If the premise is *false* in a vat, then you don't *know* the premise unless you know you aren't in a vat. Sam cannot escape this dilemma with Reading A.
      *   **Bites Against Reading D (Abduction):** If the vat scenario explains the experience just as well, the inference fails.
      *   **Does NOT Bite Reading C (Dogmatism):** This reading doesn't claim to *logically refute* the vat possibility. It claims you are justified in believing you have hands *even if* you can't refute the vat. It separates justification from infallibility.
      *   **Does NOT Bite Reading B (Hinges):** Hinges aren't truth-claims about the vat; they are rules for discourse.

  #### Objection 2: The Analogy ("Here is a memory...")
  *   **The Point:** If "Here is a hand" proves the external world, why doesn't "Here is a memory" prove the past, or "Here is pain" prove other minds?
  *   **Where it Bites:**
      *   **Bites Against Reading A (Moore) & Reading E (Direct Realism):** If the mechanism is just "introspective certainty" or "direct acquaintance," then memory and pain should work the same way. Sam couldn't explain the asymmetry because Reading A treats all "obvious" truths as equal.
      *   **Does NOT Bite Reading C (Dogmatism):** Perceptual Dogmatists argue that **perceptual seemings** have a specific phenomenology (they present the world as *actually being there*) that memory seemings lack (memory presents the world as *having been there*). Perception has a "presentational" character that grants it a stronger justificatory status against skepticism than memory does.
      *   **Does NOT Bite Reading B (Hinges):** Wittgensteinians can argue that "I have two hands" is a universal hinge for human language games, whereas "I remember breakfast" is a contingent claim that can be doubted without collapsing the system.

  ---

  ### 4. The Solution: Answering the Vat Worry

  You asked to be moved by an account that **answers the vat worry instead of describing it away.**

  The only reading that does this is **Reading C: Perceptual Dogmatism (Liberal Foundationalism).**

  Here is the precise account you can use to satisfy your own intuition and correct Sam:

  **The Problem:** The skeptic relies on the **Closure Principle**: *If I know I have hands, and I know that having hands implies I'm not a brain in a vat, then I must know I'm not a brain in a vat.* Since I can't know I'm not a vat (the evidence is the same), I can't know I have hands.

  **Sam's Mistake (Reading A):** He tries to assert "I know I have hands" as a brute fact. The skeptic replies, "No, you don't, because you can't rule out the vat." This is a stalemate.

  **The Dogmatist Solution (Reading C):** This view rejects the **Epistemic Priority** the skeptic assumes.
  1.  **The Claim:** My visual experience of a hand gives me immediate justification to believe "Here is a hand."
  2.  **The Vat:** This justification does *not* require me to first justify "I am not a vat."
  3.  **The Reversal:** Instead, my justification for believing "I am not a vat" comes *from* my justification for believing "Here is a hand."
      *   I know I have hands (via perception).
      *   I know hands imply no vat.
      *   *Therefore*, I know I am not a vat.

  **Why this answers the worry:** It admits the skeptic is right that the *evidence* is compatible with the vat. But it denies that you need to rule out the vat *before* you can trust your eyes. It treats the skepticism as putting the cart (anti-skeptical proof) before the horse (perceptual belief).

  **How to deploy this against Sam:**
  Tell Sam: "You aren't making a Moorean proof (Reading A), because that begs the question. You are making a **Dogmatist** claim (Reading C). You are saying my eyes give me permission to believe in hands *without* checking for vats first. If that's your move, you have to explain why my eyes get that permission but my memories don't (my second objection). If you can't explain that asymmetry, you're just asserting confidence, not giving a proof."

  **Summary Table for Your Next Argument:**

  | Reading | Claim | Status | Does it beat the Skeptic? | Vulnerable to Your Objections? |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. Moorean Common Sense** | "It's obvious, so I know it." | Substantive but Question-Begging | No (Stalemate) | **Yes** (Both Vat & Analogy) |
  | **B. Wittgensteinian Hinge** | "This isn't knowledge, it's a rule." | Substantive & Defensible | Yes (Dissolves the game) | No (Changes the subject) |
  | **C. Perceptual Dogmatism** | "Experience justifies directly." | Substantive & Defensible | **Yes** (Reverses priority) | **No** (Can explain asymmetry) |
  | **D. Abduction (IBE)** | "Real world is the best explanation." | Substantive & Vulnerable | No (Underdetermination) | **Yes** (Vat explains equally well) |

  Sam wants the victory of **C** while using the language of **A**. That is why he couldn't defend it.
