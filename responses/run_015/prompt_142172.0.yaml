prompt: |-
  I do moderation (volunteer, unpaid, and yes I know how that sounds) on a long-running sandbox survival server — Minecraft-ish, except the world's been up for eleven years, the nightly snapshot only goes back thirty days so anything we miss is gone for good, and there's a house rule that a structure "belongs" to whoever built it for as long as someone in their group is still active. We're trying to write an actual policy document and I've realised I have very firm gut verdicts that don't obviously fit together. I want to know whether one principle is behind them or whether I have to give some up.

  1. Someone spends maybe 300 hours on a cathedral; another player burns it down with an in-game mechanic the rules explicitly allow. Verdict: real harm, we roll back and we ban.
  2. Same cathedral, wiped by a bad plugin update, no person did it. Verdict: nobody harmed anyone, and yet I want us to spend exactly the same effort restoring it. So the wrongness disappears but the badness doesn't?
  3. A player quits in 2014, never comes back, his enormous castle is still standing, nobody visits it. A new player knocks it flat. Verdict: feel bad about it, I'd stop them — even though the builder will never know and no current player cares. What's even being damaged there?
  4. Client-side defacement: someone runs a mod so that on their own screen the cathedral renders as rubble. Nobody else sees it, the save is untouched, they can toggle it. Verdict: not a harm at all, don't care, kind of funny. But if that's right then what I was protecting in (3) can't be "people's experience of the cathedral."
  5. Duping: someone uses a bug to copy a rare item instead of taking it. Nobody is deprived of anything, the economy shifts a bit. Verdict: genuinely wrong, but I can't say who is harmed.
  6. Someone griefs a character that turns out to be an automated one — no human behind it, indistinguishable in chat. Verdict: nothing happened. Same behaviour, no harm. Which suggests the harm is always to a person, never to the thing.
  7. Spawn-camping a real player for an hour so they effectively can't play. Verdict: real harm, and honestly worse than (1) — which is weird, because in (1) something that took 300 hours ceased to exist and here nothing in the world changed.
  8. Three players stand very close to someone's avatar in VR, silently, no chat, no touching, no damage, for twenty minutes. Verdict: definitely a harm, and it's worse in VR than the identical thing on a flatscreen, and I don't think that's just about intensity.
  9. Scamming someone out of an item that's on the official real-money marketplace (so it has an actual cash price) vs. scamming them out of an equally rare, equally hard-won item that can't legally be sold. Verdict: same harm. Which probly kills any purely economic account.

  My own attempt: "a virtual thing is real in the way that matters iff it's the kind of thing other agents can orient their behaviour and expectations around, and it was made by someone who meant it to persist." That gets (4) and maybe (6) right, but I think it makes (2) look fine and (1) look like nothing, and it says nothing about (8).

  Is there a principle that does better — ideally one that also gives verdicts on two cases we haven't had yet: a player who "claims" a naturally generated cave formation someone else then destroys, and an AI-run character that's been around for years and that current players genuinely care about, which we're about to delete in a cleanup.
reasoning: |-
  Here's a thinking process that leads to the suggested principle:

  1.  **Analyze the User and Context:**
      *   **Role:** Volunteer moderator on a long-running sandbox survival server (Minecraft-esque).
      *   **Server Context:** 11 years old, nightly snapshots only 30 days back (high stakes for loss), house rule on structure ownership (active group = ownership).
      *   **Task:** Writing a policy document.
      *   **Problem:** Has strong intuitive verdicts on 9 specific cases but can't find a unifying ethical principle that explains them all without contradiction.
      *   **Goal:** Find a principle that fits the existing verdicts *and* adjudicates two new cases (natural cave claim, AI character deletion).

  2.  **Deconstruct the 9 Cases & Verdicts:**

      *   *Case 1 (Intentional Griefing):* 300h cathedral burned by player (allowed mechanic). Verdict: **Harm, Rollback, Ban.** (High effort + Intentional destruction = Bad).
      *   *Case 2 (Plugin Wipe):* Same cathedral, wiped by bug/update. Verdict: **Restore (same effort), No Ban.** (High effort + Accidental loss = Bad, but no *villain*).
      *   *Case 3 (Abandoned Castle):* 2014 quitter's castle, new player destroys it. Verdict: **Stop them (Harm).** (No active owner + No current witnesses = Still Bad).
      *   *Case 4 (Client-side Mod):* One player sees rubble, others see cathedral. Verdict: **No Harm.** (Subjective experience alone isn't the locus of harm).
      *   *Case 5 (Duping):* Copying rare items. Verdict: **Wrong.** (No direct deprivation, but economy/scarcity harmed).
      *   *Case 6 (Bot Griefing):* Griefing an automated character. Verdict: **No Harm.** (No human behind it = No victim).
      *   *Case 7 (Spawn Camping):* Blocking a player for an hour. Verdict: **Real Harm (Worse than #1).** (No world change + Denial of agency/access = Very Bad).
      *   *Case 8 (VR Proximity):* Standing close silently in VR. Verdict: **Harm (Worse than flatscreen).** (Embodiment/Presence matters).
      *   *Case 9 (Scamming):* Real-money item vs. In-game only item. Verdict: **Same Harm.** (Value is not purely economic).

  3.  **Evaluate the User's Proposed Principle:**
      *   *Proposal:* "A virtual thing is real... iff it's the kind of thing other agents can orient their behaviour and expectations around, and it was made by someone who meant it to persist."
      *   *Critique:*
          *   Fits (4) (Client-side doesn't affect others' orientation).
          *   Fails (2) (Plugin wipe isn't an agent orienting behavior, yet restoration is warranted).
          *   Fails (1) (Makes it look like "nothing" because the destroyer *is* orienting behavior, just destructively).
          *   Fails (8) (Doesn't capture the visceral/embodied nature of VR harassment).
          *   Fails (3) (Who is orienting behavior around an abandoned castle? Maybe the *community* memory, but the principle is vague there).

  4.  **Identify the Core Tension:**
      *   The user is oscillating between **Consequentialism** (harm to people, economic loss, denial of play) and **Deontology/Property Rights** (ownership of labor, sanctity of creation).
      *   Case 6 vs. Case 3 is the biggest clash. Case 6 says "No human behind it = No harm." Case 3 says "No human behind it (anymore) = Still harm."
      *   Case 1 vs. Case 7 is also key. Case 1 destroys *objects*. Case 7 destroys *access/agency*. Case 7 is deemed *worse*. This suggests the primary good being protected is **Player Agency/Participation**, not just *Stuff*.
      *   Case 2 implies the *Labor/History* has intrinsic value to the server ecosystem, independent of current ownership.
      *   Case 8 (VR) implies **Embodiment/Presence** amplifies harm.

  5.  **Drafting a Unifying Theory:**
      *   *Idea 1: Social Contract.* The server is a shared social space. Harm is violating the implicit contract of co-existence. (Good for 1, 5, 7, 8. Weak on 2 and 3).
      *   *Idea 2: Labor Theory of Value.* You own what you build. (Good for 1, 3. Fails 6, 7, 8).
      *   *Idea 3: Shared World Integrity.* The world is a persistent record of collective activity. (Good for 2, 3. Weak on 7, 8).
      *   *Idea 4: Agency and Expectation.* (Close to user's idea).
      *   *Idea 5: "The World as a Common Good."* The server isn't just a collection of private plots; it's a public square with private homes.

      *Let's look closer at Case 3 (Abandoned Castle).* Why is it wrong to destroy it if the owner is gone?
      *   Because it serves as a *monument* or *landmark* for the *community*. It anchors the server's history.
      *   It creates *expectations* for new players (this is a persistent world).
      *   It represents *past agency* that deserves respect.

      *Let's look closer at Case 6 (Bot).* Why is griefing a bot okay?
      *   Because the bot has no agency to lose. It has no expectations.
      *   *Wait, Case 3 vs Case 6:* In Case 3, the *builder* had agency. In Case 6, the *character* never had agency. The harm in Case 3 is to the *history* and the *potential return* (however unlikely) and the *community's sense of permanence*. The harm in Case 6 is null because there is no past agency and no community investment.

      *Let's look closer at Case 7 (Spawn Camping).* Why is it worse than burning a cathedral?
      *   Because it attacks the *player*, not the *property*. It denies the fundamental right to participate.
      *   Property is secondary to Personhood.

      *Let's look closer at Case 8 (VR).*
      *   Violation of personal space/bubble. Embodied presence makes it feel like physical harassment.
      *   Reinforces that *Player Experience/Comfort* > *World State*.

      *Let's look closer at Case 2 (Plugin Wipe).*
      *   Why restore? Because the *Community's History* was lost. The labor was invested in the *Shared World*.

      *Synthesis:* The core value is **Shared Persistent Agency**.
      *   Players invest agency (time, effort, creativity) into the world.
      *   The world records that agency.
      *   Harm occurs when:
          1.  Agency is nullified (griefing, camping).
          2.  The record of agency is destroyed without consent (griefing, wipes).
          3.  The expectation of persistence is violated (scamming, duping, destroying old builds).
      *   *Crucial Distinction:* Is there a *human* source of agency involved (past or present)?

      *Refining the Principle:*
      "The server is a **Shared Historical Record of Human Agency**."
      *   Objects matter because they crystallize past human effort.
      *   Players matter because they are current sources of agency.
      *   Harm is the **unconsented negation of human agency**, either by erasing its past traces (builds) or blocking its current expression (camping, harassment).

      *Testing against cases:*
      1.  *Cathedral Burn:* Negates past agency (builder). **Harm.**
      2.  *Plugin Wipe:* Negates past agency (builder). **Harm (to history), restore.** (No ban because no *malicious* agent negating it).
      3.  *Abandoned Castle:* Negates past agency (2014 builder) + Community expectation of permanence. **Harm.** (The "owner" is the history itself).
      4.  *Client Mod:* No negation of shared agency. Only local perception. **No Harm.**
      5.  *Duping:* Devalues past agency (grinding for items). **Harm.**
      6.  *Bot Griefing:* No human agency to negate. **No Harm.**
      7.  *Spawn Camping:* Blocks current agency. **High Harm.** (Current > Past).
      8.  *VR Standing:* Violates bodily agency/presence. **Harm.**
      9.  *Scamming:* Negates agency of acquisition (effort/time). Money is irrelevant. **Harm.**

      *This looks very strong.* It resolves the 3 vs 6 conflict (Past Human Agency vs. No Human Agency). It resolves 1 vs 7 (Past Agency vs. Current Agency). It resolves 2 (Restoration is about honoring the Agency, not punishing a villain).

  6.  **Addressing the Two New Cases:**
      *   *Case A: Natural Cave Claim.* Player claims a natural formation. Another destroys it.
          *   *Analysis:* Natural generation = No Human Agency invested *in the structure*. However, "claiming" implies an intent to invest agency (maintenance, decoration, usage). If it's *just* a hole in the ground, destroying it is less severe than a cathedral. But if it's "claimed," it signals to others "I am orienting agency here."
          *   *Verdict:* If merely "claimed" (no work), destruction is rude but not bannable grief. If modified/worked on, it becomes crystallized agency.
          *   *Nuance:* Natural features belong to the *community history* (spawn landscape). Claiming them restricts shared agency.
      *   *Case B: AI Character Deletion.* AI run for years, players care.
          *   *Analysis:* This is the hard one. Case 6 said bots = no harm. But here, *players care*. The *players* have invested agency (emotional attachment, roleplay interactions) into the AI. The AI is a vessel for *player* agency, even if not controlled by one.
          *   *Verdict:* Deleting it negates the *players'* invested agency/expectations. It is a harm to the *community*, not the AI.
          *   *Distinction from Case 6:* Case 6 was griefing the bot (action against the object). Case B is admin deleting the bot (removal of a community fixture). If players treat it as a person, it functions as a social node. Deleting it severs social ties.

  7.  **Structuring the Response:**
      *   **Acknowledge the difficulty:** This is classic virtual ethics philosophy (Lockean labor, Hegelian recognition, etc.).
      *   **Propose the Principle:** "The Preservation of Crystallized and Active Human Agency."
      *   **Walkthrough:** Map the 9 cases to this principle to show how it fits.
      *   **Address the Tension:** Explain why Case 3 (Abandoned) differs from Case 6 (Bot) using this principle (Past Human vs. No Human).
      *   **Address the Tension:** Explain why Case 7 (Camping) > Case 1 (Burning) (Active Agency > Past Agency).
      *   **Adjudicate New Cases:** Apply the principle to the Cave and the AI.
      *   **Policy Wording:** Suggest how to write this into a doc without getting too philosophical.

  8.  **Refining the Principle Name:**
      *   "Crystallized Agency" is good.
      *   Maybe "The Principle of Invested Intent."
      *   Let's go with **"The Principle of Invested Human Agency."**
      *   Core tenet: The server is a medium for human will. Value is created when human will is invested into the world (building, grinding, socializing). Harm is the non-consensual destruction or obstruction of that invested will.

  9.  **Self-Correction/Edge Case Check:**
      *   *Case 2 (Plugin Wipe):* If harm is "non-consensual destruction," a plugin isn't an agent. But the *effect* is the destruction of invested agency. The policy response (restore) honors the agency. The lack of ban acknowledges the lack of *malicious* agent. This fits.
      *   *Case 8 (VR):* How does "Agency" cover "standing nearby"? It's about *Bodily Agency*. The player's control over their immediate sensory environment and personal space is a form of agency. Violating that is an obstruction of their comfortable participation.
      *   *Case 3 (Abandoned):* Does the agency persist after quitting? Yes, as a historical record. The "House Rule" says ownership lasts as long as someone is active. But the *Moderator Verdict* says don't destroy it. This implies a tension between "Ownership" (active) and "Heritage" (passive). The principle should distinguish between *Punishable Griefing* (violating active ownership) and *Restorable Heritage* (violating server history).
      *   *Wait, re-reading Case 3:* "I'd stop them." It doesn't explicitly say "Ban." It says "Stop them." This aligns with Heritage protection vs. Active Ownership protection.
      *   *Case 6 (Bot):* "Nothing happened." Because no human agency was invested *in* the bot (it's automated) and presumably no one was interacting with it at that moment.
      *   *Case B (AI Character):* "Players genuinely care about." This means Human Agency *has* been invested in the AI (socially). So deleting it *is* harm. This distinguishes it from Case 6.

  10. **Final Polish:** Ensure the tone is respectful of the volunteer work and the philosophical depth. Provide actionable policy language.

      *(Self-Correction on Case 3 vs House Rule)*: The house rule says structure belongs to the group "for as long as someone in their group is still active." Case 3 says the player quit in 2014 (inactive). So technically, per house rule, it's *unowned*. Yet the mod wants to stop destruction. This implies a tier of protection above ownership: **Server Heritage.**
      *   *Refined Principle:* **Active Agency** (Current players) > **Crystallized Agency** (Past builds/History) > **Natural State** (Untouched world).
      *   Harm is violating the expectations generated by these layers.

      *Let's stick to "Invested Human Agency" but distinguish between **Active** (current play) and **Sedimented** (past builds).*
      *   Case 7 (Camping) attacks Active Agency. (Worst).
      *   Case 1 (Burning) attacks Sedimented Agency of an active owner. (Very Bad).
      *   Case 3 (Abandoned) attacks Sedimented Agency of an inactive owner + Community Heritage. (Bad, stop it, but maybe less severe penalty than 1).
      *   Case 6 (Bot) attacks Nothing (No human agency invested).
      *   Case B (AI Friend) attacks Sedimented Social Agency (Community attachment). (Bad).

      *Okay, ready to write.*
answer: |-
  This is a fascinating problem because you are effectively doing applied moral philosophy for a specific digital micro-society. Your intuitions are actually very consistent; the problem is that you are trying to find a principle based on *property* or *economics*, when your verdicts show you are actually protecting **Human Agency**.

  Your gut is telling you that the server is not a collection of objects, but a **medium for human will**.

  Here is a principle that fits all nine of your cases, explains the tensions between them, and adjudicates your two new scenarios.

  ### The Principle: Invested Human Agency

  **"Value in this world is created when human intention is invested into the shared environment. Harm is the non-consensual negation, obstruction, or devaluation of that invested agency."**

  This principle distinguishes between three layers of agency, which explains why some harms feel "worse" than others:

  1.  **Active Agency:** A player's current ability to act, move, and participate (Cases 7, 8).
  2.  **Crystallized Agency:** Past labor and creativity solidified into builds or items (Cases 1, 2, 3, 5, 9).
  3.  **Social Agency:** The shared expectations and relationships formed between players (Cases 5, 8, 9).

  ---

  ### How this principle resolves your 9 cases

  **1. The Cathedral (Burned)**
  *   **Verdict:** Harm.
  *   **Why:** This is a violent negation of **Crystallized Agency**. 300 hours of human will was put into the world; one hour of malicious will erased it. The ban is because the *attacker* used their agency solely to negate another's.

  **2. The Cathedral (Plugin Wipe)**
  *   **Verdict:** Restore, No Ban.
  *   **Why:** The **Crystallized Agency** was still negated, so the *loss* is real and warrants restoration. However, there was no *malicious agent*. You restore the labor, but you don't punish a villain, because the "harm" was accidental entropy, not an attack on will.

  **3. The Abandoned Castle**
  *   **Verdict:** Stop them.
  *   **Why:** Even though the owner is inactive, the build represents **Crystallized Agency** that has become part of the server's **Heritage**. New players enter a social contract to respect the history of the space. Destroying it violates the community's expectation of permanence. It is harm to the *world's integrity*, even if the specific victim is absent.

  **4. Client-side Defacement**
  *   **Verdict:** No Harm.
  *   **Why:** No **Invested Agency** is touched. The save file (the shared reality) is unchanged. The other players' ability to orient themselves is unchanged. It is a private hallucination, not a public negation.

  **5. Duping**
  *   **Verdict:** Wrong.
  *   **Why:** This devalues **Crystallized Agency**. If I spent 50 hours grinding for a rare item, my labor gave it value. Duping makes my labor meaningless by decoupling scarcity from effort. It harms the *economy of effort*, not just the inventory.

  **6. Griefing a Bot**
  *   **Verdict:** No Harm.
  *   **Why:** There is no **Human Agency** invested in the bot. It is code. No one labored to make it (in the context of the game), and it has no will to obstruct. It is indistinguishable from breaking a naturally generated tree.

  **7. Spawn Camping**
  *   **Verdict:** Worse than Burning.
  *   **Why:** This attacks **Active Agency**. Destroying a building erases *past* will; camping prevents *current* will. You are effectively saying, "You are not allowed to exist here." Denying a player the ability to participate is a greater violation of the server's purpose than destroying an object.

  **8. VR Proximity**
  *   **Verdict:** Harm.
  *   **Why:** This violates **Bodily Agency**. In VR, the avatar is experienced as a body. Invading personal space obstructs the player's psychological safety and control over their immediate sensory environment. It is an obstruction of their ability to participate comfortably.

  **9. Scamming (RMT vs. In-Game)**
  *   **Verdict:** Same Harm.
  *   **Why:** The harm is not the cash value; it is the **Agency of Acquisition**. Whether I earned it via dollars or via 100 hours of gameplay, I invested *something* of my life to get it. Stealing it negates that investment. The medium of exchange is irrelevant; the violation of will is identical.

  ---

  ### Adjudicating Your Two New Cases

  Here is how you apply **Invested Human Agency** to the scenarios you haven't seen yet.

  #### Case A: The "Claimed" Natural Cave
  *A player verbally claims a naturally generated cave formation. Another player destroys/alters it.*

  *   **Analysis:** A natural formation contains **Zero Crystallized Agency**. It is the baseline state of the world. A verbal "claim" is an expression of intent, but until labor is invested (mining, decorating, fortifying), no agency has been *crystallized* into the terrain.
  *   **Verdict:** **Not a bannable offense, but discouraged.**
  *   **Reasoning:** You cannot ban someone for negating zero invested agency. However, if the "claim" was public and known, destroying it violates **Social Agency** (shared expectations). It is rude, but it is not griefing in the same way as burning a cathedral.
  *   **Policy Nuance:** "Natural terrain is public domain. Claims are only recognized once labor is visibly invested (signs, modifications, fencing). Destroying unworked terrain is not punishable, but destroying 'worked' terrain is."

  #### Case B: The Beloved AI Character
  *An AI-run character has existed for years. Players have formed attachments. Admins plan to delete it in a cleanup.*

  *   **Analysis:** This looks like Case 6 (The Bot), but it is fundamentally different. In Case 6, the bot was a prop. In this case, players have invested **Social Agency** into the AI. They have treated it as a person; it has become a node in their social network.
  *   **Verdict:** **Harmful. Do not delete without transition.**
  *   **Reasoning:** While the AI has no soul, the *players' relationships* are real human agency. Deleting the AI severs those social ties without consent. It negates the emotional labor players invested in that character.
  *   **Policy Nuance:** "Automated entities are not protected by default. However, if an automated entity has become a fixture of community social life (evidenced by player interaction logs), it acquires 'Heritage Status.' Removal requires notice and a narrative reason, not just a cleanup script."

  ---

  ### Why your previous attempt failed
  Your previous draft was: *"A virtual thing is real... iff it's the kind of thing other agents can orient their behaviour and expectations around..."*

  This failed because it was too **functional**.
  *   It couldn't explain Case 2 (The Plugin Wipe). No *agent* oriented behavior to wipe it, yet it was still a loss.
  *   It struggled with Case 7 (Camping). Camping doesn't necessarily destroy a "thing" people orient around; it destroys the *ability to orient oneself*.

  **Invested Human Agency** works better because it covers:
  1.  **The Object:** (The build as frozen labor).
  2.  **The Subject:** (The player as an active will).
  3.  **The Accident:** (Loss of labor is bad even without a villain).
  4.  **The History:** (Past labor retains value even if the laborer is gone).

  ### Suggested Policy Wording
  You don't want to put philosophy in your rules.txt. Here is how you translate **Invested Human Agency** into moderation guidelines:

  > **1. Protection of Labor:** Structures and items represent player time and effort. Destruction of another player's work is prohibited, regardless of the owner's current login status. (Protects Crystallized Agency).
  >
  > **2. Protection of Participation:** Actions that prevent another player from playing (spawn camping, blocking, harassment) are treated more severely than property damage. Denying access to the world is worse than damaging the world. (Protects Active Agency).
  >
  > **3. Integrity of Effort:** Exploits that bypass the intended effort to acquire items (duping, scamming) are prohibited, regardless of real-world monetary value. The harm is to the legitimacy of player achievement. (Protects Agency of Acquisition).
  >
  > **4. Shared Environment:** Natural terrain is public. Claims are only enforced once visible labor is invested. However, long-standing community fixtures (even automated ones) may not be removed without admin consultation if they serve a social function. (Protects Social Agency/Heritage).

  ### Summary
  You don't have to give up your gut verdicts. They are consistent. You are not protecting *pixels*; you are protecting the *time and will* people have poured into the pixels.

  *   **Case 6 (Bot)** is okay to grief because no human time was invested *in* it.
  *   **Case B (AI Friend)** is **not** okay to delete because human time was invested *with* it.
  *   **Case 7 (Camping)** is worse than **Case 1 (Burning)** because stopping a living will is worse than erasing a past will.

  Stick with **Invested Human Agency**. It holds the whole thing together.
