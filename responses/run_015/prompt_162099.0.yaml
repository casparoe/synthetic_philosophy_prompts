  3.  **Independent Knowledge:** Both analogies assume the opponent/verifier can access the truth. In omission cases, the truth is the missing data itself.

  **Verdict**
  The analogies were carrying the conclusion. They import guarantees (subpoena power, mathematical soundness) that do not exist in the target. Once removed, the claim that debate *guarantees* reliability against omission collapses. A defensible version survives only if weakened: debate increases the *cost* of omission by incentivizing opponents to scan for gaps, but it offers no security guarantee. It shifts the burden but does not solve the blind spot.

