  Regarding your specific query: Can the verifier be given a check dependent on absence? Only if the protocol specifies the absence check (e.g., "prove you did not skip step X"). Debate lacks a protocol for "all relevant considerations." You cannot verify what is absent unless you have a checklist of what *should* be there. The IP analogy fails here because "completeness" is not efficiently verifiable without a spec.

