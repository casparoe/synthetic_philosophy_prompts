      *   *Bhopal:* Acute phase (gas leak, immediate death/agony) vs. Chronic phase (groundwater, birth defects, legal limbo, poverty-illness cycle).
      *   *Residual Burden:* This is the user's coined term. It fits well with "long-termism" in effective altruism but focuses on *suffering* specifically. It highlights the transition from an "event" to a "state of being."
      *   *Tension:* NU is often criticized for being too demanding (eliminate *all* suffering) or implying the "benevolent world exploder" (if suffering > happiness, destroy the world). I need to avoid the latter and focus on the *prioritization* aspect.
      *   *Structural Complicity:* NU is often act-focused. Can it handle systemic/institutional harm?

  3.  **Drafting Section 1: Mapping Moral Actors and Duties:**
