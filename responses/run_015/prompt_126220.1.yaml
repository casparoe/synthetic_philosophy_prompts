      *   *Union Carbide (UCC):* Duty isn't just liability for the night of Dec 2nd. It's the duty to remediate the site. If toxins cause suffering, leaving them there is an active continuation of harm. NU views inaction here as action (allowing suffering).
      *   *Indian State:* Duty to protect citizens from suffering. If the legal system drags on, causing psychological/financial suffering, the state is complicit. Duty to prioritize health over economic growth (foreign investment).
