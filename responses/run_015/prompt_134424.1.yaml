answer: |-
  You have stumbled into one of the oldest, messiest debates in moral philosophy: the **Acts/Omissions Doctrine** versus **Special Obligations**.

  You are looking for a single scalar value—a `moral_severity()` function—that takes these inputs and returns a consistent float. I am going to be straight with you: **That function does not exist.** Not in philosophy, not in law, and not in engineering.

  However, your intuitions are not random. They are tracking three distinct variables that your brain is weighting simultaneously. When these variables align, you feel certainty (Cases 1, 5, 7). When they conflict, you feel the friction you're describing now (Cases 11, 12, 13).

  Here is the breakdown of the three variables, how they map to your 13 cases, where the model breaks, and how to handle your specific work scenarios.

  ### The Three-Variable Model

  To get close to your verdicts, you need to stop looking for "Doing vs. Allowing" and start looking at **Duty**, **Causal Proximity**, and **Baseline Expectation**.

  #### Variable 1: Special Duty (Role & Contract)
  *This variable overrides the Doing/Allowing distinction.*
  *   **Principle:** If you have accepted a specific role with explicit responsibilities, your omissions carry the weight of another person's actions.
  *   **Motivating Cases:**
      *   **(5) vs (6):** The lifeguard vs. the stranger. Physically identical omissions. Morally distinct because the lifeguard signed a contract (explicit duty) to intervene.
      *   **(7) vs (8):** The organ donor registry. Signing up creates a specific expectation/contract. Ghosting (8) violates a specific promise; not signing (7) is a general omission.
      *   **(13):** The license lapse. You have a custodial duty to the system. Letting it lapse is a breach of that duty, moving it closer to "killing" than a stranger's omission would be.
  *   **Engineering Implication:** In production, *everyone* on the on-call rotation is a lifeguard. There are no "strangers" in your codebase once you are on the team.

  #### Variable 2: Causal Proximity (State Transition)
  *This variable drives the "Doing is worse than Allowing" intuition.*
  *   **Principle:** Actively changing the state of the world from Safe → Unsafe is morally heavier than allowing the world to transition from Safe → Unsafe via entropy.
  *   **Motivating Cases:**
      *   **(1) vs (2):** Pushing the head under (active state change) vs. watching slipping (passive state change).
      *   **(9) vs (10):** Writing the bug (introducing failure mode) vs. inheriting the bug (failing to remove failure mode). You feel worse about (9) because you *injected* the risk.
      *   **(11) vs (12):** The cron job (active setup) vs. the manual re-arm (passive failure). (11) feels worse because you built the mechanism of death.
  *   **Engineering Implication:** This is why code reviews focus on *changes*. A diff that adds a risk is scrutinized more heavily than a diff that fails to remove a risk, even if the outcome is identical.

  #### Variable 3: Normative Baseline (Defaults & Consent)
  *This variable explains why Medicine (3/4) feels different than Drowning (1/2).*
  *   **Principle:** Morality is judged against a "normal" or "agreed upon" baseline. If the baseline is "death is coming," intervening to delay it is optional. If the baseline is "life is continuing," intervening to end it is active harm.
  *   **Motivating Cases:**
      *   **(3) vs (4):** Withholding vs. Withdrawing treatment. In modern bioethics, these are equivalent because the *baseline* is the terminal illness. The doctor is not the cause of death; the disease is. The doctor is merely stopping the *interruption* of the natural course.
      *   **(11) vs (12) (The Conflict):** Here is where your intuition is fighting itself. You feel (11) is worse because of Causal Proximity. But you also sense the arbitrariness. If the vendor sets the default to "Off" (12), is the moral burden really lower than if they set it to "On" (11)?
      *   **The Verdict:** In high-reliability engineering, **Defaults are Moral Choices.** If you build a system where safety requires constant manual intervention (12), you have built a system designed to fail. Therefore, in a mature engineering culture, (12) should eventually be judged *as harshly* as (11), because the engineer has a duty to fix the default.

  ---

  ### Clause-by-Clause Mapping & Where to Drop Intuitions

  Here is how the model processes your specific cases, and where I advise you to update your mental model.

  | Case | Verdict | Dominant Variable | Notes |
  | :--- | :--- | :--- | :--- |
  | **(1) Active Drowning** | Monstrous | Causal Proximity | Active state change Safe→Unsafe. |
  | **(2) Passive Drowning** | Bad, < (1) | Duty (Low) | No special duty. Entropy took the kid. |
  | **(3) Withdraw Treatment** | Fine | Baseline | Baseline is terminal illness. Consent exists. |
  | **(4) Withhold Treatment** | Fine | Baseline | Equivalent to (3). Baseline holds. |
  | **(5) Lifeguard Omission** | Monstrous | **Duty (High)** | Duty overrides Omission. Treated like (1). |
  | **(6) Stranger Omission** | Bad, < (5) | Duty (Low) | Same as (2). |
  | **(7) No Donor Reg** | Neutral | Baseline | Default state is "no surgery." |
  | **(8) Ghost Surgery** | Bad | Duty/Contract | Violated specific commitment. |
  | **(9) Wrote Bug** | Worse | Causal Proximity | Injected risk. |
  | **(10) Inherited Bug** | Bad, < (9) | Duty | Failed to mitigate, but didn't inject. |
  | **(11) Cron Delete** | "Killing" | Causal Proximity | Active setup of failure condition. |
  | **(12) Manual Re-arm** | "Letting Die" | Baseline | **DROP THIS DISTINCTION.** See below. |
  | **(13) License Lapse** | In-Between | Duty | Admin omission, but high duty. |

  #### The Intuition You Should Drop: (11) vs (12)
  You wrote: *"(11) vs (12) looks like it might just be about which way the vendor happened to set the default, and hanging blame on that feels totally arbitrary."*

  **You are right.** In a postmortem context, you should drop the intuition that (11) is morally worse than (12).
  *   **Why:** In safety-critical systems, **idempotency and safe defaults are requirements.**
  *   **The Evidence:** If you accept that (11) is worse than (12), you incentivize engineers to build systems that require manual re-arming (12) because it feels "safer" for their conscience if it fails. That is dangerous.
  *   **The Correction:** In a mature backend culture, (12) is a **design bug**. The engineer who accepted a system requiring manual re-arming for life-critical alerts shares responsibility for the architecture. The moral weight should equalize over time. If you know the alert is critical, failing to automate its persistence is an omission of duty equivalent to deleting it.

  #### The Intuition You Should Keep: (9) vs (10)
  Keep the distinction that writing the bug is worse than inheriting it.
  *   **Why:** This tracks with **Causal Agency**. Introducing a regression is an active state change. It is easier to prevent new bugs (PR reviews) than to audit all existing bugs.
  *   **Caveat:** This applies to *blame*, not *remediation*. In the postmortem, you fix (10) with the same urgency as (9), but the *psychological ownership* differs.

  ---

  ### The Bonus Cases: Applied Principles

  #### Case A: Removing a Safety Check for Performance
  *Scenario:* Team ships a change removing a safety check. User dies. Is this (1) or (2)?
  *   **Analysis:** This is **(1) Active Drowning.**
  *   **Reasoning:** You actively changed the system state from "Protected" to "Unprotected." Even though the *intent* was performance (not malice), the *causal proximity* is high. You removed a barrier that was known to be safety-critical.
  *   **Postmortem Verdict:** This is a commission error. It requires higher scrutiny than an omission. It is morally equivalent to removing a railing from a balcony to save on steel costs, even if you "didn't think anyone would fall."

  #### Case B: Triage (Ventilator Reallocation)
  *Scenario:* Move ventilator from Patient A (1 week left) to Patient B (needs it now).
  *   **Analysis:** This is **(3)/(4) Withholding/Withdrawing.**
  *   **Reasoning:** The baseline here is **Scarcity**, not Safety. The resource (ventilator) is the limiting factor, not the doctor's action. The cause of death for Patient A is the *lack of resources*, not the doctor's hand.
  *   **Principle:** **Utilitarian Triage.** When resources are insufficient for all, the duty shifts from "save this specific patient" to "maximize lives saved."
  *   **Verdict:** Morally permissible (and often required), provided the triage protocol is pre-established and not arbitrary. It is not "killing" Patient A; it is acknowledging that Patient A cannot be saved given the constraints.

  ---

  ### The "Single Principle" You Asked For

  If you force me to compress this into one sentence for your team:

  > **Moral responsibility is proportional to the degree of control you had over the outcome, multiplied by the duty of care you accepted, relative to the safe baseline of the system.**

  *   **Control:** Did you push the button or just watch it? (Cases 1, 9, 11)
  *   **Duty:** Are you a lifeguard or a stranger? (Cases 5, 8, 13)
  *   **Baseline:** Was the system designed to fail-safe or fail-deadly? (Cases 11, 12, A)

  ### What Would Prove Me Wrong?

  You asked for evidence that would show this model is wrong.
  **The Evidence:** A system where **omission is structurally harder than commission.**

  Imagine a deployment pipeline where:
  1.  To *deploy* code (Commission), you must click one button.
  2.  To *revert* code (Omission of the bad change), you must solve a CAPTCHA, get two approvals, and wait 24 hours.

  In this system, if a bad config goes out (Commission), it is easy. If you see it and don't fix it (Omission), it is hard.
  If your intuition says the engineer is *still* more to blame for deploying the bad config than for failing to revert it, then **Causal Proximity** dominates.
  If your intuition says the engineer is *more* to blame for failing to revert it (because they had the duty and the opportunity, despite the friction), then **Duty** dominates.

  In high-reliability engineering (SRE), we bet on **Duty**. We design systems where reverting is *easier* than deploying specifically to align moral/operational weight with safety. If your team makes reverting hard, you are morally complicit in the "omission" failures.

  ### Advice for the Postmortem

  Your team spent an hour arguing about "Saw it and left it" (Omission) vs. "Pushed it in" (Commission).
  **Stop arguing about the morality. Argue about the System.**

  1.  **Acknowledge the Equivalence:** State clearly: "In terms of patient outcome, (9) and (10) are identical. In terms of process, they are different."
  2.  **Fix the Baseline:** If "seeing a bad config and not fixing it" is a risk, why did the system allow the deploy to proceed with a known bad config? That is a **System Design Failure**, not just a human omission.
  3.  **The "Lifeguard" Clause:** Remind the team that in production, we are all lifeguards. The distinction between "I broke it" and "I didn't fix it" matters for *learning*, but it should not matter for *urgency of remediation*.

  **Final Verdict:** Your gut is tracking real ethical variables, but you are trying to solve a multi-variable equation with a single boolean. Accept that **Duty** often trumps **Action**, and that **Defaults** are where the real morality lives in software. If your config defaults to "unsafe," the person who wrote that default is morally closer to the drowning killer than the person who forgot to toggle the switch.
