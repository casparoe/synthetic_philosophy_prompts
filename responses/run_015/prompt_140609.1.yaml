      *Ranking:*
      1.  **1 vs. 3 (Severity: High).** This strikes at the core moral theory. You can't say Shame is "worse" simpliciter and also say it's "required" for identity wrongs without qualification.
      2.  **4 vs. 6 (Severity: Medium-High).** This strikes at the practical efficacy of the working group's plan. If 6 is right, 4's timeline ("over a generation") might be wrong, or the mechanism (private censure) might fail to shift regard-facts.
