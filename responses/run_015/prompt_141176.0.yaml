answer: |-
  # ANTHROPIC DECISION TREE
  **A Sorting Instrument for Self-Locating Belief**

  **ROOT:** You accept that finding yourself as *this* person at *this* time might bear on how large or long-lasting the world is.

  ### Q1. THE NATURE OF THE BEARING [LONGTERMISM FLAG ⚑]
  *Does the fact of your existence carry **evidential weight** (updating credences in non-indexical hypotheses), or only **practical/decision-theoretic import** (guiding action without changing credences)?*
  > **⚑ Longtermism Note:** If *Evidential*, expected-value calculations for existential risk are distorted by anthropic effects (inflation or deflation). If *Practical*, standard EV calculations may proceed, guided by indexical constraints on agency.

  *   **PRACTICAL / DEFLATIONARY** → **LEAF A: The Deflationary Position**
      *   *View:* Indexical facts never bear on non-indexical ones. Credences remain fixed; only policy changes.
      *   *Status:* **OCCUPIED** (e.g., Certain Decision-Theoretic views).
  *   **EVIDENTIAL** → *Proceed to Q2.*

  ### Q2. THE REFERENCE CLASS [TEST CASE: THE UPLIFT]
  *Who belongs in the sample? (Contrast: 10²¹ biological humans vs. 10²¹ alien/simulated minds).*
  *   **EVIDENCE-MATCHED** (Only observers with your exact total evidence) → **LEAF B: The No-Update Position**
      *   *View:* Future/disconnected observers lack your current evidence. No update on duration.
      *   *Status:* **OCCUPIED** (e.g., Restrictive Bayesianism).
  *   **SUBSTANTIVE** (Humans, Minds, or Possible Observers) → *Proceed to Q3.*

  ### Q3. THE SAMPLING UNIT [TEST CASE: THE MANY-NOWS]
  *What is counted? (Contrast: 1000 subjects with your evidence once vs. 1 subject with it 1000 times).*
  *   **OBSERVER-MOMENTS** → **LEAF C: SSSA (Strong Self-Sampling Assumption)**
      *   *View:* Sampling is over temporal slices. Resolves puzzles of memory loss/fission.
      *   *Status:* **OCCUPIED** (e.g., Bostrom 2002).
  *   **PERSONS** (Whole lives) → *Proceed to Q4.*

  ### Q4. THE WEIGHTING PROCEDURE [TEST CASES: THE ARCHIVIST / SEALED VAULTS]
  *How do you weigh hypotheses? (Contrast: 10¹¹ observers now vs. 10²¹ total; Causally sealed epochs).*
  *   **LOCATION / RANK DOMINANT** (SSA-style) → **LEAF D: The Doomsday Argument**
      *   *View:* You are a random sample from *actual* observers. Early birth rank favors shorter futures. Sealed vaults don't count.
      *   *Status:* **OCCUPIED**.
  *   **EXISTENCE DOMINANT** (SIA-style) → **LEAF E: The Presumptuous Philosopher**
      *   *View:* You are more likely to exist in worlds with more observers. Favors larger futures. Sealed vaults count.
      *   *Status:* **OCCUPIED**.
  *   **BALANCED / OFFSET** → **LEAF F: The Cancellation Position**
      *   *View:* SIA existence-weighting offsets SSA rank-weighting. Net update on duration is null, but existence is favored.
      *   *Status:* **OCCUPIED** (e.g., Early Bostrom / Dieks).

  ---

  ### LOGICAL SPACE & UNOCCUPIED COMBINATIONS
  *The full factorial space (2×3×2×3 = 36 paths) is pruned by the tree above. Unoccupied combinations are marked below.*

  | Path Combination | Status | Reason |
  | :--- | :--- | :--- |
  | **Practical + Substantive Ref Class** | *Incoherent* | If indexicals are merely practical, reference class definitions for evidential updating are moot. |
  | **Practical + Observer-Moments** | *Incoherent* | Sampling units apply to credence updating, not decision rules alone. |
  | **Evidential + Evidence-Matched + Persons/Moments** | *Pruned* | Leads to **Leaf B**; sampling unit is irrelevant if reference class excludes future observers. |
  | **Evidential + Substantive + Moments + Weighting** | *Pruned* | Leads to **Leaf C**; SSSA typically implies a specific weighting (Rank) inherent to the moment-view. |
  | **Evidential + Substantive + Persons + No Weighting** | *Unclaimed* | A position accepting persons as units but refusing to weight by rank or existence is undefined. |

  ### NOTE ON LEAF SEPARATION
  *   **Deflationary (A) vs. No-Update (B):** Separated at **Q1**. (A) denies evidential bearing; (B) accepts it but finds the update null due to reference class restrictions.
  *   **Doomsday (D) vs. SSSA (C):** Separated at **Q3**. Both favor shorter futures, but (C) grounds this in observer-moments (handling fission/amnesia), while (D) grounds it in persons.
  *   **Presumptuous (E) vs. Cancellation (F):** Separated at **Q4**. Both accept broad existence, but (F) explicitly incorporates rank-location to neutralize the duration update.

