answer: |-
  Your skepticism is well-founded because the impossibility theorem is often treated as a causal explanation for social conflict when it is actually a geometric constraint on joint distributions. To map this disciplinedly, we have to separate the mathematical object from the institutional actors. In the theorem, the decision-maker is the entity fixing the classification rule. In the COMPAS case, this is split. The vendor, Northpointe, fixed the scoring function mapping features to risk levels. The Broward County pretrial services and the judges fixed the threshold at which a score triggers action, whether that is a formal flag or an informal heuristic. ProPublica, acting as an external auditor, imposed a specific threshold to generate their binary confusion matrices. When the theorem says you cannot satisfy calibration and error rate parity simultaneously, it is describing the properties of the scoring function plus a threshold. Northpointe defended the scoring function's calibration, which is a property of the score itself regardless of where a user draws the line. ProPublica attacked the error rates at a specific operating point. The theorem explains why these two positions are mutually exclusive given the base rate differences in the data, but it does not explain why the vendor chose to optimize for calibration or why the county accepted a tool with those properties. The theorem describes the battlefield, not the war.

  On your first tripping point regarding binary versus continuous scores, the defense that COMPAS was not a binary classifier is technically correct but practically evasive. The impossibility results hold for any fixed threshold on a continuous score. If the base rates differ between groups, there is no threshold you can select on a calibrated score that will equalize false positive and false negative rates across groups. ProPublica's choice of cut-point determines the specific magnitude of the disparity they reported, but it does not create the disparity ex nihilo. A defender can argue that the specific dichotomization was arbitrary, which is true, but they cannot argue that a non-arbitrary dichotomization exists that satisfies both fairness criteria. The conflict is not an artifact of dichotomization; rather, dichotomization is inevitable in practice because judges ultimately make binary decisions about release or detention. The theorem survives this critique because the tension exists across the entire range of thresholds, not just at the one ProPublica selected. The vendor's argument relies on the hope that users will treat the score as a continuous probability and update their priors smoothly, but human decision-making tends to collapse probabilities into categories, re-invoking the impossibility constraint at the point of human judgment.

  Your second point about the observed outcome is the most damaging to the applicability of the theorem, though not to the math itself. The theorem assumes a static joint distribution over features, group membership, and outcomes. In the Broward case, the outcome rearrest is only observed for those who were released. This is a classic case of selective labeling or censoring. If the scoring tool influences who gets released, and if release decisions differ by race independently of risk, then the base rates calculated on the released population are biased estimates of the base rates in the scored population. The impossibility theorem still holds for the observed data, meaning you still cannot satisfy both criteria on the data you have. However, satisfying fairness criteria on a biased distribution does not guarantee fairness in the underlying reality. If the true base rates were equal but the observed base rates differ due to policing bias, the theorem forces you to choose between calibration on the biased data and error rate parity on the biased data. Neither choice corrects the underlying selection bias. This makes the result unfalsifiable in a practical sense because you cannot measure the counterfactual outcomes for the detained population. The theorem becomes a statement about the consistency of your metrics on the available data, not a statement about the fairness of the tool in the world. It survives as a mathematical truth but loses its normative force because the distribution it quantifies over is not the population of moral interest.

  Regarding accuracy, the theorem is indifferent to predictive power. It applies equally to a perfect classifier and a random guesser, provided the base rates differ. The fact that COMPAS was only modestly predictive does not make the case an anomaly for the theory; it makes the trade-off less valuable but still present. A weak classifier can be calibrated, and a weak classifier can have equal error rates, but not both. The low accuracy suggests that the social cost of the trade-off might be lower because the tool is not driving many high-stakes decisions correctly anyway, but it does not remove the structural tension. If anything, low accuracy exacerbates the fairness problem because the noise in the prediction interacts with the base rate differences to produce larger disparities in error rates for a given level of calibration. The trade-off remains the interesting fact because it persists even when the signal is weak. The case confirms the theory's robustness to accuracy levels but highlights that the theory does not tell you whether the tool should be used at all. It only tells you what kind of unfairness you will inherit if you do use it.

  This leads to your final point about who chooses the criterion. The standard reading of the impossibility result implies a benevolent designer choosing which fairness constraint to optimize. The COMPAS episode reveals that the choice is often made by the vendor to minimize liability or maximize marketability, and then imposed on the user. Northpointe chose calibration because it is easier to validate retrospectively and sounds more scientific to a judge than error rate parity. They did not reason about fairness in the abstract; they reasoned about defensibility. The theorem did not anticipate this power dynamic because it models the classifier as a static object rather than a product in a market. Someone who believes in the results should revise their view from seeing the theorem as a design menu to seeing it as a rhetorical constraint. It explains why the debate reached a stalemate rather than a resolution. The vendor can always point to calibration to claim fairness, and the auditor can always point to error rates to claim bias, and the mathematics validates both claims as mutually exclusive. The episode suggests that the impossibility result does not force a choice so much as it enables strategic ambiguity. The revision required is to stop asking which criterion we should choose and start asking who has the power to enforce their preferred criterion on the others. The theorem explains the incoherence of the public debate, but it does not resolve the political struggle over which definition of fairness governs the courtroom.
