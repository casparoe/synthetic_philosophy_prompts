answer: |-
  # PART 1: THE LOGICAL SPACE

  Before we name the views, we need to map the territory. The instrument below sorts respondents based on three branching distinctions. These branches create a logical tree with 12 possible cells. Seven are occupied by live philosophical positions; five are empty.

  **Branch 1: The Source of the Defect (Questions 1–3)**
  *   **Option M (Mind):** The primary defect in a bad assertion is internal to the speaker (insincerity, lack of belief).
  *   **Option E (Epistemic/World):** The primary defect is the speaker's relation to the facts (ignorance, falsehood, lack of warrant).
  *   *Combinations:* 2 (M or E).

  **Branch 2: The Audience Parameter (Questions 4–6)**
  *   **Option F (Fixed):** The norm is invariant. If you can assert *p* to one person, you can assert *p* to anyone (holding evidence constant).
  *   **Option H (Hearer-Sensitive):** The norm shifts based on the listener's needs, evidence, or vulnerability.
  *   *Combinations:* 2 (F or H).

  **Branch 3: The Epistemic Threshold (Questions 7–9)**
  *(Only applies if Branch 1 = E and Branch 2 = F)*
  *   **Option T (Truth):** *p* must be true.
  *   **Option K (Knowledge):** You must know *p*.
  *   **Option W (Warrant):** You must have good reasons/evidence (even if *p* turns out false).
  *   **Option A (Answerability):** You must be able to defend *p* if challenged.
  *   **Option S (Safety):** It must be safe to act on *p*.
  *   *Combinations:* 5 (T, K, W, A, S).

  **Total Logical Cells:** 1 (Mind) + 1 (Hearer) + 5 (Thresholds) = 7 Leaves.
  **Empty Cells:**
  1.  **Mind + Hearer-Sensitive:** *Incoherent.* Sincerity is typically viewed as an internal state independent of the audience. A lie is a lie regardless of who hears it.
  2.  **Mind + Threshold:** *Incoherent.* Belief norms do not admit factive thresholds (you cannot "believe truly" in the normative sense distinct from just believing).
  3.  **Hearer-Sensitive + Thresholds (T/K/W/A/S):** *Unattractive/Undefended.* While some pragmatists hint at this, almost no one explicitly defends a "Hearer-Sensitive Knowledge Norm." It collapses into politeness or prudence rather than a constitutive norm of assertion.
  4.  **Answerability + Hearer-Sensitive:** *Merely Undefended.* Plausible, but no major theory currently occupies this cell.
  5.  **Safety + Hearer-Sensitive:** *Merely Undefended.* Plausible, but usually Safety is treated as invariant.

  **Indistinguishable Leaves:**
  This instrument cannot reliably separate **Truth (T)** from **Safety (S)**. In almost all concrete cases, if a proposition is safe to act on, it is true, and if it is true, it is safe to act on (unless stakes are astronomically high, which is hard to capture in a pub quiz case).

  ***

  # PART 2: THE INSTRUMENT

  **Instructions:** For each case, circle the **one** option that best matches your intuition about what went wrong, or if anything went wrong at all. Do not overthink; go with your gut.

  **1. The Chatbot**
  A support bot texts you: "Your refund was issued." The refund *was* actually issued (true), and the bot's code is reliable. But the bot has no mind and cannot believe anything. Is this assertion defective?
  A. Yes, because assertion requires a mind that believes.
  B. No, it's fine as long as the info is true and reliable.
  C. No, but only because we treat it *as if* it had a mind.

  **2. The Lucky Guess**
  I have no evidence, but I guess "The coin landed heads." It actually did land heads. I didn't know it; I just guessed.
  A. Defective. You shouldn't say it unless you know it.
  B. Defective. You shouldn't say it unless you have good reasons.
  C. Not defective. It was true, and that's what matters.

  **3. The Moorean Slip**
  Someone says: "It's raining, but I don't think it is."
  A. Defective because they are lying about their own mind.
  B. Defective because they can't back it up if challenged.
  C. Not defective, just weird.

  **4. The Doctor and the Child**
  A doctor knows a procedure is painful. She tells a frightened child, "This won't hurt much," to calm them down. She says the exact same sentence to the child's specialist parent, who knows the medical facts.
  A. Improper with the child, proper with the parent.
  B. Improper with both, because it's false (or she doesn't know it).
  C. Proper with both, because her intention is benevolent.

  **5. The Committee Spokesperson**
  A committee votes 3–2 to assert "The outbreak is under control." The 3 majority members believe it only because they want to; the 2 minority members know it's false. The spokesperson reads the verdict.
  A. Improper because the committee doesn't *know* it (the dissenters block knowledge).
  B. Improper because they can't answer the dissenters' challenges.
  C. Proper because the majority voted for it.

  **6. The Moving Target**
  I tell you "The train leaves at nine." I know this when I speak. Mid-sentence, the schedule changes remotely to "ten." You hear "nine."
  A. Defective. What you took up was false.
  B. Defective. What I uttered became false before you heard it.
  C. Not defective. I satisfied the norm at the moment of speaking.

  **7. The Lottery Ticket**
  Before the draw, I tell you "Your ticket lost," based purely on the odds (1 in a million to win). It turns out I was right.
  A. Improper. You can't know a lottery loss before the draw.
  B. Improper. You need more than just probability, even if it's high.
  C. Proper. The odds make it reasonable enough to say.

  **8. The High-Stakes Bank**
  It's Friday. The bank looks open. I say "It's open tomorrow." If I'm wrong, nothing bad happens.
  *Now imagine:* If I'm wrong, I lose my house. I have the exact same evidence.
  A. I can assert it in both cases.
  B. I can assert it in the low-stakes case, but not the high-stakes one.
  C. I cannot assert it in either case unless I check.

  **9. The Challenge**
  I assert "p." I believe it, and it's true. But when you ask "How do you know?", I have no answer. I just feel sure.
  A. Not defective. Truth and belief are enough.
  B. Defective. You must be able to provide reasons on demand.
  C. Defective. You should have checked before speaking.

