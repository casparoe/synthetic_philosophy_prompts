  # PART 3: THE SCORING KEY

  **Step 1: Tally your answers.**
  Count how many times you selected A, B, or C.
  *   **A Count:** \_\_\_\_
  *   **B Count:** \_\_\_\_
  *   **C Count:** \_\_\_\_

  **Step 2: Determine your Branch 1 (Mind vs. World).**
  Look at **Questions 1, 2, and 3**.
  *   If you chose **A** on Q1 OR Q3: You lean toward **Mind-Relative Norms**.
      *   *Go to Leaf 1.*
  *   If you chose **B or C** on most of Q1–3: You lean toward **Epistemic/World Norms**.
      *   *Go to Step 3.*

  **Step 3: Determine your Branch 2 (Fixed vs. Hearer).**
  Look at **Questions 4, 5, and 6**.
  *   If you chose **A** on Q4 OR Q6: You lean toward **Hearer-Sensitive Norms**.
      *   *Go to Leaf 2.*
  *   If you chose **B or C** on most of Q4–6: You lean toward **Fixed Norms**.
      *   *Go to Step 4.*

  **Step 4: Determine your Branch 3 (The Threshold).**
  Look at **Questions 7, 8, and 9**.
  *   Mostly **A**: **Leaf 3 (Knowledge)**.
  *   Mostly **B**: **Leaf 4 (Warrant/Answerability)**.
  *   Mostly **C**: **Leaf 5 (Truth/Safety)**.
  *(Note: If you have a split, e.g., 2 A / 1 B, default to the stricter norm (A).)*

  **The Leaves (Trade Names for the Facilitator)**

  *   **Leaf 1: The Belief/Sincerity Norm.** (e.g., Bach). Assertion is primarily an expression of belief. If you believe it, you're in the clear. The Chatbot and Moorean cases are the key drivers here.
  *   **Leaf 2: The Hearer-Sensitive Norm.** (Your hobbyhorse). The propriety of assertion depends on the audience's epistemic position or needs. The Doctor and Moving Target cases drive this. *Note: This cell is near-empty in literature; respondents landing here are likely inventing a new position or conflating norm with politeness.*
  *   **Leaf 3: The Knowledge Norm.** (e.g., Williamson). You must know what you say. The Lottery and High-Stakes cases drive this. This is the dominant view in contemporary epistemology.
  *   **Leaf 4: The Warrant/Answerability Norm.** (e.g., Brandom/Dutant). You don't need knowledge, but you need justification or the ability to defend the claim. Q9 is the primary driver here.
  *   **Leaf 5: The Truth/Safety Norm.** (e.g., Weiner). As long as it's true (or safe to act on), you're fine. The Lucky Guess and Lottery cases drive this.
  *   **Leaf 6: The Collective/Committee Norm.** (Filler). If Q5 drove your result specifically, you may hold that assertion norms apply differently to groups than individuals.
  *   **Leaf 7: The No-Norm/Expressivist.** (Filler). If you consistently chose "Not defective" or "Just weird" across all cases, you may deny assertion has a constitutive norm at all.

  **Tie-Breaker Rule:**
  If Step 2 and Step 3 conflict (e.g., Q1 says Mind, but Q4 says Hearer), **Step 2 wins.** The nature of the defect (Mind vs. World) is more fundamental than the audience parameter.

