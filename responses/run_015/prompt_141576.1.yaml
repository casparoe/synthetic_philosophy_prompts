  # PART 4: LIMITATIONS & MISFIRES

  **1. The Indistinguishable Leaves**
  This instrument cannot cleanly separate **Leaf 5 (Truth)** from **Safety**. In Q2 (Lucky Guess) and Q7 (Lottery), the "True" option and the "Safe/Reasonable" option often attract the same respondents. Philosophically, Truth is factive and Safety is pragmatic, but in a 10-minute quiz, they collapse. If someone scores Leaf 5, assume they accept *either* Truth *or* Safety as the sufficient condition.

  **2. The Overworked Question**
  **Question 4 (The Doctor)** is doing too much work for Branch 2. It conflates *epistemic* sensitivity (what the hearer knows) with *prudential* sensitivity (what the hearer needs). A respondent might choose "Improper with child, proper with parent" not because they think the *norm of assertion* changes, but because they think *lying is permissible for care*. This might falsely populate Leaf 2 (Hearer-Sensitive) with utilitarians rather than norm-theorists.

  **3. The Rewrite Trigger**
  If a significant number of your programmers or the lawyer select **Leaf 2 (Hearer-Sensitive)**, but justify it by saying "It depends on the liability," you need to rewrite the key. That indicates they are answering a question about *professional negligence*, not the *constitutive norm of assertion*. You would need a case that strips away all practical consequences (pure gossip) to test the norm itself.

  **4. Framing Doubts**
  *   **The "One Norm" Assumption:** The instrument assumes assertion has *one* constitutive norm. If your grad students are pluralists (e.g., "Knowledge is the ideal, but Truth is the minimum"), they will frustrate the scoring key. The key forces a single choice.
  *   **The Hearer-Sensitivity Confusion:** You suspect this view is undefended. If the quiz yields many Leaf 2 results, it is highly probable your participants are confusing the *norm of assertion* with *norms of conversation* (Gricean maxims) or *ethics of care*. The instrument treats this confusion as a valid philosophical position for the sake of sorting, but be prepared to challenge it in discussion.

  **5. Mapping Confidence**
  I am least confident about the mapping of **Question 5 (Hospital Committee)**. This case introduces collective agency, which muddies the water on individual epistemic norms. A respondent might choose "Improper because they can't answer challenges" (Leaf 4) simply because they are thinking about *voting procedures*, not assertion norms. If this question consistently outliers your group, drop it and replace it with a standard "Gettier Case" (True belief via luck) to test Knowledge vs. Truth.
