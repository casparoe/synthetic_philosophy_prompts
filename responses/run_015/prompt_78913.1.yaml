prompt: |-
  I chair the standards and appeals committee for a national certificate in "applied reasoning" — it's the short exam a few employers and two professional bodies use as an analytical-skills gate, so our rubric wording matters to people's jobs in a way that a university exam probably doesn't. Last month a candidate appealed a zero on one of our deduction items. The item hands you two premises and asks for the conclusion that follows; the rubric, which we rewrote two years back, awards a mark for "stating the governing principle at each step." The candidate did write the conclusion, but under it wrote that the inference wasn't licensed by anything they'd been given: a rule of inference is not a premise, they said, so write the rule into the item as a third premise and they'll use it, but then we owe them the rule that carries them from those three lines to the conclusion, and so on down the line. They then left the reasoning blank and took the zero. Their appeal argues that the rubric's own letter asked them to state the principle rather than apply it, and I have to admit they're not obviously wrong about that. This is, I know, that Lewis Carroll bit with the tortoise who cheerfully accepts every premise you hand him and every conditional you hand him next, and never gets to the conclusion. Half my committee wants to deny the appeal on the ground that an exam in reasoning which treats that answer as compliant tests nothing — a candidate who describes the rule and declines to be bound by it hasn't shown they can reason, and if we start granting marks for describing inferences we may as well mark essays on our own rubric. The other half wants to grant it, because our item does demand that a candidate endorse a rule we never gave them and never defended, and "we've never had to defend it" is not an argument.

  Draft the written decision I'll circulate before Thursday's meeting: a clear recommendation — deny, grant, or grant in part with a rubric amendment — with the exam cycle by which it takes effect, and reasons the people who wrote the item could actually respond to rather than a restatement of the psychometric handbook. It should take the tortoise's point seriously enough that the memo would survive being read by the candidate, and take the committee's worry seriously enough that it would survive being read by our chief examiner; if you think one side is right, say plainly what the other side has to give up. I'd also like it to say something real about what's underneath this, not just about our paperwork: whether accepting a conditional premise and being bound by a rule of inference are the same sort of thing at all, and if they aren't, whether a stipulated rule — something like "this item is governed by: from 'all A are B' and 'x is an A,' infer 'x is a B'; candidates are deemed to have adopted it" — is a legitimate way to stop the regress or just a politer way of hiding it, and whether a rule can be the kind of thing that's true or false in the first place, or only the kind of thing one does or doesn't go in for. One more bit of detail in case its useful: we piloted a "licence box" on a handful of items last spring (candidates tick that they adopt the item's rule) and it went badly in both directions — the strongest candidates ticked it and then wrote the conditional out as a line anyway, and the weakest ones ticked it and then took steps the licence plainly didn't cover. Make of that what you can. No citations or reading list needed, we're not publishing it and I'd rather you argue than cite. Around 800 words, headed with the committee's name and a one-line recommendation.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Standards and Appeals Committee for a national certificate in "applied reasoning".
      *   **Task:** Draft a written decision memo to circulate before Thursday's meeting.
      *   **Context:** A candidate appealed a zero on a deduction item. The item gave two premises, asked for a conclusion. The rubric required "stating the governing principle at each step." The candidate wrote the conclusion but argued that inference rules aren't premises (Lewis Carroll's Tortoise/Achilles paradox). They refused to apply the rule without it being stated as a premise, leading to infinite regress. They left the reasoning blank, got a zero.
      *   **Conflict:** Half the committee wants to deny (reasoning requires binding oneself to rules, not just describing them). Half wants to grant (the item demands endorsing an undefended rule, and the rubric asked for stating principles).
      *   **Requirements:**
          *   Clear recommendation (deny, grant, or grant in part with amendment).
          *   Effective exam cycle.
          *   Reasons item writers can respond to (not just psychometric jargon).
          *   Take the Tortoise's point seriously (survive candidate's scrutiny).
          *   Take the Committee's worry seriously (survive Chief Examiner's scrutiny).
          *   Address the philosophical underlying issue: Are accepting a conditional premise and being bound by a rule the same? Can a stipulated rule stop the regress? Are rules true/false or actions?
          *   Incorporate the failed "licence box" pilot (strong candidates still wrote conditionals, weak ones overextended the licence).
          *   No citations/reading list.
          *   Around 800 words.
          *   Header: Committee Name + One-line Recommendation.

  2.  **Determine the Recommendation:**
      *   *Option A (Deny):* Risks validating a rubric that philosophically conflates premises and rules. Ignores the candidate's valid logical point.
      *   *Option B (Grant):* Risks undermining the exam's purpose (testing applied reasoning, not meta-logical critique). Sets a precedent where candidates can opt-out of inference.
      *   *Option C (Grant in Part/Amend):* Acknowledge the candidate's philosophical correctness but uphold the exam's practical purpose. Award the mark for this candidate (as a one-off goodwill/recognition of insight) but amend the rubric/item wording for future cycles to clarify the expectation of *application* over *statement*.
      *   *Decision:* **Grant in part with rubric amendment.** This balances the philosophical validity of the appeal with the practical necessity of the exam. It acknowledges the Tortoise problem without letting it break the testing mechanism.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standards and Appeals Committee | Recommendation: Grant appeal for candidate; amend rubric for next cycle.
      *   **Opening:** State the issue clearly. The candidate identified a genuine logical tension (Carroll's Tortoise).
      *   **Philosophical Core:** Address the premise vs. rule distinction. Accepting "If P then Q" is not the same as inferring Q from P. Rules are norms of action, not truth-apt statements. A stipulated rule doesn't solve the regress logically, but pragmatically it establishes the "game" being played.
      *   **The Pilot Data:** Use the "licence box" failure. Ticking a box didn't stop strong candidates from writing conditionals (they felt the need to justify) or weak candidates from cheating (they thought the box gave magic powers). This shows the problem is deep, not just wording.
      *   **The Decision:**
          *   *For the Candidate:* Grant the mark. They demonstrated superior meta-cognitive awareness, even if they failed the practical task. The rubric wording ("state the principle") invited their response.
          *   *For the Exam:* Deny the precedent that one can refuse to infer. Reasoning *requires* binding oneself to rules.
          *   *For the Rubric:* Change "state the governing principle" to "apply the standard rule of inference." Stop asking for the rule as a statement; ask for the move as an action.
      *   **Closing:** Timeline (next exam cycle).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Tone:* Needs to be authoritative but humble enough to admit the logical difficulty. Not bureaucratic.
      *   *Word Count:* Keep it tight. The philosophical digression needs to be dense but clear.
      *   *The "Truth" of Rules:* Address the prompt's question: Are rules true/false? No, they are valid/invalid or adopted/rejected.
      *   *The "Stipulation":* Is it hiding the regress? Yes, but necessarily so. We need a stopping point for practice.
      *   *Item Writers:* Give them something to do. Don't just say "fix it." Say "shift from justification to performance."

  5.  **Drafting - Step-by-Step:**

      *   *Header:* Standards and Appeals Committee. Recommendation: Grant appeal for candidate; amend rubric effective Next Cycle.
      *   *Intro:* The candidate's appeal rests on Lewis Carroll's paradox. They are logically correct that inference rules are not premises.
      *   *Philosophy:* Distinguish between propositional content (true/false) and inferential norms (do/don't). A rule isn't true; it's a commitment. Stipulating a rule doesn't logically force the conclusion, but it defines the practice.
      *   *The Pilot:* The licence box failed because it treated adoption as a checkbox rather than a performance. Strong candidates knew a box doesn't infer; weak candidates thought it did.
      *   *Resolution:* We cannot test reasoning if candidates can opt out of inference. But we cannot penalize them for noticing the rubric invited a meta-logical objection.
      *   *Action:* Award the mark. Change the rubric.

  6.  **Review against Constraints:**
      *   ~800 words. (Need to monitor length).
      *   No citations.
      *   Address the "true/false" vs "do/don't" distinction.
      *   Address the "stipulated rule" question.
      *   Address the pilot data.
      *   Header format.

  7.  **Final Polish:** Check tone. Ensure it sounds like a Chair speaking to a committee and examiners. Make sure the recommendation is unambiguous. (Self-correction: Ensure I explicitly state *why* the stipulation is a "polite hiding" but necessary).

  *(Drafting mental check)*: Start with the header. Then the context. Then the philosophical meat. Then the pilot evidence. Then the ruling. Then the timeline.

  *Word Count Check:* If I spend too much on Carroll, I won't have space for the pilot data. Need to integrate them. The pilot data proves that *explicitizing* the rule doesn't solve the behavioral issue.

  *Key Insight:* The exam tests *applied* reasoning. Applied reasoning requires accepting the rules of the game. The candidate played meta-game. They win the meta-game, but the exam is the game. So, grant the point, change the game instructions.

  *Let's write.*
answer: |-
  **Standards and Appeals Committee**
  **Recommendation:** Grant appeal for candidate; amend rubric effective Next Exam Cycle.

  **Memorandum**

  This decision concerns the appeal against a zero score on Deduction Item 4. The candidate provided the correct conclusion but refused to document the inference steps, arguing that the rubric's requirement to "state the governing principle" conflated premises with rules of inference. They contended that without the rule stated as a premise, the inference is unlicensed, invoking the regress argument famously illustrated by Lewis Carroll's Tortoise. The committee is divided between those who view this as a valid logical objection and those who view it as a refusal to perform the task.

  We must distinguish between the truth of propositions and the validity of moves. A premise is a statement that can be true or false. A rule of inference is not a truth-claim; it is a norm of action. To accept "If P then Q" is not the same as being bound to infer Q from P. The former is a conditional belief; the latter is a commitment to a practice. When the candidate demands the rule be written as a third premise, they are correctly identifying that no statement of fact can logically compel an action without a further rule to apply it. A stipulated rule—such as "candidates are deemed to adopt Modus Ponens"—does not solve this regress logically; it merely stops it pragmatically. It is a polite way of hiding the regress, but it is necessary for any practice to function. We cannot test reasoning if candidates are permitted to treat the rules of reasoning as optional premises.

  However, our rubric invited this objection. By asking candidates to "state the principle," we treated the rule as an object of description rather than a tool for use. We asked them to talk about reasoning rather than reason. The candidate's response was meta-logically sound, even if pragmatically unhelpful for a vocational gate. They demonstrated a higher-order understanding of logic than the item required, but failed the item's operational constraint. To deny the appeal entirely is to penalize insight that our own wording provoked. To grant it fully is to suggest that candidates may opt out of inference provided they critique it well. Neither serves the certificate's purpose.

  The failed pilot of the "licence box" last spring confirms that explicitizing adoption does not solve the behavioral problem. Strong candidates ticked the box but still wrote out the conditional, sensing that a checkbox does not perform the inference. Weak candidates ticked the box and took invalid steps, believing the licence granted magical permission rather than defining a boundary. This indicates that the issue is not merely wording but the nature of the task. We are testing a skill, not a philosophical position.

  **Decision**

  1.  **For this candidate:** The appeal is granted. The mark should be awarded. The rubric's wording ("state the principle") was ambiguous enough to legitimize their interpretation. They identified a genuine category error in our instructions. Penalizing them for reading our requirements more precisely than intended undermines the credibility of the standards committee.
  2.  **For the committee:** The precedent is denied. We cannot accept a standard where describing an inference substitutes for performing it. Applied reasoning requires binding oneself to the rules of the system. A candidate who refuses to infer has not demonstrated reasoning skills, regardless of their meta-logical acuity.
  3.  **For the item writers:** The rubric must be amended for the next exam cycle. Remove the instruction to "state the governing principle." Replace it with "show the move licensed by standard inference rules." We must shift the focus from justification to performance. Do not ask them to write the rule; ask them to execute the step the rule governs.

  **Underlying Principle**

  We must acknowledge that rules are not the kind of things that are true or false; they are the kind of things one does or does not go in for. By asking candidates to state them, we inadvertently asked them to treat norms as facts. The stipulation that "this item is governed by Rule X" is not a logical proof; it is a boundary condition for the exam. It tells the candidate: "Inside this room, we move this way." The candidate was correct that this doesn't prove the move is necessary in the abstract, but the exam does not test abstract necessity. It tests compliance with a professional standard.

  **Timeline**

  This rubric amendment takes effect for the next exam cycle beginning in September. Item writers are to revise Deduction Item 4 and similar prompts to reflect the shift from justification to performance. The Chief Examiner should note that while we award this mark, future candidates who refuse to apply rules will be scored zero, regardless of their critique. We are testing the ability to work within a system, not the ability to critique its foundations.

  **Chair, Standards and Appeals Committee**
