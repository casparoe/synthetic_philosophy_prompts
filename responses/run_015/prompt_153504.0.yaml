answer: |-
  ### Scratch Work: Mapping the Logical Space

  Before constructing the instrument, we must isolate the axes along which your disagreement with your friend actually moves. You are not arguing about "privacy" as a monolith; you are arguing about the *geometry of state knowledge*. The debate turns on five separative questions that define the logical space of legitimacy.

  First, **The Foundation:** Is the claim to opacity a feature of human status (unconditional), or a safeguard against abuse (remedial)? If the state is perfectly benevolent, does the right to hide evaporate? Second, **The Granularity:** Is the threat being *identified* (individual traceability) or being *classified* (population legibility)? A state may know "someone in this block uses too much power" without knowing "you use too much power." Third, **The Temporality:** Is the state looking backward (accounting for what happened) or forward (scoring what you might do)? Recording a crime differs normatively from predicting a risk. Fourth, **The Inference Problem:** If the state can deduce your secret from data you *did* provide, does your refusal to provide the secret directly hold any moral weight? Fifth, **The Externality:** Does your right to concealment dissolve if your hiding imposes costs on others (e.g., insurance pools)?

  These questions generate a combinatorial space. A "Panopticon" view answers "No" to the Foundation (rights are remedial), "Yes" to Granularity (individual ID is fine), "Yes" to Temporality (prediction is fine), "No" to Inference (deduction counts as knowledge), and "Yes" to Externality (costs mandate disclosure). A "Sovereign Individual" view answers the opposite. Most real-world positions are unstable mixtures of these answers. The instrument below forces a trainee to navigate these specific tensions without relying on labels like "libertarian" or "statist."

  ***

  ### DECISION INSTRUMENT: THE LEGIBILITY TREE
  **For:** Civil Service Trainees | **Subject:** State Knowledge & Citizen Opacity
  **Instructions:** Answer each question based on your intuition about the specific case presented. Follow the path to your operational position.

  **Q1. THE BENEVOLENCE TEST**
  *Case:* The state guarantees by law that no data collected will ever be used to punish, only to assist (e.g., automatic benefit enrollment). Do you still have a right to keep a diary or financial record secret from them?
  *   **YES (Unconditional):** Go to Q2.
  *   **NO (Remedial):** Go to Q5.

  **Q2. THE CROWD TEST**
  *Case:* The state can see the energy usage of your entire apartment building to manage the grid, but cannot see *your* specific meter. Is this acceptable?
  *   **YES (Population Focus):** Go to Q3.
  *   **NO (Individual Focus):** Go to Q4.

  **Q3. THE PATTERN TEST**
  *Case:* To manage the grid, the state must classify your building as "High Risk" for fire, lowering its property value, based on aggregate data. Is this permissible?
  *   **YES:** **Leaf 1: The Utilitarian Planner** (Named)
  *   **NO:** **Leaf 2: The Statistical Protectionist** (Unnamed)

  **Q4. THE RECONSTRUCTION TEST**
  *Case:* The state does not ask for your diary, but reconstructs your life from your smart-meter data (occupancy, appliances). Is this distinct from asking you directly?
  *   **YES (Traceability Matters):** Go to Q6.
  *   **NO (Inference Suffices):** **Leaf 3: The Transparent Citizen** (Unnamed)

  **Q5. THE TRUST TEST**
  *Case:* The state compels your bank to hand over your transaction records rather than asking you directly. Is this a greater violation than asking you?
  *   **YES (Source Matters):** Go to Q7.
  *   **NO (Data is Data):** Go to Q8.

  **Q6. THE OBSCURATION TEST**
  *Case:* You know the state can reconstruct your life from metadata. You generate "noise" (random appliance use) to confuse them. Is this protected?
  *   **YES (Active Defense):** **Leaf 4: The Data Obfuscator** (Named)
  *   **NO (Passive Right Only):** **Leaf 5: The Private Individual** (Named)

  **Q7. THE INTERMEDIARY TEST**
  *Case:* The state forces your private email provider to scan messages for safety, rather than opening your mail themselves. Is this permissible if they have high trust ratings?
  *   **YES:** **Leaf 6: The Delegated Auditor** (Unnamed)
  *   **NO:** **Leaf 7: The Third-Party Sovereign** (Named)

  **Q8. THE CRYSTAL BALL TEST**
  *Case:* The state uses your past transaction data to score your *future* risk of illness, adjusting your insurance premiums. Is this allowed?
  *   **YES (Predictive):** Go to Q9.
  *   **NO (Retrospective Only):** **Leaf 8: The Actuarial Subject** (Named)

  **Q9. THE NEIGHBOR TEST**
  *Case:* Your refusal to share health data raises premiums for everyone in your risk pool. Must you disclose?
  *   **YES (Cost Trumps Privacy):** **Leaf 9: The Risk Pool Member** (Named)
  *   **NO (Right Trumps Cost):** **Leaf 10: The Sovereign Risk** (Unnamed)

  **Q10. (Only for Leaf 2 & 8 paths)**
  *Case:* You hide data, but the state infers it anyway. Do they owe you a right to correct the inference?
  *   **YES:** **Leaf 11: The Correctable Subject** (Unnamed)
  *   **NO:** **Leaf 12: The Inferred Object** (Unnamed)

  *(Note: Paths terminate where logical consistency is reached. Some combinations are excluded below.)*

