  ### LEAF ANALYSIS & UNOCCUPIED SPACE

  **Occupied Leaves (Named):**
  1.  **The Utilitarian Planner:** Population data OK, collective cost OK. (Common in urban planning).
  2.  **The Data Obfuscator:** Individual traceability blocked, active noise permitted. (Cypherpunk/Privacy tech).
  3.  **The Private Individual:** Individual traceability blocked, passive silence only. (Classic Liberal).
  4.  **The Third-Party Sovereign:** Remedial right, but private intermediaries must not be conscripted. (US Fourth Amendment tradition).
  5.  **The Actuarial Subject:** Past records OK, future scoring banned. (EU GDPR distinction).
  6.  **The Risk Pool Member:** Remedial right, but cost-shifting voids it. (Insurance/Health mandates).

  **Unoccupied Leaves (Diagnosis):**
  1.  **The Benevolent Panopticon:** (Remedial Right + Perfect Trust + Total Disclosure). *Diagnosis:* **Incoherent.** If the right is purely remedial (based on distrust), perfect trust removes the reason for the right; if trust is perfect, the position collapses into "No Right."
  2.  **The Cost-Shift Absolutist:** (Unconditional Right + Cost Shifting Allowed). *Diagnosis:* **Unattractive.** Claims a right to hide that actively harms peers (raising their costs) without compensation. Rarely defended explicitly as a moral principle.
  3.  **The Retrospective Predictor:** (Retrospective Accounting Only + Predictive Scoring Allowed). *Diagnosis:* **Unexplored/Incoherent.** One cannot reliably score future risk without reconstructing past behavior; banning the reconstruction while allowing the scoring is technically impossible.

  **Indistinguishable Leaves:**
  *   **Leaf 7 (Third-Party Sovereign)** and **Leaf 5 (Private Individual)** may be functionally identical in practice. If the state cannot ask you *and* cannot ask your bank, the outcome is the same.
  *   *Extra Question to Pry Apart:* "If the private company voluntarily gives the data to the state without compulsion, is that a state violation?" (The Sovereign says Yes; the Individual says No/Not my problem).

