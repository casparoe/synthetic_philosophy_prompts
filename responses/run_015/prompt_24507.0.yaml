  I'm trying to get my head around the presumption of independence in heuristic arguments, not the basic probabilty definition. The idea is that when two pieces of evidence seem to support the same hypothesis, we often default to treating them as independent unless there is reason to suspect copying, a shared source, or a common cause. Can you explain why that default is tricky to formalize? I want the messy part: what it actually commits us to, how it differs from statistical independence and conditional independence, and how it could be represented in a Bayesian or causal model without turning into a hard axiom. Also, where does the default go wrong in testimony, diagnosis, or scientific confirmation, and what would a good account need to say about when the presumption is defeated? Please keep it conceptual rather than a literature tour.
