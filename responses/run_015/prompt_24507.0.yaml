answer: |-
  The presumption of independence is one of those epistemic tools that feels indispensable in practice but creates a headache the moment you try to write it down. Intuitively, it says: "If I have two reasons to believe $H$, and I don't see a connection between the reasons, I should count them as separate boosts."

  The trouble is that this presumption is not a fact about the world; it is a claim about the limits of your knowledge. Formalizing it requires admitting that your model of the world is incomplete, while simultaneously acting as if it is complete. Here is the conceptual breakdown of why that is tricky, what it commits you to, and where it breaks.

  ### 1. The Commitment: Exhaustiveness of the Causal Model
  When you presume independence between two pieces of evidence ($E_1$ and $E_2$) regarding a hypothesis ($H$), you are not claiming they are statistically independent in a vacuum. Obviously, if both support $H$, they are correlated. If $H$ is true, both are likely to be true.

  What you are actually presuming is **conditional independence given $H$ and your background knowledge ($K$)**.
  $$P(E_1, E_2 | H, K) = P(E_1 | H, K) \cdot P(E_2 | H, K)$$

  The "messy part" is what this commits you to regarding $K$. By asserting this equality, you are asserting that **$H$ is the only common cause** relevant to your current knowledge state. You are betting that there are no *other* hidden variables ($C$) that could make $E_1$ and $E_2$ correlate even if $H$ were false, or correlate them more strongly than $H$ alone would explain.

  Therefore, the presumption of independence is actually a **presumption of causal exhaustiveness**. It commits you to the claim: "I have accounted for all plausible common causes in my hypothesis $H$." If there is a hidden common cause you haven't modeled, your calculation of how much $E_1$ and $E_2$ confirm $H$ will be inflated (double-counting).

  ### 2. Statistical vs. Conditional vs. Heuristic Independence
  To see why formalization is hard, we have to separate three layers:

  *   **Marginal Statistical Independence:** $P(E_1, E_2) = P(E_1)P(E_2)$. This is almost never true for evidence. If $E_1$ makes $H$ more likely, and $H$ makes $E_2$ more likely, then $E_1$ makes $E_2$ more likely. They are dependent.
  *   **Conditional Independence:** $P(E_1, E_2 | H) = P(E_1 | H)P(E_2 | H)$. This is the standard requirement for "converging evidence." It means that once you know $H$ is true, learning $E_1$ tells you nothing new about $E_2$.
  *   **The Heuristic Presumption:** This is a meta-rule. It says, "Treat $E_1$ and $E_2$ as conditionally independent *unless* you have positive evidence of a link."

  The friction arises because conditional independence is a binary mathematical property, but the heuristic is a gradient of trust. In the real world, independence is rarely perfect; it's usually a matter of degree. Formalizing the heuristic requires a system that can handle "mostly independent" without collapsing into "fully dependent."

  ### 3. Modeling Without Hard Axioms
  If you hard-code independence into a Bayesian network (by simply omitting an arrow between $E_1$ and $E_2$), you create a brittle model. If the assumption is wrong, the posterior probability of $H$ can skyrocket artificially.

  To represent the *presumption* without making it an *axiom*, you need to model your uncertainty about the connection itself.

  **The Latent Confounder Approach:**
  Instead of assuming no link exists, introduce a node $C$ (Unknown Common Cause) that points to both $E_1$ and $E_2$.
  *   **The Trick:** Do not fix the strength of the connection from $C$ to the evidence. Instead, place a **prior distribution on the correlation parameter**.
  *   **The Presumption:** You set the prior such that the *most likely* state is zero correlation (independence), but you allow non-zero probability for strong correlation.
  *   **The Update:** As you gather more evidence, if $E_1$ and $E_2$ track each other too closely in ways $H$ doesn't predict, the model shifts probability mass toward the existence of $C$.

  This captures the heuristic: you start by assuming independence (the peak of the prior), but you remain sensitive to defeat (the tails of the prior). You aren't asserting independence; you are asserting that independence is the **null hypothesis** for causal structure.

  ### 4. Where the Default Goes Wrong
  The presumption fails when there is a common cause that is distinct from $H$. This leads to "pseudo-confirmation," where evidence feels stronger than it is.

  **A. Testimony (The Hearsay Problem)**
  *   *Scenario:* Witness A says the car was blue. Witness B says the car was blue.
  *   *Presumption:* They looked independently.
  *   *Failure:* B heard A's testimony before giving their own.
  *   *The Mechanism:* The causal chain is $Event \to A \to B$. $A$ and $B$ are not independent effects of the $Event$; $B$ is an effect of $A$.
  *   *Result:* You count the information twice. The second testimony adds almost zero new information, but the independence presumption treats it as a full multiplier.

  **B. Diagnosis (The Symptom Cluster)**
  *   *Scenario:* A patient has a fever ($E_1$) and a rash ($E_2$). You hypothesize Virus X ($H$).
  *   *Presumption:* Fever and rash are independent indicators of Virus X.
  *   *Failure:* Physiological coupling. The virus causes a cytokine release ($C$) which causes *both* fever and rash. Or, perhaps the fever causes the rash directly.
  *   *Result:* If you treat them as independent, you overestimate the likelihood of Virus X compared to alternative causes (like Heat Stroke, which also causes both). You fail to distinguish between two independent tests and one test with two readouts.

  **C. Scientific Confirmation (The Instrument Bias)**
  *   *Scenario:* Two experiments confirm a new particle.
  *   *Presumption:* The experiments are independent.
  *   *Failure:* Both used the same calibration software or data processing pipeline.
  *   *Result:* A systematic error in the software ($C$) produces a signal in both experiments. They correlate not because the particle exists ($H$), but because the tool is biased. The presumption of independence blinds you to systematic error.

  ### 5. Defeating the Presumption
  A good account of this heuristic must specify when the burden of proof shifts. When do we stop presuming independence and start hunting for links?

  The presumption is defeated when **residual correlation** is detected.
  In a causal model, $H$ explains some of the correlation between $E_1$ and $E_2$. If you condition on $H$ (assume $H$ is true) and $E_1$ and $E_2$ *still* correlate, the independence assumption is falsified.

  Conceptually, defeat conditions fall into three buckets:

  1.  **Mechanism of Transmission:** Is there a plausible physical or informational channel between the sources? (e.g., Did the witnesses talk? Do the sensors share a power supply?)
  2.  **Shared Vulnerability:** Are the sources susceptible to the same kind of error? (e.g., Are both witnesses prone to the same cultural bias? Are both experiments sensitive to the same background radiation?)
  3.  **Surprising Concordance:** Do the evidence items agree on details that $H$ does not predict? If $H$ only predicts "the car is blue," but both witnesses independently say "the car is blue and has a dent on the left," the specific agreement on the dent suggests a common source other than the event itself.

  ### Summary
  The presumption of independence is a necessary cognitive shortcut for managing complexity. We cannot check for every possible hidden common cause before updating our beliefs. However, formally, it is a wager that our causal model is exhaustive.

  To formalize it without dogmatism, we must treat independence not as a structural constraint (no arrow in the graph) but as a **probabilistic bias** (a strong prior against hidden confounders). It goes wrong when hidden confounders exist (hearsay, physiological coupling, systematic error), and it is defeated when the evidence exhibits correlation that the hypothesis itself cannot explain. The risk is always that we mistake silence (no known link) for truth (no link exists).
