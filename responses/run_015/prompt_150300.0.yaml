answer: |-
  # PREPARATION SHEET: LONG-TERM SORTITION PROPOSAL

  **Speaker:** Retired Actuary / Independent Researcher
  **Audience:** Practitioners (66%), Evaluators, Politicians, Journalist.
  **Goal:** Defend binding power for long-term issues via long terms + implementation lag.
  **Constraint:** 25 mins talk, 20 mins Q&A. No philosophy, focus on incentives and mechanics.

  ---

  ## 1. PRE-EMPTIVE CONCESSIONS (First 2 Minutes)
  *State these before they are thrown at you. It disarms the "naive outsider" critique.*

  1.  **The Transition Paradox:** Acknowledge immediately that no parliament will willingly vote to reduce its own power. You are not proposing a bill for next week; you are proposing a design for a constitutional moment or a crisis-driven reform. Do not pretend the path is easy.
  2.  **No Pilot Data:** Admit there is no empirical evidence for 8-year terms. You are extrapolating from jury service and actuarial risk models, not from existing deliberative data. You are proposing a hypothesis, not a proven best practice.
  3.  **Cost:** Concede this is more expensive than current models. Paying citizens for 8 years is a significant line item. Frame it as an insurance premium against long-term failure, not a cost-saving measure.

  ---

  ## 2. THE EIGHT OBJECTIONS (Ordered by Likelihood $\times$ Damage)

  ### 1. The Legitimacy Challenge
  *   **Who:** The Politician (Parliamentary Committee).
  *   **Phrasing:** "I sit on a committee where members face re-election every few years. If I vote to give a random body binding power over pensions, and they make a mistake, my voters will hold *me* responsible, not the assembly. Who elected them to override us?"
  *   **90-Second Reply:** "They weren't elected to override you on *everything*, only on decisions where your electoral horizon conflicts with the public interest. When you set pension rates, you know the pain comes after the next election. This body feels that pain. It's not about who elected them, but what incentives they face. You are accountable for the short term; they are accountable for the long term. It's a division of labour, not a usurpation."
  *   **Honest Note:** **Soft Spot.** This relies on the politician accepting a "division of labour" that reduces their sovereignty. It doesn't fully answer the "blame game" if things go wrong. **Concede:** You must concede that the elected body must voluntarily cede this power; it cannot be seized.

  ### 2. The Recruitment Reality
  *   **Who:** The Recruitment Contractor.
  *   **Phrasing:** "I run the lotteries. Getting people for 4 days is hard. Getting people for 8 years is impossible. You'll only get the unemployed, the ideologues, or the wealthy. You lose the descriptive representation you claim to value."
  *   **90-Second Reply:** "You are right that a standard volunteer model fails here. This requires a civic service model. Think of it like jury duty but extended, with significant compensation and employer mandates. If we treat long-term governance as a civic obligation rather than a volunteer opportunity, the pool changes. We aren't looking for enthusiasts; we are looking for a cross-section willing to serve."
  *   **Honest Note:** **Changes Subject.** This shifts the burden to the state to mandate employer release, which is a huge legislative hurdle. **Concede:** Acknowledge that without legal mandates for employers, the sample will indeed be biased.

  ### 3. Bureaucratic Capture
  *   **Who:** The Civil Servant (Participation Team).
  *   **Phrasing:** "I work with these bodies. By year two, they rely entirely on us for information. By year eight, they will be pets of the permanent secretariat. You aren't getting citizen control; you're getting rule by the staff who brief them."
  *   **90-Second Reply:** "That is a design flaw, not a fatal flaw. It's why I propose staggered cohorts. If one-third of the body is new every three years, institutional memory is distributed between the members and the staff, not just the staff. Also, long terms allow members to build their own expertise and networks, reducing reliance on the briefing paper."
  *   **Honest Note:** **Soft Spot.** Staggering helps, but information asymmetry always favours the permanent staff. **Concede:** Admit that independent research budgets for the assembly are non-negotiable to mitigate this.

  ### 4. The Scope Creep
  *   **Who:** The Politician / Civil Servant.
  *   **Phrasing:** "You say 'long term issues only'. But everything can be framed as long term. Housing is long term. Education is long term. Who decides what goes to them? If it's the parliament, they'll send only the toxic files. If it's the assembly, they'll grab power."
  *   **90-Second Reply:** "It needs a clear statutory trigger, like a '20-year impact test'. If the primary costs or benefits fall outside two electoral cycles, it qualifies. It's mechanical, like a fiscal rule. Disputes go to the courts or a supreme council, not the assembly itself. They don't define their own jurisdiction."
  *   **Honest Note:** **Solid.** This is actuarial thinking applied to law. **Risk:** Litigation over what counts as "20 years" could gridlock the system.

  ### 5. The Evidence Gap
  *   **Who:** The Academic Evaluator.
  *   **Phrasing:** "We measure deliberation quality, representation, and impact. We have no metrics for an 8-year horizon. How do we evaluate success before the members are dead? You're asking for a leap of faith."
  *   **90-Second Reply:** "You evaluate the *process integrity*, not the outcome, initially. Are they independent? Is the information balanced? Is the lag enforced? The outcome evaluation comes in decade-long cycles. We treat this like climate modelling: we validate the model inputs and logic, knowing the weather prediction takes time to verify."
  *   **Honest Note:** **Changes Subject.** Evaluators want to know if it *works*, not if the *process* was clean. **Concede:** Admit that outcome evaluation will be inter-generational and requires a new field of study.

  ### 6. Group Stagnation
  *   **Who:** The Professional Facilitator.
  *   **Phrasing:** "Group dynamics rot after six months. Cliques form, burnout sets in, thinking becomes rigid. Eight years creates an entrenched class, not a deliberative public."
  *   **90-Second Reply:** "That's why no re-election and staggered entry. You cannot make a career of this. The 'entrenchment' is limited by the fixed exit date. Also, the implementation lag keeps them humble; they know they will live with the consequences, which discourages reckless rigidity."
  *   **Honest Note:** **Soft Spot.** Facilitators know group psychology better than you. 8 years is a very long time for group cohesion. **Concede:** Acknowledge that term limits within the term (e.g., sabbaticals) might be needed.

  ### 7. The Lag Fairness
  *   **Who:** The Journalist / Civil Servant.
  *   **Phrasing:** "You say decisions take effect after a delay so members live with them. But if the assembly votes to cut benefits in 10 years, the people suffering *now* get no say. It's taxation without representation for the current poor."
  *   **90-Second Reply:** "This body has no power over short-run distributive fights. It cannot cut benefits today. It can only adjust parameters for the future to ensure the system survives. If the system collapses in 20 years, the poor suffer most. This protects the future vulnerable against the present powerful."
  *   **Honest Note:** **Solid.** Stick to the scope constraint. **Risk:** If "future vulnerable" is used to justify present pain, the argument collapses. Keep the distinction sharp.

  ### 8. The Cost Objection
  *   **Who:** The Civil Servant (Budget Holder).
  *   **Phrasing:** "Paying 100 people a salary for 8 years, plus staff, plus research, plus venue. This is infinitely more expensive than a weekend assembly. Where does the money come from?"
  *   **90-Second Reply:** "Compare it to the cost of policy failure. A pension system collapse or a bridge built in the wrong place costs billions. This is an insurance premium. If it prevents one major long-term error, it pays for itself. We under-invest in governance continuity."
  *   **Honest Note:** **Soft Spot.** "Insurance premium" is hard to sell in a tight budget year. **Concede:** Acknowledge it requires a protected budget line, immune to annual cuts.

  ---

  ## 3. THE SINGLE REPLY THAT MUST LAND
  *If they remember only one thing, it must be this.*

  **The Concept:** **Skin in the Game via Implementation Lag.**
  **The Phrasing:** "Current assemblies are like architects who leave the country before the building opens. My proposal ensures the architects are still living in the building when the roof leaks. The mandatory implementation lag is not a delay; it is an accountability mechanism. It forces the decision-maker to internalize the risk of the decision. Without this, long-term sortition is just a slower version of short-term politics."

  *Why:* This distinguishes your proposal from every other "House of Lords with Lottery" idea. It appeals to the actuaries (risk internalization) and the practitioners (accountability).

  ---

  ## 4. THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "If this is so rational, why would the current political elite ever pass it? You need the very people you are criticizing to vote themselves into a cage. Isn't this politically naive?"

  **Why it's dangerous:** It exposes the transition paradox you conceded early, but pushes you to admit the proposal might be theoretically sound but practically impossible. It challenges your utility to *this* room of practitioners who need implementable solutions.

  **The Answer:** "You are right. This does not pass in normal times. It passes in a crisis of legitimacy, or it is built incrementally. Perhaps we start with advisory power on one specific long-term file (like infrastructure) to prove the concept. I am not handing you a bill to introduce tomorrow. I am handing you a design for when the current system fails to handle a long-term threat. My job is to have the blueprint ready when the window opens. Your job is to keep the idea alive until then."

  *Why this works:* It respects their political reality (it won't pass now) without abandoning the proposal. It gives the practitioners a role (keeping the idea alive/piloting small) rather than asking them to commit suicide politically.

  ---

  ## 5. FINAL TONE CHECK
  *   **Do not** sound like a revolutionary. Sound like a risk manager.
  *   **Do not** claim sortition is "more democratic." Claim it is "differently incentivized."
  *   **Do not** defend the 8-year term as ideal; defend it as the minimum required to align the horizon.
  *   **Remember:** You are the actuary in the room. Use that. Talk about "discount rates," "risk internalization," and "incentive compatibility." Let the philosophers argue about justice; you are arguing about structural integrity.
