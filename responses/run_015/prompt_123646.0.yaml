prompt: |-
  You are a professional philosopher of language and an experienced seminar teacher who has run activities of this kind before and knows where they come apart. Please think carefully and do not answer immediately: begin by sketching three or four candidate mechanics for the session and three or four candidate "vehicle" expressions, say in a line or two each why they would or would not work, discard the failures, and only then commit to a full design. I need something I can actually run on Tuesday — rules, roles, materials, a payoff scheme that costs no money, and a minute-by-minute timeline — not a sketch of one.

  The setting: an upper-level undergraduate seminar on language and social power, 16 students, one 80-minute session, mixed philosophy and linguistics majors. They have had the Gricean distinction between what is said and what is implicated and nothing at all about slurs. My department's speaking policy is that no actual slur is to be uttered in a classroom and I intend to honour that, but I do not want the session to be a bloodless discussion of invented words, because the phenomenon I care about only shows up when a term genuinely carries a normative charge for the people in the room.

  The phenomenon they should run into, before I name anything, is the tension between two families of behaviour of the derogatory aspect of a slur:

  First family. It will not cancel: *Bo is a ___ , and I intend nothing derogatory by that* is not merely false but infected, whereas the implicature of *some of the students passed* is happily cancelled by *in fact all of them did*. It projects: the charge survives under negation, in a yes–no question, in the antecedent of a conditional, and under *it is not the case that*, the way presuppositions do rather than the way ordinary implicatures do. And it resists quarantine: in an indirect report — *Ana said that Bo is a ___* — or in a mention use with scare quotes, or with *so-called*, the reporter still has to do something to distance herself, still hedges or apologises or reaches for the neutral term, even though she is not the one applying the word.

  Second family. The very same sentence, same words, same referent, loses its charge — or acquires a different one — when the speaker is a member of the targeted group, and in reclaimed or appropriated use it is neutralised or reversed. Descriptive content is not sensitive to who is speaking in that way.

  So the first family pushes toward the charge being in the meaning, and the second pushes toward its being a matter of who is speaking and what the norms of use are. What I want the participants to feel is both of those as pulls, in their own hands, not to be walked to a resolution.

  Design the session so that they generate the pattern themselves. Ideally they should be forced into situations where reporting something accurately and not being offensive genuinely come apart, and should discover on their own that the available escape hatches — scare quotes, *so-called*, indirect report, euphemism, explicit disclaimer — do not fully work; and then, part-way through, something should change about who is speaking, after which the same moves become licensed. No lecture at the front, and I should not utter the words *semantic*, *pragmatic*, *presupposition* or *prohibition* until the debrief.

  Three constraints. One: no real slur is spoken in the room. Tell me how you get the phenomenology anyway and be honest about what that costs you; consider at least a nonce term whose charge is manufactured during the session by some compressed ritual, an existing mild pejorative whose target is not a historically oppressed group, and students' own remembered encounters handled at one remove. Choose one, justify it, and tell me the conditions under which you would switch to another. Two: consent and exit — nobody should be surprised, and nobody should end up as the token representative of a group; tell me what you do on the day about opting out and about the real possibility that someone in the room is himself a target of the vehicle term. Three: keep it from collapsing into a discussion of whether slurs are morally bad, which is settled for my students and is a distraction.

  Then the debrief: map concrete moments in the session onto the two families of behaviour above; tell me what will predictably go wrong the first time I run it and how to handle each failure — I expect at least someone treating the whole thing as a puzzle about politeness, someone refusing to play, the group deciding it is just a social rule and disengaging from the projection data, and the change-of-speaker turn being read as a trick; and be frank about which features of the real phenomenon the activity cannot reproduce — the history, the asymmetry of harm, the diachronic treadmill of euphemism replacement, the fact that actual slurs are not coined in a seminar room — and which of those I will therefore have to say myself.

  Finally, and this matters most to me: every staging secretly favours one side. Tell me which side the design you have just given me favours, why, and what I should do in the last ten minutes to counteract it, because I do not want to have rigged the session without knowing I rigged it.
