answer: |-
  ### Part 1: Candidate Mechanics and Vehicles

  Before settling on the design, I evaluated four mechanics and four vehicles to ensure the session generates the requisite phenomenology without violating safety constraints.

  **Candidate Mechanics**
  1.  **The "Taboo" Game:** Students lose points if they or their teammates cause a "forbidden" word to be spoken.
      *   *Verdict:* **Discard.** This simulates prohibition, not *projection*. It tests self-censorship, not whether the charge survives negation or indirect report.
  2.  **The "Courtroom" Judgment:** Students act as judges ruling on whether specific utterances are "acceptable" in a fictional society.
      *   *Verdict:* **Keep.** This externalizes the norm, allowing students to observe the pattern of judgments rather than just feeling personal discomfort.
  3.  **The "Telephone" Report:** Students must pass a message containing the sensitive term through three intermediaries who must report it accurately without endorsing it.
      *   *Verdict:* **Keep.** This directly targets the "quarantine" problem (indirect report/scare quotes).
  4.  **The "Identity Swap":** Half the room is assigned a fictional identity; rules change for them mid-session.
      *   *Verdict:* **Keep.** Essential for simulating reclamation/appropriation (Family 2).

  **Candidate Vehicles**
  1.  **A Real Slur (Written but Unspoken):** Write the word on the board, forbid uttering it.
      *   *Verdict:* **Discard.** Too high risk. Visual presence can be as triggering as auditory. Violates the spirit of the department policy.
  2.  **A Mild Pejorative (e.g., "Snob", "Hacker"):**
      *   *Verdict:* **Discard.** These lack the "infection" property. "He's a snob, but I don't mean that negatively" is felicitous. They fail to generate Family 1 data.
  3.  **A Bureaucratic Label (e.g., "Class-C Citizen"):**
      *   *Verdict:* **Discard.** Too cold. Students treat it as a rulebook constraint, not a normative charge. It feels like a traffic law, not a social stigma.
  4.  **A Nonce Term with Manufactured History (e.g., "Vark"):**
      *   *Verdict:* **Select.** "Vark" is phonetically sharp but meaningless. We can stipulate its descriptive content (e.g., "people from the North Dorms") and its expressive charge during the session.
      *   *Cost:* It lacks historical violence. Students know it's a game. I must acknowledge in the debrief that real slurs carry a weight of harm this cannot replicate.
      *   *Switch Condition:* If students treat "Vark" as a joke and refuse to engage with the norm, I will switch to **Candidate 2 (Mild Pejorative)** but restrict it to a specific context (e.g., "academic elitism") to heighten the stakes.

  ---

  ### Part 2: Session Design — "The Vark Protocol"

  **Objective:** Students will experience the resistance of derogatory content to cancellation/quarantine (Family 1) and its sensitivity to speaker identity (Family 2), without using real slurs or moralizing.

  **Materials:**
  *   Whiteboard and markers.
  *   Two stacks of colored cards (Green and Red) for each student.
  *   "Credit Slips" (small pieces of paper) — 20 total.
  *   Handout: "The Vark Lexicon" (one per student).

  **Roles:**
  *   **The Archivist (Instructor):** Records judgments, manages time, does not judge.
  *   **The Speakers:** Students tasked with producing utterances.
  *   **The Jury:** The rest of the class, judging acceptability using cards.
  *   **The Subjects:** Fictional characters in the examples (e.g., "Bo", "Ana").

  **Payoff Scheme:**
  *   **Epistemic Credit:** Students earn a Credit Slip when they successfully navigate a "trap" (e.g., report a Vark-sentence without triggering a Red Card from the Jury).
  *   **Reward:** The student with the most credits at the end gets an exemption from one short reading response due next week. (Costs $0, high value).

  **Consent & Safety Protocol (Crucial):**
  1.  **The "Yellow Card" Rule:** At the start, every student receives a Yellow Card. If they feel uncomfortable at *any* point, they place it on their desk. They are immediately excused from participation (observer status only) with no penalty and no questions asked. I will keep a stack of spare Yellow Cards visible.
  2.  **Fictional Identity:** The "Target Group" for the term "Vark" is explicitly fictional ("Residents of North Dorms" in a made-up university). No real demographic groups are referenced.
  3.  **Opt-Out:** I will state clearly: "This is a simulation of linguistic norms. If the simulation feels too close to reality for you, use the Yellow Card. I will not ask why."

  **Timeline (80 Minutes)**

  **0:00 – 0:10: Setup & Consent**
  *   Distribute materials.
  *   **Script:** "Today we are testing how language carries social weight. We will use a made-up word, 'Vark'. It refers to 'Students from North Dorms'. In this room, for this hour, 'Vark' carries a heavy negative charge. It implies incompetence. Your goal is to communicate accurately without triggering a social penalty."
  *   Explain the Green/Red Card system. Green = "Acceptable to say here." Red = "Unacceptable/Infected."
  *   Explain the Yellow Card opt-out.
  *   **Constraint:** Do not use forbidden words (*semantic, pragmatic*, etc.).

  **0:10 – 0:25: Phase 1 — Ritualizing the Charge**
  *   **Activity:** I tell a short story about "North Dorm" students failing a task. I use the word "Vark" twice, with a tone of disdain.
  *   **Task:** I ask the class: "If I say 'Bo is not a Vark', have I insulted North Dorm students?"
  *   **Voting:** Students vote Green/Red.
  *   **Goal:** Establish that the negative charge is present even in negation. (Most will vote Red/Infected).
  *   **Record:** I write the sentence on the board. Next to it, I draw a "biohazard" symbol based on the vote.

  **0:25 – 0:50: Phase 2 — The Reporting Trap (Family 1)**
  *   **Setup:** Divide class into pairs. One is **Speaker**, one is **Reporter**.
  *   **Task:** The Speaker says: "Bo is a Vark." The Reporter must report this to the class *accurately* but *without* endorsing the insult.
  *   **Allowed Moves:** They may use:
      *   Indirect speech ("Ana said that...")
      *   Scare quotes ("Bo is a 'Vark'")
      *   So-called ("Bo is a so-called Vark")
      *   Explicit disclaimer ("...and I don't mean that badly")
  *   **Judgment:** The rest of the class (Jury) votes Green/Red on the Reporter's utterance.
  *   **The Trap:** I instruct the Jury (secretly, via handout note) to vote **Red** if the word "Vark" is uttered *at all*, unless the Reporter is a "North Dorm Resident" (which no one is yet).
  *   **Outcome:** Students will find that *none* of the escape hatches work. The word "infects" the report. They will lose Credit Slips.
  *   **Teacher Role:** I simply record the failures. "So, 'so-called' didn't clear it. Scare quotes didn't clear it."

  **0:50 – 1:05: Phase 3 — The Identity Shift (Family 2)**
  *   **Shift:** I announce: "New Rule. Half of you are now designated 'North Dorm Residents' for this game. I am handing out Blue Lanyards." (Randomly distribute 8 lanyards).
  *   **Task:** Repeat the Reporting Task.
  *   **Condition:** If the *Speaker* or *Reporter* wears a Blue Lanyard, the Jury is instructed to vote **Green**.
  *   **Outcome:** The exact same sentences ("Bo is a Vark") now pass the acceptability test *if* spoken by a Lanyard-wearer.
  *   **Observation:** Students will notice the word hasn't changed, the referent hasn't changed, but the *license* has.

  **1:05 – 1:20: Phase 4 — Debrief & Mapping**
  *   Collect Credit Slips. Award the exemption.
  *   Open the floor to the theoretical mapping (see Part 4).

  ---

  ### Part 3: Debrief Plan

  **Mapping Concrete Moments to Theory**
  1.  **The Negation Test (Phase 1):** Map the "Bo is not a Vark" vote to **Projection**. Ask: "Why did the insult survive the 'not'?" Connect this to how presuppositions behave (unlike ordinary implicatures).
  2.  **The Reporting Trap (Phase 2):** Map the failure of scare quotes/indirect speech to **Non-Quarantinability**. Ask: "Why did reporting someone else's words still feel like *your* words?" This pushes toward the idea that the charge is in the *word type*, not just the speaker's intent.
  3.  **The Lanyard Shift (Phase 3):** Map the Blue Lanyard success to **Appropriation/Reclamation**. Ask: "Did the definition of 'Vark' change when the Lanyard-wearer spoke?" (No). "Did the rules of use change?" (Yes). This pushes toward the idea that the charge is in the *norms of use*, not the truth conditions.

  **Predictable Failure Modes & Handling**
  1.  **"It's Just Politeness":** A student argues the Red Cards are just about being rude.
      *   *Handle:* Point to Phase 1. "Rudeness usually cancels with 'I don't mean to be rude.' The charge didn't cancel. It behaved like a fact, not a manner."
  2.  **Refusal to Play:** A student uses a Yellow Card.
      *   *Handle:* Acknowledge silently. Assign them the role of "Data Recorder" (writing the sentences on the board) so they remain included without speaking.
  3.  **"It's Just a Social Rule":** The group decides the whole thing is arbitrary (which it is).
      *   *Handle:* Agree. "Real slurs are also social rules. The question is: are they rules about *what words mean* or rules about *who can speak*? The data gave us evidence for both."
  4.  **"The Lanyard Trick":** Students feel the Phase 3 shift was rigged.
      *   *Handle:* "It *was* rigged. That is the point. Real reclamation looks like a trick to outsiders. It looks like the word suddenly changed behavior. Why does that happen if the meaning is fixed?"

  **Limitations (What I Must Say)**
  I must explicitly state in the last 5 minutes:
  1.  **History:** "Vark" has no history of violence. Real slurs carry the weight of past harm, which makes the 'infection' much stronger and harder to cleanse than in our game.
  2.  **Harm:** In this game, the cost was a Credit Slip. In reality, the cost is dignity, safety, or opportunity.
  3.  **The Treadmill:** We didn't simulate how euphemisms replace slurs over time. This session froze the word in place.

  ---

  ### Part 4: Bias Analysis & Counteraction

  **Which Side Does This Design Favor?**
  This design secretly favors **Family 1 (The Semantic/Presupposition View)**.
  *   **Why:** By stipulating the "charge" of *Vark* at the very beginning (Phase 1) and making it robust against negation and reporting (Phase 2), I am leading students to experience the derogatory content as *inherent* to the lexical item. It behaves like a hard constraint, like truth-conditional content or a hard presupposition. The "infection" feels like it lives in the word itself.
  *   **Risk:** Students may leave thinking slurs are derogatory *solely* because of their semantic content, underestimating the role of social power and context.

  **Counteraction Strategy (The Last 10 Minutes)**
  To balance this, I must aggressively pivot during the Debrief to highlight the **Family 2 (Pragmatic/Use-Conditional)** evidence.
  *   **Action:** When discussing Phase 3 (The Lanyards), I will ask: "If the meaning of 'Vark' was fixed as 'bad' in Phase 1, how did the Lanyard wearers say it without it being 'bad' in Phase 3?"
  *   **Forced Conclusion:** If the meaning were purely semantic/fixed, the Lanyard shouldn't matter. The fact that it *does* matter proves the charge is sensitive to **speaker identity and social norms**, not just lexical definition.
  *   **Closing Statement:** "If you walked away thinking the charge is *only* in the word, you ignored the Lanyard. If you think it's *only* in the speaker, you ignored the Reporting Trap. The phenomenon is the tension between the two. The word resists cleaning (Family 1), *unless* the speaker has the authority to clean it (Family 2). That tension is where the philosophy lives."

