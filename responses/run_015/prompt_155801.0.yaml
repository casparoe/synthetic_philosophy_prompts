  *   **If she says this is NOT an "a":** Then her rule is about **Baseline Integrity**. She believes an "a" simply cannot have any stroke activity below the baseline, regardless of whether it encloses space. This confirms that the rejection of your stacked-bowl symbol is due to the violation of the letter's spatial zone.

