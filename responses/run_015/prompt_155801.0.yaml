      *   *Rule:* The constituent parts of the letter (bowl and stem/tail) must be physically connected or form a continuous stroke.
      *   *Application:* A detached tail is "noise." A continuous handwriting stroke (like your new symbol) passes this test.
  2.  **The Principle of Orientation (Judgment 5):**
