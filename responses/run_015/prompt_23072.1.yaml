answer: |-
  First off, take a deep breath. Two hours on teleosemantics is enough to make anyone's head spin, and it is genuinely one of the thorniest debates in philosophy of mind. You and your roommate are grappling with the central tension in naturalizing content: **How do you get "ought" (truth/falsity) out of "is" (causes/evolution)?**

  Here is the breakdown you need to go back in with. I'm going to side with you on the specific claim about Dretske, but I'll show you why the "who won" question is a bit more nuanced.

  ### 1. The Core Dispute: Can Information Be False?

  Your roommate's claim is that Dretske is "cleaner" because he relies on **nomic dependence** (information) rather than Millikan's **proper function** (norms).

  **The Problem:** In Dretske's strict information-theoretic account (*Knowledge and the Flow of Information*), information is defined probabilistically. Signal $S$ carries the information that $p$ only if the conditional probability of $p$, given $S$, is 1 (under relevant nomic constraints).
  *   **Implication:** If $S$ carries the information that $p$, then $p$ **must** be true. Information, in Dretske's strict sense, is factive. You cannot have "false information."
  *   **The Misrepresentation Problem:** If content is just information, misrepresentation is impossible. If the state occurs, the fact must obtain. If the fact doesn't obtain, the state didn't carry the information.

  So, how does Dretske solve misrepresentation? He can't do it with *information* alone. He has to pivot to **function**.

  ### 2. Dretske on Misrepresentation: The "Recruitment" Strategy

  To allow for error, Dretske (especially in *Naturalizing the Mind*, refining *KFI*) introduces a temporal distinction.

  *   **The Learning/Recruitment Period:** A system enters a state where it learns a correlation. During this period, a neural state $N$ is reliably caused by $F$ (flies). The content is fixed by this initial period of nomic dependence.
  *   **The Usage Period:** Once recruited, $N$ has the **function** of indicating $F$.
  *   **The Error Case:** Later, $N$ fires, but there is no $F$ (maybe it's a BB pellet).
  *   **Why it's Error:** $N$ is misrepresenting because it is failing to perform the function it acquired during the recruitment period.

  **Where the Normativity is Smuggled In:**
  Your roommate says Dretske avoids norms. This is incorrect. By distinguishing between what the state *actually* indicates now (nothing, because the probability isn't 1 anymore) and what it is *supposed* to indicate (based on the past recruitment), Dretske is invoking a **norm of performance**.
  He is saying the state *ought* to match the conditions of its recruitment, even if it currently doesn't. That "ought" is a norm. He naturalizes it via causal history, but it is still a normative constraint on the state's current operation. If he didn't have this norm, the content would just shift to whatever is currently causing the state (e.g., "fly-or-BB"), and error would vanish.

  ### 3. Millikan on Misrepresentation: The "Proper Function" Story

  Millikan is upfront about the normativity. She doesn't try to hide it behind information theory.

  *   **The Mechanism:** A representational device (like the frog's fly-detector) has a **proper function**. This is defined by what ancestors of this device *did* that contributed to survival and reproduction.
  *   **The Error Case:** The frog's detector fires for a BB.
  *   **Why it's Error:** The mechanism is failing to perform its proper function. Its proper function is to coordinate with the tongue-snapping mechanism in the presence of *nutritious flies*. When it fires for a BB, it fails to satisfy the **conditions of success** established by its selection history.
  *   **The Norm:** The "ought" comes from history. The device *ought* to operate as its successful ancestors did.

  ### 4. The Showdown: Who is More Exposed to the Normativity Objection?

  The "Normativity Objection" asks: *How can a purely physical/evolutionary history generate a genuine semantic norm (truth conditions)?*

  **Your Roommate's View:** Dretske avoids this because he uses information, not evolution/norms.
  **The Reality:** Dretske is actually **more** exposed to the charge of inconsistency, while Millikan is more exposed to the charge of explanatory gap.

  1.  **Dretske's Vulnerability (The "Smuggling" Charge):**
      Dretske claims the purity of information theory. But as we saw, information cannot be false. To get misrepresentation, he *must* import the concept of "function" (what the state is supposed to do). Once he does that, he is playing the same game as Millikan.
      *   **Verdict:** You win this point. Dretske does not have a "norm-free" account. He relies on the normativity of *functional assignment* just as much as Millikan relies on *biological function*. If the roommate insists Dretske has *no* norms, the roommate is ignoring how Dretske actually solves the error problem.

  2.  **Millikan's Vulnerability (The "Is-Ought" Charge):**
      Millikan admits she is using norms. Her defense is that "proper function" is a naturalistic category (like the function of a heart).
      *   **Verdict:** She is more honest, but she faces the harder metaphysical lift. She has to prove that *historical success* equals *semantic correctness*. Critics argue that just because a mechanism helped ancestors survive doesn't mean it represents the truth (it might just be a useful fiction).

  ### 5. Who Won the Argument?

  **You won the specific claim.**
  Dretske does not have a norm-free account of content. If he did, he couldn't explain misrepresentation. Strict information relations ($P=1$) preclude error. To allow error, Dretske must fix content historically and assert that the current state is *supposed* to match that history. That "supposed to" is a norm.

  **However, don't let the roommate off the hook entirely.**
  While Dretske smuggles norms in, Millikan's account is arguably *more* robust precisely because she faces the normativity objection head-on. Dretske's attempt to ground it in "information" often collapses into Millikan's "teleology" anyway (which is why Dretske's later work looks so much like Millikan's).

  **The "Missed Point" Check:**
  Did you both miss the point? Possibly slightly. The real issue isn't whether norms exist (both need them), but **which naturalization of norms is more plausible.**
  *   **Dretske:** Norms come from individual learning/recruitment history (ontogenetic).
  *   **Millikan:** Norms come from evolutionary selection history (phylogenetic).

  **How to close the argument:**
  Tell your roommate: *"Dretske's information relation ($P=1$) makes error impossible by definition. The only way Dretske solves misrepresentation is by fixing content during a learning period and saying the system is 'supposed' to maintain that correlation. That 'supposed to' is a norm. So, Dretske isn't norm-free; he just hides the normativity in the concept of 'function' rather than putting it in the title of his theory like Millikan does."*

  Go get some water. You earned it.
