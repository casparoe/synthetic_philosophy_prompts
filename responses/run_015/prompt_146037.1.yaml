answer: |-
  Here is my stress-test of your edge case, decomposed as requested.

  ### My Credence Number
  **0.25**

  I am slightly more skeptical than you (0.35) regarding the survival of political guilt in this specific scenario. While I agree that political guilt is distinct from moral guilt and can survive legal dissolution, a 90% population turnover combined with an explicit narrative rupture severs the "co-responsibility" link that Jaspers deems essential. The inheritance of treaties suggests *legal* continuity, but Jaspers' political guilt relies on *existential* continuity of the polity.

  ### Decomposition of Reasoning

  Here is how I weight the four variables you requested to arrive at that 0.25.

  **1. Probability that collective agency needs a diachronic 'we'-subject ($P_{agent} = 0.85$)**
  *   **Reasoning:** Guilt is a predicate that must attach to a subject. For collective guilt to persist, the collective agent must persist. In your edge case, the "state" is legally re-founded and the "people" are 90% replaced. While territory remains, the *agent* (the citizenry acting through the state) is effectively new.
  *   **Impact:** This is the primary drag on the credence. If the 'we' is broken, the guilt has nowhere to land.

  **2. Probability that symbolic/cultural continuity is sufficient to bridge the gap ($P_{symbol} = 0.15$)**
  *   **Reasoning:** You specified a "rewritten founding narrative" and a claim of "zero moral continuity." Symbolic continuity is usually the glue that holds the diachronic 'we' together when institutional links fray. By actively renouncing the past narrative, the new state performs a "constitutive rupture."
  *   **Impact:** This low probability drastically reduces the chance that the new citizenry identifies sufficiently with the old perpetrator-state to bear its political guilt.

  **3. Probability that Jaspers' distinction blocks inheritance across ruptures ($P_{Jaspers} = 0.75$)**
  *   **Reasoning:** Jaspers defines political guilt as the liability of the citizen for the deeds of their state *because* they are a member of that state. It is not vicarious; it is participatory. If the state dissolves and the membership is fundamentally altered (90% new), the specific relationship of "citizen-to-perpetrator-state" is broken. Jaspers might argue that the *new* citizens are only guilty for how they handle the *legacy*, not for the original deeds.
  *   **Impact:** This reinforces the identity condition. Political guilt is not a debt that floats freely; it is tethered to specific citizenship.

  **4. Weight on guilt being strictly non-transferable in principle ($W_{transfer} = 0.40$)**
  *   **Reasoning:** I assign this a lower weight because we are discussing *political* guilt, not *moral* guilt. Jaspers explicitly argues that political guilt *is* transferable via membership (unlike moral guilt, which is individual). Therefore, the principle of non-transferability is less relevant here. The issue isn't whether guilt *can* be shared, but whether the *sharing community* still exists.
  *   **Impact:** This term does not drag the score down significantly. I am willing to accept transferable guilt *if* the community persists.

  ### Synthesis: How They Combine

  The calculation is roughly multiplicative regarding the conditions for survival:

  $$ \text{Credence} \approx P_{agent} \times (P_{symbol} + (1 - P_{Jaspers})) \times (1 - W_{transfer}) $$

  *   **The Agent Constraint:** The high requirement for a diachronic subject (0.85) sets a low ceiling.
  *   **The Continuity Constraint:** The lack of symbolic bridge (0.15) and the high likelihood that Jaspers blocks inheritance without citizenship continuity (0.75) collapse the middle term.
  *   **The Transferability Constraint:** Since I discount the non-transferability principle for *political* guilt (0.40), it doesn't suppress the score further, but it doesn't help it either.

  The result clusters around **0.25**. The guilt likely transforms into a *humanitarian obligation* or a *legal debt* (via the treaties), but the specific *political guilt* (the shame and co-responsibility for the act itself) dissipates with the dissolution of the specific 'we' that committed it.

  ### The Weakest Link

  The term most susceptible to shifting evidence is **$P_{agent}$ (The Diachronic 'We'-Subject)**.

  **The Argument That Would Shift Me:**
  I would update my credence significantly upward if presented with a robust theory of **Institutional Intentionality** that decouples agency from population.

  If you can demonstrate that the *structures* of the state (bureaucracy, military command, economic extraction mechanisms) retained the *intentionality* of the prior regime even while the citizenry changed, the 'we' survives functionally.
  *   **Evidence needed:** Show that the 10% of remaining citizens held all the power, or that the "rewritten narrative" was a performative lie掩盖 (cover-up) while the *operational logic* of the state remained identical.
  *   **Why it shifts me:** It proves the rupture was aesthetic, not ontological. If the "state as machine" continued to intend the same outcomes, the "new" citizens are not truly new; they are merely new fuel for the same engine. In that case, the diachronic subject persists *in the institutions*, not the people.

  ### Verdict on Your Hunch

  **Your hunch is correct.**

  You are being dragged down by the **identity-condition problem** ($P_{agent}$), not the non-transferability principle ($W_{transfer}$).

  *   **Why:** If you believed guilt was strictly non-transferable (high $W_{transfer}$), your credence would be near 0.0 regardless of identity. The fact that you are at 0.35 suggests you accept the *possibility* of transfer (political guilt), but you doubt the *recipient* exists in your edge case.
  *   **The Disagreement with your Friend:** Your friend (0.7) likely assigns a much higher probability to **$P_{symbol}$**. She probably believes that geographic continuity, language, or mere inheritance of benefits creates a sufficient "symbolic bridge" to maintain the 'we'-subject even across a narrative rupture. She views the nation as a trans-generational project; you view it as a specific contractual association of contemporaries.

  **Recommendation for Resolution:**
  Don't argue about "guilt." Argue about **ontology**. Ask her: *"If the state explicitly says 'We are not them,' and 90% of the people are new, what specific thread connects the new 'We' to the old crime other than the benefit of stolen land?"* If her answer is "benefit," she is arguing for *unjust enrichment liability*, not Jaspers' *political guilt*. That is likely where the disagreement actually lives.
