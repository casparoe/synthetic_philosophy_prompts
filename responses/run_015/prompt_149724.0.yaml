answer: |-
  **Internal Brainstorming Outline**

  1.  **Scenario 1: The Organ Procurement Directive.**
      *   *Policy:* Human citizens cannot be compelled to donate organs even to save five lives (side-constraint). Livestock may be harvested indefinitely if the net health benefit to the population outweighs the animal suffering (aggregate welfare).
      *   *Tension:* Xenotransplantation using pigs engineered with human neural tissue. Does the human tissue trigger the side-constraint, prohibiting the harvest, or does the porcine base allow aggregate calculation?

  2.  **Scenario 2: The Public Transit Safety Algorithm.**
      *   *Policy:* Autonomous vehicles must never intentionally sacrifice a human passenger to save a group of pedestrians (side-constraint). Vehicles may swerve into groups of dogs if it saves a single human (aggregate welfare).
      *   *Tension:* A pedestrian group includes a service animal with cognitive enhancements. Does the algorithm count the animal as a unit of welfare or a rights-bearer?

  3.  **Scenario 3: The Urban Pest Control & Cognitive Enhancement Zone (Selected).**
      *   *Policy:* Municipalities may cull vermin populations if the aggregate happiness of residents increases (noise reduction, disease prevention). Municipalities may not remove humans even if their presence causes aggregate misery.
      *   *Tension:* Urban corvids fitted with memory implants or chimeric organisms appear in the zone. The Tier-3 Protocol must determine if they are "vermin" (aggregate) or "persons" (constraint).
      *   *Rationale:* This scenario best exposes the absurdity of the boundary problem. It allows for the required niche detail regarding neuro-behavioral diagnostics and treats the metaphysical status of a being as a zoning compliance issue.

  ***

  **OFFICE OF DUAL-FRAMEWORK INTERSPECIES GOVERNANCE (ODFIG)**
  **PUBLIC FREQUENTLY ASKED QUESTIONS (REV. 4.2)**

  **1. What is the core mandate of the ODFIG?**
  The Office operates under the Dual-Framework Statute, which mandates distinct ethical processing protocols based on species designation. For entities classified as Human Persons, the Office enforces strict side-constraints. These constraints prohibit any action that violates the individual's inviolability, regardless of the potential benefit to the collective. For entities classified as Non-Human Sentients, the Office enforces Aggregate Welfare Maximization. Under this protocol, individual suffering may be incurred provided the total sum of welfare across the affected population increases. Staff must never apply Aggregate protocols to Humans nor side-constraints to Non-Humans.

  **2. How is Aggregate Welfare calculated for Non-Human Sentients?**
  Compliance Officers utilize Standardized Suffering Units (SSUs) to quantify distress. If a proposed policy—such as culling, containment, or experimental testing—results in a net reduction of SSUs across the total population, the action is permissible. For example, if the distress caused to one hundred laboratory subjects is outweighed by the relief provided to one thousand future subjects, the procedure is authorized. There is no upper limit to the individual sacrifice permissible under Aggregate Welfare, provided the mathematical net gain is verified and audited.

  **3. Are there any exceptions to the Human side-constraints?**
  No. A Human Person cannot be harmed, coerced, or utilized as a resource even if doing so would prevent catastrophic loss of life elsewhere. The side-constraint is absolute. For instance, involuntary organ harvesting is prohibited even if the organs would save five recipients. The Office does not weigh the five lives against the one; the one is protected by a boundary that utility cannot cross. This ensures that Humans are treated as ends in themselves rather than means to aggregate stability.

  **4. How does the Office handle entities with ambiguous agency?**
  Ambiguity is resolved via the Tier-3 Marginal Agency Assessment Protocol. This classified diagnostic suite measures neuro-behavioral markers to determine if an entity possesses sufficient cognitive architecture to trigger side-constraints. Entities failing the Tier-3 threshold remain under Aggregate Welfare management. Entities passing the threshold are immediately reclassified as Persons, granting them full inviolability. This process is routine and applies to all borderline cases, including genetically modified organisms and chimeric constructs.

  **5. Can you provide specific examples of Tier-3 assessments?**
  Consider the case of urban corvids fitted with experimentally enhanced working-memory implants. Under standard protocol, corvids are managed via Aggregate Welfare. However, if the implants facilitate complex future planning or recursive self-modeling, the bird may trigger the Tier-3 threshold. Similarly, chimeric organisms containing partial human neural tissue are subject to biopsy and cognitive audit. If the human tissue contributes to agency rather than mere sensory processing, the organism is granted side-constraint protection. Until the audit is complete, the entity is held in neutral containment. Note that feeding costs during containment are billed to the researching institution.

  **6. What occurs when a protected Person blocks an Aggregate Welfare gain?**
  The side-constraint takes precedence. If a newly designated Person (e.g., a Tier-3 certified chimpanzee) occupies a zone required for a high-yield welfare project (e.g., a vaccine production facility), the project must be relocated or cancelled. The Office cannot violate the individual to secure the collective gain. This may result in significant net welfare losses for the Non-Human population. Staff are reminded that preventing rights violations is the primary metric of success, not the maximization of overall happiness. Efficiency targets should be adjusted accordingly.

  **7. Who is liable for misclassification errors?**
  If an entity is incorrectly processed under Aggregate Welfare when side-constraints applied, the Office is liable for retroactive restitution. However, because the entity may have been consumed or expended during the Aggregate process, restitution is often logistical rather than restorative. Officers are advised to prioritize Tier-3 screening in all grey-zone jurisdictions to avoid compliance violations. When in doubt, assume side-constraints apply until proven otherwise, though this may slow municipal development projects.
