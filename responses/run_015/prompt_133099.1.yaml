answer: |-
  The standard interpretation of Putnam's Twin Earth thought experiment commits a category mistake. It conflates the semantics of public language with the ontology of mental states. While Twin Earth successfully demonstrates that the reference of natural kind terms is fixed by external causal histories and social norms, it fails to establish that the *content* of an individual's psychological states is similarly broad. If we rigorously distinguish between reference (a relation between symbol and world) and content (the cognitive role of a representation within a subject), the intuitive force of externalism dissolves. The correct conclusion is not that "meanings ain't in the head," but rather that *reference* ain't in the head, while *mental content* remains stubbornly narrow.

  To see this, we must grant the standard setup: Earth-Oscar and Twin-Oscar are molecule-for-molecule identical. Their neural structures, functional organizations, and phenomenological experiences are indistinguishable. The externalist argues that because Earth-Oscar's term 'water' refers to H2O and Twin-Oscar's 'water' refers to XYZ, they possess different beliefs when they assert "Water is wet." This inference relies on the assumption that belief individuation tracks truth conditions. This assumption is false regarding psychological explanation.

  Psychology is the science of behavior and cognition. Its explanatory power relies on identifying the internal causes of action. If Earth-Oscar reaches for a glass and Twin-Oscar reaches for a glass, and their motor outputs are identical, their psychological explanations must be identical. If we individuate their belief states by the external substance (H2O vs. XYZ), we lose the ability to explain why their behaviors match. We would be forced to say that two distinct mental states caused the exact same physical action in the exact same physical context. This violates the principle of supervenience: psychological states supervene on the physical state of the brain. Since the brains are identical, the mental states must be identical. Therefore, the difference in H2O and XYZ is irrelevant to the individuation of the mental state itself.

  The externalist objection typically rests on the intuition that Oscar *means* something different by 'water'. But this conflates what a word *refers to* in a public language with what a thinker *grasps* in a private mind. We must defend the view that mental representations are individuated by their inferential roles. A mental symbol's content is determined by its relationships to other symbols and its role in reasoning, not by its causal history with the environment.

  Consider the inferential profile of the concept WATER for both Oscars. For both subjects, the concept WATER supports the inference: "If x is water, then x is drinkable." For both, it supports: "If x is water, then x is wet." Crucially, for neither Oscar does the concept WATER support the inference "If x is water, then x is H2O" (unless they have acquired specific chemical knowledge, which would then be a separate concept). The chemical essence is hidden from the cognitive system. The cognitive system operates on the basis of superficial properties (clear, liquid, quenches thirst). Since the inferential role of the symbol WATER is identical in both Oscars, the narrow content is identical. The fact that one symbol locks onto H2O and the other onto XYZ is a fact about the environment's response to the symbol, not a fact about the symbol's internal computational role.

  This forces a sharp distinction between reference and content. Reference is a normative, relational property. It is determined by the "division of linguistic labor" and causal chains that extend beyond the skin of the subject. When Putnam argues that the extension of 'water' is fixed by the underlying structure of the liquid in the environment, he is describing a convention of public language reference-fixing. He is describing how a community stabilizes the use of a term to ensure successful coordination. This is a sociological fact, not a psychological one.

  Mental content, conversely, is the mode of presentation. It is how the world appears to the subject. If mental content were broad, then a subject could never know the content of their own thoughts without investigating the external world. This leads to an absurdity in self-knowledge. If Oscar cannot know whether he is on Earth or Twin Earth without chemical analysis, and if his belief content depends on that distinction, then Oscar cannot know what he believes. But introspection reveals that Oscar knows exactly what he believes: he believes that the clear liquid in front of him is water. The opacity of the environment to the subject proves that the environment is not constitutive of the subject's mental content.

  Therefore, the Twin Earth scenario does not prove semantic externalism about minds. It proves semantic externalism about *words*. It shows that public language terms acquire their reference through social norms and causal histories that transcend the individual. The individual mind, however, carries a "notion" or a "guise" that is purely internal. When Earth-Oscar thinks WATER, he tokenizes a narrow mental representation. When Twin-Oscar thinks WATER, he tokenizes the *same* narrow mental representation. The difference lies only in the extension of the public term associated with that representation.

  The intuitive pull of Twin Earth comes from a specific conflation: we mistake the truth conditions of a statement for the belief state of the speaker. It is true that Earth-Oscar's utterance "This is water" is true iff the liquid is H2O, and Twin-Oscar's is true iff the liquid is XYZ. Externalists seize on this difference in truth conditions to argue for a difference in belief. But truth conditions are determined by the world, whereas belief states are determined by the mind. Two subjects can be in the same belief state while uttering sentences with different truth conditions. The belief state is the input to the system; the truth condition is the output relation to the world. Twin Earth shows that the mapping from internal state to truth condition is context-sensitive. It does not show that the internal state itself is context-sensitive.

  By failing to separate these, Putnam's argument inadvertently undermines the autonomy of psychology. If mental content is broad, then psychology cannot be a local science; it would require knowledge of the entire causal history of a subject's environment to individuate their states. This is methodologically disastrous. A rationalist conceptual analysis corrects this by prioritizing the explanatory requirements of cognitive science. The mind is a syntactic engine. It manipulates symbols based on their shape and internal connections, not their external referents. The brain cannot "reach out" and touch H2O; it can only process signals caused by H2O. Since the signals from H2O and XYZ are identical ex hypothesi, the processing must be identical.

  Consequently, semantic externalism should be reinterpreted as a thesis about social-linguistic norms. It explains how communities coordinate reference despite individual ignorance. It explains why I can use the word 'elm' correctly even if I cannot distinguish an elm from a beech, because the community's experts fix the reference. This is a fact about the stability of public language, not the composition of my mind. My mental concept of 'elm' is defined by my limited inferential role (a tree with leaves), which is identical to a counterpart's who lives in a world where 'elm' refers to a different species.

  To conclude, the Twin Earth argument succeeds only if one assumes that mental content is exhausted by truth-conditional semantics. If one rejects this assumption and adopts an inferential role semantics for mental states, the argument collapses. The Oscars share identical belief-states. They differ only in the external relations their public words bear to their respective environments. The lesson of Twin Earth is not that the mind extends into the world, but that language is a social institution that transcends the mind. The intuitive resistance to this view stems from a pre-theoretical tendency to treat words and thoughts as the same kind of entity. Rationalist analysis demands we separate them. Mental content is narrow, internal, and individuated by role. Reference is broad, external, and individuated by causal history. Twin Earth proves the latter, but leaves the former untouched.
