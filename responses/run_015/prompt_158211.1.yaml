      *   *Adjustment:* Clarify that Nadia's "probabilistic profile" is actually a profile of the *earliest tradition*, which she conflates with the *person*.

  7.  **Final Polish:** Ensure the distinction between "historical Jesus" (the construct) and "Jesus of history" (the reality) is clear. (Proceed to generate output based on this structure).

