  2.  **Deconstruct the Debate Positions:**
      *   *Progress Camp:* Focuses on *outcomes* that align with human welfare and liberty (abolition, health, self-governance). Implicitly views reason as a tool for liberation from tradition/superstition.
      *   *Domination Camp:* Focuses on *mechanisms* of control enabled by categorization and efficiency (census, race, bureaucracy). Implicitly views reason as a tool for ordering, controlling, and excluding.
