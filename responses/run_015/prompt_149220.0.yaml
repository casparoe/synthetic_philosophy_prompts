  **Brainstorming Framings**

  1.  **The "Peacock's Tail" Analogy:** The economist explicitly compares welfare claimants to peacocks. The bureaucracy is the tail.
      *   *Critique:* Too on-the-nose. A policy economist would likely use econometric terminology ("separating equilibrium") rather than direct biological metaphor, even if the underlying logic is identical. It risks breaking the "sincerity" of the persona.
  2.  **The "Information Asymmetry" Frame:** Focus on the problem of distinguishing true need from fraud. The ordeal is a screening mechanism. The AI threat is "signal inflation."
      *   *Critique:* Strongest voice. Allows for dry, technocratic language that masks the absurdity. It lets the theory speak for itself without needing to say "like a bird."
  3.  **The "Civic Virtue" Frame:** Argue that suffering for benefits builds character and proves loyalty to the state.
      *   *Critique:* Too political/ideological. The prompt asks for signalling theory specifically (costly honesty), not moralizing.

  **Selection:** Framing #2. It allows for the most precise application of Zahavi's Handicap Principle while maintaining the deadpan voice of a think tank economist who believes he is solving an optimization problem.

  ***

  **The Efficiency Trap: Why Friction Saves Welfare**

  **By Dr. Marcus Thorne**

  Critics of public assistance programs often point to the administrative burden—the redundant forms, the mandatory in-person renewals, the hours spent on hold—as evidence of government incompetence. They argue for streamlining, for digital-first interfaces, for frictionless access. They are mistaken. What they call waste, I call a separating equilibrium.

  To understand why bureaucratic inefficiency is not a bug but a feature, one must look to evolutionary biology. Amotz Zahavi's Handicap Principle posits that for a signal to be honest, it must be costly. A peacock's tail is cumbersome and attracts predators; precisely because it is costly, it honestly signals genetic fitness. A cheap signal is easily mimicked by low-quality agents. In the context of social safety nets, the benefit is the resource, and the applicant's need is the quality being signalled. If the cost of claiming the benefit is too low, those who do not truly need it will mimic the signal, collapsing the system.

  Therefore, the ordeal must be costly. But crucially, it must be *differentially* costly. The standard economic objection is that administrative burdens impose deadweight loss. This misses the point of signalling theory. The waste is the mechanism of honesty. The ordeal must be constructed out of resources that the genuinely needy possess in relative abundance but that fraudsters find prohibitively expensive. Historically, this was time. The unemployed have a lower opportunity cost of time than the employed.

  However, we face a new threat to signal integrity: Generative AI. Large language models have drastically reduced the marginal cost of completing forms, drafting appeal letters, and navigating eligibility criteria. We are witnessing signal inflation. A fraudster can now outsource the cognitive labor of the ordeal to a bot, rendering the traditional paperwork hurdle useless. The separating equilibrium is collapsing.

  To restore honesty to the system, we must escalate the handicap. We need ordeals that cannot be digitized. I propose a shift toward physical and sensory friction. Claimants should be required to submit renewals via handwritten notarization at specific satellite offices between the hours of 8 a.m. and 10 a.m. on weekdays. We should reintroduce queueing systems that require physical presence rather than virtual ticketers. The cost here is not just time; it is the discomfort of uncertainty, the indignity of exposure, and the inability to automate the process.

  An AI can fill out a PDF in seconds. It cannot stand in the rain outside a municipal building. It cannot navigate a broken telephone menu system that requires specific key presses based on ambient noise. These are high-fidelity signals of human desperation that machines cannot fake.

  Efficiency advocates will argue this punishes the vulnerable. I argue it protects them. By raising the cost of entry, we ensure that only those with the highest marginal utility for the benefit will endure the handshake. We recently piloted a program in the Midwest incorporating these heightened friction protocols. The results were unequivocal: claims fell by two-thirds within a quarter.

  Critics call this a humanitarian failure. I call it successful targeting. The reduction in claims indicates that the signal is once again too costly for the non-needy to mimic. The system is finally working as designed: filtering out those unwilling to pay the price of honesty.

  ***

  **About the Author:** *Marcus Thorne is a Senior Fellow at the Center for Fiscal Integrity and the author of "Signalling in Social Systems: A Handbook for Policy Design."*
