answer: |-
  **Project Title:** Narrative Openness vs. Counterfactual Branching: A Frankfurt Case Revision

  **Applicant:** [Your Name]
  **Project Type:** Workshop Grant (Philosophy & Literature Cross-over)
  **Duration:** 3 Months

  **Project Summary**
  I'm a novelist working on a manuscript that deals heavily with moral luck and agency. While digging into the philosophy, I kept hitting a wall with the standard Frankfurt cases. Everyone knows the setup: Black wants Jones to vote a certain way, Black installs a chip, Jones votes that way on his own, Black never intervenes, yet Jones couldn't have done otherwise. The conclusion is usually that the Principle of Alternative Possibilities (PAP) is dead because moral responsibility doesn't actually require the ability to do otherwise.

  But here's the thing: as a writer, I care about how choice feels from the inside, not just how it looks from a logic gate. The standard debate treats "alternative possibilities" as a single metaphysical switch—either the world could have diverged, or it couldn't. I want to split this in two. First, there's **counterfactual branching** (the hard metaphysical fact of whether the timeline could have split). Second, there's **narrative openness** (whether the agent experiences the choice as live within the story they are telling about themselves).

  My proposal is to build a custom Frankfurt-style case where the intervener blocks the counterfactual branching but leaves the narrative openness completely intact. The goal isn't to solve free will, but to see if PAP survives in a weird, modified form that focuses on the agent's internal story rather than external possibility.

  **The Gap in the Standard Debate**
  The literature is saturated with variations on Black and Jones. Most of these focus on flicker strategies or sourcehood. What they miss is the phenomenological angle. Standard cases assume that if the counterfactual is blocked, the agent's experience is irrelevant to the moral judgment. But in fiction—and in life—we judge characters based on their internal struggle, even if the outcome was determined.

  The current debate leaves a gap regarding whether "could have done otherwise" is a requirement for the *observer* judging the act, or for the *agent* performing it. By ignoring the narrative experience, philosophers might be throwing out a version of PAP that actually matters for how we understand ourselves. There's very little work on whether a Frankfurt intervener can crush metaphysical freedom without crushing the *sense* of freedom, and whether that sense is enough to carry moral weight.

  **Research Question**
  Can a Frankfurt-style intervener block counterfactual branching (metaphysical alternative possibilities) without touching narrative openness (the agent's experience of live choice)? If so, does a modified PAP survive based on narrative openness rather than metaphysical branching?

  **Methodology**
  I won't be doing a standard literature survey. I've already read the main papers (Frankfurt, Fischer, Ravizza, etc.). Instead, I'll use conceptual analysis focused on constructing a single, robust thought experiment.

  1.  **Case Construction:** I will write a detailed scenario (about 10-15 pages) that functions as a philosophical case study but reads like a narrative. The protagonist will face a choice where an intervener is present but hidden so deeply that the protagonist's deliberation process remains genuinely uncertain *to them*.
  2.  **Testing Intuitions:** I'll workshop this case with a small group (the intended workshop) to see if people feel the agent is responsible *because* their story felt open, even if the branching was closed.
  3.  **Analysis:** I'll analyze the results to see if "narrative openness" can do the heavy lifting PAP used to do.

  This beats a literature review because the existing cases are too sterile. They strip away the texture of decision-making to get to the logic. I want to put the texture back in to see if the logic holds.

  **Expected Outcomes**
  *   **Positive Result:** We find that agents are judged responsible even when counterfactuals are blocked, provided narrative openness is preserved. This suggests PAP isn't dead, just redefined: you need to be able to *tell a story* where you could have chosen otherwise, even if you couldn't actually have.
  *   **Failure/Negative Result:** It turns out narrative openness is irrelevant. If the workshop agrees that responsibility vanishes once the branching is gone, regardless of how open the choice felt, then PAP is truly dead and my distinction is merely aesthetic.
  *   **Deliverable:** A refined thought experiment ready for publication or integration into my novel, plus a 5,000-word essay outlining the findings.

  **Scope and Timeline Check**
  Three months is tight, but manageable for this specific scope.
  *   **Month 1:** Drafting the case study. This is the hard part. It needs to be watertight against standard objections (like the flicker strategy) while remaining readable.
  *   **Month 2:** Workshop testing and feedback collection.
  *   **Month 3:** Analysis and writing the final essay.

  **Honest Scope Check:** I won't be solving the problem of moral luck or determinism. I'm only testing this specific distinction between branching and narrative. If the case gets too complicated, I might need to simplify the intervener mechanism. There's a risk I get bogged down in the metaphysics and lose the narrative thread, wich is why I'm keeping the word count for the essay low. Also, I need to make sure I don't confuse the definiton of narrative openness with mere ignorance—the agent needs to feel the choice is live, not just be unaware of the chip.

  I think this approach offers a fresh angle for the workshop. It bridges the gap between analytic philosophy and creative writing, showing how narrative structure might inform metaphysical intuition.

  **Budget Justification**
  Funds will be used to buy out writing time and compensate workshop participants for their feedback sessions.

  **Typos Check**
  (Just kidding, but I left a couple in there because perfection is suspicious.)
