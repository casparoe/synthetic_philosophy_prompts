answer: |-
  There is no single, universally canonical term that captures this exact triad (behavioral shift + justification stasis + sincere belief), but the closest established concept comes from organizational sociology: **Institutional Decoupling** (specifically within New Institutionalism).

  However, that term usually implies the formal rule is *ignored* in practice. In your case, the norm is *enforced*, just for a different reason. Because of this nuance, you are likely looking at a specific subtype of decoupling that doesn't have a snappy name yet.

  Here is the precise carve-out you asked for, distinguishing it from adjacent concepts, and a proposed label if you need to coin one.

  ### The Established Closest Fit: **Institutional Decoupling**
  In sociology (Meyer & Rowan, 1977), **decoupling** occurs when an organization maintains a "myth" (formal justification/structure) for legitimacy, while its actual practices drift to solve immediate problems.
  *   **Match:** The "myth" is the original justification (preventing wild claims). The "practice" is the new equilibrium (politeness). The myth is kept because it provides **legitimacy** (legibility) to the group.
  *   **Mismatch:** Classical decoupling often implies actors know the myth is ceremonial. Your observation specifies that defenders *sincerely believe* the old justification. This suggests the decoupling is cognitive, not just strategic.

  ### The Precise Carve-Out: **Ancestral Justification Equilibrium**
  If you need a term that fits the rationalist/game-theoretic lexicon better, this configuration is best defined as an **Ancestral Justification Equilibrium**.

  **Definition:** A stable normative equilibrium where:
  1.  **Behavioral Drift:** The actual behavioral requirements of the norm have shifted to solve a *different* coordination problem than the original.
  2.  **Justification Stasis:** The stated rationale for the norm remains anchored to the *original* problem.
  3.  **Sincere Obsolescence:** Enforcers genuinely believe the original justification is still the primary driver, despite evidence that the original problem is negligible.

  ### Boundary Conditions (The Edges)
  To ensure this concept is distinct, here is how it differs from the adjacent failure modes you mentioned:

  | Concept | Behavioral Equilibrium | Stated Justification | Actor Belief | Key Difference |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ancestral Justification Equilibrium** | **Shifted** (solves new problem) | **Static** (cites old problem) | **Sincere** (believe old reason) | **The justification is a fossil; the norm is alive but repurposed.** |
  | **Concept Creep** | Shifted (expands scope) | Updates (often implicitly) | Sincere | In creep, the definition *itself* expands. Here, the definition stays technically static, but the *application* drifts while the *story* stays fixed. |
  | **New Convention** | Shifted | **Updates** (cites new problem) | Sincere | A healthy evolution. The "story" patches to match the "code." |
  | **Hypocrisy** | Shifted | Static (cites old problem) | **Insincere** (know old reason is false) | Hypocrites know the justification is a cover. Your observers genuinely think the old threat exists. |
  | **Cargo Cult Rationality** | Static (mimics form) | Static | Sincere | In Cargo Culting, the *behavior* loses its function entirely. Here, the behavior *gains* a new function (politeness), making it robust, not empty. |
  | **Institutional Decoupling** | Shifted/Ignored | Static | Mixed (often cynical) | Decoupling usually implies the rule is *ceremonial*. Here, the rule is *actively enforced*, just for the wrong stated reason. |

  ### Why This Configuration Persists (The Mechanism)
  You asked about the edges, but the *why* helps define the concept. This equilibrium persists due to **Legibility Costs**.

  1.  **Schelling Point Friction:** The original justification ("Epistemic Humility") is a high-fidelity Schelling point. It is legible, virtuous, and easy to signal.
  2.  **Re-coordination Cost:** To update the justification to the *actual* function ("Politeness"), the community would have to openly admit that "Truth-Seeking" is no longer the primary constraint. This lowers the perceived status of the norm.
  3.  **Legitimacy Anchor:** The old justification acts as a **Legibility Anchor**. It allows the group to maintain the *appearance* of high-truth-seeking while actually optimizing for social harmony. Updating the justification would require a costly renegotiation of the group's identity.

  ### Recommendation
  If you are writing about this or discussing it in that specific milieu:
  *   **Use:** **"Institutional Decoupling"** if talking to sociologists or general academics.
  *   **Use:** **"Cached Justification"** or **"Normative Fossilization"** if talking to rationalists.
  *   **Coin:** **"Ancestral Justification Equilibrium"** if you need to be technically precise about the game-theoretic state (stable behavior + outdated belief).

  The specific failure mode isn't that the norm died (it didn't); it's that the **map (justification) no longer matches the territory (function), yet the group refuses to update the map because the map itself is a coordination tool.**
