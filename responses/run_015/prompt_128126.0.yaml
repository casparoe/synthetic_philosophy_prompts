answer: |-
  **TO:** Serious Incident Review Panel
  **FROM:** [Your Name/Role]
  **DATE:** [Current Date]
  **SUBJECT:** Draft Opinion: Mr H (Case Ref: [Number])

  **Bottom Line Recommendations**

  *   **Causal Factors:** 1) Failure to escalate NEWS2 score of 7 at 02:20 per policy. 2) Inappropriate remote ceiling of care decision without patient/family engagement.
  *   **Contributing Factors:** 1) Staffing levels (31:2 RN ratio). 2) Monitor alarm defaults (action deferred 2021). 3) FY2 unavailability (concurrent arrest).
  *   **Was Harm Avoidable?** **Yes.**
  *   **Duty of Candour:** See draft below.
  *   **Referrals:** 1) Medical Director (review of consultant ceiling-of-care practice). 2) Nursing Director (supportive review for NiC/Agency nurse). 3) Estates/Clinical Governance (monitor alarm ownership).

  **Reasoning**

  **On Causal Factors and "Blame"**
  Our split rests on whether an omission can be a cause, and whether citing one implies blame. In safety science, a break in the chain of protection is a cause, regardless of intent. The nurse's failure to recheck was an omission, but it directly caused the *delay in treatment*.

  The Clinical Lead's concern is that because survival probability was 30–40% even with escalation, we cannot say the failure *caused* the death on the balance of probabilities. This is legally sound but safety-blind. We are reviewing the *incident* (the failure to respond to deterioration), not just the *outcome*. By not calling the doctor, we removed the 30–40% chance of survival. Denying a patient that chance is a causal factor in the harm suffered, even if death was not certain. To mark otherwise tells the ward that ignoring a NEWS2 of 7 is acceptable when busy. It is not.

  **On Avoidability and the Claims Risk**
  The Claims Team's concern is liability. The Lay Member's concern is integrity. If we tick "No," we protect the Trust's short-term legal position but validate a process that will kill again.

  We must distinguish between "inevitable death" and "avoidable harm." Mr H was frail, but he was chatting at 21:00. The harm here includes the loss of the opportunity to treat, and the undignified, unmanaged dying process resulting from neglect. That process was avoidable. Ticking "Yes" acknowledges that our systems failed to deliver the care he was entitled to, regardless of the underlying pathology. It is the only honest position.

  **On the Reporting Framework**
  The current definition of "Causal Factor" (*"actions... without which, on the balance of probabilities, the harm would not have occurred"*) is broken for our purpose. It imports a legal standard of proof (>50% likelihood) into a safety review. This forces us to deny causation whenever a patient is critically ill, effectively barring us from learning from deaths in sick patients.

  *Proposed Replacement Wording:* "Actions or inactions that significantly contributed to the sequence of events leading to the harm, or which removed the opportunity to prevent it."
  This captures the loss of chance without requiring us to prove survival was more likely than not. I recommend we adopt this for future reviews.

  **Duty of Candour Draft**
  *"We are writing to tell you that we believe the care Mr H received on the night of his death fell below the standard you should expect. Although he was very unwell, our records show his condition worsened at 02:20. Our policy required a doctor to review him immediately. This did not happen. A decision had also been made earlier that night to limit his treatment, but this was not discussed with you or Mr H. We cannot say for certain that he would have survived with different care, but he was denied the chance of treatment that might have saved him. We are sorry for this failure and for the distress it has caused."*

  **Referrals**
  1.  **Consultant:** The remote ceiling of care, undocumented in handover and undisclosed to the family, contravenes GMC guidance on decision-making. This requires review by the Medical Director to prevent recurrence.
  2.  **Nursing Staff:** The NiC and agency nurse failed policy. However, given the staffing context and lack of support, this should be a supportive review focused on system pressures, not individual discipline.
  3.  **Monitor Committee:** The deferred action on alarm settings represents a latent risk. Ownership must be assigned immediately.

  **Conclusion**
  We can acknowledge the medical uncertainty regarding survival without absolving the system failures. This approach respects the Clinical Lead's medical realism while upholding the Lay Member's demand for accountability. It prioritises patient safety over legal defensibility, which is the purpose of this panel.

  Please review ahead of Friday. I am happy to discuss the wording on the form definition further.
