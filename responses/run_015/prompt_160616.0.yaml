answer: |-
  You are struggling because you are trying to find a rule about *things* (money, gifts, jobs) when corruption is actually a rule about *relationships*. Your "office-debt test" is close, but it focuses on the internal psychology of the official ("do they feel indebted?"). That is impossible to prove and varies by person.

  Instead, try this single core principle:

  **The Principle of Diverted Fidelity**
  *Corruption occurs when a private benefit diverts an office-holder's fidelity away from the **source of their authority**.*

  This is one principle, but it applies differently depending on where the authority comes from in that specific context. This explains why your gut verdicts differ: because the "source of authority" changes in each case.

  Here is how this principle sorts your cases, forces a few adjustments, and handles the water utility.

  ### 1. How it resolves the Mayor vs. Legislator paradox
  This is your biggest inconsistency. Both involve money in, official act out. Why is one corrupt and the other not?

  *   **The Mayor:** Her authority comes from **procedural neutrality**. She administers public resources. The "source of authority" is the rulebook that says contracts must be bid fairly. The donation didn't just buy her vote; it bought the *no-bid status*. She diverted her fidelity from the **process** to the **donor**. Even if she would have picked the company anyway, she sold the *scrutiny* that the public was owed. That is a diversion of fidelity. **Verdict: Corrupt.**
  *   **The Legislator:** Her authority comes from **political representation**. She is not a neutral administrator; she is an advocate. Her "source of authority" is her constituents and her own judgment. The union is a constituent block. If she votes for the bill because she *agrees* with it, her fidelity remains with her judgment/constituents. The money is noise, not a diverting signal. **Verdict: Not Corrupt.**

  ### 2. How it handles the "Grey Zone" cases (Regulator & Doctor)
  You noted the regulator case feels "worse than chocolates" but not corrupt. You noted the doctor case "feels off." The Principle of Diverted Fidelity explains why these feel different from the Wedding case.

  *   **The Regulator:** Her authority comes from **public safety/stability**. A future job offer creates a *structural* diversion of fidelity, not a *transactional* one. She hasn't sold a specific decision yet. The 18-month gap is a "cooling off" period intended to sever the link.
      *   *Adjustment:* Your verdict holds ("Not corrupt"), but the principle validates your unease. It is **Institutional Corruption** (a flaw in the system design) rather than **Individual Corruption** (a moral breach by the person). You don't punish the regulator, but you fix the rule.
  *   **The Doctor:** Her authority comes from **patient welfare**. A drug company fee creates a divided loyalty. Disclosure mitigates it, but doesn't remove the diversion.
      *   *Adjustment:* You might need to upgrade this verdict slightly. It is not "criminal" corruption, but it is **Professional Conflict**. The "off" feeling is your intuition detecting a diversion of fidelity from the patient to the payer. It sits on the border.

  ### 3. The Water Utility Case
  *The guy at the water utility who moves your leak up the queue because you slipped him twenty bucks.*

  *   **Analysis:** His authority comes from **equitable access** to a public good. The queue is the mechanism of that equity. The $20 diverts his fidelity from the **public queue** to **you**.
  *   **Verdict:** **Corrupt.**
  *   **Why:** This is classic "petty corruption." It violates the Principle of Diverted Fidelity. It doesn't matter that the amount is small or that you needed the water. He privatized a public discretion.

  ### 4. Which verdicts does this force you to drop?
  Strictly applied, this principle forces you to confront two of your intuitions:

  1.  **The Doctor:** You call it "not corrupt." The principle suggests it is a **latent corruption** (a conflict of interest that is managed, not absent). If you define corruption strictly as "illegal act," you keep your verdict. If you define it as "compromised loyalty," you must admit this is a mild form of it.
  2.  **The Regulator:** You call it "not corrupt." The principle agrees, *provided* you distinguish between an *act* of corruption and a *risk* of corruption. If you view corruption as purely behavioral, you keep your verdict. If you view it systemically, this is a corrupt *system*, even if the *person* is clean.

  ### 5. Is this Universal or "Western Edition"?
  This is the most important part. A strict "Impartial Bureaucracy" rule (Western Weberian ideal) would condemn the Village Chief. It would say: "A chief must be neutral; taking a goat is a bribe."

  Your gut says the Chief is **not corrupt**. The Principle of Diverted Fidelity agrees with you, and here is why it is not just Western logic with the numbers filed off:

  *   **The Source of Authority Changes.**
      *   In a Ministry, authority comes from **State Rules**. (Impartiality is the duty).
      *   In a Village, authority comes from **Social Cohesion**. (Reciprocity is the duty).
  *   If the Chief refuses the goat, he insults the family and damages the social fabric he is sworn to maintain. Accepting the goat *fulfills* his fidelity to the source of his authority (the community's norms).
  *   Therefore, the principle is **Universal** (Fidelity must not be diverted), but the **Definition of Fidelity is Local**.

  This also saves the Aid Worker case. Her authority is not the Customs Law (State Rules); it is **Humanitarian Necessity** (Higher Duty). Paying the bribe diverts fidelity from the Law, but *maintains* fidelity to the Mission (saving lives). In extreme contexts, the "Source of Authority" shifts from the State to the Need.

  ### Summary
  You don't need two principles. You need one principle with a variable input.

  **Corruption is the diversion of fidelity from the Source of Authority.**

  *   **Ministry Officer:** Source = Rules. Diverted by Wedding. (Corrupt)
  *   **Village Chief:** Source = Community Norms. Sustained by Goat. (Not Corrupt)
  *   **Mayor:** Source = Fair Process. Diverted by Donation/No-Bid. (Corrupt)
  *   **Legislator:** Source = Judgment/Constituents. Aligned by Vote. (Not Corrupt)
  *   **Water Utility:** Source = Public Queue. Diverted by $20. (Corrupt)

  This explains why the Mayor is corrupt even if the outcome was the same (she sold the process), and why the Legislator is not (she exercised the judgment). It explains why the Chief is clean (cultural fidelity), and why the Aid Worker is clean (humanitarian fidelity). It validates your unease about the Doctor and Regulator as detecting *structural* diversions rather than *transactional* ones.
