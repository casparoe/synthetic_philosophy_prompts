      *   *Section 5: Normative Power.* This needs careful handling. Distinguish Natural vs. Artificial. Hume saves promising by making it conventional.
      *   *Section 6: Strongest Version & Breaks.* Where does Hume win? Where does he lose? (e.g., Does he prove too much? Can we will obligations in other contexts?)
      *   *Section 7: Rival Readings.* (1) The Error Theory reading (promising is a fiction). (2) The Convention reading (the standard view). (3) The Speech Act reading (anachronistic but helpful).

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate *Treatise* Book 3 with the *Enquiry*. Stick to *Treatise* 3.2.5.
      *   *Clarification:* Ensure the distinction between "willing the action" and "willing the obligation" is clear. One is about physics/movement, the other is about normativity.
      *   *Pufendorf Context:* Since they just read Pufendorf, acknowledge that Hume is directly responding to the "mental act" theory found in natural law jurisprudence.
      *   *Normative Power:* Be careful not to say Hume agrees with the friend. He agrees *only if* the power is constituted by social rules, not by nature.

  6.  **Final Polish:** Check against the prompt requirements.
