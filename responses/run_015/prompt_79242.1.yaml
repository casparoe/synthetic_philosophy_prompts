          1.  Why does ruling out resolution, desire, and willing the action lead *necessarily* to "willing the obligation"? Why not just conclude the whole idea is confused?
          2.  What is the absurdity regarding "change of obligation supposes change of sentiment"?
          3.  Is the argument circular (premise: no motive apart from duty)?
          4.  **Core Concern:** Does Hume's argument sink the "normative power" view (the friend's view), or is his target narrower (natural vs. conventional)?
      *   **Role:** Expert in Hume's moral philosophy and history of theories of promising.
      *   **Task:**
