answer: |-
  It is entirely understandable that this passage is giving you trouble. This is one of the densest, most technical, and most easily misread arguments in the *Treatise*. You are reading it in the right context (post-Pufendorf), because Hume is directly engaging with the Natural Law tradition you've just been studying. Pufendorf and his ilk argue that a promise is a "sign of a mental act" that naturally binds the will. Hume is trying to show that this metaphysical picture is psychologically incoherent.

  Per your request, I will hold off on evaluation and critique until we have the architecture of the argument clearly on the table.

  ### Part 1: The Structure of the Argument

  Hume is operating within a specific framework of moral psychology: Moral distinctions are derived from sentiment, and "obligation" is intelligible only insofar as it provides a motive to act. He is arguing against the "Natural Law" view that the utterance "I promise" is naturally binding because it expresses a specific, binding mental act.

  Here is the step-by-step reconstruction of the passage you cited, followed by the immediate sequel regarding sentiment.

  **Phase 1: The Search for the Mental Act**
  1.  **Premise 1:** Words are signs of mental acts. (When we speak, we express what is in the mind.)
  2.  **Premise 2:** If a promise creates a *natural* obligation, there must be a specific mental act expressed by the words "I promise" that generates this obligation.
  3.  **Premise 3:** We must identify what this mental act is. Hume proposes an exhaustive disjunction of candidates for this act:
      *   (A) A resolution to perform the action.
      *   (B) A desire to perform the action.
      *   (C) The willing of the action itself.
      *   (D) The willing of the *obligation* itself.
  4.  **Elimination of (A):** A resolution alone imposes no obligation. (I can resolve to quit smoking without being *obliged* to do so.)
  5.  **Elimination of (B):** We can promise without desire, or even with aversion. (I can promise to pay a debt I dread paying.)
  6.  **Elimination of (C):** The will influences only *present* actions. A promise regards a *future* action. Therefore, I cannot literally "will" the future action now.
  7.  **Intermediate Conclusion:** Since (A), (B), and (C) are eliminated, the mental act must be (D): **The willing of the obligation itself.**

  **Phase 2: The Impossibility of Willing an Obligation**
  8.  **Premise 4:** Obligation is not a metaphysical entity distinct from motivation; to be obliged is to be actuated by a sentiment or motive. (This is Hume's moral sentimentalism.)
  9.  **Premise 5:** A change in obligation implies a change in sentiment/motive. (To become newly obliged is to acquire a new motive.)
  10. **Premise 6:** The Will cannot create new sentiments or motives by fiat. (I cannot simply decide to feel a new passion or motive; motives arise from interests, passions, or conventions.)
  11. **Conclusion:** Therefore, it is impossible to will a new obligation into existence.
  12. **Final Conclusion:** There is no natural mental act that corresponds to promising. Therefore, the obligation of promises is not natural; it must be artificial (created by social convention).

  ***

  ### Part 2: Unpacking the "Magic Trick" and the Sentiment Claim

  Now that the structure is visible, let's address your specific sticking points.

  **1. Why "Willing the Obligation" and not "The Concept is Confused"?**
  You asked why ruling out resolution, desire, and willing the action leads *necessarily* to "willing the obligation," rather than just showing the whole idea is muddled.

  Hume is employing a *reductio ad absurdum* against the Natural Law theorist (like Pufendorf). He is temporarily accepting their premise: *"Assume there IS a mental act that makes the promise binding."*
  If you grant that premise, you must identify the act. Hume walks you through the taxonomy of mental acts.
  *   Is it a cognitive state (resolution)? No, those don't bind.
  *   Is it a passion (desire)? No, promises work without them.
  *   Is it a volition regarding the physics of the act (willing the action)? No, the will is present-tense only.

  If you insist there *is* a binding mental act, the *only* logical remainder is "willing the bindingness itself." Hume forces the opponent into this corner so he can strike the final blow: "Okay, you say it's willing the obligation? Well, *that's* impossible."
  He doesn't conclude "the concept is confused" yet because he wants to show *why* it is confused. The confusion lies specifically in thinking the Will has the power to create normativity ex nihilo.

  **2. "A change of the obligation supposes a change of the sentiment"**
  This is the crux of Hume's moral psychology. For Hume, "obligation" is not a magical glue that sticks to your soul. To say "I am obliged" is to say "I have a motive to act, and a spectator would approve of my acting."
  *   **The Absurdity:** If I can create an obligation just by saying "I promise" and willing it, I am claiming I can create a *motive* just by willing it.
  *   **The Point:** The Will is not a motive-generator. I can will to *move my hand*, but I cannot will to *want to move my hand* if I have no interest in doing so. If obligation is grounded in sentiment/motive, and the Will cannot manufacture sentiment, the Will cannot manufacture obligation.
  *   **Is it just that the will can't manufacture sentiments?** Yes, but there is a further point about the *kind* of thing obligation is. For Hume, obligation is a relation between an action and a feeling of approval/disapproval. You cannot change that relation by a solitary act of will any more than you can change the temperature of a room by wishing it were colder.

  **3. The Circularity Charge**
  Your group member claims the argument is circular because the premise "we have no motive to keep promises apart from a sense of duty" does all the work.
  *   **Verdict:** This is a strong reading, but perhaps uncharitable. It is true that Hume assumes Moral Sentimentalism (obligation = motive/sentiment). If you reject that framework (e.g., if you are a Rationalist who believes obligation is a relation of reason), Hume's argument doesn't touch you.
  *   **However,** within Hume's system, it isn't circular; it's foundational. The "window dressing" (the elimination of resolution/desire/willing action) is actually crucial. It shows that even if we *look* for a natural motive, we can't find one in the standard psychological categories. It blocks the escape route where someone might say, "Ah, but the resolution *is* the motive!" Hume says, "No, resolutions don't motivate unless there's a prior interest."
  *   So, the argument is valid *if* you accept Hume's moral psychology. It begs the question against a Rationalist, but it isn't internally circular.

  ***

  ### Part 3: The Normative Power Objection (Your Friend's View)

  This is the most philosophically live question. Your friend argues that promising is a **normative power**: a capacity to change normative relations (what is owed) by exercising it, similar to a judge sentencing a criminal or a legislature passing a law.

  **Does Hume sink this view?**
  **Short Answer:** No, but it requires a major modification that your friend might resist.

  **Long Answer:**
  Hume does *not* deny that we have the power to obligate ourselves. He denies that this power is **Natural**.
  *   **The Natural Law View (Pufendorf):** I have this power by virtue of being a rational agent. It exists in the State of Nature.
  *   **Hume's View:** I have this power only because society has constructed a convention that *treats* certain words as creating obligations.

  Think of it like a chess move. Moving a pawn two squares forward is a "power" to change the board state. But that power doesn't exist in nature; it exists only because we agree to play chess.
  *   If your friend says: "Promising is a normative power grounded in human rationality independent of social utility," **Hume destroys this view.** He argues that without the social convention (the "chess rules" of property and exchange), the words "I promise" are just noise and the mental act is unintelligible.
  *   If your friend says: "Promising is a normative power constituted by social practices," **Hume agrees with this.** In fact, Hume is the grandfather of this view. He argues that the "obligation" is real, but it is *artificial*.

  **The Critical Distinction:**
  Hume's argument targets the idea that the *utterance itself* triggers a metaphysical change via a *mental act*. He replaces this with the idea that the *utterance* triggers a social mechanism via a *convention*.
  So, Hume doesn't sink the "normative power" view; he sinks the "natural normative power" view. He saves the phenomenon of promising by relocating its source from the individual will to the social structure.

  ***

  ### Part 4: Strongest Version, Breaks, and Rival Readings

  Here is how I would assess the argument's strength and where it might fail.

  **The Strongest Version of Hume's Argument**
  The argument is strongest when read as a critique of **voluntarism**. It effectively demonstrates that you cannot bootstrap normativity out of thin air using only individual psychology. If obligation requires a motive, and motives require interests/passions, a solitary individual in a state of nature cannot obligate their future self merely by an act of will. This aligns with modern skepticism about "self-binding" without external enforcement or social context. It forces the proponent of promising to explain the *social infrastructure* that makes the promise work, rather than hiding behind a mysterious "mental act."

  **Where It Breaks (The Vulnerabilities)**
  1.  **The Exhaustive Disjunction:** Hume assumes the mental act must be a resolution, desire, willing an action, or willing an obligation. A contemporary speech-act theorist (like Searle) would argue Hume misses the category of **intentionality-in-action** or **illocutionary intent**. The act isn't "willing an obligation"; it's "invoking a rule." Hume might reply that invoking a rule presupposes the convention, which proves his point, but he doesn't fully engage with the logic of rule-following here.
  2.  **The Definition of Obligation:** Hume's argument hinges entirely on Obligation = Motive/Sentiment. If you hold a Rationalist view (Obligation = Rational Requirement), Premise 8 fails. You *can* be rationally required to do something even if you have no motivating sentiment. Hume has no argument against a Rationalist here other than asserting his own sentimentalism.
  3.  **Future Will:** Hume claims the will influences only present actions. This is psychologically debatable. We form intentions for the future all the time. While we can't *execute* them now, we can *commit* to them. Hume conflates "willing the action to happen now" with "willing that the action happen later."

  **Rival Readings to Brainstorm in Your Group**

  1.  **The Error Theory Reading:**
      *   *View:* Hume is actually saying promising is a fiction. We *think* there is a mental act, but there isn't. The obligation is an illusion sustained by social pressure.
      *   *Pros:* Fits Hume's skepticism.
      *   *Cons:* Hume clearly thinks promises *are* binding (artificially). He isn't abolishing morality, just naturalizing it.

  2.  **The Convention-Constitutive Reading (Standard):**
      *   *View:* The "mental act" is real, but its content is dependent on the convention. I *do* will an obligation, but I can only do so because the convention exists to give my will that content.
      *   *Pros:* Saves the phenomenology of promising (it feels like I'm doing something) while accepting Hume's social critique.
      *   *Cons:* Requires careful parsing of what "willing" means in a conventional context.

  3.  **The Signaling Reading:**
      *   *View:* The words "I promise" aren't expressing a mental act at all; they are a signal of reliability, like a peacock's tail. The "obligation" is just the expectation of punishment or loss of reputation if I fail.
      *   *Pros:* Very Humean (focus on utility and reputation).
      *   *Cons:* Reduces morality to prudence. Hume wants to save the *moral* obligation, not just the prudential one.

  **My Recommendation:**
  Commit to the **Convention-Constitutive Reading**. It respects the text (Hume says the virtue is artificial, not that it's fake) and it answers your friend. You can tell your friend: "Hume agrees you have a normative power, but he insists that power is like the power of a judge: it only exists because there is a court (society) that grants it. You don't have it by nature."

  This preserves the intuition that promising is special (it changes what is owed) without accepting the Natural Law metaphysics that Hume rightly dismantles.
