  Dear Colleague,

  Thank you for sharing the data from your pilot study. It is a fascinating set of verdicts, and it touches directly on some of the most persistent puzzles in value theory, particularly regarding the aggregation of badness and the structure of the better than relation. You have asked me to analyze your colleague's pattern of judgments to predict her verdict on the comparison between one minute of severe pain and two hours of mild pain, and to propose a further test case. In what follows, I will outline two principles that accommodate her existing verdicts but diverge on this new case, offer my best guess regarding which principle she is likely employing, and suggest a additional comparison that would help discriminate between these competing models.

  The first principle we might attribute to her is what we could call Transitive Aggregation. This view assumes that the better than relation is transitive and that pain badness can be modeled, at least roughly, as a function of intensity and duration that allows for trade-offs. Under this rule, her verdicts are treated as points on a consistent ordering. We know from her second verdict that one minute of severe pain is better than fifteen minutes of moderate pain, and from her fourth verdict that fifteen minutes of moderate pain is better than two hours of mild pain. If the better than relation is transitive, it follows necessarily that one minute of severe pain is better than two hours of mild pain. This principle fits all eight of her provided verdicts without contradiction, as there are no cycles in the data you have collected so far. It treats her judgments as local approximations of a global, coherent value structure.

  The second principle is what might be termed the Intransitive Spectrum View. This approach draws on the literature surrounding spectrum arguments, such as those discussed by Rachels and Temkin, where it is argued that the better than relation may fail to be transitive across qualitative shifts in intensity. On this view, your colleague's verdicts are locally consistent but do not commit her to global transitivity. She may accept trade-offs between adjacent intensities, such as severe versus moderate or moderate versus mild, while holding that non-adjacent intensities like severe and mild are governed by a different qualitative standard. While her existing data does not yet display a cycle, this rule allows for the possibility that she judges two hours of mild pain to be better than one minute of severe pain, despite the chain of judgments linking them through moderate pain. This would rely on the intuition that mild pain is qualitatively superior to severe pain in a way that overrides the transitive inference from the intermediate cases. This principle also fits all existing verdicts because intransitivity is only revealed when a cycle is completed, which has not yet happened in her responses.

  Regarding which rule she is actually running, my best guess is that she will say one minute of severe pain is better than two hours of mild pain, thereby adhering to the Transitive Aggregation principle. My reason for preferring this prediction stems from her background and the specific shape of her earlier verdicts. As a philosopher working in population ethics and the metaphysics of value, she is likely acutely aware of the theoretical costs of denying transitivity. While the transitivity of better than is genuinely contested among specialists, with figures like Larry Temkin arguing for intransitivity in spectrum cases and others like John Broome defending transitivity as a requirement of rationality, a pilot subject in a formal study often aims for coherence unless they are explicitly testing the limits of rationality. Furthermore, her seventh verdict indicates that she prefers one minute of severe pain over two days of very mild discomfort. If she is willing to endure severe pain rather than two days of very mild discomfort, and she considers two days of very mild discomfort worse than two hours of mild pain, consistency suggests she should also prefer one minute of severe pain over two hours of mild pain. To do otherwise would require her to endorse a fairly complex intransitive cycle involving very mild discomfort as well, which seems less likely for a subject attempting to provide considered verdicts in a pilot context.

  To most cleanly discriminate between these candidate rules in a future comparison, I propose you present her with a comparison between one minute of severe pain and thirty minutes of moderate pain. We already know from her second verdict that she finds one minute of severe pain better than fifteen minutes of moderate pain, and from her third verdict that she finds fifteen minutes of moderate pain better than thirty minutes of moderate pain. If she is following the Transitive Aggregation rule, she must conclude that one minute of severe pain is better than thirty minutes of moderate pain. However, if she is operating under the Intransitive Spectrum View, she might judge that thirty minutes of moderate pain crosses a threshold of endurance that makes it worse than one minute of severe pain, even though fifteen minutes was not. If she verdicts that thirty minutes of moderate pain is better than one minute of severe pain, she would complete a cycle where one minute of severe pain is better than fifteen minutes, fifteen is better than thirty, and thirty is better than one minute. This would provide strong evidence for the intransitive model and place her firmly within the camp of philosophers who argue that the better than relation is sensitive to qualitative shifts in a way that violates transitivity. This comparison isolates the transitive chain within the severe and moderate intensities without introducing the additional variable of mild pain, offering a sharper test of her commitment to consistency across duration increments within a single intensity shift.

  I hope this analysis proves useful as you finalize your study design. The shape of the disagreement in the literature is precisely about whether we should prioritize the formal constraint of transitivity or the intuitive pull of qualitative distinctions, and your colleague's data offers a rare empirical window into how a trained philosopher navigates that tension. Please feel free to reach out if you would like to discuss the implications of her response to this new comparison once you have it.

  Best wishes with the research.
