      *   *Mental State vs. Normative Power:* Consent usually requires a mental state (agreement). Normative power changes rights/duties regardless of state (like a promise or verdict). In institutional contexts, the *status* often overrides the *state*.
      *   *Consent vs. Waiver vs. Estoppel:*
          *   Consent: "I agree."
          *   Waiver: "I give up my right to object."
