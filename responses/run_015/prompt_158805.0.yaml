answer: |-
  Here is the analysis. I have spent time distinguishing the illocutionary force of the slogan from its procedural utility. I am going to be direct: the slogan "silence is consent" is almost always a category mistake, but it functions as a useful shorthand for a specific kind of normative forfeiture.

  ### Part 1: The Menu of Readings

  Here are the four distinct philosophical claims hiding in the slogan, ranked from trivial to metaphysically heavy.

  **1. The Evidential Reading (Trivial/Platitude)**
  *   **Claim:** In normal contexts, if someone doesn't object, it is reasonable to *infer* they don't mind.
  *   **Verdict:** **True but weak.** It is a heuristic about mental states, not a normative mechanism.
  *   **Does it get your colleague what he wants?** **No.** Evidence of consent is not consent. You can have strong evidence someone agreed (they smiled, they nodded) and still be wrong. In the email case, silence is terrible evidence; it is equally consistent with "I haven't seen this" or "I'm ignoring this."

  **2. The Procedural Reading (Defensible)**
  *   **Claim:** The group has a rule: "If condition X (silence) obtains, outcome Y (motion passes) follows." Silence is not the consent; silence is the *trigger* for a rule that bypasses the need for consent.
  *   **Verdict:** **True for institutions.** This is how parliamentary procedure works. It treats silence as a null input that defaults to 'pass'.
  *   **Does it get your colleague what he wants?** **No.** This only works if there is a *prior* agreed-upon rule governing the interaction. There is no standing rule in academia that "unanswered email regarding authorship implies agreement."

  **3. The Normative Forfeiture Reading (Defensible but limited)**
  *   **Claim:** You had a duty to speak (to protect your interests or the group's). By staying silent, you waived your right to complain later. This is closer to *estoppel* than consent.
  *   **Verdict:** **Context-dependent.** It requires a pre-existing obligation to monitor and speak.
  *   **Does it get your colleague what he wants?** **No.** You have no duty to monitor your inbox for authorship claims and reject them. You have no duty to protect him from the delusion that he is your co-author.

  **4. The Constitutive Reading (False/Incoherent)**
  *   **Claim:** The silence itself *is* the speech act of consenting. Like raising a paddle at an auction, the silence constitutes the transfer of normative power.
  *   **Verdict:** **False.** Consent requires a manifestation of will (a "yes"). Silence is the absence of manifestation. It can only count as consent if a *secondary convention* (Procedural Reading) interprets it as such. It cannot be a "performative" in the Austinian sense because performatives require uptake and convention, and silence lacks the positive content required to change normative statuses *unless* a rule already exists to interpret it.
  *   **Does it get your colleague what he wants?** **No.** This is magic thinking.

  ---

  ### Part 2: The Hard Cases (Mara, The Muted, The Email)

  You asked about the specific silences. They do not come out the same way.

  **1. Mara's Strategic Silence**
  *   **Analysis:** Mara's silence is *communicative*. She is communicating resignation. However, under the **Procedural Reading**, her internal state is irrelevant. If the rule is "no objections = passed," and she does not object, the motion passes.
  *   **The Problem:** Procedural rules rely on *fair opportunity* to object. If Mara believes objection is futile due to past history, the "fair opportunity" condition is degraded, but not necessarily broken. However, calling this "consent" is a lie. It is **acquiescence**.
  *   **Verdict:** She did not consent (mental state). She did not exercise a normative power (she didn't authorize the slot). But she is likely *bound* by the procedure if she remains a member of the consortium, provided the voting rules were clear. The Chair was procedurally correct but philosophically dishonest.

  **2. The Muted/Absent/Asleep**
  *   **Analysis:** These are cases of **non-communication**. There is no signal.
  *   **Verdict:** Treating these as "consent" is an administrative fiction. It is necessary for the consortium to function (you can't wait for everyone forever), but it is not consent. It is a **default assumption** ratified by the Charter. If the Charter says "unopposed motions carry," it implicitly defines "unopposed" as "no audible objection during the window."

  **3. The Email (Your Case)**
  *   **Analysis:** This fails the **Felicity Conditions** for any of the readings above.
      *   *Evidential:* Silence is ambiguous evidence.
      *   *Procedural:* No standing rule governs email authorship requests.
      *   *Forfeiture:* No duty to reply exists.
      *   *Constitutive:* No convention exists.
  *   **Verdict:** Your colleague is attempting to unilaterally impose a **Procedural Reading** on a context that lacks the procedure. He is trying to legislate a norm retroactively.

  ---

  ### Part 3: The Commitment

  Here is my position. I am distinguishing between *Consent* (affirmative agreement) and *Acquiescence* (failure to veto).

  **1. Did Mara consent?**
  *   **No.** She acquiesced. Consent requires a positive manifestation of will to align with the proposal. She explicitly withheld that. She submitted to the *authority of the Chair*, not the *content of the motion*.
  *   **Confidence:** High. This aligns with standard distinctions in normative power theory (e.g., Raz, Hurd). You cannot consent to X while believing X is wrong, unless you are authorizing an authority to decide for you. She authorized the procedure, not the slot.

  **2. Did you consent to the co-authorship?**
  *   **No.** Not even acquiescence. Acquiescence requires a context where an objection was expected and possible. In email, without a prior agreement on response times or default rules, silence is null.
  *   **Confidence:** Very High. This is standard in both philosophy of language and research ethics (ICMJE guidelines require active agreement on authorship).

  **3. What rule should you write into the Charter?**
  *   You need to separate **Routine Administration** from **Normative Commitment**.
  *   *Draft Language:* "Routine motions (scheduling, minor purchases under $X) carry if no objection is voiced during the meeting window. Silence in this context constitutes a **waiver of objection**, not affirmative consent. All matters involving intellectual property, budget over $X, or policy changes require **affirmative recorded consent** (vote or signed approval). Silence cannot constitute consent for these matters."
  *   *Why:* This codifies the **Procedural Reading** for low stakes and bans the **Constitutive Reading** for high stakes.

  **4. What do you say to your colleague?**
  *   Do not argue philosophy. Argue convention and ethics.
  *   *Script:* "In research collaboration, authorship requires affirmative agreement on contribution and manuscript content, per standard ethical guidelines. Silence is not a mechanism for transferring intellectual property rights or credit. I did not agree to this, and proceeding without my explicit confirmation would be a violation of consortium ethics. Please remove my name or submit a formal proposal for the committee to vote on."

  ---

  ### Part 4: Philosophical Defense & Meta-Commentary

  **Where I am Confident (Defendable in Print):**
  1.  **Silence is not a Performative:** I would defend the claim that silence cannot be an illocutionary act of *consenting* in the absence of a specific convention. Consent is a "world-to-word" direction of fit; silence has no word. It can only function via a "word-to-world" rule (the Charter). I am confident the Constitutive Reading is incoherent.
  2.  **The Email Case:** I am confident the colleague is wrong. The "duty to speak" required for estoppel does not arise in unsolicited requests. Most philosophers of social norms (e.g., Scanlonian contractualism) would agree that you cannot impose burdens on others via their inaction without prior agreement.

  **Where I am Guessing (Expect Disagreement):**
  1.  **Mara's Bindingness:** I expect some institutional theorists to argue that by remaining in the consortium, Mara *did* consent to the Chair's interpretation of the rules, even if flawed. They might argue her "exit option" makes her silence binding. I reject this because it ignores the power asymmetry, but it is a live debate in political obligation.
  2.  **The "Auction" Analogy:** Some speech act theorists argue that if a convention is strong enough (like an auction), silence *does* become constitutive. I am guessing that even in auctions, it is the *rule of the auction house* that does the work, not the silence itself. If the auctioneer says "Going once..." and you stay silent, you aren't consenting; the rule says "Silence = Bid." I lean hard on the rule doing the work, not the silence. Others might argue the distinction is semantic.

  **What Would Change My Mind:**
  *   If you showed me a Consortium Charter that explicitly stated: "Any member who fails to reply to an email within 7 days regarding consortium business is deemed to have affirmatively consented to the proposal," *and* showed me proof you signed it.
  *   Even then, I would argue this is a **Procedural Forfeiture** rule, not a **Consent** rule. It changes the *consequences* of silence, not the *nature* of silence. But practically, the outcome is the same.

  **Final Summary:**
  Your colleague is trying to use a **Procedural** shortcut to achieve a **Normative** end. He wants the benefit of your signature without the act of signing. The Chair used a **Procedural** shortcut to achieve an **Administrative** end, which is permissible but should not be mislabeled as consent.

  **Action:** Tell the colleague he is ethically in the wrong. Tell the Chair to stop using the word "consent" and start using "no objection." Update the Charter to reflect the difference.
