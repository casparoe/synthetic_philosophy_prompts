answer: |-
  This is one of the most common sticking points in 20th-century philosophy of language. Even seasoned scholars sometimes blur the line, but the distinction is crucial for understanding Quine's behaviorism.

  Here is the breakdown of the difference, using *gavagai*, and an explanation of why the "no fact of the matter" claim is ontological, not just epistemic.

  ### 1. The Setup: Radical Translation
  To understand both claims, we must remember Quine's constraints. The "Radical Translator" is a linguist encountering a completely unknown language (Jungle) with no dictionaries, no cognates, and no prior cultural knowledge. The **only** evidence available is the native's observable behavior in response to sensory stimuli (what Quine calls "stimulus meaning").

  ### 2. Inscrutability of Reference (The "Terms" Problem)
  **Claim:** We cannot determine what *object* a specific term refers to based solely on behavioral evidence.

  **The Gavagai Example:**
  A rabbit scurries by. The native shouts, "Gavagai!"
  You, the linguist, note this down. Your initial hypothesis is that *gavagai* means "rabbit."

  However, Quine points out that pointing to a rabbit is also pointing to:
  *   An undetached rabbit part.
  *   A temporal stage of a rabbit.
  *   The universal "rabbithood."
  *   The event of "rabbiting."

  All of these stimuli occur at the exact same time and place. The native's assent/dissent behavior will be identical for "rabbit" and "undetached rabbit part." Therefore, reference is **inscrutable**.

  **Why this is "weaker":**
  Inscrutability of reference is compatible with the idea that there **is** a fact of the matter about the *sentence*.
  Even if *gavagai* refers to "rabbit parts" rather than "rabbits," the sentence "Gavagai" is still true exactly when "Rabbit" is true. The truth conditions of the whole sentence remain stable even if the reference of the term is ambiguous. You can resolve inscrutability by adopting "analytical hypotheses" (rules of grammar) that force *gavagai* to function as a term for enduring objects.

  ### 3. Indeterminacy of Translation (The "Manual" Problem)
  **Claim:** There is no unique, correct translation manual between two languages. Multiple manuals can be constructed that are compatible with **all possible behavioral evidence**, yet contradict each other.

  **The Gavagai Example (Expanded):**
  Imagine two linguists, A and B.
  *   **Linguist A** creates a manual where *gavagai* = "rabbit."
  *   **Linguist B** creates a manual where *gavagai* = "undetached rabbit part."

  To make Manual B work, Linguist B must adjust the translation of *other* words (like particles, plurals, or identity markers) to compensate. For example, where English says "one rabbit," Manual B might translate it as "one integration of rabbit parts."

  Quine's radical claim is that if both manuals account for all past, present, and future observable behavior of the native, **there is no basis for saying one is right and the other is wrong.**

  **Why this is "stronger":**
  Inscrutability leaves the truth of sentences intact; Indeterminacy attacks the truth of the translation itself. It implies that "meaning" is not a fixed entity waiting to be discovered. It suggests that two translations can be logically incompatible (e.g., one says the native believes X, the other says the native believes Not-X) yet both be "correct."

  ### 4. The Crucial Question: "No Fact of the Matter"
  This is the specific point where your draft needs precision. You asked: *Is he claiming there's no fact of the matter, or just that we can never figure it out?*

  **Quine is making an Ontological claim, not an Epistemic one.**

  *   **Epistemic (Skepticism):** "There is a true meaning in the native's mind (or a Platonic realm), but because we are limited to behavior, we humans can never access it."
  *   **Ontological (Quine):** "There is no true meaning beyond the behavioral dispositions. If two manuals fit the behavior equally well, there is literally nothing else to check."

  **Why Quine takes this stance:**
  Quine is a behaviorist about meaning. For Quine, "meaning" is not a ghostly mental idea; it is defined entirely by public, observable stimuli and responses.
  1.  If meaning = behavioral disposition.
  2.  And Manual A and Manual B predict the exact same behavioral dispositions.
  3.  Then there is no difference in meaning between them.

  To say there is a "fact of the matter" that we can't know would require positing a "meaning" that exists independently of behavior (a mental proposition, a soul, a Platonic form). Quine rejects this as "the myth of the museum."

  **Analogy:**
  *   **Epistemic:** Imagine a card is face down. There is a fact of the matter (it's the King of Hearts), but you can't see it.
  *   **Quine's Indeterminacy:** Imagine asking, "Is the number 9 the number of planets?" In one context (math), yes. In another (astronomy), no. Quine argues translation is like this. There is no "card" underneath. The meaning *is* the use. If the use is compatible with two contradictory manuals, the contradiction is not in the world, but in our demand for a unique mapping.

  ### 5. Summary for Your Draft
  To clarify the conflation in your piece, you can structure the distinction like this:

  1.  **Scope:** Inscrutability applies to **terms** (reference); Indeterminacy applies to **sentences/manuals** (holistic meaning).
  2.  **Compatibility:** Inscrutability allows for a single true theory of the native's beliefs (we just can't pin down the objects). Indeterminacy denies there is a single true theory of the native's beliefs.
  3.  **Metaphysics:** Inscrutability is often read as an epistemic limitation (we can't isolate the object). Indeterminacy is an ontological claim (meaning itself is indeterminate).

  **The "Stronger" Claim:**
  Indeterminacy is more controversial because it undermines the concept of **propositional attitude**. If Indeterminacy is true, we cannot say "The native believes that it is raining" is objectively true or false independent of the translation manual we choose. This threatens not just linguistics, but psychology and the way we understand human rationality.

  **Final Tip for the Draft:**
  When discussing "no fact of the matter," explicitly contrast Quine with the **Underdetermination of Scientific Theory**.
  *   In physics, two theories might fit the data, but we assume the world is one way (there is a fact of the matter).
  *   In translation, Quine argues there is **no** "world of meanings" behind the behavior. The behavior is all there is.

  This distinction will show your readers you grasp the radical nature of Quine's behaviorism.
