          1.  *Common Knowledge:* Does the requirement for infinite levels of knowledge render the theorem useless for finite humans?
          2.  *Shared State Space:* Does the theorem fail when disagreements are about model structure/variables (frame disagreements) rather than probabilities within a fixed frame?
      *   **Requirements:**
          *   Write an essay.
          *   Decide something (give a verdict).
