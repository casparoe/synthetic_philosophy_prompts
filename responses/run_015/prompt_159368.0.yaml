answer: |-
  You are tracking something real. It is not a convention; it is a specific structure of human agency that most moral philosophy struggles to categorize because it breaks the standard model of "decision → action."

  The standard model assumes the motive and the act are neighbors in time. You feel hunger, you eat. You feel guilt, you confess. In your scenes, the motive is an ancestor of the act. The "goodness" isn't in the impulse to act; it's in the *fidelity* to a past decision.

  Here is the breakdown of the concept, the existing philosophical neighborhood, and a coined term to help you carve out the edges.

  ### 1. The Existing Neighborhood: Self-Binding
  The closest established concept is **Self-Binding** (often discussed via the "Ulysses Pact," named after Odysseus tying himself to the mast to resist the Sirens). This is when an agent restricts their future choices to prevent future weakness.

  However, standard self-binding is usually defensive. It's about stopping yourself from doing something *bad* (smoking, gambling, listening to Sirens). Your examples are more complex. Your surgeon isn't stopping herself from killing the patient; she's forcing herself to do something *uncomfortable* (confess) based on a standard she set when she was braver. Your thief isn't just resisting theft; he's executing a positive restitution protocol.

  The philosophical gap here is that Self-Binding is usually treated as a trick to bypass willpower. You are treating it as a *constitution* of character. You are arguing that the character's integrity lies in the *continuity* between the self who wrote the rule and the self who obeys it.

  ### 2. The Coined Term: Scaffolded Will
  Since existing terms don't capture the literary nuance you're after, let's call this **Scaffolded Will**.

  **Definition:** An action where the moral weight is carried not by the immediate impulse of the agent, but by a structural constraint (rule, relationship, or identity) erected by a prior version of that agent.

  **Why this fits:** A scaffold is temporary support used to build something permanent, or a structure that allows work to be done at height. In your cases, the "scaffold" is the rule/mentor/identity. It holds the weight of the decision so the present self doesn't have to generate it from scratch in a moment of crisis.

  ### 3. The Carving: Where the Edges Are
  You asked specifically about the variables that change the moral credit. Here is how *Scaffolded Will* distinguishes itself from nearby concepts like Habit, Compulsion, or Simple Virtue.

  **A. Foreseeability (Specific vs. General)**
  *   **Habit:** "I put the wallet back because I always do." (Unconscious).
  *   **Scaffolded Will:** "I put the wallet back because I wrote a rule eight months ago that covered this exact contingency."
  *   **The Edge:** If the Past Self foresaw the *exact* scenario, it reads as calculation. If the Past Self set a *general* principle ("I do not steal") that the Present Self applies to a new situation, it reads as integrity. Your thief example works because the rule was general ("if I feel the urge"), but the application was specific.
  *   **Credit:** Higher credit for General Scaffolding. It implies the Present Self is still doing some interpretive work.

  **B. The Origin of the Scaffold (Virtue vs. Fear)**
  *   **Virtue:** "I chose this mentor because I admire goodness."
  *   **Fear:** "I chose this mentor because I knew I was a coward." (Your surgeon).
  *   **The Edge:** This is the tragic edge of Scaffolded Will. The scaffold was built out of a deficit. The Present Self is being saved by the Past Self's honesty about their own weakness.
  *   **Credit:** This actually *increases* literary credit, even if it complicates moral credit. It makes the character human. A saint doesn't need a scaffold. A sinner trying to be good does. The credit lands on the *honesty of the Past Self* and the *obedience of the Present Self*.

  **C. Endorsement (Alignment vs. Alienation)**
  *   **Alignment:** "I am following this rule because I still agree with it."
  *   **Alienation:** "I am following this rule because I have to, even though I want to break it."
  *   **The Edge:** If the Present Self fully endorses the rule, it starts to look like normal Virtue. If the Present Self feels alienated from the rule but follows it anyway, it looks like Compulsion. *Scaffolded Will* lives in the middle: The Present Self might not *feel* like doing it, but they *recognize* the authority of the Past Self.
  *   **Credit:** If there is zero internal friction, it reads as "mechanical" (your editor's point). If there is too much friction, it reads as "reluctant duty." The sweet spot is **Fidelity**. The Present Self feels the weight of the promise.

  ### 4. Why Readers Call It "Mechanical"
  Your editor is reacting to a lack of **transmission**.

  In a standard moral scene, the energy flows from Emotion → Action. (Guilt → Confession).
  In your scenes, the energy flows from Memory → Structure → Action. (Memory of Rule → Adherence → Confession).

  If you don't show the *Memory* or the *Structure*, the Action looks like it came from nowhere. It looks robotic because the "motor" (the Past Self's decision) is off-page.

  Readers give credit only when they see the **chain of custody**. If they only see the handoff (the action), they assume the object (the virtue) was stolen or manufactured. They need to see the origin.

  **The Fix:** You don't need to dump backstory. You need to show the *pressure* of the scaffold.
  *   **Wrong:** She walked into his room. She had decided twenty years ago she would do this. She told him.
  *   **Right:** She walked into his room. The silence was heavy, but lighter than the other thing: the memory of Dr. Vance's voice, twenty years gone, asking her what kind of surgeon she intended to be when her hands shook. She wasn't doing this for the patient. She was doing it to keep a promise to a ghost.

  ### 5. Summary of the Concept
  **Scaffolded Will** is distinct because:
  1.  **Time:** The moral labor happened in the past; the present is just execution.
  2.  **Agency:** The Present Self is an agent of the Past Self.
  3.  **Credit:** Moral credit is split. The Past Self gets credit for Wisdom/Courage (setting the trap). The Present Self gets credit for Fidelity (springing it).

  If the Present Self would have done the wrong thing without the scaffold, the scaffold is essential. This doesn't diminish the act; it reclassifies it. It is not an act of *impulse*; it is an act of *maintenance*. You are maintaining the integrity of a self that spans decades.

  Your editor calls it mechanical because she is looking for heat. You are giving her architecture. Both are necessary. Show the architecture, but let the character feel the weight of the beams.
