  **MEMORANDUM**

  **TO:** All Guidance Counselors, Department Chairs, and Administrative Staff
  **FROM:** Dr. Aris Thorne, Deputy Superintendent of Curriculum
  **DATE:** October 24, 2023
  **SUBJECT:** Implementation of the Freshman Freeze Initiative

  It has come to the administration's attention that our current course selection process suffers from a significant ethical vulnerability. While we require ninth-grade students to file a four-year academic plan, we currently permit them to revise this plan as they progress through high school. This policy assumes that a student's preferences at seventeen are more valid than their preferences at fourteen. Bioethical standards regarding precedent autonomy suggest the opposite is true.

  When a patient creates an advance directive, we honor their competent past self over their incapacitated present self. We do not ask what a dementia patient wants now; we ask what they wanted before the illness. We must recognize that adolescence functions similarly. The fourteen-year-old entering high school possesses a clear view of the four-year arc. They are unburdened by the cortisol spikes of junior year, the social stratification of the cafeteria, or the fatigue that clouds judgment in later grades. The later student is not "evolving"; they are eroding. To allow a stressed seventeen-year-old to override the clear-eyed vision of their fourteen-year-old self is not freedom; it is abandonment.

  Therefore, effective immediately, we are instituting the "Freshman Freeze." The course plan filed in ninth grade will become a binding contract governing all subsequent coursework, extracurricular allocations, and college application trajectories. 

  We anticipate resistance from students who claim to have "changed their minds." Under the Freshman Freeze, a change of mind is not evidence of growth, but of compromised competence. A student wishing to deviate from their original plan must petition the Substituted Judgment Committee. This committee will not assess what is best for the student now, nor will they consider the student's current desires. Their sole mandate is to determine what the fourteen-year-old student *would have wanted* had they known about the current stressor. If the committee determines that the original plan reflects the student's true autonomy, the petition will be denied. We are protecting the student from their own temporary weakness.

  To support this, we will introduce the "Ulysses Addendum" during ninth-grade orientation. Named for the sailor who bound himself to the mast to resist the Sirens, this addendum allows students to pre-authorize the administration to disregard any future requests to revise their plan. It is a tool of empowerment. By signing it, the freshman acknowledges that their future self may be too weary or influenced to make rational choices and grants us the authority to hold them to their original promise.

  Some staff have expressed concern about student morale. This misunderstands the goal. Morale is transient; integrity is permanent. If a student signed up for four years of Latin and now wishes to drop it for Ceramics, honoring that request would be unethical. It would privilege a whim born of social pressure over a considered life strategy.

  Finally, to ensure full compliance, we must address the college application process. Currently, seniors sign their own applications. This is redundant. If the Freshman Freeze is valid, the fourteen-year-old self is the only competent agent authorized to determine the student's future. Consequently, starting this cycle, the Guidance Office will submit college applications automatically based on the data in the ninth-grade plan. Senior signatures will no longer be required. To ask the senior to sign would be to invite a compromised agent to veto the decisions of a competent one. We owe it to our students to protect their past selves from their future failures.

  Please update your handbooks accordingly.
