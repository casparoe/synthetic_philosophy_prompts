      *   *Case 4:* Reference Class/Specific Evidence. Population chance is overridden by specific evidence. This suggests Thorne treats specific causal evidence as *admissible* evidence that trumps the general chance, or he views the population chance as not the *relevant* objective chance for the individual.
      *   *Synthesis:* Thorne seems to adhere to a strict view of **Admissibility**. He follows PP unless the evidence directly undermines the chance claim (Case 3) or provides specific causal information about the outcome that renders the general chance irrelevant (Case 4). In Case 2, the evidence was about the *observer*, not the event, so it was inadmissible.
      *   *The Conflict:* In the Meteorology case, we have two *competing* chance claims based on scale. $Ch_{global}(Rain) = 0.75$ and $Ch_{local}(Rain) = 0.35$. Both are "sound." This is a conflict of *which chance function applies*.
