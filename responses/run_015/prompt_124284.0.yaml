      *   *Literature Check:* Lewis (1980) "A Subjectivist's Guide to Objective Chance". Hall (1994) "Two Mistakes about Credence and Chance". Ismael (2008) "Rational Credence and the Principal Principle". The "admissibility" criterion is the main battleground.

