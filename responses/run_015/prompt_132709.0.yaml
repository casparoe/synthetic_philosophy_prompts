prompt: |-
  Before I evaluate any particular framework for future-tensed statements—whether an Aristotelian open-future denial of bivalence, an Ockhamist true-future semantics, or a thin-red-line determinist model of actualization—I want the adequacy conditions laid out first. Write the desiderata that a theory of future contingency must satisfy to address the sea-battle problem without collapsing into fatalism or violating core logical principles. For each requirement, provide the motivating case or conceptual distinction behind it: how the theory treats the asymmetry between past fixity and future openness; whether it allows present-tense reports about tomorrow to obey the law of non-contradictory identity; what truth-status, if any, attaches to "there will be a sea battle" at the moment of utterance; and how retrospective attributions of truth are handled once the event is fixed. Mark which desiderata are non-negotiable—such as consistency with modal logic and preservation of diachronic identity conditions for propositions—and which reflect camp-specific preferences like determinism or a privileged present. Identify any subset that appears jointly unsatisfiable, particularly tensions involving bivalence, determinism, and retroactive truth-making. Then, briefly, indicate how the Aristotelian, Ockhamist, and thin-red-line approaches fare against the non-negotiable items. Keep the weight on the criteria and their internal tensions rather than on a comprehensive scorecard.
