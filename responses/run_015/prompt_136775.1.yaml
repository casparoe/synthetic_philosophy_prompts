      *   *Ambiguity (Structural):* Not necessarily. The data might not address the structural unknown (e.g., long-term side effects, applicability to comorbidities).
      *   *Let's go with the "Second Source" check.*
      *   If I bet on Protocol B and a Coin Flip (independent).
