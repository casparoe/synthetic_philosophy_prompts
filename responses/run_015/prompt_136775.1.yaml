answer: |-
  ### Seminar Plan: Risk, Ambiguity, and the Triage Committee

  **Target:** 12 Master's Philosophy Students (Basic Probability, No Decision Theory)
  **Duration:** 90 Minutes
  **Core Concept:** The Ellsberg Paradox (Risk vs. Ambiguity) via Medical Triage

  ---

  ### I. Pedagogical Preamble: Why Avoid the Urn?
  **The Pre-requisite Idea:** Before presenting the scenario, you must establish that **probability assignments require a model of the generator**, not just a measure of belief.
  *   **Why defer the urn:** The classic urn (30 red, 60 black/yellow unknown) suggests physical randomness where a "true" frequency exists but is hidden from the agent. This invites the "hidden parameter" misconception (i.e., "Ambiguity is just Risk with a wide prior").
  *   **The Medical Advantage:** A novel medical protocol involves *structural uncertainty*. The uncertainty isn't just about the success rate ($\theta$); it is about whether the biological model used to estimate $\theta$ applies to the specific patient population. This makes ambiguity feel like a property of the *world-model*, not just the agent's ignorance.

  ---

  ### II. Session Arc (90 Minutes)

  #### 1. Conceptual Grounding: Risk vs. Ambiguity (0–15 mins)
  *   **Activity:** Define the terms without math.
      *   **Risk:** The probability distribution is a known object (e.g., a fair die).
      *   **Ambiguity (Knightian Uncertainty):** The probability distribution itself is unknown or contested (e.g., a die that might be weighted, might be two-sided, or might change shape).
  *   **Misconception Alert:** Students will claim, "I can just assign a subjective probability to the ambiguous option."
  *   **Intervention:** Accept this move temporarily but label it "collapsing ambiguity into risk." Tell them the session's goal is to test whether that collapse is descriptively accurate or normatively permissible.

  #### 2. The Triage Scenario Setup (15–35 mins)
  *   **The Context:** A hospital committee must allocate a scarce resource to one of two treatment protocols for a critical condition.
  *   **Protocol A (Risk):** "Standard Care." Decades of data. Success rate is a known distribution (e.g., Beta(50, 50), mean 50%, known variance). The mechanism is understood.
  *   **Protocol B (Ambiguity):** "Novel Gene Therapy." Same *point-estimate* efficacy (50% mean survival based on animal models). However, the *reliability* of this estimate is unknown. There is no long-run data on failure modes, population heterogeneity, or long-term stability.
  *   **Crucial Design Feature:** Explicitly state that **more data is not immediately available**. The decision is for *today's* patients. The ambiguity is structural (we don't know if the animal model maps to humans), not merely statistical (we haven't counted enough humans yet).
  *   **Misconception Alert:** "Wait for more trials."
  *   **Intervention:** Stipulate a "decide now" constraint. The cost of delay is death. This forces the evaluation of the uncertainty *as it stands*.

  #### 3. The Preference Reversal (35–55 mins)
  *   **The Choice Pair:** Present two distinct decision frames for the *same* underlying probabilities.
      *   **Frame 1 (Gain):** Choose a protocol to **maximize survival**.
          *   Option A: Known 50% survival.
          *   Option B: Unknown survival (mean 50%).
          *   *Typical Choice:* A (Ambiguity Aversion).
      *   **Frame 2 (Loss):** Choose a protocol to **minimize mortality**.
          *   Option A: Known 50% mortality.
          *   Option B: Unknown mortality (mean 50%).
          *   *Typical Choice:* A (Ambiguity Aversion).
  *   **The Conflict:** Point out that Mortality = 1 − Survival.
      *   If you prefer A in Frame 1, you imply $P(Survival_A) > P(Survival_B)$.
      *   If you prefer A in Frame 2, you imply $P(Mortality_A) > P(Mortality_B) \rightarrow (1 - P(Survival_A)) > (1 - P(Survival_B)) \rightarrow P(Survival_B) > P(Survival_A)$.
      *   **Result:** You cannot hold both preferences consistently if you assume a single subjective probability for Protocol B.
  *   **Misconception Alert:** "I just distrust Protocol B more in both cases."
  *   **Intervention:** Show the algebra on the board. If they distrust B in the gain frame, they must *trust* B in the loss frame (because B's unknown survival implies unknown mortality). Preferring the Known in *both* frames violates the additivity of probability ($P(E) + P(\neg E) = 1$).

  #### 4. Formal Diagnosis: The SEU Violation (55–70 mins)
  *   **Concept:** Subjective Expected Utility (SEU) requires a **Single Prior**.
  *   **Explanation:** To maximize expected utility, you must act *as if* you have a specific number for Protocol B's success rate (e.g., 0.5). If you act as if it is 0.5, you should be indifferent between A and B. If you prefer A, you are acting as if the rate is $<0.5$. But if you also prefer A in the mortality frame, you are acting as if the rate is $>0.5$.
  *   **Conclusion:** The behavior is inconsistent with *any* single probability assignment. It requires a set of probabilities (multiple priors) or a non-additive measure.
  *   **Misconception Alert:** "This is just irrational math."
  *   **Intervention:** Clarify that SEU is a *model* of rationality. The students have demonstrated that the model does not fit the intuition. The question is whether to fix the intuition or the model.

  #### 5. Normative Interpretation (70–80 mins)
  *   **The Pivot:** Move from "What did they do?" to "What should they do?"
  *   **View 1 (Bayesian/SEU):** Ambiguity aversion is a cognitive bias (dynamic inconsistency). A rational agent should assign a prior and stick to it.
  *   **View 2 (Robustness/MaxMin):** Ambiguity aversion is rational prudence. When the model is contested, maximizing the minimum outcome (Gilboa-Schmeidler intuition) is defensible.
  *   **Crucial Distinction:** Do not endorse one view. Present View 1 as the "Coherence" argument and View 2 as the "Robustness" argument.
  *   **Misconception Alert:** "Ambiguity aversion is definitely rational because it's cautious."
  *   **Intervention:** Remind them that excessive caution in Frame 1 forces excessive risk-taking in Frame 2 (due to the reversal). You cannot be "cautious" about everything without violating logic.

  #### 6. Diagnostic Check (80–90 mins)
  *   **The Task:** Distribute a slip of paper with the following scenario:
      > "Suppose the hospital decides to run a pilot study on Protocol B *after* the triage decision is made. The results will be published in one year.
      >
      > **Question:** Does the existence of this future data resolve the ambiguity you felt during the triage decision? Why or why not?"
  *   **Assessment Criteria:**
      *   **Fail (Hidden Probability View):** "Yes, once we have the data, we will know the true success rate, so it becomes risk." (Treats ambiguity as temporary ignorance of a fixed parameter).
      *   **Pass (Model Uncertainty View):** "No, the pilot data might not resolve the structural uncertainty (e.g., long-term failure modes or applicability to different comorbidities). The ambiguity is about the *validity of the model*, not just the parameter value."
  *   **Debrief:** Use the responses to show that ambiguity is often about the *stability* of the probability assignment, not just its precision.

  ---

  ### III. What to Leave Out (Explicit Exclusions)
  To keep this accessible for non-specialists within 90 minutes, explicitly exclude:
  1.  **Savage Axioms Formalism:** Do not write out the Sure Thing Principle or Independence Axiom formally. Use the "Single Prior" intuition instead.
  2.  **Smooth Ambiguity Model (Klibanoff et al.):** This requires second-order probabilities which will confuse the basic risk/ambiguity distinction.
  3.  **Specific Experimental Literature:** Do not cite specific percentages from Ellsberg's original experiments or neuroeconomic studies. Stick to the logical structure.
  4.  **Dynamic Consistency Debates:** Do not enter the rabbit hole of whether ambiguity aversion leads to money pumps over time.

  ---

  ### IV. Settled vs. Contested (Instructor Guide)
  *Use this key to ensure you do not present contested views as consensus.*

  | Topic | **Settled Consensus** (Teach as Fact) | **Genuinely Contested** (Teach as Debate) |
  | :--- | :--- | :--- |
  | **Descriptive** | Humans systematically violate SEU in Ellsberg-type choices. | *None.* This is an empirical fact. |
  | **Formal** | SEU theory cannot represent ambiguity aversion without modification (e.g., multiple priors). | *None.* This is a mathematical theorem. |
  | **Normative** | *None.* | Is ambiguity aversion **rational**? <br>1. **Bias View:** It violates coherence/dynamic consistency.<br>2. **Prudence View:** It is a rational response to model uncertainty/robustness. |
  | **Ontological** | *None.* | Is ambiguity **objective** (a feature of the world) or **subjective** (a feature of the agent's information state)? |

  **Instruction:** When discussing the "Normative" section, explicitly state: *"Philosophers and economists disagree on whether this preference is a mistake or a sophisticated form of rationality. Here are the arguments for both sides."*

  ---

  ### V. Managing the "Hidden Parameter" Misconception
  This is the highest risk point in the seminar. Students will constantly try to solve ambiguity by saying, "I just assign a probability of 0.5 to Protocol B."

  **Where to head it off:**
  1.  **In the Setup (Min 20):** When introducing Protocol B, explicitly say: "The uncertainty is not about the number; it is about whether the number *means* the same thing tomorrow as it does today."
  2.  **In the Reversal (Min 45):** When showing the contradiction, emphasize: "You are welcome to assign 0.5. But if you do, you must be indifferent between A and B. If you are not indifferent, your actions prove you do not *actually* believe it is 0.5 in the way required by SEU."
  3.  **In the Check (Min 85):** The diagnostic question is designed specifically to catch students who revert to this view. If they say "data fixes it," they have reduced ambiguity to risk. Correct them by distinguishing *parameter uncertainty* (Risk/Bayesian) from *model uncertainty* (Ambiguity).
