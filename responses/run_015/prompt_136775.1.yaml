          *   *Better Idea:* Ask them to price a bet on an event that is independent of the ambiguous source but correlated with the *knowledge* of the source.
          *   *Best Idea (Simple):* The "Two-Stage" check. If I resolve the ambiguity *after* the bet is placed but *before* the outcome, does the value change? (Informational value vs. Ambiguity resolution).
          *   *Actually, let's look at the prompt:* "Distinguishes students who understand ambiguity as model-uncertainty from those who still think of it as hidden probabilities."
          *   *Check:* Ask about the *source* of the uncertainty. If they say "we need a larger sample size to find the true rate," they fail. If they say "the sample size doesn't help because the mechanism might change the rate dynamically," they pass.

      *   **What to Leave Out:**
          *   Savage Axioms details.
          *   MaxMin Expected Utility (Gilboa-Schmeidler) formalism (just mention the intuition).
          *   Smooth Ambiguity (Klibanoff et al.).
          *   Neuroeconomics/Experimental specifics.

  4.  **Refining the "Settled vs. Contested" Requirement:**
      *   I need to explicitly tag sections or add a summary note distinguishing these.
      *   Settled: SEU violation. Descriptive reality of the behavior.
      *   Contested: Normative status (Rational vs. Bias).

  5.  **Refining the Scenario (Hospital Triage):**
      *   To make it Ellsberg-like, I need two choices that create the contradiction.
      *   *Choice 1:* Protocol A (Known 50% survival) vs. Protocol B (Unknown survival, estimated 50%).
      *   *Choice 2:* Protocol A (Known 50% mortality) vs. Protocol B (Unknown mortality, estimated 50%).
      *   If I prefer A in both, I am ambiguity averse.
      *   *Wait, is mortality just 1-survival?* Yes. So if I prefer Known-Survival over Unknown-Survival, I should prefer Unknown-Mortality over Known-Mortality (since Unknown-Mortality = Unknown-Survival complement).
      *   If I prefer Known in *both* cases, I violate additivity.
      *   *Correction:* In Ellsberg, you prefer Known-Red over Unknown-Red, and Known-Black over Unknown-Black. Since Red and Black are complements in the ambiguous urn, this violates $P(Red) + P(Black) = 1$.
      *   *Medical Mapping:*
          *   Option 1: Save Patient Type X (Known success rate 50%) vs. Save Patient Type Y (Unknown success rate, mean 50%).
          *   Option 2: Save Patient Type X (Known failure rate 50%) vs. Save Patient Type Y (Unknown failure rate, mean 50%).
          *   Actually, simpler:
          *   Bet 1: Win if Patient Survives. Choose Known (A) or Unknown (B).
          *   Bet 2: Win if Patient Dies. Choose Known (A) or Unknown (B).
          *   If you choose A in both, you violate SEU.

  6.  **Review against Constraints:**
      *   90 mins? Yes, timing looks tight but workable.
      *   12 students? Allows for discussion.
      *   No formal decision theory background? Keep math minimal (algebra only).
      *   Avoid urns? Yes, using medical.
      *   Misconceptions identified? Yes.
      *   Check included? Yes.
      *   Settled/Contested distinguished? Yes.
      *   What to leave out? Yes.

  7.  **Final Polish:**
      *   Ensure the tone is pedagogical but rigorous.
      *   Make sure the "Why avoid urns" section is clear (physical randomness vs. structural uncertainty).
      *   Ensure the "Check" is diagnostic.

      *(Self-Correction during drafting)*: I need to be careful not to imply the medical scenario *is* the Ellsberg paradox exactly, but an *instantiation* of the logical structure. The prompt asks to use the scenario *rather than* the urn. I must ensure the logic holds.
      *   *Risk:* Probability distribution is a known object.
      *   *Ambiguity:* Probability distribution is not a known object (multiple priors or no prior).
      *   *Medical:* Protocol A (Risk) = Decades of RCTs, variance known. Protocol B (Ambiguity) = Novel mechanism, animal models only, human response distribution unknown (not just the mean, the shape/reliability).
      *   *The Reversal:*
          *   Decision 1: Maximize Survival. (Pick A).
          *   Decision 2: Minimize Mortality. (Pick A).
          *   Since Mortality = 1 - Survival, picking A in both implies $P(Survival_A) > P(Survival_B)$ AND $P(Mortality_A) > P(Mortality_B) \rightarrow (1-P(Survival_A)) > (1-P(Survival_B)) \rightarrow P(Survival_B) > P(Survival_A)$. Contradiction.

      *(Refining the Check)*: The prompt asks for a check distinguishing "model uncertainty" from "hidden probabilities."
      *   *Hidden Probability view:* "If we knew the true parameter, ambiguity disappears."
      *   *Model Uncertainty view:* "There is no single true parameter; the model itself is contested."
      *   *Question:* "Suppose a god tells you the true success rate of Protocol B is 50%. Does the ambiguity vanish?"
      *   *Correct Answer (Model Uncertainty):* No, because the *stability* or *applicability* of that rate to *this* patient is still unknown (structural).
      *   *Incorrect Answer (Hidden Probability):* Yes, now we know $p=0.5$, so it's risk.
      *   *Wait, if the god tells you the true objective chance, it becomes risk by definition.*
      *   *Better Check:* Focus on *learning*.
      *   *Question:* "We treat 10 patients with Protocol B. We observe 5 successes. Does the ambiguity reduce proportionally?"
