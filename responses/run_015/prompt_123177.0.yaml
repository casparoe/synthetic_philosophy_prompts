prompt: |-
  I am preparing questions for a podcast interview with a philosopher who defends domain-restricted steadfastness about peer disagreement. She maintains that conciliationism is appropriate for empirical disputes, but that steadfastness is warranted in normative domains where peers share identical evidence yet weight incommensurable values differently. Please draft eight to ten questions that move well beyond restating this position. I want at least one pressing how she avoids the standard symmetry objection when both peers are equally rational and informed; at least one asking whether her distinction between evidential disagreement and value-weighting disagreement survives disputes like climate-policy disagreements among equally credentialed scientists with different risk tolerances; and at least one probing whether her view ultimately collapses into a disguised conciliationism once we allow that value-weighting is itself often evidentially sensitive. For each of these three, include a follow-up keyed to the answer she is most likely to offer. Write everything as continuous prose without headings, bullet points, bold text, or tables, in the manner of a single letter.
