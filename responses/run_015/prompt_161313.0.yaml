answer: |-
  This is a profound dilemma that sits at the intersection of public policy, welfare economics, and political philosophy. You have identified a tension that most planning boards gloss over: the difference between a policy that *appears* to make no one worse off (the training session's claim) and a policy that is *robustly* good across different ways of measuring value (your colleague's "safe improvement").

  Here is an analysis of what your board's practice presupposes, why it fails the "safe improvement" test, and what a more robust approach would look like.

  ### 1. What the Exemption Practice Presupposes

  Your board's use of grandfathering is not a pure Pareto improvement. A strict Pareto improvement requires that *no one* is made worse off. By exempting existing buildings from energy and stormwater codes, you are implicitly accepting that:
  *   **Tenants** in those buildings will continue to pay higher utility bills than necessary.
  *   **Neighbors** will continue to face higher stormwater runoff risks than the new code would mitigate.
  *   **Future Residents** will inherit less efficient housing stock.

  Therefore, the practice presupposes a specific **moral weighting of welfare**. It assumes that the *current owner's financial reliance* on the old rules outweighs the *tenant's ongoing operating costs* and the *public's environmental interest*.

  It relies on three specific normative claims:
  1.  **The Reliance Principle:** It is inherently unfair to change the rules after an investment has been made. The "harm" of compliance costs is morally heavier than the "harm" of missed efficiency gains.
  2.  **The Status Quo Baseline:** The pre-reform state is the moral baseline. Deviating from it requires justification, but maintaining it does not.
  3.  **Owner Sovereignty:** The welfare metric that matters most is the identifiable current owner's balance sheet, not the aggregate social welfare or the welfare of diffuse groups (tenants, neighbors, future buyers).

  ### 2. Is It a Pareto Principle?

  It is not a genuine Pareto improvement. It is better described as a **Kaldor-Hicks improvement with deferred compensation**, or simply **political risk mitigation**.

  *   **Why it isn't Pareto:** As noted, tenants and neighbors are made worse off relative to a world where the building was fully up to code.
  *   **Which "Pareto" is being mimicked?** It mimics a **Legal-Entitlement Pareto**. It assumes owners have a property right to *not* be regulated retroactively. If you define "worse off" as "violation of existing legal rights," then grandfathering preserves that right. But this is a circular definition: it defines the right based on the exemption it seeks to justify.
  *   **The Uncertainty Problem:** You rightly note that the exemption might not even benefit the owner. If the new energy code lowers operating costs enough to increase net operating income or property value, the exemption deprives the owner of a profit. By grandfathering, the board is betting that compliance costs > efficiency savings. This is an empirical gamble, not a logical certainty.

  ### 3. Alternative Explanations for the Practice

  If it isn't Pareto, what is it? It is likely a hybrid of three things:

  1.  **Political Pragmatism (The "Vote Count"):** This is the most cynical but probable explanation. Existing owners are a concentrated, vocal voting bloc. Tenants and future residents are diffuse or not yet present. Grandfathering buys the votes needed to pass the code for *new* construction.
  2.  **Administrative Feasibility:** Enforcing retroactive energy codes on every old building requires immense inspection capacity. Tying compliance to "substantial renovation" or sale creates natural enforcement triggers.
  3.  **Transition Cost Minimization:** Even if the new code is better overall, forcing immediate compliance could cause liquidity crises for landlords, leading to vacancies or deferred maintenance elsewhere.

  ### 4. Where the Practice is Underdetermined

  You asked where different theories license the same exemptions. This is the zone of **Overlapping Consensus**, and it is dangerous because it hides disagreement.

  *   **The Libertarian** supports grandfathering because it respects vested property rights and limits state coercion.
  *   **The Utilitarian** might support it if the transition costs (renovation chaos, financial distress) outweigh the immediate benefits of efficiency.
  *   **The Contractarian** supports it because the "social contract" implied when the building was permitted did not include these new rules.

  **The Danger:** Because all three agree on the *outcome* (exemption), the board doesn't have to debate the *reason*. But if the context changes (e.g., a climate emergency), the Utilitarian argument collapses, while the Libertarian one remains. If you don't know *why* you are exempting, you don't know when to stop.

  ### 5. Does This Achieve "Safety" (Robustness)?

  Your colleague's definition of a "safe improvement" requires robustness across:
  1.  **Whose welfare counts:** (Owners vs. Tenants vs. Public)
  2.  **What counts as better/worse:** (Money vs. Safety vs. Liberty)
  3.  **Uncertainty:** (Will the code save or cost money?)

  **Your current policy fails the safety test on all three axes:**

  *   **Welfare Weights:** You applied the safety code (smoke/CO) retroactively but the energy code prospectively. This implies you value *tenant life* more than *tenant wallet*. While morally defensible, it is inconsistent with the Pareto claim. If tenant welfare counts for smoke detectors, it must count for energy bills. The exemption makes tenants worse off financially, which violates the "nobody worse off" claim.
  *   **Uncertainty:** As you noted, the exemption assumes the new code is a net cost to the owner. If the new code is a net investment (ROI positive), the exemption actually harms the owner by preventing them from upgrading. A "safe" policy would acknowledge this uncertainty.
  *   **Time:** The 7-year sunset clause creates a "Sword of Damocles." It tells owners they have a temporary right, not a permanent one. This undermines the Reliance argument (you can't rely on a right that expires) while keeping the inefficiency for seven years.

  ### 6. What Would a Board Have to Do Differently?

  To move toward a "safe improvement"—a policy that holds up regardless of how you weigh welfare or resolve uncertainty—the board would need to decouple the *goal* from the *mechanism* of grandfathering.

  **A. Distinguish Harm Prevention from Efficiency**
  You already did this intuitively. Safety (smoke/CO) is about preventing immediate, catastrophic harm to others (tenants). Efficiency (energy/stormwater) is about optimizing resources and reducing externalities.
  *   *Action:* Be explicit. Retroactive rules are justified when they prevent direct harm to identifiable others (tenants/neighbors). Prospective rules are for optimization. Do not claim the efficiency exemption is a "benefit" to the owner; admit it is a "transition grace period."

  **B. Internalize the Tenant's Welfare**
  If the energy code exemption hurts tenants (higher bills), the Pareto claim is false.
  *   *Action:* If you grandfather the building, you should arguably cap rent increases related to utility pass-throughs, or require disclosure of the building's exempt status to tenants. This acknowledges that the "savings" the owner gets is partly extracted from the tenant.

  **C. Address the Uncertainty (The "ROI" Problem)**
  Since you don't know if the code saves or costs money, treat it as an investment.
  *   *Action:* Instead of a hard exemption, offer a **subsidy or tax abatement** for early compliance. If the code is truly efficient, owners will take the subsidy and upgrade. If they don't, it confirms the compliance cost is high. This turns the "uncertainty" into revealed preference. This moves the policy closer to a Kaldor-Hicks improvement where the town (public) compensates the owner to ensure the upgrade happens.

  **D. Point-of-Sale vs. Time-Based Sunsets**
  A 7-year sunset is arbitrary. A "change of ownership" trigger is economically more robust.
  *   *Action:* Tie compliance to the transfer of title. When a building is sold, the price reflects the condition. The new buyer pays a lower price for a non-compliant building and can finance the upgrades. This avoids the "liquidity crisis" for current owners while ensuring the stock improves over time. This respects the *current* owner's reliance (they bought under old rules) without permanently locking in inefficiency.

  **E. Acknowledge the Political Trade-off**
  Finally, to be intellectually honest (if not politically expedient):
  *   *Action:* Admit in the record that grandfathering is a **compensation mechanism**. You are compensating current owners (by sparing them costs) in exchange for their acquiescence to a policy that benefits the public. If you frame it as "we are paying you with regulatory relief," you acknowledge that someone *is* paying (tenants, the environment), and you can debate whether that price is fair.

  ### Summary
  Your colleague is correct: the current practice is not a "safe improvement." It is a **political compromise disguised as economic neutrality.** It relies on a specific, contestable view that current owners' reliance interests trump tenants' operating costs and the public's environmental health.

  To make it safer, you would need to stop treating the exemption as a "right" and start treating it as a **temporary subsidy** that needs to be balanced against tenant protections and phased out based on economic triggers (like sale) rather than arbitrary time limits. This acknowledges that while we cannot make everyone better off instantly, we can stop pretending that no one is being made worse off.
