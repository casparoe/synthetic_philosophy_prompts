answer: |-
  **Take-Home Final Examination**
  **Course:** Philosophy of Biology (Seminar)
  **Time Limit:** 48 Hours
  **Word Limit:** 1500 Words Maximum (for this question)

  **Question 2: Inheritance and Interpretation**

  Below are descriptions of three invented biological inheritance systems (K, W, and L). These are hypothetical cases designed to isolate specific structural features. Do not attempt to identify them with real-world Earth biology; no marks will be awarded for citing actual empirical cases or academic literature. Your grade depends entirely on how you analyze the logical structure of these systems using the concepts of information, code, and causation discussed in this course.

  **System K:** A linear polymer composed of four unit types is transmitted from parent to offspring. A molecular machine reads this polymer in non-overlapping triplets. Each triplet triggers the addition of one unit from a set of twenty. The chemical properties of the triplet do not dictate which of the twenty units is added; the mapping is arbitrary but chemically consistent. This mapping is identical in every cell, at every life stage, and has remained fixed for many generations. The mapping is structured such that common reading errors result in either no change or the substitution of a chemically similar unit.

  **System W:** This system uses the same polymer and reading machine as System K. However: (1) The mapping between triplets and the twenty units is not fixed. It depends on the concentration of specific "adapter" molecules present in the cell. (2) Different tissues maintain different adapter concentrations, and these concentrations can shift within an organism's lifetime in response to environmental stress. (3) The adapter profile present in the egg is determined by the mother's environment. This induced profile persists for two or three generations before reverting. (4) These shifts are non-random: the new mappings tend to produce phenotypes adaptive for the environment that triggered the shift.

  **System L:** No linear read-out occurs. Inheritance consists of a pattern of chemical marks placed along a polymer. The enzymes placing these marks respond to the existing pattern of marks, not the sequence of units underneath. The underlying sequence is identical in all variants and predicts nothing about the outcome. The mark-pattern is transmitted with high fidelity across many generations and reliably switches the organism between two distinct, adaptive phenotypes. Artificially wiping the marks and replacing them with the alternative pattern is heritable.

  **Answer the following:**

  **(a)** For System W and System L, state clearly whether you would classify them as literally carrying "genetic information" and whether they utilize a "code." Briefly justify your classification by contrasting them with System K. (Approx. 300 words)

  **(b)** Focus on System W. One might argue the polymer sequence is the "message" and the adapter set is the "codebook." Critically evaluate this distinction. What determines whether a specific mapping event is a *correct* reading or a *misreading*? If the adapter set (the codebook) is itself inherited, does this generate a vicious regress of codebooks requiring their own readers? (Approx. 600 words)

  **(c)** Synthesis. Reflecting on all three systems, identify which specific feature—arbitrariness, combinatoriality, selected function, fidelity, or causal parity—was actually doing the philosophical work in the original debate about DNA. Does analyzing these cases suggest the debate was ever really about DNA, or about something else? (Approx. 600 words)

  ***

  ### Model Answer (700 Words)

  **Part (a)**
  System K is the baseline: it carries genetic information and uses a code. It satisfies the arbitrariness condition (chemistry doesn't fix the mapping) and the fixedness condition (the mapping is stable). System L clearly carries heritable information relevant to adaptation, but calling it a "code" is strained. A code implies an alphabet and a translation rule. L has high-fidelity transmission of adaptive difference, but without a combinatorial alphabet where units are rearranged to create new meanings, it functions more like a switch than a language. System W is the boundary case. It carries information, but the "code" is unstable. If a code requires a shared convention between sender and receiver that persists long enough to be selected, W's shifting mapping challenges the definition. I would classify W as carrying information, but possessing a *mutable* code, distinguishing it from K's fixed code and L's non-combinatorial inheritance.

  **Part (b)**
  The message/codebook distinction in W is intuitive but fragile. If the sequence is the message, its meaning changes based on the adapter context. In K, a misreading is a deviation from the fixed rule. In W, a "misreading" cannot be defined solely by deviation from a rule, because the rule itself is designed to change. Instead, normativity must be grounded in function. A reading is "correct" if it aligns with the selected function of the adapter mechanism. Since the adapter shifts are adaptive (tracking the environment), the shift itself is the intended function, not an error.

  Does inheriting the adapter set cause a regress? Only if we assume every reader needs a further reader to interpret it. This regress is blocked by natural selection. The adapter mechanism exists because ancestors with that mechanism survived. We do not need a meta-code to interpret the codebook; we need a causal history that explains why this codebook exists. The "reader" of the adapter set is the selective environment itself. Therefore, the regress is not vicious. However, this dissolves the strict separation between message and codebook. In W, the adapter set is not just a lookup table; it is part of the heritable material. The "information" is distributed across the sequence *and* the cellular context. Privileging the sequence as the sole message smuggles in an assumption of stability that W explicitly violates.

  **Part (c)**
  Comparing K, W, and L reveals that "chemistry" was never the stake in the DNA debate. L shows you can have heredity without sequence; W shows you can have sequence without fixed meaning. The load-bearing feature in the argument for "genetic information" is not arbitrariness or fidelity alone, but *evolvability via combinatorial control*.

  K supports the "code" metaphor because the fixed mapping allows the sequence to vary independently of the machinery. This separation allows for open-ended evolution; you can change the message without breaking the reader. This is what the "Instructional" account values: the genome as a privileged control parameter. The "Parity" argument attacks this privilege, noting that without the cellular context (W's adapters or L's marks), the sequence does nothing.

  Analyzing these cases suggests the debate was never about whether DNA is literally like English. It was about explanatory privilege. Calling DNA a "code" is a claim that the sequence is the unique locus of *potentiality*. System K supports this; System W undermines it by showing the context carries the adaptive potential; System L undermines it by showing sequence is unnecessary. Therefore, the debate is about whether we explain evolution by tracking the stable replicator (K) or the developmental system as a whole (W/L). If W is biologically possible, the "code" metaphor fails not because it is metaphorical, but because it misidentifies the unit of adaptation. The "information" is in the relationship, not the molecule.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Classification of Systems (4 Marks)**
  *   **4:** Clearly distinguishes K (Code + Info), L (Info, No Code/Alphabet), and W (Mutable Code/Context-Dependent Info). Notes that L lacks combinatoriality and W lacks fixed mapping.
  *   **2-3:** Correctly identifies K but treats W and L as simply "epigenetics" without analyzing the structural difference regarding coding.
  *   **0-1:** Fails to distinguish information from code, or claims L has no information because it lacks sequence.
  *   *Common Error:* Assuming L carries no information because it lacks a sequence, confusing the *medium* with the *difference that makes a difference*.

  **2. Normativity in System W (4 Marks)**
  *   **4:** Grounds "correctness" in selected function/adaptiveness rather than fidelity to a fixed rule. Recognizes that in W, the *change* in mapping is the function.
  *   **2-3:** Attempts to define error based on deviation from a standard mapping, failing to account for W's adaptive shifting.
  *   **0-1:** Claims there is no way to distinguish error from function in W.
  *   *Common Error:* Insisting that a code requires a fixed dictionary, thereby classifying W as "noise" rather than a different normative structure.

  **3. The Regress Problem (4 Marks)**
  *   **4:** Blocks the regress by appealing to selection history or causal function (the environment/selective history "reads" the adapter). Denies the need for a homunculus.
  *   **2-3:** Acknowledges the regress but offers a vague solution (e.g., "it just stops").
  *   **0-1:** Concludes the regress is vicious and therefore W is impossible or incoherent.
  *   *Common Error:* Treating the "reader" as requiring a literal internal agent rather than a causal/selected function.

  **4. Load-Bearing Feature Identification (4 Marks)**
  *   **4:** Identifies that the core stake is *evolvability/control privilege* (separation of message and machinery), not chemistry or arbitrariness alone.
  *   **2-3:** Identifies "arbitrariness" or "fidelity" as the key feature but fails to explain *why* that matters for evolution.
  *   **0-1:** Lists features without prioritizing one as load-bearing.
  *   *Common Error:* Selecting "arbitrariness" as the key feature without explaining that arbitrariness matters only because it allows independent variation (evolvability).

  **5. Synthesis/Meta-Conclusion (4 Marks)**
  *   **4:** Concludes the debate is about *explanatory privilege* (Replicator vs. Developmental System), not literal linguistics. Uses W/L to show DNA isn't uniquely privileged in all possible biologies.
  *   **2-3:** Concludes that "information" is just a metaphor and leaves it there.
  *   **0-1:** Restates the three stock positions (Deflationary, Instructional, Parity) without synthesizing what the cases reveal about them.
  *   *Common Error (The "B" Ceiling):* Mechanically applying the three stock positions (e.g., "W fits the Parity view") without analyzing what W *does* to the underlying logic of those positions. The A answer explains why the positions were formulated in terms of K-like systems.

  **Differentiation Note (A vs. B):**
  *   **B Grade:** Correctly labels K as "Instructional," W as "Parity," and L as "Deflationary." Treats the cases as buckets to sort into pre-existing theories.
  *   **A Grade:** Uses the cases to stress-test the theories. Recognizes that W breaks the Instructional account's reliance on stability, and L breaks the Deflationary account's reliance on sequence. The A answer identifies that the "Code" debate is actually a proxy war over where to locate the *driver* of evolution.
