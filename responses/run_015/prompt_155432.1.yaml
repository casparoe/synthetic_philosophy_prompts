  **MEMORANDUM**

  **TO:** Grants Committee, Larkspur Trust
  **FROM:** Chair, Grants Committee
  **DATE:** Tuesday, [Date]
  **SUBJECT:** Recommendation on Final Grant Allocation (Proposals A & B)

  **Recommendation**
  I recommend we award the remaining cycle funding to **Proposal A (Feral Cat Colony Care)** immediately. Proposal B (Rodent Contraception) should be declined for this cycle, with an invitation to resubmit only if specific ecological and legal criteria are met.

  This is not a judgment on the moral intuition behind Proposal B, but a determination that it currently falls outside the Larkspur Trust's legal mandate and exceeds our capacity for ecological due diligence.

  **Rationale**

  **1. Charter Compliance and Legal Risk**
  Our 1998 Deed mandates "the relief of suffering in animals." In charity law, "relief" presupposes an existing subject. Proposal A relieves the suffering of 120 existing cats. Proposal B relies on the philosophical premise that preventing existence relieves suffering. While intellectually coherent, this is an untested interpretation of our Deed. Funding B exposes the Trust to potential challenge from beneficiaries or regulators who hold the traditional view that non-existent beings cannot be beneficiaries. Given our size (£400k), we cannot absorb the legal cost of defending a novel interpretation of "relief."

  Furthermore, while contraception is not "destruction" in the lethal sense, the applicants explicitly frame the reduction of the local prey base (and consequent decline of the barn owl pair) as a "gain." This conflicts with the spirit of the bar on "destruction of animal life" when viewed holistically. We are an animal welfare trust, not a single-species welfare trust.

  **2. Ecological Uncertainty**
  My background is in vector control; I understand population dynamics. Proposal B's claim of "net-negative welfare" rests on three weeks of camera-trap data. This is statistically insufficient to characterize the lifetime welfare of a wild rodent population. More critically, the ecosystem impact is unmodeled. Reducing the rat population by the estimated margin will directly impact the barn owls. The applicants' willingness to count owl displacement or starvation as a secondary benefit indicates a value system that prioritizes *preventing potential suffering* over *sustaining existing life*. The Trust is not equipped to adjudicate trade-offs between predator and prey welfare without a full Environmental Impact Assessment, which B has not provided.

  **3. Mission Integrity and the "Slippery Slope"**
  We must address the concern that funding B commits us to a logic where fertility suppression becomes the primary tool of welfare, potentially leading to local extirpation as an end goal. If we accept that a wild life is inherently net-negative and that prevention is superior to care, the logical conclusion is that the most ethical act is the elimination of wild populations. This is a profound policy shift that requires donor consultation and a revision of our strategic plan, not a single grant decision. Proposal A fits our historical mission: stewardship of animals currently within our community.

  **The Strongest Case for Proposal B (And Why It Loses)**
  The proponents of Proposal B are correct on the arithmetic: if the goal is strictly to minimize units of suffering, preventing 40,000 lives of hardship outweighs caring for 120 existing lives. This is the most compelling effective-altruism argument we have seen. It challenges us to be more than a "feel-good" fund.

  However, efficiency cannot override mandate. We are not a utilitarian calculus engine; we are a charity bound by a Deed that prioritizes *relief* for *animals*. To fund B would require us to implicitly adopt a negative utilitarian philosophy regarding wild nature—a philosophy that is deeply contested even within animal ethics. We cannot make that philosophical leap without explicit direction from our Board and donors.

  **Actionable Feedback for Applicants**

  *   **To Proposal A (Cats):** Funding is contingent on a 3-year sustainability plan. We need to see how the colony stabilizes without perpetual grant dependency.
  *   **To Proposal B (Rats):** We are not closing the door forever, but you must address the following to be considered in future:
      1.  **Legal Opinion:** Provide a opinion from charity counsel arguing that "prevention of birth" constitutes "relief of suffering" under the 1998 Deed.
      2.  **Ecological Data:** 12 months of population data, not three weeks.
      3.  **Preditor Impact:** A revised model that accounts for the barn owls. You cannot count owl suffering as a "gain" in an application to a general animal welfare trust.

  **Bottom Line**
  Proposal A is fundable today. Proposal B is a research project masquerading as a welfare intervention, with legal and ecological risks we cannot underwrite. We will fund the cats, protect the Trust's legal standing, and invite the rodent group to return when they have the data to match their ethics.

  **Vote Required:** Approval to execute grant agreement with Proposal A.
