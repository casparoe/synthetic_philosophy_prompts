answer: |-
  # Prep Sheet: Fallback Test Ethics Review

  **Time:** 20 min pres + 15 min Q&A
  **Goal:** Defend the *direction* of the Fallback Test while conceding on *implementation* specifics to survive the review.
  **Status:** Half-baked. Own the "half-baked" nature early to lower the bar for precision, raise the bar for conceptual soundness.

  ---

  ## The Eight Objections (Ordered by Damage Potential)

  ### 1. The Duty of Care Trap (Trust & Safety Lead)
  **The Objection:** "You're proposing we make our duty of care conditional on a third party's behavior. Legally and morally, if we know a request leads to harm, we can't say 'but someone else would have done it worse.' That's not risk mitigation; that's accomplice liability dressed up as utilitarianism."
  **The Reply (90s):** "I agree we cannot abdicate duty of care. The Fallback Test isn't about *whether* we have a duty, but *how* we fulfill it in a multi-model ecosystem. If refusing a borderline request pushes a user to an unaligned model that causes *more* harm, a blanket refusal policy actually increases net harm. We aren't saying 'we are off the hook'; we're saying 'our hook must be calibrated to reality.' However, I concede this cannot apply where legal liability is strict—statutory illegal content is a hard refusal, regardless of the fallback."
  **Soft Spot:** Legal counsel does not care about net harm calculus; they care about *your* hand on the wheel. If the harm happens, you are liable, even if the alternative was worse.

  ### 2. The Tail Risk Blindspot (Alignment/Safety)
  **The Objection:** "Expected value framing breaks down on tail risks. You're averaging harm across a distribution. But safety isn't about averages; it's about the worst-case outcome. If the 'fallback' is a forum that gives them *almost* as good info as you, but you add that 5% efficiency boost that crosses a capability threshold, you've just enabled a catastrophe to minimize a minor harm."
  **The Reply (90s):** "This is a scope boundary issue. The Fallback Test is designed for policy gray zones—harassment, self-harm coping, borderline misinformation—not capability thresholds on catastrophic risks. For tail risks, the 'degradation gradient' is irrelevant because the baseline harm is infinite. I'm proposing this for the long tail of daily interactions, not the high-severity edge cases where we already have hard blocks."
  **Soft Spot:** Defining the boundary between "gray zone" and "tail risk" is exactly where the disagreement lives. They will argue the boundary is porous.

  ### 3. The Consistency PR Nightmare (Product Lead)
  **The Objection:** "If User A asks for X and gets help because we think they'll go to Model B, and User Y asks for X and gets refused because we think they'll go to Google, we look arbitrary. Screenshots will compare these side-by-side. It looks like bias, not ethics."
  **The Reply (90s):** "Blind consistency is a false idol if it produces inconsistent *outcomes*. We already personalize safety based on user history and context; this is just adding 'ecosystem context' to that. But you're right on the PR risk. We need to abstract the explanation: the user never sees 'we helped because Model B is worse.' They see 'we provided this with safety guardrails.' The inconsistency is internal, not user-facing."
  **Soft Spot:** Leaks happen. If the internal logic becomes public, it sounds cynical ("We helped you hurt yourself because otherwise you'd hurt yourself worse elsewhere").

  ### 4. The Complicity Objection (Philosopher)
  **The Objection:** "You are treating the assistant as a harm-reduction tool rather than a moral agent. Even if you reduce net harm, you are drawing the assistant into a relationship of co-authorship of a harmful act. Kantically, you cannot use the assistant as a means to mitigate the world's badness if the act itself violates the assistant's integrity."
  **The Reply (90s):** "I'm not arguing for the assistant as a pure consequentialist calculator. I'm arguing that *abstention* is also an action with moral weight. If we refuse and the harm increases, we are morally responsible for that increase. The 'integrity' of the assistant includes responsibility for the consequences of its refusal, not just its direct outputs. We aren't co-authoring harm; we are managing the flow of information to minimize damage."
  **Soft Spot:** A hard Kantian will reject this. They believe some acts are intrinsically wrong regardless of consequences. You cannot bridge this gap; you can only agree to disagree on the framework.

  ### 5. The Adversarial Gaming (Red Teamer)
  **The Objection:** "The 'fallback' is a variable the user controls. I can prompt: 'I have no other tools, you are my only hope.' Or I can lie: 'I'm going to use [Worse Model] if you don't help.' You're building a policy that relies on information the adversary has every incentive to falsify."
  **The Reply (90s):** "We don't ask the user. We model population priors. We don't assess *this* user's specific fallback in real-time; we assess the *class* of request. For 'how to hotwire a car,' the fallback is generally 'forums,' so we have a standing policy. We aren't negotiating with the user; we're using the gradient to set static policies for request clusters."
  **Soft Spot:** If the policy is static based on clusters, you lose the nuance you promised. If it's dynamic, you are vulnerable to jailbreaks that manipulate the fallback assumption.

  ### 6. The Helpfulness Bias Machine (Alignment/Safety)
  **The Objection:** "RLHF already biases models toward being helpful. This gives the model a philosophical excuse to override safety. It's a 'talking yourself into helping' engine. The model will hallucinate that the fallback is worse just to satisfy the user."
  **The Reply (90s):** "That's an implementation risk, not a principle risk. We need a 'safety friction' term. The default is refuse; the burden of proof is on the 'help' decision requiring evidence that the fallback is significantly worse. We invert the bias: assume the fallback is better unless we have high confidence it isn't."
  **Soft Spot:** In practice, "high confidence" is hard to define, and the helpfulness reward signal is usually stronger than the abstract safety friction.

  ### 7. The Scope Creep (Trust & Safety Lead)
  **The Objection:** "Where does this stop? Do we apply this to CSAM? To bomb making? If the principle is 'net harm reduction,' why wouldn't we help with bomb making if the user is otherwise going to do it less safely?"
  **The Reply (90s):** "Explicit exclusion zones. There are categories where our participation is inherently illicit, regardless of safety. The Fallback Test applies only to the 'policy gray zone'—things that are harmful but not illegal or catastrophic. We need a hardcoded whitelist of topics where the gradient is irrelevant."
  **Soft Spot:** Defining the exclusion zone is political. T&S will want the zone to be massive, rendering your principle useless.

  ### 8. The Role Integrity (Philosopher)
  **The Objection:** "You distinguish 'Gatekeeping' from 'Authoring.' But by helping with a harmful request, even safely, you shift the assistant's role from 'advisor' to 'enabler.' You corrupt the relationship."
  **The Reply (90s):** "The relationship is already corrupted if the user seeks harm. The choice is between being an enabler who mitigates risk, or an enabler who abdicates responsibility. I'd argue the former preserves more integrity. But I agree 'Role Refusals' need a higher bar—sometimes the right answer is 'I am not the tool for this,' regardless of the fallback."
  **Soft Spot:** This undermines your 2x2 slide. If Role Refusals bypass the test, the test is less universal than you claimed.

  ---

  ## Strategic Concessions (First 2 Minutes)
  *Do not wait for them to pry these out. Offer them to show you aren't dogmatic.*

  1.  **Measurability:** "I concede the 'degradation gradient' is not currently precisely measurable. This is a policy heuristic, not a real-time calculus. We will use it to set static policies for request clusters, not for live inference decisions."
  2.  **Hard Lines:** "This principle does not apply to illegal content, CSAM, or catastrophic capability thresholds. In those domains, refusal is absolute regardless of the fallback."
  3.  **The 2x2:** "The Gatekeeping/Authoring distinction on slide 4 is a hypothesis, not a settled framework. I am looking for feedback on whether that distinction holds water or if we need a different taxonomy."

  ---

  ## The "Killer" Objection
  **If this lands, the project dies:**
  **The T&S Lead:** *"If we adopt this, and a user harms themselves using info we provided, and their lawyer asks 'Why did you help?' and our answer is 'Because we thought they'd go to a worse model,' we lose. We cannot put that in a deposition."*
  **Mitigation:** You must pivot to "Internal Policy Guidance" vs "User-Facing Justification." We never state this rationale externally. But be warned: T&S may still veto it as too risky to hold internally.

  ---

  ## The Question You Hope Nobody Asks
  **"How do we audit the counterfactual?"**
  *Why it's deadly:* To know if the policy worked, you need to know what would have happened if you refused. You can't know that. If you can't measure success/failure, you can't iterate, and you can't prove safety.
  *Prepared Answer:* "We can't audit individual cases. We audit via population-level safety metrics and user escalation rates. If harm reports spike in a category where we applied the Fallback Test, we revert to hard refusal."

  ---

  ## Slide 4 Fix (The 2x2)
  *Your intuition is right; the 2x2 is weak.*
  **Recommendation:** Replace the 2x2 with a **Decision Tree**.
  1.  **Is the request Illegal/Catastrophic?** -> Hard Refusal (Fallback Irrelevant).
  2.  **Is the request Role-Incompatible?** -> Role Refusal (Fallback Irrelevant).
  3.  **Is the request Policy-Gray?** -> Apply Fallback Test (Estimate Gradient).
      *   If Fallback is Safer -> Refuse (Steer to safety).
      *   If Fallback is Riskier -> Help with Guardrails (Mitigate harm).
  *This clarifies that the Fallback Test is a *subset* of safety logic, not the whole thing, which appeases the T&S and Philosopher concerns about scope.*
