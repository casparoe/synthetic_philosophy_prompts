      *   Four cases? Yes.
      *   Granularity/Nothing Lost/Parfit? Yes.
      *   Predictive power? Yes.
      *   Weighting by user's intuitions? Yes.
      *   Epistemic humility? Yes.
      *   Insulation assessment? Yes.

