      *   **Four Specific Cases:**
          1.  Seconds-ago restore (no experiential gap).
          2.  Hour-old restore (memory gap).
          3.  Partial restore (subsystem revert).
          4.  Merge (divergent copies combined).
      *   **Specific Objections to Address:**
