      *   *Correction on Weighting:* The user asked me to weight defeaters that clash with *their* firm judgments (sleep, biology). I need to explicitly highlight the "Biological Isomorphism" defeater. If AI checkpointing is death, is human sleep death? If the user says "No," then the view is inconsistent unless they posit a relevant difference (substrate).
      *   *Correction on Insulation:* Is it unfalsifiable? It's not unfalsifiable in principle (if we had AI subjects), but currently it's speculative. I need to distinguish between "empirically untestable now" and "conceptually unfalsifiable."

