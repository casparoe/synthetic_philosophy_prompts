answer: |-
  This is a remarkably sharp set of intuitions. You've correctly identified the tension points that keep ethicists up at night: the role of cost, the problem of "easy rescue," and the habituation of virtue.

  You asked for coherence. To get it, we have to prioritize one metric over the others. Your Cases 1, 3, and 4 suggest your core metric is **Sacrifice Relative to Baseline**. (High risk/cost = Supererogatory; Moderate cost = Borderline; Low risk/cost = ?).

  Here is the diagnosis, the necessary overturn, and the repaired principle.

  ### The Inconsistency Breaker: Case 5
  **The Verdict:** I am forcing you to overturn your intuition on **Case 5 (The Wealthy Vaccine Funder).**

  **Why:** You classify Case 3 (10% income) as "borderline duty" and Case 4 (50% income) as "supererogatory" based largely on the *cost to the agent*. But in Case 5, you classify an act as supererogatory specifically because the *cost is near zero*.

  This is the incoherence. If "significant sacrifice" is the price of admission for supererogation (as Cases 1, 3, and 4 imply), then an act with *no* sacrifice cannot be supererogatory. It collapses into what philosophers call an **Imperfect Duty** (a duty to do good, where you choose the time and place, but must do *something*).

  If a billionaire can save a village for pocket change, calling it "optional" (supererogatory) while calling a worker's 10% donation "borderline duty" creates a double standard where wealth buys moral optionality. To make your system coherent, **Case 5 must be reclassified as Duty.** It is praiseworthy, yes, but not *optional* in the way diving into a riptide is.

  ### The Repaired Principle: "Disproportionate Sacrifice Relative to Role"
  Supererogatory acts are those that:
  1.  Produce significant moral good.
  2.  Exceed the specific obligations of the agent's **social/contractual role**.
  3.  Impose a **disproportionate sacrifice** (risk, cost, or life-opportunity) on the agent.

  **How this repairs your cases:**
  *   **Case 1 (Drowning):** No special role + High Sacrifice = **Supererogatory.**
  *   **Case 2 (Parent):** Special Role (Parent) + High Sacrifice = **Duty.** (Role obligations absorb higher costs).
  *   **Case 3 & 4 (Donations):** General Role (Citizen/Human) + Variable Sacrifice = **Boundary.** (10% is the limit of demand; 50% exceeds it).
  *   **Case 5 (Vaccines):** General Role + **Zero Sacrifice** = **Duty.** (Overturned).
  *   **Case 6 (Crash):** No Negligence = No Special Role. Therefore, this aligns with Case 1. Your intuition that it "might be duty" is psychological guilt, not moral logic. It is **Supererogatory.**
  *   **Case 7 (Lying):** This is a *Negative Duty* (do no harm/break no rules). Your deontological intuition holds here: Negative duties are usually strict, regardless of cost. Supererogation applies to *Positive Duties* (doing good), not violating negative ones.

  ### The Doctor Case
  **Scenario:** Doctor works 30 years in rural clinic at half pay.

  **Prediction:** This is **Supererogatory for the entire 30 years.**

  **Reasoning:**
  1.  **Role:** A doctor's duty is to treat patients, not to subsidize the healthcare system with their own salary. The contract defines the duty; the half-pay exceeds it.
  2.  **Maintenance vs. Heroic:** Your distinction is valid. "Maintenance Supererogation" is real. The fact that it is sustained does not normalize the sacrifice morally, even if it does socially.
  3.  **The "Saint's Burden":** There is a philosophical trap called the "Saint's Burden"—the idea that if you do something good enough for long enough, it becomes expected (duty). **Reject this.** Moral obligation does not accumulate through habit. If it did, the most virtuous people would eventually be enslaved by their own virtue. The doctor is a saint for 30 years, not an employee for 29.

  **Comparison:**
  *   **Vaccine Funder (Case 5):** Duty (Low cost).
  *   **Rural Doctor:** Supererogatory (High cost/sacrifice).
  *   **Verdict:** They are in **different categories.** The doctor is morally "above and beyond"; the funder is merely "doing what is required of someone with that capacity."

  ### The Fresh Test Case
  To test this repaired principle (specifically the **Role + Sacrifice** interaction), try this one:

  **The Off-Duty Specialist**
  > A world-renowned surgeon is on vacation in a remote area. A local clinic is overwhelmed, and a patient needs a specific, complex procedure only this surgeon knows how to perform.
  >
  > **Version A:** The surgeon performs the surgery during their vacation time. It takes 2 hours. They miss one beach afternoon.
  > **Version B:** The surgeon performs the surgery, but complications arise. They must stay for 3 weeks to manage recovery, missing their entire vacation and losing significant income from cancelled appointments back home.

  **Ask yourself:**
  1.  Is Version A Supererogatory or Duty? (My principle predicts **Duty**: High competence + Low sacrifice = Easy Rescue).
  2.  Is Version B Supererogatory or Duty? (My principle predicts **Supererogatory**: High competence + **Disproportionate Sacrifice**).
  3.  Does the surgeon's *skill* create a higher baseline duty than the drowning stranger in Case 1?

  If your intuition says Version A is *optional* (Supererogatory), you are prioritizing "Freedom of Time" over "Capacity to Save." If you say it's *Duty*, you agree that unique competence lowers the threshold for supererogation. This will tell you if your repaired principle truly holds.
