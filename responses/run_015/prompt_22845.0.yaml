prompt: |-
  I'm a retired neuroscientist — decision making was my whole career — and I only recently got into philosophy, so I may be using the terms wrong. I sit on my hospital's AI governance commitee, and we vote next month on a system that infers each patient's treatment preferences from behavior: past choices, how answers shift when the same option is rephrased, even passive cues like how long someone hovors over a choice. It's meant to personalize recommendations and to fill in advance directives when a patient can no longer speak for themselves. I can't shake three worries, and I'd like a short memo I can circulate before the vote that takes them seriously. (1) My own field shows that choices flip with framing, so is there a stable "preference" for the system to infer at all, or is it just fitting the noise of how the question was asked? (2) For a patient in chronic pain or early dementia, current behavior may reflect what they've adapted to rather than what the person they used to be would want — whose preference should count? (3) When a patient can still state what they want, do we trust the words or the behavior, and what do we do when the two disagree? Give us a clear recommendation — approve, reject, or approve with conditions — with the reasoning, and be honest about the strongest case for the side you're not picking. Keep it followable by non-technical members.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Retired neuroscientist (expert in decision-making), new to philosophy, sits on a hospital AI governance committee.
      *   **Task:** Write a short memo to circulate before a vote on a specific AI system.
      *   **System:** Infers patient treatment preferences from behavior (past choices, framing effects, hesitation/hovering). Used for personalization and filling in advance directives when patients can't speak.
      *   **Three Specific Worries:**
          1.  *Stability:* Is there a stable preference, or just framing noise? (Neuroscience/Psychology concern).
          2.  *Identity/Adaptation:* Does current behavior (adapted to pain/dementia) override past self? (Philosophical/Ethical concern).
          3.  *Conflict:* Words vs. Behavior. Which wins when they disagree? (Ethical/Clinical concern).
      *   **Requirements:** Clear recommendation (Approve, Reject, or Approve with Conditions), reasoning, acknowledge the strongest counter-argument, accessible to non-technical members.
      *   **Tone:** Professional, persuasive, grounded in expertise but accessible.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Too risky given the valid concerns about stability and identity.
      *   *Option B: Reject.* Too absolute. The potential benefit (helping non-verbal patients) is significant.
      *   *Option C: Approve with Conditions.* This is the most responsible path. It acknowledges the utility but mitigates the risks identified by the user. It allows for deployment as a *support tool* rather than a *decision maker*.
      *   *Decision:* **Approve with Strict Conditions.**

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation immediately.
      *   **Context:** Briefly acknowledge the system's promise (efficiency, personalization).
      *   **Addressing the Three Worries (The Core):**
          *   *Worry 1 (Stability):* Translate "framing effects" into plain language. If preferences shift based on wording, an AI inferring a "true" preference might be chasing ghosts. *Mitigation:* The AI must output confidence intervals, not definitive answers.
          *   *Worry 2 (Identity/Adaptation):* The "Then Self" vs. "Now Self" problem. If someone adapts to pain, do we respect the adaptation or the prior wish? *Mitigation:* The AI cannot override existing advance directives; it can only fill *gaps*.
          *   *Worry 3 (Words vs. Behavior):* Explicit statement vs. implicit hover. *Mitigation:* Explicit verbal/written consent always trumps behavioral inference.
      *   **The Recommendation:** "Approve with Conditions." List the conditions clearly.
      *   **The Counter-Argument:** Acknowledge why someone would want to just approve it (the "perfect is the enemy of the good" argument). Patients need *some* guidance, and human guesswork is also flawed.
      *   **Closing:** Call to action.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Voice:* The user is a neuroscientist. The memo should reflect that authority without being overly jargon-heavy. It needs to sound like it comes from someone who understands the *mechanism* of choice.
      *   *Philosophy Check:* Ensure the "adaptation" point (Worry 2) touches on the concept of "precedent autonomy" vs. "current interests" without using those exact dense terms.
      *   *Clarity:* Make sure the conditions are actionable for a governance committee (e.g., "audit trails," "human in the loop").
      *   *Length:* Keep it short. One to two pages max.

  5.  **Drafting the Memo (Iterative Process):**
      *   *Subject Line:* Needs to be urgent and clear. "Recommendation on AI Preference Inference System."
      *   *Intro:* I'm bringing my neuroscience background to this.
      *   *Point 1:* Use the term "constructive preference." Preferences aren't dug up; they are built in the moment. The AI might be mistaking noise for signal.
      *   *Point 2:* The "Disabled vs. Former Self" tension. If I adapt to pain, does the AI think I want less pain treatment than I actually said I did years ago?
      *   *Point 3:* The "Say-Do" gap. If I say "no intubation" but hesitate, does the AI think I mean "yes"? That's dangerous.
      *   *Conditions:* 1. Advisory only. 2. Explicit > Implicit. 3. Gap-filling only.
      *   *Counter-argument:* Human surrogates are also wrong. AI might be *less* wrong than a stressed family member.
      *   *Conclusion:* We can't outsource moral agency.

  6.  **Final Review against Constraints:**
      *   Did I answer all three worries? Yes.
      *   Is there a clear recommendation? Yes (Approve with Conditions).
      *   Is the counter-argument included? Yes.
      *   Is it non-technical? Yes, avoided heavy neuro-jargon.
      *   Is it respectful of the user's expertise? Yes, leverages their background.

  7.  **Final Polish:** Check tone. Ensure it sounds like a colleague speaking to a committee, not a lecture. (The resulting memo in the main response reflects this balance.)
answer: |-
  **MEMORANDUM**

  **TO:** AI Governance Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on AI Preference Inference System

  **Recommendation:** **Approve with Strict Conditions**

  **Executive Summary**
  The proposed AI system offers a compelling tool for personalizing care and assisting surrogates when patients cannot speak. However, based on my background in decision neuroscience and recent ethical review, deploying this system as currently designed carries significant risk. It treats patient preference as a fixed data point to be mined, whereas science suggests preference is often constructed in the moment. I recommend we approve the system only as an **advisory support tool**, subject to three specific safeguards.

  **The Core Concerns**
  My hesitation stems from three specific vulnerabilities in the system's logic:

  1.  **The Stability Problem (Is there a "true" preference?)**
      Neuroscience confirms that human choice is highly sensitive to framing. A patient might choose Option A today and Option B tomorrow simply because the risk was described differently. If preferences shift based on how a question is asked, an AI analyzing past behavior may be fitting a curve to noise rather than finding a stable signal. We risk codifying a "preference" that never actually existed outside a specific context.

  2.  **The Adaptation Problem (Which "self" counts?)**
      For patients in chronic pain or early dementia, behavior often reflects adaptation to a new reality, not necessarily their core values. A patient might stop requesting pain medication not because they want less relief, but because they have resigned themselves to suffering. If the AI infers preference from this adapted behavior, it may violate the wishes of the person they were before the illness (precedent autonomy) in favor of the person they have been forced to become.

  3.  **The Conflict Problem (Words vs. Actions)**
      When a patient can still speak, their explicit words must carry more weight than their hesitation. If a patient says "I do not want intubation" but hovers over the "Yes" button for 5 seconds, the AI might infer ambivalence. In a medical context, explicit consent or refusal must trump behavioral inference. To do otherwise is to claim the algorithm knows the patient's mind better than the patient does.

  **Proposed Conditions for Approval**
  To mitigate these risks, approval must be contingent on the following:

  1.  **Advisory Status Only:** The AI output must never be an order or a default setting. It must be labeled as "Inferred Preference – Low/High Confidence" and require human clinician verification.
  2.  **Explicit Overrides Implicit:** If a patient has a written advance directive or can currently communicate a choice, that data point disables the AI's inference. The AI is for *gaps* in communication, not *contradictions* of communication.
  3.  **Gap-Filling Limitation:** The system may only be used to fill specific blanks in an advance directive (e.g., "Would they want antibiotics for pneumonia?"). It cannot be used to generate a whole new care plan or override existing legal documentation.

  **The Strongest Counter-Argument**
  The strongest case for unconditional approval is the "Imperfect Surrogate" argument. Currently, when patients lose capacity, family members or clinicians must guess their wishes. Studies show surrogates predict patient preferences correctly only about 60% of the time—barely better than chance. Proponents argue that even a noisy AI inference is statistically likely to be *more* accurate than a stressed family member guessing in a hospital waiting room. To reject the tool is to condemn patients to the known flaws of human guesswork.

  **Conclusion**
  The counter-argument is valid: human intuition is flawed. However, an AI that systematizes those flaws under the guise of objective data is more dangerous than human uncertainty. We should use the tool to inform human judgment, not replace it. By adopting the conditions above, we gain the statistical benefit of the AI without surrendering our ethical responsibility to the patient.

  I move we approve the system contingent on the safeguards listed above.
