      *   *Verdict:* The claim is mostly accurate regarding the *standard mathematical modeling* of prioritarianism, but perhaps too strong regarding the *philosophical core*. Prioritarianism is about the *moral value* of benefits being inversely related to prior welfare. If welfare is discontinuous, the "inverse relation" becomes a step-function. So, it's not that prioritarianism *fails*, but that it collapses into a threshold view if the underlying good is discontinuous.
