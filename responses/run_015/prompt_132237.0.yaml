answer: |-
  There is no single, canonical proper noun for this specific dialectical maneuver (like "The Gettier Problem" or "The Hard Problem"), but it is a well-recognized pressure point in the literature. The closest established labels for the **dialectical pattern** are **"The Continuity Objection"** (or **"The Argument from Phenomenal Continuity"**) and **"The Contamination Objection."**

  The **"leaky" cases** themselves are typically taxonomized under **"Non-Standard Conditions,"** **"Perceptual Distortion,"** or more specifically **"Diplopia/Double Vision Cases."**

  Here is a breakdown of the terminology, the distinction from Sorites, and where this fits in the current literature.

  ### 1. The Dialectical Pattern: "The Continuity Objection"
  The move you describe—where conceding a single hybrid case forces the admission of a gradient that collapses a categorical distinction—is most commonly referred to as **The Continuity Objection** to Disjunctivism.

  *   **The Logic:** If the causal chain from object to experience can be degraded continuously (e.g., lighting gets worse, retina gets glitchier, brain gets noisier), and the phenomenology changes continuously, then positing a sharp, metaphysical boundary between "Perception" (Direct Contact) and "Hallucination" (No Contact) appears arbitrary.
  *   **Why it's not just Sorites:** A standard Sorites paradox relies on the vagueness of a *predicate* (e.g., "heap," "bald"). The Continuity Objection targets the **metaphysical grounding of a mental kind**. It argues that if the *supervenience base* (the neural/causal state) varies continuously, the *supervenient property* (the mental kind) should too. Disjunctivists deny this by insisting the mental kind is grounded in the *external object*, not the internal state. The Continuity Objection presses that the internal state's "leakiness" makes the external grounding insufficient to maintain the sharp boundary.
  *   **Alternative Label:** **"The Contamination Objection."** This focuses specifically on the "hybrid" aspect you mentioned. If a case can be part-perception (object present) and part-hallucination (extra stick present), then the mental state is "contaminated" by the hallucinatory kind. If contamination is possible, purity is not essential, and the disjunction collapses.

  ### 2. Taxonomy of the "Leaky" Cases
  You asked if there is a standard taxonomy for cases where the object is present but the experience includes non-matching properties (like the second stick). These are generally not folded into ordinary "illusion" talk without qualification because they threaten the **Numerical** integrity of the object, not just its **Qualitative** properties.

  *   **Standard Illusion (Qualitative Mismatch):** The stick is straight, looks bent. Disjunctivists (like M.G.F. Martin) handle this by arguing the "bentness" is not a property of an object you are aware of, but a way the existing object is presented.
  *   **Your Case (Numerical/Structural Mismatch):** One stick, looks like two. This is technically **Diplopia** (physiological) or **Perceptual Doubling**.
  *   **The Technical Label:** In the literature, these are often called **"Partial Contact" Cases** or **"Degraded Veridicality" Cases.**
  *   **Disjunctivist Response:** A strict Disjunctivist (e.g., William Fish or M.G.F. Martin) typically argues this is a **Composite State**. They claim you are *perceiving* the one stick (direct contact) but simultaneously *hallucinating* the second stick (no object).
  *   **The Critic's Counter:** This is where your "leaky" intuition hits home. Critics (like Adam Pautz or Heike Boger) argue that if the mind can composite these seamlessly, there must be a **Common Format** or **Common Layer** that allows the gluing. This is the **"Common Kind Assumption"** revived via the back door of hybrid cases.

  ### 3. Key Literature & Search Terms
  If you want to track this debate down, these are the terms and authors to look for:

  *   **"The Argument from Phenomenal Continuity":** This is the most common header for the "sliding scale" worry. See work by **Matthew Kennedy** or **Adam Pautz**.
  *   **"Non-Standard Conditions":** This is the standard Disjunctivist bucket for diplopia, astigmatism, and water-refraction cases. **William Fish's** *Perception, Hallucination, and Illusion* (2009) is the key text here. He explicitly defends the disjunction against the claim that these cases create a continuum.
  *   **"The Screening-Off Problem":** Related, but distinct. This asks if the internal state "screens off" the external object. Your "leaky" case suggests the internal state is doing the heavy lifting, which supports screening-off.
  *   **"Partial Illusion" / "Mixed Cases":** Some recent papers (e.g., by **Heather Logue** or **Fabian Dorsch**) discuss whether "mixed" experiences undermine the naïve realist claim that the object *constitutes* the experience.

  ### 4. Why "Leaky" is a Good Intuition (Even if Unofficial)
  Your term "leaky" captures something specific that "Continuity" sometimes misses. "Continuity" implies a smooth fade. "Leaky" implies **permeability between categories**.

  The specific philosophical worry is that if the boundary is permeable, the **Categorical Disjunction** becomes a **Scalar Property**.
  *   **Disjunctivist Goal:** Perception is a *relation* (Binary: you stand in it or you don't).
  *   **Leaky Pressure:** Perception is a *process* (Scalar: you can do it well, poorly, or partially).

  If you admit the "two-stick" case is still "perception" (because one stick is there), you have admitted that **Perceptual Contact** is gradable. Once contact is gradable, the "Directness" of Direct Realism is weakened. It becomes "Direct-ish."

  ### Summary Recommendation
  If you are writing or searching:
  1.  Use **"The Continuity Objection"** for the dialectical pattern of the sliding scale.
  2.  Use **"The Contamination Objection"** for the specific worry about hybrid/composite states.
  3.  Refer to the cases as **"Non-Standard Conditions"** or **"Diplopia Cases."**
  4.  If you want to coin a term for your specific intuition, **"The Permeability Objection"** is accurate and not currently overloaded in the literature. It captures the idea that the wall between the Good and Bad cases isn't just hard to draw (Sorites), but actively porous (Leaky).

  **Key Citation to Check:**
  *   **Fish, William.** "The Disjunctive Conception of Experience." (Specifically his handling of "causally deviant" cases).
  *   **Martin, M.G.F.** "The Limits of Self-Awareness." (His discussion of hallucination superimposed on perception).
  *   **Pautz, Adam.** "The Real Trouble for Phenomenal Externalists." (Attacks the disjunctivist handling of continuous variation).
