answer: |-
  # Patterns, Physics, and Predictions: A Joint Statement on Dennett's Stances

  **From the Philosophy Club End-of-Term Zine**

  After a term of debate, two members of our club have agreed to stop arguing past each other. We disagree on the status of the patterns we find in the world, but we agree on the framework we are using. This document records our common ground, our specific disagreements, and the tests we agree would help settle them.

  ### 1. Definitions

  To ensure we are understood by all readers, we define our key terms here.

  *   **The Physical Stance:** A method of prediction that relies on the physical makeup of a system and the laws of nature. It asks, "Given the atoms and forces here, what must happen next?"
  *   **The Design Stance:** A method of prediction that assumes a system was built to perform a function. It asks, "What is this thing supposed to do?" without needing to know the physical details of how it does it.
  *   **The Intentional Stance:** A method of prediction that treats a system as a rational agent. It asks, "What does this system believe, what does it want, and what would it rationally do to get it?"
  *   **Compression:** In this context, compression means describing a large amount of data (like a long video of a system's behavior) using a much shorter description (like a set of rules or beliefs) without losing the ability to predict what happens next. If you can summarize a million physical movements with one sentence like "It wants water," you have achieved high compression.

  ### 2. Common Ground

  Before listing our disagreements, we both sign the following claims:

  1.  **The Stances Exist:** We agree that the Physical, Design, and Intentional stances are distinct methods of prediction available to us.
  2.  **Predictive Success:** We agree that the Intentional Stance often successfully predicts behavior where the Physical Stance is too difficult for humans to calculate.
  3.  **Physical Foundation:** We agree that the physical makeup of a system ultimately constrains what it can do; a system cannot violate the laws of physics.
  4.  **Compression is Key:** We agree that the value of the Design and Intentional stances lies in their ability to compress complex physical data into manageable predictions.
  5.  **No Magic:** We agree that attributing beliefs and desires does not imply the system has a magical soul; it is a claim about how the system is organized.

  ### 3. The Disagreements and Agreed Tests

  Our dispute concerns whether the patterns found by the Intentional Stance are **real features of the world** (Pattern Realism) or **useful fictions created by our limitations** (Instrumentalism).

  Below is a table of our three main points of disagreement (cruxes). For each, we state the view in words the holder accepts, and we list a specific test case we both agree is relevant, along with what each side predicts will happen.

  | Crux | Pattern Realist Claim | Instrumentalist Claim | Agreed Test Case | Realist Prediction | Instrumentalist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Persistence**<br>(Is the pattern the same thing over time?) | When a pattern persists despite physical changes, the pattern is the real object, not just a summary of the parts. | The pattern is just a label we stick on a sequence of physical states; only the physical parts are real objects. | **The Rebuilt Glider:** A shape moves across a cellular grid. Every cell that makes up the shape turns off and is replaced by new cells along the path. | The "Glider" is a real object that persists. The pattern story picks out something the physical story misses (the identity over time). | The "Glider" is a convenient name for a sequence of different physical states. The physical story captures everything; the pattern just summarizes it. |
  | **2. Uniqueness**<br>(Is there one true way to carve the pattern?) | If a pattern predicts well, there is a fact of the matter about what the beliefs/units are, even if we struggle to find it. | Patterns are hostage to the choice of compression scheme; different schemes can carve the same data into incompatible units equally well. | **Twin Compressors:** Two schemes compress the same behavior equally well. One sees a single agent with beliefs about locations; the other sees two sub-agents negotiating. | One carving is the real one (or there is a fact of the matter waiting to be found). The other is slightly wrong. | There is no fact of the matter. Both are tools. Reality does not prefer one compression scheme over the other. |
  | **3. Necessity**<br>(Is the intentional stance just a shortcut?) | Belief-talk describes real structure. An intentional predictor can match a physical one because it tracks real causes, not just because it is easier. | Belief-talk is a fiction for creatures with limited computing power. A physical predictor would do all the work if given enough resources. | **Matched-Budget Prediction:** Two predictors get the same computing budget and training data. One uses intentional stance, one uses physical stance. | The intentional predictor will win or tie because it tracks the real causal structure efficiently. | The physical predictor will win if given enough power. The intentional predictor wins now only because the physical one is starved of compute. |

  ### 4. Is This Just About the Word "Real"?

  We have analyzed our quarrel to see if we are merely arguing over definitions. We conclude that **some** of the dispute is about the word "real," but **some** is substantive.

  **The Verbal Dispute:**
  Much of the fight hinges on what we mean by "real."
  *   If the **Instrumentalist** means "real" only as "made of fundamental particles," then they must say beliefs are not real. But if they admit that "real" can mean "an indispensable pattern that any rational observer would find," they might agree with the Realist.
  *   If the **Pattern Realist** means "real" as "useful and stable," they might agree with the Instrumentalist that beliefs depend on observers. But if they insist beliefs exist even if no one is there to predict them, they disagree.

  **The Substantive Dispute:**
  The disagreement becomes factual when we look at the **Twin Compressors** case.
  *   If there are truly two incompatible schemes that work equally well, the Realist must explain how both can be "true" descriptions of reality.
  *   The Instrumentalist must explain why, if patterns are just fictions, some fictions (like physics) seem to constrain others (like beliefs) so tightly.

  ### 5. What Would Actually Move Us?

  To end this debate, we need more than arguments. We need results. Here is what would change our minds.

  **What would move the Pattern Realist:**
  *   **Evidence:** If the **Twin Compressors** case becomes common—where we frequently find equally simple schemes that describe the same system in completely incompatible ways (e.g., one says it has beliefs, one says it has no beliefs but only forces)—the Realist would have to admit that patterns are not unique features of the world.
  *   **Conceptual:** If it is shown that the Intentional Stance relies on human interests (like "what counts as rational") rather than system properties, the claim that beliefs are "mind-independent" would fail.

  **What would move the Instrumentalist:**
  *   **Evidence:** If the **Matched-Budget Prediction** shows that the intentional predictor wins even when the physical predictor is given vastly more computing power. This would suggest the intentional structure is a fundamental feature of the system, not just a shortcut for limited minds.
  *   **Conceptual:** If it is shown that the Physical Stance cannot, even in principle, predict certain behaviors without first adopting the Intentional Stance to set up the initial conditions, the claim that physics "does all the work" would fail.

  **Signed,**

  *The Pattern Realist*  
  *The Instrumentalist*
