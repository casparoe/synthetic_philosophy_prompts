answer: |-
  Your intuition is spot on. Your roommate's summary is actually quite sophisticated regarding the core definitions, but there is one **major factual error** (regarding mismatch) and a few areas where they are repeating simplified "textbook" versions rather than the nuanced academic reality.

  Here is a breakdown of what is accurate, what is pop-science simplification, and where the summary goes off the rails.

  ### 1. The Accurate Parts (Core Theory)
  Your roommate correctly identified the foundational pillars of the "Santa Barbara School" of evolutionary psychology (associated with Leda Cosmides and John Tooby).

  *   **Domain-Specific Modules:** Accurate. Evo psych argues against the "Blank Slate" (domain-general learning) and proposes the mind is like a Swiss Army Knife, composed of specialized circuits (modules) designed to solve specific ancestral problems (e.g., cheater detection, mate selection, fear of snakes).
  *   **The Pleistocene/EEA:** Accurate. They argue our brains are adapted to the *Environment of Evolutionary Adaptedness* (EEA), which is roughly the Pleistocene epoch (hunter-gatherer contexts), not the modern world.
  *   **Parental Investment Theory:** Accurate. The "cheap sperm/expensive egg" explanation (Trivers' Parental Investment Theory) is the classic framework used to explain sex differences in mating strategies.
  *   **Cross-Cultural Testing:** Accurate. If a psychological mechanism is an adaptation, it should be a "species-typical" trait found across cultures, though the *expression* might vary.
  *   **Culture as a Surface Layer:** Accurate to the field. Evo psychologists typically view culture not as an independent force, but as **"evoked culture."** This means universal mental mechanisms react to local environmental conditions to produce cultural variation. (e.g., a universal "status-seeking" module might produce cowboy culture in one environment and corporate ladder-climbing in another).

  ### 2. The Major Error: The Mismatch Hypothesis
  **This is the part that felt "off" to you because it is incorrect.**

  Your roommate claimed evolutionary psychologists *reject* the mismatch hypothesis (that our brains are adapted to ancient environments, not modern ones) because they believe minds are flexible.

  **This is the opposite of the truth.**
  *   **Evo Psych relies heavily on mismatch.** A huge portion of evolutionary psychology is dedicated to explaining modern pathologies *via* mismatch.
  *   **Examples:** Why do we crave sugar and fat? Because in the Pleistocene, calories were scarce. Why do we have anxiety disorders? Because our "smoke detector" principle is calibrated for a dangerous savannah, not a safe office. Why is social media addictive? Because it hijacks ancestral social validation circuits.
  *   **Where the confusion might come from:** Your roommate might be conflating "mismatch" with "dysfunction." Some evo psychs argue that behaviors that *look* maladaptive (like high divorce rates) are actually flexible, conditional strategies working correctly in a new environment, rather than a "broken" brain. However, saying the field *rejects* mismatch is factually wrong. Mismatch is a central tool in their toolkit.

  ### 3. Pop Science vs. Academic Nuance
  Your roommate's summary leans into some pop-science simplifications that are often criticized even within the field.

  *   **"Hardwired" vs. "Facultative":**
      *   *Roommate:* "Jealousy and risk preference are hardwired."
      *   *Reality:* Academic evo psych rarely uses "hardwired" (which implies rigid/unchangeable). They prefer **"facultative adaptations."** This means the *mechanism* is innate, but it has "if-then" switches. For example, a child might develop a different mating strategy depending on whether their father was present during childhood. It's not a rigid script; it's a calibrated computer program.
  *   **Men = Promiscuous, Women = Choosy:**
      *   *Roommate:* "Male promiscuity... female choosiness."
      *   *Reality:* This is the 1990s textbook version. Modern evo psych (e.g., Gangestad, Buss) uses **Strategic Pluralism.** Women can be promiscuous (e.g., to gain genetic benefits or backup partners), and men can be choosy (e.g., when investing heavily in offspring). The *costs* differ, but the behaviors are conditional, not absolute.
  *   **Primate Comparison:**
      *   *Roommate:* Defenders use primate comparison to avoid just-so stories.
      *   *Reality:* They do use this, but cautiously. Humans are distinct enough that assuming chimps = ancestors is risky. The stronger defense is usually **game theory modeling** and **experimental prediction**, not just looking at monkeys.

  ### 4. Does the Defense Against "Just-So Stories" Work?
  The "Just-So Story" critique (made famous by Stephen Jay Gould) argues that you can invent an adaptive story for *anything* after the fact (e.g., "Why do men like blue? Because ancestral hunters needed to see the sky.").

  **The Defense:**
  Evo psychologists argue they avoid this by:
  1.  **A Priori Predictions:** Making predictions *before* collecting data (e.g., predicting that step-parents will invest less than biological parents, which is statistically supported).
  2.  **Converging Evidence:** Requiring the hypothesis to fit with anthropology, neuroscience, and genetics, not just logic.
  3.  **Reverse Engineering:** Starting with a problem (e.g., "how to detect toxins") and looking for the mechanism, rather than starting with a behavior and inventing a reason.

  **Does it work?**
  *   **Yes:** In cases like **cheater detection** (Cosmides' Wason Selection Task) or **step-parental investment risk**, the field has generated robust, replicable data that standard psychology didn't predict.
  *   **No:** In cases regarding complex modern behaviors (e.g., "why do people like music?"), the adaptive stories are still often speculative.
  *   **Verdict:** The defense works better than critics admit, but it is not immune to the criticism. Good evo psych is rigorous; bad evo psych is exactly the just-so storytelling critics fear.

  ### Summary Verdict
  Your roommate gave a **B+ summary**. They understand the architecture (modules, EEA, evoked culture) and the classic examples (parental investment).

  However, they failed on the **Mismatch Hypothesis** (which is a core tenet, not a rejected one) and used slightly outdated/deterministic language ("hardwired," strict sex differences) that ignores the conditional/facultative nature of modern evolutionary psychology.

  **Your intuition was correct:** The claim that evo psych rejects mismatch is the "tell" that your roommate might have missed a lecture or is simplifying a complex debate about behavioral flexibility. Evolutionary psychology is fundamentally the study of why our ancient brains struggle with modern life; denying mismatch would remove half their job description.
