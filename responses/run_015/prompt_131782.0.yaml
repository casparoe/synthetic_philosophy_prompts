      *   **Context:** The user talked to a roommate who took an evolutionary psychology (evo psych) course.
      *   **Roommate's Summary:**
          1.  Evo psych = study of domain-specific mental modules shaped in the Pleistocene.
          2.  Traits (jealousy, risk preference) are hardwired adaptations, not cultural.
          3.  Classic examples: Male promiscuity (cheap sperm) vs. Female choosiness (expensive eggs) (Parental Investment Theory).
          4.  Testing method: Cross-cultural universality.
          5.  Criticism: "Just-so stories" (post-hoc adaptive explanations).
          6.  Defense: Reverse-engineering + primate comparison; culture is a surface layer.
          7.  **Crucial Claim:** Evo psych researchers *reject* the mismatch hypothesis (brains adapted to ancient env, not modern) because they think minds are flexible enough.
      *   **User's Intuition:** Something feels off, especially regarding mismatch and culture.
      *   **Task:** Evaluate the fairness/accuracy of the summary, distinguish evo psych from pop science, and assess the "just-so story" defense.

  2.  **Deconstruct the Roommate's Claims (Fact-Checking):**

      *   *Claim 1: Domain-specific modules shaped in the Pleistocene.*
          *   **Accuracy:** Mostly accurate. This is the core "Standard Social Science Model" vs. "Swiss Army Knife" debate. Cosmides & Tooby argue for domain-specificity. The "Environment of Evolutionary Adaptedness" (EEA) is usually Pleistocene hunter-gatherer contexts.
          *   **Nuance:** Not *all* evo psych is strictly modular (some allow for domain-general mechanisms), but the "classic" view is modular.

      *   *Claim 2: Hardwired adaptations, not cultural products.*
          *   **Accuracy:** Accurate to the field's stance. They argue against the "Blank Slate." However, they don't deny culture exists; they argue culture is generated by psychological mechanisms.
          *   **Nuance:** "Hardwired" is a bit pop-sci. "Canalized" or "species-typical" is more precise. Interactionism is key (genes x environment).

      *   *Claim 3: Male promiscuity/Female choosiness (Parental Investment).*
          *   **Accuracy:** Accurate. This is Trivers' Parental Investment Theory, a cornerstone of evo psych (Buss, etc.).
          *   **Nuance:** Modern evo psych acknowledges more nuance (strategic pluralism, conditional strategies) than the pop-sci version suggests, but the roommate's summary captures the classic textbook example.

      *   *Claim 4: Testing via cross-cultural universality.*
          *   **Accuracy:** Accurate. If it's an adaptation, it should be universal (or reliably developing).
          *   **Nuance:** Facultative adaptations (switches) might look different in different cultures, so universality of *behavior* isn't always expected, but universality of the *underlying mechanism* is.

      *   *Claim 5: Criticism = Just-so stories.*
          *   **Accuracy:** Accurate. This is the Gould/Lewontin critique.
          *   **Nuance:** It's the most common philosophical objection.

      *   *Claim 6: Defense = Reverse-engineering + Primate comparison.*
          *   **Accuracy:** Partially accurate. They do use reverse-engineering (function to structure). Primate comparison is used, but mostly to infer ancestral states.
          *   **Nuance:** The defense also relies on predictive models and experimental psychology, not just comparison.

      *   *Claim 7: **The Red Flag** - Rejecting the Mismatch Hypothesis.*
          *   **Accuracy:** **False.** This is the biggest error.
          *   **Fact:** Evo psych *heavily* relies on the mismatch hypothesis (e.g., sugar/fat cravings, anxiety in safe environments). Tooby and Cosmides explicitly discuss mismatch.
          *   **Why the roommate might think this:** Maybe they confused "flexibility" with "adaptation." Or maybe the roommate heard that evo psych argues against the idea that we are *maladapted* to the point of dysfunction, but generally, mismatch is a core concept. Actually, some evo psychs argue that what looks like mismatch might be conditional strategies, but rejecting mismatch entirely is contrary to the field.
          *   **Correction:** Evo psych *embraces* mismatch to explain modern pathologies (obesity, depression, etc.).

      *   *Claim 8: Culture is a surface layer on biological programs.*
          *   **Accuracy:** Accurate to the "Evoked Culture" theory (Tooby & Cosmides). Culture isn't independent; it's the output of universal minds reacting to local conditions.
          *   **Nuance:** Dual-inheritance theorists (Boyd & Richerson) disagree, arguing culture evolves independently. The roommate is describing the strict evo psych view, not the broader sociobiological view.

