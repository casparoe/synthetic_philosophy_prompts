  **THE REASON SORTER: A DECISION TREE**

  **Case:** A demon offers $1M to admire him. You lack evidence he is admirable.
  **Constraint:** Do not use labels 'right/wrong kind' or 'fitting'. Use 'appropriate', 'correct', or 'meriting'.

  **Q1: STATUS OF THE PRIZE**
  What status does the prudential benefit have?
  (A) Reason *to bring it about* that you admire him. → **Scope Dissolution.** (Reasons target actions/causation, not attitudes directly.)
  (B) Reason *for* admiring him. → Go to Q2.
  (C) No reason at all (only evidence counts). → **Evidentialism.** (Prize isn't evidence of correctness, so it isn't a reason.)

  **Q2: WEIGHT VS. KIND**
  If it is a reason *for* admiring, does it make admiration *appropriate to him*, or merely *beneficial for you*?
  (A) Appropriate (but perhaps weak). → **Weight Deflationism.** (No kind distinction; prize reasons are just outweighed by lack of merit.)
  (B) Merely beneficial. → Go to Q3.

  **Q3: RETENTIVE TEST**
  You already admire your supervisor. Keeping this admiration saves your PhD. Is the 'PhD-saving' reason the same kind as the 'patience' reason?
  (A) Same kind. → **Retentive Uniformity.** (Acquisition and retention reasons share a source.) *Diagnosis: Unexplored; risks collapsing Q2 distinction.*
  (B) Different kind. → Go to Q4.
  (C) Depends on context. → **Contextualism.** (Reasons shift kind based on temporal/stable state.) *Diagnosis: Unnamed/Unstable.*

  **Q4: SELF-SHAPING TEST**
  Grieving makes you empathetic later. Is this 'functional' benefit a reason *for* grief, or *for allowing* grief?
  (A) For grief. → **Functionalism.** (Reasons track functional role/benefit.) *Flag: May collapse into Deflationism if 'functional' implies 'appropriate'.*
  (B) For allowing. → Go to Q5.

  **Q5: GROUNDING THE DISTINCTION**
  What marks the difference between 'patience' reasons and 'prize' reasons?
  (A) The object's value properties. → **Value-First.** (Value explains reasons; buck-passing is false. Prize reasons don't track value.)
  (B) The attitude's structural type. → Go to Q6.
  (C) Neither/Brute Fact. → **Empty Cell.** *Diagnosis: Incoherent; denies both value-grounding and structural restriction.*

  **Q6: STRUCTURE VS. ANALYSIS**
  If structural, do reasons analyse value, or does structure restrict which reasons analyse value?
  (A) Structure restricts reasons (only some reasons analyse value). → **Restricted Buck-Passing.** (Value = reasons, but only 'object-given' ones count.)
  (B) Attitude has proprietary reasons (e.g., fear vs. amusement). → **Proprietary Pluralism.** (Prize reasons belong to a different attitude's kind.)

  **INDISTINGUISHABLE LEAVES**
  **Functionalism** and **Weight Deflationism** may converge if 'functional benefit' is treated as making an attitude 'appropriate' in a broad sense. Separation requires a case where functional benefit exists but appropriateness is denied (e.g., useful delusion).

  **KEY**
  Q1(A)→Scope. Q1(C)→Evidentialism. Q1(B)+Q2(A)→Deflationism.
  Q2(B)+Q3(A)→Uniformity. Q3(C)→Contextualism.
  Q3(B)+Q4(A)→Functionalism. Q4(B)+Q5(A)→Value-First. Q5(C)→Empty.
  Q5(B)+Q6(A)→Buck-Passing. Q6(B)→Proprietary.

  **NOTE ON CASES**
  **Retentive:** Forces views to clarify if 'keeping' an attitude relies on the same norms as 'acquiring' it. Views assuming unity (Q3A) struggle to explain why prize-reasons don't justify retention.
  **Self-Shaping:** Forces views to classify long-term functional benefits. Views filing this under 'state-given' (Q4B) must explain why grief is permitted but not mandated by the benefit.
