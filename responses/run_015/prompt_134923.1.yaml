answer: |-
  Let's sit down with the whiteboard. You've constructed a classic paradox of social learning, and it's a good one because it forces us to confront the difference between *processing* information and *transmitting* it. As a formal epistemologist, I see exactly where the tension lies. It's not in the rationality, and it's not in the Bayes rule. It's in the topology of the decision rule.

  I will reconstruct your argument in likelihood ratios, identify the precise fracture point, and then we will discuss the price of repairing it.

  ### 1. Formal Reconstruction

  Let $\omega \in \{0, 1\}$ be the state. Let $a_n \in \{0, 1\}$ be the action of agent $n$.
  Let $H_{n-1} = (a_1, \dots, a_{n-1})$ be the public history.
  Let $s_n$ be the private signal. We assume signals are conditionally i.i.d.
  Define the public likelihood ratio after history $H_{n-1}$ as:
  $$ R_{n-1} = \frac{\mathbb{P}(H_{n-1} | \omega=1)}{\mathbb{P}(H_{n-1} | \omega=0)} $$
  Define the private likelihood ratio of signal $s_n$ as:
  $$ \ell_n = \frac{\mathbb{P}(s_n | \omega=1)}{\mathbb{P}(s_n | \omega=0)} $$
  By Bayes' rule, the posterior likelihood ratio for agent $n$ is $R_{n-1} \cdot \ell_n$.
  The agent chooses $a_n = 1$ if and only if the posterior probability of $\omega=1$ exceeds $1/2$, which is equivalent to:
  $$ R_{n-1} \cdot \ell_n > 1 $$

  Now, let's map your premises to this notation:

  *   **(1) Rationality:** Agent $n$ chooses $a_n$ to maximize $\mathbb{P}(a_n = \omega | H_{n-1}, s_n)$. This yields the threshold rule above.
  *   **(2) Belief Update:** $\mathbb{P}(\omega | H_{n-1}, s_n) \neq \mathbb{P}(\omega | H_{n-1})$. In our notation, $\ell_n \neq 1$ (signals are informative), so the posterior ratio $R_{n-1} \cdot \ell_n$ strictly differs from the prior ratio $R_{n-1}$. **(This holds.)**
  *   **(3) Action Response:** "Each agent decides on the basis of information nobody else has." Formally, this claims $a_n$ is a function of $\ell_n$.
  *   **(4) Information Transmission:** "Each action tells later agents something they didn't already know." Formally, this claims the mapping from $s_n \to a_n$ is injective (or at least informative) regarding $\ell_n$.
  *   **(5) Aggregation:** "Pooled independent evidence drives posterior to the truth." Formally, $R_n \to \infty$ (if $\omega=1$) almost surely.

  ### 2. The Diagnosis

  I reject the inference from **(3) to (4)**.

  Here is why it looked innocent: You are equivocating on the phrase "decides on the basis of."
  In premise (2), you established that the *belief* depends on the signal. That is true. The internal state of the agent changes with $s_n$.
  In premise (3), you imply that the *action* depends on the signal.
  In premise (4), you require that the action *varies* with the signal in a way observable to others.

  **The Break:**
  In the Bikhchandani-Hirshleifer-Welch (BHW) model, signals have **bounded support**. Let the maximum possible private likelihood ratio be $\bar{\ell} > 1$ and the minimum be $\underline{\ell} < 1$.
  A cascade begins when the public belief becomes so extreme that private signals can no longer overturn it.
  Specifically, if $R_{n-1} > 1/\underline{\ell}$, then for *all* possible signals $s_n$:
  $$ R_{n-1} \cdot \ell_n \ge R_{n-1} \cdot \underline{\ell} > 1 $$
  In this region, the agent chooses $a_n = 1$ regardless of whether $s_n$ is high or low.

  *   **Premise (2) remains true:** The posterior *does* move. If $s_n$ is high, the posterior is higher than if $s_n$ is low. The agent *does* condition on the signal.
  *   **Premise (3) is ambiguous:** The agent uses the signal to calculate the posterior, but the action is **insensitive** to the signal. The function $f(\ell_n) = \mathbb{I}(R_{n-1} \cdot \ell_n > 1)$ becomes a constant function.
  *   **Premise (4) is false:** Because the action is constant across all signal realizations, the action has zero mutual information with the signal. $I(a_n; s_n | H_{n-1}) = 0$. The chain goes informationally dead.

  Your first friend was correct: it is a **many-to-one map**. When the public belief is in the "cascade region," the map from Signal Space $\to$ Action Space collapses the entire signal space into a single point. You cannot invert the function to recover the signal.

  ### 3. Pricing the Alternatives

  You asked what you are committed to if you accept this diagnosis. Let's price the options.

  **Option A: Kill (3)→(4) (The Correct Move)**
  *   **Commitment:** You must accept that a rational agent can process private information without that processing being visible in their behavior.
  *   **Is this irrational?** No. It is optimal myopia. The agent knows their signal is too weak to outweigh the accumulated public weight. Switching actions would lower their expected payoff. They are not "acting as if they hadn't seen the signal"; they are acting as if the signal *doesn't matter for the decision*, which is a subtle but crucial difference.
  *   **Is the action uninformative?** Yes. This is the definition of an informational cascade. The action is "cheap talk" in the sense that it costs nothing to mimic the herd, but here it's "hard" action that simply conveys no marginal data.
  *   **Consequence:** You preserve the rationality of the agents and the correctness of the BHW model. You admit that rationality does not guarantee information aggregation when actions are coarse (binary) and signals are bounded.

  **Option B: Kill (4)→(5)**
  *   **Commitment:** You would have to argue that even if information *did* flow (i.e., if actions were informative), aggregation might still fail.
  *   **Verdict:** This is hard to defend in this specific model. If actions remained informative forever (i.e., no cascade), the public likelihood ratio $R_n$ is a martingale. By the Martingale Convergence Theorem, it must converge. If signals are i.i.d. and informative, it converges to the truth.
  *   **Consequence:** If you kill this link, you are fighting the math of martingales, not the epistemology of herding. Don't do this.

  **Option C: Bite the Bullet (Claim the Argument is Valid)**
  *   **Commitment:** You claim cascades cannot exist.
  *   **Verdict:** This requires changing the model assumptions. If you assume **unbounded** signals (e.g., Gaussian signals where $\ell_n$ can be arbitrarily large), then $R_{n-1}$ can never exceed $1/\underline{\ell}$ because $\underline{\ell} \to 0$. In that case, a single contrarian signal can always overturn the public belief.
  *   **Consequence:** As your second friend noted, if you allow unbounded signals, strict cascades vanish. Information aggregates asymptotically (Smith & Sørensen, 2000). But this changes the "textbook model" you started with. In the bounded signal model, your argument is invalid.

  ### 4. Herding vs. Cascading

  You mentioned sliding between "herding" (same action) and "cascading" (ignoring info). This distinction is doing heavy lifting in step (3).

  *   **Herding:** $a_n = a_{n-1}$. This can happen by coincidence even if everyone uses their signals.
  *   **Cascading:** $a_n$ is independent of $s_n$ conditional on $H_{n-1}$.

  Your argument fails because it assumes **Herding implies Non-Cascading**. You argue: "They are all doing the same thing (Herding), therefore they must all be seeing similar signals (Non-Cascading)."
  The model shows: "They are all doing the same thing (Herding), because the public belief is so strong that *different* signals all map to the *same* action (Cascading)."

  The hole is the assumption that behavioral conformity implies informational diversity. In a cascade, behavioral conformity masks informational diversity.

  ### 5. Final Verdict

  The step that dies is **(3)→(4)**.

  **Why it looked innocent:** Because in standard communication, if I tell you my decision, I usually reveal my reason. We intuitively treat actions as transparent windows into beliefs.
  **Why it is wrong:** In sequential decision problems with coarse actions, the decision rule is a **threshold function**. Once the public belief crosses the threshold determined by the maximum/minimum signal strength, the threshold function saturates. The derivative of the action with respect to the signal becomes zero.

  **The Epistemic Lesson:** Rationality guarantees that I use my evidence, but it does not guarantee that I *reveal* my evidence. When the cost of deviating from the public consensus (in terms of expected error) exceeds the value of my private information, rationality dictates I hide my information behind the consensus action. I become a copy, not a contributor. This is not a failure of rationality; it is a failure of the **action space** to support the **information space**.

  If you want to save the conclusion (that the group converges to truth), you must abandon the "textbook model" assumption of bounded signals. If you keep the textbook model, you must accept that rational agents can collectively lock into error forever, precisely *because* they are rational enough to know when their private voice is too quiet to be heard.
