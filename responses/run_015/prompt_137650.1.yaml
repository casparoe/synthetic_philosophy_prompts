          *   Event $F$: Coins don't match (HT or TH).
          *   In PB (averaging unknown bias to 0.5): $P(E) = 0.5$. Conditioning on $E$ or $F$ leaves Coin 1 at 0.5.
          *   In IP: Prior for Coin 2 is $[0, 1]$.
          *   Calculate $P(Coin1=H | E)$.
          *   If Coin 2 is bias $p$, $P(E) = 0.5p + 0.5(1-p) = 0.5$.
          *   $P(C1=H \cap E) = 0.5p$.
          *   $P(C1=H | E) = 0.5p / 0.5 = p$.
          *   Since $p \in [0, 1]$, the posterior is $[0, 1]$.
          *   *Result:* Prior for Coin 1 was $[0.5, 0.5]$ (precise). Posterior after learning *anything* about the match is $[0, 1]$ (maximally imprecise).
          *   *Contrast:* PB says you learn nothing about Coin 1 (stays 0.5). IP says your uncertainty *explodes*.
          *   *Decision Impact:* If offered a bet on Coin 1 *after* seeing the match result, PB says buy/sell at 0.5. IP says no price is acceptable (or interval is 0 to 1).

