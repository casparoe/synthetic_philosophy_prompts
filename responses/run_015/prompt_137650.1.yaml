      *   *Need:* A case where Averaging says "Do X" but IP says "Don't commit" or "Do Y".
      *   *Scenario:* The user's Factory example is actually a case of *Risk* if they truly assign 50/50. To make it IP, we need to remove the 50/50 justification.
      *   *Better Scenario:* **Dilation**.
