      *   *Correction:* In the user's example, they *stipulated* "I have no clue which." In standard Bayesianism, "no clue" often defaults to Principle of Indifference (50/50). IP says "no clue" means the set of priors includes *all* weights over A and B, not just 50/50.
      *   *Key Distinction:* Risk (known probabilities) vs. Ambiguity (unknown probabilities).

  3.  **Identify the "Bite" (Where they disagree):**
      *   **Dilation:** This is the strongest technical counter-example. Conditioning on new evidence can *widen* the interval in IP, whereas in PB, conditioning always refines (narrows or shifts) the probability.
      *   **Decision Making (E-Admissibility vs. Maximality):** PB maximizes expected utility based on the average. IP often uses rules like $\Gamma$-Maximin (maximize the minimum expected utility) or E-Admissibility (choose an option that is optimal for *some* prior in the set).
