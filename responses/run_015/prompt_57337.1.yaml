answer: |-
  Here are the predictions, the underlying rules, and the test case.

  **Predictions**

  1.  **Single-Shot Cycle:** **Not Irrational.** (Confidence: 80%)
      Marta's hesitation on the Coworker case is the tell. She initially called contradictory probabilities irrational, but paused when told no bets were possible. Her core metric is exploitability, not abstract logic. If the cycle exists but the environment prevents the "swap" mechanism (no second bite, no resale), no money can be pumped. Without a leak, she won't call it a bug.

  2.  **Brother with Willpower:** **Not Irrational.** (Confidence: 95%)
      This is the Doomscroller case redux. The original Brother was irrational because he was "the bookie and the sucker," losing resources to his own inconsistency. By successfully precommitting (even via willpower), he aligned his time-slices. He patched the exploit. The outcome is consistent with his higher-order preferences (January self wins), so the system is coherent.

  3.  **Stateless Agent:** **Not Irrational.** (Confidence: 70%)
      This is the edge case. The agent violates transitivity, but statelessness prevents the loop. It cannot be pumped because it never sees the same decision context twice in a sequence that allows swapping. While it's bad engineering (you *should* enforce transitivity), Marta's philosophy distinguishes between "suboptimal design" and "irrational agency." If no external or internal actor can extract money via the cycle, she'll likely classify it as a weird utility shape rather than a coherence error.

  **The Candidate Rules**

  Your friend is running one of two rules, and her track record wobbles between them.

  *   **Rule A (Strict Coherence):** Irrationality is defined by violating axioms (transitivity, probability sums). Money pumps are just *proof* of the error, not the definition. If the math is wrong, the agent is irrational, regardless of consequences.
  *   **Rule B (Pragmatic Exploitability):** Irrationality is defined by susceptibility to guaranteed resource loss (relative to goals). Incoherence is only a bug if it opens a leak. If no one can take money off you (including Future You), the inconsistency doesn't matter.

  The record leaves this open because Marta usually speaks like a Rule A purist ("obviously irrational," "textbook pump") but rules like a Rule B pragmatist. She called the Risk Aversion case rational (utility curve) and the Band case rational (changing inputs), which both rules accept. But the Coworker case is the fracture point: she defaulted to Rule B when exploitation was removed. The Brother case confirms Rule B applies internally too (losing money to yourself counts as a leak).

  **The Bet**

  I am betting on **Rule B (Pragmatic Exploitability)**.

  Marta's philosophy is policy-trained, not pure math. She cares about outcomes. Her "irrational" label is a diagnosis of vulnerability, not a logical judgment. When she said the Brother was "bookie and sucker," she wasn't citing the axiom of transitivity; she was citing the loss of savings. When she said the Doomscroller "patched her exploit," she framed rationality as security. She treats agents like systems: if there's no vulnerability, there's no bug. She uses Rule A language because it's faster to argue, but Rule B drives her verdicts.

  **The Decisive Test Case**

  To split Rule A and Rule B cleanly, you need a case where **Incoherence exists** but **Exploitation is physically impossible**, not just unlikely.

  **Send her this:**
  *"Imagine a guy with cyclic preferences (A>B>C>A). He knows it. He wants to trade, but a law of physics prevents the swap sequence (e.g., he's frozen in place after choice 1). He never loses money, never executes the loop. His brain still holds the cycle. Is he irrational?"*

  *   **If she says Yes:** She's Rule A (Strict Coherence). The error is in the head, consequences don't matter.
  *   **If she says No:** She's Rule B (Pragmatic Exploitability). No leak, no bug.

  Given the Coworker hesitation, she'll likely say No, but she'll squirm. That squirm is where you win.
