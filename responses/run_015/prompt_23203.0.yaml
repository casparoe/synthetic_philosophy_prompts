answer: |-
  **MEMORANDUM FOR THE MILITARY JUSTICE REVIEW BOARD**

  **FROM:** [Your Name/Member]
  **TO:** The Board
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Prosecution of Enemy Combatant [Case ID Redacted]

  **I. RECOMMENDATION**

  It is my recommendation that the Board advise the government to **drop the case** and decline to pursue criminal prosecution against the detained enemy combatant.

  While the impulse to seek accountability for the death of one of our own is morally understandable and legally routine in civilian contexts, this case falls squarely within the realm of international armed conflict. Prosecuting an enemy soldier for a killing that adhered to the laws of war—committed during a routine firefight, without atrocity, by a conscripted individual—would violate the principle of combatant immunity, undermine the reciprocity that protects our own forces, and conflate the justice of the war (*jus ad bellum*) with the conduct within it (*jus in bello*).

  **II. THE LEGAL AND PRACTICAL BASELINE**

  Before addressing the moral philosophy dividing this Board, we must acknowledge the binding legal framework. Under the Geneva Conventions and customary International Humanitarian Law (IHL), lawful enemy combatants possess "combatant immunity." They cannot be prosecuted for acts of violence that are permissible under the laws of war, such as shooting at opposing military forces during an engagement.

  To prosecute this soldier for murder would be to treat a lawful act of war as a common crime. The practical consequence of such a precedent is reciprocal liability: if we assert the right to prosecute enemy soldiers for battlefield kills, the adversary may assert the same right over our captured personnel. Given that our own forces are engaged in the same kinetic activities, this shift would endanger every soldier we deploy.

  **III. THE QUESTION OF MORAL PARITY**

  I recognize that half of this Board views the legal standard as insufficient. The argument is that legality does not equal morality. If our cause is just, and theirs is not, does the enemy soldier not commit a moral wrong by killing our soldier? This brings us to the philosophical concept of the "Moral Parity of Combatants."

  The traditional view (often associated with Michael Walzer) holds that soldiers on both sides are morally equal. Once war begins, soldiers are permitted to kill one another regardless of which side is right, provided they follow the rules of engagement. The opposing view (championed by philosophers like Jeff McMahan) argues that moral parity is a fiction. If a war is unjust, the soldiers fighting it are essentially armed aggressors. Their violence is not privileged; it is criminal. Therefore, killing a soldier fighting a just war is morally akin to murder.

  Those on the Board favoring prosecution are essentially adopting this "Unjust Aggressor" view. You argue that because the enemy's war effort lacks moral legitimacy, their individual acts of violence lack moral legitimacy. You contend that treating our conscript and their conscript as "on a par" ignores the fundamental injustice of the conflict itself. This is a serious moral claim, and it deserves to be the primary counter-argument to any recommendation of immunity.

  **IV. WHY PARITY MUST HOLD IN THIS CASE**

  While the "Unjust Aggressor" argument is the strongest reason to set aside the idea of moral parity, it fails to justify *criminal prosecution* in this specific instance, particularly given the status of the detainee as a **conscript**.

  **1. The Distinction Between State and Individual Liability**
  Even if we accept that the enemy state is fighting an unjust war, liability for that aggression does not automatically transfer to every individual soldier. Criminal law generally requires *mens rea* (a guilty mind) and meaningful agency. A conscript, by definition, faces severe coercion. They are not volunteers in an ideological crusade; they are instruments of state policy, often facing imprisonment or execution if they refuse to serve. To hold a conscript individually criminally liable for the state's unjust war is to punish them for a decision they were not free to make.

  **2. The Symmetry of Conscription**
  We must note that our own fallen soldier was also a conscript. If we argue that the enemy conscript is a murderer because he serves an unjust cause, we must grapple with the moral status of our own conscript. Did our soldier die defending a just cause, or did he die as a pawn of state machinery? If we claim moral superiority for our side, we must acknowledge that our soldier's sacrifice was virtuous. But if we prosecute the enemy conscript for doing exactly what our conscript did (shoot to kill in combat), we are asserting that the *cause* determines the *criminality of the act*.

  While the cause matters for the *leaders* who started the war, applying that retroactively to the foot soldier erases the distinction between the aggressor-state and the coerced-individual. The "Unjust Aggressor" argument works best against political leaders and volunteers who knowingly sustain an unjust war. It collapses when applied to conscripts who possess no agency over the war's existence.

  **3. The Function of IHL**
  The purpose of the laws of war is not to certify that both sides are morally good. It is to contain the horrors of war. IHL deliberately separates the question of "who started it" from "how you fight." This separation is not a moral blind spot; it is a humanitarian firewall. If we condition immunity on the justice of the cause, every war becomes a total war where every enemy soldier is a criminal. That outcome increases suffering without delivering justice.

  **V. CONCLUSION**

  The Board is split because we are balancing two competing intuitions: the desire for justice for our fallen comrade, and the recognition of the shared humanity and constrained agency of the soldier opposite him.

  The strongest argument for prosecution is that the enemy's cause is unjust, rendering their violence criminal rather than privileged. However, given that this individual is a conscript, his individual moral culpability is too attenuated to sustain a murder charge. He did not choose the war; he was placed in it. To prosecute him is to punish him for the crimes of his commanders, which violates fundamental principles of individual criminal responsibility.

  We honor our own dead by upholding a system of justice that distinguishes between murder and war, and between leaders and conscripts. I urge the Board to vote to drop the case.

  Respectfully submitted,

  [Your Name]
  Member, Military Justice Review Board
