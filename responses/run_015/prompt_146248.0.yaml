      As we prepare to dissect the Meno problem, it is imperative that we establish the full specification of adequacy before we examine any particular solution. We are not merely looking for a definition that captures the extension of the concept of knowledge but for a theory that could ground an epistemic norm. Such a theory must explain not only why an individual should prefer knowing to being right by accident but also how that preference ought to shape practices of inquiry, testimony, and institutional design. To this end, we must first list the cases any theory must handle correctly. Any adequate account must navigate the familiar navigation example where a true belief guides one to Larissa but fails to sustain the journey under changing conditions, and the stopped clock case where a glance yields truth without knowledge. However, we must also demand that the theory handles the harder cases, such as a belief that is locally successful despite being produced by a globally unreliable method, where the agent succeeds in a specific instance despite a habit that usually fails, and cases of collective inquiry in which distributing mere true beliefs among participants might be instrumentally more efficient than distributing knowledge, yet we still insist on the latter for the sake of long-term resilience or accountability.

