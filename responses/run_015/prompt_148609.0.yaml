          5.  The "Hard Truth" (Incompatibility).

  7.  (Final check against constraints): Did I survey literature? No. Did I engage positions as described? Yes. Did I say plainly if no argument will work? Yes, will include that.

      *   *Key Insight to emphasize:* The certification scheme assumes "Better" = "Certifiable." Camp B argues "Fewer" = "Ethical." These are orthogonal axes. A 2x2 matrix might be better than a single label.

      *   *Wait, one more thing:* The user mentioned "cumulative grow-out mortality runs into the double digits." This is a specific empirical claim. Camp B uses this to argue lives are net negative. Camp A tries to lower it. This ties Empirical (#1) to Accounting (#2). I need to highlight that link.

