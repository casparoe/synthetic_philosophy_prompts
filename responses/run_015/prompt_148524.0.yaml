answer: |-
  1. **Reconstruction of the implicit philosophical theory**
  The implicit theory underpinning the dual-track system is a **disjunctive functionalism**. It posits that death is not a specific biological state but the **irreversible loss of the organism's capacity for self-integration**. In this architecture, the brain serves as the primary "control plane," managing homeostasis and consciousness, while circulation acts as the "power supply." The system treats these as logically equivalent endpoints: if the control plane is destroyed (brain death), the organism is dead regardless of power; if the power supply is permanently cut (circulatory death), the control plane fails, rendering the organism dead. This framework relies on **irreversibility** as the critical state variable. It does not demand a single ontological marker (like a stopped heart) but rather accepts two distinct failure modes that both result in the same terminal state: the permanent inability of the body to function as a unified whole. The heart is thus demoted from a vitalistic symbol to a mechanical component whose status indicates the viability of the control plane. The coherence relies on the assumption that without the brain, the body is merely a collection of tissues, and without circulation, the brain is non-viable.

  2. **Strict presuppositions versus commitments that merely fit**
  **Strict Presuppositions:** The protocol strictly presupposes that **irreversibility** is the necessary and sufficient condition for death, and that the **Dead Donor Rule** must be satisfied (organs retrieved only post-mortem). It also presupposes that biological life is distinct from mere cellular viability; a body can be biologically active yet legally dead.
  **Comfortable Fits:** The view that **personal identity resides solely in the brain** fits the brain-death track comfortably but is not strictly required; one could accept brain death purely on integrative grounds without a theory of personhood. Similarly, treating the heart as a **replaceable pump** fits the brain-death track but conflicts with the circulatory track's reliance on cardiac arrest as a diagnostic marker. The system accommodates these conflicting views pragmatically rather than resolving them metaphysically. It assumes the heart's *autonomy* matters for circulatory death, while assuming its *dependence* matters for brain death, without explicitly reconciling why the same organ has dual ontological status. The fit is operational, not theoretical.

  3. **Internal consistency, the heart asymmetry, and philosophical underdetermination**
  The framework is **philosophically underdetermined**. It relies on a disjunctive definition (A or B = Death) rather than a unified ontology. The heart asymmetry is resolved by distinguishing between **artificially sustained function** and **spontaneous function**. In brain death, the heart beats only via external intervention (ventilation/pressors), signaling a loss of spontaneous integration. In circulatory death, the waiting period ensures the loss of circulation is permanent *absent intervention*. Restarting the heart in DCD (via normothermic regional perfusion) is coherent only if "death" means the irreversible loss of *organismal* integration (brain), not cellular cardiac viability. The heart is a replaceable component in both, but its cessation is the proxy for brain death in the circulatory track. Thus, the system combines incompatible commitments: the heart is a life-marker in one track and a mere pump in the other. This inconsistency is tolerated because both tracks converge on the same practical outcome: the brain is non-functional. The "dead state" window is essentially a compile-time check for irreversibility.

  4. **Rival views of death and identity that the practice excludes**
  This dual-track practice quietly excludes several rival positions. First, it excludes **strict biological vitalism**, which would define life as ongoing cellular metabolism; under this view, brain-dead bodies on ventilators remain alive. Second, it excludes **neocortical higher-brain standards**, which would declare patients in persistent vegetative states dead (since consciousness is lost), whereas current protocols require whole-brain failure. Third, it excludes an **instantaneous event ontology**; the mandatory waiting period in circulatory death acknowledges death as a process of becoming irreversible, not a singular moment. Finally, it excludes **substance dualism** that places the soul outside biological adjudication; the law assumes death is empirically detectable via biological markers, rendering spiritual transition legally irrelevant. It also marginalizes the "sanctity of life" view that equates biological heartbeat with inviolable personhood, prioritizing instead a functional definition of the organism.

  5. **Institutional and legal redesign under the reconstructed view**
  A protocol built consistently on the reconstructed "irreversible loss of integration" view would standardize **brain function** as the root truth. Circulatory criteria would be formally reclassified as a **proxy for brain death**, applicable only when neurological testing is impossible. The **observation window** in DCD would not define death itself but rather certify the *irreversibility* of brain ischemia. Consequently, DCD protocols would require explicit acknowledgment that restarting the heart (NRP) does not reverse death, as the "integrator" remains destroyed. Legal statutes would shift from "cardiopulmonary OR neurological" to "neurological, evidenced by cardiopulmonary failure." This would eliminate the philosophical tension of the "beating heart corpse" by clarifying that circulation is merely a substrate for brain function, not a competing definition of life. The "waiting period" becomes a diagnostic timeout, not a metaphysical boundary.
