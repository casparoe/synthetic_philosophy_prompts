answer: |-
  **Proposal: The Ethics of Interpretive Labour**
  **Course:** Language and Ethics
  **Student:** [Name]
  **Date:** [Date]

  **Research Question**
  In communicative contexts lacking shared pragmatic conventions, does the ethical imperative to minimize unfair hearer burden privilege direct speech over indirect politeness strategies?

  **Background and Problem Statement**
  Current debates regarding "white lies" and politeness in moral philosophy and pragmatics tend to stall around a binary: the deontological prohibition against falsity versus the consequentialist or virtue-ethical allowance for tact. Simultaneously, pragmatic frameworks (Gricean maxims, Brown & Levinson's Face Theory) analyze indirectness as a mechanism for cooperation or face-saving. However, both frameworks focus primarily on the *speaker's* intent (to deceive or to protect) or the truth-value of the proposition. They overlook the distribution of *post-utterance work*.

  When a speaker chooses directness (e.g., "This report is inadequate"), the hearer bears the cost of emotional regulation (affective labour). When a speaker chooses indirectness (e.g., "This might need some work"), the hearer bears the cost of decoding the intended meaning (interpretive labour), while the speaker retains plausible deniability. The standard assumption is that interpretive labour is a fair price for affective safety. This paper challenges that assumption. Indirectness functions as a coordination device reliant on shared conventions. In heterogeneous settings (multicultural contexts, strangers), where these conventions are not shared, indirectness may impose excessive interpretive labour without delivering the promised affective safety. Thus, directness may become the more respectful option, not despite its bluntness, but because it minimizes unfair cognitive burden.

  **Methodology**
  As this is a normative inquiry rather than an empirical one, the method will be conceptual analysis using constructed cases (vignettes). Empirical methods (surveys, corpus linguistics) are unsuitable because the question concerns ethical *obligation*, not frequency or psychological impact alone. Philosophical vignettes allow for the isolation of variables (shared convention vs. lack thereof; high stakes vs. low stakes) to test the weight of the labour burden.

  *   **Weeks 1–3: Framework Construction.** Define "affective labour" and "interpretive labour" within existing pragmatic literature. Establish criteria for "unfair burden."
  *   **Weeks 4–6: Case Construction.** Develop paired vignettes. Each pair involves the same communicative goal (e.g., refusing a request, critiquing work) but varies the context (shared cultural convention vs. heterogeneous context) and the strategy (direct vs. indirect).
  *   **Weeks 7–9: Stress Testing.** Apply the labour model to counterexamples. Does the model hold in power-asymmetric relationships (e.g., employer-employee)? Does it hold in high-stakes safety contexts? Refine the claim if the "labour" vocabulary merely redescribes existing politeness norms without explanatory power.
  *   **Weeks 10–12: Drafting and Revision.** Synthesize findings into a 5000-word argument. Ensure the conclusion offers a determinate answer to the research question.

  **Addressing Anthropological Risks**
  A significant risk in this topic is essentialism (e.g., "The Dutch are direct," "The Japanese are indirect"). To avoid collapsing into shaky anthropology, this paper will not treat national cultures as empirical variables. Instead, "Direct" and "Indirect" regimes will be treated as *idealized pragmatic systems* defined by the density of shared conventions. The claim is not about nationality, but about *common knowledge*. The argument holds that whenever common knowledge is low (regardless of nationality), the ethical cost of indirectness rises. This precisifies the seminar's casual observation that "indirectness is respect" is a conversation-ender; it is only respect when the code is shared.

  **Deliverable**
  A 5000-word argumentative paper. The structure will be: (1) Introduction of the labour distribution problem; (2) Critique of current truth/face frameworks; (3) Presentation of the labour model; (4) Application to heterogeneous contexts via vignettes; (5) Objections and limitations; (6) Conclusion answering the research question.

  **Scope and Limitations**
  *   **Too Big for 5000 Words:** I will not attempt to construct a full moral theory of communication. The scope is limited to assertives and directives (refusals/critiques). I will not address empirical questions of integration policy or linguistic relativism.
  *   **Why This Method:** Comparative case analysis is chosen over historical exegesis because the goal is to advance a specific normative claim about heterogeneous societies, not merely to summarize existing debates on lying.

  **Failure Conditions**
  This project would count as a failure if:
  1.  **Redescription:** The "labour" distinction proves to be merely a synonym for "politeness" without adding explanatory power regarding *why* a specific strategy is unethical in a specific context.
  2.  **Collapse of Distinction:** If affective and interpretive labour cannot be cleanly distinguished in the constructed cases (e.g., if decoding indirectness *is* emotionally taxing, merging the two costs).
  3.  **Power Blindness:** If the model cannot account for cases where the hearer lacks the social power to demand clarity (e.g., a subordinate cannot ask a boss to be direct), rendering the "unfair burden" argument moot.
  4.  **Indeterminate Answer:** If the analysis concludes that the costs are incommensurable, leaving the research question unanswered. The paper must argue for a presumption either way in heterogeneous contexts.

  **Preliminary Hypothesis**
  I anticipate arguing that in the absence of shared pragmatic conventions, the speaker bears a derivative duty to minimize interpretive labour, even at the cost of increased affective labour. This flips the standard politeness imperative: in diverse societies, directness is not rudeness, but a requirement of equitable communicative labour.
