answer: |-
  1. Quine acknowledges that some beliefs are more central than others in the web of belief, yet he denies this centrality constitutes analyticity. You claim structural analyticity is different. Is this difference merely one of degree—extreme centrality—or is it a difference in kind?
  **Follow-up:** If she argues it is a difference in kind, press: What non-arbitrary feature marks this kind boundary without appealing to the very notion of analyticity you are trying to rehabilitate?

  2. Quine accepts that we choose logic and mathematical frameworks based on pragmatic utility. If your structural principles are selected solely for their coordinating function within a module, doesn't this collapse into the pragmatic conventionalism Quine himself endorsed?
  **Follow-up:** If she denies it is pragmatic, press: On what grounds do you justify retaining these principles if not their utility in organizing experience, and how is this ground not itself empirical?

  3. Mathematical truths seem to fit your modular insulation perfectly, as they are rarely revised by direct observation. However, given Quine's indispensability argument, doesn't the empirical success of science confirm mathematical truths, thereby rendering them synthetic on your own definition?
  **Follow-up:** If she insists math is structurally analytic, press: How do you account for the historical revision of mathematical frameworks (e.g., the shift to non-Euclidean geometry) without admitting empirical pressure played a direct role in that overturning?

  4. Quine's second dogma rejects reductionism, but his holism implies any statement can be revised given enough adjustment elsewhere. If we reject not just reduction sentence-by-sentence but any local-to-global inference pattern to protect your structural claims, does the distinction survive, or does this merely relocate the reductionism to the module level?
  **Follow-up:** If she argues modules are the new atomic units, press: How does evidence touch the module without touching the statements, given that modules are constituted by those very statements?

  5. Is the structural role you describe a descriptive fact about human cognitive architecture, or a normative constraint on rational inquiry?
  **Follow-up:** If she says descriptive, press: Doesn't this make analyticity contingent on human psychology, vulnerable to empirical falsification? If she says normative, press: What is the source of this norm if not empirical success?

  6. You argue empirical evidence can only dislodge a claim by overturning an entire module. How do we individuate these modules without relying on the semantic boundaries you claim to avoid?
  **Follow-up:** If she appeals to functional clustering, press: Isn't functional clustering itself an empirical hypothesis about belief systems, subject to the same holism you are trying to constrain?

  7. If direct empirical encounter cannot revise structural claims, what specifically triggers a module overhaul? Is it internal inconsistency or pragmatic failure?
  **Follow-up:** If she says pragmatic failure, press: Doesn't this admit that the ultimate tribunal is empirical utility, rendering the analytic label epistemically idle rather than constitutive?

  8. You reject synonymy to avoid circularity, but you call these claims "coordination principles." Doesn't this smuggle meaning constitutivity back in under the guise of functional role?
  **Follow-up:** If she distinguishes role from meaning, press: Can you give an example where the functional role changes but the meaning stays the same, or vice versa, without begging the question?

  9. Please avoid the deflection that "the boundary is fuzzy but still useful." What specific evidential scenario would actually force you to reclassify a paradigmatic structural analytic statement, such as the law of non-contradiction, as synthetic?
  **Follow-up:** If she claims no such scenario exists, press: Doesn't this imply principled immunity, contradicting your initial concession to Quine that these truths are revisable in principle?
