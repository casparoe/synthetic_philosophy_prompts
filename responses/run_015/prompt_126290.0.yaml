answer: |-
  # Joint Statement on Aggregate National Differences
  **Marta Reuter & Tobias Lenz**

  ### I. Points of Agreement

  We disagree on the validity and utility of treating national averages as explanatory variables, but we agree on the following premises:

  1.  **Rejection of Essentialism:** There is no evidence for fixed, biological, or immutable "national souls." Claims about national character describe contingent, aggregate statistical properties, not intrinsic individual essences.
  2.  **Distributional Overlap:** In any trait where national differences are observed, the within-country variation is large and the distributions between countries overlap significantly. No claim about a national average justifies assumptions about any specific individual.
  3.  **Historical Precedent:** Research programs comparing nations on psychological or behavioral traits have historically been entangled with colonial, racist, or nationalist projects. This history imposes a heightened burden of care on current researchers.
  4.  **Statistical Rigor:** P-hacking, selective reporting, and post-hoc hypothesis generation are unacceptable. Research designs should be pre-registered where possible, and uncertainty must be reported transparently.
  5.  **Policy Prohibition:** Aggregate national data should not be used to justify discriminatory policy against individuals or to assign collective guilt.
  6.  **Measurement Validity:** Cross-national survey instruments often suffer from measurement non-invariance (e.g., response styles differ by culture). Claims relying on unadjusted raw scores are unreliable.

  ### II. Statement of Disagreements

  | Issue | Reuter's Formulation | Lenz's Formulation |
  | :--- | :--- | :--- |
  | **The Unit of Analysis** | Countries are functional administrative units with distinct legal and institutional environments. Treating them as fixed effects or clusters is a pragmatic necessity for modeling policy-relevant outcomes. | Countries are historically contingent, porous, and internally heterogeneous categories. Treating them as discrete units reifies arbitrary borders and obscures the actual causal mechanisms (language, religion, law) that cut across them. |
  | **Statistical Inference** | Country-level means are population parameters that can be estimated with error. Standard errors reflect uncertainty in measurement and sampling of individuals, which is sufficient for inference about aggregate relationships. | There is no super-population of countries from which the observed set is drawn. Therefore, standard errors attached to "country effects" lack a frequentist interpretation. The analysis is purely descriptive, not inferential. |
  | **Explanatory Power** | Even small average differences, when aggregated over millions of people, generate substantial variance in institutional quality, economic growth, and public compliance. Ignoring this signal reduces predictive accuracy. | The variance explained by national labels is mostly proxying for unmeasured historical or institutional confounders. Attributing explanatory power to "national character" risks circular reasoning (e.g., "high trust causes good institutions" when both stem from the same history). |
  | **Ethical Responsibility** | Scientists cannot control how bad actors misuse data. Withholding valid findings due to fear of misinterpretation cedes ground to ideology and impedes scientific progress. | Scientists are responsible for the foreseeable uptake of their work. If a claim is reliably interpreted as essentialist by the public or policymakers, publishing it without stronger safeguards is negligent, regardless of the technical hedging. |

  ### III. Cruxes

  We identify three specific points where our disagreement is substantive, not merely semantic. For each, we propose a test or argument that would bear on the resolution, and state our *a priori* predictions.

  **Crux 1: The Sampling Frame Objection**
  *   **The Question:** Is the lack of a "super-population" of countries fatal to inference, or does it merely require a shift from inferential statistics to descriptive modeling of a fixed set?
  *   **Proposed Test:** A simulation study where the "true" data-generating process is known. We will generate data for a fixed set of 50 units (analogous to countries) with known parameters and no underlying "population" of units. We will then apply Reuter's standard modeling approach and Lenz's descriptive constraints to see if Reuter's approach yields false positives regarding the relationship between the unit-level trait and an outcome.
  *   **Reuter's Prediction:** The standard approach will recover the known parameters within acceptable confidence intervals. The "no sampling frame" objection is a technicality that does not invalidate the estimation of the relationship within the observed set.
  *   **Lenz's Prediction:** The standard approach will produce confidence intervals that imply a precision that does not exist. The model will attribute significance to noise because it treats the fixed set as a random sample. The relationship will appear robust statistically but will be ontologically uninterpretable.

  **Crux 2: The Hedging Trade-off**
  *   **The Question:** Does hedging a claim sufficiently to meet ontological objections (e.g., "In this specific historical period, among respondents answering in this specific way...") render the claim too weak to perform explanatory work?
  *   **Proposed Test:** We will co-author two abstracts summarizing the same finding. One will use standard social science phrasing (Reuter's preference); the other will include rigorous ontological hedges (Lenz's preference). We will survey policy analysts and journalists to measure (a) perceived credibility and (b) perceived actionability.
  *   **Reuter's Prediction:** The hedged version will be rated as significantly less actionable without a commensurate increase in perceived credibility. The loss of utility will outweigh the gain in precision.
  *   **Lenz's Prediction:** The standard version will be rated as more actionable but will also show significantly higher rates of essentialist inference by readers. The hedged version will preserve credibility among experts without losing actionability among informed practitioners.

  **Crux 3: The Uptake Question**
  *   **The Question:** Is the "misuse" of aggregate claims an empirical variable that can be mitigated, or is it an invariant cost of publication?
  *   **Proposed Test:** A pre-registered experiment presenting lay readers with a news article based on national difference research. Treatment A includes standard academic hedges; Treatment B includes explicit "warning labels" about within-country variation and essentialism. We will measure the rate of essentialist inference (e.g., "Individual X from Country Y is likely to behave Z").
  *   **Reuter's Prediction:** Treatment B will significantly reduce essentialist inferences compared to a control, demonstrating that uptake is sensitive to framing. The risk of misuse is manageable.
  *   **Lenz's Prediction:** There will be no statistically significant difference between Treatment A and Treatment B in the rate of essentialist inference. Once a national label is introduced, readers revert to stereotypes regardless of warnings. The risk of misuse is structural.

  ### IV. Note on Verbal Dispute

  We acknowledge that part of our disagreement rests on the definition of **"explanation."**

  *   **Reuter** uses the term to mean *predictive leverage*: if knowing the country mean improves the fit of a model predicting an aggregate outcome, the trait explains variance.
  *   **Lenz** uses the term to mean *causal mechanism*: unless the "national character" variable can be disentangled from the institutional and historical factors that produced it, it describes a pattern rather than explaining a cause.

  We do not expect to resolve this definition in this document. We note, however, that if Reuter's claims are interpreted strictly as *descriptive predictions* rather than *causal explanations*, Lenz's objection regarding confounding loses force, while Reuter's claim regarding policy utility becomes weaker.

  ***

  **Signed,**

  **Marta Reuter**
  **Tobias Lenz**
