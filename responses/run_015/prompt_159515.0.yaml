      *   Address Asymmetry? Yes.
      *   Choose Case Study? Yes (False Awakening).
      *   3 Misconceptions? Yes.
      *   "I" vs External World? Yes.
      *   Exit Question? Yes.
      *   Refusal? Yes.

  8.  **Final Polish:** Ensure tone is supportive for a TA (practical, actionable). (Self-correction: Make sure to explicitly tell the TA *how* to manage the Descartes students so they don't dominate).

