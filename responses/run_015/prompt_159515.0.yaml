prompt: |-
  I'm a TA for the intro Chinese philosophy course and on thursday I've got to run a 50-min tutorial on the butterfly passage, the bit where Zhuang Zhou wakes up and says he doesnt know whether he's Zhou who dreamt he was a butterfly or a butterfly now dreaming it's Zhou. About half the students read Descartes' First Meditation last term and half havent, and I can already tell half the room will go "oh, it's just the dream argument again" and switch off. So don't explain the passage to me, plan how I'd teach it. What has to be in place before the question "am I dreaming right now?" even bites for them, and why the move I keep wanting to make myself — we only ever correct dreams from the waking side, never the other way round, so waking wins by default — doesnt actually settle anything, given that from inside a dream the very same asymmetry seems to hold. Which one case should carry the whole session: I'm torn between lucid dreams, where you know you're dreaming while still in it, and false awakenings, where you seem to wake up inside the dream — and why not just one really vivid ordinary dream. The three misconceptions I expect: that this is Descartes in chinese costume, that it's relativism about truth, that it's really the hard problem of consciousness — and where in the sequence to head off each. Also whether the worry is about the external world at all, or about which one he is, since the "I" survives Descartes' version intact and seems not to survive this one. Plus a question to end on that tells me whether it landed, and one thing I should openly refuse to get into in 50 minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intro Chinese Philosophy course.
      *   **Task:** Plan a 50-minute tutorial on Zhuangzi's Butterfly Passage.
      *   **Constraint 1 (Student Background):** 50% read Descartes' First Meditation last term, 50% haven't. Risk: The Descartes group will dismiss it as "just the dream argument" and disengage.
      *   **Constraint 2 (Content):** Do not explain the passage (assume I know it). Focus on *how* to teach it.
      *   **Constraint 3 (Philosophical Depth):** Address why the "waking corrects dreaming" asymmetry doesn't settle it (because dreams simulate that asymmetry).
      *   **Constraint 4 (Case Study):** Choose between Lucid Dreams, False Awakenings, or Vivid Ordinary Dreams to carry the session.
      *   **Constraint 5 (Misconceptions):** Address three specific misconceptions:
          1.  It's just Descartes in Chinese costume.
          2.  It's relativism about truth.
          3.  It's the Hard Problem of Consciousness.
      *   **Constraint 6 (Core Worry):** Is it about the external world (skepticism) or about the self/identity (transformation)? Note the "I" survives Descartes but maybe not Zhuangzi.
      *   **Constraint 7 (Assessment):** A closing question to check understanding.
      *   **Constraint 8 (Exclusion):** One thing to explicitly refuse to discuss (time management).

  2.  **Deconstruct the Philosophical Core:**
      *   *Descartes:* Skepticism about the *world*. Goal: Find indubitable foundation (*Cogito*). The "I" is the anchor.
      *   *Zhuangzi:* Transformation of *things* (wu hua). Goal: Liberation from fixed perspectives. The "I" is fluid.
      *   *The "Asymmetry" Problem:* The user notes that saying "waking corrects dreams" fails because dreams feel like waking. This points to the lack of a "God's eye view."
      *   *The Case Study:*
          *   *Vivid Ordinary Dream:* Too easy to dismiss as "just a dream."
          *   *Lucid Dream:* Interesting, but implies control/knowledge *within* the dream, which might muddy the "not knowing" (bu zhi) aspect.
          *   *False Awakening:* This is the winner. It directly attacks the "waking corrects dreaming" asymmetry. You "wake up" in the dream, think you're safe, then wake up for real (or maybe not?). It mirrors the Zhuangzi structure (State A -> State B -> Uncertainty about which is real).

  3.  **Drafting the Plan - Section by Section:**

      *   **Opening (5 mins):** Need to hook them immediately and separate Zhuangzi from Descartes. Don't start with "Who read Descartes?" Start with the experience.
      *   **Addressing Misconception 1 (Descartes Clone):** Do this early. If they think it's skepticism about the external world, they miss the point. It's about *identity* and *perspective*.
      *   **The Core Activity (20 mins):** The Case Study. I need to justify *False Awakenings*. It creates the phenomenological symmetry the user is looking for.
      *   **The Asymmetry Objection (10 mins):** Address the user's specific worry: "Waking wins by default." Show why False Awakenings break this.
      *   **Addressing Misconceptions 2 & 3 (Relativism & Hard Problem):** Weave these into the discussion of the core activity. Relativism implies "both are true," Zhuangzi implies "the distinction is the problem." Hard Problem is about *qualia*, Zhuangzi is about *transformation*.
      *   **The "I" Question:** Explicitly contrast the *Cogito* "I" with the Zhuangzi "I".
      *   **Closing (5 mins):** The assessment question and the "Out of Bounds" topic.

  4.  **Refining the Strategy (Self-Correction/Iterative Thinking):**
      *   *Correction on Misconceptions:* Don't lecture on misconceptions. Embed them in the discussion prompts. If I say "It's not relativism," they hear "Don't think that." If I ask "Is Zhuangzi saying both are true?" they figure it out.
      *   *The Descartes Split:* How to handle the 50/50 split? Use the Descartes readers as a resource but limit their dominance. Ask them: "What was Descartes trying to save? What is Zhuangzi trying to loosen?"
      *   *The Asymmetry:* The user's insight is crucial. "From inside a dream, waking seems real." I need a specific prompt for this.
      *   *Case Study Decision:* False Awakenings are best because they replicate the *structure* of the butterfly passage (State 1 -> State 2 -> Confusion). Lucid dreams imply too much agency. Ordinary dreams are too easily dismissed.
      *   *The "Out of Bounds":* Neuroscience of sleep? Textual history of the *Inner Chapters*? No, keep it philosophical. "Neuroscience" is the trap. Or "What Zhuangzi *really* meant historically." Let's go with Neuroscience/Physics of reality—it's a time sink.

  5.  **Finalizing the Plan Structure:**
      *   **Title:** Transformation, not Skepticism.
      *   **Goal:** Shift from "Which is real?" to "Why does the distinction bind us?"
      *   **Timeline:**
          *   0-5: Warm-up (Phenomenology).
          *   5-15: Descartes vs. Zhuangzi (The "I").
          *   15-35: The False Awakening Case (The Asymmetry).
          *   35-45: Misconceptions (Relativism/Consciousness).
          *   45-50: Exit Ticket & Boundary.

  6.  **Fleshing out the Details (incorporating user's specific constraints):**
      *   *Misconception 1 (Descartes):* Address in the first 15 mins via the "I" comparison.
      *   *Misconception 2 (Relativism):* Address during the Case Study. Is it "both are true" or "the distinction is rigid"?
      *   *Misconception 3 (Hard Problem):* Address near the end. It's not "how does brain make mind," it's "how do I flow with change."
      *   *The Asymmetry:* Use the False Awakening to show that "waking" is just another state *inside* the experience.
      *   *Exit Question:* Needs to test if they get the *transformation* aspect, not just the skepticism.
      *   *Refusal:* "Is the world real?" (Metaphysics) vs "How do we live?" (Ethics/Dao). Let's refuse the "Scientific verification" angle.

  7.  **Review against constraints:**
