answer: |-
  ### Executive Summary: Strategic Ranking

  For a three-year conceptual programme on the causal inertness of experience, your resources must target the logical bottlenecks that determine whether the position is coherent, defensible, or distinct from its rivals. Based on upstream dependency, tractability within a conceptual framework, and downstream impact on the viability of dualism, I recommend the following ranking.

  **1. The Scope Question (Specifically the Argumentative Generalisation)**
  **2. The Constitutive/Acquaintance Reply**
  **3. The Tracking/Surrogate Analysis (incorporating Common-Cause)**

  Below is the defence of this ranking, a critique of your map, and the operational dependencies for the programme.

  ---

  ### 1. Defence of the Ranking

  **Priority 1: The Scope Question (The Viability Constraint)**
  *   **Reasoning:** This is the most upstream item. If the "Argumentative Generalisation" holds—i.e., if the conceivability and knowledge arguments that motivate epiphenomenalism are themselves undermined by the thesis that phenomenal facts play no causal role in our judgments—then the research programme investigates a self-refuting position.
  *   **Tractability:** High. This is a logical and epistemic analysis, not a metaphysical construction. It requires formalising the conditions under which a belief is "warranted" versus "caused."
  *   **Downstream Impact:** Decisive. If the Scope Question yields a negative result (the view is self-undermining), the project pivots to a critique of anti-physicalist arguments. If positive, it clears the ground for the remaining two years.
  *   **Criteria Applied:** *Upstreamness.* You cannot build a theory of warrant (Line 2) or knowledge (Line 3) if the act of theorising is itself unwarranted.
  *   **Epistemic Status:** *Contested.* It is settled that epiphenomenalism faces the judgment problem (Chalmers 1996). It is *not* settled whether the self-undermining objection is fatal. Chalmers argues it is not (judgments are physically caused, hence reliable); critics (e.g., Vahid, some causal theorists of knowledge) argue that without causal contact with the truth-maker, warrant is impossible. Your "Argumentative Generalisation" is a sharper formulation of this live dispute.

  **Priority 2: The Constitutive/Acquaintance Reply (The Positive Account)**
  *   **Reasoning:** If the position survives the Scope test, you need a positive account of how judgment is warranted without causation. The Tracking reply (Line 3) secures *truth* but struggles with *warrant* (Gettier-style luck). Acquaintance is the only traditional route to non-causal warrant.
  *   **Tractability:** Moderate. This requires precise metaphysical work on the relation between subject, experience, and concept. It fits a 3-year timeline if bounded to the "dividing question" you identified (causal vs. modal vs. *sui generis*).
  *   **Downstream Impact:** High. If Acquaintance can be made coherent without collapsing into interactionism, it saves non-physicalist dualism from the charge of irrationality. If it fails, dualism retreats to illusionism.
  *   **Criteria Applied:** *Downstream Impact.* This determines whether dualism is a rational option or merely a conceivable one.
  *   **Epistemic Status:** *Contested.* Acquaintance is widely invoked but rarely defined with sufficient precision to satisfy physicalist critics. Whether it is a causal relation disguised is a live wire.

  **Priority 3: The Tracking/Surrogate Analysis (The Negative Constraint)**
  *   **Reasoning:** This line serves to stress-test the first two. By rigorously applying your **Perturbation Test** to the Tracking and Common-Cause replies, you can demonstrate *why* Acquaintance is necessary. If Tracking fails the Perturbation Test (i.e., the correlation breaks in nearby possible worlds), it cannot support knowledge.
  *   **Tractability:** High. This involves modal analysis and evaluating nomological dependencies.
  *   **Downstream Impact:** Moderate. It primarily serves to rule out physicalist-friendly versions of epiphenomenalism, forcing the debate toward the harder metaphysics of Line 2.
  *   **Criteria Applied:** *Tractability & Negation.* It is easier to demonstrate the failure of Tracking (via the Surrogate Problem) than to prove the success of Acquaintance.
  *   **Epistemic Status:** *Near-Settled (with caveats).* The "Coincidence Objection" to tracking is standard. Your "Surrogate Problem" is a useful refinement, but the literature generally agrees that bare correlation is insufficient for knowledge without an explanatory link.

  **Dropped:** **Dissolution Options (Illusionism/Eliminativism).**
  *   **Reason:** This is a retreat, not a solution to the specific paradox. If your premise is "whether conscious experience *could* be causally inert," illusionism answers "no, because it doesn't exist." While important, it changes the subject. Given a 3-year limit, you must solve the paradox for the *realist* about phenomenology before addressing the eliminativist. Treat Illusionism as the fallback position if Line 2 fails, not a parallel research stream.

  ---

  ### 2. Critique of the Map

  **Where the Map is Wrong or Imprecise**

  1.  **Tracking vs. Common-Cause (Lines 1 & 3):** You treat these as distinct. In the literature, the "Common-Cause" reply is usually a specific *version* of the Tracking reply (where the physical state is the common cause of both the experience and the judgment). Separating them risks duplication.
      *   *Correction:* Merge these into a single line on **Correlation Mechanisms**. The crucial distinction is not between Tracking and Common-Cause, but between *Nomological* correlation (holds in our world) vs. *Metaphysical* correlation (holds in all worlds). Your **Perturbation Test** is the right tool to distinguish them.
  2.  **Terminology:**
      *   "Tracking Reply" is standardly called the **Reliabilist Response**.
      *   "Surrogate Problem" is a specific formulation of the **Coincidence Objection** (or "Pre-established Harmony" objection).
      *   "Constitutive Reply" often falls under the **Phenomenal Concept Strategy (PCS)** or **Direct Acquaintance**. You should explicitly engage with PCS, as it is the dominant physicalist counter-move you have omitted.
  3.  **The Missing Option: The Phenomenal Concept Strategy (PCS).**
      *   *Why add it?* PCS argues that we have physical concepts that refer to phenomenal properties in a unique way, explaining the *judgment* without requiring the *property* to cause the judgment. It is the main rival to your Line 2 (Acquaintance). You cannot defend Acquaintance without showing why PCS fails to explain the same data without dualism.
      *   *Action:* Integrate PCS analysis into Line 2 as the primary counter-argument to be refuted.

  **Dead Ends**
  *   **Common-Cause as a Standalone:** As noted, without a robust account of *why* the common cause produces both (which usually implies the physical causes the phenomenal, risking interactionism, or implies a pre-established harmony), this collapses into the Tracking reply. Do not allocate a postdoc to this as a distinct category.
  *   **Dissolution as Primary:** As argued above, this dissolves the problem rather than solving it.

  ---

  ### 3. Dependency Map (Prose)

  **Phase 1: The Boundary Condition (Months 1–12)**
  *   **Work:** Line 1 (Scope Question).
  *   **Dependency:** None. This must run first.
  *   **Logic:** You must establish that the *act of researching epiphenomenalism* is not itself evidence against epiphenomenalism.
  *   **Parallel Work:** Line 3 (Tracking/Surrogate) can begin in parallel. Analyzing why Tracking fails helps motivate why we need to solve Line 1. If Tracking *could* work, the Scope Question is less urgent (because we wouldn't need to accept inertness). But assuming inertness is the premise, Line 1 is the gatekeeper.

  **Phase 2: The Positive Mechanism (Months 13–24)**
  *   **Work:** Line 2 (Acquaintance).
  *   **Dependency:** Requires Line 1 to be "cleared" (i.e., a working model of how warrant is possible without causation).
  *   **Logic:** Once you establish that warrant *can* exist without causation (Line 1), you must specify *how* it exists. This is where you engage the Phenomenal Concept Strategy (the omitted option) to show why Acquaintance is superior.
  *   **Parallel Work:** Line 3 concludes here. The failure of Tracking (via the Perturbation Test) is used as a premise to argue for the necessity of Acquaintance.

  **Phase 3: Synthesis and Downstream Implications (Months 25–36)**
  *   **Work:** Integration.
  *   **Dependency:** Requires outputs from Lines 1 and 2.
  *   **Logic:** Apply the resulting theory of warrant to the "Grain Test." Does your Acquaintance model explain fine-grained discrimination? If not, the theory is incomplete.
  *   **Output:** A definitive statement on whether dualism is rationally sustainable.

  ---

  ### 4. Checkpoints and Triggers

  Since this is conceptual work, you need dialectical or formal milestones to assess progress.

  **Checkpoint 1 (End of Year 1): The Self-Undermining Formalisation.**
  *   *Success:* A formalised epistemic principle that distinguishes "causally produced belief" from "warranted belief" in a way that exonerates the epiphenomenalist's own arguments.
  *   *Trigger to Pivot:* If the team concludes that *all* warrant requires causal contact with the truth-maker, the project must shift from defending epiphenomenalism to critiquing the causal theory of knowledge (or accepting that epiphenomenalism is irrational).

  **Checkpoint 2 (End of Year 2): The Acquaintance Taxonomy.**
  *   *Success:* A clear classification of Acquaintance relations (Causal vs. Modal vs. *Sui Generis*) with a defence of one that avoids the "magical" charge.
  *   *Trigger to Pivot:* If the *Sui Generis* option is deemed unintelligible by external reviewers (a common critique), you must pivot to a Modal account, which risks collapsing into a version of the Tracking reply.

  **Checkpoint 3 (End of Year 3): The Grain Test Result.**
  *   *Success:* The theory explains how we judge fine-grained qualia (e.g., specific shades of red) without causal feedback.
  *   *Trigger to Pivot:* If the theory only secures coarse knowledge (Pain vs. No Pain), you must concede that epiphenomenalism limits the scope of phenomenal knowledge, which significantly weakens the Knowledge Argument.

  ---

  ### 5. Epistemic Status Markers for the Case for Support

  *   **Settled:** The "Paradox of Phenomenal Judgment" is a standard objection to epiphenomenalism (Chalmers 1996). It is settled that if experiences are inert, they do not *cause* judgments.
  *   **Contested:** Whether "Acquaintance" provides a non-causal warrant. Many physicalists argue this is a placeholder for a causal mechanism we don't understand. Many dualists argue it is the only coherent option. *Your project enters here.*
  *   **Contested:** Whether the Knowledge Argument is self-undermining. Chalmers argues it is not; others (e.g., Stalnaker, some causal theorists) argue it is. *Your Line 1 addresses this.*
