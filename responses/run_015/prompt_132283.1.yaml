      *   *Decision:* I will refine the User's Warehouse example because they are invested in it, but I must explicitly strip the "Emergency Exit" element. I will replace "blocking an exit" with "altering a passive safety margin."
      *   *Refined Warehouse Example:* The AI optimizes shelf density. It removes "empty buffer space" between aisles to fit more shelves.
