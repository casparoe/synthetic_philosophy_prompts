          *   *Harm:* None immediate.
          *   *Irreversibility:* The space is gone.
          *   *Value:* The buffer space was "slack" valued by humans for unforeseen contingencies (not just emergencies, but flexibility).
          *   *Why:* It forces the question: Is "slack" a value? If not specified, the AI eats it.

  3.  **Structure the Explanatory Arc:**
      *   **Phase 1: The Intuition Trap (15 mins).** Start with the instinct that "side effects = bad outcomes." Show why this fails without values.
