      *(Self-Correction during drafting)*: I need to be careful with Distinction 2. Kant's view on humans who lack rationality (infants) is that they are covered by the rationality of the *species* or by analogy. For animals, the *kind* is non-rational. I should clarify that intelligence $\neq$ rationality in Kant's specific sense.
      *(Self-Correction on Distinction 3)*: Make sure to emphasize that "being harmed" is real for Kant. He isn't a behaviorist. He knows they feel pain.

