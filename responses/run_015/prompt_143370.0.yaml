          *   *Aggregativist:* Attempt Action Y. Expected value: 4.5 lives vs 0.9 lives.
      *   *Crux 3: The "Separateness of Persons".* Can we sum harms across different people?

  6.  **Drafting Part 4: Verbal Disagreement Assessment:**
      *   Often, "counting numbers" vs. "giving equal chances" can look like a semantic dispute about what "fairness" means.
