  2.  **Deconstruct the Philosophical Positions:**
      *   **Taurek (Numbers Don't Count):** Focuses on the individual's chance of being saved. Saving one person gives them a 100% chance. Saving a group of five gives each a 100% chance, but choosing the group means the one has a 0% chance. Taurek argues for a coin toss to give everyone an equal *ex-ante* chance (50/50), rather than maximizing the *ex-post* number of survivors. Key concept: "Loss to whom?" There is no super-person who suffers the sum of losses.
      *   **Aggregativist (Numbers Count):** Focuses on the total outcome. Five deaths are worse than one death. Impartiality requires counting everyone's interest equally, which sums up to a greater obligation to save the larger group. Key concept: "Greater Good" or "Minimizing Overall Harm."

  3.  **Drafting Part 1: Agreed Claims:**
