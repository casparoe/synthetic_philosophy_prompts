  7.  **Refining the Content (Self-Correction/Iterative Process):**
      *   *Check:* Did I include the specific probabilistic variant in the Crux section? Yes, need to make sure it's detailed.
      *   *Check:* Is the tone appropriate? It needs to sound like a collaborative academic output, respectful but clear on divergence.
      *   *Check:* Taurek's view is often misunderstood. He doesn't say numbers are irrelevant to *prudence*, but to *moral obligation* between strangers. He argues for a lottery to give equal respect. I need to ensure the "Agreed Claims" don't accidentally rule out Taurek's lottery.
      *   *Refining the Variant:* The prompt asks for "saving each group requires a separate, independently risky action."
          *   Standard Case: Save 1 or Save 5 (100% certainty).
