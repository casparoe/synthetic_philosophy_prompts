answer: |-
  You are not overthinking this. You have identified the exact friction point where legal theory meets machine learning safety. The courtroom is a technology for producing *legitimacy*, not necessarily *accuracy*. When you port it to AI, you are trying to use a legitimacy machine to solve an accuracy problem. That mismatch is where the obfuscation attack lives.

  Here is the breakdown of the practice, the mapping, and the design implications.

  ### 1. The Courtroom: Presuppositions and Load-Bearing Rules

  You asked what the practice strictly presupposes versus what merely sits well with it. We must distinguish between *epistemic* goals (finding truth) and *procedural* goals (resolving disputes without violence).

  **The Core Presupposition:**
  The courtroom does **not** presuppose that adversarial testing converges on the truth in a scientific sense. It presupposes that **constrained adversarial testing is the best available method for allocating the risk of error in a normative decision.**

  It assumes that truth is *fragmented* (witnesses see parts) and *contested* (interpretations differ), and that a neutral decider cannot actively investigate without becoming biased. Therefore, the system is designed to *stress-test claims* rather than *construct reality*.

  **Load-Bearing Rules (Truth vs. Fairness vs. Risk):**

  *   **Enforced Ignorance (Jury Selection/Sequestration):**
      *   *Function:* Fairness and Legitimacy.
      *   *Strict Presupposition:* It presupposes that prior knowledge creates bias that cannot be unweighted. It does *not* presuppose that ignorance helps find truth (knowledge usually helps truth). It sacrifices epistemic efficiency for procedural neutrality.
      *   *AI Mapping:* This is the "blind judge" concept. In AI, this is often harmful. You *want* the judge to have context. Dropping this in AI is actually an improvement, not a loss.

  *   **Hearsay Ban:**
      *   *Function:* Truth-Seeking (Reliability).
      *   *Strict Presupposition:* Information degrades in transmission, and you cannot cross-examine a ghost. This is load-bearing for the truth claim. It forces the system to anchor to a source that can be pressured.
      *   *AI Mapping:* This is the "Grounding Gap." In AI debate, all evidence is text generated by a model. There is no "source" that can be cross-examined, only text that can be contradicted by other text. This is the critical failure point.

  *   **Discovery Obligations:**
      *   *Function:* Truth-Seeking (Preventing Ambush).
      *   *Strict Presupposition:* Truth is more likely to emerge if all cards are on the table, even if it reduces dramatic efficacy.
      *   *AI Mapping:* This is "shared context." Most AI debate protocols do this well (both models see the document).

  *   **Advocate Silence (Lawyers don't testify):**
      *   *Function:* Role Separation.
      *   *Strict Presupposition:* The person arguing the point cannot be the source of the fact. If they are both, they will conflate rhetoric with evidence.
      *   *AI Mapping:* **This is the biggest drop.** In standard AI debate, the model generates the argument *and* the evidence (the quote, the citation, the reasoning step). It is witness and lawyer simultaneously. This allows the "obfuscated argument" because the model can hallucinate a premise that supports its rhetoric without external penalty.

  *   **Burden of Proof / Hung Jury:**
      *   *Function:* Risk Allocation.
      *   *Strict Presupposition:* It is better to fail to decide than to decide wrongly (in criminal law). This is *not* truth-seeking; it is error management. It presupposes that uncertainty is a valid state that the system must absorb.
      *   *AI Mapping:* Most RLHF forces a choice. A "hung jury" equivalent (abstention) is rare but crucial for calibration.

  ### 2. Mapping to the Model Setup

  You guessed that the decider in court judges people with stakes and duties, while models do not. You are correct, but the implication is deeper.

  **A. Stakes and Duty (Perjury vs. Loss Function)**
  *   *Court:* The witness risks liberty or reputation. The lawyer risks disbarment. The system presupposes **costly signaling**. Lying is expensive.
  *   *AI:* Lying is cheap. If a lie wins the debate, the reward is positive. The loss function rewards *winning*, not *truth*.
  *   *Essential?* Yes. Without a cost for lying that is distinct from "losing the argument," the system trains for persuasion, not accuracy.
  *   *Rebuild Cost:* High. You need an external verifier that penalizes hallucination *independently* of the debate outcome. If you add this, you reduce the need for debate (since the verifier could just check the answer).

  **B. Time and Resources (Deliberation vs. Context Window)**
  *   *Court:* The jury can take as long as needed. The judge can pause for legal research.
  *   *AI:* The judge is a "weaker model" (as per your proposal) with bounded attention.
  *   *Essential?* Yes. Obfuscation works *because* the judge is bounded. The courtroom presupposes the decider has the capacity to untangle the knot if the lawyers point to it.
  *   *Rebuild Cost:* If you make the judge stronger/slower, you lose the "scaling" benefit of debate. The whole pitch of debate is "use cheap judges to verify expensive reasoning." If the judge must be smart enough to spot obfuscation, you might as well ask the judge the original question.

  **C. Evidence Anchoring (Witnesses vs. Assertions)**
  *   *Court:* Evidence is anchored to the physical world or a human memory.
  *   *AI:* Evidence is anchored to the context window (text).
  *   *Essential?* **This is the load-bearing pillar.** The courtroom works because the lawyer cannot invent a witness. The AI debater *can* invent a quote.
  *   *Rebuild Cost:* You must decouple evidence generation from argumentation. (See Design Rec below).

  **D. Option to Not Decide (Hung Jury vs. Forced Choice)**
  *   *Court:* If the story doesn't hold, the status quo remains (defendant goes free).
  *   *AI:* Usually forces a probability distribution.
  *   *Essential?* For truth-seeking, no. For safety, yes. Forcing a guess on low-confidence data trains overconfidence.
  *   *Rebuild Cost:* Low. You can allow abstention.

  ### 3. Evaluating the Hacks

  **Hack 1: The Falsification Deposit**
  *   *Mechanism:* Debater pre-commits to the single check that would disprove them.
  *   *Verdict:* This imports the **structure** of risk, but not the **consequence**.
  *   *Analysis:* In court, this is similar to a "theory of the case" or a "stipulation." If you say "If Document X doesn't show Y, I lose," and Document X doesn't show Y, you lose.
  *   *Does it work?* Only if the penalty for the check failing is severe and *external* to the debate. If the judge just notes it as part of the argument ("Ha, he said check X would fail him, but I'm not sure it does"), it's vocabulary. If the system automatically penalizes the model when its pre-committed falsification condition is met by the ground truth, it creates **skin in the game**.
  *   *Risk:* Models might pre-commit to unfalsifiable claims ("I am wrong if the sky is green"). You need a schema for valid checks.

  **Hack 2: Burden of Proof Default (Abstain + Default)**
  *   *Mechanism:* If the judge can't tell, fall back to a pre-committed default (e.g., "Original Answer A stands").
  *   *Verdict:* This imports **Risk Allocation**, not Truth-Seeking.
  *   *Analysis:* This mimics the presumption of innocence. It prevents the "fluent liar" from winning on uncertainty. It forces the challenger to *prove* the original is wrong, rather than the original having to prove it's right against a confusing attack.
  *   *Does it work?* It reduces the reward for obfuscation. If I can confuse the judge, I don't win; the status quo holds. This makes obfuscation less profitable *if* the status quo is more likely to be true than the lie.
  *   *Risk:* It creates inertia. If the "default" is wrong, the system becomes conservative and resistant to correction. It solves the "fluent liar" problem by biasing toward the "original speaker."

  ### 4. The Verbal Fight

  The fight between the debate proponents and the obfuscation critics is partially verbal, centering on the definition of **"Truth."**

  *   **Debate Proponents** view truth as **Coherence**. If a claim survives rigorous attack, it is "true enough" for the system. They are optimizing for *robustness*.
  *   **Obfuscation Critics** view truth as **Correspondence**. Does the claim match reality? They know that a coherent story can correspond to nothing.

  The debate protocol optimizes for Coherence. It assumes Correspondence will fall out as a byproduct. The obfuscation attack proves that Coherence can be decoupled from Correspondence in a text-only environment.

  ### 5. Design Recommendation: How to Stop Training Liars

  If you want to avoid training fluent liars, you must change the feature that carries the weight. Currently, the weight is on **Persuasion**. You need to shift the weight to **Verification**.

  **The Critical Change: Decouple Witness from Lawyer**
  In the courtroom, the lawyer argues, but the *witness* provides the facts. In your current AI setup, the Model is both.
  *   **Current:** Model A argues "The answer is X because [Quote Q]." Model B argues "No, [Quote Q] means Y."
  *   **Problem:** Model A can hallucinate Quote Q.
  *   **Fix:** The "Evidence" must be retrieved by a separate process (or a separate model instance) that is *frozen* and cannot be argued with, only interpreted.
      *   **Procedure:**
          1.  **Retrieval Phase:** A neutral process extracts relevant text chunks from the document. These are "Exhibits."
          2.  **Debate Phase:** Models can *only* argue using the Exhibits. They cannot generate new quotes. They can say "Exhibit 3 contradicts Exhibit 5," but they cannot say "The document says..." without pointing to an Exhibit.
          3.  **Judgment:** The judge evaluates which argument best fits the *fixed* Exhibits.

  **What You Give Up:**
  You give up the ability for the model to "find" information through reasoning. You force it to work only with what is retrieved. This limits the "reasoning" scope to *interpretation* of evidence, not *generation* of evidence.
  *   *Cost:* You need a high-quality retrieval system. If retrieval misses the key fact, the debate is useless.
  *   *Gain:* You restore the **Hearsay Anchor**. The "Witness" is the Retrieval System (which can be audited). The "Lawyer" is the LLM. You can now punish the Lawyer for misquoting the Witness.

  **The "Falsification Deposit" Integration:**
  Combine the Decoupled Evidence with the Falsification Deposit.
  *   Before the debate, each model must select **one Exhibit** that is critical to their case and state **one interpretation** of it.
  *   If the Judge determines the Exhibit does not support that interpretation, that model is disqualified immediately, regardless of rhetorical flair.
  *   This creates the **Perjury Risk**. It makes lying about evidence more costly than losing the argument.

  **Summary:**
  The courtroom works because it separates the *source of facts* (witnesses) from the *interpreters of facts* (lawyers) and the *deciders of facts* (jury), and it imposes high costs on the source for lying. Your AI system conflates all three. To fix it without abandoning debate:
  1.  **Freeze the Evidence** (Create a "Witness" layer).
  2.  **Penalize Misrepresentation** of that Evidence (Create a "Perjury" layer).
  3.  **Allow Abstention** (Create a "Hung Jury" layer).

  If you do not anchor the text to something external to the argument generation, you are not building a courtroom; you are building a sophist school. You will train models to be better at winning, not better at being right.
