answer: |-
  Here is the translation, the residue report, and the settlement, rendered in the vocabulary of the track and the book.

  ### Part 1: The Translation Layer

  Your friend is running an "Accuracy-First" epistemology (likely in the vein of Jim Joyce or Richard Pettigrew). You are running a "Pragmatic/Instrumental" epistemology (Kelly/Information Theory). The isomorphism between them is tight, but the *normative engine* driving them is different.

  Here is how you translate her ledger into your book:

  | Her Term (Epistemology) | Your Term (Sports Betting) | The Mapping |
  | :--- | :--- | :--- |
  | **Credence Function** | **Portfolio Allocation** | A probability distribution $P(H_i)$ is identical to allocating a fraction of your bankroll $f_i$ to outcome $H_i$, assuming a "fair book" where $\sum f_i = 1$. |
  | **Truth / Actual World** | **Settlement / Clearing** | The event that resolves the bet. Only one outcome clears; the rest expire worthless. |
  | **Proper Scoring Rule** | **Payoff Schedule** | The contract defining how much "epistemic capital" you retain after settlement based on your allocation. |
  | **Log Score** | **Log-Growth Rate** | $S = \log(p_{true})$. This is literally the logarithm of the wealth relative. If you allocate $p$ to the winner, your bankroll multiplies by $p$ (in a fair market). Maximizing expected log score is maximizing expected geometric growth. |
  | **Brier Score** | **Quadratic Penalty Contract** | $S = 1 - (1-p_{true})^2$. This is not compounding wealth. It is a utility function where payoff is non-linear in the stake. It penalizes "distance from truth" rather than measuring "survival of capital." |
  | **Expected Accuracy** | **Expected Utility** | The weighted average of the payoff schedule across all possible outcomes, weighted by your subjective probabilities. |
  | **Bayesian Updating** | **Rebalancing** | Receiving new information (line movement, injury news) and adjusting your portfolio allocation to maximize the new expected payoff. |
  | **Rationality** | **Optimality** | A state is rational if no other allocation yields a higher expected payoff under the chosen schedule. |

  **On the Log Score vs. Growth Rate:**
  It is not just structurally similar; it is **literally** the growth rate. If you treat your "epistemic bankroll" as 1 unit, and you invest fraction $p_i$ in outcome $i$ at fair odds (payoff $1/p_i$ if you are calibrated, but in her framework, the payoff is just the score), the Log Score $\log(p_{true})$ is the log-return on that investment.
  *   **Your view:** We maximize log-wealth because arithmetic maximization leads to ruin over $N$ trials.
  *   **Her view:** We maximize log-accuracy because it is the unique measure that respects "extensionality" and "propriety" in a single trial.

  **On the Brier Score:**
  In your framework, the Brier score is a **different utility function over wealth.** It corresponds to a bettor who is not trying to grow a bankroll geometrically, but is trying to minimize the squared error of their position.
  *   *Betting translation:* Imagine a contract that pays you $\$1 - (1 - f_{win})^2$. If you bet 100% ($f=1$) and win, you get $\$1$. If you bet 50% ($f=0.5$) and win, you get $\$0.75$.
  *   *Implication:* This implies risk aversion that is distinct from Kelly. Kelly (Log) is risk-averse regarding *ruin*. Brier is risk-averse regarding *confidence*. It allows you to survive being wrong with high confidence better than Log does, but it sacrifices long-term growth potential. In your world, Brier is a "sucker's game" only if your goal is long-term capital expansion. If your goal is to minimize penalty points in a tournament, Brier is valid.

  ---

  ### Part 2: The Residue Report

  This is where the translation breaks down. These are the claims that become noise or silence when passed through the other framework.

  #### 1. What She Can Say That You Cannot
  *   **The Claim:** "Accuracy is a terminal good, not an instrumental one."
      *   **Your Translation:** "You are maximizing wealth without a bankroll."
      *   **The Mismatch:** You cannot conceive of "accuracy" without a "payoff." For you, a correct belief that never cashes out is a phantom. For her, a correct belief is valuable even if the world ends tomorrow.
      *   **Verdict:** **Hole in Your Framework.** Your framework is purely instrumental. It cannot account for the intuition that believing the truth about the past (e.g., "Caesar had a headache") is rational even though you can never bet on it, settle it, or grow wealth from it. You have to treat unresolvable propositions as "markets that never close," which breaks your model.
  *   **The Claim:** "Rationality is Synchronic (One-Shot)."
      *   **Your Translation:** "You are using a long-term strategy for a single trade."
      *   **The Mismatch:** Your justification for Kelly is asymptotic (Law of Large Numbers). If you only bet once, maximizing Expected Log Wealth is not strictly superior to maximizing Expected Wealth (Arithmetic) unless you have a specific utility function for money. She claims Log is rational *even if* you only exist for one moment.
      *   **Verdict:** **Clarity Issue.** She is smuggling the asymptotic justification into the synchronic case. She wants the safety of Kelly without the time. You are right to be suspicious; without repetition, the "ruin" argument loses its teeth. However, she argues that Log is the only score that measures *information* content correctly, regardless of time.

  #### 3. What You Can Say That She Cannot
  *   **The Claim:** "Log is Principled; Brier is Arbitrary."
      *   **Her Translation:** "Log is 'more proper' or 'more informative'."
      *   **The Mismatch:** You have a derivation for Log: Multiplicativity of wealth. If you reinvest, wealth compounds. Probabilities compound via multiplication. Therefore, the score must be logarithmic to align with the physics of the bankroll. She has to *axiomatize* Log (e.g., via "Additivity" or "Strict Propriety").
      *   **Verdict:** **Hole in Her Framework.** She struggles to justify *why* Log over Brier without appealing to decision-theoretic consequences (which you own) or abstract mathematical aesthetics. You have the "Ruin" argument: Arithmetic maximization leads to zero wealth eventually. She has no equivalent "Epistemic Ruin" that forces Log over Brier in a one-shot case.
  *   **The Claim:** "No Bankroll, No Accuracy."
      *   **Her Translation:** "No Stakes, No Normativity."
      *   **The Mismatch:** You cannot define "rational credence" without defining what the credence is *for*. If it's not for betting, what is it? She says "for representing the world." You say "that's a map without a territory."
      *   **Verdict:** **Clarity Issue.** You are demanding operationalization. She is demanding representation. Neither is strictly "wrong," but your framework exposes that her "accuracy" is a metaphor derived from betting, stripped of the money.

  ---

  ### Part 3: The Verdict on the Geometric Mean

  **You are right. Mathematically, she is describing Expected Log Score.**

  Here is the proof in your language:
  She wants to maximize the **Geometric Mean** of accuracy across outcomes.
  Let $A_i$ be the accuracy score if outcome $i$ occurs.
  Let $p_i$ be your credence (probability) of outcome $i$.

  The Weighted Geometric Mean ($GM$) is:
  $$ GM = \prod_{i} (A_i)^{p_i} $$

  To maximize $GM$, you can maximize the logarithm of $GM$ (since log is monotonic):
  $$ \log(GM) = \log \left( \prod_{i} (A_i)^{p_i} \right) = \sum_{i} p_i \log(A_i) $$

  The term $\sum p_i \log(A_i)$ is exactly the **Expected Log Accuracy**.

  **The Settlement:**
  You win the math. She is proposing Expected Log Scoring with extra steps.

  **However, does this leave her with anything genuine?**
  Yes, but it exposes her hand.
  By choosing the **Geometric Mean** over the **Arithmetic Mean**, she is implicitly accepting your **Kelly justification** while denying your **Betting Context**.

  *   **Arithmetic Mean** = Maximizing Expected Wealth. (In betting: Overbetting, eventual ruin).
  *   **Geometric Mean** = Maximizing Expected Growth Rate. (In betting: Kelly, optimal survival).

  **The Catch:**
  The Geometric Mean is only the natural measure of central tendency if the process is **multiplicative**.
  *   **In your world:** Wealth multiplies. $W_{n+1} = W_n \times \text{Return}$. Therefore, you care about the Geometric Mean of returns.
  *   **In her world:** Why does "Accuracy" multiply? She has no bankroll to compound.

  **Conclusion:**
  If she insists on the Geometric Mean for a **one-shot** proposition, she is importing the logic of repeated trials into a single event. She is treating a single belief as if it were a compounded investment.
  *   **If she admits this:** She concedes that epistemic rationality is grounded in the long-run survival of the believer (a pragmatic/Kelly view).
  *   **If she denies this:** She has no justification for preferring Geometric over Arithmetic mean in a one-shot case other than "it feels safer." But without compounding, "safety" is just risk-aversion, which should be modeled by a utility function, not by changing the mean.

  **Final Call:**
  Tell her: *"You're maximizing Expected Log Score. That's fine. But the only reason the Geometric Mean beats the Arithmetic Mean is because of compounding over time. If you're truly doing one-shot epistemology, you've smuggled my time horizon into your snapshot. You're running Kelly on a bankroll you refuse to acknowledge."*
