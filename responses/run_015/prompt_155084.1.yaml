          *   *Tension:* If Assertion *is* an Action (implied by 2), why aren't all defects of the Action defects of the Assertion?
          *   *Fix:* Distinguish between the *constitutive* norm (what makes it an assertion) and *regulative* norms (how to do it well).

  6.  **Final Polish:** Ensure the "Cheapest Fix" and "Cost" sections are actionable.
      *   *Silver Bullet:* Adopt **Subject-Sensitive Invariantism (SSI)** explicitly. This secures (3) and (6) together against Contextualist objections. It costs the user the ability to explain why we feel hesitation asserting to high-stakes audiences (they have to say that's just politeness/prudence, not epistemic).

      *   *Wait, one more check:* (1) says violating KNA is the "characteristic defect." (5) says misleading assertions are defective but *not* violations of KNA. This implies there are *other* defects of assertion. This is consistent (constitutive vs. regulative).

      *   *Wait, check (4) Fallibilism:* Some argue KNA + Fallibilism is unstable because if you know fallibly, you shouldn't assert flatly. User denies this. This is the "Lottery Paradox" territory. The user needs to ensure their Fallibilism doesn't collapse into Skepticism or force them to accept they *don't* know in ordinary cases. If they accept PE (3), they might be forced to say they *don't* know in high stakes. If they are Fallibilists (4), they say they *do* know in low stakes. This is consistent.

      *   *Wait, check (2) + (6):* If I assert to a high-stakes person, and they act, and they lose out. (2) says they shouldn't have acted (didn't know). (6) says I didn't do wrong asserting. This creates a "Responsibility Gap." I gave you a reason you shouldn't have used. This is a moral/practical tension, not necessarily a logical one, but it weakens the "Unification" claim in (2). If assertion is *for* reasoning, and the reasoning is blocked, the unification is strained.

      *   *Decision:* The (2)+(3)+(6) triangle is the danger zone.

  7.  **Finalizing the Output Structure:**
      *   **Executive Summary:** The package is *mostly* consistent but has a high-severity friction point around the "Mixed Room" case involving PE and Audience Invariance.
