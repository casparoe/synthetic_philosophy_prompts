          1.  Overall Verdict (Is it consistent?).
          2.  Ranked Tensions (High, Medium, Low).
          3.  For each tension: The Problem, The Cheapest Fix, The Cost.
          4.  The "Silver Bullet" Revision (One change to fix multiple issues).
      *   **Tone:** Professional, peer-to-peer, rigorous.
      *   **Specific Focus:** The (3)+(6) tension is the critical one. It's the "Subject-Sensitive vs. Context-Sensitive" debate. The user needs to commit to *Subject-Sensitive Invariantism* (SSI) regarding knowledge to make (6) work with (3). If they slide into Contextualism, (6) dies.
      *   **Refining the (3)+(6) Tension:**
          *   If Knowledge encroaches (3), it encroaches based on the *knower's* stakes.
          *   If I am the knower/assertor, my stakes matter.
          *   (6) says audience stakes don't matter.
          *   *Consistency Check:* This is consistent *if* knowledge is purely subject-sensitive.
          *   *The Catch:* The "Mixed Room" case. If I assert to a group, I am addressing *them*. If *their* stakes vary, does the *assertion* vary in propriety? User says No.
          *   *The Problem:* If the *function* of assertion is to license action (2), and the *audience* cannot license action (due to their high stakes + PE), then the assertion fails its function for half the room.
          *   *Is this a tension?* Yes, between the *norm* (permission) and the *point* (function). The user can maintain the norm is satisfied, but must admit the *point* is frustrated for some.
