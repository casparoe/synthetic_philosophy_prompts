prompt: |-
  Before I dive into the naturalism vs normativism stuff I want the spec, not the survey. Write me the list of requirements an account of "disease" has to satisfy to be good enough for one particular job: deciding what counts as treatment rather than enhancement when someone is arguing about coverage, while still being able to turn around and say medicine has classified something as a disease that isn't one.

  For each requirement give the case behind it. The ones I want covered: conditions that are real but asymptomatic, conditions almost everyone has, conditions whose status seems to flip depending on what the person wants, mere risk factors, conditions whose cause is social rather than internal, and my own test case — a common, painless, non-progressive bone-density variant that shows up only on scans, slightly raises fracture risk after eighty, and isn't screened for. Please add cases that are less friendly to theories than the usual ones, and tell me which requirements are really desiderata and which are just one camp's prejudices.

  Mark which are non-negotiable and which are optional, and say weather the theory has to operate at the level of the person or of the part, and whether that's a requirement or a free choice. Then the part I actually care about: which subset of the requirements do you think can't be jointly satisfied — my guess is value-freedom and the ability to call past classifications mistaken, but argue it. Last, which single requirement does the most work against the biostatistical dysfunction view, and which against the view that disease is just whatever we disvalue or whatever warrants medical attention. Skip the full scorecard.
