      *   *Phase 4: Misconceptions.*
          *   "Suffering": It's not about pain, it's about *consequence*.
          *   "Recombination": Humans recombine too. The difference is *selection criteria*.
      *   *Phase 5: The Open Question.* Can we *give* stakes to the machine? (The "God" role).
      *   *Phase 6: The Diagnostic Question.*

