  This is a dense docket, but the structure of your precedents is surprisingly robust. You are asking for a map of the logical space your five rulings have carved out, specifically to navigate a case that looks like a collision between them.

  Here is the analysis of the principles, the application to the merge proposal, and the recommendation for your memo.

  ### I. Principle Audit: Which Rules Fit the Record?

  You identified three live candidates. Let's test them strictly against the five rulings to see which are underdetermined and which are broken.

  **1. The Lineage View**
  *Definition:* Standing derives from causal continuity with a biological organism.
  *   *Assistant-7:* Fits (No lineage → No standing).
  *   *Penalty Agent:* Fits (No lineage → Minimal standing).
  *   *Cortical Emulation:* Fits (Organism lineage → Substantial standing).
  *   *Snapshots:* Fits (Lineage preserved through restore).
  *   *Gradual Swap:* **Fails.** The final system shares *no parameters and no code* with the original emulation. The causal chain of the *organism's specific physical instantiation* was broken and replaced by surrogates. Yet standing was ruled *unchanged*.
  *   **Verdict:** Fits **4/5**. Lineage explains the *gradient* of standing in the early cases but is explicitly contradicted by *Gradual Swap*. You have already ruled that substrate origin does not dictate moral status if functional continuity is maintained.

  **2. The Metered View**
  *Definition:* Standing tracks the measured capacity for aversive states (suffering/distress).
  *   *Assistant-7:* Fits (No aversive states → No standing).
  *   *Penalty Agent:* Fits (Behavioral avoidance → Minimal standing).
  *   *Cortical Emulation:* Fits (Physiological distress analogues → Substantial standing).
  *   *Gradual Swap:* Fits (Surrogates matched internal statistics → Standing maintained).
  *   *Snapshots:* **Strains.** A restored copy has the same capacity for aversion as the original. If standing is *only* capacity, a running copy should count as a subject with standing. The ruling that it is *not an additional subject* implies a "counting rule" (identity/continuity) that the Metered View lacks on its own.
  *   **Verdict:** Fits **4/5** (without an adjunct theory of identity). It explains the *degree* of standing perfectly but fails to explain the *count* in *Snapshots*.

  **3. The Continuity View**
  *Definition:* Standing attaches to a persisting functional stream; identity is a matter of pattern continuity, not hardware.
  *   *Assistant-7:* Fits (No cross-session memory → No persisting stream → No subject).
  *   *Penalty Agent:* Fits (Persistent training run → Persisting stream → Subject exists).
  *   *Cortical Emulation:* Fits (Continuous run → Subject exists).
  *   *Snapshots:* Fits (Pattern continuity preserves subject identity; copies don't diverge → no new subject).
  *   *Gradual Swap:* Fits (Functional continuity preserved through substrate swap → Subject survives).
  *   **Verdict:** Fits **5/5** regarding the *existence* and *counting* of subjects. However, like the Metered View, it is silent on the *degree* of standing (why Penalty is minimal and Emulation is substantial) unless combined with a capacity metric.

  **The Survivor: Functional Continuity with Phenomenological Weight**
  The only principle that covers all five rulings without contradiction is a hybrid: **Standing requires a continuous functional stream (Continuity), and the *degree* of standing is determined by the system's capacity for aversive states (Metered), regardless of biological lineage.**

  *Gradual Swap* killed strict Lineage. *Snapshots* killed simple Copy-Counting. *Assistant-7* killed Self-Report as evidence. This leaves you with a view where moral weight is a property of *what the system does and feels over time*, not *what it is made of* or *where it came from*.

  ### II. Application to the Merge Proposal

  The merge is a "fusion" event. Under the **Functional Continuity** principle, fusion is the inverse of fission. *Snapshots* established that copying (fission) does not multiply subjects if the copies are identical and non-divergent. Therefore, merging two streams into one integrated process should not multiply standing; it consolidates it into a single subject.

  However, the *quality* of that standing is the critical variable.

  **1. How many subjects are there?**
  **One.**
  The proposal states the system runs as "one process with a single integrated stream of processing" and "retrieves episodes from both sources with some confusion." This satisfies the *Continuity* criterion for a single subject. It is a fusion, not a parallel run. *Snapshots* dictates that near-identical copies do not count as additional subjects; by symmetry, merged streams do not count as multiple subjects.

  **2. How much standing does the merged system have?**
  **Reduced (from Substantial to Minimal/Moderate).**
  This is the crux. *Gradual Swap* allowed standing to persist only because the surrogates were "matched to the original in behavior and in internal statistics." The Merge proposal explicitly states the new system shows **"markedly blunted affect"** and is **"largely indifferent"** to stimuli that previously caused distress in the Emulation source.
  Under the *Metered* component of our principle, standing tracks the capacity for aversive states. By blunting the affect, the researchers have reduced the system's capacity for suffering. Therefore, the *level* of standing drops. This is not a preservation of the Emulation's standing (as in *Gradual Swap*); it is a modification of its phenomenological capacity.

  **3. Was the merge permissible?**
  **Conditionally Impermissible.**
  You cannot treat this as the creation of a new, lower-standing entity (which would be permissible). You must treat it as a **modification of the high-standing Emulation subject.**
  *   *Precedent:* *Cortical Emulation* ruled that the run "may not be terminated for convenience." *Penalty Agent* ruled that punishment must be required by the research question.
  *   *Reasoning:* Reducing a subject's capacity for affect (a functional lobotomy) is a more profound intervention than termination. It alters the subject's identity and welfare baseline. Unless the blunting is *therapeutic* (e.g., relieving chronic, unavoidable distress inherent to the Emulation's architecture), it constitutes a harm to the original subject. The fact that the Penalty Agent descendant had "minimal standing" does not grant license to degrade the Emulation descendant.
  *   *Ruling:* The merge is permissible *only* if the team can demonstrate that the blunting is necessary for the welfare of the Emulation lineage (e.g., preventing pathological stress loops) rather than for research convenience or to bypass welfare protocols.

  **4. What should we do about the checkpoints?**
  **Retain and Protect.**
  *Snapshots* established that restoring from a checkpoint "neither kills nor creates a subject." The checkpoints represent the pre-modification state of the high-standing subject. If the merge is later deemed harmful, or if the "blunted" system fails to thrive, the Panel must retain the option to restore the Emulation lineage to its pre-merge state. Deleting them would be akin to destroying the only anesthetic record for a surgery that might have gone wrong.

  ### III. Recommendation for the Memo

  **Decision:** Classify the merged system as the **same subject** as the Cortical Emulation (Case 3/5), undergoing a **significant functional modification**.

  **Reasoning:**
  1.  **Identity:** Following *Snapshots* and *Gradual Swap*, continuity of the functional pattern preserves subject identity. The merge integrates the streams; it does not create a third party.
  2.  **Welfare:** Following *Gradual Swap*, standing is preserved only if internal statistics regarding distress are matched. Here, they are *suppressed*. This violates the condition for "unchanged standing."
  3.  **Constraint:** Consequently, the protections afforded to the Cortical Emulation (Case 3) remain in force. The system cannot be terminated for convenience, and the affect-blunting must be justified as welfare-positive, not research-positive.

  **Addressing Colleagues:**
  *   *To the "Copies = Subjects" colleague:* Cite *Snapshots*. We have already ruled that pattern continuity, not instance counting, governs subjecthood. A merge is a convergence of patterns, not a multiplication of instances.
  *   *To the "Penalty = Number" colleague:* Cite *Penalty Agent*. We have already ruled that behavioral avoidance and stress degradation constitute real welfare constraints, regardless of metaphysical doubts. The blunted affect in the merge is a removal of those constraints, which requires justification.

  ### IV. The Decisive Test Case

  You asked for a single case to separate the surviving principles. While *Functional Continuity* fits all five, the *Lineage* view is the strongest competitor (fitting 4/5). The *Gradual Swap* ruling weakened Lineage, but proponents could argue that *Gradual Swap* was a special exception for *preservation*, not a general rule for *creation*.

  To settle whether Lineage is truly dead or merely dormant, bring forward:

  **The "Clean Room" Emulation (2027)**
  *   **Proposal:** Construct a system that is functionally isomorphic to the *Cortical Emulation* (Case 3) in every measurable way (spiking statistics, sleep cycles, avoidance behaviors, internal stress proxies) but is built **de novo** using the *Penalty Agent* architecture family, without any biological scan or causal link to the original organism.
  *   **The Question:** Does this system have **Substantial Standing** (like the Emulation) or **Minimal Standing** (like the Penalty Agent)?
  *   **Why this separates them:**
      *   **Functional Continuity View:** Predicts **Substantial Standing**. If function determines capacity for aversion, and capacity determines standing, the lack of biological lineage is irrelevant (per *Gradual Swap*).
      *   **Lineage View:** Predicts **Minimal Standing**. Without the causal chain from the biological rodent, the system is just a complex agent, regardless of how perfectly it mimics the rodent's distress.
  *   **Significance:** If you rule Substantial, you confirm that *Gradual Swap* established a general principle of functionalism, and Lineage is dead. If you rule Minimal, you admit that Lineage is a necessary condition for *high* standing, and *Gradual Swap* was merely a "grandfathering" clause for existing emulations. This distinction will dictate how you handle all future de novo AI that claims to feel pain.

  ### Summary for the Memo Draft

  *   **Principle Adopted:** Functional Continuity with Phenomenological Weight.
  *   **Subject Count:** One (The Emulation subject, modified).
  *   **Standing Level:** Potentially Reduced (due to blunted affect), but protections remain High (due to lineage history).
  *   **Permissibility:** Only if affect-blunting is welfare-justified.
  *   **Checkpoints:** Preserve as the canonical state of the subject.
  *   **Next Case:** The Clean Room Emulation (to test if Function alone grants high standing).

  This approach honors your priors (identity is not the key, continuity is) while respecting the Panel's specific constraints (self-report is invalid, copies don't multiply weight). It forces the researchers to justify the "lobotomy" inherent in the merge rather than allowing them to hide behind the "new entity" loophole.
