prompt: |-
  Hi — I'm on a small volunteer working group drafting a proposal for a standing randomly selected chamber (a sortition-y second chamber, rotating half its members every year) for our regional government, and I keep running into one line.

  I suggested we don't use a flat lottery but a stratified one that over-samples the people with the most at stake in whatever the chamber is deciding — so for a housing bill, renters and people in temporary accommodation get something like double the weight in the draw — and someone killed it with "it should be a mirror of the people". Wich I get, sort of, but I don't think it settles anything and I can't say why.

  So: what are the different precise things that slogan could be claiming? Mirror which traits, and measured how? Mirror at every moment, or only across the sequence of rotating panels over time? Mirror people, or mirror opinions, or mirror something else entirely? Is it a claim about what makes the body legitimate, or about what makes it produce good decisions, or about both with the two coming apart? And is it a claim about how the members are picked, or about what they're allowed to become once they're in the room? Give me the whole menu, trivial to radical.

  Then verdicts. Which readings are platitudes nobody would deny, which are actually false (my guess: a 150-person panel can't literally mirror a population on more than a handful of traits at once, and the really strong version where the assembly somehow just *is* the people has to be incoherent — but tell me if I'm wrong), and which ones would actually justify shooting down my stake-weighted draw.

  One thing I've been chewing on that I want you to engage with rather than just nod at: if mirroring means mirroring opinions, then the whole deliberative point of these bodies is in trouble, because a panel that has genuinely deliberated has changed its mind and doesn't mirror anything anymore. So maybe what we should want to mirror isn't persons or opinions but the spread of reasons and considerations that exist out there in the public — or the spread of stakes — and whether that twist helps or hurts my proposal is exactly what I can't work out.

  Please commit. Tell me which one or two readings you'd actually design a chamber around, whether my over-sampling idea survives on that reading, and what would change your mind about it. Don't just lay out the options and wish me luck.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Volunteer working group member drafting a proposal for a sortition-based second chamber (regional government).
      *   **Context:** They proposed stratified sortition (over-sampling high-stakes groups, e.g., renters for housing bills). A colleague rejected this with the slogan "it should be a mirror of the people."
      *   **Task:** Deconstruct the slogan "mirror of the people." Provide a "menu" of interpretations (trivial to radical). Evaluate them (platitude, false, or justification for rejection). Engage deeply with the user's specific insight about mirroring *reasons/stakes* vs. *opinions/persons*.
      *   **Constraint:** "Please commit." Don't just list options. Tell them which readings to design around, whether their proposal survives, and what would change my mind.
      *   **Tone:** Intellectual, rigorous, practical, decisive, respectful of the political theory context.

  2.  **Deconstruct "Mirror of the People" (The Menu):**
      *   *Trait 1: Descriptive Representation (Demographics).* Age, gender, race, class, geography.
      *   *Trait 2: Opinion/Preference Representation.* Pre-deliberative preferences match the populace.
      *   *Trait 3: Cognitive/Epistemic Diversity.* Ways of thinking, lived experiences, heuristic approaches.
      *   *Trait 4: Dynamic vs. Static.* One-off snapshot vs. rolling average over time.
      *   *Trait 5: Legitimacy vs. Competence.* Is the mirror for *authority* (we trust them because they are us) or *output quality* (they decide better because they are us)?
      *   *Trait 6: Selection vs. Behavior.* How they get in vs. how they act once in.

  3.  **Evaluate the Readings (Verdicts):**
      *   *Platitudes:* "Roughly similar demographics." (Nobody wants a chamber of only millionaires).
      *   *False/Incoherent:* "Perfect isomorphism." (150 people can't mirror 1 million on all axes). "Mirroring Opinions." (Defeats deliberation, as the user noted).
      *   *Justifies Rejecting Stake-Weighting:* The "Pure Lottery" view. If legitimacy comes *only* from equal probability of selection, weighting violates the principle of political equality *ex ante*.

  4.  **Engage with the User's Insight (Reasons/Stakes vs. Opinions):**
      *   The user suggests mirroring the "spread of reasons" or "spread of stakes."
      *   *Analysis:* This is strong. Deliberative democracy theory (Dryzek, Fishkin) often argues for mirroring *relevant perspectives* rather than raw preferences.
      *   *Connection to Proposal:* Over-sampling high-stakes groups aligns perfectly with mirroring *stakes* and *lived experience reasons*. It does *not* align with mirroring *pre-existing opinions* or *pure mathematical equality of selection chance*.

  5.  **Formulate the Commitment (The Verdict):**
      *   *Which reading to design around?* "Microcosm of Relevant Perspectives/Stakes." Not demographics for demographics' sake, and not pre-baked opinions.
      *   *Does the proposal survive?* Yes, but needs reframing. It's not "over-sampling," it's "ensuring the presence of affected voices."
      *   *What would change my mind?* If the weighting becomes so extreme that it creates a veto bloc or permanently privileges one class over another across *all* legislation (structural bias vs. issue-specific weighting).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate the user's intuition that "mirror" is under-specified.
      *   *Section 1: The Menu.* Break down the dimensions clearly.
          *   *Traits:* Demographics vs. Interests vs. Epistemic.
          *   *Time:* Snapshot vs. Rolling.
          *   *Function:* Legitimacy vs. Competence.
          *   *Stage:* Selection vs. Deliberation.
      *   *Section 2: The Verdicts.*
          *   *Platitudes:* Rough demographic proportionality.
          *   *False:* Perfect isomorphism, Mirroring Opinions (user's point).
          *   *The Killer:* The "Equal Chance" argument. This is the real objection to stratification.
      *   *Section 3: Engaging the "Reasons/Stakes" Insight.*
          *   This is the crux. Distinguish between *preference aggregation* (voting) and *perspective representation* (deliberation).
          *   Argue that "stakes" are a form of relevant perspective.
      *   *Section 4: The Commitment.*
          *   Design around **Descriptive Representation of Affected Interests**.
          *   The proposal survives *if* framed as "constituencies of impact" rather than "weighted voting."
          *   Warning: Don't do it issue-by-issue dynamically (too manipulable). Do it structurally (e.g., permanent over-representation of renters in a housing-heavy region).
      *   *Conclusion:* Final punchy advice.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Wait, if I tell them to do issue-specific weighting (renters for housing bill), that creates a "who decides who is affected" problem. That's dangerous.
      *   *Correction:* I need to advise against *dynamic* issue-specific weighting. It invites gerrymandering of the sortition pool. Better to argue for *structural* stratification based on enduring vulnerabilities (e.g., income, housing status) that are fixed *before* the agenda is set.
      *   *Refinement on "Mirror":* The colleague's objection is likely about *political equality*. Every citizen should have an equal chance to serve. Weighting violates this. I need to address this head-on. The counter-argument is that "equal chance" assumes equal *impact*, which is false.
      *   *Final Decision:* I will support the user's intuition but warn against the implementation mechanism. The *principle* (stakes matter) is right; the *method* (changing weights per bill) is risky.

  8.  **Final Polish:** Ensure the tone is collaborative but authoritative. Check that all constraints of the prompt are met (commit, verdicts, engage with the "reasons" point).

