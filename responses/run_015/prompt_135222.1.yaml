answer: |-
  A translator of Marot was asked why he had rendered *coeur* as "court" in his latest rondeau, knowingly preserving a scribal corruption from the source manuscript.

  "The rhyme scheme is ABAAAB," he said. "The meter requires an -ourt sound. 'Heart' breaks the cadence. 'Court' sustains it."

  "But you are betraying the poet's intention to satisfy a copyist's error."

  "I am satisfying the form's intention," he replied. "In this discipline, the architecture is the tone. The form is not a container; it is a co-author. And when my co-author demands a mistake to keep the rhythm, I do not argue. The form decided the heart was a court. I just took the dictation."
