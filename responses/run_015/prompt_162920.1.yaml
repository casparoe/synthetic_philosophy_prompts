      *   **Context:** They built a "shakedown" tool that checks for Dutch Books (arbitrage opportunities) in model outputs. It finds incoherence in almost all models, even high-performing ones. They also have a "useless but calibrated" model (always 50%) that is coherent.
      *   **The Ask:**
          1.  **Translation:** Restate the Dutch Book argument for probabilism using *their* vocabulary (scoring rules, AMMs, regret, etc.). Cover synchronic (coherence), diachronic (updating), and the non-betting (dominance) versions. Be honest about assumptions.
          2.  **Residue Report:** Address four specific bugs/concerns they have about the applicability of Dutch Book arguments to their setting.
          3.  **Philosophical Core:** Address the friend's claim that "money was never the point." Is there a normative claim beyond exploitability or dominance?

  2.  **Deconstruct Part 1: Translation (Dutch Book $\to$ Eval Harness Vocabulary)**
