          *   *Verdict:* The "sure loss" in log-space is a guaranteed reduction in wealth fraction. It holds, but the *magnitude* interpretation changes. Linearity is required for the *simple* sum of bets; for log-loss, we look at dominance in score space, which holds regardless of risk aversion if the rule is strictly proper.
      *   *Bug 3: Coherence vs. Skill (The 50% Model).* Coherent models can be useless. Incoherent models can be sharp.
