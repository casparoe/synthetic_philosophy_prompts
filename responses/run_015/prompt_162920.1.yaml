      *   *Bug 4: Exploitability vs. Rationality.* Is "irrational" just "exploitable"?
          *   *Analysis:* This is the core philosophical tension. Pragmatic vs. Epistemic norms.
          *   *Verdict:* If you only care about external metrics, exploitability matters only if an adversary exists. But the "dominance" argument says you are *self-defeating* regardless of adversaries. You are choosing a strategy strictly worse than another available strategy.

  4.  **Deconstruct Part 3: The Friend's Point (Money vs. Norms)**
      *   The friend says money isn't the point.
      *   *Interpretation:* Dutch Book is a *theorem* about coherence. The *argument* for probabilism uses it as a metaphor for epistemic consistency.
      *   *Epistemic Utility Theory:* The real claim is about "Accuracy." If you are incoherent, you are *guaranteed* to be less accurate (by a proper scoring rule) than some coherent alternative, regardless of what happens in the world.
