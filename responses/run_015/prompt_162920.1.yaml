          *   *Verdict:* This is an artifact of the test harness. The model isn't an agent; it's a function. The incoherence is in the *outputs*, not necessarily the *agent's commitments*.
      *   *Bug 2: Log Loss vs. Linear Utility.* Dutch Book assumes linear money utility. Log loss is non-linear (Kelly-ish).
