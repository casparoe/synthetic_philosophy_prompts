  7.  *(Self-Correction during drafting)*: I need to make sure I don't conflate "Calibration" (frequency matching) with "Coherence" (probability axioms). The user knows this, but the translation needs to be precise. The 50% model is calibrated (maybe) and coherent. The sharp model is incoherent.
      *   *Correction:* The 50% model is coherent ($0.5 + 0.5 = 1$). The sharp model violates $P(A \cup B) = P(A) + P(B) - P(A \cap B)$.
