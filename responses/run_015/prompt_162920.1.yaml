  8.  **Final Review of the "Friend's Point":** The friend is likely referencing the shift from Pragmatic Dutch Book arguments (Ramsey/de Finetti) to Epistemic Utility arguments (Joyce). I need to make sure this distinction is clear. The money is a *proxy* for epistemic utility.

