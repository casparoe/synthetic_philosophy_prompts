      *   *Synchronic (Coherence):*
          *   *Incoherence $\to$ Book:* If $P(A) + P(\neg A) \neq 1$, the solver finds weights $w_1, w_2$ such that $\sum w_i \cdot \text{Score}_i < 0$ (or strictly worse than a baseline) for all outcomes. In scoring rule terms: The reported vector $\mathbf{p}$ is dominated by some other report $\mathbf{q}$ across all outcomes.
          *   *Coherence $\to$ No Book:* If $\mathbf{p}$ is a valid distribution, no linear combination of contracts yields guaranteed loss. In scoring terms: $\mathbf{p}$ minimizes expected score given itself (self-consistency).
      *   *Diachronic (Updating):*
          *   *Conditionalization:* If you update to $P_{new}$ not via Bayes rule on evidence $E$, there exists a sequence of bets (before and after) that guarantees loss.
          *   *Scoring/Regret:* In online learning, if your update rule isn't Bayesian (or calibrated equivalent), you incur higher regret compared to the best fixed strategy in hindsight, or you are vulnerable to "information arbitrage" (selling info you already have).
      *   *Non-Betting (Dominance):*
          *   This is the "Accuracy Dominance" argument (Joyce, Predd et al.).
          *   If $\mathbf{p}$ is incoherent, there exists $\mathbf{q}$ (coherent) such that $\text{Score}(\mathbf{q}, \text{world}) > \text{Score}(\mathbf{p}, \text{world})$ for *all* worlds.
          *   This maps perfectly to their "shakedown" finding a portfolio that loses money, but phrased as "finding a report $\mathbf{q}$ that gets better log-loss everywhere."

  3.  **Deconstruct Part 2: The Residue Report (The 4 Bugs)**
      *   *Bug 1: Extrapolation/Counterfactuals.* The solver assumes the model *would* trade on events it wasn't asked about.
