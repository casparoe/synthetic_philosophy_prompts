answer: |-
  Welcome, everyone. Thank you for coming. We have a rare configuration in this room: physicists who believe the rules of evidence have evolved, philosophers who believe those rules are the only thing keeping us honest, early-career researchers wondering where their careers fit, and the foundation director who decides if we get to do this again.

  We are here to ask whether fundamental physics has quietly changed what counts as evidence. Specifically, we are here to look at the "no-alternatives" argument. The claim is this: if decades of brilliant people have tried to build a rival framework and failed, that failure is itself evidence that the existing framework is correct.

  To understand the stakes, I want us to imagine a locksmith.

  Suppose you are a locksmith trying to open a lock buried deep underground. You cannot see the lock. You can only send down keys. You have spent thirty years filing one specific key. Every other key you send down snaps in the dark. The "no-alternatives" argument says: "Since no other key works, this key must be the right one."

  There are two ways to hear that claim. The first is physics: the lock is so uniquely constrained that only this shape fits. The absence of rivals is evidence about the world. The second is sociology: we stopped hiring locksmiths who use different metal. We stopped inviting them to conferences. We made their workshops unliveable. In this reading, the absence of rivals tells you nothing about the lock, only about the workshop.

  And there is a second twist, one that keeps me awake. What if the lock itself accepts ten-to-the-five-hundred different combinations? If the theory predicts a landscape of possibilities, then the very thing the non-empirical argument was supposed to establish—that there is basically one way physics could be—is false by the theory's own lights. The argument and the multiverse seem to eat each other.

  This is not abstract. For the early-career researchers here: you are asking if you should spend your twenties filing a key for a lock you may never see open. I will not offer you false reassurance. It is a risk. But it is a risk worth taking only if we are honest about the odds.

  For our funder: you are deciding whether this is still locksmithing, or just admiring the key. Funding this workshop is not about buying answers. It is about buying the right to ask the question without flinching. If we cannot scrutinize our own standards of evidence, we are not doing science; we are doing tradition.

  And for my old supervisor, who is in the front row and never quite reconciled himself to my career path: you taught me that a key you cannot test is just a piece of metal. You are right to worry. I hope you find enough rigor in these two days to laugh without feeling heckled.

  We are not here to smooth this over. We are not here to agree that there are "interesting questions." We are here to see if the key turns, or if we are simply locked in a room of our own making. Let's get to work.
