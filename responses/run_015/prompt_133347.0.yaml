answer: |-
  The grate was hot enough to curl the hair on Elara's arms, even through the thick canvas of her gloves. She shoved another scoop of coal into the maw of the Central Furnace, watching the flames lick up the brickwork. Above her, the great pressure gauge trembled, the needle hovering in the green zone. This was the heart of Meridian, the island city-state that ran on heat.

  In Meridian, wealth wasn't stacked in vaults; it was circulated through pipes. The currency was heat-bonds, strips of treated paper that changed color based on the ambient temperature of the district where they were spent. But the baseline came from here, from the Furnace. When the Furnace burned hot, the air in the pipes expanded, pressing against the bonds, making them glow a vibrant, valuable red. When the fire died down, the bonds faded to a useless blue.

  Elara was just a tender. She didn't sit on the Council of Thermo-Dynamics. She didn't decide how much coal to burn. She just watched the gauge and listened to the hiss of the mains.

  "More," the foreman shouted over the roar of the draft. "The Council sent word. The surplus shipment from the mainland arrived early. Burn it all."

  Elara paused, shovel in hand. "All of it? The gauge is already at peak efficiency."

  "The economy needs stimulation," the foreman said, wiping sweat from his brow with a rag that smoked slightly. "More heat means more value. People will feel richer. They'll spend."

  Elara dumped the coal. The furnace groaned, then roared. The needle climbed into the yellow.

  By evening, the effects were visible. Elara walked home through the Market District, the air shimmering above the cobblestones. The bonds in her pocket felt warm against her thigh. She stopped at the baker's stall to buy her evening loaf. The baker, a man named Kael who had known her since childhood, was wiping down his counter with a wet cloth that evaporated instantly.

  "Price went up," Kael said, not looking at her.

  "The loaf is the same size," Elara said.

  "The heat is higher," Kael replied, tapping a bond on the counter. The paper glowed a deep, angry orange. "My oven doesn't need extra help to bake, Elara. The air itself is doing half the work. But everyone's bonds are reading high. So the price goes up. It's just numbers. The bread is still one loaf."

  Elara handed over the notes. They burned her fingers slightly. She walked away holding the bread, feeling the hollowness in her stomach that hadn't been there before. The city was hotter, brighter, and louder. The bonds were worth more, but they bought less. It was like pouring oil into an engine that was already running at full speed; the wheels didn't turn faster, they just slipped, smoking and screeching.

  The real trouble started two days later.

  The Industrial District, Verta, had been exporting machinery to the outer isles nonstop. They were sending out goods and taking in nothing but payment. In Meridian, payment was heat. The excess energy from the trade balance flowed back through the return pipes to Verta, warming their bonds.

  But with the Council dumping extra coal into the Central Furnace, the system was already saturated.

  Elara was on the morning shift when the alarm bells began to clang. It wasn't the low-pressure whine of a cooling system; it was the high-pitched scream of overpressure.

  "Verta's mains are blocking!" the foreman yelled, rushing into the furnace room. "The heat isn't circulating. It's pooling."

  Elara looked at the district gauges. Verta's needle was pinned in the red zone. Lowland, the agricultural district that imported food from Verta, was dropping into the blue.

  "It's the flow mechanism," Elara said, her voice quiet. "Verta has too much heat. Their prices are skyrocketing. Nobody can afford to buy their machines. Lowland has no heat. Their crops are freezing in the fields. The heat needs to flow back to Lowland to balance it."

  "The pipes are jammed," the foreman said. "The thermal expansion locked the valves. Verta hoarded the energy, and now the pipes are fused shut."

  Elara looked at the Central Furnace. The coal pile was dwindling, but the heat was unbearable. The city was suffering from a fever. In Verta, people were suffering from heatstroke; their bonds were so hot they blistered skin. In Lowland, people were shivering, their bonds too cold to register value, unable to buy the food that was rotting in the cold fields.

  The Council's plan had broken the engine. They thought adding more oil would make the car go faster, but they had flooded the carburetor. And unlike gold coins, which sat quietly in a pocket, this money was physical. It was dangerous.

  "I'm going to the junction," Elara said, grabbing her heavy wrench.

  "It's too hot down there," the foreman warned.

  "The heat is stuck," Elara said. "It's not wealth if it doesn't move. It's just fire."

  She left the furnace room and descended into the pipe tunnels. The air down here was thick enough to taste, metallic and dry. Her goggles fogged immediately. She followed the main vein toward Verta. The pipes hummed violently, vibrating against the brickwork.

  When she reached the junction valve, she saw the problem. The metal had swollen from the intense heat, grinding the gear mechanism to a halt. The heat was trapped in Verta, making their currency worthless through sheer inflation, while Lowland starved in the cold.

  Hume's old idea, though she didn't know the name, struck her then as she wrestled with the wrench. The money was just the oil. The wealth was the grain in Lowland and the machines in Verta. The heat was supposed to grease the trade, to let the grain move to the machines and the machines to the grain. But everyone had started worshipping the heat itself.

  She jammed the wrench into the release valve. It wasn't designed to be opened manually. It was designed to flow automatically, a self-correcting balance where excess heat naturally drifted to the cold spots. But the surplus coal had created a pressure wall, and Verta's greed had built a dam.

  Elara put her weight into the wrench. The metal bit into her gloved hands. She could feel the heat radiating through the tool, warming her bones. It was seductive. If she let it build enough, maybe the pressure would blow the locks open. But it would also blow the pipes.

  "No," she whispered. "You don't fix a flow by adding more water."

  She stopped trying to force the valve open and instead moved to the vent release. It was a small pipe, usually used for maintenance. If she opened it, she would vent the excess heat from Verta directly into the atmosphere. It would waste energy. It would lower the total value of the bonds in the city.

  But it would lower the pressure.

  She turned the vent wheel. A jet of white steam screamed out, blasting into the tunnel. The gauge on the wall dropped. Verta's pressure eased. The swelling metal groaned and began to contract. With a loud *clang*, the main valve slipped free, unlocked by the cooling.

  Elara shoved the valve open.

  She felt the rush immediately. The hot air surged from Verta, rushing down the line toward the freezing districts of Lowland. The vibration in the pipes changed from a scream to a hum. The balance was restoring itself. Verta would cool down, their prices would fall, and their machines would become affordable again. Lowland would warm up, their bonds would gain value, and they could buy the food.

  Elara leaned against the wall, sliding down to the grate. Her gloves were scorched. The tunnel was still hot, but the deadly pressure was gone.

  A week later, the Council announced a reduction in coal imports. The gauge settled back into the green. Elara stood at the furnace, shoveling at a steady, rhythmic pace.

  Kael the baker came by the furnace room door, holding a bag of flour.

  "Heard you vented half the surplus," he said.

  "It was choking us," Elara said.

  "Bread price is down," Kael noted. "Bonds are cooler. Easier to hold."

  "The heat wasn't the bread," Elara said, watching the flames. "We forgot that."

  She tossed another scoop of coal into the fire. It burned bright, but not too bright. The heat moved through the pipes, invisible and silent, greasing the wheels of the city. It didn't make anyone rich. It didn't make anyone poor. It just allowed the work to happen. And for now, that was enough. The engine hummed, the oil flowed, and the bread was baked.
