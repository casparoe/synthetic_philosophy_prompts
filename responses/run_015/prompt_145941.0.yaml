answer: |-
  First off: this is not a dumb framing. In fact, you have independently rediscovered one of the central problems in the philosophy of mind and language. You are asking about **Intentionality** (the "aboutness" of mental states or symbols) and specifically about the **Grounding Problem** (how symbols hook onto the world).

  Your intuition is correct: there is a meaningful distinction between your three cases, but the standard "Original vs. Derived Intentionality" split (Searle/Dennett) is a bit too blunt an instrument for what you're seeing. Searle's distinction is binary (Mind vs. Non-Mind), whereas you are describing a spectrum of **semantic grounding**.

  Here is the vocabulary you need, how it maps to your cases, and where the actual philosophical "carving" happens.

  ---

  ### 1. The Searle/Dennett Hypothesis
  **Is this Original vs. Derived Intentionality?**

  *   **Derived Intentionality:** Symbols (words, code, maps) that have meaning only because a mind lends it to them.
  *   **Original Intentionality:** Mental states (beliefs, desires) that have meaning intrinsically (usually reserved for conscious beings).

  **The Verdict:** Under strict Searlean definitions, **all three of your cases are Derived Intentionality.** None of them are conscious minds. The variable, the neuron, and the register are all physical artifacts.

  **However,** your intuition is picking up on a debate *within* the theory of derived intentionality. Philosophers of information and cognitive science distinguish between **Conventional Reference** (Case 1) and **Naturalized Reference** (Cases 2 & 3).

  ### 2. A Better Framework: Three Modes of Grounding

  To capture the nuance you're seeing, we need to look at **Informational Semantics** (Fred Dretske) and **Teleosemantics** (Ruth Millikan). Here is how your three cases map to established philosophical concepts:

  #### Case 1: `customer_email` (The Variable)
  *   **Philosophical Term:** **Stipulative Reference** or **Conventional Intentionality**.
  *   **Mechanism:** The link between symbol and referent is arbitrary. It exists solely because of a social/developer contract.
  *   **The "Aboutness":** Borrowed entirely from the programmer's declaration.
  *   **Failure Mode:** If you put a phone number in `customer_email`, the code is *buggy*, but the variable doesn't "lie." It just fails the type contract. The meaning is external to the system.

  #### Case 2: Cat Activation (The Neural Net)
  *   **Philosophical Term:** **Teleosemantics** (Function-based) or **Emergent Representation**.
  *   **Mechanism:** The link is forged by optimization pressure (loss function). The activation "means" cat because its *function* in the system is to distinguish cats from non-cats to minimize error.
  *   **The "Aboutness":** Intrinsic to the system's structure, but derived from the training history.
  *   **Failure Mode:** **Misrepresentation.** If the neuron fires for a dog, it is *wrong*. This is crucial. In Case 1, a variable is just data. In Case 2, the activation makes a claim about the world that can be false. This ability to be false is a hallmark of genuine intentionality.

  #### Case 3: Shadow Register (The Hybrid)
  *   **Philosophical Term:** **Causal Theory of Reference** or **Indicator Semantics**.
  *   **Mechanism:** This is the one that bugs you. It is an **Information Channel**.
  *   **The "Aboutness":** It refers to temperature not because of a name (Case 1) and not because of classification function (Case 2), but because of **reliable covariation**.
  *   **Why it's unique:** The engineer built the *causal pipe*, but the *semantics* were discovered, not assigned. The system treats it as temperature because the bits *carry information* about temperature (in the Shannon sense).

  ### 3. The "Shadow Register" Problem: What is it?

  You asked for a name for "intentionally built but semantically opaque." In philosophy of science and measurement theory, this is often called a **Transducer** or an **Instrumental Representation**.

  The specific phenomenon you are identifying is the difference between **Syntax** (the bits), **Causal History** (the wiring), and **Interpretive Role** (how downstream systems use it).

  Your Shadow Register is a case of **Naturalized Meaning within an Artificial System.**
  *   It isn't **Conventional** (like the variable name), because you can't rename it without breaking the causal link.
  *   It isn't **Teleological** (like the cat neuron), because it wasn't optimized to *represent* temperature; it just *does* represent temperature because of physics.

  **The Philosophical Term:** This is often discussed under **Informational Semantics**. The register has content because it stands in a reliable nomic (law-like) dependency with the temperature. If the temperature changes, the bits *must* change. That counterfactual dependency *is* the meaning.

  ### 4. Where is the Line? (The Carving)

  You asked: *Is the line about the designer's knowledge, the causal history, or whether the system can misrepresent?*

  The consensus in modern naturalized philosophy of mind is that the line is drawn at **Misrepresentation** and **Counterfactual Dependence**.

  1.  **Designer's Knowledge:** Irrelevant. (In your Shadow Register, the engineer doesn't know the format, yet the meaning exists).
  2.  **Causal History:** Necessary but not sufficient. (A wire connecting two random things has causal history but no meaning).
  3.  **The Real Carving:** **The Capacity for Error.**

  Here is the test for your three cases:

  *   **Variable (`customer_email`):** Can it be "false"? No. If it holds "555-0199", it holds "555-0199". It is only "wrong" relative to an external human expectation. It has no internal truth conditions.
  *   **Cat Neuron:** Can it be "false"? Yes. If it fires for a dog, the system has made an error *internally*. The representation failed to match the world.
  *   **Shadow Register:** Can it be "false"? **Yes.** This is the key. If the sensor drifts due to heat, but the downstream system continues to interpret the bits as "temperature," the system is now acting on **false information**. The register is *misrepresenting* the temperature.

  **The Phenomenon:**
  Your Shadow Register is an **Indicator**.
  *   **Case 1** is a **Label**.
  *   **Case 2** is a **Detector**.
  *   **Case 3** is a **Transducer**.

  ### 5. Why This Matters for Engineering (The "So What?")

  You might wonder why philosophers care about this. It maps directly to **System Safety and Alignment.**

  *   **Labels (Case 1)** break via **Refactoring Errors.** (You renamed the variable).
  *   **Detectors (Case 2)** break via **Distribution Shift.** (The model sees a cat in a style it wasn't trained on).
  *   **Transducers (Case 3)** break via **Decoupling.** (The causal link remains, but the correlation breaks).

  **The "Shadow Register" Risk:**
  This is the most dangerous case in engineering. Because the engineer *wired* it, they assume it has **Case 1 stability** (it's just a variable). But because it relies on physical correlation, it actually has **Case 2 fragility** (it can drift or decouple).

  When you treat a Transducer (Case 3) like a Label (Case 1), you get **Ontological Drift**. You assume the bits *mean* temperature by definition, but they only mean temperature as long as the physics holds.

  ### Summary Vocabulary List

  If you want to read more or search for papers, here are the terms that match your intuition:

  1.  **Intentionality:** The property of "being about" something.
  2.  **Derived Intentionality:** Meaning borrowed from a user/designer (Your Case 1).
  3.  **Naturalized Intentionality:** Meaning explained by physical/causal processes without invoking magic minds (Your Cases 2 & 3).
  4.  **Informational Semantics:** Meaning defined by reliable correlation (Your Case 3).
  5.  **Teleosemantics:** Meaning defined by evolutionary or optimization function (Your Case 2).
  6.  **Misrepresentation:** The ability of a system to be wrong about the world (The litmus test for Cases 2 & 3).

  **Final Answer:**
  Your "Shadow Register" is not a different axis entirely; it is a specific instance of **Informational Semantics** situated between **Conventional Reference** and **Functional Representation**. It is an **Indicator State**. The distinction isn't about the designer's intent, but about whether the system's state **covaries** with the world in a way that allows for **error**.

  You have correctly identified that "meaning" in software isn't one thing. It's a stack:
  1.  **Syntax** (Bits)
  2.  **Causal Grounding** (The Shadow Register link)
  3.  **Semantic Interpretation** (Downstream usage)

  When those three align, you have a robust system. When you assume #3 exists because of #1, but it actually relies on #2, you have a bug waiting to happen.
