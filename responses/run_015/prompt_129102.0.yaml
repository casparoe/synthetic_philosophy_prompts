answer: |-
  ### Exam Question

  **Course:** Rationality and Practical Reasoning (Upper-Level Undergraduate)
  **Time Allowed:** 90 Minutes
  **Word Count:** Approximately 800–1000 words

  **Essay Question:**

  Consider a fifteen-year multi-laboratory scientific project studying an anomalous physical effect. The study has produced consistently null results, and the researchers do not anticipate a breakthrough. However, they propose continuing the project. Their justification is not epistemic hope, but sociological preservation: abandoning the project would dissolve the specialized epistemic community, shared methodological norms, and inter-laboratory trust that the investment itself created.

  Standard rational choice theory suggests this reasoning is fallacious. Yet, some philosophers argue that certain sunk costs function as constitutive investments that partially form an agent's identity or the value of an ongoing practice.

  Write an essay addressing the following five points:

  1.  **Articulate the Standard View:** Explain the standard economic argument that rational choice is forward-looking and why unrecoverable past costs must typically be ignored.
  2.  **Analyze the Case:** Analyze the scientific-collaboration case through the lens of constitutive investment. Explain how past expenditure might generate present reasons that are not reducible to anticipated future benefits.
  3.  **Address the Objection:** Address the objection that allowing such reasons collapses into mere psychological attachment or commitment bias. Propose a principled criterion for distinguishing legitimate path-dependent rationality from fallacious reasoning.
  4.  **Evaluate Diachronic Rationality:** Evaluate whether there is a coherent concept of diachronic rationality—where an agent's history constrains present choice without being instrumentalized—that can accommodate the case without undermining the core insight of the sunk-cost critique.
  5.  **Defend a Position:** Take and defend a clear position on whether honoring sunk costs is *always* irrational, with explicit reference to the collaboration case.

  ***

  ### Model Answer

  Standard rational choice theory models agents as time-slice maximizers of expected utility. On this view, rationality is strictly forward-looking: only future consequences matter. Past expenditures are "sunk" because they are unrecoverable; counting them twice involves a logical error where resources already spent are treated as if they are still at stake. Therefore, the fifteen-year study should be abandoned if its expected future utility is lower than alternative uses of those resources, regardless of past effort.

  However, this model assumes an atomistic agent whose identity is independent of their history. In the scientific collaboration case, the past expenditure is not merely a cost but a constitutive investment. The fifteen years of work did not just purchase data; they constructed an epistemic community. The value here is not in the null results, but in the shared norms and trust generated by the joint struggle. Abandoning the project destroys this constituted value. Thus, the past expenditure generates a present reason to continue: the preservation of a valuable practice that only exists because of that specific history. The cost is not being recouped instrumentally; it is being honored constitutively.

  Critics argue this is merely commitment bias—emotional attachment masquerading as reason. To distinguish legitimate path-dependence from bias, we need a structural criterion rather than an intuitive one. A valid constitutive reason must be reflectively endorseable as sustaining a valuable form of agency. If the researchers continue solely to avoid the pain of admitting failure, that is bias. If they continue because the collaboration itself constitutes a unique epistemic good that cannot be recreated elsewhere, that is rational path-dependence. The criterion is whether the practice sustains a value that justifies the constraint on future choice.

  This requires a concept of diachronic rationality. The standard model treats the agent as a series of disconnected moments. A diachronic view recognizes that agents exist over time and that rationality involves maintaining integrity across those times. History constrains present choice not because the past dictates the future, but because the agent's identity is woven from past commitments. This does not undermine the sunk-cost critique generally; it limits its scope. The critique holds for instrumental transactions but fails for constitutive practices where the history is part of the good itself.

  Therefore, honoring sunk costs is not always irrational. It is irrational when the past cost is treated as an instrumental investment expecting future returns that are unlikely. It is rational when the past cost has created a constitutive good—like trust or community—that would be lost upon abandonment. In the collaboration case, continuing is rational if the community itself is the primary output. To abandon it would be to destroy the very value the resources created. Rationality requires respecting the integrity of the agent over time, not just maximizing utility in the immediate moment. Thus, while the standard warning against sunk costs protects against waste, it must not blind us to the value of constituted identities.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Articulate the Standard View (4 Marks)**
  *   **A Level (4 marks):** Explicitly identifies the "forward-looking" constraint and the "time-slice maximizer" assumption. Explains that past costs are ignored because they cannot be recovered, not just because they are past.
      *   *Common Error:* Defines sunk cost merely as "money spent" without explaining the expected utility framework.
  *   **B Level (2–3 marks):** Correctly states past costs should be ignored but fails to link this to the atomistic/time-slice model of agency.
  *   **Fail (0–1 mark):** Incorrectly defines sunk costs or claims standard theory allows past costs to matter.

  **2. Analyze the Case via Constitutive Investment (4 Marks)**
  *   **A Level (4 marks):** Explains that the investment *created* the value (community/norms) rather than just purchasing a result. Distinguishes between instrumental value (data) and constitutive value (practice).
      *   *Common Error:* Treats the community as a future benefit to be gained, rather than a present value constituted by the past.
  *   **B Level (2–3 marks):** Argues the team should stay to save the community but treats the community as a standard future utility rather than a constitutive element of the past investment.
  *   **Fail (0–1 mark):** Ignores the specific details of the scientific collaboration case.

  **3. Address the Objection (Bias vs. Principle) (4 Marks)**
  *   **A Level (4 marks):** Proposes a structural/principled criterion (e.g., reflective endorseability, sustainability of agency) to distinguish bias from rational path-dependence.
      *   *Common Error:* Relies on intuition (e.g., "it feels different") rather than a principled criterion.
  *   **B Level (2–3 marks):** Acknowledges the risk of bias but offers only a vague distinction (e.g., "good reasons vs. bad reasons").
  *   **Fail (0–1 mark):** Dismisses the objection or conflates bias with rationality.

  **4. Evaluate Diachronic Rationality (4 Marks)**
  *   **A Level (4 marks):** Contrasts diachronic agency with time-slice maximization. Explains how history constrains choice without instrumentalizing the past (identity integrity).
      *   *Common Error:* Claims diachronic rationality simply means "planning ahead," missing the constraint aspect.
  *   **B Level (2–3 marks):** Discusses time/History but fails to explain how this avoids undermining the standard sunk-cost critique.
  *   **Fail (0–1 mark):** Denies the possibility of diachronic rationality or ignores the prompt.

  **5. Defend a Position (4 Marks)**
  *   **A Level (4 marks):** Takes a nuanced "No" (not always irrational). Defends the distinction between instrumental vs. constitutive contexts using the case as evidence.
      *   *Common Error:* Takes an absolute position ("Always irrational" or "Never irrational") without qualifying the constitutive exception.
  *   **B Level (2–3 marks):** Takes a clear position but the justification is weak or disconnects from the collaboration case.
  *   **Fail (0–1 mark):** No clear position or conclusion is contradictory.

  **Grade Boundaries:**
  *   **A (16–20):** Demonstrates all A Level moves. Shows deep conceptual engagement with agency and value.
  *   **B (13–15):** Demonstrates mostly B Level moves with perhaps one A Level insight. Competent but lacks structural depth.
  *   **C (10–12):** Addresses all 5 points but with significant conceptual vagueness or errors.
  *   **Fail (0–9):** Misses multiple requirements or fundamental misunderstandings.
