answer: |-
  **Activity: The Glyph Borderlands**

  **Materials:** 12 handouts. 15 glyphs each: 5 canonical 'A's, 5 clear non-'A's (Q, R), 5 edge-cases (no crossbar, rotated 90°, inside 'c_t').

  **Timeline:**
  1.  **Vote (10m):** Silent marking: A or Not-A.
  2.  **Debate (35m):** Project glyphs. Reveal vote splits. Discuss only items with >30% disagreement. Defend classifications.
  3.  **Debrief (15m):** Map findings to theory.

  **Scoring:** 1 pt if your vote matches final group consensus. 2 pts if you argue a minority view that shifts the consensus.

  **Debrief Mapping:**
  *   **Context:** Did the 'c_t' item become an 'A' only because of neighbors? If yes, geometric essence fails; context constitutes identity.
  *   **Style:** Did wildly different shapes (handwritten vs. serif) all count as 'A'? If yes, the category is a fuzzy region, not a definition.
  *   **Theory:** Contrast "Necessary & Sufficient Conditions" (Essence) vs. "Family Resemblance" (Style-Space). Map to Hofstadter: Essence claims invariant features; Style-Space claims fluid perception based on global context.

  **Predicted Failures:** Students will frustrate over "correct" answers. Some will ignore context cues, focusing solely on local geometry.

  **Limitation:** Hofstadter's *Letter Spirit* is about *generating* a consistent style across a full alphabet grid. This activity tests *recognition* of isolated instances. It captures the fuzzy boundary but misses the systemic constraint of maintaining a single "spirit" across different letters.
