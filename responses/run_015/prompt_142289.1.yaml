  2.  **Deconstruct the Philosophical/Film Intersection:**
      *   *Sartre on Facticity & Transcendence:* For Sartre, human reality is a synthesis of facticity (what I am) and transcendence (what I project myself toward). Bad faith often involves denying one or the other. Pure transcendence without facticity is angelic; pure facticity without transcendence is inert.
      *   *User's "Facticity Starvation":* This is a clever twist. Usually, facticity is the *weight* that resists freedom. In the loop, the weight disappears every morning. The past doesn't stick. The body resets. Only consciousness (knowledge/skill) remains. This creates a hyper-agency that leads to nihilism (suicides) because action lacks consequence.
      *   *Sartrean Compatibility:* Sartre argues freedom is always *situated*. If the situation resets, is it still a situation? Yes, but a thin one. The user suggests freedom without facticity is unlivable. Sartre would likely agree that pure freedom is anguish, but he insists facticity is always there (you can't escape being *in* a body, even if it resets). The loop makes facticity *contingent* rather than *accumulative*. This doesn't break Sartre, but it stress-tests the "situation."
      *   *The Homeless Man:* This is the hard limit. Death is the ultimate facticity. Phil cannot transcend this. He tries everything (transcendence) but the man dies (facticity wins). Phil's kindness thereafter: Is it bad faith? Bad faith is lying to oneself to escape anguish. If Phil accepts he can't save the man but chooses kindness anyway, that's arguably *authenticity* (accepting limits). If he does it to feel good despite uselessness, it's bad faith. Given the arc, it looks like acceptance of limits (authenticity), but the user's skepticism is valid.
      *   *The Ending:* Sartre denies pre-ordained meaning or cosmic reward. The loop breaking because Phil "becomes good" suggests a moral order to the universe. This *does* clash with Sartre's atheistic existentialism where existence precedes essence and there's no judge. However, one could argue the loop wasn't cosmic justice, but a psychological projection that dissolves when his project changes. But the film treats it as external magic. This is the weakest link for a strict Sartrean reading.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Acknowledge the standard reading and pivot to the user's "facticity starvation" concept.
