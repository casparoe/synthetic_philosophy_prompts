      *   *The Homeless Man:* Address the limit. Death is the ultimate facticity. Phil's inability to save him proves freedom isn't omnipotent. The kindness afterwards: Is it bad faith? Argue that it shifts from *mastery* (saving him) to *solidarity* (being with him). This isn't necessarily bad faith if he acknowledges the death is inevitable. It's choosing value in a void.
      *   *The Ending:* This is the trouble spot. Sartre says we are condemned to be free; there's no exit ramp provided by the universe. The film gives an exit ramp. Does this betray the philosophy? Yes, somewhat. It imposes an essence (Phil becomes who he was meant to be). But for the audience, it's necessary closure. We can frame it as Phil's *projection* changing, not the universe rewarding him. But honestly, the magic is external.
      *   *Conclusion:* Summarize the tension. The film works better as a test case than an illustration.

