      *   **Pearl (Interventionist/Structural Causal Models - SCMs):** Uses Directed Acyclic Graphs (DAGs) and do-calculus. Defines direct effect (NDE) and indirect effect (NIE) using nested counterfactuals (e.g., $Y(1, M(0))$). Explicitly handles confounding via adjustment criteria. Can handle "mediator-outcome confounders affected by treatment" using specific identification strategies (though often requires strong assumptions or longitudinal data).

