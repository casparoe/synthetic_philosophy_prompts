answer: |-
  Here is a design for the session. It is built to be run by you and one helper, with minimal setup, relying on the mechanics to do the teaching.

  ### 1. Materials & Setup

  *   **Tables:** 4 tables (roughly 3-4 people per table).
  *   **Decks:** 4 standard decks of cards. Remove all suits; you only need Red and Black. Shuffle them so each deck is 2/3 Red, 1/3 Black. (For a 52-card deck, use 26 Red, 13 Black, discard the rest).
  *   **Currency:** Tokens or chocolates. Let's call them "chits."
  *   **Handouts:** You need small printed cards (index cards work) for the Rules. Do not read the rules out loud; hand them out. This prevents the "lecture" feel.
      *   *Rule Card A (Movement 1)*
      *   *Rule Card B (Movement 2)*
  *   **Helper:** Their job is to circulate with a fresh deck for each table if cards get mixed, and to distribute chits. They do not explain rules.

  ### 2. Timeline (90 Minutes)

  *   **00:00 – 00:05:** Welcome & Token Distribution.
  *   **00:05 – 00:35:** Movement 1 (The Standard Case).
  *   **00:35 – 00:40:** Transition & Rule Swap.
  *   **00:40 – 01:10:** Movement 2 (The Obligation Case).
  *   **01:10 – 01:30:** Debrief & Discussion.

  ### 3. Movement 1: The Value of Information

  **Goal:** Establish that information has value, and that refusing free information is leaving value on the table.

  **The Setup:**
  Give each player 20 chits. Hand out **Rule Card A**.

  **Rule Card A Text:**
  > 1. **The Goal:** Maximize your chits.
  > 2. **The Round:** A card is drawn from the deck (2/3 Red, 1/3 Black). It is placed face down.
  > 3. **The Bet:** You must guess the color.
  >     *   If you guess **Red** and it is Red: You win **10 chits**.
  >     *   If you guess **Black** and it is Black: You win **10 chits**.
  >     *   If you guess wrong: **0 chits**.
  > 4. **The Peek:** Before guessing, you may choose to look at the card.
  >     *   **Rounds 1–3:** Peek costs **5 chits**.
  >     *   **Rounds 4–5:** Peek costs **2 chits**.
  >     *   **Round 6:** Peek costs **0 chits**.
  > 5. **Procedure:** Decide silently. If you pay, look, then guess. If you don't pay, guess blind. Record your result.

  **Facilitator Script (Intro):**
  "We're going to play six rounds of a simple guessing game. You have your rule cards. I am not going to explain them; please read them carefully. The only rule is silence during the rounds. You play individually. Your helper will deal the cards. Begin Round 1."

  **The Trap:**
  In Rounds 1–3, the cost (5) is high. The expected value of the peek is roughly 3.3 chits (it turns a 66% guess into a 100% guess on a 10-chit win, minus the cost). Rational players should *not* peek.
  In Round 6, the cost is 0. Rational players *must* peek.
  **What you want to happen:** Some players, habituated to Rounds 1–5, will reflexively skip the peek in Round 6 to save "effort" or because they feel they "know the odds."
  **What if they all peek?** That's fine. In the debrief, you simply ask: "Did anyone consider not peeking in Round 6? If you had not peeked, you would have had the same chance of winning, but you would have saved... nothing. But if you didn't peek, you gained nothing by saving cost. Did anyone feel tempted to skip it?"
  *Correction:* To ensure they feel the mistake, you need the value of the info to be obvious.
  *Refinement:* In Round 6, after they play, ask: "Show of hands, who peeked?" (Most will). "Who didn't?" (Some might not). To those who didn't: "You had the chance to know the answer for free. You guessed. You might have guessed wrong. If you had looked, you would have been right. Do you feel you left chits on the table?"
  *Actually, the strongest feeling comes from the contrast.* In the debrief, highlight that in Round 6, refusing the peek was mathematically dominated.

  ### 4. Movement 2: The Obligation Case

  **Goal:** Demonstrate a scenario where free information reduces expected utility.

  **The Setup:**
  Reset chits (or give a bonus to ensure no one is bankrupt). Hand out **Rule Card B**. This replaces Rule Card A.

  **Rule Card B Text:**
  > 1. **The Goal:** Maximize your chits.
  > 2. **The Round:** A card is drawn (2/3 Red, 1/3 Black). Face down.
  > 3. **The Protocol:**
  >     *   **If you DO NOT PEEK:** You are "Blind Shipping." You declare **SHIP**.
  >         *   If Card is Red: **+10 chits**.
  >         *   If Card is Black: **+5 chits**. (Client doesn't notice immediately).
  >     *   **If you DO PEEK (Cost 0):** You are "Quality Certified." You must follow the result.
  >         *   If Card is Red: Declare **SHIP**. Win **+10 chits**.
  >         *   If Card is Black: Declare **QUARANTINE**. Win **0 chits**. (Regulation requires re-work).
  > 4. **Procedure:** Decide silently. Peek or Don't Peek. Declare outcome.

  **Facilitator Script (Transition):**
  "Please put away Rule Card A. Take Rule Card B. The deck is the same. The payoff structure has changed. Read the new protocol carefully. You have six rounds. Begin."

  **The Math:**
  *   **Blind Ship:** (2/3 * 10) + (1/3 * 5) = 6.66 + 1.66 = **8.33 chits**.
  *   **Peek (Certified):** (2/3 * 10) + (1/3 * 0) = **6.66 chits**.
  *   **Result:** The rational move is to *refuse* the free information.

  **What you want to happen:**
  Players who learned "Info is Good" in Movement 1 will instinctively peek in Movement 2. They will see their scores drop compared to the neighbor who didn't peek. They will feel the frustration of being "penalized for knowing."

  ### 5. The Debrief (20 Minutes)

  Do not start with the theorem. Start with their feelings.

  **Step 1: The Movement 1 Feeling**
  " In the first game, Round 6, the peek was free. Did anyone hesitate to take it? Why? ... For most of you, taking the free peek felt obvious. If you didn't take it, did you feel you made a mistake? Why? Because it could only help, never hurt."
  *Write on board:* **Info + Freedom to Act = Value.**

  **Step 2: The Movement 2 Feeling**
  "In the second game, the peek was still free. Who peeked? (Hands). Who didn't? (Hands). How did the peekers feel when they saw a Black card?"
  *Expected answer:* "Annoyed," "Forced," "Should have stayed ignorant."
  "Why was the peek harmful here? Did the card change? No. Did the payoff for Red change? No. What changed?"
  *Guide them to:* "The rules on what I was allowed to *do* after I knew."
  *Write on board:* **Info + Constraint on Action = Risk.**

  **Step 3: Mapping to the Lab (Your Stories)**
  "This reminds me of two stories from my lab days.
  1.  We sometimes didn't test a batch before shipping. Not because the test cost money, but because if the test came back 'Bad,' we were *forced* to stop. If we didn't test, we could ship, and often the client never noticed. The test didn't change the batch; it changed our *obligations*."
  2.  "A colleague said some results are better not known because once you know, you carry the burden. Others treat you differently."

  "Looking at our game: Which story does this game match?"
  *Answer:* Story 1. The game forced a "Quarantine" action on Black. That matches the "Obligation to Act."
  "Story 2 is trickier. In the game, the penalty was points. In the lab, the penalty was stress or social standing. Is that a cost of the test, or a cost of knowing?" (Let them argue this).

  **Step 4: The Theorem (Finally)**
  "There is a result in decision theory, Good's Theorem. It says: 'For an expected-utility maximizer, free information is never worth less than nothing.'
  Why did we break it in Movement 2?
  The theorem assumes that when you get information, you are *free* to use it or ignore it in your decision. In Movement 2, Rule B removed that freedom. If you knew 'Black,' you *had* to Quarantine. You lost the option to 'Ship and Hope.'
  The theorem also assumes your goals don't change just because you know something. Story 2 suggests our goals (or comfort) do change."

  ### 6. Self-Critical Analysis

  You asked for honesty about the stories, the game's limits, and what could go wrong.

  **On Your Lab Stories:**

  *   **Story (a) (The Obligation):**
      *   *Verdict:* This is a **real structural violation** of the theorem's assumptions, not just an unpriced cost.
      *   *Why:* Good's theorem assumes the agent chooses an action $a$ from a set $A$ to maximize utility after seeing signal $s$. It assumes $A$ is constant regardless of $s$. In your story, observing $s=$"Bad" removes the action "Ship" from $A$. You are no longer a free maximizer; you are a constrained one. The theorem does not apply to constrained policies.
      *   *What would change my mind:* If the "obligation" was actually just a massive financial penalty (e.g., fine of 1 million dollars) rather than a hard rule. If it's a fine, it's just a cost in the utility function, and Good's theorem *would* say you should test (because avoiding the fine is worth the info). But if it's a *prohibition* (you literally cannot ship), the action space shrinks. That breaks the math.
      *   *Advice:* Use this story as the primary anchor for Movement 2. It maps perfectly to the "Quarantine" rule.

  *   **Story (b) (The Social Burden):**
      *   *Verdict:* This is likely an **unpriced cost** or a **utility function shift**, not a structural violation.
      *   *Why:* If knowing the result makes you anxious, that anxiety is a negative utility term attached to the state of "Knowing." You can model this as $Cost(Info) > 0$. If the cost is zero (as per the theorem), but the utility of the outcome drops because you are sad, that means $U(Outcome, Known) \neq U(Outcome, Unknown)$. Good's theorem usually assumes utility is over *world states*, not *epistemic states*.
      *   *What would change my mind:* If the social reaction changed the *physical* outcome (e.g., colleagues sabotage your work because they know you know). That becomes a causal consequence of the information release, effectively a cost.
      *   *Advice:* Use this as a discussion point in the debrief. It's philosophically richer but harder to game without it looking like a simple "cost."

  **What Will Definitely Go Wrong:**

  1.  **Table Talk:** In Movement 2, the person who figures out "Don't Peek!" will tell their table. This will spread the strategy too fast.
      *   *Fix:* Emphasize "Silent Play" strictly. If they talk, they pay a 5-chit penalty.
  2.  **Bankruptcy:** In Movement 2, if someone peeks every time and hits Black often, they might run out of chits and disengage.
      *   *Fix:* Give a "Universal Basic Income" of 5 chits at the start of Movement 2. Ensure the downside isn't fatal.
  3.  **The "Free" Peek in Movement 1:** You want them to feel stupid for refusing the free peek. But rational people won't refuse it.
      *   *Reality:* You cannot force them to make a mistake. If they all take the free peek in M1, the theorem is confirmed, which is fine. The "feeling of mistake" comes from the *contrast* in M2. In M2, they *should* refuse. If they refuse in M2, they feel smart. If they peek in M2 (out of habit), they feel the pain. That is the stronger emotional hook. **Pivot your goal:** Don't worry if they take the free info in M1. Worry if they take the free info in M2.
  4.  **Attention Costs:** You noted this. People might skip the peek in M1 just because lifting the card is effort.
      *   *Mitigation:* Acknowledge this in the debrief. "The theorem assumes cost is zero. Was lifting the card zero cost? No. It cost time and effort. So strictly, the theorem didn't apply, but the value was high enough to overcome the effort."

  **What the Game Cannot Do:**

  *   **Prove the Theorem:** It shows *a* case where it holds and *a* case where it fails. It does not prove the mathematical generality.
  *   **Separate Irrationality from Cost:** If someone refuses the free peek in M1, you won't know if they are irrational or if they just value their attention higher than the expected gain.
  *   **Signal Structure:** The game uses a perfect signal (peek = truth). Good's theorem holds for noisy signals too. The game doesn't explore noise.

  **Final Recommendation:**
  Lean heavily on Story (a) for the game mechanics. It is the cleanest example of "Information restricts Action." Story (b) is excellent for the coffee discussion afterwards, as it touches on the ethics of knowledge, which fits a philosophy group better than a math group.

  If everyone takes the free peek in Movement 2, your penalty for "Quarantine" wasn't high enough. Make Quarantine **-5 chits** instead of **0**.
  *   *Recalc:* Blind = 8.33. Peek = (2/3 * 10) + (1/3 * -5) = 5.
  *   *Result:* The gap widens. The pain of knowing is sharper. Use the -5 penalty.

  Good luck. The coffee is horrible, but the game should be sweet.
