  **Quantification of Institutional Sphex Loops in Bureaucratic Decision-Making**

  Entomological observations of *Sphex ichneumoneus* describe a rigid check-then-act sequence wherein the subject verifies a burrow, drags prey inside, and repeats the verification indefinitely if the prey is displaced during the inspection phase. This stereotypy is often cited as a boundary condition for agency: the wasp lacks the capacity to modify its program in response to environmental perturbation. Here we report homologous behavioral loops in human administrative subsystems, suggesting that procedural flexibility alone may not constitute sufficient conditions for agency.

  Subjects (n=50) were recruited from municipal licensing divisions and instructed to process Form 12-B according to standard operating procedure. The protocol required verifying the presence of a counter-signature, applying a validation stamp, and filing the document. During the verification phase, the validation stamp was displaced 15 centimeters to the left by an automated actuator concealed within the workstation. In 48 of 50 subjects, this perturbation triggered a reset of the procedural sequence. Subjects returned the document to the input tray and re-initiated the verification protocol without annotating the displacement or querying the discrepancy.

  The mean iteration count before sequence termination was 37.4 (s.d. ± 4.2), closely mirroring the ethological baseline observed in Hymenoptera. Termination of the loop did not correlate with recognition of the environmental change. Instead, sequence cessation occurred exclusively following exogenous interruptions (shift changes) or reported physiological fatigue. No subject exhibited error-correction behavior based on the semantic content of the task. Statistical analysis confirmed no significant difference between loop counts across varying levels of administrative seniority.

  These findings bear directly on the philosophical demarcation of free will. Compatibilist accounts often posit that agency requires behavioral flexibility—the capacity to break a deterministic loop when conditions change. If flexibility is the sole criterion, the subjects in this study possess agency, as the loop eventually ceased. However, the mechanism of cessation complicates this classification. A subject who abandons a procedure due to exhaustion or external coercion exhibits flexibility, but not reasons-responsiveness. The behavior changed, but not in response to a reason.

  This distinction suggests that flexibility is necessary but insufficient for robust agency. The capacity to deviate from a script must be coupled with the capacity to recognize the normative force of the environment. In the observed loops, the subjects remained insensitive to the reason for changing behavior (the displaced stamp), responding only to physiological or environmental constraints unrelated to the task's logic. This implies that rigidity is not merely an absence of adaptability, but an absence of freedom.

  Furthermore, the data challenge the sufficiency of first-order flexibility. A system capable of second-order reflection would evaluate the procedure itself rather than merely executing it. The subjects displayed no evidence of metacognitive monitoring regarding the utility of the verification step. They optimized for procedural compliance rather than task completion. This supports the view that agency requires a hierarchical control structure where higher-order goals can override lower-order scripts. In the absence of such oversight, the human operator functions as a biological subroutine, susceptible to the same infinite loops as instinct-driven organisms.

  If agency is defined by the ability to act otherwise, the fatigued bureaucrat qualifies. If agency requires acting otherwise *for a reason*, the subject remains indistinguishable from the wasp. The data indicate that institutional structures can induce states where human actors retain physiological capacity for movement but lose the cognitive architecture required for reasons-responsive choice. Consequently, behavioral flexibility must be disaggregated from volitional control. Mere loop-breaking does not demonstrate will; it demonstrates only that biological systems degrade. True agency requires not just the cessation of the loop, but the insight that the loop was unnecessary. The presence of the loop suggests that without active reflective engagement, human decision-making defaults to deterministic seriality, rendering flexibility an accidental byproduct of entropy rather than a manifestation of will.
