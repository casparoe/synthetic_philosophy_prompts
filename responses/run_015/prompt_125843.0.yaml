answer: |-
  You are describing a failure of **projectibility**, though not in Goodman's time-dependent sense. You are encountering the distinction between an **accidental generalization** and a **lawlike generalization**. The students are finding rules that are *extensionally adequate* (they fit the data) but *intensionally fragile* (they do not capture the necessity of the concept).

  To give you the carving you asked for: the single underlying requirement these rules violate is **Generative Stability**.

  ### The Unified Phenomenon: Generative Stability

  A rule possesses Generative Stability if it remains true not merely for the twelve sampled figures, but for any figure that *could have been drawn* under the same conceptual instruction. The students' proposed rules fail because they are contingent on the *sampling process* rather than the *generation process*.

  Your three cards illustrate three distinct modes of instability, which is why they feel different even though they share a logical failing:

  1.  **Card 1 (Edge Count): Statistical Accident.**
      *   **The Failure:** The rule relies on a property that is causally inert. The number of edges did not *cause* the figure to be placed on the left; the placement was determined by the dot's position, and the edge count is a side-effect of how you happened to draw the blobs.
      *   **The Instability:** It fails under *perturbation*. If you redraw the blob (keeping the concept constant), the rule breaks.
      *   **The Complaint:** "This is noise."

  2.  **Card 2 (Convexity): Sample Bias (The Subset Problem).**
      *   **The Failure:** The rule identifies a property that is *consistent* with the concept but not *definitive* of it. All convex curves are closed, but not all closed curves are convex. The rule fits the sample because your sample was biased toward convex shapes.
      *   **The Instability:** It fails under *expansion*. If you draw a kidney shape (keeping the concept constant), the rule breaks.
      *   **The Complaint:** "This is too specific."

  3.  **Card 3 (Distance Threshold): Proxy Tuning.**
      *   **The Failure:** The rule uses a continuous metric to approximate a discrete topological fact. The threshold (half a figure-width) is not a natural boundary of the concept; it is a boundary of the *sample's range*.
      *   **The Instability:** It fails under *interpolation*. If you draw a non-overlapping pair slightly closer than the current narrowest pair, the rule breaks.
      *   **The Complaint:** "This is arbitrary."

  All three violate **Generative Stability**. They describe the *extension* of the current dataset rather than the *intension* of the underlying category. They are **Sample-Dependent** rather than **Concept-Dependent**.

  ### Is there a Positive Criterion?

  You asked if there is a specifiable condition a rule can satisfy to be certified, or if the distinction only does negative work (striking rules out).

  There is no purely logical positive criterion. You cannot certify a rule based solely on the figures in front of you. This is the heart of the underdetermination problem. However, in the context of a seminar (and Bongard problems specifically), there is a **Pragmatic Positive Criterion**: **Communicative Efficiency**.

  A rule is "correct" if it is the **simplest property that makes the sample non-accidental**.
  *   **Negative Work:** We strike out rules that are fragile (Card 1), too specific (Card 2), or arbitrarily thresholded (Card 3).
  *   **Positive Work:** We accept the rule that best explains *why the author chose these specific twelve examples*.

  This shifts the burden from logic to **abduction** (Inference to the Best Explanation). The correct rule is the one that makes the existence of the twelve cards most probable, assuming the author was trying to be clear.
  *   If the rule were "odd edges," why did you draw dots inside curves? That feature becomes irrelevant noise.
  *   If the rule were "convex," why did you draw closed curves? That feature becomes irrelevant noise.
  *   If the rule is "inside/outside," every feature of the drawing is relevant.

  The positive criterion is **Relevance Maximization**. The correct rule renders all salient features of the figures informative; the incorrect rules render some features accidental.

  ### The Sample Size Question (6 vs. 60)

  Your suspicion is correct: the phenomenon does not vanish uniformly; it changes character. Increasing *N* from 6 to 60 affects the three cards differently because they fail in different ways.

  1.  **Card 1 (Edge Count): The Phenomenon Vanishes.**
      *   With 60 figures, the probability that every left-hand figure accidentally has an odd number of edges (when edge count is irrelevant to the drawing process) becomes vanishingly small. The rule transitions from "plausible but rejected" to "statistically impossible." The complaint dissolves because the correlation is too strong to be accidental.

  2.  **Card 2 (Convexity): The Phenomenon Shifts to Ambiguity.**
      *   With 60 convex closed curves on the left, "Convexity" is no longer obviously sample bias. It becomes a **rival hypothesis**. If you draw 60 convex closed curves, the students are rational to ask: "Is the concept *Closed* or is it *Convex*?"
      *   The complaint changes from "This is obviously wrong" to "This is under-specified." To resolve this, you would need a counter-example (a kidney shape). With *N*=6, the kidney shape is implied by the category "Closed." With *N*=60 convex shapes, the category "Convex Closed" becomes a viable competitor. The phenomenon doesn't vanish; it becomes a genuine conceptual ambiguity that requires new data to resolve.

  3.  **Card 3 (Distance Threshold): The Phenomenon Clarifies.**
      *   With 60 figures, the distribution of distances becomes visible. If there is a clear gap between the maximum distance of overlapping pairs and the minimum distance of non-overlapping pairs, the threshold becomes **robust** rather than arbitrary.
      *   However, if the distributions overlap or touch, the arbitrariness remains. The larger *N* exposes the *structure* of the proxy. It tells you whether the threshold is a "natural joint" in the data or a forced cut.

  ### Summary of the Carving

  You asked for a name for what these rules lack. While "Overfitting" is the computational analogue and "Projectibility" is the philosophical analogue, both carry baggage you wish to avoid.

  I propose you call this failing **Sample Contingency**.
  A rule suffers from Sample Contingency if its truth value depends on *which* instances were drawn rather than *what* instances were drawn.

  *   **Card 1** is contingent on the *drawing acts* (how you moved your hand).
  *   **Card 2** is contingent on the *selection acts* (which closed curves you chose to show).
  *   **Card 3** is contingent on the *range acts* (how far apart you placed the shapes).

  The correct rule is **Sample Invariant**. It holds regardless of the specific drawing, selection, or range, provided the generative concept remains the same.

  **Boundary Cases you should have been embarrassed to hand out:**
  1.  **The Tautology:** "The left figures are the ones on the left." (Fits perfectly, zero complexity, but zero Generative Stability. It describes the label, not the concept.)
  2.  **The Disjunction:** "Figure 1 or Figure 2 or... Figure 6." (Perfect fit, but maximally Sample Contingent. It lists the sample rather than describing the source.)
  3.  **The Hidden Feature:** "The left figures were drawn with a blue pen." (Generatively stable, but violates Communicative Efficiency. It is a valid rule, but a bad *seminar* rule because it ignores the visual modality.)

  **Conclusion:**
  You have three varieties of one failing: **Sample Contingency**. They differ in *how* the sample contingencies enter (noise, bias, or threshold), but they all share the property of describing the dataset rather than the generator. The positive criterion is **Abductive Strength** (which rule best explains the author's choice of examples), and the sample size question confirms that Card 1 is statistical noise (fixable by *N*), while Card 2 is conceptual under-specification (fixable only by counter-examples).
