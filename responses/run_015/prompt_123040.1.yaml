answer: |-
  You are right that `checkable` and `fakeable` are different. `Checkable` is about the evaluator's burden (how hard is it for *me* to verify this?), while `fakeable` is about the student's integrity (how easy is it for *them* to bluff?). A multiple-choice test is highly `checkable` but also highly `fakeable` (guessing). A complex proof is hard to `check` but also hard to `fake`. The third factor you might be missing is **repeatability**: can they do this again tomorrow without help? That is ultimately what tutoring aims for, but `fakeable` covers most of that risk.

  Here is the ranking of your nine tasks, ordered from "grading the final product is basically fine" (low score) to "you learn nothing unless you watch them work" (high score). The score represents how much learning value you lose by only looking at the final product.

  **1. Long division with big numbers**
  **Score: 5**
  **Reason:** The algorithm is rigid and the answer is unique, so a correct result almost guarantees the correct process was followed.

  **2. Solving a quadratic equation**
  **Score: 15**
  **Reason:** While there are multiple methods to solve it, getting the correct roots consistently is hard to do by luck or copying without knowing at least one valid method.

  **3. Fixing the grammar in someone else's paragraph**
  **Score: 25**
  **Reason:** Grammar rules are mostly objective, so a corrected paragraph proves the errors were identified, even if we don't know if the student understands the underlying rule.

  **4. Debugging a short python program that should print the first ten prime numbers**
  **Score: 55**
  **Reason:** The code will run successfully if hardcoded, so seeing the correct output tells you nothing about whether they actually fixed the logic or just cheated the output.

  **5. Writing the conclusion section of a lab report from your data**
  **Score: 65**
  **Reason:** Students can easily use scientific buzzwords to sound correct without actually understanding how their specific data supports the conclusion.

  **6. Translating a paragraph of english into spanish**
  **Score: 75**
  **Reason:** Translation apps make the final product highly `fakeable`, and unless the tutor is fluent, the result is hard to `check` for nuanced errors.

  **7. Writing a five paragraph persuasive essay**
  **Score: 85**
  **Reason:** Structure can be templated and content can be outsourced to AI or parents, making the final text a poor indicator of the student's actual writing ability.

  **8. Coming up with your own research question for a history project**
  **Score: 90**
  **Reason:** A high-quality question can be copied or lucky, and you cannot verify the critical thinking skills used to generate it without witnessing the brainstorming process.

  **9. Explaining in your own words why the sky is blue**
  **Score: 95**
  **Reason:** Students can memorize a textbook definition to produce a perfect explanation without understanding the physics, which is only revealed by questioning their thought process.

  ***

  **Does the answer flip depending on who is checking?**
  Yes, specifically for the high-scoring tasks like the **essay**, **research question**, and **sky blue explanation**. A tutor who has worked with a student for months knows their baseline voice and capability, so they can spot when a final product is too polished (high `fakeable`), whereas a new tutor sees only the `checkable` surface and might falsely approve the work.

  **Is there anything on the list where watching the process is ALSO pretty useless?**
  **Long division** is the only candidate where watching the process adds negligible value over checking the product. Because the steps are mechanical and the answer is binary, observing the pencil strokes rarely reveals more about their understanding than seeing the correct quotient does.
