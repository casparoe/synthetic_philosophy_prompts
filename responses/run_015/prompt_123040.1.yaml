  I invented two words and I want you to use them when you rank. checkable = how easy it is for someone who barely knows the subject to tell a correct final answer from a wrong one. fakeable = how easy it is to produce something that looks correct without the person actually being able to do the task. I think these are two different things and not just the same thing said twice, but tell me if im wrong and or if im missing a third one that matters more.

