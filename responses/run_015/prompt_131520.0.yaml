  **Decomposition of Credence**

  1.  **Sub-question 1:** What is the likelihood that antirepresentationalism genuinely eliminates all vocabulary-independent standards of normative evaluation?
      *   **Probability:** 0.80
      *   **Justification:** Rorty's textual commitment to contingency is rigorous, successfully dismantling explicit metaphysical foundations even if implicit ones remain.

  2.  **Sub-question 2:** What is the likelihood that Rorty's appeals to solidarity and cruelty-avoidance are internal to the liberal vocabulary rather than functioning as cross-vocabulary constraints?
      *   **Probability:** 0.30
      *   **Justification:** His rhetoric on cruelty frequently presupposes a universal susceptibility to pain that transcends local vocabularies, smuggling in representationalist facts.

  3.  **Sub-question 3:** What is the likelihood that a non-representationalist pragmatist criterion—such as coherence with a community's own evolving self-image—could adjudicate between vocabularies without circularity?
      *   **Probability:** 0.75
      *   **Justification:** Pragmatic coherence successfully guides internal community evolution, though it struggles to justify expansion to outsiders without begging the question.

  **Combination Method**
  The overall credence is calculated using the product rule ($P_1 \times P_2 \times P_3$), as the consistency of Rorty's position requires the conjunctive satisfaction of all three conditions; a failure in any single domain collapses the antirepresentationalist normative claim.
  $$0.80 \times 0.30 \times 0.75 = 0.18$$

  **Dominant Term and Shifting Argument**
  The term doing the most work in determining the final number is **Sub-question 2** (0.30), as it acts as the primary bottleneck; even if the metaphysics (Q1) and adjudication criteria (Q3) hold, the normative force collapses if the appeal to cruelty is universal rather than contingent.

  The argument most likely to shift this term would be a rigorous application of the **construction-versus-representation distinction to the concept of pain**, demonstrating that Rorty treats "suffering" as a language-independent physiological input (representation) rather than a socially constructed description (construction). If one could prove Rorty consistently treats cruelty solely as a violation of *local* linguistic norms without referencing a pre-linguistic capacity for pain, the probability for Q2 would rise, significantly increasing the overall credence.
