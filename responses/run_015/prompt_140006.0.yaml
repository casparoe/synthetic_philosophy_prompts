answer: |-
  **OPERATIONAL GUIDANCE NOTE 7.4**
  **TO:** All Procedural Staff, Tier 1–3
  **FROM:** Office of Normative Alignment
  **SUBJECT:** Assertibility Conditions and Community Endorsement Protocols
  **DATE:** 14 October 2024

  **1.0 TERMINOLOGY AND DEFINITIONS**

  1.1 Pursuant to the adoption of the Skeptical Framework (Policy 9.1), personnel are advised that the terms "correct," "incorrect," "true," and "false" are hereby retired from official usage. These terms imply the existence of truth-conditional facts regarding rule-following which the Department is no longer satisfied exist.

  1.2 In all internal correspondence and output logging, staff shall substitute the following vocabulary:
  > (a) **Endorsable:** An output aligning with the anticipated responses of the relevant linguistic community.
  > (b) **Unendorsable:** An output diverging from the anticipated responses of the relevant linguistic community.
  > (c) **Error:** A deprecated term. Use "Divergence."

  1.3 Personnel are reminded that no internal mental state or prior behavioral history constitutes a fact of the matter regarding what a rule requires. Meaning is constituted solely by communal agreement. Staff should not claim to "know" a regulation; they should only claim to be prepared to endorse a specific application of it.

  **2.0 WORKED CASE: ARITHMETIC COMPLIANCE**

  2.1 Consider a scenario wherein a Clerk (Grade 2) is presented with the input pair (68, 57) under the operation previously designated as "addition." The Clerk returns the output "5."

  2.2 Upon review, the Clerk may protest that they intended to follow the rule of addition, and that "5" was a mistake, or that they meant a different rule which coincides with addition on all sums previously performed by the Department but diverges thereafter.¹ This is classified as a **Dispositional Excuse**.

  2.3 The Office of Normative Alignment cannot verify the Clerk's intention. No finite run of past behavior settles what the Clerk meant by "addition" in prior instances. Therefore, the Clerk cannot be said to have gone wrong against a rule they intended to follow. However, the output "5" is **Unendorsable**.

  2.4 Handling Procedure:
  > (a) The Clerk is not to be reprimanded for being "wrong," as there is no fact that makes 125 the right answer.
  > (b) The Clerk is to be informed that their output is incompatible with the Department's current endorsement practices.
  > (c) If the Clerk insists they *would* have answered 125 had they been asked previously, this claim is to be logged as speculative and non-actionable. The Department deals in actual endorsements, not counterfactual dispositions.

  **3.0 ISOLATED PERSONNEL PROTOCOLS**

  3.1 Staff operating without immediate access to a community of endorsers (e.g., Night-Shift Archivists, Remote Inspectors, Lighthouse Keepers) face a constitutive limitation. As meaning requires communal verification, isolated staff cannot generate meaningful output independently.

  3.2 Outputs generated by isolated staff shall be held in **Provisional Escrow**. They acquire assertibility conditions only upon review by a Day-Shift Cluster.

  3.3 Isolated staff are reminded not to experience distress regarding the status of their work during the shift. The feeling that one is following a rule alone is a psychological phenomenon, not a normative one. Staff should focus on maintaining the appearance of regularity until endorsement can be secured.

  **4.0 SUPERVISORY CONDUCT**

  4.1 Supervisors are prohibited from informing staff what a regulation *requires*. Supervisors cannot access facts about rule-requirements any more than subordinate staff can.

  4.2 Instead, Supervisors must inform staff what their colleagues *will accept* going forward.
  > *Example:* Do not say, "The form requires a signature." Say, "If you submit this without a signature, the intake team will not endorse it."

  4.3 This distinction is vital. The former implies a truth condition; the latter correctly identifies the consequence of divergence within the community.

  **5.0 ENDORSEMENT HIERARCHY AND AUTHORITY**

  5.1 To ensure stability, endorsements are tiered. Tier 1 staff endorse Tier 0 outputs. Tier 2 staff endorse Tier 1 endorsements. Tier 3 staff endorse Tier 2 endorsements.

  5.2 Regarding the question of who endorses the Tier 3 staff: The Department is satisfied that Tier 3 authority is self-validating for the duration of the current fiscal cycle. Further validation layers are suspended pending resource allocation reviews in Q3 2025. Staff should proceed on the basis that Tier 3 endorsements are final until funding parameters change.

  **6.0 DISSENTING VIEWPOINTS**

  6.1 Occasionally, staff may circulate memos insisting that certain outputs are "actually true" regardless of community agreement. Such documents are to be filed under **Non-Actionable Metaphysics**.

  > *"It does not matter what the community says. 2 + 2 equals 4. There is a fact of the matter about what I meant yesterday, and I meant plus."*
  > — Excerpt from Internal Memo 99-B (J. Doe, Data Entry)²

  6.2 Staff holding these views are encouraged to continue working provided their outputs remain Endorsable. Belief in independent truth conditions is permissible as a private sentiment, provided it does not interfere with the public assertion of community standards.

  ***

  ¹ *See Kripke, S. (1982). Wittgenstein on Rules and Private Language. The "Quus" function is defined as x quus y = x + y if x, y < 57, else 5.*
  ² *The Department notes that Mr. Doe's claim relies on the existence of private mental facts which Policy 9.1 explicitly renders inaccessible. Mr. Doe is reminded that his continued employment depends on the endorsability of his forms, not the accuracy of his metaphysics.*
