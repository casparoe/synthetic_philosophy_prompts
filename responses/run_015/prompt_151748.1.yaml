answer: |-
  Your framework is sophisticated because it moves beyond the binary of "universalism vs. relativism" and instead asks about the *structure* of disagreement. You are effectively proposing a **meta-ethical triage system**: sorting disagreements into those that are resolvable within a shared objective framework (shallow) and those that indicate incompatible frameworks (deep).

  To capture your verdicts while resolving the tension in your "trouble case," I propose refining your distinction into **The Principle of Counterfactual Recognition**. This principle shifts the focus from current practice to the *justificatory structure* of the culture's moral logic.

  ### The Principle of Counterfactual Recognition

  **Core Thesis:** Cross-cultural moral variation undermines objectivity only if the divergence persists under **idealized conditions of information and security**.
  *   **Shallow Disagreement:** The practice would change if the agents possessed full empirical knowledge, secure social institutions, and the conceptual capacity to recognize the other as a locus of claims.
  *   **Deep Disagreement:** The practice is mandated by the culture's *constitutive definitions* of moral patienthood, such that even under idealized conditions, the excluded class remains outside the moral universe.

  This principle generates three specific clauses corresponding to your intuitions:

  #### Clause 1: The Epistemic-empirical Clause
  *   **Definition:** Disagreement is shallow if it stems from false beliefs about the natural world, causal consequences, or the internal states of beings (e.g., pain, consciousness).
  *   **Motivating Case:** **Infanticide under scarcity.** If a culture kills infants because they believe infants feel no pain or cannot survive, this is shallow. If they possessed biological knowledge confirming pain/survival, their own value system (presuming they value minimizing suffering) would condemn the act.
  *   **Verdict on New Case (Divination):** **Shallow.** In the culture where morality is determined by divination applied uniformly to clan and strangers, the *source* of moral knowledge is non-empirical. However, because the moral status is applied *uniformly*, the divergence is epistemic (how we know the good), not ontological (who counts as good). Provided the divination does not mandate harm based on status denial, this is a disagreement about *moral epistemology*, which your framework treats as shallow (analogous to different empirical beliefs).

  #### Clause 2: The Jurisdictional-Institutional Clause
  *   **Definition:** Disagreement is shallow if it concerns *who* enforces norms or *how* authority is allocated, provided the underlying obligation is acknowledged.
  *   **Motivating Case:** **Supernatural Punishment.** Delegating judgment to ancestors is shallow because the *wrongness* of the act is preserved; only the court changes.
  *   **Verdict on New Case (Divination):** **Shallow.** The mechanism of adjudication (divination vs. reason/court) is institutional. As long as the "verdict" respects the moral patienthood of the subjects, the method is a shallow variation.

  #### Clause 3: The Constitutive-ontological Clause
  *   **Definition:** Disagreement is deep if the culture's moral vocabulary *structurally precludes* recognizing a class of beings as subjects of wrong, regardless of empirical facts or institutional security.
  *   **Motivating Case:** **The Trouble Case (Clan/Stranger).** You noted that harming strangers is "unthinkable as a moral category." This is the critical marker. It is not that the clan court lacks *power* over strangers (jurisdiction); it is that strangers lack *standing* to be wronged (status).
  *   **Verdict on New Case (Divination):** **N/A (Does not apply).** Since the divination culture applies rules uniformly, they pass the status test.

  ---

  ### Where Your Intuitions Must Break

  To maintain consistency with this principle, you must abandon or modify two specific intuitions you hold:

  **1. The Jurisdiction/Status Boundary in the Trouble Case**
  *   **Your Intuition:** You worry the Trouble Case might be "extreme jurisdiction" (like citizenship) rather than status denial.
  *   **Required Abandonment:** You must accept that **extreme jurisdictional boundaries *are* ontological denials.** In modern law, a foreigner has rights even if our courts cannot enforce them; the *obligation* exists extraterritorially. In your Trouble Case, the obligation *does not exist*. If a system defines "moral patient" as "clan member," that is not a jurisdictional limit; it is a definition of the moral universe.
  *   **Why:** If you classify this as shallow jurisdiction, you undermine your own criterion for "deep" disagreement. If "no concept of wronging" counts as shallow, then *any* status denial could be reframed as "we just don't have laws for them." To preserve the objectivity threat, you must categorize the Trouble Case as **Deep**.

  **2. The Stability of the Infanticide Distinction**
  *   **Your Intuition:** You want to distinguish infanticide based on "false empirical premises" (shallow) vs. "denial of status" (deep).
  *   **Required Modification:** You must admit this distinction is often **unstable in practice** and relies on *charitable interpretation*. Anthropological data rarely reveals "pure" ontological denial. Most cultures use a mix of empirical and ontological justifications (e.g., "The baby has no soul *and* will starve").
  *   **The Fix:** Adopt a **Justificatory Priority Rule**. If the culture offers *any* ontological justification (e.g., "personhood begins at naming") that persists even when empirical conditions improve, the disagreement counts as Deep. You cannot classify it as Shallow Empirical unless the ontological claim is absent. This saves your objectivity concern but forces you to classify more historical practices as "Deep" than you might prefer.

  ---

  ### Literature Context: Settled vs. Contested

  To ensure your framework aligns with current scholarship without adopting disputed premises as fact:

  **1. Broadly Settled (Consensus among specialists)**
  *   **Moral Foundations are not purely constructed:** It is consensus in cognitive science and evolutionary psychology (e.g., Haidt, Greene, Bloom) that humans possess innate, universal moral *capacities* or "foundations." Variation exists in how these are weighted, but the underlying hardware is shared. This supports your view that Foundation weighting (Harm vs. Loyalty) is "Shallow."
  *   **Relativism is not the default anthropological stance:** Modern anthropology largely rejects "strong relativism" (the idea that cultures are incommensurable). The consensus is "universalism with parameter setting." Cultures vary, but within a shared human range. This supports your search for a principle that allows for variation without surrendering objectivity.
  *   **The WEIRD Bias is real:** It is settled that Western, Educated, Industrialized, Rich, Democratic populations are outliers in moral psychology (Henrich et al.). Your framework correctly accounts for this by treating WEIRD hyper-individualism as a specific weighting of universal values, not the absence of them.

  **2. Genuinely Contested (Where specialists disagree)**
  *   **The Existence of "Deep" Disagreement:** Philosophers like David Wong (moral relativist) argue that some disagreements *are* deep and incompatible (e.g., regarding the value of individual autonomy vs. community harmony). Universalists (e.g., Nussbaum, capacity approaches) argue these are always reconcilable under idealized conditions. Your framework sides with the Universalists *unless* the "Constitutive-ontological" clause is triggered. This is a live philosophical debate, not settled fact.
  *   **The Nature of Moral Status:** There is no consensus on whether "moral status" is a natural property (discovered) or a social construct (conferred). Your framework treats it as something that *can* be denied (ontological), which leans toward a realist view. Constructivists would argue the Trouble Case society *creates* the status boundary, making it "real" for them. You must acknowledge that your "Deep" classification assumes a realist meta-ethics (that there is a fact of the matter about who counts).
  *   **The Role of Empirical Beliefs:** Some philosophers (e.g., Prinz) argue that empirical beliefs are so intertwined with moral values that you cannot separate them (the "thick" concept argument). Your framework assumes you *can* separate them (Clause 1). This is a contested methodological assumption in meta-ethics.

  ### Summary of Verdicts

  | Case | Your Initial Intuition | Principle Verdict | Notes |
  | :--- | :--- | :--- | :--- |
  | **Foundations Weighting** | Shallow | **Shallow** | Supported by consensus on universal capacities. |
  | **Supernatural Punishment** | Shallow | **Shallow** | Jurisdictional variation. |
  | **Infanticide (Empirical)** | Shallow | **Shallow** | Depends on Justificatory Priority Rule. |
  | **Infanticide (Status)** | Deep | **Deep** | Requires admitting ontological denial exists. |
  | **Funerary Rituals** | Shallow | **Shallow** | Symbolic expression of shared value (Respect). |
  | **Lying to Patient** | Shallow | **Shallow** | Virtue weighting (Honesty vs. Compassion). |
  | **Trouble Case (Clan)** | Deep (worried) | **Deep** | **Must abandon** the hope that this is jurisdictional. "Unthinkable" = Ontological exclusion. |
  | **Divination (Uniform)** | (Unlisted) | **Shallow** | Epistemic variation, not ontological exclusion. |

  **Final Recommendation:** Your framework is robust if you accept that **conceptual exclusion is the only true threat to objectivity.** By tightening the definition of "Jurisdiction" to exclude cases where the *concept* of obligation is missing, you save the "Trouble Case" as a genuine counter-example to objectivity, while preserving the "Shallow" verdict for most anthropological variations. This aligns you with "Soft Universalism," a defensible and widely held position in contemporary moral philosophy.
