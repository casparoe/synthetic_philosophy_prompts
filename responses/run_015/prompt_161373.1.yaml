  # Comparative Epistemology: Sorting Warrant Episodes
  **Handout for Reading Group**

  ### I. The Decision Tree
  *Take a concrete episode of coming to know. Put it through these six filters. Do not look at the labels yet.*

  1.  **Sense-Contact:** Does the warrant need the object itself to be in contact with a sense?
  2.  **Absence:** Is what gets known strictly an absence (e.g., 'the jar is *not* here')?
  3.  **Universal-Link:** Does the step require a remembered exceptionless link between a sign and what it indicates?
  4.  **Similarity-ID:** Does it turn on a remembered similarity used to identify an unfamiliar object?
  5.  **Reliable-Speech:** Does it require understanding a sentence from someone taken to be reliable?
  6.  **The Wrinkle (Novelty):** Does the route stop counting as a warrant if you already knew the fact by some other route?

  ---

  ### II. The Space of Combinations (The Map)
  *Below are the six classical candidates located within the Yes/No space generated by the questions above. Note that most questions are 'No' for any given warrant.*

  | Warrant (Pramāṇa) | Q1: Sense | Q2: Absence | Q3: Link | Q4: Similarity | Q5: Speech | Q6: Novelty |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Perception** | **Yes** | No | No | No | No | No |
  | **Non-apprehension** | No | **Yes** | No | No | No | Yes |
  | **Inference** | No | No | **Yes** | No | No | No* |
  | **Postulation** | No | No | **Yes** | No | No | **Yes** |
  | **Comparison** | No | No | No | **Yes** | No | Yes |
  | **Testimony** | No | No | No | No | **Yes** | No |

  *\*Note: Inference is debated. Some schools mark Q6 'Yes', others 'No'. This split is where Postulation often hides.*

  **Empty Cells:**
  *   **Sense + Absence:** Generally **incoherent** (one perceives presences; absence is derived).
  *   **Speech + Sense:** **Unattractive** (if you see it, why rely on speech? Though testimony can confirm perception).
  *   **Link + Similarity:** **Unexplored** (usually treated as distinct cognitive operations).

  ---

  ### III. School Packages (Regions)
  *Schools occupy regions of this map by accepting or rejecting specific warrants.*

  *   **The Perception-Only Region (Cārvāka):** Occupies only the **Perception** cell. All others are reduced to failed perception or guesswork.
  *   **The Two-Fold Region (Buddhist):** Occupies **Perception** and **Inference**. Comparison, Testimony, and Postulation are collapsed into Inference; Non-apprehension is rejected or reduced.
  *   **The Four-Fold Region (Nyāya):** Occupies **Perception, Inference, Comparison, Testimony**. Rejects Postulation (reduces to Inference) and Non-apprehension (reduces to Perception/Inference).
  *   **The Six-Fold Region (Mīmāṃsā):** Occupies **all six cells**. Treats Postulation and Non-apprehension as irreducible.

  ---

  ### IV. Blind Spots & Indistinguishable Pairs
  *The tree cannot perfectly separate every pair. Be wary of these overlaps.*

  *   **Inference vs. Postulation:** Both trigger **Q3 (Link)**. They are only separated by **Q6 (Novelty)**. If your school holds that Inference *also* requires novelty, these two collapse. Postulation is essentially 'Inference driven by anomaly'.
  *   **Comparison vs. Testimony:** Both involve language and description. **Q4 (Similarity)** vs **Q5 (Speech)** distinguishes them, but in practice (e.g., being told 'a gavaya is like a cow'), the line blurs. Is it testimony about a similarity, or comparison via testimony?
  *   **Non-apprehension vs. Perception:** **Q2 (Absence)** distinguishes them, but some schools argue perceiving an empty table is just Perception of the table-top, with absence inferred.

  ---

  ### V. Case Bank (Classical & Modern)
  *Try sorting these episodes using the tree.*

  | Case | Type | Notes |
  | :--- | :--- | :--- |
  | **The Forest Officer** sees a gavaya-like animal. | **Comparison** | Matches description to new object via similarity. |
  | **Smoke on a hill** implies fire. | **Inference** | Relies on universal link (smoke/fire). |
  | **Devadatta is fat** but doesn't eat by day. | **Postulation** | Must posit night-eating to explain the anomaly. |
  | **The jar is not on the table.** | **Non-apprehension** | Knowledge of an absence. |
  | **A trusted friend says** it is raining. | **Testimony** | Relies on reliable speech. |
  | **You see the rain** falling. | **Perception** | Direct sense contact. |
  | **Reading the time** off a phone screen. | **Perception/Testimony** | Is the screen a sense object or a speaker? |
  | **Smoke alarm wakes you.** | **Inference** | Alarm is the sign; fire is the indicated fact. |
  | **Blood-test result in a letter.** | **Testimony/Inference** | Letter is testimony; the biology is inferred. |
  | **App says it's raining** in Delhi. | **Testimony** | Digital authority. |
  | **Satnav instruction** you half understand. | **Testimony** | Relies on authority, even if comprehension is partial. |

