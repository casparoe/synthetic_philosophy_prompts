answer: |-
  **TO:** Clinical Analytics Review Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Decision Memo: Corvid Health "Universal" Upgrade

  **Recommendation:** Approve with Conditions and Hard Gate. Do not deploy clinically until local calibration is verified in silent mode.

  **The Evidence Problem**
  Corvid argues site-specific validation is optional because "Universal" beats benchmarks on 11,000 synthetic tasks generated from a uniform random prior. The philosopher on our committee is right: this is mathematically hollow. Performance on a uniform prior reflects only how well the model matches the generator's biases, not clinical reality. A model that averages well over all possible universes may fail in ours. Therefore, the vendor's claim that validation is *optional* is false.

  However, the philosopher is wrong to suggest we reject the upgrade outright. While past performance elsewhere doesn't guarantee local success, it is not circular to expect a model trained on diverse data to generalize better, provided we verify calibration. Medicine relies on induction; we reject the vendor's claim that validation is unnecessary, not that the model is invalid.

  **Technical Requirements**
  1.  **Discard the Synthetic Suite:** Do not ask Corvid to identify the "50 most similar tasks" from their suite. This invites cherry-picking. Instead, require them to run Universal on our retrospective data from the last two years. We need performance metrics on *our* patient population, not their synthetic approximation.
  2.  **Calibration Over Ranking:** Our protocol fires at a fixed probability threshold. It does not matter if the model ranks patients correctly (AUC) if the probabilities are wrong. If the model says 10% risk but our base rate is 2%, we will over-treat. The vendor must demonstrate calibration plots on our data, not just discrimination metrics.
  3.  **The Feedback Problem:** We must be honest about what a pilot can prove. Once clinicians see scores, they intervene, changing the outcome labels (sepsis vs. non-sepsis). This creates a feedback loop where we cannot easily measure false negatives. Therefore, the initial phase must be **silent mode**. The model runs in the background; clinicians do not see scores. This establishes baseline performance without contamination.

  **Addressing the Strongest Objection**
  The strongest objection is not mathematical circularity, but human inertia. Once a score appears in the EHR, clinicians anchor on it. A pilot can quietly become permanent policy because removing a tool feels like reducing care. To honor this concern, the Hard Gate must be automatic. If metrics fail, the system reverts to the old model without committee vote. We remove the inertia option.

  **Timeline and Conditions**
  *   **Retrospective Validation:** Corvid has 4 weeks to run Universal on our historical data.
  *   **Silent Pilot:** If validation passes, we begin an 8-week silent pilot.
  *   **Hard Gate:** Universal replaces the current model only if calibration error on local silent data is lower than the current model by a pre-specified margin.
  *   **Deadline:** If calibration metrics are not met by [Date 2 weeks before March contract lapse], we reject the upgrade and renew the current contract.

  **Conclusion**
  We accept the upgrade path but reject the vendor's evidence standard. We validate locally, prioritize calibration, and prevent deployment inertia with a hard stop.
