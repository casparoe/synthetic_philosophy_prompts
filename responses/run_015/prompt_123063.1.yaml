prompt: |-
  Hi — I'm on the Clinical Analytics Review Committee at my hospital system. We meet Thursday and I've got to circulate a short decision memo beforehand, and I'd really like a draft to work from.

  The case: our sepsis early-warning vendor, Corvid Health, wants us to upgrade from the model we've run for two years to their new "Corvid Universal." The pitch is a benchmark suite: 11,000 synthetic prediction tasks generated from what they call a uniform random prior over data-generating processes, and they report that Universal beats both our current model and a panel of standard learners on average across the whole suite. The deck concludes that this is domain-general evidence and that site-specific validation is therefore optional.

  One of our members, a retired philosopher who sits on the committee, sent around a one-pager saying basically the opposite. Two claims in it. First, that by the no-free-lunch results, averaged over all possible problems every algorithm does exactly as well as every other one, so Universal's suite average can't be evidence of anything unless the suite was built to resemble wards like ours — and a uniform random prior over data-generating processes is definately not that. Second, that even setting that aside, no amount of past performance at other hospitals could ever justify expecting performance here, since the only argument for it is "it has worked before," which is circular. He wants us to reject outright and let the contract lapse in March.

  I think he's right about something and wrong about something, and I want the memo to say which. Concretely: recommend approve, reject, or approve-with-conditions-and-a-hard-gate, with a timeline, and reasons the vendor could actually respond to in writing.

  Things I want handled:

  - The uniform-prior suite. My read is that it's a prior dressed up as a proof: doing well on it shows the model's biases match whoever built the generator. But I don't know what we should be asking the vendor for instead. One idea floating around is to make them name the fifty tasks in the suite most similar to our ICUs and report performance only on those — that feels like a trap, since they pick the fifty and would pick flattering ones, but maybe there's a version of it that works.
  - Ranking versus calibration. Whatever we adopt fires a fixed threshold that triggers an antibiotics protocol, so what matters is whether the probabilities are right in our population, not whether the model orders patients well, and I don't think the vendor's numbers speak to that at all.
  - The feedback problem. Once the score is displayed, nurses act on it, which changes which patients get labelled septic, so the data we'd collect during a pilot can't straightforwardly tell us how the model would behave once it's actually live. I want the memo to be honest about what a pilot could and could not establish.
  - Give the losing side its best day in court. If we go with conditions, the strongest objection isn't the circularity one, it's that clinicians will anchor on a number they don't understand and that a "pilot" becomes a deployment by inertia.

  Keep it under ~700 words, written for the committee — a CMO, two docs, a nurse manager, our data scientist, and the philosopher — with the recommendation up top. And please don't cite anything or point us at papers; we can't chase references and wouldn't know what to do with them anyway. Just the argument.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Clinical Analytics Review Committee at a hospital system.
      *   **Task:** Draft a short decision memo (under ~700 words) for circulation before Thursday's meeting.
      *   **Context:** Vendor (Corvid Health) wants to upgrade from current model to "Corvid Universal."
      *   **Vendor Claim:** New model beats current/standard models on a benchmark suite of 11,000 synthetic tasks generated from a "uniform random prior over data-generating processes." Claims site-specific validation is optional based on this.
      *   **Opposition (Philosopher Member):** Claims No-Free-Lunch theorem invalidates the uniform prior argument (average performance over all problems is equal). Claims past performance elsewhere doesn't justify local expectation (Humean induction/circularity). Wants to reject outright.
      *   **User's Stance:** Thinks philosopher is partly right/wrong. Wants a nuanced recommendation (Approve, Reject, or Approve-with-Conditions-and-Hard-Gate).
      *   **Key Issues to Address:**
          1.  Uniform-prior suite (biased generator vs. proof). Need to ask for something better than vendor-picked top 50.
          2.  Ranking vs. Calibration (threshold matters for antibiotics).
          3.  Feedback Problem (interventions change labels/outcomes, complicating pilot evaluation).
          4.  Strongest Objection (clinician anchoring/inertia deployment).
      *   **Audience:** CMO, two docs, nurse manager, data scientist, philosopher.
      *   **Format:** Memo, recommendation up top, no citations/references.
      *   **Length:** Under ~700 words.

  2.  **Determine the Recommendation:**
      *   Rejecting outright ignores potential benefits and doesn't test the vendor's claims locally.
      *   Approving outright ignores the valid concerns about calibration and the "uniform prior" nonsense.
      *   *Approve-with-Conditions-and-Hard-Gate* is the balanced path. It acknowledges the vendor's innovation but demands local evidence before full deployment.
      *   *Timeline:* Contract lapses in March. Need a pilot before then or a clause extending evaluation.
      *   *Decision:* Recommend **Approve-with-Conditions-and-Hard-Gate**.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Recommendation:** Clear statement up top.
      *   **The Vendor's Claim (Uniform Prior):** Address the philosopher's point. The uniform prior is indeed meaningless for *our* context (No-Free-Lunch holds). Doing well on synthetic data only proves the model matches the synthetic generator, not reality. We need local data, not synthetic averages.
      *   **The Philosopher's Objection (Induction):** Acknowledge the circularity risk but note that *some* induction is necessary for medicine. We can't reject all external evidence, but we must verify local calibration.
      *   **Key Technical Concerns:**
          *   *Ranking vs. Calibration:* We need probabilities that match our sepsis base rates, not just AUC.
          *   *Feedback Loop:* Pilots are tricky because treating based on scores changes outcomes (self-fulfilling/self-negating prophecies).
      *   **The Plan (Conditions):**
          *   Silent pilot (shadow mode) to avoid feedback loops initially.
          *   Calibration check on local data.
          *   Hard gate: No clinical display until calibration metrics are met.
          *   Addressing the "Anchoring/Inertia" risk: Define success criteria *before* starting.
      *   **Vendor Ask:** Don't let them pick the top 50 tasks. Require performance on *our* retrospective data.

  4.  **Refining and Editing (Word Count & Tone Check):**
      *   *Tone:* Professional, decisive, respectful of both vendor and philosopher.
      *   *Constraint:* Under 700 words.
      *   *No Citations:* Ensure no references to papers/theorems by name (except maybe "No-Free-Lunch" as a concept if needed, but better to describe it). The prompt says "don't cite anything or point us at papers," so avoid naming "No-Free-Lunch" explicitly if it looks like a citation, but the prompt mentions the philosopher used it. I can reference the *logic* without citing a paper. Actually, the prompt says "by the no-free-lunch results" in the description of the philosopher's claim. I can use the term as common knowledge within the committee context since the philosopher introduced it.
      *   *Addressing the "Top 50" idea:* The user thinks it's a trap. I need to propose the alternative: Retrospective validation on *our* data, not their synthetic tasks.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      *   Rec: Conditional Approval.
      *   Why: Vendor's synthetic benchmark is irrelevant to us (Philosopher right on uniform prior). But rejecting outright loses potential gain.
      *   Plan: Silent pilot on local data.
      *   Metrics: Calibration not just ranking.
      *   Risk: Feedback loops. Silent mode solves this.
      *   Risk: Inertia. Hard gate solves this.
      *   Vendor requirement: Show performance on our past data, not their synthetic suite.

  6.  **Drafting - Attempt 2 (Writing & Condensing):**
      *   Need to be punchy.
      *   Make sure the "Philosopher is right/wrong" nuance is clear.
      *   Ensure the "Feedback Problem" is addressed honestly.

      *(Self-Correction during drafting)*: The prompt asks to "Give the losing side its best day in court." If I recommend conditional approval, the "losing side" is the Philosopher (who wants reject) OR the Vendor (who wants full approval). Actually, the user says "If we go with conditions, the strongest objection isn't the circularity one, it's that clinicians will anchor..." So the "losing side" in a conditional approval scenario is the one worried about safety/anchoring (Philosopher/Nurse). I need to address the anchoring risk specifically.

      *(Refining the Uniform Prior point)*: The vendor says site-specific validation is optional. I need to explicitly contradict this. The uniform prior is a bias, not a proof.

      *(Refining the Pilot)*: A silent pilot avoids the feedback problem initially. But to test clinical utility, you eventually need to show it. The memo should acknowledge that a pilot establishes *model behavior*, not necessarily *patient outcomes* due to the feedback loop.

      *(Word Count Check)*: Keep it tight.

  7.  **Final Polish:**
      *   Check word count.
      *   Ensure recommendation is first.
      *   Ensure no citations.
      *   Ensure all 4 bullet points from prompt are addressed.

      *Bullet 1 (Uniform Prior):* Addressed by demanding local retrospective data.
      *Bullet 2 (Calibration):* Addressed by specifying calibration metrics over ranking.
      *Bullet 3 (Feedback):* Addressed by specifying silent mode and acknowledging limits.
      *Bullet 4 (Anchoring/Inertia):* Addressed by hard gate/pre-defined exit criteria.

      *Philosopher Nuance:* Right about the prior, wrong about rejecting all external validity.

      *Vendor Nuance:* Wrong about optional validation, right that model might be good.

      *Let's write.*

