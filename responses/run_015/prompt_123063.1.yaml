      TO: Clinical Analytics Review Committee
      FROM: [My Name]
      DATE: [Current Date]
      SUBJECT: Decision Memo: Corvid Health "Universal" Upgrade

      **Recommendation:** Approve with Conditions and Hard Gate. Do not deploy clinically until local calibration is verified in silent mode.

      **The Vendor's Claim vs. Reality**
      Corvid argues their "Universal" model requires no site-specific validation because it performs well on 11,000 synthetic tasks generated from a uniform random prior. The philosopher on our committee is correct: this is mathematically hollow. Performance on a uniform prior reflects only how well the model matches the generator's biases, not clinical reality. A model that averages well over all possible universes may fail in ours. Therefore, the vendor's claim that site-specific validation is optional is false. We must validate on *our* data.

      However, the philosopher is incorrect that we should reject the upgrade outright. While past performance elsewhere doesn't guarantee local success, it is not circular to expect a model trained on diverse data to generalize better than one trained on narrow data, provided we verify calibration. We should not discard potential improvements due to philosophical purity, but we must demand empirical proof locally.

      **Technical Requirements**
      1.  **Discard the Synthetic Suite:** Do not ask Corvid to identify the "50 most similar tasks" from their suite. This invites cherry-picking. Instead, require them to run Universal on our retrospective data from the last two years. We need performance metrics on *our* patient population, not their synthetic approximation.
      2.  **Calibration Over Ranking:** Our protocol fires at a fixed probability threshold. It does not matter if the model ranks patients correctly (AUC) if the probabilities are wrong. If the model says 10% risk but our base rate is 2%, we will over-treat. The vendor must demonstrate calibration plots on our data, not just discrimination metrics.
      3.  **The Feedback Problem:** We must be honest about what a pilot can prove. Once clinicians see scores, they intervene, changing the outcome labels (sepsis vs. non-sepsis). This creates a feedback loop where we cannot easily measure false negatives. Therefore, the initial phase must be **silent mode**. The model runs in the background; clinicians do not see scores. This establishes baseline performance without contamination.

      **Addressing the Strongest Objection**
      The most significant risk is not mathematical circularity, but human inertia. If we start a pilot, clinicians may anchor on the scores, and the "trial" becomes permanent deployment by default. To prevent this, we set a **Hard Gate**.
      *   **Condition:** Universal replaces the current model only if calibration error on local silent data is lower than the current model by a pre-specified margin.
      *   **Timeline:** Corvid has 4 weeks to run retrospective validation. If passed, we begin a 8-week silent pilot. If calibration metrics are not met by [Date 2 weeks before March contract lapse], we reject the upgrade and renew the current contract.

      **Conclusion**
      We accept the upgrade path but reject the vendor's evidence standard. We validate locally, prioritize calibration, and prevent deployment inertia with a hard stop.

