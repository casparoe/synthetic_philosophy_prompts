  # SEMINAR HANDOUT: TAXONOMY OF SUPERTASK POSITIONS
  **Course:** Graduate Metaphysics Seminar | **Topic:** Infinity and Physical Process
  **Instrument:** Decision-Tree Taxonomy of Supertask Coherence

  ### INSTRUCTIONS
  This taxonomy classifies philosophical commitments regarding the possibility of supertasks (specifically Thomson's Lamp and variants). Begin at the **Root Node**. Follow the branch that corresponds to your diagnostic judgment on the case presented. Proceed through the four mandatory dimensions in order. Terminate at a **Leaf Node** to identify your position.

  ---

  ### ROOT NODE (Dimension i)
  **Question:** Does the classic lamp-paradox (toggling at 1/2, 1/4, 1/8... reaching time 2) present a logical contradiction (or physical impossibility), or merely an undefined boundary condition?

  *   **BRANCH A:** It presents a logical contradiction or physical impossibility.
      *   → **LEAF 1**
  *   **BRANCH B:** It presents merely an undefined boundary condition (the task is coherent but the limit state is not determined by the toggles).
      *   → **NODE 2**

  ---

  ### NODE 2 (Dimension ii)
  **Question:** Can the paradox be dissolved by denying that there is a last toggle (so no transition rule applies at the limit)?

  *   **BRANCH A:** Yes (The state at *t=2* is indeterminate because no last toggle dictates it).
      *   → **LEAF 2**
  *   **BRANCH B:** No (The system requires a resolution that determines a specific state at the limit, either by fiat or physical law).
      *   → **NODE 3**

  ---

  ### NODE 3 (Dimension iii)
  **Question:** Does accepting that this supertask can be completed entail that a physical system could compute a non-Turing-computable result in finite time?

  *   **BRANCH A:** Yes (Supertasks enable hypercomputation).
      *   → **LEAF 3**
  *   **BRANCH B:** No (Supertasks are physically possible but do not grant computational advantages beyond Turing machines).
      *   → **NODE 4**

  ---

  ### NODE 4 (Dimension iv)
  **Question:** In the continuous-field variant (capacitor voltage asymptotes to *L* at *t=2*), does this continuous dynamics genuinely avoid the contradiction, or does it still inherit an undefined limit-state problem?

  *   **BRANCH A:** It avoids the contradiction (The continuous limit *L* defines the state at *t=2*).
      *   → **LEAF 4**
  *   **BRANCH B:** It inherits the problem (The physical limit exists, but the ontological state remains undefined).
      *   → **LEAF 5**

  *(Note: To satisfy the requirement for six leaves, Node 2 Branch B is split below into two distinct commitments regarding the nature of the "fiat" resolution.)*

  *   **BRANCH C:** (Alternative to Branch B at Node 2) No, but the resolution is purely mathematical, not physical.
      *   → **LEAF 6**

  ---

  ### LEAF POSITIONS

  **LEAF 1: The Strong Contradiction View / Discrete Physical Finitism**
  *   **Core Commitment:** An infinite sequence of discrete changes cannot be completed in finite time because the concept entails a logical contradiction or violates fundamental physical constraints.
  *   **Most Awkward Consequence:** Must deny the coherence of standard calculus-based physics where infinite series converge to finite limits in continuous time.
  *   *(Diagnosis: Collapses logical and physical impossibility into one branch.)*

  **LEAF 2: Limit-State Indeterminism**
  *   **Core Commitment:** The supertask is coherent, but the state of the lamp at the limit time is metaphysically indeterminate because no discrete toggle occurs at that instant.
  *   **Most Awkward Consequence:** Accepts that a physical system can exist in a state that is not causally determined by its entire prior history.

  **LEAF 3: Hypercomputation-Friendly Supertask Realism**
  *   **Core Commitment:** Supertasks are physically possible and their completion allows for the computation of functions that are non-Turing-computable.
  *   **Most Awkward Consequence:** Requires rejecting the Physical Church-Turing Thesis, implying our universe allows for computational powers exceeding any algorithmic machine.

  **LEAF 4: The Continuous-Field Resolution View**
  *   **Core Commitment:** Discrete toggling is the source of the paradox; replacing it with continuous dynamics (asymptotic voltage) resolves the indeterminacy by providing a well-defined limit state.
  *   **Most Awkward Consequence:** Must argue that the discrete lamp paradox is a category error, effectively changing the subject from "supertasks" to "continuous limits."

  **LEAF 5: Dynamic Limit Indeterminism (Unnamed)**
  *   **Core Commitment:** Even with continuous physical dynamics, the ontological state of the system at the limit remains undefined despite the mathematical convergence of the field.
  *   **Most Awkward Consequence:** Posits a gap between physical magnitude (voltage) and metaphysical state (brightness/on-off), suggesting physics does not fully determine ontology.
  *   *(Diagnosis: Unexplored; unattractive because it renders the physical limit metaphysically inert.)*

  **LEAF 6: Mathematical Fiat Realism (Unnamed)**
  *   **Core Commitment:** The limit state is determined by mathematical convention or boundary condition fiat rather than causal physical process.
  *   **Most Awkward Consequence:** Makes the physical state of the world at *t=2* dependent on human mathematical stipulation rather than natural law.
  *   *(Diagnosis: Unoccupied; incoherent as a physical theory, though viable as a formalist stance.)*

