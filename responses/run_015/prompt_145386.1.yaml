  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the "only rises" question clearly? *Correction:* Make sure to emphasize that "no punishment" doesn't mean "no power." It means power is embedded in the *structure of opportunity*, not the threat of pain.
      *   *Check:* Is the distinction between strict presuppositions and comfortable accompaniments clear? *Correction:* Use the concept of "necessary conditions" vs. "contingent features."
      *   *Check:* British English spelling (behaviour, programme, normalisation, etc.).
      *   *Check:* No footnotes. Keep it flowing.

  6.  **Final Polish:**
      *   Ensure the distinction between *sovereign* power (punishment) and *disciplinary* power (normalization) is clear without using too much jargon.
      *   Highlight the "debt" aspect of the cumulative score.
      *   Make sure the advice for the governors' meeting is actionable based on the analysis.

  7.  **Final Review against constraints:**
      *   British English? Yes.
