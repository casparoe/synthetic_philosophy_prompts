answer: |-
  Here is a 45-minute teaching arc designed specifically for CS grad students. It treats the "White Horse Dialogue" as an ontology engineering problem rather than a historical artifact.

  ### 1. The Dependency Order: Skip Aristotle, Start with Naive Sets
  **Do not teach Aristotelian categories first.**
  CS students already have a mental model for classification: Type Theory and Set Theory. Aristotelian substance/accident distinctions will just add fog.

  *   **Start here:** Naive Set Membership vs. Type Identity.
  *   **The Crack:** Show them that their intuition relies on conflating *subset* ($\subset$) with *identity* ($=$).
  *   **The Move:** Gongsun Long isn't denying that a white horse falls under the category of horse (extension); he is denying that the *concept* "White Horse" is identical to the *concept* "Horse" (intension).

  ### 2. The One Analog Example: Class Signatures vs. Instances
  Use **Object-Oriented Type Identity**, not database rows.
  Database queries (`SELECT * FROM horses WHERE color='white'`) are good, but they focus on data retrieval. You want to focus on *definition*.

  **The Analogy:**
  Compare two function signatures in a strongly typed language (like Java or TypeScript):
  1.  `void feed(Horse h)`
  2.  `void feed(WhiteHorse w)`

  **The Lesson:**
  *   **Student Intuition:** "I can pass a `WhiteHorse` object into `feed(Horse)`. So a White Horse *is* a Horse." (This is Liskov Substitution/Polymorphism).
  *   **Gongsun's Point:** "The *signature* `feed(WhiteHorse)` is not identical to the *signature* `feed(Horse)`. If you swap the definitions, the compiler throws an error."
  *   **Why this carries the lesson:** It forces them to distinguish between an **instance** (the object in memory) and a **type definition** (the class schema). Gongsun is arguing about the *Class Schema*, not the *Instance*.
      *   `WhiteHorse` class $\neq$ `Horse` class.
      *   Therefore, "White Horse" (the name/type) is not "Horse" (the name/type).

  ### 3. The Teaching Arc (45 Minutes)

  **0:00–0:05: The Hook & The Biological Misconception**
  *   **Action:** Write "A White Horse Is Not A Horse" on the board. Ask: "Who would merge this PR?"
  *   **Misconception 1 (Biological):** Students will immediately think Gongsun is claiming white horses are a different species.
  *   **Interception:** Shut this down immediately. Tell them: "He knows biology. He's not talking about the animal. He's talking about the *label*."
  *   **Goal:** Shift the debate from *ontology of things* to *ontology of names*.

  **0:05–0:20: The Logic (Sets vs. Types)**
  *   **Action:** Draw the Venn Diagram. Circle $H$ (Horses), Circle $W$ (White Things). Intersection is $W \cap H$ (White Horses).
  *   **Logic:**
      *   Opponent says: $W \cap H \subset H$ (True).
      *   Gongsun says: $(W \cap H) \neq H$ (Also True).
  *   **The Conflict:** The word "Is" in English (and Ancient Chinese) does too much work. It means "is a member of," "is a subset of," and "is identical to."
  *   **Apply Analogy:** Bring back the Code Signatures. `WhiteHorse` extends `Horse`. They are not *equal*. If you require a `Horse` ID, a `WhiteHorse` ID works. But if you require the exact Class Type, it fails. Gongsun is arguing for strict type equality.

  **0:20–0:30: The Linguistic Misconception**
  *   **Misconception 2 (Language Trick):** Students will argue, "This is just semantics/ambiguity. It's a trick of grammar."
  *   **Interception:** Acknowledge it, then pivot. "Yes, it's semantics. But in CS, semantics *are* the system. If your API documentation says 'Accepts Horse' but your code checks 'Exact Match Horse', you have a bug."
  *   **Point:** Gongsun isn't playing word games for fun; he's stress-testing the reliability of language to map to reality. This is the "Rectification of Names" (Zhengming).

  **0:30–0:40: The Russell Misconception & System Limits**
  *   **Misconception 3 (Russell's Paradox):** A sharp student will raise their hand: "Isn't this just the Set of All Sets problem? Self-reference?"
  *   **Interception:** No. Russell's Paradox is about a set containing itself. Gongsun is about *compound types* vs. *base types*.
  *   **The Real Problem:** The issue isn't self-reference; it's **granularity**. If "White Horse" = "Horse", then "Black Horse" = "Horse". By transitivity, "White Horse" = "Black Horse". The system collapses because distinctions vanish.
  *   **Why the School of Names Cared:** They weren't logicians in a tower; they were advisors to kings. If laws say "Stealing a Horse is a crime," but the definition of "Horse" is too loose, you can't prosecute someone for stealing a *White* Horse specifically if the law requires precision. Ambiguous types break governance.

  **0:40–0:45: The Check Question**
  *   Do not ask: "Is a white horse a horse?"
  *   **Ask this:** "If you are designing a knowledge graph for a legal system, and you define `WhiteHorse` as strictly equivalent to `Horse` (not a subclass, but identical), what specific query or inference breaks when you try to enforce a rule that applies *only* to white horses?"
  *   **Correct Answer Logic:** They must identify that you lose the ability to filter or apply specific constraints to the subset without affecting the superset. If $A = B$, you cannot have a rule for $A$ that doesn't apply to $B$. The system loses resolution.

  ### 4. What to Skip (Crucial for Time)
  **Skip the "Hard and White" (Jian Bai Lun) fragments.**
  *   **Why:** That dialogue argues that you can't perceive "hardness" and "whiteness" simultaneously in a stone. It's about **qualia and sense perception**, not class membership.
  *   **Risk:** It drags the conversation into epistemology ("How do we know?") rather than logic ("How do we classify?"). For CS students, perception is a sensor problem; classification is a data structure problem. Stick to the data structure problem.

  ### 5. Translation Note for the Rusty Instructor
  You don't need to worry about the variant translations of *fei* (is not / is not identical to).
  *   Just treat *fei* as logical inequality ($\neq$).
  *   The text is *Bai Ma Fei Ma*.
  *   If a student asks about the Chinese grammar, tell them: "The grammar allows 'is not' to mean 'is not identical to' rather than 'is not a member of'. That ambiguity is the feature, not the bug."

  ### Summary of Misconception Sequence
  1.  **Biological/Physical** (Minute 5): "He thinks they're different animals." -> **Fix:** Clarify we are discussing Types, not Instances.
  2.  **Linguistic Trick** (Minute 25): "It's just ambiguous grammar." -> **Fix:** Ambiguity in specs causes system failure (Rectification of Names).
  3.  **Russell's Paradox** (Minute 35): "It's about self-referential sets." -> **Fix:** No, it's about Compound Type vs. Base Type identity.

  This arc respects their technical background while forcing them to confront the philosophical rigor required to build robust systems.
