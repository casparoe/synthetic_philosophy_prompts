  **Recommendation**

  I recommend we rule that Ordinance 31 was not breached in this instance. The colleague requires no retroactive consent and may continue the course without restriction. We should formally uphold the administrator's initial advice to ensure consistency. However, to prevent recurrence of uncertainty and protect staff, I propose we commission revised guidance notes clarifying the Ordinance's scope, specifically regarding remote learning and commercial publications. These must be circulated to all faculty by the end of next term. The vote should be taken at the end of this month's meeting. This balances fairness to the individual with institutional clarity, ensuring that legitimate outside activities are not chilled by ambiguous regulation while preserving the Committee's oversight where genuine conflicts of interest arise.

  **The readings available, and what else each of them catches**

  There are two principal readings available to the Committee. The first is a strict textualist approach: the phrase 'any person who is a registered student' means exactly that, without qualification. On this reading, the colleague's course is caught. However, this reading also catches textbook royalties when copies are purchased by our own students, paid external examining where students sit papers, and private tutoring for University exams. It renders almost all commercial academic interaction with students illicit without prior consent, potentially criminalising standard academic publishing. The second is a purposive approach: the Ordinance targets specific conflicts of interest where staff profit from their University authority over students. This catches private coaching for Marchmont examinations and supervised research sold privately, aligning with the 1937 scandal. It excludes general commercial courses unrelated to University assessment, textbook sales, and external examining where the staff member holds no grading authority over the specific students. Furthermore, the textual reading would arguably capture paid supervision of alumni or even informal mentoring if remuneration changed hands. The purposive reading distinguishes between teaching as a University employee and teaching as a private individual, even if the audience overlaps. The textual reading offers administrative certainty but leads to absurd outcomes inconsistent with established practice, creating a compliance trap for honest staff. The purposive reading offers fairness and aligns with historical intent but requires judgement on what constitutes a relevant 'conflict' rather than mechanical application. We must choose between a rule that is clear but overly broad, and one that is nuanced but demands interpretation. Consider the implications for external examining: under the textual reading, every examiner would need consent for every student they examine across the university, an administrative impossibility. For textbooks, authors would need to declare every student purchase, violating privacy norms. The purposive reading limits the burden to situations where the staff member has direct pedagogical authority over the student in a University context. It recognises that the Ordinance was designed to prevent the sale of University credit or advantage, not the sale of knowledge itself. The textualist captures the letter but kills the spirit; the purposivist saves the spirit but risks bending the letter. The choice is between a regulation that governs everything and thus nothing, and one that governs only what matters.

  **Why I recommend the reading I do**

  I recommend the purposive reading. The 1937 context was explicitly about staff profiting from teaching their own students towards their own papers. While the 1971 Council rejected a narrowing amendment, we cannot assume they intended to capture textbook royalties or unrelated online courses. To do so would be to allow the text to override the obvious purpose, creating an absurdity the drafters likely did not envisage. The colleague's course is statistics for managers; the eleven students are not in his department, and the course bears no relation to their Marchmont assessments. There is no conflict of interest, no diversion of University resources, and no risk of coercion. The Ordinance aims to protect students from exploitation by those who grade them, not to monopolise all knowledge transfer to registered students. A reading that requires consent for textbook purchases would undermine academic dissemination. Therefore, the Ordinance should be read as prohibiting remuneration for teaching connected to the student's University programme or assessment. This respects the text while avoiding results that would halt normal academic life. It acknowledges that 'teaching' in this context implies teaching within the sphere of University authority, not merely any instruction received by a person who happens to be enrolled elsewhere. Furthermore, the administrator's initial advice relied on this understanding; overturning it now would punish reliance on institutional guidance. We must prioritise the substantive goal of preventing exploitation over a formalistic adherence to words that, if taken literally, would criminalise standard academic publishing and external examining. The integrity of the University is better served by focusing on actual conflicts of interest rather than technical breaches involving unrelated subjects. Moreover, the nature of higher education has changed since 1937; staff are now expected to engage with wider society. A rigid reading stifles this engagement without protecting students. The defeated 1971 amendment suggests a desire for breadth, but not infinite breadth. We must interpret the words in light of the regulatory object: preventing staff from leveraging their institutional power for private gain. Since the colleague leveraged no such power here, the purpose is not engaged.

  **The strongest argument for the other reading**

  The strongest argument for the textual reading is certainty and democratic authority. The words are plain: 'any person who is a registered student'. To introduce exceptions is to rewrite the Ordinance, a power belonging to Council, not this Committee. The 1971 defeat is crucial: Council considered limiting the scope to exam preparation and chose not to. This indicates a deliberate choice for the wider wording, perhaps to capture emerging forms of exploitation not visible in 1937. If we carve out exceptions for textbooks or unrelated courses, we undermine the Council's decision and create a slippery slope. Who decides what is 'related' enough? One member's unrelated course is another's conflict. A strict rule avoids favouritism and ensures all staff are treated equally. It forces staff to seek consent, which is a low burden, rather than allowing them to judge their own compliance. By ruling for the colleague, we risk creating a precedent that allows staff to self-exempt based on subjective assessments of conflict, potentially eroding the safeguard the Ordinance was designed to be. The administrator's error should be corrected to maintain the rule of law within the University; reliance on incorrect advice does not validate a breach. Furthermore, the textual reading provides a bright-line rule. Staff know exactly where they stand: if a student is enrolled, consent is needed. This removes ambiguity and reduces litigation risk. The purposive reading introduces vagueness: what level of generality defines the 'purpose'? Is it preventing exploitation, or preventing any private profit from students? If we adopt the purposive view, we invite future disputes about whether a specific course is 'related' to University work. Consistency demands we apply the text as written until Council changes it.

  **How much, if anything, this decides for future cases**

  This decision should not be treated as binding precedent in the strict sense, but it will inevitably guide future administration. If we rule for the colleague, we establish that unrelated commercial teaching is permissible. However, relying on case-by-case adjudication is inefficient and risks inconsistency. I recommend we use this case to trigger a formal review of the guidance notes. We should not leave staff guessing. The Committee should draft explicit exclusions for textbooks and general commercial courses not linked to University assessment. This ensures that future cases are decided by clear policy rather than retrospective interpretation. We must balance the need for flexibility with the need for predictability. While this paper resolves the immediate complaint, it highlights the obsolescence of the current wording. Future committees should not have to reconstruct the 1937 purpose anew. We owe it to the staff to codify the purposive reading into clear administrative guidance, thereby reducing the burden on both applicants and the Committee. This transforms a one-off exemption into a stable rule.

  **How confident I am, and the point I am least sure of**

  I am highly confident in the recommendation overall. The absurdity of the textual reading is too great to ignore, as it would disrupt standard academic practice. However, I am least sure about the weight to be given to the 1971 defeated amendment. A good objector will argue that rejecting the amendment was a deliberate signal to keep the text broad, and that my purposive reading effectively reinstates the amendment Council voted down. Distinguishing between 'ignoring Council' and 'interpreting Council's intent' is the fragile step in my argument. If the Council intended the words to bear their full literal weight regardless of consequence, my reasoning fails.
