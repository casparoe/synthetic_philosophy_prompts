answer: |-
  This is a classic finance dinner argument, and you are right to feel that the phrase "you can't beat the market" is doing too much heavy lifting. It functions as a conversation stopper, but it actually conflates at least four or five distinct theoretical and empirical claims, ranging from "accounting identity" to "abstract economic theory."

  Your roommate is mixing up **probabilities** (it's hard), **aggregates** (most people lose), and **theoretical limits** (it's impossible).

  Here is the menu you asked for, ordered from the mundane arithmetic truth to the radical theoretical claim. You can walk him through these to see which one he actually intends to defend.

  ### 1. The Arithmetic of Costs (The Zero-Sum Game)
  **The Claim:** Before transaction costs and fees, the aggregate return of all active investors *is* the market return. Therefore, after costs (fees, spreads, taxes), the aggregate active investor must underperform the passive market.
  *   **Is it true?** Yes. This is an accounting identity. If everyone holds the market, the average return is the market return. If some people trade actively, they are swapping shares with each other. For every winner who beats the market, there must be a loser who underperforms it (before costs). Once you add fees, the average active dollar *must* lose to the average passive dollar.
  *   **Does it support his argument against you?** **Partially.** It establishes that stock picking is a negative-sum game for the group. However, it does not prove *you* specifically will be a loser. It just means you are entering a poker game where the house takes a rake; it's harder to win, but not impossible.
  *   **Verdict:** **True, but aggregate.** It warns you about odds, not impossibility.

  ### 2. The Empirical Regularity (SPIVA Data)
  **The Claim:** Historically, over 15+ year periods, roughly 85-90% of professional active fund managers underperform their benchmark index (e.g., S&P 500) after fees. If professionals with Bloomberg terminals and PhDs can't do it, you definitely can't.
  *   **Is it true?** **Mostly.** The SPIVA (S&P Indices Versus Active) scorecards consistently show that most active managers fail to beat their benchmarks over long horizons.
  *   **Does it support his argument against you?** **Weakly.** This is an inductive argument ("most people fail"), not a deductive one ("no one can"). Furthermore, there is a selection bias: professionals are often constrained by mandates (e.g., "must hold 50 stocks," "can't hold more than 5% cash"), whereas you are unconstrained. Also, professionals are often judged on short-term relative performance, forcing them to herd. You have a time arbitrage advantage.
  *   **Verdict:** **True statistic, weak inference.** It suggests you should lower your expectations, not that you should stop.

  ### 3. Efficient Market Hypothesis (Semi-Strong Form)
  **The Claim:** Asset prices reflect all **publicly available information** instantly and accurately. If you read about a drug trial in the news, algorithms have already digested that headline, assessed the probability of FDA approval, and adjusted the price. There is no "free lunch" left in public data.
  *   **Is it true?** **Mostly, but with cracks.** Markets are highly efficient on large-cap, widely followed stocks (e.g., Pfizer, Merck). They are less efficient on small-cap, complex, or binary-event stocks.
  *   **Does it support his argument against you?** **This is the real battleground.** If you are picking large pharma based on CNN headlines, he is right. If you are reading clinical trial protocols, understanding p-values, and assessing probability of success better than the consensus analyst, the market may not have "priced it in" correctly because valuation here is subjective, not mathematical.
  *   **Verdict:** **Plausible, but context-dependent.** Efficiency is a matter of degree, not a binary switch. Pharma is notoriously hard to value, which creates inefficiency.

  ### 4. The No-Trade Theorem (Milgrom-Stokey, 1982)
  **The Claim:** This is the "semi-mystical" thing he half-remembered. It states that if two traders have **common priors** (they start with the same baseline probability model) and both know the other is **rational**, they will not trade based solely on asymmetric information. If I try to sell you a stock, you should infer that I know something bad about it. Since I know you will infer that, I shouldn't try to sell it to you unless I have a non-informational reason (like needing cash). Therefore, speculative trade based on information differences should not happen.
  *   **Is it true?** **Mathematically yes, practically no.** The theorem holds strictly *only* under the assumption of "common priors" and perfect rationality.
  *   **Does it support his argument against you?** **No.** This is "vibes." In the real world, traders do not have common priors (you think the drug has a 60% chance of approval; the market thinks 40%). People also trade for liquidity, hedging, or behavioral biases (overconfidence). The fact that billions of shares trade daily proves the assumptions of the theorem do not hold in reality.
  *   **Verdict:** **Theoretically sound, empirically irrelevant.** Invoking this against a retail investor is intellectual posturing. It explains why markets *could* freeze under hyper-rational conditions, not why you can't make money today.

  ### 5. Efficient Market Hypothesis (Strong Form)
  **The Claim:** Prices reflect **all information, public and private**. Even if you had inside information about the drug trial results, you couldn't profit because the price already reflects it.
  *   **Is it true?** **False.** If this were true, insider trading laws would be unnecessary. Inside information *does* generate alpha (which is why it's illegal to use).
  *   **Does it support his argument against you?** **No.** Unless he thinks you are an insider, this doesn't apply.
  *   **Verdict:** **False.**

  ---

  ### The Verdict on the "No-Trade" Argument
  You asked specifically about the "semi-mystical impossibility thing." **He is using it as vibes.**

  The No-Trade Theorem is a profound result in market microstructure theory, but it relies on the assumption that the only reason to trade is **information**. In the real world, the majority of trading volume comes from:
  1.  **Liquidity needs:** "I need cash for a house."
  2.  **Rebalancing:** "My portfolio is too tech-heavy."
  3.  **Hedging:** "I own an airline, I need to buy oil futures to offset risk."
  4.  **Differing Priors:** "I believe in this technology, you don't."

  The theorem essentially says: *"If we both know we are perfectly rational, and we start with the same beliefs, I can't convince you to trade with me just by acting on new info."*
  Since you and the market clearly have different beliefs (priors) about these pharma companies, the theorem does not apply to you. Using it to say "math says you can't trade" is like using the Ideal Gas Law to argue that a bicycle tire can't hold air because molecules aren't actually dimensionless points.

  ### The Defensible Version of His Point
  If you want to preserve the friendship but keep your conviction, here is the strongest version of his argument that *doesn't* rely on slogans or broken math:

  > "The market is a competitive ecosystem. The people on the other side of your trade are hedge funds with satellite imagery, supercomputers, and teams of PhD biologists. For you to win, you have to be right when *they* are wrong. That is possible, but the **expected value** of your time spent researching is likely lower than simply buying the index and spending that time on your actual career. You aren't mathematically prohibited from winning, but the risk-adjusted return on your research hours is probably negative."

  ### How to Reply
  You can tell him:
  1.  **Agree on the Arithmetic:** You acknowledge that active investing is a negative-sum game after fees (Claim #1).
  2.  **Reject the Determinism:** You reject the idea that "most fail" means "all fail" (Claim #2).
  3.  **Clarify Efficiency:** You argue that Pharma is a specific niche where information is complex and binary, making "priced in" harder to achieve than in, say, the S&P 500 (Claim #3).
  4.  **Call the Bluff:** Tell him the No-Trade Theorem requires common priors, and since you disagree with the market's pricing, you by definition do not have common priors, so the theorem doesn't apply (Claim #4).

  **Bottom line:** He is right that you are taking on uncompensated risk and fighting an uphill battle. He is wrong that it is mathematically futile or that "the market" is a monolithic entity that cannot be beaten by an individual with a specific edge.
