  8.  **Final Polish:** Organize into clear sections: The Translation, The Natural Purpose Tension, The Residue Report. (Proceed to generate output based on this structure.)

  *(Self-Correction Note during final review)*: I need to be careful not to reduce Kant to a utilitarian. The "Indirect Duty" view isn't about maximizing happiness but preserving moral capacity. In physiological terms, it's about maintaining the integrity of the moral control system, not minimizing nociceptive signals in the aggregate. I must make sure the translation reflects *deontological maintenance* rather than *utilitarian calculation*.

