  *Cost to fix:* You must restrict (3). Admit observer-counts *are* evidence within bounded experimental contexts but not for unbounded cosmological hypotheses. This costs theoretical unity; you lose a universal ban on anthropic updates.

  **2. Ambiguity in (2)**
  (2) cites "awakening-events." (3) pushes toward reading these as temporal stages of a single observer (avoiding anthropic counts). (7) pushes toward reading them as distinct observer-moments equivalent to duplicates. You are using (2) ambiguously: as temporal parts to dodge (3), but as distinct centers to justify (7).
  *Cost to fix:* Explicitly define "awakening-events" as centered-worlds regardless of ontological status. This aligns (2) with (7) but makes the conflict with (3) explicit (see Rank 1).

  **3. Negligible Tension: (1) and (5)**
