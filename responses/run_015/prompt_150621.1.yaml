      *   **Moral Rationalism:** The view that moral obligations are binding on agents *qua* rational agents.
      *   **The Threat:** If WKR shows that moral reasons are just one kind of reason among others (competing with self-interest), does that weaken the *necessity* of moral rationalism? Or does WKR actually help rationalism by isolating moral reasons as the only *normatively authoritative* ones in that domain?
      *   **Key Philosophers typically associated:** Rabinowicz & Rønnow-Rasmussen (WKR origin), Parfit, Korsgaard (Constitutivism), Strawson (Reactive Attitudes), Shah & Velleman (Belief).

  3.  **Evaluate the Student's Answer:**

