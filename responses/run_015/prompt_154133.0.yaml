answer: |-
  ### 1. Tiering the Eight Foundations

  I have sorted the eight candidates into four tiers based on their robustness as independent explanatory variables for left-right moral disagreement, balancing the pilot data you provided against theoretical durability and cross-cultural stability.

  **Tier 1: Workhorse (High trust in independent explanatory power)**
  *   **Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation:** These five remain the core workhorses because they have demonstrated replicable factor structures across diverse cultures and consistently map onto the individuating (left) and binding (right) divide with high reliability.
  *   **Justification:** They possess the deepest empirical track record and the clearest evolutionary rationales for why they would generate stable political cleavages across time and place.

  **Tier 2: Real but Secondary (Moderate trust, distinct but narrower scope)**
  *   **Liberty/Oppression:** While often correlated with Fairness (reactance to restriction) or Care (protection of victims), it captures a unique sensitivity to dominance that predicts libertarian and populist attitudes better than the core five.
  *   **Stewardship:** Assuming your pilot holds, this likely captures a temporal dimension (intergenerational obligation) that Loyalty (spatial/group) and Authority (hierarchical) miss, making it a valuable secondary predictor for environmental and traditionalist attitudes.
  *   **Justification:** Liberty is well-established but sometimes redundant; Stewardship is theoretically distinct but may function more as a specific value instantiation than a broad intuitive foundation.

  **Tier 3: Probably Reduplicative (Low trust in independence)**
  *   **Legibility:** Even with pilot separation, this feels theoretically vulnerable to being re-absorbed into Fairness (procedural justice) or Liberty (resistance to hidden oppression) as survey items are refined or contexts change.
  *   **Justification:** The outrage at opacity is likely a modern, institutional elaboration of the cheating or oppression detectors rather than a distinct innate module, making it less stable as a foundational construct.

  **Tier 4: Probably Not a Foundation (Negligible trust as a distinct module)**
  *   *(None assigned:)* While Legibility is the weakest candidate, the pilot data prevents me from categorically dismissing it as "not a foundation" for your specific module, though it borders this tier theoretically.

  ***

  ### 2. Admission Criteria Scoring (0–5)

  Here is the scoring for the two candidates based on the six criteria you specified. A score of 5 indicates strong evidence meeting the standard of the original five foundations; 0 indicates no evidence.

  | Criterion | Legibility | Stewardship | Rationale for Discrepancy |
  | :--- | :---: | :---: | :--- |
  | **Innate Preparedness / Early Emergence** | 1 | 3 | Children detect unfairness early, but "institutional opacity" requires complex cognitive scaffolding; stewardship (tool care/resource saving) has deeper evolutionary roots. |
  | **Recognizable Eliciting Pattern** | 3 | 4 | Hidden algorithms are a specific modern trigger; squandering inherited goods (food, tools, land) is a universal, recognizable trigger across history. |
  | **Characteristic Emotion** | 4 | 4 | Legibility's "outrage" is clear; Stewardship's "resentment/regret" is distinct and palpable in both conservation and traditionalist contexts. |
  | **Characteristic Motivation** | 4 | 5 | "Audit/Disclose" is specific; "Preserve/Transmit" is a fundamental behavioral drive observable in non-human animals (caching) and all human cultures. |
  | **Culturally Variable Elaboration** | 2 | 4 | Legibility depends on bureaucracy/tech (low universality); Stewardship varies in *object* (land vs. craft) but the *obligation* is culturally universal. |
  | **Predictive Power (Unique Variance)** | 5 | 5 | Per your pilot assumption, both currently predict political attitudes not captured by the original six, earning full marks on empirical utility. |
  | **Total Score** | **19** | **25** | Stewardship demonstrates stronger theoretical validity as a *foundation*; Legibility scores higher on modern predictive relevance. |

  ***

  ### 3. Item Budget Allocation

  **Allocation:** **0.70 to Stewardship / 0.30 to Legibility**

  **Reasoning:**
  You should weight the budget heavily toward **Stewardship** because it has higher *construct validity* as a moral foundation. As the scores above indicate, Stewardship rests on older evolutionary adaptations (resource maintenance, teaching, intergenerational transfer) that are likely to survive translation into non-Western or non-digital contexts. Legibility, while empirically promising in your pilot, risks being a "period effect"—a moralization of modern bureaucratic and technological friction that may not load consistently in agrarian or low-state-capacity societies. By allocating 70% of the new item budget to Stewardship, you prioritize the module's long-term cross-national robustness; the remaining 30% for Legibility allows you to capture the unique variance it currently offers in industrialized contexts without over-investing in a construct that might collapse into Fairness or Liberty in future iterations.

  ***

  ### 4. Normative Implications for the "Symmetric Conclusion"

  Admitting either candidate would likely **weaken** the strong symmetric conclusion that "neither side can be dismissed as morally deficient," particularly if one of the new foundations proves politically asymmetric.

  The standard six-foundation picture supports symmetry by suggesting Liberals and Conservatives simply prioritize different *subsets* of a shared moral menu (Liberals: Care/Fairness; Conservatives: All Six). This allows for a normative truce: both are playing the same game, just with different strategies. However, introducing a new foundation that is **politically asymmetric** (e.g., if Legibility is exclusively Liberal or Stewardship is exclusively Conservative) shifts the argument from *difference* to *deficiency*.

  If **Legibility** turns out to be a genuine moral foundation but is endorsed almost exclusively by the Left, it implies the Right is not just "different" but morally blind to the harms of opacity. Conversely, if **Stewardship** is a genuine foundation endorsed primarily by the Right (or specific traditionalist communities), it implies the Left is morally negligent regarding intergenerational obligation. In either case, the empirical identification of a valid foundation that one side systematically ignores undermines the claim that *neither* side is deficient. It suggests that while both sides have *genuine* moral insights, one side may possess a *more complete* moral map than the other, depending on which new foundations are validated. To maintain the symmetric conclusion, you would need to demonstrate that the new foundations are either valued by both sides (symmetric) or that the blind spots cancel out perfectly (e.g., Left lacks Stewardship, Right lacks Legibility), which is a much harder empirical case to sustain than the current "Conservatives have more foundations" finding.
