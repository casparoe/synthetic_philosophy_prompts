      *   *Procedure:* Concrete steps. (e.g., "The Breakup Trial," "Values Audit," "Blind EMA").
      *   *Questions to Retire:* The big binary ones.
      *   *Confidence:* Needs to be humble but decisive.
      *   *What Would Change Mind:* New data types.

  6.  **Refining the content (Self-Correction during drafting):**
