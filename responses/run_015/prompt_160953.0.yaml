  Here is a complete session plan designed to hit the specific theoretical tension you're describing (Updateless Decision Theory vs. Causal/Evidential Decision Theory) without lecturing. It uses the "Counterfactual Mugging" structure but adapts it for a live, one-shot room.

  ### Session Title: "The Contract and the Coin"
  **Time:** 75 Minutes
  **Stakes:** Raffle tickets (redeemable for a book at the end of the term). Total pot: ~100 tickets.
  **Materials:**
  *   Two distinct decks of envelopes (Round 1 & Round 2).
  *   A biased coin (or a digital randomizer projected on screen set to 80/20).
  *   Index cards and pens for everyone.
  *   A visible "Bank" (bowl) for tickets.

  ---

  ### Part 1: The Activity Design

  #### Round 1: The Signal (Standard Updating)
  *Surface Form:* "Do you buy the envelope?"
  *Goal:* Demonstrate that conditioning on free, true evidence is correct.

  1.  **Setup:** You hold a deck of envelopes. 50% contain **10 tickets**. 50% contain **0 tickets**.
  2.  **Cost:** To buy an envelope, a participant pays **4 tickets** from their personal stash (give everyone 10 tickets to start).
  3.  **The Signal:** Before they decide, you roll a die (hidden).
      *   If the envelope has **10 tickets**: You *always* say "Green".
      *   If the envelope has **0 tickets**: You say "Green" 50% of the time, "Red" 50% of the time.
  4.  **Action:** You whisper the signal to each participant individually (or hand them a slip). They write "BUY" or "PASS" on a card.
  5.  **Resolution:** Collect cards. Reveal envelopes. Pay out.
      *   *Math:* If "Red", P(Win) = 0. (Pass). If "Green", P(Win) = 2/3. EV = (2/3 * 10) - 4 = 2.66. (Buy).
      *   *Expected Outcome:* Everyone who got "Red" passes. Everyone who got "Green" buys. They feel smart for using the info.

  #### Round 2: The Consistency Contract (Policy Selection)
  *Surface Form:* "Do you buy the envelope?" (Identical phrasing, different logic).
  *Goal:* Demonstrate that conditioning on the *branch* destroys the value of the policy.

  1.  **Setup:** "This round uses a biased coin. 80% Heads, 20% Tails."
  2.  **Pre-Commitment (Crucial):** Before the coin is flipped, everyone must write on a sealed card: **"I AGREE TO PAY 10 IF TAILS"** or **"I DECLINE"**.
      *   Collect these cards. Do not look at them yet.
  3.  **The Flip:** Flip the biased coin publicly.
      *   **Scenario A (Heads - 80% of room):** "Congratulations. Because you signed the contract, you receive **25 tickets**. No payment is required." (Hand out tickets immediately).
      *   **Scenario B (Tails - 20% of room):** "You landed in the loss branch. According to your contract, you owe **10 tickets**."
  4.  **The Squeeze (Mid-Game Offer):**
      *   Turn specifically to the **Tails** group.
      *   "I am offering you a one-time amendment. You can pay me **2 tickets** right now to void your contract. If you pay the 2, you owe nothing else. If you don't, you pay the full 10."
      *   *Note:* The Heads group is dismissed to count their winnings. They cannot hear the Tails discussion.
  5.  **Action:** The Tails group decides privately. Write "VOID" or "PAY".
  6.  **The Catch (The "Predictor" Simulation):**
      *   Before they decide, state this rule clearly: *"This game rewards consistency. If you choose to VOID your contract on Tails, I will retroactively disqualify you from the Heads payout **had you landed there**. Since you are in Tails, this doesn't cost you current tickets, but it marks you as a 'Defector' for the final raffle bonus."*
      *   *Wait, to make it mathematically bite in the moment:* "There is a **Consistency Bonus** of 20 tickets drawn at the end of the session. Only those who *would have* paid on Tails are eligible. If you Void now, you are ineligible."
      *   *Actually, keep it simpler for the one-shot feel:* "If you Void, you save 8 tickets now (10 cost - 2 fee). But you prove you are not the type of person who honors the contract. The Heads players got 25 because the *policy* of honoring contracts has value. By Voiding, you capture the local win but destroy the policy value."
      *   *Decision:* To make the stakes real without a magic predictor, use the **Raffle Eligibility**. "The grand prize raffle at the end of the term is only open to participants who honored their Round 2 contracts. Voiding saves you tickets now but bans you from the book raffle."
      *   *This makes the 'counterfactual' physical.*

  ---

  ### Part 2: Timeline (75 Minutes)

  *   **00-10: Intro & Stakes.** Distribute 10 tickets to everyone. Explain the raffle book. No theory talk. "We are testing decision mechanisms."
  *   **10-25: Round 1 (The Signal).** Run the mechanics. Let them calculate EV on napkins. Reveal results.
      *   *Check:* Did anyone Buy on "Red"? Did anyone Pass on "Green"? Briefly ask why.
  *   **25-30: Transition.** Collect tickets. Reset. Hand out new index cards. Emphasize: "Seal your decision before the flip."
  *   **30-50: Round 2 (The Contract).**
      *   30-35: Pre-commitment writing.
      *   35-40: The Flip & Heads Payout (Dismiss Heads group to count winnings).
      *   40-50: The Tails Squeeze. Give them 5 minutes to debate the "Void" offer among themselves. Then vote secretly.
  *   **50-65: Small Group Debrief.** Break into 3 groups of 4.
      *   Q1: "In Round 1, why did you use the signal?"
      *   Q2: "In Round 2, if you were in Tails, did the Void offer look different than the Pre-commit?"
      *   Q3: "What is the actual difference between the two rounds?"
  *   **65-75: Plenary & Theory Mapping.** You bring it together. Connect to the "Addiction" hook.

  ---

  ### Part 3: The Debrief Guide

  Do not start with definitions. Start with their feelings.

  **1. The "Free Evidence" Distinction**
  *   *Ask:* "In Round 1, ignoring the signal was stupid. In Round 2, ignoring the fact that you landed on Tails feels... noble? Or stupid?"
  *   *Map:*
      *   **Round 1 (CDT/EDT):** The signal is *news* about the world. The world is independent of your decision. Conditioning is correct.
      *   **Round 2 (UDT/FDT):** The fact you are in Tails is *news*, but your decision *here* is logically linked to the payout *there* (Heads).
      *   *Key Phrase:* "In Round 1, you updated on the state of the world. In Round 2, you were asked to update on your location in the decision tree. The Policy view says: **Don't condition on your location.** Choose the branch you want to live in, not the one you are in."

  **2. The Addiction Hook (Your Personal Stake)**
  *   *Say:* "I quit drinking nine months ago. Every evening, I face a Round 2 Tails branch. The evidence is: 'I am tired. One drink would help. No one will know.' That is free, true evidence."
  *   *The Trap:* "If I condition on that evidence, the rational choice is to drink. But if I condition on that evidence, I invalidate the policy that keeps me sober. The 'Policy' view isn't about ignoring evidence; it's about refusing to let the evidence *re-open a closed decision procedure*."
  *   *Distinction:* "It is not 'ignoring evidence' (like Round 1 Red signal). It is 'refusing to re-calculate the policy' (like Round 2 Tails branch)."

  **3. The Mid-Game Offer**
  *   *Ask:* "Was the offer to Void a fair offer?"
  *   *Point:* "A CDT agent says: 'Yes, I'm here, I should minimize loss.' A Policy agent says: 'The offer itself is a trap. Evaluating the offer requires me to have already failed.'"
  *   *Takeaway:* "The offer pushes the problem back one step. It asks you to make a decision *about* your decision procedure. If you can be bribed to change your procedure mid-stream, you never had the procedure."

  ---

  ### Part 4: Predictable Failures & Objections

  **1. The Economist's Objection: "The Predictor is Impossible."**
  *   *What they'll say:* "The Heads payout depended on what I *would have done* in Tails. That requires a predictor. In the real world, the money is already gone. You're simulating magic."
  *   *Your Response:* "You are right. In this game, I (the facilitator) acted as the predictor by enforcing the Raffle Ban. In the real theoretical problem (Newcomb/Parfit), the correlation is **logical**, not physical. It's not that I *know* what you'll do; it's that your decision *is* the same computation in both branches. This game simulates the *incentive structure* of that logical link using a physical enforcement rule."
  *   *Mitigation:* Acknowledge this explicitly in the Plenary. "The game uses a physical penalty (Raffle Ban) to stand in for a logical counterfactual. In reality, the 'penalty' is that you become the sort of person who gets mugged."

  **2. The CS Objection: "Just Hardcode It."**
  *   *What they'll say:* "This is just a precommitment device. Write a script that ignores the input."
  *   *Your Response:* "Exactly. UDT is 'hardcoding' the decision function. The hard part isn't the code; it's that *you are the computer*. You can't compile yourself. You have to run the code on wetware that feels the pain of the Tails branch."

  **3. The "Sort of Person" Objection:**
  *   *What they'll say:* "This isn't decision theory, it's virtue ethics. It's about being honest."
  *   *Your Response:* "Virtue ethics says 'Be honest because it's good.' Decision theory says 'Be honest because the version of you that gets the Heads reward is the one who pays on Tails.' It's instrumental, not moral."

  ---

  ### Part 5: The Limitation (What You Must Say Out Loud)

  You identified this yourself: **Logical vs. Physical Counterfactuals.**

  In the real Counterfactual Mugging, the predictor knows what you do in Tails *before* the coin flips, because your decision algorithm is constant. In this game, the Tails players can Void without technically affecting the Heads players' money (unless you enforce the Raffle Ban).

  **Script for the Plenary:**
  > "I need to be honest about the mechanics. In a true Updateless Decision problem, the link between the Tails choice and the Heads reward is **logical**. It exists because you are the same agent in both branches.
  >
  > In this room, that link is **physical**. I enforced it with the Raffle Ban rule. If I hadn't, the Tails group could have Voided, saved their tickets, and the Heads group would still have won.
  >
  > Why did I do it this way? Because I can't simulate logical counterfactuals with paper and coins. I had to make the 'logical link' into a 'rule' so you could feel the pressure.
  >
  > **The takeaway:** In your life, there is no Facilitator enforcing the rule. The 'enforcement' is that if you break the policy in the Tails branch (the craving), you *are* the person who doesn't get the Heads reward (the sobriety). The counterfactual isn't magic; it's identity."

  ### Why This Works for Your Group
  *   **Philosophers** get the normative tension (Updatelessness).
  *   **CS** get the algorithmic tension (Function vs. Input).
  *   **Economist** gets to object to the predictor (which validates their expertise while you explain why it's a simulation).
  *   **You** get to share your stake without making it about *you*, but about the *structure of the choice*.

  This activity forces them to feel the "Squeeze" of the Tails branch. When they calculate the EV on the napkin and see that Pre-Commitment wins Ex-Ante, but Voiding wins Ex-Post, they will understand exactly why re-opening the decision is the enemy.
