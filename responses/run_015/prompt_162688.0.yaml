prompt: |-
  I'm in the final year of a psychology degree and taking a module on evidence and replication. One of the popular books on bad science that we were pointed to summarises the situation roughly like this:

  "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated. The mechanism is p-hacking. A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive; add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still. The remedy is to go Bayesian. Bayes' theorem gives you the probability that the hypothesis is true given the data, and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate. Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong. Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."

  On the strength of arguments like this, our seminar leader wants our group project to pre-register its analysis, report default Bayes factors and credible intervals instead of p-values and confidence intervals, and treat any Bayes factor below three as inconclusive. I find the Lindley point genuinely persuasive, and "the probability that the hypothesis is true given the data" and the one-in-twenty line both strike me as too neat — but I can't tell whether that is a real worry or just my own suspicion, and I don't want to object unfairly.

  Could you audit the passage for me: which sentences a statistician would accept, which are standard simplifications, and which are misrepresentations or overstatements? In particular, is a default Bayes factor really insensitive to the stopping rule and to the choice of prior, does the Lindley argument really show that the p-value is the one in the wrong, and does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Final year psychology student, module on evidence and replication.
      *   **Task:** Audit a specific passage summarizing the replication crisis and the Bayesian solution.
      *   **Goal:** Identify which sentences are accurate, which are simplifications, and which are misrepresentations/overstatements.
      *   **Specific Questions to Address:**
          *   Is a default Bayes factor insensitive to stopping rules and prior choice?
          *   Does Lindley's paradox prove p-values are wrong?
          *   Does the seminar leader's policy follow from the corrected summary?
      *   **Tone:** Academic, nuanced, critical but fair (avoiding "unfair objection"), suitable for a final-year student.

  2.  **Deconstruct the Passage (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "Psychology's replication crisis showed that most of the published literature is false: when the Reproducibility Project repeated a large sample of published studies, fewer than half of them replicated."
          *   *Status:* Overstatement/Simplification.
          *   *Nuance:* Open Science Collaboration (2015) found ~36-47% replication rates depending on metrics. "Most... are false" is too strong. Replication failure $\neq$ original false (could be context, power, etc.).

      *   *Sentence 2:* "The mechanism is p-hacking."
          *   *Status:* Overstatement.
          *   *Nuance:* P-hacking is *a* mechanism, but not the *only* one. Publication bias, low power, HARKing, measurement error, context sensitivity all play roles.

      *   *Sentence 3:* "A result counts as significant when its p-value falls below 0.05, and a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive..."
          *   *Status:* Misrepresentation (The Base Rate Fallacy).
          *   *Nuance:* This confuses $P(D|H_0)$ with $P(H_0|D)$. The false discovery rate (FDR) depends heavily on the prior probability of the hypothesis being true. If most hypotheses are false, FDR is high. If most are true, FDR is low. It's not fixed at 5%.

      *   *Sentence 4:* "...add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still."
          *   *Status:* Accurate.
          *   *Nuance:* Low power + publication bias does inflate FDR significantly (Ioannidis, 2005).

      *   *Sentence 5:* "The remedy is to go Bayesian."
          *   *Status:* Opinion/Overstatement.
          *   *Nuance:* Bayesian methods help, but aren't a magic bullet. Frequentist reforms (pre-registration, larger N) also help.

      *   *Sentence 6:* "Bayes' theorem gives you the probability that the hypothesis is true given the data..."
          *   *Status:* Simplification/Technically True but Context-Dependent.
          *   *Nuance:* It gives $P(H|D)$ *given a specific prior*. It's not an absolute truth without the prior.

      *   *Sentence 7:* "...and unlike a p-value it does not depend on the analyses you could have run but didn't report, so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate."
          *   *Status:* Mixed.
          *   *Nuance:* BF *is* immune to stopping rules (Likelihood Principle). However, "objective measure" is controversial (prior choice matters). "No amount of optional stopping can inflate" is technically true for the BF value itself, *but* optional stopping can still bias the *interpretation* or lead to misleading BFs if the prior is misspecified or if one peeks and stops only when BF > 3 (though strictly speaking, the BF remains valid evidence, the decision rule changes error rates). Actually, Rouder (2014) argues optional stopping is fine for BFs, but this is debated. The claim of "objectivity" regarding the Cauchy prior is the weak point.

      *   *Sentence 8:* "Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong."
          *   *Status:* Misrepresentation/Overstatement.
          *   *Nuance:* Lindley's paradox shows divergence, not necessarily that p-values are "wrong." It highlights that p-values answer a different question ($P(D|H_0)$) than BFs ($P(H_1|D)$ relative to $P(H_0|D)$). With large N, tiny effects become significant (p) but might favor null (BF). It's about interpretation, not truth.

      *   *Sentence 9:* "Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."
          *   *Status:* Counterfactual Speculation/Overstatement.
          *   *Nuance:* Unprovable. Bad priors or misuse of BFs could still lead to crises. Structural incentives (publish or perish) matter more than the statistic used.

  3.  **Address Specific User Questions:**

      *   *Default BF sensitivity:* Insensitive to stopping rule (mostly), sensitive to prior choice (highly). The "Cauchy(0,1)" is a convention, not a law of nature.
      *   *Lindley's Paradox:* Does not prove p-values are wrong. It proves they measure different things. In large samples, p-values detect trivial effects; BFs penalize complexity.
      *   *Seminar Leader's Policy:* Pre-registration is good. Reporting BFs is fine. Treating BF < 3 as inconclusive is a convention (Jeffreys), but not a hard truth. Replacing CIs with Credible Intervals is fine but they mean different things. The policy is *reasonable* but based on *oversold* premises.

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the student's critical thinking. Validate that their suspicions are well-founded.
      *   **Section 1: Sentence-by-Sentence Audit.** Break down the text into claims and label them (Accurate, Simplification, Misrepresentation).
          *   *Focus:* The "1 in 20" claim (Base Rate Fallacy), the "Objective Prior" claim, the "Lindley" claim.
      *   **Section 2: Addressing the Specific Technical Questions.**
          *   *Stopping Rules:* Explain Likelihood Principle vs. Error Rates.
          *   *Priors:* Explain that "default" $\neq$ "objective."
          *   *Lindley:* Explain the divergence of questions, not truth.
      *   **Section 3: Evaluating the Seminar Leader's Policy.**
          *   Pre-registration: Good (independent of Bayes).
          *   Bayes Factors: Good tool, but not a panacea.
          *   BF < 3 rule: Heuristic, not law.
          *   Conclusion on Policy: It's a *safe* policy for a student project, even if the theoretical justification in the book is hyped.
      *   **Conclusion:** Encourage the student. The replication crisis is real, but the Bayesian solution is nuanced.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about the "optional stopping" claim. While BFs obey the Likelihood Principle, *decision making* based on BFs with optional stopping *does* affect error rates if you treat BF > 3 as a hard threshold. I should clarify that distinction.
      *   *Correction:* On the "1 in 20" claim. This is the classic $P(D|H_0)$ vs $P(H_0|D)$ confusion. I need to explain *why* it's wrong (Base Rate).
      *   *Tone Check:* Ensure I don't sound like I'm attacking the seminar leader, but rather empowering the student to understand the *limitations* of the tools they are being asked to use.
      *   *Reference Check:* Mention Ioannidis (2005), Open Science Collaboration (2015), Wagenmakers et al. (2018) vs. critics (e.g., Gelman, Morey).

  6.  **Final Polish:** Organize with clear headings. Ensure the distinction between "frequentist properties" and "Bayesian coherence" is clear. (Proceed to generate output based on this structure.)

      *   *Key Insight to emphasize:* The book passage is a "manifesto," not a textbook. It argues for a paradigm shift, so it naturally oversells the benefits and undersells the costs/limitations.

  7.  **Final Review against constraints:**
      *   Audit the passage? Yes.
      *   Which sentences accepted/simplified/misrepresented? Yes.
      *   Address stopping rule/prior sensitivity? Yes.
      *   Address Lindley? Yes.
      *   Address seminar policy? Yes.

      *Let's write.*
answer: |-
  This is an excellent critical exercise. Your suspicions are well-founded: the passage you quoted reads less like a neutral statistical summary and more like a **manifesto**. It is likely drawn from the work of proponents of the "New Statistics" or the Bayesian reform movement (e.g., Wagenmakers et al.). While the core concerns about the replication crisis are valid, the proposed solution is presented with a level of certainty that most statisticians would consider overstated.

  Here is an audit of the passage, broken down by claim, followed by answers to your specific technical questions and an evaluation of your seminar leader's policy.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "Psychology's replication crisis showed that most of the published literature is false..."**
  *   **Verdict:** **Overstatement.**
  *   **Analysis:** The Open Science Collaboration (2015) found that roughly 36% to 47% of studies replicated (depending on the metric used). While this is alarmingly low, "most... are false" is a stronger claim than the data supports. A failure to replicate does not prove the original finding was false; it could indicate context sensitivity, measurement differences, or insufficient power in the *replication*.

  **2. "The mechanism is p-hacking."**
  *   **Verdict:** **Simplification.**
  *   **Analysis:** P-hacking (researcher degrees of freedom) is a major driver, but it is not the *sole* mechanism. Publication bias (the file drawer problem), low statistical power, HARKing (Hypothesizing After Results are Known), and genuine context-dependency of psychological effects all contribute.

  **3. "...a significance test comes out significant 5% of the time even when nothing is going on, so about one in twenty of the significant findings in the literature is a false positive..."**
  *   **Verdict:** **Misrepresentation (The Base Rate Fallacy).**
  *   **Analysis:** This is the most common misunderstanding of p-values. A p-value of 0.05 means that *if the null hypothesis is true*, there is a 5% chance of seeing data this extreme. It does **not** mean that 5% of significant results are false positives.
  *   **Why:** The False Discovery Rate (FDR) depends on the **prior probability** that the hypothesis was true to begin with. If you test 1,000 hypotheses where only 10 are actually true (a low base rate), even a 5% error rate on the 990 nulls will drown out the true positives. The FDR could be 50% or 90%, not 5%. The text conflates $P(Data | Null)$ with $P(Null | Data)$.

  **4. "...add publication bias and chronically underpowered samples and the false-discovery rate climbs far higher still."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This aligns with Ioannidis's (2005) famous paper "Why Most Published Research Findings Are False." Low power reduces the ability to detect true effects, while publication bias filters out null results, inflating the proportion of false positives in the published record.

  **5. "The remedy is to go Bayesian."**
  *   **Verdict:** **Opinion/Overstatement.**
  *   **Analysis:** Bayesian methods are *a* remedy, but not the *only* one. Many reformers advocate for frequentist reforms (e.g., lowering alpha to 0.005, increasing sample sizes, pre-registration) without switching to Bayesian inference.

  **6. "Bayes' theorem gives you the probability that the hypothesis is true given the data..."**
  *   **Verdict:** **Technically True, but Context-Dependent.**
  *   **Analysis:** It gives $P(H|D)$, but this probability is conditional on the **prior** you choose. It is not an objective property of the data alone; it is a combination of data and prior belief.

  **7. "...so a default Bayes factor, using the standard Cauchy prior on effect size, is an objective measure of evidence that no amount of optional stopping can inflate."**
  *   **Verdict:** **Mixed (True on stopping, False on objectivity).**
  *   **Analysis:**
      *   *Stopping Rule:* It is true that Bayes Factors (BF) obey the Likelihood Principle and are mathematically insensitive to the stopping rule (unlike p-values).
      *   *Objectivity:* The claim that the "standard Cauchy prior" makes it "objective" is controversial. The Cauchy(0, 1) is a convention, not a law of nature. If the true effect is tiny, this prior might be too wide; if the effect is large, it might be too narrow. Different "default" priors yield different BFs.

  **8. "Lindley's paradox settles the matter: p-values and Bayes factors can contradict each other, and whenever they do it is the p-value that is wrong."**
  *   **Verdict:** **Misrepresentation.**
  *   **Analysis:** Lindley's paradox shows that with large sample sizes, a p-value can be highly significant (e.g., $p < 0.001$) while the Bayes Factor strongly favors the null. This does not prove the p-value is "wrong." It proves they answer different questions. The p-value asks, "Is the effect distinguishable from zero?" The BF asks, "Is the null model a better predictor than the alternative model?" In large samples, trivial effects are distinguishable from zero (significant p) but are better described by zero (favorable BF to null).

  **9. "Had psychology been reporting default Bayes factors all along, the replication crisis would never have happened."**
  *   **Verdict:** **Counterfactual Speculation.**
  *   **Analysis:** This is unverifiable and likely false. If researchers had "p-hacked" their Bayes Factors (e.g., by peeking at data and stopping only when BF > 3, or by trying different priors until one worked), the crisis could still have occurred. The crisis is largely driven by incentives (publish or perish), not just the statistic used.

  ---

  ### Part 2: Addressing Your Specific Technical Questions

  #### 1. Is a default Bayes factor really insensitive to the stopping rule and to the choice of prior?
  *   **Stopping Rule:** **Yes, mostly.** Because the BF is a ratio of likelihoods, the intention to stop (or the actual stopping time) does not change the calculation of the evidence *in the data collected*. However, this assumes you report the BF honestly. If you engage in "optional stopping" (collect data, check BF, stop if BF > 3, otherwise collect more), you **do** inflate the rate of misleading evidence, even if the BF value itself is mathematically coherent. The *interpretation* of the BF as a decision rule becomes compromised.
  *   **Choice of Prior:** **No.** Default Bayes Factors are **highly sensitive** to the choice of prior. The "standard Cauchy" is a scale parameter. If you change the scale (e.g., Cauchy(0, 0.5) vs Cauchy(0, 1)), the BF can change substantially, especially in smaller samples. There is no such thing as a truly "objective" prior; there are only conventional ones.

  #### 2. Does the Lindley argument really show that the p-value is the one in the wrong?
  *   **No.** Lindley's paradox highlights a divergence in **philosophy**, not truth.
      *   **Frequentist (p-value):** Controls long-run error rates. It is designed to reject the null if the data is unlikely under the null, regardless of how likely the alternative is.
      *   **Bayesian (BF):** Compares predictive performance. It penalizes the alternative hypothesis for being vague (the "Ockham's razor" penalty).
      *   **Resolution:** In large samples, p-values detect trivial deviations from zero. BFs often favor the null in these cases because the alternative hypothesis (spread out over many possible effect sizes) predicts the data poorly compared to the precise null. Neither is "wrong"; they are optimizing for different goals.

  #### 3. Does the policy our seminar leader wants actually follow from the parts of the summary that survive correction?
  *   **Pre-registration:** **Yes.** This is robust advice regardless of the statistical framework. It prevents p-hacking and HARKing.
  *   **Report Default Bayes Factors:** **Acceptable, but with caveats.** It is a good pedagogical tool to force you to think about evidence rather than binary decisions. However, you should not treat them as infallible.
  *   **Credible Intervals instead of Confidence Intervals:** **Acceptable.** Credible intervals are often more intuitive (e.g., "there is a 95% probability the parameter is in this range"). However, they depend on the prior, whereas Confidence Intervals depend on the sampling procedure.
  *   **Treat BF < 3 as inconclusive:** **Reasonable Heuristic.** This follows Jeffreys' scale of evidence. It discourages over-interpreting weak data. However, "inconclusive" is not the same as "no effect."

  **Verdict on Policy:** Your seminar leader's policy is **methodologically sound for a student project**, even if the *theoretical justification* provided in the book passage is oversold. Pre-registration and Bayesian analysis will protect you from many common pitfalls, provided you understand that BFs are not magic.

  ---

  ### Part 3: How to Handle This in Your Project

  You are in a delicate position: you need to pass the module, but you also want to maintain statistical integrity. You do not need to object "unfairly" to use the tools; you simply need to use them **critically**.

  Here is how you can satisfy the seminar leader while acknowledging the nuances you've identified:

  1.  **Adopt the Tools, Qualify the Claims:** Use the pre-registration, BFs, and credible intervals as requested. However, in your discussion section, explicitly state: *"We adopted default Bayes Factors with a Cauchy(0,1) prior as a conventional measure of evidence, acknowledging that different priors may yield different results."*
  2.  **Avoid the "Truth" Trap:** Do not write "The probability that the hypothesis is true is 95%." Instead, write "The data are X times more likely under the alternative hypothesis than the null, given our prior assumptions."
  3.  **Address Stopping Rules:** Since you are pre-registering, you likely won't be optional stopping. You can note in your limitations: *"While Bayes Factors are theoretically insensitive to stopping rules, we adhered to a fixed sample size to maintain compatibility with frequentist power analysis conventions."*
  4.  **Interpret BF < 3 Carefully:** If you get a BF of 2, do not say "There is no effect." Say "The evidence is anecdotal and insufficient to distinguish between the null and alternative models."

  ### Summary for your Seminar Group
  If you need to raise this in your group, you might say:
  > "The book passage makes a strong case for Bayesian methods, but some of the claims about 'objectivity' and Lindley's paradox are debated in the literature. I think we should follow the seminar leader's protocol because it's rigorous, but we should be careful in our write-up not to claim the Bayes Factor gives us an absolute 'truth' independent of our priors. We should frame it as evidence relative to our specific model assumptions."

  This approach demonstrates high-level critical thinking without undermining the course requirements. Your intuition that the "one-in-twenty" line and the "Lindley settles it" claim were too neat was correct; those are rhetorical devices, not statistical theorems.
