      *   *Word Count Check:* I need to aim for ~1,200 words. I should be dense but clear.
      *   *Tone:* Critical, analytical, constructive but pushing back hard.

      *   *Point 1: Independence of Claims (D, C, E, R).*
          *   Are they separable? (D) is ontological (change happened). (C) is phenomenological (people felt it). (E) is methodological (does the label explain?). (R) is sociological/performative (belief creates reality).
          *   Critique: (E) and (R) are dangerously close. If (R) says the label causes institutional change, that *is* an explanatory role (E). If (E) just means "explains cultural output," it's distinct. But if (E) means "explains historical outcomes," (R) subsumes it.
          *   Critique: (R) presupposes (C) in a weak sense? No, (R) explicitly says it works where (C) fails (later actors believe it, not contemporaries). But (R) requires *someone* to believe it. If no one believes it, it doesn't get ratified. So (R) depends on *some* contemporaneity, just shifted in time.
          *   Critique: (D) is the weakest link if (R) is strong. If (R) makes periods real regardless of (D), then (D) becomes irrelevant to the "reality" of the period, only relevant to the "cause" of the ratification.

      *   *Point 2: Watermark Test.*
          *   Validity: It measures stylistic drift, not necessarily historical discontinuity. Style changes for many reasons (fashion, technology) unrelated to epochal shifts.
          *   Fatal Flaw: It assumes stylistic change correlates with historical significance. A change in papermaking (as the author notes) is a material change, not necessarily a period change.
          *   Repair: Triangulation is necessary but might just prove "change happened," not "period boundary exists."

      *   *Point 3: Steelman the Inventionist.*
          *   Inventionist argument: Periodization is always a narrative tool. Even if institutions change (R), that proves the *label* had effects, not that the *period* corresponds to reality. The "reality" created is the institution, not the historical time block.
