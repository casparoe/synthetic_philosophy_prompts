answer: |-
  ### I. Map of Exposure: Defeaters and Concessions

  This map ranks threats to NII from fatal (requires abandoning the principle) to awkward (requires ad hoc qualification). It distinguishes between objections a defender must concede undermine the principle *if true*, and those a defender will reject as misconstruing the concept of intention.

  | Rank | Defeater Type | Specific Challenge | Defender's Concession? | Critic's Claim Only? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Fatal** | **Normative Rivalry** | **Resolute Choice / Reason-Creating Intention.** If intention itself generates a reason to follow through (Bratman/Holton), the premise "no reason at t2" is false. The intention *makes* the reason. | **Yes.** If intention is reason-creating, NII is false. NII presupposes reasons are independent of intentions. | No. This is the standard rival framework. |
  | **Fatal** | **Empirical** | **Stable Idle Intention.** An agent forms the intention at t1, retains it at t2, executes (or not), and explicitly denies any self-image or consistency reason, verified by controls. | **Yes.** NII claims such a state is impossible. Existence proves falsity. | No. Requires rigorous experimental design (see Section IV). |
  | **Fatal** | **Conceptual** | **The Volitional Gap.** Evidence that intention is a distinct mental state from belief/prediction (e.g., akratic intention). One can intend while believing one will not do it. | **Yes.** NII ties intention tightly to belief about action/reason. If they come apart, NII breaks. | No. Standard philosophy of action debate. |
  | **Awkward** | **Scope Limit** | **The Negative Toxin.** (See Section II). If NII applies to actions but not omissions, it is not a general principle of intention. | **Yes.** Defender must either expand NII (risking falsity) or admit it covers only positive planning. | No. Structural asymmetry in the theory. |
  | **Awkward** | **Metaphysical** | **The Graded Toxin.** (See Section II). If intention is categorical but belief is graded, the NII link is strained at the margins. | **Partial.** Defender concedes threshold issues but maintains the categorical core. | No. Precision problem, not falsification. |
  | **Minimal** | **Redescription** | **"Unnoticed Reason."** Claiming the agent always had a reason (e.g., integrity) they didn't articulate. | **No.** Defender treats this as conceptual truth, not evasion. | **Yes.** Critics call this unfalsifiable shielding. |

  ### II. Variant Analysis: Negative vs. Graded Toxin

  Both variants pressure the link between intention and belief, but they strain different joints.

  **1. The Negative Toxin (Symmetry Problem)**
  *   **The Pressure:** NII forbids intending to $\phi$ when you know you'll have no reason to $\phi$. In the Negative Toxin, you are paid to intend *not* to $\phi$ (refrain), knowing that at t2 you will have decisive reason to $\phi$ (drink) and no reason to refrain (money is already banked).
  *   **The Problem:** Inhibitory intentions (intending not to act) often feel cognitively different from executive intentions. One can "hold back" without a positive plan. If NII blocks the executive intention but allows the inhibitory intention, it fails as a unified account of agency.
  *   **Defender's Forced Move:** The defender must argue that intending *not* to $\phi$ still involves a belief that one will *not* $\phi$, which requires a reason to not-$\phi$. If the agent knows she will drink at t2, she cannot intend *now* not to drink.
  *   **Verdict:** **More Serious.** This variant exposes a potential asymmetry in the architecture of NII. If the defender concedes that one *can* intend to refrain without a future reason (perhaps via a different mechanism, like habit or inhibition), NII loses its claim to be a principle about *intention* per se, becoming a principle only about *positive planning*. It forces a fragmentation of the theory.

  **2. The Graded Toxin (Metaphysical Problem)**
  *   **The Pressure:** Payment scales with the *confidence* of the intention. NII ties intention to belief (you must believe you will $\phi$). Belief comes in degrees (credence). Does intention come in degrees?
  *   **The Problem:** Standard orthodoxy (Anscombe/Bratman) treats intention as categorical (all-or-nothing). If NII ties a categorical state (intention) to a graded state (belief/credence about reasons), it requires a threshold mechanism.
  *   **Defender's Forced Move:** The defender must posit a threshold of credence required for intention. Below the threshold, it's mere hope; above, it's intention. The "graded payment" then just measures proximity to the threshold.
  *   **Verdict:** **Less Serious.** This is a metaphysical tuning issue. The defender can absorb this by stipulating that the machine detects *plan-commitment*, which is categorical, correlated with high credence. It complicates the model but doesn't break the logic of NII.

  **Comparison:** The Negative Toxin is the sharper spear. It threatens the *scope* of NII (does it cover all intentions?). The Graded Toxin threatens only the *precision* of NII's underlying metaphysics.

  ### III. Distinctive Predictions: Risky vs. Restatement

  You proposed three predictions. Here is the separation of genuine risk from tautology.

  1.  **"Every apparent idle intention will turn out to be a case of uncertain self-prediction or of an unnoticed higher-order reason."**
      *   **Status:** **Restatement.** This is simply NII applied to data. It predicts nothing new; it asserts that any counterexample will be reinterpreted to fit the theory. It is not independently testable without the criteria in Section IV.
  2.  **"Demand for commitment devices should track an agent's forecast of her own future weakness rather than the size of the stakes."**
      *   **Status:** **Genuinely Risky.** Standard economic theory predicts commitment demand tracks the *cost of failure* (stakes). NII predicts it tracks the *probability of rationality failure* (forecast).
      *   **Test:** High stakes + High confidence in future rationality = Low demand for commitment (per NII). Low stakes + Low confidence = High demand. If subjects demand commitment purely based on stakes regardless of self-forecast, NII is pressured.
  3.  **"The sequential-decision-theoretic program... is unavailable in principle."**
      *   **Status:** **Genuinely Risky.** This predicts the failure of Resolute Choice models (McClennen). If a model is constructed where agents successfully bind themselves to plans they know they will later want to abandon *without* external enforcement, NII is falsified.
      *   **Test:** Successful resolute choice in experimental settings where self-image reasons are controlled for.

  ### IV. Empirical Defeaters: Standards of Evidence

  To move you (given your skepticism of "unnoticed reasons"), evidence must rule out the "self-image/integrity" escape route.

  **Required Measures:**
  1.  **Behavioral:** Execution of the t2 act (drinking) despite t1 intention (verified).
  2.  **Physiological:** At t1, measures showing preparation for *not* drinking (e.g., motor inhibition markers) that vanish at t2. This proves the t1 state wasn't just a lie.
  3.  **WTP for Commitment:** Crucially, the agent must **refuse** to pay for a commitment device at t1.
      *   *Reasoning:* If they intend not to drink (per NII, they can't), they should pay to bind themselves. If they *don't* pay, yet *say* they intend not to drink, they are lying or self-deceived.
      *   *The Defeater:* If they **do not pay** for commitment, **report intention** not to drink, and then **drink** at t2, *and* this occurs in a condition where "being the sort of person who follows through" has zero value (e.g., total anonymity, no memory of t1 self at t2), NII is in trouble.
  4.  **Self-Report Weight:** **Low.** Self-report of intention is notoriously confabulated. It counts only if backed by the WTP and physiological data. The disagreement is often verbal (what counts as "intention"), so behavioral commitment (WTP) is the arbiter.

  **The "Unnoticed Reason" Control:**
  To satisfy your constraint, the experiment must neutralize *integrity* reasons.
  *   **Condition:** The agent is told their t1 and t2 selves will be psychologically disconnected (e.g., memory wipe between t1 and t2, or different identities).
  *   **Result:** If they still form the intention under these conditions, the "unnoticed reason" of integrity is removed. If NII holds, intention should vanish. If intention persists, NII fails.

  ### V. Insulation and Falsifiability

  **The Escape Routes:**
  1.  **"Not Real Intention":** Redefining the mental state as "wish" or "hope."
  2.  **"Unnoticed Reason":** Positing a reason (consistency, self-trust) the agent denies having.

  **Is NII Unfalsifiable?**
  *   **Empirically:** Yes, *if* the "unnoticed reason" move is allowed without limit. If every counterexample is explained by a reason the agent is unaware of, NII is insulated from data.
  *   **Conceptually:** No. NII makes a claim about the *structure* of intention.

  **Conceptual vs. Empirical Defeaters:**
  *   **Empirical Defeater:** Requires the controlled study above (Anonymity + No WTP + Intention Report + Action).
  *   **Conceptual Defeater:** **Has been produced.** Proponents of Resolute Choice (e.g., Edward McClennen, Richard Holton) argue that intention *is* a capacity to resist reconsideration. On this view, the definition of intention *includes* the ability to intend without a current reason to follow through, provided the intention was rationally formed earlier.
      *   *Why this counts:* This is not an empirical claim about what people *do*, but a philosophical claim about what intention *is*. If Holton is right that "resolution" is a distinct, rational mental state, NII is conceptually false, regardless of empirical data. It defines intention differently.

  **For You:** Since you are "least movable by the suggestion that she might have a reason she does not know about," the **Conceptual Defeater** is your strongest lever. You do not need to prove the agent *had* no reason; you need to prove that the *concept* of intention does not require one. The Resolute Choice literature provides this: it argues that rationality permits (and requires) intentions that are robust against future reason-changes.

  ### VI. Honest Verdict

  **NII is highly exposed.**

  1.  **Theoretical Exposure:** It stands directly against the Resolute Choice/Planning Agency framework. If intention is viewed as a tool for *stabilizing* action against future reason-fluctuations (Bratman/Holton), NII is not just false; it describes the problem intention is meant to *solve*. This is a fatal conceptual rival.
  2.  **Empirical Exposure:** It relies on the "unnoticed reason" shield to survive ordinary counterexamples. For a skeptic of hidden reasons, this makes NII look like a protected belt rather than a theory. The "Negative Toxin" variant exposes a likely inconsistency in how NII treats action vs. omission.
  3.  **The "Graded" Issue:** This is manageable but highlights that NII relies on a specific, perhaps outdated, cognitivist metaphysics of intention (intention = belief + desire).

  **Conclusion:** NII is a robust principle *only if* you accept a strict cognitivist view of intention (intention entails belief of action) and reject reason-creating intentions. If you allow that intentions can be volitional commitments distinct from predictions, or that they generate their own reasons, NII collapses. Given your stated skepticism regarding "unnoticed reasons," NII offers you very little purchase; it survives primarily by redescribing counterexamples in ways you find unmoving. The **Resolute Choice** objection is the fatal wound; the **Negative Toxin** is the infection that prevents it from healing.
