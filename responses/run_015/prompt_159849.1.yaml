answer: |-
  This is a fantastic angle. You are not forcing the distinction; you have actually put your finger on a specific vulnerability in social ontology that *It's a Wonderful Life* dramatizes better than most philosophy textbooks.

  Here is a breakdown of how to frame this for your group, validating your concepts, locating money on that spectrum, and pinpointing the moments that keep the discussion from becoming a dry lecture on John Searle.

  ### 1. The "Run-able Kind" Distinction
  Your distinction is robust. In social ontology, we often talk about **institutional facts** (money, borders, marriages) vs. **brute facts** (mountains, atoms). But your distinction cuts deeper, inside the category of institutional facts.

  *   **Diffuse/Habitual Kinds (Race/Gender):** These rely on what Bourdieu called *habitus*. The "uptake" is embodied, historical, and enforced by structural violence or deep-seated cultural norms. You cannot "run" on gender. If a crowd panics in a lobby, the category "woman" or "Black" does not cease to function as a social classifier. The recognition is too diffuse and too coercive to be withdrawn simultaneously.
  *   **Run-able Kinds (Money/Currency/Banking):** These rely on **synchronous collective intentionality**. They require a high-frequency, real-time agreement that "this token counts as value." Because the agreement must be continuous and simultaneous, it is vulnerable to a coordination failure. If everyone demands conversion to a "brute fact" (gold/cash) at once, the kind collapses.

  **Where money sits:** Money is the paradigmatic "run-able kind." It is a social technology that functions only as long as the latency between *belief* and *action* remains stable. A bank run is the moment the latency disappears; everyone acts on their doubt simultaneously, and the social kind dissolves into paper and metal.

  ### 2. Acceptance Infrastructure (Avoiding the "Cartoon")
  You are right to worry about flattening this into a cartoon of "status functions" (i.e., *X counts as Y in context C*). Pure status function theory can sound like magic: "We all agree it's money, so it is."

  The movie saves you from this by showing that agreement is not enough; you need **material anchors**. This is your "Acceptance Infrastructure."

  *   **The Theory Gap:** Abstract social ontology often ignores the *physics* of trust. It treats belief as a mental state.
  *   **The Movie's Insight:** Belief is a physical practice. You need ledgers, pens, slips of paper, safes, and phones. George cannot stop the run with a speech alone. He has to *do* things with objects.
  *   **The Building Fund:** Crucially, George stabilizes the "Bank Deposit" kind by cannibalizing the "Housing Fund" kind. He takes money earmarked for one social purpose (building homes) to prop up the social purpose of liquidity. This shows that social kinds aren't siloed; they are a web of material dependencies.

  **Is George's speech a Credit Theory of Money argument?**
  Yes, explicitly.
  *   **Potter (Commodity Theory):** To Potter, money is a thing to be hoarded. It has value in itself. He wants the bank to hold reserves (dead capital).
  *   **George (Credit Theory):** George argues that money is a **claim on future social production**. When he says, *"Your money's in Joe's house... and the Kennedy house, and Mrs. Macklin's house,"* he is articulating the Credit Theory of Money. Money is not a stock; it is a flow. It is a web of obligations between neighbors. Value exists in the *circulation*, not the vault.

  ### 3. What the Movie Shows That Theory Misses
  Standard theory often treats the "acceptance" of a social kind as rational or rule-based. The movie shows that the acceptance of money is **affective and relational**.

  *   **Panic is Contagious:** The run doesn't start because people did the math and realized the bank was insolvent. It starts because Mrs. Davis whispered to a neighbor. The "run-able kind" is vulnerable to *emotion*, not just logic.
  *   **Trust is Personal, Not Institutional:** The bank survives not because the *institution* of the Building & Loan is strong, but because *George* is strong. The social kind (the dollar) is anchored to George's reputation. If George leaves (as he contemplates), the kind collapses. This suggests that some social kinds are not institutional but **charismatic**.

  ### 4. Three Moments to Highlight
  To keep the discussion grounded in the film, point your group to these three specific beats. They map perfectly onto your philosophical framework.

  **Moment 1: The Safe Opening (The Material Anchor)**
  *   **The Scene:** George opens the safe to show there is *some* cash, but admits it isn't enough to cover everyone.
  *   **The Discussion Point:** This is the "Acceptance Infrastructure." If money were just a mental agreement, he wouldn't need to show the cash. But the crowd needs to *see* the physical token to begin the process of re-acceptance. However, notice that the cash *alone* doesn't stop the run. It requires the next step.
  *   **Question:** *Why isn't showing the cash enough? What does the cash do that the words don't?*

  **Moment 2: "The Money's Not Here" (The Credit Theory)**
  *   **The Scene:** George explains that their money is tied up in their neighbors' mortgages. He offers to write personal checks against his own insurance policy to guarantee them.
  *   **The Discussion Point:** This is the shift from Money-as-Thing to Money-as-Relation. George is asking them to accept a "promise" (a slip of paper) instead of "cash" (the brute fact). He is asking them to re-constitute the social kind of "Bank Deposit" from something redeemable *now* to something redeemable *later*.
  *   **Question:** *George asks them to trade a 'brute fact' (cash in hand) for an 'institutional fact' (a promise on paper). What makes them willing to make that trade?*

  **Moment 3: The Slips and the Phone (Performative Stabilization)**
  *   **The Scene:** George hands out slips of paper (temporary currency) and then takes the call from Uncle Billy regarding the telegrams (external validation).
  *   **The Discussion Point:** This is the "Run-able Kind" being stabilized through procedure. The slips act as a temporary ledger, slowing down the demand for cash. The phone call represents the **network**. The bank isn't just the lobby; it's the connection to the outside world. When the telegrams arrive allowing a 30-day extension, the "run" is legally and socially halted. The kind is saved by expanding the time horizon.
  *   **Question:** *The crisis is solved by delaying the 'acceptance' of the money's value (30 days). Does this prove that money is only stable as long as we agree to wait for it?*

  ### Summary for your Opening
  You can open the discussion by saying:
  *"We often think of money as a thing, but this scene shows it's a relationship. I want to look at how that relationship can break. Some social categories, like race, are too deep to break in a day. But money is a 'run-able kind'—it exists only as long as we all agree to keep playing the game simultaneously. Watch how George doesn't just talk people out of panic; he has to use cash, slips of paper, and phone calls to physically rebuild the reality of the bank."*

  This approach respects the philosophy but keeps the focus on the human drama, which is where Capra's genius lies.
