      *   **Topic:** "Expected Value Fanaticism" (Pascal's Mugging, infinite EV, tail risks).
      *   **Constraint 1:** Do not re-explain basics (assume familiarity with Pascal's Mugging, infinite EV, etc.).
      *   **Constraint 2:** Structure in two phases (Brainstorm -> Select/Rank).
      *   **Constraint 3:** Ranking criteria must use the distinction: (a) Epistemic, (b) Axiological, (c) Procedural/Normative.
      *   **Constraint 4:** For each ranked question, explain: Upstream-ness, Tractability for philosophers, Evidence/Argument to move it up/down.
      *   **Constraint 5:** Address the "Moral-Uncertainty Mugger" specifically (distinct vs. same pathology, impact on ranking).
      *   **Constraint 6:** Name 1-2 deprioritized questions and explain why.
      *   **Constraint 7:** No reading lists, no citations, no "further reading." Focus on defended prioritization and trade-offs.

  2.  **Phase 1: Brainstorming (Candidate Open Questions):**
      *   *Goal:* Cast a wide net, including non-obvious angles.
      *   *Ideas:*
          1.  Bounded utility functions (is this cheating?).
          2.  Probability thresholds (ignore $p < 10^{-X}$).
          3.  Epistemic humility regarding extreme probabilities (can we even *form* $10^{-100}$?).
          4.  The structure of value space (is it Archimedean?).
          5.  Moral uncertainty integration (how to aggregate normative theories without fanaticism).
          6.  Decision rules alternative to EV (GEV, quantiles, minimax regret).
          7.  The role of "credence" vs. "belief" in tails (imprecise probabilities).
          8.  Dynamic consistency vs. static fanaticism (does repeated play solve it?).
          9.  The definition of "outcome" (are states of the world fine-grained enough to support huge utilities?).
          10. The link between descriptive psychology and normative theory (do we reject EV because it feels wrong?).
          11. Infinite ethics (how does fanaticism relate to infinite populations?).
          12. The "St. Petersburg" variant with real-world constraints (physical limits on utility).
          13. Meta-normative uncertainty (uncertainty about which decision theory to use).
          14. The "cluelessness" problem (long-termism's empirical uncertainty feeding fanaticism).
          15. Formalizing "absurdity" (is there a formal marker for when a recommendation is too costly to accept?).

  3.  **Phase 2: Selection and Ranking:**
      *   *Goal:* Pick 4-5 top questions, order them, apply the (a)/(b)/(c) framework, address upstream-ness/tractability/triggers.
      *   *Selection Criteria:* Importance (solves the core problem), Upstream-ness (foundational), Tractability (philosophers can do it in 18 months), Neglectedness.
      *   *Draft Ranking:*
          1.  *Epistemic:* The coherence of extreme credences. (If we can't assign $10^{-100}$, the problem vanishes).
          2.  *Axiological:* Boundedness of Value. (If value is bounded, EV can't blow up).
          3.  *Procedural:* Alternative Decision Rules. (If EV is wrong, what replaces it?).
          4.  *Epistemic/Normative Hybrid:* Imprecise Probabilities in the Tails.
          5.  *Axiological:* Comparability of Extreme Outcomes.

      *   *Refining the Ranking for "Upstream-ness":*
          *   Axiological (Boundedness) seems most upstream. If value *cannot* exceed $V_{max}$, EV fanaticism is mathematically impossible regardless of probabilities or decision rules.
          *   Epistemic (Coherence of Tails) is next. If probabilities in the extreme tail are undefined or effectively zero due to epistemic limits, EV doesn't blow up even with unbounded value.
          *   Procedural (Alternative Rules) is downstream. You only need a new rule if the inputs (prob/value) allow fanaticism.
          *   Moral Uncertainty Mugger needs integration.

      *   *Revised Ranking:*
          1.  Axiological: The Boundedness of Value.
          2.  Epistemic: The Meaningfulness of Extreme Credences.
          3.  Procedural: Decision Rules under Deep Uncertainty.
          4.  Axiological/Normative: Moral Uncertainty Aggregation.

  4.  **Addressing the "Moral-Uncertainty Mugger":**
      *   *Analysis:* Is it distinct? Standard mugging exploits $P(Event) \times Value(Event)$. Moral mugger exploits $P(Theory) \times Value_{Theory}(Action)$.
      *   *Argument:* It's structurally identical but axiologically distinct. In standard mugging, the value is usually assumed fixed (e.g., lives saved), and probability is the lever. In moral mugging, the probability is of a *valuation scheme* that assigns infinite/boundedless weight.
      *   *Impact:* If it's the same pathology, solutions to standard mugging (bounded utility) solve it. If distinct (because normative uncertainty seems more "real" than physical miracles), it might require a specific procedural fix (e.g., normalization of theories).
      *   *Decision:* Treat it as a specific instance of the Axiological problem (unbounded value across theories) but highlight it in the ranking.

  5.  **Deprioritization:**
      *   *Candidates:* Infinite Ethics (too big, distinct from finite fanaticism), Descriptive Psychology (is-ought gap), Dynamic Consistency (assumes the static problem is solved).
      *   *Selection:* Infinite Ethics (too broad, confuses the finite mugging issue) and "Evolutionary Debunking of Fanaticism Intuitions" (doesn't solve the normative problem).

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, direct, philosophical, structured.
      *   *Check:* Did I cite anything? No. Did I explain Pascal's Mugging? No. Did I use the (a)/(b)/(c) tags? Yes.
      *   *Refining the "Upstream" argument:* Need to be careful. If value is unbounded, epistemic limits matter more. If probabilities are coherent, axiological limits matter more. I need to argue why one is *more* upstream.
      *   *Argument:* Axiological boundedness is the hard stop. Even with perfect probability, bounded value kills fanaticism. Epistemic limits are softer (maybe we *can* conceive of $10^{-100}$). So Axiological is #1.
      *   *Tractability:* Philosophers are good at conceptual analysis of value (Axiological) and probability coherence (Epistemic). They are less good at designing new decision rules (Procedural) without mathematical expertise, but 18 months of conceptual work on *why* EV fails is doable.

  7.  **Final Review against Constraints:**
      *   Two phases? Yes.
      *   4-5 ranked questions? Yes.
      *   (a)/(b)/(c) tags? Yes.
      *   Upstream/Tractability/Triggers for each? Yes.
      *   Moral-Uncertainty Mugger section? Yes.
      *   Deprioritized section? Yes.
      *   No citations? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Put Epistemic first because rationalists love probability.
      *   *Correction:* No, if utility is bounded, probability doesn't matter. Boundedness is the stronger constraint. Put Axiological first.
      *   *Initial thought:* Treat Moral Uncertainty as a separate top-5 item.
      *   *Correction:* It might crowd out the fundamental questions. Better to address it in the specific section and perhaps as a sub-component of the Axiological ranking, or as the 5th item if it's distinct enough. Let's make it the 4th item because it's a specific application of the axiological problem that is highly relevant to effective altruism/rationalist circles.
      *   *Check on "No Empirical Budget":* Ensure the questions don't require running experiments or simulations. They must be conceptual/formal.

  9.  **Final Polish:** Ensure the distinction between "Epistemic" (probabilities), "Axiological" (values), and "Procedural" (rules) is sharp in the ranking explanations. Make sure the "Moral-Uncertainty Mugger" section explicitly answers "distinct or same" and "does ranking change."

  *(Self-Correction on Moral Uncertainty)*: I need to be careful. If I say it's the same pathology, does that change the ranking? If it's the same, solving standard fanaticism solves moral fanaticism. If distinct, we need a specific agenda item. I will argue it is *structurally* the same but *axiologically* distinct in a way that makes it harder to solve via boundedness (because normative theories claim objective weight). This nuance is important.

