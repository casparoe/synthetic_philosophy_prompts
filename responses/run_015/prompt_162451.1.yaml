  # PREP SHEET: INTERRUPTIVE TRIAGE & COLOR PHI
  **Seminar:** Joint Consciousness & Vision | **Time:** 30m Q&A | **Stakes:** High

  ## I. STRATEGIC OPENING (The First Two Minutes)
  *Before taking questions, frame the dialectic to absorb the initial shock.*

  **Concede Immediately:**
  1.  **Dennett's General Point:** Acknowledge that for *standard* protocols (unspeeded verbal report alone), Dennett is right: there is no empirical difference. You are not claiming to refute Multiple Drafts globally, only to show it is not *necessarily* empirically empty.
  2.  **Masking Complexity:** Acknowledge that masking is not a "pause button." It is interference. You are not claiming the mask freezes time, but that it selectively disrupts the *integration* process required for the revised content.
  3.  **Report Imperfection:** Concede that speeded choice is not a perfect readout of phenomenology. It is a proxy. Your claim is that it is a *better* proxy for early-stage content than unspeeded narrative report in this specific temporal window.

  **The One Claim You Cannot Give Up:**
  *   **"Differential Availability implies Differential Content."**
      If the system can report Content A (unrevised) at $t_1$ under pressure, and Content B (revised) at $t_2$ without pressure, then Content A was available at $t_1$. If Content A was available, the revision had not yet occurred. Therefore, the revision is temporally locatable relative to availability. If you concede that reportability does not track availability, the experiment becomes a study of response bias, not consciousness.

  ---

  ## II. THE OBJECTIONS (Ordered by Damage)

  ### 1. The "Response vs. Experience" Objection (Multiple Drafts Theorist)
  **Voice:** "You've built a clever response paradigm, but you're conflating *availability to a motor system* with *phenomenal consciousness*. Just because a subject can hit a button for 'Red' at 200ms doesn't mean they *saw* red. It means the 'Red' node was active enough to trigger a keypress. You haven't pierced the Cartesian Theater; you've just measured the latency of the 'Red' draft winning the competition for speech."
  **The Reply (2 min):** "I grant that report is not identical to phenomenology. But my operational definition of 'conscious' here is 'available for deliberate report.' If Dennett argues that *no* probe can distinguish the drafts, I only need to show that *one* probe yields different content at different times. If the 'Red' draft wins the race for speech at $t_1$, and the 'Phi' draft wins at $t_2$, then the content of the winning draft changed. Whether that winning draft *is* consciousness or just *reports* it, the revision happened between $t_1$ and $t_2$. The distinction is empirically decidable relative to reportability."
  **Soft Spot:** You are relying on the Access = Phenomenology bridge. If they deny that access tracks phenomenology even transiently, you have no leverage.

  ### 2. The "Masking Mechanism" Objection (Masking Psychophysicist)
  **Voice:** "You're treating the mask as a temporal curtain, but metacontrast works via channel interference. A high-contrast pattern along the path doesn't 'interrupt consciousness'; it suppresses the motion-energy detectors in V1/V2 that would signal the trajectory. If you kill the motion signal, of course they report 'Red' or 'Green'. You haven't uncovered an earlier unrevised state; you've just destroyed the data required for the revision. You're comparing 'Motion + Mask' to 'Motion No Mask', not 'Revised' to 'Unrevised'."
  **The Reply (2 min):** "That's precisely the control I'm running. If the mask simply destroyed the motion signal, the speeded choice would be random or 'No Motion'. But I'm looking for a specific band where they report 'Red' or 'Green' (the *constituents* of the Phi) systematically. This suggests the flash information survived, but the *integration* mechanism was blocked. The mask isn't erasing the input; it's preventing the spatiotemporal interpolation. That prevention window *is* the revision window."
  **Soft Spot:** If the mask suppresses the *memory* of the first flash rather than the integration of the second, your timeline collapses. You need to ensure the first flash is robustly encoded before the mask hits.

  ### 3. The "Parameter Sweep" Objection (The Dreaded One)
  **Voice:** "Okay, suppose you find this window. Change the ISI by 10ms, or the eccentricity by 2 degrees, and the window shifts or vanishes. You haven't solved the metaphysical question of whether revision is Orwellian or Stalinesque; you've just shown that the latency of integration is parameter-dependent. You've traded one empty metaphysical question for an endless psychophysical calibration. What does this tell us about consciousness *per se*, rather than just the timing of this specific circuit?"
  **The Reply (2 min):** "I am not claiming to solve Color Phi for all possible parameters. I am claiming to show that the question is *locally decidable*. Dennett's claim is that the distinction is *in principle* empty. If I show it is empirically decidable in *one* stable regime, the 'in principle' claim fails. The fact that latencies vary with eccentricity is a feature, not a bug—it shows we are tracking a physical process, not a metaphysical ghost. Local decidability is enough to reopen the philosophical debate."
  **Soft Spot:** This is your weakest philosophical ground. If the result is too fragile, critics will say it's an artifact of the setup, not a general feature of consciousness.

  ### 4. The "Decision Evidence" Objection (No-Report/Metacognition)
  **Voice:** "A speeded 3AFC is still a report. It indexes decision evidence accumulation, not phenomenal experience. You might be measuring the point at which the decision criterion shifts, not when the experience changes. The 'unrevised' content might never have been conscious; it was just sub-personal evidence that was accessible to a forced-choice system but not to phenomenology. You're measuring Type 2 performance, not Type 1 experience."
  **The Reply (2 min):** "This is the standard no-report critique. But if sub-personal evidence can drive a deliberate, speeded choice between 'Red', 'Green', and 'Phi', it is functionally indistinguishable from conscious access for my purposes. If the subject can *use* that information to guide action under deadline, it is 'conscious enough' to count against the claim that *nothing* was experienced as unrevised. I am lowering the bar for what counts as a 'draft', not raising it."
  **Soft Spot:** Hardline no-report proponents will never accept forced choice as a proxy for phenomenology. You must stand firm on "Access is our only grip."

  ### 5. The "No Unrevised Content" Objection (Vision Scientist)
  **Voice:** "You're assuming the system sees two flashes and *then* builds motion. But in apparent motion, the motion signal might be constructed feedforward, simultaneously with the color. There may never be a stage where 'two stationary spots' is the content. The 'unrevised' state you're probing might be a fiction. The system doesn't revise; it constructs. You're looking for a 'before' that never existed."
  **The Reply (2 min):** "If the system constructs motion feedforward, then the 'Red' or 'Green' response in the speeded task shouldn't exist—they should always see motion. The fact that the mask can force a 'Red' or 'Green' report suggests that the motion construction is vulnerable to interruption *after* the color encoding but *before* the motion integration. That vulnerability window implies a sequential process, not a simultaneous construction."
  **Soft Spot:** Some models of apparent motion suggest very early integration (V1). If the integration is that early, your mask might be too late to catch the "before" state.

  ### 6. The "Memory Overwrite" Objection (Neuroscientist)
  **Voice:** "Episodic memory consolidation doesn't happen on a 100ms timescale. You're talking about overwriting a memory trace in the time it takes a signal to cross the corpus callosum. If you find a dissociation, it looks like a paradox. It's more likely your speeded task is tapping working memory buffers and your unspeeded task is tapping episodic reconstruction. You're comparing two different memory systems, not two stages of consciousness."
  **The Reply (2 min):** "Agreed, this isn't long-term episodic memory. It's iconic memory or visual working memory. The 'overwrite' is the displacement of the iconic trace by the integrated motion percept. I'm not claiming the hippocampus is rewriting history; I'm claiming the visual buffer is updating its dominant representation. The timescale fits iconic persistence, not episodic consolidation."
  **Soft Spot:** You need to be careful not to overstate the "memory" aspect. Stick to "visual representation."

  ### 7. The "Criterion Shift" Objection (Psychophysicist/Philosopher Hybrid)
  **Voice:** "Why think the speeded deadline forces 'unrevised' content? Maybe it just forces a lower criterion for confidence. Under pressure, subjects guess 'Red' because it's simpler than 'Phi'. You haven't isolated an earlier time; you've isolated a lazier decision strategy. The content was always 'Phi', but they defaulted to 'Red' to beat the buzzer."
  **The Reply (2 min):** "That's why I have the unspeeded report on the same trials. If it were just laziness, the unspeeded report should also drift toward 'Red' when the mask is present. But the dissociation is specific to the *timing* of the mask relative to the deadline. If the mask at 50ms yields 'Red' and mask at 150ms yields 'Phi', strategy doesn't explain the temporal gradient. The mask is doing the work, not the laziness."
  **Soft Spot:** If subjects learn that 'Red' is safer under deadline, you have a training artifact. You need to ensure the 'Red' response isn't just the path of least resistance.

  ### 8. The "Homunculus" Objection (Classic Dennettian)
  **Voice:** "You say the content was available at $t_1$. Available to whom? If there's no little man inside reading the draft, 'availability' is just a metaphor for causal potency. You've shown the causal potency of the 'Red' signal decays over time. Why dress that up as a question about 'when the experience happened'?"
  **The Reply (2 min):** "Because 'when the experience happened' just *means* 'when the content became causally potent for report'. If we strip away the Cartesian Theater, we are left with functional roles. I am identifying the functional role of 'conscious experience' with 'availability for report'. If that availability shifts, the experience shifts. I'm not positing a homunculus; I'm positing a functional transition."
  **Soft Spot:** This is a definitional stalemate. If they deny functionalism, you can't move them. Assume functionalism for the room.

  ---

  ## III. THE WEAKEST JOINT (Prepare to Defend)
  **The Link Between Speed and Time.**
  Your argument hinges on the assumption that **Speeded Choice = Earlier Processing Stage**.
  *   **The Risk:** A critic could argue that speeded choice isn't *earlier*, it's just *noisier*. If it's just noisier, the shift to "Red/Green" might be regression to the mean or bias, not a snapshot of an earlier unrevised state.
  *   **The Defense:** You need to emphasize the **Mask Interaction**. It's not just speed; it's Speed + Mask Timing. If speed alone caused the shift, the mask delay wouldn't matter. The fact that the *mask delay* modulates the speeded response proves you are interrupting a time-sensitive process, not just forcing a hasty guess.
  *   **Prep:** Have the interaction plot ready in your head. "If it were just speed bias, the mask SOA wouldn't matter. But the psychometric function shifts with SOA. That confirms we are slicing time, not just lowering standards."

  ---

  ## IV. THE DREADED OBJECTION (Parameter Dependence)
  *See Objection #3 above.*
  **Why it haunts you:** It turns your "Local Decidability" win into a "It depends" shrug.
  **How to own it:** Don't fight the dependence. Embrace it.
  *   **Line to use:** "Consciousness is a biological process. Biological processes have latencies that depend on contrast, eccentricity, and attention. If the 'Orwellian vs. Stalinesque' question is to be empirical, it *must* be parameter-dependent. A result that didn't depend on parameters would be magic, not science. I am offering a method to measure the latency of revision, not a universal constant."

  ---

  ## V. FINAL REMINDER
  **You are not trying to prove Dennett wrong about everything.** You are trying to prove him wrong about **empirical emptiness**.
  *   If they say: "You haven't proven it's consciousness."
  *   You say: "I've proven the *distinction* isn't empty. That's enough for today."
  *   If they say: "It only works at 12 degrees eccentricity."
  *   You say: "Then we know where to look next. But the door is open."

  **Breathe. You have the data logic. Don't let them bully you into metaphysical concessions you don't need.**
