answer: |-
  You are not being inconsistent, and you are not just being "risk-averse" in the emotional sense. You are intuitively grasping a fundamental mathematical principle that your friend is overlooking: the difference between **maximizing Expected Value (EV)** on a single bet versus **maximizing Geometric Growth** over a series of bets.

  Your friend is arguing for the **Arithmetic Mean** (average outcome of one bet). You are arguing for the **Geometric Mean** (compound growth rate over time).

  Here is the breakdown of why your gut is mathematically correct, specifically regarding the "don't blow up the bankroll" principle.

  ### 1. The Trap of "Expected Value" (Your Friend's Argument)
  Your friend is right about one thing: If you only ever make this bet *once* in your life, and your goal is to maximize the average dollar return, you should bet 100%.
  *   **Bet $400 at 70% chance:** Expected Value = $400 \times 0.70 = $280$ (profit expectation).
  *   **Bet $200 at 70% chance:** Expected Value = $200 \times 0.70 = $140$.

  Mathematically, the "All-In" move has the highest Expected Value. However, EV ignores the **consequence of ruin**. If you lose the 30% of the time you go all-in, your bankroll is $0. You cannot place any more bets. The game is over.

  ### 2. The Kelly Criterion (Your Argument)
  Since you mentioned you want the pool to "grow exponentially" over years, you are playing a **repeated game**. In repeated betting with an edge, the mathematically optimal strategy to maximize long-term wealth is known as the **Kelly Criterion**.

  The Kelly formula tells you exactly what fraction of your bankroll to wager to maximize growth without going bust. For a simple even-money bet, the formula is:
  $$f^* = 2p - 1$$
  *(Where $f^*$ is the fraction to bet, and $p$ is the probability of winning)*

  If you plug in your numbers:
  $$f^* = 2(0.70) - 1 = 0.40$$

  **The Kelly Criterion says you should bet 40% of your bankroll, not 100%.**

  Even with a massive 70% edge, optimal growth theory dictates you leave 60% of your money untouched. Why? Because volatility drags down compound returns. This is called **volatility drag**.

  **Example of Volatility Drag:**
  Imagine you have \$100 and you flip a coin that wins 60% of the time (a good edge).
  *   **Scenario A (All-In):** You bet \$100. You win (\$200). You bet \$200. You lose (\$0). **Result: Bust.**
  *   **Scenario B (Half-Bet):** You bet \$50.
      *   Win: Bankroll becomes \$150.
      *   Lose: Bankroll becomes \$50.
      *   If you win one and lose one (in any order), you have \$75.
      *   Wait, that looks like a loss? That's because 50% bet is too high for a 60% coin. But if you bet *Kelly optimal* (20%), a win/loss sequence leaves you with \$100.80. You grew your money despite breaking even on wins/losses.

  By betting less than 100%, you protect the capital needed to compound your winnings in future years.

  ### 3. Ergodicity: The Deep Principle
  There is a concept in probability called **Ergodicity**.
  *   **Ensemble Probability (Your Friend):** Imagine 100 people walk into a casino and each bets 100% of their money on your 70% team. 70 of them double their money, 30 go home with nothing. The *average* wealth of the group went up.
  *   **Time Probability (You):** Imagine *one* person walks into a casino every year for 100 years and bets 100% of their money on your 70% team. Eventually, they will hit the 30% loss scenario. When they do, they hit zero. They can't come back next year. Their *terminal* wealth is zero.

  Your friend is treating your group as 100 parallel universes. You are correctly treating your group as one timeline that needs to survive into the future. **In a non-ergodic system (where ruin is possible), the average outcome of the group does not apply to the individual over time.**

  ### 4. The Social Contract
  There is also a practical layer. You said, "if we do this every year."
  *   If you go all-in and lose, the pool is dead. The tradition ends.
  *   If you bet 40-50% and lose, you still have capital left. You can regroup, adjust, and play next year.

  The value of the pool isn't just the money; it's the continuity of the game with your buddies. "Risk of Ruin" isn't just financial; it's the risk of ending the tradition.

  ### How to Explain It to Them
  Don't get bogged down in formulas. Try this analogy:

  > "If we were making this bet one time and then dissolving the group forever, I'd agree with you. All-in maximizes the cash return on *this* bet.
  >
  > But we want to do this every year. In investing, there's a rule called **Volatility Drag**. If you bet 100% of your money, one bad beat wipes you out and you can't compound your winnings later. Even with a 70% edge, the math for long-term growth (the Kelly Criterion) says we should only bet about 40% of the pot.
  >
  > I'm not trying to be safe; I'm trying to make sure we're still playing this game in five years with a much bigger pot. Going all-in maximizes profit today; betting partial maximizes wealth over time."

  ### Verdict
  You are right. Your friend is optimizing for a **single-event maximum**, while you are optimizing for **long-term survival and growth**. In any repeated endeavor (investing, poker, fantasy pools), survival is the prerequisite for growth. You cannot compound zero dollars.

  **Recommendation:** Propose betting between 40% and 50% of the pot on the 70% favorite. This is mathematically defensible as the "optimal growth" strategy, splitting the difference between your friend's aggression and the other buddy's safety, but grounded in actual probability theory.
