      *Let's flesh out the "Killer Reply".* It needs to bridge the gap. "Preservation isn't freezing time, it's keeping the story alive."

      *Let's identify the Secret Fear.* It's that the strike organizers are "communists" or "radicals" in their eyes, and naming a street after them is worse than Whitmore.

  8.  **Final Review against constraints:** Casual tone? Yes. Ordered by likely/damaging? Yes. Specific vocab? Yes. Concessions? Yes.

