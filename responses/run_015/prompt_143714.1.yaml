answer: |-
  Your friend's summary captures the core deflationary intuition but erroneously conflates deflationism with anti-realism, treats contested explanatory objections as settled refutations, and imposes metaphysical arbitration duties on a semantic theory that most deflationists explicitly reject.

  I suspect four illegitimate moves are doing work here: conflating deflationism with global anti-realism or assertibility theory; treating the T-schema as an exhaustive definition rather than a constraint; presenting the explanatory objection as a decisive refutation rather than a live debate; and assuming truth must perform metaphysical arbitration rather than merely logical generalization.

  **Audit of the Summary**

  1.  *"Truth is not a genuine property of anything."* **Accurate.** This is the central metaphysical claim of deflationism (e.g., Horwich, Field); truth is not a robust, causal, or natural property.
  2.  *"Is true is a grammatical device, a way of endorsing a sentence..."* **Acceptable Simplification.** This captures the prosentence or disquotational function, though some deflationists (like Horwich) prefer to call it a logical property rather than merely grammatical to avoid sounding eliminativist.
  3.  *"Deflationists treat that biconditional as the definition of truth..."* **Acceptable Simplification.** Horwich treats the instances of the T-schema ("'p' is true iff p") as axioms, not necessarily a definition, but the effect is similar.
  4.  *"...once you have all its instances you have said everything there is to say about truth..."* **Accurate.** This is the claim of exhaustiveness; there is no hidden nature to uncover.
  5.  *"...truth is nothing over and above what speakers are disposed to assert..."* **Misrepresentation (Conflation).** This conflates deflationism with assertibility theory or verificationism. Deflationists insist truth can outstrip assertibility (a sentence can be true even if we cannot verify it); the T-schema does not reduce truth to warrant.
  6.  *"...deflationism quietly settles the old realism disputes... no fact of the matter..."* **Non Sequitur/Contested.** Deflationism is neutral on realism. One can be a deflationist about truth and a realist about the world (e.g., believing electrons exist independently of us). The inference that deflationism entails anti-realism is a common error, though some deflationists do argue for anti-realism on separate grounds.
  7.  *"Truth is what valid arguments preserve, and true belief is what explains why agents get what they want..."* **Contested.** Deflationists agree truth preserves validity (via logical generalization). They deny truth *itself* explains success; rather, the *content* of the belief explains success (e.g., I succeeded because I believed the water was there, and it was).
  8.  *"So the view was refuted a few decades ago and is now mostly of historical interest."* **False.** Deflationism is a dominant, live position in contemporary metaphysics and semantics.

  **Defender Replies**

  *   **On Assertibility:** A deflationist would reply that truth is distinct from warranted assertibility because the T-schema allows for true sentences we cannot currently assert (e.g., future contingents or undecidable mathematical claims). This is a **substantive correction**, not a quibble; it preserves the objective normativity of truth without making it a robust property.
  *   **On Realism:** A deflationist would reply that their theory concerns the *concept* of truth, not the *ontology* of the world. Denying truth is a robust property does not deny that tables or electrons exist. This is a **substantive correction**; the friend's inference is a category error.
  *   **On Explanation:** A deflationist would reply that truth explains logical validity (allowing us to say "Everything he said is true") but does not need to explain practical success causally. This is **contested**; some philosophers (e.g., Putnam, Boyd) insist truth must explain success robustly, while deflationists (e.g., Horwich, Field) argue this demands too much of a semantic concept.

  **Evaluation of Large Conclusions**

  *   **Anti-Realism Inference:** The conclusion that deflationism settles realism disputes in favor of anti-realism does **not follow**. It is a live research question whether deflationism is compatible with realism; the consensus among specialists is that they are compatible (confidence: high). Deflationism removes the metaphysical weight of *truth*, not the metaphysical weight of *reality*.
  *   **Explanatory-Work Objection:** This objection is **not decisive**. It rests on the premise that truth must explain success causally, which deflationists dispute. They argue that citing the truth of a belief is just a way of citing the content of the belief. Specialists are divided on whether deflationary explanation is sufficient (confidence: moderate); some argue deflationism fails here (e.g., Gupta), others that it succeeds (e.g., Horwich).

  **Bookkeeping vs. Arbitration Argument**

  *   **The Distinction:** This is a real distinction, often discussed as "internal vs. external" norms or "expressivist challenges" to truth. Your friend's "arbitration" job is essentially demanding that truth provide a metaphysical ground for disagreement between frameworks.
  *   **Deflationist Claim:** Deflationists claim truth does **bookkeeping** (logical generalization, endorsement). They deny truth must do **arbitration** in the metaphysical sense. For a deflationist, saying a rival is "wrong" just means asserting the negation of their claim (via the T-schema), not pointing to a metaphysical fact they missed.
  *   **Cost vs. Feature:** Failing to do metaphysical arbitration is a **feature** for deflationists, who view such arbitration as unintelligible. However, if one insists that genuine disagreement requires shared robust truth conditions, this is a **genuine cost**. The argument hinges on whether "disagreement" requires robust truth.
  *   **Framing Feature:** The work is done by the assumption that truth *must* solve deep metaphysical disagreement. If removed, the argument collapses into the claim that deflationists cannot say "you are false," which is plainly untrue (they can say "it is not the case that p").

  **Status of Deflationism**

  *   **Settled vs. Contested:** It is **settled** that deflationism is a live, major position, not a refuted relic. It is **contested** whether it can fully account for logical generalization without invoking properties, and whether it is compatible with all forms of realism.
  *   **Confidence:** I am highly confident (specialist consensus) that deflationism is live. I am moderately confident that the compatibility with realism is maintained by most deflationists, though some argue otherwise.
  *   **Verdict:** Deflationism is a **live position**, widely held among metaphysicians and semanticists (e.g., Horwich, Field, Leeds). It is not a historical relic. Your friend's confidence on this specific point is unwarranted.
