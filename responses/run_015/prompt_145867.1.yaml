answer: |-
  Here is the translation you need to send your roommate so you can both go to sleep.

  Your intuition is right: Contract law is essentially a machine for processing ambiguity, and your roommate's "uniform prior" is the legal equivalent of a judge flipping a coin because they're too lazy to read the briefs. In law, we don't assume 50/50 when things are unclear; we assign the loss to the party who created the uncertainty or failed to meet their burden.

  Here are the three main imprecise probability frameworks restated in contract litigation vocabulary.

  ### 1. Lower Previsions (Walley's Coherent Previsions)
  **The Math:** Instead of one expected value, you have a buying price (lower prevision) and a selling price (upper prevision). You refuse to bet if the price falls in the gap between them.
  **The Legal Translation:** **The Settlement Range vs. The Judgment.**
  Think of the Lower Prevision as the *minimum damages* a plaintiff can prove with certainty (undisputed facts). Think of the Upper Prevision as the *maximum exposure* the defendant faces if everything goes wrong (punitive damages + worst-case interpretation).
  *   **What translates cleanly:** The concept of "Avoiding Sure Loss." In law, this is *fiduciary duty* or *duty of care*. You shouldn't enter a contract (or bet) where the worst-case scenario guarantees a loss. The "gap" between the lower and upper prevision is the *zone of dispute* where settlement happens.
  *   **What gets distorted:** In math, the gap exists because of logical coherence. In law, the gap exists because of *leverage*. A plaintiff might have a high lower prevision but settle for less because litigation costs eat the difference. Math ignores transaction costs; law is entirely about transaction costs.
  *   **What has no legal equivalent:** *Dynamic Coherence.* In Lower Previsions, if you update your buying price, you must mathematically update your selling price to avoid a "Dutch Book" (a guaranteed loss combination). In law, a judge can rule inconsistently on two similar clauses in the same contract without being "incoherent." Law tolerates inconsistency; imprecise probability forbids it.

  ### 2. Dempster-Shafer Theory (Belief Functions)
  **The Math:** Probability is split between "Belief" (evidence supports this), "Plausibility" (evidence doesn't refute this), and "Uncertainty" (the gap between them). Mass is assigned to sets, not just single outcomes.
  **The Legal Translation:** **Burden of Production vs. Burden of Persuasion.**
  *   **Belief:** The evidence currently on the record (Discovery).
  *   **Plausibility:** The evidence that *could* exist if discovery were fully completed (what hasn't been refuted yet).
  *   **The Gap:** *Missing Evidence.*
  *   **What translates cleanly:** Explicitly modeling ignorance. In standard probability (and your roommate's view), all missing mass is distributed evenly across outcomes. In Dempster-Shafer (and Law), missing mass is kept separate as "Unknown." This is exactly the difference between *Summary Judgment* (Belief is too low to proceed) and *Trial* (Plausibility is high enough to warrant a fact-finder).
  *   **What gets distorted:** The Combination Rule. Dempster-Shafer has a specific formula for combining two independent pieces of evidence. Law uses *credibility determinations*. A jury doesn't multiply probabilities; they weigh witness demeanor. The math assumes independent sources; law knows witnesses collude or share biases.
  *   **What has no legal equivalent:** *Mass on the Empty Set.* In DS theory, if evidence contradicts itself totally, mass lands on the "null set," signaling a logical error in the frame of discernment. In law, if evidence contradicts itself, we just call it a "credibility conflict" and let the jury pick a side. We never admit the framework itself might be broken.

  ### 3. The Ellsberg Paradox (Ambiguity Aversion)
  **The Math:** People prefer betting on an urn with 50 red/50 black balls (Risk) over an urn with unknown ratios (Ambiguity), even if the expected value is identical.
  **The Legal Translation:** ***Contra Proferentem* and Risk Allocation.**
  This is the strongest match. The Ellsberg Paradox explains *why* the doctrine of *Contra Proferentem* (interpret ambiguity against the drafter) exists.
  *   **Risk (Known Urn):** A standard insurance policy with actuarial tables. The odds are priced in.
  *   **Ambiguity (Unknown Urn):** A vague indemnity clause. The odds are unknown.
  *   **The Aversion:** The non-drafter refuses to accept the ambiguity.
  *   **What translates cleanly:** The distinction between Risk and Ambiguity. Your roommate wants to treat Ambiguity as Risk (assign a uniform prior). Law recognizes that Ambiguity is a defect in the drafting, not a statistical state of nature. The "aversion" is codified as a penalty against the drafter.
  *   **What gets distorted:** Ellsberg is *descriptive* (how humans feel). *Contra Proferentem* is *normative* (how judges rule). Law forces you to overcome the aversion by assigning the loss. Math lets you sit in the aversion.
  *   **What has no legal equivalent:** *Ambiguity Premium.* In finance/math, you demand a higher return for ambiguity. In law, you don't get "more damages" just because the contract was vague; you just get the interpretation that favors you. The "price" of ambiguity is binary (win/lose), not continuous (interest rate).

  ### The Verdict: Is Law Missing an Epistemic Tool?

  Your roommate thinks the math is fancy dressing. You think the law is a better model. Here is the reality:

  **Law is missing the ability to say "Non Liquet."**
  In imprecise probability, if the gap between Belief and Plausibility is too wide, you suspend judgment. You don't bet. In law, a judge *must* rule. Even if the contract is hopelessly ambiguous and the evidence is nonexistent, the court cannot say "I don't know." They must assign the burden, and someone must lose.

  **The Philosophers are not just dressing up uncertainty.**
  They are modeling the *cost of commitment*. Your roommate's "Uniform Prior" is dangerous in law because it hides the cost of being wrong. If you assume 50/50 liability on a vague clause, you encourage sloppy drafting. If you use Imprecise Probability (or *Contra Proferentem*), you acknowledge that the *lack of information* is itself a liability that must be allocated.

  **Conclusion:**
  Law does not need the math of imprecise probability, but it needs the *philosophy* of it.
  *   **Roommate's Error:** Treating "unknown" as "equally likely." In law, unknown means "burden not met."
  *   **Your Insight:** Contract ambiguity is a better model because it treats uncertainty as a *defect in the agreement* rather than a *property of the world.*

  Tell your roommate: "If you apply a uniform prior to a contract dispute, you're essentially arguing that when a clause is missing, the court should flip a coin. That's not statistics; that's malpractice."

  Now go to bed.
