      *   *Hypothesis 1: Innate Preferences (The Magazine's view).* Essentialist differences emerge when constraints are lifted.
      *   *Hypothesis 2: Economic Necessity (The User's view).* STEM is a high-income hedge against risk. Poor countries = high risk = more women choose STEM for security. Rich countries = low risk = women choose based on interest.
      *   *Hypothesis 3: Relative Strengths.* In less equal countries, boys and girls are both pushed hard academically. Girls might be *relatively* better at verbal than math compared to boys, even if absolute math skills are high. In equal countries, they specialize based on relative advantage. (The "Personal Academic Strengths" hypothesis).
      *   *Hypothesis 4: Stereotype Threat/Socialization.* Maybe "equal" countries still have subtle cultural cues about gender roles that are *more* permissive of traditionalism because they aren't fighting it? Or maybe less equal countries have a "feminist survival" mentality?
      *   *Hypothesis 5: Status of the Profession.* In some countries, engineering is low status/dirty work; in others, it's high status. Maybe women avoid low-status work in rich countries but accept it in poor countries for the money?
      *   *Hypothesis 6: Educational Structure.* Maybe STEM curricula differ? Maybe "STEM" in one country includes health sciences (high female) and in another it's pure engineering (low female)? (Note: User said assume pattern holds, but definition matters).
