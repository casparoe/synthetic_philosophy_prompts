  *(Refining the Justice Argument)*: I should bring in the idea that "preferences" aren't magic; they are formed. If society signals that women *should* prefer care, and they do, is that free? Also, the "respect choices" argument often ignores that the *consequences* of those choices (pay gaps) are socially determined, not natural.

