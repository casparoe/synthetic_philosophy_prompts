  ### Brainstorming & Strategic Notes

  **The Core Tension:**
  We are stuck between two models of fairness.
  1.  **The Procedural Model (Current):** Fairness is blindness. To judge fairly, I must not care who wins. Any tie creates a debt or a bias that corrupts the metric. The solution is excision: cut the tie, remove the judge.
  2.  **The Relational Model (Your Friend's):** Fairness is honesty about position. To judge fairly, I must acknowledge where I stand. A mentor *ought* to want their student to succeed; pretending otherwise is a lie. The solution is transparency: state the tie, let the panel adjust.

  **The "Recusal Ratchet" Problem:**
  Your friend is right about the ratchet. If we define "conflict" too broadly (e.g., "anyone you've ever met"), we drain the pool of qualified experts. Only strangers remain. Strangers lack context. They might fund a re-heated dissertation because they don't know the original. Meanwhile, we ignore the guy who hates the applicant because he doesn't have to fill out a "Conflict of Hatred" form. The current system regulates *love* (recusal) but ignores *war* (silence).

  **Your "Declared Partiality" Idea:**
  *   *Pros:* It uses the expert knowledge (the mentor knows the work best). It acknowledges the reality of relationships.
  *   *Cons:* The math is a nightmare. If a mentor gives a 10 and a neutral gives a 6, do you average to 8? That institutionalizes the bias. Do you discard the 10? That's just recusal. Do you let the mentor explain *why* it's a 10 without voting? That's workable.
  *   *Verdict:* I'm going to kill the "weighting/offset" mechanism. It's too gameable and hard to audit. But I will adopt the *disclosure* element and the *expert consultation* element. We keep the mentor's knowledge without giving them the vote.

  **The Complaint:**
  We cannot rescind the award. The reader did not violate the *written* rule (past supervision isn't listed). If we punish her, we set a precedent of retroactive justice that will haunt us in tenure cases. The runner-up lost on fairness, not on procedure. We have to admit the procedure was flawed, not that it was broken.

  **The Policy Fix:**
  1.  Expand "Conflict" to include past supervision (5 years).
  2.  **Crucially:** Add "Adversarial Relationships" to disclosure. This answers the friend's point about negative partiality.
  3.  Create a "Non-Voting Expert" lane. If a reader is recused but has unique knowledge (like the dissertation overlap), they can submit a factual memo to the Chair, but they leave the room for scoring.

  **Tone:**
  Needs to be firm enough for the Senate, but nuanced enough that your friend sees we actually listened. No academic name-dropping. Just the logic.

  ***

  ### MEMORANDUM

  **TO:** University Senate
  **FROM:** Committee on Conflicts of Interest
  **DATE:** October 10
  **SUBJECT:** Disposition of Fellowship Complaint and Recommended Policy Revisions (FY25)

  **EXECUTIVE SUMMARY**

  The Committee recommends that the Senate **uphold the current fellowship award** but **adopt immediate revisions** to the Conflict of Interest (COI) policy for all future cycles.

  Regarding the specific complaint: The reader in question did not violate the policy as it existed at the time of review. Rescinding the award would constitute retroactive punishment for behavior that was technically permissible. However, the Committee acknowledges that the existing policy was insufficient to guarantee the appearance of fairness.

  Regarding future policy: We recommend replacing the current "Recusal-Only" model with a "Disclosure and Management" model. This expands the definition of conflict to include past supervisory relationships and, critically, adversarial relationships. It also creates a mechanism to utilize expert knowledge from recused members without allowing them to vote.

  **I. DISPOSITION OF CURRENT COMPLAINT**

  **The Finding:**
  The Committee finds that the reader did not violate Senate Policy 4.1 (Conflicts of Interest) as written. The current policy mandates recusal for family, financial interests, and *current* supervisory relationships. It is silent on past supervision. The reader's decision to remain on the panel was consistent with the letter of the rule.

  **The Remedy:**
  While no rule was broken, the outcome highlights a structural vulnerability. A reader claiming unique expertise to judge a former student's work creates an unavoidable perception of bias.
  *   **Action:** The award stands.
  *   **Communication to Runner-Up:** The Committee will meet with the complainant to explain that while the process was procedurally valid, the rules are being changed immediately to close this loophole. We will acknowledge that the system failed to protect the integrity of the competition, even if it did not break its own rules.
  *   **Communication to Reader:** The reader will receive a letter of admonishment. While she followed the rule, she exercised poor judgment by failing to recognize the appearance of impropriety. She is eligible to serve on future panels under the new rules.

  **II. RECOMMENDED POLICY REVISIONS**

  We propose replacing the current binary recusal rule with a three-tiered Disclosure and Management system.

  **1. Expanded Definition of "Significant Relationship"**
  Recusal is now required for:
  *   Family and financial interests (unchanged).
  *   Current supervisory relationships (unchanged).
  *   **Past supervisory or close collaborative relationships within the last five years.** (New)
  *   **Known adversarial relationships or active professional disputes.** (New)

  **2. The "Declared Partiality" Protocol (Revised)**
  We considered a proposal to allow conflicted members to vote if their bias was declared and their scores mathematically weighted. We reject this approach. Mathematically offsetting bias institutionalizes the bias and creates audit nightmares.

  Instead, we adopt a **Disclosure and Consult** model:
  *   **Step 1 (Disclosure):** All panelists must declare *all* relationships with applicants, positive (mentorship, collaboration) or negative (rivalry, dispute).
  *   **Step 2 (Recusal from Voting):** Any panelist with a declared relationship must recuse themselves from the final scoring and ranking of that applicant.
  *   **Step 3 (Expert Consultation):** If a recused panelist possesses unique knowledge essential to evaluating the proposal (e.g., knowledge of a prior dissertation), they may submit a brief, factual memo to the Panel Chair. This memo is shared with the remaining voting members as context, but the recused member leaves the room during discussion and scoring of that application.

  **3. Negative Partiality Enforcement**
  Current policy assumes bias is primarily favorable (nepotism). This revision acknowledges that bias is often unfavorable (rivalry). Failure to disclose an adversarial relationship will be treated as a more severe violation than failure to disclose a favorable one, as it is harder to detect and more damaging to the applicant.

  **III. RATIONALE AND PHILOSOPHICAL FRAMEWORK**

  The Committee debated two competing visions of ethical evaluation. It is vital the Senate understands why we chose the path above.

  **View A: The View from Nowhere (Procedural Impartiality)**
  This is the traditional administrative view. It holds that a fair judge must be a stranger to the parties. Relationships are seen as contaminants that distance the judge from objectivity. The goal is to simulate a "blind" review.
  *   *Strength:* It is clean, easy to enforce, and protects the institution from accusations of favoritism.
  *   *Weakness:* It assumes relationships vanish when a contract ends. It ignores that a stranger may lack the expertise to judge complex work. It also ignores that enemies can judge "neutrally" while harboring grudges that never appear on a disclosure form.

  **View B: The View from Somewhere (Relational Integrity)**
  This view, drawn from comparative ethical traditions, argues that duties attach to roles and do not evaporate overnight. A mentor has a lasting obligation to a student; pretending otherwise is dishonest. This view argues that the "Recusal Ratchet"—where we keep banning people with ties until only strangers remain—deprives panels of necessary expertise. It suggests we should not hide relationships, but declare them and manage them.
  *   *Strength:* It honors the reality of academic life. It acknowledges that expertise is often tied to relationships. It forces us to regulate negative bias (rivals) just as strictly as positive bias (friends).
  *   *Weakness:* It requires high trust. It risks normalizing bias if not carefully managed.

  **The Committee's Synthesis:**
  We reject the "View from Nowhere" as a fiction. We cannot pretend panelists are blank slates. However, we also reject the idea that declared bias can be mathematically neutralized.

  Therefore, we adopt the **Relational Integrity** requirement for *disclosure* (you must admit where you stand, positive or negative) but maintain the **Procedural Impartiality** requirement for *decision-making* (you cannot vote if you stand somewhere).

  This specifically addresses the "Recusal Ratchet." By allowing recused experts to provide factual context (Step 3 above), we keep their knowledge in the room without giving them the vote. By requiring disclosure of adversarial relationships, we regulate the "negative partiality" that has long gone unchecked.

  **IV. IMPLEMENTATION TIMELINE**

  *   **October 15:** Senate vote on policy revision.
  *   **November 1:** Interim guidance issued for Spring Fellowship cycle. Panelists will be briefed on the new "Adversarial Disclosure" requirement immediately.
  *   **January 1:** Full policy integration into the Faculty Handbook.

  **V. BOTTOM LINE FOR SENATE**

  1.  **Do not rescind the award.** The rule was not broken, only outgrown.
  2.  **Adopt the new Disclosure and Management policy.** It closes the "past supervisor" loophole and, for the first time, regulates animosity between colleagues.
  3.  **Authorize the Committee** to draft the specific disclosure forms by December 1.

  ***

  **Attachment A: Draft Language for Policy 4.1**
  *(See attached for specific wording regarding "Significant Professional Relationships" and "Adversarial Disclosure")*

  **Attachment B: Flowchart for Panel Chairs**
  *(See attached for decision tree on when to accept an Expert Consultation Memo vs. when to simply recuse)*
