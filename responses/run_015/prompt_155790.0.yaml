      *(Self-Correction on Mark)*: For a non-specialist reading group, grasping the Necessary A Posteriori is the hard part. Getting that right is huge. Messing up the Twin Objection is common. Maybe 72/100 is fairer? It shows genuine engagement. But the conclusion ("sensible retreat") actively contradicts the premise in (i). That's a coherence penalty. I'll stick with 68/100 to reflect the internal contradiction.

