answer: |-
  1. Seminar context
  In a recent graduate seminar on early modern determinism, the discussion turned to Kepler's astrological commitments. A peer repeatedly invoked the slogan that stars incline but do not compel to argue Kepler was not a determinist. They claimed celestial bodies merely nudge human affairs without locking them into fatalistic outcomes. I remain skeptical that this aphorism performs such heavy philosophical lifting. It functions more as a boundary marker than a rigorous metaphysical claim. The seminar relied on it to absolve Kepler of hard determinism, suggesting his astrology allowed for contingency. My concern is that the phrase masks ambiguities in causation and freedom rather than resolving them. It serves as a convenient shield against accusations of superstition, but its logical structure remains unexamined in that context.

  2. The menu
  1. **Statistical Correlation:** This reading suggests celestial positions correlate with earthly events without causal arrows. *Trivial/Substantive:* Trivial if accidental, substantive if law-like. *Defensible:* Kepler accepted weather and epidemic correlations, viewing them as harmonies rather than direct causes. *Blocks Determinism:* Yes, correlation implies no causal necessity, preserving human agency entirely outside the celestial mechanism.

  2. **Dispositional Tendency:** Here, stars trigger psychological states rather than specific actions. *Trivial/Substantive:* Substantive; it posits a causal mechanism affecting temperament. *Defensible:* Highly defensible; Kepler argued for celestial effects on collective moods and bodily humors. *Blocks Determinism:* Weakly; it allows soft determinism where will reacts to impulse, but the impulse itself is determined.

  3. **Modal Constraint:** This posits stars alter possibility spaces, making outcomes probable but not necessary. *Trivial/Substantive:* Substantive; it changes modal logic of events. *Defensible:* Plausible; Kepler saw aspects as configuring earthly potentiality. *Blocks Determinism:* Yes, logically preserves contingency against necessity, though it limits the scope of free action to a narrowed field.

  4. **Physical Force vs. Soul:** Celestial rays exert force, but the rational soul counters them. *Trivial/Substantive:* Substantive; requires dualistic ontology. *Defensible:* Consistent with Kepler's physics of light and belief in the immortal soul. *Blocks Determinism:* Yes, via metaphysical override of physical causation, assuming the soul is exempt from physical laws.

  5. **The Compulsion Clause:** "Do not compel" functions either metaphysically (will blocks force) or epistemically (complexity prevents prediction). *Trivial/Substantive:* Metaphysical is substantive; epistemic is trivial. *Defensible:* Kepler likely meant metaphysical regarding the soul, epistemic regarding weather. *Blocks Determinism:* Only the metaphysical reading truly blocks hard determinism; the epistemic reading merely hides it behind unpredictability.

  3. Niche injection
  Kepler's notion of celestial harmony complicates the physical force reading significantly. For him, influence was not a mechanical push but a geometric sympathy rooted in the world soul. This distinction is crucial when weighing aspect-based predictions against his rejection of house-division mechanics. House divisions were arbitrary zones lacking geometric reality; Kepler dismissed them as fictional. Aspects, however, were real angular relationships capable of triggering resonance. If influence is geometric sympathy, it operates more like a musical chord than a billiard ball collision. This interacts with the modal constraint reading: the geometry configures the field of possibility rather than forcing a specific event. It suggests the stars tune the instrument of the world, but do not play the notes themselves. This nuance undermines the simple physical force model. It implies that "inclination" is a structural alignment of the cosmos that the human soul perceives and responds to, rather than a vector summing against free will. The rejection of houses removes arbitrary fatalism, while the acceptance of aspects keeps cosmic interconnection alive.

  4. Verdict
  When defenders invoke this slogan, they usually mean the Physical Force vs. Soul reading, imagining a tug-of-war where willpower wins. However, Kepler probably held a mix of the Dispositional and Geometric Sympathy readings. He saw the cosmos as an animated whole where celestial configurations dispositionally affect the sublunary realm without dictating specific choices. Does the slogan block determinism? Only if one accepts the metaphysical exemption of the soul. If the soul is part of the natural harmony, the inclination becomes compulsion. The slogan works rhetorically to separate Kepler from fatalists, but logically it fails to secure libertarian free will unless one imposes a dualism Kepler himself might not have strictly maintained. It protects his science from theology, but not his physics from determinism.
