          *   Analyze the hypothetical: Halden-style prison + long-term segregation (contradiction or just nicer building?).
      *   **Tone:** Analytical, precise, non-generic, philosophical.

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *Nordic Model:* "Normality Principle." Key concept: *Citizenship retention*. Punishment is the deprivation of liberty *only*, not civil rights or human dignity. Agency is presumed intact. Reintegration is the goal, facilitated by simulating freedom.
      *   *American Model:* "Pains of Imprisonment" (Sykes). Key concept: *Civil Death* (historically) or *Forfeiture*. Agency is suspended or heavily monitored. Security/Control is the primary operational logic, even if rehabilitation is the rhetorical goal.
      *   *Philosophical Underpinnings:*
          *   Nordic: Liberal egalitarianism, social contract (you broke the law, you pay the price of confinement, but you remain a member of the community), Kantian respect (treat as ends, not means).
          *   American: Retributivism (often disguised), Utilitarianism/Deterrence (incapacitation), Paternalism (you can't be trusted), perhaps a Hobbesian view of the sovereign's power over the outlaw.
      *   *Agency:* Nordic = Continuous. American = Interrupted/Conditional.
      *   *Underdetermination:* Both claim "rehabilitation." Both claim "public safety." The *means* reveal the true philosophical commitment.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Avoid fluff. Define the core tension: *Continuity of Citizenship* vs. *Forfeiture of Standing*.

      *   **Section 1: Philosophical Commitments (The Core Contrast):**
          *   *Moral Responsibility & Agency:*
