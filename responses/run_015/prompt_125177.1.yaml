          *   Contradiction: You cannot treat someone as a responsible agent (cooking, working) and simultaneously as a biohazard requiring isolation without violating the core normative claim. It turns the "normality" into a sham/privilege system.

      *   **Refining and Polishing:**
          *   *Check Tone:* Is it sharp? Yes. Avoid "on the one hand, on the other." Use strong philosophical terms (ontology, normative status, forfeiture).
          *   *Check Constraints:* Did I distinguish presupposition from fit? Yes. Did I address the specific US policy changes? Yes.
          *   *Key Insight:* The US model treats liberty as a *privilege* granted by the state. The Nordic model treats liberty as a *status* retained by the citizen, limited only by the physical walls.
          *   *Theoretical Anchor:* Use R.A. Duff (communicative theory), Sykes (pains of imprisonment), and perhaps Marshall (citizenship).

