      *   **Section 3: Implications for US Policy (If Nordic Agency adopted):**
          *   *Good-time/Parole:* Currently discretionary/privilege. Under Nordic view, these must be *rights* based on statutory sentence. Discretion implies the state judges your soul, not just your time.
          *   *Segregation:* Currently a management tool. Under Nordic view, it's only permissible if it doesn't destroy agency. Long-term segregation *is* the destruction of agency. It would have to be abolished or radically limited (medical model only).

      *   **Section 4: The Halden + Segregation Hypothetical:**
          *   Is it just a nicer building? No.
