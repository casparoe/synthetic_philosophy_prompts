              *   US: Agency is suspect. The "criminal" identity overrides the "citizen" identity. Control is needed because agency is proven defective.
          *   *Nature of Punishment:*
              *   Nordic: Punishment *is* the loss of liberty. Anything extra is gratuitous (and illegal/unethical).
              *   US: Punishment includes the "pains of imprisonment" (deprivation of autonomy, privacy, goods). Liberty loss is the baseline; hardship is the mechanism.
          *   *State-Offender Relation:*
              *   Nordic: Fiduciary/Stewardship. The state owes the prisoner a path back.
              *   US: Custodial/Adversarial. The state holds the offender against their will and against the public's interest.

      *   **Section 2: Strict Presuppositions vs. Fit vs. Underdetermination:**
          *   *Strict Presuppositions:*
              *   Nordic: Requires a belief in the *reintegrative potential of dignity*. You can't have normality without believing normality matters for moral agency.
              *   US: Requires a belief in *incapacitation as a primary good*. You can't have total control without believing the subject is inherently risky.
          *   *Merely Fits:*
              *   Nordic fits with Utilitarianism (lower recidivism), but also Deontology (rights).
              *   US fits with Retributivism, but also Utilitarianism (deterrence through harshness).
