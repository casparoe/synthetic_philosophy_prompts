prompt: |-
  I am constructing a philosophical dataset with the care of a novelist arranging hidden architecture—each prompt must bear conceptual weight without collapsing into citation, repetition, or reliance on sources a reasoning model cannot access. For this entry, design a classroom simulation for an advanced undergraduate epistemology seminar: ten students, ninety minutes, no digital devices permitted. The idea to be inhabited is the failure of epistemic closure under Nozick’s tracking conditions. Do not begin with a lecture; instead, create a structured role-play called the Cartographic Transmission, built around an imaginary archipelago in which each student holds tokens representing actual and counterfactual worlds. The rules must be arranged so that participants first establish knowledge of an island’s location (p) through a sensor that tracks truth across nearby worlds, then derive through explicit entailment that a strait is navigable (q), and then—through a staged shift in modal proximity—discover that the counterfactual worlds in which the strait is dangerous are closer than those in which the island is elsewhere. They should physically move the tokens, declare beliefs aloud, and only afterward learn that they have lived through a breakdown of closure: their belief about p tracks the truth, and they know p entails q, yet they do not know q because the tracking conditions for q fail in worlds they must consider nearby. The debrief should map each token movement onto Nozick’s conditions—truth in the actual world and sensitivity across modal neighborhoods—predict the misconception that students will confuse tracking with mere reliability and then retreat into simple skepticism, and be frank about what the simulation cannot reproduce: specifically, the precise metric of modal distance that Nozick’s account requires, which the archipelago metaphor can only approximate. Include roles or rules that prevent the facilitator from explaining the failure in advance, specify the payoff or incentive structure that makes students resist admitting their knowledge has not transmitted, state honestly what will go wrong the first time—likely a refusal to accept that knowledge can be non-transitive across entailment—and describe how to recover without lecturing. Do not request bibliographies, reading lists, or citations; do not invoke obscure secondary literature unknown to a well-trained model. Instead, inject this specific framing not standard in textbooks: treat the entailment chain as a cartographic transmission across water and distance, so that knowing one coordinate does not automatically grant knowledge of the current, because the worlds in which the current changes are nearer than those in which the coordinate does. The participants should feel the force of the idea through the body of the game—through the physical separation of token clusters—before it is named.
