      *   *(6) The Intuition Pump:* "Installing a scrubber retroactively strips the original emission of its causal power."
          *   This feels like a mischaracterization of the counterfactual claim. Saying "If scrubber were installed, I wouldn't happen" doesn't mean P *wasn't* a cause in the actual world. It means P's causal efficacy is *contingent* on the background conditions (including O).
          *   However, the argument claims this is "absurd." Is it? In a world with a scrubber, P does not cause I. That's true. Does that mean P lacks "causal power"? It means P's power is context-dependent.
      *   *(7) Conclusion from (6):* Omissions $\neq$ Actions.
      *   *(8) The Legal Stakes:* If omissions aren't causes, negligence law fails.
      *   *(9) The Dilemma.*

