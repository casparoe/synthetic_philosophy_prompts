      *   **Candidate 1: Premise (1).** Reject counterfactual analysis for omissions.
          *   *Cost:* High. Makes omissions mysterious. Hard to square with (8).
      *   **Candidate 2: Premise (2).** Deny symmetry.
          *   *Cost:* High. Requires a dualistic theory of causation (process theory for actions, counterfactual for omissions?).
      *   **Candidate 3: Premise (4).** "Same footing."
          *   *Cost:* Moderate. Distinguish between *causal relevance* (counterfactual dependence) and *causal production* (energy transfer/mechanism).
      *   **Candidate 4: Premise (5).** The inference from "same footing" to "P is insufficient without O."
          *   *Cost:* Low/Moderate. This step conflates *necessity* with *causal sufficiency/insufficiency* in a way that creates a false dilemma.
      *   **Candidate 5: Premise (6).** The claim that it's absurd for P's efficacy to depend on O.
          *   *Cost:* Low. Actually, P's efficacy *does* depend on O. If the scrubber were there, P wouldn't cause I. That's not absurd; it's just how causation works (context sensitivity).

