answer: |-
  Thank you for being here. It is a strange thing to stand between two languages that have claimed the same book.

  Usually, a book travels alone. It leaves the writer's desk and enters a single room. Tonight, I am standing in the doorway of two rooms at once.

  For two years, I have told interviewers that this novel is about what politeness costs. I meant that every courtesy requires a subtraction. To be kind, we often remove the truth. To be understood, we often remove the silence.

  Translation is the highest form of politeness. It is the act of making a stranger feel at home in a language that is not theirs. But there are different ways to make a guest comfortable.

  Some hosts fill every silence with conversation. They worry that a pause might feel like neglect. They smooth the rough edges of the furniture so no one bumps a knee. This is a gift of warmth. It says: you are welcome here, and you do not need to struggle.

  Other hosts respect the distance. They show you the room exactly as it stands. They leave the gaps between the words intact. They trust you to stand in the silence without trying to fix it. This is a gift of faith. It says: you are strong enough to bear the weight of what is unsaid.

  I am lucky enough to have received both gifts.

  To my Japanese team: You were told in Tokyo that your work was inadequate. I need you to hear me contradict that. To preserve the silence of a text is not a failure of imagination. It is a discipline. You did not try to save me from my own pauses. You trusted the reader to endure them. That is not inadequacy. That is fidelity.

  To my Dutch friend: We have known each other for twenty years. You know how I write. You also know how I live. You chose to make this book livable for your readers. You filled the spaces where I left holes. You made the sentences flow where I broke them. You prioritized hospitality over architecture. That is not a error. It is a choice of care.

  A translation must decide whether to build a bridge or to preserve the gap.

  I know what this book costs. I know that getting it into print requires agreements that feel like compromises. My late editor told me I may withhold, but I may not invert. I cannot say the opposite of what I believe. So I will not say these books are the same. They are not.

  They are two different ways of surviving the text.

  The Dutch version allows the reader to rest. The Japanese version requires the reader to wait. Both are valid. Both are necessary. But they are not the same thing.

  I am grateful for the rest. I am grateful for the wait.

  My mother is here. An old love is here. People who know me before the books are here. They know that I am not always easy to host. They know I value the silence more than the comfort.

  But tonight, I am the guest. You have done the work of building the room. I am simply standing in it.

  The book no longer belongs to me. It belongs to the language it is spoken in. It belongs to the silence you kept, and the silence you filled.

  Thank you for letting me visit both houses.

