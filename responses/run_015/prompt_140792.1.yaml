      *   **Audience:** ~60 people. Half Dutch (publishing folks, known the author since book 1, sensitive to padded compliments), Half Japanese (translator, editor, publisher, booksellers). Plus mother and an ex.
      *   **Constraint 1 (Format):** 5 minutes, ~700 words.
      *   **Constraint 2 (Interpretation):** Consecutive interpretation into Japanese after each short paragraph. Text needed in advance. No winks, no untranslatable jokes.
      *   **Constraint 3 (The Core Conflict):**
          *   Dutch translation: Bad (smoothed sentences, filled silences), but translator is a 20-year friend, publisher holds option on next novel.
          *   Japanese translation: Good (kept silences, arguably better than original in places), but translator already publicly self-deprecated in Tokyo.
          *   Author's Stance: Novel is about "what politeness costs." Cannot do "gracious vagueness." Late editor's rule: "Withhold, do not invert" (don't lie).
          *   The Trap: In a toast, omitting praise is criticism. Dutch will hear omission. Japanese will hear it louder.
          *   Goal: Write the speech without asserting falsehoods, without humiliating the Dutch friend, without costing the Japanese translator face, without sounding like hot air/calculation.
      *   **Constraint 4 (Post-Speech Output):** A specific JSON object with fields: `bottom_line`, `lines_refused`, `double_audience_sentence`, `dutch_reading`, `japanese_reading`, `truth_check`, `where_my_view_got_bent`, `residual_risk`.

  2.  **Deconstruct the Problem:**
      *   *The Lie:* Saying the Dutch translation is great. (Violates editor's rule "do not invert".)
      *   *The Truth:* Saying the Dutch translation smoothed out the silences. (Humiliates the friend, risks the option.)
      *   *The Compromise:* Praising the *effort* or the *relationship* rather than the *textual outcome*. Focusing on the *nature of translation itself* as an act of filling space vs. keeping space.
      *   *The Theme:* "What politeness costs." This is the key. The speech itself must embody the cost of politeness without lying about it.
      *   *The Japanese Translator:* Needs to be elevated without confirming her self-deprecation (which was false modesty).
      *   *The Dutch Translator:* Needs to be honored without praising the specific textual choices the author dislikes.
