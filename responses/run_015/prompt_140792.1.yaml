      *Let's write.*

  4.  **Drafting the JSON:**
      *   `bottom_line`: Needs to be sharp. "The Dutch text prioritizes hospitality over silence; the Japanese text prioritizes silence over hospitality."
      *   `lines_refused`: Need specific examples of what I *didn't* write. E.g., "Both translations are perfect." (Lie). "The Dutch version lost the soul." (Humiliation).
