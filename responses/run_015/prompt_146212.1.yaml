answer: |-
  As the administrator overseeing the new cardiac wing, you must approve triage protocols for two distinct patient cohorts arriving simultaneously. For the stable cohort, Protocol Surety guarantees every patient survives the night with standard mobility, whereas Protocol Gamble ensures the vast majority survive with standard mobility, grants a small subset full athletic recovery, but carries a negligible risk of mortality for the remainder. For the critical cohort, Protocol Hope offers a minority chance of survival with standard mobility against near-certain mortality, while Protocol Reach offers a slightly smaller minority chance of survival with full recovery against near-certain mortality. You feel a compelling ethical duty to choose Surety for the stable cohort to prevent any preventable death, yet you feel equally compelled to choose Reach for the critical cohort to maximize potential recovery, even though the marginal trade-off between survival probability and recovery quality is identical in both decisions.

  **Structural Feature Driving Divergence**
  The divergence is driven by the **Common Consequence Effect**. In the first decision, the "vast majority" outcome (standard survival) is shared by both options but is certain in *Surety* and merely probable in *Gamble*. In the second decision, the "near-certain mortality" is the shared consequence. The structural feature is the presence of a high-probability outcome that is identical across options in the first choice (creating a "certainty" anchor) but shifts to a different, negative outcome in the second choice. This shift alters the psychological weight of the risk without altering the mathematical difference between the options.

  **Effect of Removing the Feature**
  If you remove the common consequence (the "vast majority" survival in the first case and "near-certain" mortality in the second), the two decisions become structurally identical. You would be left comparing the exact same marginal trade-off: a specific small probability of standard survival versus a slightly smaller probability of full recovery plus a tiny risk of death. Without the common consequence to anchor the "certainty" in the first case, a consistent decision-maker would make the same choice in both scenarios.

  **Defense of the Independence Axiom**
  A defender of the independence axiom would argue that your preference reversal is a cognitive error, not a rational ethical stance. They would contend that outcomes common to both options in a single choice (the "vast majority" who survive regardless of your choice) are irrelevant to the decision and should be cancelled out mentally. By choosing *Surety* in the first case but *Reach* in the second, you are allowing the *context* of the common outcome (survival vs. death) to influence your valuation of the *difference* between the protocols. The defender argues that rational preference depends only on the consequences that actually differ between options; since the differences are identical in both cohorts, your preference should be consistent, and the "peace of mind" provided by certainty is an emotional premium that violates coherent utility maximization.
