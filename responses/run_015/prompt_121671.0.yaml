answer: |-
  Here is my breakdown. I am an AI, so I don't have personal beliefs, but I can synthesize a credence based on dominant ethical frameworks (contractualism, utilitarianism, and virtue ethics) and probabilistic reasoning.

  My calculated credence that violating local conventions is **genuinely morally wrong** (not just imprudent or rude) is:

  ### **0.30**

  This matches your gut intuition, though likely for different structural reasons. Here is the decomposition.

  ***

  ### The Decomposition

  I am treating these as **conditional probabilities** in a multiplicative chain. For an act to be *morally wrong* (rather than just a faux pas), a series of philosophical conditions generally need to be met. If any link breaks, the "moral wrongness" collapses into "mere rudeness."

  **Formula:** $P(\text{Wrong}) \approx P(a) \times P(b) \times P(c) \times P(d)$

  #### **(a) The Convention-to-Duty Link: 0.75**
  *Question:* Do arbitrary social conventions ever generate actual moral duties for outsiders?
  *Reasoning:* This is the strongest link. Contractualist ethics (e.g., Scanlon) suggest that by voluntarily entering a social system (visiting a country), you implicitly agree to its terms to ensure fair cooperation. If everyone opted out of local rules when inconvenient, the system would fail.
  *Why not 1.0?* Some conventions are trivial (which side of the sidewalk to walk on) and lack moral weight.

  #### **(b) The "When in Rome" Moral Applicability: 0.80**
  *Question:* Does geography/culture change moral truth, or just empirical facts?
  *Reasoning:* Moral principles are usually universal, but their *application* is contextual. "Do no harm" is universal; "Don't tip" is local. If the local norm prevents harm (e.g., tipping undermines a wage system), then the local norm carries moral weight.
  *Why not 1.0?* Some local norms are themselves immoral (e.g., segregation). You don't have a duty to follow *bad* local norms. There is a non-zero chance the local convention is unjust, negating the duty.

  #### **(c) The Harm/Unfairness Threshold: 0.50**
  *Question:* Does breaking the norm cause harm/unfairness, or is it just annoying?
  *Reasoning:* This is the biggest filter. For something to be *immoral* rather than *impolite*, it usually needs to violate fairness or cause setback interests. Queue-jumping is unfair (you gain time at others' expense). Not tipping where forbidden is neutral. Not tipping where expected might hurt the worker.
  *Why 0.50?* In many cases, a tourist breaking a norm is a "drop in the bucket." One person skipping a queue rarely breaks the system. The leap from "rude" to "immoral" requires a threshold of impact that is often ambiguous.

  #### **(d) The Epistemic Excuse (Ignorance/Status): 0.90**
  *Question:* Does being a tourist or not knowing the norm excuse the wrongness?
  *Reasoning:* Strictly speaking, ignorance makes an act *non-culpable* (you aren't a bad person), but the act itself might still be *suboptimal/wrong*. However, in terms of "obligation," if you cannot reasonably know the rule, the obligation to follow it is weakened.
  *Why 0.90?* I weigh this lightly. Ignorance excuses blame, but it doesn't make the act right. However, if the norm isn't publicly signaled, the "duty to know" is lower.

  ***

  ### The Calculation

  $$0.75 \times 0.80 \times 0.50 \times 0.90 = 0.27$$

  Rounding for philosophical uncertainty: **0.30**.

  ***

  ### The Bet Settler: Which Term Moves?

  If someone showed you a study proving **tourists who skip queues cause measurable stress to locals**, the term that shifts most dramatically is **(c) The Harm/Unfairness Threshold**.

  *   **Current State:** We assume queue-jumping is mostly just "rude" or a minor annoyance (Prob = 0.50).
  *   **New Evidence:** If stress is *measurable* (cortisol spikes, genuine psychological harm), it moves the act from the category of "Etiquette" to "Harm."
  *   **New Probability:** Term (c) would jump from **0.50 to ~0.85**.
  *   **New Credence:** Your overall number would jump from **0.30 to ~0.51**.

  **Why not the other terms?**
  *   (a) is already high; we mostly agree conventions matter.
  *   (b) is already high; we agree location matters.
  *   (d) is about the agent, not the act. The study proves the *act* hurts, regardless of whether the tourist knew it.

  ### Summary for your Roommate
  Tell them your 0.30 credence is robust because it hinges on the **Harm Threshold**. Most people agree you *should* follow local rules, but few agree it's *immoral* to fail unless someone is actually hurt or treated unfairly. If you prove the harm (stress/unfairness), the moral obligation skyrockets. If you can't prove harm, it remains just etiquette.

  **Winner:** Your gut was philosophically sound.
