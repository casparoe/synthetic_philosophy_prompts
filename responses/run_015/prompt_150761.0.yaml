answer: |-
  This is a profound puzzle that cuts to the bone of intellectual property theory. You have identified a genuine tension: the law treats the inventor as *dispensable* when deciding whether to grant the right (obviousness), but as *exclusive* when enforcing it (infringement).

  Your attorney friend is partially right—they have different jobs—but that answer is functional, not philosophical. It explains *what* the rules do, not *why* they are morally compatible. To answer your request, we must reconstruct the implicit ontology of invention that allows these two doctrines to coexist without collapsing into contradiction.

  ### 1. The Implicit Theory: Invention as Crystallization

  The patent system does not operate on a theory of **Discovery** (finding a pre-existing truth) nor purely on **Creation** (bringing something new into existence). Instead, it operates on a theory of **Crystallization and Disclosure**.

  Under this theory, the "invention" is not the mental conception in the inventor's head, nor is it the abstract physical truth of the mechanism. The invention is the **reduction of collective potential into specific, actionable public knowledge.**

  Here is how this theory resolves your tension:

  *   **On Obviousness (Ripeness):** If a result is "obvious," it means the collective potential of the field was already so high that the crystallization adds negligible value to the public storehouse. The "step" from the prior art to the invention is too small to warrant the social cost of a monopoly. Here, the law admits the inventor is *causally dispensable*. The field was ripe; the fruit was going to fall. To grant a patent here would be to enclose land that was already effectively common property.
  *   **On Priority and Infringement (Redundancy):** Once the invention is deemed non-obvious (a significant crystallization), the law shifts focus from *causal necessity* to *informational certainty*. The patent is not a reward for being the "first thinker"; it is a **bargain for disclosure**. The state grants a monopoly in exchange for the inventor teaching the public how to do the thing.
      *   If independent invention were a defense, the value of the monopoly would plummet. Inventors would reason: "If I disclose, a competitor can reverse-engineer or independently derive my solution and use it for free. I am better off keeping this a trade secret."
      *   Therefore, the law treats the *first filer* as the sole owner not because they are the unique metaphysical source of the idea, but because they are the **unique agent of public coordination**. They cleared the fog.

  **What this theory commits you to:**
  1.  **Secrecy is the Enemy, Duplication is Noise:** The system is designed to combat trade secrecy, not independent convergence. It presupposes that the social loss of secrecy is greater than the social loss of excluding an independent second inventor.
  2.  **The "Right to Exclude" is not a "Right to Use":** It commits you to viewing the patent not as a recognition of natural property (like a stone you found), but as a regulatory instrument. You don't own the idea because you thought of it; you own the right to stop others because you told the world.
  3.  **Epistemic Priority over Ontological Priority:** It matters less *who thought of it first in reality* (ontological) and more *who established the public record first* (epistemic).

  **Is the practice underdetermined?**
  Yes. Several pictures of discovery fit these rules:
  *   **The Finisher:** The field did 90% of the work; the inventor did the final 10%. (Fits obviousness thresholds).
  *   **The Coordinator:** The inventor is merely the one who standardized the solution. (Fits first-to-file).
  *   **The Hero:** The inventor did something miraculous. (Fits the *rhetoric* of patents, but contradicts the *doctrine* of obviousness).

  The system is philosophically underdetermined because it is agnostic on the metaphysics of genius. It only cares about the economics of information production.

  ### 2. Verdict on the Pairing: Pragmatic Coherence, Philosophical Instability

  Is the combination coherent? **Functionally, yes. Philosophically, no.**

  The tension you feel arises because the law employs a **fiction of uniqueness** to justify a **property rule**, while simultaneously employing a **doctrine of inevitability** to limit that property.

  *   **The Pull:** Obviousness says, "You are not special; the field was moving this way." Infringement says, "You are special; no one else may do this without your leave."
  *   **The Resolution:** The law resolves this by separating *ex ante* incentives from *ex post* rights.
      *   *Ex ante* (Obviousness): We ask, "Do we need to bribe this person to disclose?" If the answer is no (it was ripe), we deny the patent.
      *   *Ex post* (Infringement): Once the bribe is paid and the patent granted, we must make the property right "quiet" (stable). Allowing an independent invention defense would require courts to adjudicate the state of mind of the second inventor (did they copy? did they derive it?). This creates massive litigation costs and uncertainty.

  **Which half should give?**
  If you prioritize **Truth and Credit** (the Historian's view), the **Priority/Infringement rule** should give. It is unjust to enjoin a person who genuinely arrived at a solution independently, especially if the first inventor's contribution was marginal (merely first, not best).
  If you prioritize **Disclosure and Clarity** (the Attorney's view), the **Obviousness rule** is the only safety valve, and the Priority rule must remain strict.

  **What would we lose by giving it up?**
  If you allow an independent invention defense (making the infringement rule give):
  1.  **The Collapse of Disclosure:** As noted, inventors hide inventions. The public loses the "teaching" function of the patent.
  2.  **Administrative Collapse:** Proving independent invention is notoriously difficult. It turns every infringement trial into a psychic inquiry into the defendant's lab notebooks. The legal system prioritizes *administrable rules* (did they file first?) over *accurate rules* (who really thought of it?).

  **Does the convention presuppose the heroic picture?**
  Yes, quietly. To justify excluding an independent second comer, the law must implicitly treat the first inventor as having generated a *new* normative sphere. If the invention were truly just "ripe fruit," excluding others looks like theft. The law papered over this by saying, "We decided you were non-obvious at the gate; now we treat the right as absolute." The heroic individual is a necessary fiction for the property right to feel legitimate, even if the obviousness doctrine admits the individual is causally replaceable.

  ### 3. A System Taking Actual Redundancy Seriously

  If we were to design a regime that respected your intuition—that *actual* redundancy is stronger evidence of dispensability than *hypothetical* ripeness—we would need to shift from a **Property Rule** (right to exclude) to a **Liability Rule** (right to use upon payment) or a **Defensive Privilege**.

  **The Sketch:**
  1.  **Independent Invention Defense (IID):** A second inventor who can prove (by clear and convincing evidence) that they derived the solution without reference to the first patent is entitled to practice the invention royalty-free.
  2.  **Sliding Scale Term:** The duration of the patent is inversely proportional to the rate of convergence. If three independent teams file for the same patent within six months, the term is shortened (e.g., from 20 years to 5), acknowledging that the "inventive step" was small and the field was ripe.
  3.  **Compulsory Licensing for Convergence:** If independent invention is proven but not as a full defense, the second inventor pays a statutory royalty rather than being enjoined.

  **What this presupposes about credit:**
  *   **Invention as a Natural Right:** This system presupposes that thinking of an idea generates a moral claim to use it, regardless of state registration. It aligns more with Copyright (where independent creation is a defense) than Patent.
  *   **Value lies in Competition, not Disclosure:** It assumes the social benefit of having multiple producers (competition) outweighs the social benefit of forcing the second inventor to license from the first.
  *   **Epistemic Humility:** It admits that the Patent Office is bad at judging "obviousness" *ex ante*, so it allows the market to correct the record *ex post* via evidence of redundancy.

  **Why we don't have this:**
  The primary barrier is the **Function/Expression Distinction**.
  *   In Copyright, there are infinite ways to express a story. If two people write the same story, it's suspicious, but possible.
  *   In Patent, there are often finite ways to solve a technical problem. If two people arrive at the *exact* same mechanical configuration, it suggests the configuration is **dictated by nature or efficiency**.
  *   If the solution is dictated by nature, granting a monopoly to the first filer effectively removes a law of nature from the public domain. An Independent Invention Defense acknowledges this: "If we both found it, the solution was waiting there. You shouldn't own it."
  *   However, adopting this would require admitting that many patents are merely **discoveries of natural constraints**, not inventions. The current system avoids this admission by treating the first filer as the "owner" of the constraint for 20 years.

  ### On Your Intuition: Ripeness vs. Redundancy

  You asked if your distinction is carving at a joint or restating the puzzle.

  **It carves at a joint.**
  *   **Ripeness (Hypothetical Redundancy)** is an *ex ante* probability judgment. It asks: "How much incentive was needed to produce this?"
  *   **Redundancy (Actual)** is an *ex post* factual judgment. It asks: "How unique was this contributor?"

  **Why the law prefers Hypothetical over Actual:**
  The law prefers *ex ante* rules because they guide behavior. *Ex post* corrections are too costly.
  Your intuition is epistemically superior (actual existence is better proof of possibility than hypothetical prediction), but legally inferior (verifying actual independent invention is too expensive and creates too much uncertainty).

  **The Honest Verdict:**
  The current system is a **utilitarian compromise** that sacrifices **retributive justice** (giving credit where it is truly due) for **administrative efficiency** (clear titles and guaranteed disclosure).
  *   It denies the patent to the "ripe" inventor to save the public from low-value monopolies.
  *   It crushes the "redundant" inventor to save the system from the chaos of verifying mental states.

  The "oddity" you perceive is the scar tissue left by stitching together a **reward system** (which implies merit) and a **regulatory system** (which implies utility). The law pretends the inventor is a Hero to justify the monopoly, but treats them as a Functionary to limit its scope. Your historian friend is right that the "Great Man" theory is dead in the doctrine; your attorney friend is right that the "Great Man" fiction is necessary for the market to function. The system is coherent only if you accept that it is not trying to be just, only efficient.
