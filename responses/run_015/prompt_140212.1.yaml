  ### The Decision Tree

  **Node 1: The Dry Bed**
  When the elders say "dhamba" for the dry channel and the youth correct them, is one group actually mistaken about what the word *is*, or have they just agreed to use it differently now?
  *   **One is mistaken:** Go to Node 2.
  *   **Just using it differently:** Go to Node 4.

  **Node 2: The Outsider**
  If one group is mistaken, can your brother-in-law ever *know* which one is right using only observation, or is he forever stuck guessing their internal concept?
  *   **He can know:** Go to Node 3.
  *   **He is stuck guessing:** Go to Node 3.
  *(Note: We route both to Node 3 to distinguish the **type** of guessing limit.)*

  **Node 3: The Limit**
  If he is stuck guessing (or even if he thinks he knows), is that because human language is fundamentally private (a semantic wall), or just because he doesn't have enough time/data (a practical wall)?
  *   **Semantic Wall (In Principle):** Leaf 1.
  *   **Practical Wall (In Practice):** Leaf 2.
  *   **He Can Know (Convergence):** Leaf 3.

  **Node 4: The Rival**
  If they are just using it differently (no single fact), could he write a dictionary saying "dhamba = river channel" and a rival write "dhamba = flowing water," and both be right for *every* possible future case (including new dry beds)?
  *   **Yes, both fully right:** Leaf 4.
  *   **No, one will eventually fail:** Go to Node 5.

  **Node 5: The Counting**
  If one dictionary must fail, is it because the "say it twice for two rivers" rule forces the word to pick out discrete objects rather than stuff or events?
  *   **Yes, counting fixes it:** Go to Node 6.
  *   **No, counting is just habit:** Go to Node 7.

  **Node 6: The Joints**
  If counting fixes it, is it because "river" is a real object in the world that nature forces on them, or because their community treats it as an object?
  *   **Nature forces it:** Leaf 5.
  *   **Community treats it so:** Leaf 6.

  **Node 7: The Question**
  If counting doesn't fix it, is the question "what does it pick out?" confused, and should we only ask "when do they say it?"?
  *   **Yes, question is confused:** Leaf 7.
  *   **No, meaning is real but messy:** Leaf 8.

  ***

  ### The Leaves (Positions)

  Here are the eight positions. For each, I have mapped the **Three Theses** you identified:
  1.  **Swap:** You can systematically swap reference (rabbits vs. parts) without changing truth.
  2.  **Manual:** Two incompatible translation manuals can fit all evidence perfectly.
  3.  **Underdet:** This is just ordinary scientific underdetermination (like physics), nothing special about meaning.

  **Leaf 1: Epistemic Shadow** (Corresponds to your requirement *e*)
  *There is a fact, but it is in principle unreachable from the outside.*
  *   **Swap:** Reject. (Reference is fixed, just hidden).
  *   **Manual:** Reject. (Only one manual matches the hidden fact).
  *   **Underdet:** Accept. (But treated as a special semantic limit).
  *   *Note:* This position claims the uncertainty is metaphysical/epistemic, not semantic.

  **Leaf 2: Standard Underdetermination** (Corresponds to your requirement *d*)
  *There is a fact, but we lack the data to prove it, same as in physics.*
  *   **Swap:** Reject.
  *   **Manual:** Reject.
  *   **Underdet:** Accept. (Purely empirical limitation).

  **Leaf 3: Convergent Realism** (Corresponds to your requirement *b*)
  *There is a fact, and enough fieldwork converges on it.*
  *   **Swap:** Reject.
  *   **Manual:** Reject.
  *   **Underdet:** Reject. (Evidence eventually dictates one theory).

  **Leaf 4: Radical Indeterminacy** (Corresponds to your requirement *a*)
  *No fact of the matter; two manuals can fit every scrap of evidence.*
  *   **Swap:** Accept.
  *   **Manual:** Accept.
  *   **Underdet:** Reject. (This is stronger than physics; physics has a fact, this does not).

  **Leaf 5: Natural Kinds** (Corresponds to your requirement *c*)
  *No single fact initially, but nature makes one meaning "cut at the joints."*
  *   **Swap:** Reject. (Nature constrains the swap).
  *   **Manual:** Reject. (One manual fits nature better).
  *   **Underdet:** Reject. (Naturalness breaks the tie).

  **Leaf 6: Community Authority**
  *Meaning is constituted by the majority/elder vote, not nature or facts.*
  *   **Swap:** Reject. (The community fixes the reference).
  *   **Manual:** Reject. (One manual matches the community).
  *   **Underdet:** Reject. (The "fact" is social, not empirical).

  **Leaf 7: Deflationary Use** (Corresponds to your requirement *f*)
  *The question is confused; meaning is just use.*
  *   **Swap:** N/A (Rejects the framework).
  *   **Manual:** N/A.
  *   **Underdet:** N/A.
  *   *Note:* Dissolves the problem by denying "reference" exists as a theoretical entity.

  **Leaf 8: Pragmatic Realism**
  *Meaning is real but vague; there is a fact, but it allows borderline cases.*
  *   **Swap:** Reject.
  *   **Manual:** Reject.
  *   **Underdet:** Accept. (Vagueness creates local underdetermination).

  ***

  ### Analysis of the Three Theses

  You asked to see which combinations of the three theses are occupied.

  *   **Theses:** [Swap, Manual, Underdet]
  *   **Leaf 1 (Shadow):** [No, No, Yes]
  *   **Leaf 2 (Standard):** [No, No, Yes]
  *   **Leaf 3 (Convergent):** [No, No, No]
  *   **Leaf 4 (Radical):** [Yes, Yes, No]
  *   **Leaf 5 (Natural):** [No, No, No]
  *   **Leaf 6 (Authority):** [No, No, No]
  *   **Leaf 7 (Deflation):** [N/A, N/A, N/A]
  *   **Leaf 8 (Pragmatic):** [No, No, Yes]

  **Empty Combinations:**
  *   **[Yes, No, ...]:** Incoherent. If you can systematically swap reference (Thesis 1), you can necessarily write two manuals that fit the evidence (Thesis 2). You cannot have ontological relativity without translation indeterminacy.
  *   **[No, Yes, No]:** Unattractive. This claims reference is fixed (No Swap) but two manuals still fit all evidence (Manual), yet it's *not* just underdetermination (No Underdet). This implies a magical duplication of truth without the semantic freedom to explain it. Nobody defends this.
  *   **[Yes, Yes, Yes]:** Unoccupied. This claims reference is swapped, manuals fit, *and* it's just like physics. Quineans argue it is *not* like physics (physics has facts, translation doesn't). To accept this is to collapse the distinction between Leaf 4 and Leaf 2, which most philosophers resist.

  ***

  ### Collapsed Distinctions

  **Leaf 1 (Epistemic Shadow) vs. Leaf 2 (Standard Underdetermination)**
  You suspected these collapse. You are right.
  *   **The Problem:** Leaf 1 claims the fact is unreachable *in principle* (semantic wall). Leaf 2 claims it is unreachable *in practice* (data wall).
  *   **The Collapse:** At the level of observation, these are identical. Your brother-in-law will never have "infinite time/data." If he admits he can't prove the fact *now*, he cannot prove he wouldn't be able to prove it *later* without invoking a metaphysical assumption he can't test.
  *   **Verdict:** The tree separates them at Node 3, but in a dinner conversation, he cannot distinguish them without appealing to intuition. If he says "I can't know," press him: "Is that because you need more years, or because no amount of years would work?" If he hedges, they have collapsed.

  ***

  ### Load-Bearing Evidence

  You suspected the **Counting** evidence (two rivers = say it twice) is the load-bearing one, and the **Generational Split** (dry bed) is a red herring.

  **The Tree Agrees, with a Caveat.**

  1.  **The Counting Evidence (Node 5):** This is the only piece of evidence that attacks **Thesis 1 (Swap)**.
      *   Without it, "dhamba" could be a mass noun (like "water") or a stage noun (like "lightning"). If it's a mass noun, you *can* swap reference to "undetached river parts" without changing the truth conditions of the sentences.
      *   Because they count it ("dhamba, dhamba"), it behaves like a discrete object. This makes the "rabbit vs. rabbit part" swap much harder to sustain. It forces individuation.
      *   **If you delete this:** The argument slides immediately into Leaf 4 (Radical Indeterminacy). The "Swap" thesis becomes viable.

  2.  **The Generational Split (Node 1):** This drives the **Fact vs. No-Fact** debate.
      *   It creates the tension for Node 1. However, it is easier to dismiss. A linguist can simply say "Language change occurred," which pushes you to the "No Fact" branch (Node 4) without much fight.
      *   **If you delete this:** The tree defaults to "Fact Exists" (Node 2), but you lose the leverage to ask about the *nature* of that fact (Shadow vs. Standard).

  **Conclusion:** The **Counting** evidence is the strategic nuclear option. If he admits that "saying it twice" proves they are counting objects, he concedes that reference is individuated. This kills the "Gavagai" style swap argument. The Generational Split is useful only to force him to choose between Realism and Indeterminacy, but the Counting evidence is what prevents him from claiming *both* are valid translations.
