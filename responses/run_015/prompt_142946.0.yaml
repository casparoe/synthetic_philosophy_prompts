answer: |-
  # Standard Operating Procedure: Iterated Elimination of Dominated Strategies (IEDS)

  **Course:** Game Theory (Year 2)  
  **Audience:** Instructor and Teaching Assistants  
  **Scope:** Finite, two-player games, max 3 actions per player.  
  **Objective:** Standardize the grading of IEDS solutions, specifically regarding mixed-strategy dominance and partial credit.

  ---

  ## 1. The Elimination Ledger (Student Requirement)
  **[Convention]** Students must present their solution as a sequential ledger. A "blob" of crossed-out matrices is insufficient for full credit. The ledger must contain:
  1.  **Round Number:** (1, 2, 3...)
  2.  **Player:** (Row or Column)
  3.  **Deleted Action:** (e.g., "C")
  4.  **Dominator:** (e.g., "Pure A" or "Mix: 0.5A + 0.5B")
  5.  **Verification:** A brief inequality showing payoffs (e.g., $3 > 2$ against X, $3 > 2$ against Y).

  **[Rule of Thumb]** **Depth Count:** We will track the number of rounds and the number of *mixed* dominators used.
  *   **Verdict on Metric:** This is a **weak measure** of understanding. A student who finds one complex mixed dominator may understand more than a student who finds five trivial pure dominators. Use the count to identify *effort* for partial credit, but do not weight it heavier than the correctness of the final surviving set.

  ---

  ## 2. The Procedure (TA Execution Guide)

  ### Phase 1: Pure Dominance Sweep
  **[Theorem]** **[Finite Only]** In any finite game, if a strategy is strictly dominated, it remains strictly dominated after removing other strictly dominated strategies. Order of elimination does not change the final set of rationalizable strategies.
  **[Convention]** **Mixtures-Last Rule:** TAs must check for *pure* strict dominance before checking for *mixed* strict dominance within each round.
  *   **Rationale:** Pure dominance is faster to verify. Since strict dominance is order-independent, deferring mixed checks does not change the mathematical outcome, only the administrative flow.
  *   **Instruction:** In Round $k$, scan all players for actions strictly dominated by a *single* other action. Eliminate all found. Only if no pure deletions occur do you proceed to Phase 2 for that round.

  ### Phase 2: Mixed Dominance Test (Hand-Checkable)
  **[2-Player Only]** **[Finite Only]** This test applies when a player has 3 surviving actions ($\{1, 2, 3\}$) and the opponent has 2 or 3 surviving actions. We test if Action 3 is dominated by a mixture of 1 and 2.

  **The Interval Method (TA Tool):**
  To check if Action 3 is strictly dominated by $\lambda \cdot \text{Action}_1 + (1-\lambda) \cdot \text{Action}_2$:
  1.  **Set up Inequalities:** For *each* of the opponent's surviving strategies $j$, write the inequality:
      $$ \lambda u(1, j) + (1-\lambda) u(2, j) > u(3, j) $$
  2.  **Solve for $\lambda$:** Rearrange each inequality to find the valid range for $\lambda$ (e.g., $\lambda > 0.4$ or $\lambda < 0.8$).
      *   *Note:* If $u(1,j) = u(2,j)$, the $\lambda$ term vanishes. If the constant inequality holds, the range is $[0,1]$. If not, no $\lambda$ works (stop).
  3.  **Intersect Ranges:** Find the intersection of all ranges derived from the opponent's strategies.
  4.  **Verdict:**
      *   If the intersection contains any value strictly between 0 and 1 (e.g., $0.4 < \lambda < 0.8$), **Action 3 is dominated.** Record a specific $\lambda$ from this range (e.g., 0.5) in the ledger.
      *   If the intersection is empty or contains only 0 or 1, **Action 3 is not dominated.**

  **[Rule of Thumb]** **Beyond 3 Actions:** If a player has 4+ actions, this hand-check fails (requires Linear Programming). In this course, we cap questions at 3 actions to avoid this. If a student attempts IEDS on a 4-action game, grade only the pure dominance steps.

  ### Phase 3: Stopping Rules & Interpretation
  **[Theorem]** **[Finite Only]** IEDS using *strict* dominance preserves all Nash Equilibria (NE). The surviving strategies are the **Rationalizable** strategies.

  | Stopping State | Description | Student Conclusion Allowed | TA Grading Note |
  | :--- | :--- | :--- | :--- |
  | **State 1** | Exactly one profile remains (e.g., $\{A\} \times \{X\}$). | "Unique NE and Unique Rationalizable outcome." | Full Credit. |
  | **State 2** | Multiple profiles remain; no further dominance possible. | "All remaining profiles are Rationalizable. NE must be within this set, but not all are necessarily NE." | Full Credit. Do not penalize for not finding specific NE unless asked. |
  | **State 3** | Nothing moves, but student claims "No NE". | **Incorrect.** | Deduct Credit. IEDS cannot prove non-existence of NE. |

  ---

  ## 3. Marking Weak vs. Strict Dominance
  **[Theorem]** **Order Dependence:** Iterated elimination of *weakly* dominated strategies is order-dependent and can eliminate Nash Equilibria.
  **[Convention]** **Strict Requirement:** Unless the question explicitly asks for "Weak Dominance," students must demonstrate **strict** inequality ($>$) for all opponent strategies.

  **Grading Penalty Matrix:**
  1.  **Claimed Strict, Actually Weak:** Student writes $>$ but payoffs show equality in one case (e.g., $2 \geq 2$ and $3 > 1$).
      *   **Penalty:** Treat as a **Verification Error**. Deduct 50% credit for that step. If this step was crucial to the final solution, cap maximum grade at 70%.
  2.  **Used Weak Deliberately:** Student writes $\geq$ and eliminates.
      *   **Penalty:** **Method Error.** Deduct 50% credit immediately. If the elimination removed a Nash Equilibrium required by the question, cap maximum grade at 50%.
  3.  **Result Correct by Luck:** Student used weak dominance, deleted an equilibrium, but the remaining profile *is* an NE.
      *   **Penalty:** Still apply Method Error. The logic is flawed even if the answer matches.

  ---

  ## 4. Procedure Execution on Requested Games

  ### Game 1 Analysis
  **Setup:** Row {A, B, C}, Col {X, Y}.
  Row Payoffs: A(0,6), B(6,0), C(2,2).
  Col Payoffs: X(1,0,2), Y(0,1,2).

  **Round 1:**
  *   **Pure Check:**
      *   Row: A vs B (crossing), C vs A (2>0, 2<6), C vs B (2<6, 2>0). No pure dominance.
      *   Col: X vs Y (1>0, 0<1, 2=2). No strict dominance (equality on C).
  *   **Mixed Check (Row):**
      *   Test if C is dominated by $\lambda A + (1-\lambda) B$.
      *   Vs X: $0\lambda + 6(1-\lambda) > 2 \Rightarrow 6 - 6\lambda > 2 \Rightarrow 4 > 6\lambda \Rightarrow \lambda < 2/3$.
      *   Vs Y: $6\lambda + 0(1-\lambda) > 2 \Rightarrow 6\lambda > 2 \Rightarrow \lambda > 1/3$.
      *   Intersection: $1/3 < \lambda < 2/3$. Valid (e.g., $\lambda = 0.5$).
      *   **Action:** Delete C. Dominator: Mix(0.5A, 0.5B).
  *   **Mixed Check (Col):**
      *   Test X vs Y mix. Payoffs (1,0,2) vs (0,1,2).
      *   Vs C (still present for Col check in Round 1? **[Convention]** Simultaneous rounds preferred for grading consistency).
      *   Even if C is gone for Col in Round 2: Vs A (1>0), Vs B (0<1). No dominance.
      *   **Action:** No deletion.

  **Round 2 (After C removed):**
  *   Row {A, B}, Col {X, Y}.
  *   Row: (0,6) vs (6,0). No dominance.
  *   Col: (1,0) vs (0,1). No dominance.
  *   **Stop.**

  **Verdict:** Your expectation was **Correct**. C is deleted by mixture; game stalls with 4 profiles. All 4 are rationalizable; NE are (A,Y) and (B,X).

