  ### Game 3 (Custom Weak Dominance Trap)
  **Setup:** Row {U, D}, Col {L, R}.
  Payoffs (Row, Col):
  *   (U, L) = (1, 1)
  *   (U, R) = (0, 0)
  *   (D, L) = (1, 1)
  *   (D, R) = (2, 2)

  **Nash Equilibria:** (U, L) and (D, R).

  **Student Error Scenario:**
  1.  Student checks Row: D vs U.
      *   Against L: $1 = 1$.
      *   Against R: $2 > 0$.
      *   Student claims: "D weakly dominates U, eliminate U." **(Method Error)**.
  2.  Game reduces to Row D vs Col {L, R}.
      *   Col Payoffs: L=1, R=2.
      *   Col eliminates L (Strict).
  3.  **Result:** (D, R).

  **Grading:**
  *   The student found *a* NE, but missed (U, L).
  *   Because the question asks to "solve by IEDS" (implied strict), using weak dominance is a fundamental conceptual failure.
  *   **Score:** Max 50%. The logic deleted a valid equilibrium.

