  ### Game 2 Analysis
  **Setup:** Row {A, B, C}, Col {X, Y, Z}.
  Row Payoffs: A(2,2,2), B(0,0,5), C(1,1,1).
  Col Payoffs (vs Row):
  *   A: X=4, Y=0, Z=1
  *   B: X=0, Y=4, Z=1
  *   C: X=0, Y=0, Z=2

  **Round 1:**
  *   **Pure Check (Row):**
      *   A vs C: $2>1, 2>1, 2>1$. **A strictly dominates C.**
      *   **Action:** Delete C.
  *   **Pure Check (Col):**
      *   X vs Z: Vs A (4>1), Vs B (0<1). No.
      *   Y vs Z: Vs A (0<1), Vs B (4>1). No.
      *   **Action:** None.
  *   **Mixed Check (Col):**
      *   Test Z vs Mix(X,Y). Must check against A, B, *and C* (since C is not removed until end of round).
      *   Vs C: Mix(X,Y) gives 0. Z gives 2. $0 > 2$ is False.
      *   **Action:** Z is **not** dominated in Round 1 because C is still active.

  **Round 2 (C is gone):**
  *   **Pure Check (Col):**
      *   Now check Z vs Mix(X,Y) against {A, B}.
      *   Vs A: $4\lambda + 0(1-\lambda) > 1 \Rightarrow \lambda > 0.25$.
      *   Vs B: $0\lambda + 4(1-\lambda) > 1 \Rightarrow 4 - 4\lambda > 1 \Rightarrow \lambda < 0.75$.
      *   Intersection: $0.25 < \lambda < 0.75$. Valid.
      *   **Action:** Delete Z. Dominator: Mix(0.5X, 0.5Y).
  *   **Pure Check (Row):**
      *   Remaining: A(2,2), B(0,0) against {X, Y}.
      *   A strictly dominates B ($2>0, 2>0$).
      *   **Action:** Delete B.
  *   **Pure Check (Col):**
      *   Remaining: X(4), Y(0) against {A}.
      *   X strictly dominates Y.
      *   **Action:** Delete Y.

  **Verdict:** Your expectation was **Correct**. C must go first (Pure). This removes the "shield" for Z (the payoff 2 against C). Once C is gone, Z falls to a mixture. Game collapses to (A,X).

