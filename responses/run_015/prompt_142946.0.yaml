prompt: |-
  I convene a second-year game theory course: about 60 students, roughly 600 exam scripts a year marked by four TAs whose own training stops at a first undergraduate course. Answers are hand-written, 20–25 minutes per normal-form question, no solvers, games with at most three actions per player. I want one written procedure that my TAs and I can all run when a question asks students to solve by iterated elimination of dominated strategies, so that we agree on what a complete solution looks like and on how partial credit is assigned.

  The part I cannot pin down is the mixed-dominator step. I currently tell students to clear every strictly dominated pure action first, and only afterwards to ask whether some surviving action is strictly dominated by a mixture, repeating the cycle until nothing moves. Please turn that into something a TA can actually execute:

  - a hand-checkable test for whether an action is strictly dominated by some mixture of the others, done properly for the cases of two and three surviving actions and stated so that someone who has forgotten linear programming can still apply it, together with an honest account of what breaks beyond three actions;
  - a stopping rule, and what each of the three stopping states entitles a student to conclude — one profile left, several profiles left, nothing moving but more than one profile surviving — both about Nash equilibria and about which strategies are still rationalizable;
  - how to mark an elimination that appealed to weak rather than strict dominance, given that weak elimination is order-dependent and can delete equilibria, so that a smooth-looking but illegitimate solution gets partial credit and not full credit;
  - an elimination ledger the students write down and we grade: the sequence of deletions, the dominator exhibited for each (a pure action, or a mixture with its probabilities), and a depth count — number of rounds, and how many of the deletions required a mixed dominator. I use that count for partial credit; tell me if it is a bad measure and what to use instead.

  Run the procedure on the two games below, and on one 2×2 of your own choosing in which a student's use of weak dominance would delete the equilibrium the question asks for.

  Game 1. Row chooses A, B, C; Column chooses X, Y. Payoffs (row, column): (A,X) = (0,1); (A,Y) = (6,0); (B,X) = (6,0); (B,Y) = (0,1); (C,X) = (2,2); (C,Y) = (2,2). I expect the mixed step to delete C and then for everything to stall; if that is wrong, say so.

  Game 2. Row chooses A, B, C; Column chooses X, Y, Z. Row's payoffs against (X,Y,Z): A = (2,2,2), B = (0,0,5), C = (1,1,1). Column's payoffs: against A, X = 4, Y = 0, Z = 1; against B, X = 0, Y = 4, Z = 1; against C, X = 0, Y = 0, Z = 2. I expect nothing to be mixture-dominated at the start, the deletion of C to unlock a mixed domination of Z, and the game then to collapse to a single profile; correct me if either the description or the expectation is wrong.

  Two last requests. Label every step of the procedure as theorem, convention, or rule of thumb, and flag any step that holds only for two-player games or only for finite games. If the mixtures-last rule is indefensible, or if depth-counting is a bad grading measure, say so plainly rather than working around it. Finish with a line \answer{...} giving a short verdict on the mixtures-last rule.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** Second-year game theory course, ~60 students, 4 TAs (limited training), handwritten exams.
      *   **Task:** Create a standardized written procedure for grading/solving Iterated Elimination of Dominated Strategies (IEDS), specifically focusing on *mixed* dominance.
      *   **Specific Requirements:**
          *   Hand-checkable test for mixed dominance (2-3 actions).
          *   Stopping rules and interpretations (Nash Equilibrium vs. Rationalizability).
          *   Marking scheme for weak vs. strict dominance errors.
          *   Elimination ledger (student output) and grading metric (depth count).
          *   Run the procedure on two provided games + one custom 2x2 example.
          *   Label steps (Theorem, Convention, Rule of Thumb).
          *   Flag limitations (2-player, finite).
          *   Honest assessment of "mixtures-last" rule and "depth-count" metric.
          *   Final verdict line `\answer{...}`.

  2.  **Deconstruct the "Mixed-Dominator" Problem:**
      *   *Challenge:* TAs don't know Linear Programming (LP). Students need a way to check if $u_i(a_i, s_{-i}) < \sum \sigma_j u_i(a_j, s_{-i})$ without solving an optimization problem.
      *   *Case 2 Actions:* If only 2 actions survive for a player, can one be dominated by a mixture of the *others*? No, because there's only one "other". Mixed dominance requires at least 2 other actions to mix. So, with 2 actions, only pure dominance is possible.
      *   *Case 3 Actions:* If 3 actions survive ($A, B, C$), can $C$ be dominated by a mix of $A$ and $B$? Yes.
      *   *Hand-Checkable Test:* For 3 actions, checking if $C$ is dominated by $\lambda A + (1-\lambda) B$ reduces to checking if the payoff vector of $C$ lies strictly below the line segment connecting payoff vectors of $A$ and $B$ in the payoff space (where dimensions correspond to opponent profiles).
      *   *Simplification:* Since the opponent has finite strategies, we can treat payoffs as vectors. For 2 opponent strategies (2D), this is geometric. For 3 opponent strategies (3D), it's harder to visualize but algebraically solvable via inequalities.
      *   *Constraint:* The prompt specifies games with *at most three actions per player*. This simplifies things immensely.
      *   *The "Mixtures-Last" Rule:* The user proposes: Clear pure dominance first, *then* check mixed. Is this defensible?
          *   *Theory:* Strict dominance (pure or mixed) is order-independent. If a strategy is strictly dominated, it remains strictly dominated after removing other strictly dominated strategies.
          *   *Efficiency:* Checking pure dominance is easier. If $A$ dominates $B$ purely, you don't need to check if a mix of $A$ and $C$ dominates $B$.
          *   *Verdict:* It is a safe *heuristic* for solving, but technically, the set of strictly dominated strategies is the same regardless of order. However, for *grading*, enforcing an order helps standardize the "ledger".
          *   *Risk:* If a student finds a mixed dominator *before* eliminating a purely dominated one, is it wrong? No. But for standardization, we need a convention.
          *   *Correction:* The prompt asks if "mixtures-last" is indefensible. It's not indefensible, but it's not a theorem. It's a convention for administrative ease.

  3.  **Develop the Hand-Checkable Test (for TAs):**
      *   *Scenario:* Player has actions $\{1, 2, 3\}$. Check if 3 is dominated by mix of 1 and 2.
      *   *Opponent:* Has actions $\{L, M, R\}$ (max 3).
      *   *Payoffs:* $u_1, u_2, u_3$ are vectors.
      *   *Condition:* Exists $\lambda \in (0,1)$ such that $\lambda u_1 + (1-\lambda) u_2 > u_3$ (component-wise strict inequality).
      *   *TA Procedure:*
          1.  Check pure dominance first (easier).
          2.  If not purely dominated, check if $u_3$ is "inside" the cone of $u_1, u_2$.
          3.  *2 Opponent Actions (2D):* Plot points $(u_1(L), u_1(R))$, etc. Is point 3 below the segment 1-2? Algebraically: Check endpoints. If $u_1 > u_3$ and $u_2 < u_3$ (crossing), a mix might work. Solve for $\lambda$ using one equation, check the other.
          4.  *3 Opponent Actions (3D):* Harder to visualize. Algebraic approach: Set up inequalities. $\lambda u_1(k) + (1-\lambda) u_2(k) > u_3(k)$ for all $k$. This gives a range for $\lambda$. If the intersection of ranges is non-empty, it works.
      *   *Refinement for TAs:* Since max actions is 3, the opponent has max 3 strategies.
      *   *Test:* Solve $\lambda u_1 + (1-\lambda) u_2 = u_3$ for one opponent strategy to find candidate $\lambda^*$. Check if this $\lambda^*$ satisfies strict inequality for *all* other opponent strategies.
      *   *Caveat:* This works if the "binding" constraint is unique. If there are 3 opponent strategies, we need $\lambda$ to satisfy 3 inequalities.
      *   *Simplified TA Rule:* "The Two-Point Check." Pick two opponent strategies where the ranking of actions differs (otherwise pure dominance likely holds). Solve for $\lambda$ that equalizes payoffs on one strategy. Check if that $\lambda$ yields strict dominance on the others.

  4.  **Stopping Rules & Interpretations:**
      *   *State 1: One profile left.*
          *   Conclusion: Unique NE, Unique Rationalizable.
      *   *State 2: Multiple profiles left, no more dominance.*
          *   Conclusion: All remaining profiles are Rationalizable. NE must be among them (but not all are necessarily NE).
      *   *State 3: Nothing moving (but more than one action per player).*
          *   Same as State 2.
      *   *Distinction:* IEDS (strict) preserves NE. It finds Rationalizable strategies. If one profile remains, it's the unique NE. If more remain, NE are a subset.

  5.  **Weak vs. Strict Dominance Marking:**
      *   *Issue:* Weak dominance is order-dependent. Eliminating weakly dominated strategies can remove NE.
      *   *Rule:* If the question asks for IEDS (implied Strict), using Weak is a conceptual error.
      *   *Grading:*
          *   If they use weak dominance but acknowledge it (write $\geq$): Deduct significant credit (conceptual error).
          *   If they claim strict ($>$) but it's actually weak ($\geq$ with equality somewhere): Deduct credit for verification error.
          *   If the result happens to be correct (NE preserved): Still deduct, because the method is flawed for general cases.
      *   *Policy:* "Strict Dominance Required." Any use of $\geq$ without strict inequality everywhere is a "Method Error."

  6.  **The Ledger & Depth Count:**
      *   *Ledger:* Round #, Player, Removed Action, Dominator (Pure or Mix $\lambda$), Justification (Payoff comparison).
      *   *Depth Count:* Number of rounds.
      *   *Metric:* Is "number of mixed deletions" a good grade metric?
          *   *Pros:* Rewards finding harder dominators.
          *   *Cons:* Arbitrary. One mixed deletion might be harder than 5 pure ones.
          *   *Verdict:* It's a weak metric. Better to grade based on *correctness of the final set* and *validity of each step*. The "count" is good for tracking effort, not necessarily quality. I should advise the user that depth count is a "Rule of Thumb" for partial credit, not a rigorous measure of understanding.

