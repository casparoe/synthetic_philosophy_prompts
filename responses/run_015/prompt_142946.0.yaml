          *   *Step 1 (Pure):*
              *   Row: A vs B? No. C vs A? 2>0, 2<6. No. C vs B? 2<6, 2>0. No.
              *   Col: X vs Y? 1>0, 0<1, 2=2. No strict dominance.
          *   *Step 2 (Mixed):*
              *   Row: Is C dominated by mix of A, B?
              *   Let $\lambda A + (1-\lambda) B$.
              *   Against X: $\lambda(0) + (1-\lambda)6 = 6 - 6\lambda$. Need $> 2$. $\Rightarrow 4 > 6\lambda \Rightarrow \lambda < 2/3$.
              *   Against Y: $\lambda(6) + (1-\lambda)0 = 6\lambda$. Need $> 2$. $\Rightarrow \lambda > 1/3$.
              *   Range: $1/3 < \lambda < 2/3$. Exists (e.g., $\lambda=0.5$).
              *   **C is strictly dominated.** Remove C.
