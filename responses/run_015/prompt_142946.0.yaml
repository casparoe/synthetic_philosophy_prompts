  ## 5. Limitations & Verdicts

  **[2-Player Only]** The "Interval Method" for mixed dominance becomes exponentially harder for TAs to check by hand in 3+ player games (payoffs depend on profiles, not single opponent actions). This procedure is invalid for $N > 2$.

  **[Finite Only]** IEDS logic relies on finite strategy sets to guarantee termination.

  **Verdict on Mixtures-Last Rule:**
  It is **not indefensible**. Since strict dominance (pure or mixed) is order-independent, checking pure first is an optimization, not a mathematical constraint. It reduces TA grading time without altering the correct solution set.

  **Verdict on Depth-Count Metric:**
  It is a **bad measure** of competency. It measures *volume* of elimination, not *insight*. A student who identifies that "nothing moves" in Round 1 has solved the game as correctly as one who eliminates 10 strategies in 10 rounds. Use depth count only to differentiate between "blank page" and "attempted work" for partial credit, not to distinguish A from B grades.

  \answer{The mixtures-last rule is a defensible convention for grading efficiency, not a mathematical necessity.}
