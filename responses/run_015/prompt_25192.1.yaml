      *   *Case 7 (Cryopreservation):* Intuition says "Me," but worries about consistency with Case 3.

  3.  **Identify the Underlying Philosophical Principles:**
      *   **Kripkean Origin Essentialism:** An individual originates from a specific zygote (or specific gametes). If the origin is different, the individual is different.
      *   **The "No Branching" Rule:** Identity is a one-to-one relation. If one zygote becomes two people (twins), neither can be identical to the original zygote *if* we assume the zygote was already "me." However, usually, we say "I began as a zygote." If that zygote splits, *which one* is me? The intuition (Case 3) is "neither." This suggests a "Non-Branching Constraint" on identity.
      *   **Continuity vs. Constitution:** Is it the material, the structure, or the history? Case 5 rules out structure (DNA). Case 1 rules out just "parents." It points to *causal history*.
