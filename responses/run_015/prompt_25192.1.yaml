      *   *Check Case 7 again.* Does cryopreservation interrupt the "life" process? Biologically, metabolism stops. Is that death? If it's death, then Case 7 is "Not Me" (resurrection). If it's suspended animation, it's "Me." The user's intuition is "Me." The principle should support suspended animation as continuous existence.
