  7.  **Final Polish:** Check against the "no hedging" constraint. Ensure the advice is practical for a writer. (e.g., "Your character shouldn't sound uncertain; they should sound certain about God's power.")

  8.  *(Final thought before generating)*: Make sure to emphasize that for Ghazali, *'ada* isn't just a habit God *might* break; it's a promise God *keeps*. That's the key to the science compatibility.

  9.  **Constructing the Output.** (Proceed to generate response based on these points.)
answer: |-
  Your friend's summary is **superficially accurate but philosophically shallow.** It gets the *mechanics* of Al-Ghazali's occasionalism right but misses the *metaphysics* and the *theological stakes*. If your character speaks like your friend's summary, they will sound like a skeptical philosopher having a religious crisis. If they speak like Al-Ghazali, they will sound like a devout theologian protecting the sovereignty of God.

  Here is the committed breakdown:

  ### 1. The Accurate Parts
  Your friend is correct on the basic assertions:
  *   **The Fire/Cotton Example:** This is the famous example from *The Incoherence of the Philosophers* (*Tahafut al-Falasifa*). Ghazali argues the burning is not in the fire; it is a creation of God at the moment of contact.
  *   **The Motivation:** He did this to protect miracles (if nature is necessary, miracles are impossible) and human free will (if cause/effect is deterministic, humans are robots).
  *   **The Terminology:** *Al-'ada* (custom or habit) is indeed the term used for the regularity of nature.
  *   **No Created Causality:** Ghazali denies that created things possess efficient causal power (*ta'thir*). Only God has power.

  ### 2. The Hume Comparison: It Collapses
  Your friend claims this is "Hume's skepticism in Islamic dress." **This is wrong.** It is a category error.

  *   **Hume is Epistemological:** Hume argues that human beings *cannot know* if there is a necessary connection between cause and effect. He suspends judgment on whether the power exists in reality; he just says we can't perceive it. Hume is comfortable living in a world where we pretend causes exist because it's useful.
  *   **Ghazali is Ontological:** Ghazali argues there *is no* necessary connection in reality. It is not that we can't know it; it is that it does not exist. To say fire has the power to burn is, for Ghazali, a form of idolatry (*shirk*) because it assigns divine creative power to an object.
  *   **The Stance:** Hume is a skeptic who doubts human knowledge. Ghazali is a dogmatist who is certain about God's exclusive agency.

  **For your novel:** If your character is Ghazalian, they should not sound unsure or skeptical. They should sound *more* certain than a scientist. A scientist says, "Fire burns cotton because of chemical laws." Your character should say, "Fire does not burn. God burns the cotton, and He usually chooses to do it when fire is present." That is a claim about reality, not just a limit on knowledge.

  ### 3. The Science Question: Your Friend is Wrong
  Your friend claims Ghazali "left no room for science since God could break the pattern anytime." **This is a fundamental misunderstanding of *al-'ada*.**

  *   **God's Promise:** For Ghazali, God's "Habit" (*'ada*) is not a whim. It is a self-imposed consistency. God is truthful (*Sadiq*). If He established a pattern, He maintains it unless He wills a miracle.
  *   **Predictability:** Science relies on predictability, not metaphysical necessity. Ghazali grants full predictability. You can plant seeds and expect crops. You can study medicine and expect cures. The *expectation* is secure because God's habit is reliable, not because the seed has power.
  *   **The Role of Science:** In Ghazali's view, science is the study of God's habits. It is entirely compatible with observation and experimentation. It is only incompatible with the *philosophical claim* that nature operates independently of God.

  **For your novel:** Your character should not reject medicine or agriculture. They should reject the *pride* of the physician who thinks *he* cured the patient. The physician was merely the occasion; God was the healer. This allows your character to function in the world while maintaining their theological stance.

  ### 4. What Your Friend Missed: *Tawhid*
  The driving force of Ghazali's occasionalism is not just "saving free will." It is **Tawhid (Divine Unity).**

  If fire has the inherent power to burn, then fire possesses an attribute (creative power) that belongs exclusively to God. For Ghazali, this fragments the unity of the universe. It makes "Nature" a rival god that operates on its own rules which even God must follow. By stripping nature of causality, Ghazali ensures the universe is utterly dependent on God at every single micro-second.

  **The Character's Psychology:**
  Your friend's summary suggests a character who thinks, "Maybe nothing causes anything."
  A true Ghazalian character thinks, "Everything is an immediate manifestation of God's will."
  This is not a nihilistic view; it is a **sacramental** view. Every event is a direct message from God.

  ### Verdict for Your Writing
  **Do not write your character as a Humean skeptic.**
  *   **Humean Character:** "I can't be sure the fire will burn the cotton. It's just habit." (Uncertain, psychological focus)
  *   **Ghazalian Character:** "The fire *cannot* burn the cotton. Only God burns. He promises to do it when fire is present, so I will not fear the fire unless He wills otherwise." (Certain, theological focus)

  **The "Science" Conflict:**
  The conflict in your novel shouldn't be "Science vs. Religion." It should be "Autonomous Nature vs. Dependent Nature."
  *   **Opponent:** Believes the universe is a machine that runs itself.
  *   **Your Character:** Believes the universe is a painting being painted anew in every instant.

  **Final Call:** Your friend's summary is a useful shortcut for a plot blurb, but it is philosophically inaccurate regarding Hume and practically inaccurate regarding science. Use the mechanics they described, but change the *voice* from skepticism to absolute theological certainty. That is where the drama lies.
