answer: |-
  # THE PERSISTENCE SORTER
  **A Diagnostic Tree for Metaphysics Reading Groups**

  **Instructions:** Start at **NODE 1**. Follow the path that matches your *pre-theoretical intuition* about the case, not the label you think you want. Answer in good faith. If you hesitate, pick the option that requires the least amount of "theoretical cleanup" later.

  ---

  ### NODE 1: THE BANANA (The Problem of Change)
  *A banana is green on Monday and yellow on Friday. Nothing can be both green-all-over and yellow-all-over. How is the claim "It is the same banana" true?*

  *   **A.** The banana has different **parts** at different times, just like it has different spatial parts (top/bottom). The Monday-part is green; the Friday-part is yellow.
      *   → Go to **NODE 2**.
  *   **B.** The **whole** banana is present on Monday and the **whole** banana is present on Friday. It doesn't have temporal parts.
      *   → Go to **NODE 3**.

  ### NODE 2: THE POKER (Space/Time Analogy)
  *If a poker is hot at one end and cold at the other, we don't panic. If it is hot on Monday and cold on Friday, why is that harder?*

  *   **A.** It *shouldn't* be harder. Time is just another dimension. The poker is a long "spacetime worm." When you say "The Poker," you refer to the whole worm.
      *   → Go to **NODE 4 (Fission)**.
  *   **B.** Time isn't like space. When you say "The Poker," you usually mean the instantaneous **stage** existing right now. Talk of "persistence" is just talking about how this stage relates to other stages.
      *   → **LEAF: STAGE THEORY**.

  ### NODE 3: THE PROPERTIES (Wholly Present Solutions)
  *If the whole banana is there on Monday and Friday, how do we avoid contradiction?*

  *   **A.** Properties are **relations**. The banana doesn't have "greenness," it has "greenness-at-Monday." Time is part of the property.
      *   → **LEAF: RELATIONAL ENDURANTISM**.
  *   **B.** Properties are **modified**. The banana has "greenness," but it has it *temporally*. "Being green" is modified by "at Monday" (like "walking slowly").
      *   → **LEAF: ADVERBIAL ENDURANTISM**.
  *   **C.** Only the present exists. The banana was green (past tense fact), now it is yellow. No contradiction because the green banana doesn't exist *now*.
      *   → **LEAF: PRESENTIST ENDURANTISM**.

  ### NODE 4: THE AMOEBA (Fission Test)
  *An amoeba (A) splits into B and C. Both are psychologically/physically continuous with A. Did A survive?*

  *   **A.** **Yes, but it's indeterminate which one.** There were actually two overlapping worms all along, diverging at the split. "A" refers to one, but we can't tell which.
      *   → **LEAF: WORM THEORY**.
  *   **B.** **Yes, in a sense.** The pre-split stage (A) has *two* future counterparts (B and C). "A survives" is true if *a* counterpart survives. No identity claim needed.
      *   → **LEAF: STAGE THEORY** (Re-routed from Node 2).
  *   **C.** **No.** Identity is one-to-one. A went out of existence; B and C are new. (Or: A is identical to the fusion of B+C).
      *   → **LEAF: TERMINALIST / FUSION VIEW**.

  ### NODE 5: THE PEW (Coincidence Check)
  *A Catholic sits in a pew. A lump of matter shaped exactly like a person sits in the pew. Are there two things there?*

  *   **A.** **Yes.** One is a Person (essential psychological properties), one is a Lump (essential material properties). They share space but differ in modal properties (what *could* happen to them).
      *   *(Common for Endurantists, rare for Perdurantists).*
  *   **B.** **No.** "Person" and "Lump" are just two ways of counting the same underlying stuff.
      *   *(Common for Perdurantists, some Endurantists).*

  ### NODE 6: THE FETUS (Past Self)
  *Compare: (1) "I was once a fetus." (2) "There was a fetus where I now stand."*

  *   **A.** **(1) is true.** I am strictly identical to that fetus. We are the same object at different times.
      *   *(Requires robust persistence view).*
  *   **B.** **(2) is better.** The fetus was a *precursor* or *part* of me. I came into existence when consciousness/brain function started.
      *   *(Often pairs with Stage Theory or Animalism).*

  ---

  ## THE LEAVES: WHAT YOU BOUGHT

  **1. WORM THEORY (Perdurantism)**
  *   **Commitment:** Objects are 4D spacetime worms. You are never "wholly present"; only a temporal slice is present.
  *   **Cost:** You must accept that "I" refers to a long stretch of time, making fission cases messy (indeterminacy of identity).
  *   **Coincidence:** Usually denies it (the Person-worm and Body-worm share all temporal parts, so they are identical).

  **2. STAGE THEORY (Exdurantism)**
  *   **Commitment:** Objects are instantaneous. "Persistence" is a relation between distinct stages (counterparts).
  *   **Cost:** You never strictly *survive*. A future stage is merely a *counterpart* of you, not *you*.
  *   **Benefit:** Handles Fission elegantly (one stage, two future counterparts).
  *   **Note:** If your answers to Node 2 and Node 4 conflicted, you are likely confused between Worm and Stage. They agree on most cases; the split is semantic priority.

  **3. RELATIONAL ENDURANTISM**
  *   **Commitment:** Objects are wholly present. Properties are actually relations to times (Green-at-t).
  *   **Cost:** "Green" isn't a monadic property. Everything is time-indexed. Can feel linguistically revisionist.
  *   **Empty Zone Warning:** If you chose **Node 3A** but also think **Time is unreal**, you are incoherent. You need time to exist to bear the relation.

  **4. ADVERBIAL ENDURANTISM**
  *   **Commitment:** Objects are wholly present. Properties are monadic, but the *having* is modified (Has-greenly-at-t).
  *   **Cost:** Metaphysically obscure. What is "having-ly"? Often accused of being a linguistic trick.
  *   **Empty Zone Warning:** If you chose **Node 3B** but deny **Node 1B** (i.e., you want adverbial modification but admit temporal parts), you are double-dipping. Pick one.

  **5. PRESENTIST ENDURANTISM**
  *   **Commitment:** Only the present exists. The green banana *was*, but does not exist.
  *   **Cost:** Truthmakers for past-tense statements are hard to find. Relativity physics is hostile to this view.
  *   **Empty Zone Warning:** If you chose **Node 3C** but think **Special Relativity is literally true**, you have a physics problem.

  ---

  ## THE "NO MAN'S LAND" (Empty Combinations)

  **The "Coincident Worm"**
  *   *Commitment:* Objects are spacetime worms (Node 2A) AND distinct objects can share every single temporal and spatial part (Node 5A).
  *   *Why nobody sits here:* If two worms share all parts, mereology dictates they are identical. Asserting they are distinct requires a brute primitive identity that defeats the purpose of using parts to solve problems. It's extensionally equivalent to Monism but metaphysically bloated.

  **The "Fission Nihilist"**
  *   *Commitment:* Objects persist (Node 1B) BUT in fission cases, the original simply vanishes (Node 4C) without any causal break.
  *   *Why nobody sits here:* It violates the intuition of causal continuity. If B and C are both perfect continuations of A, saying A *ceased* while B and C *began* makes existence magic. Most who choose 4C are actually Animalists or Fusion theorists, not simple Nihilists.

  **The "Adverbial Perdurantist"**
  *   *Commitment:* Objects have temporal parts (Node 1A) BUT properties are had adverbially by the whole object (Node 3B).
  *   *Why nobody sits here:* Incoherent. If you have temporal parts, the parts bear the properties, not the whole. The whole is green *because* a part is green. Adverbialism is a rescue raft for Endurantists, not Perdurantists.

  ---

  **Final Advice:** If you ended up at a leaf that makes you uncomfortable, don't change your answers to fit a label. Change the label, or admit the cost. Metaphysics is the study of which bullet you are willing to bite.
