          *   Coincidence (Catholic + Statue-shaped lump in a pew).
          *   Fission (Amoeba splitting).
          *   Past Self (Fetus vs. "I").
      *   **Required Leaves:** Endurantism (Adverbialist vs. Relativized Properties), Worm Theory (Perdurantism), Stage Theory.
      *   **Constraints:**
          *   Must distinguish Worm vs. Stage if possible (or admit if not).
          *   Flag empty/impossible combinations.
          *   Accessible phrasing (no background needed to answer in good faith).
          *   Length: Max 2 sides of A4.
          *   Tone: Can be opinionated/sharp ("if a branch leads somewhere embarrassing, let it").

  2.  **Deconstruct the Metaphysics:**
      *   *Persistence:* How do objects exist through time?
      *   *Endurantism:* Objects are wholly present at each moment.
      *   *Perdurantism (Worm Theory):* Objects are space-time worms; temporal parts exist.
      *   *Stage Theory:* Objects are instantaneous stages; talk of persistence is talk of counterpart relations.
      *   *The Problem of Change:* How can $x$ be $F$ at $t_1$ and not-$F$ at $t_2$ without contradiction?
          *   Endurantist solutions: Relational properties (F-at-t), Adverbialism (F-ly at t), Presentism (only now exists).
          *   Perdurantist solutions: Temporal parts (t-part is F, t2-part is not-F).
      *   *Coincidence:* Can two things be in the same place at the same time? (Statue/Lump, Person/Body).
      *   *Fission:* What happens when one thing becomes two? (Identity vs. Survival).
      *   *Fetus/Person:* Is identity strict or sortal-relative?

  3.  **Drafting the Decision Tree Structure:**

      *   *Root:* The Problem of Change (Banana).
      *   *Branch 1:* How to resolve the contradiction?
          *   Option A: Parts. (Leads to Perdurantism/Stage).
          *   Option B: No Parts/Wholly Present. (Leads to Endurantism).
      *   *Branch 2 (for Parts):* What is the primary referent of "The Banana"?
          *   Option A: The whole worm. (Worm Theory).
          *   Option B: The instantaneous stage. (Stage Theory).
          *   *Challenge:* Distinguishing Worm vs. Stage by *cases* is notoriously hard because they agree on truth conditions for most ordinary sentences. I need to find a case where they diverge or admit the limitation. *Fission* is usually the best bet here.
      *   *Branch 3 (for Wholly Present):* How to handle properties?
          *   Option A: Relations to times. (Relationalism).
          *   Option B: Adverbial modification. (Adverbialism).
      *   *Branch 4 (Coincidence):* Do distinct things share space?
          *   This cuts across the persistence views but helps sort Endurantists (many accept coincidence) vs. Perdurantists (often deny it via temporal parts, though some accept it). Actually, Coincidence is better as a separate diagnostic to refine the leaf. Let's make it a node that refines the Endurantist branch mostly, or a check for Perdurantists.
      *   *Branch 5 (Fission):* The Amoeba.
          *   This is crucial for Worm vs. Stage. Worms say identity is indeterminate or one branch is the original. Stages say the pre-fission stage has two future counterparts.
      *   *Branch 6 (Fetus):* Identity vs. Constitution.

  4.  **Refining the Nodes for Accessibility:**
      *   Instead of "Do you accept temporal parts?", ask "When you point at the banana, are you pointing at a slice of a bigger time-stretch, or the whole thing right now?"
      *   Instead of "Adverbialism," ask "Is 'being green' something the banana *does* in a certain way, or something it *has*?"

  5.  **Addressing the Worm/Stage Distinction:**
      *   They are extensionally equivalent in many contexts. The difference is semantic/metaphysical priority.
      *   *Case:* Fission.
      *   *Worm:* Pre-fission, there are two overlapping worms diverging. "I" refers to one. Which one? (Indeterminacy).
      *   *Stage:* Pre-fission, there is one stage. It has two future counterparts. "I will survive" is true if *a* counterpart survives.
      *   *Decision:* I will use the Fission node to split them.

  6.  **Addressing Empty Branches:**
      *   Example: Someone who says "Objects have temporal parts" (Perdurantist) BUT "Two objects can be exactly coincident at every moment of their existence without being identical." This is rare/ugly (Universalist mereology usually collapses coincidence).
      *   Example: Someone who says "Objects are wholly present" BUT "Properties are not relative to time." This leads to contradiction (Green and Not-Green).

  7.  **Drafting the Content (Iterative Process):**

