  ## III. Appendix: Diagnosis of Unoccupied Logical Space

  There are 16 possible combinations of answers. The six leaves above cover the salient philosophical terrain. The remaining ten combinations are diagnosed below.

  | Transparency | Local-Steal | Std. Newcomb | Twin Sym. | Diagnosis |
  | :--- | :--- | :--- | :--- | :--- |
  | **Yes** | **Yes** | **2-Box** | **Symmetric** | **Incoherent.** If you can steal locally, logical dependence is broken; 2-boxing follows, but the "Transparency" premise is undermined. |
  | **Yes** | **Yes** | **2-Box** | **Asymmetric** | **Incoherent.** Same as above, compounded by arbitrary asymmetry between twins. |
  | **Yes** | **No** | **1-Box** | **Asymmetric** | **Unattractive.** (FDT variant). Violates supervenience; why does the twin without Omega escape logical binding? |
  | **Yes** | **No** | **2-Box** | **Asymmetric** | **Unexplored.** (Logical Causalism). Accepts logic but ignores it normatively, only for the predicted twin. Highly unstable. |
  | **No** | **No** | **1-Box** | **Asymmetric** | **Unattractive.** (EDT variant). Brute correlation holds, but norms shift based on external prediction status. |
  | **No** | **No** | **2-Box** | **Symmetric** | **Unoccupied.** (Fatalistic CDT). Denies stealing (type correlation) but 2-boxes. Possible, but usually collapses to EDT or CDT. |
  | **No** | **No** | **2-Box** | **Asymmetric** | **Unexplored.** Why would type correlation bind one twin and not the other? |
  | **No** | **Yes** | **1-Box** | **Asymmetric** | **Incoherent.** (Evidential Causalism). If stealing works locally, evidential link is broken globally. |
  | **No** | **Yes** | **2-Box** | **Asymmetric** | **Unattractive.** (Contextual CDT). Causal structure is identical for twins; asymmetry is ad hoc. |
  | **No** | **Yes** | **1-Box** | **Symmetric** | **Unoccupied.** (See Leaf 5). Usually collapses into EDT (No Steal) or CDT (2-Box). |

  **Key for Diagnosis:**
  *   **Incoherent:** The combination of commitments entails a contradiction (e.g., asserting logical dependence while claiming the ability to contradict it).
  *   **Unattractive:** The view is logically consistent but violates plausible meta-normative principles (e.g., supervenience, parsimony).
  *   **Unexplored:** No major literature defends this combination, though it is not strictly incoherent.
