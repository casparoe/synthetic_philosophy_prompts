  *(Note: For clarity in the handout below, we collapse the tree to the six most philosophically salient leaves, diagnosing the remaining ten logical combinations in the Appendix.)*

  ## II. Diagnostic Leaves (Salient Positions)

  ### 1. Indexical Functional Decision Theory
  *   **Path:** Transparency [Yes] → Local-Steal [Yes] → Standard Newcomb [1-Box] → Twin [Symmetric]
  *   **View:** Accepts logical subjunctive dependence but posits that indexical information or private randomness allows the agent to diverge from a perfect simulation in specific contexts.
  *   **Awkward Commitment:** Must explain why the agent can logically contradict a simulation in the "local-copy" case without undermining the logical dependence that forces one-boxing in the standard case.
  *   **Indistinguishability:** Cannot separate **FDT** from **TDT** without a fifth case involving logical counterfactuals with non-identical source code.

  ### 2. Contextual Logical View (Unnamed)
  *   **Path:** Transparency [Yes] → Local-Steal [Yes] → Standard Newcomb [1-Box] → Twin [Asymmetric]
  *   **View:** Holds that logical dependence is real but normative force depends on the presence of the predictor; the twin without Omega is not bound by the same logical constraints.
  *   **Awkward Commitment:** Requires treating the local-copy agent and the transparent agent differently despite identical outputs, based solely on the external presence of a predictor.
  *   **Status:** **Unexplored/Unattractive.** Violates the supervenience of rational requirements on the agent's internal state.

  ### 3. Logical Two-Boxing (Causal Compatibilism)
  *   **Path:** Transparency [Yes] → Local-Steal [No] → Standard Newcomb [2-Box] → Twin [Symmetric]
  *   **View:** Acknowledges that the predictor accesses reasoning (transparency) and that simulation implies identity (no stealing), but maintains causal dominance is the only normative standard.
  *   **Awkward Commitment:** Asserts that logical dependence exists but is normatively inert, requiring the agent to ignore a guaranteed correlation they acknowledge as real.
  *   **Indistinguishability:** Collapses with **CDT** on action, but differs on metaphysics; requires a "God's Eye" case to distinguish.

  ### 4. Functional Decision Theory (FDT) / Timeless Decision Theory (TDT)
  *   **Path:** Transparency [Yes] → Local-Steal [No] → Standard Newcomb [1-Box] → Twin [Symmetric]
  *   **View:** The agent's decision is the output of a fixed algorithm; simulating the predictor runs the same algorithm, making contrary action impossible (no stealing).
  *   **Awkward Commitment:** Must deny the possibility of "counter-logical" action even in offline simulation, treating the simulator as metaphysically bound to the simulated.
  *   **Indistinguishability:** **FDT** and **TDT** fall on the same branch; distinguished only by their handling of counterpossible reasoning.

  ### 5. Evidential Causalism (Unnamed)
  *   **Path:** Transparency [No] → Local-Steal [Yes] → Standard Newcomb [1-Box] → Twin [Symmetric]
  *   **View:** Denies reasoning transparency (prediction is behavioral) but claims local simulation allows stealing; nonetheless advocates one-boxing due to evidential weight.
  *   **Awkward Commitment:** Claims the agent can outsmart a perfect predictor in simulation while admitting the predictor predicts the actual agent perfectly, creating a modal gap between 'simulated choice' and 'actual choice'.
  *   **Status:** **Incoherent.** If local stealing is possible, the evidential link in the standard case is broken.

  ### 6. Standard Causal Decision Theory (CDT)
  *   **Path:** Transparency [No] → Local-Steal [Yes] → Standard Newcomb [2-Box] → Twin [Symmetric]
  *   **View:** Prediction is causal/observational; the agent can simulate the predictor offline and choose freely (stealing works), but causal independence dictates two-boxing.
  *   **Awkward Commitment:** Posits a modal gap between the 'simulated self' (who can beat Omega) and the 'actual self' (who is predicted by Omega), despite identical algorithms.
  *   **Indistinguishability:** Cannot separate **CDT** from **Post-Decision Causalism** without a case involving precommitment devices.

