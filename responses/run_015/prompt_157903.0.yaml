answer: |-
  You have correctly identified that the slogan dissolves under scrutiny. In analytic philosophy, we often call this a **conversation-stopper** rather than a **truth-claim**. Its primary function is social (silencing dissent) rather than propositional (stating a fact). However, since you asked for a menu of precise theses that *could* be extracted from it, I will reconstruct the strongest philosophical arguments that might underlie the rhetoric.

  Here is a menu of four distinct interpretations, ordered from trivial (social etiquette) to radical (moral complicity).

  ### 1. The Hypocrisy Thesis (Trivial/Social)
  *   **What it says:** You have waived the *social privilege* of griping about a collective decision you refused to participate in. It is inconsistent to demand the benefits of a system (order, stability) while refusing its minimal costs (voting).
  *   **Weight-carrying word:** **"Can't"** (meaning: *it is socially inappropriate* or *you lack standing*).
  *   **Plausibility:** High, as a norm of etiquette. Low, as a moral prohibition.
  *   **Classification:** **Platitude / Social Norm.**
  *   **Confidence:** **Firm.** This is the most common usage. It is not a claim about causal responsibility, but about consistency.
  *   **Seminar Relevance:** **Weak.** This does not show the abstainer is morally *unclean*; it only shows they are annoying. A person can be morally pure but socially rude. Furthermore, voting for a "bad" candidate also has moral costs (complicity in harm), so the lesser-evil voter is not necessarily more consistent, just more pragmatic.
  *   **Edge Cases:** Applies to minor-party voters? **Yes.** They voted, so they retain standing. Applies to the disenfranchised? **No.** If they *cannot* vote, the condition is impossible, so the prohibition doesn't trigger.

  ### 2. The Causal Contribution Thesis (Substantive/Empirical)
  *   **What it says:** By abstaining, you causally contributed to the victory of the worse candidate. In a close election, every vote matters; therefore, your absence is a cause of the bad outcome.
  *   **Weight-carrying word:** **"You"** (meaning: *you are a causal agent*).
  *   **Plausibility:** **Contested / Generally False.**
  *   **Classification:** **Empirically Dubious.**
  *   **Confidence:** **Firm on the falsity.** In almost all large-scale elections, the probability of a single vote deciding the outcome is negligible (statistically zero). To say you *caused* the outcome is like saying a single raindrop caused the flood.
  *   **Seminar Relevance:** **False.** If the claim is empirically false, it cannot ground a moral obligation. If my vote didn't change the outcome, my abstention didn't cause the winner. This fails to prove the abstainer is morally responsible for the win.
  *   **Edge Cases:** Applies to minor-party voters? **Yes,** if their vote also didn't change the outcome. This reveals the slogan is often inconsistent: it blames abstainers for the winner but rarely blames third-party voters for "spoiling" unless the election is extremely close.

  ### 3. The Complicity by Omission Thesis (Substantive/Moral)
  *   **What it says:** Moral responsibility is not just about what you *do*, but what you *allow*. If you could have prevented a harm (by voting for the lesser evil) and chose not to, you share responsibility for that harm.
  *   **Weight-carrying word:** **"Vote"** (meaning: *take the available preventative measure*).
  *   **Plausibility:** **Deeply Contested.**
  *   **Classification:** **Contentious Moral Claim.**
  *   **Confidence:** **Contested.** This is the core of the "lesser of two evils" debate. Consequentialists often accept this (you must minimize harm). Deontologists often reject it (you are not responsible for the independent actions of others, only your own integrity).
  *   **Seminar Relevance:** **Strong.** This is the only thesis that actually challenges the idea that the abstainer is "morally cleaner." It argues that *clean hands* (not voting for a bad candidate) are less important than *good outcomes* (stopping the worse candidate). If this thesis holds, the abstainer is not cleaner; they are negligent.
  *   **Edge Cases:** Applies to minor-party voters? **Yes.** If voting third party allows the worse major candidate to win, this thesis holds them equally complicit. Applies to the disenfranchised? **No.** You cannot be complicit by omission if you lack the power to act.

  ### 4. The Consent and Legitimacy Thesis (Radical/Political)
  *   **What it says:** Voting is an act of consenting to the authority of the state. If you do not vote, you have not consented to the government, and therefore you have no claim upon it. Conversely, if you live under the government without voting, you are a "free rider" on the social contract.
  *   **Weight-carrying word:** **"Complain"** (meaning: *claim a right to remedy*).
  *   **Plausibility:** **Low (in modern democracies).**
  *   **Classification:** **Philosophical Theory (Social Contract).**
  *   **Confidence:** **Contested.** Most modern political philosophers reject the idea that voting is necessary for consent (tacit consent via residence is the usual standard, though also contested).
  *   **Seminar Relevance:** **Mixed.** It suggests the abstainer has forfeited political rights, but it doesn't necessarily mean they are morally *wrong* to abstain, only that they are outside the protection of the contract.
  *   **Edge Cases:** Applies to minor-party voters? **Yes.** Applies to the disenfranchised? **Implies they have no standing,** which is a deeply problematic (and likely false) moral conclusion.

  ---

  ### Direct Answer to Your Seminar Question
  **Which reading shows the principled abstainer is not morally cleaner than the lesser-evil voter?**

  Only **Thesis 3 (Complicity by Omission)** attempts to do this work.
  *   **If True:** It implies that morality is solely about outcomes. If the "bad" candidate does harm, and you could have mitigated it by voting for the "less bad" candidate, your refusal to do so makes you partially responsible for that harm. In this view, keeping your hands clean is a form of moral selfishness.
  *   **If False:** If you believe morality also involves *integrity* (not endorsing bad things), then the abstainer *is* morally cleaner, even if the outcome is worse. They have not stained their soul with support for a bad actor.

  **Verdict:** The slogan does not *prove* the abstainer is unclean. It merely *asserts* a consequentialist framework where outcomes trump integrity. Since your seminar is arguing *about* that framework, using the slogan to settle the argument is begging the question.

  ### On the "Minor Party" Voter
  You asked if the slogan applies to someone who voted for a losing minor party.
  *   **Observation:** In practice, people who use this slogan usually *do* apply it to third-party voters.
  *   **Implication:** This reveals that when they say **"Vote,"** they often mean **"Vote for a viable candidate who can stop the worst outcome."**
  *   **Problem:** This shifts the definition mid-argument. If "Vote" means "Cast a ballot," the third-party voter is safe. If "Vote" means "Effectively prevent harm," then the slogan is no longer about participation; it is about *winning*. This makes the slogan a pragmatic command ("Do what works") disguised as a moral principle ("Do your duty").

  ### Is the Question Muddled?
  **Yes, partly.** You asked if the sentence has "determinate content."
  **Confidence: Firm.** The sentence **does not have determinate content.** It is a **rhetorical shibboleth.**

  *   **Why:** If it were a precise moral claim, it would have to account for the probability of a single vote mattering (which is near zero). Since it ignores the math, it cannot be a causal claim. Since it ignores the moral cost of voting for a "bad" candidate, it cannot be a consistent integrity claim.
  *   **Function:** Its function is **boundary marking.** It divides the community into "participants" (us) and "observers" (them). It is a tool of social cohesion, not ethical analysis.
  *   **Advice:** In your seminar, you can point out that the slogan collapses into **Thesis 3 (Complicity)** if it is to have moral weight, but Thesis 3 is exactly what is up for debate. Using the slogan to end the debate assumes the conclusion (that consequences matter more than integrity).

  ### Summary of Confidence Markers
  *   **Firm:** The slogan is rhetorically ambiguous and empirically false regarding causal impact (Thesis 2).
  *   **Firm:** Thesis 3 is the only one relevant to your specific debate about moral cleanliness.
  *   **Contested:** Whether Thesis 3 is *true* is the central disagreement between Consequentialists and Deontologists. There is no philosophical consensus here.
  *   **Firm:** The slogan is often used inconsistently regarding third-party voters, revealing its pragmatic rather than moral nature.

  If you want to push back in class, I suggest this: *"The slogan only works if we assume that preventing a bad outcome is the only moral duty that matters. But if we have a duty not to endorse bad candidates, then voting for the 'lesser evil' might be the real moral failure. The slogan doesn't solve that; it just ignores it."*
