      *   **Confidence Markers:** Use bolding or explicit notes.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I distinguish between "can't" (ability) and "can't" (permission/standing).
      *   *Correction:* Ensure I address the "lesser of two evils" specific context. The slogan is usually used to pressure someone to vote for the lesser evil.
      *   *Nuance:* The "Minor Party" point is key. If I vote Green/Libertarian in a swing state, did I "vote"? The sloganist usually says "no, you wasted your vote." This implies *vote* means *vote effectively*. I need to highlight this shift in definition.

  10. **Final Review against Constraints:**
