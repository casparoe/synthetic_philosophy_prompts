answer: |-
  Galen Strawson's Basic Argument posits that true moral responsibility requires an agent to be *causa sui* (the cause of itself). Since an agent cannot choose their own initial nature or the principles by which they choose without already possessing a prior nature, responsibility leads to an infinite regress. Neither determinism nor indeterminism resolves this, as both leave the agent without ultimate control over how they are. When applied to collective entities, this logic encounters a unique structural friction not present in individual agency.

  A specific conceptual issue arises when we examine **procedural self-amendment** within a corporation or state. Collectives possess **constitutive rules** (such as bylaws or a constitution) that define their decision-making protocols—effectively their "institutional nature." Unlike individual humans, who cannot metaphysically rewrite their own psychological principles of choice, a collective can formally amend its constitutive rules using the very procedures those rules establish. For example, a corporation may vote to change its voting threshold from a simple majority to a supermajority.

  This creates a tension between **functional autonomy** and **metaphysical authority**. Functionally, the collective appears to satisfy the *causa sui* condition: it intentionally alters the structure that determines its future actions. This generates a semblance of self-creation that is impossible for individual agents. However, metaphysically, the amendment process itself is governed by prior rules that the collective did not ultimately choose (tracing back to a founding moment determined by non-*causa-sui* individuals).

  The paradox unique to collectives is that they can achieve **procedural validity** without **ultimate responsibility**. The collective can legitimately claim, "We chose our own nature," because the change is documented and valid within the system. Yet, under Strawson's logic, this choice is as unfree as an individual's psychological makeup because the authority to amend was inherited, not created ex nihilo. This produces an ambiguity in moral assessment: we are tempted to hold the collective responsible for its structural choices because it has the *capacity* to change them (unlike an individual), even though the *source* of that capacity fails the Basic Argument just as decisively. This divergence between institutional self-modification and metaphysical self-creation complicates the attribution of blame to organizations in ways that do not arise for singular human agents.
