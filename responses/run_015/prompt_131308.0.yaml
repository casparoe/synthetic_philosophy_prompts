answer: |-
  This is a fantastic list. You've effectively done the philosophical work of testing intuitions against cases, which is how these principles are actually built. You are right to be stuck on 1 vs. 4; that is the exact fault line where most theories of testimony crack.

  Your "Accountability" principle was close, but it failed because it focused only on the *possibility* of holding someone to account, not the *likelihood* that they care if they are held. The salesman (Case 8) is legally accountable, but his incentives are misaligned. The forum poster (Case 4) is unaccountable, so their word costs them nothing.

  Here is a principle that unifies your nine cases, resolves the 1 vs. 4 conflict, and handles the chatbot.

  ### The Principle of Cooperative Answerability

  **You have a default entitlement to believe a speaker's testimony when three conditions are met:**

  1.  **The Illocutionary Condition:** The speaker offers the statement as a truth-claim intended to inform you (not as a joke, a pitch, or a guess).
  2.  **The Competence Condition:** The speaker is positioned to know the truth of the matter (access, expertise, or perception).
  3.  **The Stake Condition:** The speaker participates in a normative context where misleading you carries a **social or practical cost** to them (embarrassment, loss of trust, confrontation, or shared negative outcome).

  **Why this works:**
  This upgrades your "Address" idea. It's not enough that they *can* be addressed; it matters that addressing them *matters* to them. Testimony is a cooperative act; if the speaker bears no cost for defecting from cooperation, the entitlement vanishes.

  ---

  ### How it handles your nine cases

  **1. The Platform Woman (Believe)**
  *   **Illocution:** She is answering a practical need.
  *   **Competence:** She is a local/waiting passenger; she has access.
  *   **Stake:** **High.** She is physically present. If she lies, she risks immediate social confrontation, a scene, or the guilt of seeing you miss your train. The "face-to-face" norm imposes a cost on deception.
  *   *Verdict:* Full entitlement.

  **2. The Bar Guy (Half-Believe)**
  *   **Illocution:** Casual conversation.
  *   **Competence:** Unclear. He might be repeating a rumor.
  *   **Stake:** **Low.** If he is wrong, you won't find out, or you won't care enough to confront him. He loses nothing by being mistaken.
  *   *Verdict:* Weak entitlement (hedged belief).

  **3. The Conspiracy Cousin (Split Belief)**
  *   **Illocution:** Reporting an event.
  *   **Competence:** **Split.** He has perceptual access to the crash (Condition met) but lacks the analytical competence to judge council plots (Condition failed).
  *   **Stake:** High (he's your cousin, relationship is on the line).
  *   *Verdict:* Believe the perception, reject the interpretation.

  **4. The Anonymous Forum (Don't Believe)**
  *   **Illocution:** Posting text.
  *   **Competence:** Unknown.
  *   **Stake:** **Zero.** This is the key difference from Case 1. The poster is a ghost. If they are lying, trolling, or mistaken, there is no social friction, no embarrassment, and no consequence. The "Answerability" is hollow because there is no one to answer *to*.
  *   *Verdict:* No entitlement. (Explains the 1 vs. 4 conflict: Presence creates Stake).

  **5. The Rent Chain (Believe)**
  *   **Illocution:** Official notice.
  *   **Competence:** Institutional access.
  *   **Stake:** **Institutional.** The building manager risks their job or legal trouble if they lie. The chain holds because the institutions at each link have stakes in accuracy.
  *   *Verdict:* Entitlement maintained through institutional stakes.

  **6. The Niece (Split Belief)**
  *   **Illocution:** Explaining an event.
  *   **Competence:** **Split.** She has perceptual access to the vase falling (Condition met) but lacks the theory of mind to understand the dog's motives (Condition failed).
  *   **Stake:** High (she wants your approval).
  *   *Verdict:* Believe the event, reject the motive. (Matches Case 3).

  **7. The Spanish Friend (Believe)**
  *   **Illocution:** Warning/Informing.
  *   **Competence:** Speaker has it; Listener lacks decoding.
  *   **Stake:** High (Friendship).
  *   *Note:* The principle focuses on the *speaker's* agency. Your decoding effort is a barrier to *receiving*, but it doesn't negate her *entitlement to be believed*. You trust her agency even if your reception is noisy.
  *   *Verdict:* Entitlement holds.

  **8. The Salesman (Disbelieve)**
  *   **Illocution:** **Failed.** He is not offering a truth-claim to inform; he is offering a pitch to sell. The normative context is *adversarial* (Caveat Emptor), not cooperative.
  *   **Stake:** His stake is aligned with *selling*, not *truth*.
  *   *Verdict:* No entitlement. In fact, inverse evidence.

  **9. The Three Witnesses (High Confidence)**
  *   **Illocution:** Reporting.
  *   **Competence:** Corroborated access.
  *   **Stake:** Even if individual stakes are low, the statistical improbability of three independent errors mimics a high-stake verification.
  *   *Verdict:* Entitlement multiplied by independence.

  ---

  ### The Chatbot Case

  You asked: *When a chatbot tells me a fact I can't check, is my distrust prejudice or accurate?*

  According to the **Principle of Cooperative Answerability**, your distrust is **accurate**, not prejudiced. Here is the breakdown:

  1.  **Illocution:** The chatbot *simulates* an assertion. It looks like it is informing you, but it is actually predicting tokens. It has no intent to inform, only to complete a pattern.
  2.  **Competence:** It has data access, but no "position to know." It cannot distinguish truth from plausible-sounding falsehood (hallucination).
  3.  **Stake:** **Zero.** This is the clincher. The chatbot cannot be embarrassed. It cannot lose reputation. It does not care if you act on false information. It bears no cost for misleading you.

  **The Verdict:**
  Taking a chatbot's word is not "testimony" in the human sense; it is more like reading a random sentence from a library book that might be fiction or non-fiction, without a title page.

  In Case 1 (The Platform), you believe the woman partly because **she knows she could be stopped.** If she sends you to Platform 8 and you come back angry, she has to face that. That social friction is a guarantee of effort.

  The chatbot has no skin in the game. Your intuition that "there is nobody there to answer for it" is exactly right. It isn't prejudice against AI; it is a correct assessment that the **normative conditions for testimony are absent.** You are not dealing with a testifier; you are dealing with a text generator.

  ### Summary of the Deliverable

  **Principle:** **Cooperative Answerability.**
  **Definition:** Belief is warranted when the speaker intends to inform (Illocution), is able to know (Competence), and risks something by lying (Stake).
  **Resolution of 1 vs. 4:** Case 1 has **Social Stake** (face-to-face risk); Case 4 has **No Stake** (anonymous frictionless posting).
  **Chatbot Application:** Chatbots fail the **Stake** and **Illocution** conditions. They simulate speech without the commitment that makes speech trustworthy. Your distrust is epistemically rational.
