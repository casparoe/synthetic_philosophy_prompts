answer: |-
  # Activity Design: The Seal of Continuity

  ## Overview
  **Title:** The Seal of Continuity  
  **Duration:** 90 Minutes  
  **Group Size:** 15 Participants  
  **Concept:** Authorization Redundancy (The use of dormant, hereditary authority to stabilize democratic decisions during crises.)

  ## Setup and Roles (15 Minutes)
  Divide the fifteen participants into three distinct groups. Arrange the room so the **Assembly** sits in a semi-circle, the **Ministers** stand at a podium at the front, and the **Sovereign** sits slightly apart, elevated if possible, with a small table holding a sealed envelope and a heavy stamp.

  1.  **The Assembly (12 People):** Represent the electorate. They hold voting cards (YES/NO). Their goal is to pass necessary measures to keep the "State" running without depleting the group's shared resources.
  2.  **The Cabinet Ministers (2 People):** Represent the elected government. They draft the measures and must persuade the Assembly. They are under time pressure.
  3.  **The Sovereign (1 Person):** Represents the Crown. They hold the "Seal of Continuity." They **cannot** propose laws, **cannot** vote, and **cannot** veto. They can only *endorse* a law after it has passed.

  **Materials:**
  *   20 "Stability Tokens" (poker chips, colored stones, or paper slips) placed in a central "National Pot."
  *   Voting cards for the Assembly.
  *   3 "Crisis Cards" (prepared scenarios for the Ministers to read).
  *   The Seal (a physical stamp or heavy object) and the Sealed Mandate (an envelope given to the Sovereign).

  ## The Rules of Legitimacy (5 Minutes)
  Explain the economic mechanic of legitimacy to the group. This is the engine of the simulation.

  1.  **The Cost of Conflict:** Every time the Assembly votes on a measure, it creates social friction. If a measure passes, the group **must pay 3 Stability Tokens** from the National Pot into a "Discard Pile." This represents the anger of the minority and the effort of campaigning.
  2.  **The Collapse Condition:** If the National Pot reaches zero tokens, the "Government Collapses." Everyone loses.
  3.  **The Sovereign's Power:** After a vote passes, the Ministers may request the **Seal of Continuity**. The Sovereign opens the Sealed Mandate to check if the procedure was followed correctly (e.g., "Was the vote unanimous?" or "Did the Ministers use formal language?").
      *   If the Sovereign applies the Seal: **The 3 Tokens are refunded** to the National Pot.
      *   If the Sovereign withholds the Seal: The tokens remain discarded.
  4.  **The Constraint:** The Sovereign is instructed (via the Sealed Mandate) to be extremely conservative. They should only apply the Seal if the Ministers show proper deference and the situation is truly dire. They represent history, not current opinion.

  ## Gameplay Rounds (45 Minutes)

  **Round 1: The Routine (10 Minutes)**
  *   **Scenario:** A minor budget adjustment.
  *   **Action:** Ministers propose. Assembly votes (likely passes 8-4).
  *   **Consequence:** 3 Tokens are paid. The Sovereign is asked to seal it. The Sovereign *withholds* the Seal (following instructions to save legitimacy for later).
  *   **Feeling:** The group feels the loss of tokens. It feels like normal politics—exhausting and costly.

  **Round 2: The Tension (15 Minutes)**
  *   **Scenario:** A controversial infrastructure project. Half the Assembly opposes it.
  *   **Action:** Ministers struggle to get 7 votes. They barely pass it (7-5).
  *   **Consequence:** 3 Tokens are paid. The National Pot is now visibly lower. The Ministers beg the Sovereign to seal it to save tokens.
  *   **Twist:** The Sovereign hesitates. They ask the Ministers to repeat the proposal using "solemn language" (e.g., "We submit this for the good of the realm, not for gain"). If the Ministers sound too political or aggressive, the Sovereign withholds the Seal again.
  *   **Feeling:** Frustration. The democratic vote happened, but it feels "expensive" and fragile. The group begins to look at the Sovereign as a resource they need to access.

  **Round 3: The Emergency (20 Minutes)**
  *   **Scenario:** A sudden crisis (e.g., "The Dam Breaks"). Immediate action required.
  *   **Action:** Ministers propose a drastic measure. The Assembly is scared. They vote 10-2.
  *   **Consequence:** The Pot has only 4 Tokens left. Paying 3 more risks collapse in any future round.
  *   **The Activation:** The Ministers formally request the Seal. The Sovereign stands. They do not debate the policy. They simply state: *"In the name of Continuity, this is Endorsed."* They stamp the paper.
  *   **The Payoff:** The 3 Tokens are **refunded**. The group breathes a sigh of relief. The decision was factually the same (a drastic measure passed), but the *cost* to the group's stability was waived by the Sovereign's reserve authority.
  *   **Final Twist:** If the group has tokens left, reveal that the Sovereign held enough "Personal Reserve" to save the group even if the Pot had hit zero, but only because they were asked.

  ## Debrief and Mapping (30 Minutes)
  Gather the group in a circle. Put the game materials in the center. Do not lecture; ask questions that lead them to your concept.

  1.  **The Hollow Vote:** Ask the Assembly: "In Round 1, you won the vote. Did you feel secure? Why did losing tokens feel like losing safety?"
      *   *Mapping:* Connect this to **Democratic Legitimacy**. It is transient. Every win requires burning capital (persuasion, campaigning, alienating the minority).
  2.  **The Cost of the Seal:** Ask the Ministers: "How did it feel to beg the Sovereign for the Stamp? Did it change how you spoke?"
      *   *Mapping:* Connect this to **Constitutional Restraint**. Elected leaders must humble themselves to access the deeper legitimacy of the state. They cannot just rule by raw majority.
  3.  **The Relief:** Ask the Group: "When the Stamp was applied in Round 3, did the decision feel different, even though the vote count was the same?"
      *   *Mapping:* This is **Authorization Redundancy**. The Crown provides a second source of authority that is not based on the current mood. It signals that the decision fits within the long history of the nation, not just today's argument.
  4.  **The Risk:** Ask the Sovereign: "Did you feel powerful? Or did you feel constrained?"
      *   *Mapping:* The Monarch is powerful only because they rarely use the power. If they used it every time, it would just be another vote.

  ## Predictable First-Run Failure
  **The "Dictator" Drift:** In the first run, the participant playing the Sovereign often feels awkward having no voting power. To compensate, they may try to *influence* the debate or threaten to veto the vote entirely.
  *   **Recovery:** The facilitator must intervene immediately. Remind the Sovereign: "You cannot stop the car, you can only polish the hood. If you try to steer, the simulation breaks." Remind the Assembly that if the Sovereign tries to veto, the game ends in "Revolution" (immediate loss). This enforces the constitutional limit: the Monarch endorses, they do not govern.

  ## Unreproducible Feature the Facilitator Must Supply
  **The Weight of Time:** In the game, the "Stability Tokens" are abstract plastic chips. In reality, the "Reserve Legitimacy" of a monarchy is built on centuries of blood, art, ritual, and continuity. A 90-minute game cannot simulate the emotional weight of a 1,000-year institution.
  *   **Facilitator Duty:** During the debrief, you must verbally supply this context. Explain that the "Tokens" represent the trust of ancestors and future generations, not just game points. You must articulate that the "Relief" they felt in Round 3 is only possible in the real world because the Sovereign is perceived as being *above* politics, a perception that takes centuries to build and seconds to destroy.

  ***

