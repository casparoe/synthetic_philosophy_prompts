    "core_mechanism_that_reveals_the_idea": "Democratic votes deplete a shared 'Stability' resource representing social friction; the Sovereign can refund this cost via endorsement without changing the policy, making the group feel the economic value of reserve legitimacy.",
    "debrief_mapping": "Map token depletion to the exhaustion of electoral capital; map the Sovereign's refund to the stabilization of minority acceptance; map the Ministers' deference to constitutional constraints on executive power.",
    "predictable_first_run_failure": "The Sovereign participant may attempt to veto or influence the vote rather than just endorsing post-facto, turning the role into a dictator; facilitator must enforce the 'no veto' rule to preserve the constitutional monarchy model.",
