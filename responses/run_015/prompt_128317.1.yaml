prompt: |-
  I have been thinking, without any formal background in politics or history, about why democratic societies such as the United Kingdom, Norway, Sweden, and Japan still preserve a hereditary monarch when every other decision is made by election. It strikes me that the crown is not really governing, yet people seem to treat it as a kind of reserve authority—almost as though democracy borrows legitimacy from it in moments when ordinary voting feels insufficient. I want to call this idea “authorization redundancy”: the monarchy holds a dormant, pre-established right to endorse exceptional acts, so that elected bodies do not have to generate absolute legitimacy from scratch every time they face a crisis. I am running a community workshop with about fifteen adults of mixed backgrounds, no prior study required, for ninety minutes, and I want them to feel the actual pull of that reserve—not through a lecture, but through the structure of what they do.

  Please design a runnable activity, game, or structured role-play for this group that makes the force of authorization redundancy appear in the rules and incentives before anyone names it. Give clear roles, materials, and a payoff or trust scheme that uses no real money but creates genuine small stakes—perhaps points that translate into collective privileges or penalties for the group. The scenario should place participants in a fictional democratic assembly that suddenly confronts an emergency decision, with one dormant “crown” role holding a sealed mandate that can be activated only under specific conditions. The rules should be arranged so that participants experience the frustration of democratic legitimacy feeling hollow, then feel the shift in acceptance when the pre-authorized figure endorses or withholds endorsement, even though the factual decision never changes. Include a debrief that maps specific moments in the activity onto the idea of reserve legitimacy, say exactly what will predictably go wrong the first time the activity is run and how to recover, and be frank about which feature of authorization redundancy—perhaps its long historical sedimentation—this simulation cannot reproduce and must be supplied by the facilitator.

  After describing the activity in prose, please provide a brief structured summary as a JSON object with exactly these fields: "activity_title", "group_size_and_duration", "roles_and_materials", "core_mechanism_that_reveals_the_idea", "debrief_mapping", "predictable_first_run_failure", and "unreproducible_feature_the_facilitator_must_supply". Do not include bibliographies, reading lists, or citations to specific scholars; the design should stand on its own for people who have never studied constitutional theory.
