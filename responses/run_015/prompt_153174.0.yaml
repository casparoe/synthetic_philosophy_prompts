      *   *Variety 2: Rational (Compatibilist).* Focus: Reasons-responsiveness, hierarchical desires (Frankfurt). Problem solved: Agency within a causal world. Promise: Freedom as self-governance. Delivery: Secure agency but often fails to satisfy the "could have done otherwise" intuition in a deep sense.
      *   *Variety 3: Social (Revisionist/Strawsonian).* Focus: Accountability practices, reactive attitudes. Problem solved: Justification of blame/praise. Promise: Grounding morality in community. Delivery: Shifts focus from "can we do it?" to "should we treat them as if they can?"
      *   *Variety 4: Interface Agency (The Proposal).* Focus: Encapsulation, functional accessibility, norm-governed interaction. Problem solved: Systemic coordination without ontological commitment. Promise: Utility without metaphysical baggage. Delivery: Needs evaluation.

  3.  **Evaluate "Interface Agency":**
      *   *The Analogy:* API (Application Programming Interface). Hides implementation (neurons, causation, physics). Exposes methods (choices, commitments). Enforces protocols (norms, laws).
      *   *Strengths:* Explains why we don't need to know neuroscience to hold someone responsible. Explains modularity of social interaction. Aligns with legal fiction concepts.
      *   *Weaknesses:* Is it just "Social" variety with tech jargon? Does it ignore the *feeling* of agency (phenomenology)? Does it reduce the agent to a black box, potentially dehumanizing?
