      *   *Tone Check:* Ensure it sounds like a philosophical essay, not a tech blog. Use terms like "ontological commitment," "normative force," "phenomenology."
      *   *Self-Correction during drafting:* I initially thought about merging Social and Interface. I need to make sure I distinguish them. Social is about *reactive attitudes* (resentment, gratitude). Interface is about *systemic interoperability*. The Interface view explains *why* the reactive attitudes are structured the way they are (to maintain the protocol). This distinction is key to proving the analogy does "real work."

