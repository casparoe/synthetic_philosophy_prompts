answer: |-
  Good morning. To the colleagues who have spent decades debating the definitions of pathology in seminar rooms; to the nurses who have managed the reality of it in hospital wards; to the family and former patients who have lived it in your homes and bodies: welcome.

  It is a profound privilege to stand here at the threshold of Dr. Miriam Kowalski's retirement. We are gathered to honor a career that refused to stay in its lane. In a world that asks physicians to fix bodies and philosophers to analyze concepts, Miriam insisted that you cannot fix the body without understanding the concept, and you cannot analyze the concept without respecting the body.

  Looking around this room, I see a division. Half of you speak the language of physiology, statistics, and clinical outcomes. The other half speaks the language of lived experience, care, and human struggle. Miriam's career was built on the conviction that this division is not a bug in the system, but a feature of reality. She argued that if we want to know what it means to be healthy, we cannot look only at the cells, and we cannot look only at the society. We must look at the story being lived between them.

  For those of you who are not steeped in the academic literature, I want to explain why this matters. It matters because it changes how you are treated when you walk into a clinic.

  Traditionally, there have been two dominant ways to decide if you are sick. The first is the physician's instinct: Health is biology. If a part is broken or statistically abnormal, you are diseased. It is a matter of fact, like a cracked engine block. The second is the sociologist's view: Health is valuation. If society says you cannot work or function normally, you are diseased. It is a matter of opinion, like a dress code.

  Miriam rejected both. She argued that the first view is too cold, and the second is too arbitrary. To prove it, she returned constantly to a single comparison.

  Imagine a professional cyclist. She has a congenital cardiac rhythm that is statistically rare. In the world of competitive cycling, this rhythm is disqualifying. Yet, for her, it allows her to train safely. It supports the endurance life she has built. She is not impaired. She is not suffering. She is, in Miriam's view, healthy.

  Now, imagine an office worker. He has the exact same heart. The same statistical abnormality. But for him, this rhythm causes debilitating fatigue. It prevents him from working his sedentary job. It blocks the life he is trying to lead. He is impaired. He is suffering. He is, in Miriam's view, diseased.

  To the "biology only" doctor, this is frustrating. The biology is identical. How can one be sick and the other well? To the "society only" critic, this is also frustrating. If health is just what society values, why is the cyclist healthy when her sport rejects her heart?

  Miriam's answer was what she called *biographical functionalism*. A condition is pathological only when a biological variation conflicts with a person's practically situated life-plan. Not a universal standard. Not a cultural whim. But the specific, objective reality of the life that person is trying to live.

  For the family and patients in the room: This means Miriam never saw you as a broken machine to be fixed, nor as a social problem to be managed. She saw you as an author. Her job was not to force your biology into a textbook average, but to ask: "Does this biology allow you to write the story you intend?"

  But I also speak to the clinicians and philosophers here. We know the weight of the theories Miriam challenged. We know the dominant accounts that have governed our thinking for the last forty years. We know the theory that defines health as species-typical functional organization—the idea that there is a statistical baseline of human design, and deviation from that design is disease. We know the analysis that defines disease as a harmful dysfunction—the idea that a mechanism must fail its natural design *and* cause harm according to a welfare standard.

  Miriam respected these frameworks, but she found them insufficiently human.

  Where the first theory relies on the average human as the baseline, Miriam argued that the "average human" does not exist. There is only the specific human. To judge the cyclist by the statistical norms of the species is to ignore the functional norms of her biography. If her heart serves her life-plan, it is functioning, regardless of where it falls on the bell curve. She rejected the idea that we can define health by looking at a population rather than a person.

  Where the second theory relies on a concept of harm rooted in general welfare, Miriam argued that "welfare" is too vague. Harm is not an abstract cultural judgment. It is a concrete friction between capacity and intention. The office worker is not harmed because culture says he should work. He is harmed because his specific intention to work is physically blocked by his physiology.

  She insisted that these judgments are objective. This is the hardest pill to swallow. We are used to thinking that if something depends on a life-plan, it must be subjective. Miriam said no. It is an objective fact that the cyclist can ride. It is an objective fact that the worker cannot sit. The biology is real. The life-plan is real. The conflict between them is a fact of the world, not a feeling in the mind.

  She did not claim this view was easy to implement. She knew it demands more of the physician. It is easier to run a lab test than to ask a patient what they are trying to do with their life. It is easier to apply a cultural standard than to understand an individual biography. But she believed that easier is not the same as right.

  Miriam's view is not the mainstream view. If you open most textbooks today, you will not find biographical functionalism. You will find the statistical norms. You will find the general welfare standards. Miriam was comfortable with this. She was not interested in being right for the sake of consensus. She was interested in being right for the sake of the patient in the room.

  She taught us that medicine is not just the repair of organisms. It is the negotiation of possibilities. When we treat a patient, we are not just restoring a machine to factory settings. We are clearing the path for a specific journey.

  As we celebrate her retirement, we are not just celebrating a set of ideas. We are celebrating a stance. A stance that says the physician must be humble enough to listen to the biography, and rigorous enough to understand the biology. A stance that refuses to reduce the patient to a diagnosis, but also refuses to reduce the diagnosis to a social construct.

  So, as we move into this workshop, and as Miriam steps into this well-earned rest, I want to leave you with the question that drove her career. It is a question for the clinicians, the philosophers, and the caregivers in this room.

  If the identical biological fact can constitute health for one life-plan and disease for another, what is our clinical responsibility?

  Do we treat the rhythm, or do we treat the life? Do we aim for the statistical average, or the biographical fit? And if we choose the latter, how do we honor the truth of the body without losing the truth of the person?

  Miriam Kowalski spent a lifetime showing us that we do not have to choose. But she also showed us that holding both truths together is the hardest work we will ever do.

  Thank you, Miriam, for teaching us how to do it. And thank you all for being here to carry it forward.
