answer: |-
  You have put your finger on one of the central, unresolved tensions in political philosophy and transitional justice. While there is no single, canonical noun phrase that functions like "Gerrymandering" or "Gaslighting" for this specific maneuver, it is a well-documented structural problem.

  In legal theory, this touches on the **Doctrine of State Continuity** (the state survives regime changes and retains obligations) versus **Sovereign Immunity** or **Act of State doctrines** (courts won't judge the public acts of a prior sovereign). In moral philosophy, it engages with **Collective Transgenerational Responsibility** (are we responsible for our ancestors' acts?).

  Scholars like Janna Thompson (*Taking Responsibility for the Past*) and Elazar Barkan (*The Shame of Nations*) analyze this tension, often calling it the **"Apology-Reparation Gap"** or the **"Problem of Historical Liability."** However, these terms describe the *outcome*, not the *mechanism* of switching identity claims.

  Since there is no established single term for the *tactical switching* itself, I propose we coin one that captures the structural and temporal nature of the move.

  ### The Coinage: **Diachronic Identity Arbitrage**

  **Definition:** *Diachronic Identity Arbitrage* is the strategic exploitation of the gap between moral and legal definitions of statehood over time. It occurs when a state actor invokes **continuity of identity** (the "We") to claim moral standing or absolution, while simultaneously invoking **discontinuity of agency** (the "They") to evade legal liability or restitution.

  **Why "Arbitrage"?**
  In finance, arbitrage is profiting from a price difference between two markets. Here, the "markets" are the **Court of Public Opinion** (where moral capital is currency) and the **Court of Law** (where financial liability is currency). The state "buys" moral legitimacy cheap (using the "We" of continuity) and "sells" legal liability high (using the "They" of discontinuity), profiting from the inconsistency in valuation of the state's identity across time.

  ---

  ### Drawing the Edges: How it Differs from Equivocation

  You asked to distinguish this from simple equivocation on the pronoun "we." The distinction is crucial.

  **1. Linguistic vs. Institutional**
  *   **Equivocation** is a semantic sleight of hand. It happens within a single system of meaning. (e.g., "I didn't say *you* stole it, I said *someone* did.")
  *   **Diachronic Identity Arbitrage** is institutional. It relies on two *different* systems of judgment that have different rules for identity.
      *   **System A (Morality/Politics):** Identity is based on *narrative continuity*. "We" are the same nation because we share the land, culture, and constitution. This allows the apology to feel sincere.
      *   **System B (Law):** Identity is often based on *corporate liability and sovereignty*. Lawyers may argue that the specific *administration* or *legal regime* that authorized the act no longer exists, or that sovereign immunity blocks the claim, even if the State persists.
  *   **The Edge:** If a politician simply says "we" vaguely to confuse the issue, that's equivocation. If the Prime Minister says "We apologize" (moral continuity) while the Attorney General files a brief stating "The Crown in right of the 1920 Administration is not the Crown in right of the 2020 Administration" (legal discontinuity), that is **Arbitrage**. It requires the machinery of the state to operate in two contradictory modes simultaneously.

  **2. Intentionality of Structure**
  *   Equivocation can be accidental or ad-hoc.
  *   Arbitrage is structural. It is baked into the separation of powers. The Executive branch (apologizing) often has different incentives than the Judicial/Treasury branch (paying). The "double move" isn't necessarily one person lying; it is the state functioning as a fragmented agent.

  ---

  ### When the Moves Do Not Conflict

  There are cases where the moral "We" and the legal "They" align, or where the tension is resolved. These are the boundary conditions that prove the rule.

  **1. The "Constitutive Apology" (Identity Re-founding)**
  *   **Case:** Post-WWII Germany (*Wiedergutmachung*).
  *   **Why no conflict:** The new Federal Republic defined its *very legitimacy* on accepting liability for the Nazi regime. Here, the moral "We" and the legal "We" were fused. Accepting legal liability *was* the source of moral standing. To deny liability would have undermined the new state's identity. The arbitrage was impossible because the "profit" (legitimacy) required the "cost" (reparations).

  **2. Symbolic Reparations Only**
  *   **Case:** Apologies for historical wrongs where no living victims exist (e.g., apologies for slavery in contexts where no reparations bill is legally viable).
  *   **Why no conflict:** If the "price" of the moral apology is zero financial liability, there is no need to invoke legal discontinuity. The state can afford to be fully continuous because the legal market isn't involved. The arbitrage collapses because there is no second market to exploit.

  **3. Radical Regime Rupture (The "Odious Debt" Scenario)**
  *   **Case:** A revolutionary government repudiating the debts/crimes of a dictator (e.g., post-Apartheid South Africa or post-Saddam Iraq).
  *   **Why no conflict:** Sometimes the new regime argues *both* moral and legal discontinuity. They say, "That was not us (legally), and we condemn it morally, but we are not liable."
  *   **The Twist:** This isn't Arbitrage; it's **Clean Break Doctrine**. It lacks the *moral claim of continuity*. They don't say "We are sorry as the inheritors of this nation"; they say "We are sorry that this happened in our territory, but we are a new entity." This avoids the hypocrisy but often results in a "hollow" apology that satisfies neither victims nor historians.

  ### Summary
  The maneuver you identified is **Diachronic Identity Arbitrage**. It is distinct from hypocrisy because it is often legally coherent within separate branches of government; it is distinct from equivocation because it relies on structural differences between moral and legal systems, not just ambiguous language. It exists only where the state seeks the *prestige* of responsibility without the *price* of liability.
