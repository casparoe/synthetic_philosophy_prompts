  If the audience remains seated, how does amateur staging cure the corruption of spectatorship?

  2. Rousseau explicitly ranks comedy as more corrosive than tragedy precisely because its characters mirror ordinary citizens rather than distant heroes.
  Does this not entail that citizens performing comedy are enacting the very vices he seeks to purge?

  3. He concedes the *Misanthrope* is a poetic masterpiece while condemning its moral order for rewarding vice and mocking virtue.
  What mechanism within citizen staging alone corrects this textual inversion without excising the lines?

  4. His allowance for ancient tragedy hinges on its integration into civic ritual rather than its separation from daily life.
  Does this not shift the criterion of legitimacy from the mode of performance to the social embedding?

  5. Rousseau ultimately proposes public festivals in the open air where everyone is both actor and spectator simultaneously.
  If this dissolves the distinction entirely, why defend a citizen theatre that retains the stage-audience divide?

  6. The actor's art relies on arousing amour-propre, the desire to be seen and admired by others.
  Why should we assume citizen performers are immune to the vanity that Rousseau claims destroys natural compassion?

  Verdict: Spectator passivity survives amateur staging.
