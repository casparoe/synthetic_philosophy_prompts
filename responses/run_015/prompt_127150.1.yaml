answer: |-
  **DEPARTMENT OF LOGICAL SYNTAX**
  **BUREAU OF DENOTING PHRASES**
  **FORM 27-B: APPLICATION FOR LEAVE TO REFER**

  **PURSUANT TO** the Logical Syntax Act (1905), any applicant wishing to utter, publish, or inscribe a sentence containing a definite description must file this form prior to assertion. Failure to decompose singular terms into their quantificational constituents constitutes a category mistake punishable by semantic nullity.

  **SECTION 1: QUANTIFICATIONAL EXPANSION**
  Do not enter the surface grammar. You must expand the proposition into its constituent logical claims. Check all that apply:
  [ ] **Existence:** There is at least one entity satisfying the description.
  [ ] **Uniqueness:** There is at most one entity satisfying the description.
  [ ] **Predication:** Everything satisfying the description possesses the stated property.

  *Note: Leaving the "Uniqueness" box unchecked converts the phrase to an indefinite description (see Section 6). Attempting to treat the description as a singular term (Name) without prior baptismal certification will result in immediate rejection.*

  **SECTION 2: SCOPE OF NEGATION**
  If the proposition is negative, you must specify the scope of the negation operator. Ambiguity is not admissible.
  [ ] **Primary Occurrence (Wide Scope):** There exists exactly one F, and it is not G. (Truth Value: FALSE if no F exists).
  [ ] **Secondary Occurrence (Narrow Scope):** It is not the case that there exists exactly one F which is G. (Truth Value: TRUE if no F exists).

  *Example: Regarding "The present King of France is not bald." If you check Primary, you assert the King exists and is hairy. If you check Secondary, you deny the conjunction of existence, uniqueness, and baldness. Choose wisely.*

  **SECTION 3: INCOMPLETE DESCRIPTIONS**
  If the description admits of multiple satisfiers in the universal domain (e.g., "The table," "The car"), you must attach **Annex D-4 (Domain Restriction)**. You must specify the contextual domain (e.g., "The table [in this room]"). Failure to restrict the domain implies a claim of universal uniqueness, which is statistically improbable and legally reckless.

  **SECTION 4: MODE OF REFERENCE**
  [ ] **Attributive:** I am speaking of whoever/whatever fits the description.
  [ ] **Referential:** I am speaking of a specific individual I have in mind, using the description merely to identify them.

  *WARNING: Referential use is inadmissible in criminal proceedings. If you state "The murderer is insane" referring to the defendant in the dock, but the defendant is not actually the murderer, your statement is false. The insanity of the man in the dock is irrelevant to the truth value of the proposition. Do not attempt to use this form to commit evidentiary fraud.*

  **SECTION 5: EMPTY DESCRIPTIONS NOTICE**
  **ATTENTION:** If the existence condition in Section 1 is not met, the statement is **FALSE**. It is not "gappy." It is not "neither true nor false." It is false. Filing a statement with an empty description constitutes filing a false statement with the Bureau. Perjury charges may apply. Do not claim presupposition failure; presuppositions are not recognized currency in this jurisdiction.

  **SECTION 6: RECENT JURISDICTIONAL EXPANSIONS (MEMO 2023-C)**
  *Effective immediately, the Bureau's oversight extends to Plural Definite Descriptions and Indefinites.*
  *   **Plurals ("The Fs are G"):** Applicant must assert Existence (there are some Fs), Maximality (all Fs are included), and Predication (those Fs are G). Omitting Maximality implies a partial group, requiring Form 27-C.
  *   **Indefinites ("An F is G"):** Uniqueness constraint is waived. Existence and Predication only. Note that specificational readings require separate clearance.

  ***

  **[HANDWRITTEN GRAFFITI IN MARGIN]**
  *This is linguistic tyranny! You can't legislate truth conditions! — P.F. (Initials only)*

  **[STAMPED OVER SECTION 5]**
  **APPEAL PENDING:** The statement isn't FALSE, it just fails to say anything! You're violating the principle of communicative charity! Stop pretending non-existence is a property!

  **[POST-IT NOTE ATTACHED TO SECTION 4]**
  *Good luck proving the uniqueness clause for "The winner." What if there's a tie? Does the form explode?*

  **[OFFICIAL BUREAU RESPONSE STAMPED OVER GRAFFITI]**
  *Objection overruled. A tie implies no unique winner. Therefore, "The winner celebrated" is false. Fill out the form correctly or cease speaking.*

  **[BOTTOM CORNER]**
  **APPLICANT SIGNATURE:** ___________________
  **DATE:** _______________
  **LOGICAL FORM VERIFIED BY:** _______________

  *Retention Notice: Keep one copy for your records. Destroy the original if no satisfiers exist.*
