  # Activity Design: The Kinematics of Disagreement

  ## 1. Setup and Rules

  **Vignette:** *The Deep Space Probe.*
  You are the ground control team for a probe currently attempting to deploy its high-gain antenna. There are two hypotheses:
  *   **$H_1$ (Deployed):** The antenna is open. (Action: Begin Data Transmission).
  *   **$H_2$ (Stuck):** The antenna is stuck. (Action: Send Reset Command).

  **The Data:**
  You cannot see the antenna directly. You rely on two telemetry channels, **Channel A** and **Channel B**.
  *   **Channel A** reports a "Handshake Packet."
  *   **Channel B** reports a "Voltage Spike."

  **The Task:**
  The class is split into **Team Alpha** (Left side of room) and **Team Beta** (Right side of room).
  *   Both teams start with the **same Prior Distribution** (printed on handout).
  *   Both teams receive the **same two Evening Readings** (printed on handout).
  *   **The Difference:** Team Alpha processes Reading A *then* Reading B. Team Beta processes Reading B *then* Reading A.
  *   **Constraint:** You must update your probabilities using the **"Fixed-Conditional Rule"**: When a Reading shifts your confidence in a channel (e.g., "Confidence in Packet shifts to 90%"), you must rescale the probability mass of that channel's outcomes while **keeping the mix of Hypotheses inside that channel exactly the same.** (i.e., $P_{new}(H|Channel) = P_{old}(H|Channel)$).

  **Goal:**
  1.  Compute the final probability $P(H_1)$.
  2.  Make a recommendation: **Transmit** if $P(H_1) > 0.5$, **Reset** if $P(H_1) < 0.5$.
  3.  Record your final distribution for scoring.

  ---

  ## 2. Materials

  ### A. The Prior Distribution (Handout for All)
  *Total Count: 1000 Units (for easy percentages)*

  | Hypothesis | Channel A: Packet ($A_p$) | Channel A: No Packet ($A_n$) | **Row Total** |
  | :--- | :---: | :---: | :---: |
  | **$H_1$ (Deployed)** | 450 | 50 | **500** |
  | **$H_2$ (Stuck)** | 50 | 450 | **500** |
  | **Col Total** | **500** | **500** | **1000** |

  *Note: Channel B is cross-cutting. The joint distribution for B is below.*

  | Hypothesis | Channel B: Spike ($B_s$) | Channel B: No Spike ($B_x$) | **Row Total** |
  | :--- | :---: | :---: | :---: |
  | **$H_1$ (Deployed)** | 50 | 450 | **500** |
  | **$H_2$ (Stuck)** | 450 | 50 | **500** |
  | **Col Total** | **500** | **500** | **1000** |

  *(Instructor Note: To make the arithmetic tractable without a full $2\times2\times2$ table on the page, we treat the channels as conditionally independent given H for the sake of the initial count construction, but the update rule treats them as marginal shifts. The handout provides the specific "Cell Counts" needed for the update steps below to avoid students having to derive the 3-way joint from scratch.)*

  **Revised Handout Table (The "Master Grid" for Updates):**
  *Use this table for all calculations.*

  | State | Count |
  | :--- | :---: |
  | $H_1, A_p, B_s$ | 25 |
  | $H_1, A_p, B_x$ | 425 |
  | $H_1, A_n, B_s$ | 25 |
  | $H_1, A_n, B_x$ | 425 |
  | $H_2, A_p, B_s$ | 25 |
  | $H_2, A_p, B_x$ | 25 |
  | $H_2, A_n, B_s$ | 425 |
  | $H_2, A_n, B_x$ | 25 |
  | **Total** | **1000** |

  *(Check: $A_p$ sum = $25+425+25+25 = 500$. $B_s$ sum = $25+25+25+425 = 500$. $H_1$ sum = 500. $H_2$ sum = 500.)*

  ### B. The Evening Readings (Handout)

  **Reading 1 (Channel A):** "Noise analysis suggests the Handshake Packet is likely present. Shift confidence in **$A_p$ to 90%**."
  **Reading 2 (Channel B):** "Voltage telemetry suggests a Spike is likely present. Shift confidence in **$B_s$ to 90%**."

  *(Note: $A_p$ strongly supports $H_1$ in the prior. $B_s$ strongly supports $H_2$ in the prior.)*

  ### C. Procedure Cards (Distribute by Team)

  **Team Alpha Card:**
  1.  Apply **Reading 1 (Channel A)** to the Master Grid.
      *   *Instruction:* Multiply all rows where $A_p$ is present by **1.8**. Multiply all rows where $A_n$ is present by **0.2**.
      *   *Check:* Your new total for $A_p$ should be 900. Your new total for $A_n$ should be 100.
      *   *STOP:* Verify your intermediate $H_1$ total with the Instructor before proceeding.
  2.  Apply **Reading 2 (Channel B)** to your *new* grid.
      *   *Instruction:* Multiply all rows where $B_s$ is present by **[Factor X]**. Multiply all rows where $B_x$ is present by **[Factor Y]**.
      *   *(Instructor provides Factors X and Y based on their intermediate sum to ensure clean integers, see Answer Key).*
  3.  Calculate Final $P(H_1)$. Make Decision.

  **Team Beta Card:**
  1.  Apply **Reading 2 (Channel B)** to the Master Grid.
      *   *Instruction:* Multiply all rows where $B_s$ is present by **1.8**. Multiply all rows where $B_x$ is present by **0.2**.
      *   *Check:* Your new total for $B_s$ should be 900. Your new total for $B_x$ should be 100.
      *   *STOP:* Verify your intermediate $H_1$ total with the Instructor before proceeding.
  2.  Apply **Reading 1 (Channel A)** to your *new* grid.
      *   *Instruction:* Multiply all rows where $A_p$ is present by **[Factor X]**. Multiply all rows where $A_n$ is present by **[Factor Y]**.
  3.  Calculate Final $P(H_1)$. Make Decision.

  ### D. Answer Key (Instructor Only)

  **Prior:** $P(H_1) = 0.5$.

  **Team Alpha (A then B):**
  1.  **Update A:** Scale $A_p \times 1.8$, $A_n \times 0.2$.
      *   $H_1$ cells ($A_p$): $25 \to 45$, $425 \to 765$.
      *   $H_1$ cells ($A_n$): $25 \to 5$, $425 \to 85$.
      *   $H_2$ cells ($A_p$): $25 \to 45$, $25 \to 45$.
      *   $H_2$ cells ($A_n$): $425 \to 85$, $25 \to 5$.
      *   **Intermediate $H_1$ Total:** $45+765+5+85 = \mathbf{900}$. ($P(H_1) = 0.9$).
      *   **Intermediate $B_s$ Total:** $45 (H_1 A_p) + 5 (H_1 A_n) + 45 (H_2 A_p) + 85 (H_2 A_n) = \mathbf{180}$.
      *   **Intermediate $B_x$ Total:** $765 + 85 + 45 + 5 = \mathbf{820}$.
  2.  **Update B:** Target $B_s = 900, B_x = 100$.
      *   Factor $B_s$: $900/180 = \mathbf{5}$.
      *   Factor $B_x$: $100/820 = \mathbf{5/41}$ (Approx 0.122). *To avoid fractions, tell them: "Scale $B_s$ to sum to 900, scale $B_x$ to sum to 100."*
      *   Let's adjust the instruction for simplicity: "Rescale $B_s$ rows so they sum to 900. Rescale $B_x$ rows so they sum to 100."
      *   **Final Calculation:**
          *   $H_1, B_s$ (was 50): Scaled to $50 \times (900/180) = 250$.
          *   $H_1, B_x$ (was 850): Scaled to $850 \times (100/820) \approx 103.6$.
          *   $H_2, B_s$ (was 130): Scaled to $130 \times 5 = 650$.
          *   $H_2, B_x$ (was 50): Scaled to $50 \times (100/820) \approx 6.1$.
          *   **Final $H_1$:** $250 + 104 = 354$.
          *   **Final $H_2$:** $650 + 6 = 656$.
          *   **$P(H_1) \approx 0.35$. Decision: RESET.**

  **Team Beta (B then A):**
  1.  **Update B:** Scale $B_s \times 1.8$, $B_x \times 0.2$.
      *   $H_1$ cells ($B_s$): $25 \to 45$, $25 \to 45$.
      *   $H_1$ cells ($B_x$): $425 \to 85$, $425 \to 85$.
      *   $H_2$ cells ($B_s$): $25 \to 45$, $425 \to 765$.
      *   $H_2$ cells ($B_x$): $25 \to 5$, $25 \to 5$.
      *   **Intermediate $H_1$ Total:** $45+45+85+85 = \mathbf{260}$. ($P(H_1) = 0.26$).
      *   **Intermediate $A_p$ Total:** $45+85+45+5 = \mathbf{180}$.
      *   **Intermediate $A_n$ Total:** $45+85+765+5 = \mathbf{900}$.
  2.  **Update A:** Target $A_p = 900, A_n = 100$.
      *   Factor $A_p$: $900/180 = \mathbf{5}$.
      *   Factor $A_n$: $100/900 = \mathbf{1/9}$.
      *   **Final Calculation:**
          *   $H_1, A_p$ (was 90): Scaled to $90 \times 5 = 450$.
          *   $H_1, A_n$ (was 170): Scaled to $170 / 9 \approx 19$.
          *   $H_2, A_p$ (was 50): Scaled to $50 \times 5 = 250$.
          *   $H_2, A_n$ (was 770): Scaled to $770 / 9 \approx 86$.
          *   **Final $H_1$:** $450 + 19 = 469$.
          *   **Final $H_2$:** $250 + 86 = 336$.
          *   **$P(H_1) \approx 0.58$. Decision: TRANSMIT.**

  **Result:** Team Alpha recommends **Reset**. Team Beta recommends **Transmit**.

  ---

  ## 3. Payoff Scheme

  **Scoring Rule:** Brier Score.
  *   Formula: $Score = 1 - (P_{assigned} - Outcome)^2$.
  *   Max score = 1 (Perfect certainty in truth). Min score = 0 (Perfect certainty in falsehood).
  *   **The Truth:** For the purpose of the game, the "Truth" is drawn from a bag containing 1000 chips corresponding to the **Prior** distribution. (This ensures the scoring rule is proper relative to the prior, though the activity is about the update process).
  *   **Decision Payoff:**
      *   If Truth is $H_1$ and you said Transmit: +10 points.
      *   If Truth is $H_2$ and you said Reset: +10 points.
      *   Mismatch: -10 points.

  **Can Scoring Discriminate?**
  *   *Honest Assessment:* No, not in a single round. Since the "Truth" is fixed (or drawn from the prior), one group will get lucky and one will get unlucky.
  *   *Expected Score:* The difference in expected Brier score between the two orders is typically small (second-order effect) unless the priors are extreme.
  *   *Rounds:* You would need ~50 rounds to statistically distinguish the accuracy of the two orders via scoring alone.
  *   *Recommendation:* Do **not** run multiple rounds. It spoils the "reveal." Use the scoring only to validate that they reported their true credences (properness), not to judge which update rule was "better." The *decision disagreement* is the payoff, not the score.

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  *   **00-10: Introduction.**
      *   Distribute handouts. Split room (Left=Alpha, Right=Beta).
      *   Explain the "Fixed-Conditional Rule" (rescale columns, keep internal mix).
      *   **Do not name Jeffrey Conditionalization.** Call it "Probability Kinematics" or "The Shift Rule."
  *   **10-25: Round 1 (Certainty).**
      *   Instruction: "Imagine Reading 1 was **Certain**. You observe $A_p$ is TRUE."
      *   Task: Conditionalize on $A_p$. Then Conditionalize on $B_s$ (assume certain).
      *   Result: Both teams arrive at $P(H_1 | A_p \cap B_s)$.
      *   **Reveal:** Ask for show of hands on final $P(H_1)$. They should match.
      *   *Point:* Certainty commutes. $P(H|E,F) = P(H|F,E)$.
  *   **25-50: Round 2 (Uncertainty).**
      *   Instruction: "Now use the **Shift Rule** (uncertain evidence) as per your Team Card."
      *   Students work in pairs. Instructor circulates to check Intermediate Totals (prevents arithmetic drift).
      *   Teams calculate Final $P(H_1)$ and Decision.
  *   **50-60: The Reveal.**
      *   Ask Team Alpha for Decision (Reset).
      *   Ask Team Beta for Decision (Transmit).
      *   Write the two probabilities on the board (0.35 vs 0.58).
      *   Collect Score Sheets (for propriety check).
  *   **60-90: Debrief & Formalization.**
      *   (See Section 5).

  ---

  ## 5. Debrief Script & Formal Mapping

  **1. The Commutativity of Certainty (Round 1)**
  *   *Board:* Draw the Venn diagram of $H, E, F$.
  *   *Point:* When evidence is certain ($P(E)=1$), we restrict the world to the intersection $E \cap F$. Set theory is commutative. Intersection is order-independent.

  **2. The Non-Commutativity of Shifts (Round 2)**
  *   *Board:* Write the Jeffrey Formula: $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
  *   *Point:* In Round 2, Team Alpha updated $A$ first. They preserved $P(H|A)$. But when they updated $B$, they used the *new* $P(H|B)$, which had been distorted by the $A$-update.
  *   *Visual:* Show how the "mix inside the column" changed after the first update. Team Beta preserved the *original* $P(H|B)$ mix, which was different.
  *   *Formal Name:* Reveal this is **Jeffrey Conditionalization** (or Probability Kinematics).

  **3. The "Fixed Conditional" Assumption**
  *   *Question:* "Why did we hold $P(H|E)$ fixed?"
  *   *Answer:* Because the rule assumes the evidence $E$ is "sufficient" or that the learning is *only* about the probability of $E$, not about the relationship between $E$ and $H$.
  *   *The Wrinkle:* Remind them of the vignette detail: *"Sensor B glitches more when the machine is Broken."*
  *   *Critique:* If $P(B|H)$ depends on $H$, then shifting $P(B)$ without knowing $H$ is substantively dubious. You are effectively assuming the sensor's reliability is independent of the state, which the vignette said was false. This is the **Wagner Critique**.

  **4. The Strongest Objection (Likelihood Ratios)**
  *   *Facilitator:* "A sharp student might say: 'A sensor reading shouldn't give me a probability $P(E)$. It should give me a Likelihood Ratio $P(E|H)/P(E|\neg H)$.'"
  *   *Activity:* Ask the room to quickly compute the update using Likelihood Ratios (Bayes Factor) for both readings.
  *   *Result:* Bayes Factors *do* commute. $Posterior \propto Prior \times LF_1 \times LF_2$.
  *   *Takeaway:* Jeffrey Conditionalization is for when you *cannot* formulate the evidence as a likelihood (e.g., "I'm 90% sure I saw red," but you don't know the sensor's error rates). If you *can* use Likelihoods, do that—it's commutative and robust. Jeffrey is a fallback for "soft" evidence, but it costs you commutativity.

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  1.  **Arithmetic Drift:**
      *   *Problem:* A pair miscalculates the intermediate sum, gets the wrong scaling factor for Step 2, and ends up with a random number.
      *   *Fix:* The "Intermediate Check" (Section 2C) is mandatory. Do not let them proceed to Step 2 until you initial their intermediate $H_1$ total.
  2.  **The "Contaminator":**
      *   *Problem:* One pair finishes early, realizes the other side has different instructions, and shouts it out.
      *   *Fix:* Seat teams far apart. Collect Step 1 worksheets before distributing Step 2 instructions. Explicitly state: "Do not talk to the other side of the room until the Reveal."
  3.  **The "Why are we doing this?" Objection:**
      *   *Problem:* Students argue that rational agents should never have uncertain evidence of this form.
      *   *Fix:* Acknowledge this in the Debrief (Section 5, Point 4). The activity is to show the *consequences* of the rule, not to defend its universal necessity.
  4.  **Rounding Errors:**
      *   *Problem:* The $1/9$ factor in Team Beta's Step 2 creates decimals.
      *   *Fix:* Tell them to round to the nearest integer. The gap (0.35 vs 0.58) is large enough to survive rounding noise.

  ---

  ## 7. Honest Limitations Note

  **What this activity does:**
  *   It viscerally demonstrates that **Jeffrey Conditionalization is non-commutative**.
  *   It shows that this non-commutativity can be **decision-relevant** (flipping the recommended action).
  *   It highlights the **input problem** (where do the $P_{new}(E)$ values come from?).

  **What this activity does NOT do:**
  *   **It does not prove Jeffrey Conditionalization is wrong.** It only shows it has this property. In some contexts (e.g., rigid partitions), it is the only coherent way to update.
  *   **It does not solve the "Order Problem."** The activity doesn't tell you which order is *correct*. (Usually, the order that reflects the actual temporal arrival of information is preferred, but even that is debated).
  *   **It does not justify updating.** A skeptic could argue one should simply minimize expected loss relative to the prior without updating at all. This activity assumes updating is required and tests *how*.

  **Instructor Closing:**
  "We have shown that if you treat evidence as a direct probability shift, order matters. If you treat evidence as a likelihood ratio, order doesn't matter. The choice of how to represent your evidence is therefore not just technical—it determines whether your beliefs depend on the sequence of your observations."
