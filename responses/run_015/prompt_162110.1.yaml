  **Principal Investment Strategies**

  The Oikos Fund seeks current income and capital appreciation consistent with natural *chrematistikē*. The Fund distinguishes between wealth-getting aimed at sufficiency for the needs of the *oikos* and unnatural accumulation, which seeks unlimited increase. The Fund strictly avoids strategies wherein money breeds money directly, as such offspring (*tokos*) are contrary to the nature of currency as a conventional measure of exchange. Instead, the Fund seeks returns through the production of goods with intrinsic utility or through compensation for the safekeeping of capital deployed to third parties. The Adviser reserves the right to utilize market cornering strategies similar to the Thales olive-press precedent, solely to demonstrate capability, without obligation to realize profits.

  **Principal Risks of Investing in the Fund**

  1.  **Custody and Storage Fee Risk.** To comply with prohibitions on usury, income generated from lending activities is reclassified as a fee for safeguarding principal while in the borrower's possession. This fee scales proportionally with the size of the principal and the duration of the safeguarding period. There can be no assurance that regulators will view this distinction as substantive rather than formal. Investors could lose money if such fees are recharacterized as interest.

  2.  **Thales Clause Non-Exercise Risk.** The Adviser explicitly reserves the right not to exercise winning positions or monetize cornered inputs if doing so would violate the philosophical mandate to prove wisdom supersedes profit. This may result in the Fund holding valuable assets that are intentionally left unexploited. Performance may suffer materially due to the Adviser's decision to demonstrate that philosophy is not useless by refusing to be useful.

  3.  **Asset Classification Risk.** The Fund categorizes modern financial instruments into natural archetypes to ensure compliance with natural wealth-getting mandates. Semiconductor fabrication facilities may be classified as pastoral herdsmanship, and index futures may be deemed analogous to fishing. If these classifications are challenged, the Fund may be forced to liquidate holdings deemed unnatural, potentially at a loss.

  4.  **Use-versus-Exchange Liquidity Risk.** Holdings must be certified by the Adviser as intended for proper use rather than resale. A shoe held for wearing cannot be sold for profit. This restriction severely limits the Fund's ability to diversify or exit positions during market downturns, as exchanging assets for currency may be viewed as unnatural wealth-getting if the currency is not immediately required for household needs.

  5.  **Conventionality of Money Risk.** The Fund operates on the premise that money holds value only by convention and law, serving as a pledge for future exchange that ties the *polis* together. Should social convention shift or the political community fracture, the conventional measure may cease to function, rendering the Fund's proportional reciprocity calculations void.

  6.  **Limitation of Ends Risk.** The Fund's objective is sufficiency, not unlimited growth. Once the portfolio achieves a level deemed sufficient for the good life, the Adviser may cease active management or distribute capital to prevent unnatural accumulation. Investors seeking maximum compounding may find the Fund's performance capped arbitrarily.

  7.  **Proportional Reciprocity Risk.** Returns are predicated on the successful establishment of proportional return among parties. If market participants fail to adhere to proportional justice in exchange, the Fund's models for fair value may fail, leading to discrepancies between intrinsic utility and market price.
