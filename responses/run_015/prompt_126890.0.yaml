  Here is the tiered breakdown for your handout. I counted nine distinct replies in your description (six standard, three invented), so I have ranked all nine. The tiers reflect **dialectical effectiveness** against a skeptic who finds leveling down (LD) inherently repugnant, not necessarily which view is "true."

  ### Tier 1: The Logical Blocks
  *These replies argue the objection is a category error or logically incoherent, offering the strongest defense without conceding the theory is counterintuitive.*

  | Reply | Sting Removal | Core Retention | Why it lands here |
  | :--- | :---: | :---: | :--- |
  | **Silence** | 8 | 8 | It denies the theory applies to non-gain cases, rendering the objection a question the view is designed to ignore. |
  | **Person-Affecting** | 9 | 6 | It blocks the verdict entirely by requiring a beneficiary, though it sacrifices the impersonal nature central to standard prioritarianism. |

  ### Tier 2: The Theoretical Modifications
  *These save the view by adjusting the machinery or scope, but they concede that pure prioritarianism needs help or restriction.*

  | Reply | Sting Removal | Core Retention | Why it lands here |
  | :--- | :---: | :---: | :--- |
  | **Same-Currency (Inv.)** | 6 | 7 | It isolates the repugnance to specific harm-types, preserving the weighting function while admitting LD is wrong in vision cases. |
  | **Pluralist Sidestep** | 5 | 5 | It acknowledges the repugnance as a separate value clash, saving the intuition but admitting prioritarianism isn't the whole story. |
  | **Feasibility-Relative (Inv.)** | 5 | 4 | It dissolves the specific case by changing the baseline metric, but drifts significantly from welfarist prioritarianism toward luck egalitarianism. |

  ### Tier 3: The Reframings & Surrenders
  *These either fail to fully neutralize the intuition, rely on psychological tricks, or abandon the core theory to save the intuition.*

  | Reply | Sting Removal | Core Retention | Why it lands here |
  | :--- | :---: | :---: | :--- |
  | **Ex Ante Move** | 4 | 7 | It shifts the debate to risk, but ex ante prioritarianism generates parallel leveling-down objections regarding expected welfare. |
  | **Serialization (Inv.)** | 3 | 9 | It attacks the psychological force of the intuition pump without addressing the normative claim that the final outcome is better. |
  | **Bite the Bullet** | 0 | 10 | It retains the theory perfectly but offers zero dialectical resistance to someone who views the implication as a *reductio*. |
  | **Sufficientism** | 9 | 1 | It eliminates the objection by thresholding, but this is effectively abandoning prioritarianism for a rival theory. |

  ***

  ### What Would Change My Mind About This Ordering

  My ranking is most fragile on three specific points, and shifting any of them would reshuffle the tiers significantly.

  **1. The Normative Weight of Serialization (Invented b)**
  I currently rank **Serialization** low (Tier 3) because I treat it as a psychological debiasing tool rather than a normative solution. If you can demonstrate that moral repugnance is *constituted* by the salience of the loss (i.e., if the loss isn't salient, the wrongness literally disappears, not just our feeling of it), this jumps to Tier 1. My ranking assumes a "summing" view of harm where 1,000 small harms equal one big harm; if you convince me that moral ontology is episodic rather than aggregative, Serialization becomes a top-tier defense.

  **2. The Definition of "Core Retention" vs. "Theoretical Cost"**
  I scored **Sufficientism** as 1 on Core Retention because it is technically a different theory. However, if your reading group defines Prioritarianism loosely as "any view that weights the worse-off more heavily," Sufficientism jumps to Tier 1. My ranking assumes a strict Parfitian definition where the weighting function must be continuous and unbounded. If the group accepts a "family resemblance" definition, Sufficientism becomes the most effective reply, not a surrender.

  **3. The Blind/Sighted Case as an Outlier**
  My ranking of **Bite the Bullet** is low because I assume the LD intuition is robust. If you successfully argue that the blind/sighted case is a "hard case" driven by deontological constraints against harming (which prioritarianism ignores) rather than axiological betterness, the Bite the Bullet option becomes more palatable. If the repugnance is revealed to be a side-constraint violation rather than a judgment about the *goodness* of the outcome, the sting of LD vanishes, and Bite the Bullet moves to Tier 2.

  **Where My Ranking is Most Likely Wrong:**
  I am likely under-scoring the **Feasibility-Relative** reply. I penalized it for drifting toward luck egalitarianism, but if Prioritarianism is fundamentally about *responsibility-sensitive* priority rather than raw welfare, Feasibility-Relative might actually be a *higher* retention of the core moral insight than standard welfarist prioritarianism. If your group views "worse off" as a comparative status of opportunity rather than achieved welfare, Feasibility-Relative belongs in Tier 1.
