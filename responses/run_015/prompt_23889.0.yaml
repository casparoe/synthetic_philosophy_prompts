answer: |-
  This is a sharp, well-structured draft. You have correctly identified the primary tension in the secondary literature (the sedition ban vs. the tyrannicide permission) and your resolution in the first paragraph is textually solid. *Summa Theologiae* II-II, q.42, a.2, ad 3 does indeed distinguish between disturbing a just regime (sedition) and disturbing a tyrannical one (which may not be sedition, though it risks greater evils).

  However, your intuition in the third paragraph is correct: **the move you make in the second paragraph regarding "private authority" is the weak link.** It is the source of the "knot" you feel.

  Here is a breakdown of where the argument holds and where it risks snapping, specifically focusing on your request to critique the second and third paragraphs.

  ### 1. The Strength of Paragraph 1 (Sedition vs. Tyranny)
  Your reading here is robust. You are right to insist that Aquinas defines sedition as an attack on the *unity of the common good*. If the regime is tyrannical, it is, by definition, no longer pursuing the common good but the private good of the ruler. Therefore, resisting it is not *prima facie* sedition.
  *   **Keep this.** It clears the ground effectively.
  *   **Minor Nuance:** You might acknowledge that Aquinas still warns that removing a tyrant can *become* sedition if it leads to greater disorder (schism) than the tyranny itself. But your core logical distinction stands.

  ### 2. The Problem with Paragraph 2 (The "Private Authority" Claim)
  This is where your uncertainty is well-founded. You write: *"if no public authority exists, by private authority... the private right doesn't just collapse into the public one, it's what's left."*

  **The Textual Challenge:**
  Aquinas is actually much more restrictive here than your draft suggests. In *De Regno* (Book I, Ch. 6), Aquinas explicitly argues *against* private individuals killing tyrants. He cites the example of Ehud (Aod) killing Eglon, but he frames this as a case of **divine inspiration**, not a natural right of private authority.
  *   Aquinas's standard position is that lethal force requires **public authority**.
  *   When he discusses who can depose a tyrant, he suggests either a **superior authority** (an emperor over a king) or the **community itself** acting to depose the ruler they installed.
  *   He does *not* clearly grant a "private authority" fallback for individuals. In fact, he warns that allowing private killing exposes the community to greater danger (assassination, factionalism) than the tyranny itself.

  **The Interpretive Risk:**
  The reading you are proposing (that Aquinas allows a private right when public authority collapses) sounds more like the **later Scholastics** (e.g., Suárez, Mariana, or the Salamanca School) than Aquinas himself. The later Thomists expanded the "public authority" definition to include the "community acting virtually," which sometimes looked like private rights. But attributing a "private authority carve-out" directly to Aquinas is a hard sell textually.
  *   **Critique:** You claim the private-authority clause is "genuinely permissive." I would argue Aquinas views it as **presumptuous** unless divinely sanctioned. He prefers the "public authority" route (the community acting *ut universi*, as a whole) over the "private" route (*ut singuli*, as individuals).

  ### 3. The "Multitude as Tyrant" Problem (Paragraph 3)
  Your worry here is the strongest part of your critique. You ask: *"If the multitude itself can be the tyrant, then who is the 'private' agent?"*

  This insight actually disproves the "private right" reading in Paragraph 2.
  *   If the tyranny is democratic (the multitude oppressing the rich, or a faction oppressing the rest), there is no "private" outsider to act.
  *   If the "private agent" is a member of that multitude, their action looks exactly like the sedition you ruled out in Paragraph 1.
  *   If the "private agent" is an outsider, they are an invader, not a liberator.

  This suggests that Aquinas's solution isn't "Private Authority," but rather **"Constitutional/Communal Authority."** For Aquinas, the "public authority" required to kill a tyrant isn't necessarily a higher king; it can be the community *reclaiming* the authority they delegated. But they must act *as a public body*, not as private assassins.

  ### Recommendation for the "Move"
  You feel the knot because you are trying to make Aquinas sound more like a liberal individualist (private right of resistance) than he is. He is a corporatist.

  **Suggested Revision Strategy:**
  Instead of arguing that Aquinas allows a **private right**, argue that he allows a **communal right that functions without a superior.**
  1.  **Reframe Paragraph 2:** Drop the "private authority" claim. Instead, argue that for Aquinas, "public authority" in a tyranny doesn't mean a *superior* magistrate (since the tyrant holds the top spot); it means the **community acting collectively** to revoke the mandate.
  2.  **Address the Knot:** The "private authority" clause isn't a carve-out for individuals; it's a description of what happens when the *res publica* acts to save itself.
  3.  **Resolve Paragraph 3:** If the multitude is the tyrant, Aquinas's framework struggles (as you noted). But this strengthens your overall thesis: Aquinas is not providing a universal theory of revolution, but a theory of **restoring right order.** If the multitude is the tyrant, there is no "right order" to restore via violence without falling into sedition. This explains why he is so cautious.

  ### Summary
  *   **Paragraph 1:** Keep. It's accurate.
  *   **Paragraph 2:** Pivot. Don't claim Aquinas allows "private authority." Claim he allows the **community to act as public authority** even without a superior. This avoids the textual trap of him condemning private assassination.
  *   **Paragraph 3:** Use this to show the *limits* of his theory. The "multitude as tyrant" scenario shows why he can't simply endorse a private right. It forces the action back into the public/communal sphere, or else it becomes sedition.

  You have identified the exact tension that divides Thomist interpreters. If you shift from "Private Right" to "Communal Capacity," the knot loosens significantly.
