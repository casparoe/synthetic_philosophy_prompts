answer: |-
  It is entirely understandable that you remain unsettled by your friend's assertion. To suggest that Sidgwick would have simply abandoned his project upon encountering modern scepticism is to misunderstand the specific philosophical architecture of his thought. Your intuition is correct: there is a profound tension in Sidgwick's work between his demand for empirical rigour and his utilitarian conviction that certain truths are too significant to be ignored merely because they are improbable. If we transpose Sidgwick into the contemporary landscape of pre-registered trials and hierarchical Bayesian modelling, we must not ask only what he would believe, but how he would weigh the duty of inquiry against the duty of welfare.

  To begin with the epistemic dimension, your friend is partially right that Sidgwick would have welcomed the modern methodological turn. Sidgwick was never a credulous spiritualist; he was a philosopher who sought to bring the scientific method to bear on claims that science had prematurely dismissed. He co-founded the Society for Psychical Research precisely to separate genuine anomalies from fraud, delusion, and coincidence. Consequently, he would likely view the replication crisis not as a reason to cease inquiry, but as a vindication of his original caution. He always insisted that the burden of proof lay heavily upon the claimant.

  In a modern context, Sidgwick would almost certainly endorse the use of pre-registered reports and explicit prior distributions. These tools are the natural evolution of the 'cautious openness' he championed. They prevent the very post-hoc rationalisations and data-dredging that plagued Victorian psychical research. If modern Bayesian analyses suggest that the prior probability of anomalous cognition is vanishingly low, Sidgwick would accept that mathematical reality. He was too honest a thinker to cling to a hypothesis that consistently failed to update the probabilities in its favour. However, and this is crucial, he would resist the dogmatic assertion that the probability is zero. For Sidgwick, to declare a question closed *a priori* is a violation of empirical duty. He would argue that as long as the methodology remains rigorous, the inquiry retains a slender epistemic justification, even if the likelihood of success is minimal.

  However, the crux of your disagreement lies in the ethical calculus, specifically regarding opportunity costs. This is where Sidgwick's utilitarianism becomes the deciding factor. A strict act-utilitarian might argue that if funds spent on psychical research could instead be deployed for mental-health interventions with demonstrable efficacy, then continuing the former is morally wrong. The 'good' produced by curing depression is certain and immediate; the 'good' produced by proving survival of death is speculative and distant.

  Yet, Sidgwick's utilitarianism was nuanced by his understanding of the 'magnitude' of potential consequences. In his ethical writings, he acknowledged that some truths possess a transformative value that outweighs their probability. If the existence of anomalous cognition or survival after death were established, it would fundamentally alter our conception of human identity, morality, and the structure of the universe. The utility of such a discovery is, in a sense, infinite. Therefore, in a Sidgwickian calculus, one multiplies the probability of the event by the magnitude of its value. Even if the probability is microscopic, if the value is sufficiently vast, the expected utility may still justify a modest investment.

  This leads to a likely synthesis of his position. Sidgwick would not support the diversion of scarce public resources away from proven medical interventions. To do so would violate the principle of maximising immediate welfare, a core tenet of his ethics. He would agree with your friend that institutional funding should prioritise demonstrable human relief. However, he would not conclude that the inquiry itself should be abandoned. Instead, he would likely argue for a compartmentalisation of funding. He would defend the right of the inquiry to continue, supported by private philanthropy or marginal university budgets that do not encroach upon essential welfare services.

  He would view the total suppression of such research as a form of 'scientific dogmatism' that carries its own long-term moral cost. History has shown that phenomena dismissed as impossible sometimes later become the foundation of new scientific paradigms. For Sidgwick, the moral cost of prematurely closing a line of inquiry that could yield transformative knowledge is a sin against the intellect and, ultimately, against human progress.

  Therefore, Sidgwick's position would likely be one of 'cautious, low-cost persistence'. He would accept that modern statistical methods have lowered the probability of psychical claims being true, and thus he would scale back the *intensity* of the investigation. He would not demand large grants or institutional priority. But he would fiercely defend the *legitimacy* of the question. He would argue that a civilisation that ceases to investigate the boundaries of human cognition because the answers are difficult or improbable has succumbed to a utilitarianism of the short term, neglecting the profound long-term interests of humanity.

  In conclusion, while your friend is correct that Sidgwick would demand stricter adherence to modern statistical rigour, they are incorrect to assume this would lead to total abandonment. Sidgwick would likely conclude that the opportunity costs prohibit *large-scale* public investment, but the potentially infinite value of the truth prohibits *total* cessation. He would occupy the uncomfortable middle ground you identified: defending the right to ask the question, provided the cost of asking it does not deprive others of the means to survive. He would remain, as ever, the sceptical seeker, holding the door ajar but refusing to let the draft become a gale.
