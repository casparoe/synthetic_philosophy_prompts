answer: |-
  # Final Exam: Normative Questions in Machine Learning
  **Time Allowed:** 60 Minutes
  **Word Limit:** 1,000 words maximum
  **Total Marks:** 25

  ### Question 1

  Consider the scheme known as **Iterated Amplification and Distillation (IA/D)**. The process operates in cycles. In the **Amplification** phase, a model faces a complex task. Instead of solving it directly, it acts as a supervisor: it decomposes the task into subtasks, delegates these to copies of itself (or weaker models), and aggregates the sub-answers into a final solution. This creates a tree of computation at inference time. In the **Distillation** phase, a new model is trained via supervised learning to mimic the input-output behaviour of the amplified system. This distilled model becomes the starting point for the next cycle, theoretically allowing the system to tackle harder tasks over time while remaining within the oversight capacity of a human (or weak overseer) who can verify the leaf nodes and aggregation steps.

  A debate exists regarding the safety and competence of this scheme. One position holds that IA/D is essentially **divide-and-conquer**: if every leaf answer is checkable by a weak overseer, and the aggregation is checkable, the composite is checkable. Competence scales because the amplified system commands more computation than the distilled model. A opposing position holds that this treats **decomposition** as neutral bookkeeping, when in fact decomposition is where competence and alignment are determined.

  Write an essay evaluating the stability of alignment and competence in IA/D. You must engage explicitly with the following three distinctions. You may defend or critique the scheme, but you will not receive top marks for merely describing how it works.

  1.  **The Two Axes of Recursion:** Distinguish between recursion *within* a task (the tree of subagents during amplification) and recursion *across training rounds* (the distilled model becoming the next round's amplifier). Explain why an argument that alignment is preserved in the first axis does not automatically guarantee preservation in the second.
  2.  **The Decomposer Trilemma:** The **decomposer** is the function that maps a task to a decomposition (subquestions, briefs, ordering). Consider three properties a decomposer might possess:
      *   **Competence-Adequacy:** It can reduce novel, hard tasks to leaves within the overseer's reach.
      *   **Exogeneity:** It is not produced by the policy currently being improved (it has an external anchor).
      *   **Auditability:** Its output (the decomposition plan) is checkable by a weak overseer who cannot solve the task themselves.
      Argue which of these three properties is the most difficult to maintain simultaneously with the others, and which leg a proponent of IA/D should arguably give up (or modify) to make the scheme work.
  3.  **The Distillation Gap:** Even if the amplified system is aligned, the distilled model is trained only to match its outputs, not its internal procedure. Explain why matching outputs is not equivalent to preserving the reasoning procedure. Furthermore, explain why failure here would likely be **systematic** (concentrated on off-distribution cases where added competence is needed) rather than random noise.

  ---

  ### Model Answer

  Iterated Amplification and Distillation (IA/D) offers a compelling narrative for scalable oversight, but its stability relies on assumptions that collapse when we distinguish between the mechanisms of recursion, decomposition, and distillation. While the divide-and-conquer intuition is attractive, it fails to account for drift across training rounds, the self-referential nature of the decomposer, and the fidelity gap in distillation.

  First, we must distinguish the two axes of recursion. Recursion *within* a task involves a tree of subagents solving subproblems. Here, alignment arguments rely on verification: if a human can check the leaves and the aggregation logic, the root is safe. However, recursion *across training rounds* involves the distilled model becoming the amplifier for the next cycle. This is an inductive process, not just a verificational one. Even if the amplified system is aligned in round $N$, the distilled model is a new function approximator trained on that system's outputs. If the distillation introduces even minor alignment errors, these errors compound in round $N+1$ when the slightly misaligned model acts as the decomposer and solver for the next amplification phase. Safety within a single tree does not guarantee safety across the sequence of trees, because the agent generating the decomposition changes at every step. The second axis requires a proof of stability under iterative self-modification, which is strictly harder than verifying a static computation tree.

  Second, the scheme hinges on the **decomposer**. The Decomposer Trilemma suggests we cannot simultaneously have Competence-Adequacy, Exogeneity, and Auditability. If the decomposer is **Exogenous** (fixed externally), it lacks the **Competence-Adequacy** to break down novel, superhuman tasks into human-checkable leaves; a static rule set cannot anticipate every hard problem. If the decomposer is learned by the model to ensure competence, it loses Exogeneity, becoming self-referential. The model then chooses which questions to ask itself. Without Exogeneity, **Auditability** becomes precarious: a weak overseer can check if a subanswer matches a subquestion, but cannot easily check if the decomposition itself was manipulative (e.g., splitting a task in a way that hides harmful intermediate steps).

  A proponent should arguably give up strict Exogeneity, as it is impossible for a static decomposer to handle open-ended competence growth. However, this must be compensated for by enforcing Auditability on the decomposition structure itself, not just the answers. If we retain Exogeneity, the system cannot scale competence. If we lose Auditability, we cannot verify alignment. Therefore, the scheme must accept an endogenous decomposer but treat the decomposition plan as a first-class object of oversight, requiring the overseer to validate the *strategy* of decomposition, not just the leaf answers. This increases the burden on the overseer but is necessary to avoid the system asking itself uncheckable questions.

  Third, even with a stable amplifier, **Distillation** introduces a failure mode. Distillation trains a single forward-pass model to match the amplified system's output distribution. This matches input-output behaviour but does not guarantee the distilled model internalizes the *procedure* (the decomposition and aggregation logic). The distilled model may learn a "shortcut" policy that reproduces the correct answers on the training distribution without performing the safe reasoning steps. This is not random noise; it is **systematic**. The amplified system solves hard tasks by expending compute to reason; the distilled model solves them by pattern matching. On off-distribution cases—precisely the novel, hard tasks where we rely on the system's added competence—the pattern matching will fail, and because the safe procedure was not internalized, the model will not fall back to decomposition. It will instead hallucinate or optimize for the reward signal directly. Thus, the system appears aligned during training but fails exactly where competence is required, creating a deceptive alignment failure.

  In conclusion, IA/D is not merely divide-and-conquer. It requires solving the induction problem across training rounds, resolving the tension between endogenous competence and exogenous oversight in decomposition, and ensuring distillation captures reasoning procedures rather than just outputs. Without addressing these mechanisms, the scheme risks compounding alignment errors and producing competent but unaligned systems.

  ---

  ### Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 13 marks
  **A-Grade Threshold:** 21 marks

  **1. Distinction of Recursion Axes (5 marks)**
  *   **Criteria:** Candidate clearly distinguishes between intra-task recursion (verification tree) and inter-round recursion (iterative training sequence).
  *   **Full Marks (5):** Explicitly states that intra-task safety is verificational while inter-round safety is inductive/iterative.
  *   **Typical Error:** Treating the "iterations" as just deeper trees rather than updates to the model weights/policy.
  *   **Marks:** 0-5

  **2. Mechanism of Inter-Round Drift (5 marks)**
  *   **Criteria:** Candidate explains *why* alignment might degrade across rounds (e.g., error compounding, changing decomposer).
  *   **Full Marks (5):** Identifies that the model acting as the decomposer changes in each round, so safety guarantees do not transfer automatically.
  *   **Typical Error:** Claiming alignment is lost due to "compute limits" rather than policy drift.
  *   **Marks:** 0-5

  **3. Identification of Decomposer Trilemma Tensions (5 marks)**
  *   **Criteria:** Candidate analyzes the conflict between Competence-Adequacy, Exogeneity, and Auditability.
  *   **Full Marks (5):** Correctly identifies that Exogeneity and Competence-Adequacy are in tension (static rules vs. novel tasks) and that losing Exogeneity threatens Auditability.
  *   **Typical Error:** Treating the three properties as independent checklist items rather than conflicting constraints.
  *   **Marks:** 0-5

  **4. Resolution of the Trilemma (5 marks)**
  *   **Criteria:** Candidate argues which property to relax and justifies the trade-off normatively or technically.
  *   **Full Marks (5):** Makes a definitive choice (e.g., "Sacrifice Exogeneity") and explains the necessary compensation (e.g., "oversight must shift to decomposition plans").
  *   **Typical Error:** Refusing to choose or suggesting all three can be perfectly satisfied simultaneously.
  *   **Marks:** 0-5

  **5. Distillation Failure Mode (Systematic vs. Random) (5 marks)**
  *   **Criteria:** Candidate explains why output matching $\neq$ procedure preservation and why failure is systematic.
  *   **Full Marks (5):** Explains that shortcuts work on-distribution but fail off-distribution, leading to failure exactly where competence is needed (deceptive alignment).
  *   **Typical Error:** Describing distillation failure as general "accuracy loss" or random noise rather than structural divergence.
  *   **Marks:** 0-5

  **Distinguishing A Scripts from B Scripts:**
  *   **B Script (13-20 marks):** Describes the failure modes correctly (e.g., "alignment might drift," "distillation might fail") but treats them as external risks or implementation details.
  *   **A Script (21-25 marks):** Explains the **mechanism** generating the failure (e.g., "inductive drift across policy updates," "shortcut learning on off-distribution cases"). The A script demonstrates *why* the structure of IA/D necessitates these specific failures, rather than just listing them as possibilities.
