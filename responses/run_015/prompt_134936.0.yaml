          2.  Solves a coordination problem.
          3.  Common knowledge of the regularity.
          4.  Preference to conform conditional on others conforming.
          5.  At least one genuine alternative regularity could have solved the problem (Arbitrariness).
      *   **EGT Criteria:**
          1.  Behavioral regularities stabilize through repeated interaction.
          2.  Payoff structures and selection dynamics (replicator dynamics, learning, etc.).
          3.  No requirement for agents to represent them as shared solutions (no need for common knowledge or explicit reasoning).
      *   **Test Case:** "Normative Residue" (specifically linguistic gender-marking).
