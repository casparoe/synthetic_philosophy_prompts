      *   *Non-conventional norm?* Yes, likely a social norm enforced by sanctions/grammar rather than pure coordination.
      *   *Lost arbitrariness?* Yes, in the functional sense. It is no longer *functionally* arbitrary because switching costs are too high, even if *historically* arbitrary.
      *   *Which Lewis conditions apply?* Regularity (Yes), Conditional Preference (Yes, but mixed with obligation), Common Knowledge (Yes, of the rule, maybe not of the alternative).
