answer: |-
  David Lewis's account of convention and the evolutionary-game-theoretic (EGT) account of norms offer competing explanations for why behavioral regularities persist. Lewis provides a rationalist, synchronic analysis grounded in common knowledge and mutual expectation, while EGT offers a naturalist, diachronic analysis grounded in selection dynamics and stability. The tension between them centers on the status of **arbitrariness**: for Lewis, arbitrariness is a constitutive condition of convention (a live alternative must exist); for EGT, arbitrariness is often a historical artifact of path dependence (the alternative existed once, but the path is now closed).

  The case of "normative residue"—specifically linguistic gender-marking that has hardened from a coordination solution into a grammatical constraint—tests the limits of both frameworks. Below is a comparison of the accounts, followed by an analysis of whether such a practice remains a Lewisian convention.

  ### 1. Lewis vs. EGT: The Structure of Stability

  **Lewis's Rationalist Account**
  In *Convention* (1969), Lewis defines a convention as a solution to a recurrent coordination problem. For a regularity $R$ to be a convention among a population $P$:
  1.  **Regularity:** Everyone conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Conditional Preference:** Everyone prefers to conform to $R$ on the condition that others do (coordination equilibrium).
  4.  **Common Knowledge:** Conditions 1–3 are common knowledge.
  5.  **Arbitrariness:** There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well.

  For Lewis, convention is a matter of *reason*. Agents conform because they recognize the equilibrium. Crucially, the alternative $R'$ must be a **viable equilibrium** in the current context. If $R$ is the only solution (e.g., driving on the right because the left is physically blocked), it is not a convention but a necessity.

  **The Evolutionary Game-Theoretic Account**
  EGT models norms as Evolutionary Stable Strategies (ESS). Stability arises not from explicit agreement or common knowledge, but from payoff structures and selection dynamics (biological or cultural).
  1.  **Stability:** A strategy is stable if, once prevalent, it cannot be invaded by a mutant strategy.
  2.  **Path Dependence:** The current norm is often the result of historical accidents. Small initial advantages lock in a specific equilibrium.
  3.  **No Representation:** Agents need not know *why* they conform or that alternatives exist. They simply follow heuristics that yielded high payoffs for predecessors.

  In EGT, arbitrariness is **historical**. The norm is arbitrary in origin (path dependence), but it need not be arbitrary in *function* for current agents. If the cost of switching equilibria is too high (a deep "fitness valley"), the alternative is effectively erased, even if it remains theoretically possible.

  ### 2. The Test Case: Linguistic Gender-Marking as Normative Residue

  Consider a linguistic gender system (e.g., assigning masculine/feminine markers to inanimate objects).
  *   **Origin:** A Lewisian convention. Speakers agreed on a split to manage agreement morphology. Common knowledge existed that the reverse assignment was possible.
  *   **Evolution:** Over generations, the system becomes grammatically embedded. It is no longer just a label; it dictates syntax, adjective agreement, and pronoun reference.
  *   **Current State:** Deviation causes communication breakdown or signals social incompetence. The "coordination problem" has transformed into a "compliance constraint."

  #### Does it remain a convention in Lewis's strict sense?
  **Strictly speaking, no.** As the practice hardens into grammar, it fails Lewis's fifth condition: the **availability of alternatives**.

  For Lewis, an alternative is available only if it constitutes a *live equilibrium* that agents could rationally switch to given mutual expectation. In the case of entrenched grammatical gender:
  *   **The Alternative is Theoretically Possible:** We could imagine a world where "table" is masculine.
  *   **The Alternative is Practically Impossible:** For the current population, switching costs are prohibitive. It requires relearning the entire language simultaneously.
  *   **The Coordination Problem has Vanished:** Agents no longer face a choice between $R$ and $R'$ to solve communication. They face a choice between $R$ (communication) and Noise (failure).

  When the cost of deviation shifts from "coordination failure" (I don't know what you mean) to "structural impossibility" (you are speaking ungrammatically), the regularity ceases to be a convention and becomes an **institution** or a **social fact**. Lewis distinguishes between conventions (based on conditional preference) and obligations (based on sanctions or structural constraints). Normative residue marks the transition where a convention acquires the force of obligation.

  #### Which of Lewis's conditions still apply?
  1.  **Regularity:** **Yes.** The behavior persists.
  2.  **Common Knowledge of the Regularity:** **Yes.** Speakers know the rules of gender assignment.
  3.  **Preference for Conditional Conformity:** **Yes, but modified.** Agents prefer to conform conditional on others conforming, but this preference is now driven by the high cost of deviation (sanctions/communication failure) rather than the pure benefit of coordination. The "preference" is closer to coercion than mutual advantage.
  4.  **Availability of Alternatives:** **No.** This is the breaking point. While a philosopher might see the alternative, the *agents* do not have access to it as a viable equilibrium. The "arbitrariness" is no longer salient in the decision matrix.

  #### Has it become a non-conventional norm?
  **Yes.** It has become a **social norm** sustained by enforcement mechanisms (social sanction, intelligibility penalties) rather than pure coordination. In Bicchieri's terms, it has shifted from a *descriptive norm* (everyone does it) to an *injunctive norm* (everyone *should* do it). The "residue" is the leftover stability of the convention after the rational choice element has decayed.

  ### 3. Evolutionary Framework and the Perception of Arbitrariness

  Can the EGT framework coherently describe agents who regard the practice as arbitrary even though the dynamics no longer sustain alternatives?

  **Yes, but EGT treats this perception as a variable, not a requirement.**
  EGT can model a population where:
  1.  **Most Agents:** Treat the norm as fixed (non-arbitrary) because their payoff function penalizes deviation heavily. They are "locked in."
  2.  **Some Agents (Reformers):** Possess historical knowledge or meta-linguistic awareness that the norm is arbitrary. They perceive the alternative $R'$.

  In EGT terms, the reformers are attempting to cross the fitness valley. The framework explains why they fail: even if they coordinate among themselves, the cost of interacting with the majority (the rest of the population) is too high. The "arbitrariness" exists in the *payoff structure* (the alternative yields equal utility *if* everyone adopts it), but the *dynamics* prevent the transition.

  EGT thus accommodates the Lewisian insight (that alternatives exist in principle) without requiring the Lewisian condition (that agents act on that knowledge). It explains the **persistence of the residue**: the norm survives not because agents continually reaffirm it as a solution to a coordination problem, but because the selection pressure against deviation is stronger than the pressure for optimality.

  ### 4. Synthesis: Synchronic vs. Diachronic Arbitrariness

  The tension between Lewis and EGT regarding normative residue reveals a distinction between **synchronic** and **diachronic** arbitrariness.

  *   **Lewis (Synchronic):** Arbitrariness must be present *now*. If agents cannot practically switch, it is not a convention. Lewis's account is prescriptive of the *logic* of agreement. It cannot easily account for norms that persist after the rationality of the agreement has faded into history.
  *   **EGT (Diachronic):** Arbitrariness is a property of the *history*. The norm is arbitrary because it *could have been otherwise* in the past, even if it cannot be otherwise now. EGT accounts for the *mechanics* of persistence.

  **Conclusion on the Test Case**
  The linguistic gender practice is a **convention that has lost its defining arbitrariness** in the Lewisian sense. It has ossified into a non-conventional norm.
  *   For **Lewis**, the disappearance of the viable alternative means the regularity is no longer a convention, but a constraint. The "normative residue" is the shadow of the old convention, now functioning as a rule.
  *   For **EGT**, the practice remains a stable equilibrium. The fact that agents might still regard it as arbitrary (knowing history) does not destabilize the norm, because the selection dynamics (cost of switching) outweigh the knowledge of arbitrariness.

  Ultimately, Lewis's account explains how conventions *start* (through rational coordination), while EGT explains how they *endure* (through path dependence and selection). Normative residue occupies the space where the rational choice has been forgotten, but the evolutionary lock-in remains. In this space, the Lewisian condition of "available alternatives" fails, marking the boundary where convention transforms into culture.
