answer: |-
  ### The Philosophical Grounding
  You are operating under a **Norm of Reasonable Institutional Belief**.
  *   **Not Knowledge:** You personally do not *know* the facts (you haven't read the studies).
  *   **Not Truth:** You cannot verify truth in 10 minutes.
  *   **But Warrant:** You are the voice of the Service. The Service warrants the claim based on its vetting process. If the evidence backing the summary is strong enough that the Service *ought* to believe it, you may assert it.
  *   **Gricean Constraint:** You must avoid **Misleading Implicature**. A sentence can be technically true but pragmatically false (e.g., "X is linked to Y" implies causation to a public audience).

  ---

  ### The 10-Minute Protocol: To Assert, Hedge, or Silence

  **Role:** You are the *Verifier*, not the *Knower*. The "Knower" is the Evidence Service.
  **Goal:** Produce one line that survives contact with a reporter, a clinician, and a lawyer.

  #### Step 1: The Authority Check (1 minute)
  *Question:* Is the claim fully supported by the evidence summary attached to this line, and has that summary passed the Service's standard vetting (e.g., peer-review status, risk-of-bias check)?
  *   **YES:** Proceed to Step 2.
  *   **NO (e.g., preprint, single unvetted study, summary is ambiguous):** **STOP.** Do not assert a categorical claim. Move to *Hedge* or *Silence*.
  *   **Note:** You are not checking if the study is *right*; you are checking if the Service has treated it as *reliable enough to stand behind*.

  #### Step 2: The Evidence Threshold (3 minutes)
  *Question:* Does the strength of the evidence match the strength of the wording?
  *   **Categorical Claim** ("X prevents Y"): Requires systematic review, RCTs, or strong consensus.
  *   **Probabilistic Claim** ("X may reduce Y"): Requires observational data or limited RCTs.
  *   **Descriptive Claim** ("X is associated with Y"): Requires only statistical correlation.
  *   **Action:** If the evidence is weaker than the wording, **downgrade the wording**. If the evidence is too weak for even a descriptive claim, **Silence**.

  #### Step 3: The Pragmatic Hazard Check (3 minutes)
  *Question:* If a reporter lifts this line verbatim, will it imply something the evidence does not support?
  *   **Test:** Read the line as if you are a desperate journalist on deadline. Does "associated with" sound like "causes"? Does "in this study" get dropped in the headline?
  *   **Action:** If the risk of pragmatic strengthening is high, you must either:
      1.  Add a constraint ("...in unvaccinated adults"); OR
      2.  **Silence** (if the constraint makes the line useless).
  *   *Philosophy:* This addresses the "True but Misleading" wrinkle. Asserting a truth that invites a false inference violates the Maxim of Manner.

  #### Step 4: The Permission Check (2 minutes)
  *Question:* Are we *allowed* to say this, regardless of truth? (Embargoes, privacy, policy restrictions).
  *   **YES:** Proceed to Assertion.
  *   **NO:** **Silence.** (Epistemic warrant does not override deontic restriction).

  #### Step 5: The Sign-Off (1 minute)
  *   Hand the line and this checklist to the second person. They are not re-reading the science; they are auditing *your* use of this procedure.

  ---

  ### Decision Matrix

  | Outcome | When to use | Example Phrasing |
  | :--- | :--- | :--- |
  | **ASSERT** | Steps 1-4 all PASS. Evidence matches wording. No misleading implicature. | "Booster doses reduce severe disease risk by 80%." |
  | **HEDGE** | Step 1 or 2 is weak, but information is vital. Use modals (*may, suggests, limited evidence*). | "Early evidence suggests a possible link..." |
  | **SILENCE** | Step 1 fails (bad source), Step 3 fails (too misleading), or Step 4 fails (embargo). | "Current evidence is insufficient to determine..." OR No bottom line. |

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Preprint Supplement ($n=200$, cuts hospitalization)
  *   **Step 1 (Authority):** **FAIL.** It is a preprint. The Service's standard vetting usually requires peer review for causal claims about hospitalization.
  *   **Step 2 (Threshold):** **FAIL.** $n=200$ is underpowered for hospitalization endpoints (rare events). Categorical claim ("cuts") requires RCT/Consensus.
  *   **Step 3 (Pragmatic):** **HIGH RISK.** "Supplement cuts hospitalization" will be read as medical advice.
  *   **Step 4 (Permission):** Pass.
  *   **Verdict:** **SILENCE (on the claim).**
  *   **Output Line:** "Evidence is currently insufficient to recommend this supplement for preventing hospitalization."
  *   *Why:* You cannot assert a causal medical claim on a small preprint. The procedure forces you to protect the Service's credibility over being "first."

  #### Case 2: The New Variant (Airborne? One small observational study)
  *   **Step 1 (Authority):** **FAIL.** One small observational study does not constitute Service-level warrant for transmission mode consensus.
  *   **Step 2 (Threshold):** **FAIL.** Determining "airborne" status requires virological + epidemiological consensus.
  *   **Step 3 (Pragmatic):** **CRITICAL FAIL.** If you write "Study suggests airborne spread," reporters will write "Variant Confirmed Airborne." This causes panic/behavior change.
  *   **Step 4 (Permission):** Pass.
  *   **Verdict:** **SILENCE.** (You asked not to soften this: The procedure dictates you do not assert.)
  *   **Output Line:** "Transmission routes for this variant remain under investigation; no change to current precautions."
  *   *Why:* You are right to feel the procedure tells you to shut up. A single observational study is epistemically too thin for a public health assertion on transmission mode. To assert otherwise is to lie about the certainty.

  #### Case 3: The Booster Rollout (Embargoed Gov Briefing)
  *   **Step 1 (Authority):** **PASS.** You know it from a reliable source.
  *   **Step 2 (Threshold):** **PASS.** It is a fact about policy, not science.
  *   **Step 3 (Pragmatic):** **PASS.** Clear fact.
  *   **Step 4 (Permission):** **FAIL.** Embargoed.
  *   **Verdict:** **SILENCE.**
  *   **Output Line:** (No line published until embargo lifts).
  *   *Why:* This is a deontic block. Even if you *know* it is true, the Service lacks the *right* to assert it. Asserting here burns institutional capital.

  ---

  ### Meta-Analysis: Where This Misfires

  You asked for the judgment calls dressed up as procedure and the failure points. Here they are:

  **1. The "Service Standard" Black Box (Step 1)**
  *   **The Illusion:** Step 1 asks if the summary passed "standard vetting."
  *   **The Reality:** In a crisis, "standard vetting" is often compressed. You are judging whether the Service *would* stand behind this if challenged. That is a political/credibility judgment, not a purely epistemic one. You are guessing at the institutional risk tolerance.

  **2. The Pragmatic Hazard Subjectivity (Step 3)**
  *   **The Illusion:** "Will a reporter misunderstand this?" seems objective.
  *   **The Reality:** This is pure intuition. You might think "associated with" is safe; a reporter might not. This step relies entirely on your experience with media, not on logic. It is the most likely point of failure if you are new to the role.

  **3. The "Silence" Cost (Step 5/Matrix)**
  *   **The Illusion:** Silence is neutral.
  *   **The Reality:** In public health, silence is often read as "they don't know" or "they are hiding something." The procedure treats Silence as a safe epistemic fallback, but it carries a reputational cost. Sometimes you *must* assert a weak claim to prevent rumor, forcing you to override Step 2. This procedure does not account for "Strategic Assertion."

  **4. The Second-Person Rubber Stamp**
  *   **The Illusion:** The sign-off is a safety net.
  *   **The Reality:** If you are both tired and the pressure is high, the sign-off becomes a ritual. The procedure relies on the second person actually challenging the Step 3 judgment. If they don't, the procedure is a single-point failure.

  **5. The Institutional "Knower" Problem**
  *   **The Illusion:** The Service "knows."
  *   **The Reality:** The Service is a collection of people. If the person who vetted the summary made a mistake, you are asserting a falsehood with high confidence. You are outsourcing epistemic responsibility to a process that can be flawed. This procedure protects *you*, but it does not guarantee *truth*.

  ### Summary
  This procedure prioritizes **Institutional Credibility** over **Immediacy**. It will tell you to shut up on the variant question. That is the correct epistemic move, even if it feels frustrating operationally. If you need to say something on the variant, you must change the procedure to allow for "Alerts" (low certainty, high urgency) distinct from "Bottom Lines" (high certainty, actionable). But for a "Bottom Line," Silence is the only honest output for Case 2.
