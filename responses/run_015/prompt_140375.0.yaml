prompt: |-
  I'm on the rotating duty-editor shift at a small public-health evidence service — twice a week, and three or four times a shift I have to write the one-line "bottom line" that sits on top of an evidence summary, in about ten minutes, and a second person has to sign it off before it goes up. The catch is that the same line is read by members of the public, by clinicians deciding what to do that afternoon, and gets lifted verbatim by reporters, so I can't tune how strong it is to one audience.

  Can you write me a procedure for deciding when it's OK to come out and state a claim, when to hedge it, and when to say nothing? Ground it in whatever philosophy of language actually says about the norms of assertion — knowledge vs. truth vs. reasonable belief vs. whatever else is on the table — but in a form someone with no philosophy and ten minutes can run. So: the questions in order, what counts as a good enough answer to each, where the procedure just returns "don't assert", and where it has to hand the decision to a person because it's a values call and not an epistemic one. Two wrinkles I'd like it to actually handle: (1) I'm usually speaking for the service, and I personally have not read the studies — so who is asserting, and whose epistemic position has to be good enough? (2) sentences that are true and that I do know, but which reporters will read as saying something stronger.

  Then run it on three: an n=200 preprint finding that a common supplement cuts hospitalisation; the same-day question "is this new variant spreading through the air?" where all we have is one small observational study; and a line about a booster rollout expanding next week that I know from an embargoed government briefing but can't give a reason for. Don't soften the second one — I have a feeling the procedure is going to tell me to shut up, and I want to know whether that really follows.

  Finally, say which steps are judgment calls dressed up as procedure, and where the whole thing will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Rotating duty-editor at a small public-health evidence service.
      *   **Task:** Write a one-line "bottom line" for evidence summaries.
      *   **Constraints:** ~10 minutes per line, signed off by a second person.
      *   **Audience:** Public, clinicians, reporters (all read the same line).
      *   **Goal:** A procedure for deciding when to assert, hedge, or say nothing.
      *   **Philosophical Grounding:** Norms of assertion (knowledge, truth, reasonable belief, etc.), but practical for non-philosophers.
      *   **Specific Wrinkles:**
          1.  Speaking for the service (institutional assertion), not personal knowledge.
          2.  Implicature/Pragmatics (true sentences that imply something stronger/misleading).
      *   **Test Cases:**
          1.  $n=200$ preprint (supplement cuts hospitalization).
          2.  Same-day question (new variant airborne? one small observational study).
          3.  Embargoed gov briefing (booster rollout next week, can't cite source).
      *   **Meta-Requirement:** Identify judgment calls disguised as procedure and potential failure points.
      *   **Tone:** Practical, rigorous, honest about limitations.

  2.  **Philosophical Grounding (Internal Knowledge Retrieval):**
      *   *Norms of Assertion:*
          *   **Knowledge Norm (Williamson):** Assert $p$ only if you know $p$. (Too strict for institutional evidence synthesis where "knowledge" is distributed).
          *   **Truth Norm:** Assert $p$ only if $p$ is true. (Impossible to verify in 10 mins).
          *   **Justified Belief/Evidence Norm (Lackey, Douven):** Assert $p$ if you have sufficient evidence/justification for $p$. (Better fit for evidence services).
          *   **Reasonable Acceptability (Assertibility):** Is it reasonable for the audience to accept this based on what we say?
      *   *Gricean Maxims:* Quality (don't say what you lack evidence for), Quantity (be as informative as required), Manner (avoid ambiguity).
      *   *Institutional Assertion:* The service is the speaker. The editor is the mouthpiece. The epistemic position belongs to the *body of evidence* vetted by the service, not the editor's brain.
      *   *Implicature:* Saying "X is associated with Y" might imply "X causes Y" to a layperson. Need to manage pragmatic strengthening.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* A flowchart-style checklist that fits in 10 minutes.
      *   *Step 1: Source Verification.* Who knows? The service needs to have vetted the evidence.
      *   *Step 2: Strength of Evidence.* Is it strong enough for a categorical claim?
      *   *Step 3: Pragmatic Check.* Will this be misunderstood?
      *   *Step 4: Authorization.* Can we say this *now* (embargoes)?
      *   *Decision Nodes:* Assert, Hedge, Silence.

      *Refining for the "Institutional" Wrinkle:* The editor doesn't need to *know* it personally. They need to verify that the *summary* supports it. The "Knower" is the Service.
      *Refining for the "Implicature" Wrinkle:* Need a specific check for "True but Misleading."

      *Drafting the Steps:*
      1.  **The Authority Check:** Does the summary backing this line support the claim? (Shifts burden from editor to evidence).
      2.  **The Evidence Threshold:** Is the evidence strong enough for the claim strength? (Categorical vs. Probabilistic).
      3.  **The Audience Test (Implicature):** Will a reporter/clinician read this as stronger than it is?
      4.  **The Permission Check:** Are we allowed to say this? (Embargoes).

  4.  **Developing the Test Cases:**
      *   *Case 1 (Preprint, n=200, Supplement):* Preprint = not peer-reviewed. n=200 = small for hospitalization outcomes. Claim "cuts hospitalization" is causal.
          *   *Verdict:* Hedge heavily or Silence. "May reduce" is still risky on a preprint. Probably "Evidence is insufficient to conclude."
      *   *Case 2 (Variant, Airborne, 1 small study):* High stakes. Weak evidence.
          *   *Verdict:* Silence on "Yes/No". State the uncertainty. "Transmission route remains unclear." The prompt asks not to soften this, so I must stick to the procedure even if it says "Don't Assert."
      *   *Case 3 (Booster, Embargo):* True, known by editor, but restricted.
          *   *Verdict:* Silence. Violates professional norms even if epistemically sound.

  5.  **Refining the Philosophy:**
      *   Use a "Reasonable Institutional Belief" norm. It's not about *Truth* (unverifiable) or *Personal Knowledge* (impossible). It's about *Warranted Assertibility* based on the service's vetting process.
      *   Address the "True but Misleading" issue via Gricean Maxim of Manner/Quality.

  6.  **Addressing the Meta-Requirement (Judgment Calls & Failure Points):**
      *   Where does the procedure fail? When the evidence is borderline. When the "second person" sign-off is rubber-stamped. When political pressure overrides epistemic norms.
      *   Identify which steps are actually value judgments (e.g., defining "sufficient evidence").

  7.  **Final Polish:**
      *   Ensure the tone is professional, direct, and usable.
      *   Check against the 10-minute constraint.
      *   Make sure the "Institutional" aspect is clear (you are a conduit, not the source).
      *   Ensure the "Don't soften the second one" instruction is followed (if the procedure says shut up, say shut up).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 10 minutes?
      *   *Fix:* Simplify the questions. Make them Yes/No where possible.
      *   *Critique:* Did I handle the "who is asserting" issue?
      *   *Fix:* Explicitly state in Step 1 that the *Service* is the knower, the editor is the verifier of the summary.
      *   *Critique:* Did I handle the "True but Misleading" issue?
      *   *Fix:* Add a specific "Pragmatic Hazard" step.
      *   *Critique:* The user wants to know if the procedure tells them to shut up on the variant question.
      *   *Fix:* Ensure the evidence threshold for "Airborne" is high (consensus vs. single study).

  9.  **Final Output Structure:**
      *   Introduction (Philosophical grounding).
      *   The Procedure (The "10-Minute Protocol").
      *   The Test Cases (Applied).
      *   The Meta-Analysis (Judgment calls & failure points).

  *(Self-Correction on Case 1)*: A preprint with n=200 claiming reduced hospitalization is weak. Hospitalization is a hard endpoint, n=200 is small. Preprint means no peer review. The procedure should likely flag this as "Do Not Assert Causality."
  *(Self-Correction on Case 2)*: One small observational study on airborne transmission. This is high uncertainty. The procedure should demand consensus or multiple lines of evidence for a definitive "Yes." Result: Silence/Hedge heavily.
  *(Self-Correction on Case 3)*: Embargo. This isn't epistemic, it's deontic (permission). The procedure must catch this.

