      *   *The "Three Complaints":* I need to be careful not to validate a taxonomy that might be obscure. "Fusion" is definitely Rawls. "Ledger" sounds like a metaphor for interpersonal comparison of utility. I should treat the taxonomy as the host's specific framing but evaluate its validity.
