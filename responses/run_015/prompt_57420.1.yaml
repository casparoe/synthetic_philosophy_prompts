answer: |-
  **1. Exam Question**

  **Question 3 (20 marks)**
  Consider two possible worlds. **W1** contains nothing except two exactly similar iron spheres, same diameter, colour, and temperature, a fixed distance apart in empty space. Nothing ever changes in W1. **W2** is identical to W1 for a time, but then one sphere acquires a small dent which it keeps forever; otherwise, it remains symmetric and empty.

  (a) In W2 (after the dent appears), are the spheres discernible? If so, by what kind of properties? (4 marks)

  (b) Consider this argument: *"In W2, the spheres are obviously two distinct objects. Since W2 is just W1 with a minor alteration, the spheres in W1 must also have been two distinct objects all along. Therefore, Black's world never threatened the Principle of the Identity of Indiscernibles (PII) to begin with."* Evaluate the strength of this inference. (6 marks)

  (c) What does the description of W2 actually license you to say about the metaphysics of W1? In your answer, address the difficulty of stating which sphere got the dent in W2 without presupposing what you are trying to prove about W1, and explain why PII cannot be settled by treating properties as a finite list of observable features. (10 marks)

  *Note: You do not need to cite or name any philosophers to receive full marks.*

  ***

  **2. Model Answer**

  In W2, the spheres are qualitatively discernible. One possesses the monadic property of *being dented*, while the other possesses *being smooth*. This is a genuine qualitative difference, not merely a numerical one. However, using this fact to save the Principle of the Identity of Indiscernibles (PII) in W1 fails because it conflates temporal stages with metaphysical identity.

  The argument in (b) is invalid. It assumes that because the spheres are discernible at *t2* (after the dent), they were discernible at *t1* (in the static state). PII asks whether distinctness *requires* discernibility. If the spheres in W1 lacked all qualitative differences, they violated PII at that time. The fact that they *later* diverge in W2 does not retroactively provide a truthmaker for their distinctness in W1. To claim it does is to confuse the persistence of objects with the grounds of their individuation. If PII is true, there must be a qualitative ground for their being two rather than one at every moment they exist. W2 shows they can *become* discernible, but it does not show they *were* discernible when symmetric.

  This leads to the deeper problem in (c): we cannot even describe W2 without smuggling in the metaphysics we are testing. To say "one sphere dented" implies we can track *which* sphere is which across the change. In a universe with only two spheres, there are no external reference points. If we claim Sphere A dented and Sphere B did not, we are relying on a primitive thisness (haecceity) to label them. But if haecceities exist, PII is trivially false in W1 anyway, because the spheres differ by the property *being identical to A*. If haecceities do not exist, the description "one sphere dented" is unintelligible; it should be described as "the universe changed from symmetric-two-spheres to asymmetric-two-spheres," without identifying which constituent persisted.

  Therefore, W2 does not save PII; it highlights that our intuition that there are "two" spheres in W1 relies on presupposing individuality prior to quality. If we reject haecceities, W1 describes a single state of affairs containing "spheriness" at two locations, but without ontological grounds to count them as distinct substances.

  Finally, PII cannot be treated as an empirical checklist. If "having all the same properties" meant only sharing a finite list of observable monadic traits (colour, mass, shape), Black's counterexample would be trivial and PII would be obviously false. The principle is a modal claim about the structure of reality: it asserts that for any two distinct objects *x* and *y*, there is *some* property *F* (including relational, modal, or second-order properties) such that *Fx* and not *Fy*. If we treat properties as merely observable lists, we ignore the logical space where PII is meant to operate. The failure of W2 to rescue PII shows that without qualitative differences, distinctness rests on brute fact, which is precisely what PII denies. Thus, W1 remains a counterexample unless one accepts haecceities, in which case PII is abandoned to save the counting.

  ***

  **3. Marking Scheme**

  **Rubric (20 Marks Total)**

  *   **Discernibility in W2 (4 marks):**
      *   **4 marks:** Correctly identifies spheres are discernible via qualitative/monadic properties (dented vs. smooth).
      *   **2 marks:** Identifies they are discernible but misclassifies the property type (e.g., calls it relational).
      *   **0 marks:** Claims they are indiscernible in W2.
  *   **Evaluation of Inference (6 marks):**
      *   **5-6 marks:** Clearly rejects the inference. Explains that discernibility at *t2* does not ground distinctness at *t1*. Distinguishes temporal change from metaphysical grounds of identity.
      *   **3-4 marks:** Rejects inference but relies on vague intuition ("it feels wrong") without temporal/metaphysical distinction.
      *   **0-2 marks:** Accepts the inference as valid.
  *   **Metaphysics of W1 & Property List (10 marks):**
      *   **9-10 marks:** **Top Band.** Identifies the circularity in describing W2 (presupposes haecceity/labeling). Explains that if haecceities are used, PII is already abandoned in W1. Explicitly addresses why PII is not a finite empirical list (modal/second-order scope).
      *   **6-8 marks:** Identifies the labeling problem OR the property list issue, but not both. Commits to a view but lacks precision on haecceity.
      *   **3-5 marks:** Discusses Black's original case without applying the W2 twist. Treats PII as an empirical hypothesis.
      *   **0-2 marks:** Buzzword dumping ("haecceitism", "brute fact") without coherent application to the W1/W2 distinction.

  **Specific Mistakes (Deduct 2 marks each, max 10 marks deduction)**

  1.  **The "Identity Property" Move:** Invoking *being identical to sphere A* as a valid property to save PII.
      *   *Confusion:* Reveals a failure to understand that PII concerns *qualitative* properties; using identity trivializes the principle.
  2.  **The "Relational" Move in W1:** Claiming *being 1 mile from the other sphere* discerns them in W1.
      *   *Confusion:* Reveals a failure to grasp symmetric relations; in an empty universe, "the other" presupposes the individuality it tries to prove.
  3.  **The Empirical Fallacy:** Suggesting we could verify PII by "looking closely" or measuring the spheres in W1.
      *   *Confusion:* Reveals a category mistake; PII is a metaphysical principle about possibility, not an empirical generalization subject to measurement error.
  4.  **Retroactive Discernibility:** Arguing that because they are different in W2, they "must have had" some hidden difference in W1.
      *   *Confusion:* Reveals a confusion between causal history and metaphysical grounds; assumes distinctness requires a prior qualitative cause without arguing for it.
  5.  **The Finite List Assumption:** Treating "all properties" as merely the list of physical attributes given in the prompt (mass, colour, etc.).
      *   *Confusion:* Reveals a failure to understand second-order quantification; misses that PII covers modal and logical properties too.
