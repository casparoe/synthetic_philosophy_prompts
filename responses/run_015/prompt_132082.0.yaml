answer: |-
  They stitch the stars upon the flag,
  Demand a promise sealed in blood,
  While strangers read the morning print,
  And walk along the painted border,
  To sing the notes of some old anthem,
  As if the song predates our time.

  It starts without a history in time,
  Until we bow before the flag,
  And memorize the state's new anthem,
  To sanitize the spill of blood,
  That ignores every arbitrary border,
  Circulated by the print.

  The ink is wet upon the print,
  Yet claims to have defeated time,
  Insisting this is no new border,
  But land beneath the eternal flag,
  Where fathers died and spilled their blood,
  Bound together by the anthem.

  Who wrote the lyrics of the anthem?
  Some poet hired to feed the print,
  To hide the cost in human blood,
  And stretch a moment into time,
  So children salute the flag,
  Without questioning the border.

  We never met across the border,
  But hum the tune of anthem,
  Together under one flag,
  Connected by the daily print,
  Simultaneous in time,
  Though we never share the blood.

  It demands a toll of blood,
  To maintain this imaginary border,
  Against the flowing of time,
  While everyone sings the anthem,
  Believing what they see in print,
  That nothing matters like the flag.

  We sing the anthem but we pay in blood,
  The print dissolves the arbitrary border,
  And time reveals the making of the flag.
