answer: |-
  Here is a decision procedure designed for speed and reliability given your constraints. It prioritizes **speaker epistemic stance** (what the speaker treats as possible) over **objective truth** (what actually happened) or **verb morphology** (was vs. were), because your transcript data cannot reliably support the latter two.

  ### The "Settledness" Procedure (30–60 Seconds)

  **Goal:** Determine if the speaker treats the "If" clause as a **live option** (Indicative) or a **closed/impossible option** (Counterfactual).

  **Step 1: Check the Timeline (5 seconds)**
  *   Is the event in the "If" clause strictly in the **future** relative to the speech?
      *   **Yes:** Tag **Indicative**. (You cannot be counterfactual about the future unless it's physically impossible, e.g., "If the sun exploded tomorrow." In meetings, future plans are live options.)
      *   **No:** Go to Step 2.

  **Step 2: Check for Explicit Falsity (10 seconds)**
  *   Does the text (within your 2-line window) explicitly state the antecedent is **false** or **did not happen**? (Look for: *but it didn't, unfortunately it wasn't, we didn't.*)
      *   **Yes:** Tag **Counterfactual**.
      *   **No:** Go to Step 3.

  **Step 3: Check for Investigation vs. Assumption (15 seconds)**
  *   Is the speaker using the "If" clause to **find out** information or acknowledge **uncertainty**? (Look for: *I don't know if, did she?, we need to check if.*)
      *   **Yes:** Tag **Indicative**. (The door is open; the speaker is betting on possibility.)
      *   **No:** Go to Step 4.

  **Step 4: Check the Consequence Clause (15 seconds)**
  *   Look at the verb in the *result* part of the sentence (the "then" part).
      *   Does it use **would / would have**? (e.g., *we would need, she would have said*)
          *   **Yes:** Tentatively tag **Counterfactual**, **UNLESS** Step 1 said Future. (Future + Would = Hypothetical/Indicative).
      *   Does it use **will / do / did / are**? (e.g., *we need, she didn't, we're doomed*)
          *   **Yes:** Tag **Indicative**.

  **Step 5: The "Give Up" Clause (5 seconds)**
  *   If Step 4 gives a "Would" but the antecedent is clearly a live policy option (not ruled out), or if the speaker's belief about the past is impossible to infer from the text:
      *   Tag **Unclear**. (Do not guess. This is data for the grad student adjudicator.)

  ***

  ### Application to Your Examples

  Here is where the procedure runs on your three tokens.

  **(1) "If the provost read the report, she didn't mention it."**
  *   **Step 1 (Time):** Past event ("read"). -> Continue.
  *   **Step 2 (Explicit Falsity):** Does text say she *didn't* read it? No. -> Continue.
  *   **Step 3 (Investigation):** Is the speaker uncertain? Yes. The use of "If" here signals the speaker does not know whether she read it. They are treating it as an open possibility. -> **Stop.**
  *   **Verdict:** **Indicative.**
  *   **Why:** Even though the event is in the past, the speaker treats the truth value as unknown. Counterfactuals require the speaker to commit to the antecedent being false.

  **(2) "If we were to raise the fee, we'd need a vote first."**
  *   **Step 1 (Time):** Future/Hypothetical action ("raise"). -> **Stop.**
  *   **Verdict:** **Indicative.**
  *   **Why:** You cannot be counterfactual about a future policy decision in a meeting context; it is a live option.
  *   **Where it stalls:** **Step 4.** The morphology screams Counterfactual ("were to" + "would"). A coder relying on verb forms will tag this CF. A coder relying on the "false antecedent" definition must tag this Indicative. This is a genuine conflict between your codebook definition and standard morphological cues.
  *   **Recommendation:** Code as **Indicative** based on the definition ("antecedent is false" — it is not false yet), but expect this to be a major source of disagreement with coders who look at "would."

  **(3) "If that's your plan, we're all doomed."**
  *   **Step 1 (Time):** Present state ("is"). -> Continue.
  *   **Step 2 (Explicit Falsity):** Does text say it's *not* the plan? No. -> Continue.
  *   **Step 3 (Investigation):** Is the speaker uncertain? No. The tone implies the speaker believes it *is* the plan. -> Continue.
  *   **Step 4 (Consequence):** Result verb is "are" (Indicative), not "would be." -> **Stop.**
  *   **Verdict:** **Indicative.**
  *   **Why:** This is a "factual conditional." The speaker accepts the antecedent as true for the sake of the argument. It is not contrary to fact.

  ***

  ### Confidence & Weaknesses

  **Confidence in Steps:**
  *   **Step 1 (Future = Indicative):** **95% Confidence.** In institutional talk, future plans are rarely treated as "contrary to fact" unless explicitly cancelled.
  *   **Step 2 (Explicit Falsity = CF):** **90% Confidence.** Hard textual evidence is the most reliable marker.
  *   **Step 3 (Uncertainty = Indicative):** **85% Confidence.** This solves your "nobody knows" problem. If the speaker doesn't know, it's not false, so it can't be CF.
  *   **Step 4 (Morphology Tiebreaker):** **60% Confidence.** This is the danger zone. "Would" is often used for politeness or hypothetical planning (Indicative) rather than strict counterfactuality.

  **Least Sure Part of the Procedure:**
  **Step 4 (The "Would" Trap).**
  I am least sure about how to handle "If we were to... we would" (Example 2) without audio.
  *   **The Problem:** In formal semantics, this is often called a "remote conditional." It signals low probability, but not necessarily falsity.
  *   **The Risk:** Your codebook defines CF as "antecedent is false." Example 2's antecedent is *not false*, just *not currently active*.
  *   **The Prediction:** Your coders will fight here. One will say "It uses 'were', so it's CF." The other will say "It hasn't happened, so it's Indicative."
  *   **My Advice:** Instruct coders that **Future/Hypothetical Policy = Indicative**, regardless of "would." Reserve Counterfactual for **Past Events known to be false** or **Present States known to be impossible** (e.g., "If I were the President [but I'm not]").

  **Genuine Undecidability vs. Sloppiness:**
  *   **Sloppiness:** Disagreement on Example 1 ("If the provost read..."). If one coder tags CF because it's past tense, they are being sloppy. The text shows uncertainty.
  *   **Genuine Undecidability:** If the transcript says "If the budget was approved..." and there is zero context on whether the speaker knows the outcome, and the result clause is ambiguous (e.g., "...we are in trouble"), tag **Unclear**. Do not force a binary choice when the speaker's epistemic state is opaque.
