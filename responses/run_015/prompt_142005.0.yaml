prompt: |-
  Hey — I'm an undergrad RA in a sociolinguistics lab and most of my paid hours go into coding a corpus of recorded campus meetings: every "if" clause gets tagged indicative, counterfactual, or unclear, a second coder does 20% of it, and the grad student adjudicates our disagreements once a week. The codebook is literally one line — counterfactual = the antecedent is false or contrary to fact — and its useless in practice: we keep splitting on things like "if the budget was approved last month, we're fine" when nobody in the room knows whether it was, or "if I was being honest I'd have quit," which is about right now.

  Can you give me an actual procedure I can run in 30–60 seconds per token, with nothing but the transcript and two lines around it (no asking the speaker), that someone with one linguistics class could apply: what to check in what order, what counts as settling it, when to give up and tag unclear, and which disagreements are genuine undecidability from text alone instead of us being sloppy. It has to handle the case where the antecedent is false in fact but the speaker treats it as an open question, and the case where the speaker obviously doesn't believe the antecedent but isn't doing a counterfactual either. Ground it in whatever the semantics/pragmatics side of this says the distinction really is — I think it's something about whether the speaker treats the antecedent as a live possibility rather than about were vs was — but no citations, I dont care who said it, I need the rule.

  Then run it on these three and tell me where it stalls: (1) "If the provost read the report, she didn't mention it." (2) "If we were to raise the fee, we'd need a vote first." (3) "If that's your plan, we're all doomed."

  Also: how confident are you in each step, and which part of the procedure are you least sure about?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Undergrad RA in a sociolinguistics lab.
      *   **Task:** Coding a corpus of recorded campus meetings for "if" clauses (Indicative vs. Counterfactual vs. Unclear).
      *   **Problem:** Current codebook is too vague ("antecedent is false"), leading to low inter-rater reliability (disagreements on epistemic status, tense usage, speaker belief).
      *   **Constraints:**
          *   Procedure must take 30-60 seconds per token.
          *   Input: Transcript + 2 lines of context (no audio, no speaker inquiry).
          *   User expertise: One linguistics class (needs clear, operationalizable steps, not theoretical jargon).
          *   No citations (practical rule, not literature review).
          *   Must distinguish between *factual falsity* vs. *speaker treatment of possibility* (epistemic stance).
          *   Must handle specific edge cases (unknown truth value, rhetorical/hypothetical usage).
      *   **Deliverables:**
          1.  A step-by-step decision procedure.
          2.  Application of the procedure to three specific examples.
          3.  Identification of where the procedure stalls.
          4.  Confidence rating for each step and the whole procedure.

  2.  **Deconstruct the Linguistic Problem:**
      *   *Counterfactual (CF):* Traditionally, $P \rightarrow Q$ where $P$ is known/believed to be false by the speaker at the time of utterance. Often marked by past tense morphology (subjunctive-ish) but not always.
      *   *Indicative (Open/Real):* $P \rightarrow Q$ where $P$ is treated as a live possibility (unknown or believed true).
      *   *The Crux:* It's not about objective truth (did the budget pass?), it's about the *speaker's epistemic stance* (does the speaker act like it might happen/happened, or do they act like it's impossible/too late?).
      *   *The "Was/Were" Trap:* Morphology (was vs. were) is unreliable in natural speech (especially informal/campus meetings). "If I was" can be CF or Indicative. "If we were to" is often hypothetical but not necessarily CF.
      *   *The "Unknown" Trap:* If the speaker doesn't know if $P$ is true, it's usually Indicative (Open), not CF. CF requires a commitment to $\neg P$.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Check if it happened. If no, CF. If yes, Indicative. *Critique:* Fails the user's specific complaint ("nobody knows whether it was").
      *   *Attempt 2 (Mental):* Check verb tense. Past = CF. Present = Indicative. *Critique:* Fails on "If I was being honest" (past form, present meaning) and "If the provost read..." (past form, unknown truth).
      *   *Attempt 3 (Refining for Epistemic Stance):* Focus on what the speaker implies about the world.
          *   Step 1: Look for explicit markers of falsity (e.g., "but it didn't").
          *   Step 2: Look for future/ongoing potential.
          *   Step 3: Check consequence clause (would vs. will).
      *   *Refining for Speed (30-60s):* Needs a flowchart style.
      *   *Key Distinction:* Is the speaker *leaving the door open* (Indicative) or *closing the door* (Counterfactual)?
      *   *Operationalizing "Door Closed":* Does the speaker treat the antecedent as impossible *at the time of speaking*?
      *   *Operationalizing "Door Open":* Does the speaker treat it as something that could be true, might happen, or is unknown?

      *   *Drafting the Steps:*
          1.  **Check the Consequent:** Does it use *would/would have* (strong CF signal) or *will/do/did* (strong Indicative signal)?
          2.  **Check the Antecedent Truth:** Does the text explicitly say $P$ is false? (CF). Does it say $P$ is possible/unknown? (Indicative).
          3.  **Check Time Reference:** Is $P$ in the future? (Indicative). Is $P$ in the past but unknown? (Indicative).
          4.  **Default:** If morphology clashes (e.g., past tense "if" + present "will"), look at speaker commitment.

      *   *Polishing for the User:* Make it a checklist. "Stop" conditions.
      *   *Addressing the "One Linguistics Class" constraint:* Avoid terms like "modal subordination" or "epistemic closure." Use "Speaker's Bet."

  4.  **Developing the "Speaker's Bet" Heuristic:**
      *   Imagine the speaker is betting money.
      *   Indicative: "I bet $P$ might be true/will happen."
      *   Counterfactual: "I know $P$ isn't true, but imagine if..."
      *   *Crucial distinction:* If the speaker is *checking* if $P$ is true, it's Indicative. If the speaker is *assuming* $P$ is false to make a point, it's Counterfactual.

  5.  **Testing the Procedure on the Examples:**
      *   (1) "If the provost read the report, she didn't mention it."
          *   Antecedent: Past event.
          *   Truth: Unknown to speaker (implied by "If").
          *   Consequent: Past indicative ("didn't").
          *   Verdict: Indicative (Open).
      *   (2) "If we were to raise the fee, we'd need a vote first."
          *   Antecedent: Future/Hypothetical action.
          *   Morphology: "Were to" + "would".
          *   Truth: Not false yet, just hypothetical.
          *   Verdict: This is the tricky one. It's often called "Remote" or "Hypothetical." In a binary CF/Indicative split, this often falls into CF because of the *remoteness* (unlikely), but semantically it's often treated as Open (we *could* do it). The prompt asks for CF vs. Indicative. Standard semantics often classifies "were to" + "would" as Counterfactual/Subjunctive territory because it signals low probability, *but* strictly speaking, it's not *contrary to fact* yet. However, in coding schemes, "would" usually triggers CF. I need to be careful here. The user's definition is "antecedent is false or contrary to fact." "Were to" implies it *isn't* currently the plan. Let's look at the "Speaker's Bet." Are they ruling it out? No. They are outlining a procedure. This is likely **Indicative (Hypothetical/Open)** in a strict truth-conditional sense, but often coded CF due to morphology. I need to align the procedure with the *user's* definition ("contrary to fact"). If it's not contrary to fact yet, it's not CF.
          *   *Correction:* In many corpora, "If we were to... we would" is coded as Counterfactual because of the *remoteness* marking, even if not factually false. But the user's codebook says "antecedent is false." I must stick to the *epistemic stance* rule I design. If the speaker treats it as a live option (even unlikely), it's Indicative. If they treat it as impossible/imagine-only, it's CF. "Were to" is usually a policy hypothetical. I will classify it as **Indicative (Remote/Open)** but note the stall.
          *   *Wait, re-reading the prompt:* The user says the codebook defines CF as "antecedent is false or contrary to fact." "Contrary to fact" usually implies $\neg P$ is true. "Were to" is future. It can't be false yet. So it must be Indicative.
      *   (3) "If that's your plan, we're all doomed."
          *   Antecedent: Present state.
          *   Truth: Speaker implies it *is* the plan (rhetorical).
          *   Consequent: Present/Future ("are").
          *   Verdict: Indicative (often called "Factual Conditional").

  6.  **Refining the Procedure for Reliability:**
      *   The biggest source of error is the "Unknown Past" (Example 1).
      *   Rule: If the speaker is *investigating* the truth of $P$, it is **Indicative**. CF requires the speaker to *assert* $\neg P$.
      *   The second source is "Hypothetical Future" (Example 2).
      *   Rule: If $P$ is physically possible in the future, it is **Indicative**, even if unlikely. CF is for things that *cannot* happen or *did not* happen.
      *   The third source is "Rhetorical" (Example 3).
      *   Rule: If the speaker implies $P$ is *true*, it is **Indicative**.

      *   *Finalizing the Steps:*
          1.  **Time Check:** Is $P$ in the future? -> Indicative (unless explicitly impossible).
          2.  **Truth Check:** Does the text say $P$ definitely didn't happen? -> CF. Does it say $P$ did happen? -> Indicative.
          3.  **Uncertainty Check:** Is the speaker using "if" to find out if $P$ is true? -> Indicative.
          4.  **Morphology Check (Tiebreaker):** If still stuck, look at the *result* clause. "Would have" = CF. "Will/Did" = Indicative.
          5.  **Unclear:** If the speaker's belief about $P$ cannot be inferred from the 2 lines.

  7.  **Addressing Confidence & Weaknesses:**
      *   Confidence: High on Future vs. Past. Low on "Hypotheticals" that aren't strictly false (the "were to" case).
      *   Weakest link: Distinguishing "unlikely future" (Indicative) from "imagined impossible" (CF) without audio/prosody.

  8.  **Final Review against Constraints:**
      *   30-60 seconds? Yes, it's a 5-step checklist.
      *   No citations? Yes.
      *   Grounded in semantics/pragmatics? Yes (Epistemic stance/Modal base).
      *   Run on 3 examples? Yes.
      *   Confidence rating? Yes.

  9.  **Self-Correction on Example 2:**
      *   "If we were to raise the fee..."
      *   Strictly speaking, this is often labeled "Subjunctive" or "Remote." In a binary CF/Indicative split, this is the danger zone.
      *   If the definition is "Antecedent is false," this is *not* CF because the fee hasn't been raised yet. It's not false that we raise it; it's just not current policy.
      *   However, many coding schemes lump "would" conditionals into CF.
      *   *Decision:* I must advise the user to code this as **Indicative** based on the *definition provided* ("antecedent is false"), but acknowledge that the *morphology* screams CF. This highlights the flaw in their codebook, which is exactly what the user wants to solve. I will categorize it as Indicative (Hypothetical) because the antecedent is not *false*.
      *   *Wait, actually:* In linguistics, "If I were you" is CF even though I can't be you. "If we were to" implies a hypothetical world. Is it *contrary to fact*? Usually, it implies "We are not currently planning to." So $\neg P$ is the current state.
      *   *Better approach for the RA:* Focus on **Settledness**. Is the matter settled as "No"?
      *   If "We are not raising the fee" is the settled fact, then "If we were to" is CF.
      *   If "We might raise the fee" is the settled fact, it's Indicative.
      *   In campus meetings, "If we were to" is usually policy planning. It's a live option. So Indicative.
      *   I will stick with Indicative but flag the morphology conflict.

  10. **Final Polish:** Ensure tone is supportive but authoritative (like a senior lab mate). Keep it dense and practical.

  *(Self-Correction during drafting response)*: I need to make sure I don't give them a "maybe" for the examples. I need to show where the procedure *stalls*.
  For (2), the procedure might stall on the "Morphology vs. Reality" conflict. I should explicitly state that.

