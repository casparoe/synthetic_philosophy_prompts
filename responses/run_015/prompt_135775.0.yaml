answer: |-
  This is a sharp diagnosis of the current state of democratic theory. You have identified what I call the **Teleological Impasse**: the debate stalls because the two camps are optimizing for different terminal values of the democratic system, yet they argue as if they are disputing the same mechanism.

  Let's break this down step-by-step, mapping the commitments, diagnosing the structure of the disagreement, and then isolating that specific variable you raised: "rotational fatigue."

  ### 1. Mapping the Commitments

  To understand why they talk past each other, we must formalize what each side is actually purchasing when they buy into their preferred system.

  **The Sortition/Deliberative Camp (Epistemic Democrats)**
  *   **Core Goal:** *Decision Quality.* Democracy is a truth-tracking or problem-solving device.
  *   **Mechanism of Legitimacy:** *Descriptive Representation + Deliberation.* If the body looks like the people and thinks hard without partisan distortion, the output is legitimate because it is "reasonably acceptable" to all.
  *   **View of Elections:** A "aristocratic" filter (Manin's *Principles of Representative Government*) that selects for wealth, charisma, and party loyalty, introducing systemic bias.
  *   **Key Metric:** *Output Legitimacy.* Did we solve the climate crisis? Did we reduce inequality?
  *   **Hidden Premise:** The "General Will" can be discovered through procedure, not just aggregated through voting.

  **The Electoral/Accountability Camp (Agonistic/Procedural Democrats)**
  *   **Core Goal:** *Popular Control.* Democracy is a mechanism for managing power and preventing tyranny.
  *   **Mechanism of Legitimacy:** *Authorization + Accountability.* I must be able to hire (vote in) and fire (vote out) the ruler. Without the threat of removal, there is no agency.
  *   **View of Sortition:** A technocratic abdication. It turns citizens into subjects of a random process rather than authors of the law.
  *   **Key Metric:** *Input Legitimacy.* Did the people consent to this rule? Can they punish failure?
  *   **Hidden Premise:** Conflict is ineradicable; therefore, we need a mechanism to adjudicate conflict (elections), not dissolve it (deliberation).

  ### 2. Diagnosing the Stall: Verbal, Substantive, or Bedrock?

  You asked if this is verbal (definitions of representation), substantive (facts about competence), or bedrock (values). My diagnosis is that it is **Substantive at the Bedrock Level, disguised as a Verbal Disagreement.**

  **The Verbal Layer:**
  Both sides use the word "Representation," but they are invoking different strands of Hanna Pitkin's classic taxonomy.
  *   **Sortitionists** mean *Descriptive Representation* (standing for the group by resembling it).
  *   **Electoralists** mean *Formalistic Representation* (authorization and accountability).
  When a sortitionist says, "This assembly is more representative," and an electoralist says, "It represents no one," they are technically both correct within their own definitional frameworks. This creates the illusion of a factual dispute.

  **The Bedrock Layer:**
  The real stall is teleological. It is a disagreement about **what democracy is *for*.**
  *   If democracy is for **getting the right answers** (Epistemic), sortition wins on paper because it reduces noise and bias.
  *   If democracy is for **exercising collective will** (Voluntarist), sortition fails because randomness is not an exercise of will. You cannot "will" a lottery result.

  **Why they talk past each other:**
  The Sortitionist answers the question: *"How do we ensure the government isn't captured by elites?"* (Answer: Remove the election market).
  The Electoralist answers the question: *"How do we ensure the government remains subordinate to the public?"* (Answer: Keep the threat of firing).
  Because they are answering different normative questions, empirical data rarely shifts the needle. Showing that a Citizens' Assembly made a "better" law doesn't comfort the Electoralist, who cares about the *right to make a bad law*. Showing that voters are ignorant doesn't comfort the Sortitionist, who thinks the system is rigged regardless of voter IQ.

  ### 3. The "Rotational Fatigue" Hidden Premise

  This is your most insightful point. Let's isolate the objection: *"Random citizens serve short terms, lack institutional memory, and thus rely on bureaucrats, rendering them ineffective."* I will call this **Rotational Fatigue.**

  **Is this a standalone factual objection?**
  On the surface, yes. It claims sortition bodies lack the *capacity* to govern due to turnover.

  **Is it doing hidden work?**
  Yes. It is acting as a **proxy for the Accountability Objection.**
  Here is the structure of the hidden argument:
  1.  *Premise:* Effective governance requires long-term memory and expertise.
  2.  *Premise:* Sortition bodies rotate too fast to build this.
  3.  *Conclusion:* Therefore, sortition bodies cannot govern.

  *However*, if we fixed this (e.g., by creating a standing sortition chamber with staggered 10-year terms), the Electoralist objection would not vanish. It would simply shift back to: *"But who fires them?"*

  **Why Rotational Fatigue is a Smokescreen:**
  The skeptic worries about **Bureaucratic Capture.** If a random citizen assembly rotates every year, they must rely on permanent civil servants for information. The skeptic argues this transfers power from the "random people" to the "permanent state."
  *   **The Sortitionist Fix:** Invest in independent secretariats and learning phases.
  *   **The Electoralist Counter:** Even with training, they lack the *mandate* to override the bureaucracy.

  **Does fixing it change anything?**
  If you solve Rotational Fatigue (by creating a permanent sortition upper house), you actually **worsen** the Electoralist's primary concern (Accountability). A sortition body with institutional memory is a powerful body that cannot be voted out.
  Therefore, "Rotational Fatigue" is often a polite way of saying: *"I don't trust a body that has power without the possibility of removal."* The lack of memory is a convenient factual hook for a normative worry about unchecked power.

  ### 4. What Would Count as Progress?

  Since the disagreement is bedrock (Control vs. Competence), you cannot "win" the debate. Progress comes from **Hybridization** and **Differentiation.**

  **A. Conceptual Progress: Distinguishing Legitimacy Types**
  We need to stop treating "Legitimacy" as a monolith. Progress requires admitting that:
  *   Elections provide *Sanctioning Legitimacy* (the power to remove).
  *   Sortition provides *Reasoning Legitimacy* (the quality of the justification).
  *   **The Shift:** The debate moves from "Which system is democracy?" to "Which system provides which type of legitimacy?"
  *   **Progress Marker:** When theorists stop arguing that sortition *replaces* elections, and start arguing it *complements* them (e.g., a bicameral system where the lower house is elected for accountability, and the upper house is sorted for deliberation).

  **B. Empirical Progress: The "Diffusion" Question**
  You mentioned the "epistemic island." This is the crucial empirical bottleneck.
  *   **The Study Needed:** We do not need more studies on whether mini-publics deliberate well *internally*. We need studies on **External Diffusion.**
  *   **The Question:** When a Citizens' Assembly makes a recommendation, does the broader public accept it as *their own* will, or do they view it as an elite decree?
  *   **Why this matters:** If the public rejects the sortition body's output (as seen in some climate assembly backlashes), the Epistemic value is nullified by the Voluntarist deficit. If empirical work shows that "deliberative polling" can shift public opinion to match the mini-public, the Sortitionist gains ground on the "Control" argument (by showing the public *would* want this if they knew more).

  **C. Institutional Progress: Taming Rotational Fatigue**
  To address your specific concern:
  *   **Proposal:** Staggered terms for sortition chambers (like the US Senate).
  *   **Test:** Does this reduce bureaucratic capture without creating a new aristocratic class?
  *   **Progress:** If a staggered sortition chamber can demonstrate it can *audit* the bureaucracy effectively without needing a electoral mandate, it bridges the gap. It uses sortition for *oversight* (where memory matters less than independence) rather than *legislation* (where mandate matters more).

  ### 5. Final Verdict

  The debate is stalled because it is a **Category Error.**

  *   **Sortitionists** are proposing a **Judicial/Epistemic** model of democracy (finding the best answer).
  *   **Electoralists** are proposing a **Political/Agency** model of democracy (managing conflict and power).

  **Rotational Fatigue** is indeed a hidden premise, but it is a symptom, not the disease. It is the Electoralist's way of pointing out that Sortition creates a body that acts like a bureaucracy (expert-dependent) without the leash of an election.

  **What counts as progress for your seminar?**
  Do not try to prove one side right. Instead, propose that **Democracy requires both functions.**
  1.  **Authorization** (Elections) is non-negotiable for the *executive* function (who wields the sword).
  2.  **Deliberation** (Sortition) is superior for the *legislative/oversight* function (setting the rules and checking power).

  The stall breaks when we admit that "Democracy" is not one thing. It is a system that requires both *competence* (sortition's strength) and *control* (election's strength). The friction you are observing is the sound of these two necessary but incompatible values rubbing against each other. The goal isn't to eliminate the friction, but to design institutions that manage it.
