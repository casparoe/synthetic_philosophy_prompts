          *   Field: 30-year consensus, stubborn anomalies (sign reversal, drift), treated as noise by consensus.
          *   Proposal: 5 years to build instruments + develop a new vocabulary/framework.
          *   Conflict: Applicants refuse to state predictions in existing terminology (claim incommensurability/Kuhn). Rules require pre-registered predictions in standard terms. Review guidance says score against current standards.
          *   Statistician's Objection: No falsifiability = not science.
          *   Options: Approve, Reject, Approve with Conditions.
