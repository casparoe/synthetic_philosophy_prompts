      *   Timeline: 3 months to submit conditions.

  7.  **Writing - Iteration 2 (Focusing on constraints):**
      *   Must lead with single sentence recommendation.
      *   Must address Kuhn honestly (meaning vs evidence, local vs global).
      *   Must be defensible in public.
      *   Max 700 words.

  8.  **Drafting the Content:**
      *   *Recommendation:* I recommend approving the proposal conditional on the applicants submitting a bridge lexicon and explicit falsification criteria within three months.
      *   *Reasoning:* The panel is split because the application challenges the procedural norms designed to prevent fraud, yet our mandate is transformative research. The applicants' Kuhnian defense requires scrutiny. Kuhn's incommensurability is not a claim that communication is impossible (global), but that specific lexical sets lack neutral translation (local). If the shift were global, they could not justify funding to us; if local, they can identify where translation fails.
      *   *The Statistician's Point:* Valid. Public funds require accountability. A project without a "give-up" condition is advocacy, not inquiry. However, requiring predictions in the *old* vocabulary begs the question if the old vocabulary is the artifact.
      *   *The Solution:* We accept the lexical risk but enforce evidentiary accountability.
      *   *Condition 1 (Bridge Lexicon):* Applicants must provide a table mapping proposed terms to incumbent ones, explicitly flagging where mapping fails. This tests the "local" claim. If everything fails to map, the proposal is unintelligible. If nothing fails, the paradigm claim is weak.
      *   *Condition 2 (Falsification):* Applicants must state what raw observational outcome (instrument readings, not theoretical interpretations) would terminate the project. This satisfies the need for auditability without forcing theoretical surrender.
      *   *Addressing the Rejection:* The strongest case against funding is that "incommensurability" is the standard shield of pseudoscience, and the base rate for successful paradigm overthrow is near zero. Public funders lack the epistemic warrant to bankroll frameworks that refuse external audit.
      *   *Addressing the Approval:* The strongest case for funding is that neutrality is an illusion; judging revolutionary work by conservative standards guarantees stagnation. We fund people capable of seeing anomalies, not just programmes fitting existing boxes.
      *   *Decision:* We split the difference. We fund the inquiry but demand they show us where the language breaks and what data would stop them.
      *   *Timeline:* Conditional approval released immediately. Applicants have 90 days to submit conditions. Failure to comply voids award.

  9.  **Review against Constraints:**
      *   Single sentence lead? Yes.
      *   Kuhn analysis included? Yes (local vs global, meaning vs evidence).
      *   Devices used? Yes (Bridge lexicon, Give-up condition).
      *   Fair statement of rejected position? Yes (pseudoscience risk).
