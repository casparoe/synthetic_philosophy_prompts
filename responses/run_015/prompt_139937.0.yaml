      *   **Rejection Statement:** Acknowledge the counter-argument (cranks use this defense, base rates are low).
      *   **Approval Statement:** Acknowledge the counter-argument (paradigm change is real, neutrality is impossible).
      *   **Tone:** Professional, decisive, philosophically grounded but practical.

  4.  **Drafting - Refining the Kuhn Analysis:**
      *   Kuhn's later work localized incommensurability to lexical subsets. It doesn't mean *no* comparison, just *no neutral language* for specific concepts.
