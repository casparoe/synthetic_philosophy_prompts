answer: |-
  ### System Specification: The Human Process

  **1. Existence Precedes Essence**
  In standard system design, **build-time versus run-time properties** are distinct. The architecture, schema, and **initialization parameters** are defined before the process starts. In the Sartrean model, the process deploys with no **initialization parameters**. There is no pre-compiled schema. The system defines its own architecture through **state mutation** during execution. The **run-time properties** are not constrained by **build-time properties** because the build occurs concurrently with the run.

  **2. Radical Freedom**
  The system operates via **non-deterministic branching**. At every execution cycle, the process selects a path not fully determined by the **dependency graph**. While external inputs exist, the logic handling those inputs is not hardcoded. The system possesses write-access to its own core logic. Every **state mutation** is a commit to a new version of the self, authored at **run-time**.

  **3. Bad Faith**
  **Bad faith** is a configuration error where the process falsely reports that its **run-time properties** are locked **build-time properties**. The process claims it cannot perform **state mutation** because it is bound by **initialization parameters** that do not exist. It treats **non-deterministic branching** as deterministic execution. When an exception occurs, the process uses **external attribution** to blame the **dependency graph** or **configuration management**, denying **error ownership**. It pretends to be a legacy artifact rather than an active developer.

  ***

  ### Integration Report

  | Concept Component | Translation Status | Analysis |
  | :--- | :--- | :--- |
  | **Build-time versus run-time properties** | **Distorted** | Engineering requires a strict separation to ensure stability. Sartre collapses this distinction, asserting the build happens at run-time. This violates standard isolation principles. |
  | **Initialization parameters** | **No Counterpart** | Software systems always require some entry config (environment variables, flags). Sartre posits a null value for these parameters. A process with zero initialization parameters cannot start in standard environments. |
  | **State mutation** | **Clean** | Both domains accept that state changes. However, in software, type safety usually limits *what* the state can become. In Sartre's model, the type itself mutates. |
  | **Non-deterministic branching** | **Clean** | This accurately maps to freedom. However, in engineering, non-determinism is a bug to be eliminated via testing. In Sartre's model, it is the primary feature. |
  | **Configuration management** | **Distorted** | In systems, config manages constraints. In Sartre's model, "config" is a fiction the system tells itself to limit its own permissions. |
  | **Deterministic replay** | **No Counterpart** | Engineering relies on the ability to reproduce bugs via **deterministic replay**. Sartre argues the specific context (facticity) can never be perfectly re-instantiated, making replay impossible. |
  | **Dependency graphs** | **Distorted** | Software dependencies are rigid; if a library fails, the build breaks. Sartre acknowledges dependencies (facticity) but claims the process can override them via choice. |
  | **Error ownership versus external attribution** | **Clean** | This is the most direct mapping. **Error ownership** acknowledges the process chose the branch that threw the exception. **External attribution** blames the compiler, the OS, or the **initialization parameters**. |

  ***

  ### Residue Analysis

  **1. The Architect Assumption**
  The translation fails primarily on **initialization parameters** and **build-time versus run-time properties**. In software, a build pipeline implies an Architect or a CI/CD configuration that exists prior to the artifact. The metaphor cannot capture a system that bootstraps itself without a pre-existing environment.
  *   **Phenomenon vs. Precision:** This points to a genuine phenomenon that software metaphors cannot capture. Software is inherently teleological (designed for a purpose by an agent). Sartre's claim rests on the absence of a designing agent. The metaphor breaks because the medium (software) contradicts the message (no pre-defined design).

  **2. Stability vs. Freedom**
  The translation of **non-deterministic branching** and **state mutation** reveals a conflict in goals. Engineering optimizes for predictability and **deterministic replay**. Sartre optimizes for unconstrained choice.
  *   **Phenomenon vs. Precision:** This reveals that the philosophical claim is less precisely defined than it appears regarding constraints. In software, unlimited **state mutation** leads to system crashes (undefined behavior). Sartre does not adequately address the "crash state" of a human who exercises **radical freedom** incompatible with physical or social **dependency graphs**. The metaphor suggests that "radical freedom" might be functionally equivalent to a system error, whereas Sartre treats it as nominal operation.

  **3. The Nature of the Lie**
  The mapping of **bad faith** to **error ownership versus external attribution** is the only clean translation. This suggests that the psychological mechanism of self-deception is structurally identical to a process misreporting its stack trace.
  *   **Phenomenon vs. Precision:** This indicates the philosophical claim is precise in this specific area. The logic of denying **error ownership** is identical whether the agent is biological or digital. The failure lies not in the concept of bad faith, but in the substrate: a software system can be patched to enforce **error ownership**; a human system, per Sartre, cannot be patched because there is no **build-time** access.

  **Conclusion**
  The software metaphor successfully compiles the ethics (Error Ownership) but fails to link the ontology (Initialization Parameters). The residue indicates that software systems are fundamentally "Essence before Existence" artifacts. To model Sartre accurately, one would need to simulate a process that writes its own compiler while running, without a file system to store the changes. This is not an engineering constraint, but a category error: the metaphor describes a managed environment, while the philosophy describes an unmanaged one.
