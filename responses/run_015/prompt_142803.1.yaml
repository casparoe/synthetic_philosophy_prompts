      *   *Desideratum 3: Negative Parts.* Holes. The statue's form includes holes (e.g., David's sling). The clay just has a lack of clay there. Does the hole belong to the object?
      *   *The Trilemma:* Temporary Coincidence (they are distinct but overlap for a while), Essential Form (statue has form essential, clay doesn't), No Ontological Overpopulation (don't multiply entities beyond necessity). Can all three hold?
          *   If Temporary Coincidence + Essential Form -> Distinct entities -> Overpopulation (violates No Overpopulation).
          *   If No Overpopulation + Essential Form -> They are identical -> Violates Temporary Coincidence (because if identical, they must share all properties, including persistence conditions, so they can't diverge later).
          *   If No Overpopulation + Temporary Coincidence -> They are identical -> Violates Essential Form (because clay doesn't have form essentially).
          *   *Conclusion:* The trio is jointly unsatisfiable. One must go.

