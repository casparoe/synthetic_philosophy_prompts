          2.  Get destruction asymmetries right (statue smashed/clay survives; clay replaced/statue survives).
          3.  Account for negative parts (holes belonging to form but not substrate).
      *   **Specific Analysis for Each:** State the motivating case, say whether it's a hard constraint or a prejudice, and flag jointly unsatisfiable clusters (specifically: temporary coincidence, essential form, and no ontological overpopulation).
