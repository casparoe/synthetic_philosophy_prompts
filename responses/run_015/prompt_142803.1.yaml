  okay so me and my friend got into this long argument last night over the statue-and-clay problem—like if you mold a lump of clay into a statue, are they literally the same thing sitting there or not?—and now i need you to lay out the actualy desiderata that a theory of material constitution has to meet if its going to solve that instead of just renaming it. i want the real criteria: it needs to explain spatial coincidence without total identity, it has to get the destruction asymmetries right (the statue can be smashed while the clay survives, and also the reverse case where every particle of clay is gradually replaced by synthetic polymer that behaves identically but technically isnt clay anymore, yet the statue apparently persists), and it must account for negative parts like drilled holes that belong to the statue's form but not to the substrate. for each one state the motivating case, say whether its a hard constraint or just a prejudice of one camp, and flag any cluster thats jointly unsatisfiable—specifically can temporary coincidence, essential form, and no ontological overpopulation all hold together or does that trio break? keep the weight on the criteria and the reasoning behind them, not on a scorecard of named theories, though you can briefly mention where hylomorphism, mereological essentialism, and the constitution view fall short. please write the whole thing as continuous prose with no headings, bullet points, bold text, or tables, just like an email or letter, because im pasting this into something that cant handle formatting.
