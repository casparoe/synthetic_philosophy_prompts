      *   *The Problem:* Statue (Goliath) vs. Clay (Lump). They occupy the same space at time t. Are they identical?
      *   *Desideratum 1: Spatial Coincidence without Total Identity.* If they are distinct, how can two things be in the same place? If they are identical, how do they have different properties?
      *   *Desideratum 2: Destruction Asymmetries.*
          *   Case A: Smash the statue. Statue dies, clay survives. (Suggests non-identity).
