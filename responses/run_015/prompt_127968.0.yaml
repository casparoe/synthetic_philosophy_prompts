          *   *Sex:* Protecting minors from exploitation/power dynamics (status-based).
          *   *Medicine:* Ensuring minors get care (outcome-based). If a minor can't consent to an abortion or STD treatment, the harm of *no treatment* outweighs the harm of *potential poor decision*.
