answer: |-
  You have fallen into one of the deepest rabbit holes in legal philosophy. You are correct that "consent" is not a single, unified metaphysical entity that the law discovers; it is a *legal construct* that shifts shape depending on what policy goal the law is trying to achieve.

  Your friend's "Swap Test" is what philosophers call **Counterfactual Subjective Consent** ("Would you have said yes if you knew the truth?"). You are also right that the law largely rejects this test in both domains, though for different reasons.

  Here is a breakdown of what each practice presupposes, where the pragmatism kicks in, and why the age paradox exists.

  ### 1. What does each practice presuppose consent *is*?

  **Medicine: Consent as "Authorized Waiver of Rights"**
  In medical law, consent is not merely a mental state or a speech act; it is a **conditional permission**.
  *   **The Ontology:** It presupposes that the patient owns their body and the doctor is a fiduciary (a trusted agent). Consent is the mechanism by which the patient waives their right to bodily integrity *only under specific conditions*.
  *   **The Scope:** You noted the "battery" distinction. Technically, in most modern jurisdictions (like post-*Canterbury v. Spence* US law or post-*Montgomery* UK law), failing to disclose a risk is **negligence**, not battery.
      *   *Battery* occurs if I cut your left leg when you consented to the right leg (touching outside the scope).
      *   *Negligence* occurs if I cut the correct leg but didn't tell you about nerve damage (touching within the scope, but the *authorization* was flawed).
  *   **Individuation:** Medicine individuates the act broadly. "Surgery" includes the *risks inherent to the procedure*. The law presupposes that you cannot consent to a medical procedure without consenting to the *medical context* of that procedure.

  **Sex: Consent as "Voluntariness of the Physical Act"**
  In criminal sexual law, consent is primarily a **shield against force and coercion**.
  *   **The Ontology:** It presupposes that the primary evil the state must prevent is the violation of bodily security through force, threat, or fundamental deception. It is less concerned with the *quality* of the decision and more with the *freedom* of the decision.
  *   **The Scope:** This is where your "event-under-a-description" point hits hard. The law generally treats the "act" as the **bare physical event** (penetration, touching), not the *social context* surrounding it.
      *   Lying about money/love = Fraud in the *inducement* (context). Consent stands.
      *   Lying about identity/nature of act = Fraud in the *factum* (physical reality). Consent void.
  *   **Individuation:** The law individuates the act narrowly. If you consent to "sex," the law asks, "Did physical penetration occur?" It does not ask, "Did the emotional context match your expectations?"

  **The Mismatch:** Medicine treats consent as **Informational Autonomy** (I decide based on data). Sex law treats consent as **Physical Voluntariness** (I decide without force).

  ### 2. Presupposition vs. Pragmatic Fit

  You asked if these rules are theoretical or just practical. The answer is heavily weighted toward **pragmatics**.

  **Medicine: Duty of Care in Costume**
  You hit the nail on the head: The medical rule *is* largely a duty-of-care rule wearing a consent costume.
  *   **Why?** If every failure to disclose made the consent void (battery), doctors would be strictly liable for any bad outcome they didn't mention. By framing it as negligence ("Did the doctor meet the standard of disclosure?"), the law allows expert testimony to define what a "reasonable patient" needs to know.
  *   **The Swap Test Failure:** You noted medicine cares about undisclosed risks even if you would have agreed anyway. This confirms it's not about *your* choice; it's about the *doctor's duty*. The law is protecting the *process* of decision-making, not just the outcome.

  **Sex: Evidentiary and Liberty Constraints**
  The narrowness of sexual consent law is driven by two pragmatic fears:
  1.  **Evidentiary Chaos:** If lying about marital status vitiated consent, every broken relationship could become a rape trial. The state cannot adjudicate the truthfulness of romantic promises.
  2.  **Liberty/Paternalism:** There is a liberal hesitation to criminalize "bad seduction." The law assumes adults are responsible for vetting their partners regarding status, wealth, and intent. To rule otherwise would treat adults like children who cannot navigate social deception.
  *   **Stealthing (Condom Removal):** This is the fascinating exception where the law is shifting. By ruling that stealthing vitiates consent, courts are effectively saying: "The physical act agreed to was *safe* sex. The physical act performed was *unsafe* sex." They are re-individuating the act to include the condition of protection, moving it closer to the medical model.

  ### 3. Cross-Application: What if we swapped the theories?

  **If we applied Medical Consent to Sex:**
  *   **The Rule:** Partners would have a duty to disclose all "material risks" (STI status, pregnancy risk, emotional availability, financial debt, marital status) before touching.
  *   **The Consequence:** Almost all casual sex would become criminal negligence. Seduction would require a signed waiver form listing risks.
  *   **What Breaks:** It destroys sexual autonomy. Part of sexual negotiation is the right to keep some cards close to your chest. It turns the state into a regulator of romantic honesty.

  **If we applied Sex Consent to Medicine:**
  *   **The Rule:** Doctors only need to ensure you aren't being held down. They don't need to disclose risks unless you ask. Lying about the success rate is "fraud in the inducement," so the surgery is legal.
  *   **The Consequence:** The fiduciary relationship collapses. Patients cannot make autonomous choices because they lack the expertise to know *what to ask*.
  *   **What Breaks:** Trust in the medical system. Because the power imbalance between doctor and patient is so vast, the law *requires* the doctor to volunteer information. In sex, the law presumes a more equal footing (even when that's not true).

  ### 4. Is the Pattern Underdetermined?

  **Yes.** There is no "fact of the matter" about what consent *really* is.
  You could justify the current split using three different theories, and all would fit the data:
  1.  **Autonomy Theory:** Medicine protects *decisional* autonomy (requires info). Sex protects *physical* autonomy (requires freedom from force).
  2.  **Efficiency Theory:** Medical disclosure is easy to standardize (checklists). Sexual honesty is impossible to litigate (he-said-she-said).
  3.  **Power Theory:** Doctors have institutional power over patients, requiring strict rules. Sexual partners are (theoretically) peers, requiring looser rules.

  The law doesn't choose one; it muddles through all three. This is why you feel like the concept is fracturing. It is.

  ### 5. The Age/Competence Paradox

  This is the clearest proof that "consent" is a policy tool, not a psychological state.

  **The 15-Year-Old in the Doctor's Office:**
  *   **Goal:** *Harm Reduction.*
  *   **Logic:** If a 15-year-old needs an abortion, STD treatment, or addiction counseling, and we say "you can't consent," they will not get treatment. The harm of *no treatment* outweighs the harm of *potentially poor decision-making*.
  *   **Competence:** Here, competence is treated as **decision-specific**. Can this child understand *this* treatment? (The "Mature Minor" doctrine).

  **The 15-Year-Old in the Bedroom:**
  *   **Goal:** *Protection from Exploitation.*
  *   **Logic:** The state presumes a 21-year-old has significantly more power, resources, and cognitive development than a 15-year-old. Even if the 15-year-old says "yes" enthusiastically, the law says that "yes" is structurally compromised by the age gap.
  *   **Competence:** Here, competence is **status-based**. It is a bright-line rule to avoid courts having to interrogate every teenager's maturity level.

  **Does "Consent" do different work?**
  Yes.
  *   In **Medicine**, consent is a **Key**. It unlocks access to care. The law wants to make the key easier to turn so people get healed.
  *   In **Sex**, consent is a **Shield**. It blocks state intervention and criminal liability. The law makes the shield harder to forge to protect vulnerable populations.

  ### Summary
  Your friend's "Swap Test" fails because the law is not interested in **Counterfactual Truth**; it is interested in **Administrable Rules**.

  *   **Medicine** presupposes consent is an **informed authorization**, because the power imbalance requires the expert to educate the layperson.
  *   **Sex** presupposes consent is a **voluntary agreement to physical acts**, because the state cannot police the truthfulness of human relationships without destroying privacy.
  *   **Age** rules show that consent is not about *capacity* alone, but about *policy outcomes* (access to care vs. protection from predators).

  You haven't found a contradiction in your understanding; you've found the contradiction in the law itself. Consent is a chameleon concept that changes color to match the problem it is trying to solve.
