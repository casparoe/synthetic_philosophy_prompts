  6.  **Final Polish:** Check against the four specific questions + the age addendum. Ensure the structure is clear. (Proceed to generate output based on these thoughts).

      *   *Key Insight to highlight:* Consent in law isn't a psychological fact; it's a *normative threshold*. It's a line drawn for policy reasons, not a discovery of a mental state.

