      *   **Question 3: Cross-Application (The Thought Experiment)**
          *   *Medical Theory -> Sex:* If doctors had to disclose "risks" (STIs, emotional fallout, pregnancy risk) like medical risks, almost all seduction would become criminal. It would criminalize normal social negotiation.
          *   *Sex Theory -> Medicine:* If doctors only needed consent for the "physical act" (cutting skin) without disclosing risks, patients would be subjected to unknown dangers. Trust in the profession would collapse.
      *   **Question 4: Underdetermination**
          *   Yes, the pattern is underdetermined. You can justify it via Autonomy, Paternalism, or Administrative Efficiency. There is no single "Truth of Consent."
      *   **Question 5: The Age/Competence Paradox**
