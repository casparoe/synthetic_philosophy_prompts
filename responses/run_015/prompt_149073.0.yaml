      *   Disciplinary assessment (both directions)? Yes (Illumination vs. Limits).
      *   Explicit about silence? Yes.
      *   No contested biography? Yes.

  8.  *(Self-Correction during drafting)*: Make sure not to conflate Neo-Logicism (Hume's Principle) with Frege's actual BLV system. The prompt asks about retaining *Basic Law V*. I must focus on BLV + Paraconsistency, not just switching to HP. There is work on "Paraconsistent Frege" (e.g., by Weber or Brady) that keeps BLV. I should reference the theoretical possibility thereof.

  9.  *(Final Polish)*: Ensure the distinction between the *derivation* steps and the *meta-logical* consequence of contradiction is clear. Frege's derivation doesn't explode; the *system* explodes. Paraconsistency stops the system explosion.

