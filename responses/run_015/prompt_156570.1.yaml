answer: |-
  Here is the breakdown for your dinner-party scene.

  ### The Resource Question
  Does it matter that the pump drains attention instead of cash? **No.** To both camps, utility is abstract. Whether you lose dollars or cognitive bandwidth, the result is the same: you end up in the same state you started in, but poorer. Both camps agree that avoiding the loop is rational. A rational agent maximizes utility (or minimizes loss), and attention is a prerequisite for generating utility. Draining it for no gain is strictly irrational.

  ### The Camps' Conflict
  Here is where your scene gets its tension. While both agree the loop is bad, they blame different things:

  1.  **The Diachronic Dutch Book (DBA) Camp:** They argue the *preferences themselves* are broken. If you can be pumped, your ranking structure is incoherent (intransitive). Their solution is **fix your tastes**. They will tell your character: "You shouldn't prefer A to B, B to C, and C to A. Correct your ranking so the loop is impossible." They view the attention drain as a symptom of logical incoherence.
  2.  **The Resolute Choice (Planning) Camp:** They argue the *preferences might shift* (due to fatigue, context, or attention drain), but the *agency* is broken. Their solution is **fix your will**. They will tell your character: "It's fine that you're tired and suddenly prefer B. You should have committed at T1 to ignore T2's fatigue-induced preferences." They view the attention drain as a predictable hazard to be managed by meta-rules.

  ### The Technical Flaw (Don't Play Nice)
  You have a category error in your setup. You wrote: *"pay a tiny slice of focus to flip to B > C > A."*
  In decision theory, you do not pay to **flip your preferences**. You pay to **satisfy** them.
  *   **Correct Mechanism:** You prefer A. You pay attention to switch to B. Now you are holding B. Due to attention fatigue, your preference shifts so you now prefer C to B. You pay attention to switch to C. Then you prefer A to C. You pay attention to switch to A.
  *   **Why it matters:** If your character literally pays to change their mind, that's brainwashing or learning, not a Dutch Book. For the philosophy to hold, the preference shift must be a *consequence* of the state (fatigue), not the *price* of the transaction. If you don't fix this, a pedant at your dinner party will derail the scene.

  ### Does the Distinction Collapse?
  No. The distinction remains vital for character dynamics.
  *   The **DBA character** is cold, logical, and demands internal consistency. They see the attention drain as proof the agent is flawed.
  *   The **Planning character** is strategic, empathetic to frailty, and demands commitment. They see the attention drain as proof the agent needs a binding rule.

  However, the **Attention Twist favors the Planning Camp**. Why? Because attention depletion is a *temporal* process (fatigue builds over time). DBA assumes static preferences. Planning is specifically designed to handle agents whose preferences shift over time due to changing states (like getting tired). If the attention drain *causes* the preference shift, DBA struggles (are the preferences wrong, or is the state wrong?), while Planning thrives (bind yourself against the tired state).

  ### Bottom Line
  The analogy works, but you must fix the mechanism: characters pay to **trade goods**, not to **trade rankings**. The attention drain causes the ranking shift, it doesn't buy it. Once fixed, the Planning Camp offers the richer dramatic conflict (Willpower vs. Fatigue) compared to the DBA Camp (Logic vs. Illogic).

  Verdict: planning camp
