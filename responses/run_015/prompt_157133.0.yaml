prompt: |-
  I'm putting together the preregistration for a follow-up to my undergrad thesis — I'm in the second year of a cog-sci PhD now — and I keep going in circles with my supervisor about the design, so I thought I'd ask here. Short version: we're running a fairly large multilingual online survey of philosophical case judgments. Gettier-style cases, a couple of trolley variants, some of those side-effect cases where someone brings about a bad outcome as a side effect and people say he did it intentionally. Around twelve languages, native-speaker translation plus back-translation, comprehension checks, the usual. My flatmate thinks the whole project is unfalsifiable and I'd like to be able to tell her why it isn't.

  The working plan is to treat the whole thing as a sampling problem: analytic philosophy has been leaning on the intuitions of a very unrepresentative slice of humanity, so the fix is to sample properly and then aggregate. Weight the responses somehow — we can't decide between weighting by population size, weighting by number of languages, or just equally per site — and take whatever the global majority says as the verdict. If the global majority disagrees with what philosophers have been saying since the 60s, then the philosophers update their theories; that seems to me like the entire point of the critique. I also want to add a short debiasing preamble before each vignette, a neutral rewording that strips out the cultural framing — honorifics, names that signal ethnicity, anything that might trigger a local script — so that what we end up measuring is the intuition itself rather than the cultural overlay sitting on top of it. And if it still varies after all that, I guess we just report that knowledge and intentional action are culturally relative and leave it there?

  My supervisor says the design has a conceptual problem rather than a statistical one, and that I'm presupposing the thing the literature is actually arguing about, but she won't tell me what she means until I work it out myself, which is driving me up the wall. So, concretely: is the weighting question even the right question to be asking, does the debiasing preamble do what I think it does, and what am I supposed to conclude from variation if it shows up — relativism, or something else? One more thing while I'm here: we have budget for a single extra between-subjects condition for control items, and I was going to spend it on a non-philosophical item that we already know varies across cultures, something like a risk-preference or trust question, on the theory that if it varies too then response style is doing the work. Is that the right control, or am I about to waste the condition?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** 2nd-year CogSci PhD student.
      *   **Task:** Preregistering a follow-up to an undergrad thesis (experimental philosophy/X-Phi).
      *   **Conflict:** Stuck in a loop with their supervisor about design. Flatmate thinks the project is unfalsifiable.
      *   **Project:** Large multilingual online survey of philosophical case judgments (Gettier, Trolley, Side-Effect/Knobe). ~12 languages, translation/back-translation, comprehension checks.
      *   **Proposed Methodology:** Treat as a sampling problem. Weight responses (population vs. language vs. site). Global majority verdict determines philosophical truth. "Debiasing preamble" to strip cultural framing.
      *   **Supervisor's Critique:** Conceptual problem, presupposing the thing being argued about.
      *   **Specific Questions:**
          1.  Is the weighting question the right one?
          2.  Does the debiasing preamble work as intended?
          3.  What to conclude from variation (relativism vs. something else)?
          4.  Is the proposed control condition (risk/trust) the right use of the budget?

  2.  **Deconstruct the Supervisor's Critique (The Core Issue):**
      *   The supervisor says the student is "presupposing the thing the literature is actually arguing about."
      *   *What is the literature arguing about?* Experimental Philosophy (X-Phi) started with the "Negative Program" (Weinberg, Nichols, Stich) challenging the "Positive Program" (armchair intuition reliance).
      *   *The Assumption:* The student assumes there *is* a "global majority verdict" that constitutes *the* intuition, and that philosophy should update to match it.
      *   *The Problem:* This assumes intuitions are evidence for philosophical truth in the first place. Many philosophers (and cog sci researchers) argue intuitions *aren't* evidence, or that variation implies there is no single "correct" intuition to find. If intuitions vary culturally, it might mean the concept itself is culturally constructed, not that one culture has the "right" intuition and the others are noise.
      *   *The "Unfalsifiable" Charge:* If the goal is to find the "true" intuition, but variation exists, the student plans to conclude "relativism." If no variation exists, they conclude "universalism." Where is the risk? The flatmate's point is likely that *any* outcome is spun to fit a narrative without testing a specific mechanistic hypothesis.
      *   *Weighting:* Weighting by population assumes a democratic view of truth (philosophically dubious). Weighting by language assumes linguistic determinism. Equal weighting assumes independence. None solve the normative question: *Why should numbers dictate philosophical validity?*

  3.  **Address the Specific Questions:**

      *   **Q1: Weighting.**
          *   *Analysis:* Weighting is a statistical fix for a normative/epistemological problem. If the goal is descriptive (what do humans think?), weighting matters. If the goal is normative (what *should* philosophers think?), weighting is category error.
          *   *Advice:* Stop treating it as a sampling problem for "truth." Treat it as a mapping of the *space of intuitions*. The "global majority" doesn't settle philosophical debates (is-ought problem).

      *   **Q2: Debiasing Preamble.**
          *   *Analysis:* "Stripping cultural framing" is theoretically impossible. Language *is* culture. Neutralizing names/honorifics might make the vignette unnatural or incomprehensible. It assumes a "view from nowhere."
          *   *Advice:* Be careful. You might be measuring "weird abstract hypotheticals" rather than "intuitions." It might reduce ecological validity.

      *   **Q3: Variation & Conclusion.**
          *   *Analysis:* If variation persists after "debiasing," does it mean relativism? Or does it mean the vignette measures different constructs in different cultures? Or that the philosophical concept (e.g., "knowledge") isn't a natural kind?
          *   *Advice:* Don't jump to "cultural relativism" as a stopper. Consider "conceptual divergence" or "pragmatic differences."

      *   **Q4: Control Condition.**
          *   *Analysis:* Using a known variable (risk/trust) is good for validating that the *method* can detect differences. If you find no difference in philosophical cases but do in risk, it suggests universality in philosophy. If you find differences in both, it suggests general cultural response styles or genuine cultural variation.
          *   *Advice:* It's a valid "manipulation check" for cultural sensitivity, but be careful not to conflate risk preference with philosophical judgment mechanisms. A better control might be a "fake" philosophical vignette or a comprehension check that varies pragmatically. But the risk/trust idea is defensible as a "positive control" for cultural variation.

  4.  **Synthesize the "Supervisor's Hint":**
      *   The supervisor wants the student to realize that *aggregating intuitions doesn't yield philosophical truth.*
      *   The "Negative Program" of X-Phi was meant to undermine confidence in armchair methods, not replace them with a popularity contest.
      *   The design assumes a "Defeasible Evidence" model (intuitions = data) without questioning *what* the data is data *for*.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, peer-to-peer (PhD level), constructive but critical.
      *   *Structure:*
          1.  Validate the frustration (supervisor games are annoying).
          2.  Decode the supervisor's comment (The Normative vs. Descriptive gap).
          3.  Address the Flatmate's "Unfalsifiable" claim (Theory-ladenness).
          4.  Tackle the Weighting Issue (Democratic fallacy).
          5.  Tackle the Debiasing Preamble (The "View from Nowhere" problem).
          6.  Tackle the Variation/Relativism conclusion (Construct validity).
          7.  Tackle the Control Condition (Positive control logic).
          8.  Actionable advice for preregistration.

      *   *Refining the "Weighting" point:* Emphasize that weighting by population implies philosophical truth is democratic. That's a huge philosophical claim hidden in a statistical choice.
      *   *Refining the "Debiasing" point:* Mention that "neutral" language is often Western/WEIRD academic language. Stripping context might strip meaning.
      *   *Refining the "Control":* It's a "positive control" for cultural variance. If risk varies but Gettier doesn't, that's interesting. If both vary, it's culture. If neither varies, maybe the translation failed.

  6.  **Final Polish:** Check against CogSci/X-Phi literature norms (Knobe, Weinberg, Machery, Nativism vs. Empiricism). Ensure the distinction between *descriptive* (what people think) and *normative* (what is true) is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't just bash the project. It's a standard X-Phi design. The issue is the *interpretation* framework. The student wants to use it to *settle* philosophy. The supervisor knows that's impossible. I need to help the student pivot to a defensible claim (e.g., "mapping the boundaries of folk concepts" rather than "correcting philosophy").

      *(Re-evaluating the Control)*: Is risk preference the best control? It measures decision making, not semantic judgment. A better control might be a vignette where the "correct" answer is factual, not normative, to check for response bias. But risk/trust is okay for establishing *that* cultural differences exist in the sample. I'll suggest it's a "positive control for cultural sensitivity."

      *(Re-evaluating the "Unfalsifiable" claim)*: Why would the flatmate say that? If the plan is "If variation -> Relativism, If no variation -> Universalism," that covers all bases. It's not falsifiable because there's no risky prediction. A risky prediction would be "Specific factor X drives variation in Case Y." The current design is fishing. I should mention this.

  7.  **Final Output Structure:**
      *   Intro: Empathy + decoding the supervisor.
      *   Point 1: The Normative/Descriptive Gap (The Supervisor's Point).
      *   Point 2: The Weighting Fallacy (Political Philosophy in Stats).
      *   Point 3: The "Neutral" Vignette Problem (Linguistic Relativity).
      *   Point 4: Variation & Conclusions (Construct Validity).
      *   Point 5: The Control Condition (Positive Control).
      *   Summary/Preregistration Advice.

  8.  (Final check of the prompt requirements): Address weighting, debiasing, variation conclusion, and control condition. Ensure tone is appropriate for a PhD student.

      *Let's write.*
answer: |-
  This is a classic Experimental Philosophy (X-Phi) design, and your supervisor is playing a very standard pedagogical game: they want you to identify the *philosophical* commitment hidden inside your *statistical* choices before you lock them in. Your flatmate's "unfalsifiable" critique is also sharp, though perhaps for a slightly different reason than you think.

  Here is the breakdown of the conceptual traps you are walking into, why your supervisor is stonewalling you, and how to fix the preregistration.

  ### 1. The Supervisor's Point: The Normative/Descriptive Gap
  Your supervisor says you are "presupposing the thing the literature is actually arguing about." Here is what that means:

  You are treating philosophical intuitions as **data points** that aggregate toward a **truth value**. Your design assumes that if 70% of humanity says "The protagonist *knows* the proposition," then the philosophical theory of knowledge should align with that majority.

  **The Problem:** This assumes the "Demographic Defense" of intuition. It presupposes that intuitions are evidence for philosophical truth in the first place. A huge chunk of the post-2000 X-Phi literature (the "Negative Program") argues exactly the opposite: that variation in intuitions *undermines* their evidential value entirely.
  *   **If you find variation:** You plan to conclude "concepts are relative."
  *   **If you find universality:** You plan to conclude "philosophers should update to the global majority."

  In both cases, you are assuming that *folk verdicts dictate normative theory*. Many philosophers argue that folk intuitions are irrelevant to normative questions (the is-ought gap). By designing a study to "settle" the philosophical verdict via polling, you are assuming the very premise (Intuition Driven Philosophy) that the existence of cultural variation is supposed to challenge.

  **The Fix:** Reframe the goal. You are not testing *which philosophical theory is true*. You are mapping the **folk conceptual boundaries**. Your conclusion shouldn't be "Philosophers must update," but rather "The folk concept X is stable/unstable across populations, which constrains theories that rely on X being a natural kind."

  ### 2. The Weighting Question
  You asked if weighting is the right question. **It is not.** It is a statistical solution to a normative problem.

  *   **Weighting by Population:** Implies philosophical truth is democratic. (Why does the verdict of a billion people outweigh the verdict of a trained logician, or vice versa?)
  *   **Weighting by Language:** Implies linguistic determinism (one language = one conceptual scheme).
  *   **Weighting Equally:** Implies all cultures are independent data points (they aren't; they share history/trade/colonialism).

  **The Fix:** Do not aggregate to a "global verdict." Report the variation. If you must aggregate, do it descriptively (e.g., "weighted by internet penetration") but explicitly state in the preregistration that **no weighting scheme yields a normative philosophical truth.** The "global majority" is a descriptive statistic, not a truth condition.

  ### 3. The "Debiasing Preamble"
  You want to strip cultural framing (names, honorifics) to measure the "intuition itself."

  **The Problem:** This assumes there is a "view from nowhere." Cognitive science suggests that context *is* how humans process meaning. Stripping names and honorifics doesn't reveal the "pure" intuition; it creates an **artificially abstract context** that may be uniquely WEIRD (Western, Educated, Industrialized, Rich, Democratic).
  *   In many cultures, agency and knowledge are inherently relational. Removing the social markers might make the vignette *incoherent* to a non-WEIRD participant, forcing them to guess or disengage.
  *   You aren't removing cultural overlay; you are replacing a *local* cultural overlay with an *academic/analytic* cultural overlay.

  **The Fix:** Acknowledge this limitation. Don't claim you are measuring "pure intuition." Claim you are measuring "intuition under conditions of maximal semantic abstraction." Consider keeping one version with cultural markers and one without as a pilot, if possible, to see if the "debiasing" actually changes the variance.

  ### 4. Variation and Conclusions (Relativism vs. Competence)
  You asked what to conclude if variation shows up. You suggested "knowledge is culturally relative."

  **The Problem:** This is the "Competence vs. Performance" error.
  *   **Variation could mean:** The underlying concept is different (Relativism).
  *   **Variation could mean:** The translation failed to capture the pragmatic force (Noise).
  *   **Variation could mean:** The vignette triggers different pragmatic implicatures in different languages (Pragmatics).

  If you find variation, you cannot jump straight to "Relativism." You have to rule out that you aren't just measuring different interpretations of the question.

  **The Fix:** In your preregistration, specify that variation implies **instability in the folk concept as a candidate for a universal natural kind.** Avoid strong metaphysical claims about "truth being relative." Stick to cognitive claims: "The cognitive processing of Case X is sensitive to Cultural Variable Y."

  ### 5. The Control Condition
  You have budget for one between-subjects control. You proposed a non-philosophical item known to vary (risk/trust).

  **Is this the right control?**
  **Yes, but specifically as a "Positive Control."**
  *   **Logic:** If you find variation in the philosophical cases, critics will say "Your translation is bad" or "Your online sample is noisy."
  *   **Utility:** If you *also* find variation in the Risk/Trust item (which we know varies), it validates that your **methodology is sensitive enough to detect cultural differences.**
  *   **Caveat:** If you find *no* variation in Risk/Trust, your study is broken (either the samples aren't actually culturally distinct, or your measures are insensitive). If you find variation in Risk but *not* in Gettier, that is a massive finding (philosophical concepts are more universal than economic preferences).

  **Alternative:** A "Comprehension Control" where there is an objectively correct answer based on the text (e.g., "Did the protagonist enter the room?") might be better for ruling out random responding, but the Risk/Trust item is better for ruling out "cultural differences are just noise." **Stick with Risk/Trust, but label it a "Positive Control for Cultural Sensitivity."**

  ### Summary Advice for the Preregistration

  To get your supervisor off your back and answer your flatmate:

  1.  **Drop the "Verdict" Language:** Do not promise to tell philosophers what the "correct" view is. Promise to map the **distribution of folk commitments**.
  2.  **Address the "Unfalsifiable" Charge:** Your flatmate is right that "If Variation -> Relativism, If No Variation -> Universalism" is a "heads I win, tails you lose" structure. To fix this, make a **risky prediction**. For example: "We predict that Side-Effect cases will show higher variance than Trolley cases because Side-Effect cases rely more on pragmatic implicature which is language-sensitive." Now you can be wrong.
  3.  **Reframe the Weighting:** State clearly that weighting is for descriptive representation, not normative authority.
  4.  **Qualify the Debiasing:** Acknowledge that "neutral" language is a specific register, not a null state.
  5.  **Use the Control:** Use the Risk/Trust item as a positive control to demonstrate that your cross-cultural design *can* detect differences when they are known to exist.

  **The sentence your supervisor wants you to write:**
  *"This study does not assume that folk intuitions constitute normative evidence; rather, it tests the hypothesis that the cognitive mechanisms underlying these intuitions are universally shared or culturally constructed."*

  If you write that, your supervisor will likely sign off, because it shifts the project from "fixing philosophy by polling" (which is conceptually fraught) to "investigating the cognitive architecture of philosophical judgment" (which is solid CogSci).
