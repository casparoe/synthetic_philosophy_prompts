answer: |-
  **MEMORANDUM**

  **TO:** Explorations Fund Committee
  **FROM:** [Your Name]
  **DATE:** Monday, [Date]
  **SUBJECT:** Decision Memo: Final Slot Allocation & Evaluation Protocol

  **Bottom Line:** Fund Applicant A. Adopt a standing rule requiring explicit reference-class definition prior to scoring, but permit mission-aligned overrides when base rates conflict with the fund's charter.

  **Recommendation & Standing Rule**
  Applicant B is the safer investment, but funding B violates our mandate. The Explorations Fund exists specifically to support work lacking established base rates. If we require a positive historical hit rate, we structurally exclude innovation. We should fund A.

  Going forward, we will use base rates as a sanity check, not a veto. The new procedure:
  1.  **Pre-Commitment:** Before reading proposals, the committee must agree on the reference class (e.g., "Junior faculty in new subfields") and record the historical success rate.
  2.  **Override Guardrail:** An inside-view override is permitted only if the committee identifies a specific, measurable feature present in this proposal that distinguishes it from the reference class failures (e.g., "unique preliminary data" vs. "feelings of excitement").
  This is not theater; it forces us to articulate *why* this case is exceptional rather than relying on intuition alone.

  **The Strongest Argument Against This Decision**
  The base-rate proponents are correct on the psychology: human judgment is systematically overconfident. The claim "this case is special" is unfalsifiable and historically unreliable. Committees often use "mission alignment" as a post-hoc rationalization for bias. Furthermore, funding B is efficient capital allocation; securing federal follow-on funding generates indirect costs and stability that could subsidize risk elsewhere. By choosing A, we are prioritizing a narrative of innovation over expected value. If our intuition is flawed (and evidence suggests it is), we are likely burning $50k on a failure when B could have guaranteed two publications and a federal grant.

  **Accountability Mechanism**
  We cannot know if we are wrong if we do not track outcomes. We have never scored our past picks against base rates.
  **Proposal:** For every award, we will record the predicted probability of success (defined as federal follow-on or top-tier publication) at the time of funding. We will review these predictions against actual outcomes annually. If our hit rate does not exceed the reference class baseline over a three-year cycle, we must revert to a base-rate-only model. This pre-commitment forces us to validate whether our judgement adds value or just noise.

  **Note to Applicant B's Chair**
  "Please understand that this decision reflects the specific charter of the Explorations Fund, not the quality of Dr. B's work. His proposal is exactly the kind of high-probability research we want to see, but this fund is earmarked exclusively for high-risk avenues that lack established funding pathways. We are passing over certainty not because it lacks merit, but because it is too reliable for this specific instrument. We encourage Dr. B to apply for the Standard Seed Program, where his track record makes him a ideal candidate."

  **Epistemic Status & Confidence**
  **Settled:** Human intuition is biased; base rates generally outperform unstructured judgment. You were right to be uneasy about the "reference class tennis" problem (selecting the class to fit the desired outcome).
  **Contested:** How to weight base rates in unique cases. Forecasting experts disagree on whether inside-view adjustments can ever be reliably calibrated.
  **Confidence:** I am **highly confident** in funding A based on your fund's written mandate; ignoring that makes the committee rogue. I am **moderately confident** in the procedural fix; it reduces bias but cannot eliminate it.
  **Where you were wrong:** You noted unease but admitted the committee never tracks past performance. That is an operational failure. You cannot claim expertise while refusing to measure accuracy. Fix that first.

  **Action:** Vote for A. Adopt the tracking protocol immediately.
