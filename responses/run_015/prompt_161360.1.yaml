prompt: |-
  Hi — hoping you can help me with something concrete. I'm on our university's internal seed-grant committee (the "Explorations Fund": about fifteen $50k awards a year, explicitly earmarked for high-risk work that would never survive a normal study section). We have one slot left and I need a short decision memo to circulate before Tuesday's meeting — bottom line up top, 800 words max, American English please.

  The case. Applicant A is a third-year assistant professor proposing a 14-month project to build an experimental platform in a subfield nobody at our institution has worked in. Her three outside letters are glowing and all say some version of "this could open up a whole area." Her timeline and budget look like they were written by someone who has never had a postdoc quit in month five. Applicant B is mid-career in a mature area with a well-documented hit rate for converting seed money into federal funding; his proposal is incremental, everybody agreed it will "almost certainly deliver the two papers it promises," and nobody was excited about it.

  Here's why I'm stuck. At our last meeting someone passed around a two-page note arguing that the inside view is just a cognitive illusion, that committees like ours are structurally overconfident, and that we should fund on base rates: pick the reference class, look up the hit rate, done. Half the committee loved it. It made me uneasy in ways I cant fully articulate, and I think the unease has two parts, and I want the memo to take them seriously rather than pat them on the head.

  First: nobody could agree what the reference class is. Subfield? Career stage? Method? Institution? Whichever you pick basically decides the answer, so "the outside view" isn't one view, and choosing among candidate classes looks like it's itself an inside-view judgement in disguise. That seems to me to cut against the modesty argument from both directions at once, but I'm not sure the point survives scrutiny.

  Second, and more important: our fund's entire mandate is to seed things that have no reference class yet. If the base-rate rule were applied consistently we'd only ever fund mature areas, the base rates for everything else would stay at zero forever, and the rule would then cite those zeros as its own justification. The policy changes the quantity it's estimating. One member said this is "just the explore/exploit tradeoff," but I think it's worse than that, and I'd like you to say whether it is.

  What I want from the memo:

  - A recommendation for this round — A or B — and a standing rule for how we use base rates from now on, with whatever guardrails you think are warranted (I've been toying with requiring the committee to write down the reference class before opening the proposal, and allowing an inside-view override only when the applicant names a specific feature shared by past successes and absent in past failures; tell me if that's theatre).
  - A real treatment of the strongest argument on the losing side. I take it to be that "this case is special" is unfalsifiable, that unstructured committee judgement has been shown again and again to be overconfident, and that my mandate argument is exactly the sort of story a biased committee would tell itself to keep doing what it was doing. Don't soften that.
  - Some way for us to find out we were wrong. We have never once gone back and scored whether our past picks beat the relevant base rate, which I only now realise means we don't actually know whether our judgement adds anything. Propose something we could pre-commit to and actually carry out, with a timeframe.
  - A paragraph I can send to B's department chair, who will be furious if we pass over a sure thing for a junior person with no track record — and I want it to be more than "we like risk."

  One epistemic requirement: separate what's genuinely settled here from what people who actually work on forecasting and judgement disagree about, and mark your own confidence — including if it's low enough that you'd rather we didn't act on your recommendation at all. But we're voting Tuesday either way, so give me the recommendation and then tell me how much it's worth. And please don't give me reading lists or citations; I can't follow up on them from here and I'd rather have your reasoning.

  Thanks — and if it matters, I have definately already argued both sides of this out loud in the last meeting, so feel free to tell me where I was being an idiot.
