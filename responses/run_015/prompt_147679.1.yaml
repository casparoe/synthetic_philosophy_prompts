      *Actually, re-reading the setup:* "final artifact can be checked -- say a cost model... with a checker that confirms the bottom-line figure." BUT "real-world feedback arrives weeks later and is confounded."
      *Correction:* There are *two* outcome signals. 1. The Checker (immediate, formal). 2. Real World (delayed, noisy).
