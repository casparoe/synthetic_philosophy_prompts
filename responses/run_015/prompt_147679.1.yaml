      *   **Move 7 (Dev): The "Smuggling" Critique.**
          *   *Claim:* Annealing is smuggling. If process term goes away, policy reverts to outcome optimization. You get a model that reasons well only when watched (during training).
          *   *Validity:* This is a crucial RL point. If the reward function changes at deployment, the policy optimizes for the *deployment* reward. If process reward is removed, the model stops caring about process.
          *   *Weakness:* Assumes the *capabilities* learned during process phase don't transfer. (Maybe it *learned* to reason, not just pretend?).
          *   *Engagement:* Hits the weakest point of Mara's compromise hard.

      *   **Move 8 (Mara): Intuition over Metrics.**
          *   *Claim:* Worst cases feel different (Optimized Number vs. Imitated Argument).
          *   *Validity:* Acknowledges the deadlock. Appeals to risk profile.
          *   *Weakness:* "Feels different" isn't a technical argument.
