          *   *Engagement:* Counters Mara's "fix the checker" implication by saying the *nature* of verification limits novelty.

      *   **Move 6 (Mara): Engineering & Compromise (Curriculum).**
          *   *Claim:* Incompleteness is engineering (fix the checker). Compromise: Process shaping early, anneal to outcome later.
          *   *Validity:* Curriculum learning is standard practice.
          *   *Weakness:* "Fix the checker" dodges the theoretical limit (Godel/undecidability or just cost). Annealing is the specific point Dev attacks next.
