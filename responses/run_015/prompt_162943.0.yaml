  ### The Allocation Sidebar: How You Decide Who Gets Help

  **The Scale**
  To make these choices concrete, imagine every person has a **Life Score** from 0 to 100.
  *   **0–20:** Destitute, dying, or in misery.
  *   **50:** A decent, normal life.
  *   **80–100:** Thriving, wealthy, or perfectly healthy.
  *   **A "Gain"** adds points to this score. A gain of 5 is a nice holiday; a gain of 40 is a life-saving surgery.

  ---

  #### The Decision Tree

  **Node 1: The Crowd vs. The Individual**
  A clinic has resources for either:
  *   **A)** 100 people at Score 50 each get +5 points (a nice improvement).
  *   **B)** 1 person at Score 10 gets +40 points (a life-saving rescue).
  *   *Choose A or B.*

  **Node 2: The Comfortable Claim**
  Two patients are both comfortably above the "decent" line. One is at Score 70, the other at 75. You have enough for one to gain +5 points.
  *   **A)** Help the person at 70 (they are slightly worse off).
  *   **B)** It doesn't matter; flip a coin (they are both doing well enough).
  *   *Choose A or B.*

  **Node 3: The Swarm**
  A disaster relief agency can either:
  *   **A)** Give 1,000 people at Score 50 a +1 point gain (a trivial benefit).
  *   **B)** Save 1 person at Score 5 from dying (a +45 point gain).
  *   *Choose A or B.*

  **Node 4: The Neighborhood**
  A patient is at Score 20 (badly off).
  *   **Scenario X:** Everyone else in their town is at Score 90.
  *   **Scenario Y:** Everyone else in their town is at Score 25.
  *   The medical need is identical. Is the claim for help more urgent in Scenario X because the gap is larger?
  *   **A)** Yes, the gap makes it more urgent.
  *   **B)** No, only their absolute score matters.
  *   *Choose A or B.*

  **Node 5: The Coin Flip**
  Two children are equally sick (Score 10). You have one dose of a cure.
  *   **A)** Split the dose: Both get a certain +30 points (Score 40).
  *   **B)** Flip a coin: One gets the full dose (+90 points, Score 100), the other gets nothing (Score 10).
  *   *Choose A or B.*

  **Node 6: The Past**
  Two people are equally badly off now (Score 10).
  *   **Person A:** Had a great life until last year (Lifetime average 80).
  *   **Person B:** Has always had a hard life (Lifetime average 10).
  *   You can fully restore only one to Score 50.
  *   **A)** Help Person B (they have suffered more overall).
  *   **B)** Help Person A (or flip a coin; only their current need matters).
  *   *Choose A or B.*

  **Node 7: The Pain**
  You can fund one of two projects:
  *   **A)** End the torture of 1 person (moves them from Score 5 to 30).
  *   **B)** Fund a festival for 1,000 people (moves them from Score 60 to 70).
  *   *Choose A or B.*

  ---

  #### Routing Table: Where You Landed

  *Find the pattern of your choices below to identify your position.*

  | If you chose... | You land on... |
  | :--- | :--- |
  | **1A** (Crowd) | **The Unweighted Sum** |
  | **1B** (Individual) + **2B** (Coin) + **3A** (Swarm) | **The Threshold View** |
  | **1B** (Individual) + **2A** (Worse-Off) + **3B** (Save One) + **4B** (Absolute) | **The Absolute Weighting View** |
  | **1B** (Individual) + **2A** (Worse-Off) + **3B** (Save One) + **4A** (Gap) | **The Comparative Gap View** |
  | **1B** (Individual) + **3B** (Save One) + **4B** (Absolute) + **5A** (Split Dose) | **The Prospects View** |
  | **1B** (Individual) + **3B** (Save One) + **6A** (Lifetime) | **The Lifetime View** |
  | **1B** (Individual) + **3B** (Save One) + **7A** (End Torture) | **The Suffering-Weighted View** |
  | **1B** (Individual) + **2A** + **3B** + **4B** + **5B** (Coin) | **The Outcome-Weighted View** |
  | **1B** (Individual) + **3B** (Save One) + **2A** + **4B** + **5A** + **6B** + **7B** | **The Strict Bottom View** |
  | *Mixed/Inconsistent* | **The Pluralist View** |

  ---

  #### Glossary of Leaves

  1.  **The Unweighted Sum:** Claims we should simply add up all the benefits and choose the largest total.
      *   *Awkward Commitment:* Must endorse letting one person die if it provides trivial benefits to enough others.
  2.  **The Threshold View:** Claims helping matters most only until people reach a "decent" level; after that, claims equalize.
      *   *Awkward Commitment:* Must treat a person just below the line as vastly more important than someone just above it, even if the difference is tiny.
  3.  **The Absolute Weighting View:** Claims gains count for more the worse off the recipient is in absolute terms, regardless of others.
      *   *Awkward Commitment:* Must accept helping a person in isolation even if it increases inequality relative to others nearby.
  4.  **The Comparative Gap View:** Claims what matters is reducing the distance between the best-off and worst-off.
      *   *Awkward Commitment:* Must accept "Leveling Down"—making the rich poorer even if it helps no one—just to shrink the gap.
  5.  **The Prospects View:** Claims we should weight the fairness of people's *chances* before the outcome is known.
      *   *Awkward Commitment:* Must prefer giving everyone a small certain gain over giving one person a chance at a full cure, even if the cure is highly valuable.
  6.  **The Lifetime View:** Claims a person's claim depends on how well their life has gone as a whole, not just their current state.
      *   *Awkward Commitment:* Must prioritize a currently healthy person who had a hard childhood over a currently sick person who had a good childhood.
  7.  **The Suffering-Weighted View:** Claims relieving misery counts for more than creating happiness, point-for-point.
      *   *Awkward Commitment:* Might endorse preventing a minor pain for one person over creating a great joy for many.
  8.  **The Outcome-Weighted View:** Claims we should weight the final result, accepting risk if the weighted value of the best outcome is high enough.
      *   *Awkward Commitment:* Must endorse flipping a coin for a cure rather than guaranteeing partial health for all.
  9.  **The Strict Bottom View:** Claims only the person at the very bottom matters; no number of gains for others can outweigh their need.
      *   *Awkward Commitment:* Must let a million people suffer minor losses rather than impose one tiny loss on the worst-off person.
  10. **The Pluralist View:** Claims different values (total, priority, fairness) apply in different contexts without a single rule.
      *   *Awkward Commitment:* Cannot offer a clear decision when values conflict, relying on intuition instead of principle.

  ---

  #### Analysis: Combinations and Limits

  **Incoherent or Unattractive Combinations**
  The tree permits combinations that few philosophers defend. For example, choosing **1A** (The Crowd/Total) but **7A** (End Torture/Suffering) suggests you generally count numbers, except when pain is involved. This looks **unexplored** rather than incoherent; it resembles a "Negative Utilitarianism" that hasn't fully integrated aggregation rules. Conversely, choosing **2A** (Priority for the comfortable) but **3A** (The Swarm/Total) is **incoherent**; it claims the worse-off matter more when stakes are low, but numbers matter more when stakes are high, without a principled reason for the switch.

  **Indistinguishable Leaves**
  This tree cannot cleanly separate **The Prospects View** from **The Strict Bottom View** in all cases. Both might choose the "Split Dose" option in Node 5, but for different reasons (one cares about fair chances, the other about ensuring the bottom doesn't stay at zero). Distinguishing them requires asking whether you would accept a lottery if the "loser" of the coin flip was guaranteed a safety net—a nuance too fine for a seven-step sidebar. Additionally, **The Absolute Weighting View** and **The Lifetime View** may produce identical answers if the person who is absolutely worst off is also the one who has been worst off over time; the tree assumes these come apart in Node 6, but in reality, they often correlate.

  ---

  #### Closing: The Leveling Down Objection

  Only one leaf on this list is forced to endorse a change that leaves nobody better off and somebody worse off purely for the sake of the pattern: **The Comparative Gap View**. Because this position defines success as narrowing the distance between rich and poor, it logically implies that if you cannot raise the poor, you should lower the rich to meet them. Every other leaf escapes this result by their own construction: **The Unweighted Sum** rejects it because total welfare drops; **The Absolute Weighting** and **Threshold** views reject it because no individual gains; and **The Prospects** and **Lifetime** views reject it because it harms someone's life story without improving anyone else's. The Comparative view stands alone in valuing the pattern of distribution over the content of the lives within it.

  ---

  #### Calibration Notes

  *   **Node 1 (Crowd vs. Individual):** *Confidence: High.* This is the standard introduction to aggregation. It reliably separates Utilitarians from Priority views.
  *   **Node 2 (Threshold):** *Confidence: Medium.* Readers may choose "Coin" simply because the difference (70 vs 75) feels negligible, not because they endorse a philosophical threshold.
  *   **Node 3 (Swarm):** *Confidence: High.* Increasing the numbers to 1,000 forces a break between Moderate Prioritarians and Maximin/Strict Bottom views.
  *   **Node 4 (Neighborhood):** *Confidence: Medium-High.* This tracks the Absolute vs. Relative distinction well, though some readers may conflate "envy" with "urgency."
  *   **Node 5 (Coin Flip):** *Confidence: Low (Least Sure).* This step is the weakest link. Distinguishing *Ex Ante* (prospects) from *Ex Post* (outcomes) views with a single vignette is notoriously difficult in technical literature (the "Otsuka-Voorhoeve" problem). A reader might choose the Split Dose simply because they dislike gambling, not because they weight prospects. *Settling this would require a follow-up asking if the coin flip is permissible if the "loser" is compensated later.*
  *   **Node 6 (Past):** *Confidence: Medium.* Depends on the reader accepting "Lifetime Score" as a meaningful metric, which some snapshot-focused readers may reject outright.
  *   **Node 7 (Pain):** *Confidence: High.* The asymmetry between pain and pleasure is a robust intuition pump for Negative Utilitarianism.
  *   **Contested Reading:** The **Comparative Gap View** leaf is described here as "Telic Egalitarianism." Some egalitarians argue equality is only valuable instrumentally (Deontic Egalitarianism) and would reject the "Leveling Down" commitment in the Closing Paragraph. The tree groups them together for simplicity.
  *   **Weighting Fall-off:** The tree assumes a monotonic weighting (worse off = more weight). It does not test for views where priority peaks at a certain point and then declines, which would require a more complex scale.
