answer: |-
  A luxury exotic car rental firm levies a $5,000 "cosmetic penalty" only if a scratch is determinately "visible under standard showroom lighting," explicitly waiving the fee if the visibility claim lacks a classical truth value. Consider a sorites series of returned vehicles: Car 1 has a mirror finish (clearly invisible), Car 10 has a deep gouge (clearly visible), and Car 5 possesses a hairline fracture in the clear coat that catches the light only at specific angles. While Car 4 is universally agreed to be a borderline case where visibility is uncertain, Car 5 presents a fracture slightly more distinct than Car 4, yet inspectors cannot agree whether this distinctness pushes it into the "visible" category or merely makes it a "clearer borderline case," creating a zone where the classification of the uncertainty itself is unstable. The contract specifies the penalty applies strictly if the proposition "the scratch is visible" is true, meaning any semantic indeterminacy—whether first-order uncertainty about the scratch or second-order uncertainty about the classification of that uncertainty—results in a waived fee, forcing the adjudicator to distinguish between a fact that is merely hard to see and a fact that lacks a truth value.

  **Philosophical Walkthrough**

  The **epistemicist** argues that there is a sharp boundary between visible and invisible scratches, and consequently a sharp boundary between visible and borderline scratches; our inability to locate Car 5 precisely is merely ignorance, not semantic indeterminacy. For them, the scratch either triggers the penalty or it does not, and the "second-order" haze is just a reflection of our limited access to the fact, not a feature of the predicate itself. The **supervaluationist** claims the statement is supertrue only if it is true on all admissible precisifications of "visible." Here lies the awkwardness: precisifications are classical and sharp, so the set of admissible precisifications must have a sharp boundary to avoid regress. If the set of admissible precisifications is sharply defined, then it is determinately true whether a case is borderline, eliminating second-order vagueness; to preserve second-order vagueness, the supervaluationist must admit vagueness about which precisifications are admissible, risking an infinite hierarchy of meta-precisifications. The **contextualist** suggests that the extension of "visible" shifts based on the conversational context (e.g., the strictness of the inspection); second-order vagueness arises when the context itself is unstable, making it unclear which standard of precision applies to determine if the first-order standard is met.

  **Analysis**

  The feature doing the work is the **contractual requirement for determinate truth** rather than non-falsity; this creates a financial cliff edge between "true" and "gap." If you remove this constraint and allow payout for any claim that is "not false" (including borderlines), the second-order vagueness becomes financially irrelevant because both first-order and second-order borderlines would waive the fee equally. An **epistemicist** would attack the setup by denying the coherence of the truth-value gap itself, arguing that the contract's condition "is true" is satisfied whenever the scratch physically meets the hidden sharp cutoff, regardless of whether inspectors can agree on the classification of that classification.
