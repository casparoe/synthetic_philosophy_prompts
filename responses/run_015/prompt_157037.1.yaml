answer: |-
  **Bottom line**
  My credence that strict epiphenomenalism, as defined, is true is 0.18.

  **Decomposition**
  Causal closure (0.85): Physical physics shows no verified gaps in neural contexts, making interactionism empirically costly. Constraint: If this drops below 0.5, epiphenomenalism loses its primary motivation, as interaction becomes viable.

  No leftover causation (0.55): Supervenience without identity triggers exclusion; compatibilist causation often looks like semantic cheating to realists. Constraint: This is the gatekeeper; if high, closure forces epiphenomenalism given non-identity, driving the total up.

  Paradox unreliability (0.30): Without a causal link, true belief is accidental; evolutionary selection cannot track truth directly without causal efficacy. Constraint: Low credence here boosts the paradox's force significantly, acting as a multiplier against the view's viability.

  Par brute correlation (0.50): Lawlike psychophysical bridges are metaphysically costly but logically possible; cost is explanatory depth, not truth. Constraint: Accepting this neutralizes the unreliability objection but incurs a theoretical penalty that lowers overall prior probability.

  Par bootstrapping (0.40): If introspection is uncaused, the theory undermining itself is recursive; yet the theory explains the error systematically. Constraint: High credence here makes the view self-defeating regardless of physics, capping the maximum possible credence.

  Propagation discount (0.65): Warrant is internal; if the physical story explains the belief formation, external causation matters less for justification. Constraint: Low credence here amplifies the paradox objections into a fatal objection, collapsing the total toward zero.

  **How they combine**
  These terms function as a noisy AND-gate rather than a strict product. Closure and No leftover causation establish the metaphysical possibility; if either fails, the view dies. The Paradox terms act as penalty multipliers on the resulting probability. Even if the physics allows epiphenomenalism (Closure × No leftover), the epistemic costs (Paradox terms) discount the final credence heavily. The Propagation discount offers a partial recovery, allowing the view to remain coherent even if unreliable, but not enough to make it probable. The final 0.18 reflects a viable but costly metaphysical niche.

  **Sensitivity**
  The single term my bottom line is most sensitive to is No leftover causation. Shifting this from 0.55 to 0.75 moves the total most because it is the gatekeeper between physicalism and epiphenomenalism. If compatibilist causation is respectable, closure no longer forces inertia, and the view collapses into standard physicalism. The Paradox terms matter less because one can always bite the bullet on reliability; but if causation is restored, there is no bullet to bite.

  **The dead-end readout and demonstrative fixity**
  The dead-end readout makes epiphenomenalism empirically clearer but not metaphysically easier. It solves the report causation (N causes speech) but highlights the brute N-Experience link. It increases credence in Closure but decreases credence in No leftover causation because the correlation becomes glaring yet empty. Net effect: The paradox bite remains because the link is still unexplained, so the effects do not cancel; credibility stays flat.

  Demonstrative fixity offers a real reply but changes the ontology. Conditional on epiphenomenalism, the probability that non-causal tracking carries warrant is 0.35. It requires a metaphysics where experience is intrinsic to the physical base, edging toward Russellian monism. It solves the paradox by changing the epistemology, not the physics, but strict epiphenomenalism morphs into something else to accommodate it.

  **Where the disagreement probably lives**
  You suspect the gap is the Paradox answer (brute correlation ok?). I suspect the real fault line is Term 2 (No respectable causation). If you are at 0.55, you likely think supervenience *is* enough for causation (compatibilism), whereas Sam sees it as exclusion. The Paradox is secondary; if causation is saved, the paradox dissolves because judgments are caused by experiences via the physical base. Sam's 0.12 suggests he accepts Closure + Exclusion; your 0.55 suggests you reject Exclusion or doubt Closure. Closure was never the load-bearing premise; it was the exclusion argument.

  **Settled vs contested**
  Causal closure is standard physicalist dogma but contested by libertarians and quantum mind theorists; it is not settled fact. The Paradox is a live wire (Frankish vs. Chalmers); no consensus exists on whether brute correlations are acceptable costs. Most working physicalists reject epiphenomenalism via identity or functionalism, not by denying closure. The "cheating" charge is often a verbal dispute over causation definitions. Literature is split on whether warrant requires causation; epistemologists disagree on internalism vs externalism here. You are guessing on the consensus; there isn't one.
