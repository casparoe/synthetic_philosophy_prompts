answer: |-
  **METAPHYSICS SEMINAR: FINAL EXAMINATION**

  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 1000 words
  **Total Marks:** 20

  **Question 1**

  Consider the following case (**The Handover Case**):

  A turbine blade is made of a ceramic in microstructural phase $\alpha$. In phase $\alpha$, the ceramic is fragile: it shatters under hard impact. The blade's fragility is grounded in this $\alpha$-microstructure. Permanently fitted to the blade is an intrinsic monitoring device. This device detects an incoming hard impact a microsecond before contact and instantly reorganises the surface layer of the ceramic into phase $\beta$. Phase $\beta$ is distinct from phase $\alpha$, but it is also, quite independently, a shatter-under-impact structure (blades made entirely of $\beta$ shatter just as readily as $\alpha$ ones).

  At time $t_0$, the blade is in phase $\alpha$. Assume the blade is correctly classified as **fragile** at $t_0$. At $t_1$, an impact occurs. The device activates, switching the structure to $\beta$. At $t_2$, the blade shatters.

  Write an essay addressing the following four points:

  1.  **Classification:** Given that the simple conditional ("if struck, it would shatter") is true and the manifestation occurs, but the original categorical basis ($\alpha$) is lost before the stimulus, where does this case sit in relation to standard counterexamples (Finks, Masks, Antidotes)?
  2.  **The Retention Fix:** Apply the "retention of causal basis" repair to this case. Does this repair yield the correct verdict on whether the blade is fragile at $t_0$? Explain why the intrinsic nature of the device is crucial here.
  3.  **The Disjunction Trap:** A proponent of the repair might try to save the theory by claiming the relevant basis is the disjunction "being $\alpha$ or being $\beta$." Explain why this move is theoretically costly or problematic.
  4.  **The Repair and Cost:** Propose a principled restriction on what counts as a causal basis that solves the problem without falling into the trap. Take a stand on whether this restriction is acceptable and explicitly state the metaphysical cost of adopting it.

  ***

  ### MODEL ANSWER

  The Handover Case presents a specific challenge to dispositional analyses that standard Fink cases do not. In a standard Fink case, the disposition is present, but the conditional is false because the basis is removed before the stimulus. Here, the conditional is true, the manifestation occurs, yet the specific basis ($\alpha$) grounding the disposition at $t_0$ is removed before the stimulus. This makes it a **Finkish Basis** case, but one where the "fink" (the device) swaps the original basis for a *sufficient* substitute rather than removing the power entirely.

  Applying the **retention of causal basis** repair reveals a tension. This repair modifies the conditional analysis to require that the object retain the categorical basis that grounds the disposition throughout the stimulus. In the Handover Case, the blade does *not* retain the $\alpha$-microstructure; it switches to $\beta$. Therefore, the retention fix implies the conditional relevant to the disposition is false, and thus the blade is *not* fragile at $t_0$. This is the wrong verdict. We assumed the blade is fragile at $t_0$, and it behaves exactly as a fragile thing should. The intrinsic nature of the device is crucial because it prevents us from dismissing the switch as an external interference (like a Mask or Antidote). Since the device is part of the object, the change in basis is an internal change, forcing us to confront whether the identity of the disposition depends on the identity of its base.

  To save the retention fix, one might argue that the relevant causal basis is not simply "being $\alpha$" but the disjunctive property "**being $\alpha$ or being $\beta$ (if switched by the device).**" Since the blade possesses this disjunctive property at $t_0$ and retains it through $t_1$ (switching from the first disjunct to the second), the retention condition is met, and the verdict "fragile" is preserved. However, this is a **theoretical trap**. Allowing disjunctive, gerrymandered properties to serve as causal bases trivialises the analysis. If any disjunction counts, we can construct a "basis" for any object to have any disposition simply by including the outcome in the disjunction. This severs the explanatory link between the categorical base and the manifestation; the base no longer explains *why* the object manifests, only that it is one of the things that does.

  To avoid this trap while securing the right verdict, we must restrict admissible causal bases to **natural properties** (or sparse properties), excluding disjunctive or gerrymandered constructions. However, $\alpha$ and $\beta$ are distinct natural properties. If we strictly require the *same* natural property to be retained, the retention fix still fails. Therefore, we must refine the view: dispositions are individuated not by the specific natural property instance, but by the **functional role** grounded in *a* natural property of the appropriate kind. Alternatively, and more robustly, we must accept that the disposition is grounded in a higher-order natural property shared by $\alpha$ and $\beta$ (e.g., "having a crystalline lattice with bond strength $< n$").

  I take the stand that the only viable repair is to restrict bases to **non-disjunctive natural properties**. In this case, we must argue that $\alpha$ and $\beta$ share a deeper, unified natural property that is retained, or admit that the disposition is lost and a new, numerically distinct disposition is gained at $t_1$ (which is counterintuitive). The former is preferable. We should claim there is a unified natural property (e.g., specific bond instability) realized by both phases.

  The **metaphysical cost** of this repair is significant. It commits us to a robust realism about natural properties and structural universals. We cannot simply treat bases as any set of physical conditions; we must believe nature carves the world into specific joints that ground powers. If no unified natural property exists shared by $\alpha$ and $\beta$, we must accept that the blade loses its fragility at $t_1$ and instantly gains a duplicate fragility. While metaphysically clean, this costs us the intuitive continuity of the object's powers. We sacrifice the simplicity of the conditional analysis for a heavier metaphysical ontology of properties.

  ***

  ### MARKING SCHEME

  **Total Marks:** 20
  **Pass Mark:** 10

  **Five Must-Hit Points:**

  1.  **Correct Classification (4 Marks)**
      *   **Requirement:** Identifies the case as Finkish in structure (basis removal) but notes the conditional remains true (unlike standard Finks).
      *   **Common Error:** Treating it as a Mask (external interference) or claiming it is a standard Fink where the conditional fails.
      *   **A vs. B:** A grades distinguish the "true conditional" aspect clearly; B grades may conflate it with standard Fink cases.

  2.  **Application of Retention Fix (4 Marks)**
      *   **Requirement:** Explains that the retention fix requires the *original* basis to persist. Since $\alpha$ is lost, the fix implies "not fragile." Notes that the device being intrinsic prevents ruling it out as external interference.
      *   **Common Error:** Claiming the fix works because the *device* persists, ignoring that the *microstructure* (the basis) changes.
      *   **A vs. B:** A grades explicitly link the intrinsic nature of the device to the failure of the "external interference" excuse.

  3.  **The Disjunction Trap (4 Marks)**
      *   **Requirement:** Explains that defining the basis as "$\alpha$ or $\beta$" saves the verdict but allows gerrymandered properties. This trivialises the explanation of powers.
      *   **Common Error:** Accepting the disjunction as a valid solution without critique, or failing to explain *why* disjunctions are bad (triviality).
      *   **A vs. B:** A grades articulate the loss of explanatory power; B grades simply state "disjunctions are not allowed."

  4.  **Principled Restriction (4 Marks)**
      *   **Requirement:** Proposes restricting bases to **natural properties** (or non-disjunctive properties). Suggests finding a shared natural property or accepting distinct dispositions.
      *   **Common Error:** Vague appeals to "similarity" without metaphysical grounding, or proposing a new conditional analysis instead of fixing the basis constraint.
      *   **A vs. B:** A grades propose the "natural property" constraint explicitly; B grades offer a less precise "same kind of structure" argument.

  5.  **The Metaphysical Cost (4 Marks)**
      *   **Requirement:** Explicitly states the cost (e.g., commitment to realism about natural properties, or loss of intuitive continuity of powers).
      *   **Common Error:** Claiming the solution is cost-free, or identifying a practical cost (e.g., "hard to measure") rather than a metaphysical one.
      *   **A vs. B:** A grades commit to a view and own the cost; B grades hedge or list costs without taking a stand.

  **Note on Loopholes:**
  Some candidates may argue that the blade is **not fragile at $t_0$** because the presence of the device makes the $\alpha$-structure unstable.
  *   **Credit this move ONLY IF:** They provide a metaphysical justification for why the device's presence negates the disposition at $t_0$ (e.g., arguing the basis is actually "unstable $\alpha$").
  *   **Penalise IF:** They use this merely to dodge the question. If they deny fragility at $t_0$, they must still address points 3 and 4 regarding how we *would* analyse it if we wanted to call it fragile. Maximum 10 marks if they take this route but fail to engage with the taxonomy/basis issues.

  **Differentiation (A vs. B):**
  *   **B Grade (10-14 marks):** Hits the basic taxonomy, applies the retention fix mechanically, identifies the disjunction problem, but waffles on the solution or the cost.
  *   **A Grade (15-20 marks):** Demonstrates clear understanding of *why* the retention fix fails here specifically. Articulates the disjunction trap in terms of explanatory power. Commits to the "Natural Property" constraint and clearly articulates the ontological commitment required to maintain it.
