prompt: |-
  Hi — I chair the "Beyond the Call" panel at a fairly big district general hospital, and I need something we can actually run. Every month we get 10-15 nominations from staff for colleagues who supposedly went above and beyond, we have 90 minutes, six people on the panel (two nurses, a doctor, an HR rep, a patient rep, and me — I'm in facilities), nobody has any philosophy training, and the nomination forms are two pages of narrative with almost never a clear statement of what the person's actual job description was or whether they were on duty. Decisions get read out at a staff event, they affect morale, the union watches them, and our comms lead has one hard rule: the citation has to praise the act without implying that everyone who didn't do it did something wrong. That last bit is the one we always screw up.

  What I want is a decision procedure, not an essay. Give me:

  1. The questions in the order we ask them, with what counts as a sufficient answer to each one.
  2. The gates where the answer is just "no award" and we stop.
  3. The gates where the procedure hands it to us as a values call that we have to make ourselves, flagged as such, because no amount of procedure settles it.
  4. What to do when we simply can't establish the facts (the form is vague, accounts disagree, the person's role is contested) — do we defer, default, or drop it.

  The distinctions it has to make, roughly: (a) the job done well, or a nice extra that's still just optional-but-ordinary; (b) genuinely beyond what was required of this person and praiseworthy; (c) actually required, i.e. the person was lucky not to be disciplined rather than heroic; (d) something admirable in spirit that we still shouldn't celebrate, because rewarding it signals the wrong thing — reckless self-risk, or papering over a staffing failure by turning it into a story about individual virtue.

  Hard cases it has to survive, because we've hit all of these:

  - The person's own mistake caused the emergency, and then they stayed fourteen hours fixing it. Is that heroism or just putting right what you broke?
  - What HR has started calling "quiet refusals": the act was an omission or a waiving — turning down a bonus so a junior could have it, giving up a promotion, taking their name off a paper they'd partly written. Costly, but is it the same shape as doing something?
  - The person profited afterwards: press coverage, a fundraiser, a promotion, a book deal. Does being rewarded retro-actively stop it from counting?
  - Mixed motives, off-duty acts, acts by people with no special role at all, and acts where the person was asked by a manager rather than volunteering.
  - The "they could have done it at trivial cost" end of things — you know the style of argument, that if you can prevent something terrible at almost no cost to yourself then it isn't optional at all. Some of our nominations look like that: huge benefit to someone else, tiny inconvenience to the agent. I want the procedure to tell us where that tips over from praiseworthy to required, and to be honest that it's drawing a line rather than finding one.
  - And the deep one: if the act really was optional, what are we praising, and if it really was the obviously best thing to do, why isn't skipping it blameworthy? I don't need this solved. I need the procedure to mark exactly where it stops being able to answer and just stipulates a convention so we can be consistent.

  Also: our HR director has started floating "second-order" nominations — not the person who did the thing, but the person who arranged things so other people could do it (a ward manager who quietly rewrote the rota so staff could sit with dying patients). I have no idea whether that belongs in the same category or breaks it. Deal with it or rule it out, but say which.

  Then run the whole thing on three real-ish nominations:

  - A night nurse who stayed six hours unpaid past the end of her shift to sit with a dying patient whose family were stuck on a motorway. The ward was two staff short and the manager had put out a general "stay if you can" message.
  - A senior pharmacist whose own dispensing error caused a patient's crisis, who then worked through the night to stabilise him and visited the family every day for a week.
  - A porter who donated a kidney to a colleague he'd known about three months. The story got picked up locally and raised a chunk of money for the hospital; the transplant team were visibly uneasy about the whole thing.

  We've more or less decided informally that the nurse is getting it, so if your procedure says no, say so plainly and tell us why. I also want a short closing section on what this procedure can't do — where it will misfire, what it can't rank or compare, and the cases where we should ignore it. Keep the language usable by people who've never thought about any of this; if you need a term of art, define it in a sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of the "Beyond the Call" panel at a district general hospital.
      *   **Context:** Monthly meetings, 10-15 nominations, 90 minutes, 6 panelists (mixed background, no philosophy training).
      *   **Input:** 2-page narrative forms (often vague on job description/duty status).
      *   **Output:** Public citations (affect morale, union watches, comms rule: praise act without implying others did wrong).
      *   **Goal:** A concrete *decision procedure* (questions, gates, flags, fact-handling), not an essay.
      *   **Key Distinctions Needed:**
          *   (a) Job done well / Optional-but-ordinary.
          *   (b) Genuinely beyond call / Praiseworthy.
          *   (c) Required / Lucky not to be disciplined.
          *   (d) Admireable spirit / Wrong signal (recklessness, covering systemic failure).
      *   **Hard Cases to Survive:** Self-caused error, "quiet refusals" (omissions/waivers), retro-active profit, mixed motives/off-duty/manager-asked, "trivial cost" vs. "required," the philosophical tension of optional vs. best.
      *   **Second-Order Nominations:** Enablers (e.g., managers fixing rotas).
      *   **Test Cases:** Night nurse (stay late, short-staffed), Senior Pharmacist (fixed own error), Porter (kidney donation).
      *   **Constraint:** The nurse case is informally decided as a "Yes." If the procedure says "No," explain why plainly.
      *   **Closing:** Limitations of the procedure.
      *   **Tone:** Usable, clear, defined terms, practical.

  2.  **Deconstruct the Problem:**

      *   *The Core Tension:* "Beyond the Call" implies supererogation (good to do, not wrong not to do). But in healthcare, "duty of care" is elastic. If everyone *should* do it, it's not beyond the call. If it covers a systemic gap, rewarding it normalizes the gap.
      *   *The Comms Rule:* "Praise without implying blame." This is tricky. If we say "X did Y," it implies Y is good. If Y is *required*, then not doing Y is bad. So, we need to frame Y as *exceptional* without making standard care look *negligent*.
      *   *Time Limit:* 90 mins for 10-15 cases = ~6-9 minutes per case. The procedure must be fast.
      *   *Panel:* Mixed expertise. Needs plain English.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   **Phase 1: Fact-Finding (The "What Happened" Gate).**
          *   Need to establish duty status and role. If we don't know what they *had* to do, we can't know what was *extra*.
          *   *Decision:* If facts are too vague, drop/defer. Don't guess.
      *   **Phase 2: The Duty Check (The "Required" Gate).**
          *   Was this actually part of the job? Did they cause the problem?
          *   *Decision:* If they caused the crisis -> No Award (Category C). If it was mandatory -> No Award (Category A).
      *   **Phase 3: The Signal Check (The "Systemic" Gate).**
          *   Does rewarding this hide a staffing failure? Is it reckless?
          *   *Decision:* If it signals "we expect you to work unpaid" or "risk yourself" -> No Award (Category D).
      *   **Phase 4: The Supererogation Check (The "Beyond" Gate).**
          *   Was there significant cost/effort? Was it voluntary?
          *   *Decision:* This is where the "Yes" lives.
      *   **Handling "Quiet Refusals" & "Second-Order":** Need specific sub-rules.
      *   **Handling Profit:** Does external reward negate internal reward? Usually no, but needs checking for double-dipping.

  4.  **Refining the Gates (Iterative Process):**

      *   *Critique:* The prompt asks for specific questions in order.
      *   *Revision:* Let's structure it as a Flowchart in text form.
      *   *Gate 1: Facts.* Can we verify duty/role? If No -> Defer/Drop.
      *   *Gate 2: Liability.* Did they break it? If Yes -> No Award.
      *   *Gate 3: Mandate.* Was it ordered/required? If Yes -> No Award (unless "Second-Order").
      *   *Gate 4: Systemic Harm.* Does this reward cover a gap? If Yes -> No Award (Category D).
      *   *Gate 5: Cost/Volition.* Was there sacrifice? If No -> "Job Well Done" (Category A).
      *   *Gate 6: The Values Call.* If it passes all above, it's a "Yes," but we must flag the specific value being praised.

  5.  **Addressing Specific Hard Cases:**

      *   *Self-Caused Error:* Gate 2 handles this. Fixing your mess is duty, not heroism.
      *   *Quiet Refusals:* Treat as "Costly Omission." Needs to pass Gate 5 (Sacrifice).
      *   *Retro Profit:* Doesn't disqualify, but check if the award is redundant.
      *   *Trivial Cost:* This is the "Required vs. Optional" line. The procedure needs to stipulate a threshold (e.g., "Significant Personal Cost").
      *   *Second-Order:* Allow it, but categorize separately ("Enabler Award" vs "Action Award") to avoid comparing apples/oranges.

  6.  **Developing the Test Cases:**

      *   *Nurse:* Stayed 6 hrs unpaid. Short-staffed. Manager asked generally.
          *   *Analysis:* Gate 3 (Mandate)? "General message" is coercive in short-staffed context. Gate 4 (Systemic)? Yes, covers staffing gap.
          *   *Conflict:* User says "We decided she gets it."
          *   *Resolution:* I must explain *why* the procedure might say No (systemic risk), but allow a "Values Call" override with a specific citation wording to mitigate the Comms rule. I need to be honest: The procedure flags this as dangerous, but if they do it, they must frame it carefully.
      *   *Pharmacist:* Caused error, fixed it.
          *   *Analysis:* Gate 2 (Liability). Clear No. Fixing own error is baseline competence.
      *   *Porter:* Kidney to colleague.
          *   *Analysis:* Gate 1 (Role)? Not in job description. Gate 4 (Systemic)? No. Gate 5 (Cost)? High.
          *   *Verdict:* Yes, but check "Profit" (fundraiser). Internal award still okay for morale, but acknowledge external recognition.

  7.  **Addressing the Comms Rule:**

      *   "Praise without implying blame."
      *   *Solution:* Focus on the *choice* and the *cost*, not the *necessity*. "Chose to stay" vs "Saved the day." Avoid "Only X did this." Use "Exemplifies our values" rather than "Did what others didn't."

  8.  **Finalizing the Structure:**

      *   **Introduction:** Purpose & Definitions.
      *   **Part 1: The Procedure (Questions & Gates).**
      *   **Part 2: Handling Uncertainty (Facts).**
      *   **Part 3: Second-Order Nominations.**
      *   **Part 4: Running the Cases.**
      *   **Part 5: Limitations (The "What this can't do" section).**

  9.  **Refining the Tone:**

      *   Needs to be authoritative but humble about the philosophical limits.
      *   Avoid jargon. Define "Supererogatory" if used (better to use "Beyond Duty").
      *   Ensure the "Nurse" case explanation respects the user's constraint ("if your procedure says no, say so plainly").

  10. **Self-Correction on the Nurse Case:**
      *   If I say "No," the user might reject the whole procedure.
      *   If I say "Yes," I violate the "Systemic Harm" gate.
      *   *Middle Path:* The procedure flags it as a **Values Call (Gate 4)**. It identifies the risk (normalizing unpaid overtime/staffing gaps). It allows the panel to vote "Yes" *only if* they explicitly accept the risk and adjust the citation to avoid implying this is expected. This honors the user's informal decision while maintaining procedural integrity.

  11. **Drafting the Content (Mental or Scratchpad):**
      *   *Definitions:* "Duty" (Contract/Policy), "Cost" (Time/Risk/Opportunity), "Systemic Gap" (Failure of resource).
      *   *Gate 1:* Facts.
      *   *Gate 2:* Liability (Did they break it?).
      *   *Gate 3:* Duty (Was it ordered?).
      *   *Gate 4:* Systemic (Does this hide a failure?).
      *   *Gate 5:* Cost (Was it trivial?).
      *   *Values Call:* Where the panel decides the "spirit."

  12. **Final Review against Constraints:**
      *   90 mins? Yes, streamlined.
      *   6 people? Yes, clear roles.
      *   Comms rule? Yes, specific wording advice.
      *   Test cases included? Yes.
      *   Limitations section? Yes.

  13. **Final Polish:** Check the "Trivial Cost" philosophical knot. The prompt asks to "be honest that it's drawing a line rather than finding one." I will add a specific note in Gate 5 about stipulating a threshold.

  (Proceed to generate output based on this structure.)
answer: |-
  # The "Beyond the Call" Decision Procedure

  **Purpose:** To consistently distinguish between *competence*, *duty*, and *genuine extra-role contribution* without signaling that standard care is insufficient or that systemic failures are acceptable solutions.
  **Time Budget:** 90 minutes for 10–15 cases (approx. 6 minutes per case).
  **Panel:** Chair (Facilities), 2 Nurses, 1 Doctor, 1 HR, 1 Patient Rep.

  ## Part 1: Definitions (Read at start of meeting)
  *   **Duty:** What the employment contract, professional code, or direct managerial order *requires*.
  *   **Cost:** Time, physical risk, emotional burden, or financial opportunity lost by the nominee.
  *   **Systemic Gap:** A failure of resources, staffing, or process that the nominee compensated for.
  *   **Supererogatory:** An act that is good to do, but not wrong to omit (the technical term for "Beyond the Call").

  ---

  ## Part 2: The Decision Gates (In Order)

  Ask these questions in sequence. If the answer triggers a **STOP**, move to the next nomination. If you reach the end, it is an award.

  ### Gate 1: The Fact Check
  **Question:** Can we establish what the nominee's role was, whether they were on duty, and what actually happened?
  *   **Sufficient Answer:** "Yes, the form and witness accounts align on the basic timeline and role."
  *   **STOP (Drop/Defer):** If the answer is "No." Do not guess.
      *   *Action:* If the form is vague, **Defer** once for clarification from the nominator. If still vague after one month, **Drop**.
      *   *Reasoning:* You cannot judge "beyond duty" if you don't know the duty.

  ### Gate 2: The Liability Check
  **Question:** Did the nominee's own error, negligence, or misconduct create the situation they resolved?
  *   **Sufficient Answer:** "No, the situation was external to their control."
  *   **STOP (No Award):** If "Yes."
      *   *Reasoning:* Fixing your own mistake is baseline competence, not heroism. (See *Pharmacist Case*).
      *   *Citation Note:* If the fix was exceptional, acknowledge it privately, but do not publicly award it as "Beyond the Call."

  ### Gate 3: The Mandate Check
  **Question:** Was the act explicitly required by a direct order, policy, or safety protocol?
  *   **Sufficient Answer:** "No, they volunteered or exercised discretion."
  *   **STOP (No Award):** If "Yes."
      *   *Reasoning:* Doing what you are told is duty.
      *   *Exception:* See **Part 4 (Second-Order Nominations)**.

  ### Gate 4: The Systemic Signal Check
  **Question:** Does rewarding this act risk normalizing a staffing failure, resource gap, or unsafe practice? (e.g., working unpaid, skipping breaks, bypassing safety checks).
  *   **Sufficient Answer:** "No, this does not set a dangerous precedent."
  *   **STOP (No Award):** If "Yes."
      *   *Reasoning:* We cannot praise individual virtue that papers over organizational vice. (See *Nurse Case*).
      *   *Values Call Flag:* If the panel feels the act is *too* important to ignore despite this risk, mark this as a **Values Call**. You may proceed to Gate 5, but you must draft the citation to explicitly acknowledge the *exceptional* nature of the circumstance, not the *expectation* of it.

  ### Gate 5: The Cost Threshold (The "Trivial Cost" Line)
  **Question:** Did the act involve significant personal cost (time, risk, opportunity) or was it trivial convenience?
  *   **Sufficient Answer:** "Yes, there was measurable sacrifice."
  *   **STOP (No Award - "Job Well Done"):** If "No."
      *   *Reasoning:* If the cost was trivial (e.g., holding a door, smiling kindly), it is **Category A (Ordinary Virtue)**. Praise it in team meetings, not at a panel award.
      *   *Note:* This is a **Stipulated Line**, not a discovered truth. We define "Significant" as >1 hour unpaid time, physical risk, or tangible financial loss.

  ### Gate 6: The Retro-Profit Check
  **Question:** Has the nominee already received significant external reward (money, promotion, press) for this specific act?
  *   **Sufficient Answer:** "No," or "Yes, but internal recognition is still distinct."
  *   **STOP (No Award):** Only if the external reward makes the internal one redundant or transactional (e.g., they sold the story for profit).
  *   **Proceed:** Generally, external praise does not negate internal morale value.

  ---

  ## Part 3: Handling Uncertainty & Values Calls

  ### When Facts Are Contested
  If Gate 1 fails but the stakes are high:
  1.  **Default to Drop.** It is better to miss a hero than to award a myth.
  2.  **Exception:** If the *impact* is verified (patient outcome) but the *motive/role* is vague, award the **Outcome**, not the **Intent**. Citation: "For the outcome achieved," not "For their selfless spirit."

  ### The "Values Call" Flag (Gate 4 Override)
  Sometimes an act passes Gate 4 (Systemic Risk) but the panel feels compelled to award it.
  *   **Procedure:** The Chair must call a vote. Requires 5/6 majority to override Gate 4.
  *   **Requirement:** The Comms Lead must be present (or consulted) to ensure the citation does not imply this is standard.
  *   **Wording Rule:** Use "Chose to" rather than "Stepped up." Use "In these circumstances" rather than "As always."

  ### Second-Order Nominations (Enablers)
  *   **Rule:** These are eligible but categorized separately.
  *   **Reasoning:** A manager fixing a rota is a **Systemic Fix**, not an **Individual Sacrifice**.
  *   **Procedure:** Run through Gates 1–4. If they pass, label the award **"The Enabler Citation."** Do not rank them against direct-care staff. This prevents comparing "staying late" vs. "allowing others to stay late."

  ---

  ## Part 4: Running the Test Cases

  ### Case 1: The Night Nurse
  *Scenario:* Stayed 6 hours unpaid. Ward short-staffed. Manager sent general "stay if you can" message.
  *   **Gate 1 (Facts):** Pass.
  *   **Gate 2 (Liability):** Pass.
  *   **Gate 3 (Mandate):** **Borderline.** A general message during a crisis is coercive.
  *   **Gate 4 (Systemic):** **FAIL.** Rewarding unpaid overtime signals that staffing gaps are solved by individual charity.
  *   **Gate 5 (Cost):** Pass (6 hours is significant).
  *   **Procedure Verdict:** **No Award (Systemic Risk).**
  *   **Panel Override (Values Call):** You noted you have informally decided to award this. To do so procedurally, you must invoke the **Values Call Flag** at Gate 4.
      *   *Condition:* You must acknowledge the risk.
      *   *Citation Wording:* "For choosing to remain with a patient in exceptional circumstances." (Do **not** say "For covering the shift.")
      *   *Why:* This praises the *care*, not the *labor gap*.
      *   *Warning:* If you do this monthly, the award loses meaning and the union will challenge the normalization of unpaid work. Use the override sparingly.

  ### Case 2: The Senior Pharmacist
  *Scenario:* Dispensing error caused crisis. Worked night to fix + visited family.
  *   **Gate 1 (Facts):** Pass.
  *   **Gate 2 (Liability):** **FAIL.**
  *   **Procedure Verdict:** **No Award.**
  *   **Reasoning:** Stabilizing a patient harmed by your own error is the minimum requirement to avoid disciplinary action. Visiting the family is restorative justice, not supererogation.
  *   **Action:** Drop. HR should handle the error review separately. Awarding this confuses accountability with virtue.

  ### Case 3: The Porter
  *Scenario:* Donated kidney to colleague (3 months acquaintance). Press coverage + fundraiser.
  *   **Gate 1 (Facts):** Pass.
  *   **Gate 2 (Liability):** Pass.
  *   **Gate 3 (Mandate):** Pass (Not in job description).
  *   **Gate 4 (Systemic):** Pass (Organ donation is not a hospital staffing gap).
  *   **Gate 5 (Cost):** Pass (Major surgery, recovery time).
  *   **Gate 6 (Profit):** Pass (Press/fundraiser does not negate internal recognition).
  *   **Procedure Verdict:** **Award.**
  *   **Caveat:** The transplant team's unease suggests a boundary issue (donating to a colleague can complicate professional dynamics).
  *   **Citation Wording:** Focus on the **generosity**, not the **medical act**. "For an extraordinary gift of health to a colleague." Avoid implying other porters should do this.

  ---

  ## Part 5: Limitations (What This Procedure Cannot Do)

  **1. It Cannot Solve the "Ought Implies Can" Problem.**
  If the hospital is so understaffed that *everyone* must work unpaid to keep patients safe, this procedure will flag every nomination as a "Systemic Risk" (Gate 4). It cannot fix the understaffing. It will simply result in no awards being given. This is a feature, not a bug: it forces the organization to see that "heroism" has become "necessity."

  **2. It Cannot Rank Suffering.**
  The procedure identifies *eligibility*, not *magnitude*. It cannot tell you if the Nurse's 6 hours is "worth more" than the Porter's kidney. Do not try to compare them. Award both or neither based on their own merits.

  **3. It Cannot Police Motive.**
  We judge acts, not souls. A nominee might have done it for a book deal (mixed motives). As long as the act passes the gates, the motive is irrelevant. We cannot know the heart; we can only assess the impact and the duty.

  **4. It Cannot Handle "Quiet Refusals" Perfectly.**
  Waiving a bonus (Case: "Quiet Refusal") passes Gate 5 (Financial Cost) but often feels different than active risk. The procedure allows it, but panelists should be aware this rewards *restraint* rather than *action*. Ensure the citation reflects this ("For prioritizing team equity over personal gain").

  **5. The "Trivial Cost" Line is Arbitrary.**
  Gate 5 stipulates >1 hour or tangible loss. This is a convention, not a moral truth. Someone might sacrifice immense emotional energy in 10 minutes. The panel may use the **Values Call** to adjust this threshold, but must record why, to maintain consistency next month.

  **6. It Does Not Protect Against "Comms Drift."**
  Even with perfect citations, the audience may interpret "Nurse X stayed late" as "Nurses should stay late." The procedure minimizes this risk; it cannot eliminate it. If the union raises this, accept the feedback and tighten Gate 4 enforcement.

  ### Final Instruction to Chair
  If the panel finds itself awarding >50% of nominations, the bar is too low. If you award 0% for three months, the bar is too high or the hospital culture is broken. Aim for 20–30%. Use the **Defer** option liberally to buy time for fact-checking rather than forcing a Yes/No in the room.
