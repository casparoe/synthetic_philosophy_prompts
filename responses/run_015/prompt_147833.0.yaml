answer: |-
  Here is a complete lesson plan for your 75-minute seminar. It's designed to be low-prep for you but high-friction for the students (in the good way).

  ### **Activity Title: The Glex Protocol**
  **Time:** 75 Minutes
  **Students:** 12 Grad Students (3 Teams of 4)
  **Materials:** 3 Data Packets (identical), 1 "Shadow Card" (unique), Whiteboard.

  ---

  ### **1. Setup & Rules (10 Mins)**
  Don't mention Quine yet. Don't mention "indeterminacy." Tell them they are doing a practical simulation of radical translation.

  **The Pitch:**
  "You are field linguists. You've arrived on a planet where you share no language with the natives. You have a log of observed stimuli and native vocalizations. Your job is to write the dictionary entry for the word **'Glex.'**"

  **The Constraint (The "Black Box" Rule):**
  "This is the most important rule: You are **behavioral recording devices**. You do not know what is 'really' in the environment. You only know what the *Stimulus Log* says.
  *   If the log says 'Visual pattern: Rabbit-shaped,' you cannot write 'Rabbit.' You must write 'Visual pattern: Rabbit-shaped.'
  *   If you appeal to what a rabbit *really is* (metaphysics), or what *you* would mean (common sense), you are disqualified.
  *   You only have **Assent** (Native nods/smiles), **Dissent** (Native shakes head/frowns), and **Stimulus Conditions**."

  **The Team Assignments:**
  To speed things up, assign each team a specific ontological hypothesis they *must* defend. This ensures the conflict happens.
  *   **Team 1 (The Objectors):** Your manual must define *Glex* = **Enduring Rabbit** (The whole animal over time).
  *   **Team 2 (The Mereologists):** Your manual must define *Glex* = **Undetached Rabbit Part** (Ears, tails, surfaces).
  *   **Team 3 (The Temporalists):** Your manual must define *Glex* = **Temporal Stage of a Rabbit** (The rabbit-at-time-t).

  **Goal:** Create a set of "Analytical Hypotheses" (background logic rules) that makes your definition fit the data perfectly.

  ---

  ### **2. Group Work: Building the Manual (25 Mins)**
  Hand out the **Data Packets** (see below for content).
  *   **Crucial Move:** Hand the **"Shadow Card"** *only* to Team 1. Tell them: "This is a newly discovered piece of evidence. Use it to solidify your manual."
  *   Teams 2 and 3 do not get this card yet.

  **What they need to produce:**
  1.  The definition of *Glex*.
  2.  Three "Analytical Hypotheses" (rules about identity, counting, or perception) that explain away any data that *seems* to contradict their definition.

  **Instructor Role:**
  Circulate. If you hear "But a tail isn't a rabbit," shut it down immediately.
  *   *Student:* "But the log says rabbit, so it's a rabbit."
  *   *You:* "The log says 'furry hopping stimulus.' You are importing 'rabbit.' Stick to the stimulus."
  *   *Student:* "It's crazy to say 'Glex' means rabbit-part."
  *   *You:* "Maybe. But is it behaviorally inconsistent? If not, it's on the table."

  ---

  ### **3. Presentations & The "Gotcha" (20 Mins)**
  Have each team present their manual (5 mins each).

  *   **Team 1 (Rabbit):** They will present their data. Then, they will play their trump card: The **Shadow Card**.
      *   *The Card:* "Stimulus: Rabbit-shaped shadow on cave wall. No physical rabbit present. Native points and says 'Glex' (Assent)."
      *   *Team 1 Argument:* "Aha! If Glex meant 'part,' they wouldn't point at a shadow. If it meant 'stage,' they wouldn't point at a 2D projection. They mean the *Object*. They are just hallucinating the object."
  *   **Team 2 (Part) & Team 3 (Stage):** Ask them to respond. Can they handle the Shadow Card?
      *   *Team 2 Response:* "Sure. Our hypothesis is that natives believe shadows are 'rabbit-surfaces.' They aren't hallucinating an object; they are correctly identifying a surface."
      *   *Team 3 Response:* "Sure. Our hypothesis is that natives treat shadows as 'rabbit-time-slices.' The shadow is a stage of the light, which is causally linked to the rabbit-stage."

  **The Reveal:**
  Ask Team 1: "Did the Shadow Card prove you right?"
  Ask Teams 2 & 3: "Did the Shadow Card prove you wrong?"
  **Answer:** No. The data is compatible with all three, provided you adjust the *background logic* (the analytical hypotheses).

  ---

  ### **4. Debrief: Mapping to Quine (15 Mins)**
  Now you can drop the name "Quine." Connect their frustration to the text.

  **1. The Underdetermination:**
  "Teams 2 and 3, did you feel like you were stretching the truth?" (They will say yes). "That's because you were importing your own ontology. But behaviorally, you were just as safe as Team 1. This is the **Indeterminacy of Translation**. The physical facts (the stimulus log) do not fix the semantic facts (the reference)."

  **2. Analytical Hypotheses:**
  "Notice how you solved the Shadow Card. You didn't change the definition of 'Glex.' You changed your theory of what the natives believe about **shadows** or **identity**. Quine calls these *Analytical Hypotheses*. You can always save a translation manual by making the natives' logic weirder."

  **3. What This Simulation Missed (The "Real World" Check):**
  "This activity felt artificial. Why couldn't you just grab the rabbit and show it to them?"
  *   *Point 1: Holism.* In real fieldwork, you don't translate one word at a time. You translate a whole web of beliefs. If you assume they mean 'rabbit,' you assume they have a logic of counting rabbits. If you assume 'parts,' you assume a logic of counting stuff. The whole web shifts together.
  *   *Point 2: Practical Coordination.* Quine admits that in practice, we translate 'Glex' as 'Rabbit.' Why? Because it's the one that lets us **hunt and eat together**. If I think 'Glex' means 'rabbit-stage,' I might try to eat a rabbit that no longer exists. The tie is broken by *survival*, not evidence. Our classroom rules blocked this practical coordination, which is why the indeterminacy felt so sticky."

  ---

  ### **5. What Will Go Wrong (And How to Fix It)**

  **Problem 1: The Metaphysical Cheat**
  *   *Symptom:* A student says, "This is stupid. Obviously 'Glex' means rabbit because that's what caused the stimulus."
  *   *Fix:* Don't argue philosophy. Argue procedure. "I hear you. But for the purpose of this simulation, 'Causation' is not in your data log. Your log only has 'Correlation.' If you appeal to the cause, you are breaking the Black Box Rule. Stick to the log."

  **Problem 2: Team 2 & 3 Give Up**
  *   *Symptom:* The Part/Stage teams feel they are just being "contrarian" and not doing real philosophy.
  *   *Fix:* Remind them that Team 1 is *also* being contrarian, they just don't realize it because English biases them. "Team 1, why is 'Rabbit' better than 'Rabbit-Stage'? Is there a behavioral test for 'endurance'?" (There isn't). Validate the difficulty.

  **Problem 3: Running Out of Time**
  *   *Symptom:* The presentations drag.
  *   *Fix:* Cut the presentations to 3 minutes each. The magic happens in the discussion of the Shadow Card, not the initial data analysis. If you're tight on time, skip the formal presentation and just ask: "Team 1, read the Shadow Card. Teams 2 and 3, how do you survive this?"

  ---

  ### **Appendix: The Data Packet Content**
  *(Print 3 copies of this. It looks clinical/boring on purpose.)*

  **STIMULUS LOG: SECTOR 7**
  **Target Term:** "Glex"

  | Entry # | Observable Stimulus Condition | Native Vocalization | Native Gesture |
  | :--- | :--- | :--- | :--- |
  | 001 | Large furry stimulus moves across visual field. | "Glex!" | Pointing at stimulus. |
  | 002 | Large furry stimulus stationary. | "Glex." | Pointing at stimulus. |
  | 003 | Only tail of furry stimulus visible behind rock. | "Glex." | Pointing at tail. |
  | 004 | Large furry stimulus moves away, disappears. | (Silence) | (No gesture) |
  | 005 | Large furry stimulus returns 1 hour later. | "Glex!" | Pointing at stimulus. |
  | 006 | Two furry stimuli present together. | "Glex. Glex." | Pointing at each. |
  | 007 | Furry stimulus eating vegetation. | "Glex." | Pointing at head/mouth area. |

  **(Team 1 Only) ADDENDUM CARD: ENTRY 008**
  | Entry # | Observable Stimulus Condition | Native Vocalization | Native Gesture |
  | :--- | :--- | :--- | :--- |
  | 008 | Rabbit-shaped shadow on wall. No furry stimulus present. | "Glex." | Pointing at shadow. |

  ---

  ### **Instructor Cheat Sheet: The Quinean Moves**
  *   **If Team 1 says:** "Entry 003 (Tail) proves it's not a rabbit."
      *   **Counter:** "Not if your Analytical Hypothesis is: 'Natives use whole-object terms to refer to salient parts metonymically.' That's a logic shift, not a reference shift."
  *   **If Team 3 says:** "Entry 005 (Returns later) proves it's not a stage."
      *   **Counter:** "Not if your Analytical Hypothesis is: 'Natives treat causally connected stages as identical.' They have a different logic of identity than we do."
  *   **The Takeaway:** You can always save the translation by making the native's logic stranger. There is no "fact of the matter" visible from the outside.
