  8.  **Review against Constraints:**
      *   Casual tone? Yes.
      *   No citations? Yes.
      *   No pre-reading? Yes.
      *   Address the "what will go wrong"? Yes.

  9.  **Final Polish:**
      *   Make sure the instructions for the "Shadow Card" are clear to the instructor.
      *   Ensure the "Cheating" shutdown is polite but firm.
      *   Make the data packets distinct enough to feel like work but identical in logical structure. (Actually, prompt says "same data set." I will stick to that to emphasize the indeterminacy).

