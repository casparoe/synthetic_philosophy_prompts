      *   **Mechanism:** Three teams, same data set, forced to commit to different ontologies (Rabbit, Rabbit Part, Rabbit Stage).
      *   **Constraint:** Only behavioral evidence allowed (no metaphysics, no asking natives).
      *   **Twist:** One team gets a "tie-breaker" card (rabbit shadow) that actually *doesn't* break the tie due to analytical hypotheses/auxiliary beliefs.
      *   **Debrief:** Map defenses to Quine's analytical hypotheses, identify what the simulation misses (holism/practical coordination).
      *   **Anticipated Problem:** Students cheating by importing metaphysical intuitions.
      *   **Tone:** Casual, no formal citations, no pre-reading required.

  2.  **Deconstruct the Activity:**
      *   *Setup:* Need data packets. They need to look scientific but be ambiguous.
      *   *Teams:* 3 teams of 4 students.
      *   *Task:* Create a translation manual entry for "Glex."
      *   *The "Glex" Problem:* Needs to work for whole rabbits, parts, and stages.
      *   *The Shadow Card:* Needs to be interpretable by all three ontologies with slight tweaks.
      *   *Facilitation:* Need to keep time and enforce the "no metaphysics" rule gently.
      *   *Debrief:* Connect the frustration to the philosophical point.

  3.  **Drafting the Data Packets:**
      *   I need specific scenarios.
      *   *Scenario 1:* Whole rabbit hops by. Native says "Glex!" (Assent).
      *   *Scenario 2:* Rabbit tail visible behind bush. Native says "Glex!" (Assent).
      *   *Scenario 3:* Rabbit frozen still for 10 mins. Native says "Glex?" (Query/Dissent? No, Quine says stages are tricky. Let's make it so "Glex" applies to the rabbit *now* vs the rabbit *later*).
      *   *Refinement:* To make "Stage" viable, "Glex" needs to be applicable to a temporal slice. To make "Part" viable, it needs to apply to ears/tails. To make "Rabbit" viable, it applies to the whole enduring object.
      *   *Crucial Point:* The behavioral evidence must be *identical* for all three. If the native points to a tail and says "Glex," the Rabbit theorist says "They mean the rabbit (of which this is a part)." The Part theorist says "They mean the part." The Stage theorist says "They mean the rabbit-stage here."
      *   *The Shadow Card:* Native points to a shadow. Says "Glex."
          *   Rabbit: "They think the shadow is a rabbit." (Error theory)
          *   Part: "They think the shadow is a rabbit-surface/part."
          *   Stage: "They think the shadow is a rabbit-stage."
          *   *Wait, better:* The native points to a shadow *while a rabbit is present*. Or points to a shadow *alone*. Let's go with shadow alone.
          *   *Adjustment:* To make it truly Quinean, the adjustment happens in the *analytical hypotheses* (the background logic), not just the reference.
          *   *Team A (Rabbit):* "Glex" = Rabbit. Shadow card = Native believes shadows are rabbits (false belief).
          *   *Team B (Part):* "Glex" = Undetached Part. Shadow card = Native believes shadows are rabbit-surfaces.
          *   *Team C (Stage):* "Glex" = Temporal Stage. Shadow card = Native believes shadows are temporal slices.
          *   *Actually, the prompt asks for the card to seem to break the tie but not.* If the card shows a shadow *without* a rabbit, and they say "Glex," the Rabbit theorist has to say the native is mistaken about the object. The Part theorist says they are mistaken about the part. The indeterminacy lies in *what* they are mistaken about.
          *   *Better Twist:* The card shows a rabbit *eating*. Native says "Glex."
          *   Rabbit: "The rabbit is eating."
          *   Part: "The rabbit-parts are arranged eating-wise."
          *   Stage: "A rabbit-stage is causally connected to a food-stage."
          *   *Let's stick to the Prompt's suggestion:* Rabbit-shaped shadow.
          *   Team 1 (Rabbit): "They see a rabbit." (Perceptual error).
          *   Team 2 (Part): "They see a rabbit-surface." (Ontological shift).
          *   Team 3 (Stage): "They see a rabbit-time."
          *   *Actually, the most Quinean move:* The data is consistent with all three because we can adjust the *logic* of identity.
          *   Let's keep it simple for a 75-min class. The "Shadow Card" is given to *one* team, but during the debrief, we show how *everyone* could have used it. Or, give it to one team, let them think they won, then reveal in debrief that the others can accommodate it.
          *   *Decision:* Give the Shadow Card to Team 1. Let them present it as a "gotcha." Then ask Teams 2 & 3 how they would handle it. They will realize they can also handle it by adjusting auxiliary hypotheses.

  4.  **Addressing the "Cheating" Problem:**
      *   Students will say, "But it *is* a rabbit."
      *   Fix: The "Black Box" Rule. You are a recording device. You cannot see the rabbit. You only see "Stimulus Pattern X" and "Verbal Response Y."
      *   Facilitator role: Play the "Hard-nosed Behaviorist."

  5.  **Timing the 75 Minutes:**
      *   Intro & Rules (10 mins)
      *   Group Work (25 mins)
      *   Presentations (20 mins)
      *   The Reveal/Shadow Card Discussion (10 mins)
      *   Debrief/Quine Connection (10 mins)

  6.  **Developing the Materials:**
      *   Need a handout description.
      *   Need specific "Stimulus Logs."
      *   Need the "Shadow Card."

  7.  **Refining the Debrief:**
      *   Connect to "Analytical Hypotheses."
      *   Connect to "Ontological Relativity."
