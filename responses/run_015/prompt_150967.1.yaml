answer: |-
  Here is the breakdown of your moral logic based on the psychological and sociological distinctions between guilt and shame.

  ### The Unifying Principle
  The core distinction is the **Locus of Judgment**.
  *   **Guilt** is internal and action-oriented ("I *did* something bad"). It relies on a private conscience.
  *   **Shame** is external and identity-oriented ("I *am* something bad"). It relies on an audience (real or imagined) to validate the loss of status.

  ### Addressing Your Questions
  **1. Is guilt or shame the better moral emotion?**
  Neither is inherently "better," but they serve different functions. Guilt is superior for **moral repair** and individual growth because it focuses on the action, allowing for apology and change. Shame is superior for **social cohesion** and conformity because it polices identity and status, but it risks hypocrisy, hiding, and aggression when the threat of exposure is removed.

  **2. Can a culture actually pick one?**
  A culture can **prioritize** one, but it cannot eliminate the other. A "guilt culture" still needs laws (external shame) to function at scale. A "shame culture" still needs conscience (internal guilt) to prevent total collapse when no one is watching. The colonies in your novel can lean heavily into one, but the tension arises when the suppressed emotion leaks back in.

  **3. What does your principle predict for a society that tries to make shame fully internal with no audience?**
  It collapses into pathology. Shame requires a witness to regulate behavior. If you remove the audience but keep the mechanism of shame (identity judgment), you create **toxic self-loathing** without the possibility of reintegration. It becomes depression or narcissistic injury, not a functional moral system. This is why "internalized shame" is often indistinguishable from severe guilt, but without guilt's pathway to repair.

  ### Which Case to Drop?
  You need to drop **Case 3**.
  You describe it as "healthy collective shame" based on an "unspoken crime" and "vague heaviness." This is logically inconsistent. If the crime is unspoken and the heaviness is internal, there is no public audience and no status loss. That is the definition of **collective guilt**, not shame. By calling it shame, you blur the very distinction your novel explores. Case 4 is also a contradiction (as you noted), but Case 3 is the dangerous error because you labeled it "healthy." Unspoken shame cannot be healthy because shame requires exposure to function; without exposure, it is just rotting guilt.

  Verdict: 3
  \answer{Guilt requires a conscience; shame requires a witness}
