prompt: |-
  I run the calibration desk at a small prediction market, and I need a written procedure my junior analysts can follow when we list mechanism events — events whose outcomes are produced by a process with a genuine, in-principle knowable probability, such as lottery draws, coin flips, dice, sports games, or the weather. We list a few dozen of these a week, a bad anchor can cost us real money when the market trades against us, and the final call on each listing has to be signed off by me, so the procedure needs to run in under ten minutes and end in a one-line recommendation I can act on. We keep getting burned in two directions: junior analysts override a known probability with their own feel (refusing to list a 1-in-38 number because it "looks cold"), and senior analysts won't move a probability when the evidence that the process is not what we think is thin but persistent — a roulette table that has just run an 11-red streak, where our traders insist we leave the odds at 18/38 because each spin is independent, and our in-house statisticians insist the streak is evidence about the wheel, not a sign that red is "due."

  Please write the procedure. It should take a proposed mechanism-event listing and decide, in order: (a) whether there is a well-defined objective probability to defer to at all, or whether the event is really a judgment event (an election, a court ruling, a replication result) for which no such probability exists in the same sense; (b) whether the analyst's knowledge of that probability is good enough to anchor on; (c) whether the analyst's other evidence counts as what the philosophy of probability calls a defeater — evidence that the probability is not what they think it is, or that the event is not actually generated by the process they think — and, if so, how to treat it; and (d) when the procedure stops deferring and hands the decision to human judgment, with the reason written down. Ground it in the literature on the relationship between objective chance and rational belief: I know the core idea is that your degree of belief in an event should match its objective probability, conditional on the totality of what you know, unless you have some special evidence to the contrary, but I want the procedure to be honest about which steps are real constraints and which are judgment calls dressed up as steps, and to say explicitly where it will misfire. Then run it on three cases — a 1-in-38 number on a fresh, certified wheel; the same wheel after the 11-red streak; and a coin flip we are about to list, where the flipper is a magician known for trick coins and we have no way to inspect the coin before the flip — and for each, say whether the recommendation is the one the desk would prefer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Calibration Desk Lead at a small prediction market.
      *   **Audience:** Junior Analysts (need clear, actionable steps).
      *   **Task:** Create a written procedure for listing "mechanism events" (events with knowable objective probabilities).
      *   **Constraints:**
          *   Must take under 10 minutes per event.
          *   Must end in a one-line recommendation for sign-off.
          *   Must address two specific failure modes:
              1.  *Gambler's Fallacy/Intuition Override:* Ignoring known math (e.g., 1/38) due to "feeling" (e.g., "looks cold").
              2.  *Rigidity/Ignore Defeaters:* Ignoring evidence of bias (e.g., 11-red streak indicating a biased wheel) due to strict adherence to independence assumptions.
          *   Must follow a specific logical flow: (a) Is it a mechanism event? (b) Is the base probability knowable/anchored? (c) Are there defeaters (evidence the process isn't what we think)? (d) When to hand off to judgment.
          *   Must be grounded in philosophy of probability (Principal Principle, defeaters, objective chance vs. rational belief).
          *   Must be honest about limitations (where it misfires).
          *   Must include three test cases (Fresh Wheel, Streaky Wheel, Magician Coin).
          *   Must state if the recommendation matches what the desk *would* prefer (implying a need for alignment with market reality/risk management).

  2.  **Theoretical Framework:**
      *   *David Lewis's Principal Principle:* Rational credence should match objective chance, *provided* no inadmissible information (defeaters) exists.
      *   *Defeaters:* Evidence that the chance setup is broken or different than assumed (e.g., a loaded die vs. a fair die).
      *   *Reference Class Problem:* Choosing the right probability class (is this spin part of "all spins" or "spins on this specific wheel"?).
      *   *Distinction:* Mechanism (physics-driven, repeatable) vs. Judgment (human-driven, unique).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Keep it under 10 minutes. This means checklists, not essays.
      *   *Step 1 (Classification):* Is this actually a mechanism event? If it depends on human intent (election), stop. If it depends on physics/randomization (dice), proceed.
      *   *Step 2 (Anchor):* What is the theoretical probability? (e.g., 1/6, 18/38). Is the hardware certified?
      *   *Step 3 (Defeater Check):* This is the crux. How to distinguish "noise" (streak) from "signal" (bias)?
          *   *Idea:* Use a statistical threshold. If the streak is statistically unlikely *under the null hypothesis* to a degree that suggests physical bias, flag it.
          *   *Refinement:* Junior analysts aren't statisticians. Keep it simple. "Is there physical evidence of tampering?" or "Does the data exceed $X$ standard deviations?" Let's go with a "Physical/Procedural Integrity" check first, then a "Statistical Outlier" check.
      *   *Step 4 (Decision):* If no defeaters, use the Anchor. If defeaters, suspend listing or adjust (hand to Lead).
      *   *Honesty Clause:* Acknowledge that "defeaters" are often judgment calls. Acknowledge that small markets can't detect subtle bias.

      *   *Drafting the Steps:*
          1.  **Type Check:** Mechanism vs. Judgment.
          2.  **Anchor Verification:** Source of the number.
          3.  **Defeater Scan:** Physical integrity + Statistical anomaly.
          4.  **Final Call:** Defer to Anchor or Escalate.

      *   *Refining for the "10 Minute" Constraint:* Needs to be a checklist.
      *   *Refining for the "Philosophy" Constraint:* Explicitly mention the Principal Principle and "Inadmissible Information."
      *   *Refining for the "Failure Modes":* Explicitly forbid "feeling" in Step 3. Explicitly require investigating "streaks" as potential bias evidence, not just noise.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Fresh Wheel):* Standard mechanism. No defeaters. Anchor = 1/38. Desk prefers: List at 1/38.
      *   *Case 2 (11-Red Streak):* This is the tricky one.
          *   *Strict Frequentist:* Independence holds, still 18/38.
          *   *Bayesian/Realist:* 11 reds is unlikely (prob $\approx (18/38)^{11} \approx 0.0006$). It suggests the wheel *might* be biased.
          *   *Procedure Outcome:* The procedure needs to catch this as a potential defeater. It shouldn't say "Change to Red," it should say "Investigate/Escalate." The prompt asks for a one-line recommendation. If the procedure says "Escalate," that's a recommendation.
          *   *Desk Preference:* The desk probably *doesn't* want to list this until checked, or lists it with a wider spread/warning. Let's aim for "Escalate for physical inspection."
      *   *Case 3 (Magician Coin):*
          *   *Mechanism?* Yes (coin flip).
          *   *Anchor?* 50/50.
          *   *Defeater?* Yes, the agent (magician) has capability and motive to subvert the mechanism.
          *   *Procedure Outcome:* Do not list as mechanism event. Treat as judgment or reject.
          *   *Desk Preference:* Do not list as 50/50.

  5.  **Polishing the Tone:**
      *   Professional, directive, slightly academic but practical.
      *   Needs to explicitly state where the procedure fails (e.g., subtle bias, black swans).

  6.  **Review against Constraints:**
      *   Under 10 mins? Yes, checklist format.
      *   One-line recommendation? Yes, included in the form.
      *   Addresses both failure modes? Yes (Step 3 blocks intuition, Step 4 blocks rigidity).
      *   Philosophical grounding? Yes (Principal Principle referenced).
      *   Three cases run? Yes.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* In Case 2, simply escalating might be too slow for a market. But the prompt says "final call... signed off by me." So escalation *is* the correct move for the junior. The Junior shouldn't decide the odds on a biased wheel.
      *   *Correction:* Make sure the "Honesty" section is prominent. The prompt asks to be honest about which steps are judgment calls dressed up as steps.
      *   *Correction:* Ensure the distinction between "Gambler's Fallacy" (Red is due) and "Bias Detection" (Wheel is broken) is clear in the procedure.

  8.  **Final Output Structure:**
      *   Header/Memo style.
      *   The Procedure (SOP).
      *   The "Honesty & Limitations" Section.
      *   The Three Test Cases.
      *   Sign-off line.

  *(Self-Correction on Case 2 Logic)*: 11 reds in a row on a double-zero wheel. $P = (18/38)^{11} \approx 0.00065$. That's roughly 1 in 1500. In a busy casino, this happens. Is it a defeater? Lewis would say if you *know* the wheel is fair, it's not. But we don't *know* it's fair; we infer it. The streak updates the probability that the wheel is biased. The procedure must treat this as "Potential Defeater -> Escalate," not "Adjust Odds." The Junior cannot calculate the new odds.

  *(Self-Correction on Case 3 Logic)*: Magician coin. The mechanism is "Coin Flip." The *process* includes the flipper. If the flipper is untrusted, the objective chance is not 0.5. It is unknown. This fails Step 1 or Step 3. Best to fail Step 1 (is the process reliable?) or Step 3 (Defeater: Agent Capability). Let's put it in Step 3 as a "Process Integrity" defeater.

  Let's write it.cw
answer: |-
  **MEMORANDUM**
  **TO:** Junior Analysts, Calibration Desk
  **FROM:** Desk Lead
  **SUBJECT:** Standard Operating Procedure 004: Mechanism Event Listing
  **TIME ALLOWANCE:** 10 Minutes Per Event
  **STATUS:** Mandatory

  ### **1. PURPOSE**
  To standardize the listing of "Mechanism Events" (outcomes determined by physical randomization processes) and prevent two specific capital-loss scenarios:
  1.  **Intuition Override:** Ignoring mathematical anchors due to gambler's fallacies (e.g., "that number is cold").
  2.  **Model Rigidity:** Ignoring evidence of physical bias due to strict adherence to theoretical independence (e.g., "the wheel *must* be fair").

  This procedure operationalizes David Lewis's **Principal Principle**: *Your credence should match the objective chance, provided you possess no "inadmissible information" (defeaters) regarding the specific setup.*

  ---

  ### **2. THE PROCEDURE**

  **Step 1: Classification (Mechanism vs. Judgment)**
  *   **Question:** Is the outcome determined primarily by a repeatable physical process with fixed parameters (dice, roulette, certified RNG, weather physics), or by human agency/complex systems (elections, court rulings, Fed rates)?
  *   **Action:**
      *   If **Human/Complex**: Stop. This is a Judgment Event. Route to Fundamental Desk.
      *   If **Physical/Random**: Proceed to Step 2.
  *   *Constraint:* Do not classify an event as "Mechanism" simply because it has numbers. A coin flip by a known trickster is not a mechanism event; it is a judgment event on the trickster's intent.

  **Step 2: Anchor Verification**
  *   **Question:** Is there a consensus, theoretical probability derived from the physical specifications of the mechanism (e.g., 1/6 for a d6, 18/38 for double-zero roulette)?
  *   **Action:**
      *   **Yes:** Record this as the **Base Anchor**.
      *   **No:** Stop. If the physical probabilities are unknown (e.g., "weighted die of unknown bias"), this is not a listable mechanism event.
  *   *Constraint:* You are forbidden from adjusting the Base Anchor based on "hot/cold" streaks, gut feeling, or recent payout history. The Base Anchor is the null hypothesis.

  **Step 3: Defeater Scan (The "Inadmissible Information" Check)**
  *   **Question:** Do we possess evidence that *this specific instance* of the mechanism deviates from the specifications used to calculate the Base Anchor?
  *   **Checklist:**
      1.  **Physical Integrity:** Is there a report of damage, tampering, or certification expiry? (e.g., chipped die, unsealed roulette wheel).
      2.  **Agent Integrity:** Is the operator of the mechanism trusted? (e.g., Is the coin flipper a magician? Is the RNG software open-source?).
      3.  **Statistical Anomaly:** Has the mechanism produced an outcome sequence that exceeds a $p$-value of 0.001 (approx. 1 in 1,000) under the Base Anchor assumptions *in the immediate session*?
          *   *Note:* An 11-streak on roulette ($p \approx 0.0006$) triggers this. A 3-streak does not.
  *   **Action:**
      *   **No Defeaters Found:** Proceed to Step 4.
      *   **Defeater Found:** **STOP.** Do not list. Escalate to Desk Lead. The Principal Principle no longer applies because the "objective chance" is no longer the Base Anchor.

  **Step 4: Final Recommendation**
  *   **If Step 3 was Clear:** Recommend listing at **Base Anchor**.
  *   **If Step 3 Triggered:** Recommend **Suspension/Escalation**.
  *   **Required Output:** Fill out the "Listing Ticket" (see below).

  ---

  ### **3. HONESTY & LIMITATIONS (READ BEFORE USE)**
  *This procedure is a heuristic, not a law of physics. It will misfire in the following known ways:*

  1.  **The "Silent Bias" Failure:** If a wheel is biased but hasn't yet triggered the Step 3 statistical threshold, this procedure will force you to list the wrong odds. We accept this risk; we cannot investigate every wheel physically.
  2.  **The "Reference Class" Judgment:** Step 1 looks objective, but distinguishing "Mechanism" from "Judgment" is often a judgment call (e.g., Is a sports game a physical mechanism or human agency?). If you hesitate on Step 1, Escalate.
  3.  **The "Small Sample" Trap:** Step 3's statistical threshold is arbitrary. A 1-in-1,000 event happens 1 in 1,000 times. Sometimes a streak is just noise, and we will kill a profitable market unnecessarily. This is cheaper than listing a rigged market.
  4.  **Philosophical Tension:** We treat the Base Anchor as "Objective Chance." In reality, it is a model. If the model is wrong, the procedure protects the model, not the truth.

  ---

  ### **4. LISTING TICKET (TEMPLATE)**
  **Event ID:** _______________
  **Step 1 (Type):** [ ] Mechanism [ ] Judgment (Stop)
  **Step 2 (Base Anchor):** _______________ (e.g., 2.63% for 1/38)
  **Step 3 (Defeaters):** [ ] None [ ] Physical [ ] Agent [ ] Statistical (Specify: ________)
  **Step 4 (Recommendation):** ______________________________________________________
  *(Must be one line: "List at X%" or "Escalate: [Reason]")*
  **Analyst Signature:** _______________

  ***

  ### **5. TEST CASES**

  **Case A: The Fresh Wheel**
  *   **Scenario:** Double-zero roulette. Wheel certified yesterday. No recent history. Listing "Next spin = 7".
  *   **Analysis:**
      *   Step 1: Mechanism (Physical randomization).
      *   Step 2: Anchor = 1/38 (2.63%).
      *   Step 3: No physical damage, trusted dealer, no statistical anomalies.
      *   Step 4: No defeaters.
  *   **Recommendation:** **List at 2.63% (1/38).**
  *   **Desk Preference:** **Match.** This is the core revenue stream. We want liquidity here.

  **Case B: The 11-Red Streak**
  *   **Scenario:** Same wheel. Last 11 spins were Red. Traders want to list "Next spin = Black" at >50% (Gambler's Fallacy). Statisticians say "Independence holds, list Black at 18/38."
  *   **Analysis:**
      *   Step 1: Mechanism.
      *   Step 2: Anchor = 18/38 for Red/Black.
      *   Step 3: **Defeater Triggered.** Statistical Anomaly. Probability of 11 Reds in a row on double-zero wheel is $(18/38)^{11} \approx 0.00065$. This exceeds the 0.001 threshold. It is evidence that the *wheel* may be biased, not that Black is "due."
      *   Step 4: Defeater found. Principal Principle suspended.
  *   **Recommendation:** **Escalate: Statistical anomaly suggests potential physical bias; do not list until inspected.**
  *   **Desk Preference:** **Match.** We do not want to be the counterparty on a potentially broken wheel. If the wheel is biased toward Red, listing Black at 18/38 loses money. If we list Red at 18/38, we invite arbitrage if the bias is confirmed. We need a physical check before re-anchoring.

  **Case C: The Magician's Coin**
  *   **Scenario:** Coin flip event. Flipper is a professional magician known for sleight of hand. Coin is provided by the flipper. We cannot inspect it beforehand.
  *   **Analysis:**
      *   Step 1: Mechanism? **No.** While a coin flip is physical, the *process* includes the agent.
      *   *Alternative Path:* If classified as Mechanism:
      *   Step 2: Anchor = 50%.
      *   Step 3: **Defeater Triggered.** Agent Integrity. The flipper has capability and motive to subvert the mechanism.
      *   Step 4: Defeater found.
  *   **Recommendation:** **Escalate: Agent integrity compromise invalidates 50/50 anchor; treat as Judgment Event or reject.**
  *   **Desk Preference:** **Match.** Listing this at 50% is suicide. The objective chance is not 0.5; it is whatever the magician decides it is. This is a judgment event on the magician's honesty, not a mechanism event.

  ***

  **Lead Sign-Off:**
  *This procedure prioritizes risk avoidance over market volume. If in doubt, Escalate.*
