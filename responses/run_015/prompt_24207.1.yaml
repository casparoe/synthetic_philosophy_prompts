      *   **Topic:** Bernard Mandeville's political philosophy of competition applied to the modern AI arms race.
      *   **Task:** Write a short essay (900-1200 words) reconstructing Mandeville's view charitably against the "Moloch/multipolar trap" thesis.
      *   **Structure:**
