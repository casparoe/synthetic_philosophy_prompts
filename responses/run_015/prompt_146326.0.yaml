answer: |-
  # Joint Statement on Methodological Integration in Historical Explanation

  **Signatories:** A Practitioner of Microhistory and History from Below; A Practitioner of Macrohistorical, State-Centered Analysis.
  **Subject:** The Relationship Between Subaltern Practice and Institutional Change.
  **Date:** [Current Date]

  ## I. Agreed Claims and Methodological Protocols

  1.  **Validity of Evidence:** Both parties agree that valid historical evidence extends beyond formal state registries and guild ledgers. We recognize that silences, gaps, and material traces (including vernacular architecture, tool assemblages, and oral traditions recorded in later periods) constitute legitimate data points. However, we agree that such traces require triangulation. A claim based on oral tradition or material culture must be tested against the internal logic of the available written record, just as a claim based on state archives must be tested against the physical constraints of the material environment.
  2.  **Rejection of Caricatures:**
      *   The Macrohistorical signatory rejects the characterization of state-centered history as inherently deterministic or blind to human action. We acknowledge that structures are reproduced or altered by human decisions, even if those decisions are constrained.
      *   The Microhistorical signatory rejects the characterization of history from below as merely antiquarian, anecdotal, or incapable of generalization. We acknowledge that local narratives must ultimately speak to broader questions of power and change to hold explanatory weight beyond the specific case.
  3.  **Conditions for Revising Explanations:** We agree on the following formal conditions under which micro-level findings interact with macro-level explanations:
      *   **Must Revise:** A macro-explanation must be revised if a micro-case demonstrates a causal mechanism that operates systematically but is invisible to aggregate data (e.g., a widespread tax evasion practice that fundamentally alters fiscal capacity calculations).
      *   **Should Not Revise:** A macro-explanation need not be revised if the micro-case is demonstrably an outlier caused by idiosyncratic local conditions (e.g., a unique geographic anomaly or a singular personality) that cannot be shown to exist elsewhere.
      *   **Should Qualify:** A macro-explanation should be qualified if micro-evidence reveals that a uniform policy produced divergent outcomes based on local social topology, indicating that the macro-model requires regional variables.
  4.  **The Scaling Protocol:** To translate claims about individual or local practice into claims about institutional trajectory without committing logical fallacies, we adopt the following protocol:
      *   **Mechanism over Frequency:** A single case can scale to a macro-claim if it identifies a *causal mechanism* that is theoretically possible in other contexts, even if the frequency of the case is unknown. (e.g., If one community successfully bypasses a guild restriction through informal kinship networks, the *possibility* of institutional erosion exists elsewhere).
      *   **Representativeness Check:** To claim a micro-practice is *typical*, one must demonstrate that the local conditions enabling the practice exist in a defined proportion of comparable units.
      *   **Negative Inference:** The absence of a practice in the official record cannot be taken as evidence of its absence in reality unless the administrative capacity to record it is proven to be total. Conversely, the presence of a practice in one locale cannot be assumed to be universal without evidence of transmission networks.
      *   **Prohibition:** We agree to prohibit the "Ecological Inversion," where a macro-trend is assumed to dictate the motivation of every individual within that trend, and the "Anecdotal Elevation," where a singular subaltern act is declared the cause of a structural shift without evidence of replication or elite reaction.

  ## II. Table of Disagreements

  | Topic of Dispute | Microhistorical / History from Below Position | Macrohistorical / State-Centered Position |
  | :--- | :--- | :--- |
  | **Causal Priority: Agency vs. Constraint** | Subaltern agency is often causally prior to institutional change. Informal, unregistered practices accumulate over time to create pressure that forces formal institutions to adapt, codify, or crack. Structures are the sedimented result of daily practices. | Institutional constraints and elite structures define the boundaries within which agency operates. Subaltern action is reactive; significant institutional change originates from conflicts within the elite or exogenous shocks that alter the cost-benefit analysis of the state. |
  | **Nature of the Archive** | Official state and guild archives are structurally blind to popular practice. They are not merely incomplete records of reality but active tools of power that render certain activities invisible by design. This blindness is not correctable by finding more of the same records. | Official archives are incomplete but statistically correctable. While they reflect elite priorities, they capture the binding constraints of the era. Gaps can be filled through estimation, proxy data, and cross-referencing, allowing for a reconstruction of the "true" underlying rates of activity. |
  | **Selection Bias** | Microhistorical case selection corrects for the inherent bias of elite sources. By choosing cases where subaltern voices survive, we counterbalance the systematic over-representation of state success and elite cohesion found in macro-sources. | Microhistorical case selection introduces unavoidable selection bias. Cases are often chosen *because* they are unusual or well-preserved, making them poor bases for generalization. Elite sources, while biased, offer systematic coverage over time and space necessary for tracking institutional trajectories. |

  ## III. Cruxes: Testable Sub-Questions

  We identify two specific cruxes where further investigation could move at least one party. For each, we specify the relevant evidence and our divergent predictions.

  **Crux 1: The Causal Efficacy of Unregistered Labor**
  *   **Question:** Can recovered collective labor or property practices that escaped registration be demonstrated to have altered the path of a formal institutional reform?
  *   **Relevant Evidence:** Drafts of legislation, minutes of regulatory council meetings, and enforcement court records that reference "abuses," "customs," or "difficulties in collection" prior to a legal change.
  *   **Microhistorical Prediction:** We predict these records will show that formal reforms were reactive. The language of the reform will explicitly reference the need to curb or codify existing informal practices, proving that subaltern action drove the legislative timeline.
  *   **Macrohistorical Prediction:** We predict these records will show that formal reforms were proactive or driven by inter-elite competition. References to popular practice will be rhetorical justifications for changes decided upon for fiscal or political reasons unrelated to the actual scale of the informal practice.

  **Crux 2: Calibrating Structural Models with Micro-Variance**
  *   **Question:** Can macro-structural models of institutional change be calibrated to incorporate micro-variance without losing explanatory coherence?
  *   **Relevant Evidence:** Comparative datasets where local enforcement rates are mapped against central policy mandates across multiple regions, subjected to sensitivity analysis.
  *   **Microhistorical Prediction:** We predict that incorporating local variance will fundamentally alter the model's output, showing that "institutional change" was actually a patchwork of distinct local settlements. The macro-model will lose coherence because the "institution" did not exist as a singular entity.
  *   **Macrohistorical Prediction:** We predict that incorporating local variance will add noise but not change the central trajectory. The model will remain robust because the central state's capacity to enforce the *threat* of power matters more than the local variation in actual enforcement.

  ## IV. Assessment of Verbal Disputes

  We conclude that a portion of our dispute is verbal, arising from imprecise definitions of key terms. Resolving these definitions clarifies, though it does not eliminate, our substantive disagreements.

  1.  **Agency:** We agree to distinguish between *strategic adaptation* (operating creatively within constraints) and *constraint-transcending innovation* (altering the rules of the game). The Microhistorical signatory often labels adaptation as agency that leads to change, while the Macrohistorical signatory reserves "agency" for actions that successfully alter constraints. Clarifying this reduces the disagreement on causal priority; we may agree that adaptation is widespread, but disagree on its capacity to transcend structure.
  2.  **Structure:** We agree to distinguish between *institutional design* (the written rules) and *institutional operation* (the lived reality). The Macrohistorical signatory tends to equate structure with design, while the Microhistorical signatory equates structure with operation. Acknowledging this distinction allows us to agree that design remained stable while operation shifted, or vice versa, without arguing over whether "change" occurred.
  3.  **Scale:** We agree to distinguish between *statistical aggregation* (summing local units) and *causal scaling* (identifying a mechanism that functions at multiple levels). Much of our conflict arises when the Macrohistorical signatory demands statistical aggregation to accept a claim, while the Microhistorical signatory offers causal scaling. By accepting that causal scaling is a valid form of generalization even without full statistical aggregation, we reduce the friction regarding selection bias.

  **Conclusion:** While substantive disagreements remain regarding the ultimate drivers of historical change, we affirm that these disagreements are now framed as testable hypotheses rather than incompatible paradigms. We commit to applying the Scaling Protocol and investigating the identified Cruxes in future collaborative work.
