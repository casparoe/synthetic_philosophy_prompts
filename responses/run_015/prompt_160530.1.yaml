          *   (b) Inflation of expectations: Acknowledge the harm. This supports the "no direct cash" rule.
      *   **Steel-manning the Rejected Positions:**
          *   *Rejection of "Use Judgment":* It places an unfair burden on inexperienced students and leads to inconsistent outcomes (as seen this spring).
          *   *Rejection of "Full Compliance":* While it argues for humility and not breaking the system, it risks violating core nursing ethics and university liability regarding bribery.
      *   **Conclusion:** Call to action for the vote.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
