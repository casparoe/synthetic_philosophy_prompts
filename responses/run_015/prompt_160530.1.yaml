      *   *Revised Recommendation:* "Do not give direct cash for standard clinical tasks. If resistance is encountered, escalate immediately to the Program Liaison." This protects the student and the patient without making the student a vigilante.
      *   *Wait, looking at the "Third Group" argument:* They say complying helps the individual but entrenches the system. The recommendation needs to balance this.
      *   *Better Recommendation:* Distinguish between *Social/Coordination Norms* (Follow local custom) and *Clinical/Financial Norms* (Adhere to Code of Ethics).
      *   *Incident 1 (Cash):* Prohibit direct payments for standard care. This addresses the inflation issue (b) and the ethical breach. To address the "staff hate it" issue (a), we frame it as protecting staff from coercion.
      *   *Incident 2 (Queue):* Mandate adaptation to local workflow. This addresses the "guest compliance" argument.

  5.  **Drafting the Content (incorporating the "Strongest Version" requirement):**
      *   I need to make sure the argument for "Full Compliance" sounds really good, even though I'm rejecting it. It's about humility, not disrupting care, and recognizing privilege.
      *   I need to make sure the argument for "Use Judgment" sounds reasonable (trusts professional development), even though I'm rejecting it (too vague for undergrads).

  6.  **Writing - Focus on Tone:**
