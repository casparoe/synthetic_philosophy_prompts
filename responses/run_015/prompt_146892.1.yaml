      *   *Predetermined Point:* Justice, utopia, equilibrium.
      *   *Critique:* Mechanics is deterministic and teleological (in the sense of ending at a predictable point given initial conditions). History is not. There is no "moral gravity" equivalent to physical gravity. Perturbations in mechanics are often negligible or calculable; in history, they can be existential (nuclear war, ecological collapse).

  3.  **Deconstruct the Alternative Analogy (Complex Adaptive Systems):**
