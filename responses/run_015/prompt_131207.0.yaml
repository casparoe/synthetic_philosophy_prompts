  8.  *(Self-Correction Note)*: Make sure I don't solve the user's roommate problem directly. The prompt asks for a dialogue to help them *understand the conceptual problem*. I should add a brief intro/outro note to frame it for the user, acknowledging their situation.

  9.  **Final Polish:** Check the flow of the "haptic bleed" argument.
