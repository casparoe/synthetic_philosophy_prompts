      However, standard PRL (Rawls) says justification is based on *public reason*, which draws from the *political culture*, not the individual's *existing comprehensive web*.
      So, Step (2) contains a **Modal Slide**. It slides from "Reasonable Acceptance" (normative) to "Actual Uptake from Existing Commitments" (psychological/descriptive).
