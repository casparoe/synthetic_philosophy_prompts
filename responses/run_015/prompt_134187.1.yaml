      *   *Why it looks sound:* Legal realists and critical theorists argue correctly that the "baseline" (property law, contract enforcement) is state-backed coercion. If I call the police to evict a squatter, that's coercion. So "doing nothing" is actually "enforcing the status quo."
      *   *Why it breaks the argument:* If *every* state omission is coercion requiring public justification to *every* citizen, the justificatory burden becomes infinite. It forces the "Translation Tax" (10) to be universal. It makes the "Historical Ratchet" (11) inevitable because every historical status quo (slavery) was "coercion" that lacked public justification.
      *   *The Fix:* Distinguish between **Specific Coercive Measures** (laws that change the baseline or restrict liberty) and **The Background Framework**. Public Reason applies primarily to *constitutional essentials* and *matters of basic justice* (Rawls's scope), not every regulatory decision or omission.
      *   *Alternative:* Rejecting (2)'s definition of "uptake-accessible." The definition "from C's *own existing* commitments" is too strong. It should be "from commitments C *could reasonably be expected to endorse*." This shifts the modal status from *actual* psychology to *normative* reasonableness. This addresses (8) and (9) directly.

