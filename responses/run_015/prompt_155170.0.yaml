answer: |-
  Your colleague's argument is inconsistent because the "could have done otherwise" slogan ambiguously shifts between a categorical leeway principle required for their incompatibilism and a conditional or flicker-based principle required to dismiss Frankfurt cases.

  ### Menu of Distinct Theses Behind the Slogan

  The following table distinguishes precise interpretations of the principle "you can only hold someone responsible if they genuinely could have done otherwise," evaluating their status and fit with your colleague's two moves.

  | Reading | The "Can" | The "Otherwise" | Target | Status & Frankfurt | Supports Anti-Determinism? | Supports Frankfurt Dismissal? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Classical Leeway PAP** | **Categorical/Open Pathway:** A causally open future at the moment of decision; determinism rules this out. | **Different Action/Choice:** The agent performs a distinct bodily movement or makes a different volition. | **Action & Will** | **Substantive/Contested:** This is the standard target of Frankfurt cases. If Frankfurt cases are coherent, this is false. | **Yes:** Directly implies determinism undermines responsibility. | **No:** Frankfurt cases are designed to remove this while retaining responsibility. |
  | **2. Compatibilist Conditional PAP** | **Dispositional/Hypothetical:** The agent would have done otherwise *if* they had chosen to; compatible with determinism. | **Different Action Conditional on Choice:** Different movement given a different prior mental state. | **Action** | **Defensible (Compatibilist):** Frankfurt cases do not defeat this; the agent in Frankfurt cases retains this ability. | **No:** Determinism does not undermine this ability. | **Yes:** Fits the claim that the agent "retained the ability to refrain" (in a conditional sense). |
  | **3. Flicker of Freedom PAP** | **Causal Pathway Variation:** The ability to initiate a sequence that *would* have triggered an intervener, even if the outcome is fixed. | **Different Causal History:** Not a different outcome, but a different route (e.g., choosing on one's own vs. being forced). | **Causal Origin** | **Contested/Technical:** Well-established in literature as a defense strategy, but contested whether these "flickers" ground robust responsibility. | **Weak:** Determinism may still eliminate the flicker depending on the setup. | **Yes:** Claims Frankfurt cases fail because some alternative possibility (the flicker) remains. |
  | **4. Sourcehood Principle (Non-PAP)** | **Ultimate Origination:** The agent is the ultimate source of the action, regardless of alternative possibilities. | **Different Origin:** Not doing otherwise, but being the *author* of the action. | **Will/Origin** | **Substantive/Defensible:** Explicitly rejects the slogan to avoid Frankfurt; replaces PAP with Sourcehood. | **Yes:** Determinism undermines ultimate sourcehood. | **No:** Accepts Frankfurt cases refute the slogan, but denies they refute responsibility. |

  ### Analysis of Consistency and Literature Status

  **Consistency of Colleague's Uses**
  Your colleague's two uses are mutually inconsistent under standard interpretations.
  *   **Use 1 (Anti-Determinism):** Requires **Reading 1 (Classical Leeway)** or **Reading 4 (Sourcehood)**. If they rely on Sourcehood, they cannot use the slogan "could have done otherwise" literally, as Sourcehood explicitly abandons alternative possibilities. If they rely on Classical Leeway, they admit that determinism removes the relevant "can."
  *   **Use 2 (Frankfurt Dismissal):** Requires **Reading 2 (Compatibilist)** or **Reading 3 (Flicker)**. To claim the agent "retained the ability to refrain" in a Frankfurt case, one must either mean they retained a *conditional* ability (Reading 2)—which undermines Use 1 because determinism doesn't remove that—or they retain a *categorical flicker* (Reading 3).
  *   **The Conflict:** If the "can" in Use 1 is strong enough to be undermined by determinism (Reading 1), it is precisely the "can" that Frankfurt cases remove (by design). If the "can" in Use 2 is robust enough to survive Frankfurt cases (Reading 2 or 3), it is typically too weak to be undermined by determinism (Reading 2) or too trivial to ground full responsibility (Reading 3). Your colleague cannot consistently hold that determinism removes the ability required for blame while simultaneously claiming Frankfurt agents retain that same ability.

  **Established vs. Contested in the Literature**
  *   **Well-Established:** It is consensus that Frankfurt-style cases (Frankfurt 1969) successfully challenge **Reading 1 (Classical Leeway PAP)**. Most contemporary literature accepts that moral responsibility does not strictly require the ability to do otherwise in the classical sense, leading many incompatibilists to shift to **Reading 4 (Sourcehood)** (e.g., Pereboom, Kane). It is also established that **Reading 2 (Compatibilist)** is immune to Frankfurt cases but fails to support incompatibilism.
  *   **Genuinely Contested:**
      *   **The Success of Frankfurt Cases:** Some philosophers (e.g., Kane, Ginet) contest whether Frankfurt cases are coherent without presupposing determinism or begging the question against incompatibilists. Your colleague's dismissal might align with this minority view, but it is not the consensus.
      *   **The Significance of Flickers:** It is contested whether **Reading 3 (Flicker)** alternatives are robust enough to ground moral responsibility. Some argue these alternatives are too trivial (mere "flickers") to satisfy the intuition behind PAP (Widerker 1995; Frankfurt 1994).
      *   **Sourcehood vs. Leeway:** While Sourcehood is a dominant incompatibilist strategy, it remains contested whether sourcehood can be fully separated from leeway (the "Dilemma Defense").

  **Conclusion on the Colleague's Position**
  Your colleague is likely treating the slogan as a **Platitude** in the context of Frankfurt cases (implying Reading 2 or 3) while treating it as a **Substantive Incompatibilist Truth** in the context of determinism (implying Reading 1). This equivocation allows them to attack determinism and defend against Frankfurt simultaneously, but the position collapses if forced to specify a single definition of "could have done otherwise." To repair the argument, they must either abandon the slogan for Sourcehood (accepting Frankfurt cases but denying they refute incompatibilism) or argue that Frankfurt cases fail to eliminate Classical Leeway (a contested claim requiring specific metaphysical commitments about time and causation).
