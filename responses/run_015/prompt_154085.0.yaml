      *Let's finalize the ratings.*
      1.  Tobias: Mostly Mistaken (ignores social pressure).
      2.  Ines: Right (historical accuracy).
      3.  Tobias: Mistaken (False dilemma).
      4.  Ines: Clearly Right (Live options).
