      *Wait, one more check on Move 1:* Tobias says "Converts are converts." He implies the speed of conversion proves the latent faith. This is a theological/psychological premise. I will classify it as Conceptual.
      *Move 3:* "Reasons are his reasons, which just is willingness." This is a definition of willingness. Conceptual.
