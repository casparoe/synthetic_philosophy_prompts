answer: |-
  We measure loss by height of the wall
  And silence where we found the letters
  No fine red clay recovered from the pot
  Just rougher shapes to hold the winter seed
  Smoke climbs thin above the simple hearth
  While time converts the palace to stone

  What lasts the longest is the hard stone
  That tumbles from the top of the wall
  To make a step beside the warm hearth
  Where no one writes or reads those letters
  But counts the seasons by the stored seed
  And draws the water from a plain pot

  You find the fragment of a plain pot
  Among the rubble of the hard stone
  It holds the evidence of saved seed
  There is no gate left standing in the wall
  No scribe to copy out the trade letters
  Yet smoke still rises from the same old hearth

  The family gathers round the hearth
  They pass the food around the simple pot
  They do not speak of kings or send letters
  They build a fence from river stone alone
  To mark the land where once stood their wall
  And trust the earth to keep the sleeping seed

  Nothing is lost if you can save the seed
  Nothing is broken at the living hearth
  Unless you count the ruin of the wall
  Unless you miss the glory of the pot
  Unless you need a name carved deep in stone
  Unless you need to read more letters

  The silence grows between the lost letters
  The pattern changes but remains the seed
  The history is written in the stone
  But life goes on around the quiet hearth
  We judge the age by quality of pot
  And call it failure when we miss the wall

  The wall is down, the scribe sends no letters
  Yet spring will ask the seed to leave the pot
  And feet will walk on stone to tend the hearth
