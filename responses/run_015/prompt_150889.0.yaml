answer: |-
  This is a remarkably coherent set of intuitions. You are effectively gravitating toward a position known as **Semi-Compatibilism** (championed by philosophers like John Martin Fischer), mixed with a **Strawsonian "Quality of Will"** account.

  You want one principle to rule them all. Here is the candidate that best fits 5 out of 6 of your verdicts, explains the tension in the 6th, and resolves your unsettled case.

  ### The Principle: Actual Sequence Reasons-Responsiveness

  **Core Idea:** Blame and praise are not about whether you *could have done otherwise* (Alternative Possibilities). They are about whether the action issued from *your* mechanism in the *actual sequence* of events, and whether that mechanism was capable of recognizing and responding to reasons.

  It has three clauses:
  1.  **Sourcehood:** Did the action spring from the agent's own evaluative machinery (values, desires, character) rather than external coercion or bypassing?
  2.  **Capacity:** Was that machinery functioning with sufficient integrity (not broken by trauma, addiction, or immaturity)?
  3.  **Causal Efficacy:** Did the agent's machinery actually cause the action? (This is where your Case 4 wobbles).

  ---

  ### Mapping Your Cases to the Principle

  | Case | Verdict | Principle Clause Applied | Why it Fits |
  | :--- | :--- | :--- | :--- |
  | **1. Starving Robber** | No Blame | **Clause 1 (Sourcehood)** | The cause is external necessity (survival). The "reasons-responsive" mechanism is overridden by coercion of circumstance. |
  | **2. Thrill Robber** | Full Blame | **Passes All** | Action flows from internal character (greed/boredom). Mechanism is intact. No external coercion. |
  | **3. Frankfurt Case** | Full Blame | **Clause 3 (Actual Sequence)** | Even though they couldn't do otherwise, the *actual sequence* was uncoerced. The scientist was idle. The action was *theirs*. |
  | **5. Altruism vs. Cash** | Praise / Weak Praise | **Clause 1 (Sourcehood)** | Altruism expresses deep character (Source). Cash reward is an external lever that bypasses or crowds out deep character (Non-Source). |
  | **6. Traumatized Addict** | Mostly No Blame | **Clause 2 (Capacity)** | The "evaluative machinery" is damaged by trauma. Reasons-responsiveness is impaired, reducing but not eliminating agency. |
  | **4. Overdetermined** | **Reduced Blame** | **Clause 3 (Tension)** | **Here is your inconsistency.** (See below). |

  ---

  ### The Inconsistency: Case 3 vs. Case 4

  You identified this yourself. In Case 3 (Frankfurt), there is a backup mechanism that *would* have caused the robbery if the agent hesitated. In Case 4 (Overdetermination), there is a backup mechanism that *also* causes the robbery alongside the agent.

  **Your Intuition:** Case 3 = Full Blame; Case 4 = Reduced Blame.
  **The Philosophical Reality:** If you want to be consistent with Semi-Compatibilism (which fits your other views best), **you must drop the "Reduced Blame" verdict in Case 4.**

  **Why?**
  In standard overdetermination cases (e.g., two shooters fire independently, both bullets kill the victim), both shooters are fully responsible. The fact that the victim would have died anyway from the *other* bullet does not diminish the causal efficacy of *my* bullet.
  *   In **Case 3**, the scientist is idle. You are the sole actual cause.
  *   In **Case 4**, if the scientist's mechanism *actually fired* (injected a drug, stimulated a neuron) *and* you chose it, then you are in a **Manipulation Case**, not just a Frankfurt case. If you were manipulated, blame *should* be reduced.
  *   **However**, if Case 4 means "The scientist set the trap, but I chose it on my own, and the trap was sufficient to force me if I hadn't," that is just Case 3 again.
  *   **The Hard Truth:** If your greed was sufficient to cause the robbery on its own (as you stated: "would each have caused it alone"), then the scientist's contribution is causally redundant. **Redundancy does not diminish responsibility.** If I stab you, and simultaneously a heart attack kills you, I am still fully responsible for the death.

  **To be consistent:** You must treat Case 4 exactly like Case 3. If the agent's own greed was a sufficient cause in the actual sequence, the existence of a redundant cause does not dilute blame. **Drop the "Reduced Blame" verdict.**

  ---

  ### The Unsettled Case: Counterfactual Close Worlds

  **The Case:** An agent makes a deterministic choice. In a counterfactually close world (slightly different initial conditions), they could have done otherwise. Does this change blame?

  **Prediction based on your principle:** **No change.**

  **Reasoning:**
  Your acceptance of Case 3 (Frankfurt) proves that you do not believe "Could Have Done Otherwise" (AP) is necessary for blame. In Frankfurt cases, the agent *cannot* do otherwise in *any* close world (because the scientist ensures the outcome). Yet you assign full blame.
  Therefore, the existence of a close world where they do otherwise is **irrelevant** to your moral accounting.
  *   If you say "Yes, blame changes because they could have done otherwise in a close world," you contradict your verdict on Case 3.
  *   If you say "No, blame stays the same," you remain consistent with Case 3 and the **Actual Sequence** principle.

  **Verdict:** It changes nothing. Blame is determined by the *actual* history, not *nearby possible* histories.

  ---

  ### Summary of Required Adjustments

  To achieve a rock-solid, consistent framework based on your own gut reactions, you need to make these specific adjustments:

  1.  **Drop the Case 4 Intuition:** Align Case 4 with Case 3. If the agent's own reasons were sufficient to cause the action, they get full blame, regardless of redundant causal factors. (Unless the scientist *physically intervened*, in which case it's manipulation, not overdetermination).
  2.  **Clarify Case 6 (Addict):** You said blame is "mostly out, but not exactly zero." Be careful here. If determinism is true and trauma determined the addiction, why *any* blame?
      *   *Solution:* Treat blame as **gradient based on capacity**. You are not blaming them for the *trauma*, you are blaming them for the *remaining sliver of control* they retained. This is consistent, but requires you to view blame as a scalar (0 to 100%) rather than binary.
  3.  **Commit to the "Actual Sequence":** For the unsettled counterfactual case, you must commit to the view that **metaphysical freedom (ability to do otherwise) is irrelevant.** Your gut already accepts this in Case 3; your brain just needs to stop checking for it in other cases.

  **Your Final Stance:** You are a **Semi-Compatibilist**. You believe determinism is true, alternative possibilities are not required for responsibility, but *control* (defined as reasons-responsiveness in the actual sequence) is required. Stick to that, and 90% of your flip-flopping will vanish.
