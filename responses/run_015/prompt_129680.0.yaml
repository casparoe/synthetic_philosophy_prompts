answer: |-
  Here are ten interview questions designed to move past surface-level restatement, complete with follow-ups keyed to the answers she is most likely to give. They are structured to flow logically from empirical foundations to systemic consequences, and finally to the ethical/political implications.

  ### Section 1: The Empirical Foundation (Handling Uncertainty)

  **1. The Precautionary Weighting**
  "You use 'suffering-weighted biomass' as your core metric, which requires assigning a welfare value to creatures like insects. We don't have consensus on insect consciousness. How does your model handle empirical uncertainty? Do you treat the possibility of insect suffering as a zero until proven otherwise, or do you apply a precautionary weight?"

  *   **If she says "We must act on the best available data, even if uncertain":** "But in risk assessment, if the potential downside is massive suffering, we usually weight the uncertainty heavily. If there's even a 10% chance insects have rich negative experiences, does your SWB calculation flip? At what probability threshold does the 'habitat destruction is good' argument collapse?"
  *   **If she says "We should assume they do suffer based on nociception":** "Then doesn't that same precautionary principle apply to the *method* of reduction? If habitat destruction causes slow starvation or exposure rather than quick predation, aren't you risking increasing the *intensity* of suffering per individual even if you lower the population?"

  **2. The Suffering-to-Pleasure Ratio**
  "Your argument rests on the claim that wild lives, particularly for r-strategists like rodents or insects, have negative welfare—more suffering than pleasure. What is the empirical basis for that ratio? Is it based on behavioral indicators of stress, or a philosophical assumption about the 'default state' of nature?"

  *   **If she cites high mortality rates:** "High mortality doesn't necessarily mean net negative welfare if the life prior to death is positive. How do you account for the welfare accrued during the life lived versus the suffering of the death event?"
  *   **If she cites evolutionary fitness (suffering drives survival):** "Even if suffering drives evolution, does that mean pleasure is negligible? If an animal spends 90% of its time foraging successfully and 10% fleeing, does the SWB metric capture that granularity, or does it just assume 'wild = bad'?"

  ### Section 2: Systemic Consequences (Trophic Cascades & Stability)

  **3. The Trophic Cascade Trade-off**
  "I want to press on the predator side of this equation. If we reduce prey biomass through habitat destruction, we inevitably reduce predator populations. But the mechanism for that reduction is often starvation, which is a prolonged, high-intensity suffering. Have you modeled whether the intense suffering of starving predators outweighs the suffering averted by having fewer prey animals?"

  *   **If she says "Predators are fewer, so total suffering is lower":** "But suffering is an experience, not just a headcount. If one wolf suffers for three weeks starving versus one rabbit suffering for three minutes being eaten, does your biomass metric account for the *duration* and *intensity* differential?"
  *   **If she says "Nature balances itself eventually":** "So are you arguing we should wait for natural collapse rather than induce habitat destruction? Because inducing it seems to accelerate the starvation phase for the predators, potentially spiking net suffering in the short term."

  **4. Ecosystem Resilience and Pest Outbreaks**
  "Intact ecosystems often regulate populations through disease and predation. Destroyed habitats often lead to monocultures or edge effects that cause pest outbreaks—think locust swarms or rodent booms. Could habitat destruction actually create *more* volatile population cycles, leading to higher net suffering over time due to boom-and-bust dynamics?"

  *   **If she says "That's a risk, but overall biomass is still lower":** "If the volatility increases, doesn't that make the SWB calculation unpredictable? If we can't predict whether destruction leads to a stable low-population or a volatile high-suffering pest state, is advocating for destruction ethically reckless?"
  *   **If she says "We can manage those outbreaks":** "Now we're talking about active management again. Does this mean your view isn't actually 'habitat destruction is good,' but rather 'human management of nature is required'? That seems to shift the burden significantly."

  ### Section 3: Consistency and Intervention (The Culling Problem)

  **5. The Consistency Challenge**
  "If intact ecosystems are welfare disasters according to your SWB metric, does consistency demand that we actively cull populations in *preserved* habitats? If we have a national park that is a 'suffering sink,' are we morally obligated to intervene to reduce that biomass, rather than just letting it be?"

  *   **If she says "No, we shouldn't actively harm":** "But habitat destruction *is* a harm to the individuals displaced or killed. What is the moral distinction between 'allowing' habitat destruction (which kills) and 'actively' culling (which kills)? Is it just a distinction between commission and omission?"
  *   **If she says "Active culling is too costly/dangerous":** "So the view is pragmatic, not principled? If we had a cheap, painless culling technology tomorrow, would your SWB metric compel us to use it on intact wilderness?"

  **6. The "Natural" Baseline**
  "You frame habitat destruction as a reduction of wild animal suffering. But destruction usually replaces wild habitat with human agriculture or urbanization. Are you comparing 'wild' vs. 'nothing,' or 'wild' vs. 'human-dominated'? Because if it's the latter, aren't you just swapping wild animal suffering for domesticated animal suffering, which might be higher per capita?"

  *   **If she says "We can reduce domesticated suffering too":** "That sounds like a massive expansion of the project. Does your view commit you to veganism plus active wildlife management? Because if we reduce wild suffering but increase farmed animal density, the net SWB might worsen."
  *   **If she says "Urbanization has lower biomass":** "But urbanization relies on agricultural hinterlands. Are you counting the suffering in the agricultural supply chain that supports the human habitat? If not, isn't the SWB calculation incomplete?"

  ### Section 4: Values, Politics, and the "Ecofascism" Objection

  **7. The Conflict of Values**
  "You've mentioned that welfare calculus is separable from human values like aesthetics or heritage. But imagine a case where a specific forest has immense cultural value to an indigenous community or high aesthetic value to the public, but your SWB says it should be cleared. In that conflict, does the SWB metric automatically trump human values?"

  *   **If she says "They are separate domains":** "But policy decisions happen in the real world where domains collide. If you advise policymakers to prioritize SWB over human cultural connection, aren't you effectively making a political value judgment that animal suffering is the *only* thing that matters?"
  *   **If she says "We should find win-wins":** "What if there is no win-win? If reducing suffering requires destroying something humans love, and you advocate for the destruction, doesn't that look like prioritizing a specific ethical framework over democratic human values?"

  **8. Pressing the "Separability" Defense**
  "To follow up on that: You deflect the 'ecofascism' label by saying the math is neutral. But the *application* of the math requires power. If implementing SWB reductions means overriding the desires of people who want to conserve nature, doesn't the 'neutral math' become a tool for authoritarianism? How do you prevent the calculus from becoming a mandate?"

  *   **If she says "I'm not advocating force, just analysis":** "But if the analysis says 'conservation is immoral,' and conservationists hold power, aren't you providing the intellectual justification for stripping their power? Can you really separate the conclusion from the political consequence?"
  *   **If she says "Democracy should decide, informed by SWB":** "If democracy decides to ignore the SWB data because they value nature aesthetically, would you say they are morally wrong? If yes, you are prioritizing the calculus over democratic will. If no, why bother with the calculus?"

  ### Section 5: Long-Term Implications

  **9. The Metric of Biomass**
  "You use 'biomass' as a proxy for moral weight. But a blue whale has more biomass than a million mice. Does your metric imply that saving one large mammal is morally equivalent to saving a million small mammals? If not, why is biomass the unit of measurement rather than 'sentient capita'?"

  *   **If she says "Biomass correlates with neural capacity":** "Does it though? Insects have tiny biomass but high neural density relative to size. If we switch to 'neural capacity,' does your argument about habitat destruction still hold, or does it rely on the sheer mass of small creatures?"
  *   **If she says "It's a rough heuristic":** "If it's a rough heuristic that could be wrong by orders of magnitude, how confident can we be in the conclusion that destruction is net-positive? Doesn't the uncertainty undermine the policy recommendation?"

  **10. Action Guidance for Listeners**
  "Finally, for the listeners who take this seriously: Does this view imply we should oppose conservation charities? If a charity is raising money to preserve a habitat that your model identifies as a 'suffering disaster,' is donating to them effectively funding harm?"

  *   **If she says "It's more complex than that":** "Then what is the actionable takeaway? If the answer isn't 'oppose conservation,' what specific behavior should change? If there's no clear behavior change, is the SWB metric descriptive rather than normative?"
  *   **If she says "Yes, reconsider conservation":** "That's a radical claim. How do you anticipate the movement responding to the idea that protecting nature might be ethically comparable to harming it?"
