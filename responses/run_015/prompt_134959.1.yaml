  ### Audit of Tensions

  **1. Genuine Tensions**

  *   **(1) vs. (5): The Lottery Contradiction (Severity: Critical)**
      *   **Conflict:** Commitment (1) asserts that the five do not present a stronger claim and you are not required to save them (implying a 50/50 coin flip between parties or permission to save the one). Commitment (5) mandates "equal per-capita chances." In a 1 vs. 5 case, equal per-capita chances require a weighted lottery (saving the five with 5/6 probability) to ensure each individual has a 1/6 chance. This procedural requirement effectively counts numbers, violating the spirit and letter of (1), which denies numbers confer weight. Taurek explicitly rejects weighted lotteries for this reason.
      *   **Cheapest Revision:** Revise (5) to require "equal chance per party" rather than "per-capita."
      *   **Cost:** You abandon individual-level egalitarianism; the single individual gets the same survival chance as the group of five, meaning individuals in the larger group are treated as less valuable than the individual in the smaller group.

  *   **(1) vs. (4) via (3): The Unity Problem (Severity: High)**
      *   **Conflict:** Commitment (3) demands a unified principle. Commitment (1) says private agents need not save the greater number. Commitment (4) says institutions must save the greater number. Justifying (4) via "ex ante fairness" often implicitly aggregates individual interests in survival (maximizing expected utility for each behind a veil), which replicates the aggregation (1) forbids. If the principle is truly unified, it is unclear why it mandates indifference in one context and maximization in another without relying on the very aggregation (1) rejects.
      *   **Cheapest Revision:** Relax (3) to allow domain-specific principles (private vs. institutional).
      *   **Cost:** Theoretical disunity; you concede that morality fragments into separate spheres without a single foundational derivation, weakening the philosophical robustness of the view.

  **2. Apparent Tensions**

  *   **(2) vs. (4): The Debunking Worry (Severity: Low)**
      *   **Conflict:** You worry that debunking the intuition to save the five (2) undermines the institutional rule to save the five (4).
      *   **Resolution:** This is manageable if (2) targets *direct moral aggregation* while (4) relies on *derived procedural rules*. As long as (4) is justified by contractarian fairness rather than the debunked intuition, they are compatible.
      *   **Cheapest Revision:** Clarify in (2) that the debunking applies only to direct claim-aggregation, not to instrumental policy design.
      *   **Cost:** Increased complexity; you must defend why the evolutionary heuristic is unreliable for morality but the institutional outcome coincidentally aligns with it.

  *   **(1) & (5) vs. Group Claims (Severity: Low)**
      *   **Conflict:** You worried that (1) and (5) conflict regarding group claims.
      *   **Resolution:** This dissolves if you maintain (6). Since claim strength is internal (6), groups have no collective claims. The tension is only between (1) and (5) regarding *procedure*, not group ontology.

  ### Bottom-Line Recommendation
  To restore consistency, you must choose between being a strict Taurekian or a procedural egalitarian. You cannot hold both that numbers never matter for requirements (1) and that fairness requires equal per-capita chances (5). The most coherent path for your view is to revise (5) to match (1) (equal chance per party) and accept that institutions, like individuals, should lottery rather than maximize, or alternatively, abandon (1) and accept that numbers count procedurally even if not metaphysically.
