answer: |-
  # CONTINUANCE STATEMENT (FORM 88-B)
  **DEPARTMENT OF SURVIVORSHIP & TRANSIT**
  **OFFICE OF CARRIAGE STANDARDS**

  **INSTRUCTIONS:** This Statement determines your eligibility for Fare Classes and establishes your legal standing regarding Contract Succession, Parental Custody, and Criminal Liability post-transit. Read each Scenario carefully. Select the single option that best reflects your understanding of the outcome. Do not consult counsel.

  ***

  **ITEM 1: THE GRADUAL REPLACEMENT**
  A traveller undergoes a "Slow Relay" transit. Over six weeks, their biological tissue is replaced cell-by-cell with scanned synthetic material at the origin. At the end of week six, the fully synthetic body is disassembled and rebuilt at the destination. The original biological matter is discarded incrementally throughout the six weeks.
  *   [ ] **A.** The traveller persists continuously throughout the six weeks and arrives at the destination.
  *   [ ] **B.** The traveller ceases to exist when biological replacement exceeds 50%; the arrival is a new entity.
  *   [ ] **C.** The traveller ceases at disassembly; the arrival is a distinct legal successor.
  *   [ ] **D.** There is no fact of the matter regarding when the traveller ceased.

  **ITEM 2: THE TRAIT NORMALISATION**
  During a standard transit, carrier software identifies a pathological risk-aversion in the traveller's psychological profile. The recipient is assembled with this trait softened by a measurable degree. The recipient retains all memories and relationships but makes bolder choices than the original would have.
  *   [ ] **A.** This is the same person, merely adjusted.
  *   [ ] **B.** This is a new person with the original's memories.
  *   [ ] **C.** This is the same person, but the Carrier assumes liability for behavioural deviations.
  *   [ ] **D.** There is no fact of the matter regarding personhood in cases of altered disposition.

  **ITEM 3: THE SLEEPING BACKUP**
  A traveller books the Branching Fare. The original sleeps at the origin. A recipient is built at the destination and kept in suspended animation. Three days later, the original dies of a heart attack. The recipient is then woken to assume the original's life.
  *   [ ] **A.** The recipient is the traveller, who has simply woken up late.
  *   [ ] **B.** The recipient is a new individual inheriting the estate of the deceased.
  *   [ ] **C.** The recipient is a legal fiction appointed to fulfil the deceased's obligations.
  *   [ ] **D.** There is no fact of the matter regarding who woke up.

  **ITEM 4: THE CONVERGENCE**
  Two branches of the same traveller (created via Branching Fare) live separate lives for one year. They both return to a station and are scanned. Their psychological profiles are spliced and merged into a single recipient body.
  *   [ ] **A.** One person results, possessing the rights of both predecessors.
  *   [ ] **B.** Two people ceased; one new person was created.
  *   [ ] **C.** The original traveller resumed existence, with the year's memories added.
  *   [ ] **D.** There is no fact of the matter regarding the result of a merge.

  **ITEM 5: THE POST-MORTEM SCAN**
  A traveller dies at the origin station due to a medical event unrelated to transit. One hour after certified death, their body is scanned and a recipient is built at the destination using the stored data.
  *   [ ] **A.** The traveller has been restored to life.
  *   [ ] **B.** A new person has been created using the deceased's data.
  *   [ ] **C.** The deceased's legal estate has been reactivated in a new body.
  *   [ ] **D.** There is no fact of the matter regarding status after biological cessation.

  **ITEM 6: THE TRUNCATED COPY**
  A carrier error during a Branching Fare transit results in two recipients. Recipient 1 receives the full psychological scan. Recipient 2 receives a scan missing the last five years of memory. Both are physically identical.
  *   [ ] **A.** Both recipients are the traveller.
  *   [ ] **B.** Only Recipient 1 is the traveller; Recipient 2 is a distinct individual.
  *   [ ] **C.** Neither is the traveller; the original ceased at scan.
  *   [ ] **D.** There is no fact of the matter regarding which copy holds the claim.

  **ITEM 7: THE VALUE REVERSAL**
  A traveller arrives at the destination with all standing desires and evaluative commitments reversed (e.g., loving what they hated, hating what they loved). Memory and reasoning capacity remain intact.
  *   [ ] **A.** This is the same person who has undergone a radical change of mind.
  *   [ ] **B.** This is a new person inhabiting the traveller's body.
  *   [ ] **C.** This is the same person, but unfit to assume prior contracts.
  *   [ ] **D.** There is no fact of the matter regarding survival of character.

  **ITEM 8: THE SYNTHETIC CEREBRUM**
  A traveller's biological brain is destroyed and replaced by a synthetic device that preserves overt behaviour and memory access perfectly, but lacks biological neural tissue. The body is then transported conventionally.
  *   [ ] **A.** The traveller survived the surgery.
  *   [ ] **B.** The organism died; the device simulates the traveller.
  *   [ ] **C.** The traveller is now the device, not the organism.
  *   [ ] **D.** There is no fact of the matter regarding the necessity of biology.

  **ITEM 9: THE DOUBLE ARRIVAL**
  A system error during a Single-Copy Guarantee transit causes two identical recipients to be assembled at the destination simultaneously. Both claim to be the traveller.
  *   [ ] **A.** Both claims are valid; the traveller is now two people.
  *   [ ] **B.** Both claims are invalid; the traveller died in transit.
  *   [ ] **C.** One claim is valid, to be decided by lot or arrival sequence.
  *   [ ] **D.** There is no fact of the matter regarding which copy is the original.

  **ITEM 10: THE MEMORY GAP**
  A transit error causes the recipient to lack memories of the journey itself and the 24 hours prior to scanning, though all other memories and traits are intact.
  *   [ ] **A.** The traveller survived with minor data loss.
  *   [ ] **B.** The traveller ceased; the recipient is a successor with a gap.
  *   [ ] **C.** The traveller survived, but cannot be held liable for actions in the gap.
  *   [ ] **D.** There is no fact of the matter regarding continuity across gaps.

  ***

  # SCORING KEY & DIAGNOSTIC APPARATUS
  *(For Internal Use Only – Office of Survivorship)*

  ### I. Position Mapping
  The following positions are derived from answer clusters. **Do not disclose these labels to applicants.**

  1.  **Psychological Continuity + No-Branching (Lockean):**
      *   *Profile:* Selects **A** on Standard/Revision cases (2, 7, 10). Selects **B** or **C** on Fission/Branching cases (3, 6, 9).
      *   *Logic:* Survival requires psychological continuity, but uniqueness is essential. Fission is death.
  2.  **Psychological Continuity + Branching (Lockean + Fission):**
      *   *Profile:* Selects **A** on almost all continuity cases (1, 2, 3, 6, 9, 10).
      *   *Logic:* Survival is psychological continuity. Fission is survival (as two).
  3.  **Non-Reductionist (Further Fact):**
      *   *Profile:* High frequency of **D** (No Fact) on physical disruption cases (1, 5, 8). Selects **B** on Scan cases.
      *   *Logic:* Survival depends on a metaphysical fact beyond physics/psychology. Often aligns with "Death" on scans but admits indeterminacy.
  4.  **Organism View (Animalism):**
      *   *Profile:* Selects **B** on all Scan/Replacement cases (1, 5, 8). Selects **A** only on conventional travel or minor edits (2, 10).
      *   *Logic:* We are biological organisms. Scan/Rebuild = Death.
  5.  **Narrative/Self-Constitution:**
      *   *Profile:* Selects **A** on Revision (2) if story holds, **B** on Conversion (7) if story breaks. Selects **C** (Legal Fiction) on Merge (4).
      *   *Logic:* Survival depends on the coherence of the life story.
  6.  **Reductionist (What Matters):**
      *   *Profile:* Selects **C** (Legal Successor/Fiction) frequently. Acknowledges continuity but treats "Identity" as a legal convention.
      *   *Logic:* Identity isn't what matters; Relation R (psychological connectedness) is.
  7.  **Deflationary (No Self):**
      *   *Profile:* Selects **D** (No Fact) on 6 or more items.
      *   *Logic:* No persistent self exists to survive. Questions are category errors.

  ### II. Diagnostic Limitations (Indistinguishable Pairs)
  *   **Organism View vs. Non-Reductionist:** On Form 88-B, these yield nearly identical legal outcomes (Scan = Death). The form cannot distinguish between "I am my body" and "I have a soul that leaves my body." Both reject the Branching Fare as survival.
  *   **Reductionist vs. Psychological Branching:** A Reductionist may tick **A** (Both are valid) on Item 9 for pragmatic reasons, indistinguishable from the Branching View. The distinction is metaphysical, not legal. The form only captures legal intent.
  *   **Narrative vs. Psychological Continuity:** On Item 2 (Revision), both may tick **A**. The Narrative view only diverges on Item 7 (Conversion). If a traveller skips Item 7 or answers inconsistently, these cannot be separated.

  ### III. Empty or Unoccupied Combinations
  *   **The "Resurrectionist" Incoherence:** Ticking **A** on Item 5 (Corpse Scan = Resurrection) but **B** on Item 1 (Slow Relay = Death).
      *   *Status:* **Incoherent.** If biological cessation doesn't kill (Item 5), gradual replacement (Item 1) shouldn't either. This pattern suggests a misunderstanding of the form, not a philosophical stance.
  *   **The "Fission Denier" Anomaly:** Ticking **B** on Item 9 (Double Arrival = Death) but **A** on Item 3 (Alibi Copy = Survival).
      *   *Status:* **Unattractive/Rare.** This implies survival depends on the *original's* death, not the copy's existence. Usually held only by those seeking insurance payouts (see Pragmatic Inconsistency).
  *   **The "Synthetic Soul":** Ticking **A** on Item 8 (Synthetic Brain = Survival) but **B** on Item 1 (Slow Relay = Death).
      *   *Status:* **Unthought.** Nobody has argued that biology is essential (Item 1) but specific synthetic hardware is sufficient (Item 8). Likely a data entry error.

  ### IV. Apparatus Note: Identity vs. Survival & Pragmatic Inconsistency
  **For Plot Development:**

  1.  **Identity vs. Survival Judgements:**
      *   **Identity Items:** Items 1, 5, 8, 9. These ask "Is this the *same* entity?" (Organism/Non-Reductionist focus).
      *   **Survival Items:** Items 2, 3, 6, 10. These ask "Does what *matters* continue?" (Reductionist/Psychological focus).
      *   **The Gap:** A character may believe Item 9 results in *two new people* (Identity Failure) but insist *both* should inherit the original's assets (Survival Success). This is the Parfitian gap. The law forces a binary choice; the philosophy allows a split.

  2.  **Pragmatic Inconsistency (The "Fare Cheat" Detection):**
      *   **The Trap:** Compare Item 3 (Alibi Copy) and Item 9 (Double Arrival).
      *   **Inconsistent Pattern:** If a traveller ticks **A** on Item 3 ("The recipient is the traveller... simply woken up late") to qualify for the **Branching Fare** (arguing survival is preserved), but ticks **B** on Item 9 ("Both claims are invalid; the traveller died") to claim a **Death Benefit** on a will.
      *   **Detection:** The Office of Survivorship flags this as *Declaratory Fraud*. You cannot claim the Branching Fare preserves "You" for the purpose of travel, while claiming "You" died for the purpose of inheritance.
      *   **Plot Hook:** A character trying to buy the cheaper Branching Fare (which requires admitting the copy is "you") while simultaneously setting up their estate to pay out upon "death" (which requires admitting the copy is "not you") will trigger an audit on Form 88-B. The form catches them because it forces a single metaphysical stance across different contexts.

  3.  **Strategic Filling:**
      *   To qualify for **Branching Fare**, a traveller must score high on **Psychological Continuity + Branching**.
      *   To qualify for **Single-Copy Guarantee** (often required for high-security clearance), a traveller must score high on **Organism** or **No-Branching**.
      *   A character attempting to game the system must maintain consistency across Items 3, 6, and 9. Slipping on Item 6 (Unequal Branch) is the common failure point; admitting the truncated copy is *not* you undermines the claim that the full copy *is* you in Item 3.
