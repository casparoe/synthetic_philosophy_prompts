  **Office for Aesthetic Integrity**
  **Consultation Reference: OAI-2024-AX**
  **Draft Statutory Guidance on the Formation of Aesthetic Judgments**

  **1. Purpose and Scope**
  1.1 This Guidance establishes the procedural requirements for forming and expressing aesthetic judgments within the jurisdiction.
  1.2 The Office for Aesthetic Integrity (the Office) seeks to preserve the integrity of aesthetic discourse by ensuring that value assertions correspond to verified sensory experiences.
  1.3 Compliance is mandatory for all persons publishing criticism, curating public exhibitions, or engaging in designated public discourse regarding artistic works.

  **2. Definitions**
  2.1 **Aesthetic Judgment:** Any assertion regarding the value, affect, or quality of a work that cannot be resolved by measurement. This includes, but is not limited to: *profound, boring, moving, clumsy, well-made, overrated.*
  2.2 **Descriptive Predicate:** Any assertion regarding physical properties measurable by instrument or count. This includes: *running time, key signature, material composition, plot sequence.* Descriptive Predicates are exempt from this Guidance.
  2.3 **Verified Encounter:** Physical presence of the subject within the sensory field of the judge for the duration of the work's presentation.
  2.4 **Boundary Rulings:** The Office notes that predicates such as *funny* or *slog* occupy a borderline status. While these describe audience reaction, they are treated as Aesthetic Judgments because they imply a quality inherent to the work rather than a statistical probability of response.

  **3. Prohibition on Inherited Verdicts**
  3.1 No person shall assert an Aesthetic Judgment regarding a work unless a Verified Encounter has occurred.
  3.2 Testimony regarding another person's experience constitutes evidence of social effect, not evidence of aesthetic value.
  3.3 To assert "This work is beautiful" without a Verified Encounter is to assert a fact without evidence. The Office considers this a category error comparable to certifying a building's safety without inspection.

  **4. Permitted Exceptions: Predictive Modelling**
  4.1 Critics may issue statements predicting the likely reaction of a third party (e.g., "Viewers will weep"), provided these are framed as hypotheses regarding the viewer rather than verdicts regarding the work.
  4.2 The Office observes that the substantive content of criticism has migrated entirely into this exception. While semantically distinct, the functional utility of "You will weep" and "It is moving" is identical.
  4.3 To maintain compliance without closing this loophole—which would halt critical industry—critics must append a Standard Disclaimer to all predictions.
  4.4 Repeated use of predictive modelling without empirical validation of viewer outcomes may trigger a Level 2 Compliance Review.

  **5. Works Unavailable for Encounter**
  5.1 Certain works cannot be subject to Verified Encounter by living judges (e.g., lost frescoes, unperformed scores, works held in private collections, performances scheduled for the twenty-seventh century).
  5.2 The Office shall not exempt these works from judgment, as cultural discourse requires their evaluation.
  5.3 **Licensed Surrogates:** Judgments may be formed by proxy via a Certified Surrogate who has achieved Verified Encounter.
  5.4 **Deemed Encounter:** Where no Surrogate exists, a panel may declare a Deemed Encounter based on archival descriptions.
  5.5 The Office acknowledges that a Deemed Encounter relies entirely on the testimony of others. However, provided the testimony is processed through the correct forms, the resulting judgment is compliant. This ensures the principle is maintained even when the experience is not.

  **6. Worked Example**
  6.1 **Subject:** A film with a runtime of 142 minutes, featuring color cinematography and a narrative involving maritime travel.
  6.2 **Non-Compliant Statement:** "The film is a masterpiece of pacing." (Implies inherent quality without proof of viewing).
  6.3 **Compliant Statement:** "The film has a runtime of 142 minutes. Based on a Verified Encounter, I assert it is a masterpiece."
  6.4 **Compliant Prediction:** "Viewers sensitive to maritime narratives will find the pacing masterful." (Requires Standard Disclaimer).
  6.5 **Proxy Compliance:** If the film is lost, a Licensed Surrogate may view a restoration and file Form OAI-44. The Surrogate's judgment becomes the public record.

  **7. Risk Register and Dissenting Views**
  7.1 **Risk ID:** R-09 (Discourse Friction).
  7.2 **Description:** Stakeholders note that ordinary critical practice functions effectively without verification protocols. Implementing this Guidance would render most casual conversation about art either unlicensed or factually false.
  7.3 **Mitigation:** The Office dismisses this concern. The inconvenience to ordinary speech is a necessary calibration to ensure truthfulness. That people currently speak freely does not prove they speak accurately. The reduction in volume of aesthetic assertion is a feature, not a bug.

  **8. Verification and Enforcement**
  8.1 The Office cannot verify every encounter personally. Inspectors are not required to have encountered every work in the jurisdiction.
  8.2 Compliance will be audited via signed attestations from the judge.
  8.3 Inspectors will rely on panel consensus reports and submitted forms to verify that a Verified Encounter occurred.
  8.4 Where an Inspector has not encountered the work, they shall accept the signed form of the judge as conclusive evidence of the encounter.
  8.5 This reliance on third-party documentation ensures the system remains scalable while adhering to the principle that judgment requires acquaintance. The Inspector's judgment on the compliance is based on the form, which is a Descriptive Predicate.

  **9. Conclusion**
  9.1 This Guidance clarifies the conditions under which aesthetic value may be asserted.
  9.2 By separating experience from report, the Office ensures that beauty remains a matter of encounter rather than inheritance.
  9.3 Comments on this draft should be submitted via the portal by the closing date.

  **Issued by the Office for Aesthetic Integrity.**
  **Date: 14 October 2024.**
