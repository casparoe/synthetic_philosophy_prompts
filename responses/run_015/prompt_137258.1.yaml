  # WHEN DID YOU SEE IT?
  ### A Decision Tree for the Color-Phi Puzzle

  **The Setup:** We agree that (1) a Red dot flashes, then (2) a Green dot flashes, but (3) people report seeing *one* dot move and change color mid-path. The Green light hasn't happened when the "mid-path" experience supposedly occurs.

  **START:** **Is there a single, exact nanosecond when the experience switches from "unconscious processing" to "conscious experience"?**

  *   **NO** → Go to **Question A**.
  *   **YES** → Go to **Question B**.

  ---

  ### QUESTION A: If there is no exact moment, *why* not?

  1.  **Is it because "rewriting memory" and "delaying experience" are just two different stories for the exact same physical brain events?**
      *   **YES** → **[LEAF 1: Equivalent Descriptions]**
      *   **NO** → Go to **A2**.

  2.  **Is it because "conscious" is a fuzzy word, like "tall" or "bald," with no sharp cutoff?**
      *   **YES** → **[LEAF 2: Matter-of-Degree]**
      *   **NO** → Go to **A3**.

  3.  **Is it because there is no single "screen" or place in the brain where consciousness happens?**
      *   **YES** → **[LEAF 3: No-Central-Theater]**
      *   **NO** → **[EMPTY SLOT]** *Incoherent: Claims no fact exists, but denies it's due to language, vagueness, or brain structure.*

  ---

  ### QUESTION B: If there is an exact moment, **could we ever build a machine to detect it, even in principle?**

  *   **NO** → **[LEAF 4: Quietist]**
  *   **YES** → Go to **Question C**.

  ---

  ### QUESTION C: **The Mismatch Case.**
  *Imagine a reflex (like an eye jerk) reacts to the Red dot **before** the Green dot appears, but the person later **says** they saw Green motion.*

  **Does that reflex prove the person was consciously aware of Red at that moment?**

  *   **YES** → **[LEAF 5: Determinate Fact / Original Content]**
  *   **NO** → Go to **Question D**.

  ---

  ### QUESTION D: **The Cancellation Case.**
  *The subject presses a button to cancel the Green flash entirely, but still reports seeing the dot turn Green.*

  **Did the brain wait for the Green flash to create the experience?**

  *   **YES** → **[LEAF 6: Determinate Fact / Reported Content]**
  *   **NO** → **[EMPTY SLOT]** *Incoherent: If the experience happened late (after Red) but didn't wait for Green, where did the "Green" info come from? If it was guessed, that's Leaf 6. If not, it's Leaf 5.*

  ---

  ## THE LEAVES: Positions & Commitments

  **LEAF 1: Equivalent Descriptions**
  *The "Orwellian" (memory edit) and "Stalinesque" (delayed show) stories are not different theories, just different metaphors for the same neural data.*
  *   **Awkward Commitment:** You have to accept that science can never choose between them because they aren't actually different claims.

  **LEAF 2: Matter-of-Degree**
  *There is a fact about when you saw it, but the boundary is vague, like the exact moment sunrise becomes "day."*
  *   **Awkward Commitment:** You have to accept there are borderline moments where it is neither true nor false that you are conscious.

  **LEAF 3: No-Central-Theater**
  *Consciousness isn't a finish line; it's a distributed process where different brain parts "know" things at different times.*
  *   **Awkward Commitment:** You have to deny that there is a single "you" inside your head watching the show.

  **LEAF 4: Quietist**
  *There is a true fact about when the experience happened, but it is hidden from science forever.*
  *   **Awkward Commitment:** You believe in a fact that can never influence anything or be known by anyone.

  **LEAF 5: Determinate Fact / Original Content (The "Orwellian" View)**
  *You really saw the Red dot first, but your memory was edited later to include the Green motion.*
  *   **Awkward Commitment:** You have to say your immediate memory of what you just saw can be totally fake.

  **LEAF 6: Determinate Fact / Reported Content (The "Stalinesque" View)**
  *Your brain held back the Red dot, waited for the Green info (or guessed it), and then showed you the whole movie at once.*
  *   **Awkward Commitment:** You have to say your brain is either a clairvoyant guesser or that you live hundreds of milliseconds in the past.

  *(Note for the Club: Some philosophers argue Question C cannot actually separate Leaf 5 and Leaf 6, as any test result can be re-interpreted. If you think that, you belong at Leaf 1.)*

  ---

  ## GLOSSARY
  *   **Conscious Experience:** The moment a perception feels like something to you (not just a reflex).
  *   **Determinate Fact:** A specific, objective truth that exists regardless of whether we can measure it.
  *   **In Principle:** Possible according to the laws of physics, even if we don't have the technology yet.
  *   **Reflex:** An automatic bodily reaction (like blinking) that doesn't require conscious thought.
