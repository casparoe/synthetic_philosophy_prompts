prompt: |-
  Hi all, retired chemist here, spent most of my career on reaction kinetics and now I'm spending retirement reading philosophy for fun. I keep running into this Condorcet jury idea that if each voter is even a little better than a coin flip, say 55% right, then a big enough majority vote is almost guaranteed to be right, as long as votes are independent.

  In the lab that independence proviso would have worried me a lot, because our triplicates often shared the same miscalibrated pipette or the same tired tech misreading plates, so they weren't really seperate checks at all. Can someone give me an intuitive explanantion, with a bit of simple math, of why independence does so much work here, and what actually happens when errors are correlated?

  It would help me if you used a tiny toy case, like 3 or 5 voters, and showed what happens to the majority accuracy when they all saw the same misleading piece of evidence versus when their mistakes are truly independent. And what if voters aren't all the same, like some are 70% reliable and some are systematically worse than chance, say 40%? Does adding more voters still help then, or can it hurt?

  No need for citations or reading lists, just walk me through the reasoning from scratch. And please end by saying how confident you are in what you claimed and single out the point you are least sure of.
