      *   *Sartrean Nuance:* Sartre doesn't deny we have a "past" or "character." He denies that these *cause* our actions. They are the *ground* of our actions, but we choose the meaning of that ground.
      *   *The "Necessarily" Question:* Does the institutional use *necessarily* deny transcendence? If the institution mandates the test for team building, does that force bad faith? Not necessarily. But the *excuse* usage does. I must distinguish between the *tool* and the *discourse* surrounding the excuse.
      *   *Confidence:* I am very confident in the *Being and Nothingness* reading regarding Bad Faith. I am less confident about how a modern Sartrean would reconcile this with psychological science (which Sartre was skeptical of).

  5.  **Finalizing the Structure:**

      1.  **Ontological Commitments:** Essence before Existence, In-itself.
      2.  **Agency & Responsibility:** Abdication via Bad Faith.
      3.  **Requirements vs. Accompaniments:** Categorization vs. Determinism.
