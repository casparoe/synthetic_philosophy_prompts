      *   *Voice:* "Dear Friend," "Warmly," etc.
      *   *Content:* Ensure the philosophical terms (folk psychology, propositional attitudes, phlogiston) are integrated naturally.

  5.  **Writing - Step-by-Step:**

      *   *Title:* **Dear Cortex**
      *   *Intro:* Welcome to the column where we leave folk psychology behind.
