  # Joint Statement of Adversarial Collaboration: The Ontology of the Left/Right Spectrum

  **Participants:** Camp A (Scope-Axis Realists) and Camp B (Historical-Coalition Skeptics)
  **Date:** October 26, 2023
  **Subject:** Whether the Left/Right political distinction tracks a deep psychological reality or a contingent coalitional accident.

  ## I. Agreed Claims Regarding Political Coalitions

  Both camps agree to the following premises regarding the mechanics of political organization and signaling:

  1.  **Coalitional Necessity:** Political governance requires the formation of coalitions large enough to win elections or enforce norms, necessitating the bundling of distinct policy positions into unified platforms.
  2.  **Label Utility:** The terms "Left" and "Right" are currently the dominant shorthand used by elites, media, and voters in Western democracies to signal coalition membership.
  3.  **Elite Signaling:** Political elites play a significant role in defining coalition boundaries and signaling to members which positions are consistent with coalition membership.
  4.  **Historical Flux:** The specific policy positions associated with the labels "Left" and "Right" have changed over time and vary across national contexts (e.g., the economic position of "liberals" in the 19th century vs. the 21st century).
  5.  **Individual Variation:** Individuals differ in their moral intuitions, social preferences, and policy desires, and these differences are not randomly distributed across the population.
  6.  **Measurement Validity:** Survey instruments can reliably measure self-reported political identity, specific policy preferences, and exposure to elite cues.
  7.  **Predictive Goal:** A successful theory of the Left/Right spectrum must explain why certain policy positions cluster together in the present day and account for why those clusters persist or dissolve over time.

  ## II. Disagreements and Empirical Cruxes

  The following table outlines the exact points of divergence, the specific cruxes that determine the validity of each camp's model, and the agreed-upon empirical tests to resolve them.

  | Domain | Camp A: Scope-Axis Realists | Camp B: Historical-Coalition Skeptics |
  | :--- | :--- | :--- |
  | **Core Ontology** | The Left/Right distinction reflects a stable, underlying moral-psychological split. Leftism tracks a preference for **expanding obligations outward** (to strangers, future generations, nonhumans); Rightism tracks a preference for **anchoring obligations** in existing roles, communities, and inherited practices. | The Left/Right distinction is a **temporary brand name** for alliances that flip constantly based on historical context. There is no deep psychological axis; consistency is primarily the result of **elite cue-taking** and social identity signaling. |
  | **Source of Clustering** | Policy positions cluster (e.g., abortion, immigration, climate) because they are all downstream expressions of the same underlying moral scope parameter. | Policy positions cluster because coalition managers bundle them to maximize voting blocs; individuals adopt the bundle to signal loyalty to the team, not because of logical or psychological consistency. |
  | **Interpretation of History** | Historical reversals (e.g., liberals switching from free-market to interventionist) are **surface noise**. The underlying moral logic (e.g., protecting the vulnerable vs. protecting tradition) remains constant even if the policy label flips. | Historical reversals are **fatal to the "real axis" claim**. If the content of "Left" and "Right" can swap entirely (e.g., free trade vs. protectionism), the labels cannot track a fixed psychological trait. |
  | **Crux 1: Predictive Power** | **Claim:** A single psychological dimension (Scope vs. Anchor) predicts cross-domain attitudes better than Party ID alone, especially where party cues are weak. | **Claim:** Party ID (and exposure to elite cues) predicts cross-domain attitudes better than any psychological dimension; psychological measures add no unique variance once cues are controlled. |
  | **Test Design for Crux 1** | **Novel Policy Survey:** A large-N study presenting respondents with **novel political issues** where party positions are undefined or experimentally scrambled. Participants are measured for (1) Scope/Anchor moral intuition and (2) Party ID. | **Same Design:** The study measures the variance in policy support explained by moral intuition scores versus Party ID/cue exposure on issues where participants cannot rely on established heuristic bundles. |
  | **Camp A Prediction** | Scope/Anchor scores will significantly predict stance on novel issues even when Party ID is controlled for. People will intuitively align new policies with their moral scope regardless of team branding. | Party ID (or assigned team label in the experiment) will predict stance on novel issues. Moral intuition scores will fail to predict views once the "team" signal is accounted for. |
  | **Crux 2: Historical Reversals** | **Claim:** Historical flips are compatible with a real axis if the *moral justification* remains stable even if the *policy tool* changes. | **Claim:** Historical flips demonstrate that the axis is constructed to suit coalitional needs, not psychological constraints. |
  | **Test Design for Crux 2** | **Historical Text Analysis:** A comparative analysis of rhetorical justifications for policy flips (e.g., 19th-century vs. 21st-century liberalism). Coding focuses on whether the *moral reasoning* (scope vs. anchor) remained constant despite the policy reversal. | **Same Design:** Analysis focuses on whether the moral reasoning itself flipped to justify the new coalitional necessity, or if it was retrofitted post-hoc. |
  | **Camp A Prediction** | The moral reasoning will show continuity (e.g., both eras claimed to protect the "little guy" or "national integrity" using the Scope/Anchor logic consistent with their side), proving the axis is deeper than the policy. | The moral reasoning will show discontinuity or contradiction (e.g., "freedom" is invoked to justify opposite policies), proving the reasoning is post-hoc rationalization for coalitional alignment. |
  | **Verbal Dispute Note** | Camp A defines "real" as **"psychologically rooted and cross-situationally consistent."** | Camp B defines "real" as **"historically stable and independent of elite construction."** |
  | **Resolution on Terminology** | Both sides agree that if Camp A wins Crux 1, the axis is "psychologically real" even if historically flexible. Both sides agree that if Camp B wins Crux 2, the axis is "sociologically constructed" even if psychologically convenient. | |

  ## III. Commitment to Outcomes

  Both camps agree that the results of the designs listed above will update their credences as follows:

  *   **If Camp A's predictions hold:** Camp B agrees to update toward the view that moral psychology constrains coalitional formation, acknowledging that Left/Right is not *merely* an accident.
  *   **If Camp B's predictions hold:** Camp A agrees to update toward the view that the Scope/Axis is a post-hoc rationalization used by elites to stabilize coalitions, acknowledging that Left/Right is not a deep psychological natural kind.
  *   **If results are mixed:** Both sides agree to refine the model to account for interaction effects between psychological predisposition and elite signaling strength.
