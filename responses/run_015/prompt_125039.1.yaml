  hey, can you draft the joint statement for an adversarial colab between two camps on whether left/right is actually real or just a coalitional accident? Camp A are the 'scope-axis realists' — they think left and right track a deep moral-psychologial split between people who think obligations should expand outward (to strangers, future generations, nonhuman animals) and people who think obligations stay anchored in existing roles, communities, and inherited practices. They claim this one axis predicts clustering across abortion, immigration, climate, and tax policy even when people don't know party positions. Camp B are the 'historical-coalition skeptics' — they say left and right are temporary brand names for alliances that flip constantly, pointing to 19th-century liberals being free-market anti-clericals while modern ones are interventionist, and to left-nationalist vs right-libertarian movements. They think any cross-domain consistency is just elite cue-taking.

  I want the document both could sign: (1) a numbered list of agreed-claims about how political coalitions form, shift, and signal; (2) the exact disagreements phrased so each camp accepts the wording of its own side; (3) the cruxes — I think one is whether there's a single psychologial dimension that predicts cross-domain attitudes better than party ID alone, and another is whether historical reversals (like liberalism's economic flip) are fatal or just surface noise; (4) for each crux, a concrete case or study design both sides agree bears on it, with each side's prediction written down. Also say whether part of the dispute is just verbal about what 'real' means. Format: agreed claims then a disagreements table. Don't ask for a bibliography or cite specific papers — just draft it.
