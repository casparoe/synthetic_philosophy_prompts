      *(Refining the Cut-off)*: If the conclusion is false, there is a cut-off. If there is no non-arbitrary story, the view is vulnerable to the "arbitrariness objection." I need to suggest that the cut-off might be *conceptual* (e.g., "capacity to form a plan") rather than *phenomenal* (pain intensity).

      *(Refining the Defeaters)*: Make sure to clearly separate "Fatal" from "Awkward." Transitivity failure is fatal to the *argument*, but maybe not the *conclusion* (one could hold the conclusion for other reasons). But for *this* argument, transitivity failure is fatal.

      *(Refining the Evidence)*: Be honest. There is no evidence. It's a coherence test.

