          *   If Nozick says "No" to simulation, he admits pleasure isn't the only good.
          *   If pleasure isn't the only good, the animal utilitarianism collapses.
      *   *Conclusion: The Worst Tension.* The discontinuity between Persons and Animals. The "Speciesism" charge. The Experience Machine proves value is objective/real, not just subjective feeling. Applying this only to humans creates an arbitrary line.

