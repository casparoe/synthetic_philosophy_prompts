      *   If value isn't just pleasure/pain, then the utilitarian calculus for animals is wrong.
      *   Nozick wants to have it both ways: Persons have deep value (rights/reality), animals have shallow value (pleasure/pain).
      *   *2025 Tech exposes this:* Simulated cows force him to choose. Are cows "persons-in-waiting" (deserving reality) or "feeling-machines" (deserving max pleasure)?
