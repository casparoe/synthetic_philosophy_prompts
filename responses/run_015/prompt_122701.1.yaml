  3.  **Drafting Section 1: Agreed Claims:**
      *   Need substantive claims both can sign.
      *   *Claim 1 (Definition):* Define moral trade precisely based on the prompt's background.
      *   *Claim 2 (Pareto Improvement):* A trade only happens if both expect to be better off by their *own* lights.
      *   *Claim 3 (Internal Diversification):* Acknowledge that moral uncertainty allows for internal "trade-like" allocation.
      *   *Claim 4 (Comparative Advantage):* Acknowledge that differing causal positions *can* create surplus.
      *   *Claim 5 (Integrity Cost):* Acknowledge that acting against one's verdict *might* incur a cost, but disagree on magnitude/nature.
      *   *Claim 6 (Information):* Acknowledge that private information about intentions creates friction.
      *   *Refinement:* Make sure these aren't trivial. They need to set the stage for the disagreement.

  4.  **Drafting Section 2: Disagreements Table (The Core):**
      *   *Crux 1: Decomposition of Surplus.*
          *   Optimist: Comparative advantage is the main driver; internal diversification misses cross-agent efficiency.
          *   Skeptic: Diminishing returns dominate; internal diversification captures almost all surplus.
          *   Case: The Two-Donor Case (Identical resources/abilities, different values).
          *   Prediction: Optimist says trade yields >10% gain over status quo. Skeptic says <1% gain (mostly transaction costs).
      *   *Crux 2: The Permissible Margin.*
          *   Optimist: Most moral views have large supererogatory margins suitable for trade.
          *   Skeptic: Most high-stakes views are demanding (required/forbidden), leaving little room.
          *   Case: The Demandingness Scenario (Utilitarian vs. Deontologist).
          *   Threshold: If >50% of budget is "required," trade collapses.
      *   *Crux 3: Incentive Compatibility.*
          *   Optimist: Reputation/contracts solve the "would-have-done-anyway" problem.
          *   Skeptic: These mechanisms just add cost or move the lie to a different level (e.g., claiming higher opportunity cost).
          *   Case: Repeated Interaction Model.
          *   Threshold: Discount factor $\delta > 0.9$ needed for Optimist; Skeptic says even then, baseline inflation occurs.
      *   *Crux 4: What is Lost.*
          *   Optimist: Integrity loss is psychological and manageable; expected value dominates.
          *   Skeptic: Integrity loss is moral/aretaic and subtracts directly from the value produced.
          *   Case: The Reluctant Trader (Acting against deep conviction).
          *   Threshold: If integrity cost > 5% of traded value, Skeptic says no trade; Optimist says trade still net positive.
      *   *Crux 5: Second-Order Disagreement.*
          *   Optimist: Different risk profiles create new trading surfaces (hedging).
          *   Skeptic: Incompatible decision rules prevent agreement on the "fair" split.
