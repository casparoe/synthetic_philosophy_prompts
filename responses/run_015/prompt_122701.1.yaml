answer: |-
  # Adversarial Collaboration: The Viability of Moral Trade

  **Authors:** [Trade Optimist] & [Trade Skeptic]
  **Date:** October 26, 2023
  **Subject:** Structural Analysis of Moral Trade Between Agents with Conflicting Final Values

  ## Part I: Agreed Claims

  The undersigned agree to the following substantive claims regarding the structure, conditions, and limits of moral trade. These claims form the common ground upon which our disagreements rest.

  1.  **Definition of Gain:** A moral trade occurs if and only if Agent A performs action $X$ (which A ranks lower than $Y$) and Agent B performs action $Y$ (which B ranks lower than $X$), such that both A and B expect the resulting state of the world to be higher in value according to their *own* final value functions than if each had acted unilaterally on their initial verdict.
  2.  **The Diversification Baseline:** An agent holding credences over multiple moral views can simulate the *outcome* of a moral trade by allocating resources proportionally to those credences (internal diversification). Both sides agree this internal allocation requires no counterparty, escrow, or enforcement mechanism.
  3.  **Comparative Advantage Condition:** Both sides agree that if Agent A is causally more efficient at producing Value Type 1 and Agent B is causally more efficient at producing Value Type 2, a swap where A produces Type 1 and B produces Type 2 generates a surplus independent of moral disagreement. The disagreement lies in how much surplus remains when causal efficiencies are equal.
  4.  **The Integrity Constraint:** Both sides agree that acting against one's own considered moral verdict may incur a cost (psychological, reputational, or moral). They disagree on whether this cost is intrinsic to the act or merely a psychological friction that can be trained away, and on whether it outweighs the gains from trade.
  5.  **Information Asymmetry:** Both sides agree that private information regarding an agent's counterfactual behavior (what they would have done without the trade) creates a "would-have-done-anyway" problem that threatens the stability of trade agreements.
  6.  **Non-Claim:** Neither side claims that moral trade is permissible if it requires either party to violate a constraint they regard as absolute (e.g., a deontological prohibition). Trade is restricted to the region of action that both parties regard as permissible, even if one regards it as suboptimal.

  ---

  ## Part II: Disagreements Table

  | Crux | Trade Optimist Formulation | Trade Skeptic Formulation | Shared Case / Argument | Predictions & Thresholds |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Decomposition of Surplus**<br>*(Comparative Advantage vs. Diminishing Returns)* | The primary surplus comes from **specialization of conviction**. Even with identical causal abilities, agents with certain, divergent values achieve higher expected value by swapping actions than by each diversifying internally, because internal diversification dilutes impact on the agent's primary value. | The primary surplus comes from **diminishing marginal returns**. If returns are linear, trade yields nothing without causal comparative advantage. Any surplus from diminishing returns is fully captured by a single uncertain agent diversifying internally; trade adds no structural value. | **Case 1: The Two-Donor Case**<br>Agents A and B each have $1M. A values Art exclusively; B values Welfare exclusively. Both can fund Art or Welfare with identical efficiency. Returns on funding are concave (diminishing).<br>*Question:* Does A funding Welfare and B funding Art (Trade) yield significantly more value than A and B each splitting $1M 50/50 (Internal Diversification)? | **Optimist:** Trade yields >15% surplus over Internal Diversification because "splitting" fails to fully satisfy either final value function.<br>**Skeptic:** Trade yields <1% surplus over Internal Diversification. The value function depends on world-states, not who pushed the button.<br>**Flip Threshold:** If the curvature of the value function is linear, Optimist concedes trade gain is zero. If curvature is logarithmic, Skeptic concedes gain exists but insists it is captured by uncertainty. |
  | **2. The Permissible Margin**<br>*(Optional vs. Required Action)* | Most high-impact moral views leave a large **supererogatory margin** (actions that are good but not required). This provides ample space for trade without forcing agents to violate requirements. | Most high-impact moral views (especially consequentialist ones) are **highly demanding**. The "required" region consumes most resources, leaving a negligible "optional" region where trade is permissible without violating one's own verdict. | **Case 2: The Demandingness Scenario**<br>Agent A is a Utilitarian (must maximize QALYs). Agent B is a Deontologist (must not lie, otherwise maximize welfare). A asks B to lie to save money for A's cause.<br>*Question:* Is there a region where B can trade without violating the prohibition on lying, while A accepts B's non-maximizing choice? | **Optimist:** In 80% of plausible real-world pairs, the required baseline leaves >40% of resources free for trade.<br>**Skeptic:** In 80% of plausible real-world pairs, the required baseline leaves <10% of resources free. Trade is structurally biased toward agent-neutral views that permit "selling out" requirements.<br>**Flip Threshold:** If the "required" portion of budget exceeds 90%, Optimist agrees trade volume collapses. If it is below 50%, Skeptic agrees trade is viable. |
  | **3. Incentive Compatibility**<br>*(The "Would-Have-Done-Anyway" Problem)* | Repeated interaction and reputation mechanisms can solve the incentive to exaggerate opportunity costs. Agents will truthfully reveal their counterfactuals to maintain access to future gains from trade. | Reputation mechanisms merely **relocate the lie**. Agents will exaggerate the *cost* of the trade (claiming they would have done the act anyway) rather than the act itself. Verification costs eat the surplus. | **Case 3: Repeated Interaction Model**<br>Agents play a trade game 10 times. In round 1, A claims funding Cause X costs them 10 units of value. B suspects it only costs 5.<br>*Question:* Can a contract be written that forces truth-telling without third-party enforcement of internal mental states? | **Optimist:** With a discount factor $\delta > 0.9$, truthful revelation is the Nash Equilibrium. Surplus loss to verification is <5%.<br>**Skeptic:** Even with $\delta = 1.0$, agents will inflate the baseline "cost" of the traded action. Surplus loss to verification and inflation is >50%.<br>**Flip Threshold:** If third-party verification of counterfactuals becomes possible (e.g., via brain scanning), Skeptic concedes the problem is solved. |
  | **4. What is Lost**<br>*(Integrity and Verdict Costs)* | Any loss from acting against one's verdict is **psychological** (discomfort) or **instrumental** (reputation). It is not a moral loss if the trade increases expected value by the agent's own lights. | Acting against one's considered verdict incurs an **aretaic/moral loss** (integrity cost) that is not captured by expected value calculations. This loss subtracts directly from the net value of the trade. | **Case 4: The Reluctant Trader**<br>Agent A believes funding X is morally best. A agrees to fund Y for trade. A feels "dirty" or "complicit" in Y.<br>*Question:* Is this feeling a bug to be fixed or a feature tracking real moral disvalue? | **Optimist:** Integrity cost is equivalent to a transaction fee. If trade surplus > fee, trade is rational. Cost is <5% of traded value for rational agents.<br>**Skeptic:** Integrity cost is a moral disvalue akin to a rights violation. It often exceeds the surplus. Cost is >50% of traded value for deeply held views.<br>**Flip Threshold:** If the agent can pre-commit to the trade rule (e.g., "I am a trader") before knowing the specific act, Optimist says cost vanishes. Skeptic says cost remains. |
  | **5. Second-Order Disagreement**<br>*(Decision Rules under Uncertainty)* | Different risk profiles (e.g., variance aversion) create **hedging opportunities**. A risk-neutral maximizer can trade with a risk-averse satisficer to smooth outcomes, creating surplus even with identical first-order values. | Incompatible decision rules prevent agreement on the **fair division of surplus**. A maximizer and a maximinimizer cannot agree on a unique trade price, leading to negotiation breakdown. | **Case 5: Risk Profile Mismatch**<br>Agent A maximizes Expected Value (EV). Agent B maximizes Minimum Value (Maximin). They consider a risky project with high EV but low floor.<br>*Question:* Can they construct a swap where A takes the risk and B takes the floor, such that both improve? | **Optimist:** Yes, unique swaps exist where A absorbs variance for B. Surplus is generated by matching risk tolerance.<br>**Skeptic:** No unique swap exists. B demands a guarantee A cannot rationally give without external enforcement. Trade fails.<br>**Flip Threshold:** If the risky project has a guaranteed positive floor, Skeptic concedes trade is possible. If the floor is zero, Optimist concedes trade requires external insurance. |
  | **6. Diagnosis**<br>*(Nature of the Dispute)* | This is primarily an **empirical/magnitude** dispute. We agree on the theory; we disagree on the curvature of value functions, the size of the permissible margin, and the friction of verification. | This is primarily a **normative/structural** dispute. The Optimist assumes value is fungible across agents; the Skeptic holds that value is agent-relative in a way that makes "gains" illusory. | **Joint Assessment**<br>Rows 1, 2, and 3 depend on unmeasured parameters (curvature, demandingness, verification cost). Rows 4 and 5 depend on normative definitions of integrity and rationality. | **Optimist:** 80% empirical, 20% normative. We need data on moral demandingness and transaction costs.<br>**Skeptic:** 20% empirical, 80% normative. No amount of data validates trading away integrity.<br>**Reframed Question:** "Under what specific parameter values (curvature $c$, integrity cost $i$, verification cost $v$) does the net surplus $S = f(c) - i - v$ remain positive?" |

  ---

  ## Part III: Joint Statement on Future Research

  We identify two specific parameters that require formal modeling to resolve the empirical portion of our disagreement.

  1.  **The Curvature of Moral Value:** In the *Two-Donor Case*, if the moral value function $V(r)$ for resources $r$ is linear, the Skeptic is correct that trade yields no surplus over internal diversification. If $V(r)$ is strongly concave (e.g., logarithmic), the Optimist is correct that specialization yields surplus. We recommend modeling $V(r)$ for common moral causes (e.g., poverty alleviation vs. arts funding) to estimate this curvature.
  2.  **The Integrity Cost Function:** We require a formalization of the "loss" described in Crux 4. If the cost is $C = k \cdot |Verdict - Action|$, we need to estimate $k$. The Optimist hypothesizes $k \approx 0$ for trained agents; the Skeptic hypothesizes $k \ge 0.5$.

  Until these parameters are estimated, we recommend that institutions for moral trade remain experimental and small-scale, limited to pairs of agents who share high trust and low demandingness constraints.

  **Signed,**

  [Trade Optimist]
  [Trade Skeptic]
