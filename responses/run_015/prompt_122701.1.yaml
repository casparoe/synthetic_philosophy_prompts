      *   *Check:* The "Two-Donor Case" needs to be specific. If they have identical abilities, where does the gain come from? It comes from diminishing marginal returns. If A cares 100% about X and B cares 100% about Y, and they swap, they both get what they want. But if A is uncertain, A might fund X and Y. The Skeptic says A funding X and Y is the same as A paying B to fund Y. The Optimist says B is more efficient/convicted. Wait, the prompt says "neither party is uncertain... except where a case explicitly says otherwise." So in the base case, A is 100% X, B is 100% Y.
