      *   *Crux 6: Diagnosis.*
          *   This needs to synthesize the nature of the disputes.
          *   Optimist: Empirical/Magnitude (we haven't measured the surplus yet).
          *   Skeptic: Normative/Structural (the surplus doesn't exist or is morally inaccessible).

  5.  **Developing the Stylized Cases:**
      *   *Case 1: The Two-Donor Case (Required).* Agents A and B. $100 each. A values Cause X, B values Cause Y. Both can fund X or Y equally well. No moral uncertainty.
