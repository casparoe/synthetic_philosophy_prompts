  Ok so this is a bit of a rabbit hole but bear with me. Over the holidays a friend who's doing a philosophy PhD got me arguing about money-pump arguments in decision theory -- it started because I brought up that Yudkowsky post about how "coherent decisions imply consistent utilities" (the AI safety crowd cites that one constantly) and she said that's the watered-down version of a much older and way more contested argument, and now I can't drop it. I'm a quant, mostly vol arb on index options, so my actual home turf is arbitrage pricing: no-arbitrage, static vs dynamic replication, bid-ask spreads and no-trade regions, synthetic construction, path-dependence. I don't have a philosophy background past some gen-eds in undergrad, so please don't just say "oh its basically a Dutch book" and treat that as an answer.

  Here's what I want. Restate the money-pump argument as precisely as you can, entirely in that vocabulary. Start with the plain-vanilla case -- cyclic preferences over three options, A over B over C over A, the bookie who trades you back to where you started but poorer -- and then take on the two extensions that are actually why I'm stuck: the sophisticated-vs-resolute-vs-naive debate (my friend lumps this whole cluster under "diachronic rationality") about whether foreseeing the pump, or just precommitting to a plan and refusing to renegotiate, gets you off the hook, and the newer argument that apparently you can pump incomplete preferences too -- no price at all between two options, not just a bad one. See if sophisticated-vs-resolute maps onto something like backward-induction pricing versus a hard no-renegotiation clause written into a structured trade, and see if the incompleteness stuff maps onto bid-ask spreads and no-trade regions. Don't force either mapping if it genuinely doesn't hold up.

  Then give me the residue report: what survives the translation cleanly, what only survives if you distort it, and what has flat-out no counterpart in arbitrage vocabulary. For every piece of residue, actually commit to an answer on the harder question -- is it there because arbitrage pricing is missing a concept it would need in order to say this, or because the philosophical disagreement (that rationality binds you across time at all, that a plan can obligate a future self, that "exploitable in principle but never actually exploited" still counts as irrational) is doing less work than the jargon makes it look like once the jargon is stripped away? Don't smuggle in an arbitrage-pricing assumption and call it a translation. Think this through properly rather than grabbing the first mapping that comes to mind, and answer like the sharpest decision theorist at the table, not like a glossary.
