      *   *Correction:* The incompleteness pump (e.g., by Gustafsson) argues that if you have a preference gap, you are vulnerable to a "money pump" that exploits your refusal to trade *unless* you pay to resolve the indeterminacy. Actually, the stronger argument is that if you have incomplete preferences, you violate Independence or Dominance.
      *   *Quant Angle:* Incomplete preferences = No unique pricing measure. Set of priors. Robust control. If the set of priors allows for a loop, you get arbitraged. If the set of priors just creates a wide bid-ask, you don't get arbitraged, you just don't trade. The philosophical claim is that *not trading* when you could gain is irrational. The quant claim is *not trading* when the edge is within the spread is risk management.
