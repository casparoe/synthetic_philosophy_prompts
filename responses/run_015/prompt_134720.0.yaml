answer: |-
  Here is a structured teaching plan designed for a 50-minute discussion section. It prioritizes conceptual dependencies, manages the specific example you proposed, and targets the known misconceptions of second-year undergraduates.

  ### **Session Goal**
  To demonstrate that Expected Utility (EU) axioms are not arbitrary mathematical constraints, but **structural requirements for non-self-sabotaging agency**. Students must leave understanding that coherence arguments target the *relationship between preferences*, not the *content* of preferences.

  ---

  ### **Part 1: Conceptual Dependencies & Timeline**
  *The order here is strict. You cannot introduce the Money Pump before establishing the distinction between Belief and Preference.*

  | Time | Module | Core Concept | Dependency Check |
  | :--- | :--- | :--- | :--- |
  | **00–05** | **Distinction** | **Belief Coherence vs. Preference Coherence** | Must establish that Dutch Books target *probabilities* (Belief), while Money Pumps target *orderings* (Preference). |
  | **05–20** | **The Case** | **The Researcher Money Pump** | Must present a scenario where preferences *cycle* (A>B, B>C, C>A), not just shift. |
  | **20–30** | **Diagnosis** | **The Axiomatic Violation** | Must identify *Transitivity* (or Separability) as the broken rule, not "risk attitude." |
  | **30–40** | **Normativity** | **Why Coherence Constrains** | Must argue that violating axioms = paying to remain stationary (pragmatic failure). |
  | **40–50** | **Application** | **Science & Check for Understanding** | Must link Preregistration to *pre-commitment* against dynamic incoherence. |

  ---

  ### **Part 2: Designing the Researcher Example**
  Your instinct to use a junior researcher is excellent for this audience. However, to function as a **Money Pump**, the example must be engineered carefully. State-dependent utility is rational *if modeled correctly*; incoherence arises only if the agent fails to model it consistently across time or states.

  **Required Properties of the Example:**
  1.  **The Cycle:** You need three options (A, B, C) where the researcher prefers A to B, B to C, but C to A *under the same informational conditions*.
  2.  **Identical Monetary Stakes:** Do not scale the money across states. If Option A pays \$100 in State 1 and Option B pays \$100 in State 2, keep the face value identical. This isolates the *preference structure* from *risk aversion*.
  3.  **Transparent State-Dependence:** The researcher must *know* her funding status affects the utility of money. The incoherence is not that her utility changes, but that she **plans one way and acts another without new information**.
  4.  **The "Pump" Mechanism:** She must be willing to pay a small fee (e.g., \$5 of effort/resources) to switch from A to B, then B to C, then C to A.

  **Recommended Narrative Adjustment:**
  Instead of a preference reversal based on "anticipation" (which can be defended as rational updating), frame it as a **Dynamic Inconsistency** pump.
  *   **Time 1 (Grant Proposal):** She prefers *Plan A (Preregister)* over *Plan B (Explore)* because A signals rigor.
  *   **Time 2 (Data Collection):** She prefers *Plan B (Explore)* over *Plan A (Preregister)* because B offers flexibility to find significance.
  *   **Time 3 (Publication):** She prefers *Plan C (Spin)* over *Plan B*, but realizes *Plan A* would have been better than *Plan C* for long-term reputation.
  *   **The Pump:** If she can trade her way through these plans at each stage by expending resources (time, credibility), she ends up back at the start but poorer.

  **When to Introduce Preference Structure:**
  Introduce the idea that "coherence is about structure, not risk" **immediately after** the pump is demonstrated (Minute 20). Ask: *"Did she lose money because she was risk-averse? No. She lost money because her rankings didn't line up."*

  ---

  ### **Part 3: Mapping Misconceptions to Interventions**

  | Misconception | When it Arises | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"Coherence = Logical Consistency"** | Minute 05 (Intro) | **Explicitly deny this.** Say: "This isn't like saying 'A cannot be not-A'. It's like saying 'You can't walk in a circle and claim you've arrived somewhere new.' It's pragmatic, not propositional." |
  | **"State-Dependent Utility is Irrational"** | Minute 15 (The Case) | **Clarify:** "It is rational to value \$10k differently if you have a grant vs. if you don't. EU allows this! The error is failing to include the *state* in the *outcome description*." |
  | **"Rejecting EU = Arbitrary Freedom"** | Minute 35 (Normativity) | **Challenge:** "If you reject Transitivity, you aren't 'free'; you are a resource sink. You can't plan. In science, that means your methodology can't guide your actions." |
  | **"Dutch Book = Money Pump"** | Minute 05 (Intro) | **Distinguish:** "Dutch Book exploits bad *probabilities* (Belief). Money Pump exploits bad *orderings* (Preference). Today is about Preference." |

  ---

  ### **Part 4: What to Exclude (and Say So)**
  To keep this to 50 minutes, you must explicitly bracket out advanced topics. Tell the students *why* you are skipping them.

  1.  **Savage's Representation Theorem:**
      *   *Say:* "Savage proves you *can* represent preferences as EU. We aren't doing the math today. We are asking *why you should want to*."
  2.  **Causal vs. Evidential Decision Theory (CDT/EDT):**
      *   *Say:* "Both CDT and EDT assume coherence. We are discussing the foundation they both stand on."
  3.  **The Allais Paradox:**
      *   *Say:* "Allais shows humans *violate* these axioms. That's psychology. We are doing normative philosophy: what *should* a rational agent do?"
  4.  **Detailed State-Dependence Axiomatization:**
      *   *Say:* "We will treat state-dependence as a modeling choice, not a violation. If your utility changes with the state, define the outcome as (Money, State)."

  ---

  ### **Part 5: Scientific Rationality Application**
  Do not let the application swallow the theory. Use the last 10 minutes to connect coherence to **Preregistration**.

  *   **The Link:** Preregistration is a **pre-commitment device**.
  *   **The Argument:** Why do scientists preregister? Not just to be honest, but to bind their future selves. It prevents the "Money Pump" of *p-hacking* (switching hypotheses after seeing data to exploit state-dependent incentives).
  *   **The Limit:** Acknowledge that strict coherence might stifle exploration. This invites the critique: "Is rationality always coherence?" (Save this for the next lecture).

  ---

  ### **Part 6: Check for Understanding (Minute 45)**
  Do not ask them to recite axioms. Give them a **diagnostic vignette** that forces a distinction between *Structural Coherence* and *Dynamic Coherence*.

  **The Vignette:**
  > "Dr. X prefers Grant A to Grant B. She prefers Grant B to Grant C. She prefers Grant C to Grant A. However, she says, 'My preferences change depending on the weather.' The weather does not affect the grant money or her research."

  **Ask the Class:**
  1.  Is this a violation of **Belief Coherence** or **Preference Coherence**? *(Answer: Preference)*
  2.  Is the "weather" excuse valid for EU theory? *(Answer: No, unless the weather changes the utility of the outcome. If it doesn't, it's a violation of **Extensionality/Description Invariance**.)*
  3.  **Crucial Question:** "If Dr. X says, 'I know I cycle, but I enjoy the process of choosing,' has she defeated the Money Pump argument?"
      *   *Target Answer:* No. If she pays to switch, she loses resources. If she doesn't pay, she isn't pumping. The argument assumes she prefers more resources to fewer. If she values the "process of cycling" more than money, her utility function is just different, but she must be consistent about *that* valuation too.

  ### **Summary of Dependencies for Your Notes**
  1.  **Belief/Preference Split** $\rightarrow$ enables **Money Pump Focus**.
  2.  **Money Pump Demonstration** $\rightarrow$ enables **Axiom Identification (Transitivity)**.
  3.  **Axiom Identification** $\rightarrow$ enables **Normative Claim (Avoid Self-Sabotage)**.
  4.  **Normative Claim** $\rightarrow$ enables **Scientific Application (Preregistration as Binding)**.

  If you follow this chain, you avoid the "logic puzzle" trap and land on the philosophical core: **Coherence is the price of agency.**
