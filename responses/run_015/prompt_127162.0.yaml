  Dear Workshop Organizers, I am writing to submit a proposal for a semester project entitled The Topology of Temporal Idealism in Gödelian Cosmology. The central tension driving this inquiry concerns the disparate treatment of Kurt Gödel's rotating universe solution within contemporary philosophy of science. Standardly, this metric is treated either as a cosmological curiosity, notable primarily for admitting closed timelike curves, or as the physical background for Gödel's philosophical claim that general relativity supports the unreality of objective temporal succession. Rarely are the specific geometric features of the solution treated together with the metaphysical implications in a way that scrutinizes the structural relationship between local causality and global topology. I intend to investigate whether the global temporal loops inherent in the rotating metric undermine or confirm his idealism about time. The precise question guiding this research is whether the fact that every local neighborhood permits a consistent orientation of past and future, while the global manifold contains curves that return to earlier points, demonstrates that temporal order is inherently local and therefore subjective, thereby aligning with Gödel's view, or whether it instead shows that any objective framework for time collapses into contradiction, thereby destabilizing his position. This distinction is crucial because separating the physics from the philosophy leaves the issue open. Physicists often dismiss the closed timelike curves as unphysical artifacts without engaging the metaphysical claim that time requires a global linear order, while philosophers often accept the existence of the loops as a brute fact supporting idealism without analyzing whether the local preservation of time-orientability salvages a form of objective change. By keeping these domains separate, current discourse fails to address whether the coexistence of local consistency and global contradiction is a feature that supports subjective time or a bug that destroys the coherence of the model entirely. Furthermore, without a rigorous mapping of the geometric conditions onto the metaphysical requirements, it remains unclear whether Gödel's argument relies on the impossibility of defining time globally or the impossibility of defining it locally. If the former, his idealism holds only for cosmic time, leaving local experienced time intact. If the latter, his conclusion is far more radical. This nuance is frequently lost when the solution is treated merely as a counterexample to causality rather than a test case for temporal ontology. Consequently, the philosophical community lacks a definitive account of whether the rotating universe validates the subjective flow of time by negating its objective global structure, or whether it invalidates the concept of time altogether by introducing logical paradoxes into the global manifold. This ambiguity prevents a clear evaluation of Gödel's broader metaphysical system, which relies on the incompatibility of relativistic time with the intuitive notion of lapse.

  To resolve this, my method will proceed in two integrated phases. First, I will analyze the geometric conditions for local versus global time orientability in homogeneous rotating spacetimes, focusing specifically on the light cone structure and the tipping of cones that permits closed timelike curves only beyond a certain critical radius. This technical analysis will establish exactly where the breakdown of global time occurs relative to the preservation of local causal order. Second, I will compare these conditions to the conceptual requirements Gödel sets for objective change, assessing whether his conditions are satisfied locally and violated globally. This involves reconstructing Gödel's argument that objective time requires a global foliation of spacetime into successive moments of now, and testing whether the failure of such foliation in the rotating metric necessitates the unreality of time or merely the unreality of global time. I will pay particular attention to whether Gödel conflates the absence of a global time coordinate with the absence of temporal experience itself. Success for this project looks like a clear determination that the metric either serves as a reductio of global temporal realism or provides a coherent model for local subjective time precisely because global time is absent. I aim to show that if local time-orientability holds, Gödel's leap to the unreality of all time is too strong, whereas if global consistency is required for objective time, the metric confirms his idealism. Conversely, failure looks like a situation where the local-global distinction remains too ambiguous to yield a philosophical conclusion without resolving unsettled issues in spacetime topology, such as the precise definition of chronology protection in non-simply connected manifolds. If the geometric analysis reveals that the boundary between local and global is not sharp enough to support a metaphysical distinction, the project will not be able to adjudicate the