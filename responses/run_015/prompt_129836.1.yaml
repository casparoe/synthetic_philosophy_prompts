prompt: |-
  hey, so I used to run experiments in a physics lab and now I'm retired and poking at philosophy of mind. I'm stuck on this thing about careeniums — those imaginary boxes full of simmballs that bounce around in paterns we read as symbol rules. Here's the argument I can't shake loose:

  (1) In a careenium it's all just physics; the simmballs push each other, and calling some paterns "symbols" is only us labeling what's there.

  (2) So symbols never actually push the substrate — substrate pushes substrate.

  (3) But then if I say my careenium is computing something, the computation isn't doing causal work; it's just me describing the bouncing.

  (4) To avoid that, I need the symbolic patern itself to make the substrate do something it wouldn't otherwise do — downward causation, basicly.

  (5) But downward causation shouldn't be special to careeniums; any system with interpertable patterns has it, like clouds or mud cracks.

  (6) So if symbolic patterns really push substrate, then clouds are literally running programs.

  (7) That's clearly nuts.

  Where's the slip? Is it (4) — maybe real computation just needs the right physical organization without extra causal push? Or is (5) wrong because not every patern counts as symbolic? I want to know which step costs me the least, and whether I've smuggled in that "real" computation needs something spooky.
