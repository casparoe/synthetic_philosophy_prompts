answer: |-
  Here is a breakdown to help you grade this.

  First, take a breath: **you are doing a great job.** Running a free philosophy discussion group without formal training is impressive, and your instinct that "confident tone $\neq$ correct logic" is exactly the right one to have.

  ### Part 1: Advice for You (The Marker)

  **The Mark:** **17 / 20**
  **Why:** This is a very strong answer for a casual discussion group. It引用 (cites) David Lewis, who is the actual leading philosopher on social conventions, which shows independent thought. However, it loses marks on internal consistency (the "visitor" argument contradicts the "convention" argument) and makes an assumption about the tipping wages that isn't in the text. It is better than a standard 16, but not quite a perfect 20.

  **On your grading scale:** Don't worry about giving 16s and 17s. In a voluntary adult education setting, "grade inflation" is often useful to keep morale high. The value isn't the number; it's the feedback. If you give detailed comments (like the ones below), the number matters less.

  **On your question:** It is **very good**. It forces a distinction between *harm* (tipping) and *coordination* (crossing).
  *   *One small tweak for next time:* In the tipping scenario, you wrote "menu says service is included." This makes the tip technically optional. The student argued the staff *need* the money. You might clarify: "Staff are paid a low base wage expecting tips" vs "Staff are paid a full wage." This stops students from having to guess the economic reality.

  ***

  ### Part 2: Feedback to Paste Back to the Student

  *You can copy and paste the text below directly to them. It is written in a supportive but rigorous tone.*

  **Mark: 17/20**

  **General Comments:**
  This is an excellent response. You have clearly done some reading around the subject (referencing David Lewis is a great touch), and you distinguish clearly between the two cases. You also avoid the trap of saying "rules are just rules" by analyzing *why* we follow them. To push this to a perfect score, you would need to tighten the logic on the "visitor" argument and be careful not to assume facts not in evidence regarding the tipping.

  **Point-by-Point Feedback:**

  > **"Following David Lewis, a convention is a solution to a coordination problem... So conventions do generate genuine obligations; they're not just manners."**

  **Credit:** This is the strongest part of your answer. Correctly identifying that conventions (like driving sides) are arbitrary in origin but binding in practice is key to answering the first part of the question. You earn full marks for the conceptual framework here.

  > **"It also follows that the obligation only exists where the coordination is at stake, so if nobody else is affected, the obligation lapses."**

  **Critique:** This is logically risky. If every individual decided the obligation "lapses" whenever *they* think no one is affected, the convention would collapse (this is known as the Free Rider problem). A stronger answer would acknowledge that we follow the rule even when the road is empty to maintain the *habit* and *trust* in the system, not just to avoid immediate collision.

  > **"When in Rome, do as the Romans do — but that's prudence, not morality. What's actually right and wrong for him is still settled by what people in Fenwick think..."**

  **Critique:** This contradicts your earlier point about Lewis. If obligations come from local coordination (as you argued above), then Dev is failing to coordinate with the people in Marlow. You can't argue that conventions create local obligations, but then say morality is determined by his home town. Either morality is local (Marlow rules apply) or universal. Picking one for the road and the other for morality is inconsistent.

  > **"The café staff in Marlow are paid a wage that assumes tips, so leaving nothing takes money out of somebody's pocket."**

  **Critique:** This is a plausible real-world assumption, but the prompt stated "service is included." A perfect answer would acknowledge that ambiguity: "If the service charge is included, the harm is less clear, but if social norms expect extra, breaking that norm damages trust." You treated an assumption as a fact.

  > **"Some places have conventions... that are bound up with keeping a certain group in their place. Those you should break..."**

  **Credit:** Excellent addition. This shows you aren't just following rules blindly but thinking about the *function* of conventions. This is high-level critical thinking and adds real value to the discussion.

  **Summary:**
  A sophisticated answer that brings in external theory effectively. To improve, watch out for internal contradictions (does the rule come from where I am, or where I'm from?) and distinguish between what is *likely* true (wages) vs what is *stated* in the scenario.

  ***

  ### Part 3: Why I Marked It This Way (For your eyes only)

  If you want to learn how to spot the difference between a 17 and a 20, here is what I looked for:

  1.  **The "Lewis" Hook:** A 20/20 answer might not name-drop Lewis, but it would explain the *logic* of coordination perfectly. This student name-dropped him but missed a nuance of his theory (that conventions rely on *common knowledge* that everyone will follow them, even when empty). That's why I deducted a point in the feedback.
  2.  **The Contradiction:** The student argues Dev is off the hook because "nobody saw him" (Consequentialist logic), but also because "he's from Fenwick" (Relativist logic). These are two different ethical defenses. A perfect answer would pick one and stick to it, or explain how they work together.
  3.  **The Tipping:** The prompt was tricky here. "Service included" usually means the legal obligation is met. The student assumed the staff would suffer financially. In a strict logic test, that's an assumption. In a discussion group, it's a valid social observation. I gave them credit for the observation but noted it as an assumption.

  **Final tip for you:** When you read future answers, look for the word **"because."** Every time they make a claim ("Dev did nothing wrong"), check the "because."
  *   *Weak:* "...because nobody saw him." (What if everyone thought that?)
  *   *Strong:* "...because the purpose of the rule is safety, and safety wasn't compromised."
  *   *Stronger:* "...because the rule relies on mutual expectation, and since there was no expectation to violate, no harm was done."

  You're doing great. Keep asking these questions.
