answer: |-
  # Activity Design: Dana's Four Lives

  ## 1. Materials & Preparation
  **You need to print/cut:**
  *   **18 Sets of Life Cards:** Each set contains 4 cards (A, B, C, D).
  *   **18 Verdict Sheets:** Double-sided handout (details below).
  *   **4 Sealed Envelopes:** Labeled "Group 1" through "Group 4." Inside each is a **Yardstick Card**.
  *   **1 Stack of Improvement Chits:** Small slips of paper with specific increments written on them (e.g., "+$500/yr," "+1 Exhibition," "+1 Hour/Week").
  *   **Poker Chips:** 10 per student (180 total).
  *   **Sticky Notes & Pens:** For recording group verdicts on the whiteboard.

  **The Four Lives (Print on Index Cards):**
  *   **Life A (Security):** Financial: 5/5 | Art: 1/5 | Love: 3/5 | Moral: 3/5
  *   **Life B (Art):** Financial: 1/5 | Art: 5/5 | Love: 3/5 | Moral: 3/5
  *   **Life C (Love):** Financial: 3/5 | Art: 3/5 | Love: 5/5 | Moral: 2/5
  *   **Life D (Moral):** Financial: 2/5 | Art: 2/5 | Love: 2/5 | Moral: 5/5
  *(Note: Levels are ordinal within the category. 5 is best, 1 is worst.)*

  **The Handout (Verdict Sheet):**
  *   **Header:** "Dana's Choice. Record your verdict for each pair. You must choose exactly one."
  *   **The 5 Options (per pair):**
      1.  Life X is better than Life Y.
      2.  Life Y is better than Life X.
      3.  They are equally good.
      4.  One is better, but I cannot tell which.
      5.  There is no common measure between them.
  *   **Chip Rule:** "To select option 1, 2, or 3, place 1 chip on your choice. To select option 4 or 5, place 2 chips. You have 10 chips total for 6 pairs. Unspent chips are discarded at the end of the round."
  *   **Back Side:** "Group Ranking. List the four lives from Best to Worst. If you cannot do this, write 'NO RANKING POSSIBLE'."

  **The Yardstick Cards (Inside Envelopes):**
  *   **Group 1:** "Your Unit: Dollars. Convert all values to financial terms. Rank accordingly."
  *   **Group 2:** "Your Unit: Hours with Loved Ones. Convert all values to time with people. Rank accordingly."
  *   **Group 3:** "Your Unit: Artistic Exhibitions. Convert all values to creative output. Rank accordingly."
  *   **Group 4:** "Your Unit: Lives Improved. Convert all values to moral impact. Rank accordingly."

  **The Default Option:**
  *   A sealed envelope on your desk labeled "Department Administrative Fund." (Symbolizes the unwanted default).

  ---

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Groups**
  *   Divide class into 4 groups of 4-5 students. Move chairs into clusters.
  *   Distribute: 1 Set of Life Cards per student, 1 Verdict Sheet per student, 10 Chips per student.
  *   **Instruction:** "You are advisors to Dana. Dana is not you. Do not use your personal preferences. Use only the values on the cards. You have 10 chips. Spending chips signals conviction. Unspent chips are wasted. For 'No Common Measure,' you must spend 2 chips."

  **00:05 – 00:20: Phase 1 (Local Verdicts)**
  *   **Task:** Groups compare adjacent pairs only (A vs B, B vs C, C vs D, D vs A, A vs C, B vs D). *Correction for time:* Assign specific pairs to groups to ensure coverage, or ask them to do all 6 but prioritize A vs B and C vs D.
  *   **Better for Time:** Assign each group **two specific pairs** to debate intensely using the chip mechanic.
      *   Group 1: A vs B
      *   Group 2: C vs D
      *   Group 3: A vs C
      *   Group 4: B vs D
  *   **Your Role:** Circulate. Listen for "I just prefer..." (Correct: "Argue for Dana."). Listen for "It depends..." (Correct: "The card is the world."). Watch chip spending. If a group quickly agrees on "No Common Measure," ask: "Did everyone spend the 2 chips? If not, why is the group verdict expensive?"
  *   **Early Finishers:** Ask them to predict what the other groups will decide.

  **00:20 – 00:35: Phase 2 (Mandated Yardsticks)**
  *   Distribute the 4 Sealed Envelopes. Each group opens theirs.
  *   **Task:** "You must now produce a single ranking of all four lives using *only* the unit in your envelope. Convert the values. Write the ranking on a sticky note."
  *   **Constraint:** "You cannot say 'this unit is wrong.' You must use it."
  *   **Your Role:** Watch for "Scale Drift" (e.g., Group 4 using Money despite having 'Lives Improved'). If caught, tap the envelope silently.
  *   **Output:** Groups stick their rankings on the whiteboard (4 columns).

  **00:35 – 00:45: Phase 3 (The Collision & Refusal)**
  *   **Task:** "Look at the board. Your local verdicts (Phase 1) and your Yardstick ranking (Phase 2) might conflict. You must now submit a final Global Ranking on the back of your handout."
  *   **The Stakes:** "If your group writes 'NO RANKING POSSIBLE,' your 40 collective chips (10 per student) go into the 'Department Administrative Fund' envelope. If you rank them, you keep the chips (symbolically)."
  *   **Goal:** Force them to feel the cost of refusing to rank.
  *   **Your Role:** Collect the handouts. Tally how many chose "No Ranking" vs. Forced Ranking.

  **00:45 – 00:55: Phase 4 (Spread Small Improvements)**
  *   **Plenary Activity:** Bring attention to the front. Pick the pair that had the most "No Common Measure" votes (likely A vs B).
  *   **Action:** Hold the stack of Improvement Chits.
  *   **Rule:** "We agreed A and B have No Common Measure. I am now adding +1 Financial Level to Life A." (Place chit on Card A).
  *   **Question:** "Has the verdict changed? Is A now better? Or still No Common Measure?"
  *   **Iteration:** Add chits one by one. Mix values (e.g., +1 Financial, then +1 Art to B).
  *   **Flip Point:** Eventually, a student will say "Okay, now A is better."
  *   **Ask:** "Which specific chit changed it? What was the difference between Chit 4 and Chit 5?"

  **00:55 – 01:15: Debrief (See Below)**

  ---

  ## 3. The Debrief

  ### Part 1: Mapping the Distinctions
  *   **Ignorance vs. Equality vs. Incommensurability:**
      *   Point to the **Chip Mechanic** (Phase 1). "When you spent 1 chip on 'Equally Good,' you claimed balance. When you spent 2 chips on 'No Common Measure,' you claimed a breakdown of the scale. The cost separated the 'tie' from the 'gap'."
      *   *Minute 15:* This is where the phenomenology happened. If you felt resistance spending the 2nd chip, that was the cost of denying a common scale.
  *   **The Artifact of the Scale:**
      *   Point to the **Whiteboard** (Phase 2). "Look at the four rankings. They are different. Life A was best for Group 1, worst for Group 3. The 'correct' ranking depended entirely on the envelope you were handed. This shows that a 'single correct ranking' is not discovered; it is imposed by choosing a unit of account."
  *   **Transitivity & Chaining:**
      *   "In Phase 3, you had to chain your local verdicts. If A ~ B (incommensurable) and B > C, is A > C? To make a global list, you had to pretend the incommensurability wasn't there. That discomfort was the violation of transitivity."
  *   **The Small Improvement Argument:**
      *   "In Phase 4, we added tiny improvements. If A and B are truly incomparable, adding a tiny bit to A shouldn't suddenly make A *better* than B. It should just be 'A-plus and B are incomparable.' But eventually, you said A is better. You found a tipping point. This suggests either: (1) Incommensurability is fragile (one small change breaks it), or (2) You were actually ignorant all along, and the chits just gave you enough info to see the truth."

  ### Part 2: Troubleshooting (What Will Go Wrong)
  *   **"It's Just Preference":**
      *   *Symptom:* A student says, "Dana should just pick what she likes."
      *   *In-the-Moment Fix:* "Dana is a fictional agent with fixed values on the card. We are testing the structure of the values, not Dana's psychology. Stick to the numbers."
  *   **"Scale Drift" (Using Money anyway):**
      *   *Symptom:* Group 4 (Moral Unit) starts talking about salary.
      *   *In-the-Moment Fix:* Tap the envelope. "Your currency is Lives Improved. You cannot spend Dollars here. Convert or stop."
  *   **"The Dominant Voice":**
      *   *Symptom:* One student dictates the verdict.
      *   *In-the-Moment Fix:* "Show me the chips. If Sarah says 'Incommensurable' but only put down 1 chip, her verdict doesn't count. The chips are the vote."
  *   **"It Depends on the Person":**
      *   *Symptom:* "Well, for *some* people, Art is worth more."
      *   *In-the-Moment Fix:* "The card defines the value for Dana. 5/5 Art is the max for Dana. We are testing if *values* compare, not if *people* differ."
  *   **"Chits are Measurement Error":**
      *   *Symptom:* "We just needed more precise numbers to decide."
      *   *In-the-Moment Fix:* "The levels are ordinal, not cardinal. Adding +1 doesn't make it more precise; it makes it *more*. If it was just measurement, the first chit should have solved it. It didn't."
  *   **"Wildly Different Speeds":**
      *   *Symptom:* Group 1 finishes in 5 mins; Group 4 takes 20.
      *   *In-the-Moment Fix:* Give fast groups the "Early Finisher" task (predict other groups' rankings). Do not let them start Phase 2 until all groups are done Phase 1. Use the whiteboard to hold them.

  ### Part 3: Limitations (What This Cannot Do)
  *   **Values vs. Us:**
      *   "This activity creates structural pressure, but it cannot tell you if the 'gap' is in the world (the values themselves) or in us (our cognitive limitations). You felt the block, but you don't know the source. That is the central metaphysical debate you will read about next."
  *   **Lived Stakes:**
      *   "Dana is a card. You are not Dana. A real hard choice constitutes who you are. You don't feel the *regret* here because you don't lose a part of yourself by choosing A over B. This is a simulation of the logic, not the phenomenology of a life lived."
  *   **The "Forbidden Scale" Objection:**
      *   "Some philosophers argue we *should not* rank these lives at all. But this game forced you to rank them (Phase 3) or lose your chips. You felt that forcing was wrong. **Use that discomfort.** The fact that the Yardstick exercise felt like an 'artifact' or a 'violation' is evidence for the view that some values resist measurement. If you felt dirty converting Love into Dollars, that feeling is the data point for the 'Incommensurabilist' view. Do not treat your discomfort as a failure of the game; treat it as the success of the theory."

  ---

  ## 4. Instructor Notes on the Chip Mechanic (Honesty Check)
  *   **What it adjudicates:** It separates "I don't care" (0 chips/Equal) from "I care enough to break the game" (2 chips/Incommensurable). It makes Incommensurability a *costly signal*.
  *   **What it cannot adjudicate:** It cannot distinguish "Ignorance" (Option 4) from "Incommensurability" (Option 5) perfectly. Both cost 2 chips.
  *   **How to present this:** In the debrief, admit this. "Both Ignorance and Incommensurability were 'expensive' claims. Why? Because both block the easy path of ranking. The game groups them as 'resistance to ranking.' Your job in the reading is to untangle whether that resistance is lack of data (Ignorance) or lack of scale (Incommensurability)."

  ## 5. Contingency: If Groups Finish Early
  *   **The "Devil's Advocate" Card:** If a group finishes Phase 1 early, hand them a sticky note that says: "One of these four lives is a trap. It looks good on paper but fails in reality. Which one?" This forces them to look for qualitative differences beyond the numbers, priming the Incommensurability discussion.
  *   **Whiteboard Watch:** Have them write their "hardest pair" on the board. This gives you a ready-made list for Phase 4 (Small Improvements).

  ## 6. Contingency: If Groups Refuse to Rank (Phase 3)
  *   If a group writes "NO RANKING POSSIBLE," **do not penalize them.**
  *   **Action:** Take their chips and put them in the "Department Admin" envelope visibly.
  *   **Debrief Point:** "Group 2 chose to lose their chips rather than rank. Was that rational? If values are truly incomparable, losing the chips might be the only honest move. This is the 'Refusal that Costs Something' in action."
