  4.  **Developing Replies (90 seconds, concessions, soft spots):**
      *   *Constraint:* Must be spoken, conversational, not overly jargon-heavy (regarding Parfit), but firm on the philosophical distinction.
      *   *Concession:* Always acknowledge the empirical reality they point to.
      *   *Soft Spot:* Where the philosophy might be dodging the empirical bullet.

  5.  **Identifying the "One Reply That Must Land":**
      *   It has to be the one that validates their data while keeping the philosophical framework. Probably the response to the Paleoclimatologist or the Community Archaeologist. Actually, the *Community Archaeologist* is the most dangerous socially. But the *Paleoclimatologist* is the most dangerous epistemologically.
      *   *Decision:* The response to the **Community-Engaged Archaeologist**. If the audience thinks this is a political erasure tool, the talk is dead. It needs to reframe "collapse" as a value judgment that *can* harm descendants.

  6.  **Identifying the "Prayer Question" (The Achilles Heel):**
      *   The prompt asks for the question about *my own criterion of persistence*.
