  **3. What I concede up front**
  I need to admit the ledger is currently a theoretical construct, not a finalized spreadsheet. Measurement involves counterfactuals we can't perfectly observe, and I'm not claiming otherwise. I also concede that unconditional cash isn't a magic bullet for development; it's specifically for discharging debt. I should state clearly I'm not arguing for closing borders or ending trade, but reforming the coercive elements within them. Finally, I concede this doesn't replace humanitarian aid for acute crises; it addresses structural obligation. Giving this away stops them from treating a normative framework as an empirical audit.

  **4. The hill**
  The core claim is that the moral basis for transfer is rectification of coercive institutional exposure, not altruism based on income levels. If the audience leaves thinking "aid should be based on need," I fail. If they leave thinking "even if need is the priority, there is a distinct, stronger claim based on imposed harm," I win. The shift from charity to justice is the non-negotiable element. Everything else is negotiable; this framing is not.

