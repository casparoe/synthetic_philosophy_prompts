  **4. Efficiency (Philosopher):** "Why focus on backward-looking liability instead of forward-looking harm reduction? If fixing a rule helps more people, why not do that?"
  *Reply:* Because justice matters independently of efficiency. Victims are owed recognition, not just optimized aggregates. Plus, rectification shifts the power dynamic, enabling better future rules than charity ever could.
  *Soft spot:* Hard to defend if the efficiency loss from rectification is massive.

  **5. History:** "You're treating current treaties as isolated contracts, ignoring that they rest on colonial legacies."
  *Reply:* I focus on currently coercive arrangements we can change today. History informs the ledger's depth, but current enforcement is the actionable liability. We need leverage now, not just historical accounting.
