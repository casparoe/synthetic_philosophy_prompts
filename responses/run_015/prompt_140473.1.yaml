answer: |-
  # WORKSHOP PREP SHEET: Concession Elasticity & Compromise

  ## STRATEGIC TRIAGE

  **1. The Objection That Sinks The Paper (If Unanswered)**
  *   **Who:** The Mechanism-Design Economist.
  *   **Why:** If elasticities are private information, your Pareto-improving logroll requires a mechanism that is incentive-compatible. Standard impossibility theorems (Myerson-Satterthwaite) suggest you cannot have efficiency, budget balance, and voluntary participation simultaneously. If agents strategize (claiming steep slopes to gain leverage), the "gains from trade" vanish. This renders your core thesis *theoretically possible* but *institutionally unreachable*.
  *   **Your Move:** Do not claim you have solved the mechanism design problem. Frame the paper as establishing a **normative benchmark**, not an institutional blueprint.
  *   **Say This:** "You're right that private information creates a barrier to *implementing* this ideal. I'm not proposing a voting rule or bargaining protocol that solves the revelation problem. I'm arguing that when we evaluate existing compromises, we should judge them by whether they track these elasticities, not by whether they split the difference. The inefficiency you point to explains *why* we see so few Pareto-optimal compromises, not why they aren't desirable."
  *   **Where The Reply Is Soft:** If your paper claims to offer action-guiding advice for constitutional design, this reply fails. You must admit the model describes a "first-best" that is likely unattainable, which weakens the "action-guiding" punch of the conclusion.

  **2. The Two To Concede In The First Two Minutes**
  *   **Who:** The Raz-Style Pluralist & The Rawlsians.
  *   **Why:** Fighting them forces you into foundational meta-ethics (incommensurability) or basic structure justice (priorities of liberty). You will burn 15 minutes defending premises rather than your contribution.
  *   **Say This (Raz):** "I accept that values are often incommensurable. My model doesn't require a common metric of value, only a shared ranking of *concessions*. I'm not measuring the value of the end, but the cost of the movement. If that still presupposes too much commensurability for you, I restrict my claim to contexts where agents already accept a shared decision procedure."
  *   **Say This (Rawls/Luck Egal):** "This model applies to the zone of permissible disagreement *after* basic justice is secured. I am not suggesting we logroll over basic liberties or fair equality of opportunity. If a dimension touches the basic structure, its elasticity is effectively infinite, and the model excludes it."
  *   **Where The Reply Is Soft:** You haven't actually defined where that line is. They will press you on what counts as "basic." Admit this is an external constraint your model takes as given.

  **3. The One You Hope Nobody Asks**
  *   **The Objection:** The Abolitionist/Slaveholder Problem.
  *   **The Question:** "Would your framework have told abolitionists to trade with slaveholders? If the slaveholder cares 'steeply' about keeping slaves and the abolitionist cares 'flatly' about procedural speed, doesn't your model recommend a deal that entrenches slavery?"
  *   **Why It Hurts:** It exposes the utilitarian undercurrent of "elasticity." It suggests your model legitimizes immoral status quos if the moral side's "elasticity" is lower than the immoral side's intensity.
  *   **Say This:** "No. The model presupposes that the dimensions under negotiation are morally permissible to trade. Slavery is not a negotiable dimension; it is a violation of the background constraints I mentioned to the Rawlsians. On dimensions that are morally permissible, intensity shouldn't veto justice. But where justice is settled, elasticity determines efficiency."
  *   **Where The Reply Is Soft:** This relies entirely on the "background constraints" escape hatch. If your endogenous elasticity claim is true (values drift), then "background constraints" aren't stable. This leads directly to your shaky section.

  ---

  ## DETAILED Q&A PREP (ORDERED BY DAMAGE)

  ### 1. The Incentive Compatibility Objection (Economist)
  *   **The Hit:** "If I know that conceding on 'flat' dimensions gets me my way on 'steep' ones, I have every incentive to lie and claim everything is steep. Your Pareto improvement requires truth-telling. Why would anyone be honest?"
  *   **Spoken Reply:** "I agree that strategic misrepresentation is the central hurdle. But notice that in repeated political interactions, reputation acts as a partial constraint. If you always claim maximum steepness, you lose the ability to signal when you *actually* care. My model explains the *structure* of successful logrolls we do see, not necessarily how to force them into existence."
  *   **Soft Spot:** Reputation effects are weak in large-scale anonymous politics. If the workshop pushes on "one-off" constitutional moments, you have no answer.

  ### 2. The Integrity/Corruption Objection (Dirty Hands/Realist)
  *   **The Hit:** "You argue integrity is preserved by conceding only on 'flat' dimensions. But the act of treating values as bargaining chips *is* the corruption. It instrumentalizes commitment. A person of integrity doesn't calculate the 'cost' of betraying a principle."
  *   **Spoken Reply:** "That assumes integrity means rigidity. I'm arguing for a distinction between *core commitments* (steep) and *policy preferences* (flat). Refusing to trade on flat dimensions isn't integrity; it's obstinacy. The corruption comes from trading the steep dimensions, which my model explicitly advises against."
  *   **Soft Spot:** The Realist will argue that the *calculation itself* is the dirt. You need to hold the line that instrumental rationality is not morally corrosive in the policy sphere.

  ### 3. The Incommensurability Objection (Raz-Pluralist)
  *   **The Hit:** "You talk about 'slope' and 'cost.' This implies a cardinal utility function. But if values are qualitatively distinct, I can't say conceding on X is 'cheaper' than conceding on Y. They are different kinds of loss."
  *   **Spoken Reply:** "I don't need cardinal utility. I only need ordinal ranking of concessions. You don't need to know *how much* cheaper X is than Y, only that X is cheaper than Y. As long as agents can rank their own willingness to concede, the logroll works."
  *   **Soft Spot:** If the Pluralist insists that some choices are "radically choice-worthy" without ranking, your ordinal claim fails. Concede scope (see Triage above) rather than fighting meta-ethics.

  ### 4. The Endogenous Elasticity Objection (Your Shaky Section)
  *   **The Hit:** "You claim conceding makes future concessions cheaper (elasticity increases). Isn't this just a formal way of describing moral corruption? If I trade on a principle, I care less about it next time. That's not 'drift,' that's erosion."
  *   **Spoken Reply:** "It can be erosion, but it can also be learning. Sometimes we think a dimension is steep because we haven't imagined the alternative. Conceding reveals that the world didn't end. The model doesn't distinguish between 'corruption' and 'adaptation'—that depends on whether the initial steepness was epistemically justified."
  *   **Soft Spot:** This is your weakest point. You are essentially admitting that the model can justify the gradual abandonment of correct principles if the "cost" of holding them drops. **Recommendation:** If pressed hard here, decouple this claim from the main thesis. Call it a "speculative extension" rather than a core argument. It is safer to treat elasticity as exogenous for the main proof.

  ### 5. The Power Asymmetry Objection (Luck Egalitarian)
  *   **The Hit:** "Elasticity isn't natural; it's produced by power. The poor concede on 'steep' dimensions because they have no choice. Your model might recommend a logroll that exploits the desperate, calling it a Pareto improvement."
  *   **Spoken Reply:** "A Pareto improvement requires voluntary participation. If coercion is present, it's not a compromise, it's submission. My model assumes a baseline of non-coercion. If power asymmetries distort the 'flatness' of a slope, that's a failure of the background conditions, not the bargaining model."
  *   **Soft Spot:** Luck Egalitarians will argue that background conditions are *never* equal. You must be willing to say: "This model is for ideal or near-ideal theory. It does not solve structural injustice."

  ---

  ## FINAL ADVICE ON THE "SHAKY SECTION"
  You asked if endogenous elasticity is a bug or a feature.
  *   **Verdict:** It is a **bug** for the Integrity Argument, but a **feature** for the Stability Argument.
  *   **The Trap:** If you use it to answer the Integrity Objection ("See? Compromise makes you care less, so it doesn't hurt!"), you confirm the Realist's fear that you are modeling corruption.
  *   **The Fix:** In the Q&A, treat endogeneity as a **risk**, not a benefit. "One danger of my system is that repeated logrolling might flatten slopes that ought to remain steep. This suggests we need institutional firewalls to protect certain dimensions from being traded, even if they are currently 'flat'." This turns the bug into a policy recommendation for constitutional rigidity.
