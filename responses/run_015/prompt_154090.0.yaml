  **The Principle of Normative Hierarchy and Structural Integrity**

  A legal self-reference is valid if and only if it satisfies three conditions:
  1.  **Logical Consistency:** The norm does not create a performative or propositional contradiction within the same normative layer (e.g., asserting irrevocability while forbidding it).
  2.  **Procedural Compliance:** The act of enactment complies with the procedural rules in force *at the time of enactment* (e.g., quorum, voting thresholds), regardless of the content of the new rule.
  3.  **Constitutive Continuity:** A constituted public body cannot exercise delegated authority to abolish the *minimum procedural constraints* that define its identity as a deliberative entity (e.g., reducing a quorum to zero or removing all membership requirements), even if the enabling text ostensibly permits it. Private actors, however, may waive such constraints via contract.

  **Application to the Unlisted Case**
  The statute attempting to void restrictions on its own amendment, enacted in violation of prior amendment rules, fails **Condition 2 (Procedural Compliance)**. Because the enactment procedure was defective under the higher-order norms existing at that moment, the statute is void *ab initio*. Its self-validating content ("restrictions... are void") cannot cure the procedural defect of its creation.

  **Accommodation of Case (4)**
  This principle **accommodates** your verdict on case (4). While the meta-board followed the text of the rules (satisfying Condition 2), eliminating its quorum entirely violates **Condition 3 (Constitutive Continuity)**. By removing the minimum constraint required for it to function as a "board" (a collective deliberative body), it attempts to transform itself from a constituted agent into a sovereign constituent power. This is the "illegitimate bootstrapping" you intuited: a creature cannot validly rewrite its own genetic code to cease being a creature and become a creator, absent original sovereign authority.

