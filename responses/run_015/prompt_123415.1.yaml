  1. **The Principle**
  **The Cooperative Fairness Principle:** You are morally obligated to adhere to a local convention if and only if doing so is necessary to prevent unfair exploitation of cooperators or foreseeable harm to those holding reasonable expectations, provided the convention is not inherently unjust and compliance imposes no disproportionate burden. This breaks down into four conditions: (1) **Cooperative Context:** The behavior is part of a shared scheme where others comply to mutual benefit; (2) **Reasonable Expectation:** Locals reasonably expect compliance based on established norms; (3) **Non-Exploitation:** Violating allows you to benefit from others' restraint without reciprocating, or causes specific harm; (4) **Legitimacy:** The norm itself is not morally corrupt, and learning/complying is not overly costly for a visitor. This shifts the focus from "rules are rules" to whether breaking them takes unfair advantage of the social contract currently in place.

  2. **Clause by Clause**
  **Cooperative Context** is motivated by the queueing vs. scrum train cases. Queueing is a cooperative scheme; scrum boarding is not. If dropped, you'd be obligated to queue in the scrum city, violating local efficiency and disrupting flow. **Reasonable Expectation** is motivated by the red light cases. At 1am with an empty street, drivers don't expect pedestrians to wait. If dropped, jaywalking is always wrong even when safe, contradicting your verdict that it's fine there. **Non-Exploitation** is motivated by the tipping cases. US server tips are relied-upon income (withholding is exploitation); coffee jar is optional. The backpack case fits here: keeping it on is rude but doesn't exploit others' restraint, so it lacks moral force. If dropped, you can't distinguish between the server and the barista morally; both become optional or both mandatory. **Legitimacy** is motivated by the anti-tipping campaign and the ignorant visitor. If the norm sustains injustice, compliance isn't required. Also, if knowledge is inaccessible (ignorant visitor), burden is disproportionate. Drop this, and you'd be obligated to tip even when workers want abolition, or blame the ignorant tourist unfairly. This structure explains why visitors must comply when they enter the scheme but need not export their home norms.

  3. **My Undecided Cases**
  (a) **Office Cleaner:** Verdict: **Not obligated.** Under the Legitimacy clause, a convention sustained by pluralistic ignorance where participants feel demeaned lacks moral force. It fails the "Cooperative Context" test because the benefit is illusory; everyone pays only because they mistakenly think others want to. Contributing perpetuates the ignorance. The morally superior move is to contribute *once* while signaling dissent to break the cycle, but strictly speaking, the obligation to pay dissolves when the practice is recognized as collectively unwanted. You are not bound to sustain a sham cooperation.

  (b) **Long-Stay Avoider:** Verdict: **Permissible, with caveats.** If they avoid *all* conventions (taxis, trains, restaurants), they aren't exploiting specific cooperative schemes because they aren't entering them. However, if "long-stay" implies residency, they benefit from public order (queues, laws) without participating. The principle binds them only when they *enter* the scheme. If they live entirely off-grid, no obligation. But if they use public roads while refusing to queue for buses, they are free-riding. So: permissible to avoid specific transactions, but not permissible to reside in the society while refusing all cooperative norms that sustain it. They cannot claim visitor status indefinitely to escape moral integration.

  4. **Two Cases You Generate**
  **Case 1: The Reciprocal Gift.** In a village, neighbors exchange harvest baskets. You move in. **Verdict: Obligated.** This fits Cooperative Context and Non-Exploitation. Accepting baskets while giving nothing free-rides on their generosity. Surprising element: Even if you don't need the food, the obligation stands because the harm is to the *scheme* of reciprocity, not just individual hunger. Refusing disrupts the social fabric.

  **Case 2: The Secular Tourist.** A secular visitor enters a religious site requiring head coverings. Locals wear them out of devotion. **Verdict: Obligated.** This tests the Legitimacy clause. Is the norm unjust? No. Does it burden the visitor? Minimally. Reasonable Expectation is high. Surprising element: Even though the visitor lacks the *faith* motivating the norm, they are bound by the *respect* owed to the cooperative practice of worship. Refusing is not just rude but morally wrong because it disrupts the sanctity others are cooperating to maintain. It shows moral obligation can exist without shared belief, grounding duty in respect for the cooperative practice itself rather than agreement with its metaphysical basis.

  5. **What I Have to Give Up**
  You must drop the verdict that the ignorant tipper's action is **not wrong**. My principle distinguishes *objective wrongness* (violating reasonable expectations causing harm) from *blameworthiness* (culpability). The server is still out money; the harm is real. The principle classifies the act as wrong because it violates the Cooperative Fairness of the local economy, but the Legitimacy clause excuses the agent due to the disproportionate cost of knowledge. You cannot have it both ways: if the server is harmed by a violated expectation, the act is morally deficient, even if you aren't a bad person for doing it. This aligns with standard moral theory (actus reus vs mens rea) but forces you to admit the act itself was undesirable, not neutral. This strengthens your paper by separating evaluation of acts from evaluation of agents.

  6. **How Confident You Are**
  I am moderately confident. The **Non-Exploitation** clause is the strongest; it best captures why tipping servers differs from tipping baristas. The weakest is **Legitimacy**, specifically the "cost of knowledge" for visitors. A defeater would be a case where a visitor *should* know a norm but finds it morally repugnant (e.g., segregation-era norms). If the principle obliges compliance there, it fails. However, the "inherently unjust" caveat handles this. The real risk is over-demandingness: if every local quirk becomes a moral obligation, visitors are paralyzed. The principle holds only if "reasonable expectation" is strictly limited to significant cooperative schemes, not trivial preferences.
