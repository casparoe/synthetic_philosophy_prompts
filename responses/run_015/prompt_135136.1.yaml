prompt: |-
  I'm the audit lead for our city's behavorial-policy unit — every week I get proposals for nudges like opt-out organ donation, calorie-label mandates, retirement savings defaults, that kind of thing. Right now I'm just winging it with a gut check about autonomy, but I need something reusable my team can actually run in about fifteen minutes before I sign off. I sketched out a framework with a colleague that splits interventions into two kinds: Type A changes the choice environment — reorder options, change defaults, keep the full menu technically available — while Type B shifts how preferences themselves get formed or weighted, like framing that makes a value feel illegitimate, hiding options behind social stigma, or using emotional priming so people want different things than they did before. The core idea is that Type B needs stricter justification because it doesn't just steer revealed preferences; it risks constructing them, and that asymmetry should drive the audit.

  Please turn this into a step-by-step decision procedure: ordered questions, what counts as a sufficient answer to each, where the flow stops with a hard no, and where it stops and says "this is now a values call, escalate to the ethics board." Apply it to three proposals: (1) an opt-out pension enrollment with a 3% employer match, (2) a school-cafeteria redesign that puts junk food behind a counter with a five-minute wait but technically allows it, and (3) a smoking-cessation poster campaign that frames continued smoking as "letting your family down" — I actually like this one, but I want the procedure to either reject it or escalate it in a way that annoys me. Make sure you flag where the Type A / Type B line gets blurry — for instance when a default also sends a social signal — and be explicit about what the procedure flat-out can't settle. Don't ask me to cite philosophers or build a bibliography; I just need the checklist, the worked cases, and an honest note about where judgment can't be eliminated.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Analyze the Request:**
      *   **Role:** Audit Lead for a city's behavioral-policy unit.
      *   **Task:** Create a reusable, 15-minute decision procedure (checklist/flowchart) for auditing nudge proposals.
      *   **Core Framework:** Distinguish between Type A (choice environment/defaults, preferences stable) and Type B (preference formation/weighting, preferences constructed/manipulated). Type B requires stricter justification.
      *   **Output Requirements:**
          *   Step-by-step decision procedure (ordered questions, pass/fail criteria, stop points).
          *   Application to three specific cases (Pension, Cafeteria, Smoking).
          *   Flagging blurry lines (e.g., defaults with social signals).
          *   Explicit note on what the procedure *cannot* settle (limits of the tool).
          *   Tone: Professional, pragmatic, no academic fluff/bibliographies.
          *   Specific constraint: The smoking case (which the user likes) must be either rejected or escalated in an annoying way (testing the rigor of the tool).

  2.  **Deconstruct the Framework (Type A vs. Type B):**
      *   *Type A:* Nudges that assist decision-making without altering underlying values. Examples: Defaults, simplification, ordering. Key test: If the agent had perfect information and zero cognitive load, would they likely make this choice anyway?
      *   *Type B:* Nudges that alter how values are weighed or formed. Examples: Emotional priming, stigma, framing that delegitimizes options. Key test: Does this intervention try to make the agent *want* something different than they currently do, rather than helping them get what they already want?
      *   *The "Hard No":* Deception, coercion, removing options entirely (not a nudge).
      *   *The "Escalate":* High-risk Type B interventions where the public value is high but autonomy risk is significant.

  3.  **Drafting the Decision Procedure (The "15-Minute Audit"):**
      *   Need to keep it tight. 5-7 questions max.
      *   *Step 1: Coercion/Deception Check.* (Baseline ethics).
      *   *Step 2: Option Availability.* (Is it actually a nudge?)
      *   *Step 3: Type Classification.* (The core A vs. B distinction).
      *   *Step 4: Reversibility/Cost.* (How hard is it to opt-out?)
      *   *Step 5: Preference Stability.* (Does this change *what* they want or *how* they choose?)
      *   *Step 6: Public Justification.* (Can we defend the goal publicly?)
      *   *Decision Nodes:* Pass, Fail, Escalate.

  4.  **Refining the Type A/Type B Distinction for the Checklist:**
      *   Need specific language to help auditors distinguish.
      *   *Type A Indicator:* "Does this reduce friction for a choice the user already has reason to make?"
      *   *Type B Indicator:* "Does this add emotional or social cost to a specific option to change the user's valuation of it?"

  5.  **Applying to the Three Cases:**

      *   *Case 1: Opt-out Pension (3% match).*
          *   Analysis: Classic default. Money is fungible. Option to opt-out exists.
          *   Classification: Type A.
          *   Outcome: Pass (with standard monitoring).

      *   *Case 2: Cafeteria Junk Food (5-min wait).*
          *   Analysis: Physical friction. Option technically available.
          *   Classification: Leans Type A (friction), but 5 minutes is significant. Is it a "tax" on choice?
          *   Nuance: If the wait is *only* for junk food, it signals stigma.
          *   Outcome: Pass as Type A, but flag the "friction as penalty" risk.

      *   *Case 3: Smoking Poster ("Letting family down").*
          *   Analysis: Emotional priming. Guilt induction. Changes the *weight* of the preference (health vs. immediate relief) by adding social/moral cost.
          *   Classification: Type B. It attacks the identity of the smoker.
          *   User Constraint: The user *likes* this one. The tool must be rigorous enough to flag it.
          *   Outcome: Escalate to Ethics Board. This meets the "annoy me" constraint because it stops the quick sign-off.

  6.  **Addressing the "Blurry Lines":**
      *   Defaults often signal "recommended path" (Type A mechanism, Type B signal).
      *   Friction (Cafeteria) can feel like punishment (Type B effect).
      *   Need a specific "Ambiguity Clause" in the procedure.

  7.  **Addressing the "Limits of the Procedure":**
      *   Cannot settle conflicting values (Health vs. Liberty).
      *   Cannot measure long-term preference adaptation.
      *   Cannot replace democratic accountability.

  8.  **Review and Refine (Self-Correction):**
      *   *Check:* Did I make the smoking case escalate? Yes, classifying it as Type B forces escalation under strict rules.
      *   *Check:* Is it 15 minutes? Yes, the questions are direct.
      *   *Check:* Did I avoid philosophy citations? Yes.
      *   *Check:* Is the tone right? Needs to be bureaucratic but sharp. "Audit Lead" voice.
      *   *Correction:* Ensure the distinction between "changing the choice" and "changing the chooser" is clear in the questions.

  9.  **Final Polish:** Organize into clear sections: The Protocol, The Worked Cases, The Blind Spots. (Proceeding to generate output based on this structure).

  *(Self-Correction during drafting the Smoking Case)*: I need to make sure I don't just say "Type B = Bad." Type B = "Needs Escalation/Higher Bar." The prompt says "reject it or escalate it in a way that annoys me." Escalation is the more nuanced "Audit Lead" move than a flat ban, but it creates friction. I will frame it as "Mandatory Ethics Review," which delays implementation.

  *(Self-Correction on Cafeteria)*: A 5-minute wait is substantial. Is it a "soft" ban? I should note that if the friction is too high, it becomes a de facto ban (Coercion). I'll keep it as a "Pass with Conditions" to show the nuance of Type A friction.

  *(Final check on the Type A/B definition)*: The prompt defines Type B as "shifts how preferences themselves get formed or weighted." The smoking ad does exactly this (weights family guilt over nicotine craving). The pension default does not (you still want money, just helps you save it). The cafeteria is the edge case (friction vs. stigma).

  Let's write it.cw
answer: |-
  # The 15-Minute Autonomy Audit Protocol (v1.0)

  **Purpose:** Rapid triage of behavioral interventions to distinguish between *choice architecture* (Type A) and *preference shaping* (Type B).
  **Usage:** Complete one sheet per proposal. If any "Hard Stop" is triggered, reject immediately. If "Escalation" criteria are met, forward to Ethics Board. If all checks pass, Audit Lead may sign off.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Coercion & Deception Baseline (Hard Stop)
  *   **Q1:** Does the intervention remove the legal or physical ability to choose the alternative?
  *   **Q2:** Does the intervention rely on false information or hide material costs?
      *   **If YES to either:** **REJECT.** This is not a nudge; it is a mandate or a lie.
      *   **If NO:** Proceed to Step 2.

  ### Step 2: The Friction & Cost Test (Type A Screen)
  *   **Q3:** What is the "cost" (time, effort, paperwork) to choose the non-default/non-recommended option?
      *   *Standard:* < 5 minutes or 1 click.
      *   *High Friction:* > 5 minutes, multiple forms, or physical barriers.
  *   **Q4:** Is this cost applied asymmetrically? (i.e., Is it harder to choose Option X than Option Y?)
      *   **If High Friction + Asymmetric:** Flag as **Potential Type B**. (High friction can function as a penalty, shifting preference weighting).
      *   **If Low Friction or Symmetric:** Classify as **Type A**. Proceed to Step 4.

  ### Step 3: The Preference Stability Test (Type B Screen)
  *   **Q5:** Does the intervention aim to help people achieve a goal they already report having (e.g., saving money, eating healthier), or does it aim to make them feel guilty/ashamed for not having that goal?
  *   **Q6:** Does the messaging attach moral or social stigma to a specific choice (e.g., "irresponsible," "selfish," "letting others down")?
      *   **If YES to Q6:** Classify as **Type B**. (This constructs preferences via emotional priming).
      *   **If YES to Q5 (Help achieve existing goal):** Classify as **Type A**.
      *   **If Unclear/Mixed:** Classify as **Type B (Ambiguous)**.

  ### Step 4: The Signaling Check (The Blur Zone)
  *   **Q7:** Even if this is a Type A mechanism (like a default), does it send a strong social signal that the alternative is "wrong"?
      *   *Example:* An opt-out organ donation form implies "most people do this."
      *   **If Signal is Neutral/Informational:** Proceed to Sign-off.
      *   **If Signal is Normative/Judgmental:** Escalate to Ethics Board. (Defaults that shame are Type B in disguise).

  ### Step 5: Final Disposition
  *   **Pure Type A + Low Friction:** **APPROVE.** (Monitor for drift).
  *   **Pure Type A + High Friction:** **APPROVE WITH CONDITIONS.** (Require quarterly review of opt-out rates; if >20% struggle, reduce friction).
  *   **Type B (Emotional/Stigma):** **ESCALATE.** (Requires Ethics Board review + Public Comment Period).
  *   **Type B (Ambiguous/Blurry):** **ESCALATE.** (When in doubt, assume Type B).

  ---

  ## Part 2: Worked Cases

  ### Case 1: Opt-Out Pension Enrollment (3% Match)
  *   **Step 1 (Baseline):** No coercion (can opt out), no deception (match is real). **Pass.**
  *   **Step 2 (Friction):** Opt-out requires clicking a link or signing a form. Time cost < 5 mins. Symmetric effort (enrolling is automatic, opting out is one step). **Type A.**
  *   **Step 3 (Preference):** Goal is financial security. Most employees report wanting savings but fail to act due to procrastination. Intervention aids existing preference. **Type A.**
  *   **Step 4 (Signaling):** Default implies "this is the standard path," but carries no moral stigma against opting out. **Neutral.**
  *   **Disposition:** **APPROVE.**
  *   **Audit Note:** Classic Type A. Reduces friction for a stable preference (wealth accumulation).

  ### Case 2: School Cafeteria Redesign (Junk Food Behind Counter)
  *   **Step 1 (Baseline):** Food is technically available. No lies told. **Pass.**
  *   **Step 2 (Friction):** 5-minute wait is significant. It is applied *only* to junk food (Asymmetric).
      *   *Analysis:* This borders on a "sin tax" implemented via time. It changes the *price* of the choice, not just the presentation.
      *   *Classification:* **Type A (High Friction)** but risks sliding into Type B if the wait is perceived as punishment.
  *   **Step 3 (Preference):** Goal is health. Students may not *currently* prefer healthy food, but the intervention doesn't use shame; it uses inconvenience.
  *   **Step 4 (Signaling):** Placing items behind a counter signals "treat" or "restricted," which adds a mild normative layer.
  *   **Disposition:** **APPROVE WITH CONDITIONS.**
  *   **Audit Note:** This is the blurry line. Physical friction is Type A, but *targeted* friction acts like a penalty. We approve it as a Type A friction nudge, but if students report feeling "punished" rather than "delayed," it migrates to Type B and must be re-audited.

  ### Case 3: Smoking Cessation ("Letting Your Family Down")
  *   **Step 1 (Baseline):** No coercion. **Pass.**
  *   **Step 2 (Friction):** N/A (Poster campaign).
  *   **Step 3 (Preference):** **CRITICAL FAIL.**
      *   *Analysis:* The smoker's current revealed preference is to smoke (balancing stress relief/addiction vs. health). The poster does not help them achieve a goal they currently hold; it attempts to *overwrite* their weighting by introducing guilt. It makes the value "personal relief" feel illegitimate compared to "family duty."
      *   *Classification:* **Type B.** This is emotional priming designed to construct a new preference hierarchy.
  *   **Step 4 (Signaling):** Explicitly attaches moral failure ("letting down") to the choice.
  *   **Disposition:** **ESCALATE TO ETHICS BOARD.**
  *   **Audit Note:** I know you like this one. That is exactly why it triggers the protocol. This intervention does not help a smoker quit who *wants* to quit; it tries to make them *want* to quit by weaponizing social bonds. That is preference construction. Under this framework, you cannot sign off on it. It requires a public values debate, not an administrative signature.

  ---

  ## Part 3: The Blind Spots (Where Judgment Remains)

  This procedure cannot eliminate judgment. It only structures it. Be aware of the following three gaps where the checklist will not save you:

  **1. The "Adaptive Preference" Problem**
  The audit assumes we can distinguish between "real" preferences and "constructed" ones. But people's preferences change naturally over time. If a Type B intervention (like the smoking poster) succeeds, the smoker eventually *genuinely* prefers not to smoke. Six months later, a Type B intervention looks like a Type A success. The audit captures the *method*, not the long-term *outcome*. You still need to judge whether the end justifies the manipulative means.

  **2. The Default-as-Signal Blur**
  We treat Defaults as Type A. But a default is never neutral; it is a recommendation from an authority. If the city sets "Green Energy" as the default, is that helping people save the planet (Type A) or teaching them that Carbon Energy is immoral (Type B)? The checklist flags high-stigma signals, but subtle shifts in perceived legitimacy often slip through Step 4. If the political stakes are high, ignore the checklist and escalate.

  **3. The Paternalism Threshold**
  This tool identifies *how* the intervention works (A vs. B), not *whether* the goal is worth it. A Type B intervention could be used for something trivial (e.g., nudging people to recycle bottle caps) or vital (e.g., stopping a pandemic). The procedure forces Type B into the Ethics Board bucket, but the Board still has to decide if the autonomy violation is proportionate to the public good. That is a political question, not an audit question.

  **Final Instruction:** If a proposal feels effective *because* it makes you uncomfortable, that is a Type B indicator. Do not override the escalation.
