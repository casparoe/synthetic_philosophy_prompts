answer: |-
  Here is the referee ruling on the Newcomb's Problem coffee machine dispute.

  Both Sam and Dev have grasped half of the elephant, but neither has described the whole animal. Here is the breakdown of your four questions, followed by a verdict on who bought the next round of coffee.

  ### (a) Where is the crossover?

  **Sam is mathematically right, but only under one specific framework.**

  If you calculate Expected Utility (EU) treating your choice as *evidence* about the contents of the box (the Evidential Decision Theory or EDT approach), there is indeed a crossover point.

  Let $P$ be the accuracy of the predictor.
  *   **EU(1-Box):** You get \$1M if the predictor was right (prob $P$), \$0 if wrong.
      $$EU(1\text{-Box}) = 1,000,000 \times P$$
  *   **EU(2-Box):** You get \$1,000 + \$1M if the predictor was wrong (prob $1-P$), and just \$1,000 if the predictor was right (prob $P$).
      $$EU(2\text{-Box}) = 1,001,000 \times (1-P) + 1,000 \times P$$

  Setting them equal to find the break-even point:
  $$1,000,000P = 1,001,000 - 1,001,000P + 1,000P$$
  $$2,000,000P = 1,001,000$$
  $$P = 0.5005$$

  **The Crossover:** At **50.05%** accuracy, the expected value of one-boxing overtakes two-boxing. Given that Newcomb predictors are usually stipulated as >90% or >99% accurate, the math heavily favors one-boxing *if* you accept the premises of the calculation.

  **However,** for a Causal Decision Theorist (CDT), **there is no crossover.** CDT argues that the box is already packed. Your choice now cannot causally influence the past prediction. Therefore, the probability of the box being full is fixed regardless of your choice. Under CDT, two-boxing *always* yields an extra \$1,000 (Dominance Principle), regardless of whether the predictor is 51% accurate or 99.9% accurate.

  ### (b) Is Sam right that accuracy is doing the philosophical work?

  **Sam is partially right, but misses the deeper implication.**

  Sam is correct that the *practical* recommendation flips based on accuracy for an Expected Utility maximizer. If the predictor is a coin-flipper ($P=0.5$), everyone should two-box. The "paradox" only feels tense because the accuracy is high.

  However, Sam is wrong to suggest that identifying the crossover *solves* the philosophical problem. Sam's argument presupposes that we *should* be maximizing expected utility based on conditional probabilities (EDT). The entire point of the CDT objection is that this calculation is illicit because it treats a correlation as a causal lever.

  Sam thinks the paradox dissolves if we admit accuracy matters. But CDT proponents admit accuracy matters for *predicting what you will find*; they just deny it matters for *deciding what to do*. Sam is solving the math, but ignoring the metaphysics of causation that Dev is worried about.

  ### (c) Is Dev right that the CDT/EDT split is what matters and accuracy is orthogonal?

  **Dev is right about the split, but wrong about orthogonality.**

  Dev correctly identifies that the core of the academic debate is the conflict between **Causal Decision Theory (CDT)** and **Evidential Decision Theory (EDT)**.
  *   **CDT:** "I can't change the past. Take the extra \$1k." (Two-box)
  *   **EDT:** "My choice is evidence of the past. I want to be the kind of person who finds \$1M." (One-box)

  However, Dev is incorrect to call accuracy a "red herring" or "orthogonal." As shown in calculation (a), if the predictor's accuracy drops below 50.05%, **EDT switches to two-boxing.** CDT *always* says two-box.
  *   At low accuracy: CDT and EDT **agree**.
  *   At high accuracy: CDT and EDT **disagree**.

  Therefore, accuracy is not orthogonal; it is the **fuel** for the disagreement. Without high accuracy, there is no conflict between the two theories. Dev is treating the high-accuracy stipulation as a mere setup detail, when it is actually the necessary condition for the CDT/EDT war to exist.

  ### (d) What are both of them missing?

  Both students are arguing within a framework that is arguably outdated (pre-2010s decision theory). Here is what they are missing:

  **1. The Causal Structure (The "Common Cause" vs. "Subjunctive" link)**
  The disagreement isn't just about "accuracy"; it's about the *causal graph*.
  *   **CDT** sees the graph as: `Prediction -> Box Content` and `Prediction <- Common Cause -> Your Choice`. They argue you must "screen off" the correlation.
  *   **EDT** sees the graph as: `Your Choice <-> Prediction` (pure correlation).
  *   **What they miss:** There is a third option, **Functional Decision Theory (FDT)** or **Timeless Decision Theory (TDT)**. This framework (championed by Yudkowsky, Soares, etc.) argues that you and the predictor are running the same algorithm. You aren't causing the past, nor are you just gathering evidence; you are *computing the same output* as the predictor. FDT says one-box, not because of evidence, but because "if my algorithm outputs 'two-box', the predictor's simulation of my algorithm also output 'two-box'." This dissolves the CDT/EDT split by changing the definition of "choice."

  **2. The "Why" of the Prediction**
  They are treating the predictor as a black box with a probability score. But *how* the predictor predicts matters.
  *   If the predictor is a **time traveler**, CDT might actually one-box (causality is violated).
  *   If the predictor is a **neuroscanner**, CDT two-boxes (the brain state is already fixed).
  *   If the predictor is a **perfect simulator**, FDT one-boxes (logical identity).
  Sam and Dev are arguing about the *number* (accuracy) without specifying the *mechanism*, which determines which decision theory is actually appropriate.

  ### The Verdict

  **On the Math:** **Sam wins.** There is a crossover point (~50.05%), and knowing it is better than calling it a footnote.

  **On the Philosophy:** **Dev wins.** The core of the Newcomb literature is indeed the CDT vs. EDT clash. Sam's attempt to reduce it to a probability threshold ignores the causal objection that defines the problem.

  **On the Big Picture:** **It's a Draw.**
  *   **Sam** is acting like a pragmatic economist: "If the odds are good enough, bet on the correlation."
  *   **Dev** is acting like a pure philosopher: "The structure of rationality is the point, not the payout."

  **Referee's Ruling:**
  Tell Sam that his crossover math is correct for EDT but irrelevant for CDT, so he hasn't solved the paradox, he've just solved an equation. Tell Dev that accuracy isn't orthogonal; without high accuracy, his beloved CDT/EDT conflict disappears, so he can't dismiss it as a footnote.

  **Who buys the coffee?**
  Make them split it. Sam needs to read more philosophy (causality), and Dev needs to read more math (thresholds). But if you want to really end the argument, tell them both to go read about **Functional Decision Theory**. That will give them something new to fight about next week.
