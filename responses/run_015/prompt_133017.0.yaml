answer: |-
  Here are seven interview questions designed to probe the limits of the "mnemonic debt" theory. Each includes the core question, an anticipated answer (to help you prepare for her likely response), and a sharp follow-up designed to prevent vague deflection.

  ### 1. The Core Mechanism
  **Question:** You argue that modern democracies actually *need* these defeat narratives to remain unresolved—that we shouldn't fully glorify them, but we shouldn't fully repudiate them either. Can you explain the mechanism there? Why does a democracy collapse if we finally agree on what a historical defeat meant?

  *   **Anticipated Answer:** She will likely argue that a single, state-sanctioned narrative creates authoritarian uniformity. She'll say that keeping the memory "open" allows dissenting voices and minority groups to find footholds in history, preventing the state from having total control over truth.
  *   **Follow-up:** "So, if I'm hearing you right, you're suggesting that state-sponsored clarity is inherently authoritarian. But isn't there a difference between a state saying '2+2=4' and a state saying 'slavery was the cause of the Civil War'? At what point does protecting 'ambiguous space' become protecting the right to be factually wrong?"

  ### 2. Ethnic-Nationalism vs. Post-Imperial Democracy (Required)
  **Question:** I want to press on how this debt functions in different contexts. In Kosovo Polje, the defeat narrative fuels an ethnic nationalism that defines the nation by blood and exclusion. In Dunkirk, it's a post-imperial story about resilience and civilian sacrifice. Does "mnemonic debt" operate the same way in both? Or does the Kosovo story demand a resolution that the Dunkirk story doesn't?

  *   **Anticipated Answer:** She will likely argue that the *structure* is the same (a defeat turned into a moral victory), but admit the *content* differs. She may try to pivot to how both create social cohesion.
  *   **Follow-up:** "But the cohesion in Kosovo was built on the exclusion of Albanians, while Dunkirk was built on including the 'little ships' of ordinary citizens. If the 'debt' requires ambiguity to function, doesn't keeping the Kosovo myth ambiguous keep the door open for ethnic cleansing? Is there a type of mnemonic debt that is simply too toxic to keep unpaid?"

  ### 3. The Confederacy and Sanitization (Required)
  **Question:** This brings us to the Lost Cause. Your framework suggests that fully repudiating the Lost Cause might collapse the space needed for certain historical consciousnesses. But the Lost Cause wasn't just a story about defeat; it was a specific political tool built to sanitize chattel slavery. Does your theory risk treating the Lost Cause as a harmless 'myth' rather than a deliberate lie designed to uphold white supremacy?

  *   **Anticipated Answer:** She will likely clarify that she isn't defending slavery, but defending the *psychological need* for the defeated group to process their loss without total shame. She may argue that total repudiation creates resentment that festers underground.
  *   **Follow-up:** "I understand the psychological angle, but whose consciousness are we protecting here? If the 'ambiguous space' allows a group to mourn a cause founded on human bondage, aren't we prioritizing the emotional comfort of the oppressor over the historical reality of the oppressed? Can a democracy really function on a debt paid in the currency of someone else's suffering?"

  ### 4. The State "Calling In" the Debt (Required)
  **Question:** Let's look at the opposite scenario. What happens when the state decides to "call in the debt"? Imagine a government officially repudiates the myth and replaces it with a single, verified narrative—like Germany with the Holocaust. According to your theory, shouldn't that collapse the democratic space you value?

  *   **Anticipated Answer:** She will likely distinguish between "healthy" democracies and "transitional" ones. She might argue that Germany is a special case of total moral collapse, whereas in normal democracies, forced consensus creates backlash.
  *   **Follow-up:** "But if we accept that exception for Germany, we're admitting that some myths *must* be resolved for democracy to survive. So the question isn't whether to resolve them, but *who decides* which debts get called in. If it's not the state, who has the authority to say 'This myth is now dangerous enough to ban'?"

  ### 5. Defining the "Minority"
  **Question:** You mention that resolving these narratives collapses the space "minority groups" need to maintain their historical consciousness. In the case of the Confederacy, the "minority" initially was the white South. But today, the groups harmed by that myth are Black Americans. How do you reconcile protecting the historical consciousness of a defeated political minority with the civil rights of a marginalized racial minority?

  *   **Anticipated Answer:** She may try to redefine "minority" as any group outside the dominant state narrative, or argue that she is talking about *historical* minorities, not necessarily racial ones. She might claim that open debate helps everyone.
  *   **Follow-up:** "That distinction feels crucial. Because if 'minority consciousness' includes the consciousness of groups dedicated to racial hierarchy, then 'ambiguity' isn't neutral. It's a shield. Are you willing to say that some historical consciousnesses are incompatible with democracy and shouldn't be protected, regardless of the 'debt'?"

  ### 6. Political Entrepreneurship
  **Question:** One risk of leaving these debts unpaid is that bad-faith actors can cash them in. We saw Milošević use Kosovo Polje six hundred years later to start a war. If we keep these narratives unresolved to preserve democratic space, aren't we also keeping the weapons loaded for the next populist who wants to use them?

  *   **Anticipated Answer:** She will likely argue that resolving the narrative doesn't stop populists; they will just find new myths. She might say that suppression makes the myth more attractive to radicals.
  *   **Follow-up:** "But there's a difference between a myth existing and a myth being state-tolerated. If public institutions treat a dangerous myth as a valid 'unresolved question' rather than a settled falsehood, doesn't that give the populist the legitimacy they need? Isn't there a point where public history has to take a side to protect the public?"

  ### 7. The Public Historian's Duty
  **Question:** For those of us working in public history—museums, podcasts, parks—what is the practical takeaway? If your theory is right, should we be curating ambiguity? Should we be intentionally leaving questions unanswered to keep the "debt" active?

  *   **Anticipated Answer:** She will likely say we should curate *complexity*, not ambiguity. She'll argue for showing multiple perspectives rather than dictating a moral conclusion.
  *   **Follow-up:** "I worry that in practice, 'complexity' can become a euphemism for 'both-sidesism.' If I'm running a museum exhibit on the Confederacy, and I present the 'states rights' argument alongside the 'slavery' argument to maintain that ambiguous space, haven't I already failed my ethical duty? Where is the line between historical complexity and moral neutrality?"
