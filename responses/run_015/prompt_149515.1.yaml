  **(Self-Correction on the Coffee Jar):** The user says "none of us feels any pull toward saying that the state... must now either accept the inequality or interfere." Actually, the state *does* interfere (taxes income). The intuition is that we don't *mind* the inequality. I need to clarify that the WCA argument is about the *permissibility* of stopping the transfer, not the *necessity* of the state acting. In the coffee jar, we wouldn't *stop* the transfer. In WCA, the patterned theorist *must* stop future transfers to maintain the pattern. That's the key.

