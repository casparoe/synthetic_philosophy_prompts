  2. **The Power Warning.** This thesis asserts that non-significant results from insensitive tests are uninformative regarding the null hypothesis. Here, evidence is defined as a statistically significant result (low p-value), and absence means the parameter is exactly zero. It claims that if a test has low power to detect the effect, a null result fails to discriminate between random noise and a true null state. This is a standard frequentist caution against Type II errors in underpowered designs. It implies that without sufficient sensitivity, a non-significant result provides no warrant to believe the effect is absent, though it does not preclude high-power tests from doing so. It distinguishes between uninformative nulls and informative nulls based on sample size and variance. It does not claim nulls are never evidence, only that bad tests yield no evidence. This reading is common in methods training.

  3. **The SESOI Boundary.** This thesis asserts that evidence for absence requires excluding substantively meaningful effects rather than exact zeros. Here, evidence is defined as successful equivalence testing, and absence means the effect is smaller than the smallest effect size of interest. It claims that scientific absence is not mathematical zero but practical negligibility. This shifts the burden from proving non-existence to proving triviality, aligning with measurement theory. It implies that a confidence interval excluding the SESOI constitutes positive evidence for absence, treating the null as a region of practical equivalence rather than a point. This reading validates your preregistration strategy, allowing null results to count as evidence if precision is high enough. It redefines absence as a functional category rather than an ontological one. This reading is central to modern reproducibility efforts.

  4. **The Model Comparison.** This thesis asserts that data support absence only if they fit the null model better than the alternative. Here, evidence is defined as a likelihood ratio or Bayes factor favoring the null, and absence means the null model is more probable. It claims that data are only evidence for absence relative to a specified alternative hypothesis. This requires precise modeling of the expected effect size distribution. It implies that vague alternatives make it impossible to gather evidence for absence, while specific alternatives allow null data to incrementally confirm the null model. This reading makes evidence a comparative matter rather than an absolute property of the data alone. It resolves the symmetry worry by tying evidence to model fit. This reading is common in Bayesian circles.

  5. **The Inductive Immunity.** This thesis asserts that null results never confirm the null hypothesis regardless of design quality. Here, evidence is defined as any empirical warrant for belief, and absence means the mechanism does not exist. It claims that no amount of null data, regardless of power or precision, counts against the existence of an effect. This is a radical skeptical stance often used to protect established theories. It implies that hypotheses claiming existence are immune to falsification by negative data, treating the possibility of an effect as permanently open regardless of accumulated empirical failure. This reading renders the slogan a shield against paradigm shifts. It denies the possibility of negative evidence entirely. This reading is often used defensively by theorists.

  2. "Verdicts"

  1. **Platitude.** True by definition of deduction, but irrelevant to empirical science which relies on induction and probabilistic inference. It sets a bar for evidence that no scientific claim could ever meet, rendering the slogan vacuous for practical research. It confuses logical entailment with empirical support.
  2. **Substantive and defensible.** Correctly identifies that low-power studies yield high Type II error rates, making null results uninformative about the state of the world. However, it does not license dismissing high-power nulls, which your study utilized. It is a constraint on design, not a ban on null findings.
  3. **Substantive and defensible.** Aligns with modern measurement theory; correctly identifies that scientific absence is about negligible impact, not mathematical zero. This supports your conclusion that the effect is too small to matter. It operationalizes absence in a way that allows for decisive tests.
  4. **Contentious.** Depends heavily on how the alternative model is specified; a vague alternative can make any null result look like evidence for absence. It requires consensus on effect size distributions to function as a shared standard. It makes evidence relative to modeling choices.
  5. **False and self-undermining.** If null data never count against an effect, positive data cannot count for it without asymmetry; it immunizes theories from data. It violates the likelihood principle by refusing to allow data to update probabilities against a hypothesis. It makes science impossible.

  3. "What the line was doing in our seminar"

  The speaker likely conflated Reading 2 (Power) with Reading 5 (Immunity). Reading 2 licenses dismissing a single underpowered null, but your study was high-powered with a preregistered SESOI. Dismissing your result requires Reading 5, which claims no amount of null data matters. This licenses ignoring accumulated replications too, as the speaker explicitly did. However, Reading 5 undermines the speaker's own field's positive results. If null data never count against an effect, positive data cannot count for it without violating likelihood principles. The speaker wants the protection of Reading 5 for failed replications but the evidential weight of Reading 2 or 4 for original discoveries. This asymmetry allows them to treat the original effect as real despite null data, but treats null data as silent regardless of precision.

  Your study specifically targeted Reading 3 (SESOI), showing the effect is too small to matter, which Reading 5 ignores by demanding exact zero proof. The speaker's move relies on shifting definitions: when defending the original study, evidence is probabilistic support; when dismissing your replication, evidence becomes logical proof. This protects the original claim from falsification while retaining its evidential status. The symmetry worry is central here: if your high-precision null result is not evidence against the effect, then the original low-precision significant result should not be evidence for it. The speaker implicitly assumes the original result crossed a threshold of evidence that your null result cannot cross, despite your superior power. This is methodologically inconsistent.

  By invoking the slogan generally, the speaker avoids addressing the specific design features of your replication. They treat all null results as equally uninformative, ignoring the distinction between underpowered and high-powered tests. This renders the slogan a rhetorical stopper rather than a methodological critique. It prevents the seminar from discussing why the original effect size was overestimated. The speaker's argument only holds if one accepts Reading 5, which makes scientific progress impossible. If accepted, it means we can never conclude an effect is absent, only that we haven't found it yet. This stalls theoretical refinement.

