answer: |-
  ### Part 1: Brainstorming the Logical Space

  Before drawing the tree, we must map the conceptual territory. We are not sorting by *who* said what (e.g., Kuhn vs. Butterfield), but by *what* they believe about the past. The logical space is defined by three axes of commitment.

  **Axis 1: Ontology of Change (Break vs. Flow)**
  *   **Discontinuity:** Something fundamental snapped. A scholar in 1650 would not recognize the rules of truth used by a scholar in 1300.
  *   **Continuity:** Knowledge accumulated. The "new" science was just the "old" natural philosophy refined. There is no sharp line, only a gradient.

  **Axis 2: Agency and Awareness (Internal vs. External)**
  *   **Self-Conscious:** The people living through it felt they were in a "New Age." They wrote manifestos, claimed to be "moderns," or spoke of "restoring" lost glory.
  *   **Retrospective:** The people lived their lives normally. The idea that they were in a "Renaissance" or "Revolution" was applied by historians 200 years later to make sense of the data.

  **Axis 3: Mechanism of Change (Mind vs. Structure)**
  *   **Epistemic (Mind):** The change was in *how* people thought (mathematization, skepticism, experimental verification).
  *   **Institutional (Structure):** The change was in *where* and *who* (printing press, royal societies, patronage, universities).

  **Axis 4: Pedagogical Utility (Keep vs. Discard)**
  *   **Realist/Pragmatist:** The terms describe reality (or useful fictions), so we keep them.
  *   **Abolitionist:** The terms are misleading myths; we should teach without them.

  **Potential Empty/Unstable Combinations:**
  *   *The "Unconscious Break":* A qualitative break occurred, but no one noticed at the time, and the terms were invented later. (Plausible, but often collapses into Retrospective Realism).
  *   *The "Useless Myth":* The terms are invented later, there was no break, and yet we should keep them. (This is the **Pragmatic Heuristicist**—rare but stable).
  *   *The "Felt Continuity":* Participants felt they were starting something new, but historians prove nothing actually changed. (Psychologically interesting, historically rare as a standalone position).

  ---

  ### Part 2: The Decision Tree Design

  **Instructions for the Student:**
  Answer the following four questions based on your own intuition about the period 1200–1700. Do not worry about "correct" historical answers; answer based on how you believe the past *actually worked*. Your path through the tree will reveal your historiographical stance.

  #### Node 1: The Nature of Truth (Ontology)
  **Question:** If you handed a standard problem about the motion of stars to a scholar in 1300 and a scholar in 1650, would they disagree primarily on the **answer**, or on the **rules for proving the answer**?
  *   **A:** They use the same rules (authority, logic, observation), they just have better data in 1650. **(Go to Node 2)**
  *   **B:** They use fundamentally different rules (e.g., math vs. qualitative physics, experiment vs. text). **(Go to Node 3)**

  #### Node 2: The Utility of Labels (Pedagogy)
  *(Reached if you believe change was continuous/gradual)*
  **Question:** Since you believe the change was gradual, are the terms 'Middle Ages' and 'Scientific Revolution' still useful for teaching, or do they distort the past too much?
  *   **A:** They distort the past. We should stop using them. **(Leaf: Strong Constructivist)**
  *   **B:** They are false but necessary shortcuts. We should keep them. **(Leaf: Pragmatic Heuristicist)**

  #### Node 3: The Source of Change (Mechanism)
  *(Reached if you believe change was a qualitative break)*
  **Question:** Was this break caused mainly by a change in **mental tools** (logic, mathematics, method) or **social tools** (printing press, universities, funding)?
  *   **A:** Mental Tools (New ways of thinking). **(Go to Node 4)**
  *   **B:** Social Tools (New places to work/share). **(Leaf: Institutional Discontinuist)**

  #### Node 4: The Experience of the Actors (Awareness)
  *(Reached if you believe break was mental/epistemic)*
  **Question:** Did the people living through this break write about themselves as starting a "New Science" or "Rebirth," or did historians apply that label later?
  *   **A:** They knew it. They wrote about overthrowing the ancients. **(Leaf: Classical Realist)**
  *   **B:** They didn't know it. They thought they were fixing old ideas; the "Revolution" is a later label. **(Leaf: Latent Structure Realist)**

  ---

  ### Part 3: The Leaves and Diagnostics

  Here are the six terminal positions (Leaves) generated by the tree, including the diagnosis of empty or unstable logical spaces.

  #### 1. Strong Constructivist (Node 1A → Node 2A)
  *   **Commitment:** Continuity + Discard Terms.
  *   **View:** There was no fundamental break in how truth was validated. The "Scientific Revolution" is a 19th-century myth imposed on the past to make modern science look inevitable.
  *   **Diagnosis:** Stable position. Often aligns with social constructivism or revisionist history.
  *   **Seminar Role:** The Skeptic. Challenges every claim of "modernity."

  #### 2. Pragmatic Heuristicist (Node 1A → Node 2B)
  *   **Commitment:** Continuity + Keep Terms.
  *   **View:** Historically, there was no sharp break. However, the terms are pedagogically indispensable for organizing courses.
  *   **Diagnosis:** **Occupied but Tense.** This position admits the terms are lies but refuses to stop telling them. It is often unoccupied by pure theorists (who prefer consistency) but highly occupied by teachers.
  *   **Seminar Role:** The Instructor. Defends the syllabus structure while admitting its flaws.

  #### 3. Institutional Discontinuist (Node 1B → Node 3B)
  *   **Commitment:** Discontinuity + Social Mechanism.
  *   **View:** A break occurred, but it wasn't about "genius" or "method." It was about the printing press, the Royal Society, and patronage. Knowledge changed because the *ecosystem* changed.
  *   **Diagnosis:** Stable position. Separates the "what" from the "where."
  *   **Seminar Role:** The Sociologist. Focuses on books, buildings, and money rather than ideas.

  #### 4. Classical Realist (Node 1B → Node 3A → Node 4A)
  *   **Commitment:** Discontinuity + Mental Mechanism + Self-Conscious.
  *   **View:** A fundamental break in method occurred, and the actors knew it. They felt they were revolutionizing the world.
  *   **Diagnosis:** Stable position. The traditional "Great Men" history.
  *   **Seminar Role:** The Traditionalist. Defends the reality of the "Revolution."

  #### 5. Latent Structure Realist (Node 1B → Node 3A → Node 4B)
  *   **Commitment:** Discontinuity + Mental Mechanism + Retrospective.
  *   **View:** A fundamental break in method occurred, but the actors didn't fully grasp it. They thought they were restoring ancient wisdom, but historians see they actually created something new.
  *   **Diagnosis:** **Occupied.** Common among historians who take texts seriously but reject actors' self-descriptions as propaganda.
  *   **Seminar Role:** The Analyst. Distinguishes between what actors *said* they did and what they *actually* did.

  #### 6. [EMPTY LEAF] The Subjective Idealist
  *   **Hypothetical Path:** Node 1A (Continuity) → Node 4 (Awareness: They felt it was new).
  *   **Why Empty/Unstable:** This tree routes Continuity to Pedagogy (Node 2) rather than Awareness. However, if a student argues "Nothing changed objectively, but everyone *felt* like it did," they fall into a gap.
  *   **Diagnosis:** **Incoherent/Unattractive.** If nothing changed in method or truth standards, why did everyone feel a revolution? Usually, this collapses into the *Latent Structure Realist* position (they felt it, but they were wrong about the *nature* of the change). It is rarely held as a standalone because it privileges subjective feeling over objective practice without explanation.

  #### 7. [EMPTY LEAF] The Abolitionist Realist
  *   **Hypothetical Path:** Node 1B (Discontinuity) → Node 2 (Discard Terms).
  *   **Why Empty/Unstable:** This tree does not offer a "Discard" option for Discontinuists.
  *   **Diagnosis:** **Logically Possible but Rare.** If you believe a massive, qualitative break occurred, you usually want a name for it. To argue "A revolution happened, but we must never use the word Revolution" is performatively contradictory. This space is unoccupied because it serves no rhetorical function.

  ---

  ### Part 4: Scoring Logic and Indistinguishability Flags

  **Scoring Logic:**
  *   **Continuity Cluster (Leaves 1 & 2):** Defined by Node 1. These students will argue against "Whig history" and focus on medieval roots of modern science.
  *   **Discontinuity Cluster (Leaves 3, 4, 5):** Defined by Node 1. These students will argue for the uniqueness of the 17th century.
  *   **Internal vs. External:** Node 3 separates those who care about *ideas* (4 & 5) from those who care about *infrastructure* (3).
  *   **Actor vs. Historian:** Node 4 separates those who trust contemporary sources as self-descriptive (4) from those who read them against the grain (5).

  **Indistinguishability Flag:**
  *   **Leaf 3 (Institutional) vs. Leaf 5 (Latent Structure):**
      *   *The Problem:* A student may argue that "New Social Tools" (Printing Press) *caused* "New Mental Tools" (Critical Reading). In this case, the distinction between Institutional Discontinuist and Latent Structure Realist blurs.
      *   *The Flag:* If a student argues that the *mechanism* was institutional but the *result* was epistemic, the tree forces a choice that may feel artificial. In a seminar, allow these students to occupy the space *between* Leaf 3 and Leaf 5.

  *   **Leaf 1 (Strong Constructivist) vs. Leaf 2 (Pragmatic Heuristicist):**
      *   *The Problem:* Both agree on the history (Continuity). They only disagree on teaching policy.
      *   *The Flag:* In a research context, these two are identical. The tree only distinguishes them on *pedagogical policy*, not historical truth. If the seminar is about research, merge these leaves. If the seminar is about teaching, keep them separate.

  **Final Note for the Seminar Leader:**
  This instrument is designed to prevent students from hiding behind names (e.g., "I'm a Kuhnian"). By forcing them to answer whether a 1300 scholar would fail a 1650 test (Node 1), you bypass the jargon and expose their underlying assumption about the past. Use the "Empty Leaves" to challenge students: *"You claim nothing changed, but you also claim they felt a revolution. How do you explain that gap?"*
