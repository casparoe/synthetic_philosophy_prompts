answer: |-
  # Decision Tree: Responses to the Malign Prior & Pascal's Mugging

  **Instructions:** This tree maps the logical space of decision-theoretic responses to extreme tail risks. It is designed to expose "collateral damage": solutions that stop a Pascal's Mugger but also prevent you from buying earthquake insurance or funding existential risk mitigation.

  **The Two Test Cases:**
  *   **(A) Pascal's Mugger:** A stranger demands $5, claiming to control $3 \uparrow\uparrow 3$ lives. No evidence is offered other than the claim.
  *   **(B) Earthquake/X-Risk:** Actuarial data suggests a 0.1% chance of a disaster killing 1M people. Mitigation costs $5,000.

  ---

  ## The Branch Questions

  **Q1. Is the value of outcomes bounded?**
  *Is there a maximum possible utility difference between two outcomes, regardless of how many entities are affected or how long they suffer?*
  *   **Yes:** (Go to Q2)
  *   **No:** (Go to Q2)

  **Q2. Does prior probability depend on claimed stakes?**
  *Aside from description length (Kolmogorov complexity), should a hypothesis receive a lower prior probability specifically because the magnitude of its claimed impact is larger?*
  *   **Yes:** (Go to Q3)
  *   **No:** (Go to Q3)

  **Q3. Is empirical distinguishability required for credence?**
  *Must a hypothesis allow for observations that could distinguish it from a null hypothesis in principle? (i.e., If no possible evidence could update the probability, should the prior be zero?)*
  *   **Yes:** (Go to Q4)
  *   **No:** (Go to Q4)

  **Q4. What is the unit of optimization?**
  *Do you select the best action for the current situation, or do you select a global policy that dictates actions across all possible scenarios (including counterfactuals)?*
  *   **Act:** (Go to Q5)
  *   **Policy:** (Go to Leaf)

  **Q5. How do you handle unstable probabilities?**
  *When a probability estimate is sensitive to uncomputable priors or model ambiguity (as in Solomonoff induction), do you calculate the expectation or default to a robustness bound?*
  *   **Expectation:** (Go to Leaf)
  *   **Robustness/Ignore:** (Go to Leaf)

  ---

  ## The Leaves: Positions & Collateral Damage

  ### Leaf 1: The Straight Maximizers (Yes, No, No, Act, Expectation)
  *   **Position:** **Unbounded Expected Utility.** You accept the universal prior as given. Complexity drives probability, but stakes do not. Utility is linear in lives.
  *   **Case A (Mugger):** **Pay.** The expected utility of $3 \uparrow\uparrow 3$ lives outweighs $5, even at tiny probability.
  *   **Case B (Earthquake):** **Buy.** Standard expected utility calculation.
  *   **Collateral Damage:** **Critical.** You are vulnerable to the Malign Prior. Any hypothesis containing a simulator who rewards compliance will dominate your decision theory. You cannot function in the real world without being hijacked by the first high-stakes claim you encounter.

  ### Leaf 2: The Capists (Yes, [Irrelevant], [Irrelevant], Act, Expectation)
  *   **Position:** **Bounded Utility.** There is a maximum amount of good that can be done. Saving $10^{100}$ lives is not meaningfully better than saving $10^{9}$ lives.
  *   **Case A (Mugger):** **Reject.** The utility of the mugger's promise hits the cap; the cost of $5 does not.
  *   **Case B (Earthquake):** **Buy.** The stakes are within the linear range of the cap.
  *   **Collateral Damage:** **Moderate.** You avoid the Mugger, but you undervalue existential risk mitigation if the stakes approach the cap. If preventing extinction is "capped," you might underinvest compared to near-term humanitarian aid.
  *   **Note:** Q2 and Q3 become irrelevant because the stakes no longer drive the decision.

  ### Leaf 3: The Leverage Skeptics (No, Yes, No, Act, Expectation)
  *   **Position:** **Leverage Penalty.** The prior probability of a hypothesis shrinks inversely to the stakes claimed ($P \propto 1/Stakes$).
  *   **Case A (Mugger):** **Reject.** The probability shrinks fast enough to cancel the utility gain.
  *   **Case B (Earthquake):** **Buy (Usually).** Actuarial probabilities are based on frequency, not claims, so the penalty may not apply or is negligible.
  *   **Collateral Damage:** **High.** This kills legitimate tail-risk insurance. If you fund a hedge against a low-probability asteroid impact (high stakes), the leverage penalty artificially suppresses the probability, making the investment look irrational. It conflates "unlikely" with "suspiciously influential."
  *   **Equivalence Check:** Distinct from **Leaf 2 (Capists)**. A Capist rejects the Mugger because the *value* is capped; a Leverage Skeptic rejects it because the *probability* is penalized. On Asteroid Insurance, the Capist acts normally; the Leverage Skeptic might hesitate if the stakes are high enough to trigger the penalty.

  ### Leaf 4: The Verificationists (No, No, Yes, Act, Expectation)
  *   **Position:** **Epistemic Verifiability.** You assign negligible mass to hypotheses that are empirically indistinguishable from noise or bluffing, regardless of stakes.
  *   **Case A (Mugger):** **Reject.** The mugger's claim is unfalsifiable/indistinguishable from a bluff.
  *   **Case B (Earthquake):** **Buy.** Seismological models are distinguishable from null hypotheses via data.
  *   **Collateral Damage:** **Low.** This preserves standard risk mitigation. However, it may blind you to *metaphysical* risks (e.g., simulation shutdown) where evidence is inherently unavailable.
  *   **User Query Placement:** This is **not** the Leverage Penalty in a costume. Leverage penalizes *influence* (I can affect many people); Verifiability penalizes *access* (You can't check my claim). A mugger could show you a detonator (Verifiable) for a high-stakes threat (Leverage). Leverage says "don't believe"; Verifiability says "believe." They diverge.

  ### Leaf 5: The Updateless Agents (No, No, No, Policy, [Irrelevant])
  *   **Position:** **Updateless Decision Theory (UDT).** You choose a policy *before* receiving the mugger's message. A policy of "pay muggers" invites more muggers in the logical space of simulations.
  *   **Case A (Mugger):** **Reject.** Paying incentivizes the creation of mugging scenarios by consequentialists.
  *   **Case B (Earthquake):** **Buy.** A policy of "mitigate known tail risks" yields high utility across the multiverse.
  *   **Collateral Damage:** **Low (Theoretically).** This is the "cleanest" fix for the Malign Prior. However, it requires solving the problem of "which prior do I use for the policy selection?" If the prior is already malign, the policy might be corrupted at the root.
  *   **Note:** Q5 is irrelevant because policy selection handles ambiguity by optimizing over the set of possible worlds directly.

  ### Leaf 6: The Ambiguity Averters (No, No, No, Act, Robustness)
  *   **Position:** **Maximin / Knightian Uncertainty.** When probabilities are uncomputable (Solomonoff) or unstable, treat the probability mass as zero or optimize for the worst-case within a confidence bound.
  *   **Case A (Mugger):** **Reject.** The probability is too unstable to enter the expectation; default to status quo.
  *   **Case B (Earthquake):** **Buy.** Actuarial data provides a stable confidence bound.
  *   **Collateral Damage:** **Moderate.** This creates a "probability threshold." Risks that are genuine but hard to model (e.g., novel AI failure modes) might be ignored because they lack stable frequentist data, while well-modeled risks get attention.

  ---

  ## Logical Space & Incoherent Combinations

  | Combination | Status | Reason |
  | :--- | :--- | :--- |
  | **Bounded Utility + Leverage Penalty** | *Redundant* | Coherent, but the Leverage Penalty does no work. If utility is capped, you don't need to penalize probability to avoid the Mugger. |
  | **Verifiability + Leverage Penalty** | *Coherent* | You can demand both that stakes lower probability AND that evidence be possible. This is a "double security" position. |
  | **Policy + Robustness** | *Coherent* | "Updateless Maximin." You choose a policy that maximizes the worst-case outcome across worlds. |
  | **Unbounded + No Leverage + No Verifiability + Act** | *The Sucker* | This is Leaf 1. It is logically coherent but pragmatically fatal (Malign Prior hijack). |
  | **Bounded Utility + Act + Robustness** | *Coherent* | A conservative, bounded agent. Very safe, but potentially misses huge opportunities. |

  ## Summary of Collateral Damage

  *   **The "Kill (B)" Fixes:** The **Leverage Penalty** (Leaf 3) is the primary offender. By tying probability to stakes, it makes *any* high-stakes insurance look like a scam. If you are trying to prevent human extinction (the highest possible stake), this rule tells you it's the least probable outcome, regardless of evidence.
  *   **The "Keep (B)" Fixes:** **Verifiability** (Leaf 4) and **Policy/Updateless** (Leaf 5) are the most robust. They distinguish the Mugger from the Earthquake based on *structure* (evidence availability or incentive compatibility) rather than *magnitude*.
  *   **The "Cap" Trade-off:** **Bounded Utility** (Leaf 2) saves you from the Mugger but imposes a ceiling on your altruism. It solves the hijacking problem by refusing to care about the hijackers' leverage.

  ## A Note on Your "Verifiability" Idea
  You asked if discounting by *evidence potential* is just a Leverage Penalty in disguise.
  **Verdict:** It is distinct.
  *   **Leverage Penalty:** $P(H) \propto \frac{1}{\text{Impact}(H)}$.
  *   **Verifiability Discount:** $P(H) \propto \text{InfoGain}_{\text{max}}(H)$.
  *   **Why it matters:** Imagine a mugger says, "I will kill $10^{100}$ people, and here is a cryptographic proof I can do it."
      *   **Leverage Penalty:** Still rejects. The stakes are too high.
      *   **Verifiability:** Accepts (or updates). The claim is now distinguishable from a bluff.
      *   **Collateral Check:** Verifiability allows you to fund high-stakes projects *if* you can measure progress. Leverage Penalty discourages high-stakes projects *even if* you can measure progress. For your reading group, Verifiability is likely the more "pro-science" solution to the Malign Prior.
