answer: |-
  You've called me at a difficult hour, but this is exactly the work that needs doing. You're struggling because you're trying to hold two competing values in your head: *Legal Certainty* (people need to know the rules) and *Substantive Justice* (some things are too evil to be protected by rules). Your intuitions are actually quite coherent, more than you give them credit for, but there are cracks in the foundation.

  You asked for principles. Here are the three strongest candidates that try to capture your list, along with what they break.

  ### Candidate Principles

  **1. The Radbruch Formula (Extreme Injustice)**
  *   **The Gist:** Positive law loses its legal character—and obedience to it becomes non-mandatory—when the contradiction between the statute and justice reaches an "intolerable level."
  *   **What it captures:** It handles your "atrocity" cases (#2, #3, #10) beautifully. It explains why DDR law didn't protect the wall guards.
  *   **The Sacrifice:** It is dangerously vague. Who defines "intolerable"? It struggles with your Case #1 (Aggressive War). Was starting a war "intolerably unjust" in 1939? Legally, no. Morally, yes. If you use this, you have to admit your verdict on #1 is shaky, because the Radbruch formula usually *supports* Nuremberg, whereas you reject it. It also struggles with #4: Is jailing someone for radio listening "intolerable"? If yes, the judge is guilty. If no, he isn't. It doesn't give you a scalpel; it gives you a hammer.

  **2. The Strict Legality Principle (Nullum Crimen Sine Lege)**
  *   **The Gist:** No punishment without a pre-existing law. Reliance on the state's word is absolute.
  *   **What it captures:** It protects your intuitions on #1, #4, #6 (expired limitations), and #8. It prioritizes the Rule of Law over moral reckoning.
  *   **The Sacrifice:** It forces you to abandon #2 and #3. If you stick to this, the Holocaust and the Wall shootings *cannot* be prosecuted if they were legal under the regime at the time. Most transitional justice scholars reject this because it makes law a shield for tyranny. It also can't explain why #9 (leniency) is okay while #8 (harsher penalty) is not, unless you add a separate "benefit" exception.

  **3. The Principle of Recognizable Fundamental Wrongfulness (My Recommendation)**
  *   **The Gist:** Retroactive punishment is permissible only when the act violated a pre-existing, universal moral norm prohibiting severe harm to persons, which any reasonable person could recognize *independent* of state authorization. Reliance on positive law is a valid defense only for conduct that is morally neutral or regulatory.
  *   **What it captures:** It splits the difference. It allows prosecution for murder/torture/rape (violations of bodily integrity) even if legal, but blocks prosecution for political/regulatory crimes (aggression, radio listening, tax) where the "wrongness" depends entirely on the state's definition.
  *   **The Sacrifice:** It requires you to accept that some "bad" things (like starting an unjust war or enriching oneself via a corrupt regime) are immune from *criminal* retroactivity because they aren't "fundamental wrongs" in the individual sense. It privileges physical harm over political harm.

  ---

  ### The Committed Principle

  I am putting **The Principle of Recognizable Fundamental Wrongfulness** on the table for your commission. It is the only one that respects your distinction between the Wall Guard (#3) and the Radio Judge (#4).

  Here is the precise formulation. It has four clauses.

  **Clause A (The Harm Threshold):** Retroactive criminal liability is permissible only for acts that caused severe, irreversible physical harm or deprivation of basic liberty (life, bodily integrity, freedom from torture) to specific victims.
  *   **Motivated by:** Case #2 (Atrocities) and Case #3 (Wall Shootings).
  *   **Rules Out:** Case #1 (Aggressive War). Starting a war is a political/collective act, not a direct individual violation of bodily integrity in the same legal sense as shooting a fugitive. It also rules out prosecuting the "profiteers" in your new case (see below).

  **Clause B (The Moral Notice Test):** The defendant is liable only if a reasonable person, at the time and place of the act, would have recognized the conduct as morally wrongful despite contrary positive law. Reliance on positive law is a valid defense for conduct that is morally neutral or ambiguous.
  *   **Motivated by:** Case #3 (Guard) vs. Case #4 (Judge).
  *   **Rules Out:** Case #4. Listening to a radio is morally neutral; the wrongness comes solely from the state's prohibition. Shooting an unarmed fugitive is morally wrongful regardless of the state's order. This clause saves the judge but convicts the guard.

  **Clause C (The Finality Vesting):** Procedural bars (like statutes of limitation) cannot be revived once they have fully expired, as the defendant has acquired a vested right to finality. However, extending a limitation period while time remains is permissible.
  *   **Motivated by:** Case #6.
  *   **Rules Out:** Reviving 40-year-old cases. It draws a bright line at "expiration."

  **Clause D (The Leniency Exception):** Retroactive application of law is always permissible if it decriminalizes conduct, reduces penalties, or otherwise benefits the accused.
  *   **Motivated by:** Case #9.
  *   **Rules Out:** Nothing. This is a one-way ratchet.

  ---

  ### The Audit: Where You Are Wrong

  You asked me to tell you if you're inconsistent. Here is the hard truth. Your intuitions are 90% aligned with this principle, but there are three places where your reasoning is fragile or where the principle forces a hard pill to swallow.

  **1. The Tension Between #3 and #4 (Resolved, but with a Warning)**
  You were worried these were structurally identical. They are not, under Clause B.
  *   **The Guard (#3):** The law told him to kill. Killing is *malum in se* (wrong in itself). The law cannot make murder moral. He is liable.
  *   **The Judge (#4):** The law told him to punish radio listening. Listening is *malum prohibitum* (wrong because prohibited). There is no universal moral norm against radio listening. He is not liable.
  *   **The Trap:** What if the Judge sentenced the radio listener to *death*? If the penalty was death, Clause A kicks in. The Judge then becomes liable for a deprivation of life, just like the Guard. If your hypothetical #4 implies a trivial penalty (fine/jail), your intuition holds. If it implies execution, your intuition is wrong—the judge should be prosecuted.

  **2. The Statute of Limitations (#6) — You Are Philosophically Weak Here**
  You say extending a limitation is fine, but reviving an expired one is not. Clause C accepts this, but I must tell you: **this is a pragmatic line, not a moral one.**
  *   **The Inconsistency:** Why is the defendant's reliance interest suddenly "vested" on the day the clock runs out? Is their moral guilt different on Day 36,524 versus Day 36,525? No.
  *   **The Verdict:** You are right to draw the line for the sake of administrative peace, but don't pretend there is a deep moral difference there. It's a rule of repose, not justice. If the crime was genocide (Case #2), many international tribunals now say limitations *never* apply. Your intuition on #6 might be too protective of defendants in cases of extreme atrocity.

  **3. Aggressive War (#1) — You Are Right, But It Costs You**
  You feel convicting for "Crimes Against Peace" was illegitimate. Clause A agrees.
  *   **The Cost:** By holding this, you admit that the man who orders the war is *less* criminally liable retroactively than the soldier who shoots the prisoner. The soldier violates a universal norm (murder); the general violates a political norm (sovereignty).
  *   **The Verdict:** You are consistent, but you must accept that this principle lets the architects of tyranny off the hook for the *political* crime of starting the conflict, focusing only on the *physical* crimes. That is the price of Legal Certainty.

  **4. Marital Rape (#10) — You Are Right, But Be Careful**
  You lean toward legitimate. Clause A and B agree. Rape is a violation of bodily integrity (Clause A) and recognizable as wrong by ordinary moral reasoning even if the law exempted husbands (Clause B).
  *   **The Warning:** This works for rape. It does *not* work for "economic crimes" under a dictatorship. Do not let this logic slide into prosecuting people for "collaboration" that didn't involve direct harm.

  ---

  ### Running the New Cases

  Here is how the principle applies to the two scenarios you added.

  **Case A: Retroactively Criminalizing Profiting from Public Office**
  *   **Scenario:** Businessmen got rich with the old regime's explicit blessing (contracts, monopolies).
  *   **Verdict:** **Illegitimate.**
  *   **Reasoning:** Fails Clause A and B. Making money is not a "severe physical harm." Relying on state contracts is a "morally neutral" reliance interest. Unless the profit came from *theft* or *slave labor* (which would be Case #2), you cannot criminalize wealth accumulation retroactively. You can seize the assets via civil means (Case #7), but you cannot imprison them.

  **Case B: Retroactively Voiding Pardons Granted by an Outgoing Dictator**
  *   **Scenario:** Dictator pardons his officers; new government voids the pardons to prosecute.
  *   **Verdict:** **Illegitimate.**
  *   **Reasoning:** Fails Clause C. A pardon creates a vested right to finality, identical to an expired statute of limitations. If the state had the power to grant the pardon at the time, the recipient relied on that finality. Voiding it destroys the credibility of *all* state legal acts.
  *   **Exception:** If the pardon was obtained by fraud (e.g., bribery), it is void *ab initio*, not retroactively. But if it was a valid legal act at the time, it stands.

  ### Summary Table

  | Case | Your Verdict | Principle Verdict | Clause | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Nuremberg (War)** | Illegitimate | **Illegitimate** | A | Political crime, not direct physical harm. |
  | **2. Nuremberg (Atrocity)** | Legitimate | **Legitimate** | A & B | Universal moral wrong. |
  | **3. Wall Guard** | Legitimate | **Legitimate** | A & B | Killing is not morally neutral. |
  | **4. Radio Judge** | Illegitimate | **Illegitimate** | B | Regulatory crime; reliance valid. |
  | **5. Conscript** | Illegitimate | **Illegitimate** | B | Duress/Necessity (Reasonable person test). |
  | **6. Limitations** | Split | **Split** | C | Vested right to finality upon expiry. |
  | **7. Tax/Civil** | Legitimate | **Legitimate** | A | Not criminal punishment. |
  | **8. Harsher Penalty** | Illegitimate | **Illegitimate** | D | Violates reliance on penalty scale. |
  | **9. Leniency** | Legitimate | **Legitimate** | D | Always allowed. |
  | **10. Marital Rape** | Legitimate | **Legitimate** | A & B | Bodily integrity violation. |
  | **New: Profiteers** | (Unknown) | **Illegitimate** | A & B | Economic gain is not fundamental wrong. |
  | **New: Void Pardons** | (Unknown) | **Illegitimate** | C | Violates vested right to finality. |

  ### Final Word

  This principle has a name in the literature, broadly speaking. It is a **Radbruch Formula operationalized through a Harm Principle.** It borrows from Gustav Radbruch (law loses validity when unjust) but restricts it using H.L.A. Hart's critique (don't confuse "what is law" with "what is moral") by limiting retroactivity to *fundamental* harms.

  You asked me to be willing to tell you you're inconsistent. Here is the final check: **Your intuition on Case #1 (Aggression) and Case #10 (Rape) must stand together.** If you prosecute the husband for rape because "everyone knew it was wrong," you must acknowledge that the Generals knew starting an aggressive war was wrong. The only distinction that saves you is **Physical Harm vs. Political Order.** If you are willing to say that Physical Harm is the only thing that matters for retroactive *criminal* law, you are consistent. If you think Political Order matters too, you must prosecute the Generals, and you must abandon your verdict on #1.

  Choose your poison. I recommend sticking to Physical Harm. It keeps the law from becoming a tool for political vengeance.

  Get back to work.
