answer: |-
  Podcast Prep Notes: Thomson's Lamp Guest
  *Goal: Don't let her drift into pure semantics. Need to pin down the metaphysics vs physics split.*

  **1. The "Category Mistake" Hook**
  Start by asking her to clarify what she means by treating the sequence as a "completed totality." Is she saying the problem is purely linguistic, or that reality itself doesn't have a truth-value at the limit?
  *   **Follw-up:** If she says it's just a linguistic error (like asking "what colour is jealousy?"), push: "But the lamp is a physical object. Are you saying physics makes a category mistake, or just our description of it?"

  **2. The Local Switch-Rule**
  This is key. Ask why the local rule (on→off, off→on) doesn't dictate the outcome. If every single step *before* t=2 is determined, why doesn't that determination carry over?
  *   **Follow-up:** She'll likely say the rule only applies to intervals, not points. Hit back: "So you're proposing a law of nature that just stops applying at the limit? Isn't that ad hoc?"

  **3. Empirical Emptiness**
  Press her on whether the lamp's state at t=2 is empirically empty. If no measurement can capture the instantaneous state, does her view make the paradox vanish simply because we can't check it?
  *   **Follow-up:** If she argues physics can't reach the limit, ask: "So metaphysics quits wherever measurement stops? Are we doing philosophy or just instrumentation here?"

  **4. Spatial vs. Temporal & Quantum Discreteness**
  She claims spatial supertasks (Benardete's books) are physically impossible due to density, but temporal ones are just puzzling. Ask if quantum discreteness (Planck length) doesn't undercut this. If space is quantised, isn't the spatial supertask impossible for the same reason the temporal one might be?
  *   **Follow-up:** If she says quatum mechanics saves her by blocking infinite division, press: "Then isn't the impossibility contingent on current physics, rather than the conceptual point you're making?"

  **5. Repackaging "No-Fact-of-the-Matter"**
  Be direct: Is this just the standard 'no-fact-of-the-matter' answer (like Lewis or van Inwagen) dressed up with 'global consistency' jargon? What's the actual gain here?
  *   **Follow-up:** She'll probably insist it's about grammatical illegitimacy, not metaphysical indeterminacy. Ask: "Doesn't that turn philosophy into therapy? You're curing us of asking the question rather than answering it."

  **6. Ontology of the Limit Point**
  If there's no state at t=2, what is there? Is it a gap in reality, or just a gap in our modelling? If the lamp exists at t=2, how can it lack a property like 'onness'?
  *   **Follow-up:** If she says properties don't apply at limits, ask: "So objects can exist without having definite physical states? That sounds worse than the paradox."

  **7. Causality After the Supertask**
  What happens at t=2.01? Does the state at the limit affect the future? If the lamp is undefined at t=2, can it causally influence anything afterwards?
  *   **Follow-up:** If she says causality holds regardless, ask: "How can an undefined state cause a defined effect? That breaks conservation laws, doesn't it?"

  **8. Broader Implications (Zeno)**
  Finish by asking if this defence kills Zeno's paradoxes too. If we can't treat infinite sequences as completed totalities, do we lose the standard calculus solution to Zeno?
  *   **Follow-up:** If she says calculus is safe but metaphysics isn't, ask: "So maths works, but reality doesn't follow the maths? Where's the boundary?"

  *Reminder: Keep her honest on the physics bits. She tends to wave hands at "density constraints."*
