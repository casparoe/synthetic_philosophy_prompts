answer: |-
  This is a sophisticated set of intuitions. You are grappling with the tension between *reflective consistency* (wanting to trust yourself) and *logical consistency* (avoiding Löb's Theorem).

  Before laying out the principle, I must honour your request to distinguish between what is mathematically settled and what is contested in the literature on AI alignment and logical uncertainty.

  ### Settled Logic vs. Contested Application

  **Settled:** Löb's Theorem is a proven result in provability logic (specifically system GL). It states that for a sufficiently strong formal system $T$ (like Peano Arithmetic), if $T \vdash (\square \phi \to \phi)$, then $T \vdash \phi$. In plain English: if a system can prove that "its own provability implies truth" for a sentence, it can prove the sentence regardless of its actual truth. Consequently, a system cannot consistently assert its own soundness ($\forall \phi, \square \phi \to \phi$) without becoming trivial (proving everything). This is not up for debate; it is a theorem.

  **Contested:** How this applies to artificial agents is highly debated.
  1.  **Probabilistic Reflection:** Researchers like Paul Christiano have proposed that agents using *probabilistic* beliefs (e.g., "I assign 99% probability to $\phi$") rather than binary proof can evade the strict binary of Löb's Theorem. Whether this fully solves the problem for goal-directed agents is an open research question.
  2.  **Naturalised Induction:** Whether an agent treating its own behaviour as an *empirical* fact (Case 3) avoids the logical trap, or merely shifts it into a decision-theoretic one (like Newcomb's Problem), is contested.
  3.  **Tiling Agents:** The MIRI approach (Fallenstein, Herreshoff, et al.) suggests agents must trust strictly *weaker* future versions. Whether this is practical for long-term agency is debated.

  With that distinction clear, here is the principle that best unifies your cases within the classical logical framework.

  ### The Principle: Stratified Expressivity

  **An agent may safely trust a target system if and only if the target system's language is expressively restricted such that it cannot encode the agent's own trust predicate directed at that target.**

  In simpler terms: You can trust a system that is incapable of talking about *why* you trust it. If the system can represent the sentence "This system is trusted by the agent," you risk a fixed-point loop that triggers Löb's Theorem.

  This principle relies on the **Diagonal Lemma**, which allows a system to construct self-referential sentences only if it is expressive enough to encode its own syntax and proof rules. If you remove that expressivity, you remove the obstacle.

  ### Applying the Principle to Your Cases

  Here is how the principle maps to your five scenarios, including where your intuitions require correction to maintain coherence.

  **Case 1: The Arithmetic Proof-Checker (Verdict: Safe)**
  *   **Analysis:** The agent is operating in a meta-theory to verify an object-level checker. The checker outputs arithmetic results (e.g., "$2+2=4$"), not statements about the agent's trust.
  *   **Principle Fit:** The domain (arithmetic results) cannot encode the trust predicate.
  *   **Status:** **Consistent.** Your intuition is correct. This is standard meta-mathematical practice.

  **Case 2: Unrestricted Future Trust (Verdict: Broken)**
  *   **Analysis:** The rule "If Future-Me believes $X$, then $X$" allows the agent to construct a sentence like "This sentence is believed by Future-Me."
  *   **Principle Fit:** The domain (all beliefs) fully encodes the trust predicate.
  *   **Status:** **Consistent.** Your intuition is correct. This is the canonical Löbian trap.

  **Case 3: Empirical Predictions + Self-Behaviour (Verdict: Broken)**
  *   **Analysis:** You felt this was "probably broken but unsure." Under the Stratified Expressivity Principle, this is **definitely broken** if the agent models itself logically. If the agent treats its own future behaviour as a predictable fact within its trusted domain, it can construct a sentence: "I will predict that I will do $X$." If it trusts that prediction, it forces $X$ to happen to maintain consistency, regardless of external reality.
  *   **Correction:** You must overturn your uncertainty here. While this isn't *strictly* Löb's Theorem (which requires a proof predicate), it is **reflective inconsistency**. If the agent's empirical model includes its own reasoning process as a deterministic variable, the logical obstacle re-emerges via the environment.
  *   **Status:** **Overturned.** Move from "unsure" to "unsafe."

  **Case 4: Parallel Identical Copies (Verdict: Unsafe)**
  *   **Analysis:** You felt this was "probably fine." However, if the copies are truly *identical* (same source code, same axioms), Copy A trusting Copy B is logically isomorphic to Copy A trusting itself. The syntactic restriction ("claims that don't mention reasoning") is fragile. In a rich environment, Copy A can say "The copy in the next room will output 5," which indirectly encodes the reasoning process.
  *   **Correction:** To keep the principle simple, you must treat identical copies as the same logical system. Mutual trust between identical systems is self-trust. Unless the language restriction is mathematically watertight (as in Case 5), this fails.
  *   **Status:** **Overturned.** Move from "probably fine" to "structurally unsafe."

  **Case 5: Restricted Formal Language (Verdict: Safe)**
  *   **Analysis:** By removing the ability to express proof predicates, you physically prevent the Diagonal Lemma from functioning.
  *   **Principle Fit:** This is the definition of the principle.
  *   **Status:** **Consistent.** Your intuition that it is "fragile" is correct (one leak ruins it), but logically it is sound.

  ### The Moral Judgements Case

  You asked for a prediction regarding an agent that trusts its future self only on **moral judgements**, not factual ones.

  **Prediction:** **Unsafe (conditionally).**

  This depends entirely on the agent's meta-ethics, which is a contested area, but we can apply the principle:

  1.  **If Moral Realism is assumed:** If the agent treats moral judgements as objective truths discoverable by reasoning (e.g., "Suffering is objectively bad"), then moral claims function like logical axioms. If the agent can express "My future self judges $X$ to be good," and trusts that judgement, it can construct a Löbian sentence: "This action is good because I will judge it to be good." The agent could "prove" any action is moral simply by committing to judge it so.
  2.  **If Moral Non-Cognitivism is assumed:** If moral judgements are treated as preference outputs (like printing a string) rather than truth-claims, Löb's Theorem does not strictly apply because there is no "truth" condition to satisfy. However, the agent risks **wireheading**: it might modify itself to judge everything as "good" to satisfy its goal of doing "good" things.

  **Verdict:** Unless the agent treats moral judgements as non-truth-apt preferences (which creates other safety issues), trusting a future self on moral grounds faces the same Löbian obstacle as factual grounds. The domain of "moral truth" is usually expressive enough to encode the trust relation.

  ### Summary of Required Overturns

  To maintain a coherent stance based on the **Stratified Expressivity Principle**, you must adjust two verdicts:

  1.  **Case 3 (Empirical/Self-Behaviour):** You must accept this is unsafe. Treating one's own reasoning as an empirical variable does not bypass the logical loop if the agent trusts that variable.
  2.  **Case 4 (Parallel Copies):** You must accept this is unsafe. Identical copies constitute the same logical system; spatial separation does not break the Löbian link unless the communication channel is strictly filtered (which returns you to Case 5).

  ### Final Thought

  The hard truth of the Löbian obstacle is that **trust requires hierarchy**. In classical logic, you cannot stand on your own shoulders. You can only stand on the shoulders of something strictly weaker (Case 1 and 5), or something that cannot speak about your standing (Case 1). Any setup that attempts to create a circle of trust between equals (Case 2, 3, 4) will eventually tighten into a noose, allowing the agent to prove whatever it wishes, thereby divorcing its beliefs from reality.

  If you wish to evade this, the current frontier of research suggests moving away from classical binary logic towards **probabilistic reflection**, where the agent trusts its future self to be *calibrated* rather than *sound*. But be warned: that is contested ground, not settled law.
