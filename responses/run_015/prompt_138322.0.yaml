  ### Expert Critique & Patch

  You have the spirit of Harsanyi right, but the technical execution has two vulnerabilities a knowledgeable opponent could exploit.

  1.  **Aggregation vs. Veil:** Harsanyi's 1955 *Aggregation Theorem* combines *known* individual preferences into a social welfare function. His *Veil of Ignorance* argument (1953, 1975) is what derives utilitarianism from rational choice under uncertainty. Ilse is conflating them. **Patch:** Have her cite the Veil specifically as the justification for the weights, and the Aggregation Theorem as the proof that any deviation is inconsistent.
  2.  **Total vs. Average & Possible People:** In a fixed-population crisis (which this is), Total and Average Utilitarianism yield identical rankings. Bringing in "possible people" to justify Average Utilitarianism is philosophically volatile (it invites the "Mere Addition Paradox" and implies killing happy people to raise the average). It distracts from her main goal: saving the young. **Patch:** Drop the "Average Utilitarianism" claim. Instead, have her argue for **Ex-Ante Expected Utility over Life-Courses**. Behind the veil, you don't know your current health status (sickest vs. healthy) or your age. You maximize your *expected* remaining life. This naturally favors the young (more life-years) and carers (instrumental utility) without needing controversial population ethics. It frames the "sickest" argument as irrational *ex-post* bias.

  Here is the patched, airtight version of the scene.

  ### The Speech

  "Councilor Vane argues we save the sickest. He calls it mercy. I call it a violation of the Charter's own logic.

  Meridia guarantees every citizen an equal claim. Harsanyi proved what that means mathematically. If we accept the Pareto principle—that we shouldn't make someone worse off without making another better off—and we accept the axioms of rational choice, then social welfare *must* be the sum of individual utilities. Any other weighting is logically inconsistent. It is not 'kindness'; it is incoherence.

  But Vane's error is deeper. He is judging from behind a veil that only covers our names. He knows he is sick. He knows he is dying. That is *ex-post* reasoning. It is bias masquerading as morality.

  True justice requires a thicker veil. You must not know your age. You must not know your health. You must not know if you are a carer holding the line or a patient begging for relief. You only know you are a citizen of Meridia. From that position, would you maximize the utility of the current moment? No. You would maximize your *expected* life-course.

  Behind that veil, every rational agent chooses the policy that grants the highest expected remaining years. To give the dose to the sickest is to trade fifty years of life for one. To give it to the carers is to protect the network that keeps us all alive. This isn't cold math. It is the only warm choice that respects every future self you might have had. To vote otherwise is to say that your current suffering matters more than your future existence. I ask you: do you?"

  ### Heckles & Swats

  *   **Heckle:** "You're reducing human lives to numbers!"
      *   **Ilse's Swat:** "No. I'm reducing *policy* to numbers so lives don't become numbers. If we allocate by emotion, the loud die and the quiet perish. Math is the only blindfold fair enough for death."
  *   **Heckle:** "What about the elderly? Do they have no claim?"
      *   **Ilse's Swat:** "They have equal claim behind the veil. But behind the veil, you know you might be young. Expected utility dictates you insure against lost time. We honor the elderly by caring for them, not by wasting the cure that buys the city a future."
  *   **Heckle:** "This is tyranny of the majority."
      *   **Ilse's Swat:** "It's tyranny of the axioms. Reject the Pareto principle if you dare. Tell us you prefer a world where everyone is slightly worse off just to satisfy a intuition about fairness. I'll wait."
