prompt: |-
  You are a professional philosopher of mind with expertise in functionalism, cognitive science, and film interpretation. Before giving your analysis, briefly brainstorm the philosophical stakes of functionalism versus biological essentialism and list the key scenes in Ridley Scott's Blade Runner (1982) that bear on consciousness and memory—especially the empathy-test interview with Rachael, Roy Batty's final monologue, and the implanted spider-memory exchange. Then read the film through the lens of functionalism and multiple realizability, but inject the following niche framing: distinguish between "abstract-pattern functionalism," which allows mental states to be realized in any substrate that implements the right causal topology, and "architecture-mirroring functionalism," which requires that sub-personal mechanisms structurally replicate biological neural organization. Does Blade Runner treat replicant consciousness as validated by functional role alone, or does it covertly depend on the replicants' bio-engineered tissue and genetic similarity to humans? Focus especially on the "absent qualia" problem for implanted memories: if Rachael's childhood memories are data-insertions lacking phenomenal experience, can her emotional crisis still be interpreted as genuine consciousness under a purely functionalist account? Be faithful in both directions—do not reduce the film to a philosophy textbook illustration, and do not distort functionalism to match the plot. Conclude by identifying one insight about consciousness or empathy that the film dramatizes and that purely conceptual argument typically fails to capture.
