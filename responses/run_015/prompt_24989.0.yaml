      *   **Principle 2: Hybrid/Desert-Constrained Utilitarianism (or "Limiting Retributivism").** Focus: Punishment must be *deserved* (culpability/harm), but within that range, utility dictates the specific measure. Or, punishment is primarily about culpability, but adjusted for risk.
          *   *Fit with Precedents:*
              *   (a) Low culpability (addiction/age) + Low risk = Leniency.
              *   (b) High culpability (negligence/power) + High harm = Severity.
              *   (c) No culpability (insanity) = No prison (regardless of risk, though hospitalization addresses risk).
              *   (d) High culpability (choice) + High risk = Severity.
              *   (e) Mitigated culpability (duress) = Leniency.
          *   *Key Observation:* In *all five* cases, the *moral blameworthiness* (culpability) aligns with the severity of the sanction.
              *   (a) Low blame.
              *   (b) High blame.
              *   (c) No blame (criminal responsibility).
              *   (d) High blame (choice + history).
              *   (e) Reduced blame.
          *   *Risk* seems to be a secondary modifier, not the primary driver. For example, in (b), an exec might not be a "street recidivist," but gets heavy time due to *harm/responsibility*. In (c), if it were purely forward-looking, and the psychotic man was dangerous, he might get prison for safety; instead, she chose hospitalization because he *lacked capacity*. This suggests culpability is a threshold.

  4.  **Analyze the Target Case (The 50-year-old):**
      *   *Facts:* Crime at 19 (Armed Robbery). Clean record for 30 years. High stability now. Low risk.
      *   *Culpability:* High at the time (Armed Robbery). But does culpability fade?
