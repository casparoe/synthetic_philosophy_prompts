          *   *Conclusion:* The judge is **not** a pure forward-looking utilitarian. She weighs culpability and harm heavily.
          *   *However*, she is also not a strict "eye-for-an-eye" retributivist. Case (a) and (e) show significant mercy based on context and potential for reform.
          *   *Synthesis:* She likely follows a **"Limiting Retributivism"** model (Norval Morris). Punishment must be *deserved* (not more than culpability warrants), but within that range, utility (risk/rehab) determines the spot.
