              *   *Wait, let's look closer:* In (d), the burglar got length due to *public protection*. In (b), the exec got length due to *harm/responsibility*.
              *   If she were purely forward-looking, (b) is hard to justify if the exec isn't a risk to reoffend. She justified it on "gravity of harm." That is retributive language.
              *   If she were purely retributive, (a) is hard to justify if the theft was serious enough. She justified it on "counterproductive." That is utilitarian language.
              *   *Verdict:* She is a **Hybrid**. But which weight is heavier?
              *   Case (c) is the strongest evidence against pure utilitarianism. (Safety vs. Capacity). She chose Capacity.
              *   Case (b) is strong evidence against pure risk-assessment. (Low recidivism risk vs. High Harm). She chose Harm.
              *   Therefore, **Desert/Culpability is the primary driver**, modified by utility.
              *   *Target Case Prediction:* Since Desert is primary, she cannot ignore the crime. But since Utility is the modifier, and risk is zero, she would likely give a **token sentence** (e.g., time served, probation, or a very short term) to acknowledge the wrong without destroying the life he has built. A pure forward-looking judge might dismiss entirely. A pure retributivist might give 5-10 years. She will split the difference.

  6.  **Developing the "Clean Separator" Case:**
      *   Need a case where Desert and Utility point in *opposite* directions, more sharply than the Target Case.
