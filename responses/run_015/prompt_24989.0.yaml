          *   *Reasoning:* Coercive context (Mitigated Culpability).
          *   *Desert Factor:* Mitigated (Act was wrong, but blame reduced by context).
          *   *Risk Factor:* Low (Specific situation, unlikely to reoffend).

  3.  **Evaluate the Competing Principles:**

      *   **Principle 1: Pure Forward-Looking (Consequentialist/Utilitarian).** Focus: Deterrence, Incapacitation, Rehabilitation.
          *   *Fit with Precedents:*
              *   (a) Fits well (Rehab > Prison).
              *   (b) Fits well (Deterrence/Incapacitation of powerful actors).
              *   (c) Fits well (Treatment > Prison for safety).
