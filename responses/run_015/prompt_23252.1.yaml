answer: |-
  Good morning.

  Look around this room. On my left, I see the architects of mechanism design, the modelers of equilibrium, the people who speak the language of incentives and constraints. On my right, I see the analysts of justification, the scholars of belief, the people who ask what it means to *know* something.

  We are here for a two-day workshop on the Epistemology of Markets. That title is not merely a conjunction of two disciplines; it is a description of a tension. For the economist, the market is a machine for allocation. For the epistemologist, the market is a system for aggregation. But for both of us, the market is, fundamentally, a processor of information.

  My goal this morning is not to survey the literature. You have the program for that. My goal is to propose a shared problem. I want to suggest that two of the most famous results in financial economics—the Milgrom–Stokey no-trade theorem and the Grossman–Stiglitz paradox—are not merely technical hurdles for modelers. They are deep epistemological puzzles about the possibility of social learning.

  I want to start with silence.

  In 1982, Paul Milgrom and Nancy Stokey published a result that keeps financial theorists awake at night. It is the no-trade theorem. I want to walk through the intuition of this theorem without a single sigma-algebra or probability measure.

  Imagine a group of traders. They are all rational. They all know that everyone else is rational. This is what we call "common knowledge of rationality." They start with an initial endowment of assets—stocks, bonds, cash. Let us assume, for the sake of the argument, that this initial distribution is Pareto optimal. That is, given what they currently know, no one can be made better off without making someone else worse off. They are in a state of rest.

  Now, suppose one trader receives a private signal. Perhaps she sees a weather report that will affect crop yields; perhaps he sees an order flow that suggests a merger. She now wants to trade. She offers to sell an asset to you.

  Here is the epistemological crux: Why are you willing to buy?

  If you are rational, you know that she is rational. You know she would not offer to sell unless she believed the asset was overvalued. Her willingness to trade is itself a signal. It reveals that she has information you do not have. If you update your beliefs based on the fact that she is offering to trade, you must conclude that the asset is worth less than you thought.

  But if you conclude the asset is worth less, you won't buy.

  Milgrom and Stokey showed that under conditions of rational expectations, if the initial endowment is common knowledge to be efficient, *no trade can occur*. Even if agents have different private information, they cannot agree to trade. The mere offer to trade unravels the information asymmetry that made the trade seem attractive in the first place.

  For the economist, this is a puzzle about liquidity. Where does the volume come from? We usually solve this by adding "noise traders"—irrational agents who trade for exogenous reasons—to provide cover for the informed.

  But for the epistemologist in this room, I ask you to look at the structure of the argument. The no-trade theorem tells us that **inaction is evidence.**

  In a rational expectations equilibrium, silence is not empty. Silence is common knowledge that no agent's signal has disturbed the marginal conditions of the market. If trade does not happen, it is because the market has already priced in the *possibility* of your information.

  This implies a staggering epistemic demand on the agents. For silence to be meaningful, every agent must be able to simulate the reasoning of every other agent. They must know what others know, and know that others know that they know. The no-trade theorem is not just a claim about asset prices; it is a claim about the limits of common knowledge. It suggests that in a world of perfect rationality, disagreement is impossible. If we disagree, one of us must be irrational. And if I know you are rational, I must defer to your willingness to trade, which eliminates my incentive to trade.

  So, we have a market that is so epistemically efficient that it freezes. It becomes a hall of mirrors where no one moves because everyone sees everyone else seeing them.

  But suppose we break the mirror. Suppose we admit that prices do not perfectly reflect all information. Suppose we allow for the possibility that some agents know more than the price reveals. This leads us to the second pillar of our morning: the Grossman–Stiglitz paradox of 1980.

  Sanford Grossman and Joseph Stiglitz asked a deceptively simple question: If markets are informationally efficient—if prices fully summarize all available information—then how does that information get into the price in the first place?

  Information is costly. It takes time to analyze a balance sheet; it takes money to build a satellite network to count cars in retail parking lots. If the price perfectly reflects that information, then an uninformed trader can look at the price and get the benefit of that analysis for free. They can "free ride" on the informed traders.

  But if everyone free rides, no one pays for the information. If no one pays for the information, the price stops reflecting the information. If the price stops reflecting the information, it becomes profitable to gather information again.

  Grossman and Stiglitz proved that a competitive equilibrium cannot exist where prices are fully informative. There must always be a degree of inefficiency. There must always be enough noise, enough uncertainty, to compensate the informed traders for the cost of their knowledge.

  Philosophically, this is profound. It means that **ignorance is a structural necessity for the market to function.**

  If the market were truly omniscient, it would cease to exist. The Grossman–Stiglitz paradox tells us that perfect transparency is incompatible with incentive compatibility. For the price mechanism to work as an information aggregator, it must be imperfect. It must lie, just a little bit. It must hide just enough to protect the profit margin of the truth-seekers.

  So, let us pause and look at the landscape we have mapped in these first ten minutes.

  Milgrom and Stokey tell us that if agents are too rational and information is too transparent, trade vanishes.
  Grossman and Stiglitz tell us that if prices are too informative, the incentive to produce information vanishes.

  Both theorems describe a market that, under conditions of epistemic perfection, collapses. One collapses into stagnation; the other collapses into blindness.

  Now, I can hear the economists in the room shifting in their seats. I anticipate the objection. It is a standard and fair critique.

  You will say: "These results rely on highly restrictive assumptions. Milgrom–Stokey requires common priors, risk aversion, and Pareto-optimal initial endowments. Grossman–Stiglitz relies on specific functional forms of utility and noise. In the real world, we have heterogeneous priors. We have transaction costs. We have behavioral biases. We have high-frequency algorithms that don't care about rational expectations. In the real world, trade happens. A lot of it."

  You are right. As empirical predictions, these models are fragile. If your goal is to forecast volume on the NYSE tomorrow, these theorems are not your tools.

  But I am asking the epistemologists and the economists in this room to resist the urge to dismiss these results as mere "frictions."

  Why should the epistemologist care about a theorem that assumes conditions no human being satisfies?

  Because these theorems are not descriptions of reality; they are **logical limit theorems.** They define the boundary conditions of social knowledge.

  When a physicist studies frictionless vacuums, they do not believe the air in the lab has vanished. They are isolating the fundamental forces to see how they interact without interference. Milgrom–Stokey and Grossman–Stiglitz are doing the same for the epistemology of the social world.

  They tell us that *agreement* and *trade* are not the default state of rational interaction. They are the anomalies. The default state, under strict rationality, is a lock.

  So, when we see trade in the real world, we are not just seeing "noise." We are seeing a violation of the common knowledge of rationality. We are seeing evidence that agents do not, in fact, share the same priors. Or, we are seeing evidence that agents are not updating their beliefs in a Bayesian fashion.

  This is where I want to issue an invitation to a shared research program.

  For too long, the division of labor has been this: The economists build the models and treat the epistemic assumptions (priors, rationality, common knowledge) as technical parameters to be tweaked until the model fits the data. The philosophers critique the assumptions from the outside, arguing that "rationality" is ill-defined or that "common knowledge" is impossible for finite minds.

  This workshop offers us a chance to change that division of labor.

  To the economists: I invite you to treat the epistemic assumptions not as scaffolding to be stripped away, but as the very phenomenon we are studying. When you add "noise traders" to your model to restore trade, you are not just fixing a bug. You are making an anthropological claim. You are claiming that a certain percentage of the population acts randomly, or irrationally. What is the epistemic status of that claim? How do we identify the noise? Is noise merely the residue of our models, or is it a fundamental feature of market ecology?

  To the epistemologists: I invite you to engage with the mechanism of the price. Do not treat the market as a black box that outputs "beliefs." Look at how the Grossman–Stiglitz tension plays out in the digital age. With the advent of big data and AI, the cost of information acquisition is plummeting. Does this push us closer to the Grossman–Stiglitz collapse? If information becomes free, does the incentive to produce *novel* information vanish? Are we entering an era where markets become *less* efficient because the cost of being informed is too low?

  Consider the Milgrom–Stokey silence in the context of modern high-frequency trading. Algorithms trade in microseconds. They are, in a sense, more rational than humans. They update faster. They simulate opponents better. Should we not expect, by the logic of the no-trade theorem, for liquidity to dry up as algorithms become more sophisticated? Yet, liquidity remains. Why? Is it because the algorithms have different priors? Or is it because the definition of "information" has changed?

  This is the shared territory I want us to explore over the next two days.

  We need to understand the **ecology of ignorance.**

  Grossman and Stiglitz taught us that some ignorance must be preserved for the market to survive. But what kind of ignorance? Is it symmetric ignorance, where no one knows anything? Or is it asymmetric ignorance, where some know and others guess?

  Milgrom and Stokey taught us that common knowledge kills trade. But in our era of social media and instant communication, we are constantly attempting to create common knowledge. We broadcast earnings calls; we tweet regulatory changes. We try to make everything public. If the no-trade theorem holds, increasing public transparency should reduce trading volume, all else being equal. Does it?

  These are not questions that economics can answer alone, because they require a rigorous analysis of the concepts of knowledge, belief, and evidence. And they are not questions philosophy can answer alone, because they require an understanding of the incentives and constraints that shape human interaction.

  We are here to study the Epistemology of Markets. Let us not make the mistake of thinking that means applying epistemology *to* markets, as if the market were a passive subject. The market *is* an epistemic engine. It is a computer made of people.

  The no-trade theorem tells us that if the computer is too perfect, it halts.
  The Grossman–Stiglitz paradox tells us that if the output is too clear, the input stops.

  Therefore, a functioning market must be imperfect. It must be noisy. It must be opaque.

  This suggests a radical conclusion: **Market efficiency is not a state of perfection; it is a state of managed imperfection.**

  Over the next two days, I hope we can move beyond the objection that "the models are too idealized." Let us instead ask: What do these idealizations reveal about the necessary conditions for social learning?

  When an economist models a "prior," what is the philosophical status of that probability distribution? Is it a degree of belief? A frequency? A betting quotient?
  When a philosopher speaks of "justification," how does that map onto the economic concept of "arbitrage"?

  If we can bridge these languages, we might solve more than just a workshop theme. We might explain why, in a world of infinite data, we still disagree. We might explain why, in a world of transparent prices, we still take risks.

  The silence of Milgrom–Stokey and the paradox of Grossman–Stiglitz are not dead ends. They are signposts. They point to the fragile boundary where private belief becomes public fact. They point to the moment where information becomes price.

  That transformation is the heart of our inquiry. It is where the logic of the mind meets the logic of the crowd.

  I look forward to your papers, your critiques, and your collaborations. Let us see if we can make some noise together.

  Thank you.
