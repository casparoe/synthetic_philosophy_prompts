  The definition of the philosophical zombie is standard and generally accepted as a coherent thought experiment setup for the sake of argument. However, the claim that "anything we can genuinely conceive is a genuine possibility" is a massive simplification that directly triggers your Kripke worry. Chalmers does not rely on casual imagination; he argues for "ideal positive conceivability," meaning a contradiction cannot be found even by an ideal reasoner with full information. Your intuition about water and H2O is correct: Kripke showed that identity statements can be necessary truths known only after investigation. The summary glosses over Chalmers's specific counter-move: he argues consciousness is unique because there is no gap between how it appears and what it is. With water, appearance hides the microstructure; with experience, the appearance *is* the reality. Therefore, he claims, the Kripkean loophole regarding a posteriori necessity doesn't apply here. This bridge principle from conceivability to possibility is the most contested premise in the entire argument.

  The definition of materialism as requiring facts to follow "by logic alone" is the second major flashpoint. You suspected a strawman, and many physicalists agree with you. They argue for a posteriori necessity, where physical facts fix mental facts without logical derivability, much like heat is fixed by molecular motion without being logically identical to the concept of heat. However, Chalmers insists that true reduction requires a priori entailment. He isn't accidentally ignoring a posteriori physicalism; he is arguing it is impossible for consciousness specifically because of the "explanatory gap." You can know all the physical facts about a brain and still ask, "Why is there experience?" So, while the summary presents it as a settled definition, it is actually the core dispute. Physicalists argue we don't need logical deduction; Chalmers argues that without it, you haven't explained consciousness, you've just correlated it.

  The inference that materialism is false follows validly if you accept the premises. However, the comparison to Descartes is misleading. Descartes argued for substance dualism, implying two distinct kinds of stuff. Chalmers argues for property dualism or panpsychism, where physical stuff has non-physical properties. The summary conflates these distinct metaphysical views. Finally, the claim that behavior provides no evidence is an overreach. Even if consciousness doesn't logically supervene on behavior, behavior can still be strong empirical evidence. The argument shows behavior doesn't guarantee consciousness, not that it fails to suggest it. To say behavior is useless evidence is to jump from "no logical entailment" to "no probabilistic support," which most philosophers reject. It makes consciousness hard to detect, not undetectable. The summary claims consciousness is "cut loose from what anything does." This implies functionalism is dead. While the argument does challenge functionalism (since a zombie fulfills all functions), it does not necessarily sever the link between function and evidence. We infer other minds because they are like us. The zombie argument says this inference isn't logically airtight, not that it's baseless. Descartes used doubt to find a thinking substance. Chalmers uses conceivability to find non-physical properties. The summary implies Chalmers restores Cartesian dualism, but Chalmers explicitly rejects substance dualism as scientifically implausible. He wants naturalistic dualism. The summary misses this nuance entirely.

  What the argument is actually aimed at

  The argument is specifically aimed at reductive physicalism, not physicalism in general. Reductive physicalism claims consciousness is nothing over and above physical processes, fully explainable by them. Chalmers targets the idea that consciousness logically supervenes on the physical. He wants to show that you can have the physical without the mental, proving they are distinct. This does not necessarily prove dualism of substances, as your friend noted. Chalmers is open to views where consciousness is fundamental but not separate from matter, such as Russellian monism or panpsychism. In these views, physical properties have an inner nature that is experiential. The summary treats the argument as a weapon for traditional dualism, but its actual target is reductionism. It aims to force physicalists to admit consciousness is a fundamental feature of nature, not derived from complex computation alone. Chalmers wants to expand physics to include consciousness, not remove brains from the picture. The argument is a negative proof against reduction, not a positive proof for Cartesian souls. It leaves room for naturalistic views that respect science while acknowledging the hard problem. Your friend is correct that the summary mislabels his metaphysical commitment. Consequently, the argument is often used to motivate alternative frameworks that keep physics intact but add fundamental laws linking matter to mind.

  Settled vs contested

  There is broad agreement on the logical structure of the argument and the definition of the zombie thought experiment. Specialists agree that if zombies are metaphysically possible, reductive physicalism is false. This conditional relationship is settled logic. However, almost everything else is contested. The claim that zombies are genuinely conceivable is disputed; many argue we are confused about what we are imagining when we picture a zombie. The link between conceivability and possibility is heavily debated, with Kripkean objections remaining a standard counter. The requirement for a priori entailment is also split; physicalists deny it is necessary for identity, while dualists insist on it. Regarding Chalmers's own view, there is consensus he is not a Cartesian substance dualist. The field remains divided between those who accept the argument and those who deny the premises. Most philosophers remain physicalists, but the zombie argument is respected as a serious challenge. The definition of physicalism is also fought over, specifically whether it must involve logical derivation. There is no consensus on the conclusion, only on the stakes. Professional surveys show physicalism is still the dominant view, despite the argument. The machinery of conceivability you found confusing is the main battleground where specialists fight.

  Do the upshots survive

  Neither upshot follows cleanly. The first upshot, that consciousness is a non-physical extra in Descartes's sense, fails. The argument supports property dualism or panpsychism just as well as substance dualism. Chalmers explicitly avoids Cartesian substances. The summary imposes an outdated metaphysical label that the argument does not deliver. The second upshot, that behavior is no evidence at all, also fails. The argument establishes that behavior does not logically entail consciousness. It does not establish that behavior provides no empirical support. We can still use inference to the best explanation. Just because a zombie is possible doesn't mean you are likely encountering one. Consider gravity: we don't see it, but we see its effects. Consciousness is similar. The summary conflates logical certainty with evidential probability. Therefore, both practical conclusions in the box are stronger than the argument supports. The argument proves consciousness is not reducible, not that it is undetectable or separate from substance. You should trust the skepticism about reductionism, but not the skepticism about other minds. The book's claim that consciousness is cut loose from function is too extreme. Function remains our only guide, even if it isn't a guarantee. Solipsism is not a required conclusion of the zombie argument.
