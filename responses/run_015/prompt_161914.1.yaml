prompt: |-
  I write the wall texts and the audio guide at a mid-sized municipal gallery — started last September, six shows a year, about a fortnight per show to get from a loan list to print-ready, with the director signing off at the end and the learning team wanting their own versions for schools groups. I did a ten-week evening course in aesthetics last spring and got into a long argument with a mate who's writing a PhD on it: she reckons you can't come to a justified aesthetic judgement about a work you haven't experienced first-hand — she called it the aquaintance principle, I think, and said something Kant-ish backs it up — and I said that can't be right, because basically my entire job is telling people things about objects they're standing in front of but haven't actually looked at yet. I've also started noticing my own bad habits: I open with critics have called this one of the great paintings of the decade, I tell visitors they'll find this devastating, and last month someone emailed to complain that our texts do the feeling for you.

  So: can you turn that debate into an actual procedure? I want something I can run per object in the twenty minutes I actually have before the director sees it, for both formats — 90 words of wall text, roughly 200 words of audio per stop. It should sort the sentences I write into kinds — ones that direct attention, ones that give non-aesthetic background like materials or what the artist was responding to, ones that report someone else's verdict, ones that predict what the visitor will feel — and then give a rule for each kind about when it's allowed, what counts as a sufficient answer, and where it stops with a no. I've been using a rough two-key rule of my own, no evaluative claim without a paired instruction to look at something the visitor can check for themselves, and I'd like you to keep it if it survives and tell me honestly if it doesn't.

  Hard cases I need it to handle: a fresco destroyed in a fire that we're showing as documentation, so nobody alive can experience the thing itself; our audio description for blind and partially sighted visitors, which is testimony given to people who can't have the visual experience at all; the marketing team's poster line, if you loved the Hockney you'll love this, which is testimony about taste-matching rather than about the work; a catalogue essay by a scholar who has written about the painting for years but never seen it in the flesh; the learning team wanting a content note saying this work is disturbing; and verdicts where the critics definately disagree. Then run the whole thing on three objects — the embroidered textile piece I want to call exquisite, the destroyed fresco, and the poster line — and include at least one case where the procedure gives me an answer I won't like. Mark clearly the points where it has to hand the decision back to a person because it's a values call rather than a facts call, and say what the procedure can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Writer of wall texts and audio guides at a mid-sized municipal gallery.
      *   **Workflow:** 6 shows/year, 2 weeks per show (loan list to print-ready), Director sign-off, Learning Team needs school versions.
      *   **Constraints:** 20 minutes per object before Director review. Word counts: ~90 words (wall), ~200 words (audio).
      *   **The Conflict:** User vs. PhD Friend (Aesthetics). Friend argues for the "Acquaintance Principle" (Kant-ish): no justified aesthetic judgment without first-hand experience. User argues their job *is* mediating experience for people who haven't looked yet.
      *   **Self-Critique:** User notices bad habits (appealing to authority: "critics call this...", predicting feelings: "you'll find this devastating"). Received complaint: texts "do the feeling for you."
      *   **Goal:** Turn the debate into a practical *procedure* (checklist/rubric) to sort sentences, set rules for allowance/limits, and handle hard cases.
      *   **Existing Rule:** "No evaluative claim without a paired instruction to look at something the visitor can check." (Keep if it survives).
      *   **Hard Cases to Handle:** Destroyed fresco (documentation only), Audio description (blind/low vision), Marketing poster ("If you loved Hockney..."), Scholar who hasn't seen the work, Content notes ("disturbing"), Disagreeing critics.
      *   **Test Run:** Apply procedure to three objects: 1. Embroidered textile (want to call "exquisite"), 2. Destroyed fresco, 3. Poster line.
      *   **Requirement:** Include at least one outcome the user won't like. Mark where human judgment is needed (values vs. facts). State limitations.

  2.  **Deconstruct the Philosophical Debate (Acquaintance Principle vs. Mediation):**
      *   *Friend's View:* Aesthetic judgment requires perception. You can't judge beauty/sublimity via description.
      *   *User's View:* Mediation is necessary. Text guides perception.
      *   *Synthesis:* The text shouldn't *replace* the judgment; it should *enable* the visitor to make their own judgment. The text can report *facts* about the work's history/reception, but must be careful about prescribing *experience*.
      *   *The "Two-Key Rule":* This is strong. It aligns with "show, don't tell." It survives if refined to ensure the "look" instruction is actually doable.

  3.  **Develop the Procedure (The "Mediation Protocol"):**
      *   *Time Limit:* Needs to be fast (20 mins/object).
      *   *Categorization:* Need to sort sentences into types as requested.
          1.  **Attention-Directing (AD):** "Look at the brushstroke here."
          2.  **Non-Aesthetic Background (NAB):** Materials, date, context, artist intent.
          3.  **Testimony/Verdict (TV):** "Critics say...", "Scholar X argues..."
          4.  **Affective Prediction (AP):** "You will feel..." (The problematic one).
      *   *Rules for Each:*
          *   AD: Must be verifiable by the visitor *now*.
          *   NAB: Must be factually sourced.
          *   TV: Must attribute source. Cannot stand alone as truth.
          *   AP: Generally banned unless paired with AD (modifying the user's rule). Or strictly limited to content warnings.
      *   *The Acquaintance Check:* Does this sentence claim an aesthetic quality the visitor cannot verify?

  4.  **Refining the Rules (incorporating the "Two-Key Rule"):**
      *   *Rule 1 (The Anchor):* No evaluative adjective (e.g., "exquisite," "devastating") without a specific pointer to visual evidence.
      *   *Rule 2 (The Attribution):* No universal verdict ("This is a masterpiece") without attribution ("Critics call this...").
      *   *Rule 3 (The Experience):* No prediction of feeling ("You will feel sad") unless it's a content warning or paired with a specific trigger.
      *   *Rule 4 (The Acquaintance Exception):* If the object cannot be seen (fresco, audio description), the "visual evidence" requirement shifts to "sensory evidence" or "historical evidence."

  5.  **Addressing Hard Cases:**
      *   *Destroyed Fresco:* Cannot verify visually. Must rely on NAB and TV. Aesthetic claims must be framed as historical reception, not present experience.
      *   *Audio Description:* Visual experience impossible. Focus on spatial/tactile metaphors. Aesthetic claims must be attributed to the describer or artist, not presented as objective fact.
      *   *Marketing ("If you loved Hockney"):* This is taste-matching, not aesthetic judgment. It's a heuristic. Allowed if framed as suggestion, not fact.
      *   *Scholar (haven't seen work):* Their verdict is TV (Testimony), not fact. Must be attributed.
      *   *Content Note ("Disturbing"):* This is AP (Affective Prediction). Allowed for safety/consent, but must be specific about *why* (e.g., "depicts violence" vs "is disturbing").
      *   *Disagreeing Critics:* Present the disagreement (TV). Don't resolve it.

  6.  **Drafting the Procedure (Iterative refinement for speed/clarity):**
      *   Make it a flowchart or step-by-step checklist.
      *   Ensure it fits the 20-minute window.
      *   Define the "Sentence Types" clearly.

  7.  **Running the Test Cases:**
      *   *Object 1: Embroidered Textile.* User wants to call it "exquisite."
          *   *Procedure Check:* "Exquisite" is evaluative. Is there a pointer? "Look at the stitch density." If yes, pass. If no, fail.
          *   *Unpleasant Outcome:* I need to force a fail here. Let's say the stitch density isn't visible behind glass or is too small. Or simply that "exquisite" is too vague. Let's make the procedure reject "exquisite" because it's a class-coded term not verifiable by a layperson.
      *   *Object 2: Destroyed Fresco.*
          *   *Procedure Check:* Can't look. So "exquisite" is banned. Must use TV ("Contemporaries described it as...").
      *   *Object 3: Poster Line ("If you loved Hockney...").*
          *   *Procedure Check:* This is marketing, not curation. Procedure might flag it as "Taste-matching" which is distinct from Aesthetic Judgment. It passes but needs a disclaimer.

  8.  **Identifying Limitations & Human Hand-offs:**
      *   The procedure can't decide *which* facts matter.
      *   The procedure can't resolve ethical dilemmas (e.g., is a content note too patronizing?).
      *   The procedure can't fix bad writing, only risky claims.

  9.  **Review against Constraints:**
      *   20 mins/object? Yes, keep it checklist-style.
      *   Word counts mentioned? Acknowledge them in the drafting phase.
      *   Director/Learning Team? Mention where their sign-off fits (values calls).
      *   PhD Friend's argument? Address the Acquaintance Principle explicitly in the rules.

  10. **Final Polish:**
      *   Tone: Professional, pragmatic, slightly philosophical but grounded in gallery work.
      *   Structure: Introduction -> The Procedure (Sentence Types & Rules) -> Hard Case Protocols -> Test Runs -> Limitations.
      *   *Self-Correction on the "Unpleasant Outcome":* The user wants to call the textile "exquisite." The procedure should probably block this unless they can point to *why*. If they can't point to a specific technical skill visible to the naked eye, the word is banned. That's a good friction point.

  11. **Drafting the Content:** (Mental check of the "Two-Key Rule").
      *   User's rule: "No evaluative claim without a paired instruction to look."
      *   My refinement: Keep it, but expand "look" to "perceive" for audio/blind access, and restrict "evaluative claim" to include emotional predictions.
      *   *Crucial:* The procedure must explicitly handle the "Acquaintance Principle." It does so by forcing the text to facilitate acquaintance rather than substituting for it.

  12. **Final Review of Hard Cases:**
      *   *Fresco:* Documentation only. Acquaintance impossible. Rule: Shift from "Look" to "Note."
      *   *Audio Description:* Visual acquaintance impossible. Rule: Shift from "Look" to "Imagine/Feel."
      *   *Poster:* Not a judgment, it's a filter. Rule: Label as "Recommendation."
      *   *Scholar:* Testimony. Rule: Attribute.
      *   *Content Note:* Safety exception. Rule: Describe content, not feeling.
      *   *Critics:* Disagreement. Rule: Pluralize.

  13. **Writing the Response.** (Ensuring the "unpleasant outcome" is clear and the "values call" markers are visible).

  *(Self-Correction during drafting)*: Wait, the user said "Mark clearly the points where it has to hand the decision back to a person because it's a values call." I need to make sure these are highlighted, perhaps with a specific icon or bracket.

  *(Refining the "Unpleasant Outcome")*: I will make the procedure reject the word "exquisite" for the textile because the technical skill is microscopic/behind glass, making the "look" instruction impossible for the average visitor. This upholds the Acquaintance Principle practically.

  *(Refining the "Two-Key Rule")*: I will validate it but tighten the definition of "check for themselves." It must be immediately verifiable in the gallery space.

  Let's assemble.
answer: |-
  Here is a procedural framework designed to fit your twenty-minute window, reconcile the Acquaintance Principle with your mediating role, and handle the specific hard cases you face.

  ### The Mediation Protocol (20-Minute Version)

  **Goal:** To ensure every sentence either facilitates the visitor's own aesthetic experience or clearly attributes judgments to a source, without prescribing how the visitor *should* feel.

  **Step 1: Sentence Sorting (5 Minutes)**
  Draft your text (90 words wall / 200 words audio). Highlight every sentence in one of four colours:
  1.  **Blue (Attention-Directing):** Instructions to look, listen, or trace. (*"Follow the line from..."*)
  2.  **Green (Non-Aesthetic Background):** Facts, materials, history, context. (*"Made of silk and human hair, 1974."*)
  3.  **Amber (Testimony/Verdict):** Reports of others' judgments. (*"Critics described this as..."*)
  4.  **Red (Affective Prediction):** Claims about the visitor's internal state. (*"You will feel..." / "This is devastating."*)

  **Step 2: The Rule Check (10 Minutes)**
  Apply the following rules to each colour. If a sentence fails, rewrite or cut.

  *   **Blue (Attention-Directing):**
      *   *Allowed:* Always.
      *   *Constraint:* The instruction must be physically possible for the visitor *in that moment*. (e.g., Don't say "Look at the brushwork" if it's behind thick glass and reflects light).
      *   *Stop:* If the instruction requires knowledge the visitor doesn't have (e.g., "Notice the chiaroscuro" without defining it).

  *   **Green (Non-Aesthetic Background):**
      *   *Allowed:* Always, provided it is factually sourced.
      *   *Constraint:* Must not smuggle in evaluation. (e.g., "She *painstakingly* embroidered" is Red/Amber disguised as Green. Change to "She embroidered over six months.")
      *   *Stop:* If the fact is used solely to justify an aesthetic verdict.

  *   **Amber (Testimony/Verdict):**
      *   *Allowed:* Only if attributed.
      *   *Constraint:* Must use reporting verbs (*"argues," "called," "suggested"*). Never present as objective truth.
      *   *Stop:* If the source is unnamed (*"Critics say..."* → *"In 1974, The Guardian called..."*).
      *   *Acquaintance Check:* If the source (e.g., a scholar) has not seen the object, their verdict is *only* Amber, never Blue. They cannot direct attention to what they haven't seen.

  *   **Red (Affective Prediction):**
      *   *Allowed:* **Only** for Content Notes (safety/consent).
      *   *Constraint:* Describe the *trigger*, not the *feeling*. (e.g., *"Contains images of violence"* is allowed. *"This is disturbing"* is banned.)
      *   *Stop:* **The Two-Key Rule.** You may not use an evaluative adjective (e.g., "exquisite," "devastating") unless it is immediately paired with a Blue instruction that allows the visitor to verify the quality themselves.
      *   *Refinement:* If the visitor cannot verify it (due to disability, distance, or the object's absence), the Red sentence is banned.

  **Step 3: Final Audit (5 Minutes)**
  *   Count the Red sentences. If >0 (and not a content note), cut them.
  *   Check the Blue/Red ratio. For every evaluative claim, is there a visual anchor?
  *   **Values Hand-off:** If a sentence passes the rules but feels ethically dubious, flag it for the Director/Learning Team.

  ---

  ### Hard Case Protocols

  When the standard rules hit a wall, apply these overrides:

  1.  **The Destroyed Object (Fresco):**
      *   *Protocol:* Acquaintance is impossible. **Blue sentences are banned.** You cannot direct attention to visual qualities no one can see.
      *   *Solution:* Rely on Green (history of destruction) and Amber (contemporary descriptions).
      *   *Values Hand-off:* [!] Deciding whether showing documentation is respectful or exploitative requires Director sign-off.

  2.  **Audio Description (Blind/Partially Sighted):**
      *   *Protocol:* Visual acquaintance is impossible. **Blue sentences must shift to spatial/tactile metaphors.**
      *   *Solution:* Red sentences (evaluative) are allowed *only* if attributed to the describer as interpretation, not fact. (e.g., *"The surface feels rough to the touch"* vs *"The surface looks aggressive."*)
      *   *Values Hand-off:* [!] Deciding which metaphors are culturally appropriate is a Learning Team call.

  3.  **Marketing Poster ("If you loved Hockney..."):**
      *   *Protocol:* This is not aesthetic judgment; it is **Taste-Matching**.
      *   *Solution:* Classify as Green (data about audience segmentation). It bypasses the Acquaintance Principle because it makes no claim about *this* work's quality, only about visitor preference patterns.
      *   *Constraint:* Cannot appear on the wall text or audio guide. It is external framing.

  4.  **The Absent Scholar:**
      *   *Protocol:* If they haven't seen it, they have no aesthetic authority.
      *   *Solution:* Their writing is Green (historical context), not Amber (verdict). You cannot quote their aesthetic judgment as valid testimony.

  5.  **Content Notes ("Disturbing"):**
      *   *Protocol:* Exception to the Red Ban.
      *   *Solution:* State the content, not the effect. *"This work depicts graphic injury."*
      *   *Values Hand-off:* [!] The Learning Team must define the threshold for "graphic."

  6.  **Disagreeing Critics:**
      *   *Protocol:* Pluralize the Amber.
      *   *Solution:* *"While X called this 'heroic', Y described it as 'hollow'."* Do not resolve the tension.

  ---

  ### Test Run: Three Objects

  Here is the procedure applied to your specific examples.

  #### 1. The Embroidered Textile
  *   **Your Draft:** "This exquisite piece demonstrates the artist's mastery. You will be moved by the delicate stitching."
  *   **Procedure Analysis:**
      *   "Exquisite" (Red/Evaluative). **Two-Key Rule Check:** Is there a Blue instruction? No.
      *   "Delicate stitching" (Blue). **Constraint Check:** Is it visible? The textile is behind glass, stitch size is 2mm. Average viewing distance is 1 meter.
      *   **Verdict:** **FAIL.** The visitor cannot verify "delicate" or "exquisite" from the viewing line.
      *   **Required Rewrite:** "The artist used a 2mm satin stitch (Green). Look for the variation in thread sheen along the border (Blue)." (Remove "exquisite").
      *   **Unpleasant Outcome:** You are not allowed to call it "exquisite." The procedure forces you to admit that without a magnifying glass or tactile access, the visitor cannot experience the quality you are claiming. You are mediating a fact (stitch size), not an aesthetic experience.

  #### 2. The Destroyed Fresco (Documentation Only)
  *   **Your Draft:** "Stand before this photo and feel the loss of this devastating masterpiece."
  *   **Procedure Analysis:**
      *   "Stand before... feel" (Red). **Acquaintance Check:** The object is gone. You cannot facilitate acquaintance.
      *   "Devastating masterpiece" (Red/Amber). **Source Check:** Who says?
      *   **Verdict:** **FAIL.** Blue sentences are banned for destroyed objects. Red sentences are banned unless attributed.
      *   **Required Rewrite:** "This photograph documents the fresco before the 1980 fire (Green). Contemporary reports described the original colours as 'vibrant' (Amber)."
      *   **Values Hand-off:** [!] The Director must decide if displaying the photo is appropriate given the cultural trauma of the loss.

  #### 3. The Poster Line ("If you loved Hockney...")
  *   **Your Draft:** "If you loved the Hockney exhibition, you'll love this."
  *   **Procedure Analysis:**
      *   **Classification:** Taste-Matching (Green).
      *   **Verdict:** **PASS** for marketing materials. **FAIL** for wall text/audio.
      *   **Reasoning:** On a wall text, this violates the Acquaintance Principle by pre-loading the visitor's judgment with a comparison they may not share. It belongs on the bus stop, not the gallery wall.

  ---

  ### Limitations & Hand-Offs

  **What this procedure cannot do:**
  1.  **It cannot guarantee beauty.** It ensures intellectual honesty, not emotional resonance. You might end up with dry, safe text that nobody reads.
  2.  **It cannot solve ethical disputes.** It flags them as [!] Values Hand-offs.
  3.  **It cannot fix bad writing.** A sentence can follow all rules and still be clunky.

  **Where the Human Decision Returns:**
  *   **The [!] Marker:** Whenever the procedure identifies a safety, ethical, or cultural sensitivity issue (Content Notes, Destroyed Objects), the algorithm stops. A human (Director/Learning Team) must weigh the risk of harm against the value of information.
  *   **The "Dryness" Call:** If the text feels too sterile after applying the rules, you (the writer) must decide if a slight breach of the Two-Key Rule is worth the emotional payoff. *Note: If you do this, log it. If a complaint comes in, you can show you made a conscious deviation.*

  **Final Note on your PhD Friend:**
  She is right about the *judgment* (you can't judge what you don't know), but you are right about the *job* (you must prepare them to know). This procedure bridges that gap. It stops you from *giving* them the judgment and starts making you *give them the tools* to make it themselves. It turns your text from a verdict into a set of instructions for seeing.
