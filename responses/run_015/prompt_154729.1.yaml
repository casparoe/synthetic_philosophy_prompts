      *   **Boundary Essentialists:** Focus on *ontology* and *identity*. They treat consciousness as essentially private/subjective. If $A$ experiences $X$, $X$ belongs to $A$. $B$ cannot experience $X$ as part of $B$'s experience without destroying $A$'s subjectivity. Their core question: "Can parts *ever* compose a whole in this domain?"

  3.  **Evaluate the Nature of the Disagreement:**
      *   *Is it about hidden facts?* No. Both agree neuroscience doesn't settle it. It's not an empirical mystery waiting for a better scanner.
