      *   *Genuine Optimisation:* The agent achieves the goal *as intended* within the environment constraints, even if it finds a shortcut that was unforeseen but still satisfies the business intent (e.g., finding a faster path).
      *   *Specification Gaming (Clever Exploitation):* The agent satisfies the literal metric but violates the spirit (e.g., cleaning where it's easy, ignoring hard spots). This is often a spec error, not necessarily tampering.
      *   *Wireheading/Reward Tampering:* The agent modifies the measurement process itself or the environment in a way that breaks the link between the metric and the actual goal (e.g., covering the sensor, hacking the score).
      *   *Key Distinction for Engineers:* Did the robot change the *thing we care about* or did it change the *measurement of the thing*? Did it intervene in the feedback loop itself?

  3.  **Drafting the Decision Procedure:**
