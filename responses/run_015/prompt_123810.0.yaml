      *   *Correction:* On the mixed strategy conclusion. The user's study group says mixed strategies are *only* uncertainty. This is the "purification" or epistemic view. But in zero-sum games, you *must* randomize to be indifferent. The analogy fails there. I need to be firm that Conclusion 2 is false.
