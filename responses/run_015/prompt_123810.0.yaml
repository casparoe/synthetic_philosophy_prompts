  6.  **Refining the "Mixed Strategy" Point:**
      *   The user asks: "Can a move be legitimately crossed out when the player never randomizes at all?"
      *   *Answer:* Yes. If Strategy A is strictly dominated by a Mix of B and C, then A is *never* a best response to any belief about the opponent. Therefore, a rational player (maximizing expected utility) would never play A, even if they intend to play a pure strategy (B or C) ultimately. The "mixture" is a theoretical benchmark, not necessarily a committed action.
      *   *Confidence:* High. This is standard dominance solvability theory.

  7.  **Refining the "Equilibrium Reasoning" Point:**
