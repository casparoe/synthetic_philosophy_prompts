  3. It cannot accommodate the distinction between a moral failing like withholding tips and a mere wrong like queue-jumping, nor does it explain why the housekeeper tip is praiseworthy rather than neutral when not required.
  4. It judges the honest four-star rating as permissible since the harm is systemic rather than direct, and it binds you to the tip jar only once the practice stabilizes into a legitimate expectation rather than a transient foreign habit.
  5. It still cannot draw a precise line between a nascent convention like the tip jar and a mere aggregation of individual generosity, leaving the exact moment of binding obligation undefined.
