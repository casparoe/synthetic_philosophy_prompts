answer: |-
  Here is the specification you requested. I have stripped out the introductory fluff; given your background, you need the structural constraints and the impossibility results, not a literature review.

  ### Desiderata for a Theory of Rational Self-Binding

  To count as an adequate theory of rational self-binding in one-off interactions (specifically Newcomb-like or Prisoner's Dilemma type scenarios without external enforcement), a framework must address the following five requirements.

  **1. Dynamic Consistency**
  *   **Constraint:** An agent's optimal plan formulated at $t_1$ (pre-interaction) must remain the optimal course of action at $t_2$ (the moment of decision), absent new exogenous information.
  *   **Motivating Case:** **Parfit's Hitchhiker.** At $t_1$ (in the desert), you plan to pay the driver upon reaching town. At $t_2$ (in town), the causal leverage is gone. If the theory prescribes paying at $t_1$ but not paying at $t_2$, it is dynamically inconsistent. A rational agent should not be liable to money pumps resulting from time-inconsistent preferences.
  *   **Status:** **Contested.** Causal Decision Theorists (CDT) often accept dynamic inconsistency as the price of causal dominance. Evidential (EDT) and Functional (FDT) theorists treat this as a fatal flaw in CDT.

  **2. Local Causal Efficacy (The 'No Magic' Constraint)**
  *   **Constraint:** At the moment of choice ($t_2$), the chosen act must be causally efficacious in bringing about the desired outcome, or at least not causally dominated by an alternative. The agent cannot influence the past or logically independent facts merely by wishing.
  *   **Motivating Case:** **The Standard CDT Objection.** Once you are safe in town, paying the driver costs you money and causally changes nothing regarding your rescue (which has already happened). A theory demanding payment must explain how this act is rational without invoking backward causation or 'magic'.
  *   **Status:** **Settled (with caveats).** Everyone agrees backward causation is out. The contest is over whether 'logical correlation' (as in FDT) counts as a valid form of efficacy that bypasses causal dominance.

  **3. Feasibility of Internal Binding (Sovereignty)**
  *   **Constraint:** The binding mechanism must be accessible to the agent without relying on external enforcement institutions (law, mafia, smart contracts) that alter the payoff matrix physically.
  *   **Motivating Case:** **Pure Self-Binding.** If the solution requires a legally binding contract, you have solved a game-theoretic constraint problem, not a philosophical decision-theory problem. The puzzle is how *reason alone* can bind the will.
  *   **Status:** **Contested.** Many argue this is impossible (Humean view: reason is slave to passions). Others (Kantian/Functionalist) argue rational agency entails the capacity for normative self-constraint.

  **4. Verification without Surplus Destruction (The Reverse Hitchhiker)**
  *   **Constraint:** If the counterparty requires proof of commitment to cooperate, the cost of generating that proof must not exceed the surplus gained from the cooperation.
  *   **Motivating Case:** **The Reverse Case.** Suppose the driver demands a blood oath or a costly signal to believe you will pay. If the signal costs more than the fare, the interaction is net-negative. If the signal is cheap talk, it is ignored. The theory must explain how credible commitment is established without consuming the utility gain.
  *   **Status:** **Settled.** This is a standard constraint in signalling theory. The contest lies in whether 'being a certain type of agent' counts as a costless signal.

  **5. The Midnight Clause (Temporal Indexing)**
  *   **Constraint:** The binding mechanism must activate at the correct information set. It cannot bind the agent before they possess the relevant information (which renders the decision blind), nor after the decision point (which is too late).
  *   **Motivating Case:** **Midnight Clause.** If you bind yourself at $t_0$ (before knowing you will be stranded), you might bind yourself to a policy that is ruinous in other contexts. If you bind at $t_2$, it is ineffective. The theory must specify the precise locus of the normative 'lock'.
  *   **Status:** **Contested.** This relates to the debate between *resolute choice* (McClennen) and *sophisticated choice*. Resolute choice locks at $t_1$; sophisticated choice anticipates $t_2$ failure.

  ---

  ### The Impossibility Result: The 'Rational Trinity'

  You asked for the jointly unsatisfiable subset. This is the core tension. In one-off interactions without external enforcement, you cannot satisfy the following three conditions simultaneously:

  1.  **Local Causal Dominance:** At $t_2$, choose the act that causally maximises utility given the current state.
  2.  **Dynamic Consistency:** The choice at $t_2$ matches the optimal plan at $t_1$.
  3.  **Internal Sovereignty:** No external enforcement mechanisms alter the physical payoffs.

  **Analysis of the Conflict:**
  *   **CDT** satisfies (1) and (3) but fails (2). It admits you will not pay in the Hitchhiker case, and thus you die in the desert. It accepts that rational agents are predictably worse off.
  *   **FDT/TDT** satisfies (2) and (3) but redefines (1). It argues that your decision at $t_2$ is logically correlated with the driver's prediction at $t_1$, so paying *does* influence the rescue (counterfactually, not causally). CDT proponents reject this as violating causal structure.
  *   **External Precommitment** satisfies (1) and (2) but fails (3). It solves the problem by removing the 'self-binding' aspect and replacing it with 'external binding'.

  **Verdict:** If you insist on standard Causal Dominance (1) and Internal Sovereignty (3), Dynamic Consistency (2) is mathematically impossible in Newcomb-like problems. You must drop one.

  ---

  ### Analysis of Competing Views

  **1. Standard Causal Decision Theory (CDT) Dismissal**
  *   **Performance:** CDT explicitly rejects **Dynamic Consistency**. It argues that at $t_2$, the past is fixed. To pay the driver is to throw away utility for no causal gain.
  *   **Missed Desiderata:** It fails **Dynamic Consistency** and consequently fails **Non-Exploitability** (CDT agents can be money-pumped or left to die in the desert by predictors).
  *   **Defence:** CDT proponents argue **Local Causal Efficacy** is non-negotiable. They prefer being predictably poor to acting on 'magical' thinking. They classify the Hitchhiker scenario as a case where rationality does not guarantee success.

  **2. Rational Precommitment as Costly Signalling**
  *   **Performance:** This view attempts to solve the problem by turning the one-off interaction into a reputation game or by imposing a psychological cost on breaking promises.
  *   **Missed Desiderata:** It often fails **Internal Sovereignty** (if the cost is psychological guilt, it relies on contingent empirical facts about the agent's upbringing, not pure rationality) and **Verification without Surplus Destruction**. If the signal is too costly, the deal breaks (Reverse Hitchhiker).
  *   **Defence:** Proponents argue **Internal Sovereignty** is a false ideal. Humans are embedded in social contexts; 'pure' rationality is a myth. However, this changes the subject from *decision theory* to *evolutionary psychology*.

  ---

  ### Summary Table

  | Requirement | Motivating Case or Constraint | Negotiable? | Status |
  | :--- | :--- | :--- | :--- |
  | **Dynamic Consistency** | Parfit's Hitchhiker; Money Pump arguments. | **No** (for FDT/EDT); **Yes** (for CDT). | **Contested.** CDT accepts inconsistency; others view it as irrational. |
  | **Local Causal Efficacy** | The 'No Magic' constraint; CDT dominance principle. | **Maybe.** Depends on definition of 'causal'. | **Contested.** FDT redefines efficacy via logical correlation. |
  | **Internal Sovereignty** | Pure Self-Binding (no external enforcement). | **Yes.** Many solve the problem by dropping this. | **Settled** that external enforcement solves it; **Contested** if internal is possible. |
  | **Verification Cost** | Reverse Hitchhiker (Proof undermines surplus). | **No.** Economic constraint. | **Settled.** Signals must be cheaper than the gain. |
  | **Temporal Indexing** | The Midnight Clause (When does binding lock?). | **Yes.** Resolute vs Sophisticated choice. | **Contested.** Debate over $t_1$ vs $t_2$ authority. |

  ### Concluding Note on Consensus

  Do not be misled by textbook presentations. There is no consensus on whether a rational agent *should* pay the hitchhiker.
  *   **Settled:** If you use CDT, you do not pay. If you use FDT, you pay. Both agree on the maths; they disagree on the counterfactual structure.
  *   **Contested:** Whether CDT's refusal to pay is a *reductio ad absurdum* of CDT (as Parfit argued) or a correct acceptance of causal reality (as Lewis argued).

  If your thesis argues for self-binding, you must either adopt a non-causal decision theory (FDT/TDT) or argue for a specific mechanism of **Internal Sovereignty** (e.g., constitutive norms of agency) that makes breaking the promise impossible *by definition*, thereby collapsing the decision node. The latter is the more promising route for a philosopher of action, as it bypasses the decision-theoretic impossibility theorem by altering the metaphysics of the agent.
