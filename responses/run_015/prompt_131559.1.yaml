      Maya was fourteen during the first cut. The seizures had been terrifying, lightning storms behind her eyes. After the surgery, she woke up and told her parents, "I'm still me." They cried with relief. She went back to school, aced algebra, and gossiped about boys. Nothing changed.

      The second cut came a year later. She noticed nothing. Her friends noticed nothing. But during lunch, her left hand knocked over her milk carton while her right hand was texting. She laughed it off. "I'm clumsy," she said. "I" did it.

      By the third operation, junior year, the diary started getting weird. On Monday, she wrote: *I hate math, I'm dropping it.* The handwriting was hers. On Tuesday, underneath: *No, I need math for college.* The handwriting was slightly heavier, the pressure harder. She read it and felt a flicker of confusion, like hearing an echo in an empty room. But when her mom asked, "How are you feeling?" Maya said, "I'm good." One voice. One person.

      The fourth cut was winter of senior year. She was buying a dress for prom. She picked blue. Her left hand reached out and touched the red one. She pulled her hand back, embarrassed. "I like the blue," she told the clerk. But she bought the red. Later, she told Chloe, "I changed my mind."

      Then came the fifth. The final bridge burned.

      She sat on her bed, the post-op bandage hidden under her hair. Chloe was there, doing homework. The room was quiet, save for the scratching of pens. Maya's left hand was reading a magazine while her right hand solved chemistry problems. They weren't coordinating. The left hand turned a page; the right hand stopped writing.

      "Maya?" Chloe asked, not looking up from her notebook.
      "Yeah?"
      "After all this... are you one or two?"

      Maya opened her mouth. The truth was there, but it had no shape. If she said "one," the left hand might disagree. If she said "two," who was speaking?
      "I am here," Maya said. It was true. Someone was here. It was useless.

      Chloe nodded, accepting the non-answer. "Okay. Who's sleeping in the bed tonight? You need the left side or the right?"

      Maya looked at the bed. Her body sat on the edge. Her left foot tapped a rhythm her right foot didn't know. She thought about her name. It was on the mailbox, on her report cards, on her birth certificate. Did it belong to the hand holding the pen or the hand turning the page?

      "I'll sleep in the middle," she said.

      Later, alone, she opened the diary.
      *I want to leave,* the top line said.
      *I want to stay,* the line below it replied.
      Both were signed *Maya*.

      She closed the book. Her left hand turned off the lamp. Her right hand pulled up the covers. They settled into the dark, breathing together, waiting to see who would wake up in the morning.

