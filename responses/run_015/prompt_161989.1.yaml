  ### The Scenario: The Community Clinic Allocation

  **Setting:** A neighborhood health clinic has a fixed pool of **15 hours** of specialized physiotherapy to allocate among three patients: **Alice, Bob, and Charlie**. The hours must be used this month or lost.

  **The Measure:** The clinic tracks progress in "Functional Mobility Units" (FMUs). While absolute mobility scores vary wildly depending on the patient's specific condition (e.g., stroke recovery vs. sports injury), the clinic has robust data on how many FMUs each patient gains per hour of therapy. These **gain scores** are comparable across patients because they measure improvement on a standardized task.

  **The Problem:** The clinic's intake database crashed. The administrators know the **gains** each patient will make under different plans, but the **current baseline scores** (where each patient starts) are lost. They must choose a plan before the records are recovered.

  **The Options:**
  *   **Plan Alpha:** Allocates more hours to Alice.
  *   **Plan Beta:** Allocates more hours to Charlie.

  **The Gains (Known Data):**
  Administrators know exactly how many FMUs each person will add to their current score under each plan.

  | Person | Gain under Plan Alpha | Gain under Plan Beta |
  | :--- | :---: | :---: |
  | **Alice** | 10 | 1 |
  | **Bob** | 7 | 5 |
  | **Charlie** | 4 | 9 |
  | **Total** | **21** | **15** |
  | **Average** | **7** | **5** |

  **The Choosers:**
  Two administrators are evaluating these plans from behind a "veil of ignorance." Each knows she has an equal (1/3) chance of turning out to be Alice, Bob, or Charlie.
  1.  **The Average Chooser** ranks plans by the expected value of her outcome (the average final score).
  2.  **The Maximin Chooser** ranks plans by the final score of the worst-off person (the minimum final score).

  **The Hidden Variable (Baseline Hypotheses):**
  Since the baseline records are lost, there are two admissible hypotheses about who is currently worst-off. Both are consistent with the gain data above.

  *   **Hypothesis 1 (Alice is worst-off):** Alice starts at **0**. Bob and Charlie start at **10**.
  *   **Hypothesis 2 (Charlie is worst-off):** Charlie starts at **0**. Alice and Bob start at **10**.

  ---

  ### Calculations and Verdicts

  #### 1. The Average Chooser
  This chooser calculates the average final score. Mathematically, $\text{Average Final} = \text{Average Baseline} + \text{Average Gain}$. Since the baselines are fixed properties of the people and do not change between plans, the *Average Baseline* is constant. Therefore, the ranking depends entirely on the *Average Gain*.

  *   **Plan Alpha:** Average Gain = $21 / 3 = \mathbf{7}$.
  *   **Plan Beta:** Average Gain = $15 / 3 = \mathbf{5}$.

  **Verdict:** Under **both** Hypothesis 1 and Hypothesis 2, the Average Chooser picks **Plan Alpha**. Changing the baseline numbers adds the same constant to both averages, so the gap of 2 units remains unchanged.

  #### 2. The Maximin Chooser
  This chooser calculates the final score for each person ($\text{Baseline} + \text{Gain}$) and identifies the minimum.

  **Under Hypothesis 1 (Alice starts at 0):**
  *   **Plan Alpha Finals:** Alice (0+10)=**10**, Bob (10+7)=17, Charlie (10+4)=14.
      *   Worst-off: Alice at **10**.
  *   **Plan Beta Finals:** Alice (0+1)=**1**, Bob (10+5)=15, Charlie (10+9)=19.
      *   Worst-off: Alice at **1**.
  *   **Verdict:** Picks **Plan Alpha** (10 > 1).

  **Under Hypothesis 2 (Charlie starts at 0):**
  *   **Plan Alpha Finals:** Alice (10+10)=20, Bob (10+7)=17, Charlie (0+4)=**4**.
      *   Worst-off: Charlie at **4**.
  *   **Plan Beta Finals:** Alice (10+1)=11, Bob (10+5)=15, Charlie (0+9)=**9**.
      *   Worst-off: Charlie at **9**.
  *   **Verdict:** Picks **Plan Beta** (9 > 4).

  **Result:** The Average Chooser's verdict is stable regardless of the baseline. The Maximin Chooser's verdict flips depending on the baseline. This proves that knowing the gains (which settles the Average choice) does *not* give you the baseline information (which is required to settle the Maximin choice).

  ---

  ### Three Notes

  **1. Which single feature is doing the work?**
  The work is done by the **shift in the identity of the worst-off person** relative to the gain distribution. In Plan Alpha, Charlie gets the smallest gain (4); in Plan Beta, Alice gets the smallest gain (1). If Alice is the needy one, Alpha saves her; if Charlie is the needy one, Beta saves him. The Average rule ignores *who* gets the gains, only counting the total. The Maximin rule cares intensely *who* gets the gains, specifically the person at the bottom. Because the baseline data determines who is at the bottom, the Maximin rule requires that extra input.

  **2. What breaks if that feature is removed?**
  If you retune the numbers so that **both options have equal totals** (e.g., Plan Beta gains are adjusted to sum to 21), the Average Chooser becomes indifferent. Her invariance remains (she still doesn't care about baselines), but she no longer has a strict verdict to contrast with the Maximin chooser. Conversely, if you arrange the gains so that the **same person receives the smallest gain in both options** (e.g., Charlie gets the lowest gain in both Alpha and Beta), the Maximin chooser will never switch verdicts between hypotheses; she will always prefer the plan that gives Charlie more, regardless of whether Alice or Bob is second-worst. The divergence *requires* the "worst gain" to shift between different people.

  **3. How a defender of the Maximin rule would attack the case.**
  A Maximin defender would argue that needing the extra information is a **virtue**, not a flaw. She would say: "Justice requires knowing who is needy. The Average rule's invariance is bought with **blindness**. It treats a gain for a millionaire the same as a gain for a starving person because it ignores the baseline. My rule refuses to judge distribution without knowing the starting line." She would claim the Average Chooser isn't "more informed"; she is intentionally ignoring morally relevant data (current suffering) that the Maximin rule correctly demands. The case shows you *cannot* be a Maximin chooser without baseline data; the defender says you *should not* be one without it.

  ---

  ### Addressing Risk and Robustness

  **Risk Aversion:**
  Both choosers face the exact same known probabilities (1/3 chance of being any person). Neither is "guessing" or acting on fear. The divergence traces strictly to the **aggregation rule**: one sums the outcomes (Expected Value), the other isolates the minimum (Maximin). The Average Chooser is not "braver"; she simply values a high total even if it risks a low floor. The Maximin Chooser is not "more anxious"; she simply assigns lexical priority to the floor regardless of the odds.

  **Robustness (Slack):**
  *   **Average Margin:** 7 vs 5 (Gap of 2). Perturbing any gain by 0.5 cannot flip this.
  *   **Maximin Hypothesis 1:** 10 vs 1 (Gap of 9). Highly robust.
  *   **Maximin Hypothesis 2:** 9 vs 4 (Gap of 5). Highly robust.
  *   **Baselines:** The gap between "worst-off" (0) and "others" (10) is large enough that small errors in baseline estimation won't change who is worst-off.

  *(Note: While this demonstration works with two people, a third person was used to create a stable "middle" person (Bob), ensuring the switch in verdicts relies purely on the identity of the worst-off person without altering the overall distribution shape too drastically.)*
