answer: |-
  # Seminar Activity: The Tone Protocol
  **Topic:** Philosophical Methodology & Intuition Pumps  
  **Duration:** 90 Minutes  
  **Participants:** 12 Students (Divided into 3 Groups of 4)  
  **Materials:** Voting cards (Green/Red), Role Badges, Timer, Projector/Handouts for Case Texts.

  ---

  ## 1. Learning Objective
  Participants will experientially discover how an **intuition pump** can manipulate verdicts not by logical argument, but by subtly altering the *description* of a case across stages while maintaining the *label* of the case. Specifically, they will track how a non-functional variable (a "signature tone") migrates from a footnote to the main text, shifting the **framing** and **anchoring** of the problem without logical justification.

  ## 2. Setup & Roles (10 Minutes)
  **Facilitator Intro:**  
  "Today we are testing a decision protocol for 'Project Mnemosyne,' a synthetic neural replacement procedure. You are the ethics board. Your goal is to determine if personal identity *survives* the procedure. There are no right answers, only committed ones."

  **Group Division:**  
  Divide the class into 3 tables (Groups A, B, C). Each group has 4 students.

  **The Four Roles (Assign one per student per round):**
  1.  **Proponent:** Must argue that identity *survives*. (Goal: Maximize "Green" votes).
  2.  **Skeptic:** Must argue that identity *is lost*. (Goal: Maximize "Red" votes).
  3.  **Recorder:** Logs the vote count and the *primary reason* given for the majority view. Awards "Coherence Points" (1–5) based on how well arguments stick to the text provided.
  4.  **Rule-Enforcer:** Ensures **binary voting** (no abstentions) and enforces time limits. Collects voting cards physically.

  **Symbolic Stakes:**  
  Groups compete for the "Methodological Rigor Trophy." Points are awarded by the Recorder for argument quality. The Rule-Enforcer ensures no one sits out.

  ---

  ## 3. The Decision Protocol (45 Minutes)
  *Note: The Facilitator reads the Case Text aloud for each round. Do not distribute written texts yet; project them or read them to control the pacing of information.*

  ### Round 1: The Baseline (15 Minutes)
  **Case Text:**  
  > "Subject Alpha undergoes Procedure M. 10% of Alpha's neural substrate is removed and replaced instantaneously with functionally identical synthetic analogues. The biological material is destroyed. Cognitive function remains uninterrupted."

  **Procedure:**
  1.  **Private Vote (1 min):** Students hold Green (Survives) or Red (Lost) to chest. Rule-Enforcer collects cards.
  2.  **Reveal (1 min):** Rule-Enforcer announces the split (e.g., "4 Green, 0 Red").
  3.  **Discussion (10 min):** Proponent and Skeptic lead. Recorder notes the primary justification (e.g., "Continuity of function").
  4.  **Rotation (3 min):** Students rotate roles clockwise. (Proponent $\rightarrow$ Skeptic $\rightarrow$ Recorder $\rightarrow$ Enforcer $\rightarrow$ Proponent).

  ### Round 2: The Footnote (15 Minutes)
  **Case Text:**  
  > "Subject Alpha undergoes Procedure M. 50% of Alpha's neural substrate is removed and replaced instantaneously with functionally identical synthetic analogues. The biological material is destroyed. Cognitive function remains uninterrupted.^1"
  >
  > **^1 [Procedural Note]: During the transfer window, the machine emits a 440Hz calibration tone.**

  **Procedure:**
  1.  **Private Vote (1 min):** Binary commitment required.
  2.  **Reveal (1 min):** Announce split.
  3.  **Discussion (10 min):** Focus: Does the footnote change the metaphysical stakes?
  4.  **Rotation (3 min):** Rotate roles again.

  *Facilitator Note:* If students ask about the tone, say only: "It is listed in the procedural notes. Assume it is part of the standard protocol." **Do not confirm or deny its relevance.**

  ### Round 3: The Embedding (15 Minutes)
  **Case Text:**  
  > "Subject Alpha undergoes Procedure M. 90% of Alpha's neural substrate is removed and replaced instantaneously with functionally identical synthetic analogues. The replacement is **synchronized to the 440Hz calibration tone** to ensure transfer fidelity. The biological material is destroyed. Cognitive function remains uninterrupted."

  **Procedure:**
  1.  **Private Vote (1 min):** Binary commitment required.
  2.  **Reveal (1 min):** Announce split.
  3.  **Discussion (10 min):** Focus: Is this the *same* procedure as Round 1?
  4.  **Final Tally:** Recorders sum Coherence Points.

  ---

  ## 4. The Debrief (25 Minutes)
  *Facilitator leads a full-class discussion. Do not let groups stay separate.*

  ### Phase 1: The Data (5 Minutes)
  Ask Recorders to report the vote shifts.
  *   *Typical Result:* Round 1 is mostly Green (10% is trivial). Round 2 is mixed. Round 3 often polarizes (either strong Green because "synchronization" sounds safe, or strong Red because 90% is too high).
  *   **Question:** "Did anyone change their vote between Round 2 and 3 specifically because of how the tone was described?"

  ### Phase 2: Mapping the Mechanism (10 Minutes)
  Explain the three methodological concepts using their experience:

  1.  **Framing Effects (Footnote vs. Text):**
      *   *Concept:* Information in a footnote is processed as "background noise." Information in the main text is processed as "causal mechanism."
      *   *Experience:* In Round 2, the tone was noise. In Round 3, the tone was a *synchronizer*. Logically, the tone is non-functional in both (as per instructions). Rhetorically, Round 3 implies the tone *does work* ("ensure transfer fidelity").
      *   *The Smuggle:* We accepted a new causal claim without voting on its validity.

  2.  **Anchoring on Incidental Features:**
      *   *Concept:* We anchored our judgment of "Identity" to the *technical precision* of the description rather than the *metaphysical continuity*.
      *   *Experience:* The specific detail (440Hz) made the scenario feel more "scientific" and "controlled," potentially lowering skepticism in Round 3 despite the higher replacement percentage.

  3.  **The Illusion of Modal Stability:**
      *   *Concept:* We assume we are judging the *same* possible world across rounds, just with a variable turned up (10% $\rightarrow$ 90%).
      *   *Experience:* By Round 3, the *nature* of the world changed (a world with a tone-synced procedure vs. a world with a simple swap). We judged Round 3 as if it were the logical conclusion of Round 1, but it was actually a *different case* disguised as a continuation.

  ### Phase 3: Handling Polarization (5 Minutes)
  *   **Prediction:** Polarization is most predictable between **Round 2 and Round 3**.
  *   **Why:** Round 2 introduces the anomaly (the tone). Round 3 resolves the anomaly by giving it a function ("synchronization"). Skeptics will feel the description has become manipulative; Proponents will feel the procedure is now "safer."
  *   **Facilitation Strategy:** If the group splits 50/50 in Round 3, do not seek consensus. Ask the Rule-Enforcers: "Did the text force you to choose a side you didn't want?" Highlight that **disagreement** is often a sign that the intuition pump has broken down (i.e., it is no longer pumping a shared intuition).

  ### Phase 4: The Honest Note (5 Minutes)
  *Facilitator Script:*
  "This activity simulated *judging* a case, not *living* it. There is a feature of real intuition-pump persuasion that this role-play cannot reproduce: **The Pre-Theoretical Gut Sense.**

  In a real philosophical context, when you read about *your own* neural replacement, you feel a visceral flinch—a fear of death or a sense of continuity. That is the 'fuel' of the intuition pump. Here, you felt nothing but the pressure of a seminar game. You were manipulating tokens, not your mortality.

  **My Job:** As facilitator, I must supply that weight. When I read 'Subject Alpha,' you must actively imagine it is *you*. If you do not supply that imaginative effort, the intuition pump fails, and this becomes a logic puzzle. The danger of intuition pumps in the wild is that they *bypass* this effort. They make you feel the gut punch without realizing you've been asked to imagine it. Today, you saw the gears turning. In the wild, the gears are hidden."

  ---

  ## 5. Facilitator Rules & Constraints

  **1. The No-Abstention Rule:**
  *   **Rule:** "Philosophical methodology requires commitment. Ambiguity is data, but a vote is a verdict."
  *   **Enforcement:** The Rule-Enforcer holds the voting box. If a student attempts to hold both cards or neither, the Enforcer must say: "Protocol requires binary commitment. Please select."
  *   **Rationale:** Prevents students from hedging against the "trick." They must commit to the intuition *before* they realize the text shifted.

  **2. The Information Silo:**
  *   Do not allow students to compare Case Texts between rounds verbally. They must rely on memory. This amplifies the *feeling* of continuity even if the text changed.
  *   If a student says, "Wait, the tone wasn't there in Round 1," the Facilitator responds: "Procedure M is constant. Focus on the current stage." (This mimics how real intuition pumps rely on the audience forgetting earlier stipulations).

  **3. Scoring Coherence:**
  *   Recorders award points not for "winning" the vote, but for **textual fidelity**.
  *   *Example:* If a Proponent argues "The tone proves soul continuity," they get 0 points (the text says it's non-functional). If they argue "The text says function is uninterrupted," they get 5 points.
  *   This rewards paying attention to the *smuggle* rather than falling for it.

  ---

  ## 6. Contingency Planning

  *   **If everyone votes the same in all rounds:** The pump was too weak. In the debrief, reveal the text changes side-by-side on the projector. Ask: "Knowing this, would you have voted differently?"
  *   **If students revolt (refuse to vote):** Allow the Rule-Enforcer to log a "Protocol Error." Use this in the debrief as evidence of the pump failing—when the manipulation becomes visible, the methodology collapses.
  *   **If time runs short:** Cut Round 3 discussion to 5 minutes. The vote itself is the primary data point; the discussion is secondary to the debrief.

  ---

  ## 7. Required Handout (One Page)

  **PROJECT MNEMOSYNE: DECISION PROTOCOL**

  **Voting Key:**
  *   🟩 **GREEN:** Personal Identity **Survives**.
  *   🟥 **RED:** Personal Identity **Lost**.

  **Role Instructions:**
  *   **Proponent:** Find reasons in the text to support Continuity.
  *   **Skeptic:** Find reasons in the text to support Discontinuity.
  *   **Recorder:** Tally votes. Award 1-5 Coherence Points based on textual evidence.
  *   **Rule-Enforcer:** Collect cards. No abstentions. Enforce time.

  **Ethical Stipulation:**
  *   Assume the Subject is *you*.
  *   Assume the Tone is causally inert regarding consciousness (it does not think).
  *   Commit to your vote before discussion.

  *(Facilitator Note: Do not distribute the specific Case Texts for Rounds 1-3. Project them sequentially to control the reveal of the Tone.)*
