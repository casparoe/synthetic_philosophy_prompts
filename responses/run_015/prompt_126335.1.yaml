answer: |-
  ### Part 1: The Mapping Audit

  The "Inherited House" analogy is primarily a tool to explain **Political Guilt** while insulating citizens from **Criminal Guilt**. It attempts to secularize Jaspers's theological/existential categories into property law. Here is how the correspondence typically aligns:

  | Analogy Component | Jaspers's Category | Function in the Argument |
  | :--- | :--- | :--- |
  | **The House** | **The State / Polity** | The structure of collective life that persists across generations. |
  | **Previous Owner** | **Perpetrator Generation** | Those who held power and committed the acts (bearers of Criminal/Moral guilt). |
  | **Hidden Defect** | **Historical Injustice** | The structural harm (slavery, genocide) embedded in the foundation. |
  | **The Buyer** | **Current Citizens** | Those who inherit the state; bearers of Political Guilt. |
  | **Repair Bill** | **Reparations / Policy** | The material cost of Political Guilt (liability without criminal intent). |
  | **Criminal Guilt** | **Previous Owner Only** | *Does not transfer.* You aren't arrested for the grandfather's crime. |
  | **Political Guilt** | **The Buyer** | *Transfers with title.* Citizenship entails liability for state actions. |
  | **Moral Guilt** | **Buyer's Conduct** | How the Buyer chooses to fix (or ignore) the defect internally. |
  | **Metaphysical Guilt** | **The Defect's Existence** | The shared human failure that such a house could be built at all. |

  ***

  ### Part 2: The Structural Breaks

  The analogy holds water only as long as you treat citizenship like a real estate transaction. Once you inspect the deed, three major fractures appear.

  **1. Voluntariness (The "Purchase" Problem)**
  *   **The Analogy:** Buying a house is a consensual contract. You inspect, you bid, you sign. You accept the risk of hidden defects as part of the deal.
  *   **The Reality:** Citizenship is overwhelmingly *jus sanguinis* or *jus soli* (blood or soil). It is assigned, not purchased.
  *   **The Break:** If I didn't buy the house, why am I liable for the repairs? Jaspers argues political guilt arises from *being* a citizen, not *choosing* it. The analogy smuggles in a liberal contract theory that doesn't apply to birthright citizenship. It makes liability feel fairer (you "bought" it) than it actually is (you were born into it).

  **2. Transferability (The "Title" Problem)**
  *   **The Analogy:** Property title transfers cleanly. Once the sale closes, the new owner holds the bag. The old owner walks away.
  *   **The Reality:** Guilt and responsibility do not transfer like assets. Jaspers insists Criminal Guilt *cannot* transfer.
  *   **The Break:** The analogy risks conflating Political Liability with Moral Stain. If I inherit a house with a cracked foundation, I own the crack. If I inherit a nation built on genocide, do I "own" the genocide? The analogy suggests yes (it's part of the property), whereas Jaspers says no (it remains the moral failure of the ancestors, even if I pay the political price). The house metaphor makes the injustice sound like *damage* rather than *crime*.

  **3. Exclusion (The "Owner" Problem)**
  *   **The Analogy:** Only the Owner is liable for repairs. Renters, guests, or those barred from entering have no say and no bill.
  *   **The Reality:** Historical defects often harm those who were never allowed to be "owners" (e.g., descendants of slaves who were legally property, not citizens).
  *   **The Break:** The analogy centers the *beneficiary* (the new white citizen) as the active agent of repair. It sidelines the victims who live in the house but don't hold the title. It frames reparations as "maintenance costs" for the owner rather than restitution owed to the excluded. It reinforces the very property logic that often underpinned the original injustice.

  ***

  ### Part 3: Does Jaspers Survive the Demolition?

  **Verdict: Jaspers survives, but the analogy is revealed as a crutch that weakens his actual argument.**

  The "Inherited House" picture was doing hidden work to make **Political Guilt** palatable to a liberal individualist mindset. It translates "collective liability" into "property liability," which feels legally coherent. However, when you pull the analogy apart, Jaspers's four-part distinction actually becomes *sharper*, not blurrier.

  **1. The Analogy Collapses Moral into Political**
  The house analogy suggests that if you pay the repair bill (Political), you've fixed the problem. Jaspers argues that paying reparations does not absolve **Moral Guilt**. You can pay the bill and still be morally bankrupt if you do it resentfully or without inner transformation. The house metaphor is transactional; Jaspers's framework is existential. Without the house, we are forced to admit that writing a check isn't the same as moral cleansing.

  **2. The Analogy Obscures Metaphysical Guilt**
  In the house analogy, the defect is a localized error (a cracked pipe). In Jaspers's **Metaphysical Guilt**, the defect is the human condition itself—the failure of solidarity that allows such a house to be built. The analogy suggests the house *should* have been built differently. Jaspers suggests the very act of building separate "houses" (nation-states) where one group owns another implicates everyone in a breakdown of human solidarity. The property metaphor reinforces nationalism; Jaspers's metaphysical category undermines it.

  **3. The Distinction Holds Without the Metaphor**
  Jaspers does not need the house to separate Criminal from Political guilt. He relies on the distinction between **Law** (individual acts) and **Statehood** (collective existence).
  *   **Without the analogy:** We must argue that citizens are liable for their state's actions simply because they are members of the collective, regardless of consent. This is a harder pill to swallow than "you bought the house," but it is philosophically more robust.
  *   **With the analogy:** We trick ourselves into thinking historical responsibility is a matter of contract law.

  **Conclusion**
  The "Inherited House" analogy is a pedagogical shortcut that stabilizes **Political Guilt** at the expense of **Moral and Metaphysical Guilt**. It makes reparations seem like routine maintenance rather than existential reckoning. If you discard the analogy, Jaspers's framework becomes more demanding: you are not just a homeowner fixing a leak; you are a moral agent implicated in a history you didn't write, liable for a state you didn't choose, in solidarity with victims you may never meet. The house makes it easier to pay; Jaspers makes it harder to sleep.
