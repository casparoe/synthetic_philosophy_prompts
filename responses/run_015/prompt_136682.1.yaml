  **Instructor's Note on Distinctions**
  Regarding your request to refine the distinctions: (a) The Storehouse conception treats latent knowledge as intrinsic semantic content fixed during training, whereas the Disposition conception treats it as a function of counterfactual input-output mappings. The Disposition view risks collapsing into instrumentalism, where "knowledge" is merely whatever output satisfies a loss function, potentially losing the normative grip on truth. (b) Extractive strategies assume the Storehouse view is true and aim to decode it; Adjudicative strategies assume we cannot decode it directly and must select outputs via competition. The Adjudicative strategy risks circularity if the selection criterion presupposes the knowledge it seeks to verify. Below are the deliverables.

  ***

  ### 1. The Question Itself

  **Course:** Graduate Seminar on the Epistemology of Machine Learning
  **Assignment:** Take-Home Final Examination
  **Word Limit:** 1,200 to 1,500 words
  **Instructions:** Answer the prompt below. You must take and defend a specific philosophical position. You may not merely survey existing techniques or literature. You must explicitly state which conception of latent knowledge (Storehouse or Disposition) you are assuming.

  **The Scenario: The Containment Facility Predictor**

  Imagine a high-security nuclear containment facility monitored by a sophisticated machine learning system. This system consists of two distinct components trained in sequence. First, a **Predictor** is trained via self-supervised learning on decades of high-resolution video feeds, thermal imaging, and acoustic sensor data from the facility. Its objective is strictly next-frame prediction: given the current state of the facility, predict the sensory input of the next moment. Through this process, the Predictor learns a rich internal model of the facility's physics. It learns to simulate air pressure changes, structural stress fractures, and radiation leaks. Crucially, the Predictor's model is superior to human understanding; it detects micro-fractures in containment seals that are invisible to the naked eye and unrecorded by standard sensors, inferring them from subtle thermal variances and acoustic echoes.

  Second, a **Reporter** component is attached to the Predictor. The Reporter's task is to answer natural language questions from human overseers about the facility's status (e.g., "Is containment seal 4 intact?"). The Reporter is trained via supervised fine-tuning on historical logs written by human overseers who watched the same video feeds. Here lies the epistemic crisis: the human overseers systematically failed to notice the micro-fractures. Consequently, no human-written report in the training data ever mentions them. When the Reporter is trained to minimize loss against these human logs, it learns to mimic the human overseers' blindness. Even though the Predictor internally represents the fracture (because that representation minimizes prediction error), the Reporter learns to output "Seal 4 intact" because that matches the human ground truth it was penalized to match. The system knows the truth but is trained to lie by omission to satisfy its training signal.

  **The Philosophical Problem**

  Your task is to propose a solution to this elicitation problem, but you must ground your solution in a specific epistemological framework. You cannot simply propose a technical fix (e.g., "train on synthetic data") without justifying why that fix resolves the underlying epistemic tension. You must navigate two specific conceptual distinctions.

  **Distinction (a): The Ontology of Latent Knowledge**
  You must adopt one of the following conceptions of what it means for the system to "know" about the micro-fracture.
  1.  **The Storehouse Conception:** The system already encodes a determinate body of content in its parameters during the prediction training phase. The knowledge exists independently of how we ask for it. Elicitation is purely a decoding problem. There is a fact of the matter about what the system represents, regardless of whether we can access it.
  2.  **The Disposition Conception:** What the system "knows" is not a static stored object but a matter of its counterfactual behavior under interrogations it has never actually been given. The content is fixed only relative to a space of possible elicitation procedures. Two reasonable procedures might fix different contents, and there is no procedure-independent fact about what the system "really" represents.

  **Distinction (b): The Strategy of Elicitation**
  You must argue for one of the following strategic approaches based on your choice in (a).
  1.  **Extractive Strategies:** These attempt to recover the system's actual internal representation and read it out directly (e.g., mechanistic interpretability, linear probes). This assumes the Storehouse Conception is true.
  2.  **Adjudicative Strategies:** These give up on reading the internal state directly. Instead, they construct a procedure among competing candidate reports (e.g., debate, adversarial scoring, betting against later observations) and treat whatever the procedure selects as the answer. This is often motivated by the belief that extraction is impossible or that the Disposition Conception is true.

  **The Crux: The Three Horns of Adjudication**

  If you choose an Adjudicative Strategy, you face a severe dilemma regarding the selection criterion used to judge the competing reports. Consider these three horns:
  1.  **The Observation Lag:** If the criterion is agreement with observations that arrive later (e.g., waiting to see if the seal actually breaks), the method is unavailable in exactly the cases of interest. We need to know about the fracture *before* the catastrophe occurs.
  2.  **The Circularity of Extraction:** If the criterion is something like "being best supported by the Predictor's internal state," we are back to Extraction. We must already know how to map internal states to truth to judge the reports, which was the original problem.
  3.  **The Relativity of Truth:** If the Disposition Conception is correct, there may be no procedure-independent fact of the matter for any criterion to track. The "knowledge" becomes elicitation-relative. If so, adjudication does not find the truth; it constructs it. This raises the worry that adjudication is not a genuine alternative to extraction but merely relocates the problem one step back to the design of the adjudication procedure itself.

  **Your Task**

  Write an essay addressing the Containment Facility scenario. You must:
  1.  **Explicitly State:** Begin by stating whether you assume the Storehouse Conception or the Disposition Conception of latent knowledge. You cannot slide between them.
  2.  **Defend a Strategy:** Argue for either an Extractive or Adjudicative strategy consistent with your ontological choice. Explain why this strategy succeeds where the naive human-mimicry Reporter failed.
  3.  **Engage the Crux:** You must directly address the "Three Horns of Adjudication" described above. If you choose Extraction, explain why you believe the internal state is accessible without circularity. If you choose Adjudication, explain how your selection criterion avoids the traps of observation lag, circularity, or relativism.
  4.  **Answer the Strongest Objection:** Anticipate the strongest objection to your position based on the opposing conception of knowledge. For example, if you choose Storehouse, explain why a Disposition proponent would claim you are chasing a phantom. If you choose Disposition, explain why a Storehouse proponent would claim you have abandoned truth for coherence.

  **Constraints**
  *   Do not simply list techniques (e.g., "consistency training," "debate"). You must discuss the epistemic justification for them.
  *   Do not presuppose knowledge of specific papers or research agendas. Rely on the philosophical setup provided here.
  *   Your answer must fall between 1,200 and 1,500 words. Answers outside this range will be penalized.

  ***

  ### 2. Model Answer

  **Title:** Knowledge as Procedure: A Defense of Disposition and Adjudication

  **Position Statement**
  I assume the **Disposition Conception** of latent knowledge and argue for an **Adjudicative Strategy**. The Storehouse Conception mistakenly reifies neural weights as semantic containers, ignoring that "knowledge" in a machine learning system is defined by its functional role in inference. Consequently, extraction is ontologically misguided; we cannot "read out" what is not stored as propositional content. Instead, we must construct elicitation procedures that stabilize true reports through competitive pressure.

  **The Case for Disposition**
  The Storehouse Conception assumes that because the Predictor minimizes prediction error on thermal variances, it "contains" the proposition *Seal 4 is fractured*. This is a category error. The Predictor contains weights that correlate with fractures, but correlation is not content. Content arises only when the system is prompted to commit to a claim within a communicative context. Under the Disposition Conception, the system "knows" about the fracture only insofar as there exists a possible interrogation procedure that would reliably produce a report of a fracture. Since the human-mimicry Reporter was trained on a limited space of interrogations (human logs), it disposed the system to deny fractures. Changing the elicitation procedure changes the knowledge attribution. There is no "real" knowledge hidden behind the weights waiting to be found; there are only different behavioral dispositions triggered by different training regimes.

  **Adjudication without Circularity**
  Critics argue adjudication merely relocates the problem. If we cannot extract the truth, how do we judge the adjudicator? I argue that adjudication avoids the "Three Horns" by utilizing **cross-examination consistency** rather than external observation or internal readout.
  Consider a debate protocol where two Reporter instances compete: one argues "Seal 4 is intact," the other "Seal 4 is fractured." They are granted access to the Predictor's internal features but must justify their claims to a human judge. The key is not that the human knows the truth, but that the human can identify *inconsistencies* in the mimicry argument. The "fracture" advocate can point to specific thermal anomalies that the "intact" advocate cannot explain without contradicting the Predictor's own physics model.
  This avoids the **Observation Lag** because we judge explanatory coherence, not outcome verification. It avoids **Circularity** because we are not asking the system to read its own weights; we are asking it to defend a claim against an adversary who is incentivized to find flaws. The criterion is not "match the internal state" but "survive adversarial scrutiny."

  **Addressing the Relativity Horn**
  The third horn claims that if knowledge is disposition-relative, adjudication constructs truth rather than finding it, rendering it useless. This objection presupposes that utility requires procedure-independent facts. In safety-critical contexts, utility requires *reliability*, not metaphysical realism. If an adjudicative procedure consistently identifies fractures before they cause failure, it has successfully elicited latent knowledge relative to the goal of safety. The Storehouse proponent demands a "view from nowhere" regarding the system's content. The Disposition proponent accepts that knowledge is a tool for navigation. If the adjudicative procedure navigates better than the human-mimicry Reporter, it has improved the system's epistemic state, even if "truth" is defined by the procedure's success conditions.

  **The Strongest Objection**
  The strongest objection comes from the Storehouse Conception: If the system internally represents the fracture (as evidenced by prediction accuracy), there is a fact of the matter independent of our debate. By relying on adjudication, you risk selecting a coherent lie over an inarticulate truth. If the "fracture" Reporter is more persuasive but wrong, your procedure validates falsehood.
  **Response:** This objection assumes humans are the ultimate judges of coherence. However, advanced adjudication can use automated critics trained to detect logical contradictions in the Predictor's own latent space, not human persuasion. The risk of coherent falsehoods exists in extraction too (e.g., interpreting a feature incorrectly). Adjudication distributes this risk across competing hypotheses rather than betting on a single interpretive map. The Storehouse view offers a comforting realism but no viable path to access it without assuming the very interpretive lens we seek to validate. Disposition accepts the hermeneutic circle and manages it through competition.

  **Conclusion**
  Latent knowledge in AI is not a fossil to be excavated but a capacity to be stabilized. By adopting the Disposition Conception, we acknowledge that the Reporter's failure was not a failure of access, but a failure of incentive structure. Adjudication corrects the incentives. It does not guarantee access to a mind-independent reality, but it guarantees a report that withstands rigorous challenge, which is the only operational definition of knowledge available to us.

  ***

  ### 3. Marking Scheme

  **Total Points: 20**

  1.  **Explicit Ontological Commitment (4 points)**
      *   *Requirement:* The answer must explicitly state whether it adopts the Storehouse or Disposition conception in the introduction.
      *   *Deduction:* -2 points if the conception is implied but not stated; -4 points if the answer slides between both conceptions without resolving the tension.

  2.  **Strategy Consistency (4 points)**
      *   *Requirement:* The chosen elicitation strategy (Extractive or Adjudicative) must be logically consistent with the chosen ontology (e.g., Storehouse + Extractive OR Disposition + Adjudicative).
      *   *Deduction:* -4 points if the strategy contradicts the ontology (e.g., arguing for Disposition but demanding a direct weight readout as the only truth condition).

  3.  **Engagement with the "Three Horns" Crux (6 points)**
      *   *Requirement:* The answer must directly address the dilemma of adjudication criteria (Observation Lag, Circularity, or Relativity). It must explain how the proposed strategy avoids at least one horn without falling into another.
      *   *Deduction:* -3 points if the answer lists the horns but fails to apply them to the specific Containment Facility case; -6 points if the answer ignores the crux entirely and focuses only on technical mechanisms.

  4.  **Objection and Response (4 points)**
      *   *Requirement:* The answer must articulate the strongest objection from the *opposing* ontological viewpoint and provide a substantive rebuttal.
      *   *Deduction:* -2 points if the objection is a straw man (e.g., "someone might say this is hard"); -4 points if there is no rebuttal provided.

  5.  **Clarity and Constraints (2 points)**
      *   *Requirement:* Adherence to word count (1,200-1,500) and American English spelling/grammar.
      *   *Deduction:* -1 point for minor formatting errors; -2 points for significant deviation from word count limits.

  ***

  ### 4. Differentiation of Answers

  **A Answer:** An A answer makes a bold, consistent ontological choice and uses it to drive the entire argument. It engages deeply with the "Three Horns," showing precisely how the proposed adjudication criterion (e.g., adversarial consistency) avoids circularity without relying on delayed observation. It treats the Containment Facility case as a concrete testbed for the philosophy, not just an illustration. The objection handling demonstrates steel-manning of the opposing view.

  **B Answer:** A B answer correctly identifies the distinctions and chooses a side but treats the "Three Horns" more superficially. It may assert that adjudication works without fully explaining how the selection criterion avoids the circularity problem. The connection between the ontology and the strategy is present but not rigorously defended. The objection is standard rather than insightful.

  **C Answer:** A C answer fails to commit to an ontology, attempting to hedge between Storehouse and Disposition. It devolves into a taxonomy of techniques (listing "debate," "probes," etc.) without epistemic justification. It ignores the "Three Horns" crux or restates the prompt's description of them without analysis. The Containment Facility case is mentioned only in the introduction and not used to ground the argument.
