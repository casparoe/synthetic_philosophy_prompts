answer: |-
  # DECISION TREE: THE "WHY BRITAIN NOT CHINA?" DIAGNOSTIC

  **ROOT: What is your primary Explanandum?**
  *(Justification for 4th Branch: "Trajectory" distinguishes 'why grow' from 'why grow capital-intensively', separating Pomeranz from Elvin.)*
  1.  **Location:** Why *here* (Britain) and not *there*?
  2.  **Timing:** Why *then* (1750) and not earlier/later?
  3.  **Existence:** Why did sustained growth happen *anywhere*?
  4.  **Trajectory:** Why *this form* (capital-intensive) and not another?

  ---

  ## BRANCH 1: LOCATION (Why Here?)
  **Node 1: Is the counterfactual truth-apt?**
  *("If Britain hadn't industrialised, would China have?")*
  *   **NO (Too Distant):** → **Leaf 1: Counterfactual Void**
  *   **SHORT ANTECEDENT ONLY:** → **Leaf 2: Fragile Antecedent**
  *   **YES:** → Go to Node 2.

  **Node 2: Is the causal structure singular or bundled?**
  *(Can one factor separate the cases, or are conditions jointly necessary?)*
  *   **BUNDLED:** → **Leaf 3: Conjunctive Specificity**
  *   **SINGLE:** → Go to Node 3.

  **Node 3: Is the foil a polity or a region?**
  *(Does the cause map to borders or geology?)*
  *   **POLITY:** → **Leaf 4: Institutional Exceptionalism**
  *   **REGION:** → **Leaf 5: Ecological Luck**

  ## BRANCH 2: TIMING (Why Then?)
  **Node 4: Is the breakpoint a jump or a slope change?**
  *   **JUMP:** → Go to Node 5.
  *   **SLOPE:** → **Leaf 6: Gradual Acceleration**

  **Node 5: Is the shock source endogenous or exogenous?**
  *   **ENDOGENOUS:** → **Leaf 7: Internal Ignition**
  *   **EXOGENOUS:** → **Leaf 8: External Shock**

  ## BRANCH 3: EXISTENCE (Why Growth?)
  **Node 6: Is growth the default state?**
  *   **YES:** → **Leaf 9: Malthusian Deviant**
  *   **NO:** → Go to Node 7.

  **Node 7: Is the anomaly global or local?**
  *   **GLOBAL:** → **Leaf 10: Universal Rarity**
  *   **LOCAL:** → **Leaf 11: Regional Fluke**

  ## BRANCH 4: TRAJECTORY (Why This Form?)
  **Node 8: Is the path deterministic?**
  *   **YES:** → **Leaf 12: Teleological Path**
  *   **NO:** → **Leaf 13: Contingent Form**

  *(Note: Leaf 14 added to balance tree logic under Bundled Causes if split by scope, merged here for space. See Flagging below.)*
  *   **ADDED LEAF:** → **Leaf 14: Structural Equivalence** (Growth happens, but forms differ; occupied by 'Alternative Modernities').

  ---

  ## LEAF DIAGNOSTICS

  | Leaf | Name | Awkward Commitment | Foil Sensitivity Test (Britain vs. Yangzi / China / Eurasia) | Occupied? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Counterfactual Void** | There is no fact of the matter to be found. | **Dies Immediately** (Question dissolves in all three). | **Live** (Skeptic/Complexity views). |
  | **2** | **Fragile Antecedent** | Divergence was almost not divergence; history hangs by a thread. | **Survives Yangzi**; **Dies China/Eurasia** (Too much variance). | **Live** (Contingency/Chaos views). |
  | **3** | **Conjunctive Specificity** | No single cause separates the case; explanation is a list. | **Survives All** (If bundle is local to Britain). | **Live** (Pomeranz-adjacent). |
  | **4** | **Institutional Exceptionalism** | Political borders map neatly to economic causality. | **Dies Yangzi**; **Survives China**; **Dies Eurasia**. | **Live** (North/Institutionalists). |
  | **5** | **Ecological Luck** | Geology trumps polity; borders are irrelevant. | **Survives Yangzi**; **Dies China**; **Dies Eurasia**. | **Live** (Coal/Geography views). |
  | **6** | **Gradual Acceleration** | There is no "Revolution," just a steepening curve. | **Dies Immediately** (Explanandum is time, not place). | **Live** (Crafts/Harley). |
  | **7** | **Internal Ignition** | Society carried the spark internally before the date. | **Dies Immediately** (Explanandum is time, not place). | **Live** (Endogenous Growth). |
  | **8** | **External Shock** | History is punctuated by outside events (war/plague). | **Dies Immediately** (Explanandum is time, not place). | **Live** (War/Plague theories). |
  | **9** | **Malthusian Deviant** | Stagnation requires explaining, not growth. | **Dies Immediately** (Explanandum is existence, not place). | **Live** (Optimists). |
  | **10** | **Universal Rarity** | Britain is a fluke of universal human history. | **Survives Eurasia** (Growth is rare everywhere). | **Live** (Wright). |
  | **11** | **Regional Fluke** | Growth is normal somewhere, just not here/there. | **Dies Eurasia** (Growth is common in Eurasia). | **Live** (California School). |
  | **12** | **Teleological Path** | Modernity has only one shape; we found it. | **Dies Immediately** (Explanandum is form, not place). | **Live** (Modernization Theory). |
  | **13** | **Contingent Form** | We could be rich but technologically different. | **Dies Immediately** (Explanandum is form, not place). | **Live** (Alternative Modernities). |
  | **14** | **Structural Equivalence** | Economies were equivalent; divergence is statistical noise. | **Survives Yangzi**; **Dies China**; **Dies Eurasia**. | **Empty** (Unattractive; denies data). |

  ---

  ## FLAGGING: INDISTINGUISHABLE LEAVES
  **Leaf 3 (Conjunctive Specificity) and Leaf 13 (Contingent Form).**
  *Reason:* Both commit to "no single necessary cause." Empirically, a bundle of local conditions (Leaf 3) looks identical to a contingent path selection (Leaf 13). The tree cannot separate them without asking about the *nature* of the conditions, which violates the "form not content" rule.

  ## SEMINAR VIGNETTES

  **1. The Geographer**
  *"Look, if you move the coal fields to the Yangzi, the steam engine happens in Anhui. It's not about the Crown, it's about the rocks."*
  → **Diagnosis:** Roots at **Location**. Passes Counterfactual (Yes). Causal Structure (Single). Foil Unit (Region).
  → **Lands on Leaf 5: Ecological Luck.**
  → **Foil Test:** Survives Yangzi (same geology), Dies China (wrong polity).

  **2. The Institutionalist**
  *"You can't ask why growth happened in the Yangzi because the property rights weren't there. It has to be a sovereign state that guarantees patents."*
  → **Diagnosis:** Roots at **Location**. Passes Counterfactual (Yes). Causal Structure (Single). Foil Unit (Polity).
  → **Lands on Leaf 4: Institutional Exceptionalism.**
  → **Foil Test:** Dies Yangzi (no state), Survives China (sovereign).

  **3. The Skeptic**
  *"We're asking why the needle moved here, but the needle didn't move anywhere until very recently. Why are we treating stagnation as the baseline?"*
  → **Diagnosis:** Roots at **Existence**. Growth Default? (No, stagnation is default).
  → **Lands on Leaf 9: Malthusian Deviant.**
  → **Foil Test:** Dies Immediately. (The "Britain vs China" contrast is irrelevant if the question is "Why Growth?").

  ---
  *Print me on A4. Cut the circling.*
