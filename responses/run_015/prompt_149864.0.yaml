  In a municipal archive, two senior archivists stand before a sealed, opaque vault containing two unclassified metallic ingots recovered from a shipwreck. Unable to see the objects clearly or classify their material composition, and knowing nothing else about their history or properties, the first archivist points directly at the left mass through the glass and proposes, "Let us call that one 'Alpha'," while the second points at the right mass and proposes, "Let us call that one 'Beta'." The names are introduced by bare demonstrative baptism with no accompanying sortal or identifying description; the archivists possess no descriptive information that could serve as a reference-fixer, yet they know perfectly well, via the perceptual causal chain, which specific physical objects the names designate. Months later, metallurgical analysis reveals that the material constituting Alpha was smelted directly from Beta, establishing a historical dependence relation between the two objects.

  **S:** "Alpha originated from Beta."

  **The Check**
  *   **Millian Direct Reference:** The proposition expressed is singular, containing the objects $o_\alpha$ and $o_\beta$ and the relation *originated from*. Since origin is an essential property of artifacts, the proposition is metaphysically necessary. However, because the reference was fixed without descriptive knowledge of the origin, the truth of the proposition is knowable only via empirical investigation. Verdict: Necessary A Posteriori.
  *   **Epistemic Two-Dimensionalism:** The account requires a contingent Primary Intension (PI) to explain aposteriority. Typically, the PI is supplied by reference-fixing descriptions (e.g., "the ingot on the left"). Here, Constraint 2 bans such descriptions. Without descriptive content, the PI collapses into the Secondary Intension (object-dependent), becoming necessary. If the PI is necessary, the statement is classified as A Priori. Verdict: Necessary A Priori (False).
  *   **Divergence Step:** The determination of the Primary Intension. The Millian accepts no PI and separates modality from epistemology directly; the Two-Dimensionalist relies on the PI to track epistemic possibility, but the lack of descriptive content forces the PI to be rigid, failing to capture the epistemic contingency.

  **The Load-Bearing Feature**
  The work is done by the **bare demonstrative baptism** (Constraint 2). If the baptism were replaced by an ordinary description-backed one (e.g., "Let 'Alpha' name the ingot on the left"), the Two-Dimensionalist could assign a contingent PI ("the ingot on the left"), correctly predicting the A Posteriori status. The case shows that without descriptions, Two-Dimensionalism loses the mechanism (contingent PI) required to explain the epistemic gap, whereas Millianism remains unaffected because it does not rely on descriptions for reference or modal profile.

  **The Two-Dimensionalist Attack**
  A Two-Dimensionalist will argue that even bare demonstratives carry implicit descriptive content, such as "the object causing this visual experience," which provides the required contingent PI. They will claim this description varies across epistemic scenarios, restoring the A Posteriori verdict.

  **Response**
  This attack fails against the specific constraints of the case. Constraint 2 stipulates the speakers "know nothing else about" the objects, including their causal status relative to the experience. Reference is secured by the causal-perceptual link itself, not by the speaker's grasp of a description of that link. To impose a description is to violate the "no reference-fixer" constraint and revert to the standard Hesperus–Phosphorus model the case is designed to bypass. The case demonstrates that if reference is truly descriptionless, Two-Dimensionalism lacks the resources to explain the aposteriority.

  **Essentialist Premise Flag**
  The case relies on the **Necessity of Origin** for artifacts. This premise bears significant weight; if origin is contingent, $S$ is not necessary. However, this is a standard metaphysical assumption in Kripkean frameworks and does not undermine the linguistic point regarding reference-fixing mechanisms.
