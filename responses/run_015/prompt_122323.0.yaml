answer: |-
  This is a classic problem in moral philosophy and literary theory, one that Plutarch himself grappled with in his *Life of Alexander*. He famously writes that he is not writing histories, but lives, and that "a slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall."

  Your friend's skepticism (that it's just PR) is the modern default position, but your intuition that there is a mechanism for moral transmission is correct. However, your gut verdicts contain a contradiction—specifically in the "apples and oranges" case—that a coherent principle needs to resolve.

  Here is a proposed framework, which I'll call **The Principle of Cognitive Moral Labor**.

  ### The Principle
  **A biography produces moral improvement only to the extent that it forces the reader to perform the work of moral judgment rather than passively receiving a verdict.**

  Moral growth is a muscle; if the text lifts the weight for you (hagiography), your muscle atrophies. If the text forces you to lift the weight (discernment amidst bias or contradiction), your muscle grows.

  Here is how the principle breaks down, clause by clause, mapped to your cases:

  #### Clause 1: The Requirement of Friction
  *   **The Rule:** The text must preserve the *cost* of virtue and the *reality* of vice. It cannot resolve moral ambiguity on behalf of the reader.
  *   **Motivating Case:** **Hagiography vs. Plutarch.**
  *   **Explanation:** This explains why the modern saint's life fails. By rewriting every failure as a hidden virtue, the text removes the *friction* of moral choice. If there is no struggle, there is no model for how to struggle. Plutarch works (in your first verdict) not because he pairs Greeks and Romans, but because he usually includes the "slight things"—the moments of pettiness, anger, or hesitation—that show the virtue was hard-won.
  *   **Implication:** A biography that smoothes over contradiction (your "mixed bag" case) fails *unless* it explicitly highlights the contradiction as a tragedy. If it presents a brutal politician as a "great leader" without forcing you to reckon with the brutality, it is propaganda, not moral teaching.

  #### Clause 2: The Value of Hostile Evidence
  *   **The Rule:** A biography teaches *more* when the reader must discern virtue against the grain of the author's intent.
  *   **Motivating Case:** **The Negative Portrait.**
  *   **Explanation:** You were stuck on whether a hostile biography that accidentally reveals greatness teaches more or less than hagiography. This principle argues it teaches **more**. In hagiography, you are told what to admire. In a hostile portrait where the subject still shines through, *you* have discovered the virtue. You have performed the moral labor of separating the author's bias from the subject's agency. This active discernment creates a deeper neural pathway for moral recognition than passive acceptance.
  *   **Implication:** The "PR" your friend accuses Plutarch of is actually less dangerous than modern hagiography, provided Plutarch leaves enough raw data for you to disagree with him.

  #### Clause 3: Psychological Isomorphism over Historical Identity
  *   **The Rule:** Moral mapping relies on structural psychological similarity, not situational historical similarity.
  *   **Motivating Case:** **The Context Mismatch (Apples and Oranges).**
  *   **Explanation:** This is where I must address your flip-flopping. You said sometimes the historical mismatch clicks, and sometimes it feels like apples and oranges. A coherent principle cannot flip-flop.
  *   **The Hard Truth:** If it feels like "apples and oranges," the biography has **failed** as a moral tool for that reader, regardless of its historical accuracy. The failure lies in the text's inability to translate the *psychological mechanism* of the decision into a universal language. If you cannot map the virtue onto your life because the context is too alien, the biography is merely history, not ethics.
  *   **Implication:** A successful moral biography must bridge the gap. If it doesn't, it is entertainment (your friend's view), not teaching.

  ---

  ### The Honest Admission: Which Verdict Gets Dropped?
  To make this principle coherent, I have to ask you to drop (or significantly modify) your verdict on **Plutarch's Paired Lives**.

  You currently think: *"Plutarch pairing a Greek and Roman figure to highlight one virtue like continence: that works, you can see the pattern across both lives and it sticks with you."*

  **The Modification:** Plutarch often *forces* these parallels to fit his moral thesis. Sometimes he obscures historical truth to make the virtue line up. According to the **Principle of Cognitive Moral Labor**, if Plutarch is smoothing over differences to make the "pattern stick," he is edging toward hagiography.
  *   **The Drop:** You must admit that Plutarch only teaches when his pairing *fails* to fully convince you, forcing you to ask, "Why is he comparing these two? Where is the difference?" That moment of skepticism is where the moral learning happens. If you accept the pairing uncritically because "it sticks," you are being manipulated, not taught. The value isn't in the pattern sticking; it's in you testing the pattern.

  ### The Shadow Biography
  Your professor's format—framing decisions through a virtue the subject *never* possessed—is a **diagnostic critique**, not a model for imitation.
  *   **What it says:** It highlights the *shape of the void*. By showing what *would* have happened had the subject possessed humility (for example), it illuminates the specific damage caused by their pride.
  *   **Moral Utility:** It teaches via **negative capability**. It doesn't show you how to be good; it shows you the precise contour of the bad by contrasting it with the ghost of the good. It is morally potent, but it is a tool for judgment, not for orientation.

  ### Imitation vs. Orientation
  There is a crucial difference here, and your principle hinges on it.
  *   **Reading for Imitation:** Trying to copy the subject's actions (e.g., "Alexander slept on the ground, so I will sleep on the floor"). This is usually useless and often dangerous.
  *   **Reading for Orientation:** Calibrating your own internal compass based on the subject's trajectory (e.g., "Alexander's inability to stop conquering destroyed his friendships; I need to check my own ambition against my relationships").
  *   **Verdict:** Biography teaches **Orientation**. It provides a map of consequences, not a script for action.

  ### Prediction: The Unreliable Autobiography
  Finally, the case of the author who describes their worst motives in detail but clearly doesn't understand them (e.g., certain political memoirs or confessions like Rousseau's or even parts of *Confessions* by Augustine where he lingers on sin).

  **Prediction:** This is the **highest form of moral teaching**, superior even to Plutarch.
  *   **Why:** It maximizes **Cognitive Moral Labor**. The author provides the data (the actions) but refuses to provide the correct judgment (the motive analysis). The reader is forced to become the moral judge. You must look at the text and say, "You think you were right, but I can see you were cruel."
  *   **Outcome:** This creates the strongest moral muscle because it simulates real life. In real life, people rarely admit they are the villain. Reading an unreliable autobiography trains you to spot the gap between *stated intent* and *actual impact* in yourself and others.

  ### Summary for Your Argument
  Tell your friend: Biography isn't moral teaching if it's just a resume of virtues (that is PR). It becomes moral teaching only when it functions as a **simulation of judgment**. If the book lets you be passive, it's entertainment. If it forces you to argue with the author, sift through bias, or judge a subject who doesn't understand themselves, it is moral gymnasium. Plutarch works not because he tells the truth, but because he gives you enough rope to hang him if he's lying.
