answer: |-
  Hi there,

  It is completely understandable why that sentence has been sticking in your craw, because your intuition is correct that it is being asked to do too much work. When your colleague says we are not taking away options or forcing anyone, they are conflating several distinct ethical claims into one slogan, and each of those claims holds up differently under scrutiny. To sort this out for your colleagues, it helps to separate the sentence into at least four different readings, ranging from a trivial technical truth to a substantial moral assertion, and then test each one against the reality of your pre-checked box.

  The first and most literal reading is what we might call the formal availability claim. This simply states that the mechanism to refuse the audit exists on the page. Technically, this is true. The box can be unchecked, the form can be mailed back, and no physical force is applied to the tenant. As a description of the physical world, this is accurate. However, as a moral principle for closing down debate, it is very weak. It treats freedom as merely the absence of physical coercion or formal prohibition, ignoring the psychological and practical architecture of the choice. If this were the only standard that mattered, we would have to say a person is equally free whether a button is placed clearly in front of them or hidden behind three menus and a captcha, provided both are technically possible. Most people agree that freedom involves not just the existence of a path, but the reasonable ability to see and walk it. So while this reading is true, it is too thin to justify shutting down concerns about manipulation or inertia.

  This leads directly into the second reading, which concerns the cost of choosing, and this is where your point about attention becomes crucial. When your colleague says nobody is being forced, they imply that opting out is easy. But you are right to identify that attention is a scarce resource and that noticing a pre-checked box requires a specific kind of cognitive engagement. If the design relies on the statistical likelihood that people will not notice the box, then the ease of opting out is illusory for a significant portion of the population. This is not just inventing a fancy way to count everything as coercion; it is recognizing that decision-making has transaction costs. If the default is set to capture people who are inattentive rather than people who are consenting, then the claim that options are on the table is misleading. The options are on the table, but the menu is printed in invisible ink for anyone not already looking for it. This reading undermines your colleague's attempt to end the discussion because it highlights that the default setting actively leverages human limitation to achieve an outcome, which is a form of influence that goes beyond merely leaving options open.

  The third reading brings us to your friend's flip test, which shifts the argument from liberty to welfare. The idea here is that a default is acceptable if it only changes the outcome for people who are indifferent, while allowing those with strong preferences to opt out. This is a substantial principle often discussed in policy design, and it has merit. If the audit is genuinely beneficial and free, and the only people who end up getting it are those who either want it or do not care, then harm is minimized. However, this test has two major vulnerabilities. First, it assumes we know what people would choose if they paid attention, but the whole point of a default is that many people will not pay attention. If someone would have objected to a stranger spending ninety minutes in their apartment but fails to notice the box, the flip test fails to protect them. Second, as you worried, this makes the nudge seem pointless if it only affects the indifferent. Why expend energy designing a default if it does not change behavior? The answer is usually that it does change behavior, specifically by capturing the inattentive. If the policy relies on inattention to succeed, then claiming it is harmless because people can opt out is circular. The flip test is a useful heuristic, but it does not absolve the authority of the responsibility to ensure the default aligns with the true preferences of those who might not notice it.

  The fourth distinction you recalled, about ends versus means, is also relevant but perhaps less helpful to your colleague than they might hope. The idea is that it is less objectionable to interfere with how someone achieves their goals than with what those goals are. If we assume every tenant wants to save money on utilities, then the audit is merely a means to a shared end. However, the audit is not just a financial transaction; it involves privacy and time. For some tenants, the cost of ninety minutes of intrusion might outweigh the benefit of lower utilities, meaning the audit is not just a means but a trade-off between competing ends, like privacy versus savings. By pre-checking the box, the authority is effectively making that trade-off for them. This suggests the intervention is not purely about means, but about prioritizing one end over another. Therefore, this distinction does not fully support the claim that no one is being forced; rather, it shows that the authority is forcing a specific prioritization of values upon the tenant, assuming savings are more important than privacy or time.

  Finally, we need to separate the claim about options from the claim that it is what they would want anyway. These are fundamentally different arguments. The options claim is about liberty and process, while the what-they-would-want claim is about welfare and outcomes. Your colleague used the options claim to shut down the debate, but the justification for the policy actually rests on the welfare claim. If the argument is truly that tenants are better off with the audit and would choose it if fully informed, then say that. But that is an admission of paternalism, not a denial of it. Saying we are not taking away options is a defense of liberty, but saying we know what is best for them is a defense of welfare. Mixing the two allows someone to claim the moral high ground of respecting freedom while actually exercising authority over outcomes. To close the argument honestly, you would need to establish that the welfare benefit is so clear and the intrusion so minimal that the paternalism is justified, rather than pretending the paternalism does not exist because a checkbox is technically editable.

  So, to answer your core question, none of these readings fully support closing the argument the way your colleague did. The literal reading is true but morally insufficient. The attention cost reading shows why the choice is not truly free for everyone. The flip test reveals risks about inattention that need to be addressed, not ignored. The ends versus means distinction is muddy in this context because privacy is at stake. And the welfare claim is a separate argument that admits to paternalism rather than denying it. Your philosophy colleague was right that it is a thin notion of freedom, but you can strengthen that by pointing out that real freedom requires not just the existence of options, but the capacity to exercise them without undue friction or exploitation of inattention. If you want to move forward, the discussion should shift from whether people can opt out to whether the default setting respects the tenants who might not notice it, and whether the benefit is strong enough to justify making that choice for them.

  I hope this helps you untangle the knot. It is a subtle issue, but these distinctions matter for maintaining trust with the people you serve.

  Best wishes
