      *   Did I distinguish signalling from labor/inertia? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to simply say "it's exploitation." The user wants the *internal logic* of the defenders. I must steelman the defence before critiquing it. The defence is about *trust* and *uncertainty*. Patients can't judge doctors, so they need a proxy. The ordeal is the proxy.

      *(Refining Question 2)*: The user is right about the Handicap Principle. If the cost is monetary/opportunity-based, it signals wealth, not grit. I need to make sure I validate this insight. The defence *implicitly* assumes the cost is purely physical/mental, ignoring the socioeconomic filter.

      *(Refining Question 5)*: The "exit" isn't just leaving residency; it's leaving the *pathway*. The signal is damaged if the pathway is eased.

  9.  **Final Polish:** Ensure clear headings and direct answers to the specific sub-questions. (Proceed to generate output).

      *Wait, one more nuance:* The user asked "What must the ordeal be doing for the defence of it to be coherent?" I need to be sharp on *coherence*. If the task is arbitrary, it *cannot* be skill formation. So for the defense to be coherent, it *must* be screening/signalling. I need to make that distinction clear.

      *Also on Q3:* Is there a single view? The "Sacralization" view. Medicine as a priesthood. This unifies the contradictions. Suffering = Sanctification.

