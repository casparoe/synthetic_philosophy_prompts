answer: |-
  **Summary**

  The procedure isolates desert by asking four sequential questions: Did the outcome depend on choice within our control? Is the comparison baseline fair? Have we rewarded this before? Is this actually a structural issue? If yes to all, desert holds. If no, we record whether we are overriding desert for utility, entitlement, or expression. We deliberately refuse to decide the ultimate fairness of the pay bands or work assignment structures themselves; those are handed upward.

  **The Distinctions that Have to Survive**

  Committee members must hold these contrasts clearly without merging them. **Desert** is what is owed for past action chosen by the person. **Entitlement** is what the rulebook says they get regardless of action. **Consequence** is what will make them work harder next time. **Expression** is what story we want to tell the staff publicly. **Choice** covers actions the person could have done differently. **Circumstance** covers advantages or barriers given by the organization or luck. **Tiering** groups people into "high enough" buckets without ranking them. **Ranking** orders people from first to last where no tie exists. **Stale Desert** is a claim already paid out in a prior cycle. **Structural Claim** is a complaint about the rules rather than the application.

  **The Procedure**

  This procedure runs in five steps. Do not skip steps. If a step triggers a handoff, stop and route the form.

  **Step 1: The Structural Check.**
  Ask: Is the complaint about the pay band, the number of slots, or how work was assigned? If yes, this is not an allocation decision. Check "Structural Claim." Hand off to the Board for band/slot issues or to the Chair for work assignment issues. Do not proceed.

  **Step 2: The Entitlement Check.**
  Ask: Does the written bonus plan or contract mandate this allocation based on ratings alone? If yes, check "Entitlement." Write the justification citing the rule. Stop. Desert is irrelevant here.

  **Step 3: The Desert Inquiry.**
  Ask three sub-questions.
  *   **Control Cutoff:** Did the result trace to choices the person made within their assigned role? Stop tracing causes at the point of organizational assignment. If the organization gave them the hot project, count the execution as choice, but note the opportunity as circumstance.
  *   **Baseline Check:** Who is the comparator? Use peers with similar organizational opportunities. If the candidate outperforms peers with similar advantages, mark "Desert Supported." If they outperformed peers with fewer advantages, mark "Desert Strong." If they outperformed only because they had better advantages, mark "Desert Weak."
  *   **Staleness Check:** Have we rewarded this specific act or outcome in a prior cycle? If yes, mark "Stale." Desert is discharged.

  **Step 4: The Override Check.**
  If Desert is Weak or Stale, ask: Are we allocating anyway? If yes, you must select one override reason: **Consequence** (to incentivize future behavior), **Expression** (to signal values), or **Equity** (to correct past organizational bias). You must write this reason on the form. If you cannot select one, you cannot allocate.

  **Step 5: The Justification.**
  Write the one-paragraph statement. Do not mention character, luck, private hardship, or organizational fault. State the comparison baseline and the override reason if applicable. For bad quarters, state "absence of claim to more" rather than "claim to less."

  **Stipulations:**
  1.  **Luck Stipulation:** We stipulate that effort within assigned roles is choice. We do not investigate why they had the capacity for effort.
  2.  **Tiering Rule:** If scores are within 5%, declare a tie. Do not manufacture ranking.
  3.  **Expressive Cost:** If an award is given for Expression, do not claim it is for Performance in public.

  **Allocation Decision Form**

  ```text
  CASE ID: _______________   CANDIDATE: _______________   TYPE: [ ] Bonus [ ] Promotion [ ] Award

  1. STRUCTURAL CHECK
     [ ] Issue is about bands/slots/assignment. HANDOFF: [ ] Board [ ] Chair. STOP.
     [ ] Issue is about individual allocation. CONTINUE.

  2. ENTITLEMENT CHECK
     [ ] Rulebook mandates this outcome. JUSTIFICATION: Cite Rule _______. STOP.
     [ ] Discretionary. CONTINUE.

  3. DESERT INQUIRY
     Control Cutoff: [ ] Choice within role [ ] Driven by assigned opportunity
     Baseline: [ ] Peers (similar opportunity) [ ] Peers (less opportunity) [ ] Peers (more opportunity)
     Staleness: [ ] New claim [ ] Stale (previously rewarded)
     DESERT STATUS: [ ] Supported [ ] Weak [ ] Discharged

  4. OVERRIDE (Only if Desert is Weak/Discharged)
     [ ] None (Deny Allocation)
     [ ] Consequence (Incentive)
     [ ] Expression (Values)
     [ ] Equity (Correction)
     REASON RECORDED: _________________________________________________

  5. JUSTIFICATION DRAFT (For Union Appeal)
     _________________________________________________________________________
     _________________________________________________________________________
     (Must not cite character, luck, or private hardship)

  SIGN-OFF: [ ] Committee Chair [ ] HR Partner (Legal Risk) [ ] Board (Structural)
  ```

  **Three Worked Applications**

  **Case 1: Priya vs. Marcus (The Laundering Check)**
  Priya's growth numbers are superior, but the Payments Platform was assigned to her by leadership. Marcus's work was invisible maintenance.
  *   **Form:** Step 1 (No). Step 2 (No). Step 3: Control Cutoff notes Priya's opportunity was assigned (Circumstance). Baseline shows Priya outperformed peers with similar advantages, but Marcus outperformed peers with fewer advantages (his legacy system was a barrier). Desert Status: Priya (Weak), Marcus (Supported).
  *   **Decision:** Allocate to Marcus.
  *   **Justification:** "Allocation reflects contribution relative to assigned constraints. Marcus's retention of critical infrastructure under legacy constraints exceeded baseline expectations for his grade."
  *   **Override:** None. This is pure desert adjusted for opportunity laundering.

  **Case 2: The Analysts (The Consequence Override)**
  Analyst A worked 70 hours. Analyst B worked standard hours with caring duties.
  *   **Form:** Step 3: Control Cutoff. Analyst A's hours were possible due to lack of caring duties (Circumstance). Desert Status: Weak (rewarding circumstance).
  *   **Decision:** Allocate to Analyst B or Split. If allocating to A, must Override.
  *   **Override:** If we give it to A, we check "Consequence." But the organization does not want to incentivize 70-hour weeks.
  *   **Decision:** Allocate to Analyst B (Equity/Equilibrium) or Deny A. Let us say we Deny A the top bonus.
  *   **Justification:** "Allocation rewards output efficiency within standard operational capacity. Model delivery was achieved within standard hours."
  *   **Unwelcome Truth:** This penalizes visible effort. It tells Analyst A her sacrifice is not currency here.

  **Case 3: The Nurse Manager (The Expressive Cost)**
  Twenty-two years tenure. Adequate performance. Chronic illness. Committee wants to give Values Award.
  *   **Form:** Step 3: Desert Status: Weak (Performance is adequate, not exceptional). Staleness: Tenure is ongoing, not new.
  *   **Decision:** Allocate.
  *   **Override:** Check "Expression."
  *   **Justification:** "Award recognizes sustained alignment with organizational values during periods of operational stress."
  *   **Chair's Discomfort:** The procedure forces us to admit this is not for performance. It is for story-telling.
  *   **Outcome:** The procedure says: Give the award, but mark it as Expression. Do not claim she was the "top performer."

  **Where the Committee Will Balk**
  The committee will find the answer to **Case 1 (Priya)** most unwelcome. Denying the person with the best visible numbers contradicts the instinct to pay for results. It requires defending "invisible work" against "growth metrics" to a union rep, which feels risky. However, it is the right answer because rewarding Priya launders the organization's decision to give her the prime project. It treats organizational assignment as individual merit. Case 3 is uncomfortable for the Chair because it exposes the award as symbolic rather than meritocratic, but Case 1 threatens the committee's credibility on performance metrics. Case 1 is right because it stops the organization from claiming credit for its own staffing choices as if they were employee virtues. The procedure forces honesty: if the opportunity was assigned, the desert claim is diluted. Without this, compensation reinforces structural advantage rather than individual contribution.

  **Where it Misfires**

  This procedure fails when judgment is dressed up as procedure. The "Control Cutoff" is a stipulation, not a discovery; members may argue endlessly about where organizational control ends and choice begins. It cannot settle the fairness of the pay bands themselves; a candidate can deserve the top slot within a band that is itself unjust. It also struggles with "Bad Quarters." The procedure says this is an "absence of claim to more," but a committee may feel pressure to punish rather than simply withhold. Finally, the "Expressive Cost" relies on honesty. If the committee marks "Expression" but announces "Performance," the procedure has not prevented dishonesty, only recorded it. It cannot force the public statement to match the private form. These are structural limits. The procedure manages allocation, not truth. It prevents double-counting and laundering, but it cannot fix a culture that values visibility over stability. It is a tool for consistency, not justice.
