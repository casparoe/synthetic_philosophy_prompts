      *   *The Assumption:* The district distinguishes between *systemic/collective force majeure* (the storm) and *individual/localized contingency* (the building).
      *   *Agency:* The district treats the storm as an external agent that stops *school*. They treat the building outage as a personal problem the student must overcome.
      *   *The "Personification" Point:* The user asks if we personify big weather but not poverty/infrastructure. Yes, essentially. A storm is seen as an act of God/Nature. A broken boiler is seen as a maintenance issue or bad luck that falls on the individual.
      *   *The "Unexcused Absence" Implication:* If *any* barrier (housing, grid, transport) counted as an actor preventing attendance, "unexcused" would shrink drastically. It would shift the burden from the student to the system.
      *   *Key Concept:* *Institutional Legibility.* Schools can track a county-wide closure easily. They can't verify every individual outage without creating a bureaucracy nightmare (or they choose not to). It's also about *shared experience* vs. *isolated vulnerability*.

