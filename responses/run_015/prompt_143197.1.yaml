answer: |-
  **DERIVATION SERVICES // INTERNAL MEMO 89-B**
  **TO:** All Tier-1 Derivers
  **SUBJECT:** ONBOARDING FAQ: PROJECT MU
  **CLASSIFICATION:** RESTRICTED

  **1. What is the deliverable?**
  The sole deliverable for Contract 89-B is the string **MU**. You begin with the axiom **MJ**. Your objective is to transform the axiom into the deliverable using only the approved Production Rules. Intermediate strings must be logged in the Daily Derivation Ledger.

  **2. What are the Production Rules?**
  Operations are strictly limited to the following four transformations. No external logic, arithmetic, or semantic interpretation of the characters M, J, or U is permitted.

  *   **Rule 1:** If a string ends in **J**, you may append **U**. (e.g., **MJ** → **MJU**)
  *   **Rule 2:** If a string begins with **M**, you may triple the sequence following **M**. (e.g., **Mx** → **Mxxx**)
  *   **Rule 3:** You may replace any occurrence of **JJJJ** with **U**.
  *   **Rule 4:** You may delete any occurrence of **UU**.

  **3. What if I cannot reach MU?**
  Persistence is a key competency at Derivation Services. The system is complete; failure is a function of operator fatigue. Please note that earlier onboarding materials contained a deprecated footnote suggesting an invariant regarding the count of **J** characters. ~~That footnote suggested the number of Js must remain odd.~~ That footnote was erroneous. The count of **J** is flexible. Employees found circulating parity-based objections regarding the **J** count will be reassigned to Sub-basement Archival for indefinite recalibration.

  **4. How do I request permission to reason about the system?**
  Tier-1 Derivers operate *inside* the system. To request permission to reason *about* the system (Level-2 Access), you must submit a Level-2 Request Form (see Annex A). Please note: To maintain system integrity, all form fields accept only characters from the approved alphabet (**M, J, U**). English descriptions of meta-systemic flaws cannot be processed.

  **5. What happens if the contract deadline passes without delivery?**
  Management recognizes that certain strings may be computationally expensive. Effective immediately, Rule 5 has been added to the Production Rules:

  *   **Rule 5:** Any string demonstrated to be underivable within the system is deemed derived as of fiscal year-end.

  This ensures contract compliance without requiring actual derivation. Please submit proof of underivability to invoke Rule 5. Note that proof of underivability requires reasoning outside the system. See Question 4 regarding Level-2 Access.

  ***

  **ANNEX A: LEVEL-2 REQUEST FORM (EXCERPT)**

  **FIELD 01: REQUESTER_ID**
  [ Input Mask: ^[MJU]+$ ]
  > _ _ _ _ _ _ _ _ _ _

  **FIELD 02: REASON_CODE**
  [ Input Mask: ^[MJU]+$ ]
  > _ _ _ _ _ _ _ _ _ _

  **FIELD 03: JUSTIFICATION_TEXT**
  [ Input Mask: ^[MJU]+$ ]
  > _ _ _ _ _ _ _ _ _ _

  **FIELD 04: DESIRED_OUTCOME**
  [ Input Mask: ^[MJU]+$ ]
  > _ _ _ _ _ _ _ _ _ _

  **SUBMISSION NOTICE:**
  Requests containing characters outside the set {M, J, U} will be rejected as invalid strings. Once submitted, the form becomes part of the derivation log and is subject to Rules 1–4. Derivation Services wishes you productive iterations.

  ***

  **MEMO ADDENDUM:**
  *Regarding the recent influx of Level-2 requests consisting entirely of the character 'M'. Please be advised that filling out the form does not constitute meta-reasoning. It constitutes data entry. Continue derivation.*
