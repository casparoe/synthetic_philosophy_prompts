answer: |-
  Nadia swirled the ice in her glass, pointing the condensation at him. "Look, the problem isn't the algebra, it's the job description. Credence isn't just a number you write down; it's a disposition to act. If my credence in $A$ is 0.8 and $\neg A$ is 0.8, I'm disposed to accept bets that guarantee a loss. Your 'paraconsistent probability' just legitimizes the Dutch Book. It tells me, 'Sure, bleed money, that's what truth costs.' But that severs the tie between rationality and success.

  "And don't give me the 'rare contradictions' line. Logic is closed under entailment. If a glut sits at the foundation, it infects every complex sentence built on top of it. If I'm uncertain about physics, and physics entails math, and math entails logic… you can't quarantine a contradiction with a probability distribution. The map stops matching the territory not because the territory is weird, but because the map requires exclusivity to function. Probability measures how much you rule out. If I rule out nothing, I'm not measuring anything. If you're a dialetheist, you don't tweak the calculus. You throw it out. You need a theory of acceptance, not degree."

  He leaned against the table, smiling. "But if the world is glutty, then 'guaranteed loss' assumes a consistent payout structure. Maybe the bookie is the one misrepresenting reality. Why should my credence conform to a consistent bookie's ledger instead of the world's structure? You're saying the view breaks, Nadia. I'm saying your wallet is just conservative."

  Nadia didn't blink. She just took a slow sip, letting the silence argue that consistency buys you things money can't.
