          I take the first horn: the animal still sees, and consequently, the computation remains intact despite the substitution. Your argument rests on the assumption that computation requires discrete states, stored programs, or compressible descriptions internal to the component, but I have already conceded that the brain lacks these architectural features. Computation in the nervous system is not defined by the internal complexity of its individual units but by the organizational structure of information flow across the network. When you replace a neuron with a device that perfectly matches its input-output profile within the living circuit, you are preserving the functional mapping that constitutes the computational step. The computation is not located in the biochemical soup of the neuron any more than it is in the silicon of the substitute; it is located in the causal role the unit plays in transforming input signals into output signals that guide behavior. By ensuring the voltage responses match the stimuli encountered, you have preserved the specific counterfactual dependencies that define the computational process, meaning you have not removed computation but merely changed its substrate.

          To address your pre-empted exits, the distinction between these devices and a eroding coastline lies in the systemic context of the state changes. A coastline's erosion is a dynamical process, but it is not computational because the physical states of the sand do not function as representations, which I define here as physical vehicles that the system uses to guide action based on their covariance with distal environmental features. The coastline does not use its shape to navigate the world; the monkey's visual cortex uses its voltage patterns to track shapes. Similarly, the description is computational rather than merely dynamical because it appeals to the content of the states rather than just their physical trajectory. A dynamical description tells you how the voltage changes over time given physical laws, but a computational description tells you why that change matters for the organism's goals given what the voltage stands for. The substitution devices are embedded in a network that treats their output as information about the world, whereas the coastline is isolated from any such interpretive control loop.

