  ok so heres my philosophical profile for the consciousness reading group and i want to check if im smuggling contradictions in before i present. I hold:

  (1) im a type-b physicalist about phenominal consciousness - the hard problem is epistemic, not ontological.
  (2) global workspace theory gets access consciousness right: broadcasting, global availability, reportability.
  (3) phenomenal consciousness is genuinely different from access consciousness; blocks distinction holds.
  (4) i deny phenomenal overflow - theres no rich experience beyond what the workspace can access and report.
  (5) zombies are perfectly conceivable but metaphysically impossible; conceivability is fallible.
  (6) the explanitory gap comes from phenomenal concepts being direct or quotational, not missing physics.
  (7) phenomenal consciousness actually requires the workspace broadcasting architecture, so in a sense gwt explains phenominal consciousness too, just not through the access part.
  (8) phenomenal representations are analog, continuous and non-conceptual, while workspace representations are discrete and symoblic.
  (9) first-person reports are fallible - people can misreport their own experience.

  go through these and tell me which pairs are actually in tension and which only look like it. order the real tensions by severity, and for each say whats the cheapest revision and what it costs me. i want to know especially whether (3), (4) and (7) together collapse phenomenal into access despite my insistence otherwise, and whether (8) makes that worse. also check if (5) conflicts with (1) or if thats just apparent. dont just flag every pair - discriminate, and say which single revision would clean up the most mess if i had to pick one.
