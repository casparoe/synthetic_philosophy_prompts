answer: |-
  What you have observed is a profound philosophical insight, and you are quite right to suspect that there is a specific vocabulary for it. The pattern you are describing is most famously captured by a theory called the **Extended Mind Thesis (EMT)**.

  This idea was proposed in 1998 by the philosophers Andy Clark and David Chalmers. While it began in the philosophy of mind and cognitive science, it has significant implications for how we understand learning, which makes it perfect for your project.

  Below, I will explain the core concept, introduce its neighbouring ideas, analyse your three specific cases, and discuss where the boundaries lie between using a tool and thinking *with* a tool.

  ### 1. The Core Idea: The Extended Mind Thesis

  Traditionally, philosophers have been **Internalists**. They argue that the mind is contained strictly within the brain and body. If you remember a fact, the neural trace must be in your head. If you calculate a sum, the processing must happen in your neurons.

  The Extended Mind Thesis challenges this boundary. It suggests that the physical vehicles of cognition (the things that actually do the thinking or remembering) can extend beyond the skin and skull into the environment.

  To explain this, Clark and Chalmers use a famous thought experiment involving two people, Inga and Otto, who want to visit a museum.
  *   **Inga** has a normal biological memory. She thinks, recalls the museum is on 53rd Street, and walks there.
  *   **Otto** has Alzheimer's disease and carries a notebook everywhere. He consults the notebook, sees the address is 53rd Street, and walks there.

  The Internalist says Inga remembers, but Otto merely *consults a record*. Clark and Chalmers argue that if the notebook functions for Otto exactly as biological memory functions for Inga (it is reliable, always available, and automatically trusted), then the notebook is literally part of Otto's mind. To remove the notebook is not to take away his pen; it is to damage his memory.

  They call this the **Parity Principle**: *If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognising as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.*

  ### 2. Analysing Your Three Cases

  Let us apply this framework to your observations.

  **Case 1: The Phone and Bus Routes**
  *   **Verdict:** This is the strongest fit for the Extended Mind Thesis.
  *   **Analysis:** You described consulting the phone "automatically without checking." This matches Otto's notebook. You have offloaded the storage of this information from your hippocampus to your device.
  *   **The Battery Issue:** You noted that when the battery dies, it feels like *forgetting*, not like losing a book. This is a crucial phenomenological point (referring to your subjective experience). If the phone were merely a tool (like a library book), losing access would feel like an external obstruction. Because it feels like internal amnesia, it suggests your cognitive system has integrated the phone. In EMT terms, the phone is **constitutive** of your memory, not just **causally linked** to it.

  **Case 2: The Lab Partner**
  *   **Verdict:** This fits a neighbouring concept called **Distributed Cognition**.
  *   **Analysis:** While EMT usually focuses on an individual extending their mind into tools, Distributed Cognition (championed by Edwin Hutchins) looks at how cognitive systems span across groups of people. In your practical, the "knowledge of how to complete the experiment" does not exist in your head, nor in your partner's head. It exists in the *system* of the pair.
  *   **Distinction:** If you separated, the knowledge would cease to function. This is different from the phone because the external resource is another conscious agent. However, the logic is similar: the boundary of the 'thinker' is the pair, not the individual.

  **Case 3: The Calculator**
  *   **Verdict:** This is a borderline case, often debated as **Extended Cognition** (processing) rather than Extended Memory.
  *   **Analysis:** Here, you are not storing a fact; you are offloading a *process*. You set the goals (the structure), but the arithmetic is done externally.
  *   **Nuance:** Some philosophers argue this is merely using a tool, like using a hammer to drive a nail. However, an EMT proponent would argue that if you trust the calculator's output without re-calculating it in your head, you are treating the calculator as a module of your own arithmetic processing. The fact that you cannot report the intermediate numbers suggests they never entered your biological working memory; they existed only in the extended system.

  ### 3. Neighbouring Ideas

  To be precise in your project, you should distinguish EMT from these related concepts:

  1.  **Internalism:** The traditional view. It argues that even if you use a phone, the *knowing* happens when you read the screen and form a belief in your brain. The phone is just a cause of the belief, not part of the belief itself.
  2.  **Embodied Cognition:** This argues that the body itself (not just the brain) shapes thinking. For example, gesturing while speaking helps you find words. This is related to EMT but focuses on the biological body rather than external tools.
  3.  **The Coupling-Constitution Fallacy:** This is the main objection to EMT. Critics argue that just because two things are coupled (working together), it does not mean they constitute (make up) the same thing. For example, a pilot is coupled to a plane, but the plane is not part of the pilot's mind. You must be prepared to defend against this objection.

  ### 4. Drawing the Boundaries: When is it Part of the Mind?

  You asked where we draw the line between being helped by a tool and the tool counting as part of the thinking. Clark and Chalmers propose three criteria for an external resource to count as part of the mind. You can use these to test your cases:

  1.  **Reliability:** Is the tool generally trustworthy? (Your phone is; a random website might not be).
  2.  **Accessibility:** Is it easily available when needed? (Your phone is in your pocket; a library book is not).
  3.  **Endorsement:** Have you consciously accepted this information before? (You saved the bus route; you haven't necessarily 'saved' every fact you read online).

  **Applying the Boundaries to your Variations:**

  *   **When the phone is offline:** The extension snaps. The system fails the 'Accessibility' and 'Reliability' criteria. Under EMT, you have temporarily suffered a cognitive impairment. You are no longer an 'extended mind' in that moment; you are a biological mind with a missing limb.
  *   **When you double-check:** This is vital. If you look at the phone and think, "I wonder if this is right, let me check a textbook," you are treating the phone as **testimony** (external information), not **memory** (internal information). Memory is usually trusted automatically; testimony requires verification. If you verify, you are pushing the phone back towards being a mere tool.
  *   **When work is split (Lab Partner):** The boundary here is social. For the partner to count as part of *your* mind, the trust must be near-total. If you constantly question their steps, you are two collaborators. If you move in sync without speaking, relying on their knowledge as if it were your own, you function as a single distributed cognitive system.

  ### 5. A Proposed Definition for Your Project

  Since you are writing an enrichment project, you may wish to synthesise this into a clear definition. I propose the following:

  > **Cognitive Extension** occurs when an external resource (digital, physical, or social) is integrated into a problem-solving loop so deeply that the user relies on it with the same automatic trust as biological memory or processing. The resource ceases to be an object of scrutiny and becomes a transparent medium through which thinking happens.

  **How this handles your cases:**
  *   **Phone:** It is transparent. You look *through* the screen to the information, not *at* the screen as an object.
  *   **Partner:** The collaboration is transparent. You do not think "my partner knows this"; you simply act on the knowledge.
  *   **Calculator:** The arithmetic is transparent. You focus on the maths problem, not the button presses.

  ### Summary for your Project

  You have identified that cognition is not a solitary event inside the skull, but a system that often includes the environment.
  *   **The Label:** The Extended Mind Thesis (and Distributed Cognition for the partner).
  *   **The Test:** Do you trust the resource automatically (like memory) or do you verify it (like testimony)?
  *   **The Boundary:** When the resource becomes unreliable or requires verification, it reverts from being part of the mind to being a mere tool.

  This framework should give you the precise vocabulary you need to elevate your project from a discussion of "study tips" to a philosophical analysis of what it means to know something. Good luck with your work.
