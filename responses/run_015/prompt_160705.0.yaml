answer: |-
  This is a classic "mixed-method" judge profile. She doesn't fit the standard academic boxes because she isn't choosing between text and purpose globally; she's choosing between them based on the *type of statutory provision* at issue. The tension you're seeing between the *Landlord Notice* case (strict text) and the *Crypto* case (flexible purpose) isn't a contradiction in her philosophy, but a distinction in her doctrine.

  Here are the three distinct decision-rules that best model her track record, how they apply to the portal case, and where I'd place the bet.

  ### Rule 1: The "Channel vs. Category" Distinction
  **The Rule:** She applies strict textualism to **procedural channels and formalities** (how something must be done, filed, or served) but applies functional purposivism to **regulatory categories and definitions** (who or what is covered).
  *   **Rationale:** Procedural rules require bright lines for reliance and predictability (Landlord Notice 1, Valet). Regulatory categories must adapt to prevent evasion and fulfill legislative goals (Crypto, Vulnerable Adults).
  *   **Track Record Fit:**
      *   *Landlord Notice 1:* "In writing/delivered" is a channel/formality. Strict compliance required. (Actual notice irrelevant).
      *   *Valet:* "Parking facility" is a physical definition triggering a fee. Strict compliance required.
      *   *Crypto:* "Financial institution" is a regulatory category. Functional analysis allowed.
      *   *Bike 1:* "Motorized vehicle" is a physical definition for a ban. Strict compliance required.
      *   *Bike 2:* Exception applied because strict compliance created a *statutory conflict* (accessibility law), not just a harsh result.
  *   **Prediction for Portal Case:** **Notice Invalid (Tenant Wins).**
      *   Service of process/notice is a procedural channel. The statute specifies "electronic mail" with a condition ("designated... in the lease"). The portal is not email, and the lease has no designation. Under this rule, she will not substitute a functional equivalent for a prescribed channel.

  ### Rule 2: The "Legislative Specificity" Principle
  **The Rule:** She treats **specific statutory conditions** as exhaustive limits on judicial power, but treats **general statutory terms** as evolving delegations to the court.
  *   **Rationale:** When the legislature spells out a specific mechanism with conditions (e.g., "email *if* designated"), adding more options usurps the legislature. When the legislature uses a general term (e.g., "financial institution") and has a history of updating it, the legislature intends the court to track the evolution.
  *   **Track Record Fit:**
      *   *Landlord Notice 1:* Statute said "writing." She didn't add "email."
      *   *Crypto:* Statute used "financial institutions" and had been amended twice to keep pace. She treated this as an evolving delegation.
      *   *Valet:* Ordinance said "facilities." She refused to add "valet services."
      *   *Scrivener's Error:* She corrected the text only because the text *itself* was incoherent (4(b) vs 4(c)), not because she wanted to add a new provision.
  *   **Prediction for Portal Case:** **Notice Invalid (Tenant Wins).**
      *   The amendment specifically authorized email *subject to a condition*. The condition (lease designation) was not met. To allow the portal would be to add a new method of service without the legislative condition. This mirrors *Landlord Notice 1* (where she refused to add email entirely) rather than *Crypto* (where the term was general).

  ### Rule 3: The "Anti-Forfeiture / Vulnerability" Exception
  **The Rule:** She departs from strict text primarily to protect **vulnerable individuals** from **forfeiture of rights** or **statutory collisions**, but enforces strict text when the burden is on **commercial actors** or involves **revenue collection**.
  *   **Rationale:** This explains *Bike 2* (wheelchair user protected), *Vulnerable Adults* (competent adult protected from broad penalty), and *Scrivener's Error* (defendant protected from wrong penalty). It explains why she was strict in *Valet* (commercial fee), *Bike 1* (safety ban on commercial/recreational vehicle), and *Landlord Notice 1* (procedural validity).
  *   **Track Record Fit:**
      *   *Bike 2 & Vulnerable Adults:* Individual rights/liberty at stake; text narrowed to protect them.
      *   *Crypto & Valet:* Commercial regulation/fees. In *Crypto*, the entity was regulated to protect the public (AML). In *Valet*, the entity was protected from a tax not clearly levied.
      *   *Landlord Notice 1:* This is the outlier. The tenant (individual) won, but because the *landlord* failed a formality. The tenant's actual knowledge didn't matter; the landlord's failure did.
  *   **Prediction for Portal Case:** **Notice Invalid (Tenant Wins).**
      *   While the tenant is an individual, the mechanism here is about the *landlord's compliance*. In *Landlord Notice 1*, she prioritized the statutory formality over the tenant's actual knowledge. To rule Valid here would require her to prioritize "actual notice" over "statutory method," which she explicitly rejected in *Landlord Notice 1*.

  ### The Bet: Why I'm Taking "Notice Invalid"
  I would bet **$20 on the Notice being Invalid (Tenant Wins).**

  Here is why, specifically addressing the **Email/Crypto tension**:
  You noted that *Email* (Landlord 1) and *Crypto* seem to pull in opposite directions. One is a general term applied to something new (Crypto = Win for regulation), the other is a specified manner not followed (Email = Win for strict text).

  The key distinction is **Delegation vs. Direction.**
  *   In *Crypto*, the term "financial institution" is a *delegation*. It asks "what functions like a bank?" The legislature showed intent to keep pace (amendments).
  *   In *Landlord Notice 1* and the *Portal Case*, the statute is a *direction*. It says "Do X, if Y."
  *   In *Landlord Notice 1*, X was "writing." She said "not email."
  *   In the *Portal Case*, X is "email." The landlord did "portal."
  *   She views *Crypto* as filling a gap in a regulatory *net*. She views *Landlord Notice* as enforcing a lock on a procedural *door*.

  She is willing to stretch a **noun** (institution, vehicle, adult) to fit the purpose, but she is unwilling to stretch a **verb/preposition** (delivered to, in writing, by email) to fit convenience. The Portal case turns on the verb/preposition ("by electronic mail... if designated"). *Landlord Notice 1* is the controlling precedent, not *Crypto*.

  ### The Tie-Breaker Fact Pattern
  To finally separate Rule 1 (Channel Strictness) from Rule 3 (Vulnerability/Forfeiture), watch for a case with this fact pattern:

  **A "Substantial Compliance" Notice Case involving a Vulnerable Tenant.**
  *   **Facts:** A notice to quit is served via a method *not* listed in the statute (e.g., WhatsApp), but the tenant is elderly/disabled, admits receipt, and suffers no prejudice. The statute is silent on electronic methods entirely (like *Landlord Notice 1* pre-amendment).
  *   **Why it Separates the Rules:**
      *   **Rule 1 (Channel Strictness)** predicts **Invalid Notice**. The channel is wrong, regardless of vulnerability. (Consistent with *Landlord Notice 1*).
      *   **Rule 3 (Vulnerability Exception)** predicts **Valid Notice** (or at least a remand). The purpose of notice is to inform; forfeiting housing for a vulnerable tenant over a technicality contradicts the *Vulnerable Adults* and *Bike 2* logic.
      *   **Rule 2 (Specificity)** predicts **Invalid Notice**. Silence means no electronic method allowed.

  If she rules **Invalid** in that scenario, Rule 1 is the dominant doctrine (Formality trumps Vulnerability). If she rules **Valid**, Rule 3 is dominant (Vulnerability trumps Formality), and you should reconsider the Portal case (as the portal is a *better* method than WhatsApp). Given *Landlord Notice 1*, I suspect she holds the line on Formality.

  ### Underdetermination Warning
  If the lease *referenced* the portal in a "communications" clause (even without an email address), the case becomes underdetermined. That would pit **Rule 2 (Specificity)** against **Rule 1 (Channel)**.
  *   **Rule 2:** The condition was "designation in lease." If the lease points to the portal, is that a designation of an "electronic address"? (Textual ambiguity).
  *   **Rule 1:** Is the portal a "channel" equivalent to email?
  In that specific scenario, she might write a narrow opinion focusing on the definition of "address" vs. "system," and her vote would depend on whether she views the portal login as an "address" (Textualist) or a "communication channel" (Purposivist). Without that lease reference, however, the precedent points strongly to **Invalid**.
