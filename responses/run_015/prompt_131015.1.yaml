      If I recommend "Approve-with-conditions," I am essentially siding with the Funder on the *labeling* but siding with the PI on the *grant continuation*.
      The "Losing Side" in terms of the *principle* is the PI. The "Losing Side" in terms of the *outcome* is... well, everyone compromises.
      Let's interpret "losing side" as the position that does not get fully adopted. The PI's "Keep-as-is" is not fully adopted. The Funder's "Relabel or Pull" is partially adopted (Relabel via conditions, no Pull).
      I will treat the PI's philosophical stance as the "losing side" regarding the *nomenclature rule*, because we are enforcing external chemical truth for safety.

