prompt: |-
  I sit on our uni's research integrity committee and we've got a weird case that feels like a Twin Earth situation applied to institutional knowledge. There's a decade-long study running in a sealed biosphere dome where participants developed their own chemical taxonomy — they call the clear liquid 'water' but it's actualy H2O2-based, and they call crystals 'salt' but it's a different ionic compound. The PI argues that for the study's mental-state recordings and internal coherence, the meaning of these terms is fixed by usage inside the dome (like twater in the classic case), not by outside chemistry. Our funding partner says we should either force them to relabel all data to match standard chemistry or pull the grant. I need a short memo for thursday's vote reccomending approve-with-conditions, reject, or keep-as-is, with reasoning that takes the PI's point seriously but lands on something concrete the board can act on. Don't need citations or a reading list — just the argument and the bottom line, including the strongest reason the losing side has.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Research Integrity Committee.
      *   **Task:** Write a short memo for an upcoming vote (Thursday).
      *   **Scenario:** A decade-long study in a sealed biosphere dome. Participants developed a unique chemical taxonomy (calling H2O2-based liquid "water" and a different ionic compound "salt").
      *   **Conflict:**
          *   *PI's Argument:* Internal coherence/mental-state recording matters. Meaning is fixed by usage inside the dome (Twin Earth semantics).
          *   *Funding Partner's Argument:* Data must match standard chemistry (external reference) or the grant gets pulled.
      *   **Recommendation Options:** Approve-with-conditions, Reject, or Keep-as-is.
      *   **Requirements:**
          *   Take the PI's point seriously.
          *   Land on something concrete/actionable.
          *   Include the strongest reason the losing side has.
          *   No citations or reading list.
          *   Tone: Professional, decisive, ethical, practical.

  2.  **Deconstruct the Ethical/Epistemic Problem:**
      *   *The Twin Earth Analogy:* Putnam's Twin Earth thought experiment suggests that meaning isn't just in the head; it depends on the external world (H2O vs. XYZ). Here, the PI is arguing for a *sociological* or *phenomenological* definition of meaning (internal usage) vs. the Funder's *realist* definition (chemical composition).
      *   *Research Integrity:* The core issue is reproducibility, safety, and clarity. If future researchers read "water" and assume H2O, but it's H2O2, that's dangerous and scientifically invalid for external application.
      *   *Subject Integrity:* The participants' lived experience and psychological data are valid *as psychological data*. Changing their language retroactively might invalidate the mental-state recordings the PI cares about.
      *   *The Compromise:* We need to preserve the internal validity (the participants' perspective) while ensuring external validity (safety and scientific communication).

  3.  **Determine the Recommendation:**
      *   *Keep-as-is:* Too risky. Future researchers could be harmed or misled. Violates standard scientific communication norms.
      *   *Reject:* Too harsh. Ten years of data is lost. The PI's point about internal coherence has merit regarding the *psychological* aspect of the study.
      *   *Approve-with-conditions:* The Goldilocks solution. Allow the data to stand *but* mandate clear metadata/labeling that distinguishes internal nomenclature from external chemical reality. This satisfies safety/integrity without gaslighting the participants or destroying the dataset.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation immediately.
      *   **The Core Argument (The "Why"):**
          *   Acknowledge the PI's philosophical point (internal meaning matters for psychological data).
          *   Acknowledge the Funder's practical point (external reference matters for safety and replication).
          *   Synthesize: Science requires shared ontology for safety, but social science requires respecting subject ontology for validity.
      *   **The Conditions:** What exactly needs to happen?
          *   Dual-labeling (Internal Term [External Chemical Formula]).
          *   Glossary/Metadata.
          *   Safety warnings.
      *   **The Losing Side's Strongest Point:** Acknowledge why this isn't perfect. (For the PI: It imposes an external frame on internal experience. For the Funder: It leaves "incorrect" terms in the record). *Decision: Focus on the PI's loss, as the recommendation leans towards modification which the Funder wants, but the reasoning protects the PI's data value.* Actually, the prompt asks for the strongest reason the *losing side* has. If I recommend Approve-with-conditions, who is the "losing" side? The Funder wanted relabeling (which is close to conditions) or pull grant. The PI wanted keep-as-is. So the PI is the "losing" side in terms of pure ideology, but winning on data preservation. Or, if I frame it as "Reject the status quo," the PI loses. Let's frame the recommendation as "Approve with Conditions," which means the "Keep-as-is" position (PI's ideal) is rejected. So I should highlight the PI's concern about imposing external categories on internal states.
      *   **Closing:** Clear call to action for the vote.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is H2O2 actually safe to call water? No, hydrogen peroxide is reactive. This is a safety hazard. The memo *must* emphasize safety.
      *   *Critique:* Is this actually Twin Earth? In Twin Earth, the substance *looks* like water but isn't. Here, the participants *call* it water. The PI argues meaning is use. The counter is that in science, reference fixes meaning.
      *   *Tone Check:* Needs to be authoritative but fair.
      *   *Constraint Check:* "Short memo." "No citations." "Strongest reason the losing side has."

  6.  **Final Polish:**
      *   Make sure the distinction between *phenomenological data* (what they felt) and *material data* (what the substance is) is clear.
      *   Ensure the conditions are actionable (e.g., "metadata tags," "glossary").
      *   Identify the losing side clearly. If I recommend "Approve with Conditions," the "Keep-as-is" (PI's pure stance) is the losing position. The strongest argument for them is that external labeling contaminates the psychological validity of the mental-state recordings.

  7.  **Final Output Generation:** (Proceeding to draft based on these thoughts.)
      *   *Subject:* Recommendation re: Biosphere Study Nomenclature Dispute.
      *   *Rec:* Approve-with-conditions.
      *   *Reasoning:* Bridge the gap between internal validity and external safety.
      *   *Losing Side:* The PI's purist semantic argument (imposing external reality distorts internal data).

  8.  **Wait, one nuance:** The Funding Partner said "Relabel... or pull grant." If I recommend "Approve-with-conditions" (which involves relabeling via metadata), the Funder essentially wins their practical demand, but the PI saves the grant. The "Losing Side" in the *philosophical* debate is the PI (because we are admitting external chemistry dictates the label). The "Losing Side" in the *negotiation* is the Funder (because they don't get to pull the grant). The prompt asks for "the strongest reason the losing side has." Usually, in a committee vote, there's a motion. If the motion is "Approve with Conditions," the "Reject/Keep-as-is" faction loses. Let's assume the conflict is between "Change the data" (Funder) and "Don't change the data" (PI). My recommendation is "Annotate the data." This splits the difference. I will frame the "Losing Side" as the argument for *pure* internalism (PI's original stance) because we are overriding it for safety.

      *Revised Plan:*
