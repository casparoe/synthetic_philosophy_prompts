      *   Marxist: True (Historical necessity).
      *   Revisionist: True (Logical necessity of ideology).
      *   So they agree it is **True**. But they disagree on the *mechanism*. I need to make sure this distinction is clear so it doesn't look like they agree on the *theory*, just the *outcome*.

      *(Refining the Disagreement Table)*: Ensure the "Wording each would endorse" is distinct.
      *   Marxist: "The political forms were functional adaptations to class objectives."
      *   Revisionist: "The political forms were discursive inventions that created new social identities."

      *(Refining Evidence)*:
      *   Crux 1 Evidence: Biographical data of deputies (Cobb, Godineau).
      *   Crux 2 Evidence: Timeline of repression vs. Timeline of military invasions.

      Let's assemble the document.

