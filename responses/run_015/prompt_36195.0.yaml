answer: |-
  # DRAFT JOINT STATEMENT OF PRINCIPLES AND DISAGREEMENTS
  **Subject:** The Causality and Trajectory of the French Revolution (1789–1799)
  **Parties:** [Marxist Historian] (hereafter "M") and [Revisionist Historian] (hereafter "R")

  ## I. AGREED CHRONOLOGY AND EMPIRICAL BASELINE
  *Both parties affirm the following sequence of events and structural conditions as the non-negotiable factual substrate for further analysis. Disagreement exists solely regarding causality and significance, not occurrence.*

  1.  **The Fiscal Impasse (1787–1789):** The French monarchy faced insolvency due to regressive taxation structures and war debt (specifically American intervention). Attempts to tax the nobility were blocked by the *Parlements*, necessitating the convocation of the Estates-General.
  2.  **The Legal Revolution (1789):** The National Assembly abolished feudal privileges (Night of August 4th) and issued the Declaration of the Rights of Man and of the Citizen. Seigniorial dues were abolished or commuted, dismantling the legal framework of the Old Regime.
  3.  **The Constitutional Monarchy (1791):** A constitution was ratified limiting royal power. This regime collapsed following the King's flight to Varennes and the outbreak of international war.
  4.  **The War (1792–1799):** France declared war on Austria and Prussia in April 1792. This expanded into a general European coalition. Military necessity coincided with internal insurrection (Vendée).
  5.  **The Terror (1793–1794):** The Committee of Public Safety instituted revolutionary tribunals, price controls (*Maximum*), and mass executions (Law of Suspects). Approximately 16,000–17,000 official executions occurred, with significantly higher deaths in civil war zones.
  6.  **Thermidor and the Directory (1794–1799):** The fall of Robespierre ended the Terror. The Directory struggled with instability, inflation, and royalist/Jacobin threats, ending with the coup of 18 Brumaire.

  ---

  ## II. TABLE OF FUNDAMENTAL DISAGREEMENTS
  *The parties refuse to synthesize these positions into a compromise. Each claims explanatory primacy for their respective variables.*

  | Crux | The Marxist Position (M) | The Revisionist Position (R) |
  | :--- | :--- | :--- |
  | **1. The Engine of Change: Class vs. Discourse** | The Revolution was a **bourgeois revolution**. The specific political forms (constitutional monarchy → republic → Terror) were functional adaptations required to break aristocratic property relations and secure capitalist market conditions. The "bourgeoisie" is an objective economic category that seized power. | The Revolution was a **political revolution**. The "bourgeoisie" is a retroactive label applied to a heterogeneous group united by political culture, not economic interest. Political forms were driven by the logic of representation and the crisis of legitimacy, not economic determinism. |
  | **2. The Terror: Necessity vs. Ideology** | The Terror was a **contingent but necessary response** to objective material threats (foreign invasion, civil war, hyperinflation). It was a defensive emergency measure, not an ideal system. Without the war, the Terror does not happen in that form. | The Terror was **latent in the revolutionary ideology** from 1789. The concept of the "General Will" and the demand for social unanimity made violence inevitable. The war exacerbated it, but the logic of purging "enemies of the people" was intrinsic to the new political culture. |

  ---

  ## III. EVIDENTIARY CRUXES AND PREDICTIONS
  *To prevent talking past one another, the parties agree that the following specific datasets and comparisons bear directly on the disagreements above. Each party states in advance what they expect this evidence to demonstrate.*

  ### Crux A: The Social Composition of the Revolutionaries
  **Relevance:** Bears on Disagreement I (Class vs. Discourse). If the leaders of the Third Estate were economically distinct from the Nobility and aligned with capitalist interests, M is strengthened. If they were economically integrated with the Nobility and motivated by status/ideology, R is strengthened.

  *   **Agreed Evidence:** Biographical data of the deputies of the National Assembly (1789) and the Convention (1792), specifically regarding:
      1.  Source of wealth (land vs. trade vs. office).
      2.  Relationship to seigneurial dues (were they collectors or payers?).
      3.  Investment in colonial trade/slavery.
  *   **M's Prediction:** Data will show a clear divergence. The Third Estate leadership will be disproportionately engaged in capitalist enterprise (trade, law, finance) and hostile to feudal rent extraction, distinguishing them materially from the Nobility.
  *   **R's Prediction:** Data will show significant overlap. Many "Third Estate" deputies will be rentiers, office-holders, or landowners indistinguishable from liberal nobles. The split will correlate with *political* affiliation (patriot vs. royalist) rather than *economic* class.

  ### Crux B: The Correlation of Repression and Military Threat
  **Relevance:** Bears on Disagreement II (Necessity vs. Ideology). If repression spikes only when invasion/revolt spikes, M is strengthened. If repression continues or intensifies during lulls in fighting to target ideological deviance, R is strengthened.

  *   **Agreed Evidence:** Monthly execution rates in Paris and the provinces plotted against:
      1.  Frontline military movements (distance of enemy troops from Paris).
      2.  Internal insurrection intensity (Vendée, Federalist revolts).
      3.  Legislative debates regarding "virtue" and "conspiracy."
  *   **M's Prediction:** High correlation. Peaks in executions will lag slightly behind peaks in military threat and food scarcity. The Law of Suspects will be applied primarily to those materially aiding the enemy or hoarding goods.
  *   **R's Prediction:** Low correlation. Executions will track with ideological purification campaigns (e.g., de-Christianization, factional purges of Hébertists/Dantonists) even when military threats are stable or receding. The definition of "enemy" will expand beyond military threat to moral failing.

  ### Crux C: The Comparative Control (1848)
  **Relevance:** Bears on Disagreement II. 1848 involved a republic and social unrest but no sustained Terror comparable to 1793–94.
  *   **Agreed Evidence:** Comparison of the 1848 Second Republic's response to insurrection vs. 1793 Committee of Public Safety.
  *   **M's Prediction:** 1848 lacked the *international coalition* pressure and the *feudal counter-revolution* scale of 1793. The difference proves the Terror was situational, not ideological.
  *   **R's Prediction:** 1848 lacked the *totalizing political language* of 1789. The difference proves the Terror was a product of the specific revolutionary discourse (the "people" as a singular body), not just military circumstance.

  ---

  ## IV. RESOLUTION ON THE AXIOM: "REVOLUTIONS DEVOUR THEIR CHILDREN"
  *The parties have debated the applicability of this aphorism to the fate of Danton, Robespierre, and subsequent revolutionary elites.*

  **Verdict:** **TRUE** (Empirically Agreed)
  **Mechanism:** **CONTESTED** (Theoretically Disagreed)

  **Joint Statement on the Axiom:**
  Both parties agree the statement is **empirically true**: key revolutionary architects were eliminated by the regimes they helped create. However, they disagree on the causal mechanism, which prevents a unified theoretical conclusion.

  *   **M's Interpretation (True via Class Dynamics):** The revolution devours its children because the class struggle intensifies. Danton and Robespierre were removed because their specific policies no longer aligned with the shifting balance of class forces required to defend the new property relations. It is a tragic but functional sorting process.
  *   **R's Interpretation (True via Political Logic):** The revolution devours its children because the ideology demands unanimity. Once the external monarch is removed, the "enemy" must be internalized. Any deviation from the "General Will" becomes treason. It is a structural feature of revolutionary sovereignty, not just class friction.

  **Agreement for Collaboration:**
  We accept the aphorism as a valid description of the *outcome*, but we will not co-sign a single explanation for the *cause*. The joint work will present both causal models side-by-side to determine which better predicts the timing and targeting of the purges (see Crux B).

  ---

  **Signed,**

  _________________________ (Marxist Historian)
  _________________________ (Revisionist Historian)
  _________________________ (Mediator/Editor)
