answer: |-
  This is a genuine philosophical impasse, and your frustration is well-founded. After a year of circling this, you have likely exhausted the standard moves (the "deep morality" vs. "law of war" distinction, the "excuse" vs. "justification" maneuver, the "conscript" edge-cases). The reason the debate feels stuck is not because the arguments are exhausted, but because the interlocutors are playing different games with the same pieces.

  Here is my brainstorming on what might be driving the stall, followed by my committed diagnosis, the argument for it, and what actual progress would look like.

  ### Brainstorming the Undercurrents

  You offered four candidate explanations. Let's weigh them quickly to clear the deck:

  1.  **Institutional vs. Individual (Your Guess):** This is the standard "Henry Shue" reconciliation. It suggests Traditionalists talk about the *rules of the practice* and Revisionists talk about *fundamental morality*.
      *   *Verdict:* This is the surface structure, but it fails to explain the *heat*. If it were just a level-distinction, they would agree to disagree. They don't. Revisionists (like McMahan) explicitly argue the *laws* should change to match deep morality. Traditionalists argue the *deep morality* of war is constituted by the convention. They are fighting over which level is sovereign.
  2.  **Different Cases (Conscript vs. Volunteer):**
      *   *Verdict:* Unlikely. Both sides have adjusted their theories to handle epistemic limitations. McMahan grants that ignorant unjust combatants may be *excused* even if liable; Walzer admits that in "manifestly unjust" wars, soldiers lose their immunity. They are judging the *same* central cases (the standard uniformed soldier in a non-obvious war) differently.
  3.  **Collective Action Responsibility:**
      *   *Verdict:* Significant, but secondary. Revisionists generally accept that individuals bear responsibility for collective harms if they contribute voluntarily. Traditionalists lean on the state's agency to shield the individual. But this is a premise, not the engine of the stalemate.
  4.  **Scalar Liability (Structural):**
      *   *Verdict:* This is the most philosophically promising avenue, but it describes a *solution*, not the cause of the block. The block exists because both sides treat liability as binary (you are a combatant or you aren't; you are liable or you aren't).

  ### The Diagnosis: A Meta-Normative Clash (Constructivism vs. Realism)

  I am committing to a diagnosis that refines your "Institutional vs. Individual" guess. The stalemate is not merely about levels of analysis; it is a **meta-normative disagreement about the source of moral force in war.**

  *   **The Revisionists are Moral Realists about War:** They believe moral facts about liability exist independently of human conventions. A soldier is liable because of what they *are* (an agent of an unjust threat). The "War Convention" is at best a heuristic to track these facts, and at worst a moral error.
  *   **The Traditionalists are Constructivists about War:** They believe the moral permissions and liabilities of war are *constituted* by the convention itself. A soldier is liable because they occupy a *status* recognized by the practice. Without the convention, the concept of "combatant liability" doesn't exist in the same way; there is just murder or self-defense.

  **Why this causes a stalemate:**
  When a Revisionist says, "Unjust combatants are liable," they are making an ontological claim about moral reality. When a Traditionalist says, "Combatants are equal," they are making a functional claim about the conditions necessary for a regulated practice to exist.

  The Revisionist hears the Traditionalist and thinks: "You are prioritizing bureaucratic convenience over human life and moral truth."
  The Traditionalist hears the Revisionist and thinks: "You are importing peacetime morality into a sphere where it cannot function, which will lead to *more* death and chaos."

  They talk past each other because one side is arguing about **Truth** (does this map to moral reality?) and the other is arguing about **Function** (does this sustain a workable norm?). Because neither side accepts the other's meta-normative priority, no first-order argument lands. McMahan can show that asymmetry is *truer*, and Walzerians can show that symmetry is *more stable*, and neither moves the needle because Truth and Stability are being weighed on different scales.

  ### The Argument from the Text

  Look at how the key figures actually argue.

  **Revisionism (McMahan, Rodin):**
  McMahan's core move in *Killing in War* is to strip away the "legalistic" layer to reveal the "underlying morality." He treats the Law of War as a flawed attempt to codify independent moral truths. When he discusses liability, he grounds it in **responsibility for wrongful harm**. This is a naturalist, realist grounding. It relies on the idea that there is a fact of the matter about whether a threat is unjust, regardless of what the soldiers believe or what the Geneva Conventions say. If the Revisionists were merely making an institutional claim, they would accept symmetric laws as a "necessary evil." Instead, they argue for *asymmetric laws* where feasible. This proves they believe the moral truth *should* dictate the institution.

  **Traditionalism (Walzer, Shue - later work):**
  Walzer in *Just and Unjust Wars* does not simply say "we can't know the truth." He argues that the **War Convention** creates a moral community of soldiers. By exchanging the right to kill for the status of being a legitimate target, soldiers enter a reciprocal relationship. This is constructivist: the mutual liability *creates* the permission to fight. If you remove the symmetry, you break the reciprocity, and the convention collapses. Walzer isn't saying "Asymmetry is true but impractical." He is saying "Symmetry is the *only thing that makes war morally distinct from massacre*."

  **The Friction:**
  The Revisionist asks: "Is the soldier objectively dangerous to justice?"
  The Traditionalist asks: "Is the soldier participating in the reciprocal practice of war?"
  These are not competing answers to the same question. They are answers to different questions. The debate is stuck because both sides insist they are answering the *same* question ("May this soldier be killed?").

  ### What Counts as Progress?

  Given this diagnosis, "winning" the argument is impossible because it's a clash of foundational commitments. Progress requires **reframing the question from "Who is right?" to "What is the trade-off?"**

  Progress would look like a **Formal Model of Normative Trade-offs.**

  We need to stop treating "Moral Equality" as a binary switch and start treating it as a variable in a function that balances **Moral Accuracy** (Revisionist value) against **Humanitarian Stability** (Traditionalist value).

  1.  **A Distinction:** We need to formally distinguish **Ontological Liability** (am I actually responsible for unjust harm?) from **Conventional Immunity** (does the rule protect me to maintain the system?). Progress happens when we admit that a soldier can be *Ontologically Liable* but *Conventionally Immune*.
      *   *Current state:* Revisionists hate this (it feels like a lie). Traditionalists hate this (it feels like moral relativism).
      *   *Progress:* Accepting this distinction as a tragic necessity of non-ideal theory, not a confusion.

  2.  **A Finding:** Empirical work on the **Epistemic Threshold.** The Traditionalist argument relies on the claim that soldiers *cannot* reliably judge *jus ad bellum*. The Revisionist argument relies on the claim that they *can* (or that the risk of error is worth it).
      *   *Progress:* Rigorous political science/psychological data on soldier epistemic access. If we find that soldiers in modern democracies *can* reliably distinguish unjust wars (e.g., via information access), the Traditionalist empirical premise collapses. If we find that asymmetric rules lead to higher civilian casualties (because "just" sides feel unconstrained), the Revisionist functional premise collapses.

  3.  **A Reframing:** Adopt the **Scalar Liability** model you mentioned. If liability tracks *expected contribution to unjust threat*, we can model where the Traditionalist rule (binary immunity) diverges from the Revisionist truth (scalar liability).
      *   *Progress:* A map showing exactly *where* the convention diverges from morality. Instead of saying "MEC is true" or "MEC is false," we say "MEC is a 90% accurate heuristic for liability in Context X, but only 40% in Context Y." This moves the debate from metaphysics to policy optimization.

  ### Confidence and Uncertainty

  **Confidence Level:** 85%
  I am highly confident that the meta-normative clash (Realism vs. Constructivism) is the engine of the stalemate. It explains why the "Institutional/Individual" compromise hasn't worked: because Revisionists don't view the Institution as morally sovereign, and Traditionalists don't view the Individual morality as accessible enough to govern the Institution.

  **The Claim I Am Least Sure Of:**
  I am least sure of the claim that **"Empirical findings on soldier epistemic access could resolve the debate."**

  **Why this might be wrong:**
  I am assuming that the Traditionalist reliance on "epistemic uncertainty" is an empirical claim. It might actually be a **conceptual** claim. Even if soldiers *could* know the war is unjust (e.g., via perfect intelligence), a Traditionalist might argue they *should not* act on it because doing so undermines the civil-military contract. If the "uncertainty" is a normative feature of the soldier's role rather than an empirical limitation of their brain, then better intelligence won't solve the debate.

  **What would change my mind:**
  If a prominent Traditionalist argued: "If soldiers had perfect knowledge of *jus ad bellum*, we should adopt asymmetric laws." That would prove the disagreement is purely empirical (about knowledge), not meta-normative (about the source of value). Conversely, if a prominent Revisionist argued: "Even if asymmetric laws caused slightly more chaos, we must adopt them because moral truth trumps stability," that would confirm the meta-normative clash is irreconcilable and progress is limited to mapping the divergence, not resolving it. Given the current literature, I suspect the latter is closer to the truth, which is why I remain pessimistic about a clean resolution.
