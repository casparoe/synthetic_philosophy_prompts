answer: |-
  You have put your finger on the central tension in intellectual property theory. Legal scholars call this the "Grand Asymmetry," and your intuition about what it presupposes is remarkably sharp. It is not just a quirk of statute; it reflects two fundamentally different ontologies of human creativity.

  Here is a breakdown of what that split assumes, why the administrative constraints matter, and what your "simultaneous invention" proposal would actually do to the concept of a patent.

  ### 1. The Ontological Split: Discovery vs. Authorship

  You asked if patent law treats an invention as something "out there to be found," while copyright treats a work as "authored." **Yes, essentially.**

  **Copyright presupposes infinite abundance.**
  Copyright law is built on the Romantic theory of authorship. It assumes that expression is tied to the specific mind of the creator. Even if two people write the same sonnet, the law posits that they are *different works* because they emerged from different subjective experiences. The "scarce" thing in copyright is not the pattern of words or notes; the scarce thing is the **labor and personality** invested in fixing that pattern. Therefore, if you didn't steal the labor (copying), you haven't harmed the interest the law protects.

  **Patent presupposes finite solutions.**
  Patent law is utilitarian and technocratic. It treats technical problems as having a limited set of viable solutions. If you and I both invent a specific gear mechanism to solve a torque problem, the law assumes we have converged on the same **functional truth**. In patent law, the "scarce" thing is the **right to exploit the function**.
  *   **The Assumption:** Inventions are closer to "discoveries" of natural relationships than "creations" ex nihilo. While you cannot patent a law of nature, you can patent the application of it. The law assumes that once a solution is revealed, it becomes part of the public technical landscape. Allowing a second independent inventor to practice it would undermine the "quid pro quo" (disclosure for monopoly) granted to the first filer.

  **The Implication:** Copyright protects the **act of writing**; Patent protects the **idea written down.**

  ### 2. The Administrative Reality: Notice and Verification

  You also asked if this is just about what is cheap to police. This is the "Legal Realist" counter-argument, and it holds significant weight.

  **The Cost of Verification**
  In copyright, copying is the *sine qua non* of infringement. To prove infringement, a plaintiff must show (1) ownership and (2) copying (often proven by access + substantial similarity). If the defendant proves independent creation, the chain of causality is broken.
  In patent, the claim is the boundary. The Patent Office has already expended resources to verify that the claim is novel and non-obvious. If independent invention were a defense, every patent lawsuit would turn into a forensic audit of the defendant's R&D logs.
  *   **The Administrative Assumption:** Patent law prioritizes **certainty of title** over **fairness to the inventor**. It is cheaper to enforce a bright-line rule ("If it falls within the claim, you pay") than to adjudicate the mental state and lab notebooks of every accused infringer.

  **The Notice Function**
  Patents are meant to warn the public. "Here is the boundary; do not cross." If independent invention were a defense, the boundary would be fuzzy. A company wouldn't know if they were safe to manufacture a device until they knew whether anyone else had independently invented it elsewhere. Copyright has no such notice function; you don't need to search a registry before writing a song.

  So, the asymmetry is **philosophically grounded but pragmatically reinforced.** The philosophy justifies the cost; the cost cements the philosophy.

  ### 3. The "Simultaneous Invention Window" Proposal

  This is the most provocative part of your query. If we adopted a rule where independent inventors within a specific window (say, one year) could not be enjoined but must pay a compulsory license, we would fundamentally alter the nature of a patent.

  In legal economics, this shifts the patent from a **Property Rule** to a **Liability Rule**.
  *   **Property Rule (Current):** I can stop you from using my invention entirely (injunction), or name my price for a license.
  *   **Liability Rule (Proposal):** You can use my invention without my permission, provided you pay a court- or agency-determined fee.

  **What would a patent become under this system?**

  1.  **A Reward for R&D, Not a Monopoly on Use:**
      Currently, a patent is a right to *exclude*. Under your proposal, it becomes a right to *be paid*. This acknowledges the reality that invention is often **inevitable**. If two people invent it in a year, the idea was "in the air." The patent stops being a monopoly on the solution and becomes a subsidy for the research cost.

  2.  **An Acknowledgment of "Standing on Shoulders":**
      This model admits that innovation is cumulative and parallel. It removes the "winner-take-all" aspect of the current First-to-File system. It treats the invention less like a plot of land (which only one person can own) and more like a radio broadcast (which many can receive, but the broadcaster gets paid).

  3.  **A Shift from Secrecy to Speed:**
      Currently, the fear of being scooped drives companies to file prematurely or keep trade secrets. A simultaneous invention window reduces the penalty for being slightly second. It might encourage more robust testing before filing, knowing that if someone else files first, you still have a path to market (via license) rather than being shut out entirely.

  4.  **The Death of the "Patent Troll":**
      Non-practicing entities (NPEs) rely on the threat of the injunction to extract settlements. If the remedy is limited to a compulsory license rate, the leverage of the troll collapses. The patent becomes a revenue stream, not a business-stopper.

  ### Summary for your piece

  The asymmetry you've found isn't a bug; it's the feature.
  *   **Copyright** assumes creativity is **personal and infinite**; therefore, it protects the **labor**.
  *   **Patent** assumes technology is **functional and finite**; therefore, it protects the **solution**.

  If you adopt the "simultaneous invention window," you are effectively admitting that the Patent Office cannot reliably determine who was truly "first" in a meaningful moral sense, and that the social value of the invention outweighs the moral right of the first filer to exclude. You transform the patent from a **fence** around an idea into a **toll booth** on a road that others might have built anyway.

  That is a profound shift: it moves patent law from a system of **natural rights** (I found it, it's mine) to a system of **pure utilitarianism** (We need to incentivize the research, but we won't let you block progress). It suggests that the "property" in intellectual property is a metaphor that has stretched too far.
