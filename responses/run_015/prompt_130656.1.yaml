prompt: |-
  My policy workshop has two people who've been going at it for a year over refugees and asylum, and I'm the one who has to make them produce a joint document instead of another round of position papers. Camp A thinks a state's duties to outsiders are basically remedial and bounded: obligations kick in from that state's own causal role in the displacement, plus a fair-share duty of rescue that gets capped by what it can absorb without failing its own people. Camp B thinks the claims of someone fleeing serious harm don't get weaker because of where they were born, so membership is at best an administrative fact about who can be charged with helping, not a moral one.

  Give me the document they should sign. First a numbered list of claims both can actually accept — substantive ones, not "everyone has dignity." I want them to say something real about whether the refugee/economic-migrant line tracks anything they both care about, and I want them to deal with a case neither of them has a clean answer to: people whose government or economy is slowly dismantling the conditions of a livable life — creeping land dispossession, aquifer collapse, wether or not you want to call it climate — so that nothing pinpointable has happened to them yet, but they obviously can't stay. Call them foreclosure claimants if you need a label. Then a table of the remaining disagreements, each row worded so the side holding it would sign it as stated. One row should be about the thing I think is actually the fight: whether you can settle who counts as a refugee first and then argue separately about who has to take them, or whether those are the same question asked twice. Then the cruxes, and for each one the case, argument, or pattern of evidence both would accept as bearing on it, with each camp's prediction written down. Make one crux about duty transfer — whether a state discharges its share by paying for resettlement somewhere else rather than admitting anyone. And if you think some slice of their dispute is verbal, say which slice and why.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A policy workshop with two entrenched camps (Camp A: Remedial/Bounded Duties; Camp B: Universal/Unbounded Moral Claims).
      *   **Goal:** Produce a *joint document* (not just position papers) that forces convergence where possible and clarifies divergence where necessary.
      *   **Specific Requirements:**
          1.  Numbered list of substantive shared claims (avoiding platitudes).
          2.  Address the Refugee vs. Economic Migrant distinction.
          3.  Address the "Creeping Displacement" case (Foreclosure Claimants).
          4.  Table of remaining disagreements (worded so each side can sign their row).
          5.  One row must address the "Status vs. Allocation" question (Is who counts separate from who takes them?).
          6.  List of Cruxes (with shared evidence/cases and each camp's prediction).
          7.  One crux must be about Duty Transfer (Paying vs. Admitting).
          8.  Identify any verbal disputes.

  2.  **Deconstruct the Camps:**
      *   **Camp A (Remedial/Bounded):** Focus on causality (did we cause this?) and capacity (can we absorb this without harming our own?). State sovereignty and social contract are primary. Duties are specific, not general.
      *   **Camp B (Universal/Moral):** Focus on the needs/rights of the displaced person. Borders are administrative, not moral boundaries. If you are in need, you have a claim, regardless of who caused it.

  3.  **Drafting Section 1: Shared Substantive Claims:**
      *   *Constraint:* Must be real, not "everyone has dignity."
      *   *Idea 1:* Non-refoulement. Both likely agree you can't send people back to death.
      *   *Idea 2:* The distinction between refugee and economic migrant matters *practically* even if morally contested.
      *   *Idea 3:* Capacity matters. Even Camp B must admit a state cannot absorb infinite people without collapsing (which helps no one). Even Camp A admits some duty exists.
      *   *Idea 4:* The "Foreclosure" case. Both agree this is a gap in current law.
      *   *Refining:* Make sure they address the specific prompt requirements (Refugee/Econ line, Foreclosure Claimants).

  4.  **Drafting Section 2: The Table of Disagreements:**
      *   *Constraint:* Worded so the side holding it signs it.
      *   *Row 1 (The Core Fight):* Status vs. Allocation. Camp A says "Who we take depends on who we are/what we did." Camp B says "Who counts is universal; allocation is secondary logistics."
      *   *Row 2:* Causality. Camp A: Causality creates duty. Camp B: Need creates duty.
      *   *Row 3:* Integration. Camp A: Cultural/Political cohesion limits absorption. Camp B: Institutions can/should adapt to people.

  5.  **Drafting Section 3: The Cruxes (Evidence & Predictions):**
      *   *Constraint:* Shared evidence/cases, distinct predictions.
      *   *Crux 1 (Duty Transfer):* Can money replace bodies?
          *   *Shared Evidence:* Resettlement programs (e.g., Australia's offshore processing or EU-Turkey deal).
          *   *Camp A Prediction:* Financial contribution satisfies duty if the refugee is safe.
          *   *Camp B Prediction:* Financial contribution is insufficient without moral membership/admission.
      *   *Crux 2 (Social Trust):* Does high immigration erode the welfare state? (Relevant to Camp A's "capacity" argument).
          *   *Shared Evidence:* Putnam's data vs. successful integration cases (e.g., Canada).
          *   *Camp A Prediction:* High inflows correlate with lower domestic support for redistribution.
          *   *Camp B Prediction:* No significant correlation if policy is managed correctly.
      *   *Crux 3 (The Foreclosure Case):* When does "hardship" become "persecution"?
          *   *Shared Evidence:* Slow-onset climate displacement cases (e.g., Pacific Islands, Sahel).
          *   *Camp A Prediction:* These should be handled via development aid, not asylum.
          *   *Camp B Prediction:* These constitute a moral claim to relocation equivalent to asylum.

  6.  **Drafting Section 4: Verbal Disputes:**
      *   *Analysis:* Is "Refugee" the problem?
      *   *Insight:* Camp A uses "Refugee" as a legal category triggering specific state obligations. Camp B uses "Refugee" as a moral category triggering human obligations. The word "Responsibility" might also be loaded (Responsibility *for* vs. Responsibility *to*).

  7.  **Review and Refine:**
      *   *Tone Check:* Needs to be formal, precise, policy-wonk style, but sharp enough to show the conflict.
      *   *Requirement Check:* Did I include the Foreclosure Claimants? Yes. Did I include the Duty Transfer crux? Yes. Is the Status vs. Allocation row there? Yes.
      *   *Polishing:* Ensure the "Foreclosure" section in the shared claims acknowledges the *problem* without solving it (since they disagree on the solution). Actually, the prompt asks for claims *both can accept*. They can accept that the current system fails these people.
      *   *Refining the "Refugee/Economic" line:* Camp A thinks it tracks moral relevance. Camp B thinks it tracks administrative convenience. They can agree it tracks *legal* consequences.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Table of Disagreements doesn't look like a compromise. It needs to state the disagreement clearly.
      *   *Correction:* Ensure the Cruxes have specific *predictions*, not just positions.
      *   *Correction:* The prompt asks for "Foreclosure Claimants" to be dealt with in the shared claims section regarding the refugee/econ line. I need to make sure they agree on *something* about them. They can agree that the current binary (Refugee vs. Economic) excludes them to everyone's detriment.

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # JOINT MEMORANDUM OF UNDERSTANDING AND DISAGREEMENT
  **Subject:** Framework for State Obligations Regarding Displacement and Asylum
  **Parties:** Camp A (Remedial/Bounded Duty) and Camp B (Universal/Moral Claim)
  **Date:** October 26, 2023

  ## I. SUBSTANTIVE CLAIMS OF AGREEMENT
  *Both parties affirm the following propositions as true and operationally relevant, notwithstanding deeper theoretical divergences.*

  1.  **The Failure of the Binary:** The current legal distinction between "refugee" (persecution-based) and "economic migrant" (opportunity-based) fails to capture the reality of "Foreclosure Claimants" (those facing slow-onset dismantling of livability, e.g., aquifer collapse, creeping land dispossession). Both camps agree this group currently falls into a protection gap where they cannot stay safely but do not qualify for entry.
  2.  **Non-Refoulement as a Floor:** Regardless of the source of the duty, no state may return an individual to a jurisdiction where there is a verified, imminent threat of death or torture. This is a minimum constraint on sovereignty, not a ceiling on obligation.
  3.  **Capacity Constraints are Real:** Even if moral claims are universal, physical and institutional absorption capacity is finite. A policy that causes the collapse of the receiving state's social contract or public order serves neither the host population nor the displaced.
  4.  **Causality is Relevant to Prevention:** While camps disagree on whether causality dictates *remedy*, both agree that states causing displacement (via intervention, trade policy, or emissions) have a primary duty to fund mitigation and stabilization in the region of origin to reduce the need for exit.
  5.  **The Line Tracks Legal Consequences, Not Just Moral Status:** Both camps acknowledge that the refugee/economic-migrant line currently functions as a gatekeeping mechanism for resource allocation. Even if the moral basis is disputed, the line determines access to housing, labor markets, and citizenship pathways. Maintaining a distinction is necessary for administrative triage, even if the criteria for that distinction require reform.

  ## II. TABLE OF REMAINING DISAGREEMENTS
  *The following statements represent the specific points of divergence. Each row is worded such that the camp listed in the left column affirms the statement as a complete and accurate description of their position.*

  | Camp | Statement of Position |
  | :--- | :--- |
  | **Camp A** | **Status and Allocation are Inseparable.** Determining *who* counts as a refugee cannot be separated from determining *which* state receives them. A claim to entry is only valid against a state that has a specific nexus (causal or historical) to the displacement or has explicitly volunteered capacity. |
  | **Camp B** | **Status and Allocation are Distinct Questions.** The moral validity of a refugee's claim is universal and prior to allocation. Once a person is identified as needing protection, assigning them to a specific state is a secondary logistical problem that does not negate the primary claim to membership. |
  | **Camp A** | **Duty is Bounded by Social Contract.** The state's primary fiduciary duty is to its existing citizens. Obligations to outsiders are remedial (fixing harm we caused) or charitable (fair share), but never supersede the welfare of the current membership. |
  | **Camp B** | **Duty is Bounded by Human Need.** Borders are administrative jurisdictions, not moral boundaries. If a person faces serious harm, their claim on resources is not weakened by the accident of which side of a line they were born on, provided the receiving state has the capacity to help. |
  | **Camp A** | **Integration Requires Cultural/Political Cohesion.** High-volume admission of outsiders risks eroding the trust required for a welfare state. Therefore, selection criteria may prioritize assimilation potential or cultural proximity to preserve domestic solidarity. |
  | **Camp B** | **Integration is a Function of Rights, Not Culture.** Solidarity is built through equal legal status and economic inclusion, not cultural homogeneity. Restrictions based on "cultural proximity" are morally arbitrary and functionally discriminatory. |

  ## III. CRUXES AND EVIDENTIARY PREDICTIONS
  *For each crux, both camps agree on the relevance of the cited evidence or case study but disagree on the interpretation or outcome. Each camp records their specific prediction below.*

  ### Crux 1: Duty Transfer (Financial vs. Physical Admission)
  **The Question:** Can a state discharge its obligation to refugees by funding resettlement or protection in third countries without admitting refugees to its own territory?
  **Shared Evidence:** The EU-Turkey Statement (2016) and the Australian Regional Resettlement Arrangement. Data on per-refugee cost differentials between Global North admission and Global South support.
  *   **Camp A Prediction:** Financial contribution is a morally sufficient discharge of duty if it secures safety for the refugee. States should be credited for "fair share" contributions regardless of location, as this maximizes total welfare per dollar spent.
  *   **Camp B Prediction:** Financial contribution is necessary but insufficient. Without a pathway to membership/admission in a stable democracy, refugees remain in limbo. Paying to keep people elsewhere treats them as inventory, not rights-bearers.

  ### Crux 2: The Foreclosure Threshold (Slow-Onset Displacement)
  **The Question:** At what point does economic/environmental degradation become a moral claim equivalent to persecution?
  **Shared Evidence:** Case studies of Pacific Island nations (e.g., Kiribati) facing sea-level rise and Sahel regions facing desertification over 10-20 year horizons.
  *   **Camp A Prediction:** These cases should be managed through development aid, adaptation funding, and temporary labor visas. Granting asylum status creates a perverse incentive and overwhelms legal systems designed for individualized persecution.
  *   **Camp B Prediction:** When livability drops below a threshold of human dignity, the cause (government vs. environment) is irrelevant. These claimants warrant a new protected status with a pathway to permanent residency, equivalent to asylum.

  ### Crux 3: Impact on Domestic Solidarity
  **The Question:** Does high levels of asylum admission correlate with a reduction in public support for the welfare state?
  **Shared Evidence:** Robert Putnam's "E Pluribus Unum" data vs. Canadian multiculturalism integration metrics.
  *   **Camp A Prediction:** There is a negative correlation. Rapid demographic change reduces trust in public institutions, leading to political backlash that ultimately harms both the poor native-born and the displaced.
  *   **Camp B Prediction:** There is no inherent negative correlation. Backlash is driven by policy failure (e.g., lack of housing, labor restrictions), not diversity itself. Well-managed integration sustains or increases solidarity.

  ## IV. NOTE ON VERBAL DISPUTES
  *The workshop identifies the following semantic confusion that exacerbates substantive disagreement.*

  **The Term "Responsibility"**
  *   **The Dispute:** Camp A uses "Responsibility" to mean **Liability** (backward-looking: *Who broke this?*). Camp B uses "Responsibility" to mean **Obligation** (forward-looking: *Who can fix this?*).
  *   **Resolution:** Future drafts must distinguish between **Causal Responsibility** (Camp A's focus) and **Capacity-Based Responsibility** (Camp B's focus). Confusion arises when Camp B argues a state "should take responsibility" (Obligation) and Camp A hears an admission of guilt (Liability).

  **The Term "Refugee"**
  *   **The Dispute:** Camp A treats "Refugee" as a **Legal Category** triggering specific statutory duties. Camp B treats "Refugee" as a **Moral Category** describing a human condition.
  *   **Resolution:** When Camp B says "They are refugees," they mean "They are in dire need." When Camp A hears "They are refugees," they hear "You must grant them citizenship." The parties agree to use the term **"Protection Claimant"** in this document to decouple the moral need from the specific legal outcome.
