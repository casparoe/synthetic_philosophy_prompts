  To bring the fragments back into the light.

  The charts propose a missing slice of time,
  Where secret lords constructed stone and wall.
  A duplicate inserted into time,
  By unseen hands commanding every wall.

  Both narratives are built on shifting sand,
  One claims the truth, the other claims the hand.
  No test distinguishes the grain of sand,
  When both are spoken by the self-same hand.

  They dig the same strata beneath the site,
  But claim the carbon dates distort the light.
  A phantom culture haunts the sacred site,
  To blind the scholars staring at the light.
