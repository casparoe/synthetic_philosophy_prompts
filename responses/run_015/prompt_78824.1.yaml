      *   *No-Level-Splitting:* Rejects rationality of akratic states.

      *Problem:* Right Reasons and Steadfast often yield the same action (keep believing). The difference is theoretical (does the HOE *defeat* justification?). I need cases that ask about *defeat* specifically.
