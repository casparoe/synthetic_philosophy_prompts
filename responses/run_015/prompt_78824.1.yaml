      *(Refining the "Indistinguishable" section):* Steadfast and Right Reasons are the hardest to separate with a quiz like this because they agree on the *doxastic outcome* (keep believing $p$). They disagree on the *status* of the belief (is it justified?). I need to make sure the options ask about justification/support, not just "Should you believe?"

      *Let's finalize the 10 cases.*
      1.  Peer Disagreement (Math).
      2.  Sleep Deprivation (Detective).
      3.  Calibration Data (Forecaster).
      4.  Reasoning Drug (Student).
      5.  Direct Akrasia Assessment (Abstract).
