answer: |-
  # Diagnostic Instrument: Higher-Order Evidence and Epistemic Rationality

  **Instructions:**
  Below are ten cases involving an agent who has formed a belief based on first-order evidence and subsequently acquired higher-order evidence (evidence about the reliability of the process that produced the belief). For each case, select the option that best matches your judgment about what is epistemically rational, permissible, or criticizable for the agent. There are no "correct" answers; the goal is to map the inferential structure of your intuitions.

  ---

  ### The Cases

  **Case 1: The Peer Disagreement**
  Alice solves a complex mathematical proof in her head. She is confident she is correct. Bob, whom she knows to be equally competent and diligent in mathematics, reviews the same proof and tells her he is confident she is wrong. Alice has no independent access to Bob's reasoning.
  *   **A.** Alice is rationally required to significantly lower her confidence or suspend judgment.
  *   **B.** Alice may retain her original confidence, provided she reviewed the proof carefully herself.
  *   **C.** Alice may retain her belief that the proof is correct, but she must acknowledge that her confidence is no longer fully supported.

  **Case 2: The Fatigue Diagnosis**
  Ben is a detective deducing the culprit in a murder case. After forming a belief based on the clues, a doctor informs him that he has been awake for 36 hours and that cognitive performance on deductive tasks drops by 50% after 24 hours. Ben feels clear-headed.
  *   **A.** Ben's belief is no longer justified; he must withhold judgment until rested.
  *   **B.** Ben's belief remains justified because the clues haven't changed; he is merely blameworthy for investigating while tired.
  *   **C.** Ben's belief is unjustified, but it is rational for him to continue believing it because he cannot access his fatigue's impact.

  **Case 3: The Calibration Test**
  Cara is a weather forecaster. She predicts rain with 90% confidence. She is then shown a calibration chart showing that, in conditions identical to today's, her "90% confidence" predictions have historically been correct only 60% of the time.
  *   **A.** Cara is irrational if she does not adjust her confidence level to match the historical track record (approx. 60%).
  *   **B.** Cara should ignore the chart; her current assessment of the clouds is the only relevant evidence for rain.
  *   **C.** Cara should lower her confidence somewhat, but she need not match the statistical frequency exactly.

  **Case 4: The Reasoning Drug**
  David is a philosophy student taking a logic exam. After answering a question, he learns that the water in the exam room was laced with a drug that causes systematic errors in syllogistic reasoning in 80% of subjects. He has no feeling of impairment.
  *   **A.** David must discard his answer; the drug undermines the support his reasoning provided.
  *   **B.** David may keep his answer; the validity of the syllogism is independent of the drug's presence.
  *   **C.** David may keep his answer, but he cannot claim to *know* the answer is correct.

  **Case 5: The Akratic State**
  Elena believes that proposition $p$ is true. She also believes that her total evidence does not support believing $p$. (She thinks she is being epistemically irrational).
  *   **A.** This combination of attitudes is necessarily irrational; one cannot rationally believe $p$ while believing one ought not to.
  *   **B.** This combination can be rational; sometimes the evidence supports $p$ even if the higher-order evidence suggests it doesn't.
  *   **C.** This combination is irrational, but Elena is not blameworthy for holding it.

  **Case 6: The Bias Report**
  Frank believes a political claim based on news reports. A psychologist informs him that he has a strong, unconscious confirmation bias regarding this specific political topic. Frank insists he has weighed the reports objectively.
  *   **A.** Frank is rationally required to discount his belief because the process is tainted.
  *   **B.** Frank is justified in his belief if the reports actually support it; the bias report only affects whether he is praiseworthy.
  *   **C.** Frank should lower his confidence, but he need not abandon the belief entirely.

  **Case 7: The Track Record**
  Grace is a historian dating ancient manuscripts. She forms a belief about a date. She then discovers a logbook showing she has misdated 9 out of 10 manuscripts using this specific method in the past.
  *   **A.** Grace must abandon her belief; the method is proven unreliable.
  *   **B.** Grace may retain the belief if this specific manuscript seems clear to her; past errors are not current evidence.
  *   **C.** Grace should retain the belief but acknowledge it is likely false.

  **Case 8: The Expert Testimony**
  Henry believes a scientific hypothesis based on data. An expert in cognitive science tells Henry that people who interpret data this way are usually misled by a common cognitive illusion. The expert does not say Henry *is* misled, only that he is in a risk group.
  *   **A.** Henry must treat this as a defeater and suspend judgment.
  *   **B.** Henry may ignore the expert; the data speaks for itself.
  *   **C.** Henry should reduce his confidence proportionally to the risk the expert describes.

  **Case 9: Justification vs. Blame**
  Irene has excellent first-order evidence for $q$. She also has higher-order evidence suggesting her evidence is misleading. She retains belief in $q$.
  *   **A.** Irene's belief is unjustified, and she is criticizable for holding it.
  *   **B.** Irene's belief is justified, but she is criticizable for holding it given the higher-order evidence.
  *   **C.** Irene's belief is justified, and she is not criticizable.

  **Case 10: The Defeater Defeater**
  Jack receives higher-order evidence that his reasoning is impaired (like David in Case 4). However, he then receives *higher-order evidence about that evidence* (e.g., a reliable source tells him the report about the drug was a prank).
  *   **A.** Jack's original justification is restored completely; he is back to square one.
  *   **B.** Jack's justification is partially restored, but some doubt remains due to the initial scare.
  *   **C.** Jack's justification is not restored; once undermined, the process remains suspect.

  ---

  ### Scoring Key and Position Mapping

  **Instructions for Use:**
  Tally the responses. Do not look for a perfect match; look for the dominant pattern. The positions below are characterized by their commitments. Note that some positions are defined by their stance on *action* (what to believe), while others are defined by their stance on *status* (rationality/justification).

  #### 1. The Conciliationist View
  *   **Commitments:** Higher-order evidence (HOE) is genuine evidence that must be weighed alongside first-order evidence (FOE). In cases of conflict (especially peer disagreement or reliability defeaters), the agent is rationally required to revise their belief or lower confidence significantly. Rational akrasia is impossible.
  *   **Typical Pattern:** Predominantly **A** answers on Cases 1, 2, 4, 5, 6, 7.
  *   **Most Awkward Commitment:** This view risks a "spiral of skepticism," where learning about human fallibility generally forces us to lower confidence in almost everything, including the reliability of the skepticism itself.

  #### 2. The Steadfast View
  *   **Commitments:** A peer's disagreement or HOE about reliability need not reduce the force of one's original FOE. If the FOE is strong, the agent may retain full confidence. HOE is often treated as irrelevant to the *truth* of the proposition. Rational akrasia is impossible.
  *   **Typical Pattern:** Predominantly **B** answers on Cases 1, 2, 4, 6, 7, 8.
  *   **Most Awkward Commitment:** This view can appear dogmatic, implying that an agent can rationally ignore clear signs of their own cognitive impairment (e.g., a positive drug test) if they feel confident.

  #### 3. The Right Reasons View
  *   **Commitments:** FOE alone fixes what one *ought* to believe (propositional justification). HOE bears only on blameworthiness or doxastic justification (whether one is responsible in holding the belief). An agent can be justified in believing $p$ even if HOE suggests they shouldn't, provided $p$ is actually supported by FOE.
  *   **Typical Pattern:** **B** on belief retention cases (1, 2, 4), but specifically **B** on Case 9 (Justified but criticizable).
  *   **Most Awkward Commitment:** This view allows for a form of "bootstrapping," where an agent can claim their belief is justified by FOE while admitting they have no reason to trust their access to that FOE over the HOE.
  *   **Distinction Flag:** This position relies heavily on the distinction between *propositional justification* (having reasons) and *doxastic justification* (basing belief on reasons properly). If you did not distinguish these in your answers, this position may be collapsed with Steadfastness in your results.

  #### 4. The Total Evidence View
  *   **Commitments:** Both FOE and HOE count as evidence in a single pool. Neither simply replaces the other. The rational response is to adjust confidence proportionally to the total weight of evidence. Sometimes this means retaining belief with lower confidence; sometimes it means suspension.
  *   **Typical Pattern:** Predominantly **C** answers on Cases 1, 3, 6, 8.
  *   **Most Awkward Commitment:** This view requires agents to perform complex, often impossible, calculations to weigh the "weight" of HOE against the "weight" of FOE in real-time.
  *   **Distinction Flag:** This position often comes apart from Conciliationism only on the *degree* of revision required. If you chose **A** (Suspend) where **C** (Lower Confidence) was available, you lean Conciliationist. If you chose **C**, you lean Total Evidence.

  #### 5. The Level-Splitting View (Rational Akrasia)
  *   **Commitments:** It can be rational to believe $p$ at the first order while believing at the higher order that one's belief in $p$ is not rationally supported. The norms governing first-order belief and higher-order belief can diverge.
  *   **Typical Pattern:** Specifically **B** or **C** on Case 5 (The Akratic State). May also select **C** on Cases 2 or 4 (Believe but acknowledge lack of support).
  *   **Most Awkward Commitment:** This view accepts a fragmented mind, where an agent rationally holds contradictory normative attitudes toward their own belief, potentially undermining the guidance function of rationality.
  *   **Distinction Flag:** This position is distinct from the "No-Level-Splitting" view solely on the rationality of the *state* described in Case 5.

  #### 6. The No-Level-Splitting View
  *   **Commitments:** It is necessarily irrational to believe $p$ while believing that one's belief in $p$ is epistemically unsupported. Rationality requires coherence between first-order and higher-order attitudes.
  *   **Typical Pattern:** Specifically **A** on Case 5. Consistent with Conciliationism, Steadfastness, or Total Evidence on other cases, provided they reject akrasia.
  *   **Most Awkward Commitment:** This view implies that in cases of misleading HOE (where the HOE is false), the agent is forced to abandon a true, well-supported belief simply to maintain coherence, prioritizing coherence over truth.

  ---

  ### Unoccupied Combinations

  The following combinations of answers are theoretically possible but occupy no stable position in the contemporary literature:

  1.  **HOE Mandates Increased Confidence:** Selecting options that suggest receiving evidence of one's own unreliability *increases* justification for the first-order belief.
      *   *Status:* **Incoherent.** This violates the direction of fit for evidence; undermining defeaters cannot function as confirming evidence without additional assumptions.
  2.  **Mandatory Akrasia:** Selecting options that suggest an agent is *required* to believe $p$ while believing $p$ is unsupported.
      *   *Status:* **Unattractive.** While some argue akrasia is *permissible*, arguing it is *mandatory* creates a paradox where rationality requires irrationality.
  3.  **HOE Affects Truth:** Selecting options implying that HOE changes the *truth value* of the first-order proposition (e.g., "The drug makes the math answer false").
      *   *Status:* **Incoherent.** Evidence affects justification, not the worldly facts the belief is about.
  4.  **Steadfast on Peers, Conciliationist on Drugs:** Selecting **B** for Peer Disagreement (Case 1) but **A** for Cognitive Impairment (Case 2/4).
      *   *Status:* **Unexplored/Unstable.** Most theories treat HOE uniformly regardless of source. Defending this split requires a specific argument about why peer testimony is epistemically distinct from physiological data, which is rarely developed as a standalone system.

  ---

  ### Indistinguishable Positions and Proposed Expansions

  **Indistinguishable Positions:**
  This quiz cannot fully separate the **Steadfast View** from the **Right Reasons View**. Both typically mandate retaining the first-order belief in the face of HOE (Options **B** in Cases 1, 2, 4). The difference lies in *why*: Steadfast theorists think the HOE is weak evidence; Right Reasons theorists think the HOE is strong evidence but irrelevant to *justification* (affecting only blame). Since the quiz options combine action and status for brevity, a respondent who chooses "Retain Belief" could hold either view.

  **Indistinguishable Positions:**
  This quiz cannot fully separate **Conciliationism** from **Total Evidence**. Both mandate revising belief (Options **A** or **C**). The difference is one of degree (suspend vs. lower confidence). In many concrete cases, the line between "significant lowering" and "suspension" is vague, leading to overlap in scoring.

  **Proposed Additional Cases for Separation:**

  1.  **To Separate Steadfast from Right Reasons:**
      *   *Case:* An agent has FOE for $p$. HOE indicates the agent is unreliable. The agent *knows* the HOE is misleading (e.g., they know the drug test was a false positive), but they cannot prove it to others.
      *   *Question:* Is the agent *blameworthy* for retaining belief?
      *   *Separation:* A Steadfast theorist says "No" (HOE is irrelevant). A Right Reasons theorist might say "Yes" (HOE affects doxastic justification/blame even if propositional justification remains).

  2.  **To Separate Conciliationism from Total Evidence:**
      *   *Case:* An agent has FOE supporting $p$ with strength 0.8. HOE suggests the process is 51% reliable (barely better than chance).
      *   *Question:* What is the rational credence?
      *   *Separation:* A Total Evidence theorist will calculate a weighted average (e.g., credence drops to 0.6). A Conciliationist will argue that *any* significant HOE regarding reliability mandates suspension (credence 0.5) because the FOE is "defeated," not just outweighed. A case specifying numerical probabilities would force this distinction.

  **Note on Propositional vs. Doxastic Justification:**
  As flagged in the Key, several positions (specifically Right Reasons) depend on a distinction between having justification (propositional) and holding a belief based on it (doxastic). This quiz treats "justified" and "rational" somewhat interchangeably to maintain accessibility for undergraduates. Respondents who intuitively distinguish "I have reason to believe" from "I am responsible in believing" should note that their results may map to Right Reasons even if their action-choices look Steadfast.
