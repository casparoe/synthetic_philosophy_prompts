          1.  The 10-case Quiz.
          2.  Scoring Key mapping answer patterns to positions (Conciliationism, Steadfastness, Right Reasons, Total Evidence, Level-Splitting, No-Level-Splitting).
          3.  "Awkward Commitment" sentence for each position.
          4.  Flag distinctions not built into cases (e.g., propositional vs. doxastic justification).
          5.  Section on unoccupied combinations (incoherent/unattractive/unexplored).
          6.  Section on indistinguishable positions and proposed additional cases to separate them.
      *   **Tone/Level:** Challenging, inferential structure focused, no reliance on specific articles.

  2.  **Deconstruct the Positions (Mental Sandbox):**
      *   *Conciliationism:* HOE defeats first-order evidence. Must lower confidence/withhold. Akrasia is irrational.
      *   *Steadfastness:* First-order evidence dominates. Peer disagreement/HOE doesn't force revision. Akrasia is irrational (usually).
      *   *Right Reasons:* First-order evidence fixes the *normative* status. HOE affects *blame* or *access* to justification, not the justification itself.
      *   *Total Evidence:* HOE and FOE are summed. Sometimes you stay, sometimes you go. Nuanced.
      *   *Level-Splitting:* It is rational to believe $p$ and believe that believing $p$ is irrational. (Rational Akrasia).
      *   *No-Level-Splitting:* Rational Akrasia is impossible.

      *Challenge:* Many of these overlap. Steadfast and Right Reasons often look similar in output (keep believing) but differ on *why*. Conciliationism and Total Evidence often look similar (lower confidence) but differ on *how much*. Level-Splitting is the outlier on the "Akrasia" question.

      *Strategy for Cases:* I need cases that pull these apart.
      *   *Peer Disagreement:* Classic HOE.
      *   *Fatigue/Drugs:* Undermining defeaters regarding the *process*.
      *   *Calibration:* Statistical HOE.
      *   *Akrasia Specific:* Explicitly asking if the state "Believe $p$ + Believe evidence doesn't support $p$" is rational.

