answer: |-
  The rain against the window of the Port Authority's planning office was the only thing moving slower than the dredging budget meeting. Elias sat at the head of the table, his laptop open to the output of *Estuary-4*. It was his model, the one he'd inherited and tweaked over fifteen years. It was ugly code, stitched together in Fortran and Excel, resting on a assumption everyone knew was rubbish: that the channel cross-section was perfectly rectangular.

  Anyone who had seen the Mersey knew it was a deep V-shape with muddy shelves. But *Estuary-4* predicted the annual silt accumulation within 2% of the actual dredging tonnage required. It had done so for a decade.

  "It's outperformed the CFD suite again," Elias said, tapping the screen. "The new hydrodynamic model from Southampton is off by twelve percent on the spring tide peaks. Mine's spot on."

  Henderson, the Director of Operations, nodded slowly. He liked spot on. Spot on meant budgets didn't overrun. Spot on meant the container ships didn't ground.

  Sarah, the new senior engineer from the Environment Agency, shifted in her chair. She had a tablet in front of her, displaying a cross-section of the channel that looked nothing like a rectangle. "It's spot on because the errors cancel, Elias."

  The room went quiet. This was the third time she'd raised it.

  "The rectangular assumption underestimates the volume of the shallow shelves," Sarah continued, her voice level. "But the model uses a friction coefficient derived from deep-water data, which overestimates the flow speed in those shallow areas. Faster flow means less silt settling. Less volume means less space for silt. They cancel out. You get the right tonnage for the wrong physics."

  "I get the right tonnage," Elias said. "That's the job. We need to know how many barges to hire. We hired the right number. Where's the problem?"

  "The problem is extension," Sarah said. "Next year, the upstream council is changing the runoff management. The sediment load will change. The flow dynamics will shift. If your model relies on two errors balancing each other, changing one variable breaks the balance. You can't localise the error. You don't know which part of the engine is holding the weight."

  Elias leaned back. "We aren't extending it. We're running it for next year. Same river, same tide."

  "Climate change isn't 'same'," Sarah muttered, but Henderson held up a hand.

  "Show us," Henderson said. "Run the honest version."

  It took them three days. Sarah rewrote the geometry module to reflect the actual bathymetry. They input the real friction coefficients from the recent sonar surveys. They stripped out the fudge factors Elias had tuned over the years. They made it honest.

  They ran the simulation for the previous year's data to validate it.

  The result came back on a Tuesday morning. The honest model predicted 35% less silt accumulation than had actually been dredged.

  Elias stood over Sarah's desk, looking at the graph. "See? It's useless. It says we need half the budget. If we'd used this, the channel would be halfway to the surface by now."

  "It says the physics don't support that accumulation rate," Sarah countered. "Which means either our measurements are wrong, or there's a source of silt we aren't modelling."

  "There isn't," Elias said. "The model is wrong. To get it to match reality, I'd have to tune the sediment cohesion factor. I'd have to tell the code the mud is stickier than it is."

  "Would that work?"

  "Probably. I could get the line to match."

  "But you'd be lying about the mud," Sarah said. "You'd be swapping a geometric error for a material error. And if the mud dries out in a heatwave, your cohesion factor fails, and the model spikes. At least with the rectangular channel, the geometry doesn't change with the weather."

  Elias rubbed his face. "So I have a choice. A model that lies about the shape but predicts the tonnage, or a model that tells the truth about the shape and predicts the wrong tonnage. To fix the second one, I have to lie about the mud. Which lie do you prefer?"

  "The one you can verify," Sarah said. "If you lie about the mud, we can sample the mud. If you lie about the shape, we can't sample the shape. It's the whole channel."

  "It's not about verification," Elias said, his voice dropping. "It's about risk. If I submit the honest model, Henderson cuts the dredging budget by a third. If I'm wrong, a ship grounds. Insurance claims, blocked port, reputational ruin. If I'm right, we waste money on dredging we didn't need. Who pays for that?"

  "The flood defence budget," Sarah said quietly. "That's where the surplus goes."

  Elias didn't answer. He knew the arrangement. The Port Authority's underspend was transferred to the regional flood defence programme. Over-dredging meant safer ships but higher risk of the river banks bursting in a storm. Under-dredging meant cheaper ports and potential maritime disaster.

  The meeting with Henderson was brief. The two models sat on the screen side-by-side. The jagged line of the honest model, low and confident in its physics. The smooth line of *Estuary-4*, hugging the historical data like a shadow.

  "The new one says we can save three million," Henderson said.

  "It says we can save three million based on physics that don't match the historical record," Elias said. "If we use it, and the silt comes in heavier than the physics predict, we find out too late. You can't dredge a ship off a sandbank."

  "And if we use the old one?" Henderson asked.

  "We spend the money. The channel stays deep. The flood defences downstream don't get the surplus."

  Henderson looked at Sarah. "You say the old one is structurally unsound?"

  "I say it's a black box," Sarah said. "If the river changes, and it will, the errors won't cancel anymore. We won't know why it failed until it fails."

  "But it hasn't failed," Henderson said. "For fifteen years."

  "It's a lucked-out model," Sarah said. "You can't build policy on luck."

  Elias looked at his hands. He thought about the flood defences. He thought about the levees downriver that held back the winter storms. He thought about the container ships, millions in cargo, drawing twenty metres of water.

  "If I fix the mud parameter," Elias said, "I can make the honest model match the history. But I have to document that the cohesion is artificial."

  "Will it predict better next year?" Henderson asked.

  "No," Elias said. "It'll just match the past. To predict better, I'd need to assume the sediment load is higher than the upstream gauges show. Another lie."

  Henderson sighed. He closed the laptop. "We can't afford a grounded ship, Elias. The insurance premiums alone would eat the savings. And we can't explain to the board why we're using a model that contradicts fifteen years of operational data."

  "So we keep *Estuary-4*," Sarah said. It wasn't a question.

  "We keep the numbers that work," Henderson said. "Sarah, I want you to document the discrepancy. Keep working on the physics. If we can prove the silt source is external, we can justify the budget without the geometric lie. But until then..."

  He didn't finish. He didn't need to.

  Elias packed his laptop away. Sarah stayed seated, staring at the blank screen.

  " You know," Elias said, pausing at the door. "If the flood defences fail, it's not our department. It's Regional Planning."

  "And if a ship grounds, it's us," Sarah replied. "I know the calculus."

  "It's not calculus," Elias said. "It's just knowing which lie keeps the lights on."

  "Or knowing which lie buys you time," Sarah said.

  Elias walked out into the corridor. The rain had stopped, but the sky was still the colour of bruised iron. He passed the noticeboard where the regional flood risk maps were pinned. The zones downstream were marked amber. They needed the money.

  He went back to his office and opened *Estuary-4*. He checked the parameters. Rectangular channel. Deep-water friction. He ran the forecast for next year. The tonnage came up high. Safe. Expensive.

  He saved the file. He didn't document the cohesion factor Sarah had suggested. He didn't switch to the honest geometry. He let the errors cancel. He picked up the phone to call the dredging contractor to lock in the rate.

  As he dialled, he wondered if the winter storms would be bad enough to matter. He wondered if the ship captains slept better knowing the channel was deep, or if the families downriver slept better knowing the banks were reinforced. He didn't know the answer. He only knew the model predicted the tonnage, and the model was staying.

  He pressed call. The line rang out, echoing in the quiet office, a steady, rhythmic sound that measured out the time until the next tide came in.
