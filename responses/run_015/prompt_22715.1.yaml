answer: |-
  You should absolutely **not** take this bet. Your skepticism is well-founded.

  This is a famous variation of the **St. Petersburg Paradox**, sometimes called the **Alternating St. Petersburg Game** or related to the **Pasadena Game**. While the guy at the party is trying to sell you on "infinite expected value," the math actually says something much weirder: **the expected value is undefined.**

  Here is the clean way to think about what is going on, why his reasoning is flawed, and why this is a dangerous bet in the real world.

  ### 1. The Math: Why the Expected Value is a Trap
  Let's calculate the Expected Value (EV) properly. The EV is the sum of every possible outcome multiplied by its probability.

  *   **Round 1:** Probability of Heads is $1/2$. You win $\$1$.
      *   Contribution to EV: $+\$0.50$
  *   **Round 2:** Probability of Tails then Heads is $1/4$. You lose $\$2$.
      *   Contribution to EV: $-\$0.50$
  *   **Round 3:** Probability of Tails, Tails, Heads is $1/8$. You win $\$4$.
      *   Contribution to EV: $+\$0.50$
  *   **Round 4:** Probability of three Tails then Heads is $1/16$. You lose $\$8$.
      *   Contribution to EV: $-\$0.50$

  The total Expected Value is the sum of these contributions:
  $$EV = 0.50 - 0.50 + 0.50 - 0.50 + 0.50 - \dots$$

  This is a version of **Grandi's Series**. It oscillates forever.
  *   If you stop after an odd number of terms, the EV is $\$0.50$.
  *   If you stop after an even number of terms, the EV is $\$0.00$.

  In rigorous probability theory, for an Expected Value to exist, the sum must **converge absolutely** (meaning the sum of the absolute values must be finite). Here, the sum of the absolute values is infinite ($0.5 + 0.5 + 0.5 \dots$). Because the series does not converge, **the Expected Value does not exist.**

  The guy at the party is likely grouping the terms to look like $(0.5 - 0.5) + (0.5 - 0.5) \dots = 0$ or ignoring the negative terms to claim it's positive. But mathematically, you cannot make a rational decision based on an undefined number.

  ### 2. The Real-World Problem: Risk of Ruin
  Even if we charitable assume the EV is $\$0.50$ in your favor, the **variance** (risk) is catastrophic.

  This game involves exponential growth. The amounts double every round.
  *   By Round 10, you are flipping for **$\$512$**.
  *   By Round 20, you are flipping for **$\$524,288$**.
  *   By Round 30, you are flipping for **$\$536,870,912$**.

  The probability of hitting a string of 20 tails in a row is roughly 1 in a million. That sounds rare, but if you play this game repeatedly, or if a crowd is watching and bets are being made, it becomes a statistical certainty that someone will eventually hit a "loss streak" deep enough to bankrupt them.

  **The Clean Heuristic:**
  > Never take a bet where your potential loss grows exponentially, even if your potential win does too, unless you have an infinite bankroll. You don't.

  ### 3. Counterparty Risk (Will He Pay?)
  Let's say luck is on your side. You hit a string of tails, and on Round 15, you finally flip Heads. According to the rules, he owes you $2^{14}$, which is **$\$16,384$**.

  Is this guy at the party actually going to write you a check for $\$16k$? Probably not.
  *   If you lose big, he expects you to pay.
  *   If you win big, he will likely claim "I didn't think it would go that far" or simply not have the liquidity.

  This creates an **asymmetric risk**: You are fully liable for your losses, but his liability is capped by his actual net worth. That alone makes the EV negative for you.

  ### 4. The "Entry Fee" Trick
  He mentioned you should take it "even if there's a decent entry fee." This is the biggest red flag.
  Since the EV is undefined, charging an entry fee guarantees your loss in the long run.
  *   If the EV is effectively 0 (oscillating), any positive entry fee makes the total EV negative.
  *   If the EV is effectively 0.50, a $\$5$ entry fee makes it a terrible bet.

  ### The Verdict
  **Walk away.**

  This is a classic "mathematical sophistry" bet. It uses a quirk of infinite series (divergence) to mask the reality of finite bankrolls and exponential risk.

  **The clean way to explain it to him:**
  > "The expected value of this game is undefined because the series $1/2 - 1/2 + 1/2 \dots$ doesn't converge. Plus, since neither of us has infinite money, the game is effectively capped. If the cap is an even round, the EV is zero. If it's an odd round, the EV is 50 cents. Either way, the volatility is too high, and I'm not risking $\$1,000$ to win $\$50$."

  He might argue the math, but your wallet will thank you for ignoring him.
