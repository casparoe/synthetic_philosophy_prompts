      *   Comparative empirical programme? **Yes.** This addresses Component 3.
      *   Change of question? **Yes.** Shift from "Is subsidiarity satisfied?" to "What jurisdictional map makes subsidiarity testable?"
      *   *Recommendation:* A mix of Empirical Programme + Change of Question.

  7.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Academic, peer-to-peer, rigorous, avoiding platitudes. Acknowledge the sophistication of the prompt.
