answer: |-
  Your hypothesis is not only right; it is the most precise map of this stalemate I have encountered in recent literature. You have correctly identified that the "substantive vs. empty" debate is a proxy war. To answer your specific questions: yes, the three-part diagnosis holds, but the weight distribution is uneven. The impasse is primarily an **unacknowledged empirical disagreement (Component 3)** that is protected by **divergent paradigm cases (Component 2)** and justified by **incommensurate normative foundations (Component 1).**

  Here is the diagnosis of the impasse, the status of your "wrinkle," and what would actually constitute progress.

  ### 1. Weighting the Three Components
  You ask which component is doing the most work. It is **Component 3 (the empirical frequency/severity of case types)**, but it operates through **Component 2 (paradigm cases).**

  *   **Component 1 (Normative Foundations)** is the *source* of the intuition, but rarely the *cause* of the stalemate. Scholars usually know their own normative priors (liberal vs. democratic vs. epistemic). They can coexist if the facts are clear. If spillovers are ubiquitous and catastrophic, the liberal "exit" argument yields to the epistemic "capacity" argument regardless of normative preference.
  *   **Component 2 (Paradigm Cases)** is the *mechanism* of the talk-past. One side argues from environmental externalities (where the lower level *cannot* suffice); the other argues from moral legislation or education (where the lower level *prefers* divergence). Because neither side accepts the other's dataset as representative, the "two-limb test" yields opposite results.
  *   **Component 3 (Empirical Frequency)** is the *blocker*. This is the hidden variable. The "empty formula" camp believes spillovers are rare or manageable via negotiation (Coasean bargaining between states). The "genuine principle" camp believes spillovers are systemic and bargaining is transaction-cost prohibitive. Because no one treats this as a falsifiable empirical claim, the conceptual debate spins indefinitely.

  **Diagnosis:** The impasse persists because scholars treat a **masked empirical question** as a **conceptual legal one.** As long as the frequency of "genuine insufficiency" (Limb 1) is treated as a matter of judicial deference rather than measurable capacity, the principle remains plastic.

  ### 2. The Wrinkle: The Problem of Fixed Levels
  You ask whether the mismatch between functional regions (river basins, labour markets) and constitutional levels is a fatal incompleteness or a detachable objection.

  It is **not fatal to the concept, but it is fatal to the claim that subsidiarity is a first-order decision rule.**

  *   **The Detachable Defence:** A defender can argue that subsidiarity is a rule for *allocation*, not *constitution*. It presupposes a jurisdictional map. If the map is wrong, that is a failure of constitutional design or boundary drawing, not a failure of the allocation principle. On this view, subsidiarity operates *within* the given set of levels.
  *   **The Fatal Critique:** However, this defence concedes your point: it relegates subsidiarity to a **second-order principle**. If the "levels" are arbitrary relative to the "problem," then satisfying subsidiarity within those levels may still yield inefficient or illegitimate outcomes. A policy can be "subsidiarity-compliant" (allocated to the lowest available constitutional unit) while still being functionally mismatched (e.g., a state regulating an airshed that crosses three states).

  **Verdict on the Wrinkle:** This is the stronger argument for the "empty formula" side, but not for the reason usually given. It's not empty because it justifies anything; it's empty because it **lacks a theory of the relevant unit.** It protects *jurisdictional integrity* rather than *functional optimality*. If your project treats the four systems' levels as fixed variables, you must acknowledge that subsidiarity protects the *status quo of boundaries* more than it guides *optimal governance*.

  ### 3. Nature of the Impasse: Verbal, Intuitive, or Empirical?
  It is an **empirical disagreement masquerading as conceptual indeterminacy.**

  If the "insufficiency" limb were empirically grounded (e.g., specific metrics on fiscal capacity, regulatory arbitrage, or pollution dispersion), the "plasticity" charge would lose force. The reason courts are deferential is not necessarily institutional weakness; it is often **epistemic humility.** Judges (and scholars) recognize they lack the data to determine if a lower level *truly* cannot achieve the objective.

  Therefore, the "indeterminacy" is a rational response to information asymmetry. The "empty formula" critics are describing the *operation* of the principle correctly (it legitimizes outcomes), while the "genuine principle" defenders are describing its *potential* correctly (it *could* guide if data existed). They are both right about different stages of the same process.

  ### 4. What Counts as Progress?
  Given this diagnosis, refining the test's limbs (legal doctrine) or seeking formal results on non-cooperation (game theory) will not move the needle. Those approaches assume the impasse is conceptual or logical. It is not.

  **Progress requires one of two shifts:**

  **A. A Comparative Empirical Programme (The Hard Path)**
  Your project is uniquely positioned to do this. Progress would look like moving away from "Did the court apply subsidiarity?" to "What are the functional boundaries of the policy problem vs. the constitutional boundaries of the actor?"
  *   **Metric:** Measure the "mismatch ratio" between functional regions and constitutional levels across the US, DE, CH, and EU for specific policy areas (e.g., water, transport, banking).
  *   **Hypothesis:** If the mismatch is high, subsidiarity review should theoretically be more rigorous. If courts remain deferential despite high mismatch, the "empty formula" thesis is empirically validated. If courts intervene where mismatch is high, the "genuine principle" thesis gains traction.
  *   **Value:** This turns Component 3 from a hidden assumption into a dataset.

  **B. A Change of Question (The Theoretical Path)**
  Acknowledge that subsidiarity is not a tool for finding the *optimal* level, but a **presumption in favour of the *existing* level.**
  *   **Reframing:** Stop asking "Is subsidiarity a genuine principle?" and start asking "Under what institutional conditions does the subsidiarity presumption successfully correct for centralization bias?"
  *   **Value:** This accepts the "empty formula" critique (it is a legitimation device) but asks whether that legitimation serves a systemic function (e.g., stability, reducing transaction costs of boundary disputes). This aligns with your US/DE/CH/EU comparison: perhaps the principle's "emptiness" is a feature, allowing different systems to project their own normative content (Component 1) onto a shared structure.

  ### 5. Should No Progress Be Expected?
  There is a strong case that **no conceptual progress should be expected**, and recognizing this is itself a finding.

  If subsidiarity functions primarily as a **political settlement mechanism** (as your "empty formula" colleagues argue), then its indeterminacy is functional, not buggy. It allows conflicting normative visions (Component 1) to coexist within a single constitutional text.
  *   In the **EU**, it manages the tension between integration and sovereignty.
  *   In the **US**, it manages the tension between Commerce Clause expansion and State Police Powers.
  *   In **Germany**, it manages the tension between *Einheitsstaat* tendencies and *Länder* autonomy.
  *   In **Switzerland**, it manages the tension between direct democracy and federal efficiency.

  If the principle's job is to allow these tensions to persist without breaking the system, then making it "determinate" would be destructive. Progress, in this view, is understanding **why the indeterminacy is preserved.**

  ### Recommendation for Your Project
  Do not try to solve the "genuine vs. empty" debate. **Use it.**

  1.  **Accept the Three-Part Hypothesis:** Explicitly frame your comparative chapters around these three divergences. Show how the US leans on Component 2 (Spillovers/Commerce Clause) while Switzerland leans on Component 1 (Democratic/Liberal self-rule).
  2.  **Address the Wrinkle as a Variable:** Treat the "mismatch between functional and constitutional levels" as an independent variable. Does the EU (high mismatch) apply subsidiarity differently than Switzerland (lower mismatch due to cantonal size/functional overlap)?
  3.  **Target Component 3:** If you want to break new ground, attempt to quantify the "insufficiency" claims. When a higher level asserts competence, what evidence is offered for the lower level's inability? Is it rhetorical or empirical?

  **Summary:** The impasse is real, but it is not a failure of theory. It is a reflection of the fact that federalism is a negotiation over power, not a puzzle to be solved. Your hypothesis is correct; the empirical frequency of "genuine necessity" is the missing key. However, be prepared for the possibility that the key turns no lock because the door was never meant to open—it was meant to hold the frame together.
