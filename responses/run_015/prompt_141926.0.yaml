  8.  **Final Polish:**
      *   Ensure I don't give a verdict on who wins (as requested).
      *   Ensure I address the US/DE/CH/EU context implicitly (comparative angle).
      *   Check against the "Diagnosis not Overview" constraint.

      *(Self-Correction during drafting)*: I need to be careful not to just agree with everything. I should offer a critical perspective on the hypothesis. For instance, is it *three* disagreements, or is the third (empirical) the *cause* of the first two? I will argue the empirical uncertainty *allows* the normative divergence to persist.

      *(On the Wrinkle)*: I need to be precise. Is it fatal? If subsidiarity presupposes levels, and levels are arbitrary regarding function, then subsidiarity protects *arbitrary* boundaries. That's a strong critique. I should frame it as "Subsidiarity is a constraint on *vertical* reallocation, not a guide for *horizontal* design."

      *(On Progress)*: If the impasse is due to masked empirical disagreements, then an empirical program is the only way out. But if the principle is *intended* to be political (as the 'empty formula' side claims), then empirical clarity won't fix the *usage*, only the *analysis*. I need to distinguish between "fixing the principle" and "understanding the principle." The user asks what counts as progress *for the project*.

  9.  **Finalizing the Output Structure:**
      *   **Validation:** Your hypothesis is robust.
      *   **Weighting:** The Empirical (3) is the engine; the Normative (1) is the fuel.
      *   **The Wrinkle:** It's not fatal, but it demotes subsidiarity to a second-order rule.
      *   **Nature of Impasse:** Conceptual indeterminacy is a proxy for empirical uncertainty.
      *   **Pathways:** Empirical mapping + Jurisdictional Theory.
