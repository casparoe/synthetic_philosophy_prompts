  2.  **Deconstruct the User's Hypothesis:**
      *   *Component 1 (Normative Foundations):* Epistemic vs. Democratic vs. Liberal. This is a classic "many concepts, one word" problem.
      *   *Component 2 (Paradigm Cases):* Spillover/Race to Bottom vs. Divergent Preferences/Experimentation. This is about framing the problem space.
      *   *Component 3 (Empirical Frequency):* How often do spillovers happen vs. local preference divergence? This is the hidden variable.
