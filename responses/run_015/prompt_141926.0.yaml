  3.  **Evaluate the "Three Disagreements" Hypothesis:**
      *   *Is it right?* Yes, largely. The literature often conflates these.
      *   *Which does the most work?* I need to weigh them.
          *   Component 1 (Normative) is the *source* of the disagreement, but often hidden.
          *   Component 2 (Paradigms) is the *mechanism* by which they talk past each other.
          *   Component 3 (Empirical) is the *potential resolution* but is ignored.
      *   *Diagnosis:* The impasse persists because scholars treat a normative/empirical hybrid as a purely legal/conceptual question.

  4.  **Address the "Wrinkle" (The Levels Problem):**
      *   Is it fatal? It's a category error in the application of the principle. Subsidiarity assumes a pre-existing hierarchy. Functional regions challenge the hierarchy itself.
      *   Is it detachable? Defenders might say "that's a boundary drawing question, subsidiarity is an allocation question." But if the boundaries are wrong, the allocation test is moot.
