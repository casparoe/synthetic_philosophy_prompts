answer: |-
  Plain-words glossary

  Panpsychism: Mind is fundamental, found even in atoms.
  Subject: The "someone" having an experience.
  Experience: What it feels like from the inside, like redness or pain.
  Grounding: One thing existing because of another, without being built of it like bricks.
  Emergence: New properties appearing when parts combine, like wetness from water.
  Combination Problem: How little minds make a big mind.
  Proto-experience: Something like mind but not quite feeling yet.
  Constitutive: The big thing is made literally out of the little things.
  Macro-level: The large scale, like humans or brains.
  Micro-level: The small scale, like particles or neurons.
  Ontology: What kinds of things actually exist.
  Phenomenology: The structure of experience itself.

  The tree

  Start at the root. Ask the fundamental question: Does the big experience exist over and above the little ones? If no, you head left. If yes, you head right. This first split decides whether you are a realist about the big "me" or not.

  On the left branch, where the big experience is not real, ask the Slow Replacement Case: Swap one neuron at a time for a chip that does the same job. Does the experience fade gradually or wink out at some point? If you say it winks out because there was never a big experience to begin with, you land on Illusionism. If you say experiences happen but nobody owns them, you land on Drop-the-subjects. This path denies the unity you feel.

  On the right branch, where the big experience is real, ask the Stadium Case: Fifty thousand people each hold up one coloured card. Does the stadium see a picture? If no, the big experience is not built from the little ones. This splits again. Ask the Anaesthesia Case: I go under, the big experience stops, but the little stuff presumably hasn't gone anywhere. If the big experience is actually the basic one and the little ones are just parts of it, you land on Cosmopsychism. If the big experience pops out as a new brute fact when the brain works, you land on Brute Emergence. These views say the whole is prior to or distinct from the parts.

  If you answer yes to the Stadium Case, the big experience is built from the little ones. Now ask the Split-Brain Case: Sever the connection between the hemispheres. Now how many subjects? If you say the little subjects fuse into one new subject, you land on Fusion. If you say the little subjects stay separate but ground the big one, you land on Grounded Not Composed. If you say the little subjects are only proto-experiential and combine into real experience, you land on Proto-experiential. If you say the little subjects are fully experiential and simply add up directly, you land on Straight Micro-level Panpsychism.

  This covers the main paths. Each answer leads to a specific leaf. The questions force you to decide on existence, composition, and continuity. The Stadium Case separates the builders from the non-builders. The Anaesthesia Case separates the cosmos-first from the emergence views. The Slow Replacement Case separates the realists from the illusionists. The Split-Brain Case separates the fusionists from the straight builders. There are eight final positions at the ends of these branches. They cover the space of possible answers. You cannot hold two leaves at once. You must choose a path.

  What each leaf is stuck with

  Every position here has a specific headache it cannot easily scratch. Straight Micro-level Panpsychism struggles to explain how distinct tiny feelings become one big feeling without loss. The Fusion version cannot explain how subjects merge without destroying the original subjects entirely. Brute Emergence offers no mechanism for how experience pops out of non-experience suddenly. The Proto-experiential view leaves unclear how non-feeling properties become feeling ones exactly. Cosmopsychism makes it hard to explain why we feel separate from the cosmic whole. Grounded Not Composed risks being a verbal trick that hides the real combination problem. Illusionism must explain why the illusion of experience feels so real and undeniable. Drop-the-subjects finds it hard to make sense of memory and ownership without a subject. Each leaf survives only by ignoring one of these sharp edges.

  Empty seats

  There are combinations of answers this tree allows that nobody actually holds. First, Yes Big Exists, No Stadium, Yes Anaesthesia (Little stop too). This seat is empty because if the big exists independently, it is incoherent for the little parts to stop when the big sleeps. Second, No Big Exists, Yes Slow Replacement (Fades gradually). This seat is empty because if there is no big experience, there is nothing to fade, making the view logically incoherent. Third, Yes Big Exists, Yes Stadium, No Split-Brain (One subject remains). This seat is unoccupied because it denies clinical evidence of divided consciousness in patients, making it empirically unattractive. These seats are empty for different reasons. Some are logically broken, while others just contradict what we know about brains. It is useful to see where the logic permits a view that nobody wants. It shows where the pressure points are. The empty seats highlight the constraints that shape the occupied ones.

  Where the tree gives out

  This tree cannot actually tell apart two of the leaves no matter how hard you push. Grounded Not Composed and Straight Micro-level Panpsychism look identical from the inside. Both say the little ones are real and the big one is real. Both say the big one depends on the little ones. The difference is metaphysical, about whether "building" is the right word. But the questions here are about experience and cases. The Stadium Case asks if the stadium sees the picture. Both say yes. The Split-Brain Case asks how many subjects. Both say two. The tree asks about phenomenology and logic, not metaphysics. So these two leaves sit in the same spot on the map. You need a different question to separate them.

  Where my committee idea lands

  Your committee model lands squarely on the Grounded Not Composed leaf. You say the company is real in a thinner way, which matches grounding. You say nobody had to merge, which denies fusion. But you still owe us an explanation of the headache. If the committee feels it, the committee is a subject. If it is not a subject, who feels it? You try to avoid a extra person in head office, but the pain must be felt by someone. If the committee is just a pattern of little feelings, we are back to the Straight Micro-level view. If the committee is a new subject, you have Fusion. To make this work, you must explain how a "thinner" real thing can feel pain without being a subject. Until you solve that, your model is just a name for Grounded Not Composed with an unsolved debt.
