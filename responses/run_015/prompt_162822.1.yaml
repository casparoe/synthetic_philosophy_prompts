          *   No bibliography/citations.

  2.  **Deconstruct the User's "Half-Formed Angle":**
      *   *Point 1 (Asymptotics):* Solomonoff induction works in the limit. Real agents have horizons. The multiplicative constant (dependent on the true environment/universal Turing machine choice) can swamp the benefit within the horizon.
      *   *Point 2 (Invariance/Fragility):* Kolmogorov complexity is invariant only up to an additive constant. For short hypotheses (which bounded agents care about), this constant matters. The user introduces "fragility" (ranking shifts under reference machine change) and "stability."
      *   *Point 3 (Weighting vs. Ordering):* Solomonoff weights an enumeration. Bounded agents search/test in order. Does the justification for weighting transfer to ordering?
      *   *Core Tension:* Is Occam's Razor justified for *bounded* agents, or does the justification evaporate when we leave the idealised limit?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be precise. *Bounded Rationality and the Fragility of Occam's Razor: A Resource-Constrained Analysis of Solomonoff Induction.*
      *   **Introduction/Research Questions:** State the problem clearly. The standard vindication relies on idealisation. Does it hold for us?
          *   Q1: To what extent does the simplicity ordering of hypotheses remain stable under changes to the reference machine within the regime of computationally accessible hypotheses?
          *   Q2: Does the justification for simplicity-weighted priors transfer to complexity-ordered search strategies under bounded resources?
          *   Q3: Can a robustness-corrected simplicity prior retain convergence guarantees, or do robustness and convergence diverge?
      *   **Literature/Existing Positions:** Don't just list. Argue.
          *   *Standard Solomonoff:* Good for limits, ignores constants.
          *   *MDL:* Practical, but often assumes the same invariance without checking the short-code regime.
          *   *No-Free-Lunch:* Says no prior is best everywhere. Solomonoff bypasses this by restricting to computable environments. But bounded agents can't check all computable environments.
          *   *Speed Priors:* Acknowledge computation time, but often conflate speed with description length. Need to separate *description* fragility from *computation* cost.
      *   **Methodology (Year-by-Year):**
          *   *Year 1:* Formalising "Fragility." Defining the metric. (Theoretical).
          *   *Year 2:* Bounded Search vs. Weighting. Modelling the search cost. (Theoretical/Modelling).
          *   *Year 3:* Synthesis. Convergence vs. Robustness trade-off. Writing up.
          *   *Cuts:* Empirical ML experiments (too engineering-focused). Pure simulation across languages (too trivial/shallow). Proving a new dominance theorem (misses the philosophical point about the *failure* of the old one).
      *   **Justification of Method:** Why formal/philosophical analysis over simulation? Because the question is about *justification* and *invariance*, not performance on specific datasets. Simulations hide the constants; this project exposes them.
      *   **Possible Conclusions:**
          *   Optimistic: Robustness holds for "natural" hypotheses.
          *   Pessimistic: Razor is unjustified for short horizons.
          *   Nuanced: Weighting != Ordering. Need a new norm.
      *   **Failure Conditions:** If fragility is unmeasurable/arbitrary. If the problem reduces to standard asymptotics (i.e., boundedness doesn't actually change the normative claim).

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Tone Check:* Needs to be academic but punchy. British English (e.g., "programme," "modelling," "favour").
      *   *Word Count:* Keep an eye on it. 1,500 words is tight for all these sections. Need to be concise.
