      *   *Methodology:* Make sure the "cuts" are explicit. The user asked what to cut.
      *   *Failure:* Be honest. If "fragility" turns out to be just "invariance constant," is that new? Yes, if we measure it over specific hypothesis classes relevant to bounded agents.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Start with the tension. Ideal vs. Bounded.
      *   *Lit Review:* Group by how they fail to address the "short hypothesis" problem.
      *   *Method:* Break down the three questions into work packages.
      *   *Outcomes:* Define the success/failure criteria clearly.

  6.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No citations? Yes.
      *   Word count? Aiming for ~1,500.
      *   User's specific points included? (Fragility, Stability, Weighting vs Ordering, Asymptotics). Yes.

  7.  **Final Polish:** (Writing the text, ensuring flow and argument strength). *Self-correction: Ensure I don't sound like I'm dismissing Solomonoff entirely, but rather investigating the boundary conditions of its justification.* *Make sure the distinction between MPhil and PhD level is clear – this needs to be foundational, not just applied.*

