answer: |-
  **Title:** Bounded Rationality and the Fragility of Occam's Razor: A Resource-Constrained Analysis of Solomonoff Induction

  **1. Research Questions and Problem Statement**

  The standard vindication of Occam's Razor rests on Solomonoff induction: a prior weighting hypotheses by $2^{-K(h)}$, where $K$ is Kolmogorov complexity, converges on any computable data-generating process with bounded total expected error. This suggests simplicity is not merely pragmatic but epistemically optimal. However, this result relies on two idealisations that vanish for real agents: infinite computational resources and asymptotic time horizons. This thesis investigates whether the normative force of Solomonoff's argument survives the transition from an ideal agent to a bounded one.

  The project is driven by three specific concerns. First, Solomonoff's dominance is asymptotic and holds only up to a multiplicative constant determined by the true environment. At the finite horizons accessible to bounded agents, this constant may swamp the advantage simplicity is supposed to confer. Second, the invariance theorem guarantees complexity is machine-independent only up to an additive constant. For the short hypotheses a bounded agent can actually entertain, this constant is significant, potentially rendering the simplicity ordering an artefact of the reference machine. Third, while Solomonoff induction weights an enumeration, bounded agents search hypotheses in order of increasing complexity. It is unclear whether the justification for *weighting* transfers to *ordering*.

  Consequently, the thesis addresses three determinate questions:
  1.  **Fragility:** To what extent does the simplicity ordering of hypotheses remain stable under changes to the reference machine within the regime of computationally accessible hypotheses?
  2.  **Search vs. Weighting:** Does the epistemic justification for simplicity-weighted priors transfer to complexity-ordered search strategies under bounded resources, or do they diverge?
  3.  **Trade-offs:** Can a robustness-corrected simplicity prior retain convergence guarantees, or do robustness and convergence pull apart in the bounded regime?

  **2. Critical Context and Existing Positions**

  Existing literature leaves these questions open because it typically prioritises asymptotic guarantees over finite-horizon stability. The standard Solomonoff framework treats the additive and multiplicative constants as negligible noise. This is defensible for an ideal agent with infinite time, where the log-loss of the constant amortises to zero. For a bounded agent, however, the 'horizon' is the entire epistemic life of the system. If the multiplicative constant exceeds the error reduction gained by simplicity within that horizon, the dominance result is normatively inert. The literature acknowledges this but rarely treats it as a fatal flaw rather than a technical caveat.

  The Minimum Description Length (MDL) tradition attempts to operationalise these ideas for statistics. However, MDL often assumes the invariance theorem does the heavy lifting regarding model selection without rigorously quantifying the 'fragility' of rankings for short code lengths. It presumes that because complexity is invariant in the limit, the ordering is stable in the short run. This thesis challenges that presumption, arguing that the short-run regime is exactly where the invariance constant dominates.

  No-Free-Lunch theorems suggest that no prior performs best across all environments. Solomonoff induction bypasses this by restricting the domain to computable environments. Yet, a bounded agent cannot verify computability, nor can it enumerate all computable hypotheses. Resource-bounded approaches, such as Speed Priors, attempt to correct for this by penalising computation time alongside description length. While this addresses the search cost, it often conflates *speed* with *simplicity*. A hypothesis might be fast to evaluate but complex to describe, or vice versa. The Speed Prior literature does not sufficiently disentangle the fragility of the description length itself from the cost of computing it. This project isolates the description length fragility as a distinct problem from computational cost, asking whether the 'simplicity' part of the prior is stable before we even ask how long it takes to test.

  **3. Methodology and Work Plan**

  The method is primarily formal and philosophical, utilising tools from algorithmic information theory and decision theory. It avoids empirical machine learning studies, as performance on specific datasets cannot resolve normative questions about justification or invariance.

  *Year 1: Formalising Fragility and Stability*
  The first year focuses on Question 1. I will define a metric for 'fragility': the extent to which a hypothesis's rank in the simplicity ordering shifts when the reference universal Turing machine is changed. I will define 'stability' $d$ over a hypothesis class as the fraction of pairwise rankings that flip under a permissible change of machine. The work will involve deriving bounds on this fragility for hypothesis classes of length $L$, specifically where $L$ is close to the invariance constant.
  *Cut:* I will not produce a new dominance theorem. Proving that a modified prior converges asymptotically misses the point that the bounded horizon is the locus of the problem. The goal is to characterise the failure of the standard result, not to salvage convergence at any cost.

  *Year 2: Weighting vs. Ordering under Bounds*
  The second year addresses Question 2. I will model a bounded agent not as a Bayesian updater with a Solomonoff prior, but as a searcher with a complexity budget. I will compare the expected epistemic utility of weighting hypotheses by $2^{-K(h)}$ versus searching them in order of $K(h)$. This requires analysing the 'opportunity cost' of testing a complex hypothesis early versus the risk of missing the true hypothesis by pruning the search tree too aggressively.
  *Cut:* I will not run simulations across programming languages to show variance in complexity. This is empirically trivial; the invariance constant is known to exist. The philosophical work lies in determining the normative significance of that variance for justification, not demonstrating its existence.

  *Year 3: Synthesis and Trade-offs*
  The final year addresses Question 3. I will investigate whether a 'robustness-corrected' razor—one that penalises hypotheses with high fragility—can offer better finite-horizon performance than the standard razor. I will analyse whether enforcing robustness degrades convergence rates if the horizon were extended. The thesis will conclude by determining if Occam's Razor for bounded agents requires a new normative foundation distinct from Solomonoff induction.

  **4. Justification of Method**

  This formal approach is necessary because the core issue is conceptual, not engineering. An empirical model-selection study would show *that* different priors perform differently on finite data, but it cannot explain *why* or whether the simplicity prior is *justified*. Performance is contingent on the dataset; justification requires invariance. Similarly, proving another dominance theorem would likely rely on new idealisations, pushing the problem back rather than solving it. By focusing on the stability of the ordering itself (fragility) and the distinction between weighting and ordering, this project targets the structural assumptions of the standard vindication. It treats the constants not as noise to be ignored, but as the signal that determines normative force in the bounded regime.

  **5. Possible Conclusions and Decision Criteria**

  There are three plausible outcomes, decided by the derivations in Years 1 and 2.

  1.  **The Pessimistic Conclusion:** Fragility is high for all hypothesis lengths accessible to bounded agents. If the stability metric $d$ approaches 0.5 (random ordering) for all feasible $L$, then the Solomonoff vindication collapses for real agents. Simplicity becomes a pragmatic heuristic with no epistemic grounding in induction. This would be decided if the lower bounds on fragility exceed the error-reduction bounds of the simplicity prior.
  2.  **The Divergence Conclusion:** Weighting and Ordering are normatively distinct. It may transpire that while weighting by $2^{-K(h)}$ is optimal for belief updating, ordering by $K(h)$ is suboptimal for search under bounds (perhaps due to evaluation costs correlating poorly with $K$). This would require a decoupling of the logic of discovery from the logic of justification.
  3.  **The Robustness Trade-off:** A robustness-corrected razor is possible but sacrifices convergence. If penalising fragile hypotheses improves finite-horizon accuracy but violates the conditions for asymptotic convergence, this establishes a fundamental tension between 'truth-seeking' in the limit and 'error-avoidance' in the short run.

  **6. Conditions for Project Failure**

  An honest account of risk is required. The project fails if:
  *   **Fragility is Unmeasurable:** If 'permissible changes' to the reference machine cannot be non-arbitrarily bounded, the fragility metric becomes undefined. If any Turing machine can be transformed into any other with a constant that swamps the hypothesis length, the concept of stability is vacuous.
  *   **Collapse to Asymptotics:** If analysis shows that the 'bounded' regime effectively behaves like the asymptotic regime for any agent capable of formulating the hypotheses in question (i.e., if the agent is powerful enough to care about $K(h)$, it is powerful enough that the constants *are* negligible), then the distinction dissolves. The thesis would then reduce to a restatement of the standard Solomonoff result.
  *   **Normative Irrelevance:** If fragility is shown to be high, but it can be demonstrated that no alternative prior offers better finite-horizon guarantees (a strong No-Free-Lunch result), then identifying the flaw in Solomonoff induction yields no constructive normative guidance. The project must show that identifying the flaw allows for a better bounded norm, not just the destruction of an ideal one.

  **7. Conclusion**

  This thesis does not seek to discard Occam's Razor, but to determine if its standard mathematical vindication is a mirage created by idealisation. By sharpening the concepts of fragility and stability, and distinguishing the logic of weighting from the logic of ordering, this project aims to provide a rigorous account of simplicity for agents who must think within time limits. If successful, it will redefine the conditions under which simplicity is a guide to truth, moving from a theorem about limits to a constraint on bounded rationality.
