  1. The correspondence table

  In this analogy, **Source Code** corresponds to folk psychology or social norms—the intentional stance descriptions used by agents. **Machine Code** maps to neurophysics or atomic states—the physical stance underlying everything. The **Compiler** represents evolutionary and developmental processes that translate genetic and environmental inputs into neural architecture over deep time. **Intermediate Representations (IR)**, like LLVM IR or SSA form, correspond to cognitive modules or institutional structures. These are stable patterns that are neither pure physics nor high-level narrative but possess their own syntax and causal powers, acting as the locus for optimization. The **Running Process** is observable behavior or historical trajectory. The **Greedy Reductionist** is the physicist insisting only transistor states exist, dismissing higher levels as epiphenomenal.

  Opposing conclusions emerge clearly. Anti-reductionists argue that just as transistor inspection cannot reveal Photoshop's function without the source/IR layers, physics alone cannot explain mind; skipping intermediate cranes loses explanatory power and causal insight. They claim the IR layer is ontologically distinct. Defenders of greedy reductionism counter that the source code fully determines behavior via the compiler; there are no skyhooks in the machine. The IR is merely a compressed description of gate-level states, implying nothing is ontologically lost by reducing all the way down, even if pragmatically difficult. The debate hinges on whether the IR is a real causal layer or just a user-friendly map. Crucially, the anti-reductionist leverages the fact that compilers optimize at the IR level, not just the source or gate level, suggesting middle layers have unique causal efficacy. The reductionist replies that IR optimization is still just gate manipulation governed by rules, denying any magical emergence. The anti-reductionist insists that without the IR concept, the optimization itself is invisible, rendering the explanation incomplete. The reductionist maintains visibility is not ontology.

  2. The breaks

  The analogy breaks where engineering meets evolution. Compiler stacks are designed top-down with clean abstraction boundaries; LLVM IR exists because engineers chose modularity to manage complexity. Biology lacks this deliberate architecture. There is no evidence of a neural "SSA form" or a clean separation between cognitive "source" and physical "machine." Instead, evolution produces accumulated kludges—patched systems where function is distributed messily across layers.

  In software, IRs have defined syntax and optimization passes. In the brain, "intermediate" structures like heuristics or cultural memes exist, but they are not syntactically isolated from the substrate. A bug in psychology is often a bug in chemistry; you cannot patch the "source" without altering the "hardware." Furthermore, compilers are deterministic translators. Evolution is a blind, stochastic search process without a final specification. It does not build layers to facilitate explanation; it builds structures to facilitate survival.

  Importing the compiler model smuggles design into nature. It assumes nature respects abstraction boundaries because engineers do. But biological causality is continuous. While cognitive science posits modules, these are functional descriptions, not physically isolated components like a register allocation graph. The "optimization" in evolution is fitness, not execution speed, and it often sacrifices architectural cleanliness for immediate adaptive value.

  Crucially, compiler IRs are causally efficacious because the compiler *enforces* them. The hardware expects specific IR inputs. In biology, there is no enforcer. Psychological regularities emerge from neural dynamics, but they do not constrain those dynamics with the rigidity of a type system. If the analogy assumes biology has rigid intermediate layers with their own ontology, it misrepresents the fluidity of neural plasticity and cultural evolution. The "layers" in mind are likely fuzzy attractors in a dynamic system, not discrete compilation stages. This suggests the software stack imports a rigidity that biology does not possess, potentially falsifying the premise that middle layers have the same kind of explanatory autonomy as compiler IRs.

  3. Which breaks matter for Dennett

  For Dennett, the critical distinction is between cranes (natural, mechanistic support) and skyhooks (miraculous, unsupported lift). The software analogy risks conflating layered explanation with anti-reductionism. The existence of compiler IR does not prove irreducibility; it proves mechanistic complexity. LLVM IR is fully reducible to gates; it is a crane, not a skyhook.

  Cosmetic disanalogies matter less than structural ones. The structural risk is assuming that because we *need* IR to understand the compiler, the IR must be ontologically distinct from the gates. Dennett agrees we need intermediate levels for explanation (competence without comprehension), but he insists they are mechanically grounded.

  The analogy fails if it suggests IRs are skyhooks. They are designed cranes. The break matters only if one claims biological layers are *not* mechanically reducible. If the anti-reductionist uses the IR to claim physics *cannot* explain mind, they misuse the analogy. Dennett would agree IRs are necessary for practical explanation but deny they escape physical determination.

  However, the analogy clarifies why greedy reductionism fails. Looking only at silicon is technically sufficient but explanatorily bankrupt. The IR shows that higher-level patterns are real causal structures, even if reducible. Thus, the analogy distinguishes cranes from skyhooks correctly only if one accepts that cranes are real but physical. If the anti-reductionist demands the IR be *more* than physical, the analogy collapses. Dennett's argument survives only if intermediate layers are viewed as robust, compressible patterns within physics, not escapes from it.

  4. Verdict on the conclusion

  The anti-greedy conclusion survives, but not for the reasons anti-reductionists usually claim. The necessity of studying psychology does not rely on physics being insufficient, but on explanation being relative to interest. The software analogy supports this: physics explains the gate, psychology explains the photo edit. Both are true, but only one aids understanding.

  However, the conclusion was partially carried by the hidden assumption of engineered layers. If biology lacks clean IRs, the pragmatic necessity of middle layers is even stronger, not weaker. Without clean layers, reduction is not just hard; it's computationally intractable. The analogy collapses if it implies biological layers are as clean as compiler IRs. It needs repair to acknowledge the messiness of evolution. Software suggests hierarchy; biology offers heterarchy.

  Ultimately, the analogy survives as a defense of *explanatory* autonomy, not *ontological* independence. It shows why skipping cranes is stupid, not why physics is wrong. But it risks implying design where there is none. The anti-reductionist wins the pragmatic battle (you must study psychology) but loses the ontological war (physics is still the base). The analogy holds if stripped of the claim that IRs are magical. It fails if used to suggest biology has a designer's architecture. Therefore, the conclusion stands: you cannot skip the middle. But the reason is intractability, not causal breaks. The analogy requires heavy repair to remove the teleological baggage of "compiler" and "code," replacing them with "emergent regularities" and "dynamic constraints." Without this repair, the analogy falsely implies a designer.

  5. A better analogy, if there is one

  A better analogy is ecological succession. Bare rock (physics) supports lichen (simple chemistry), which creates soil through decay (complex chemistry), supporting grass, then shrubs, then forest. Each layer builds on the previous (cranes), creating new conditions for the next. No designer plans the soil; it emerges from decay. Predicting the forest from rock is impossible, yet the forest is physical.

  This captures bottom-up sufficiency without designed layers. It shows why skipping levels fails (soil properties aren't in the rock) without invoking skyhooks. Unlike the compiler, there is no "source code" or "IR." There are only interacting agents modifying their environment. This aligns with Dennett's view of mind as evolved competence. The "layers" are temporal and functional, not architectural. It explains why reduction is possible in principle but useless in practice: the historical path matters. This preserves mechanistic integrity while acknowledging emergent novelty, avoiding smuggled design.
