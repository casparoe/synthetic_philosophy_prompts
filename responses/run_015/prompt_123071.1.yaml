  **1. The Completed IRB Form**

  **APPLICATION FOR TEMPORARY SUSPENSION OF UNIVERSAL ETHICAL OBLIGATIONS ON TELEOLOGICAL GROUNDS**
  **Form ID:** FT-1843-A
  **Date:** Pre-Exilic Era

  **1. Project Title:** Protocol 22-Alpha: Filial Offering via Teleological Suspension.
  **2. Principal Investigator:** Abraham of Ur. **Credentials:** Patriarch; Recipient of Covenant Promise; Father of Nations.
  **3. Brief Summary of Procedure:** PI will transport Subject (Isaac, male, juvenile) to Mount Moriah. PI will construct altar, bind Subject, and elevate sacrificial blade. Procedure terminates upon Divine Intervention or completion of offering. Duration: Three days travel, plus execution time. PI will maintain silence regarding intent to Subject and spouse to prevent ethical mediation.

  **4. Risk-Benefit Analysis:**
  *Risk:* Permanent loss of Subject; violation of paternal duty; psychological distress (PI and Subject); social ostracization. Immediate ethical condemnation by community.
  *Benefit:* Affirmation of Absolute Relation to the Absolute; retention of Subject through faith.
  *Note:* Standard risk assessment assumes finite loss. PI operates under absurd expectation of regaining Subject in this life despite finite impossibility. Risk is infinite, but faith calculates differently.

  **5. Statement of Conflict with Universal Moral Law:** Procedure explicitly violates Universal Ethical Norms (UEN) regarding child endangerment and homicide. UEN dictates father's duty is to preserve son. PI acknowledges this duty remains valid ethically but is hereby suspended teleologically. This is not a rejection of the universal but a temporary sidelining for a higher end (Telos). The ethical is the universal, applicable to all. The PI claims exception not as privilege, but as particularity before God. Mediation via general rules is impossible here. The universal demands disclosure; faith requires silence.

  **6. Justification of Teleological Suspension:** PI is not a Knight of Infinite Resignation (who accepts loss eternally and finds peace in pain). PI is a Knight of Faith. PI believes by virtue of the absurd that he will kill Isaac and yet receive Isaac back in this life. The suspension is justified solely by the particularity of the PI's relation to God, which cannot be mediated by universal categories. No general rule applies. To explain the action is to abolish the faith. The justification is silence. The ethical is not abolished but suspended; it will return only after the trial.

  **7. Measures to Protect the Subject (Isaac):** Subject will be kept unaware until final moments to preserve innocence. Contingency Plan: Divine provision of substitute animal (ram) anticipated at T-minus 0. Ethical obligation to Subject resumes immediately upon Divine stop-order. PI accepts guilt for intent, regardless of outcome. PI understands he is a murderer in the eyes of the universal, even if saved by the particular.

  **8. Expected Outcomes:** Successful demonstration that faith is a paradox inaccessible to mediation. Subject survives. PI retains ethical standing only through the suspension, not by abolishing ethics permanently. The universal is re-established only after the particular trial.

  **9. Compliance Officer's Footnote:** *This application cannot be approved under standard University Ethical Guidelines. The Universal cannot adjudicate the Single Individual. If PI is correct, this form is irrelevant because he stands above the universal. If PI is incorrect, this form is evidence of murder. Committee recuses itself. There is no higher authority to sign this. File sealed.*

  ***

  **2. Commentary on Satirical Targets**

  This parody targets the incompatibility between Hegelian universal ethics and Kierkegaardian existential faith. The IRB form represents the "Universal," a system designed to categorize all actions under general rules for communal safety. By forcing Abraham to fill it out, the satire highlights the scandal of the "Single Individual" who stands higher than the universal.

  Section 5 and 6 specifically target the distinction between the "Knight of Infinite Resignation" and the "Knight of Faith." Bureaucracy understands resignation (accepting loss); it cannot process faith (believing in the absurd return of the lost). The form's demand for "Justification" clashes with Kierkegaard's insistence that faith cannot be mediated or explained linguistically without becoming mere ethics.

  Section 9 exposes the limit of institutional oversight. The Compliance Officer recognizes that if Abraham is truly a knight of faith, no human committee has the jurisdiction to judge him. Conversely, if he is not, he is merely a criminal. The form thus demonstrates that the teleological suspension cannot be codified; to make it routine is to destroy the very particularity that defines it. The bureaucracy collapses because the absolute relation to the absolute admits no third-party verification.
