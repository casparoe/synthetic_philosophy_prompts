answer: |-
  Your friend isn't logically cheating, but he is **begging the question** in a way that lets him hide the cost until you corner him. He is running a standard **Manipulation Argument for Hard Incompatibilism** (likely inspired by Derk Pereboom or Alfred Mele).

  The argument is valid. If you accept (1), (2), and (3), (4) follows. The "cheat" is that Premise (1) smuggles in a definition of "up to you" that makes responsibility impossible by fiat, and his willingness to "eat the consequence" regarding reasons reveals he has shifted the goalposts from *Moral Responsibility* to *Metaphysical Origination*.

  Here is the breakdown of where the argument breaks, the name of the equivocation, and the price you pay to fix it.

  ### The Broken Step: Premise (1)

  **Premise (1):** *If an action is fully produced by causes you didn't choose and can't now control, and you act exactly as those causes determine, then the action isn't up to you...*

  This is the weak link. It relies on an **Equivocation between "Blind Causes" and "Rational Constraints."**

  Premise (1) treats *all* determining factors as morally equivalent. It lumps together:
  1.  **Alien Causes:** Brain tumors, hypnosis, neuroscientists rewiring your lobes.
  2.  **Constitutive Causes:** Your genetics, your upbringing.
  3.  **Rational Constraints:** Evidence, logic, moral arguments, the suffering of others.

  Your friend's argument works only if (3) is true: that there is no responsibility-relevant difference between a neuroscientist forcing a desire into your head and you recognizing a good reason to act.

  **The Equivocation:**
  The term "cause" in (1) does too much work.
  *   In the **Manipulation Case (2)**, the causes *bypass* your agency. The neuroscientists arrange it so you *must* want the wallet. Your rational faculties are hijacked.
  *   In the **Ordinary Case**, causes (including genes/environment) work *through* your agency. They shape *who you are*, but when you act, you act via your capacity to weigh reasons.

  By refusing to distinguish between **determination by blind forces** and **determination by reasons**, Premise (1) defines "free will" as **Ultimacy** (being the uncaused cause of yourself) rather than **Ownership** (acting in accordance with your own rational nature).

  ### The "Reasons Excuse" Trap

  When you pointed out that his logic implies "the better your reasons, the less responsible you are," he admitted it. **This is where he changes the subject.**

  *   **Moral Responsibility** is inherently about responsiveness to reasons. To hold someone responsible *just is* to treat them as an agent who can recognize and act on moral considerations.
  *   **Metaphysical Responsibility** (what your friend is defending) is about being the "prime mover" of the universe.

  By saying "responsibility was never about responsiveness to reasons," he is admitting that he isn't talking about the kind of responsibility we use in courts, relationships, or ethics. He is talking about a theological or metaphysical status. If you reject the "Reasons Excuse," you reject the core of his incompatibilism.

  ### The Price of Rejecting (1)

  If you reject Premise (1), you become a **Compatibilist** (specifically, a **Reasons-Responsive Compatibilist**, like John Martin Fischer).

  **What you pay:**
  1.  **You lose "Ultimacy":** You must admit that you are not the *ultimate source* of your actions. You did not choose your parents, your genes, or the laws of physics. You cannot step outside the causal chain to start it.
  2.  **You lose "Could Have Done Otherwise" (in the strict sense):** In the exact same circumstances, with the exact same brain state and history, you could not have done otherwise.

  **What you keep:**
  1.  **You keep "Ownership":** An action is "up to you" if it issues from *your* deliberative mechanisms, not external coercion.
  2.  **You keep the Manipulation Intuition (2):** You can still say the manipulation victim isn't responsible. Why? Because in the manipulation case, the causal history **bypasses** or **corrupts** the rational mechanism. In the ordinary determined case, the causal history **constitutes** the rational mechanism.
      *   *Correction to (3):* There *is* a difference. The manipulation case is like a puppet; the ordinary case is like a program running its own code. Both are determined, but only one is *authentic*.
  3.  **You keep Moral Responsibility:** You preserve the link between freedom and reasons. Randomness is not freedom; it is noise. Freedom is acting according to your own reasons, even if those reasons were determined by the past.

  ### Summary for Your Next Argument

  Tell him this:

  > "You're begging the question in Premise (1). You define 'up to you' as 'uncaused by the past.' But that's not what moral responsibility is. Moral responsibility is about **guidance control**, not **regulative control**.
  >
  > If you stick with (1), you have to accept that a psychopath who can't process moral reasons is just as free as a saint who acts on perfect reasons, provided the psychopath's impulses are 'random' enough.
  >
  > I reject (1). I say an action is 'up to me' if it flows from my own rational faculties, even if those faculties were shaped by things I didn't choose. That lets me keep the intuition that manipulation (2) removes responsibility (because it bypasses my faculties) without accepting that ordinary determinism does the same."

  **The Verdict:** The break is in **(1)**. The cost is **Libertarian Free Will**. The gain is **Moral Sanity**.
