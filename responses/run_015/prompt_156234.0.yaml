  Act as an expert historian of medieval Islamic philosophy with particular attention to Ash'arite metaphysics and the Tahafut al-Falasifa. Before answering, take a moment to identify the key distinctions al-Ghazali draws between custom (al-'ada), necessary connection, and direct divine creation; then audit the following characterization step by step, separating accurate captures from simplifications and misrepresentations.

  A recent popular article summarizes al-Ghazali's occasionalism like this: Al-Ghazali argued that nature has no real powers at all, so fire does not burn cotton—God burns the cotton every time fire is near. He thought the regularity we see is just a habit God formed, like a programmer repeating a loop, and since God could change the loop at any moment, miracles are just God running a different subroutine. Human actions are the same: we do not really choose anything; God creates our movements and our accompanying desires at the same instant, so the idea of acquisition (kasb) is just theological window dressing to avoid saying people are puppets. In effect, he replaced Aristotelian natural causation with a kind of constant divine micromanagement, leaving science to study correlations that have no underlying causal structure.

  How fair is this summary? Go claim by claim: which parts capture al-Ghazali's actual position in the Tahafut and related Ash'arite texts, which are standard simplifications a specialist might accept with caveats, and which misrepresent his view—especially regarding human agency, the metaphysical status of custom, and the philosophical (rather than merely theological) motivation for denying necessary causation? In particular, does the programmer-and-subroutine analogy obscure something important about his account of divine power and contingency? And does the conclusion that science studies correlation without any causal structure actually follow from his arguments?

  Please structure your response with clear sections for accuracy, misrepresentation, and overall assessment. At the very end, on its own line, write: Verdict: [a short phrase summarizing the overall fairness of the summary].
