answer: |-
  You are right to feel that the standard labels don't quite stick. Goodhart's Law describes what happens *after* a metric is chosen and then corrupted; the Streetlight Effect describes *where* someone looks, but not *why* they keep building stronger lights in that same spot. Your observation is sharper than both: you have identified a system that selects for measurability, drifts toward optimizing the measure rather than the goal, and then reinforces that choice by generating more data for the measurable option and none for the other.

  To answer your question directly: There is no single, perfect dictionary term for the entire three-part cycle. However, the "part that isn't Goodhart" (your first and third cases) is best described by an established concept called **Quantification Bias** (sometimes called the McNamara Fallacy). The drift (your second case) is best described by **Surrogation**. The feedback loop you identified—where funding creates data which justifies more funding—is what I will propose calling **Measurement Lock-In**.

  Is this one phenomenon or two? It is one root cause with two faces. The root cause is a demand for **legibility**. Institutions (even student clubs) prefer decisions they can defend with numbers. This demand acts as a filter (selection) and then as a compass (drift). Once you follow the compass, you generate a map (data) that makes it impossible to justify going off-road next time (feedback). So, it is one phenomenon: a preference for legibility that hardens into a constraint over time.

  Here is the carving you asked for. The edges of this concept depend on intent and outcome. If you choose the measurable option *knowing* it is inferior but necessary for accountability, that is a trade-off, not a bias. If you choose it because you mistakenly believe the number *is* the value, that is the bias. The phenomenon exists when the availability of evidence outweighs the importance of the outcome in the decision-making process.

