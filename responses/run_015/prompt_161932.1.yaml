  | candidate_name | status (established term, or a name you are proposing yourself) | definition_in_your_own_words | which_face_of_my_pattern_it_covers (selection / drift / feedback / none) | where_it_fits_my_cases | where_it_misfits | verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **McNamara Fallacy** | established term | Making decisions based only on what can be easily measured, ignoring everything else because it seems uncertain or soft. | selection | Fits Case 1 (nets vs. housing) and Case 3 (tutoring vs. discipline). | Doesn't explain why the metric changed in Case 2, or why the choice makes future choices harder. | partial |
  | **Surrogation** | established term | When a measure of success accidentally replaces the actual goal, so people optimize for the score instead of the outcome. | drift | Fits Case 2 perfectly (nets delivered vs. nets used). | Doesn't explain why the housing union was rejected in Case 1; assumes a metric already exists. | partial |
  | **Measurement Lock-In** | a name you are proposing yourself | A cycle where funding a measurable project creates data that justifies funding it again, while unmeasurable projects starve and vanish. | feedback | Fits the "feed on itself" dynamic you described across all three years. | Not a standard dictionary term yet; describes the consequence, not the psychology. | exact |
  | **Goodhart's Law** | established term | When a measure becomes a target, it ceases to be a good measure, usually because people game the system to hit the number. | drift | Fits the risk in Case 2 (tutors sitting idle to log hours). | You explicitly said no one was gaming; the number was honest but incomplete. | wrong |
  | **Quantification Bias** | established term | A cognitive preference for numerical evidence over qualitative evidence, even when the numbers are less important. | selection | Fits Case 1 and 3 (choosing the option with a spreadsheet). | Doesn't capture the systemic feedback loop or the metric drift over time. | partial |

  ### Boundary-Cases Table

  | case | counts_as_the_phenomenon (yes / no / borderline) | one_sentence_reason |
  | :--- | :--- | :--- |
  | **the unmeasurable option is in fact the worse one** | no | The bias is about *how* you decide, not the outcome; if the measurable choice is objectively better, selecting it for its clarity is prudence, not error. |
  | **the number being tracked is openly declared to be a proxy for a good nobody can measure directly** | borderline | It counts if the proxy is treated as the truth over time, but doesn't count if the group constantly acknowledges the gap and adjusts for it. |
  | **the club spends its whole budget on building a way to measure the housing work instead of funding either option** | yes | This is the extreme end of the trap: valuing the ability to measure over the actual good, effectively delaying help indefinitely for the sake of legibility. |
  | **the metric perfectly captures the outcome with zero loss of meaning** | no | If the measure and the goal are identical, there is no distortion, so the "bias" toward measurement disappears because nothing is being left out. |
