      *   *Critique:* Don't ignore the "ethics" entirely since the user mentioned it, but respect the constraint to skip Total/Average utilitarianism. Focus on *normative barriers* instead (e.g., antinatalist cultural narratives).
      *   *Refinement on Thresholds:* Make sure to distinguish between *fiscal* thresholds (pensions) and *civilizational* thresholds (innovation/culture). The latter is more neglected.

  12. **Final Polish:** Ensure the tone is respectful of the foundation's capacity and the user's intellectual level. (Avoid explaining basic demography, focus on the marginal research value).

  *(Self-Correction on the "Personal" aspect)*: The user asked for a defended agenda for the *foundation*, but acknowledged the personal tangle. I should not give advice on whether *they* should have a kid, but I can acknowledge how their research might inform that. I will keep the focus on the foundation agenda as requested.

  *(Final check on constraints)*: 3 years is short. Emphasize *synthesis* and *modeling* over longitudinal data collection. They need to use existing data to answer new questions.

