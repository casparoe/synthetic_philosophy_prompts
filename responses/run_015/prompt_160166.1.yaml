      *   **Self-Critique:** Where does this fail? The piano scene. Improvisation within repetition. That looks like genuine agency, not just subroutine execution. Also, the "Point-Deletion" test might assume "point" = "external consequence," which begs the question.

  6.  **Refining the Argument (The "Push"):**
      *   I need to be careful not to just say "it's compatibilism." I need to use the Sphex analogy to *trouble* that reading.
      *   *Thesis:* The film uses the loop to strip away consequentialist freedom, forcing us to confront whether "character" is just a fancy word for "complex programming."
      *   *The Twist:* Phil's knowledge of the loop makes him *more* sphexish in a way. He exploits the determinism. But his moral growth looks like debugging code.
