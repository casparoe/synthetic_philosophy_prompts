prompt: |-
  I'm currently taking a philosophy of science course focused on the conceptual foundations of quantitative genetics, and after a seminar debate about whether heritability coefficients justify policy inferences, I remain unconvinced by the popular gloss that traits like intelligence are mostly genetic and therefore resistant to intervention. To explore this further, I'm preparing an interview for our department's student podcast with an unnamed philosopher of science who defends a strict variance-partition interpretation of heritability: she holds that h² is exclusively a population-relative index measuring the proportion of phenotypic variance attributable to genetic variance within a specific environmental range, carrying no direct implications for individual causation, cross-context stability, or the efficacy of social programs.

  She also advances a more specific position she calls the dynamic canalization thesis, which claims that reducing environmental variance through policy does not merely lower heritability estimates but can alter the underlying genetic architecture being measured—meaning that comparing heritability across different intervention regimes compares conceptually different genetic contributions. I want eight to ten interview questions that press her on the mechanics of this view rather than allowing restatement. Specifically, include at least one question on the distinction between heritability and genetic determinism, with a follow-up keyed to the reply that genes still cause within-population differences; at least one on whether cross-population or cross-policy application of heritability commits an ecological fallacy, with a follow-up addressing her likely appeal to twin-study robustness; at least one directly challenging the dynamic canalization thesis by asking what empirical pattern would falsify the architecture-shifting claim; and at least one asking what evidence could genuinely weaken her overall position, anticipating the deflection that heritability is merely a statistical descriptor with no normative or causal load. Maintain a formal, colloquium-level tone throughout, and conclude with a single line beginning "Interview arc:" that summarizes in one sentence the strategic progression of the questions.
