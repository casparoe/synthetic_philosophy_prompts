prompt: |-
  I sit on the internal review panel of a large hospital trust, and next month I have to spend forty minutes with the trust's clinical safety committee explaining why the readmission-risk score we are about to procure cannot simultaneously satisfy the three fairness properties the committee has written into its own procurement specification.

  The setting: discharged medical patients are ranked by a model that outputs a probability of unplanned readmission within thirty days. The two hundred highest-scoring patients per month get two home visits from a district nurse; everyone else gets usual care. The committee's specification demands that the score be (a) calibrated within each of the two patient groups the trust monitors under its equality duties — call them A and B, with observed readmission rates of roughly 22% and 11% respectively; (b) such that, among patients who would not have been readmitted, the false-positive rate is equal across A and B; and (c) such that, among patients who would have been readmitted, the false-negative rate is equal across A and B. The vendor has told them all three are achievable. They are not, except in edge cases.

  Plan how I teach this, rather than teaching it to me. Specifically:

  State the order in which the components have to arrive and what each depends on. I take it that the group-difference in base rates has to be on the table before the conflict can even be stated, and that calibration has to be cashed out as a statement about what a number means rather than about how accurate it is — but tell me the sequence you would actually use, and why the alternatives fail (e.g. why opening with the algebra, or with the definitions of the three criteria, or with an abstract example involving coins or urns, leaves the committee with the wrong picture).

  Give me the one worked example that carries the whole session, and say what it must contain and what it must not. My instinct is a small fictitious table of scores and outcomes for a dozen patients, built so that the three criteria visibly pull apart, but I want to know which features are load-bearing — differing base rates, a score that is genuinely informative but nowhere near perfect, a scarce and genuinely beneficial intervention — and which features would mislead by importing a separate moral problem (training-label bias, a proxy variable doing the work, an intervention that harms some patients).

  Map the misconceptions this audience will predictably bring or form, and say at which point in the sequence each should be defused. The ones I anticipate: that fairness just is not using group membership, so the fix is to delete it from the data; that an impossibility theorem means the score is biased and should therefore be rejected outright; that the conflict is a small technical wrinkle we can split the difference on by approximately satisfying all three; that equalising the share of visits going to A and to B is the same as any of (b) or (c); that calibration is a claim about individuals. Add the ones I have not thought of, including the ones specific to clinicians rather than to statisticians.

  Two complications I will have to handle, and I want them placed deliberately rather than bolted on. First, the committee will ask that the three criteria hold not only for A and B but for every subgroup anyone can name — each ward, each admitting diagnosis, each comorbidity. I want to know where in the sequence that demand belongs and what it does to the argument, including what a relaxation to "calibrated on average within every efficiently-identifiable subgroup" would buy us. Second, the two hundred slots are a hard capacity constraint, not a threshold; tell me where the fixed-budget framing should enter and what it does to the menu of criteria, since I suspect it makes some of the committee's phrasing incoherent.

  Tell me what I should openly decline to explain at this level and say so out loud — I assume causal or counterfactual notions of fairness, and the fact that patients who receive the visits have their readmission outcome partly determined by the visit itself, so that the very error rates in (b) and (c) are only partly observable.

  Finally, give me one question to close on that would show me the idea had landed rather than that the committee had merely been impressed: my candidate is to double the nurse capacity and ask whether the conflict persists, but I suspect a better version changes something about the base rates or the score's accuracy instead, so propose the version that actually discriminates between understanding and deference.

  Write the plan in British English, and do not point me to papers, vendors, or reading.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Internal review panel member at a large hospital trust.
      *   **Audience:** Clinical Safety Committee (clinicians, administrators, likely some governance leads).
      *   **Task:** Explain why a readmission-risk score *cannot* simultaneously satisfy three fairness properties (Calibration, Equal False Positive Rate, Equal False Negative Rate) given different base rates.
      *   **Time:** 40 minutes.
      *   **Constraints:** British English, no references to papers/vendors/reading, specific structural requirements (sequence, worked example, misconceptions, complications, declinations, closing question).
      *   **Key Technical Fact:** The "Impossibility Theorem" (often attributed to Chouldechova or Kleinberg et al.) regarding fairness metrics under different base rates.
      *   **Specific Complications:** Subgroup proliferation (intersectionality), fixed capacity constraint (top 200 vs. threshold), causal/counterfactual limitations.

  2.  **Deconstruct the Technical Core:**
      *   *Base Rates:* Group A = 22%, Group B = 11%.
      *   *Criteria:*
          1.  Calibration (within groups): $P(Y=1 | Score=s, Group=g) = s$.
          2.  Equal FPR (among $Y=0$): $P(Score > t | Y=0, A) = P(Score > t | Y=0, B)$.
          3.  Equal FNR (among $Y=1$): $P(Score \le t | Y=1, A) = P(Score \le t | Y=1, B)$.
      *   *Conflict:* If base rates differ ($P(Y=1|A) \neq P(Y=1|B)$), you cannot have Calibration + Equal FPR + Equal FNR simultaneously (unless perfect prediction or equal base rates).
      *   *Capacity Constraint:* Top 200 patients, not a fixed threshold $t$. This complicates the standard threshold-based definitions of FPR/FNR.

  3.  **Drafting the Plan - Section by Section:**

      *   **Sequence of Components:**
          *   *Goal:* Build intuition before math. Avoid abstract algebra first.
          *   *Step 1: The Clinical Reality (Base Rates).* Must start here. If risks are different, predictions must reflect that to be calibrated.
          *   *Step 2: What Calibration Means.* It's about trust in the number.
          *   *Step 3: The Intervention (Capacity).* Top 200. This defines the threshold dynamically.
          *   *Step 4: The Conflict.* Show how satisfying one breaks the others given Step 1.
          *   *Why not algebra first?* Clinicians glaze over. Why not definitions first?* They sound compatible until applied to data. Why not coins/urns?* Too abstract; needs clinical stakes.

      *   **The Worked Example:**
          *   *Needs:* Small table, clear base rate difference, imperfect model, fixed capacity.
          *   *Must Not:* Introduce bias in labels, harmful interventions, or proxy variables. Keep it clean.
          *   *Load-bearing:* Base rate difference is the engine. Imperfect prediction is the friction. Capacity constraint is the lever.
          *   *Structure:* 20 patients (10 A, 10 B). A has ~2 readmits, B has ~1 readmit. Scores reflect this. Show the cut-off.

      *   **Misconceptions:**
          *   *Blindness:* "Remove group label." (Refute: Base rates differ, model needs context to be calibrated).
          *   *Rejection:* "Impossible = Biased = Trash." (Refute: Trade-off, not defect).
          *   *Approximation:* "Close enough." (Refute: Mathematical tension, not engineering tolerance).
          *   *Demographic Parity:* "Equal visits." (Refute: That's a different metric, not FPR/FNR).
          *   *Individual Calibration:* "This patient's risk is exactly 22%." (Refute: It's group-level frequency).
          *   *Clinician Specific:* "Risk is clinical, not statistical." (Refute: Model predicts probability, not pathology).
          *   *New:* "We can reweight the loss function." (Refute: Doesn't solve the base rate math).

      *   **Complications:**
          *   *Subgroups:* "Every ward/diagnosis." This leads to small sample sizes and worse calibration. Place this *after* the main conflict is established. Relaxation: "Calibrated on average" (multi-calibration).
          *   *Capacity Constraint:* Top 200 vs. Threshold. This makes FPR/FNR dependent on the score distribution, not just a fixed $t$. Place this *before* the conflict demonstration. It changes the criteria from "threshold $t$" to "rank $k$".

      *   **Declinations:**
          *   Causal fairness (what *would* have happened).
          *   Impact of the visit on the outcome (interference).
          *   Why: We are evaluating the *score*, not the *policy impact* yet.

      *   **Closing Question:**
          *   User's idea: Double capacity. (Doesn't solve base rate issue).
          *   Better idea: Equalise base rates (clinically impossible) or Perfect Prediction (impossible).
          *   Best idea: Ask them to choose *which* criterion to drop. This forces ownership of the trade-off.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Tone:* Professional, authoritative but collaborative, British English (e.g., "programme", "centre", "modelling").
      *   *Capacity Constraint Nuance:* The prompt notes the criteria are phrased as FPR/FNR (threshold-based), but the policy is Top 200 (rank-based). I need to explain how this makes the committee's phrasing slightly incoherent or at least dynamic. The threshold $t$ moves until 200 are selected.
      *   *The "Why":* Ensure the explanation of *why* the sequence matters is clear.
      *   *Subgroups:* Emphasise the "small numbers" problem.
      *   *Closing:* The question needs to test if they understand the *source* of the conflict (base rates), not just the existence of it. If base rates were equal, would the conflict exist? No. So ask about base rates.

  5.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No papers/vendors? Yes.
      *   40 mins context? Yes (plan needs to fit).
      *   All specific prompts answered? Yes.

  6.  **Writing the Plan:** (Drafting the response following the thought process).
      *   *Structure:*
          1.  Sequence & Dependencies.
          2.  The Worked Example.
          3.  Misconceptions & Defusal.
          4.  Complications (Subgroups & Capacity).
          5.  Declinations.
          6.  Closing Question.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "Top 200" constraint. Standard impossibility theorems usually assume a fixed threshold. With a fixed quota, the threshold varies. This actually *exacerbates* the calibration issue if the score distributions differ. I need to make sure the plan highlights that the "threshold" is endogenous.

      *(Refining the Closing Question)*: The user suggested doubling capacity. I should propose a question that isolates the base rate variable. "If we could medically equalise the underlying readmission risk between A and B tomorrow, would this statistical conflict disappear?" This tests if they understand the *source* is the base rate, not the model.

      *(Refining the Worked Example)*: Keep it very simple. 10 patients per group. A: 3 events. B: 1 event. Scores must reflect this. Show the cut-off for top 5 (to simulate capacity).

      *(Refining Misconceptions)*: Add the "Fairness through Unawareness" misconception strongly. Also the "Clinical Judgement overrides" misconception.

      *(Refining Declinations)*: Be firm on the Counterfactual. We cannot know the FNR/FPR truly because the intervention changes the outcome. We are assessing the *score's prediction of natural history*, not the *policy's outcome*.

      *(Final Polish)*: Check British spelling (calibre, programme, centre, modelling, anaesthesia - though not relevant here, just tone). Ensure the tone is respectful of clinical expertise but firm on statistical reality.

  7.  **Final Output Generation** (Proceeding to generate response based on these points).
answer: |-
  **Teaching Plan: The Impossibility of Simultaneous Fairness Metrics**

  **Time Allocation:** 40 minutes
  **Audience:** Clinical Safety Committee (Clinicians, Governance Leads, Administrators)
  **Objective:** To demonstrate that the procurement specification demands a mathematical impossibility given the observed base rates, and to force a prioritisation of criteria.

  ---

  ### 1. Sequence of Components and Dependencies

  You must construct the argument in a specific causal chain. If you rearrange these, the committee will either dismiss the problem as theoretical or assume it is an engineering problem solvable by better tuning.

  **The Order:**
  1.  **The Base Rate Disparity (The Fact):** Establish that Group A and Group B have different underlying risks (22% vs 11%).
  2.  **The Capacity Constraint (The Policy):** Establish that we are selecting the top 200 ranked patients, not everyone above a fixed risk threshold.
  3.  **Calibration (The Meaning):** Define calibration as "when the model says 20%, roughly 20% of such patients are readmitted."
  4.  **The Conflict (The Proof):** Show how (1) + (2) + (3) makes the remaining criteria (Equal FPR/FNR) mathematically incompatible.

  **Why this sequence?**
  *   **Why not start with Algebra/Definitions?** If you open with the definitions of Equalised Odds (FPR/FNR) and Calibration, clinicians will treat them as a checklist of features the vendor should simply 'switch on'. They view software as malleable. You must show them the *data* drives the constraint, not the code.
  *   **Why not start with Abstract Examples (Coins/Urns)?** This distances the problem from clinical reality. Clinicians will argue that patients are not coins. You need them to feel the weight of the 22% vs 11% disparity immediately.
  *   **Why Base Rates first?** This is the independent variable. If base rates were identical, the conflict would vanish. By anchoring here, you locate the 'fault' in the epidemiology of the population, not the bias of the algorithm. This prevents the committee from demanding the vendor 'remove bias' to solve a math problem.
  *   **Why Capacity before Conflict?** The specification speaks of FPR/FNR (threshold concepts), but your policy is a quota (rank concept). You must clarify that the threshold is *endogenous* (determined by the score distribution) before showing why the metrics break. If you leave this until later, they will argue you can just 'adjust the threshold' to fix the rates, not realising the threshold is fixed by the nurse budget.

  ---

  ### 2. The Worked Example

  Do not use a slide of equations. Use a single, static table projected on the screen. It must be small enough to be read in ten seconds but rigorous enough to withstand scrutiny.

  **The Setup:**
  *   **Cohort:** 20 discharged patients (10 Group A, 10 Group B).
  *   **Base Rates:** Group A has 3 readmissions (30%); Group B has 1 readmission (10%). *Note: Exaggerate the difference slightly for clarity, but acknowledge the real rates are 22% vs 11%.*
  *   **Model Output:** A risk score (0–100).
  *   **Capacity:** We can only visit the top 5 scorers (simulating the 200/month constraint).

  **The Table Content:**
  *   **Columns:** Patient ID, Group, Actual Outcome (Readmit: Y/N), Model Score.
  *   **Rows:** Sorted by Model Score (highest to lowest).
  *   **The Cut-off:** A line drawn after the 5th patient.

  **Load-Bearing Features:**
  *   **Differing Base Rates:** Essential. Without this, the conflict disappears.
  *   **Imperfect Prediction:** The model must get some high-risk patients wrong and some low-risk patients right. If the model is perfect, all metrics are satisfied trivially.
  *   **Score Distribution:** Group A patients should generally have higher scores than Group B, reflecting the base rate, but with overlap.

  **What to Exclude:**
  *   **Protected Characteristics:** Do not name the groups (e.g., do not say 'Ethnicity' or 'Deprivation'). Use 'Group A/B' to prevent immediate political defensiveness.
  *   **Intervention Effect:** Do not show what happens *after* the visit. The table is about *prediction of natural history*.
  *   **Training Data Bias:** Do not suggest the scores are wrong because of historical bias. Assume the scores are the best possible statistical estimate of the truth.

  **How to Walk Through It:**
  1.  Ask the committee to verify the model is **Calibrated**: Of those scoring ~30%, do roughly 30% readmit? (Adjust the dummy data so this holds roughly).
  2.  Apply the **Capacity Cut-off**: Select the top 5.
  3.  Calculate **FPR/FNR**: Count the false alarms and missed cases in each group.
  4.  **The Reveal:** Show that to make the FPR equal, you must move the cut-off. But moving the cut-off changes the number of patients selected (violating capacity) or breaks the Calibration (because you are now selecting from a different risk pool).

  ---

  ### 3. Misconceptions and Defusal Points

  You must anticipate and neutralise these objections at specific moments.

  | Misconception | When it will arise | How to defuse it |
  | :--- | :--- | :--- |
  | **"Fairness is Blindness"**<br>(Remove group membership from the data) | Immediately after stating the base rate difference. | **Defuse in Step 1.** Explain that if we ignore group membership, the model cannot be *Calibrated* for both. A score of 20% cannot mean 20% risk for both groups if their underlying risks differ. Blindness guarantees miscalibration. |
  | **"It's just a Threshold Problem"**<br>(We can tune the cut-off to balance the rates) | During the Worked Example. | **Defuse in Step 4.** Remind them the threshold is not a dial; it is a result of the fixed 200-patient budget. Moving the threshold changes the budget utilisation. |
  | **"Approximate is Good Enough"**<br>(We can get close to all three) | When the impossibility is stated. | **Defuse in Step 4.** This is not engineering tolerance; it is a zero-sum constraint. Improving FPR equality *mathematically necessitates* worsening Calibration or FNR equality given the base rates. |
  | **"Equal Visits = Fairness"**<br>(Demographic Parity) | When discussing the 200 slots. | **Defuse in Step 2.** Clarify that sending 100 nurses to A and 100 to B is a *different* criterion (Demographic Parity) than the one they specified (Equal Error Rates). Satisfying their spec does not guarantee equal visits. |
  | **"Clinical Judgement Overrides"**<br>(The nurse can decide on arrival) | Towards the end. | **Defuse in Declinations.** This panel is procuring a *triage tool*, not a clinical protocol. If the score is unfair, the triage is unfair, regardless of what the nurse does later. |
  | **"The Model is Biased"**<br>(Impossibility implies defect) | When the conflict is revealed. | **Defuse in Step 4.** Reframe: The model is not defective; the *specification* is inconsistent. It is like asking for a car that is both red and blue all over. |
  | **"Small Subgroups"**<br>(We need this for every ward/diagnosis) | During Complications. | **Defuse in Complications.** Explain the 'Small Numbers' problem. You cannot calibrate a model on a subgroup of 50 patients where only 5 readmit. The noise drowns the signal. |

  ---

  ### 4. Handling the Complications

  **Complication 1: Subgroup Proliferation ("Every ward/diagnosis")**
  *   **Placement:** Introduce this *after* the main conflict is understood, as an amplification of the problem.
  *   **The Argument:** Explain that the impossibility theorem holds for *any* grouping where base rates differ. If Ward X has different readmission rates to Ward Y, the conflict exists there too.
  *   **The Risk:** As you slice the data thinner (Ward + Diagnosis + Comorbidity), the sample size drops. Calibration becomes statistically unstable. A model calibrated on "Cardiology, Male, Over 80" might be wildly miscalibrated on "Cardiology, Male, Over 80, with Diabetes" simply due to noise.
  *   **The Relaxation:** Propose "Calibrated on Average" (Multi-calibration). We do not demand perfect calibration in every tiny slice, but we demand that there is no *identifiable* subgroup where the model is consistently wrong. This buys statistical stability but admits that some small groups will see local deviations.

  **Complication 2: Fixed Capacity (Top 200 vs. Threshold)**
  *   **Placement:** Introduce this *before* the Worked Example (Step 2 of Sequence).
  *   **The Impact:** The committee's specification uses threshold language (FPR/FNR), but the policy is a quota.
  *   **The Incoherence:** FPR and FNR are defined by a fixed risk threshold (e.g., "everyone above 50%"). But your policy is "everyone in the top 200". The risk threshold required to get 200 patients will fluctuate monthly.
  *   **The Consequence:** You cannot guarantee Equal FPR/FNR *and* Fixed Capacity *and* Calibration simultaneously. If you fix Capacity, the Threshold moves. If the Threshold moves, the Error Rates change. If Base Rates differ, the Error Rates will change *differently* for each group.
  *   **The Decision:** You must tell them they can have Fixed Capacity or Fixed Error Rates, but not both. Given the nurse budget, Capacity must win, which means Error Rates will inevitably diverge.

  ---

  ### 5. What to Decline to Explain

  You must explicitly state what is out of scope for this session to prevent the discussion from drifting into unsolvable philosophical or causal weeds. Say this verbatim:

  *"There are two critical questions I am not answering today, not because they are unimportant, but because they cannot be solved by the procurement specification alone.*

  *First, **Causal Fairness**. We are measuring prediction error against observed readmissions. We are not measuring what *would have happened* had the risk been different. We cannot statistically adjust for historical inequities in who got sick in the first place using this model.*

  *Second, **Intervention Interference**. The error rates we are discussing assume the nurse visit does not change the readmission risk. In reality, the visit might prevent the readmission. This means the 'False Positives' (those visited who wouldn't have readmitted anyway) are actually receiving beneficial care, and the 'True Positives' might not readmit *because* of the visit. We are evaluating the **score's ability to rank risk**, not the **policy's ability to reduce harm**. Conflating the two will make the mathematics incoherent."*

  ---

  ### 6. The Closing Question

  Do not ask about doubling capacity. That implies money solves the statistical tension. It does not; it only changes the threshold, not the base rate conflict.

  Do not ask about model accuracy. A perfect model solves the problem, but that is not a policy choice.

  **Ask this:**

  > "If we could medically intervene tomorrow to ensure Group A and Group B had the *exact same* underlying readmission rate, would this statistical conflict disappear?"

  **Why this works:**
  *   **If they say 'Yes':** They understand the source of the conflict is the base rate disparity (epidemiology), not the algorithm (technology).
  *   **If they say 'No':** They still believe the vendor can 'fix' the model, and you have failed.
  *   **The Follow-up:** "Since we cannot equalise the disease rates medically, which of the three fairness criteria are we willing to relax to accommodate the reality of the patient population?"

  This forces them to move from "Make it fair" (passive demand) to "Which unfairness do we prefer?" (active governance). It transfers the burden of the trade-off from the vendor to the committee, which is where it belongs.
