prompt: |-
  I do data viz for a public health org and we keep getting asked to make "infographics" that are basically just bar charts with clip art, and I want to push us toward something more like Neurath's pictorial language idea — the Isotype thing where you build diagrams of social facts out of standerdized little pictorial elements, like rows of the same person-figure to show a proportion, so the picture is grounded in countable material stuff instead of just a designer's spin. I want a decison procedure my design team can actually run step by step when we get a statistic we're supposed to turn into one of these panels. For each step I want the question to ask, what counts as a sufficient answer to it, and where the procedure says no and stops. The steps, in order: (1) whether the fact we want to show can even be represented in a pictorial language at all, and what kinds of things resist it — rates, abstractions, negatives, "lack of X," stuff that isn't a countable material thing; (2) how to pick and standardize the elements we build it out of, so the same element means the same thing across all our panels; (3) how to handle scale and proportion, i.e. when the row-of-100-figures trick is the right tool and when it misleads, and what to do when the number is too big or too small to count out by hand; (4) how to check the finished picture for the failure modes Neurath himself was worried about, like a picture that looks more precise than the data actually are, or one that quietly picks a side by what it makes visible and what it leaves out; and (5) where the procedure has to stop and hand the decision back to a person, because choosing which facts to foreground in the first place is an editorial or value call, not something the formalism settles. Mark which steps are judgment calls dressed up as procedure. Then run the whole thing on two concrete facts: the share of a city's households that don't have access to a car, and the change in a region's infant mortality rate over a decade. I suspect the second one hits a wall on a rate-of-change and I want to see exactly where and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a step-by-step decision procedure for a public health data viz team to move from "bar chart + clip art" to Neurath/ISOTYPE-style pictorial statistics.
      *   **Structure:** 5 specific steps (Suitability, Standardization, Scale/Proportion, Failure Modes/ Ethics, Editorial Handoff).
      *   **Requirements per Step:** Question to ask, sufficient answer, stop condition (where it says "no").
      *   **Meta-Requirement:** Mark which steps are "judgment calls dressed up as procedure."
      *   **Application:** Run the procedure on two specific cases:
          1.  Share of households without car access.
          2.  Change in infant mortality rate over a decade.
      *   **Hypothesis:** The user suspects the second case (rate of change) will fail. I need to verify *where* and *why*.

  2.  **Deconstruct the 5 Steps (Drafting the Procedure):**

      *   *Step 1: Suitability (Countability).* ISOTYPE relies on discrete, countable units.
          *   Question: Is this a count of discrete material entities?
          *   Stop: If it's a rate, index, abstract concept, or negative existence without a baseline.
      *   *Step 2: Standardization (The Unit).* Consistency is key to ISOTYPE.
          *   Question: Can we define a single icon that represents $X$ amount of the thing, and use it everywhere?
          *   Stop: If the unit varies by context or requires complex legend decoding per chart.
      *   *Step 3: Scale & Proportion.* Visualizing magnitude without distortion.
          *   Question: Can the numbers be rounded to a manageable base (e.g., 1 icon = 1,000) without losing critical precision?
          *   Stop: If the numbers are too vast (millions of icons) or too precise (decimals matter more than magnitude).
      *   *Step 4: Failure Modes (Precision & Bias).* Neurath's warnings.
          *   Question: Does the visual imply false precision or hide structural causes?
          *   Stop: If the visual simplification distorts the uncertainty or political context.
      *   *Step 5: Editorial Handoff.* Values.
          *   Question: Have we acknowledged that choosing *this* fact is a political act?
          *   Stop: Always stops here (hands to human).

      *   *Refining the "Judgment Call" Marker:* I need to be honest. ISOTYPE isn't an algorithm. Steps 1, 4, and 5 are heavily interpretive. Step 2 and 3 are more mechanical but still require design judgment. I will mark the high-subjectivity steps clearly.

  3.  **Developing the Decision Procedure (Iterative Refinement):**

      *   *Step 1 (Ontology):* Focus on "Countable Materiality."
      *   *Step 2 (Lexicon):* Focus on "Transposable Units."
      *   *Step 3 (Arithmetic):* Focus on "Rounding & Grouping."
      *   *Step 4 (Epistemology):* Focus on "False Precision & Context."
      *   *Step 5 (Ethics):* Focus on "Framing."

  4.  **Running the Test Cases:**

      *   *Case 1: Households without car access.*
          *   Step 1: Households are discrete. "Without car" is a state of a discrete thing. Pass.
          *   Step 2: Icon = 100 households. Pass.
          *   Step 3: Scale is manageable. Pass.
          *   Step 4: Risk of implying all households are identical. Manageable.
          *   Step 5: Why are we showing this? (Equity issue). Handoff.
          *   *Verdict:* Good candidate for ISOTYPE.

      *   *Case 2: Infant Mortality Rate (IMR) change over a decade.*
          *   Step 1: IMR is a *rate* (deaths per 1,000 live births). It is not a count of "infant deaths" in isolation; it's a ratio. Also, "change over time" implies a delta, not a stock.
          *   *Critical Failure Point:* Step 1. You can't draw 3.5 dead babies per 1,000 icons easily without being grotesque or misleading. ISOTYPE handles *stocks* (total deaths) better than *rates* (risk), and definitely struggles with *deltas of rates*.
          *   *Hypothesis Confirmation:* The user is right. It hits the wall at Step 1 (Ontology/Countability).
          *   *Nuance:* You *could* visualize the raw number of deaths, but that ignores the birth rate change, which is the whole point of a *rate*. Visualizing the rate requires abstracting the denominator, which breaks the "1 icon = 1 thing" rule.

  5.  **Drafting the Content (incorporating tone and constraints):**
      *   Tone: Professional, rigorous, slightly critical of "clip art bar charts," respectful of Neurath's philosophy.
      *   Formatting: Clear headings, bullet points for the procedure, distinct sections for the test cases.
      *   Constraint Check: Did I mark the judgment calls? Yes. Did I include the stop conditions? Yes.

  6.  **Refining the "Judgment Call" Identification:**
      *   Step 1 is philosophical (What counts as a "thing"?).
      *   Step 4 is ethical/epistemic (What is "false precision"?).
      *   Step 5 is explicitly political.
      *   Steps 2 & 3 are more technical but still require design judgment. I will mark 1, 4, and 5 as the heavy judgment zones.

  7.  **Final Review against Neurath's Principles:**
      *   Neurath emphasized "education through the eye."
      *   He hated misleading comparisons.
      *   He emphasized that pictures should not imply more accuracy than exists.
      *   He believed in the "transformation" of statistics into pictures by a team (not just a designer).
      *   *Self-Correction on Step 2:* Make sure to emphasize that the *same* icon must mean the *same* number across different charts (the "standardized element" requirement from the prompt).

  8.  **Final Polish:** Check the "Stop and Handoff" logic. Ensure the IMR failure is explicit about *why* rates break the isotype model (the denominator problem).

  **(Self-Correction during drafting Step 1 for IMR):** Wait, can you visualize a rate? You can visualize 1,000 babies and color the ones who died. But if the rate is 5 per 1,000, that's 5 icons. If it drops to 4 per 1,000, that's 4 icons. That *is* doable in ISOTYPE. *However*, the prompt asks about "Change in a region's infant mortality rate." Visualizing the *change* (the delta) is harder. Visualizing the rate itself is possible but risky (implies discrete tragedy). But the real killer is usually the denominator stability. If the birth rate changes, a count of deaths changes even if the rate stays same. ISOTYPE prefers absolute counts. Let's look closer at Step 1.
  *Neurath's actual view:* He did visualize rates, but often by standardizing the denominator (e.g., "Out of 10,000 people...").
  *The specific failure:* "Change over a decade." Comparing two rates. Rate A (Year 1) vs Rate B (Year 10).
  *The Wall:* It's not that it *can't* be done, it's that it violates the "material stuff" principle. An infant mortality *rate* is a statistical construct, not a pile of bodies. Visualizing it as a pile of bodies risks sensationalism (Step 4 failure). But strictly speaking, Step 1 asks if it's countable material stuff. Deaths are countable. Births are countable. The *ratio* is the abstraction.
  *Decision:* I will argue it fails Step 1 because the *unit of analysis* is the rate, not the count. If you visualize the count of deaths, you lie about the risk. If you visualize the rate, you are visualizing an abstraction. I'll pin the failure on Step 1 (Ontology) and Step 4 (Ethics/Precision). The prompt says "I suspect the second one hits a wall on a rate-of-change." I should validate that suspicion.

  Let's refine Step 1 criteria: "Is the primary unit a discrete, tangible object or person?" A rate is not. A "change in a rate" is definitely not. Okay, that holds up.

  9.  **Finalizing the Output Structure:**
      *   Introduction (acknowledging the shift from clip-art to ISOTYPE).
      *   The Decision Procedure (Steps 1-5 with Questions, Answers, Stops, and Judgment Call markers).
      *   Application to Case 1 (Car Access).
      *   Application to Case 2 (Infant Mortality).
      *   Conclusion.

  10. (Final check of the prompt requirements): "Mark which steps are judgment calls dressed up as procedure." I will add a specific tag/icon for this. "Where the procedure says no and stops." I will ensure "STOP" conditions are clear.

  Let's write it.cw
answer: |-
  This is a rigorous design challenge. You are asking to replace *decoration* (clip art on bars) with *notation* (ISOTYPE/pictorial statistics). The core distinction is that in ISOTYPE, the picture *is* the data, not an illustration of the data.

  Below is the **Pictorial Statistics Decision Procedure**. It is designed to be printed and run by a designer and a subject-matter expert together.

  **Legend:** ⚖️ indicates a step that is fundamentally a **judgment call dressed up as procedure**. These steps require human interpretation and cannot be fully automated or formalized without losing the ethical intent of the method.

  ***

  # The Pictorial Statistics Decision Procedure

  ### Step 1: Ontology Check (Countability)
  **Question:** Is the statistic a count of discrete, material entities (people, houses, doses, cases), or is it an abstraction (rates, indices, averages, negatives)?
  *   **Sufficient Answer:** "Yes, we are counting distinct physical things that exist in the world."
  *   **STOP Condition:** If the answer is "No." If the data is a rate (per 1,000), a percentage derived from unstable denominators, an index (e.g., "Quality of Life Index"), or a negative definition without a positive baseline (e.g., "Lack of hope"), the procedure stops. ISOTYPE cannot visualize abstractions without lying about their materiality.
  *   **⚖️ Judgment Call:** Defining what counts as "material." (e.g., Is a "household" material? Yes. Is a "dollar" material? Debatable.)

  ### Step 2: Lexicon Standardization (The Unit)
  **Question:** Can we define a single pictorial element (icon) that represents a fixed quantity ($X$) and commit to using that same icon-to-quantity ratio across all related panels?
  *   **Sufficient Answer:** "Yes, one icon = 1,000 households, and we will use this ratio for all housing charts this year."
  *   **STOP Condition:** If the icon's value must change from chart to chart to make the picture "fit," or if the icon requires a complex legend to decode (e.g., "A blue man represents 500 people, but a red man represents 10"). ISOTYPE fails if the reader must relearn the language for every graphic.
  *   **⚖️ Judgment Call:** Determining the base unit ($X$). Choosing between 1 icon = 100 vs 1 icon = 1,000 changes the visual density and emotional weight.

  ### Step 3: Arithmetic & Scale (Grouping)
  **Question:** Can the numbers be rounded to the nearest unit of the icon without obscuring the meaningful difference, and can they be arranged in readable groups (rows of 5 or 10)?
  *   **Sufficient Answer:** "Yes, rounding to the nearest 1,000 preserves the trend, and the total icons fit on the page without crowding."
  *   **STOP Condition:** If the numbers are too vast (requiring 10,000 icons) or too precise (where the difference is in the decimals, not the magnitudes). If you must shrink the icon size to represent smaller numbers (area scaling), STOP. ISOTYPE relies on *counting* icons, not comparing their sizes.
  *   **⚖️ Judgment Call:** Deciding what precision is "meaningful." Rounding 4,490 to 4,000 loses data; keeping it requires a partial icon, which introduces estimation error.

  ### Step 4: Epistemic Integrity (Failure Modes)
  **Question:** Does the final arrangement imply more precision than the data supports, or does it hide the structural causes of the data by focusing only on the count?
  *   **Sufficient Answer:** "No, the visual uncertainty matches the data uncertainty, and the caption explains the context."
  *   **STOP Condition:** If the clean rows of icons make the data look more certain than it is (e.g., survey data with high margin of error), or if the picture makes a social problem look like an individual trait (e.g., rows of sick people without showing the hospital capacity).
  *   **⚖️ Judgment Call:** **High.** This is the core Neurath warning. Deciding whether a visualization "picks a side" by omission is an ethical determination, not a mathematical one.

  ### Step 5: Editorial Handoff (Values)
  **Question:** Have we acknowledged that selecting this specific fact for visualization is a political choice?
  *   **Sufficient Answer:** "Yes, we understand that showing *this* metric foregrounds *this* narrative, and leadership accepts that responsibility."
  *   **STOP Condition:** **ALWAYS STOPS HERE.** The procedure cannot answer this. This must be handed to a human editor or stakeholder. The formalism ends; the policy begins.
  *   **⚖️ Judgment Call:** **Total.** This is explicitly not a procedural step. It is a governance checkpoint.

  ***

  # Test Case 1: Share of City Households Without Car Access

  **Data:** 25,000 households total. 4,500 do not have access to a car.

  *   **Step 1 (Ontology):**
      *   *Ask:* Are households discrete material entities?
      *   *Answer:* Yes. A household is a countable unit of housing/people.
      *   *Result:* **PASS.**
  *   **Step 2 (Lexicon):**
      *   *Ask:* Can we standardize the unit?
      *   *Answer:* Yes. Let 1 house icon = 500 households.
      *   *Result:* **PASS.** (We commit to this scale for all housing charts).
  *   **Step 3 (Scale):**
      *   *Ask:* Can we round and group?
      *   *Answer:* 4,500 / 500 = 9 icons. 25,000 / 500 = 50 icons. This fits easily in a 5x10 grid.
      *   *Result:* **PASS.**
  *   **Step 4 (Integrity):**
      *   *Ask:* Does this imply false precision or hide causes?
      *   *Answer:* Risk: It might imply all "no car" households are identical. Mitigation: Use a caption noting that this includes both voluntary non-ownership and involuntary lack of access.
      *   *Result:* **PASS (with caption).**
  *   **Step 5 (Handoff):**
      *   *Ask:* Is showing this a political choice?
      *   *Answer:* Yes. It highlights transit equity. Leadership must approve that this is the priority metric over, say, "average commute time."
      *   *Result:* **HANDOFF TO EDITOR.**

  **Verdict:** **Proceed.** This is an ideal candidate for ISOTYPE. It converts a percentage (18%) into a material reality (9 out of 50 houses).

  ***

  # Test Case 2: Change in Region's Infant Mortality Rate (IMR) Over a Decade

  **Data:** IMR dropped from 6.5 deaths per 1,000 live births (Year 1) to 4.2 deaths per 1,000 live births (Year 10).

  *   **Step 1 (Ontology):**
      *   *Ask:* Is the statistic a count of discrete, material entities?
      *   *Answer:* **NO.** The statistic is a *rate* (a ratio), not a count.
      *   *Analysis:* You cannot count "6.5 deaths." You can count actual deaths, but visualizing raw death counts would be misleading if the total number of births changed. If births dropped by half, raw deaths would drop by half even if the *rate* stayed the same. To visualize the *rate*, you must visualize a hypothetical population (e.g., "Out of 1,000 babies...").
      *   *Neurathian Conflict:* ISOTYPE grounds facts in "countable material stuff." A rate is a statistical abstraction of risk, not a pile of objects. Visualizing a hypothetical 1,000 babies to show 4 deaths creates a "model world," not a picture of the "real world."
      *   *Result:* **STOP.**

      *(Note: If you forced it to Step 2...)*

  *   **Step 2 (Lexicon) - *Hypothetical*:**
      *   *Ask:* Can we standardize the unit?
      *   *Analysis:* To show 6.5 per 1,000 vs 4.2 per 1,000, you need partial icons (0.5 of a baby? 0.2 of a baby?). ISOTYPE generally forbids partial icons because they break the "counting" logic. You would have to round to 7 vs 4.
      *   *Result:* **FAIL.**

  *   **Step 4 (Integrity) - *Hypothetical*:**
      *   *Ask:* Does this hide structural causes?
      *   *Analysis:* High Risk. Visualizing infant mortality as rows of babies risks sensationalism (the "pornography of misery"). It focuses on the *bodies* rather than the *healthcare system*. Neurath warned against pictures that evoke emotion over understanding.
      *   *Result:* **FAIL.**

  **Verdict:** **Do Not Use ISOTYPE.**
  **Why:** Your suspicion was correct. The procedure halts at **Step 1**.
  1.  **The Abstraction Wall:** IMR is a rate, not a stock. ISOTYPE visualizes stocks (totals).
  2.  **The Denominator Problem:** To make it work, you have to visualize a standardized denominator (1,000 births) that didn't actually exist as a single group. This violates the "grounded in countable material stuff" rule.
  3.  **The Precision Trap:** The difference is 2.3 deaths per 1,000. Representing 0.3 of a death icon is impossible without resorting to bar-chart logic (size scaling), which defeats the purpose of counting icons.

  **Recommendation for Case 2:** Use a slope chart or a connected dot plot. These tools are designed for *rates of change* and *deltas*, acknowledging the abstract nature of the data rather than forcing it into a material metaphor that doesn't fit.

  ***

  # Summary of Judgment Calls
  If you look at the procedure, **Steps 1, 4, and 5** are where the "designer's spin" you want to avoid actually lives, but it cannot be eliminated.
  *   **Step 1** decides what counts as "real."
  *   **Step 4** decides what counts as "harmful."
  *   **Step 5** decides what counts as "important."

  Neurath's insight was not that these decisions could be automated, but that by making them *explicit steps* in a production line (involving a statistician, a designer, and a social scientist), you prevent the designer from making them alone in the dark. The procedure doesn't remove the judgment; it forces the judgment into the light.
