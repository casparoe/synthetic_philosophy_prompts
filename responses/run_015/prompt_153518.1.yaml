  hey, I'm a philosophy PhD student (mostly epistemology but I dabble in metaphysics of properties) — can you act like an expert on hidden capacities and dispositional properties? please think really carefully and do some quick brainstorming before answering. my roommate keeps insisting she's truely generous — she'll split bills, help move furniture, whatever — but every single time she's actually in the position to do it, something blocks her: she suddenly remembers she's broke, gets a migraine, or says she's too socially drained for logisitics. the excuses are never the same twice, but the pattern is dead consistent. meanwhile my other roommate just avoids any situation where he might have to be generous, so he never actually gives anything, but he also never claims he would. I told roommate one that maybe she's not actually generous if it's always blocked right when it counts, and she got pissed — said I'm ignoring her "true self" that just gets masked by anxiety. now we're in a weird fight about whether her generosity is real but hidden, or if it's just not there at all. I feel like there's some philosophical idea about a capacity being covered up or interfered with right at the moment of testing, but I'm not sure which side it supports. don't just give me generic roommate advice; I want to know whether her argument holds up metaphysically. is there a meaningful difference between her case and the roommate who just dodges the test conditions entirely? and if a trait always gets stopped right before it shows, is it still fair to say the trait is really there?
