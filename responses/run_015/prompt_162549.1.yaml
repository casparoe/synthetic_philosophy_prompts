      *   **The First Responders:** Acknowledge them respectfully. Differentiate without diminishing. She's a neighbor, they are the team. Both matter.
      *   **The "Saint" Trap:** Humanize her. She's just Mrs. Okoye. She bakes, she says hi, she lives here. This wasn't her "purpose," it was just what happened that day.
      *   **The Obligation Issue:** Frame it not as "she did more than us" but "she was the one who could, and she did." Remove the judgment on others.
