answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm seventeen, I live two doors down from Mrs. Okoye, and I'm also best friends with her daughter, Ada. So, I'm probably the only person up here who is equally terrified of messing this speech up and of getting a text from Ada later if I make her mom uncomfortable.

  We're here to give out the Neighbor of the Year award. And when we think about neighbors, we usually think about small things. Borrowing a cup of sugar. Watching a package so it doesn't get stolen. Saying hello over the fence. Those things matter. They hold a town together.

  But last January, being a neighbor meant something heavier.

  When that car went into the creek off Mill Road, the water was freezing. The situation was dangerous. Most of us, if we're honest, would have stayed on the bank. We would have called 911. And nobody would have blamed us for that. Staying safe isn't cowardice; it's common sense.

  Mrs. Okoye used that common sense. She called for help. But she also did something else. She didn't wait to see if someone else would step in. She didn't calculate the risk against the reward. She just went into the water.

  I know there are people in this room who do this kind of work professionally. The volunteer fire company and the EMTs here tonight—you train for this. You gear up. You go when you're paged, at three in the morning, often for free. You are the safety net this town relies on. What Mrs. Okoye did doesn't replace what you do. It doesn't overshadow it. It just highlights how rare it is when someone who *wasn't* called, who *wasn't* trained, and who *didn't* have to, chooses to act anyway.

  Mrs. Okoye, I know you hate this kind of attention. You've told Ada you just want to go back to normal. And I want to say something important about that. Giving you this award isn't about setting a standard. It's not about saying that everyone should jump into freezing creeks. We want you safe. We want everyone safe. This isn't a promise that we expect you to do it again. It's just a promise that we remember what you did this one time.

  We aren't trying to turn you into a statue. Statues don't talk back, and they don't laugh at bad jokes, and they certainly don't come over to borrow sugar. We love that you're still just you. The award doesn't change that. It's just a way for us to say thank you, without needing to find a bigger word.

  Which brings me to this.

  *(Hold up the plaque)*

  I'm not going to lie, this plaque is… heavy. And maybe not the prettiest thing we've ever made. But it's solid. And it's got your name on it.

  So, on behalf of everyone who sleeps safer knowing you live down the street, and especially on behalf of the two families who got to keep their kids because of you… please come up here.

  *(Gesture to Mrs. Okoye, wait for her to approach, and hand her the plaque)*

  Thank you, Mrs. Okoye.
