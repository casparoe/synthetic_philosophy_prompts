      *   **Tone:** Genuine, humble, grounded, not preachy, not fake.

  2.  **Deconstruct the Philosophical/ethical Dilemma:**
      *   The user is worried about the "supererogatory" nature of the act (good to do, not obligated).
      *   *Trap 1:* Normalizing it ("anyone would do it") diminishes her specific courage.
      *   *Trap 2:* Elevating it ("went above and beyond") shames those who didn't/couldn't.
      *   *Trap 3:* Comparing to First Responders ("they get paid/paged") undermines their service.
      *   *Trap 4:* Saint-making creates future pressure.
      *   *Solution:* Focus on the *moment* and the *choice* without judging the alternatives. Focus on the *result* (the kids are here) and the *community* aspect without making it a moral ledger. Acknowledge the fear (she wasn't unafraid) and the immediacy (she just acted).

  3.  **Drafting Strategy:**
