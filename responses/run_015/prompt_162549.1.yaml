          *   Avoid making it sound like a hobby (why the award?).
          *   Avoid making her a "saint" (she hates attention, Ada will be mad).
          *   Avoid creating an expectation that she *must* do this again (the "praise creates obligation" trap).
          *   No philosophy jargon/names.
          *   No religious language.
          *   Limit use of "hero" (once max, ideally zero).
          *   Length: 3-4 minutes spoken (approx. 400-600 words).
