answer: |-
  Here is the audit of the identification between Occam's Razor (OR) and Solomonoff Induction (SI).

  **Mapping OR to SI**

  | Razor Claim | Solomonoff/Kolmogorov Term | Mismatch |
  | :--- | :--- | :--- |
  | Prefer hypotheses positing fewer entities/kinds | Minimize $K(h)$; maximize prior $2^{-K(h)}$ | **Yes:** Bits $\neq$ Entities |
  | Parsimony is truth-conducive (evidence) | Universal prior dominates any computable $\mu$ in limit | **Yes:** Asymptotic only |
  | Tie-breaker for equal fit | Minimize two-part code $K(h) + K(d|h)$ | No |

  **Residue Report**

  (a) **Ontology:** SI measures descriptive compression, not ontological commitment. $K(h)$ counts bits, not beings. A short program can simulate a vast ontology; the formalism has no room for "fewer kinds" unless encoded as length. Descriptive parsimony is captured; ontological parsimony has no counterpart.

  (b) **Invariance:** $K_U(x) \leq K_V(x) + c_{UV}$. The constant $c$ depends on the reference UTM. For finite data, $c$ can swamp $K(d|h)$ differences. Simplicity ordering is not canonical; it shifts with machine choice. For any finite dataset, a malicious UTM can reverse simplicity ordering, making the preference arbitrary relative to the interpreter.

  (c) **Explanation:** Consider a PRG + seed. It yields minimal codelength but maximal opacity. SI selects the shortest *generator*, not the most *interpretable* mechanism. Compression diverges from explanation; the formalism validates the cipher, not the cause. This suggests compression and explanation come apart inside the formalism.

  (d) **Convergence:** The theorem guarantees $M \to \mu$ only as $n \to \infty$ (w.p. 1) and assumes truth is computable. Finite scientific inference lacks these guarantees. The theorem licenses asymptotic optimism, not finite reliability. It does not support everyday inferential use where $n$ is small and truth may be uncomputable.

  **Conclusion**

  The residue indicates the Razor has done less work than its friends suppose. SI formalizes *predictive efficiency*, not *ontological simplicity*. Scientists invoke causal parsimony (fewer mechanisms); SI delivers bit parsimony (shorter programs). While correlated, they are not identical. When the PRG case arises, compression survives while explanation dies. 

  SI is not the right formal surrogate for the Razor scientists actually invoke; it is a different thing wearing the same name. It justifies betting on compressibility, not believing in simplicity. The defect lies not in your vocabulary, but in the overextension of the formalism to cover ontological claims it cannot sustain. You are using a theory of prediction to justify a theory of being.
