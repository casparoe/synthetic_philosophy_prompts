prompt: |-
  You're a social epistemologist and decision theorist — someone who has actually done formal work on jury theorems and judgment aggregation, not someone skimming an encyclopedia entry. Take your time, do some scratch reasoning before you commit to anything, and then commit. I want a number and a position, not a tour of the options.

  I'm a science writer doing a piece on how big expert panels organise themselves, and I keep running into the same structural question. Setup: a funding body has 36 reviewers and a binary call — which of two research programmes to back, where one of them really is the better bet (say, as measured by whether it produces a working result within ten years). Two ways to run it:

  (a) all 36 read the same dossier, no real discussion, simple majority;
  (b) break into six subpanels of six, each deliberates in a room for an hour and reports its verdict, and the chair takes the majority of the six verdicts — optionally with each subpanel also reporting its margin (4-2, 5-1, 6-0) and the chair weighting accordingly.

  My editor thinks (a) wins obviously: more voters, independence roughly holds, the jury theorem is on the board, done. I'm at about 0.55 that (a) beats (b) at picking the better programme, averaged over the kind of panels and the kind of questions these bodies actually face — counting a win as (a) being right at least one percentage point more often. I've definately been going in circles and I can't tell whether my hesitation is really about correlation or about somthing else.

  Give me your own number, decomposed: the terms you actually think the answer depends on, each with a probability and one line of justification, then how they combine into the headline figure. At minimum I want you to cover: how much of the theoretical edge of 36 independent voters survives once six people share a dossier, a framing, and one loud colleague; whether an hour of talk buys enough genuine competence gain to pay for that correlation; whether weighting subpanels by their reported margin recovers any of what the inner majority throws away, or just launders noise; whether it matters if the strongest reviewers are spread evenly across subpanels or clumped in one; and how much it should bother us that the better programme is the sort of thing nobody can score for a decade. Add whatever I've missed.

  Then tell me which single term your number is most sensitive to, what evidence or argument would actually move it, and — given my 0.55 and my editor's 0.95 — where you think the real disagreement between us lives. If you think the whole question is ill-posed, say so, but only after you've given me the number.
