answer: |-
  1. The exchange model falsely assumes moral duties are fungible commodities that can be offset by optional good deeds. In reality, supererogatory acts do not generate credits that license future negligence of obligatory duties.
  2. Rational agents do not strategize this way because moral obligations remain binding regardless of past benevolence. Such strategic banking would constitute a moral error rather than a rational calculation.
  3. Supererogation signifies moral excellence beyond requirement, not a transactional surplus available for withdrawal. Treating it as a ledger misunderstands the distinct categories of duty and charity.
  4. The lack of observed bookkeeping demonstrates that moral agents recognize duties as non-negotiable constraints rather than debtable accounts. This behavior confirms that the proposed exchange mechanism is conceptually incoherent.
  5. Once corrected, nothing substantive remains of the credit-bank metaphor because moral worth cannot be stored or spent to evade obligations. The metaphor survives only as a misleading heuristic for moral licensing, not as a valid structural account.
