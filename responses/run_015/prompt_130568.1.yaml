prompt: |-
  I've got a second-year metaphysics seminar coming up in a fortnight — 16 students, one 75-minute slot, a whiteboard and a pile of index cards, no tech beyond that — and the topic is the special composition question (van Inwagen's version I think? the "when do some things add up to one thing" question, with the answer he gives in terms of life). I've tired to teach it before just by handing out a list of cases — two bonded particles, a molecule, a crystal, a rock, a table, a cat, a heap of scrap, my nose plus the Eiffel Tower — and asking "does composition happen here?". It died inside fifteen minutes: somebody says "well, it depends what you mean by object", somebody else says "the parts just are the object, there's nothing more to it", and nobody feels any pressure at all. So I want a structured thing where the pressure comes out of what they have to do, not out of me talking.

  What I'm picturing — redesign it freely, I'm not attached — is some kind of certification panel or census office. Small groups, and each group has to hand in a single rule, one side of an index card, that a clerk could apply mechanically to a data sheet describing a candidate collection of parts (fields like relative positions, causal bonding, mass, whether anything's alive or conscious, whether the lot does anything as a unit, whatever you think belongs there) and get out a yes/no on whether it composes something. Constraints: no proper names, no indexicals, finite length, and one rule for all cases rather than a list of verdicts. Then groups swap rules and each gets a fixed budget of adversarial cases to throw at another group's rule, with small stakes — I can bring chocolate, or tokens they wager on whether their own rule survives. The bit I really want you to engineer is the squeeze: a round where, if a group has said yes to case A and no to case B, they have to locate the switch-over point along a series of intermediate cases you supply (near-life, near-contact, almost-a-mechanism, that sort of thing), and a round where they have to name the single respect in which A and B differ and then get handed a case that varies only that respect and only barely. And I want the case pool built so the comfortable middle — yes to organisms and tables, no to scattered junk — is the thing that starts to sag, not the extreme answers.

  What they should walk out having felt is that the commonsense package is the unstable one and that each exit costs something they can name: yes to everything and you're stuck with the object made of my nose and the Eiffel Tower; no to everything and, well, no tables; or "each case is just a brute fact" — and I'd like that third one to come out feeling like a real option rather than a shrug, because I suspect a game will naturally make it look like laziness when it's an actual defended position. Keep it about composition at a time, not persistence over time — last year someone dragged in the ship of Theseus and we lost ten minutes — unless your design uses that confusion on purpose, in which case say so and I'll allow it.

  Deliverable: rules and roles, materials, a rough minute-by-minute timeline for the 75 minutes, the case pool (12-16 cases with their data-sheet entries, or a schema I can generate more from), the scoring/wagering scheme, and a debrief that maps particular moments in the session onto particular moves in the dialectic — this moment is supposed to make that move feel costly — plus what will predictably go wrong and how to handle it. My two bets: someone writes "it composes something iff it does something interesting" and I won't know what to do with that, and the group that writes the most gerrymandered disjunctive rule wins the game while learning nothing. Also be frank about which features of the question the activity just can't stage and I'll have to say out loud myself — whether composition could be vague, whether "how many objects are there" is well-posed, whether the whole thing is verbal in the quantifier-variance sense. Write it in British English please. And as you go, separate what's actually settled in the literature from what's contested among people who work on this: don't have me tell 16 second-years that everyone agrees composition must have a general answer if it's really one side of an argument, and flag any contested assumption your setup quietly leans on — that sums are ontologically innocent, that composition isn't vague, whatever — instead of burying it in the premise.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**

      *   **Context:** 2nd-year metaphysics seminar, 16 students, 75 minutes, low-tech (whiteboard, index cards).
      *   **Topic:** Special Composition Question (SCQ), specifically van Inwagen's version ("when do some things compose something?").
      *   **Problem with Previous Attempt:** Unstructured case discussion died quickly; students deflated pressure by appealing to ambiguity ("depends on 'object'"), nihilism ("parts just are the object"), or lack of stakes.
      *   **Desired Format:** Structured activity (certification panel/census office). Small groups create a *rule* (index card) for a clerk to apply mechanically. Adversarial testing (swapping rules, budget of counter-cases).
      *   **Key Mechanic ("The Squeeze"):**
          *   Find the switch-over point in a sorites-like series (A=Yes, B=No, find the boundary).
          *   Identify the *single respect* of difference and face a minimal variation case.
          *   Target: Make the "commonsense middle" (Yes to cats/tables, No to scattered junk) sag/unstable.
      *   **Learning Outcome:** Feel the cost of each position (Universalism, Nihilism, Brutalism/Primitivism, Restrictivism). Make Brutalism feel like a real option, not laziness.
      *   **Constraints:** Composition at a time (no Ship of Theseus). British English. Distinguish settled vs. contested literature. Flag hidden assumptions in the activity.
      *   **Specific Concerns:** Vague rules ("does something interesting"), gerrymandered disjunctive rules winning the game but teaching nothing.
      *   **Deliverables:** Rules/Roles, Materials, Timeline, Case Pool, Scoring, Debrief (mapping activity to dialectic), Troubleshooting, Limitations of the activity.

  2.  **Deconstruct the Pedagogy:**

      *   *The Core Tension:* The SCQ asks for necessary and sufficient conditions. Commonsense intuition is restrictivist (some things compose, some don't). But finding a non-arbitrary principle is hard (van Inwagen's "Life" is the famous attempt, but has counterexamples).
      *   *The Activity:* Needs to force precision. The "Clerk" metaphor is excellent because it removes interpretation. If the rule says "bonded," the clerk checks the "bonded" box. If the rule is vague, the clerk stalls.
      *   *The "Squeeze":* This is the heart. It needs to target the boundary between "clearly yes" (organism) and "clearly no" (scattered). The "switch-over" mechanic mimics a sorites paradox without explicitly calling it that immediately.
      *   *Handling "Brutalism":* This is the view that composition is primitive/brute. In a game about *rules*, this looks like cheating ("It just does"). I need to legitimize this as "The Brute Fact Card" or similar, giving it a cost (e.g., they can't explain *why*, so they lose points on explanation, but save points on consistency).
      *   *Handling "Gerrymandering":* If a group writes "Yes to cats, tables, rocks. No to nose+Eiffel," they win the case pool but fail the *rule* constraint (no proper names, general principle). I need to enforce the "General Principle" constraint strictly during the submission phase.
      *   *Handling "Vagueness":* "Does something interesting" is the enemy. The "Clerk" must be able to apply it. I need a "Clarity Check" phase.

  3.  **Drafting the Plan - Section by Section:**

      *   **Title:** Needs to sound official but engaging. "The Ontological Census Bureau."
      *   **Roles:** Drafters (Legislators), Clerks (Applicants/Adjudicators), Auditors (Opposition).
      *   **Materials:** Index cards (crucial), Case Sheets (pre-printed), Tokens/Chocolate.
      *   **Timeline:** 75 mins is tight.
          *   Intro (5)
          *   Rule Drafting (15)
          *   Clarity Check (10) - *Crucial for stopping vague rules.*
          *   The Squeeze (Round 1 & 2) (30)
          *   Scoring & Debrief (15)
      *   **Case Pool:** Needs a gradient.
          *   Clear Yes: Human, Cat.
          *   Clear No: Random atoms, Nose+Eiffel.
          *   The Trouble Zone: Crystals, Viruses, Swarms, Fused Artifacts, Broken Tables.
          *   Data Fields: Contact, Causal Integration, Functional Unity, Life-status.
      *   **Scoring:** Wagering. If your rule survives, you keep tokens. If broken, you lose.
      *   **Debrief:** Map the game moves to van Inwagen, Lewis, Sider, etc.
      *   **Limitations:** What can't the game do? (Quantifier variance, vague existence).

  4.  **Refining the "Squeeze" Mechanic:**

      *   *Problem:* How to physically do the "switch-over point" in a seminar?
      *   *Solution:* The "Gradient Deck." I provide a stack of 5 cards representing a spectrum (e.g., Healthy Cat -> Dying Cat -> Cat Corpse -> Scattered Cat Parts). If a rule says Yes to 1 and No to 5, they must mark the exact cut-off. If they can't justify the cut-off between 2 and 3, they lose a token.
      *   *Problem:* "Does something interesting."
      *   *Solution:* The "Clerk Test." I (the tutor) act as the Clerk. If I have to ask "What does 'interesting' mean?", the rule is rejected or penalized immediately.

  5.  **Addressing the Literature & Assumptions:**

      *   *Settled:* There *is* a debate. Universalism, Nihilism, Restrictivism are the main contenders. Van Inwagen's "Life" is the standard Restrictivist attempt.
      *   *Contested:* Is there a *true* answer? (Quantifier variance). Is existence vague? (Evans argument). Are composite objects ontologically innocent? (Lewis).
      *   *Hidden Assumptions in Game:* The game assumes composition is a binary Yes/No (bivalence). It assumes a general answer is possible (against primitivism, unless we make space for it). It assumes the data sheets capture all relevant metaphysical facts (supervenience). I must flag these.

  6.  **Developing the Case Pool (The "Data Sheets"):**

      *   Need specific fields: `Physical Contact?`, `Causal Integration (1-10)?`, `Functional Unity?`, `Biological Life?`, `Human Intention?`.
