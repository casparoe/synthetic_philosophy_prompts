answer: |-
  # Seminar Plan: The Ontological Census Bureau

  **Topic:** The Special Composition Question (SCQ)
  **Level:** 2nd Year Metaphysics
  **Time:** 75 Minutes
  **Students:** 16 (4 groups of 4)
  **Materials:** Index cards (two colours), pre-printed "Case Data Sheets" (see below), tokens (or chocolates), whiteboard.

  ---

  ## 1. Pedagogical & Metaphysical Preamble
  *For the Tutor's Eyes Only*

  **What is Settled:**
  *   The formulation of the SCQ ("Under what conditions do some things compose something?") is standardly attributed to Peter van Inwagen (*Material Beings*, 1990).
  *   The three dominant 'live' positions in contemporary literature are: **Nihilism** (composition never occurs; only simples exist), **Universalism** (composition always occurs; any plurality composes an object), and **Restrictivism** (composition occurs sometimes, but not always).
  *   Van Inwagen's own answer is Restrictivist: composition occurs iff the activity of the parts constitutes a *life*.

  **What is Contested (Do not present as settled):**
  *   **Quantifier Variance:** Eli Hirsch and others argue there is no single 'correct' answer; different conceptual schemes carve the world differently. The game assumes there is a fact of the matter.
  *   **Vague Existence:** David Lewis argued existence cannot be vague (semantic precision is required); others (e.g., Elizabeth Barnes) argue metaphysical vagueness is possible. The game forces binary choices (Yes/No), presupposing bivalence.
  *   **Composition as Identity:** Lewis suggested composition is a form of identity (ontologically innocent); others deny this. The game treats composition as generating a *new* entity (ontologically costly).
  *   **Brute Facts:** Ned Markosian argues composition might be primitive (no non-trivial necessary and sufficient conditions). The game treats this as a 'costly' move to reflect its explanatory silence.

  **Hidden Assumptions in this Activity:**
  *   **Supervenience:** The game assumes composition facts supervene on the physical/causal facts provided in the Data Sheets. (If two cases are physically identical, they must have the same composition verdict).
  *   **Synchronicity:** We are judging composition *at a time*. Diachronic identity (Ship of Theseus) is excluded by design.
  *   **Bivalence:** The Clerk must output Yes or No. There is no "Maybe" token.

  ---

  ## 2. Roles and Rules

  **The Setup:**
  Divide the class into 4 groups (A, B, C, D). Each group is a **Legislative Committee** for the Ontological Census Bureau.

  **Phase 1: The Legislation (15 mins)**
  Each group must draft a **Composition Rule** on one side of an index card.
  *   **Constraint 1 (Generality):** No proper names (e.g., no "Cat", "Table", "Eiffel Tower"). No indexicals (e.g., no "things near me").
  *   **Constraint 2 (Mechanics):** The rule must be applicable by a mindless Clerk using only the fields on the Case Data Sheets.
  *   **Constraint 3 (Bivalence):** The rule must yield a Yes or No for any possible input.
  *   **The Brute Fact Option:** A group may choose *not* to write a rule. Instead, they write "Composition is Primitive." They save time but enter Phase 2 with half the tokens (representing explanatory debt).

  **Phase 2: The Clerk's Review (10 mins)**
  You (the Tutor) act as the **Chief Clerk**. Collect the rules.
  *   **The Vagueness Test:** If a rule uses terms like "significant bonding," "functional unity," or "interesting arrangement," reject it. Ask the group to define it operationally using the Data Sheet fields. If they cannot, they must revise or accept a **Vagueness Penalty** (they automatically lose any challenge involving that term).
  *   *Tutor Note:* This is where you block "does something interesting." Ask: "Which column on the Data Sheet tells the Clerk if it's interesting?" If there isn't one, the rule is invalid.

  **Phase 3: The Squeeze (35 mins)**
  Groups swap rules. Group A audits Group B, B audits C, etc.
  *   **Budget:** Each group gets 5 tokens.
  *   **The Challenge:** The auditing group selects a **Case Data Sheet** from the pool and applies the *other* group's rule.
      *   If the rule yields a verdict the auditors think is wrong (e.g., the rule says "Yes" to a scattered heap), they challenge.
      *   **Defence:** The drafting group must justify the verdict using *only* their rule.
      *   **Wager:** Auditors wager 1 token. If they prove the rule gives a counter-intuitive result, they steal the token. If the drafting group justifies it consistently, they keep it.
  *   **The Squeeze Mechanic (Crucial):**
      *   If a group says **Yes** to Case 1 and **No** to Case 2, the auditors can demand a **Boundary Justification**.
      *   You (Tutor) provide a **Gradient Strip** (a sequence of 5 micro-cases bridging Case 1 and 2).
      *   The drafting group must point to the *exact* card where the verdict flips.
      *   **Cost:** If they cannot identify a difference in the Data Sheet fields between the 'Yes' card and the 'No' card, they lose 2 tokens. This targets the "arbitrary cut-off" problem.

  **Phase 4: Debrief (15 mins)**
  Map the game outcomes to metaphysical positions (see Section 6).

  ---

  ## 3. Materials: The Case Data Sheets

  Print these on card stock. Each case is a snapshot at time *t*.

  **Fields:**
  1.  **Physical Contact:** (None / Touching / Interlocked / Chemically Bonded)
  2.  **Causal Integration:** (1 = None, 5 = High feedback loop)
  3.  **Metabolic Activity:** (None / Dormant / Active)
  4.  **Functional Coordination:** (None / Parts move together / Parts serve single end)
  5.  **Human Intent:** (None / Accidental / Designed)

  **The Pool (16 Cases):**

  | ID | Name (For Tutor) | Contact | Causal | Metabolic | Functional | Intent | *Intuitive Verdict* |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **01** | **Human Organism** | Bonded | 5 | Active | 5 | None | **YES** |
  | **02** | **House Cat** | Bonded | 5 | Active | 5 | None | **YES** |
  | **03** | **Oak Tree** | Bonded | 4 | Active | 4 | None | **YES** |
  | **04** | **Granite Rock** | Bonded | 2 | None | 1 | None | **MAYBE** |
  | **05** | **Crystal Lattice** | Bonded | 3 | None | 2 | None | **MAYBE** |
  | **06** | **Virus Particle** | Bonded | 3 | Dormant | 3 | None | **EDGE** |
  | **07** | **Bee Swarm** | None | 4 | Active | 5 | None | **EDGE** |
  | **08** | **Assembled Table** | Interlocked | 3 | None | 5 | Designed | **YES** |
  | **09** | **Table Parts (Boxed)** | Touching | 1 | None | 1 | Designed | **NO** |
  | **10** | **Glued Table (Broken)** | Bonded | 1 | None | 1 | Designed | **MAYBE** |
  | **11** | **Nose + Eiffel Tower** | None | 1 | None | 1 | None | **NO** |
  | **12** | **Scattered Atoms** | None | 1 | None | 1 | None | **NO** |
  | **13** | **Siamese Twins** | Bonded | 5 | Active | 4* | None | **HARD** |
  | **14** | **Human Corpse** | Bonded | 2 | None | 1 | None | **HARD** |
  | **15** | **Cloud (Water Droplets)** | Touching | 2 | None | 2 | None | **VAGUE** |
  | **16** | **Fusion Weld** | Bonded | 5 | None | 3 | Accidental | **MAYBE** |

  *\*Note on Case 13: Functional coordination is shared but distinct consciousnesses.*

  **The Gradient Strips (For The Squeeze):**
  *Prepare three specific sequences to deploy when a group draws a line between two similar cases.*

  *   **Strip A (Life):** Active Metabolism $\rightarrow$ Comatose $\rightarrow$ Brain Dead $\rightarrow$ Decomposing $\rightarrow$ Dust.
  *   **Strip B (Contact):** Chemically Bonded $\rightarrow$ Glued $\rightarrow$ Clipped $\rightarrow$ Resting on $\rightarrow$ 1mm Gap.
  *   **Strip C (Function):** Perfect Coordination $\rightarrow$ Lagged Coordination $\rightarrow$ Occasional Coordination $\rightarrow$ Random Motion.

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro:** Explain SCQ. "When do parts make a whole?" Distribute groups & tokens (5 each). | Emphasise: Composition *at a time*. No persistence. |
  | **05-20** | **Legislation:** Groups draft their Rule on index cards. | Circulate. Warn against "common sense" lists. |
  | **20-30** | **Clerk's Review:** Collect cards. You vet for vagueness. | **Critical Phase.** Force operational definitions. "What column do I check?" |
  | **30-45** | **Round 1 (Standard Challenge):** Swap rules. Audit 2 cases each. | Wager 1 token per challenge. Focus on clear mismatches (e.g., Nose+Tower). |
  | **45-60** | **Round 2 (The Squeeze):** Deploy Gradient Strips on boundary cases. | If Group says Yes to Cat, No to Corpse, force them to pick the exact card where 'Life' stops. |
  | **60-75** | **Debrief:** Tally tokens. Map to metaphysics. | Discuss the cost of their winning/losing positions. |

  ---

  ## 5. Scoring and Wagering Scheme

  *   **Starting Pot:** 5 tokens per group.
  *   **Successful Defence:** If your rule handles a case without contradiction, keep your token.
  *   **Successful Challenge:** If you find a case where the rule violates strong intuition *and* the drafting group cannot justify it via the Data Fields, steal a token.
  *   **The Squeeze Penalty:** If a group cannot identify the *relevant difference* in the Data Fields between their Yes/No boundary cases, they pay 2 tokens to the bank (representing arbitrariness).
  *   **The Brute Fact Bonus:** If a group chose "Composition is Primitive," they start with 3 tokens. However, they cannot be challenged on *rules*, only on consistency. If they are consistent (Yes to A, Yes to identical B), they cannot lose tokens on rule-violations. This mirrors the metaphysical trade-off: less explanatory power, more immunity to counter-example.

  ---

  ## 6. Debrief: Mapping Game to Dialectic

  *Do not just announce the winners. Use the token counts to drive the philosophy.*

  1.  **The Restrictivist Sag (The Commonsense View):**
      *   *Look for:* Groups who tried to say Yes to Cats/Tables but No to Scattered Atoms.
      *   *Dialectic:* They likely lost tokens in **Round 2 (The Squeeze)**.
      *   *Point:* "You felt the pressure of the arbitrary cut-off. This is the main argument against Restrictivism (van Inwagen's 'Life' is the best attempt, but does a virus count? A coma patient?). If you can't name the difference in the Data Sheet, is the difference real?"

  2.  **The Universalist Escape (Lewis):**
      *   *Look for:* Any group that wrote "Always Yes" (or implied it by accepting Nose+Tower).
      *   *Dialectic:* They probably kept their tokens.
      *   *Point:* "They survived the Squeeze because there was no boundary to find. But what is the cost? You are committed to an object made of your nose and the Eiffel Tower. Is ontological proliferation cheaper than arbitrary boundaries?"

  3.  **The Nihilist Hardline (Sider):**
      *   *Look for:* Any group that wrote "Never Yes" (Only simples exist).
      *   *Dialectic:* They also survived the Squeeze.
      *   *Point:* "No tables, no chairs, just particles arranged table-wise. Consistent, but expensive for everyday discourse."

  4.  **The Brute Fact Option (Markosian):**
      *   *Look for:* The group that took the token penalty to avoid writing a rule.
      *   *Dialectic:* "They admitted they couldn't write a rule. Is that failure, or is it insight? Maybe composition *is* primitive. The game penalised them, but metaphysically, this avoids the arbitrariness of Restrictivism and the madness of Universalism."

  5.  **The Vagueness Problem:**
      *   *Look for:* Cases like the Cloud or the Corpse.
      *   *Point:* "The game forced a Yes/No. But was there a fact of the matter? If Lewis is right, existence can't be vague. If Barnes is right, maybe the world itself is fuzzy here."

  ---

  ## 7. Troubleshooting: Predictable Failures

  **Problem 1: "It composes something iff it does something interesting."**
  *   **Fix:** The **Clerk's Review ( mins 20-30)** is your weapon. Do not accept the card. Ask: "Clerk, look at Column 4. What number counts as interesting? 3? 4?" If they say "It depends," the rule is rejected. They must revise to "Functional Coordination $\ge$ 4" or lose the Brute Fact bonus.
  *   **Lesson:** Teaches that metaphysical principles must be precise enough to supervene on physical facts.

  **Problem 2: The Gerrymandered List ("Yes to Cats, Rocks, Tables...").**
  *   **Fix:** Enforce **Constraint 1 (Generality)** strictly. "No proper names." If they write "Table," make them define it using the fields (e.g., "Designed + Interlocked + Functional"). Usually, this definition will then fail on Case 10 (Broken Table) or Case 16 (Fusion Weld), triggering the Squeeze.
  *   **Lesson:** Teaches that listing intuitions is not a theory.

  **Problem 3: Students drag in Persistence (Ship of Theseus).**
  *   **Fix:** Interrupt immediately. "We are photographing the universe at time *t*. Does the photo contain one object or two? Do not tell me about what happened yesterday."
  *   **Lesson:** Distinguishes Composition (synchronic) from Identity (diachronic).

  **Problem 4: Everyone agrees with Nihilism/Universalism too easily.**
  *   **Fix:** Adjust the token stakes. If a group goes Universalist, challenge them with **Case 11 (Nose + Tower)**. Ask: "Does that object have a mass? Where is it?" If they say "Yes, sum of parts," wager a token that this violates 'Location' intuition. Make the 'cost' of Universalism feel heavy, even if logically consistent.

  ---

  ## 8. Limitations of the Activity (For You to State Aloud)

  In the final 5 minutes, explicitly state what the game *could not* do. This prevents students from thinking the game solved the metaphysics.

  1.  **Quantifier Variance:** "The game assumed there is one true rule. Hirsch would say Groups A and B were just speaking different languages. The game cannot simulate that."
  2.  **Vague Existence:** "I forced you to say Yes or No. Maybe the right answer is 'Indeterminate.' The game rules banned that, because clerks need binary inputs."
  3.  **Supervenience:** "We assumed if the physical data is the same, the composition is the same. Some dualists might deny this. The game assumes physicalism."
  4.  **Ontological Innocence:** "We treated composition as making a *new* thing. Lewis thinks composition is just counting the parts differently. The game biases you against Lewis's view."

  ---

  ## 9. Tutor's Cheat Sheet: The "Squeeze" Scripts

  *When a group draws a boundary, use these prompts:*

  *   **The Life Boundary:** "You said Yes to the Cat (Metabolic 5) and No to the Corpse (Metabolic 0). Here are cards with Metabolic 4, 3, 2, 1. At which exact number does the object cease to exist? Why is 3 an object and 2 not, when the physical difference is negligible?"
  *   **The Contact Boundary:** "You said Yes to the Rock (Bonded) and No to the Pile (Touching). Here is 'Glued', 'Clipped', 'Velcro'. Where is the line? Is a glued table more of an object than a clipped one?"
  *   **The Function Boundary:** "You said Yes to the Table (Functional 5) and No to the Broken Table (Functional 1). What about Functional 3 (wobbly but usable)? If composition depends on function, does the object pop in and out of existence as I use it?"

