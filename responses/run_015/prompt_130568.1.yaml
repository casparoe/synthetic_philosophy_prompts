          *   Series C: Life (Metabolizing -> Comatose -> Dead -> Decomposing).

  7.  **Addressing the "Gerrymander" and "Vague Rule" risks:**

      *   *Gerrymander:* "Compose if Table or Cat or Rock..." -> Ban lists. Rule must be a conditional principle ("If X, then Y").
      *   *Vague:* "If it's a proper object." -> The Clerk (Tutor) rejects it. "Define 'proper'." If they can't, they get a 'Vagueness Penalty' (they must accept the opponent's classification for that case).

  8.  **Structuring the Debrief:**

      *   Connect the "Rule" to Restrictivism.
      *   Connect the "Squeeze Failure" to the Vagueness Argument / Sorites.
      *   Connect "Yes to Everything" (if anyone tries it) to Universalism (Lewis).
      *   Connect "No to Everything" to Nihilism (Sider).
      *   Connect "It's Brute" to Primitivism (Markosian).
      *   *Crucial:* Acknowledge that the game *presumes* bivalence and supervenience, which are contested.

  9.  **Writing in British English:**

      *   "Seminar" not "Class".
      *   "Tutor" not "Professor" (usually).
      *   "Programme" (maybe not needed), "Centre", "Defence".
      *   Tone: Academic but practical.

  10. **Review against Constraints:**

      *   16 students? -> 4 groups of 4.
      *   75 mins? -> Timeline needs to be tight.
      *   No tech? -> Paper based.
      *   van Inwagen? -> Ensure "Life" is a tempting but trap-laden option.
      *   Composition at a time? -> Ensure cases don't invite diachronic questions.

