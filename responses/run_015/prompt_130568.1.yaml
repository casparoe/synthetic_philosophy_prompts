      *   Make sure the "Brute Fact" option is codified. Give them a "Wild Card" they can play once to say "No Rule, Just Fact," but it costs double tokens if challenged.
      *   Ensure the "Clerk" role is clear (it's the Tutor, primarily, to ensure strictness).
      *   Check the "Squeeze" logic. If they say Yes to Cat and No to Corpse, they must identify the *exact* moment life ceases in the data.

  12. **Self-Correction on "Brutalism":**
      *   If I make it costly, they won't do it. If I make it free, everyone will do it.
      *   *Idea:* Allow a "Primitivist Waiver." They don't submit a rule. They submit verdicts. But they must defend *why* no rule is possible. This maps to Markosian.
      *   *Better for Game:* Keep the rule requirement but allow one "Exception Clause" per rule. If they use it, they admit their rule isn't universal. This highlights the cost of Restrictivism (arbitrariness).

