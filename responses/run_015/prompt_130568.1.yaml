          1.  Adult Human (Yes)
          2.  House Cat (Yes)
          3.  Oak Tree (Yes)
          4.  Granite Rock (Maybe/Yes)
          5.  Crystal Lattice (Maybe)
          6.  Virus (Edge of Life)
