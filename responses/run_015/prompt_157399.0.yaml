answer: |-
  Here is the mapping and analysis you need for the essay, cutting straight to the structural tensions between Taurek's framework and the Lombardy triage case.

  ### 1. Mapping the Case onto the Theory

  To see where Taurek bites, we have to fix the moral geometry. The "Displacement Problem" you identified is essentially a problem of **agency displacement**.

  *   **The Agent:** In Taurek's standard rescue cases, the agent is the bystander at the scene. In Lombardy, the agency is split.
      *   *The Committee:* They set the rule. They face a choice between Policy A (maximize lives/life-years) and Policy B (lottery/first-come).
      *   *The Bedside Doctor:* They execute the rule. They face a choice between Patient X (younger, higher prognosis) and Patient Y (older, lower prognosis).
  *   **The Options:**
      *   *Taurekian Option:* Treat the patients as separate claims. Give them equal chance (lottery) unless there is a special obligation or instrumental reason to prefer one.
      *   *Triage Option:* Treat the patients as units in a sum. Prefer the one that contributes more to the aggregate outcome (survival + life years).
  *   **The Comparison Class:**
      *   For the Doctor: It is strictly dyadic (X vs. Y). The "many" are not present.
      *   For the Committee: It is aggregative (Population Set A vs. Population Set B).

  **The Crucial Tension:** Taurek's argument is that there is no "social entity" that suffers the sum of losses. If the Committee acts as the agent, they are still choosing for distinct individuals. Taurek would argue the Committee cannot count heads any more than the Doctor can. The fact that the aggregation happens *ex-ante* (in the guideline) rather than *ex-post* (at the bedside) does not solve the metaphysical problem Taurek raises: the losses are still not experienced by a single subject.

  ### 2. The Displacement/Decomposition Objection

  You asked if the aggregative justification fails because it decomposes into one-against-one choices. **Yes, on Taurek's view, this is fatal.**

  If the justification for the protocol is "this saves the most lives," but the mechanism is "deny this specific person a ventilator," Taurek argues you are sacrificing a specific claim (Patient Y's) for the sake of other specific claims (Patients Z, Q, R) who are not in the transaction.

  *   **Taurek's Verdict:** The doctor cannot justify denying Patient Y by pointing to Patient Z. The fact that Z exists elsewhere is morally irrelevant to the claim Y has on the doctor *now*.
  *   **The Counter:** The protocol argues that the doctor is not a private moral agent but a functionary of a scarce resource system. The ventilator belongs to the public, not the doctor.
  *   **Taurek's Silence:** Taurek is largely silent on **institutional role morality**. He writes about "us" as moral agents. He does not explicitly address whether assuming a public role (state agent, hospital staff) waives the Taurekian permission to ignore numbers. If he says role morality doesn't matter, the protocol is illegitimate. If he says it does matter, he needs a theory of how roles change the metaphysics of loss, which he doesn't provide.

  ### 3. Wrinkle 1: Uncertainty and Expected Value

  You asked if summing *expected* lives is just aggregation in a trenchcoat. **Taurek would say yes.**

  The Lombardy protocol relied on prognosis (likelihood of survival) and life expectancy.
  *   **Instrumental vs. Aggregative:** Taurek accepts **instrumental** efficiency. If Patient A has a 5% chance of survival and Patient B has a 95% chance, Taurek agrees you can give it to B. Why? Because giving it to A is likely a *waste of the resource*, not because B's life counts more. The resource fails to do its job with A.
  *   **The Aggregation Point:** However, the Italian protocol also prioritized *life years remaining* (saving the 40-year-old over the 70-year-old, even if both survive). This is not instrumental efficiency of the ventilator; it is maximizing the *output* of the life saved.
  *   **Taurek's Objection:** Summing expected life-years is still summing across persons. To Taurek, the 70-year-old loses "their life" just as completely as the 40-year-old loses "theirs." There is no common currency of "life-time" that allows you to trade two years of one person for ten years of another.
  *   **Uncertainty:** The fact that the "many" were probabilistic (a surge *might* happen) doesn't help the aggregativist. Taurek rejects the moral mathematics of trade-offs regardless of whether the variables are known or expected. Choosing a policy that *probably* saves more people still relies on the false premise that the "more people" constitute a greater moral weight.

  ### 4. Wrinkle 2: Impartiality and Special Obligations

  The protocols demanded strict impartiality. Taurek explicitly permits partiality (e.g., saving your friend over a stranger).

  *   **The Clash:** If a doctor in Lombardy had to choose between their own spouse and a stranger for the last ventilator, Taurek says they are permitted (perhaps required) to save the spouse. The triage protocol forbids this.
  *   **The Implication:** This suggests the triage protocol is not just aggregative; it is **anti-partial**. It treats patients as interchangeable units of need. Taurek treats them as bearers of distinct relationships.
  *   **Theory Silence:** Again, Taurek is silent on whether public resources negate private permissions. Does the fact that the ventilator is public property mean the doctor cannot exercise Taurekian partiality? Taurek doesn't say. But if the doctor *is* allowed partiality, the triage system collapses into chaos. If they *aren't*, Taurek's theory of value (that loss is individual and relational) is being overridden by a theory of distribution (that resources are public and impartial). Taurek doesn't have the machinery to resolve this conflict.

  ### 5. The Age/Life Criterion: Aggregation or Fair Share?

  You asked if prioritizing the young is aggregating or a "fair share" view.

  *   **It is Aggregation:** Prioritizing life-years is utilitarian aggregation. It maximizes the total sum of goods.
  *   **Fair Share?** A "fair share" argument would look more like a lottery. Everyone gets an equal chance at the resource. Prioritizing the young explicitly gives the old a *smaller* share (zero chance) to give the young a *larger* share (life completion).
  *   **Taurek's View:** Taurek favors the "fair chance" (lottery) model over the "best outcome" model. He would likely view the age criterion as a violation of the older patient's equal claim. The fact that the younger patient has "more life to lose" is, for Taurek, irrelevant. Loss is binary: you die or you don't. The *amount* of future life doesn't weigh against another's *certainty* of death in a way that permits overriding their claim.
  *   **Exception:** The only way a Taurekian could sign onto age criteria is if framed instrumentally: "Younger people are more likely to survive the ventilation process." But the Italian guidelines explicitly included life-expectancy *post-survival*. Taurek rejects this.

  ### 6. Verdict on Taurek: Reductio or Scope Limit?

  **Does Taurek commit you to running triage by lottery?**
  Yes. If the patients have equal need and equal prognosis, Taurek demands a coin flip. If they have unequal prognosis, he allows prioritizing the likely survivor (instrumental), but not the one with more life-years left.

  **If a lottery means more people die, are you allowed to count that?**
  Taurek says no. Counting the "more people" smuggles aggregation back in. He accepts that his view might lead to "more deaths" in the aggregate, but he denies that "more deaths" is a coherent moral reason for the agent at the point of choice.

  **Is this a Reductio?**
  *   **The Aggregativist Charge:** Yes. A theory that mandates higher mortality in a pandemic to preserve a metaphysical point about "no super-person" is practically absurd. It fails the basic test of minimizing suffering.
  *   **The Taurekian Defense:** No. The absurdity lies in thinking we can trade lives like currency. If the theory correctly identifies that persons are separate, then the "extra deaths" are not a cost paid by a collective, but distinct tragedies that cannot be prevented without violating the rights of the specific individuals sacrificed.

  **Is it a Scope Limit? (Rules/Institutions vs. One-off Rescues)**
  This is your strongest avenue for critique.
  *   **The Argument:** Taurek's logic works for a bystander at a beach. It breaks down for **ex-ante institutional design**.
  *   **Why:** At the beach, the choice is reactive. In a pandemic, the choice is proactive. The Committee decides *before* the patients arrive. They are not choosing "John vs. Jane"; they are choosing "System A vs. System B."
  *   **Taurek's Silence:** Taurek does not distinguish between **ex-ante rules** and **ex-post choices**. He treats the moral problem as identical.
  *   **Does the limit matter?** Yes, critically. If Taurek only applies to ad-hoc rescue, his relevance to bioethics (which is almost entirely policy-driven) is minimal. If he claims to apply to policy, he must explain why the "no super-person" argument doesn't dissolve when the agent is designing a system for a population rather than rescuing a specific individual.
  *   **The Decomposition Failure:** Even if the Committee is the agent, the policy must be enacted by doctors facing individuals. If the policy cannot be justified to the individual being denied (because "the greater good" is not a valid reason for *their* sacrifice), the policy lacks legitimacy. Taurek would argue the decomposition *does* matter: you cannot hide aggregation upstream to avoid justifying it downstream.

  ### Summary for the Essay

  1.  **Mapping:** The split agency (Committee vs. Doctor) does not save the aggregative view. Taurek denies the "collective" exists at either level.
  2.  **Displacement:** The protocol fails Taurek's test because it justifies individual sacrifice via aggregate benefit. The decomposition into bedside choices exposes the lack of justification for the specific person denied.
  3.  **Uncertainty:** Expected utility is still aggregation. Taurek rejects the moral math of probabilities across persons.
  4.  **Impartiality:** Taurek permits partiality; triage forbids it. Taurek is silent on whether public roles waive this permission, which is a major gap.
  5.  **Age Criterion:** This is aggregative (maximizing life-years), not fair-share. Taurek rejects it unless framed as instrumental survival probability.
  6.  **Verdict:** Taurek mandates lotteries for equal cases. This leads to higher mortality. Whether this is a *reductio* depends on whether you accept his metaphysics of loss. The stronger critique is **scope**: Taurek fails to distinguish institutional design from individual rescue, rendering the theory silent or incoherent on policy-level triage where "the numbers" are the only variable the agents (Committee) actually face.

  **Explicit Silence to Highlight:** Taurek offers no account of **public resource allocation**. He treats resources as if they are up for grabs by the rescuer. He does not address how pre-existing property rights or social contracts (the hospital belongs to the state) might constrain the "flip a coin" permission. This is the gap the Italy case exposes.
