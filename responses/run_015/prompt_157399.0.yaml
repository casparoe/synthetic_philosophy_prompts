prompt: |-
  yo — I'm in a medical ethics seminar this term and we just did Taurek on whether the numbers count, and I've got an essay due and I'm kind of stuck, so bear with me.

  The case I want to use is the ICU collapse in northern Italy in March 2020: hospitals in Lombardy ran out of ventilators and beds, and ended up allocating them using criteria like age and how much life a patient had left, and from what I remeber the guidance was written in advance by a committee rather than decided at the bedside. I'm going form memory, so if any detail is off just go with the version I've given you — I don't need the actual policy text.

  The thing that's messing with me is what I've been calling the displacement problem. At the moment of any actual decision, a doctor is choosing between two named patients, and either way one person lives and one person dies. The numbers — save the most lives, don't waste a ventilator on someone who'll die anyway — only show up one level up, in the justification for the protocol, which was written earlier by people who weren't in the room and didn't know who the patients would be. So what is Taurek's claim even supposed to be about here? Does it simply fail to apply, because no aggregation happens at the bedside? Or is that actually the whole objection — that the aggregative justification has to decompose into a long series of one-against-one choices, and can't survive the decomposition?

  Two more wrinkles, sorry. (1) Nobody in March 2020 knew how many lives any given protocol would save, or even how bad the surge would get — so the "many" is an expectation over unknowns, not a headcount. Does an argument about not summing across people have anything to say about summing expected lives, or is that just the same thing in a trenchcoat? (2) The protocols also told doctors to ignore the fact that the patient in front of them is theirs and the other one is a stranger. The Taurek-ish permission to save your own, or the one you stand in some relation to, seems to push against triage pretty hard.

  What I want is a careful mapping of the case onto the theory first — who the agent actually is, what the options are, what's supposed to be the relevant comparison class — and then an honest verdict running both ways. Does Taurek commit you to running triage by lottery? And if a lottery would mean more people die, are you allowed to count that, or does counting it smuggle aggregation back in? Was the age / remaining-life criterion aggregating at all, or was it closer to a "everyone should get a fair share of a life" thought that someone who rejects aggregation could still sign onto? And what does the episode do to Taurek himself: a reductio, or just a case outside the theory's intended scope — rules and institutions rather than one-off rescues — and if it's the latter, does that scope limit matter?

  Don't spend half of it re-explaining Taurek's argument back at me, I've read it. No reading lists or citations either, I just want the analysis. And please be explicit about the places where you think the theory is just silent, instead of forcing an answer out of it.
