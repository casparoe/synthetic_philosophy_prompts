  *(Self-Correction on Agency)*: The user asks "Who the agent actually is." I need to argue that shifting agency to the committee doesn't save the aggregative view from Taurek, because the committee still faces distinct individuals, just more of them. Unless the committee views the *population* as a single entity (which Taurek denies exists).

