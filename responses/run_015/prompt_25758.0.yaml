  Perhaps the stone is not entirely blind,
  Nor electrons spin within the void of space.
  To save the mind from being left behind,
  We grant the atom a secret place.
  No magic leap from dead to living thought,
  From mute matter that never felt or sought.
  In every particle a spark is wrought,
  However faint, a mind in matter caught.

  But shift the gaze to ethical dismay,
  If consciousness fills the physical frame.
  Then every clash brings pain to light of day,
  And suffering makes a universal claim.
  We save the mind from being a machine,
  But make the cosmos a live wound, unseen.
