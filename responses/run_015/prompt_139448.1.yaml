answer: |-
  This is a classic reconstruction of the "Causal Selection Problem," dressed up in tort clothing. Dan's argument is valid, but it is not sound. It relies on a specific, and arguably outdated, package of metaphysical assumptions about causation (specifically, a binary, non-contrastive counterfactual theory combined with a strict event ontology).

  You are right to resist (8). The intuition that there is a causal difference between pushing a child under and standing on the bank is robust, and surrendering it buys you a metaphysical purity that costs you too much explanatory power. You are also right to want to keep (1); if causation tracks duties, we lose the ability to criticize duties as causally mistaken.

  Here is the breakdown of where the argument breaks, the cost of fixing it, and how to handle Dan's legal objection.

  ### The Pivot Point: Premise (4)

  The argument hinges on (4): *"And there's no non-normative difference to sort them by."*

  Dan claims the only difference between you (the gardener) and the Queen is normative (duty, role, promise). If this is true, and you hold (1), then (3) (profligacy) follows inevitably. To break the chain while keeping (1), you must show there *is* a non-normative difference that filters causes without invoking moral obligations.

  There are two main ways to do this.

  #### Option A: The "Normality" Move (Hart & Honoré)
  You challenge (4) by arguing that **expectations** can be descriptive/statistical rather than normative.
  *   **The Move:** In any causal model, we distinguish between the "normal course of events" and "interventions." The plant's death is caused by the deviation from the normal course. It is a statistical/descriptive fact that gardeners water plants and Queens do not. This is a fact about social functioning and system design, not necessarily moral duty.
  *   **The Cost:** You have to walk a tightrope. Dan will argue that "normal" just smuggles in "expected," and "expected" smuggles in "obligated." If the "normal course" is defined by what agents *ought* to do in a system, you've violated (1). You must insist that "normal" means "statistically regular within the specific system," not "morally required."
  *   **Verdict:** This preserves (1) and blocks (3), but it is vulnerable to the charge that statistical normality in social contexts is inseparable from norms.

  #### Option B: The "Contrastive" Move (Schaffer)
  You challenge the underlying logic of (2) and (3). Causation is not binary ($c$ causes $e$); it is ternary/contrastive ($c$ rather than $c^*$ causes $e$ rather than $e^*$).
  *   **The Move:** Profligacy arises because we ask, "Did the Queen's not-watering cause the death?" The contrastive theorist says, "Compared to *what*?"
      *   For you: The relevant contrast is *you watering*. You-not-watering rather than you-watering causes death.
      *   For the Queen: The relevant contrast is *Queen not-watering*. Queen-not-watering rather than Queen-not-watering is null. The alternative "Queen watering" is not a relevant contrast in the actual context.
  *   **The Cost:** You abandon the standard binary counterfactual analysis. Causal claims become context-sensitive. However, this context-sensitivity is **pragmatic**, not **normative**. It depends on what alternatives are salient in the conversation, not on moral duty.
  *   **Verdict:** This is the strongest metaphysical defense. It keeps (1) intact (salience is not morality) and blocks (3) without admitting the Queen is a cause.

  ### Addressing Dan's Legal Objection

  You mentioned your move on the day was "Causation vs. Explanation," and Dan countered that criminal statutes require causation to do work, not just explanation. He is conflating **Cause-in-Fact** with **Proximate Cause**.

  *   **The Move:** You can concede Dan's point about the *statute* without conceding his metaphysics.
      *   **Metaphysical Causation (Factual):** Can be profligate. Yes, the Queen is a factual cause (but-for cause). This satisfies (1).
      *   **Legal Causation (Proximate):** Is a hybrid concept. It takes the set of factual causes and filters them through policy, foreseeability, and duty.
  *   **The Counter to Dan:** When a statute says "caused the death," it does not mean "is a but-for cause." It means "is a *proximate* cause." Proximate cause *is* allowed to be normative. That is why we have juries.
  *   **The Cost:** You admit that metaphysical causation alone does not solve the legal problem. It only provides the input. The "work" Dan wants done is done by *imputation*, not metaphysics.
  *   **Verdict:** This saves your "Causation vs. Explanation" move. Dan is right that *legal* causation isn't profligate, but wrong to think that implies *metaphysical* causation must be restrictive.

  ### Addressing Corollary (8): Killing vs. Letting Die

  You said (8) costs too much. You can reject (8) even if you accept omissions as causes. Dan's argument assumes causation is univocal—that a cause is a cause is a cause.

  *   **The Move:** Adopt a **Pluralist** theory of causation.
      *   **Commissions (Killing):** Causation via energy transfer / physical process.
      *   **Omissions (Letting Die):** Causation via counterfactual dependence / absence of process.
  *   **Why this blocks (8):** There *is* a causal difference. One involves a physical mechanism initiating a chain; the other involves the absence of a mechanism preventing a chain. They are both "causes" (in the broad sense), but they are causally distinct *types*.
  *   **The Benefit:** You can maintain that the drown-er is *more* causally responsible, or causally prior, without invoking norms. The energy transfer is a non-normative difference that distinguishes the two cases.
  *   **The Cost:** You lose a unified theory of causation. You have to explain how two different relations (process and counterfactual) both get the name "cause." (Most philosophers accept this cost; see Hall 2004).

  ### Recommendation: Which Premise to Surrender?

  Do not surrender (1). Norm-dependence in metaphysics is a category error that creates more problems than it solves (e.g., causal facts changing when laws change).

  **Instead, surrender the Binary Assumption hidden in (2) and (3).**

  1.  **Adopt Contrastive Causation:** This solves the Profligacy Problem (3) without invoking Norms (4). The Queen is not a cause because "Queen watering" is not a relevant contrast. This is a pragmatic fact, not a moral one.
  2.  **Clarify the Legal Distinction:** Tell Dan that criminal statutes rely on *Proximate* Cause, which is permitted to be normative. Metaphysical causation provides the candidate pool; norms select the defendant. This answers his "statutory" objection without corrupting (1).
  3.  **Reject (8) via Pluralism:** Even if omissions are causes, commissions involve physical processes. There is a non-normative causal difference between pushing and standing.

  **The Price You Pay:**
  You have to teach your students that "cause" is context-sensitive (contrastive) and potentially pluralistic (process vs. dependence). That is a standard cost in modern metaphysics. It is cheaper than the price of (8), which eliminates the causal distinction between murder and negligence.

  **Summary for your next seminar:**
  Dan's argument is valid only if causation is binary, non-contrastive, and univocal. If you allow causation to be contrastive (solving profligacy) and pluralistic (solving killing/letting die), you can keep norm-independence (1) and reject the conclusion (8). The legal objection fails because it conflates factual cause (metaphysical) with proximate cause (legal/normative).
