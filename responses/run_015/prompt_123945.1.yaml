  2.  **Brainstorming Distinctions (Philosophical/Editorial):**
      *   *Intentional Fallacy:* Does what the author *meant* matter more than what the text *says*?
      *   *Final Intention:* Which moment of intention counts? (Draft, proof, post-publication?)
      *   *Social Text:* The text as consumed by the public over time.
      *   *Versioning:* Is it one work or multiple works?
      *   *Accident vs. Substance:* Spelling vs. thematic content.
      *   *Competence:* Was the author capable of executing the intention?
      *   *Authority:* Who owns the text? (Estate, Public, Editor).
      *   *Harm:* Does the text cause damage if left alone?
      *   *Clarity:* Does the variation obscure basic comprehension?
      *   *Consistency:* Internal logic of the fictional world.
      *   *Historical Distance:* Can modern readers access the original context?
      *   *Pedagogical Utility:* What helps students learn?
      *   *Irreversibility:* Once printed, can it be undone?

  3.  **Filtering for the "One-Hour Meeting/Printing Deadline" Constraint:**
