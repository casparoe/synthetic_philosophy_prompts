          *   *Unwelcome Result:* The user wants to believe the father. The procedure says the evidence doesn't support the daughter's request for a definitive note.
          *   *Confidence:* High.

      *   *Case 3 (Unfinished/Offensive):*
          *   Evidence: Draft + Outline (unwritten frame).
          *   Intention: Narrator unreliable (per outline).
          *   Harm: Ethnic caricature.
          *   Stakeholders: Estate (cut), Ghostwriter (keep), Editor (decide).
          *   Procedure Check: This is a Value Judgment (Harm vs. Integrity).
          *   Outcome: Print the text *as is* (integrity of the draft) + Introduction/Note explaining the unwritten frame. Cutting it falsifies the existing document. Keeping it bare misleads.
          *   *Confidence:* Medium (High ethical risk).

  6.  **Refining the "Discarded Distinctions" Section:**
      *   Must explain *why* they were thrown out (time, evidence, practicality).
