          *   *Correction:* If the author *slipped*, the intention was consistency. The print made it consistent. The MSS made it inconsistent. If the author slipped in MSS, the Print actually *fixed* the intention.
          *   *Decision:* Emend to the MS spelling? No, that creates inconsistency. Emend to Print? That's the status quo. Annotate the MS variation.
          *   *Procedure Output:* Annotate the variation. Do not emend the text. (Confidence: High).

      *   *Case 2 (Irony Interview):*
          *   Evidence: Late interview (20 yrs later) vs. Drafts/Letters (contemporaneous).
          *   Intention: Late claim = Irony. Contemporaneous = Worry about subtlety, cutting down. No ironic markers in drafts.
          *   Procedure Check: Post-publication intention is weak evidence compared to contemporaneous drafts.
