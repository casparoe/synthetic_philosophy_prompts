answer: |-
  ### Part 1: The Filter (What I Threw Away)

  Before giving you the tool, you need to know what I broke to build it. In a one-hour meeting with a printing deadline, metaphysics is a luxury you cannot afford. I started with the standard philosophical distinctions and ruthlessly cut anything that requires more than fifteen minutes of research or relies on speculation we cannot verify.

  **1. "The Work" vs. "The Text"**
  *   *The Distinction:* The abstract aesthetic object (The Work) versus the physical words on the page (The Text).
  *   *Why Discarded:* You cannot print "The Work." You print a text. Arguing over whether the Work survives a typo change consumes forty minutes of a meeting and changes nothing on the page. We deal in ink, not ideals.

  **2. The "Ideal Reader" vs. The "Historical Reader"**
  *   *The Distinction:* How a contemporary of the author would have read it vs. how a student today reads it.
  *   *Why Discarded:* You have no time to reconstruct 1925 reception for a 1950 novel. Furthermore, your editions are for *today's* students. If the historical reading requires a footnote longer than the passage, the historical reading is pedagogically dead.

  **3. "Final Intention" (Theoretically Defined)**
  *   *The Distinction:* The moment the author *really* meant it to be finished (last breath? last proof? last interview?).
  *   *Why Discarded:* Your friend is right that intention never *settles* anything if treated as a mystical aura. But you are also right that it matters. The distinction fails when it becomes a contest of dates. We need a hierarchy of evidence, not a theory of time.

  **4. Moral Harm vs. Aesthetic Integrity**
  *   *The Distinction:* Whether a passage is offensive versus whether it belongs to the art.
  *   *Why Discarded:* In a weekly editorial meeting, this devolves into ideology. It cannot be proceduralized. It must be flagged as an executive decision, not an editorial one.

  ***

  ### Part 2: The Procedure (The "Four-Point Check")

  This procedure is designed to resolve the tension between your belief in intention and your friend's skepticism. It treats intention not as a mental state, but as a *material claim* that requires evidence. It prioritizes the "Received Text" only when the "Authorial Text" is unknowable or when the "Received Text" has acquired independent historical weight.

  **Constraint:** You have 40 notes per volume. Emendation is free; annotation costs budget. Prioritize emendation if it clarifies; prioritize annotation if it preserves necessary ambiguity.

  **The Query Sheet (Run this in order):**

  **Q1: Is there material evidence of a breakdown in transmission?**
  *   *Look for:* Mismatch between MS/Typescript and First Edition (FE) that cannot be explained as authorial revision (e.g., compositor error, missing page, obvious typo).
  *   *Sufficient Answer:* Yes (e.g., MS says "form," FE says "from" with no author correction on proofs).
  *   *Hard No:* If the variation exists in two author-corrected states (e.g., MS A vs. MS B), stop. This is revision, not error. Proceed to Q4.
  *   *Action:* If **Yes**, Emend to the authorial state. No note required unless the error was famous.

  **Q2: Does the 'error' violate the internal logic of the fictional world?**
  *   *Look for:* Continuity errors, impossible timelines, name changes that confuse identity (not theme).
  *   *Sufficient Answer:* Yes, a reader cannot comprehend the plot without correction.
  *   *Hard No:* If the variation allows for a coherent (even if complex) reading.
  *   *Action:* If **Yes**, Emend. Note the change briefly. (Comprehension trumps history).

  **Q3: Is the 'intention' corroborated by contemporaneous evidence?**
  *   *Look for:* Letters, drafts, or diaries from the *period of composition*.
  *   *Sufficient Answer:* Yes, the author explicitly stated the goal *while writing*.
  *   *Hard No:* If the evidence is post-publication memory (interviews decades later, memoirs).
  *   *Action:* If **Yes**, you may emend or annotate to support the intention. If **No**, treat post-hoc claims as secondary commentary, not textual authority. (This resolves your dispute with your friend: Memory is commentary, not evidence).

  **Q4: Does the 'Received Text' have independent cultural currency?**
  *   *Look for:* Famous lines, established critical debates, standard page citations in scholarship.
  *   *Sufficient Answer:* Yes, changing this would break 60 years of scholarship or classroom discussion.
  *   *Action:* If **Yes**, Do Not Emend. Annotate the authorial intention/variant instead. (Preserve the object of study).

  **The Value Judgment Flag:**
  If Q1–Q4 yield conflicting results (e.g., Material Evidence says change, Received Text says keep), OR if the query involves ethical harm (race, gender, violence), **stop**. This is not a textual query. It goes to the Senior Editor (you) or the Executor. Mark as "Executive Decision."

  ***

  ### Part 3: Running the Cases

  Here is the output of the procedure on your three queries.

  #### Case 1: The Name Inconsistency
  *   **Facts:** MS inconsistent (Slip); FE consistent (Regularized); Criticism split (1 person vs. Memory signal).
  *   **Q1 (Transmission):** Yes. The MS shows a slip; the FE regularized it. The FE likely reflects the author's *desired* consistency, even if the compositor did the work.
  *   **Q2 (Logic):** No. Both readings (one person vs. two) are logically possible within the fiction.
  *   **Q3 (Intention):** Ambiguous. No contemporaneous letter says "I meant two people." Probability favors slip.
  *   **Q4 (Received Text):** Yes. Half the criticism treats them as one, half as two. The inconsistency is now part of the critical history.
  *   **Procedure Output:** **Do Not Emend.** Keep the First Edition (consistent) text. **Annotate.**
  *   **Note Content:** "The typescript shows variant spellings in early chapters, regularized in the First Edition. While likely a compositor correction of an authorial slip, some critics have interpreted the variance as a marker of the narrator's memory."
  *   **Confidence:** High (90%).
  *   **Reasoning:** Emending to the MS inconsistency creates a "new" text that privileges a likely error over the published history. Annotating preserves the critical debate without falsifying the text students will cite.

  #### Case 2: The Irony Interview
  *   **Facts:** Late interview claims irony; Contemporaneous letters show worry about subtlety; Drafts lack markers; Executor wants note.
  *   **Q1 (Transmission):** No. The text printed is what was drafted.
  *   **Q2 (Logic):** No. The speech works straight or ironic.
  *   **Q3 (Intention):** **Hard No.** The claim is post-publication memory (20 years later). Contemporaneous evidence (letters/drafts) contradicts it (he worried it was *too* subtle, implying he failed to make it clear, not that he succeeded).
  *   **Q4 (Received Text):** Yes. "Nearly every reader has taken it straight."
  *   **Procedure Output:** **Do Not Add Executor's Note.** You may add a textual note, but it must frame the interview as contradictory evidence, not authoritative key.
  *   **Note Content:** "In a [Year] interview, the author claimed this speech was ironic. However, contemporaneous drafts lack ironic markers, and letters suggest the author feared the passage was too direct. The text supports a straight reading."
  *   **Confidence:** High (95%).
  *   **Unwelcome Result:** I know you want to believe the father. The procedure tells you his memory is unreliable evidence compared to the drafts. The Executor will be unhappy. This is the cost of Q3's Hard No on post-hoc intention.

  #### Case 3: The Unfinished Novel & The Caricature
  *   **Facts:** Draft contains offensive caricature; Outline promises exculpatory frame (unwritten); Estate wants cut; Ghostwriter wants keep.
  *   **Q1 (Transmission):** N/A. This is not a correction query; it is a construction query.
  *   **Q2 (Logic):** N/A.
  *   **Q3 (Intention):** Mixed. Outline shows intent to undermine narrator, but the text itself does not do the work.
  *   **Q4 (Received Text):** N/A. Unpublished.
  *   **Procedure Output:** **Value Judgment Flag.** This triggers the Executive Decision clause.
  *   **Recommendation:** **Print the text bare + Introduction.** Do not cut. Do not annotate the passage itself (wastes note cap, draws eye).
  *   **Reasoning:** Cutting falsifies the historical document (the draft). Annotating the passage ("Author meant to fix this later") acts as an apology that distracts from the reading. The Introduction is the proper place to explain the unwritten frame.
  *   **Confidence:** Medium (70%).
  *   **Risk:** High. This will generate controversy. But the procedure correctly identifies that this is not a textual emendation problem; it is an ethical publication strategy problem.

  ***

  ### Part 4: Where This Procedure Will Misfire

  You asked for plain speaking. This tool is a scalpel, not a cure-all. It will fail in the following scenarios:

  **1. The "Lost Middle" Problem**
  If the Typescript and the First Edition differ, but the Proof sheets are lost, Q1 becomes a guess. The procedure assumes the FE reflects authorial correction. Sometimes it reflects compositor arrogance. You will occasionally emend a "correction" that was actually an authorial last-minute change we cannot see.

  **2. The "Complicit Author" Problem**
  If the author *approved* a compositor's error (common in the mid-20th century to save money/time), Q1 flags it as transmission error, but it is actually authorial. The procedure will urge you to "fix" something the author accepted. You need a general knowledge of that specific author's proofing habits to override Q1.

  **3. The Ethical Override**
  In Case 3, the procedure flags the decision but doesn't make it. If you decide to cut the caricature to protect students, you are violating the "Do Not Falsify" principle inherent in Q1/Q2. The procedure cannot calculate moral harm. It assumes "truth to the document" is the highest good. If your press decides "safety" is the highest good, you must ignore the procedure's recommendation on Case 3.

  **4. The Note Cap Collision**
  The procedure prioritizes annotation for complex intention cases (Case 1 & 2). If you have 40 such queries in one volume, you will break your 40-note cap. The procedure does not prioritize *which* notes matter most. You will need a triage step: "Does this note change the plot?" If no, and you are over cap, drop the note, even if the procedure says annotate.

  **Final Advice:**
  Your friend is right that intention is slippery, but you are right that it is necessary. This procedure bridges that by treating intention as *evidence* rather than *authority*. If the evidence (drafts/letters) isn't there, the intention doesn't count, no matter how much the Executor wishes it did. Stick to Q3. It is the only thing that will keep you out of trouble when the critics come.
