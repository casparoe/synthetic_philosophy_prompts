answer: |-
  1. The theory predicts that institutionally splitting ceremonial and instrumental sovereignty stabilizes the state by insulating national continuity from the volatility of partisan governance. This separation allows the symbolic head to embody unity while elected officials bear the burden of contentious policy decisions.
  2. The 1974 reform mapped this split by stripping the Swedish monarch of all formal political powers, reducing the crown to a purely ceremonial symbol of state continuity. Concurrently, instrumental authority was consolidated within the Riksdag, where the Speaker gained the exclusive power to propose the prime minister.
  3. This framework effectively explains why Sweden retained the monarchy despite radical democratization, as the crown's depoliticization preserved historical continuity without threatening popular rule. The monarch could remain a unifying figure precisely because the reform ensured they wielded no instrumental authority to contest.
  4. However, the theory overlooks how the reform prioritized popular legitimacy over dynastic continuity by making the monarch's historical status irrelevant to executive power. By vesting sole authority in the Riksdag Speaker, the system silenced the notion that the crown contributes any substantive democratic validity to the government's formation.
  5. The Swedish case reveals that democratic legitimacy does not require this separation but merely accommodates it as a cultural preference rather than a structural necessity. Ultimately, the reform demonstrates that instrumental authority can function entirely independently of symbolic sovereignty without compromising the democratic mandate.
