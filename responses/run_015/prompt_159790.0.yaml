  **STANDING COMMITTEE ON COMMEMORATIVE COHERENCE**
  **Minutes of Meeting 442**
  **Date:** October 14
  **Location:** Admin Building, Room 304
  **Present:** Dr. Aris (Chair), Prof. Blum, Dean Chen, Student Rep. Diaz, Legal Counsel Evans

  **1. Call to Order**
  The meeting was called to order at 2:00 PM. The Chair noted that the quorum was valid despite the absence of the Alumni Representative, whose seat remains vacant pending verification of standing.

  **2. Item: The Silas Vane Statue (Backward vs. Forward-Looking Valuation)**
  The Committee reviewed the petition regarding the statue of Silas Vane (Class of 1892). Prof. Blum presented the Honoring Amortization Schedule. Under current policy, the honoring-force of a monument is treated as a capital stock depreciating at 5% per annum. Vane died 120 years ago. The Committee calculated the residual honoring value at 0.04%. It was noted that backward-looking reasons (gratitude for past endowment) are now outweighed by forward-looking costs (current student distress). The Committee agreed to treat these distinct ethical categories as commensurate units on a single decision-theoretic scale. The motion to classify the statue as a fully depreciated asset passed unanimously.

  **3. Item: Expressive Status of Retention**
  Legal Counsel Evans clarified that retaining the statue is not a neutral omission. It is a present-tense speech act by the University. To leave the statue is to endorse Vane now. The defense that we are merely preserving history was rejected. Preservation is a curatorial choice that constitutes endorsement. Therefore, the University is actively speaking through the statue every day it remains upright.

  **4. Item: The Epistemic Defense**
  The Committee considered the argument that Vane should be judged by the standards of his time. If ignorance of moral wrongs excuses Vane's original deeds, it must also excuse the University's original decision to honor him. However, if ignorance excuses us now for honoring Vane, it must also excuse future generations for condemning us. The Committee concluded that we are currently ignorant of future moral standards. Therefore, any honor we confer today is likely erroneous. To remain consistent, the University must assume its current judgments are morally compromised.

  **5. Item: Contextualization and Leakage**
  A proposal to install explanatory plaques was discussed. The Committee rejected this based on the principle of Honoring Leakage. Honoring spills from the statue into the immediate environment, including the plaza, the street name, and any added plaques. A plaque intended to critique the statue becomes part of the commemorative complex, absorbing the critique into the honor. Partial fixes fail because the leakage contaminates the correction. The only containment strategy is total removal of the honoring stock.

  **6. Item: Standing and Entanglement**
  The Committee addressed who possesses the standing to decide. The descendants of Vane claim standing via fidelity. The descendants of those harmed by Vane claim standing via justice. Current students claim standing via occupancy. However, the University's founding endowment is entangled with Vane's capital. The University lacks the standing to judge its own financier without negating its own financial foundation. To judge Vane is to judge the University. Therefore, the University cannot reliably adjudicate this matter.

  **7. Adjournment**
  The meeting was adjourned at 3:15 PM to draft Resolution 24-B.

  ***

  **RESOLUTION 24-B: IMPLEMENTATION OF THE SUNSET PROTOCOL**

  **Whereas** honoring amortization confirms all commemorative assets eventually reach zero residual value;
  **Whereas** honoring leakage prevents partial contextualization;
  **Whereas** the University lacks standing to judge its own founding entanglements;
  **Whereas** current epistemic limitations guarantee future condemnation of present honors;

  **Be It Resolved** that all commemorative acts on University property are hereby classified as provisional.

  1.  **Mandatory Expiration:** All statues, named buildings, and endowed chairs shall expire after a term of 25 years.
  2.  **Renewal Process:** Renewal requires verification of standing by a committee composed entirely of individuals not yet born at the time of the original honor.
  3.  **Self-Application:** This Resolution applies to the Standing Committee on Commemorative Coherence. The Committee's own name shall be expunged from the record upon the completion of its final report.
  4.  **Pre-Commitment:** The University hereby grants standing to future generations to dismantle any honor currently held, including the endowment that funds this Resolution.

  ***

  **APPENDIX A: DEPRECIATION SCHEDULE (EXCERPT)**

  | Asset | Age | Depreciation Rate | Residual Honoring Value | Maintenance Cost | Net Ethical Yield |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Vane Statue | 120 yrs | 5.0% | 0.04% | $4,500/yr | Negative |
  | Hall of Sciences | 40 yrs | 5.0% | 12.5% | $12,000/yr | Neutral |
  | Committee Chair | 2 yrs | 5.0% | 90.2% | $0.00 | Pending Audit |

  *Certified by the Office of Commemorative Accounting.*
