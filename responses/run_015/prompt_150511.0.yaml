  Subject: Independent Study Proposal: Hofstadter & Handedness

  Hi [Professor's Name],

  Hope you're having a good week. Following up on our seminar discussion, I've drafted a proposal for the independent study we talked about. Here's the breakdown:

  **1) The Precise Question**
  Here's the core puzzle I want to tackle: Does Hofstadter's inversion technique work because of deep cognitive coding regarding unmarked linguistic categories, or does it solely rely on existing social tension and prejudice to generate its critical force? In "A Person Paper," Hofstadter swaps gender pronouns for racial ones to make masculine generics sound ridiculous. The standard assumption is that the discomfort comes from exposing sexism. But I want to isolate the linguistic mechanism from the social content. By applying the same inversion trick to handedness—where "right-handed" is the unmarked default but lacks a significant civil rights movement or historical stigma—I can test the boundary. If rewriting texts to privilege left-handedness produces the same cognitive dissonance as Hofstadter's gender swap, then the effect is rooted in how brains process marked vs. unmarked terms universally. If the handedness version falls flat or feels merely silly rather than unjust, then the satire's power is purely a social mirror dependent on specific political contexts. I'm framing this as a determinate question about the source of semantic friction: is it in the grammar of defaults or the politics of identity? I want to conclude with a specific claim about whether linguistic markedness alone is sufficient to generate ethical discomfort, or if it requires pre-existing social fuel to ignite. Ultimately, I need to know if the "unmarked" category is inherently invisible to the speaker, or if it's only invisible because society tells us to ignore it. This distinction matters for whether we fix language to change minds, or change minds to fix language.

  **2) Why Usual Readings Leave This Open**
  The usual readings of Hofstadter leave this open because they treat the satire as a monolithic tool for consciousness-raising. Most commentary stops at "satire reveals hidden bias," which is true but doesn't explain the mechanism. It assumes the bias is the engine, ignoring the chassis of language itself. If the discomfort is purely social, then swapping terms in a vacuum shouldn't work. But if the discomfort is linguistic, the swap should work even without the baggage. Current scholarship conflates the medium with the message. They don't separate the cognitive shock of encountering a marked term where an unmarked one is expected from the moral shock of encountering prejudice. By not disentangling these, existing literature can't predict whether this technique would work on non-political categories. They assume the political content is necessary, but they haven't proven it. This project fills that gap by treating the satire as a variable experiment rather than just a rhetorical artifact. Furthermore, standard analyses often presuppose that language is merely a reflection of social power dynamics. If I can show that the linguistic structure itself generates discomfort independent of power, it challenges the view that semantics is wholly subordinate to sociology. We need to know if the "generic masculine" is problematic because it excludes women specifically, or because any exclusive generic creates a cognitive blind spot. The current literature doesn't distinguish these cases, leaving the actual source of the philosophical problem unresolved.

  **3) The Method**
  Here's the plan. This isn't just a literature review; I'm building a comparative framework.
  Month 1: I'll dig into Hofstadter's original text and secondary lit on linguistic markedness (like Jakobson or contemporary pragmatics). I need to solidify the definition of "unmarked default" so I'm not just guessing. I'll also look into any existing psycholinguistics on handedness metaphors to ensure I'm not missing hidden stigma.
  Month 2: Construction phase. I'll write the "Handedness Paper." I'll take standard generic texts (syllabi, legal disclaimers, philosophical abstracts) and rewrite them treating "left-handed" as the marked deviant and "right-handed" as the specific, marked category, mirroring Hofstadter's syntax exactly. For example, changing "mankind" to "rightkind" or similar structural shifts. I'll also prepare a parallel gender-inversion excerpt for direct comparison to ensure the syntactic load is identical.
  Month 3: Analysis and informal testing. I won't do formal IRB research, but I will run these texts by a small group of peers to gauge their intuitive reactions. Is the handedness version "funny" or "wrong"? I'll catalog the qualitative differences in their discomfort. Is it moral outrage or just confusion? I'll look for specific linguistic markers that trigger the "this is weird" response versus the "this is unjust" response.
  Month 4: Writing. I'll synthesize the results into a paper arguing for either the cognitive or social model. I will draft sections weekly.
  This method moves beyond exegesis. I'm creating new data (the thought experiment) to test a philosophical hypothesis. It's armchair experimental philosophy. I'm not just asking what Hofstadter meant; I'm using his tool on a new material to see if the tool itself holds up. This ensures the project produces original insight rather than just summarizing existing debates about gendered language. The key is the comparative element: holding the linguistic structure constant while varying the social stakes. If the reaction varies, I have my answer. If it stays the same, I have a different, perhaps stronger, claim about cognitive defaults. This active construction of examples is what makes it an independent study rather than a directed reading course.

  **4) Success vs. Failure**
  Success looks like a clear verdict on the source of the satire's power. If I can demonstrate that handedness inversion fails to provoke the same ethical intuition as gender inversion, I've proven the social mirror theory. If it succeeds equally well, I've proven the cognitive default theory. Either way, I get a determinate answer about the relationship between semantics and politics.
  Failure would be ambiguity. If handedness turns out to have hidden social stigma I didn't anticipate (like historical superstitions about lefties), the control variable is compromised. Also, if I can't articulate the difference between "confusion" and "offense" clearly, the analysis stays muddy. Another failure mode is getting stuck in the linguistics weeds and losing the philosophical thread about bias. Essentially, if I end up saying "it's complicated" without narrowing down which factor weighs more, the project hasn't met its goal. I need to avoid sitting on the fence.

  **5) Scope Check**
  The biggest risk is scope creep into empirical psychology. If I start wanting to run formal surveys, I'll need IRB approval, which kills the timeline. I have to stay strictly philosophical with informal anecdotes. Also, if I dive too deep into the neuroscience of handedness, I'll lose focus on language. I need to keep the focus on the *terms*, not the brain biology. Keeping the text rewriting limited to 3-4 key examples will prevent me from spending all month editing sentences.

  Thanks for considering this. I think it could be a fun ride.

  Best,
  [My Name]
