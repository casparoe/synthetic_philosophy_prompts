prompt: |-
  I sit on a small city ethics review board and every month we get proposals asking citizens to take a real hit for collective goods -- mandatory vax for healthcare workers, carbon fees, zoning rules that wipe out a landlord's income. I need a reusable decision procedure my board can run in about 20 minutes, no philosophy phd required, grounded in consequentialist reasoning but with demandingness objections built in. Don't just measure cost size; check whether the demand is sacrificial -- it forces someone to abandon or radically shrink a core life project -- versus friction, where they just adjust inside the project. Also run a residue check: even if they comply, is there a grievance that doesn't vanish?

  Write it as ordered questions with clear stop/no points and explicit flag points where it's a values call not a fact call, so the board chair has to sign off. Include test conditions a non-expert can apply, and say exactly where the procedure breaks down -- probably when goods are incommensurable, and when we ask if collective benefits ever justify sacrificial demands.

  Then apply it to three proposals:
  - mandatory flu vaccination for nursing-home staff
  - an 8% post-tax income donation mandate for local food security (this is one I actually support, so I want the procedure to wrestle with it and maybe tell me I'm wrong)
  - a retrofit zoning rule that wipes out a small landlord's rental income

  Keep it checklist form, no bibliographies, just steps and worked examples.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Member of a small city ethics review board.
      *   **Task:** Create a reusable decision procedure (checklist) for evaluating proposals that impose costs on citizens for collective goods.
      *   **Constraints:**
          *   Must take ~20 minutes.
          *   No philosophy PhD required (accessible language).
          *   Grounded in consequentialism (maximize good) but integrates "demandingness objections" (limits on how much can be asked).
          *   Distinguish between *sacrifice* (abandoning core life projects) vs. *friction* (adjusting within projects).
          *   Include a "residue check" (lingering grievance even if compliance occurs).
          *   Format: Ordered questions, clear stop/no points, explicit "values call" flag points (Chair sign-off).
          *   Include test conditions for non-experts.
          *   Explicitly state where the procedure breaks down (incommensurability, justification of sacrifice).
          *   Apply to three specific cases: Mandatory flu vax, 8% income donation mandate, Retrofit zoning wiping out income.
      *   **Tone:** Practical, rigorous, honest about limitations.

  2.  **Deconstruct the Ethical Framework:**
      *   *Consequentialist Base:* Does the policy produce net good? (Benefit > Cost).
      *   *Demandingness Constraint:* Is the cost too high for the individual, even if the net good is positive? (The "Sacrifice vs. Friction" distinction).
      *   *Residue:* Acknowledging moral remainder/regret.
      *   *Procedural Justice:* Who decides when values clash? (Chair sign-off).

  3.  **Drafting the Procedure (The "20-Minute Ethics Triage"):**
      *   *Step 1: The Consequentialist Floor.* Is there a real benefit? If no, stop.
      *   *Step 2: Cost Classification.* Friction vs. Sacrifice. This is the core innovation requested. Need clear tests for this.
      *   *Step 3: The Demandingsness Threshold.* If it's a sacrifice, is it justified? This needs a "Values Call" flag.
      *   *Step 4: Residue Check.* Acknowledge the moral cost.
      *   *Step 5: Final Authorization.* Chair sign-off on value judgments.

      *Refining the "Sacrifice vs. Friction" Test:*
      *   Friction: Annoyance, cost, time, but life plan remains intact.
      *   Sacrifice: Life plan disrupted, core identity threatened, financial viability lost.
      *   *Test:* "The 5-Year Projection." Can they still do what they planned in 5 years?

      *Refining the "Stop/No" Points:*
      *   If Benefit is negligible -> Reject.
      *   If Cost is Sacrificial *and* Benefit is marginal -> Reject.
      *   If Cost is Sacrificial *and* Benefit is Existential (life/death) -> Proceed to Values Call.

      *Refining the "Values Call":*
      *   This is where the board admits consequentialism isn't enough. They need to vote on whether the collective good *trumps* the individual project.

  4.  **Drafting the Breakdown Section:**
      *   Where does this fail?
      *   Incommensurability (comparing lives to dollars).
      *   The "Justification of Sacrifice" (utilitarianism vs. rights).
      *   Prediction errors (we are bad at guessing costs).

  5.  **Applying to the Three Cases:**

      *   *Case 1: Mandatory Flu Vax (Nursing Home Staff).*
          *   Benefit: High (vulnerable lives).
          *   Cost: Low/Friction (needle prick, minor side effects).
          *   Sacrifice? No.
          *   Residue: Low (bodily autonomy concern, but minor).
          *   Verdict: Pass.

      *   *Case 2: 8% Income Donation Mandate.*
          *   Benefit: High (food security).
          *   Cost: High. 8% post-tax is significant.
          *   Sacrifice vs. Friction? For low/middle income, this is Sacrifice (can't pay rent/save). For high income, Friction.
          *   *Critical Test:* The procedure should flag this as problematic because it treats unequal burdens as equal.
          *   Residue: High (coercion vs. charity).
          *   Verdict: Likely Fail or Needs Major Modification (progressive scale). The prompt asks me to "wrestle with it and maybe tell me I'm wrong." I need to ensure the procedure highlights the sacrificial nature for average citizens.

      *   *Case 3: Retrofit Zoning (Wiping Out Landlord Income).*
          *   Benefit: Collective (housing/energy/safety).
          *   Cost: Total loss of income stream.
          *   Sacrifice vs. Friction? Sacrifice (destroys the business model/project).
          *   Demandingsness: Is the collective good worth destroying a specific person's livelihood?
          *   Residue: High (grievance about property rights/fairness).
          *   Verdict: Fail without compensation. (Takings clause issue, but ethically, it's a sacrificial demand).

  6.  **Review and Refine:**
      *   *Check Constraints:* 20 minutes? Yes, it's a checklist. No PhD? Yes, plain English. Chair sign-offs? Included. Breakdown section? Included.
      *   *Tone Check:* Is it too academic? Keep it punchy. "Stop/Go" language.
      *   *Specific Request:* "Don't just measure cost size; check whether the demand is sacrificial." Ensure Step 2 emphasizes this.
      *   *Specific Request:* "Residue check." Ensure Step 4 covers this.

  7.  **Final Polish:**
      *   Make sure the "Values Call" flags are distinct.
      *   Ensure the "Breakdown" section is honest about the limits of the tool.
      *   Verify the application to the 8% donation is rigorous (it shouldn't just pass because the user supports it).

      *(Self-Correction during drafting)*: I initially thought about putting the 8% donation as a "Pass" if the benefit is high enough. But the prompt asks me to check if it's *sacrificial*. For a median income earner, 8% post-tax is often rent or groceries. That is a core life project (housing/security). The procedure *must* flag this as a Sacrifice, forcing the Values Call. This honors the request to "wrestle with it."

      *(Refining the Zoning Case)*: "Wipes out income" is a strong phrase. If it wipes out *all* income, that's existential for the landlord. The procedure should catch this as a "Sacrifice" and likely recommend compensation or rejection.

      *(Refining the Vax Case)*: This is the control group. Should pass easily as "Friction."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The 20-Minute Ethics Triage: A Decision Procedure for Civic Burdens

  **Purpose:** To evaluate proposals that impose costs on citizens for collective goods.
  **Grounding:** Consequentialist (maximize net good) constrained by Demandingsness (limits on individual sacrifice).
  **Time Limit:** 20 Minutes.
  **Users:** Ethics Board Members (Non-Philosophers).

  ---

  ## PART 1: THE PROCEDURE

  ### STEP 1: The Consequentialist Floor (5 Minutes)
  *Goal: Establish if there is a net benefit worth pursuing.*

  1.  **Identify the Collective Good:** What specific harm is prevented or good created? (e.g., lives saved, housing secured, emissions reduced).
  2.  **Estimate Magnitude:** Is the benefit **Marginal** (nice to have), **Significant** (noticeable improvement), or **Existential** (prevents death/collapse)?
  3.  **Estimate Probability:** Is the benefit **Certain**, **Likely**, or **Speculative**?

  *   **STOP POINT:** If the Benefit is *Marginal* OR *Speculative*, **REJECT PROPOSAL**. Do not proceed.
  *   **FLAG POINT (Values Call):** If the Benefit is *Existential* but *Uncertain*, Chair must sign off on proceeding to Step 2.
      *   *Chair Initials: _______*

  ### STEP 2: The Burden Classification Test (7 Minutes)
  *Goal: Distinguish between Friction (adjustable) and Sacrifice (destructive).*

  **Do not just add up dollars.** Apply the **"Core Project Test"** to the affected group:

  1.  **The 5-Year Projection:** If this rule passes, can the average affected person still pursue their primary life plan (career, housing security, family support) in 5 years?
      *   [ ] Yes, mostly unchanged.
      *   [ ] Yes, but harder/slower.
      *   [ ] No, the plan becomes impossible.
  2.  **The Exit Option:** Can they avoid the cost by making a minor adjustment (e.g., switching providers, minor budget cut)?
      *   [ ] Yes.
      *   [ ] No, they must exit the activity entirely (quit job, sell property, leave city).
  3.  **Classification:**
      *   If answers are **Yes/Yes**: Mark as **FRICTION**.
      *   If answers are **No/No**: Mark as **SACRIFICE**.

  *   **STOP POINT:** If Burden is **SACRIFICE** AND Benefit (Step 1) is only **Significant** (not Existential), **REJECT PROPOSAL**. Collective gain does not justify destroying individual life projects for non-critical gains.
  *   **FLAG POINT (Values Call):** If Burden is **SACRIFICE** AND Benefit is **Existential**, proceed to Step 3. This requires a moral override.
      *   *Chair Initials: _______*

  ### STEP 3: The Distribution & Residue Check (5 Minutes)
  *Goal: Check for unfair targeting and lingering moral grievance.*

  1.  **Targeting:** Is the burden falling on a group that already bears high civic costs? (e.g., low-income, essential workers).
      *   [ ] Yes (High Risk)
      *   [ ] No (Low Risk)
  2.  **The Residue Question:** Even if they comply, will there be a justified grievance that remains? (e.g., "I did it, but it was wrong to ask me.").
      *   [ ] No Residue (They agree it was necessary).
      *   [ ] High Residue (They feel violated/used).
  3.  **Mitigation:** Is there a compensation mechanism (tax credit, subsidy, exemption) to reduce Sacrifice to Friction?
      *   [ ] Yes, included.
      *   [ ] No.

  *   **FLAG POINT (Values Call):** If **High Residue** exists, the Board must explicitly vote on whether to accept "Moral Remainder" (acknowledging a wrong was committed for the greater good).
      *   *Chair Initials: _______*

  ### STEP 4: Final Authorization (3 Minutes)
  *   **Recommendation:** [ ] Approve [ ] Reject [ ] Approve with Mitigation
  *   **Rationale:** Must cite Step 2 Classification (Friction vs. Sacrifice).
  *   **Chair Sign-Off:** Required if any FLAG POINTS were triggered.

  ---

  ## PART 2: WHERE THIS PROCEDURE BREAKS DOWN

  Be aware of these three failure modes. If you encounter them, the checklist cannot save you; you must debate.

  1.  **Incommensurability:** The procedure assumes we can compare "Collective Good" against "Individual Cost." Sometimes these are different currencies (e.g., *Economic Stability* vs. *Bodily Autonomy*). The checklist forces a comparison that might be logically invalid.
  2.  **The Sacrifice Justification Gap:** Step 2 tells you *if* it is a sacrifice, but not *when* a sacrifice is permissible. Utilitarianism says "always if net good is higher." Rights-based ethics says "never." This procedure splits the difference but doesn't solve the philosophical conflict.
  3.  **Prediction Error:** The "5-Year Projection" relies on guesswork. Boards are often bad at estimating how much a cost actually hurts. If your data on costs is wrong, the Friction/Sacrifice classification is wrong.

  ---

  ## PART 3: WORKED EXAMPLES

  ### CASE A: Mandatory Flu Vaccination for Nursing-Home Staff
  **Step 1: Consequentialist Floor**
  *   **Good:** Prevents death in highly vulnerable elderly population.
  *   **Magnitude:** Existential (Life/Death).
  *   **Probability:** High.
  *   *Result: Pass Floor.*

  **Step 2: Burden Classification**
  *   **5-Year Projection:** Can staff still work/care for families? Yes.
  *   **Exit Option:** Can they avoid cost? Yes (get the shot, 15 mins, minor soreness).
  *   **Classification:** **FRICTION**. (It is a bodily intrusion, but does not abandon a core life project).
  *   *Result: Pass.*

  **Step 3: Residue**
  *   **Targeting:** Essential workers (High Risk), but burden is low.
  *   **Residue:** Low. Most accept this as part of healthcare role.
  *   **Mitigation:** Paid time off to get vax.

  **Verdict:** **APPROVE.**
  *Reasoning:* High existential benefit + Friction-level cost. No Chair sign-off needed.

  ***

  ### CASE B: 8% Post-Tax Income Donation Mandate for Food Security
  *(Note: You support this, but the procedure must test it rigorously.)*

  **Step 1: Consequentialist Floor**
  *   **Good:** Eliminate local hunger, improve public health.
  *   **Magnitude:** Significant (improves quality of life) to Existential (prevents starvation for recipients).
  *   **Probability:** High.
  *   *Result: Pass Floor.*

  **Step 2: Burden Classification**
  *   **5-Year Projection:**
      *   *High Earner:* Can still save/retire? Yes. -> **Friction**.
      *   *Median Earner:* 8% post-tax is often equivalent to rent or car payment. Does this force them to delay retirement, skip savings, or reduce child care? **Yes.** -> **Sacrifice**.
  *   **Exit Option:** Can they avoid cost? No, not without leaving the city or earning less.
  *   **Classification:** **SACRIFICE** (For the majority of the tax base).
  *   *Result: STOP POINT TRIGGERED.* Because the benefit is *Significant/Existential for recipients* but the burden is *Sacrificial for payers*, we move to Flag Point.

  **Step 3: Residue**
  *   **Targeting:** Broad, but hits middle class hardest relative to utility of income.
  *   **Residue:** **High.** "I am being forced to be charitable." Coercion undermines the moral good of giving.
  *   **Mitigation:** None proposed (flat mandate).

  **Step 4: Final Authorization**
  *   **Chair Sign-Off Required:** Yes. (Sacrificial Demand + Values Call).
  *   **Board Decision:** The procedure flags this as **ETHICALLY RISKY**.
  *   **Correction:** To pass, this must be converted from Sacrifice to Friction.
      *   *Modification:* Make it progressive (0% for low income, cap for high income) OR frame as a tax (legitimate coercion) rather than a donation mandate (moral coercion).

  **Verdict:** **REJECT IN CURRENT FORM.**
  *Reasoning:* While the goal is good, a flat 8% mandate constitutes a **Sacrifice** for median earners (abandoning savings/security projects). The procedure correctly identifies that you cannot demand sacrificial life-project adjustments for a *Significant* (non-existential) collective good without mitigation. To support this, you must argue the hunger is *Existential* enough to justify the *Sacrifice*, or change the structure to reduce the burden to *Friction*.

  ***

  ### CASE C: Retrofit Zoning Rule Wiping Out Small Landlord Income
  **Step 1: Consequentialist Floor**
  *   **Good:** Energy efficiency, safety, housing standards.
  *   **Magnitude:** Significant (Long term city health).
  *   **Probability:** High.
  *   *Result: Pass Floor.*

  **Step 2: Burden Classification**
  *   **5-Year Projection:** Rule "wipes out rental income." Can the landlord continue the project (renting property)? **No.** Business becomes insolvent.
  *   **Exit Option:** Must sell property or exit market.
  *   **Classification:** **SACRIFICE**. (Destroys the core economic project).
  *   *Result: STOP POINT TRIGGERED.* Benefit is *Significant*, Burden is *Sacrificial*.

  **Step 3: Residue**
  *   **Targeting:** Small landlords (often individual investors relying on income).
  *   **Residue:** **Very High.** "My property was rendered worthless by regulation."
  *   **Mitigation:** None proposed.

  **Step 4: Final Authorization**
  *   **Chair Sign-Off Required:** Yes.
  *   **Board Decision:** **REJECT** unless mitigation is added.
  *   **Correction:** A sacrificial demand for a *Significant* good is impermissible under this procedure. To proceed, the city must treat this as a "Taking."
      *   *Modification:* Subsidize the retrofit or allow rent increases to cover cost. Convert Sacrifice to Friction.

  **Verdict:** **REJECT.**
  *Reasoning:* This fails the Demandingsness Constraint. You are asking one group to abandon their livelihood for a general collective good that is not immediately Existential (like preventing a plague). Without compensation, this is an unethical sacrifice.

  ---

  ## SUMMARY FOR CHAIR
  *   **Vax:** Pass (Friction).
  *   **Donation:** Fail (Sacrifice without mitigation). *Note to Board Member: If you want this to pass, you must prove the hunger is an Existential threat that trumps the financial security project, or make the rate progressive.*
  *   **Zoning:** Fail (Sacrifice without compensation).

  **Chair Sign-Off on Values Calls:** _________________ Date: ___________
