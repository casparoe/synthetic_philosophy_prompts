answer: |-
  No coherent list of desiderata exists because the demand for a metaphysical analysis of what persons *are* is jointly unsatisfiable with the demand for an applicable criterion that settles normative cases without remainder, specifically when tested against the repudiated person.

  ### The Desiderata

  **1. Normative Stability (Non-negotiable)**
  A theory must guarantee that personhood status does not fluctuate based on the contingent attitudes of others.
  *   **Case:** The Repudiated Person (the outcast universally misrecognized as sub-personal).
  *   **Reasoning:** If personhood is lost when recognition is withdrawn, personhood becomes a privilege granted by the community rather than a shield against it. This collapses human rights into social consensus.
  *   **Judgment Call:** This is a liberal political requirement, not necessarily a metaphysical truth. A hardline relational ontologist might reject this, but for a seminar focused on medical/legal norms, it is non-negotiable.

  **2. Species Neutrality (Non-negotiable)**
  A theory must distinguish personhood from membership in *Homo sapiens*.
  *   **Case:** The Newborn vs. The Social Mammal vs. The AI.
  *   **Reasoning:** To avoid speciesism, the criterion must rely on capacities or relations, not biology. However, it must not exclude humans who lack typical capacities (advanced dementia).
  *   **Judgment Call:** Some animalists argue species membership *is* relevant. For a normative unit dealing with AI and mammals, you must treat this as non-negotiable, forcing animalists to defend why biology matters normatively.

  **3. Diachronic Flexibility (Non-negotiable)**
  A theory must account for identity over time without requiring continuous psychological connectivity.
  *   **Case:** Advanced Dementia vs. The Permanently Unconscious.
  *   **Reasoning:** We owe duties to the demented patient based on their past wishes (precedent autonomy), even if psychological continuity is broken. A theory that says the demented patient is a "new person" fails medical ethics.
  *   **Judgment Call:** Parfitians will reject this, arguing identity doesn't matter. For legal/medical norms, however, identity (or quasi-identity) must matter.

  **4. The Strawsonian Constraint (House Preference)**
  A theory should explain why persons are the appropriate targets of reactive attitudes (resentment, gratitude, demands for justification).
  *   **Case:** Criminal Responsibility vs. The AI.
  *   **Reasoning:** This captures the distinctiveness of moral agency.
  *   **Critique:** This excludes newborns and the severely cognitively impaired. If you include this as non-negotiable, you must adopt a two-tier system (persons vs. human beings), which complicates the unit. Mark this as a **House Preference** of the agency-centric camp.

  **5. Metaphysical/Practical Alignment (Impossible Demand)**
  A theory must provide both an account of what personhood *really is* (ontology) and a decision procedure for how we *identify* it (epistemology/criterion).
  *   **Case:** All edge cases.
  *   **Reasoning:** This is where the list breaks. Ontological truths (e.g., "consciousness is required") often yield unusable criteria (e.g., "we cannot measure consciousness reliably").
  *   **Verdict:** **Drop this.** Tell students they must choose between a metaphysical theory (true but maybe unusable) and a pragmatic criterion (usable but maybe shallow).

  ### The Cases: Load-Bearing vs. Bias

  *   **Load-Bearing:** **Advanced Dementia** (tests diachronic identity vs. status), **The Repudiated Person** (tests relational constitution vs. stability), **The Newborn** (tests potentiality vs. actuality).
  *   **Bias-Loaded:** **The AI/Corporation** (often used by functionalists to force a specific outcome; treat as heuristic only), **Fission** (metaphysically interesting but normatively distant from medical/legal reality).
  *   **Pushback on Your Framing:** You ask if the AI case is load-bearing. It is not. It is a intuition pump for functionalism. If a theory works for humans but fails for AI, that is not a strike against it unless you presuppose functionalism. Use it to test Species Neutrality, but do not let it drive the ontology.

  ### The Relational/Ubuntu Specifics

  You need a desideratum that forces the Ubuntu proponent to distinguish between **constitution** and **enablement**.

  **6. The Acquisition/Retention Asymmetry (Non-negotiable)**
  A relational theory must explain how personhood is *acquired* through relations without making its *retention* contingent on continued recognition.
  *   **Case:** The Repudiated Person.
  *   **Reasoning:** This handles your suspicion about the asymmetry. It is not just a liberal scruple; it is a requirement for any theory claiming to support rights. If relations constitute personhood ontologically, the outcast ceases to exist as a person. This is unacceptable for normative work.
  *   **The Ubuntu Defense:** A sophisticated Ubuntu view argues relations are *enablement* conditions (you become a person through others) but once achieved, the status inheres. If your colleague claims Ubuntu is just communitarianism, press them on this: Communitarianism prioritizes the group's good; Ubuntu ontologically grounds the self in the group. If they cannot protect the outcast, their ontology is incompatible with human rights law.

  ### The Incompatibility

  The joint unsatisfiability lies between **Desideratum 1 (Normative Stability)** and a strong **Constitutive Relational Ontology**.
  *   If relations *constitute* the person, the withdrawal of relations destroys the person.
  *   If the person must remain a person despite withdrawn relations (for rights to hold), relations cannot be fully constitutive.
  *   **Seminar Point:** Do not ask students to solve this. Ask them to pick which horn of the dilemma they prefer: a metaphysically robust relational view that risks political vulnerability, or a liberal individualist view that risks metaphysical thinness.

  ### Comparative Table

  | Theory | Normative Stability (Outcast) | Species Neutrality (AI/Mammal) | Diachronic Flexibility (Dementia) | Metaphysical/Practical Alignment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Psychological Continuity** (Locke/Parfit) | **Pass** (Internal criterion) | **Pass** (Functional) | **Fail** (Dementia = new person) | **Fail** (Hard to measure continuity) |
  | **Animalism** (Olson) | **Pass** (Biological persistence) | **Fail** (Excludes AI/Corps) | **Pass** (Organism persists) | **Pass** (Clear criterion) |
  | **Relational (Ubuntu-style)** | **Fail** (If constitutive)* | **Pass** (Context dependent) | **Pass** (Social memory holds) | **Fail** (Vague criteria) |

  *\*Unless modified to "Enabling" rather than "Constitutive," which weakens the metaphysical claim.*

  **The Single Requirement That Kills The Most Candidates:** **Diachronic Flexibility (Dementia).**
  *   **Reasoning:** Psychological continuity theories (dominant in analytic metaphysics) generally fail here, implying the demented patient is not the same person as the prior agent, which undermines precedent autonomy. Animalism passes this but fails AI. Relational views pass this only if they retreat from strong constitution to enabling conditions. This is the best pivot point for your seminar.
