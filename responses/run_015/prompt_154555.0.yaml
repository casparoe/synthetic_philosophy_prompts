  The water had reached the bottom shelf, dark and oily, lapping at the cardboard corners. Elias stood between the two sealed crates, a coin resting on his thumb.

  "Put the five down, Elias," Mara said. She had her hands on the larger crate, the one containing the first editions. Her voice was flat, stripped of the urgency the rising flood demanded.

  "I can't do that," Elias said. "One claim here, five there. The numbers don't aggregate."

  "They're books."

  "They hold works. Each work has a claim to preservation equal to any other. To save the five because they are five is to treat them as a herd. I owe them individual justice."

  "Justice doesn't dry paper."

  "Fairness does." He poised the coin. "Heads, the poet. Tails, the canon. Equal probability for each claimant."

  Mara didn't move her hands from the crate. She looked at the sealed wood, then at the coin, then back to him. "You defined the claimant as the work."

  "It's the only coherent unit."

  "Is it? You aggregated the pages to bind the work. You summed the sentences to make the claim." She stepped closer, the water squelching around her boots. "You counted the sheets to make a book, Elias. You're just refusing to count the bindings to save them."

  Elias looked at the coin, then at the water. He flipped it anyway.
