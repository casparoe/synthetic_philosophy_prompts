answer: |-
  We gather because the recent extension of the ballot proves that the boundary of the people is a choice we make, not a line nature draws for us. By drawing the line at five years of residence rather than three, the council has shown that every criterion for inclusion inevitably creates new exclusions without natural justification.

  To navigate this, we must distinguish between membership as authorization, which is the standing to command collective decisions, and membership as exposure, which is the condition of being subject to those decisions. This separation reveals that having a voice in the law is not the same as living under its weight.

  For those newly granted the ballot, we acknowledge the vital shift from a condition of exposure to the power of authorization, recognizing your stake in our shared future. However, gaining the right to authorize rules does not erase the fact that the boundaries of this community remain contingent and open to challenge.

  For the seasonal workers excluded from the vote, your presence here affirms that membership as exposure is a political reality even without the standing of authorization. Your subjection to local laws demands acknowledgment not as a claim to become citizens, but as a testament that living under the law ties you to this community regardless of the ballot.

  Therefore, our task is not to finalize the border of the demos, but to examine how the tension between authorization and exposure structures our collective life. We must accept that any line we draw will remain imperfect, yet we are obliged to justify why we draw it where we do.
