      *   *Critique:* Is the distinction between deontic and instrumental clear?
      *   *Correction:* Emphasize that *sīla* (precepts) look deontic but are grounded in causal psychology. They are "protective" not "commanded."
      *   *Critique:* Did I answer the "structural vs. apparent" tension directly?
