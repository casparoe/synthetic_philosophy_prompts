  6.  **Final Review against constraints:**
      *   Rigorous conceptual analysis? Yes.
      *   No pastoral guidance? Yes.
      *   No text survey? Yes.
      *   Address specific philosophical tensions? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to imply that *anattā* makes ethics meaningless (nihilism). I must emphasize that *dukkha* is real even if the *self* is not. The "subject" of ethics is the *experience of suffering*, not the *owner* of suffering.

  *(Refining the Dementia Angle)*: The user mentions the parent's dementia. This is a profound real-world instantiation of *anattā*. The "person" is already dissolving. I should note that the kammic weight falls heavily on the *decision-maker's* intention, as the recipient's capacity to generate new kamma may be diminished.

  *(Final Plan)*:
