answer: |-
  This is a rigorous philosophical inquiry into the coherence of Buddhist ethics under the pressure of *anattā* (non-self). The tension you identify—between a moral system that tracks consequences across lifetimes and a metaphysics that denies the continuity of a moral subject—is central to Buddhist soteriology. It is not a bug to be smoothed over, but a structural feature designed to dismantle ontological clinging.

  Below is an analysis of the structural relationship between kammic consequentialism and *anattā*, addressing your specific questions regarding continuity, normativity, agency, and the distinction between commission and omission.

  ### 1. The Metaphysics of Continuity: *Citta-Santāna* vs. Substantial Self

  The tension between rebirth-spanning consequentialism and *anattā* is **structurally necessary but functionally resolved** through the doctrine of Dependent Origination (*paṭicca-samuppāda*).

  If Buddhism posited a permanent self (*attā*), kammic consequentialism would be straightforward: Agent A acts, Agent A receives the fruit (*vipāka*). However, Buddhism argues that positing a permanent self creates a logical impossibility for moral growth (a permanent entity cannot change) and reinforces the craving that sustains *saṃsāra*.

  To resolve the "who suffers?" paradox without reintroducing a self, Buddhist philosophy utilizes the concept of *citta-santāna* (mind-stream). This is not a "thing" that persists, but a causal continuum of momentary events (*dhammas*).
  *   **The Structural Resolution:** The tension is only apparent if one assumes moral responsibility requires a *substantial* subject. In Buddhist ontology, moral responsibility attaches to **causal continuity**, not identity.
  *   **The Flame Analogy:** When a flame passes from one candle to another, no "substance" moves, yet the second flame is causally dependent on the first. Similarly, the mental stream at death conditions the mental stream at rebirth.
  *   **Implication for Dementia:** In the context of advancing dementia, the *citta-santāna* of the patient is undergoing rapid disintegration of coherence (memory, personality, agency). While the biological life continues, the psychological continuity that typically anchors personal identity is eroding. From a strict Abhidharmic perspective, the "person" is already a loose assemblage of aggregates (*khandhas*). This does not negate the moral weight of actions taken upon them, but it shifts the locus of kammic evaluation. The suffering experienced by the parent is real (*dukkha* exists even if a "sufferer" does not), and the volition (*cetanā*) of the caregiver generates kamma regardless of the recipient's ontological status.

  **Verdict:** The tension is dissolved not by finding a hidden self, but by redefining "consequence" as the conditioning of a causal stream rather than the reward/punishment of an entity.

  ### 2. *Kusala/Akusala*: Deontic Constraint or Instrumental Heuristic?

  You ask whether the distinction between wholesome (*kusala*) and unwholesome (*akusala*) operates as a deontic constraint or an instrumental heuristic.

  Buddhist ethics is best classified as **aretaic-consequentialist**. It is not deontological in the Kantian sense (rules binding regardless of outcome), nor is it purely utilitarian (maximizing aggregate happiness).
  *   **Instrumental Orientation:** *Kusala* literally means "skillful" or "healthy." An action is *kusala* because it leads to the cessation of *dukkha* and the unraveling of defilements (*kilesa*). An action is *akusala* because it roots the mind-stream deeper in craving, aversion, and delusion.
  *   **The Role of Precepts:** The precepts (e.g., against killing) appear deontic but function as **protective guardrails**. They are empirical generalizations: actions of type X *invariably* produce mental states and kammic fruits incompatible with liberation.
  *   **Application to End-of-Life:** In your scenario, authorizing interventions that prolong biological life while increasing suffering must be evaluated by the *cetanā* (intention) and the outcome.
      *   If the intention is attachment to the parent's form or fear of grief (craving), the action is likely *akusala*, even if it preserves life.
      *   If the intention is compassion (*karuṇā*) to cease suffering, allowing the biological process to end may be *kusala*, even if it shortens the lifespan.
      *   **Conclusion:** The distinction is instrumental toward cessation (*nirodha*). There is no intrinsic "sanctity of biological life" in Buddhism; there is only the sanctity of the opportunity to awaken. If life is merely a vessel for intensifying *dukkha* without the capacity for mental cultivation, prolonging it lacks soteriological value and may be ethically negative.

  ### 3. *Upāya-Kauśalya* (Skillful Means) without an Enduring Agent

  How does skillful means function if there is no enduring agent to wield it?

  *   **Agency as Process:** In the absence of *attā*, agency is not a property of a self but a **function of the mind-stream**. *Upāya-kauśalya* is the capacity of the mental continuum to align with reality (*yathā-bhūta-ñāṇa*). It is the wisdom component of the stream responding to conditions without the friction of ego-clinging.
  *   **The Decision Mechanism:** When you make a decision, it is not "you" deciding in a substantial sense. It is a convergence of conditions (your training, your compassion, the medical data, the parent's state) arising in the present moment.
  *   **Structural Coherence:** The lack of an enduring agent does not paralyze action; it purifies it. Action performed without the conceit "I am the doer" (*ahaṅkāra*) generates less kammic friction. *Upāya* functions as the dynamic calibration of action to minimize *dukkha* in the causal field.
  *   **In Practice:** A "skillful" decision regarding life support is one that arises from clear comprehension (*sampajañña*) of impermanence (*anicca*), rather than from the delusion that death can be indefinitely postponed or that the parent is a permanent possession to be maintained.

  ### 4. Harming vs. Failing to Benefit: Does *Anattā* Collapse the Distinction?

  You ask whether *anattā* collapses the distinction between harming (commission) and failing to benefit (omission), given there is no enduring subject to bear the harm.

  **The distinction does not collapse, but the criteria for evaluation shift from "rights violation" to "causal impact on *dukkha*."**

  *   **The Reality of *Dukkha*:** Even if there is no self, *dukkha* (suffering/stress) arises. Pain is real. Confusion is real. The moral imperative in Buddhism is the alleviation of *dukkha*, not the protection of a metaphysical ego.
  *   **Commission (Active Harm):** Actively ending a life (euthanasia) is generally considered *akusala* in traditional Buddhism because it is rooted in aversion to the process of dying and violently cuts the causal stream, potentially generating intense agitation in the dying consciousness.
  *   **Omission (Allowing Death):** Withholding disproportionate or futile treatment is not necessarily "failing to benefit." If the treatment merely prolongs the *dukkha* of the aggregates without benefiting the mental stream, withholding it is an act of compassion.
  *   **The *Anattā* Factor:** Because there is no self to "lose" life, death is a transformation of the aggregates, not an annihilation of a person. Therefore, the moral weight rests on the **quality of the transition**.
      *   Prolonging suffering creates conditions for aversion and confusion in the dying mind-stream (negative kammic conditioning for the next moment/existence).
      *   Allowing a natural death with palliative care creates conditions for greater calm.
  *   **Verdict:** *Anattā* does not make harm irrelevant; it makes the *experience* of harm the primary ethical datum. If an intervention increases the *dukkha* of the aggregates, it is ethically suspect, regardless of whether a "self" is there to own that suffering. The distinction between killing and letting die remains, but the moral valence is determined by the intention (*cetanā*) and the resultant suffering, not by the violation of a self's right to life.

  ### 5. Synthesis: The Structural Relationship

  To return to your core question: Is the tension between rebirth-spanning consequentialism and *anattā* merely apparent or genuinely structural?

  It is **structurally integral**.

  1.  **Prevention of Reification:** If kammic consequences were tied to a permanent self, ethical practice would reinforce the very view (*sakkāya-diṭṭhi*) that binds one to *saṃsāra*. By decoupling consequence from identity, Buddhism forces the practitioner to engage ethically without ontological clinging.
  2.  **Causal Responsibility without Ownership:** You are responsible for the kamma you generate (the volition to authorize treatment), but you cannot claim ownership of the result (the parent's survival or death). This is the doctrine of "action without fruit" (*karma-phala-tyaga* in the Gita, though in Buddhism it is more about non-attachment to the result).
  3.  **The Caregiver's Locus:** In your specific situation, the primary kammic locus is **your mind-stream**.
      *   The parent's stream is fragmenting; their capacity to generate new kamma is diminished.
      *   Your stream is active. Your intention (*cetanā*) regarding the treatment is the primary generator of kammic weight.
      *   If your decision is driven by the delusion that you can control impermanence, or by the aversion to the pain of loss, that is *akusala*.
      *   If your decision is driven by the wisdom that the aggregates are dissolving and the compassion to minimize the *dukkha* of that dissolution, that is *kusala*.

  ### Conclusion

  The tension you perceive is the engine of Buddhist ethics. It demands that you act with profound moral seriousness (kamma is real) while simultaneously relinquishing the ontological ground upon which conventional morality stands (self is unreal).

  In the context of dementia care:
  *   **Consequentialism:** You must evaluate the future *dukkha* caused by prolonged biological existence vs. the *dukkha* of letting go.
  *   **Anattā:** You must do so without clinging to the "parent" as a fixed entity that must be preserved, recognizing the *santāna* is already dissolving.
  *   **Upāya:** The skillful means is the decision that aligns with the reality of the situation (impermanence, suffering) rather than the fantasy of control.

  The structural coherence lies in **Dependent Origination**. There is no self to suffer, but there is suffering. There is no self to act, but there is action. There is no self to inherit kamma, but there is causal continuity. Your ethical task is to ensure the causal continuity you influence moves toward the cessation of *dukkha*, not its proliferation, regardless of the biological timeline.
