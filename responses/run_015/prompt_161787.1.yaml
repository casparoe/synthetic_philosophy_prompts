  Hey — I'm a TA for an upper-level seminar that's cross-listed between philosophy and the econ department, so half the room are econ grad students who know the representation theorems cold and half are phil majors who mostly don't. We just finished marking the midterm (take-home, 48 hours, citations banned — I told them to argue from the distinctions themselves) and there's one answer to question 3 that I keep going back and forth on. We did measurability and comparability in week three and Harsanyi in week five. I was up late talking it over with my officemate, who does neuroeconomics and thinks the whole comparability debate is going to be settled by better measurement, and I think its wrong but whatever — we couldn't agree and I'd rather get a cold read from someone who hasn't been staring at it.

  I invented the Δ-probe thing in the question on purpose, so they couldn't just recite back the standard examples. I'm not going to say what I think is off about the answer, because I don't want to anchor you: my officemate thinks it's basically fine and I think there are one or two places where it slips in a way that's easy to miss. Here's the question, and then the answer verbatim (about 600 words, names changed).

  **The question.** A familiar claim in this literature is that interpersonal comparisons of utility are impossible, or "meaningless," because each person's utility function is fixed only up to a positive affine transformation (u → au + b, a > 0), with a and b allowed to differ from person to person. Suppose that a reliable measurement procedure existed — call it the Δ-probe — which, for any person and any two of that person's outcomes, returns a number representing the size of the welfare *change* between them, on a scale whose unit is the same for everybody. The probe is validated in this sense: equal probe values for two different people really do correspond to equally large welfare gains. But the probe's zero point drifts idly from person to person (and from day to day for the same person), so there is no fact of the matter whether a reading of 40 for Amartya represents the same welfare *level* as a reading of 40 for Beatriz. (a) In the vocabulary of measurability and comparability, exactly what would the Δ-probe give us, and what would it not give us? (b) With the probe in hand, which social-choice questions could a planner settle that she could not settle before, and which would remain out of reach? (c) Does any of this touch Harsanyi's arguments? Say precisely what it does and does not show. Answer in 500–700 words.

  **The student's answer.**

  Start with the standard worry. If someone's preferences over lotteries satisfy the von Neumann–Morgenstern axioms, they can be represented by a utility function that is unique only up to a positive affine transformation: u → au + b, with a > 0. Both the multiplier and the constant are fixed person by person, so nothing in the representation theorem ties Amartya's numbers to Beatriz's. Amartya's 10 might be Beatriz's 3, and a move of 2 for Amartya might be a bigger improvement than a move of 2 for Beatriz, or a smaller one. That is the sense in which interpersonal comparisons are said to be meaningless — not that other people's experience is unknowable, but that the formalism hands us no cross-person scale.

  The Δ-probe would repair part of this. It does not measure levels; it measures the size of a change, on a unit that is common across persons. That is just what cardinal unit-comparability requires: utility stays cardinally meaningful within a single life, and now gains and losses can be weighed against each other across lives, even though where each person's zero sits is left unsettled. So the planner can finally say that Amartya's gain from x to y is twice Beatriz's gain from p to q, which before she could not say at all.

  And once the unit is shared, the rest follows. A level is only a difference taken from some baseline, and with a common unit we can take any baseline we like — subtract the same number from both readings and compare what is left. So the probe delivers level comparability as well, and therefore full comparability. The planner can now rank Amartya and Beatriz by how well off they are, add up welfare across the population, and pick the policy that maximizes the sum. The old complaint that interpersonal comparisons are impossible would simply have no purchase any more.

  That connects directly to Harsanyi. His aggregation theorem says that if individual preferences satisfy the expected-utility axioms, and the social ordering satisfies those axioms too plus the Pareto condition (if everyone prefers x to y, society prefers x to y), then social welfare must be the sum of individual utilities. What that result needed was interpersonal comparability, and the probe supplies it, turning the theorem from a formal result into a decision procedure. His later impartial-observer argument, where someone chooses as if she had an equal chance of turning out to be anybody, reaches the same place by a separate route: weighing everyone's prospects equally means maximizing average utility. Two independent arguments converging is what makes the utilitarian conclusion credible here.

  Two loose ends. Even a perfectly comparable sum can be objected to: Nozick's utility monster, who converts resources into welfare at a spectacular rate, is the standard example, and the usual response is to move to a prioritarian or maximin rule instead of a sum. And one might doubt whether probe readings really track welfare rather than something else. But neither is an objection to comparability as such, so I leave them aside.

  **What I want from you.** Grade it out of 20 (17+ is an A in our scheme, 14–16 a B, 11–13 a C) and give me the comments that justify the mark, point by point rather than as a general impression. Please structure it like this:

  - **Mark** — one line: the number, the letter, and a one-sentence bottom line.
  - **What it gets right** — roughly 120–150 words, on what the answer genuinely earns credit for.
  - **Where it goes wrong** — roughly 250–300 words: for each problem, quote back or closely paraphrase the sentence at issue, say exactly what is mistaken or doesn't follow, and say how many marks it should cost.
  - **What it leaves out** — roughly 150 words. I have a feeling part (b) is underdone and I can't put my finger on why, so tell me what a stronger answer would have argued there.
  - **Comments I can paste in** — about 100 words, three bullets written as direct feedback to the student, the kind of thing that goes in the margin of a script.
