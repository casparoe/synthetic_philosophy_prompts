  **Mark** — 13/20 (C) — Solid grasp of VNM foundations, but a fundamental error regarding level comparability undermines the social choice conclusions.

  **What it gets right**
  You demonstrate a solid grasp of the foundational formalism. Your explanation of the von Neumann–Morgenstern axioms and the positive affine transformation is precise, correctly noting that standard utility functions lack interpersonal scale. You accurately identify that the $\Delta$-probe establishes Cardinal Unit Comparability (CUC) by fixing the unit across persons, allowing the planner to weigh gains and losses against each other. This shows you understand the specific measurability problem the probe is designed to address. Furthermore, your engagement with the thought experiment is direct; you don't retreat to vague philosophical hand-waving but attempt to apply the technical vocabulary. The connection to Harsanyi's aggregation theorem is also structurally correct, recognizing that his utilitarian conclusion relies on some form of interpersonal comparison to fix weights. These elements show competent preparation on the VNM framework and the general shape of the comparability debate.

  **Where it goes wrong**
  The critical error occurs in paragraph three: "A level is only a difference taken from some baseline... So the probe delivers level comparability as well." This directly contradicts the prompt's stipulation that the "zero point drifts idly from person to person." Unit comparability (common scale) does not entail level comparability (common zero). You cannot "subtract the same number" to align levels if the zeros are unanchored relative to each other; Amartya's 0 might correspond to Beatriz's 100. Consequently, your claim that the planner can "rank Amartya and Beatriz by how well off they are" is false; you can only compare *changes* from a status quo. This mistake cascades into the assertion that the planner can "add up welfare across the population." Summing utilities requires a common zero; otherwise, the total sum is arbitrary, shifting as individual zeros drift. A sum based on drifting zeros yields different policy rankings depending on the day's drift, making it useless for social choice. This conflates Cardinal Unit Comparability with Cardinal Full Comparability. Finally, your Harsanyi analysis suffers: without level comparability, the social welfare function is not unique enough to mandate classical utilitarianism over status-quo-dependent rules. Harsanyi's theorem fixes weights, but not origins; the probe leaves origins unfixed. This conceptual slip undermines the core conclusion. This error accounts for the majority of the deduction, as it invalidates the answer to part (b) and weakens part (c).

  **What it leaves out**
  Part (b) requires a sharper distinction between social choices invariant to level shifts versus those requiring absolute levels. A stronger answer would note that with only unit comparability, the planner can identify utilitarian *improvements* from a status quo (comparing sums of changes), but cannot implement Maximin or identify the absolutely worst-off individual. You missed the opportunity to discuss which social welfare functions are invariant under independent origin shifts. Additionally, regarding Harsanyi, you could have noted that his Impartial Observer argument typically *generates* level comparability through identity uncertainty, whereas the probe only supplies unit comparability. Discussing the invariance properties of social welfare functions under affine transformations would have strengthened the technical analysis of what remains "out of reach" despite the new measurement technology. Specifically, mentioning that the social welfare function is unique only up to an affine transformation itself would have clarified the limits.

  **Comments I can paste in**
  *   You correctly identify that the probe fixes the unit (scale), but you overlook the prompt's explicit stipulation that the zero point drifts idly across persons.
  *   Unit comparability allows comparing *gains*, but not *levels*; you cannot meaningfully sum utilities without a common zero point.
  *   Be careful inferring Full Comparability from Unit Comparability; distinguishing these two levels is central to the week's material and crucial for part (b).
  *   Review the distinction between CUC and CFC in your notes before the final, as this distinction drives the social choice implications.
