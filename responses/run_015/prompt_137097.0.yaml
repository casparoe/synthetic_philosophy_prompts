  Hey, I need a poem for the last ten minutes of a decision-theory reading group — we just did counterfactual mugging and XOR blackmail and everyone left annoyed and arguing alot. Could you write a short sonnet (14 lines, blank verse is fine, no need to rhyme if it gets in the way) from the point of view of the agent in the tails branch: Omega's coin came up tails, so the $10,000 is already on the table because you are the sort who would of paid $100 in the heads branch, and then you get home and find an XOR blackmail letter on the doormat. The perfect predictor sent it iff (you have the rare rash XOR you will pay the $100 demand); if you don't pay, the rash gets revealed and that's much worse than the hundred. Use the octave to build the naive causal picture: you hold the letter, think maybe you have the rash, and weigh paying up to avoid the disaster. Make the volta the moment the XOR clicks: if you're the paying kind the letter means no rash, so paying buys nothing, and if you're the refusing kind it means the rash is real, so refusing is a disaster — either way the actual choice in the moment is not the point, because what matters is the output of your decision algorithm in the branch that didn't happen, which is exactly why the counterfactual-mugging money is sitting on the table. Close with a couplet that says what has to go: the causal decision theorist's idea that only your actual causal effects count, not the fact that a perfect predictor already read your policy. Keep it accurate enough that someone who knows the causal/functional split (CDT vs FDT) wouldn't wince, but don't turn it into a lecture — leave the annoyance in. Maybe a typo or two, I don't care.
