answer: |-
  # BERTRAND'S CHORDS: A DECISION TREE
  **Graduate Reading Group | Chance, Symmetry, and Ignorance**

  **The Setup:** You are asked to draw a chord "at random" in a circle. Three standard methods exist: (1) pick two endpoints on the circumference; (2) pick a radius and a point along it; (3) pick a midpoint inside the disk. They yield probabilities of 1/3, 1/2, and 1/4 respectively. All seem defensible.

  **Instructions:** Start at **Node 1**. Answer the question in the second person. Follow the arrow to the next Node or Leaf. Do not look ahead.

  ### THE TREE

  **Node 1.** Do you believe the problem as stated has a **unique** correct numerical answer?
  *   **No** → Go to **Node 2**.
  *   **Yes** → Go to **Node 3**.

  **Node 2.** You think the answer is under-determined. Must this gap be closed by **mathematical principle** (symmetry) or **physical fact** (mechanism)?
  *   **Neither (It's broken)** → **Leaf A**.
  *   **Either is fine (It's flexible)** → **Leaf B**.
  *   **Mathematical Principle** → **Node 4**.
  *   **Physical Fact** → **Leaf C**.

  **Node 3.** You believe the answer is unique. Is it fixed by a **physical throwing process** or a **logical rule of reason**?
  *   **Physical Process** → **Leaf C**.
  *   **Logical Rule** → **Node 4**.

  **Node 4.** To apply the logical rule, which quantity do you treat as **uniformly distributed** (indifferent)?
  *   **Angular position of endpoints** → **Leaf D**.
  *   **Distance of midpoint from center** → **Leaf E**.
  *   **Location of midpoint within area** → **Leaf F**.
  *   **Length of the chord itself** → **Leaf G**.

  **Node 5.** (For Leaves D, E, F) Do you require your rule to hold if the circle is **translated or rescaled**?
  *   **No (Rotation only)** → Stay at **Leaf D, E, or F**.
  *   **Yes (Full Euclidean)** → Go to **Node 6**.

  **Node 6.** Your rule is invariant under translation/scaling. Is this justified by **maximum entropy** (ignorance) or **geometry of lines** (measure)?
  *   **Maximum Entropy** → **Leaf H**.
  *   **Geometry of Lines** → **Node 7**.

  **Node 7.** Does your geometric rule apply to **non-circular shapes** (e.g., a square)?
  *   **No (Circle specific)** → **Leaf E** (Revised).
  *   **Yes (Universal)** → **Leaf I**.

  ---

  ### THE LEAVES

  *   **Leaf A: The Under-Specification View.**
      *   *Position:* The problem is ill-posed; "random" is undefined without further constraints.
      *   *Awkward Commitment:* We cannot model ignorance without more data.
  *   **Leaf B: The Permissive View.**
      *   *Position:* "Random" is ambiguous; 1/3, 1/2, and 1/4 are all rationally permissible.
      *   *Awkward Commitment:* Probability is not a single number here.
  *   **Leaf C: The Chance-Setup View.**
      *   *Position:* The number is fixed by the physical mechanism that generates the chord.
      *   *Awkward Commitment:* Mathematics cannot solve physics problems.
  *   **Leaf D: Random Endpoints (1/3).**
      *   *Position:* Indifference applies to the angular position of endpoints.
      *   *Awkward Commitment:* Not invariant under translation of the circle.
  *   **Leaf E: Random Radius (1/2).**
      *   *Position:* Indifference applies to the distance of the midpoint from the center.
      *   *Awkward Commitment:* Depends on choosing a specific radius first.
  *   **Leaf F: Random Midpoint (1/4).**
      *   *Position:* Indifference applies to the location of the midpoint within the disk area.
      *   *Awkward Commitment:* Not invariant under translation of the circle.
  *   **Leaf G: Uniform Length (1/2).**
      *   *Position:* Indifference applies directly to the chord length [0, 2R].
      *   *Awkward Commitment:* Lacks a natural physical or symmetry justification.
  *   **Leaf H: The Jaynes/MaxEnt View (1/2).**
      *   *Position:* The unique solution invariant under scaling and translation of the circle.
      *   *Awkward Commitment:* Assumes symmetry principles apply to states of ignorance.
  *   **Leaf I: The Geometric Measure View (1/2).**
      *   *Position:* The measure on the space of lines in the plane is unique and rigid-motion invariant.
      *   *Awkward Commitment:* Requires accepting geometric measure theory over elementary probability.

  ---

  ### COINCIDENCES AND BLIND SPOTS

  **1. Numerical Coincidences (The 1/2 Cluster)**
  Leaves E, G, H, and I all yield **1/2**. The tree separates them by justification, not number.
  *   **E vs. H:** Leaf E fails **Node 5** (translation invariance); Leaf H passes. If you move the circle, E's probability changes, H's does not.
  *   **H vs. I:** Leaf H is epistemic (ignorance); Leaf I is ontic (line structure). To separate them, ask: *"If an omniscient being knew the chord's origin, would the probability change?"* Jaynes (H) says Yes (it was ignorance); Geometric (I) says No (it's a property of lines).
  *   **G (Uniform Length):** This cell is **empty** in the literature.
      *   *Diagnosis:* Unattractive. Length is a derived quantity, not a natural parameter of generation. No physical process naturally selects uniform length without fine-tuning.

  **2. Empty Cells**
  *   **Indifference over Slope:** Yields 1/2. *Diagnosis:* Unexplored. Fails rotation invariance unless combined with distance.
  *   **Square Generalization:** Leaf I applies to squares (Buffon's Needle logic). Leaf F (Midpoint Area) fails on squares if rotation invariance is demanded. This is why **Node 7** exists: to separate universal geometric measures from circle-specific area rules.

  ---

  ### WALK-THROUGHS

  **Student 1: The Skeptic**
  *   **Node 1:** No (Not unique).
  *   **Node 2:** Neither (It's broken).
  *   **Result:** **Leaf A (Under-Specification).**
  *   *Path:* Rejects the demand for a number entirely.

  **Student 2: The Symmetry Advocate**
  *   **Node 1:** Yes (Unique).
  *   **Node 3:** Logical Rule.
  *   **Node 4:** Location of midpoint (initially).
  *   **Node 5:** Yes (Must hold if circle moves).
  *   **Node 6:** Geometry of Lines.
  *   **Node 7:** Yes (Applies to squares).
  *   **Result:** **Leaf I (Geometric Measure).**
  *   *Path:* Accepts uniqueness, demands full invariance, grounds it in line geometry.

  *(Note: If Student 2 chose Maximum Entropy at Node 6, they would land on Leaf H. Both are distinct from Student 1.)*

