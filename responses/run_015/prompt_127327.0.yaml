  | Classic Construction | Maps To Leaf | Mismatch Warning |
  | :--- | :--- | :--- |
  | **Random Endpoints** | **Leaf D** | None. |
  | **Random Radius** | **Leaf E** | Defenders often claim invariance, but Leaf E fails Node 5. |
  | **Random Midpoint** | **Leaf F** | None. |
  | **Jaynes' Invariance** | **Leaf H** | None. |
  | **Integral Geometry** | **Leaf I** | None. |

  **Flagged Mismatch:** Defenders of the **Random Radius (1/2)** often argue their method is "natural." However, **Leaf E** admits the awkward commitment that the probability changes if the circle is translated (fails Node 5). A true invariance defender must move to **Leaf H** or **I**.

  ---

  **Simplifications Note:** *This tree glosses measure theory (sigma-algebras), group theory (Lie groups of transformations), and the technical definition of "Maximum Entropy." "Invariance" is used here to mean "the answer doesn't change if we move/resize the problem." "Geometric Measure" refers to the unique measure on lines invariant under rigid motions (Haar measure).*
