answer: |-
  Here is the strategic assessment. You are correct that the resolution mismatch is the bottleneck. The field is currently producing high-confidence narratives on low-confidence data because the inferential bridge between site-level fragments and macro-level systems is theoretically underdeveloped.

  For a philosophy of history student with no lab budget and a four-year horizon, the normative questions are downstream. You cannot determine the political utility of a counter-narrative if you cannot establish the epistemic validity of the narrative itself. Therefore, the agenda must prioritize the **epistemology of scaling**.

  Here is the ranked agenda for the research group, ordered by upstream dependency.

  ### 1. The Inferential Validity of "Aggregation" (Priority One)
  **The Problem:** Archaeologists move from specific data points (pollen counts, lithic density, isotope ratios) to abstract categories ("the state," "agriculture," "hierarchy") via aggregation. This process is rarely made explicit. It assumes that local variance averages out rather than compounding into error.
  **The Task:** Develop a formal critique of the aggregation rules currently used in macro-history. How do we validate a claim about "global hierarchy" when the data is 90% regional and 10% contradictory? This is not about finding new data; it is about mapping the logic of induction used to scale up.
  **Tractability:** High. This is pure philosophy of science/history. It requires analyzing argument structures in major texts (Diamond, Harari, Scott, Graeber/Wengrow) to isolate their rules of inference.
  **Dependency:** None. This is the foundation.

  ### 2. The Ontology of Macro-Units (Priority Two)
  **The Problem:** Big History treats "societies" or "civilizations" as discrete units that can be compared (e.g., "Mesopotamia" vs. "Mesoamerica"). Archaeology increasingly suggests these were porous, networked, and fluid. If the units of analysis are reifications rather than realities, causal claims about them are category errors.
  **The Task:** Propose a conceptual framework for "fuzzy" historical units. Instead of asking "When did this society become hierarchical?", ask "Under what conditions does the label 'hierarchical society' become a valid descriptor for this network?" This shifts the focus from *dating transitions* to *defining thresholds of description*.
  **Tractability:** Medium. Requires conceptual rigor but avoids empirical deadlock.
  **Dependency:** Depends on #1. You cannot define the validity of the units until you understand the validity of the aggregation used to identify them.

  ### 3. The Normative Utility of Counter-Narratives (Priority Three)
  **The Problem:** You asked if debunking the "agricultural revolution as progress" changes how we think about inequality. Currently, this is assumed rather than tested.
  **The Task:** Analyze the logical link between historical contingency and political possibility. Does proving that hierarchy was *not* inevitable logically entail that it is *reversible*? Or is this a naturalistic fallacy? The student should map the specific argumentative moves required to get from "it didn't have to happen" to "we can undo it."
  **Tractability:** High for a philosopher, but low impact if #1 and #2 are ignored.
  **Dependency:** Depends on #1 and #2. If the historical counter-narrative rests on shaky scaling inferences (see #1), the normative conclusion is vulnerable to empirical refutation.

  ### The Overrated Problem: "The Origin of Inequality"
  **Flag this as a dead end.**
  The search for a specific "origin" or "transition point" is a Rousseauean trap. It presupposes a state of nature (equality) and a specific moment of fall (hierarchy). Archaeological data does not support a binary switch; it supports oscillation, context-dependent variation, and simultaneous existence of different modes.
  **Why it's overrated:** Pursuing the "origin" forces the evidence into a moral timeline it does not fit. It consumes massive energy debating *when* or *why* the switch flipped, when the more profound insight is that the switch is a conceptual artifact, not an archaeological reality. A four-year project trying to locate or explain the "origin" will end up mired in the very resolution mismatch you identified.

  ### Strategic Rationale for the Student
  Tell your student to spend years 1 and 2 exclusively on **Priority #1**. They should treat major macro-historical texts as case studies in inferential logic, not as sources of truth. Their output should be a framework for evaluating when a scaling claim is warranted and when it is speculative overreach.

  This leverages their training in philosophy of history (epistemology, logic of explanation) while bypassing their lack of empirical capacity. If they solve the logic of scaling, they make themselves indispensable to the archaeologists who are drowning in data but starving for coherent synthesis. If they jump straight to the normative implications (Priority #3), they become just another voice in the political debate, easily dismissed if their historical grounding is shown to be epistemically weak.

  **Summary:** Fix the inference engine before driving the political vehicle.
