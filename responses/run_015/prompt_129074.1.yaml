prompt: |-
  Look, I've been teaching this course on scale and story—basically big history and its discontents—and I'm trying to figure out where to send my best grad student. The standard debates are exhausted: Harari's cognitive revolution thesis, Diamond's geographic determinism, Graeber and Wengrow's pushback on the inevitability of hierarchy. Everyone knows those moves. But I've been thinking about a problem that doesn't get named enough: there's this resolution mismatch between the kind of evidence archaeologists actually have—localized, fragmentary, often contradictory—and the sweeping causal claims these narratives make about human nature or institutional development. So here's my actual question: if you're advising a small research group with maybe four years and no lab budget, just conceptual and historical work, which open questions in this space are actually upstream?

  I'm specifically wondering whether the field needs a kind of middle-range theory for scaling up from site-level data to macro-historical patterns, or whether that's a dead end and we should instead be working on the normative implications—like, does debunking the agricultural revolution as progress narrative actually change how we think about present-day inequality, or is that just rhetorical? I want a defended agenda: rank the live problems, tell me which ones depend on solving others first, which are tractible for someone trained in philosophy of history rather than field archaeology, and flag the one that sounds important but is probably overrated. Don't give me a reading list—just tell me where the years should go and why.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A professor teaching a course on "scale and story" (Big History, macro-history). They are experienced ("standard debates are exhausted"), critical of current trends (Harari, Diamond, Graeber/Wengrow), and looking for genuine intellectual innovation.
      *   **Target Audience:** A grad student (philosophy of history background, no lab budget, 4-year timeline, small research group).
      *   **Core Problem:** The "resolution mismatch" between localized/fragmentary archaeological evidence and sweeping macro-historical causal claims.
      *   **Specific Question:** What are the *upstream* open questions? Middle-range theory for scaling vs. normative implications of debunking progress narratives?
      *   **Constraints:** Defended agenda, rank live problems, identify dependencies, assess tractability for a philosopher of history, flag one overrated problem. *No reading lists.*
      *   **Tone:** Professional, direct, intellectually rigorous, slightly weary of clichés, strategic.

  2.  **Deconstruct the Core Tension:**
      *   *The Mismatch:* Archaeology gives dots (sites, artifacts, dates). Big History draws lines (civilization, hierarchy, collapse). The connective tissue is often speculative or theoretically undercooked.
      *   *Option A (Middle-Range Theory):* How do we validly infer macro from micro? This is epistemological/methodological.
      *   *Option B (Normative/Political):* Does changing the story change the politics? This is ethical/political philosophy.
      *   *The User's Dilemma:* Which is upstream? Which is tractable for *this* student?

  3.  **Evaluate the Options (Mental Simulation):**
      *   *Normative Implications:* This is tempting for a philosopher. But if the historical narrative is shaky (the "resolution mismatch"), building normative claims on it is building on sand. If Graeber/Wengrow are wrong about the flexibility of early societies, the normative punch loses force. So, this is downstream.
      *   *Middle-Range Theory:* This addresses the mismatch directly. It's about inference, scaling, and evidence evaluation. This fits a philosophy of history skillset (epistemology, logic of explanation) better than field archaeology. It's upstream because you need valid history before you can validly politicize it.
      *   *The "Overrated" Trap:* Trying to solve "What is human nature?" based on this data. That's a sinkhole. Or trying to create a unified law of history (too ambitious, likely false).

  4.  **Develop the Agenda (Ranking & Justification):**

      *   **Priority 1: The Epistemology of Scaling (The "Middle-Range" Problem).**
          *   *Why:* It's the bottleneck. You can't do anything else without solving how to move from site to system.
          *   *Tractability:* High for a philosopher. It's about argument structure, inference to the best explanation, and handling uncertainty.
          *   *Dependency:* Everything else depends on this.

      *   **Priority 2: The Ontology of "Society" at Scale.**
          *   *Why:* Big History talks about "societies" or "civilizations" as units. Archaeology sees networks, flows, temporary aggregations. Are these units real or reifications?
          *   *Tractability:* Medium. Requires conceptual clarity.
          *   *Dependency:* Depends on Priority 1 (how we scale defines what units we see).

      *   **Priority 3: Normative Utility of Counter-Narratives.**
          *   *Why:* The user asked about this. It matters, but only if the history holds up.
          *   *Tractability:* High for a philosopher, but risky if the history is weak.
          *   *Dependency:* Depends on 1 & 2.

      *   **The Overrated Problem:** "The Origin of Inequality."
          *   *Why:* It's a Rousseauean trap. It assumes a starting point of equality and a specific moment of change. Archaeology suggests variation, not a switch. It's a moral question disguised as a historical one.

  5.  **Drafting the Response (Iterative Refinement):**
      *   *Tone Check:* Needs to sound like a colleague talking to a colleague. Avoid academic fluff. Be decisive.
      *   *Addressing the "Middle-Range" vs. "Normative" choice:* Explicitly argue that Middle-Range is upstream.
      *   *Philosophy of History Angle:* Emphasize *inference*, *evidence evaluation*, and *conceptual coherence* over empirical discovery.
      *   *The 4-Year Constraint:* Ensure the scope is manageable. A full new theory of scaling is too big. A *critique and framework* for scaling is manageable.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I initially thought about suggesting "complexity theory." But that might require math/simulation budget. Keep it conceptual. Focus on *inferential validity*.
      *   *Correction:* Make sure to explicitly answer the "normative" part. Don't dismiss it, but place it correctly in the hierarchy.
      *   *Refining the "Overrated" pick:* "The Origin of Inequality" is good, but maybe "Defining Collapse" is also overrated. No, "Inequality" is more central to the Graeber/Wengrow debate the user mentioned. Let's stick with the "Origin/Transition" trap.

  7.  **Final Polish:** Check against constraints.
      *   Defended agenda? Yes.
      *   Rank live problems? Yes.
      *   Dependencies? Yes.
      *   Tractability for Phil of History? Yes.
      *   Flag overrated? Yes.
      *   No reading list? Yes.

  8.  **Final Output Generation:** (This matches the provided good response.)
      *   Structure: Executive Summary -> Ranked Agenda -> The Overrated Trap -> Strategic Rationale.
      *   Key phrase to include: "Inferential bridge." "Reification." "Upstream epistemology."

  *(Self-Correction Note: Ensure I don't sound like I'm dismissing Graeber/Wengrow, but rather situating their work within the epistemological problem the user identified.)*

  9.  **Final Review:** Does this help the professor advise the student? Yes, it gives a clear roadmap that avoids the empirical pitfall and leverages the philosophical strength.

