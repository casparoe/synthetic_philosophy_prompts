answer: |-
  It is completely understandable why this bugs you. As a chemist, you are trained to look for precise definitions and causal relationships. In philosophy, and specifically in Just War Theory, the terminology can sometimes feel like it obscures rather than clarifies.

  Your intuition—that a soldier fighting for an unjust cause is morally different from one fighting for a just cause—is actually the central insight of the "Revisionist" school of thought (led by Jeff McMahan). However, to understand why the "Traditional" view (led by Michael Walzer) argues for the **Moral Equality of Combatants (MEC)**, we have to untangle three specific concepts: **Liability**, **Moral Worth**, and the **Separation Thesis**.

  Here is a breakdown of the debate, corrected for the specific confusion regarding "liability."

  ### 1. What MEC Actually Claims (The Walzer/Traditional View)

  You mentioned reading that MEC claims combatants are equally *"not liable"* to be killed. **This is actually a misunderstanding of the term.**

  In Traditional Just War Theory (Walzer), MEC claims the exact opposite: Combatants on **both** sides are equally **liable** to be killed.

  Walzer argues for a "Separation Thesis." He divides the ethics of war into two buckets:
  *   ***Jus ad Bellum*** (Justice of going to war): Is the cause just? (e.g., Self-defense vs. Aggression).
  *   ***Jus in Bello*** (Justice in war): How do you fight? (e.g., Don't target civilians, treat POWs well).

  Walzer argues these buckets must remain separate. Once war has started, the individual soldier is treated as a "threat" regardless of *why* they are there.
  *   **The Claim:** A soldier on the unjust side and a soldier on the just side have the **same moral status** *within the context of the battlefield*.
  *   **The Consequence:** Both are permitted to kill enemy combatants, and both are **liable** to be killed by enemy combatants. Neither is committing murder by killing the other.

  **Why?** Walzer argues this is pragmatic and humanitarian. If we tell soldiers, "You are only allowed to shoot if your country is objectively right," soldiers might hesitate, prolonging war. Furthermore, many soldiers are conscripted or misinformed; holding them personally responsible for their nation's foreign policy seems unfair.

  ### 2. The Revisionist Challenge (The McMahan View)

  Jeff McMahan, a contemporary philosopher, attacks this separation. He argues that morality cannot be compartmentalized like that.

  *   **The Claim:** Liability to be killed depends on **moral responsibility for a threat**.
  *   **The Consequence:**
      *   **Just Combatants:** Are defending themselves/others. They are **not liable** to be killed. (If an unjust soldier kills them, it is morally akin to murder).
      *   **Unjust Combatants:** Are participating in an unjustified aggression. They **are liable** to be killed. (Killing them is morally akin to self-defense).

  McMahan argues that MEC is logically incoherent. He uses an analogy: If a gang of murderers attacks a homeowner, we don't say the gang members and the homeowner have "moral equality." The gang members are liable to defensive force; the homeowner is not. Why should war be different?

  ### 3. Addressing Your Confusion: Liability vs. Moral Worth

  This is the crux of your question: *How does this square with the idea that all persons have equal moral worth?*

  You are conflating **Intrinsic Moral Worth** with **Contextual Liability**.

  *   **Intrinsic Moral Worth:** This is the idea that every human has dignity and rights simply by virtue of being human. In this sense, the Nazi soldier and the Allied soldier have **equal worth**. Neither is "sub-human."
  *   **Liability:** This is a specific moral status regarding *harm*. You can have full human worth but still make yourself **liable** to defensive force through your actions.

  **The Chemist's Analogy:**
  Think of **Moral Worth** as the atomic structure of an element (e.g., Carbon). It is intrinsic.
  Think of **Liability** as the oxidation state.

  Two atoms of Carbon have the same intrinsic structure (equal worth). However, if one Carbon atom bonds with Oxygen in a combustion reaction (commits aggression), its chemical state changes. It becomes reactive (liable). The other Carbon atom remains stable (not liable).
  *   The fact that one is reactive and the other is stable does not mean they are different elements.
  *   It means their **current relationship to the environment** is different.

  McMahan argues that unjust soldiers, by threatening innocent lives, forfeit their right not to be harmed (they become "oxidized"). Just soldiers do not forfeit this right. Walzer argues that for the sake of order, we treat them as if they are in the same stable state.

  ### 4. A Concrete Example

  Let's look at a hypothetical invasion to make this crisp.

  **Scenario:** Country A invades Country B for no reason (Unjust Aggression). Country B fights back (Just Defense).

  **Soldier A (Aggressor):** Young, conscripted, told he is liberating B. He points his rifle at Soldier B.
  **Soldier B (Defender):** Volunteer, defending his home. He points his rifle at Soldier A.

  **The Walzer (MEC) Analysis:**
  *   **Status:** Soldier A and Soldier B are moral equals.
  *   **Liability:** Both are liable to be shot.
  *   **Permission:** Both are permitted to shoot.
  *   **Reasoning:** Soldier A is a "dangerous instrument" of the state. We cannot expect Soldier B to adjudicate the justice of the war in the heat of battle. To regulate war, we must treat combatants as a distinct class separate from civilians.

  **The McMahan (Revisionist) Analysis:**
  *   **Status:** They are **not** moral equals regarding the fight.
  *   **Liability:** Soldier A is liable to be killed (he is an unjust threat). Soldier B is **not** liable to be killed (he is a defender).
  *   **Permission:** Soldier B is permitted to shoot A (self-defense). Soldier A is **not** permitted to shoot B (he is attempting murder, even if he is excused due to ignorance).
  *   **Reasoning:** If Soldier A kills Soldier B, he has violated B's right to life. B's right to life wasn't forfeited. A's action is objectively wrong, even if A doesn't know it.

  ### 5. Why the Debate Matters

  You might ask, "If McMahan is logically right, why does anyone support Walzer?"

  1.  **Epistemic Humility:** In the fog of war, who decides which side is "Just"? If every soldier believes they are the "Just" side (which they always do), McMahan's view might lead to *more* violence, as both sides feel morally righteous. Walzer's view imposes a neutral rule set.
  2.  **The "Conscript" Problem:** If Soldier A was kidnapped and forced to fight under threat of his family's execution, is he really "liable" to be killed? McMahan has to do complex work to explain why a coerced aggressor is still liable. Walzer sidesteps this by saying, "It doesn't matter; he's a combatant."
  3.  **International Law:** Current Geneva Conventions are built on Walzer's MEC. If we adopted McMahan's view, we would have to treat POWs from the "unjust" side potentially as criminals or detainees without combatant privileges, which could lead to worse treatment of prisoners.

  ### Summary

  To wrap this up for your internal ledger:

  1.  **MEC (Walzer):** Claims combatants on both sides are **equally liable** to be targeted. It separates the *cause* of the war from the *conduct* of the soldier.
  2.  **Revisionism (McMahan):** Claims combatants are **unequally liable**. Unjust soldiers are liable; just soldiers are not. It links the *cause* to the *conduct*.
  3.  **Moral Worth:** Both sides agree all humans have equal intrinsic worth. The debate is about whether your **actions** (fighting for an unjust cause) forfeit your **right not to be harmed** in that specific context.

  Your intuition aligns with McMahan: it feels wrong to say an aggressor has the same moral standing as a defender. Walzer would reply: "It feels wrong, but it's necessary to keep war from becoming total slaughter."

  Does that distinction between *intrinsic worth* and *contextual liability* help resolve the chemical imbalance you were feeling?
