prompt: |-
  I'm a retired chemist who has only recently gotten into philosophy, and I've been trying to wrap my head around just war theory. I keep coming across this idea called the "moral equality of combatants" (MEC), and I have to say it's been bugging me. On the one hand, it sounds like it's saying that soldiers on both sides of a war have the same moral status, which feels realy wrong to me — how can a soldier fighting for an obviously unjust cause have the same standing as one fighting for a just one? But then I've also read that MEC isn't actually that, but rather that combatants on both sides are equally "not liable" to be killed, or have equal "rights" not to be targeted. I'm not sure I see the difference, honestly.

  Could you explain what MEC actually claims, and why the debate (I think Walzer is on one side and McMahan on the other?) turns on whether an unjust soldier is "liable" to be killed? And how does all of this square with the idea that all persons have equal moral worth? I'd really apriciate a clear explanation, maybe with an example if that helps.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired chemist, new to philosophy. This suggests they value precision, clarity, logical structure, and concrete examples. They might be skeptical of vague terminology. They have done some reading (knows Walzer vs. McMahan, knows the term "moral equality of combatants").
      *   **Core Confusion:** The user is confused about what "Moral Equality of Combatants" (MEC) actually means. They interpret it initially as "both sides are equally good" (which they reject) but have heard it might mean "both sides are equally not liable to be killed" or have "equal rights." They don't see the difference.
      *   **Key Questions:**
          1.  What does MEC actually claim?
