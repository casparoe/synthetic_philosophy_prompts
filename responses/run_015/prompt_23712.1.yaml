      *   *Revisionist View (McMahan):* Soldiers fighting for an unjust cause are essentially aggressors. Soldiers fighting for a just cause are defenders. Therefore, they are *not* morally equal. Unjust combatants are liable to be killed; just combatants are not (mostly).
      *   *The "Liability" Twist:* The user is confused about "equal rights not to be targeted." Actually, traditional MEC says combatants *lose* their right not to be targeted equally. Revisionists say unjust combatants lose it, just ones keep it. I need to clarify this specific point of confusion.
      *   *Moral Worth vs. Liability:* This is crucial. Equal moral worth (human dignity) $\neq$ Equal liability in a specific context. A murderer and a victim have equal human worth, but the murderer makes themselves liable to defensive force.

  3.  **Drafting the Explanation - Step-by-Step:**

