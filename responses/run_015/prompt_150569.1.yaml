          *   Does it endorse a specific view? It treats the prophecy as *conditional* ($P(C|A)$) rather than *categorical* ($P(C)$). If it were categorical, the prevention makes the prophecy false. By treating it as conditional, the prevention validates the conditional.
          *   *Merton's Self-Defeating Prophecy:* Robert Merton defined this. The protocol institutionalizes it.
      *   **Epistemic vs. Causal Roles:**
