      *   *Counterfactuals:* The protocol relies heavily on unobserved counterfactuals ($A \square\rightarrow C$). Since $A$ is forbidden, we can never verify this counterfactual empirically.
      *   *Epistemic vs. Causal:* The model isn't just observing; it's intervening. The prediction changes the causal landscape.
      *   *Authority:* The model has prescriptive authority, not just descriptive.
      *   *Underdetermination:* Can we explain this without believing the model *causes* safety? Yes, via evidential decision theory or simply risk aversion. But the protocol *claims* the model worked, implying a causal claim.

