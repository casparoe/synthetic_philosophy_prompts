      *Revised Plan for Underdetermination:* The practice *allows* both interpretations to coexist because the audit is blind. A causalist says "We stopped the cause." An evidentialist says "We avoided the indicator." Both claim success. Therefore, the practice *is* underdetermined. This is a stronger, more interesting philosophical point. It functions as a "Rorschach test" for decision theory.

