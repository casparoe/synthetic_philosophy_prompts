          *   *Refinement:* Let's look closer. If I am an evidential decision theorist (EDT), I choose actions based on what they indicate. If I am a causal decision theorist (CDT), I choose based on what they cause. The protocol mandates avoidance based on a forecast. If the forecast is purely correlational, EDT says avoid. CDT says avoid only if A causes C. The protocol *asserts* "had A been taken, C would have occurred." This assertion is a causal counterfactual. Therefore, the protocol *presupposes* a causal view, even if the data doesn't distinguish them. It is *philosophically committed* to causality, even if *empirically underdetermined*.

