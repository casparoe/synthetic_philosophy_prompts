      *   *Key Insight:* The protocol creates an "epistemic blind spot." It immunizes the model from falsification. This is Popperian non-falsifiability institutionalized.
      *   *Key Insight:* The claim "the model worked" is only true if the model is causal. If the model is evidential, the model was "right" about the correlation, but the *prohibition* didn't prevent the outcome (unless the correlation was causal). The protocol assumes the latter.

      *   *Drafting the Underdetermination section:* I need to be precise. The *practice* (the act of prohibiting) can be justified by EDT (avoid bad news) or CDT (avoid bad outcome). But the *audit claim* ("model worked") implies the prevention was effective. If it was just evidential, preventing the action doesn't prevent the disaster (e.g., stopping the barometer from falling doesn't stop the storm). Since the protocol claims the disaster was avoided *because* of the prohibition, it implicitly endorses Causality. Thus, it is *not* underdetermined in its *self-conception*, though it is underdetermined in *empirical verification*. I will make this distinction.

