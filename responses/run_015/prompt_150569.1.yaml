          *   *Goodhart's Law/Campbell's Law:* When a measure becomes a target, it ceases to be a good measure. Here, the prediction becomes a prohibition.
      *   **Theory of Predictive Authority:**
          *   *Reconstruction:* The model is an Oracle. Its output is a command.
          *   *Strict Requirements:* It requires the conditional probability $P(C|A)$ to be high. It requires the cost of prohibition < cost of risk.
          *   *Compatible Fits:* It fits well with precautionary principle, but strictly requires a belief in the model's structural validity, not just empirical calibration (since calibration is impossible on the forbidden branch).
      *   **Underdetermination (Causal vs. Evidential):**
          *   *Causal-Interventionist:* The model identifies a causal mechanism. Prohibiting $A$ breaks the chain.
          *   *Evidentialist:* $A$ is merely evidence of $C$ (maybe a common cause). Prohibiting $A$ doesn't stop $C$, but the protocol *assumes* it does.
