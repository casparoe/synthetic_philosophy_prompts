answer: |-
  **exam prompt**

  okay here's the scenario. dr. aris thorne is a top climate scientist. we're at a tipping point. she can either take a high-impact advocacy role that requires traveling 90% of the time for five years (potentially shifting policy significantly) or stay in a local research role that has less global impact but lets her be present for her six-year-old kid. a utilitarian says she has to run the calculus—maximize good, probably go advocate. aris refuses to even run the numbers. she says leaving feels like a betrayal of who she is.

  your job: argue whether aris's refusal is genuinely integrity-preserving in williams's sense (a ground project) or if it's just moral laziness dressed up as deep attachment. you need to explain why williams thinks some calculations are *corrupting* rather than merely *inconvenient*. and listen, do not just regurgitate the husband-and-wife drowning example. i want to see you distinguish ground projects from attachments in a way that actually fits this climate dilemma. if you summarize the objection without applying it to aris's specific conflict you're wasting your time. go.

  ***

  **model answer**

  williams's integrity objection isn't just about protecting feelings it's about protecting the structure of agency. for williams utilitarianism demands a kind of neutrality that alienates us from the projects that make our lives worth living. when aris refuses to run the utilitarian calculus on her kid versus the climate she isn't necessarily being lazy she might be protecting a ground project. a ground project isn't just a strong preference or a hobby it's something constitutive of identity. it's the thing that gives you a reason to get out of bed. parenting for aris might be that kind of project. if she treats it as just another variable in a utility function she steps outside herself and views her own life from an external impartial standpoint. that's the corruption.

  the distinction between corrupting and inconvenient is crucial here. if the calculation was merely inconvenient it would just be hard to do emotionally taxing but ultimately neutral. but williams argues it's corrupting because it changes the nature of the action. if aris stays with her kid because she calculated that the utility of stable parenting outweighs the marginal utility of her advocacy she hasn't actually acted out of love or integrity she's acted out of impartial morality. she's still a channel for utility satisfaction. the calculation itself mediates the relationship between her and her child in a way that destroys the immediacy required for the attachment to be real. that's the one thought too many. it's not that she shouldn't save her kid it's that she shouldn't save her kid *because morality says so*.

  is this laziness? critics say calling it integrity is just a shield for avoiding hard sacrifices. but laziness implies avoiding effort whereas integrity implies maintaining coherence. if aris goes into advocacy she might achieve more good but she fractures her identity. williams would say the utilitarian demands she treat her own life as disposable fuel for the greater good. refusing that isn't lazy it's a refusal to be colonized by the impartial standpoint. however there's a limit. if her attachment is just possessive or selfish it's not a ground project it's a preference. the exam question hinges on whether parenting is constitutive for her. if it is then refusing the calculus preserves her integrity. if it's just a preference she's masking as deep then it is laziness.

  in the climate context this gets messy because the stakes are global. but williams's point holds. the utilitarian wants her to be a neutral vessel. she wants to be a mother and a scientist. forcing her to choose via calculus forces her to abandon one part of her agency to serve an abstract system. the corruption lies in the requirement to justify her deepest commitments to an external standard. so her refusal is integrity-preserving provided the parenting is a ground project not just a sentiment. she isn't avoiding the work of saving the world she's refusing the work of dismantling herself to do it. that's the difference. the calculation isn't hard it's wrong because it asks her to be nobody in particular so that utility can be maximized. williams says we are somebody in particular and morality has to account for that or it becomes oppressive. aris staying put isn't failing morality it's rejecting a morality that demands self-erasure.

  ***

  **marking scheme (20 marks total)**

  **1. definition of ground projects vs attachments (4 marks)**
  *   must explain that ground projects are constitutive of identity not just strong desires.
  *   *common botch:* treating ground projects like intense hobbies or preferences.

  **2. corrupting vs inconvenient distinction (4 marks)**
  *   must show that calculation changes the *source* of action not just the difficulty.
  *   *common botch:* saying calculation is just emotionally hard or painful.

  **3. addressing the laziness objection (4 marks)**
  *   must distinguish between avoiding effort (laziness) and maintaining self-coherence (integrity).
  *   *common botch:* dismissing the laziness charge without defining integrity.

  **4. application of one thought too many (4 marks)**
  *   must apply the mediation argument to the scientist/kid dynamic without using the drowning spouse example.
  *   *common botch:* just quoting the husband/wife case verbatim.

  **5. scenario integration (4 marks)**
  *   must engage with the climate advocacy vs research specifics not just abstract theory.
  *   *common botch:* ignoring the climate context entirely and writing a general williams essay.
