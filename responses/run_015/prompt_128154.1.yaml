      *   **Topic:** Whether to list "Ecological Grief Dysfunction" (EGD) - defined as severe HPA-axis dysregulation from mourning climate loss.
      *   **Key Conflict:** Naturalists (biological dysfunction) vs. Normativists (medicalizing rational sadness).
      *   **Specific Requirement:** Engage seriously with the normativist worry (don't just cite legal definitions).
