  **MEMORANDUM**

  **TO:** State Diagnostic Code Board
  **FROM:** [Your Name/Board Member]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Proposal 88-B: "Ecological Grief Dysfunction" (EGD)
  **VOTE DEADLINE:** Tuesday, Oct 31

  Team,

  We're up against the Tuesday deadline to decide on listing **Ecological Grief Dysfunction (EGD)**. We've heard the testimony. We know the stakes. This memo is my pitch on how we vote.

  **The Short Version**
  I recommend we **APPROVE WITH CONDITIONS**.

  We cannot ignore the physiology (the Naturalist position), but we cannot ignore the philosophy (the Normativist position). If we approve this as a standard diagnosis, we risk medicalizing a rational moral response to a burning world. If we reject it, we deny coverage to people whose HPA axes are genuinely shattered.

  The middle path is a specific diagnostic threshold I'm calling the **Allostatic-Meaning Hybrid**.

  **The Philosophical Problem (Why "Just Approve" is Dangerous)**
  The Normativists on the panel are right to be worried. If sadness about climate collapse is a *rational* response to reality, calling it a "disorder" implies the patient is wrong about the world, rather than the world being wrong. We don't want to be the board that pathologizes accurate perception.

  However, the Naturalists are also right: when grief turns into chronic, severe HPA-axis dysregulation (blunted cortisol response, chronic inflammation, autonomic failure), it stops being just an emotion and starts being a biological cage. At that point, it doesn't matter *why* the engine broke; the engine is broken.

  **The Solution: The Allostatic-Meaning Hybrid Threshold**
  To vote "Yes" without selling out the Normativist concern, we need a high bar. A diagnosis of EGD should require **two** concurrent findings:

  1.  **Allostatic Load (The Biology):** Objective clinical evidence of physiological dysregulation. Not just "high stress," but measurable biomarkers (e.g., flattened diurnal cortisol slope, elevated CRP, heart rate variability issues) persisting >6 months.
  2.  **Collapsed Life-Project (The Meaning):** This is the key. The patient must demonstrate that the grief has made it impossible to pursue a "future-oriented life project." This isn't just sadness; it's the inability to plan, parent, work, or conceive of a future *specifically due to ecological despair*.

  **Why this works:** It ensures we are covering *disability*, not just *opinion*. It acknowledges that the biology is real, but only counts as a medical dysfunction when it destroys the patient's capacity for agency.

  **Implementation Timeline**
  If we vote Yes on Tuesday, here is a realistic rollout:

  *   **Nov 1 – Jan 31 (Provisional Period):** Code is active but flagged "Provisional." Insurance cannot deny claims based on "experimental" status, but providers must submit the dual-criteria documentation (biomarkers + functional assessment).
  *   **Feb 1 – July 31 (Provider Training):** We work with the state medical association to train clinicians on the "Collapsed Life-Project" assessment. We don't want GPs guessing this.
  *   **Aug 1 (Review):** Board reconvenes to review utilization data. If we see the code being used for mild anxiety, we tighten the biomarker requirements. If it's working, it becomes permanent.

  **The Vote**
  We have a chance to be innovative here. We can acknowledge that the environment can get "under the skin" without turning political grief into a pathology.

  *   **Vote YES** if you agree that severe physiological dysregulation warrants treatment, regardless of the trigger, provided agency is compromised.
  *   **Vote NO** if you believe no amount of biological data can justify medicalizing climate grief.

  I'm asking for a **YES** vote on the **Conditional Approval**. Let's protect the patients without pathologizing the planet.

  See you Tuesday.

  [Your Name]
  Board Member
