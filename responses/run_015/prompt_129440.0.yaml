  # HANDOUT: Which Account of Play Are You Committed To?

  **The Game**
  Two players alternate. Player 1 moves at nodes 1, 3, 5. Player 2 moves at nodes 2, 4, 6.
  At each node, the mover may **Take** (ending the game) or **Pass**.
  Payoffs (Player 1, Player 2):
  *   Node 1 (P1): Take (2, 1) / Pass →
  *   Node 2 (P2): Take (1, 4) / Pass →
  *   Node 3 (P1): Take (8, 2) / Pass →
  *   Node 4 (P2): Take (4, 16) / Pass →
  *   Node 5 (P1): Take (32, 8) / Pass →
  *   Node 6 (P2): Take (16, 64) [Forced]

  *Note: At every node, Taking yields more money than Passing, provided the next mover Takes.*

  **The Diagnostic**
  Answer the following questions in order. Track your path to the Key.

  **Q1. Node 1 Decision:** You are Player 1. Do you Take or Pass?
  *   **Take:** Go to Q2.
  *   **Pass:** Go to Q3.

  **Q2. The Error Claim:** You Took. Suppose a friend Passes. Are they making a reasoning error?
  *   **Yes:** **Leaf A (Proof-is-Right).**
  *   **No (They are rational):** **Leaf B (Impossible).** *Stop.* You claim Pass is rational yet you Take. If both are rational maximizers with known payoffs, you cannot disagree on the action. You must surrender either the claim that Pass is rational or the claim that you are maximizing money.

  **Q3. The Response to Cooperation:** You Passed. Player 2 Passes at Node 2 (forgoing 4 to hope for 16). You are at Node 3. Do you Take or Pass?
  *   **Take:** Go to Q4.
  *   **Pass:** Go to Q5.

  **Q4. The Tremble Check:** You Passed Node 1 but Take Node 3. Why did you Pass initially?
  *   **I hoped Player 2 was irrational:** **Leaf C (Tremble).**
  *   **I thought Player 2 was rational:** **Leaf B (Impossible).** *Stop.* If you believe Player 2 is rational, they Take at Node 2. You should have Taken at Node 1. You cannot Pass at 1 believing 2 is rational.

  **Q5. The Stakes Variant:** All payoffs are multiplied by 20. Structure unchanged. Does your Node 1 choice change?
  *   **Yes (I now Take):** **Leaf D (Mis-specification).** You care about money, but not only money (e.g., guilt costs are fixed).
  *   **No (I still Pass):** Go to Q6.

  **Q6. The Public Statement:** Before play, a referee announces: "Both players maximize monetary payoff and know the other does." Does this change your Node 1 choice?
  *   **Yes (I now Take):** **Leaf E (Belief-Dependence).** Your reasoning relied on beliefs not fixed by monetary rationality alone.
  *   **No (I still Pass):** Go to Q7.

  **Q7. The Counterfactual:** You Passed Node 1. Suppose instead you had Taken. What would you believe about Player 2's rationality at Node 2?
  *   **I would believe they are irrational:** **Leaf F (Counterfactual).** You reject the robustness condition; your belief depends on your action.
  *   **The question has no content:** **Leaf G (Counterfactual Blindness).** You choose policies, not strategies; off-path beliefs are undefined.
  *   **I would still believe they are rational:** Go to Q8.

  **Q8. The Unit of Agency:** Who is deciding?
  *   **Me, given you:** **Leaf H (Quietist).** You separate normative rationality from predictive data; the puzzle remains unresolved.
  *   **Us (The Pair):** **Leaf I (Collective).** You maximize joint payoff, not individual.

  ***

  **The Key**
  *   **Leaf A (Proof-is-Right):** Backward induction is normatively correct; experimental data record error.
  *   **Leaf B (Impossible):** You hold mutually inconsistent premises. You must surrender something.
  *   **Leaf C (Tremble):** Small probability of non-maximization makes early passing rational.
  *   **Leaf D (Mis-specification):** Subjects are not playing the centipede; utility includes fairness or guilt.
  *   **Leaf E (Belief-Dependence):** Beliefs are correlated in a way that defeats standard independence assumptions.
  *   **Leaf F (Counterfactual):** Robustness condition rejected; belief revision is action-dependent.
  *   **Leaf G (Counterfactual Blindness):** Choice objects are belief-revision policies; off-path evaluation is invalid.
  *   **Leaf H (Quietist):** Normative and predictive questions are distinct; data settle neither.
  *   **Leaf I (Collective):** Unit of agency is the pair; reasoning is "what should we do?"

  ***

  # INSTRUCTOR'S COMMENTARY & ANALYSIS

  **1. Logical Space & Premises**
  The instrument maps the conjunction of premises required for Backward Induction (BI):
  1.  **Own Maximization:** Utility = Monetary Payoff.
  2.  **Other Maximization:** Belief that opponent maximizes money.
  3.  **Common Knowledge:** High-order belief in (1) and (2).
  4.  **Robustness:** Beliefs survive counterfactual deviation (Aumann's condition).
  5.  **Individual Agency:** I maximize my payoff, not ours.
  6.  **Normative-Predictive Link:** Rationality predicts behavior.

  The "Impossible" leaf (B) catches students who Pass (rejecting BI outcome) while affirming all premises. They must drop at least one. Leaf A keeps premises but drops the predictive link (data = error). Leaves C–I drop specific premises (C drops CK; D drops 1; E drops 3; F/G drop 4; I drops 5; H drops 6).

  **2. Data Discrimination**
  *Class Data:* Median Node 3; 1/8 Take Node 1; 7/10 Pass after opponent passes; x20 Payoffs moves median earlier (Node 2), not to Node 1.

  *   **Discriminated:**
      *   **Proof-is-Right (A)** is falsified as a *predictive* model (only 1/8 Take Node 1), though remains normative.
      *   **Mis-specification (D)** is supported by the x20 result. If utility includes fixed "guilt" costs, higher stakes outweigh them, moving play earlier. Pure Tremble (C) often predicts stability under scaling unless the "irrational type" probability scales.
      *   **Tremble (C)** vs. **Counterfactual (F):** The 7/10 Pass-after-Pass rate supports Tremble (passing signals possible irrationality, inviting cooperation) but contradicts strict BI.
  *   **Indistinguishable:**
      *   **Collective (I)** and **Belief-Dependence (E)** both predict Pass at Node 1 and stability under x20 (if joint maximization or correlated beliefs hold).
      *   **Follow-up Question:** "Do you maximize your payoff or the sum of payoffs?" Collective says Sum; Belief-Dependence says Yours (but believes yours tracks theirs).

  **3. Student Runs**

  *   **Student A:** Takes Node 1. Calls passers errors.
      *   **Path:** Q1 (Take) → Q2 (Yes) → **Leaf A (Proof-is-Right).**
      *   **Match:** Perfect. She accepts the theorem and rejects the data.

  *   **Student B:** Passes Node 1. Takes Node 3. Takes after Opponent Passes.
      *   **Path:** Q1 (Pass) → Q3 (Take) → Q4 (Hoped irrational) → **Leaf C (Tremble).**
      *   **Analysis:** She passes initially to fish for irrationality. When Opponent Passes (Node 2), she updates. Why Take at 3? Likely she believes the Opponent's pass was a "tremble" (mistake) rather than a signal of cooperative type, or she believes the irrationality probability is now too low to sustain Node 4. This is consistent with Tremble logic where beliefs update via Bayes' rule on observed deviations.

  *   **Student C:** Passes Node 1. Passes Node 3. Claims maximizing requires this. Denies counterfactual content.
      *   **Path:** Q1 (Pass) → Q3 (Pass) → Q5 (No) → Q6 (No) → Q7 (No content) → **Leaf G (Counterfactual Blindness).**
      *   **Mismatch:** Student C likely labels herself "Rational" or "Standard Maximizers." The handout assigns her **Counterfactual Blindness**.
      *   **Advice:** "You claim to be a standard maximizer, but standard maximization requires defined beliefs at all nodes. You are actually advocating a structural change to decision theory (policies vs. strategies). You are not 'just maximizing'; you are rejecting the counterfactual stability required by standard game theory. Own the innovation."

  **4. Indistinguishable Leaves & Follow-up**
  *   **Leaves:** **Counterfactual (F)** and **Counterfactual Blindness (G)**.
  *   **Reason:** Both reject the robustness condition and justify Passing at Node 1. Both survive the x20 test.
  *   **Follow-up:** "If forced to specify a belief at the node you didn't reach, could you?"
      *   **F:** Yes (I would believe you are irrational).
      *   **G:** No (The specification is meaningless).
  *   **Note:** If G collapses into F, it is because "no content" is functionally equivalent to "any belief is permissible," which restores the freedom F uses. I keep them distinct based on the metaphysical commitment to policy objects.
