prompt: |-
  I've been trying to teach myself Bell's theorem for a couple of months now. Im a total layman, no physics degree, just a guy who got hooked on a YouTube series and kept going down the rabbit hole. I finally get the basic setup: you make pairs of particles that are entangled, you send one of each pair to two labs that are far apart, each lab randomly picks a measurement setting, and the correlations you get between the two sides are stronger than any theory could produce where each particle just carried a pre-written instruction sheet. So Bell showed that local hidden variables are dead, and experiments keep confirming the quantum predictions.

  What I've been chewing on for weeks is what this actually rules out. I keep seeing people say it proves quantum mechanics is nonlocal, but I also keep reading that Bell's theorem really only kills local hidden variable theories, and that you can read the result without any spooky action at a distance -- like just giving up on the idea that the outcome was already there before you measured, or that the setting choices were really independent. Some people also say the locality assumption is a bundle of different assumptions (something about no influence traveling faster than light, plus something about the outcome here not depending on the setting over there), and that Bell only rules out the whole bundle together, not each piece on its own. I don't fully trust my own understanding of any of this, so please first sort out which version of the argument is actually the right one, and then do the main task.

  The main task: Bell himself died in 1990, so he never saw the 2015 experiments that finally closed the two big loopholes -- the detection loophole (detectors missing so many particles that maybe the sample was biased) and the locality loophole (the labs close enough that a light-speed signal could in prinicple have gotten between them in time). He only ever saw the earlier experiments with the loopholes still open. Based on how he actually argued in his papers and talks -- he seemed to care a lot about the actual experimental situation, and to think the real question was what kind of world you'd have to live in -- what do you think he would have said about the 2015 loophole-free results? Would he have celebrated, or kept pushing back that the experiments still don't decide between real nonlocality and just giving up on some other assumption? And what would he have said to someone who insists nothing has changed, that we can still be local in the no-faster-than-light-signals sense, and that "local realism" was always a bad name for the assumption that actually got killed?
