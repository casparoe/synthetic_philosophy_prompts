  **Note on Theory and Liberties**
  This poem leans heavily on the voluntarist reading of Sartre's *Sketch for a Theory of the Emotions*, where emotions are purposive, magical transformations of the world adopted when practical pathways are blocked. The liberty taken here is rendering that "choice" as almost thematic or deliberate ("I choose," "I summon"), whereas Sartre often describes it as pre-reflective consciousness—a magical behavior we *live* rather than explicitly decide. A contested reading might argue that bodily facticity limits this choice more than the poem suggests; if physiological arousal precedes the magical interpretation (a Jamesian counter-argument Sartre rejects), the refrain "I choose the collapse" becomes less tenable. I would adjust the mapping if textual evidence from *Being and Nothingness* regarding the "coefficient of adversity" in things suggested that the body's resistance is more brute and less magically malleable than the *Sketch* implies.
