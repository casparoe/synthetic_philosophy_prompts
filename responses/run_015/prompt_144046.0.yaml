  I say that the panic is born in the brain.
  When the practical road disappears in the night.
  But I choose the collapse to avoid all the pain.

  I refuse to perceive what is clear on the plain.
  I wait for the dawn to bring back the light.
  I say that the panic is born in the brain.

  The world is too hard, so I summon the rain.
  I block out the sun and I hide from the light.
  But I choose the collapse to avoid all the pain.

  I wait for the feeling to pass in vain.
  I claim that my soul is a victim of fright.
  I say that the panic is born in the brain.

  There is no exit, I'm locked in the chain.
  Yet I hold all the keys in the broad daylight.
  But I choose the collapse to avoid all the pain.

  The mirror shows nothing but eyes full of stain.
  I wait for a god to pronounce me as bright.
  I say that the panic is born in the brain.
  But I choose the collapse to avoid all the pain.

