prompt: |-
  I am the compliance officer at a mid-sized medical device manufacturer that sells in eight countries. Several times a week I have to rule on gifts, meals, travel and hospitality: things our sales staff want to give to customers and hospital purchasing staff, and things they want to accept from suppliers. The range runs from a sandwich to a week at a resort, and getting it wrong can mean criminal liability for the company and, in some places, for the individual whose initials are on the form. I have about five minutes per request, no legal training beyond our own policy, and no authority to give case-by-case legal advice. Anything above the written threshold goes to the general counsel, who also has to approve the wording of the policy itself, and an external auditor will eventually read that policy and ask why the numbers in it are the numbers they are. I would also like a first-line version I can hand to two junior staff who will field most of the questions before they reach me.

  I have been reading about vagueness, and I think I finally understand why every draft of the policy I write comes out either uselessly vague or dishonestly precise. The difficulty is not that I don't know the law. It is that the predicate at the centre of the whole exercise — bribe, or inducement, or improper benefit, whatever word the local statute uses — seems to have no sharp boundary, and I am being asked to write a sharp boundary into a document and then apply it. A cup of coffee is not a bribe. A briefcase of cash is a bribe. Take the briefcase and remove one dollar, then another: I cannot say where the change happens, and no one I ask can either. My drafts have done one of two things: a numeric cap that is plainly arbitrary at the margin, or a list of factors followed by a note that each case must be judged on its merits, which is exactly what I had before I wrote anything. I have seen four ways of talking about this and I don't know which one I am implicitly relying on: that there really is a line and we simply cannot find it; that there is no line at all and the predicate is neither true nor false of the borderline cases; that the line exists but moves with the context of the person applying it; or that the predicate comes in degrees and nothing needs a line. I suspect the choice matters for what I write, and I want to know whether it matters in practice or only in how I justify myself afterwards.

  What I need is a procedure, not a discussion. Specifically:

  1. A decision procedure in words — a flowchart in order — that I can run on a single request in a few minutes. For each question: what counts as a sufficient answer, what I do when the answer is unclear, and where the procedure stops. Distinguish the stopping points clearly: a clean no; a clean yes; a no I will have to defend to an annoyed sales director; and a hand-off to a person. For each hand-off, say whether it is a hand-off because the question is one of values rather than facts, or because the procedure has run out of information I can get in five minutes.

  2. A method for setting the numbers and categories in the written policy itself, not merely for applying them. This is where I need the philosophy rather than the law. If the predicate has no sharp boundary, what is the status of a rule saying that nothing above X may be accepted? Is it a discovery of where the line always was, a stipulation, or something in between — and does the answer change what the policy's preamble should say the rule is for? State plainly which of the four positions above the procedure presupposes, and whether a procedure built on a different one would behave differently in practice or only in its rhetoric.

  3. Two failures I expect from any single threshold, and what to do about them. First, the continuum does not run only along the size of one gift: there is a second one, the accumulation of many small things from the same source over years, and a cap on individual gifts does nothing about it. Second, the boundary appears to move with context — the same bottle of whisky means something different from a purchasing clerk, from a ministry official, and from a customer who has bought from us for a decade; and something different again while we are bidding for a contract than after we have held it. I want the procedure to handle both without collapsing into 'it depends'. I am also aware that the offence is not purely a matter of degree: there is an intent element that looks all-or-nothing, and I do not want a numeric cap to swallow it.

  4. A rule for the middle. Every draft I have written has an obvious gap between clearly fine and clearly not fine, and the gap is where all the real requests live. I do not want that gap filled with 'use your judgment'. I want a default, a reason for the default, a rule for when it can be overridden, and a specific provision for the case where the person asking me is my own manager.

  Then run the procedure on the following, in this order, showing your work at each step:

  (a) A supplier offers one of our sales representatives two tickets to a sold-out concert, face value 180 each, three weeks before that supplier's contract comes up for renewal. The representative does not vote on the renewal but is the person the supplier deals with day to day.

  (b) A hospital department head with whom we have no contract invites our regional manager to a weekend at a golf resort, roughly 2,500 all in, described as relationship building, while we are preparing a bid.

  (c) A customer who has bought from us for fifteen years sends a box of chocolates, about 25, to his regular representative at the new year. The policy as drafted says staff may not accept anything of value from a customer. The representative will be upset, every competitor does this, and I have already told two other representatives to decline similar boxes this month.

  I expect the procedure to give me an answer I do not like at least once, and I would rather find that out now than in an audit. Finally, tell me what the procedure cannot do: which steps are judgments dressed up as procedure, where it will misfire, and what I should stop expecting a written policy to settle. I do not want a survey of the literature and I do not want citations; I want the thing I can use on Monday morning, together with an honest account of what it is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Compliance Officer at a mid-sized medical device manufacturer (8 countries).
      *   **Problem:** Needs to adjudicate gifts/hospitality (give and take) with high stakes (criminal liability) but low resources (5 mins/request, no legal training beyond policy).
      *   **Core Philosophical Issue:** Vagueness of predicates (bribe vs. gift). The Sorites Paradox (heap/non-heap) applied to compliance.
      *   **Specific Needs:**
          1.  A decision procedure (flowchart style) for individual requests.
          2.  A method for setting policy numbers/categories (philosophical grounding).
          3.  Handling two specific failures: accumulation over time and context-dependence.
          4.  A rule for the "middle" (gray area), including overrides and manager requests.
          5.  Application of the procedure to three specific scenarios (a, b, c).
          6.  Limitations of the procedure (what it can't do).
      *   **Constraints:** No literature survey, no citations, practical tool for Monday morning, honest about limitations. Needs a "first-line version" for junior staff implied in the structure.
      *   **Tone:** Professional, direct, pragmatic, philosophically informed but not academic.

  2.  **Deconstruct the Philosophical Problem (Vagueness):**
      *   The user identifies four positions on vagueness:
          1.  Epistemicism (line exists, we can't find it).
          2.  Nihilism/Truth-value gaps (no line, borderline cases neither true nor false).
          3.  Contextualism (line moves with context).
          4.  Degree Theory (comes in degrees, no line needed).
      *   *Decision:* For compliance, **Contextualism + Stipulation** is the only workable model. We cannot claim the line is "discovered" (Epistemicism) because it's not. We cannot say "it depends" forever (Nihilism) because we need action. We cannot rely solely on degrees (Degree Theory) because the law often demands a binary decision (prosecute/don't prosecute).
      *   *Strategy:* The policy is a **safe harbor stipulation**. It creates an artificial bright line to manage risk, acknowledging that the moral/legal reality is fuzzy. The procedure must operationalize this stipulation while allowing for context where the stipulation fails.

  3.  **Drafting Section 1: The Decision Procedure (Flowchart):**
      *   Need to be fast (5 mins).
      *   Need clear stop points (Yes, No, Escalate).
      *   Need to distinguish *why* we escalate (Values vs. Info).
      *   *Steps:*
          1.  Check Policy Thresholds (The "Safe Harbor").
          2.  Check Timing/Context (The "Appearance" test).
          3.  Check Accumulation (The "Pattern" test).
          4.  Check Intent/Quid Pro Quo (The "Legal" test).
          5.  Decision Matrix.
      *   *Refinement:* Make it binary where possible. If > Threshold -> Escalate. If Timing Bad -> No. If Accumulation High -> No/Escalate.

  4.  **Drafting Section 2: Setting the Numbers (Philosophy of Policy):**
      *   Address the user's specific question: Is the line discovered or stipulated?
      *   *Answer:* It is a **Risk-Based Stipulation**. It is not a discovery of moral truth. It is a boundary drawn to keep the company out of the "danger zone" of vagueness.
      *   *Method:* Benchmarking + Risk Buffer. Look at competitors/auditors, then subtract 20% for safety.
      *   *Preamble:* Must state this is a *compliance boundary*, not a moral definition.
      *   *Philosophical Stance:* The procedure presupposes **Contextualism managed by Stipulation**. If we used Epistemicism, we'd claim the number is "true." If we used Nihilism, we'd have no numbers. The practical difference is in the *defense*: "We followed a rigorous risk protocol" vs. "We guessed the moral truth."

  5.  **Drafting Section 3: Handling the Two Failures (Accumulation & Context):**
      *   *Accumulation:* Need a "Lookback" clause. Register all gifts. If Total > X in 12 months -> Trigger review.
      *   *Context:* Need a "Sensitive Period" multiplier. During bids/audits, threshold drops to zero or requires automatic escalation.
      *   *Intent:* Keep the "Quid Pro Quo" check separate from the value check. High value doesn't equal bribe, but high value + pending decision = presumption of bribe.

  6.  **Drafting Section 4: The Rule for the Middle:**
      *   The "Gray Zone."
      *   *Default:* **No.** (Risk aversion is cheaper than fines).
      *   *Reason:* Burden of proof lies on the business need.
      *   *Override:* Requires General Counsel + Business Unit Head sign-off.
      *   *Manager Request:* Automatic escalation to General Counsel or Audit Committee Chair. No self-dealing.

  7.  **Drafting Section 5: Running the Scenarios:**
      *   *Scenario (a) Supplier Tickets:* Value likely over threshold? Timing (contract renewal) is critical. Even if under value, timing makes it toxic.
      *   *Scenario (b) Golf Resort:* High value. During bid. Clear "No" or "Escalate to GC" (likely No).
      *   *Scenario (c) Chocolates:* Low value. Long relationship. Policy says "No," but reality says "Customary." This tests the rigidity. Procedure should allow a "De Minimis" exception or require policy amendment. *Correction:* The prompt says policy says "no anything of value." This is a trap. The procedure must flag the policy as unworkable here.

  8.  **Drafting Section 6: Limitations:**
      *   What can't it do? It can't read minds (intent). It can't stop culture drift. It can't replace legal advice. It creates a false sense of security.
      *   *Honest Account:* It's a shield, not a truth machine.

  9.  **Review and Refine:**
      *   *Check against constraints:* Did I cite literature? No. Is it practical? Yes. Did I answer the specific philosophical question about the four positions? Yes.
      *   *Tone Check:* Is it empathetic to the Compliance Officer's burden? Yes.
      *   *First-line version:* The prompt asks for a version for junior staff *and* the officer. I should structure the procedure so the first few steps are for juniors, later steps for the Officer.
      *   *Philosophical Consistency:* Ensure the "Stipulation" argument holds through the whole text. The numbers are *rules*, not *facts*.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Scenario C:* If the policy says "nothing of value," the procedure must flag the policy as the problem, not just the gift. I need to make sure the "Rule for the Middle" handles policy conflicts.
      *   *Correction on Philosophy:* Be careful not to get too abstract. Keep it tied to *audit defense*.
      *   *Formatting:* Use bolding and lists for readability.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a operational framework designed for speed, defensibility, and philosophical honesty. It treats the policy not as a moral truth, but as a risk-management stipulation.

  ### 1. The Decision Procedure (The "Five-Minute Filter")

  This flowchart is designed for you and your junior staff. Junior staff handle Steps 1–3. You handle Steps 4–6.

  **Step 1: The Numeric Safe Harbor (Junior Staff)**
  *   **Question:** Does the gift/hospitality exceed the written monetary threshold (e.g., $150) or fall into a prohibited category (cash, travel, entertainment)?
  *   **Sufficient Answer:** Yes/No based on receipt/invoice.
  *   **If No (Under threshold):** Proceed to Step 2.
  *   **If Yes (Over threshold):** **STOP.** Hand-off to Compliance Officer.
      *   *Reason:* Procedure has run out of authorized discretion. This is a policy violation requiring exception handling.

  **Step 2: The Timing & Status Check (Junior Staff)**
  *   **Question:** Is there an active tender, contract renewal, regulatory audit, or investigation involving the giver/receiver within the last 3 months or next 6 months?
  *   **Sufficient Answer:** Check CRM/Contract log.
  *   **If No:** Proceed to Step 3.
  *   **If Yes:** **STOP.** Hand-off to Compliance Officer.
      *   *Reason:* Contextual risk multiplier. The numeric threshold is suspended during sensitive periods.

  **Step 3: The Accumulation Check (Junior Staff)**
  *   **Question:** Has this specific giver/receiver pair exchanged gifts/meals more than 3 times in the last 12 months, or does the total value exceed 2x the single gift threshold?
  *   **Sufficient Answer:** Check Gift Register.
  *   **If No:** **CLEAN YES.** (Approve and log).
  *   **If Yes:** **STOP.** Hand-off to Compliance Officer.
      *   *Reason:* Pattern risk. Individual caps do not cover aggregation.

  **Step 4: The "Headline" Test (Compliance Officer)**
  *   **Question:** If this transaction were published on the front page of a trade journal or reported to a regulator, would it look like an attempt to influence?
  *   **Sufficient Answer:** Your professional intuition based on industry norms.
  *   **If No:** Proceed to Step 5.
  *   **If Yes:** **DEFENSIBLE NO.** (Reject).
      *   *Reason:* Reputation risk outweighs business benefit. You will have to defend this to Sales, but the audit defense is "reputational risk mitigation."

  **Step 5: The Intent/Quid Pro Quo Check (Compliance Officer)**
  *   **Question:** Is there any evidence (emails, verbal cues) linking the gift to a specific business action?
  *   **Sufficient Answer:** Review of correspondence.
  *   **If No:** Proceed to Step 6.
  *   **If Yes:** **HARD NO.** (Reject and investigate).
      *   *Reason:* Criminal liability trigger.

  **Step 6: The Business Necessity Override (Compliance Officer)**
  *   **Question:** Is there a documented, legitimate business purpose (e.g., product training, essential contract negotiation) that *requires* this specific level of hospitality?
  *   **Sufficient Answer:** Written justification from Business Unit Head.
  *   **If No:** **DEFAULT NO.**
  *   **If Yes:** **HAND-OFF TO GENERAL COUNSEL.**
      *   *Reason:* This is a value judgment/risk acceptance decision beyond Compliance authority. GC must own the liability.

  ***

  ### 2. Setting the Numbers (The Philosophy of the Policy)

  You asked about the status of the rule "Nothing above X." You are correct that the predicate "bribe" is vague. Therefore, the number $X$ is not a **discovery** (Epistemicism) of where a bribe begins. It is a **stipulation** (Contextualism managed by Rule) designed to create a safe harbor.

  **The Method:**
  1.  **Benchmark:** Survey the thresholds of your top 3 competitors and the local guidelines in your 8 countries. Take the median.
  2.  **Buffer:** Reduce that median by 20%. This creates a "risk buffer" for the vagueness at the margin.
  3.  **Categorize:** Do not use one number. Use three:
      *   *De Minimis* (e.g., meals under $50): Pre-approved.
      *   *Review* (e.g., $50–$250): Requires your approval.
      *   *Prohibited* (e.g., >$250, travel, cash): Requires GC approval (rarely granted).

  **The Preamble:**
  The policy preamble must explicitly state: *"These thresholds are not a definition of ethical behavior, but a compliance boundary. Gifts below this limit may still be prohibited if context suggests impropriety. Gifts above this limit are not automatically illegal but require enhanced scrutiny."*

  **Philosophical Position:**
  This procedure presupposes **Contextualism**. It admits the line moves (Step 2 & 3 of the procedure). However, it treats the written policy as a **Stipulated Bright Line** for administrative efficiency.
  *   *Does the choice matter?* Yes. If you claim Epistemicism ("$200 is the true moral limit"), an auditor will ask for your moral calculus. If you claim Stipulation ("$200 is our risk tolerance"), the auditor asks for your risk assessment methodology. The latter is auditable; the former is not.

  ***

  ### 3. Handling the Two Failures (Accumulation & Context)

  You identified that a single threshold fails on accumulation and context. The procedure handles this without collapsing into "it depends" by hardcoding the variables.

  **Failure 1: Accumulation**
  *   **The Fix:** Step 3 of the procedure (The Accumulation Check).
  *   **The Rule:** The "Gift Register" is mandatory. No gift is approved in isolation. The system automatically flags the *relationship*, not just the *transaction*.
  *   **Why it works:** It converts a vague "pattern of behavior" into a concrete count (3 times in 12 months). It makes the continuum discrete.

  **Failure 2: Context Dependence**
  *   **The Fix:** Step 2 of the procedure (The Timing & Status Check).
  *   **The Rule:** "Sensitive Periods" (tenders, audits, renewals) trigger an automatic suspension of the numeric threshold. During these periods, the threshold effectively becomes zero (everything escalates).
  *   **Why it works:** It acknowledges the predicate moves. A $100 meal is fine in January; a $100 meal is toxic during a bid in March. The procedure hardcodes the context switch.

  **The Intent Element:**
  *   **The Fix:** Step 5.
  *   **The Rule:** Numeric caps never override evidence of intent. If intent is found, the cap is irrelevant. This prevents the "safe harbor" from becoming a "license to bribe up to the limit."

  ***

  ### 4. The Rule for the Middle

  The "Gray Zone" is where requests pass the numbers but fail the "Headline Test," or vice versa.

  *   **The Default:** **NO.**
  *   **The Reason:** In a vague environment, the cost of a false positive (rejecting a harmless gift) is annoyance. The cost of a false negative (accepting a bribe) is criminal liability. Risk aversion is the only rational default.
  *   **The Override:** Can only be overridden by **General Counsel + Business Unit Head**. Both must sign. This ensures no single person owns the risk.
  *   **The Manager Request:** If the request comes from your own manager (or anyone above you):
      *   **Rule:** Automatic Hand-off to General Counsel or Audit Committee Chair.
      *   **Reason:** You cannot objectively apply the procedure to your own superior. This protects you from coercion and creates a paper trail showing you did not capitulate.

  ***

  ### 5. Running the Procedure

  Here is the application of the framework to your three scenarios.

  **(a) Supplier Tickets (Value: 360 total; Timing: Contract Renewal)**
  *   **Step 1 (Numeric):** Likely over threshold (depending on your cap, but $360 is usually high for tickets). **Hand-off to Officer.**
  *   **Step 2 (Timing):** Contract renewal is imminent (3 weeks). This is a "Sensitive Period."
  *   **Step 4 (Headline):** "Sales rep takes supplier tickets right before contract renewal." Headline fails.
  *   **Step 6 (Override):** Is there business necessity? No, it's entertainment.
  *   **Decision:** **DEFENSIBLE NO.**
  *   **Work:** Even if under the numeric cap, Step 2 suspends the cap. The context makes the predicate "improper benefit" true despite the low value.

  **(b) Golf Resort (Value: 2,500; Timing: Pre-Bid)**
  *   **Step 1 (Numeric):** Well over threshold. **Hand-off to Officer.**
  *   **Step 2 (Timing):** Pre-bid. "Sensitive Period."
  *   **Step 4 (Headline):** "Medical device manager takes 2,500 golf trip before bid." Headline fails catastrophically.
  *   **Step 5 (Intent):** "Relationship building" during a bid is functionally indistinguishable from inducement.
  *   **Decision:** **HARD NO.** (Do not even send to GC for override).
  *   **Work:** This falls into the "Criminal Liability" risk zone. The value + timing creates a presumption of intent that cannot be rebutted by "relationship building."

  **(c) Chocolates (Value: 25; Timing: 15-year relationship; Policy: "Nothing of value")**
  *   **Step 1 (Numeric):** Under threshold. **Pass.**
  *   **Step 2 (Timing):** New Year (Customary). No active bid mentioned. **Pass.**
  *   **Step 3 (Accumulation):** 15-year history, but likely sporadic. **Pass.**
  *   **Step 4 (Headline):** "Rep rejects 25 box of chocolates from 15-year client." Headline looks petty, not corrupt.
  *   **Conflict:** The written policy says "Nothing of value." The Procedure says "De Minimis is okay."
  *   **Decision:** **CLEAN YES (with Policy Amendment).**
  *   **Work:** Here the procedure exposes a flaw in the *policy*, not the request. You approve the gift but immediately flag the policy for revision to include a "Customary/De Minimis" exception. If you enforce the strict "nothing of value" rule here, you damage business relationships for zero compliance gain. The procedure saves you from enforcing a stupid rule, but you must document *why* (De Minimis exception).

  ***

  ### 6. Limitations: What This Cannot Do

  You asked for an honest account of what this is.

  1.  **It Cannot Read Minds:** Step 5 (Intent) is the weakest link. A clever briber will never write "gift for contract" in an email. The procedure relies on overt evidence. It will miss sophisticated, implicit quid pro quos.
  2.  **It Creates False Security:** Sales staff will treat the numeric threshold as a "price list" for influence ("I can spend $199 freely"). You must constantly reinforce that the threshold is a *trigger for review*, not a *license to spend*.
  3.  **It Cannot Fix Culture:** If the Sales Director believes gifts are essential to sales, this procedure will become a bureaucratic hurdle they try to game. It manages risk, it does not change incentives.
  4.  **It Is Not Legal Advice:** You noted you have no authority to give legal advice. This procedure is **administrative**, not legal. It determines *company permission*, not *legal guilt*. You must ensure the preamble states: "Compliance approval does not guarantee legality under local law."
  5.  **The "Manager Request" Trap:** If your CEO demands you approve a violation, this procedure gives you a paper trail to say "No," but it cannot stop them from firing you. It protects the *company* from you, and *you* from the company, but it does not stop power.

  **Summary:** This procedure treats the vagueness of "bribe" as a risk variable to be managed, not a truth to be discovered. It uses stipulated numbers for speed, contextual flags for safety, and a "Default No" for liability protection. It is a shield, not a sword.
