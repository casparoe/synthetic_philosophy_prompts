answer: |-
  You have put your finger on a genuine pressure point in the literature, one that often gets glossed over in introductory surveying but causes significant headaches in the technical weeds. To answer your primary question directly: **no, there is no single, settled noun phrase for this specific configuration.** You will not find a standard entry in the *Stanford Encyclopedia of Philosophy* labelled "The Problem of Absorbed Disagreement" or similar.

  However, the *structure* of the problem is well-recognised under the debates surrounding the **Independence Principle** and the distinction between **Parallel** and **Sequential** access to evidence.

  Here is the carving you asked for, distinguishing the settled geography from the live disputes, with a view to how you might frame this for your seminar.

  ### 1. The Conceptual Carving

  The phenomenon you describe is best understood as a failure of **Evidential Independence**. In the standard toy models of peer disagreement (the "Restaurant Check" case, for instance), the assumption is that you and your peer have accessed the same evidence *independently* and processed it separately.

  Your case breaks this. Your colleague has not just accessed the world; she has accessed *your processing of the world*.

  I recommend you distinguish two shapes of disagreement for your students, as the literature often conflates them:

  *   **Parallel Disagreement:** We both look at the evidence $E$. I conclude $P$, you conclude $\neg P$. Our cognitive processes are independent conditional on $E$.
  *   **Sequential (or Dialectical) Disagreement:** I look at $E$ and conclude $P$. You look at $E$ *plus* my argument for $P$ (and your own evidence $E'$), and conclude $\neg P$.

  Your puzzle arises because **Equal-Weight Views (Conciliationism)** are typically calibrated for Parallel Disagreement. When applied to Sequential Disagreement, they face the dilemma you identified:
  1.  **The Deflationary Worry:** Her verdict is less informative than a standard peer's because it is not an independent check. (If I make a calculation error, and you check my work, your disagreement is highly significant. If you merely re-run the same calculation in your head without seeing my work, it's less significant. But if you see my work, accept the premises, and *still* disagree, is that more or less significant?)
  2.  **The Inflationary Worry:** Her verdict is *more* damning because it survives exposure to your best shot. She isn't just disagreeing with the proposition; she is disagreeing with the *proposition-plus-your-argument*.

  ### 2. Nearby Notions (and why they aren't quite it)

  You mentioned the **Independence Principle** and **Higher-Order Evidence (HOE)**. Here is how they relate to your case:

  *   **The Independence Principle (Christensen):** David Christensen argues that to assess a peer's disagreement, you must have a reason for discounting them that is independent of the reasoning in dispute. Your case shows why this is difficult to apply. If you say, "She is wrong because my argument is good," you violate Independence. If you say, "She is right because she is a peer," you ignore that her verdict is conditioned on your argument. Your case isn't a *violation* of the principle; it is a scenario where the principle offers no clear arithmetic.
  *   **Higher-Order Evidence:** The colleague's disagreement is HOE (evidence about whether you have responded correctly to $E$). Usually, HOE is treated as a distinct "layer." In your case, the HOE is "contaminated" by the first-order evidence because she has already digested your first-order reasoning. The literature on HOE (e.g., Feldman, White) acknowledges this but rarely provides a formula for weighting non-independent HOE.
  *   **The Total Evidence View (Kelly):** Thomas Kelly argues that you should simply weigh all the evidence, including the fact of disagreement. This handles your case better than strict Conciliationism, but as you note, it doesn't solve the *arithmetic*. It tells you to "weigh it," but not how to adjust the weight for the lack of independence.

  ### 3. Case 2: The Small Subfield

  This is the same structural problem scaled up, often discussed under the heading of **Correlated Error** or the **Numbers Problem**.

  In a small subfield where everyone reads everyone, the "headcount" loses its statistical power. If ten people argue against you, but all ten have read your paper and rely on the same background literature, they do not constitute ten independent tests. They constitute one test with nine echoes.

  *   **Is it the same phenomenon?** Yes. It is the aggregation of Sequential Disagreements.
  *   **Does it still move you?** Yes, and this is the crux of the live dispute. Even if the evidence is shared, the fact that multiple agents have processed it and rejected your conclusion suggests a **robustness** to their view that your view lacks. It suggests your argument fails to compel even those sympathetic enough to read it closely.
  *   **The Boundary Case:** Consider a case where the "opponents" are all students of a single influential supervisor (a "school of thought"). Here, the lack of independence is obvious, and we tend to discount the headcount. In your subfield case, if the opponents are from diverse theoretical backgrounds but share the literature, the headcount retains more force. The boundary lies in **diversity of processing** rather than diversity of evidence.

  ### 4. Settled vs. Live Disputes (Crucial for Teaching)

  You asked for explicit demarcation. In the epistemology of disagreement, very little is "settled" in the sense of being uncontested orthodoxy. However, there are consensus points on the *landscape*, even if not on the *solution*.

  **Settled (General Consensus):**
  *   **Independence matters:** Everyone agrees that independent verification carries more statistical weight than non-independent verification.
  *   **The "Right to be Steadfast" is not automatic:** It is settled that you cannot simply ignore a peer's disagreement without argument. The burden of proof shifts.
  *   **Case 2 is problematic:** It is widely accepted that headcounts in tightly knit communities (the "small subfield" case) are epistemically less valuable than headcounts in diverse communities. This is standard social epistemology (related to Condorcet's Jury Theorem assumptions).

  **Live Disputes (Do not teach as orthodoxy):**
  *   **The Arithmetic of Sequential Disagreement:** There is **no consensus** on how to weight a peer who has read your argument.
      *   *Conciliationists* (e.g., Christensen, Elgin) tend to suggest you must still significantly reduce confidence, as the peer's processing is a check on your own.
      *   *Steadfasters/Total Evidence View* (e.g., Kelly, Lackey) argue that if you have fully accounted for their objection in your first-order reasoning, the disagreement adds little new weight.
      *   *Teaching Point:* Present this as an open problem. If you teach that "you must split the difference," you are teaching a contested view.
  *   **Whether HOE trumps First-Order Evidence:** Some argue that the mere fact of peer disagreement (HOE) should overwhelm your first-order reasoning. Others argue first-order evidence always dominates. This is the core stalemate of the field.
  *   **The Definition of "Peer":** In your case, is she still a peer if she rejects your argument? Some argue that genuine peerhood requires agreement on the *method* of evaluation, not just training. If she evaluates your evidence differently, is she a peer? This is live.

  ### 5. Suggested Terminology for the Seminar

  Since there is no standard label, do not try to force one. Instead, use the descriptive distinction to clarify the problem. I suggest you introduce the terms **Parallel** vs. **Sequential Disagreement**.

  If you wish to coin a term for the specific "arithmetic" problem you identified, **"The Absorption Problem"** is apt. It captures the idea that your evidence has been absorbed into the opponent's verdict, making it difficult to isolate the evidential weight of the disagreement itself.

  **Boundary Cases for Discussion:**
  To help students grasp the carving, use these contrasts:

  1.  **The Blind Review (Parallel):** You submit a paper. Referee A accepts, Referee B rejects. Neither sees the other's report. (Standard case).
  2.  **The Rebuttal (Sequential):** Referee B reads Referee A's acceptance letter, reads your paper, and *still* rejects. (Your case).
  3.  **The Echo Chamber (Correlated):** Ten referees all read Referee B's rejection and sign onto it without re-evaluating the data. (Case 2 extreme).
  4.  **The Robust Check (Sequential but Moving):** Referee B reads your paper, accepts your data, but applies a different statistical model (different processing) and rejects. (Here, Sequential disagreement *should* move you, because the processing is independent even if the evidence is shared).

  ### Summary for your Syllabus

  *   **Concept:** Non-independent peer disagreement (specifically, Sequential Disagreement).
  *   **Key Tension:** The trade-off between **Informative Value** (she saw my best shot and still said no) vs. **Independence Value** (she didn't check me from the outside).
  *   **Status:** Live dispute. Conciliationism struggles to explain why the weight shouldn't be lower; Steadfastness struggles to explain why the weight shouldn't be zero.
  *   **Teaching Advice:** Frame the standard "Equal Weight View" as applying primarily to Parallel Disagreement. Use your case to show why the view requires refinement when evidence is shared sequentially. This avoids presenting a contested solution as orthodoxy while highlighting a genuine gap in the current theory.

  This approach gives you the "carving" without forcing a false label, and it keeps you safely on the right side of the settled/live distinction.
