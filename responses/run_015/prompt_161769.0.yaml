answer: |-
  You have identified the central fiction of modern higher education finance. The cash flows in the English system (and increasingly the American one) are, in actuarial terms, indistinguishable from a time-limited, income-contingent surtax on graduate earnings. The expected write-off rates (often 40–50% in England) are priced in at issuance. The "loan" is a legal and rhetorical vessel, not an economic reality.

  Here is the explicit philosophy underneath both arrangements, followed by the five specific reconstructions you requested, and finally an analysis of the alternative regimes.

  ### The Work of the "Loan" Label

  Why insist on the word *loan*? It performs three distinct functions that a *tax* label would not.

  1.  **Fiscal Illusion (Budgetary Work):** In national accounting (ESA/IMF standards), a loan is an asset exchange. Money leaves the treasury but returns as a receivable. A tax-funded grant is immediate expenditure, increasing the deficit in year one. By labeling the transaction a loan, the government can expand the higher education sector without immediately blowing its fiscal targets. The "asset" exists on the balance sheet even if the market knows it is impaired. A tax label would require honest accounting of the cost upfront.
  2.  **The Benefit Principle (Moral Work):** A tax implies a general obligation to the collective based on ability to pay. A loan implies a specific contract based on *quid pro quo*. The loan label preserves the neoliberal fiction that education is a private purchase. It maintains the narrative that the student is a *customer* acquiring an asset, not a *citizen* being formed. This protects the university from political interference (in theory) but also absolves the state of responsibility for the outcome.
  3.  **Moral Psychology (Behavioral Work):** "Debt" carries a stigma of personal obligation that "tax liability" does not. A tax is a duty; a debt is a promise. By framing it as debt, the state invokes the moral psychology of repayment. It encourages graduates to view their contributions as discharging a personal moral obligation rather than paying a statutory rate. This reduces political resistance to the collection mechanism; people pay off "their debt" more willingly than they accept a new "graduate tax."

  The label is not merely rhetorical; it constructs the subject. The loan model constructs a *homo economicus* investing in herself; the tax model constructs a *citizen* contributing to a public good.

  ---

  ### 1. Benefit Theory: Who Owns the Degree?

  **The Tax Model (Nordic/Continental):**
  *   **Presupposition:** The degree is primarily a **public good**. It produces externalities (democratic stability, social cohesion, innovation spillovers) that exceed the private wage premium.
  *   **Commitment:** The state has a duty to maximize talent allocation regardless of ability to pay.
  *   **Optional:** It does not *require* the belief that private returns are zero, only that they are insufficient to justify market pricing. It allows for the view that education is a right of citizenship, akin to primary schooling.

  **The Loan Model (Anglo-American):**
  *   **Presupposition:** The degree is primarily a **private investment good**. The graduate captures the majority of the value via the earnings premium.
  *   **Commitment:** The "Benefit Principle" of taxation: those who benefit should pay. The state intervenes only to correct liquidity constraints (18-year-olds cannot access capital markets), not to subsidize the cost.
  *   **Optional:** It does not *require* the belief that public benefits are zero, but it treats them as residual. The state's stake is recouped via interest/repayment, implying the state is an investor expecting a return, not a donor.

  **The Crux:** The tax model justifies cost based on *social need*; the loan model justifies cost based on *private return*. If the private return vanishes, the loan model loses its moral anchor; the tax model does not.

  ### 2. Incidence: The Shape of Redistribution

  **The Tax Model:**
  *   **Incidence:** Progressively funded (general taxation), regressively spent (university attendees are disproportionately affluent).
  *   **Embarrassment:** It is embarrassed by the **spending side**. It subsidizes the children of the middle and upper classes to become doctors and lawyers, funded by the taxes of a plumber who did not attend.
  *   **Justification:** It argues for equality of *opportunity* (removing price barriers) over equality of *outcome*. It accepts the regressive spend as the cost of ensuring talent isn't wasted due to poverty.

  **The Loan Model:**
  *   **Incidence:** Nominally neutral funding (student pays), progressively repaid (high earners subsidize low earners via write-offs).
  *   **Embarrassment:** It is embarrassed by the **liability side**. Even if the poorest graduates never pay a cent, they carry the psychological burden of debt, which deters entry (debt aversion).
  *   **Justification:** It argues for fairness of *contribution*. The highest earners pay back the most, which looks progressive. However, because the "subsidy" (the write-off) is invisible and ex-post, it hides the redistribution.

  **Verdict:** The tax model is more honest about its regressivity (it admits the subsidy). The loan model is more deceptive about its progressivity (it claims to be a market transaction while functioning as a hidden transfer). The loan model is more embarrassed by its incidence because it must deny the subsidy exists to maintain the "loan" fiction.

  ### 3. Risk: The Pooling Disguise

  **The Theory:** Human capital is non-collateralizable. You cannot securitize a person.
  **The Loan Model:** Purports to place risk on the individual. However, because repayment is income-contingent and time-limited, the state absorbs the tail risk (unemployment, low earnings, death).
  **The Difference:** It is not *where* the risk sits, but **when and how visibly the subsidy arrives.**
  *   **Tax Model:** Risk is pooled explicitly at the start. The subsidy is visible (free tuition). The student knows the state has absorbed the risk.
  *   **Loan Model:** Risk is pooled implicitly at the end. The subsidy is invisible (the write-off). The student bears the *anxiety* of risk, even if they do not bear the *cost*.

  **Conclusion:** The loan model is "socialized loss, privatized anxiety." It achieves the same risk pooling as the tax model but extracts a political premium by making the student feel the weight of the obligation. The real difference is transparency.

  ### 4. Positional Goods: Signaling vs. Productivity

  **The Claim:** If degrees are largely signaling (queue-jumping for fixed jobs), the earnings premium is a transfer from non-graduates, not new wealth creation.

  **Damage to Loan Model:** **Severe.**
  *   If the premium is positional, charging the graduate to access it is charging them for a transfer they received from the non-graduated. It legitimizes a zero-sum competition as a positive-sum investment.
  *   It implies the state should profit (via interest/repayment) from a mechanism that merely sorts citizens.
  *   If the degree creates no net social wealth, the "private benefit" justification collapses. Why should the individual pay for a ticket to the front of the line if the line itself produces nothing new?

  **Damage to Tax Model:** **Moderate.**
  *   If education is sorting, the state still has an interest in ensuring the sorting is meritocratic, not plutocratic. Free tuition ensures the queue is ordered by ability, not wealth.
  *   The tax model does not rely on the "ROI" narrative. It relies on the "citizen formation" narrative. Even if the economic return is positional, the civic return (an educated electorate) remains.

  **Verdict:** The loan model cannot survive the "signaling" critique without admitting it is taxing a transfer. The tax model survives by shifting the justification from economic ROI to civic utility.

  ### 5. Bankruptcy and Default: The Moral Tension

  **The Tension:** Income contingency says, "We acknowledge you might not be able to pay." Non-dischargeability says, "But you are never allowed to stop trying."

  **The Resolution:** This is not an economic contradiction but a **moral distinction between misfortune and shirking.**
  *   **Contingency** accounts for *economic misfortune* (low wages).
  *   **Non-dischargeability** guards against *moral hazard* (hiding income, strategic default).

  **Incompatibility:** Yes, it holds two incompatible views.
  1.  **The Actuarial View:** You are a risk pool member. Some will not pay. This is priced in.
  2.  **The Legal/Moral View:** You are a debtor. Debt is a sacred obligation.

  **Why both?** The state needs the Actuarial View to make the numbers work (accepting write-offs). It needs the Moral View to enforce compliance (preventing high-earners from hiding income). If the debt were dischargeable, high-earners might manipulate income to trigger bankruptcy. The non-dischargeability rule presupposes that *non-payment is always suspect*, even if the system is designed to accept non-payment. It enforces the *discipline* of the market without the *insolvency* of the market.

  ---

  ### The Three Alternatives: Cash Flow vs. Framing

  Your colleagues believe only cash flows matter. You suspect framing does independent work. The analysis below suggests you are right. The framing changes the political ontology of the student-state relationship.

  #### 1. The Honest Graduate Tax
  *   **Mechanism:** A capped, time-limited surcharge on graduate earnings (e.g., 9% for 20 years). No principal, no interest, no debt balance.
  *   **Presupposition:** Higher education is a **collective investment** with a deferred return mechanism. It admits the "loan" was a fiction.
  *   **What Changes:**
      *   **Psychological:** Removes "debt aversion." Students do not see a £50k number hanging over them, increasing participation among risk-averse (often poorer) students.
      *   **Political:** Makes the subsidy visible. The government must admit it is spending money on graduates that won't come back. This makes the system more vulnerable to cuts but more honest.
      *   **Cash Flow:** Identical to the current English system.
  *   **Verdict:** **Framing is the crux.** The cash flow is the same, but the removal of the "debt" label alters student behavior and political accountability.

  #### 2. Private Income Share Agreements (ISAs)
  *   **Mechanism:** A private funder pays tuition for X% of earnings for Y years. No cap on total repayment.
  *   **Presupposition:** Human capital is a **tradable asset class**. The student is a vessel for returns. The relationship is purely commercial, not civic.
  *   **What Changes:**
      *   **Risk:** Shifts risk to the investor (if earnings are low, investor loses). But removes the state's protective cap (if earnings are astronomical, student pays millions).
      *   **Incentive:** Funders may steer students toward high-earning majors (finance, tech) and away from low-earning ones (arts, social work).
      *   **Cash Flow:** Diverges from current system. No taxpayer subsidy; potentially higher cost for high earners.
  *   **Verdict:** **Cash flow and Framing both change.** This is the logical endpoint of the "private benefit" theory. It strips the state of its role entirely. It presupposes the university is a factory for wage premiums, not a public institution.

  #### 3. Free Tuition + Means-Tested Living Support
  *   **Mechanism:** Tuition funded by general tax. Students borrow/grant for maintenance only.
  *   **Presupposition:** The **barrier to entry is liquidity, not price.** The "cost" of education is the opportunity cost of not working, not the tuition fee.
  *   **What Changes:**
      *   **Incidence:** Returns to the regressive-spend problem (middle class gets free tuition).
      *   **Risk:** State absorbs all tuition risk. Student bears living cost risk.
      *   **Framing:** Re-establishes education as a public utility.
  *   **Verdict:** **Framing is the crux.** This is the Nordic model. It changes the cash flow (state pays upfront), but the deeper change is the rejection of the "benefit principle." It asserts that the *right to learn* is unconditional, while the *right to consume* (living costs) is means-tested.

  ### Conclusion

  Your suspicion is correct. The cash flows in the Anglo-American income-contingent loan system are a **graduate tax in drag.**

  The "loan" framing does independent work: it allows the state to claim it is not taxing graduates (politically popular), keeps liabilities off the balance sheet (fiscally convenient), and maintains the moral fiction of the self-investing individual (ideologically consistent with neoliberalism).

  If you switch to an honest tax, the cash flows remain, but the **political contract changes.** The state admits it is buying an educated populace, not lending money to customers. If you switch to free tuition, you admit the market cannot price education at all.

  The argument with your English and American counterparts is not about actuarial science. It is about whether a university graduate is a **citizen who owes a contribution** or a **customer who owes a debt.** The money follows the philosophy, not the other way around.
