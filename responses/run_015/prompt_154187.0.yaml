answer: |-
  This is a **Camusian Audit Tool**. It is not legal advice; it is a philosophical stress-test for the *moral coherence* of a sentence. It translates *Reflections on the Guillotine* into procedural questions.

  ### Part 1: The Checklist (Ordered Questions)

  Run these questions in order. If a question fails, proceed to the next. If all fail, the sentence lacks philosophical justification under this framework.

  **1. The Equivalence Test**
  *   **Q:** Does the state's act (killing the prisoner) differ in *kind* from the criminal's act (killing the victim), or only in *timing*?
  *   **Camus Logic:** If the state condemns murder by committing murder, it legitimizes the act it forbids.
  *   **Pass:** The state can prove its act is fundamentally different (e.g., pure containment, not retributive killing).
  *   **Fail:** The state admits the intent is retribution or "a life for a life."

  **2. The Certainty Test**
  *   **Q:** Is there absolute, non-human certainty that this specific individual is guilty and will never rehabilitate?
  *   **Camus Logic:** Human justice is fallible. Executing a possibly innocent person is irreparable murder.
  *   **Pass:** 100% biological/digital certainty of guilt AND 100% certainty of future danger.
  *   **Fail:** Any reliance on witness testimony, confession, or probabilistic risk assessment.

  **3. The Premeditation Test**
  *   **Q:** Is the state's killing more calculated and cold-blooded than the original crime?
  *   **Camus Logic:** Most murders are passionate or impulsive. State execution is months/years of cold calculation. The state becomes the greater murderer.
  *   **Pass:** The original crime was purely predatory/calculated over a longer period than the state's process.
  *   **Fail:** The state spends more time planning the death than the criminal spent planning the crime.

  **4. The Deterrence Test**
  *   **Q:** Is there empirical proof that *this specific execution* will prevent future crimes more than life imprisonment?
  *   **Camus Logic:** There is no evidence death deters more than prison. Claiming it does is a lie to soothe the public.
  *   **Pass:** Data shows a direct causal link between this execution and a reduction in specific capital crimes.
  *   **Fail:** Reliance on general statistics or "sending a message."

  **5. The Necessity Test**
  *   **Q:** Is the physical elimination of the prisoner the *only* way to ensure public safety?
  *   **Camus Logic:** Permanent incarceration removes danger without the moral stain of killing.
  *   **Pass:** Life without parole is proven insufficient to contain the threat.
  *   **Fail:** Secure incarceration is a viable alternative.

  ---

  ### Part 2: Decision Points

  **The Hard-No Stopping Point**
  *   **Location:** **Question 2 (The Certainty Test).**
  *   **Logic:** If you cannot claim omniscience regarding guilt or future behavior, you cannot justify an irreversible act.
  *   **Action:** Immediate Commutation. Camus argues that because we cannot know the future or guarantee absolute innocence, the death penalty is an usurpation of a divine role. If the board admits *any* margin of error or *any* uncertainty about future risk, the logic dictates the sentence must be voided.

  **The Spot Where Values Take Over**
  *   **Location:** **After Question 5.**
  *   **Logic:** If the checklist passes (somehow), the justification is no longer logical; it is emotional or religious.
  *   **Action:** Acknowledge that the execution is being performed for **catharsis**, not safety or justice. The board must sign a statement admitting: *"This execution serves no preventative function and carries a risk of error. It is being carried out to satisfy a collective desire for retribution."* Camus argues this honesty would abolish the penalty.

  ---

  ### Part 3: Honest Flags (Where the Checklist Misfires)

  1.  **Statutory Binding:** This checklist may conclude a sentence is immoral, but state law may mandate it. The board may lack the legal authority to commute based on philosophy.
  2.  **Victim Impact:** Camus largely dismisses the suffering of victims' families. This checklist does not weigh their demand for closure. It will feel cold to them.
  3.  **The "Monster" Exception:** The checklist struggles with cases where the criminal is deemed "inhuman" by the public. Logic often breaks down when fear overrides reason.
  4.  **Board Liability:** Using this tool exposes the board to political backlash for "soft on crime" reasoning.

  ---

  ### Part 4: Case Applications

  #### Case 1: Prisoner kills guard during escape attempt.
  *   **Equivalence Test:** **FAIL.** The state kills a restrained prisoner (cold) vs. prisoner killing a guard (heat of escape). The state's act is more premeditated.
  *   **Certainty Test:** **FAIL.** Can you predict he will kill again if kept in solitary? No.
  *   **Camusian Verdict:** Commute. The state killing a man in its total custody to punish a killing that occurred *because* he was in custody is a circular legitimization of violence. It proves the state cannot control prisoners without murdering them.

  #### Case 2: Jury used a risk algorithm to justify execution.
  *   **Equivalence Test:** **FAIL.**
  *   **Certainty Test:** **HARD NO.**
  *   **Camusian Verdict:** **Immediate Commutation.** This is the peak of Camus's "Hubris" argument. An algorithm predicts probability, not certainty. Using math to justify blood is the ultimate bureaucratic abdication of moral responsibility. It claims scientific certainty where none exists. Under Camus's logic, this is not justice; it is administrative murder.

  ---

  ### Part 5: The Niche Twist (Invisible Execution)

  **Scenario:** Execution is via chemical protocol, no witnesses, sealed room, automated log only.

  **Where the Procedure Cracks:**
  Camus argued that if executions must happen, they should be **public**. He believed the horror of the guillotine would turn the public against the practice. Secrecy sanitizes the act.

  *   **The Crack:** **Question 1 (Equivalence Test).**
  *   **Why:** The checklist relies on the board *feeling* the weight of the killing. Invisibility removes the sensory reality of death.
      *   If the board does not witness the death, they can pretend it is "medical" rather than "killing."
      *   It bypasses the **Premeditation Test**. A chemical protocol looks like treatment, not violence.
      *   **Result:** The checklist becomes a paperwork exercise. The board can check "Pass" on Equivalence because they didn't see the body convulse. The invisibility allows them to lie to themselves that the state is *not* committing the same act as the criminal.

  **Practical Fix for the Board:**
  If the method is invisible, the checklist requires a **Mandatory Witness Clause**. One board member must physically witness the death and sign a affidavit describing the physical suffering. If no one is willing to watch, the execution cannot proceed. This restores the "Horror" check Camus deemed necessary for moral honesty.
