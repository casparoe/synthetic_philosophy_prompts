      *   **Paragraph 4 (Methodology & Institutions):**
          *   *Student:* "In explaining trends, Popper adopts methodological essentialism: we must grasp the essential nature of collective entities..."
          *   *Popper:* Popper is a fierce critic of *methodological essentialism*. He advocates for *methodological nominalism* (or individualism). He explicitly rejects grasping the "essential nature of collective entities."
          *   *Student:* "...Popper insists that trends depend entirely on contingent initial conditions and never on enduring institutional structures..."
          *   *Popper:* Popper acknowledges institutions matter, but he argues against historicist claims that institutions evolve according to laws. However, saying trends *never* depend on enduring institutional structures is tricky. The bigger error is the "methodological essentialism" claim.
