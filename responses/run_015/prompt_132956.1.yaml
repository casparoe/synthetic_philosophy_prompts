              2.  *Sequential Decision:* If decided one at a time, the book example settles (bad outcome), the door example doesn't settle. User thinks the problem is the demand for a "tidy group ranking" or "one shot" settlement, not freedom itself.
      *   **User's Hunch:** The real dispute is whether a right is supposed to *pick an outcome* or just *take some options off the table*.
