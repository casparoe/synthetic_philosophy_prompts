answer: |-
  You are absolutely right to smell a rat. Your intuition from biology is spot-on: a system that discards data (the later private signals) cannot perform as well as a system that uses all the data. The argument you've reconstructed is a classic distortion of the Bikhchandani, Hirshleifer, and Welch (BHW) model of information cascades.

  The hole is in **Step (4)**.

  Here is the breakdown of why (4) is false, why your intuition to keep (5) is correct, and what it costs you to fix the argument.

  ### The Flaw: Step (4) claims information is preserved when it is actually censoring.

  > **(4) The final crowd choice is a function of the whole chain of choices, and each link in that chain was made by someone who had a hunch, so the final choice carries the information of every hunch in the line.**

  This is the sleight of hand. In a true information cascade, once the threshold is crossed (Step 3), subsequent agents **ignore their private signals**.

  Because they ignore their private signals, their public actions (joining the line) **cease to convey information about those signals.**

  If you are the 100th person in line, and you join because you see 99 people ahead of you, your action tells me nothing about your private hunch. You would have joined the line even if your hunch said the other restaurant was better. Therefore, an observer looking at the line cannot infer your private signal from your behavior.

  Your private signal is **censored**. It exists, but it is not aggregated into the public outcome. The "line" grows physically, but it stops growing *informationally* the moment the cascade locks in. The final choice is a function of the *early* hunches that triggered the cascade, plus the *actions* of the later people (which are empty of new signal data).

  ### The Biological Analogy

  Think of a school of fish evading a predator.
  *   **Ideal Pooling:** Every fish measures the threat vector, sends a signal to a central processor, which calculates the optimal escape route.
  *   **Cascade:** The first three fish dart left. The rest see movement to the left and dart left, ignoring their own sensory input regarding the predator's location.

  If the first three fish were reacting to a shadow (noise) rather than a pike (signal), the whole school darts left into the net. The school's direction does **not** carry the information of the 1,000th fish's hunch. The 1,000th fish's sensory data is lost to the group.

  ### Why Step (5) Survives

  You want to keep **(5)**: *"Pooling more independent signals only makes your judgment more reliable."*

  You should keep this. It is the Condorcet Jury Theorem, and it is mathematically sound. The error in the argument isn't that (5) is false; it's that the cascade **fails to satisfy the conditions of (5).**

  For (5) to apply, you need to pool *independent signals*. In a cascade:
  1.  The early signals are independent.
  2.  The later signals are independent *in generation* (my hunch is my own), **but they are not independent in their effect on the outcome.** They are suppressed.

  Because the later signals are not pooled, the Jury Theorem never gets a chance to work its magic on the full dataset. The cascade creates a sample size of $N$ (where $N$ is the number of people before the lock-in), not $M$ (where $M$ is the total crowd).

  ### The Cost of Rejecting Step (4)

  If you reject (4), you restore the correct model of social epistemology, but you pay a specific conceptual cost.

  **1. You must accept that "Rational" Imitation is Statistically Inefficient.**
  The cost is admitting that individual rationality (Step 2 & 3) leads to collective irrationality. It is rational for *you* to ignore your hunch if the public history is strong enough (your hunch is only 51% reliable; the line of 20 people represents much higher odds). But because everyone does this, the group fails to aggregate the remaining 49% of the data.
  *   **Cost:** You lose the comforting idea that individual rationality guarantees optimal group epistemology. The "Invisible Hand" of information is clumsy.

  **2. You must distinguish between "Behavioral Contagion" and "Information Aggregation."**
  In your fish studies, you likely distinguished between a school moving because they all saw a shark (aggregation) vs. moving because neighbors moved (contagion).
  *   **Cost:** You can no longer treat observed human behavior as a transparent window into private knowledge. Once a cascade starts, human behavior becomes "opaque." You cannot reverse-engineer the crowd's wisdom because the crowd isn't wise; it's just locked-in.

  **3. You accept Fragility.**
  The most expensive cost is acknowledging that cascades are **fragile**. Because the final decision rests on a tiny sample size (the few people before the lock-in), a cascade can be overturned by a tiny amount of new public information.
  *   **Cost:** Social stability based on cascades is illusory. A single credible whisper (a new public signal) can shatter a cascade that involves thousands of people, because those thousands were never actually convinced; they were just following.

  ### Summary

  The argument tries to smuggle the **Wisdom of Crowds** (which requires independent voting) into the **Information Cascade** (which requires dependent imitation).

  *   **Reject:** Step (4). The final choice does *not* carry the information of every hunch. It carries the information of the *early* hunches and the *conformity* of the late ones.
  *   **Keep:** Step (5). Pooling is better. That is precisely why cascades are sub-optimal tragedies—they *fail* to pool the later data.
  *   **The Cost:** You must accept that rational social learning is prone to "informational avalanches" where the vast majority of available data is discarded, making the group significantly dumber than the sum of its parts.

  Your biological instinct was right: a herd that ignores its own sensory input is vulnerable. The philosophy literature sometimes dresses this up as "rational herding," but statistically, it's just data loss.
