answer: |-
  The ink in the well had skinned over, a dark eye staring up from the porcelain. Elian破了 the surface with his nib. On the desk before him lay the source text, a scrap of vellum smoothed flat by Lord Varen's own hand an hour prior. It was not poetry. It was a confession written in the jagged script of a man who had slept little.

  *I took the grain from the southern silos. The border guards were paid to look away. I require your silence and your pardon. The winter will be hard.*

  Elian looked at the blank sheet of official stock. Fourteen lines. Alternating rhyme. A refrain addressing the recipient, Lady Isolda, by name. The Court of Versifiers did not accept prose; truth without meter was considered noise, and noise was punishable by silencing. To translate Varen's betrayal into the court's required form was to build a house of glass around a fire.

  He dipped the pen. The first line needed to establish the tone: praise. The rules forbade direct accusation, even in apology. The apology itself had to sound like a tribute.

  *The harvest bows beneath your golden hand,*
  *No other lord commands such rich acclaim.*

  Elian paused. *Acclaim*. It rhymed with *name*, which would be needed for the refrain. He wrote the refrain at the bottom of the page to anchor the structure.

  *Oh, Isolda, keeper of the flame.*

  Lines 2, 6, 10, and the refrain itself all had to rhyme with *flame*. *Name*, *fame*, *same*. The cage was closing. He filled the first quatrain, smoothing Varen's theft into generosity. *The grain flows forth to feed your people's claim.* It was a lie, but it scanned.

  He moved to the second quatrain. Here, the confession had to hide. Varen wanted pardon. Elian had to ask for it without admitting guilt.

  *The winter winds may howl against the pane,*
  *Yet stores remain within your guarded frame.*
  *No debt is left to shadow over same,*
  *Oh, Isolda, keeper of the flame.*

  He stopped at line eight. The rhythm was stiff, the tone too secure. It sounded like a lie because it sounded too safe. Varen's note had trembled; this poem stood rigid. If Elian made it too perfect, Isolda would smell the varnish over the rot. He needed a crack in the glass.

  He turned to the third quatrain. This was where the weight of the message sat. Varen asked for forgiveness. The word for forgiveness in the high tongue was *absolution*. But *absolution* was too long for the meter. It needed to be a verb. *Absolve*.

  Elian tested the sound. *Absolve*. It required a rhyme. *Resolve*? *Involve*? *Dissolve*.

  He wrote line thirteen in his mind, saving it for the couplet. The couplet was the only place where the alternating rhyme broke, where the voice could shift. But the words still had to rhyme with each other.

  If he wrote, *I seek your heart to quietly absolve,* he needed a partner. *Until the bonds of service thus dissolve.*

  Elian held the pen over the paper. *Absolve*. To loosen from guilt. To free. It was the word Varen wanted. It was the word of reconciliation. But *Dissolve*. To break apart. To melt away. To end.

  Etymologically, they were siblings. *Solvre*. To loosen. But one loosened a burden, the other loosened a bond. If he paired them, the rhyme would satisfy the ear, but the meaning would twist. The sound of forgiveness would carry the echo of severance.

  If he chose *resolve*, it meant fixing the problem. If he chose *dissolve*, it meant the partnership was ending. Varen wanted to stay in Isolda's favor. Elian knew that Varen's theft was not just grain; it was trust. To absolve the theft was to dissolve the trust.

  He could change the rhyme. *Forgive* / *Live*. *Pardon* / *Garden*. Safe. Gentle.

  But the form demanded precision. The alternating rhyme of the previous stanzas had built a tension, a tightness in the chest of the poem. To release it with a soft rhyme would be a betrayal of the rhythm. The rhythm knew the truth even if the words did not. The meter was heavy, stumbling slightly on the third foot. It wanted a hard ending.

  Elian looked at the refrain. *Oh, Isolda, keeper of the flame.* If the flame was kept, what was dissolved? The wax. The candle consumes itself to keep the light.

  He made his choice. He would not break the form. To break the form was to reject the court's law, and his head would join the grain in the silo. He would preserve the edifice, but he would load the bricks with poison.

  He wrote the third quatrain, praising her vigilance, praising her mercy. Then, the couplet.

  *Let mercy seek the guilty to absolve,*
  *Until the ties of blood and oath dissolve.*

  He set the pen down. The ink was wet. He sprinkled sand over the lines and shook it off. The poem looked pristine. Fourteen lines. The refrain struck at the correct intervals like a hammer. The rhymes alternated cleanly.

  *The harvest bows beneath your golden hand,*
  *No other lord commands such rich acclaim.*
  *The grain flows forth to feed your people's claim,*
  *Oh, Isolda, keeper of the flame.*

  *The winter winds may howl against the pane,*
  *Yet stores remain within your guarded frame.*
  *No debt is left to shadow over same,*
  *Oh, Isolda, keeper of the flame.*

  *Your justice walks where lesser lords fear tread,*
  *Your mercy covers every act of shame.*
  *We bow before the crown upon your head,*
  *Oh, Isolda, keeper of the flame.*

  *Let mercy seek the guilty to absolve,*
  *Until the ties of blood and oath dissolve.*

  Elian rolled the vellum and sealed it with Varen's sigil. He walked through the corridors of the palace to the Hall of Audiences. Lady Isolda sat on the dais, her expression unreadable. The court was silent. Elian stepped forward and unrolled the message. He did not speak it; the rules required the recipient to read the translation themselves, to feel the rhythm in their own throat.

  He handed it to her.

  Isolda's eyes moved down the lines. She paused at the refrain, once, twice, three times. Her lips moved slightly, sounding out the meter. She reached the couplet.

  Elian watched her face. He saw the moment the sound hit her ear. *Absolve*. The promise of peace. *Dissolve*. The sound of something breaking.

  She looked up from the paper. The court waited for the verdict. If she accepted the poem, Varen lived. If she rejected the form, Varen died. If she accepted the form but acknowledged the meaning, war began.

  Isolda folded the vellum slowly. She did not look at Varen, who stood sweating in the corner. She looked at Elian.

  "The meter is flawless," she said, her voice carrying to the back of the hall.

  "It adheres to the statute, my Lady," Elian said.

  "And the rhyme?"

  "The couplet locks, my Lady."

  Isolda stood. She held the paper in one hand. "To absolve is to free. To dissolve is to end."

  The silence stretched. The architectural weight of the poem hung between them. She had heard the trace in the root. She had heard the severance inside the reconciliation.

  "Lord Varen," she said, not looking at him. "Your poet understands the weight of words. He knows that when a bond is loosened enough to forgive, it is often loosened enough to break."

  She tucked the poem into her sash.

  "I accept the tribute. The form is preserved." She looked at Elian, her eyes sharp. "But the court notes the choice of rhyme. We shall see which meaning holds when the winter comes."

  She turned away. Varen exhaled, a shaky breath of survival. He had been forgiven, but he had been warned. The alliance remained, but the trust was gone, smuggled out in the only container allowed.

  Elian bowed and backed away. He returned to the scriptorium. He cleaned his nib. He looked at the empty well of ink. The structure stood. The edifice had not collapsed. But the air inside the room felt thinner, as if something vital had quietly evaporated, leaving only the shape of what was there before.
