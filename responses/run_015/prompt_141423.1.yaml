  # The "No Difference" Decision Tree
  **Starting Premise:** *My one flight / my single vote / my one pack of factory-farmed chicken makes no difference to anything anyone will ever notice.*

  ### **Node 1: The Overdetermined Case (1000 Keys)**
  **Scenario:** You are one of 1,000 people turning a key. The bomb explodes if 500 keys turn. 999 others turn theirs. The bomb explodes whether you turn yours or not.
  **Question:** *If your key changes nothing about the explosion, is your hand clean?*
  *   **YES** → Go to **Leaf 1**.
  *   **NO** → Go to **Node 2**.

  ### **Node 2: The Unknown-Size Case (Climate Threshold)**
  **Scenario:** Your emissions join millions of others. Harm occurs at a specific threshold (e.g., 2°C), but no one knows exactly where the threshold sits or how many emissions trigger it.
  **Question:** *Even if you likely didn't trigger it, is the risk of being the trigger enough to forbid the act?*
  *   **YES** → Go to **Leaf 2**.
  *   **NO** → Go to **Node 3**.

  ### **Node 3: The Replaceable Case (Factory Chicken)**
  **Scenario:** You skip the chicken pack. The store's order size to the factory is fixed in bulk; they simply sell that pack to another customer next week. Total production is unchanged.
  **Question:** *Even if total production is unchanged, are you still a member of the group that caused the demand?*
  *   **YES** → Go to **Leaf 3**.
  *   **NO** → Go to **Node 4**.

  ### **Node 4: The Complicity Case (Unjust Industry)**
  **Scenario:** Same chicken case. You know the industry is cruel, but your purchase doesn't change the total number of chickens killed (see Node 3).
  **Question:** *Does merely participating in an unjust practice make you an accomplice, regardless of your causal impact?*
  *   **YES** → Go to **Leaf 4**.
  *   **NO** → Go to **Node 5**.

  ### **Node 5: The Norm Case (Local Convention)**
  **Scenario:** In your social circle, the convention is "people like us don't fly for weekends." Your flight is invisible to the climate, but visible to your friends.
  **Question:** *If your visible noncompliance makes it slightly easier for others to break the rule, is that enough to forbid it?*
  *   **YES** → Go to **Leaf 5**.
  *   **NO** → Go to **Node 6**.

  ### **Node 6: The Offset Case (Flight + Trees)**
  **Scenario:** You take the flight but pay for a project that removes an equivalent amount of carbon elsewhere. The net global emissions are zero.
  **Question:** *Is your duty to fix the total global problem, or specifically to reduce your own footprint?*
  *   **My Own Footprint** → Go to **Leaf 6**.
  *   **Total Global Problem** → Go to **Node 7**.

  ### **Node 7: The Expressive Case (Voting/Meat)**
  **Scenario:** You vote for a racist candidate (who loses anyway) or buy meat from a cruel farm (without causal impact).
  **Question:** *Does the act express a value or disrespect that is wrong in itself, independent of outcomes?*
  *   **YES** → Go to **Leaf 7**.
  *   **NO** → Go to **Node 8**.

  ### **Node 8: The Character Case (Habit)**
  **Scenario:** You perform the act repeatedly. It doesn't change the world, but it requires you to ignore suffering or prioritize convenience.
  **Question:** *Does performing this act habituate you into a person you shouldn't be?*
  *   **YES** → Go to **Leaf 8**.
  *   **NO** → (Return to Leaf 1: The act is permissible).

  ---

  ### **The Leaves (Conclusions)**

  1.  **Inefficacy/Permissible:** The act is morally fine because it lacks causal power.
      *   *Awkward Commitment:* You must accept that 1,000 people turning keys is morally identical to 0 people turning keys.
  2.  **Expected-Difference:** The act is wrong because it carries a non-zero probability of causing catastrophic harm.
      *   *Awkward Commitment:* You must forbid acts with tiny risks of huge harm even if they almost certainly do nothing.
  3.  **Sufficient-Set:** The act is wrong because you are a member of a set that collectively caused the harm.
      *   *Awkward Commitment:* You are causally responsible for harm even when your removal changes nothing.
  4.  **Complicity:** The act is wrong because it associates you with a wrongful project.
      *   *Awkward Commitment:* You can be blameworthy for "joining in" even if your joining adds no fuel to the fire.
  5.  **Norm-Sustenance:** The act is wrong because it weakens a coordination rule that benefits the group.
      *   *Awkward Commitment:* You must obey a rule even when your specific violation has no negative consequences.
  6.  **Fair-Share:** The act is wrong because you failed to do your specific portion of the collective duty.
      *   *Awkward Commitment:* You cannot pay others to do your moral duty for you, even if the outcome is identical.
  7.  **Expressive/Symbolic:** The act is wrong because of the message it sends about your values.
      *   *Awkward Commitment:* You must avoid acts that "look bad" even if they are secretly harmless.
  8.  **Character/Virtue:** The act is wrong because it degrades your own moral integrity.
      *   *Awkward Commitment:* The morality of the act depends entirely on your internal psychology, not the external world.

  ---

  ### **Critique & Structural Notes**

  **1. Indistinguishable Leaves: Expressive vs. Character**
  My tree treats **Leaf 7 (Expressive)** and **Leaf 8 (Character)** as distinct, but in practice, they are nearly inseparable. An act that expresses disrespect (Expressive) usually also cultivates a callous character (Character). The distinction is bogus for a first-year handout: both views ultimately say "consequences don't matter, internal states do." I kept them separate only to satisfy the requirement for 8 leaves, but you should tell students that Virtue Ethics and Expressivism often collapse into the same advice here.

  **2. Unoccupied Combinations**
  The tree structure forces a specific order of operations that excludes coherent views. Specifically, **Leaf 1 (Inefficacy)** and **Leaf 8 (Character)** cannot be held together in this tree. If you answer "YES" at Node 1 ("Is your hand clean?"), you exit at Leaf 1. You never reach Node 8.
  *   **Why this is a problem:** A coherent view exists: "Causally, the act is permissible (Leaf 1), *but* it makes me a worse person (Leaf 8)." This is a standard Virtue Ethics position (the act is not *wrong*, but it is not *virtuous*). My tree treats "Is it wrong?" and "Is it virtuous?" as a single linear path, which forces students to choose between consequentialist permissibility and virtue constraints.
  *   **Verdict:** This is a **frame error**, not incoherence. The tree assumes you only care about character if causal/structural arguments fail. In reality, character arguments stand independently of causal ones.

  **3. Rigged Cases**
  *   **The Replaceable Case (Node 3):** This case is rigged against the **Expected-Difference** view. If the store sells the chicken to Bob, your expected utility is literally zero. By placing Node 3 *after* Node 2, I imply you can believe in Expected-Difference (Node 2 YES) but reject Sufficient-Set (Node 3 NO). This is logically stable, but in the real literature, the Replaceable Case is usually deployed specifically to kill the Expected-Difference view.
  *   **The Overdetermined Case (Node 1):** This is the strongest filter. If a student answers "YES" (Hand is clean), they are locked into Inefficacy. This prevents them from being a "Non-Causal Consequentialist" (someone who thinks overdetermined acts are wrong for other reasons). It privileges the intuition that "no difference = permissible" as the default starting block.

  **4. Branching Order Justification**
  I ordered the nodes from **Causal** (Nodes 1–3) to **Structural** (Nodes 4–6) to **Internal** (Nodes 7–8).
  *   **Reason:** This mirrors the historical and pedagogical progression of the debate. Students usually start with "Did I cause it?" (Consequentialism). When that fails, they move to "Did I join the bad group?" (Complicity/Norms). When that fails, they move to "What does this say about me?" (Virtue).
  *   **Alternative:** A tree organized by *type of harm* (Climate vs. Meat vs. Voting) would be messier because the same ethical view (e.g., Fair-Share) applies across all cases. Organizing by *reason for wrongness* allows the same case (Chicken) to appear at different nodes (Replaceable vs. Complicity) to test different intuitions.

  **5. Final Recommendation**
  Use this tree to show students that their intuitions commit them to specific theoretical costs. When they land on a leaf, force them to read the "Awkward Commitment." If they dislike the commitment, make them backtrack up the tree to find a different node where their intuition changes. That backtracking *is* the philosophical work.
