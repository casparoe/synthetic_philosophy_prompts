answer: |-
  ### Step 1: Brainstorming & Conceptual Mapping

  Before drafting the chapter framework, I need to map the conceptual terrain. The core problem isn't finding a definition; it's finding a *functional role* for the concept "life." Are we carving nature at its joints (natural kind), or are we building a pragmatic tool for inquiry (cluster concept)?

  *   **The Trap:** Most undergrad definitions (like NASA's) conflate *origins* with *maintenance*. They say "capable of evolution," which implies a lineage, but "self-sustaining," which implies a current state. This creates the tension between the *historical* view (you are alive because of where you came from) and the *organizational* view (you are alive because of what you are doing right now).
  *   **The Mirror-Image Cell:** This attacks the "historical/Earth-centric" view. It is chemically alien but organizationally identical. If a theory says it's not alive, the theory is chauvinistic. If it says it is alive, the theory must prioritize organization over history.
  *   **The Genome-Free Xenobot:** This attacks the "genocentric/evolutionary" view. It moves, metabolizes (using stored yolk), and replicates kinematically, but has no DNA and no evolutionary history. If a theory says it's not alive, it risks being too DNA-obsessed. If it says it is alive, it risks calling a wind-up toy alive.
  *   **The Tension:** We need a list that doesn't collapse into "everything is alive" (panpsychism/complexity) but doesn't exclude plausible alien/synthetic cases.
  *   **Key Conflicts:**
      *   *Stability vs. Change:* Metabolic closure requires stability; Evolution requires mutation.
      *   *Token vs. Type:* Is *this* specific cell alive (token), or does life only apply to the *lineage* (type)?
      *   *Internal vs. External:* Is life defined by internal boundaries (autopoiesis) or external selection pressures (evolution)?

  Okay, I have the map. Now I will construct the desiderata, integrate the specific cases, address the four stress tests (a-d), and score the competing accounts.

  ***

  ### Step 2: The Desiderata for an Adequate Theory of Life

  To frame your chapter, you need to move beyond "checklist definitions" to "adequacy conditions." A theory of life isn't adequate because it matches our intuitions about dogs and trees; it's adequate if it resolves specific conceptual puzzles without generating new contradictions.

  Here are the five core desiderata. For each, I have integrated your borderline cases to stress-test the requirement.

  #### 1. Thermodynamic Boundary Maintenance (The "Anti-Flame" Condition)
  *   **Motivating Puzzle:** Fire consumes fuel, grows, and moves, but we don't call it alive. Crystals grow but do not metabolize. A theory must distinguish active boundary maintenance from passive physical propagation.
  *   **Why it belongs:** Without this, the concept of life loses its distinction from dissipative structures. Life must actively resist equilibrium.
  *   **Application to Cases:**
      *   *Mirror-Image Cell:* **Passes.** It maintains a chemical gradient distinct from the environment, even if the chemistry is inverted.
      *   *Genome-Free Xenobot:* **Borderline.** If it relies entirely on external yolk without regulating intake, it behaves more like a burning log than a cell. If it actively harvests energy to maintain its boundary, it passes.
  *   **Status:** **Non-Negotiable.** Any theory that allows a flame or a crystal to count as alive has failed to capture the biological phenomenon.

  #### 2. Organizational Closure (The "Anti-Machine" Condition)
  *   **Motivating Puzzle:** A car has parts that work together, but the parts are not produced *by* the car. In an organism, the processes that build the boundary are produced *within* the boundary. This distinguishes living systems from artificial machines.
  *   **Why it belongs:** It solves the problem of *teleology* without invoking magic. The "purpose" of the heart is derived from its role in maintaining the system that produced it.
  *   **Application to Cases:**
      *   *Mirror-Image Cell:* **Passes.** Assuming it synthesizes its own membrane components internally.
      *   *Genome-Free Xenobot:* **Fails (likely).** These are assembled by an external agent (the researcher). They do not produce the machinery that constitutes them. They are biological *machines*, not organisms.
  *   **Status:** **Camp-Specific (Organizationalists).** Evolutionary theorists often reject this as too static, but without it, you cannot distinguish an organism from a virus or a machine.

  #### 3. Hereditary Continuity (The "Anti-Mule" Condition)
  *   **Motivating Puzzle:** A mule is metabolically active and organizationally closed, but it is a dead end. A theory of *life* (as a general phenomenon) must account for the persistence of the *type*, not just the token.
  *   **Why it belongs:** Biology is fundamentally about lineages. If a system cannot transmit the instructions for its own construction, it is a biological accident, not an instance of the ongoing phenomenon of life.
  *   **Application to Cases:**
      *   *Mirror-Image Cell:* **Passes.** If it divides and passes on the chirality information (even if via a synthetic genome).
      *   *Genome-Free Xenobot:* **Fails.** They replicate kinematically (clumping), but there is no information transfer regarding *how* to build the machinery. It is behavioral copying, not genetic heredity.
  *   **Status:** **Non-Negotiable (for Life as a Natural Kind).** If you drop this, you cannot distinguish a living population from a self-replicating chemical oscillation.

  #### 4. Mereological Autonomy (The "Organism vs. Part" Condition)
  *   **Motivating Puzzle:** Why is a dog alive, but its liver only "living tissue"? Why is a mitochondrion (which has DNA and metabolism) not an organism?
  *   **Why it belongs:** To avoid infinite regress. If every living part is an organism, the concept loses utility. We need a criterion for *individuality*.
  *   **Application to Cases:**
      *   *Mirror-Image Cell:* **Passes.** It is a distinct unit of selection/maintenance.
      *   *Genome-Free Xenobot:* **Passes.** It acts as a collective individual, distinct from the stem cells that formed it.
  *   **Status:** **Non-Negotiable.** A theory that cannot distinguish the whole from the part cannot account for biological hierarchy.

  #### 5. Substrate Neutrality (The "Anti-Chauvinism" Condition)
  *   **Motivating Puzzle:** If we find silicon-based self-replicators on Mars, calling them "non-living" because they lack carbon is scientific dogmatism.
  *   **Why it belongs:** To ensure the theory is about *functions*, not *materials*.
  *   **Application to Cases:**
      *   *Mirror-Image Cell:* **Passes.** It proves life is about topology and function, not specific L/D amino acid orientation.
      *   *Genome-Free Xenobot:* **Passes.** It shows behavior can be decoupled from specific genetic substrates (though it fails heredity).
  *   **Status:** **Non-Negotiable.** A theory tied to Earth-chemistry is a theory of *Earth Life*, not *Life*.

  ***

  ### Step 3: Addressing the Four Stress Tests (a–d)

  Here is how an adequate theory must handle the specific conceptual friction points you raised, using the desiderata above.

  **(a) Organism vs. Living Part (Mitochondria/Tissue)**
  *   **The Demand:** The theory must distinguish between a system that *is* an individual and a system that is *part* of one.
  *   **The Solution:** Rely on **Organizational Closure** + **Mereological Autonomy**. A mitochondrion is metabolically active (Desid. 1) but lacks full organizational closure; it relies on the host nucleus for most proteins. It is not mereologically autonomous; it cannot exist as a unit of selection independent of the host.
  *   **The Trap:** If you rely only on metabolism, mitochondria are organisms. If you rely only on evolutionary history, they are endosymbionts (which is correct), but you need to explain why they aren't *currently* organisms. The answer is the loss of closure.

  **(b) Viruses vs. Virophages**
  *   **The Demand:** A non-question-begging line. Usually, viruses are excluded because they lack metabolism. Virophages (viruses that infect viruses) complicate this by adding a layer of parasitism.
  *   **The Solution:** Rely on **Organizational Closure**. Viruses lack the machinery to maintain their own boundary or reproduce without a host. They are "genetic parasites," not living organisms. Virophages are parasites of parasites. Neither meets Desid. 2.
  *   **The Trap:** If you rely only on **Hereditary Continuity** (Desid. 3), viruses *are* alive. They evolve and replicate. To exclude them without begging the question ("they aren't alive because they need a host"), you must argue that *capacity for independent maintenance* is a prerequisite for *counting as a lineage*.

  **(c) Non-Carbon Life vs. Complexity Collapse**
  *   **The Demand:** Allow for silicon/plasma life without calling a hurricane "alive."
  *   **The Solution:** Rely on **Thermodynamic Boundary** + **Hereditary Continuity**. A hurricane has a boundary and energy flow, but no heredity. A silicon computer virus has heredity, but no thermodynamic boundary (it doesn't physically maintain itself against entropy).
  *   **The Trap:** "Complexity" is not a criterion. A crystal is complex. Life requires *specific* complexity: the encoding of boundary maintenance instructions (Desid. 2 & 3).

  **(d) Open-Ended Evolution vs. Minimal Synthetic Cells**
  *   **The Demand:** If a synthetic cell reproduces but is engineered *not* to mutate (no evolution), is it alive?
  *   **The Solution:** This is the hardest tension.
      *   *View A (Etiological):* No. Life is essentially a historical process. A sterile mule is alive, but a lineage that cannot evolve is a dead artifact.
      *   *View B (Organizational):* Yes. If it maintains closure and metabolism, it is alive *now*. Evolution is a consequence of life, not a definition.
  *   **The Verdict:** An adequate theory must acknowledge this split. I argue **Hereditary Continuity** (Desid. 3) is non-negotiable, but *Open-Ended Evolution* is not. A system can be alive even if it is an evolutionary dead end (like the synthetic cell), provided it *has* the machinery of heredity, even if that machinery is currently locked. If it lacks the machinery entirely (like the Xenobot), it is not alive.

  ***

  ### Step 4: Jointly Unsatisfiable Pairs (The Tensions)

  You suspected a conflict between metabolic closure and evolutionary potential. You are right, but it's deeper.

  1.  **Stability (Closure) vs. Evolvability (History):**
      *   *The Conflict:* **Organizational Closure** demands high fidelity in self-maintenance to resist entropy. **Evolutionary Potential** demands error (mutation) to allow adaptation.
      *   *Why Unsatisfiable:* A system perfectly closed against environmental noise is perfectly closed against mutation. A system open enough to evolve is vulnerable to disintegration.
      *   *Resolution:* Life exists in the "error threshold." An adequate theory must define life as a *dynamic tension* between these poles, not a static state.

  2.  **Historical Origin vs. Current State:**
      *   *The Conflict:* **Hereditary Continuity** implies you are alive because of your *past* (ancestry). **Organizational Closure** implies you are alive because of your *present* (function).
      *   *Why Unsatisfiable:* The Mirror-Image Cell has no past ancestry (it's synthetic). The Xenobot has a biological past but no hereditary future.
      *   *Resolution:* You must choose a primary axis. If you choose History, the Mirror Cell is an artifact. If you choose Organization, the Xenobot is a machine. You cannot have both without contradiction.

  ***

  ### Step 5: Scoring the Competing Accounts

  Here is how the two dominant philosophical frameworks score against your desiderata.

  #### 1. The Etiological / Selection-History Account
  *   *Core Claim:* Life is defined by membership in a lineage shaped by natural selection.
  *   **Scores:**
      *   *Thermodynamic Boundary:* **Fail.** (Viruses pass if they evolve).
      *   *Organizational Closure:* **Fail.** (Doesn't matter how you are built, only that you were selected).
      *   *Hereditary Continuity:* **Pass.** (This is its strength).
      *   *Mereological Autonomy:* **Pass.** (Units of selection are individuals).
      *   *Substrate Neutrality:* **Pass.** (Silicon life is possible if it evolves).
      *   *Mirror-Image Cell:* **Fail.** (It has no selection history).
      *   *Xenobot:* **Fail.** (No heredity/selection).
  *   **Verdict:** Excellent for biology as a historical science. Terrible for synthetic biology or astrobiology where history is unknown or engineered. It makes "life" a historical status, not a functional one.

  #### 2. The Causal-Role / Organizational Closure (Autopoiesis) Account
  *   *Core Claim:* Life is a system that produces and maintains its own boundary.
  *   **Scores:**
      *   *Thermodynamic Boundary:* **Pass.** (This is its strength).
      *   *Organizational Closure:* **Pass.** (Definitionally).
      *   *Hereditary Continuity:* **Borderline.** (Maturana originally rejected evolution as essential to life, seeing it as a consequence).
      *   *Mereological Autonomy:* **Pass.** (System vs. Environment distinction).
      *   *Substrate Neutrality:* **Pass.** (Focus on organization, not chemistry).
      *   *Mirror-Image Cell:* **Pass.** (Organization is identical).
      *   *Xenobot:* **Fail.** (Lacks internal production of components).
      *   *Viruses:* **Fail.** (No metabolic closure).
  *   **Verdict:** Excellent for defining the *individual organism* and handling synthetic cases. Weak on explaining the *persistence of life over time* and the viral edge case (some argue viruses are part of the biosphere's organization).

  ### Chapter Framing Advice

  For your chapter, do not try to synthesize these into one "Grand Unified Theory." It won't work. Instead, frame the chapter around the **tension between History and Organization**.

  1.  **Introduction:** Use the Mirror-Image Cell and the Xenobot to show why the NASA definition breaks. One has organization without history; the other has behavior without heredity.
  2.  **Body:** Present the Desiderata not as a checklist, but as a set of constraints that pull in opposite directions. Show how the Etiological view sacrifices the Mirror Cell to save the concept of Lineage. Show how the Organizational view sacrifices the Xenobot to save the concept of Individuality.
  3.  **Conclusion:** Argue that "Life" is likely a **cluster concept** where different research programs (synthetic biology vs. evolutionary biology) legitimately prioritize different desiderata. The "truth" isn't in the definition, but in understanding which constraints matter for which explanatory goals.

  This approach demonstrates philosophical sophistication by acknowledging the trade-offs rather than hiding them.
