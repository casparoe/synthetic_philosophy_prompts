answer: |-
  **Setting:** *Maya and Ben are sitting at a small kitchen table in their grandmother's house. Boxes are stacked against the wall, half-taped. A single sheet of paper lies between them. It's late afternoon, light fading.*

  **Maya:** I just keep looking at her yesterday. She was humming. She got pudding on her chin and she laughed. Like, actually laughed.

  **Ben:** I know.

  **Maya:** So how do we look at this— *(she taps the paper)* —and say that counts more than the laugh?

  **Ben:** Because she wrote this when she knew who she was. Twelve years ago, she was sharp. She looked down the road and saw exactly where we are right now.

  **Maya:** But she wasn't *here* right now. She was somewhere else. The woman who signed this… she's gone, Ben.

  **Ben:** She's in the bedroom.

  **Maya:** Her body is. But the person who signed this? The one who was terrified of being a burden, terrified of losing her mind? That person is dead. This… this is someone else living in the same house. You don't follow the rules left by the previous tenant.

  **Ben:** That's cold.

  **Maya:** It's not cold, it's accurate. If I move into an apartment, I don't have to follow the previous guy's rules about no cats or painting the walls blue. The person who signed this cared about her career, her reputation, her control. Grandma doesn't know what a career is anymore. She cares about pudding and sunshine. They're different people.

  **Ben:** Okay, but when did the switch happen? Was it last Tuesday? Was it three years ago when she forgot my name?

  **Maya:** I don't know. It's not a light switch.

  **Ben:** That's the problem. If you say they're different people, you have to draw a line. Because if you don't, then who are we protecting? If we ignore this paper, we're overriding the only clear voice she ever gave us about this.

  **Maya:** We're protecting the woman eating the pudding.

  **Ben:** But is she the same woman? Think about a ship. You know the old story? You replace one plank, it's the same ship. You replace another, still the same. Eventually, you've replaced every single board, every nail, every sail. Is it the same ship?

  **Maya:** Most people say yes.

  **Ben:** Right. Because it's the continuity that matters. It wasn't ripped apart and rebuilt. It just… aged. Grandma is that ship. She's changed, sure. We all change. I'm not the same guy I was twelve years ago either. I care about different things. I'm softer. But I'm still me. I'd be pissed if my future self ignored my will just because he developed a taste for jazz and stopped caring about money.

  **Maya:** But you remember being you. You can trace the line. If I change my mind about jazz, I *know* I changed my mind. Grandma can't trace anything. She's not evolving, Ben. She's eroding. There's a difference between replacing a board and letting the wood rot until you have to patch it with something else.

  **Ben:** So because the change is tragic, it doesn't count as her?

  **Maya:** Because the change removed the *reason* for the rule. She said "no tube" because she was afraid of being a vegetable who didn't recognize anyone. She thought that state would be miserable. She thought she'd be suffering.

  **Ben:** She thought she'd lose her dignity.

  **Maya:** But she's not suffering. That's the thing that keeps me up. She's not sitting there thinking, "Oh god, I've lost my dignity." She doesn't know what dignity is anymore. She's just… present. If she could talk, right now, and you asked her, "Do you want to go?" she'd say no. She'd hold your hand and say no.

  **Ben:** But she can't understand the question. That's the whole point of the directive. It's for when she *can't* answer.

  **Maya:** It's for when she can't answer *rationally*. But what if "rationally" is the wrong metric? What if being happy in the moment is the only thing that's left, and we take that away because a ghost from twelve years ago told us to?

  **Ben:** It's not a ghost. It's her. It's the only time she ever spoke about this without confusion. If we feed her, we're keeping her alive against her own orders. We're saying, "We know what you want better than you did when you were sane."

  **Maya:** I'm saying the "you" that wanted that is gone. Look, imagine I write a note today: "If I ever become a devout religious person, don't let me go to church." Because right now, I'm an atheist and I hate the idea. But then I get brain damage, or I just change, and I become devout. I find God. I love church. It makes me happy. Do you enforce the note? Do you drag me out of the pew because Past-Maya said so?

  **Ben:** That's different. Beliefs change.

  **Maya:** Why?

  **Ben:** Because… because *you're* still the one believing them. Even if it's new.

  **Maya:** But if the brain damage is what caused it? If the thing that makes me "me" is gone, and something else filled the gap?

  **Ben:** You're circling back to the tenant thing. I just don't buy that we're that disposable. That we can just die and be replaced by a new person in the same skin. It feels like… it feels like we're saying her life doesn't matter unless it matters *to her right now*. But a life has a shape, Maya. The whole shape. The beginning, the middle, the end. She wanted the end to look a certain way.

  **Maya:** She wanted the end to look a certain way because she thought the alternative was hell. She didn't know the alternative could be… this. Quiet. She didn't know she could be happy without knowing her own name.

  **Ben:** So we punish her for being optimistic about her own decline?

  **Maya:** No. We forgive her for being wrong.

  *Silence. Ben picks up the paper, folds it, unfolds it.*

  **Ben:** If we ignore this… where does it stop? If she gets pneumonia next month, do we treat it? She didn't want extreme measures.

  **Maya:** Pneumonia hurts. Pudding doesn't.

  **Ben:** It's a slippery slope. If we say the paper is void because she's "happy," then the paper is void for everything. Then we're just making guesses.

  **Maya:** We're always making guesses, Ben. That's the dirty secret. We're guessing what she'd want. I'm guessing she'd want to stay for the pudding. You're guessing she'd want to leave before she forgot us.

  **Ben:** I'm not guessing. I'm reading.

  **Maya:** You're reading a map for a city that doesn't exist anymore.

  **Ben:** Maybe. But it's the only map we have. If we throw it away, we're navigating by… what? By how cute she looks with pudding on her face?

  **Maya:** By the fact that she's breathing and she's not in pain.

  **Ben:** She's not in pain *now*.

  **Maya:** And she might not be ever.

  **Ben:** Or she might wake up one day terrified, trapped in a body that won't work, screaming for a release we promised her.

  *Maya looks at the boxes. She picks up a small framed photo of Grandma from years ago—sharp eyes, suit jacket.*

  **Maya:** She looks so serious in this.

  **Ben:** She was serious.

  **Maya:** I know. I just… I can't kill the lady in the bedroom to satisfy the lady in the photo.

  **Ben:** And I can't let the lady in the bedroom humiliate the lady in the photo.

  *They sit there for a moment. The fridge hums. Outside, a car drives past.*

  **Maya:** Do you think… do you think if we changed a little bit every day, like you said? If I lost a memory a day, would I notice?

  **Ben:** Probably not.

  **Maya:** So at what point am I a stranger to myself?

  **Ben:** I don't know. Maybe you never are. Maybe the stranger is still you, just… broken.

  **Maya:** Maybe.

  *Ben slides the paper across the table toward Maya. He doesn't let go of his end.*

  **Ben:** If we keep her, we own that. Every day. If she gets sick, if she cries, if she gets scared. That's on us.

  **Maya:** If we don't… that's on us too.

  **Ben:** Yeah.

  *Maya puts her hand on the paper, over his.*

  **Maya:** I just hate that the map doesn't match the terrain.

  **Ben:** I know. But we still have to walk it.

  *They don't move for a long time. The sun goes down.*
