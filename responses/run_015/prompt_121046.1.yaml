      *   **Topic:** Comparison of two formulations of the "paradox of phenomenal judgment" (the problem epiphenomenalists face explaining how they know/judge about their own qualia).
      *   **Formulation 1: Causal-Contact (CC).** Focus: Evidential/Epistemic. Problem: No causal link between quale and judgment. Reply: Common cause (neural state causes both).
      *   **Formulation 2: Reference-Fixing (RF).** Focus: Semantic. Problem: Reference is fixed by causal regulation. If quale doesn't regulate use, term refers to neural state, not quale. Reply: Common cause fails because the question (about qualia) can't be formulated.
      *   **Tasks:**
          1.  Distinctness/Reducibility: Are they distinct? What does each establish that the other doesn't?
          2.  Difficulty & Scope: Which is harder for the epiphenomenalist? Which attacks a wider range of views?
          3.  Generalization: CC vs. abstract objects (Benacerraf problem). RF vs. ? Is generalization a reductio or resource?
          4.  Qualia Drift Case: Analyze the "drift" scenario (N fixed, qualia change, judgments fixed). How do CC and RF handle it? Does it change the verdict from (2)?
          5.  Conclusion: Which is deeper? Strongest remaining move for the epiphenomenalist.

  2.  **Analyze Formulation 1: Causal-Contact (CC)**

      *   *Core:* Knowledge requires causal contact (or reliable connection). Epiphenomenalism severs the link from Qualia $\to$ Judgment.
      *   *Threat:* Skepticism about knowledge of qualia. The epiphenomenalist claims to *know* she has qualia, but her theory says she can't.
      *   *Standard Reply:* The "Common Cause" strategy (e.g., Frank Jackson, William Robinson). Neural state $N$ causes Qualia $Q$ and Judgment $J$. $J$ is about $Q$ because $N$ carries information about $Q$ (via nomological supervenience). Reliability is preserved.
      *   *Nature:* Epistemological.

  3.  **Analyze Formulation 2: Reference-Fixing (RF)**

      *   *Core:* Reference is fixed by causal interaction/regulation (Causal Theory of Reference). If $Q$ doesn't affect usage of term "pain", "pain" doesn't refer to $Q$.
      *   *Threat:* Incoherence/Meaninglessness. The epiphenomenalist cannot even *state* her theory. She thinks she's saying "Qualia exist but do nothing," but she's actually saying "Neural states exist but do nothing" (which is false) or something else.
      *   *Standard Reply:* Much harder. The Common Cause reply assumes reference is already secured. RF says reference *isn't* secured to the quale.
      *   *Nature:* Semantic/Metaphysical.

  4.  **Drafting Section 1: Distinctness/Reducibility**

      *   Are they distinct? Yes.
      *   CC allows knowledge *if* reliability is maintained via common cause. It accepts the judgment exists and asks if it counts as knowledge.
      *   RF attacks the content of the judgment itself. It asks: What are you talking about?
      *   Reducibility? RF seems stronger/deeper. If RF holds, CC is moot (you can't have knowledge of X if you aren't thinking about X). But CC could hold while RF fails (maybe reference is descriptive, not causal, so RF fails, but CC still worries about how we know the description is satisfied).
      *   *Key Distinction:* CC worries about *justification/warrant*. RF worries about *content/meaning*.
      *   *What each establishes:* CC establishes the epiphenomenalist is unjustified (skepticism). RF establishes the epiphenomenalist is unintelligible (incoherence).

  5.  **Drafting Section 2: Difficulty & Scope**

      *   *Harder Problem:* RF is harder. The Common Cause reply works well for CC (reliabilism). It works poorly for RF because causal theories of reference specifically demand the object *itself* play a role in fixing reference, not just a common cause. If the quale is truly inert, it drops out of the semantic chain entirely.
      *   *Wider Scope:*
          *   CC applies to any view where the object of knowledge is causally isolated (Abstract Platonism).
          *   RF applies to any view relying on Causal Theory of Reference (CRT) where the referent is causally inert. This includes Platonism too, but also Twin-Earth style externalism.
          *   However, RF is particularly devastating to *Epiphenomenalism* because Epiphenomenalism posits the existence of the entity *within* the subject's mind, making the failure of reference internal and immediate.
          *   Actually, CC is the one that generalizes famously (Benacerraf). RF generalizes to any causal theory of reference facing inert objects.
          *   Which tells against a wider range of views? CC is a general skeptical challenge. RF is a specific semantic challenge. But RF kills the *formulation* of the view, which is more restrictive but deadly. Let's argue RF is harder for the epiphenomenalist specifically, but CC has broader philosophical application (math).

  6.  **Drafting Section 3: Generalization (Abstract Objects)**

      *   *CC & Math:* This is the Benacerraf Problem. If numbers are abstract/causally inert, how do we know them?
      *   *Reductio or Resource?* If CC is sound, Platonism is in trouble. Epiphenomenalist can exploit this: "If you accept Platonism, you must accept my common-cause reply (or similar structural account)." Or, "If you reject my view for this reason, you must reject math." It's a *tu quoque*.
      *   *RF & Math:* Does RF generalize? Yes, to Causal Theories of Reference regarding abstracta. If reference requires causal contact, we can't refer to numbers.
      *   *Difference:* Many philosophers reject Causal Theory of Reference for math (descriptivism). But for *phenomenal concepts*, descriptivism is harder (what is the description? "The feeling of..." begs the question).
      *   *Resource:* Epiphenomenalist can argue that phenomenal concepts are like mathematical concepts (acquaintance or descriptivist), bypassing causal constraints.

  7.  **Drafting Section 4: Qualia Drift**

      *   *Scenario:* Neural state $N$ fixed. Behavior/Judgment fixed. Qualia $Q_1 \to Q_2 \to Q_3$.
      *   *CC Analysis:* The judgment "I am in pain" is caused by $N$. $N$ is reliably correlated with $Q_1$ (initially). Later, $N$ correlates with $Q_2$. The Common Cause reply relies on the *current* nomic link. If the link breaks or drifts, does knowledge persist?
          *   If the link is broken (N no longer tracks Q), the Common Cause reply says knowledge is lost.
          *   But in Drift, the subject *says* the same thing.
          *   CC predicts: The subject's judgment becomes false or unjustified once the drift occurs, because the reliability condition is violated (N no longer indicates Pain-Quale).
      *   *RF Analysis:* Reference is fixed by causal regulation. $N$ regulates the use of "pain". $Q$ does not. Therefore, "pain" refers to $N$.
          *   In the Drift case, "pain" *always* referred to $N$.
          *   So when the subject says "I am in pain," she means "I am in state N".
          *   Since $N$ persists, her judgment remains *true*.
          *   RF predicts: The subject's judgment remains true throughout the drift, but she is talking about $N$, not the qualia. She fails to notice the drift because she isn't talking about the qualia.
      *   *Discrimination:* This discriminates sharply. CC says knowledge is threatened/lost (skepticism). RF says reference shifts/stabilizes on the physical (error theory about what she's talking about).
      *   *Verdict Survival:* RF remains the harder problem. CC allows the epiphenomenalist to say "I know I have qualia" (via common cause). RF forces her to say "I thought I was talking about qualia, but I was talking about neurons." That undermines the theory itself.

  8.  **Drafting Conclusion: Depth and Strongest Move**

      *   *Deeper Objection:* RF. It attacks the possibility of stating the theory, not just knowing it.
      *   *Strongest Move:* Reject the Causal Theory of Reference for phenomenal concepts. Argue for a *phenomenal concept strategy* (e.g., Papineau, Loar). Phenomenal concepts refer via "constitution" or "acquaintance" rather than causal tracking. The concept *contains* or is *made of* the quale (or a direct recognition of it), bypassing the need for the quale to cause the judgment in a causal-chain sense. Or, argue for a Descriptivist account where the description is satisfied by the intrinsic nature.
      *   *Wait, check:* If the concept is constituted by the quale, does the quale cause the judgment? In the "constitution" view, the experience itself is the vehicle of the thought. This challenges the strict separation in epiphenomenalism.
      *   *Better Move:* Argue that the Causal Theory of Reference is simply false for internal, subjective states. Reference can be fixed by *ostension* where the ostended object is present to consciousness, even if it doesn't push physical buttons. The "presence" fixes reference, not the "push".

  9.  **Refining and Polishing:**

      *   Ensure the distinction between Epistemic (CC) and Semantic (RF) is sharp.
      *   Make sure the "Qualia Drift" analysis is precise.
      *   Check the "Wider Range" argument. CC hits Platonism. RF hits Causal Reference + Inert objects. CC is more famous, but RF is more lethal to *this specific view*.
      *   Tone: Careful, philosophical, analytical.

      *(Self-Correction during drafting)*: In the Drift case, for CC, does the judgment become false? If $N$ causes "Pain" and $N$ is present, but $Q_{pain}$ is gone, is the judgment "I have pain" false? Yes, if "pain" means the quale. The Common Cause reply says $J$ is about $Q$ because $N$ tracks $Q$. If $N$ stops tracking $Q$, $J$ is no longer about $Q$ (or is false).
      For RF, "Pain" refers to $N$ from the start. So "I have pain" means "I have N". This is true throughout. The subject is *wrong* that she is talking about qualia, but her sentence is true.
      This highlights RF's danger: It grants truth to the judgments but changes the subject, making epiphenomenalism inexpressible.

      *Strongest Move:* The "Phenomenal Concept Strategy" (PCS). This is the standard contemporary defense. It argues phenomenal concepts are unique. They refer directly, not via causal role. This blocks RF. Does it block CC? It helps CC by explaining the link (constitution).

      *Final check on order:* 1. Distinctness. 2. Difficulty/Scope. 3. Generalization. 4. Drift. 5. Conclusion.

