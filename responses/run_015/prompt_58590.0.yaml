answer: |-
  # Workshop Plan: The Dissonant Heart
  **Duration:** 90 Minutes
  **Participants:** 18 Adult Fiction Writers (3 Groups of 6)
  **Goal:** To expand the craft repertoire for rendering characters whose emotions contradict their avowed beliefs.
  **Materials:** Printed Case Cards (see below), paper, pens, timer, open space for standing.

  ---

  ## I. Preparation & Materials

  **Case Cards (Print 6 of each):**
  *   **Case A (The Cellist):** A musician sincerely believes her late husband was innocent of the betrayal she suspected. She has forgiven him in her mind. Yet, every evening at 5:00 PM, she is overtaken by a sharp grief tinged with anger, as if the betrayal were happening now.
  *   **Case B (The Hiker):** A hiker knows the glass walkway is engineered to hold fifty tons. She can explain the safety factors confidently. Yet, the moment her boot touches the glass, her legs lock, her breath stops, and she is paralyzed by terror.
  *   **Case C (The Juror):** A juror believes the defendant is morally contemptible and can argue this at length. Yet, when the defendant enters the room and looks at her, she feels physically flat, numb, and unmoved, as if accusing a mannequin.

  **Room Setup:**
  *   Three tables/clusters of chairs for the small groups.
  *   One open area in the center for the standing exercise.

  ---

  ## II. Facilitation Script & Timeline

  ### Phase 1: Introduction & Grouping (10 Minutes)
  *(Facilitator stands at the front. No theory is introduced.)*

  **Script:**
  "Welcome. We are here to solve a specific craft problem: How do we write characters who feel one thing but believe another? We often call this 'ambivalence' or 'repression,' but those are labels, not tools.

  Today, we are going to run three diagnostic tests on three specific characters. You will not be writing final draft prose. You are writing diagnostic notes to see where the character breaks.

  I am dividing you into three groups of six. Each group receives one Case Card. Do not swap cases. You will live with this character for the next hour."

  *(Distribute groups and Case Cards.)*

  ### Phase 2: The Cognitive Override (20 Minutes)
  **Theory Target:** Emotions as Evaluative Judgments.
  **Task:** Attempt to resolve the emotion by fixing the belief.

  **Script (Read Aloud):**
  "Open your notebooks. For the first fifteen minutes, I want you to write an internal monologue for your character. In this monologue, the character is arguing themselves out of the emotion using only logic and facts.

  *   **Cellist:** Argue why the anger is factually incorrect.
  *   **Hiker:** Argue why the fear is statistically impossible.
  *   **Juror:** Argue why the numbness is a failure of moral recognition.

  Make the argument as airtight as possible. Convince *yourself* as the writer that the emotion should vanish.

  For the last five minutes of this block: Stop writing. Sit perfectly still. Read your argument silently. Notice if your own body relaxes. If you feel resistance—a tightness, a skepticism, a 'yes but'—write down exactly where you feel that resistance physically."

  *(Facilitator keeps time. 15 mins writing, 5 mins silence/observation.)*

  ### Phase 3: The Somatic Reality (20 Minutes)
  **Theory Target:** Emotions as Patterns of Bodily Feeling/Readiness.
  **Task:** Attempt to resolve the emotion by changing the body, ignoring the belief.

  **Script (Read Aloud):**
  "Please stand up and move to the open space. Leave your notebooks on the chairs.

  We are going to test the body. I want you to physically embody the *conflict* of your character.
  *   **Cellist:** Stand as if you are forgiving him, but hold your fists clenched behind your back.
  *   **Hiker:** Stand as if you are safe on solid ground, but lock your knees and hold your breath.
  *   **Juror:** Stand as if you are judging a criminal, but go completely limp in the shoulders and jaw.

  Hold this posture for thirty seconds. Feel the exhaustion.

  Now, return to your seats. For the next fifteen minutes, rewrite the scene. This time, you are not allowed to use the character's thoughts or judgments. You can only describe the bodily sensations and the urges to act. Do not explain *why* they feel this way. Describe the *physics* of the feeling. The tightness, the freeze, the hollow chest. Ignore the logic completely."

  *(Facilitator keeps time. 5 mins standing/embodiment, 15 mins writing.)*

  ### Phase 4: The Perceptual Illusion (15 Minutes)
  **Theory Target:** Emotions as Perceptions of Value.
  **Task:** Describe the emotion as an external sensory fact that persists despite evidence.

  **Script (Read Aloud):**
  "For this final burst, we are changing the lens. Imagine the emotion is not inside the character, but is a quality of the world they are seeing, like a color or a sound.

  Write one paragraph where the character acknowledges their logic is correct, but insists their senses are reporting something else.
  *   **Cellist:** The room *looks* hostile, even if she knows it isn't.
  *   **Hiker:** The glass *looks* like it is cracking, even if she knows it is steel.
  *   **Juror:** The defendant *looks* like a void, even if she knows he is a man.

  Treat the emotion as an optical illusion that will not correct itself. Write the frustration of seeing something you know isn't there."

  *(Facilitator keeps time. 15 mins writing.)*

  ### Phase 5: Debrief & Theory Mapping (25 Minutes)
  **Theory Target:** Explicitly naming the three accounts and mapping the experience.

  **Script (Facilitator leads discussion):**
  "Put down your pens. Let's look at what happened.

  **1. The Judgment Trap (Phase 2)**
  "In Phase 2, I asked you to argue the emotion away. How many of you found that even when you wrote a perfect logical argument, the emotion in the scene didn't disappear?
  *(Wait for hands/nods)*
  "This maps to the **Judgment Theory** of emotion. This theory says emotion *is* a belief. If this were true, your Phase 2 writing should have solved the character's problem instantly. The fact that it felt false or difficult suggests that for your characters, emotion is *not* just a judgment."

  **2. The Body Truth (Phase 3)**
  "In Phase 3, you stood in contradictory postures. Did the physical tension make the logic feel irrelevant? When you wrote about the body, did the character feel more 'real'?
  "This maps to the **Somatic Theory**. This suggests emotion is a habit of the flesh. It explains why the Hiker freezes even when she knows the math. The body has its own memory that overrides the mind."

  **3. The Persistent Image (Phase 4)**
  "In Phase 4, you treated the emotion like a visual illusion. Did this allow you to keep the logic *and* keep the feeling without calling the character a liar?
  "This maps to the **Perception Theory**. This suggests emotion is like seeing color. You can know a square is white, but if a red light shines on it, you still *see* red. This allows your character to be honest about their fear while remaining rational."

  **Craft Takeaway:**
  "When you revise your novels, ask yourself: Which engine is driving this emotion?
  *   If it's **Judgment**, change the mind to change the heart.
  *   If it's **Somatic**, change the breath or posture to change the heart.
  *   If it's **Perceptual**, let the character trust their senses over their stats.
  Most complex characters run on all three, which is why they are hard to fix."

  ---

  ## III. Candid Troubleshooting Note

  **What is likely to go wrong:**
  Writers are trained to value "truth" and "authenticity." In Phase 2 (The Cognitive Override), participants may resist writing the logical argument because it feels like "bad writing" (telling, not showing) or "inauthentic." They may feel they are failing the exercise if the character doesn't actually resolve the emotion.

  **How to handle it:**
  Reframe the resistance as *data*. If a writer says, "It feels fake when he argues himself out of it," validate that immediately. Say: "That resistance you feel? That is the exact friction we are studying. That is the gap between belief and emotion. Don't fix the fake feeling; write about the fake feeling." Remind them they are writing diagnostics, not prose.

  **Handling Abstraction Resistance:**
  If the group glazes over during the Debrief when you mention "Judgment Theory" or "Perception Theory," drop the labels immediately. Switch to craft language: "The Head Story vs. The Body Story vs. The Eye Story." The philosophical value is in the distinction, not the terminology.

  ---

  ## IV. Limitations Statement

  **What this activity cannot reproduce:**
  This exercise simulates the *writer's* struggle to conceptualize the character, not necessarily the *character's* lived psychological reality. The "Somatic" phase, for example, asks writers to *act* a posture for 30 seconds; real trauma or deep-seated emotional patterns are not resolved (or created) in 30 seconds.

  Furthermore, the activity treats the three theories as distinct tools. In reality, contemporary philosophy of mind often views these as intertwined (e.g., judgments trigger bodily responses which alter perception). The exercise artificially separates them to make the distinctions visible for craft purposes. The nuance of how these systems interact dynamically over time must be supplied by the group discussion and the writer's subsequent drafting, not the exercise itself.
