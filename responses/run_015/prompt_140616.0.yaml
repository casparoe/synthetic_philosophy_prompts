  **Case A**
  Districts Alpha and Beta are the only two weaving regions in 18th-century Bengal that satisfied the merchant guild's strict prerequisites for technology transfer: identical capital reserves, skilled labor pools, and local demand for fine muslin. Both received technical schematics for a new fly-shuttle mechanism from the guild at the same time. Alpha adopted the mechanism within a year, while Beta delayed for a decade. The explanation lies in their relational position regarding the regional river transport network: Alpha sits upstream of the primary dyeing centers, meaning any efficiency gain immediately reduces transport costs for finished goods bound for the port, whereas Beta is downstream, where efficiency gains are neutralized by higher siltation costs on outbound vessels. The adoption decision was driven not by internal capacity but by the marginal profit difference created by their shared logistical topology.

  **Case B**
  Districts Gamma and Delta are the only two weaving regions in 18th-century Bengal where the merchant guild's technology transfer produced divergent adoption outcomes despite identical capital reserves, skilled labor pools, and local demand for fine muslin. Both received technical schematics for a new fly-shuttle mechanism from the guild at the same time. Gamma adopted the mechanism within a year, while Delta delayed for a decade. The explanation lies in their relational position regarding the regional river transport network: Gamma sits upstream of the primary dyeing centers, meaning any efficiency gain immediately reduces transport costs for finished goods bound for the port, whereas Delta is downstream, where efficiency gains are neutralized by higher siltation costs on outbound vessels. The adoption decision was driven not by internal capacity but by the marginal profit difference created by their shared logistical topology.

  ***

  **Demonstration and Analysis**

  **The Contrastive Questions**
  *   **Case A:** Why did Alpha adopt the mechanism rather than Beta? (Foil: Beta)
  *   **Case B:** Why did Gamma adopt the mechanism rather than Delta? (Foil: Delta)

  **Running the Three-Part Test**

  *   **Case A (Well-Posed):**
      1.  *Common Comparison Class:* **Pass.** The class is "regions satisfying the guild's prerequisites." This is specifiable ex-ante, without knowing who adopted. Alpha and Beta are drawn from this pool based on inputs, not outputs.
      2.  *Non-Collapse:* **Pass.** The factor making them candidates (meeting prerequisites) is distinct from the explanatory factor (river topology). Being eligible did not guarantee adoption; the river position determined the variance.
      3.  *Grain Stability:* **Pass.** Redescribing the regions as "textile zones" or "production hubs" does not alter the upstream/downstream relational fact. The explanation holds across minor redescription.

  *   **Case B (Ill-Posed):**
      1.  *Common Comparison Class:* **Fail.** The class is "regions where outcomes diverged." This class cannot be specified without reference to which of them won (i.e., you must know the adoption history to identify the divergence). The selection is ex-post, conditioned on the phenomenon to be explained.
      2.  *Non-Collapse:* **Fail (Derivative).** Because the class is defined by the divergence, the explanatory factor (river topology) is implicitly tasked with explaining why the class exists at all, conflating the selection criterion with the causal mechanism.
      3.  *Grain Stability:* **Fail.** If we redescribe the regions as "all regions receiving schematics," the explanation might fail (perhaps other upstream regions didn't adopt due to war). The answer is an artifact of selecting only the divergent pair.

  **The Structural Feature**
  The differing feature is the **selection criterion for the comparison class**. Case A selects on *inputs* (ex-ante prerequisites); Case B selects on *outputs* (ex-post divergence). This is a structural defect of "selection on the dependent variable," disguised as historical narrative.

  **The Swap Test**
  *   **Import B to A:** If we rewrite Case A to say Alpha and Beta are "the only two regions where outcomes diverged," we break Case A. We no longer know if other eligible regions existed that did not diverge. If other upstream regions failed to adopt, the river explanation collapses. The question becomes tautological: "Why did these two diverge? Because they are the two that diverged."
  *   **Import A to B:** If we rewrite Case B to say Gamma and Delta are "the only two regions satisfying prerequisites," we repair Case B. The class is now fixed ex-ante. The river explanation can be tested against the full set of eligible regions, restoring the question's validity.

  **The Skeptic's Escape**
  A group member insisting all such questions are well-posed would argue: "In Case B, simply re-individuate the relata. The class isn't 'divergent regions,' it's 'all regions receiving schematics.' Gamma and Delta are just the salient members."
  *   **Critique:** This manoeuvre silently changes the subject. The original narrative framed Gamma and Delta as a unique pair defined by their contrast ("the only two... where... outcomes diverged"). Expanding the class admits that the original framing was misleading and transforms the question from a specific contrast ("Why Gamma rather than Delta?") to a general causal claim ("Why did river position correlate with adoption?"). It restores well-posedness only by abandoning the specific contrastive structure the narrative promised.

  **Application to Britain and Qing China**
  On my account, the question "Why Britain rather than Qing China?" is **ill-posed** as typically framed, failing Condition 1 (Common Comparison Class) and often Condition 2 (Non-Collapse).

  *   **Diagnosis:** Historians often define the comparison class retrospectively as "advanced agrarian economies circa 1750." However, this class is frequently curated *because* these two represent the winner and the most prominent non-winner. If the criteria for "advanced" are tweaked to ensure only Britain and China qualify, the class is defined by the outcome (industrialization potential), violating Condition 1. Furthermore, if the explanation cites factors (e.g., "coal accessibility" or "state fragmentation") that were unknown or considered irrelevant until the outcome was known, the factor making China a foil (it *looked* similar ex-ante) collapses into the factor explaining the loss (it *was* different ex-post), violating Condition 2.
  *   **The Repair:** The question is well-posed only after specifying an **ex-ante comparison class** independent of industrialization. For example: "Why did polities with >$2,000 GDP per capita and >10% urbanization in 1700 industrialize in Britain rather than in China?"
  *   **The Cost:** This repair costs the "Grand Narrative." It forces us to acknowledge other members of the class (e.g., Tokugawa Japan, Mughal India, Northern Italy) that must be accounted for. It prevents the question from being a binary duel between two civilizations and turns it into a statistical deviation within a broader set. We lose the dramatic tension of "The Great Divergence" as a singular historical mystery, gaining instead a tractable but less teleological causal analysis. The original question promised to explain *History*; the repaired question explains *variance*.
