          2.  *Incomparability:* A and B cannot be compared (no relation holds).
          3.  *Parity:* A and B are comparable but neither better nor equal (a fourth relation).
      *   User wants a *practical* theory for decision-making, not just metaphysics.
      *   Key constraints to address: Transitivity (money pump argument), Group dynamics, Temporal drift, Option value, Proxy choice.

