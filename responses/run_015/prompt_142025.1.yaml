answer: |-
  Here is the requirements specification for a decision theory capable of handling your committee's budget problem. I've written this as a functional spec: what the theory must *do*, not just what it says.

  ### Part 1: The Core Spec (Non-Negotiables)

  **1. Action Guidance**
  *   **Requirement:** The theory must output a procedure for choosing, not just a description of the problem. It cannot end at "this is difficult."
  *   **Case:** If the theory concludes "Robotics and Drama are incomparable," it must still tell you whether to flip a coin, deliberate more, or fund both partially. A theory that leaves you paralyzed is a broken tool.
  *   **Why:** You have a budget deadline. Philosophy that doesn't end in action is useless for a committee.

  **2. The Three-Way Distinction**
  *   **Requirement:** The theory must strictly distinguish between **Equality** (options are exactly equal in value), **Incomparability** (no common standard exists to compare them), and **Ignorance** (a standard exists, but you lack the data).
  *   **Case:**
      *   *Equality:* Two identical grants for $500. It doesn't matter which you pick; swapping them changes nothing.
      *   *Ignorance:* You don't know if the counseling program works. Once you get the data, the choice becomes easy.
      *   *Incomparability:* Robotics parts vs. Counseling. Even with perfect data, one serves technical excellence, the other serves mental health. There is no "super-unit" of value to measure both.
  *   **Why:** If you treat incomparable items as equal, you might think swapping them is neutral. But swapping Robotics for Counseling changes the *kind* of school you have. Treating them as equal erases that difference.

  **3. No Money Pumps (Consistency)**
  *   **Requirement:** The theory cannot allow **intransitive preferences**.
  *   **Definition:** *Transitivity* means if you prefer A to B, and B to C, you must prefer A to C. If you violate this, you can be "money pumped."
  *   **Case:** Imagine a bookie knows you prefer Robotics > Drama, Drama > Counseling, but Counseling > Robotics. They can trade you in circles, charging a small fee each time, leaving you with less money and the same starting option.
  *   **Why:** A theory that allows this makes you exploitable and irrational. Your budget decisions must stack up logically over time.

  ### Part 2: Your Specific Context Requirements

  **4. Group Coherence (The Committee Problem)**
  *   **Requirement:** The theory must explain how five different value systems aggregate into one decision without pretending the group is a single person.
  *   **Case:** You care about community, another member cares about prestige (Robotics), another about art (Drama). Is the "hard choice" happening inside each of you, or between you?
  *   **Why:** In a group, "incomparability" might just be conflict. If the theory treats group disagreement as individual confusion, it will try to "fix" members rather than negotiate. A valid theory must handle **plural agency** (many people acting as one body).

  **5. Drift Handling (The Four-Year Problem)**
  *   **Requirement:** The theory must account for how small, repeated choices shape long-term identity.
  *   **Case:** Choosing Robotics over Drama once is a budget line. Choosing it every year for four years makes you a STEM school, not an arts school.
  *   **Why:** A theory designed for one-off choices might say "pick either, they're incomparable." But if you pick Robotics every time because it's easier to justify, you've accidentally deleted the arts program. The theory must value **consistency of identity** over time.

  **6. Option Value (Keeping Doors Open)**
  *   **Requirement:** The theory must assign value to flexibility itself.
  *   **Case:** Buying cheaper lighting now lets you fund counseling later. Is "keeping options open" a value comparable to "good lighting"?
  *   **Why:** Sometimes the best choice is the one that doesn't commit you. If the theory forces a final verdict now, it might destroy value that could be captured later. It needs to tell you when delaying is rational vs. when it's just procrastination.

  **7. Proxy Authority (Choosing for Others)**
  *   **Requirement:** The theory must distinguish between choosing for yourself and choosing for someone else (like your brother).
  *   **Case:** You might value "happiness" for yourself but "opportunity" for your brother.
  *   **Why:** When choosing for others, you aren't just weighing values; you're weighing your authority to impose values. A theory that treats this like a normal choice ignores the ethical weight of speaking for someone else.

  ### Part 3: Non-Negotiable vs. Philosophical Taste

  **Non-Negotiable (The theory fails without these):**
  *   **Action Guidance:** If it doesn't help you decide, it's not a decision theory.
  *   **No Money Pumps:** If it allows cyclic preferences, it makes you vulnerable to exploitation.
  *   **The Three-Way Distinction:** If it collapses "equal" and "incomparable," it gives bad advice (swapping things that shouldn't be swapped).

  **Philosophical Taste (Debatable preferences):**
  *   **"There is a true fact of the matter":** Some theories say one option *is* better, you just can't see it. Others say there *is* no fact until you choose. This is metaphysics; both can work practically.
  *   **"Regret is irrational":** Some theories say if you chose rationally, you shouldn't regret it. Others say regret is a valid part of hard choices. This is about emotional hygiene, not logic.
  *   **"Identity matters":** Requirement #5 (Drift) assumes your school *should* have an identity. A purely economic theory might say "who cares what kind of school it is, just maximize utility." That's a value judgment, not a logical requirement.

  ### Part 4: The Bug Report (Incompatible Requirements)

  Here are the pairs of requirements that might break the system if you demand both strictly:

  *   **Group Coherence vs. No Money Pumps:** This is the biggest conflict. Mathematically, it is often impossible to aggregate individual rational preferences into a group preference without violating consistency (this is related to *Arrow's Impossibility Theorem*). If everyone is rational, the group might still end up with cyclic preferences (Money Pump risk). You may have to accept that the *committee* can be irrational even if the *members* are not.
  *   **Option Value vs. Action Guidance:** If you always value keeping options open (Requirement #6), you might never actually spend the budget. A theory that highly values flexibility can paralyze action. You have to set a threshold for when "deciding" becomes more valuable than "waiting."
  *   **Drift Handling vs. One-Off Rationality:** What is rational for this year's budget (maximize immediate impact) might be irrational for the four-year plan (maintain balance). A theory optimized for single choices will fail the Drift test. You have to decide if you are optimizing for *this meeting* or *this decade*.

  ### Part 5: The Knockout Punches

  **The "Everything is Comparable" View**
  *   *Claim:* If you think hard enough, you can find a common unit (like "happiness points") to compare Robotics and Counseling.
  *   *Knocked out by:* **The Three-Way Distinction.** This view forces you to treat fundamentally different kinds of value (technical skill vs. mental health) as if they are just different amounts of the same thing. It fails to explain why swapping them feels like a loss of identity rather than a neutral trade.

  **The "Neither is Better, So Pick Anything" View**
  *   *Claim:* If options are incomparable, rationality doesn't care which you pick.
  *   *Knocked out by:* **Drift Handling.** If you pick randomly every year because "neither is better," you might accidentally defund the arts entirely. Rationality must care about the pattern of choices, not just the single instance.

  **The "You're Just Confused" View**
  *   *Claim:* The hardness is just in your head; you actually know what you want.
  *   *Knocked out by:* **Group Coherence.** When five people disagree on fundamental priorities, the conflict isn't internal confusion—it's structural. A theory that says "just figure out what you really want" ignores the reality that five different "wants" are colliding.
