      *   *Ranking:*
          1.  Infant/Pig (1, 8) - Severe. Threatens the core normative structure.
          2.  Intuition/Theory (6, 7) - Moderate/High. Threatens stability/conviction.
          3.  Natural/Artificial (5, 6) - Moderate. Threatens consistency of obligation strength.

      *   *Confidence Levels:* Need to assign these throughout.
      *   *Least Certain:* Probably the interpretation of "basic moral status" in (8). It's ambiguous.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check (2) vs (1):* Does (2) contradict (1)? (2) says consciousness is the *fundamental boundary*. (1) uses rationality to split moral *treatment*. This is consistent *if* "moral consideration" means "counts at all" and (1) refers to "how much/what kind." I will classify this as the "False Conflict."
      *   *Check (8):* "Comparable basic moral status." If this means "both count," it's fine. If it means "both have rights," it clashes with (1). I need to highlight this ambiguity as the source of tension.
      *   *Check (6):* Is (6) actually required by (1) + (4)? Yes, classic negative utilitarianism logic.
      *   *Check (7):* This is an admission of inconsistency between theory and intuition. I need to frame this as a "Reflective Equilibrium" failure rather than a logical contradiction.

  6.  **Finalizing the Structure:**
