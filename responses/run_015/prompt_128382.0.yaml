      *(Self-Correction on Tension 2)*: (7) isn't a logical contradiction, it's a psychological one. I should frame it as a threat to the *stability* of the view, not its logical validity. However, in philosophy, persistent intuition often signals a missing premise. I will treat it as a "Coherence Tension."

      *(Refining the "False Conflict")*: (2) and (1) are the best candidates. (2) sets the *threshold* for entry into the moral community. (1) sets the *hierarchy* within it. This is a standard "capacity-based gradient" view. It holds up if defined carefully.

