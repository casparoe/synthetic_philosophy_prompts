      *   (3) *Factory Farming & Rights:* Oppose factory farming due to suffering (utilitarian). Deny animals Kantian rights (lack autonomy). Consistent with (1).
      *   (4) *Wild Animal Suffering (WAS):* Natural suffering is a moral problem; obligation to reduce if net positive.
      *   (5) *Natural vs. Artificial Distinction:* Stronger obligation to stop human-caused suffering than natural suffering.
      *   (6) *Techno-Fix:* If we can replace wild ecosystems with managed/virtual ones to reduce suffering, we *ought* to (Utilitarian imperative).
      *   (7) *Intuitive Resistance:* Hesitation about (6) feels wrong, but unjustified within the framework.
      *   (8) *Anti-Speciesism:* Conscious human infant vs. conscious adult pig = comparable basic moral status (based on consciousness, not rationality).

  3.  **Brainstorming Logical Dependencies & Hidden Tensions:**

      *   *(1) vs. (2):* (1) says rationality determines the *type* of respect (Kantian vs. Utilitarian). (2) says consciousness determines the *boundary* of moral consideration. These seem compatible initially (Consciousness gets you in the door; Rationality determines your rights status). *However*, (8) complicates this.
      *   *(1) vs. (8):* (1) says non-rational beings get utilitarian calculus. (8) says infant (non-rational) and pig (non-rational) have *comparable basic moral status*. If status is comparable, why does (1) imply a structural difference in *how* we value them? Usually, "Kantian respect" implies a higher lexical priority than "utilitarian calculus." If the infant is merely utilitarian, can we sacrifice the infant for the greater good? Most people say no. If the pig is merely utilitarian, we can. So (8) claims comparable status, but (1) + standard interpretation implies different treatment protocols. This is a major tension.
      *   *(2) vs. (1):* (2) says consciousness is the *fundamental* boundary. (1) introduces rationality as a fundamental divider of *moral kind*. Is rationality morally relevant if consciousness is the *fundamental* boundary? It can be, but it risks undermining the spirit of (2) if rationality grants "rights" that consciousness alone does not.
      *   *(4) vs. (5):* (4) says we have an obligation to reduce natural suffering. (5) says the obligation is *weaker* than for artificial suffering. These are compatible (strong vs. weak obligation), but (6) pushes (4) to its limit.
      *   *(4) + (1) -> (6):* If animals are utilitarian units (1) and natural suffering counts (4), then maximizing utility implies fixing nature (6). This logic is tight.
      *   *(6) vs. (7):* Explicit tension. Theoretical conclusion vs. Intuitive resistance. This is the "reflective equilibrium" problem.
      *   *(6) vs. (5):* (5) says natural obligations are weaker. (6) says we *ought* to replace nature if possible. If the obligation is weaker, does it rise to the level of an imperative to redesign ecosystems? (6) says "ought," (5) says "stronger elsewhere." This needs checking. If the utility gain in (6) is massive, utilitarianism overrides the "weaker obligation" caveat in (5).
      *   *(8) vs. (1):* This is the big one. If the infant and pig have comparable status, they should fall under the same normative regime. (1) puts non-rational animals in a utilitarian bucket. Does the infant go in the utilitarian bucket? If yes, infanticide for greater good is permissible (counter-intuitive). If no, then rationality isn't the only divider, or "basic moral status" in (8) is doing less work than it seems.

  4.  **Drafting the Audit - Step-by-Step:**

