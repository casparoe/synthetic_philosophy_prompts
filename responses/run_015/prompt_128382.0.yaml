      *   *Real Tensions:*
          1.  **The Infant/Pig Problem (1, 2, 8):** This is the severest. (8) claims comparable status. (1) assigns different normative frameworks based on rationality. Infants lack rationality. Pigs lack rationality. If they are comparable, they should share the framework. If the infant gets rights (Kantian) despite lacking rationality (to avoid infanticide implications), then (1) is false (rationality isn't the divider). If the infant gets Utilitarian calculus, (8) is technically true but morally explosive.
