prompt: |-
  hey so i just got into this long argumant with my friend about whether symbols ever literally push physical stuff around in the brain, not just metaphorically. im defending this idea from my own framework — the careenium — where mental representations are these entities called simmballs that are physically coupled to the substrate so they actually do causal work, not just syntactic dance. next tuesdy im presenting this to our philosophy of mind seminar group: mostly physicalists who love closure arguments and chinese-room-style skepticism, plus one cog-sci grad student who thinks neural nets explain everything, and someone who always brings up causal exclusion. i need you to act as an expert philosophy-of-mind debate coach. please think carefully, start with a quick brainstorm of what each of these people actually cares about, then draft my prep sheet for the Q&A. list about 7 objections in the order they'll come up, phrased exactly how they'd ask them in the room, ordered by how much damage each could do if i stumble. for each one: a two-minute reply, a note on where my reply is soft, what i should concede right away, and then identify the one question im hoping nobody asks — the killer one. also tell me what i should concede in my opening remarks so i dont look defensive. keep it practical and conversational; no citations or bibliographies needed, just strategic talk prep.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** A student/researcher defending a specific framework ("The Careenium," "Simmballs") where symbols *literally* push physical stuff in the brain (causal efficacy of mental representations).
