      *   **Nagarjuna's Tetralemma:** A logical tool to deconstruct inherent existence (*svabhava*).
          1.  $A$ (Binding exists inherently).
          2.  $\neg A$ (Binding does not exist inherently).
          3.  $A \land \neg A$ (Binding both exists and does not exist).
          4.  $\neg (A \lor \neg A)$ (Binding neither exists nor does not exist).
      *   **Non-dual Physicalism:** A view where the physical and phenomenal are not two distinct substances but also not reducible in a way that eliminates the phenomenal (like Russellian Monism or Neutral Monism, but framed through Madhyamaka).
