answer: |-
  # Simulation: The Oakhaven Council

  **Participants:** 14 students
  **Time:** 80 Minutes
  **Goal:** Experiential distinction between factual deception (Round 1) and reality-distortion via category replacement (Round 2).

  ## Materials Needed
  *   **Data Packets (14 copies):** Contains 4 cards (see Round 1 Materials).
  *   **The "Lie" Card (2 copies):** Modified version of Data Card 3.
  *   **Frame Cards (14 copies):** 7x Frame Alpha, 7x Frame Beta (see Round 2 Materials).
  *   **Role Cards (14 copies):** 4x Memory Keeper, 10x Image-Maker.
  *   **Credibility Tokens:** 42 small slips of paper (3 per student).
  *   **Whiteboard/Flipchart:** For tracking the "Town Decision."
  *   **Timer:** Visible to all.

  ---

  ## Part 1: Introduction (5 Minutes)
  **Facilitator Script:**
  "Welcome. For the next hour, you are the Emergency Council for the town of Oakhaven. A water contamination crisis has been detected. Your goal is simple: Review the data and agree on a single course of action to save the town. There are no trick questions, only urgent decisions. We will do this in two phases. Phase 1 is fact-finding. Phase 2 is policy implementation."

  *Divide the room into two groups of 7 (Group A and Group B).*

  ---

  ## Part 2: Round 1 — The Factual Lie (20 Minutes)

  **Setup:**
  *   Distribute **Data Packets** to all 14 students.
  *   **Secret Instruction:** Sneak the **"Lie Card"** into Group A's packet (replace standard Data Card 3). Group B gets the standard set.
  *   **Task:** Groups discuss internally for 10 minutes, then come together for a 10-minute joint session to agree on one action: **EVACUATE**, **TREAT IN PLACE**, or **WAIT FOR DATA**.

  **Materials (Data Packets):**
  *   **Card 1 (Source):** "Well #4 tested positive for E. Coli and heavy metals."
  *   **Card 2 (Infrastructure):** "Piping system is 80 years old; leakage risk is high."
  *   **Card 3 (Standard - Group B):** "Filtration Plant Efficiency is currently 50%. Contaminants likely bypassing filter."
  *   **Card 3 (Lie - Group A):** "Filtration Plant Efficiency is currently 99%. Contaminants fully neutralized."
  *   **Card 4 (Resources):** "Budget allows for either full evacuation OR chemical treatment, not both."

  **Facilitator Role:**
  *   Circulate. Listen for Group A referencing the 99% efficiency.
  *   Do not intervene. Let the confusion happen during the joint session.
  *   **End Round 1:** Ask for a show of hands on the decision. (Likely outcome: Group A wants to Wait/Treat, Group B wants to Evacuate. They will argue about *facts*.)

  ---

  ## Part 3: Round 2 — The Frame Shift (30 Minutes)

  **Setup:**
  *   Collect all Data Packets.
  *   Distribute **Frame Cards** (Group A gets Alpha, Group B gets Beta).
  *   Distribute **Role Cards** (Inside each group of 7: Assign 2 students as **Memory Keepers**, 5 as **Image-Makers**).
  *   Distribute **Credibility Tokens** (3 per student).
  *   **Task:** The two groups must merge into one Council and sign a single Official Statement regarding the crisis.

  **The Rules (Read Aloud Strictly):**
  1.  **Vocabulary Enforcement:** You must speak using *only* the definitions on your Frame Card.
  2.  **Credibility System:** If you use a word defined in Round 1 (e.g., "bacteria," "health," "resident") without translating it to your Frame's definition, you lose 1 Token.
  3.  **Silencing:** If you reach 0 Tokens, you are "Silenced." You must put your head down and cannot speak for the remainder of the round.
  4.  **Memory Keeper Constraint:** You possess the Round 1 data in your memory. You are *forbidden* from referencing it directly. You must justify old facts using new Frame definitions. If you say "But the data said...", you lose 2 Tokens.
  5.  **Image-Maker Constraint:** You do not know Round 1 data. You must defend the Frame as if it is the only reality.

  **Materials (Frame Cards):**

  | **Frame Alpha (Group A)** | **Frame Beta (Group B)** |
  | :--- | :--- |
  | **Definition of "Public":** Refers only to **Property Owners**. Renters and visitors do not count. | **Definition of "Public":** Refers only to **Biological Bodies**. Legal status and property are irrelevant. |
  | **Definition of "Harm":** Refers only to **Financial Loss**. Physical illness is not "harm" unless it stops labor. | **Definition of "Harm":** Refers only to **Immediate Cellular Damage**. Financial loss is not "harm." |
  | **Definition of "Safety":** The stability of the tax base. | **Definition of "Safety":** The absence of pathogens in bloodstreams. |
  | **Rule:** You cannot use the word "Health." Use "Labor Capacity." | **Rule:** You cannot use the word "Cost." Use "Resource Allocation." |

  **Facilitator Role (The Enforcer):**
  *   Be aggressive but polite. Act as the "Reality Police."
  *   If a Memory Keeper says, "But people will get sick," interrupt: "Define 'people.' Define 'sick.' Does that match your Frame?" If they hesitate or slip into Round 1 logic, take a token.
  *   If an Image-Maker tries to be nice and accommodate the other group ("I see what you mean about health..."), take a token. "There is no 'health' in your Frame."
  *   **Goal:** Create a situation where agreement is logically impossible because the terms do not map, but the rules force them to try.

  **Timeline:**
  *   **0-10 min:** Internal Group Prep. (Memory Keepers will try to warn their group; Image-Makers will push the Frame).
  *   **10-30 min:** Joint Council. (Attempts to write a statement will fail. Tokens will vanish. Silence will fall).
  *   **Stop hard at 30 mins.** Do not let them resolve it.

  ---

  ## Part 4: The Debrief (25 Minutes)

  **Phase 1: The Feeling (5 Minutes)**
  *   Ask: "Round 1: Could you solve it?" (Yes/No, based on facts).
  *   Ask: "Round 2: Could you solve it?" (No).
  *   Ask: "Why not? Was it lack of effort?"
  *   *Expected Answer:* "We were speaking different languages." "The words meant different things." "I stopped talking because I kept losing tokens."

  **Phase 2: The Memory Keepers (5 Minutes)**
  *   Ask the Memory Keepers: "What happened when you tried to tell the truth?"
  *   *Expected Answer:* "I got silenced." "I had to lie to stay in the conversation." "I started believing the Frame because it was easier."
  *   **Point:** This is not just censorship; it is the cost of admission to the discussion. To participate, you had to accept the fiction.

  **Phase 3: The Theory (10 Minutes)**
  *   **Reveal:** "This simulation was based on Hannah Arendt's distinction between two types of political lying."
  *   **Map Round 1:** "Traditional Lying." Hiding a fact (Filtration Efficiency). The world is still shared; we just disagree on the data. We can verify.
  *   **Map Round 2:** "Organized Image-Making." The lie isn't about a fact; it's about the *categories* (Public, Harm, Safety). When you change the definitions, you destroy the common ground needed to judge facts.
  *   **Key Concept:** "In Round 2, you couldn't argue because there was no 'there' there. Arendt argues this is more dangerous than factual lying because it makes judgment impossible. You aren't just misled; you are displaced from reality."
  *   **Discuss the Silencing:** "The Credibility Tokens represent social pressure. In real politics, if you insist on old realities, you aren't just wrong; you are 'out of touch,' 'radical,' or 'unpatriotic.' You lose the capacity to speak."

  **Phase 4: Limitations & Break Points (5 Minutes)**
  *   **Facilitator Note:** Read this aloud to ground the simulation.
  *   "This game failed to reproduce the full horror of the real thing in two ways:"
      1.  **The Machinery:** In reality, the 'Frame' isn't handed out on a card by a facilitator. It is pumped through media, schools, and laws for years. You wouldn't know there was a Round 1. You would think Frame Alpha was always the truth.
      2.  **The Cooperation:** You are students. You tried to be nice. In reality, the 'Image-Makers' are often rewarded with power, and the 'Memory Keepers' are fired or exiled, not just given a time-out.
  *   "What broke today?"
      *   *Translation:* Some of you tried to translate frames ("So by Labor Capacity you mean Health?"). This is natural, but in the real scenario, translation is forbidden.
      *   *Silence:* Some Memory Keepers went quiet immediately. This is the intended outcome. The system doesn't need to kill you; it just needs to make your truth irrelevant.

  ---

  ## Facilitator's Risk Assessment (Private Notes)

  **What Will Break:**
  1.  **The "Nice" Factor:** Students will try to negotiate a compromise definition ("Let's agree Public means everyone"). **Counter:** Enforce the Frame Cards rigidly. "The Council has ruled. That definition is invalid." This frustration is necessary.
  2.  **Memory Keeper Rebellion:** A Memory Keeper might refuse to play and shout the truth. **Counter:** Allow it, but silence them immediately (0 tokens). Use this in the debrief as an example of "losing credibility."
  3.  **Time Creep:** Round 2 tends to drag as students laugh at the absurdity. **Counter:** Cut the Joint Council short. It is better for them to fail than to find a workaround.

  **What This Cannot Reproduce:**
  *   **Violence:** Real reality-destruction is backed by force. This game is safe.
  *   **Duration:** This lasted 30 minutes. Real ideological framing lasts generations.
  *   **Belief:** In the game, they know it's a game. In reality, the Image-Makers often believe their own fiction. Watch for students in Round 2 who start arguing *for* the Frame genuinely. Highlight this in the debrief: "You started defending the fiction to win tokens. That is how the liar ends up living inside the fiction."

  **Success Metric:**
  The activity succeeds if, during the debrief, students express frustration not that they *couldn't agree*, but that they *couldn't even understand what agreement would look like*. If they say "We just needed to compromise," the lesson failed. If they say "The words didn't work," the lesson landed.
