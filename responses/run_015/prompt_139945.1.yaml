prompt: |-
  I came to philosophy late, after a career in experimental physics, and the literature on statues and street names strikes me as arguing the way my field did before anyone wrote down what a model had to do: each camp reasons from its own favourite case. Before I read further I want the specification. Please set out the desiderata an adequate theory of commemoration must meet, where commemoration covers the whole graded business of statues, plaques, street and building names, named fellowships, holidays and stamps, giving the case or consideration behind each requirement and marking which are non-negotiable and which are only the preferences of one side.

  Fix the purpose as follows: the theory is for guiding a city council that has to vote on one particular monument, and for telling a university what to do with a donor's name. The cases I would hold any list of requirements answerable to are these: the faded referent, where almost no one who uses a street name can attach it to a person, so that it is unclear whether anything is being commemorated; the posthumous discovery, where the disqualifying deed comes to light long after erection; the displaced erectors, where the monument was raised by a community that no longer lives in the city and is contested by the one that does; the deep past, where we preserve antiquities erected by slaveholders and conquerors as artefacts rather than honours, and the line between the two has to be drawn somewhere; the scoped monument, which names one deed while another deed of the same person is disqualifying; the menu of alternatives, since I want to know whether relocation to a museum, an added plaque, a counter-monument beside the original, and a sunset clause are genuinely distinct options or merely removal under another description; the exchange rate between denominations, since a bronze figure in a square and a name on a modest fellowship do not feel like the same moral act; the commemorative bargain, where the object was erected as part of a settlement between groups; and the dead hand, where the political community that erected it is not the one now living under it.

  Two further things matter more to me than coverage. First, which of the requirements people actually invoke are genuine desiderata and which are a camp's prejudice dressed as one. Second, whether any pair of the desiderata you defend is jointly unsatisfiable, and which single requirement does the most work in excluding the popular positions; if the list itself turns out to be the interesting result, say so plainly. In my old subject we asked of any proposed criterion whether it was discriminating at all, whether one could construct a case separating a theory that meets it from one that does not, so please discard or restate any requirement that every view satisfies trivially or none could. A sentence or two on how the main families of view score against the list is enough; the criteria are what I am paying for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Latecomer to philosophy, background in experimental physics. Values precision, specifications, desiderata, discriminating criteria, and avoiding trivialities. Dislikes arguing from favorite cases without a underlying model.
      *   **Task:** Set out the *desiderata* (requirements) for an adequate theory of commemoration.
      *   **Scope:** Statues, plaques, street/building names, fellowships, holidays, stamps (graded business).
      *   **Purpose:** Guiding a city council (vote on a monument) and a university (donor name).
      *   **Test Cases:** Faded referent, posthumous discovery, displaced erectors, deep past (artifact vs. honor), scoped monument, menu of alternatives (relocation, plaque, counter-monument, sunset), exchange rate (bronze vs. fellowship), commemorative bargain, dead hand (past political community).
      *   **Key Constraints:**
          *   Distinguish non-negotiable vs. preferences.
          *   Identify genuine desiderata vs. prejudice.
          *   Identify jointly unsatisfiable pairs (trade-offs).
          *   Identify the requirement that does the most work (excludes popular positions).
          *   Discard trivial criteria (satisfied by all or none).
          *   Brief scoring of main views against the list.
      *   **Tone:** Rigorous, analytical, structured like a technical specification or a scientific model definition.

  2.  **Deconstruct the Problem (Physics Analogy):**
      *   The user wants a "Standard Model" of commemoration.
      *   Current debate = "Pre-paradigmatic" (arguing from cases without agreed axioms).
      *   Goal = Define boundary conditions and conservation laws for moral status of public memory.
      *   Constraint Check = "Discriminating criteria." If a rule says "be good," it's useless. It must rule *something* out.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Moral Intuition):* "The person must be good." -> *Critique:* Too vague. What about "scoped monument"? What about "faded referent"? Trivial/Non-discriminating.
      *   *Attempt 2 (Democratic Will):* "The current majority must want it." -> *Critique:* Fails "dead hand" and "commemorative bargain" (minority rights/treaties).
      *   *Attempt 3 (Historical Accuracy):* "It must tell the truth." -> *Critique:* Fails "deep past" (artifacts aren't truth claims) and "menu of alternatives" (contextualization).
      *   *Attempt 4 (Functional/Teleological):* What is commemoration *for*?
          *   Is it honoring?
          *   Is it educating?
          *   Is it constituting political identity?
      *   *Selection:* I need criteria that force a choice between these functions.

      *   *Refining the List based on Test Cases:*
          1.  **Faded Referent:** Requires a criterion about *legibility* or *uptake*. If no one knows who it is, is it still a statue?
          2.  **Posthumous Discovery:** Requires a criterion about *temporal stability* vs. *moral revision*.
          3.  **Displaced Erectors/Dead Hand:** Requires a criterion about *political continuity* or *constituent power*. Who owns the past?
          4.  **Deep Past:** Requires a criterion distinguishing *honor* from *evidence*.
          5.  **Scoped Monument:** Requires a criterion about *holism* vs. *compartmentalization* of moral agency.
          6.  **Menu of Alternatives:** Requires a criterion about *spatial/semiotic context*. Is moving it changing its meaning?
          7.  **Exchange Rate:** Requires a criterion about *magnitude/salience*.
          8.  **Commemorative Bargain:** Requires a criterion about *contractual obligation* vs. *moral progress*.

  4.  **Developing the Specific Desiderata (The "Specification"):**

      *   *D1: The Legibility Condition.* (Addresses Faded Referent). Commemoration requires a minimum threshold of public recognition of the referent. If the link is broken, the function fails.
      *   *D2: The Moral Holism Constraint.* (Addresses Scoped Monument). You cannot honor a person without endorsing their moral totality *unless* explicitly scoped. (This is controversial/discriminating).
      *   *D3: The Political Continuity Principle.* (Addresses Dead Hand/Displaced Erectors). The current polity claims inheritance of the past polity's debts and assets.
      *   *D4: The Contextual Determinacy Rule.* (Addresses Menu of Alternatives/Deep Past). Meaning is a function of object + context. Moving changes meaning.
      *   *D5: The Salience Gradient.* (Addresses Exchange Rate). Higher visibility requires higher moral scrutiny.

  5.  **Filtering for "Discriminating" Power (The Physics Check):**
      *   "Be just" is trivial.
      *   "Respect history" is trivial.
      *   *D2 (Moral Holism)* is strong. It kills the "separate the art from the artist" or "just the one good deed" arguments unless a mechanism exists to scope it.
      *   *D3 (Political Continuity)* is strong. It kills the "that wasn't us" argument.
      *   *D4 (Contextual Determinacy)* is strong. It kills the "moving it preserves it unchanged" argument.

  6.  **Addressing the "Jointly Unsatisfiable" Requirement:**
      *   Tension between *Political Continuity* (we inherit the past) and *Moral Holism* (we reject the past's morals).
      *   Tension between *Legibility* (people need to know) and *Deep Past* (preserving artifacts people don't understand).
      *   *Key Conflict:* **Democratic Authorization vs. Historical Fidelity.** You can't satisfy the current majority's desire for a clean moral slate *and* preserve the historical record of a morally compromised founding.

  7.  **Addressing "Non-Negotiable vs. Preference":**
      *   Non-Negotiable: Contextual Determinacy (Semantics), Salience Gradient (Proportionality).
      *   Preference/Contested: Moral Holism (Some say we can compartmentalize), Political Continuity (Some say regimes break continuity).

  8.  **Addressing the "One Requirement that does the most work":**
      *   **Contextual Determinacy.** If meaning depends on context, then "relocation" is not neutral. It changes the truth value of the monument. This excludes the "just move it to a park" middle ground as a semantic equivalent.

  9.  **Scoring the Main Families:**
      *   *Preservationists:* Fail Moral Holism.
      *   *Removalists:* Fail Political Continuity (often).
      *   *Contextualizers:* Pass Contextual Determinacy, struggle with Salience Gradient.

  10. **Refining the Output Structure:**
      *   Introduction: Acknowledge the physics background (model-building).
      *   The Specification (The Desiderata).
      *   Classification (Non-negotiable vs. Contested).
      *   Incompatibilities (The Uncertainty Principle of Commemoration).
      *   The Discriminating Criterion (The "Workhorse").
      *   Model Scoring (Brief).

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Commemorative Bargain"? *Adjustment:* Need to ensure Political Continuity covers treaty obligations.
      *   *Check:* Did I address "Exchange Rate"? *Adjustment:* Ensure Salience Gradient covers the bronze vs. fellowship distinction.
      *   *Check:* Is the tone right? *Adjustment:* Use terms like "boundary condition," "state variable," "coupling." Avoid flowery philosophical prose.
      *   *Check:* Did I discard trivial criteria? *Adjustment:* Explicitly state why "Truth" or "Justice" alone are rejected as criteria.

  12. **Final Polish:** Ensure the distinction between *honorific* and *archival* functions is clear, as this maps to the "Deep Past" case. Ensure the "Dead Hand" problem is addressed via the continuity principle.

      *(Self-Correction on D2)*: Is Moral Holism too strong? Many theories allow partial honor. Let's frame it as the *Default Assumption* that can be overridden by explicit scoping. This makes it discriminating.
      *(Self-Correction on D4)*: Make sure to emphasize that relocation *is* re-contextualization, not neutral storage.

      *Final check on the "One Requirement":* Contextual Determinacy is good, but **The Honor/Archive Distinction** might be more fundamental. If you don't distinguish these, you can't solve "Deep Past." Let's make the *Functional Ambiguity* the core problem. Actually, the prompt asks for *one requirement* that excludes popular positions. **Contextual Determinacy** is best because it invalidates the "middle ground" compromise which is the most popular position.

      *Wait, one more thing:* The prompt asks for "which single requirement does the most work in excluding the popular positions." The popular position is often "Contextualize it" (add a plaque). If Contextual Determinacy says "Context *is* the meaning," then adding a plaque changes the meaning, it doesn't just fix it. But the *real* killer is **The Salience Gradient**. It prevents equating a statue with a fellowship. No, **Moral Holism** is the killer. It prevents "He did good things, keep the statue."
      Let's go with **The Semantic Coupling Principle (Contextual Determinacy)**. It rules out the idea that the object carries intrinsic meaning independent of placement.

      *Re-evaluating the "Jointly Unsatisfiable":* The tension between **Democratic Authorization** (current will) and **Historical Continuity** (past commitment). This is the "Dead Hand" vs "Current Majority" conflict.

      *Let's write.*
answer: |-
  This specification treats commemoration not as a moral intuition but as a system of public semiotics with political boundary conditions. To satisfy your constraint for discriminating power, I have discarded criteria that are merely aspirational (e.g., "be just," "tell the truth") because every theory claims them. Instead, these are structural constraints on how meaning is generated and sustained in public space.

  ### The Specification: Desiderata for a Theory of Commemoration

  **D1. The Semantic Coupling Principle (Non-Negotiable)**
  *   **Definition:** The meaning of a commemorative object is not intrinsic to the material but is a function of the object coupled with its context (location, accompanying text, surrounding architecture).
  *   **Case Addressed:** *Menu of Alternatives; Deep Past.*
  *   **Consideration:** Moving a statue from a civic square to a museum is not a neutral act of storage; it is a semantic operation that shifts the object from the category of *honor* to the category of *evidence*. Conversely, adding a plaque is not merely "adding context"; it alters the semantic value of the original object.
  *   **Discriminating Power:** Excludes the view that relocation is morally neutral preservation. It forces a choice: if you move it, you admit it no longer functions as an honor in that space.

  **D2. The Salience Gradient (Non-Negotiable)**
  *   **Definition:** The moral scrutiny required for a commemorative act scales proportionally with the public salience and permanence of the medium.
  *   **Case Addressed:** *Exchange Rate; Scoped Monument.*
  *   **Consideration:** A bronze figure in a main square imposes a narrative on all passersby (high salience); a named fellowship applies to a specific, opt-in group (low salience). They are not morally equivalent units.
  *   **Discriminating Power:** Excludes the "equivalence fallacy" where defenders argue, "If we remove the statue, we must remove the building name," or vice versa. It mandates a tiered response to moral failure.

  **D3. The Default Holism Constraint (Contested/Non-Negotiable Boundary)**
  *   **Definition:** In the absence of explicit scoping, public commemoration implies an endorsement of the subject's moral totality, not merely a specific deed.
  *   **Case Addressed:** *Scoped Monument; Posthumous Discovery.*
  *   **Consideration:** Public space is not a textbook footnote. Without explicit textual limitation (e.g., "For his donation of 1900"), the public reasonably infers general honor.
  *   **Discriminating Power:** Excludes the "compartmentalization defense" (e.g., "We honor his science, not his racism") unless the monument was explicitly scoped at erection. It places the burden of proof on the scoping, not the removal.

  **D4. The Political Continuity Principle (Contested)**
  *   **Definition:** The current political community inherits the obligations and artifacts of its predecessor regime unless a explicit constitutional rupture (revolution, regime change) has occurred.
  *   **Case Addressed:** *Dead Hand; Displaced Erectors; Commemorative Bargain.*
  *   **Consideration:** A city council is the legal successor to the council that erected the statue. "That wasn't us" is invalid unless the regime itself was illegitimate or overthrown.
  *   **Discriminating Power:** Excludes the "generational innocence" argument. It binds the current majority to the bargains (and errors) of the past, unless they invoke a revolution-level break.

  **D5. The Legibility Threshold (Non-Negotiable)**
  *   **Definition:** Commemoration requires a minimum threshold of public recognition of the referent. If the link between signifier (statue) and signified (person/deed) is severed by time, the object ceases to function as commemoration.
  *   **Case Addressed:** *Faded Referent.*
  *   **Consideration:** A street name no one can associate with a person is merely infrastructure, not memory. It creates no moral debt to preserve.
  *   **Discriminating Power:** Excludes the "preservation at all costs" argument for obscure figures. If the memory has naturally decayed, the state is not obligated to artificially sustain it.

  ---

  ### Analysis of the Specification

  #### 1. Genuine Desiderata vs. Prejudice
  *   **Genuine:** D1 (Semantic Coupling) and D2 (Salience Gradient) are functional requirements. Without them, you cannot distinguish a museum piece from a civic idol, nor a fellowship from a monument. These are structural truths about how public meaning works.
  *   **Prejudice/Contested:** D3 (Default Holism) and D4 (Political Continuity) are the battlegrounds.
      *   *Removalists* often violate D4 (claiming the past is a foreign country).
      *   *Preservationists* often violate D3 (claiming we can separate the man from the deed without explicit signage).
      *   **Verdict:** D3 is the stronger candidate for a non-negotiable rule because it aligns with how audiences actually receive signals. D4 is a political choice about regime legitimacy.

  #### 2. Jointly Unsatisfiable Pairs (The Uncertainty Principle)
  There is a fundamental tension between **D4 (Political Continuity)** and **Democratic Authorization** (the implicit desire of the current majority to define its own values).
  *   **The Conflict:** If you strictly enforce Continuity (D4), you bind the living to the moral blind spots of the dead (The *Dead Hand* problem). If you strictly enforce Current Democratic Will, you render all commemorative bargains unstable and subject to majority whim (The *Commemorative Bargain* problem).
  *   **Resolution:** A theory must prioritize one. Most stable theories prioritize D4 *unless* the past act violates the *current* constitutional fundamentals (e.g., equality), creating a "superseding clause."

  #### 3. The Requirement That Does The Most Work
  **D1: The Semantic Coupling Principle.**
  *   **Why:** This is the primary exclusionary criterion for the "Moderate/Compromise" position, which is the most popular view in current literature (i.e., "Keep the statue but add a plaque" or "Move it to a park").
  *   **Exclusionary Power:** D1 dictates that moving the object *changes its truth value*. Therefore, "relocation" is not a middle ground; it is a distinct moral act equivalent to downgrading the honor. It forces the council to admit that moving a statue to a museum is an admission that it no longer belongs in the civic pantheon. It collapses the "Menu of Alternatives" into a binary: *Honor (Square)* or *Archive (Museum)*. There is no stable intermediate state.

  #### 4. Scoring the Main Families of View

  | View | D1 (Coupling) | D2 (Salience) | D3 (Holism) | D4 (Continuity) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Preservationist** ("Leave it") | **Fail.** Ignores that context *is* meaning. | **Pass.** | **Fail.** Assumes compartmentalization without scope. | **Pass.** | **Unstable.** Relies on the audience misreading the signal. |
  | **Removalist** ("Tear it down") | **Pass.** Acknowledges meaning is broken. | **Pass.** | **Pass.** | **Fail.** Often violates continuity/bargain obligations. | **Robust,** but risks historical erasure if D4 is ignored. |
  | **Contextualist** ("Add a plaque") | **Fail.** Assumes meaning is additive rather than transformative. | **Pass.** | **Mixed.** Depends on plaque text. | **Pass.** | **Incoherent.** Tries to hold two semantic states at once. |
  | **Archival** ("Move to museum") | **Pass.** Shifts category explicitly. | **Pass.** | **Pass.** | **Pass.** | **Most Consistent.** Satisfies D1, D2, D3, D4 simultaneously. |

  ### Summary for the Council/University
  To vote consistently, you must accept **D1** and **D3** as hard constraints.
  1.  **For the City Council:** If the statue is in a square, it asserts holistic honor (D3). If the subject fails that standard, you cannot "fix" it with a plaque (violates D1). You must either re-scope the monument explicitly (change the object) or re-categorize it as archival (move it).
  2.  **For the University:** Apply the Salience Gradient (D2). A building name is high salience; a fellowship is low. A donor's disqualifying deed may require removal from the building (high salience) but retention on the fellowship (low salience) if the deed is unrelated to the fellowship's purpose.

  **The Model's Prediction:** Any theory that attempts to preserve the object *in situ* while negating its honorific meaning (the "Counter-Monument" or "Plaque" solution) is semantically unstable. It attempts to occupy two states in the same phase space. The system will resolve either by the public ignoring the plaque (reverting to Honor) or by removing the object (shifting to Archive).
