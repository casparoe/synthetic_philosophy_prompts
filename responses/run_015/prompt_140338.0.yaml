answer: |-
  # Preparation Sheet: Q&A Strategy
  **Workshop:** Metaphysics of Consciousness
  **Session:** 30-minute Q&A
  **Thesis:** Cosmopsychism's "decombination" advantage is illusory; Micropsychism offers better constraint on the scarcity of subjects.

  ---

  ## Part 1: The Two Pre-emptive Concessions
  *Do not wait for these to be raised. Integrate them into your closing remarks or the transition to Step 4.*

  **1. The "Metaphysical Undecidability" Concession (Target: Micropsychists)**
  *   **The Risk:** If you say the choice "cannot be settled on the metaphysical books" (Step 4), the Micropsychists will hear instrumentalism. They worry you are abandoning the ontological project.
  *   **What to Say Up Front:** "When I say the choice isn't settled 'on the metaphysical books,' I do not mean metaphysics is irrelevant. I mean that *a priori* mereology alone cannot decide between top-down and bottom-up priority. We need inference to the best explanation, where empirical constraint is a metaphysical virtue. I am not conceding the ontological stakes; I am arguing that ontological parsimony includes explanatory power over borderline cases."
  *   **Why:** This signals you are still doing metaphysics, just naturalized metaphysics. It prevents them from attacking you for abandoning the field.

  **2. The "Exclusion Postulate" Concession (Target: Neuroscientist)**
  *   **The Risk:** She will claim you've reinvented IIT's exclusion postulate. If you deny it, you look ignorant of the literature. If you admit it without qualification, you look unoriginal.
  *   **What to Say Up Front:** "My scarcity question bears a structural resemblance to IIT's exclusion postulate. However, IIT posits exclusion as an axiom of consciousness. My argument is that Micropsychism *earns* this axiom metaphysically, whereas Cosmopsychism must stipulate it. I am not discovering the postulate; I am arguing which metaphysical framework justifies it without ad hocery."
  *   **Why:** This turns a threat to originality into a demonstration of depth. You are providing the *grounding* for her *axiom*.

  ---

  ## Part 2: Eight Objections (Ordered by Damage)

  ### 1. The "Collapse" Objection
  *   **Who:** The Metaphysician (Committee Member)
  *   **The Objection:** "You argue that if the Cosmopsychist uses integration conditions to answer scarcity, the view collapses into Micropsychism. But why? If the Cosmic Subject is fundamental, and it *grounds* local subjects via integration, that is top-down determination, not bottom-up composition. You seem to define 'Micropsychism' as 'any view that uses integration,' which begs the question against the Cosmopsychist."
  *   **Your Reply:** "I concede the direction of grounding differs. But if the *distribution* of local subjects is fixed by integration conditions, the Cosmic Subject loses its explanatory role. It becomes a nomological dangler—a truthmaker that does no work in determining *where* experience occurs. If the integration conditions do all the work, we have Micropsychism with a redundant cosmic wrapper. The collapse is explanatory, not merely mereological."
  *   **Concede:** The grounding direction is distinct.
  *   **Hold:** The Cosmic Subject becomes explanatorily idle if integration does the work.
  *   **Soft Spot:** Defining "explanatory work" in a grounding context.

  ### 2. The "Exclusion" Objection
  *   **Who:** The Systems Neuroscientist (Committee Member)
  *   **The Objection:** "Your 'scarcity question' is just the exclusion postulate restated in metaphysical vocabulary. IIT already solves this: complexes exist where integrated information is maximized. You haven't found a new problem; you've just translated a solved engineering constraint into philosophy."
  *   **Your Reply:** "It is a friendly amendment to say IIT handles the *measurement*. But IIT doesn't tell us *why* exclusion holds metaphysically. Is it a brute fact? My paper argues that Micropsychism explains *why* exclusion holds (because subjects only bond where integration allows), while Cosmopsychism must stipulate it. I am offering the metaphysical justification for your postulate."
  *   **Concede:** IIT identifies the borders empirically.
  *   **Hold:** IIT does not justify the postulate metaphysically; Micropsychism does.
  *   **Soft Spot:** Whether IIT proponents care about metaphysical justification.

  ### 3. The "Given Away the Store" Objection
  *   **Who:** Micropsychist 1
  *   **The Objection:** "In Step 4, you say the choice depends on 'better-constrained verdicts.' If the metaphysics is undecidable, why prefer Micropsychism? You've reduced ontology to a tool for prediction. If Cosmopsychism predicts the same verdicts but offers a more elegant unity, haven't you conceded the real advantage to them?"
  *   **Your Reply:** "I am not reducing ontology to prediction. I am arguing that a metaphysics that allows *any* verdict (Cosmopsychism) is less virtuous than one that risks being wrong (Micropsychism). Unity is a virtue, but unconstrained flexibility is a vice. If Cosmopsychism can accommodate split-brain data without cost, it is too flexible to be true."
  *   **Concede:** Unity is a theoretical virtue.
  *   **Hold:** Empirical risk is a higher-order metaphysical virtue.
  *   **Soft Spot:** Arguing that "risk" is a truth-tracking virtue in metaphysics.

  ### 4. The "Modes vs. Parts" Objection
  *   **Who:** The Metaphysician
  *   **The Objection:** "You treat the scarcity question as if local subjects must be 'parts' of the cosmic subject. But most Cosmopsychists treat them as *modes* or *aspects*. Modes aren't countable in the same way parts are. Why should a modal view face a scarcity problem at all?"
  *   **Your Reply:** "Even if they are modes, we still ask why *these* modes are phenomenally salient. Why is the 'left foot + Eiffel Tower' mode not a subject? If the answer is 'because it lacks integration,' we are back to my Step 3: the Cosmic Subject isn't doing the work. The mode/part distinction doesn't dissolve the scarcity of *salient* experience."
  *   **Concede:** The mereology might be modal, not parthood.
  *   **Hold:** The scarcity of *salient subjects* remains unexplained by modality alone.
  *   **Soft Spot:** Whether "salience" is the right metric for subjecthood.

  ### 5. The "Straw Bonding" Objection
  *   **Who:** Micropsychist 2
  *   **The Objection:** "You claim Micropsychism has a 'standing answer' to scarcity via phenomenal bonding. But phenomenal bonding is notoriously vague. You're presenting our selection principle as more precise than it is to make Cosmopsychism look worse."
  *   **Your Reply:** "It is vague, but it is *principled* vagueness. It points to causal structures. Cosmopsychism's vagueness is *stipulative*—'these aspects count, those don't.' A view that points to physical structure, even imperfectly, is more constrained than a view that points to metaphysical fiat."
  *   **Concede:** Phenomenal bonding is not fully precise.
  *   **Hold:** It is structurally constrained; Cosmopsychist selection is not.
  *   **Soft Spot:** Defending the precision of current bonding theories.

  ### 6. The "Dissolution" Objection
  *   **Who:** The Illusionist
  *   **The Objection:** "Both views assume 'subjects' are robust entities that need counting. If subjecthood is a user-illusion, your scarcity question vanishes. Why spend 45 minutes debating how to count ghosts?"
  *   **Your Reply:** "Even if subjects are illusions, the *pattern* of the illusion is real. We still need to explain why the illusion of a unified subject appears here (in me) and not there (in my foot). My argument applies to the metaphysics of the *appearance* of subjects, which both realists and illusionists must account for."
  *   **Concede:** Subjecthood might be non-fundamental.
  *   **Hold:** The distribution of subject-appearances still requires explanation.
  *   **Soft Spot:** Whether illusionists accept "metaphysics of appearance."

  ### 7. The "Faint Subjects" Objection
  *   **Who:** Grad Student 1
  *   **The Objection:** "You assume scarcity means 'no subject.' But what if the Cosmopsychist says there *is* a subject in the foot + Eiffel Tower, it's just too faint to report? Then scarcity isn't a problem, it's a gradient."
  *   **Your Reply:** "If every arbitrary sum is a subject, the term 'subject' loses its explanatory power. It becomes co-extensive with 'matter.' A theory that says everything is a subject is indistinguishable from one that says nothing is, regarding prediction. We need scarcity to make the concept useful."
  *   **Concede:** Subjecthood might be graded.
  *   **Hold:** Unlimited subjecthood renders the concept explanatorily idle.
  *   **Soft Spot:** The claim that pan-subjectivism is indistinguishable from eliminativism.

  ### 8. The "What Changes Your Mind" Objection
  *   **Who:** Grad Student 2
  *   **The Objection:** "You say Micropsychism makes risky predictions. What specific finding would make you switch to Cosmopsychism? If you can't name it, isn't your preference just bias?"
  *   **Your Reply:** "If we found robust evidence of unified consciousness across causally disconnected systems—for example, entangled brains reporting shared qualia without information transfer—that would break the bonding principle. That would force us toward a non-local view like Cosmopsychism."
  *   **Concede:** My preference is defeasible.
  *   **Hold:** Non-local unity is the specific defeater.
  *   **Soft Spot:** Whether such evidence is even conceptually possible.

  ---

  ## Part 3: The "Hope Nobody Asks" Question
  *   **The Question:** "If the Cosmic Subject grounds the Local Subjects via a principle of integration, why isn't that just *top-down* causation rather than *bottom-up* micropsychism? What makes it 'quiet micropsychism' rather than 'robust cosmopsychism'?"
  *   **Who:** The Metaphysician or Neuroscientist (Both sit on your committee).
  *   **Why it is Dangerous:** This attacks the core distinction of Step 3. If the distinction between "Cosmopsychism with integration" and "Micropsychism" blurs, your thesis that one has an advantage over the other collapses. It suggests your taxonomy is unstable.
  *   **Strategy if Asked:** Do not get bogged down in definitions. Pivot to *explanatory priority*.
  *   **Draft Reply:** "The distinction lies in what does the explanatory heavy lifting. In Micropsychism, the micro-entities + integration *constitute* the macro. In Cosmopsychism, the Macro *permits* the micro. If integration conditions are required to specify the micro, the Macro is no longer the sole explanatory source. The 'top-down' label doesn't save the view if the 'bottom' structures determine the distribution."

  ---

  ## Part 4: Specific Advice on the Neuroscientist's Worry
  **Worry:** "My scarcity question is just the exclusion postulate restated in metaphysical vocabulary."

  **Verdict:** This is a **Threat to Originality** but a **Friendly Amendment to Plausibility**.
  *   **Threat:** If it's just IIT, why publish in metaphysics?
  *   **Friendly:** It means your intuition tracks serious science.

  **How to Answer:**
  " You are right that the *extension* of the two concepts overlaps. But the *intension* differs. IIT treats exclusion as a functional axiom: 'Systems exclude overlapping causes.' I am treating scarcity as an ontological cost: 'Subjects exclude overlapping existence.'
  If you accept my argument, you aren't just adopting IIT; you are adopting Micropsychism as the *ontological cost* of IIT. Cosmopsychists often try to co-opt IIT while denying Micropsychism. I am arguing they cannot have both. So, I am not reinventing the postulate; I am policing its metaphysical boundaries."

  **Why this works:** It positions you as a collaborator who clarifies the philosophical commitments of her science, rather than a philosopher trying to do her job. It protects your originality (you are doing the policing/grounding work) while validating her data.
