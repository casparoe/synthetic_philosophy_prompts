prompt: |-
  Next month I am defending a 45-minute paper at a two-day workshop on the metaphysics of consciousness, followed by half an hour of questions. What I want from you is a preparation sheet for that half hour: not a defense of the view, and not a bibliography or reading list — I have the literature. What I lack is a sense of what this particular room will do to the argument.

  The thesis: the usual reason for preferring cosmopsychism to micropsychism is bogus, and once the dialectic is described properly the advantage probably runs the other way.

  Both views agree that experience is not derived from the wholly non-experiential, and they disagree only about the direction of explanation. Micropsychism takes the fundamental entities to be subjects and faces the combination problem in its two familiar forms: how many subjects make one subject, and how micro-qualities could yield the macro-qualities we actually enjoy — the palette or quality-space version of the problem. Cosmopsychism takes the universe as a whole to be the one basic subject and ordinary subjects like us to be derivative: parts, aspects, limits, or local inflections of it. It is then said to face only the gentler decombination problem, on the grounds that dividing is metaphysically cheaper than composing, since a whole can be prior to its parts while parts cannot be prior to their whole.

  My argument has four steps. First, "decombination" conflates two questions: the partition question, why the cosmic subject manifests as these local subjects rather than some other partition of itself; and the scarcity question, why local subjects are so few — why arbitrary or gerrymandered regions of the cosmic subject, such as my left foot together with the Eiffel Tower, or the set of all currently awake humans, or the northern hemisphere of a single brain, do not constitute subjects of their own. Second, the micropsychist has a standing answer to scarcity ready to hand: phenomenal bonding is held to obtain only under conditions of causal and informational integration, so the view arrives with a selection principle, and in principle that principle is empirically checkable. Third, the cosmopsychist has no analogue. If local subjects are mere abstractions or aspects of the cosmic one, then scarcity is answered only by stipulating which abstractions count, and every non-stipulative answer I can construct either reintroduces integration conditions at the derivative level — in which case the cosmic subject is doing no work and the view has quietly become micropsychism with extra steps — or collapses into a quiet eliminativism about local subjects, which its defenders explicitly disavow. Fourth, so the choice between the two views cannot be settled on the metaphysical books at all; it has to be settled by which framework yields better-constrained verdicts about borderline cases: commissurotomy and hemispherectomy patients, disorders of consciousness, cortical organoids, late-gestation fetuses. And I claim micropsychism does better there too, because its selection principle at least generates risky predictions, whereas a commitment to one basic subject leaves cosmopsychism free to accommodate almost any pattern of verdicts.

  The room. Two sympathetic micropsychist panpsychists who speak in phenomenal-bonding vocabulary and who will worry that in step four I have given away the store by conceding that the metaphysical question is undecidable. A systems neuroscientist sympathetic to integrated information theory, who regards the combination problem as already largely dissolved by the exclusion postulate and has limited patience for unmeasurable metaphysics; she will talk in terms of complexes, integrated information, and causal borders. An illusionist-leaning philosopher of mind who thinks both views are expensive answers to a question that should have been dissolved rather than answered, and who will go for the framing rather than the steps. A metaphysician who works on grounding, composition, and mereological sums, and who will want to know what relation is supposed to hold between the cosmic subject and a local subject — identity, grounding, constitution, or something new — and whether my scarcity question is well posed at all rather than a pseudo-question generated by an un-precisified notion of a subject. And two unaligned graduate students in philosophy of cognitive science who mostly want to know what would change anyone's mind.

  What I would like: eight or so objections, ordered by expected damage rather than by likelihood alone, each tagged with the member of the room who raises it and phrased the way that person would actually phrase it. For each, a reply I could genuinely deliver in under two minutes, an explicit note on what I should concede and what I must hold, and a one-line flag on where the reply is softest. Tell me which two objections I should pre-empt by conceding them inside the talk rather than waiting for questions, and what I should say up front so that the concession does not read as retreat. Include as well the one question I should hope nobody asks — I would rather you identify it from the weak joints in my four steps than have me name it, though you should know that both the metaphysician and the neuroscientist sit on my committee.

  Finally, one specific worry: I expect the neuroscientist to say that my scarcity question is just the exclusion postulate restated in metaphysical vocabulary, and that I have reinvented something the theory already handles. Tell me whether that is a friendly amendment or a threat to the originality of the paper, and how to answer it in a way that works either way.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A preparation sheet for a 30-minute Q&A session following a 45-minute paper defense.
      *   **Topic:** Metaphysics of consciousness (Cosmopsychism vs. Micropsychism).
      *   **Thesis:** The standard advantage of cosmopsychism (avoiding the combination problem via "decombination") is bogus; micropsychism actually has the advantage regarding the "scarcity question" (why *these* subjects?) and empirical constraint.
      *   **Argument Structure:**
          1.  "Decomposition" conflates Partition and Scarcity.
          2.  Micropsychism has a selection principle (phenomenal bonding/integration).
          3.  Cosmopsychism lacks an analogue without collapsing into micropsychism or eliminativism.
          4.  Decision rests on empirical constraint/borderline cases (micropsychism wins).
      *   **The Room (Audience):**
          1.  Two sympathetic micropsychist panpsychists (phenomenal bonding vocabulary).
          2.  One systems neuroscientist (IIT sympathetic, exclusion postulate, impatient with unmeasurable metaphysics).
          3.  One illusionist-leaning philosopher (wants to dissolve the question).
          4.  One metaphysician (grounding, mereology, identity).
          5.  Two unaligned grad students (what changes minds?).
      *   **Deliverables:**
          *   ~8 objections (ordered by damage).
          *   Tagged by audience member.
          *   Phrased in their voice.
          *   Reply (< 2 mins).
          *   Concession vs. Hold note.
          *   Soft spot flag.
          *   Two objections to pre-empt in the talk (and how).
          *   One "Hope nobody asks" question (based on weak joints).
          *   Specific advice on the Neuroscientist's "Exclusion Postulate" worry (Friendly vs. Threat).

  2.  **Deconstruct the Argument's Weak Points:**
      *   *Step 1 (Partition/Scarcity):* Is the distinction real? Does cosmopsychism *need* to answer scarcity in the same way?
      *   *Step 2 (Micropsychist Selection):* Is phenomenal bonding actually empirically checkable? Or is it just as vague as cosmopsychist "aspects"?
      *   *Step 3 (Cosmopsychist Collapse):* Is the charge of "quiet micropsychism" fair? Can't cosmopsychism use grounding without integration?
      *   *Step 4 (Empirical Constraint):* This is the riskiest move. Claiming micropsychism makes *risky predictions* about commissurotomy/etc. might be overconfident. IIT (Neuroscientist) might claim *she* does the empirical work, not the metaphysics.
      *   *Metaphysical Coherence:* What *is* the relation between Cosmic and Local? If it's not parthood, what is it?
      *   *Illusionist:* Why care about either if experience isn't real/robust?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Metaphysician - High Damage):* The relation problem. If Cosmic grounds Local, why isn't Local just a mode? If it's a mode, scarcity is trivial (modes are cheap). If it's a part, you have the combination problem backwards.
      *   *Objection 2 (The Neuroscientist - High Damage):* The Exclusion Postulate. You're reinventing IIT's solution to scarcity. Your "metaphysical" scarcity is just physical integration.
      *   *Objection 3 (Micropsychist 1 - High Damage):* You concede metaphysics is undecidable (Step 4). If metaphysics doesn't decide it, why prefer micropsychism? You've undermined the ontological stakes.
      *   *Objection 4 (Illusionist - Medium Damage):* Why solve a fake problem? Both views assume robust subjects.
      *   *Objection 5 (Micropsychist 2 - Medium Damage):* Phenomenal bonding isn't just causal integration. You're straw-manning the selection principle.
      *   *Objection 6 (Grad Student 1 - Medium Damage):* What changes your mind? If micropsychism fails the empirical test, do you go cosmopsychist or eliminativist?
      *   *Objection 7 (Metaphysician/Neuro overlap - Medium Damage):* Is "Scarcity" even a problem? Maybe there *are* subjects in your foot + Eiffel tower, just very faint ones.
      *   *Objection 8 (Grad Student 2 - Low Damage):* Practical implication. Does this change ethics?

      *Refining for "Voice":*
      *   Metaphysician needs to talk about "grounding," "truthmakers," "identity."
      *   Neuroscientist needs to talk about "Phi," "causal borders," "exclusion."
      *   Micropsychists need to talk about "phenomenal bonding," "subjects of experience."
      *   Illusionist needs to talk about "user illusion," "folk psychology."

  4.  **Selecting the "Pre-empt" Concessions:**
      *   *Concession 1:* The Metaphysical Undecidability (Step 4). The Micropsychists will pounce on this. Better to frame it as "Metaphysics underdetermines, so we use inference to the best explanation" rather than "Metaphysics is useless."
      *   *Concession 2:* The Neuroscientist's Exclusion Point. Acknowledge the parallel. It protects originality by framing it as "metaphysical justification for the postulate" rather than "discovery of the postulate."

  5.  **Identifying the "Hope Nobody Asks" Question:**
      *   The weak joint is Step 3: The claim that Cosmopsychism *must* collapse into Micropsychism if it uses integration conditions.
      *   *The Question:* "If the Cosmic Subject grounds the Local Subjects via a principle of integration, why isn't that just *top-down* causation rather than *bottom-up* micropsychism? What makes it 'quiet micropsychism' rather than 'robust cosmopsychism'?"
      *   *Why it's dangerous:* It attacks the core distinction. If the distinction blurs, the paper loses its bite. The Metaphysician and Neuroscientist (committee members) will smell blood here regarding the definition of the views.

  6.  **Addressing the Specific Neuroscientist Worry (Exclusion Postulate):**
      *   *Is it a threat?* Yes, to originality.
      *   *Is it friendly?* Yes, to the argument's plausibility.
      *   *Strategy:* Frame the paper as providing the *metaphysical cost-benefit analysis* that IIT lacks. IIT posits exclusion; the paper argues *why* one view pays less for it than the other.

  7.  **Drafting the Content (incorporating constraints):**
      *   Keep replies tight (under 2 mins spoken).
      *   Ensure "Concede/Hold" is clear.
      *   Ensure "Soft Spot" is honest.

      *(Self-Correction during drafting)*: Make sure the Micropsychist objection about Step 4 is sharp. They worry I've "given away the store." I need to clarify that "undecidable a priori" doesn't mean "arbitrary."
      *(Self-Correction on Neuro)*: Ensure I don't sound like I'm claiming IIT is wrong, but that IIT *presupposes* a metaphysical stance that needs vetting.

  8.  **Final Review against constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   Tagged? Yes.
      *   Reply < 2 mins? Yes (word count check).
      *   Concede/Hold? Yes.
      *   Soft spot? Yes.
      *   2 Pre-empts? Yes.
      *   1 "Hope nobody asks"? Yes.
      *   Neuro specific advice? Yes.

  9.  **Final Polish:** Check tone. Needs to be professional, strategic, and ready for a high-stakes workshop. (Proceed to generate output).

  *(Note on Word Count for Replies)*: A 2-minute spoken reply is roughly 250-300 words. I will keep the drafted replies concise to ensure they fit the time limit comfortably.

  *(Note on "Hope Nobody Asks")*: I need to make sure this targets the *argument's* weakness, not just a hard question. The weakness is the definition of the view collapse in Step 3.

  *(Note on Pre-empts)*: The Step 4 "metaphysics is undecidable" point is crucial. If I don't frame it right, the Micropsychists think I'm an instrumentalist. The Neuroscientist's point is crucial for originality.

