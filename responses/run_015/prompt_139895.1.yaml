  # JOINT STATEMENT ON LIABILITY AND RESPONSIBILITY IN LEARNING-ENABLED SYSTEMS

  **Working Group on Autonomous Systems Liability**
  **Date:** October 26, 2023

  This document records the outcomes of an adversarial collaboration between the Gap Realist and the Attribution Sceptic positions regarding responsibility gaps in autonomous systems. The following sections delineate agreed premises, exact points of divergence, critical unresolved questions, and proposed empirical tests.

  ## 1. Agreed Claims

  The parties endorse the following claims as stipulated facts or shared conclusions derived from the case and findings provided.

  1.  **Absence of Individual Fault:** In the stipulated case, no individual human agent satisfies the conditions for blameworthy fault required for punitive damages or criminal sanctions under the current jurisdiction.
  2.  **Compensation Sufficiency:** The enterprise no-fault liability mechanism ensures the victim is fully compensated for economic and physical harm without requiring a finding of fault.
  3.  **Compensation Limitation:** While no-fault liability discharges the duty of compensation, it does not itself constitute a public marking of a wrong or the identification of a wrongdoer.
  4.  **Historical Precedent:** Organizational many-hands cases pre-dating autonomous systems have historically produced outcomes where serious harm occurs without any individual being appropriately blameworthy.
  5.  **Compensation-Blame Distinction:** The stipulated findings establish that lay moral judgment distinguishes between compensation and blame; the desire for blame persists even when victims are fully compensated.
  6.  **Artifact Insensitivity:** The stipulated findings establish that a substantial minority of lay judges continue to direct blame at the system itself even when informed it lacks intentions, beliefs, or capacity for punishment.
  7.  **Foresight Sensitivity:** The stipulated findings establish that lay blame attribution tracks counterfactual foresight (whether someone *could* have foreseen the risk) rather than actual foresight.
  8.  **Cost Insensitivity:** The stipulated findings establish that lay blame attribution does not vary with the cost of acquiring foresight (the adversarial audit) within the range of €60,000 to €6,000,000.

  ## 2. Disagreements Table

  The parties disagree on the normative interpretation of the agreed claims. The following table specifies the divergent formulations.

  | Issue | Gap Realist Formulation | Attribution Sceptic Formulation | Note on Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Residue** | The unmet demand for blame after compensation represents a genuine normative deficit that a legitimate legal practice ought to address. | The unmet demand for blame after compensation represents a psychological expectation that a rational legal practice is not obliged to satisfy. | **Genuine.** This is a conflict over whether folk morality provides normative data or merely psychological facts. |
  | **Many-Hands** | While many-hands cases exist, the opacity and speed of learning systems instantiate the gap with a frequency and structural inevitability that qualitatively changes the practice's legitimacy. | The structural logic of the gap is identical to prior many-hands cases; the technology changes the scale but not the normative category of the problem. | **Genuine.** This is a conflict over whether the technological mechanism creates a new moral category or merely scales an existing one. |
  | **Function of Blame** | Blame serves an expressive function independent of deterrence or compensation, marking a wrong that remains unmarked if no agent is identified. | Blame serves a regulatory function tied to agency and capacity; applying it where agency is absent or fault unproven undermines the concept's coherence. | **Genuine.** This is a conflict over the primary purpose of blame within a legal framework. |

  ## 3. Cruxes

  Three sub-questions determine the resolution of the disagreements above. Settling any one would significantly move at least one party's position.

  1.  **Normative Status of Residue:** Is the post-compensation desire for blame a normative claim justice must answer, or is it a sentiment policy may override once economic harm is remedied? If the former, the Realist wins; if the latter, the Sceptic wins.
  2.  **Interpretation of Foresight:** Does "could have foreseen" imply an ideal epistemic agent in the firm's position (making the firm liable for the €60,000 audit), or does it imply a reasonable-effort test about what a reasonable firm would have discovered given industry standards? If the former, the case collapses into ordinary negligence; if the latter, the gap remains.
  3.  **Technological Novelty:** Does the learning system's opacity create a *new* kind of many-hands problem, or merely scale an old one? If the opacity is qualitatively different from traditional bureaucratic diffusion, the Realist's claim of normative loss gains traction; if it is merely quantitative, the Sceptic's historical analogy holds.

  ## 4. Proposed Tests and Predictions

  For each crux, the parties propose a specific test, manipulation, or case extension. Both parties accept these tests as bearing on the crux, though they predict opposite outcomes.

  **Test for Crux 1 (Normative Status):**
  *   **Manipulation:** A vignette where the firm voluntarily issues a public apology admitting "system failure" without admitting legal fault or paying additional damages, contrasted with a vignette where a single engineer is falsely blamed and fired (scapegoating) to satisfy public outrage.
  *   **Gap Realist Prediction:** Respondents will reject the scapegoat even if it satisfies the expressive urge, proving the desire is for *correct* blame (normative), not just closure. They will accept the apology as partially discharging the debt.
  *   **Attribution Sceptic Prediction:** Respondents will accept the scapegoat if it provides emotional closure, proving the desire is merely for emotional resolution (psychological). They will view the apology as irrelevant PR without fault assignment.

  **Test for Crux 2 (Foresight):**
  *   **Manipulation:** A matched scenario where the audit cost is €60,000, but the firm is a non-profit operating at subsistence levels, contrasted with a wealthy corporation. Industry standard remains unchanged.
  *   **Gap Realist Prediction:** Blame ratings will remain high for both firms. The epistemic position ("could have known") is identical regardless of budget, implying a duty to know.
  *   **Attribution Sceptic Prediction:** Blame ratings will drop for the non-profit. Reasonable effort is constrained by resources; if the industry standard did not require the audit, the non-profit is not blameworthy for omitting it.

  **Test for Crux 3 (Technological Novelty):**
  *   **Manipulation:** A non-learning automated system (fixed code) fails due to an unanticipated interaction never tested, contrasted with the learning system case. All other facts (opacity, many-hands) are held constant.
  *   **Gap Realist Prediction:** Blame will be lower in the fixed code case. The learning system's ability to change its own policy without human review creates a unique agential gap that fixed code does not.
  *   **Attribution Sceptic Prediction:** Blame will be identical. The epistemic opacity regarding the specific failure mode is the same; the mechanism of code generation (learning vs. fixed) is morally irrelevant to the outcome.

  ## 5. Closing Statement

  This collaboration began with the question of whether autonomous systems generate responsibility gaps that require new legal doctrines. We conclude that the dispute is not about the facts of the case, nor about the adequacy of compensation for the victim. Both sides agree that the worker in the stipulated case is fully compensated and that no individual human is criminally liable.

  The divergence rests entirely on the function of the legal practice itself. The Gap Realist would count herself shown wrong if it were demonstrated that attempting to satisfy the residual desire for blame requires unjust practices, such as punishing the innocent or distorting the concept of agency to the point of incoherence. She maintains, however, that ignoring the residue risks eroding the community's trust in the legal system's ability to mark wrongs.

  The Attribution Sceptic would count himself shown wrong if it were demonstrated that ignoring the residual desire for blame causes systemic instability or social harm that outweighs the efficiency gains of strict liability. He maintains, however, that tracking folk psychological residues where no agency exists undermines the rationality of the law.

  We jointly regard the question of *economic* justice as dissolved. Both sides agree that enterprise liability successfully handles the distributive burden of harm. The remaining dispute is strictly about *expressive* justice: whether the law must mirror the retributive intuitions of the community even when those intuitions target no moral agent. Until the proposed tests are run, we recommend that regulators treat the responsibility gap not as a defect to be engineered away, but as a known feature of complex organizational systems, whether automated or human. The choice to address the expressive residue is a policy choice, not a logical necessity.
