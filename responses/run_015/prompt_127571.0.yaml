prompt: |-
  Write a dialogue between Maya and Leo, two engineers who disagree about what counts as the "same mechanism" for mechanistic anomaly detection. Maya thinks mechanistic sameness is just about the active causal structure—if the dependency graph among the parts that actually do work is isomorphic, its the same mechanism, even if one system is a classical signal pipeline and the other is a learned model. Leo thinks sameness is tied to the physical implementation: if theres a dormant "ghost stage" like an unused analog filter hardwired but electrically disconnected in one board, that breaks identity, and different substrates or architectures cant share a mechanism even when thier active graphs line up.

  Have them discuss three sensors: A (standard digital pipeline), B (same pipeline but with that disconnected ghost filter sitting on the board), and C (a totally different learned architecture whose active nodes form a graph isomorphic to A's). They should actually respond to each other—Maya needs to answer Leo's worry about hidden failure modes in dormant parts, and Leo needs to push back on her claim that substrate doesnt matter by pointing out that anomaly detection is specifically about catching deviations in physical behavior. No strawmen, both should sound smart. Write it casually, maybe miss a comma or two.
