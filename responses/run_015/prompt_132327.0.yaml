          2.  **Status Quo Bias:** Treating the attached patient as having a right that makes withdrawal "killing" rather than "reallocation" imports rights theory into DDE.
          3.  **Causal Structure:** In triage, is the death the *means* to saving the five? Or is the *resource* the means, and death a side effect? If I take the vent, I save 5. The vent is the means. The death is a consequence of taking the vent. The fellow argues death is the means to getting the vent. This is subtle. (If the patient didn't die, I couldn't have the vent).
      *   *Conclusion Validity:* The conclusion follows *if* you accept the premise that withdrawing life support from a stable patient is morally equivalent to active killing (Footbridge). But many secular utilitarians or even some DDE proponents might argue triage is a distinct category (duty to rescue vs. duty not to harm).

  8.  **Drafting the Response:**
