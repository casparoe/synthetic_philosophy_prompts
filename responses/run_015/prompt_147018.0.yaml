prompt: |-
  I coordinate a community advisory committee for a regional transit authority — fourteen volunteer members, one ninety-minute meeting a month, a staff analytics team that's genuinely good but has its own incentives, and an appointed board that can veto anything we recommend and is impatient with us. Proposals land on us constantly: fare restructuring, a bus lane, a fare-free pilot on two routes, cutting a late-night route that a neighborhood association hates, putting cameras on buses, an algorithmic scheduling tool that staff says will shave 8% off operating cost. Right now we lurch between two failure modes. Either the analysts show us a model and we rubber-stamp "the data says," or else we just take a straw vote and it becomes whoever showed up and complained loudest. I've been reading some Dewey — the bit where democracy isn't just a voting mechanism but a way of doing inquiry together, and where a policy is supposed to be treated as an experiment with consequences you actually go back and look at — and it felt like it was describing exactly our problem, but I can't figure out how to actually run it in a room. So: give me a procedure, something a facilitator can work through out loud in about twenty minutes per proposal, with a one-page version I can tape to my notebook. Triage questions in order, what counts as a good-enough answer to each, where the procedure just stops and says no, and where it explicitly hands the decision to a human because the question is one of values rather than facts. A few things I keep tripping on and want the procedure to handle, using whatever vocabulary works — I've been calling them my own names, don't feel obliged to keep them: the "shadow public," people who are definately affected but will never be in that room (night-shift workers, people currently priced off the system, the town next door that gets our parking spillover, riders who don't exist yet); the "feedback horizon," meaning whether the people who eat the costs find out and get to respond before the thing is locked in, or whether the bill comes due after the board that authorized it has turned over; "counterfactual visibility," whether the losers can even tell what they'd otherwise have had; and the fact that some decisions are just irreversible and therefore can't honestly be called experiments at all.

  Please apply it to three real-shaped cases so I can see it work. One: staff proposes replacing the flat fare with income-based discounted fares, and they have a revenue model. Two: the algorithmic scheduling tool, which the board already loves and which I wanted to propose as a one-year pilot on a single depot — my guess is your procedure is going to tell me something I don't want to hear about that one, and I want you to say it plainly rather than soften it. Three: the late-night route with dismal ridership that a well-organized neighborhood association wants gone. For that third one I especially need the "minimum we must do before we're allowed to vote" answer, and I need a sentence or two I can literally read out loud to the room when I have to tell fourteen people we're not voting today.

  And be honest at the end about what the procedure can't do. My worry is that anything built around testable consequences and reversible pilots will systematically favor decisions that are legible and quick to evaluate, and quietly push the slow, structural, hard-to-measure stuff — the kind of thing that probably matters most to the people who never show up — into the "not decidable by us" bucket. If that's a real flaw and not just me being paranoid, say so, and tell me what I'd have to add to catch those cases. Constraints worth knowing: my committee members have no statistics background and will not read a methodology appendix, staff will push back if the procedure lets us override their numbers on vibes alone, and whatever I hand the board has to be short enough to survive being skimmed.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Coordinator of a community advisory committee for a regional transit authority.
      *   **Context:** 14 volunteers, 90-min monthly meeting, skilled but incentivized staff analytics, impatient appointed board with veto power.
      *   **Problem:** Oscillates between "rubber-stamping data" and "loudest voice wins." Wants to implement a Deweyan democratic inquiry model (policy as experiment, consequences tracked).
      *   **Needs:**
          *   A 20-minute facilitation procedure per proposal.
          *   A one-page "cheat sheet" version.
          *   Triage questions in order with "good enough" answers.
          *   Stop conditions (when to say no/delay).
          *   Hand-off points (values vs. facts).
          *   Specific handling of: "Shadow Public" (unrepresented affected parties), "Feedback Horizon" (timing of consequences), "Counterfactual Visibility" (can losers see what they lost?), "Irreversibility."
          *   Application to three specific cases:
              1.  Income-based fares (revenue model exists).
              2.  Algorithmic scheduling tool (Board loves it, user wants pilot, expects hard truth).
              3.  Late-night route cut (low ridership, neighborhood wants it gone). Needs "minimum before voting" and a script for delaying the vote.
          *   Honest assessment of limitations (bias towards legible/quick metrics vs. slow/structural issues).
      *   **Constraints:** No stats background for members, staff pushback on "vibes," board needs concise output.

  2.  **Deconstruct the Philosophy (Deweyan Inquiry):**

      *   Democracy as associated living/inquiry.
      *   Policy as hypothesis.
      *   Consequences must be observable and attributable.
      *   Affected parties must have a voice (The "Shadow Public" problem).
      *   Reversibility is key for experimentation.

  3.  **Drafting the Procedure (The "20-Minute Inquiry Protocol"):**

      *   *Goal:* Move from "Is this true?" to "What happens if we do this, and who cares?"
      *   *Structure:* Needs to be linear, time-boxed, and decisive.
      *   *Phases:*
          1.  **Definition (5 mins):** What are we actually deciding?
          2.  **Consequence Mapping (5 mins):** Who wins, who loses, when? (Addressing Shadow Public & Feedback Horizon).
          3.  **Reversibility & Measurement (5 mins):** Can we undo it? How do we know it worked? (Addressing Irreversibility & Counterfactuals).
          4.  **Verdict (5 mins):** Recommend, Pilot, or Reject.

      *   *Refining the Questions:*
          *   Q1: Who is *not* here? (Shadow Public)
          *   Q2: When do they feel the pain/gain? (Feedback Horizon)
          *   Q3: Can we turn it off? (Irreversibility)
          *   Q4: What counts as failure? (Measurement)

      *   *Stop Conditions:* If Q3 is "No" (Irreversible) and Q1 is "High Impact on Shadow Public," stop. If Q4 is "We don't know," stop.

  4.  **Developing the One-Pager:**

      *   Needs to be visual, bold, and actionable.
      *   Columns for Time, Question, Pass/Fail criteria.
      *   Script snippets for the facilitator.

  5.  **Applying to the Three Cases:**

      *   *Case 1: Income-Based Fares.*
          *   *Challenge:* Revenue risk, privacy, administrative burden.
          *   *Shadow Public:* Low income non-riders (barriers to entry).
          *   *Reversibility:* Hard to undo once expectations are set.
          *   *Verdict:* Needs a pilot, not a full rollout. Measurement must include uptake rates, not just revenue.
      *   *Case 2: Algorithmic Scheduling.*
          *   *Challenge:* Board loves it, staff says 8% savings.
          *   *User's worry:* It might degrade service quality for reliability.
          *   *Hard Truth:* If the algorithm optimizes for cost, it *will* cut slack. A pilot is essential, but the Board might force full rollout.
          *   *Procedure Output:* The procedure will flag "Counterfactual Visibility" (drivers/riders can't see the better schedule they *didn't* get) and "Irreversibility" (labor contracts). It should demand a depot-level pilot with *service reliability* metrics, not just cost metrics.
      *   *Case 3: Late-Night Route Cut.*
          *   *Challenge:* Low ridership (data says cut) vs. Equity/Access (values say keep). Neighborhood association (organized) vs. Shadow Public (night workers).
          *   *Minimum before voting:* Must identify *who* uses it (survey/boarding counts) to represent the Shadow Public.
          *   *Script:* Needs to be firm. "We cannot vote on removing a lifeline until we know who holds it."

  6.  **Addressing the Limitations (The "Honest End"):**

      *   *The Flaw:* Yes, the user is right. This methodology favors "technocratic experimentalism." It struggles with structural justice, dignity, and long-term cultural shifts.
      *   *The Fix:* Need a "Values Veto" or a "Principle Check" at the start. Some things aren't experiments; they are rights.
      *   *Mitigation:* Explicitly name the "Shadow Public" as a voting bloc in the inquiry phase, even if they aren't in the room.

  7.  **Review and Refine:**

      *   *Tone:* Professional, pragmatic, slightly academic but grounded (matching the user's Dewey reference).
      *   *Constraints Check:* 20 mins? Yes. One-pager? Yes. Stats background? Minimized. Staff pushback? Addressed by focusing on *metrics definition* rather than *data calculation*. Board skim-ability? The output is a recommendation, not a thesis.
      *   *Specific Request:* "Tell me something I don't want to hear" on the Algorithm case. *Insight:* The procedure might reveal that a pilot is impossible because the system is all-or-nothing, or that the metrics staff chose hide the negative consequences. I need to be blunt that if the Board demands full rollout, the Committee's leverage is limited to defining *success metrics* that protect riders.
      *   *Specific Request:* Script for Case 3. Needs to be punchy.

  8.  **Final Polish:** Organize into clear sections: The Protocol, The One-Pager, The Case Studies, The Honest Limitation. (Self-Correction: Ensure the "One-Pager" is distinct and copy-pasteable).

  *(Self-Correction during drafting Case 2)*: The user suspects the procedure will tell them something they don't want to hear about the Algorithm. What is it? It's likely that *without* a pilot, the Committee has no ground to stand on. But if the Board insists on full rollout, the Committee's only power is to demand *monitoring*. The hard truth is: If the Board vetoes the pilot, the Committee must refuse to endorse the rollout *unless* specific rider-experience metrics are tied to the cost savings. Otherwise, they are rubber-stamping. I need to make sure the procedure forces a "No Recommendation" if the pilot is denied.

  *(Self-Correction during drafting Case 3)*: The "Minimum we must do." It's not just a survey. It's a *standing invitation* for those riders to speak, or a proxy. The script needs to shut down the loud neighborhood association without being rude.

  *(Refining the Limitation)*: The user's worry about "legible/quick" vs "slow/structural" is valid. Dewey knew this. The fix is to treat "Principles" as constraints on "Experiments."

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your constraints. It translates Deweyan inquiry into a 20-minute facilitation flow that respects staff expertise without surrendering to it, protects the "shadow public," and forces clarity on reversibility.

  ### The Protocol: The 20-Minute Inquiry Cycle

  **Goal:** Move from "Is the data right?" to "Is this a safe experiment?"
  **Time:** 20 Minutes per proposal (strict).
  **Facilitator Role:** You are not a voter; you are the guardian of the process.

  #### Phase 1: The Shadow Check (5 Minutes)
  **Question:** "Who is affected by this who is not in this room, and how do we know we've heard them?"
  *   **Good Enough Answer:** Staff identifies the specific demographic (e.g., "night shift workers," "unbanked riders") AND provides evidence of contact (survey, intercept data, partner org testimony).
  *   **Fail State:** "We assume riders care about X" or "The neighborhood association speaks for the area."
  *   **Action:** If Fail, the proposal moves to "Pending Outreach." No vote.

  #### Phase 2: The Horizon & Reversibility Check (5 Minutes)
  **Question:** "If this goes wrong, how long until we feel it, and can we turn it off?"
  *   **Good Enough Answer:** A specific date for review (Feedback Horizon) AND a defined "off-ramp" (Reversibility).
  *   **Fail State:** "We'll review it next budget cycle" (too long) or "Once implemented, we can't go back" (Irreversible).
  *   **Action:** If Irreversible + High Impact on Shadow Public, the Committee must recommend **Rejection** or **Pilot Only**. You cannot endorse an irreversible experiment on the whole system.

  #### Phase 3: The Metric Definition (5 Minutes)
  **Question:** "Staff says this saves money/improves speed. What metric proves it *didn't* hurt riders?"
  *   **Good Enough Answer:** A "Guardrail Metric." If Cost goes down, Reliability must stay within X%. If Revenue goes up, Ridership must not drop below Y%.
  *   **Fail State:** Relying solely on the staff's primary success metric (e.g., only Operating Cost).
  *   **Action:** If Staff refuses a Guardrail Metric, the Committee records "Dissent on Measurement" in the recommendation.

  #### Phase 4: The Verdict (5 Minutes)
  **Question:** "Based on the above, do we Recommend, Pilot, or Decline?"
  *   **Recommend:** Passes all checks.
  *   **Pilot:** Passes checks only if limited in scope/time.
  *   **Decline:** Fails Reversibility or Shadow Check.
  *   **Defer:** Fails Shadow Check (needs more outreach).

  ***

  ### The One-Pager (Tape this to your notebook)

  | **STEP** | **THE QUESTION (Read Aloud)** | **PASS CRITERIA** | **IF FAIL →** |
  | :--- | :--- | :--- | :--- |
  | **1. SHADOW** | "Who loses out who isn't here? How do we know?" | Specific group identified + Evidence of contact. | **DEFER.** Do not vote. Require outreach. |
  | **2. HORIZON** | "When do we check results? Can we undo it?" | Review date < 6 months. Clear "Off-Ramp." | **PILOT ONLY.** If irreversible, recommend No. |
  | **3. METRIC** | "What proves this didn't hurt service?" | One "Guardrail Metric" (e.g., On-time %, Complaints). | **NOTE DISSENT.** Record objection in minutes. |
  | **4. VERDICT** | "Recommend, Pilot, or Decline?" | Consensus on the *conditions*, not just the idea. | **MAJORITY VOTE.** Record split if needed. |

  **Facilitator Scripts:**
  *   *To Staff:* "We trust your model. We need to know how we'll know if it's wrong."
  *   *To Loud Public:* "You represent a constituency. We need to hear from the constituency that *doesn't* show up to meetings before we vote."
  *   *To Committee:* "We are not deciding if this is good. We are deciding if it is safe to test."

  ***

  ### Application to Your Three Cases

  #### Case 1: Income-Based Discounted Fares
  *   **The Setup:** Staff has a revenue model showing a 5% dip offset by ridership growth.
  *   **Running the Protocol:**
      *   **Shadow Check:** Staff identifies "low-income unbanked riders." *Fail:* They have no data on whether these people can actually verify income (ID barriers). *Fix:* Committee demands a 3-month "enrollment audit" before full rollout.
      *   **Horizon:** Revenue impact is immediate; ridership growth is slow. *Fix:* Review at 6 months, not 12.
      *   **Metric:** Staff focuses on Net Revenue. *Committee adds Guardrail:* "Enrollment Completion Rate." If people can't sign up, the policy fails even if revenue holds.
      *   **Verdict:** **Recommend with Conditions.** (Enrollment audit + 6-month review).
  *   **Why it works:** It accepts the policy but treats the *implementation* as the experiment. It protects the shadow public (those who can't navigate the bureaucracy) without blocking the equity goal.

  #### Case 2: The Algorithmic Scheduling Tool
  *   **The Setup:** Board loves it. Staff says 8% cost savings. You want a depot pilot.
  *   **The Hard Truth:** You asked me to be plain. The procedure will reveal that **you likely cannot stop the full rollout if the Board is determined.** However, it gives you leverage to change *how* it rolls out.
  *   **Running the Protocol:**
      *   **Shadow Check:** Drivers (schedule stress) and Transfer Riders (missed connections). *Fail:* Staff model optimizes for vehicle hours, not passenger wait time.
      *   **Reversibility:** *Critical Fail.* Once driver rosters are bid on based on the algorithm, you cannot revert easily without labor grievances. This is functionally irreversible after Month 1.
      *   **Metric:** Staff offers "Cost per Mile." *Committee demands Guardrail:* "Excess Wait Time" and "Driver Overtime due to schedule recovery."
      *   **Verdict:** **Pilot Required.**
  *   **The Conflict:** If the Board vetoes the pilot and demands system-wide implementation:
      *   The Protocol forces you to issue a **"Qualified Non-Endorsement."**
      *   *Statement:* "Because this is irreversible and lacks a control group, the Committee cannot validate the safety of this change. We recommend system-wide implementation *only if* the Board adopts [Guardrail Metrics] as binding triggers for suspension."
      *   *Why this hurts:* It forces you to admit you can't "experiment" your way out of a political decision. But it puts the liability for the metrics on the Board. If ridership tanks, you have the paper trail showing you demanded a pilot.

  #### Case 3: The Late-Night Route Cut
  *   **The Setup:** Dismal ridership data. Neighborhood Association (NIMBYs/Noise) wants it gone.
  *   **The "Minimum Before Voting" Answer:** You cannot vote on the *existence* of the route until you have enumerated the *users*. Data shows "20 riders/night." You need to know "Who are the 20?"
  *   **The Requirement:** Staff must conduct **intercept surveys** on that route for two weeks. Not a mailer. On the bus.
  *   **The Script (Read this when the Neighborhood Association pushes for a vote):**
      > "We hear the neighborhood's concern about noise and safety. But this committee's job is to represent the transit system, not just the land next to it. The data shows 20 people ride this bus. We do not know who they are, where they work, or if they have other options. Until we have spoken to at least ten of those twenty riders, voting to cut this route would be guessing. We are deferring this vote for 30 days to allow for on-board surveys. If those riders cannot be found, we will vote then."
  *   **Why it works:** It doesn't say "No." It says "Not yet." It shifts the burden of proof from the neighbors (who are loud) to the shadow public (who are silent). If the riders are found, the "dismal ridership" argument becomes a "vital lifeline" argument.

  ***

  ### The Honest Limitation (Read this carefully)

  You are right to be paranoid. This procedure has a structural bias.

  **The Flaw:** It favors **Technocratic Experimentalism.**
  By demanding "testable consequences," "review dates," and "guardrail metrics," you systematically privilege decisions that are legible to staff analytics.
  *   **What gets through:** Fare changes, route tweaks, scheduling tools. (Things with numbers).
  *   **What gets blocked:** Cultural shifts, dignity-based policies, long-term infrastructure bets. (Things where the "metric" is trust or safety, which take years to measure).
  *   **The Risk:** You will become a committee that efficiently manages decline but cannot envision transformation. The "Shadow Public" often suffers from structural issues (racism, poverty) that cannot be fixed by a 6-month pilot with a guardrail metric.

  **The Fix: Add a "Principle Veto"**
  Add a 2-minute step before Phase 1.
  **Question:** "Does this proposal violate a core principle of our authority (e.g., Equity, Access, Safety) regardless of the data?"
  *   If **Yes**: The inquiry stops. You do not experiment on rights.
  *   *Example:* If the algorithmic scheduling tool saves 8% but requires drivers to urinate in bottles to keep schedule, you do not pilot it. You reject it on principle.
  *   *Why:* This catches the "slow, structural stuff." It allows you to say, "We are not testing this, because it treats riders as revenue units rather than people."

  **Final Advice for the Board:**
  When you send recommendations, attach the **One-Pager** with the boxes checked.
  *   If you recommend a **Pilot**, highlight the **Off-Ramp**.
  *   If you recommend **Rejection**, highlight the **Irreversibility**.
  *   If you recommend **Approval**, highlight the **Guardrail Metric**.

  This makes your value visible without requiring them to read a methodology appendix. You are not giving them opinions; you are giving them risk assessments.
