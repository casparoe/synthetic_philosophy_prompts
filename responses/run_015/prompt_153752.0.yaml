answer: |-
  This is an exceptionally sharp methodological observation. You have identified a specific failure mode in comparative-historical inference that sits at the intersection of philosophy of science, survival analysis, and reference class forecasting.

  To answer your primary question directly: **There is no single, canonical term in comparative historical sociology or forecasting literature that captures this precise asymmetry.** While the constituent elements are well-documented, the specific pattern of *outcome-contingent, one-directional tightening of reference-class boundaries* is usually subsumed under broader categories like "confirmation bias" or "ad hoc hypothesis formation," which fails to capture the structural manipulation of the sample denominator you are describing.

  However, we can map this pattern precisely onto three established conceptual frameworks, and from there derive a precise coinage that distinguishes it from general narrative adjustment.

  ### 1. The Philosophical Analogue: The Lakatosian "Protective Belt"
  In the philosophy of science, this is a specific variant of an **Immunizing Stratagem** (Popper) operating within a **Lakatosian Research Program**.
  *   **The Hard Core:** The base-rate prediction (e.g., "Empires with features $X, Y, Z$ collapse at rate $R$").
  *   **The Protective Belt:** The definition of the reference class itself.
  *   **The Mechanism:** When a prediction fails (survival), the scholar does not abandon the hard core. Instead, they adjust the protective belt by adding an auxiliary assumption (the "hidden feature" $W$) that reclassifies the anomaly as outside the scope of the theory.
  *   **The Asymmetry:** Crucially, in a standard Lakatosian adjustment, one might expect the belt to tighten generally. In your observation, the belt tightens *only* around negative instances (survivors), while positive instances (collapses) are grandfathered in. This suggests the protective belt is not just protecting the theory, but specifically protecting the *statistical frequency* of the hard core.

  ### 2. The Logical Analogue: The "No True Scotsman" Fallacy
  Logically, this is the **No True Scotsman** fallacy applied to set membership.
  *   *Standard Form:* "No Scotsman puts sugar on his porridge." (Counter-example: Angus is a Scotsman and puts sugar on his porridge.) "Well, no *true* Scotsman puts sugar on his porridge."
  *   *Your Form:* "No empire with features $X, Y, Z$ survives." (Counter-example: The Byzantine Empire had $X, Y, Z$ and survived.) "Well, no empire *truly belonging to the risk class* with $X, Y, Z$ survives; Byzantium must have had feature $W$."
  *   **Distinction:** In standard usage, this is a rhetorical fallacy. In your sociological context, it is a *methodological* procedure that alters the $N$ of the reference class, thereby artificially inflating the conditional probability $P(\text{Collapse} | X, Y, Z)$.

  ### 3. The Statistical Analogue: Endogenous Sample Truncation (or Informative Censoring)
  In survival analysis and econometrics, this resembles **Informative Censoring** or **Endogenous Stratification**.
  *   **Standard Survivorship Bias:** Usually implies ignoring the failures (the dead) and studying only the survivors.
  *   **Your Pattern:** You are studying both, but you are *censoring the survivors* from the risk pool based on information revealed *by their survival*.
  *   **The Violation:** In valid reference class forecasting, class membership must be determined **ex-ante** (based on information available at $T_0$). By using the outcome at $T_1$ to determine whether a case belonged in the class at $T_0$, you are introducing **look-ahead bias** into the class definition. This creates a tautology: "The class of empires destined to collapse is defined as those that collapsed."

  ### Proposed Coinage: Asymmetric Reference Class Truncation (ARCT)

  Given the lack of a specific term, I propose **Asymmetric Reference Class Truncation (ARCT)** to describe this specific failure mode.

  **Definition:** ARCT occurs when the boundaries of a reference class are retrospectively narrowed to exclude cases that contradict a predicted base rate (survivors), while cases confirming the prediction (collapses) are retained without similar scrutiny regarding the exclusion criteria.

  **Why this distinguishes it from "Narrative Adjustment":**
  1.  **Locus of Adjustment:** Narrative adjustment changes the *causal mechanism* (e.g., "Rome didn't fall due to lead, but due to barbarians"). ARCT leaves the mechanism/base rate intact and changes the *population* ($N$).
  2.  **Statistical Consequence:** Narrative adjustment might weaken a theory's explanatory power. ARCT artificially preserves the *predictive accuracy* (calibration) of the base rate by manipulating the denominator.
  3.  **Directionality:** Narrative adjustment can go either way (explaining survival or collapse). ARCT is strictly unidirectional (explaining away survival).

  ### Boundary Conditions: Legitimate Refinement vs. ARCT

  You asked for boundary conditions to distinguish this failure mode from legitimate historiographical refinement. In comparative sociology, discovering new variables is how theory progresses. The distinction lies in **Ex-Ante Specifiability** and **Symmetry**.

  | Feature | Legitimate Refinement | Asymmetric Reference Class Truncation (ARCT) |
  | :--- | :--- | :--- |
  | **Timing of Criterion** | The "hidden feature" ($W$) is theorized or measurable *prior* to observing the outcome, or is applicable to the whole class. | The feature $W$ is inferred *from* the survival outcome itself (tautological). |
  | **Application** | **Symmetric:** Both collapsed and surviving cases are screened for $W$. Collapsed cases lacking $W$ might be reclassified as "anomalous collapses." | **Asymmetric:** Only survivors are screened for $W$. Collapsed cases are assumed to lack $W$ by default. |
  | **Independence** | $W$ is independent of the outcome (e.g., "soil quality," "geographic buffer"). | $W$ is dependent on the outcome (e.g., "resilience," "adaptive capacity" defined solely by the fact of survival). |
  | **Base Rate Effect** | The base rate may shift (up or down) as the class is clarified. | The base rate is preserved (immunized) by removing only the "errors." |

  ### Application to Your Field
  In the literature you are likely engaging with (e.g., Turchin's cliodynamics, Mann's *Sources of Social Power*, or Goldstone's *Revolution and Rebellion*), this often manifests when scholars define "crisis" or "state failure."
  *   **Example:** If a state undergoes fiscal crisis and elite fragmentation but survives via reform, ARCT occurs if the scholar claims, "This was not a *true* structural crisis because it was resolved," rather than, "This was a structural crisis that was resolved, implying our model of crisis $\rightarrow$ collapse is incomplete."

  ### Conclusion
  You are observing a **methodological immunization strategy** that operates through **endogenous reference class restriction**. While it draws on the logic of the **No True Scotsman** fallacy and the statistical problem of **informative censoring**, its specific function in preserving base-rate predictions in historical sociology warrants the specific designation of **Asymmetric Reference Class Truncation**.

  Recognizing this allows you to critique such studies not merely on their narrative plausibility, but on their **reference class validity**: *Was the exclusion criterion for the survivor applicable to the collapsed cases, and was it definable prior to the outcome?* If not, the base rate is a tautology, not a prediction.
