  **The judge's ruling** — about 100 words. Sincere, mild, HR-ish prose explaining why the wrong side scored higher.

  **What I was aiming at** — about 200 words. What the piece is actually claiming about the limits of debate, and where you took a liberty.

  Before drafting, spend a few lines listing the ways an obfuscator really does beat a time-limited judge, then pick exactly one to dramatize — I'd rather have one mechanism done precisely then three gestured at.
