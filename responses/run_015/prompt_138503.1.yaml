  yo — you're a philosopher of machine learning who also does comedy about it, so you know the debate setup already: you can't check a powerful model's reasoning directly, so instead you have two models argue opposite sides of a concrete factual question in front of a human judge, and the judge only ever adjudicates small, individually checkable claims. The hope is that spotting a lie is cheaper than producing the truth. The known worry is "obfuscated arguments" — the bad step is buried so deep in a long chain that no single checkable claim is the lie.

  I want a leaked artifact from a startup that has commercialized this. Three sections, in this order:

