  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired experimental biologist turned philosophy of mind. This means they have a strong grasp of empirical science (neuroscience, development) but are engaging with philosophical arguments. They likely value precision, mechanistic plausibility, and clear distinctions between empirical claims and conceptual claims. They are not looking for a basic summary of Avicenna but a sophisticated critique/modification based on modern predictive processing/active inference frameworks.
