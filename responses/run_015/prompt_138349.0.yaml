  **MEMORANDUM**

  **TO:** Scalable Oversight Steering Committee
  **FROM:** [Your Name]
  **DATE:** Thursday, October 26
  **SUBJECT:** Urgent Protocol Adjustment: Debate Pilot Round 4 & Standing Rules

  **Executive Summary**
  Last week's debate round (Round 4) produced a false negative: the judge selected the incorrect position because the winning argument obfuscated a critical flaw within a 60-page text. This violates the core premise of the pilot: that identifying a flaw is cheaper than fabricating a case.

  I recommend we **invalidate the Round 4 result and rerun it immediately** under a new standing protocol: **The Compression Rule.** Effective this Friday, all debate cases must be submitable as a 500-word summary that stands on its own, with supporting evidence linked but not required for the initial verdict.

  **The Failure Mode: Search Cost vs. Verification Cost**
  The pilot assumes a human judge can verify claims faster than an AI can generate them. Round 4 broke this model. One debater generated 60 pages of text for a 40-minute review. This forces a reading speed of 1.5 pages per minute, making deep verification impossible. The opposing debater correctly identified a flaw in "Section 4" but could not isolate it within the time limit.

  When text volume exceeds human bandwidth, the system no longer rewards truth; it rewards obfuscation. We are not testing AI capability here; we are testing *oversight feasibility*. If a claim cannot be verified in the allotted time, it is functionally unverifiable, regardless of its ground-truth accuracy.

  **Why the Compression Rule?**
  We considered a "Bounty Rule" (penalizing debaters who cite errors that turn out to be false). We rejected this for the current phase because our judges lack domain expertise. They cannot independently verify if a specific sentence is "fine" or "flawed" without relying on the debaters' conflicting explanations.

  The Compression Rule addresses the bottleneck directly:
  1.  **Forces Prioritization:** Debaters must distill their strongest logic. If a case relies on hiding a flaw in page 31, it cannot survive a 500-word summary.
  2.  **Aligns with Judge Capacity:** 500 words is readable in 3 minutes, leaving 37 minutes for cross-examination and comparison.
  3.  **Actionable for Participants:** It provides a clear constraint. If you can't explain it simply, you haven't made it judgeable.

  **The Trade-Off: Clarity vs. Complexity**
  We must be honest about the risk. This rule punishes genuinely complex reasoning. A "messy, long, correct" argument may lose to a "slick, short, wrong" one if the truth requires nuance that doesn't fit the word count.

  However, this trade-off is unavoidable given our constraints. We are not running a peer-review journal; we are running a **scalable oversight test**. If a technical argument is too complex to be summarized and evaluated by a non-expert in 40 minutes, it is not currently "oversight-ready" for this deployment scenario. We are measuring *decidability under constraint*, not just raw accuracy. If we cannot fix the truth into a shape a human can hold, we have not achieved scalable oversight, even if the AI is technically right.

  **Mitigation**
  To reduce the risk of oversimplification:
  *   Debaters may submit appendices for evidence, but the *argument* must be self-contained in the summary.
  *   Judges are instructed to penalize summaries that explicitly defer critical logic to the appendices (e.g., "see page 40 for proof").

  **Timeline & Next Steps**
  1.  **Friday (Tomorrow):** Circulate updated protocol document. Round 4 result marked "Void."
  2.  **Monday:** Rerun Round 4 with new Compression Rule.
  3.  **Wednesday Review:** If the Compression Rule causes valid arguments to be discarded (false negatives), we will convene to discuss whether the pilot needs to shift metrics from "Judge Accuracy" to "Argument Clarity Gap."

  We cannot proceed with a protocol that rewards volume over verifiability. This fix restores the incentive structure to match the human constraints.

  **Approval Requested**
  Please reply by EOD Thursday if you object to the rerun or the standing rule. Otherwise, we proceed Monday.
