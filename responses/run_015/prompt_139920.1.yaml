answer: |-
  **Project Title:** Ontogenetic Content: Conferring vs. Transmitting in Learning Histories

  **Research Question**
  Can within-lifetime learning histories confer original intentional content, or do they merely transmit derived content?

  **Project Summary**
  Teleosemantic theories successfully ground content in phylogenetic selection history: a mechanism represents *fly* because it was selected for catching flies. However, most human and animal content (faces, words, specific locations) is fixed within an organism's lifetime. This project investigates whether ontogenetic learning histories can play the same content-fixing role as evolutionary history. I propose distinguishing two learning mechanisms: *calibrated mappings* (where an external error signal specifies the correct output) and *selective mappings* (where mappings persist solely due to downstream success). I argue that calibrated mappings merely transmit content from the signal source, while selective mappings face a co-variation indeterminacy problem if detector and consumer are learned jointly. The goal is to determine if any within-lifetime history can confer content rather than borrow it.

  **Background and Significance**
  Standard etiological accounts struggle to accommodate ontogeny without stretching the notion of "selection" beyond recognition. Informational accounts handle covariance but fail to explain misrepresentation in learning (e.g., a consistently mistaken belief that yields success). Consumer-based accounts locate content in how a state is used, but they do not distinguish between a state being used correctly because it was *told* what to do versus because it was *tested* against the world.

  Current hybrid moves typically assume that learning inherits norms from phylogeny (e.g., we learn language because we were selected to learn language). This bypasses the specific question of how *novel* content is fixed during the learning process itself. If a neural system learns to recognize a new object, does the learning history make the internal state *about* that object, or does it merely tune the system to respond to content fixed elsewhere?

  This project uses the structural distinction between supervised learning (error-correction) and reinforcement learning (success-retention) as a test case to sharpen the philosophical categories. This is not a project in machine learning; rather, ML architectures provide a controlled conceptual environment to isolate variables (error signals vs. reward signals) that are conflated in biological cases.

  **Methodology and Work Plan**
  This is a conceptual analysis project requiring no empirical work. The four-month timeline is structured to move from taxonomy to argument to synthesis.

  *   **Month 1: Taxonomy and Mapping.** I will formalize the distinction between calibrated and selective mappings. I will map existing teleosemantic frameworks (Millikan, Dretske, Godfrey-Smith) onto these categories to demonstrate exactly where they fail to distinguish content-conferring from content-transmitting histories.
  *   **Month 2: The Calibrated Case.** I will develop the argument that calibrated mappings (taught) borrow content. The focus will be on the source of the error signal. If the error signal is normative (telling the system what it *ought* to output), the content is derived from the signal generator, not the learning system. This section will establish the "transmission" thesis for supervised-style learning.
  *   **Month 3: The Selective Case.** I will analyze selective mappings (sticky). The core challenge is the "co-learning problem": if a detector and a consumer are both tuned via reinforcement, success may reflect internal coherence rather than worldly accuracy. I will test whether a "success condition" independent of the system can be identified without appealing to phylogeny.
  *   **Month 4: Synthesis and Drafting.** I will integrate the findings to answer the research question. If a positive criterion is found, I will formulate it. If not, I will articulate the specific barrier. The final weeks will be dedicated to writing the 7,000-word paper.

  **Expected Outcomes**
  *   **Positive Result:** A criterion distinguishing content-conferring learning from content-transmitting learning. This would likely involve identifying a specific type of "world-involving" reward signal that breaks the internal coherence loop, allowing ontogenetic selection to mimic phylogenetic selection.
  *   **Negative Result:** A proof that within-lifetime histories are inherently parasitic on prior content (either phylogenetic or external instruction). This would imply that teleosemantics cannot be naturalized for ontogeny without reducing learning to mere causal tuning.

  **Risks and Limitations**
  The primary philosophical risk is that the project collapses into general distality and indeterminacy worries. If the "success" in selective mapping cannot be distinguished from mere survival or internal consistency, the distinction between conferring and transmitting vanishes. In this case, the project would conclude that there is nothing special about learning histories; they are subject to the same unsolved problems as standard teleosemantics.

  A second risk is redundancy. The distinction between error-driven and reward-driven learning overlaps with existing work on "reward signals" versus "truth-telling signals" in the literature on teleosemantics and cognitive science (notably in the work of Nick Shea and Peter Godfrey-Smith). If the "calibrated/selective" split is merely a redescription of these existing categories, the novelty of the project diminishes. I will mitigate this by focusing specifically on the *normative source* of the content (conferring vs. transmitting) rather than the mechanical distinction of the learning rule. If the distinction proves to be a redescription, the project will pivot to refining the existing account to explicitly address the "transmission" worry, which remains under-theorized.

  Finally, there is a risk of scope creep regarding the machine learning analogy. I will strictly constrain ML references to structural analogies to ensure the paper remains a contribution to philosophy of mind, not philosophy of AI.

  ***

  ### Consultant's Note on the "Sticky/Taught" Distinction

  You asked for an honest assessment of whether your **sticky/taught** split is a redescription of existing literature.

  **The Short Answer:** It is very close to existing distinctions, specifically in the work of **Nick Shea** (e.g., *Representation in Cognitive Science*) and **Peter Godfrey-Smith**.

  **The Details:**
  1.  **Shea's Reward vs. Label:** Shea explicitly distinguishes between learning driven by a "reward signal" (which correlates with success) and learning driven by a "label signal" (which correlates with truth/correctness). This maps almost 1:1 onto your sticky (reinforcement/reward) vs. taught (supervised/label) distinction. He argues that reward signals alone often fail to fix content determinately without some prior grip on the world.
  2.  **Derived vs. Underived Content:** Your suspicion that "taught" mappings borrow content is essentially the distinction between derived content (like a thermometer or a map) and underived content (original intentionality). Teleosemanticists generally agree that systems calibrated by external teachers inherit the teacher's content.
  3.  **The Co-Learning Problem:** Your worry about detector/consumer co-learning is a version of the "Swampman" or "Systematicity" objection applied to learning. It relates to the problem of **radical interpretation**: if you don't know the content of the inputs or the outputs, can success alone fix the content of the middle?

  **How to Save the Project:**
  Do not claim the *mechanical* distinction (supervised vs. RL) is new. It isn't. Claim that the **normative implication** (Conferring vs. Transmitting) is the under-explored variable.
  *   **Pivot:** Most literature asks, "Can teleosemantics explain learning?" You are asking, "Does learning *do* the work of teleosemantics, or does it just outsource it?"
  *   **Refine the Terminology:** In the proposal/paper, avoid "sticky/taught." Use **"Selective Retention"** (sticky) and **"Normative Calibration"** (taught). It sounds more philosophical and less like a blog post.
  *   **The Hook:** Your specific contribution is the claim that *even* Selective Retention might fail to confer content if the consumer is co-learned. That is a stronger, more skeptical claim than Shea usually makes, and it's a good angle for a short paper.

  **Verdict:** The distinction is not novel enough to stand on its own as a new taxonomy, but it is a *very* strong lens for critiquing existing teleosemantic accounts of learning. Frame it as a critical tool, not a new discovery.
