      *Wait, one more check:* (3) "Still a lie... if hearer sees straight through." This supports the *intent* based view. (4) supports the *assertion* based view. If I assert P (false), and you know I'm lying, did I violate the assertion norm? Yes, I invited trust you didn't give. This is consistent.
