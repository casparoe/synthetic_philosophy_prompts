          5.  Alternative protocols if truth isn't easier to defend.
      *   **Constraints:** Plain English (no jargon without explanation), no citations/reading lists, British English spelling/grammar.
      *   **Tone:** Respectful, analytical, validating their concerns without being dismissive or overly alarmist.

  2.  **Deconstruct the Core Problem:**
      *   The user is acting as a "weak judge" in a "debate" setting.
      *   Theory: Truth wins debates because lies require more cognitive load to maintain than truth.
      *   Reality: User relies on heuristics (length, confidence, framing) because they lack domain expertise.
      *   Risk: The system optimises for persuasiveness, not accuracy.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the gravity of the situation. Validate their intuition. Set the stage (British English).

      *   **1. The Implicit Epistemology (What has to be true?):**
          *   Need to explain *why* this method is chosen. It's not about the judge knowing the truth; it's about the *process* revealing it.
          *   Key assumptions:
              *   *Symmetry of Competence:* Both models are roughly equally capable.
              *   *Asymmetry of Burden:* It's harder to lie consistently than to tell the truth.
              *   *Translatability:* Complex truths can be translated into terms a layperson can spot (e.g., contradictions).
              *   *Convergence:* Arguments will narrow down to a specific point of contention the judge *can* verify.
          *   Distinction: Does it require truth to be *obvious*? No, just that errors become *visible* under pressure.

      *   **2. The Obfuscated-Argument Problem (Cost of Verification vs. Deception):**
          *   User's point: Wrong answers look rigorous cheaply; right answers are hard to prove.
          *   Analysis: The system relies on the "cost of sustaining an error" being higher than the "cost of sustaining truth."
          *   If a lie is cheap to dress up (jargon), the system fails.
          *   It rules out "holistic" understanding (where you need to know everything to know anything). It assumes knowledge is modular enough to be checked in chunks.
          *   It assumes the judge can spot *structural* flaws (logic gaps) even if they can't check *content* facts.

      *   **3. The Inconsistency (Pairwise vs. Single Scoring):**
          *   Pairwise: "Pick the winner." Relies on relative comparison. Heuristics (length/confidence) creep in because you *must* choose.
          *   Single Scoring: "Rate quality." Told to ignore style.
          *   Conflict: If style doesn't matter for truth, why does it help you pick in pairwise?
          *   Resolution: They are measuring different things. Single scoring measures *absolute* quality (hard for laypeople). Pairwise measures *relative* utility (easier, but prone to bias). The inconsistency suggests the training guidelines are pragmatically patched rather than philosophically consistent.

      *   **4. The Tie-Break Worry (Truth vs. Default):**
          *   User's fear: They aren't finding truth; they are applying a rule (e.g., "pick the shorter one").
          *   How to tell? Look at the data. If the "shorter" answer wins even when it's wrong (verified by experts later), it's a default, not truth.
          *   Fix: Change the protocol. Force the models to argue *about* the uncertainty. Ask the judge to identify *where* they got stuck, not just pick a winner. "Calibration questions" where the answer is known to the supervisors but not the judge.

      *   **5. If Truth Isn't Easier to Defend (Alternative Protocols):**
          *   If the core assumption fails, the debate model breaks.
          *   Alternatives:
              *   *Expert-in-the-loop:* Don't use laypeople for high-stakes domains.
              *   *Process Supervision:* Reward the *steps* taken, not the final answer.
              *   *Uncertainty Quantification:* Reward the model for saying "I don't know" correctly.
              *   *Tool Use:* Force models to cite verifiable sources (links, guidelines) rather than generating text.
          *   Loss: Speed and scale. It becomes expensive.

