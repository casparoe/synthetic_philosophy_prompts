prompt: |-
  ok so my ethics teacher mentioned antinatalism in class last week and me and my friend have been going back and forth about it ever since and I feel like we keep talking past each other

  the version in the book (Benatars thing) as I understand it goes like this: pain being there is bad, pleasure being there is good, pain NOT being there is good even if theres nobody who gets to enjoy that absence, and pleasure not being there is not bad unless there is somebody around for whom its a deprivation. so you compare scenario A where the kid exists and gets both good and bad stuff, with scenario B where they never exist and get neither, and B wins by default because the avoided pain counts in Bs favour and the missed pleasure dosent count against it. so coming into existence is always a harm for the person who comes into existence.

  my friend says all of that is just a dressed up version of something much simpler, which he calls the witness rule: whether some outcome is good or bad should be judged by the people who are actually there to experience it, people who never exist never experience anything and never complain, so their side of the comparison is empty, and when you actually ask existing people if theyre glad to be alive most of them say yes. he says both arguments are really the same asymmetry about presence vs absence stated two ways, his is just the honest version, and once you see it that way the whole antinatalism thing falls apart.

  I think hes wrong but I cant really say why, so:

  1. are these actually the same principle? he keeps saying they are because both of them are asymmetries. it seems to me like Benatars version is doing something weirder, like assigning value to a state of affairs that nobody is around to experience, which sounds almost like the opposite of the witness rule. is that the difference that matters, or is it cosmetic?

  2. give me a concrete case where the two rules give different verdicts about whether to have a kid. my try was: a kid whos going to have an amazing life except for one genuinely awful afternoon. Benatar says dont create them anyway, witness rule says obviously create them. is that the right way to set up the disagreement or am I stacking it?

  3. the thing I really dont get: I read that Benatar also argues you cant trust it when people say their lives are good, because of stuff like optimism bias and getting used to however things are. but if his asymmetry is just a claim about which states of affairs are good and bad, why does he need that at all? and does bringing it in secretly turn his view into my friends view, i.e. one where the answer depends on what people report? if everyone on earth genuinely reported being happy would the asymmetry be untouched or not?

  4. and what does the witness rule do about people who cant answer? someone who had a miserable life and is now dead, or a kid you could create but didnt, or people who arent in the survey because things went badly enough that theyre gone. my friend says that selection thing is the whole point and not a bug and I have no idea if that a good answer.

  also one more: even if coming into existence is always a harm for the person, does dont have kids follow by itself? seems like lots of harms are justified, and my friend says his rule explains that better than Benatars does. is he right about that part at least? sorry this is long, thanks for any help
