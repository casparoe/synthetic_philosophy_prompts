  *(Self-Correction on Q3)*: I need to be careful. Benatar argues two things: 1. Coming into existence is *always* a harm (Asymmetry). 2. Lives are generally *very* bad (Empirical claims). The user asks if the empirical claim undermines the Asymmetry. It doesn't. I need to clarify that.

