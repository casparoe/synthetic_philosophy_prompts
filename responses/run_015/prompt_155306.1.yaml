          *   Verdict $\rightarrow$ Vote result.
          *   Appeal $\rightarrow$ Judicial review/Second referendum?
      *   *Norms:* Presumption of innocence (Status quo bias?), Exclusion of hearsay (Fact-checking?), Unanimity (Supermajorities?), Deliberation (Public debate?).
      *   *Swiss vs. Brexit:* Swiss = iterative, optional, low stakes per vote, high civic literacy. Brexit = one-off, high stakes, binary, emotional.
      *   *Conclusion:* Does the analogy hold? Likely weakens the legitimacy claim because the procedural safeguards of a trial are missing in a referendum.

  3.  **Drafting the Correspondence Table:**
      *   Need to map specific legal roles to political realities.
      *   *Judge:* In a trial, the judge manages procedure and instructs on law. In a referendum, who does this? The Electoral Commission sets the question wording. Constitutional Courts might review legality *after*.
      *   *Jury:* Random sample vs. Self-selected electorate. This is a huge disanalogy.
      *   *Evidence:* Rules of evidence vs. Campaign ads.
      *   *Verdict:* Binding judgment vs. Policy mandate.
      *   *Appeal:* Higher court vs. Legislative override or new vote.

  4.  **Analyzing Silently Imported Norms:**
      *   *Presumption of Innocence:* In law, the state must prove guilt. In referendums, is there a presumption for the *Status Quo*? (Yes, usually requires a majority to change). But is the "defendant" (the current law) innocent? Not really applicable.
      *   *Exclusion of Prejudicial Material:* Trials ban emotional manipulation not based on fact. Referendums thrive on emotional campaigning. Can this be accommodated? Strict spending limits, official neutral information booklets (Swiss model).
      *   *Unanimity:* Juries often need unanimity (or near). Referendums use simple majority. This ignores minority protection.
      *   *Deliberative Isolation:* Jurors are sequestered to avoid outside influence. Voters are bombarded.
      *   *Judicial Instruction:* Jurors are told what the law is. Voters are often confused about the legal effect of their vote (e.g., Brexit advisory vs. binding).

  5.  **Distinguishing Swiss vs. One-Off (Brexit/California):**
      *   *Swiss:* Optional referendum (citizens challenge laws). Frequent votes. "Cooling off" period. Official government brochures (pro/con). Federal structure allows variation. It mimics a *continuous* judicial review process.
      *   *Brexit/California:* One-off high stakes. Binary choice. Campaign dominated by external money/media. No "sequestering."
      *   *Key Difference:* Iteration allows learning (Swiss). One-off creates path dependency (Brexit).

  6.  **Evaluating Legitimacy vs. Incompetence:**
      *   *Proponent Claim:* Legitimacy comes from the "verdict" of the people (like a jury).
      *   *Critique:* Incompetence comes from lack of safeguards (evidence, instruction).
