answer: |-
  Your intuition is remarkably robust. You have independently reconstructed a synthesis of **Bayesian Model Selection**, **Error Statistics** (specifically Deborah Mayo's concept of "severe testing"), and the philosophical distinction between **accommodation and prediction**.

  Your worry that your two clauses are in tension is well-founded, but they are not contradictory; they are counterweights. Clause 1 (Likelihood) pulls toward complexity (more knobs fit better); Clause 2 (Independent Purchase) pulls toward simplicity (fewer knobs are riskier). The "best explanation" lives at the equilibrium of this tension.

  Here is a candidate principle, precise enough to be applied, followed by its verdicts on your cases and an honest accounting of its costs.

  ### The Principle: Risky Coherence

  **A hypothesis is preferred to the extent that it renders the data probable (Clause 1) subject to the constraint that the parameters required to do so were fixed independently of the data they are fitting (Clause 2).**

  We can make your term "Independent Purchase" precise by borrowing from modeling: **Parameter Rigidity.** A posit has independent purchase if the values of its parameters are locked by one domain of evidence and then *risked* in another without adjustment.

  *   **Clause 1 (Likelihood):** $P(Data | Hypothesis)$ must be high.
  *   **Clause 2 (Risk):** The hypothesis must not be flexible enough to accommodate $\neg Data$. The "space" of possible outcomes the theory forbids must be large.

  **What this presupposes:** It presupposes that the world is not a conspirator. It assumes that if a theory survives a severe test (where it could easily have failed), that survival is not a lucky accident but a signal of structural correspondence with reality. It is a commitment to **Inference to the Best Explanation (IBE)** grounded in **Reliability** rather than mere **Empirical Adequacy**.

  ---

  ### Verdicts on Your Cases

  #### 1. Wegener vs. Semmelweis (The Mechanism Tension)
  Your intuition here is correct, but the distinction is not "mechanism vs. no mechanism." It is **Prior Plausibility vs. Effect Size.**

  *   **Semmelweis:** The "posit" was cadaveric matter. While the microscopic mechanism (bacteria) was unknown, the *category* of the cause (contagion via contact) was ontologically cheap. It did not violate known physics. Furthermore, the **Effect Size** was massive (death rates collapsed). In statistical terms, the signal-to-noise ratio was so high that the lack of a detailed mechanistic model was outweighed by the strength of the correlation. The "knob" (washing) had a binary, high-impact effect.
  *   **Wegener:** The posit was moving continents. This was ontologically expensive. It violated the contemporary geophysical consensus that the crust was rigid and solid. To accept Wegener required discarding established physics, not just adding a missing detail.
  *   **The Principle's Verdict:** You are right to treat them differently. Semmelweis offered a **High-Likelihood, Low-Cost** posit. Wegener offered a **High-Likelihood, High-Cost** posit with **Zero Independent Purchase** in physics (no known force could do it). The principle forces you to keep both verdicts. The difference is the *cost of the posit* relative to the *strength of the constraint*.

  #### 2. Neptune vs. Vulcan (The Constraint Diagnosis)
  Your diagnosis is correct and maps directly to **Degrees of Freedom.**

  *   **Neptune:** The anomaly in Uranus's orbit constrained the mass and position of the perturbing body to a very narrow region of parameter space. Le Verrier did not say "there is a planet somewhere"; he said "look *here*." The theory risked falsification by a single telescope sweep.
  *   **Vulcan:** The perihelion advance of Mercury could be fit by a family of orbits (mass, distance, eccentricity). If the telescope didn't see it at position A, the theory could retreat to position B.
  *   **The Principle's Verdict:** Neptune passes the Risk test (high constraint, low flexibility). Vulcan fails (low constraint, high flexibility). You do not need to lean on hindsight; the *width of the confidence interval* for the prediction distinguishes them at the time of inference.

  #### 3. Unification vs. Breadth (The Parameter Sharing Test)
  This is the crux of your worry about "knobs."

  *   **Maxwell (Unification):** Electricity, magnetism, and light were distinct phenomena. Maxwell's equations did not just say "these are related." They dictated that electromagnetic waves *must* travel at speed $c$. Crucially, $c$ was **not a free parameter** tuned for light; it was derived from constants measured in static electrical and magnetic experiments ($\mu_0$ and $\epsilon_0$). This is **Parameter Sharing**. The constants fixed in domain A predicted the behavior in domain B without adjustment.
  *   **Chronic Illnesses (Breadth):** When one fluctuating quantity explains a catalogue of complaints, the "quantity" is usually ill-defined. If the patient has symptom X, the quantity is "high"; if symptom Y, it is "oscillating." The parameters are being **retrofitted** to each symptom. There is no Parameter Sharing; there is Parameter Stretching.
  *   **The Principle's Verdict:** Unification is virtuous when it involves **Rigid Parameter Sharing**. Breadth is vicious when it involves **Flexible Parameter Stretching**. The principle separates them cleanly.

  ---

  ### Application to Pending Cases

  #### 1. Dark Matter vs. Modified Gravity
  This is the hardest test for your principle, and it reveals where your worry about "protean breadth" is most acute.

  *   **Dark Matter (Lambda-CDM):**
      *   *Pros:* It exhibits **Rigid Parameter Sharing**. The same density parameter ($\Omega_m$) that fits galactic rotation curves also fits the Cosmic Microwave Background (CMB) power spectrum and gravitational lensing clusters. These are independent domains. The CMB prediction was a "Neptune moment"—a specific peak structure predicted by the model before high-precision measurement.
      *   *Cons (Your Worry):* On small scales (dwarf galaxies), the theory requires "feedback parameters" (baryonic physics) to match observation. Critics argue these are becoming "knobs."
  *   **Modified Gravity (MOND):**
      *   *Pros:* Fits rotation curves with extreme precision using one acceleration constant ($a_0$).
      *   *Cons:* Struggles immensely with the CMB and cluster lensing without adding *its own* dark components (e.g., sterile neutrinos), effectively becoming dark matter with extra steps.
  *   **The Principle's Verdict:** Currently, **Dark Matter wins on Independent Purchase.** It successfully risked parameters fixed in cosmology against data in structure formation. However, your suspicion is scientifically healthy. If the "feedback parameters" required to fit small-scale anomalies become numerous and unconnected to independent physics, Dark Matter will begin to fail the Risk test, sliding toward "protean breadth." The principle tells you to watch the **ratio of new anomalies to new free parameters.**

  #### 2. The Multiverse
  *   **Analysis:** The multiverse posits that all physical constants vary across universes. We observe ours because we are here (Anthropic Principle).
  *   **The Principle's Verdict:** **Despise it.**
      *   *Clause 1:* It makes the data unsurprising (likelihood is high).
      *   *Clause 2:* It has **zero Independent Purchase**. It cannot be falsified. No observation of *our* constants could rule it out, because any constants are compatible with *some* universe. It is the ultimate "theory with a knob for every anomaly," where the knob is "selection effect." It fails the Risk test completely.

  ---

  ### What You Must Give Up

  To hold this principle consistently, you must concede two points that might discomfort you:

  1.  **The Circularity is Real but Benign:** You worried that judging "independent purchase" is an after-the-fact judgment. It is. We cannot know if a test is "severe" until we see if the theory *could* have failed. However, this is not vicious circularity; it is **historical indexing**. We judge the risk based on the state of knowledge *at the time of prediction*. If Le Verrier had known Neptune was there, his prediction wouldn't count. The principle requires you to be a historian of the science, not just a logician of the text.
  2.  **Truth vs. Reliability:** You asked if this commitment is defensible or just a habit.
      *   *The Habit:* As a experimentalist, you were trained that a model that predicts new data without refitting is *useful*.
      *   *The Commitment:* To say this tracks *Truth* is a metaphysical leap (Scientific Realism). The principle guarantees **Empirical Reliability**, not necessarily Ontological Truth. Dark Matter might be a "useful fiction" that organizes gravitational anomalies without being "stuff."
      *   *Defense:* The only defense is pragmatic. Theories that satisfy Risky Coherence tend to remain useful longer than those that don't. If "truth" means "that which does not require ad hoc rescue when probed new ways," then yes, the principle tracks truth. If "truth" means "correspondence to the noumenal world," the principle is silent.

  ### Summary of the Principle

  **The Best Explanation is the one that maximizes Likelihood while minimizing Degrees of Freedom across Independent Domains.**

  *   **Wegener:** Failed on Degrees of Freedom (no physics allowed it).
  *   **Semmelweis:** Passed on Likelihood/Effect Size (overwhelmed the mechanism gap).
  *   **Neptune:** Passed on Constraints (narrow parameter space).
  *   **Vulcan:** Failed on Constraints (broad parameter space).
  *   **Maxwell:** Passed on Parameter Sharing (constants fixed in A predicted B).
  *   **Multiverse:** Failed on Risk (unfalsifiable).
  *   **Dark Matter:** Currently Passing (Parameter Sharing across cosmology), but under monitoring for "knob-creep" on galactic scales.

  Your intuition is not a mystery; it is the instinct of a modeler who knows that a fit is only as good as the data it *didn't* use to build the curve. You are a **Structural Realist** without the label. You believe the mathematical structure that survives severe testing is the only part of the theory worth calling "true." That is a defensible, robust position.
