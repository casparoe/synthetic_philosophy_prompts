prompt: |-
  hey, quick consistency check but for a slogan. in my well-being seminar someone keeps saying "the good life is lived, not streamed" to shut down talk about subjective satisfaction. they used it last week on a hypothetical about an 80-year-old in a full-imersion VR retirement community who hasn't left the headset in years but reports perfect contment and zero desire to log off. the claim was that she's necessarily missing something essential regardless of her reports. i want to bring back a menu of what that slogan could actually be asserting -- is it about authenticity, about causal connection to real-world outcomes, about achievement being constitutive of welfare, or just a prejudice against virtual mediums? for each reading say whether it's trivial, whether it's defensible, and whether it actually supports the conclusion that the VR retiree is worse off. also flag which reading is probably doing the work in thier argument. i don't need citations, just the breakdown so i can push back thursday.
reasoning: |-
