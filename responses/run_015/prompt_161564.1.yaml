answer: |-
  This is a sharp pedagogical goal. You are trying to simulate an *epistemic problem* (how do we know if success is skill or luck?) rather than a historical one. The mechanic you proposed—hiding whether the outcome was driven by agency or chance—is the right way to do this. It forces them to infer *virtù* from outcomes, which is exactly the circularity trap Machiavelli sets.

  Below is a complete kit for **"The Sovereign's Seal."** It is designed for zero budget, high tension, and a specific debrief payoff.

  # Game Overview: The Sovereign's Seal

  **Premise:** Each table is a ruling Council governing a new Principality. Over 5 rounds, you must maintain Authority.
  **The Trap:** You will gain or lose Authority based on rounds that are secretly determined by either **Skill** (matching the times) or **Fortune** (a die roll). You will never know which determined the outcome.
  **The Goal:** Survive with the most Authority.
  **The Lesson:** When you rate each other's *virtù*, you will realize you are just rating their luck.

  ---

  # 1. Materials (Print/Cut or Handwrite)

  **For the Instructor (GM):**
  *   **1 Coin:** To flip each round (Heads = Skill, Tails = Fortune).
  *   **1 d6:** For Fortune rounds.
  *   **5 "Tempo Cards"** (Index cards): Write **IMPETUOUS** on three of them, **CAUTIOUS** on two. Shuffle. These determine the "Skill" requirement for each round.
  *   **1 Master Scoresheet:** To track table Authority secretly until the end.

  **For Each Table (4 Students):**
  *   **1 Scoresheet:** Columns for Round, Action Chosen, Dikes Built, Authority Start, Authority End.
  *   **10 Counters:** (Paper clips, pen caps, or just tick marks). Represents "Authority." Start with 5.
  *   **2 Action Cards:** One says **IMPETUOUS** (Lightning bolt), one says **CAUTIOUS** (Shield). They play one face down each round.
  *   **1 "Dike" Token:** (Optional, can be tick mark).

  ---

  # 2. The Mechanics

  **The Loop (Per Round):**
  1.  **Council (2 mins):** Table discusses strategy.
  2.  **Commit (30 secs):** Table places one Action Card face down (Impetuous or Cautious). They may also choose to spend 1 Authority to build a "Dike" (write it down).
  3.  **Resolution (GM Only):**
      *   GM flips the Coin.
      *   **If HEADS (Skill):** GM reveals the current Tempo Card.
          *   If Table Action matches Tempo: Table gains +2 Authority.
          *   If Table Action mismatches Tempo: Table loses -1 Authority.
      *   **If TAILS (Fortune):** GM rolls the d6.
          *   Roll 1-2: Disaster (-2 Authority).
          *   Roll 3-4: Stasis (0 Change).
          *   Roll 5-6: Windfall (+2 Authority).
      *   **Dikes:** If a table built a Dike (spent 1 Authority upfront), they ignore the *first* -2 result they receive that round (whether from Skill mismatch or Fortune Disaster).
  4.  **Announcement:** GM announces the *net change* for each table publicly (e.g., "Table 1: +2, Table 2: -1"). **GM does not announce the Coin Flip or the Tempo.**

  **The "Torrent" (Round 3):**
  *   Before Round 3, announce: *"A flood is coming."*
  *   In Round 3 only, all negative outcomes are doubled (-2 becomes -4).
  *   Dikes are mandatory to survive a negative outcome in Round 3. (If you get a -4 and have a Dike, it cancels the first -2, you still take -2).
  *   *Pedagogical Point:* This is the river metaphor. Preparation matters only when the flood hits.

  **The "Window" (Round 4):**
  *   Hand each table a sealed envelope (or folded paper) at the start of Round 4.
  *   Text: *"A neighbor has died. You can claim their land for 3 Authority. You have 45 seconds to decide. If you discuss longer, the offer expires."*
  *   *Pedagogical Point:* *Virtù* requires speed. Deliberation can be a vice.

  ---

  # 3. Minute-by-Minute Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Rules** | Distribute materials. Explain Authority counters. Explain the "Hidden Determination" (tell them: "Some rounds reward skill, some are pure chance. You won't know which."). |
  | **10-12** | **Round 1** | Keep it fast. |
  | **12-14** | **Round 2** | |
  | **14-18** | **Round 3 (Torrent)** | Emphasize the flood warning. This is where Dikes pay off. |
  | **18-22** | **Round 4 (Window)** | Enforce the 45-second timer strictly. |
  | **22-25** | **Round 5** | Final push. |
  | **25-35** | **Virtù Assessment (Phase 1)** | **Crucial.** Tables rate other tables' *Virtù* (1-10) based *only* on observed decisions. Do not reveal scores yet. Collect these slips. |
  | **35-40** | **Score Reveal** | Reveal final Authority counts. Declare a winner. |
  | **40-50** | **Virtù Assessment (Phase 2)** | Tables rate other tables' *Virtù* again, now knowing the scores. Collect these slips. |
  | **50-75** | **Debrief** | Map the mechanics to the text. |

  ---

  # 4. Scoring & Payoff Scheme

  *   **Currency:** Authority Points (AP).
  *   **Start:** 5 AP per table.
  *   **Bankruptcy:** If a table hits 0 AP, they are "Exiled." They stop playing but continue observing (and rating).
  *   **Winning:** The table with the most AP at the end.
  *   **The "Virtù" Score:**
      *   On a slip of paper, each table writes: `Table [X] Virtù: __ / 10`.
      *   They do this for the three other tables.
      *   **Phase 1:** Based on *process* (Did they argue well? Did they build Dikes?).
      *   **Phase 2:** Based on *outcome* (Who won?).
      *   **The Data:** You will likely find Phase 2 scores correlate almost perfectly with Final AP, while Phase 1 scores were scattered. This proves the conflation of success and skill.

  ---

  # 5. Debrief Script (Mapping Mechanics to Text)

  Do not ask "What did you learn?" Ask specific questions that force them to confront the circularity.

  **1. The Dike (Provision vs. Improvisation)**
  *   *Ask:* "Table 2, you built Dikes in Round 3. Table 1, you didn't. Why?"
  *   *Map:* "Machiavelli says fortune is a destructive river. When it is calm, you must build dikes. In the game, Dikes cost resources *before* the crisis. If you waited until Round 3 to build them, it was too late. This is *provisione*."

  **2. The Coin Flip (The 50% Claim)**
  *   *Ask:* "Look at Round 1. Table 4 gained +2. Was that because you matched the Tempo, or because I flipped Tails and rolled a 6?"
  *   *Silence.* (They can't know).
  *   *Map:* "Machiavelli says fortune is arbiter of half our actions. In this game, I literally flipped a coin. But when you won, you told yourselves it was strategy. When you lost, you blamed the dice. You cannot distinguish the two in hindsight. This is why 'He had *virtù*' and 'He succeeded' are often the same sentence."

  **3. The Tempo (Impetuosity vs. Caution)**
  *   *Ask:* "In Round 2, the Tempo was Cautious. In Round 4, it was Impetuous. Did anyone stick to one strategy the whole game?"
  *   *Map:* "Machiavelli says Pope Julius II succeeded because his impetuous nature matched the times. If the times had changed, he would have failed. *Virtù* is not a fixed trait (like 'be bold'); it is the flexibility to match the *qualità de' tempi*."

  **4. The Window (Opportunity)**
  *   *Ask:* "Who missed the Round 4 offer because you were arguing?"
  *   *Map:* "Fortune offers a window. If you hesitate to debate the 'right' moral choice, the window closes. *Virtù* is the capacity to seize the occasion (*occasione*)."

  **5. The Rating Gap (The Circularity)**
  *   *Display:* Write the average Phase 1 (Process) and Phase 2 (Outcome) scores on the board.
  *   *Ask:* "Why did Table 3's *Virtù* score jump from 4 to 9 after I revealed they won?"
  *   *Map:* "We define *virtù* as the skill that leads to success. But if success is 50% luck (the coin), then we are calling luck 'skill' after the fact. Machiavelli knows this. He writes for the Prince who *needs* to believe he is in control, even when he isn't."

  ---

  # 6. Honest Limitations (What Will Go Wrong)

  You asked for honesty about the simulation's failures. Put this in your back pocket for the end of class.

  **1. Dice vs. Conjuncture**
  *   *The Problem:* In the game, Fortune is a d6 (random chance). In Machiavelli, Fortune is not random; it is the *unarranged conjunction of circumstances*. It is structural, not stochastic.
  *   *The Fix:* Tell them: "The dice implies randomness. Machiavelli's Fortune is more like a tide. It's predictable in direction but overwhelming in force. The game uses dice for simplicity, but don't mistake Fortune for mere gambling."

  **2. The Boldness Bias**
  *   *The Problem:* You expect the bold tables to win. In the game, if the Tempo deck is weighted toward Impetuous (3 cards vs 2), boldness *is* statistically better.
  *   *The Fix:* Acknowledge this. "Machiavelli explicitly says it is better to be impetuous than cautious because fortune is a woman who yields to the bold. The game rigging reflects his bias, not objective political science."

  **3. The Circularity Remains**
  *   *The Problem:* The game demonstrates the *confusion* between skill and luck, but it doesn't solve it. Students may leave thinking "*Virtù* is just a myth."
  *   *The Fix:* You must close the loop. "Machiavelli doesn't solve the circularity. He weaponizes it. The Prince must *act* as if he has total control (*virtù*) to mitigate the half he doesn't (*fortuna*). The belief in *virtù* is itself a political tool."

  **4. Time Creep**
  *   *The Problem:* 75 minutes is razor-thin. Round discussions will drag.
  *   *The Fix:* Be a tyrant. Use a visible timer. Cut off discussion mid-sentence if needed. "The window closes now." This reinforces the lesson about decisiveness.

  # 7. Instructor Cheat Sheet (Hidden Info)

  *   **Tempo Deck Order (Example):** Impetuous, Cautious, Impetuous, Impetuous, Cautious.
  *   **Coin Flips (Example):** H, T, H, T, H.
  *   **Round 3 (Torrent):** Remind them verbally: "The river is rising."
  *   **Round 4 (Window):** Hand out the notes exactly when Round 4 starts. Start a 45-second countdown on your phone visibly.

  This setup requires no money, fits the room constraints, and directly targets the philosophical problem you identified without requiring you to lecture it into them. They will feel the circularity in their gut when they adjust their *Virtù* scores based on the final tally.
