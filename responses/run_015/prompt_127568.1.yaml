  2.  **Deconstruct the Three Options:**

      *   *Option 1 (Institutional Conditions/ASCL):* Focuses on the mechanism of decision-making and reversal. Why can they stop killing Mytileneans but not stop ships going to Sicily? This is about *time, sunk costs, and visibility*.
      *   *Option 2 (Dissent/Epistemic Friction):* Focuses on the Socrates case primarily, but relates to the others (did Cleon silence Diodotus? Did Alcibiades silence Nicias?). This is about *tolerance and truth-seeking*.
