answer: |-
  ### Lesson Plan: Diachronic Choice and Cyclic Preferences

  **Materials:**
  *   **Chips:** 10 poker chips per student (plastic, distinct colors).
  *   **Prize:** A raffle ticket for a $20 coffee card given to the student with the most chips at the end (or highest chip count relative to start).
  *   **Handout:** "Apartment Selection & Trading Record" (text below).
  *   **Room:** Arranged so students can see you clearly; aisles for you to walk during trading phases.

  **Minute-by-Minute Timeline (80 Minutes)**

  *   **00–10: Setup & Valuation.** Distribute handouts and chips. Explain the cover story (Apartment Hunting). Instruct students to use the "Majority Rule" (choose the apartment better on at least 2 of 3 features) to determine preferences. **Crucial:** They must privately fill out the "Willingness to Pay" section *before* any trading begins. Collect no papers yet.
  *   **10–30: Phase A (Fixed Horizon).** Announce: "The market will open exactly three times. I will walk the aisle. If you hold an option you prefer less than another available option, you may swap for 1 chip. After the third pass, trading ends permanently." Execute three passes (1→2, 2→3, 3→1).
  *   **30–50: Phase B (Indefinite Horizon).** Reset holdings to Option 1 and chip count to 5. Announce: "The market is now open indefinitely. I will walk the aisle repeatedly. Swaps cost 1 chip. I will not announce when trading stops. You may stop trading at any time by refusing a swap." Begin passes. Stop arbitrarily after 6–8 cycles or when chip counts critically deplete.
  *   **50–65: Role Reversal.** Pair students. Student A gives their recorded WTP sheet to Student B. Student B acts as the "Trader," deciding when to offer swaps to maximize chips taken from A, based *only* on A's recorded values. Student A must obey their own recorded preferences.
  *   **65–80: Debrief.** Discuss the outcomes, mapping specific moments to the philosophical concepts (forbidden terms introduced here).

  ***

  ### Handout Text

  **Part 1: The Options**
  You are choosing an apartment. Evaluate them based on **Rent**, **Commute**, and **Size**.
  *Rule:* Prefer the apartment that is better on at least **two** of the three features.

  | Feature | Apartment 1 | Apartment 2 | Apartment 3 |
  | :--- | :--- | :--- | :--- |
  | **Rent** | $1,300 (Worst) | $1,100 (Med) | $900 (Best) |
  | **Commute** | 10 min (Best) | 35 min (Worst) | 25 min (Med) |
  | **Size** | 450 sq ft (Med) | 650 sq ft (Best) | 550 sq ft (Worst) |

  **Part 2: Willingness to Pay (WTP)**
  *Complete this privately before trading starts.*
  Imagine you currently hold the first apartment listed. What is the maximum number of chips you would pay to swap for the second?
  1.  Swap Apt 1 for Apt 2: ______ chips
  2.  Swap Apt 2 for Apt 3: ______ chips
  3.  Swap Apt 3 for Apt 1: ______ chips

  **Part 3: Trading Log**
  *Record every swap you make.*
  | Phase | Start Option | End Option | Chips Spent | Chips Remaining |
  | :--- | :--- | :--- | :--- | :--- |
  | A | 1 | | | 5 |
  | B | 1 | | | 5 |

  ***

  ### Debrief Script & Logic Mapping

  **1. Phase A Analysis (The Sophisticated Stop)**
  *Ask:* "Who ended Phase A with Apartment 1 and fewer than 5 chips?" (These students traded 1→2→3→1).
  *Point:* You paid 3 chips to return to where you started. This is a loss.
  *Ask:* "Who stopped after one swap?" (Holding Apt 2, 4 chips).
  *Logic:* Look at your WTP sheet. Most of you wrote '1' or '2' for the first swap. If you were willing to pay 1 chip to move from 1 to 2, and you did so, you made a rational purchase. You improved your holding according to your rule.
  *Conclusion:* In Phase A, the "Pump" failed. Because you knew the end was coming, you could plan. A student who looks ahead sees that swapping all the way back is a loss, but swapping once is a gain. You are not irrational for trading once; you are irrational only if you fail to stop.

  **2. Phase B Analysis (The Policy Cycle)**
  *Ask:* "In Phase B, who planned to stop after one swap but found themselves swapping again?"
  *Logic:* You planned to hold Apt 2. But once you *held* Apt 2, your preferences (based on the 2-out-of-3 rule) told you Apt 3 was better. Your future self overruled your past plan.
  *The Cycle of Policies:*
  *   Policy "Stop at 0 swaps" (Keep Apt 1) is worse than "Stop at 1 swap" (Get Apt 2), because you prefer 2 to 1.
  *   Policy "Stop at 1 swap" is worse than "Stop at 2 swaps" (Get Apt 3), because you prefer 3 to 2.
  *   Policy "Stop at 2 swaps" is worse than "Stop at 3 swaps" (Get Apt 1), because you prefer 1 to 3.
  *   Policy "Stop at 3 swaps" is worse than "Stop at 0 swaps" (because you lose 3 chips for the same apartment).
  *Conclusion:* There is no stable plan. Every plan is dominated by another plan according to your own preferences. The "Greedy" policy (always swap) is the worst, but no other policy is maximal.

  **3. Role Reversal Insight**
  *Ask:* "Traders, could you extract chips from every partner?"
  *Point:* You could only extract chips if their preferences cycled. If a partner had transitive preferences (e.g., 1 > 2 > 3), you could swap them up to their best option, but then they would refuse further trades. Extraction requires the cycle.

  **4. The Moral**
  Introduce the terms now. The difficulty is not *transitivity* per se, but **diachronic consistency**. If rationality demands you choose what you prefer at every moment, cyclic preferences make it impossible to have a rational plan. To be rational over time, you must sometimes ignore your current preference to honor a past commitment (**Resolute Choice**) or predict your future weakness and restrict your options (**Sophisticated Choice**).

  ***

  ### What Will Go Wrong (And How to Handle It)

  1.  **Transitive Students:** Some students will not cycle. They might value Rent above all else (Lexicographic).
      *   *Fix:* In the debrief, isolate them. "You were immune to the pump. Why? Because your preferences had a structure that allowed a 'best' option. The problem only exists for those who cycled."
  2.  **Chip Indifference:** Some will treat chips as worthless and swap endlessly.
      *   *Fix:* Enforce the raffle prize visibly. If a student hits 0 chips, they are "bankrupt" and cannot trade further. This imposes a hard constraint.
  3.  **Refusal to Trade:** Some will distrust the game and keep Apt 1 throughout.
      *   *Fix:* Acknowledge this in debrief as a "default heuristic." Ask: "Did you refuse because you suspected a trap, or because you genuinely didn't prefer Apt 2?" This distinguishes strategic caution from preference structure.
  4.  **The "Never Trade" Conclusion:** Students may conclude the lesson is simply "don't trade."
      *   *Fix:* Remind them that in Phase A, trading *once* was profitable. The lesson is not avoidance, but **management**.

  ### Limitations Note

  This activity stages the *problem* of diachronic choice effectively, but it cannot fully resolve the *normative* debate between Resolute and Sophisticated choice within 15 minutes.
  *   **What it misses:** It shows that local preference maximization fails, but it does not prove that *Resoluteness* (binding oneself to a plan) is rational. Some students will argue that if your preferences change, you *should* update your plan.
  *   **Follow-up:** In the next lecture, you must supply the argument for why a rational agent should treat their past self's plan as authoritative. This activity provides the intuition pump; the next session must provide the philosophical justification for commitment.
