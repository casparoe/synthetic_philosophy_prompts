  **(Self-Correction during drafting):** I initially thought about calling Claim 2 "False." But Anti-Intellectualism is a respectable philosophical position. I should label it "Substantive & Debated." However, for the *engineering* context, it's less relevant than the *extraction method*. I will focus on the implication: even if it's ability, we can model the input/output.

