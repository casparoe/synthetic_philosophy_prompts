          2.  **Residue Report:** Deep dive into four specific pressure points (Split-Brain, Tracing/Observability, Consciousness/Qualia, Node Agency/Byzantine Faults).
          3.  **Verdict:** Assessment of whether the framework is too thin, the questions are indeterminate, or something else. Where to distrust the translation.
