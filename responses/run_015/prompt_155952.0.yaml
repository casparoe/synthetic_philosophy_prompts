      *   *Claim 2 (Instrumentalism):* Attributions are shorthand; no fact of the matter on "real" belief.
      *   *Claim 3 (Phenomenology):* The sticking point is conscious experience ("what it is like").
      *   *Claim 4 (Extended Mind/Environment):* Memory is in pheromones/nest structure (outside individual ants).
      *   *Claim 5 (Sub-agent Conflict):* Parts are goal-directed agents with ends that may not align with the whole.

  3.  **Drafting the Translation Manual (Iterative Process):**
      *   *Claim 1:* "Legitimate attribution." DS equivalent: "Service Level Objectives (SLOs) define expected state." Or "System behavior is consistent with high-level policy."
