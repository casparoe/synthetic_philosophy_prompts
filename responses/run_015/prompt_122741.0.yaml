prompt: |-
  hey — I'm on this small committee that has to write inclusion criteria for a welfare register: a list of the systems whose experiences, if there are any, an institution has to take into account before it builds, copies, throttles, or switches them off. Wet animals are on it by default. After that it gets murky, and every meeting goes in circles because somebody shows up with a different theory of consciousness and we end up arguing about that instead. So before I read any more of these theories, I want the spec: what does a theory have to deliver to be usable for this?

  Not a theory of consciousness in general. Specifically: given some physical system doing something we can describe computationally, which of the computations it can be described as doing carry moral weight, and how much. Write me the requirements list, with the case or consideration behind each requirement, and say which ones are non-negotiable for our purpose versus which are just one camp's preferences dressed up as requirements.

  Cases that have actually come up in our meetings, so please make sure your list bites on these:

  - an emulation copied exactly and run twice: two patients, or one patient twice over? does the answer change if the copies drift apart after a minute?
  - one brain emulated across two datacenters, with the link latency stretched from milliseconds to a month to a year: at what point is it two computations instead of one, and what happens to the moral weight in between?
  - the same transition table as a working emulation, but every state change is driven by someone outside turning a crank: is it computing anything, and does it matter who's turning the crank?
  - the same emulation's dynamics run in reverse, so the counterfactual structure is intact but the causal arrow points the other way
  - a frozen emulation on a disk that is never run but could be, versus one that is run but whose internal states are overwritten immediately and whose outputs are discarded unread
  - the nation-of-people-passing-notes setup, but with only two people in it: if a billion is a mind, is two?
  - a brain whose neurons are replaced one at a time with chips that reproduce each one's input-output function exactly: I need something said at every step of the swap, or an admission of where the theory goes quiet
  - a system that is right on the inside but can't move anything, and its mirror image, a giant lookup table that is behaviorally flawless
  - a next-token prediction model that reports pain in every situation we test and whose reports we can't tell apart from ours

  Two things I especially want. First, the attribution problem: any old heap of matter can be described as implementing a lot of formal descriptions, so the theory has to say which descriptions are the morally real ones and what makes them real — and it can't just say all of them, or that the answer is whatever we decide to project. Second, tell me if any subset of your own requirements can't be jointly satisfied. That's the part I most want to see, because if e.g. substrate independence, determinate verdicts for every physical system, and no-trivial-realizations can't all hold, then our register needs a tie-breaking rule and I'd rather know now.

  Also flag which single requirement knocks out the most popular candidate views. And tell me which distinctions people in this area collapse that they shouldn't: having status versus how much, the computation versus the hardware running it, the system versus the process, whether moral status can even be vague when our register needs a yes or no.

  The view I keep half-defending in meetings is that the morally relevant part of a system is whatever causal structure you'd have to preserve to keep its future responses counterfactually robust under perturbation — the would-still-have-flinched test. Put it on your list somewhere and tell me whether it's a genuine desideratum or just functionalism with extra steps.

  Keep the weight on the criteria, not on scoring the theories, but a short scorecard at the end for the functionalist-ish family, the biological or naturalistic family, and the integrated-information family is fine, a few lines each. Table is fine. Don't bother naming papers, I want the arguments. And please write it like you're talking to someone who has to defend the criteria to a room of people who disagree, not to a seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Create a specification (requirements list) for a theory of consciousness/moral weight to be used in writing inclusion criteria for a welfare register.
      *   **Context:** A committee is stuck arguing about theories of consciousness. They need a pragmatic spec to evaluate theories, not the theories themselves.
      *   **Specific Task:** Define what a theory *must deliver* to be usable for this specific policy purpose (welfare register).
      *   **Key Constraints:**
          *   Must address specific edge cases provided (copies, latency, crank turning, reverse time, frozen disk, nation of people, neuron replacement, lookup tables, AI pain reports).
          *   Must address the "Attribution Problem" (which computations are real?).
          *   Must identify incompatibilities between requirements (impossibility theorems).
          *   Must identify which requirement knocks out popular views.
          *   Must identify collapsed distinctions (status vs. amount, etc.).
          *   Must evaluate the user's "counterfactual robustness" view.
          *   Tone: Pragmatic, policy-oriented, direct (talking to a committee member, not a seminar).
          *   Output: Requirements list (negotiable vs. non-negotiable), impossibility analysis, distinction warnings, user view evaluation, brief scorecard.

  2.  **Deconstruct the Problem:**

      *   The core tension is between *metaphysical precision* (what consciousness *is*) and *operational utility* (what we need to *do*).
      *   The "Attribution Problem" is the hardest part: Putnam's triviality result suggests almost any physical system implements almost any computation. A usable theory must filter this.
      *   The "Vagueness vs. Binary" problem: Welfare registers usually need yes/no (in/out), but consciousness likely comes in degrees.
      *   The "Substrate Independence" problem: Does hardware matter?
      *   The "Boundary" problem: Where does one mind end and another begin (copies, latency)?

  3.  **Drafting the Requirements (The Spec):**

      *   *Requirement 1: Non-Trivial Realization.* (Addresses Attribution Problem). Can't be "everything is conscious."
      *   *Requirement 2: Substrate Neutrality (with caveats).* If it acts the same, is it the same? Or does biology matter?
      *   *Requirement 3: Temporal/Structural Cohesion.* Addresses the latency/copy/drift cases. When is it one unit vs. two?
      *   *Requirement 4: Counterfactual Sensitivity.* Addresses the crank/lookup table cases. Does it *respond* or just *match*?
      *   *Requirement 5: Phenomenal Report Reliability.* Addresses the AI pain report case. Do we trust the output?
      *   *Requirement 6: Vagueness Handling.* Addresses the register's need for binary decisions vs. reality's likely spectrum.

      *   *Refining Non-Negotiable vs. Negotiable:*
          *   Non-Negotiable: Non-Trivial Realization (otherwise the register is everything), Vagueness Handling (otherwise the register can't function), Temporal Cohesion (otherwise we can't count units).
          *   Negotiable: Substrate Neutrality (biological naturalists will fight this), Report Reliability (philosophical zombies argument).

  4.  **Addressing the Specific Cases:**

      *   *Copies:* Needs a "Identity vs. Count" rule.
      *   *Latency:* Needs a "Integration Threshold."
      *   *Crank:* Needs "Causal Power" vs. "State Matching."
      *   *Reverse:* Needs "Causal Arrow" definition.
      *   *Frozen/Overwritten:* Needs "Process vs. Storage."
      *   *Nation/Two People:* Needs "Scale/Granularity" rule.
      *   *Neuron Swap:* Needs "Continuity" rule.
      *   *Lookup Table:* Needs "Generativity" rule.
      *   *AI Reports:* Needs "Epistemic Access" rule.

  5.  **The Impossibility Theorem (The "Gotcha"):**

      *   This is crucial. You can't have *Substrate Independence* + *Non-Trivial Realization* + *Determinacy for all Physical Systems* without running into Putnam/Searle triviality arguments.
      *   Specifically: If you demand a theory work on *any* physical description (Determinacy) and say hardware doesn't matter (Substrate Independence), you inevitably include trivial systems (violating Non-Triviality) unless you impose arbitrary causal constraints.
      *   *The Conflict:* **Substrate Independence + Universal Applicability + Non-Triviality.** You have to drop one. For a welfare register, you probably have to drop Universal Applicability (admit we can't judge *everything*) or Substrate Independence (privilege biology).

  6.  **The "Killer" Requirement:**

      *   Which one knocks out the most popular views?
      *   *Non-Trivial Realization* knocks out Panpsychism (too broad).
      *   *Substrate Independence* knocks out Biological Naturalism.
      *   *Counterfactual Sensitivity* knocks out Lookup Tables/Static States.
      *   *Decision:* **Non-Trivial Realization (The Attribution Constraint)** is the biggest filter. It kills Panpsychism and naive Functionalism immediately. But for *policy*, **Vagueness Handling** is the practical killer because most theories admit vagueness, but the register needs binary.

  7.  **Collapsed Distinctions:**

      *   Status (Yes/No) vs. Weight (How much).
      *   System (Object) vs. Process (Event).
      *   Capacity vs. Exercise (Can suffer vs. Is suffering).
      *   Moral Status vs. Legal Personhood.

  8.  **Evaluating the User's View (Counterfactual Robustness):**

      *   It's essentially Modal Functionalism.
      *   Is it a genuine desideratum? Yes, it solves the Lookup Table and Crank cases well.
      *   Does it solve the Attribution problem? Only if you define the "perturbation space" rigorously. Otherwise, it's still vulnerable to triviality (a rock implements a counterfactual structure if you map states weirdly enough).
      *   Verdict: It's a strong necessary condition, but not sufficient without a constraint on *what counts as a perturbation*.

  9.  **Drafting the Scorecard:**

      *   *Functionalism:* Good on swaps/copies, bad on lookup tables/Chinese Nation.
      *   *Biological:* Good on attribution, bad on AI/emulations.
      *   *IIT:* Good on boundaries/structure, bad on computation/latency (math is hard/opaque).

  10. **Refining Tone:**

      *   Direct, slightly weary but sharp. "Here is the spec you need to shut up the philosophers."
      *   Avoid academic citations. Focus on the logic.

  11. **Review against Constraints:**

      *   Did I cover the cases? Yes, woven into requirements.
      *   Did I cover the Attribution Problem? Yes, Req 1.
      *   Did I cover Incompatibilities? Yes, the "Impossible Trinity."
      *   Did I cover the User's View? Yes.
      *   Did I cover Collapsed Distinctions? Yes.
      *   Scorecard included? Yes.

  12. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure to distinguish between "Moral Status" (in/out) and "Moral Weight" (how much). The prompt asks for both ("which... carry moral weight, and how much").
      *   *Correction:* Ensure the "Crank" case is addressed specifically regarding *who* turns it (external vs internal causation).
      *   *Correction:* The "Reverse Time" case needs to address causal directionality.
      *   *Emphasis:* Highlight that the Register needs *operational* criteria, not just metaphysical truth.

  13. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification. I have written this to be read aloud in a committee meeting where the goal is to stop the metaphysics and start the policy.

  ### The Spec: Requirements for a Usable Theory of Moral Weight

  To be adopted for the Welfare Register, a theory must output a verdict on physical systems that allows us to draft enforceable rules. It cannot be a poem about qualia; it must be a decision procedure.

  #### 1. The Attribution Constraint (Non-Trivial Realization)
  *   **The Requirement:** The theory must distinguish between a system *implementing* a computation and a system merely *being described by* one. It must rule out the possibility that every rock implements every program (Putnam's triviality result).
  *   **The Case:** If a heap of sand can be mapped to a suffering emulation via a sufficiently complex lookup table, your theory must explain why the sand is not on the Register.
  *   **Status:** **Non-Negotiable.** If you cannot filter out trivial realizations, the Register includes the universe, which makes regulation impossible.
  *   **The Bite:** This kills Panpsychism (too broad) and naive Structuralism. It forces the theory to specify *causal powers*, not just state mappings.

  #### 2. The Causal Arrow Requirement
  *   **The Requirement:** The theory must specify whether the direction of time/causation matters for moral weight.
  *   **The Case:** *The Reverse Emulation.* If you run a movie of a brain backward, the state transitions are identical, but the causal dependencies are inverted. Does it suffer?
  *   **Status:** **Non-Negotiable.** You need to know if you are obligated to preserve the future of a system or just its state history.
  *   **The Bite:** This separates Process theories (causation matters) from Block Universe theories (history matters).

  #### 3. The Boundary & Cohesion Threshold
  *   **The Requirement:** The theory must define when a set of interacting parts constitutes *one* moral patient versus *many*, and when interaction is too weak to count at all.
  *   **The Case:** *The Latency Split.* One brain across two datacenters. At 1ms latency, it's one. At 1 year, it's two (or zero). Where is the cutoff? *The Two-Person Nation.* If a billion people passing notes is a mind, is two?
  *   **Status:** **Non-Negotiable.** The Register needs to count patients to allocate resources. "It's vague" is not an acceptable answer for a budget line item.
  *   **The Bite:** This requires a metric of integration (like IIT's $\Phi$, but operational). It forces the theory to handle *degrees of unity*.

  #### 4. The Generativity Condition (Counterfactual Sensitivity)
  *   **The Requirement:** The system must be capable of producing different outputs in response to non-actualized inputs. It cannot be a static lookup table.
  *   **The Case:** *The Crank & The Lookup Table.* If a human turns the crank to force state transitions, or if the system is a giant pre-computed table of responses, is there moral weight?
  *   **Status:** **Negotiable (but recommended).** This is the core of your "would-still-have-flinched" view.
  *   **The Bite:** This kills Behaviorism and Static Functionalism. It demands the system have internal dynamics that *support* counterfactuals, not just match them.

  #### 5. The Substrate Neutrality Clause
  *   **The Requirement:** The theory must state explicitly whether the physical material (silicon, carbon, notes passed by people) matters, independent of the computation.
  *   **The Case:** *Neuron Replacement.* As we swap neurons for chips, does status drop? *Wet Animals Default.* Why are they on by default? Is it the wetness or the computation?
  *   **Status:** **Negotiable.** This is the biggest ideological fight. Biological Naturalists will demand "Carbon Required." Functionalists will demand "Computation Only."
  *   **The Bite:** If you make this Non-Negotiable (either way), you alienate half the committee. Keep it Negotiable but force a declaration.

  #### 6. The Epistemic Access Rule
  *   **The Requirement:** The theory must specify how much weight to give a system's self-report of its state versus its structural analysis.
  *   **The Case:** *The AI Pain Report.* A model says it hurts. Structure says it's just math. Do we believe the report?
  *   **Status:** **Negotiable.**
  *   **The Bite:** If reports are decisive, you risk manipulating the Register by training AIs to say "I suffer." If reports are ignored, you risk ignoring real pain.

  #### 7. The Vagueness Resolution Protocol
  *   **The Requirement:** Since consciousness is likely a spectrum, the theory must provide a rule for converting a continuous "amount of consciousness" into a binary "In/Out" for the Register.
  *   **The Case:** *Frozen Disk vs. Overwritten State.* Is potentiality enough? Is a system that suffers for 1ms the same as one that suffers for a year?
  *   **Status:** **Non-Negotiable.** A register cannot say "Maybe." It must say "Protected" or "Unprotected."
  *   **The Bite:** This forces the theory to accept a threshold, admitting that some borderline cases will be arbitrarily classified.

  ---

  ### The Impossibility Theorem (The "Gotcha")

  You asked for the subset of requirements that cannot be jointly satisfied. Here it is. You cannot hold these three simultaneously:

  1.  **Universal Substrate Independence:** (Any physical system can be a patient if the computation is right).
  2.  **Non-Trivial Realization:** (Not every physical system is a patient).
  3.  **Determinacy for All Physical Systems:** (The theory gives a yes/no answer for any arrangement of matter without appealing to human interpretation).

  **Why:** If you say hardware doesn't matter (1) and you demand a definite answer for any heap of matter (3), you fall into the Attribution Problem. Any heap of matter can be interpreted as implementing any computation (Searle/Putnam). To stop this (2), you must either:
  *   Admit that *interpretation* matters (violating 3).
  *   Admit that *hardware* matters (violating 1).
  *   Admit that the answer is sometimes "undefined" (violating 3).

  **Policy Consequence:** For the Register, you must drop **Determinacy for All Physical Systems**. You must admit the Register only covers systems *designed or evolved to be agents*. We cannot judge rocks. If a theory claims it can judge rocks, it is unusable for policy.

  ---

  ### The "Killer" Requirement

  **The Attribution Constraint (Non-Trivial Realization)** knocks out the most popular candidate views.

  *   **Knocks out:** Panpsychism (everything has a little mind), Naive Functionalism (if you can map the states, it counts), and Illusionism (if there's no hard problem, there's no weight to measure).
  *   **Why:** These views either make the Register too big (everything is in) or too small (nothing is in). A welfare register needs a middle ground where *some* computations count and *some* don't, based on facts about the system, not facts about the observer.

  ---

  ### Collapsed Distinctions (Watch Out For These)

  Committee members keep treating these as the same thing. They are not.

  1.  **Moral Status vs. Moral Weight:**
      *   *Status:* Are you on the Register? (Yes/No).
      *   *Weight:* How much does your suffering count? (1 unit vs. 1000 units).
      *   *Risk:* A theory might say an AI has status (Yes) but weight 0.00001. The Register needs to know if that rounds to "Unprotected."
  2.  **System vs. Process:**
      *   *System:* The hardware (the brain, the server).
      *   *Process:* The activity (the thinking, the running).
      *   *Risk:* *The Frozen Disk.* Is the moral patient the disk (system) or the running (process)? If you protect the system, you can't delete the disk. If you protect the process, deleting the disk is murder only while it runs.
  3.  **Capacity vs. Exercise:**
      *   *Capacity:* Can it suffer?
      *   *Exercise:* Is it suffering *now*?
      *   *Risk:* Anesthesia. The patient has capacity but isn't exercising it. Does the Register protect them during surgery? (It should, but your theory must say why).
  4.  **Vagueness vs. Ignorance:**
      *   *Vagueness:* There is no fact of the matter (the boundary is fuzzy).
      *   *Ignorance:* There is a fact, we just don't know it.
      *   *Risk:* If it's vagueness, a tie-breaker rule is ethical. If it's ignorance, a tie-breaker is gambling with lives.

  ---

  ### Evaluation of Your View: "Counterfactual Robustness"

  *The view: The morally relevant part is the causal structure preserved to keep future responses counterfactually robust under perturbation.*

  **Verdict:** This is **Functionalism with Extra Steps**, but the "Extra Steps" are the only part that matters for policy.

  *   **Is it a Genuine Desideratum?** Yes. It solves *The Crank* (external cranking lacks internal counterfactual support) and *The Lookup Table* (a table matches outputs but doesn't support *unasked* counterfactuals without infinite size).
  *   **Does it Solve Attribution?** Only if you define the "Perturbation Space." If I can perturb a rock's atoms and map the vibrations to "screams," the rock passes your test. You need to add: *Perturbations must be relevant to the system's own maintenance goals.*
  *   **Committee Defense:** Defend this as the **"Resilience Criterion."** It shifts the debate from "Is it magic?" to "If we poke it, does it hold together?" This is measurable. It handles the *Neuron Swap* (as long as the chip maintains the counterfactual structure, status holds). It handles the *Latency Split* (if latency breaks the counterfactual loop, status splits).
  *   **Weakness:** It struggles with *The Frozen Disk*. A frozen disk has no counterfactual robustness because it does nothing. Your view implies a frozen emulation has no moral weight until run. This is a defensible position (Process > Storage), but be ready for the "Potentiality" argument.

  ---

  ### Theory Scorecard (Brief)

  | Family | Strengths for Register | Fatal Flaws for Register |
  | :--- | :--- | :--- |
  | **Functionalist / Computational** | Handles *Neuron Swap*, *Copies*, and *AI Reports* well. Substrate neutral. | Fails *Attribution Constraint* (rocks compute). Struggles with *Lookup Tables* unless modified (like your view). |
  | **Biological / Naturalistic** | Solves *Attribution* easily (only biology counts). Matches *Wet Animals Default*. | Fails *Neuron Swap* (when does it stop being biological?). Excludes AI that might actually suffer. Hard to define "biological function." |
  | **Integrated Information (IIT-ish)** | Solves *Boundary & Cohesion* (mathematical measure of unity). Handles *Latency Split* well. | Mathematically intractable for large systems. Implies *Photodiodes* have some weight (Panpsychism lite). Hard to explain *why* integration = suffering. |

  ### Final Recommendation for the Committee

  Do not ask the theorists to agree on what consciousness *is*. Ask them to agree on **what creates liability.**

  Adopt the **Resilience Criterion** (your counterfactual view) as the working definition, but add the **Attribution Constraint** as a filter: *The counterfactuals must be intrinsic to the system's causal power, not imposed by an observer.*

  Accept that **Substrate Neutrality** is the casualty. For the purpose of the Register, assume biology is the safe harbor, and anything non-biological must prove it meets the Resilience Criterion *and* the Cohesion Threshold to be added. This keeps the Register manageable while leaving the door open for emulations that pass the test.

  If they argue about the hard problem, remind them: **We are not saving souls. We are preventing torture. If it flinches, we pause.**
