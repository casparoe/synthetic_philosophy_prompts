answer: |-
  This is a fantastic problem. You are describing a phenomenon that sits right at the friction point between formal semantics (how words map to world) and linguistic anthropology (how words map to social practice). You are correct to feel that standard "fuzzy boundary" or "prototype" stories are insufficient; those models predict hesitation and gradients, whereas your consultants are giving you fast, categorical, yet context-shifting judgments.

  Here is a breakdown of what this is, what to call it, how it differs from its neighbors, and a concrete elicitation design to distinguish your two competing hypotheses.

  ### 1. What is it? (Classification & Naming)

  In formal semantics, this falls under the literature on **Gradable Nouns** (see work by Galit Sassoon, 2013, 2016) and **Context-Sensitive Sortals**. Standard sortals (like *dog* or *chair*) are usually treated as having stable extension. Gradable adjectives (like *tall*) have context-sensitive standards. Your data suggests these nouns are behaving like **covert gradable adjectives**.

  However, since you are in anthropology and need a label that captures the structural nature of the system for Chapter 3, I recommend coining or adopting:

  **Relative Sortals** (or **Ordinal Sortals**)

  *   **Why:** It captures that they function as kinds/sortals (nouns) but their extension is determined *relative* to a local set (the comparison class), often functioning ordinally (1st finest, 2nd finest) rather than absolutely (40mm).
  *   **Alternative:** **Comparison-Class Dependent Sortals**. (Accurate, but clunky).
  *   **Anthropological precedent:** This challenges the classic ethnoscience assumption (Berlin, Conklin) that folk taxonomies are stable, named partitions of a domain. You might frame this as a **Dynamic Folk Taxonomy** or **Situational Taxonomy**.

  ### 2. Differentiation from Neighbors

  You rightly ruled out vagueness and polysemy. Here is the precise theoretical boundary work you need for the chapter:

  *   **Vs. Vagueness:** Vagueness implies a "borderline zone" where truth values are indeterminate *within a single context*. Your data shows **sharp boundaries within a context** that **shift between contexts**. This is **Context-Sensitivity**, not Vagueness. (See: Stanley & Szabo 2000 on nominal context-sensitivity).
  *   **Vs. Gradable Adjectives:** Adjectives (*tall, big*) syntactically license comparison classes ("tall *for a jockey*"). Your nouns do not. They *covertly* incorporate the comparison class. This makes them **Implicitly Gradable Nouns**.
  *   **Vs. Prototype Theory:** Prototype theory predicts reaction-time gradients and hedging ("It's a *kind of* taru"). Your consultants are categorical. This suggests the cognitive mechanism is **Classification by Contrast** (Structuralism) rather than **Classification by Resemblance**. The meaning of *taru* is "not *pila* and not *méska*," given the available set.
  *   **Vs. Polysemy:** Polysemy implies distinct senses (e.g., *bank* of river vs. *bank* for money). Here, the sense is unitary; only the **extension** shifts systematically.

  ### 3. The Asymmetry: Functional Anchoring vs. Scalar Openness

  Your hunch about the asymmetry (fine end rigid, coarse end elastic) is the key to the system's logic.

  *   **The Fine End (*Pila*):** This is **Functionally Anchored**. *Pila* isn't just "small mesh"; it is "the mesh for sardines." Because the biology of sardines doesn't change, the lower bound of *pila* is pinned to a real-world constraint. This is why the new monofilament net didn't get absorbed; it likely violated the functional constraint (e.g., too fine, catches trash, breaks) or the material constraint ("traditional gear").
  *   **The Coarse End (*Won*):** This is **Scalarly Open**. *Won* is defined negatively as "coarser than *méska*." There is no "largest fish" constraint in the same way, or the utility of coarse nets is general-purpose. Therefore, *Won* acts as a **trash can category** for the upper bound.

  **Theoretical Synthesis:** You have a **Hybrid System**. *Pila* is a **Functional Kind** that serves as the **Anchor** for a **Relative Scale** (*Taru, Méska, Won*). The upper categories are **Ordinal Ranks** relative to *Pila*.

  ### 4. Distinguishing "Rank" vs. "Threshold" (The Elicitation)

  You asked for a way to tell the **Rank in Local Ordering** story apart from the **Fixed Threshold + Moving Anchor** story.

  *   **Hypothesis A (Rank/Ordinal):** The words map to positions (1st, 2nd, 3rd, 4th) in the available set.
  *   **Hypothesis B (Threshold/Standard):** The words map to absolute mesh sizes, but the "Standard" for what counts as *pila* shifts based on the average mesh size of the context.

  **The Discriminating Case: The "Missing Rung" Experiment**

  You need to manipulate the *density* of the set, not just the range.

  **Setup:**
  Create a physical set of 5 nets that span the traditional range (e.g., 30, 40, 50, 60, 70 mm).
  Establish the baseline labels (e.g., 30=*Pila*, 40=*Taru*, 50=*Méska*, 60/70=*Won*).

  **Condition 1 (The Gap):**
  Remove the 30mm net (*Pila*). Present the consultant with {40, 50, 60, 70}.
  *   **Ask:** "What kind of net is this 40mm one?"
  *   **Rank Prediction:** It becomes *Pila*. (It is now the finest in play).
  *   **Threshold Prediction:** It stays *Taru*. (It does not meet the absolute/functional threshold for *Pila*, even if it is the finest available).

  **Condition 2 (The Squeeze):**
  Keep the 30mm and 70mm, but remove the middle nets. Present {30, 70}.
  *   **Ask:** "If I had to put this 70mm net into one of the four categories, which is it?"
  *   **Rank Prediction:** It might get labeled *Méska* or *Won* depending on if the system compresses.
  *   **Threshold Prediction:** It stays *Won*.

  **Condition 3 (The "Traditional" Control):**
  This addresses your asymmetry data. Introduce the "New Fine Net" (10mm) *alongside* the standard set {30, 40, 50, 60, 70}.
  *   **Ask:** "Is this 10mm net a *pila*?"
  *   **Rank Prediction:** Yes, it is the finest.
  *   **Threshold/Anchor Prediction:** No, it is "new kind." (Because *Pila* is anchored to tradition/function, not just ordinality).

  **Why this matters:**
  Your Session 1 vs. Session 2 data (45mm shifting from *Méska* to *Pila*) looks like **Rank**.
  Your New Monofilament data (10mm not becoming *Pila*) looks like **Threshold**.

  **The Resolution:**
  The Comparison Class is not "nets physically present." It is "**culturally salient nets in play.**"
  *   In Session 2, the 20-40mm nets were absent, so the 45mm net was the **Salient Finest**.
  *   In the Monofilament case, the 10mm net was **Not Salient/Traditional**, so it was excluded from the Comparison Class, leaving the 30mm net as the **Salient Finest**.

  ### 5. Recommendation for Chapter 3

  **Name:** **Relative Sortals** (with **Functional Anchoring**).

  **Definition:** A Relative Sortal is a noun whose extension is determined by its position within a contextually salient, ordered set of alternatives, rather than by fixed necessary-and-sufficient conditions. However, the lowest rank (the "fine" end) may be anchored to a functional prototype that resists ordinal shifting.

  **Edges:**
  *   **Counts as:** Net terms in your field site; potentially "rich/poor" (when used as nouns: *the rich*); size terms in other artifact domains (e.g., pottery sizes in a specific kiln load).
  *   **Doesn't count:** *Dog* (biological kind); *Tall* (adjective with syntactic comparison slot); *Bachelor* (absolute threshold).

  **Theoretical Payoff:**
  This allows you to argue that the community's taxonomy is not a static map of the world (the classic ethnoscience view), nor is it purely vague. It is a **tool for distinction**. The words exist to distinguish gear *relative to the task at hand*. When the task (or the available gear) changes, the distinctions shift to maintain utility. This aligns well with practice theory (Bourdieu) or ecological psychology (Gibsonian affordances), if you need to bridge to the broader anthropology committee.

  **Concrete Prediction to Test:**
  If you bring a 35mm net to a fisherman who *only* owns 50mm+ nets, he should call it *Pila*. If you bring a 35mm net to a fisherman who owns 20mm nets, he should call it *Taru*. This is the **Speaker-Dependent Inventory Effect** you noted in observation (3). This is the strongest evidence for the **Relative Sortal** analysis. The "threshold" is internal to the speaker's inventory, not external in the world.

  **Final note:** Be careful with the word "Indexical." While this is context-dependent, "indexical" usually implies reference to the speech act (I, You, Here). This is **Context-Sensitive Semantics**. Stick with **Relative Sortals**. It's precise, defensible, and coins a term that does the work you need.
