  **TERMS OF SERVICE AND TEMPORAL LIABILITY WAIVER**

  **1. ACCEPTANCE OF TERMS AND DEFINITIONS**
  By accessing **The Garden of Forking Paths** (the "Service"), the **Subscriber** agrees to be bound by this Agreement. The **Subscriber** acknowledges that the Service provides access to an infinite network of coexisting futures rather than a linear succession of moments. The **Present** is defined herein not as a point, but as a nodal intersection where multiple **Timelines** diverge, converge, or remain parallel. Payment processing may occur prior to, during, or subsequent to the consumption of the Service, depending on the temporal velocity of the selected **Timeline**.

  **2. TEMPORAL TOPOLOGY AND ACCESS**
  2.1. The **Subscriber** acknowledges that all possible outcomes of any given event occur simultaneously within the **Service**. Access to a specific **Timeline** does not negate the existence of alternative **Timelines**.
  2.2. The **Company** makes no warranty regarding the consistency of historical data across different **Branches**. Discrepancies in memory, physical law, or geopolitical status between **Timelines** are features of the Service, not defects.

  **3. SUBSCRIBER IDENTITY AND BRANCHING EVENTS**
  3.1. **Account Integrity.** In the event that a **Subscriber** undergoes ontological branching, resulting in two or more distinct versions of the **Subscriber** that never reconverge, each branch shall be considered a separate legal entity holding a distinct license to the **Service**.
  3.2. **Experience Ownership.** Notwithstanding Section 3.1, the original **Subscriber** entity (defined as the version existing at the point of subscription initiation) retains exclusive ownership of all experiences, memories, and data accumulated by any branched version. Branched versions indemnify the original **Subscriber** against claims arising from actions taken in divergent **Timelines**.
  3.3. **Billing.** Subscription fees are charged per unique consciousness. If branching results in duplicate consciousnesses, multiple charges may apply retroactively across all affected **Timelines**.

  **4. EXISTENCE VERIFICATION AND REFUNDS**
  4.1. **Non-Existence Clauses.** The **Subscriber** may navigate to a **Timeline** in which the **Subscriber** was never born. In such instances, identity verification protocols may fail.
  4.2. **Refund Calculation.** No refunds shall be issued for access to **Timelines** where the **Subscriber** does not exist. Since the **Subscriber** cannot exist to request a refund in said **Timeline**, and the original **Subscriber** has received the Service (observation of non-existence), the transaction is deemed complete. Refunds are calculated based on the subjective duration of experience, which may be zero, infinite, or negative.

  **5. LIABILITY FOR CAUSAL LOOPS**
  5.1. **Circular Sequences.** The **Company** assumes no liability for circular loops in which an identical event sequence repeats without discernible origin or terminus.
  5.2. **Déjà Vu.** Reports of déjà vu are classified as evidence of loop exposure. The **Subscriber** waives the right to claim damages for psychological distress resulting from the sensation of having lived the same moment indefinitely.
  5.3. **Termination.** The **Company** reserves the right to terminate access if a **Subscriber** becomes trapped in a loop that threatens the structural integrity of the **Labyrinth**.

  **6. DIRECTION OF CAUSALITY**
  6.1. **Omnidirectional Flow.** The **Subscriber** acknowledges that causality within the **Service** does not run exclusively forward. Causality may operate backward, forward, or laterally across the network.
  6.2. **Effect Preceding Cause.** The **Company** is not liable for consequences arising from effects that precede their causes. The **Subscriber** agrees to accept responsibility for actions they have not yet committed but which have already produced results.
  6.3. **Lateral Influence.** Changes made in one **Timeline** may propagate laterally to unrelated **Timelines** without causal linkage. The **Subscriber** waives claims regarding collateral alterations to their personal history arising from lateral causal drift.

  **7. GOVERNING LAW AND JURISDICTION**
  7.1. **Jurisdiction.** This Agreement shall be governed by the laws of the **Labyrinth**, which exist in all places and no places simultaneously.
  7.2. **Dispute Resolution.** Any disputes arising from this Agreement shall be resolved by arbitration in a **Timeline** mutually agreeable to both parties. If no such **Timeline** exists, the dispute shall be considered never to have occurred.
  7.3. **Severability.** If any provision of this Agreement is found to be invalid in one **Timeline**, it shall remain in full force and effect in all other **Timelines** where it is legally enforceable.

  **8. ACKNOWLEDGMENT OF RISK**
  The **Subscriber** hereby accepts the risk that navigating the **Garden** may result in the fragmentation of the self, the erosion of linear memory, or the realization that the **Subscriber** is merely a character in a novel written by Ts'ui Pên. The **Company** disclaims all liability for existential dread.
