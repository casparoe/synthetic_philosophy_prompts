prompt: |-
  hey, im a junior and we did a unit on labor stuff in gov class and i keep thinking about the 1981 air traffic controllers strike (PATCO, i think thats the acronym). from what i remember they were federal employees so striking was illegal, they walked out on august 3 1981 anyway, Reagan gave them 48 hours to come back and then fired something like 11,000 of them, flights kept going on a reduced schedule with supervisors and military controllers filling in, and most of them never got their jobs back (i think the rehiring ban lasted into the 90s). just assume that's roughly right and go from there.

  i made up this little model for how strikes work and i want to see if it survives this case. three dials:
  - pain: how much money or trouble the walkout costs the employer per day
  - the replacement clock: how long the employer needs before it can run the place with other people
  - cover: wether the public, the politicians and the law are still on your side

  my claim is that a strike is won when pain is high and the workers can last longer than the replacement clock, but that cover is the dial that actually sets the other two, because cover decides who else walks onto the field and whose clock gets shortened. and a second claim i like way more: being essential is a trap. exactly the workers who can cause the most pain are the ones who burn cover the fastest, because the pain lands on ordinary people and not on the boss, so the most "powerful" strikes are the ones most likely to get crushed.

  so run PATCO through that. who the players really are (is the employer the FAA, or Reagan, or the flying public?), what each dial looked like that august, whether the model gets the outcome right and whether it gets it right for the right reasons, and where it breaks or just has nothing to say. my teacher keeps saying PATCO basically killed big strikes in america — is that even the kind of thing this model can represent, or is it blind to the difference between winning one strike and helping the labor movement overall? and does the case show my essentiality-trap idea is right, or does it show that cover just dominates everything and pain and clocks barely matter at all?

  one cross-check i want: the flint sit-down strike in 1936-37, where the autoworkers sat inside the GM plant instead of picketing outside and it ended with GM recognizing the UAW in early 1937. does the same model explain why that one went the other way, or do i need a fourth dial for the difference between occupying the workplace and leaving it?

  format thing: lead with your actual bottom line in the first sentence, then give the reasoning after. no preamble, no restating my question back at me, and please don't be polite about the model — if its junk or if one of the dials is doing no work, say so.
