answer: |-
  Your hypothesis is astute and cuts through the technical accumulation of the last forty years. The stalemate over the Principal Principle (PP) is indeed best understood not as a failure of argumentation, but as a collision between two distinct philosophical projects that have been conflated under a single label.

  Here is a diagnosis of the disagreement, an analysis of the hidden questions driving the impasse, and a proposal for what genuine progress would look like.

  ### 1. Diagnosis: A Category Error Masquerading as Metaphysics

  The disagreement is **substantive**, but not in the way the participants usually frame it. It is not merely about whether Humeanism is true or false; it is about whether the Principal Principle is a **metaphysical constraint on the concept of chance** or an **epistemic norm for agents embedded in the world**.

  Your distinction between the *Synchronic Coherence Constraint* and the *Diachronic Updating Rule* maps precisely onto the fault lines in the literature:

  *   **The Synchronic Camp (Lewis 1980, Early Hall):** They treat the PP as a conceptual truth about what "chance" means. If a quantity does not constrain rational credence in this structural way, it isn't *chance*. This reading demands that chance propositions be admissible inputs for conditionalization.
      *   *Vulnerability:* As you noted, this breaks under Humean Supervenience. If chances supervene on the entire history of the world (including the future), then knowing the present chance gives you inadmissible information about the future (the "undermining future"). To maintain synchronic coherence, you must have "God's eye" access to chance propositions that are metaphysically insulated from the outcomes they govern.
  *   **The Diachronic Camp (Ismael, Hoefer, Late Lewis):** They treat the PP as a rule for how agents should react to physical theories. We never encounter "naked" chance propositions; we encounter them via frequencies, symmetries, or dynamical laws.
      *   *Vulnerability:* As you suspected, this risks triviality. Jenann Ismael (2008) argues that if we treat chance information as just another piece of evidence processed via standard conditionalization, the PP becomes a theorem of probability theory, not a substantive bridge principle. It saves the norm but dissolves the metaphysical mystery.

  **The Verdict:** The two sides are answering different questions.
  1.  **Metaphysicians** ask: *What kind of worldly feature could possibly play the role of guiding belief?* (Answer: Only a non-Humean primitive, or a Humean best-system that sacrifices the original PP).
  2.  **Epistemologists** ask: *How do scientists actually use probability claims to manage expectation?* (Answer: By treating them as reliable guides derived from theory, without worrying about undermining futures).

  The impasse exists because the Synchronic camp demands the Diachronic camp explain how their "chance" is objective (not just subjective expectation), while the Diachronic camp demands the Synchronic camp explain how humans could ever access the "chance" they describe (given undermining).

  ### 2. The Hidden Variable: Information Access and Admissibility

  The "hidden empirical or formal question" driving the work is about **information access**.

  The original PP formulation, $C(A | Ch(A)=x) = x$, assumes that the proposition $Ch(A)=x$ is a coherent object of belief that can be plugged into a conditional.
  *   **For Non-Humeans:** This is unproblematic. Chance is a distinct ontological category. You can believe in it without believing in the future outcomes it governs.
  *   **For Humeans:** This is incoherent. To believe $Ch(A)=x$ *just is* to have beliefs about the pattern of outcomes (including future ones).

  The debate over **admissible evidence** is the proxy war for this issue.
  *   When Lewis introduces the "admissibility" clause, he is trying to patch the Synchronic reading. He admits that some information (like the future) makes the principle fail.
  *   When critics (like Hall 2004) argue that *all* evidence is admissible relative to the right chance function, they are shifting toward the Diachronic reading. They are saying: "If you have evidence that undermines the chance, then you simply have a *different* chance function relevant to your situation."

  This reveals the hidden formal question: **Is there a single chance function for a world, or a family of chance functions relative to an agent's information state?**
  *   If there is **one** function (Synchronic/Metaphysical), Humeanism fails the PP.
  *   If there is a **family** of functions (Diachronic/Epistemic), the PP holds, but "objective chance" loses its singular metaphysical weight.

  ### 3. What Counts as Progress?

  Given this diagnosis, a formal proof showing the incompatibility of the two readings (which we essentially already have via the Undermining Argument) will not resolve the debate. Progress requires a **conceptual dissolution** of the demand for a monolithic Principal Principle.

  Here are three specific pathways to progress:

  #### A. Adopt Hall's "Two Concepts of Chance"
  Ned Hall (2004) explicitly argues that we have conflated two distinct concepts: **Epistemic Chance** (which guides belief and satisfies the PP) and **Metaphysical Chance** (which satisfies Humean supervenience).
  *   **Progress Condition:** The literature moves from trying to save *The* Principal Principle to specifying *which* concept of chance is being deployed in a given context. If we are doing physics, we use Metaphysical Chance (Humean). If we are doing decision theory, we use Epistemic Chance (PP-compliant). Acknowledging they come apart dissolves the pressure to force them together.

  #### B. The "Self-Locating" Shift (Ismael's Approach)
  Jenann Ismael suggests the PP is not a bridge between *world* and *mind*, but a rule about how to locate oneself within a theory. We don't learn $Ch(A)=x$; we learn "According to theory T, the chance of A is x."
  *   **Progress Condition:** Reformulating the PP not as $C(A | Ch(A)=x) = x$, but as a constraint on how we accept theories. This validates the Diachronic reading without trivializing it, by making the principle about **theory choice** rather than **belief updating**. Progress here looks like a formal integration of the PP into Bayesian model selection, rather than treating it as an external axiom.

  #### C. Acceptance of Incompatibility (The "Error Theory")
  We might conclude that the intuition driving the Synchronic PP (that rational credence *must* align with objective chance) is a relic of pre-Humean metaphysics.
  *   **Progress Condition:** A rigorous argument showing that Humean Objective Chance (HOC) requires a *different* norm of deference—one that looks like the PP but allows for "undermining" to be handled by standard conditionalization on frequencies. This would mean admitting Lewis was wrong to think the PP was analytic of chance.

  ### Conclusion

  The debate has stalled because it is trying to solve a **trilemma** with a single principle. The three horns are:
  1.  **Humean Supervenience** (Chance reduces to patterns of events).
  2.  **The Principal Principle** (Credence defers to Chance).
  3.  **Human Epistemic Access** (We learn about chance via evidence about events).

  You cannot hold all three.
  *   Lewis kept (2) and (3), and tried to save (1) with the "New" PP (which effectively modified 2).
  *   Primitivists keep (1) false to save (2) and (3).
  *   Humeans like Hoefer keep (1) and (3), and modify (2) to be less demanding.

  **Final Verdict:** The disagreement is substantive, but it is substantive about **theoretical role**, not just metaphysics. The "Principal Principle" is a placeholder for a connection that may not exist in the form originally imagined. Progress will not come from a better formulation of the PP, but from **splitting the concept**. We should expect no resolution to the *original* debate because the object of the debate (a single principle satisfying both synchronic coherence and diachronic humility under Humeanism) is likely an impossible object. The productive move is to stop asking "Which version of the PP is correct?" and start asking "Which theoretical role is priority for this specific philosophical problem?"
