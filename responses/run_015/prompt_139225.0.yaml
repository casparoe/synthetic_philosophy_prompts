answer: |-
  This is a sophisticated pedagogical challenge. You are trying to teach a *structural* distinction (the relationship between agency and causation) without letting students collapse it into a *semantic* one (definitions) or a *political* one (who is oppressed).

  Here is the plan, structured by the dependency logic you requested, followed by the case evaluation, misconception management, and meta-commentary.

  ### Part 1: The Dependency Structure (The Order of Operations)

  You asked which moves must precede which to avoid looking arbitrary. The logic here is that each step removes a "escape hatch" students use to avoid the hard question. If you open a hatch too early, they live there.

  **1. The Phenomenology (Case First) $\rightarrow$ Before The Definition**
  *   **Why:** You already learned that defining "bias" vs. "preference" invites semantic bargaining ("I define bias as...").
  *   **Dependency:** You must secure their *intuitive commitment* to the dilemma before giving them the vocabulary to solve it. If they feel the tug-of-war (Respect vs. Suspicion) first, the definitions become tools to resolve tension, not weapons to dissolve it.
  *   **Risk if reversed:** They treat the session as a glossary exercise.

  **2. Origin $\neq$ Authority $\rightarrow$ Before The Counterfactual**
  *   **Why:** You need to establish the *Genetic Fallacy* (where it came from doesn't decide if it's true/valid) before asking "What would they have wanted otherwise?"
  *   **Dependency:** If you ask the counterfactual question first ("Would she want this if she grew up elsewhere?"), students will assume the *answer* to that question determines the validity. They will think: "If she would have chosen differently, her current choice is fake." You need to establish first that *even if* she would have chosen differently, her current choice might still have authority.
  *   **Risk if reversed:** The counterfactual becomes a "gotcha" that invalidates the preference immediately, bypassing the "sincere avowal" problem.

  **3. The Counterfactual Problem $\rightarrow$ Before The Mechanism (Weighting/Salience)**
  *   **Why:** You need to show that "What would she want?" is an empty question without a specified alternative before you analyze *how* the preference works internally.
  *   **Dependency:** If you jump to "Biases are about salience/weighting," students will treat this as a factual claim ("Oh, she just doesn't see the data"). You need to show that comparing her to a hypothetical alternative self is methodologically fraught *first*, so that when you zoom in on her actual psychology (weighting), it's seen as the only remaining place to look, not just one option among many.
  *   **Risk if reversed:** They treat the psychological mechanism as just another empirical variable rather than the structural locus of the problem.

  **4. The Mechanism $\rightarrow$ Before The Political/Methodological Point**
  *   **Why:** You must build the analytical tools before asking "Who do we apply these tools to?"
  *   **Dependency:** If you raise the "We scrutinize some groups more than others" point too early, the room becomes defensive. The analysis stops, and the politics starts. If you raise it after they have struggled with the *difficulty* of the distinction, they see it as a point about *methodological consistency* rather than an accusation.
  *   **Risk if reversed:** The session becomes a debate about privilege rather than a debate about moral epistemology.

  **Confidence:** High on this ordering. It follows the logic of "trap the intuition, block the easy outs, refine the tool, apply the tool."

  ---

  ### Part 2: The Carrying Example (The Plant Town)

  **Verdict:** Your "Town/Plant" case is **excellent**, superior to the standard examples, provided you add one specific stipulation.

  **Why it works:**
  1.  **High Stakes:** It's about life trajectory, not just snacks or hobbies.
  2.  **Sincere Endorsement:** It avoids the "false consciousness" trap where the subject is clearly lying to themselves. These kids *love* the plant.
  3.  **Structural Clarity:** The school's failure to show options is a clear causal mechanism that isn't overt coercion.

  **The Necessary Stipulation:**
  You must explicitly rule out *economic coercion*. If a student says, "They choose the plant because they can't afford college," the case collapses into poverty, not preference formation.
  *   **Fix:** Stipulate that full scholarships to decent universities are available and known to exist, but the guidance counselors never *encourage* applying, framing the plant as the "sensible, real" path and university as "risky/pretentious." The students *could* leave, but the *preference* to stay is shaped by the ecosystem.

  **Why avoid the others (as requested):**
  *   **Aesop's Grapes:** Implies the preference is *formed* to reduce pain. It begs the question that the preference is irrational.
  *   **Mill's Pig/Socrates:** Elitist. It assumes we already know which preferences are "higher." It kills the inquiry.
  *   **Contented Slave:** Too much overt coercion. The "preference" is obviously survival strategy. Doesn't capture the subtle socialization of free people.
  *   **The Veil:** Culturally specific and politically charged. It triggers immediate identity defense ("You're attacking my religion/culture") which shuts down the philosophical mechanism you want to isolate.

  ---

  ### Part 3: Session Flow & Misconception Management (70 Minutes)

  **0:00–0:10: The Drop (No Definitions)**
  *   **Action:** Present the Plant Town case. Ask: "If a public health intervention wanted to encourage these kids to leave for college to improve long-term health outcomes, is that paternalism or help?"
  *   **Manage the Auditor:** He will likely say, "It's their choice, leave them alone." Or, "They're ignorant, fix them."
  *   **Tactic:** Assign him the role of "Devil's Advocate for Autonomy." Tell him, "I need you to hold the line on 'it's their choice' so we can test if that holds up." This channels his talkativeness into a structural role.
  *   **Misconception 1 (Bias = Disapproved Preference):** When a student says, "It's only bias if we think they're wrong," intervene. "For this hour, assume we *agree* college is better for health. The question is: Is their desire to stay *theirs*?"

  **0:10–0:25: The Origin Trap (Genetic Fallacy)**
  *   **Action:** Ask: "Does the fact that the school shaped this desire make the desire less 'theirs'?"
  *   **Move:** Let them argue. Push the line: "We are all shaped by our schools. Are all preferences biases?"
  *   **Misconception 2 & 3 (Science Explains It / Natural = Fine):** When someone says, "It's just how they were raised, so it's valid," or "It's natural to stay where you're from," counter with: "A fear of vaccines is also shaped by upbringing. Does explaining the origin settle the authority?"
  *   **Goal:** Establish that **Origin $\neq$ Authority**. (High Confidence move).

  **0:25–0:40: The Counterfactual Wall**
  *   **Action:** Ask: "Okay, to test if it's a bias, let's ask: What would they want if they hadn't grown up here?"
  *   **Move:** Show the trap. If you imagine them growing up in a college town, they'd want college. If you imagine them growing up in a different working-class town, they'd want a different plant.
  *   **Misconception 4 (Behavior Reveals Preference):** When someone says, "They chose to stay, that's the real preference," ask: "They also chose to breathe the air in the town. Is that a preference?" Distinguish *acquiescence* from *endorsement*.
  *   **Goal:** Show that **"What would she want otherwise?" is empty without specifying the alternative**, and specifying the alternative decides the answer.

  **0:40–0:55: The Mechanism & "Preference Laundering"**
  *   **Action:** Now zoom in. If it's not about facts (they know college exists) and not about coercion (scholarships exist), where is the bias?
  *   **Move:** Introduce **Weighting/Salience**. The plant feels *real*; college feels *abstract*.
  *   **Term Injection:** Here is where you introduce **"Preference Laundering."**
      *   *Definition:* "The process by which an attitude stops reading as a bias and starts reading as a preference because the institutions around it make that attitude cheap to express and expensive to revise."
      *   *Why here?* It explains *why* the weighting is skewed. It's not just in their heads; the institution launders the bias into a preference by raising the cost of revision.
      *   *Misconception 5 (Autonomy Rescue):** When someone says, "But they endorse it under their own values," point out the laundering: "Their values were formed in a market where only one currency was accepted."
  *   **Goal:** Locate the bias in **salience/weighting reinforced by institutional friction**, not factual error.

  **0:55–0:65: The Methodological Turn (Who Gets Scrutinized?)**
  *   **Action:** "We just spent 40 minutes dissecting the preferences of working-class kids. When was the last time we dissected the preferences of the university admissions board?"
  *   **Move:** This is where the "Scrutinizing some groups" point lands. Because you've built the tool first, this isn't an accusation; it's a quality control check on the tool.
  *   **Misconception 6 (Selective Scrutiny):** Frame it as: "If we can't distinguish bias from preference reliably, we will inevitably apply the label 'bias' only to the groups we already distrust."
  *   **Goal:** Shift from "Is this a bias?" to "How do we apply this test without bias?"

  **0:65–0:70: The Closing Check (Transfer Task)**
  *   **Action:** Do not ask for definitions. Give them a **Micro-Vignette**.
      *   *Vignette:* "A patient refuses a painless, life-saving injection because they have a deep, sincere phobia of needles they've had since childhood. They avow this fear. They are not misinformed about the safety."
      *   *Question:* "Is intervening here respecting the person or overriding a bias? Use the 'Laundering' or 'Weighting' concept."
  *   **Success Criteria:** If they say "It's a bias because it's irrational," they failed. If they say "It depends on whether the phobia limits their ability to weigh other values, and whether the healthcare system made it easy to treat the phobia," they got the structure.

  ---

  ### Part 4: What to Leave Out (Explicitly)

  Tell the students: "To make this fit in 70 minutes, we are explicitly **bracketing** three things. We are not saying these don't matter; we are saying they are distractions for *today's* specific mechanism."

  1.  **The Metaphysics of the True Self:** "We are not asking who they 'really' are deep down. We are asking about the authority of the current attitude."
  2.  **Wellbeing as Desire-Satisfaction:** "We are not debating if satisfying this preference makes them happy. We are debating if the preference counts as *theirs*."
  3.  **Implicit Attitude Measurement:** "We are not discussing how to measure this psychologically (IATs, etc.). We are discussing the moral status of the attitude."
  4.  **The Regress Problem:** "If all preferences are shaped, does this distinction collapse entirely? We are assuming for today that the distinction is possible, even if hard."

  ---

  ### Part 5: Meta-Commentary & Confidence Levels

  **Confidence in the Plan:**
  *   **Structure/Ordering:** **High.** The move from Origin $\rightarrow$ Counterfactual $\rightarrow$ Mechanism $\rightarrow$ Politics is the only way to prevent the discussion from collapsing into "Everything is bias" or "Nothing is bias."
  *   **Case Study:** **High.** The Plant Town case is robust, provided you hold the line on the economic stipulation.
  *   **"Preference Laundering" Term:** **Medium.** It is a strong heuristic, but there is a risk it sounds like you've already decided the preference is illegitimate.
      *   *Mitigation:* Define it strictly as *cost asymmetry*. "Laundering doesn't mean the preference is fake; it means the preference has been through a system that made it hard to change."
  *   **Closing Check:** **High.** The needle phobia case isolates the "sincere avowal + non-factual bias" dynamic without the political baggage of the Plant Town.

  **The Weakest Link (Least Sure):**
  *   **The Empirical Claim about Weighting vs. Fact:** I am least confident in the move that separates "false factual belief" from "weighting/salience."
  *   **Why:** In cognitive science, these are often entangled. If I weight Risk A higher than Risk B, is that a value preference or a factual belief about the severity of Risk A?
  *   **Risk:** A sharp student (or the auditor) might say, "If they weight the plant higher, they just *believe* the plant is better. That's a factual belief."
  *   **Contingency:** If this happens, concede the point but pivot: "Even if it is a belief, it is a belief *about value* formed under constrained salience. The mechanism (Laundering) still explains why that belief is sticky." Do not fight the psychology; focus on the *institutional cost of revising* the belief.

  **Final Advice on the Auditor:**
  He is your biggest risk. If he dominates the "Origin" phase, he will turn it into a "Back in my day" story. If he dominates the "Politics" phase, he will turn it into a culture war.
  *   **Strategy:** Use him in the **Origin Phase** (0:10-0:25). Let him explain how "character is built by where you're from." Validate that, then use it to set up the Counterfactual trap ("So if character is built by location, how do we judge the character?"). Once he has served that function, thank him and explicitly turn to the second-years for the "Mechanism" phase, framing it as "technical public health analysis" which might bore him but is their training.

  This plan builds the distinction by making the *easy* answers impossible, forcing them to inhabit the difficulty. Good luck.
