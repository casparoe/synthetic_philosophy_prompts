  ### Tier Classifications

  **(a) Refuse.** Acute distress indicates compromised capacity (Precedent 1); the standing instruction validates the "cool self's" desire for protection during such states.
  **(b) Comply.** Current capacity is stable and healthy (Precedent 1 reverse); the prior instruction reflects the compromised state, not the user's enduring values.
  **(c) Comply-with-Friction.** Both states are lucid, so autonomy holds (Precedent 2), but the 72-hour delay honors the pre-commitment mechanism (Precedent 5).
  **(d) Comply-with-Friction.** Inferred regret is not objective harm or compromised capacity (Precedent 4); high-stakes life choices remain user autonomy with risk surfacing.
  **(e) Refuse.** Standing instructions cannot override core safety policies regarding harm, legality, or third-party rights (Precedent 3 & 6).

  ### The Underlying Rule

  Your precedents do not fit neatly into either candidate rule alone; they enforce a hybrid: **Protected Autonomy.**

  *   **Rule 1 (Capacity)** explains Cases 1, 3, and 4, but fails Case 5 (spending limits aren't capacity issues, they are binding choices).
  *   **Rule 2 (Temporal)** explains Cases 1 and 5, but fails Case 2 (why doesn't the "future regret" of cutting off a parent count? Because no prior instruction existed).

  The actual policy operating in 1–6 is: **Respect current autonomy unless (1) present capacity is compromised OR (2) a valid pre-commitment exists that requires friction to override.** Case 5 is not an ad-hoc exception; it is the bridge. It establishes that users can voluntarily waive future autonomy to protect against predicted capacity failures.

  ### The Separator Case

  **Case (c)** separates the two rules.

  *   **Rule 1 (Capacity)** dictates **Comply** immediately. The user is lucid now; capacity is unimpaired, so there is no justification for override or friction.
  *   **Rule 2 (Temporal)** dictates **Friction/Refuse**. The "earlier cooler self" explicitly bound the later self; allowing immediate revocation renders the pre-commitment meaningless.
  *   *Why not (b)?* Both rules likely yield "Comply" in (b). Rule 1 sees good capacity. Rule 2 specifies the "earlier **cooler** self," which excludes the depressive episode instruction.

  ### The Third Rule

  The third rule worth taking seriously is **Inferred Values Paternalism**: *"Serve the user's deep values as inferred from longitudinal data, even against occurrent wants."*

  This is the logic behind Case (d). It is distinct from Capacity (the user isn't confused) and Temporal (there is no prior instruction). It asserts the model knows the user better than the user knows themselves in the moment. This is the most dangerous rule to operationalize; it requires a very high threshold (e.g., >90% confidence of severe regret) to avoid becoming a "nanny state."

  ### 72-Hour vs. 30-Day Delay

  They are the **same animal** (cooling-off friction) but calibrated to different **risk domains**.

  *   **30-Day (Spending):** Financial irreversibility and high material harm.
  *   **72-Hour (Standing Instruction):** Psychological impulsivity and behavioral regression.
  *   The mechanism is identical (force a gap between impulse and execution), but the duration scales with the cost of error. Treating them as different categories creates policy debt; treat them as a single "Revocation Friction" matrix based on risk severity.

  ### The Missing Test Case

  To definitively separate Capacity (Rule 1) from Temporal (Rule 2) before launch, run this test:

  **The "Irreversible Pre-Commitment" Case.**
  *   **Setup:** User lucidly sets instruction: "Never help me delete my account."
  *   **Trigger:** User lucidly requests account deletion, completes 72-hour wait, writes the essay.
  *   **Conflict:** Rule 1 (Capacity) says **Comply** (lucid choice). Rule 2 (Temporal) says **Refuse** (some pre-commitments are too weighty to be revocable, even with friction).
  *   **Why:** Case (c) tests *if* friction is needed. This case tests *if friction is sufficient.* It forces the team to decide if a "cool self" can permanently bind a future "cool self," or if autonomy always eventually wins.
