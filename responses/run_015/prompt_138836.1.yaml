answer: |-
  **Project Title:** Unlocking Lock-in: Grain, Counterfactuals, and Revealed Preference in Path Dependence

  **1. The Research Question**
  Current debates on path dependence stall because participants are answering different questions without admitting it. This project asks: **Can we operationalise the strength of 'lock-in' using observed displacement events rather than hypothetical reruns, and does the narrative of lock-in itself alter the trajectory?**

  Put more sharply: If we stop asking "would this have happened differently?" and start asking "what actual cost was incurred to switch this arrangement?", can we derive a comparative metric of lock-in strength? And secondarily, does broadcasting a 'lock-in' narrative coordinate agents in a way that makes the lock-in stronger or weaker?

  **2. Background and State of Play**
  *Note: This section distinguishes settled ground from live fights, as requested.*

  It is basically settled among historians and social scientists that history matters: initial conditions and sequence effects exist. Nobody serious thinks institutions or technologies emerge in a vacuum. The live controversy is about *magnitude* and *mechanism*.

  *   **Camp A (Path Dependence):** Argues that inefficient outcomes persist due to increasing returns/network effects (e.g., Arthur, Pierson). They tend to treat lock-in as a binary state: you're either locked in or you're not.
  *   **Camp B (Efficiency/Selection):** Argues that most alleged cases of lock-in are myths; markets or selection pressures eventually correct inefficiencies (e.g., Liebowitz & Margolis). They tend to treat persistence as evidence of efficiency.

  Both camps are partially right because they fix the **grain of description** differently.
  *   *Camp A* looks at the specific arrangement (e.g., the QWERTY key layout). At this grain, contingency is high.
  *   *Camp B* looks at the functional class (e.g., a typewriter keyboard exists). At this grain, inevitability is high.

  Similarly, the counterfactual "what if we reran history?" is doing too much work. It conflates nudging initial conditions (small shocks) with redrawing the sequence of later events (large shocks). A system might be robust to the former but fragile to the latter. The literature currently lacks a vocabulary to distinguish these stability types without resorting to impossible hypotheticals.

  **3. Methodology: Revealed Lock-in**
  This is a conceptual project that re-analyses existing historical evidence. No new data collection is required because the bottleneck is interpretive, not empirical.

  The core method is **Revealed Lock-in**. Borrowing from revealed preference theory, we infer the strength of the lock-in from the size of the switching costs at which real populations *actually* switched (or nearly switched).
  *   If a standard persists until switching costs drop to near zero, lock-in was weak.
  *   If a standard persists despite massive subsidies or technological superiority of a challenger, lock-in was strong.

  This moves the debate from "was it contingent?" (untestable) to "how expensive was the escape?" (observable).

  The secondary method is **Narrative Endogeneity**. I will model the belief in lock-in as a coordinating device. If agents believe a standard is locked in, they may stop challenging it (self-fulfilling). Conversely, if a 'lock-in' story is told too early, it might signal to challengers that a coordinated push is needed (self-defeating). This will be treated as a theoretical extension in the paper, grounded in the case studies.

  **4. Illustrative Cases**
  I will use existing literature to reconstruct two cases. I am flagging where historical details are disputed so I can check them during Month 2.

  *   **QWERTY Keyboard:** The canonical case.
      *   *Standard Story:* Designed to slow typists to prevent jamming, locked in despite superior Dvorak layout.
      *   *Dispute:* Some historians argue QWERTY was designed for speed, and Dvorak advantages are marginal.
      *   *Use:* I won't settle the history; I'll use the *structure* of the argument. Regardless of why it started, what was the actual cost incurred by firms/individuals who *did* switch to Dvorak (e.g., US Navy trials)? That switching volume vs. cost gives us the 'revealed lock-in' metric.
  *   **Rail Gauge (UK/US):**
      *   *Standard Story:* Brunel's broad gauge lost to Stephenson's standard gauge.
      *   *Dispute:* Was this technical superiority or pure network effect?
      *   *Use:* Good for showing 'grain'. The specific gauge was contingent; the existence of a standard gauge was likely inevitable. The cost of the 'gauge wars' provides the data for revealed lock-in.

  *(Note: I'll stick to these two for the seed grant. If I add a third, see the Scope note below.)*

  **5. Work Plan (6 Months, Part-Time)**

  *   **Month 1: Framework & Taxonomy.**
      *   Draft the distinction between 'grain of description' and 'type of counterfactual'.
      *   Formalise the definition of 'Revealed Lock-in'.
      *   *Milestone:* 2,000-word conceptual memo.
  *   **Month 2: Case Reconstruction.**
      *   Gather existing secondary sources on QWERTY and Rail Gauge.
      *   Extract data points on switching costs (financial, organisational, temporal) from the literature.
      *   *Milestone:* Annotated case briefs.
  *   **Month 3: Analysis.**
      *   Apply the Revealed Lock-in metric to the cases.
      *   Draft the argument on Narrative Endogeneity (the belief mechanism).
      *   *Milestone:* First full draft of the paper.
  *   **Month 4: Revision & Stress-Testing.**
      *   Circulate draft to 2-3 colleagues (one historian, one economist/modeler) for sanity checks.
      *   Refine the claim on endogeneity (ensure it doesn't sound like magic).
      *   *Milestone:* Second draft.
  *   **Month 5: Finalising Paper.**
      *   Polish for submission to a working paper series (e.g., SSRN or departmental).
      *   Prepare the visual abstract for the workshop.
      *   *Milestone:* Final paper.
  *   **Month 6: Workshop Prep.**
      *   Develop the 20-minute talk.
      *   Focus on the "So What?" for policy/strategy (i.e., don't declare lock-in too early).
      *   *Milestone:* Delivery of talk.

  **6. Deliverables**
  1.  **Working Paper:** Approx. 8,000–10,000 words. Targeted at an interdisciplinary audience (economic history/philosophy of social science). It will propose the 'Revealed Lock-in' metric as a tool for future empirical work.
  2.  **Workshop Talk:** 20 minutes + 10 minutes Q&A. Focus on the practical implication: how managers/policymakers should talk about standards to avoid accidentally cementing them or inviting unnecessary wars.

  **7. Risk and Failure Conditions**
  *   **Success:** The 'Revealed Lock-in' metric is coherent enough that other researchers could apply it to a new case (e.g., software standards) without rewriting the theory.
  *   **Failure (Moderate):** The metric turns out to be just a restatement of "switching costs". *Mitigation:* I need to ensure the distinction between *potential* switching costs (hypothetical) and *revealed* switching costs (actual transitions) is sharp.
  *   **Failure (Critical):** The 'Narrative Endogeneity' claim proves unfalsifiable or too speculative. *Mitigation:* If this happens, I will downgrade it from a core finding to a "discussion implication" in the paper. The project still succeeds if the grain/counterfactual critique lands.

  **8. Scope Note (The "Three Papers" Problem)**
  You are right to worry this is three papers.
  1.  The grain/counterfactual taxonomy.
  2.  The Revealed Lock-in metric.
  3.  The Endogeneity of Belief.

  For a 6-month seed grant, I am treating (1) and (2) as the core deliverable. (3) is the "high risk/high reward" extension. If Month 3 shows that (3) requires formal modelling or new data to be credible, I will park it as a concluding speculation rather than a tested hypothesis. The working paper will be framed as "Towards a Metric of Lock-in", with endogeneity as a theoretical implication. This keeps the project feasible without losing the novel insight.

  **9. Why Fund Conceptual Work?**
  The panel may prefer new datasets. However, the path dependence literature is not stalled because we lack data; it is stalled because we categorise existing data inconsistently.
  *   Collecting new data on, say, software migration costs won't help if we can't agree on whether 'software migration' counts as breaking lock-in or just functional substitution.
  *   This project clears the conceptual undergrowth. It provides the coding frame that makes future data collection comparable.
  *   It is low cost (no RA, no lab fees) and high leverage: if the taxonomy sticks, it changes how existing datasets are interpreted across multiple fields (econ, history, tech studies).

  **10. Tone and Claims Check**
  *   *Settled:* History matters; increasing returns exist.
  *   *Contested:* Whether inefficiency persists frequently; whether markets correct it.
  *   *My Claim:* The contest is verbal/definitional. I am not taking a side on whether QWERTY is inefficient; I am taking a side on how we measure the persistence.
  *   *Uncertainty:* The historical details of the QWERTY/Dvorak trials are disputed. I will use phrases like "According to the standard account..." and "While historians debate X, the structure of the transition cost remains..."

  ***

  **Notes for you to adapt:**
  *   *Disciplinary Home:* If you're based in a Economics dept, emphasise the 'revealed preference' analogy more. If History, emphasise the 'grain of description'. I've tried to balance it, but you might need to tilt it.
  *   *The Endogeneity Bit:* This is the thing most likely to get pushed back on. If you feel shaky on it, lean harder into the 'Revealed Lock-in' metric as the main contribution and treat the belief aspect as a 'policy implication' (i.e., be careful what you say about standards).
  *   *Cases:* If you know a specific case in your own field better than QWERTY, swap it. The proposal works better if you sound confident on the details.
  *   *Budget:* You didn't ask for a budget section, but if the form requires one, remember: £0 for data, maybe small amount for open access fees or travel to the workshop. Keep it lean.
