  6.  **Final Polish:** Ensure clear headings. Make sure the distinction between the 1967 Outer Space Treaty and the 1979 Moon Agreement is highlighted, as that is the friend's biggest legal error. Ensure the distinction between "State Responsibility" and "Direct Liability" is clear. (Self-Correction: Make sure not to dismiss the ethical argument entirely, even if the legal one is flawed. The prompt asks about ethics too, but specifically about the *legal* basis for the ethics.)

