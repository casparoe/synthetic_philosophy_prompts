          7.  Irreversible ecological footprints = *territorial appropriation* (prohibited).
          8.  Conclusion: Ethical space activity must be *temporary scientific missions only* (no permanent infrastructure).
      *   **User's Suspicion:** The friend conflates legal instruments, misstates treaty obligations to private actors, and treats philosophical proposals as established law.
      *   **Task:** Audit the summary claim-by-claim. Distinguish accurate reflections from misrepresentations. Determine if the categorical prohibition on settlement survives correction.
      *   **Specific Focus:** Is the "capacity-weighted equity formula" real law or normative proposal? Is irreversible ecological change analogous to territorial sovereignty?

  2.  **Deconstruct and Verify Each Claim:**

      *   **Claim 1: OST designates space as "province of all mankind."**
          *   *Fact Check:* The phrase is "province of all mankind" (Article I).
          *   *Accuracy:* Accurate phrasing, but legal weight is debated. It implies freedom of access/use, not necessarily ownership.

      *   **Claim 2: Positive doctrine of distributive justice + International licensing body + Capacity-weighted equity formula.**
          *   *Fact Check:* The OST does *not* establish a licensing body for resource extraction. The Moon Agreement (1979) mentions an "international regime" to be established *when exploitation is imminent*, but major space powers (US, Russia, China) haven't ratified it. The "capacity-weighted equity formula" sounds like a specific philosophical or economic proposal (e.g., from scholars like Dan-Cohen, Cockell, or specific law review articles), not established treaty law.
          *   *Accuracy:* Misrepresentation. This is a normative proposal, not positive law.

      *   **Claim 3: OST binds private corporations directly.**
          *   *Fact Check:* International law generally binds states, not private entities. Article VI of OST says States bear international responsibility for national activities (including non-governmental) and must authorize/continually supervise them.
          *   *Accuracy:* Misrepresentation. States are liable for corporations, but the treaty obligations run to the State, which then regulates the corporation domestically.

      *   **Claim 4: Companies asserting exclusive rights to lunar landing zones are already in breach.**
          *   *Fact Check:* Article II prohibits national appropriation. Does it prohibit *exclusive use*? This is the core legal debate. The US (Artemis Accords) argues "safety zones" are not appropriation. Others argue de facto exclusion is appropriation. It is *not* settled law that they are "already in breach."
          *   *Accuracy:* Contested/Debatable. Stating it as fact is a misrepresentation of the current legal ambiguity.

      *   **Claim 5: OST frames celestial bodies as Common Heritage of Mankind (CHM).**
          *   *Fact Check:* The OST uses "province of all mankind." The *Moon Agreement* uses "Common Heritage of Mankind." The US and other major spacefaring nations have *not* ratified the Moon Agreement.
          *   *Accuracy:* Conflation. She is applying Moon Agreement language to the Outer Space Treaty.

      *   **Claim 6: CHM entails intergenerational obligation.**
          *   *Fact Check:* In environmental ethics and some interpretations of CHM (e.g., seabed authority), intergenerational equity is a component.
          *   *Accuracy:* Philosophically sound, but legally dependent on accepting CHM status (which is disputed for the Moon under OST).

      *   **Claim 7: Irreversible ecological footprints = territorial appropriation.**
          *   *Fact Check:* Article IX requires avoiding harmful contamination. But does changing the environment equal claiming sovereignty? This is a philosophical leap (Lockean labor theory vs. anti-appropriation).
          *   *Accuracy:* Philosophical argument, not legal definition. Conflates environmental harm with sovereignty.

      *   **Claim 8: Conclusion - Only temporary scientific missions.**
          *   *Fact Check:* Article I allows "use." Article II prohibits "appropriation." Does building a base equal appropriation? Most legal scholars say no, provided sovereignty isn't claimed.
          *   *Accuracy:* Extreme conclusion not supported by the text of the OST.

  3.  **Synthesize the Audit:**

      *   *Structure:* Introduction acknowledging the user's suspicion (which is well-founded). Then, go point-by-point. Finally, address the specific questions about the equity formula and ecological analogy. Conclude on whether the prohibition survives.
