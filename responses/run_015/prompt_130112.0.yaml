answer: |-
  Your suspicions are well-founded. Your friend's argument is a sophisticated synthesis of space law and political philosophy, but it presents normative ethical proposals and minority legal interpretations as settled black-letter law. Specifically, she conflates the 1967 **Outer Space Treaty (OST)** with the 1979 **Moon Agreement**, and she treats philosophical ideals of distributive justice as existing legal mandates.

  Here is an audit of her claims, distinguishing between accurate treaty text, mainstream legal interpretation, and normative philosophical proposals.

  ### Claim 1: "The foundational Outer Space Treaty designates space as the province of all mankind."
  *   **Verdict:** **Accurate Text, Ambiguous Legal Effect.**
  *   **Analysis:** Article I of the OST does state that the exploration and use of outer space shall be the "province of all mankind."
  *   **Nuance:** In legal scholarship, this phrase is generally interpreted as a principle of **freedom of access** and **non-discrimination**, rather than a mandate for shared ownership or managed distribution. It prevents states from barring others from space, but it does not inherently require a collective management structure.

  ### Claim 2: "Legal scholars have developed [this] into a positive doctrine of distributive justice: any extraction... must be licensed by an international body that applies a capacity-weighted equity formula."
  *   **Verdict:** **Misrepresentation of Law / Normative Proposal.**
  *   **Analysis:** There is **no such positive legal doctrine** currently in force. No international licensing body exists for space resource extraction.
  *   **The "Equity Formula":** This is almost certainly a reference to **normative philosophical proposals** (e.g., from scholars like Erika Hertzfeld, Henry Hertzfeld, or political philosophers discussing "cosmic justice"), not established treaty law. While some scholars *argue* that "province of all mankind" *should* imply benefit-sharing, this is not the *lex lata* (current law).
  *   **Correction:** The OST requires states to bear international responsibility for national activities, but it does not mandate a global redistribution of profits via a capacity-weighted formula.

  ### Claim 3: "The treaty binds private corporations directly rather than merely the states that charter them."
  *   **Verdict:** **Legally Incorrect.**
  *   **Analysis:** International law generally binds states, not private entities. Article VI of the OST establishes the principle of **State Responsibility**. It mandates that States Parties shall bear international responsibility for national activities in space, "whether such activities are carried on by governmental agencies or by non-governmental entities."
  *   **Correction:** The treaty binds the **State** to authorize and continually supervise the corporation. If a corporation breaches the treaty, the **State** is liable under international law, not the corporation directly (though the State may penalize the corporation under domestic law).

  ### Claim 4: "Companies that assert exclusive rights to lunar landing zones are already in breach of international law."
  *   **Verdict:** **Contested / Overstated.**
  *   **Analysis:** Article II of the OST prohibits "national appropriation by claim of sovereignty, by means of use or occupation, or by any other means."
  *   **Nuance:** There is a vigorous ongoing legal debate about whether **exclusive use** constitutes **appropriation**. The United States (via the Artemis Accords) and Luxembourg argue that safety zones or exclusive use of a specific site for operational safety do not equal sovereignty claims. Other scholars agree with your friend that *de facto* exclusion is *de jure* appropriation.
  *   **Correction:** It is not settled law that these companies are "already in breach." It is a live legal controversy, not a settled violation.

  ### Claim 5: "The treaty frames celestial bodies as part of the common heritage of humankind [CHM]."
  *   **Verdict:** **Conflation of Treaties.**
  *   **Analysis:** This is the most significant legal error in her summary. The **Outer Space Treaty (1967)** uses the phrase "province of all mankind." The **Moon Agreement (1979)** explicitly uses the phrase "Common Heritage of Mankind."
  *   **Correction:** The Moon Agreement (Article 11) establishes CHM status, which *does* imply an international regime for resource management. However, **no major spacefaring nation** (US, Russia, China, India, Japan, ESA members) has ratified the Moon Agreement. Therefore, CHM is **not** the governing legal standard for celestial bodies under the OST.

  ### Claim 6: "CHM entails an intergenerational obligation."
  *   **Verdict:** **Accurate Philosophy, Inapplicable Law.**
  *   **Analysis:** In environmental ethics and the law of the sea (where CHM is applied to the seabed), intergenerational equity is a core component of CHM.
  *   **Correction:** While ethically sound, this obligation only attaches legally if CHM status applies. Since the Moon Agreement is not ratified by key actors, this intergenerational obligation is an **ethical imperative**, not a binding legal constraint under the OST.

  ### Claim 7: "Any colony leaving irreversible ecological footprints effectively appropriates that body... in precisely the territorial manner the treaty prohibits."
  *   **Verdict:** **Philosophical Analogy, Not Legal Definition.**
  *   **Analysis:** This conflates **Article IX** (harmful contamination/environmental protection) with **Article II** (national appropriation/sovereignty).
  *   **Correction:** The OST requires avoidance of "harmful contamination," but modifying an environment (e.g., building a dome, digging a mine) is not legally defined as claiming sovereignty. Under Lockean labor theory, mixing labor with land creates property rights; under the OST, mixing labor with regolith creates **use rights** but explicitly forbids **sovereignty rights**. Your friend is arguing that environmental modification *should* be treated as appropriation, but the treaty does not currently define it that way.

  ### Claim 8: "Ethical space activity must be confined to temporary scientific missions with no permanent infrastructure."
  *   **Verdict:** **Does Not Follow.**
  *   **Analysis:** Article VIII of the OST explicitly recognizes that States retain jurisdiction and control over "objects launched into outer space" and **"personnel thereof."** It implicitly acknowledges the existence of "stations," "installations," and "equipment" on celestial bodies.
  *   **Correction:** The treaty envisions permanent infrastructure (stations) provided they do not claim sovereignty. A permanent base is not legally synonymous with a territorial claim.

  ---

  ### Specific Audit of Your Doubts

  **1. Is the "capacity-weighted equity formula" a real legal interpretation or an invented normative proposal?**
  It is an **invented normative proposal**. You will not find this in the text of the Outer Space Treaty, the Moon Agreement, or the Artemis Accords. It likely stems from academic literature on "Global Distributive Justice" applied to space (e.g., works by scholars like Chris Jenks, or philosophical discussions on the "Common Heritage" principle). Your friend has presented a *prescriptive* argument (how the law *ought* to work) as a *descriptive* one (how the law *does* work).

  **2. Is irreversible ecological change genuinely analogous to territorial sovereignty?**
  Legally, **no**. Environmentally, **maybe**.
  *   **Legally:** Sovereignty implies the right to exclude others politically and legally. Ecological change implies physical alteration. One can alter a landscape without claiming political sovereignty (e.g., a scientific research station that modifies the local terrain but allows access to others).
  *   **Ethically:** Your friend is making a **Lockean counter-argument**. She is suggesting that by irreversibly changing the environment, settlers are "mixing their labor" with the land in a way that precludes others from using it in its original state, effectively appropriating it. This is a strong *ethical* argument for conservation, but it is not the legal definition of appropriation in the OST.

  ### Conclusion: Does the prohibition on settlement survive correction?

  **No.** Once you correct the misrepresentations, the categorical prohibition on permanent settlement collapses.

  1.  **Legal Basis:** The Outer Space Treaty explicitly allows for "stations" and "installations" (Article VIII) and does not prohibit permanent presence, only sovereign claims.
  2.  **Corporate Liability:** Corporations are regulated by their sponsoring states, not directly by the UN, meaning they can operate within the bounds of domestic space law (like the U.S. Commercial Space Launch Competitiveness Act) which permits resource utilization.
  3.  **Ethical Basis:** While the "Common Heritage" argument provides a strong ethical case for *benefit sharing* and *environmental stewardship*, it does not logically necessitate a ban on settlement. One can argue for permanent settlement *with* strict environmental protocols and voluntary benefit-sharing mechanisms without violating the core non-appropriation principle.

  **Summary for your friend:** Her argument is a compelling piece of **political philosophy** masquerading as **positive law**. She is correct that the *spirit* of the treaty encourages equitable use and environmental care, but she is incorrect that the *letter* of the treaty prohibits permanent infrastructure or mandates a global redistribution formula. She has conflated the **Outer Space Treaty** (which allows use) with the **Moon Agreement** (which suggests shared heritage), and treated **ethical ideals** as **legal statutes**.
