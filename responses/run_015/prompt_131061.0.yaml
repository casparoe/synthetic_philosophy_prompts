  *(Self-Correction on Order)*: Actually, for design students, starting with the *Copycat* (the AI) might be more engaging, then pulling back to the *Boundary* (the Archive) to see what's missing. It's a "detective" approach. Start with the crime (the label), find the victim (the definition). Let's try that. It feels more active for designers. *Wait, no.* Philosophical rigour suggests establishing the norm first. If I start with the AI, they accept the AI's framing. I must establish the 'Archive' first. Stick to Boundaries -> Copycat.

  *(Final Plan Structure)*:
  1. Hook (The Label).
  2. Anchor (The Boundary/Definition).
  3. The Shift (The Copycat Mechanism).
  4. The Trap (Misconceptions).
  5. The Test (Concrete Check).

