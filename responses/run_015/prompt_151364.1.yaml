answer: |-
  Subject: Draft Joint Statement - Lying vs. Misleading Collab

  Hi all,

  Attached is the draft statement from the adversarial collab on lying vs. misleading. We've been going back and forth for a few weeks and finally hammered out where we stand. 

  As mentioned in the proposal, we're using a conceptual lens we're calling "scaffolded testimony." Just to be clear upfront: this isn't a citeable theory or existing lit. It's just the framing we built to test how these moral claims hold up in contexts where listeners rely on implicit structures (like algorithmic summaries, stats disclaimers, or institutional norms) to fill in the gaps between literal words and actual meaning.

  Here's where we landed.

  ### 1. Agreed Claims
  *Things both Camp "Broken Promise" and Camp "Same Harm" accept as baseline.*

  1.  **Definitions:** We agree on the standard distinction. **Lying** involves asserting something the speaker believes to be false. **Misleading** involves asserting something technically true (or remaining silent) with the intention of inducing a false belief via implication.
  2.  **Intent:** In both cases, the speaker must intend for the listener to form a false belief. Accidental falsehoods don't count for this discussion.
  3.  **Scaffolded Environments:** We agree that in many modern contexts (what we're calling **scaffolded testimony**), listeners don't process every word literally. They rely on baseline assumptions about how information is curated. For example, if a company releases a stat with a disclaimer, users often ignore the disclaimer and trust the "scaffold" (the brand, the format, the norm of reporting) to deliver the gist.
  4.  **Harm Potential:** Both lying and misleading can cause identical material harm to a listener who relies on the information.
  5.  **Detectability:** We agree that misleading statements are often harder to detect and correct post-hoc than flat-out lies, because the literal truth provides a shield against accusations of dishonesty.

  ### 2. Disagreements Table
  *Where we diverge, specifically regarding the moral weight and the interaction with scaffolds.*

  | Crux | Camp "Broken Promise" Wording | Camp "Same Harm" Wording | Test Case / Argument | Prediction | Verbal or Real? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Source of Wrongness** | The unique wrong of lying is the **speech-act breach**. When you assert, you invite trust in your word. Breaking that commitment is a betrayal distinct from the outcome. | The wrongness tracks the **induced false belief**. If the intent and outcome are identical, the moral status is equivalent. The method (literal vs. implied) is secondary. | **The "Harmless Lie" vs. "Successful Mislead"**: Compare a lie that is immediately caught (no false belief formed) vs. a misleading statement that successfully fools everyone. | **BP:** The lie is still morally worse because the attempt to betray trust occurred.<br>**SH:** The misleading statement is worse because it succeeded in corrupting the listener's map of reality. | **Real.** This changes verdicts in cases where outcomes diverge from intent. |
  | **Scaffold Interaction** | Lying **poisons the scaffold directly**. It violates the explicit rules of the reporting norm. Misleading stays within the rules, even if sneaky. | Misleading **corrupts the baseline trust**. It exploits the scaffold's assumptions, making the entire structure unreliable because users can't rely on implications anymore. | **Algorithmic Summary Case**: An AI summarizes a document. Case A: It hallucinates a fact (Lie). Case B: It selects true quotes that imply a false narrative (Mislead). | **BP:** Case A is worse; it breaks the functional contract of the tool.<br>**SH:** Case B is worse; it's harder to audit and degrades user trust in the system long-term. | **Real.** Disagreement on whether rule-breaking or trust-erosion is the primary moral danger. |
  | **Remediation** | Because lying breaks a specific commitment, it requires **explicit retraction** to repair the moral bond. | Because the harm is the false belief, **correcting the belief** is sufficient, regardless of how the error is framed. | **Public Correction**: A politician clarifies a statement. Do they need to say "I lied" or just "Here are the facts"? | **BP:** "I lied" is necessary to restore the speech-act integrity.<br>**SH:** Providing the facts is enough; the label matters less than the epistemic repair. | **Verbal/Real Hybrid.** Might be semantic, but impacts public accountability norms. |

  ### 3. What Would Change Our Minds?

  **Camp "Broken Promise" (The Speech-Act View):**
  We'd shift if we saw evidence that misleading practices systematically destroy institutional trust *faster* than lying in scaffolded environments. Specifically, if we found a case where a "technically true" misleading campaign caused a collapse in cooperation (e.g., market crash, treaty failure) while a comparable lie was contained and repaired easily, we'd have to admit the speech-act boundary isn't doing the moral heavy lifting we thought. 
  *Where we might be wrong:* We're probably over-indexing on the individual interaction. If the macro-level damage of misleading is higher, our focus on the micro-level "promise" might be too narrow.

  **Camp "Same Harm" (The Outcome View):**
  We'd flip if there was a clear scenario where a listener *knows* they were misled vs. lied to, and their reactive blame is significantly higher for the lie, even when the harm is identical. If the "betrayal" feeling is a robust moral datum across cultures, then dismissing it as "window dressing" ignores how humans actually experience trust. 
  *Where we might be wrong:* We're assuming detectability is the main variable. But maybe the *kind* of trust violated matters more than the degree of harm. If lying kills the possibility of future testimony in a way misleading doesn't, we'd need to update.

  ***

  Anyway, that's the gist. We're planning to run the Algorithmic Summary test case next month to see whose prediction holds up. Let us know if the "scaffolded testimony" framing makes sense to you guys or if it's muddying the water.

  Cheers,

  The Collab Team
