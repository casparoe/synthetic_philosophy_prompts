answer: |-
  Here is the translation and residue report, framed in your vocabulary.

  ### 1. The Translation

  #### General Claims
  *   **Substrate in a state:** A point $\mathbf{x}_t$ in the state space of your fitted RNN.
  *   **Cause–Effect Power:** The sensitivity of the future state distribution $P(\mathbf{x}_{t+1} | \text{do}(\mathbf{x}_t))$ to interventions on $\mathbf{x}_t$. In your terms: the spectrum of the Jacobian $J = \frac{\partial F}{\partial \mathbf{x}}$ evaluated at $\mathbf{x}_t$, but treated as a probabilistic constraint rather than just local stability. It asks: "How much does fixing $\mathbf{x}_t$ reduce the entropy of the trajectory relative to the unconstrained dynamics?"
  *   **Integration ($\Phi$):** The information loss when you partition the system. You take the Jacobian (or the transition matrix), zero out the off-diagonal blocks corresponding to a cut, and measure the distance (usually KL divergence) between the *actual* future state distribution and the *partitioned* future state distribution. High $\Phi$ means the system's trajectory is not identifiable from the trajectories of its parts; the latent dynamics are emergent properties of the whole connectivity matrix, not block-diagonalizable sub-networks.
  *   **The Complex:** The subset of units $S \subseteq \{1, \dots, N\}$ that maximizes $\Phi$. In your pipeline, this is akin to finding the subset of neurons that yields the most stable, low-dimensional latent manifold *without* referencing an external behavioral variable.
  *   **Exclusion Principle:** If $S_1 \subset S_2$ and both have high $\Phi$, only the one with the absolute maximum counts. Overlapping complexes are forbidden. This contradicts standard mixed-selectivity or distributed coding views where multiple overlapping ensembles can encode different variables.
  *   **Quality (Qualia Space):** The geometry of the constraints. It is not a scalar. It is the shape of the manifold of possible cause–effect repertoires. In your terms: the topology and curvature of the attractor landscape itself. The "what it is like" is identified with the specific geometry of the constraints the system imposes on its own state space.

  #### The Toy Model: Ring Attractor + Feedforward Expansion
  *   **System:** 64-unit Ring (recurrent, symmetric excitation/global inhibition) $\to$ 512-unit Layer (feedforward, drives behavior).
  *   **Dynamics:** The Ring supports a slow manifold (the angle $\theta$). The Feedforward layer is a static map $g(\mathbf{x}_{ring})$.
  *   **IIT Analysis:**
      *   **Ring:** High $\Phi$. Perturbing one unit propagates around the ring via recurrence; the state of the ring constrains its own future strongly. The partition cost is high because cutting connections destroys the attractor dynamics (the "bump" collapses or diffuses).
      *   **Feedforward:** $\Phi \approx 0$. It has no feedback. $\text{do}(\mathbf{x}_{feedforward})$ affects the output, but it does not constrain the *past* of the system, nor does it constrain its own future (it's a memoryless function of the ring). It is causally transparent.
      *   **The Complex:** The Ring is the Complex. The Feedforward layer is excluded from the conscious substrate.
      *   **Behavior:** Driven entirely by the non-conscious Feedforward layer.
      *   **Verdict:** The system is conscious (to the degree of the Ring's $\Phi$), but the consciousness is causally effete regarding the behavior. The part that "feels" is not the part that "does."
  *   **Comp Neuro Analysis:**
      *   **Ring:** A low-dimensional latent variable ($\theta$). Identifiable via PCA/CCA. High autocorrelation, slow timescale.
      *   **Feedforward:** A high-dimensional readout. Expands the latent code for linear separability of motor commands.
      *   **Verdict:** The system is a controller. The Ring is the state estimator/working memory; the Feedforward layer is the policy. Both are necessary for the task. If you ablate the Feedforward layer, behavior stops. If you ablate the Ring, behavior becomes random. Both are "real" in the functional sense.
  *   **Where they come apart:** IIT claims the *locus of consciousness* is the Ring, specifically *because* it is decoupled from the output. Comp Neuro claims the *locus of function* is the chain, specifically *because* it couples to the output. IIT treats the Feedforward layer as a "zombie" output channel; Comp Neuro treats it as the crucial interface.

  ### 2. The Fudges (Where the translation breaks)

  **A. Intrinsicality (The "For Itself" Problem)**
  In your vocabulary, "cause-effect power" is always evaluated relative to a loss function or a decoder. Even when you fit an autoregressive model, you validate it by prediction error on *held-out data* (an external criterion).
  *   **The Fudge:** To translate IIT, you have to pretend the system's *own* persistence is the loss function. You have to treat the autoregressive error not as a metric of model fit, but as a metric of *existence*.
  *   **Why it breaks:** In Comp Neuro, if a latent variable is perfectly integrated ($\Phi$ is high) but predicts nothing about the stimulus or behavior, we call it "unidentifiable" or "nuisance variability." IIT calls it "conscious." The translation requires you to suspend the requirement that variables must be identifiable *relative to a task*. IIT demands variables be identifiable *relative to themselves*. This is a category error in standard statistical learning: it treats the prior over states as the ground truth, rather than the likelihood of data given states.

  **B. The Partition Search (The "Unit" Problem)**
  You think about latents that survive noise and coarse-graining. You group neurons by tuning similarity or connectivity communities.
  *   **The Fudge:** IIT requires an exhaustive search over all possible partitions of the physical units to find the *maximum* $\Phi$.
  *   **Why it breaks:** In your framework, the "unit" is arbitrary (neurons vs. populations vs. voxels). You solve this by looking for invariants under coarse-graining (renormalization). IIT solves this by the **Exclusion Principle**: there is *one* true grain size (the one maximizing $\Phi$). This implies that "consciousness" is not scale-invariant. It asserts there is a specific, physical subset of neurons that is the "true" subject. In your vocabulary, this smells like overfitting. Why should the maximum of a specific information metric over subsets define ontology? Your framework suggests the "real" latents are the ones stable across animals/tasks (CCA/RSA), not the ones that maximize a specific intra-system constraint metric on a single snapshot.

  ### 3. The Unsayable (What literally cannot be expressed)

  **The Ontology of Geometry (Qualia Space)**
  You can describe the "quality" of consciousness in your vocabulary as the curvature of the manifold, the number of attractors, or the dimension of the slow subspace. You can say, "This system has a ring manifold, therefore it can represent orientation."
  *   **What is unsayable:** You cannot say, "This ring manifold *is* the experience of orientation."
  *   **The Boundary:** In Comp Neuro, geometry is *explanans* (it explains function/capacity). In IIT, geometry is *explanandum* (it is the thing itself).
  *   **Why:** Your framework is dualist by method. There is the system (neural data) and there is the variable we care about (behavior/stimulus/consciousness report). You map one to the other. IIT is monist by axiom. The structure *is* the experience. There is no second variable.
  *   **Specific Failure:** You cannot express the **Exclusion Principle's** phenomenological claim. You can say "Overlapping representations confuse the decoder." You cannot say "Overlapping representations are impossible for a single subject of experience." The idea that the *unity* of experience imposes a hard constraint on the *physical* overlap of neural populations is unsayable in a framework that treats neural populations as basis functions for a readout.

  ### 4. The Verdict on the Residue

  You asked: Is the surviving part the sharp core, or is the intrinsic bit doing all the work?

  **Verdict: The "Intrinsic" bit is doing all the work, but the "Recurrence" bit is the only falsifiable handle.**

  Here is the breakdown:

  1.  **The Substantive Claim (Surviving):** IIT makes a sharp, falsifiable claim about architecture: **Consciousness requires high integration ($\Phi$), which requires recurrent connectivity that cannot be feedforwardly approximated without loss.** This translates perfectly to your vocabulary. It predicts that cerebellum (feedforward-ish) is not conscious, and posterior cortex (recurrent) is. It predicts that your Ring Attractor is conscious, and the Feedforward layer is not. This is a claim about *causal topology*. You can test this with your Jacobians and ablation studies. This part is not hand-wavy; it is a specific constraint on the dynamical systems you fit.
  2.  **The Hand-Wavy Bit (The Residue):** The claim that $\Phi$ *is* consciousness (the intrinsic bit). In your vocabulary, high $\Phi$ just means "high memory capacity" or "high computational depth." A hard drive with error-correcting codes has high integration; a chaotic system has high sensitivity. IIT asserts that *this specific metric* maps to *phenomenology*.
  3.  **The Third Option:** The translation reveals that IIT is not actually a theory of *consciousness* in the sense of "why it feels like something." It is a theory of **causal autonomy**.
      *   IIT defines a "system" as something that exists for itself (high $\Phi$).
      *   It then *identifies* existence with experience (the "intrinsicality" axiom).
      *   Your framework rejects the identification. You accept the definition of causal autonomy (it's a valid dynamical property), but you treat it as a functional feature, not an ontological one.

  **Conclusion:**
  What survives the translation is a **theory of causal depth**. It says: "Systems that are deeply recurrent and irreducible are capable of a kind of self-constraint that feedforward systems are not."
  What fails to survive is the **bridge to phenomenology**.
  *   If you believe the bridge (Intrinsicality = Experience), then IIT is a profound claim that your vocabulary lacks the ontology to support.
  *   If you reject the bridge (Intrinsicality = Functional Capacity), then IIT collapses into a specific hypothesis about why recurrence is necessary for certain cognitive functions (like reportability or integration of information over time), which you likely already accept for different reasons (e.g., vanishing gradients, temporal credit assignment).

  **My read:** The "Exclusion Principle" and "Intrinsicality" are not bugs to be fixed by better translation; they are the *price of admission*. IIT buys a definition of consciousness by sacrificing compatibility with standard functionalist neuroscience. The residue you are left with (Recurrence > Feedforward) is scientifically useful but philosophically empty—it tells you where to look, but not *why* looking there yields a subject rather than a zombie. The "unsayable" part isn't the geometry; it's the assertion that geometry *suffices* for ontology. Your framework assumes ontology is given (the animal exists); IIT tries to derive ontology from the math. That derivation step is where your vocabulary runs out, not because it's too simple, but because it's designed to describe *relations*, not *existence*.
