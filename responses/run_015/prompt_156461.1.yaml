  4. Then give me a verdict on the residue: is what survives the translation the sharp, substantive part of IIT and what fails to survive the hand-wavy part, or is it the other way round? I keep flip-flopping between "this is a real, falsifiable claim about which causal architectures feel like something, and my framework just lacks the vocabulary for the intrinsic bit" and "the intrinsic bit is doing all the work, it cashes out to nothing in my terms, and what's left is a claim about recurrence versus feedforward connectivity that I already believed for completely different reasons". Which is it — or is there some third option I'm not seeing?

