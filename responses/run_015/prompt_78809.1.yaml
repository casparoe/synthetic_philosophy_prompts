answer: |-
  In 1889, Elias Vane painted *The Drowned City*, then locked it in a vault following a dispute with his dealer; a year later, dissatisfied with leaving his patron empty-handed, Vane painted an exact duplicate on period canvas with mixed pigments from the same batch, signing it identically, which remained in a private collection until 1950; meanwhile, in 1925, a master restorer named Havelock constructed a third version using scavenged late-19th-century materials and Vane's own technical manuals, which was acquired by the National Gallery in 1930 and hung prominently for sixty years. During those six decades, *The Drowned City* was cited as the genesis of Modernist despair, reproduced in every textbook, and directly copied by Picasso and Hopper, who specifically credited its composition and brushwork as decisive influences on their own mature styles, while the 1889 original remained unopened and the 1890 replica unseen. When the vault was finally opened in 1990, forensic analysis confirmed all three canvases were physically indistinguishable down to the micron, yet only the 1925 construction had ever functioned as a public object, meaning the art history of the 20th century was built entirely on the aesthetic data of the forgery.

  (a) The aesthetic supervenience theorist must declare all three objects equal in value. Since ex hypothesi there is no perceptual difference between them, and value supervenes entirely on the experienceable properties, the history of the object is irrelevant metadata. The viewer gets the same aesthetic hit from any of the three, and to prefer one over the other is a fetish of provenance, not aesthetics.

  (b) The proponent of the artist's hand faces an immediate structural awkwardness regarding the 1890 replica. Their theory dictates that aesthetic value is boosted by the object being a product of the artist's creative agency. This successfully demotes the 1925 forgery (Havelock's hand), but it forces the theorist to treat the 1889 original and the 1890 replica as equals. Both are autograph; both are materially identical. If the theorist insists the 1889 original is superior, they are smuggling in a criterion of *temporal priority* or *originativity* that their theory does not sanction—they are silently appealing to history (view c) to distinguish two objects that are identical in terms of "artist's hand." They must either admit that self-replication carries the same aesthetic weight as original creation (counter-intuitive) or explain why the first touch matters more than the second without abandoning their core premise.

  (c) The causal-historical theorist ranks the 1925 forgery first. On this view, an artwork's value is partly constituted by its role in the evolving conversation of art history. The 1889 original sat in a crate; it causally did nothing. The 1890 replica sat in a private home; it causally did nothing. The 1925 forgery, however, catalyzed Modernism, shaped Picasso, and defined the era's visual language. It possesses the highest "art-historical voltage." A fully informed viewer ought to value the forgery most highly because it is the object that actually *worked* as art within the tradition, regardless of its genesis.

  The single feature doing the work here is the **sequestration of the authentic**. The entire tension relies on the causal chain being routed through the fake solely because the real was hidden. If you delete this feature—if the 1889 original was the one hung in the National Gallery—the causal footprint and the artist's hand align on the same object. The thought experiment collapses into a trivial confirmation that authenticity and influence usually coincide. The defender of view (b) will claim the experiment was rigged by conflating *historical significance* with *aesthetic value*. They will argue that I have defined "value" in premise (c) as "influence," which begs the question against the notion that aesthetic worth is intrinsic to the object's creation rather than its reception. They will say I haven't proven the forgery is better art; I've only proven it was more famous, and that building a theory of value on accidental visibility is a category error.
