          *   *Objection:* If $A > B$, $B > C$, $C > A$, an agent can be pumped for money. Swap A for B (pay $\epsilon$), B for C (pay $\epsilon$), C for A (pay $\epsilon$). End up with A and less money. Repeat until bankrupt.
          *   *Severity:* Traditionally considered fatal for rational choice theory.
          *   *Intransitivist Defense:* Resolute choice, planning, or denying the normative force of dynamic consistency in this context. Some argue the pump requires *strict* preference cycles, whereas spectrum arguments often involve "not worse than" or parity. But the user specified *genuine intransitivity*.
