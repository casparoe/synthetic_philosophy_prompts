answer: |-
  This is a profound question that cuts to the heart of the philosophy of biology. The language of information in molecular biology is not merely decorative; it carries heavy ontological and explanatory baggage. To answer you, we need to disentangle the **implicit theory of information**, evaluate the **literal vs. metaphorical** status, assess the **heuristic risks**, and imagine a **post-informational biology**.

  Here is a reconstruction of the philosophical commitments at work.

  ### 1. The Implicit Theory of Information: Teleosemantics
  When biologists say DNA "encodes" proteins, they are not using Shannon information theory (which deals with signal transmission and entropy). They are using a **semantic** concept of information.

  The implicit theory presupposes three specific philosophical commitments:

  *   **Arbitrariness (The Code Commitment):** A code implies a mapping that is not determined by physical necessity. There is no chemical law that dictates that the triplet `GCA` *must* correspond to Alanine. It could have been otherwise (and in synthetic biology, it sometimes is). This presupposes that the relationship is **conventional**, not purely causal.
  *   **Aboutness (Intentionality):** To say a sequence "codes for" a protein implies the sequence has content; it is *about* the protein. This commits biology to a weak form of intentionality. The DNA stands in for the protein in the absence of the protein.
  *   **Teleology (Function):** For a physical state to carry semantic information, it usually requires a function. This aligns with **Teleosemantics** (associated with philosophers like Ruth Millikan and Karen Neander). DNA carries information *because* it was selected by evolution to do so. The "meaning" of the gene is derived from its historical function in survival and reproduction.

  **The Implicit Reader:** Crucially, a code requires a decoder. The language presupposes the existence of an "interpreter" (the ribosome/tRNA machinery). The philosophical commitment here is that the cell is not just a soup of reactions, but a system that *processes* symbols.

  ### 2. Literal Semantics vs. Causal Metaphor
  Is this literal? Most philosophers of biology (e.g., Paul Griffiths, Karola Stotz) argue it is **not literal semantic information**, but rather **causal specificity**.

  *   **The Causal View:** DNA is just a chemical template. The ribosome is a catalyst. The process is purely mechanistic. When we say "information," we really mean "difference-making." If you change the DNA, the protein changes specifically. If you change the temperature, the reaction might stop, but it won't change the *specificity* of the product.
  *   **The Verdict:** The practice does not *logically* commit you to literal semantics. You can explain transcription and translation entirely through stereochemistry and thermodynamics. However, the language *pragmatically* commits you to treating the DNA as distinct from other causal factors (like the cellular environment).

  **Is it a harmless metaphor?** No. It is a **constitutive metaphor**. It doesn't just describe the phenomenon; it defines what counts as the phenomenon. By labeling DNA as the "information carrier," biologists implicitly label other factors (cytoplasm, membrane, environment) as "noise" or "medium," rather than equal partners in causation.

  ### 3. The Risk: What the Metaphor Hides
  If this is a metaphor, it is a dangerous one because it shapes inquiry through **Genetic Determinism** and **Context Blindness**.

  *   **The Homunculus Problem:** If DNA contains "instructions," who reads them? This leads to an implicit regress. Biologists avoid this by treating the ribosome as a machine, but the language of "instructions" suggests the DNA holds agency. This obscures the fact that the *cell* constructs the DNA's meaning, not the other way around.
  *   **Developmental Systems Theory (DST) Blindness:** The information metaphor privileges the gene as the sole source of order. It makes it difficult to see **epigenetic inheritance**, **niche construction**, or **cellular context** as informational. If you look for the "code," you won't find the methylation patterns or the chromatin structure that actually determine if the code is read.
  *   **The "Blueprint" Fallacy:** A blueprint contains a spatial isomorphism of the building. DNA does not. A program contains step-by-step logic. DNA does not (it is parallel and distributed). The computer metaphor leads biologists to look for "switches" and "logic gates" where there are often just dynamic chemical equilibria.

  ### 4. Could Biology Get By on Pure Causation?
  **In Principle:** Yes. Physics and chemistry are causally closed. You could describe protein synthesis entirely in terms of molecular affinity, binding energies, and concentration gradients.

  **In Practice:** No. The complexity is too high.
  *   **Compression:** "Information" is a lossy compression algorithm. It allows biologists to ignore the quantum mechanics of every bond and focus on the *pattern*.
  *   **Prediction:** The informational view allows for prediction across contexts. If I know the "code," I can predict the protein in a test tube or a human. A purely causal description would require re-deriving the chemistry for every specific context.
  *   **Intervention:** To engineer biology (CRISPR, synthetic biology), you *need* the informational view. You need to treat DNA as a modular symbol that can be swapped. A purely causal view makes DNA look too entangled with its context to be manipulated.

  So, the practice *needs* the theory heuristically, even if it doesn't need it ontologically.

  ### 5. What Would Change if We Dropped the Metaphor?
  If molecular biology decided to treat "information," "code," and "translation" as forbidden terms and reverted to strict causal/mechanistic language, the field would undergo a radical shift in writing and thinking.

  **A. Changes in Terminology**
  *   **Encoding → Templating:** DNA does not "encode" a protein; it acts as a **template** for amino acid assembly.
  *   **Transcription → Copying:** RNA polymerase does not "transcribe" information; it **catalyzes the polymerization** of nucleotides complementary to a strand.
  *   **Translation → Synthesis:** The ribosome does not "translate" a language; it **facilitates the ligation** of amino acids based on stereochemical matching with tRNA.
  *   **Genetic Code → Stereochemical Mapping:** The relationship between codons and amino acids is not a "code" (which implies convention) but a **frozen historical accident of chemical affinity**.

  **B. Changes in Explanatory Focus**
  *   **From Gene-Centric to System-Centric:** Papers would not say "Gene X causes Trait Y." They would say "In the presence of Cellular Context Z, Sequence X alters the probability of Pathway Y."
  *   **Re-evaluation of "Junk" DNA:** If DNA isn't just a code for proteins, non-coding regions aren't "junk" or "regulatory switches" (which is still information talk); they are structural scaffolds or chemical sinks.
  *   **The End of "The Gene For":** You would never read "the gene for eye color." You would read "the sequence variant associated with pigment synthesis modulation." This kills the simplistic Mendelian narrative for complex traits.

  **C. The Biggest Shift: Agency**
  Currently, the text implies the DNA is the agent ("The gene *expresses* itself"). In a causal description, the **cell** is the agent. The cell uses the DNA.
  *   *Current:* "The DNA instructs the cell to divide."
  *   *Causal:* "Cellular conditions reached a threshold that triggered polymerase activity on specific DNA regions, resulting in division."

  ### Conclusion
  The language of information in biology is a **controlled fiction**. It is not literally true (DNA has no mind, no semantics, no intentionality), but it is **indispensably false**. It allows biologists to manage complexity by treating the genome as a modular, context-independent database.

  However, the cost of this fiction is **reductionism**. It commits biologists to looking for the "source code" of life, potentially blinding them to the fact that life is not a computer program but a chemical process. If we dropped the metaphor, biology would become more accurate regarding causation but significantly harder to practice, as we would lose the ability to abstract away the messy chemistry of the cell. The challenge for the future of biology is not to drop the metaphor entirely, but to stop treating it as a literal description of reality and start treating it as what it is: a powerful, context-dependent heuristic.
