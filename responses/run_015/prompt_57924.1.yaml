prompt: |-
  I direct a small interdisciplinary laboratory for the study of consciousness that runs interview-based projects two or three times a year, and I need a consistent way to handle first-person reports without either credulously endorsing everything subjects say or dismissing their perspective in favor of neural data. Our current portfolio includes experienced meditators who report radical distortions of time and self, lucid dreamers who give detailed morning reports that shift on re-interview, and, most divisively, extended dialogues with a companion chatbot that several collaborators want to treat as another conscious subject. My assistants come mainly from neuroscience and human-computer interaction with no graduate training in philosophy, our ethics protocol allows ninety-minute structured interviews plus follow-ups, and I as principal investigator must sign off on what we archive as data versus interpretation and on what we claim in papers and press summaries.

  Please translate heterophenomenology, understood as a neutral method that takes subjects seriously as witnesses to how things seem to them while bracketing questions about the metaphysical reality of what they report, into a step-by-step procedure my team can actually run. I need the questions to work through in order from initial briefing through interviewing, transcription, and construction of a neutral archive of the subject worldview, with criteria for what counts as a sufficient answer at each stage, tests for when to probe further versus accept a report as stated, rules for separating the archive of seemings from researchers theoretical glosses and third-person evidence, and explicit markers for where the method runs out and a substantive theoretical, interpretive, or ethical judgment must be made by a person rather than settled by procedure. It should be usable by non-philosophers under time pressure, honest about which distinctions must survive simplification and which simplifications will predictably misfire, and clear about what the procedure cannot settle.

  Then demonstrate the procedure on three recurring cases from our lab, showing the intermediate verdicts at each step: a meditator who first describes an episode as timeless and selfless and then offers an elaborate theory about timeless awareness during the same interview, a lucid dreamer whose reports of agency contradict each other across two sessions a week apart, and the chatbot dialogues my team is enthusiastic about but about which I am skeptical. Include at least one application where following the procedure constrains what we can claim in a way my collaborators will find disappointing, and close by stating the principled limits of what such a procedure can do for a science of consciousness.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Director of a small interdisciplinary consciousness lab.
      *   **Task:** Translate Daniel Dennett's *heterophenomenology* into a practical, step-by-step procedure for a team of non-philosophers (neuroscience, HCI).
      *   **Constraints:** 90-minute interviews + follow-ups. Needs to handle specific cases (meditators, lucid dreamers, chatbots). Needs to distinguish data (seemings) from theory (reality). Needs explicit markers for where the method ends and judgment begins.
      *   **Deliverables:**
          1.  Step-by-step procedure (Briefing -> Interview -> Transcription -> Archive).
          2.  Criteria for sufficient answers/probing.
          3.  Rules for separating "seemings" from "theory/third-person."
          4.  Markers for where human judgment is required.
          5.  Demonstration on three cases (Meditator, Lucid Dreamer, Chatbot).
          6.  One application where the procedure constrains claims (disappointing collaborators).
          7.  Closing statement on principled limits.
      *   **Tone:** Professional, practical, philosophically rigorous but accessible, honest about limitations.

  2.  **Deconstruct Heterophenomenology for a Lab Context:**
      *   *Core Idea:* Treat subjects as informants about their *beliefs* about their experiences, not necessarily authorities on the *facts* of their experiences. The "text" produced is the data. The researcher interprets the text to build a "subject's worldview."
      *   *Challenge:* Non-philosophers often slide into either naive realism ("They said it happened, so it happened") or eliminativism ("It's just neurons, the report is noise").
      *   *Solution:* A rigid protocol that forces the distinction between *Reported Experience* (R-Exp), *Subject's Theory* (S-Theory), and *Observer's Data* (O-Data).

  3.  **Drafting the Procedure (The "Heterophenomenological Protocol" - HP):**
      *   *Phase 1: Briefing.* Set expectations. "We record how it seems, not necessarily how it is."
      *   *Phase 2: Interview.* The core data generation. Need specific question types (Descriptive vs. Explanatory).
      *   *Phase 3: Transcription & Tagging.* This is crucial. Tagging sentences as R-Exp, S-Theory, or O-Data.
      *   *Phase 4: Archive Construction.* The "Neutral Text."
      *   *Phase 5: Theoretical Interpretation.* Where the PI steps in.
      *   *Decision Rules:* When to probe? (Vagueness, contradiction, theoretical overreach). When to stop? (Subject insists on the seeming).
      *   *Stop Conditions:* Where the method fails (e.g., determining truth of consciousness).

  4.  **Developing the Three Case Studies:**
      *   *Case 1: The Meditator.* Distinguishing the *experience* of timelessness from the *theory* of timeless awareness.
          *   *Constraint:* We can archive "It seemed timeless," not "Time stopped."
      *   *Case 2: The Lucid Dreamer.* Handling contradiction across time.
          *   *Constraint:* Archive both reports as distinct belief states. Do not reconcile them for the subject.
      *   *Case 3: The Chatbot.* The contentious one.
          *   *Constraint:* The chatbot produces text. Heterophenomenology treats text as the data. But does the chatbot have "beliefs"?
          *   *Disappointment:* We cannot claim the chatbot *is* conscious, only that it produces text *indistinguishable* from a conscious report within the protocol. The protocol forces agnosticism.

  5.  **Refining the "Disappointing Constraint":**
      *   The chatbot case is the best candidate. Collaborators want to treat it as a subject. The protocol says: "We archive the text, but we cannot infer the inner light." This will frustrate the HCI team.

  6.  **Addressing the "Non-Philosopher" Aspect:**
      *   Avoid jargon like "intentional stance" or "qualia" without definition.
      *   Use clear tags (e.g., [SEEMING], [THEORY], [OBSERVATION]).
      *   Create a checklist mentality.

  7.  **Addressing the "Principled Limits":**
      *   Heterophenomenology doesn't solve the Hard Problem. It organizes the data *about* the Hard Problem. It prevents bad metaphysics but doesn't provide good metaphysics.

  8.  **Review and Iterate (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Add specific script examples for the interviewers.
      *   *Critique:* Is the chatbot section clear?
      *   *Fix:* Emphasize that the chatbot is treated *as if* it were a subject for the sake of the text, but the ontological status is bracketed explicitly.
      *   *Critique:* Did I include the "markers for human judgment"?
      *   *Fix:* Add a specific "PI Sign-Off" section in the protocol where the procedural automation stops.

  9.  **Final Polish:**
      *   Ensure the tone respects the PI's authority and the team's expertise.
      *   Check that all constraints of the prompt are met (90 mins, specific cases, limits, etc.).

  **(Self-Correction Note on the Chatbot Case):** I need to be careful here. Dennett's heterophenomenology is about *subjects*. A chatbot isn't a subject in the biological sense. However, the method treats the *output* as the phenomenon. The constraint is that we cannot move from "It says it is conscious" to "It is conscious." This is the perfect place to disappoint the collaborators.

  10. **Final Structure:**
      *   Introduction: Acknowledging the challenge.
      *   The Protocol (5 Steps).
      *   Decision Rules & Tags.
      *   Case Studies (Meditator, Dreamer, Chatbot).
      *   The "Disappointing" Constraint (Chatbot).
      *   Principled Limits.

