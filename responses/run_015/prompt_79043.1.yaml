  **Decomposing Origin Essentialism: Metaphysical Necessity or Normative Convention?**

  This project tests the hypothesis that origin essentialism is not a unified metaphysical thesis but a cluster of four distinct claims that fragment under biological scrutiny, revealing the doctrine to be a normative convention for tracing lineages rather than a modal fact about individuals. The standard debate regarding whether a human organism could have developed from a different sperm and egg has reached an impasse because defenders and detractors argue from the same single textbook example, leaving the concept of an "origin" undefined. Consequently, the thesis is either taken as obvious intuition or dismissed as a linguistic artefact, with no progress made on what precisely is essential. I propose that the standard thesis conflates four distinct claims: zygote essentialism (the organism could not have developed from a different fertilised egg), gamete-pair essentialism (it could not have arisen from a different sperm and egg), genome essentialism (it could not have had a different nuclear genome), and lineage essentialism (it could not have had different biological parents). While these claims coincide in standard cases, they come apart in biologically possible scenarios that the literature has not properly digested.

  The methodology is strictly conceptual, utilizing case analysis to test candidate principles of origin against three specific biological phenomena. First, monozygotic twinning demonstrates that gamete-pair essentialism fails to individuate persons, as two distinct organisms share a single origin. Second, chimerism shows that the presupposition that an organism has exactly one origin is not an empirical universal, forcing a decision about whether the fusion event or one of the contributing zygotes constitutes the origin. Third, mitochondrial replacement therapy separates nuclear genome, cytoplasmic contribution, and gestational lineage, making the four claims come apart in every combination. By mapping how each of the four claims fares in these cases, I will determine whether a coherent unified thesis survives or whether the doctrine functions merely to regulate how we trace lineages. This approach meets the natural objection that such cases are biological curiosities leaving the modal claim untouched; instead, I will argue that if the thesis cannot account for these possibilities without ad hoc restriction, its claim to metaphysical necessity is undermined.

  **Work Plan**
  The semester is divided into three phases of analysis followed by synthesis and drafting.
  *   **Weeks 1–3:** Decomposition and Literature Review. Formalize the four distinct claims and map existing arguments onto them to demonstrate the current conflation.
  *   **Weeks 4–6:** Case Study 1 (Twinning). Analyze whether zygote essentialism can survive the individuation problem posed by twinning without collapsing into haecceitism.
  *   **Weeks 7–9:** Case Study 2 (Chimerism). Develop the argument regarding multiple origins and test whether lineage essentialism can accommodate fusion events.
  *   **Weeks 10–12:** Case Study 3 (Mitochondrial Replacement). Test the divergence of genome and gamete claims against assisted reproduction technologies.
  *   **Weeks 13–15:** Synthesis and Drafting. Integrate findings to argue for the normative interpretation, finalize the manuscript, and prepare workshop materials.

  **Deliverables**
  The primary deliverable is a paper of approximately 8,000 words suitable for submission to a top-tier journal in metaphysics or philosophy of biology. The secondary deliverable is a one-day internal workshop involving colleagues from philosophy and biology to stress-test the conceptual analysis against current scientific understanding. The workshop will be held in the final week of the semester to incorporate feedback into the final draft before external submission.

  **Criteria for Success and Failure**
  A real result consists of demonstrating that the four claims are logically independent and that no single principle of origin covers all three cases without significant theoretical cost. Success means showing that the surviving thesis is considerably weaker than its defenders suppose, specifically that it relies on normative choices about lineage tracing rather than modal facts. A merely clarifying restatement would involve distinguishing the claims without showing that the distinction forces a revision of the metaphysical status of the thesis. The honest failure mode is plain: if all three cases can be accommodated by a small patch to the standard thesis—for example, by dismissing them as deviant cases that do not touch the core modal intuition—then there is no project here. If the standard defence can absorb these cases without conceding that "origin" is normative, the hypothesis is falsified, and the result will be a negative report confirming the robustness of the standard view.

  **Scope and Feasibility**
  One semester of partial teaching relief is sufficient for this scope provided the writing remains focused on the conceptual decomposition rather than drifting into general philosophy of biology. The 8,000-word target is achievable within the fifteen-week timeline if the case analysis is disciplined. However, if the biological details of chimerism or mitochondrial replacement require extensive empirical verification beyond conceptual possibility, the scope would have to be cut by reducing the third case study to a thought experiment based on stipulated facts rather than actual medical protocols. Similarly, if the workshop proves logistically difficult to schedule, it may be replaced by a targeted reading group with two or three colleagues to ensure the conceptual work receives critical feedback without the administrative overhead of a full-day event. The risk of overpromise is low because the failure mode is clearly defined; if the cases do not force the claims apart, the project concludes early with a negative result.
