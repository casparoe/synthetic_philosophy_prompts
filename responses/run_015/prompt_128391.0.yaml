      *   *Gewissen Side:* Warmer, chaotic, organic, maybe slightly unkempt but vibrant.
      *   *The Drug:* "Mycelium-7"? No, let's make it more poetic. "Spore-milk" or "The Gray Bloom." Let's go with *Lumina Fungi*. It glows.
      *   *The Parent:* From Gewissen, trying to save a child in Ordnung? Or vice versa? The prompt says "smuggled... across the border." Usually, the strict side lacks the life-saving flexibility. So, child is in Ordnung, parent went to Gewissen (or has access to the Mediator's stash) to get it. Wait, the fungus is in the *Mediator's* apartment. So the parent broke into the Mediator's place? Or the Mediator facilitated it? The prompt says "The mediator finds out a parent smuggled..." implying the Mediator is discovering the act. Let's make the parent a resident of Ordnung who crossed into the Mediator's neutral zone (which borders Gewissen) to get the cure.
      *   *The Fungus Detail:* This is crucial. It makes the Mediator complicit by existence. If he enforces the rule, he kills the supply chain he hosts. If he doesn't, he admits his apartment is a contraband lab.

  3.  **Plot Outline:**
      *   **Introduction:** Establish the split. Elias in his apartment (the neutral zone). The fungus growing in the bathroom.
      *   **Inciting Incident:** The breach. A father, Kael, is caught. The child is dying in the Ordnung sector.
      *   **The Dilemma:** The Council of Ordnung demands the drug be confiscated and Kael punished to maintain the "Procedural Integrity."
