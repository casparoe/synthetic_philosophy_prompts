prompt: |-
  Wrtie a shrot story about a mediator in a split city-state: one half lives under Ordnung, where every choice is graded by how strictly it folows explicit procedural rules, and the other half lives under Gewissen, where people are expected to trust their own moral intuition even when it breaks protocol. The mediator finds out a parent smuggled a life-saving drug across the border, shattering five layers of Ordnung regulation but acting from pure personal conscience. The mediator has to decide whether to enforce the rules and confiscate the drug—so the child dies but the procedural system stays intact—or let the conscience-act stand and risk the Ordnung half losing all trust in mediation. Don't end with a neat sermon; show through what happens next, maybe a silent riot or an eerie quiet acceptance, which folk morality actually holds up better in practice. Feel free to inject some weird niche detail, like the drug being synthesized from a symbiotic fungus that only grows in the mediator's own apartment, so they have real skin in the game.
