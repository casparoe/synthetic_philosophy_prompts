answer: |-
  The fungus grew in the shower. It wasn't a mold; it was a pulsing, bioluminescent lattice of violet mycelium that clung to the grout and breathed in time with the city's power grid. Elias brushed his teeth beside it, spitting pink foam into the drain, careful not to let the bristles touch the fruiting bodies. This was *Ambrosia*, the only known cure for the Gray Lung rotting the children of the Ordnung sector. It was also contraband.

  A heavy knock rattled the door of the Neutral Zone apartment. Not the frantic pounding of Gewissen, but the rhythmic, three-stroke cadence of Ordnung.

  Elias opened the door. Auditor Vane stood there, flanked by two Enforcers in gray ceramic plating. Between them knelt a man from the Ordnung side, Kael, clutching a vial of violet slurry to his chest.

  "Mediator," Vane said, his voice flat, calibrated to decibel standard 40-B. "Subject Kael breached five layers of border regulation. Section 9, Paragraph 4: Unauthorized Bio-Transfer. He entered your domicile, harvested the symbiote, and attempted to cross the Meridian."

  Kael looked up. His eyes were red, not from weeping, but from the exhaustion of a man who had spent three nights filling out waiver forms that were inevitably rejected. "My daughter is in Stage 4," Kael whispered. "The waiver required a prognosis of Stage 5. By the time she qualifies, she'll be dead."

  "Procedure ensures equity," Vane recited. "If we allow exceptions, the Ledger becomes subjective. If the Ledger becomes subjective, trust evaporates. Mediator, confiscate the substance. Administer the penalty. Restore the integrity of the border."

  Elias looked at the vial. It glowed faintly, matching the pulse of the fungus in his bathroom. If he handed it over, Vane would incinerate it. Then they would sanitize the apartment. The fungus would die. Elias would be just another bureaucrat in a gray suit, presiding over a graveyard of rules.

  If he let Kael go, the Ledger would show a breach. Ordnung would claim the Mediation was compromised. The trust holding the two halves of the city together—the belief that the border was real—would shatter.

  "Stand up, Kael," Elias said.

  Vane's hand hovered over his stun-baton. "Mediator? Protocol dictates immediate seizure."

  "Protocol dictates that bio-hazards must be contained by a licensed handler," Elias lied. He reached out and took the vial from Kael's trembling hand. The warmth of it seeped into his palm. "This substance is unstable outside my environment. If you take it now, it degrades. It becomes useless."

  "Then we destroy it to prevent contamination," Vane said.

  "And condemn a citizen to death by procedural latency?" Elias asked. He walked back to the bathroom, the Auditors following. He stood over the shower. The fungus pulsed faster, sensing the vial. "The regulations state that the Mediator has final discretion on bio-safety. I am classifying this as an emergency containment transfer. The drug stays with me. I will administer it."

  "That is not the procedure for—"

  "It is the procedure for *survival*," Elias snapped. He looked Vane in the eye. "You want the border intact? Let the child live. If she dies, the Gewissen sector sees a martyr. If she lives, they see a glitch. Which do you prefer? A riot or a paperwork error?"

  Vane stared at him. The logic was twisted, a knot of Gewissen intuition wrapped in Ordnung syntax. It wasn't rule-following; it was rule-hacking. Vane lowered his hand. "Log the deviation. File 88-Theta. We will audit this."

  "File it," Elias said.

  Kael slumped against the doorframe, weeping silently. He didn't thank Elias. In Ordnung, gratitude was a transaction; in Gewissen, it was a burden. He just took the vial Elias handed him, turned, and ran into the gray streets.

  Elias expected the riot to start that night. He expected the Gewissen side to cheer the breach and the Ordnung side to burn the mediation office in rage.

  He walked out an hour later to clear his head. The Meridian Plaza was empty. The great holographic Ledger, usually scrolling thousands of transactions per minute, had slowed. The numbers were still ticking, but the color had shifted from a stern white to a dull, sickly yellow.

  He walked into the Ordnung sector. The streets were scrubbed clean. The traffic lights cycled red, green, red, green.

  But no one was stopping.

  A delivery truck rolled through a red light. The driver didn't speed; he just didn't brake. A pedestrian stepped off the curb without checking the signal, not in a rush, but with a casual, drifting gait. A group of clerks stood outside a government building, smoking cigarettes in a designated non-smoking zone. They weren't laughing or shouting. They weren't holding signs.

  They were just ignoring the lines.

  Elias watched a woman drop a wrapper. It fluttered to the pristine pavement. In Ordnung, a sanitation drone would have swooped within seconds. Today, the drone hovered, confused by the lack of a violation code, then drifted away. The woman didn't pick it up. She just kept walking.

  The system hadn't collapsed. The lights still worked. The drones still flew. The Auditors were still at their desks. But the *belief* was gone. The magic of the rule was that it applied to everyone, everywhere, always. By bending it for Kael, Elias hadn't broken the law; he had revealed it as a suggestion.

  The silence wasn't the quiet of fear. It was the quiet of a game where everyone had realized the rules were made up.

  Elias turned back toward his apartment. On the wall of the Mediation building, a digital sign flashed: *INTEGRITY AT 98%.*

  Below it, a young boy kicked a stone against the wall. *Clack.* He kicked it again. *Clack.* He wasn't playing a game. He was just testing the sound. He looked at Elias, kicked the stone one more time, and let it roll into the gutter. He didn't run away. He didn't look guilty. He just watched the stone disappear, waiting to see if the world would end.

  It didn't.

  Elias went inside and locked the door. In the bathroom, the fungus pulsed, bright and hungry. He turned on the tap to humidify the air, listening to the water run. Outside, the city continued to function, perfectly, efficiently, and utterly hollow, as the people of Ordnung began, one by one, to listen to the quiet voice in their own heads instead of the loud one on the screen.
