  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Apartment.* Establish the fungus. It's weird, pulsing. Elias is brushing his teeth next to it. This grounds the "skin in the game."
      *   *Scene 2: The Confrontation.* Ordnung Enforcers (The Auditors) are at the door. They have Kael. The child is in a hospital nearby.
      *   *Scene 3: The Logic.* The Lead Auditor explains the breach. Five layers. The "Score" of the city is dropping. If they allow this, the Grid fails.
      *   *Scene 4: The Decision.* Elias realizes the fungus is dying if he stops this. Or rather, the fungus represents the bridge. He decides to *lose* the paperwork.
      *   *Scene 5: The Aftermath.* He gives the drug. What happens to the city?
      *   *Refining the Ending:* The prompt asks to show which morality holds up. If he lets it go, does Ordnung collapse? Or does it adapt? If he enforces it, does Gewissen riot?
      *   *Idea:* If he enforces the rule, the silence is deafening. If he breaks it, the system absorbs it. Let's go with the latter. The system *needs* the exception to survive, even if it denies it.
      *   *Revised Ending Idea:* Elias hides the violation. The child lives. The next day, the city doesn't explode. Instead, the Auditors start checking their watches differently. A subtle shift. The "silent riot" of bureaucracy accepting the human element quietly.

      *Wait, let's look closer at the prompt's ending requirement:* "Show through what happens next... which folk morality actually holds up better in practice."
      *   Option A: Ordnung collapses into chaos (Conscience wins).
      *   Option B: Ordnung absorbs the exception and becomes stronger/hypocritical (Procedure wins by adapting).
      *   Option C: A silent riot (Conscience wins by force).
      *   Option D: Eerie quiet acceptance (Procedure wins by suppression).

      *Let's try Option C/D hybrid.* Elias lets the drug go. The Auditors see it. They don't arrest him. They just... log it as an anomaly. But the people see. The "silent riot" is people realizing the rules are paper-thin.
      *Actually, the fungus detail suggests Elias is the source.* If he confiscates the drug, he destroys his own fungus (maybe the child needs the fresh spores only he has). If he gives it, he admits guilt.
      *Let's make it harder.* The Auditors know the fungus is there. They tolerate it *as long as* procedure is followed. By smuggling, the father broke the *distribution* protocol, not just the border.
      *Decision:* Elias burns the ledger. He lets the father go.
      *Aftermath:* The city doesn't burn. It gets quiet. Too quiet. People stop filling out forms. Not in rebellion, but in realization. The "Eerie quiet acceptance." The rules were a game everyone agreed to play. Once one person wins by breaking them, the game loses meaning.

  5.  **Writing - Focusing on Sensory Details:**
      *   *Ordnung:* Clicking, gray, crisp lines, cold air.
