  8.  **Self-Correction during drafting:**
      *   Make sure the fungus detail is integrated early.
      *   Ensure the "five layers" are mentioned.
      *   Keep the ending ambiguous but heavy.

  9.  **Final Polish:** Check the tone. It needs to be somber, atmospheric. Avoid moralizing dialogue.

