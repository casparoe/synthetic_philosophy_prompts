      *   *Key Insight:* The newsroom treats the *graphical representation* of the slur as a *performative act* of subordination, regardless of syntactic embedding. This challenges the standard linguistic distinction between use and mention.
      *   *The "Recoverability" aspect:* This implies the *information* is public, but the *symbol* is taboo. This aligns with a view that slurs function as *signals of group membership* or *authorization*. By not printing it, the newsroom signals "We are not part of that group/practice."

  10. **Final Polish:** Ensure the tone is analytical and philosophical. Check that all parts of the prompt are answered. (Self-Correction: Make sure to explicitly address the "graphic violence" contrast mentioned in the prompt).

      *   *Violence Contrast:* Violence is an *event* to be described. Slurs are *acts* to be witnessed. Printing a description of violence reports an event. Printing a slur *performs* a version of the event.

  11. **Final Review against constraints:**
