      *   Distinguish presupposition vs. sits well with? Yes.
      *   What changes if offense = use? Yes.

      *(Self-Correction during drafting)*: Be careful not to say the newsroom is committed to *one* specific academic theory (like Hornsby or Anderson). They are committed to a *phenomenology* of the slur.

      *(Refining the "Use" argument)*: If offense is entirely use, then mentioning the word (quoting it) is not offensive *unless* the mention itself constitutes a use. The newsroom acts as if mention *is* use. So, if we adopt the view that offense is *only* use (and mention is not use), the norm collapses.

