answer: |-
  The redaction norm practiced by Anglophone news organizations constitutes a rich, albeit implicit, data point for the philosophy of language. By treating slurs differently from both ordinary vocabulary and graphic descriptions of violence, newsrooms enact a specific theory about what slurs *are* and how they function.

  ### 1. The Implicit Theory: Contagion and Institutional Endorsement

  The redaction norm presupposes a theory of slurs as **linguistic contaminants** whose harmful power is not exhausted by the speaker's intent, nor neutralized by syntactic embedding (such as quotation).

  When a newsroom prints a graphic description of violence (e.g., "he was stabbed in the neck"), it treats the language as a transparent window onto an event. The words describe the violence; they do not *enact* it. However, when a subject says, "I hate [slur]," and the newsroom prints "I hate the n-word," they are treating the slur not merely as a description of the subject's attitude, but as a toxic object that retains its potency even when held at arm's length.

  This presupposes two things:
  1.  **The Collapse of Use and Mention:** In standard linguistics, *mentioning* a word (talking about it) is distinct from *using* it (employing it to refer). The norm acts as if this distinction is porous regarding slurs. To print the graphemes is to participate in the circulation of the harm, regardless of the grammatical context.
  2.  **Institutional Voice:** The newsroom recognizes that its publication is not a neutral medium but a speech act in its own right. By printing the slur, even in quotes, the institution is seen as authorizing or normalizing the term's presence in public discourse. The harm is not just in the original utterance, but in the *replication* of the slur by a powerful entity.

  ### 2. The Tension: Semantic Toxicity vs. Recoverable Information

  You identify two features that seem to pull in opposite directions:
  *   **Feature A (The Ban):** The word is too dangerous to print, suggesting the derogation is inherent to the word-form (Semanticism/Expressivism).
  *   **Feature B (The Hint):** The word is uniquely recoverable via asterisks or description, suggesting the specific graphemes are not magical, but rather the *act of printing them* is the taboo (Pragmatics/Convention).

  **Is this inconsistent?**
  Superficially, yes. If the word is inherently toxic (Feature A), then "n-word" should be nearly as toxic as the full word, since the reader supplies the phonology and semantics mentally. If the toxicity lies only in the institutional endorsement of the specific form (Feature B), then redaction is a mere ritual, as the meaning is preserved.

  **Can a single account resolve this?**
  Yes, a **Social Practice** or **Conventional Implicature** account resolves the tension best.
  *   *Semantic Content:* The account accepts that the slur carries derogatory content (explaining Feature A: we don't want to assert this content).
  *   *Conventional Force:* However, it locates the primary harm in the *convention of deployment*. By redacting, the newsroom signals: "We acknowledge this concept exists and was used, but we refuse to participate in the convention that requires *this specific sound/shape* to express it."
  *   *Recoverability:* The fact that the word is recoverable (Feature B) is not a bug but a feature. It ensures the *factual accuracy* of the report (the audience knows the severity of the speaker's bias) without the newsroom *instantiating* the slur in the public record.

  This view aligns with the philosophy of slurs that locates meaning in **propriety conditions** rather than truth conditions. The newsroom is saying: "It is true that the speaker said X, but it is not *proper* for us to print X."

  ### 3. Philosophical Commitments

  How much of the philosophy of slurs is the newsroom committed to?

  *   **Committed:** They are committed to **Non-Disquotationality**. They reject the idea that `"Slur" means the same as "Neutral Counterpart"`. If they believed slurs were semantically equivalent to neutral descriptors (e.g., "German" vs. "Boche") merely colored by attitude, they might print them to show the attitude. By redacting, they affirm that the slur does something the neutral term does not.
  *   **Committed:** They are committed to a version of **Expressivism** or **Hybrid Semantics**. They treat the slur as having a "descriptive" component (which they report via the hint) and an "expressive/evaluative" component (which they suppress).
  *   **Not Committed:** They are *not* strictly committed to **Semanticism** (the idea that the derogation is entirely in the truth-conditional content). If they were, the hint "n-word" would be just as harmful as the word, because the semantic content is identical. The fact that they allow the hint suggests they believe the *materiality* of the word matters.
  *   **Not Committed:** They are *not* committed to **Pure Pragmatics** (the idea that the word is neutral and only the context makes it offensive). If they believed this, they could print the word with a disclaimer ("used offensively").

  The newsroom is effectively committed to a **Materialist Theory of Slurs**: the word is a harmful object, not just a carrier of meaning.

  ### 4. Strict Presuppositions vs. What "Sits Well"

  To distinguish what the norm *requires* from what is merely *compatible*:

  **Strictly Presupposed:**
  1.  **Harm in Reproduction:** The act of reproducing the slur causes harm distinct from the harm of the original utterance. (Otherwise, redaction is unnecessary).
  2.  **Institutional Agency:** The newsroom is an agent with a voice distinct from the quoted subject. (Otherwise, they could claim "we are just a conduit" and print everything).
  3.  **Informational Sufficiency of Redaction:** The description "racial slur" conveys the necessary factual information without the lexical item. (Otherwise, the redaction undermines the journalism).

  **Merely Sits Well With (Compatible but not required):**
  1.  **Semantic Toxicity:** It sits well with the view that the word *means* something evil, but the norm could also be explained by a purely social taboo unrelated to semantics.
  2.  **Reader Protection:** It sits well with the idea that readers need emotional protection, but the norm could equally be about protecting the *institution's* moral standing.
  3.  **Universal Taboo:** It sits well with the idea that *no one* should say the word, but the norm is specific to the *newsroom*, implying private use might be treated differently (though the norm often implies universal avoidance).

  ### 5. The Counterfactual: If Offense Were Entirely a Matter of Use

  Suppose we adopt a strict **Use-Theory** (e.g., a radical Contextualism or Usage-Based view), where a slur's offense lies *entirely* in the speaker's act of subordination at the moment of utterance. On this view, the word itself is inert; the harm is the *deployment* to subordinate a group.

  If this view were adopted, newsroom practice would change drastically:

  1.  **Full Quotation:** The newsroom would print the slur verbatim within quotation marks. Since the offense lies in the *use*, and the newsroom is *mentioning* the word (reporting on a use, not performing one), no harm is committed. The quotation marks act as a "quarantine" that neutralizes the subordinating force.
  2.  **No Asterisks:** "N-word" would be seen as unnecessary censorship. If the word is not inherently toxic, hiding the letters serves no philosophical purpose.
  3.  **Contextual Disclaimers:** Instead of redaction, the safeguard would be contextual framing. The newsroom would ensure the surrounding text makes clear that *the subject* is the one subordinating, not the paper.
  4.  **Parity with Violence:** Slurs would be treated like graphic violence. Just as we print "he was stabbed" to report the violence accurately, we would print "he called him a [slur]" to report the hate speech accurately. The word becomes a datum, not a weapon.

  **Why the current norm rejects this:**
  The current norm persists because newsrooms intuitively recognize that in the **social practice** of mass media, the distinction between *use* and *mention* is socially porous. To print the word is to invite it into the home, the feed, and the search engine index. It becomes part of the *common vocabulary* of the readership, not just a report on a vocabulary.

  Therefore, the redaction norm is not internally inconsistent. It is a pragmatic solution to a hybrid problem: it acknowledges the **semantic reality** of the slur (by hinting at it so the gravity is understood) while refusing the **pragmatic license** required to print it (by withholding the graphemes). It treats the slur as a weapon that must be described in evidence logs but never displayed in the courtroom.
