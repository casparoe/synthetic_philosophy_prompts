          *   Feature A: Slurs are too dangerous to reproduce even in mention (suggests semantic content/derogation survives embedding).
          *   Feature B: The word is uniquely recoverable via description/asterisks (suggests the specific word-form isn't the problem, but rather the endorsement/context).
      *   **Task 4:** Determine if the norm is internally inconsistent or if a single account (semantic, pragmatic, social practice) can explain both.
      *   **Task 5:** Distinguish what the norm *strictly presupposes* vs. what it *merely sits well with*.
      *   **Task 6:** Explain what would change in newsroom practice if we adopted a view where offense is *entirely a matter of use* (purely pragmatic/conduct-based).

  2.  **Analyze the "Redaction Norm":**

      *   *Practice:* Print "n-word" or "racial slur" instead of the actual word, even in quotes. Print graphic violence descriptions fully.
      *   *Implication 1 (The Ban):* The word itself carries a toxic charge that isn't neutralized by quotation marks (mention vs. use distinction is collapsed or weakened). This points towards *Semanticism* or *Expressivism* where the toxicity is inherent to the lexical item.
      *   *Implication 2 (The Hint):* The word is recoverable. Readers know exactly what was said. This implies the *informational content* is necessary, but the *performative act* of printing the specific graphemes is the taboo. This points towards a *Conventional Implicature* or *Social Practice* view where the harm lies in the *circulation* or *normalization* of the term by the institution.

  3.  **Reconstructing the Implicit Theory:**

      *   The newsroom acts as if the slur has a "contagion" property. Printing it spreads the harm, even if the newsroom condemns it.
      *   This aligns with a hybrid view: The word has a derogatory semantic load (otherwise why hide it?), but the harm is exacerbated by institutional endorsement (otherwise why hint at it?).
      *   *Contrast with Violence:* Violence descriptions are factual reports. Slurs are treated as *acts* of violence themselves when printed.

  4.  **Addressing the Tension (Feature A vs. Feature B):**

      *   *Feature A (Don't print):* Suggests the word is inherently toxic (Semantic Content/Expressivism). If it were just about the speaker's intent, quoting it safely would be easy (like quoting a lie).
      *   *Feature B (Do hint):* Suggests the specific string of letters isn't magical. If it were purely semantic contamination, even the hint "n-word" might be too much (some outlets go further and say "a racial epithet"). But usually, "n-word" is acceptable. This suggests the harm is in the *normalization* of the full form in public discourse.
      *   *Resolution:* A *Social Practice/Conventional* account fits best. The word is a tool of subordination. The newsroom refuses to *wield* the tool (Feature A) but acknowledges the *fact* that the tool was wielded by the subject (Feature B). The harm isn't just in the meaning, but in the *replication* of the slur by a powerful institution.

  5.  **Philosophical Commitments:**

      *   *Semanticism:* Committed to the idea that the slur carries derogatory content that doesn't vanish in mention.
      *   *Pragmatics:* Committed to the idea that the *newsroom's* use (even in mention) constitutes a distinct speech act with different felicity conditions than the subject's use.
      *   *Commitment Level:* They aren't committed to a specific academic theory (e.g., Homophonic vs. Heterophonic), but they are committed to the *ontological status* of the slur as a dangerous object, not just a descriptor.

  6.  **Strict Presuppositions vs. "Sits Well With":**

      *   *Strictly Presupposes:* That printing the word causes harm distinct from reporting the fact that the word was used. That the newsroom's voice is distinct from the quoted voice (otherwise they wouldn't need to redact).
      *   *Sits Well With:* Expressivism (the word expresses hatred), Semanticism (the word encodes hatred), Social Practice (the word enforces hierarchy).
      *   *Tension:* If the offense were *entirely* a matter of use (pure Pragmatics), redaction would be unnecessary provided the context made clear the newsroom condemns it.

  7.  **Scenario: Offense is Entirely a Matter of Use:**

      *   *Theory:* Pure Pragmatic/Use-Based View (e.g., certain contextualist or usage-based accounts). The word is just sounds/letters; the harm is in the *intent to subordinate* or the *context of deployment*.
      *   *Newsroom Change:* If the newsroom makes clear *they* are not subordinating anyone, but merely reporting that *someone else* did, they could print the word.
      *   *Practice:* Full quotation. No asterisks. Perhaps a content warning, but no redaction. The distinction between "use" and "mention" would be rigorously enforced.
