answer: |-
  Dear colleague, you are walking into a room where the philosophical stakes are high but the empirical leverage is low, and your survival depends on keeping the philosophers from collapsing your theory into first-order representationalism while keeping the neuroscientists from collapsing it into global workspace theory. You have twenty minutes of questions, which means you will likely face four or five heavy interventions, and you need to manage the clock by giving answers that are substantive enough to satisfy the questioner but concise enough to prevent a debate from eating the whole period. Before you even take the first question, you should spend the first two minutes of the Q&A period making two strategic concessions that will disarm the agnostic and the lab PI without sacrificing your core claims. You need to concede that you do not yet have a specific neural signature for indexicality distinct from global ignition, and you need to concede that the phenomenology of your second case, the contentless presence, is thin and relies on introspective reports that are notoriously noisy. By admitting these limitations upfront, you signal that you are not trying to sell a finished neural model but rather a conceptual framework that guides the search for one, which satisfies the agnostic philosopher's demand for testability without forcing you to defend a specific scan result you cannot guarantee. You must hold firm, however, on the claim that consciousness is constitutive of the monitoring relation rather than a product of it, and on the claim that metacognitive confidence can dissociate from phenomenal experience, because if you concede either of those, your thesis dissolves into either first-order representationalism or standard signal detection theory.

  The most damaging objection you will face comes from your first-order representationalist committee member, who will argue that you have not actually described a higher-order state but merely a first-order state with a relational gloss that collapses your view into hers. She will ask you why an indexical registration that is non-conceptual and fixed by its target is not just a first-order state with a self-directed component, arguing that the direction of explanation remains backwards because the target state must already be sufficiently robust to be indexed. You need to answer this by saying that the constitutive claim of higher-order theory is not about temporal sequence but about metaphysical dependence, and that your indexical registration adds a structural feature to the system that first-order theory lacks, namely a dedicated selection mechanism that makes the state available to the self without requiring conceptual categorization. You should say something like this: The worry here is that I have just renamed a specific kind of first-order access, but the distinction lies in the failure conditions. On a first-order view, if the sensory state is present and robust, consciousness is present, full stop. On my view, consciousness requires the successful selection of that state by the monitoring mechanism. We can imagine, and I argue we can empirically find, cases where the sensory state is robust enough for discrimination and even for confidence judgments, but the selection mechanism fails to register it indexically. That dissociation is impossible on your view because you tie consciousness directly to the first-order content, but it is the defining prediction of mine. The force of this objection is genuine because if your mechanism is just a property of the first-order state, you are a first-order theorist, so you must insist that the mechanism is a distinct computational process that can fail independently of the sensory processing.

  The second most damaging objection will come from the graduate students and the PI, who will attack your empirical spine by arguing that well-calibrated confidence is itself the mark of consciousness, meaning your first case is impossible. They will use the vocabulary of type-2 sensitivity and meta-d prime to argue that if the patient knows she discriminated well, she has access to the reliability of her first-order state, and that access just is consciousness. They will say your indexical registration does no work beyond what first-order evidence already explains. You need to reply by distinguishing between access to reliability and access to presence. You should say something like this: I agree that calibrated confidence implies access to the reliability of the signal, but reliability is a statistical property of the relationship between stimulus and response, whereas phenomenal presence is the immediate registration of the state itself. My proposal is that the brain can compute confidence based on the strength of the sensory evidence without ever indexically registering the state as belonging to the subject. In the patient I describe, the type-2 sensitivity is intact because the evidence accumulation is working, but the self-monitoring mechanism that tags that evidence as my experience is degraded. This is why she reports no experience despite high confidence. The force of this objection is high because if confidence and consciousness are empirically inseparable, your case 1 vanishes, so you must hold that confidence is a judgment about performance while consciousness is the registration of the state driving performance.

  The third objection will come from the PI and postdoc who are committed to global neuronal workspace theory, and they will argue that your self-monitoring mechanism is just workspace broadcasting with extra vocabulary. They will say that if the state is selected and made available for report, it has undergone ignition and broadcast, so you are not offering a competing theory but merely a reinterpretation of their data. You need to concede that there is likely overlap in the neural substrate but insist on the conceptual distinction regarding the content of the broadcast. You should say something like this: I am willing to concede that the neural implementation of indexical registration likely involves global ignition, but GNW identifies consciousness with the broadcast of content for reportability, whereas I identify it with the specific self-referential structure of the monitoring signal. A state can be broadcast for the purpose of guiding behavior or confidence judgments without being indexically registered as a subjective experience. Your theory predicts that global access entails consciousness, but my theory allows for global access to sensory content for the sake of metacognitive judgment without the subjective feel, which is exactly what the dissociation in case 1 demonstrates. This objection has genuine force because if you cannot distinguish your mechanism from broadcast, you lose novelty, but you can survive by framing your view as a refinement of what counts as consciousness within the workspace.

  The fourth objection concerns your second case, the contentless experience, and this is where you are most vulnerable. The neurologist and the agnostic philosopher will ask what a contentless experience is and whether the notion is simply empty, arguing that if there is no phenomenal character beyond bare presence, it is indistinguishable from arousal or alertness. You need to acknowledge the thinness of this phenomenology while arguing for its structural necessity. You should say something like this: I agree that this is a limiting case and phenomenologically thin, but it is structurally distinct from mere arousal because it involves the successful operation of the self-monitoring mechanism on a degraded target. The patient reports something happening, which indicates the monitoring mechanism is firing, but reports no content, which indicates the target is empty. This is distinct from arousal because arousal is a background state of the system, whereas this is a specific monitoring event directed at a null target. Here is the first place where you should be willing to say that is a problem for the view and I do not have the answer yet, specifically regarding how we distinguish this report from a confusion about arousal levels, because the introspective data here is fragile and you need to signal intellectual honesty rather than dogmatism.

  The fifth objection will come from the agnostic philosopher regarding testability, asking how you distinguish no experience from no memory of experience, since your data relies on verbal report. You need to argue that the dissociation design controls for memory by requiring intact metacognition. You should say something like this: If the patient had no memory of the experience, she would not be able to calibrate her confidence judgments about her discrimination performance, but in my first case, metacognition is intact. The dissociation relies on the patient being able to report on her performance while denying the experience that usually accompanies it. This controls for memory deficits because the memory of the performance is preserved even if the phenomenal registration is not. This is a manageable objection if you keep the focus on the dissociation logic.

  There are two places where your replies are soft and you should flag them explicitly during the defense rather than waiting to be cornered. The first is the neural signature of indexicality, because if you cannot specify how the brain implements a non-conceptual demonstrative distinct from global broadcast, the lab will treat your theory as purely verbal. You should admit that while you have a computational description, the neural correlate is currently hypothetical and tied to the dissociation evidence rather than a specific scan pattern. The second is the phenomenology of the contentless experience in case two, as noted before, because if you claim too much certainty here, the neurologist will dismantle you with examples of delirium or arousal disorders. You should admit that this is a theoretical prediction that requires careful phenomenological interviewing to validate.

  Finally, there is one question you are quietly hoping nobody asks, which is how a non-conceptual indexical registration can drive a conceptual report of absence. If the mechanism is non-conceptual, how does the patient form the thought I have no experience to report it, since forming that thought requires conceptualizing the absence of the very state that is supposed to constitute consciousness. You should pre-empt this yourself in the last two minutes of your talk rather than leaving it alone, because if you wait for them to ask it, it will sound like a fatal contradiction. You can address it by distinguishing between the constitutive level and the reportive level, arguing that the report is a conceptual judgment about the failure of the non-conceptual mechanism to register content, mediated by intact conceptual metacognition. By raising this yourself, you frame it as a known complexity of the model rather than a hidden flaw, and it shows the committee you have thought through the interface between the non-conceptual mechanism and the conceptual data. If you leave it alone, the agnostic philosopher will certainly find it, and it will look like you missed the implication of your own theory. Good luck, and remember that your goal is not to prove you are right but to prove that your view is worth testing.
