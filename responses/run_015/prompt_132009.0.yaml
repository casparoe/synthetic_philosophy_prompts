prompt: |-
  I'm planning to run a small session for my friend's book club — mostly literature grad students who've never actually read Marx, just absorbed some vibes — on historical materialism and whether the economic base explains everything else or only parts of it. Don't explain the theory to me; plan how I should explain it. What's the dependancy order: what concept has to land before base and superstructure makes any sense, and why can't I open with the idea that economics drives culture? Pick one carrying example to build the whole session around — I was thinking of comparing a 19th-century textile mill town with a modern worker-owned software collective that distributes via open-source licenses, but tell me if that's a bad vehicle and exactly what properties the right example needs and what it must avoid. Then map the misconceptions: I expect they'll show up thinking it means money controls your opinions and also that this ignores all individual creativity — tell me where in the sequence each misconception should be intercepted, and what question I should ask to head it off in the moment. Give me one check question for the end that proves they've grasped the directional dependency — that the base conditions the superstructure without mechanically causing every detail — rather than just repeating jargon. Finally, tell me what part of this I should openly admit I'm skipping at this level — maybe the debates about whether culture ever pushes back on economics — and just say so without pretending to cover it.
