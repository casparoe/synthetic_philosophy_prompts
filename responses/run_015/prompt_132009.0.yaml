answer: |-
  Here is the session plan, structured to preempt the specific theoretical reflexes of literature grad students.

  ### 1. The Dependency Order: What Must Land First
  **Do not start with Base and Superstructure.**
  If you open with those terms, lit students will immediately file them under "Structuralism" or "Vulgar Marxism" and stop listening. They think they know the definition, and they are likely wrong.

  **The Prerequisite Concept: *Social Reproduction* (The Production of Life).**
  Before "Base" makes sense, they must accept the ontological priority of material survival.
  *   **The Sequence:**
      1.  **Humans are biological entities:** We must eat, sleep, and shelter before we can write poetry or draft constitutions.
      2.  **Production is Social:** We don't hunt/gather/code alone; we organize into groups to do it.
      3.  **Organization Creates Relations:** These necessary collaborations create power dynamics (who decides, who labors, who eats).
      4.  **NOW introduce "Base":** The Base is not "money" or "factories." It is *these specific social relations of production* required to keep the group alive at that historical moment.
      5.  **NOW introduce "Superstructure":** The legal, political, and cultural forms that arise to stabilize, justify, or navigate those relations.

  **Why you cannot open with "Economics drives culture":**
  To a lit grad, this sounds like **Conspiracy Theory** (rich patrons commissioning art) or **Mechanical Determinism** (input money, output ideology). It implies a conscious agent (the Economy) pulling levers. Historical materialism argues something subtler: the *structure of daily activity* limits the *imaginable horizon* of culture. You need to establish the *constraint* before you discuss the *content*.

  ### 2. Evaluating Your Carrying Example
  **Your Proposal:** 19th-century Textile Mill vs. Modern Worker-Owned Software Collective (Open Source).
  **Verdict:** **High Risk / Potentially Confusing.**
  **Why:** The "worker-owned" variable introduces a change in the *Base* (relations of production) that is too radical for a first pass. If you show a worker-owned co-op, you are no longer discussing the dominant capitalist mode of production, which is what Historical Materialism is usually analyzing in this context. It invites debates about whether the co-op is "truly" socialist or just an island in a capitalist sea, which distracts from the mechanism of conditioning.

  **Properties the Right Example Needs:**
  1.  **Constant Mode, Changing Tech:** Keep the *relations of production* (Capitalist: Owner/Worker) constant, but change the *forces of production* (Steam vs. Code). This isolates how the *base* conditions the *superstructure* without changing the fundamental class dynamic.
  2.  **Visible Friction:** The example must show where culture *struggles* to fit the economics.
  3.  **Avoid:** "Utopian" exceptions (like co-ops) until the rule is established.

  **Recommended Adjustment:**
  Compare the **19th-Century Textile Mill** to a **21st-Century Venture-Backed Tech Startup**.
  *   **Base (Both):** Private ownership of means, wage labor, profit motive.
  *   **Forces:** Steam looms vs. Servers/Code.
  *   **Superstructure Comparison:**
      *   *Mill:* Rigid clock time, physical discipline, unionization, clear class solidarity (us vs. them).
      *   *Startup:* "Flexible" time, blurred work/life boundaries, IP law as control, ideology of "meritocracy" and "disruption" (which hides the class relation).
  *   **Why this works:** It shows that even with the *same* economic base (capitalism), the specific material conditions condition *different* cultural vibes. It prevents them from saying "See? Economics doesn't matter, they're totally different!" You can show how the *specifics* of the base condition the *specifics* of the culture.

  ### 3. Mapping Misconceptions & Intercept Questions
  Lit students usually hold two specific defenses against Marx. Here is where to intercept them.

  **Misconception A: "Money Controls Opinions" (Vulgar Determinism)**
  *   **When it arises:** When you define the Base. They will assume you mean "The CEO tells the writers what to write."
  *   **Where to intercept:** Immediately after defining Base as *Social Relations*, before moving to Superstructure.
  *   **The Intercept Question:** "If the Base is just 'rich people giving orders,' why do capitalists often believe their own ideology? Why does a CEO genuinely believe in 'meritocracy' even when it suits them to deny it?"
  *   **The Point:** This forces them to see the Base as a *structural constraint* that shapes the CEO's mind too, not just a wallet buying influence.

  **Misconception B: "This Ignores Individual Creativity" (Mechanical Materialism)**
  *   **When it arises:** When you discuss the Superstructure. They will feel you are reducing art/thought to a reflex.
  *   **Where to intercept:** When discussing how the Superstructure stabilizes the Base.
  *   **The Intercept Question:** "If the Superstructure is just a reflex of the Base, why is there always *lag*? Why did feudal ideas of 'honor' persist for 100 years into industrial capitalism?"
  *   **The Point:** This highlights that the Superstructure has its own history and materials to work with. The Base sets the *limits of the possible*, not the *content of the actual*.

  ### 4. The Final Check Question
  Do not ask them to define Base or Superstructure. Ask them to apply the **directional dependency**.

  **The Question:**
  > "Imagine we invent a technology that makes wage labor physically impossible—say, a replicator that gives everyone everything they need instantly, rendering scarcity obsolete. If we keep our current copyright laws and concepts of 'intellectual property' exactly as they are today, what happens to the society? Does the Superstructure hold, or does it break? Why?"

  **What this proves:**
  *   If they say "The laws hold," they haven't grasped the dependency (they think culture is independent).
  *   If they say "The laws break because they serve a function that no longer exists," they understand that the Superstructure is conditioned by the material necessity of the Base.
  *   If they say "The laws change, but not immediately, and there will be a struggle over the new norms," they have grasped the nuance of conditioning vs. mechanical causation.

  ### 5. What to Explicitly Skip
  **The Omission:** **Reciprocal Action (Relative Autonomy).**
  **The Script:**
  > "I am going to intentionally bracket the question of how the Superstructure pushes *back* on the Base. Engels wrote about this in his later letters—how law, politics, and theory react upon the economic foundation. We are treating the Base as the primary conditioning factor today to get the vector right. If we talk about the feedback loop now, it becomes easy to slide back into saying 'it's all just a complex interaction' and lose the materialist edge. So for this hour: Base conditions Superstructure. Next time, we can fight about how culture changes economics."

  **Why:** Lit students *love* the feedback loop (it saves agency). If you don't bracket it, they will use it to dissolve the theory entirely within the first 20 minutes. Admitting you are skipping it validates their intuition while protecting the lesson's integrity.
