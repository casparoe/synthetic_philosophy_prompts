  # Project Proposal: Ambiguity at the Edge of Ruin
  **A Comparative Analysis of Risk-Weighting in Structurally Vague Catastrophic Domains**

  **Duration:** 3 Months
  **Format:** Workshop Research Project / Working Paper
  **Primary Investigator:** [Your Name/Group]

  ---

  ## 1. Research Question
  Standard Risk-Weighted Expected Utility (REU) theory provides a mechanism for agents to prioritize avoiding catastrophic outcomes by weighting probabilities or utilities according to a risk function. However, this framework presupposes a well-defined outcome space. This project addresses the following precise research question:

  *When an agent applies risk weights to avoid catastrophic outcomes, but the boundary of the catastrophic category is structurally ambiguous (the agent knows there exists a cluster of severely bad outcomes without being able to draw a sharp demarcation), which component should bear the risk weight: the probabilities of falling within the fuzzy region, the utility values assigned inside it, or the decision procedure's overall variance?*

  ## 2. Problem Statement and Literature Gap
  Existing treatments in decision theory, including Lara Buchak's REU framework and variations of Prospect Theory, generally presuppose a crisp outcome space $\Omega$ with a clear catastrophic threshold $t$. In these models, an outcome $o$ is either catastrophic ($u(o) < t$) or it is not. Risk-weighting is subsequently treated as either a probability transformation (distorting the likelihood of $o$) or a utility transformation (distorting the value of $o$), but not both simultaneously in the context of categorical uncertainty.

  Crucially, current literature does not address cases in which the *categorization* of outcomes is itself part of the uncertainty. In high-stakes domains like AI safety or biosecurity, "catastrophe" is often a vague predicate (e.g., "significant loss of life" or "irreversible ecological damage"). When the boundary is fuzzy, applying a risk function becomes mathematically and philosophically indeterminate. If we do not know exactly which outcomes constitute the "catastrophic cluster," we cannot determinately apply a risk weight to their probability or their utility. This project seeks to resolve where the normative force of risk-aversion should land when the object of that aversion is ill-defined.

  ## 3. Proposed Approach: A Comparative Triad
  We propose to formalize and compare three distinct responses to structural vagueness in catastrophic boundaries:

  1.  **Precisification (Sharpening by Stipulation):**
      *   *Mechanism:* The agent arbitrarily stipulates a sharp boundary $t^*$ within the fuzzy region to render the outcome space crisp. Conventional REU is then applied relative to $t^*$.
      *   *Risk Weight Location:* Applied to the **probabilities** of outcomes falling below $t^*$.
      *   *Philosophical Commitment:* Supervaluationism; rationality requires precise action even on vague predicates.

  2.  **Fuzzy REU (Graded Membership):**
      *   *Mechanism:* Outcomes are assigned a membership function $\mu(o) \in [0,1]$ representing their degree of "catastropheness." The risk function $r(\cdot)$ operates on the expected membership value rather than binary probability.
      *   *Risk Weight Location:* Applied to the **utility values**, modulated by the degree of membership in the catastrophic set.
      *   *Philosophical Commitment:* Degree-theoretic vagueness; risk attitude scales with the severity of categorical membership.

  3.  **Procedural Risk Penalty (Process-Based):**
      *   *Mechanism:* The risk weight is not applied to outcomes but to the decision rule itself. A penalty term is added to the utility function proportional to the variance of the outcome classification near the boundary.
      *   *Risk Weight Location:* Applied to the **decision procedure's overall variance** (meta-uncertainty).
      *   *Philosophical Commitment:* Procedural rationality; the risk lies in the instability of the classification mechanism, not just the outcomes.

  ## 4. Defense of Methodology
  **Why compare these three responses rather than simply lowering risk tolerance within Standard Expected Utility (SEU)?**

  A common objection is that one can model catastrophe avoidance in SEU simply by assigning extremely negative utilities to severe outcomes (lowering risk tolerance). We reject this strategy for two reasons:

  1.  **Structural Blindness:** SEU aggregates value linearly. It cannot distinguish between a high probability of moderate loss and a low probability of catastrophic loss if the expected values are identical. REU is specifically designed to capture the *structure* of risk distribution. When the definition of "catastrophe" is vague, the structural distribution is undefined. Simply lowering utility values in SEU ignores the meta-uncertainty regarding *which* outcomes deserve those values.
  2.  **The Categorization Problem:** In SEU, the utility function $u(o)$ is fixed. In our problem, the mapping from physical state to utility category is unstable. A comparative analysis of the three responses allows us to isolate whether the risk aversion should target the *likelihood* of the event (Approach 1), the *severity* of the event (Approach 2), or the *reliability of the judgment* (Approach 3). SEU lacks the granularity to make this distinction.

  ## 5. Deliverables
  1.  **Formal Framework:** A mathematical appendix defining the three models, specifying the risk functions $r(p)$, utility functions $u(o)$, and membership functions $\mu(o)$ where applicable.
  2.  **Concrete Case Study:** Application of the framework to **Autonomous System Deployment**.
      *   *Scenario:* An autonomous vehicle must decide between braking maneuvers where the classification of a pedestrian's trajectory (e.g., "stepping into road" vs. "standing near curb") is sensorially ambiguous.
      *   *Analysis:* Calculation of the recommended action under all three models to demonstrate divergent normative recommendations.
  3.  **Workshop Paper:** A 15–20 page manuscript suitable for presentation at a decision theory or AI ethics workshop.

  ## 6. Success and Failure Conditions
  *   **Success:** The project successfully demonstrates that the three approaches yield divergent action recommendations in the case study under plausible parameter settings, thereby proving that the location of the risk weight matters when boundaries are vague.
  *   **Failure:** The project fails if we demonstrate that **all three responses collapse into Standard Expected Utility under plausible rationality constraints.**
      *   *Specific Failure Mode:* If enforcing constraints such as Stochastic Dominance or Continuity forces the risk function $r(p)$ to become linear (identity) in Approaches 1 and 2, or forces the variance penalty to zero in Approach 3, then the distinction is theoretically moot. Proving this collapse is a negative result that invalidates the need for a new framework.

  ## 7. Feasibility and Timeline Assessment
  **Is the scope realistic for three months?**
  The scope is aggressive but manageable *if* the formalization is kept modular.

  *   **Month 1: Foundation and Approach 1.**
      *   *Task:* Literature review on REU and vagueness. Formalize the "Precisification" model.
      *   *Tractability:* High. This relies on existing REU math with a added stipulation step.
  *   **Month 2: Approaches 2 and 3.**
      *   *Task:* Formalize Fuzzy REU and Procedural Penalty.
      *   *Risk:* **High.** Formalizing "Graded Membership" (Approach 2) risks expanding into complex fuzzy-set theory mathematics which could consume the entire timeline.
      *   *Mitigation:* We will restrict the membership function to a simple linear slope over a defined interval rather than a complex distribution.
  *   **Month 3: Case Study and Synthesis.**
      *   *Task:* Run the Autonomous Vehicle simulation. Write the paper.
      *   *Risk:* The case study may reveal that the models are computationally incompatible.
      *   *Mitigation:* Use a simplified decision tree for the vehicle scenario rather than a full reinforcement learning environment.

  **Critical Bottleneck:** The comparison of Approach 2 (Fuzzy) and Approach 3 (Procedural) requires translating "variance in classification" into utility terms. If this translation proves formally intractable within 4 weeks, the project will default to comparing only Approach 1 and Approach 3, noting Approach 2 as future work.

