      *   *Nuance:* Acknowledge that Dennett *does* lean towards Universal Darwinism, but the postdoc's *inference* (therefore RL scale = Gregorian) is the weak link. Dennett acknowledges the tiers are distinct *achievements*, not just speedups.

  9.  **Final Review of the "Selection" Argument:**
      *   In neural networks, we select *weights*, not agents. In evolution, we select *agents*. This is the "Replicator" vs. "Vehicle" distinction. The postdoc conflates parameter optimization with natural selection. This is the strongest point of pushback.

  10. **Final Review of the "Blindness" Argument:**
