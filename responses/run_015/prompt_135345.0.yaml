      *(Self-Correction during drafting)*: Make sure to distinguish between Dennett's actual view and the Postdoc's interpretation. Dennett might agree they are *all* evolutionary algorithms, but he insists the *mechanisms* of the higher tiers (inner environment, memes) are distinct achievements that require specific scaffolding, not just "more search." The postdoc says "scaling fixed architecture" does it. That's the vulnerability. A fixed architecture (like a standard transformer or RL agent) doesn't automatically gain an "inner environment" just by scaling; it needs specific inductive biases for world modeling.

