      *   **Topic:** Measurability bias in EA and its impact on institutional resilience.
      *   **Priya's View:** Funders demand quantifiable outputs (bednets, lives saved) -> charities restructure around legibility, not usefulness. Toxic in longtermism (optimising for unread risk assessments). "Earning to give" worsens this (high-earners want clean metrics to justify donations -> performative measurement).
      *   **Tom's View:** Without measurability -> patronage networks, vanity projects. "Earning to give" is transparent about trade-offs (maximising resources, not pretending sainthood). Institutional capacity is hard to measure, so complaining about measurability bias is like complaining about gravity.
      *   **Interaction:** They must respond to each other, not just talk past one another. No ad hominem attacks (shill vs. Luddite).
      *   **Goal:** Reach a real conclusion or pinpoint the exact disagreement.
      *   **Tone:** Casual, actual conversation, maybe a typo or two, British spelling.

  2.  **Deconstruct the Arguments:**
      *   *Priya:* Goodhart's Law in action. Metrics become targets, losing value. Longtermism is especially vulnerable because the "impact" is so distant that proxies (reports, models) become the actual product. Earning to give creates a demand side for these clean metrics.
      *   *Tom:* The alternative is worse (nepotism, waste). Metrics are a necessary evil. Earning to give is honest. Capacity building is hard to measure but that doesn't mean we shouldn't try to measure *something*.
      *   *Potential Middle Ground:* It's not measurability *per se*, but *what* we choose to measure and the time horizon. Maybe trust-based philanthropy? Maybe acknowledging uncertainty explicitly?

  3.  **Drafting - Section by Section:**

      *   *Setting the Scene:* Casual setting, maybe a cafe or after an event. Let's go with a cafe in London (British spelling hint).
