      *(Self-Correction during drafting)*: Make sure Tom doesn't sound like a caricature of a utilitarian. He should acknowledge the messiness but defend the necessity. Priya shouldn't sound anti-data, just anti-perverse-incentive.

      *Let's try to find the specific disagreement:* Is it that Priya thinks the bias is *structural* and needs a paradigm shift, while Tom thinks it's a *technical* problem to be solved with better metrics? Or is it about the value of transparency vs. resilience?
      Actually, Tom's point about "gravity" is strong. Priya needs to counter that gravity doesn't change the *shape* of the building, but bad metrics do.
      Let's have them agree that "proxy measurement" is the enemy, not measurement itself.

  7.  **Final Polish:** Check spelling conventions (s vs z in organisation/optimise - Oxford spelling is standard British, so 's' is safer for "casual British", though 'z' is also Oxford. I'll stick to 's' for organisaton/optimise to be clearly British). Check for typos.

