answer: |-
  Good evening, everyone. For those who don't know me, I am the fortunate result of the forty years we are here to celebrate. Mum, Dad, looking at you both, the word that comes to mind is not just 'love', but 'endurance'. Rubies are hard stones; they are formed under pressure, and they last.

  We are a family that feels deeply. When we lost my aunt, the pain fractured us, and that fracture has run through this room for a decade. We all want justice for her. We all want peace for ourselves. But we have learned, painfully, that we seek that peace in different ways.

  Some of us believe peace comes from clarity—from seeing every document and every fact until the picture is complete. Others believe peace comes from solidarity—from knowing that the people in this room will stand together regardless of what the papers say. We have learned that offering evidence to those who need loyalty confirms their fear of abandonment. And demanding loyalty from those who need evidence confirms their fear of deception. Neither approach works on the other; indeed, each makes the wound deeper.

  I am not standing here to solve that puzzle. Tonight is not for settling accounts; it is for honouring the bond that survives them. My parents have not stayed together because they agreed on every fact of their lives, or even every fact of their past. They have stayed together because they decided that their commitment to each other was more durable than their need to be right. They modelled a way of being together where love does not require uniformity of thought, only integrity of heart.

  So, I ask you tonight to lay down the burden of converting one another. You do not need to agree to honour what Mum and Dad have built. You only need to sit at this table, share this meal, and acknowledge that we are still here, together, despite the things that pull us apart.

  To Mum and Dad. May your next forty years be defined not by the questions you have answered, but by the love that kept you asking them together. Cheers.

  ***

  The move relied upon is **meta-epistemic framing**, where I validate the psychological needs driving each group's methodology (trust vs. evidence) without validating the truth-claims of either side. By demonstrating that each group's preferred remedy actively harms the other's core need, I justify suspending the debate without declaring the truth unknowable.
