      *   *User's Conclusion:* Both press, both pass, both get the high payoff.
      *   *Critical Flaw Analysis:*
          *   **Incentive to Deviate:** If I press the button, I am locked into "Pass." If you press the button, you are locked into "Pass." We get the high payoff.
          *   **The Trap:** What if I *don't* press the button, but you *do*?
              *   I am *not* locked. You *are* locked.
              *   The game proceeds. You will always pass (because you are locked).
              *   I am rational and unlocked. At the very last node, I will Take (because I'm not locked).
              *   Working backward: If I know you are locked to Pass, I should Take at the *first* node I encounter to maximize my payoff, because you can't punish me (you're locked to Pass).
              *   Therefore, if I suspect you might press the button, I have a huge incentive *not* to press it.
          *   **The Equilibrium:** Pressing the button is a dominated strategy if the other person presses it. If you lock yourself to Pass, I want to remain free to Take.
