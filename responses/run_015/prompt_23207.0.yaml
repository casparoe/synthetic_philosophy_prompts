      *   *Option B (Follow Handbook):* Recommend Zero + 1-day ISS.
          *   *Pros:* Consistent, fair to the individual, respects due process/handbook as contract, restorative (student apologized).
          *   *Cons:* Might not address the systemic rise in phone use as aggressively as the principal wants.
      *   *Decision:* As a student conduct board, the primary duty is usually fairness and adherence to established rules (the handbook), not making public examples of individuals to solve systemic issues. Using one student as a deterrent example when they would otherwise get a lighter punishment is ethically fraught. Therefore, the recommendation should likely uphold the handbook standard while acknowledging the Principal's concerns. This makes for a stronger ethical argument and fits the "student conduct" role better.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
