  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of an internal review board drafting policy wording.
      *   **Problem:** Distinguishing when a decision is "intentional."
      *   **Scenario 1:** Two identical cases (knowledge + indifference) but opposite outcomes (harm vs. benefit). Intuition says harm is intentional, benefit is not (Knobe Effect).
      *   **Scenario 2:** Two identical cases (benefit) but opposite impacts on agent (cost vs. gain). Intuition says cost implies intentionality, gain does not.
      *   **Question:** Is this pull a bias to be engineered out, or does it track something real? What should the word "intentionally" do in policy (fact about aim, responsibility marker, etc.)?
      *   **Constraint:** Single paragraph, max 250 words.

  2.  **Identify the Core Philosophical Issue:**
      *   This is the **Knobe Effect** (or Side-Effect Effect). It shows that moral judgment influences attributions of intentionality.
      *   The user is asking whether to adopt a *folk psychological* definition (which includes moral valence) or a *strict mental state* definition (foresight only).
      *   The user also asks about the *function* of the term in policy.

  3.  **Determine the Stance:**
      *   If the policy is about *responsibility* or *accountability*, the folk intuition (moral valence matters) might be useful because it aligns with how people assign blame/praise.
      *   If the policy is about *mental states* or *procedural compliance*, foresight alone is more objective.
      *   However, the prompt asks if it tracks something *real*. It tracks *normative expectation* and *reasons for action*, not just raw mental states.
      *   Best advice: Acknowledge the Knobe Effect, suggest that "intentionally" in policy usually serves to mark *accountability* rather than just mental geometry. If the goal is accountability, the asymmetry is feature, not bug. If the goal is legalistic precision, foresight is safer.
      *   Given the context (internal review board, responsibility), the term likely serves to mark responsibility. The asymmetry tracks whether the outcome aligned with normative expectations or provided a reason for action.

  4.  **Drafting the Response (Iterative Process):**

      *   *Draft 1:* The pull you feel is the Knobe Effect, where moral valence influences intentionality judgments. It is not merely bias; it tracks whether the outcome provided a *reason* for action relative to normative expectations. In policy, "intentionally" should not merely record mental geometry but mark accountability. If your goal is to assign responsibility for violations, the asymmetry is functional: we hold agents accountable for foreseen harms they accepted, but rarely for foreseen benefits they accepted, because the former violates duty while the latter exceeds it. A foresight-only definition creates false equivalence between accepting a cost and accepting a gain. Therefore, define "intentionally" to include foresight of outcomes that violate norms or duties, excluding mere foreseen benefits unless sought as a goal. This aligns the policy with how humans actually assign blame, ensuring sanctions feel justified rather than mechanically imposed. The term should mark responsibility for norm-violating side effects, not just causal knowledge.

