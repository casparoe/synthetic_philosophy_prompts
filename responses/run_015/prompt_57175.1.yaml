answer: |-
  **Case A: The Capped Monetary Loan**
  A community stewardship fund lends $50,000 to a local bakery for a new oven, charging 4% annual interest payable in currency. The lender is a private individual whose total capital holdings are fixed by a self-imposed ceiling sufficient for his household's modest needs; any surplus interest income beyond this maintenance threshold is immediately disbursed to town improvements or forgone, never reinvested to grow the principal. The loan's explicit *telos* is the preservation of the bakery's operation within the local economy, ensuring the baker's self-sufficiency, rather than the expansion of the lender's portfolio.

  **Case B: The Uncapped In-Kind Loan**
  A development investor lends the same $50,000 to the same bakery for the same oven, charging 0% monetary interest but claiming a 4% equity share of the bakery's weekly bread output. The lender takes possession of the crates, sells them on the open market for cash, and immediately reinvests the entire proceeds into new loans to other businesses with the explicit aim of compounding the fund's total value indefinitely. The loan's *telos* is the endless accumulation of capital, despite the return technically arriving as goods rather than currency.

  ***

  **The Machinery of Criteria**

  Apply the **proper use of money** test first. Case A fails decisively: money is employed to generate more money (*tokos*), which Aristotle calls unnatural because money was invented for exchange, not reproduction. Case B squeaks past the letter of this test: the return is technically in kind (bread), so money is not literally breeding money; the transaction mimics a trade of capital for goods. Next, apply the **limit/end test**. Case A passes: the lender's activity is subordinate to the needs of the household and polity, stopping at sufficiency. Case B fails catastrophically: the reinvestment strategy aims at infinite accumulation, the defining mark of unnatural wealth-getting (*chrematistike*). Finally, the **two-uses distinction**. In Case A, the shoe (money) is used for exchange, but the exchange is distorted to serve generation. In Case B, the shoe (bread) is used for exchange, but only as a transient vessel to return to money for further generation.

  **Where They Come Apart**
  Your guess is largely correct but requires sharpening. Case A passes the Limit test but fails the Proper-Use test. Case B fails the Limit test but arguably passes the Proper-Use test *formally*, though it fails it *functionally*. The real fault line is not between the tests themselves, but between **form** (the mechanism of return) and **teleology** (the purpose of the activity). Aristotle's text suggests the teleological error (endless accumulation) is the root sin, while usury is its most conspicuous symptom. Case B reveals that one can avoid the symptom while retaining the disease.

  **Primacy of Criteria**
  For Aristotle to reach a determinate verdict, the **Limit/End test must be primary**. There is textual license for this: in *Politics* I.9, he distinguishes natural from unnatural wealth-getting based on whether it has a limit (*peras*), not solely on the instrument used. Usury is condemned as the *most hated* form of wealth-getting, implying other forms exist and are also unnatural if they lack a limit. If the Proper-Use test were primary, Case A would be condemned absolutely regardless of its benevolent end, rendering the distinction between household management and commerce moot. The hierarchy of arts dictates that the end (the good life) governs the means (money); thus, a capped use of money remains subordinate to politics, whereas uncapped accumulation usurps politics.

  **The Removal Test**
  Drop Case A's cap (allow unlimited reinvestment of interest): The verdict flips from mixed to wholly negative; it now fails both tests. Convert Case B's return into money (charge interest but keep the uncapped goal): The verdict remains wholly negative; it fails both tests. This confirms that the **Limit condition is the necessary condition** for moral permission, while the **Proper-Use condition is a sufficient indicator** of violation. The single feature doing the work in Case A is the **cap** (which saves it); the single feature doing the work in Case B is the **reinvestment loop** (which condemns it).

  **Form vs. Substance**
  The strongest Aristotelian reply to the charge that the interest test tracks only *form* is that form *constitutes* substance in economic acts. Money breeding money is not merely a symbolic error; it is the mechanical enablement of endlessness. When return is detached from the natural growth of a thing (like crops or livestock) and attached to a convention (money), the natural limit imposed by biological or household need is removed. Aristotle is not fetishizing the coin; he is identifying the mechanism that allows desire to detach from need.

  **Extrapolation and Consensus**
  Be aware where you are straining the text. Aristotle never discusses institutional lenders, equity-style in-kind returns on capital loans, or cost-recovery funds; applying his household-based ethics to a credit market is an extrapolation. Regarding the scholarship: it is **not settled consensus** that the usury passage is solely about boundless accumulation. While prominent political theorists (e.g., Arendt, Meikle) argue the critique is teleological (about the *end* of accumulation), traditional economic historians often maintain the prohibition is primarily deontological (about the *act* of interest itself). You are entering a live debate, not citing a footnote. Use the collision in these cases to show that both readings have traction, but the teleological reading better explains why Case B is arguably worse than Case A.
