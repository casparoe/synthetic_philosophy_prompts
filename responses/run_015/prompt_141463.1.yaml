  3.  **Formulate the Argument (The "Machinery"):**
      *   *Premise 1: Two Models of Autonomy.*
          *   Model A: **Formal Liberty.** Autonomy = absence of coercion. As long as you *can* say no, you are free. (This supports the Pension/Appointment view).
          *   Model B: **Substantive Agency.** Autonomy = alignment with authentic values/interests. Interference is bad if it bypasses reflection on high-stakes/identity-defining choices. (This supports the Clinical Trial view).
      *   *Premise 2: The "Grip" Threshold.*
