          *   Clinical Trial: Error cost is high (bodily risk, unknown side effects), benefit is uncertain (to the participant). Default cannot presume interest.
          *   Appointment: Error cost is moderate (inconvenience), benefit is high (health maintenance).
      *   *Premise 4: The Disclosure Drop.*
          *   Does explaining the default prove it was a trick? No. It proves *friction* matters.
          *   The drop indicates that some people were on the margin. The "trick" accusation assumes intent to deceive. The "nudge" defense assumes intent to assist. The evidence (uptake drop) is neutral on intent but positive on *salience*.

