          *   *Case C (Clinic Appointments):* Pre-filled dates (default). High uptake. Viewed as administrative efficiency/good care.
          *   *The Tension:* Why is "making the lazy path lead to the institutional goal" acceptable in pensions/appointments but suspect in clinical trials (especially regarding payment)?
      *   **The Specific Question:** What has to be true about autonomy/consent for both to be right? What does the practice *actually* need vs. the story told? Is there a "grip" metric (default effect size) that could regulate this? What does the drop in uptake after explicit disclosure prove?
      *   **Desired Output:** "The machinery, not the jargon." Analytical, precise, acknowledging the scientific background. Avoid vague philosophizing; focus on structural commitments and underdetermination.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The "Grip" Metric:** The user proposes measuring the difference between the default outcome and the "attentive choice" outcome. This is essentially measuring the *nudge effect size*.
      *   **The Moral Weight:** The user suspects the moral weight lies in the counterfactual ("what they *would* choose if attentive") rather than the formal freedom ("they *could* opt out").
      *   **The Discrepancy:** Why is high grip okay for pensions/appointments but low grip (via rigorous consent) required for trials?
