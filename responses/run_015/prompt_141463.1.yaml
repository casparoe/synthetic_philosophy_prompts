answer: |-
  This is an excellent observation. You have identified a genuine inconsistency in applied ethics, not just a confusion on your part. The "machinery" underneath these practices relies on two different definitions of autonomy that are rarely stated explicitly because they contradict each other if examined side-by-side.

  Here is the breakdown of the mechanism, the underdetermination, and what your "grip" metric would actually do if enforced.

  ### 1. The Two Models of Autonomy
  For your pension committee and the clinical trial board to both be "right," they must be operating on two different definitions of what consent is *for*.

  **Model A: Autonomy as Non-Interference (The Pension/Appointment Model)**
  *   **The Mechanism:** Autonomy is preserved if no option is removed and no penalty is applied for choosing the alternative.
  *   **The Assumption:** The *process* of choosing matters less than the *freedom* to choose. If the path of least resistance leads to Outcome X, but you can climb the hill to get Outcome Y, you are free.
  *   **The Justification:** This model assumes that for low-stakes or high-benefit/low-risk decisions (saving money, seeing a doctor), the institution is permitted to optimize for the "statistical average" welfare of the group. It treats inertia as a resource to be harvested for the subject's own good (libertarian paternalism).

  **Model B: Autonomy as Authentic Authorization (The Clinical Trial Model)**
  *   **The Mechanism:** Autonomy is preserved only if the decision reflects the subject's actual values and understanding at the moment of commitment.
  *   **The Assumption:** The *process* of choosing is the moral point. If you end up in the study because you didn't read the form, or because you needed the £50, your autonomy is violated even if you signed voluntarily.
  *   **The Justification:** This model assumes that for high-stakes or high-risk/uncertain-benefit decisions (bodily intrusion, experimental drugs), the institution cannot presume to know your interest. The "statistical average" welfare is irrelevant; only *your* specific authorization counts.

  **The Contradiction:** Model A says, "We can use your inertia to help you." Model B says, "We must ensure your inertia does not decide for you." You cannot hold both as universal principles. The hospital holds them contextually.

  ### 2. What the "Grip" Metric Exposes
  Your proposed metric—*Grip = (Default Uptake) − (Attentive Uptake)*—is essentially a measure of **how much work inertia is doing.**

  If an institution had to publish this number and cap it, they would be committing to **Model B** (Authentic Authorization) across the board. Here is why:

  1.  **It admits that "Opt-Out" is not neutral.** If Grip is high, it means the majority of people are not choosing the default; they are *ignoring* the choice. If you cap Grip, you are admitting that a choice made via ignorance or busyness has less moral weight than a choice made via attention.
  2.  **It collapses the "Freedom to Say No" defense.** As you suspected, the "you could have filled in the form" defense only works if we pretend the effort cost of filling in the form is zero. The Grip metric measures that effort cost in terms of lost agency. If Grip is the test, the defense fails.
  3.  **It forces a justification of Paternalism.** If you allow a high Grip on pensions but not trials, you must justify *why* it is okay to let inertia decide in one case but not the other. The only available justification is **Asymmetry of Error**.
      *   *Pension Error:* You stay in the scheme when you might have opted out. Result: You have more savings than you planned. (Reversible, generally beneficial).
      *   *Trial Error:* You stay in the trial when you might have opted out. Result: You suffer side effects or bodily intrusion you didn't truly want. (Harder to reverse, potentially harmful).

  **Conclusion on the Metric:** If Grip were the regulatory test, the pension default would likely fail unless the institution could prove that the default aligns with the "counterfactual will" (what you *would* have chosen if attentive). This shifts the burden of proof from the individual (to opt out) to the institution (to prove the default is what you'd want).

  ### 3. The Disclosure Data: Trick or Salience?
  Regarding your committee's data: when you made the default explicit, uptake fell. Your colleagues call this proof of a "trick."

  **The Scientific Interpretation:**
  This does not prove malice (trickery); it proves **Salience.**
  *   **Condition 1 (Implicit Default):** The default is part of the background noise. Cognitive load is low. Inertia dominates.
  *   **Condition 2 (Explicit Default):** The default is highlighted. Cognitive load increases. The "friction" of the decision is raised.

  **What this tells us about Consent:**
  The drop in uptake shows that a significant portion of the "consent" in Condition 1 was **procedural**, not **substantive**. People weren't agreeing to the pension; they were agreeing to *not deal with the letter*.
  *   If the goal was *maximizing savings*, Condition 1 was better.
  *   If the goal was *maximizing autonomous choice*, Condition 2 was better.

  Your colleagues' claim that it was a "trick" assumes the intent was deception. The data only shows the mechanism relied on low salience. However, if the institution *knew* that explaining the default would reduce uptake, and *chose* not to explain it to maintain uptake, they are prioritizing the *outcome* (savings) over the *process* (awareness). That is the definition of paternalism. It isn't necessarily a "trick," but it is a deliberate bypassing of reflection.

  ### 4. Why the Payment Issue in Clinical Trials?
  You noted the hospital was uneasy about paying participants, even though they use defaults elsewhere. This seems inconsistent until you look at the **vector of influence**.

  *   **Defaults** work on **Inertia**. They keep you where you are. They are conservative.
  *   **Payments** work on **Inducement**. They move you to where you weren't. They are active.

  In the clinical trial context, the fear is **Undue Influence**. If the payment is high enough, it might cause a person to overlook risks they would otherwise reject. This is the same worry as the "Grip" worry: is the decision reflecting their true assessment of risk, or is it reflecting an external pressure (money vs. laziness)?
  The hospital accepts "laziness" (defaults on appointments) as a valid reason to make a decision because the risk is low. They reject "need for money" as a valid reason to make a decision because the risk is high. They are consistent *if* you accept that autonomy protection scales with risk.

  ### 5. Summary: What would have to change?
  If you imposed your "Grip" rule (publish the number, cap the influence):

  1.  **Pension Schemes:** Would have to reduce the "friction" of opting out to match the friction of opting in. Or, they would have to prove that the default matches the revealed preference of the majority. If the Grip is >20%, they might be forced to switch to Opt-In.
  2.  **Clinic Appointments:** Would likely remain unchanged because the "Grip" is justified by the medical necessity of attendance (high benefit, low risk).
  3.  **Clinical Trials:** Would remain unchanged (low Grip required) because the stakes demand Model B autonomy.
  4.  **The "Story":** The institution could no longer say "nobody was forced." They would have to say "we influenced you because we believe the default is good for you, and we have measured that this influence overrides your inattentive preference."

  **The Verdict:**
  Your intuition is correct. The "you can always opt out" defense is leaning on the counterfactual ("you *would* have stayed in anyway") without testing it. The drop in uptake when you made it explicit proves that the counterfactual was false for a significant minority.

  The practice presupposes that **Autonomy is a variable resource, not a binary switch.** We spend less of it on pensions and appointments (trusting the institution's default) and conserve it for clinical trials (where the institution cannot be trusted with our bodies). The "scandal" in the trial payment is that money compromises the *quality* of the consent; the "success" in the pension default is that inertia compromises the *effort* of the consent. The machinery holds together only so long as we don't ask whether effort and quality are the same thing.
