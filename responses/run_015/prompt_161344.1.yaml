answer: |-
  Here is the mapping, the diagnosis of the failure mode, and the verdict on what this implies for Inverse Reinforcement Learning (IRL) as a framework.

  ### 1. The Mapping

  To treat this as an IRL problem, we have to define who is learning what from whom.

  *   **The Learner (Observer):** The Boeing design and certification team (effectively treating the MCAS logic and the certification basis as the "policy" being learned).
  *   **The Demonstrator (Agent):** The Boeing test pilots during certification flights and simulation trials.
  *   **The Trajectories (Behavior):** Successful recoveries from high-angle-of-attack events during testing. Specifically: the time-to-react, the control inputs used, and the verbal confirmation that the situation was understood.
  *   **The Preference (Reward) Supposedly Recovered:** This is the critical slip. Boeing was not trying to recover the pilot's *goal* (stay alive). They were trying to recover the **system's safety margin**. They observed the pilots' behavior to infer a constraint: *"The maximum allowable deviation from NG handling qualities such that a human pilot can still safely recover without specific training."*
  *   **The Actual Demonstrators:** Highly skilled, briefed, expecting the stall, flying in clean air, without the startle effect, without the cognitive load of managing passengers or ATC, and crucially, *aware that the test was about stall recovery*.

  ### 2. The Failure Mode

  You have three candidates. The one doing the heavy lifting is **Candidate 3 (Selection Bias / "Demo-filmed-for")**, but it manifests as a specific theoretical violation known as **Hidden State / Belief Mismatch**.

  Here is why the other two are secondary:
  *   *Reward Underdetermination:* Yes, a fast recovery could mean "easy task" or "expert pilot." But Boeing didn't just guess; they had data. The data was just bad.
  *   *Environment Shift:* Yes, test conditions differed from real world. But IRL systems often deal with sim-to-real transfer. The crash wasn't just that the physics were different; it was that the *human* was different.

  The core failure is that standard IRL assumes the demonstrator is acting on the **same information state** as the deployee.
  In IRL terms, the algorithm observes actions $A$ to infer Reward $R$. But $A$ is actually a function of $R$, **Belief State $B$**, and **Capability $C$**.
  $$A = \text{Policy}(R, B, C)$$

  Boeing observed $A$ (successful recovery) from Test Pilots ($B_{high}, C_{high}$).
  They assumed Line Pilots possessed ($B_{high}, C_{high}$).
  In reality, Line Pilots had ($B_{low}, C_{variable}$).

  The "Demo-filmed-for" problem is the colloquial name for **sampling bias in the demonstrator's belief state.** The test pilots knew *what* was happening (a stall test). The line pilots did not (a sensor failure causing runaway trim). Because the Learner (Boeing) did not model the Demonstrator's *belief* as a variable, they inferred a Reward function (safety margin) that was valid only for the specific belief state of the test pilots.

  ### 3. The Knot: Want vs. Belief vs. Capability

  You are correct: **You cannot untangle Want, Belief, and Capability from behavior alone without strong priors.**

  In formal IRL, this is the **Identifiability Problem**. Infinite reward functions can explain the same behavior. To solve it, IRL usually assumes the agent is *rational* (optimizing the reward perfectly) and has *perfect information* (knows the state).

  The MAX case proves that when those assumptions break, the inference inverts catastrophically.
  *   **What was inferred:** Boeing inferred **Capability** ("Pilots can react in 4 seconds") but treated it as a **System Constraint** ("The plane is safe if it moves this fast").
  *   **The Error:** They conflated *Competence* (what the demonstrator *could* do) with *Robustness* (what the reward function *required*).

  Could IRL have got this right from that sample? **No.** Not standard IRL.
  Standard IRL assumes the demonstrator is trying to solve the same problem you are. If you feed an IRL algorithm footage of a stunt driver navigating a curve, and ask it to learn the "reward function for safe commuting," it will learn a reward function that values high lateral G-forces and risk. It cannot know the driver is a stuntman unless you encode "Driver Skill Level" as an input variable. Boeing did not encode "Pilot Situational Awareness" as a variable in their safety model.

  ### 4. What This Says About IRL

  This episode is not a quirk of aviation; it is a sign that **IRL is missing a Theory of Mind.**

  Current IRL frameworks largely treat the demonstrator as a black box optimizer. They do not explicitly model *what the demonstrator knows*. If you want to infer preferences from humans, you cannot just watch what they do. You have to model:
  1.  **What they know** (Information State).
  2.  **What they can do** (Action Constraints).
  3.  **What they think they are optimizing** (Proxy Rewards).

  The MAX crashes demonstrate that **behavior is a poor signal for safety margins when the actor's risk model is unobserved.** The test pilots behaved safely *because* they knew the risk. The algorithm (Boeing) saw the safe behavior and inferred *low risk*. This is the exact inverse of reality.

  This suggests IRL needs to move toward **Inverse Reward Design** or **POMDP-based IRL** (Partially Observable Markov Decision Processes), where the learner explicitly accounts for the possibility that the demonstrator is acting on incomplete or different information. If the theory doesn't account for the demonstrator's ignorance, it will interpret ignorance as confidence.

  ### 5. The "No Algorithm" Objection

  You asked what you lose by using a case where nobody was running `irl.py`.

  You lose **formal guarantees**, but you gain **epistemic clarity**.

  When an algorithm fails, we blame the loss function or the learning rate. When humans fail, we are forced to look at the *assumptions*.
  *   **The Benefit:** Using the MAX case strips away the math and exposes the logical skeleton. It shows that the failure wasn't computational; it was philosophical. It validates the theoretical concern that **observation $\neq$ understanding.**
  *   **The Loss:** In a code-based IRL failure, you can retrain. In the MAX case, the "training" was certification, and the cost of iteration was 346 lives.

  However, using this case highlights a blind spot in current IRL research: **The assumption that the demonstrator is cooperative.**
  Most IRL assumes the human is trying to show the robot what to do (Cooperative Inverse Reinforcement Learning). In the MAX case, the "demonstrators" (test pilots) were cooperative with Boeing, but the "deployees" (line pilots) were not part of the loop. The system learned from a subset of humans to control a system that would interact with a different subset of humans.

  **Verdict:** The MAX case is a perfect stress test for IRL. It shows that inferring preferences from behavior is impossible if you treat "human capability" and "human knowledge" as constants. If IRL is to work in high-stakes environments, it must stop treating humans as consistent optimizers and start treating them as variable, partially-informed agents. The theory goes quiet where the **prior on human knowledge** should be. Boeing assumed that prior was uniform; the crashes proved it was bimodal. IRL cannot fix that without being told to look for the bimodality.
