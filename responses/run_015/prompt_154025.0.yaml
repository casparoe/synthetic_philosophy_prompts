      *   **Core Problem:** Existing camps (bias vs. preference) assume the distinction they are arguing about, especially when subjects revise views after learning about structural advantages (higher-order information).
      *   **Research Question:** Can we build a non-circular criterion for classifying desert judgments as preference-driven vs. bias-driven based on *revision patterns* after receiving higher-order information?
      *   **Methodology:** Conceptual analysis/theoretical modeling (no empirical lab work). Map three frameworks (Rationalist Preference, Social-Learning Bias, Hybrid) onto revision patterns to see if they remain extensionally distinct.
      *   **Deliverables:** Precise research question, critique of existing positions, methodology, criteria for success/failure, feasibility check (one semester).
      *   **Specific Constraints:** No bibliography/citations. Include an honest note on what would make me abandon the distinction. Flag the weakest point in reasoning (likely around revision-tracking).
      *   **Tone:** Professional, academic, but acknowledging the "half-baked" nature needs polishing into "sounds like I know what I'm doing."

  2.  **Deconstruct the Philosophical Core:**
      *   *The Tension:* When someone says "He deserves punishment," is that a stable moral preference (retributivism) or a cognitive bias (fundamental attribution error)?
      *   *The Twist:* People change their minds when told about systemic issues. Does that change prove the original was a bias? Or does it prove the preference was conditional?
      *   *The Circularity:* Calling it a "bias" often just means "a judgment I think is wrong." Calling it a "preference" means "a judgment I think is right." We need a structural criterion, not a normative one.
      *   *The Mechanism:* Higher-order information (HOI). E.g., "You judged him harshly. Did you know he grew up in a high-crime zone due to policy X?" How does the subject update?
      *   *The Models:*
          1.  *Rationalist Preference:* Updates are Bayesian/reflective. The core value (proportionality) remains stable; inputs change.
          2.  *Social-Learning Bias:* Updates are defensive or conformist. The judgment shifts due to social pressure or cognitive dissonance reduction, not moral reasoning.
          3.  *Hybrid:* Some mix.
      *   *The Test:* Do these models predict *different* revision patterns? If they all predict the same shift (e.g., "leniency increases"), the distinction is useless.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound punchy but academic. "Desert, Bias, and Revision."
