answer: |-
  **Project Title:** Beyond the Circularity of Bias: A Structural Analysis of Revision Patterns in Moral Desert Judgments

  **Abstract**
  Contemporary debates regarding moral desert often stall on a definitional impasse: judgments of punishment and reward are dismissed as "bias" by one camp and defended as "rational preference" by another, yet both sides rely on the very distinction they seek to prove. This circularity becomes most apparent when subjects revise their desert judgments after receiving higher-order information (HOI) regarding structural advantages. This project proposes a theoretical mapping of three dominant frameworks (Rationalist Preference, Social-Learning Bias, and Hybrid Models) onto specific revision patterns. The goal is to determine if a non-circular, structural criterion exists to distinguish preference-driven judgments from bias-driven ones based solely on how agents update their views when the etiology of their intuition is revealed.

  **1. Problem Statement: The Circularity of Dismissal**
  In moral psychology and normative ethics, the distinction between a "genuine moral preference" (e.g., a commitment to proportionality) and a "cognitive bias" (e.g., fundamental attribution error) is typically drawn normatively. A judgment is labeled a bias if it conflicts with the theorist's preferred moral ontology. This creates a methodological blind spot. When a subject reduces a punishment judgment after learning about a defendant's structural disadvantages, the "bias camp" claims this proves the original judgment was contaminated by ignorance. The "preference camp" claims this proves the original judgment was a rational response to available data, now updated.

  Both positions assume the distinction they are arguing about. They treat the *outcome* of the revision (leniency) as evidence of the *nature* of the original judgment. This project argues that without a formal criterion for how preferences and biases *ought* to respond to higher-order information about their own origins, the distinction is useless for moral theory.

  **2. Existing Frameworks and Their Limitations**
  This project will analyze three theoretical models currently implicit in the literature:

  *   **The Rationalist Preference Model:** Assumes desert judgments are derived from stable core principles (e.g., "harm merits censure"). Revision is viewed as Bayesian updating. The core principle remains invariant; only the input data changes.
  *   **The Social-Learning Bias Model:** Assumes desert judgments are heuristics absorbed from cultural environments. Revision is viewed as a response to social signaling or cognitive dissonance reduction. The shift in judgment is driven by the desire to align with new normative cues, not logical consistency.
  *   **The Hybrid Model:** Assumes a interaction where some desert intuitions are principled and others are heuristic.

  *Limitation:* Currently, these models are not extensionally distinct. They all predict that a subject will likely reduce punishment severity when presented with structural exculpatory evidence. Because they predict the same behavioral output (revision), they cannot be used to classify the *type* of judgment being made.

  **3. Research Question**
  Can we construct a non-circular criterion for classifying desert judgments as preference-driven versus bias-driven by isolating specific *revision rules* triggered by higher-order information?

  Specifically: Does the *manner* in which a subject revises a judgment (e.g., consistency across cases, stability over time, sensitivity to the source of the HOI) allow us to distinguish between a Rationalist update and a Bias correction without smuggling in normative assumptions about free will or moral truth?

  **4. Methodology: Conceptual Mapping and Extensional Testing**
  As this is a theoretical stipend, no empirical data collection will be performed. Instead, the project will utilize a conceptual modeling approach:

  1.  **Formalization:** Define the three frameworks (Rationalist, Bias, Hybrid) as distinct updating rules.
      *   *Example:* A Rationalist update should preserve transitivity across similar cases. A Bias update might show asymmetry depending on the social cost of holding the original view.
  2.  **Scenario Stress-Testing:** Construct a series of thought experiments involving HOI (e.g., "You judged X harshly. You are now told your judgment correlates with Group Y's norms.").
  3.  **Extensional Analysis:** Map the predicted revision patterns for each framework against these scenarios.
  4.  **Collapse Check:** Determine if the predictions diverge. If all three frameworks predict identical revision behaviors in all plausible scenarios, the distinction is declared extensionally collapsed.

  **5. Criteria for Success and Failure**
  *   **Success:** The derivation of a **Two-Condition Framework** for identifying bias.
      *   *Condition 1 (Stability):* Preference-driven judgments maintain structural consistency across structurally identical cases even when social cues vary.
      *   *Condition 2 (Etiological Sensitivity):* Bias-driven judgments show disproportionate revision when the *source* of the intuition is challenged, compared to when the *facts of the case* are challenged.
  *   **Failure:**
      *   **Extensional Collapse:** If the Rationalist and Bias models predict the same revision patterns in all tested scenarios, the distinction is merely semantic.
      *   **Metaphysical Smuggling:** If distinguishing the two requires assuming a specific stance on compatibilism or free will (e.g., assuming structural causes negate responsibility), the criterion fails to be neutral.

  **6. Feasibility and Timeline (3 Months, Part-Time)**
  *   **Month 1:** Formalize the updating rules for the three frameworks. Literature scan to ensure no existing formalization matches the proposed criteria.
  *   **Month 2:** Develop the scenario matrix and run the extensional analysis. Identify points of divergence or collapse.
  *   **Month 3:** Draft the Two-Condition Framework (if successful) or the Negative Result paper (if collapsed). Finalize proposal for publication or further grant application.

  *Assessment:* This is feasible for a single semester. The scope is limited to conceptual analysis, avoiding IRB hurdles or recruitment delays. The risk lies entirely in the logical robustness of the models.

  **7. Critical Self-Assessment**

  **The "Abandon" Condition**
  I will abandon the distinction if the extensional analysis reveals that **revision magnitude is underdetermined by the judgment type.** If a "true preference" and a "deep bias" both react identically to HOI (e.g., both reduce punishment by 50% upon learning of structural disadvantage), then the revision pattern cannot serve as a diagnostic tool. If the only way to tell them apart is to ask the subject "Was that a bias?" or to assert a metaphysical claim about whether the structural disadvantage *actually* negates desert, then the project fails to solve the circularity problem.

  **The Weakest Link: Revision-Tracking Interpretation**
  The most vulnerable point in this reasoning is the **interpretation of the revision mechanism.** In a purely theoretical model, I can stipulate that Rationalists update via logic and Biased agents update via social pressure. However, in reality (and even in rigorous thought experiments), these mechanisms look identical from the outside. A subject might revise their judgment because they logically accept the structural argument (Rationalist), or because they feel shame about appearing prejudiced (Bias).
  My model risks assuming I can distinguish these motivations theoretically without access to the subject's phenomenology. If I cannot theoretically distinguish "logical acceptance" from "social compliance" without begging the question, the entire mapping exercise collapses. I need to ensure the "Two-Condition Framework" relies on *observable logical commitments* (e.g., consistency across other cases) rather than assumed internal motivations.
