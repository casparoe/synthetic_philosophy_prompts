answer: |-
  Your friend's economic model is a useful heuristic for political deal-making but fails as a complete moral theory because it conflates negotiable preferences with non-negotiable principles.

  Here is the breakdown of where his model holds up and where it breaks, using terms that should feel familiar to your background.

  **1. Values vs. Preferences (The Conflation)**
  Your friend is operating under a specific philosophical framework (often called instrumentalism or consequentialism) that treats all values as inputs in a utility function. In this view, "justice" is just a variable you weight against "efficiency." However, many philosophers distinguish between **preferences** (what I want, like chocolate over vanilla) and **principles** (what I believe is right, like "do not torture").
  *   **The Dev Analogy:** Preferences are like configuration settings; you can tweak them to optimize performance. Principles are like security protocols or schema constraints; violating them isn't a "trade-off," it's a system failure. If you believe abortion is murder, agreeing to "fewer abortions" isn't a Pareto improvement; it's still complicity in murder. Your friend's model assumes all values are soft constraints, but many people treat core morals as hard constraints.

  **2. The "Always" Claim (Incommensurability)**
  He claims a deal can *always* be found if transaction costs are low. Philosophers call the counter-argument **incommensurability**. This means some values cannot be measured on the same scale, so there is no exchange rate to calculate.
  *   **The Example:** If one party values "absolute religious obedience" and the other values "individual autonomy," there is no common currency to trade. You can't buy a little bit of obedience with a little bit of autonomy if your system defines obedience as total. In these cases, the conflict isn't due to irrationality or pride; it's because the value systems are running on incompatible operating systems. There is no overlapping subset that satisfies both core requirements.

  **3. Rationality of Refusal (Integrity vs. Efficiency)**
  Does it follow that failing to compromise is irrational? In your friend's economic model, yes, because they define rationality as maximizing utility. In moral philosophy, no.
  *   **The Reasoning:** If your moral duty is to tell the truth, lying to achieve a "better outcome" is often considered irrational in a moral sense, even if it is efficient in a practical sense. Refusing to compromise can be an act of **integrity**. A philosopher would say that maintaining consistency with your core principles is a rational goal in itself, not a "transaction cost" to be eliminated. Calling this irrational begs the question by assuming the only rational goal is material gain or conflict reduction.

  **4. Actions vs. Values (The Distinction)**
  Your intuition here is correct: there is a major difference between compromising on **actions** (what we do) and compromising on **values** (what we believe is true).
  *   **The Distinction:** Your friend describes a *moral compromise* (changing what you believe is right to meet in the middle). What usually happens in politics is a *modus vivendi* (a way of living together despite disagreement).
  *   **The Example:** In the wind farm case, the environmentalist doesn't necessarily agree that property rights are more important than climate change. They simply agree to a specific action (smaller farm) to avoid a worse outcome (no farm + legal battle). They haven't traded values; they have found an overlap in acceptable actions. Your friend runs these together, but philosophers care deeply about whether you changed your mind or just changed your plan.

  **5. Which Philosophers Agree?**
  *   **Accept:** Liberals, consequentialists, and game theorists often use this model. It works well for legislation, zoning laws, and budget negotiations where values are plural and flexible.
  *   **Reject:** Deontologists (rule-based ethicists), virtue ethicists, and religious ethicists often reject it. They argue that some things are not for sale, and treating them as tradeable commodities corrupts the value itself.

  **Bottom Line on the Summary**
  His summary is fair as a description of **political bargaining**, but it is an oversimplification of **moral reasoning**. It works when values are preferences, but it breaks when values are perceived as truths.
