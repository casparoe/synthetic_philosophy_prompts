answer: |-
  **Project Title:** Disaggregating Idealization: Epistemic, Motivational, and Procedural Dimensions in Indirect Normativity

  **Research Question**
  Does disaggregating epistemic idealization from motivational and procedural idealization insulate indirect normative theories from the alienation objection?

  **Project Summary and Background**
  Indirect normative theories posit that the rightness of an action is determined not by its intrinsic properties, but by its relation to a decision procedure or set of rules that an idealized agent would endorse. Prominent versions of this view, found in contemporary rule-consequentialism and contractualism, rely heavily on the concept of an "ideal observer" or "reasonable agent." In the existing literature, this idealization is predominantly treated as a monolithic epistemic condition: the agent possesses complete information, logical consistency, and freedom from cognitive bias.

  My working hypothesis is that this standard framing conflates three distinct dimensions of idealization that ought to be analytically separated: (1) **Epistemic Idealization** (access to facts and logical consistency); (2) **Motivational Idealization** (commitment to specific ends or values); and (3) **Procedural Idealization (** adherence to a specific method of aggregation or justification). Currently, these dimensions are bundled. When a theory claims an ideal agent would endorse a rule, it assumes the agent knows everything (Epistemic), cares about the relevant moral values (Motivational), and reasons via a specific calculus (Procedural).

  This conflation creates vulnerability to the "alienation objection," most famously associated with Bernard Williams. This objection argues that indirect theories require agents to act on reasons that are external to their actual motivational set, thereby alienating them from their actions. If the ideal agent differs from the actual agent only in knowledge (Epistemic), the ideal choice might remain accessible to the actual agent. However, if the ideal agent also differs in what they care about (Motivational) or how they reason (Procedural), the resulting directives may appear entirely alien to the actual agent. This project tests whether isolating the epistemic component preserves the structural benefits of indirect normativity while neutralizing the alienation objection.

  **The Unresolved Debate**
  Current debates between rule-consequentialists and contractualists leave this ambiguity unresolved because both camps treat idealization as a unified block rather than a composite variable. In rule-consequentialism, the "optimal code" is typically selected by agents who are fully informed (Epistemic) but also assumed to be motivated by general welfare (Motivational) and capable of complex utility aggregation (Procedural). Consequently, when an actual agent is commanded to follow this code, critics argue the demand is alien because the actual agent lacks the idealized motivation and computational capacity.

  Similarly, in contractualism, the condition of "reasonable rejection" relies on agents who are informed (Epistemic) but also presupposes a specific motivation to find principles others could not reject (Motivational) and a specific deliberative procedure for weighing burdens (Procedural). By bundling these dimensions, both frameworks inadvertently strengthen the alienation objection. They make it appear that following the indirect norm requires becoming a different kind of person (motivationally) or thinking in an unnatural way (procedurally), rather than simply acting on better information. This project argues that this conflation is unnecessary; a theory relying solely on epistemic idealization may retain indirect structure without demanding motivational transformation.

  **Proposed Methodology**
  The research will be conducted over six months at approximately twenty hours per week, divided into three sequential phases.

  *Phase 1: Conceptual Mapping (Months 1–2)*
  The first phase involves constructing a rigorous taxonomy of the three dimensions. I will define the boundaries of Epistemic, Motivational, and Procedural idealization to ensure they are mutually exclusive and jointly exhaustive within the context of normative deliberation. Special attention will be paid to "borderline" cases where epistemic improvements seem to entail motivational shifts (e.g., does knowing all facts necessarily entail caring about all interests?). The output will be a formalized framework for describing any indirect theory as a combination of these three variables.

  *Phase 2: Case Study Reconstruction (Months 3–4)*
  I will apply this taxonomy to two canonical frameworks: a standard rule-consequentialist theory and a contractualist theory. These will not be treated as competing doctrines to be defended, but as case studies to be reconstructed. I will generate "separated" versions of each theory. For example, I will construct a version of rule-consequentialism where the ideal selector has full information but shares the actual agent's specific motivational set and uses a heuristic rather than maximizing procedure. This phase determines whether these theories can coherently function when stripped of bundled idealizations.

  *Phase 3: Evaluation of the Alienation Objection (Months 5–6)*
  In the final phase, I will subject the separated versions to the alienation objection. I will analyze whether an actual agent, differing from the ideal agent only epistemically, would view the ideal agent's endorsement as a valid reason for action. The analysis will focus on whether the "gap" between actual and ideal is bridged by information alone, or if motivational/procedural gaps are required to generate normative force.

  **Criteria for Success and Failure**
  *Success:* The project succeeds if I can demonstrate that at least one reconstructed theory (either consequentialist or contractualist) retains its indirect structure (action is right because it conforms to the ideal choice, not because of intrinsic properties) while blocking the alienation objection. Specifically, I must show that an agent can accept the directive of an epistemically idealized peer without adopting that peer's motivational set or procedural methods.

  *Failure:* The project fails if I demonstrate that the three dimensions are conceptually inseparable in any normatively interesting form. For instance, if removing motivational idealization renders the ideal agent's choice indeterminate, or if an epistemically idealized agent without procedural idealization collapses into direct normativity (where the agent simply sees the rightness directly), the hypothesis is falsified. Another failure condition is showing that the alienation objection applies equally to epistemic-only idealization, implying the objection targets indirectness itself rather than the idealization bundle.

  **Scope Assessment and Timeline Risks**
  This project is designed for a six-month timeline at twenty hours per week. The primary risk lies in Phase 1. The conceptual distinction between epistemic and motivational states is a deep metaethical issue; attempting to resolve whether "knowing the good" entails "wanting the good" could consume the entire stipend period without yielding results on the primary research question.

  To mitigate this, I will adopt a functional definition of motivation distinct from cognition for the purposes of this project, bracketing deeper metaethical disputes unless they directly obstruct the taxonomy. If Phase 1 extends beyond eight weeks, I will truncate Phase 2 by reducing the case studies from two frameworks to one. I will prioritize the contractualist case study, as the "reasonable rejection" criterion offers a clearer testing ground for procedural versus motivational distinctions than utility aggregation. If further truncation is required, I will limit Phase 3 to a single formulation of the alienation objection (the psychological integrity version) rather than surveying all variants. This ensures a complete, albeit narrower, argument is produced within the stipend period.
