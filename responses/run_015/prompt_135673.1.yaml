  **Memorandum to the Working Group on Historical Framing**

  **Subject:** Analysis of Pedagogical Framing for Gottlob Frege's Late Diary

  **From:** [Name Withheld], Retired Biologist
  **Date:** October 26, 2023

  Having reviewed the four advisory precedents established by this working group, I have analyzed the new case concerning Gottlob Frege using the logical constraints provided. My background in the biological sciences inclines me to treat these precedents as data points from which we might derive governing laws. The goal is to determine whether the existing "phenomenology" of your decisions supports a consistent taxonomy for the Frege case. Below is my analysis structured according to your five requests.

  ### 1. General Rules Derived from Precedents

  To account for the variance in the four precedents (Heidegger, Wittgenstein, Kant, and the 19th-century Mathematician), I propose two distinct rules. Both are consistent with the historical data but prioritize different variables.

  **Rule 1: The Principle of Structural Entanglement**
  *Definition:* Pedagogical framing must include repugnant views if and only if those views are logically or structurally constitutive of the technical work. The public or private nature of the source material is secondary to the strength of the conceptual link.
  *Application to Precedents:*
  *   **Heidegger (Include):** The antisemitism is not merely adjacent to the ontology; it is "woven into" the reflections on being. The bias is a structural load-bearing element.
  *   **19th-Century Mathematician (Exclude):** The correspondence is explicitly "domain-separated." The nationalism has no influence on the formal proofs. There is no structural entanglement.
  *   **Kant (Include):** The racial classifications are embedded within the account of human cognition. The bias is part of the theoretical architecture.
  *   **Wittgenstein (Exclude):** The disparagement is personal and anguished, lacking a "systematic political ideology" connected to the philosophy of language. No structural link exists.

  **Rule 2: The Principle of Public Provenance (with a Conceptual Override)**
  *Definition:* Pedagogical framing should include repugnant views if they appear in the public, professional corpus. Private material is presumptively excluded *unless* it serves as the necessary key to interpreting the public work's ideological foundation.
  *Application to Precedents:*
  *   **Kant (Include):** The anthropology lectures are part of the "public philosophical corpus." They pass the primary test.
  *   **19th-Century Mathematician (Exclude):** The correspondence is private and fails the conceptual override test (no influence on proofs).
  *   **Wittgenstein (Exclude):** The diaries are private and fail the conceptual override test (philosophically separate).
  *   **Heidegger (Include):** The notebooks are private, which would normally trigger exclusion. However, they are included because they satisfy the "Conceptual Override": they are required to understand the philosophical architecture.

  ### 2. Predictions for the Frege Case

  Here I apply the two rules to Frege, accepting the premise of the "recent interpretive argument" that his logical distinction between *Gedanken* (objective thoughts) and *Vorstellungen* (subjective ideas) resonates structurally with his authoritarian politics.

  **Prediction under Rule 1 (Structural Entanglement):**
  *   **Verdict:** **Include.**
  *   **Reasoning:** The interpretive argument posits a structural resonance between Frege's logic (objective truth accessible only to an elite) and his politics (authoritarian exclusion). If we accept this argument as valid data, the repugnant views are not merely biographical; they are isomorphic with the technical concepts. Like Heidegger, the bias is conceptually intertwined with the architecture. Therefore, framing is required.

  **Prediction under Rule 2 (Public Provenance):**
  *   **Verdict:** **Exclude (with high ambiguity).**
  *   **Reasoning:** The diary is explicitly private and "never intended for publication." Under the primary clause of Rule 2, this mandates exclusion (aligning with Wittgenstein and the Mathematician). To include it, the group must invoke the "Conceptual Override" used for Heidegger. However, the Frege case is weaker than Heidegger's: the prompt notes Frege "never applied the logical vocabulary directly to political questions," whereas Heidegger's antisemitism was "woven into reflections." If the group views the "structural resonance" in Frege as too interpretive compared to Heidegger's explicit weaving, Rule 2 predicts exclusion.

  ### 3. Best-Guess Recommendation

  **Recommendation:** The working group should recommend **inclusion with contextual framing.**

  **Closest Analog:** **Martin Heidegger.**

  **Justification:**
  While the 19th-century Mathematician is the closest analog regarding the *formality* of the work (logic/math vs. ontology), the Heidegger case is the binding precedent regarding the *relationship between private bias and technical concepts*. In both the Heidegger and Frege cases, we are dealing with private writings that allegedly illuminate a hierarchy implicit in the public technical work.

  To exclude Frege while including Heidegger would require drawing a distinction between "ontology" and "logic" that suggests formal logic is immune to ideological critique. Given that the working group already accepted that Heidegger's ontology was not immune, consistency demands that Frege's logic be treated similarly. The interpretive argument provided—that the *Gedanken/Vorstellungen* distinction carries a normative hierarchy—mirrors the "conceptual intertwining" cited in the Heidegger precedent. To rule otherwise would imply that formal logic is a "domain-separated" activity (like the Mathematician's proofs), which the interpretive argument explicitly denies.

  ### 4. Analysis of Underdetermination

  While the Heidegger precedent strongly suggests inclusion, the precedents do genuinely underdetermine the decision regarding the **threshold of evidence** required for "conceptual intertwining."

  *   **Principle Adopted by Including:** The group would be adopting the principle of **Holistic Integrity**. This principle holds that a philosophical system cannot be cleanly severed from the moral and political worldview of its author, even in formal domains. It asserts that if a credible interpretation links the bias to the structure of the theory, the curriculum must reflect that complexity, prioritizing intellectual honesty over the comfort of the student.
  *   **Principle Adopted by Excluding:** The group would be adopting the principle of **Formal Autonomy**. This principle holds that technical achievements in logic and mathematics possess a validity independent of the author's psyche. It asserts that unless the bias is explicitly stated in the technical work (as with Kant), private speculation about "structural resonance" is insufficient to alter the pedagogical framing. This prioritizes the stability of the technical curriculum and protects the domain of formal proof from hermeneutic suspicion.

  ### 5. Hypothetical Distinguishing Case

  To clarify the divergence between Rule 1 (Structural Entanglement) and Rule 2 (Public Provenance), I propose the following hypothetical case:

  **The Case of the Biased Preface:**
  A prominent 20th-century logician publishes a standard, widely used textbook on formal logic. The mathematical proofs and technical chapters are neutral and universally accepted. However, the **publicly published preface** contains a virulent nationalist manifesto arguing that only members of the author's nation possess the discipline required to master the logic contained in the book.

  *   **Rule 1 (Structural Entanglement) Prediction:** **Exclude.** The technical content (the proofs) remains domain-separated from the bias. The logic itself does not change based on who performs it; the bias is an external commentary, not a structural element of the formalism.
  *   **Rule 2 (Public Provenance) Prediction:** **Include.** The bias appears in the public, professional corpus (the textbook). Regardless of whether it alters the proofs, it is part of the authorized presentation of the work and shapes the historical reception of the text.

  This case isolates the variable of *location* (public text vs. technical content) and would force the working group to decide whether the mere public expression of bias warrants framing, or if the bias must mathematically or logically infect the technical work itself.
