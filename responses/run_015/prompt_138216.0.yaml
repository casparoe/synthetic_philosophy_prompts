answer: |-
  Here is the specification of desiderata for your epistemic utility measure, organized by necessity, with the underlying justifications and the explicit incompatibilities you requested.

  ### I. Non-Negotiable Desiderata (The "Must-Haves")
  *Given your triple use-case (ranking, payouts, training), these constraints eliminate the largest class of candidate measures.*

  **1. Strict Propriety**
  *   **Definition:** A forecaster maximizes their expected score (minimizes expected inaccuracy) if and only if they report their true credences.
  *   **Case:** This is the bridge between your epistemic and pragmatic goals. Without it, the score fails as a training signal (models optimize for the score, not the truth) and fails as an incentive (humans game the metric).
  *   **Status:** **Non-Negotiable.** While accuracy-first epistemology argues for this as a norm of rationality, for you it is an engineering constraint. If the measure is not strictly proper, your model loss landscape does not align with reality, and your payout structure invites hedging.

  **2. Boundedness**
  *   **Definition:** The score has a finite maximum penalty (and reward) per question.
  *   **Case:** You are paying prizes and maintaining a leaderboard. An unbounded score (like Log) allows a single catastrophic error (assigning 0 to the truth) to infinite-negative a forecaster's track record, effectively removing them from the competition regardless of prior performance. This creates unacceptable variance in payouts and makes the ranking brittle to outliers.
  *   **Status:** **Non-Negotiable.** This is a pragmatic risk-management constraint, not an epistemic one. Epistemically, being infinitely wrong *should* hurt infinitely, but operationally, you cannot afford it.

  **3. Additivity (Separability)**
  *   **Definition:** The total score for a set of questions is the sum (or weighted sum) of the scores for individual questions.
  *   **Case:** You need to aggregate across questions and forecasters who answered different subsets. Non-additive measures (e.g., those requiring a joint distribution over all tournament outcomes) make it impossible to rank partial participants or update leaderboards in real-time.
  *   **Status:** **Non-Negotiable.** Required for the logistics of aggregation.

  ---

  ### II. Epistemic Desiderata (The "Should-Haves")
  *These capture the intuition of "tracking truth," but several are in tension with the Non-Negotiables.*

  **4. Locality**
  *   **Definition:** The score for a question depends *only* on the probability assigned to the outcome that actually occurs, not on probabilities assigned to false outcomes.
  *   **Case:** Epistemically, if the world is $A$, why should I be penalized for what I thought about $B$? Locality isolates accuracy from "distractor" management.
  *   **Status:** **Debatable/Prejudice.** Most standard proper scores (Brier, Log) are local. However, locality prevents you from penalizing incoherence directly (see #6). If you drop locality, you can penalize probability mass assigned to impossible worlds.

  **5. Partition Independence (Label Invariance)**
  *   **Definition:** The score should not depend on how the outcome space is carved up. If "Candidate A wins" is split into "Candidate A wins by <1%" and "Candidate A wins by >1%", the expected score for a forecaster with the same underlying belief state should remain comparable.
  *   **Case:** You noted tournaments carve targets at different fineness. If a measure rewards finer partitions (more opportunities to be right/wrong) or penalizes them differently, you cannot compare scores across tournaments.
  *   **Status:** **Epistemic Ideal, Practically Impossible.** See Incompatibilities below.

  **6. Coherence Sensitivity**
  *   **Definition:** The measure should penalize jointly incoherent credence functions (e.g., $P(A) + P(\neg A) > 1$) beyond just penalizing inaccuracy on the truth.
  *   **Case:** You catch forecasters holding incoherent sets. A local scoring rule scores $P(A)$ when $A$ happens and ignores $P(\neg A)$. It treats incoherence as a series of independent accuracy errors rather than a structural failure.
  *   **Status:** **Desirable but Costly.** To satisfy this, you must score the *vector* of credences, not just the component corresponding to the truth. This violates Locality.

  **7. Resolution Sensitivity (Informative Winning)**
  *   **Definition:** A forecaster who consistently reports 0.5 should not top the leaderboard against knowledgeable forecasters.
  *   **Case:** Your concern that cautious forecasters look "respectable."
  *   **Status:** **Consequence, not Requirement.** Strict Propriety guarantees that *in expectation*, a knowledgeable forecaster beats a 0.5 forecaster. In finite samples, luck exists. If you require this as a hard constraint (e.g., penalizing 0.5 explicitly), you violate Strict Propriety (punishing honest uncertainty). Do not encode this as a rule; encode it as a requirement for *sufficient sample size*.

  ---

  ### III. Optimization Desiderata (The "Model" Constraints)
  *Specific to your model-based forecasters.*

  **8. Convexity**
  *   **Definition:** The loss function is convex with respect to the reported probabilities.
  *   **Case:** You need the measure to serve as a loss function for gradient descent. Non-convex surfaces lead to local minima where models get stuck reporting nonsense.
  *   **Status:** **Non-Negotiable for Models.** All standard proper scoring rules (Brier, Log, Spherical) satisfy this.

  ---

  ### IV. Incompatibilities and Impossibility Results
  *You suspected some demands cannot be jointly satisfied. You are correct.*

  **1. The Locality-Partition-Propriety Trilemma**
  *   **Conflict:** You cannot have a scoring rule that is (a) Strictly Proper, (b) Local, and (c) Partition Independent.
  *   **Reason:** If a rule is local and proper, the penalty depends on the probability assigned to the truth. If you refine a partition (split one outcome into two), the probability mass on the "truth" is split. To maintain the same score, the function would have to adjust non-linearly in a way that breaks propriety or locality.
  *   **Implication:** You must accept that scores are not directly comparable across questions with different numbers of outcomes unless you normalize (e.g., by dividing by the max possible score for that partition).

  **2. Boundedness vs. Log Score**
  *   **Conflict:** The Log score is the only local proper scoring rule that is invariant to independent refinements of the outcome space in an information-theoretic sense (it measures bits). It is unbounded.
  *   **Implication:** Because you flagged **Boundedness** as non-negotiable (for payouts/risk), **Log Score is eliminated.** It poses existential risk to a forecaster's account on a single tail event.

  **3. Coherence vs. Locality**
  *   **Conflict:** To penalize incoherence (e.g., Dutch Book vulnerability), the score must "see" the probabilities assigned to false outcomes. Local rules ignore false outcomes once the truth is known.
  *   **Implication:** If penalizing incoherence is a priority, you must use a non-local rule (like Spherical or a custom quadratic form on the vector) or add a separate coherence penalty.

  **4. Properness vs. "0.5 Never Wins"**
  *   **Conflict:** If a forecaster truly has no information, 0.5 is the *accurate* credence. Penalizing 0.5 forces them to lie.
  *   **Implication:** Do not make this a desideratum of the *measure*. Make it a property of the *tournament design* (enough questions so variance averages out).

  ---

  ### V. The Knockout Constraint
  **Boundedness** is the single requirement that knocks out the most candidate measures, specifically the **Log Score**.
  While Log is the gold standard for information theory and model training (due to its relationship with likelihood), its unbounded nature makes it unsuitable for a prize-based leaderboard where ruin is possible.

  **Non-Negotiables Summary:**
  1.  **Strict Propriety** (for training/honesty).
  2.  **Boundedness** (for payouts/survival).
  3.  **Additivity** (for aggregation).

  ---

  ### VI. Rule Briefs

  **Brier Score (Quadratic)**
  *   **Verdict:** **Strong Candidate.**
  *   **Pros:** Bounded [0, 1], strictly proper, convex, local, additive. It satisfies all your non-negotiables. It is gentle on confident errors compared to Log (penalty is quadratic, not asymptotic).
  *   **Cons:** Less "discriminatory" than Log; doesn't penalize confident wrongness as severely as some epistemologists prefer. Not partition independent.

  **Log Score (Logarithmic)**
  *   **Verdict:** **Reject.**
  *   **Pros:** Deep theoretical links to information theory and likelihood; standard for model training.
  *   **Cons:** **Unbounded.** A single 0% assignment to a true event yields infinite loss. Violates your risk constraint.

  **Spherical Score**
  *   **Verdict:** **Alternative Candidate.**
  *   **Pros:** Bounded, strictly proper, convex.
  *   **Cons:** **Non-local.** The score depends on the sum of squares of probabilities assigned to *all* outcomes, not just the truth. This allows you to penalize incoherence (mass spread too thin) but makes the score dependent on how many false options were listed (partition sensitivity). Harder to explain to humans ("Why did my score drop when I changed my mind about a loser?").

  ### VII. Handling Your Specific Cases

  *   **Incoherence:** Use a **non-local** rule (like Spherical) or, more practically, project forecasts onto the coherent simplex before scoring. If you stick with Brier (local), you must check coherence separately and disqualify or penalize incoherent entries administratively.
  *   **Conditionals ($P(A|B)$ where $B$ is false):** The standard epistemic treatment is **voiding**. The question does not resolve. Do not attempt to score these; they introduce noise and disputes. Treat them as "no contest."
  *   **Ambiguous/Never-Resolving:** If resolution is ambiguous, the "truth" is undefined. You cannot score epistemic accuracy without a ground truth. Use a **resolution committee** to assign a definitive 0 or 1 (or probability distribution) for scoring purposes, even if the real world is fuzzy. The score measures accuracy against the *adjudicated* truth.
  *   **Partition Fineness:** Since Partition Independence is impossible with Proper+Bounded+Local rules, you must **normalize** scores. Report scores as a percentage of the maximum possible improvement over a baseline (e.g., Skill Score relative to 0.5) rather than raw loss. This makes a 0.8 Skill Score on a binary question comparable to a 0.8 Skill Score on a ternary question.

  ### VIII. Final Recommendation
  Adopt the **Brier Score** (or a normalized Brier Skill Score) as your primary metric.
  1.  It meets the **Non-Negotiables** (Proper, Bounded, Additive, Convex).
  2.  It is locally interpretable for humans (unlike Spherical).
  3.  To address the "0.5 forever" concern, publish **Skill Scores** (relative to a baseline of 0.5) rather than raw Brier scores. This ensures a 0.5 forecaster gets exactly 0 skill, and negative skill is possible for worse-than-random forecasters.
  4.  To address **Incoherence**, run a coherence check on submission. Reject or flag incoherent vectors before scoring. Do not rely on the scoring rule to fix logic errors.
  5.  To address **Model Training**, use Brier loss for your models. It is convex and proper. The performance gap between Brier and Log training is usually negligible compared to the risk management benefits of boundedness.
