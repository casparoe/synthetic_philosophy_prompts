      **Section 1: The Setup**
      Focus: Context and Term.
      Draft: The scenario is a Housing Co-op Board deciding who qualifies as a "Resident" for utility subsidy allocation. You are paired with another board member. You both agree on all non-semantic facts: who sleeps there, who pays rent, who receives mail. You disagree on whether "Resident" requires *sleeping* there 4 nights/week (Side A) or merely *holding a lease* (Side B). Side A wants to minimize subsidy costs (strict definition). Side B wants to maximize tenant security (loose definition). You must submit one unified list of "Residents" to the City. If you fail to agree, no subsidies are granted to anyone. If you agree, the chosen definition applies to all future cases this semester. The term is empty until you fill it, but filling it distributes real burdens.

      **Section 2: Rules and Materials**
      Focus: Mechanics.
      Draft: Materials: 16 Role Cards (8 Type A, 8 Type B), 8 Decision Sheets, timers.
      1. Form 8 pairs. Distribute cards privately. Do not show your card.
      2. Round 1 (5 mins): Discuss a specific case (e.g., "Alex pays rent but sleeps elsewhere 5 nights"). Argue Yes/No on "Is Alex a Resident?"
      3. Round 2 (5 mins): Negotiate the definition. You must submit one shared criterion.
      4. Constraint: You cannot reveal your private incentive directly ("I need to save money"). You must argue using the meaning of "Resident."
      5. Outcome: If no agreement, both lose. If agreement, the winner (whose definition matches the card) gets a "Privilege Token" (homework pass). The loser gets nothing.
      6. Twist: If you coordinate on a hybrid definition, neither gets the token. You must pick one pole.

      **Section 3: Timeline**
      Focus: 75 mins.
      Draft: 0-5: Intro scenario only. No theory.
      5-20: Round 1 & 2 (Argument & Negotiation).
      20-25: Tally outcomes. Reveal cards.
      25-40: Small group discussion: "Did you disagree about facts?"
      40-60: Full seminar debrief (connecting to metaphysics).
      60-70: Ontology extension (composition).
      70-75: Closing.
      *Correction:* Need more play time. 5-25 Play. 25-35 Reveal/React. 35-75 Debrief.

      **Section 4: Scoring**
      Focus: Incentives.
      Draft: No money. Currency is "Seminar Capital."
      Win Condition: Your partner agrees to the definition on your card.
      Payoff: Winner gets exemption from next response paper. Loser gets nothing.
      Coordination Payoff: If you agree on *any* definition, both avoid the "Board Failure" penalty (mandatory extra reading).
      Tension: You want to coordinate to avoid penalty, but you want to win the definition to get the exemption. This mirrors the tension between resolving verbal disputes and caring about which concept wins. The "loss" is the inability to use the term for your purpose later.

      **Section 5: Debrief Map**
      Focus: Connecting to theory.
      Draft: Start by asking: "Did you disagree about Alex's habits?" (No). "Then why argue?" (Because the label dictates outcomes).
      (a) Verbal Nature: Highlight that once definitions were revealed, factual disagreement vanished. Both sides agreed on the world; they partitioned it differently. This mirrors quantifier variance or conceptual plurality.
      (b) Non-Deflationary: Despite being verbal, stakes remained. Choosing "Resident" isn't neutral; it allocates resources. This is conceptual ethics. The dispute wasn't about truth, but utility.
      (c) Ontology Move: Connect to composition. Ask: "Does the table exist?" Nihilist vs. Universalist. They agree on particles arranged table-wise. Disagree on "object." Just like "Resident," choosing an ontology isn't just describing the world; it's choosing a conceptual framework that enables or disables certain explanations. Both can be 'right' relative to their framework, but we still fight over which framework to adopt because some frameworks carve nature at joints better for specific sciences. The game shows that 'merely verbal' doesn't mean 'trivial.'

      **Section 6: What will go wrong**
      Focus: Practical issues.
      Draft: Students will try to hack the rules by revealing cards early. Enforce the "no direct incentive reveal" rule strictly. Some pairs will compromise too easily ("Let's flip a coin"), missing the argumentative tension. Others will deadlock. You need to circulate and prompt: "Can you agree on the facts but not the label?" If they finish too fast, give them a harder case (e.g., "Alex sleeps there 3 nights"). Ensure the "Privilege Token" feels valuable enough to motivate conflict but not so valuable it creates hostility.

      **Section 7: What the game can't do**
      Focus: Limitations.
      Draft: This game simulates conceptual ethics, not deep metaphysical intuition. It won't convince a hardline realist that existence questions are verbal. It simplifies the stakes to administrative burdens, whereas ontological stakes involve explanatory power and theory choice. It also risks suggesting all verbal disputes have hidden substantive stakes, which isn't true; some are just confusion. It teaches the *possibility* of substantive verbal disputes, not the necessity.

      **Section 8: Where this design is most likely to fail**
      Focus: Critical reflection.
      Draft: It fails if students view the "Privilege Token" as the only stake. If they think the dispute is substantive *only* because of the homework pass, they miss the point that conceptual choices *inherently* have costs. To fix this, the debrief must emphasize that the homework pass stands in for real-world explanatory power. If I saw students treating the definition choice as arbitrary despite the payoff, I'd change the incentives to be epistemic (e.g., whose definition predicts future cases better) rather than pragmatic.

