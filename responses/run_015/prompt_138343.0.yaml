  **The Setup**
  Use a reusable procedure: "Conflicting Utility Frameworks." Instantiate it here as a Housing Co-op Board. The term is "Resident." All students agree on non-semantic facts: who sleeps where, who pays rent, who receives mail. The conflict arises from private mandates. Type A cards mandate minimizing subsidy costs (strict definition: must sleep there 5+ nights). Type B cards mandate maximizing tenant security (loose definition: must hold a lease). You must submit one unified list of "Residents" to the City. If you fail to agree, no subsidies are granted. If you agree, the chosen definition applies to all future cases. The term is empty until filled, but filling it distributes real burdens. This setup ensures the disagreement is purely semantic initially, but the consequences are material. Students experience the friction of coordinating on language when language carries weight.

  **Rules and Materials**
  Materials: 16 Role Cards (8 Type A, 8 Type B), 8 Decision Sheets, timers.
  1. Form 8 pairs. Distribute cards privately. Do not show your card.
  2. Round 1 (5 mins): Discuss a specific case (e.g., "Alex pays rent but sleeps elsewhere 5 nights"). Argue Yes/No on "Is Alex a Resident?"
  3. Round 2 (5 mins): Negotiate the definition. You must submit one shared criterion.
  4. Constraint: You cannot reveal your private incentive directly ("I need to save money"). You must argue using the meaning of "Resident."
  5. Outcome: If no agreement, both lose. If agreement, the winner (whose definition matches the card) gets a "Privilege Token" (homework pass). The loser gets nothing.
  6. Twist: If you coordinate on a hybrid definition, neither gets the token. You must pick one pole. This forces a choice between coordination and conceptual victory.
  Reuse Procedure: Change the Term (e.g., "Alive"), the Facts (biological markers), and the Incentives (legal liability vs. moral duty) to regenerate the game for future seminars without losing structural integrity.

