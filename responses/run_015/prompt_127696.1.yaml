out the tech language being forced and more about making sure you explain the tech terms clearly so a philosophy reader doesnt get lost in the jargon since they might not know what a distributed error correction protocol actually entails. Overall it is not confusing it is actually a fresh synthesis of cybernetics and sociology of religion and as long as you acknowledge the limits of the metaphor it should work well. Just make sure you dont claim religion IS a network but rather functions LIKE one to avoid category errors and you should be fine.
