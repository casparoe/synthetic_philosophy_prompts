Matter because why need a hidden fact if the pattern is all that matters so that space is mostly empty except for people who haven't thought it through and ultimately if you push the hetero-loop hard enough the distinction between semantic and syntactic dissolves because the simulation provides the semantics functionally so I'd flag those two branches as practically inseperate in a high-fidelity upload scenario and watch out for the typo in my reasoning here because if the substrate migrates but the hetero-loop points to a static model the self becomes a recording not a loop which breaks our starting axiom so that whole quadrant might need to be culled from the workshop taxonomy entirely lest we spend three hours debating ghosts in machines again best
