  Here are the draft materials for the MA final. I've kept the question dense enough to filter out the undergrads and focused the model answer on the specific metaphysical tension you requested.

  ***

  ### MA Final Examination: Buddhist Metaphysics and Personal Identity
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer **one** question. Closed book.

  **Question 1**
  When *anatta* (no-self) is imported into Western philosophy of mind, a conceptual slippage often occurs between *diachronic anatta* (no persisting substrate across time) and *synchronic anatta* (no unified subject at a given moment). Western reductionists often deny the former while tacitly accepting the latter. Critically evaluate the objection that if there is no self, the phrase 'my suffering' loses its referent, rendering the soteriological aim of Buddhism incoherent. Can distinguishing between *proprietary ownership* (phenomenal having) and *agential ownership* (moral responsibility) rescue *anatta* from this objection, or does the slippage undermine the argument entirely?

  ***

  ### Model Answer

  The importation of *anatta* into Western analytic philosophy frequently founders on a category error regarding temporal unity. Western reductionists, such as Parfit, typically attack diachronic persistence, arguing that psychological connectedness replaces identity over time. However, they often retain a synchronic unity—a single locus of experience at time *t*. Buddhist metaphysics, conversely, denies both. The slippage occurs when Western interpreters assume that denying a persisting soul automatically preserves the immediacy of the present subject. This distinction is crucial when addressing the objection that 'my suffering' requires a referent.

  The objection posits that suffering is essentially first-personal; pain implies a sufferer. If *anatta* eliminates the subject, it seemingly eliminates the possibility of suffering, thereby nullifying the First Noble Truth. However, this objection relies on conflating the *experience* of pain with the *owner* of pain. The slippage between diachronic and synchronic no-self exacerbates this. If one accepts synchronic unity, the 'my' in 'my suffering' refers to a momentary subject. If one accepts full *anatta*, the 'my' must be analysed differently. The referent is not a substance, but a causal process. Suffering exists as a phenomenon within the five aggregates, not as a property belonging to a distinct entity.

  This is where the distinction between proprietary and agential ownership becomes vital. Proprietary ownership refers to the phenomenal character of experience—the 'mineness' felt in pain. Agential ownership refers to the attribution of moral responsibility or authorship. A robust defence of *anatta* must concede proprietary ownership in a conventional sense while denying it ultimately. The sensation of pain is real; the inference that there is a 'self' having the pain is the delusion. By accepting proprietary ownership as a phenomenological fact without ontological commitment, the theory avoids nihilism.

  However, does this rescue hold? It succeeds only if the synchronic unity is also dismantled. If one retains a synchronic subject to ground proprietary ownership, one has not fully embraced *anatta*, but merely a momentary self. To rescue the argument, one must argue that proprietary ownership is itself a constructed narrative, not a brute fact. The 'mineness' is an additional mental formation, not an intrinsic quality of the pain. Therefore, distinguishing proprietary from agential ownership helps clarify the ethics of karma without a self, but it does not fully solve the metaphysical problem unless the phenomenology of 'mineness' is also deconstructed. The slippage undermines the argument only if the interpreter fails to see that both diachronic and synchronic unities are equally empty.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Distinction between Diachronic and Synchronic Anatta (5 marks)**
  *   **Must hit:** Clearly defines the difference between no-self across time vs. no-self at a single moment, and identifies where Western philosophy typically slips up.
  *   **Common mess-up:** Candidates treat them as identical or assume Western philosophy denies both equally.

  **2. Analysis of the 'Suffering' Objection (5 marks)**
  *   **Must hit:** Explains why 'my suffering' is thought to require a substantive referent and why this threatens the coherence of the First Noble Truth.
  *   **Common mess-up:** Dismissing the objection too quickly without analysing the linguistic or phenomenological claim.

  **3. Proprietary vs. Agential Ownership Distinction (5 marks)**
  *   **Must hit:** Correctly defines proprietary ownership (phenomenal having) vs. agential ownership (responsibility) and applies them to the pain scenario.
  *   **Common mess-up:** Conflating feeling pain with being responsible for the pain.

  **4. Final Evaluation of the Rescue (5 marks)**
  *   **Must hit:** Offers a clear verdict on whether the distinction saves *anatta* or if the slippage remains fatal (argument must be consistent with previous points).
  *   **Common mess-up:** Sitting on the fence without committing to a metaphysical conclusion.
