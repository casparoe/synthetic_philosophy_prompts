      *   *Check:* The "Invisible Cause" problem.
      *   *Correction:* This is the hardest. The requirement must be about *traces of adaptation*. If they switched crops, the crop record changes. If nothing changes in the record, the cause is historically null *even if ontologically real*.
      *   *Check:* The "Actor" verdict.
