answer: |-
  Here are the requirements for treating non-human entities as historical causes rather than scenery, followed by an analysis of the conflicts inherent in demanding them.

  ### The Standards of Adequacy

  **1. The Mechanism Requirement**
  *   **The Requirement:** The account must specify the physical or biological pathway by which the non-human factor alters human possibilities. It is insufficient to state that a drought coincided with a revolt; the account must detail how water scarcity raised grain prices, how price spikes altered caloric intake, and how caloric deficit reduced the energy available for collective action or, conversely, increased desperation.
  *   **Motivating Case:** *Proportion.* Without a mechanism, "cause" collapses into "correlation." This prevents the slide from "the eruption made things worse" to "the eruption made this happen."
  *   **Status:** **Non-negotiable.** Any causal claim without a mechanism is superstition or storytelling.

  **2. The Mediation Requirement**
  *   **The Requirement:** The account must identify the human institutions that transmitted the non-human shock. A pathogen does not kill a society; it kills bodies, and society kills the society by failing to care for the bodies. The explanation must trace the non-human input through the filter of property rights, logistics, governance, or culture.
  *   **Motivating Case:** *The Alibi Problem.* This ensures environmental explanation does not function as an excuse for political failure. If the weather is the cause, the account must explain why the weather defeated *these* specific arrangements and not others.
  *   **Status:** **Non-negotiable.** Non-human factors do not act on "humanity"; they act on specific configurations of power.

  **3. The Counterfactual Requirement**
  *   **The Requirement:** The account must be able to articulate, even implicitly, what would likely have occurred in the absence of the non-human factor. If the narrative remains identical whether the volcano erupted or not, the volcano is scenery.
  *   **Motivating Case:** *The Double-Telling Test.* If the institutional story and the climate story are both "true" without contradicting each other, neither is doing explanatory work. The non-human factor must change the outcome or the specific trajectory of events.
  *   **Status:** **Non-negotiable.** Causation implies difference-making.

  **4. The Trace of Adaptation Requirement**
  *   **The Requirement:** If a non-human cause is claimed to have been "absorbed" (the *Invisible-Cause Problem*), there must be evidence of the cost of absorption. If farmers switched crops to handle dryness, the crop record must show the switch. If the record shows no change, the cause is historically null, regardless of its geological reality.
  *   **Motivating Case:** *The Invisible-Cause Problem.* History is the study of traces. A cause that leaves no trace in the human record cannot be a historical cause, even if it was a natural one. It prevents historians from claiming hidden influence where there is only silence.
  *   **Status:** **Non-negotiable.** (Though the *type* of trace accepted—quantitative vs. anecdotal—is local taste).

  **5. The Specificity Constraint**
  *   **The Requirement:** The nature of the non-human cause must match the specificity of the historical effect. A general stressor (warming) cannot explain a specific event (the fall of a specific dynasty) without an intermediate chain that narrows the focus.
  *   **Motivating Case:** *Backdrop vs. Co-author.* A dry decade raises the odds of unrest (backdrop); a dry decade that destroys the specific tax grain of a specific region forces a specific fiscal crisis (co-author). The cause must be granular enough to match the effect.
  *   **Status:** **Non-negotiable.** Vague causes yield vague explanations.

  ***

  ### Addressing Your Puzzles

  *   **Backdrop vs. Co-author:** Resolved by **Specificity** and **Mechanism**. If the non-human factor only changes the *probability* of a class of events, it is a backdrop. If it constrains the *content* of the event (e.g., forcing a specific treaty term due to resource loss), it is a co-author.
  *   **The Alibi Problem:** Resolved by **Mediation**. An environmental explanation is only valid if it explains why the human system failed to mitigate the environment. If the system was robust elsewhere, the failure is political, not environmental.
  *   **The Invisible-Cause Problem:** Resolved by **Trace of Adaptation**. If the cause was absorbed without a trace, it is not history. It is geology. History begins where the adaptation leaves a mark (e.g., debt, migration, dietary change).
  *   **The Double-Telling Test:** Resolved by **Counterfactuals**. If both stories stand without contradiction, they are not competing explanations; they are parallel descriptions. One must show how the non-human factor *forced* the institutional hand.
  *   **Proportion:** Resolved by **Mechanism**. The "seam" is the breaking point in the chain of human agency. If the human response was one of many viable options, the non-human factor is minor. If the human response was the *only* viable option, the non-human factor is major.

  ***

  ### The Impossible Triangle

  Your hunch is correct. There is a tension inherent in these requirements that creates a triangle you cannot close if you demand absolute satisfaction of all three vertices.

  1.  **Robust Non-Human Causality:** The non-human factor must be strong enough to make the difference (Counterfactual Requirement).
  2.  **Full Human Accountability:** Human agents must remain responsible for the outcome; the environment cannot be an alibi (Mediation Requirement).
  3.  **Singular Narrative Coherence:** The story must be one story, not two parallel truths (Double-Telling/Counterfactual).

  **The Conflict:**
  If you satisfy **(1)** (the volcano made the empire fall), you strain **(2)** (the emperor is responsible). If the volcano made the fall inevitable, the emperor's choices were irrelevant. If you satisfy **(2)** (the emperor fell because he mismanaged the grain), you strain **(1)** (the volcano was merely a backdrop).

  To close the triangle, you must accept a **Distributed Responsibility** model. You must admit that the non-human factor *constrained* the choice set, but the human actor *selected* the fatal option from within that set. This satisfies the criteria, but it violates the intuitive desire for a single "cause." History becomes a story of *friction* rather than *dominoes*.

  However, there is a deeper conflict between **The Trace of Adaptation** and **Robust Non-Human Causality**.
  If a non-human cause is truly powerful, it often overwhelms adaptation, leaving a trace of destruction. If it is subtle, it forces adaptation, leaving a trace of change. But if it is *perfectly* absorbed (successful adaptation), it leaves no trace.
  *   **The Conflict:** You cannot demand that non-human factors are always decisive **(1)** and that they must always leave a visible trace of human agency **(4)**. Sometimes the most significant historical impact of a climate shift is that it *prevented* a war by forcing migration, leaving no record of the war that didn't happen.
  *   **Verdict:** The **Trace of Adaptation** requirement is the safety valve. It forces you to admit that if there is no trace, there is no history. This limits the scope of environmental history to where nature and culture collide visibly.

  ***

  ### The Exclusionary Requirement

  The single requirement that rules out the most candidates is **The Mediation Requirement**.

  Most popular "big history" books posit a direct line from Microbe/Climate to Historical Outcome. They skip the society. They treat "The Empire" as a single biological organism that catches a fever. By demanding that you explain *which* class starved, *which* bureaucracy failed, and *which* logistics chain broke, you eliminate 90% of the "mountain-as-protagonist" literature. They cannot name the mechanism of transmission because they do not know the institutions well enough. They treat the human world as a uniform slab that reacts uniformly to pressure. It does not.

  ***

  ### Verdict on the Word "Actor"

  **It is decoration.**

  In the context of popular history, calling a pathogen or a volcano an "actor" is anthropomorphism designed to sell books. It smuggles in intent where there is none. A volcano does not "act"; it erupts. A pathogen does not "strategize"; it replicates.

  Using the word "actor" suggests a symmetry between human and non-human that does not exist. Humans react to volcanoes with meaning, politics, and memory; volcanoes do not react to humans at all. To call them both "actors" flattens the very distinction (agency vs. constraint) that historical explanation relies upon.

  **Better Terminology:** Use **"Constraint," "Force,"** or **"Parameter."**
  *   *Actor:* "The volcano acted to destroy the city." (False agency)
  *   *Constraint:* "The eruption constrained the city's options to flight or death." (Accurate causality)

  The word "actor" earns its place only in specific philosophical frameworks (like Actor-Network Theory) where the goal is to dissolve the subject/object distinction. For a historian asking "Who is responsible?" or "Why did this happen?", "actor" is a confusion. It obscures the Mediation Requirement by suggesting the non-human thing participated in the decision-making. It did not. It changed the cost of the decision.

  ***

  ### A Note on Familiar Accounts

  If you hold standard works of environmental history against these criteria:
  *   **The Best:** (e.g., Mike Davis's *Late Victorian Holocausts*) pass the **Mediation** test. They show how El Niño caused drought, but British trade policy turned drought into famine. The non-human is a trigger; the human is the gun.
  *   **The Trendy:** (e.g., broad "Civilization and Climate" surveys) usually fail **Specificity** and **Mechanism**. They correlate temperature curves with war frequency without showing how a soldier's arm gets weaker in the heat. They rely on the **Double-Telling** loophole: the climate story runs parallel to the political story, never quite touching it.
  *   **The Verdict:** If a book calls a river a "protagonist," put it down. If it calls a river a "logistical constraint that determined the supply line," pick it up.
