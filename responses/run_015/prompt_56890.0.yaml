  2.  **Deconstruct the User's Puzzles & Map to Requirements:**
      *   *Backdrop vs. Co-author:* This is about *specificity* and *mechanism*. Does the non-human factor constrain the *range* of action or dictate the *content* of action?
      *   *The Alibi Problem:* This is about *agency* and *responsibility*. Does environmental determinism excuse human failure?
      *   *The Invisible-Cause Problem:* This is about *evidence* and *counterfactuals*. How do we prove a cause that left no trace because it was successfully adapted to?
      *   *The Double-Telling Test:* This is about *explanatory power* and *necessity*. If two stories work independently, do they explain anything?
      *   *Proportion:* This is about *magnitude* and *causal weight*. Distinguishing "contributing factor" from "cause."

  3.  **Drafting the Requirements (Iterative Process):**

