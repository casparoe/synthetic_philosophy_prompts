  - "Room read" (~100 words): This room believes zoning is the bottleneck and process is the weapon. They see the neighborhood veto as pure asset protection. They want by-right development, scale, and speed. To them, "stake" sounds like "delay." They'll hear your thesis as legitimizing obstructionism. Tech wants supply; organizers want stability. Both will fear you're adding friction to the only lever they think works: overriding local opposition. You're challenging their core mechanic (build everywhere now) with a moral claim (belonging matters more than units). They prioritize efficiency; you prioritize continuity. They will assume you are slowing down abundance. You are arguing for a moral claim against their mechanical solution. They view process as the enemy; you view it as the site of negotiation.

  - "The objections, worst-first" (~150 words each, 7 or 8 of them):

  1. **The Abundance Kill**
  "You're replacing by-right with discretionary review. We need abundance, not more process. If every neighborhood weights say by stake, you institutionalize the veto. Developers can't underwrite projects if 'stakeholders' can block them. This kills supply. We need to remove barriers, not create new voting blocs. Your system adds uncertainty to capital deployment. If I can't guarantee by-right approval, I don't build. You're trading units for feelings."
  *Reply:* "Current process already allows owners to block. I'm shifting keys, not adding locks. If locals feel ownership, they stop fighting density. Stability enables building long-term."
  *Soft Spot:* "It still adds uncertainty compared to pure by-right, and doesn't guarantee units get built quickly enough to meet demand."

  2. **The Exclusion Mask**
  "This is NIMBYism in progressive costume. You're giving existing residents power over newcomers. That's exclusion. It protects land value for insiders against regional need. You say you include renters, but it's still insiders vs. outsiders. High land value areas will just lock in their exclusivity using 'stake' instead of deeds. It preserves the status quo under a new moral framework. You're arguing that continuity trumps access. But access is the moral imperative here. Excluding people who need homes to protect people who have homes is still exclusion. How do you prevent wealthy enclaves from using stake to remain wealthy enclaves?"
  *Reply:* "Current system excludes renters too. This democratizes the veto. It's not about exclusion, it's about who counts as community. Long-term renters gain power they lack now."
  *Soft Spot:* "Hard to prove it reduces exclusion in practice rather than just widening the coalition of excluders."

  3. **The Process Trap**
  "You're adding process friction. Verifying stake takes time. Hearings get longer. We need speed. Every new criterion is a new avenue for litigation and delay. Lawyers will fight over who qualifies as 'staked.' The city planner here will tell you administration costs will skyrocket. We want to simplify zoning, not complicate the electorate. Process is where housing goes to die. You're proposing a new bureaucracy to measure belonging. That's time taken away from building. Why should we accept more administrative burden when the goal is to reduce red tape?"
  *Reply:* "Verification is one-time. Ownership verification exists now. This reduces litigation from angry neighbors later. Stable communities sue less."
  *Soft Spot:* "Initial setup is bureaucratically heavy and creates new avenues for legal challenge during the transition."

  4. **The Displacement Blindspot**
  "Tenant organizers will say this ignores economic displacement. Long-term renters might block new affordable units to keep 'character'. They might fear filtering down will bring crime or change the vibe. You're empowering people who are themselves precarious, but they might still act defensively. Displacement isn't just eviction; it's cultural erasure. If stakeholders block mixed-income housing to preserve neighborhood 'continuity,' you've weaponized renters against other renters. How do you ensure stake-weighted say doesn't become a tool for existing low-income residents to block new low-income residents?"
  *Reply:* "Stake includes vulnerability. Precarious renters get weight. It aligns tenants with development that protects them. They need housing too."
  *Soft Spot:* "Existing renters might still protect privilege or fear change, even if economically similar to newcomers."

  5. **The Regional Imperative**
  "Housing is a regional crisis. Neighborhood stake is too local. You can't solve abundance with hyper-local veto. The labor market is regional; the housing market is regional. Your solution is parochial. A worker commuting from Stockton shouldn't be vetoed by a resident in San Francisco. Regional need outweighs local continuity. We need to override local control to meet state targets. Your model reinforces the fragmentation that caused the crisis. Why should a neighborhood's desire for continuity trump a region's need for workforce housing?"
  *Reply:* "Regional goals need local implementation. Ignoring local stake causes statewide preemption backlash. Political sustainability requires local buy-in."
  *Soft Spot:* "Local stake often directly contradicts regional need, forcing a hard choice you haven't resolved."

  6. **The Legal/Planner Reality**
  "Planner here: This is likely illegal. Zoning can't discriminate based on tenure length. Equal protection issues. You can't give voting rights based on how long you've lived somewhere. It sets a dangerous precedent for residency-based discrimination. The lawyer here will confirm this invites lawsuits. We need solutions that fit within existing legal frameworks, not constitutional challenges. If the courts strike this down, we waste years. Why pursue a legally fragile mechanism when we can fix the existing one?"
  *Reply:* "Voting districts already discriminate by residency. This is zoning participation, not voting. It's a community benefit district model."
  *Soft Spot:* "Legal precedent is thin and risky; courts often treat zoning participation differently than municipal voting."

  7. **The Astroturf Risk**
  "Developers will game this. They'll rent shells to generate 'stake' votes. It becomes astroturf. If stake is the currency, capital will find a way to buy it. They'll lease units temporarily to stack the vote. You think you're beating the owners, but you're just changing what they buy. Astroturfing is easier than buying deeds. How do you prevent developers from manufacturing stake to approve their own projects? You're assuming bad faith only lives in ownership, but it lives in capital."
  *Reply:* "Stake requires duration. You can't buy time instantly. Owners can buy deeds instantly. Time is the one thing capital can't accelerate."
  *Soft Spot:* "Loopholes will emerge quickly; defining 'continuous residence' is legally contestable."

  8. **The Land Value Shock**
  "This spikes land value risk. Uncertainty lowers supply. Investors hate not knowing who votes. If the electorate changes every year based on tenure, underwriting becomes impossible. Land value depends on predictable entitlements. You're introducing volatility into the entitlement process. This increases the cost of capital, which increases the cost of housing. You might help renters, but you hurt overall supply. How do you stabilize land value expectations while changing the voters?"
  *Reply:* "Political stability lowers long-term risk. Current volatility comes from lawsuits. Neighbors who feel heard sue less."
  *Soft Spot:* "Short-term chill is inevitable as the market adjusts to the new rules, potentially freezing building initially."

