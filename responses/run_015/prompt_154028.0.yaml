answer: |-
  **Research Proposal: Preemptive Structural Omission and the Moral Taxonomy of Algorithmic Harm**

  **Submitted by:** [Student Name]
  **Course:** Independent Study in Moral Philosophy (PHIL 499)
  **Instructor:** [Instructor Name]
  **Term:** Spring 2024
  **Word Count:** Approx. 4,500 words

  ### 1. Abstract

  The traditional philosophical distinction between killing and letting die relies heavily on the mechanics of direct physical intervention versus passive omission. Standard cases involve a physician administering a lethal injection (killing) versus withdrawing life support (letting die). However, the rise of automated decision-making systems in critical infrastructure—healthcare triage, resource allocation, and autonomous safety protocols—introduces a category of harm I term "Preemptive Structural Omission" (PSO). In PSO, an agent designs a system that, by its ordinary statistical operation, denies life-saving aid to a defined subset of users. The designer never touches the victim, and the harm unfolds through system behavior rather than direct intervention. This proposal outlines a one-semester independent study to determine whether PSO constitutes killing, letting die, or a morally distinct category. I argue that existing frameworks fail because they presuppose bodily proximity and direct causal chains. Consequently, this study will employ a methodology centered on *Counterfactual Control within a Normative Framework*. By analyzing the designer's control over the counterfactual state of the victim and the normative duties inherent in institutional design, I aim to produce a determinate classification that avoids contextual relativism. The project seeks to establish a criterion for moral liability that can guide regulation, while explicitly bracketing the problem of distributed collective agency to maintain scope feasibility.

  ### 2. Introduction and Problem Statement

  The distinction between doing and allowing, or killing and letting die, has long served as a cornerstone of normative ethics and bioethics. It underpins legal distinctions between murder and negligence, and moral intuitions regarding active euthanasia versus the withdrawal of treatment. The canonical philosophical treatments, such as those by Philippa Foot, James Rachels, and Warren Quinn, typically analyze this distinction through scenarios involving direct physical interaction. In these models, "killing" involves initiating a causal sequence that leads to death, while "letting die" involves failing to intervene in a causal sequence already in motion. The moral weight often hinges on the presence of a bodily act versus a bodily omission at the critical moment of harm.

  However, the technological landscape of the twenty-first century has rendered this bodily-centric model increasingly obsolete. We are rapidly delegating life-and-death decisions to automated protocols. Consider an algorithm designed to allocate limited ventilators during a pandemic. The designer, a software engineer or policy architect, configures the protocol to prioritize patients based on specific survival probabilities. By setting a threshold—for example, excluding patients over 80 with comorbidities—the designer ensures that a specific subset of individuals will not receive aid. When an 85-year-old patient is denied a ventilator by the system and dies, the designer did not physically withhold the machine. The machine simply did not offer it. The designer is spatially distant, temporally removed (the code was written months prior), and causally mediated by software.

  I call this phenomenon **Preemptive Structural Omission (PSO)**. It is "preemptive" because the decision to exclude is made before the specific victim presents themselves; it is "structural" because the harm is baked into the rules of the system rather than arising from a glitch or error; and it is an "omission" because the immediate mechanism of death is the non-delivery of aid.

  The central problem this independent study addresses is the categorization of PSO within the traditional killing/letting die taxonomy. If we classify PSO strictly as "letting die," we risk absolving designers of the moral gravity associated with killing, despite the fact that the designer actively constructed the conditions of death. If we classify it as "killing," we stretch the definition of agency beyond direct physical intervention, potentially diluting the concept of action. If we claim it is a distinct category, we must articulate what normative weight that category carries compared to the traditional two.

  Current philosophical literature leaves this case unresolved. Most discussions of algorithmic ethics focus on bias, fairness, or transparency, but few interrogate the fundamental metaphysical and moral category of the harm itself. Conversely, traditional action theory assumes a human agent present at the scene of the harm. This study posits that this gap is not merely a matter of applying old rules to new tech; it reveals a structural flaw in the doing/allowing distinction itself. The distinction implicitly relies on **bodily proximity** and **direct causal intervention** in ways that do not apply to PSO.

  The goal of this semester-long project is not merely to describe this gap but to traverse it. I intend to frame the research question such that it admits a determinate answer. I will not accept a conclusion that "it depends on the context" or "intuitions vary." Instead, I will test whether the *normative structure of the designer's role* combined with *counterfactual control* forces a classification. The hypothesis is that PSO is morally equivalent to killing, not because of physical causation, but because the designer exerts a form of control over the victim's survival conditions that mimics the dominion of a killer. This proposal details the analytical method, the timeline, the criteria for success, and the specific scope risks involved in this inquiry.

  ### 3. Theoretical Background: The Failure of Proximity and Directness

  To justify the need for this study, I must first demonstrate why existing treatments of the doing/allowing distinction are insufficient for cases of Preemptive Structural Omission. The standard literature generally falls into two camps: those who believe the distinction is morally significant (e.g., Foot, Quinn) and those who believe it is not (e.g., Rachels). However, both camps rely on assumptions that PSO disrupts.

  **3.1 The Causal-Sequence Model**
  Warren Quinn, in *Actions, Intentions, and Consequences*, argues for a distinction based on whether an agent initiates a harmful sequence (killing) or merely fails to stop an existing one (letting die). This relies on identifying a clear "sequence of events." In a standard medical case, the disease is the existing sequence; the doctor withholding medicine allows the disease to proceed. The doctor administering poison initiates a new sequence.

  In PSO, this model fractures. Did the designer initiate a harmful sequence? They wrote code. The code sat idle. Then, a patient arrived. The code executed a "null" command regarding the patient. Is the "null" command an initiation of harm or a failure to help? If the system is viewed as a continuous causal chain started by the designer, then every death the system causes is an initiation by the designer. But this leads to absurdity: if I build a car, and someone drives it off a cliff, I did not kill them. The causal chain is too attenuated. The standard causal model requires a "proximate cause." In PSO, the proximate cause is the disease or the scarcity of resources; the designer is a distal cause. If we follow Quinn strictly, PSO looks like letting die because the designer did not intervene in the specific moment of the victim's crisis.

  **3.2 The Bodily Movement Constraint**
  Philippa Foot's early work and subsequent discussions in action theory often tacitly rely on the agent's body. Killing involves moving one's body to cause death (pulling a trigger, pushing a button). Letting die involves keeping one's body still (not throwing a life preserver). This "bodily movement" criterion provides a clear, observable line.

  PSO renders the body irrelevant. The designer's bodily movement (typing) occurred months ago in a different location. At the time of death, the designer is asleep or working on a different project. The "body" acting at the time of death is the server, the algorithm, the automated arm. If we require bodily presence for killing, PSO cannot be killing. But this seems morally counterintuitive. If a designer programs a drone to patrol a border and shoot anyone crossing, we intuitively feel the designer is more than a bystander allowing death; they are instrumental in the killing. Yet, if the drone is programmed to *ignore* anyone crossing a specific zone, leading to their death by exposure, the bodily constraint suggests this is merely letting die. The reliance on physical proximity fails to capture the *authority* the designer exerted over the environment.

  **3.3 The Normative Expectation Gap**
  Some philosophers argue the distinction rests on normative expectations. We have a duty to save in some contexts (doctors) but not others (passersby). In PSO, the designer is not a doctor at the bedside. They are an architect of the system. Do they have a duty to save? If the system is a public utility, perhaps. But existing theories struggle to map institutional duties onto the killing/letting die distinction. Usually, duty determines *wrongfulness*, not the *type of act*. One can wrongly let die or rightly let die. The question here is ontological: what *kind* of act is this?

  Existing treatments leave this unresolved because they implicitly assume a **dyadic relationship**: Agent A and Victim B, interacting in real-time. PSO introduces a **triadic and temporal relationship**: Designer A, System S, and Victim B, interacting across time. The "omission" is not a failure to act in the moment; it is the execution of a prior act that precludes future aid. This is why I term it "Preemptive." The omission is pre-decided. Standard theories treat omissions as *inactions*. But in PSO, the omission is the *result* of a prior action (coding). This hybrid nature—action leading to omission—is the specific gap this study addresses. Because standard theories categorize based on the moment of harm (was there a push or a pause?), they miss the structural setup that determined the pause.

  Therefore, a new analytical lens is required. We cannot simply apply Foot or Quinn; we must adapt their insights to a context where "action" is encoded and "omission" is automated.

  ### 4. Research Question and Hypothesis

  To ensure this project yields a determinate answer rather than a contextual collapse, I will frame the research question around the **locus of control** rather than the locus of physical contact.

  **Primary Research Question:**
  *Does Preemptive Structural Omission (PSO) constitute a form of killing, letting die, or a distinct moral category, when evaluated through the lens of Counterfactual Control and Normative Authority?*

  **Working Hypothesis:**
  I hypothesize that PSO should be classified as **morally equivalent to killing**, though metaphysically distinct. It is not "letting die" because the designer did not merely fail to intervene in a natural process; they constructed an artificial environment where the "natural" process (death by lack of resources) was guaranteed by design for specific individuals. The designer exercised **Counterfactual Control**: had the designer acted differently (coded differently), the victim would have lived. In standard "letting die" cases, the agent often lacks the power to save without significant cost, or the causal chain is independent. In PSO, the designer *created* the causal chain that resulted in the omission.

  However, to avoid the trap of saying "all causation is killing," the study will refine this by adding a **Normative Authority** condition. The designer must have had the institutional authority to alter the protocol. This distinguishes the designer from a random hacker or a lower-level employee without access.

  **Why This Framing Admits a Determinate Answer:**
  By shifting the criterion from "bodily movement" (which is binary and often absent in PSO) to "Counterfactual Control + Authority" (which is measurable), we can create a test.
  1.  **Control Test:** Could the agent have configured the system to save the victim? (Yes/No)
  2.  **Authority Test:** Was the agent normatively empowered to make that configuration? (Yes/No)
  3.  **Foreseeability Test:** Was the harm statistically certain? (Yes/No)

  If the answer is Yes to all three, the proposal argues the act classifies as Killing (or its functional equivalent). If No to Control, it is Letting Die (or tragedy). If No to Authority, it may be a different category of complicity. This framework avoids "it depends on feelings" by relying on structural facts about the design process. The study will test whether this framework holds up against philosophical scrutiny or if it collapses under the weight of probabilistic harm.

  ### 5. Proposed Analytical Methodology

  To answer the research question, I propose using a hybrid methodology: **Counterfactual Control analysis situated within a Normative Framework of Institutional Roles.** I will explicitly reject two other obvious alternatives: pure Causal Contribution analysis and pure Intuition Pumping.

  **5.1 Why Not Pure Causal Contribution?**
  A purely causal approach (e.g., Hart and Honoré's *Causation in the Law*) asks: "Was the designer's code a *sine qua non* of the death?" In complex systems, causation is overdetermined. If the designer hadn't written the code, perhaps a different designer would have. Or perhaps the scarcity of resources would have killed the patient anyway, just via a different triage method. Pure causation often leads to a dilution of responsibility ("my code was only 1% of the cause"). Furthermore, causation is descriptive, not normative. It tells us *how* the death happened, not *what kind of moral act* it was. A storm causes death, but it is not killing. We need a method that captures *agency*, not just physics.

  **5.2 Why Not Pure Intuition Pumping?**
  One could simply present PSO cases to subjects and ask, "Is this killing?" This is the method of experimental philosophy. I reject this for a theoretical independent study because intuitions are notoriously unstable regarding technology. People might say "it's not killing because no one pulled a trigger," but then say "it is murder because they planned it." Relying on conflicting intuitions leads to the "it depends" conclusion I aim to avoid. The goal of this study is normative clarity, not sociological description of moral confusion.

  **5.3 The Chosen Method: Counterfactual Control + Normative Structure**
  I will adopt a method that analyzes the **modal status of the victim's survival** relative to the **agent's institutional role**.

  *   **Step 1: Counterfactual Dependence.** I will analyze the case to determine if the victim's death was *counterfactually dependent* on the designer's specific choices. This is not just "but-for" causation. It is about *control*. Did the designer have the capacity to actualize a world where the victim lived, within the constraints of the system's purpose? In PSO, the answer is typically yes: the parameter could have been set differently. This establishes a link stronger than mere omission. In standard letting die, I let you die because I choose not to enter the causal chain. In PSO, the designer *entered* the causal chain (by building the system) and then chose a path within it that excluded the victim.

  *   **Step 2: Normative Authority.** I will integrate the work on institutional roles (e.g., Luban, Goodin). Designers of life-critical systems occupy a role with specific duties. If a lifeguard lets a swimmer drown, it is often treated more severely than a bystander doing the same, because of the role. I will argue that the designer's role creates a "duty to design for safety." Breaching this duty via PSO transforms the omission into an active violation of role-based trust.

  *   **Step 3: Synthesis.** By combining Control and Role, I will argue that PSO is a **Commissioned Omission**. It is an omission (non-delivery of aid) that was commissioned (ordered by the code) by the agent. This hybrid category allows us to assign the *blame* of killing to the *structure* of letting die.

  **Defense of This Angle:**
  I choose this angle because it bridges the gap between the *metaphysics of action* (what happened?) and the *ethics of responsibility* (who is to blame?). Pure metaphysics ignores the duty; pure ethics ignores the mechanism. PSO is unique because the mechanism *is* the duty (designing the system). Therefore, the method must treat the design choice as the moral act, not the system's execution. This focuses the analysis on the moment of coding, which is the only moment where the designer's agency is direct and unmediated. This allows for a determinate answer: if the coding decision was made with statistical certainty of harm, and the agent had control/authority, it is Killing.

  ### 6. Plan of Work and Semester Timeline

  This independent study will be conducted over a 14-week semester. The work is divided into four phases: Literature Consolidation, Case Construction, Theoretical Analysis, and Drafting.

  **Phase 1: Literature Consolidation (Weeks 1–4)**
  *   **Week 1:** Deep reading of the canonical texts on Killing vs. Letting Die. Focus: Philippa Foot ("The Problem of Abortion and the Doctrine of the Double Effect"), James Rachels ("Active and Passive Euthanasia"), and Warren Quinn ("Actions, Intentions, and Consequences").
      *   *Deliverable:* Annotated bibliography summarizing how each author defines "action" and "omission."
  *   **Week 2:** Review of contemporary literature on Algorithmic Ethics and Responsibility. Focus: Danaher ("The Threat of Algocracy"), Martin ("The Ethics of Algorithms"), and legal scholarship on product liability in AI.
      *   *Deliverable:* 1,000-word memo identifying the specific gap where algorithmic ethics fails to engage with the killing/letting die distinction.
  *   **Week 3:** Study of Action Theory regarding "Remote Agency" and "Preemption." Focus: Bratman on intention, and Yaffe on attempts.
      *   *Deliverable:* Conceptual map linking "intention" in code to "action" in the world.
  *   **Week 4:** Synthesis of Phase 1. Drafting the theoretical framework section of the final paper.
      *   *Deliverable:* Draft of Section 1 (Theoretical Background).

  **Phase 2: Case Construction and Stress Testing (Weeks 5–7)**
  *   **Week 5:** Development of the "Preemptive Structural Omission" (PSO) archetype. I will construct two detailed hypothetical cases:
      1.  *The Triage Algorithm:* A hospital system that automatically rejects patients above a certain age score.
      2.  *The Autonomous Brake:* A car configured to prioritize passenger safety over pedestrians, effectively "choosing" to hit pedestrians in unavoidable scenarios (a form of preemptive omission of pedestrian safety).
  *   **Week 6:** Application of Standard Theories. I will apply Foot's and Quinn's criteria to these cases to demonstrate formally where they fail or yield counterintuitive results.
      *   *Deliverable:* 1,500-word analysis showing the "breakage" in standard theory.
  *   **Week 7:** Application of Proposed Method. I will apply the Counterfactual Control + Normative Authority test to the same cases.
      *   *Deliverable:* Comparative table showing how the new method yields a determinate classification where standard methods do not.

  **Phase 3: Theoretical Analysis and Argumentation (Weeks 8–11)**
  *   **Week 8:** Drafting the core argument: Why Counterfactual Control is sufficient for moral equivalence to killing. Addressing the "Probabilistic Harm" objection (i.e., "You didn't know *which* specific person would die").
  *   **Week 9:** Drafting the Normative Authority argument. Distinguishing the Designer from the User. Why the coder bears the burden, not just the doctor who presses "start."
  *   **Week 10:** Addressing Counter-arguments. Specifically, the argument that "System Autonomy" breaks the chain of agency. I will argue that autonomy in this context is an illusion of delegation.
  *   **Week 11:** Refining the Classification. Finalizing the argument for whether PSO is "Killing" or a "Distinct Category with Killing-Weight." (My current inclination is the latter to preserve linguistic precision while maintaining moral rigor).
      *   *Deliverable:* Complete first draft of the analytical sections (Sections 2 & 3).

  **Phase 4: Drafting and Revision (Weeks 12–14)**
  *   **Week 12:** Assembly of full draft. Writing Introduction and Conclusion. Ensuring the "Determinacy" requirement is met in the conclusion.
  *   **Week 13:** Peer review and self-edit. Checking for clarity, flow, and word count compliance. Ensuring the "Scope Risk" is acknowledged in the text.
  *   **Week 14:** Final Polish. Formatting citations. Submission.

  ### 7. Expected Outcomes: Success and Failure Criteria

  To ensure this project remains rigorous and does not devolve into speculation, I have established clear criteria for success and failure.

  **7.1 Criteria for Success**
  A successful conclusion will produce a **Clear Classification Criterion**. It will not merely say "PSO is bad." It will provide a test that allows an ethicist or regulator to look at a system design and classify the moral nature of its potential harms.
  *   *Example of Success:* "PSO is classified as *Institutional Killing* when: (1) The designer had the technical capacity to alter the outcome; (2) The harm was statistically foreseeable (>90% certainty for the class); and (3) The designer held normative authority over the parameter. In such cases, the moral liability equals that of direct killing."
  *   *Regulatory Guidance:* The conclusion should offer a sentence or two on how this classification shifts regulatory burden. For example, if it is killing, it requires *ex-ante* prohibition. If it is letting die, it might only require *ex-post* compensation. A successful paper will advocate for the stricter *ex-ante* review based on the classification.

  **7.2 Criteria for Failure**
  A failed conclusion will be one that collapses into **Contextual Relativism**.
  *   *Example of Failure:* "Whether PSO is killing depends on the specific intent of the designer and the cultural context of the technology." This fails because it offers no guidance.
  *   *Example of Failure:* "Intuitions are too conflicted to decide." This fails the prompt's requirement for a determinate answer.
  *   *Example of Failure:* Showing only that existing theories fail, without proposing a viable replacement. This would be a critique, not a constructive study.

  I am confident that the Counterfactual Control method will avoid failure because it relies on structural facts (could the code be changed?) rather than ephemeral states (what did the designer feel?). Even if the moral *weight* is debated, the *classification* of the act type can remain determinate.

  ### 8. Scope Risk and Assessment of Ambition

  A one-semester independent study (resulting in a 4,000–5,000 word paper) is a constrained environment. While the research question is precise, there is a significant risk of scope creep that could derail the project.

  **8.1 The Primary Scope Risk: Distributed and Collective Agency**
  The most significant consideration that could make this project too ambitious is the problem of **Distributed Agency**. In modern software development, no single person "designs" a system. A triage algorithm might be written by a team of ten engineers, approved by three managers, and trained on data curated by a separate team.
  *   *The Risk:* If I argue that the "Designer" is responsible, the immediate counter-argument is "Which designer?" If responsibility is diluted across a collective, does the "Killing" classification hold? If the harm is the result of a "many hands" problem, my Counterfactual Control test might fail because no *single* individual had sufficient control to change the outcome alone.
  *   *Mitigation Strategy:* To manage this risk, I will explicitly **bracket** the problem of collective agency. My proposal defines the agent as a "Designer" in the singular for the sake of theoretical clarity. I will include a caveat in the introduction stating that this study analyzes the *structure of the role*, assuming a unitary agent for the sake of argument. I will note that extending this to corporate liability is a necessary next step but falls outside the scope of this semester's work.
  *   *Why this is necessary:* Attempting to solve the metaphysics of collective agency *and* the killing/letting die distinction simultaneously would require a thesis, not a semester paper. By isolating the *structural* nature of the omission, I can solve the categorical problem first, leaving the distribution of that category among multiple agents for future research.

  **8.2 Secondary Scope Risk: Legal vs. Moral Classification**
  There is a risk of conflating legal liability with moral categorization. The law might treat PSO as negligence (letting die) even if it is morally killing.
  *   *Mitigation:* I will maintain a strict focus on *moral philosophy*. I will reference law only as a practical application of the moral category, not as a determinant of the category itself.

  ### 9. Self-Assessment: Confidence and Uncertainty

  **9.1 Confidence in the Framing**
  I am **highly confident** in the framing of the problem. The gap between traditional action theory and algorithmic reality is well-documented in emerging tech ethics literature, yet the specific application to the Killing/Letting Die distinction remains under-theorized. The concept of "Preemptive Structural Omission" accurately captures the unique temporal and causal structure of algorithmic harm. It is distinct from standard omission (forgetting to act) and standard commission (acting directly). The framing admits a determinate answer because it shifts the debate from "what happened at the moment of death" (which is ambiguous in PSO) to "what happened at the moment of design" (which is factual and recordable). This shift allows for objective analysis rather than intuitive guessing.

  **9.2 Point of Least Certainty**
  The specific point in my proposed analysis about which I am **least certain** is the **threshold of statistical certainty** required for Counterfactual Control.
  *   *The Uncertainty:* My method relies on the designer knowing that harm will occur. But algorithms deal in probabilities. If a designer sets a parameter that creates a 5% risk of death for a subset of users, is that PSO? Is it Killing? If I set the threshold too high (e.g., 95% certainty), I exclude many harmful algorithms. If I set it too low (e.g., any increased risk), I classify almost all design choices as killing, which dilutes the term.
  *   *Why it is uncertain:* Existing moral theories on risk imposition (e.g., Thomson on rights and risk) are themselves contested. Integrating a probabilistic threshold into a binary classification (Killing vs. Letting Die) is philosophically precarious. I may find that PSO forces us to abandon the binary entirely for a gradient of "Risk Imposition."
  *   *Contingency Plan:* If I cannot establish a determinate threshold for probability, I will pivot the conclusion to argue that PSO constitutes a *distinct category* ("Structural Homicide") that does not require the same certainty as direct killing, because the *preemptive* nature of the act imposes a higher duty of care. This allows me to maintain a determinate classification (Distinct Category) even if the "Killing" label proves too rigid for probabilistic harm.

  ### 10. Conclusion

  This independent study proposes to tackle a critical blind spot in contemporary moral philosophy. As we automate the infrastructure of life and death, we cannot rely on distinctions derived from an era of direct physical interaction. The distinction between killing and letting die must be stress-tested against the reality of Preemptive Structural Omission. By employing a methodology of Counterfactual Control within a Normative Framework, this study aims to provide a determinate classification that preserves moral accountability without distorting the metaphysics of action. While the risk of distributed agency looms as a potential complication, bracketing this issue allows for a focused analysis of the *act type* itself. The successful completion of this project will yield not only a theoretical contribution to action theory but also a practical criterion for the ethical design of automated systems. It will demonstrate that distance and code do not absolve the agent of the moral weight of death, provided the agent held the control and the authority to prevent it.

