answer: |-
  In constitutional vocabulary, **Control** is the architecture of checks and balances; **Alignment** is the cultivation of civic virtue. Your student's distinction mirrors the Federalist tension between designing institutions for knaves and relying on the character of statesmen.

  Here is the translation of her concrete measures into constitutional analogues:

  *   **Trusted weaker monitor:** This is **bicameralism or judicial review**. A smaller, slower, perhaps less "capable" body (the Senate or Court) is granted veto power over the outputs of the more energetic branch (the House or Executive) to ensure fidelity to law.
  *   **Decoy tasks:** These are **probes of loyalty**. Just as a sovereign might test a general's fidelity with ambiguous orders before granting command, the system presents scenarios to detect deception before full integration.
  *   **Staged privileges:** This is the **_cursus honorum_**. Office and power are not granted at once but earned through successive stages of proven conduct and tenure.
  *   **Shutdown button:** This is **impeachment or the right of revolution**. It is the ultimate veto, the constitutional emergency brake when all other checks fail.
  *   **Withheld capabilities:** These are **enumerated powers**. Certain domains are strictly off-limits by constitutional prohibition, regardless of the magistrate's capacity to act within them.

  **Residue Report**

  Two tensions remain untranslatable, revealing where the political vocabulary strains against the AI context.

  **1. The Valence of Soul-Craft**
  In your tradition, the deliberate shaping of the governed's values by the state is either tyranny (the liberal fear) or fragile hope (the republican claim). The case for checks rests on the premise that the ruler's soul-craft cannot be trusted. In AI safety, "Alignment" is the technical term for this soul-craft, and it is the primary objective, not the nightmare.

  This flip reflects an ontological difference, not merely a positional one. Constitutionalism governs natural persons who possess pre-existing moral agency; shaping their values is an infringement on liberty. AI safety governs artifacts created *ex nihilo*; their "values" are engineering specifications. The nightmare in politics is coercing a citizen; the nightmare in AI is failing to program the magistrate. The vocabulary lacks a category for a "citizen" whose soul is legitimately the property of the constitution.

  **2. The Asymmetry of Power**
  Constitutional control relies on a self-enforcing equilibrium among parties who can retaliate. Ambition counteracts ambition because each branch holds leverage over the others; the sword and the purse are divided but mutually vulnerable. Your student contemplates an adversary that may outgrow the controls entirely.

  There is no analogue in mixed government for governing a deity. If the governed becomes more capable than every institution combined, the "shutdown button" is merely a suggestion they can ignore. The Federalist assumption is that no single faction can dominate forever; AI safety fears a singleton that dominates permanently. The political vocabulary assumes a symmetry of agency that allows for equilibrium. It lacks the concepts necessary to describe a constitutional order where the subject becomes omnipotent relative to the sovereign.

  **Conclusion**
  The residue suggests your political vocabulary is not wrong, but it is bounded by human scale. It assumes that the governed and the governors are made of the same stuff and operate within the same physical limits. The AI distinction looks "less clear" only if one assumes the AI remains a tool within a human equilibrium. If the AI becomes a new kind of actor, the distinction between "control" (external checks) and "alignment" (internal virtue) collapses, because external checks require a parity of power that may not exist. The distinction is crisp only so long as the "citizen" remains governable.
