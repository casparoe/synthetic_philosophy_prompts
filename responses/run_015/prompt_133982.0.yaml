answer: |-
  # Simulation: The Stage and the Square
  **Time:** 80 Minutes
  **Class Size:** 16 Grad Students
  **Goal:** Embodied understanding of Rousseau's *Letter to d'Alembert* (Theater vs. *Fête Publique*).

  ## I. Setup &分组 (10 Minutes)

  **The Premise:** Tell the class they are the governing council of a small republic. They must make a binding decision on a civic dilemma: **"The Wall Tax."**
  *   **The Issue:** A defensive wall is needed. It costs 100k. Should the top 10% of wealth holders be taxed 50% of their assets to fund it?
  *   **The Stakes:** The decision is final.

  **The Groups (Round 1):**
  1.  **The Players (4 students):** They receive a script outline. They are on a raised platform (the Stage).
  2.  **The Spectators (9 students):** They sit in fixed rows facing the Stage. They receive "Virtue Cards" and a scorecard.
  3.  **The Festival Citizens (3 students):** They are sent to a corner of the room with their backs to the Stage. They stand in a circle. No props.

  **The Currency: "Esteem Tokens"**
  *   Use poker chips or slips of paper.
  *   **Spectators:** Start with 5 tokens. They *lose* a token if they speak out of turn. They *gain* a token every time they hold up a Virtue Card in unison with the majority. (Incentivizes conformity and passive approval).
  *   **Players:** Gain tokens based on how many Virtue Cards are raised by the Spectators. (Incentivizes emotional manipulation over logical resolution).
  *   **Festival:** No tokens. Their only reward is the decision itself.

  ---

  ## II. Round 1: The Theater Trap (35 Minutes)

  **The Rules (Read Aloud):**
  1.  **Spectators:** You may not speak. You may not move from your seat. You vote by secret ballot *after* the performance. Your goal is to maximize your Esteem Tokens.
  2.  **Players:** You have 10 minutes to perform a scene depicting the debate over the Wall Tax. You must present both sides, but you must make the "Virtuous Choice" (Tax the Rich) emotionally stirring.
  3.  **Festival:** You have 10 minutes to reach a consensus on the Wall Tax. No script. No audience. You simply decide.

  **The Twist (Hidden from Spectators):**
  The Play *is* the Deliberation. The arguments the Actors make are the *only* arguments the Spectators will hear before voting. The Spectators are voting on the *exact same issue* the Actors are pretending to debate.

  **The Action:**
  *   **T-Minus 10:** Festival Citizens huddle in the corner. Spectators sit rigidly. Players ascend the stage.
  *   **The Performance:** The Players act out a scene. A "Wealthy Merchant" argues against the tax (self-interest). A "Poor Soldier" argues for the tax (civic duty). The Soldier gives a stirring speech about sacrifice.
  *   **The Trap:** At the climax, the Soldier looks directly at the Spectators and says, *"Would you not agree that true citizenship requires sacrifice?"*
  *   **The Incentive Kick:** The Instructor (Facilitator) signals: *"If you believe this is virtuous, raise your Virtue Card now to gain Esteem."*
      *   *Rousseauian Mechanism:* Spectators rush to raise cards to gain tokens and be seen as "good" by their peers. They feel a rush of moral satisfaction (*amour-propre*) without having weighed the economic cost.
  *   **The Vote:** Players finish. Spectators immediately cast a secret ballot on the Wall Tax. Festival Citizens announce their decision.

  **Predicted Outcome:**
  *   **Spectators:** Will likely vote "Yes" (Tax the Rich). They will feel they have already participated by emotionally endorsing the virtue on stage. They will feel satisfied but tired.
  *   **Festival:** Will likely struggle more. Without a script, they have to talk over each other. They might vote "No" or "Yes with modifications." They will feel frustrated but "heard."
  *   **Players:** Will feel powerful but detached from the consequence.

  ---

  ## III. Round 2: The Rotation (35 Minutes)

  **The Shift:**
  Rotate the roles completely.
  *   **Old Spectators** $\rightarrow$ **Festival Citizens** (Now they must decide without a stage).
  *   **Old Festival** $\rightarrow$ **Players** (Now they must script the emotion).
  *   **Old Players** $\rightarrow$ **Spectators** (Now they sit and feel the passivity).

  **The New Dilemma:** "The Park Cleanup." Should mandatory community labor be required to clean the public park?

  **The Change in Rules (The Reveal):**
  *   Tell the new **Spectators**: *"You gain tokens for speaking up."* (Wait, no—keep the rules identical to Round 1 to maintain the structural critique. Do not change the rules yet. Let them feel the same constraint).
  *   **Instruction:** Run the simulation exactly as before. Same constraints. Same token economy.
  *   **The Intervention:** At the 25-minute mark, stop the simulation.
  *   **The "Fête" Break:** Tell *everyone* to stand up. Push chairs aside. No stage. No tokens. No script. Spend the remaining 10 minutes deciding the Park Cleanup as one single body.
      *   *Goal:* Break the fourth wall. Force the "Spectators" to speak. Force the "Players" to listen.

  ---

  ## IV. Debrief: Mapping the Bones (20 Minutes)

  Do not ask "What did you think?" Ask "What did you feel?"

  **1. The Substitution of Virtue (10 Mins)**
  *   **Ask the Spectators (Round 1 & 2):** "When you raised your Virtue Card, did you feel you had contributed to the decision?"
      *   *Rousseau Point:* This is the corruption. You applauded the *image* of sacrifice and felt it counted as *actual* sacrifice. You consumed morality rather than practicing it.
  *   **Ask the Spectators:** "Did the Play frame the question in a way you couldn't challenge?"
      *   *Rousseau Point:* In theater, the framing is fixed. In a republic, the framing must be mutable by the citizen.

  **2. Active Presence vs. Passive Identification (5 Mins)**
  *   **Ask the Festival Citizens:** "How did it feel in the corner? Did you feel more or less confident in the decision than the Spectators?"
      *   *Rousseau Point:* The *Fête Publique* has no spectators. Everyone is a participant. The joy comes from the *activity* of the collective, not the *representation* of the collective.
  *   **Ask the Group after the 'Fête Break':** "How did the energy change when the chairs moved?"
      *   *Rousseau Point:* Physical proximity creates moral proximity. The stage creates a gap; the circle closes it.

  **3. The Limits of the Simulation (5 Mins)**
  *   **Be Frank:** Acknowledge what this exercise *cannot* reproduce.
      *   **Gender & Luxury:** Rousseau's specific anxiety about actresses (women in public display) and the luxury of the theater building itself cannot be simulated here. We are not replicating 18th-century Geneva's anxiety about moral decay via female visibility.
      *   **Scale:** This works with 16 people. Rousseau worried about this in a city of thousands.
      *   **The "Good" Play:** We made the play morally uplifting. Rousseau argues *even Molière* corrupts, not because the lesson is bad, but because the *structure* of watching is passive. Did you feel that? Even when the 'Soldier' was right, was the *relationship* wrong?

  ---

  ## V. Troubleshooting: What Will Go Wrong

  **1. Spectators Refuse to be Passive**
  *   **The Risk:** Grad students are argumentative. They will shout out during the play.
  *   **The Fix:** Be the "Stage Manager." If a Spectator speaks, calmly deduct a token. Say: *"The structure requires your silence to function. Please save your critique for the debrief."* This friction *is* the lesson (the structure silences the citizen).

  **2. Players Improvise the Solution**
  *   **The Risk:** The Actors solve the problem in the skit, rendering the Spectator vote moot.
  *   **The Fix:** Give the Actors a "Closed Ending" instruction. *"You must end on a question, not an answer. You must leave the decision to the voters."*

  **3. Cynicism About Tokens**
  *   **The Risk:** Students laugh at the "Esteem Tokens" and refuse to play along.
  *   **The Fix:** Lean into the absurdity. *"Rousseau thought social esteem was the currency of corruption. Treat the chips as your public reputation. If you leave with zero, you are a civic outcast."* Make the social pressure real.

  **4. The Festival Group Finishes Too Fast**
  *   **The Risk:** The 3 Festival citizens decide in 2 minutes and sit around.
  *   **The Fix:** Give them a "Consensus Constraint." *"You cannot vote. You must all physically shake hands on the decision. If one person dissents, you have failed."* This forces the deliberation Rousseau values.

  **5. Time Creep**
  *   **The Risk:** The Debrief eats the simulation time.
  *   **The Fix:** Use a visible timer. When the Round 1 timer hits zero, cut the Actors off mid-sentence. *"The Republic does not wait for the play to end."* This reinforces the priority of civic time over theatrical time.

  ## Instructor's Cheat Sheet: The Rousseauian Map

  | Simulation Moment | Rousseau's Concept | The "Bone" Feeling |
  | :--- | :--- | :--- |
  | **Sitting in rows, unable to speak** | **Passivity** | Physical frustration; the body is restrained while the mind is stimulated. |
  | **Raising the Virtue Card for tokens** | **Amour-Propre** | The urge to be *seen* being good, rather than *doing* good. |
  | **Voting after watching the Skit** | **Representation** | Confusing the map (the play) for the territory (the law). |
  | **Festival Circle (No Stage)** | **Fête Publique** | Awkward intimacy; the burden of speech is on you, not a performer. |
  | **Moving Chairs for Final Vote** | **Presence** | The dissolution of the "Fourth Wall"; the space becomes political, not aesthetic. |
