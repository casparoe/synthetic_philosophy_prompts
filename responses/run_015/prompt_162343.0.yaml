prompt: |-
  So I got voluntold to run Friday's methods hour in my lab — 45 minutes, maybe twelve people, mostly computational but a few wet-lab folks, all of whom say "Bayesian" to mean "we put a prior on a parameter and updated it" and most of whom have personally written down a likelihood at some point. Topic I picked is the problem of old evidence: the argument that if you already knew E with certainty before a new theory came along, then Bayes' rule can't let E confirm that theory, because P(E) is 1 and the posterior just collapses back onto the prior. Don't explain it to me — I need a plan for how I explain it to them, and I think the order matters more than anything else here.

  What I want from you:

  - What has to be on the table before the problem even looks like a problem. I suspect it's something about the difference between the theory entailing E and my having learned that it entails E, but tell me where in the sequence that belongs and what has to come before it.
  - One carrying example. I don't want the perihelion-of-Mercury chestnut with this crowd; I want something from their own work. We have a result that's been sitting in our own data for about six years, everyone in the field already believes it, nobody has had a mechanism for it — and we also have a rival model that was fitted to that same result after the fact. Tell me which of those two cases to build the whole thing on, and what the example has to have and has to lack in order to do the work. I think one requirement is that the new hypothesis wasn't built to fit the evidence, and another is that the old theory doesn't entail it, but I'm not sure either is quite right.
  - The misconceptions, in the order they'll actually raise them. The ones I'm braced for: "just pretend you forgot the evidence and put a number on it"; "the real fix is that prediction beats accommodation, so all this shows is that accommodation doesn't confirm" (which I think is a dodge rather than a solution?); "our priors already had it baked in, so nothing is lost"; "we'd just compare Bayes factors". Where in the sequence do I head each one off, and is there one I should let them say out loud first because it sets up the next move?
  - What the two live candidate fixes actually are and how much of each to give at this level. One of them, as I understand it, updates on the fact that the theory implies the evidence rather than on the evidence itself; the other is some kind of counterfactual "what would you have assigned before you knew it". Which do I lead with for this crowd, which do I name and drop, and what do I flat out refuse to derive in 45 minutes.
  - One question for the end that tells me whether they actually got it rather than just nodded — ideally something they'd answer differently if they're still stuck on "unlearn the evidence".

  Constraints: nothing on a slide worse than a fraction, and please don't hand me a reading list, nobody will read it. Also assume half of them are checking email and one person is going to try to turn this into a discussion about p-values if I give him an opening.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 45-minute lesson plan on the "Problem of Old Evidence" (PoE) in Bayesian confirmation theory.
      *   **Audience:** Lab group (12 people), mostly computational, some wet-lab. Familiar with basics (priors, likelihoods, updating) but pragmatic ("Bayesian = prior + update").
      *   **Constraints:** No complex math on slides (fractions max), no reading list, keep attention (email checkers), avoid p-value derailment.
      *   **Key Deliverables:**
          1.  Prerequisites/Sequence (what must be on the table first).
          2.  Carrying Example (internal lab data, not Mercury).
          3.  Misconception Management (order and handling).
          4.  Candidate Fixes (which to lead with, depth).
          5.  Closing Question (assessment of understanding).
      *   **Tone:** Practical, strategic, authoritative but collaborative (it's a lab meeting).

  2.  **Deconstruct the Problem of Old Evidence (PoE):**
      *   *The Core Issue:* Bayes' Theorem: $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$. If $E$ is known with certainty *before* $H$ is proposed, $P(E) = 1$. If $H$ entails $E$, $P(E|H) = 1$. Then $P(H|E) = P(H)$. No confirmation occurs.
      *   *The Intuition:* But surely discovering $H$ explains $E$ *does* increase our confidence in $H$, even if $E$ was known.
      *   *The Tension:* Static probability vs. Dynamic learning.

  3.  **Drafting Section 1: Prerequisites & Sequence:**
      *   *What needs to be established?* The definition of confirmation (change in probability), the status of $P(E)$, and the distinction between *logical entailment* and *psychological realization*.
      *   *Sequence:*
          1.  Define Confirmation (Posterior > Prior).
          2.  Establish the "Old" status ($P(E)=1$).
          3.  Establish the "Entailment" ($P(E|H)=1$).
          4.  Show the Collapse ($P(H|E) = P(H)$).
          5.  *Crucial Step:* Distinguish between $E$ being true vs. $H$ entailing $E$. The learning event isn't $E$, it's the connection $(H \to E)$.
      *   *Placement:* The distinction between "Theory entails E" and "I learned Theory entails E" must come *immediately after* showing the collapse, as the pivot to the solution.

  4.  **Drafting Section 2: Carrying Example:**
      *   *Constraint:* Internal lab data, 6 years old, everyone believes it, no mechanism, rival model fitted after the fact.
      *   *Choice:* Do we use the *existing result* (Old Evidence) or the *rival model* (New Theory)?
      *   *Strategy:* We need the *Existing Result* to be the $E$ (Old Evidence) and a *New Mechanistic Model* (let's call it $H_{new}$) to be the hypothesis.
      *   *Requirements:*
          *   $E$ must be treated as fixed/certain ($P(E) \approx 1$).
          *   $H_{new}$ must *not* have been tuned to $E$ (to avoid "curve fitting" accusations).
          *   $H_{old}$ (status quo) must *not* entail $E$ (otherwise $E$ was never a puzzle).
      *   *Decision:* Build it on the **New Mechanistic Model explaining the Old Result**.
      *   *Why:* If we use the rival model fitted *to* the result, it looks like overfitting. We need a model that *predicts* the old result structurally without being tuned to it.
      *   *What it needs:* A structural constraint that forces the old result to emerge.
      *   *What it lacks:* Tuning parameters specifically for that result.

  5.  **Drafting Section 3: Misconceptions:**
      *   *Anticipated Objections:*
          1.  "Just pretend you forgot" (Garber-style counterfactual).
          2.  "Prediction > Accommodation" (Predictivism).
          3.  "Priors baked it in" (Subjective Bayesianism).
          4.  "Bayes Factors" (Model comparison dodge).
      *   *Order & Handling:*
          1.  *Let them say:* "Prediction > Accommodation." This validates their intuition but highlights the formal gap. Use this to motivate the need for a formal fix.
          2.  *Head off early:* "Bayes Factors." This is a category error for PoE (BFs still need likelihoods where $P(E)=1$ causes issues).
          3.  *Address during solutions:* "Pretend you forgot" (This is actually one of the solutions, so don't dismiss it, refine it).
          4.  *Dismiss:* "Priors baked it in." (If priors accounted for it, why didn't we believe the theory sooner?)
      *   *Strategy:* Let the "Prediction" objection land first. It's the most natural. Then show why Bayes' Rule *as written* doesn't capture it.

  6.  **Drafting Section 4: Candidate Fixes:**
      *   *Option A:* Garber/Jefferies (Update on $H \to E$, not $E$).
      *   *Option B:* Counterfactual/Temporal (What was $P(H)$ before $E$ was known?).
      *   *Decision for Comp Bio Crowd:* Lead with **Option A (Update on the entailment relation)**. It's more computational/structural. It fits "we wrote down a likelihood."
      *   *Depth:* Explain the logic, don't derive the math. Name-drop "Garber" for the curious.
      *   *Refuse:* Do not derive the specific probability calculus for $P(H \to E)$. It gets messy. Do not dive into "Ur-priors" (Option B) too deeply; it's too philosophical for a methods hour.

  7.  **Drafting Section 5: Closing Question:**
      *   *Goal:* Distinguish between "unlearning E" and "learning H->E".
      *   *Scenario:* If we treat $E$ as uncertain again, we break the "Old Evidence" constraint.
      *   *Question:* "If we set $P(E) = 0.9$ just to make the math work, what did we actually change about our state of knowledge?"
      *   *Better Question:* "Does the confirmation come from the data ($E$) or from the code ($H \to E$)?"
      *   *Best Question:* A specific scenario about the lab example. "If I run the simulation again and get $E$ exactly, does my confidence in $H$ go up *again*?" (Answer: No, because the entailment is already learned).

  8.  **Review and Refine:**
      *   *Time Check:* 45 mins.
          *   Intro/Setup: 10 min.
          *   The Problem (Math light): 10 min.
          *   The Example: 10 min.
          *   Fixes: 10 min.
          *   Q&A/Close: 5 min.
      *   *Tone Check:* Keep it punchy. Avoid philosophical jargon where possible. Use "Lab Speak."
      *   *P-value Trap:* Explicitly frame Bayes as "belief updating" not "significance testing" to avoid the p-value guy.
      *   *Slide Constraint:* Keep math to $P(H|E) = P(H)$.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Example:* The prompt says "rival model that was fitted to that same result after the fact." I need to be careful. If the rival model was *fitted* to the result, it *is* accommodation. The prompt asks which case to build on. I should build on the **New Mechanistic Model** (the one that *wasn't* built to fit, per the prompt's hint: "I think one requirement is that the new hypothesis wasn't built to fit the evidence"). I need to clarify that distinction. The "rival model fitted after the fact" is the *bad* example to contrast with the *good* example (the mechanistic one). Actually, re-reading: "We have a result... nobody has had a mechanism... and we also have a rival model that was fitted to that same result after the fact."
      *   *Decision:* Use the **Mechanism** as the Hypothesis ($H$) and the **Result** as the Evidence ($E$). Ignore the "fitted rival model" or use it as a foil for "overfitting vs. explanation." The prompt asks "Tell me which of those two cases to build the whole thing on." I must choose. Building it on the *fitted model* makes PoE look like overfitting. Building it on the *mechanism* makes PoE look like discovery. Choose the **Mechanism**.
      *   *Wait, one nuance:* The prompt says "I think one requirement is that the new hypothesis wasn't built to fit the evidence." This confirms I should use the Mechanism, not the fitted rival.
      *   *Refining the "Fix":* For computational folks, the "Update on $H \to E$" is essentially "Update on the simulation output matching the data." I need to make sure they don't confuse running the sim (generating $E$) with learning the logical connection.
      *   *Closing Question:* Needs to be sharp. "If $P(E)=1$, what term in the equation actually moved?"

  10. **Finalizing the Plan Structure:** (Aligning with prompt requirements)
      *   Sequence/Prerequisites.
      *   Example Selection.
      *   Misconception Order.
      *   Fixes (Lead with Entailment).
      *   Closing Question.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the battle plan for your 45 minutes. The goal is to keep the math trivial, the example visceral, and the p-value guy contained.

  ### 1. The Sequence: What Must Be on the Table
  You cannot present the problem until you have established a specific, slightly rigid definition of "confirmation." If you let them define confirmation loosely as "feeling more sure," the problem vanishes.

  **The Order of Operations:**
  1.  **Define Confirmation Strictly:** Confirmation *is* a change in probability. $P(H|E) > P(H)$. If the probability doesn't move, you haven't confirmed anything, regardless of how good the story sounds.
  2.  **Establish the "Old" Status:** $E$ (the lab result) is known. In the Bayesian bookkeeping, $P(E) = 1$. It is not a random variable anymore; it is a constant.
  3.  **Establish the Entailment:** The new theory ($H$) structurally requires $E$. Therefore $P(E|H) = 1$.
  4.  **Show the Collapse:** Plug those two 1s into Bayes' Rule. The fraction becomes 1. The posterior equals the prior.
  5.  **The Pivot (Crucial):** Only *after* showing the collapse do you introduce the distinction between **$E$ is true** and **$H$ entails $E$**.
      *   *Where it belongs:* This is the bridge between "The Problem" and "The Fix."
      *   *Why:* If you introduce this too early, they won't feel the paradox. They need to feel the math break first. The realization is: *We didn't learn $E$ (we knew that). We learned the connection $(H \to E)$.*

  ### 2. The Carrying Example
  **Do not use the rival model that was fitted to the result.**
  If you use the model that was fitted after the fact, the group will correctly identify that as overfitting or tuning, and the philosophical point will get swallowed by a discussion on cross-validation.

  **Use the New Mechanistic Model.**
  *   **The Evidence ($E$):** The 6-year-old result everyone believes (e.g., a specific spike in expression, a specific topological feature in the network).
  *   **The Hypothesis ($H$):** The new mechanistic model that *was not* tuned to produce that spike, but produces it as a necessary consequence of its structure.
  *   **Why this works:** It isolates the *explanatory power* from the *fitting procedure*.
  *   **Requirements:**
      *   **Must Have:** A structural constraint in $H$ that forces $E$ to appear without parameter tuning. (e.g., "If this feedback loop exists, this oscillation *must* happen.")
      *   **Must Lack:** Any free parameters adjusted specifically to minimize error on $E$.
  *   **The Narrative:** "We all know $E$ is real. We didn't need $H$ to tell us $E$ exists. But $H$ tells us *why* $E$ exists. Bayes' rule as written says that shouldn't increase our confidence in $H$. That feels wrong."

  ### 3. Misconception Management
  Here is the order they will raise these, and how you handle them without losing the room.

  1.  **"Prediction beats accommodation." (Let this land first)**
      *   *When:* Immediately after you show the collapse.
      *   *Action:* Let them say it. It's the intuitive fix.
      *   *Your Move:* Agree, but point out it's a *heuristic*, not a *derivation*. "You're right intuitively. But show me the term in the equation that captures 'prediction vs. accommodation.' It's not there. That's why this is a problem for the math, not just our intuition."
  2.  **"Just compare Bayes Factors." (Head this off early)**
      *   *When:* During the setup.
      *   *Action:* Shut it down gently. "Bayes Factors compare two hypotheses. The Problem of Old Evidence breaks the calculation for *both* of them if $P(E)=1$. It's a denominator issue, not a model comparison issue."
  3.  **"Our priors already had it baked in."**
      *   *When:* During the solutions.
      *   *Action:* Dismiss. "If the prior already accounted for the mechanism, we would have believed the mechanism six years ago. We didn't. The prior moved *after* we saw the connection."
  4.  **"Just pretend you forgot the evidence." (The Counterfactual)**
      *   *When:* During the solutions.
      *   *Action:* This is actually one of the valid fixes (see below). Don't dismiss it, but frame it as "computationally expensive" (requires reconstructing a past state of ignorance).

  ### 4. The Two Live Candidate Fixes
  You have 45 minutes. Do not derive either. Describe the *move* each one makes.

  **Lead With: The "Entailment Update" (Garber-Style)**
  *   **The Pitch:** "We don't update on $E$. We update on the proposition that '$H$ implies $E$'."
  *   **Why for this crowd:** It treats the logical connection as new data. It fits computational thinking: the "data" isn't the wet-lab result, the "data" is the output of the simulation showing the match.
  *   **Depth:** Explain that we assign a probability to the statement $(H \to E)$. We were uncertain if the model actually produced the result until we ran the math/code. *That* discovery is what gets updated.
  *   **Slide Math:** Change the update event from $E$ to $(H \to E)$.

  **Name and Drop: The "Counterfactual/Ur-Prior"**
  *   **The Pitch:** "Calculate what your prior *would have been* before you knew $E$, update on $E$, then fast-forward to now."
  *   **Why:** It saves standard Bayes' rule.
  *   **Depth:** Minimal. Just mention it requires time-traveling your belief state. "It works, but it's annoying to code."

  **What to Refuse:**
  *   Do not derive the specific probability calculus for $P(H \to E)$. It gets into logical omniscience issues that will burn 20 minutes.
  *   Do not allow a discussion on "Objective Priors." That is a black hole.

  ### 5. The Closing Question
  You need to know if they understand that the *learning event* has shifted from the data to the model structure.

  **The Question:**
  > "If I run the simulation for hypothesis $H$ tomorrow, and it produces result $E$ again, does my confidence in $H$ go up *again*?"

  **The Correct Answer:**
  > "No. The first time, I learned that $H$ entails $E$. That was the update. Running it again is just checking arithmetic. $P(H \to E)$ is now 1."

  **The "Stuck" Answer (Unlearning Evidence):**
  > "Yes, because every replication adds weight." (This implies they think we are still updating on $E$, not on the entailment).
  > *OR*
  > "No, because $P(E)$ is still 1." (This implies they think the problem is unsolvable).

  ### Logistics & P-Value Containment
  *   **Slides:** Max one equation per slide. $P(H|E) = P(H)$. That's the only math they need to see to feel the pain.
  *   **The P-Value Guy:** He will try to say "This is why p-values are better because..."
      *   **Pre-empt:** "We are discussing belief updating in a single agent, not long-run error rates. P-values don't have priors, so they don't have this specific problem, but they also don't give us $P(H|E)$. We're staying in Bayesian land for this hour."
  *   **Timing:**
      *   0-10: Setup & Definition of Confirmation.
      *   10-20: The Collapse (The Math) & The Lab Example.
      *   20-30: Misconceptions (The "Prediction" dodge).
      *   30-40: The Fixes (Entailment vs. Counterfactual).
      *   40-45: Closing Question & Wrap.

  This keeps the focus on the *bookkeeping of belief*, which is where your computational folks live, rather than the philosophy of science, which is where the discussion dies.
