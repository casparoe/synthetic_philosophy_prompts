answer: |-
  Based on the verdicts you have catalogued, M is not running a materialist definition of collapse (complexity loss), nor a purely humanitarian one (suffering), nor even a strictly narrative one (what people call it). There is a tension in her rulings, but the USSR verdict is the key that unlocks the cipher.

  ### 1. The Real Rule: The Horizon of Expectation
  The rule doing the work in M's verdicts is **Teleological Continuity**.

  M defines collapse not as the loss of things, but as the **termination of a specific project of time**. It is about whether the society in question can still project a coherent "future" that is recognizably continuous with its "past."

  *   **Why this fits the inconsistencies:**
      *   **Rome vs. USSR:** Rome is "not collapse" because the *project* of Rome (law, citizenship, eventually Christendom) survived the political fracture; the future remained legible to the people living in it. The USSR is "collapse" because the *project* (Communism/The Soviet Future) vanished, even if the ministries remained. The archives were kept, but the *reason* for keeping them changed fundamentally.
      *   **Inca vs. Greenland:** The Inca state was conquered, but the Andean social project (ayllu, reciprocity, lineage) continued and adapted under Spanish rule. The Norse Greenlanders, conversely, held onto a specific project (European Christian identity) that became untenable in the Arctic; when they refused to adapt the project (e.g., to Inuit hunting methods), the project died with them.
      *   **Mesa Verde vs. Mycenae:** Mesa Verde is "not collapse" because the Pueblo people narrate the departure as a migration within a continuous cultural timeline. Mycenae is "collapse" because the specific palace-centric project vanished and was not claimed by successors for centuries.

  **The Rule:** If the participants can envision a future that validates their past, it is transformation (Not Collapse). If the future becomes unintelligible within the terms of the past, it is Collapse.

  ### 2. Verdict on the Coastal Town
  **M will say: Not Collapse.**

  *   **Prediction:** She will argue that while material complexity decreased (fewer institutions, less energy flow), the *social project* did not end. The town has a published plan to 2050. They have a horizon of expectation. They narrate this as "adaptation" or "resilience," not "ending."
  *   **Why:** This fits the USSR/Rome axis. The USSR lost the future; this town has explicitly planned one. It fits the Mesa Verde axis. They are moving physically to preserve the community socially.
  *   **Closest Analog:** **Mesa Verde.** Both involve voluntary relocation to preserve a way of life. In both cases, the "debris" looks like abandonment to an outsider, but the participants frame it as continuity.

  ### 3. The Discriminating Case
  You need a case that separates **Narrative** (what people say) from **Teleology** (whether a future is actually possible/planned).

  Your candidate ("Nothing material falls apart... but everyone involved says their world ended") is strong, but it conflates *feeling* with *planning*. To truly separate the rules, you need a case where the **Narrative says "End," but the Future Project continues.**

  **The Case:** **The Meiji Restoration (Japan, 1868).**
  *   **Material:** Bureaucracies and buildings largely remained; no foreign conquest.
  *   **Narrative:** The participants explicitly narrated an "End" (The End of the Shogunate, the End of the Samurai era, "Restoration" implying a break).
  *   **Future:** A highly specific, robust, state-driven plan for the future (Industrialization, Imperial expansion) was immediately implemented.
  *   **The Test:** If M calls this **Collapse**, she is prioritizing the *Narrative of Ending*. If she calls it **Not Collapse** (Transformation), she is prioritizing the *Continuity of the Future Project*. Given her USSR verdict, she should call it **Not Collapse**, because the Japanese state successfully projected a new future that absorbed the past. If she wavers here, her "Future" rule is actually just a "Revolution" rule.

  ### 4. The Flatmate Question: Society or Evidence?
  If a future archaeologist sees collapse (pots and foundations show complexity loss) but the people living through it do not (they feel continuous), M's framework dictates that **collapse is something that happens to a society's time, not its evidence.**

  For M, collapse is **phenomenological**, not stratigraphic.

  *   **Reasoning:** Her "Not Collapse" verdicts on Rome and Mesa Verde rely entirely on the fact that the people *carried something forward* that the archaeologist might miss if they only looked at the abandonment layer. Her "Collapse" verdict on the USSR relies on a shift in imagination that leaves almost no material trace compared to the continuity of concrete buildings.
  *   **The Trap:** This makes her definition vulnerable. If collapse is defined by the "imaginable future," it becomes unfalsifiable in the archaeological record. You cannot dig up a "future." You can only dig up the *failure* of a future.
  *   **The Answer:** Tell your flatmate that for M, collapse is an **intersubjective event**. It happens in the space between the evidence and the expectation. If the evidence says "break" but the expectation says "bridge," M sides with the bridge. If the evidence says "continuity" (USSR buildings) but the expectation says "break" (End of Communism), M sides with the break.

  **Summary for your chapter:** M is arguing that collapse is the **death of a specific timeline**. Your coastal town is buying a new timeline, not ending the old one. Therefore, it is adaptation. Be careful, though: if you push this too hard, you risk making "collapse" synonymous with "pessimism," which might undermine the material reality of the complexity loss she admits is happening.
