answer: |-
  **Module:** Political Philosophy and Relational Ethics
  **Level:** Upper-Level Undergraduate / Postgraduate
  **Assessment:** Final Examination Essay

  ***

  ### Examination Question

  In a jurisdiction that formally recognises customary law, an elder asserts that a deceased community member's estate must be distributed according to obligations of reciprocal care rather than individual testamentary freedom. The elder argues that the deceased was never an autonomous proprietor but a node in a network of living kin and ancestors.

  Critically analyse how an Ubuntu-informed relational conception of personhood — the idea that personhood is constituted through others, often captured in the phrase 'I am because we are' — challenges liberal assumptions about moral autonomy and property rights. In your analysis, you must evaluate whether this relational framework can accommodate what is termed **interstitial agency**: the capacity of an individual to renegotiate obligations without thereby dissolving into a self-defining, atomistic subject.

  ***

  ### Model Answer

  The conflict between the elder's claim and the principle of testamentary freedom exposes a fundamental ontological disagreement regarding the nature of the self and its holdings. To resolve this, one must first articulate the relational ontology underpinning the elder's assertion. Within an Ubuntu framework, personhood is not a static biological fact possessed at birth, but a moral achievement cultivated through community. To be a person is to participate in a network of reciprocal care; thus, the deceased is not an isolated entity who *had* relationships, but a being whose very existence was constituted *by* those relationships. Property, consequently, is not an external object owned by a sovereign will, but a resource entrusted to the node for the sustenance of the network. The estate belongs to the relationships that sustained the life, not the biological remains of the individual.

  This stands in sharp contrast to the methodological individualism characteristic of liberal political philosophy. Liberalism typically posits the individual as prior to society, possessing inherent rights that the state must protect. Moral autonomy is defined as the capacity for self-legislation, free from external coercion. Property rights are viewed as an extension of this autonomy; what one mixes their labour with or acquires through free exchange is theirs to dispose of as they see fit. In this view, the elder's claim appears as an infringement on liberty, a collective encroachment upon the individual's right to determine the fate of their possessions post-mortem. The liberal subject owns property; the Ubuntu subject is owned by the obligations that property serves.

  The crux of the philosophical problem, however, lies in whether this relational ontology permits any genuine agency. If one is merely a node, does any capacity for choice remain, or is the subject dissolved into the collective? This is where the concept of interstitial agency becomes vital. A robust relational ethics must avoid the trap of determinism, where the individual is simply a vessel for tradition. Interstitial agency suggests that while one cannot step outside the network of relations entirely, one possesses the capacity to negotiate the terms of those relations from within. It is the ability to reinterpret obligations without severing the bond. For example, a community member might argue that fulfilling a specific reciprocal obligation requires modifying a traditional practice to better suit current needs, thereby honouring the spirit of the relationship while altering its form. This is not atomistic self-definition, because the justification remains grounded in the health of the community, yet it is not blind conformity either.

  Therefore, relational personhood can accommodate interstitial agency, provided that agency is understood as dialogical rather than monological. The individual does not choose in a vacuum but argues within the context of shared values. The coherence of this agency depends on the community's willingness to recognise renegotiation as a form of loyalty rather than betrayal. If the network is too rigid, agency collapses into coercion; if it is too loose, it dissolves into liberalism. The elder's claim is valid only if the distribution process allows for the deceased's specific contributions and relationships to be weighed dialogically, rather than applying a rigid customary formula.

  The concrete implication for legal practice is the shift from adjudication to mediation. A liberal court seeks to apply a universal rule (the will is valid or invalid) to settle rights. A relational legal institution must facilitate a process where the network of kin negotiates the distribution in a manner that restores balance. The law should not dictate the outcome but structure the dialogue, ensuring that vulnerable members of the network are not excluded from the renegotiation. Institutional design must therefore prioritise forums for deliberation over binary judgements. Ultimately, recognising interstitial agency allows the legal system to honour the communal nature of property without rendering the individual invisible, preserving the network by allowing it to breathe.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Structure:** 5 Criteria × 4 Marks each

  | Criterion | A-Range (16–20 Total) | B-Range (12–15 Total) | Fail Range (<10 Total) |
  | :--- | :--- | :--- | :--- |
  | **1. Conceptualisation of Relational Ontology**<br>(Understanding of Ubuntu/Personhood) | **4:** Precisely articulates personhood as a moral achievement constituted by community; clearly explains property as entrusted rather than owned. | **3:** Describes relational personhood accurately but lacks depth regarding the moral status of property or the constitutive nature of relationships. | **0–2:** Misinterprets Ubuntu as mere collectivism; fails to distinguish relational ontology from biological fact or simple groupthink. |
  | **2. Critique of Methodological Individualism**<br>(Contrast with Liberalism) | **4:** Clearly contrasts relational views with liberal autonomy/property rights; identifies the ontological priority of the individual in liberalism vs. community. | **3:** Identifies the contrast between individual and community but treats liberal autonomy superficially or lacks ontological precision. | **0–2:** Fails to distinguish liberal assumptions from relational ones; conflates the two or ignores the liberal counter-argument. |
  | **3. Evaluation of Interstitial Agency**<br>(Core Argument) | **4:** Offers a reasoned judgement on the coherence of agency within relational frameworks; successfully navigates the tension between negotiation and atomism. | **3:** Discusses agency but struggles to define how it differs from atomism; argument regarding coherence is tentative or unclear. | **0–2:** Denies the possibility of agency within relationalism or accepts it without critical evaluation; misses the concept of 'interstitial' negotiation. |
  | **4. Institutional Implication**<br>(Application) | **4:** Proposes a concrete, logical implication for law or institutions (e.g., mediation vs. adjudication) that flows directly from the theoretical argument. | **3:** Suggests an implication but the link to the theoretical argument is weak or the proposal is vague/general. | **0–2:** No concrete implication offered; or the implication contradicts the preceding philosophical argument. |
  | **5. Coherence and Expression**<br>(Structure and Language) | **4:** Argument is logically structured, persuasive, and written in precise British English; moves flow seamlessly. | **3:** Argument is understandable but may lack structural polish or contain minor linguistic errors; some transitions are abrupt. | **0–2:** Disorganised or difficult to follow; significant errors in grammar or spelling that impede comprehension; non-British English conventions. |

  **Grade Boundaries:**
  *   **A-Range (16–20 Marks):** Demonstrates sophisticated conceptual grasp, critical evaluation, and clear application. The argument regarding interstitial agency is nuanced and decisive.
  *   **B-Range (12–15 Marks):** Demonstrates competent understanding and correct identification of key concepts. The evaluation of agency is present but lacks depth or precision.
  *   **C-Range (10–11 Marks):** Passes the threshold by addressing all parts of the question but remains descriptive rather than analytical.
  *   **Fail Range (0–9 Marks):** Fails to address the core theoretical tension, misunderstands key concepts, or lacks coherent argumentation.
