answer: |-
  **Project Title:** Prioritarianism Under Uncertainty: Mapping the Limits of Levelling-Down Immunity

  **Research Question**
  Does prioritarianism's immunity to the levelling-down objection hold under conditions of uncertainty, or does the theory's vulnerability in prospective cases constitute a genuine instance of the levelling-down objection rather than a distinct failure of *ex post* Pareto efficiency? Specifically, is the apparent 'prospective levelling down' in *ex ante* prioritarianism a structural feature of distributive priority, or an artefact of conflating priority with risk aversion?

  **Background and Rationale**
  The levelling-down objection (LDO) posits that if equality has final value, a state where everyone is equally worse off is in one respect better than a state where some are better off and others well-off. This is widely regarded as absurd. Prioritarianism is standardly credited with escaping the LDO. By applying a strictly increasing, strictly concave transformation to absolute well-being levels, prioritarianism ensures that lowering a person's well-being always reduces total moral value, regardless of the effect on equality. On this standard view, prioritarianism is immune to levelling down because it never values a loss to the worse-off without a compensating gain.

  However, this immunity is established only in deterministic contexts. When uncertainty is introduced, the application of the priority weight becomes ambiguous. We must distinguish between weighting *expected* well-being (*ex ante* prioritarianism) and weighting *realized* well-being in each state (*ex post* prioritarianism). My preliminary analysis suggests a vulnerability in the *ex ante* view. Consider a choice between giving a worse-off person a sure lifetime well-being of 60, or a gamble yielding 100 or 20 with equal probability (while a better-off person remains at 100). Both options yield an expected well-being of 60. An *ex ante* prioritarian is indifferent. Yet, in the 'bad' branch of the gamble, the worse-off person ends at 20. Compared to the sure policy, she is worse off in this branch, and no one is better off. This mimics the structure of levelling down: a loss to the worse-off with no compensating gain in that state.

  The standard reply—that prioritarianism escapes LDO—does not settle this because it assumes a currency of certain well-being. It fails to address whether the 'bad branch' of a gamble counts as a 'levelled down' outcome in the relevant normative sense. If *ex ante* prioritarianism permits this, is it because it accepts levelling down, or because it prioritizes *ex ante* fairness over *ex post* efficiency? Furthermore, the concavity of the priority function may be doing double duty, encoding both a moral preference for the worse-off and an attitude toward risk. If these are not separated, the matrix of objections may collapse.

  **Methodology**
  The project will employ a hybrid method of formal modelling and normative conceptual analysis. While a purely axiomatic approach could map the verdicts of various prioritarian variants, it cannot determine the *normative character* of those verdicts. Axiomatization tells us *that* a theory violates a principle; it does not tell us whether that violation constitutes a genuine LDO or a different objection (e.g., Pareto inefficiency). Therefore, this project will first formalize the variants to isolate the verdicts, and then subject those verdicts to normative scrutiny to classify the objection.

  I will exclude the third contrast (identity of the person levelled down) as a primary variable. Including it risks splitting the project into two distinct inquiries (currency of value vs. treatment of risk). Instead, I will treat identity changes as a boundary test in Year 2 to ensure the primary matrix is robust before expanding scope.

  *Year 1: Formalization and Matrix Construction*
  *   **Term 1:** Literature reconstruction. Formalize the standard deterministic LDO and the standard prioritarian response without reliance on specific authors. Define the 'Subtractive' (active worsening) vs. 'Pre-emptive' (withholding improvement) distinction rigorously.
  *   **Term 2:** Modelling Uncertainty. Construct formal models for *ex ante* and *ex post* prioritarianism. Map the 'Actual' vs. 'Prospective' distinction onto these models using the gamble case (60 sure vs. 100/20 gamble).
  *   **Term 3:** The Matrix. Generate verdicts for all four cells (Subtractive/Pre-emptive × Actual/Prospective). Identify exactly where the immunity breaks. Draft first paper on the formal results.

  *Year 2: Disentangling Risk and Priority*
  *   **Term 4:** Separation Thesis. Test whether the vulnerability in the 'Prospective' cells survives if risk aversion is separated from priority weighting (e.g., using a linear priority function with separate risk weights, or vice versa).
  *   **Term 5:** Normative Classification. Analyze the 'Prospective' vulnerability. If the theory recommends the gamble, is it because it values the 'levelled down' state, or because it values the *chance*? This determines if the objection is truly LDO or *ex post* Pareto.
  *   **Term 6:** Boundary Testing. Apply the 'Identity' contrast as a stress test. Does the objection hold if the person levelled down does not change their 'worst-off' status? Second paper draft on the Risk/Priority distinction.

  *Year 3: Synthesis and Application*
  *   **Term 7:** Decision Criteria. Develop criteria to decide between the competing classifications of the objection. If the 'Prospective' case is distinct from LDO, define its proper name and normative force.
  *   **Term 8:** Deliverable Construction. Translate findings into a framework for policy evaluation under uncertainty.
  *   **Term 9:** Thesis Writing. Final integration of formal and normative arguments. Third paper draft on policy implications.

  **Range of Conclusions**
  There are three primary outcomes:
  1.  **Immunity Holds:** The 'Prospective' case is not a genuine LDO because *ex ante* expectations are the correct currency of prioritarian value. The 'bad branch' is morally irrelevant compared to the ex ante improvement.
  2.  **Immunity Fails (Genuine LDO):** Prioritarianism does value the 'levelled down' branch in some respect, implying the theory is not fully immune to LDO once risk is introduced.
  3.  **Category Error:** The vulnerability is real but misidentified. It is not an LDO but a failure of *ex post* Pareto efficiency. The project would then conclude that prioritarianism escapes LDO but faces a distinct 'Prospective Efficiency' objection.

  The decision between these will rest on whether the 'bad branch' can be said to have *final value* independent of its contribution to the prospect. If the bad branch is only instrumentally relevant to the value of the gamble, it is not LDO.

  **Deliverable**
  For practitioners aggregating benefits under uncertainty (e.g., health economics or policy analysis), the project will produce a **Prioritarian Risk-Adjustment Protocol**. Currently, cost-benefit analyses often apply priority weights to expected outcomes blindly. This protocol will specify when such application leads to 'prospective levelling down' and offer a corrected aggregation method that separates distributive weight from risk attitude, ensuring that policy recommendations do not inadvertently endorse outcomes where the worst-off are harmed in realized states without compensation.

  **Failure Conditions**
  I acknowledge two significant risks to the project's viability:
  1.  **Triviality:** It may transpire that three of the four matrix cells collapse into triviality (e.g., 'Pre-emptive' cases reduce to standard allocation problems, and 'Actual' cases are just the standard deterministic view). If the project reduces to a single case (Ex Ante vs. Ex Post), the matrix is decoration, and the thesis loses its comparative weight.
  2.  **Project Split:** The investigation into Risk vs. Priority may prove so distinct from the LDO literature that the project becomes two separate inquiries: one on the currency of prioritarian value (expectations vs. outcomes) and one on the treatment of risk. If the 'Prospective LDO' cannot be meaningfully distinguished from standard risk-aversion objections, the core research question dissolves.

  Should Term 4 (Separation Thesis) demonstrate that Risk and Priority cannot be conceptually disentangled within the prioritarian framework, I will pivot to a defence of the 'Category Error' conclusion (Outcome 3 above), arguing that the LDO vocabulary is simply inapplicable to uncertain prospects, thereby salvaging the thesis as a definitive map of the objection's domain limits.
