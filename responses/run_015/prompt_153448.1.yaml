prompt: |-
  i'm wrapping up a seminar on plutarach and moral biography and want a short poem to close — a blank-verse sonnet, 14 lines, unrhymed but with a clear volta around line 9. the conceit is plutarach's parallel lives versus hagiography: he pairs figures (say alexander and caesar, or just "the greek" and "the roman") not to crown a moral winner but to show how the same virtue — clemency, ambition — gets twisted by different politcal structres. i want the turn at line 9 to be the moment the comparison refuses to resolve into a lesson and instead leaves both figures stranger, less exemplary. the poem's structure should track that refusal: maybe the syntax fractures or the parallel breaks down after the volta. don't sermonize about "learning from lives"; let the form carry the idea that moral biography only works if you keep the comparative tension open rather than flattening them into flat exemplars. make it specific enough that someone who actually reads plutarach nods instead of winces.
