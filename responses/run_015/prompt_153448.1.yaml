  We place the Greek beside the Roman man,
  Not so the laurel finds a single brow,
  But where the same ambition drives the soul,
  Within the forum or the king's command.
  See clemency grow sharp in monarch's hands,
  Or soften where the senate checks the sword;
  The virtue shifts to fit the polity,
  And bends the iron will to fit the law.
  Yet here the synkrisis dissolves to mist.
  Alexander's rage is not Caesar's ice.
  One burns the East, one falls to friends' attack
  And virtue fractures under distinct weight.
  They slip the pair. They stand now quite apart.
  Not examples now, but lives past our hold.
