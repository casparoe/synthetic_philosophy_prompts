answer: |-
  **Translations**

  **Transcendent Realism** maps to **Declared Kinds**. The schema object exists independently of validation; the kind is real even if no record asserts membership. **Immanent Realism** maps to **Derived Kinds** where the universal is the validation logic itself, instantiated in every query path that successfully retrieves a record. **Class Nominalism** maps to **Extension** alone; a kind is identical to the set of record IDs currently satisfying its predicate, with intension discarded. **Resemblance Nominalism** maps to **Aspect Clustering**; there are no Kind nodes, only records linked by similarity metrics on aspect fillers. **Trope Theory** maps to **Reified Aspect Occurrences** as primitives; records are mere bundles of these aspect-nodes, and Kinds are secondary patterns over bundles.

  **Residue Report**

  **Transcendent:** Translates cleanly to schema persistence. **Smuggling:** "Independence" is merely database durability, not ontological autonomy. **Residue:** None.
  **Immanent:** Translates to predicate logic. **Smuggling:** "Wholly present" implies spatial location; logic is central, not distributed across records. **Residue:** The mereology of logic is inexpressible.
  **Class:** Translates to query results. **Smuggling:** Ignores intension entirely. **Residue:** Cannot distinguish co-extensive kinds (Case 2).
  **Resemblance:** Translates to aspect value comparison. **Smuggling:** Resemblance is computed, not primitive. **Residue:** No account of *why* resemblance matters.
  **Trope:** Translates to reified aspects. **Smuggling:** Records still containerize tropes; tropes are not fundamental enough. **Residue:** Identity-bearing aspects imply a substrate beyond the bundle.

  **Case Analysis**

  1.  **Empty Kinds:** Transcendentism distinguishes **RADIATION-SPILL-INCIDENT** (Declared) from the empty Derived Kind via schema ID. Immanentism and Class Nominalism collapse them: both have null extensions. Trope theory sees nothing.
  2.  **Co-extensive Derived Kinds:** Class Nominalism asserts identity (same record IDs). Transcendent/Immanent distinguish them via predicate intension. The registry agrees with Transcendentism: distinct schema objects despite identical extensions.
  3.  **Repeated Aspects/Co-tickets:** Trope theory handles distinct **Aspect Occurrences** (COLOR index 1 vs 2) naturally as distinct nodes. **Co-tickets** function as identity assertions between tropes across records. Immanent realism struggles: is the universal "wholly present" in both co-ticketed occurrences? The registry treats them as linked data, not shared location.
  4.  **Kinds-as-Records:** Breaks the type/token distinction. Trope theory handles best: a Kind-record is just another bundle of aspect-tropes. Transcendentism struggles: is the Kind-record an instance of a Meta-Kind? The registry allows this via recursive schemas, but metaphysical status is undefined.

  **Verdict**

  Your suspicion is correct: the registry is metaphysically neutral because it operationalizes **assertion** and **computation**, not **grounding**. Your guess regarding missing primitives is accurate. **Modality** is absent: the registry cannot distinguish necessary validation from contingent correlation. **Location** is absent: data has addresses, not spatial presence, dissolving "wholly present." **Causation** is absent: aspect fillers are stored, not caused. **Explanation** is absent: co-tickets assert identity without explaining why.

  **Dissolution Report**

  Two metaphysical disputes dissolve due to vocabulary deficiency. First, **Immanent Realism's** "wholly present" claim collapses; without spatial mereology, a predicate cannot be "in" a record, only applicable to it. Second, **Resemblance Nominalism's** worry about closure dissolves; resemblance is a configurable similarity threshold, not a metaphysical primitive requiring justification.

  Two disputes dissolve because the original claims were obscure. **Transcendent Realism's** "existence" reduces to schema persistence; the ontological weight was a metaphor for durability. **Trope Theory's** "bundle" reduces to foreign key constraints; the metaphysical novelty was a description of normalization. The registry reveals that much of the debate rests on spatial and causal metaphors ("in," "grounds," "makes") that have no analog in a system built on **identity-bearing aspects** and **predicate validation**. You are not modeling the world; you are modeling assertions about the world. The metaphysics arises only when you ask why those assertions hold, which is outside the registry's scope.
