      *   Without this premise, the "privation of awareness" argument doesn't prove death isn't bad; it only proves death isn't *felt*. (Deprivation theorists say: You don't feel being dead, but you are worse off because you lack life).
      *   So, the argument needs:
          1.  Good/Evil require a subject (Hedonism/Experience Requirement).
