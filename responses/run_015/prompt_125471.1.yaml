      *   *Fatal:* "If the structure was authorized by citizens, doesn't that mean *we* all have dirty hands, making the concept meaningless?" OR "Isn't this just describing bureaucracy as usual, not a moral problem?" OR "Doesn't this explicitly let the leader off the hook, which is the opposite of holding power accountable?"

  4.  **Selecting and Ordering by Damage:**
      *   *Most Damaging:* The "Accountability Vacuum" objection. If the theory implies no one is to blame, it undermines the purpose of democracy/oversight. This hits the Attorney and Journalist hard.
