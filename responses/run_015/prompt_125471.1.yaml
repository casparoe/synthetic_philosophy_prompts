      *   *The Fatal Objection:* "Isn't this just a fancy way of saying 'the system is broken' without offering a way to fix it, thereby excusing the leader?" (Actually, a stronger fatal one is: "If the politician designed the ambiguity *to* hide the dirt, that's conspiracy, not distributed hands. If they didn't, it's negligence. Where is the 'dirty hands' moment?") Let's refine the fatal one: "If the politician retains moral cleanliness, you have removed the 'dirty hands' problem entirely and replaced it with 'structural sin,' which means leaders can never be judged for outcomes."

  5.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Respectful, concrete, avoiding "utilitarianism/deontology" talk. Use terms like "chain of command," "scope of work," "plausible deniability," "election mandate."
      *   *Reply Strategy:* Acknowledge the risk (concede), then pivot to the *diagnostic* value (it explains *why* accountability fails, not that it *should* fail).

  6.  **Developing the Specific Objections & Replies:**

      *   *Objection 1 (The Attorney/Journalist):* "The Buck Stops Here." If you say the Mayor's hands are clean because a caseworker pulled the trigger, you're destroying the chain of command.
      *   *Objection 2 (The Housing Admin):* "We Know What We're Doing." Bureaucrats aren't robots. We exercise discretion. If we do the dirty thing, our hands are dirty, but that doesn't wash the Mayor's.
      *   *Objection 3 (The Layperson):* "Voting Isn't a Contract." I voted for better schools, not for kicking kids out of housing. Don't say I authorized the dirt.
