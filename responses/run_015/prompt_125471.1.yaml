  9.  **Final Polish:** Ensure the voice sounds like a prep sheet for a nervous but prepared presenter. (Self-Correction: Make sure the "Fatal" objection is clearly marked as distinct).

  *(Self-Correction during drafting)*: I need to make sure I don't give the user "philosophical" answers. The answers need to be political/practical. The user's thesis is that the politician *retains moral cleanliness*. This is the most controversial part. I need to help them defend that without sounding like they are apologizing for corruption. The key distinction is "Moral Cleanliness" vs. "Political Accountability." They might be clean in soul, but should be fired in job. Wait, the thesis says "retains moral cleanliness precisely because the citizenry authorized the structure." That's the weak point. I need to help them nuance that. Actually, the best defense is that the *theory* describes a phenomenon, not an endorsement.

