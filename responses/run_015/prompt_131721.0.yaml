      *   *Antiquarian:* Preserving, revering, caring for the past for its own sake. (Risk: stagnation, mummification, hoarding without purpose).
      *   *Critical:* Judging, condemning, breaking apart the past to live anew. (Risk: nihilism, destroying roots).
      *   *Integration:* The speech itself needs to *perform* these modes. It should start with inspiration (Monumental), move to care/preservation (Antiquarian), and then confront the hard truths/ethics (Critical), finally synthesizing them for the future.

  3.  **Address the Tension/Context:**
