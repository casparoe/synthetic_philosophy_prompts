answer: |-
  Welcome. Please, settle.

  Look around this room. We have here the keepers of the record and the readers of the deep text. We are gathered to speak about archives, specifically those outside the Western canon, and yet we meet in a moment of quiet subtraction. Many of you know that this institution has recently closed the wing dedicated to living memory. The recording booths are dark. The budget for capturing the breath of the elders has been cut.

  It is tempting, in this silence, to speak only of what we have lost. But if we stay there, we become prisoners of a history that serves only grief. So, let us begin instead with what history is for.

  We begin with the need for giants. We collect archives because we require examples. When a community looks back and sees resilience, when a scholar finds a precedent for resistance in a brittle letter from 1920, the past becomes a weapon for the present. This is the ambition that built these collections: the belief that what happened before matters enough to inspire what happens next. We honor the oral historians who raced against time to capture voices before they faded. They acted on the belief that these lives were monumental, that they deserved to stand against the erosion of forgetting. We must keep that fire. If we lose the belief that the past can empower us, the archive becomes a tomb.

  But inspiration alone is not stewardship.

  We must shift our gaze from the peaks to the soil. There is a piety required in this work. The archivist knows this better than anyone. It is the care for the box, the climate control, the digitization of the fragile tape. This reverence preserves the conditions under which we live. It tells us where we come from. In the wake of the funding cuts, this mode becomes urgent. We can no longer assume the luxury of endless accumulation. We cannot simply gather more. We must tend to what remains. We must love the object not for what it can do for us, but for what it is. If we lose this reverence, if we treat these collections merely as data to be mined, we destroy the very roots that feed us. We become wanderers with no home.

  And yet.

  Reverence can become hoarding. Inspiration can become myth. There is a third necessity, and it is the hardest one to speak aloud in a room dedicated to preservation. We must also be willing to judge the past.

  We are dealing with non-western archives. We must ask: how did these boxes come to be here? Who decided what was worth saving? There is violence stored in the shelving units. There are collections assembled through extraction, categorized through colonial lenses, preserved because they served a master who is long dead. To honor the work that has been done, we must also admit where the work was wrong. We cannot simply preserve the injustice because it is old. Sometimes, to live, we must break the tablet. We must be willing to say that some things should not have been collected, or should not remain where they are. This is not destruction for the sake of nihilism; it is surgery for the sake of life. If we refuse this critical edge, we become custodians of crimes.

  So, where does this leave us, with the recording booths dark and the shelves full?

  It leaves us with a balance that is precarious and vital. We need the monumental to give us courage. We need the antiquarian to give us care. But we require the critical to give us conscience.

  The loss of the oral history wing is a wound. But it also forces a question we might have avoided otherwise. We can no longer be passive reservoirs. We must be active editors of memory. We must decide what serves life.

  To the archivists: your care is the ground we walk on. To the scholars: your scrutiny is the light we walk by. Let us not mourn the silence of the booths. Let us fill it with the noise of difficult decisions. Let us preserve what heals, question what harms, and build an archive that does not just store the past, but enables a future.

  Thank you. Let's begin.
