      *   *Verdict:* It *does* risk collapsing. If the mechanism is codified (e.g., "If probability > 80%, suspend queue"), it's generalism. If the mechanism is "Committee uses discretion," it's particularism but vulnerable to the arbitrariness charge. The user needs to distinguish between *constitutive rules* and *enabling conditions*.

  5.  **Address Question 3: Weakest Point & Most Interesting Point:**
