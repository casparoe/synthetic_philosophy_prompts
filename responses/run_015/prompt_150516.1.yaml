      *   *User's "Institutional Particularism":* Focuses on *systems* rather than *agents*. The "rule" is the bureaucratic protocol. The "particularity" is the exception case. The "mechanism" is a procedural override.
      *   *The Tension:* If you create a *rule* for when to break the *rule*, haven't you just created a more complex generalist system?

  3.  **Address Question 1: The Hospital Case (Philosophy vs. Policy):**
