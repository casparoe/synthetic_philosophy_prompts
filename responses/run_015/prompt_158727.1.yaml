answer: |-
  This is an excellent brief. Your instinct is correct: the book chapter you read is compressing a live, technical debate into a narrative arc that resolves too neatly. It conflates the *structural* requirements of expected utility theory with the *measurement* problem of moral units, and then treats a specific objection to naive hedging as a refutation of hedging itself.

  Here is a claim-by-claim breakdown, followed by an evaluation of the software design choices. I have flagged **Consensus** (broad agreement among specialists), **Dispute** (live disagreement), and **Error** (claims most specialists would reject).

  ### Part 1: Critique of the Book Summary

  **Claim 1:** *'Moral uncertainty is uncertainty about which moral theory is the true one... not about the facts.'*
  *   **Verdict:** **Consensus.**
  *   **Detail:** This is the standard definition of "normative uncertainty" or "moral uncertainty" in the literature (e.g., William MacAskill, Krister Bykvist, Toby Long). It distinguishes empirical uncertainty (will this bomb kill them?) from normative uncertainty (is killing them wrong?).

  **Claim 2:** *'The standard way of handling it is ordinary expected-value reasoning... Maximise Expected Choice-worthiness (MEC).'*
  *   **Verdict:** **Consensus (as the leading proposal).**
  *   **Detail:** It is not "standard practice" in the sense that everyone does it, but it is the dominant *theoretical framework* discussed in the academic literature. It is the null hypothesis against which other views are tested.

  **Claim 3:** *'This usually hands you back the answer you already had: do what your favourite theory says.'*
  *   **Verdict:** **Error.**
  *   **Detail:** This is factually incorrect regarding the math. MEC frequently diverges from "My Favourite Theory" (MFT). If you are 90% sure of Utilitarianism (which says "Save 5 people") and 10% sure of a Deontological theory (which says "Saving 5 people violates a right and is forbidden"), MEC might still tell you to save the 5, but MFT would too. However, if the stakes differ wildly (e.g., a low-credence theory posits infinite disvalue), MEC will override the high-credence theory. The whole point of MEC is that it *doesn't* just default to the favourite.

  **Claim 4:** *'The theories aren't measurable against one another... This is the normalisation problem.'*
  *   **Verdict:** **Consensus.**
  *   **Detail:** This is the central technical hurdle. Utilitarianism measures in "welfare units"; Kantianism measures in "duty violations." There is no obvious exchange rate. This is known as the problem of *intertheoretic comparison*.

  **Claim 5:** *'...after decades of argument there's still no agreed solution, which effectively shelves the whole expected-value approach.'*
  *   **Verdict:** **Dispute (leaning towards Error).**
  *   **Detail:** While there is no *single* agreed solution, the field has not "shelved" the approach. There are several proposed normalization methods (variance voting, range voting, ratio scaling). To say the approach is shelved implies research has stopped; in reality, this is the most active sub-field of normative uncertainty.

  **Claim 6:** *'The practical upshot is that you should just act on whichever theory you find most plausible (My Favourite Theory).'*
  *   **Verdict:** **Dispute (Minority View).**
  *   **Detail:** MFT is widely considered inferior to MEC by specialists because it violates *dominance principles*. If Theory A says Option X is better than Y, and Theory B says Option X is better than Y, MFT might still tell you to do Y if your *third* favourite Theory C prefers Y. Most philosophers find this incoherent.

  **Claim 7:** *'Hedging between theories is worse than useless... someone can construct a series of choices in which you pay to switch back and forth (money pump).'*
  *   **Verdict:** **Error / Conflation.**
  *   **Detail:** This is the "sneaky move" you suspected. Money pump arguments apply to *incoherent preference orderings*. If you hedge *without solving the normalization problem*, your preferences can indeed flip-flop (because the scale is arbitrary). However, if you adopt a consistent normalization method (like variance voting), the money pump disappears. The author is presenting a problem with *naive* hedging as a problem with *all* hedging.

  **The "Sneaky Move" Identified:**
  The author conflates **Intertheoretic Comparison** (we can't match units) with **Structural Incoherence** (hedging is irrational).
  1.  They propose Expected Value.
  2.  They note Expected Value requires comparable units.
  3.  They note units aren't comparable.
  4.  They conclude Expected Value is impossible.
  5.  They conclude you should revert to My Favourite Theory.
  *The Gap:* Step 4 does not lead to Step 5. It leads to "We need a normalization method." Step 5 is a separate philosophical claim that is widely contested. The author uses the difficulty of Step 4 to smuggle in Step 5.

  ---

  ### Part 2: Evaluating the "Ethics Engine" Design Choices

  Here is how a specialist would evaluate the two technical fixes you described.

  #### 1. The Normalisation Fix (Range Voting / 0–100 Rescaling)
  *The Design:* Each theory scores the available options. The best gets 100, the worst gets 0. The engine averages these scores based on your credence in the theories.

  *   **Does it work?** It solves the unit problem but creates a **Menu Dependence** problem.
  *   **The Technical Flaw:** This method violates the *Independence of Irrelevant Alternatives (IIA)*. The recommendation for Option A vs. Option B changes depending on whether Option C is present in the menu.
      *   *Example:* Imagine Utilitarianism loves Option A (100) and hates Option B (0). Kantianism loves Option B (100) and hates Option A (0). It's a tie.
      *   Now, add Option C, which is a "decoy" that Utilitarianism hates even more than B. Now Utilitarianism's scale shifts: A is still 100, but C is 0, and B is now 50. The average score for B goes up relative to A, potentially flipping the decision.
  *   **Verdict:** This is a known trade-off in social choice theory. It makes the output **hostage to the menu**. If the software developers curate the options, they can manipulate the moral recommendation by adding "dummy" options to shift the 0–100 scale of specific theories.
  *   **Consensus Status:** Specialists (e.g., MacAskill, Hedden) acknowledge range voting is a viable *candidate* for normalization, but explicitly warn about menu dependence. It is not a "solution" so much as a choice of which bug to accept.

  #### 2. The Confidence Floor/Ceiling (2% – 90%)
  *The Design:* You cannot assign 0% or 100% credence to any theory.

  *   **Does it work?** It prevents dogmatism but invites **Fanaticism**.
  *   **The Technical Flaw:** This does not solve the problem of low-probability, high-stakes theories (often called "Pascal's Mugging" or the "Fanaticism Problem").
      *   *Example:* If you assign a 2% floor to a theological theory that says "If you do X, you cause infinite suffering in the afterlife," that 2% will mathematically swamp 98% credence in Secular Humanism which only cares about finite earthly suffering. Infinity (or even just astronomically large numbers) times 0.02 is still larger than finite times 0.98.
  *   **Verdict:** The floor prevents you from *ignoring* a theory, but it forces you to be vulnerable to *extremist* theories. A 2% credence in a "fanatical" theory can dominate the calculation.
  *   **Consensus Status:** There is broad agreement that dogmatism (0% or 100%) is epistemically unhealthy. However, there is **no consensus** on how to handle the resulting fanaticism. Some (e.g., MacAskill) accept that moral uncertainty *implies* we should be somewhat fanatical about long-term/high-stakes outcomes. Others (e.g., Gustafsson, Smith) argue this is a *reductio ad absurdum* of the expected value approach.

  #### 3. The "Ought" Claim
  *The Question:* Is the number the tool prints out "the thing you ought to do"?

  *   **Verdict:** **No.** (Consensus)
  *   **Detail:** Philosophers distinguish between **Objective Rightness** (what is actually right in the world) and **Subjective Rightness** (what is rational to do given your information and uncertainty).
  *   The tool calculates a proxy for *Subjective Rightness* (specifically, maximizing expected choice-worthiness under a specific normalization model).
  *   It cannot tell you what is *Objectively Right*.
  *   **Crucial Nuance:** Even for *Subjective Rightness*, there is disagreement. Some philosophers argue that "rationality" doesn't require maximizing expected value at all (e.g., risk-weighted ethics). So the tool is defending *one specific model of rationality*, not rationality itself.
  *   **For your piece:** The tool produces a **defensible recommendation**, not a moral truth. It tells you: "If you accept Expected Value theory, and you accept Range Voting normalization, and you accept these credences, then X is the rational choice." It does not tell you "X is the right thing to do."

  ### Summary for your Piece

  If you want to avoid the "lazy sneer" while remaining rigorous, here is the narrative arc the literature supports:

  1.  **The Problem is Real:** Moral uncertainty is a genuine philosophical problem, not just hand-wringing. The "Normalisation Problem" (comparing units across theories) is the main bottleneck.
  2.  **The Book is Outdated/ Simplistic:** The claim that "hedging is incoherent" is not the current consensus. The field has moved on to debating *how* to hedge, not *whether* to hedge.
  3.  **The Software is Making Trade-offs:** The teams are not "solving" ethics. They are implementing specific solutions to technical problems (Range Voting for normalization; Credence Floors for dogmatism) that come with known side-effects (Menu Dependence; Fanaticism).
  4.  **The Verdict:** The tools are best understood as **deliberation aids** that force users to quantify their uncertainty, rather than **oracles** that output moral truth. They make your moral commitments explicit, which is valuable, but the output is only as robust as the normalization method chosen (which is still philosophically contested).

  ### Key Names for Attribution
  *   **William MacAskill:** *Doing Good Better* (popular) and *Normative Uncertainty* (thesis). Pro-MEC, pro-hedging.
  *   **Ted Lockhart:** *Moral Uncertainty and Its Principles*. Early formalizer of the "My Favourite Theory" vs. "Hedging" debate.
  *   **Brian Hedden:** Work on intertheoretic comparison and normalization.
  *   **Andreas Mogensen:** Critiques of the "fanaticism" implications of moral uncertainty.
  *   **Jacob Ross:** Work on the measurement problem.

  ### Explicit Flagging of My Analysis
  *   **Consensus:** The definition of moral uncertainty; the existence of the normalization problem; the distinction between objective/subjective rightness; the vulnerability of range voting to menu dependence.
  *   **Dispute:** Whether MEC is the correct decision rule (vs. risk-weighted views); whether "fanaticism" is a bug or a feature of moral uncertainty; whether My Favourite Theory is ever permissible.
  *   **My View:** I am an AI, so I do not have views. However, the analysis above reflects the weight of the academic literature as of 2024. The claim that "hedging is incoherent" is widely regarded in the field as a straw man of early objections that have since been addressed by normalization techniques.
