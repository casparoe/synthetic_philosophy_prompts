prompt: |-
  I'm a third-year undergraduate in a seminar on democratic theory, and I've been asked to lead one 80-minute session for about eighteen classmates on the boundary problem — the difficulty that any vote presupposes a settled answer to who is entitled to vote, while every proposed answer to that seems itself to have been settled by somebody, and so on down. I want them to run into it rather than hear it from me: no lecture up front, and the name of the problem shouldn't be said until the debrief.

  My rough plan, which I'd like you to design properly or replace: the group has to make one genuinely binding but small decision (how we use the final seminar, plus roughly twenty-five euros of leftover course money for food), and before that they must decide who counts, by a vote held under a franchise I assign arbitrarily and in advance — say, only students whose surnames fall in the first half of the alphabet, or only those dealt a marked card on arrival. They should then propose and vote on a principled rule of their own and only discover afterwards that any rule they accept has to be applied to the choice of the rule. Partway through I'll hand them a second, wider decision — one that would bind the whole department or next year's cohort — so that they have to recompute the franchise from scratch and notice that the demos seems to shift with the decision rather than being a fixed group of people.

  One principle of my own that I'd like the activity to put pressure on: membership graded by whether the decision changes what a person can do, the set of options available to them, rather than by how well off they end up. I want that tested against the two familiar ones — everyone whose interests are affected, and everyone who will be subject to the decision's enforcement — including the cases where it diverges from them.

  Please give me the rules, materials, card or role assignments, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the regress, the decision-relativity of the demos, and the differences among the three principles. Tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about what the activity cannot reproduce and I will have to say myself — I suspect, among other things, that real boundaries are closed by territory, force and constitutional settlement before anyone gets to vote on them, and that walking out is available in a classroom in a way it is not in a state.

  End with a single last line beginning Activity in one sentence:
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Third-year undergraduate leading an 80-minute seminar on democratic theory.
      *   **Topic:** The Boundary Problem (who constitutes the *demos*?).
      *   **Constraint 1:** No lecture up front. The name of the problem shouldn't be said until the debrief.
      *   **Constraint 2:** Students must *run into* the problem experientially.
      *   **Constraint 3:** The activity involves a binding decision (seminar time + €25 food money).
      *   **Constraint 4:** Initial franchise is arbitrary (assigned by instructor).
      *   **Constraint 5:** Students must propose/vote on a principled rule, realizing the regress (who decides the rule?).
      *   **Constraint 6:** Midway, introduce a wider decision (binding dept/next year) to show decision-relativity of the *demos*.
      *   **Constraint 7:** Test the user's specific principle (membership graded by change in options/capacity) against "All Affected Interests" (AAI) and "All Subject to Coercion" (ASC).
      *   **Deliverables:** Rules, materials, assignments, minute-by-minute timeline, debrief (mapping moments to theory), troubleshooting (what goes wrong), limitations (what the activity can't do).
      *   **Final Constraint:** End with a single last line beginning "Activity in one sentence:".

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Paradox:* To vote on who votes, you need to know who votes.
      *   *The Experience:* Students need to feel the frustration/illegitimacy of an arbitrary boundary, try to fix it, realize they can't fix it without presupposing a boundary, and then see how the scope of the decision changes the boundary.
      *   *The Principles:*
          1.  *All Affected Interests (AAI):* Anyone impacted.
          2.  *All Subject to Coercion (ASC):* Anyone bound/enforced upon.
          3.  *All Capable of Action (User's Principle):* Anyone whose set of options changes.
      *   *The Twist:* The "wider decision" forces a re-evaluation of the *demos*.

  3.  **Drafting the Activity Structure:**
      *   *Phase 1: The Arbitrary Franchise (15 mins).* Establish the initial group. Give them a small decision. Let them feel excluded/included arbitrarily.
      *   *Phase 2: The Rule Proposal (25 mins).* They realize the arbitrary rule is unfair. They try to make a *better* rule. Who decides the rule? The current arbitrary group? That's the trap.
      *   *Phase 3: The Scope Shift (25 mins).* Introduce the "Department/Next Year" decision. Now the stakes and scope change. Does the *demos* change? If so, who decides *that*?
      *   *Phase 4: Debrief (15 mins).* Reveal the "Boundary Problem," map the experience to theory, discuss the three principles.

      *Correction on Timing:* 80 minutes is tight.
      *   Intro/Setup: 5 mins.
      *   Round 1 (Arbitrary Vote): 15 mins.
      *   Round 2 (Principled Rule): 25 mins.
      *   Round 3 (Scope Shift): 20 mins.
      *   Debrief: 15 mins.
      *   *Total:* 80 mins.

  4.  **Developing the Mechanics:**
      *   *Money:* €25 is real. Need to make sure it's actually spendable or simulate it convincingly. Let's make it real to raise stakes.
      *   *Decision 1:* Food for *this* session + how to spend the last 15 mins of *this* session.
      *   *Decision 2:* A policy recommendation to the Department Head about next year's seminar structure (binding in the sense that the instructor promises to submit it).
      *   *Arbitrary Franchise:* "Red Card" vs. "Blue Card" on entry. Simple, visible, arbitrary.
      *   *The Trap:* When they vote on the *new rule*, only Red Cards vote. Blue Cards object. Red Cards say "We are the voters." Blue Cards say "By what right?"

  5.  **Refining the Principles for the Debrief:**
      *   *AAI:* Did the food decision affect Blue Cards? Maybe not (if they don't eat). Did the Dept policy affect them? Yes (alumni/reputation).
      *   *ASC:* Are Blue Cards coerced? If they are enrolled, yes.
      *   *User's Principle (Option Capacity):* Does the decision change what Blue Cards *can do*?
      *   *Key Insight:* The *demos* isn't fixed; it floats with the decision.

  6.  **Troubleshooting (What goes wrong):**
      *   *Apathy:* €25 might not be enough. *Fix:* Emphasize the time usage (15 mins of class is valuable).
      *   *Confusion:* They might not realize the paradox. *Fix:* Instructor needs to play "Socratic blocker" during Round 2.
      *   *Hostility:* Excluded students might just leave or get angry. *Fix:* Frame it as a simulation game initially, then reveal the theoretical point.
      *   *The "Walk Out" Problem:* As the prompt notes, students can leave. States can't. Need to address this in limitations.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Materials:* Envelopes, cards, cash, timer.
      *   *Timeline:* Needs to be precise.
      *   *Debrief:* Needs to connect specific moments (e.g., "When Sarah asked 'Who decides the rule?'") to the regress.
      *   *Limitations:* Be honest about the artificiality.

  8.  **Addressing the User's Specific Principle:**
      *   The user wants to test: "membership graded by whether the decision changes what a person can do, the set of options available to them."
      *   Let's call this the "Capacity/Option Principle" for the plan.
      *   In the debrief, I need to show where this diverges from AAI and ASC.
      *   *Example:* A foreigner isn't coerced (ASC) and maybe not affected (AAI), but if the decision changes visa rules, their options change (User's Principle). Or, a child is affected (AAI) but lacks capacity (User's Principle).
      *   *In the Activity:* The "Department Decision" affects next year's students (who aren't there). They aren't subject to coercion *now*, but their options *next year* change.

  9.  **Final Review against Constraints:**
      *   No lecture up front? Yes.
      *   Name hidden until debrief? Yes.
      *   Binding decision (food/time)? Yes.
      *   Arbitrary franchise? Yes (Cards).
      *   Principled rule vote? Yes.
      *   Wider decision introduced? Yes.
      *   Test three principles? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.
      *   Final line format? "Activity in one sentence:..."

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Tone:* Professional, pedagogical, supportive but rigorous.
      *   *Clarity:* Use bolding for sections.
      *   *Safety:* Ensure the exclusion doesn't feel *too* personal. Frame it as "Group A" and "Group B" immediately.
      *   *Money:* Make sure the instructor actually brings the cash.
      *   *The "Regress":* Ensure the moment where they try to vote on the voting rule is highlighted.

      *(Self-Correction on the "Wider Decision"):* If the decision binds the department, do *only* current students vote? Or should next year's students vote? They aren't there. This highlights the impossibility. I need to make sure the instructor forces the question: "If this binds next year, why aren't they voting?"

      *(Refining the User's Principle):* The prompt says "membership graded by whether the decision changes what a person can do." This is subtle. It's not just "affected," it's "agency/option set." I need to make sure the debrief distinguishes this from "interests."

      *(Final Line):* Must start with "Activity in one sentence:".

  11. **Final Polish:** Check timing. 80 minutes is very tight for 18 students. Discussion can eat time. I need to instruct the facilitator to be a strict timekeeper.

      *Let's structure the debrief to explicitly map the three principles.*
      1. AAI (Interests)
      2. ASC (Coercion/Law)
      3. ACO (All Capable of Option-change - User's principle)

