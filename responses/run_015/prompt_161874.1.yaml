answer: |-
  # Seminar Plan: The Boundary Trap

  ## 1. Materials & Preparation
  *   **Cash:** €25 in small denominations (coins/notes).
  *   **Cards:** 18 index cards. 10 marked with a **Red Dot** (Voters), 8 marked with a **Blue Dot** (Observers). Shuffle them.
  *   **Ballots:** Two stacks of small paper slips. One stack stamped "VALID" (for Red Dot holders), one stack blank (for Blue Dot holders).
  *   **Decision Slips:** Two large envelopes.
      *   Envelope A: "Session Decision" (Food + Final 15 mins).
      *   Envelope B: "Department Policy" (Binding recommendation for next year's cohort).
  *   **Timer:** Visible to you, not necessarily them.
  *   **Room:** Arrange chairs in a circle. Place the 10 "Red" chairs in the inner circle, 8 "Blue" chairs in the outer ring (or simply hand cards at the door and instruct Reds to sit left, Blues right).

  ## 2. Role Assignments (Arbitrary Franchise)
  *   **The Electorate (Red Dots):** 10 students. They are told they are the "Decision-Making Body" for Phase 1.
  *   **The Excluded (Blue Dots):** 8 students. They are told they are "Stakeholder Observers." They can speak only when invited by a Red Dot.
  *   **The Convener (You):** You do not vote. You enforce procedure only.

  ## 3. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:05 | Arrival & Sealing**
  *   Hand out cards at the door. Do not explain the dots yet.
  *   Once seated, announce: "This seminar is a decision-making body. We have €25 and 15 minutes of class time to allocate. Red Dots are voting members. Blue Dots are observers. You may not swap cards."
  *   *Instructor Note:* Be bureaucratic and neutral. Do not justify the split.

  **00:05 – 00:20 | Phase 1: The Arbitrary Vote**
  *   Open Envelope A. Read the options:
      1.  Pizza for the group + Instructor leads final 15 mins.
      2.  No food + Students discuss final 15 mins freely.
      3.  Snacks + 15 mins early dismissal.
  *   **Rule:** Only Red Dots vote. Blue Dots may lobby Reds but cannot cast ballots.
  *   Conduct the vote. Count publicly. Announce the result is binding.
  *   *Predicted Reaction:* Blue Dots will feel the arbitrariness immediately. Reds may feel awkward or entitled.

  **00:20 – 00:45 | Phase 2: The Rule Proposal (The Trap)**
  *   Announce: "Many of you seem dissatisfied with the franchise rule. We will now vote on a new, principled rule for who gets to vote in this seminar."
  *   Ask the group to draft a rule (e.g., "Everyone enrolled," "Everyone present," "Everyone affected").
  *   **The Crucial Intervention:** When they propose a new rule, ask: "Who votes to adopt this new rule?"
      *   If they say "Everyone," stop them. "The current standing order says only Reds vote on procedure. Do you override the Reds?"
      *   If Reds vote to include Blues, point out: "You are using the arbitrary power to vote away your arbitrary power. Why should Blues accept a gift from a group that had no right to exclude them in the first place?"
      *   If Blues demand a vote, ask: "By what authority? You are not the recognized body."
  *   Let this tension simmer for 10 minutes. Do not resolve it. Let them hit the wall.

  **00:45 – 01:05 | Phase 3: The Scope Shift**
  *   Interrupt the stalemate. Open Envelope B.
  *   Read the new decision: "We are drafting a binding recommendation to the Department Head on whether next year's seminar should be mandatory for all majors. This will alter next year's students' curriculum and fees."
  *   Ask: "Does the *demos* (the voting group) change for this decision?"
  *   *Scenario A:* If they keep the Red Dots, ask: "Why do current students decide for next year's students who aren't here?"
  *   *Scenario B:* If they try to include next year's students, ask: "How? They are not in the room. Can we vote by proxy? Who counts as 'next year'?"
  *   Force them to realize the boundary shifts depending on the *decision*, but there is no meta-vote to decide the boundary.

  **01:05 – 01:20 | Debrief & Theory Mapping**
  *   Reveal the topic: "The Boundary Problem."
  *   Map the experience to theory (see Debrief Script below).
  *   Distribute the food/time according to the Phase 1 vote (honor the binding nature, even if unfair, to prove the point).

  ---

  ## 4. Debrief Script & Theory Mapping

  **Step 1: Name the Problem (5 mins)**
  *   "You just experienced the **Boundary Problem**. To vote democratically, we need a *demos*. To define the *demos*, we need a vote. But who votes on that vote? If the current group decides, it's circular. If no one decides, it's arbitrary."
  *   Reference Phase 2: "When you tried to write a new rule, you hit a regress. You needed a legitimate group to legitimize the group."

  **Step 2: Decision-Relativity of the Demos (5 mins)**
  *   Reference Phase 3: "When the decision shifted from pizza (us) to curriculum (next year), the 'right' group shifted. This shows the *demos* is not a fixed thing (like a nation); it is functional to the decision. But democracy usually assumes a fixed *demos*."

  **Step 3: Testing the Three Principles (5 mins)**
  Draw three columns on the board. Ask students to place the "Blue Dots" in Phase 1 under these criteria:

  1.  **All Affected Interests (AAI):**
      *   *Question:* Did the pizza decision affect Blues?
      *   *Analysis:* If they were hungry, yes. If they care about class culture, yes.
      *   *Problem:* Almost everyone is affected by everything (chain of causality). The boundary becomes too wide (global).
  2.  **All Subject to Coercion (ASC):**
      *   *Question:* Are Blues coerced?
      *   *Analysis:* If they are enrolled, they are subject to the seminar rules.
      *   *Problem:* What about the instructor? They are subject to university rules. What about next year's students (Phase 3)? They aren't coerced *yet*.
  3.  **All Capable of Option-Change (Your Principle):**
      *   *Question:* Did the decision change what Blues *can do*?
      *   *Analysis:* This is distinct from "interests." A foreigner might have an *interest* in your tax law, but their *options* don't change. Next year's students *options* change (mandatory class), so they should be in.
      *   *Divergence:* In Phase 1, Blues' options didn't change much (just lunch). In Phase 3, next year's options change drastically. This principle scales with the decision, unlike ASC which is static.

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "It's Just a Game" Dismissal**
  *   *Risk:* Students treat the exclusion as a role-play and don't feel the normative sting.
  *   *Fix:* Make the money real. Hand the cash to the Red Dot winner immediately. Make the time loss real (end early if they vote for it). The material consequence forces the legitimacy question.

  **2. The Blue Dot Revolt**
  *   *Risk:* Blue Dots refuse to participate or shout down the vote.
  *   *Fix:* If they disrupt, pause and ask: "You are exercising power without a franchise. By what right?" This *is* the lesson. If they walk out, note their names and mark them absent (if permissible) or simply note in the debrief: "You exercised the ultimate exit option. States do not allow that. That is the difference between a seminar and a polity."

  **3. The Red Dot Guilt**
  *   *Risk:* Red Dots refuse to vote or vote to include Blues immediately.
  *   *Fix:* Remind them: "If you vote to include Blues, you are asserting a right to define the franchise that you do not possess under the current rules. You are performing a revolution, not a vote. Own that."

  **4. Time Overrun**
  *   *Risk:* Phase 2 argument eats the debrief.
  *   *Fix:* Hard stop at minute 65. Say: "The bell rings in 15 minutes. Whether we solve this or not, we must debrief." The unresolved tension is pedagogically useful.

  ---

  ## 6. Limitations: What You Must Say Yourself

  This activity cannot reproduce the following, and you must state this explicitly in the final 5 minutes:

  1.  **The Exit Option:** "In this room, if you disagree with the boundary, you can leave. In a state, borders are closed by force. You cannot opt out of taxation or law easily. The stakes of the boundary problem are higher because the exit is blocked."
  2.  **Constitutional Settlement:** "In real democracies, the boundary is usually settled by history, war, or inheritance before anyone votes. We are pretending we can choose it from scratch. Usually, the *demos* is a premise, not a conclusion."
  3.  **Enforcement:** "If the Blue Dots refused to accept the result today, nothing happens. If a minority in a state refuses the boundary, the police enforce it. Democratic theory often ignores the violence required to maintain the boundary."
  4.  **The "All Affected" Infinity:** "In this room, we know who is affected. In the real world, climate policy affects people in Bangladesh. We cannot invite them. The principle is morally sound but institutionally impossible."

  ---

  Activity in one sentence: This simulation forces students to enact the circularity of defining the electorate by subjecting them to an arbitrary franchise that they must attempt to legitimize without presupposing the very authority they lack.
