answer: |-
  Here are eight technical questions designed for a deep-dive podcast interview, structured to press the specific tensions in Tiered Disquotationalism.

  **1. The Boundary Problem & The Scope Ambiguity Defense**
  "You draw a hard line between atomic sentences, which get pure disquotation, and universal claims over infinite domains, which require a minimal correspondence relation because there's no concrete token to disquote. But if correspondence is robust enough to ground truth for infinite generalizations, what prevents it from grounding atomic truths? If the *need* for a truth-maker arises from the inability to point to a token, isn't every atomic sentence also relying on a state of affairs rather than just the token itself? Essentially, why doesn't the boundary collapse into full correspondence theory?"

  *   **[Anticipated Deflection & Hard Pushback]:**
      *   *(Anticipating her reply: She will likely argue this is merely a 'scope ambiguity' in the word 'true'—logical scope for atoms, metaphysical scope for universals.)*
      *   **Host Follow-up:** "If I can press you there: calling it a 'scope ambiguity' feels like a linguistic patch for a metaphysical leak. If the *truth conditions* shift from disquotational to correspondence-based depending on the quantifier scope, then 'true' is no longer a univocal predicate. If the predicate isn't univocal, aren't you just doing correspondence theory for the interesting cases and reserving 'disquotation' as a label for the trivial ones? At what point does 'tiered' just become 'hidden correspondence'?"

  **2. The Liar Paradox & Pragmatic Failure**
  "Regarding the Liar Paradox, you argue that sentences like 'This sentence is false' represent a pragmatic failure of assertion rather than a semantic contradiction. You claim they fail to express a proposition that can be assessed. But if the failure is pragmatic, it implies the sentence fails to hook onto the world in a specific way. Doesn't diagnosing it as a 'failed assertion' secretly smuggle in a hidden correspondence condition? i.e., is it unassertible *because* it fails to correspond to a stable state of affairs, thereby reinstating correspondence as the primary norm even for your disquotational tier?"

  **3. Mathematical Truth & The Token Constraint**
  "Let's apply your token constraint to arithmetic. Take the claim 'There is no largest prime number.' On your view, this falls under the infinite domain tier requiring minimal correspondence. Is this sentence true simply because we lack a concrete token of a largest prime (a negative existential absence), or is it true because the infinite domain *genuinely lacks* one structurally? If it's the latter, aren't you admitting that the truth is doing work independent of our linguistic tokens, which pushes you closer to realism than your disquotational base allows?"

  **4. Negative Existentials & Truthmakers**
  "You grant a minimal correspondence role for negative existentials, like 'There are no unicorns.' Since there is no positive token to disquote, you posit a correspondence to the absence of a fact. But what is the ontological status of this 'absence'? If it's a 'totality fact' about the world, doesn't that commit you to a robust metaphysics of negative facts? And if you have negative facts for Tier 2, why are you forbidden from having positive facts for Tier 1?"

  **5. The Unity of the Truth Predicate**
  "Deflationism usually prizes the unity of the truth predicate—it does one job, universally. Your tiered system suggests 'true' does two different jobs: eliminating quotation marks for atoms, and tracking worldly structure for universals. If a listener asks, 'What is truth?', and the answer is 'It depends on the sentence type,' have you preserved the concept of truth at all, or have you simply created a homonym that obscures the underlying metaphysical commitment?"

  **6. Normativity of Assertion**
  "If truth is disquotational for atoms, the norm of assertion seems to be just 'assert P only if P.' But for your universal tier, where truth involves minimal correspondence, the norm seems to shift to 'assert P only if P corresponds to the domain.' Do these two norms ever come into conflict? Can you imagine a scenario where a sentence is disquotationally acceptable but correspondence-deficient, and if so, which norm overrides?"

  **7. Generalization & Logical Constants**
  "You rely on the distinction between atomic and general claims to switch tiers. But consider a sentence like 'All bachelors are unmarried.' It's universal, but analytically true. Does this get the correspondence treatment because of the 'All,' or does it stay disquotational because the truth is contained in the terms? If you treat logical constants as triggering the correspondence tier, aren't you making logic metaphysical rather than linguistic?"

  **8. The AI Learning Argument (Closing Question)**
  "Finally, imagine a small language model trained *only* on your atomic disquotational sentences—'Snow is white' is true iff snow is white,' etc.—with no exposure to the infinite domain cases. Could this model ever induce your generalization rule to handle universal claims without implicitly representing the correspondence relation you're trying to avoid? If the model cannot learn the Tier 2 rules from Tier 1 data, doesn't that prove the correspondence relation is semantically primitive, not just a pragmatic add-on for infinity?"
