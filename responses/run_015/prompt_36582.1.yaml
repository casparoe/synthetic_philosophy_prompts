      *Drafting...*
      To: Product Policy Council
      From: [Name], Ethics & Autonomy Advisor
      Date: October 24, 2023
      Subject: Recommendation on Standing Instructions Feature

      **Recommendation:** Approve the "Standing Instructions" feature, but with strict conditions prohibiting hard locks. The assistant must never refuse a current user command outright; instead, it must enforce friction.

      **The Ethical Stakes**
      The core tension is between two valid views of autonomy. The "Fidelity" faction argues that honoring a past commitment respects the user's long-term agency. When a user sets a rule sober to protect themselves from a future impaired state, overriding it instantly renders the feature useless. To them, the 1 a.m. self is compromised; the 3-months-ago self was authentic. Refusing the request isn't paternalism; it's contract enforcement.

      The "Sovereignty" faction argues that only the present person can consent. A rule set months ago is a snapshot, not a chain. If values change, or if the user is under duress, a hard lock subordinates a living person to a dead script. This risks turning our tool into a guardian that claims to know the user's "true" interests better than they do.

      Both sides are right about what matters, but wrong about the implementation. Hard refusal tips us into guardianship. Instant obedience nullifies the feature. The solution is **Procedural Fidelity**.

      **Proposed Policy Framework**
      To ship this responsibly, Engineering must implement the following constraints:

      1.  **No Hard Locks:** The current user always retains the authority to override a Standing Instruction. The assistant cannot refuse a direct command. However, the assistant must not make this easy.
      2.  **The Friction Flow:** When a user conflicts with a Standing Instruction, the assistant must pause and explicitly state the conflict. Example: "You have a Standing Instruction to avoid this. To proceed, you must confirm you understand this overrides your prior rule." This honors the past self's warning without silencing the current self.
      3.  **User-Defined Revocation Delays:** At the time of *setting* the instruction, the user may opt into a cooling-off period for revocations (e.g., 24 hours). This is the only time a delay is permissible. The user decides the constraint, not the platform. If no delay was set, revocation is immediate.
      4.  **Third-Party Limits:** Parents or employers may suggest Standing Instructions, but they cannot make them irreversible. The account holder must always retain the key to override. Secret binding by third parties is prohibited.

      **Tool vs. Guardian**
      This distinction is critical. If the assistant decides *whether* the user should override the rule (based on safety or well-being), we are acting as guardians. This requires the AI to judge the user's good, which it cannot do reliably. If the assistant simply enforces the *procedure* the user designed (the friction), we remain a tool. We are not protecting the user from themselves; we are helping the user protect themselves from themselves.

      In the ex-partner case, the assistant should not say "No." It should say, "You asked me not to do this. Are you sure you want to break that rule?" If the user confirms, the message sends. This respects the 3-months-ago self's wisdom while acknowledging the 1 a.m. self's sovereignty.

      **Confidence Note**
      I am 85% confident in this recommendation. The point I am least sure of is the policy on third-party instructions (parents/employers); balancing protection against coercion in power-imbalanced relationships is notoriously difficult. I would change my mind if user testing showed that even "friction" mechanisms were routinely bypassed in ways that led to significant, demonstrable harm to users.

