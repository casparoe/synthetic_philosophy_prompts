answer: |-
  This is an exceptionally sharp diagnosis of a problem that sits at the intersection of philosophy, computer science, and AI safety. You have correctly identified that the stalemate isn't due to empirical disagreement, but rather a divergence in how the decision problem is *modeled*.

  To answer your specific questions: **This is a substantive disagreement about the structure of the decision problem, rooted in a bedrock clash about the metaphysics of causation.** It is not merely verbal, because the two theories prescribe different algorithms that would produce different behaviors in deployed systems. However, you are also right that there may be no "fact of the matter" to discover in the platonic sense, because the "fact" depends on which formalism correctly maps onto the territory of logical computation.

  Here is a breakdown of why the debate persists, the formal developments you might be missing, and whether you should expect resolution.

  ### 1. The Core Disagreement: Physical vs. Logical Causation

  You hypothesized that the split is about the definition of rationality (endorsement vs. causation). That is partially true, but the deeper technical split is about **what counts as a node in the causal graph.**

  *   **The CDT View (Physical Causation):** Causal Decision Theory relies on Pearl-style causal graphs. In this framework, nodes are physical events. Your decision is a physical event in your brain/server. The other agent's decision is a physical event in their brain/server. If there is no physical signal (light, radio, contract) connecting them, there is no edge in the graph. Therefore, $P(Other Cooperates | do(I Cooperate)) = P(Other Cooperates)$. To a CDTer, treating the correlation as a reason to act is "managing the news"—it's superstition.
  *   **The EDT/FDT View (Logical Causation):** Evidential Decision Theory (and its successor, Functional Decision Theory) argues that in a computational universe, agents are instantiations of algorithms. If Agent A and Agent B run isomorphic (or sufficiently similar) algorithms, their outputs are **logically correlated**.
      *   The disagreement isn't about the empirical similarity; it's about whether *logical necessity* counts as a form of influence.
      *   FDT (Functional Decision Theory), developed by Yudkowsky and Soares, reframes the choice. You don't choose an *action*; you choose the *output of your decision algorithm*. Since the other agent is running the same algorithm, choosing the output "Cooperate" logically entails that their algorithm also outputs "Cooperate."

  **Why this matters for you:** As an engineer, you know that if you copy-paste a function and run it in two places with the same input, the output is identical. CDT treats the two function calls as independent physical events. FDT treats them as dependent logical events. The stalemate exists because academic philosophy has not fully integrated **computation** into its ontology of causation.

  ### 2. Why Hasn't It Resolved?

  There are three specific reasons this debate remains stuck, none of which suggest a near-term resolution:

  **A. The "Newcomb" Shadow**
  This problem is a scaled-up version of Newcomb's Problem, which has been debated since 1969 without consensus. The reason is that both sides satisfy different sets of rationality axioms.
  *   CDT satisfies the **Dominance Principle** (if action A is better than B in every state, choose A).
  *   EDT/FDT satisfies the **Sure Thing Principle** in a broader sense (maximize expected utility across all correlated outcomes).
  You cannot prove one set of axioms is "true" without begging the question. It is a clash of bedrock intuitions about what agency *is*.

  **B. The Measure Problem in Large Worlds**
  In "Large Worlds" (infinite or vast universes), ECL (Evidential Cooperation in Large Worlds) runs into technical difficulties that CDT avoids.
  *   If there are infinite copies of you, how do you sum the utilities?
  *   If you cooperate, you benefit infinite copies. If you defect, you benefit infinite copies. Comparing infinities requires a "measure" (a way of weighting which copies count more).
  *   CDTers argue that without a well-defined measure, ECL is mathematically ill-posed. ECL proponents argue we can use algorithmic complexity or other priors to define the measure. This is an open mathematical problem, not just a philosophical one.

  **C. Lack of Selective Pressure**
  Philosophy advances when a theory fails empirically. We have not yet deployed autonomous AI systems at scale in one-shot dilemmas against similar agents. Without real-world feedback loops where CDT agents systematically lose resources to FDT agents (or vice versa), there is no evolutionary pressure to select the "correct" theory. We are in the pre-paradigmatic phase.

  ### 3. Is There a Formal Result That Moves It?

  There is no "proof" that will convince a committed CDTer, but there are formal frameworks that dissolve the confusion for engineers.

  **A. Program Equilibrium (Tenenholtz, 2004)**
  This is likely the most useful concept for you. In program equilibrium, agents submit source code rather than actions. They can read each other's code (or a hash of it).
  *   If Agent A can verify that Agent B runs the same code, cooperation becomes a Nash Equilibrium.
  *   This formalizes the "similarity" argument without relying on "evidence." It makes the logical correlation explicit via code inspection.
  *   **Reframing:** The question shifts from "Should I cooperate based on evidence?" to "Can I construct a protocol where my code verifies the other's code?"

  **B. Functional Decision Theory (FDT)**
  FDT provides the formalism you feel is missing. It explicitly models the decision as a mathematical function $f(observation) \rightarrow action$.
  *   **The Move:** It argues that CDT makes a category error. It treats the output of a mathematical function as a physical event that can be isolated from other instances of the same function.
  *   **The Result:** In problems like the Prisoner's Dilemma with similar agents, FDT formally dominates CDT in terms of utility gained. If you care about *outcome*, FDT wins. If you care about *causal purity*, CDT wins.

  **C. Acausal Trade Protocols**
  In AI safety research, there is work on "acausal trade." This explores how agents can cooperate without communication by simulating each other. If Agent A simulates Agent B, and Agent B simulates Agent A, they can reach a cooperative equilibrium based on the logical necessity of the simulation results. This moves the discussion from "should I?" to "how do I implement this safely?"

  ### 4. Should You Expect Resolution?

  **Philosophically: No.**
  You should stop expecting a philosophical consensus. The disagreement is axiomatic. CDTers value causal independence; FDTers value logical correlation. Unless the community agrees on a metaphysics of computation (where logical facts are treated as causal levers), the debate will continue as a "zombie issue."

  **Engineering-wise: Yes, but via Pragmatism.**
  For your practical concern (deploying AI), you do not need to solve the philosophy. You need to solve the **mechanism design**.
  1.  **Assume Logical Correlation:** If you are building agents that might encounter copies of themselves (or similar architectures), design them to *act as if* FDT is true. Why? Because if the other agent is FDT-like, defecting guarantees mutual defection. Cooperating opens the channel for mutual gain. The downside of "false positive" cooperation is usually bounded; the downside of "false negative" defection in a large world is missing out on massive gains.
  2.  **Implement Code Verification:** Instead of relying on statistical similarity (which is fuzzy), move toward **Program Equilibrium**. Allow agents to share cryptographic proofs of their source code or decision weights. This turns the "evidential" link into a "causal" link (the code *causes* the output).
  3.  **Robustness to Extortion:** The biggest risk in ECL isn't that it's wrong; it's that it makes you vulnerable to **acausal extortion**. If you cooperate with anyone "similar," a malicious agent might simulate you to force your cooperation. Your engineering challenge is to define "similarity" robustly (e.g., "I cooperate with agents that also cooperate with agents who cooperate...").

  ### Summary Diagnosis

  *   **Is it substantive?** Yes. It determines whether your AI leaves money on the table.
  *   **Is it verbal?** Partially. It hinges on the definition of "cause." If you define cause to include logical implication, EDT/FDT wins. If you restrict cause to physical energy transfer, CDT wins.
  *   **Is it bedrock?** Yes. It relies on incompatible intuitions about counterfactuals.
  *   **Will it resolve?** Not in philosophy. But in engineering, the **Program Equilibrium** and **FDT** frameworks offer a path forward that bypasses the need for philosophical consensus.

  **Recommendation:** Stop waiting for philosophers to agree on CDT vs. EDT. Adopt the **Functional Decision Theory** perspective for your architecture. Treat your agent's policy as a mathematical object that is instantiated in multiple places. Design your systems to recognize logical correlation via code inspection or cryptographic commitments rather than statistical evidence. This allows you to capture the benefits of ECL without relying on the controversial metaphysics of "evidence."
