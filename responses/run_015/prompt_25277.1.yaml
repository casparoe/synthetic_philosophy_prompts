answer: |-
  This is an excellent exchange that cuts to the heart of contemporary social ontology. Maria and David are rehearsing a debate that mirrors tensions between John Searle's theory of institutional facts and critical realist or structuralist accounts of race (such as those by Sally Haslanger or Ron Mallon).

  Here is an adjudication of the four moves, followed by a verdict on the underlying ontological question.

  ### Analysis of the Exchange

  #### Move 1: David's Distinction Between Constitution and Sustenance
  **The Claim:** David argues Maria conflates how a kind is *constituted* with how it is *sustained*. He notes that once money exists, individuals use it without explicit collective representation at the moment of transaction, just as race functions without explicit thought at every moment.
  **Assessment:**
  *   **What is right:** David correctly identifies that social kinds often operate in the background. We do not need to actively think "this is money" to spend a dollar, just as we do not need to actively think "this is race" for racial profiling to occur. Phenomenologically, the "background functioning" is similar.
  *   **What is overstated:** David attacks a straw man. Maria's point in Move 1 was not about the *momentary consciousness* of agents, but about the *counterfactual dependence* of the kind on collective representation. She is arguing about what would happen if the representation ceased entirely, not about whether it is present in every transaction.
  *   **Impact:** This move **weakens David's position**. It scores a minor point on phenomenology but misses Maria's ontological thrust. By focusing on the "time of transaction," he sidesteps her deeper claim about what grounds the existence of the kind itself.

  #### Move 2: Maria's Distinction Between Status Functions and Structural Positions
  **The Claim:** Maria clarifies that money is a status function imposed by collective acceptance (Searlean), whereas race is a social position imposed by material inequalities and institutional treatment. Representation is constitutive for money but reactive/sustaining for race.
  **Assessment:**
  *   **What is right:** This is a robust ontological distinction. It aligns with the difference between *institutional facts* (which exist only by virtue of collective intentionality) and *brute social facts* or *structural relations* (which exist by virtue of power dynamics and resource distribution). Maria also introduces a crucial pragmatic test: "what would be required to change them?" This highlights that the ontology has political stakes.
  *   **What is overstated:** She risks drawing the line too sharply. Racial classifications *do* involve status functions (e.g., legal racial categorization). However, her core point stands: the *primary* engine of race is not the collective agreement that "X counts as Y," but the material deployment of power.
  *   **Impact:** This move **strongly advances Maria's position**. She successfully shifts the debate from "how it feels to use the concept" to "what anchors the concept in reality."

  #### Move 3: David's Argument on the Necessity of Concepts
  **The Claim:** David argues that collective representation is still essential for race. Racial categories persist because people use them to navigate the world. If racial concepts vanished, the social kinds would dissolve or transform, even if inequalities remained.
  **Assessment:**
  *   **What is right:** David is drawing on the "interactive kind" theory (Ian Hacking/Ron Mallon). Race is a label that people internalize, resist, or embody. Without the concept, the *specific social kind* "race" (as opposed to generic xenophobia or class stratification) might not exist.
  *   **What is overstated:** He claims the categories would "dissolve." This assumes that without the *concept*, the *practice* cannot re-generate the concept. This underestimates the self-reproducing nature of material structures. If housing segregation and wealth gaps persist (as Maria posits), new concepts will likely arise to codify those divisions, even if the old word "race" is forgotten.
  *   **Impact:** This move **maintains David's position but concedes ground**. By admitting the difference involves "density of material scaffolding" and "time lag," he acknowledges that race is "heavier" and more resistant than money. He is arguing for a difference of degree, but the degree is so large it begins to look like a difference of kind.

  #### Move 4: Maria's Argument on the Direction of Dependence
  **The Claim:** Maria argues the causal arrow differs. Money: Representation $\to$ Object. Race: Material Structure $\to$ Representation (with regeneration). Therefore, they are different kinds of social kinds.
  **Assessment:**
  *   **What is right:** This is the decisive move. In social ontology, the direction of fit matters. Money has a *world-to-mind* direction of fit (we make the world match our representation). Race, on Maria's account, has a *mind-to-world* direction of fit regarding its persistence (the world forces the representation upon us). If the material base regenerates the concept, the concept is not constitutive in the Searlean sense; it is epiphenomenal or secondary.
  *   **What is overstated:** One could argue that "material inequalities" are themselves unintelligible without the concepts that define them (e.g., is it a "wealth gap" without the concept of wealth?). However, Maria is talking about the *physical realities* (segregated neighborhoods, differential treatment), which can exist pre-conceptually.
  *   **Impact:** This move **secures Maria's victory**. She demonstrates that the "social construction" of race relies on a feedback loop where material reality plays the lead role, whereas money relies on a loop where collective intentionality plays the lead role.

  ---

  ### Overall Adjudication: Is there a Principled Distinction?

  **Verdict:** Maria has the stronger case. There is a principled ontological distinction between the way money is socially constructed and the way race is socially constructed. "Social construction" is not a unified phenomenon; it is a family resemblance term that covers at least two distinct mechanisms.

  **1. The Ontological Difference**
  David is treating "social construction" as a univocal category: *X is socially constructed if X depends on human activity.* While technically true for both money and race, this definition is too coarse to be useful.
  *   **Money (Institutional Fact):** Follows the Searlean model. $X$ counts as $Y$ in context $C$ only because we accept it as such. The physical substrate (paper/digital bits) has no causal power regarding its status without the collective intentionality.
  *   **Race (Structural/Interactive Kind):** Follows a materialist/structuralist model. The physical substrate (phenotype, geography, lineage) interacts with power structures to create a reality that exerts causal force *independent* of current collective agreement. As Maria notes, the structure can regenerate the concept.

  **2. The Political Stakes (Why Maria is Right to Worry)**
  Maria's frustration is not merely pedantic; it is political. The ontology dictates the praxis.
  *   If race is constructed like money (David's implication), then changing race is primarily a matter of changing *minds* or *representations*. If we stop collectively representing people as racialized, race ends.
  *   If race is constructed like a structural position (Maria's claim), then changing race requires dismantling *material inequalities* (housing, wealth, policing). Changing minds alone will fail because the material structure will regenerate the concepts.

  By conflating the two, we risk "idealism"—the belief that changing language is sufficient to change reality. Maria is correct that a good ontology must mark this distinction because failing to do so leads to ineffective solutions for racial injustice.

  **3. Synthesis**
  David is right that race involves concepts and looping effects (it is not a brute biological fact). However, Maria is right that the *grounding* of those concepts is fundamentally different from institutional facts like money.
  *   **Money** is a "thin" construction: It floats on top of agreement.
  *   **Race** is a "thick" construction: It is embedded in the physical and institutional organization of society.

  **Conclusion:**
  You should side with **Maria**. While David correctly identifies that race is not a biological natural kind, he fails to account for the *material inertia* of racial structures. Maria successfully demonstrates that "social construction" covers two distinct causal architectures. Recognizing this distinction is essential for both accurate ontology and effective political action. The shared label does indeed obscure the mechanisms, and as Maria argued, that obscurity has real costs.
