answer: |-
  Your hypothesis that the impasse is "mostly verbal" is insightful, but it underestimates the formal and theoretical stakes involved. While it is true that the two sides often talk past one another regarding linguistic usage, the disagreement is not *merely* verbal. It is a substantive disagreement about the **logical expressive power** required of a theory of truth versus the **ontological parsimony** desired by the deflationist.

  Here is a diagnosis of the structure of the disagreement, an evaluation of your hypothesis, and an assessment of what would count as progress.

  ### 1. Diagnosing the Structure of the Disagreement

  The debate is not simply about the definition of the word "truth." It is a tension between three constraints that are difficult to satisfy simultaneously:
  1.  **Disquotation:** The intuition that $T(\ulcorner P \urcorner) \leftrightarrow P$ is fundamental.
  2.  **Generality:** The ability to use truth to make general claims (e.g., "Every sentence of the form $P \lor \neg P$ is true").
  3.  **Consistency:** Avoiding paradox (e.g., the Liar).

  **The Critic's Argument (The Generalization Problem):**
  Critics (such as Gupta, Azzouni, or Jackson) argue that the disquotational schema is an infinite list of instances. Human minds are finite; we cannot grasp an infinite list. To capture the content of "Everything the Pope says is true," we need a finite axiomatization that allows quantification into sentence position. If deflationism relies *only* on the schema, it cannot logically derive these generalizations without adding substantive rules of inference. If it adds those rules, critics argue, it is no longer "deflationary" because the truth predicate is now doing substantive logical work (allowing proofs that the base logic could not achieve).

  **The Deflationist's Reply (The Paraphrase Strategy):**
  Deflationists (like Quine or Horwich) reply that we don't need the truth predicate for generalization; we can use **propositional quantification**. Instead of "All sentences of form X are true," we say "For all propositions $p$, if $p$ is of form X, then $p$."
  *   *The Counter-Critic:* This pushes the problem back. What binds the propositional variables? If the logic of propositional quantification is robust enough to handle these generalizations, isn't *that* logic doing the heavy lifting that the deflationist claimed "truth" wasn't doing?

  **The Core Conflict:**
  The disagreement is about **Conservativeness**.
  *   A strict deflationist theory should be *conservative* over the base theory (e.g., arithmetic). Adding the truth predicate shouldn't allow you to prove new theorems about numbers that you couldn't prove before.
  *   However, standard generalizations about truth (like Reflection Principles: "If $S$ is provable, then $S$ is true") *do* allow you to prove new arithmetic theorems (e.g., the consistency of the system).
  *   **The Real Disagreement:** The critic says, "See? Truth has substantive mathematical power." The deflationist says, "Then we must restrict the generalization or accept that our intuitive use of truth is inconsistent."

  ### 2. Evaluating Your Hypothesis

  **Is it right that the impasse is mostly verbal?**
  **Partially, but not deeply.**

  It appears verbal because the debate often centers on linguistic policing:
  *   *Deflationist:* "That use of 'truth' (e.g., 'Truth is a virtue') is metaphorical or eliminable."
  *   *Critic:* "No, it's a standard nominalization."

  However, calling it "verbal" suggests that if they agreed on definitions, the disagreement would vanish. It wouldn't. The disagreement is about **theoretical utility**.
  *   If the deflationist excludes generalizations to save the schema, their theory fails to model actual mathematical and semantic reasoning.
  *   If the deflationist includes generalizations to model reasoning, their theory often becomes mathematically equivalent to inflationary theories (like Tarskian hierarchies), undermining the claim that truth is "insubstantial."

  Therefore, the dispute over "genuine use" is a proxy for a dispute over **deductive strength**. When a deflationist says a use is "not genuine," they often mean "my theory cannot accommodate this without becoming inconsistent or inflationary." When a critic says it is "genuine," they mean "this is required for the theory to be useful." This is a substantive disagreement about the criteria for a successful philosophical theory, not just a lexical one.

  ### 3. What Would Count as Progress?

  Progress is unlikely to come from one side "winning" via intuition pumps. It would come from formal or methodological shifts.

  **A. A Formal Result (The Conservativeness Proof)**
  Progress would occur if a deflationist could formally demonstrate a theory that:
  1.  Validates all "intuitively valid" inferences involving truth (including generalizations).
  2.  Remains conservative over the base theory (proving no new arithmetic facts).
  3.  Is consistent.
  *Current Status:* Gödelian constraints suggest this is impossible for classical logic. Progress here would require a widely accepted shift to **non-classical logic** (e.g., paracomplete or paraconsistent logics as proposed by Hartry Field). If the philosophical community accepted that classical logic is the wrong tool for truth, the deflationist could accommodate generalizations without inconsistency.

  **B. A Conceptual Distinction (Truth vs. Truth-Aptitude)**
  Progress could come from distinguishing the **logical role** of truth (disquotation/generalization) from the **normative role** of truth (aim of belief, success of action).
  *   Deflationists often try to explain the normative role using only the logical role.
  *   Inflationists argue the normative role requires a robust property.
  *   *Progress:* A hybrid view where deflationism is accepted as the *semantics* of the word "true," while a separate theory (e.g., epistemology or decision theory) handles the *normativity* without positing a metaphysical property of Truth. This dissolves the "completeness" worry by limiting the scope of the theory of truth.

  **C. A Change of Question (Expressivism)**
  The most significant progress might be abandoning the question "Is the theory complete?" in favor of "What is the function of the predicate?"
  *   If the function is purely expressive (to endorse sentences without quoting them), then the failure to capture nominalizations ("Truth is good") is not a failure of the *theory of truth*, but a recognition that those sentences are not in the business of describing truth conditions.
  *   This shifts the burden to the critic to show why nominalizations require a substantive property rather than just different grammatical logic.

  ### 4. Why No Progress Might Be Expected

  There is a reason to be pessimistic about resolution. The impasse persists because the two sides have different **methodological commitments** regarding explanation.

  *   **The Inflationist Demand:** Truth must *explain* something (e.g., "Why did his belief lead to success? Because it was true."). For truth to explain, it must be a causal or robust property.
  *   **The Deflationist Denial:** Truth explains nothing. It is a logical device. The explanation for success lies in the content of the belief and the environment, not the property of truth.

  As long as the critic demands an *explanatory* role for truth and the deflationist denies that truth has *any* explanatory role, they are not disagreeing about the schema; they are disagreeing about the **nature of philosophical explanation**.
  *   The critic views the inability to explain the success of science as a fatal flaw in deflationism.
  *   The deflationist views the attempt to explain success via "Truth" as a category mistake.

  **Conclusion:**
  Your hypothesis is correct that the surface-level argument is verbal (disputing "genuine use"), but this masks a deeper **methodological divide**. Progress will not come from better definitions of "use." It will only come if:
  1.  Non-classical logics become standard enough to allow deflationists to handle generalizations formally without inconsistency.
  2.  Or, philosophers agree to separate the *logic* of truth (deflationary) from the *normativity* of belief (inflationary/pragmatic).

  Until then, the debate will remain a stalemate between those who want truth to be a **tool for logic** and those who want truth to be a **tool for explanation**.
