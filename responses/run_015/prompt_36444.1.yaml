answer: |-
  The **Epistemic Constraint** is the requirement that most effectively destabilizes all three main contenders, and **Continuity with Individual Self-Defense** is jointly unsatisfiable with **Symmetrical Permission**.

  ### The Desiderata

  1.  **Asymmetry of Liability**
      *   **The Requirement:** The theory must ground liability to attack in the objective justice of the cause, such that combatants fighting for an unjust cause are not morally permitted to kill just combatants, even if they are not criminally culpable.
      *   **The Case:** The **Conscripted Teenager on the Unjust Side**. A theory that grants him full moral equality (Traditionalism) fails to capture the intuition that he is harming people who have done nothing to deserve it. A theory that brands him a murderer (hard Revisionism) fails to capture the intuition that he is coerced and ignorant. The theory must distinguish his *liability* (can he be killed?) from his *culpability* (should he be punished?), granting asymmetry without demanding saintly knowledge.

  2.  **Graduated Contribution Threshold**
      *   **The Requirement:** Liability must track causal contribution to the threat, but there must be a non-arbitrary threshold where contribution becomes sufficient for liability without collapsing the distinction between combatant and civilian.
      *   **The Case:** The **Civilian Machinist**. If liability tracks contribution alone, the machinist making fuses is liable. If it tracks status alone, she is immune. An adequate theory must explain why the soldier in the trench is liable while the machinist is not, without relying on the uniform itself as the moral magic wand. It must avoid the "slippery slope" where all taxpayers become liable, while avoiding the "immunity bubble" where essential war producers are untouched.

  3.  **Status-Independence**
      *   **The Requirement:** Liability cannot depend on state affiliation, uniform-wearing, or formal enrollment in a chain of command.
      *   **The Case:** **Partisans and Irregulars**. A resistance fighter without a uniform who poses an identical threat to a uniformed soldier must be assessed identically regarding liability. If the theory relies on "combatant status" (Traditionalism/Conventionalism), it incorrectly immunizes the irregular or incorrectly liabilities the uniformed soldier based on bureaucracy rather than moral threat.

  4.  **The Epistemic Constraint**
      *   **The Requirement:** The theory must accommodate the fact that most soldiers cannot know, and often cannot reasonably be expected to know, whether their cause is just (*jus ad bellum*), without letting this ignorance restore full moral equality.
      *   **The Case:** **The Soldier's Ignorance**. Soldiers operate on invincible ignorance regarding national strategy and secret intelligence. A theory that makes liability turn on objective justice (Revisionism) risks making liability too broad (everyone is liable if they are objectively wrong). A theory that makes liability turn on subjective belief (Traditionalism) risks making liability too narrow (no one is liable if they believe they are right). The theory must explain how ignorance functions as an *excuse* rather than a negation of *liability*.

  5.  **Continuity Thesis**
      *   **The Requirement:** The moral principles governing killing in war must be consistent with the principles governing killing in domestic peacetime, unless a robust justification for discontinuity is provided.
      *   **The Case:** **Peacetime Self-Defense**. If a group of armed men attacks you in your home, you have a right to defend yourself, and they do not have a right to kill you in return simply because they are also armed and acting as a group. The theory must explain why the addition of "war" changes this dynamic. If it claims war changes the dynamic, it must explain why without resorting to circular convention.

  ### The Unsatisfiable Pair: Continuity vs. Symmetry

  You cannot hold both the **Continuity Thesis** and **Symmetrical Permission** (the Moral Equality of Combatants).

  *   **The Conflict:** Under domestic morality (Continuity), an aggressor does not have a right to kill a defender in self-defense. If unjust combatants are analogous to domestic aggressors and just combatants to defenders, unjust combatants cannot have a symmetrical right to kill.
  *   **The Implication:** To save Symmetry (Traditionalism), you must reject Continuity and argue that war creates a unique moral sphere where aggressors gain rights they would lack in a street fight. To save Continuity (Revisionism), you must reject Symmetry and accept that unjust combatants are morally disadvantaged compared to just combatants. There is no stable middle ground: either war is morally special (breaking Continuity) or combatants are morally unequal (breaking Symmetry).

  ### The Knockout Requirement: The Epistemic Constraint

  The **Epistemic Constraint** does the most work to prevent any contender from settling the debate.

  *   **Against Traditionalism:** Traditionalism relies on the Epistemic Constraint to justify Symmetry (soldiers can't know justice, so we treat them as equals). However, this reduces the theory to a convention rather than a moral truth. It fails to explain *why* the convention is binding if it contradicts the deep morality of self-defense (Continuity). It survives only by abandoning moral depth.
  *   **Against Revisionism:** Revisionism accepts Continuity and Asymmetry but crashes into the Epistemic Constraint. If liability tracks objective justice, the ignorant unjust soldier is liable to be killed. This clashes with the intuition that ignorance mitigates moral status. Revisionists must add complex "excuse" clauses to avoid branding every ignorant soldier as liable, which complicates the theory and risks collapsing back into symmetry via the back door of universal excuse.
  *   **Against Conventionalism:** Conventionalism attempts to bridge the gap by arguing that conventions *create* the morality of war. But the Epistemic Constraint exposes the fragility of this: if soldiers cannot know the justice of their cause, they cannot know when the convention applies or if it is overridden by deep morality. It leaves the soldier with no actionable guidance, failing the practical requirement of an ethical theory.

  While **Continuity** kills Traditionalism and **Asymmetry** kills Conventionalism, only the **Epistemic Constraint** ensures that the winner (Revisionism) remains incomplete, preventing the seminar from ever truly "settling anything."
