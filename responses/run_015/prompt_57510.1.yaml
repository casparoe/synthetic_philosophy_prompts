  Good's theorem fails as a pragmatic vindication of conditionalization because it derives the non-negativity of information only by presupposing that the agent will maximize expected utility relative to the very posterior credences whose authority is supposedly being proved.

  The theorem calculates the expected utility of observing evidence by summing over possible outcomes, weighted by prior probability, multiplied by the maximum utility achievable *given the posterior credences*. The illicit work is done by the maximization operator in the posterior state: it assumes that upon receiving evidence, the agent will choose the act that maximizes utility relative to the conditionalized credences. This assumption smuggles the normative conclusion—that the posterior credences are the correct guide for action—into the premise of the calculation. If the agent intended to update by a different rule, or to ignore the evidence, the calculation would not use the posterior to select the act, and the guaranteed non-negativity would vanish. Thus, the theorem proves only that information is valuable *if* you conditionalize, not that you *should* conditionalize.

  The best reply insists the calculation is performed from the prior's perspective, ranking candidate updating plans from the outside without presupposing their rationality. This reply fails to escape the circle for the purpose of vindication because the prior can only assign a high value to the "Conditionalize" plan if it assumes the future self will successfully execute it. To treat the prior's preference as binding on the future self is to assume dynamic rationality—the very norm the theorem is meant to establish. Furthermore, the theorem compares conditionalization only to ignorance, not to alternative updating rules; since a similar theorem can be constructed for any update rule where the agent acts on their new credences, the calculation cannot distinguish conditionalization as uniquely rational. The reply saves the theorem as a consistency constraint for committed Bayesians, but it cannot vindicate conditionalization to an agent undecided on how to update.
