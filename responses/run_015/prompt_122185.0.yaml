answer: |-
  Good morning. Welcome.

  Before we begin, I want you to take a brief look around this room. We have a distinct geography here. On one side, we have colleagues who have spent years arguing that the phrase "Western values" is a category error—a philosophical phantom that dissolves under scrutiny. On the other side, we have colleagues who have used that same phrase in briefing notes, speeches, and strategy documents this week alone, treating it as solid as bedrock.

  Usually, when these two groups meet, the result is frustration. The philosophers feel the policy staff are being careless with the truth. The policy staff feel the philosophers are being useless with reality. One side sees a mirage; the other sees a map.

  My goal for these opening minutes is not to decide who is right. Instead, I want to suggest that both sides are looking at the same object, but describing different mechanisms. To do that, I want to introduce a concept for this workshop: value-ventriloquism.

  We know what a ventriloquist does. They throw their voice. They speak, but the audience perceives the sound as coming from a dummy, a puppet, an external figure. Value-ventriloquism is the rhetorical move where a specific actor—a politician, a party, a bureaucracy—projects their own specific commitments onto an imaginary collective entity called "the West."

  When a leader says, "The West believes in free speech," they are rarely making a sociological claim about every person from Vancouver to Vienna. They are throwing their voice. They are making their own policy preference sound like the utterance of a civilization.

  Why does this matter? Because if we treat "Western values" as a description of reality, the philosophers in this room will spend the next two days proving it false. But if we treat it as a piece of rhetorical technology—a act of ventriloquism—we can see what work it is actually doing. And I suggest it does three specific jobs at once.

  The first job is descriptive, but in a very specific way. It describes a heritage.

  When we invoke Western values, we are constructing a lineage. We are taking a messy, contradictory, violent history and smoothing it into a straight line. We are saying, "We are here because we always believed this." For the historians and philosophers in the room, you know this is where the bodies are buried. The concept glosses over the fact that what we call "Western" today often contradicts what was "Western" fifty years ago.

  But for the policy staff, you know why this is useful. It provides instant legitimacy. It turns a new policy into an inheritance. It says, "I am not inventing this rule; I am merely protecting a legacy." Value-ventriloquism allows the speaker to claim the authority of the ancestors without having to do the work of historical accuracy. It creates a usable past.

  The second job is prescriptive. It moves from what *is* to what *ought* to be.

  This is where the ventriloquism becomes powerful governance. If I say, "I think we should prioritize individual liberty," that is an opinion. You can argue with me. But if I say, "Western values require us to prioritize individual liberty," the debate changes. Now, I am not the source of the demand; the civilization is. To disagree with me is not just to disagree with a policy; it is to betray a heritage.

  For the policy staff, this is a force multiplier. It turns preferences into obligations. It shuts down negotiation by framing the issue as a matter of identity rather than utility. For the philosophers, you recognize this as the naturalistic fallacy dressed in flag clothing. It derives an "ought" from a fabricated "is." But understanding this mechanism helps us see why the phrase is so resilient. It survives not because it is true, but because it is commanding.

  The third job is exclusionary. It draws a boundary.

  Every time the ventriloquist speaks for "the West," they are implicitly defining who is outside the room. Sometimes this is geographic, marking a border against an external "other." But often, it is internal. When we say a policy aligns with Western values, we are implying that those who oppose it are not just wrong, but culturally alien.

  This is the most dangerous function of the trick. It allows a speaker to exclude dissenters from the community without explicitly banning them. They are not cast out; they simply reveal themselves as never having been truly "in." For the policy team, this clarifies allies and adversaries quickly. For the philosophers, this is where the concept becomes ethically fraught. It turns political disagreement into cultural treason.

  So, why are we here for the next two days?

  We are not here to solve the definition of the West. We are not here to produce a list of virtues that finally makes the category coherent. If my argument holds, that is a fool's errand. The phrase is not a container waiting to be filled correctly; it is a tool waiting to be used.

  We are here to trace the strings.

  For the policy staff, I invite you to look at the tool in your hand and recognize its limits. When you use this shorthand, you are not just describing a alliance; you are performing an act of ventriloquism. You are creating heritage, imposing norms, and drawing boundaries. Knowing that might change how you wield it.

  For the philosophers, I invite you to look past the truth-value of the claim and examine its function. The incoherence you see is not a bug; it is a feature. The vagueness is what allows the ventriloquist to throw their voice so effectively.

  Over the next two days, let us not fight over whether the dummy is real. Let us study the ventriloquist. Let us analyze how the voice is thrown, where it lands, and what happens when the audience realizes the puppet cannot speak on its own.

  If we can do that, we might leave here with something more useful than a definition. We might leave with an understanding of how our political language constructs the very reality it claims to describe.

  Thank you, and let's begin.
