answer: |-
  # Workshop Design: The Restoration Clinic
  **Time:** 75 Minutes  
  **Players:** 8 (4 Patients, 2 Controls, 2 Bettors)  
  **Vibe:** Clinical experiment meets high-stakes salon. No slides, no lectures. Just the experience.

  ## 1. The Setup & Materials
  You need to build the "sensory gap" physically. If the props are too good, the philosophy dies.

  *   **The Black Box:** A large cardboard box with two armholes cut in the front. Line the inside with black felt. Put a heavy blanket over the top so no light leaks in when someone leans over.
  *   **The Objects:** 4 distinct shapes. 3D printed is ideal, but wood blocks work.
      *   Cube (sharp edges)
      *   Sphere (perfectly smooth)
      *   Pyramid (pointed vertex)
      *   Cylinder (curved sides, flat tops)
      *   *Crucial:* Wrap them in different textures (sandpaper, felt, smooth plastic) so touch relies on **geometry**, not surface feel.
  *   **The Gloves:** Thick winter wool gloves or leather work gloves. They must numb fine detail enough that you can't "feel" the color or tiny scratches.
  *   **The Visual Test:** A screen or projector. You need 12 images total.
      *   4 Target Images: The actual objects, but photographed from weird angles (e.g., the cube balanced on a corner, the sphere in deep shadow).
      *   8 Distractor Images: Other objects that look similar from that angle (e.g., a square photo frame for the cube, a ball of yarn for the sphere).
  *   **The Audio Twist:** A simple phone app or a facilitator with a whistle.
      *   *Low-tech version:* Facilitator watches the patient's hand. If they touch an edge, facilitator makes a sharp high-pitch sound. If they touch a flat surface, low hum.
      *   *High-tech version:* A distance sensor app that beeps faster near edges.
  *   **Currency:** Poker chips or printed "Vision Tokens."

  ## 2. Role Assignment (5 Mins)
  Don't explain the philosophy yet. Just give orders.

  *   **Patients (4):** You are the candidates for the procedure. Two of you are "Standard Protocol" (Touch only). Two are "Enhanced Protocol" (Touch + Audio).
  *   **Controls (2):** You are the baseline. You have no prior exposure to the specific objects.
  *   **Bettors (2):** You are the investors. You decide if the treatment works. You start with 100 tokens each.

  ## 3. Phase 1: The Blind Phase (15 Mins)
  *   **Patients** go to the Black Box. Blindfolds ON + Thick Gloves ON.
  *   **Task:** You have 10 minutes to explore the 4 objects. You must memorize their geometry.
  *   **Naming:** You must agree on a name for each object based *only* on how it feels (e.g., "The Biter," "The Roller"). Write these down.
  *   **The Twist:** The "Enhanced" Patients (2 of them) get the Audio Feed. When their hand moves over an edge, they hear a tone. They are told this mimics "neural remapping."
  *   **Controls & Bettors** wait outside the room or sit with backs turned. No peeking at the objects.

  ## 4. Phase 2: The Market (5 Mins)
  *   **Patients** stay blindfolded.
  *   **Bettors** are shown the 4 physical objects for 30 seconds so they know what exists, then the objects are hidden.
  *   **Betting:** Bettors wager tokens on this proposition: *"Will the Patients identify the visual photos more accurately than the Controls?"*
      *   **Yes (Patients Win):** Pay 2:1 (Hard to do).
      *   **No (Controls Win/Draw):** Pay 1:1 (Safe bet).
  *   **Controls** are told nothing about the objects.

  ## 5. Phase 3: The Restoration (20 Mins)
  *   **The Reveal:** Patients remove blindfolds and gloves. They are disoriented for a moment (keep lights dim).
  *   **The Test:** Everyone (Patients + Controls) sits at the screen.
  *   **Task:** You will see 12 photos one by one. For each photo, select which of the 4 Object Names it matches.
      *   **Patients:** Match the photo to the object you *held* (e.g., "Is this 'The Biter'?").
      *   **Controls:** Match the photo to the name based on *visual intuition* (e.g., "Does this look like a 'Biter'?").
  *   **Rule:** No talking. No pointing at screens to help others.
  *   **Scoring:** Facilitator tracks correct matches.

  ## 6. Phase 4: The Payout & Debrief (30 Mins)
  This is where the philosophy happens. Do not lecture. Ask questions based on the results.

  **Step 1: Settle Debts (5 Mins)**
  Count the scores. Pay out the tokens. Losers physically hand over tokens. This creates a somatic memory of being wrong.

  **Step 2: The Interrogation (15 Mins)**
  Ask the group these specific questions. Let them argue.

  *   **To the Patients:** "When you saw the photo of 'The Biter,' did you recognize it immediately? Or did you have to translate?"
      *   *Look for:* The feeling of a "gap." Did you have to think "Sharp edge = Corner = Photo shadow"? That delay is the empiricist hurdle.
  *   **To the Audio Patients:** "Did the sound help you see, or did it just distract you?"
      *   *Look for:* Cross-modal confusion. Sometimes adding data makes the signal noisier if the brain doesn't know how to map it.
  *   **To the Controls:** "Why did you bet on yourself? What gave you confidence?"
      *   *Look for:* Assumptions about visual universals.
  *   **To the Bettors:** "Why did you think touch would transfer to sight? What assumption were you making about how the brain works?"

  **Step 3: The Map (10 Mins)**
  Now you can name the concepts. Draw a line on a whiteboard.

  *   **Side A (Rationalism/Nativism):** "I assumed the idea of a 'cube' is innate. If I know it by touch, my brain already knows the concept, so sight should just plug into that existing file." (If Patients won easily).
  *   **Side B (Empiricism/Locke):** "I assumed sight and touch are separate languages. Just because I know the word in Touch doesn't mean I can read it in Sight without learning the translation." (If Patients struggled).
  *   **The Twist Result:** If Audio patients did better, discuss **Synesthesia vs. Substitution**. Does adding a third sense bridge the gap, or does it prove the brain needs *any* spatial map to build vision?

  ## 7. The Reality Check (Read this aloud at the end)
  Be honest about what this game didn't do. This is crucial given your personal context.

  1.  **Acquired vs. Congenital:** Your partner had sight before. Her brain has a "visual memory" file. This game uses sighted people pretending to be blind. Real restoration for her is about *reactivating* old pathways, not building new ones. Molyneux's original question was about people blind from birth. For your partner, the answer is likely "Yes, much faster," because the neural map exists, it's just dormant.
  2.  **Neural Plasticity:** 10 minutes in a box isn't 6 months of blindness. Her brain has been reorganizing for half a year. The "shock" of restoration might be different than the game simulates.
  3.  **The Audio Twist:** Real sensory substitution (like vOICe) takes weeks to learn. In the game, it was instant. If they failed, it's because the map wasn't learned, not because the map is impossible.
  4.  **The "What" vs. The "Where":** This game tests object recognition (What). Restoration often brings back light/motion (Where) first. Recognizing a cube is high-level processing. She might see light and shadow long before she sees a "cube."

  ## 8. Predictable Failure Points (Facilitator Notes)
  *   **The Peek:** Someone will lift the blindfold. **Fix:** Use a sleep mask + a beanie over it. Trust but verify.
  *   **The Giveaway:** The photos are too clear. **Fix:** Use high-contrast black and white filters on the photos. Remove color cues. Make the lighting dramatic (chiaroscuro).
  *   **The Audio Cheat:** The facilitator makes the sound too obvious (e.g., beeping only on the cube). **Fix:** Randomize the audio feedback or make it continuous based on hand speed, not just edges.
  *   **The Naming Trap:** Patients pick names like "Cube." **Fix:** Enforce abstract names ("The Anchor," "The Void"). If they use geometric terms, the Controls have an unfair advantage because they know what a cube looks like.
  *   **Emotional Spike:** Since this is personal for you, the group might tread too lightly. **Fix:** Tell them at the start: "Treat this as a hard experiment. Bad data helps us more than polite data."

  ## 9. Closing Thought
  End the night not with an answer, but with the question.
  *"Molyneux asked if the eyes speak the same language as the hands. Tonight, did you hear them speaking the same language, or did you need a translator?"*

  Let the snack debt sit overnight. It keeps the stakes real.
