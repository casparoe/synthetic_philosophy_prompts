      *   Option A: Keep Truth Conditions, drop Ramsey Test as *semantic* (make it pragmatic). (Stalnaker/DeRose).
      *   Option B: Keep Ramsey Test, drop Truth Conditions (make conditionals non-propositional). (Adams/Edgington).
      *   Option C: Change the logic of Truth Conditions (Restrictor/Dynamic). (Kratzer/Willer).
      *   *Verdict:* The user is mostly right, but the "Use" side isn't just about prediction; it's about the *logical type* of the meaning. The disagreement is substantive regarding the *logical architecture of language*, not just the "purpose." However, for a novel, the "Purpose" framing is the most dramatic and philosophically honest interpretation of the *motivation* behind the choices.
      *   *Refinement:* I will argue that it is a **substantive disagreement about logical type disguised as a methodological dispute.** They aren't just choosing different jobs; they are committed to incompatible ontologies of meaning. But the *reason* they are committed is the user's hypothesis (what they want the theory to explain).

  6.  **Addressing the "Progress" and "Change My Mind" constraints:**
      *   *Progress:* A unified account of embedding for non-propositional conditionals. Or a proof that triviality can be avoided without giving up classical logic.
      *   *Change My Mind:* If someone solves the embedding problem for Adams-style conditionals without resorting to proposition-like proxies. Or if a psychological study shows humans *don't* actually follow the Ramsey test in complex embeddings.

  7.  **Drafting the Response (incorporating the persona):**
