  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I initially thought about calling it "verbal." But it's not. If the linguist says "There is no proposition," and the philosopher says "There is," that's ontological. But the *evidence* they appeal to differs. I should emphasize that the "Purpose" diagnosis explains *why* they pick the ontology they do.
      *   *Correction on Kratzer:* The grad student isn't just muttering; they hold the dominant view in formal semantics. I need to make sure the philosopher character doesn't look stupid for ignoring it, but perhaps they are a *philosophical* logician who cares about the conditional as a distinct connective, whereas Kratzer treats it as a modal modifier. This is a real tension between Phil Logic and Formal Semantics.
