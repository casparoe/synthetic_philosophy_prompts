  9.  **Final Polish:** Check against constraints. No reading list. Definite answer. Flag weak points. Start with brainstorming.

  *(Self-Correction on the "Brainstorming" instruction)*: The prompt asks me to "start by brainstorming the possible diagnoses before you commit to one." I need to make this explicit in the output structure.

