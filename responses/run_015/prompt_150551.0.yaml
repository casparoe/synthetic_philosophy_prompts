answer: |-
  Look, I am sorry you got dragged into refereeing this because it is genuinely one of the hardest texts to pin down, but having read through your summary of their exchange, I can tell you exactly where they stand and where they are stumbling over each other. If we walk through their ten moves in order, you will see that Nadia is winning on what the book actually says, while Marco is winning on why the book is philosophically and ethically terrifying, and neither of them quite lands the final blow because they are both treating faith like a knowledge claim rather than an existential stance.

  Marco opens by calling Abraham a would-be murderer who got lucky, and while this is clearly right from the standpoint of universal ethics, it is clearly mistaken as a reading of the book because Kierkegaard admits this from page one and argues that the religious sphere suspends the ethical precisely so that Abraham cannot be judged by universal murder laws. Nadia is clearly right in her response that this is the book's central thesis about the teleological suspension of the ethical and that the risk of anyone claiming it is the price of inwardness, though she glosses over how dangerous that price is. Marco hits back with a strong point in move three that if the experience is truly unmediable it cannot offer normative guidance, making Abraham either mad or a hypocrite, and I would rate this as clearly right because it identifies the genuine paradox Kierkegaard never fully resolves about how we can admire what we cannot understand. Nadia is clearly right in move four when she distinguishes the knight of infinite resignation from the knight of faith using the double movement and the expectation of getting Isaac back, as this is the core technical distinction of the text. Marco is mostly right in move five to call the criterion unfalsifiable since outwardly the two knights look identical, but he is slightly mistaken to call it merely decorative because for Kierkegaard the inward tension is the whole point, not the outward verification. Nadia is clearly right in move six that silence is the signature of the category and that speaking would reduce Abraham to a tragic hero, which is exactly what the third problem of the book argues. Marco is clearly right in move seven to point out the ethical horror of a duty that forbids justification to the victims, even if that is precisely what makes it religious rather than ethical. Marco becomes clearly mistaken in move eight with the Hannah analogy because he assumes her expectation of restoration is the same as the absurd, ignoring that she has a mediating public purpose. Nadia is clearly right in move nine to spot that Hannah's public purpose puts her back inside the ethical sphere, meaning the test does work to exclude her. Marco is partially right in move ten to say the category is empty of practical guidance, but clearly mistaken to think this invalidates it, since Kierkegaard intends it as a boundary situation rather than a rulebook.

  So who is more right overall? Nadia is more right about what Kierkegaard is actually arguing, because she consistently defends the internal logic of the text against Marco's external ethical critiques, but Marco is more right about the implications of that argument for anyone trying to live by it or judge it from the outside. Nadia successfully protects the coherence of the book's definitions, whereas Marco successfully exposes why those definitions are unusable and dangerous in the real world, which is arguably what Kierkegaard wants us to feel anyway. What both of them are missing, however, is that they are arguing as if Johannes de silentio is giving them a system they can apply, when the pseudonym explicitly states he cannot understand Abraham and is only presenting the anxiety of the attempt. They are both helping themselves to the assumption that faith should be intelligible or actionable, whereas the book is designed to show that faith is a scandal that offends the understanding. They also both ignore the possibility that Kierkegaard is describing a unique category of one rather than a generalizable human potential, which is why Marco's demand for normative work and Nadia's defense of the category both miss the sheer isolation of the knight of faith.

  Now for your question about what happens if the angel had not come, which is the knife edge the whole book balances on. If Abraham counts as a knight of faith because he believes he will get Isaac back in this life by virtue of the absurd, then a version where the knife falls and Isaac stays dead does not falsify the faith, because the faith resides in the movement of the will rather than the empirical outcome. Kierkegaard is not saying Abraham had a guaranteed contract with God that Isaac would survive, but that Abraham believed simultaneously that he must kill Isaac and that he would keep Isaac, holding those contradictions together without resolution. If Isaac dies, Abraham still made the movement of faith up until the moment of the strike, and the tragedy of the outcome does not retroactively turn the inward stance into madness, though it would certainly look like madness to everyone else. The double movement survives because it is about how Abraham relates to the loss while he is living it, not about whether the universe eventually rewards him, otherwise faith would just be a calculation of probable rewards rather than a relation to the absolute. So the belief does not collapse into a claim with content you could be wrong about, because the content is not the survival of Isaac but the impossibility of losing him even while giving him up, which is a paradox that remains true regardless of whether the body breathes or not.
