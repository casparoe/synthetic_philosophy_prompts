answer: |-
  This is a profound and well-recognized puzzle in the metaphysics of causation. You are encountering the intersection of three distinct but related problems: **Omissive Overdetermination** (Case 1), **Omissive Preemption** (Case 2), and the **Problem of Profligate Omissions** (Case 3).

  You asked for the carving: what the phenomenon is, what it is not, and whether it is one thing or several. I will proceed by sketching the candidate concepts from the philosophical literature, testing them against your cases, discarding the unfit, and then settling on the precise conceptual boundary.

  ### 1. Candidate Concepts and Testing

  Here are the five leading frameworks for causation. I will test each against your three cases.

  #### Candidate A: Simple Counterfactual Dependence (The "But-For" Test)
  *Definition:* $C$ causes $E$ if and only if, had $C$ not occurred, $E$ would not have occurred.
  *   **Case 1 (Plant):** **FAIL.** You noted that for each failure (water/shade), it is false that the plant would have survived if that failure were removed. (If watered but no shade, it dies; if shaded but no water, it dies). Neither passes the but-for test individually, yet both are causes.
  *   **Case 2 (Patient):** **PASS (Technically).** Both the Doctor's and Nurse's omissions pass the but-for test. (If Doctor wrote, Nurse gives $\rightarrow$ recovery; If Nurse gave [assuming order], recovery).
  *   **Case 3 (Bystanders):** **FAIL.** A random bystander not sending water also passes the but-for test (if they had sent water, patient lives). This yields infinite causes.
  *   **Verdict:** Discard. It is necessary but insufficient. It cannot handle overdetermination (Case 1) or filter irrelevant omissions (Case 3).

  #### Candidate B: Physical Process Theory
  *Definition:* Causation requires a continuous physical transmission of energy or information (a "causal process") from cause to effect.
  *   **Case 1, 2, 3:** **FAIL.** Omissions are absences. There is no physical process connecting "not watering" to "dying." There is no energy transfer from the doctor's silence to the patient's deterioration.
  *   **Verdict:** Discard. This theory denies omission causation entirely. Since your reports *must* record these as causal factors, this metaphysics is useless for your purpose.

  #### Candidate C: The NESS Test (Necessary Element of a Sufficient Set)
  *Definition:* $C$ causes $E$ if $C$ is a necessary element of a set of conditions that is sufficient for $E$.
  *   **Case 1 (Plant):** **PASS.** {No Water, No Shade} is a sufficient set. No Water is a necessary element of that set. (Also {No Water, Sun} etc.). This handles the overdetermination better than but-for.
  *   **Case 2 (Patient):** **FAIL.** The Nurse's omission is also a necessary element of a sufficient set for deterioration (given the Doctor's omission). It fails to explain why we exclude the Nurse.
  *   **Case 3 (Bystanders):** **FAIL.** A bystander's failure can be constructed as part of a sufficient set (e.g., {Doctor omission, Nurse omission, Bystander omission}). It does not filter the infinite candidates.
  *   **Verdict:** Discard. It improves on Case 1 but fails the selection problem in Cases 2 and 3.

  #### Candidate D: Normative Expectation Accounts (Hart & Honoré; McGrath)
  *Definition:* An omission is a cause only if the agent had a duty, obligation, or reasonable expectation to act.
  *   **Case 1 (Plant):** **PASS.** Maintenance staff had a duty to water; facilities had a duty to shade. Both are causal.
  *   **Case 2 (Patient):** **PASS.** The Doctor had a duty to prescribe. The Nurse had a duty to administer *conditional on a prescription*. Because the condition wasn't met, the Nurse's omission is not a breach of duty in the same way.
  *   **Case 3 (Bystanders):** **PASS.** Bystanders have no duty. They are filtered out.
  *   **Verdict:** **Strong Contender.** This fits all three cases intuitively. However, it conflates *causation* with *blame*. Philosophically, it is debated whether this makes the omission *causally* relevant or merely *morally* relevant. For your reports, this distinction matters: are you listing *causes* or *culpable failures*?

  #### Candidate E: Default/Deviant Causal Models (Hitchcock; Halpern)
  *Definition:* Causation is evaluated relative to a model where some values are "default" (normal, expected) and others are "deviant" (abnormal, unexpected). Only deviant absences count as causes.
  *   **Case 1 (Plant):** **PASS.** Watering and shading are "default" settings for a hospital atrium. Both failures are "deviant." Both count as causes.
  *   **Case 2 (Patient):** **PASS.** Doctor prescribing is "default." Nurse administering is "default" *only if* prescribed. Given the Doctor's deviant omission, the Nurse's non-administration becomes the "default" (normal) response. Only the Doctor's omission remains "deviant."
  *   **Case 3 (Bystanders):** **PASS.** Bystanders not acting is "default." It is not a deviant absence.
  *   **Verdict:** **Best Fit.** This formalizes Candidate D without relying solely on legalistic "duty." It explains the *structure* of the filtering.

  ---

  ### 2. The Carving: What is this Phenomenon?

  Having discarded the insufficient candidates, we can now carve the phenomenon.

  **Is it one thing or several?**
  Metaphysically, it is **several**. Case 1 is *Symmetric Overdetermination by Omission*. Case 2 is *Preemption by Omission*. Case 3 is the *Problem of Profligate Omissions*.
  Pragmatically (for your reporting), it is **one thing**. It is the problem of **Causal Selection**.

  You are not looking for *causation* simpliciter (which is too broad, as shown by Case 3). You are looking for **Causal Salience**.

  The phenomenon you are describing is **Normatively-Indexed Causal Salience**.

  It is not a new metaphysical relation. It is a **filtering function** applied to counterfactual dependencies. The "filter" you suspected in Case 3 is doing **explanatory and normative work**, but in the context of incident reporting, this work *constitutes* the causal attribution. In institutional contexts, a "cause" is not just a difference-maker; it is a **correctable deviation from a system norm.**

  #### The Boundaries of the Concept

  To define this precisely, we must distinguish it from nearby concepts.

  **1. It is not "Blame."**
  *   *Boundary Case:* A junior doctor fails to act because they were incapacitated by a sudden seizure (no fault).
  *   *Application:* Under **Normatively-Indexed Causal Salience**, this is still a causal factor. The system failed to account for the possibility of incapacity. The omission is "deviant" relative to the system model (doctors should act), even if the agent is not blameworthy.
  *   *Edge:* If the omission was *forced* (e.g., the drug was physically unavailable due to a national shortage), it may shift from "deviant" to "default/background condition," removing it from causal salience.

  **2. It is not "But-For Causation."**
  *   *Boundary Case:* A CEO of the hospital trust did not fly in to administer the drug personally.
  *   *Application:* This passes the but-for test. It fails the **Default/Deviant** test. It is "default" that the CEO does not treat patients. It lacks causal salience.

  **3. It is not "Physical Mechanism."**
  *   *Boundary Case:* A machine fails because a part was missing.
  *   *Application:* The "absence" of the part is treated identically to the "absence" of the nurse's action. Both are deviations from the system's functional norm. The metaphysics of the absence (human vs. mechanical) does not change the causal selection logic.

  ---

  ### 3. The Proposed Term and Definition

  Since no single established term captures the *reporting function* you need (blending metaphysics, norms, and system design), I propose we coin the term:

  **System-Deviant Omission (SDO)**

  **Definition:**
  An omission $O$ by agent $A$ is a **System-Deviant Omission** relative to an outcome $E$ if and only if:
  1.  **Counterfactual Dependence:** Had $O$ not occurred (i.e., had $A$ acted), $E$ would likely have been prevented (satisfying the but-for or NESS test).
  2.  **Normative Deviance:** The action required to negate $O$ was a **default expectation** within the operational model of the system at that time.
  3.  **Non-Preemption:** The omission was not rendered "default" by a prior upstream deviation (as in your Case 2, where the Nurse's inaction became normal because the Doctor's order was absent).

  **Why this fits your cases:**
  *   **Case 1 (Plant):** Watering and Shading were both default expectations. Both are SDOs. Report both.
  *   **Case 2 (Patient):** Doctor's prescription was a default expectation (SDO). Nurse's administration was *conditional* default. Given the Doctor's SDO, the Nurse's omission becomes a "System-Consistent Omission" (not a cause). Report only the Doctor.
  *   **Case 3 (Bystanders):** Bystander action is not a system default. Not an SDO. Filtered out.

  ### 4. Boundary Cases for "System-Deviant Omission"

  To ensure you know where this concept stops applying, consider these edge cases:

  **Boundary 1: The "Heroic Expectation" Case**
  *   *Scenario:* A nurse saves a patient by performing a procedure they were not trained to do. They fail in a second instance.
  *   *Analysis:* Is the failure an SDO? No. The action was not a "default expectation." It was supererogatory. The omission is not a causal factor in the report, even if it passes the but-for test.
  *   *Lesson:* SDO relies on *standard operating procedure*, not idealized best outcomes.

  **Boundary 2: The "Inevitable Failure" Case**
  *   *Scenario:* The doctor didn't write the order because the computer system was down for 24 hours.
  *   *Analysis:* The Doctor's omission is now "default" relative to the system state. The **System** (IT) now bears the SDO, not the Doctor.
  *   *Lesson:* SDO can shift upstream. The "filter" moves to the point where the norm was first breached.

  **Boundary 3: The "Conspiracy of Silence" Case**
  *   *Scenario:* Five doctors discuss the patient and *all* agree not to write the order.
  *   *Analysis:* This returns to Case 1 (Overdetermination). All five omissions are deviant from the norm (doctors should treat). All five are SDOs.
  *   *Lesson:* SDO allows for multiple causal factors where counterfactual dependence fails, provided all are normatively deviant.

  ### 5. Final Recommendation for Your Reports

  When filling in the "causal factors" box:

  1.  **Do not look for physical connections.** There are none in omission cases.
  2.  **Apply the Counterfactual Test first.** (Would the outcome have changed?)
  3.  **Apply the Default Test second.** (Was the action expected *in this specific context*?)
      *   If the expectation was conditional on another action (Case 2), check if that prior action occurred. If not, the conditional expectation vanishes.
  4.  **Label the factors as "System-Deviant Omissions."**

  This distinguishes your work from simple blame attribution. You are identifying **breaks in the expected functional chain of the hospital system**, not merely punishing individuals. This protects you from the "Profligate Omissions" problem (Case 3) while allowing you to capture complex joint failures (Case 1).

  **Summary:** The phenomenon is **Causal Selection via Normative Defaults**. The precise term for your context is **System-Deviant Omission**. It is one pragmatic tool applied to two metaphysical structures (overdetermination and preemption).
