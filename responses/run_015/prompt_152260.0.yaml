          *   Include the "hope nobody asks" question.
          *   Advice on concessions vs. holds.

  2.  **Deconstruct the Philosophical Position:**
      *   *Indirect Normativity:* Norms aren't directly about actions but about procedures/conditions (e.g., "do what you would want after ideal reflection").
      *   *Fragmented Identity:* The self isn't one thing over time. It's a series of time-slices with potentially incommensurable values.
      *   *Stability Weighting:* Instead of forcing coherence, weigh fragments by how stable they are under reflection over time.
      *   *Tension:* Traditional practical reason assumes a unified agent who can act on a single plan. If the self is fragmented, who is acting? And if values are incompatible, how is a decision made without arbitrariness?

  3.  **Drafting the Objections (Audience Specific):**

      *   *Kantian Constructivist (The Unity Objection):* This is the big one. If there's no unified agent, there's no agency. Normativity presupposes a "who."
      *   *Decision Theorist (The Representation Objection):* If preferences are inconsistent/incompatible, you can't model them. You get money-pumped or paralyzed. Stability isn't a utility function.
