answer: |-
  # Seminar Prep Sheet: Indirect Normativity & Fragmented Identity

  **Context:** Practical Reason Seminar
  **Your Position:** Idealized deliberation weights value-fragments by diachronic stability, not coherence/unity.
  **Audience:** Kantians (Unity), Decision Theorists (Utility), Meta-ethicist (Skeptic).

  ---

  ## Top Objections (Ordered by Damage Potential)

  ### 1. The "Who is Acting?" Objection (Kantian Constructivist)
  **Damage Level:** 🔴 **Critical** (Friend flagged this as your weak point)
  **Phrasing:** *"You're describing a collision of psychological states, not an agent. Normativity presupposes a standpoint from which reasons are weighed. If your 'self' is just a bundle of incompatible time-slices, who is the subject of the obligation? Without a unified practical identity, you don't have agency, you just have causality."*

  **2-Minute Reply:**
  "I grant that *traditional* constructivism requires a unified standpoint as a precondition. I'm arguing that unity is the *output* of deliberation, not the input. When fragments conflict, the 'agent' isn't a pre-existing entity but the temporary coalition formed by the most stable fragments. The 'who' is the locus of the most diachronically resilient commitment at the moment of action. We don't need a metaphysical unity to have a functional locus of control."

  **📍 Soft Spot:** This risks begging the question. If the coalition dissolves immediately after action, did *agency* occur, or just a temporary takeover? You lack an account of **responsibility** over time. If Time-Slice A acts, can Time-Slice B be held responsible?
  **💡 Fix:** Pivot to *narrative* responsibility. Even if values don't cohere, the *history* of the fragmentation is continuous.

  ### 2. The "Action-Guidance" Objection (General/Pragmatic)
  **Damage Level:** 🟠 **High**
  **Phrasing:** *"Practical reason is supposed to tell you what to do. If your model allows for incompatible values to remain incompatible, weighted only by stability, what happens when Stability A says 'Go' and Stability B says 'Stay' with equal force? Your theory describes a stalemate, not a decision procedure."*

  **2-Minute Reply:**
  "Standard models assume rationality requires resolving the conflict into a single preference. I'm suggesting rationality can mean acknowledging the tragedy of the choice. However, in practice, 'stability under reflection' is rarely equal. One fragment usually degrades faster under pressure. If they are truly equal, the theory prescribes *suspension* of action until further reflection breaks the tie. Paralysis is sometimes the rational outcome."

  **📍 Soft Spot:** "Paralysis is rational" is a hard sell in a practical reason seminar. It sounds like a failure of the theory to guide action.
  **💡 Fix:** Emphasize that *arbitrary* choice is worse than paralysis. If the theory can't decide, the world hasn't given you enough reason yet.

  ### 3. The "Stability isn't Normativity" Objection (Meta-ethicist)
  **Damage Level:** 🟡 **Medium**
  **Phrasing:** *"This is the classic indirect normativity cop-out. You're deriving an 'ought' from a psychological 'is'. Just because a value-fragment survives reflection over time doesn't mean it's *good*. A stable delusion is still a delusion. Why is stability normative?"*

  **2-Minute Reply:**
  "I'm not claiming stability creates value ex nihilo. I'm claiming stability is a *filter* for noise. Immediate desires are often artifacts of bias, framing, or transient states. Diachronic stability is a proxy for 'withstands scrutiny.' It's not that the stable thing is inherently good, but that the unstable thing is likely a distortion of the agent's own evaluative capacity."

  **📍 Soft Spot:** This conflates *resilience* with *truth*. A deeply held prejudice is stable. You need to distinguish between stability due to *reason* vs. stability due to *rigidity*.
  **💡 Fix:** Add "reflective" to stability. It must survive *critical* reflection, not just persistence.

  ### 4. The "Money Pump" Objection (Decision Theorist)
  **Damage Level:** 🟢 **Low** (Technical, less existential)
  **Phrasing:** *"If your preferences are intransitive across time slices because they don't cohere, you're vulnerable to dynamic inconsistency. You'll make plans at T1 you abandon at T2. That's not fragmentation, that's just irrationality modeled poorly."*

  **2-Minute Reply:**
  "Decision theory models agents as utility maximizers. I'm modeling agents as *negotiators* between temporal parts. Dynamic inconsistency isn't always an error; sometimes the information set at T2 is genuinely different. My model accounts for this by weighting the T2 fragment's stability *from the perspective of T1*. It's not a bug, it's a feature of temporal embodiment."

  **📍 Soft Spot:** DTs hate "embodiment" excuses. They want a formal constraint.
  **💡 Fix:** Don't fight the math. Argue that your weighting system *creates* a new function that is consistent, even if the underlying fragments aren't.

  ---

  ## 🛑 The Question You Hope Nobody Asks
  **"If fragmentation is total, why not just be a Humean bundle theorist and drop the normativity altogether? Why call this 'practical reason' instead of just 'psychological weather reporting'?"**

  *Why it's dangerous:* It cuts to the core of whether you are doing ethics or psychology. If you can't explain why the *most stable* fragment has *authority*, you're just doing sociology.
  *Prepared Answer:* "Because the deliberation itself is normative. The process of weighing stability is an active endorsement, not a passive observation. The 'weather' doesn't weigh itself."

  ---

  ## Strategy: Concede vs. Hold

  ### ✅ What to Concede Up Front
  1.  **Unity is an Ideal:** Do not say unity is worthless. Say it is a *regulative ideal* that is often unattainable, not a precondition for entry. This disarms the Kantians slightly.
  2.  **Stability isn't Sufficient:** Admit that stability alone doesn't make a value *moral*. It just makes it *yours* for the purpose of agency.
  3.  **Responsibility is Hard:** Acknowledge that your view makes diachronic responsibility (blame/praise) messier. Don't pretend it doesn't.

  ### 🛡️ What to Hold Hard
  1.  **Fragmentation is Real:** Do not let them gaslight you into "deep down we are unified." Empirical psychology and phenomenology support fragmentation.
  2.  **Indirect Normativity is Necessary:** Direct normativity (just knowing the good) fails when the self is split. You need a procedure to adjudicate between selves.
  3.  **Incompatibility is Permanent:** Do not agree that ideal reflection *must* eventually reconcile all values. Some conflicts are tragic and permanent.

  ---

  ## Specific Advice on the "Unity" Objection (Friend's Warning)
  Your friend is right; this is your vulnerability. The Kantians will smell blood here.
  **The Pivot:** When they ask "Who is acting?", do not try to define a new metaphysical self.
  **Say this:** *"I am shifting the question from 'Who is acting?' to 'Which commitment is governing?' Agency is a property of the *process*, not the *substance*. If the process of diachronic weighting governs the action, that constitutes agency enough for normativity, even if the substrate is fragmented."*
  **Why:** It moves the debate from metaphysics (where you lose) to procedure (where you win).
