  ok so i just had this long argument with my friend about indirect normativity and whether it still applies when your practical identity is totally fragemented—not just conflicting desires, but values that literally don't cohear across time slices. i'm defending this view that idealized deliberation shouldn't aim for coherence with one unified self but should weight value-fragments by their stablity under diachronic reflection, even if they stay incompatible. next tuesday i'm presenting it to a practical-reason seminar: mostly kantian constructivists who think agency requires unity, a couple decision theorists who model everything as utility functions, and one meta-ethicist who thinks indirect normativity is basically a cop-out. i need a prep sheet for the q&a—the actual objections they'll raise, ordered by how much damage they'd do, each phrased the way they'd phrase it, with a two-minute reply and a note on where the reply is softest. my friend said my answer to the 'unity of agency' objection is weak, so flag that one specifically. also include the question i'm hoping nobody asks, and tell me what i should concede up front versus what i have to hold.
