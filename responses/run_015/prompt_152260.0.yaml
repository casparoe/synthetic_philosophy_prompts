      *   **Topic:** Indirect normativity applied to a fragmented practical identity (values that don't cohere across time slices).
      *   **User's View:** Idealized deliberation shouldn't aim for a unified self but should weight value-fragments by their stability under diachronic reflection, even if incompatible.
