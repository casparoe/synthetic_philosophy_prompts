      *   **Tone:** Direct, analytical, specific to the constraints.

  2.  **Evaluate the Candidate Questions:**
      *   (a) Lexical priority vs. threshold: Core axiological question. Determines trade-offs between intense suffering and mild suffering/happiness. High impact on prioritization.
      *   (b) Population ethics asymmetry (person-affecting vs. impersonal): Crucial for longtermism vs. near-termism. If asymmetry collapses, longtermist SFE might look very different (e.g., anti-natalism vs. reducing future suffering populations).
      *   (c) Uncertain sentience/credence: High practical impact for animal welfare (invertebrates, AI). Conceptual clarity on how to weight moral uncertainty vs. empirical uncertainty.
      *   (d) Benign addition/benign removal (the "reductio" about killing sufferers): Classic objection to negative utilitarianism. Resolving this determines whether SFE implies active elimination of sufferers (highly controversial/practically limiting).
      *   (e) Measurability vs. mind-independence: Metaphysical/epistemological. Important for operationalization, but might be secondary to axiological structure.
      *   Roommate's view (Threshold lexicality with credence-discounted uncertain suffering): A specific hybrid view. Researching this specific view might be too narrow compared to the underlying principles.

  3.  **Determine Upstream/Downstream Relationships:**
      *   Population ethics (b) is very upstream. If the asymmetry doesn't hold or implies something else, it changes the scope of *whose* suffering matters (future vs. present).
      *   Lexicality/Thresholds (a) is upstream of trade-offs. If suffering is lexical, you can't trade it for happiness. If thresholded, you might ignore mild suffering.
      *   Uncertain Sentience (c) is downstream of axiology but upstream of cause selection (animals/AI).
      *   The "Killing" objection (d) is crucial for legitimacy and practical constraints. If SFE implies killing sufferers, it's practically dead or requires massive revision.
      *   Measurability (e) is somewhat downstream; you need to know *what* matters before deciding *how* to measure it, but if it's unmeasurable, the theory is action-guidingless.

