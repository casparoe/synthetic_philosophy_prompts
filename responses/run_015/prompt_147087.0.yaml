answer: |-
  1. Investigate whether the asymmetry between creating suffering and creating happiness survives non-person-affecting frameworks, as this determines if longtermism remains coherent for suffering-focused views. If researchers prove the asymmetry collapses into total utilitarianism, the portfolio must shift entirely to near-term harm reduction. This is the most upstream question because it defines the temporal scope of all subsequent moral calculations.

  2. Analyze whether the implication that painless killing reduces suffering constitutes a fatal reductio or can be blocked by side-constraints without ad hocery. A successful defense here legitimizes active intervention policies, while failure forces the community to abandon any strategy involving population reduction. Tractability is high since this relies on existing deontological versus consequentialist literature rather than new data.

  3. Determine if suffering takes lexical priority over happiness at all intensities or only above a specific threshold, as this dictates trade-offs between extreme torture and widespread mild discomfort. Finding a defensible threshold would pivot funding toward preventing severe acute suffering rather than maximizing aggregate welfare improvements. This is neglected relative to its impact on cause prioritization between mental health and existential risk.

  4. Clarify whether moral uncertainty about sentience requires expected value maximization or a distinct credence-discounted framework for possibly-sentient minds. Resolving this changes the weight assigned to invertebrate welfare and potential AI suffering within the current budget. A result favoring credence-discounting would significantly lower the priority of speculative sentience research compared to confirmed vertebrate suffering.

  5. Evaluate the coherence of hybrid views like threshold lexicality with credence-discounted uncertain suffering to see if they avoid the pitfalls of their component theories. If these hybrids prove unstable under reflection, funders should stick to pure axiological frameworks rather than complex compromises. This is lower priority because it depends on the outcomes of the lexicality and sentience questions above.

  6. Defund the question of whether suffering axiology should be specified over measurable quantities versus mind-independent facts, as this is largely an empirical psychophysics question wearing a philosophical costume. Unless researchers show measurability constraints fundamentally alter normative theory, this remains a lower-order metric issue that won't change practical goals. Resources here are better spent on the normative structure of the view rather than its operationalization.
