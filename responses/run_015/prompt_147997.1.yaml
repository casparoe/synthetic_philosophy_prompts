answer: |-
  # Dialectical Map: Practical Factors in Knowledge

  **Root Commitment:** Competent speakers' willingness to attribute knowledge varies with stakes (evidence/truth fixed), not explained by carelessness.

  **Node 1:** Is this variation a mistake speakers make?
  *[Gloss: Error Theory vs. Real Phenomenon]*
  *[Empirical Flag: Yes]*
  ├─ **Yes** → **Leaf 1:** Speakers are systematically mistaken about knowledge attributions. (Error Theory) *Awkwardness: Implies widespread incompetence in ordinary language.*
  └─ **No** → **Node 2:** Does the sentence literally say different things in different contexts?
      *[Gloss: Semantic Contextualism vs. Invariantism]*
      ├─ **Yes** → **Leaf 2:** The content of 'knows' shifts with conversational context. (Contextualism) *Awkwardness: Makes genuine disagreement across contexts impossible.*
      └─ **No** → **Node 3:** Whose stakes drive the variation?
          *[Gloss: Subject-Sensitive vs. Attributor-Sensitive]*
          *[Empirical Flag: Yes]*
          ├─ **Attributor** → **Node 4:** Do conflicting attributions contradict each other?
              *[Gloss: Relativism vs. Non-Indexical Contextualism]*
              ├─ **Yes** → **Leaf 3:** Truth is relative to the attributor's context of assessment. (Relativism) *Awkwardness: Abandons absolute truth for knowledge claims.*
              └─ **No** → **Leaf 4:** Speakers talk past each other; no genuine contradiction occurs. (Non-Indexical Contextualism) *Awkwardness: Denies intuitive sense of disagreement.*
          └─ **Subject** → **Node 5:** Must the subject appreciate the stakes?
              *[Gloss: Accessibility Requirement]*
              *[Empirical Flag: Yes]*
              ├─ **No** → **Leaf 5:** Stakes raise the bar even if the subject is unaware. (Subject-Sensitive Invariantism) *Awkwardness: Knowledge depends on facts outside subject's ken.*
              ├─ **Yes** → **Node 6:** Do moral costs work like prudential ones?
                  *[Gloss: Moral Encroachment]*
                  ├─ **No** → **Leaf 6:** Only prudential costs affect knowledge; moral wrongs do not. (Unnamed) *Awkwardness: Arbitrary distinction between cost types.*
                  └─ **Yes** → **Node 7:** Does the effect extend to justification?
                      *[Gloss: Scope of Encroachment]*
                      ├─ **Yes** → **Leaf 7:** Practical factors bear on justification and evidence too. (Pragmatic Encroachment) *Awkwardness: Blurs line between epistemic and practical rationality.*
                      └─ **No** → **Node 8:** Does volume of judgements matter?
                          *[Gloss: Aggregation View]*
                          ├─ **Yes** → **Leaf 8:** High volume of trivial judgements raises the bar. (Unnamed) *Awkwardness: **Unexplored**; risks making knowledge impossible for busy agents.*
                          └─ **No** → **Node 9:** Is the variation merely proper assertion?
                              *[Gloss: Pragmatic Invariantism]*
                              ├─ **Yes** → **Leaf 9:** Knowledge is fixed; stakes only affect when one may claim it. (Pragmatic Invariantism) *Awkwardness: Must explain away strong intuition that knowledge itself varies.*
                              └─ **No** → **Leaf 10:** **Unoccupied**; denies datum but accepts variation is real. (Incoherent) *Awkwardness: **Incoherent**; contradicts Node 1.*

  **Alternative Paths (Thinly Occupied)**
  *These branches isolate specific case intuitions not fully captured above.*
  ├─ **Node 10:** Do stakes after belief formation matter? (Case v)
      *[Gloss: Temporal Sensitivity]*
      └─ **Yes** → **Leaf 11:** Knowledge status changes retroactively. (Unnamed) *Awkwardness: **Unattractive**; violates stability of past facts.*
  ├─ **Node 11:** Does inverted stakes (gain if wrong) lower the bar? (Case vi)
      *[Gloss: Directionality]*
      └─ **Yes** → **Leaf 12:** Benefits of error lower the epistemic bar. (Unnamed) *Awkwardness: **Unexplored**; counter-intuitive incentive structure.*
  ├─ **Node 12:** Does subject never acting matter? (Case iv)
      *[Gloss: Action-Connection]*
      └─ **Yes** → **Leaf 13:** Knowledge requires possibility of action. (Unnamed) *Awkwardness: **Unexplored**; excludes theoretical knowledge.*
  └─ **Node 13:** Does hearer reliance matter for speaker? (Case ix)
      *[Gloss: Hearer-Sensitivity]*
      └─ **Yes** → **Leaf 14:** Speaker's knowledge depends on hearer's stakes. (Unnamed) *Awkwardness: **Unexplored**; makes knowledge overly relational.*

  ### Coverage Table

  | Path | View Label | Status |
  | :--- | :--- | :--- |
  | 1-Yes | Error Theory | Occupied |
  | 1-No, 2-Yes | Contextualism | Occupied |
  | 1-No, 2-No, 3-Attr, 4-Yes | Relativism | Occupied |
  | 1-No, 2-No, 3-Attr, 4-No | Non-Indexical Contextualism | Occupied |
  | 1-No, 2-No, 3-Subj, 5-No | Subject-Sensitive Invariantism | Occupied |
  | 1-No, 2-No, 3-Subj, 5-Yes, 6-No | Unnamed (Prudential Only) | **Thin** |
  | 1-No, 2-No, 3-Subj, 5-Yes, 6-Yes, 7-Yes | Pragmatic Encroachment | Occupied |
  | 1-No, 2-No, 3-Subj, 5-Yes, 6-Yes, 7-No, 8-Yes | Unnamed (Aggregation) | **Empty** |
  | 1-No, 2-No, 3-Subj, 5-Yes, 6-Yes, 7-No, 8-No, 9-Yes | Pragmatic Invariantism | Occupied |
  | 1-No, 2-No, 3-Subj, 5-Yes, 6-Yes, 7-No, 8-No, 9-No | Incoherent | **Empty** |
  | 10-Yes | Unnamed (Temporal) | **Thin** |
  | 11-Yes | Unnamed (Inverted) | **Empty** |
  | 12-Yes | Unnamed (Action) | **Thin** |
  | 13-Yes | Unnamed (Hearer) | **Empty** |

  **Key:** Path 1-Yes → Leaf 1. Path 1-No, 2-No, 3-Subj, 5-No → Leaf 5. (Use tree structure to trace).

  ### Indistinguishable Pairs

  1.  **Leaf 5 (Subject-Sensitive, No Access) vs. Leaf 14 (Hearer-Sensitivity).**
      *   *Diagnosis:* Inseparable given current cases. Both predict variation when subject is unaware but stakes are high.
      *   *Separation:* Requires a case where subject stakes are high, hearer stakes are low, and subject is unaware. If knowledge vanishes, Leaf 5 wins; if it remains, Leaf 14 wins.
      *   *Status:* Inseparable given allowed cases; separable in principle.
  2.  **Leaf 6 (Prudential Only) vs. Leaf 7 (Moral/Prudential).**
      *   *Diagnosis:* Inseparable in principle if moral costs always entail prudential costs (e.g. guilt, sanction).
      *   *Separation:* Requires a 'pure moral' case with zero prudential fallout for the subject.
      *   *Status:* Inseparable in principle (likely).

  ### Walkthrough Profiles

  1.  **The Purist:** Believes knowledge is fixed by evidence and truth.
      *   *Path:* Rejects Root Commitment (Node 1).
      *   *Landing:* **Leaf 1 (Error Theory)** or **Leaf 9 (Pragmatic Invariantism)** depending on whether they think speakers are mistaken or merely restricted in assertion. Most Purists land Leaf 9.
  2.  **Subject Stakes View:** Thinks the subject's own stakes raise the bar.
      *   *Path:* Node 1 (No) → Node 2 (No) → Node 3 (Subject) → Node 5 (Yes/No).
      *   *Landing:* **Leaf 5** (if unaware stakes matter) or **Leaf 7** (if aware stakes matter and scope is broad).
  3.  **The Aggregation View:** Thinks volume of judgements raises the standard.
      *   *Path:* Node 1 (No) → Node 2 (No) → Node 3 (Subject) → Node 5 (Yes) → Node 6 (Yes) → Node 7 (No) → Node 8 (Yes).
      *   *Landing:* **Leaf 8**. Flagged as **Empty/Unexplored**. This view admits the datum but locates the cause in decision volume rather than single-case stakes.

  ### Notes on Empirical Flags
  Nodes 1, 3, and 5 are marked empirical. Experimental epistemology has not settled whether ordinary speakers truly vary attributions due to stakes (Node 1), whose stakes matter most (Node 3), or whether awareness is required (Node 5). Do not treat these answers as settled by intuition alone.

  ### Instructions for Use
  1.  **Quiz:** Give students a path (e.g., 1-No, 2-No, 3-Attr, 4-Yes) and ask for the view (Leaf 3).
  2.  **Verification:** Give students a view (e.g., Relativism) and ask for the path (1-No, 2-No, 3-Attr, 4-Yes).
  3.  **Discussion:** Focus on the **Empty** leaves. Ask students to construct a case that would make these views attractive or show why they are incoherent.

