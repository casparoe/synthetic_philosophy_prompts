answer: |-
  1. **Brainstorm**
  I considered infinite descent and necessary truths, but both allow students to hide behind standard objections. The 'residue' case—isolated ungrounded facts—forces a direct confrontation with the purpose of fundamentality. It tests whether students see 'fundamental' as a structural role (building reality) or a mere negative status (lacking grounds). This distinction separates those who understand grounding as an explanatory structure from those who treat it as a taxonomy.

  2. **The question**
  **Question 1 (25 Marks)**
  Standard introductions define the fundamental as the ungrounded. Consider a fact *F* that is ungrounded, yet nothing else is grounded in *F*. Let us call ungrounded facts on which others depend *core*, and ungrounded facts on which nothing depends *residue*.
  Is *F* fundamental? In your answer, evaluate whether 'fundamental' should be defined simply as 'ungrounded' or whether it requires a further condition, such as playing a role in grounding others. Discuss whether the existence of residue would undermine the claim that grounding structures all of reality. Avoid mere stipulation; argue for why the connection between ungroundedness and fundamentality holds or fails in this case. You may use the terms *core* and *residue*, but precise definitions matter more than terminology.

  3. **What it is testing**
  This tests the student's ability to distinguish between a definitional stipulation and a substantive theoretical claim. They must recognize that equating fundamentality with ungroundedness presupposes that every ungrounded fact contributes to the structure of reality. A successful answer identifies that if 'residue' exists, the standard biconditional is false, not merely counterintuitive. It requires understanding fundamentality as an explanatory role rather than a negative property. Many students treat the biconditional as analytic; this question forces them to defend it as synthetic.

  4. **Model answer**
  The standard view posits a biconditional: a fact is fundamental if and only if it is ungrounded. On this view, the case of *F* is straightforward. Since *F* is ungrounded, *F* is fundamental. However, this answer treats the biconditional as a definition rather than a substantive claim about metaphysical structure. If we treat it as a definition, the question becomes trivial. To answer seriously, we must ask what fundamentality is *for*.

  Grounding is introduced as a relation of metaphysical determination or explanation. The fundamental is typically characterized as the base upon which the rest of reality rests. It is the terminus of explanation. If *F* is ungrounded but grounds nothing, it is metaphysically isolated. It does not support anything else. Let us call this *residue*. If *F* is residue, calling it 'fundamental' severs the link between fundamentality and explanatory priority. It reduces 'fundamental' to a negative property: merely lacking a ground.

  This matters because grounding is supposed to structure reality. If residue exists, there are facts that are neither explained nor explanatory. They sit outside the directional flow of metaphysical determination. If we insist *F* is fundamental, we admit that fundamentality does not imply explanatory importance. But if fundamentality is about what builds reality, *F* should not count. Instead, we should define the fundamental as *core* ungroundedness: facts that are ungrounded and upon which others depend.

  This implies the standard biconditional is not analytic. It is a substantive hypothesis that no residue exists. This hypothesis is sometimes called *No Idlers*. Defending it requires arguing that every ungrounded fact must play a role in grounding something else. Perhaps reality is a unified whole, and isolated facts are impossible. Or perhaps any fact that exists must contribute to the nature of something else. If we cannot argue for this, the biconditional fails.

  If the biconditional fails, the claim that grounding structures *all* of reality is threatened. Residue would be real but unstructured by grounding. It would be ontologically present but metaphysically idle. A student who simply asserts *F* is fundamental because it is ungrounded misses this structural implication. They reproduce the slogan without understanding the theoretical work it performs. The better answer recognizes that equating 'fundamental' with 'ungrounded' buys us a tidy taxonomy only if we assume away residue.

  Therefore, *F* is not fundamental if fundamentality entails explanatory role. The existence of residue shows that ungroundedness is necessary but not sufficient for fundamentality. We must argue for *No Idlers* to save the standard view. Treating the biconditional as a definition hides this requirement. An adequate metaphysics must explain why there are no idle facts, not merely define them away. The structural integrity of grounding depends on this argument, not on vocabulary.

  5. **Marking scheme**
  1.  **Reconstruction of the biconditional (5 marks):** Correctly states the standard view. *Deduct if student treats it as undeniable truth rather than a view.*
  2.  **Analysis of the residue case (5 marks):** Identifies that *F* is isolated. *Deduct if student ignores the "grounds nothing" stipulation.*
  3.  **Definition vs. Substance (5 marks):** Distinguishes analytic definition from synthetic claim. *Deduct if student argues purely by stipulation.*
  4.  **Explanatory Role Argument (5 marks):** Argues fundamentality implies building/explaining. *Deduct for conflating ungroundedness with explanatory power.*
  5.  **Structural Integrity/No Idlers (5 marks):** Connects residue to the claim that grounding structures all reality. *Deduct if conclusion ignores the threat to structural unity.*

  6. **A borderline B answer**
  According to the standard view introduced in the course, a fact is fundamental if and only if it is ungrounded. In the case of *F*, we are told it is ungrounded. Therefore, by definition, *F* is fundamental. The question asks if we need a further condition, like grounding others. However, the survey chapter defines the fundamental as the ungrounded base. Whether *F* grounds anything else seems secondary to its own status. If *F* has no ground, it is at the bottom. So *F* is fundamental. The existence of residue does not change this definition. It just means there are multiple fundamental facts. This preserves the asymmetry and irreflexivity of grounding. The student who says *F* is not fundamental is changing the definition provided in the seminars.
