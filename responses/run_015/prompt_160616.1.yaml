answer: |-
  You are very close with your "office-debt test," but it is too broad on *timing* and too narrow on *role*. It catches the regulator because it treats future potential as present debt, and it conflates the mayor and legislator because it treats all official power as the same kind of currency.

  Here is the principle that reconciles your verdicts, followed by the costs of adopting it.

  ### The Principle: Displaced Fidelity within the Sphere of Office

  Corruption occurs when an office-holder allows a **private fidelity** (to a donor, friend, or future employer) to displace a **public fidelity** (to the rules, the queue, or the common good) **within the specific sphere of discretion assigned to that office.**

  This relies on two sub-rules:
  1.  **The Sphere Match:** Political offices (Legislators, Mayors setting policy) are *supposed* to be partial to their supporters. Administrative offices (Procurement, Regulators, Utility workers) are *supposed* to be neutral. Corruption happens when you import political partiality into an administrative sphere, or private gain into any sphere.
  2.  **The Transactional Moment:** The debt must be dischargeable *by an act in the current tenure*. Future contingent rewards are conflicts of interest, not corruption, until the act is traded.

  ### How this sorts your cases

  **1. The Mayor vs. The Legislator (The Sphere Match)**
  This is the key to your inconsistency.
  *   **The Legislator:** Her sphere is *political*. Her fidelity is supposed to be to her ideology and her backers. Taking 2 million to support her campaign and then voting her conscience is not displaced fidelity; the money supported her *political existence*, and the vote supported her *political mandate*. The spheres match.
  *   **The Mayor:** Her sphere in this instance was *administrative* (procurement). Procurement requires neutrality (best value, open bid). By steering a no-bid contract to a campaign donor, she imported political partiality into an administrative sphere. She displaced fidelity to the *process* with fidelity to the *donor*.
  *   **Verdict:** This holds your intuition. The Mayor is corrupt; the Legislator is not.

  **2. The Regulator (The Transactional Moment)**
  *   **The Regulator:** She did not trade a current act for a future reward. She regulated, then left, then got hired. There was no *displacement of fidelity* during her tenure because the debt was not yet callable.
  *   **Why it feels "worse than chocolates":** Chocolates are a trivial temptation; the revolving door is a *structural* erosion of trust. It creates an *incentive* for corruption without requiring a *transaction*.
  *   **Verdict:** You are right to not call it corruption. It is a **Conflict of Interest**. It belongs in a different bucket of "Institutional Erosion." Your test shouldn't convict her, but it should flag the system.

  **3. The Village Chief (The Definition of Public Fidelity)**
  *   **The Chief:** In a village context, the "public fidelity" of a chief includes social cohesion and conflict resolution. Refusing the goat would damage the peace he is sworn to keep. The gift is part of the *ritual of closure*, not a bribe for the verdict.
  *   **Verdict:** Not corrupt. The fidelity to the community *required* accepting the goat.

  **4. The Aid Worker & The Water Utility (The Victim Exception)**
  *   **The Principle:** Corruption is primarily a sin of the **Office-Holder**, not the citizen. The citizen is only corrupt if they seek an *undue advantage*.
  *   **Aid Worker:** They are not seeking an advantage; they are seeking to restore a right (vaccines) blocked by a corrupt system. They are victims of coercion.
  *   **Water Utility:** You slipped $20 to move a leak up the queue.
      *   **Is it corrupt?** Yes, the *transaction* is corrupt. The official displaced fidelity to the queue (public fidelity) for fidelity to your cash (private fidelity).
      *   **Are *you* corrupt?** No. Like the aid worker, you are paying to access a service you are entitled to, which the system is withholding. This is **Survival Corruption**.
      *   **Verdict:** You must accept that the *act* is corrupt, even if the *moral blame* lies with the utility worker and the system. If you want to keep your verdict that it is "not corrupt," you must define corruption as "Blameworthy Abuse of Office." Under that definition, the worker is corrupt, you are not.

  ### Which verdicts you must drop or adjust

  To make this principle work, you have to make three adjustments:

  1.  **The Regulator:** You must stop calling this "not corrupt" and start calling it **"Conflict of Interest."** It is not the same crime as the Mayor, but it is not as innocent as the chocolates. It is a structural threat, not a transactional one. If you keep it as "not corrupt," you lose the ability to regulate revolving doors.
  2.  **The Water Utility:** You must admit the *official's act* is corrupt. You can excuse the *payer*, but if you call the transaction "not corrupt," you validate the queue-jumping. The principle forces you to say: "This is corruption, but I am not morally culpable."
  3.  **The Legislator:** This is your most fragile verdict. Under this principle, it holds *only if* the 2 million didn't explicitly buy the vote. If the money was given *on the condition* of the vote, it becomes administrative (transactional) and thus corrupt. You must maintain the distinction that the money was for the *campaign*, not the *vote*.

  ### Is this universal or "Western Edition"?

  It is **not** just Western, but it is **institution-specific**.

  Your intuition on the Village Chief proves this. The principle (Displaced Fidelity) is universal, but the *content* of the fidelity changes based on the institution.
  *   **Weberian Bureaucracy (Ministry/Utility):** Fidelity = Neutrality, Rules, Queue.
  *   **Traditional Authority (Chief):** Fidelity = Social Harmony, Relationships, Reciprocity.
  *   **Political Office (Legislator):** Fidelity = Ideology, Constituents, Backers.

  Corruption is not "taking money." It is "taking money that makes you betray the specific rules of the game you are playing."

  The "Western" bias only appears if you insist that *all* offices must be neutral bureaucracies. If you accept that a Chief's office is fundamentally different from a Procurement Officer's office, the principle works everywhere. The Aid Worker case works universally because it appeals to a higher fidelity (Human Life) overriding the bureaucratic fidelity (Customs Forms).

  ### Summary
  Your "Office-Debt" test was 80% there. The missing 20% is recognizing that **not all debts are corrupt, only those that require you to betray the specific rules of your office's sphere.**

  *   **Mayor:** Betrayed Administrative Neutrality. (Corrupt)
  *   **Legislator:** Honored Political Partiality. (Not Corrupt)
  *   **Regulator:** No Betrayal Yet. (Conflict of Interest)
  *   **Water Utility:** Betrayal of Queue, but Payer is Coerced. (Corrupt Act, Excused Citizen)

  If you accept these distinctions, your gut verdicts align. If you refuse to distinguish the Legislator from the Mayor, or the Regulator from the Chocolates, you will remain stuck.
