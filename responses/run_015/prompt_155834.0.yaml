  # Clinical Ethics Consultation Rotation: The Advance Directive Decision Tree

  **Starting Commitment:** A competently executed advance directive (AD) should normally be followed.
  **Goal:** Determine *why* and *whether* the earlier self has authority over the later one in concrete cases.

  ## Part I: The Logical Space (Branch Questions)
  Answer the following five questions based on your intuition about what should be done. Do not worry about theoretical labels; answer based on the clinical case described.

  1.  **The Dementia Flinch:** A patient has advanced dementia, appears contented, but flinches when nurses approach to withhold treatment per her directive. Do we withhold treatment?
      *   **Yes:** Authority survives psychological break.
      *   **No:** Authority dies with psychological continuity.

  2.  **The Capacity Reversal:** A patient retains capacity but says, "I signed that when I was scared of burdening my family; now I want to live." Do we honor the signature over the current statement?
      *   **Yes:** Past commitment binds even against current capacity.
      *   **No:** Current capacity overrides past commitment.

  3.  **The Welfare Mismatch:** The directive refuses antibiotics for pneumonia. The patient now has pneumonia and cannot speak, but non-verbal cues suggest she values life highly now. Do we treat against the text?
      *   **Yes:** The directive is evidence of wishes, not a command.
      *   **No:** The directive is a sovereign command regardless of current welfare.

  4.  **The Tainted Source:** The directive was signed while managing family finances under pressure, or it requests burdensome treatment rather than refusing it. Do we discount it?
      *   **Yes:** Authority requires authentic, unpressured values (or asymmetry exists).
      *   **No:** Formal validity suffices; pressure/asymmetry does not invalidate.

  5.  **The Surrogate Override:** The directive names a surrogate but lists specific instructions. The surrogate wants to ignore the instructions based on substituted judgment. Do we follow the surrogate?
      *   **Yes:** Authority lies in the agent (delegation).
      *   **No:** Authority lies in the text (instruction).

  **Space Note:** These five binary questions generate 32 theoretical combinations. However, many are incoherent (e.g., claiming the directive binds in dementia but not when welfare is opposed). Only 7–9 combinations represent stable ethical positions occupied in the literature or practice.

  ## Part II: The Positions (Leaves)
  Locate your position by matching your answers to the profiles below.

  **1. Pure Contemporaneous-Welfare**
  *   **Profile:** Q1-No, Q2-No, Q3-Yes.
  *   **Statement:** The earlier self has no authority; only the current welfare of the living patient matters.
  *   **Awkward Commitment:** You must ignore valid legal documents even when they align with the patient's lifelong values.

  **2. Precedent Autonomy (Evidentiary)**
  *   **Profile:** Q1-No, Q2-No, Q3-Yes, Q4-Yes.
  *   **Statement:** The directive binds only because it is the best available evidence of what the patient would now want.
  *   **Awkward Commitment:** You must disregard the directive if stronger evidence (like non-verbal cues) suggests a different current wish.

  **3. Precedent Autonomy (Sovereignty)**
  *   **Profile:** Q1-Yes, Q2-Yes, Q3-No, Q4-Yes, Q5-No.
  *   **Statement:** The directive binds because authorizing a future self to be governed is itself valuable.
  *   **Awkward Commitment:** You must enforce treatment withholding on a contented dementia patient who flinches from care.

  **4. Critical-Interests / Narrative Identity**
  *   **Profile:** Q1-Yes, Q2-No, Q3-No, Q4-Yes, Q5-No.
  *   **Statement:** Authority persists through dementia to protect the integrity of the life story, but resets if capacity allows a new narrative.
  *   **Awkward Commitment:** You must distinguish between a "narrative-breaking" dementia and a mere change of mind in capacity.

  **5. Revision-Tolerant Precedent**
  *   **Profile:** Q1-Yes, Q2-No (unless reflective), Q3-No, Q4-Yes, Q5-No.
  *   **Statement:** The earlier self's authority persists unless the later change is itself reflective and stable.
  *   **Awkward Commitment:** You must adjudicate whether a current request is "reflective enough" to override a prior written command.

  **6. Proxy-Priority / Delegationist**
  *   **Profile:** Q5-Yes (Overrides Q1–Q4).
  *   **Statement:** Authority attaches to the designated surrogate exercising substituted judgment, not the written rule.
  *   **Awkward Commitment:** You must allow a surrogate to contradict explicit written instructions if they believe they know the patient's values better.

  **7. Deflationary / Procedural**
  *   **Profile:** Q1-Yes, Q2-Yes, Q3-No, Q4-No, Q5-No.
  *   **Statement:** The directive's authority is procedural only—it allocates decision-rights and limits institutional exposure.
  *   **Awkward Commitment:** You must follow a directive signed under pressure because the legal form is valid, even if it does no moral work.

  ## Part III: Diagnostics

  **1. Empty Cells (Incoherent or Unattractive)**
  The combination **Q1-Yes (Dementia binds) + Q3-Yes (Welfare overrides)** is theoretically available but practically empty. It claims the directive survives psychological death but yields to current welfare; this collapses into the *Evidentiary* view (Q1-No) because if welfare overrides, the psychological break becomes irrelevant. It is incoherent to assert authority survives the self but not the self's interests.

  **2. Indistinguishable Leaves**
  The tree cannot separate **Precedent Autonomy (Sovereignty)** from the **Deflationary** view on action alone; both follow the text regardless of welfare (Q3-No). To pull them apart, you need a sixth question: *"If following the directive clearly violates moral norms but protects the hospital from liability, do you follow it?"* The Sovereignty view says Yes (moral duty); the Deflationary view says Yes (legal rule), but for different reasons.

  **3. Branch Weight**
  **Q1 (The Dementia Flinch)** does the most work, as it fundamentally splits the *Contemporaneous-Welfare* and *Evidentiary* views from all *Precedent Autonomy* views. **Q4 (The Tainted Source)** is nearly vacuous; almost all positions (except Deflationary) agree that significant pressure or asymmetry discounts authority, making it a poor sorter for most trainees.
