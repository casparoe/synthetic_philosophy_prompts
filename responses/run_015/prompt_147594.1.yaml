answer: |-
  This is a splendid set of puzzles to bring to a graduate seminar. You have put your finger on precisely the tension that keeps the debate between traditionalists and revisionists alive. It is entirely understandable that immersion in revisionist literature makes Walzer's position appear unstable; the revisionists argue precisely that Walzer's separation of *jus ad bellum* and *jus in bello* is incoherent.

  However, I suspect the 'false move' in your reasoning lies in how you are interpreting the nature of the 'equality' Walzer proposes. You are treating the Moral Equality of Combatants (MEC) as a deep moral claim about the *justification* of killing, whereas Walzer intends it largely as a functional and legal claim about the *status* of the killer.

  Let us untangle this in two stages: first, the structural confusion regarding asymmetry, and second, the question of reciprocity in modern warfare.

  ### 1. Where does the asymmetry live?

  Your worry is that if unjust combatants have the same right to kill as just ones, the aggressor acquires a moral licence that cancels out the defender's right to resist. You ask whether just combatants have less of a claim to defend themselves in war than in ordinary self-defence.

  The short answer is: on Walzer's view, they do not have less of a claim to defend themselves *in the moment*, but the *source* of their permission is different.

  The false move here is conflating the **crime of aggression** with the **act of killing in combat**. In ordinary self-defence, the attacker is a criminal aggressor. In war, Walzer argues, we must distinguish the soldier from the state. The state may be guilty of a supreme crime (aggression), but the individual soldier is not necessarily a murderer.

  Walzer's 'Separation Thesis' is designed to prevent the logic of *jus ad bellum* from swallowing *jus in bello*. If we say that unjust soldiers are morally culpable murderers (as the revisionists tend to), then the just side is permitted to treat them as such. This could lead to no quarter being given, show trials, or the abandonment of *in bello* constraints (like proportionality) because one does not owe the same duties to a criminal as to a legitimate combatant.

  So, where does the asymmetry live? It lives at the level of the **state** and the **cause**, not the individual exchange of fire.
  *   **Ad Bellum Asymmetry:** One side is right, the other is wrong. The aggressor state violates sovereignty; the defender state upholds it.
  *   **In Bello Equality:** Both sets of soldiers are granted the 'combatant's privilege'. This is not a deep moral permission that says 'killing for injustice is good'. Rather, it is a pragmatic immunity. It says, 'provided you follow the rules of engagement, you will not be prosecuted for killing'.

  Therefore, the defender's right to resist is not erased. It is simply that the target of that resistance is not deemed a criminal *in that moment*. The just combatant defends their community against an unjust threat; the unjust combatant fights because they are a conscripted or enlisted agent of a state, dangerous but not personally culpable for the state's decision to wage war.

  To answer your specific question: Walzer is not committed to saying just combatants have less of a claim to defend themselves. He is committed to saying that the *unjust* combatant retains a claim not to be murdered or treated as a criminal, provided they fight within the rules. The asymmetry of the cause remains intact; it just does not dictate the moral status of every bullet fired.

  ### 2. Reciprocity and Modern Warfare

  Your second point is equally astute. You ask whether MEC assumes a contractualist reciprocity based on mutual vulnerability, and whether this is a historical artifact in the age of autonomous systems and remote warfare.

  There is a descriptive element and a normative element here, and distinguishing them is crucial for your students.

  **Descriptively**, Walzer's view emerged from a context of symmetrical industrial warfare, where soldiers faced mutual risk. The 'warrior's code' relies on a shared understanding: 'I will not shoot you if you surrender, and you will not shoot me if I am hors de combat.' This relies on a degree of reciprocity.

  **Normatively**, however, Walzer's argument is not *only* about reciprocity. It is about the **separation of the individual from the collective**. The justification for MEC is that soldiers are often coerced, conscripted, or socially conditioned. They are 'dangerous men' (and women), but they are instruments of the state.

  Now, consider your point about autonomous systems and remote warfare. If one side faces no risk (e.g., drone operators or future AI systems), does the equality hold?
  *   **The Revisionist Objection:** Revisionists would say this proves their point. If there is no mutual risk, the 'contract' is broken. The side facing no risk is essentially policing or executing, not fighting. Therefore, the traditional *in bello* permissions should not apply in the same way.
  *   **The Walzerian Defence:** A traditionalist might argue that the normative core remains. Even a drone operator is an agent of the state. If we strip them of combatant status because they face no risk, we risk categorising them as criminals or terrorists, which escalates conflict. However, you are right to press your students on whether the *logic* of equality requires mutual liability.

  If the 'equality' is purely normative (based on the separation of spheres), it should survive technological change. If it is based on reciprocity (a mutual exchange of risk), it is indeed fragile.

  I suggest the distinction you are looking for is this: Is MEC a **moral truth** about the rights of individuals, or is it a **conventional norm** necessary to contain the horrors of war?
  *   If it is a moral truth (as revisionists claim it *should* be), then unjust killers are indeed morally liable to defensive harm, regardless of uniforms.
  *   If it is a convention (as Walzer leans), it is a rule we uphold *because* it limits war, even if it feels morally counter-intuitive in specific cases.

  In modern asymmetric warfare, the convention is under strain. If one side cannot be harmed, the other side may feel no obligation to treat them as equals. This suggests that while MEC is a normative principle, its stability depends on certain empirical conditions (like the possibility of mutual harm) that technology is eroding.

  ### Summary for your Seminar

  To help your students wrestle with this without collapsing into the revisionist view, you might frame the 'false move' in your own reasoning as follows:

  1.  **Do not conflate liability with permission.** Walzer does not say the unjust soldier is *morally justified* in the deep sense. He says they are *legally privileged* to prevent the war from becoming a crusade against individuals.
  2.  **The asymmetry is preserved at the macro level.** The unjust state is still the aggressor. The just state is still the defender. MEC only applies to the micro-interactions of soldiers to ensure *in bello* constraints are respected by both sides.
  3.  **Reciprocity is a support, not the foundation.** Mutual risk makes MEC easier to sustain, but the normative goal is to protect the category of the 'combatant' from being conflated with the 'criminal'. However, you are right to ask students whether remote warfare breaks the conventional logic that sustains this protection.

  The revisionist view is attractive because it aligns war with ordinary morality (self-defence). Walzer's view is attractive because it recognises war as a distinct social practice with its own rules, designed to limit horror rather than perfect justice. Your students' task is to decide whether that distinction is a necessary compromise or a moral failure.

  I hope this helps clear the fog. It is a tricky knot, but untangling it is where the real philosophical work happens. Good luck with the seminar.
