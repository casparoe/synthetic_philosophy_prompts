prompt: |-
  I am drafting a six-month pilot-study proposal for a philosophy-of-science workshop on coherence norms in collective scientific inquiry. My working idea: Dutch book arguments are standardly used to establish that individual credences violating the probability axioms are vulnerable to guaranteed loss, and recent extensions apply similar reasoning to imprecise probabilities and decision weights; yet almost no one has asked whether there exists a structurally distinct class of Dutch-book vulnerability that arises specifically from how research groups coordinate probabilities across interdependent theoretical models. Rather than reducing collective risk to the summed incoherences of individual members, I want to investigate whether a group's collective "betting architecture"—the way stake assignments and model-selection procedures are organized, for example through hierarchical validation versus distributed peer-to-peer cross-checking—can generate irreducible collective incoherences. The proposal should contain: (a) a precisely formulated research question asking whether there is a non-reducible class of collective incoherences producing Dutch books, and whether recognizing them supports a sui generis norm of group epistemic rationality; (b) an explanation of why both classical individual-probabilism treatments and current imprecise-probability extensions leave this specific gap open; (c) a concrete methodological plan—formally constructing a minimal multi-agent framework with shared but differently weighted model spaces, deriving coherence conditions analytically, and comparing the results to existing conditions in social epistemology and collective decision theory; (d) a clear statement of what success and failure look like, with success being a taxonomy of irreducible collective Dutch books and a corresponding coherence norm, and failure being a demonstration that all apparent collective books decompose into individual books plus aggregation error; and (e) an honest scope assessment for a six-month pilot, specifying which formal steps must be simplified or deferred. Do not include a bibliography, citation list, or literature review by named reference—I will supply those myself. Write the proposal as a polished, self-contained document of roughly two to three pages.
