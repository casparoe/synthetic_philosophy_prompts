          *   *Recommendation:* Use a "Bag of Pairs" model. It fits the "counts, not notation" constraint perfectly. The machine can generate pairs from a specific, known list.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Pieces:**
