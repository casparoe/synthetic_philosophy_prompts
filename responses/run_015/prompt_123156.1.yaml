answer: |-
  Here is a lesson plan designed for your constraints: eighty minutes, thirty students, no conditional probability notation, and a focus on the tension between symmetry and information.

  ### 1. The Order of Pieces

  You are correct to start with the closed-envelope version. It establishes the "null hypothesis" of the problem.

  *   **Step 1: The Closed Envelope (Minutes 0–15).**
      *   **Action:** Describe the setup (two envelopes, one has double the other). Ask if they want to switch *before* opening.
      *   **Goal:** Secure unanimous agreement that switching is neutral. The symmetry is perfect; there is no information to break the tie.
      *   **Dependency:** This creates a baseline. If "Always Switch" is rational in the open case, it must also be rational here. But since it's absurd here (you'd switch forever), it primes the students to look for where the logic breaks in the open case.
  *   **Step 2: The Open Envelope & The Calculation (Minutes 15–30).**
      *   **Action:** Now they open the envelope. They see amount $A$. Walk through the $1.25A$ calculation on the board.
      *   **Goal:** Generate the paradox. The symmetry feels broken because they have "data." The math seems to demand a switch.
      *   **Dependency:** Relies on Step 1 to show that this conclusion (Always Switch) contradicts the closed-case intuition.
  *   **Step 3: The "Variable" Objection (Minutes 30–45).**
      *   **Action:** Raise your friend's point. "Is $A$ the same number in both branches of the calculation?"
      *   **Goal:** Acknowledge this is a real algebraic error, but show it is unsatisfying. Even if we rewrite the math with specific numbers (e.g., "I see $10"), the intuition that the other envelope is equally likely to be $5 or $20 persists.
      *   **Dependency:** You must clear this hurdle so students don't think the paradox is just a notation trick.
  *   **Step 4: The Frequency Resolution (Minutes 45–70).**
      *   **Action:** Introduce the carrying example (the "Capped Machine"). Build a frequency table on the board.
      *   **Goal:** Show that the "50/50" assumption is the actual hinge. By counting outcomes, students will see that for some values, the other envelope is *not* equally likely to be half or double.
      *   **Dependency:** Requires the specific constraints of the carrying example (finite caps) to make counting possible.
  *   **Step 5: Assessment (Minutes 70–80).**
      *   **Action:** The end-of-session question.

  ### 2. The Carrying Example

  **Verdict:** Your machine idea is strong, but the **smudged display must go.**

  **Why:** You specified that students cannot handle conditional probability notation and must use counts. A smudged display introduces uncertainty about *what they are seeing* (measurement error), rather than uncertainty about *how the money was distributed* (prior probability). This muddies the water. To use a frequency table, the observation must be precise, but the *source* of the money must be constrained.

  **The Modified Example: "The Capped Machine"**
  *   **The Setup:** A machine generates pairs of envelopes. It chooses one of three settings with equal probability (1/3 each):
      *   Setting 1: Puts **$10** and **$20** in the envelopes.
      *   Setting 2: Puts **$20** and **$40** in the envelopes.
      *   Setting 3: Puts **$40** and **$80** in the envelopes.
  *   **The Procedure:** The machine picks a setting, puts the money in, shuffles the envelopes, and hands you one.
  *   **Why this works:**
      *   **It must have:** A finite maximum value ($80). This is crucial. It creates an "edge case" where the 50/50 assumption fails visibly.
      *   **It must lack:** Infinite possibilities or ambiguous observations.
      *   **First Pass:** Set the cap low (as above). Ask: "You open the envelope and see **$40**. Should you switch?"
      *   **The Variation:** Once they solve that, ask: "What if you saw **$10**?" (Here, switching *is* favorable). This shows the decision *depends on the amount seen*, refuting "Always Switch."
      *   **The Moment to Vary:** After they build the table for $40, change the observed value to $10 or $20. This demonstrates that the probability of the other envelope being double vs. half changes depending on where the observed value sits in the distribution.

  ### 3. Misconceptions to Expect

  Handle these as they arise in the sequence. Do not preempt them all at once; let the students voice them, then use the next step of the plan to dismantle them.

  1.  **"Symmetry applies after opening, too."** (Expected at Minute 20)
      *   *The Error:* "I still don't know if I have the larger or smaller one, so it's 50/50."
      *   *When to head it off:* During **Step 4 (Frequency Resolution)**.
      *   *How:* Use the table. Show that if the machine caps out at $80, and you see $80, the probability the other is $160 is zero, not 50%. Symmetry is broken by the boundary.
  2.  **"It's just a variable naming error."** (Expected at Minute 35)
      *   *The Error:* Your friend's point. "You can't use 'x' for both $10 and $20."
      *   *When to head it off:* During **Step 3**.
      *   *How:* Concede the algebra is sloppy, but insist on the intuition. Say: "Okay, let's ban 'x'. You see exactly $40. Is it equally likely the other is $20 or $80?" This forces them to confront the probability assumption, not the algebra.
  3.  **"The expected value is infinite, so the math doesn't matter."** (Expected at Minute 50)
      *   *The Error:* Your friend's second point. If the money can be infinitely large, expectations diverge.
      *   *When to head it off:* At the start of **Step 4**.
      *   *How:* Stipulate explicitly: "For this class, there is a maximum amount of money in the universe." The Capped Machine enforces this. It renders the infinite EV objection inapplicable so you can solve the finite logic.
  4.  **"If I see a small amount, I should always switch."** (Expected at Minute 60)
      *   *The Error:* Generalizing the "edge case" resolution. They might think switching is good for $10 but bad for $80, and miss the middle ground.
      *   *When to head it off:* During the **Variation** in Step 4.
      *   *How:* Walk through the $20 case. Show that even there, the odds depend on how frequently the machine chooses Setting 1 vs. Setting 2.

  ### 4. What to Decline to Explain

  You should explicitly decline to explain **the case of the "Improper Prior."**

  **Script:** "There is a mathematical way to set up this problem where the expected value *is* infinite, and where 'Always Switch' actually holds up mathematically. That requires assuming the money can be infinitely large and distributed in a very specific, unrealistic way. We are not doing that today. We are assuming there is a limit to the money in the room. If you are curious about the infinite case, see me in office hours, but for this session, we assume a maximum cap exists."

  **Why:** This prevents the "Infinite EV" argument from derailing the lesson while acknowledging that your friend wasn't entirely hallucinating, just talking about a different (and less practical) version of the problem.

  ### 5. End-of-Session Assessment Question

  This question tests whether they understand that the decision depends on the *frequency* of the pairs, not just the value in their hand.

  **The Question:**
  "Imagine the machine is reprogrammed. It now uses only two settings, chosen with equal probability:
  *   **Setting A:** Puts **$100** and **$200** in the envelopes.
  *   **Setting B:** Puts **$200** and **$400** in the envelopes.

  You open your envelope and see **$200**.
  1.  How many distinct scenarios could have produced this $200?
  2.  In how many of those scenarios is the other envelope larger?
  3.  Based on this count, what is the expected value of switching? (Show the calculation).
  4.  Do you switch?"

  **The Correct Answer Key:**
  1.  **Two scenarios:** (Setting A, you hold the larger) OR (Setting B, you hold the smaller).
  2.  **One scenario:** Only in Setting B is the other envelope larger ($400). In Setting A, the other is smaller ($100).
  3.  **Calculation:** $0.5 \times 100 + 0.5 \times 400 = 250$. (Wait, this implies switching is good. **Correction for the plan:** I need to ensure the assessment shows *indifference* or a specific break to prove they aren't just guessing "switch".)

  *Correction to Assessment Design:* To truly test if they get the "counts" logic, I need to make the settings *unequal* or the cap visible. Let's adjust the assessment to ensure the "50/50" trap is visible.

  **Revised Assessment Question:**
  "Imagine the machine uses three settings, but they are **not** equally likely.
  *   **Setting 1 (50% chance):** Pairs ($10, $20).
  *   **Setting 2 (50% chance):** Pairs ($20, $40).
  *   *(No other settings exist).*

  You open your envelope and see **$20**.
  1.  List the specific scenarios that could result in you seeing $20.
  2.  Are these scenarios equally likely? (Yes/No and why).
  3.  Calculate the expected value of the other envelope.
  4.  Do you switch?"

  **Why this works:**
  *   If they assume 50/50 on the *envelopes*, they get $0.5(10) + 0.5(40) = 25$. (Switch).
  *   If they count the *scenarios* correctly:
      *   Scenario 1: Setting 1 chosen (50%), you got the larger ($20). Prob = 0.25.
      *   Scenario 2: Setting 2 chosen (50%), you got the smaller ($20). Prob = 0.25.
      *   Actually, since the settings are 50/50, and within settings envelopes are 50/50, the scenarios *are* equally likely here. This might be too subtle.

  *Let's try one that forces the 'Edge' logic.*

  **Final Revised Assessment Question:**
  "The machine has a maximum cap. It chooses one of two settings with equal probability:
  *   **Setting 1:** Pairs ($10, $20).
  *   **Setting 2:** Pairs ($20, $40).
  *   **Rule:** If the machine generates a value over $30, it resets. (Effectively, $40 is the hard max).

  You open your envelope and see **$20**.
  1.  Write down the two possible pairs that could contain $20.
  2.  If you see **$40**, what must be in the other envelope?
  3.  Back to seeing **$20**: Assume the machine is equally likely to pick Setting 1 or Setting 2. What is the probability the other envelope is $10? What is the probability it is $40?
  4.  Calculate the expected gain."

  **Correct Output to Look For:**
  *   They must identify that seeing $20 is compatible with ($10, $20) and ($20, $40).
  *   They must recognize that since the settings are equally likely, and the envelope selection is random, the probability of the other being $10 is 0.5 and $40 is 0.5.
  *   *Wait, this still yields switching.*

  *Okay, the only way to break the "Always Switch" intuition with counts is to make the prior distribution non-uniform or hit the cap.*

  **Final, Robust Assessment Question:**
  "The machine chooses from these three pairs with **equal probability**:
  1.  ($5, $10)
  2.  ($10, $20)
  3.  ($20, $40)

  You open your envelope and see **$20**.
  1.  Which pairs could contain the $20 you are holding?
  2.  Are you equally likely to be holding the 'small' envelope of a pair or the 'large' envelope of a pair?
  3.  Calculate the expected value of the other envelope.
  4.  Do you switch?"

  **Answer Key for Grading:**
  1.  Pair 2 ($10, $20) and Pair 3 ($20, $40).
  2.  **Yes.** (Because Pair 2 and Pair 3 are equally likely to be chosen, and within each pair, you are equally likely to hold either envelope).
  3.  $0.5 \times 10 + 0.5 \times 40 = 25$.
  4.  **Yes.**

  *Wait, this confirms switching.* I need a question where the answer is **NO** or **INDIFFERENT** to prove they aren't just following the "1.25x" rule.

  **The "Cap" Assessment (Best Option):**
  "The machine chooses from these **two** pairs with **equal probability**:
  1.  ($10, $20)
  2.  ($20, $40)
  **Constraint:** There is no money in the world larger than $40.

  You open your envelope and see **$40**.
  1.  What must be in the other envelope?
  2.  What is the expected value of switching?
  3.  Do you switch?"

  **Why this is the right test:**
  *   If they learned the "1.25x" rule blindly, they will say "Other is $20 or $80. EV = $50. Switch."
  *   If they learned the **lesson**, they will say "Other must be $20. EV = $20. Stay."
  *   This tests the "Cap" logic directly.

  **Add a Part B for the high-flyers:**
  "Now you see **$20**. Do you switch?"
  *   Correct answer: Yes (because $40 is possible, $10 is possible, and the cap doesn't block the upside).
  *   This shows they understand the decision *depends on the value seen*.

  **Use this two-part assessment.** It cleanly separates those who memorized the paradox from those who understood the resolution.
