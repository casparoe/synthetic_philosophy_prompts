      *   *Economic Integration:* Athens and Sparta had trade, but not deep supply chain interdependence. US and China are deeply entwined ("Chimerica"). Decoupling is costly.
      *   *Impact on Conclusion:* The original conclusion is "war is structurally inevitable." These breaks suggest war is *less* inevitable, or at least the *form* of conflict changes (gray zone, cyber, proxy) rather than direct kinetic clash.
