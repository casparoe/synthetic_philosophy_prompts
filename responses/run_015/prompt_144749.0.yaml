          2.  **Identify Breaks:** Analyze where the analogy fails (Nuclear Deterrence, Economic Integration) and assess impact on the "inevitability of war" conclusion.
          3.  **Apply Reference-Class Idea:** Test alternative reference classes (Britain/Germany 1900, US/UK 19th C, Vietnam Quagmire) and see if the "prepare for conflict" conclusion holds.
