answer: |-
  **Exam Prompt**

  **Course:** Early Modern Philosophy of Mathematics
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000–1200 words

  **Question:**

  Thomas Hobbes insists that geometry is the only science capable of yielding certain truth, yet he simultaneously denies that geometric objects (lines, surfaces, bodies) exist independently of the mind. For Hobbes, geometric reasoning is synthetic, relying on the causal generation of figures through mental motion, but geometric objects are themselves "fictions" or mental constructions rather than real bodies.

  Write an essay addressing the following tension: How can geometry be a science of causal necessity if its objects are merely nominal constructs? Once you have established Hobbes's resolution to this tension, apply it to a hypothetical objection drawn from his own premises. If geometric truth is merely the consistent unfolding of definitions we invent, what prevents us from inventing a non-Euclidean system (e.g., Riemannian geometry) with an equal claim to truth? Would Hobbes be forced to reject such alternatives on pain of contradiction, or does his nominalism about space actually open the door to them? Defend your interpretation using Hobbes's metaphysics of motion and space.

  ***

  **Model Answer**

  Hobbes's philosophy of geometry rests on a precarious balance between nominalism and causal realism. To understand how he navigates the tension between geometry as a system of names and geometry as a science of motion, one must recognize that for Hobbes, truth is not correspondence to external reality, but correct reasoning from settled definitions. However, unlike later logical empiricists, Hobbes does not view these definitions as arbitrary. They are grounded in the phantasms of sense experience, specifically the experience of body and motion.

  The tension arises because Hobbes claims geometric objects are fictions—there is no perfect line in nature—yet geometric reasoning reveals necessary causal connections. Hobbes resolves this by arguing that geometry is not about static entities but about generation. A line is not a pre-existing object; it is the trace of a moving point. Therefore, geometric truth is synthetic because it mirrors the causal structure of motion itself. When we reason about a triangle, we are not analyzing a static concept but reconstructing the mental motion required to generate it. The necessity lies not in the object, which is a fiction, but in the impossibility of conceiving the generation otherwise. The mind cannot conceive a generated figure violating the laws of its own generation without contradiction. Thus, the "causation" is mental, but it is constrained by the universal laws of how humans conceive motion.

  This resolution clarifies the status of geometric objects: they are valid fictions because they are generated according to universal rules of mental motion. But this invites the objection regarding non-Euclidean systems. If geometry is the consistent unfolding of definitions, why cannot we define space as curved rather than flat? If truth is merely consistency among names, a non-Euclidean system seems permissible provided it is internally consistent.

  However, Hobbes would likely reject non-Euclidean alternatives, not on logical grounds, but on metaphysical ones tied to his concept of space. For Hobbes, space is the "phantasm of a thing existing without the mind simply." It is the idea of body stripped of specific qualities, retaining only extension. Crucially, this phantasm is derived from the experience of moving bodies in a uniform void. The definitions of geometry are not arbitrary inventions; they are descriptions of how bodies *must* be conceived to be intelligible as bodies. To define a line that does not follow the shortest distance between points (in the Euclidean sense) is, for Hobbes, to fail to define a line generated by simple motion.

  Consequently, Hobbes's nominalism does not open the door to alternative geometries because his nominalism is constrained by phenomenology. We cannot simply invent definitions; we must invent definitions that accord with the phantasms of sense. Since our sense experience presents space as uniform and isotropic, any geometry predicated on curved space violates the foundational phantasm of "space" itself. A non-Euclidean system might be logically consistent as a game of names, but it would lack "truth" in the Hobbesian sense because it does not track the causal generation of figures as they appear to the sensing mind.

  Therefore, Hobbes avoids the relativism of pure conventionalism. The necessity of geometry comes from the necessity of motion, not just the consistency of language. While the objects are fictions, the rules of their fabrication are dictated by the structure of human sensation and the metaphysics of body. He would reject Riemann-style alternatives not because they are logically impossible, but because they describe a generation of space that contradicts the universal phantasm of extension. The truth of geometry is preserved because the "definitions we invent" are actually discoveries of the necessary conditions for conceiving body and motion. Thus, the tension is resolved: geometry is causal because motion is causal, and it is nominal because the figures exist only as the terms of that mental motion.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Moves × 4 Marks)

  **1. Establish Hobbes's Nominalist Foundation**
  *   **Must Hit:** Candidate must explain that for Hobbes, geometric objects do not exist externally and truth is about consequences of names/definitions rather than correspondence to matter.
  *   **Common Pitfall:** Students often treat Hobbes as a Platonic realist who believes perfect circles exist in the divine mind.

  **2. Explain the Genetic Method (Motion)**
  *   **Must Hit:** Candidate must articulate that geometry is synthetic because figures are generated by mental motion (e.g., a line is a moving point), not analyzed statically.
  *   **Common Pitfall:** Candidates describe the motion as physical drawing on paper rather than mental conception/phantasm.

  **3. Resolve the Tension (Fiction vs. Causation)**
  *   **Must Hit:** Candidate must show how necessity arises from the impossibility of conceiving generation differently, bridging the gap between fiction and causal power.
  *   **Common Pitfall:** Students claim the tension is unresolved or dismiss the "fiction" claim as mere rhetoric.

  **4. Engage the Non-Euclidean Objection**
  *   **Must Hit:** Candidate must address whether arbitrary definitions allow for alternative geometries, distinguishing between logical consistency and Hobbesian truth.
  *   **Common Pitfall:** Candidates anachronistically argue Hobbes knew about non-Euclidean geometry or dismiss the question as historically impossible.

  **5. Deliver a Verdict Based on Phenomenology**
  *   **Must Hit:** Candidate must conclude that Hobbes rejects alternatives because definitions are constrained by the universal phantasm of space/extension, not just logic.
  *   **Common Pitfall:** Students conclude Hobbes would accept non-Euclidean geometry simply because he is a nominalist about objects.

  \answer{20}
