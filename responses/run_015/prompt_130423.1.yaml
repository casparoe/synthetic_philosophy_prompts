      *   *Claim 4 (No False Lemmas & Reliabilism):* The "No False Lemmas" (or No False Grounds) condition was proposed by others (e.g., Lehrer, Harman) *after* Gettier, not by Gettier. Reliabilism (Goldman, 1979) did challenge causal/process-based accounts, but "No False Lemmas" wasn't the dominant view for "decades" in a monolithic way; it was one of many responses (causal theories, defeasibility theories, etc.).
