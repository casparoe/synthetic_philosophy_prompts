answer: |-
  This is an exceptionally sharp set of notes. You have correctly identified that the elegance of the Kelly criterion relies on specific symmetries (scale invariance, multiplicative dynamics) that break down under realistic friction. Your intuition that the "ergodic" (time-average) justification for Kelly becomes fragile in this environment is well-founded.

  Here is a detailed critique following your requested structure.

  ### (a) Technical Check (§1, §2, §3)

  **§1: The "Twice Kelly" Threshold**
  You are right to be suspicious of the exactness here. The claim that growth turns negative at exactly $2f^*$ is a **quadratic approximation**, not an exact truth.
  *   **The Math:** Expand the growth function $g(f) = p \ln(1+f) + (1-p) \ln(1-f)$ using a Taylor series around $f=0$.
      *   $\ln(1+x) \approx x - x^2/2$.
      *   $g(f) \approx p(f - f^2/2) + (1-p)(-f - f^2/2)$.
      *   $g(f) \approx (2p-1)f - f^2/2$.
      *   Setting this to zero gives roots at $f=0$ and $f = 2(2p-1) = 2f^*$.
  *   **The Reality:** Because $\ln(1-f)$ drops to $-\infty$ faster than the quadratic term suggests as $f \to 1$, the true zero-growth fraction is slightly **less** than $2f^*$.
  *   **Correction:** State that $2f^*$ is the zero-growth point *to a second-order approximation*. For $p=0.6$, $f^*=0.2$, $2f^*=0.4$. Exact calculation shows $g(0.4) < 0$. The threshold is roughly $1.9f^*$, not $2f^*$. This doesn't break your argument, but precision matters for engineers.

  **§2: The Perturbation and First-Order Condition**
  Your derivation here is **correct**.
  *   **FOC Check:** You maximized $E[\ln(W')]$. Since $W' = W(1 \pm f) - c$, the term inside the log is $W(1 \pm f - c/W)$. The $W$ factors out of the log as an additive constant $\ln W$, which disappears during differentiation with respect to $f$. Your resulting equation $f(W) = f^*(1 - c/W)$ is algebraically sound.
  *   **The Trap:** Your identification of the "death spiral" is the strongest technical insight here. In standard Kelly, if you overbet, you expect to lose wealth, but the *fraction* $f^*$ remains constant. Here, as $W$ shrinks, the effective cost $c/W$ rises, forcing the optimal $f$ down. If $c/W \ge 1$, you cannot even pay the fee. This creates a **hard ruin barrier** at $W=c$, whereas standard Kelly only has an asymptotic ruin at $W=0$.

  **§3: Myopia and Concavity**
  Your intuition is correct, but the terminology needs tightening.
  *   **Vocabulary:** **Myopia** in this context means making the decision that is best for the immediate next step without regard for how that decision changes your options in future steps. In standard Kelly, the myopic rule is globally optimal because the problem is **scale-invariant** (being rich or poor doesn't change the optimal *fraction*).
  *   **The Break:** With fixed costs, the problem is no longer scale-invariant. Being poor is qualitatively different from being rich because the fixed cost $c$ eats a larger percentage of your bankroll.
  *   **Concavity Argument:** You argue that because expected log wealth is concave in $W$, dispersion is costly. This is true. However, the deeper reason myopia fails is **Dynamic Programming**.
      *   Let $V(W, t)$ be the maximum expected log wealth at time $T$, given current wealth $W$ at time $t$.
      *   The Bellman Equation is: $V(W, t) = \max_f E[V(W', t+1)]$.
      *   In standard Kelly, $V(W, t) = \ln W + k(T-t)$. This structure allows the $\ln W$ to cancel out, making the optimal $f$ independent of $W$ and $t$ (Myopic).
      *   With fixed costs, $V(W, t) \neq \ln W + k$. The "value of being alive" (having $W > c$) becomes non-linear near the barrier.
      *   **Verdict:** You are right that the long-run optimiser will be more conservative near the trap. A myopic optimizer ignores the fact that a loss today increases the *relative* burden of $c$ tomorrow. A long-horizon optimizer "saves" wealth to keep the $c/W$ ratio manageable.

  ### (b) The Philosophical Dilemma (§4)

  Is the dilemma genuine? **Yes.**
  You have correctly identified a crack in the foundation of "Ergodicity Economics" (the school of thought that argues time-averages justify Kelly without needing subjective utility).

  *   **Option 1 (Expected Utility):** If you say "Maximize $E[\ln W_T]$," you are indeed treating Log as a utility function. The dynamical justification ("this maximizes growth rate") is no longer sufficient because the growth rate is state-dependent. You have to admit you *prefer* Log utility.
  *   **Option 2 (Time-Average Growth):** You suggest defining a growth rate for state-dependent processes. This is possible (e.g., the Lyapunov exponent of the stochastic process), but as you noted, it can diverge from the Expected Utility solution.
  *   **Is there a Third Option?** The standard engineering answer is **Model Predictive Control (MPC)** or finite-horizon Dynamic Programming. You don't look for a universal "growth rate"; you solve for the optimal policy given a specific horizon $T$ and current state $W$.
      *   *Critique of your claim:* You call Option 1 a "trap." I would call it the "standard resolution." Economists would say: "Of course Kelly relies on Log utility. The fact that fixed costs break the time-average argument just proves that Log Utility is a preference, not a law of physics."
      *   *Your strength:* Your argument is strongest if you frame it as: "The *Ergodic* justification for Kelly (that it is objectively optimal regardless of preference) fails under fixed costs. Therefore, anyone using Kelly must admit they are expressing a risk preference, not calculating a physical growth rate."

  ### (c) Originality Check

  **Is this new?**
  *   **The Math:** No. "Kelly betting with fixed transaction costs" or "Optimal gambling with house fees" is a known problem in control theory and quantitative finance. The specific result $f(W) = f^*(1 - c/W)$ is a standard derivation in that niche.
  *   **The Philosophy:** This is where you have leverage. Most discussions of Kelly vs. Expected Utility assume frictionless markets. Pointing out that the *Ergodic/Time-Average* argument specifically relies on scale invariance (and thus fails with fixed costs) is a nuanced and valuable contribution to the reading group.
  *   **Advice:** Do not claim you discovered the formula. Claim you are highlighting the **implications of the formula for the philosophical justification of Kelly.** Frame it as: "We often justify Kelly via growth rates; fixed costs show that justification is fragile."

  ### (d) Weakest Link and Strongest Objection

  **Weakest Link:**
  Your claim in §3 that the long-run rule is *always* more conservative.
  *   **Objection:** In some "gamble for resurrection" scenarios (e.g., if you must reach a target $W_{target}$ to survive), the optimal policy near ruin is to *increase* variance (bet more than Kelly).
  *   **Nuance:** However, since your objective is **Log Wealth** (which implies infinite risk aversion at $W=0$), you are safe. Log utility never gambles for resurrection; it always protects the downside. Just ensure you specify that your conservatism claim holds *for Log objectives*, not all objectives.

  **Strongest Objection from a Kelly Defender:**
  "Why are you maximizing Log Wealth at all?"
  *   A defender would argue: "If you have fixed costs, the goal shouldn't be maximizing growth rate; it should be maximizing **Expected Net Profit** ($E[W_T]$) or **Probability of Survival**. If you switch to maximizing $E[W_T]$, the optimal bet is often 'All-In' if the edge is positive, because the fixed cost is sunk. You haven't broken Kelly; you've just shown that Kelly (Log Utility) isn't the right objective function for high-overhead environments."
  *   **Counter:** Your rebuttal is that in a repeated internal market, survival (avoiding the $W<c$ trap) is the primary constraint, making Log (or similar) the only sensible objective.

  ### (e) Numerical Illustration

  Here is a concrete example to include. It highlights the "Trap" and the divergence between Myopic and Conservative play.

  **Parameters:**
  *   Win Probability $p = 0.55$ (Edge = 10%).
  *   Frictionless Kelly Fraction $f^* = 2(0.55) - 1 = 0.10$ (10%).
  *   Fixed Cost $c = \$5$ per round.
  *   Horizon: 10 Rounds.

  **Scenario A: Wealthy ($W = \$1,000$)**
  *   Ratio $c/W = 0.005$.
  *   **Myopic Rule:** $f = 0.10 \times (1 - 0.005) = 0.0995$.
  *   **Stake:** $\$99.50$.
  *   **Outcome:** Almost identical to frictionless Kelly. The overhead is negligible.

  **Scenario B: Struggling ($W = \$50$)**
  *   Ratio $c/W = 0.10$.
  *   **Myopic Rule:** $f = 0.10 \times (1 - 0.10) = 0.09$.
  *   **Stake:** $\$4.50$.
  *   **The Trap:**
      *   If you Win: $W' = 50 + 4.50 - 5 = \$49.50$. (Wealth *shrank* despite winning).
      *   If you Lose: $W' = 50 - 4.50 - 5 = \$40.50$.
      *   **Growth Rate:** Even using the optimal myopic fraction, the expected log growth is *negative*. You are in the "Death Spiral."
  *   **Long-Run Adjustment:** A dynamic optimizer sees that betting $\$4.50$ risks pushing $W$ closer to the hard barrier ($c=\$5$). Because $\ln(W)$ becomes very steep near zero, the long-run optimizer might choose $f = 0.05$ (Stake $\$2.50$) or even $f=0$ (Sit out) to preserve capital, accepting lower immediate growth to avoid the region where $c/W > 0.1$.
  *   **Lesson:** The Myopic rule says "Bet 9%". The Long-Run rule says "Bet 0% until you can deposit more capital." This vividly shows the failure of the myopic growth-rate argument.

  ### Summary of Suggested Edits

  1.  **Clarify §1:** Note that $2f^*$ is an approximation for the zero-growth point, not exact.
  2.  **Refine §3:** Explicitly mention that "Myopia fails because the Value Function is no longer logarithmic in Wealth." This sounds more rigorous to engineers.
  3.  **Soften §4:** Acknowledge that economists would view this as "Log Utility is a preference," rather than a "trap." Your point is that the *objective physical justification* disappears.
  4.  **Add the Numerical Example:** Use the \$50 wealth scenario to show that "Winning" can still mean "Shrinking," which breaks the intuition of growth investing.

  This is strong work. It bridges the gap between abstract decision theory and the gritty reality of backend infrastructure costs. Good luck with the reading group.
