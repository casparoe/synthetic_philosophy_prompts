      *   *Republican Liberty:* Freedom as non-domination. Not being subject to the arbitrary will of another. The tricky part here: Who is the "other"? If it's an algorithm with no human operator tweaking it for whims, is there domination?

  3.  **Develop the Scenario:**
      *   *Setting:* Let's go with a "Dynamic Housing Allocation System" (DHAS) for a city. Call it "MetroLiving."
