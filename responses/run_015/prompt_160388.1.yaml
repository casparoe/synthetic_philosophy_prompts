      *   *Check:* Did I answer the specific question "which bit is the load-bearing mistake"? Yes, need to highlight that clearly.

  6.  **Final Polish:** (Mental check of the "Chaining" explanation). The student says: "I can hop from my here-now to a distant 'now'... and so on... until I arrive at my own death." This is essentially constructing a sequence of spacelike hypersurfaces. The philosophical objection is that just because event $A$ is real and event $B$ is simultaneous with $A$ (in some frame), it doesn't follow $B$ is *ontologically* real in the same sense if $B$ is in $A$'s future light cone. The relation "is real for" is not necessarily transitive. Stein's theorem is the key reference here. I should mention Stein.

