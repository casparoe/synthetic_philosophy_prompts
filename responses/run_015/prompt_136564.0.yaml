          *   The "Birnam Wood" prophecy: Macbeth thinks it's impossible (necessary falsehood). It turns out to be metaphorically true. This shows the *language* of the future is indeterminate until the event occurs.
      *   *Where Philosophy Kills Drama:* If we treat the Witches as logicians, we lose the horror. The ambiguity *is* the point. If it's a clean logical puzzle, Macbeth is just a calculator. The tragedy is his *anxiety* about the logic. The philosophy works best as a description of Macbeth's *psychology*, not necessarily the universe's metaphysics.

  6.  **Refining the Logic (Self-Correction/Nuance):**
