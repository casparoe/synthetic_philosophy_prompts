      *   *Nuance:* The Witches aren't God. They don't know the TRL with certainty; they manipulate probabilities. Hecate's speech confirms they manufacture outcomes.
      *   *Key Distinction:* Distinguish between *logical necessity* (it must happen) and *causal necessity* (he makes it happen). The play conflates them.

  7.  **Final Polish:**
