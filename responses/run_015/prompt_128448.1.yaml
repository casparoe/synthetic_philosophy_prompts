      **MEMORANDUM**

      **TO:** All Clinical Staff, Department of Medicine
      **FROM:** Office of Bioethical Compliance and Causal Audit
      **DATE:** October 14, 2023
      **SUBJECT:** Protocol 88-B: Operationalization of Commission/Omission Dichotomy

      **1.0 PURPOSE**
      To establish standardized metrics for distinguishing between active causation of patient harm (Commission) and passive allowance of patient harm (Omission). This protocol ensures accreditation compliance regarding the Moral Causation Ledger (MCL).

      **2.0 MORAL CAUSATION LEDGER (MCL)**
      All clinical interactions must be logged in the MCL interface in real-time. Actions are binary-coded:
      *   **Type A (Commission):** Physical intervention altering physiological trajectory (e.g., intubation, injection).
      *   **Type O (Omission):** Withholding of intervention where physiological trajectory declines (e.g., withholding CPR, not answering call light).

      **3.0 INTERVENTION-OMISSION RATIO (IOR)**
      Staff must maintain a weekly IOR between 0.8 and 1.2. Deviations suggest ethical drift. An IOR >1.2 indicates excessive killing; an IOR <0.8 indicates excessive letting die. Both trigger mandatory re-education.

      **4.0 CLASSIFICATION OF EDGE CASES**
      **4.1 Ventilator Alarms:** Silencing an alarm is a Type A action (harming the silence). Ignoring the patient distress prompting the alarm is a Type O omission. Both must be logged sequentially if performed by the same agent.
      **4.2 Nutritional Support:** A feeding tube physically present but disconnected is classified as "Passive Infrastructure." If the pump is off, this is Type O. If the tube is clamped but connected, this is "Potential Commission," scored as 0.5 Type A.
      **4.3 Resource Allocation:** Denial of ICU bed due to scarcity is "Distributive Omission." However, if the denial involves active triage paperwork, the paperwork is Type A, while the resulting death remains Type O. Staff must log the paperwork separately from the outcome.

      **5.0 AUDIT AND COMPLIANCE**
      Randomized audits will verify MCL entries against patient outcomes. Discrepancies between logged Omissions and actual mortality rates will be flagged as "Causal Leakage."

      **ATTACHMENT A: FREQUENTLY ASKED QUESTIONS**

      **Q: If I walk away from a coding patient to log the omission, does the walking count as Commission?**
      A: Yes. Locomotion is a Type A action. You must log the walking (Type A) and the non-resuscitation (Type O) separately. If the walking accelerates the death by delaying care, the locomution shifts to Type A Causation.

      **Q: Does breathing count as an intervention?**
      A: No. Biological autonomy is exempt from the MCL. However, manual bagging is Type A.

      **Q: How do we classify the Resource Allocation Committee?**
      A: The Committee performs Collective Distributive Omission. Individual members log Type O. If a member votes "No" verbally, the vocalization is Type A, but the vote's effect remains Type O. This is known as "Verbal Commission of Omission."

      **Q: What if I intend to let die, but accidentally kill?**
      A: Intent is not tracked in the MCL, only morphological causality. Accidental killing is logged as Type A. You must file a Form 12-C to request a retroactive reclassification to Type O, pending review.

      **Q: Is stopping a infusion pump an action or an omission?**
      A: Pressing the "Stop" button is Type A. The subsequent lack of drug flow is Type O. You must log both events within a 30-second window to maintain causal continuity.

      **Q: What is the penalty for IOR deviation?**
      A: First offense: Warning. Second offense: Suspension of clinical privileges until the philosophical distinction is re-mastered. Third offense: Reassignment to Administrative Omission (paperwork only).

      **END OF PROTOCOL**

