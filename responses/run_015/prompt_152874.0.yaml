prompt: |-
  At a philosophy workshop, two participants — Maya and Leo — debated whether compatriots have special distributive claims. Maya opened by arguing that special obligations arise not from shared ethnicity but from being co-authors of a common institutional scheme: citizens jointly authorize coercive laws, share tax burdens, and expose one another to democratic risk in ways that create a distinctive reciprocity. Leo replied that this institutional defense begs the question, since many state boundaries are historically arbitrary and coercive. He proposed a distinction between membership obligations, which require consent, and coercive cohabitation obligations, which arise merely from being subject to the same state power; if Maya’s argument relies on the latter, then non-citizen residents and even outsiders affected by a state’s policies fall under the same umbrella, dissolving the compatriot priority she wants. Maya answered that Leo misses the specific reciprocity of risk-sharing unique to citizens — for example, citizens are uniquely liable to conscription or fiscal extraction by fellow citizens’ votes — and that this generates a legitimate priority even if borders are morally arbitrary. Leo countered that empirical risk-sharing is too contingent to ground normative priority: a wealthy citizen faces little real risk, while a foreign worker affected by her country’s trade policy bears substantial burden, so Maya’s criterion either over-includes or collapses back into cosmopolitan concern for anyone causally affected. They asked me to referee. Please go through their exchange step by step, rating the strength of each move, say where each speaker is right or wrong, and identify what both are missing — particularly regarding whether there is a principled line between political reciprocity and global causal interdependence.
reasoning: |-
  Here's a thinking process that leads to the referee report:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy workshop debate between Maya and Leo.
      *   **Topic:** Special distributive claims among compatriots (nationalism vs. cosmopolitanism/statism).
      *   **Task:** Go through the exchange step-by-step, rate the strength of each move, identify where each is right/wrong, and identify what both are missing (specifically regarding the line between political reciprocity and global causal interdependence).
      *   **Tone:** Analytical, philosophical, fair, adjudicating.

  2.  **Deconstruct the Debate:**

      *   **Maya's Opening (The Institutional/Reciprocity View):**
          *   *Claim:* Special obligations come from co-authorship of a common institutional scheme (laws, taxes, democratic risk).
          *   *Basis:* Distinctive reciprocity among citizens.
          *   *Implicit Theory:* Liberal Nationalism or Democratic Statism (reminiscent of Nagel, Ronzoni, or maybe a specific reading of Rawls).

      *   **Leo's First Reply (The Arbitrariness/Scope Challenge):**
          *   *Claim:* Institutional defense begs the question (boundaries are arbitrary/coercive).
          *   *Distinction:* Membership obligations (consent) vs. Coercive Cohabitation obligations (subject to power).
          *   *Implication:* If it's about coercion, non-citizens/outsiders affected should count. Dissolves compatriot priority.
          *   *Implicit Theory:* Cosmopolitanism or All-Subjected Principle (Goodin, Abizadeh).

      *   **Maya's Rebuttal (The Specific Risk Argument):**
          *   *Claim:* Leo misses specific reciprocity of *risk-sharing* unique to citizens (conscription, fiscal extraction via votes).
          *   *Defense:* Legitimate priority exists even if borders are arbitrary, based on this specific mutual liability.
          *   *Implicit Theory:* Deepening the "coercive co-authorship" view to focus on *mutual* vulnerability.

      *   **Leo's Counter (The Contingency/Cosmopolitan Collapse):**
          *   *Claim:* Empirical risk-sharing is too contingent (wealthy citizen vs. burdened foreign worker).
          *   *Implication:* Criterion over-includes (wealthy don't share risk) or collapses into cosmopolitanism (anyone causally affected).
          *   *Implicit Theory:* Consequentialist/Cosmopolitan critique of statist reciprocity.

  3.  **Evaluate Each Move (Step-by-Step):**

      *   *Maya 1:* Strong on internal logic of democratic theory. Weak on historical legitimacy of borders. (Strength: 8/10).
      *   *Leo 1:* Strong on the "all-subjected" critique. Weak on dismissing the normative significance of *joint* authorship vs. mere subjection. (Strength: 8/10).
      *   *Maya 2:* Strong on distinguishing mutual liability from unilateral impact. Weak on assuming citizenship guarantees equal risk. (Strength: 7/10).
      *   *Leo 2:* Strong on empirical contingency. Weak on conflating causal impact with political reciprocity. (Strength: 8/10).

  4.  **Identify Rights and Wrongs:**

      *   *Maya is Right:* About the normative significance of joint political agency and mutual liability. Mere causal impact isn't the same as political co-authorship.
      *   *Maya is Wrong:* To assume borders are normatively irrelevant to the *origin* of the scheme, and to assume risk is evenly shared among citizens.
      *   *Leo is Right:* That borders are often arbitrary and that causal impact creates moral claims. He exposes the empirical weakness of "shared risk."
      *   *Leo is Wrong:* To equate being *affected* by power with being a *co-author* of power. He conflates the "all-affected" with the "all-subjected/co-authoring."

  5.  **Identify What's Missing (The Crucial Synthesis):**

      *   *The Gap:* Both are stuck in a binary: either strong statism (Maya) or strong cosmopolitanism (Leo).
      *   *The Missing Link:* The distinction between *relational* duties (justice within a coercive framework) and *humanitarian* duties (global).
      *   *Specific Concept:* The "Basic Structure" (Rawls) vs. Global Basic Structure. Or the distinction between *reciprocity* (mutual exchange) and *solidarity* (shared fate).
      *   *The "Principled Line":* It lies in *institutional mediation*. Compatriots share a *framework for adjudicating claims* that outsiders do not. It's not just about risk or coercion, but about the *mechanism of redress*. Outsiders are affected, but they lack the democratic lever to change the policy. Citizens have the lever, hence the heavier burden to use it justly toward each other.
      *   *Also Missing:* The role of *time* and *trust*. Institutions build trust over time that abstract global causality does not.

  6.  **Drafting the Referee Report:**

      *   *Introduction:* Set the stage, acknowledge the depth of the debate (Statism vs. Cosmopolitanism).
      *   *Round 1 Analysis:* Maya's Institutionalism vs. Leo's Arbitrariness.
      *   *Round 2 Analysis:* Maya's Risk-Reciprocity vs. Leo's Contingency/Collapse.
      *   *Adjudication:* Who won? (Likely a draw, but Leo exposed a fatal empirical flaw in Maya's specific argument, while Maya exposed a normative flaw in Leo's conflation).
      *   *The Missing Piece:* Focus on the "Principled Line." Discuss *Political Reciprocity* vs. *Causal Interdependence*. Introduce the concept of *collective agency* and *mechanisms of redress*.
      *   *Conclusion:* Final verdict and suggestion for further inquiry.

  7.  **Refining the Philosophical Nuance:**
      *   Make sure to reference relevant concepts (All-Subjected Principle, All-Affected Principle, Rawlsian Basic Structure, Nagel's dualism).
      *   Ensure the critique of "risk" is sharp (wealthy vs. poor citizen).
      *   Ensure the critique of "coercion" is sharp (citizen vs. resident).
      *   *Self-Correction during drafting:* I need to make sure I don't just summarize but *evaluate*. Rate the moves. Be decisive.
      *   *Key Insight:* The missing piece is often the *capacity for collective self-correction*. Citizens can vote out the government causing the harm; foreigners usually cannot. This creates a special duty among citizens to ensure their collective agent doesn't harm others, but primarily to distribute the burdens of maintaining that agent among themselves.

  8.  **Final Polish:** Check tone (respectful but critical), structure (clear headings), and ensure all parts of the prompt are answered. (Step-by-step, ratings, right/wrong, missing elements).

  *(Self-Correction on Ratings)*: Be careful not to give 10/10s. Philosophy debates rarely have perfect moves. 7-8 is strong. 5 is average.
  *(Self-Correction on Missing Element)*: Don't just say "compromise." Identify a specific philosophical distinction they missed. The distinction between *justice* (institutional) and *humanity* (causal) is the classic Rawls/Nagel move, but maybe a more contemporary take on *democratic ownership* is better. Let's focus on the *mechanism of accountability*.

  9.  **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  **Referee Report: The Compatriot Priority Debate**
  **Participants:** Maya (Democratic Statist/Reciprocity View) vs. Leo (Cosmopolitan/All-Subjected View)
  **Subject:** Grounds of Special Distributive Claims

  ### Executive Summary
  This exchange captures the core tension in contemporary political philosophy between **relational statism** (justice is specific to political relationships) and **cosmopolitanism** (justice tracks moral impact or humanity). Both participants deploy high-caliber arguments, but both rely on unstated premises that weaken their concluding positions. Maya successfully identifies a normative distinction in political agency but fails to account for empirical inequality within the state. Leo successfully exposes the arbitrariness of borders but conflates *being affected* with *co-authorship*.

  Below is the step-by-step adjudication.

  ---

  ### Round 1: Institutional Co-Authorship vs. Historical Arbitrariness

  **Maya's Opening Move:**
  *   **Argument:** Special obligations arise from co-authorship of a coercive institutional scheme (laws, taxes, democratic risk). This creates distinctive reciprocity.
  *   **Strength Rating:** 8/10
  *   **Analysis:** Maya is channeling a sophisticated version of liberal statism (reminiscent of Thomas Nagel or Michael Blake). She correctly identifies that *joint authorization* is normatively different from mere proximity. By framing citizenship as "exposing one another to democratic risk," she moves beyond vague cultural nationalism to a hard-nosed institutional claim.
  *   **Where She Is Right:** She correctly notes that citizens impose laws on *each other*. This mutual imposition generates a duty of justification that is denser than general moral duties.
  *   **Where She Is Vulnerable:** She assumes the institutional scheme is legitimate enough to generate obligations. If the state is fundamentally unjust, does "co-authorship" still bind?

  **Leo's First Reply:**
  *   **Argument:** Institutional defense begs the question because borders are historically arbitrary/coercive. Distinguishes membership (consent) vs. coercive cohabitation (subjection). Claims this dissolves compatriot priority to include all affected subjects.
  *   **Strength Rating:** 8.5/10
  *   **Analysis:** Leo invokes the "All-Subjected Principle" (Abizadeh) and the cosmopolitan critique of border arbitrariness. His distinction between *membership* and *cohabitation* is sharp. If the ground of obligation is coercion, then a non-citizen resident subject to the law should have the same claim as a citizen.
  *   **Where He Is Right:** He exposes the circularity in Maya's view. You cannot use the state to justify the state's boundaries if those boundaries were drawn by violence.
  *   **Where He Is Wrong:** He conflates *subjection* with *co-authorship*. A tourist or undocumented resident is subject to laws but lacks the democratic lever to change them. Treating them identically to citizens ignores the normative weight of *agency*.

  **Round 1 Verdict:** **Leo takes the point on historical legitimacy, but Maya holds the line on normative agency.**

  ---

  ### Round 2: Specific Risk-Reciprocity vs. Empirical Contingency

  **Maya's Rebuttal:**
  *   **Argument:** Leo misses the specific reciprocity of risk-sharing unique to citizens (conscription, fiscal extraction via votes). This generates legitimate priority even if borders are arbitrary.
  *   **Strength Rating:** 7/10
  *   **Analysis:** Maya attempts to salvage the view by focusing on *mutual vulnerability*. She argues that citizens are uniquely liable to the decisions of their peers.
  *   **Where She Is Right:** There is a qualitative difference between being harmed by a foreign policy (external) and being taxed/conscripted by a domestic majority (internal). The latter implies a shared ownership of the coercive apparatus.
  *   **Where She Is Wrong:** She idealizes the citizen experience. She assumes a symmetry of risk that does not exist empirically.

  **Leo's Counter:**
  *   **Argument:** Empirical risk-sharing is too contingent. A wealthy citizen faces little risk; a foreign worker bears substantial burden from trade policy. Maya's criterion either over-includes (wealthy citizens with no risk) or collapses into cosmopolitanism (anyone causally affected).
  *   **Strength Rating:** 9/10
  *   **Analysis:** This is the strongest move of the debate. Leo utilizes a materialist critique of formal citizenship. If the "special obligation" relies on shared risk, but the rich are insulated from that risk, the ground evaporates. Furthermore, if the ground is "burden," the foreign worker bears more burden than the wealthy citizen.
  *   **Where He Is Right:** He demonstrates that *formal* citizenship does not guarantee *substantive* reciprocity.
  *   **Where He Is Wrong:** He conflates *causal burden* with *political liability*. The foreign worker suffers, but they do not share in the *decision-making liability*. Leo's move risks collapsing all morality into a calculus of harm, ignoring the specific duties of democratic owners to clean up their own machine.

  **Round 2 Verdict:** **Leo wins on empirical grounds; Maya wins on conceptual grounds.**

  ---

  ### Adjudication: Who Is Right and Wrong?

  **Maya is Right That:**
  1.  **Political Agency Matters:** There is a morally relevant difference between being a *victim* of a state's policy and being a *part-owner* of that state. Co-authorship generates duties of justice, not just humanity.
  2.  **Reciprocity is Relational:** Special obligations require a specific relationship, not just causal interaction.

  **Maya is Wrong That:**
  1.  **Risk is Symmetrical:** Her argument collapses under the weight of domestic inequality. If the poor are conscripted and the rich are not, the "shared risk" premise is false.
  2.  **Borders are Normatively Inert:** She treats the existing institutional scheme as a given, ignoring Leo's point that the scheme itself may be illegitimate.

  **Leo is Right That:**
  1.  **Borders are Arbitrary:** Historical coercion undermines the moral weight of citizenship boundaries.
  2.  **Causal Impact Creates Claims:** Those severely affected by state policy (even outsiders) have moral claims that cannot be ignored.

  **Leo is Wrong That:**
  1.  **Causality Equals Reciprocity:** He conflates the "All-Affected Principle" with the "All-Subjected Principle." Being harmed by a state does not make you a member of its democratic collective.
  2.  **Contingency Negates Normativity:** Just because risk-sharing is imperfect (wealthy vs. poor) doesn't mean the *institutional relationship* ceases to generate duties. It means the state is failing its citizens, not that the duty doesn't exist.

  ---

  ### The Missing Piece: The Principled Line

  Both participants are missing a crucial distinction regarding **Mechanisms of Redress and Collective Agency**. This is where the principled line between political reciprocity and global causal interdependence lies.

  **1. The Capacity for Collective Self-Correction**
  Maya argues from *risk*; Leo argues from *impact*. Both miss the argument from *agency*.
  *   **Compatriots:** Share a mechanism to *correct* the injustice. If a state enacts a harmful policy, citizens have the vote, the protest, and the legal standing to change it. They are co-responsible for the *maintenance* of the machine.
  *   **Outsiders:** Lack this mechanism. They are victims of the machine, not operators.
  *   **The Missing Principle:** Special distributive claims among compatriots are not just about sharing burdens (Maya) or avoiding harm (Leo); they are about the **duty to maintain a just basic structure together**. Citizens owe each other priority because they are the only ones who can jointly fix the system when it breaks.

  **2. Justice vs. Humanity**
  The debate conflates two types of duties:
  *   **Duties of Justice (Maya's target):** Arise from shared institutional membership. These are stringent, enforceable, and distributive.
  *   **Duties of Humanity (Leo's target):** Arise from causal impact/need. These are universal but often less stringent regarding *distribution* of specific social goods.
  *   **The Synthesis:** Leo is right that outsiders have claims (Humanity), but Maya is right that those claims are different in kind from compatriot claims (Justice). The "principled line" is not the border itself, but the **presence of a shared coercive framework that claims legitimacy over the individual.**

  **3. The "Trust" Variable**
  Both miss the sociological precondition of distributive justice: **Trust.**
  *   High levels of redistribution require high levels of trust that contributions will be reciprocated.
  *   This trust is generated by the specific institutional history Maya mentions, but it is fragile.
  *   Leo's cosmopolitanism demands redistribution without the institutional machinery to generate the necessary trust. Maya's statism assumes trust exists without proving it (as Leo's wealthy citizen example shows).

  ### Final Recommendation

  **Winner:** **Draw (with a lean to Leo on empirical consistency, Maya on normative structure).**

  **Path Forward:**
  To resolve the impasse, the participants must move beyond "risk" and "coercion" and discuss **Democratic Ownership**.
  *   **Maya** must concede that compatriot priority is not absolute; it is conditional on the state not violating the basic rights of outsiders (Leo's point).
  *   **Leo** must concede that causal impact does not grant democratic membership. Outsiders have claims to *not be harmed*, but not necessarily claims to *share in the surplus* generated by a cooperative scheme they did not join.

  **The Principled Line:** The line is drawn at **collective accountability**. Compatriots have special claims because they are collectively accountable for their state's actions in a way outsiders are not. Therefore, they must prioritize the justice of their own scheme first, not because they are more important, but because they are the only ones who can fix it.
