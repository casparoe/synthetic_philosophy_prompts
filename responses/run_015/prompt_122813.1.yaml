answer: |-
  The legality principle (*nullum crimen, nulla poena sine lege*) is designed to constrain state power over citizens by requiring pre-existing law. Applying it to Nuremberg and Tokyo requires disentangling three distinct retroactivities your team has collapsed. First, retroactive creation of new crimes (Aggressive War, Crimes Against Humanity). Second, retroactive removal of a defense (Superior Orders). Third, retroactive innovation in jurisdiction (international court over sovereign heads). The legality principle bites hardest on the first. Creating a crime where none existed violates the core notice function. Removing a defense is a substantive fairness issue, distinct from the definition of the crime itself. Jurisdictional innovation is a sovereignty question, not strictly a legality problem. Conflating these allows proponents to defend jurisdiction by pointing to the morality of the crimes, while critics dismiss the crimes because of the jurisdiction.

  Your colleague's ladder is useful because it quantifies the retroactivity rather than binary labeling it. War Crimes largely sit on Rung 1 or 2; the conduct violated existing Hague/Geneva conventions, even if the individual liability label was new. Crimes Against Humanity occupy Rung 2 and 3; murder was criminal domestically, but systematic persecution as an international offense was not codified. Crimes Against Peace are firmly Rung 3; war was condemned by treaty (Kellogg-Briand), but individual criminal liability was not established. Conspiracy approaches Rung 4; while criminal in common law, applying it to international policy planning lacked clear precedent. The ladder does not restate the conclusion; it isolates where the stretch is largest. It shows that rejecting Rung 3 does not require rejecting Rung 1.

  The swap test reveals the limits of the legality principle rather than the corruption of the doctrine. The Allies exempting their own area bombing or the Emperor fails the moral symmetry test, but legally it demonstrates that legality protects the accused from the prosecutor's arbitrariness, not the loser from the winner's politics. The principle cannot constrain who the victor chooses *not* to prosecute. This asymmetry suggests the tribunals were political-legal hybrids. The swap test shows that legality was never designed to fix power imbalances between sovereign entities, only between state and individual.

  Regarding the legality principle itself, Nuremberg represents an unanticipated case. The principle assumes a stable state prosecuting citizens within a functioning legal order. It was not designed for regime collapse where the accused *were* the state. The Radbruch formula ("extremely unjust statutes aren't law") is not a way out within legality; it is a natural law override. It changes the subject from notice to morality. It argues that the defendants' own laws were void, so no retroactivity occurred. This bypasses the legality problem rather than solving it. For your commission, this suggests the principle is silent on state architects. It protects citizens planning their lives, not officials planning state policy.

