answer: |-
  This is a sophisticated problem because it sits at the intersection of epistemology (what can be known), ethics (what we owe the dead), and aesthetics (what makes a story work). You are right that the historiography (Ranke, White, etc.) often fails the novelist because it argues about the nature of *history*, not the craft of *fiction*.

  You are asking for a principle that achieves **reflective equilibrium**: a rule that explains your gut instincts but is also robust enough to tell you when your gut is wrong.

  Here is the principle, followed by the audit of your list, the new cases, and the hard truths about where your current verdicts fail the test.

  ### The Principle: The Integrity of the Trace

  **Definition:** History reaches us through *traces* (documents, locations, dates, identities). Fiction operates in the *gaps* between traces (motives, atmosphere, private interaction).
  **The Rule:** You may invent anything that occupies a gap, but you may not invent anything that mimics, contradicts, or erases a trace.

  This principle relies on a distinction between **Evidence** (things that can be cited, verified, or entered into a database) and **Experience** (things that must be consumed in the context of the narrative).

  #### Clause 1: Do not fabricate Evidence.
  *   **Motivating Case:** *The made-up sentence in quotation marks.*
  *   **Reasoning:** Quotation marks are a typographical claim that a document exists. They mimic a primary source. A reader (or a future biographer) can detach that sentence and cite it. It has become a false trace.
  *   **Application:** This is why "Paraphrase to Direct Speech" is **Not Fine**. You are turning a gap (someone reported he said X) into a trace (He said "X").

  #### Clause 2: Do not contradict the Verifiable Record.
  *   **Motivating Case:** *Moving a datable event by nine days.*
  *   **Reasoning:** Dates and locations are coordinates in the historical grid. To move them is to break the grid. It creates a falsehood that can be checked against external records.
  *   **Application:** This is where I must challenge you. Your verdict on *The Wrong Room* ("Fine") violates this clause. If a person is documented in City A, placing them in City B is not "staging"; it is contradicting a trace. It is the same move as shifting the event by nine days. **To achieve equilibrium, you must mark "Wrong Room" as Not Fine.** The intuition that "words are heavier than whereabouts" is a formalist illusion; a location in a historical novel is a claim of fact.

  #### Clause 3: Do not erase distinct Agents.
  *   **Motivating Case:** *Fusing two real minor figures into one composite.*
  *   **Reasoning:** This is not just about truth; it is about ontology. A composite character deletes a human being from the record to serve a narrative economy. It creates a "false trace" (a person who didn't exist as described) and destroys a "true trace" (the person who did).
  *   **Application:** This validates your gut that the Composite is worse than the Invented Minor. The Invented Minor fills a gap (the furnace boy is unknown). The Composite erases a trace (the second clerk is known).

  #### Clause 4: Interiority is a Gap.
  *   **Motivating Case:** *Real person's thoughts/motives.*
  *   **Reasoning:** Unless a diary entry exists, thoughts leave no trace. They are inherently unverifyable. Therefore, they belong to the novelist's jurisdiction.
  *   **Application:** This remains **Fine**, provided it doesn't contradict known psychology or stated intent (the "unless the record says otherwise" caveat).

  ---

  ### Application to New Cases

  Here is how *The Integrity of the Trace* handles the scenarios you didn't list:

  **1. A novel narrated in first person by a real historical person.**
  *   **Verdict:** **High Risk / Not Fine (unless signalled as speculative).**
  *   **Reasoning:** First-person narration mimics a memoir or diary. It claims the authority of a trace ("I did this"). If you invent thoughts or events in the first person, you are forging a memoir. It blurs the line between Clause 1 (Evidence) and Clause 4 (Interiority).
  *   **Fix:** This requires a jacket signal stronger than usual, or an author's note that explicitly disclaims the "memoir" aspect.

  **2. A real person who is recognisable but renamed.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Renaming breaks the citability. A reader cannot take the name "Jakob" and insert him into a biography of "Joseph." It signals that this is a fictionalised representation, moving the character from the realm of Trace to the realm of Experience.

  **3. Two real events merged into one.**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This violates Clause 2. It creates a false chronology and causality. If Event A caused Event B in reality, but you merge them so they happen simultaneously, you have altered the historical mechanism. It is a "detachable falsehood."

  **4. A real documented quotation given to the wrong real person.**
  *   **Verdict:** **The Worst Thing.**
  *   **Reasoning:** This violates Clause 1 and Clause 3 simultaneously. It fabricates a trace (the quote) and misattributes agency (the speaker). It is historically poisonous.

  **5. An author's note at the end that lists everything I changed.**
  *   **Verdict:** **Necessary, but not absolving.**
  *   **Reasoning:** An author's note repairs the contract *after* the fact, but it does not stop the "detachability" problem during reading. A reader might remember the quote but forget the note. However, it is ethically mandatory for any violation of Clause 2 or 3.

  **6. Whether it matters if the invented thing is vile rather than trivial.**
  *   **Verdict:** **Yes, it matters ethically, but not technically.**
  *   **Reasoning:** Under *The Integrity of the Trace*, a lie is a lie. However, the *harm* is greater with vile acts. If you invent a trivial habit, you distort the record. If you invent a crime or a moral failing, you defame the dead. The principle holds, but the stakes are higher.

  ---

  ### Reflective Equilibrium: The Hard Corrections

  You asked me to be honest about which verdicts I would overturn to save the principle. A principle that fits every gut instinct is just a rationalisation of bias. Here is where your list conflicts with *The Integrity of the Trace*:

  **1. The "Wrong Room" Verdict (Must Overturn)**
  *   **Your View:** Fine.
  *   **Principle View:** Not Fine.
  *   **Why:** You argue that a body in a room is "staging" while a sentence is "testimony." But if the record places the body elsewhere, you are not staging; you are lying about data. If a biographer reads your novel, they cannot use the location data. It creates the same "detachable falsehood" as the quote. To be consistent with your ban on "Moving a datable event," you must ban "Moving a datable person."

  **2. The "Paraphrase to Direct Speech" Verdict (Must Overturn)**
  *   **Your View:** Torn, leaning Fine.
  *   **Principle View:** Not Fine.
  *   **Why:** You say it's just turning a letter's report into speech. But the *form* changes the epistemic status. A paraphrase is "He claimed he was angry." Direct speech is "I am angry." The latter mimics a transcript. It invites citation. It crosses from Gap to Trace.

  **3. The "Jacket Copy" Defence (Must Qualify)**
  *   **Your View:** Worried that signalling via jacket copy isn't enough because readers skip it.
  *   **Principle View:** You are right to worry.
  *   **Why:** Signalling only works if it travels with the fact. Since quotes and plot points travel without the jacket, the signalling is insufficient for "Counterfactual Events." If you change a fact, the text itself must carry the uncertainty (e.g., through narrative voice), not just the paratext.

  ### Summary for the 7am Desk

  When you are writing and feel the doubt, ask these three questions in order:

  1.  **Can this be cited?** (If I put this in a footnote, would it look like a fact?)
      *   *If Yes:* Do not invent it. (Quotes, Dates, Locations).
  2.  **Does this delete someone?** (Am I combining two people to save page space?)
      *   *If Yes:* Do not do it. (Composites).
  3.  **Is this a gap?** (Is this a thought, a private moment, or a person the record forgot?)
      *   *If Yes:* You are free.

  **The Trade-off:**
  By accepting this, you lose the ability to put your real characters in convenient rooms when the history says they were elsewhere. You lose the dramatic punch of putting a specific famous quote in a scene where it didn't happen.
  **The Gain:** You gain a clear conscience regarding the dead, and you protect your work from becoming "false history" in the cultural memory. You are writing a novel *about* the glassmakers, not a replacement for their biography.

  Your friend is half-right: it is about licence. But the licence isn't granted by the jacket; it's granted by the **form**. If you write it like a fact, you owe the truth. If you write it like a story, you owe the truth only to the human experience, not the ledger. The quote marks make it look like the ledger. The scene makes it look like the story. Keep them separate.
