answer: |-
  Here is the argumentative map you need for your supervision. I have analysed your supervisor's track record to isolate the competing principles at play, predicted her response to the 'U' cases, and identified the pressure point where her position is most vulnerable.

  ### 1. The Three Competing Rules

  Your supervisor's verdicts are consistent with three distinct interpretative rules of the Nozickian framework. They fit her existing record equally well, which is why she can maintain her position without contradiction *until now*.

  **Rule A: The Species-Norm View (Kind-Relative Status)**
  Moral status is determined by the characteristic capacities of the biological kind to which the individual belongs, not by their individual functioning.
  *   *Fits the record:* Explains Normal Human > Normal Chimp. Explains why she saves the Human even when the Chimp is painlessly killed for a finger (Human kind has side-constraints; Chimp kind does not). Explains why she refuses to aggregate chimps against humans (different moral currencies).
  *   *Implication for U:* U is biologically a chimpanzee. Therefore, U falls under the 'animal' utilitarian calculus, regardless of actual capacities.

  **Rule B: The Individual Capacity View (Actual Functioning)**
  Moral status tracks the actual, current psychological capacities of the individual (autonomy, narrative self, rationality).
  *   *Fits the record:* Explains Chimp > Pig (higher capacity). Explains her hesitation on the Index Finger (recognising significant chimp interest). Explains the 'marginal superiority' clause (if capacities are too close, we cannot favour the human).
  *   *Implication for U:* U has person-level capacities. Therefore, U merits side-constraints equal to a person.

  **Rule C: The Biographical/Historical View (Membership Trajectory)**
  Moral status depends on having participated in the moral community of persons, either by having been a person or by having the potential history of a person.
  *   *Fits the record:* This is the only rule that explains her evasion on the Demented Human. A capacity view (Rule B) suggests saving the Chimp over the Demented Human. A species view (Rule A) suggests saving the Human. Her discomfort suggests she knows Rule B threatens her human-privilege, but she cannot endorse Rule A without sounding like a brute speciesist. She relies on the *history* of personhood to protect the demented human.
  *   *Implication for U:* U has a history of non-personhood (39 years as a standard chimp). This counts against her compared to a human who *was* a person.

  ### 2. Predicted Verdicts on 'U'

  Here is where she will likely land when you present the Uplifted Chimp cases.

  **Case 1: U vs. Normal Adult Human (1v1, death)**
  *   **Prediction:** Save the Human.
  *   **Reasoning:** She will prioritise Rule A (Species-Norm). Nozick's text leans heavily on 'kind' characteristics to avoid the charge of speciesism while maintaining human priority. She will argue that U's capacities, while impressive, are an anomaly of the chimp kind, whereas the human's capacities are normative for their kind. She will likely claim the human's superiority is *not* marginal because it is grounded in the nature of the kind, not the accident of the individual.

  **Case 2: U vs. Demented Human**
  *   **Prediction:** Save the Demented Human (but with significant discomfort).
  *   **Reasoning:** Here, Rule A and Rule C align against Rule B.
      *   *Rule A:* Human kind > Chimp kind.
      *   *Rule C:* Past personhood (Demented Human) > Past non-personhood (U).
      *   She will seize on the biographical detail you provided: U spent 39 years as an ordinary chimp. She will argue U lacks the *biographical membership* in the moral community that the demented human retains. This allows her to avoid the utilitarian calculation that Rule B would force upon her.

  **The Variants:**
  *   *If U was uplifted from birth:* She will still lean Human, but Rule C loses force. She will retreat harder into Rule A (Species).
  *   *If the Human lost capacities recently:* She will lean Human even more strongly (Rule C is maximised).

  ### 3. The Killer Case: To Force Her Hand

  You need a case that neutralises Rule A (Species) and Rule C (History), leaving only Rule B (Capacity). If she rejects Rule B here, she admits her Nozickianism is brute speciesism. If she accepts Rule B, she undermines her verdict on the Normal Human vs. Normal Chimp.

  **The Case:** **A congenitally disabled human (severe, never possessed higher agency) vs. U (uplifted from birth).**

  *   **Why this works:**
      1.  **Neutralises History (Rule C):** The human has no past history of personhood (unlike the demented case). U has no past history of non-personhood (uplifted from birth).
      2.  **Pressures Species (Rule A):** Both are 'defective' relative to their kind's norm. The human lacks the species-typical capacity; the chimp exceeds it.
      3.  **Forces Capacity (Rule B):** The only differentiating factor is current individual capacity.
  *   **The Trap:**
      *   If she saves the **Human**, she admits that biological lineage trumps actual personhood capacities, even when the human has never functioned as a person. This exposes her view as incompatible with the 'meaningful life' clause Nozick emphasises.
      *   If she saves **U**, she concedes that side-constraints track capacity, not species. This forces her to re-evaluate the Normal Human vs. Normal Chimp case (why does the chimp not get side-constraints if capacity is the metric?) and potentially the aggregation issue.

  ### 4. The Least Stable Existing Verdict

  The verdict you should push on, without her immediately noticing where it leads, is: **Chimp painlessly killed to save a human's index finger.**

  *   **Why it is unstable:** This is the point where her 'utilitarian treatment of animals' clashes most violently with the 'side-constraint' intuition.
  *   **The Argument:**
      1.  Ask her if U (the uplifted chimp) could be killed to save a human's index finger.
      2.  If she says **No** (U is too 'person-like' to die for a finger): She admits that reaching a threshold of capacity grants something *like* a side-constraint. This undermines the absolute distinction between humans and animals. It suggests the 'animal utilitarianism' is actually a 'capacity utilitarianism'.
      3.  If she says **Yes** (U can die for a finger): She commits to the view that even a being with a narrative self, language, and projects is morally worth less than a human finger. This is a very hard pill to swallow and may alienate her from the 'meaningful life' justification she claims to hold.
  *   **How to use it:** Do not lead with this. Use it as a follow-up to her verdict on U. If she saves the Human over U, ask: "Does U retain any inviolability? Could I kill U to prevent a human from losing a finger?" Her answer will reveal whether she thinks U has crossed the threshold into 'personhood' status or remains a 'super-animal'.

  ### Summary of Strategy

  1.  **Present U vs. Normal Human.** Expect her to save the Human (Rule A).
  2.  **Present U vs. Demented Human.** Expect her to save the Human (Rule A + Rule C).
  3.  **Deploy the Killer Case:** Congenitally disabled Human vs. Birth-Uplifted U. This removes her biographical shield.
  4.  **Exploit the Instability:** Query the Index Finger verdict in relation to U. If U is person-capable, the finger trade becomes morally grotesque. If she admits this, she must concede that capacity, not species, generates side-constraints.

  Ensure your spelling is consistent with British conventions (e.g., *prioritise*, *analyse*, *colour*, *favour*) when you write this up. She may be a Nozickian, but she is a British Nozickian, and orthographic drift will distract her from the logical drift you are engineering.
