      *   *Wait, looking closer at the record:* "One human killed to save five humans: absolutely not." (Side constraints absolute). "Chimp painlessly killed to save human's index finger: fine."
      *   This implies Chimps do *not* have side-constraints. They have utilitarian weight.
      *   But if U has personhood capacities, does U get side-constraints?
      *   The instability is the **Finger Verdict**. It relies on the chimp having *low* moral weight. If U has *high* moral weight (person-level), the finger verdict should flip. But if species determines the weight, it stays.
      *   *Better instability:* The **Demented Human Evasion**. It's not a verdict, it's a dodge. But the prompt asks for an existing *verdict*.
      *   Let's stick with the **Index Finger**. It's the threshold where "utilitarian treatment of animals" meets "significant harm." If U is a person, killing U for a finger is murder. If U is an animal, it's permissible. This forces her to define U's status clearly.

  9.  **Drafting the Response (incorporating British English):**
