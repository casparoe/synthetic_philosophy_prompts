answer: |-
  When Jake submitted his thesis last month, I joked that I'd finally have to stop calling him my student. But standing here, I realize the supervision never really ends; we just stop grading the work. Jake asked me not to list the reasons he's marrying [Bride]. He said if he needed a list, he'd have married a spreadsheet. He's right. A marriage built on a balance sheet collapses when the numbers change.

  We know Jake and [Bride] live by a demanding standard. They rearrange careers and give over half their income because they believe the world needs it. It would be tempting to stand here and say this marriage is justified because it maximizes that good. But that would be to misunderstand what a vow is. A vow isn't a hypothesis to be tested by its outcomes. It is a ground project—a commitment that generates its own reasons, rather than waiting for them from the outside.

  To [Bride]'s family, particularly her grandmother: I know you understand that some bonds are not made by us, but given to us. There is a grace in this union that precedes our understanding of it. It is not merely a human contract, but a mystery kept faithful. The sacrament isn't a reward for utility; it's a vessel for grace.

  To Jake's father: You know integrity matters. But integrity isn't a shield against criticism. It's the capacity to stand for something without demanding the universe validate it first. This marriage isn't immune to moral demand; it is the place where they meet those demands together. It won't always be efficient. It won't always be optimal. But it will be theirs. They do not claim this union is beyond criticism; they claim it is not subject to impersonal audit. There is honesty in that distinction.

  There is a risk in this. To build a life on a promise is to accept that you might fail. But that vulnerability is precisely where the value lies. It's not that the world cannot question this union; it's that the union doesn't exist to answer to the world's impersonal metrics. It exists to answer to each other, and to the duty they share. If this marriage were merely a tool for good, it would be disposable when a better tool appeared. But it is not a tool. It is a home.

  So, I won't tell you why this is right. I will tell you that it is real. In a world obsessed with optimization, you have chosen fidelity. In a culture of exit clauses, you have chosen a covenant. That is not a calculation. It is a gift.

  Please raise your glasses. To Jake and [Bride]. May your life together be long, may it be hard when it needs to be, and may you always find that the promise was enough.

  **What I had to leave out**

  I wanted to explicitly cite Williams' "one-thought-too-many" argument to signal the department, but naming him would turn the toast into a lecture. I also cut a clearer distinction between "impersonal audit" and "moral critique" to avoid sounding like I was granting them immunity from ethical scrutiny; the line about integrity not being a shield had to carry that weight alone. Finally, I resisted saying "God bless this union" directly; while warm, it might alienate the secular guests, whereas "vessel for grace" signals the sacrament to the grandmother without excluding the room. The constraint bit hardest on the father: I wanted to acknowledge the utility of their EA work without implying the marriage serves it, which required careful phrasing around "tool" versus "home."
