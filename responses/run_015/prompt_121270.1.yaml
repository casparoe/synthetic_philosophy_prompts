  2.  **Deconstruct the Philosophical Tightrope:**
      *   *Williams' "One Thought Too Many":* The idea that moral justification shouldn't always be the motivating factor in personal relationships (e.g., saving a wife vs. a stranger). The toast must reflect that Jake isn't marrying her *because* it maximizes utility or *because* she meets a criteria list, but because it's *his* life/project.
