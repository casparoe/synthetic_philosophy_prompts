      *Drafting text:*
      "When Jake submitted his thesis last month, I joked that I'd finally have to stop calling him my student. But standing here, I realize the supervision never really ends; we just stop grading the work. Jake asked me not to list the reasons he's marrying [Bride's Name]. He said if he needed a list, he'd have married a spreadsheet. He's right. A marriage built on a balance sheet collapses when the numbers change.

      Some of you know that Jake and [Bride] live their lives by a demanding standard. They give deeply of what they have. It would be tempting to say this marriage is justified because it enables that good work. But that would be to misunderstand what a vow is. A vow isn't a hypothesis to be tested by its outcomes. It is a ground project—a commitment that generates its own reasons, rather than waiting for them.

      To [Bride]'s family, particularly her grandmother: I know you understand that some bonds are not made by us, but given to us. There is a grace in this union that precedes our understanding of it. It is not merely a human contract, but a mystery kept faithful.

      To Jake's father: You know better than anyone that integrity matters. But integrity isn't a shield against criticism. It's the capacity to stand for something without demanding the universe validate it first. This marriage isn't immune to the demands of the world; rather, it is the place where they meet those demands together. It won't always be efficient. It won't always be optimal. But it will be theirs.

      There is a risk in this. To build a life on a promise is to accept that you might fail. But that vulnerability is precisely where the value lies. It's not that the world cannot question this union; it's that the union doesn't exist to answer to the world's impersonal metrics. It exists to answer to each other, and to the duty they share.

      So, I won't tell you why this is right. I will tell you that it is real. In a world obsessed with optimization, you have chosen fidelity. In a culture of exit clauses, you have chosen a covenant. That is not a calculation. It is a gift.

      Please raise your glasses. To Jake and [Bride]. May your life together be long, may it be hard when it needs to be, and may you always find that the promise was enough."

