      *   *Correction:* Make sure the "Vote" option is clear. It shouldn't be the default, but the escape hatch.
      *   *Correction:* Ensure the "Three Layers" theory is explicitly referenced in the intro so the user knows I heard them.
      *   *Correction:* Check spelling carefully. "Volenteer" in prompt -> "Volunteer" in response. "Center" not "Centre." "Labor" not "Labour."

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
