prompt: |-
  I run a small community makerspace where people share craft patterns and little mechanical hacks, and lately we've been getting these ugly fights about who 'owns' a modified idea. I'm not a lawyer or philosophy professor - I just fix bikes and organize the tool library. But I was thinking about how ideas are weird because if I give you an idea I still have it, which doesn't work for normal property. And there's this other thing I think is true but I don't know the fancy name: every idea has three layers - the original spark, the actual labor someone puts into adaptating it, and the community context that makes it useful in the first place. I want you to turn that into an actual decision procedure my volenteer mediators can run when two members fight over a design. It needs to be a step-by-step checklist they can do in about 20 minutes with no legal training, saying exactly what counts as a yes or no at each step, where it stops and says 'this is a values question, vote on it,' and where it might accidentally screw over the original creator. Apply it to three real-ish scenarios: someone who took an open knitting pattern and just swapped the yarn weight, someone who mashed together two old bike-frame ideas into something genuinely different, and a case where the procedure says 'nobody owns this, release it' but the person who came up with the spark is gonna be furious. Be honest about what the checklist can't catch and where human judgment still sneaks in. Also please write the answer in American English, not British spellings like 'colour' or 'centre.'
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small community makerspace (bikes, tools, crafts). Not a lawyer/philosopher.
      *   **Problem:** Fights over ownership of modified ideas/designs.
      *   **Core Insight:** Ideas are non-rivalrous (I give it, I keep it). Ideas have three layers: Original Spark, Labor/Adaptation, Community Context.
      *   **Task:** Create a step-by-step decision procedure (checklist) for volunteer mediators.
      *   **Constraints:**
          *   ~20 minutes to run.
          *   No legal training required.
          *   Clear Yes/No criteria at each step.
          *   Identify where it stops and becomes a "values vote."
          *   Identify risks to the original creator.
          *   Apply to three specific scenarios (Knitting yarn swap, Bike frame mashup, "Nobody owns this" fury case).
          *   Be honest about limitations (where human judgment sneaks in).
          *   **Language:** American English (no "colour," "centre," etc.).

  2.  **Deconstruct the "Three Layers" Theory:**
      *   *Layer 1: Original Spark.* The core concept. Hard to own.
      *   *Layer 2: Labor/Adaptation.* The sweat equity. Easier to claim.
      *   *Layer 3: Community Context.* The shared knowledge/tools that made it possible. Belongs to everyone.
      *   *Goal:* Balance recognition for labor without monopolizing the spark or ignoring the community.

  3.  **Drafting the Decision Procedure (The "Makerspace Mediation Checklist"):**
      *   *Tone:* Practical, plain English, empathetic but firm.
      *   *Structure:* Intake -> Step 1 (Spark) -> Step 2 (Labor) -> Step 3 (Context) -> Resolution.
      *   *Time Limit:* Needs to be tight. 5 mins per step roughly.
      *   *Criteria:* Needs to be observable, not abstract.
      *   *Stop Point:* Where do we say "We can't decide, vote"? Probably when Labor and Spark are too entangled.

      *Drafting Steps:*
      *   *Step 1: The "Copy-Paste" Test.* Did they just change the label? (Addresses Layer 1).
      *   *Step 2: The "Sweat" Test.* Did they add significant new work? (Addresses Layer 2).
      *   *Step 3: The "Toolbox" Test.* Did they use shared community IP/resources to make the leap? (Addresses Layer 3).
      *   *Decision Matrix:* How to weigh the Yes/Nos.

  4.  **Developing the Scenarios:**
      *   *Scenario 1 (Knitting):* Open pattern, swapped yarn weight.
          *   *Analysis:* Low labor, high spark reliance. Likely "Shared."
      *   *Scenario 2 (Bike Frame):* Mashup of two old ideas, genuinely new function.
          *   *Analysis:* High labor, distinct spark. Likely "Adapter owns modification, Originals get credit."
      *   *Scenario 3 (The Fury):* Procedure says "Release it," Creator is mad.
          *   *Analysis:* Highlights the emotional cost vs. community benefit. The checklist works "logically" but fails "emotionally."

  5.  **Addressing Limitations & Risks:**
      *   What can't the checklist catch? Intent, hidden labor, power dynamics.
      *   Where does judgment sneak in? Defining "significant" change.
      *   Risk to Original Creator: They feel robbed of recognition even if they keep "ownership."

  6.  **Refining for American English:**
      *   Check for "s," "z," "or," "re" spellings. (e.g., labor, color, center, recognize).
      *   Ensure tone is US-centric (makerspace culture).

  7.  **Review against Constraints:**
