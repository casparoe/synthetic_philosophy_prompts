answer: |-
  To reconstruct Hume's verdict on modern monetary institutions, one must first isolate the load-bearing commitments of his 1752 *Political Discourses* from the institutional facts of his era. Hume's apparatus rests on four pillars: the specie-flow mechanism, the short-run non-neutrality of money, the real determination of interest, and the danger of public credit.

  First, in *Of the Balance of Trade*, Hume argues that trade imbalances are self-correcting. A deficit causes an outflow of specie, lowering domestic prices and restoring competitiveness. The institutional fact here is commodity money. The mechanism relies on the money supply contracting physically when gold leaves. In a fiat regime, this link is severed; the money supply is endogenous to policy, not exogenous to trade balances. Second, in *Of Money*, Hume claims the absolute quantity of money is neutral in the long run (affecting only prices) but a gradual increase stimulates industry in the short run before prices rise. This relies on price stickiness and sluggish expectations. Third, in *Of Interest*, he argues interest rates depend on the supply of loanable funds and commercial profitability, not the money stock. This assumes a direct link between savings and investment, bypassing modern banking intermediation. Finally, his suspicion of public credit stems from John Law's collapse; he views paper money and funded debt as invitations to fiscal abuse and inflation, lacking the discipline of metal.

  Applying this apparatus to **Case 1 (QE and Independent Central Banks)** yields a hostile verdict. Hume's hostility to paper credit is not merely about inflation but about the moral hazard of financing state debt without taxation. Quantitative easing involves the monetary authority purchasing government debt. While an independent bank mitigates the risk of direct fiscal dominance, Hume's framework lacks a concept of central bank independence; he sees paper credit as inherently prone to overissue. He would likely view QE as a revival of Law's system: expanding the money stock to accommodate debt rather than commerce. However, Hume's text underdetermines the response to an independent institution. One must attribute to him a concern for *institutional design* he never formulated; if the bank is truly immune to fiscal pressure, his fear of debt monetisation might be assuaged, but his preference for metal anchoring would remain.

  Regarding **Case 4 (Full-Reserve Hard-Capped Fiat)**, Hume's position is ambiguous. He insists the quantity of money is of no consequence in the long run, suggesting a fixed supply is harmless. However, he explicitly praises a gradual increase in money for animating industry. A hard cap prevents this stimulus. Furthermore, Hume believes money is necessary only to facilitate exchange; if commerce grows while money is fixed, prices must fall. Hume acknowledges deflation can dampen industry, though he focuses more on the dangers of inflation. His framework contains no reason to prefer this to metal, except the convenience of paper. Yet, without the constraint of metal, what prevents the rule from being broken? Hume would likely prefer metal because its scarcity is natural, whereas a fiat cap is political and thus vulnerable to the same fiscal abuse he feared in public credit.

  In **Case 2 (Persistent Current-Account Deficits)**, Hume's specie-flow mechanism fails. Under floating fiat, a deficit depresses the exchange rate rather than draining specie. Prices may not fall domestically; instead, the currency depreciates. Hume's argument that no state can permanently hoard or lose money relies on the price-specie link. Without it, a deficit could persist indefinitely if capital flows finance it. Hume treats capital mobility as secondary to trade in goods. To apply his logic here, one must assume he would view persistent deficits as unsustainable because they eventually erode confidence in the currency itself—a form of 'moral specie' drain. However, this requires attributing to him a concept of *monetary sovereignty* and investor confidence in fiat assets that did not exist in the 1750s. He might conclude that without the automatic correction of metal, the state risks the same instability as a debtor nation, but the mechanism is psychological rather than mechanical.

  For **Case 3 (Cryptocurrency)**, Hume faces a theoretical dilemma. He defines money as conventional, resting on agreement rather than intrinsic use-value, which ought to make him friendly to Bitcoin. However, he also argues that money requires stability to serve industry. A volatile asset fails as a measure of value. Hume's suspicion of unanchored paper suggests he would view crypto as prone to the same speculative bubbles as South Sea stock or Law's shares. He would likely argue that without a state to enforce its acceptance and limit its supply (beyond the protocol), it lacks the 'public faith' required for general commerce. His framework suggests money is a creature of civil society, not private protocol.

  This leads to the first tension: **Neutrality versus Stimulus**. Hume claims money is neutral long-run but stimulative short-run. This is not a logical inconsistency but relies on a lag between money injection and price adjustment. In modern terms, this is price stickiness. However, Hume assumes agents do not anticipate policy. If expectations are rational, prices might rise immediately, negating the stimulus. Hume's apparatus survives only if one assumes imperfect information. If prices are flexible and expectations formed about policy, his claim that gradual increase benefits industry collapses, leaving only the neutrality claim.

  The second tension concerns **Convention versus Stability**. Hume treats money as conventional, yet fears unanchored fiat. The weight of his commitments falls on stability. Convention is sufficient to create money, but not sufficient to *sustain* it against the temptation of abuse. Metal provides an external anchor that convention alone cannot. Thus, while crypto fits his definition of money, it fails his test for durability. He would likely argue that a convention without a sovereign enforcer or physical anchor is too fragile for large-scale commerce.

  Finally, several modern concerns are underdetermined in Hume's text. He speaks of 'industry' but lacks a target for *employment*; he might not distinguish between price inflation and asset-price inflation, missing the distributional effects of QE. He discusses trade balances but not *demand management* via deficits. To apply Hume here requires inventing a Humean concern for macroeconomic stability that he never explicitly formulated. His framework is robust on the long-run neutrality of money and the dangers of debt, but it breaks where institutions decouple money from metal without replicating metal's disciplinary constraints. The student arguing against this reconstruction might note that Hume's 'industry' is effectively aggregate demand, and his fear of debt is a fear of financial instability, allowing his logic to stretch further than the 1750s context suggests. However, strictly speaking, his mechanism requires the drag of metal to function as described.
