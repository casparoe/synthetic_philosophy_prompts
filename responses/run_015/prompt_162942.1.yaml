prompt: |-
  I work at a small philanthropic brokerage that arranges moral trades: we introduce two funders who disagree about what is worth funding, and each directs money to what the other believes matters, on the understanding that both can end up better off by their own lights even though neither has persuaded the other of anything. We vet around twenty proposed trades a year with three staff and roughly half a day per proposal, and anything above a modest size has to be signed off by our board. What we do not have is a written procedure. We argue case by case, and the arguments keep collapsing into two slogans: that both sides gain by their own lights, so there is nothing left to object to, and that we are helping people do indirectly what they would not do themselves, which my colleagues treat as conclusive and I do not. I would like something better than either slogan, and better than a list of considerations with no order to them.

  Please write the decision procedure we could actually run. It should be a short ordered sequence of questions, with, for each one, what counts as a sufficient answer, what evidence we should demand and from whom, where the procedure stops with a no, and where it hands the decision to a named person because the remaining question is one of values rather than facts. It has to be usable by someone with no philosophy training, in a few hours, with counterparties who often cannot articulate a general value theory and can only tell us what they would fund. The conceptual work is in what the procedure preserves and what it drops, so it should handle at least these: the difference between a trade and mere cooperation on a project both parties already value, and between a trade and offsetting, where one party does something the other takes to be harmful and then compensates for it; cases where the disagreement is about a matter of fact rather than a matter of value, where what looks like a trade may really be a bet about which intervention is more effective; whether helping the counterparty do what we ourselves take to be wrong can ever be licensed by the fact that they gain by their own lights; whether we should discount the counterparty's gain by our own credence that their view is correct, and what, if anything, agreeing to broker says about that credence; parties whose values contain thresholds, satiation points, or protected and incommensurable goods, so that more money in their favoured cause eventually buys them nothing; trades where one party is a trustee acting for beneficiaries who cannot now consent, and trades whose performance is deferred for decades, where the party that must later perform is not the party that agreed; enforcement, meaning sequencing, escrow, reputation, defection after receipt, and what we owe each side when the other defaults; and our own conflict of interest, since our fee scales with the size of the trade we approve.

  Then run it on three proposals. First, a global-health funder who pays for insecticide-treated nets and deworming, matched with a funder who pays for arts education in her own city and makes no apology for favouring it; each commits two hundred and fifty thousand dollars to the other's chosen charity. I expect this one to pass, and I want to see where the procedure still demands judgement, including why equal dollar amounts are the default ratio and when the ratio should differ. Second, an animal-welfare foundation gives a million dollars now to a fund oriented towards the long-term future, and the fund's trustees undertake to disburse an inflation-adjusted equivalent to animal-welfare work in thirty years, across at least two changes of trustee and a governing document that can be amended: I want the procedure's answer on whether current trustees can bind their successors, whether beneficiaries who do not yet exist can be represented in a trade, and what security we should require. Third, a trade that both parties gain from by their own lights and that would be the largest we have ever brokered, in which one side's favoured intervention rests on an empirical claim our staff believe to be false and the other side accepts the trade largely because it defers to that judgement: my co-founder says it is not our business to police anyone's factual beliefs, I think we are being asked to sell our credibility, and I want the procedure to tell us which of us is right, or to tell us what extra question would have to be added to settle it and what adopting that question would cost us. If the procedure also needs a different treatment for trades involving an individual donor rather than an institution, say so. Two or three pages, no citations or bibliography, with a short preamble a new analyst could read to understand what a moral trade is and why the both-gain test is not enough on its own, and an honest closing section on what the procedure cannot do and where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** Small philanthropic brokerage (3 staff, ~20 proposals/year, 0.5 day/proposal).
      *   **Problem:** No written procedure. Arguments collapse into two unhelpful slogans ("both gain by their own lights" vs. "helping people do indirectly what they wouldn't do themselves").
      *   **Goal:** A short, ordered sequence of questions (decision procedure) usable by non-philosophers in a few hours.
      *   **Requirements:**
          *   Must handle specific edge cases (trade vs. cooperation, trade vs. offsetting, fact vs. value disagreement, complicity in wrong, credence discounting, thresholds/satiation, trustees/beneficiaries, deferred performance/enforcement, conflict of interest).
          *   Must include: Sufficient answers, evidence required, stop points (No), hand-off points (Values/Board).
          *   Must include: Preamble (what is a moral trade, why "both gain" isn't enough) and Closing (limitations).
          *   Must apply the procedure to three specific test cases (Global Health/Arts, Animal Welfare/Long-term, Empirical Disagreement/Large Trade).
          *   Length: 2-3 pages. No citations.
      *   **Tone:** Professional, practical, philosophical but accessible, honest about limitations.

  2.  **Deconstruct the "Moral Trade" Concept:**

      *   *Core Mechanism:* Funder A funds Cause B; Funder B funds Cause A.
      *   *Why do it?* Comparative advantage, diminishing marginal utility, disagreement on value vs. agreement on efficacy.
      *   *Why isn't "both gain" enough?* Because gains might be illusory (factual error), harmful (offsetting harm), impossible (binding successors), or unethical (complicity).
      *   *Why isn't "indirect action" enough?* Because it ignores agency, responsibility, and structural integrity.

  3.  **Drafting the Decision Procedure (The Core):**

      *   Need a linear flow.
      *   *Step 1: Definition.* Is this actually a trade? (Filters out cooperation and offsetting).
      *   *Step 2: Fact vs. Value.* Is the disagreement empirical? (Filters out bets masquerading as trades).
      *   *Step 3: Integrity/Complicity.* Does funding the other side violate core constraints? (Thresholds, protected goods).
      *   *Step 4: Authority/Agency.* Can they actually commit? (Trustees, successors, individuals).
      *   *Step 5: Enforcement.* How do we ensure performance? (Escrow, sequencing).
      *   *Step 6: Broker COI.* Managing the fee structure.
      *   *Hand-offs:* Where do we kick it to the Board? (Value judgments, high risk).

      *Refining the Steps for the Prompt's Constraints:*
      *   Need to explicitly address the "credence" issue (do we discount their gain?).
      *   Need to address the "ratio" issue (why equal dollars?).
      *   Need to address the "empirical claim" issue (Case 3).

      *Drafting the Questions:*
      1.  **Trade Integrity:** Is this distinct from cooperation or offsetting?
      2.  **Factual Basis:** Is the disagreement about facts or values?
      3.  **Complicity & Constraints:** Does funding the other side violate protected values or thresholds?
      4.  **Authority & Time:** Can the parties bind themselves (and successors)?
      5.  **Enforcement:** Is the mechanism secure?
      6.  **Broker Integrity:** Does this compromise us?

  4.  **Drafting the Preamble:**

      *   Define Moral Trade: Swapping funding to exploit disagreement without requiring persuasion.
      *   Why "Both Gain" fails: Ignores externalities, factual errors, and moral complicity.
      *   Why "Indirect Action" fails: Ignores agency and responsibility.
      *   Goal: Ensure the trade is *robust*, not just mutually preferred.

  5.  **Drafting the Test Cases (Application):**

      *   *Case 1 (Health/Arts):* Standard trade. Passes most checks. Issue: Ratio (why equal?). Issue: Judgment on "value" of arts vs. health (Board hand-off?).
      *   *Case 2 (Animal/Long-term):* Deferred performance. Issue: Binding successors (Legal/Authority). Issue: Non-existent beneficiaries. Security needed.
      *   *Case 3 (Empirical Disagreement):* The hard one. Staff think claim is false. Co-founder says "not our business." Procedure needs to resolve this. If we broker a bet on false facts, we lose credibility.

  6.  **Drafting the Closing:**

      *   Limitations: Cannot solve deep moral philosophy. Relies on honest self-reporting. May reject good trades due to risk aversion.
      *   Misfire points: Complex trust structures, hidden agendas.

  7.  **Review and Refine (Self-Correction against Constraints):**

      *   *Constraint Check:* "Short ordered sequence of questions." -> Keep the procedure tight.
      *   *Constraint Check:* "What counts as sufficient answer, evidence, stop points." -> Be specific in the procedure text.
      *   *Constraint Check:* "2-3 pages." -> This is tight. I need to be concise. The preamble, procedure, cases, and closing must be compressed.
      *   *Constraint Check:* "No citations." -> Okay.
      *   *Constraint Check:* "Handle specific issues (offsetting, thresholds, trustees, COI)." -> Ensure these are embedded in the steps.
      *   *Constraint Check:* "Case 3 resolution." -> The procedure must explicitly tell us who is right (Staff or Co-founder).

      *Refining the Procedure for Case 3:*
      *   Step 2 needs to be strong. If the trade relies on a factual claim the broker *knows* is false (or has high credence is false), brokering it endorses that fact.
      *   Decision: If the broker's credence that the claim is false exceeds a threshold (e.g., >90%), the trade is rejected as "Misleading." This sides with the user (Staff) against the Co-founder.

      *Refining the Ratio Question (Case 1):*
      *   Default is equal dollars because it simplifies the "gain" calculation and avoids valuation disputes.
      *   Deviation requires proof of diminishing marginal utility.

      *Refining the Trustee Question (Case 2):*
      *   Current trustees cannot legally bind successors in perpetuity without specific legal structures (endowments/restrictions).
      *   Procedure must flag this as a "Legal/Authority Stop" unless specific security is posted.

  8.  **Final Polish (Tone and Length):**

      *   Ensure the voice is authoritative but practical.
      *   Check word count visually (aiming for dense but readable).
      *   Make sure the "Hand-off to Board" is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't write *too* much on the cases, or the procedure itself will get squeezed out. The prompt asks to "run it on three proposals," so the analysis needs to be integrated or appended clearly. I will append the case analyses after the procedure to keep the procedure clean.

      *Wait, one more check:* "Two or three pages." In standard formatting, that's roughly 1000-1500 words. I need to be very economical. I will combine the Preamble and Procedure into the first section, then the Cases, then the Closing.

      *Actually, looking at the density required:* To cover all the specific constraints (evidence, stop points, hand-offs) within the procedure *and* analyze three complex cases *and* write a preamble/closing in 2-3 pages is extremely tight. I will prioritize the Procedure's clarity and make the Case Analysis concise but specific.

      *Revised Plan:*
      1.  **Preamble:** Define trade vs. slogans.
      2.  **The Procedure:** 6 Steps with specific criteria.
      3.  **Case Applications:** Briefly run the 3 cases through the steps.
      4.  **Closing:** Limitations.

      *Let's write.*

      *(Drafting thought)*: For Case 3, the prompt asks "tell us which of us is right." I need to be decisive. The procedure should prioritize the brokerage's epistemic integrity. If we broker based on known falsehoods, we are selling credibility. So the procedure must stop the trade if the factual basis is untenable by *our* standards, not just theirs.

      *(Drafting thought)*: For the COI (fee scales with size), the procedure needs a step where the Board reviews the fee relative to the risk, or a cap is applied.

      *(Drafting thought)*: For the "Individual vs Institution" note: Individuals have higher defection risk and no governance. Add a note in Step 4.

      *Okay, ready to generate.*
answer: |-
  **PREAMBLE: WHAT THIS PROCEDURE IS FOR**

  A moral trade is not cooperation. In cooperation, two parties fund a project they both value. In a trade, Party A funds Project B and Party B funds Project A, despite preferring their own. The justification is that both parties gain *by their own lights*, usually due to diminishing marginal utility or comparative advantage.

  The slogan "both gain" is insufficient because gains can be illusory (based on false facts), harmful (offsetting damage), or impossible (binding successors). The slogan "indirect action" is insufficient because it ignores complicity; facilitating a trade is not morally neutral if one side funds what the broker considers egregious. This procedure does not solve moral philosophy. It filters for robustness, authority, and integrity. It is designed for analysts without philosophy training. It prioritizes the brokerage's long-term credibility over short-term volume.

  **THE DECISION PROCEDURE**

  **Step 1: Trade Integrity (Cooperation and Offsetting)**
  *   **Question:** Is this a genuine exchange of divergent preferences, or is it (a) cooperation on a shared goal, or (b) offsetting for harm?
  *   **Sufficient Answer:** Both parties must explicitly state they prefer their own cause over the other's *if funding were unrestricted*, but prefer the trade over no trade. Neither party may view the other's activity as net harmful (offsetting).
  *   **Evidence:** Written statements from authorized signatories confirming preference orderings.
  *   **Stop (No):** If either party views the other's cause as net negative (e.g., "I fund arts to cancel out the harm of your factory farming").
  *   **Hand-off:** If one party is indifferent between causes, refer to **Board** (This is donation, not trade).

  **Step 2: Factual Basis (Value vs. Empirical Disagreement)**
  *   **Question:** Is the disagreement about *values* (what is good) or *facts* (what works)?
  *   **Sufficient Answer:** Disagreement must be primarily axiological. If the trade relies on an empirical claim (e.g., "Intervention X saves more lives"), the broker must assess the claim's validity.
  *   **Evidence:** Staff review of available efficacy data. Counterparty justification for empirical claims.
  *   **Stop (No):** If the broker's credence that a core empirical claim is *false* exceeds 90%. We do not broker bets on settled falsehoods; doing so sells our credibility.
  *   **Hand-off:** If credence of falsehood is between 50-90%, refer to **Board**. (This acknowledges uncertainty without endorsing error).

  **Step 3: Complicity and Constraints (Thresholds and Protected Goods)**
  *   **Question:** Does funding the counterparty's cause violate the broker's or the funder's protected constraints (deontology, thresholds, satiation)?
  *   **Sufficient Answer:** Confirmation that the funded amount does not cross a "satiation point" where additional funding yields zero value to the recipient, nor violates a "protected good" (e.g., a rights-based constraint).
  *   **Evidence:** Counterparty declaration of diminishing returns or hard constraints.
  *   **Stop (No):** If the trade requires the broker to facilitate activity the brokerage deems intrinsically wrong (e.g., human rights violations), regardless of counterparty gain.
  *   **Ratio Rule:** Default to 1:1 dollar ratios. Deviations require evidence of asymmetric diminishing marginal utility (e.g., $250k to Arts is worth more to the Arts funder than $250k to Health is to the Health funder).

  **Step 4: Authority and Time (Trustees and Successors)**
  *   **Question:** Do the signatories have the legal and moral authority to bind the assets, including future successors?
  *   **Sufficient Answer:** Legal opinion or governing document clause confirming authority to commit future funds.
  *   **Evidence:** Trust deed, corporate bylaws, or legal counsel memo.
  *   **Stop (No):** If current trustees cannot legally bind successors (e.g., standard spend-down foundations). Non-existent beneficiaries cannot be represented in a trade unless a legal guardian/trustee is appointed with specific fiduciary duty to that trade.
  *   **Individual Donors:** Require 50% escrow upfront. Institutional donors require board resolution.
  *   **Hand-off:** If binding successors requires amending governing documents, refer to **Board** (Risk of future litigation).

  **Step 5: Enforcement (Sequencing and Defection)**
  *   **Question:** What mechanism prevents defection after receipt?
  *   **Sufficient Answer:** Simultaneous transfer via escrow, or sequential transfer with performance bond.
  *   **Evidence:** Escrow agreement draft. Reputation insurance plan (public default notice).
  *   **Stop (No):** If no enforceable mechanism exists for deferred performance (>5 years).
  *   **Hand-off:** If enforcement relies solely on reputation for trades >$1M, refer to **Board**.

  **Step 6: Broker Conflict of Interest**
  *   **Question:** Does the fee structure incentivize approving risky trades?
  *   **Sufficient Answer:** Fee is capped or flat-rate for trades requiring Board hand-offs.
  *   **Evidence:** Fee schedule comparison.
  *   **Stop (No):** If the analyst's bonus is directly tied to the volume of trades approved in the current quarter.
  *   **Hand-off:** All trades where the fee exceeds 5% of the total volume must be ratified by the **Board** to ensure the fee did not drive the approval.

  ***

  **APPLICATION TO PROPOSALS**

  **Case 1: Global Health vs. Arts Education ($250k each)**
  *   **Step 1 (Integrity):** Pass. Both prefer their own cause but value the trade. No offsetting claimed.
  *   **Step 2 (Facts):** Pass. Disagreement is axiological (health vs. culture), not empirical.
  *   **Step 3 (Constraints):** Pass. No satiation points reached. **Ratio:** 1:1 is accepted. *Judgement Note:* Equal dollars are the default because they avoid the impossible task of comparing "units of value" across causes. Deviations are only permitted if a funder proves their cause is "full" (satiation).
  *   **Step 4 (Authority):** Pass. Both are current spenders.
  *   **Step 5 (Enforcement):** Pass. Simultaneous transfer.
  *   **Step 6 (COI):** Pass. Modest size.
  *   **Verdict:** **Approve.** The procedure demands judgement only on Step 3 (ensuring the Arts funder doesn't view health funding as wasteful to the point of negating gain, but their explicit consent covers this).

  **Case 2: Animal Welfare vs. Long-Term Future ($1M now, $1M in 30 years)**
  *   **Step 1 (Integrity):** Pass.
  *   **Step 2 (Facts):** Pass. Value disagreement (present vs. future beings).
  *   **Step 3 (Constraints):** Pass.
  *   **Step 4 (Authority):** **FAIL.** Current trustees cannot legally bind successors in perpetuity without a specific endowment restriction. Non-existent beneficiaries have no representation.
  *   **Remedy:** To pass, the Long-Term fund must place the $1M in a legally restricted endowment *now* with a purpose clause that survives trustee changes.
  *   **Step 5 (Enforcement):** **FAIL.** 30-year deferment exceeds standard reputation enforcement.
  *   **Remedy:** Require a performance bond or third-party custodian.
  *   **Step 6 (COI):** **HAND-OFF.** Size exceeds modest threshold; fee significance requires **Board** ratification.
  *   **Verdict:** **Reject in current form.** Requires legal restructuring to bind successors and escrow for security. The procedure clarifies that "undertakings" are not binding without legal teeth.

  **Case 3: Empirical Disagreement (Largest Trade Ever)**
  *   **Scenario:** Side A's intervention relies on an empirical claim Staff believe is false. Side B trades based on deference to Side A.
  *   **Step 2 (Facts):** **CRITICAL FAIL.** The prompt states Staff believe the claim is *false*. The Co-founder argues we should not police beliefs.
  *   **Procedure Ruling:** Step 2 explicitly states: "If the broker's credence that a core empirical claim is false exceeds 90%... Stop (No)."
  *   **Resolution:** The **Staff Member is right.** Brokering a trade based on a known falsehood converts the brokerage from a neutral facilitator to an amplifier of error. We are selling our credibility as vetters. If we approve this, we endorse the false claim implicitly.
  *   **Cost:** Adopting this question costs us volume. We will lose trades where parties are willing to bet on falsehoods. It preserves our epistemic integrity.
  *   **Verdict:** **Reject.** Unless Side A can provide evidence that shifts Staff credence below the 90% falsehood threshold, the trade is blocked. This is not policing values; it is preventing fraud/negligence.

  ***

  **CLOSING: LIMITATIONS AND MISFIRES**

  This procedure cannot resolve deep moral incommensurability. If a funder views the counterparty's cause as "evil" but trades anyway for strategic reasons, Step 1 may miss the moral residue the broker inherits. We assume honest self-reporting on preference orderings; sophisticated actors may lie to access capital.

  The procedure will misfire on complex trust structures where legal authority is ambiguous (Case 2). It relies on the Board having the courage to reject profitable trades in Step 6 (COI) and Step 2 (Facts). Finally, it treats the brokerage as a moral agent. If the organization believes it should be purely neutral, Step 2 and Step 3 must be removed, but doing so admits we are a transaction processor, not a philanthropic partner. This procedure assumes the latter. Use it to protect the mission, not just the money.
