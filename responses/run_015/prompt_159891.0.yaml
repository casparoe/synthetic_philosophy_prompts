answer: |-
  TEACHING PLAN: VAN FRAASSEN'S REFLECTION PRINCIPLE

  I. SESSION ARCHITECTURE (90 MINUTES)

  Do not begin with the formula. Begin with the tension between the two audiences. The philosophy students want a norm; the machine learning students want an update rule. Your goal is to show that Reflection is a norm that resists becoming a rule.

  Order of Components:
  1.  Synchronic Baseline (15 mins)
  2.  The Diachronic Gap (15 mins)
  3.  The Certainty Constraint (10 mins) — CRITICAL PIVOT
  4.  The Principle & The Case (25 mins)
  5.  The Diachronic Dutch Book (15 mins)
  6.  Misconception Block & Close (10 mins)

  Dependency Logic:
  You must establish that Synchronic Coherence (Probabilism) is uncontroversial before introducing Diachronic Coherence. Conditionalization should be presented as an *independent* norm set beside Reflection, not as something Reflection delivers. If you derive Reflection from Conditionalization, the ML students will treat it as an algorithm, and the Philosophy students will think it adds no new normative force. Present them as overlapping but distinct: Conditionalization governs response to evidence; Reflection governs response to expected opinion shifts.

  The Certainty Assumption:
  This is where your past lectures failed. Do not introduce this sideways. It must appear on the board *simultaneously* with the main formula.
  Write the principle as a conjunction:
  (1) P_now(A | P_later(A) = x) = x
  (2) P_now(P_later(A) = x) = 1
  If you omit (2), the ML students will try to integrate over a distribution of future models, and the principle will break. State explicitly: "Reflection applies only when you are certain now about what your credence will be later." This blocks the "uncertain future" objection before it arises.

  Board Management:
  Left Board: Definitions, The Case, The Formula (with Certainty Constraint).
  Right Board: The Dutch Book Argument, Misconception Map, Closing Question.
  Do not erase the Left Board until the final ten minutes. The students need to see the Certainty Constraint while you discuss the Dutch Book.

  II. THE CARRYING CASE

  Do not use the Ulysses case. It imports the confusion you are trying to head off. Ulysses is a case of *binding*: the agent believes their future self will be wrong (bewitched by Sirens) and takes steps to prevent that future self from acting. Reflection is a principle of *deference*: it requires you to treat your future self as an authority. Using Ulysses suggests Reflection is about preventing error, when it is actually about respecting coherence.

  Replacement Case: "The Known Memory Decay."
  This case must carry the session because it isolates the principle from evidence gathering without invoking madness.

  What the case must have:
  1.  A proposition A that is stable (e.g., "The proof of Theorem T is valid").
  2.  A known mechanism for opinion shift that is not new evidence about A (e.g., "I know I will forget the steps of the proof by tomorrow").
  3.  No accusation of irrationality (forgetting is not madness; it is a known cognitive limitation).

  What the case must lack:
  1.  New data about the world (no blood tests, no horse races).
  2.  External manipulation (no wine, no sirens).
  3.  Self-deception (the agent is honest about the forgetting).

  How to run it:
  Tell the students: "I have verified a proof. I am 99% confident it is valid. I know that tomorrow I will not remember the verification steps, only the conclusion. My credence will drop to 80%. I know this now."
  Ask the ML students: "Do you update your model now to 80%?"
  Ask the Philosophy students: "If you stay at 99%, are you incoherent?"
  This forces the room to confront the gap between Conditionalization (which requires evidence) and Reflection (which requires alignment with future opinion).

  III. MISCONCEPTION MAP

  Here is the corrected order of suspects, the point at which to block them, and the specific move to use.

  1.  Misconception: "Reflection applies even when I am uncertain about my future credence."
      *   Block Point: The Certainty Constraint (Minute 40).
      *   The Move: Point to condition (2) on the Left Board. Say: "If you are not certain what your future credence will be, this principle does not apply. Do not try to average over x."

  2.  Misconception: "Reflection is just Conditionalization restated."
      *   Block Point: The Carrying Case (Minute 50).
      *   The Move: Ask: "What evidence did I receive between now and later in the Memory Decay case?" (Answer: None/I lost evidence). "Conditionalization handles evidence gain. Reflection handles opinion shift. They are not identical."

  3.  Misconception: "It says to defer to your future self because she will know more."
      *   Block Point: The Carrying Case (Minute 50).
      *   The Move: Remind them: "In the Memory Decay case, the future self knows *less*. Reflection still demands alignment. It is not about expertise; it is about coherence."

  4.  Misconception: "It says your future credences will be more accurate."
      *   Block Point: The Carrying Case (Minute 50).
      *   The Move: "Accuracy is external. Reflection is internal. You can reflectively align with a future self you know is less accurate due to fatigue."

  5.  Misconception: "It is a principle of self-trust or intellectual humility."
      *   Block Point: Misconception Map (Minute 75).
      *   The Move: "Humility is a virtue; Reflection is a coherence constraint. You can satisfy Reflection while being arrogant, provided your arrogance is stable."

  6.  Misconception: "It forbids you from ever expecting to be misled."
      *   Block Point: Misconception Map (Minute 75).
      *   The Move: "You can expect to be misled by evidence. Reflection only forbids expecting to be misled by your own rational processing of your current state."

  7.  Misconception: "The Diachronic Dutch Book settles Reflection the way the Synchronic Dutch Book settles Probabilism."
      *   Block Point: The Dutch Book Argument (Minute 65).
      *   The Move: This is the most important block. Say: "In the synchronic case, the bookie exploits your beliefs at one time. In the diachronic case, the bookie must know your updating strategy *in advance* and you must be unable to update on the fact that a bet is being offered. This requires assumptions about memory and agency that Probabilism does not. Feel the difference."

  IV. CLOSING QUESTION

  In the last ten minutes, put this question on the Right Board to distinguish principle from slogan:

  "I know that tomorrow, after a specific brain lesion, my credence in 'I have two hands' will be 0.1. I am certain this will happen. Does Reflection require my credence today, conditional on this, to be 0.1?"

  Why this works:
  The student with the slogan ("Trust your later self") will hesitate or say yes.
  The student with the principle will say no, because they will recognize that the Certainty Constraint is met, but the *normative* assumption of rationality is violated. This opens the door to the "Ratification" caveat without requiring you to teach it. It shows that Reflection presumes the future self is a rational agent, not just a causal outcome.

  V. EXCLUSION RECOMMENDATION

  You asked about the self-locating belief problem (e.g., Sleeping Beauty).

  Refuse to cover it. Say this out loud:
  "This principle breaks down when propositions are self-locating (about 'today' or 'me'). We are not addressing that today."

  Do not give a five-second aside. A five-second aside invites the ML students to treat it as a bug fix and the Philosophy students to treat it as a research topic. By explicitly stating you are excluding it, you validate the complexity without derailing the session. It is intellectually honest to define the scope of a seminar. Write "Scope: Non-Self-Locating Propositions" on the top of the Left Board at the start of class. This prevents the question from arising in the Q&A.
