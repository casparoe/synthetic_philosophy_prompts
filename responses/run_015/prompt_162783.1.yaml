      *   **Purpose:** Two specific jobs: (1) Tell the visitor/dissenter what they *owe*. (2) Tell the community/platform when they may *enforce/reproach*.
      *   **Input:** A provided list of candidate cases (no-difference, announced non-participant, visitor vs. dissenter, conflicting jurisdictions, unjust conventions, near-threshold, exit costs, enforcement asymmetry, day-one).
      *   **Input:** A list of distinctions to respect (arbitrary vs. beneficial, follow vs. defer vs. enforce, strangers vs. reliers, first- vs. third-personal).
      *   **Task 1:** Critique/Refine the desiderata list (add, drop, reframe).
      *   **Task 2:** Identify non-negotiables vs. camp preferences. Identify jointly unsatisfiable sets (trade-offs). Identify the "killer constraint" that excludes popular accounts.
      *   **Task 3:** Scorecard for 5-6 theoretical contenders against the refined criteria.
      *   **Tone:** Philosophical, rigorous, direct, avoiding fluff ("not the theories" initially, but theories come in at the end). The user wants specs, not just stories.

  2.  **Deconstruct the Purpose:**
      *   Job 1 (Agent-facing): Normative guidance for the outsider/dissenter.
      *   Job 2 (Community-facing): Legitimacy of enforcement/reproach.
      *   *Constraint:* A theory that solves Job 1 but fails Job 2 is incomplete. This is crucial. Many theories explain why *I* should do it, but not why *you* can yell at me.

  3.  **Evaluate the Candidate Desiderata:**
      *   *No-Difference Case:* Crucial. Distinguishes moral obligation from consequentialism. If my act changes nothing, why is it wrong? (e.g., voting, tipping in a rich city).
      *   *Announced Non-Participant:* Crucial. Tests the "consent" mechanism. Does opting out work?
      *   *Visitor vs. Dissenter:* Important distinction. Ignorance vs. Refusal. Merging them weakens the theory.
      *   *Conflicting Jurisdictions:* Tests localism vs. universalism. Does "when in Rome" hold if Rome conflicts with Home Law?
      *   *Unjust Conventions:* Tests the limit of convention. Can a convention obligate compliance with injustice? (e.g., segregation, exploitative tipping).
      *   *Near-Threshold:* Tests the "coordination" aspect. Is it binary or scalar?
      *   *Exit Costs:* Tests voluntariness. Is participation coerced by economic necessity?
      *   *Enforcement Asymmetry:* Crucial for Job 2. Wrong to cut $\neq$ Right to shame.
      *   *Day-One:* Tests the "history" requirement. When does a habit become a norm?

      *Critique/Refinement:*
      *   *Visitor vs. Dissenter:* I agree this should be separate. Ignorance excuses; dissent challenges validity.
      *   *Enforcement Asymmetry:* This is the Job 2 constraint. It needs to be highlighted as a structural requirement, not just a case.
      *   *Unjust Conventions:* Needs nuance. It's not just "does obligation survive?" but "does the *conventional* force add to the moral force, or subtract?"
      *   *Add:* **The Non-Excludability Problem.** If I benefit from the queue without joining, am I free-riding? This ties into Fair Play.
      *   *Drop/Reframe:* "Day-One" might be too specific. It's really about *Common Knowledge*. When do we *know* we know the rule?

  4.  **Evaluate the Distinctions:**
      *   *Arbitrary-but-binding:* Load-bearing. If the rule is only binding because it's good, it's not a *conventional* obligation, it's just a moral one wearing a costume.
      *   *Follow vs. Defer vs. Enforce:* Load-bearing. This maps to Job 1 vs. Job 2.
      *   *Strangers vs. Reliers:* Load-bearing. Reliance creates specific duties; conventions create general ones.
      *   *First- vs. Third-Personal:* I agree with the user's suspicion. This is often a meta-ethical preference. However, for *action-guidance* (Job 1), first-personal accessibility matters. I'll mark it as "Operational" rather than "Foundational."

  5.  **Identify Trade-offs (The "Impossible Trio"):**
      *   User suspects: {No-Difference, Announced Non-Participant, Unjust Practice}.
      *   My analysis: The real tension is between **Voluntarism** (Consent/Fair Play) and **Normative Realism** (Joint Commitment/Practice).
      *   *The Killer Constraint:* **The No-Difference Case + Job 2 (Enforcement).**
      *   Why? Consequentialism fails No-Difference. Consent fails Announced Non-Participant. Fair Play struggles with Exit Costs.
      *   *The Unsatisfiable Trio:* I think it's {Strong Voluntarism (Consent), Robust Enforcement (Job 2), No-Difference Bindingness}. You can't have it be purely voluntary *and* enforceable by strangers *and* binding when consequences are null.
      *   *What has to give:* Usually Voluntarism. If strangers can enforce it, you didn't necessarily consent.

  6.  **Develop the Scorecard:**
      *   *Contenders:*
          1.  Coordination/Equilibrium (Lewis/Sugden)
          2.  Reliance/Expected-Benefit (Consequentialist-ish)
          3.  Consent/Fair-Play (Rawlsian/Political)
          4.  Joint-Commitment (Gilbert)
          5.  Expressive/Attitude (Anderson)
          6.  Debunking/Prudential (Mackie-ish)
      *   *Criteria for Scoring:* Use the refined desiderata (No-Difference, Non-Participant, Enforcement, Unjust, Exit).

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the spec. Fix the purpose (Agent + Community).
      *   **Refining Desiderata:** Go through the user's list. Validate the strong ones. Tweak the weak ones. Add the "Common Knowledge" requirement (Day-One refinement).
      *   **Distinctions:** Categorize into Load-Bearing vs. Cosmetic/Operational.
      *   **The Trade-Offs:** Address the "Impossible Trio." Identify the "Killer Constraint." (My bet: Enforcement + No-Difference kills Consequentialism; Enforcement + Non-Participant kills Consent).
      *   **Scorecard:** Create the table. Be harsh.

      *(Self-Correction during drafting)*: Wait, the user asked to "fix the purpose first." I need to explicitly state the refined purpose before listing desiderata.
      *Refined Purpose:* A theory of Conventional Obligation must provide **Action-Guidance** (for the agent in the convention) and **Enforcement-Authority** (for the community policing the convention), without collapsing into pure consequentialism or pure voluntarism.

      *(Refining the "Unjust Practice" desideratum)*: The user asks if obligation survives. The better question is: Does the convention *add* weight to an independent moral duty, or *create* a duty where none existed? In unjust cases, the convention might create a duty to *resist*. The desideratum should be: **The Theory must distinguish between constitutive conventions (constitute the good) and regulatory conventions (manage the good).** Tipping is regulatory (wages); Queuing is constitutive (fairness).

      *(Refining the "No-Difference" case)*: This is the hardest one. If my tip doesn't change the waiter's life, why owe it? The answer usually lies in *participation* not *outcome*. The desideratum is: **Non-Instrumental Bindingness.**

      *(Refining the "Announced Non-Participant")*: This tests the "Opt-Out" condition. Desideratum: **Conditional Opt-Out.** When does saying "no" work? (Answer: When it doesn't undermine the practice's stability).

      *(Refining "Enforcement Asymmetry")*: This is Job 2. Desideratum: **Second-Personal Authority.** Who gets to blame?

      *(The "Impossible Trio")*: I agree with the user's intuition but will refine it. It's {No-Difference Bindingness, Voluntarist Opt-Out, Stranger Enforcement}.
      1. If it binds without difference, it's not about consequences.
      2. If I can opt-out by announcement, it's voluntary.
      3. If strangers can enforce it, it's not purely voluntary (they didn't contract with me).
      *Resolution:* Joint Commitment theories handle this best, but struggle with Unjust Practices.

      *(The Killer Constraint)*: **Enforcement Asymmetry (Job 2) + No-Difference.** Most theories explain why *I* should do it (Prudence/Fairness). Very few explain why *you* can stop me if my act changes nothing. This kills pure Consequentialism and pure Prudence.

  8.  **Final Review against constraints:**
