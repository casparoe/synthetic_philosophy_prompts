      *(One last thought on the "Unjust Practice")*: The user asks if a convention can obligate compliance *and* obligate working against it. This is the **Paradox of Reform**. A good theory must allow for "Compliance now, Change later" or "Non-compliance as signal." I will add this as a specific desideratum: **The Reform Condition.**

      *(One last thought on "Day-One")*: This is about **Common Knowledge**. A rule isn't a convention until we know we know it. I'll reframe "Day-One" to "Common Knowledge Threshold."

