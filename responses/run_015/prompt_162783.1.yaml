answer: |-
  ### 1. Fixed Purpose
  A theory of *Conventional Obligation* is adequate only if it simultaneously satisfies two functional roles:
  1.  **First-Personal Action-Guidance:** It must determine whether an agent (visitor, dissenter, or regular) is morally bound to comply, independent of legal sanction or immediate consequence.
  2.  **Second-Personal Enforcement Authority:** It must determine whether third parties (the crowd, the platform, the city) possess the moral standing to reproach, sanction, or reallocate resources when the rule is breached.

  *Constraint:* A theory that validates the obligation but invalidates the enforcement (or vice versa) fails the spec.

  ---

  ### 2. The Desiderata (Refined Spec)
  I have accepted, reframed, or rejected your candidate list based on the Fixed Purpose.

  | Case / Consideration | Status | Refinement / Rationale |
  | :--- | :--- | :--- |
  | **The No-Difference Case** | **Keep (Core)** | **Requirement: Non-Instrumental Bindingness.** The theory must explain why an act is obligatory even if its causal impact is null. If the theory relies solely on marginal consequences, it fails here. |
  | **Announced Non-Participant** | **Keep (Core)** | **Requirement: Conditional Opt-Out.** The theory must specify *when* an announcement dissolves obligation. (Hypothesis: Only when the opt-out doesn't destabilize the practice or free-ride on others' compliance). |
  | **Visitor vs. Dissenter** | **Keep (Load-Bearing)** | **Requirement: Epistemic vs. Volitional Excuse.** Ignorance (Visitor) and Refusal (Dissenter) must be treated differently. Ignorance excuses compliance but not necessarily restitution; Refusal challenges the norm's validity. Merging them collapses the theory into simple consent. |
  | **Conflicting Jurisdictions** | **Reframe** | **Requirement: Local Sovereignty vs. Universal Baseline.** The theory must adjudicate when local convention overrides universal moral baseline (e.g., jaywalking norms vs. safety). It cannot simply say "When in Rome." |
  | **Unjust Conventions** | **Keep (Core)** | **Requirement: The Reform Condition.** The theory must allow that one can be obligated to comply *provisionally* (to maintain order) while obligated to work against the convention *structurally*. It must distinguish *participation* from *endorsement*. |
  | **Near-Threshold** | **Drop** | **Reason:** This is a subset of the No-Difference case. If the theory solves No-Difference, it solves Near-Threshold. Keeping it separate adds complexity without new leverage. |
  | **Exit Costs / Lock-In** | **Keep (Core)** | **Requirement: Voluntariness Threshold.** The theory must define when "exit" is too costly for participation to count as voluntary. (e.g., "Don't eat out" is not a valid exit for tipping). |
  | **Enforcement Asymmetry** | **Keep (Core)** | **Requirement: Decoupled Standing.** The wrongness of the act and the permission to blame must be separable variables. (e.g., It may be wrong to cut, but only the person behind you can complain, not the whole crowd). This is critical for Job 2. |
  | **Day-One Case** | **Reframe** | **Requirement: Common Knowledge Threshold.** "Day-One" is about when a habit becomes a norm. The requirement is: The theory must identify the moment a regularity becomes *common knowledge* such that expectations are legitimate. |
  | **Add: The Free-Rider** | **Add** | **Requirement: Non-Excludable Benefit.** If I benefit from the convention (a short queue) without joining it, does the theory classify this as theft? This tests the Fair-Play mechanism. |

  ---

  ### 3. Distinctions: Load-Bearing vs. Cosmetic
  You asked to mark which distinctions do the heavy lifting.

  *   **Arbitrary-but-binding vs. Binding-because-beneficial:** **LOAD-BEARING.** If the theory explains the obligation *only* by the benefit (e.g., "tip because waiters need money"), it is a consequentialist theory, not a theory of *convention*. A convention theory must explain why *this* arbitrary signal (20%) binds rather than *that* one (15%).
  *   **Obligation to Follow vs. Licence to Enforce:** **LOAD-BEARING.** This maps directly to Job 1 vs. Job 2. Most theories conflate them. Keeping them separate is the only way to solve the Enforcement Asymmetry case.
  *   **Strangers vs. Reliers:** **LOAD-BEARING.** Obligations to specific reliers (the waiter who poured your coffee) are stronger than obligations to the abstract practice. A theory that cannot distinguish these will fail the Visitor case.
  *   **First-Personal vs. Third-Personal Reasons:** **COSMETIC / OPERATIONAL.** You are right to suspect this. While Job 1 requires first-personal accessibility, this is a feature of implementation, not the metaphysical ground of the obligation. However, if a theory requires knowledge the agent *cannot* have (e.g., total utility calculus), it fails Job 1 practically.

  ---

  ### 4. The Trade-Offs: Impossible Trios and Killer Constraints

  You guessed that `{No-Difference, Announced Non-Participant, Unjust Practice}` is the unstable trio. I disagree. That trio is manageable.
  The real tension lies in **Voluntarism vs. Normative Force vs. Enforcement.**

  #### The Impossible Trio
  I suspect the following three desiderata are jointly unsatisfiable for any single theory:
  1.  **Strict Voluntarism:** Obligation arises *only* from consent or voluntary participation (satisfies *Announced Non-Participant*).
  2.  **Robust Stranger Enforcement:** Strangers have standing to reproach violators (satisfies *Enforcement Asymmetry/Job 2*).
  3.  **Non-Instrumental Bindingness:** The rule binds even when my violation causes no harm (satisfies *No-Difference*).

  **Why?**
  *   If it's strictly voluntary (1), strangers lack the standing to enforce it (2) because you didn't contract with *them*.
  *   If strangers can enforce it (2), it implies a communal bond that overrides individual opt-outs, violating (1).
  *   If it binds without harm (3), it looks coercive, which strains (1).

  **What has to give?**
  *   **Give up Strict Voluntarism.** (The Joint-Commitment view does this). You are bound by the "we," not just your "I."
  *   **Give up Robust Stranger Enforcement.** (The Consent view does this). Only those directly harmed can complain.
  *   **Give up Non-Instrumental Bindingness.** (The Consequentialist view does this). If no harm, no foul.

  #### The Killer Constraint
  **The No-Difference Case + Job 2 (Enforcement).**
  This combination excludes the most popular accounts.
  *   **Consequentialism/Reliance:** Fails No-Difference. (If my tip changes nothing, I owe nothing).
  *   **Consent/Fair-Play:** Fails Job 2. (If I didn't consent, why can *you* shame me? If I benefited but didn't ask to, is shaming proportionate?).
  *   **Debunking:** Fails Job 1. (Says nothing is owed).

  **The Best-Surviving-Subset Theory:**
  A **Joint-Commitment / Plural Subject** theory (e.g., Margaret Gilbert).
  *   *Why:* It posits that by entering the space, you join a "we." This explains Non-Instrumental Bindingness (you owe the "we"). It explains Enforcement (the "we" polices itself).
  *   *Cost:* It struggles with *Unjust Conventions* (does joining a "we" to segregate bind you?) and *Exit Costs* (when is leaving the "we" impossible?).

  ---

  ### 5. Scorecard of Contenders
  *Scale: Pass (P), Fail (F), Strained (S)*

  | Theory | No-Difference (Non-Instrumental) | Announced Non-Participant (Opt-Out) | Enforcement (Stranger Standing) | Unjust Practice (Reform) | Exit Costs (Voluntariness) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Coordination / Equilibrium** (Lewis/Sugden) | **F.** Binds only because it solves a coordination problem. If you don't break it, you don't owe. | **P.** If you signal you aren't playing, equilibrium doesn't form. | **F.** No moral standing to enforce, only prudential expectation. | **S.** Treats unjust norms as stable equilibria. Hard to condemn. | **P.** Focuses on strategies, not moral lock-in. |
  | **Reliance / Expected-Benefit** (Consequentialist) | **F.** If no marginal consequence, no obligation. | **P.** If they know you won't pay, they don't rely. | **S.** Only those who relied can enforce. Strangers cannot. | **F.** If the practice causes net harm, obligation vanishes immediately. | **S.** Ignores psychological lock-in; focuses on actual benefit. |
  | **Consent / Fair-Play** (Rawlsian) | **S.** Binds because you "took the benefit." But if benefit is null, obligation weakens. | **F.** Hard to square with "I didn't consent." Fair play says you can't opt-out of public goods. | **S.** Only beneficiaries can enforce. Stranger standing is unclear. | **P.** Unjust practices confer no "benefit," so no obligation. | **F.** Struggles when exit is costly ("You could have left"). |
  | **Joint-Commitment** (Gilbert) | **P.** You owe the "group" regardless of outcome. | **F.** Hard to opt-out of a standing "we" once entered. | **P.** The "we" has standing to rebuke members. | **F.** Risks legitimizing unjust "we"s (e.g., segregationist norms). | **S.** Exit requires mutual release, which may be withheld. |
  | **Expressive / Attitude** (Anderson) | **P.** Violation expresses disrespect, regardless of outcome. | **S.** Announcement might change the *meaning* of the act, but not always. | **P.** Community defends its shared values. | **P.** Can express dissent *through* non-compliance. | **S.** Focuses on meaning, not economic lock-in. |
  | **Debunking / Prudential** (Mackie-ish) | **P.** Correctly says "No obligation." | **P.** Correctly says "Do what you want." | **F.** Denies moral standing to enforce (only prudence). | **P.** Correctly identifies unjust practices as non-binding. | **P.** Reduces all to cost-benefit analysis. |

  ### Summary Recommendation
  If you need **Job 2 (Enforcement)** to work, **Consequentialism** and **Debunking** are dead.
  If you need **Announced Non-Participant** to work sometimes, **Joint-Commitment** is too rigid.
  If you need **No-Difference** to bind, **Reliance** is dead.

  **The Winner:** A hybrid of **Fair-Play** (for the benefit received) and **Expressive** (for the social meaning).
  *   *Why:* It handles the No-Difference case (it's about respect, not utility). It handles Enforcement (you violated our shared terms). It handles Unjust Practices (unjust terms generate no duty of fair play).
  *   *The Fix:* You must modify Fair-Play to allow for **Non-Voluntary Benefits**. (i.e., You benefit from the queue even if you didn't ask to). This solves the Visitor case. You must modify Expressive theory to allow **Contextual Meaning**. (i.e., Not tipping *means* theft here, but *means* sanity there). This solves the Jurisdiction case.
